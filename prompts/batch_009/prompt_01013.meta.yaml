  Now I want to work through Fitch''s paradox of knowability. The paradox demonstrates
  that the knowability thesis—that every truth is in principle knowable—entails, absurdly,
  that every truth is actually known. The proof works by diagonalization: assuming
  the knowability principle, consider a truth of the form "p is true and unknown"—if
  this itself were knowable, then knowing it would generate a contradiction, since
  knowing that p is unknown while also knowing p makes the unknown-ness false.


  I''m noting the common confusions surrounding this result: people often misread
  it as a proof that unknowable truths exist in some grand metaphysical sense, or
  as vindicating skepticism or divine omniscience, when really it''s a targeted challenge
  to a specific anti-realist commitment (the claim that all truths are knowable).
  Realists, who never accepted the knowability thesis to begin with, aren''t threatened
  by it at all.


  The paradox also isn''t about complexity making some truths practically unknowable
  - it''s a purely formal result that holds even for trivial propositions. And the
  standard responses aren''t simple patches to classical logic; they usually target
  the factivity of knowledge combined with closure principles, or restrict the knowability
  thesis itself, as in Tennant''s Cartesian restriction strategy that excludes propositions
  referencing their own unknowability.


