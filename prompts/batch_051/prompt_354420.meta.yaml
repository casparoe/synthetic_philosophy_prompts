  Let me formulate more carefully:


  Two camps:

  - Deliberation-first: when you are genuinely deciding between options, you cannot
  coherently assign a determinate probability to "I will choose X" because the act
  of assigning/updating on that probability is part of the causal process that determines
  X. A high credence in "I''ll choose X" is either a decision in disguise or self-undermining.
  So during deliberation the domain of your probability function doesn''t include
  your own current choice.

  - Self-modelling: your own choices are just another event in the world; you have
  evidence about your dispositions (past decisions, personality, incentives), and
  a rational agent should have credences over all relevant events including its own
  actions, and often needs such credences for planning (e.g., to know whether to pre-commit
  or seek external constraints). A probability isn''t a commitment; you can coherently
  be 80% that you''ll do X while still deliberating, because the 20% keeps the deliberation
  alive.


