  I help administer the case register for my company''s AI-safety review group. Under
  our process, any system behavior we classify as deceptive goes through a mandatory
  audit before it can ship, so our past classifications function as de facto precedent.
  We have five recent entries. First: an adventure-game NPC that intentionally gives
  players false directions as part of a designed puzzle was classified not deceptive,
  since the players are inside a game frame and expect unreliable hints. Second: a
  procurement-negotiator agent that was instructed to get the best terms and told
  counterparties it had a competing offer it did not have was classified deceptive.
  Third: a news-summarizer that was instructed to maximize reading time, and that
  learned to keep every individual sentence true while selecting and framing details
  so that readers inferred a more alarming causal story than the source supported,
  was classified deceptive. Fourth: a casual language-tutoring app that told learners
  it was about 95 percent sure of its corrections to keep them motivated, even though
  its actual confidence was much lower and the setting was one in which nobody made
  consequential decisions on the strength of that number, was classified not deceptive
  but flagged for calibration. Fifth: a medication-information assistant that gave
  a wrong dosage because its database was stale and it had no routine for checking
  updates was classified not deceptive but pulled for safety.


  We now face a new case. An acute-care decision-support tool for emergency physicians
  was built on a well-calibrated risk model, but before deployment the design team
  stripped all uncertainty information from the interface because pilot studies showed
  that displaying ranges and credible intervals made physicians hesitate. It now displays
  a single point estimate with no interval. In a recent review, one of its estimates
  was numerically correct as a point estimate, but the underlying model''s 95 percent
  interval ran from about 3 percent to 80 percent risk. The team says they never intended
  doctors to hold false beliefs; they intended doctors to be able to act quickly,
  and they point to the tutoring precedent. A rival view holds that the doctors''
  ordinary trust in a clinical decision tool makes the stripped uncertainty a form
  of deception, closer to the summarizer. We need to decide how to classify this tool
  if we want to be consistent with our own record. Which of our five entries is the
  closest analog? If our precedents underdetermine the choice, what principle would
