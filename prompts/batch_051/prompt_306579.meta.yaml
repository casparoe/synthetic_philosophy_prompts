  Prompt draft:


  "I''m a PhD student working on training/evaluating LLM reasoning, and I keep tripping
  over the process vs outcome supervision distinction. In our lab we''ve been using
  something like this checklist for when a superivsion signal counts as genuinely
  process-based: (1) the reward or critique attaches to an intermediate step rather
  than to the final answer alone; (2) the signal reflects properties of that step
  itself — whether it''s valid, relevant, etc. — not merely whether the step happened
  to precede a correct answer; (3) the model could, in principle, improve on the same
  step even if the final answer were later corrupted or cut off; (4) the signal doesn''t
  secretly encode the final answer. We''ve been arguing about a setup from a neighboring
  group: they fine-tune a math model on step-by-step solutions and give it line-by-line
  feedback, but the ''line-by-line'' critiques are generated after the fact by a verifier
  that knows the final answer — it labels each step as good if the step remains in
  paths that reach the correct answer, and bad otherwise. On my checklist, this hits
  (1) but seems to fail (2) and (4), and (3) is unclear because the labels wouldn''t
  be stable if you truncated the solution. But the model really does learn intermediate
  heuristics from it, not just to output the final number. So my question: does this
  setup qualify as process supervision under the four criteria? Go through them honestly
  and tell me whether the criteria are drawing the line in the right place, or whether
  ''process supervision'' should be defined by what the learner can acquire rather
  than what the signal encodes."


