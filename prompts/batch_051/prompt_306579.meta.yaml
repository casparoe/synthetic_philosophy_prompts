  I''m a PhD student in ML, mostly thinking about reward design and how to train LLMs
  to reason reliably, and I keep having the same argument with my advisor about the
  process vs outcome supervision distinction. Our lab''s working definition: I count
  a training signal as genuinely process-based when (i) it attaches to intermediate
  steps rather than only to the final output, (ii) it says something about the step
  itself—its validity, relevance, usefulness—rather than just about whether the step
  happened to lead to a correct answer, (iii) it wouldn''t be redundant once you already
  knew the final answer, and (iv) it stays roughly the same under counterfactual endings
  (a valid step is still scored as valid even if a later typo ruins the solution).
  In other words, the signal has to grade the step, not just grade the step''s consequences.


