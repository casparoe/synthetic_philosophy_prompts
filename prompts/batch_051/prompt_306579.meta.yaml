  model with dense per-step rewards, but the reward for each step is computed by Monte
  Carlo rollout. For a given step, they sample a few hundred continuations and take
  the fraction that eventually reaches the correct final answer as the step''s score,
  then use the difference between consecutive step scores as an advantage signal.
  So the model gets a number attached to each intermediate step, and it really does
