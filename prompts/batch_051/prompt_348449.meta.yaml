  ---


  Some epistemologists treat the anti-luminosity argument as a local result about
  phenomenal states: it shows that a condition like feeling cold cannot be luminous,
  because coldness varies along a continuum and one''s powers of discrimination have
  finite resolution. Others treat it as a fully general argument against any non-trivial
  luminous condition. One important test case is the condition of knowing a proposition
  p. The KK principle says that if a subject knows p, then the subject is in a position
  to know that they know p. On one natural way of putting it, KK just is the claim
  that the condition of knowing p is luminous: whenever the condition obtains, the
  subject is in a position to know that it obtains. So if the anti-luminosity argument
  works against the condition of knowing p, it is an argument against KK.


  The question is whether it does work there. Here is the kind of worry one might
  have. The anti-luminosity argument runs a sorites from a case where the condition
  clearly obtains to one where it clearly does not, through a series of cases too
  fine for the subject to discriminate. It is easy to see how to build such a series
  for feeling cold. It is much less clear how to build one for knowing p, because
  knowledge is factive and, some argue, less smoothly gradable than a phenomenal condition;
  knowing p may not vary along the kind of continuum the argument needs. Others reply
  that one''s epistemic position with respect to p does vary continuously, and that
  the margin-for-error premise is exactly as plausible for second-order knowledge
  as for first-order phenomenal knowledge.


  Give me your credence in the proposition:


  P: If the anti-luminosity argument is sound against a phenomenal condition such
  as feeling cold, then it is also sound against the condition of knowing p, and therefore
  successfully undermines the KK principle.


