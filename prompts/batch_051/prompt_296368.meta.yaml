  Let''s think about the step-by-step argument content for PI/Bertrand:


  Context: Bertrand''s paradox. Three methods give probabilities 1/2, 1/3, 1/4 for
  a random chord being longer than the side of the inscribed equilateral triangle.


  SWE''s argument (as an attempt to show where PI goes wrong):


  (1) Pick a chord at random, with no further specification. Since nothing favors
  any chord over another, each chord is as likely as any other; that''s just the principle
  of indifference.

  (2) But "pick a chord at random" can be made precise in more than one way that all
  seem to honor the principle of indifference: choose two endpoints on the circumference
  independently with uniform distribution; choose the chord''s midpoint uniformly
  over the disc; choose one endpoint and an angle, etc.

  (3) If "equally likely" is well-defined before we choose among these procedures,
  then all these procedures must assign the same probability to the event "the chord
  is longer than the side of the inscribed equilateral triangle."

  (4) The first procedure gives 1/3; the midpoint procedure gives 1/4; so they differ.

  (5) Therefore the probability in (3) is not well-defined, and the principle of indifference
  cannot be the whole story about probabilities in cases like this.


  Is this valid? The asker might think step (1) is suspect. The argument is actually
  valid as a reductio of unrestricted PI. But note step (3) might be the weak point
  because the principle of indifference doesn''t entail that any two natural parameterizations
  agree; naturalness is not a formal property. Yet the argument as a reductio is fine:
  if PI applied to "chords" simpliciter, there would be a unique answer. Since methods
  differ, PI cannot directly apply without a privileged partition.


