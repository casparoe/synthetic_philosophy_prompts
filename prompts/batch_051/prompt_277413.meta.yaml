  a shared schema/interface where each person''s extended preferences over "being
  person i in state x" are comparable; this is like defining a common type with a
  constructor that embeds each private type, and imposing a policy/contract that all
  agents'' preferences are serializable into it. But the fudge: the philosopher isn''t
  claiming we can actually introspect other minds; they''re claiming a moral/decision-theoretic
  requirement to posit such embeddings, which has no programming counterpart, because
  in programming you don''t posit access you lack.

