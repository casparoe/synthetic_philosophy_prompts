  \ who fight an unjust war do wrong and their killing is unjust\n- The independence\
  \ of jus in bello from jus ad bellum\n- The view that ordinary citizens bear moral\
  \ responsibility... etc.\n\nI could write the asker as someone writing up their\
  \ views for a seminar, listing commitments including some case verdicts. The \"\
  in the weeds\" quality comes from specific commitments like \"I think the unequal-burden\
  \ objection to asymmetry views fails\" etc. But need to be careful not to signal\
  \ which they'd give up.\n\nLet me design a belief set for the moral equality of\
  \ combatants prompt, type A.\n\nPossible commitments:\n1. Walzer-style: the rules\
  \ of war (jus in bello) are independent of the justice of the war (jus ad bellum);\
  \ combatants are morally equal regardless of which side they fight for.\n2. Combatants\
