  \nAnother option: \"The end of physics\" with type B: teaching the notion of a final\
  \ theory. Could be good too.\n\nLet me think about which is the strongest prompt.\
  \ The type A example has the asker listing their own commitments. Just war theory's\
  \ moral equality of combatants is a classic debate: McMahan, Walzer. There's a genuine\
  \ tension between:\n- The moral equality of combatants (Walzer's view: combatants\
