  Strategy stealing argument for Hex:

  - Hex is a two-player, perfect-information, no-draw game played on a rhombus board;
  players alternately place stones of their colour; first to connect opposite sides
  wins.

  - Claim: first player has a winning strategy.

  - Proof: Suppose second player had a winning strategy. First player makes an arbitrary
  first move, then pretends to be the second player following that strategy after
  first makes any extra move when the strategy calls for the occupied cell. Since
  an extra stone of your own colour never hurts you in Hex (monotonicity), the strategy
  still works for the first player. Contradiction with both players having winning
  strategies (or with second having one). Hence second player does not have a winning
  strategy; since Hex cannot draw, first player must have a winning strategy.


  The assumption: "an extra stone never hurts" is monotonicity. In Hex, true. In chess,
  extra material generally helps but extra move can hurt (zugzwang: having to move
  can be bad). The "strategy-stealing assumption" is that an extra move/piece cannot
  be harmful.


