  that the golden rule is not a reliable test for individual, one-off actions directed
  at named people; it is a test for the default arrangement that will apply across
  people whose positions and preferences differ. The test has two parts. First, before
  setting any default rule or policy, ask whether you could accept it if you did not
  know which position you would occupy among those it affects — not as a thought experiment
  about reasonableness, but as a concrete question about what a randomly assigned
  member could reasonably object to. Second, once the default is set, any deviation
  from it in a particular case must be one that the person in the least-advantaged
  affected position could reasonably accept.


