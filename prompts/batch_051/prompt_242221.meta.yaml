  I''m preparing a short piece for a film-and-philosophy group on how selves might
  outlive the people who have them, and I want to think through Pixar''s Coco with
  Douglas Hofstadter''s account of the self as a pattern that persists in other minds.
  Hofstadter''s view, developed at length in I Am a Strange Loop, is that a self is
  not a soul-like substance but a pattern — a strange loop of self-referential thought
  — and that partial, lower-resolution copies of a person''s pattern run in the brains
  of those who knew them closely. On this view, when someone dies, something of them
  genuinely continues in the habits of attention, turns of phrase, remembered arguments,
  and felt presence that remain active in the people who loved them; the continuation
  is graded and partial, not all-or-nothing, and it has no threshold or supernatural
  machinery.


  Coco gives this a literal, supernatural staging. In the film, the dead survive in
  the Land of the Dead only so long as someone in the living world remembers them
  and keeps their photograph on an ofrenda; when the last living person who remembers
  them forgets, they suffer a final death. Héctor, the protagonist''s great-great-grandfather,
  is on the verge of that final death because his daughter Coco — now an old woman
  losing her memory — is the only one still holding him in mind.


  I''d like a committed critical reading, not a survey. Please argue for a definite
  position on where the film genuinely dramatizes Hofstadter''s thesis, where it departs
