  but I think ordinary practice does treat the two differently — we count "all observed
  emeralds are green and green now" as support for "next emerald will be green," but
  not "all observed emeralds are grue" for "next emerald will be grue." Is there anything
  that justifies that asymmetry (entrenchment, natural kinds, simplicity, laws), or
  should we drop it?


