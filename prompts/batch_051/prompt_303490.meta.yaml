  the asymmetry is this. in Fact, Fiction, and Forecast, Goodman defines grue roughly
  like this: an object is grue if it is examined before some future time t and is
  green, or if it is not examined before t and is blue. then he notes that all our
  evidence — all the emeralds we''ve examined so far have been green — confirms both
  the hypothesis that all emeralds are green and the hypothesis that all emeralds
  are grue, to exactly the same degree. but no sane person would predict that an emerald
  first examined after t will be grue, i.e. blue. we treat the green hypothesis as
  projectible and the grue one as defective or gerrymandered. my friend kept saying
  that asymmetry is real and needs explaining: ''green'' tracks a genuine kind and
  ''grue'' is a trick of language. i said that''s just metaphysics by vibes: from
  the data alone, the two predicates are on a par, so treating them differently is
  a kind of prejudice. he then asked me whether i''d be willing to actually bet on
  a post-t emerald being blue at even odds, and i couldn''t honestly say yes.


  so here''s what i want from you. is there any defensible justification for the asymmetry,
  or is it just a fact about our training, language, or psychology that we''re dressing
  up as a rule? give me the strongest case you can for thinking green is genuinely
