  Summary example (popular article): "Libet''s experiments measured the electrical
  activity in the brain as people decided when to flex their wrist, while they watched
  a clock. Subjects reported the moment they became aware of wanting to move, and
  Libet found that the readiness potential (RP), a buildup of brain activity in the
  motor areas, began around 550 ms before the movement but about 350 ms before the
  reported time of conscious intention. That means the brain had already started preparing
  the movement before the subject consciously decided to make it. Libet therefore
  concluded that the conscious ''decision'' is just a retrospective story the brain
  tells itself after the real causal work is already done, and that free will, at
  least in the sense of a conscious will that initiates action, is an illusion. Later
  replications and the 2008 study by Soon et al. using fMRI found that researchers
  could predict a subject''s choice between left and right button presses several
  seconds before the conscious choice, which is even stronger evidence that decisions
  are made by nonconscious brain processes before any conscious awareness."


  Now subtle issues:

  - Libet did NOT conclude free will is an illusion; he proposed the "free won''t"
  veto: consciousness has ~100-150ms to veto. So "Libet therefore concluded... free
  will... is an illusion" is a misrepresentation.

  - The readiness potential is not the decision; it''s preparation, stochastic, may
  not commit.

  - The clock method and subjective timing could be off; the "350 ms before intention"
  relies on introspection timing judgments.

  - Soon et al. 2008: decoding accuracy ~60% (above chance but weak), and the "choice"
  is arbitrary; doesn''t show motor action inevitable; the prediction is not determinative.

  - "later replications" — mixed; Schurger et al. 2012 showed RP could be artifact
  of threshold (stochastic accumulation).


