  Let me draft commitments:


  "Here''s roughly where I''ve landed on decision-making and whether values can be
  compared. I''d like to know if this set of views is consistent, and if not, which
  ones are pulling against each other.

  (1) For most practical choices, it''s fine to put things on a common scale — time,
  money, or something like ''expected user value'' — and just optimize.

  (2) But I also think some choices are genuinely hard in a way that''s not just ''I
  don''t have enough information yet.'' Like choosing between two good job offers
  that pull in different directions, or whether to spend your career on safety vs.
  capability. With full information, I still don''t think there''s a single correct
  option.

  (3) I''m committed to expected value reasoning under uncertainty. I think the right
  move in a bet is to weigh outcomes by probability and size of the good.

  (4) I think there are pairs of goods that don''t have a fixed exchange rate: e.g.,
  a certain amount of user privacy vs. a certain amount of security, or developer
  autonomy vs. system reliability. You can''t just say ''10 units of privacy = 1 unit
  of security'' as a fact about them, only as a policy choice.

  (5) At work I''m comfortable saying we should pick a common metric anyway so a team
  can actually make a call, even when the metric is somewhat arbitrary.

  (6) I think ''hard choices'' produce real commitments: if you choose to join a startup
  rather than keep a stable job, you''re deciding what kind of engineer/person to
  be, not just maximizing expected value along some preexisting scale.

  (7) I also think no one is irrational for making different trade-offs in those hard
  cases — it''s not like one of them miscalculated.


