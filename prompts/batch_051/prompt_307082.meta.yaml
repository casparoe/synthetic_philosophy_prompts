  Prompt text draft:


  ---


  I teach an upper-level undergraduate course in philosophy and I am setting a final-exam
  essay question on the Epicurean argument that death is not bad for the person who
  dies. I want a question that cannot be answered by reciting the standard contrast
  between Epicureanism and the deprivation account, and that instead forces students
  to work on the temporal structure of harm.


  Build the exam question around the following reconstruction, which you may number
  and use in the question but should not distort:


  (1) Something can be bad for a person only if there is some time at which it is
  bad for that person.

  (2) For something to be bad for a person at a time, that person must exist at that
  time and be in a bad condition at that time.

  (3) At every time before death, the person has not yet died; at every time after
  death, the person no longer exists.

  Therefore, death is never bad for the one who dies.


  The exam question should direct students to do three things:

  (i) identify which premise the deprivation account rejects, and explain why rejecting
  that premise is a substantive thesis about the nature of harm rather than a refusal
  to engage;

  (ii) present the strongest Epicurean objection to that rejection — the demand that
  the deprivation theorist locate the harm in time — and give the best reply available
  to the deprivation theorist;

  (iii) reach a verdict on whether the Epicurean argument''s central insight, that
  nothing can be bad for you unless there is a time at which you are around to have
  it, survives the deprivation account intact, or is merely weakened, or is refuted.


  Then provide:

  (a) a model answer of no more than 500 words that would receive full marks; and

  (b) a marking scheme for 20 marks that names the specific claims an A answer must
  make under each of (i)–(iii), the marks each is worth, and the identifiable mistakes
  that separate a B answer from an A answer.


