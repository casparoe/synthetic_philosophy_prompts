  My idea: the whole puzzle only works if you treat ''a stone too heavy for God to
  lift'' as picking out a stable object/specification across the two steps. I say
  ability claims are ''indexed'': ''x can lift y'' doesn''t just ascribe an intrinsic
  property, it pins the object y to a scale relative to x''s power. So ''too heavy
  for God to lift'' has to be completed relative to some level of lifting power, and
