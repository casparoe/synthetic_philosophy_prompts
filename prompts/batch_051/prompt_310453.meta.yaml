  Let me think about the subtlety of the butterfly effect/sensitive dependence:


  - SDIC: for chaotic systems, infinitesimal differences in initial conditions grow
  exponentially with a positive Lyapunov exponent, so that after finite time the microstate
  diverges. This is a mathematical property of deterministic models.

  - Practical unpredictability: because initial conditions can never be known with
  infinite precision, and because model truncation error is nonzero, deterministic
  forecasts have a limited horizon. This isn''t the same as randomness.

  - The two-week horizon applies to instantaneous weather (synoptic) in mid-latitudes;
  some variables are predictable longer (seasonal averages, ENSO).

  - Climate prediction: external forcing changes boundary conditions, and we predict
  statistics of the attractor, not trajectories. A chaotic system can have stable
  invariant measures that shift predictably with forcing. "Chaotic" doesn''t mean
  "insensitive to forcing" nor "no statistical regularities."

  - The butterfly slogan sometimes expresses the stronger claim that no aggregate
  or distributional forecast is possible, or that any small disturbance has comparable
  scale effects on macroscopic averages — that''s not warranted.

  - Sometimes it''s also used to suggest indeterminism (quantum-level?) — but deterministic
  chaos is compatible with determinism; the unpredictability is epistemic, not ontic.
  A reading could be "the system is indeterministic" — that would be false as a reading
  of deterministic chaos but might be true-ish about real atmosphere given quantum
  effects? But not the point.

  - Also the "butterfly" specifically means the flap could be the tipping difference;
  in a chaotic system any tiny perturbation would do. It''s not that any butterfly
  will cause a tornado; it''s that differences in initial conditions grow to large
  divergence, so one can''t assign the tornado to the butterfly in a counterfactual
  sense straightforwardly — actually in a deterministic system, one could say had
  the butterfly not flapped, that specific tornado would not have occurred; but "cause"
  has counterfactual dependence? There''s nuance: butterfly is just one of many perturbations;
  the attractor makes counterfactual causal attribution unstable.


