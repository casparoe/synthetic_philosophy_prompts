  Key ideas:

  - Classical particles of the same kind are weakly discernible by trajectories/spatiotemporal
  positions, at least in principle. In classical statistical mechanics, permuting
  two particles is a real difference (Maxwell-Boltzmann counting), though there''s
  Gibbs paradox.

  - In quantum mechanics, particles of the same type (e.g., two electrons) are genuinely
  indiscernible: the state must be symmetric (bosons) or antisymmetric (fermions)
  under exchange; exchanging labels does not change the physical state. No "which
  is which."

  - The Principle of Identity of Indiscernibles (PII): if two things share all properties
  (qualitative), they are identical (no numerical distinctness without qualitative
  difference). Quantum particles seem to violate PII if they are objects: two electrons
  can occupy an antisymmetrized state with all intrinsic properties shared and no
  trajectory to tell them apart.

  - But some philosophers (Saunders, Muller) say quantum particles are "weakly discernible"
  via irreflexive relations like "has opposite spin component" in an antisymmetric
  singlet state. E.g., in the singlet state of two electrons, the relation "has opposite
  z-spin to" is irreflexive and symmetric, allowing weak discernibility. So PII can
  be preserved in a weakened form.

  - Haecceities: primitive thisness. You might keep individual particles by positing
  haecceities (non-qualitative identities), but quantum statistics then seems to require
  that permuting haecceities has no physical effect, which makes haecceities physically
  inert or dubious.

  - Field excitation view: particles as excitations of quantum fields; there''s no
  individual object, just modes of a field. This deflates the problem.

  - Entanglement and labels: even though labels are arbitrary, we can say "electron
  A and electron B are in the state with opposite spins" — the relation is real, but
  the monikers A/B are arbitrary.


