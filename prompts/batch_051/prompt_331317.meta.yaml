  Draft:


  "You''re an experienced philosophy-of-biology interviewer helping me prep for an
  episode. My guest is a philosopher who defends a modernized version of the gene''s-eye
  view of evolution — the replicator/vehicle picture associated with Dawkins and George
  Williams, but updated to survive the last forty years of criticism. She''s sharp,
  and she has stock replies for every objection. I need eight to ten interview questions
  that won''t let her hide in them. Think carefully and brainstorm the likely replies
  before you finalize each question.


  Please cover at least the following, each with a follow-up keyed to what she''s
  most likely to say:


  1. The ''selfish gene'' metaphor. She''ll say it was never a claim about agency,
  just about which level''s fitness is tracked in accounting. Ask her what it would
  take for the metaphor to stop being innocent — that is, when does a bookkeeping
  choice become a causal claim, and how would we catch it doing so?

  2. The levels-of-selection worry. Her standard line is that gene-level accounts
  and multilevel selection accounts are intertranslatable, so the gene''s eye view
  is just the cleaner one. Press on whether intertranslatability at equilibrium is
  enough when the causal process — who actually competes, groups or organisms or genes
  — could go a different way, and what observation would privilege one description
  over the other.

  3. The averaging objection: critics say taking the gene as the unit averages over
  contexts in a way that can misrepresent selection''s causal structure (e.g., when
  a trait is favored in groups but disfavored within them). Ask what makes gene-level
  fitness more than a weighted average, and whether the gene''s-eye view can state
  when averaging is legitimate.

  4. Intragenomic conflict. If an organism is a coalition of genes whose interests
  overlap but don''t coincide (meiotic drive, uniparental expression), does the gene''s-eye
  view explain the organism as a negotiated truce, or does it presuppose the very
  thing — a bounded, coherent organism — that needs explaining? Follow up on what
  a ''parliament of genes'' predicts that a purely organism-level view wouldn''t.

  5. Plasticity and niche construction. The obvious reply is that norms of reaction
