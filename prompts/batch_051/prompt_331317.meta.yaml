  exclusionary junk, and the principle seems to hand a permanent veto to whoever benefits
  from them. Take a club with a century-old rule barring women from full membership:
  nobody can say what purpose it now serves, and the original reason (when you dig
  it up) is an empirical belief we now know is false. My intuition insists the burden
  is on the people who want to keep it, not on the people hurt by it; making me first
  prove I understand every load-bearing function feels like status quo bias dressed
  up as epistemic humility. I don''t just think this about one case — I think it generalizes
  to a whole class of bad institutions whose original rationale is lost, discredited,
