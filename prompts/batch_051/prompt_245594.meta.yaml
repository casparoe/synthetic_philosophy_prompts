  Let me define the concept space: Testimonial injustice (Fricker): a speaker receives
  a credibility deficit owing to identity prejudice on the hearer''s part, wronging
  them in their capacity as a knower. Hermeneutical injustice: a gap in collective
  interpretive resources puts someone at an unfair disadvantage in making sense of
  their experience.


  Candidate rules that could fit verdicts:

  R1 (Fricker classic): testimonial injustice iff (a) hearer''s prejudice causes credibility
  deficit, (b) speaker suffers a wrong as a knower. The deficit must be prejudicial,
  not merely mistaken.

  R2 (broader): any credibility deficit caused by a mistaken, non-evidential factor
  about social identity counts — whether or not it''s "prejudice" (e.g., accent heuristic).

  R3 (harm-based): any credibility distribution that systematically harms members
  of a group, even if the hearer''s reasoning is statistical and arguably evidential
  (e.g., profiling with some statistical basis).

  R4 (hermeneutical): the speaker''s inability to articulate an experience due to
  missing shared concepts is a distinct kind.


