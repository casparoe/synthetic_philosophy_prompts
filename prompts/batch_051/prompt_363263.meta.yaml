  Consider the following asymmetry in ordinary moral judgment. A father who kills
  his child because a private voice told him to do it is regarded as either mad or
  monstrous; the privacy of the command — the fact that no one else can hear it, that
  no shared reason covers the act — makes the deed more horrifying to us, not less.
  Yet the same culture that finds this obvious also venerates Abraham, who bound his
  son at God''s command and was prepared to complete the killing; on Kierkegaard''s
  reading in Fear and Trembling, it is precisely the privacy and unintelligibility
  of Abraham''s relation to God — the absence of any ethical justification others
  could grasp — that makes him the knight of faith rather than a common criminal.
  The two verdicts diverge on the very feature that ordinarily does the work: a lethal
  act against one''s own child on the strength of a communication no one else can
  share.


  One obvious reply is that Abraham''s command was real and the madman''s was not.
  But the difference between them is not visible from inside the agent''s position
  at the moment of decision; Abraham himself had only the same kind of private assurance
  the madman has. So I want to know whether the asymmetry between our two judgments
  can survive that point. What is the strongest candidate principle that justifies
  treating Abraham''s case as the paradigm of faith while treating the private-voice
