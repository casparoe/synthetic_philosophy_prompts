  Buchak''s risk-weighted expected utility (REU) representation:

  For a gamble with states ordered by utility from worst (x1) to best (xn), with probabilities
  p1...pn:

  REU(g) = u(x1) + r(p2+...+pn)[u(x2)-u(x1)] + r(p3+...+pn)[u(x3)-u(x2)] + ... + r(pn)[u(xn)-u(x_{n-1})].

