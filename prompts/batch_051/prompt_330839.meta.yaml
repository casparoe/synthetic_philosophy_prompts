  Strong longtermism actual claims:

  - "Weak longtermism": the way our actions affect the long-run future is a key feature
  for evaluating them (maybe not essential?).

  - "Strong longtermism": for the purpose of evaluating our actions, the expected
  value of their consequences, the most important determinant is their effects on
  the long-run future (Greaves & MacAskill 2019: "strong longtermism is the view that,
  in a wide class of decision situations, the option that is best is the one that''s
  best in expectation in terms of the far future" roughly).

  - It''s an axiological claim about what makes options better, or a claim about expected
  choiceworthiness; not directly "only x-risk matters." The move to x-risk requires
  empirical premises: existential risk reduction is one of the most tractable ways
  to influence long-run trajectory; there may be other lever arms.

  - The argument doesn''t count only extinction; trajectory changes (AI alignment
  quality, values lock-in) are core. So the summary''s substitution of "extinction
  risk" as "the only priority" is a subtle misrepresentation—strong longtermism itself
  is neutral between extinction risk and other longtermist interventions; the further
  prioritization of x-risk is a separate empirical/strategic claim.


  Other error: "if we count every person''s welfare equally" — the argument needs
  a neutral or impartial population ethics; but this is roughly true in popular gloss.
  The error might be: it says since the main way our actions affect future is through
  whether humanity survives — but actually many near-term actions have persistent
  effects (institutional choices, value changes) that don''t go through extinction.
  Also extinction is not the only long-run effect; "or otherwise locking in a good
  long-term trajectory" partially corrects.


