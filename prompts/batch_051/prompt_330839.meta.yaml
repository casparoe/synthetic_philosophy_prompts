  Let me design the summary carefully.


  Strong longtermism (Greaves & MacAskill): roughly, the view that in many (important)
  decision situations the best thing to do is determined primarily by expected effects
  on the long-run future, rather than near-term effects. Or the axiological thesis:
  for the purposes of evaluating actions, the sign and magnitude of expected value
  is largely determined by consequences for the far future.


  Common gloss errors to plant:

  1. Conflating strong longtermism with "existential risk is the only priority." Strong
  longtermism doesn''t by itself single out extinction risk; other long-run effects
  (trajectory changes, values lock-in, s-risks, growth) can matter. But the view is
  often motivation for x-risk focus. The summary should overstate this: "the only
  cause worth funding."

  2. Conflating "the future contains vastly more people" (empirical/population claim)
  with the normative claim, ignoring that the argument needs a claim about how much
  we can affect the far future and about impartiality/neutrality. Also present the
  "astronomical waste" argument as a decision procedure.

  3. Presenting a standard objection (we are clueless about long-run effects) as if
  it refutes the view, or the summary says "the math settles it."

  4. Misstating the thesis as "the best actions are those that maximize total expected
  future well-being" — that''s a criterion of rightness, not what strong longtermism
  says (it''s about expected value being dominated by far-future effects; axiology
  vs decision-theory distinction).

  5. The "rounding error" phrasing overstates: near-term suffering is a "rounding
  error" mathematically — but strong longtermism is compatible with doing both if
  resources permit; also expectational dominance doesn''t imply we should ignore present
  needs (decision-theoretic nuances: cluelessness, risk aversion, constraints).


