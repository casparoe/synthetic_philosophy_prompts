  Draft v2:


  I cover science and ideas, and while reporting a piece on how far "justified by
  the evidence" can be pushed, I reconstructed an argument that seems to prove far
  too much. I cannot find the step that fails, and I would welcome a diagnosis.


  (1) A scientific claim is justified for a person only if that person can back it
  with a chain of reasoning whose evidential premises are themselves justified.

  (2) Those premises, if justified, require a further chain, and so on without end
  unless the chain either loops or stops at something that is simply asserted.

  (3) No finite mind can survey an endless chain, so an infinite regress gives no
  one actual justification.

  (4) A loop gives no justification, because it assumes part of what it was meant
  to establish.

  (5) A chain that stops at an unargued assertion is arbitrary dogmatism, whatever
  the assertion is.

  (6) Therefore no scientific claim is justified, no matter how scrupulous the evidence.

  (7) But the argument''s own empirical premise (3) is a claim about the limits of
  human cognition, which by (6) would itself be unjustified. If the argument is sound,
  its own evidence for premise (3) is worthless; if it is not sound, one of the premises
  above must be given up.


