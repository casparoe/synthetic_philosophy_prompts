  ---

  I am a novelist researching the mid-century intracranial self-stimulation experiments—the
  ones in which rats with electrodes implanted in their brains could press a lever
  to deliver small electric pulses to what we now call the reward system, and would
  press it to the point of ignoring food, water, and other ordinary goods. I want
  to use them as source material for a novel about a culture that has direct access
  to its own reward circuitry, but I want the philosophical structure to be right
  before I fictionalize.


  I have been reading about wireheading and reward tampering in the AI alignment literature,
  and I understand the usual distinction roughly as follows: wireheading is an agent''s
  obtaining the reward signal directly, bypassing the behavior the reward was supposed
  to reinforce, while reward tampering is a broader category of interfering with the
  reward machinery—the reward channel, the sensor or scorer that reports how well
  the agent is doing—so that the signal stops tracking the intended objective. I want
  you to take the rat experiments as a historical episode and analyze them through
  this lens.


  Please give me a disciplined mapping rather than a loose analogy. Specifically:
  (1) In the experiments, what plays the role of the objective, the reward signal,
  the agent, and the tampered mechanism, and which parts of the setup are accurately
  described as wireheading rather than something else? (2) Which features of the episode
  does the lens explain well—for example, the rats'' shifting of effort away from
  food and sex, the indifference to the consequences of the behavior—and which features
  does it misdescribe or fail to capture? (3) Where is the comparison with an artificial
  system likely to mislead someone like me: think about the difference between a biological
  reward system shaped by evolution and an engineered reward function, the difference
  between a rat that did not design its own reward channel and an agent that might
  deliberately modify it, and the difference between a scalar reward signal and whatever
  motivational complexity the rat actually has. (4) Finally, say what the episode
  genuinely shows about the concept of wireheading—does it make the worry more vivid
  but worse as a model, or does it reveal something about intelligent agents in general
  that the more abstract alignment discussions miss? Do not end with a bibliography
  or citation; I am after the conceptual anatomy of the case.

