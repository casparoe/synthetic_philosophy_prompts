  I keep turning over an argument a friend made when we were arguing about frugality.
  The question was whether frugality is something you should *be* or something you
  should *spread*, and he talked himself into the conclusion that it''s neither. I''ll
  lay out his argument as best I can.


  (1) There are two ways for frugality to be a good thing: either being frugal is
  a duty in itself (the deontological reading), or frugality is good only because
  of its consequences—less waste, lower consumption, a cushion for bad times (the
  consequentialist reading).


  (2) The deontological reading fails, because a duty must be universalizable. Take
  the maxim "spend as little of your money as you can." If everyone followed it, demand
  would collapse, businesses would close, people would be thrown out of work, and
  the very security frugality was supposed to buy would be gone. So the universalized
  maxim undermines what made it worth willing. Whatever else fringe ethical systems
  say, a maxim that fails that test is not a duty. So frugality is not a duty.


  (3) That leaves the consequentialist reading.


  (4) If frugality is good because of its consequences, then what you ought to do
  is whatever act does the most toward the goods frugality is supposed to secure—waste
  avoided, resources conserved, resilience built.


  (5) But a single person''s frugality has no consequences worth talking about. The
  shop orders the same stock, the factory runs the same line, the waste stream is
  the same, and no aggregate statistic moves. One frugal person is a rounding error.


  (6) So on the consequentialist reading, you should not really bother being frugal.
  What actually moves the relevant outcomes is getting many people to change their
  behavior. So you should promote frugality—persuade, campaign, model norms, whatever—and
  then spend your own money however you like, since that part does nothing.


  (7) But the same reasoning applies to everyone. So the ideal end state of the consequentialist
  reading is a society where everyone works to make everyone else frugal while nobody
  practices any frugality themselves.


  (8) And that is absurd. A value that no one has reason to embody, only to promote,
  is not a value in the ordinary sense at all—it''s a marketing department.


  (9) So both readings fail, and frugality is not a good thing in any sense.


  He was unsettled by his own conclusion, and so am I, because it seems like the argument
