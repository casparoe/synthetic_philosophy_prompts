  Let''s generate a good one on actual infinities. Exam question: "Explain Hilbert''s
  Hotel and discuss what, if anything, it shows about the existence and nature of
  actual infinities. In particular, address the finitist objection that an actual
  infinite cannot exist."


  Student answer:


  "Hilbert''s Hotel is a thought experiment about a hotel with infinitely many rooms,
  one for each natural number, all occupied. When a new guest arrives, the manager
  moves the guest in room 1 to room 2, room 2 to room 3, and so on, leaving room 1
  vacant. This shows that an infinite collection can be put into one-to-one correspondence
  with a proper subset of itself, since the set of occupied rooms after the move is
  the same set of rooms but with room 1 freed. It also shows that addition with infinite
  quantities behaves differently: infinity plus one is infinity.


  The standard reading is that this story supports actual infinity because it treats
  an infinite collection as a completed object about which we can reason without contradiction.
  Finitists reject this because they deny that there is any completed infinite collection;
  for them, the hotel is just a finite procedure described recursively, and the conclusion
  only follows if we first assume the infinite hotel exists. Thus the argument against
  finitism is question-begging: it assumes actual infinity rather than proving it.


  One further consequence is that since every operation in the hotel is countable,
  the hotel establishes that any two actually infinite collections have the same size,
  and therefore the only meaningful form of actual infinity is the countable one."


  Now subtle mistakes:

  1. "Thus the argument against finitism is question-begging: it assumes actual infinity
  rather than proving it." Is this a mistake? Many would say Hilbert''s Hotel is not
  an argument for actual infinity but an illustration of its coherent behavior; saying
  it''s question-begging is a common critical point. Could be acceptable. But it says
  "argument against finitism is question-begging" maybe not exactly; Hilbert''s hotel
  as a thought experiment might be construed as an argument that actual infinities
  are coherent, not that they exist. The question-begging charge is arguable. Not
  necessarily a subtle mistake.


  2. "It also shows that addition with infinite quantities behaves differently: infinity
  plus one is infinity." This is okay for cardinal arithmetic.


  3. "The set of occupied rooms after the move is the same set of rooms but with room
  1 freed." Wait after moving guest n to n+1, room 1 is vacant and all rooms ≥2 occupied;
  the set of occupied rooms is {2,3,4,...}. Originally occupied rooms {1,2,3,...}.
  Is there a one-to-one correspondence with a proper subset? Originally the set of
  all rooms N maps to {2,3,4,...} occupied after move, which is a proper subset (missing
  1). The hotel''s set of rooms is unchanged. The student says "the set of occupied
  rooms after the move is the same set of rooms but with room 1 freed" — slightly
  confused phrase but essentially roster. Not a philosophical mistake.


  4. Big subtle mistake at end: "since every operation in the hotel is countable,
  the hotel establishes that any two actually infinite collections have the same size,
  and therefore the only meaningful form of actual infinity is the countable one."
  This is wrong: Hilbert''s Hotel only concerns countably infinite sets; it says nothing
  about whether uncountable infinities exist or whether all actual infinities have
