  I am writing a paper that imagines bringing Leibniz into a seminar room where the
  following modern dispute is on the table. On one side, counterfactual thinkers hold
  that an individual, strictly speaking, exists in only one possible world; what makes
  a claim about how that individual might have been true is that, in some other world,
  there exists a counterpart—an individual sufficiently similar to the original in
  the relevant respects, but numerically distinct. Since the other-worldly individual
  is not identical with the original, there is no puzzle about how one and the same
  concrete thing could bear incompatible properties across worlds. On the other side,
  defenders of transworld identity hold that the very same individual does exist in
  various possible worlds with different properties, and that we refer to that one
  individual from our world in describing those alternatives; the philosophical problem
  is then to explain how genuine identity can coexist with such variation without
  contradicting the necessity of identity.


  Leibniz''s own apparatus—complete individual concepts, composability among the denizens
  of a world, the identity of indiscernibles, and the thesis that every predicate
  true of an individual is contained in its concept—makes God''s choice among possible
  worlds and the status of individual substances its central concern. He seems, at
  various moments, to say things that later philosophers could read as anticipating
  each side of the modern debate; for example, some of his remarks suggest that if
  an Adam existed in a different world with a different history, it would not be the
  same Adam, while others stress that individual substances are the very subjects
  that actualize one set of predicates rather than another.


  Your task is to predict, with genuine argumentative discipline, how Leibniz would
  most likely position himself if he were confronted with the contrast between counterpart
  theory and transworld identity, and had to state his own considered view in terms
