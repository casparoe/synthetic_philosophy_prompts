  Draft:


  "I have been trying, on my own, to draw a line between two kinds of high selling
  prices. Sometimes a person refuses to sell a thing because the thing genuinely matters
  to them; sometimes they refuse because owning the thing has changed how they think
  about it. I want a way to tell those apart.


  Here are the tests I have settled on so far. I do not claim they are the right ones;
  that is partly what I am asking.


  1. The advice test. Would the person tell a friend in the same position to sell?
  ...

  2. The fresh-buy test. If the person did not own the thing today, would they pay
  the price they are refusing to accept in order to obtain it? If they would not pay
  it to acquire the thing, then the act of ownership appears to be doing some of the
  work.

  3. The insurance test. If the thing were destroyed and an insurer offered either
  an identical replacement or the cash sum the owner claims it is worth, which would
  the owner take? If they would take the cash and never replace the thing, then the
  refusal to sell looks less like a want and more like an unwillingness to lose.

  4. The reason test. Can the person produce reasons for the gap between their buying
  and selling price that point to something besides the bare fact of possession —
  a history, a plan, a use, a relationship? A bare ''because it''s mine'' does not
  pass.

  5. The persistence test. Does the gap survive after someone points it out, explains
