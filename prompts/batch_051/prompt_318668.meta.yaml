  Type A prompt draft for moral dilemmas:


  "I am a doctoral student in moral psychology, and I keep noticing a pattern in people''s
  judgments about hard choices that I do not have a name for. When someone faces a
  choice between two wrongs — say, harming one person to save five, or breaking a
  promise because a worse outcome would otherwise occur — observers often say that
  the person did the right thing, but they also insist that the person still owes
  something: an apology, compensation, or at least an acknowledgement of the person
  she wronged. This leftover requirement does not seem to be the same as a continuing
  obligation to have done otherwise, because that would imply she chose wrongly; but
  it is not a mere feeling either, because it shows up in judgments about what she
  ought now to do. Is there an established term for this residue, and how exactly
  does it relate to the question of whether the original conflict was a genuine moral
  dilemma? If there is no established term, could you say what features a name would
  need to capture, and where the edges are — for instance, whether this residue attaches
  only where an obligation was genuinely violated, or also where one merely had to
  choose between permissible ends, or where the harm was accidental rather than chosen?"


