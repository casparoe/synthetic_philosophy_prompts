  Here''s the variation I''ve been arguing with my study group about. Change one assumption:
  the beetles are still hidden — nobody ever sees anyone else''s beetle — but each
  person''s beetle has a distinctive, public, downstream effect. Concretely: every
  month the community gathers, each person drops their hidden beetle into a shared
  pot (behind a screen, so nobody can see what goes in), the pot is heated, and the
  resulting broth has properties everyone can taste — bitterness, saltiness, a certain
  smell. People use the word ''beetle'' heavily around this ritual: they predict ''the
  broth will be bitter, my beetle is the bitter kind'', they quarrel about whose beetle
  ruined the month''s broth, they keep records of past broths. No one ever confirms
  which person''s beetle caused which property, but the properties are stable enough
  that some people become known as bad-beetle or sweet-beetle based on the public
  record of the communal pots.


