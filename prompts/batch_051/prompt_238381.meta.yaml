  Wittgenstein''s beetle-in-a-box (PI §293): Suppose everyone has a box with something
  in it called a "beetle." No one can look into anyone else''s box; each says he knows
  what a beetle is only by looking at his own beetle. Then it is possible everyone
  has something different in his box, or nothing, or the thing changes; the word "beetle"
  has no role in the language game. The point: a private object cannot be the meaning
  of a public word; the word drops out.


