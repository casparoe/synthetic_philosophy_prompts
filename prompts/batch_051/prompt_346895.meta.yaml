  ---


  I''m a retired developmental biologist, and over the last few years I''ve been trying
  to read some philosophy of cognitive science instead of just muttering at the news.
  The thing I keep getting pulled back into is the old rationalist-vs-empiricist fight
  over whether there is innate knowledge, and what bothers me is how often the two
  sides seem to be using ''innate'' to mean different things and then accusing each
  other of missing the point. So I''d like you to draft the document that an adversarial
  collaboration between the two positions would produce. Position A is a modern nativist
  of the core-knowledge or principles-and-parameters flavor: the initial state includes
  rich, domain-specific representational structure, and learning is mostly selection
  or enrichment, not construction. Position B is an empiricist of the modern statistical-learning
  flavor: the learner starts with powerful but domain-general mechanisms and builds
  the structure from the input; if it looks like knowledge is "inborn," that''s a
  discovery about the input or about how little structure is needed to get the behavior.


  The document should open with a numbered Agreed Claims section that is actually
  substantive and that both sides would sign—about what the debate is not (it''s not
  about whether genes matter, or whether learning happens, or whether newborns know
  facts in a declarative sense), about what the empirical phenomena are, about what
  "innate" should at minimum not mean if the debate is going to stay pinned down.
  For claims where they agree only under a paraphrase, include the paraphrase. Then
  give a Disagreements table: the claim under dispute, the nativist''s wording, the
  empiricist''s wording, and whether you think the disagreement is genuine or verbal.
  Then a Cruxes section: the sub-questions such that a settled answer would move at
  least one side, with each side''s prediction recorded in advance, and, where possible,
  the sort of experiment or argument both sides would count as bearing on it. To keep
  it in the weeds, make sure at least one crux is about the difference between representational
  innateness and architectural innateness, and at least one is about whether a controlled-rearing
  or very early competence result (say, a neonate preference for something face-like,
  or a numerically surprising looking-time result) shows innateness rather than a
  prior statistical computation. And finish with a short note on which parts of the
  usual debate you''d diagnose as purely verbal, and why.


