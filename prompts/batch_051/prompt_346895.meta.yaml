  I''m a retired developmental biologist, and after forty years of watching embryos
  turn genes on in the right order I''ve gotten suspicious of anyone who says a trait
  is simply "in the genes." So naturally I''ve been reading the rationalist–empiricist
  fight over innate knowledge, and it drives me a little crazy how often the two sides
  are useing "innate" to mean different things and then acting surprised when they
  talk past each other. I''d like you to draft what an adversarial collaboration between
  two positions in that debate would actually produce. Position A is a modern nativist
  of the core-knowledge or principles-and-parameters sort: the initial state includes
  rich, domain-specific representational structure, and learning is mostly the selection
  or enrichment of what''s already there. Position B is a modern statistical-learning
  empiricist: the learner begins with powerful but domain-general machinery and genuinely
  builds the structure from the input, so early competence is a fact about how much
  can be gotten from surprisingly little.


