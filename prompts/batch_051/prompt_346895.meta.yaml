  isn''t a pile of truisms: what both sides would sign about the proper meaning of
  "innate" if the term is to stay useful, about the gene/environment distinction being
  the wrong frame, about which empirical phenomena are real and in need of explanation,
  and about what would not count as evidence for either side. Second, a Disagreements
  table: the claim under dispute, the wording each side would accept for its own view,
  and a column for whether the disagreement looks genuine or verbal. Third, a Cruxes
  section: the sub-questions where a settled answer would actually move at least one
