  "A proposed rule for consumer-facing companies: any time a company uses a default
  (auto-enrollment, auto-renewal of a subscription, preset tip amount, order quantity,
  privacy setting default) or a comparable ''choice architecture'' nudge, it must,
  for the first three months after rolling it out, run a randomized split test: a
  randomly selected control group gets the neutral version with no default (or the
  old default), and the treatment gets the new default. The company then measures
  the ''opt-out rate gap'' — the difference between the share of people in the treatment
  group who ended up in the nudged option and the share in the control group who actively
  chose it. Every month, the company pays a tax equal to some multiple of the opt-out
  rate gap times the number of consumers affected, and the money goes into a fund
  that is distributed as a flat yearly rebate to all consumers, whether or not they
  were nudged. Companies can set any default they want, but the tax makes stronger
  nudges more expensive."


  Then ask how it plays out. What does it incentivize? Companies would prefer weak
  nudges, or nudge only when benefit > tax; they might game by making the control
  group''s active choice artificially bad (e.g., making opt-out confusing only in
  control?) — no, control is no default. They might choose defaults that mostly capture
  people who would have chosen anyway (low gap) — which is arguably fine. They might
  try to game the measurement: design the control condition to suppress active choosing
  (e.g., add friction to active choice in both arms differently, or label the control
  in a way that drives people to the default-ish option anyway). They might segment
  users so that the nudge applies to high-propensity groups. They might run the A/B
  test during a period when behavior is unrepresentative (holiday season). They could
  manipulate randomization (non-random, "stratified" randomization that cherry-picks).
  The rebate creates a weird incentive for consumers to be nudged or to avoid? Flat
  rebate to all citizens — maybe consumers like being nudged since they get the rebate
  but only others pay? Actually the rebate is funded by companies, so consumers collectively
  get money; if a consumer is nudged into a worse option, they lose more than the
  rebate individually. Distributional effects: heavy users of services pay more, everyone
  gets equal rebate — cross-subsidy from the persuadable to the disciplined. Could
  encourage entry of "nudge-light" firms as a selling point. Could lead to companies
  replacing defaults with even darker patterns that are not classified as defaults
  (interstitial upsells, guilt-tripping copy) — regulation arbitrage. The regulator
  must define "default" and "comparable nudge" — gaming through definitions. Enforcement:
  who audits the A/B tests? Companies self-report — they''d report lower gaps.


  Second-order effects: it makes choice architecture itself a taxable event, which
  might push nudges underground or toward unmeasured channels; it commodifies consumer
  attention; it might legitimize certain nudges as long as you pay (a "nudge permit"),
  which could normalize manipulative defaults; it could create a constituency (the
  government) that depends on nudge-tax revenue and thus wants nudging to continue.


  Failure modes and fixes: measurement gamed; definitional arbitrage; incidence of
  tax passed to consumers through prices; the rebate might not compensate the actual
  nudged people; the tax might not scale correctly (should target welfare loss, but
  opt-out gap is a bad proxy — sticky defaults are often welfare-enhancing when they
  automate). Can any be fixed without gutting the scheme? E.g., independent audit
  of randomization and control design; pre-registration; rebate targeted to nudged
  consumers; excluding welfare-improving defaults (retirement auto-enrollment) — then
  we''re back to a judgment-based list.


