  A friend and I have spent the last several evenings arguing about whether the formal
  results of algorithmic information theory — Kolmogorov complexity, Solomonoff induction,
  and the associated convergence guarantees — actually justify Occam''s razor, or
  whether they only formalize an attractive but ultimately pragmatic preference for
  shorter descriptions. We''ve settled into two positions.


  One of us (the "formalist" position) holds that Solomonoff induction is the deep
  vindication of Occam''s razor: it shows that simple hypotheses are, in a precise
  sense, more probable a priori, and that any computable environment can be learned
  with total error bounded by the complexity of that environment. The other (the "pragmatist"
  position) holds that this is mostly a piece of mathematics about an uncomputable,
  language-dependent prior, and that it doesn''t tell finite agents like us that simpler
  hypotheses are more likely to be true of this world — at best it shows that a certain
  kind of simplicity is a useful coding convention.


  We''d like to write the document an adversarial collaboration between these two
  positions would produce. We don''t want a survey of Solomonoff induction and we
  don''t want a verdict on who wins: we want a text both positions could sign, with
  the remaining disagreement stated so precisely that each side would accept the wording
  of its own claim.


  Please draft it in four parts.


  (1) Jointly accepted claims. A numbered list of claims both positions accept, covering
  at least the following: the invariance theorem (Kolmogorov complexity is well-defined
  only up to an additive constant depending on the reference universal machine, and
  what follows for the prior: it changes by at most a multiplicative constant); the
  uncomputability of the universal prior; the fact that it assigns positive prior
  weight to every computable hypothesis; and the convergence theorem, stated in a
  form both sides accept — e.g., that for data generated by a computable measure,
  Solomonoff''s predictor accumulates total prediction error bounded by a constant
  multiple of the complexity of that measure. These claims should not be hand-wavy
  versions of the slogans; they should specify, where it matters, what is a theorem,
  what is an idealization, and what is being measured.


  (2) Precise residual disagreement. A table or list of the points where the positions
  part ways, with each point given first in wording the formalist would sign and then
  in wording the pragmatist would sign. The points must include at least: (i) whether
  the machine-dependence of the prior is benign or fatal for the claim that the razor
  is objective; (ii) whether the convergence bound transfers any justificatory force
  to the finite-sample, computationally bounded inferences that scientists actually
  make; (iii) whether the sense of "simple" that appears in real theory choice is
  the same thing as short Kolmogorov complexity, or only analogous to it; and (iv)
