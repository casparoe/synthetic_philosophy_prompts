  (1) Lena said the sliding scale is the only honest way to think about it. There''s
  no sharp line in nature between a nervous system that feels and one that doesn''t
  -- a bee has some learning and pain behavior, a jellyfish less, a thermostat none.
  If the capacities come on gradually, then treating them as gradually mattering isn''t
  a gimmick, it''s just following the world.


  (2) Ravi said no -- he wasn''t denying degrees of complexity or degrees of well-being.
  A dog can be hurt more and in more ways than a bee. But before you can be hurt in
  any way at all, there has to be a point of view. Something either is a subject of
  experience or it isn''t; below that line there''s no "what it''s like," and giving
  a bee or a thermostat a small amount of standing treats a fuzzy border as if it
  were a fuzzy fact. The thermostat gets zero, not one-billionth.


