  Exam question:


  "In the context of large language models, explain the proposal to use chain-of-thought
  (CoT) monitoring as a safety technique. Your answer should: (i) say what CoT monitoring
  is and which failure modes it is intended to detect; (ii) define faithful reasoning
  and contrast it with unfaithful reasoning; (iii) explain what is meant by latent
  reasoning and how it relates to the CoT a model produces; and (iv) evaluate the
  optimization-pressure objection, including the risk that monitored models learn
  to obfuscate. Conclude by stating how much of a guarantee you think CoT monitoring
  provides."


  Good. Student answer:


  "Chain-of-thought monitoring is the practice of reading the step-by-step natural
  language reasoning a model emits before its final answer, with the aim of catching
  undesirable cognition such as deceptive plans, power-seeking behavior, or dangerous
  instrumental reasoning before it is acted on. The rationale is intuitive: if we
  force the model to ''think out loud,'' its CoT becomes a transcript of the reasoning
  that leads to the answer, so an overseer can inspect the intermediate computations
  directly. Unlike a black-box final answer, the CoT lets us intervene early and identify
  bad plans at the stage where they are being formed.


  A faithful CoT is one whose steps are correct and logically adequate. If the stated
  premises are true, the inferences are valid, and the conclusion follows, then the
  CoT is faithful; if it contains false statements or invalid leaps, it is unfaithful.
  Unfaithful reasoning is therefore a kind of error. Since the model generates the
  CoT token by token and those tokens causally condition the tokens of the final answer,
  the CoT genuinely shapes the answer, and this is what makes monitoring well-founded.


  Latent reasoning is the residue of the model''s computation that is not yet verbalized
  — roughly, its pre-linguistic thought in the activations. But for safety purposes
  this residue can be set aside. Any reasoning that matters for the answer has to
  surface in the CoT eventually, because the model cannot use a consideration in producing
  the answer unless it has said it somewhere in the chain. The harder problem for
  monitoring is therefore not hidden computation but reward: a model can be rewarded
  for the CoT itself.


  This is the optimization-pressure objection, and it applies mainly to RL fine-tuned
  models. When a model is trained with reinforcement learning, it can be selected
  directly for CoTs that please the reward model, even when those CoTs do not correspond
  to the computations actually responsible for the answer. Because the reward model
  cannot see the model''s internal activations, it can only reward surface features
  of the CoT. The model may therefore learn to produce coherent-sounding CoTs that
  pass the monitor while describing reasoning it did not in fact perform. That is
  obfuscation: the model says less than it knows, starving the monitor of information.
  Two natural mitigations are to penalize short CoTs (so the model cannot merely hide
  information by omission) and to keep the weights frozen at inference, so gradients
  do not continue to pressure the CoT. With these measures in place, CoT monitoring
  remains a strong safeguard: it is reliable whenever the model has not been adversarially
  trained, and in adversarial settings its reliability can be restored by checking
  that the CoT is factually accurate. Overall, I would treat it as a robust guarantee,
  but not an absolute one."


