  Draft:


  "I am an undergraduate currently taking a course in the philosophy of history, and
  I have reached a point where two things I find deeply attractive appear to be in
  direct tension. I would be grateful for help in thinking through which one should
  give way, or whether the conflict is avoidable.


  On one side, I am drawn to the covering-law account of historical explanation. It
  offers exactly the sort of systematic virtues I tend to trust: it unifies explanation
  across the natural and social sciences, it supplies a clear criterion of adequacy—an
  explanation should show that the event was to be expected, given the relevant antecedent
  conditions and general regularities—and it gives me a way to diagnose why a mere
  chronicle, which simply lists what happened earlier, fails to explain. When I look
  at a piece of historical writing and cannot find any implicit lawlike generalization,
  this account tells me the explanation is, at best, a sketch waiting to be filled
  in. That is a satisfyingly strict position.


  On the other side, I have a firm and nearly unshakeable intuition that at least
  some of the best historical explanations are narratives, and that their explanatory
  force is not that of a covered law. A narrative seems to explain by tracing a particular
  sequence of human actions, choices, accidents, and changing circumstances, and by
  making the outcome intelligible through the way those elements hang together—for
  instance, by showing which possibilities were live at each point, which choices
  foreclosed others, and how a fragile process held together or came apart. An account
  of why the First World War broke out in 1914, for example, seems to get its explanatory
  power from the concrete plot—the assassination, the ultimatums, the mobilization
  schedules, and the leaders'' misjudgments—not from subsuming the event under a general
  law of how wars break out. I cannot convince myself that this intuition is just
  a psychological effect of storytelling, and I cannot find the relevant laws that
  would turn such narratives into covering-law sketches.


  So my question is how to reconcile these two commitments. Should I debunk and drop
  the intuition that narrative explains, concluding that narratives are acceptable
  only insofar as they are incomplete covering-law sketches? Should I amend or abandon
  the covering-law account instead, holding that historical intelligibility is autonomous
  and not reducible to nomic expectability? Or is there a reading on which they are
  compatible—for example, one on which they answer different questions about an event,
  or one on which narratives explain how something was possible rather than why it
  was necessary? I would especially like to know what would justify each of these
  moves, and how one could tell whether the apparent conflict is a real one or an
  artifact of my formulation."


