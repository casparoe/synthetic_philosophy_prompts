  I am a PhD student in political theory working on the justification of constitutional
  entrenchment. In my reading group, our discussion keeps returning to a disagreement
  between two camps about the relationship between individual self-binding and constitutional
  precommitment, and I have been asked to produce the document that a good-faith adversarial
  collaboration between them would produce. Please draft that document.


  The first camp, call it the continuity view, holds that constitutional precommitment
  can inherit much of the justification of an individual''s Ulysses contract: a political
  community, over time, is enough like a single agent with considered higher-order
  ends that binding itself against predictable future majorities is rational self-governance
  rather than a constraint from outside. The second camp, the dead-hand view, holds
  that the analogy is doing illicit work: an individual binds the same person (or
  a sufficiently continuous self), whereas a constitution binds later persons who
  did not do the binding; the community is not a unified subject with settled higher-order
  preferences; and many entrenched provisions are much harder to revise than Ulysses''s
  command to ignore his future pleas was. So, at most, constitutional entrenchment
  needs a different justification.


