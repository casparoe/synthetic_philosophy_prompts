  Luminosity (Williamson): no non-trivial mental condition is luminous — there is
  no condition C such that whenever C obtains, you''re in a position to know C obtains.
  Anti-luminosity argument about feeling cold: imagine a continuum from freezing (clearly
  cold) to boiling (clearly not cold), stepping by tiny gradations you can''t discriminate.
  If "feeling cold" were luminous, then at the last moment where you''re cold, you''d
  know you''re cold; but since adjacent cases are indiscriminable and you know you''d
  be equally confident, if you knew you were cold at t_i, you''d know you were cold
  at t_{i+1} (which is not cold), contradiction. So "feels cold" isn''t luminous.


  KK principle: knowing entails knowing that you know. Williamson rejects KK; luminosity
  fails closely tied. Positions: some accept KK and luminosity for mental states;
  others reject.


