  [Essay]


  For a while I''ve thought that the debate about whether LLM hallucination is lying,
  bullshit, or error has a frame problem. All three categories assume a speaker. Lying
  requires someone who knows the truth and says otherwise. Error requires someone
  who takes herself to be saying something true, stakes herself on it, and gets it
  wrong. Bullshit, in Frankfurt''s On Bullshit, is less about the world and more about
  the speaker''s stance: the liar at least has to keep track of the truth in order
  to contradict it, while the bullshitter has stopped caring how things are and cares
  only about how his words land. On Frankfurt''s telling, the bullshitter isn''t trying
  to get us to believe a falsehood; he''s trying to get us to see him in a certain
  light, and truth is just irrelevant to the project. That is what makes bullshit,
  in one respect, worse than lying.


  An LLM hallucination doesn''t fit any of these because there is no speaker in the
  picture. The model isn''t knowingly contradicting the truth, isn''t staking itself
  on anything, and has no motives at all, so a Frankfurt-style motivational definition
  can''t get a grip. Calling the output ''bullshit'' is, I think, a category mistake
  if aimed at the model. But I also don''t want to fall back on ''error,'' because
  that smuggles in a truth-aiming operator. Error isn''t just any false output; it''s
  a false output inside a practice where someone was answerable for the truth.


  So I propose a fourth category: ''counterfeit assertion.'' A hallucinated answer
  has the full surface grammar of assertion—declarative form, confidence, the kind
  of sentence that would carry a truth-commitment if a person said it—but there is
  no one who stands behind it. That''s different from bullshit because there''s no
  motive and no impression-management; the operator may be indifferent, but the model
  isn''t. The interesting question is whether the bullshit is instead located in the
  operator: if I deploy a system that I know produces fluent, confident falsehoods
  at some rate, and I present its outputs as if they were answers, my act may be bullshit
  in the Frankfurtense [typo] sense even though the token output is not. On this view,
  hallucination isn''t a speech act gone wrong; it''s counterfeit money passed by
  whoever hands it to you."


