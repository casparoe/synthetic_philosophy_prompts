  \ says yes.\n\nMaybe my earlier verdicts should be chosen so the new case is genuinely\
  \ ambiguous between:\n- \"requires native speakers AND full grammar from natural\
  \ emergence\" vs\n- \"requires being the primary communication system of a community\
  \ and transmitted across generations, even if grammar is still emerging.\"\n\nLet\
  \ me include a verdict on a \"newly emerging sign language\" to calibrate? Hmm.\n\
  \nAlternatively the new case: \"a family's home sign that has now been learned by\
  \ an entire extended family over three generations, with some grammatical regularities\"\
  \ — divergence: home-sign-like origin (not a language under R-home sign exclusion)\
  \ vs shared/multigenerational with grammar (language under R-community). That's\
  \ nice.\n\nWait, in her past verdicts: home sign (single deaf child, hearing family,\
  \ no deaf community): not a language. If the new case is \"home sign that grew into\
  \ a village sign language over three generations in an extended family with several\
