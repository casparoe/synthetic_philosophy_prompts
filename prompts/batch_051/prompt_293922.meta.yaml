  \ no quotes from memory, no bibliographies/citations needed, inject new/niche ideas\
  \ so not regurgitated.\n\nI need to pick one domain and one type. Let me think of\
  \ a good combination.\n\nType A (verdicts -> predict new case) fits well with moral\
  \ cases (atomic bombings? virtue ethics?), or sign language cases? Mathematical\
  \ structuralism could have verdicts on cases like \"is 2 ∈ 4?\" I think Type A with\
  \ sign languages and definition of language could be interesting: a professor has\
  \ given verdicts on whether X counts as a language for various systems (ASL, Nicaraguan\
  \ Sign Language, home sign, written language, drum languages, whistled languages,\
  \ emoji, programming languages, animal communication). Then new case: a village\
  \ sign language that emerged recently, or tactile sign, or a conlang like Klingon?\
  \ Predict professor's verdict and identify the implicit definition. That's very\
  \ much \"in the weeds\" but accessible.\n\nType A with memes/Darwinian culture:\
  \ friend's verdicts on which cultural items are memes (catchy tunes, chain letters,\
  \ religions, languages, online memes, etc.) and predict new case.\n\nType A with\
  \ mathematical structuralism: verdicts on whether 2 is an element of 4, etc., but\
  \ might be too niche.\n\nType B (summary fairness) could combine with memes: someone\
  \ summarizes meme theory as \"culture evolves by natural selection, memes are selfish\
  \ replicators, religion is a virus of the mind\" — audit fairness. That could be\
  \ good but maybe more familiar.\n\nType B with atomic bombings: someone summarizes\
  \ the debate? Could be done but sensitive; fairness audit of a summary of the arguments.\
  \ Could work.\n\nType C exam question: sign languages and definition of language\
  \ — write final exam question. Could be good.\n\nThe instructions say \"Write a\
  \ relatively elaborate prompt... can add not-super-relevant detail.\" They want\
  \ a prompt for a dataset. I should write just the prompt text, no commentary. The\
  \ prompt itself should be the dataset item.\n\nI need to choose one. Let me think\
  \ about which is strongest and least likely to produce regurgitation while remaining\
  \ meaningful for a non-searching model.\n\nType A with sign languages seems excellent:\
  \ the asker reports a professor's verdicts across many borderline linguistic systems,\
  \ asks to predict verdict on a new case (e.g., a recently emerged sign language\
  \ in a Bedouin community, or tactile sign language used by deafblind people) and\
  \ identify the implicit definition(s), and which further case would disambiguate.\
  \ Sign languages and the definition of language is a rich domain: linguists debate\
  \ what counts as language, and there are famous edge cases — Nicaraguan Sign Language\
  \ emergence, home sign systems, village sign languages (Al-Sayyid Bedouin Sign Language),\
  \ tactile ASL/protactile, drum/whistled speech, writing, emoji, animal communication.\
  \ LLMs know these decently. The prompt can inject a niche but real distinction,\
  \ e.g., \"kinetic syllabaries\" or the distinction between gesture and sign.\n\n\
  But the instruction says prompts shouldn't refer to super niche theories/facts that\
  \ small LLMs won't have memorized. Sign languages are fairly known; village sign\
  \ languages maybe less so. Could choose the new case as something constructed but\
  \ with enough information. I can create a hypothetical new case (a researcher describes\
  \ a communication system), avoiding need to know a real fact.\n\nActually, the prompt\
  \ as a dataset item should be answerable by a model without web. So I should embed\
  \ enough seed detail in the prompt itself. The model should reason from the verdicts\
  \ provided.\n\nLet me design a Type A prompt in sign languages.\n\nScenario: The\
  \ asker's linguistics department has a professor who keeps a running list of examples\
  \ and whether she counts them as \"full human languages\" vs \"communication systems.\"\
  \ Her past verdicts:\n- ASL: language\n- British Sign Language: language\n- Nicaraguan\
  \ Sign Language (arose in a school for deaf children in the 1980s): language\n-\
  \ Home sign (a single deaf child's invented gestures with hearing family): not a\
  \ language — not shared/transmitted\n- A pidgin spoken by adults in a market: not\
  \ a language — no native speakers, reduced grammar\n- A creole like Haitian Creole:\
  \ language\n- Written English: not a language — it's a representation of one\n-\
  \ Drummed Yorùbá (talking drum encoding speech): not a language — derived from spoken\
  \ language, can't express novel ideas? Hmm, actually drum languages can encode tonal\
  \ patterns and are derivative. But careful: drum \"languages\" are not full languages;\
  \ they are encoding of spoken language. Good.\n- Whistled Spanish (Silbo Gomero):\
  \ not a language — a mode of whistling Spanish. Actually Silbo is a whistled register\
  \ of Spanish. Good.\n- Koko the gorilla's signing: not a language — no grammar/productivity\n\
  - Esperanto: language? This is interesting. Esperanto is a constructed spoken language\
  \ with native speakers (denaskuloj). Would she count it? I'd say language. Could\
  \ include.\n- Emoji: not a language.\n\nNew case: a tactile sign language used by\
  \ a community of deafblind people who sign into each other's hands. It has its own\
  \ grammar? Or a new \"village sign language\" that emerged in an isolated community\
  \ over maybe three generations but has no written form and is used by hearing and\
  \ deaf members; linguists disagree about whether it's a full language because it\
  \ has variable word order and no standardized lexicon. The question: predict her\
  \ verdict, identify the implicit rule(s), candidate rules, which cases would disambiguate.\n\
  \nBut I want to make the earlier verdicts consistent with more than one plausible\
  \ rule and choose new case where rules diverge.\n\nPossible candidate rules:\nR1:\
  \ A language is a natural, shared, conventional system with native users and full\
  \ combinatorial grammar (productivity). This counts ASL, BSL, NSL, creole, Esperanto\
  \ (has native speakers), excludes home sign, pidgin, written English, drum/whistle\
  \ modes, gorilla signing, emoji.\nBut then new case: village sign language with\
  \ three generations but no native? Hmm.\n\nR2: A language must be an independent\
  \ primary system not derived from another language (excludes writing, drum/whistle\
  \ encodings) and transmitted natively (excludes pidgin) and have grammatical productivity\
  \ (excludes emoji, gorilla signing). So similar.\n\nR3: Maybe she counts \"sign\
  \ languages as language if they are primary languages of a community and acquired\
  \ natively\" vs \"only systems with both spoken and signed modality?\" Hmm.\n\n\
  Better: create divergence on \"prodrop\"? Not really.\n\nLet me think of candidate\
  \ rules that actually diverge on a chosen new case.\n\nPossible dimensions:\n- natural\
  \ vs invented (Esperanto vs emoji; but she counts Esperanto, so not simply natural)\n\
  - native speakers (pidgin vs creole)\n- independence from another language (whistled\
  \ Spanish vs Spanish) \n- shared/conventional (home sign vs ASL)\n- productivity/grammar\
  \ (gorilla vs ASL)\n- full expressive range (emoji restricted?)\n\nNew case could\
  \ be a \"deafblind tactile sign language that grew out of ASL but is no longer mutually\
  \ intelligible with it and has native users.\" Rule \"independent of another language\"\
  \ might say no (derived), while rule \"community/native grammar\" says yes. That's\
  \ a divergence.\n\nOr new case: a written-only language? Like Classical Chinese?\
  \ Hmm, she said written English is not a language (representation). A writing system\
  \ that is primary with no spoken form? E.g., a signed language? no. Maybe a \"whistled\
  \ language that is not derived from a spoken language but acquired natively by a\
  \ community\" — hypothetical? Divergence between \"must be spoken or signed (not\
  \ a derived mode)\" and \"independent + native + grammar\": R-mode says no, R-general\
  \ says yes.\n\nOr new case: a newly emerged sign language used by a small Bedouin\
  \ community (Al-Sayyid) where many hearing people sign too, has emerged over ~75\
