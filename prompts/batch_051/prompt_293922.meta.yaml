  \ languages and the definition of language.\nType: Predict verdict on a new case\
  \ from earlier verdicts.\n\nWrite casually, in British English, 1-3 paragraphs,\
  \ elaborate, with a couple of minor typos, assign role, ask for careful reasoning,\
  \ brainstorming, candidate rules, best guess, further cases.\n\nLet me draft:\n\n\
  \"I'm doing a module on the linguistics of deaf communities, and my lecturer has\
  \ been collecting examples to use in a paper about what makes something a language\
  \ rather than just a communication system. She's quite idiosyncratic and refuses\
