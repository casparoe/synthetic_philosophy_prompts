  Goodman''s grue: predicate "grue" applies to things examined before some future
  time t (say 2100) iff green, and to things not so examined iff blue. All emeralds
  examined so far are green and also grue (because examined before t and green). So
  the inductive evidence supports "all emeralds are grue" as much as "all emeralds
  are green," but the two conflict for unexamined emeralds after 2100 (grue predicts
  blue, green predicts green). Goodman''s answer: entrenchment — "green" is a better
  entrenched predicate because it has a history of successful projections.


