  What would an "acausal threat" argument be? Let me define.


  Acausal threat: Agent X (could be an alien, a god, a future AI) cannot observe or
  be causally affected by your action, but is committed to a policy that punishes
  you iff X''s model of you predicts you will defy. X has already set the punishment
  in motion (or it will be set by a decision correlated with yours). Your action cannot
  affect whether punishment occurs; it is only evidence about what X predicted.


  Evidential decision theory (EDT) says: choose the action with highest expected utility
  conditional on performing it. In Newcomb, one-boxing: conditional on one-boxing,
  $1M likely in box; conditional on two-boxing, likely empty. So one-box.


  Now the argument for complying with acausal threats:


  Premise 1: In Newcomb''s problem, you should one-box (i.e., choose based on what
  your choice would indicate, not merely cause). [We could use weaker: "EDT is correct."]


  Premise 2: In Newcomb''s problem, the only reason one-boxing is rational is that
  your choice is correlated with the predictor''s earlier action, not that it causes
  the predictor''s action. [Actually EDT also cares about causal consequences; one-boxing
  has good evidential, bad causal consequence.]


  Premise 3: An acausal threat is structurally identical to Newcomb''s problem with
  respect to this property: your action and the threatener''s act are correlated only
  through the threatener''s predictive model; the act itself has no causal influence
  on the threat.


  Premise 4: What makes one-boxing rational in Newcomb is therefore present in every
  acausal threat: choosing to defy is strong evidence that you are in the world where
  the threatener predicted defiance and has already triggered (or will trigger) the
  punishment.


  Premise 5: So you should comply with any acausal threat where the expected disvalue
  of the threatened punishment (weighted by the predictor''s reliability) exceeds
  the cost of compliance.


  Premise 6: This implies that you should comply even with threats from agents you
  have never encountered, whose existence you cannot verify, and whose "predictions"
  are merely asserted — provided each has threatened a harm astronomically larger
  than the demanded action and you assign each even a tiny probability of being an
  accurate predictor. For then expected cost of defiance can be made greater than
  cost of compliance, no matter how tiny the probability, by making the threatened
  harm large enough. (This is the Pascal''s-mugging / acausal blackmail explosion.)


  Conclusion: So a rational agent is a sitting duck for unlimited acausal extortion—even
  fictional or merely possible extortionists—which is absurd. Therefore one of the
  premises must go.


  Where does it go wrong? The interesting philosophical moves:


  - Reject premise 1 or 2: adopt causal decision theory (CDT). Since there is no causal
  route from your act to the punishment, CDT says defiance dominates: the punishment
  state is already fixed; you should choose the act that''s causally best (defy, since
  compliance has cost and doesn''t stop punishment). So CDT blocks the entire class
  of acausal threats (and also says two-box in Newcomb). Cost: CDT loses the intuitive
  attraction of one-boxing and must explain why rational agents leave money on the
  table in Newcomb-like cases; maybe deny the predictor can be genuinely perfect.


  - Reject premise 5/6 (the "any threat with tiny probability times huge harm" move):
  the expected-utility aggregation is unbounded/incoherent. Deny that a possibility
  one assigns arbitrarily tiny probability should sway action just because the harm
  is arbitrarily large; this is the "Pascal''s mugging" problem. Costs: you need a
  bounded utility function or a prior that penalizes complexity—and even then, the
  argument for a single threat with a known reliable predictor (like Omega) remains.


