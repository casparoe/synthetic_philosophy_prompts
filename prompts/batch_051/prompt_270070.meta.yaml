  Key philosophical ideas about incommensurable values / hard choices:


  - Incommensurability: items can''t be measured on a common scale. From Raz: no common
  unit of value, yet comparisons may still be possible (e.g., one option better than
  another without equal units). "Constitutive incommensurability" — engaging in certain
  comparisons may be ruled out by one''s commitments? Actually Raz: some goods resist
  ranking because of their role in our lives (friendship vs. money).

  - Incomparability: items cannot be compared at all (stronger claim). Some deny genuine
  incomparability.

  - Parity / "on a par" (Chang): two items can be comparable but neither is better
  than the other, and they''re not exactly equal. Equal = any small improvement to
  one would make it better. On a par = a small improvement might not make it better;
  they''re in the same neighborhood. The "small improvement argument" shows not all
  comparability reduces to better/worse/equal.

  - Covering value: comparisons often require a broader value that covers both options
  (e.g., "contribution to well-being" covers both a promotion and a friendship?).
  If no covering value, perhaps hard choices aren''t merely epistemic (we don''t know
  which is better) but the options are genuinely on a par.

  - Hard choices: Chang argues hard choices are choices between items on a par, not
  items with hidden precise values; and that we create reasons through commitment
  ("drift" of voluntarist reasons?). Hmm — may be too niche.

  - Aggregation/commensuration problems in cost-benefit analysis: scholars argue that
  ranking everything in monetary terms distorts (e.g., valuing life, health, dignity
  in dollars). "The arithmetic of compassion"?


