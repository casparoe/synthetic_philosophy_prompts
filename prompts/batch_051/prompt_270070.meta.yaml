  "Please respond in American English.


  I direct the grants program at a mid-sized private foundation. Several times a year
  we must choose among finalists that are good in fundamentally different ways: a
  nutrition intervention that prevents a small number of child deaths, an arts program
  that makes a neighborhood a cultural destination, a legal-aid project that changes
  who can hold landlords accountable. Our current procedure scores every proposal
  on a single numerical rubric, and I have watched it produce a false precision: staff
  game the weights, and the scores imply comparisons the underlying judgments cannot
  support.


  I have encountered a philosophical distinction that seems relevant but I don''t
  know how to use it. The idea is that two options can fail to be strictly rankable
  in more than one way. They can be exactly equal in value. They can be incomparable
  — no meaningful comparison applies. Or they can be on a par: neither is better,
  they are not equal, and a small improvement to one would not automatically make
  it the better choice. The literature also says that comparing across very different
  goods usually requires a covering value — some broader value that encompasses both
  — and that the absence of a covering value is not the same as the two options having
  equal value. Some philosophers argue that when options are on a par rather than
  equal, forcing a precise ranking is a mistake, not a solution.


  Please turn these distinctions into a decision procedure my grants team can actually
  run on a pair of finalists. It should be a reusable procedure, not advice about
  one grant cycle. Include: the questions to ask in order; what counts as a sufficient
  answer to each before moving on; where the procedure stops with a ''these cannot
  be ranked this way'' or a ''this is a board-level judgment''; and where a step is
  a values judgment rather than a technical test, marked as such. It should be usable
  by staff with no philosophical training in under an hour per pair.


  Then apply the procedure to three cases: (1) a proven child-nutrition program against
  a hard-to-quantify neighborhood arts program; (2) a legal-aid project that will
  shift power against a capital grant that will make a community institution permanent;
  and (3) a case of your choice in which the procedure tells my team not to rank two
  proposals on a single scale and instead to surface a board-level choice, even though
