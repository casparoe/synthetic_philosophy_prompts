  Let me draft the setting and mechanism:


  "An international research collective works on technologies where some small subset
  of members is technically able to take an irreversible, collective-consequence action
  (releasing a dual-use dataset, publishing a protocol, deploying a model). The community
  currently operates under a unanimity-through-inaction norm: anyone may do anything
  not affirmatively forbidden. After a close call, someone proposes the following
  ''temperature-check'' rule to blunt the unilateralist''s curse."


  The proposed rule: "Before undertaking any irreversible action from a predefined
  list, the intending member must file a notice listing (a) their best estimate of
  the net expected value of the action, expressed in a common unit, and (b) a ''honesty
  deposit'' proportional to the absolute value of their estimate — say 0.1% of its
  magnitude, capped at some amount. For exactly one week, any other member may file
  one of three responses: endorse, challenge, or abstain, each accompanied by a deposit
  of the same proportional size. At week''s end, the action proceeds if and only if
  no challenge is filed; if a challenge is filed, the action goes to a review panel
  of three members selected by lot from among endorsers and challengers, excluding
  the proposer. The panel debates for 48 hours and then votes in secret. A 2/3 vote
  is required to permit the action; otherwise it is cancelled for a standing period
  of six months, after which a new notice may be filed. Deposits of the losing side
  are forfeited into a harm-remediation fund; deposits of the winning side are returned
  in full."


  This is interesting: proposed rule includes no-profit — so incentives aren''t to
  win money but to recover deposits; losing side forfeits to a fund (not to opponents),
  avoiding financial reward for blocking, but perhaps making challenges costly and
  rare. Intent: the filing and deposits encourage calibrated self-selection; challengers
  must pay to slow things down.


  Possible gaming and failure modes to ask about:

  - Externalities: small deposit proportional to estimate may be trivial for large-estimate
  actors; magnitude caps; wealthy members unaffected.

  - Strategic classification: file tiny estimates to minimize deposit while claiming
  high confidence? The deposit proportional to absolute value with cap encourages
  understating values.

  - If challenge is filed, the panel is drawn from endorsers and challengers — self-selected
