  Testimony reductionism: The view that testimonial justification is reducible to,
  or must be underwritten by, inference from perception, memory, and inductive evidence
  of reliability. Classic version: Hume in "Of Miracles": our assurance in testimony
  derives from experience of the constant conjunction of facts and reports; we believe
  testimony because we''ve observed that reports usually conform to reality. Thus
  testimonial justification is a posteriori and inductive; how much credence to give
  depends on observed reliability of sources and prior improbability of the claim.


  Anti-reductionism: Thomas Reid''s view (18th century). He argued that there is a
  natural principle of credulity (disposition to trust testimony) and of veracity
  (disposition to tell truth) implanted by nature/God; testimony is a basic source
  of evidence, like perception; we are justified in trusting it by default unless
  we have positive defeaters. Just as we don''t need to prove sense perception reliable
  before using it, we don''t need to prove testimony reliable. Children rely on testimony
  before they could possibly have inductive evidence.


