  in reality than in appearance."


  Here, Hume contrasts disagreement over matters of opinion with disagreement over
  taste. Suppose Hume were shown a modern streaming platform that aggregates millions
  of users'' ratings, rankings, and viewing or listening habits into an algorithmic
  recommendation system, and then treats its output as an empirical standard of what
  is good in film or music. Would he regard such a system as a promising approximation
  of a standard of taste, or as a device that confuses the two kinds of disagreement
