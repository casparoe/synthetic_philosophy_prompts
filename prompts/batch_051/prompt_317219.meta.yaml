  Potential prompt:


  I''m reading Hume''s Treatise of Human Nature, Book 3, Part 2, Section 5 ("Of the
  obligation of promises"), and I think I''ve found an argument that proves too much.
  The key passage is:


  "A promise creates a new obligation. A new obligation supposes new sentiments to
  arise. The will never creates new sentiments. There could not naturally, therefore,
  arise any obligation from a promise, even supposing the mind could fall into the
  absurdity of willing that obligation."


  Here''s the argument I reconstruct from it:


  (1) In a one-shot prisoner''s dilemma, two self-interested people each do better
  by defecting than by cooperating, whatever the other does.

  (2) A promise to cooperate can create a new obligation only if willing the promise
  creates a new sentiment or motive to cooperate.

  (3) But willing cannot create a new sentiment; Hume''s passage says that.

  (4) So a promise cannot give a self-interested person a reason to cooperate in a
  one-shot prisoner''s dilemma.

  (5) Therefore, promises cannot explain cooperation in one-shot prisoner''s dilemmas.

  (6) But in the iterated prisoner''s dilemma, cooperation can emerge from reciprocity
  and repetition alone, without any promise.

  (7) So promises are either useless (because repetition already handles cooperation)
  or impossible sources of obligation (because no one can will a new sentiment). Either
  way, the whole practice of promising seems to be a wheel that turns nothing.


  Where does this go wrong? I''d like to keep the game-theoretic point that one-shot
  defection is rational, but I also want to keep something like Hume''s view that
  promises are human inventions. So which premise should I reject, and what does rejecting
  it cost me? Please go through the argument step by step. And please write the answer
  in American English.


