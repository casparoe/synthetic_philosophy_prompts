  Let me think about game theory substance. The two farmers: each needs the other''s
  help; helping today costs labor, receiving help tomorrow benefits. If they could
  both cooperate (help each other), both gain; but there''s a timing problem—first
  helper may be exploited. This is akin to a sequential/reciprocity problem, maybe
  a "trust game" rather than PD. In a trust game: first player can cooperate (help)
  or defect; if cooperate, second can reciprocate or defect; unique subgame-perfect
  equilibrium with pure self-interest is no cooperation. But with repetition (seasons
  change) and indefinite horizon, cooperation can be sustained via trigger strategies.
  The argument could be about whether this is a one-shot PD or assurance game. Actually
  the one-shot PD requires simultaneous choices with temptation to defect while partner
  cooperates; each farmer''s choice is sequential and conditional, more like a trust/reciprocity
  exchange ("exchange game"). A good adjudication can say: the corn example isn''t
  a one-shot PD because the payout structure is temporally sequential and each party''s
  strongest temptation is to accept help then not reciprocate, which is the trust
  game; the "mutual confidence and security" is exactly what conventions/promises
  solve; iteration plus reputation and indefinite repetition can make cooperation
  a Nash equilibrium via conditional strategies (tit-for-tat).


  The two sides in the disagreement:

  - Person A (say Sam): insists Hume''s corn case is the prisoner''s dilemma: both
  would be better off if both worked than if neither did, but each individually would
  rather not work and still get helped, so mutual defection results. Cooperation requires
  convention/moral enforcement.

  - Person B (say Dana): says it can''t be a prisoner''s dilemma because the choices
  aren''t simultaneous: your help comes first and my help later; the temptation is
  to free-ride after receiving help, not to defect while the other is cooperating.
  It''s more like a sequential trust game, and "tit-for-tat" doesn''t even apply as
  stated because each round is sequential.

  - Sam replies: but the expected-payoff matrix still has Hong? The logic that individually
  rational choices lead to jointly worse outcomes is exactly PD-like; whether simultaneous
  or sequential just changes which strategy implements cooperation (start with help,
  then conditional reciprocity).

  - Dana replies: calling it PD misdescribes what the convention must do; the convention
  isn''t solving free-riding in simultaneous contribution, it''s solving the credibility
  of future reward—an assurance/trust problem about whether a promise will be kept;
  Hume''s point is that promises are artificial devices to secure the sequential exchange,
  and that''s closer to an assurance game plus commitment.

  - Maybe another round: Sam: "But in the one-shot setting neither will start, exactly
  as in PD each defects; and in the iterated setting, conditional cooperation evolves,
  which is Axelrod''s key result. So your complaint is purely about the order of moves,
  not the incentive structure." Dana: "The order of moves is the incentive structure;
  in a true simultaneous PD, if I knew you would cooperate, I''d still prefer to defect,
  but in the corn case if I knew you''d help me tomorrow, I''d prefer to help today—the
  problem is believing you''ll do it. That''s a different strategic situation."


  These are genuinely decent points on both sides; adjudication can be nuanced: the
  corn example is not one-shot PD; it''s a sequential exchange/trust game (or "stag
  hunt"-like?); the farmers'' problem is closer to an assurance game with temporal
  asymmetry and bargaining/coordination; iteration turns it into a repeated game where
  folk-theorem strategies can sustain cooperation, related to Axelrod but not identical.
  Both are partly right. Also the passage says "I will not, therefore, take any pains
  upon your account; and should I labour with you upon my own account, in expectation
  of a return, I know I should be disappointed" — showing the problem is confidence
  in the other''s future reciprocity, not simultaneous temptation. Good.


