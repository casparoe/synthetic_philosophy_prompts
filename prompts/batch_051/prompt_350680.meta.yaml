  Weber''s Protestant ethic thesis: In "The Protestant Ethic and the Spirit of Capitalism",
  Weber argued that the ascetic Protestant branches (Calvinism, Puritanism, Pietism,
  Methodism, Baptists) produced an ethical orientation—diligence, thrift, methodical
  work as a calling, anxiety about election leading to disciplined labor and ascetic
  saving—which was causally significant in the emergence of modern rational capitalism
  in Northern Europe/early America. The "spirit of capitalism" is the ethos of treating
  moneymaking as an end in itself and a duty, with rational bookkeeping and reinvestment
  rather than consumption. Later in the "Protestant Ethic" and elsewhere, Weber addressed
  "Protestant sects" and the "economic ethic of world religions," arguing culture/ideas
  are not just superstructure but can shape economic conduct, while also stressing
  that his claim is not that capitalism was caused by religion alone, nor that religion
  is the only cause. Key concepts: elective affinity (Wahlverwandtschaft) between
  Protestant ethic and capitalist spirit; rationalization/disenchantment; the unintended
  consequence: once capitalism is established as an iron cage, it no longer needs
  religious support (the famous last pages). The problem of explaining with values:
  can "values" or "culture" be a cause in scientific explanation, or are they epiphenomenal?
  Weber wanted a middle path between idealist and materialist monocausal accounts.


  Now translate into the vocabulary of a policy economist / empirical social scientist
  who thinks in terms of causal inference: potential outcomes, treatments, identification,
  confounding, mediators, mechanisms, heterogeneous treatment effects, exclusion restriction,
  natural experiments.


