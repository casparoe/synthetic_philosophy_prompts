  - Weber''s notion of "meaning adequacy" (Sinnadäquanz): an explanation counts when
  the action is understandable in terms of the agent''s subjective meaning; causal
  adequacy alone insufficient. Modern causal inference has no room for interpretive
  understanding; it treats all mechanisms as conditional independence structures.
  But some aspects can be modeled as intentional action under beliefs (religion changed
