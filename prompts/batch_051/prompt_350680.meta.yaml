  - Outcome: adoption of capitalist spirit: savings, reinvestment, bookkeeping, entrepreneurship,
  work hours.

  - Mechanism/mediator: religious anxiety about election → methodical conduct as a
  sign; calling as secular asceticism; prohibition of consumption → accumulation.

  - Counterfactual: without the Reformation/Calvinism, would rational capitalism have
  emerged? Weber''s comfort with counterfactual? He says maybe not with same timing/pace.

  - Confounders: Protestant regions were also more urban, commercial, literate, had
  Northern European institutions; cities that adopted Reformation may have been already
  more bourgeois; geographic and political factors. Reverse causation: merchants adopted
  Protestantism because it suited them ("elective affinity"). Selection: those with
  bourgeois values converted.

  - Identification strategy: Weber relies on historical comparison, not randomization.
  He compared Protestant vs. Catholic regions in Germany (Baden) using occupations
  and school enrollment stats; early data analysis. Modern empirics use natural experiments
  (e.g., forced conversions, laws).

  - Heterogeneous effects: only ascetic branches, not Lutheranism, had this effect.
  Mediation analysis: through literacy? social networks?

  - Potential outcomes vocabulary: unit = region/city/individual; treatment = denomination;
  potential outcomes weird because religion is not manipulable in a clean sense, no
  SUTVA? Spillovers: Protestant ethic affects even Catholics through labor markets/culture.


