  Option 1: Legal interpretation + Type C


  ---


  I have settled, tentatively but with some conviction, on a textualist account of
  statutory interpretation. As I understand it, the view is this: the meaning of a
  statute is fixed by the ordinary public meaning its words would have had to a competent
  speaker of the relevant language at the time of enactment, read in the context of
  the whole text and the publicly available legal context; it does not consist in,
  and is not fixed by, what any legislator privately intended, expected, or would
  have preferred, nor by post-enactment claims about "purpose." Canons of construction
  are acceptable to me only as probability-like guides grounded in how language is
  actually used, not as free-floating tools for making statutes reasonable or just.
  I hold this view because it seems to make statutes into public, stable objects that
  citizens can rely on and that judges do not partly author; it also strikes me as
  the only honest response to the fact that "legislative intent" over a multimember
  body is usually a fiction.


  I want you to test this position rather than merely restate its merits. What would
  count against it? Map the position''s exposure: which actual or possible legal cases,
  linguistic facts, and philosophical arguments would be decisive against it, which
  would merely be awkward, and which a committed textualist should themselves concede
  as counting against the view. I especially want you to test the places where the
  view might have been insulated by qualification: for example, when "ordinary meaning"
  comes apart (cases of ambiguity, vagueness, surprising applications), does the view
  fall back on canons and other devices that quietly smuggle in purpose or consequence,
  and if so, is that a refutation-by-stages or a tolerable refinement? If you think
  my statement of the position is too loose to be testable — if "ordinary public meaning"
  or "context" are doing more work than I have acknowledged — say so plainly and evaluate
  the sharpest version you think a textualist could accept, rather than a straw man.


  Two more things. First, you may tell me that the question is badly posed — that
