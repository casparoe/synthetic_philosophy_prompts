  Draft:


  "Please produce a decision tree for a handout in a philosophy of behavioural economics
  seminar. The tree should sort a respondent from their answers to a series of diagnostic
  questions into one of seven positions on whether loss aversion and the endowment
  effect are cognitive biases to be corrected or legitimate preferences to be respected.
  Do not organise the tree around the names of positions; organise it around the questions
  on which the positions genuinely come apart. Proceed in this order: first lay out
  the branching questions and the full matrix of answers they allow; then place the
  actual positions in that space; then note any combinations of answers that no one
  occupies, with a one-sentence diagnosis of why (incoherent, unattractive, or merely
  unexplored); finally flag any pair of positions that the tree cannot separate.


  Each branching question should be answerable from a concrete case without already
  knowing the labels. The following three cases must appear somewhere in the questions.
  (1) The standard mug experiment: participants randomly assigned to receive a mug
  demand roughly twice as much to sell it as participants who were not given the mug
  are willing to pay for it. (2) A salaried worker who would strongly resist a 10
  per cent nominal pay cut but barely notices a 10 per cent real-terms erosion through
  inflation. (3) A person who would sell an investment flat without hesitation at
  market price but demands far more for the home they have lived in for twenty years,
  even though the two properties are identical in market value.


  The leaves must include at least the following positions, named where a standard
  name exists and ''unnamed'' where one does not: the pure bias view, on which the
  loss/gain asymmetry is a processing error that the agent would not endorse on reflection;
  the legitimate-preference view, on which ownership and reference points can genuinely
  change what a good is worth to a person; the ecological-rationality view, on which
  the asymmetry is an adapted heuristic that tracks real asymmetries in the environment
  and is not a bias even where it misfires locally; a domain-sensitive mixed view,
  on which the asymmetry is a legitimate preference in some domains and a correctable
  bias in others; an institutional debiasing view, on which the asymmetry is a bias
  and choice architecture should correct for it; an institutional respect view, on
  which even a bias should be respected rather than engineered away; and a deflationary
  view, on which there is no context-free preference with which the loss-averse choice
  could be compared, so the bias/preference distinction itself needs to be given up.
  If your tree generates additional leaves, include them and explain their relation
  to these seven.


  Aim for six to eight leaves in total, keep the handout suitable for advanced undergraduates,
  and write the entire answer in British English."


