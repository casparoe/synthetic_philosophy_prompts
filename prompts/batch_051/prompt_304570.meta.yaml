  Let me think about the actual political theory content to keep straight.


  Sortition: random selection of citizens for public office. Key features:

  - Descriptive representation: a randomly selected mini-public resembles the population
  better than elected officials (with adequate sample size and participation).

  - Rotation: ancient Athens used sortition and rotation, preventing professional
  politician class; Aristotle: election is aristocratic/oligarchic, lot is democratic
  (ancient democracy, but women/slaves excluded — maybe avoid specifics).

  - Deliberation requires support: information, time, facilitation; random people
  are not expert. Sortition bodies are often advisory or agenda-setting (citizen assemblies
  recommend; the elected body decides) or given scrutineering/audit functions. If
  a sortition body gets real decision power, who is accountable? You can''t vote them
  out. Electoral accountability mechanisms don''t apply; transparency and publicity
  become the accountability substitute. So a proposal should be scrutinised for accountability
  gap.

  - Statistical representativeness vs. willing participants: self-selection bias if
  opt-in; stratified sampling with weights; small n → not a "miniature of the people".
  Need a minimum size and compensation for broad participation.

  - Capture: random selection can be gamed (corrupt the lottery, define the pool),
  and within the panel, organisers/facilitators and agenda-setting have power. Sortition
  doesn''t remove power asymmetries; it moves them.

  - Mandate and legitimacy: what exactly is the panel asked to do? If the question
  is vague, organisers dominate. Sortition is best when the mandate is specific and
  the decisions are tractable.


  Term limits: restrict how long an officeholder may serve. Purported benefits: prevent
  entrenchment/incumbency advantage, circulation of elites, reduce corruption/careerism;
  costs: loss of expertise and institutional memory, increased power of permanent
  staff/lobbyists (who become the memory), lame-duck accountability loss, politicians
  may behave differently in final term (accountability via re-election gone), rotating
  amateurs may be more dependent on lobbyists. Empirical note: term limits often strengthen
  the executive branch/bureaucracy/lobbyists in US state legislatures (careful about
  referencing studies; can phrase as "the standard finding in the literature is...").
  Also term-limited legislators may shore up future careers, "where do they go next"
  — many run for other office, turning into career politicians across offices rather
  than in one office. This is a real point: term limits can convert stationary careerism
  into ambitions across a ladder of offices, with more churn but not less careerism.
  That''s in-the-weeds and useful.


  Career politicians: people who spend working lives in elected office. Concerns:
  they become a separate class, disconnected from constituents'' work lives; incentives
  to prioritise re-election over policy; entrenchment. But counterpoints: experience
  and competence are real; amateur politicians may be captured by advisers; "career
  politician" as a pejorative can be anti-democratic (who has the resources to serve
  briefly? Only the wealthy or retirees). Professionalization (paying salaries) is
  what allows non-rich people to be politicians, which paradoxically creates career
  politicians — tension between descriptive/participatory inclusion and rotation.
  Also term limits may return politics to amateurs who can afford it, i.e., the rich,
  reducing SES diversity. That''s a nice tension for the procedure.


