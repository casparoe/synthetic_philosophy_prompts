  The concept "complicity" is contested. In legal and moral philosophy, complicity
  is about being implicated in another''s wrongdoing without being a principal perpetrator.
  Key questions:

  - Does complicity require a causal contribution? Many accounts say no: the getaway
  driver doesn''t cause the robbery but is complicit. So "participating in wrongdoing
  without causing it" is exactly the domain.

  - Does it require knowledge/intent? Mens rea: you can be complicit if you know you''re
  facilitating; unwitting facilitation usually not complicity.

  - Does it require that your act actually helps? If you keep watch but your friend
  doesn''t need you, are you complicit? Many say yes because of agreement/encouragement.

  - Is complicity about causal contribution, about making success more likely (counterfactual
  dependence), about signaling/endorsement, about shared intentions, about benefiting?


