  The paradox of blackmail (also "the blackmail paradox"): Suppose X threatens to
  reveal embarrassing true information about Y unless Y pays X. Revealing the information
  is legal (assume it''s true, not defamatory, not a breach of confidence); demanding
  money is legal in general; so why is the combined threat illegal? More generally,
  it''s legally permissible for A to do α and permissible for A to do β, but impermissible
  for A to do α-and-β. This is a "two rights make a wrong" puzzle. Philosophical work:
  e.g., by James Lindgren, Leo Katz, Mitchell Berman, etc. But no need to cite.


  An argument that seems to prove too much could run:

  (1) It is legally and morally permissible for me to tell people a true, damaging
  fact about you (assuming I came by it honestly).

  (2) It is legal and generally permissible for me to ask you for $1,000.

  (3) If two acts are each permissible, then doing them together or one conditional
  on the other can''t make the whole wrong.

  (4) Blackmail is just: I ask you for $1,000 and make the asking conditional on not
  doing (1) — I offer to stay silent in exchange for payment, i.e., threaten to tell
  if you don''t pay.

  (5) So blackmail is permissible.

  (6) But blackmail is clearly wrong/illegal.

  (7) So one of (1)-(3) must be false.


