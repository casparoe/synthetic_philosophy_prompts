  Premise (3) is a candidate: permissions don''t agglomerate. In deontic logic, permission
  doesn''t close under conjunction: Perm(A) and Perm(B) doesn''t imply Perm(A&B).
  This is the standard formal resolution (deontic logic, e.g., free choice permission
  puzzles). But is that satisfying in the blackmail case? The conjunction "ask for
  money while threatening to reveal" — the wrongdoing arises from the conditional
  threat. There''s also the idea that although each act individually is permissible,
  the conditional threat uses the threat of a permissible act as a means of coercion,
  and coercion can be wrongful even when the threatened act is permissible (cf. "threats"
  vs "offers"; Nozick''s coerciveness; the difference between a threat to do something
  you have a right to do and an offer). Another angle: blackmail''s wrongness is in
  exploiting the victim''s vulnerability, not in the two acts; the proposal is a coercive
  proposal because it worsens the victim''s situation relative to a baseline. The
  baseline matters: if the blackmailer would not have revealed anyway and now proposes
  to withhold the info for payment, is it a threat or an offer? There''s a huge literature.


  Also there''s a legal answer: the two acts aren''t both fully legal once combined;
  the threat to reveal is "with intent to extort". But that''s circular for the paradox.
  Another candidate: premise (1) is false as a normative claim — it''s not morally
  permissible to gratuitously reveal a damaging truth; permissibility is defeasible.
  But if it''s only a legal permission, premise (3) fails anyway.


