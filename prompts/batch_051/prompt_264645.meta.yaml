  ---


  I''m assembling a unit on the philosophy of artificial intelligence and want to
  set E.M. Forster''s The Machine Stops alongside the recent discussion of epistemic
  dependence and the erosion of understanding. The novella gives us a society in which
  people live alone in underground cells and have handed over nearly every material
  and intellectual task to a single, centralised Machine: it carries them, communicates
  for them, and selects what they need to know, so that knowledge tends to reach people
  second-hand. Vashti is largely content with this arrangement, while her son Kuno
  insists on the difference between having an answer delivered and knowing the thing
  for oneself. I''d like a careful reading of the story through the lens of the contemporary
  worry that outsourcing cognition to AI can erode understanding rather than merely
  extend it: the idea that a person can have every answer available at hand without
  grasping the matter, and that a society can quietly lose the second while retaining
  the first.


  My working hypothesis is that Forster dramatises something the philosophical literature
  often underplays, namely that the loss of understanding is not simply a cognitive
  deficit but a shift in what people value, trust, and find intelligible. At the same
  time, I am wary of flattening the novella into a straightforward allegory for today:
  the Machine is a single, dependable, centralised authority, whereas present AI systems
  are distributed, fallible, and commercially shaped, and the story''s ending turns
  on a total infrastructural collapse that does not map cleanly onto present risks.
  I''d therefore like a reading that is faithful in both directions: show where the
