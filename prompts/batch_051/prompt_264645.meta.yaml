  touch, and increasingly no longer know how anything works, because the Machine knows
  and does it for them. I want to read the story through the lens of the contemporary
  worry that offloading our cognition to AI systems may erode our understanding rather
  than merely supplement it — the idea that there is a difference between having an
  answer available and understanding the matter oneself, and that a society can quietly
  lose the second while keeping the first.


