  ---


  I''m a student taking a course on concepts and categorization, and we''ve been reading
  Hofstadter and Sander''s *Surfaces and Essences*. The book''s central claim is that
  analogy-making is not one cognitive operation among many but the core of all thought:
  a concept, on their account, is not a fixed definition or a list of necessary and
  sufficient conditions, but a growing repertoire of remembered exemplars, and every
  time we apply a concept to a new situation we are making an analogy between the
  present case and those earlier cases. Because no two situations are ever exactly
  alike, even "literal" categorization is analogical; what differs is only how much
  slippage and abstraction the mapping requires. Categories get stretched, re-weighted,
  and reorganized each time they are used.


  Last week, in a jurisprudence class, we covered common-law reasoning by precedent,
  and I could not stop seeing it as a special case of this. A judge deciding a case
  does not just mechanically apply a rule with a fixed extension; the court compares
  the facts of the present case to the facts of earlier cases, asks whether the resemblance
  is close enough to bring the present case under the same principle, and may "distinguish"
  a precedent or extend it to a new fact pattern. The ratio decidendi of a case is
  not stored as an exact verbal formula; it is reconstructed retrospectively, in light
  of the new case it is being mapped onto. It seems to me that legal doctrines are
  exactly concepts in Hofstadter and Sander''s sense: precedents are exemplars, the
  ratio is the essence extracted through mapping, distinguishing a case is introducing
  a slippage, and common-law development just is analogical concept change.


  I am not sure whether this is a real identity of structure or just a seductive analogy
  about analogy-making. I would like you to act as a philosopher of cognitive science
  who also knows jurisprudence. Please first brainstorm the most precise possible
