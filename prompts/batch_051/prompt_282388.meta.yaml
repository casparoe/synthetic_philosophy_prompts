  Enactivism (in its strong form) says cognition is constituted not just by internal
  brain processes but by the dynamic interaction between an organism and its environment;
  the environment is not just input to a representation-building device but part of
  the cognitive loop. Representationalism says cognition involves internal states
  that stand for (represent) features of the world, and behavior is guided by such
  representations.


  A thought experiment where they come apart: a task where a person uses an external
  scaffold (a notebook, gestures, rearranging objects) to solve a problem they couldn''t
  solve "in the head." The representationalist says the scaffold is just a tool; the
  real cognition (the understanding, planning, decision) is internal representations,
  with the scaffold as external input/output. The enactivist says the representation
  claim is doing no work: the loop between person and scaffold is the cognitive process,
  and there''s no need to posit a rich internal model.


