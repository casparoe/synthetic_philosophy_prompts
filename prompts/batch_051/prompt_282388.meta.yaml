  Full prompt:


  "I''m a science-and-ideas journalist working on a piece about the old fight between
  enactivism and representationalism about the mind. My problem is that after a week
  of reading I still can''t find a clean example where the two views don''t just tell
  the same story in different words. So I''d like you to construct me a thought experiment,
  not a literature review. Here''s what I want.


  Two positions as I''ll use them: (1) representationalism says a mental act is, at
  bottom, the manipulation of internal states that stand for the world; perception
  and thinking happen in the head, with the body and environment as inputs and outputs.
  (2) enactivism says the mental act is a kind of skilled doing — a whole situated
  loop between a body and its environment — and that no inner item is doing the real
  cognitive work. Don''t dispute my summary; just use it."


  Then the spec:


  "Construct a single ordinary-life scenario, set in a job where someone thinks with
  their hands (a mechanic, a piano tuner, a pastry chef, a midwife — your pick). There
  are two conditions that differ in only one respect. In the active condition the
  person controls their own sensing: they can tap, probe, ask, jiggle, sample, reposition.
  In the passive condition, give them the very same sequence of proximal sensory input
  — whatever the active person felt, heard, and saw, in the same order — but without
  the ability to act back on the scene: they watch the probes happen, their hands
  stay still, they can''t choose the next sample. Keep everything else fixed. The
  two theories must agree about everything the person then says and does afterward;
  what I want them to disagree about is one sharply-phrased question: is the passive
  person''s achievement the same kind of cognitive act as the active person''s, or
  did the passive person merely have information delivered to them, not perceive it?
  The scenario should be engineered so the representationalist has to say yes and
  the enactivist has to say no, but not trivially — the representationalist shouldn''t
  come out looking as if they just defined perception as a passive receiving, and
  the enactivist shouldn''t come out looking as if they simply refuse to call anything
  passive perception."


  Then response sections: "Please give me exactly four sections: ''The scenario''
  (about 250 words, concrete, no jargon). ''Where they part company'' (about 350 words:
  state what each theory says about each condition, then isolate the premise the enactivist
  rejects and the representationalist accepts — I expect this to be the place you
  show readers the real argument). ''The load-bearing feature'' (about 150 words:
  name the single feature of the case that does the work, and what happens if you
