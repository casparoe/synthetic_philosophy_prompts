  ---


  I cover science and ideas for a general-interest publication, and I am drafting
  an essay on emergency measures — the first-wave lockdowns and various border controls
  — and the relation between their legality and their legitimacy. My working claim
  is that emergency conditions reveal legality and legitimacy to be not merely distinct
  but supported by different justificatory registers, and that public argument keeps
  sliding between them unnoticed.


  The essay develops two ideas. The first is a simple fourfold scheme: an emergency
  measure can be (a) legal and legitimate, (b) legal but illegitimate, (c) illegal
  but legitimate, or (d) neither. The traffic that interests me runs through (b) and
  (c), because emergencies make them not marginal anomalies but the central cases.
  The second idea is a phenomenon I have been calling borrowed legitimacy: a measure
  is authorized under one title — a broadly delegated statutory power, a public-health
  order, a plenary sovereign power over entry — while it is publicly defended under
  a different title, such as protecting the vulnerable or preventing system collapse.
  The substantive defense does most of the legitimating work, but the legal basis
  is what carries the action; objections addressed to one title are answered by re-describing
  the measure under the other. My anxiety is that this diagnosis may be too neat,
  and that I may be missing exactly what makes the legality-legitimacy gap stable
  rather than merely rhetorical.


  I would welcome comments on the essay''s spine before I send it to an editor. Specifically:
  (1) Does borrowed legitimacy mark a single coherent phenomenon, or does it run together
  legal validity, normative justifiability, and popular acceptance in a way that obscures
  more than it explains? (2) Is my central case too convenient, given that many emergency
