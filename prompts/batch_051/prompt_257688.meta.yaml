  Let me think about the actual asymmetry to make sure it''s defensible and interesting.


  Asymmetry: Suppose a friend, generally honest and sane, tells you she saw something
  unusual but mundane—say, a coyote in a city park where coyotes are rare but not
  unknown, or she briefly met a famous actor at an airport. You''d likely believe
  her, integrate it, maybe tell others. Now suppose the same friend tells you she
  had a religious experience: during a time of grief she felt an overwhelming presence
  of her late father or of God, felt spoken to, and as a result is confident there''s
  something beyond the physical world. Many people (including many theists) would
  treat the first report as evidence and the second as a psychological event—comfort,
  wishful thinking, a trick of the brain—without giving it the same evidential weight.


  Is there a principled difference? Candidate justifications:

  1. Prior probability: the religious claim is a massive metaphysical claim, so even
  a reliable reporter can''t overcome the low prior. But then should the coyote report
  be believed? Coyote in park has higher prior. So asymmetry tracked by prior probability,
  not by the type of experience. Then the question: is that all, or is there an additional
  discount for religious experiences beyond what priors justify?

  2. Availability of ordinary explanations: grief, stress, sleep, emotional need.
  But ordinary perception also has biases; the question is whether we have better-calibrated
  error rates for mundane sightings than for religious experiences.

  3. Cross-cultural inconsistency: religious experiences vary by tradition (Christians
  see Mary, Hindus see Krishna), suggesting they''re shaped by culture. But mundane
  reports also vary.

  4. Verifiability/public checkability: you could ask others if they saw the coyote,
  there might be paw prints, cameras. A religious experience is private, uncheckable.
  Is privacy itself an epistemic defect? We accept plenty of private experiences (a
  pain, a dream) but we treat them as evidence for psychological states, not external
  realities consistent with content.

  5. We take the report as strong evidence she had an experience, but not as evidence
  that the experience''s content corresponds to reality. But that''s exactly the distinction:
  for the coyote, the experience''s content is the external fact; for the religious
  experience, maybe we think experience underdetermines its cause.


