  ---


  I''m not a philosopher, just someone who keeps finding himself in long arguments
  with friends, but a recent conversation has been nagging at me and I''d like it
  worked through rigorously. Last spring a friend of mine — sober, careful, not given
  to inventing stories — told me she had seen a bobcat in the city park near her apartment,
  well outside where bobcats are normally found. I believed her without much hesitation;
  I didn''t demand a photograph, and I quietly updated my picture of what can show
  up in that park. A few months later the same friend told me that, during the weeks
  after her mother died, she was sitting alone one evening when she was suddenly flooded
  with the sense of a presence — something she described as being held and quietly
  spoken to — and she came away convinced that some reality beyond the physical world
  had made contact with her. What struck me was that I (and the others she told) treated
  this second report entirely differently. Nobody accused her of lying, and nobody
  denied she''d had the experience. But we reached for psychology — grief, exhaustion,
  the mind''s hunger for comfort — and none of us treated this experience as even
  weak evidence that such a presence exists. Yet on the surface both cases are first-person
  reports from a reliable informant about a surprising experience; both could easily
  be mistaken; and both would be important if true, though in rather different ways.
  One surprising report updated our picture of the world, while the other only updated
  our picture of her.


  What I want to know is whether this asymmetry in how we treat the two reports is
  defensible, or whether it is just a comfortable double standard. I don''t want the
  obvious answers — that the second claim is far less likely, or that there''s a familiar
  natural explanation for it — unless they''ve been tested. A bobcat in a city park
  is also unlikely, and ordinary perception has its own known failure modes. By the
  same token, we often accept entirely unverifiable first-person reports of pain,
  love, or dreams without treating them as evidence about the world, so privacy alone
  can''t be the whole story. A good answer should tell me which feature is actually
  doing the epistemic work: that the claim is about something supernatural, that the
  experience is uncheckable by others, or that a ready psychological story can be
  told about it. If the asymmetry should be kept, I want the exact principle that
  keeps it; if it should be revised, I want to know what a more consistent practice
  would look like.


  Act as a careful epistemologist — someone who thinks rigorously about how we should
  form and revise beliefs on the basis of experience and testimony. Think through
  candidate principles before committing, and don''t let the first plausible-sounding
  distinction stand untested. Structure your answer exactly as follows:


  1. Brainstorm (roughly 120 words): list the main distinctions someone might appeal
  to in order to justify treating the two reports differently.


  2. Bottom line (roughly 120 words): lead with your overall answer — whether the
  asymmetry is justified, should be revised, or should be abandoned.


  3. The case for the asymmetry (roughly 300 words): build the strongest version of
  the argument that the two cases differ in an epistemically relevant way.


  4. The case against the asymmetry (roughly 300 words): build the strongest version
  of the argument that the difference in treatment is a double standard.


  5. Stress tests (roughly 250 words): test the leading justifications against nearby
  cases — improbable secular sightings, unverifiable private experiences, conflicting
  religious experiences across traditions, and anything else that puts real pressure
  on them.


  6. My verdict (roughly 200 words): say which principle, if any, survives testing,
  and state the defensible version of the asymmetry or the more consistent practice
  that should replace it.


  ---


