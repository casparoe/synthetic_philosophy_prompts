  punish businesses for food that is contaminated even when their safety procedures
  were excellent; we fine companies for pollution even when a hidden defect caused
  the discharge. These offenses aren''t about calling someone morally evil. They attach
  a civil-style penalty to an activity the state permits only conditionally — the
  owner is told that selling alcohol carries the risk of undetectable fakes, and the
  fine is part of the cost of that license.


