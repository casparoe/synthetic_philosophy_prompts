  For some rules, society assigns the responsibility to the person best placed to
  prevent the harm, whether or not they were careless in a particular case. If we
  allowed a mistake-of-age defense, any seller could escape by claiming to have been
  fooled, and the rule would lose its bite. The rule is there to make the sale to
  a minor never happen on his watch, not just to discourage sloppy checking.


