  I''ve recently gotten interested in a philosophical puzzle about self-prediction.
  A member of a reading group I''ve been attending put the issue this way. When you
  deliberate about whether to do something, you are simultaneously in the position
  of the one who chooses and the one who would like to predict what the chooser will
  do. He argued this is like trying to take a thermometer reading while the thermometer
  is immersed in and changing the very bath it measures: the measurement perturbs
  the measured system, so the reading one obtains is not a reading of the original
  system at all. By analogy, he said, assigning a probability to your own future choice
  while you are still deliberating is self-undermining—the assignment feeds back into
  the deliberation and changes the thing it was supposed to predict, so no well-defined
  target remains. His conclusion was that decision theory goes wrong when it models
  an agent as holding credences over her own available acts; genuine deliberation
  displaces prediction.


  As someone who spent his career in the physical sciences, I find the analogy attractive
  but perhaps too neat. My former colleagues would ask: what plays the role of the
  bath, the thermometer, the immersion, the unperturbed temperature, and the final
  reading? They would also want to know where the analogy breaks. A deliberating agent
  is not a passive system coupled locally to an instrument; she can reason about the
  fact that she is making a prediction; she can make a binding decision first and
  predict after; and the choice need not exist as a determinate fact before deliberation
  in the way a bath has a determinate temperature before measurement.


  So my question is: audit this analogy properly. Give the correspondence table mapping
  the measurement picture onto the self-prediction puzzle, then separate the disanalogies
  that matter for the intended conclusion from the ones that are merely cosmetic.
  Which features of measurement does the analogy quietly import that a deliberating
  agent need not have, and does the conclusion—that you cannot rationally assign probabilities
  to your own choices while deliberating—survive once those imports are removed? Finally,
  is there a better analogy from measurement, control theory, or elsewhere that captures
  whatever is genuinely right about the view, and where does that improved analogy
  set the boundary between permissible self-prediction and self-undermining?


