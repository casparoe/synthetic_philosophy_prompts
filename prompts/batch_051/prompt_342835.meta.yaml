  anonymised vote market. Voters post sell orders through a blind intermediary; buyers
  post bids; the exchange happens without either side learning who the other is, payment
  is in some untraceable token, and the system is designed so there is no bargaining,
  no public record of who sold, no social meaning attached to a particular transaction.
  It becomes, in effect, a silent automated drip of voting rights from people who
