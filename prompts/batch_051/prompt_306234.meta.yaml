  Prompt draft:


  "Take on the role of a political philosopher who teaches a seminar on Rawls and
  social movements, and think carefully before you answer. I got into an argument
  with a friend about Occupy Wall Street: he kept saying the whole thing was just
  envy – middle-class kids mad that they didn''t get to be bankers – while I was defending
  the protestors. I''ve been rereading A Theory of Justice, and I''m struck by how
  much machinery Rawls actually devotes to exactly this move, because he wants to
  forestall it. From what I remember, Rawls distinguishes envy proper (hostility toward
  a greater good that doesn''t actually subtract from yours) from resentment (a properly
  moral response to having been wronged), and then he introduces this third category,
  ''excusable envy,'' for cases where the gap between rich and poor is so big, and
  the worse-off are so pervasively made to feel their inferior status, that the envy
  stops being morally blameworthy even though it''s still a vice and not itself a
  claim of justice. I want to use Occupy as a real test case for that framework. Treat
  the movement''s participants as the ''players'' and their publicly expressed grievances
  (''We are the 99%,'' the anger at the bank bailouts, the focus on economic inequality
  rather than on a specific theft or breach) as the evidence. First, lay out the Rawlsian
  distinction in your own words and state, as precisely as you can, the test that
  would let you classify an episode as resentment versus excusable envy versus plain
  envy. Then apply that test to Occupy, and be explicit about where the evidence is
