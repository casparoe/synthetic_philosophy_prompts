  Let me think about the content of the translation prompt to ensure it is meaningful
  without web access and rests on common knowledge. The units of selection debate:
  key ideas:

  - Replicator vs vehicle (or interactor) distinction: replicators are entities whose
  copies survive across generations (genes); vehicles/interactors are entities that
  interact with the environment and whose survival/reproduction is the proximate target.

  - Gene''s-eye view: selection can be seen as acting on genes; organisms are survival
  machines / vehicles built by genes.

  - Individual selection: the organism (phenotype) is the primary unit; genes are
  selected indirectly through phenotypes.

  - Group selection: groups of organisms can be units; traits evolved because they
  benefited the group even at a cost to individuals within groups (altruism).

  - Hierarchical levels possible: selection at multiple levels.


  Programmer vocabulary possibilities:

  - Source code vs running binary/process; classes vs instances; functions; libraries;
  packages; repositories; forks/branches; commits; merge; refactoring; inheritance;
  dependency graphs; compilation; runtime.

  - Gene as a function/class definition (a sequence of instructions that gets copied);
  organism as an instance or process (a running instantiation of the code); population
  as a fleet of instances.

  - Individual selection: instance-level performance (does this process stay alive
  and spawn?) The code selected only via instance uptime.

  - Gene selection: function-level selection: functions get copied if the processes
  that run them spawn more child processes, regardless of the overall process''s death.
  "Selfish gene" as the gene (function) is the thing with a temporal continuity because
  the code line persists while instances die.

  - Group selection: codebase/repo-level selection: whole groups of functions get
  selected/replaced even if some functions are individually maladaptive, because the
  repo deploys in an environment; group-level traits like modularity.

  - Replicator vs vehicle: code vs process, or bit string vs machine.

  - Bottleneck/life cycle: the build step / deployment. In Dawkins, life cycle bottlenecks.
  Could map to continuous integration.


