  history is strongly influenced by the growth of human knowledge; (2) we cannot predict,
  by rational or scientific methods, the future growth of our scientific knowledge
  (because to predict future knowledge is to have it now, a logical impossibility);
  (3) therefore we cannot predict the future course of human history. (4) This refutes
  the possibility of theoretical history or historical laws like those of physics
