  Importance, tractability, neglectedness (ITN) is a heuristic used in cause prioritization
  (Open Philanthropy, 80,000 Hours). The idea: when choosing among problems to work
  on, consider:

  - Importance: how much good would be done if the problem were solved (scale).

  - Tractability: how much progress can be made with a given amount of resources;
  how solvable it is.

  - Neglectedness: how many resources are already devoted to it; marginal impact of
  additional resources.


  The framework is not literally "expected value of a problem = importance × tractability
  × neglectedness" as a multiplicative formula; the three factors are heuristics for
  estimating marginal impact. Common subtle errors:

  1. Treating neglectedness as valuable in itself rather than as a proxy for diminishing
  returns / room for more funding. Marginal value depends on tractability too; a neglected
  problem can still be intractable.

  2. Conflating importance with size/scale alone, ignoring how much of the problem
  is solvable, or with "severity" ignoring probability of success.

  3. Presenting the framework as a decision procedure that yields a ranking, rather
  than a heuristic for generating and evaluating options.

  4. Misunderstanding ITN as purely consequentialist/utilitarian quantitative formula;
  but it''s compatible with various values.

  5. Overstating: "the best cause is the one that scores highest on all three" vs.
  actual view that these are considerations to weigh, and trade-offs matter.

  6. Neglectedness is relative to a reference class and can be inflated by counting
  only exact interventions.

  7. Tractability isn''t just "easy"; a problem can be important and neglected but
  intractable, giving no reason to work on it.

  8. Combining them: some say EV = importance × tractability × neglectedness, but
  that''s crude; actually you estimate marginal good of additional resources = something
  like scale × solvability × (1 - fraction addressed) but log-normal uncertainty,
  etc.


