  Here are the three conditions I keep being given for something to be a unit of selection:
  (1) the units vary in some characteristic; (2) that variation is associated with
  differences in how many copies of themselves they leave — their fitness; and (3)
  the characteristic is heritable, so offspring units resemble their parents. I want
