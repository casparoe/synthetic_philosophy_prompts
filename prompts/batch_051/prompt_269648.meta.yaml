  I keep being given the following three conditions for identifying a unit of selection:
  (1) the units vary in some trait that affects their survival or reproduction; (2)
  that variation is associated with differences in fitness; (3) the relevant trait
  is heritable — offspring units resemble their parents. I want to stress-test these
  conditions on a case that sits awkwardly between "gene" and "individual": an active
  LINE-1 retrotransposon in a mammalian genome.


  [Describe LINE-1 in the asker''s words: A LINE-1 is a DNA sequence, typically 6,000
  or so base pairs long, that encodes the machinery for making copies of itself. An
  active copy is transcribed into RNA, and the RNA is then reverse-transcribed and
  inserted back into the genome at a new position; the copy resembles the parental
  sequence and will itself be inherited by the host''s offspring if the insertion
  occurs in a cell that becomes an egg or sperm. Hundreds of thousands of LINE-1-derived
  sequences exist in the human genome, but only a small minority are still active;
  most are truncated or mutated. Active copies differ from inactive copies in ways
  that affect their own copying, and an active copy can make more copies of itself
  even as it sometimes causes diseases or reduces fertility in the host organism.]


  Now apply the three conditions honestly. On their face, LINE-1 elements seem to
  satisfy all three: active and inactive copies differ; the differences are associated
  with different numbers of descendant copies; and a new insertion is inherited by
  the host''s offspring. But is a LINE-1 a unit of selection, or is it merely something
  that happens to replicate while the real unit is the host? Check each criterion
  carefully. Then say whether this case shows that the three conditions are too permissive
  — that they count things we would not want to call units — or whether ''unit of
  selection'' is actually doing double duty, and the conditions need to be split into
  something like replicators and interactors. If you think the concept needs to be
