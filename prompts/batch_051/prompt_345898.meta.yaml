  Summary of Mill on social sanction, plausible but flawed:

  "Mill''s point is that freedom of speech and action only protects you from the state.
  Society can shun you, fire you, deplatform you, and heap contempt on you, and none
  of that counts as punishment in Mill''s sense, because punishment is a legal category.
  In fact Mill thinks this is how society should handle bad behavior: if your conduct
  is harmful or even just offensive to others, they are entitled to punish you by
  opinion however severely they like — refuse to hire you, cut you off, publicly disgrace
  you — and your liberty is untouched because no law has been passed. So anyone who
  cites Mill against cancel culture has him backwards."


  This conflates a few things: (1) Mill doesn''t limit liberty protection to state
  action — he explicitly fears "social tyranny" as more formidable than political
  oppression and thinks the tyranny of prevailing opinion should be protected against.
  (2) Mill does distinguish "unfavourable opinion" and "avoidance" from active penalization/harm:
  we may avoid and warn, but not construe self-regarding conduct as a crime or "visit
  with... penalties". (3) Mill''s principle applies to social as well as legal coercion
  — he says the "tyranny of the majority" includes social penalties. (4) Offensiveness
  alone is not enough: distaste is not harm; self-regarding conduct is not properly
  punished by opinion either. (5) "however severely" is wrong — he limits social penalties
  to those arising naturally and proportional, and says we can''t "punish" people
  for self-regarding faults.


