  The Reflection principle (van Fraassen 1984): Rational agents should satisfy P_t(A
  | P_{t''}(A)=x) = x. In words: your current belief about A, conditional on your
  future self''s believing A to degree x, should itself be x. It encodes self-trust:
  you should treat your own future beliefs as expert, unless you have reason to suspect
  they''re irrational.


  The advice situation should instantiate: someone knows their future belief will
  differ due to a state they don''t currently endorse. The question: should they defer
  to future self now?


