  Me and my friend got into a long argument last night about how Christians are supposed
  to tell which commands in scripture were meant only for the original audience and
  which ones still bind people now. His whole position was that there''s a clean split
  between moral commands and stuff that''s just cultural or ceremonial: the moral
  ones carry over, the rest don''t. I kept saying it can''t be that clean once you
  actually go command by command, but I also couldn''t hand him a better principle,
  and it annoyed me. So I''m writing it out.


  Here are my honest gut calls on the cases, in no particular order; I''d rather find
  the principle that fits them than defend all of them.


  - The Levitical food rules (pork, shellfish, the whole list). Not binding on me,
  no hesitation.

  - The bans on mixing fibers and trimming the corners of a beard from the same part
  of Leviticus. Not binding, and honestly if someone tried to make them binding I''d
  think they''d lost the plot.

  - The Sabbath command. I keep a loose Sunday rest but I don''t think it''s literally
  the same command, and I''m genuinely undecided about whether it binds the way, say,
  stealing is wrong binds.

  - Women prophesying or praying with heads covered, from 1 Corinthians 11. My friend
  says this one has to be transcultural because Paul backs it with a creation-order
  argument. I think it''s local enough that we don''t have to observe it. That odd
  line about angels makes me less sure than I''d like, though.

  - The instruction a few chapters later that women should be silent in the churches,
  even though the same letter already has them praying and prophesying. I''m okay
  treating the silence thing as aimed at something local in Corinth, but I can''t
  give you a crisp reason for doing that with the silence text and not also doing
