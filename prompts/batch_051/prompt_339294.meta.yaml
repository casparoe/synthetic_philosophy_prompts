  Notes:

  The essay begins from the observation that not every hard choice is a comparison
  failure. Some choices are hard not because one item lacks value along the relevant
  dimension but because the options are, as some philosophers put it, on a par: neither
  is better than the other, and they are not exactly equal either. I accept this distinction.
  My target is the further thought, sometimes drawn from it, that in hard choices
  the will can permissibly resolve what the normative facts leave open, and that the
  difficulty of such choices is therefore not a symptom of incomplete reasons but
  a kind of local normative settlement by the agent.


  I want to resist that conclusion without giving up parity. My proposal is that parity
  is itself a sign that the covering value governing the choice is only partially
  specified. When a choice is hard in the parity sense, the values that make the options
  good are not yet precise enough to discriminate between them; there is no fact of
  the matter about which is better because the covering value does not have the structure
  to generate such a fact. Choosing, on this picture, is not a free exercise of the
  will but an act that completes or sharpens the covering value. The choice can be
  rational or irrational retrospectively: it is rational when it produces a specification
  of the covering value that coherently extends what was fixed before, and irrational
  when it merely discards what was fixed or contradicts it.


  The novelty, if any, is in the claim that the reasons one ends up with are partly
  constituted by the choice but are not merely chosen. I use an analogy with adjudication
  in a novel legal case: the judge is not bound before the decision, but the decision
  is constrained and can be better or worse by the light of the materials it must
  extend. The residual sense that ''this choice could rationally have gone the other
  way'' is then not brute; it tracks the fact that more than one coherent specification
  of the covering value was available before the choice. Parity marks this plurality
  of admissible sharpening, not an absence of reasons.


  An objection I try to handle: if the coverage value is incomplete, aren''t we really
  in incomparability rather than parity? I answer that incomparability concerns the
  relation between bearers of value for an already-fixed value, while parity concerns
  a plurality of admissible complete specifications. What looks like parity between
  options is, at the level of the covering value, an incompleteness in the standard.
  I worry this may collapse my view into a form of incomparability after all, and
  I am unsure how damaging that would be.


  Another worry is that the proposal makes decisions ''self-correcting'' because the
  standard is revised to fit the choice. I try to block this by denying that any revision
  is permitted; only some revisions strike the earlier materials as reasonable.


  I would particularly welcome comments on: (a) whether the analogy with legal adjudication
