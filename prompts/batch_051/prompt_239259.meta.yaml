  I am a PhD student working on the ethics of energy transitions, and I keep running
  into an asymmetry between the way public debate treats nuclear risk and the way
  it treats the risk from fossil-fuel generation. After the Fukushima accident, German
  opinion largely concluded that continuing to run reactors was an unacceptable way
