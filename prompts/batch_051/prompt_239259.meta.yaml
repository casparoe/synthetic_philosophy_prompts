  residual accident risk as something no society may impose treat the particulate
  pollution from coal- and gas-fired plants as a routine, tolerable cost of keeping
  the lights on, even though that pollution is associated with substantial premature
  mortality year after year. One risk is a small probability of a large, visible,
  catastrophic harm and is treated as a question of prohibition; the other is a near
  certainty of many small, dispersed harms and is treated as a question of cost-benefit
  bookkeeping.


