  "In consequentialist circles people talk about cluelessness as if it is one thing,
  but I suspect it breaks into two problems that pull in opposite directions. I''ve
  been calling them sign-cluelessness and scale-cluelessness. Sign-cluelessness is
  when you cannot even assign a likely valence to an action''s long-run effects: for
  most ordinary acts you can tell a story where the effects go either way, and you
  have no privileged method for choosing between the stories. Scale-cluelessness is
  when you are confident about the sign but cannot estimate the magnitude at all —
  e.g., you are confident that reducing existential risk is positive, but you cannot
  compare its expected value to a year of present-day suffering prevented.


  I have come to think that sign-cluelessness is very rare in practice and that scale-cluelessness,
  while ubiquitous, is much less decision-relevant than people assume: if a consideration
  is positive under every remotely plausible welfarist model, its magnitude being
  unknown doesn''t license ignoring it, but it does license treating it as a tiebreaker
  rather than a decision criterion. Is this just a restatement of something already
