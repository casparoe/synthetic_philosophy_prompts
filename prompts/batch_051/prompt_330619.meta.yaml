  Domain specifics: AI interpretability. The principle: You can''t directly read a
  model''s "thoughts." Interpretability tools (attention maps, probes, feature activation,
  chain-of-thought) are themselves either models or model outputs; when an AI is used
  to interpret another AI, the interpretation is another artifact that itself needs
  validation. Recursive interpretability could push the need for a trusted interpreter
  up a level but may never cash out unless some level bottoms out in something we
  can verify behaviorally/empirically. The procedure: a checklist for when an interpretability
  result should change your confidence in a model''s behavior.


