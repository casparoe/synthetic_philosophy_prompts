  Position: chaos establishes in-principle unpredictability, not merely practical.
  What would count against it?


  Possible defeaters:

  1. The distinction between "unpredictability in practice for finite measurement"
  and "in principle" is not clean. If the laws and state are given as mathematical
  objects, a Laplacean demon with infinite precision can compute trajectories; chaos
  doesn''t block that. So the position depends on an embedded, finite agent. If "in
  principle" means "by any physically possible agent," then the position is about
  physics, not mathematics. A decisive counterexample: a system whose exact state
  can be finitely encoded (e.g., discrete-state system, or symbolic dynamics where
  each cell is a symbol) and whose future orbit can be computed from that finite code
  — then determinism + chaos is predictable in principle, so the position fails as
  a general claim about chaotic systems. But one might say such systems aren''t chaotic
  in the same sense or the code is not a measurement.


  2. Shadowing: for hyperbolic systems, numerically computed noisy orbits stay close
  to true orbits, so one might argue simulations are reliable in a statistical sense
  even if not pointwise. This is awkward, not decisive: shadowing says there exists
  a true trajectory near the computed one, but not necessarily the actual one; for
  non-hyperbolic systems it can fail.


  3. Structural stability: many physical models are structurally stable, so approximate
  models may capture qualitative features despite pointwise divergence. This counts
  against strong claims that chaos undermines modeling.


  4. Ergodic/statistical predictability: even if individual trajectories are unpredictable,
  invariant measures yield precise statistical predictions; if the position''s target
  is "prediction" broadly, it may be overstated. A defender would concede this as
  limiting scope but not falsifying.


  5. Computational/algorithmic results: some chaotic systems are computationally predictable
  given exact initial data in a finite symbolic form (e.g., the binary shift, which
  is equivalent to multiplying by 2; predicting nth digit is trivial if you know the
  binary expansion). But specifying a real number''s infinite binary expansion is
  the problem. Yet if the initial condition is given by a finite program (algorithmic
  information), one can compute. So the claim "no finite specification suffices" is
  false for computable initial conditions with simple algorithms; but generic initial
  conditions are not computable or not finitely specifiable. Thus the position must
  be qualified to "for typical or arbitrary initial conditions" or "for physical measurement,"
  and that qualification may make it close to tautological (if the state isn''t specified,
  of course you can''t predict).


  6. Digital physics / finite-state universe: if the world is fundamentally discrete
  and finite, then there is no infinite-precision requirement, and chaotic unpredictability
  may reduce to computational complexity, not in-principle unpredictability. Decisive
  for the position''s scope if true; not a live option for our actual physics maybe.


  7. Quantum mechanics: wavefunction evolution is linear, no chaos in the same sense;
  but that''s separate.


  8. The view risks unfalsifiability: if every counterexample is dismissed as "not
  really chaos" or "not really prediction," the view may be insulated. Is that a problem?
  For a conceptual claim about idealizations, maybe not, but it''s a sign the claim
  is doing no work.


