  among, and what information it uses, rather than just saying it stops at the first
  option above an aspiration level; and (2) confront the following objection: if an
  agent can set her own aspiration level, then ''choosing a good-enough option'' just
  is maximizing over the object choice plus the aspiration level, so satisficing either
  is optimization in disguise or needs an account of how aspiration levels are set
  without re-introducing the optimization that satisficing was meant to avoid. A top
  answer should also handle the move from fixed to adaptive aspiration levels and
  say under what conditions raising or lowering an aspiration level is itself a satisficing
  decision.


