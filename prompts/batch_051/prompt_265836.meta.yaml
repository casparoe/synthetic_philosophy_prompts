  Kripkenstein step-by-step:


  (1) What I mean by a word now is fixed by facts about me (meaning is determined
  by something).

  (2) The only candidate facts are my past usage, my current dispositions, my explicit
  interpretations, or irreducibly normative facts.

  (3) My past usage is finite, so it''s compatible with infinitely many functions
  extending it (e.g., ''+'' as quus).

  (4) My dispositions are roughly: I''m disposed to answer ''125'' to ''68+57''. But
  dispositions only describe what I will do, not what I should do; they can''t account
  for mistakes or for the normativity of meaning.

  (5) An interpretation is just another rule or sign, which itself could be interpreted
  in deviant ways — so it leads to a regress.

  (6) Irreducibly normative facts are out of step with a naturalistic worldview (or
  just mysterious).

  (7) So no fact determines that I mean addition rather than quaddition.

  (C) Therefore there is no fact of the matter about what I mean by ''+''.


  Is this valid? Possible criticism: step (2) is a false dichotomy — there may be
  other candidates (e.g., a dispositionalist refined view, teleosemantics, or a "skeptical
  solution" that rejects step (1)/(...)). Also step (6) is not an exhaustive rejection
  — "spooky" doesn''t refute. Also the move from "no natural fact" to "no fact at
  all" is a non sequitur unless you assume naturalism. Or step (1) could be denied:
  meaning may not be determined by facts (skeptical solution: meaning is normative,
  not fact-stating). The argument may be an instance of the skeptical paradox; the
  right answer could be "the argument is valid if you accept (1) and (2), and the
  solution is to reject (1) via a skeptical solution." But some would say the argument
  is valid and conclusion follows; the issue is the candidates and the notion of determination.


