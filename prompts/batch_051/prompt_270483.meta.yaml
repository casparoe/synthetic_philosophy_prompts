  obligation to which those successors have not freely consented, nor shall it encumber
  the common resources of the Settlement beyond the lifetime of its present residents.''


  The story we''re applying it to: the settlement has been continuously inhabited
  for a generation, and the medical staff now have solid data that a child conceived
  and raised on Mars will never be able to return to Earth — the cardiac adaptations
  to 0.38 g make Earth gravity fatal. The council is about to approve the first births
  in the colony. But every resident has a standing duty to help maintain the habitat,
  and more importantly the child, just by being born there, will be permanently barred
  from living anywhere else. So the parents are, in a sense, imposing on a future
  person an obligation (maintain the habitat, never leave) to which the child could
  not consent — not because it''s impractical to ask, but because there''s no one
  to ask yet.


