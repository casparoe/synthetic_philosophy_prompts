  Potential full text:


  I sit on the Conduct Committee of a national writers'' union. I am a novelist rather
  than a lawyer, and the committee has asked me to prepare the written opinion in
  a complaint that has divided us badly. I want the document drafted so that it ends
  in a concrete disposition the committee can vote on, and so that it gives the rest
  of the committee a criterion they can use again, because we all expect more cases
  like this one.


  The facts are agreed. At a festival panel last month on the city''s literary identity,
  one of our senior members — a novelist of forty years'' standing — said: "We keep
  handing the city''s literary culture over to people who got here five minutes ago
  and don''t know the place at all. And they are the ones now telling us what the
  city is, what its stories are, and who belongs in them." Four younger members, three
  of them writers of color, have filed a complaint. They do not say the remark contains
  a slur. They say it is a dog whistle: that "people who got here five minutes ago"
  and "who belongs" draw on a long nativist idiom about outsiders and belonging, and
  that the sentence as a whole told the audience, in code, that the city''s literature
  belongs to writers like the speaker and not to them. Two of the complainants were
  in the audience and describe feeling, immediately, that they had been told they
  did not count. A fifth member, who is white and was also present, has sent a note
  saying she heard nothing racial and took the remark to be about gentrification and
  the young graduates who flood the city''s housing market.


  The speaker''s defense is that the panel was about place and memory, not race; that
  by "people who got here five minutes ago" he meant newcomers of any background —
  remote workers, students, chain-coffee franchises, the usual gentrification complaints;
  that he intended no racial meaning and has spent four decades publishing novels
  that treat the city''s immigrant communities with evident sympathy; and that to
  censure him for a remark containing no racial term would punish him for meanings
  other people projected onto his words. Our union''s code prohibits "conduct which
  demeans or excludes members on the basis of race," but our bylaws also commit us
  to defending the expressive freedom of writers, and several committee members are
  worried that we are being asked to discipline a member for an interpretation rather
  than a statement.


  Draft the short written opinion I will circulate. It should recommend one of four
  dispositions: uphold the complaint and formally censure the speaker; dismiss the
  complaint; issue a public statement from the committee without individual sanction;
  or require the speaker to take part in a facilitated conversation with the complainants
  within a stated time. (If you think the right disposition is a combination or something
  else, say so and say how it would work.) The committee is not asking for a lecture
  on free speech; it is asking for an actionable decision. The opinion must state,
  in plain terms, the criterion by which it judges the remark to be or not to be racist
  for disciplinary purposes — one that does not pretend the ambiguity of the sentence
  away, and one that says clearly how much weight intent, effect, and evidence of
  coded meaning each carry. It must also present the strongest consideration on the
