  intelligent life. I suspect the disagreement is not about the facts so much as about
  the term itself, so I want a working definition rather than a recitation of examples.


  Nick Bostrom, in ''Existential Risks: Analyzing Human Extinction Scenarios and Related
  Hazards'' (Journal of Evolution and Technology, 2002), sets up his notion of a terminal
  risk this way: ''An endurable risk may cause great destruction, but one can either
  recover from the damage or find ways of coping with the fallout. In contrast, a
  terminal risk is one where the targets are either annihilated or irreversibly crippled
  in ways that radically reduce their potential to live the sort of life they aspire
  to.'' I take it that existential risks are supposed to be the global terminal risks—those
  where the ''target'' is humankind or Earth-originating intelligent life as a whole.


  Please give me a definition of ''existential risk'' that takes Bostrom''s contrast
  as a constraint but is precise enough to give defensible verdicts on the following
  cases: (a) an engineered pathogen or AI-enabled weapon that kills every human being;
  (b) an AI-driven war that kills several hundred million people and sets technological
