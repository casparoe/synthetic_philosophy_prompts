  that matter most. Your task is to produce that allocation.


  The committee is especially interested in questions of the following kind, though
  you should not feel bound to this list: (a) whether the field''s center of gravity
  should shift from ''paraconsistency'' to ''substructurality'' once one notices that
  the Curry paradox trivializes many paraconsistent logics unless contraction is restricted
  — including what this means for the original motivation of keeping the unrestricted
  truth schema or naive comprehension; (b) whether a dialetheist can express the claim
  that a sentence is true and not false (''just true''), or express genuine disagreement,
  without importing a negation strong enough to reintroduce explosion; (c) how much
  of the dispute between classical and paraconsistent accounts of the semantic paradoxes
  is settled at the level of metainferences rather than ordinary validity, and what
  that implies for the project of giving a non-classical theory of truth; (d) how
  a rational agent should reason and revise beliefs if some contradictions are true,
  given that standard Bayesian and AGM-style frameworks assume consistency; (e) how
  to understand classical recapture — the fact that paraconsistent logicians often
  reason classically in consistent domains — and whether it is a principled feature
