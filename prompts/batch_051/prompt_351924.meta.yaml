  Core question: Which open questions or lines of work in dialetheism and paraconsistent
  logic are most worth prioritizing, and why?


  Candidate sub-problems to mention/inject:


  1. The Curry problem / structural contraction: A paraconsistent logic can avoid
  explosion (ex falso) from the liar, but Curry''s paradox derives triviality without
  negation, via a conditional or a comprehension principle plus contraction. To handle
  Curry, one must either weaken the conditional, reject contraction (move to substructural
  logic), or restrict comprehension/truth schema. This reshapes the whole research
  program: is paraconsistency by itself the wrong target — should attention shift
  to substructural logics? This is an "upstream" question: many other questions depend
  on whether the relevant systems are merely paraconsistent or also non-contractive.


  2. The "just true" / exclusion problem: Dialetheism claims some truths are also
  false ("true contradictions"). But to state the theory, to exclude trivialism, and
  to disagree, the dialetheist needs to say that some sentences are true and not false
  — i.e., "just true." Can that be expressed in a paraconsistent language without
  introducing a classical negation or a notion that collapses the view? Several proposed
  operators (Priest''s rejection? the "just true" operator, etc.) either fail to give
  the requisite logical behavior or reintroduce explosion. This matters because if
  it can''t be expressed, the position may be ineffable or rationally unstable.


  3. Metainferential challenge: Recent discussions argue that what matters for a logic
  is not just validity of inferences (premises-to-conclusion) but also metainferences
  (e.g., preserving theoremhood, or combined inference/backtracking), and that fixing
  the standard definition of logical consequence as truth-preservation across all
  valuations underdetermines the logic unless one specifies the metainferential level.
  There are results that many non-classical truth values collapse at higher levels
  or that LP''s metainferential behavior differs. Sub-issue: is the debate about dialetheism
  really a debate at the metainferential level, and if so which logic should dialetheists
  adopt for reasoning about their own theory? Also "inferentialist" vs "truth-relational"
  criteria.


  4. The classical recapture problem: If dialetheists admit that in consistent domains
  classical logic works, they need a coherent account of when and why classical reasoning
  is permissible — e.g., via consistency premises or default rules. Is recapture a
  feature or a concession? What does it do to the claim that the "true" logic is paraconsistent
  rather than classical with restricted explosion? This affects applicability.


  5. Problem of rational commitment / acceptance of contradictions: Even granted that
  some contradictions are true, how should an agent rationally update on and reason
  with them? Bayesianism and standard belief revision assume consistency. Can a paraconsistent
  epistemology be built, and should it be a priority?


  6. Paraconsistent set theory / mathematics: Can we get a naive set theory or semantics
  without triviality? The original appeal of dialetheism was that it lets us keep
  the unrestricted T-schema and naive comprehension. But paraconsistent set theories
  face their own problems (validity of extensionality, the status of "=" and identity,
  non-adjunctiveness, models). Is full naive set theory desirable, or should attention
  go to weaker, motivated restrictions?


  7. Applications: inconsistent databases, legal systems, theories in science; how
  much do they motivate paraconsistency, and do they justify dialetheism itself (versus
  mere paraconsistent reasoning)?


