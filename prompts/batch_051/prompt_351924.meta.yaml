  Draft v2:


  "Suppose you are advising the grants committee of a private research initiative
  in philosophical logic. The initiative will fund a single five-year program of roughly
  six researchers, and it has decided to support work on dialetheism and paraconsistent
  logic, broadly enough to include the substructural systems that now surround that
  debate. The committee does not want a survey or a reading list; it wants a defended
  allocation of effort. Produce that allocation by answering the question: which three
  or four open questions, or lines of work, in this area are most worth prioritizing,
  and in what order?


  To make the task concrete, the committee has been urged to treat the following as
  candidate priorities, though you may argue for others and should not assume the
  list is complete:


  - The Curry shift. The Curry paradox can trivialize many paraconsistent systems
  unless they restrict structural contraction (the rule that a premise may be used
  more than once) or adopt a nonstandard conditional. This has led many to think the
  real lesson of the paradoxes is not that contradictions are true but that classical
  structural rules or the usual conditional must go. Should the program''s center
  of gravity move from paraconsistency to substructural logic, and does that undermine
  the original dialetheist motivation of keeping the unrestricted truth schema or
  unrestricted set comprehension?


  - The just-true problem. If some contradictions are true, the dialetheist still
  needs to say that some sentences, such as the dialetheist''s own theory, are true
  and not false, and to express genuine disagreement. Can a paraconsistent language
  express this without smuggling in a negation or exclusion operator strong enough
  to reintroduce explosion?


