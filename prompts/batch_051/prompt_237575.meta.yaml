  Final draft:


  "For an essay on translation and revelation, I want the full specification of what
  a doctrine of translation and inspiration would have to get right before I weigh
  any of the familiar positions. The debates I have read move from a single case to
  a conclusion — the Septuagint is invoked to show that a translation can be inspired,
  the King James Version is invoked to show that only one can be, the lost autographs
  are invoked to show that none can be — and each time the rest of the theory is silently
  assumed. Set the conclusions aside and give me the requirements list first.


  Fix the purpose of the doctrine as follows. It must be adequate for a community
  that (a) has to decide whether the translation it actually reads, hears, and teaches
  can be treated as divinely inspired, not merely as a helpful rendering; (b) has
  to decide whether to teach that status as doctrine; and (c) will revise the translation
  and correct its textual base as scholarship improves. A doctrine that works only
  for original manuscripts that no one possesses, or only for a community with a single
  frozen translation, fails this purpose.


  Now give me the list of requirements such a theory must meet. Work through at least
  these cases and distinctions, and say, for each, why it is a requirement rather
  than an optional commitment of one theological camp:


  - The lost-autograph case. The source texts are gone, and what circulates are copies
  and translations. The theory must say where inspiredness lives after the originals
  disappear, or accept that the community is venerating texts with no inspired status.


  - The Septuagint case. An ancient translation was treated by a community as carrying
  its own inspired authority, to the point of legends that the translators produced
  it under divine supervision. The theory must say whether inspiration can attach
  to a translation in its own right, and whether what the community was claiming was
  fidelity to the source, divine oversight of the process, or something else.


  - The KJV-onlyism case. One translation is elevated to exclusive authority. The
  theory must not collapse three things: a translation''s fidelity to its source,
  its authority for a community, and its inspiration. It must handle the position
  that runs them together and say which of the three, if any, can be claimed without
  the others.


  - The source-shift case. A translation is widely venerated, but the underlying text
  it followed is later judged inferior, or some of its renderings are shown to be
  questionable. The theory must state whether inspiredness is compatible with translational
  error and, if so, where the boundary runs between an inspired departure and a mistake.


  - The chain case. A translation of a translation, a revision of a translation, and
  a copyist''s slip all pass a text on. The theory needs a rule for whether and how
  inspiration propagates through a chain of transmission, and it cannot say that every
  act of transmission is individually protected without making the copyist''s slip
  inspired.


  - The identical-text case. A translator with no religious commitments, working by
  ordinary scholarship, produces a rendering word-for-word identical to one the community
  regards as inspired. The theory must say whether two indiscernible texts can differ
  in status. This forces a decision about whether inspiration is a property of the
  text itself or of its production and reception.


  - The plurality case. Several translations make different, defensible choices in
  places where the source underdetermines the rendering. The theory must explain how
  exclusive and non-exclusive accounts of inspiration each handle this: if exclusive,
  what selects the one inspired rendering out of textual equals; if non-exclusive,
  how two conflicting renderings can both be inspired without draining the concept
  of content.


  For each requirement, state it explicitly, give the case or consideration that forces
  it, and mark it as non-negotiable or as a camp-specific preference — with a reason
  each time. The list itself is the deliverable, so keep the discussion of existing
  positions brief and put the weight on the criteria. End by saying which single requirement
  does the most work in excluding popular positions, such as autograph-only views,
  KJV-onlyism, or the claim that translators were protected by the Holy Spirit from
  error, and defend that judgment. If some subset of the requirements turns out to
  be jointly unsatisfiable — for instance, if exclusive inspiration, compatibility
  with recognized error, and deference to the best available text cannot all be had
  together — say so plainly, because that is the part of the list I most want to see.
  Commit to definite positions on the negotiability of each requirement and on the
  final judgment; do not present a menu of options and leave me to choose. Write in
  American English."


