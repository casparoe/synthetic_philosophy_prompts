  Program equilibrium idea: In program games (Tennenholtz 2004; also Howard 1988),
  each player submits a program, programs can read each other''s code, payoff determined
  by programs'' outputs. A program can be conditional: "if other program outputs cooperate,
  then cooperate; else defect." When both submit such "cooperate-if-cooperate" programs,
  mutual cooperation is an equilibrium because unilateral deviation to a defecting
  program would be read by the other program and result in defection, so the deviator
  gets the punishment payoff instead of the temptation payoff. So cooperation is sustained
  by the ability to condition on the other''s code, not by repetition or reputation.


  What would count against it? Key assumptions and defeaters:


  1. The program must be able to inspect the other''s source code (or otherwise verify
  its output/strategy) before choosing. If agents can''t read each other''s code,
  if the environment allows opaque/hidden programs, or if programs can be encrypted,
  the mechanism collapses. Defenders might say transparency is a modeling assumption,
  not claimed to hold universally; but a robust defense needs to say which real institutions
  approximate it.


  2. The "cooperate-if-cooperate" program (clique-bot) itself needs to be convincingly
  committed to cooperate only if the other also commits. But can programs be verified
  as running exactly the code submitted? If there is a difference between source code
  and actual execution, or if the "other program" can simulate your program and mimic
  it while planning to defect in actual execution, then the equilibrium is fragile.
  This is the "simulation" or "Newcomb" style issue: if your program conditions on
  the other program''s text, and the other program''s text includes your code... Actually
  in program games, each program is given the other''s code as input. There are issues
  about what happens with two programs that each try to do something like "cooperate
  iff the other will cooperate" leading to infinite recursion or circularity. Defenders
  handle with fixed-point semantics or require well-foundedness.


  3. The normative interpretation: program equilibrium shows there is an equilibrium
  with cooperation, but not that cooperation is uniquely rational or mandatory. Many
  equilibria exist in the program game, including mutual defection via programs that
  ignore the other''s code. So as an argument that "cooperation is rational in one-shot
  PD" it is weak — it shows cooperation is a possible equilibrium among many, not
  a solution concept selection. If a defender claimed it dissolves the dilemma, this
  would count against it. So a defender might concede: it doesn''t select the cooperative
  equilibrium; it only shows mutual cooperation is consistent with individual rationality
  in the enriched game. This is a partially decisive defeater depending on the claim.


  4. It changes the game: adding source-code reading changes the strategic situation
  into a different game, so it may not be "the one-shot PD" anymore. If reading code
  is a move with costs or opportunities, the true game is an extended form. Defenders
  might concede that it''s an extension, not the original game; that''s an acceptable
  qualifier.


  5. Counterfactual robustness: if self-modifying programs can delete or obfuscate
  their own code, or if there is noise/imperfect inspection (e.g., probability of
  detection), can cooperation persist? If the inspection is probabilistic, the "grim-trigger"
  in code becomes less effective; there may be conditions under which defection programs
  invade. There are results on cooperation in program games with imperfect identification.


  6. The trust/commitment issue: a program that reads the other''s code still cannot
  be sure the other will actually execute the program it submitted. If execution isn''t
  observable/enforceable, the equilibrium relies on a further commitment device. In
  real settings, you can sometimes verify: open-source software, contracts, institutional
  roles, automated trading algorithms. But if the runtime can deviate, the mechanism
  needs the code submission to be binding.


  7. Formal results showing that in richer program spaces, cooperative equilibria
  require unnatural restrictions or tie-breaking conventions: e.g., self-referential
  programs, "Quine" programs that reproduce the opponent''s code, and paradoxes. If
  a defender must rule out certain programs to preserve the result, the view risks
  being qualified into unfalsifiability or into a very narrow claim.


  8. A crucial weak point: the program game assumes that a program''s action is a
  function of the other program''s code. But if both programs try to be "nicer" than
  the other — e.g., a program that returns C iff the other program returns C on all
  inputs — you can get infinite regress. The literature uses "termination" requirements
  or theorem-proving programs. Defeaters include results that if programs are allowed
  arbitrary self-reference, the "best response" relation becomes ill-defined, and
  cooperative equilibria rest on constraints.


