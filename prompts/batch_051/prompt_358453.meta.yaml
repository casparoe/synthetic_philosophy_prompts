  is faced with a situation where he can save only one of two people, one of whom
  is his wife, from drowning. Williams suggests that if the man considers whether
  saving his wife is permitted by an impartial moral theory (like utilitarianism or
  Kantianism), that''s "one thought too many" — it would be a kind of alienation from
  his commitments and personal relationships. The integrity objection: utilitarianism
  (negative responsibility, demandingness) requires agents to abandon their ground
  projects, commitments, and personal integrity for the sake of maximizing utility.
  In "A Critique of Utilitarianism" in Utilitarianism: For and Against (with J.J.C.
  Smart, 1973). Jim and the Indians example: Jim arrives in a South American town
  where 20 Indians are about to be shot; the captain offers Jim the choice to shoot
  one himself and the rest go free, or he shoots all 20. Utilitarianism says Jim should
  shoot the one. Williams argues that this fails to respect Jim''s integrity — his
  own agency is implicated in a different way.


