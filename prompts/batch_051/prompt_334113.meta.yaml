  Hindsight "hindsight is 20/20":

  Prompt: student in a philosophy of history / historiography course. Professor keeps
  saying "hindsight is 20/20" to dismiss post-hoc explanations of why things happened
  (e.g., why the Bronze Age collapse happened, why the Reformation succeeded). Student
  wants to know exactly what the professor might mean and whether it actually undercuts
  retrospective explanation.


  Readings:

  - Memory/detail claim: our memory of past events is sharper/clearer than foresight
  (trivial, often false — biases).

  - Epistemic privilege claim: we know more about the past than we could know about
  future (trivially true in some sense but not critique).

  - Bias claim: knowledge of outcomes distorts our perception of past probabilities
  (substantive, supported).

  - Narrative claim: after the fact, people impose coherent stories that make events
  look inevitable (narrative fallacy).

  - Counterfactual/explanation claim: retrospective explanations are untestable or
  too easy to generate (substantive but contested).

  Which readings actually support dismissing a specific historical explanation vs.
  just cautioning? The professor''s use might need the strong "untestability" reading,
  which is questionable.


