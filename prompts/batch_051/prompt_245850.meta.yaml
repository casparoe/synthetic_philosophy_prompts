  For Aristotle''s phantasia, the concept is subtle: phantasia is not "imagination"
  in the modern sense; it''s the faculty in virtue of which we have appearances/images
  (phantasmata), including memory, dreams, and even perceptual afterimages; it is
  "that in virtue of which we say that an image occurs to us." Aristotle argues thinking
  requires phantasmata (De Anima III.7-8), and phantasia is a movement resulting from
  actual perception (III.3), and is neither perception nor belief/thought, but distinct.
  Misconceptions: students will treat phantasia as creative make-believe/imagination;
  they''ll think phantasmata are pictures, requiring a homunculus; they''ll think
  Aristotle is an empiricist in the modern sense or a picture-theorist; they''ll confuse
  "no thinking without phantasmata" with "thinking is just images." A carrying example:
  a geometer proving a theorem about triangles uses a diagram (a particular image)
  but understands something universal; or remembering an absent thing; or the difference
  between recognizing your friend and forming a belief about her. To teach: first
  distinguish perception from belief? The order matters: start with the puzzle: how
  does thinking of absent things happen? Introduce perception/thought distinction.
  Then phantasia as "appearances" after perception. Then the role in thought. Then
  misconception about imagery.


