  cleanly, which you had to distort, and which parts of the debate — like the normative
  force of the argument, the notion of a ''preference'' as something revealed by choice,
  or the assumption of a betting counterparty — have no counterpart in editorial decision-making.
  At the end, tell me whether that residue is a defect of newsroom vocabulary as a
  tool for understanding the argument, or evidence that the coherence argument carries
  assumptions that armchair philosophy hasn''t fully noticed."


