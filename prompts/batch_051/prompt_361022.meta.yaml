  A classic subtle issue: The Kelly criterion maximizes the expected logarithm of
  wealth, not expected wealth. A naive step-by-step argument might be:


  (1) For a repeated bet with edge, the strategy that maximizes the expected value
  of your bankroll after n rounds is to bet all of your bankroll each round (since
  each bet has positive expected value and expected value is linear: EV grows multiplicatively
  by (1 + edge*f)? Wait, betting a fraction f of bankroll, expected multiplier per
  round is (1 + f*edge). To maximize expected bankroll after n rounds, maximize (1
  + f*edge)^n, which is maximized at f=1 (bet everything) if edge >0. (2) The rational
  strategy is to maximize expected bankroll. (3) Therefore you should bet everything
  each round. But (4) betting everything leads to ruin almost surely with repeated
  bets. (5) So the rational strategy leads to ruin almost surely, which is absurd.
  So something''s wrong.


  Where''s the flaw? The expected-value maximization assumes a linear utility in wealth,
  but with repeated multiplicative bets, the distribution is heavy-tailed/log-normal-ish;
  expected value is driven by astronomically unlikely outcomes, while the median/typical
  outcome goes to zero. So step (2) is the suspect one: maximizing expected bankroll
  is not the right criterion when facing repeated multiplicative risk; the criterion
  should be maximizing expected log wealth (or maximizing long-run growth rate), which
  gives Kelly. This is a nice discussion.


  Alternative argument: Kelly maximizes the long-run growth rate. (1) Long-run growth
  rate g(f) = E[log(1 + fX)] where X is net return per unit bet. (2) A rational agent
  should maximize g(f). (3) g is concave in f, so setting derivative zero gives f*.
  (4) Therefore Kelly is uniquely rational. The questionable steps: (1) assumes the
  ergodic objective; (2) is normatively contentious—depends on log utility over wealth
  and infinite horizon, no risk of ruin concerns, known probabilities, etc. Also,
