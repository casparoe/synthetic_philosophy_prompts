  I''ll design an argument about Kelly that''s subtle. Let me think through the actual
  math carefully.


  Setup: You have a bankroll. You can repeatedly bet on a favorable coin flip: with
  probability p > 0.5 you win your stake, with probability q = 1-p you lose your stake.
  Net odds even-money (b=1). You choose a fixed fraction f of current bankroll to
  bet each round. After n rounds, bankroll W_n = W_0 ∏ (1 + f X_i) where X_i = +1
  with prob p, -1 with prob q.


  Expected bankroll: E[W_n] = W_0 (1 + f(p - q))^n = W_0 (1 + f e)^n where e = p -
  q > 0 (the edge). This is maximized in f by taking f = 1 (bet all). So expected
  value maximizer bets all; expected wealth grows as (1+e)^n → ∞.


  But the typical outcome: the logarithm of bankroll per round is log(1 + f X_i).
  With f=1, log(1 + X_i) = log 2 with prob p, log 0 = -∞ with prob q. So with probability
  1 - p^n, you hit zero at some point (at first loss), so W_n = 0 almost surely eventually.
  Indeed P(no loss in n rounds) = p^n → 0, so ruin with probability 1, although E[W_n]
  → ∞ because the tiny chance p^n of never losing yields 2^n W_0, and p^n 2^n = (2p)^n
  → ∞ if p > 1/2. So EV is dominated by an increasingly improbable jackpot. That''s
  the crux.


  The argument to present:


  (1) For each round, the expected value of the bet is positive whenever the win probability
  exceeds one half.

  (2) A bet with positive expected value should be taken, and larger positive-EV bets
  are better than smaller ones.

  (3) Hence, for any fixed fraction f of bankroll, expected bankroll after n rounds
  is (1 + f(p-q))^n times the starting bankroll, which is increasing in f.

  (4) Therefore expected bankroll is maximized by betting the entire bankroll each
  round.

  (5) So the expected-value-maximizing strategy is to stake everything each round.

  But (6) staking everything each round leads with probability 1 to eventual ruin,
  and ruin is bad.

  Therefore there must be a flaw in the steps or in equating rational choice with
  expected bankroll maximization.


