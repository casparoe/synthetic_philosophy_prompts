  hearing.


  The case concerns a first-year physics student. She noticed that her lab partner
  had, without her involvement, edited several cells in their shared data spreadsheet
  so that the measurements matched the predicted curve. She did not alter or fabricate
  any data herself, did not draft the portion of the report that relied on those results,
  and did not discuss the edits with her partner afterwards. The falsification was
  discovered by the teaching assistant. Our honor code''s complicity provision makes
  a student who knew of or reasonably suspected an integrity violation and failed
  to report it liable to the same penalty as the person who committed the violation,
  up to and including suspension. The student admitted that she suspected the edits
  were fraudulent, but she says she feared retaliation, believed the lab partnership
  and friendship would end if she reported, and insists that her silence was not itself
  an act of dishonesty.


