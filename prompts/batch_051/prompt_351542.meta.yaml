  "Here''s something I keep going back and forth on. Most people think that when a
  community''s shared memory of an event clashes with the written historical record,
  the memory still gets to be authoritative for what the event meant for that community—it
  shapes identity, ritual, even political claims—while the record is authoritative
  for what actually happened. But notice the asymmetry: we don''t let any other group
  have its own ''facts'' in the same way; if a community insisted that a massacre
  happened when the record says it didn''t, most people wouldn''t say ''that''s their
  truth.'' Is this asymmetry defensible, or is it just conflict-avoidance dressed
  up as respect? I want the strongest principle you can find that generates both the
  memory-authority and fact-authority judgments, tested against cases where the memory
  is clearly invented, where the historical record was written by enemies, and where
  a community''s present identity depends on keeping the false version. When memory
