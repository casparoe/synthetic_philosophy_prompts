  Williams''s actual example (from J.J.C. Smart and Bernard Williams, Utilitarianism:
  For and Against, 1973): Jim finds himself in a South American town where a military
  captain is about to execute twenty randomly chosen Indians to warn rebels; the captain
  offers Jim, an honored visitor, the chance to shoot one Indian himself, in which
  case the other nineteen are released. Williams uses this to argue against act-utilitarianism/consequentialism:
  if Jim refuses, 20 die; consequentialism seems to require him to kill one. Williams''s
  point is about integrity and the "projects" that ground a person''s identity; he
  thinks the utilitarian calculus doesn''t properly weigh the personal integrity of
  agents, that it alienates agents from their own actions and projects.


  The phrase "one thought too many" actually comes from Williams''s example in "Persons,
  Character and Morality" (1976), about a man who rescues his wife rather than a stranger,
  and when asked why, he offers impartial justification; Williams says this would
  be "one thought too many." Specifically, the man (or a husband) "must be characterized
  as having had one thought too many" if he deliberates about rescuing his wife by
  appealing to impartial moral principles. The objection: utilitarianism/consequentialism
  (or impartialist morality) requires the agent to step back from personal relationships
  and calculate, which is a distortion; love or being a particular person means the
  immediate reason is "she is my wife." The "one thought too many" is not exactly
  about the Jim case, but both are about integrity and personal ground projects, and
  the idea that moral theories that demand impartial justification alienate us from
  our deepest attachments.


  In the prompt, a friend''s summary could conflate the two examples (Jim and the
  wife rescuing), say Williams thinks any impartial justification in personal relationships
  is "one thought too many," that Williams is against second-order reasoning in general,
  that Williams thinks morality should never require self-sacrifice, or that the problem
  is utility calculus specifically. The fair answer would disentangle: the objection
  is not against reasoning as such; it''s about the place of impartial justification
  in personal life; the criterion is whether the thought is the agent''s reason or
  a justification demanded by the theory under the "morality system." Also Williams
  doesn''t claim utilitarianism gives the wrong answer in Jim''s case necessarily;
  his point is about what kind of answer and what it does to the agent.


