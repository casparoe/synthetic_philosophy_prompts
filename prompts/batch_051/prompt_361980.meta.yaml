  Let me recall the literature.


  Moral equality of combatants (MEC): the view that soldiers fighting in an unjust
  war and soldiers fighting in a just war are morally on a par: both are permitted
  to kill enemy combatants (provided they follow jus in bello), and neither commits
  a wrong simply by fighting for an unjust cause. Walzer defends it in Just and Unjust
  Wars. McMahan attacks it; defenders respond.


  Arguments for MEC:


  1. The epistemic argument: ordinary soldiers cannot know whether their country''s
  war is just; the state has the knowledge and responsibility for jus ad bellum. So
  asymmetry would punish soldiers for facts they can''t access. (Walzer''s "the war
  convention" and "the tyranny of the circumstances.")


  2. The role-based / institutional argument: soldiers act in a role; their moral
  status is set by the institution of war, which assigns them to obey. The role creates
  a division of moral labor; judging the justice of the war belongs to political leaders
  and citizens, not soldiers.


  3. The conscript/coercion argument: soldiers are often coerced, conscripted, or
  under duress; if they refuse they face punishment; so their individual culpability
  is diminished. (This is more about excusing unjust combatants than licensing them,
  but it''s an argument for egalitarian treatment in terms of blame.)


  4. The reciprocal risk / self-defense argument: each combatant poses a lethal threat
  to the other, so both may use lethal force in self-defense regardless of the justice
  of the war. The "circumstances of combat" make it a situation of mutual self-defense.


  5. The conventionalist / rule-consequentialist argument: the laws of war work best
  if applied symmetrically; a system that required soldiers to discriminate between
  just and unjust wars would be unenforceable and would make wars more brutal, since
  each side would see the other as criminals. So symmetry protects a minimum of restraint
  and protects POWs etc.


  6. The argument from the moral division of labor / the "domestic analogy": soldiers
  are like police officers executing law, and we don''t hold individual police accountable
  for the justice of the laws they enforce. This overlaps with role-based.


  7. The democratic legitimacy argument? Soldiers in a democracy can defer to democratic
  decisions; they''re not supposed to assess jus ad bellum. This overlaps epistemic/institutional.


