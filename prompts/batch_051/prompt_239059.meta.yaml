  Domain: Empty names and truth in fiction. Key philosophical positions:

  - Millianism about names: names contribute only their referent; empty names therefore
  contribute nothing, so sentences containing them are either meaningless or express
  no proposition (gappy propositions). Problems: "Sherlock Holmes doesn''t exist"
  seems true, and "Holmes is a detective" seems true in the fiction; if no proposition,
  how can it be true?

  - Fregean descriptivism: names have senses (descriptions); empty names have sense
  but no reference, so "Sherlock Holmes is clever" expresses a proposition (the unique
  detective at 221B Baker Street etc. is clever) but is false (nothing satisfies),
  while "Holmes exists" is false.

  - Pretense / make-believe (Walton): fictional discourse is a game of make-believe;
  "Holmes is a detective" is not true simpliciter but true in the fiction, fictionally
  true; "Sherlock Holmes" refers only within the fiction, not in reality.

  - Realism about fictional objects (Van Inwagen''s neo-Meinongian? Actually Van Inwagen
  is an abstract-object realist: Holmes is an abstract entity created by Conan Doyle,
  a theoretical entity of literary criticism). Also Meinongianism: Holmes is a nonexistent
  object.

  - Actualism, possibilism.

  - Truth in fiction: Lewis''s possible-worlds analysis — truth in fiction is what''s
  true at the worlds where the fiction is told as known fact, closest to our world.
  Problems with inconsistent fictions (Conan Doyle''s internal inconsistencies, e.g.,
  Watson''s war wound location is famously inconsistent — but I shouldn''t rely on
  niche trivia unless I verify... Actually Watson''s wound is a well-known trivia
  but might be niche; avoid). Holmes doesn''t need specific trivia.


  The translation to database vocabulary:

  - Names as foreign keys / references: a name in a sentence is like a foreign key
  pointing to an entity in the "real world" table. "Holmes" is a foreign key with
  no matching row in the persons table — a dangling reference or NULL. Now the question
  becomes: what is the "record" for a row that doesn''t exist? In SQL, a foreign key
  constraint would reject it; but natural language tolerates it.

  - Fiction as a separate table/schema: rows in a "fiction" table where "Holmes" has
  a row, attributes (detective, address), but the table is not the real-world table.

  - Truth in fiction as query results against the fiction table with a different integrity
  constraint regime.

  - "Holmes doesn''t exist" as a query for existence returning empty set; but then
  how does the sentence itself say something true if the subject variable is unbound?

  - Null semantics and 3-valued logic: comparisons to NULL are UNKNOWN not FALSE.
  This could map to truth-valuelessness.

  - Multi-tenancy / namespaces: the same name can refer to different entities in different
  schemas ("Holmes" the real person vs. the fictional character) — maybe like different
  schemas or table namespaces avoiding name collision.

  - A name having a sense but no referent (Frege) is like a query/view definition
  that never returns a row — the definition exists, the result set is empty.

  - Millianism: name is just a pointer; a dangling pointer has no value, so dereferencing
  it crashes — but ordinary speakers don''t crash.

  - "Holmes is clever" as row in fiction table; "Sherlock Holmes was created by Conan
  Doyle" — a row in a meta table about fictions, maybe a book catalog.

