  have the text in front of me): Aaron lays his hands on the head of a live goat,
  confesses over it all the iniquities, transgressions, and sins of the children of
  Israel, puts them on the goat''s head, and then sends the goat into the wilderness
  by a fit man. I know that later Frazer and others treat this as a case of transferring
  evil, but I want to know if that transfer is a real psychological thing or just
  a ritualistic way of talking. So here''s the question: how would one test whether
  a scapegoat rite like this actually reduces or displaces guilt, blame, or moral
  discomfort in the participants, as opposed to merely changing how they talk or making
  them feel temporarily relieved? I want an experimental design, the results that
  would favor each interpretation, and an honest account of what a positive result
  would and would not show. I''m especially interested in separating three things:
  a confession effect, a public-cleansing effect, and actual transfer of guilt. Could
  a test distinguish them, or is the notion of transfer too underdefined to be testable?
  And if transfer is underdefined, what operational definition would be least unfair
