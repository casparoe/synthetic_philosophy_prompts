  about making people equally happy or equally capable. His central move was the familiar
  expensive tastes case: suppose one person is perfectly content with modest fare
  while another has cultivated a taste for opera and fine wine, and suppose the second
  needs much more money to reach the same level of satisfaction. Fonseca insisted
  that justice does not owe the second person a larger share; if society subsidized
  cultivated tastes, it would effectively make other people pay for someone else''s
  preferences, and that is the wrong object of equalization. Justice should equalize
  people''s external circumstances — the resources with which they pursue whatever
  ends they happen to have — and then hold people responsible for the way their own
  tastes and ambitions convert those resources into satisfaction.


  Ellison pushed back that resources are the wrong currency because people differ
  in their ability to convert resources into actual doings and beings. She pressed
  the case of a person with a serious mobility impairment: equal dollar resources
  may leave that person unable to move about town, hold a job, or participate in public
  life at anything like the same level as others. Fonseca replied that impairment
  of that sort is an unchosen circumstance, not a chosen taste, so on his view it
  is exactly the kind of thing for which people should be compensated under a fair
  social insurance scheme. Ellison answered that this concession quietly gives the
  game away: deciding how much compensation is enough forces you to ask what the person
  can actually do and be with various levels of resources, which is precisely to measure
  capabilities rather than resources. Fonseca countered that capabilities are too
  amorphous to serve as a public standard — there is no agreed list of which capabilities
  matter, and once the state starts equalizing capabilities it will have to make substantive
  judgments about the good life that a pluralistic society should leave to individuals.
  Ellison replied that this worry is overstated, because capabilities concern people''s
  real freedoms, not their achieved states — the state need not force anyone to use
  their options — but that Fonseca''s pluralism point does show why any capability
  metric must be defended, not assumed.


