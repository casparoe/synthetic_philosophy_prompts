  have each person vote on each question, and treat the majority on each question
  as the group''s official answer. Then I use those answers as inputs to a final call.


  I''ve been keeping track of how I reacted to several actual votes. (Just to be clear,
  Alice, Bob, and Carla are three engineers, and all three are individually consistent
  in every case.)


  Case 1. Make an offer. We asked: (P) does the candidate have strong distributed-systems
  experience? (Q) will they handle our on-call rotation well? And (R) should we make
  an offer? We had all explicitly agreed that R just means P and Q. Alice: P yes,
  Q no, R no. Bob: P no, Q yes, R no. Carla: P yes, Q yes, R yes. So the group''s
  official positions were: P yes (2–1), Q yes (2–1), R no (2–1). We ended up telling
  the candidate they had the right experience and would fit the on-call culture, and
  that we were not making an offer. That felt broken to me, as if the aggregation
  itself was at fault, not any individual voter.


  Case 2. Deprecate a service. Same split, different topic. We asked: (P) does the
  new service cover all the old one''s uses? (Q) have the downstream teams had enough
  migration time? (R) should we deprecate the old service by Q3? Again Alice: P yes,
  Q no, R no; Bob: P no, Q yes, R no; Carla: P yes, Q yes, R yes. So the majority
  accepted P and Q and rejected R. This did not bother me at all. People clearly treated
  R as also involving risk tolerance and opportunity cost, which P and Q didn''t capture.


