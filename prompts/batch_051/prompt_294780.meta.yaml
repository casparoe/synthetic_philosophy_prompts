  ---


  I teach philosophy (mostly philosophy of mind, with the occasional first-year survey),
  and I keep running into the same potted account of Aristotle''s four causes. It''s
  something like this: when Aristotle asked why a thing is what it is, he distinguished
  four kinds of answer; the material cause is the stuff (the bronze of a statue),
  the formal cause is its shape or arrangement (the pose), the efficient cause is
  what made it (the chisel), and the final cause is the purpose for which it was made
  (to honour a god). The account then says Aristotle extended the final cause to nature
  as a whole: heavy bodies fall because they seek their natural place, acorns grow
  into oaks because that is their end. And the story concludes that modern science
  began when Galileo, Bacon, and Descartes dropped final causes and kept only efficient
  causes, since explaining something by the end it aims at supposedly puts the result
  before the process that produces it. Today, the story goes, teleology survives only
  as a loose metaphor, and when careful scientists say things like "function" or "purpose"
  they could always trade the term in for a description of mechanism or selection
  history without losing anything.


  I know enough to suspect the real position is more subtle then the textbook lets
  on, but I''m not an ancient specialist and I don''t want to overcorrect a perfectly
  serviceable textbook account. What I want is a verdict on how fair that summary
  is. Could you separate the parts that are accurate, the parts that are standard
  simplifications, and the parts where Aristotle or the history of science would need
  correction? In particular I''d like to know whether the final cause really is just
  the purpose someone had in mind, or whether it does different work in nature; whether
  modern science really did dispense with every cause except the efficient one; and
  whether the claim that function talk can be translated into mechanism or selection
  history "without losing anything" is itself accurate. And if the needed corrections
  add up, does the overall moral of the standard story still stand, or is it misleading
  in the end?


  No headings, bullet points, bold, or tables please; just continuous prose as if
  you were writing me an email. And could you write in British English.


  ---


