  Potential final prompt:


  "I am a retired ecologist who has lately taken up philosophy of biology, and I have
  been turning over an old methodological quarrel in evolutionary psychology. I would
  be grateful for your analysis.


  Please adopt the role of a professional philosopher of biology with a good working
  knowledge of selectionist inference. Think carefully, and before you give your final
  answer, spend some time working through the strongest version of each position and
  the most serious objection to it; I am more interested in your reasoning than in
  a brisk verdict.


  I should like you to compare two methodological standards, or meta-standards, for
  deciding when an evolutionary explanation of a human behaviour is genuinely warranted.
  I shall call them the engineering licence and the historical audit.


  Under the engineering licence, a proposal that some behaviour is an adaptation is
  respectable if three conditions are met: (i) one can specify a recurrent ancestral
  problem with independent plausibility; (ii) the behaviour shows design-like fit
  to that problem''s solution — features that are not easily explained as incidental
  by-products or as chance; and (iii) the proposal yields novel, falsifiable predictions
  that could not have been read off the original observations. On this view, functional
  analysis may licence reverse engineering even where the ancestral record is thin,
  because successful novel prediction is doing the confirmatory work.


  Under the historical audit, by contrast, the decisive facts — ancestral selective
  regimes, heritability of the behaviour, and historical fitness differences — are
  rarely, if ever, known independently. A story about a specific behaviour is therefore
  warranted only when there is independent historical or comparative evidence, such
  as phylogenetic reconstruction or palaeoanthropological data, before functional
  fit is allowed to count. The crux is that narrative fit is cheap: almost any observed
  behaviour can be made to sound like the solution to some posited ancestral problem,
  so fit alone cannot turn a story into science.


  There is a natural thought, which I should like you to assess: perhaps these two
  standards are not genuine rivals because the engineering licence is a standard for
  generating hypotheses, whereas the historical audit is a standard for confirming
  them, and the familiar charge that evolutionary psychology traffics in ''just-so
  stories'' rests on conflating the two. Is that diagnosis right?


