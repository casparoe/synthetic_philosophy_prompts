  Domain: Grammatical categories as natural kinds.

  Type: Adversarial collaboration between two camps.


  Two positions:

  - Universalist: grammatical categories (noun, verb, adjective, case roles, adpositions)
  are a constrained, innately specified set of natural classes; cross-linguistic variation
  is selection from a fixed inventory, and categories have deep semantic/syntactic
  correlates.

  - Usage-based/flat: categories are emergent, family-resemblance clusters induced
  over usage; the apparent naturalness of "noun" and "verb" reflects prototype structure
  and discourse function, not a fixed universal inventory; many categories (e.g.,
  prepositions, cases) are semantically heterogeneous and language-specific.


  Claims both can sign: e.g., every language has some way to distinguish reference
  and predication; no language distinguishes exactly the same cases; category labels
  in grammars are idealizations; some constructions resist neat assignment to a single
  part of speech; within a language, reliable patterns exist that let speakers categorize
  novel items. Disagreements: whether cross-linguistic recurring categories reflect
  universal constraints or convergent functional pressures; whether the boundaries
  between categories are real joints or statistical prototypes; whether a category
  like "preposition" is a natural kind or a family resemblance; whether case systems
  decompose into universal primitives or language-particular clusters.


  Cruxes: what would show a category to be a natural kind vs. a best-fit chunk of
  usage? E.g., if a language combined features cross-cutting typical noun/verb/adjective
  prototypes, would that count against universalism or just show variation? Does a
  category need a shared semantic core to be a natural kind? Is the burden of proof
  on the universalist to find a definition or on the emergentist to explain the recurrences?


