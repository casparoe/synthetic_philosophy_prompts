  In constant-domain Kripke semantics both BF and CBF are valid. In variable-domain
  semantics BF is valid iff domains do not grow along accessibility (forall wRv, D(v)
  ⊆ D(w)); CBF iff domains do not shrink (D(w) ⊆ D(v)). Necessitists adopt constant
  domains: what there is does not vary. Contingentists want varying domains and reject
  one or both.


