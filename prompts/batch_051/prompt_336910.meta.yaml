  Prompt idea: Look at the way English spelling works — or fails to. It doesn''t consistently
  encode sounds (a "phonemic alphabet" would have one symbol per phoneme in context,
  but English has famously irregular spellings). It also doesn''t consistently encode
  morphology or etymology, though it often does: "sign" keeps ''g'' because of "signature";
  "nation" uses ''ti'' for /ʃ/; but then "debt" has a ''b'' inserted to resemble Latin
  ''debitum'' even though it was never pronounced, and "island" has an ''s'' inserted
  on a false etymology. So what does the practice presuppose about what writing is
  for? Does it presuppose a theory (e.g., writing is for representing words as etymological
  objects, not spoken sounds), or is the practice underdetermined — a historical accident
  compatible with several theories? What would have to change if we adopted a rigorously
  phonemic orthography? Would anything be lost (morphemic transparency, homophone
  distinction, access to the history of word families)?


