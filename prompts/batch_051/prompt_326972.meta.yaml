  The heterogeneity problem for hedonism: Hedonism says pleasure is the only intrinsic
  good, and pain the only intrinsic bad. But "pleasure" as used covers: sensory pleasures
  (sex, food, warmth), intellectual pleasures (solving problems, learning), aesthetic
  pleasures, relief (cessation of pain), the pleasure of achievement, schadenfreude,
  masochistic pleasure, etc. The problem: if "pleasure" names no single felt quality,
  then "the only good is pleasure" is not a determinate claim; the hedonist might
  be smuggling in a disjunction or reducing to "whatever is liked/desired" (which
  is desire-satisfactionism, not hedonism). Or the hedonist must defend a common quality
  (e.g., a distinctive hedonic tone) which seems implausible. Feldman''s attitudinal
  pleasure (enjoyment as a propositional attitude) is one response; but then what
  unites enjoyments? The debate includes whether pleasure is a sensation, an attitude,
  or a functional concept.


  Good satire moves:

  - A bureaucrat tries operationalising "pleasure" by asking people to list "pleasurable
  experiences"; gets a mess of categories; creates Category 7 "Miscellaneous and Borderline
  (including relief, schadenfreude, the feeling of being right)."

  - The "sameness" claim: to keep the system simple, the office defines all entry
  types as "hedonic" by fiat: "For administrative purposes, ''pleasure'' means any
  experience the applicant chose to list, provided it was not listed under pain."
  But that''s preference satisfaction, exposing the slide.

  - Exclusion moves: the FAQ might say "Type C pleasures (malice, envy-satisfaction)
  do not qualify for relief because they are not, on reflection, genuinely pleasurable,"
  which quietly appeals to a normative standard of good pleasures — i.e., smuggling
  in values beyond pleasure.

