  Standard positions on the paradox of tragedy (from SEP "Tragedy" maybe?):

  - Hume''s conversion/compensation theory: the aesthetic pleasure subsumes/overpowers
  the pain; artistic excellences convert painful passions into pleasurable ones, or
  induce pleasure in addition.

  - Relief/catharsis (Aristotle, Freud?): the purgation of pent-up emotions itself
  is pleasurable or relieving.

  - Meta-response/control theories: We enjoy not the negative emotions but our ability
  to control or learn from them; e.g., Marcia Eaton, John Morreall''s "Enjoying Negative
  Emotions in Fiction" argues we enjoy feeling in control of our emotions. Actually
  Morreall''s theory: we don''t have the real bodily/behavioral reactions because
  fictions don''t require action; we enjoy our belief that we control the emotional
  responses.

  - Compensation/conciliation (Feagin? Susan Feagin''s "The Pleasures of Tragedy"):
  we take pleasure in our own sympathy; we are pleased that we respond morally/caringly,
  though we feel pain at events. This is a meta-response too: "pleasure in our own
  sensitivity." Susan L. Feagin argues that pleasures of tragedy arise from our responses
  to our responses: we admire our own empathy.

  - Rich experience theory (Aaron Smuts): Negative emotions are at best the cost;
  we value painful art for rich experiences, not because we enjoy them.

  - "The problem of the paradox" perhaps Alex Neill, etc.


