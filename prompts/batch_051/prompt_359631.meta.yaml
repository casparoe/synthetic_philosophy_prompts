  "Last week a friend and I spent an evening arguing about whether computational complexity
  theory has anything to teach epistemology, and by the end I had talked myself into
  a position I now want to stress-test. The position is roughly this. Results in complexity
  theory show that certain inferential tasks any fully rational agent is supposed
  to perform — exact probabilistic inference over a rich set of hypotheses, updating
  on one''s total evidence, recognising all the logical consequences of one''s beliefs,
  and so on — are intractable in general: for many natural cases the computation blows
  up in a way no plausible physical agent could tame, and in several cases even approximate
  solutions are provably hard. I took this to show something normative, not merely
  practical. An ideal of rationality that is impossible for any physically realisable
  agent, even in principle, cannot serve as the standard against which our actual
  reasoning is measured; ''ought implies can'' rules it out, and so ideals such as
  logical omniscience or full Bayesian conditionalisation are better understood as
  category mistakes dressed up as regulative ideals than as genuine norms for finite
  minds. My friend resisted this by saying that an ideal can be unattainable and still
  do useful work, much as a frictionless plane does in physics. I wasn''t moved, but
  I now want to know how exposed my position actually is."


