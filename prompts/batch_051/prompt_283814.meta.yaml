  dependent due to common causes; the "common cause principle" says correlations require
  explanation by causal structure; independence is the null. Heuristic arguments in
  math/physics use independence to estimate probabilities (e.g., Cramér''s model,
  Hardy–Littlewood k-tuple, random models for primes, probabilistic method). Formalizing
