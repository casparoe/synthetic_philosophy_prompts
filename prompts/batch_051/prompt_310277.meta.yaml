  Let me verify my memory of algorithmic randomness to ensure the prompt''s technical
  claims are accurate. Key points:

  - Kolmogorov complexity of a finite string x is the length of the shortest program
  that outputs x on a fixed universal Turing machine.

  - A string is random if its Kolmogorov complexity is close to its length (incompressible).

  - Invariance theorem: complexity is well-defined up to an additive constant, so
  for long strings the choice of universal machine matters little; for short strings
  it matters.

  - For any finite string, there exists a Turing machine (or programming language)
  relative to which it has very low complexity — just build a machine that hardcodes
  the string. So no finite string is random in an absolute, language-independent sense.

  - Almost all strings of length n are incompressible (random), because there are
  at most 2^{n-c} programs of length < n-c.

  - Martin-Löf randomness is for infinite sequences; finite strings are only "random
  to a degree."

  - The set of all strings of a given length has low complexity (it can be generated
  by a short program that enumerates all strings), while individual random strings
  have high complexity. This is a nice point: the Library of Babel as a whole is simple
  (all books), but individual books are mostly random; the "book that explains the
  library" would be a short description of the whole set, which exists but is unremarkable
  (the library itself is just all combinations). The story treats the total book as
  sacred and unique, but algorithmically the library as a set is trivially compressible.
  That''s a great critical point.


