  Galen Strawson''s Basic Argument (from "The Impossibility of Moral Responsibility,"
  1994, also in Freedom and Belief 1986). Premises:

  (1) Nothing can be causa sui — nothing can be the cause of itself.

  (2) To be truly morally responsible for one''s actions, one would have to be truly
  responsible for the way one is, at least in certain crucial mental respects.

  (3) To be truly responsible for the way one is, one must have brought about the
  way one is, in the relevant respects. But one cannot bring about the way one is
  without already having a certain nature/character that determines how one brings
  it about. Therefore one would have to have chosen that nature, leading to infinite
  regress. Hence nothing can be truly morally responsible.


  So the Basic Argument: You do what you do because of the way you are. To be truly
  responsible for what you do, you must be truly responsible for the way you are.
  To be truly responsible for the way you are, you must have intentionally brought
  it about. But you can''t be responsible for the way you are, because that would
  require an infinite regress of self-creation. Therefore, no one is truly morally
  responsible.


