  couldn''t form the credible disposition, and the mugger detects this, so the supposedly
  rational policy is self-defeating. A conception of rationality that prescribes the
  self-defeating policy can''t be right. If rational people die in these scenarios
  while irrational people survive, maybe we''re measuring rationality wrong.


