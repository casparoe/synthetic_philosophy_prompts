  only if you sincerely promise to pay him a large sum once you are home; he is a
  good enough judge of character that he will leave you there unless you are, at the
  moment of promising, the kind of person who will in fact pay later. The dispute
  began when Elena said that, in the nearest possible world where you actually would
  pay when you got home, the act of paying is not some regrettable lapse of rationality
  but the rationally required completion of the only policy that could have saved
  you. Marcus replied that this conflates the disposition with the act: once you are
  home and safe, the fact that your trustworthiness got you rescued adds nothing to
  the balance of reasons for handing over the money, so paying is simply irrational
  from the standpoint of self-interest, even if it is the behavior of a disposition
  it was rational to have. Elena answered that Marcus''s position makes the rational
  agent self-defeating: an agent who follows his advice would know in advance that
  his later self will renege, could not be the kind of person the stranger picks up,
  and would die in the desert while the allegedly irrational agent drives home; a
  principle of rationality that systematically kills its followers cannot be the right
