  ---


  I am a philosophy PhD student working on practical rationality, and I have been
  turning over an argument from our reading group about Parfit''s hitchhiker that
  I cannot settle. The case we discussed was set up as follows: you are stranded in
  the desert and a driver offers to take you to safety only if you sincerely promise
  to pay him a thousand dollars once you reach home; he is an excellent judge of character
  and will leave you behind unless he is convinced at the moment of the promise that
  you really will pay, and it is stipulated that after he drops you off you will never
  meet again and no one will learn whether you kept the promise. Elena argued that
  in the actual world it would be rational to pay: the act inherits its rationality
  from the fact that it is the only policy under which the stranger would have picked
  you up, and a person who was prepared to abandon that policy once rescued could
  not have formed the commitment the case requires. Marcus replied that this conflates
  a disposition with its manifestation. Once you are home and safe, he said, the rescue
  is in the past, and the fact that your trustworthiness got you saved adds nothing
  to the balance of reasons for handing over the money; the act of paying is therefore
  irrational from the standpoint of self-interest, even though it was rational to
  have the disposition that produces it. Elena answered that Marcus''s view makes
  the rational agent self-defeating: an agent who accepts his advice would foresee
  that his later self will renege, could not be the kind of person the driver will
  pick up, and would die in the desert while the allegedly irrational agent drives
  home; a standard of rationality that systematically disables those who follow it
  cannot be correct. Marcus answered that this only shows rationality and advantage
  can come apart. The rational agent should seek some binding device, and if none
  is available, he should accept that he cannot credibly promise, rather than retrospectively
  redescribe the later payment as rational. That is where the argument stalled.


