  Actually the classic Parfit hitchhiker: A mugger threatens to kill you unless you
  promise to pay him $1000 tomorrow. You have no way to be compelled. The mugger knows
  whether you are the sort of person who keeps promises. If you''re not trustworthy,
  he''ll kill you. So it pays to be trustworthy. But when tomorrow comes, keeping
  the promise doesn''t benefit you—you''ve already been released. The question: is
  it rational to keep the promise? Parfit argues that it can be rational to cause
  yourself to be trustworthy, even though the act of keeping the promise is itself
  irrational (in self-interested terms), because the disposition to keep it has good
  effects.


  There are various refinements: the mugger might be able to tell if you''re a person
  who keeps such promises; "rational irrationality" is the idea that a rational agent
  might rationally cultivate an irrational disposition because having that disposition
  is beneficial. But the debate includes whether the act itself is irrational, whether
  you could self-administer some mechanism, whether the disposition is global vs.
  case-specific, whether Kavka''s toxin puzzle is similar, etc.


  For the disagreement, two students could argue:


  - A ("Elena"?) says: It''s rational to keep the promise, because the only way to
  secure the benefit in the desert is to actually be the kind of person who keeps
  it; if you merely plan to keep it but would renege when the time comes, the mugger
  would detect that and you''d die. So treating the promise as giving you a reason
  tomorrow is rational—it''s the disposition that saved your life, and you can''t
  separate the disposition from the act.


  - B ("Marcus") says: That conflates the disposition with the act. Once you''re home
  safe, the reason to keep the promise from self-interest is gone. If keeping it cost
  you nothing, maybe fine; but it costs $1000, and no self-interested reason exists.
  So the act of paying is irrational—it''s the exception that proves the disposition.
  The lesson is that rationality can favor being irrational later, which is exactly
  the paradox.


