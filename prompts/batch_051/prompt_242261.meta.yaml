  The "Condorcet jury theorem" domain is interesting and in the weeds enough. Could
  do type 1: a subtle confusion/false presupposition. The classic subtle confusion
  with CJT: people often think CJT shows that majority rule is reliable for any issue
  / large groups are wise / democracy works because voters'' errors are independent
  and each slightly better than chance. The false presuppositions: that the theorem''s
  conditions (independent votes, sincere, binary choice, homogeneous competence >
  0.5) are met in real elections; that adding more voters helps when competence <
  0.5; that competence is exogenous; that majority being right > each individual''s
  probability doesn''t mean the majority is wise for your particular decision. Also
  the "jury theorem" is about juries deciding between two options with a common interest,
  not about varied preferences or moral questions.


  A good question type 1: "I read that the Condorcet jury theorem shows that if each
  voter is more likely right than wrong, majority vote is very likely right and this
  probability increases with group size. Does this mean we can resolve difficult political/factual
  disputes by polling ever-larger groups of reasonably informed laypeople?" The confusion:
  the theorem''s assumptions (independence, common objective truth, competence direction/sincerity)
  fail, and also it doesn''t say large groups are wise in any given case. A good answer
  would correct the presupposition.


  But the instruction says prompts should be somewhat in the weeds, so models can''t
  just regurgitate commonly seen prompts. The Condorcet jury theorem is itself somewhat
  less commonly prompted, so okay. But "does CJT show democracy works?" might be cliché.
