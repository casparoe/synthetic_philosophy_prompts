  ---


  I have been trying to work out what, if anything, licenses an observer to read an
  agent''s preferences, values, or desires off the agent''s observed behaviour. The
  near consensus in economics is that choice reveals preference only against a background
  model of the choice situation, and in inverse reinforcement learning the reward
  function one recovers is only as good as the model of the agent''s environment,
  beliefs, and possible actions. But my verdicts on concrete cases keep pulling apart,
  and I cannot yet state the principle that sorts them.


  Here are some of the cases on which I have settled intuitions. (Perhaps include
  5-7 cases.)


  - A colleague always chooses tea rather than coffee in the staff kitchen; I infer
  she prefers tea.

  - A visitor who has been told, incorrectly, that the main course contains an allergen
  he is trying to avoid chooses the vegetarian option; I do not infer that he prefers
  the vegetarian dish, only that he prefers what he took himself to be choosing. And
  yet if he knew the menu was safe and still chose the vegetarian dish, I would infer
  a genuine preference. The observed movements are identical; my verdicts differ.

  - A person who hands over his wallet at knifepoint is not thereby revealed to prefer
  handing over his wallet; we subtract the threat before inferring preference.

  - A patient with advanced dementia who repeatedly smiles when a particular old song
  is played seems to reveal a preference, even though he can no longer state it, and
  even though he cannot choose among alternatives in any robust sense.

  - A toddler who refuses an unfamiliar food on first sight seems to reveal only neophobia,
  not a valuation of that particular food''s taste; I would not put ''dislikes this
  food'' into her utility function on the strength of that refusal alone.

  - Two investors take the same portfolio gamble. One understood the risk and sought
  the high expected return; the other misread the prospectus. I am happy to attribute
  risk tolerance to the first but not the second.


  The pair that most bothers me is the allergy case and the investor case: in each,
  two agents perform observably similar actions, but my willingness to attribute an
  underlying preference turns on facts about their beliefs, not on anything in the
  choice behaviour itself. I can see that some sort of ''as-if maximisation relative
  to the agent''s own representation of the options'' principle is doing the work,
  but I am not sure how to state it precisely, what it demands by way of an agent
  model, or where it stops: a person can be mistaken about facts, but what about mistaken
  about what he himself wants? Must we also model his capacities, attention, self-control?


  What I would like is the best available principle — or a small set of candidate
  principles — that captures these verdicts, stated precisely enough that one could
  in principle implement it in the reward-inference step of an inverse reinforcement
  learning system. The principle should tell me what goes into the agent model before
  observed behaviour may be turned into attributed preferences, and what purely behavioural
  evidence can and cannot establish.


