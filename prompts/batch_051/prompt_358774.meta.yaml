  Common misreadings: Kant predicted republics don''t fight each other (democratic
  peace theory). Actually Kant says if consent of citizens required, they''ll be cautious
  about war because they bear its burdens; but he doesn''t say republics never fight;
  he says republican constitution is the one most conducive to peace and by nature
  tends toward it; the guarantee of nature works through self-interest and commerce,
  not necessarily through each state becoming good. Also he distinguishes democratic
  (direct) from republican (representative). He endorses a federation of free states
  rather than a world government (universal monarchy = soulless despotism). He doesn''t
  propose a federal world state with coercive power; the federation is a voluntary,
  revocable league, which he admits is a "negative surrogate" to secure peace, weaker
  than a true international state but what''s achievable.


