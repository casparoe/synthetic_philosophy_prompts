  Detailed design of the taxonomy:


  The question: what makes a ground of discrimination suspect — i.e., why do we single
  out race, sex, religion etc. for special legal/moral scrutiny, while height, taste
  in music, or being a fan of a sports team aren''t protected?


  Logical space of candidate criteria:

  1. Immutability / unchosenness: you didn''t choose it, so it''s unfair to penalise
  you for it.

  2. Visibility / salience / stigmatisation? Actually salience is more about why stereotypes
  form; a ground is suspect if it''s visible and marks a group? Hmm, but visibility
  cuts both ways: concealable traits (religion, sexual orientation) can also be protected.
  The question is whether visibility matters.

  3. Historical or continuing group subordination / caste: the ground marks a group
  that has been systematically denied equal standing.

  4. Irrelevance to merit/desert: the trait is not a legitimate qualification for
  most jobs.

  5. Dignity / equal citizenship: using the ground demeans people or treats them as
  second-class citizens.

  6. Brute luck vs option luck: unchosen circumstances vs chosen conduct — criminal
  record is chosen, so maybe not suspect; but some say criminal record should be protected
  because of how it compounds disadvantage.


  Cases:

  - race (immutable, visible, historically subordinated, irrelevant to most merit)

  - sex (immutable, visible, historically subordinated)

  - sexual orientation (partly immutable/stable, concealable, historically subordinated)

  - religion (chosen-ish, changeable, concealable, historically persecuted — challenge
  to immutability)

  - disability (unchosen, sometimes visible, not necessarily a subordinated "group"
  in the caste sense, relevant to some jobs)

  - age (universal, changes over life, not chosen — challenge to immutability? It
  is unchosen but affects everyone)

  - height (immutable, visible, not historically a subordinated group, sometimes job-relevant)

  - criminal record (chosen conduct, but stigmatised and compounds disadvantage)

  - being a smoker / obesity (behavioural/health, arguably chosen, stigmatised)

  - political affiliation (chosen, concealable, but expressive/political)

  - pregnancy? (sex-linked, unchosen, temporary)

  - genetic predispositions (unchosen, invisible, not a social group)


  Diagnostic questions should be concrete scenarios:

  1. "A firm refuses to hire anyone under 5''2" for an office job with no physical
  requirements. Should this be treated like sex discrimination?" — separates immutability
  (yes) from group-subordination (no, height isn''t a caste). Hmm but if the height
  cutoff is a proxy for sex? avoid proxy. Just "height".

  2. "Should a religious conversion be treated differently from race? If someone could
  change the trait, does that make discrimination against it less objectionable?"
  — separates immutability from equal-citizenship/group-subordination (religion is
  chosen but still suspect because of history). Actually this is a classic: religion
  is protected despite being chosen, which troubles immutability accounts.

  3. "Should discrimination on the basis of criminal record be treated like race discrimination
  in hiring?" — separates choice/desert from anti-caste (criminal record is chosen
  conduct, but marks a stigmatised group and compounds racial disadvantage).

  4. "Should employers be allowed to reject applicants because they support the wrong
  football team?" — tests relevance-to-merit and triviality.

  5. "Is age discrimination like sex discrimination? Age affects everyone eventually;
  the old were once young." — separates immutability (age is unchosen but universal
  and shifting) from group-subordination (the old are a subordinated group in employment?)
  and from "veil of ignorance"/life-stage accounts.

  6. "Should obesity or smoking be protected? If someone can (with difficulty) change
  it, does that matter? What if it''s partly genetic?" — separates brute luck vs option
  luck and immutability''s boundaries.

  7. "Should a trait''s visibility matter? Is it worse to discriminate on a visible
  trait than a concealable one?" — separates dignity/stigma accounts (visibility may
  exacerbate stigma) from others.

  8. "Should a ''no beards'' policy be treated like religious discrimination when
  it burdens Sikh men?" — indirect discrimination, reasonable accommodation; maybe
  too specific. Could use "a dress code that bans headscarves" — tests whether the
  ground is suspect even when the rule is neutral. This is about indirect vs direct
  discrimination; maybe separate "group subordination" accounts (which care about
  impact) from "choice" accounts.

  9. "Is it suspect to discriminate against someone because of their political party
  membership?" — chosen, but expressive; some jurisdictions protect political opinion
  in employment. Separates choice accounts from dignity/equal-citizenship accounts.


  Positions as leaves:

  - The immutability view (unchosen traits are suspect). Awkward: religion is protected
  though chosen; age is unchosen but not always treated as suspect.

  - The choice/desert view (penalising people for unchosen traits is unfair, chosen
  conduct is fair game). Awkward: religion and political opinion are chosen but widely
  protected; also many "chosen" statuses are hard to exit (criminal record).

  - The group-subordination / anti-caste view (suspect iff the ground marks a group
  that has been historically subordinated). Awkward: disability doesn''t fit the "caste"
  model neatly; age and maybe obesity involve subordination but aren''t always protected;
  also doesn''t explain why a newly salient trait might be suspect.

  - The equal-citizenship/dignity view (suspect iff using the ground demeans or excludes
  from equal standing). Awkward: hard to operationalise; may overreach to trivial
  tastes if exclusion feels demeaning.

  - The irrelevance/merit view (suspect iff the trait is irrelevant to the legitimate
  purposes of the decision). Awkward: almost every trait is irrelevant to many jobs,
  so it makes the category of "suspect grounds" very wide; and it doesn''t explain
  why race gets stricter scrutiny than, say, being a fan of a rival team.

  - The brute luck view (luck egalitarian): suspect iff it tracks brute luck rather
  than option luck. Awkward: difficult to draw brute/option luck boundaries (is religion
  brute luck if raised in it?); stigmatised conduct like criminal record can be heavily
  constrained by brute luck.

  - Maybe "the anti-stereotyping view" — a ground is suspect because decisions on
  it rely on inaccurate statistical generalisations. Awkward: would permit accurate-but-invidious
  discrimination (e.g., statistical discrimination that is efficient but demeaning).

  - Maybe "pluralist / no single criterion" view: suspectness is a family resemblance
  of several factors (immutability, history of subordination, political powerlessness,
  irrelevance to merit, stigma). Awkward: no principled way to weigh the factors,
  so it''s ad hoc.


