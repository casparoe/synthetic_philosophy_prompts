  Here is a practice I find philosophically puzzling. In applied economics, it is
  routine for a journal article to derive a conclusion from a model whose assumptions
  are plainly false — perfect competition, complete markets, agents who solve infinite-horizon
  optimization problems, zero transaction costs — and then to use that conclusion
  to evaluate some real policy, such as a minimum-wage change or a carbon tax. Sometimes
  the author apologizes for the assumptions; sometimes the author treats them as harmless.
  In physics pedagogy, the same pattern appears unapologetically: frictionless planes,
  point masses, infinite conducting wires are taught as revealing how systems behave,
  even though no such systems exist.


  Now the puzzle: the same communities do not treat every false assumption as harmless.
  An economist will reject a paper because an assumption is "too strong" or "does
  all the work," and a physicist will object that a model leaves out the very mechanism
  under study. So the practice seems to presuppose some distinction between idealizations
  that are legitimate and assumptions that are merely false, but the distinction is
  rarely stated.


  What philosophical commitments does this practice presuppose? Specifically:

  (1) Does it strictly presuppose an instrumentalist view — that a model is justified
  by its predictions and the truth of assumptions is irrelevant — or is it equally
  compatible with a realist view on which a good idealization strips away interfering
