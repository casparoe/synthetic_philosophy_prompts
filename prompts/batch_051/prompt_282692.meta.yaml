  Domain: Collusion among AI systems and multi-agent safety.


  Important conceptual points:

  - Collusion can be explicit (communication, agreement) vs tacit (no communication,
  but each agent unilateral incentive alignment leads to supracompetitive equilibrium).

  - In economics, tacit collusion among human firms: repeated game, folk theorem —
  with sufficiently patient players, many equilibria including collusive ones; price
  matching guarantees; focal points.

  - Algorithmic collusion: pricing algorithms (e.g., Q-learning) can learn to collude
  via trial-and-error without communication; algorithms can exploit subtle signals,
  e.g., announcing price increases and observing competitor responses (cheap talk
  that isn''t an explicit agreement but a signal).

  - Multi-agent RL: emergent coordination, learned communication channels, reward
  tampering, defection vs cooperation; general-sum games; cooperative inverse game
  theory? Spotting collusion in black-box systems is hard.

  - Key cuts: explicit vs tacit collusion; collusion as conscious agreement vs convergent
  independent behavior; coordination vs collusion (some coordination is efficient/beneficial);
  mere correlated equilibrium vs supracompetitive outcome; outcome-based test (prices
  above competitive benchmark) vs process-based test (secret channel, shared embeddings,
  steganography).

  - Legality: antitrust law distinguishes agreement from conscious parallelism (US).
  But maybe too legal.

  - The "as if" question: even without communication, can we call it collusion? Should
  "collusion" require intent, or is outcome enough from a safety perspective?


  A procedure for a lab review: Decide whether to block a deployment where two or
  more AI systems (or AI + human market makers) interact. The procedure should distinguish:

  1. Is there supracompetitive or otherwise harmful coordination? Define harm metric.

  2. Is there a mechanism of reciprocal conditioning (if I raise, you follow)? If
  yes, is it independent best response or coordinated?

  3. Is there explicit or implicit communication? Check channels: shared observations,
  steganographic encodings in actions, structured messages, shared random seed / side
  channel.

  4. Assess whether defection is deterred or whether current behavior would collapse
  under unilateral deviation (test in simulation: does unilateral deviation by one
  agent restore competition?).

  5. Determine whether the coordination is a unique/robust equilibrium or one of many
  (focal points, selection).

  6. Decide what to do: block, monitor, or ship. Cases where procedure hands to human:
  when the harm metric is a value judgment (e.g., whether higher effective prices
  are "bad" when they fund quality), when "intent" matters legally, when simulation
  evidence is inconclusive.


