  Photography transparency: Kendall Walton (1984) "Transparent Pictures: On the Nature
  of Photographic Realism" argues photographs are transparent—we see the photographed
  object through the photograph, like seeing through mirrors/telescopes; photography
  is a prosthetic visual aid. Currie argues photographs are not transparent; seeing
  is a natural kind with egocentric spatial information, etc. Arguments for transparency:
  (1) counterfactual dependence: photo beliefs are counterfactually dependent on the
  scene in a way like perception, not like paintings; (2) lack of intentional mediation:
  the object caused the image directly, unlike a painter''s beliefs/intentions; (3)
  photographs support "recognition" of unseen individuals, like perception; (4) the
  "we see through microscopes" analogy — seeing through optical devices is still seeing.
  Arguments against: seeing requires egocentric spatial relation and real-time causal
  chain? (Currie); transparency trivializes seeing; cartoons/visual prostheses (Noë?);
