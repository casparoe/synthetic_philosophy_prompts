  Prompt draft:


  "Hi — I''m a journalist covering science and ideas, and I''m working on an explainer
  about the nonidentity problem for a general but science-literate audience. I want
  to avoid the usual distant-future, climate-policy, extinction-y examples, and I
  also don''t want the version where the child''s life isn''t worth living. What I
  need is a thought experiment built to spec.


  Here''s what I need it to do. I want a same-number nonidentity case: the choice
  affects which person comes into existence but not how many people exist, so the
  person who ends up existing wouldn''t have existed under the other option. The case
  should be ordinary-life — say, a couple deciding about the timing or method of conceiving
  a child, with only routine reproductive medicine, no sci-fi. Keep the scenario to
  one paragraph. The chosen child''s life has to be clearly worth living — in fact,
  the kid is, on the whole, glad to exist — but the parents passed up a cheap, easy
  alternative that would have produced a different child with a much better life,
  and their reason for not waiting was something pretty trivial (impatience maybe).
  I want the ordinary reader to feel that the choice they actually made was criticizable,
  even though no one is obviously worse off for it.


  Then I need the check part. State the choice and the two possible children A and
  B, and walk through why a narrow person-affecting principle says the parents didn''t
  wrong anyone — in particular, why they didn''t wrong the child they actually had
  — while a wide person-affecting principle (or a same-number quality principle, if
  you prefer) says the outcome they chose was worse. I want you to be explicit about
  which feature of the case is doing the work, what would happen if you changed that
  one feature (say, the child''s life was just barely worth living, or the alternative
  child would only have been slightly better off), and what a defender of the narrow
  person-affecting view would say to resist the intuition the case is supposed to
  trigger. And then, because I''m going to build an explainer out of this, tell me
  how confident you are that the case really isolates same-number nonidentity as opposed
  to some other issue, and single out the point in your construction you''re least
  sure about."


