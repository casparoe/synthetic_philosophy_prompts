  The fair-play principle (principle of fairness): When a number of persons engage
  in a just, mutually beneficial cooperative scheme, and the benefits are produced
  by everyone''s (or nearly everyone''s) submission to its rules, those who have voluntarily
  accepted the benefits are obligated to bear their share of the burdens, even if
  they have not consented, and free riding violates this obligation. Nozick''s objection:
  beneficial but unwanted impositions (a neighborhood PA system broadcasting music/entertainment)
  don''t generate obligations unless benefits are actually accepted. Key conditions
  from Simmons: (1) the scheme must be mutually beneficial and just; (2) cooperation
  requires sacrifice/restriction; (3) benefits must be open to all (public goods);
  (4) the beneficiary must voluntarily accept the benefits; and maybe (5) acceptance
  of benefits is in a context where it''s understood they come at a cost.


  Now, a contemporary argument: environmental harms, global public goods, tax-funded
  institutions — free riding condemned. But the "voluntary acceptance" condition is
  hard to satisfy for many public goods (clean air, herd immunity, national defense,
  public broadcasting) because you can''t readily refuse the benefit. So either: (a)
  the fair-play principle is too weak to condemn many actual free riders, or (b) theorists
  have loosened acceptance into "receipt" (which Nozick rejected) and thereby turned
  merely being in a society into obligation — which makes free riding wrongness collapse
  into something like a natural duty of justice or a duty to participate in necessary
  institutions, not fairness.


