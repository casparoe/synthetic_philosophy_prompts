  Possible draft (parallel type):


  ---


  I''m a software engineer by training, and I''ve been reading some cognitive science
  on the side, and there''s an analogy I can''t stop turning over. The psychological
  claim seems to be that perception is "informationally encapsulated": the low-level
  systems that build your visual or auditory experience run more or less like pure
  functions on their sensory inputs, and your beliefs, desires, and expectations are
  walled off from them. That is what makes illusions stick around even after you know
  the trick, and what keeps the system fast and mandatory. But then there is the other
  claim, "cognitive penetration," that under some conditions what you believe or expect
  does alter what you literally perceive—not just how you interpret or respond to
  it. To me this looks exactly like the difference, in code, between a function that
  respects its declared inputs and a function that quietly reads mutable global state.
  Encapsulation in software is the rule that a module''s behavior should depend only
  on what is passed to it; a leaky abstraction is when it secretly depends on environment
  state that isn''t in the interface. Cognitive penetration, from where I sit, just
  is a leaky abstraction: the perceptual module is reading global state behind my
  back.


  Before I lean on this analogy in arguments with my colleagues, I want to know whether
  it''s deep or superficial. Spell out the mapping precisely: what in the perception
  story corresponds to the function, the declared inputs, global state, and the leak?
  What would have to be true on both sides for results to transfer from software to
  perception and back? In particular, in software we distinguish a hidden global that''s
  a bug from a deliberately injected dependency, and we distinguish configuration
  loaded at startup from state mutated during runtime; does the perception side have
  counterparts to those distinctions, or does the analogy force a line that cognitive
  scientists themselves reject? And can you name at least one thing the analogy would
  predict about perception or about software that is false, so I can see where the
  structure comes apart? If it survives all that, tell me what it''s actually good
  for.


