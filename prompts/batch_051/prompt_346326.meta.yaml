  ---


  I help run my school''s philosophy club, and next week I am leading a session for
  about fifteen students, mostly juniors and seniors with no philosophy background,
  on Hume''s essay about the standard of taste. We have already read a short secondary
  summary together, so they know the rough conclusion—that some verdicts about beauty
  and art are better than others, and that the best judges are people with practice,
  comparison, delicacy of taste, freedom from prejudice, and good sense—but they mostly
  think the whole project is confused, because "everyone has their own taste" feels
  obviously right to them. I do not need the essay explained to me; I need a teaching
  plan.


  Please act as a specialist in aesthetics who has taught this material many times.
  Think carefully and start by brainstorming the two or three ideas the session absolutely
  depends on. Then give me the order in which to introduce the pieces, and explain
  exactly what depends on what. I am trying to decide which example should carry the
  whole session: I was considering the story Hume borrows from Don Quixote, where
  two of Sancho Panza''s kinsmen taste a hogshead of wine and one detects leather
  and the other iron, after everyone else has judged it excellent. Before I commit
  to it, tell me whether it carries the idea well and what a carrying example for
  this topic must have and must not have, and whether any alternative would work better
  for high-schoolers. I also want the misconceptions they will predictably form or
  arrive with—such as the idea that a standard of taste would have to be a rule or
  a proof, or that it would just mean deferring to stuffy critics, or that persisting
  disagreement kills the whole idea—and the exact point in the sequence where I should
  head each one off. End with one check for understanding that would show me whether
  they have genuinely grasped the idea rather than just repeated back that "some opinions
  are better than others." Tell me what to leave out or openly refuse to cover at
  this level.


