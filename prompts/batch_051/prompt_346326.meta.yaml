  Let me think about misconceptions for Hume''s standard of taste that a high-school
  audience would have:


  1. Subjectivism/relativism: "taste is purely subjective; there''s no disputing tastes."
  This is the entry point — students arrive with "everyone has their own opinion,
  and that''s the end."

  2. If a standard exists, it must be like a mathematical proof or a rule one can
  apply mechanically (procedure). Hume''s standard is not algorithmic; it''s the joint
  verdict of competent judges. Misconception: standard = set of objective criteria.

  3. Mistaking the standard for the majority or for current fashion: if less/more
  people like something it''s better. Hume distinguishes.

  4. The ideal critic as an elite/snob: mistaking "true judges" for whatever credentialed
  critics say, or as arbiters whose say-so makes things good; rather, they are the
  persons whose verdicts are most reliable, and the standard is contrasted with their
  verdict but their verdict is defeasible/fallible.

  5. Beauty vs. the judgment of beauty: "the standard of taste is a matter of fact
  out in the world" vs "the standard constrains judgments."

  6. Misconception that disagreement in taste refutes a standard: persistent disagreement
  shows no standard. Hume responds with sources of variation (age, temperament, culture)
  and distinction between blameless diversity and real defect.


