  The debate: Are dreams experiences? Norman Malcolm argued in "Dreaming" (1959) that
  dreams are not experiences at all: the concept of experience requires waking criteria;
  sleeping people don''t report; "I was dreaming" on waking is not a report of a mental
  state that occurred during sleep but an expression of a disposition... Actually
  Malcolm''s view: it''s senseless to suppose someone is thinking/judging/experiencing
  while asleep, because our criteria for those mental concepts involve behavior and
  circumstances that are absent in sleep. Dream "reports" on waking are not memories,
  because they''re not subject to the usual checks; he denies that there are mental
  states during sleep. So Malcolm: no experiences during sleep; retrospective "dream
  reports" are not reports of anything that occurred.


  Dennett: In "Are dreams experiences?" (1976) and "Consciousness Explained," he argues
  there is a third option between "dreams are experiences as remembered" and "dreams
  are not experiences" — dreams are experiences but their content/properties are underdetermined;
  the "cassette" thought experiment: awakening and a cassette playing a dream narrative
  loaded into memory, no actual experience. He argues the received view makes unjustified
  assumptions about the determinacy of dream content. Actually Dennett''s position
  is subtle: the question "are dreams experiences?" presupposes that either there
  was a real experience with determinate content or none; he proposes dream memories
  could be "loaded" at awakening, and the question has no determinate answer; he argues
  dreams are not what commonsense takes them to be. He''s a kind of skeptic about
  the received "cinematic" theory of dreaming; he endorses a "cassette theory" as
  epistemically equivalent. Actually Dennett suggests we might be unable to distinguish
  and it might be indeterminate.


  Positions:

  1. The "received view" (commonsense/scientific companion): dreams are conscious
  experiences during REM sleep, whose temporal course roughly matches the narrative;
  waking reports are (fallible) memories of those experiences.

  2. Malcolm''s view: no conscious experiences during sleep at all; waking dream reports
  are not memories but something else (expressive or confabulatory); the very attribution
  of experience during sleep is unsupported.

  3. Dennett''s view (cassette/verificationist or skeptical underdetermination): there
  is no determinate fact whether the events "happened in experience" at the time;
  dream memory may be a cassette loaded at awakening; dream experience content is
  not as determinate as the received view assumes. Dennett does think some neural
  events occur but the phenomenology is retrospective.

  4. Maybe a view: dreams are experiences but temporally compressed (the narrative
  occurs in a flash at the end of the night or during micro-arousal) — this is a classic
