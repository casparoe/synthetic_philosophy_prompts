  companies like the East India Company or the Virginia Company, which really did
  govern territory, levy taxes, wage war, and administer justice, while being formally
  profit-making joint-stock corporations. So the systematic view I''m attracted to
  is roughly: sovereign states are not different in kind from chartered corporations;
  they are just the last surviving ones that swallowed up all their rivals. But I
  also have a firm, almost physical intuition that something is being flattened out.
  If the United Kingdom is just an East India Company that won, then why does it feel
  like an abuse of language to say Parliament and the East India Company''s board
