  Norman Malcolm, "Dreaming" (1959): He argues (inspired by Wittgenstein) that if
  someone is asleep and dreaming, they are not conscious/judging/remembering; hence
  the concept of a dream as an experience during sleep is incoherent. The so-called
  "empirical" evidence about when dreams occur (REM sleep) is conceptually confused
  because the only criterion for "I dreamed" is the waking report; there''s no verification
  of mental occurrences during sleep. His key claims:

  - "If a man is sound asleep, then he is not having any thoughts, feelings, or sensations"
  or something like that.

  - Dreams are not experiences; a dream is the waking report, or the tendency to tell
  a story on waking. To say someone dreamt is to say that on waking they are disposed
  to give a certain narrative.

  - There is a confusion in the idea of "remembering" a dream: one cannot remember
  an experience one never had; rather, the "memory" is the telling.

  - The concept of duration of dreams is suspect; can''t ask how long a dream lasted.


  Dennett, "Are Dreams Experiences?" (1976, Philosophical Review 85(2): 151-171):
  He argues against Malcolm that dreams are experiences, but he also problematizes
  the "received view" (the cinematic/presentation model). He proposes a "cassette
  theory" (or "library" model): dreams are not presented to consciousness in real
  time during sleep; rather, the dream memories are "composed" or "loaded" at the
  moment of waking/recall, so the experience of the dream (if it is an experience)
  is not tied to the actual duration of sleep. Dennett says something like: "Although
  dreams are experiences, they need not occur during sleep in the way we think" —
  the question "when did the dream occur?" is ill-posed; the dream content could be
  inserted into memory instantaneously at awakening.


