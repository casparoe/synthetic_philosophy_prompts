  (ii) together, because it treats rates estimated from biological history as if they
  were fixed propensities attaching to each new planet. I also argue that our own
  existence is a heavily conditioned datum: we necessarily exist on a planet where
  life arose, so the mere fact that life arose here doesn''t, by itself, license a
  strong inference either that life is common or that it is rare—nor does the absence
  of detected signals, unless we already know how detectable other civilizations would
  be. I end by claiming that once the three questions are separated, the ''paradox''
  looks more like an artifact of asking a single question with an ill-defined probability
  space than a genuine tension in our evidence.


