  something like a few percent credence, and that''s where the fight started.


  Dana said: if panpsychism is even, say, 2% likely, then the expected amount of experience
  in the universe isn''t in humans or animals; it''s in the trillions and trillions
  of micro-scale bits of matter. And if we have no idea what the valence of those
  experiences is — whether they''re suffering, or something neutral — then the tail
  risk of enormous invisible suffering should swamp every normal ethical consideration.
  By expected value, buying a coffee or scratching a rock could be ethically dominated
  by the chance that you''re causing a moral catastrophe at the micro level.


  Priya said that''s way too fast. Panpsychism says experience is ubiquitous; it doesn''t
  say suffering is. If the fundamental units are just dim flickers without valence
  — or a symmetric mixture of pleasure and pain — then there is no catastrophe and
  maybe no moral issue at all. You can''t go from ''experience everywhere'' to ''suffering
  everywhere'' without exactly the premise you''re trying to get out of it.


  Dana came back: sure, but you don''t know it''s valence-free either. Symmetry favors
  roughly equal chance of bad and good valence? Then the expected value is dominated
  by the bad possibility, because the numbers are astronomical and ordinary actions
  affect astronomical numbers of micro-entities. That''s just expected value reasoning
  with a tail risk, like AI risk or pandemics.


