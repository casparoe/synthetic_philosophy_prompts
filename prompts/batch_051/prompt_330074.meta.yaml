  Final text:


  ---

  Suppose an international conservation body adopts the following mechanism. It will
  maintain a registry of protected lineages. For listing and funding purposes, a lineage
  counts as a species if it satisfies at least one of four familiar candidate species
  concepts — the biological, phylogenetic, morphological, and ecological species concepts
  — as operationalised by a fixed scoring rubric applied by a rotating panel of systematists.
  Petitions to list or delist may be filed by any state, an accredited conservation
  NGO, or any group of three professional systematists. If the rubrics disagree about
  whether the lineage is a species, the lineage is listed but only as provisionally
  protected, and an objector then carries the burden of showing that its species status
  is unstable across concepts. Conservation finance is distributed to states in proportion
  to the number of listed lineages whose known range falls within that state''s territory,
  and a successful delisting reduces the state''s allocation. Panel members serve
  rotating three-year terms and are chosen by lot from a public register in which
  systematists declare their primary species concept.


  Treat this as a mechanism, not as a moral or conservation programme: the task is
