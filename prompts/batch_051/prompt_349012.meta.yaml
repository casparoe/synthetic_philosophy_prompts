  Draft:


  "You''re a political philosopher who works on sovereignty and international institutions,
  and I want you to think carefully from first principles, not reach for textbook
  answers. I''ve been playing with an idea I call membership bleed, and I''d like
  a brutally honest assessment of it.


  The core claim is that joining a customs union, a confederation, or anything in
  that family isn''t a one-time transfer of sovereignty, it''s the start of a standing
  renegotiation over what ''trade policy'' even means. The treaty text might only
  hand over tariffs, but tariff policy is entangled with product standards, subsidies,
  tax policy, visa rules — once you can''t use tariffs, you start regulating trade
  through all these other channels, and pretty soon the union has to legislate them
  to stop members cheating. So sovereignty doesn''t get transferred on signing day;
  it leaks out issue by issue as new topics get reclassified from domestic to common.


  I call the rate at which this happens the bleed rate. A pure treaty organization
  has a bleed rate near zero; a customs union has a moderate one; a federation is
  just what you get when the bleed rate has been high for long enough. My strong version
  of the idea: you can sort international organizations more truthfully by bleed rate
  than by their founding documents, and a ''confederation'' is just a customs union
  with a high bleed rate and some of the political machinery to cope with it.


  A quick example: a country joins a customs union thinking it only gave up tariff-setting.
  Ten years later it''s arguing about whether its corporate tax breaks are an illegal
  subsidy, because they shift trade exactly the way tariffs would. No treaty was renegotiated,
  but the union''s reach grew anyway. That growth is the bleed.


