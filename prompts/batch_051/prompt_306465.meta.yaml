  Potential prompt:


  "OK so for a reading group I''m stuck on this and need someone to just tell me where
  the reasoning goes off. I was reading Edward Thorndike''s Animal Intelligence (the
  1911 book) and this bit stuck with me:


  "The truth is that to a difficulty the animal responds by whatever its inherited
  and acquired nature has connected with the special form of difficulty and that in
  many animals the one response of those thus provided which relieves the difficulty
  is selected and connected more firmly with that difficulty''s next appearance. The
  difficulty acts only as a stimulus to the animal''s nature and its relief acts only
  as a premium to the connection whereby it was relieved."


  Here''s the argument I built out of this, and it seems to prove that either dogs
  don''t suffer or a trained policy network does, which feels absurd.


  (1) What makes a state like pain count as suffering, as opposed to mere nociception,
  is its valence: the animal is not just registering damage, it''s being moved away
  from that state.

  (2) Thorndike''s point is that valence just is the premium/penalty that selects
  responses: a state is negative for the animal insofar as it weakens the connection
  that led to it and strengthens whatever ended it.

  (3) So if Thorndike is right, the functional core of suffering is exhausted by a
  reward signal that punishes some policies and rewards others.

  (4) A modern deep RL agent has exactly that: a scalar reward signal that, through
  backprop or a gradient update, weakens or strengthens the connections that produced
  the last few actions.

  (5) Therefore if dogs suffer in the ordinary way, a well-trained RL agent with a
  negative reward for certain states also suffers in the ordinary way.

  (6) But that''s crazy. A PPO agent trained on Atari isn''t suffering when the score
  drops.

  (7) So by modus tollens, dogs don''t suffer either; we''re just sentimental about
  biological hardware.


  I don''t want to give up (6), and I''d really rather not give up (1). But I also
  don''t want to cheat by saying ''suffering is just biological'' without saying what
  the biology adds. Which premise should I actually reject, and what do I have to
  give up? If the problem is in the move from (2) to (3) or from (4) to (5), be specific
  about where the equivocation or scoping error is. Lead with your bottom line in
  the first sentence and then give the reasoning, no preamble, no restating of the
  question."


