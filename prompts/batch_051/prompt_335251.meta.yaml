  Centipede game (Rosenthal 1981): two players alternately choose Take (T) or Pass
  (P); payoff pie grows each round; if a player takes, they get the larger share now
  and the game ends; if pass, the other gets a turn. With finite n and eventually
  the pie stops growing and the last player takes. By backward induction, the first
  player takes at the first move. The "paradox": this seems to ignore trust, cooperation,
  and the possibility that players value each other''s payoffs or have non-common
  priors.


  A step-by-step argument version:


  (1) At the final decision node, the player to move must choose between ending the
  game with payoff x and passing, which would end the game and give her payoff y,
  where y < x. Since she prefers more money to less and is rational, she will choose
  to end the game (take).

  (2) Therefore, at the second-to-last node, the other player knows that if she passes,
  her own payoff will be ... which is less than if she takes now. Since she is rational
  and knows (1), she will take.

  (3) Iterate this reasoning back through every node.

  (4) Hence, at the first node, the first player will take immediately; the game never
  reaches the second move.


  Ask: is this valid? If not, which step fails?


  The subtlety: Step (2) assumes the player at node n-1 knows (1), i.e., knows the
  other player would take at node n. This rests on common knowledge of rationality.
  If the player at n-1 is rational, given that she is at n-1, she can infer... Actually
  there''s a deeper issue: if P1 at the first node passes, P2 observes a deviation
  from the backward-induction path; at that point P2''s belief that P1 is rational
  breaks, so why should P2 still believe P1 will play rationally at subsequent nodes?
  The backward-induction argument uses the assumption of rationality at future nodes
  even after observing behavior inconsistent with it. So the failing step is (3)/(2):
  the argument treats "the other player is rational" as a maintained hypothesis even
  at information sets reached only by irrational play — a misuse of common knowledge
  of rationality.


