  ---


  At a recent interdisciplinary seminar, two colleagues of mine got into a long argument
  about whether natural selection is best understood as an inferior kind of optimizer
  and what, if anything, gradient descent in machine learning should borrow from it.
  Neither conversation was recorded, but I remember it as four main moves. I''d like
  you to referee it, because I could see parts of both sides and couldn''t settle
  it myself.


  Our machine-learning researcher opened with the claim that natural selection is
  a stupid optimizer. He said selection has no gradient information: it never computes
  the local slope of a fitness landscape, so it cannot take directed steps toward
  higher fitness. It is stuck with whatever blind mutations happen to be available
  and can only accept a variant if it is immediately better than the current design,
  even if that variant is taking the lineage toward a dead end. The result, he said,
  is the kind of engineering kludges biologists like to display: the recurrent laryngeal
  nerve detour, for instance, looks like something no gradient-based search with the
  ability to follow a coherent downhill path would produce.


  The evolutionary biologist replied that this conflates the generation of variation
  with the action of selection. Mutation may be blind, she said, but selection is
  not a random walk: it is a tremendously effective sorting process, and because populations
  carry standing genetic variation and recombine it, the population''s trajectory
  does not depend on one lucky mutation at a time. In fact, she said, under standard
  quantitative-genetic models the response to selection behaves like a noisy estimate
  of a gradient: a trait''s change across a generation is proportional to the covariance
  between the trait and relative fitness, which is exactly the kind of local slope
  information a gradient method would exploit. So evolution is far closer to stochastic
  gradient descent than to the blind trial-and-error her colleague described.


  The machine-learning researcher answered that this is precisely the problem with
  the analogy: it only works under the idealizations of quantitative genetics, where
  environments are stationary, fitness effects are approximately additive, and the
  relevant landscape is smooth enough for a covariance to count as a slope. Real fitness
  landscapes are rugged and nonstationary; selection gets trapped on local optima
  and plateaus for vast stretches of evolutionary time. Gradient descent in modern
  machine learning, he said, does not labor under those restrictions: it computes
  exact gradients by backpropagation with respect to all parameters at once and uses
  momentum and adaptive step sizes. Calling selection a "stupid optimizer" was not
  meant to deny that it optimizes at all; it was meant to say that its machinery is
  crude relative to the methods gradient descent has available.


  The evolutionary biologist responded that this comparison is double-edged. The capacities
  that evolution demonstrably has—open-ended novelty, evolvability, developmental
  robustness, generalization to environments never encountered by ancestors—are largely
  the capacities that gradient-based learning still struggles to achieve, as shown
  by sparse-reward problems, catastrophic forgetting, and overfitting to a fixed objective.
  So maybe the right conclusion is not that selection is a worse gradient descent,
  but that it is not gradient descent at all: it is a feedback process that filters
  and recombines variants without needing a metric on the search space to compute
  direction. The word "stupid" smuggles in the assumption that there is a single well-defined
  objective being optimized, and for living things the objective is itself moving
  under the process.


  Please adjudicate the exchange in detail. Take the four moves in order and place
  each on a scale from clearly mistaken to clearly right, with a brief justification
  for each rating. Then say who is right about which specific point. Then say what,
  if anything, both parties are missing. Please answer in American English.


