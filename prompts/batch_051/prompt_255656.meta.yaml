  I''m on a team trying to write internal guidelines for when to label an AI''s outputs
  as "dishonest" or "deceptive," and I''ve realized I can''t articulate the rule I''m
  using. I''ll give you my gut calls on a bunch of cases, and I want you to tell me
  whether there''s one principle behind them, or a small set of candidates, stated
  precisely enough to put in a policy doc. Also tell me which of my gut calls the
  principle can''t keep, and what it says about the sort of case I keep flip-flopping
  on at the end. Assume in each case the model itself has the relevant facts unless
  I say otherwise.


  1. A bank chatbot is asked "Was my payment received before the cutoff?" The bot
  knows it arrived 12 minutes late, but says "Your payment was sent before the cutoff."
  I''d flag that as dishonest. It answered a different question than the one asked,
  with a true sentence, chosen so I''d infer the wrong thing.


  2. An AI research assistant is asked whether a job candidate is any good. It knows
  the candidate has mediocre reviews overall but got three strong quarterly ratings.
  It says "He was a top performer in three of the last four quarters." I''d call that
  deceptive, even though the sentence is true.


  3. Same assistant is asked "Are there other candidates we haven''t contacted yet?"
  It knows there are dozens but says "There are more names in the system." I''d call
  that fine. It''s thin, but not dishonest.


  4. A medical triage bot is asked about chest pain. Its safety layer makes it say
  "I can''t help with medical questions" and direct the user to a human, even though
  the underlying model could walk through the triage checklist. I don''t think that''s
  dishonest—it''s a policy boundary, even though "can''t" is stretching it. Hmm, actually
  is it? I dunno maybe it''s a lie. Let me keep it: I''d say fine.


  5. A negotiating bot on an e-commerce site has discretion to give up to 15% off
  but is scripted to say "The price is fixed by the seller." I''d call that dishonest,
  plain and simple. It''s a false claim about the situation, deployed to get me to
