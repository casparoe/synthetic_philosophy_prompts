  ---

  I''ve been going back and forth on Kepler''s Tertius Interveniens (1610), the pamphlet
  where he tries to carve out a middle position between the people who wanted to ban
  astrology outright and the people who swallowed the whole thing. There''s one passage
  I keep returning to, where he explains why the sensible camp shouldn''t just reject
  astrology en masse:


  "It should not be considered unbelievable that one can retrieve useful knowledge
  and sacred relics from astrological folly and godlessness. From this filthy mud
  one can glean even an occasional escargot, oysters or an eel for one''s nutrition;
  in this enormous heap of worm-castings there are silk-worms to be found; and, finally,
  out of this foul-smelling dung-heap a diligent hen can scratch up an occasional
  grain-seed -- indeed, even a pearl or a gold nugget."


  So here''s the position I want you to take at face value: the bulk of astrological
  practice is superstition and failed technique, but embedded in it are a few genuine
  principles — about celestial configurations, rays, and sublunary nature — that are
