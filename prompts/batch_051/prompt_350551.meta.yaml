  Exam question:

  "In a well-known experimental paradigm, a corvid is given a choice among tools and
  must use a short stick to retrieve a longer stick from a box, then use the longer
  stick to pull food toward it. The bird succeeds on its first exposure to this setup,
  and the component actions are all familiar to it from earlier tasks: picking up
  sticks, poking at boxes, pulling food with sticks. Some authors take success here
  as evidence of means-end reasoning or planning. State what Morgan''s canon requires
  in a case like this, and assess whether the first-trial success supports an attribution
  of means-end reasoning, or whether an explanation in terms of associative learning
  or other ''lower'' capacities is better supported. Be explicit about what would
  count as discriminating evidence."


  Student answer:

  "Morgan''s canon says we must never attribute a higher psychical faculty to an animal
  when a lower one could account for the behavior. Because each component here — picking
  up a stick, using a stick to retrieve objects, pulling food with a long stick —
  is already in the bird''s repertoire from previous training, the whole sequence
  can be explained by associative chaining: each action was previously reinforced
  in the presence of a similar stimulus. Therefore the canon requires us to reject
  the planning interpretation. The fact that the bird succeeded on the first exposure
  is not decisive, because first-trial performance can result from generalization
  from previously learned components. To count as planning, the animal would have
  to be able to describe its goal verbally or otherwise demonstrate that it represents
  the food as a goal while selecting the tools; until then parsimony favors a noncognitive
  account. Since Morgan''s canon is a parsimony principle, and the associative account
  has fewer unobservable mental entities, we should adopt it."


  Now the subtle mistakes:

  1. "never attribute ... when a lower one could account" — overstates the canon as
  absolute prohibition; canon is a comparative evidential rule (do not interpret as
  higher if it can be interpreted as lower), and "could" is too weak: the mere possibility
  of a lower story, with no supporting evidence, doesn''t compel. The student treats
  possibility as sufficient.

  2. "because each component is already in repertoire, the whole sequence can be explained
  by associative chaining" — assumes that the components were each separately reinforced
  in contexts that license the novel sequencing; doesn''t explain why first-trial
  sequencing to retrieve the long stick, not just any stick, was selected. The fact
  that components are familiar cuts both ways: it''s a precondition for both associative
  chaining and novel recombinatory planning; it doesn''t discriminate.

  3. "To count as planning, the animal would have to be able to describe its goal
  verbally" — conflates propositional/linguistic representation with means-end reasoning;
  imposes an over-demanding and anthropocentric criterion; many cognitive scientists
  attribute planning without language.

  4. "parsimony favors a noncognitive account because it has fewer unobservable mental
  entities" — misapplies parsimony: canonical parsimony (Occam) concerns entities,
  but explanatory parsimony in comparative psychology concerns lower-vs-higher faculties
  with equal explanatory adequacy; and whether associative chaining is actually simpler
  here is what''s at issue; mental representations are not extra entities to be eliminated
  by fiat. Or that attributing planning with novel means-end sequencing is explanatory;
  the associative account must posit a chain of prior reinforcement and generalizing,
  which is itself an unobserved history, not fewer entities.


