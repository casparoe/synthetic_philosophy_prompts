  stop hitting your sister.'' Most people find all this sweet, and would deny that
  it damages the child''s trust. The second parent''s child''s cat dies, and the parent
  says the cat has ''gone to live on a farm.'' A lot of the same people wince at that
  one, and parenting books say it will eventually erode the child''s trust when they
  find out.


  Both are deliberate falsehoods told by the person the child relies on most, both
  let the child inhabit a false picture of the world, and in both cases the child
  will eventually learn the truth. If anything, the Santa story looks worse on paper:
  it''s sustained over years and used as a tool of control, while the farm lie is
  a single lump of misplaced kindness. So what, if anything, justifies the ordinary
