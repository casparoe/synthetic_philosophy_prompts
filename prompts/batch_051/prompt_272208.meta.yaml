  I''m a PhD student in developmental psychology, writing a chapter on children''s
  epistemic trust, and there''s an asymmetry in ordinary parenting judgements that
  keeps bugging me. I can''t decide wether it''s defensible or just sentimentality.


  Take two parents. The first spends weeks building up Santa and the tooth fairy —
  eating the mince pie, staging sooty footprints, slipping a pound under the pillow,
