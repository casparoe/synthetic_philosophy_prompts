  works.

  3. The choice of universal turing machine shouldn''t bother us, because by the invariance
  theorem any two machines assign a hypothesis a complexity that differs only by an
  additive constant, so the prior is at most a constant factor apart; asymptotically
  the choice washes out.

  4. But for any finite amount of data, the choice of machine can be rigged. If I
  want a particular hypothesis to have huge prior, I can build a machine that encodes
  that hypothesis in a short bit of code. So in practice, the supposedly objective
  simplicity ranking seems arbitrary.

  5. I''m not moved by the fact that Solomonoff induction is incomputable; plenty
  of normative ideals (perfect bayes) are uncomputable, and that doesn''t mean Occam
  is unjustified or that we throw out the theory.

