  (i) Occam''s razor — simpler hypotheses are preferable — is a sound principle, and
  we should be willing to treat simplicity as a guide to what''s likely true (not
  merely a pragmatic convenience).

  (ii) Solomonoff''s theory gives the right formal story about why this is so: it
  defines a prior P(h) = sum over programs p that compute h of 2^{-|p|} (or something
  like), so hypotheses with shorter programs get exponentially more prior mass; Bayes
  then makes us prefer simple hypotheses.

  (iii) But the choice of universal Turing machine affects the Kolmogorov complexity
  K(x) only up to an additive constant, and for any pair of machines the Solomonoff
  priors dominate each other up to a multiplicative constant — so in the limit, the
  choice of reference machine washes out / doesn''t matter.

  (iv) Nevertheless, for any finite data set and any two hypotheses, I can pick a
  reference machine (by a standard "prefix trick" / by hard-coding the hypothesis
  into the machine) that gives whichever hypothesis I want the higher prior, so in
  practice the choice of UTM seems to matter enormously and is arbitrary.

  (v) Kolmogorov complexity is uncomputable, and Solomonoff induction is incomputable,
  so no finite agent can actually use it; but I don''t think that refutes its normative
  force — just like no one can compute the full Bayesian posterior over all hypotheses
  either.

  (vi) I''m also sympathetic to the idea that simplicity is the same thing as compression
  in the sense of minimum description length (MDL): Pick the hypothesis that gives
  the shortest two-part code for the data (hypothesis + data given hypothesis). And
  I think MDL and Solomonoff/Bayes are basically the same underlying idea.


