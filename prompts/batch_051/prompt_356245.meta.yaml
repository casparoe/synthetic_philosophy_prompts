  Peircean ideas in lay terms:

  - A belief is something you''re satisfied with, a habit of action. Doubt is an irritation
  that makes you inquire. You don''t start inquiring from paper doubt; you need a
  real, live doubt.

  - Methods of fixing belief: tenacity (dig in and ignore contrary evidence), authority
  (let an institution decide), a priori (what seems reasonable to think, fits with
  your taste), science (method that lets reality push back on anyone regardless of
  what they prefer).

  - The pragmatic maxim: the meaning of a conception is the sum of its practical consequences;
  if two ideas make no possible difference in practice, the debate is empty.

  - Fallibilism: don''t block the road of inquiry; never claim absolute certainty.


