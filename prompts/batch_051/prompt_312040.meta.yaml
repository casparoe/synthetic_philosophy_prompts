  Standard Grice facts:

  - Speaker meaning vs. sentence/expression meaning. Grice distinguishes what is said
  from what is implicated.

  - Conversational implicature is derived from the Cooperative Principle and its maxims
  (Quantity, Quality, Relation, Manner). "Make your contribution such as is required,
  at the stage at which it occurs, by the accepted purpose or direction of the talk
  exchange."

  - Implicatures can be conventional (e.g., "but", "therefore") vs conversational.
  The summary might claim all "extra meanings" are worked out the same way — a conflation.

  - Distinction between what is said and conversationally implicated. The letter example:
  the writer says only that the candidate has good handwriting and is punctual; "what
  is said" are those claims; the implicature is that the candidate is not good at
  philosophy. (Actually in Grice''s letter example he says the writer "has succeeded
  in conveying" the message; he uses it for dictiveness? I won''t quote.)

  - Characteristics: cancellability, non-detachability, calculability — Grice proposed
  these as tests/properties of conversational implicature.

  - Flouting vs exploiting maxims: implicature arises when speaker blatantly fails
  to satisfy a maxim and the audience assumes cooperation. But implicatures also arise
  without flouting, e.g., by observing the maxims.


