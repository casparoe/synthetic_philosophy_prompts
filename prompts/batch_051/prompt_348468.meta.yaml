  Let''s draft prompt:


  Start directly:


  I''m putting together a one-page research proposal for a term paper in moral psychology,
  and I want it built around a specific passage from Kant''s Groundwork for the Metaphysics
  of Morals (Abbott translation). The question I have in mind concerns moral worth
  and what it takes to act for the right reason. Here is the passage:


  "Everyone must admit that if a law is to have moral force, i.e., to be the basis
  of an obligation, it must carry with it absolute necessity; that, for example, the
  precept, ''Thou shalt not lie,'' is not valid for men alone, as if other rational
  beings had no need to observe it; and so with all the other moral laws properly
  so called; that, therefore, the basis of obligation must not be sought in the nature
  of man, or in the circumstances in the world in which he is placed, but a priori
  simply in the conception of pure reason."


  I want the proposal to start from this tension: if the ground of obligation is a
  priori in pure reason, then moral worth seems to require that the agent’s motivating
  reason be this same pure rational ground—not an inclination, not a habit, not a
  contingent desire that happens to track duty. But acting for the right reason, as
  understood in contemporary moral psychology, often includes cases where someone
  helps another because they see the need in front of them, without any explicit thought
  of universal law. My half-formed suspicion is that the a priori point is not about
  the content of the agent’s motivating state but about the structure that makes a
  reason authoritative, and that a person can act for the right reason when her motive
  is answerable to that structure even if she does not represent it discursively.


  Write the one-page proposal. State the precise question so it has a determinate
  answer, explain why the existing positions (broadly: intellectualist readings of
  Kantian moral worth vs. motive-based approaches that allow non-representational
  sensitivity to right-making features) leave the question open, and lay out the approach
  you would take. The proposal should be realistic for a one-semester term paper,
  and it should say what would count as the project failing. No bibliography or citations
  needed.


  After the proposal itself, include a brief structured summary as a JSON object with
  the following fields:

  - "question": one sentence stating the research question.

  - "puzzle": two or three sentences on why it is not settled.

  - "hypothesis": the half-formed idea stated as a falsifiable thesis.

