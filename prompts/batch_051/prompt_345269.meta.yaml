  Draft:


  "Origin essentialism, as standardly defended, rests on a simple thought. Consider
  the particular sperm and egg from which you in fact developed. If a different sperm
  from your father had fertilized that same egg, the resulting embryo would have had
  a different complement of paternal chromosomes, and so would have developed into
  a different person — one of your possible siblings — not into you. Likewise for
  a different egg from your mother. On this view, your biological origin in those
  two particular gametes is essential to you: in no possible world could you have
  developed from a different sperm or egg.


  But the standard statement of the view slides between two very different thoughts:
  that the alternative gametes would have carried different DNA, and that they are
  numerically distinct cells. Consider a pair of cases designed to pull those apart.
  In Case 1, the ''alternative'' sperm is a numerically distinct cell from the actual
  sperm, but by stipulation it carries exactly the same DNA sequence... In Case 2,
  the ''alternative'' egg is numerically distinct, contributes the same nuclear DNA
  as the actual egg, and differs only in its mitochondrial DNA (which the embryo inherits
  only from the egg)... The resulting child would be genetically almost indistinguishable
  from you — same nuclear genome in both cases; in Case 2, a slightly different mitochondrial
  genome. Now work through the analysis. Does the standard essentialist argument for
  your origins still classify these as cases in which you would not have existed?
  If so, on what principle, and is that principle still supported by the sibling intuition
  that did the original work? If not — if the essentialist concedes that, in these
  cases, you could have come from a different gamete — then exactly where does origin
  essentialism draw the line, and can it draw that line without reducing the original
  doctrine to an arbitrary fixation on cell identity?"


