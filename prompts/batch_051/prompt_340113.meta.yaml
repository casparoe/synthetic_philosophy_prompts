  ---


  A colleague''s argument last week forced me to notice a rule I have been running
  for years, and I want to know whether the rule is defensible. The rule: when someone
  claims that a present-day democracy is "in its late Republic" or that some current
  development is "how the Roman Republic fell," I discount the argument almost to
  zero. Last week the claim was that an executive''s growing reliance on emergency
  powers is the modern version of the senatus consultum ultimum, the Senate''s decree
  that the state was in danger and that magistrates should see to it that no harm
  came to the Republic, and that this is how the slow slide into constitutional death
  begins. I did not check his history; I mostly regarded the analogy as evidence of
  his politics rather than of the facts.


  My reasons for the standing rule are these. First, I can rarely verify the historical
  claims, and the people making the analogy are rarely in a better position than I
  am. Second, the past is large enough to supply a decline-story for almost any conclusion,
  so the analogy often does no independent evidential work. Third, when I have checked
  such analogies, they seemed to rest on institutional details that do not transfer
  to any modern democracy: a senate that was not a representative legislature, armies
  paid and personally loyal to their commanders, a popular assembly without the structure
  of a modern electorate, and a tribunate that could veto the ordinary machinery of
  government. If the mechanism does not transfer, the analogy should not carry the
  conclusion with it. Fourth, the people making these analogies rarely state base
  rates: most regimes sharing a few features of the late Republic did not have its
  trajectory, and many modern democracies have survived comparable stresses without
  collapsing.


  A friend tells me this is not a rule but a bias about a genre of argument. A good
  analogy should move my credence at least a little, he says, and a strong structural
  analogy should move it a lot; that a tool is often misused is not evidence about
  the next use. He adds that the defensible response to not being able to check the
  history is a modest discount for unverified specifics, not a near-zeroing of the
