  ---


  I have a standing policy about a certain kind of political argument, and a recent
  argument at work has made me wonder whether the policy is more than a bias. The
  policy: when someone argues that a present-day democracy is "in its late Republic"
  or that some current move is "how the Roman Republic fell," I discount the argument
  almost to zero. I applied it again last week, when a colleague argued that the executive''s
  growing reliance on emergency powers is the modern version of the senatus consultum
  ultimum and that this is how constitutional death begins. I didn''t engage with
  his historical claims in detail, because I couldn''t check them, and I mostly dismissed
  the whole analogy.


  My reasons for the policy are these. First, I can rarely verify the historical part,
  and the people making the analogy are rarely in a better position than I am. Second,
  the past is a big enough menu to supply a decline story that fits any desired conclusion,
  so the analogy often does no independent work. Third, the Roman cases I have looked
  at closely seem to turn on institutional details that do not transfer to modern
  democracies: a senate that was not a legislature with a popular mandate, armies
  paid and sworn to their commanders, a tribunate that could veto the whole machinery
  of government, and a narrow citizenship base. If the mechanisms don''t transfer,
  the analogy doesn''t either. Fourth, the people making such analogies almost never
  state base rates: most regimes sharing a few features with the late Republic did
  not have the late Republic''s trajectory, and many contemporary democracies share
  crisis features without collapsing.


  A friend objects that this is a genetic-style fallacy about a genre of argument:
  the fact that a tool is often misused is not itself evidence about the next use.
  A good analogy should move my credence at least a little, and a strong structural
  analogy should move it a lot; if I can''t check the history, the defensible response
  may be a modest discount for unverified claims, not a near-zeroing of the conclusion.
  He also says my inability to check the history is my problem, not a feature of the
  argument, and that learning to distinguish good analogies from bad ones is available
  to non-historians at least in part.


  Is my policy defensible as a policy? I''d like to know: whether I should think of
  the discount as a fixed rate, and if so whether there is a principled value for
  it; what a restated version of my rule would be that keeps the benefits without
  simply throwing away a class of evidence; and whether I am entitled to the policy
  given my position. As you answer, please separate what is settled among people who
  work on the late Republic or on reasoning by historical analogy from what is genuinely
  contested, and don''t present a contested reading of the Roman crisis, or of how
  to treat analogies, as the consensus view.


