  I''m not sure what grounds the criticism; if the lover bestows value, the beloved
  is valuable to them, and what''s left to object to? Whereas appraisal at least lets
  me say the appraisal was wrong.


  So my question: what principle, or small set of principles, best captures these
  verdicts? Which of my verdicts does it force me to drop or reinterpret, and which
