  I''ve been going in circles on whether love admits of reasons the way belief or
  admiration does, and I''m hoping someone can extract the principle from my gut verdicts
  on cases. The taxonomy I''ve internalized from the usual debates is: appraisal views
  say love is justified when it correctly responds to something valuable in the beloved
  — their qualities, or their personhood itself (Velleman-ish); bestowal views say
  love isn''t a response to antecedent value at all, it''s a volitional stance that
  makes the beloved valuable to you (Frankfurt-ish); relationship views say love is
  justified by the relationship or shared history rather than by the person''s properties
  (Kolodny-ish). None of these fits all my verdicts, so I want to know whether there''s
  a principle that does.


  Here are the cases. (1) I love my sister, and if you asked why I''d cite her being
  funny, loyal, understanding. But if she lost all those qualities tomorrow, I''d
  grieve, but I''m confident the love would survive and I wouldn''t call that irrational.
  The reasons I''d cite don''t seem load-bearing. (2) But I had a friend I loved for
  a decade; then I discovered he''d been quietly sabotaging a project I cared about
  and lying to me throughout. I didn''t decide to stop loving him — the love just
  collapsed once I saw him accurately. That also felt right, as if the love was answerable
  to who he actually was. (3) Swapping intuition: if I love my partner for her wit,
  warmth and patience, and I meet someone wittier, warmer and more patient, it would
  be insane — a category mistake, not merely disloyal — to think I now have more reason
  to love the second person or any reason to transfer the love. So love can''t just
  be a response to value properties the way admiration is. (4) Two people in an arranged-ish
  relation who would never have chosen each other, who grate in small ways, stay together
  twenty years, raise kids, nurse each other through illness, and genuinely love each
  other at the end. I''d say that love is fully justified — which again looks like
  the relationship itself doing the work. (5) A friend of mine loves someone almost
  everyone else finds unlovable: selfish, boring, flaky. I''ve watched the love make
  the person better, and I''ve also noticed that to my friend this person really is
  valuable in a way I can''t see from outside. I can''t bring myself to say my friend
  is making a mistake, but I can''t point to any property of the beloved that justifies
  it. That feels like the love is doing the valuing rather than responding to value.
  (6) My own child versus an equally charming, equally needy child I''ve never met:
  of course I have more reason to care about my own kid, and that reason seems entirely
  relational, not about the child''s properties. (7) The fanatical case: someone loves
