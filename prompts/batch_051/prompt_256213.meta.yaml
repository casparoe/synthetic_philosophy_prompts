  Let me write the summary of Hume''s argument. Competent popularizer''s version:


  "My philosophy podcast summarized Hume''s argument against miracles like this: ''Hume
  showed that believing a miracle report is never rational. A miracle is by definition
  a violation of a law of nature, and a law of nature is just a regularity that all
  our experience supports. So the evidence for the law is always going to be stronger
  than the evidence for the miracle, because the miracle''s only support is the testimony
  of a few people while the law has uniform experience behind it. Therefore any miracle
  report can be dismissed without even looking at the details.''"


  This is mostly right but subtly overstates: "never rational" vs. Hume''s careful
  "full proof" and his allowance for testimony whose falsehood would be more miraculous;
  "can be dismissed without looking at details" contradicts Part II where he actually
  examines testimony; "a law of nature is just a regularity that all our experience
  supports" — roughly right; "by definition a violation..." — Hume does say "a transgression
  of a law of nature by a particular volition of the Deity, or by the interposition
  of some invisible agent" and "a miracle is a violation of the laws of nature." So
  accurate. The subtle errors: (1) the categorical "never rational / dismiss without
  looking" overstates — Hume''s conclusion is that testimony supporting a miracle
  must be weighed, and in principle could count as a proof if the testimony''s falsehood
  would be more miraculous; (2) confusing "uniform experience is a full proof against
  the event" with "no candidate could ever rationally believe it — Hume allows that
  conformity of testimony could in principle produce belief rising to proof, even
  though it would be ''a miraculous'' testimony; and Part II engages with the details
  of testimony (four considerations against actual miracle reports) rather than dismissing
  them a priori. Actually, Hume''s Part I does end with a kind of a priori-sounding
  maxim, but then Part II says even setting aside that general argument, the testimony
  is bad. So the "without looking at details" bit misrepresents.


  Also maybe subtle error: "the law has uniform experience behind it" — Hume''s actual
  argument uses the notion of a "full proof" from uniform experience, and testimony
  of miracles never amounts to a full proof because of the countervailing proof. The
  popularizer''s phrasing "the evidence for the law is always going to be stronger"
  conflates "our evidence for the general regularity" with "evidence for the particular
  non-occurrence of this event." That''s a nice subtle point: induction gives evidence
  for laws, but the question is about a particular event; the entailment from "laws
  are uniform" to "this event didn''t happen" is not trivial because miracles are
  defined as exceptions. Hmm, but maybe too fine. Actually the really interesting
  subtle issue: Hume does not claim the evidence for the law is stronger; he claims
  that testimony for miracles has never amounted to a full proof, and that in fact
  uniform experience of the violation being absent is a proof as strong as any proof
  from experience. But the common misrepresentation is that Hume rules miracles out
  by definition (a priori), making it analytic that they can''t be believed. Actually,
  Hume himself invites that reading but modern commentators (e.g., Earman) argue his
  argument is either trivial (if "law of nature" means "exceptionless regularity,"
  then miracles are impossible by definition and no testimony can establish them)
  or question-begging. This is in the weeds. Good.


