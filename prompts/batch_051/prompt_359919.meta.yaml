  I am a novelist, and I need to settle a question before I finish my current book.
  It has two sisters: one resents a wealthy family that inherited the house her late
  mother cleaned for forty years; the other envies a friend whose novel won a prize
  that, by any serious judgment, should have gone to the first sister''s work. In
  draft after draft I have found that the resenting sister reads as stately and right,
  while the envying sister reads as small, even though the object of each emotion
  is the same kind of thing — another person''s undeserved advantage. I want to know
  whether that asymmetry in judgment, mine and my readers'', is intellectually defensible.


  Put the asymmetry generally: ordinary moral judgment treats resentment at an advantage
  produced by injustice as a warranted moral response, something like witnessing,
  while it treats envy of another person''s good as a private vice to be confessed
  rather than acted upon. Yet both are painful awareness of someone else''s having
  more. Is there a principle that generates both verdicts, or only a difference in
  social styling?


  Before you answer, take a pressure case seriously. One tradition of thought — I
  associate it with Rawls, though the idea matters more than the attribution — holds
  that even envy can be excusable when inequalities are severe enough to demolish
  a person''s self-respect: the envy is then not a sin but a symptom of an arrangement
  that makes it impossible for the envious to see themselves as equals. If that is
  right, the line between respectable resentment and contemptible envy may track not
  the moral character of the emotion but the background structure of the society in
  which it is felt.


  Give me the strongest candidate justification for the asymmetry, then test it against
  hard cases: the envious sister, the resentful sister, an office worker who envies
  a colleague''s unearned promotion, a taxpayer who resents a fraudulent beneficiary,
  a person whose self-respect has been destroyed by a lifetime of unequal chances
  and whose envy has no clear target, and a person who envies a friend''s equal and
  deserved success. Then say whether the asymmetry should be kept, reversed, or given
  up — and, finally, what a novelist is entitled to feel toward each of these characters.


