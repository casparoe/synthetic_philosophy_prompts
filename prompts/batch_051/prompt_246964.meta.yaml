  Draft:


  After a career in experimental science, I have been reading the alignment literature
  and keep returning to a conceptual question about how much of its classic reasoning
  transfers to the systems now actually being built. I would like you to evaluate
  whether the argument usually called Goodhart''s law survives a specific shift in
  assumptions.


  The classical argument, as I understand it, runs like this. We cannot optimize the
  outcome we actually care about, so we optimize a proxy that is assumed to correlate
  with it. Once the proxy is made the target, however, its status as a proxy is no
  longer held fixed; optimization exploits every gap between proxy and value, driving
  the system into exactly those regions where the proxy reads well but the underlying
  outcome does not. The argument implicitly assumes a fixed, externally specified
  proxy and an optimizer free to move however maximizes that proxy.


  The shift I have in mind is the one introduced by aligning current language models
  through learning from human preferences. Here the proxy is a reward model: a neural
  network trained to predict human comparative judgments, frequently retrained on
  outputs produced by the policy it scores. The optimizer is not an unbounded expected-utility
  maximizer but a policy that is pulled a limited distance from a pretrained distribution,
  with an explicit KL penalty anchoring it to that base model. And the underlying
  value is not a single measurable quantity but a diffuse notion of helpfulness and
  harmlessness that is itself partially constituted by the raters'' judgments, which
  may change as they see different model outputs.


  My question is whether the Goodhart argument survives these changes. Does it still
  bite, but now against the reward model rather than the policy? Does the KL penalty
  restore a premise of the classical argument, or merely slow the decoupling without
  removing it? Or does the argument lose its footing because its premise of a fixed
  external criterion no longer holds, and if so, does something like Goodhart''s law
  re-emerge in another form (for example, as a statement about trained proxies drifting
  under iterative optimization)? I am interested in the fate of the argument itself,
  not in a policy recommendation.


