  I keep constructing the following argument about whether cultural change is literally
  Darwinian, and I cannot accept its conclusion, yet I cannot find the step that fails.
  I would like your diagnosis.


  (1) Natural selection requires only a population of copying entities that vary in
  ways that are passed on to further copies, and in which some variants copy themselves
  more successfully than others.


  (2) Cultural variants—jokes, melodies, recipes, rituals, architectural forms—clearly
  satisfy these conditions: they vary, they are passed on with modification, and some
  variants persist and spread while others die out because of the very features that
  get copied.


  (3) Therefore, cultural change is natural selection in the strict, non-metaphorical
  sense, and "meme" is no more a metaphor than "gene" is.


  (4) If (1) is all it takes for natural selection, then selection is not tied to
  DNA, cells, or even life. The same conditions hold for any copying process with
  occasional error and differential success—for example, a self-copying computer program
  whose copying errors make some copies reproduce faster, or a chain letter that accumulates
  modifications as it circulates.


  (5) But that is why the conclusion seems to prove too much. It forces us to say
  that a self-copying computer program or a mutating chain letter is undergoing natural
  selection in exactly the same sense as a population of finches, which drains "natural
  selection" of its explanatory content about cumulative adaptation and makes the
  word merely a label for differential copying.


  (6) So at least one of (1)–(4) must be rejected, even though each seems plausible
  singly. Which step do you reject, and what does rejecting it imply for the view
  that memes are more than a metaphor? If your view is instead that the conclusion
  should simply be accepted, say what remains of the distinction between natural selection
  and mere differential copying.


