  Type 2 Harsanyi:


  "I''ve been trying to reconstruct an argument from social choice theory with a few
  friends, and we''ve ended up with something that looks disturbingly strong—so strong
  I suspect one of the premises is doing more work than it seems. Here is the argument.
  (1) Each person''s preferences satisfy the axioms of expected utility theory, so
  each person can be represented by a von Neumann–Morgenstern utility function defined
  over lotteries on social outcomes. (2) Society as a whole—or an impartial observer
  deciding for society—also has preferences over those same lotteries that satisfy
  the same axioms. (3) The social preferences respect a Pareto condition: if every
  individual is indifferent between two lotteries, then society is indifferent between
  them (or at least: if every individual weakly prefers one lottery to another, society
  does too). (4) Therefore the social utility function must be an affine (positive
  linear) combination of the individual utility functions—i.e., utilitarian (or weighted
  utilitarian). This looks like it derives interpersonal comparisons and utilitarian
  summing from nothing but individual rationality plus Pareto. Yet plenty of people
  reject utilitarianism without rejecting expected utility theory or Pareto. Tell
  me which premise or inference to reject, explain why that step looked innocent,
  and price the alternatives: what does each way out—denying that social preferences
  must satisfy the expected utility axioms, strengthening or weakening the Pareto
  condition, distinguishing ex ante from ex post evaluation, or rejecting the ''impartial
  observer'' interpretation—actually cost? Please write in American English, and end
  with \answer{...} containing the step you take to be the weakest link."


