  individual utilities. The theorem requires the social alternatives are lotteries
  and social preference satisfies axioms. The key subtlety: the theorem assumes interpersonal
  comparability of utility is not needed for weights? Actually the theorem says a
  social welfare function that satisfies the axioms and Pareto must be a weighted
  sum, with weights representing... The challege: the "proof" still requires utilities
  be cardinal but not necessarily interpersonally comparable; Harsanyi argues it derives
  utilitarian sum. Critics (Sen, Weymark) object: the theorem does not establish utilitarianism
  because the choice of individual utility representations is arbitrary up to affine
  transformations; the weights depend on the scaling of individual utilities, and
  the theorem is "meaningless" unless interpersonal comparisons are introduced. Alternatively,
