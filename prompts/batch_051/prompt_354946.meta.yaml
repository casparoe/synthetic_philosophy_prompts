  Domain: Information cascades and rational herding. Type: Write a short research
  proposal. Asker: a longtime rationalist blog/forum reader. They want a one-page
  proposal for maybe a workshop or small grant. Half-formed idea: The standard informational
  cascade models assume decision-makers observe the entire ordered history of predecessors''
  actions (or at least a commonly known sequence). But in many real-world cases, especially
  online, people only see aggregate counts/ratings, or they see a sample that is itself
  selected by platform algorithms. There has been some work on observational vs. informational
  cascades, but maybe the question of how uncertainty about the order/sample size
  affects rational herding is not fully settled. We can ask for proposal that frames
  a precise question: e.g., "Under what conditions do cascades persist when agents
  have only anonymous aggregate information and must infer both the state and the
  informativeness of the observed aggregate?" Why existing positions leave open: classic
  BHW model and later variants assume observable sequence; rational herding literatures
  often use known sample size; actual social platforms present aggregates without
  sample identity, and that may break the "small-sample bias" assumptions. Approach:
  build a simple Bayesian model where agents see only aggregate counts of previous
  actions after some unknown number of predecessors, maybe compare with sequential
  case; derive conditions for correct vs. wrong cascade; if intractable, simulate.
  This is philosophical/conceptual? It''s more formal social science/decision theory,
  but okay for prompts? It''s conceptual enough. Could incorporate philosophical angle:
  "does the distinction between cascading on the state vs. cascading on the sample
  size undermine the rational learning story?" Maybe.


