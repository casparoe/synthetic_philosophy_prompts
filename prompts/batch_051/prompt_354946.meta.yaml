  Prompt should be casual, may contain typo or two. Example: casual "I''ve been kicking
  around a half-formed idea for a while, and I need someone to turn it into a one-page
  proposal for a small grant (think EA-ish/ACX reader meetup project). My idea: everyone
  cites Bikhchandani et al. for informational cascades, but the baseline models assume
  agents see the exact sequence of prior choices. In online life, almost nobody sees
  that; they see an aggregate upvote count or a ''12 people bought this'' badge, without
  knowing whether 12 is a lot out of 13 or a little out of 10,000. So the rational-herding
  question changes: you''re not just inferring the state of the world from predecessors,
  you''re also inferring the size of the sample you''re conditioning on. I suspect
  there''s a neat model here where some cascades that look rational under known-sequence
  assumptions are actually fragile or even impossible under unknown-sample-size assumptions,
  and vice versa. But I''m not a modeler. Can you write the one-page proposal? I''d
  want: a precise question, why existing cascade models don''t settle it, what method
  actually makes progress (analytical? simulation? concept analysis?), what a deliverable
  looks like for someone deciding whether to design platform interfaces or interpret
  online rating data, and what failure looks like. No need for citations or a lit
  review, I''ll add those."


