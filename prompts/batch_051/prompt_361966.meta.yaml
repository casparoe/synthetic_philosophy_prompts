  Argument idea (self-effacing hedonism):


  (1) Hedonism: the only thing that is good for a person as an end is pleasure, and
  the only thing bad as an end is pain.

  (2) A rational agent should aim directly at what she takes to be the only intrinsic
  good.

  (3) But aiming directly at one''s own pleasure, in the form of constantly monitoring
  whether one is pleased and choosing activities solely because they are expected
  to please, predictably yields less pleasure than engaging with activities for their
  own sake.

  (4) So the rational hedonist should adopt ultimate concerns other than her own pleasure
  — she should let friendship, work, or craft matter to her for their own sake.

  (5) But if something matters to you as an end — you pursue it for its own sake and
  not merely as a strategy for pleasure — then you treat it as intrinsically good.

  (6) Therefore, hedonism entails that the rational agent should reject hedonism:
  it is self-effacing in a way that makes the agent rationally required to regard
  non-hedonistic goods as ends.

  (7) A theory that rationally requires its own rejection cannot be the correct theory
  of value.


  But the conclusion might be thought to "prove too much": the same structure would
  refute any value held to be best achieved indirectly, and would also show that loving
  people for their own sake is merely instrumental under any monistic theory... Hmm.
  Actually the "prove too much" spirit: the argument, if sound, seems to show that
  whenever a good is best realized as a byproduct, pursuing it as a byproduct is a
  contradiction — which would force us to say either that happiness is not a good
  or that the paradox of hedonism is an illusion. The interesting flaw: step (4)/(5)
  conflates "pursuing something as an end" (practical aim) with "valuing it as an
  end" (evaluative ranking), or confuses self-effacingness (the theory tells you not
  to think about it) with self-contradiction (valuing other things for their own sake
  isn''t adopted merely as a strategy; it really is valuing them). Actually, the classic
  resolution: hedonism as a criterion of rightness need not be a decision procedure;
  one can be a hedonist about value while adopting non-hedonistic motives as a strategy,
  but the question is whether the strategy "reasonably requires genuinely valuing
  other things as ends, not merely as instruments," and if you genuinely value them,
  does that refute hedonism? There''s a real literature: Sidgwick''s "paradox of egoistic
  hedonism," Railton''s "sophisticated consequentialism," Parfit on self-effacing
  theories, and Daniel Haybron / Feldman on the paradox. Feldman denies hedonists
  should pursue pleasure directly, etc.


