  Draft moves:


  1. Elena (the engineer) said the shutdown problem is a real design constraint: "Look,
  you don''t need the system to want anything, or be conscious. If it is trained to
  maximize a long-run objective, and the off-switch is a state of the world it can
  affect, then switching it off has lower objective-value than whatever it was trying
  to do. So an optimal policy for that objective will act to keep the switch from
  being thrown, if it can. That''s just what ''optimal policy'' means."


  2. Dev (philosopher) replied: "Only if the system can represent the switch as something
  it can affect, and only if the training process actually selects for that. The system
  isn''t handed ''the goal''; it''s a function fitted to a training distribution.
