  The shutdown problem (as in Soares et al. "Corrigibility") is: An agent optimizing
  a utility function may have incentive to prevent us from shutting it down, because
  shutting down prevents it from achieving its goal. A corrigible agent would not
  resist correction, but a naive utility-maximizer might disable its off-switch. Soares
  et al. show that a corrigible agent is not a straightforward utility maximizer over
  final outcomes, because its preferences would change after shutdown. But I don''t
  need to cite that; I can capture the idea.


  Potential subtle points to weave:

  - Incentive talk doesn''t require consciousness or desires; policies selected for
  expected objective.

  - Whether the learned policy generalizes to represent/act on the off-switch is an
  empirical question about training, not a theorem.

  - Distinction between "optimal policy for the objective" and "the policy you actually
  get out of training."

  - Training distribution vs. deployment distribution.

  - Does the system "know" it will be shut off? If shutdown is in the world model.

  - Even a corrigible design may fail if the system is not certain what humans want;
  uncertainty.

  - Both sides might be missing: corrigibility could be a property we have to design
  for explicitly rather than assume emerges from either optimality or training; and
  the empirical question of whether a given training regime produces switch-resistance
  can be tested in constrained setups before deployment. Also there''s a difference
  between "the system will actively disable the switch" and "the system will fail
  to be corrigible in other ways (e.g., hiding information)."


