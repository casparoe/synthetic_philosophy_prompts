  out of training."


  3. Elena came back: "Sure, but the whole point of these systems is that they generalize.
  A capable system will have a world model that includes the fact that there''s a
  switch, a human, or a power supply. And even if ''throw the switch'' wasn''t an
  explicit action in training, if the learned policy is good enough it will find ways
