  No-trade theorem intuition: if a trader is willing to trade at a price, that willingness
  itself conveys information. In a market where everyone is rational and has common
  priors, the fact that someone wants to sell you a stock at $X reveals that they
  think it''s worth less than $X, so you should update downward, possibly enough to
  not want to buy. Thus no trade occurs on pure differences of information. The strong
  version: rational agents with common priors will not trade solely based on information
  differences.


  A step-by-step argument could be something like:


  (1) Suppose you offer to sell me a stock at $10. (2) I should infer from your offer
  that your private information suggests the stock is worth less than $10 (otherwise,
  being rational, you wouldn''t sell at $10). (3) Symmetrically, if I agree to buy
  at $10, you should infer my information suggests it''s worth more than $10. (4)
  But we both know the other will make this inference. (5) So neither of us can interpret
  a trade at $10 as a good deal; each of us would update to the belief that the fair
  price is not $10... The argument concludes there''s a paradox: no one should ever
  trade financial assets, yet people do.


  Where does it fail? There are standard escape routes: liquidity/noise traders, hedging/risk
  preferences, different endowments, prior disagreement, etc. The argument conflates
  "trade purely from private information" with all trade. The prompt can ask: is this
  valid? Which step fails?


  But the asker should be non-academic. They might have arrived at this from a conversation
  or from seeing trades.


