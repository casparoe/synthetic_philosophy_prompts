  ---


  Our school is starting a new society called the "Reasoning Dojo," loosely modelled
  on martial-arts training. The idea is that rationality is not mostly a body of knowledge
  but a set of practiced skills, so it should be trained the way a karate club trains:
  through graded katas, supervised sparring, and belts.


  The proposed structure is as follows. Members progress through five belts. To advance
  a belt, a student must pass three kata assessments. A kata is a scripted exercise
  with a fixed format: for example, (1) given a short newspaper claim, state the strongest
  objection to it that a reasonable defender of the claim could accept; (2) given
  a belief and three new pieces of evidence, produce a calibrated probability update
  and justify the size of each update; (3) given a plan for a school event, write
  a "pre-mortem" listing at least four plausible failure modes; and (4) given a statistical
  claim, identify the base rate that is being neglected. Senior belts grade the katas
  using a checklist and award points for each item performed correctly. In addition,
  members attend weekly sparring sessions. In a spar, two students are randomly assigned
  opposite sides of a school-policy question and must defend their assigned side for
  four minutes, then switch. Spectators award points for what the rubric calls "moves,"
  such as responding to the strongest rather than weakest version of an opponent''s
  argument, conceding a point with an explanation of why the concession does not collapse
  one''s position, and stating what evidence would change one''s mind.


  Belts confer privileges: third belt and above may chair debates; fourth belt and
  above may vote on changes to the kata rubrics themselves. There is no penalty for
  being wrong about the underlying facts, and no formal test of whether a member''s
  reasoning improves outside the dojo.


  Analyse how this system would actually behave if it ran for two years. What would
  it incentivise members to practice, and what would it silently select for? Where
  would it be gamed first, both by students seeking belts and by senior belts who
  grade? Would the kata skills transfer to reasoning about real, high-stakes questions
  outside the dojo, or only to performing the katas? In your answer, distinguish failure
  modes that could be fixed by changing specific rules from failure modes that seem
  baked into the analogy between rationality and martial arts. Please write your answer
  in British English.


