  theory versions: e.g., Schaffer 1994? Actually "no free lunch" theorems in supervised
  learning: for any two learning algorithms, averaged over all possible target functions/priors,
  their off-training-set error is the same. The NFL theorem says that no algorithm
  is universally better than any other if all possible target functions are equally
  likely; good performance on some problems is paid for by bad performance on others.
  In ML, every learner has inductive bias/assumptions; generalization requires assumptions
  matching the data distribution.)


  The translation: Hume says you can''t justify moving from observed to unobserved
  without an assumption; NFL formalizes this as: with no assumption about the target
  function (a uniform prior over all functions), every learning algorithm has the
  same expected generalization error — so past performance gives no license. The "uniform
  prior over all functions" is the ML counterpart of "no assumption." But there are
  interesting residues:

  - Hume''s problem is about justification/normativity ("what reason have we?"), while
  NFL is a mathematical fact about expectation under a prior. NFL doesn''t tell you
  what prior to use or justify a particular prior; it just shows you need one. So
  it can easily become a "dissolution" that says "induction = choosing the right prior
  / inductive bias," but choosing a prior is itself a sort of induction/assumption
  that isn''t justified by the data. This part doesn''t survive: the regress of justifying
  priors.

  - Hume''s psychological claim that we are led by custom/habit, not reason, has no
  counterpart in the ML formalism (ML systems don''t have Humean habits; the engineer
  picks the bias).

  - Hume''s target: laws of nature, causal inference, "the sun will rise tomorrow"
  — the unobserved resembles observed. ML formalizes generalization for i.i.d. or
  fixed distributions, but Hume''s problem includes whether the uniformity of nature
  itself can be established; the assumption that test and train are i.i.d. is already
  a uniformity-of-nature assumption smuggled in. So the i.i.d. assumption is a residue:
  ML takes for granted that the future is drawn from the same distribution as the
  past; that''s exactly part of what Hume was questioning.

  - The notion of "simple hypotheses" or Occam''s razor as a bias: ML can encode it
  but cannot justify it; choosing a simplicity prior is just another prior.

  - The probabilistic/expectation nature: NFL averages over all possible target functions;
  a skeptic might say averaging over all possible worlds is not relevant to our actual
  world. The fact of no free lunch over all functions doesn''t imply anything about
  performance in this world. So the translation can mislead if one treats "on average
  over all functions" as equivalent to "in any given world."

