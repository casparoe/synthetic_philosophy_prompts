  Hume''s problem of induction: we can''t justify inductive inferences — that the
  future will resemble the past, or that unobserved cases resemble observed ones —
  by demonstrative reasoning (no contradiction in the contrary) nor by probable reasoning
  from experience (that would be circular). So inductive inference rests on custom/habit,
