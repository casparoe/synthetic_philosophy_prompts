  Full draft:


  In my philosophy of religion reading group, two members got into a long argument
  about petitionary prayer to an omniscient and immutable God. I transcribed the exchange
  as best I could and would like you to adjudicate it step by step.


  Elena opened with a dilemma. If God is omniscient, God already knows what we need
  before we ask. If God is immutable, God cannot change what God was going to do in
  response to the asking. So petitionary prayer seems either redundant — asking for
  what God was already going to bring about — or theologically suspect — trying to
  move God to do something God would otherwise not have done. On classical theism,
  she claimed, both horns are bad.


  Daniel said this is a false dilemma. A God who is outside time can eternally will
  the whole created order at once, including both the outcome and the prayer as one
  of its conditions. God does not change; God timelessly decrees a conditional structure,
  something like: if Elena prays for the healing, the healing occurs; if not, not.
  Prayer can therefore be genuinely efficacious without God undergoing any change,
  because the request was always part of the single eternal decree.


  Elena answered that this turns prayer into a mechanical trigger, not a request to
  which God responds. It also makes God look arbitrary. A perfectly good God should
  want the good outcome whether or not the creature happens to ask. Unless the asking
  itself has some value, conditioning the good on the asking is worse than the dilemma
  it was meant to escape.


  Daniel replied that the asking does have value. Petitionary prayer exercises dependence,
  trust, and attention to God, and it is part of how creatures come to align their
  wills with God''s. God wills not only that goods exist but that they be brought
  about through created secondary causes, and petition is one of those secondary causes.
  So the arbitrariness objection, he said, assumes a world in which outcomes are the
  only thing that matters, and ignores the value of a world in which creatures genuinely
  participate in God''s action.


  Elena said this concedes her real point. If the value of petitionary prayer lies
  in trust, formation, and alignment, then the specifically petitionary content —
  asking for some concrete outcome — is dispensable. Thanksgiving, praise, and contemplation
  would do the same formative work without representing God as someone who needs to
  be asked. Worse, on Daniel''s own account the asking does not provide God with any
  new information or reason, so the language of request is doing no work at all.


  Daniel responded that the petitionary form is itself formative. A creature learning
  dependence does not merely contemplate dependence in the abstract; she makes concrete
  requests, and refraining from asking would be a failure of trust. He added an analogy:
  a good parent wants a child to ask for things even when the parent already knows
  the need and has already decided how to respond. The asking is not about informing
  or moving the parent; it is constitutive of the relationship. In the same way, the
  fact that God eternally wills the asking as a condition does not make the asking
  fake — any more than God''s foreknowledge of a promise makes the promise empty.


  Elena said the parent analogy fails at the exact point it is meant to prove. A human
  parent can be moved by the asking: the request can supply a new reason, and the
  parent can choose to grant or withhold partly because of how and whether the child
  asks. An immutable God cannot acquire reasons or be moved. If the asking was always
  folded into God''s single decree, the prayer is not a reason God acts; it is just
  another event in a timeline God eternally willed. That is a compatibilist rescue
  of prayer, she said, but it drains out the very petitionary character it was supposed
  to save, and turns the one who prays into an instrument rather than a partner.


  Daniel closed by asking why prayer should be singled out for this objection. On
  any doctrine of divine omniscience, human actions, requests, promises, and deliberations
  are all compatible with God''s eternal foreknowledge, yet nobody concludes that
  they are all fake or pointless. If compatibilism is acceptable for those, it should
  be acceptable for prayer as well.


  Please adjudicate their exchange. For each of the moves above, say whether it is
  clearly mistaken, defensible but overstated, or clearly right, and briefly justify
  each rating. Then say who is more right overall. I am especially interested in where
  each of them overclaims, where one makes a concession that the other should have
  exploited, and what important considerations the two of them are both missing.


