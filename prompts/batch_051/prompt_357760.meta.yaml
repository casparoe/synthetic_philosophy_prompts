  length = Kolmogorov complexity. (b) relative to a universal machine, complexity
  is invariant up to a constant. (c) the prior: among all programs that produce the
  observed data, weight shorter programs more (2^-length) — Solomonoff''s universal
  prior. (d) equivalence to Occam''s razor: simpler hypotheses are more probable/probable
  generalization. (e) philosophical upshot: Occam''s razor isn''t an arbitrary taste;
  it''s entailed by a prior over computable hypotheses.


