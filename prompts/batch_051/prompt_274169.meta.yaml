  Prompt draft:


  I am a novelist, and while researching a character who works as a philosopher of
  biology, I came across a distinction I had previously only ever encountered, in
  a different vocabulary, in arguments about how to read fiction. I want to know whether
  the resemblance I see is real.


  In philosophy of biology, there are two broad ways to explain what it means for
  a biological trait to have a function. The etiological (or selected-effects) account
  says a trait has a function because of its history: roughly, the function of the
  heart is to pump blood because pumping blood is the effect for which hearts were
  favored by past selection. The causal-role account says a trait has a function because
  of what it does now within the larger system: the heart''s function is to pump blood
  because pumping blood is the contribution it makes to the circulatory capacities
  of the present organism, whatever its history.


  As a novelist, I am used to a similar-looking dispute about what a narrative element
  is for. One camp reads a device, a scene, or a repeated image in terms of what the
  author put it there to do—its genesis in the author''s intention. Another camp reads
  it in terms of what it actually does inside the finished work—the role it plays
  in the structure as it now stands, reader and authorial history aside. The first
  camp looks backward to origin to determine function; the second looks to current
  systemic contribution.


  My question is whether this is a deep structural parallel or a loose analogy. In
  particular: does being an etiological vs. causal-role theorist by temperament or
  argument commit someone to the corresponding literary position, or do features unique
  to each domain break the alignment? If the parallel were deep, what would have to
  be true about literary history, authorship, or interpretation for results to transfer
  from biology to aesthetics? And can you name something the parallel predicts that
  turns out false?


  Please adopt the role of a professional philosopher who works on both the philosophy
  of biology and aesthetics. Think carefully and begin by brainstorming the possible
  respects of similarity and difference before committing to an overall verdict. Then
  give a structured assessment of whether the parallel is deep, superficial, or a
  mixture, and explain exactly where the mapping holds and where it comes apart. Please
  write your answer in American English.


