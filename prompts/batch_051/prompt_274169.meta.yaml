  Possible parallel: In philosophy of biology, there are two accounts of function:


  - Etiological (Wright, selected-effects): function of trait = the effect for which
  it was selected in the past.

  - Causal-role (Cummins): function = the contribution it makes to the capacities
  of the containing system now.


  Parallel in literary interpretation:


  - Authorial-intent/genetic criticism: function of a narrative element = what the
  author put it there to do (historical origin in author''s intention).

  - Structural/functional interpretation: function = the role it plays in the work
  as a (timeless) system.


  The novelist''s parallel: both debates concern whether function is backward-looking
  or present-looking; both sides struggle with malfunction, vestigial elements, and
  non-selected side effects.


  Is the parallel deep or superficial? A good answer: partially deep, because both
  involve explaining normativity (function is normative: something can have a function
  and fail to perform it). But there are disanalogies:

  - Biological selection is a causal-historical process with a criterion of success
  (differential reproduction); authorial intention is a mental state of an agent.
  Etiological function can be specified without a designer; genetic criticism posits
  a designer.

  - In biology, causal-role analysis can assign functions to anything that contributes
  to a system capacity (including pathological processes), which is why etiological
  accounts were motivated to capture normative "proper" function. In literature, we
  don''t typically call every effect a function; causal-role interpretation is selective
  based on aesthetic norms, not system capacities. So the parallel would predict that
  a structural critic should count a flaw''s causal effect (e.g., making the reader
  bored) as a function, which is false.

  - Literary "selection" might actually be cultural evolution: conventions survive
  because they do something for readers/publishers. But then the proper analogue of
  etiological function in literature is cultural-history/genre evolution, not authorial
  intent. So the mapping may misalign: the better literary analogue of selected-effects
  function is genre convention as selected by cultural evolution, not authorial intention.
  That''s a rich point.


