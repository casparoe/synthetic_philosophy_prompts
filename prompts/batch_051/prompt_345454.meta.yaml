  ---


  Suppose Charles Darwin were brought back, given a working knowledge of contemporary
  evolutionary theory and of gradient-based machine learning, and asked to adjudicate
  a disagreement between two members of a computational biology group. Both accept
  that evolution is an optimization process of some kind; they disagree about what
  kind, and about whether gradient descent is a better model of learning than natural
  selection is.


  The first researcher defends the claim that natural selection is, by the standards
  of numerical optimization, a poor optimizer. Their argument runs as follows. Gradient
  descent exploits the local geometry of a loss surface: at each step it follows the
  direction of steepest descent, so in a high-dimensional, well-conditioned problem
  it converges quickly to a low-error region. Natural selection, by contrast, is a
  derivative-free stochastic search. Mutations are proposed without any estimate of
  the local slope of a fitness landscape; most are deleterious and are simply discarded.
  Selection can only compare the realized reproductive success of the variants that
  happen to appear, so the population is always climbing whatever small hill it happens
  to be on, and it is easily trapped on local peaks. The process has no way to see
  that a higher peak exists across a valley of lower fitness, and it cannot plan a
  path through deleterious intermediate steps. It optimizes only in the weak sense
  that the frequency of fitter variants tends to increase in the short run, and what
  counts as fitter is constantly being redefined. They conclude that when the goal
  is to make a system improve at a well-defined task, gradient descent is the more
  serious optimizer, and natural selection is mostly a cautionary tale about path-dependence
  and short-sightedness.


  The second researcher replies that this comparison is rigged because it assumes
  exactly what should be in question: that there is a single, fixed objective that
  an intelligent optimizer ought to climb toward. Natural selection has no gradient
  to compute because, in most biologically relevant settings, the mapping from genotype
  to reproductive success is nonsmooth, stochastic, and nonstationary; the environment
  changes, the organism partly constructs its own environment, and the traits under
  selection are not even fixed. Gradient descent adjusts parameters with respect to
  one loss function, but an evolving population is simultaneously adjusting millions
  of correlated variables with respect to a moving, partially self-created objective.
  The very properties the first researcher cites as defects, such as local peaks and
  the strict locality of selection, may be what allow evolution to retain variation,
  cross valleys by drift and recombination, and respond to novel conditions without
  converging to a brittle optimum. This researcher adds that if gradient descent is
  to model open-ended learning rather than static task-fitting, it has as much to
  learn from the mechanisms of variation, population structure, and environmental
  change as evolution has to learn from smooth optimization.


  What position would Darwin most likely take in this dispute, given his own mature
  views about variation, heredity, the struggle for existence, and the gradual production
  of complex organs? Focus on three points. First, address whether Darwin would accept
  either researcher''s implicit assumption that natural selection has, or ought to
  have, a predefined optimum to climb toward, and what difference his answer makes
  to the rest of the argument. Second, consider how Darwin''s insistence on slow,
  stepwise, imperceptible change interacts with the local-optimum objection: would
  he regard valleys of low fitness as an insuperable problem, and what resources in
  his own account of variation and domestication could he plausibly extend to answer
  it? Third, say how, if at all, Darwin would use artificial selection as a bridge:
  does the fact that breeders deliberately pursue a target, while natural selection
  does not, make gradient descent the better analogy for breeding and natural selection
  something else entirely, or does Darwin''s argument from domestic races suggest
  a different lesson?


