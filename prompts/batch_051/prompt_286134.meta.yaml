  Take a one-shot Prisoner''s Dilemma between two players who are perfectly rational,
  fully informed about each other''s rationality, and in exactly the same situation.
  I know the standard line: defection strictly dominates, so defecting is the only
  rational move. I also know Hofstadter''s superrationality: if both players are in
  exactly the same situation and reason identically, then "I cooperate while the other
  defects" is not really an available branch, so the real alternatives are both-cooperate
  and both-defect, and both-cooperate is better, so cooperate.


  My view starts from a different place. I call it "benchmark rationality." The claim
  is: in any symmetric, common-knowledge game, the rational choice is the one you
  would make if you were choosing a decision procedure on behalf of all players at
  once, subject to two constraints: (1) you must choose a procedure that you would
  still endorse after learning that the others are also following it, and (2) the
  procedure must be a Nash equilibrium of the game played between procedures, not
  just between acts. A procedure is a rule that maps your information into an action;
  playing a procedure is choosing an action by applying the rule. Constraint (1) is
  a fixed-point condition: the procedure must be self-endorsing. Constraint (2) says
  you cannot rationally adopt a procedure that would be exploited by someone who knew
  about it.


  For the Prisoner''s Dilemma, benchmark rationality recommends cooperation: the procedure
  "cooperate against an identical procedure" is self-endorsing and, played against
  itself, yields the cooperative outcome, which Pareto-dominates the mutual-defection
  outcome. But unlike Hofstadter''s superrationality, my view also makes a prediction
  in asymmetric games: each player follows the procedure that would be part of a self-endorsing
  equilibrium of procedures, where "self-endorsing" is relativized to what they know
  about the other''s procedure. In a one-shot Stag Hunt it recommends the payoff-dominant
  equilibrium. In Chicken it recommends, I think, the mixed equilibrium — or maybe
  swerving, depending on details I haven''t fully worked out.


