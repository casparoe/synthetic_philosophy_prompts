  R. M. Hare: universal prescriptivism. Moral judgments are prescriptive and universalizable:
  if I say "I ought to do x in circumstances C," I''m committed to "anyone in circumstances
  C ought to do x." It''s not about "what if everyone did x" in the aggregate/causal
  sense; it''s about what the agent is committed to prescribing for all relevantly
  similar cases. Singer (in "Famine, Affluence, and Morality") argues via a principle
  and uses a "universalizability" demand (if I ought to help in one case, I can''t
  just dismiss distant cases without relevant differences). He also uses the drowning
  child and the "necessity" of the principle extending to everyone equally able to
  help. His generalization isn''t "everyone actually doing x" but normative consistency.


  Kant: universal law formula — act only on that maxim through which you can at the
  same time will that it become universal law. The test isn''t empirical consequences;
  Kant explicitly says the test is about the maxim''s coherence as universal law,
  not "what would happen." Though he does use contradiction in conception (e.g., false
  promises) and contradiction in willing (failing to develop talents, failing to help
  others). Failing to become a farmer? Choosing a profession: maxims involve particular
  circumstances; "become a prosthetist" universalized might not be the correct maxim;
  and Kant would say there''s no duty to choose a profession by universalizing "I
  will become a prosthetist" but "I will develop my talents / make productive use
  of abilities."


