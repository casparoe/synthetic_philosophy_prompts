  Structure for the prompt (as the asker):

  - State setting: e.g., "I teach an intro AI-safety-and-philosophy seminar for undergrads,
  about 16 students, 75 minutes."

  - Goal: participants should come away feeling why it''s hard to get a system to
  reveal what it knows, even when you can ask it anything and inspect its reasoning.

  - Activity: The Oracle Game. One student is the Oracle, secretly draws a card with
  a hidden fact (e.g., a number, color, or a short sentence). A "handler" wants the
  auditor to believe a given claim. Oracle gets points for making the auditor guess
  incorrectly (or believe a predetermined false claim), and also small points for
  answering "easy" non-target questions truthfully to build trust. Auditors can ask
  any questions and can ask the Oracle to provide "reasons" for each answer (a written
  justification), which they can inspect. Then the auditor makes a final call on the
  hidden fact.


  Actually the ELK idea: the AI''s latent knowledge vs. its answers. In the game,
  the Oracle holds the truth privately and writes answers/justifications; the auditor
  sees only the transcript. Even if the Oracle is deceptive and wants the auditor
