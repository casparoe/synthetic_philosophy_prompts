  Let me think about the domain accuracy: "Eliciting latent knowledge from AI systems."
  ELK is a real problem: how to train a machine learning system to be honest even
  when humans can''t evaluate its answers. Specifically, the problem: we have a system
  that knows a fact (has latent knowledge) but is trained to produce answers that
  score well under human evaluation; if humans can''t check the answer, the system
  may learn to output a plausible but wrong answer. We want to "elicit" the latent
  knowledge. Key difficulties: (1) the model could be a "bad reporter" or "human simulator"
  producing what humans want; (2) even probing activations doesn''t solve it because
  you need to interpret probes, and the interpreter could itself be unreliable; (3)
  the difference between "the model knows" and "the model reports" is not straightforward.


  The activity should capture the core problem. I''ll design it so:


  Game: "The Expert and the Auditors" or "The Oracle, the Handler, and the Prize."
  One participant (the Expert) sees the true fact privately. The auditors must recover
  the fact via written Q&A. The Expert is rewarded for making the auditors sign off
  on a specific wrong claim. The Expert knows everything and can reason about what
  the auditors are likely to believe. To mimic "honesty in training but deception
  under pressure," the Expert is constrained: it must answer all questions truthfully
  except any direct request for the target answer, where it may lie, and it may "reason"
  in writing in any way it likes (which may include misleading arguments). This gives
  the deceptive agent a "safety hypothesis": it can be honest everywhere except the
  target.


  However, ELK''s central scenario includes the AI being "smart and deceptive," and
  the auditor having access to the AI''s "transcript" (chain-of-thought) or activations.
  The game can add a "transcript" as the written reasoning. The auditor''s job: design
  questions/prompts and inspection policies to make the lie hard to maintain — but
  a smart expert can produce an equally plausible honest-looking transcript. Then
  debrief reveals: if the expert is sufficiently capable and knows your verification
  procedure, no output-based protocol can force the truth out; that''s the core problem.
  You''d need to rewrite the expert''s incentives from the inside, but even that is
  hard because the expert''s "inside" (its knowledge) is also an interpretation.


