  Potential prompt:


  "I am a high school junior and co-leader of my school''s Political Philosophy Society.
  We are planning a structured civics event in which a panel will take up two competing
  views about shared resources: the Hardinian position, which sees the ''tragedy of
  the commons'' as the default outcome whenever a resource is open to many users,
  and the Ostromian position, which holds that communities sometimes govern shared
  resources sustainably without either full privatization or centralized state control.
  Rather than have the two sides talk past one another in front of an audience, I
  want them to begin from a single document they have both signed.


  Please draft that document: the joint statement of an adversarial collaboration
  between a committed Hardinian and a committed Ostromian. In an adversarial collaboration,
  the two camps agree to state what they can both sign, to state their remaining disagreement
  in wording each side accepts for its own position, and to specify what would actually
  move at least one of them.


  The statement should contain:

  1. A numbered list of agreed claims, covering: the difference between common-pool
  resources and pure public goods; the logic of free-riding; what Hardin''s oversimplified
  pasture example does and does not show; and what each side concedes to the other
  before the disagreement begins. The agreed claims should be substantive and precise,
  not vague truisms.

  2. A disagreements table. Each row should state a proposition on which they divide,
  then give the Hardinian and Ostromian wording of their positions in language each
  side would accept as fair.

  3. A section on cruxes: the sub-questions such that settling them would genuinely
  move one side. For each crux, state what kind of evidence or argument both sides
  agree would bear on it, and record each side''s prediction in advance.

