  Boethius: In "The Consolation of Philosophy," Book V, Lady Philosophy addresses
  whether divine foreknowledge is compatible with free will. Key move: God is eternal,
  not everlasting through time; eternity is the complete, simultaneous, perfect possession
  of endless life. God doesn''t fore-know the future as future; he knows all things
  as an eternal present. Necessity comes in two kinds: simple necessity (e.g., men
  are mortal) and conditional necessity (given that someone is walking, he is walking;
  or being known, the thing is as known). Foreknowledge doesn''t make future contingents
  simply necessary; their necessity is conditional. So freedom preserved.


  Tralfamadorians in Vonnegut: see all moments at once, past, present, future; they
  know a moment is structured the way it is, no free will; "so it goes" expresses
  resignation. Billy becomes unstuck in time.


  The tension: if all moments exist as an eternal block and are known at once, why
  doesn''t that rob us of free will? The Tralfamadorians say it does. Boethius says
  it doesn''t because atemporal knowledge is compatible with voluntary action. The
  novel seems to dramatize the fatalist slip: the fact of the block (moments already
  arranged) plus the atemporal vantage leads Billy to accept fatalism and cease trying.
  Boethius would say the Tralfamadorians (and Billy) confuse the order of knowing
  with the order of causing. But does the novel''s metaphysics actually match Boethius''?
  Tralfamadorian time doesn''t just involve an atemporal knower; it involves all moments
  being fixed; but Boethius also thinks God knows future contingent actions as present.
  So the difference is subtle: Boethius insists the agent still deliberates, chooses;
  the "fixity" is only from God''s standpoint, not a constraint on the agent. Vonnegut''s
  narrator seems to think fixity is full-blown fatalism.


