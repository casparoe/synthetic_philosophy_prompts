  Nomic (Peter Suber, 1982, published in Douglas Hofstadter''s Scientific American
  column, later in "Metamagical Themas"). The game: players propose rule changes;
  a rule change is adopted if it gets required votes; the initial ruleset includes
  rules about how to change rules, including rule-changing rules that themselves can
  be changed. This leads to self-amendment, paradoxes, and the possibility of changing
  the game''s own rule of change. Key concepts: "self-amendment," "entrenchment,"
  "the paradox of self-amendment," "reflexivity," "mutable vs immutable rules."


  Suber distinguishes "self-amendment" from "amendment": a self-amending rule authorizes
  its own amendment. He argues self-amendment is possible and not paradoxical if one
  is careful about levels of rules (object-language vs meta-language), but there''s
  a puzzle: to amend the amendment rule by the amendment process seems circular. Ross''s
  paradox: Article 88 of Danish Constitution (1953) provided that the Constitution
  can be amended by a procedure requiring... and Article 88 itself could be amended
  by that same procedure, but the amendment of Article 88 requires using the old Article
  88, which gives rise to a self-reference puzzle. Suber''s resolution: self-amendment
  is a special case; the rule''s amendment power extends to itself; there''s an "infinite
  regress" but it''s benign.


  For interview questions, I''d invent a guest who defends, say, "the self-amendment
  paradox is an instance of a more general problem about using a rule to validate
  its own replacement, and formal logic can''t fully dissolve it." Then ask questions
  that press on: (1) whether the paradox is real or an artifact of conflating rule-levels;
  (2) how the defender answers the standard reply (Suber) that self-reference is benign
  because the rule refers to itself only de re; (3) Nomic''s "rule 209" or "the paradox"
  as a live experiment — ask what would have to happen in a real game to show the
  resolution is wrong; (4) analogy to Hart''s rule of recognition: can the ultimate
  rule of recognition change? (Hart says yes, through a different route than legal
  change — it''s a "fact" question). (5) What about "immutable" clauses and entrenchment:
  can a rule entrench itself against its own amendment procedure? (Suber''s "entrenchment"
  concept). Each question with a follow-up keyed to the likely answer.


