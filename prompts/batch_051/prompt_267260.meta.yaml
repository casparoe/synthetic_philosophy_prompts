  The "protected characteristics" domain: what makes a ground of discrimination suspect?
  The literature includes:

  - Immutability (Frontiero v. Richardson: sex is immutable; but sexual orientation
  etc. complication)

  - Visibility / conspicuousness

  - History of purposeful discrimination / subordination

  - Political powerlessness (Carolene Products footnote 4: discrete and insular minorities)

  - Relevance to legitimate purposes / moral irrelevance

  - Stigma, dignitary harm

  - Whether the trait is central to personal identity (and whether that cuts for or
  against protection)

  - "Suspect class" doctrine: strict scrutiny for race/alienage/national origin; intermediate
  for sex/illegitimacy; rational basis for age, disability in some contexts, poverty,
  sexual orientation historically but shifting.

  - Critiques: immutability criterion fails for religion (chosen but protected) and
  language/accent; the "immutability" notion is contested; political powerlessness
  is empirically false for women (numerical majority) yet sex is protected; visibility
  may worsen stigma; the whole "suspect classes" framework is criticized (Balkin;
  Yoshino; anti-classification vs anti-subordination).


  A procedural prompt would operationalize: Given a proposed ground G, ask in order:

  1. Does the ground mark a group with a history of systematic disadvantage or subordination?
  What counts as sufficient evidence; how recent/how documented?

  2. Is the ground currently a site of prejudice/stereotype or social meaning that
  loads it with stigma?

  3. Is the ground irrelevant to merit in most contexts where it is used? (Moral irrelevance
  criterion)

  4. Is the ground immutable or costly to change, or is it so close to identity that
  requiring change is itself a dignitary harm? (Careful: religion is chosen; workload:
  distinguish "chosen" from "costly to abandon".)

  5. Is the group politically vulnerable despite formal equality — e.g., lack of representation,
  minority status, inability to protect itself through ordinary politics?

  6. Does the ground already attract an existing pattern of adverse decisions/outcomes
  that the market or ordinary politics won''t correct?

  7. Countervailing considerations: Is there a legitimate State interest tied to the
  ground itself (e.g., age for licensing, health status for safety) that requires
  a carve-out; does protection risk harming other groups; feasibility of definition.

  8. Decision rule: classify as suspect (strict scrutiny), quasi-suspect (intermediate),
  or non-suspect; or design alternative (duty to accommodate, disparate impact provisions).

