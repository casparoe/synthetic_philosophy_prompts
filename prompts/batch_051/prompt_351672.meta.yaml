  I have been thinking about a proposal inspired by Han Feizi''s Legalism, and I want
  to know how it would actually behave if it were put into practice.


  The background I am working from is this. Han Feizi held that a ruler cannot rely
  on officials being virtuous, loyal, or well-intentioned, because these qualities
  can be faked and are easily undermined by temptation. Instead, he wanted appointments
  and rewards to turn on what he described as "matching names and results": an official
  states in advance what they will achieve, and is then judged strictly by whether
  their actual results correspond to that statement. Crucially, as I understand his
  view, the crime is the mismatch itself. A minister who promises little but achieves
  much is in the same trouble as one who promises much and achieves little, because
  the ruler''s real need is for speech and action to line up, not for occasional bursts
  of good performance.


  Now suppose a large public bureaucracy adopted the following modern version of that
  rule.


  1. Each year, every senior official must file a public statement of quantified,
  dated undertakings: the number of licences processed, inspections completed, projects
  delivered, items trimmed from the budget, whatever falls within their remit.

  2. At the end of the year, an independent body compares the statement with measured
  results. Officials are paid a fixed salary, but a substantial bonus is earned only
  for exact correspondence between the statement and the results, within a small tolerance
  band.

  3. Any deviation, whether a shortfall or an over-delivery, costs the official the
  whole bonus for that item and triggers a disciplinary review, and the rule says
  the review may not take intentions, effort, extenuating circumstances, or unannounced
  good works into account.

  4. The official who hits their stated undertakings precisely, item by item, is paid
  the full bonus and is preferred for promotion, whether or not the undertakings themselves
  were small.

  5. Statements are public, and the public and other officials may compare what was
  promised with what was delivered; revisions to the statement are allowed only twice
  a year and only with a published explanation.


  I want to know what this mechanism would do in practice, not whether it is moral.
  Walk through the incentives it creates for individual officials, for their superiors,
  and for the independent board. What kind of person is selected for promotion after
  several rounds of this? Where is it gamed first—through cautious underclaiming,
  concealment of over-performance, creative classification of work, collusion with
  the evaluators, or something else? Does the "over-delivery is also punished" rule
  make the system more truthful or just more wasteful and timid? And finally, does
  this modern implementation actually support Han Feizi''s underlying idea that a
  ruler can do without virtue, or does it quietly reintroduce the very virtue it was
  meant to replace?


