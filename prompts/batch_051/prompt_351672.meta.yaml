  ---


  You are a professional philosopher with a special interest in the design of institutions,
  incentive systems, and the contrast between governing through virtue and governing
  through rules. Please work through the following slowly; start by listing the incentives
  created at each step before you settle on a verdict, and do not assume the scheme
