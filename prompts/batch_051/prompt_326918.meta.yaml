  public employees, contractors, or officials from disclosing information must be
  lodged with the board within 14 days of signing. The NDA is automatically void after
  18 months unless the board votes to renew it for up to 12 months, upon finding that
  disclosure would cause a specified serious harm (endanger life or safety, compromise
  an ongoing investigation, violate a person''s privacy, or reveal trade secrets).
  Anyone may petition the board to void an NDA early by filing a public-interest statement;
  the board must respond with a reasoned, published decision within 60 days. Petitioners
  are not liable for the agency''s costs. Agencies that fail to lodge an NDA lose
  the ability to enforce it and the official who signed it is subject to a fine.


