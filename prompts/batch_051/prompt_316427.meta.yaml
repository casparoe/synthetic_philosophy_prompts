  The paradox of hedonism domain. The central issue: hedonism says pleasure (or happiness)
  is the only intrinsic good / ultimate aim. Yet deliberately aiming at pleasure often
  makes it less likely to be attained; pleasure seems to be a by-product of engaging
  in valued activities for their own sakes. The paradox: if pleasure is the only thing
  worth pursuing for its own sake, then the rational strategy seems to be to pursue
  it directly; but this self-defeatingness suggests that one should not pursue it
  directly — perhaps not even treat it as one''s overriding goal in deliberation.


  In-the-weeds angle: distinguish different readings:

  1. Psychological hedonism (descriptive claim: we always do/are only motivated by
  pleasure) — the paradox challenges by showing we can act for non-hedonic ends and
  get more pleasure by doing so.

  2. Prudential/evaluative hedonism (pleasure is the only intrinsic good) — the paradox
  may not refute this because a theory of value is not a decision procedure.

  3. Hedonism as a deliberative strategy or decision procedure — the paradox most
  directly threatens this.


  Also distinguish:

  - The "paradox of hedonism" vs. the "paradox of egoism" / self-defeatingness in
  consequentialism (Parfit''s "self-interest is not directly self-defeating"; Henry
  Sidgwick''s "the paradox of egoistic hedonism": pleasure is best pursued indirectly;
  the "paradox of egoism" more generally).

  - The "paradox of desire/felicity": satisfying a desire requires first having the
  desire unsatisfied (related but distinct).

  - Mill''s distinction between higher and lower pleasures maybe not central.


