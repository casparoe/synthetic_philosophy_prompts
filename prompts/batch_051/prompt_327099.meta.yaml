  Prompt text:


  "I''ve usually taken the standard Molyneux answer as obviously right: a man born
  blind, made to see, won''t be able to say by sight alone which is the cube and which
  the sphere before touching them. But I''ve been rereading Locke and I''m struck
  that the bit just before he drops the usual problem says, [quote from Locke, Book
  II, Chapter IX, section 8: "the judgment presently, by an habitual custom, alters
  the appearances into their causes."] That line is doing more work than people admit.
  If sight is already shot through with judgment and habitual custom, then the "no"
  answer is not a clean claim about raw sensation; it''s a claim about what prior
  associations the person has formed. So I want to stress-test the no. What would
  actually count against it? I don''t just mean the old Cheselden case or standard
  objections; I want a map of exposures. Which possible experimental results, accounts
  of perceptual learning, or findings about multimodal representations in early blindness
  would be decisive against the standard answer, which would just force a qualifed
  version, and which can supporters of no dismiss without making their position unfalsifiable?
  And is it a problem for the no that it''s less a fact about perception than a bet
  about transferable training?"


