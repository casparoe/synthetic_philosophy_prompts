  Actually brain death: death determined by neurologic criteria — irreversible cessation
  of all functions of the entire brain, including brainstem. Circulatory death: irreversible
  cessation of circulatory and respiratory functions. Historically death was heart/lungs
  stopping. Ventilators and ICUs decoupled them. Brain death criteria arose (Harvard
  Ad Hoc 1968) to deal with patients on ventilators with dead brains but beating hearts.
  Philosophical debate: is death the loss of the organism as a whole''s integrative
  functioning (brain as integrator), or is it the loss of the person (higher brain),
  or the cessation of circulation? There are controversies about "irreversibility":
  irreversibility relative to what interventions (e.g., ECMO can restart circulation;
  DCD vs DCD with normothermic regional perfusion). Also the 2008 President''s Council
  white paper "Controversies in the Determination of Death" argues the brain is not
  the integrator (the body can integrate somewhat with brainstem dead) but that death
  is loss of the organism''s fundamental work of self-preservation, of which the brain
  is the critical organ because it''s the locus of the organism''s need-driven commerce
  with the environment.


