  Plausible (mostly right) summary of Marx:


  "Marx''s core idea is that workers are exploited because they create the entire
  value of the product but are paid only a fraction of it as wages. The capitalist
  keeps the rest as profit, which is simply unpaid labor. So exploitation is the gap
  between what a worker produces and what they receive. Alienation is the subjective
  side of this: because the worker sells his labor to someone else, he feels estranged
  from the product, from the activity of working, and from other people. On Marx''s
  view the cure is obvious: if workers were paid the full value of what they make,
  exploitation and alienation would both disappear. That''s why he thinks capitalism
  is unjust and why his theory doesn''t really apply to a well-regulated market economy
  where wages are fair."


  This is a competent popularization with subtle errors:

  - "workers create the entire value" — conflates value creation with the labor theory
  of value; Marx does think living labor is the source of new value, and profit is
  unpaid labor (surplus value). So mostly right.

  - "paid only a fraction of it" — okay, but the crucial distinction: workers are
  paid the value of their labor power, not of labor. The surplus is the difference.
  The "full value of what they make" would mean the entire product''s value — impossible
  to define since value includes constant capital transferred.

  - "Alienation is the subjective side" — subtle error: alienation is not merely subjective
  (feeling) but objective structural condition (estrangement from species-being, product,
  activity, others). Also the leap from exploitation to alienation as cause isn''t
  exactly Marx''s early account; alienation in the 1844 manuscripts is about estranged
  labor under private property, before the mature theory of surplus value.

  - "if workers were paid full value, both would disappear" — error: under Marx, exploitation
  is about the wage relation itself; even a "fair" wage (market value of labor power)
  leaves exploitation; workers paying full value would abolish capitalism, not just
  adjust wages. Also a "well-regulated market economy" still has exploitation because
  exploitation is not unfair wages but the extraction of surplus value; and alienation
  wouldn''t automatically vanish from fair pay.

  - Also "capitalism is unjust" — controversial: Marx sometimes describes exploitation
  as unfair/robbery, but he also treats justice as a juridical concept tied to modes
  of production; careful Marx scholars debate whether he condemns capitalism as unjust
  in a transhistorical sense.


