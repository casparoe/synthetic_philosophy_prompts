  Possible summary text:


  "Marx''s idea is that workers are exploited because they create the whole value
  of whatever they produce, but they are paid only as much as they need to survive;
  the difference — profit — is unpaid labour that the capitalist pockets. So exploitation
  is just the gap between what a worker makes and what a worker is paid. Alienation
  is what that feels like from the inside: since the worker does not own the product
  or the process, work feels meaningless, and he feels cut off from the product, from
  his own activity, and from other people. It follows that if workers were paid the
  full value of what they produce, exploitation and alienation would both vanish.
  That is also why the theory applies only to sweatshops and not to well-regulated
  economies where wages are fair."


  I need to ensure "no howlers": this is mostly right-ish but has several subtle issues:

  1. "create the whole value" — okay under LTV but ignores constant capital; a careful
  statement would say workers reproduce the value of their means of subsistence (necessary
  labor) and create surplus value (surplus labor). Saying "paid only as much as they
  need to survive" conflates wages with subsistence in a Malthusian way; Marx''s labor-power
  value is historically and morally determined, includes reproduction, and is not
  just biological survival. This is a subtle error: wages equal the value of labor
  power, which can exceed bare subsistence.

  2. "exploitation is just the gap between what a worker makes and what a worker is
  paid" — roughly surplus value, but too loose: exploitation is measured by the rate
  of surplus value, surplus labor time over necessary labor time; the "gap" in money
  terms is profit, but there are complications (constant capital, rent, interest,
  commercial profit). Also "make and paid" game conflates labor and labor power.

  3. "Alienation is what that feels like from the inside" — subtle but important:
  Marx''s alienation is not a feeling; it is an objective condition. Also in mature
  Marx, alienation appears as the rule of dead labor over living labor; the four aspects
  are objective.

  4. "if workers were paid the full value of what they produce, exploitation and alienation
  would both vanish" — wrong: Marx''s point is that under capitalism, workers are
  paid (on average) the full value of their labor power, and they are still exploited
  because the wage contract covers necessary labor but the working day extends beyond
  it. Paying "full product" would just end the capitalist''s profit and hence the
  system — not a reform. And alienation is tied to the wage relation and private ownership,
  not just the pay level.

  5. "applies only to sweatshops, not well-regulated economies" — wrong: exploitation
  is a structural feature of all wage labor under capitalism, not a matter of bad
  wages; Marx would say fair wages still exploit. This is a standard objection presented
  as a conclusion.


