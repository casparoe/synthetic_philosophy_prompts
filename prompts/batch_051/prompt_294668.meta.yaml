  Philosophical background on manipulation vs. persuasion (from my knowledge): There
  are several accounts:

  - Manipulation as covert influence: influence that is hidden or that the target
  would reject if they knew.

  - Manipulation as bypassing or subverting rational capacities: influencing through
  non-rational means — emotions, biases, pressure, framing — rather than engaging
  the target''s deliberative capacities with reasons.

  - Manipulation as pressure: manipulating by making options worse or exploiting vulnerabilities
  (e.g., guilt-tripping, threatening).

  - Moralised accounts: manipulation is wrongful influence, where the wrongness is
  not reducible to bypassing reason.

  - "Legitimate persuasion" involves offering reasons, respecting autonomy, allowing
  the other to decide.


  Common confusions to embed:

  1. Equating "influence that works through emotion or framing" with "bypassing reason."
  But emotions and framing can be part of rational communication; not every appeal
  to emotion is manipulation. Also, some manipulation might actually engage reasoning
  but with misleading information (lying/deception is often manipulative but goes
  through the person''s rational capacities). So the "bypassing" criterion over-captures
  and under-captures.

  2. Claiming manipulation is "by definition invisible to the person being manipulated"
  — but many instances are known/resented; targets often know they''re being guilt-tripped.

