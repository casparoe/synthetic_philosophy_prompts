  The principle: In jus in bello (conduct in war), all combatants are morally equal:
  a soldier fighting for an unjust cause who kills an enemy combatant within the rules
  does no wrong (or at least has the same permission as a soldier on the just side).
  This is separate from jus ad bellum (justice of the war itself).


  The standard arguments:

  1. The epistemic argument: rank-and-file soldiers usually cannot know whether their
  war is just; they are given selective information, patriotic narratives, chain of
  command. So it would be unreasonable to hold them to a standard that requires knowing
  the justice of the cause.

  2. The non-responsibility / division-of-labor argument: the decision to go to war
  is made by political leaders; ordinary soldiers are not responsible for that decision
  and so shouldn''t lose their rights for it.

  3. The mutual-risk / symmetry argument: combatants on both sides have made themselves
  dangerous and, by engaging in combat, expose themselves to being killed; this symmetric
  exposure generates a kind of fairness or equality. (This is more Walzer''s romantic/contractual
  strand.)

  4. The institutional/humanitarian argument: the laws of war can only regulate conduct
  if they apply impartially; if we make the rules depend on the justice of the cause,
  each side will claim to be just and the restraints collapse (especially because
  the rules are enforced by the belligerents themselves).


