  Real Mīmāṃsā position:

  - svataḥ prāmāṇya: the validity of a cognition is intrinsic, inherent; knowledge
  is self-certified. In particular, Vedic words are their own authority — no external
  check needed.

  - Veda apauruṣeya: authorless, eternal. Reasons: no human memory of an author; great
  sages only transmitted it; accepting a human author would introduce unreliability;
  hidden matters (adṛṣṭa) can be known only through the Veda; so the Veda is the only
  source.


  An argument to evaluate could be:


  (1) If a claim concerns matters beyond perception and inference (e.g., heaven, the
  unseen effects of ritual), then it can be known, if at all, only through language.

  (2) Language normally gives knowledge only when its source is reliable, and the
  source''s reliability must be grounded in something other than the language itself.

  (3) But for these unseen matters, there is, by hypothesis, no other source by which
  to check the speaker.

  (4) So if one required an independent check of the source, these matters would be
  unknowable.

  (5) Yet they are known — the Veda does convey them. (or: yet we must be able to
  know our duties)

  (6) Therefore an independent check cannot be required for at least one kind of language,
  namely, language about unseen matters.

  (7) Therefore the Veda''s authority is intrinsic to itself, and since any authored
  text would inherit its reliability from its author, the Veda must be authorless.


