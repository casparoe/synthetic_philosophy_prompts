  Potential argument (from Mīmāṃsā):

  (1) Any piece of testimony (a sentence told to you) gives you knowledge only if
  you are entitled to trust the source.

  (2) Your entitlement to trust a source must come from something other than the testimony
  itself — e.g., having checked the source''s reliability in other cases.

  (3) Now consider Vedic sentences about unseen things, like the claim that a certain
  rite produces heaven. Ex hypothesi, no perception or inference can verify these.

  (4) So no independent check of the Veda''s reliability with respect to such unseen
  things is possible — there are no "other cases" of this kind to check it against.

  (5) Yet if no independent check is possible, then by (2) we could never be entitled
  to trust the Veda on these matters.

  (6) But the Veda is our only possible source of knowledge about these matters; there
  is no alternative.

  (7) So either such knowledge is impossible (which the orthodox tradition denies)
  or the demand for an independent check must be dropped for the Veda.

  (8) Therefore the Veda''s authority is intrinsic and self-certifying; and since
  the reliability of an authored text would need to be grounded in its author, the
  Veda must be without an author.


