  make us sad, afraid, or appalled, and why we count the experience as valuable or
  pleasant. The solutions I have collected so far are these. (1) The purgation view:
  tragic art arouses and then drains off our pity and fear, and the resulting relief
  is the source of the pleasure. (2) The conversion view: the artistry of the work
  — the plot, verse, staging, or performance — is itself so pleasing that it transforms
  or overpowers the painful materials, so that the whole experience is enjoyed. (3)
  The control or safety view: because we know the represented suffering is not real
  and we can stop at any time, the fear and pity are stripped of their sting and become
  enjoyable exercises of our emotional capacities. (4) The meta-response view: the
  first-order sadness is accompanied by a second-order pleasure, such as satisfaction
  at our own capacity for sympathy or admiration for the artist who moved us. (5)
  The rich-experience view: we value a broad emotional repertoire, and the sadness
  of tragedy is not a cost but part of what we seek — sorrow of the right kind is
  itself valued. I keep seeing these five, in various terminologies, and I suspect
  they are the whole menu."


