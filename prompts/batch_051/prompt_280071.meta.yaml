  The paradox of tragedy (or "paradox of painful art") — why do we seek out artworks
  that reliably produce sadness, fear, or horror? Standard solutions:


  1. Catharsis/purgation view: engaging with tragic art purges or discharges negative
  emotions, leaving us relieved and therefore pleased. (Associated with Aristotle''s
  Poetics, but we can avoid exact attribution.)

  2. Conversion view: the aesthetic pleasure from the artistry (plot, verse, performance)
  is so great that it converts or transforms the painful emotions into an enjoyable
  overall experience. (Historically Hume.)

  3. Compensation/meta-response view: the painful emotions are accompanied by (or
  give rise to) a positive second-order response — e.g., we enjoy feeling sadness
  because it reassures us of our capacity for empathy, or we admire the craft of the
  poet for evoking it.

  4. Control/security view: in fiction, we experience negative emotions safely, from
  a position of control, and we enjoy the exercise of our emotional capacities without
  real danger (the "make-believe" or distance solution).

  5. Richness-of-experience / "sweet sorrow" view: people value a wide range of emotional
  experiences, and sadness in art is not merely negative but bittersweet; what is
  painful when caused by real events can be valuable when chosen.

  6. Appreciation of cognitive value? Could include "we value tragic works because
  they give us insight, understanding, or truth about the human condition, and this
  cognitive gain outweighs or justifies the pain." Though not exactly a solution to
  why pleasure but why we value. Could include as a class.


