  Let me flesh out the domain details in the request so the model knows what''s expected:


  - Lottery paradox (Kyburg): Consider a fair lottery with, say, 1,000,000 tickets,
  one winner. It seems rational to believe of each ticket "this ticket will lose"
  because the probability it wins is 0.000001. If rational belief is closed under
  conjunction (if you rationally believe p and rationally believe q, you rationally
  believe p&q), then you rationally believe all tickets will lose. But you also rationally
  believe exactly one ticket will win. Contradiction.


  - Preface paradox (Makinson): An author writes a book with many claims, each carefully
  checked. She rationally believes each claim. But given her fallibility, she rationally
  believes that at least one claim in the book is false (as she says in the preface).
  Yet the conjunction of her claims is inconsistent with "at least one is false."
  So she rationally believes each conjunct but also rationally believes the negation
  of the conjunction.


  These two are structurally similar: high probability of each individual, low probability
  of conjunction. The lottery case: the "at least one wins" is a logical certainty,
  not just high probability, which makes the lottery paradox sharper. The preface
  case: the preface belief is just (rationally held) high-probability claim about
  her own fallibility.


  A classroom activity could harness this distinction. Ideas for activity: Have students
  each submit 10 factual claims they are very confident in, written down, with a preface
  statement "At least one of my claims is false." Then grade/bet. Or a lottery simulation
  with tickets and a payoff where participants must state their beliefs and take bets.
  The debrief maps.


