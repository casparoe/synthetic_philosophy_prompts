  Key conceptual points:

  1. Process vs. product randomness. A sequence can be an outcome of a random process
  without the sequence itself having any intrinsic property.

  2. All specific sequences equally likely—but this doesn''t license calling all-heads
  "random"; it just means probability alone doesn''t distinguish them. Our judgment
  of "random-looking" is about patterns.

  3. Algorithmic randomness / Kolmogorov complexity: for finite strings, measure randomness
  by incompressibility. A string is random to the extent it has no shorter description
  than itself (relative to a fixed programming language). This is graded, not binary:
  strings compress more or less easily. There''s a cutoff only relative to a chosen
  threshold; different thresholds give different answers.

  4. Martin-Löf randomness: for infinite sequences, one can define random as passing
  all effective statistical tests; a sequence is random if it avoids all effective
  null sets. This gives a clean yes/no for infinite sequences (well, almost everywhere).

  5. Therefore finite sequences can only be random in a loose or degree-based sense;
  a binary property of randomness applies naturally to infinite sequences or to generative
  processes/measures.


