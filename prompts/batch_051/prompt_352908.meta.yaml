  Model answer:


  The Commission''s four rulings are best understood as running together four distinct
  things that "bad grammar" might mean: ungrammaticality relative to a speaker''s
  own internalized variety; nonconformity to a socially superordinate standard; violation
  of an arbitrary codified preference; and communicative defectiveness.


  First sense: performance error or learner error — utterance not licensed by the
  speaker''s own grammar. Example (mine): a tired native speaker saying "I the sandwich
  ate quickly." Such strings are not licensed by any stable system the speaker has;
  speakers correct them, and they violate even their own grammaticality judgments.
  Here "bad grammar" has a defensible descriptive sense: the string is ungrammatical
  relative to the speaker''s idiolect.


  Second: dialect difference. Negative concord, as in "I don''t need no help from
  anybody," violates the rules of standard written English but complies with the systematic
  rules of many nonstandard varieties. Descriptivists point out that negative concord
  is rule-governed: in those varieties the multiple negatives agree rather than cancel,
  and speakers consistently restrict its use to appropriate morphosyntactic environments.
  Calling it bad grammar is therefore not a linguistic description of the system but
  a social ranking of the system''s speakers. The descriptivist observation — that
  every native variety is equally rule-governed — undermines the claim that this is
  "bad" in any metrical or scientific sense, though it need not undermine the claim
  that use of such forms in formal registers carries social costs.


  Third: codified stylistic prohibition with no empirical basis. The split infinitive
  and the stranded preposition are widely used by standard speakers, including careful
  writers, and are fully grammatical in modern English; the prohibitions descend from
  Latinate analogies and arbitrary taste. To call these "bad grammar" is to mistake
  an etiquette for a structural claim. A descriptivist can note that "to carefully
  read" and "Who did you talk to?" are grammatical in standard English on any syntactic
