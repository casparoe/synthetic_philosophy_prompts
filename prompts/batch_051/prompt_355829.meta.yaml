  "I''ve recently started volunteering with a habitat restoration project, and the
  group has split down the middle over whether completing the project would be a moral
  improvement. One camp uses the language of conservation: restoring the wetland will
  bring back a degraded ecosystem, increase biodiversity, and create a thriving community
  of plants and animals. The other camp thinks in terms of wild animal welfare: a
  ''thriving'' ecosystem is one with enormous numbers of short, painful, predator-filled
  lives, and on any impartial accounting of sentient welfare it is far from obvious
  that more of this is good; destroying or not restoring such habitat might well reduce
  net suffering. The frustrating part is that the two camps agree on nearly all the
  biological facts — high mortality, r-selected life histories, predation, disease
  — and yet after a year of discussion nobody has moved. What kind of disagreement
  is this, actually? A hidden empirical disagreement about whether wild animals''
  lives are on balance worth living; a methodological disagreement about how to aggregate
  welfare across billions of small, uncertain lives; a normative disagreement about
  whether species, ecosystems, or biodiversity are themselves units of value rather
  than proxies; or something else? And given whatever diagnosis you defend, what would
  count as progress — a field study, a population model, a framing distinction, or
  an admission that the question is underdetermined by our values?"


