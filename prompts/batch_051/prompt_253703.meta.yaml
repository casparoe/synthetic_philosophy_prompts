  The theory: ready-to-hand (Zuhandenheit) — equipment withdraws in use; present-at-hand
  (Vorhandenheit) — it shows up as objects when broken. Breakdown (Störung) makes
  the equipmental context visible: conspicuousness (Auffälligkeit), obtrusiveness
  (Aufdringlichkeit), obstinacy (Aufsässigkeit). The "world" — the referential totality
  (Verweisungszusammenhang) — lights up. Also "the workshop" metaphor, and that the
  equipment is not merely a thing but a network of assignments ("in-order-to", um-zu;
  "towards-which", "for-the-sake-of").


  The prompt should ask: map the episode through the theory: what was ready-to-hand
  before (the computers/airline systems), what broke, how the breakdown made the whole
  referential context visible (Falcon sensor as security software vs. the operating
  system as infrastructure; the single-point failure), what Heidegger''s analysis
  explains (why the outage was experienced as a world-loss rather than a mere technical
  fault), and where it misses or misdescribes (Heidegger''s examples are hammers and
  workshops; modern digital infrastructure is more like "equipment of equipment" and
  also includes AI/vendors, automatic updates, the Cloud; breakdown wasn''t discovered
  in hand-tool use but remotely, at scale; government/legal/corporate mediation; the
  phenomenon of "breakage at a distance"; people too are users; the equipment was
  not transparent to anyone — even CrowdStrike didn''t understand it; the update itself
  was supposed to be invisible infrastructure). Also what the episode shows about
  the theory: does it confirm, extend, or stress Heidegger''s account? Ask: is the
  digital "world" a world in Heidegger''s sense? Does "readiness-to-hand" apply to
  infrastructure that no single user wields? Also ask where Heidegger would be silent.


