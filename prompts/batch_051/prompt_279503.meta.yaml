  Let me think carefully about the epistemicism vs. supervaluationism debate.


  Epistemicism (Timothy Williamson): vague predicates have sharp boundaries, but we
  can''t know where they are. Vagueness is a kind of ignorance, not semantic indeterminacy.
  Truth-value gaps are rejected; classical logic retained.


  Supervaluationism (Kit Fine, maybe older): vagueness is semantic indecision; there
  are multiple admissible precisifications of a vague predicate; a sentence is true
  if true on all precisifications, false if false on all, and neither otherwise. This
  gives truth-value gaps while preserving classical logic for many validities (excluded
  middle remains valid though each disjunct may be neither true nor false).


  A classic problem for supervaluationism: "Dsupervaluationism" — the problem of higher-order
  vagueness and the "definitely" operator. The operator D (definitely) has its own
  borderline cases, leading to higher-order vagueness; supervaluationists struggle
  to give a semantics for "definitely" that doesn''t collapse to a precise boundary,
  which would be incompatible with vagueness.


  Another classic problem for supervaluationism: "D true" is itself vague? The boundary
  between the true and the borderline is itself vague, but supervaluationist semantics
  as standardly stated uses a definite set of precisifications and a definite truth
  definition, giving sharp boundaries at the meta-level.


  Another problem: supervaluationism and ordinary truth-talk. Since excluded middle
  "either he is bald or he is not bald" is true (supertrue) even when neither disjunct
  is true, this conflicts with ordinary disquotation intuitions; saying "it''s not
  the case that he''s bald and not the case that he''s not bald" is also true.


  For epistemicism, a classic problem: explaining why we can''t know the sharp cutoff
  — the margin-for-error principle. And the problem of explaining borderline cases
  in terms of ignorance: if "he is bald" is either true or false, then when we''re
  in a borderline case, our inability to say isn''t determinate.


