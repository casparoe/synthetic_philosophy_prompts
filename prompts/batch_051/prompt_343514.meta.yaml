  doctrine of double effect into a decision procedure I can actually run on a claim
  before deadline, say 30 minutes: the questions to ask in order, what counts as a
  sufficient answer to each, where the procedure should stop and say ''this is not
  a mere side effect,'' and where it has to punt to a human because the step is a
  value judgment rather than a fact. Then run it on three cases: a hospital ICU triage
  protocol that says it doesn''t intend the death of the patients it deprioritizes;
  a self-driving car that swerves toward a motorcyclist to avoid a minibus of schoolchildren;
  and a public-health official who says lockdowns foresee suicides and businesses
  failing but don''t intend them. Make the procedure honest about where it is likely
  to misfire — for example when the agent is a committee or an algorithm that doesn''t
