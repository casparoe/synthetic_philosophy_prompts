  ---


  I''m a journalist who covers ideas at the intersection of politics, economics, and
  technology, and for years I''ve been reporting on the movement that asks whether
  private cities, charter cities, and seasteading can let people genuinely opt out
  of states. The debate puzzles me because it seems stuck in a way that ordinary empirical
  debates are not. The exit advocates argue that states are just service providers
  with unusually bad terms of service; that special economic zones are natural experiments
  showing that jurisdiction-level competition changes governance; and that a private
  city or seastead should be judged against the actually existing states it would
  compete with, not against an imaginary standard of full sovereignty. The critics
  reply that every charter city and seastead is ultimately a delegation of power by
  a territorial state that remains the guarantor of the arrangement; that the host
  state can revoke the delegation whenever it wants; and that what is marketed as
  exit is really regulatory arbitrage that lets mobile capital shop among rules while
  ordinary citizens remain stuck inside the same sovereign order.


  What is strange to me is that both sides invoke the same handful of examples — Shenzhen,
  Dubai''s free zones, colonial Hong Kong, flags of convenience in shipping — and
  each side reads them as obviously supporting its own conclusion. After watching
  this standoff, I''ve formed a working hypothesis, which I want tested rather than
  confirmed. My hypothesis is that "opt out of the state" is doing at least two different
  jobs for the two camps: one side means exit from a particular jurisdiction''s rules
  while remaining inside some enforceable legal order, and the other side means exit
  from rule itself, so the fight is secretly about whether legitimate political authority
  requires ongoing consent or only the ability to leave. But it might equally be a
  hidden dispute about what would count as evidence for a successful private city,
  or about whose baseline assumptions — about sovereignty, coercion, and legal validity
  — get to set the burden of proof.


  I want a diagnosis rather than a verdict or a survey of positions. What kind of
  disagreement has this actually become? Decompose it: which components are verbal,
  which are normative bedrock that reasonable people can reject, which are empirical
  hypotheses that could in principle be settled but in practice never are, and which
  are different questions mistaken for one question? Then tell me, given the diagnosis,
  what would count as real progress — a distinction, an institutional experiment,
  an empirical test, a formal result, a reformulated question — or, if the honest
  answer is that the disagreement should not be expected to move, why that is. Please
  write the answer in American English.


