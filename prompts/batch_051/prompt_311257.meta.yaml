  Argument:

  (1) Practical reason issues verdicts from a point of view: a principle is a requirement
  of practical reason only if it is binding on every rational agent.

  (2) Rational egoism: each agent is rationally required to maximize her own good.

  (3) Rational benevolence: each agent is rationally required to maximize the good
  of all.

  (4) There are situations where maximizing one''s own good conflicts with maximizing
  the good of all (e.g., a small sacrifice to prevent a much larger loss to others).

  (5) In those situations, the two principles require incompatible acts, so the agent
  is subject to a contradiction of requirements.

  (6) But practical reason cannot contain contradictory requirements, because no act
  could be in accordance with reason in such a situation.

  (7) Therefore at least one of the two principles is not a requirement of practical
  reason; so Sidgwick''s dualism is untenable.

