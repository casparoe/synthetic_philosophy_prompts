  — varying parameters such as tempo, medium, scale, tone, or perspective — and that
  the most interesting new work happens when someone systematically explores a space
  of variations, occasionally discovering that one of the knobs was more consequential
  than anyone thought, or that two variations can be combined into something that
  feels genuinely new. In other words, even striking originality is usually a variation
  on a theme, not a bolt from nowhere.


