  history (e.g., seeing the actual brushstrokes, the actual document signed). The
  procedure should decide: for which objects is a facsimile acceptable as a display
  substitute, when must the label clearly state it''s a reproduction, and when would
  even a labelled facsimile be the wrong thing to show.


