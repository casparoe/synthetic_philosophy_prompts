  Key ideas in aesthetics on this topic:

  - Nelson Goodman''s autographic/allographic distinction: in autographic arts (painting,
  sculpture), the history of production matters and even a perfect copy is a different
  work; in allographic arts (music, literature), notation defines the work and any
  correct performance/instance is an instance of the work.

  - The "perfect fake" thought experiment: if a copy is perceptually indistinguishable,
  why does it matter that it''s not the original? Value might be in the history of
  production, the "aura" (Walter Benjamin), the achievement, originality (Dutton).

  - Alfred Lessing''s "The Perfect Forgery" argues the aesthetic value of a forgery
  is diminished because it is not original — it''s a critique against pure formalist
  views.

  - Savile, Sagoff etc.

  - The moral wrong of forgery: deception about provenance. Once disclosed, a fake
  can still be aesthetically/educationally valuable — so display isn''t wrong if honest.

  - The value of originals: historical witness (the object was there), rarity, auratic,
  contact with the past.


