  Potential final:


  "I am a doctoral student in theology, working on the reception of apocalyptic and
  wisdom texts, and I have settled into a reading habit that I am no longer sure I
  can defend. When a scholarly or popular interpretation of a numerical passage turns
  on the symbolic meaning of a number, I assign it a rough initial credibility, then
  discount it further for every step of arithmetical or letter-number manipulation
  the interpretation requires in order to reach its conclusion. A reading that treats
  forty or seven or twelve as a conventional round or sacred number I evaluate as
  I would any other claim about the text. But once the argument begins adding digits,
  multiplying counts by other counts, finding sums across unconnected verses, or converting
  names into numbers and back, my inclination is to disregard the result unless exactly
  the same point can be made without the number. In practice this means I am highly
  sympathetic to readings that connect the number seven to completeness, and almost
  entirely dismissive of readings that derive a precise date from, say, the one hundred
  and forty-four thousand of the Apocalypse or the one hundred and fifty-three fish
  in the final chapter of John.


  A colleague in my department thinks this is simply sound epistemic hygiene: the
  space of possible numerical patterns is very large, the constraints on what counts
  as a match are loose, and most of these constructions are unfalsifiable, so a steep
  prior against them is warranted. A statistician friend puts it differently. She
  says my worry is really about multiple comparisons and degrees of freedom, but that
  my discount schedule is arbitrary, and that the question of whether a numerical
  pattern is evidence rather than coincidence cannot be settled by a blanket rule:
  it depends on whether the interpretive procedure could have been specified in advance,
  whether the underlying convention is independently attested in the culture, and
  whether the resulting reading earns its keep by explaining features of the text
  that would otherwise look unmotivated. I can see some force in both replies.


  I would like to know whether my habit is defensible in something like its present
  form. Is a graded discount against increasingly elaborate numerical interpretation
  a reasonable epistemic policy for a scholar who cannot pursue every numerological
  claim to the ground, or is it a bias dressed up as method? If it is defensible,
  is there any principled way to set the discount, or at least to state the conditions
  under which an elaborate numerical reading should be taken seriously despite my
  standing against it?"


