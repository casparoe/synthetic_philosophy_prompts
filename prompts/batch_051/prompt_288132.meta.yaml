  describe themselves. A compliance officer signs off on every decision and wants
  the reasoning documented.


  We have been burned twice in ways that I now suspect are the same phenomenon. When
  we started using one label, patients formed online support communities around it,
  and within two years the presenting picture changed so much that our own criteria
  were picking out a different clinical group from the one we approved. With another
  label, prevalence rose tenfold without any evidence that the underlying condition
  had become more common, and I believe the classification itself was doing some of
  the work of producing the cases.


  I have read enough to know the philosophy: Ian Hacking''s looping effect. Classifications
  of people are interactive kinds, not indifferent kinds. The people classified become
  aware of the classification, respond to it, and that response changes the kind itself,
  so the classification has to be revised, which sets off another loop. I don''t want
  a summary of the idea; I want it turned into a procedure my committee can run.


  Write a reusable decision procedure, grounded in the looping effect, that we can
  use (1) in the quarterly meeting to approve, reject, or conditionally approve a
  proposed diagnostic label, and (2) in the annual audit to decide whether an existing
  label should be flagged in our records as unstable, reworded, or retired. The committee
  is not philosophically literate, so the procedure must carry the theory in its steps
  and observable tests; it cannot ask them to distinguish, say, indifference from
  interactivity in the abstract, but must give them concrete indicators.


  The procedure should include:

  - a pre-adoption screen, run before any vote, that forces the committee to predict
  how patients, families, clinicians, schools, payers, and online communities will
  respond to the label and whether those responses will stabilize or destabilize the
  category;

  - a post-adoption monitoring schedule built around observable signs that the classification
  is changing the people classified rather than merely tracking an underlying condition,
  with the distinction written as tests the committee can apply;

  - an annual audit checklist for existing labels, including tests that separate better
  recognition (more people correctly receiving a label that always fit) from looping
  (the label altering the phenomena, the population, or the prototype);

  - explicit handling of the hard cases a simple checklist will misfire on — for example,
  a label that is unstable but therapeutically useful, or a patient community whose
  identity around a label is both clinically complicating and genuinely supportive;

  - a clear statement, after each recommended decision, of which remaining point requires
  a judgment call by a clinician and cannot be turned into a rule.


  Give three worked applications: one for a proposed new label (use something like
  the prolonged grief controversy), one for an existing label whose presentations
  have visibly changed since the label became widely available, and one where the
  procedure yields a recommendation the committee will not like. Finish by saying
  plainly what the procedure cannot do — what kinds of questions it cannot settle
  and where we should refuse to pretend the looping effect has been tamed."


