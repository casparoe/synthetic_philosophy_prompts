  Ian Hacking, "The Looping Effects of Human Kinds" (1995), historical ontology. Key
  ideas:

  - Natural kinds vs human kinds (interactive kinds). Human kinds are classifications
  that interact with the people classified.

  - "Looping effect": classifying people changes them; they become aware of being
  so classified, and change their behavior, self-conception, and institutions, which
  in turn requires the classification itself to be modified. The loop can be repeated.

  - Example: multiple personality disorder (now dissociative identity disorder). Once
  the category existed, clinicians and patients co-created new presentations; the
  disorder "spread" and changed form. Another example: autism, hyperactivity, homosexuality
  (removed from DSM), etc.

  - Distinguish "indifferent kinds" (things don''t care how they''re classified) vs
  "interactive kinds" (people respond to classifications).

  - The "looping effect" can be benign or malignant; some loops are "boomerang effects"?
  Not necessary.

  - Hacking distinguishes "making up people": counting, classifying, and how being
  classified affects the classified. He''s interested in "historical ontology."

  - Related: "reactivity" in social science (Campbell''s law, Goodhart''s law); "classification
  that changes the classified."

  - Concepts: "self-fulfilling" vs "self-defeating" classifications? In social science,
  "looping" can change the prevalence or content of the category.

  - Hacking''s model: a classification "M" is applied to people; through "engines
  of discovery" (institutions, experts) and "engines of looping," the classified respond,
  sometimes deliberately ("resistance"), changing the kind.


