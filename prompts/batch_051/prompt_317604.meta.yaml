  Argument version:


  (1) An epistemic backstop for a kind of evidence is a feature that lets it settle
  factual disagreements when other evidence conflicts, because it is very hard to
  fabricate.


  (2) For audiovisual recordings, the backstop is the assumption that recording technology
  transduces light and sound from an actual scene in a way that is hard to fake by
  non-recording means.


  (3) A mature deepfake technology makes it possible to produce an audiovisual recording
  that is, by ordinary inspection, indistinguishable from a genuine recording of an
  event that never occurred.


  (4) Once such recordings are cheap and undetectable, no particular recording can
  function as a backstop: for any recording offered as evidence, it is possible, and
  on many contested occasions plausible, that it is a complete fabrication.


  (5) A backstop, however, need not be any particular recording; it could be the wider
  practice of provenance, chain of custody, metadata authentication, and the background
  conditions under which recordings are made and stored. But each of those, if digital,
  is also generated by software and is in principle forgeable; and if analog, it is
  sparse and itself defeasible.


  (6) What cannot be forged is not any token evidence but the coherence of the total
  evidential practice: many independent records from differently motivated parties
  across time. Yet if each token can be forged in a way that is indistinguishable,
  then an adversary can, at least in principle, forge the entire coherent set, and
  the coherence of the set adds no evidence beyond the forgeability of its parts.


  (7) Therefore, in a mature-deepfake world, there is no epistemic backstop for disputed
