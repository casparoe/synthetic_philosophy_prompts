  I''ve come to hold the view that this whole ''mixing your labour'' story can''t
  do the work people want it to do for intellectual property. My thought is: physical
  appropriation removes something from the common stock and leaves less for others,
  but when someone creates a song, a proof, a chemical formula, or even just a recipe,
  the idea still can be used by everyone without being used up. So the labor-mixing
  story either proves too much or too little — it gives me property in my acorns,
  sure, but it doesn''t explain why anyone should own the pattern of the words or
  the melody. I also feel like Locke''s examples all involve adding labor to a pre-existing
  bit of matter, whereas an idea isn''t really ''removed out of the state nature left
  it in.'' I''ve been defending this in seminar, but I want to stress-test it before
