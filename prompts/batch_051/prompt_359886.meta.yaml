  Three (or four) views:


  Frequentism:

  - Objective: probability is a feature of the world (the sequence/collective).

  - Probability attaches to repeatable events/sequences (finite or infinite, actual
  or hypothetical).

  - Single-case probabilities are either meaningless or derivative (the single case
  is assigned the frequency of its reference class).

  - Correct probability is unique given the reference class; but reference class choice
  problem.

  - Deterministic world: long-run frequencies still exist, so probabilities can be
  objective even in deterministic setups (frequencies of outcomes).

  - No probabilities for hypotheses/theories (except via error rates maybe).


  Subjectivism (personalism/Bayesian):

  - Probabilities are degrees of belief/credences of an agent.

  - Can attach to any proposition, including single events and hypotheses.

  - Rational constraint: coherence (obey probability axioms, avoid Dutch books); not
  uniqueness — rational agents with same evidence can differ.

  - Probability statements are not made true by the world; they describe the agent.

  - Tension: calibration to objective frequencies; betting behavior as operationalization.


  Propensity:

  - Objective: probabilities are real physical tendencies/dispositions of a chance
  setup to produce outcomes.

  - Single-case: yes, a particular toss of this coin has a probability.

  - Grounded in physical setup, not in sequences or beliefs.

  - Deterministic world: no genuine propensities (unless probabilistic laws are fundamental
  or non-fundamental? Actually propensity requires indeterminism in the setup; a deterministic
  coin toss might have no propensity, though some argue propensities can exist at
  higher levels).

  - Hypotheses: not directly; a hypothesis doesn''t have a propensity.

  - Problems: the propensity itself is a disposition whose manifestation is described
  probabilistically (circularity); vague/unspecified; how do we know propensities
  except through frequencies (Humphreys'' paradox maybe too niche).


  Logical/evidential (Keynes, Carnap, logical Bayesianism):

  - Objective but epistemic: probability is a logical relation of partial entailment
  between evidence and hypothesis.

  - Single-case and hypotheses fine.

  - Unique: given the same evidence, there''s a unique degree of support (at least
  in principle).

  - Problem: no agreed-upon unique confirmation function (Carnap''s continuum); infinite/unknown
  logical relations.


