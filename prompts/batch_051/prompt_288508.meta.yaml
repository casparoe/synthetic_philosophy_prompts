  Benatar''s asymmetry: the absence of pain is good (even if no one exists to enjoy
  it), while the absence of pleasure is not bad (unless someone exists to be deprived).
  So existence entails net harm because pains (bad) and pleasures (good) vs nonexistence
  entails absence of pain (good) and absence of pleasure (not bad). Coming into existence
  is always a harm. This asymmetry can be used to justify antinatalism.


