  Let me flesh out the content to be in-the-weeds.


  Mirror therapy: A patient with a phantom limb places the intact limb in front of
  a mirror positioned to hide the residual/amputated side, so the reflection of the
  intact limb appears where the missing limb should be. The patient performs movements
  with the intact limb while watching the mirror; the visual feedback of the "phantom"
  moving often reduces phantom pain and can even "move" a cramped phantom limb. Ramachandran
  popularized this. The question: What view of the body does this practice presuppose?


  Merleau-Ponty: the lived body (corps vécu), body schema, motor intentionality. Phantom
  limb: Merleau-Ponty discusses it in Phenomenology of Perception. He argues the phantom
  limb can''t be explained by either purely physiological (nerve endings) or purely
  psychological (memory/refusal of loss) accounts; it''s a phenomenon of the body
  schema, a habitual layer of the lived body that retains an "anonymous" or pre-personal
  grip on the world. The body schema is a system of motor and practical "I can" powers;
  the phantom persists because the body retains the practical field that included
  the limb. Mirror therapy seems to presuppose that the body image/schema is plastic
  and can be revised by visual and motor experience — that the body is not a fixed
  anatomical map but a lived, project-oriented structure that can be updated through
  action and perception. It might presuppose that pain is not a simple nociceptive
  signal but embedded in the body''s practical relation to a world.


