  the same term (for example, gene, information, or planet) carries different meaning
  in rival research programs. The editors are not bilingual in every framework, and
  we cannot gain that expertise in the time available. The stakes are high in both
  directions: rejecting a paper because it fails to translate into a reviewer''s vocabulary
  would kill work that a bilingual expert would find sound, but publishing a paper
  that genuinely contradicts a well-tested set of results would also be a failure.
