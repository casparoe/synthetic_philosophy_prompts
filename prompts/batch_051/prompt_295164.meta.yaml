  I''ve been going in circles on this ever since someone dropped Yablo''s paradox
  into an old LessWrong-style comment thread and the whole discussion moved on like
  it had settled something. The position I want you to pressure-test is the standard
  takeaway: that Yablo''s infinite sequence of sentences — each one saying that every
  later sentence is false — generates a liar-style contradiction even though no sentence
  refers to itself, and so semantic paradox doesn''t actually depend on self-reference.
  Just so we''re on the same page about the object: number the sentences S1, S2, S3,
  ... and have each Sn say: for all m greater than n, Sm is false. Assuming ordinary
  bivalence, suppose some Sn is true. Then every later sentence is false. But Sn+1
  says exactly that all sentences after it are false — which is now the case — so
  Sn+1 is true after all, contradicting the fact that Sn said it was false. So no
  Sn can be true. But then each Sn is false, and if Sn is false then the claim "all
  later sentences are false" is false, meaning some later sentence is true, which
  we just ruled out. Contradiction. I''m not contesting the derivation; the geometry
  of it is clear enough.


