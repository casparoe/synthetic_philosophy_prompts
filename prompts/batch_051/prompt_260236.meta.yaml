  ---


  My partner and I recently began IVF with preimplantation genetic testing because
  a serious monogenic condition runs in my family, and I have been unable to think
  past an asymmetry in how the two halves of the same practice are treated. Selecting
  among our embryos to avoid that condition is presented to us as responsible preventive
  medicine; almost everyone we tell approves. But the same clinic treats selecting
  among embryos for any non-disease characteristic — sex, for example, or ranking
  the possible children by their expected overall quality of life — as a different
  kind of act altogether, one it will not facilitate, and more than one friend has
  reached for the word eugenics. I am not asking for advice about what to do with
  our embryos. I am asking the prior question: is this asymmetry defensible, or does
  it rest on a distinction we cannot draw?


  The principle I keep testing this against is procreative beneficence, roughly: prospective
  parents should select, among the possible children they could have, the one expected
  to have the best life, or at least a life no worse than the alternatives, based
  on the relevant available information. That principle seems to treat selection against
  disease and selection for traits as continuous — both are choices of which possible
  child to bring about, made on the basis of expected wellbeing. If the principle
