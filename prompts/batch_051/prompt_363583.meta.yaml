  valence, no invariant general principle. E.g., pleasure from cruelty is not a reason.
  Generalist replies: Rossian principles (prima facie duties) may allow that prima
  facie reason can be outweighed but not silenced or reversed. Dancy argues that holism
  is stronger: same feature can be both reason for and against in different contexts.
  Generalists can build in "defeaters" but that leads to unmanageable complexity.
  Dancy: principles are not necessary for reasons to function; he allows "reminders"
  or "epistemic guides." The literature presses: If no principles, what distinguishes
