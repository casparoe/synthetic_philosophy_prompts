  Actually Dancy defends "particularism" as the view that the possibility of moral
  thought and judgement does not depend on the provision of a suitable supply of moral
  principles. Generalism: the possibility depends on such a supply. Dancy argues holism
  of reasons: a reason is a favorer/disfavorer only in context; features vary in polarity.
