  I''m a PhD student in philosophy working on global priorities, and I''ve been thinking
  about a funding mechanism a friend of mine who works at a mid-size foundation described.
  They''re considering replacing their program officers'' discretion with an automated
  formula based on the standard importance–tractability–neglectedness framework, but
  with a twist for tractability. I want someone to really walk through how this thing
  would behave, because I suspect the incentives get weird in ways the foundation
  hasn''t noticed.


  Here''s the proposal. The foundation gives out about $120M a year across global
  development, pandemic preparedness, and a couple of other areas. Any organization
  can apply, under whatever "cause" label it chooses—there''s no fixed taxonomy. Each
  application gets three scores, all normalized to 0–1. Importance is set every two
  years by the board for each cause label, based on an anonymous survey of fifteen
  domain experts; the board just reports the median. Neglectedness is computed as
  1 minus that cause''s share of total philanthropic spending (from public filings)
  over the previous three years. Tractability is the unusual part: at the application
  stage the applicant has to pre-register one 12-month outcome indicator, and the
  foundation runs an internal prediction market in which program staff and paid external
  reviewers trade contracts that pay out if the milestone is met. The current market
  price is the tractability score. Applicants and their organizations can''t trade,
  and neither can the evaluators who wrote the qualitative review of that applicant.
  The priority score is importance × tractability × neglectedness, and the foundation
  funds everything above whatever cutoff exactly exhausts the annual budget.


