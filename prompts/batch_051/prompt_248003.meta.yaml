  I''ve been reading Mill''s System of Logic, and his treatment of the composition
  of causes has been bugging me. He draws a sharp line between mechanical cases, where
  two causes produce a joint effect that is the sum of what each would produce separately,
  and chemical cases, where the compound has properties that are not the sum of the
  properties of the elements. Water is his recurring example: from hydrogen and oxygen
  you get a liquid, not a gas that behaves like a weighted average of the two. Mill
  seems to treat this as a fact about the world rather than a failure of reduction.


  Now vary the picture the way people sometimes vary Newcomb''s problem. Suppose we
  had a continuum of cases between purely mechanical combination and strongly chemical
  combination, controlled by a parameter that tunes how much the components constrain
  each other. At one end you get vector addition of forces, at the other you get something
  like water from hydrogen and oxygen. If the parameter changes smoothly, is Mill''s
  distinction a sharp kind-boundary or just a verbal convenience? Does anything genuinely
