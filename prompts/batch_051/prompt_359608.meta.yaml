  of will seems to me to be one of the more successful pieces of psychological theory
  around. It gives a clean mechanism: rewards are discounted by delay, but the discount
  curve is steep up close and shallow far away, so your preferences can flip depending
  on how near a temptation is. That explains why someone can sincerely plan on Sunday
  to go to the gym on Monday and then stay in bed: on Sunday the delayed benefit outweighs
  the pain, but on Monday morning the bed is right there and its comfort looms larger
  than the same calculation made from a distance. The account has real virtues: it''s
  formal, it makes predictions about preference reversals that seem to come out true,
  and it unifies procrastination, overeating, failing to save, and lots of other stuff
  under one mechanism. On this picture akrasia is not a special kind of action at
  all. What feels like acting against your own better judgment is just acting on the
  preferences you have at the time, which are not the preferences you had before;
  the old judgment didn''t get overruled, it got replaced.


