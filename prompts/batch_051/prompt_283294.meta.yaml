  "I keep returning to a passage in Dostoevsky''s The Brothers Karamazov, in the chapter
  The Grand Inquisitor, and it''s disturbing me more than I''d like. The Inquisitor,
  talking to the returned Christ, says — and I''m paraphrasing because I don''t trust
  my memory of the translation — that Christ was wrong to refuse the three temptations
  in the wilderness. The offer of bread (material security), miracle (the external
  guarantee), and authority (binding conscience to an outward order) were not temptations
  to be spurned but real answers to what human beings are actually like. The Inquisitor
  says Christ overestimated us: he treated us as if we could bear the weight of freedom
  and choose the good from love alone, but in reality most people find freedom a torment.
  Give them bread, a visible sign, and a fixed order, and they will be happy; leave
  them free, and they end up anxious, divided, and resentful, then they hand the burden
  to whoever takes it from them. The Inquisitor ends by saying the Church has corrected
  Christ’s work, out of love for the weak.


  I can see an unnervingly strong case for this as a psychological/social theory,
  and it maps onto things I already half-believe — say, the fact that people in tightly
  scripted communities often report less existential anxiety, that an excessive demand
  for autonomy can look like a demand people never asked for, and that much of what
  we call freedom gets exercised as ''defer to the default.'' But I also hold, firmly
  and not as a protocol thing but as an intuition I can''t shake, that human dignity
  requires that a person be allowed to make the wrong choice about the most important
  things. That if the Grand Inquisitor''s bargain were genuinely available, sealing
