  "Several years ago, while volunteering at a restorative justice center, I read a
  translation of Peter Abelard''s Ethics (often called Know Thyself). The passage
  that has stayed with me is near the beginning: Abelard insists that the sin is not
  in the outward act but in the consent to it, and that people who perform the same
  deed may be in completely different moral positions depending on whether and how
  they consented to it. I don''t remember the exact wording, but the idea is that
  the deed adds nothing to the guilt beyond the consent. I now help train intake workers
  at a small community accountability program. We receive referrals after incidents
  of theft, property damage, assault, harassment, and breach of trust. Before we accept
  a case, we have to decide whether it''s the kind of wrong our process can address.
  I want a reusable decision procedure, grounded in Abelard''s distinction, that my
  intake workers can apply in about 20 minutes per referral, with only the victim''s
  account, the referred person''s account, and sometimes a police report. The procedure
  should distinguish: (a) what the person consented to, (b) what they foresaw but
  did not consent to, (c) what they did from ignorance or compulsion, and (d) what
  happened beyond their awareness. It should then say how those findings change whether
  we treat the incident as a moral wrong appropriate for restorative work, a harm
  needing repair without blame, or something we refer elsewhere. For each step, say
  what counts as a sufficient answer, where the worker should stop, and where the
  decision must go to a senior facilitator because the procedure cannot settle it.
  Then run the procedure on two cases: one where a teenager breaks a window while
  trying to break into a parked car, and another where a nurse accidentally gives
  a patient the wrong medication after following a poorly labeled chart. Please flag
  honestly where Abelard''s principle, taken seriously, would tell us to treat a case
  as less blameworthy than our staff''s instincts would say, and where the principle
  is silent."


