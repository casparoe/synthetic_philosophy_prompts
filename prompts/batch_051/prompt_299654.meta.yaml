  Draft final:


  I am a third-year undergraduate in a course on historical explanation and the social
  sciences, and I have been asked to run the next seminar session. The group is about
  twenty students, and I have a single fifty-minute slot. The topic is whether history
  is "locked in": the idea that once a practice, technology, or institution gains
  an early advantage, the fact that others have adopted it becomes reason to adopt
  it in turn, so the outcome becomes self-reinforcing and may persist even when a
  better arrangement was available. The deeper question is whether the same outcomes
  would have arrived anyway if some small early detail had differed.


  I would like you to design a runnable classroom activity for me, not a lecture.
  The participants should not hear the terms "path dependence," "lock-in," or "increasing
  returns" until after the activity. The activity should be a game, role-play, or
  structured simulation with clear rules, minimal materials I can actually prepare,
  and a payoff scheme that requires no real money. The participants should generate
  a stable outcome through their own choices and only afterwards recognize how they
  got there. Ideally the game should have at least two possible stable outcomes, one
  better for everyone once reached, so that the result is not forced by the rules;
  the interesting fact should be that the worse outcome survives because no single
  player has an incentive to deviate alone.


  The activity should make three things salient before they are named: first, that
  a small early asymmetry can feed on itself because each person''s best move depends
  on what others have already done; second, that once enough people have adopted an
  option, it becomes individually costly to abandon it, so the arrangement persists
  even when everyone can see a collectively better alternative; and third, that at
  each earlier stage resistance was possible, but resisting carried a cost, and that
  cost grew as the pattern hardened. If the group size makes it feasible, build in
  two runs or two parallel groups that differ only in a small initial detail, so that
  the debrief can ask whether the same outcome arrived anyway.


  The debrief should do the following. It should map specific moments of the activity
  onto the three points above, show where each step could have been resisted and what
  it would have cost, and then separate two claims the game might seem to support:
  that the outcome was contingent in its early stages, and that the outcome was entrenched
  once underway. It should also be explicit about what a classroom game cannot reproduce—above
  all, that real history is not rerunnable, and that whatever happened in the game
  happened because we wrote the payoff rules, so the facilitator must supply the argument
  connecting the game to actual historical processes. Finally, tell me what will predictably
  go wrong the first time I run it—for instance, the players coordinate immediately
  on the better outcome and no lock-in appears, or the payoff scheme is too weak to
  create self-reinforcement, or one student starts negotiating and turns it into a
  committee meeting. For each likely failure, say how I should adjust the rules or
  handle it in the moment.


