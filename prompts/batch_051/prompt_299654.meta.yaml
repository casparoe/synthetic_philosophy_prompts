  Path dependence in social science: outcomes are path-dependent when the probability
  of an outcome depends on the sequence of prior states, not just on current conditions.
  Distinctions:

  - first-degree path dependence: sensitivity to initial conditions but no inefficiency
  (e.g., language adoption).

  - second-degree: lock-in to an inefficient outcome given available information at
  the time (e.g., QWERTY).

  - third-degree: suboptimal outcome that would have been avoided with foresight (Page''s
  typology, 2006). Hmm, might be niche. The prompt might mention the distinction only
  if useful, but as the asker I can ask for a debrief that distinguishes "mere butterfly
  effects" from "lock-in that persists despite pressure." But maybe too niche. I can
  phrase simply.


