  I get the modern resolution in terms of information erasure: steps as I understand
  them: (1) The demon has to make measurements to know when to open the door. (2)
  Each measurement couples the demon''s memory to the molecule''s state, and at that
  stage no net entropy increase in the gas-plus-demon system is yet forced, because
  the measurement can be done reversibly in principle. (3) But to keep operating,
  the demon must either have unbounded memory or periodically erase its records. (4)
  Unbounded memory is not a physical option for a finite demon in a truly cyclic process.
  (5) Erasing a bit from a physical memory at temperature T costs at least kT ln 2
  of heat dumped into the environment. (6) That heat raises environmental entropy
  by at least kT ln 2 / T per bit, which is exactly enough to compensate for the entropy
  decrease the demon produced in the gas. (7) So the second law survives when you
  include the demon''s information-processing as physical.


