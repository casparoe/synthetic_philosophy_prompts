  "Was rereading Maxwell''s Theory of Heat and got stuck on the demon passage. He
  asks us to imagine a being whose senses are fine enough to track every molecule
  in a gas, who sits at a frictionless door between two chambers and opens/closes
  it so that fast molecules are allowed to pass only one way and slow ones only the
