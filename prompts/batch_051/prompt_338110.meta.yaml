  Before I take a position on Stephen Wolfram''s project in A New Kind of Science,
  I want to decide what would have to be true for it to count as science rather than
  as mathematics, computer experimentation, or metaphysics. I will fix the standard
  first. A body of work counts as science only if it meets these five requirements:


  (1) Empirical testability. It must make claims that some possible observation could
  count against; a claim compatible with every outcome says nothing empirical.

  (2) Predictive content. It must yield checkable predictions about some concrete
  phenomenon, at least some of which go beyond what was already known before the claim
  was made.

  (3) Explanatory integration. It must explain regularities by connecting them to
  an underlying mechanism or principle, not merely simulate, reproduce, or exhibit
  them.

  (4) Heuristic fertility. It must generate new questions, methods, or phenomena that
  the prior framework did not make salient.

  (5) Disciplined rigor. Its central results must survive independent implementation
  and must not flatly conflict with well-confirmed results where the two overlap.


  Now the borderline case. The core activity of Wolfram''s book is the systematic
  enumeration of simple computational rules, especially one-dimensional cellular automata:
  rules that update each cell''s state from its neighboring cells'' states according
  to a fixed local prescription. Wolfram claims that such rules fall into a small
  number of qualitative behavioral classes, and that rules with extremely simple specifications
  — his Rule 30 is the canonical example — can produce output of indefinitely continuing
  complexity whose statistics make it practically indistinguishable from randomness.
  He generalizes this into the principle of computational equivalence: roughly, that
  almost all processes that are not obviously simple are computationally equivalent,
  so that any system whose behavior is not trivial is performing a computation as
  sophisticated as any other. A companion idea is computational irreducibility: for
  many such systems, the only way to know their future state is to run the system
  itself, because no shortcut predicts it faster. From these ideas Wolfram argues
  that natural forms such as snowflake growth, biological pigmentation patterns, and
  aspects of turbulent flow are best understood as the output of simple underlying
  programs, and that traditional mathematics and science have missed most of the space
  of possible rules because that space could not be explored by hand.


  The work is contested exactly because it straddles boundaries: it contains substantial
  mathematics and reproducible computer experiments, yet its most general theses make
  few quantitative predictions and appear to be defended less by testing against data
  than by derivation from the principle of computational equivalence.


  Apply each of the five requirements to this case, using the description above as
  the version of Wolfram''s project to be judged. Where a requirement gives no clean
  verdict, say whether the difficulty lies in the requirement, in the project as developed
