  "Before I decide what to make of Stephen Wolfram''s project in A New Kind of Science,
  I want to settle a prior question: by what standards is it science, and does it
  meet them? I propose five working criteria for counting a body of work as science
  rather than as mathematics, computer experimentation, or metaphysics. (1) Empirical
  testability: it must make claims that some possible observation would count against,
  not claims consistent with everything. (2) Predictive content: it must yield checkable
  predictions about some phenomenon, at least some of which go beyond what was already
  known. (3) Explanatory integration: it must explain regularities by connecting them
  to an underlying mechanism or principle, rather than merely reproducing or simulating
  them. (4) Heuristic fertility: it must generate new questions, methods, or phenomena
  that the prior framework did not make visible. (5) Disciplined rigor: its central
  results must survive independent implementation and must not conflict with well-confirmed
  results where the two overlap.


  Now the case. A central activity of Wolfram''s book is the exhaustive exploration
  of simple programs, especially one-dimensional cellular automata: rules that update
  each cell''s state from its neighbors'' states according to a fixed local rule.
  Wolfram''s organizing claim is that the behavior of such rules falls into a small
  number of qualitative classes, and that even rules with extremely simple specifications
  — his Rule 30 is the standard illustration — can generate output that is indefinitely
  complex and in practice indistinguishable in its statistics from random. From this
  he generalizes to the principle of computational equivalence: roughly, that almost
  all processes that are not obviously simple achieve the same maximal level of computational
  sophistication, so that a system showing any nontrivial behavior is, in effect,
  doing a computation as complex as any other. A companion claim is computational
  irreducibility: for many such systems, no shortcut exists to predict the outcome
  except running the system itself. Wolfram argues from these ideas that many natural
  forms — snowflakes, biological pigmentation, turbulent flow — are best understood
  as the output of simple underlying programs, and that traditional science and mathematics
  have systematically ignored most of the space of possible rules because they could
  not be analyzed by hand.


  Whether this is science has been contested. The work contains genuine mathematics
  and reproducible computer experiments, but its strongest theses are general, appear
  to make few quantitative predictions, and are often presented as consequences of
  the principle of computational equivalence rather than as hypotheses tested against
  data.


