  The summary could read:


  "Here''s the setup: a fair coin is flipped. If it''s heads, Sleeping Beauty is woken
  once, on Monday; if tails, she''s woken twice, on Monday and Tuesday, with a drug
  that erases her memory so she can''t tell the days apart. The question is what she
