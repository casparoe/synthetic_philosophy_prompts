  the experimental setup; the halfer is saying the evidence of awakening has no probative
  value — not that she should stick with a prior because she is irrational or because
  she''s not sure about the coin''s fairness.

  2. Mischaracterizing the thirder as thinking the coin is more likely Tails because
  she is "awakened twice on Tails, so Tails is twice as likely to be the true coin
  outcome" — but that''s a count of awakenings, not coin outcomes; the subtlety is
  about centered vs uncentered worlds.

  3. Saying that halfers reject self-locating evidence altogether. Some halfers (e.g.,
  Lewis) accept centered possibilities but hold that credences about uncentered coin
  outcomes should track chances (Principal Principle), so halfers aren''t indifferent
  to self-location; they have a different theory of it.

  4. Confusing "awakenings" with "worlds" in the assignment of probabilities, and
  maybe saying that Beauty, on waking in the Tails branch, should be equally uncertain
  about Monday vs Tuesday, and then concluding that the probability of the coin state
  conditional on now being Monday must be 1/2 — which is a standard thirder premise,
  but a summary could present it as uncontroversial.

