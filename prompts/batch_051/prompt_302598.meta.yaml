  Let''s analyze:

  - "Halfers say 1/2, because the coin is fair and Beauty learns nothing when she
  wakes: she knew all along she''d be woken at least once, so waking can''t be news."
  This is mostly an accurate characterization of halfer reasoning, though the "she
  learns nothing" is disputed by thirders. Fair enough.

  - "Thirders say ... because on tails there are two awakenings and she could be in
  either, so the three possible awakenings she might currently be in are equally likely."
  This is the standard "awakenings equally likely" step. But is it fair? Thirders
  (Elga) don''t simply assume the three awakenings equally likely; they derive it
  via the two conditional principles. The summary says they say "the three possible
  awakenings are equally likely" as if that''s the premise. That''s a subtle misrepresentation:
  the thirder''s argument uses a principle about equal credence given Monday or given
  Tails to derive equal probabilities, not a brute assumption that awakenings are
  equiprobable. In fact, the equiprobability of the three centered worlds is a conclusion,
  not the starting point.

  - "The standard move for the thirder is to note that if Beauty were told it''s Monday,
  she''d go back to 1/2 on heads, and if she were told the coin came up tails, she''d
  be 50-50 between Monday and Tuesday; solving the equations then forces 1/3 on waking."
  This is Elga''s argument, accurately stated. Good.

