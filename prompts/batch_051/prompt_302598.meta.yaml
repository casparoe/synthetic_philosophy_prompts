  be woken at least once, so waking can''t be news. Thirders say her credence in heads
  should be 1/3, because on tails there are two awakenings and she could be in either,
  so the three possible awakenings she might currently be in are equally likely. The
  standard move for the thirder is to note that if Beauty were told it''s Monday,
  she''d go back to 1/2 on heads, and if she were told the coin came up tails, she''d
  be 50-50 between Monday and Tuesday; solving the equations then forces 1/3 on waking.
  Halfers reply that the thirder is confusing a fair coin with a fair lottery over
  awakenings: just because she''s asked her credence twice on tails doesn''t make
  tails twice as likely to have occurred. The thirder, they say, has abandoned conditionalization."


