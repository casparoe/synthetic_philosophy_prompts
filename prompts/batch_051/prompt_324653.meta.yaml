  Key nuances in standing to blame:

  - Standing is usually distinguished from the aptness/warrant of the blame — whether
  target is blameworthy. Hypocrisy might undermine standing, not the truth of the
  charge.

  - There are different sources of lack of standing: complicity in the wrong (you
  can''t blame someone for what you enabled), hypocrisy (you don''t accept the norm
  for yourself/purport to be above it), meddling (not your business maybe doesn''t
  undermine? Actually "meddling" is sometimes a standing concern: no relationship).
  Also "the Dirty Hands" "casting the first stone".

  - Tu quoque fallacy: the fact that the accuser is guilty doesn''t prove the accused
  isn''t guilty. But there''s a non-fallacious version: if the accuser''s practice
  shows the norm isn''t really accepted/feasible, that may support an inconsistency
  objection or expose that the "rule" is not genuinely shared. Actually the tu quoque
  in argumentation is ad hominem; but in interpersonal blame, blame is a relationship.
  The second person might reasonably complain not about the content but the critic''s
  right.

  - Some philosophers (e.g., Macalester Bell, Justin Tosi & Brandon Warmke) argue
  standing is "in virtue of": you can stand to blame only if... Tosi & Warmke: standing
  conditions — complicity, hypocrisy, meddling. Others (e.g., Patrick Todd? Maybe
  "standing" as a pro tanto.) Some argue hypocrisy doesn''t affect aptness but affects
  propriety of interpersonal blame; maybe blame is like a two-way relation. There
  is also the idea of "second-personal reasons" à la Darwall: demands from someone
  with representative authority. A hypocrite may still have moral standing? Hmm.

  - The target can respond: "Who are you to blame me?" — that''s a direct challenge
  to standing. But the critic could reply: "I can still point out your wrongdoing."
  The target may have two separate points: (1) the claim is true, but (2) the act
  of blaming is improper. So "dismissive" vs not.


