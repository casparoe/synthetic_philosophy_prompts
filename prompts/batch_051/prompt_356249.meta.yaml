  too altered for the question to get a grip. Since then I have come around to the
  anti-luminosity view, and I want to know how exposed it really is.


  The position I now hold is this: no non-trivial mental condition is luminous, where
  a condition C is luminous just in case, whenever C obtains, the subject is in a
  position to know that C obtains. And I accept the corollary that the KK principle
  fails in full generality: knowing p does not guarantee being in a position to know
  that one knows p. I was moved by the gradual-change argument: take an inexact condition
  such as feeling cold, run a subject stepwise from clearly cold to clearly not cold
  through a long series of pairwise indiscriminable cases, and notice that if the
  condition were luminous, at the last cold moment the subject would need a margin
  for error that the next, nearly identical moment cannot supply. The argument generalizes,
  and it suggests that positive introspection in standard epistemic logic is an idealization,
  not a description of actual subjects.


