  Argument:

  (1) A generalization like "Italians are warm" is true only if, for the most part,
  individual Italians are warm.

  (2) But "warm" is a property of individuals; aggregating it over millions of people
  yields at best a statistical average, not a property of a nation.

  (3) Moreover, the boundaries of a nation are historical accidents; had borders been
  drawn differently, the same individuals would be grouped under different labels,
  and the average trait would change.

  (4) So no trait can be a genuine property of a nation; "national character" is an
  artifact of how we draw maps.

  (5) Therefore all statements of the form "X people are Y" are either false or meaningless.

  (6) But by parity, statements like "this board of directors is risk-averse" or "this
  jury was lenient" would also be false, since they also aggregate individual properties
  over an accidentally bounded group. We accept those. So the argument proves too
  much.

