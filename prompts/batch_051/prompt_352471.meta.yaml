  The type is "Write the desiderata a theory in an area must meet." The asker wants:
  specification of requirements for a theory/account of the distinction between legitimate
  historical revisionism and denialism in the study of the Holocaust, the Armenian
  genocide, and the Nanjing massacre. Purpose: maybe "for a public-facing policy/education
  body deciding how to respond to problematic histories, or for a scholar planning
  a comparative project." Let''s fix purpose: "I''m developing a comparative framework
  for distinguishing responsible historical revisionism from denialism across the
  Holocaust, the Armenian genocide, and the Nanjing massacre. Before I read more theories
  or case studies, I want the specification..." That frames adequacy relative to that
  purpose.


  Requirements to include (the heart):

  1. It must give an account of what must remain fixed for a historical account to
  count as recognizing the genocide at all — the "core descriptive commitments" (that
  a systematic campaign of mass killing targeting a defined group occurred, state-directed
  or state-tolerated, with intent). Case: each denialist position disputes different
  elements; the theory must say which elements are load-bearing. Nagivation: denialism
  often accepts deaths but denies intent, or accepts massacres but denies systematicity.

  2. It must be method-sensitive, not merely conclusion-sensitive: distinguish revisionism
  that changes factual claims through standard evidentiary practices (new archives,
  demographic analysis) vs. denialism that applies standards asymmetrically, begins
  from a predetermined conclusion, demands impossible proof standards (e.g., "show
  me Hitler''s written order"), or dismisses perpetrator testimony wholesale while
  relying on implausible alternatives.

  3. It must make room for legitimate revisions that lower casualty estimates or redistribute
  responsibility among perpetrators, while explaining why not every quantified correction
  is revisionism in the domesticating sense. Need cases: revisionist lowering of death
  toll vs. negationist claim that "mass deaths were disease or wartime privation."
  Distinction must not simply track whether conclusions are disturbing.

  4. It must explain the characteristic asymmetry of denialism: treating the same
  kind of evidence (eyewitness testimony, documents, physical evidence) as decisive
  when it supports the denial position and fabricated when it supports the standard
  account. That''s a methodological defect rather than content.

  5. It must account for the practical/moral-political dimension without reducing
  the distinction to politics: denialism is not just an epistemically bad historiography
  but typically a partisan practice (state-sponsored, tied to nationalist legitimation,
  deployed to prevent accountability or justify suppression). Requirement: adequate
  account should say whether "denialism" is purely epistemic category or partly political/ethical,
  and what follows if purely epistemic — could a denialist be epistemically responsible?
  (Maybe the theory should not require identifying subjective intent? negotiate.)

  6. It must handle the spectrum and boundary cases: accepting mass killings but rejecting
  the term "genocide"; accepting the events but normalizing them as ordinary wartime
  violence; denying that the group was targeted "as such"; denying the existence of
  an organized plan; "notes of doubt" about chemical technology (gas chambers) while
  accepting shootings. The theory should say which of these is revisionism vs. denialism
  and why.

  7. It must respect differences across cases: Holocaust (industrialized extermination,
  abundant documentation, denial is fringe in West but proliferates online), Armenian
  genocide (archival Ottoman/Turkish state records, Turkish state denial, geopolitical
  euphemisms, ambiguity of "relocation" under wartime conditions), Nanjing (atrocity
  of mass rape and killing in weeks, Chinese/Japanese nationalist stakes, disputes
  over the numbers 200,000 vs 300,000 vs "hundreds of thousands"). The account shouldn''t
  collapse the structures. Small LLMs know these basic facts; the prompt can mention
  numbers in broad terms ("estimates vary") to avoid specific factual claims. Better
  not assert precise numbers: say "figures in the historiographical debate range over
  orders of magnitude." Actually Nanjing numbers are contested: the Tokyo trials cite
  200,000? International Military Tribunal for the Far East estimate; the controversy
  is precisely about numbers. For safety, I should avoid exact figures or attribute
  them. The prompt can say "disputes over numbers, including whether the very breadth
  of estimates is evidence of denialist inflation/deflation." Keep general.

  8. It must specify whether denialism requires insincerity/bad faith or can be structural
  or self-deceived — "sincere denial" problem. A theory that requires deceptive intent
  will fail cases where actors genuinely believe. Need requirement: the account should
  focus on the structure of the practice (methods, asymmetries, consequence) rather
  than speculation about private mental states. This is a sophisticated point.

  9. Possible joint unsatisfiability: an account that is both purely epistemic (non-moralized)
  and fully tracks the public/political category may not exist; if we require "research
  freedom" (no conclusion is off-limits) and "accurate identification of denialism"
  (some conclusions signal denialism), the two constraints pull apart. Flag that.

  10. Optionally score: epistemic criteria (asymmetry, method), moral-political criteria
  (intent to rehabilitate, political function), and "core commitment" views, against
  the list; which requirement does the most to exclude candidates. Perhaps briefly
  score: conclusion-based (fragile), method-asymmetry criterion (strong but may over-include
  sloppy work), political-intent criterion (weak on self-deceived), etc.


