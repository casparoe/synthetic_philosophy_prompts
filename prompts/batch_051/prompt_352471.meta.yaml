  Prompt text:


  "I am developing a framework for distinguishing responsible historical revisionism
  from denialism, to be applied across the Holocaust, the Armenian genocide, and the
  Nanjing massacre. Before I read any more case studies or competing definitions,
  I want the desiderata that an adequate account of this distinction must meet. My
  working purpose is not legal, but institutional and scholarly: a public history
  body deciding which challenges to the received record deserve engagement as revisionist
  scholarship, which should be rebutted as denialism, and which are genuinely indeterminate
  boundary cases.


  Give me the full specification. For each requirement, say what case or consideration
  forces it, and whether it is non-negotiable or a preference of one camp (for example,
  the camp that wants the distinction drawn in purely epistemic terms versus the camp
  that treats denialism as partly a political practice). In particular, the list must:


  - explain which elements of the historical record are load-bearing, such that denying
  or most-scale-defeating them turns revision into denial, while revising them in
  the light of new evidence does not;

  - respect the difference between revising conclusions through ordinary evidential
  practice (new archives, demographic recalibration, redistribution of responsibility
  among perpetrators) and applying evidential standards asymmetrically — demanding
  conclusive proof of the received view while accepting weaker evidence for the challenge,
  dismissing perpetrator testimony wholesale while crediting alternative accounts,
  or treating the same kind of source as decisive when it helps one side and fabricated
  when it helps the other;

  - leave room for legitimate revisions that sober the picture — lower casualty estimates,
  complicate narratives of top-down command, reduce the role of some institutions
  — without treating every numerical correction as denialism;

  - handle the familiar boundary obfuscations: accepting mass killing but denying
  the group was targeted as such; accepting deaths but attributing them to disease,
  wartime privation, or ordinary national security measures; accepting shootings but
  denying an organized plan; admitting that atrocities occurred while rejecting the
  term genocide; and professing open-minded doubt about specific mechanisms while
  conceding the rest;

  - say what, if anything, a requirement of subjective bad faith or deceptive intent
  contributes. I am suspicious of definitions that require us to read minds; I want
  to know whether denialism can be sincere or self-deceived, and whether the account
  can rest on the structure of the practice — its methods, asymmetries, and political
  functions — rather than on private mental states;

  - accommodate the different shapes the contest takes in the three cases without
  collapsing them into one model: a highly documented industrialized extermination
  whose denial is marginal within academia but persistent in organized extra-academic
  campaigns; a state-sponsored silence under which the very term genocide is disputed
  and episodes are redescribed as wartime relocations; and an atrocity whose scale
  is fought over partly through numbers, where narrowing or widening the interval
  of estimates carries nationalist stakes.


  Then, briefly, score the main available moves against the list — conclusion-based
  definitions, methodological-asymmetry accounts, political-intent or function accounts,
  and any account that tries to keep the category purely epistemic — and tell me which
  single requirement does the most to exclude the most popular candidates. Finally,
  flag any subset of the desiderata you suspect cannot be jointly satisfied as stated
  (for instance, if the category must be both epistemically pure and also track the
  public/political way the term is actually used, say whether those two requirements
  are jointly satisfiable). The part I most want to see is the reasoning about which
  requirements are genuine and which are just one camp''s prejudice."


