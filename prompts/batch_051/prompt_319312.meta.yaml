  Let me think about the theory distinction. Hindsight bias: individual cognitive
  bias — knowing the outcome increases the perceived ex ante predictability of that
  outcome; people misremember their earlier probability estimates; they judge that
  "it was obvious." Narrative fallacy: a property of explanations/accounts — preference
  for smooth, causally coherent stories over messy, probabilistic, conjunctive, or
  statistical explanations; selection of facts that fit a plot; compression of uncertainty,
  agency, and chance into a tidy sequence. The two can interact: known outcome gives
  the narrative its endpoint and makes the plot look inevitable; narrative fallacy
  gives hindsight bias something to do. But they are distinct: narrative fallacy can
  operate prospectively (people build stories about the future, e.g., "it''s different
  this time" or inevitable wars?), and hindsight bias can operate without narrative
  (a simple probability judgment distorted). The Cuban Missile Crisis as a "model"
