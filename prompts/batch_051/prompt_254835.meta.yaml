  (God could command lying and then lying would be good), and makes "God is just"
  empty. Ash''arite response: God''s essence includes wisdom; He doesn''t lie not
  because lying is independently wrong but because His nature/will is not to lie —
  hmm, actually Ash''arites say God can do all things; some say "God is not under
