  Background (from my knowledge):


  - The Mu''tazila were rationalist theologians in Islam (8th–10th c), who held that
  ethical values like justice and injustice are objective and knowable by human reason,
  and God''s commands accord with these objective standards. They held God does not
  command evil; God is just/wise because He acts in accordance with objective good.
  This is analogous to the Euthyphro "the pious is loved because it is pious" (independent
  standard).


  - The Ash''arites (after Abu al-Hasan al-Ash''ari, d. 936) held that good and evil
  are whatever God commands and forbids; there is no independent standard of good/evil
  to which God''s commands must conform. What is just is just because God wills/commands
  it. This is analogous to theological voluntarism/divine command theory: "the pious
  is pious because it is loved by the gods." Ash''arites reject that human reason
  can know moral truths independently of revelation; they emphasize God''s absolute
  sovereignty and will; if God punished the obedient and rewarded the disobedient,
  that would be just simply because He did it. They may allow reason to know some
  things but moral value is determined by God''s command.


