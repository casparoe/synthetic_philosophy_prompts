  Canonical BHW setup (I''ll describe without naming maybe): A sequence of agents
  decides in order whether to adopt or reject a project. The project is either good
  or bad with equal prior probability. Each agent receives a conditionally independent
  private signal: with probability p > 1/2 the signal is correct (H signal if good,
  L signal if bad), and with probability 1−p it is incorrect. Agents observe all previous
  decisions but not previous agents'' private signals. Payoffs: +1 for adopting a
  good project, −1 for adopting a bad project, 0 for rejecting regardless. (That''s
  the classic "adopt/reject" cascade.) In equilibrium, an agent adopts if the posterior
  probability that the project is good, given the public history and her private signal,
  exceeds 1/2; rejects if below; ties can be broken either way. The standard result:
  after two consecutive identical decisions (adopt, adopt or reject, reject), a cascade
  starts — all later agents rationally ignore their private signals and imitate.


  Now the variation: suppose the private signals are not conditionally independent.
  Instead, there is a common shock: with probability q, every agent in the sequence
  receives the same signal, drawn according to the same signal technology (correct
  with probability p); with probability 1−q, each agent''s signal is drawn independently
  as in the original model. Agents know p and q and the structure, but they do not
  know whether the common shock occurred or what the common signal was. (Maybe "the
  shock" occurs once for the entire sequence, or independently for each pair? Need
  to decide.) Let''s say: before any decisions, nature draws a common component; with
  probability q all private signals are set equal to this common component (which
  is correct with probability p), and with probability 1−q signals are conditionally
  independent and individually correct with probability p. Each agent knows q and
  p but observes only her own signal and the public history of decisions.


