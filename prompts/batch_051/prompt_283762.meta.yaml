  "You are an expert in moral philosophy, particularly the ethics of ritual, punishment,
  and moral responsibility. Please think through this slowly, beginning by brainstorming
  possible principles before committing to one.


  I have been collecting my own judgments about the strange phenomenon of transferring
  guilt, blame, or moral burden to a substitute, and I find that I cannot see what
  principle, if any, lies behind them. Consider these cases. (1) In the Levitical
  Day of Atonement rite, the high priest lays his hands on a goat''s head, confesses
  the people''s iniquities over it, and sends it into the wilderness; I want to say
  that this is not merely a decorative symbol, and that something is genuinely handed
  over to the animal and removed from the community, though the goat does not become
  guilty and the people do not lose the memory of what they did. (2) If a court executes
  an innocent substitute for a real murderer, I find that both unjust and metaphysically
  empty: the murderer''s guilt is not transferred, the substitute is not guilty, and
  a second wrong has merely been added. (3) If a friend voluntarily takes over someone''s
  monetary debt to a lender, I have no hesitation in saying that the obligation has
  genuinely moved, and the original debtor is released; that seems like a transfer
  of a burden, not a transfer of guilt, but I cannot state exactly where the line
  is. (4) When a parent whose child has vandalized a neighbor''s house says "I take
  responsibility for this," makes restitution, and then the neighbor regards the matter
  as settled with the parent, I think the parent incurs answerability without acquiring
  guilt for the child''s act; again a burden has moved without culpability moving.
  (5) By contrast, when a frightened community blames a convenient outsider for a
  crop failure and drives him out, I think nothing whatsoever has been transferred
  to him, the community''s feeling of purification is merely a feeling, and the community
  has made itself worse rather than better. (6) The case that most puzzles me is a
  mature request: a wrongdoer, years later and in earnest, asks the person he wronged,
  "Would you carry this guilt with me?" and the victim, understanding the request,
  answers that she will. I do not want to say she thereby becomes guilty, but I also
  do not want to say nothing happened.


  What I would like from you is a principle, or a small set of candidate principles,
  that captures as many of these six judgments as possible. State the principle precisely,
  show how it handles each case, and be honest about which of my judgments it forces
  me to give up or revise. Then apply it to a case I have not listed: a penal system
  that allows a convicted offender to pay a willing stranger to serve his prison sentence
  in his place, with the offender remaining legally ''convicted'' but the stranger
  being the one punished. If your principle cannot deliver a single verdict there,
  say why the case straddles two different things that I may be running together."


