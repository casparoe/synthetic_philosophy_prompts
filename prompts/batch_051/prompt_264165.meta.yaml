  find each step plausible, but the conclusion seems to prove too much, and I cannot
  find the exit. I''d like a diagnosis.


  (1) A theory is final only if it is not merely the best theory we currently have,
  but also the theory that inquirers would retain under any arbitrarily long continuation
  of inquiry — no future anomaly, no future rival, no future reinterpretation of the
  evidence.

  (2) To be warranted in accepting a theory as final, we would need to be warranted
  in accepting that such unlimited future inquiry would not overturn it.

  (3) We are never warranted in accepting that, because the only evidence we can have
  is finite, and any finite body of evidence is compatible with indefinitely many
  rivals that diverge beyond it (underdetermination).

  (4) Therefore we are never warranted in accepting any theory as final.

  (5) But the same reasoning applies to any theory whose content reaches beyond its
  finite evidence — i.e., to every physical theory about unobservables, indeed to
  the ordinary general claims of physics (electrons, fields, quarks).

  (6) So we are never warranted in accepting any general physical theory, not just
  in accepting one as final.

  (7) That is unacceptable: if no general physical theory is ever warranted, then
  the very practice of physics — which has produced the precision, control, and successful
  dismantling of its own past errors — is one long unjustified leap, and the distinction
  between well-tested theory and groundless speculation collapses.

  (8) Therefore one of (1), (2), (3), or (5) must be false, or the move from (1)–(3)
  to (4) must be invalid.


