  The discursive dilemma (Pettit 2001; List & Pettit). Example: a three-judge panel
  decides whether a defendant is liable. Liability (C) follows from (P1: defendant
  did X) and (P2: X constituted breach of contract). Judges vote:


  Judge 1: P1 true, P2 true -> C true

  Judge 2: P1 true, P2 false -> C false

  Judge 3: P1 false, P2 true -> C false


  Premise-wise: P1 gets 2-1 true; P2 gets 2-1 true; C gets 1-2 false. So majority
  on premises yields liability, but majority on conclusion yields no liability. The
  group is "discursively dilemmatic": the majority set of judgments is inconsistent.
  So either the group respects majority on each proposition (proposition-wise majoritarianism),
  and risks inconsistent collective judgments, or it respects collective coherence
  (conclusion-based procedure), and gives up treating majority on premises as authoritative.
  This is the tension between democracy and rationality at the group level.


