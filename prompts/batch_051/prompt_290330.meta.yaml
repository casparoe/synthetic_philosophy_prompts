  Let me think of a strong homemade theory in no-trade / epistemology of markets.


  Homemade theory idea: "The Principle of Open Prices" or "Price Transparency as Common
  Knowledge." Claim: "A market price freely visible to all parties is a public signal;
  therefore any trade that occurs at that price is either (a) rationally grounded
  in differing endowments/risk, not information, or (b) involves at least one irrational
  party. No purely information-based trade can occur at a publicly posted price."
  The asker might then say they derived a surprising corollary: "insider trading bans
