  asker''s homemade theory might stumble exactly on the Grossman-Stiglitz point: prices
  can''t fully reveal info when acquiring info is costly, so the corollary fails.
  That''s a good "where it breaks" story.


  Alternatively, make the homemade theory the opposite: "The Principle of Informational
