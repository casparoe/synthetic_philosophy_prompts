  I''m a PhD student in epistemology, working on self-knowledge, and I''ve been tracking
  my raw verdicts on a bunch of cases about knowing your own state. They don''t obviously
  add up, and I''d like you to try to extract the principle behind them, or tell me
  which verdicts have to go.


  Here are the cases:


  1. I have a mild headache right now. I know I''m in pain, and I also know that I
  know I''m in pain. I don''t feel any barrier to iterating this a few steps, actually.

  2. Standing outside in freezing weather, I''m clearly cold. I know I''m cold, and
  I know that I know I''m cold. Again no issue.

  3. But in a room that warms up extremely gradually over an hour, going from cold
  to warm, I can''t pick out a moment where it stops being the case that I know I''m
  cold. Even if you quiz me every few seconds, I''d just start giving uncertain answers
  at some point. I want to say there is no first moment at which I fail to know I''m
  cold, and also no last moment at which I know I''m cold — knowledge of your own
  state seems to need a margin for error. Yet I''d also admit there must be some moment
  where my body crosses from cold to not-cold. These two thoughts feel inconsistent,
  and that''s the thing I want fixed.

