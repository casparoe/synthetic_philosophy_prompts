  1. "hope has value precisely when it is not supported by evidence: if an outcome
  were probable enough to expect, hope would be unnecessary." That''s a non-sequitur:
  hope doesn''t become unnecessary when an outcome is probable; one can hope for and
  expect the same outcome; the value of hope isn''t something that appears only under
  low probabilities. This conflates hope with "hoping against the odds."

