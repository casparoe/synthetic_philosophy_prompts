  is too strong; even hope that remains only a wish can be (arguably) wrong if it
  corrupts character, becomes a moral alibi, or shapes what one notices and does through
  attention and practical commitments; the student conflates "doesn''t alter flat
  belief" with "has no effects." Also another: equating "not changing what one believes"
  with "no self-deception" ignores that self-deception can operate through attention,
  interpretation, and the standards by which one evaluates evidence.


