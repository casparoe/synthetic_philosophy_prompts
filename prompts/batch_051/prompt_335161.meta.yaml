  The asker: has been reading defenses of EU maximization that proceed by showing
  that violating the axioms exposes you to exploitation (Dutch book/money pump) or
  that obeying them is necessary/sufficient for a utility representation. They want
  a spec of what such an argument must deliver to count as an actual coherence argument
  for EU maximization. The requirements might include:


  1. Derive the normative conclusion from a notion of coherence that is independently
  compelling — the axioms can''t be justified by "and if you obey them, here''s a
  nice representation" because mathematically all sorts of non-EU preference structures
  also have representations (e.g., rank-dependent utility can represent Allais preferences).
  So the argument must explain why the representation''s failure is a defect. This
  is a strong requirement that excludes representation-theorem-only readings.


  2. Close the gap between a theorem about existence/uniqueness and a claim about
  rationality: if a theorem shows there exists a probability and utility that represent
  you if you satisfy axioms, it doesn''t show you ought to satisfy axioms. The argument
  must bridge the is/ought gap or identify coherence with satisfiability. Likewise
  the converse: from any preference ordering (with richness), some representation
  may exist (e.g., by making utility state-dependent or using non-additive capacities).
  So the argument must rule out gerrymandered representations without assuming EU.


  3. Handle the money/utility problem: Dutch books use money as the medium of sure
  loss, but the value of money is exactly the sort of thing utility should represent;
  if you assume linear utility in money, you assume part of the conclusion; if you
  don''t, the sure-loss in money doesn''t establish irrationality.


  4. Handle the package principle: the book consists of several bets each acceptable
  at your stated odds; the argument assumes accepting a collection of individually
  acceptable bets commits you to accepting the collection, which is a form of independence/separability
  — an axiom about aggregation that itself needs defense. This is arguably the most
  damaging.


  5. State the right uniqueness and invariance conditions: probability unique, utility
  unique up to positive affine transformations; if the argument only yields an existence
  claim, infinitely many probability/utility pairs represent the same preferences,
  so the argument hasn''t pinned down degrees of belief at all.


  6. Distinguish risk attitude from belief: in deriving EU from preference over acts,
  utility is defined only up to affine transformations and probabilities are derived
  assuming the same utility across states; the argument must not let utility absorb
  belief (state-dependent utility) or belief absorb value (arbitrary priors). So state-independence
  must be justified, not assumed.


  7. Cover or motivate the completeness and continuity/Archimedean assumptions, which
  are the usual sticking points (lexicographic preferences, unbounded utilities, St.
  Petersburg): coherence arguments often just stipulate them, so an adequate argument
  must say why non-Archimedean preferences are incoherent rather than merely intractable.


  8. Be at least as strong diachronically as it is synchronically, or explain why
  only synchronic coherence matters: money pumps exploit diachronic inconsistency
  across time; if the agent can just say their future self is a different agent or
  their preferences have legitimately changed, the argument falters. So the argument
  must address the plausibility of binding/temporal consistency assumptions.


  9. Not collapse into behaviorism: if degrees of belief and utilities are operationally
  defined by observed choices, and the axioms are then definitionally true of consistent
  choice data, the argument is vacuous as a normative constraint. It must interpret
  preferences/degrees of belief as mental states that choices evidence but don''t
  define, and then show why coherence of those states matters.


