  the uniqueness conditions; must handle risk aversion as utility curvature rather
  than as a separate psychological attitude; must avoid turning "irrational" into
  "has preferences that can''t be represented" since representation is always possible
  with enough gerrymandering (if you allow arbitrary state-dependent utilities, even
  sure-thing violators can be represented by making utility state-dependent — so the
  argument must rule out state-dependent utility in a non-question-begging way).

  - The diachronic/synchronic issue; the "package principle" objection: Dutch books
  assume you''ll accept a collection of bets that are individually acceptable but
  jointly unacceptable; a coherent agent can refuse the package, so the argument must
  justify the principle that if each bet is acceptable then the book is acceptable.

  - The money/utility problem: Dutch book uses money as measure of value; but if money
