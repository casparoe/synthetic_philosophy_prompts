  Coherence arguments for EUM:

  - Dutch book argument: if your degrees of belief violate probability axioms, there
  is a set of bets you''d each accept individually (fair odds per your degrees of
  belief) that yields a sure loss. Establishes probabilistic coherence of degrees
  of belief. Assumes betting quotients reveal degrees of belief, assumes value of
  money linear over stakes, assumes you''ll accept each bet at your fair odds (actually
  you might accept at some odds but if you''re indifferent, you''ll accept either
  side — but the argument needs you to accept the specific side), assumes the bets
  are evaluated individually (package principle), and the "sure loss" is measured
  in money, assuming money is value/utility.

  - For expected utility: Savage''s representation theorem: if preferences over acts
  satisfy certain postulates (ordering, sure-thing principle, etc.), then there exists
  a probability measure on states and a utility function on consequences such that
  acts are ranked by expected utility, with probability unique and utility unique
  up to positive affine transformation. This is a coherence-type argument: if you
  violate the axioms, you''re inconsistent in some sense? Actually, allowing that
  representation doesn''t prove you "should" maximize EU; it''s conditional. The normative
  force is disputed.

  - The gap: representation theorems are "if axioms then representation", and the
  axioms are constraints on preference, not obviously rationality. The axioms themselves
  (especially completeness and independence/sure-thing) need defense. Coherence argument
  must show the axioms are requirements of coherence, not just sufficient conditions
  for a convenient representation.

  - Allais/Ellsberg challenge the independence and sure-thing axioms, showing people
  violate them without seeming incoherent.

  - A desideratum: the argument must derive both probability and utility simultaneously
