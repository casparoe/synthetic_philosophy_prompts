  Bayesian convergence: Two standard results.

  - Merging of opinions (Blackwell-Dubins 1962): if two agents'' predictive distributions
  are both absolutely continuous with respect to one another, then their forecasts
  (conditional probabilities of future events given past data) merge in total variation
  almost surely, even if their posteriors over parameters don''t necessarily merge.
  Actually Blackwell-Dubins gives merging of *predictions*, not necessarily of posterior
  distributions over hypotheses. But under stronger conditions, posteriors over models
  converge to the truth (Doob''s consistency theorem) for each agent whose prior puts
  positive mass on true model, etc.

  - Doob''s theorem: Bayesian posterior is consistent (converges to true parameter
  w.p.1 under the true distribution, for IID models) if the true parameter has prior
  support and identifiability. So two agents whose priors are both supported on the
  truth will both eventually concentrate on it.

  - The "washing out of priors" claim: plausible but requires the true hypothesis
  not be assigned zero prior. If someone''s prior is 0 on the truth, conditionalization
  keeps it at 0 forever.


