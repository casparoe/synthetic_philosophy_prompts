  (1) Good''s theorem in Bayesian decision theory says that, in any decision problem,
  if a piece of information is cost-free, then the strategy of observing that information
  and choosing the action with the highest conditional expected utility has expected
  utility at least as high as simply choosing before observing it.


  (2) It follows that free information can never make a decision worse in expectation
  and can sometimes make it better.


  (3) What holds for one free piece of information holds for many: each additional
  free signal weakly improves the decision, so a rational agent should always prefer
  a richer free information set to a sparser one.


  (4) A rational agent should therefore take in every free signal available before
  any decision whose stakes are at all nontrivial.


