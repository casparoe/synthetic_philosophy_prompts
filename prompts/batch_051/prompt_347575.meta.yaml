  "Strategy-stealing" is a well-known proof technique in combinatorial game theory:
  for games like Hex, it is used to prove that the first player has a winning strategy.
  The argument: suppose second player has a winning strategy; then first player makes
  an arbitrary first move, and then follows the second player''s strategy, treating
  his extra stone as a bonus; since the extra stone can only help, if second player
  had a win, first player would win, contradiction. For this to work, the game must
  have certain properties (the extra move is never a disadvantage, and you can "pretend"
  to be the second player ignoring the extra stone).


