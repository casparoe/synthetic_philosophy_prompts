  is that the theory is a blank cheque for enclosure; the usual defense is that it
  is actually a constraint on exactly that. I want to test both readings against the
  same historical episode rather than the standard abstract examples.


  Take the English enclosure movement, in particular the parliamentary enclosures
  of the eighteenth and early nineteenth centuries, but the earlier piecemeal enclosures
  can enter where they matter. The salient facts, as I understand them: common fields
  and wastes were subject to customary rights — grazing, gleaning, gathering fuel
  or turf — held by villagers who often had little or no formal title; enclosure (by
  agreement, by Act of Parliament, or sometimes by force) extinguished those rights
  and converted the land into private consolidated holdings, occasionally with modest
  allotments or compensation to some commoners, often with effectively nothing for
  the poorest; the enclosed land was typically ''improved'' — hedged, drained, sown,
  and often turned to more profitable uses such as sheep pasture. I want an analysis
  of this episode through Locke''s labour theory and proviso — and an analysis of
  the theory through the episode.


  You are an expert on Lockean political philosophy. Please think carefully and do
  the work in two directions. First, lay out the specific test that Locke''s account
  would apply to an enclosure: what must be true of the land, the labour, the spoilage
  constraint, and the proviso for an enclosure to be a legitimate original acquisition
  or a legitimate extinguishing of common rights? Second, run the historical case
  through that test as honestly as you can — which enclosures pass, which fail, and
  where the theory simply does not have the resources to say anything because the
  facts are not the sorts of facts it tracks (for instance, formal title versus customary
  use, compensation, coercion, the difference between improving land and merely excluding
