  Standard Rietdijk–Putnam: Consider two events A and B that are spacelike separated,
  so there''s a reference frame where A and B are simultaneous. In another frame moving
  relative, A is earlier than B; in another, B is earlier than A. If "the present"
  or "real now" is frame-dependent, then for any event in my future, there is some
  frame (some observer moving relative to me) for whom that event is simultaneous
  with (or even past relative to) an event in my present. Putnam''s version: Suppose
  A is "now" here on Earth and B is a future event on Earth (e.g., tomorrow). There''s
  an observer far away moving such that... hmm. Actually Putnam''s argument uses a
  distant observer O moving relative to Earth such that an event on Earth in our future
  is simultaneous with an event in O''s "now" that is real. Putnam: "I-now" is real;
  by relativity of simultaneity, some event in your future is simultaneous with me-now,
  so it is real; if real, then future is real. This proves block universe.


  The subtle issue: the argument moves from "there exists a frame in which event B
  is simultaneous with A" to "B is real now." But simultaneity is frame-dependent;
  "is real now" is not a Lorentz-invariant notion unless you adopt a particular frame.
  The step "whatever is simultaneous with a real event is real" illicitly assumes
  simultaneity is absolute or there''s a privileged "real now." Also "real" is tensed
  and not invariant. The flaw is an equivocation: "simultaneous with me-now" in one
