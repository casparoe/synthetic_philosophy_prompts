  Full prompt draft:


  "A friend and I had a long argument last week about when Latin stopped being Latin
  and started being Italian, and she left me with an argument I cannot find a hole
  in. Reconstructed, it goes like this. (1) There is an unbroken chain of speaker-to-speaker
  transmission from the Latin of the late Republic to present-day Italian: each generation
  acquired the speech of the generation before it and was understood by that generation.
  (2) For any two adjacent stages in this chain, the two stages were mutually intelligible
  enough that neither group of speakers would have judged the other to be speaking
  a different language. (3) If two stages are mutually intelligible in that way, then
  their speakers speak the same language. (4) Sameness of language is transitive:
  if the speakers at stage A speak the same language as those at stage B, and those
  at stage B speak the same language as those at stage C, then those at stage A speak
  the same language as those at stage C. (5) Therefore, by repeated application of
  (3) and (4), the Latin of the late Republic is the same language as present-day
  Italian. (6) The Latin of the late Republic is not the same language as present-day
  Italian. This is a contradiction, so at least one step has to go. I am strongly
  inclined to keep (1) and (6), which look like plain facts, but I want to know exactly
  what I am paying for the rejection of whichever step is the weak one. In particular,
  I worry that whatever we reject, we may be forced to say either that Latin and Italian
  differ only in some loose or practical way, or that no language exists as one thing
  over time at all; I would like to know whether there is a third option and what
  it costs. Please answer in continuous prose, as in an email or a letter, without
  headings, bullet points, bold text, or tables."


