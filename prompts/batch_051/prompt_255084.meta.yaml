  Rietdijk–Putnam argument: Two observers moving relative to each other pass each
  other at some point. For events far away, their hyperplanes of simultaneity tilt
  differently. An event that is future for one can be past/present for the other.
  Since the observers at the same spacetime point should agree on what is "real now"
  (if "now" were frame-independent), and since one observer''s plane contains an event
  that lies in the other observer''s future, "now" for one includes events in the
  future of the other; by symmetry, both planes are valid; hence events in anyone''s
  future are real. This is the argument.


  One subtlety: The original Rietdijk–Putnam argument used "real for" and the transitivity:
