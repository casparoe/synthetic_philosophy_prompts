  frame), then... Actually the argument is: at a point, two observers disagree about
  which distant event is simultaneous; by the transitivity of reality (if X is real
  to you and X is co-present with Y, then Y is real), the future event is real. It''s
  often challenged by denying that simultaneity is a "co-presentness" relation with
  the right transitivity, or denying that all frames are equally descriptions of reality.


