  Prompt:


  You are an expert on Adam Smith''s moral philosophy, especially The Theory of Moral
  Sentiments. I am not looking for a bibliographic survey or textual history; I want
  careful conceptual analysis.


  I recently joined a small professional licensing board that disciplines misconduct.
  I notice that when we consider a case, I try to form a judgment not just from my
  own reaction or from what the other board members seem to feel, but from the standpoint
  of someone not involved in the case—an outsider who knows the facts but has no stake.
  Smith has been on my mind because this resembles his impartial spectator. Recently
  I read the part of The Theory of Moral Sentiments where Smith says that when we
  judge our own conduct, we divide ourselves into two persons: an examiner and judge
  on one side, and the person whose conduct is examined on the other, and that we
  try to view our own conduct as an indifferent spectator would. I want help making
  sense of the underlying conceptual structure.


  Specifically, I want to understand how Smith''s impartial spectator can be both
  a product of our social experience and yet a standard that corrects ordinary social
  approval. It seems that Smith derives our sense of duty from the imagined judgments
  of impartial spectators, but also says we form the impartial spectator by generalizing
  from actual spectators we have encountered. If actual spectators are sometimes partial,
  biased, or corrupt, where does the normativity of the impartial spectator come from?
  Does Smith have a way to avoid the charge that the impartial spectator is just an
  idealized version of whatever opinions happen to circulate in a given society? Or
  must Smith smuggle in some independent moral standard at that point?


  Please think through this by first articulating the role the impartial spectator
  plays in Smith''s account of self-judgment. Then work out whether Smith can coherently
  say both that the impartial spectator is constructed from social observation and
  that it can condemn the social attitudes from which it was constructed. Finally,
  give your own assessment of whether the impartial spectator is best understood as
  a model of conscience, a heuristic of social foresight, or something else. I care
  less about Smith''s historical influences than about the conceptual pressures on
  the idea. If there is a real unresolved tension, say where exactly it lies.


