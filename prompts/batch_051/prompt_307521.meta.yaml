  Prompt:


  At my epistemology reading group last Tuesday, two people got into an argument over
  a passage in Robert Nozick''s Philosophical Explanations, where he introduces the
  subjunctive conditions on knowing. We''d read the bit where he argues that knowledge
  requires the belief to track the truth — if the proposition weren''t true, the person
  wouldn''t believe it — and then he says this means knowledge is not always closed
  under known logical implication. The argument went back and forth.


  Jun said that whatever its weirdness, Nozick''s point captures something real: you
  can know you''re looking at a zebra at the zoo, but you don''t know it''s not a
  cleverly painted mule, because if it were a mule painted to look like a zebra you''d
  still think it was a zebra. Your perceptual method tracks zebrahood but not the
  absence of mulehood.


  Elena said that''s not an insight, it''s a reductio of the tracking conditions.
  If you genuinely can''t rule out the mule scenario, then by ordinary standards you
  don''t know it''s a zebra either. Tracking theory doesn''t rescue ordinary knowledge
  from scepticism; it just changes the word ''knowledge'' so we can say both things
  at once.


  Jun answered that the trade-off is exactly right: deny closure and keep everyday
  knowledge, or keep closure and get swallowed by scepticism. The tracking theorist
  is the only one who can explain why sceptical arguments feel compelling without
  accepting their conclusion.


  Elena came back: that''s too concessive to the sceptic. You can keep closure and
  resist the sceptic by saying your ordinary belief is psychologically stable or safe
  across the relevant alternatives, without needing a subjunctive sensitivity to every
  logical consequence. And if knowledge doesn''t close under known implication, you
  get a normatively broken state where someone knows p, knows that p entails q, but
  isn''t in a position to know q — even though q follows from what they know.


  Jun said that last part isn''t broken. They can infer q, and then they come to know
  q by the method of inference, not by the original perceptual method. The original
  belief and the inferred belief have different tracking profiles, so there''s no
  contradiction.


  Elena replied that this fragments knowledge by method in a way that makes deliberation
  impossible: you''d have to keep track of which route delivered each premise before
  deciding what you''re entitled to infer. And the route itself can be gerrymandered.
  Say my method is ''believing whatever seems to be the case in any slightly unusual
  circumstance''; then everything tracks trivially. The tracking view needs constraints
  on method that it never gives.


