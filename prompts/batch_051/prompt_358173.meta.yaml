  Principal Principle (PP): Let C be a reasonable initial credence function, X a proposition,
  E a proposition that specifies the chance of X at time t (and maybe history to t),
  and A admissible evidence. Then Cr(X | E & A) = chance(X), roughly Cr(X|H & P=chance)
  = x. The PP says one''s credence conditional on the chance of X being x should equal
  x. Admissibility: evidence that is admissible (not "inadmissible" like information
  about the future, or about how the chance process turns out).


  Lewis''s version: chance is objective single-case probability; he is a Humean about
  chance (best-system analysis). This led to the problem of undermining futures: if
  a chance theory says P(F)=x, but F''s truth might undermine the theory itself, then
  conditionalizing on the chance theory and an undermining future gives contradiction.
  So PP needs modification; Hall''s New Principle: Cr(X | H_t & T_w & E) = P(X | H_t
  & T_w), where T_w is the complete chance theory of world w, and H_t history. So
  instead of setting credence to chance, set credence to chance conditional on history
  and the truth of the chance theory itself.


