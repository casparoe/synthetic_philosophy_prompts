  can do explanatory work. On this picture there is no coherent question ''why did
  she do that if it wasn''t for her own good?'', because doing it at all shows that
  she saw some point in it, and seeing a point in it just is taking it to contribute
  to her good. The theory is lovely: one mechanism for action explanation, an answer
  to weakness of will (you always do what you most want, all things considered; what
  you earlier said you wanted was just a lower-order desire), and it handles the standard
  Butler-style counterexamples by admitting that the object of my desire can be your
  welfare—it just adds that your welfare''s mattering to me is itself part of my good.


