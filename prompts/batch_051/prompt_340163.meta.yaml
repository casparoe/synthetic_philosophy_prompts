  - Thesis: Causality in accordance with laws of nature is not the only causality;
  it is necessary to assume another causality, that of freedom, to explain appearances.

  - Antithesis: There is no freedom; everything in the world happens solely in accordance
  with laws of nature.

  - Resolution: Both can be true: thesis for the intelligible world (thing in itself)
  and antithesis for the sensible world (appearances). The conflict is only if appearances
  are things in themselves.

  - Transcendental freedom: the power of beginning a state from itself, whose causality
  is not subordinated to another cause determining it in time according to laws of
  nature.

  - Distinction between empirical character (the law-governed, temporally determined
  cause of the action as appearance) and intelligible character (the timeless, noumenal
  ground). The intelligible character is not an appearance, but its effect appears
  in the phenomenal series.

