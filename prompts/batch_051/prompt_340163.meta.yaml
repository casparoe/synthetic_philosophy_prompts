  I''ll write the argument as if a colleague built it. Steps:


  1. A system that reasons about change must keep its representation of the world
  in step: after each event, it needs to update the beliefs about what changed and
  leave the beliefs about what persists unchanged.

  2. The number of potential change-independencies is unbounded and context-sensitive:
  whether the radio stays on when I enter the kitchen depends on the wiring, the state
  of the switch, whether there is a power cut, whether I have an electromagnetic device,
  etc. There is no finite, once-and-for-all list of "non-effects."

  3. So the system cannot encode a fixed list of what an event leaves alone. At most
  it can encode a default: "assume everything else persists." But defaults must be
  retracted when defeated, and detecting defeaters requires surveying background conditions.

  4. The only way to survey relevant background conditions is to search over stored
  beliefs. But which beliefs are relevant is itself context-sensitive (a belief about
  a power cut is normally irrelevant to entering the kitchen until it isn''t). Relevance
  is a holistic, semantic relation; it cannot be implemented by local syntactic search.

  5. Hence the system faces a dilemma: either it uses local heuristics and risks missing
  real but nonlocal consequences, or it does holistic relevance search and is computationally
  intractable (unbounded in the size of the store).

  6. Any finite being with the competence we have must be doing one of these. Since
  the first is too error-prone to qualify as common sense and the second is intractable,
  finite beings cannot possess common sense.

  7. But we do possess common sense (we cross rooms without paralysis and without
  believing the walls vanished).

  8. Therefore the standard way of setting up the problem — in terms of stored beliefs
  and inference rules — must be wrong.


