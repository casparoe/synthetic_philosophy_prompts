  Possible argument structure with a genuine subtle flaw:


  (1) Suppose a system represents the world as a set of stored beliefs and changes
  it upon events.

  (2) After any event e, the system must update to a new belief set that reflects
  exactly what changed and preserves exactly what persisted.

  (3) A correct update cannot be achieved by any finite list of update rules keyed
  to e, because for any such list there is a background circumstance (loading a gun,
  painting an object while it sits on a scale, etc.) that reverses or qualifies a
  rule: almost any fact can depend on almost any other fact under some circumstances.

  (4) So a correct updater must, for each stored fact F, determine whether F''s truth-conditions
  still obtain after e. This requires checking F against every other fact/background
  condition on which F conditionally depends.

  (5) Since each fact can conditionally depend on arbitrarily many others, and those
  dependencies are themselves stored beliefs that must be checked, this checking is
  unbounded / never converges for a finite system.

  (6) Therefore no finite stored-belief system can update correctly after events.

  (7) Human beings are finite systems that update after events (we believe our keys
  persist when we move them, that the wall remains after we open the door, etc.).

  (8) So humans either are not finite stored-belief systems, or their updates are
  never fully correct.

  (9) But both alternatives are absurd / prove too much (if humans'' updates are never
  fully correct, everyday competence is a mystery; if humans aren''t finite... pleonasm).

  (10) Therefore the model of mind as stored-belief updater — and along with it the
  standard frame problem — must be wrong.


