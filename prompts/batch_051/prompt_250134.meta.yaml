  pragmatically defective).


  Subtleties / common misrepresentations:

  1. Conflating intransitive preferences (synchronic) with changing preferences over
  time (diachronic dynamic inconsistency / time inconsistency). Money pumps for intransitivity
  can involve all trades offered at once or sequentially, but classic cyclicity is
  synchronic; temptation/self-control problems are different failures. Popularizers
  often blur "your preferences contradict each other" with "your preferences flip
  over time."

  2. Treating the money pump as a proof/demonstration that intransitive preferences
  are irrational. Actually, many philosophers regard it as a pragmatic argument: it
  shows exploitability, not a direct inconsistency. And the agent can avoid being
  pumped if it is sophisticated (anticipates the whole sequence and refuses early
  trades) or resolute, or if trades are bundled. The pump requires that preferences
  are stable, pairwise trades are evaluated in isolation, and the agent is myopic;
  a sophisticated intransitive agent could refuse to trade A for C in the first place
  if it sees the cycle, or use a dominance strategy. So money pump doesn''t "force"
  anyone; it shows a disposition under certain conditions.

