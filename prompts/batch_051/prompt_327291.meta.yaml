  "I’ve been reading the long-running dispute over aesthetic testimony — roughly,
  whether one can be justified in judging that a work is good, beautiful, or artistically
  successful on the basis of another person’s say-so — and I’m struck by how fixed
  the positions are. The anti-testimony side says aesthetic judgment requires first-hand
  acquaintance with the work; otherwise one is just repeating a cover blurb. The pro-testimony
  side says this is mysterian about aesthetic concepts: if critics have reliable discriminatory
  capacities, there should be something their reports transmit that can figure in
  my reasons. Both sides, as far as I can tell, already agree on the standard examples:
  we may defer to someone about whether a film was shot on location, but not about
  whether it earns its irony. And both sides can predict exactly which cases the other
  will use. The debate hasn’t moved, but not because anyone lacks arguments.


  I recently opened Hume’s essay Of the Standard of Taste and hit this passage, which
  seems to me to name the pin:


  [quote]


  It is natural for us to seek a Standard of Taste; a rule, by which the various sentiments
  of men may be reconciled; at least, a decision, afforded, confirming one sentiment,
  and condemning another.


  [endquote]


  My hypothesis is that the aesthetic testimony debate is actually a disagreement
  about what this ''standard'' would have to be. On one reading, a standard of taste
  is a decision procedure: a rule that could be stated, handed to another person,
  and used to confirm or condemn particular judgments — in which case testimony about
  what the standard says should be able to do real epistemic work. On another reading,
  the standard is a norm of cultivated response that can be exhibited by trained judges
  but not converted into a transferable rule — in which case the anti-testimony side
  is right that testimony about the verdict cannot replace acquaintance, but wrong
  if it thinks there is no rationality in aesthetic judgment at all. If that’s the
  real hinge, then the dispute isn’t fundamentally about whether testimony transmits
  knowledge, nor even about aesthetic experience; it’s about whether the standard
  of taste is the kind of thing that can be encapsulated in a decidable rule or the
  kind of thing that must be acquired as a skill.


  I want a diagnosis, not a survey. Is this a substantive disagreement about the nature
  of aesthetic standards, a verbal disagreement about what ''standard'' means, or
  two camps answering different questions under one heading? What, if anything, would
  count as progress given the diagnosis? Could a distinction — or an experiment, or
  a formal result about judgments of the same work with and without deference — actually
  move this, or should I expect the impasse to persist because the competing readings
  of ''standard'' are doing the heavy lifting? And if the second reading is right,
  is it really a disagreement about aesthetic testimony, or is it a proxy for the
  older problem of how a judgment can be both subjective and correct?"


