  "Imagine the following exercise. In a longstanding reading group on the philosophy
  of language, two participants have reached an impasse. One, Callie, is a Quinean
  holist: she holds that the analytic–synthetic distinction cannot be drawn in any
  principled way, and that Quine''s arguments in Two Dogmas of Empiricism show that
  appeals to meaning, synonymy, or definition are circular or misplaced. The other,
  Marco, is a neo-Carnapian: he grants that Quine damaged the traditional definition
  of analyticity but holds that the distinction can be rebuilt in terms of meaning
  postulates, inferential role, and the notion of an empirically contentless convention,
  and that without something like it we cannot explain why certain revisions are linguistically
  licensed and others are not. After a year of talking past each other, their moderator
  asks them to produce what they should have produced: a joint adversarial-collaboration
  statement.


  You are an expert philosopher of language and epistemology with experience in exactly
  this kind of good-faith disagreement work. Please draft the document they would
  both sign. Think carefully before writing, and begin by brainstorming formulations
  that each side would accept, rejecting any wording that is slanted or vacuous. The
  final document should have two parts. First, a numbered list of claims both sides
  accept: about the actual content of Quine''s criticisms (including the circularity
  objection regarding synonymy, the role of definition and interchangeability salva
  veritate, and the relevance of confirmation holism), about what would count as successfully
  drawing the distinction, and about which historical versions of the analytic–synthetic
  distinction fail. Second, a disagreement table with columns: (i) the residual disagreement
  stated as neutrally as possible, (ii) the precise formulation the Quinean would
  sign, (iii) the precise formulation the neo-Carnapian would sign, (iv) the crux—the
  sub-question such that settling it would move at least one side, (v) a concrete
  case, argument, or kind of evidence both agree bears on the crux, and (vi) each
  side''s advance prediction about it. Where the dispute is partly verbal, say explicitly
  which part and why, and reconstruct the genuinely substantive remainder. Pay special
  attention to the distinction between the claim that analyticity has no behavioral
  criterion and the claim that analyticity is not a real joint in nature, and to the
  question whether revisability in principle of a sentence under global theory change
