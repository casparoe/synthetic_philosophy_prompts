  Barcan formula (BF): ∀x□φx → □∀xφx.

  Converse Barcan (CBF): □∀xφx → ∀x□φx.


  In quantified modal logic with varying domains, for a model M = <W, R, D, I> with
  domain function D(w):


  - BF is valid on a frame iff the domain function is anti-monotone: wRv implies D(v)
  ⊆ D(w) (domains shrink along accessibility).

  - CBF is valid iff domains are monotone: wRv implies D(w) ⊆ D(v) (domains grow).

  - Both valid iff domains are constant.


  So if domains are constant, both BF and CBF hold, and with a fixed domain of all
  possible objects, everything at any world exists at all worlds — hence "everything
  that exists exists necessarily" (under possibilist quantification). If quantifiers
  are actualist (range only over entities existing at the world), then BF''s validity
  still requires anti-monotone domains; in a model with growing domains (new possible
  individuals), BF fails: all actual individuals might be necessarily φ, but a newly
  existing individual in an accessible world could fail to be φ. The "does everything
  that exists exist necessarily?" question maps to the choice between possibilist
  and actualist quantification and to whether domains can vary.


  An exam question could ask: "State the Barcan formula and its converse. Explain
  their frame-correspondence conditions on variable-domain semantics. Then consider
  a temporal reading of the accessibility relation in which the set of existing things
  grows over time (new people are born). Which formulas fail, and why? Now suppose
  a metaphysician insists that quantifiers should be read actualistically and existence
  is to be expressed by a predicate E. Does accepting the Barcan formula in that setting
  still commit one to the claim that every ordinary object exists at all times/worlds?
  If not, what does it commit one to, and what residual metaphysical thesis remains?"
  Then model answer and marking scheme.


