  I can write:


  "Last night a friend and I ended up arguing about whether hedonism is true, and
  he left me with a reconstruction that has been bothering me. Here it is as I remember
  it:


  (1) If hedonism is true, then pleasure is the only thing that is good for its own
  sake, and pain the only thing bad for its own sake.

  (2) A rational agent ought to act so as to maximize the total amount of intrinsic
  good in her life.

  (3) But as a matter of psychological fact, people who make pleasure the explicit
  goal of their choices get less pleasure, over time, than people who pursue things
  like friendship, craft, or understanding for their own sake.

  (4) Therefore a rational hedonist should, in ordinary circumstances, stop making
  pleasure her explicit goal and pursue those other things for their own sake.

  (5) But if she succeeds in pursuing them for their own sake, she is no longer being
  guided by the belief that only pleasure is intrinsically good.

  (6) So hedonism, if true, appears to require its adherents to abandon their hedonistic
  motives—indeed, to live as though it were false.

  (7) Given that a true theory of value should be one it is rational to keep in mind
  while acting, hedonism is false.


  I want to resist the conclusion; I think the culprit is one of the earlier steps,
  but my friend says every attempt to locate the mistake has a price. Where does it
  go wrong, if it does? Which step would you reject, and what would rejecting it cost
  for how we should understand value, rationality, and the relation between them?"


