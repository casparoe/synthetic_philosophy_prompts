  Numbered argument:

  (1) Pleasure is the only intrinsic good, and pain the only intrinsic bad. (premise,
  hedonism)

  (2) If pleasure is the only intrinsic good, then a rational agent should act so
  as to maximize expected pleasure.

  (3) Empirically, agents who aim at pleasure as an explicit goal across a life achieve
  less pleasure than agents who aim at other things (friendship, craft) for their
  own sakes.

  (4) So a rational hedonist should, on most occasions, avoid aiming at pleasure and
  instead aim at other things for their own sakes.

  (5) But an agent who genuinely aims at other things for their own sakes is not a
  hedonist in practice; she treats those things as valuable irrespective of pleasure.

  (6) Therefore hedonism as a practical theory is either false or self-effacing—it
  tells its adherents to adopt non-hedonist motives, which undermines the claim that
  only pleasure is valued.

  (7) Since a theory that must erase itself from the agent''s mind cannot be the correct
  account of value... conclusion: hedonism is false.


  Where does it go wrong? There are subtleties about self-effacing theories (Sidgwick''s
  "paradox of hedonism" is actually the term). The argument seems valid-ish but there''s
  a slide from a criterion of rightness to a decision procedure: hedonism as a theory
  of value doesn''t require that one consciously aim at pleasure; it can be self-effacing
  and still be true. Also the step from "only pleasure is intrinsically good" to "one
  should always try to maximize pleasure" conflates value theory with decision procedure.
  The question asks where it goes wrong; answer would name the slide between criterion
  and method. That''s good and in the weeds.


