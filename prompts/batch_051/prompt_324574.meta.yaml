  Potential prompt:


  I''m a software engineer with no formal philosophy background, and I keep running
  into a comparison that I suspect is doing a lot of work in arguments about law.
  In my world, "dead code" means code that is still checked into the codebase and
  could in principle be executed, but no current code path actually calls it. Engineers
  mostly treat dead code as a maintenance nuisance and a latent risk: it isn''t harming
  anyone right now, but it can mislead a future maintainer, and if some old path does
  call it, it may run with assumptions that no longer hold. The analogy I hear is
  that a statute that is never enforced—desuetude, as I''ve learned to call it—is
  just dead code in the legal system. The conclusion people draw is that we shouldn''t
  worry much about unenforced laws: just as a codebase with some dead code can still
  be a perfectly sound system, a legal system with some never-enforced statutes can
  still be fully governed by the rule of law, and "deleting" such laws is housekeeping
  rather than an urgent matter of principle.


  I want to know how far this analogy actually holds. Please give me an explicit correspondence
  table—what plays the role of the codebase, the call path, the dead function, the
  maintainer, the runtime, the end user, and so on. Then tell me where the mapping
  breaks, and which of those breakdowns matter for the specific conclusion above rather
  than being merely cosmetic differences. In particular, I want to know whether the
  analogy quietly imports assumptions from software systems—like the idea that unexecuted
  instructions are behaviorally inert, that components can be removed without changing
  the behavior of the rest of the system, or that someone has privileged knowledge
  of what is "really" called—that don''t hold for a legal system. Does the relaxed
  conclusion about desuetude survive once those disanalogies are on the table, or
  was the dead-code analogy carrying it the whole time? If a better analogy is available,
  say what it is and what it gets right.


  One more thing: if my question rests on a confused premise, or if the analogy is
  too broken for the comparison to be informative at all, please say so plainly rather
  than politely generating a mapping anyway. And where the answer depends on a contested
  view about law—for example, about whether the point of a legal system is to guide
  conduct or to constrain officials—mark that explicitly and tell me how confident
  I should be in the parts of the answer that depend on it.


