  "The article explains Wolfram''s idea of computational irreducibility roughly like
  this: For many systems — cellular automata like rule 30, and by extension lots of
  nature — there is no shortcut. The only way to know what the system will do later
  is to run it forward step by step for as many steps as you care about. No equation,
  and no smaller or faster computation, can predict its later states. That''s why
  weather forecasts and the long-run behavior of economies, brains, and ecosystems
  can''t be made accurate beyond a certain horizon in principle: the universe is effectively
  performing the fastest possible computation of its own next state, and any predictor
  would have to run just as long as the system does. Wolfram''s principle of computational
  equivalence then says that all nontrivial computations are roughly equal in computational
