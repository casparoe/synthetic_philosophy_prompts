  an explanation."


  Now the model audits. Subtle issues:

  1. "no smaller or faster computation can predict its later states" — overstatement:
  exact arbitrary-step prediction may require same computation; but approximate/statistical
  predictions possible; also finite questions (e.g., will a certain cell ever reach
  state X) might be shortcuttable while full evolution isn''t. But a popularizer could
  put this strongly; the audit should note the slide from "exact prediction of arbitrary
  future details" to "no faster computation can predict anything."

  2. "weather forecasts... can''t be made accurate beyond a certain horizon in principle"
  — conflates chaos/sensitive dependence (continuous systems) with computational irreducibility
  (discrete computational systems), and "in principle" is too strong; error growth
  scales as finite measurement precision, and improved models/observations can extend
  horizon, though unpredictability is practical vs. ontological.

  3. "the universe is effectively performing the fastest possible computation of its
