  Person A: Hume says in "Of Money" that the quantity of money is irrelevant to a
  nation''s real wealth, because prices adjust: if you double money, you double prices,
  and the same amount of labor and commodities is commanded. So mercantilist concern
  with accumulating gold is based on a confusion.


  Person B: But Hume also says that in the interval between the increase in money
  and the rise in prices, the additional money stimulates industry — "in every kingdom,
  into which money begins to flow in greater abundance than formerly, everything takes
  a new face: labour and industry gain life," etc. (I must paraphrase, no quote).
  So Hume thinks money has real effects in the transition. B says that''s not just
  a caveat; it''s his actual policy: he recommends a gradual continuous increase of
  money to keep industry lively. So Hume isn''t saying money is neutral in any practical
  sense; he''s saying the right policy is to keep the economy in a perpetual transition.
  That makes his view not "money is a veil" but "the rate of change of money matters."


  A responds: But that transition effect depends on the money increase not being anticipated?
  Hume''s story is that prices rise unevenly, first in the sectors receiving new money,
  and this relative price change favors industry. That''s a one-off adjustment. If
  a government kept increasing money forever, wouldn''t people come to expect it and
  the real effect disappear? B retorts: Hume doesn''t have rational expectations;
  his psychology is about habits and gradual adjustment, so even anticipated increases
