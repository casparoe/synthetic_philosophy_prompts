  Prompt text:


  I run a reading group on eighteenth-century political economy, and last week we
  read Hume''s essays "Of Money" and "Of the Balance of Trade." The discussion got
  stuck on a tension that none of us could resolve. One member, a historian of economic
  thought, argued that Hume''s whole point is to deflate the mercantilist obsession
  with gold: money is not wealth, and a larger stock of it confers no lasting advantage
  because prices eventually adjust to the quantity of the circulating medium. He took
  this to mean that Hume is committed to a long-run neutrality of money — what you
  might call the view that money is only the lubricant of trade, not part of the machinery
  that produces real output. Another member, an economist, countered that this reading
  misses half of what Hume says. Hume repeatedly describes the interval between an
  influx of money and the resulting rise in prices as a period in which labour and
  industry gain new life, and he even recommends that a wise government should keep
  the supply of money gradually increasing. On this reading, Hume does not treat the
  short-run stimulus as an embarrassing caveat; he treats it as the central policy
  implication. The historian replied that the stimulus must depend on the increase
  being unanticipated, because once people learn to expect the inflows, prices would
  adjust faster and the real effect would vanish. The economist said that is imposing
  modern rational-expectations assumptions on an author whose psychology of adjustment
  is explicitly gradual, and whose real point is that a growing money supply can support
  a growing division of labor — a structural real effect, not an illusion. The historian
  came back: then Hume contradicts himself, because he also says the absolute quantity
  of money is irrelevant, and more money is no more useful than more counters at a
  game. The economist denied any contradiction: the stimulant effect, he said, is
  not a property of money itself but of the sequence of price changes during adjustment,
  which is exactly why Hume can deny that gold is wealth while still favouring a steadily
  increasing circulation. By then nobody was sure which of them was defending Hume
  and which was repairing him. I want a point-by-point adjudication: who is right
  about which specific claim in Hume''s texts, whether the two positions can be made
  consistent, and what both parties are overlooking about the argumentative context
  of Hume''s essays.


