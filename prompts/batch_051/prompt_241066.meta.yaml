  Domain: Chaos, predictability, and determinism. Core ideas:

  - Determinism: the state at one time plus laws fixes all future states.

  - Predictability: in practice, prediction may be limited because of measurement
  precision and sensitive dependence on initial conditions (chaos).

  - Chaos: deterministic nonlinear systems can exhibit exponentially diverging trajectories,
  so tiny imprecision in initial conditions balloons, making long-term prediction
  impossible despite determinism.

  - There''s a distinction between determinism (ontological: the future is fixed)
  and predictability (epistemic: what we can know/forecast).

  - Also, some discussions about "could have done otherwise" in free will; determinism
  vs fatalism.


