  Jeffrey conditionalization: When evidence is uncertain, you can''t just conditionalize
  because you don''t learn an event E with certainty. Jeffrey''s rule: given a partition
  {E_i} and new probabilities q_i for E_i, update P_new(H) = Σ_i q_i · P(H | E_i).
  It''s generalized by assuming that the probabilities of the partition elements change
  but conditional probabilities given them stay fixed (rigidity). Issues: non-commutativity
  — the order in which you apply successive Jeffrey updates to overlapping partitions
  matters; unlike standard conditionalization which is commutative-ish (under nesting).
  Also, Jeffrey conditionalization requires a partition and the new probabilities;
  it doesn''t say where the q_i come from. There''s also "probability kinematics."


