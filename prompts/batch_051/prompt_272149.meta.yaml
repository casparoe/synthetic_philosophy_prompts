  Full draft:


  "After a career in the physical sciences, I have been reading philosophy with the
  enthusiasm of a late convert, and I keep returning to a question I first learned
  to pose as a question about systems and state spaces: could a finite mind, in principle,
  exhaust its own experience? Put informationally, suppose the mind has some very
  large but finite repertoire of distinguishable states and the world presents it
  with only so many distinctions it can register. Then novelty begins to look like
  a depletable resource: there would be a point after which nothing genuinely new
  can occur. Against that stands the thought that experience is not a fixed inventory
  but something generated — recursively or compositionally — by the mind''s own activity,
  so that the finitude of storage or input does not impose a ceiling on what a life
  is like. I would like you to read the 1993 film Groundhog Day through this disagreement.


  The film is a controlled thought experiment. Phil Connors, a television weatherman,
  is confined to repeating the same day, February 2, in Punxsutawney, Pennsylvania,
  with the same people, the same weather, the same small accidents. For a long stretch
  he treats the town as a finite inventory to be solved: he learns the day''s contingencies,
  catches the boy falling from the tree before it happens, times the armored car and
  takes its money, predicts the man who chokes in the diner, and works through every
  available strategy of seduction, escape, and eventually suicide. The film is unflinching,
  for a comedy, that he reaches the point of having been through what the day offers
  — that he has exhausted it. Then the film appears to change its mind about what
  the day is. The same day becomes unexhausted: he studies the piano and ice sculpture,
  learns French, remembers the names and troubles of a large cast of townspeople,
  tries and fails to save an old homeless man, and slowly turns from extracting novelty
  from the town toward being of use to it, above all to Rita. The question I want
  pressed is whether this second phase refutes the exhaustibility worry, merely postpones
  it, or changes the subject.


  Please give me a careful reading of this turn, taking the philosophical issue seriously
  in both directions. Does the early phase actually establish that a finite world
  exhausts a finite mind, or does it show only that he exhausted one instrumental
  relation to that world? Is the late phase genuinely inexhaustible, or is it newly
  varied only because his changed conduct changes how others respond to him — so that
  the world now supplies new inputs rather than his mind supplying new distinctions?
  Where does the film locate the inexhaustibility of experience, if it does: in the
  unboundedness of skill, in attention, in moral development, in love? And finish
  by saying what the film contributes to the philosophical problem that a clean argument
  about finite state spaces could not, and where its resolution, if it has one, is
  too cheap or evasive. I want a reading that does not treat the film as an illustration,
  and that is willing to say where the film ducks the problem it seems to raise."


