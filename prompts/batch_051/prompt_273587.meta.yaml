  - (2) procreative beneficence requires selecting best expected life, which may demand
  selecting based on disputed "best life" traits beyond disease; that seems to conflict
  with (3)''s anti-eugenics line, since the pressure toward "best" can drift toward
  state or medical norms. Also procreative beneficence is sometimes thought incompatible
  with reproductive liberty (liberty says parents may choose; beneficence says there''s
  a reason, maybe obligation, to choose best).

  - (5) non-identity: if the child wouldn''t exist anyway, then "selecting for deafness"
  also doesn''t harm the child. So (6)''s bases might be undermined unless there''s
  another ground. That''s a genuine tension: is the asymmetry between selecting for
