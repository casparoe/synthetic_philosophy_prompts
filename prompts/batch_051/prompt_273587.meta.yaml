  Belief set (commitments):

  1. Reproductive liberty: competent adults should be free to use IVF/PGD for whatever
  traits, as long as child''s life will be at least worth living and no one else is
  harmed.

  2. Procreative beneficence (Savulescu): if you''re already doing IVF and have multiple
  viable embryos, you have a moral reason to pick the one with the best expected life
  (based on available information), not just avoid disease.

  3. Anti-eugenics: historical eugenics was abominable; state coercion or incentivizing
  selection for socially favored traits is wrong. I draw a sharp line between state-enforced
  eugenics and private parental choice.

  4. Expressivist objection: selecting against embryos with, say, congenital deafness
  need not express that deaf people have lives not worth living; the parents can simultaneously
  think deaf lives are valuable and still prefer a hearing child''s expected wellbeing.

  5. Non-identity/Parfit: because the child wouldn''t otherwise exist, "harm to the
  child" can''t ground wrongness of selecting a particular embryo; so only impersonal
  or parental reasons matter.

  6. But I also think there are independent "procreative virtue" constraints: e.g.,
  selecting for deafness (deliberately having a deaf child, as some Deaf parents have
  done) is wrong or at least criticizable, because it constrains the child''s options.


