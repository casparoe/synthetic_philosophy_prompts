  of the distinctively modern political lie. On this reconstruction, an untruth counts
  as the distinctively modern political lie when it meets most of these marks:

  (M1) It is not an isolated falsehood, but part of an organized, sustained campaign.

  (M2) Its aim is not to deceive an enemy or conceal one particular fact, but to bring
  the audience to inhabit a comprehensive, internally consistent substitute account
  of reality.

  (M3) It operates on what Arendt took to be the vulnerabilities of factual truth:
  facts are contingent, can be manipulated, and depend on testimony.

  (M4) It tends to loosen the practitioners'' own grip on the distinction between
  the fabricated narrative and the world as it is — the liars partly come to believe
  their own construction.


  Now consider a case she did not confront. A democratic government sets up a well-funded
  digital influence operation. The operation does not issue verifiably false statements.
  Instead, it uses algorithmic micro-targeting, selective emphasis, and the careful
