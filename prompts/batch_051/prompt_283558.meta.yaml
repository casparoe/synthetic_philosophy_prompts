  Jeffrey conditionalization: Suppose you undergo an experience whose direct effect
  is to change your credences over a partition {E_i} (where E_i are mutually exclusive,
  exhaustive, and each E_i is a proposition about which the experience is directly
  relevant). If the change is from old P(E_i) to new Q(E_i), and your conditional
  credences given each E_i are preserved (the "rigidity" condition: Q(H | E_i) = P(H
  | E_i) for all H), then your new credence in any H is Q(H) = Σ_i Q(E_i) P(H | E_i).
  It generalizes Bayes. It''s elegant.


  Firm intuitions that might clash:

  1. The "commutativity" or "successive uncertain observations" problem? Jeffrey conditionalization
  is non-commutative: order of uncertain observations matters, unlike Bayesian conditionalization.
  Is there an intuition against that? Could be: "If I first see a blurry shape and
  then a clearer photo, the final belief depends on my beliefs at intermediate stages;
  Jeffrey says... But I intuit that evidence from two observations should combine
  in a way that''s order-independent, as with classical conditioning." That''s interesting,
  in the weeds, and not too common. But is it a "firm intuition"? Maybe a bit technical.


  2. The "experience as direct belief change" vs. the intuition that uncertain evidence
  must itself be propositional and derive from some proposition you learn with certainty
  about your own experience (e.g., "it seems to me that..."). Some Bayesians (e.g.,
  orthodox Bayesians) think all evidence can be modeled as learning with certainty
  propositions about one''s own experiential states, and Jeffrey''s rule is dispensable
  or incoherent. But not a firm intuition in everyday life.


  3. The intuition that Jeffrey conditionalization wrongly licenses arbitrary shifts:
  any redistribution over a partition is allowed, no matter why it happened — whether
  from perception, a pill, or wishful thinking. But the rule''s normative reading
  requires the redistribution to be your *evidence-driven* posterior, not just any
  change. So the intuition may be that the formalism cannot distinguish evidence from
  mere change; without specifying which Q(E_i) you *should* adopt, it''s a consistency
  requirement, not a complete theory of evidence. This is a great philosophical critique:
  Jeffrey''s rule says how to propagate a shift, not whether the shift is rational.
  The clash: theory has systematic virtues (one formula, subsumes Bayes, handles uncertain
  evidence) but the intuition: "my probabilities can shift for all sorts of reasons,
  and no single formula can tell me whether the shift is justified; a rule that accepts
  any redistribution as input is toothless." Actually that''s a recognized criticism
  (e.g., by some), but it may be fairly standard.


  4. The "prime conditions": You look at a jellybean in a dimly lit room; your credence
  in Red vs Blue changes, and your credence in "it tastes cherry" changes with it.
  Jeffrey rigidity says the conditional probabilities stay fixed. But there are cases
  where this fails: if the experience is not just redistributing over {red, blue}
  but also changes your opinion about the reliability of lighting or the connection
  between color and flavor. For example, if you learn that the lighting is weird,
  the conditional probability of cherry given red may change. Rigidity fails when
  the experience bears on more than one partition. Could work.


