  "I''m teaching an upper-level undergraduate unit on conditionals, and I''ve been
  looking for a film that dramatizes the difference between indicative and counterfactual
  conditionals rather than merely illustrating it. Frank Capra''s It''s a Wonderful
  Life seems to me to do more than illustrate. The Pottersville sequence rests on
  a chain of counterfactual claims: had George Bailey never been born, his brother
  Harry would have drowned as a child, the men on the troop transport Harry later
  saved would have died, Mary would have become a timid and solitary woman, and Bedford
  Falls would have become Pottersville. Clarence does not merely assert these conditionals;
  he takes George to a world in which they hold and lets him inspect it. That is a
  striking dramatic commitment: the film treats a counterfactual world as something
  one can visit and use as evidence, as if there were a determinate closest world
  in the Stalnaker–Lewis sense and a providential selection function picking it out.
  At the same time, the film leans on something that sounds like an indicative generalization:
  a single life reaches into many other lives, and when that life is removed it leaves
  a hole in the lives around it.


  I want you to read the film through the lens of the indicative/counterfactual distinction.
  In your reading, first lay out the difference carefully: on a Ramsey/Adams picture,
  an indicative conditional is accepted to the degree one accepts its consequent after
  supposing its antecedent, so its assertibility tracks conditional probability, whereas
  a counterfactual conditional requires a different evaluation and, on the standard
  possible-worlds semantics, a similarity ordering over worlds. Then use that machinery
  to say what the film is really doing. Does the visit to Pottersville count as evidence
  for the counterfactuals Clarence asserts, and under what semantics of counterfactuals
  could it count? Does the film help itself to a similarity metric — or a providence
  metric — that a Lewis-style account would say is far more determinate than anything
  the semantics of counterfactuals is entitled to? Where is the film''s indicative
  generalization doing the work, and is the film licensed to move from that generalization
  to its particular counterfactual claims about George? I am less interested in a
  final verdict than in a reading faithful to both the film''s dramatic structure
  and the philosophy of conditionals: name the specific scenes that carry the argument,
  and be honest about where the film resists the philosophical machinery or oversimplifies
  it. Please paraphrase scenes rather than quoting dialogue, since I will check the
  argument against the film myself."


