  "I spent my career as a research physiologist, and I have recently begun reading
  the older philosophical literature on probability. I am to give a seminar to a university
  department of applied statistics and data science, with a few philosophers of science
  in attendance. My thesis is that the reference class problem is not a technical
  difficulty to be solved by better model selection but a permanent feature of single-case
  probability: for any individual event, the probability is well defined only relative
  to a reference class, and the choice of reference class is fixed by the purpose
  of the inquiry rather than by any fact about the individual. I intend to open with
  a close reading of the passage in John Venn''s The Logic of Chance where he observes
  that the same individual belongs to many different series and that the probability
  we assign to it depends upon which series we take it as a member of, illustrating
  the point with the example of a man''s chance of dying before a certain age depending
  on whether he is considered as an Englishman, a clergyman, or a member of a particular
  family. The audience is mostly frequentist applied statisticians who think of probability
  as a property of well-conducted procedures, not of single cases; they respect Venn
  historically but have no patience for radical conventionalism. Please prepare a
  Q&A prep sheet. State the eight or so objections I am most likely to receive in
  the question period, ordered by how damaging they are, each phrased in the vocabulary
