  Potential prompt:


  "Okay so I got into a long argument with my roommate last night and I can''t shake
  this. He had been reading Anselm''s Proslogion, chapter eight, the bit where Anselm
  tries to explain how God can be compassionate without being passible. Anselm''s
  answer, as my roommate put it, is that God is called compassionate in terms of our
  experience, not his own: when God sees our misery, we experience the effect of compassion—rescue,
  forbearance, relief—but God does not undergo the feeling of compassion. So God is
  compassionate because he spares sinners and saves the wretched, but not compassionate
  because no suffering touches his own state. So far so standard.


  But then my roommate pressed it: If compassion can be truly predicated entirely
  on the side of the effect, and not on any inner disturbance in the agent, then why
  can''t the same be said of a being that has no capacity for inner disturbance at
  all? Like an ideal caregiver robot that reliably performs rescue, relief, and forbearance
  but feels nothing, or even a human with severely flattened affect who perfectly
  tends to someone in pain. He says Anselm''s distinction commits you to calling both
  of those fully compassionate, and that if you balk at that, the original distinction
  was doing illicit work. But then he went further: (1) If effects alone can make
  ''compassionate'' true, then feelings are not required for compassion. (2) The robot
  and the flat-affect human produce the right effects. (3) So they are fully compassionate.
  (4) But if they are fully compassionate, then our normal view that shared feeling
  and emotional attunement are central to love and compassion is wrong. (5) That can''t
  be right—if your mother never felt anything when you suffered but always did exactly
  the right things, you would think something was missing. So something in Anselm''s
  distinction, or in his use of it, proves too much.


  Whats the way out? I''d like to keep both that God is genuinely compassionate and
  that something important is missing in the affectless human case, but I can''t figure
  out which step to reject without just special-pleading for God. Can you put your
  finger on where this goes wrong, and say what rejecting that step costs?"


