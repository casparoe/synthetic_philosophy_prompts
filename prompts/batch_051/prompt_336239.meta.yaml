  Quantitative genetics: selection differential (S), response (R), heritability h²:
  R = h² S. Estimated breeding value (EBV) is the expected genetic value passed to
  offspring, based on additive effects. Correlated response: selecting on trait X
  changes trait Y if genetic correlation. Genotype-environment interaction. Inbreeding
  depression from selection among few. Embryo selection among siblings: each embryo
  has a fixed genotype; no generation interval; you select one whole genome. The "selection
  differential" among embryos equals the expected phenotypic difference between chosen
  and average? The "response" for a complex trait depends on heritability? Actually,
  for embryo selection, the expected phenotype of the selected embryo equals its polygenic
  score (PGS) prediction, which is affected by heritability via accuracy of prediction.
  The genetic gain from selecting among N embryos equals i * r * σ_g where i is selection
  intensity, r is accuracy of PGS, σ_g genetic SD. So heritability affects accuracy,
  not response after conditioning on PGS. That''s a subtlety that could be a "something
  the parallel predicts that turns out false": In recurrent selection, the expected
  response of offspring is h²S because only half genes + Mendelian sampling; in embryo
  selection, the selected embryo''s genome is already fixed, so the expected gain
  is not h²S but i * r * σ_g; heritability enters only through r (accuracy of prediction),
  not as a shrink factor. This is a nice break. I can hint at this: "In breeding,
  the response to selection is heritability times the selection differential; in embryo
  selection there''s no recombination, so I''m not sure the breeder''s equation even
  applies. Does the analogy predict the same shrink factor, and is that prediction
  false?" Great — this names something the parallel predicts that turns out false.


