  What did Frege change? Standard account: Aristotelian syllogistic logic was limited
  to categorical propositions of the form "All S are P", "No S are P", "Some S are
  P", "Some S are not P" — each with two terms (subject and predicate) and one quantifier.
  It couldn''t express relational reasoning like "every horse''s owner is a human"
  or multiple generality ("some person loves everyone", "everyone loves someone")
  or nested quantification. Frege introduced a formal language (Begriffsschrift, 1879)
  with quantifiers over variables, relations (predicates of arbitrary arity), function
  symbols, and a notion of proof; this subsumed syllogistic and allowed mathematical
  reasoning. Also truth-functional connectives for propositional logic (though Stoics
  had some). Frege changed logic from term logic to predicate logic; introduced the
  notation ∃/∀; compositional semantics via function and argument; changed the analysis
  of a proposition from subject-predicate to function-argument and quantification.


  Databases: SQL/relational algebra. Tables/relations as predicates; rows as tuples
  satisfying predicates; joins as conjunction and existence; NOT EXISTS as universal
  quantification; GROUP BY/aggregation maybe; views as derived predicates; constraints
  as axioms. Syllogistic = unary predicates only (one-column filters), with quantifiers
  restricted to SOME/ALL over a single table; can''t express joins (binary relations)
  or correlated subqueries (nested quantification). Frege = relation algebra + arbitrary
  nesting (SQL is essentially first-order logic).


