  - What the session should openly refuse to do at this level — for instance, formal
  utility theory, the metaphysics of whether values are objective, or the more recent
  discussions of parity — and how to say so without making the audience feel it has
  been given the respectable part of the subject and denied the interesting part.


  - One final check for understanding by the end of the ninety minutes that would
  distinguish someone who has genuinely acquired the distinction between commensuration
  and comparison from someone who has merely learned to say that trade-offs can be
  complicated. The check should ask the audience to produce or diagnose something
  themselves rather than recognize a definition.


