  ---


  I retired a few years ago from a career in the physical sciences and have since
  been working through moral and political philosophy in a more systematic way than
  my earlier desultory reading allowed. Next month I have been asked to lead a ninety-minute
  discussion for a small group of working scientists — mostly physicists and engineers,
  with one biostatistician — on the claim that some values are incommensurable and
  that hard choices are therefore not merely poorly modeled or insufficiently informed
  choices. The group is not hostile; they are simply trained to regard any problem
  as ripe for formalization, and they will arrive expecting that every genuine trade-off
  can be captured by a utility function if one is careful enough.


  I do not want an explanation of incommensurability; I have been reading this material
  and understand it. What I want is a teaching plan for the session. The deliverable
  should be a plan, not a lecture. Tell me:


  - What has to be in place before the core claim can do any work, and why. In particular,
  what distinction must the audience grasp before the distinction between incommensurability
  and incomparability can land, and in what order should the pieces be introduced
  so that each step seems forced rather than asserted?


  - The single example or case that should carry the whole session. It must involve
  a genuine choice between two options each favored on a dimension that does not obviously
  yield to the other, with no hidden empirical uncertainty to explain away the difficulty,
  and it should not be a familiar culture-war or life-decision cliché that lets people
  retreat to prepared positions. It should also be simple enough that the room can
  hold every part of it in mind at once. Explain what the example must have and what
  it must lack, and why you have discarded the obvious alternatives.


  - The misconceptions this specific audience will bring or form, and exactly where
  in the sequence each should be headed off. I expect at least these to arise: that
  incommensurability just means the options cannot be compared at all; that it is
  the same as their being equal in value (or as our being indifferent between them);
  that it is just unresolved uncertainty about one''s own preferences; and that if
  values are incommensurable then any choice between them must be arbitrary. There
  may be others; list them if you see them. For each, specify the point in the sequence
