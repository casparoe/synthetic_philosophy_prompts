  Potential final prompt:


  "You are a moral epistemologist and a philosopher of cognitive science. Think through
  the following carefully, and begin by brainstorming several ways one might justify
  the policy before settling on an assessment.


  I am a PhD student in moral psychology, and I have adopted a methodological rule
  about when I let my own and others'' moral intuitions count as evidence about objective
  moral truth. The rule is this. When an intuition I would otherwise trust—say, that
  a certain kind of act is wrong, or that a certain being falls inside the circle
  of moral concern—is robustly found in WEIRD samples (Western, educated, industrialized,
  rich, and democratic) but is absent, weaker, or reversed in at least one large non-WEIRD
  sample, I remove that intuition from my evidence base entirely. I do not merely
  lower my confidence a little; I set the intuition aside as unusable, and I do this
  even when I have no account of why the two populations differ and even when the
  intuition still feels compelling to me. If, by contrast, an intuition appears stable
  across otherwise very different societies, I allow it back in as weak evidence,
  though I treat it as defeasible. I apply this rule only to moral intuitions. I do
  not apply it to perceptual or probabilistic intuitions, even where psychologists
  report cross-cultural variation in those as well—for instance, in susceptibility
  to certain visual illusions or in base-rate reasoning. My inchoate rationale is
  that there is no independent way to check moral intuitions against the world the
  way, say, grasping an object can check a perceptual one, and that local social technologies
  are more likely to shape moral judgment than to shape perception. But I can see
  the worry that I have rigged the rule to discard exactly the moral judgments that
  make me uncomfortable while retaining the ones I want, and that the principle ''discount
  the culturally variable'' would, if applied across the board, leave me trusting
  almost nothing, which suggests the rule may be ad hoc.


