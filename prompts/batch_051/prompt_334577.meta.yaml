  Possible belief set:

  (a) I accept a broadly Darwinian inference: complex, flexible, apparently purposive
  behavior (e.g., earthworms plugging burrows) is evidence of some inner life.

  (b) Still, for insects, I doubt they have anything like consciousness; the probability
  of sentience in a given insect is low.

  (c) But in ethics I accept expected-value aggregation: if insects are numerous enough,
  even a low probability of sentience can make their welfare a top priority (the scale
  argument).

  (d) I also accept a kind of epistemic conservatism: low-probability, high-stakes
  claims about moral patienthood should not overturn longstanding practice (farming,
  pest control) without stronger evidence.

  (e) And I hold that moral regard should track probability-weighted interests, not
  binary thresholds.


