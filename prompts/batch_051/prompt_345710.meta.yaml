  Key facts:

  - Endowment effect: In a classic demonstration, randomly giving someone a mug raises
  their minimum selling price relative to the maximum buying price of non-owners.
  Knetsch, Kahneman, Thaler etc. I must not cite. Models know.

  - Loss aversion: losses loom larger than equivalent gains (Kahneman & Tversky).
