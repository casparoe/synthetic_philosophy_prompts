  Background:

  - The bootstrapping problem is an objection to reliabilism (process reliabilism,
  e.g., Goldman). Reliabilism says a belief is justified iff produced by a reliable
  cognitive process. The problem: a subject can apparently acquire justification for
  believing a process is reliable by using that very process. Example: Mr. Truetemp
  (Lehrer) or Roxanne and her gas gauge (Vogel? Actually the gas gauge example is
  from Stewart Cohen''s "Basic Knowledge and the Problem of Easy Knowledge" and Jonathan
  Vogel''s "Reliabilism Leveled"). Roxanne the gas gauge: she believes the gauge is
  reliable; she can read the gauge, reason "the gauge says F, therefore the tank is
  full," and then "the tank is full and the gauge says F, therefore the gauge is accurate
  on this occasion," and by induction conclude the gauge is reliable. Her belief in
  the reliability of the gauge is produced by the reliable process of reading the
  gauge, so reliabilism counts it as justified... wait but is that bad? The problem
  is that this looks objectionably circular: she uses the gauge to confirm the gauge.
  But reliabilism can''t object because the process is in fact reliable. So bootstrapping
  shows reliabilism is too permissive: it sanctions "bootstrapping" to justified belief
  in reliability of a process without independent evidence. The "easy knowledge problem"
  is related: we can gain knowledge of the world via perception without first knowing
  perception is reliable (basic knowledge), and then use that knowledge to argue that
  perception is reliable. Cohen distinguishes "basic knowledge" (knowledge whose source
  is not itself known to be reliable) and claims that reliabilism and even some internalisms
  allow "easy knowledge" through the closure principle: if I know the table is red
  by looking, I can deduce that my color vision is reliable? Hmm. Actually the "easy
  knowledge" problem: closure of knowledge under known entailment plus basic knowledge
  leads to easy knowledge of the reliability of one''s sources. Example: I know the
  table is red (by perception). I know that if the table looks red, then my color
  vision is working correctly? The argument: (1) The table is red. (2) The table looks
  red? Wait deduction: If the table is red and it appears red, then my color perception
  isn''t misrepresenting in this case; repeated cases → reliable. More standard: From
  "The ball is red" and "The ball looks red," one can deduce "Something that appears
  red is red" or "on this occasion my color perception was accurate." Then via many
  samples conclude color vision is reliable. Since closure says I know the deduction
  too, and I know I seem to see red, I can know my color vision is reliable on this
  occasion, then by induction reliable overall. That''s easy knowledge of reliability.
  Basic knowledge: the initial perceptual knowledge doesn''t require prior knowledge
  that perception is reliable. So the problem: either basic knowledge is rejected
  (and we face skepticism) or closure is restricted, or we need to allow easy knowledge.


