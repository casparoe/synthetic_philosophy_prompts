  Argument:


  (1) Epiphenomenalism: phenomenal states (e.g., the feeling of pain) are caused by
  physical states and have no downstream causal effects — on behaviour, on other mental
  states, on anything.

  (2) Knowledge requires that the fact known play an appropriate role in producing
  the belief — at least: if S knows that p, S''s belief that p is caused by (or counterfactually
  sensitive to) the very state of affairs p.

  (3) Suppose epiphenomenalism is true and I am in pain. My belief and report "I''m
  in pain" is itself a physical event, and by (1) it cannot be caused by the pain.
  At best it is caused by the neural state that also causes the pain.

  (4) So by (2), I cannot know that I am in pain.

  (5) The same goes, mutatis mutandis, for the philosopher''s judgment that epiphenomenalism
  is true: the judgment is caused by neural processes, not by any phenomenal state
  or by the truth of the doctrine, so it fails the causal requirement and cannot amount
  to knowledge.

  (6) But someone who cannot know that epiphenomenalism is true — and whose acceptance
  of the theory can be fully explained without the theory''s being true — is not rationally
  entitled to hold it. Adopting the theory severs the evidential link between the
  thinker and the theory.

  (7) Therefore epiphenomenalism, if true, could never be rationally accepted; and
  if false it should not be. So the position is untenable — and more broadly, any
  view that makes some class of facts causally inert immediately makes those facts
  unknowable and assertions about them self-undermining.


