  Argument: epiphenomenalism says phenomenal states have no causal powers. But then:

  1. My belief/report that I am in pain is a physical event, caused by physical antecedents.

  2. The pain itself never plays a role in producing that report.

  3. To know that I am in pain, my state of knowing must be appropriately caused by
  my pain (causal theory of knowledge) or at least counterfactually sensitive to it.

  4. On epiphenomenalism, my pain doesn''t cause my belief, so I cannot know I am
  in pain.

  5. But the same reasoning applies to the epiphenomenalist''s own philosophical judgment
  that epiphenomenalism is true: if it were true, that very judgment would be caused
  by physical states, not by the evidence or by the truth, so it could not be knowledge.

  6. Therefore epiphenomenalism is self-defeating: if true, it cannot be rationally
  held.

