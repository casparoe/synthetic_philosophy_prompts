  ---


  I''m reporting a piece on a state bill that would abolish the statute of limitations
  for certain felonies, and the push for it is mostly technological: DNA that''s readable
  decades later, server logs, phone location data, security cameras that never forget.
  The classic justifications for time limits on prosecution usually include that evidence
  decays (witnesses die, memories smear, paperwork is lost), that after enough time
  a person''s life has moved on and punishing them serves less, and that people who
  have reformed shouldn''t live forever under threat of prosecution. The new argument
  is basically that the first of those justifications is now obsolete for a growing
  class of crimes — the evidence from 1995 can be in some ways better than evidence
  from last month that depends on a shaky eyewitness.


  What I actually want to know is whether the moral argument for statutes of limitations
  survives that development, or whether it just changes shape. Specifically: if evidence
  no longer decays for some crimes, does the justificatory weight shift entirely to
  the "repose" and "rehabilitation" rationales, which were maybe doing less work when
  the evidence rationale looked unavoidable? Does the argument for the time limit
  get stronger or weaker as the other rationales do more work? And is there a repaired
  version that says something like "time matters morally not because evidence gets
  worse but because the relation between the wrongdoer and the wrong changes"?


  I''m interested in the argument, not the bill''s politics. And because I don''t
  want to overclaim in print, tell me how confident you are in the overall answer
  and point out the single move or premise you''re least sure of.


