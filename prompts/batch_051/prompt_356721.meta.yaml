  ---


  I''m a reporter puttering around on a piece about free will and the neuroscience
  of decision-making, and I''ve got a question that''s bugging me. Standard Frankfurt
  cases go like this: Jones is about to decide whether to do something, Black is a
  neuroscientist (or demon, depending on the telling) who has a device rigged to make
  Jones do it if Jones starts to choose otherwise. In the actual run Jones decides
  on his own, Black never pulls the trigger, and yet Jones couldn''t have done otherwise.
  The standard moral: since Jones is still responsible, the principle of alternative
  possibilities is false — you can be responsible for something you couldn''t have
  avoided.


  Here''s the wrinkle I keep chewing on. A lot of modern cognitive science describes
  choice not as a single self that might be overridden, but as a parliament of subsystems:
  a slower deliberative process, a faster impulse-driven one, and a monitoring/veto
  mechanism that would step in and suppress a wild impulse if it crossed some threshold.
  So in a perfectly ordinary decision, the thing that guarantees Jones won''t choose
  otherwise isn''t an external neuroscientist — it''s a subpersonal part of Jones''s
  own mind. If some impulse had started to win, the veto module would have shut it
  down, and in the actual run it sat there doing nothing. Structurally it''s the same
  setup as Black, just moved inside the skull.


  Does the Frankfurt argument survive that translation? On one read, yes: the counterfactual
  controller is inside the skin but outside the "self," so alternative possibilities
  are still missing and responsibility is still there. On another read, this breaks
  the argument, because if the veto is part of who Jones is, maybe the case is really
  about compulsion or self-control, not about whether alternative possibilities matter.
  Or maybe the original case was already confusing about who counts as the agent.


  I want to know what happens to the argument, not the neuroscience lecture. Also,
  since this is for a piece where I don''t want to overclaim: tell me how confident
  you are in your analysis, and name the one point you''re least sure of.


  ---


