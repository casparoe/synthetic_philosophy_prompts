  As a novelist, I keep running into an argument from a physicist friend who works
  with causal models, and I cannot find the exit. My own emerging view is that historical
  fiction presupposes objective causal structure in history; his argument seems to
  show that Pearl''s framework makes such structure vanish. Here it is.


  (1) On Pearl''s causal hierarchy, a claim of form "X caused Y" is determinate only
  relative to a particular structural causal model: a set of variables, a graph, and
  a set of structural equations that assigns a value to each variable.

  (2) For any unique historical event—say, the fall of Constantinople in 1453—there
  is no canonical structural model. One can model the event with different variables
  and different equations, all compatible with the known evidence.

  (3) Counterfactual and actual-causation claims computed within a model have truth
  values only relative to that model.

  (4) Thus if there is no canonical model, then for a historical event such as the
  unbarred Kerkoporta gate allowing the Ottoman entry, whether the unbarred gate caused
  the fall of the city depends on an arbitrary modelling choice.

  (5) If a claim''s truth value depends on an arbitrary modelling choice, it is not
  an objective historical fact.

  (6) But historians and historical novelists cannot do without the idea that some
  such claims are objective historical facts; otherwise every causal statement about
  the past would be as factual as a plot choice.

  (7) Therefore Pearl''s hierarchy implies that the causal claims of serious history
