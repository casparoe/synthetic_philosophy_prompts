  Final:


  As a novelist, I keep running into an argument from a physicist friend who works
  with structural causal models, and I cannot find the exit. My own emerging view
  is that historical fiction presupposes objective causal structure in history; his
  argument seems to show that Pearl''s framework makes such structure disappear. Here
  it is.


  (1) On Pearl''s causal hierarchy, a claim of the form "X caused Y" is determinate
  only relative to a particular structural causal model: a set of variables, a directed
  graph, and structural equations.

  (2) For any unique historical event—say, the fall of Constantinople in 1453—there
  is no canonical structural model. One can model the same event using different variables
  and different equations, all compatible with the known evidence.

  (3) Counterfactual and actual-causation claims computed within a model have truth
  values only relative to that model.

  (4) Therefore, if there is no canonical model, then whether a particular unguarded
  postern gate caused the city''s fall depends on an arbitrary modelling choice.

