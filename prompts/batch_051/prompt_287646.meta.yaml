  Parfit''s hitchhiker (from Reasons and Persons, I think): You are stranded in a
  desert, and a driver offers to rescue you if you promise to pay him $100 when you
  get to town. But he knows you are a rational egoist and knows that once you are
  safe in town you will have no self-interested reason to pay — you''ll renege. So
  he won''t pick you up. The puzzle: it''s in your interest to intend to pay / be
  the kind of person who pays, but you can''t just decide to have a disposition you
  lack, and if you could "rationally" calculate, you''d know you won''t pay. Rational
  irrationality: it would be rational to make yourself irrational (e.g., adopt a disposition
  to keep promises even when it doesn''t pay) because that disposition causes the
  driver to trust you. The paradox: you can''t rationally decide to believe you''ll
  pay when you know you won''t.


