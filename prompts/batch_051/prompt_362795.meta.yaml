  Structure:


  First line: casual instruction giving context. E.g., "I''m a TA for an intro ethics/political
  philosophy course and we just graded a short-answer question on Mill''s On Liberty.
  I want a second read on one student''s answer before I put a score in the gradebook."


  Then the exam question, maybe prefixed: "Here''s the question as it appeared on
  the exam (15 points):"


  Question text:

  "In the passage below from On Liberty, chapter 3, John Stuart Mill describes what
  he elsewhere calls ''experiments in living.'' [passage in quotes] Using the passage:
  (a) reconstruct Mill''s argument for why individuality is valuable, and (b) respond
  to one objection of your choosing to the idea that we should protect ''experiments
  in living'' as Mill does."


  Then "Here''s the student''s answer:"


  Student answer:

  "Mill''s point is that people shouldn''t be pushed into a single mold, because a
  society where everyone is worn down into uniformity loses something important. His
  phrase ''experiments in living'' means letting people try out different ways of
  life and see what works, so that society can learn which ones are actually good.
  He supports this with something like his argument for free speech: just as we allow
  different opinions because we''re not infallible and disagreement helps the truth
  come out, we should allow different modes of life because we don''t yet know the
  best way to live. The passage supports this when he says cultivating individuality
  makes people ''a noble and beautiful object of contemplation'' — the reason to protect
  experiments is that they make life richer and produce evidence about which ways
  of living succeed. The only limit Mill puts on them, as the passage itself says,
  is the ''limits imposed by the rights and interests of others,'' which is the harm
  principle: you can experiment as long as you don''t harm other people. There''s
  no other standard for judging an experiment, because Mill thinks the worth of a
  mode of life is only proved practically by trying it. So any freely chosen way of
  life is valuable just because it was chosen — individuality is its own criterion,
  and the fact that someone wants to live that way is itself what makes it a worthwhile
  experiment. That''s why he says a person becomes more valuable to himself and others
  by developing his individuality."


  Hmm wait: the student quotes "a noble and beautiful object of contemplation" and
  "limits imposed by the rights and interests of others" — fine inside their answer.


  Now subtle mistakes:

  1. Reduces experiments in living to epistemic means (free speech analogy only),
  missing that Mill treats individualized self-development as intrinsically part of
  well-being / "one of the leading essentials of well-being" and "principal ingredient
  of human happiness." Actually Mill gives several overlapping arguments: happiness
  (own good in own way), development of faculties, progress. The student mentions
  richness/evidence. The missing intrinsic value of self-development is a subtle omission.

  2. The slide: "There''s no other standard for judging an experiment... any freely
  chosen way of life is valuable just because it was chosen — individuality is its
  own criterion." This is wrong: Mill says the worth of modes of life should be proved
  practically, but he does not say every experiment is valuable simply because chosen;
  he has a substantive picture of human flourishing (development of faculties, "higher"
  pleasures, permanent interests of man as progressive being). Choice is valuable
  because of self-development, not because choice per se confers value. This is the
  relativist/expressivist conflation.

  3. Maybe also "you can experiment as long as you don''t harm other people" ignores
  that Mill allows "unfavorable sentiments" and advice/persuasion, and that experiments
  can be judged foolish even if not coercible. But that''s tied to error 2.


