  Option A: Domain "Memes and the Darwinian theory of culture" + Type 1 (desiderata).


  Prompt idea: "I keep seeing people gesture at ''memes'' or ''cultural evolution''
  to explain why some ideas/beliefs/practices spread and persist, but I want the spec
  first. What would a genuinely Darwinian theory of culture have to get right? Give
  me the requirements list — the phenomena it must explain, the distinctions it can''t
  collapse (e.g., between copying and reconstruction, between transmission fidelity
  and fitness, between cultural variants spreading because they''re true/useful vs.
  because they''re catchy), the results from cultural evolution/cognitive anthropology
  it can''t contradict — with why each is a requirement, and tell me which requirement
  knocks out the most naive ''memetics'' accounts."


  That''s good. It''s in the weeds, conceptual, doesn''t require search, doesn''t
  ask for citations. It''s the desiderata type.


  Option B: Domain "Memes" + Type 2 (survives development).


  Prompt idea: "The original memetic picture (Dawkins, Dennett) treated cultural items
  as particulate replicators — discrete units copied with occasional mutation, selected
  by mindshare. Since then, cultural evolution research has found that cultural traits
  are often not particulate, transmission is reconstructive rather than high-fidelity
  copying, and much of what spreads does so because of evolved learning biases (conformity,
  prestige) rather than because the variant itself is ''fitter''. Does the Darwinian/meme
  theory of culture survive this? Which premise is under pressure, and is there a
  repaired version that says something weaker but still important?"


  This is excellent. It''s exactly the type 2 structure. It names a well-known argument/theory
  and a specific later development with real bite. It doesn''t require web access.
  It might require the model to know about cultural evolution critiques though — but
  that''s mainstream enough (Richerson & Boyd, Sperber, Aunger). This is strong.


