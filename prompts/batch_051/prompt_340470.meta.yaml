  Please write your entire response as continuous prose, the way you would write an
  email or a letter: no headings, no bullet points or numbered lists, no bold or italics,
  no tables. Begin by thinking through a few edge cases quietly to yourself, and then
  write the procedure and the three worked applications in flowing prose.


