  I am a professor of philosophy, and I also direct a university food-recovery kitchen
  that turns food which would otherwise be discarded into meals for students who struggle
  to afford them. Our kitchen has one firm ethical commitment: we will not support
  the exploitation of animals. Recently, however, we have begun receiving offers of
  animal byproducts that are not straightforwardly the products of commercial farming:
  eggs from a campus sanctuary''s rescued hens, wool from a rescued sheep that must
  be shorn for its own health, and the like. At present my volunteer shift leads decide
  such offers ad hoc, and I need to give them a reusable procedure.


  The kitchen has adopted, as its working principle, a broadly freegan view of these
  cases. On this view, the serious wrong in using animal products lies not in mere
  contact with the product but in the demand that our use creates — the way accepting
  a product props up, funds, or normalizes arrangements that treat animals as resources.
  A byproduct that will exist whatever we decide, and whose use would neither create
  nor signal demand for further exploitation, may be used. I do not need you to defend
  this principle or cite anyone; I need you to translate it into a procedure that
  people without philosophical training can run.


  Please answer as a professional moral philosopher working at the intersection of
  animal ethics and the ethics of consumption, and reason carefully rather than reaching
  for a familiar summary. Before you draft the procedure, think through several edge
