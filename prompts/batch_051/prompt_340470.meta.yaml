  ---


  I am a professor of philosophy who also directs a university food-recovery kitchen.
  We take food that would otherwise be thrown away and turn it into free or cheap
  meals for students, and our kitchen has one firm ethical commitment: we do not support
  the exploitation of animals. Increasingly, though, we are offered animal byproducts
  that are not straightforwardly from exploitative farms — eggs from a campus sanctuary''s
  rescued hens, wool from a rescued sheep that must be sheared for its own health,
  milk from a rescued goat whose kid has just been weaned, honey from a hive that
  was removed from a building rather than exterminated. At present my volunteer shift
  leads decide these offers ad hoc, and I want to give them a reusable procedure.


  The kitchen has adopted, as its working principle, a broadly freegan view. On this
  view the serious wrong in using animal products is not contact with the product
  itself but the demand the use creates — the way taking the product props up, funds,
  or normalizes a system that treats animals as resources. A byproduct that is going
  to exist regardless of what we decide, and whose use would not create or signal
  demand for further exploitation, can be used. I do not need you to defend this principle
  or cite anyone; I need you to translate it into an operational procedure.


  Please write me a decision procedure my shift leads can actually run each time such
  an offer arrives. They are undergraduates with no background in philosophy, they
  have about ten minutes, and these decisions come up once or twice a week. The procedure
  should consist of questions to ask in order, a clear statement of what counts as
  a sufficient answer to each, the point at which the procedure says no, and the point
  at which it hands the decision to me or to a kitchen officer because the remaining
  question is a judgment of values rather than facts. It should be honest about which
  steps are judgment calls dressed up as rules, and about the cases it cannot settle.


  Then run the procedure on three concrete cases for me: accepting eggs from rescued
  hens, accepting wool from a rescued sheep whose fleece will cause skin problems
  if not shorn, and accepting milk from a rescued goat whose kid has been placed with
  a foster doe. At least one of these should come out in a way my volunteers will
  not like, and I want you to say plainly why the procedure yields that result. Also
  tell me what the procedure cannot do — the offers it will inevitably mishandle —
