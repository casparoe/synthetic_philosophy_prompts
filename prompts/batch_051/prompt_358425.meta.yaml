  The Löwenheim–Skolem theorem implies that ZFC (if consistent) has a countable model.
  In that model, there is a set that the model satisfies "is uncountable" (e.g., the
  powerset of the natural numbers, or the set of real numbers). But the model itself
  is countable, so from the outside, that set has only countably many elements. Hence
  "uncountability" is relative to a model. This seems to threaten the absolute notion
  of uncountability and the determinacy of set-theoretic notions like "the real numbers".
  The standard response: within the model, there is no bijection between that set
  and ω because the required function simply isn''t in the model; countability of
  the whole model is seen only from outside, and the "inside" set is uncountable in
  the model because the model lacks certain functions. This is a feature of first-order
  logic, not a contradiction. The philosophical bite: Skolem took it to show that
  set-theoretic notions are inherently relative and that first-order axiomatization
  can''t pin down the intended structure — some philosophers agree, many don''t; there''s
  debate about whether it undermines "absolute uncountability" or just shows first-order
  theories can''t capture it, and about second-order logic''s ability to do better.


