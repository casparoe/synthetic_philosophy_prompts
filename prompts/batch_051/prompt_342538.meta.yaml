  And be self-critical about the reading itself: tell me which part of it you''re
  least confident about — a claim about Malcolm, about Dennett, or about a scene —
  and what consideration would make you flip to a different verdict.


  Hard cap: 800 words. I''d rather have a sharp 750-word reading than a thorough 1500-word
