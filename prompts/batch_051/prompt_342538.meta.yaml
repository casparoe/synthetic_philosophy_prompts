  Draft:


  You''re a philosopher of mind who also writes film criticism. I''m running a small
  movie/philosophy club and next week is Inception. I want to frame it with the Malcolm–Dennett
  debate about whether dreams are experiences, because I think the film is weirdly
  torn on exactly that question.


  Here''s the setup as I understand it (correct me if I''m mangling it). Norman Malcolm
  held that dreams are not experiences at all: a dream report told after waking isn''t
  a report of anything that happened in your mind while you slept, because there''s
  no criterion for something''s being experienced during sleep — the whole practice
  of dream-telling gets its sense from the waking contrast, and you can''t coherently
  say "I am asleep." Dennett comes at it differently: his cassette idea is that even
  if a dream report feels like a recollection of a rich, temporally extended experience,
  the narrative might be composed and "played" at the moment of waking (or around
  then), so nothing was actually experienced in real time during sleep. So both philosophers
  are suspicious of the naive picture, but for different reasons and with different
  consequences.


  Now Inception. The film seems to just double down on the naive picture: dreams are
  full first-person experiences, in real time, with the added fantasy that they''re
  shareable, architected, and filmable. But I can''t shake the feeling that the film
  also hands Malcolm and Dennett a lot of ammunition: the way dreamers can''t remember
  how they got there, the time compression, the way the dreamscape is generated on
  the fly out of the subject''s expectations, the kick as the moment the "recording"
  has to be inserted because that''s when the narrative gets fixed. Or maybe those
  details are doing something else narratively.


  So the task: read Inception against Malcolm and Dennett. Where does the film genuinely
  dramatize or complicate each view? Which scenes does the lens illuminate, and where
  does the honest critic have to admit the film resists the reading or pushes a third
  view? Does the movie amount to a reductio of Malcolm, an unintended advertisement
  for Dennett''s cassette, or something weirder — and what does it add to the philosophical
  debate that the papers alone don''t?


  Before you settle into a reading, sketch two or three candidate readings in a sentence
