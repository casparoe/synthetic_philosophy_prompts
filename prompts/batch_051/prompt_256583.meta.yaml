  ---


  So I just got out of a two-hour argument with my friend about this, and I''m stuck.
  I''ve been attracted to a view he calls lexical threshold negative utilitarianism.
  The idea is: there''s some threshold of suffering intensity, and anything above
  it has lexical priority over everything below it. That means no amount of below-threshold
  pain relief, and no amount of pleasure, can justify allowing even a small amount
  of above-threshold suffering. I like the view because it gives a clean, non-arbitrary-sounding
  answer to the classic cases: it says you can''t torture one person to give a billion
  people a nice afternoon, but it also doesn''t say a pinprick outweighs a lifetime
  of mild contentment, because the pinprick sits below the line and can be traded
  off normally.


  But here''s the thing my friend kept pushing, and it genuinely got to me. The threshold
  has to fall somewhere. Suppose it''s at intensity 10, whatever that means. Then
  a person at 9.9 is in the commensurable zone: their pain can be weighed against
  pleasures and lesser pains. A person at 10.1 is in the lexical zone: their pain
  outranks literally everything below the line. I have a very strong intuition that
  this is wrong. The difference between 9.9 and 10.1 just can''t carry that much moral
  weight. It feels like a sorites line: shave one unit off and suddenly we''re in
  a completely different moral universe. I can''t make myself believe that a billion
  people at 9.9 should be sacrificed to prevent one person from being at 10.1, but
  the view seems to say exactly that (or at least, it says the 10.1 has priority,
  full stop).


  I don''t want someone to just tell me the threshold is vague and call it a day,
  because that feels like it gives up the clean decision procedure I liked. Walk me
  through what it would actually cost to keep the lexical idea but make the line vague,
  what it would cost to replace the threshold with a steep continuous weighting instead,
  and what it would cost to keep the sharp threshold and explain away my 9.9/10.1
  intuition as a bias I should stop trusting. Which of those should I do, and is there
  a version where the theory and the intuition both survive? Keep it under 500 words.


