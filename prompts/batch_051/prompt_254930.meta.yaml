  ---


  I am a novelist, and I am writing a political novel in which a serving minister
  repeatedly faces situations in which the only available means of preventing a serious
  harm appears to be an act that is itself wrong. I want to depict this condition
  with some precision, not as a vague mood of moral compromise, and I need a steady
  working definition to keep the depiction consistent. The term I want defined is
  dirty hands, understood narrowly: not corruption, not hypocrisy, not the ordinary
  trade-offs of office, but the predicament of a political agent who takes a genuine
  wrong upon themselves in the service of something they take to be required, and
  who is not simply exonerated by the necessity.


  I am not asking for a bibliography or an account of who has said what about this;
  I need a definition I can use. Here are the cases the definition must handle, with
  my provisional sense of each.


  1. A president authorizes an operation to sabotage an enemy''s supply line, knowing
  with near certainty that it will kill a civilian worker at the site, because the
  alternative is the fall of a defended city and the loss of far more lives. The operation
  is carried out and the city is saved. I take this to be as central a case of dirty
  hands as there is; whatever the final moral verdict on the act, the concept names
  it.


  2. A city councillor approves a developer''s permit in exchange for a concealed
  campaign contribution; the approval harms no one directly, but it violates a public
  trust. I take this not to be dirty hands at all. It is ordinary wrongdoing — the
