  I''ve been reading the preface to Leibniz''s Codex Juris Gentium Diplomaticus, where
  he defines justice as the charity of a wise person, and charity as love of others,
  and love as taking pleasure in another''s happiness. Something bugging me about
  this, because my own reactions are asymmetric in a way that maybe doesn''t match.
  If a close friend gets wonderful news, I feel genuinely happy—it shows up in my
  mood even when nothing in my own life improved. If a colleague I barely know gets
  the exact same news, I''d say "good for him" and mean it, but no felt pleasure.
  And if I read about a stranger''s good fortune in another country, I feel nothing
  at all. Leibniz''s definition seems to say all three should be love to different
  degrees, but the first feels like love, the second like mere approval, and the third
  like information. Is there a principle within Leibniz''s framework—or in our own—that
  justifies this gradient, or is it just partiality he would want me to expunge? I
  also have a reverse case: when something bad happens to a stranger I barely know,
  I''m not as pained as when it happens to a friend. Is the pleasure in another''s
  happiness and the pain at another''s misery the same asymmetry, or two different
  ones? I want the strongest Leibnizian or post-Leibnizian defense of this pattern,
  and an honest verdict on whether I should try to change my reactions.


