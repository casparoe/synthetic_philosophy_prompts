  ---


  I am a software engineer with no formal background in philosophy, and I have been
  trying to make my views about animal minds more explicit rather than relying on
  intuition. I have settled on a rough checklist that I use before I am willing to
  say that a creature has felt experience of any kind — that there is something it
  is like to be that creature, or at least that things can go well or badly for it
  in a felt way. The criteria I currently use are these:


  1. Nociception or a functional equivalent. The creature has receptors or pathways
  that detect tissue damage or other harmful states.

  2. Not a fixed reflex. The response to a harmful stimulus is modulated by context,
  satiation, learning, or competing goals, rather than being a stereotyped withdrawal.

  3. Learning from negative events. The creature changes its future behaviour after
  an aversive experience in a way that is flexible, not merely associative in a narrow
  sense.

  4. Integration. The creature behaves as a single decision-making system: information
  from different sensory channels is brought together and traded off against one another.

  5. Trade-offs that reveal valuation. The creature will forgo food, mating, or safety
  to escape or avoid a harmful stimulus, which suggests the state carries negative
  weight for it rather than simply triggering a circuit.


  Now take the honeybee. A honeybee has on the order of a million neurons. It navigates
  over kilometres, learns and remembers odours and locations, communicates the location
  and quality of resources to nestmates, and adjusts its behaviour in ways that do
  not look like hardwired reflexes. Yet it is also plausible to describe all of this
  as extremely sophisticated computation with no felt quality behind it — a set of
  tightly optimised control loops.


  I would like you to go through my checklist criterion by criterion and tell me,
  for each, whether the honeybee plausibly satisfies it, where the uncertainty is,
  and what evidence would move the verdict. Then step back and tell me whether the
  checklist itself is doing the right kind of work: is it a reasonable operational
  test for the presence of felt experience, or does it smuggle in assumptions about
  what consciousness is? Would a creature that passes all five criteria be conscious
  in any sense, or only a good simulation of a creature that is? And is consciousness
  even the right category to apply to a bee, or should I be asking a more precise
  question — for example, about pain, or about the capacity for welfare? I am not
  satisfied with a bare yes or no; I want to know which criteria carry the load and
  where the genuine disagreement lies.


  Please write your answer in British English.


