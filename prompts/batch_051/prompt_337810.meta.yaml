  Questions a theory of cultural evolution must answer for "meme" to be more than
  metaphor:


  1. Unit specification: What exactly is the thing that is copied? A behavior, an
  instruction, a norm, a representation in the head? If the "meme" is supposed to
  be a replicator, it needs to be a unit with a determinate identity — what makes
  two instances the same meme? (e.g., is the "Happy Birthday" song a meme, or the
  melody, or each performance?) The theory must give criteria of individuation.


  2. Heredity / copy-fidelity: Replication requires that offspring resemble parents
  due to copying, not due to independent reinvention or convergent reconstruction.
  A theory must distinguish transmission by copying from transmission by triggering
  — e.g., a child watching someone solve a problem could copy the solution or just
  be caused to solve it independently (social learning vs stimulus enhancement vs
  emulation). If cultural items are reconstructed from partial cues each time (Sperber),
  the copying relation is weak, so "replicator" may fail; the theory must handle reconstruction.


  3. Variation and selection: For natural selection to work, variation must be blind
  (or at least not systematically directed toward solutions) relative to the selection
  pressure? Actually cultural variation is often guided; the theory must say whether
  directed variation undermines the selectionist model or is just another process.
  Need to handle Lamarckian inheritance in culture.


  4. Fitness / differential success: define what it is for a meme to be "fit" without
  collapsing into "whatever spreads" — otherwise tautology. Must give non-circular
  account of why some variants spread: content biases, context biases, prestige bias,
  conformity etc. Which are selection and which are biases in transmission? This matters
  because "selection" requires differential survival/reproduction; if all differential
  spread is due to people liking content, that might be more like domestication or
  choice.


  5. Distinction replicator vs vehicle/interactor: memes as instructions (recipes)
  vs the products (cakes). Genes are passed on, phenotypes are not; for memes, what
  you see is the product — the behavior or artifact — but what''s copied may be the
  underlying recipe/idea. Must not conflate "the cake" with "the recipe"; if memes
  are "ideas" not artifacts, theory must show how they''re copied from products.


  6. High-fidelity vs error: Cultural transmission is noisy. A theory must explain
  cumulative culture (improvements accumulating over generations) despite low fidelity,
  or show that fidelity is higher than it looks. Ratchet effect: cumulative cultural
  evolution seems to require faithful enough transmission; theories that emphasize
  constant mutation must explain how adaptive complexity grows rather than dissolves.


  7. Blending inheritance: cultural items often blend (two recipes combined) rather
  than particulate; if inheritance is blending, variation is lost, so how do memes
  maintain variation?


  8. Ontogeny/psychology consistency: must be consistent with known cognitive biases
  and imitation mechanisms — not postulating exact copying where psychology shows
  systematic distortion (e.g., memory schemas regularizing stories toward stereotypes).
  The theory must handle systematic transformations (attractors).


