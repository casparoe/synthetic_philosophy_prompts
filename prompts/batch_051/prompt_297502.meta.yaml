  Draft:


  I got roped into adjudicating a long-running disagreement between two people in
  my building, and I want a professional philosopher''s take on it. One of them, Sana,
  is basically an orthodox welfarist—she thinks all value has to bottom out in how
  lives go for the creatures living them, and that "prosperity" is only ever shorthand
  for stuff that tends to make lives go better. The other, Ezra, thinks abundance
  can matter in itself, or at least in ways that don''t reduce to the wellbeing it
  causally delivers. The argument happened in our building''s shared courtyard, so
  I''m reconstructing it as best I can from memory.


  Ezra opened with a twin-world case. In world A, everyone has a decent baseline and
  the total well-being ends up exactly equal to world B. But world A is lean: just
  enough capacity, no slack. World B has enormous surpluses—unread libraries, spare
  hospital wings, empty trains running, unexercised legal rights, tools nobody ever
  picks up. He said world B is plainly better, and that shows abundance has value
  over and above what it buys. Sana answered that the case can''t separate the two
  kinds of value, because surplus changes expectations, security, and opportunity.
  If we truly stipulate that the slack will never affect anyone''s life in any possible
  way, she said, it''s just expensive rust, and nobody values that. Ezra said the
  stipulation is doing all the work in her favor: being a society with slack just
  is a different fact about people''s lives, so you can''t stipulate it away while
  keeping the world the same.


  Then Sana pressed the options point. An unexercised option, she said, can have value
  only in three ways: it is felt as freedom by the person who has it; it functions
  as insurance against future uncertainty; or it eventually gets exercised. Strip
  all three away and nothing remains. Ezra replied that this is a bait-and-switch:
  she keeps the label "value" for welfare only, but an unused passport still makes
  a person free, and a free person is better off even if equally cheerful. Sana said
  that either unpacks, again, into the person''s subjective experience of their situation
  or into future possibilities, and there''s no third thing of the sort Ezra keeps
  gesturing at.


  At the end Ezra shifted to future generations. A society that bequeaths its descendants
  far more capability than they''ll ever use—extra knowledge, redundant infrastructure,
  room to veer—gives them something even if their well-being would be identical either
  way: it leaves them not locked in. Sana said "not locked in" is itself a welfare-relevant
  fact, so he''s only discovered a further component of what makes lives go well,
  not a value beyond welfare. Ezra said at that point that she was relabeling his
  point and refusing to take it on its own terms.


