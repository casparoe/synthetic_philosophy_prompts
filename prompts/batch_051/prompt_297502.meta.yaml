  I got roped into judging a prolonged debate between two of my neighbors, who are
  both sharp but talk past each other a lot. One of them, Sana, is broadly a welfare
  consequentialist; the other, Ezra, thinks something important is lost when you only
  value prosperity for the happiness it produces. The argument happened in our building''s
  shared courtyard, so I am reconstructing it as best I can.


  Ezra opened with a version of this thought: if two worlds had exactly the same total
  well-being, but in one everyone lived at a bare but satisfied minimum and in the
  other there was a huge social surplus—unread libraries, spare hospital wings, unused
  public transit, people with options they never take—the surplus world is still better.
  He said this shows abundance matters over and above what it buys. Sana replied that
  his thought experiment can''t distinguish intrinsic from instrumental value: a surplus
  betters a society only because it insures people against shocks and opens doors
  that might someday be needed. If we really stipulate that the surplus will never,
  in any possible way, impinge on anyone''s life, she said, it is just expensive rust,
  and nobody actually values that. Ezra said that''s exactly the move he''s worried
  about: she''s making a stipulation that destroys the thing under discussion, because
  being awash in options is itself a fact about people''s lives.


  Then Sana pressed on options. She said options are only worth something in three
  ways: they produce pleasant feelings of freedom, they provide insurance, or they
  get exercised. If an option is never felt, never needed, and never used, it contributes
  nothing. Ezra answered that she is sneaking in a welfarist standard: the option
  has value because it makes a person the kind of creature with a bigger range of
  genuine choices, the way we think a free person with an unused passport is better
  off, not merely happier, than someone who is equally content but cannot leave. Sana
  said that either unpacks into the person''s experienced sense of their situation
  or into future possibility, and there is no third thing.


  At the end, Ezra shifted to future generations: he said a society that bequeaths
  a huge stock of capabilities to its descendants—more knowledge that anyone will
  need, more tools than anyone will use, more room to change course—gives them something
  even if their welfare would be identical either way, namely a condition of not being
  locked in. Sana said "not being locked in" is itself a welfare-relevant fact, so
  he still hasn''t produced a value beyond welfare; at best he''s shown that people
  value optionality as one part of welfare. Ezra replied that this is just relabeling
  the same thing and refusing to take it on its own terms.


  They both turned to me. Can you act as an expert moral philosopher and adjudicate
  the exchange move by move: where each one is right, where each overcorrects, and
  who has the better overall case? Please first restate the best version of each side
  (the principle of charity) before you deliver the verdict, and be clear about what
  both of them might be missing. I''d like the whole answer in American English.


