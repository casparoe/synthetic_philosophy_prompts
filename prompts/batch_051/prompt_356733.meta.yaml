  I grew up in a church that was all about Paul—grace through faith, not works, "lest
  any man should boast"—and my whole family sort of treated the book of James as the
  awkward one you had to explain away. But last spring I started volunteering with
  my cousin at a food pantry and we''ve been reading James together on slow days,
  and now I genuinely dont know what I think.


  The part that keeps snagging me is James 2:18-22 (KJV):


  "Yea, a man may say, Thou hast faith, and I have works: shew me thy faith without
  thy works, and I will shew thee my faith by my works.

  Thou believest that there is one God; thou doest well: the devils also believe,
  and tremble.

  But wilt thou know, O vain man, that faith without works is dead?

  Was not Abraham our father justified by works, when he had offered Isaac his son
  upon the altar?

  Seest thou how faith wrought with his works, and by works was faith made perfect?"


  Here are my gut calls on actual people, and I want to know if there''s one principle
  behind them or if I''m just being inconsistent.


  - My uncle Ronnie can recite every creed, cries at worship songs, and says he''s
  saved. He also cheats his employees on overtime and hasnt helped another person
  once that I know of. I think James is right that his faith is dead.

  - Our neighbor Marta never goes to church and says she''s not religious, but she''s
  the one who organized meals for the family down the block when their house burned
  and she took in her ex''s kid last year. I think what she does is good, but I dont
  think James is claiming her as justified, and I''d hesitate to say she''s saved.
  That feels inconsistent with what I said about Ronnie and I can''t put my finger
  on why.

  - There''s a guy at church who runs the clothing drive and is always posting about
  it, and everyone thinks he''s the model Christian. I know him well enough to know
  he does it to be seen and he''s privately cruel to his wife. I think his works don''t
  count the way Grandma''s did.

  - My grandmother could barely articulate what she believed and admitted she had
  doubts, but her whole life was quiet, practical care—rides to appointments, meals,
  sitting with people who were dying. When I read "I will shew thee my faith by my
  works" I think of her, and I think she had more of whatever saving faith is than
  Ronnie or the clothing-drive guy.

  - On the other hand, I can''t shake the deathbed case: a genuinely cruel 80-year-old
  who, in his last week, is terrified, repents for real as far as I can tell, and
  says he trusts Christ, but has no time for a changed life. My old church said he''s
  saved by faith alone. My current gut says fine, but I don''t see how to fit that
  with James 2:22 saying Abraham''s works made his faith "perfect"—as if the works
  complete the faith, not just prove it.


  If I had to state my principle it''d be something like: real, saving faith is an
  inner state that reliably shows up in actions, and actions without that inner state
  don''t count. But then what does "by works was faith made perfect" add, and do I
  have to give up the deathbed case or the Marta case? What principle do you get out
  of that passage, stated precisely, and which of my verdicts does it force me to
  drop?


