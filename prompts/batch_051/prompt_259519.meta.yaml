  The "Löbian obstacle" to self-trusting agents: An agent that reasons about its own
  reasoning using a sufficiently strong formal system (like Peano arithmetic) encounters
  a problem from Löb''s theorem. The agent wants to trust its own reasoning: "If I
  prove P, then P." Intuitively, an agent should be able to assert "whatever I can
  prove is true." But Löb''s theorem shows that a formal system can prove "if P is
  provable, then P" only in trivial cases (when P is already provable). Thus a system
  cannot prove the soundness of its own proofs in general. So an agent cannot establish
  its own reliability in a principled way, at least not via this reflection principle.
  This poses an obstacle: self-trust seems to require a reflection principle, but
  formal systems can''t prove it. There are various responses: (a) the obstacle is
  real and deep, implying agents must be constructed with self-trust as an axiom or
  built-in, or must reason with probabilistic notions of expected reliability; (b)
  the obstacle is an artifact of treating agents as deductive systems proving arithmetical
  statements; real agents don''t need to prove their own soundness, they can have
  different logic (non-monotonic, probabilistic), or they can self-modify in a way
  that avoids Gödelian traps; self-trust is a practical heuristic, not a theorem.


