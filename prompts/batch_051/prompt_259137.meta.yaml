  "collective agents" with coherent attitudes without some special institutional structure;
  later they argued groups can be agents but need aggregation functions that avoid
  the dilemma, with costs (dictatorship, etc.). The analogy: "the committee as a single
  mind" breaks because majority voting over propositions can yield inconsistent collective
  attitudes that no individual member would hold; so treating a group as having beliefs/desires
