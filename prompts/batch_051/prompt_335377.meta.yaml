  Exam question draft:


  "Question (upper-level undergraduate, philosophy of computation): ''It is sometimes
  argued that as large language models write an increasing share of code, programming
  languages will stop mattering, because natural language is becoming the new programming
  interface. Assess this argument. In your answer, distinguish at least two roles
  a programming language can play, and say which of those roles, if any, are eroded
  by machine generation and which, if any, survive or become more important. Reach
  a definite conclusion.''"


  Student answer draft:


  "The argument is right in one important respect. Programming languages have always
  served as an interface between a human and a machine, and the LLM sits inside that
  interface: the human now gives an informal natural-language description, and the
  model produces the ceremonial syntax that the compiler or interpreter demands. In
  this sense the human-facing role of the language clearly shrinks. Just as programmers
  ceased to think about assembly once compilers improved, they will cease to think
  about Python or Java once models improve; the language becomes what assembly became,
  a generated target format that only specialists inspect.


  Despite that, I would not say languages will stop mattering entirely. They will
  matter for the foreseeable future for a pragmatic reason: models are trained overwhelmingly
  on code written in existing languages, and the surrounding toolchain — parsers,
  linters, package managers, debuggers, CI systems — is built around them. A model
  that refused to emit code in one of these languages would lose the benefit of that
  ecosystem. But this dependence is transitional. Once generation and verification
  improve enough, the ecosystem can be rebuilt closer to the internal representations
  models use, and the source language will be disposable.


  So my conclusion is that the long-term importance of programming languages declines
  sharply, and the interesting design problems migrate to natural language: how to
  phrase requirements precisely enough for a model, how to detect ambiguity and underspecification
  in a prompt, and how to build interfaces that let a human steer generation. What
  matters is specification, not notation."


