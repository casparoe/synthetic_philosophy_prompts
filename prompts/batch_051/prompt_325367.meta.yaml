  ---


  A friend and I spent a long evening arguing about whether excellence is ever good
  in itself, and I came away less settled than I expected. We kept circling back to
  a single kind of case: someone who brings a skill to an extraordinary standard in
  total obscurity — a pianist who performs for no one, a composer whose pieces are
  never heard, a mathematician who solves a hard problem and then destroys the proof.
  My friend insisted that these are only hobbies dressed up with a word like "excellence".
  He argued that excellence makes sense only inside a shared practice, where standards
  can be recognised, where one person''s work can answer to another''s judgement,
  and where the exercise of a skill can benefit somebody. I found his conclusion too
  quick, but I could not say exactly where it went wrong.


  I would like an essay that works this out properly. The question is this: can an
  achievement be genuinely valuable when it benefits no one other than the achiever
  and is known to no one other than the achiever? Throughout, keep two distinctions
  separate rather than letting them run together. First, distinguish the excellence
  of the performance or outcome (meeting a demanding standard) from the achievement
  of the agent (having brought that outcome about through effort or skill). Second,
  distinguish the value the achievement has for the achiever from any value it might
  be thought to have impersonally, apart from anyone''s particular interests.


  Weigh the strongest arguments on each side. On one side is the instrumentalist claim
  that for something to be good, its goodness must show up in someone''s life — as
  welfare, enjoyment, recognition, or usefulness — and that a wholly private, fruitless
  excellence never does. There is also a subtler variant of this objection: that standards
  of excellence are constitutively social, so that work to which no shared judgement
  could ever answer is not really achieved or excellent. On the other side is the
  perfectionist claim that some things are worth doing to a high standard simply because
  they are done well, even if no one ever reaps anything from them. Do not end on
  a non-committal note; defend a qualified verdict if that is where the argument leads,
  but make it a verdict.


  One further test: consider a variation in which the achiever later loses all memory
  of having done the thing. Would that strip the achievement of its value, or merely
  remove the satisfaction of recalling it? Use your answer to make explicit whether
  you are locating the value in the doing, in the state of having done it, or in the
  later enjoyment of it.


  A request about intellectual posture: throughout, keep separate what is settled
  from what is genuinely contested among people who work on this topic. If a step
  in your argument depends on a contested premise — for instance, whether value must
  always be value for someone — mark it as contested rather than treating it as obvious,
  and do not present one side of a live dispute as though it were the consensus. I
  am not after scholarly apparatus or a reading list; the argument should stand on
  its own terms.


