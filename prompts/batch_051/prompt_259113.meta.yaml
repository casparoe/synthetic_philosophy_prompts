  ---


  I spent my working life as a physical chemist, and only in retirement have I begun
  reading philosophy of mind seriously. Clark and Chalmers made precise something
  I always felt about laboratory work: an instrument, after long two-way use, becomes
  part of the thinking rather than a mere aid. The passage that names this for me
  is from Andy Clark and David Chalmers, "The Extended Mind," Analysis 58 (1998):


  "In these cases, the human organism is linked with an external entity in a two-way
  interaction, creating a coupled system that can be seen as a cognitive system in
  its own right. All the components in the system play an active causal role, and
  they jointly govern behavior in the same sort of way that cognition usually does.
  If we remove the external component the system''s behavioral competence will drop,
  just as it would if we removed part of its brain. Our thesis is that this sort of
  coupled process counts equally well as a cognitive process, whether or not it is
  wholly in the head."


  Now suppose a university acts on this. In a set of science and humanities courses,
  it abolishes the closed-book timed examination and substitutes what it calls a coupled-resource
  examination. A student may bring in any external resources she likes — notebooks,
  reference works, a laptop running locally installed software, card files, the lot
  — provided that, before the examination, she satisfies an invigilator that each
  resource is coupled in the authors'' sense: she has used it routinely in the course
  (not merely assembled it the night before), the interaction is two-way (the resource
  bears her annotations and revisions, and she can show that she has used its stored
  contents to change her answers or methods at least once), and removing it would
  measurably degrade her competence on tasks of the kind the course teaches. The examination
  questions are to be written so that a bare look-up cannot answer them.


  I do not ask whether this is a defensible reading of Clark and Chalmers, nor whether
  the policy is just or wise. Treat it as a mechanism and tell me how it would actually
  behave. What would it incentivize among students — in how they spend their study
  time, in the size and design of the "coupled" resources they bring, and in how they
  perform coupling for an invigilator? What would it push instructors to do in the
  way of question design, and what happens to the content courses can credibly test?
  Where does it get gamed first: in the construction of the resource, in the one-off
  observable interaction, in the claims about what the resource lets a student do,
  or somewhere else? And, finally, are the failure modes fixable by tightening the
  coupling test and the question-design constraint, or does tightening merely move
