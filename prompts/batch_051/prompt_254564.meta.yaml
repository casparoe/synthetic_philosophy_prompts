  Domain: Self-deception. Type: argument.


  Prompt:


  "An argument a friend showed me seems to prove that self-deception can''t exist,
  but I suspect it proves too much because it also seems to rule out confirmation
  bias. Premise 1: Self-deception is just lying to yourself, and lying requires the
  liar to believe not-p while intending the audience to believe p. Premise 2: For
  you to count as self-deceived, you must at some level register the evidence against
  p, otherwise it''s not deception, just ordinary error. Premise 3: If you register
  the evidence against p, you believe not-p (or at least update on it), while also
  coming to believe p. Premise 4: That''s two contradictory belief states in one mind
  at the same time, and no integrated cognitive system can stably maintain two contradictory
  propositional attitudes about the same subject matter. Premise 5: So self-deception
  is impossible. But wait: the same move seems to work against motivated cognition
  generally. Replace ''evidence against p'' with ''reasons to think your favorite
  policy is bad'' and you''d get: no one can engage in confirmation bias while at
  some level registering the counterevidence, because that would be contradictory
  too. But confirmation bias definitely happens, so something in the transfer must
  break. Where does this argument go wrong? Is there a difference between self-deception
  and confirmation bias that the argument misses, or does it succeed against both
