  Program equilibrium: The idea: in a Prisoner''s Dilemma-like situation, if each
  player can commit to a program that takes the other''s source code as input, then
  mutual cooperation can be an equilibrium, because each program can be designed to
  cooperate iff the other program cooperates (or defects iff the other defects). It''s
  a formalization of "I''ll cooperate if you cooperate." It relates to superrationality,
  Newcomb''s problem, transparent Newcomb, Löb''s theorem, etc.


