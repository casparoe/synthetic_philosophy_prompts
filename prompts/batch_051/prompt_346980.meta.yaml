  coffee is like for me now, and they started arguing about what''s actually going
  on with me." That''s fine; the asker isn''t a party to the argument, just the case
  under discussion. They don''t signal favoring either side.


  Dialogue:

  (1) Maya: Look, obviously the taste changed. You used to get that round chocolaty
  smell, now it''s burnt cardboard. That''s a change in the experience itself, not
  a preference. He''s not choosing to dislike it.

  (2) Leo: That''s too fast. The molecules hitting his nose are the same. What probably
  happened is the taste is intact but his reward system got knocked out by the virus,
  so the same experience just doesn''t hit anymore. Liking is downstream of tasting.

  (3) Maya: But that''s unfalsifiable from the inside. If you tell him "same taste,
  different liking," and I tell him "different taste," nothing in his experience can
  arbitrate between us. And if no first-person fact settles it, the taste/liking distinction
  is doing no work.

  (4) Leo: The fact that he can''t introspectively settle it now doesn''t mean there''s
  no difference. There are dissociations — you could test palatability circuitry vs
  sensory cortex. And "I can''t tell" doesn''t make it untrue.

  (5) Maya: Sure, but that''s physiology, not experience. The whole point of qualia
  is the "what it''s like" as something given to the subject. If the subject can''t
  distinguish a raw feel from an attitude toward that feel, then the raw feel as an
  isolatable thing is a myth — this is Dennett''s Chase and Sanborn thing, two tasters
  both insist something changed, one in the flavor and one in his standards, and neither
  can tell from the inside which is right.

  (6) Leo: But you''re sliding from "he can''t say which" to "there''s nothing it''s
  like." He still has experiences; they''re just hard to classify. Conflating epistemology
  with metaphysics is a fallacy, and anyway Dennett''s argument proves at most that
  introspection is unreliable, not that experience is incoherent.


