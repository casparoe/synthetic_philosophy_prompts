  After a long argument about a passage from Charles Mackay’s *Memoirs of Extraordinary
  Popular Delusions* (1852), I’m trying to work out whether my own reactions to cases
  of crowd-following form a coherent view or just a set of unprincipled judgments.
  The passage my friend kept returning to is:


  “In reading the history of nations, we find that, like individuals, they have their
  whims and their peculiarities; their seasons of excitement and recklessness, when
  they care not what they do. We find that whole communities suddenly fix their minds
  upon one object, and go mad in its pursuit; that millions of people become simultaneously
  impressed with one delusion, and run after it, till their attention is caught by
  some new folly more captivating than the first.”


  My friend claimed that this sort of “madness” is mostly rational inference from
  what other people do, not a distinctive failure. I resisted that, but when he pressed
  me on cases, my verdicts came out like this.


  Two restaurants are side by side; one is nearly empty and the other has a line of
  locals. I think it is reasonable for a traveler to join the crowded one, because
  the other diners are displaying information about quality.


  In a bank panic, I think a depositor who sees others withdrawing is rational to
  withdraw too, even if the bank was sound before the run, because partial reserve
  banks cannot pay everyone at once and his claim is worse if he waits. I also think
  the run as a whole is a disaster and something has gone wrong, but I can’t locate
  a wrongdoing by any particular depositor.


  During the Dutch tulip mania, I think the late buyers who paid enormous sums for
  bulbs because prices had been rising were not behaving rationally in the same way;
  they were buying only to resell, with no outside anchor for the underlying value,
  and the price history itself was their main evidence.


  In a sequential vote by an admissions committee, if two earlier members have voted
  reject and the third member’s private information strongly favors admit but is not
  decisive, I think the third member is making an epistemic error by voting reject
  just to go with the majority; but if her private signal is weak, I think it is excusable
  and perhaps right.


  If a novice investor watches large sophisticated funds taking a position and follows
  them despite his own analysis pointing the other way, I am torn: if the funds have
  a track record, this seems reasonable; if he knows he has done more research on
  this particular company, it seems like a failure to use his own evidence.


  When everyone in a social circle adopts a slang word or a fashion I find pointless,
  I don’t think that is justified by any information about the quality of the fashion;
  I think it is mere conformity and I judge it harshly.


  When a layperson defers to a scientific consensus on something like vaccines or
  climate, I think that is rational and not an instance of the Mackay delusion, even
  though it is also a case of going with the crowd.


  When a crowd in a burning theater rushes toward one exit and I don’t know the layout,
  I think following them is rational; but if I see smoke near that exit, I should
  not follow them, and I think the others may be in the grip of a panic rather than
  a clean cascade.


  The pair I can’t make cohere is the restaurant case and the bank panic on one side,
  and the tulip mania on the other. All three are cases in which people infer something
  (quality, solvency, future price) from the actions of others; I want to say the
  first two can be rational while the third is not, but I cannot yet state the difference
  in a way that doesn’t feel ad hoc. The same difficulty arises between the committee
  member with weak information and the investor who suppresses his own detailed research.


  Is there a principle, or a small set of principles, that captures these verdicts
  and says exactly when following others is epistemic or practical rationality and
  when it is something more like Mackay’s delusion? If not, which of my verdicts should
  I abandon? And what would your principle say about a case I did not list: a person
  who joins a long queue at an unfamiliar airport security line rather than a shorter
  one, simply because it is long?


