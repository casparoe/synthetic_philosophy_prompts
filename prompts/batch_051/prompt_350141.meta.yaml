  "They''ve agreed to produce an adversarial-collaboration document rather than keep
  talking past each other, and they''ve asked me to draft it. Please write it. Start
  with a numbered list of claims both can sign—about what the selection equations
  do and don''t imply, what ''optimizer'' would have to mean for the claim to be interesting,
  and what the standard counterexamples do and don''t show. Then a disagreements table
  where each row states a residual disagreement in a phrasing each side would accept
