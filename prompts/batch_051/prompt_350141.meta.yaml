  once you leave strict assumptions" — is this a known fact? In population genetics,
  mean fitness is not maximized under frequency-dependent selection, epistasis, etc.
  There''s a known result: with weak selection and random mating and fixed genotypic
  fitnesses, mean fitness increases (Fisher''s fundamental theorem, and more rigorously
  under certain conditions mean fitness is maximized at equilibrium for one locus
  with constant selection). With multiple loci, recombination can break this. Saying
  "mean fitness is not a Lyapunov function" is roughly correct but uses the term "Lyapunov
  function" — small LLMs may not know it? It''s a standard math term. The user said
  avoid niche theories LLMs won''t know; "Lyapunov function" is somewhat technical
