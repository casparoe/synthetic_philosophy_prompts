  Draft:


  "I co-run a reading group that''s half ML people and half evolutionary biologists,
  and two members have spent months arguing about whether ''evolution is basically
  gradient descent on a fitness landscape'' is a useful idea or a category mistake.
  The optimizer camp keeps pointing out that under the standard population-genetic
  assumptions, the change in allele frequencies is literally proportional to the derivative
  of mean fitness with respect to the frequencies, so selection really is following
  a gradient. They''ll grant that the objective is noisy, non-stationary, and sometimes
  self-modifying, but they say that''s just a harder optimization problem, not a reason
  to abandon the metaphor. The skeptic camp says that''s exactly where the metaphor
  does harm: when fitness is frequency-dependent or epistatic, the ''landscape'' isn''t
  a fixed surface the population moves on—it''s rebuilt by the very frequencies that
  are changing, like a rubric that rewrites itself while it grades. They also point
  out that mean fitness is known not to be a Lyapunov function once you leave strict
  assumptions, so the ''selection-as-hill-climbing'' picture can fail even in simple
  models."


