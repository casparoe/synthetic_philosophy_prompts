  "I''m a PhD student in phil language, and I''ve talked myself into defending a strong
  version of Russell''s line from On Denoting. The part I keep coming back to is this:


  <quote>


  ''Everything, nothing, and something are not assumed to have any meaning in isolation,
  but a meaning is assigned to every proposition in which they occur. This is the
  principle of the theory of denoting I wish to advocate: that denoting phrases never
  have any meaning in themselves, but that every proposition in whose verbal expression
  they occur has a meaning. The difficulties concerning denoting are, I believe, all
  the result of a wrong analysis of propositions whose verbal expressions contain
  denoting phrases.''


  I read that as a claim about the division of labor in a semantic theory: quantificational
  expressions don''t have freestanding meanings — they do their work only by constraining
  how the rest of the sentence is interpreted. My view is that Russell was right about
  this at the level of the logical form and that the same point generalizes to definite
  descriptions: ''the F'' isn''t a referring expression whose job is to pick out an
  object, it''s an instruction to build a quantificational condition (existence plus
  uniqueness) that the rest of the sentence plugs into. The fact that descriptions
  often feel referential in conversation (familiar discourse referents, anaphora,
  etc.) should be handled downstream — pragmatics or dynamic layer — not built into
  the semantics.


  I want to know what would actually count against this view, not just what would
  annoy a Russellian. Give me a JSON object with the following schema: ''restatement''
  (one sentence, my view as you''d steelman it), ''defeaters'' (an array of objects,
