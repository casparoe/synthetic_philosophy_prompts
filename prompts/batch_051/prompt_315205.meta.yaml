  The hole argument in brief: In a generally covariant theory, take a region (the
  "hole") where no matter is present. Apply an active diffeomorphism that''s identity
  outside the hole and nontrivial inside, mapping metric field g to g'' = φ*g. Substantivalism
  (the manifold''s points are real objects) says g and g'' represent distinct physical
  possibilities (the field is distributed differently over the points). But determinism
  fails: the state outside the hole can''t determine which of g or g'' obtains inside.
  Since determinism should hold, substantivalism must be rejected (or you must accept
  indeterminism), or points lack primitive identity, or the models are gauge-equivalent.


  Key premise: the manifold M is a set of points with primitive identity; diffeomorphisms
  slide fields over these points; the substantivalist is committed to points as entities.


  In causal set theory: fundamentally, spacetime is a discrete partial order (a causal
  set) of elementary events. There''s no manifold of points underlying the dynamics;
  conversely, the events aren''t a substance over which something else lives — the
  events are the structure. A hole diffeomorphism has no analogue because there are
  no continuous field configurations over a fixed set of points; you can relabel events,
  but relabeling is not a physical transformation. Also, the dynamics is "background
  independent" — no fixed M. So the question: does the hole argument survive in this
  discrete setting? Does it reappear in the continuum approximation? Is there a discrete
  analogue: two causally isomorphic but distinct labeled causets related by a relabeling?
  Standard response in causal set theory: labels are gauge; only the isomorphism class
  is physical. The hole argument''s bite was about space-time points; causal set theory
  may dissolve it, or may just relocate it to the emergence of continuum: when a continuum
  manifold is recovered, are the emergent points gauge-dependence? Maybe the philosophical
  lesson is actually reinforced: points are just gauge, confirming sophisticated substantivalism.


