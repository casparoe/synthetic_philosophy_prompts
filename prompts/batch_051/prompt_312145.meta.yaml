  I''m a novelist, not a policy person, and I''m drafting a near-future novel set
  in a state that decides to stop waiting for the cooperative future Mill predicted.
  There''s a passage in John Stuart Mill''s Chapters on Socialism where he says, roughly,
  that if mankind keeps improving the form of association likely to predominate is
  not the capitalist boss with wage workers who have no voice, but workers collectively
  owning the capital and working under managers they elect and can remove. I keep
  reading that and wondering: what would actually happen if a government tried to
  legislate that form into existence, not as a vague goal but as a hard statutory
  phase-in? So here is the mechanism in my book. Any firm with fifty or more full-time
  employees that has operated for five consecutive years must transfer at least fifty-one
  percent of its voting shares to a worker cooperative trust. The trust''s shares
  are held in equal individual accounts for all employees who have been there at least
  six months, but voting is one-worker-one-vote, not one-share-one-vote. Managers
  are elected for two-year terms by the workers and can be recalled by a simple majority
  vote at any time. Outside investors and founders may keep non-voting preferred shares
  with dividends capped at eight percent, and the conversion is financed by a ten-year
  payroll tax credit if the workers buy out the owners at a state-board assessed value.
  Firms that fall under the threshold after the law passes get the same credit if
  they convert voluntarily. Walk me through how this thing actually behaves. What
  does it incentivize for founders, for incumbent owners, for managers, for workers,
  for investors, and for firms just below the threshold? Where does it get gamed first,
  and by whom? I''m especially interested in subtler stuff: whether workers will sell
  or leverage their accounts, whether managers become captured by workers or by the
  state board, whether the preferred-share cap creates weird financing, whether firms
  reorganize work to avoid employees or stay small. Second-order effects too: what
  happens to wages, hiring, innovation, firm size distribution, maybe even to who
  gets to be an employee. And can any of these failures be fixed without gutting the
  part Mill actually cared about, the shift in authority and ownership? I want the
  analysis to be useful for the novel, so be specific enough that I can turn it into
  plot points, but don''t just tell me it''s a utopia or a disaster; treat it as a
  mechanism and tell me where the stress points are.


