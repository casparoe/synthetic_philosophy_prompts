  Let me outline steps:


  (1) A rational agent, at any moment, should care about the total quality of her
  life, and should be temporally neutral: a benefit''s location in time, considered
  merely as a date, is not a reason to count it for more or less.

  (2) But an agent cannot actually live from a temporally neutral standpoint: her
  deliberations, plans, and motivations are enacted from a particular time, and she
  can only act on reasons available to her now.

  (3) Therefore what she has reason to do now is not necessarily what a temporally
  neutral evaluator would prescribe; the agent-relative constraint of living in time
  is a legitimate source of reasons.

  (4) But if that is right, we can''t say "temporal discounting is simply a bias";
  some discounting of future consumption/experiences is just the shadow cast by the
  fact that future selves are not literally co-present with the present self.

  (5) However, from the inside, the present-self''s disproportionate weight feels
  exactly like a bias: the future self has no less reality, no less capacity for welfare,
  and no less claim just because it is not now.

  (6) Conclusion: therefore, the only defensible discounting is "pure social time
  preference" because a planner over persons must respect that each person''s standpoint
  is temporally located, and aggregating across times without discounting would impose
  an incoherent, God''s-eye view.


