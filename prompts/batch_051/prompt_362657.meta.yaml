  The argument:


  1. A unit of welfare has the same value no matter when it occurs; the "when" is
  an indexical feature of the event, not a feature of the welfare itself.

  2. Nonetheless, practical reasoning is always conducted from a particular temporal
  location. An agent cannot select among alternatives from the standpoint of eternity;
  she chooses from now, with the future only dimly available as possible outcomes
  of present actions.

  3. Therefore, it is rationally permissible for an agent to give a certain structural
  priority to present and near-term concerns: not because present welfare is intrinsically
  more valuable, but because those concerns are the only ones her present actions
  can directly engage or reliably influence.

  4. If such present-priority is rationally permissible for an individual, then discounting
  future welfare at a modest positive rate is not automatically a bias; it can be
  the shadow of situated agency rather than a failure of impartiality.

  5. The same situatedness applies to any generation in a transgenerational policy
  problem. No generation can act from the standpoint of all times at once; each generation''s
  present is the locus of its practical reasoning.

  6. So a planner who sets intergenerational policy without applying any pure time
  discount is not being impartial; she is pretending to occupy a standpoint no agent
  can occupy. Therefore a positive pure rate of time preference is rationally defensible
  in intergenerational choices.


