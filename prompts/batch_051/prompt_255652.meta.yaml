  ---


  I serve on the Probabilistic Risk Assessment Committee of a national energy safety
  regulator. We license advanced reactor designs whose novel components can fail in
  ways for which little or no directly relevant operating history exists. Licensees
  must submit a quantified risk model as part of their safety case, and our current
  guidance says only that they must use "a defensible prior" over unknown failure
  probabilities. It does not say what makes a prior defensible, and reviewers have
  been inconsistent.


  The committee is now split, and I have been asked to draft the decision memo that
  will set a binding standard.


  One faction wants our guidance to require the maximum entropy prior. Their reasoning:
  where a licensee can justify only certain constraints—say, a failure rate bounded
  within an interval, or a mean derived from accelerated bench testing—the unique
  distribution that maximizes Shannon entropy subject to those constraints is the
  one that assumes least beyond the evidence; any tighter or differently shaped prior
  imports information the licensee does not have. On this view, maximum entropy is
  not one prior among others but the rationally mandated starting point, and it would
  satisfy the "defensible prior" requirement.


  The other faction replies that the maximum entropy prior is not as neutral as it
  appears. Its shape changes depending on whether one parameterizes the unknown as
  a failure rate or as a reliability/reliability-time, even when the same information
  is supplied; different choices of the underlying reference measure yield different
  "least informative" distributions. They argue there is no unique rationally mandated
  prior here, and that announcing one would be false precision. Instead, they want
  our guidance to require licensees to report how the bottom-line risk metric changes
  across a prescribed ensemble of meaningfully different priors, and to defend decisions
  against the worst plausible case in that ensemble, with no prior privileged as canonical.


  I need a decision memo from you, as if you were serving as the committee''s consulting
  philosopher or risk-methodology adviser: should we adopt the maximum-entropy standard,
  adopt the prior-ensemble standard, or adopt some third rule? Give a clear recommendation
  that our staff can turn into review criteria, with reasons each faction could actually
  respond to, and an honest treatment of the strongest consideration on the losing
  side. Also address what the rule should require when a licensing decision ultimately
