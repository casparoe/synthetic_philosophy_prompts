  Negative utilitarianism (NU): the view that the only thing of intrinsic moral relevance
  is reducing suffering (or disvalue); positive well-being has no (or minimal) intrinsic
  weight. Suffering-focused ethics is a broader family. Known objections:


  1. The "benevolent world-exploder" / world destruction argument: if the only way
  to eliminate suffering is to painlessly destroy all life, NU seems to require it;
  but that''s unacceptable (counterintuitive; conflicts with consent, rights, maybe
  with concern for flourishing). Response: painless extinction may not be wrong in
  itself? Actually negative utilitarians sometimes bite the bullet (anti-natalism)
  or appeal to inability to destroy painlessly, side constraints, rights, uncertainty,
  or argue that life can contain "not-bad" states. But for a pure NU, the world-exploder
  is a big bullet.


  2. The "pinprick argument": if we must prevent any amount of suffering at cost of
  any amount of happiness... e.g., avoid a pinprick to one person even if it sacrifices
  enormous happiness for many. Classical utilitarians use this against NU. Defenders
  may bite or add thresholds/lexical.


