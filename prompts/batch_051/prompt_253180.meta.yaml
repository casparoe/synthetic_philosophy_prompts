  metaphor: he thinks the individual ant is more like a cell in a larger body, with
  the queen as the germ plasm and the workers as the somatic tissue, and that the
  colony as a whole is the unit that natural selection really acts on. The bit that
  got me stuck was his claim that the colony has an individuality of its own, over
  and above the ants.


  So here''s the thing. A classic Ship of Theseus problem: if you replace every plank
  on the ship, one by one over a season, is it the same ship? Now run that on Wheeler''s
  colony. In a lot of ant colonies, the workers are turning over every few weeks,
  and even queens get replaced on colony-level timescales, while the nest site, territory,
  and colony-level traits—aggression, foraging style, disease resistance—seem stable.
  If Wheeler is right that the colony is the real individual, what persists through
  the replacement? Is the standard answer for an animal body (cell turnover but continuity
  of form, function, and repair) just transferable to the colony, or does the fact
  that ants are themselves independently alive, can reproduce in some species, and
  can leave and join another colony break the analogy? And would your answer change
  for a coral holobiont, where the clonal polyps are genetically identical but the
  symbiotic algae population is a shifting, partly external/acquired community? Keep
