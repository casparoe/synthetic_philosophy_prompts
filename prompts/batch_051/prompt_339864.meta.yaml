  Reference class problem: the "outside view" reasoning. Key tensions:

  - We want the broadest reference class to avoid overfitting (reference class tennis).

  - But the narrow, more specific reference class can seem more relevant even when
  it''s small (small sample problem).

  - Sometimes the broadest reference class is too broad (e.g., all "new organizations"
  including restaurants and startups).

  - We care about the mechanism (inside view) when choosing the reference class, which
  partly undermines the outside view.


