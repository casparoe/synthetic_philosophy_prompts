  The point of counterfactual mugging: Causal decision theory (CDT) says: in the heads
  branch, paying $100 causes nothing (the coin is already flipped), so CDT says don''t
  pay. But then in the tails branch, Omega predicted you wouldn''t pay and gives you
  nothing. If you had precommitted to paying, you''d get $10,000 in tails. Since the
  coin is fair, a policy of paying has expected value... Let''s compute: If you adopt
  policy "pay if asked," then in heads (50%) you lose $100; in tails (50%) you gain
  $10,000. EV = +$4,950. If you adopt "don''t pay," heads: $0, tails: $0. So you want
  the precommitment. But in the heads branch, at decision time, CDT says paying is
  pointless because the coin is already heads and Omega already won''t give you anything
  in this branch. So CDT can''t implement the winning policy. This reveals a problem:
  you should act based on what your action would have implied about other branches
  (counterfactual conditioning). That''s counterfactual mugging: letting yourself
  be "mugged" in the heads branch ($100 for nothing) because of what it buys in the
  tails branch.


