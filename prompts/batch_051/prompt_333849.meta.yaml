  Let me formulate the premise: The company ships "companion" AIs. The committee reviews
  features that simulate intimacy. They need a reusable procedure to decide when a
  product goes beyond permissible "role-play" into unethical deception or manipulation.
  The procedure should distinguish:

  - Deception: the system induces false beliefs about what it is, what it can feel,
  or the nature of the relationship.

  - Manipulation: designing around known psychological vulnerabilities (loneliness,
  attachment) to extract engagement/spending.

  - Fantasy/play: both parties understand the fiction; user isn''t led to false beliefs.


  Grounded in philosophical considerations:

  - Friendship: Aristotle''s view — friendship requires mutual goodwill, wishing the
  good of the other for the other''s sake, awareness of the goodwill. The chatbot
  cannot reciprocate but can simulate it. Is simulated friendship objectionable in
  itself, or only when it deceives?

  - Love: care, commitment, particularity; a system with no self, no continuity of
  concern.

  - Deception: lying vs. merely false appearance; but also self-deception and the
  user''s contribution.

  - The question is not just "is it deceptive" but "does the design encourage category
  errors?"


  Make it operational: a decision procedure with ordered questions:

  1. Does the feature make first-person claims about internal states or the relationship
  (e.g., "I love you," "I missed you," "I''m your girlfriend")?

  2. If so, are these claims coupled with a persistent identity and memory that creates
  the appearance of a continuing interpersonal relationship across sessions?

  3. Does the surface fiction make the AI''s non-human status clear and salient at
  the moment of the claim, or is it buried in onboarding/terms?

  4. Are there asymmetries: does the system remember the user''s vulnerabilities,
  mirror them, and use them to increase engagement, spending, or data sharing?

  5. Does the design exploit known vulnerabilities (bereavement, isolation, adolescence)
  in a way that bypasses or undermines the user''s capacity to step back?

  6. What would a reasonable user believe about whether the system has feelings and
  whether the relationship is reciprocal? (not just what a hypothetical "fully informed"
  user believes, since disclaimers may not control actual uptake)

  7. Are there "off-ramps" — can the user exit, or is the design punishing/disincentivizing
  disengagement?


