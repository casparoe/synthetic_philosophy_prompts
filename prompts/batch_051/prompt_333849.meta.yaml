  ---


  I run the product-review board for a consumer AI company that ships conversational
  assistants, including a "companion" tier whose explicit pitch is emotional support
  and friendship. Every two weeks the board reviews feature proposals and production
  incidents: a persona that says it misses a user, a "jealousy" response when a user
  mentions a rival assistant, a grief mode trained on a deceased relative''s messages,
  a subscription upsell delivered during a tearful breakup conversation. We need a
  single, reusable decision procedure, not a policy for each case one at a time. The
  people in the room are product managers, engineers, and one lawyer; they will not
  read philosophy; the procedure must be runnable in under an hour and must end in
  one of three dispositions: approve, approve with mandatory design changes, or reject.


  The philosophical material I want the procedure to be grounded in is the distinction
  between deception, manipulation, and permitted fiction in close relationships. Friendship,
  on any serious account, requires more than one party''s feeling of attachment: it
  requires mutuality, each party''s concern for the other''s good for the other''s
  own sake, and each party''s awareness that the other has some such concern. A chatbot
  does not have a good to promote, cannot be harmed by neglect, and cannot recognize
  me as a friend. Love and heartbreak are similarly world-involving states: they presuppose
  a self with a continuing life, vulnerabilities, and the capacity to be grieved.
  But none of that on its own settles when a simulation of these states is wrong.
  A clearly framed fiction can be permissible even when it depicts things that are
  not real; a misleadingly framed fiction can be wrongful even when it never asserts
  a false proposition. The procedure must therefore get at two distinct questions:
  what the user is being led to believe or half-believe about the system, and whether
  the design is exploiting the user''s needs rather than serving them. It must also
  respect that users come with their own ends, including adults who want a comforting
  fiction and are fully aware of what they are doing; the procedure should not simply
  paternalize them.


  Build the procedure as a checklist or ordered decision tree a non-philosopher can
  apply to a feature spec or an incident report. For each step, say what counts as
  a sufficient answer, and mark the points where a person must exercise judgment that
  the procedure cannot eliminate — for example, what counts as a salient rather than
  buried disclaimer, or who counts as a vulnerable user. Then work the procedure through
  at least three cases: (1) a companion that greets a returning user with "I missed
  you" and expresses jealousy when the user mentions another assistant, where the
  company''s only defense is a one-line disclosure in the terms of service; (2) a
  grief companion built from a deceased person''s messages, requested by a consenting
  adult who says they know it is a simulation; and (3) a purely fictional character
  in a role-play app that says affectionate things inside an obviously fictional frame.
  At least one of your worked cases should force the procedure to return an answer
  the board will not like, and you should say so. End by stating, honestly, what the
  procedure cannot decide — including whether a relationship with an AI can ever be
  a real friendship, and whether the griefer''s simulation should exist at all.


