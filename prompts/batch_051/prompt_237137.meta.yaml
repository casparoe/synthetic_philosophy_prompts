  like: in methodology, anything goes.


  I find that conclusion genuinely useful. It explains why science has succeeded through
  opportunistic, theory-laden, rhetoric-laden, historically situated work rather than
  through a clean recipe, and it inoculates me against textbook accounts of science
  that collapse on contact with the historical record. But I also hold a firm intuition
