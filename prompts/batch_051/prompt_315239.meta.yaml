  Tentative prompt:


  "I''m in a philosophy of mathematics class and we''ve been talking about what would
  happen if some basic formal system turned out inconsistent. I have a bunch of opinions
  about particular cases, but I can''t seem to dig out the principle behind them.
  Can you act as a philosopher of mathematics and logic, think hard, maybe brainstorm
  a few candidate principles first, and then commit to one? Don''t just list options—take
  a position and defend it.


  Here are my verdicts.


  1. Naive set theory turned out inconsistent (Russell''s paradox), and I don''t feel
  like that shows mathematics is inconsistent. It shows the theory was a bad model
  of the sets we meant.

  2. If someone found a contradiction in ZFC tomorrow, I wouldn''t become an error
  theorist about math. I''d say we''ll patch the axioms the way we patched naive set
  theory, and ordinary math will mostly survive in some weaker system.

  3. But if someone found a short, checkable proof of 0=1 in Peano arithmetic, I''d
  be genuinely shaken—not about whether 2+2=4 is true of the standard numbers, but
  about whether we ever had the natural numbers pinned down at all. It would feel
  different from the Russell case.

  4. If the "proof" of contradiction only worked because of some weird nonstandard
