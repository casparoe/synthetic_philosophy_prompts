  I’m a retired chemist, and after forty years of treating questions about safety
  as questions about what can and cannot be reversed, I’m now trying to read Kant
  carefully. In Perpetual Peace, in the sixth preliminary article, he says that a
  state at war must not permit acts of hostility that would make all confidence impossible
