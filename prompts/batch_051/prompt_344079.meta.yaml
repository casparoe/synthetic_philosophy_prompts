  Galen Strawson''s Basic Argument (from "The Impossibility of Moral Responsibility"
  and Freedom and Belief). Roughly:


  1. You do what you do, in any given situation, because of the way you are.

  2. To be truly (ultimately) morally responsible for what you do, you must be truly
  responsible for the way you are — at least in certain crucial mental respects.

  3. But to be truly responsible for the way you are, you must have chosen to become
  that way (or must have intentionally brought it about) in some earlier state.

  4. And to be truly responsible for choosing to become that way, you must have been
  truly responsible for the way you were in that earlier state.

  5. This regresses infinitely. You cannot be ultimately responsible for the way you
  are, unless something impossible (an infinite regress or a causa sui, self-causation)
  occurs.

  6. Therefore ultimate moral responsibility is impossible.


  Key points: the argument does not depend on determinism; it applies even if indeterminism
  is true. It attacks "ultimate" moral responsibility, "desert-entailing" responsibility
  — the kind that makes punishment/resentment justified in a basic, desert-based sense.
  Strawson allows that we can be responsible in a compatibilist sense (answerability,
  etc.) but not ultimately responsible in the desert sense. The Basic Argument is
  a version of the "luck argument" or the "self-creation" argument.


