  availability of MCB will weaken emissions cuts, but rather that the institutions
  needed to make a termination pact credible are the very institutions that have so
  far failed to secure comparable commitments on decarbonization. Third, the standing
  claim: consent to alter the heat budget of a shared atmosphere cannot be inferred
  from local benefit or from the absence of a presently attributable harm.


