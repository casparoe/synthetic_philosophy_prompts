  rule licenses meddling); epistemic (we know our aversions better than others'' wants).
  Ask: is there a principle that generates this asymmetry, and does it survive nearby
  cases (e.g., a negative rule can also license meddling? Actually negative: "don''t
  correct someone''s error because you wouldn''t want to be corrected" can forbid
  helping). Hmm.


  2. The asymmetry between our own preferences about being acted upon and our duties
  toward others: We happily use the golden rule to justify not lying, but we balk
