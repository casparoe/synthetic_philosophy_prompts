  (1) Hope is a kind of belief or expectation about an uncertain good, which Spinoza
  defines as an inconstant pleasure arising from the thought of an uncertain future
  good.

  (2) Rational belief about uncertain outcomes should track the available evidence;
  it should be proportioned in strength to the probability the evidence supports.

  (3) A belief/knowledge mismatch is an epistemic fault (epistemic vice = something
  that systematically makes beliefs less accurate).

  (4) Hope, by its nature, involves taking the uncertain-but-good outcome to be more
  probable than the evidence warrants (optimistic bias). Or at least hope is pleasurable
  anticipation that biases reasoning.

  (5) Therefore hope is an epistemic vice.

  (6) But hope is also often morally good / praiseworthy (it sustains action, generosity,
  etc.).

  (7) So hope can be both an epistemic vice and a moral virtue; the contradiction
  is only apparent. Which step, if any, is invalid?


