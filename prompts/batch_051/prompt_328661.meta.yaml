  Theory: Temperance (s?phrosyn?) is best understood as a kind of prudent self-management:
  the temperate person is someone who reliably judges that certain short-term goods
  are worse than long-term goods and acts accordingly. The systematic virtues: it
  gives a unified, non-mysterious account; it makes temperance continuous with ordinary
  self-control, willpower, and rational planning (it''s just the same faculty applied
  to appetites); it explains why temperance is teachable/measurable; it avoids invoking
  a weird "transformation of desire" that sounds like moralized repression; it fits
  with empirical work on delay of gratification, hyperbolic discounting, implementation
  intentions, Ulysses contracts, precommitment. So the theory is: temperance = successful
  diachronic prudence about appetites; the akratic person is a bad at self-control
  or discounts hyperbolically; the solution is better self-binding or an enlarged
  sense of one''s future self.


  Intuition: There''s a case: imagine someone, call them "A", who loves drinking /
  sweets / etc., and has to install browser blockers, lock the liquor cabinet, fine
  themselves, avoid parties. They succeed in not drinking/eating too much, but every
  day is a white-knuckle struggle; they still long for it, resent the constraint,
  and count the hours. Intuitively this person isn''t temperate — they''re an addict
  managing their addiction, or someone using external scaffolding to imitate temperance.
  They have self-control but not the virtue. The virtue seems to consist in a harmony
  or realignment of desire: the temperate person doesn''t just override the urge,
  they don''t have the urge (or it''s muted / reshaped), they see the tempting object
  as not good-for-them in the circumstances, and they''re not conflicted. If so, the
  prudent self-control model misses the distinction between being cured and being
  constantly on guard. Conversely, someone with no cravings and no need for scaffolding
  might be temperate without any self-control — indeed maybe continuous self-control
  is actually a sign of the vice of insensibility or prudishness? Or that the theory
  misclassifies "repressive" self-management as virtue.


