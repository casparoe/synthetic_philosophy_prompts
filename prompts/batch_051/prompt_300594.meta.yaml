  Type C + Anselm prompt draft:


  "My philosophy teacher summed up Anselm''s ontological argument and Gaunilo''s reply
  like this: ''Anselm defines God as the greatest being we can imagine. Since a being
  that exists in reality is greater than one that exists only in the mind, a God that
  didn''t exist wouldn''t be the greatest being we can imagine — so God exists. Gaunilo
  answers that by the same reasoning there must be a perfect island greater than all
  other islands, and since no one believes that, the argument must be flawed. Kant
  later showed why: existence is not a property that can be added to a concept to
  make it greater, which is why Anselm''s argument is now mostly treated as a mistake.''
  I suspect this summary is too neat, but I don''t yet know enough to say where it
  goes wrong. Go through it piece by piece: which parts faithfully report Anselm and
  Gaunilo, which parts subtly distort them, and whether Kant''s point (as glossed
  here) actually refutes Anselm or only a stronger version of him. Also tell me whether
  Gaunilo''s island is a fair test of Anselm''s argument or whether it changes the
  argument in a way Anselm could disown. Finally, say what would change your mind
  about your verdict: what feature of Anselm''s actual text, or which reply from the
  tradition, would most likely lead you to judge the summary differently."


  This is excellent. It''s self-contained, mostly-right summary with subtle issues:

  - "greatest being we can imagine" vs "that than which nothing greater can be thought"
  (subtle but crucial: Anselm''s formula is not about contingent imaginative capacities).

  - "a being that exists in reality is greater than one that exists only in the mind"
  — accurate.

  - Gaunilo''s island as "no one believes that" — accurate as parody but presented
  as outright refutation.

  - "Kant later showed why: existence is not a property..." — this is a subtle conflation:
  Kant''s objection is about existence not being a real predicate that adds to a concept;
  it''s presented as "which is why Anselm is now mostly treated as a mistake," which
