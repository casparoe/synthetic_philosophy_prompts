  Axiom of choice possibilities for subtle confusions:


  1. Confusing the axiom of choice with the well-ordering theorem, or thinking AC
  is needed for finite choices.

  2. Thinking AC is "obviously true" because you can always pick, and that constructive/intuitionistic
  objections are about AC itself rather than non-constructive existence.

  3. Thinking the Banach-Tarski theorem "proves math is broken" and that rejecting
  AC solves the paradox.

  4. Thinking that because AC is independent of ZF, both AC and not-AC are equally
  acceptable, so math is arbitrary.

  5. Confusing AC with the law of excluded middle: "AC assumes you can make infinitely
  many choices, but you can''t actually do that, so AC is false of the real world."


  A more in-the-weeds false presupposition: "Since the axiom of choice is independent,
  we can just add it or its negation like flipping a switch; so the ''truth'' about
  infinite sets is relative/arbitrary." A good answer would correct: independence
  shows ZF doesn''t decide it; doesn''t show pluralism about truth necessarily; different
  models exist; many mathematicians use AC because consequences.


  Another: "Without the axiom of choice, every vector space might not have a basis
  — but a basis is almost a definitional part of ''vector space'', so does rejecting
  AC break linear algebra?" Actually in ZF, not every vector space provably has a
  basis; Blass 1984 showed AC equivalent to every vector space has a basis. The confusion:
