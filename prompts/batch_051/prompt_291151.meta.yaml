  R over Q having a basis is Hamel basis; existence needs AC or weaker? It''s consistent
  with ZF that R as Q-vector space has no basis?). That''s fairly in the weeds and
  meaningful without search. The sneaky false presupposition: "a vector space is defined
  as a space with a basis." Good.


