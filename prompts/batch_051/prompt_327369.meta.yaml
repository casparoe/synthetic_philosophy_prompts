  it''s common knowledge that they''re rational, then there is no trade purely from
  asymmetric information — each side should refuse, because willingness to trade on
  the other side reveals information (Milgrom-Stokey no-trade theorem). Yet ordinary
  practice: we routinely buy and sell stocks, houses, etc., with asymmetric information;
  we think the seller of a used car who knows it''s a lemon is behaving badly but
  the buyer who buys at a low price is savvy (or a sucker). Also, insider trading
  law prohibits trading on material nonpublic info, but the whole point of markets
