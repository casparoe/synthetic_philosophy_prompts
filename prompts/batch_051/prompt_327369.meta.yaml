  A standard classroom experiment for no-trade: Students paired; asset value V is
  uniformly distributed 0-100; one student gets private signal (a Gaussian around
  V), the other gets nothing; they can trade. In a rational markets experiment, the
  uninformed should refuse to trade at any price offered by informed. But students
  will trade, illustrating the theorem''s assumption failure (they don''t have common
  knowledge of rationality). A good debrief asks why trade happened — asymmetric priors,
  overconfidence, noise traders, liquidity. The activity thus shows the theorem by
  contrast: on reflection, any price should have made one side suspicious. That''s
  actually a great design: let it fail within the game, then debrief.


