  Possible argument:


  "Here is an argument I keep failing to refute. It says the distinction between worst-case
  and average-case evaluation is a red herring because the two are the same kind of
  criterion applied to different probability distributions.


  (1) A decision rule for whether to accept a system is rational only if it ranks
  systems by expected value relative to some probability distribution over the situations
  the system will meet.

  (2) Average-case evaluation ranks systems by expected value under a distribution
  fitted to the situations the system is likely to meet (the deployment distribution).
  So it is exactly the rational rule, provided the fitted distribution is accurate.

  (3) Worst-case evaluation ranks systems by their performance on the single most
  unfavorable input that can be constructed. That is just expected value under a distribution
  that assigns probability 1 to that input and 0 to all others.

  (4) But no one actually believes the deployment distribution is a point mass on
  an engineered worst case; such a distribution is not a forecast about the world,
  it is a stylized adversary. So worst-case evaluation uses an obviously false prior.

  (5) Therefore, as a criterion for accepting systems, worst-case evaluation is either
  the same kind of decision rule as average-case but with an indefensible prior, or
  it is no rational criterion at all. In neither case does it expose a limitation
