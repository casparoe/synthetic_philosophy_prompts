  "I serve on the strategy committee of a small foundation. We regularly make decisions
  about unique events—whether a bill will pass in a particular session, whether a
  promising technology will become viable in five years, whether a partner organization
  will survive a leadership transition—and I have formalized a personal rule about
  how to treat them. I will not assign any such event a point-valued probability or
  use it in an expected-value calculation unless I can identify a reference class
  with a usable base rate. Otherwise I confine myself to ordinal or interval judgments
  (''more likely than not'', ''unlikely, but not negligible enough to ignore''), and
  I defend this on broadly Keynesian grounds: these cases are uncertainty rather than
  risk; the evidence is not the kind that determines a precise degree of belief; and
  putting a number on it would give a false impression of measurement. I also hold
  that the weight of evidence—roughly, how much relevant information bears on a question—is
  a separate matter from probability, so I can act confidently on a qualitative judgment
  even when no precise probability can be extracted from the evidence. A colleague
  says my rule is unfalsifiable and self-protective: my forecasts are vague enough
  to be declared consistent with almost any outcome, and I never have to face a calibration
  score or a decision-theoretic audit. I want to know whether the rule is defensible
  as it stands, when a subjective probability with a wide range would have been strictly
  better, and when my qualitative restraint really does avoid false precision. If
  the rule is defensible only in part, please restate it so that it keeps the Keynesian
  caution about non-quantifiable uncertainty without becoming a license to avoid comparison,
