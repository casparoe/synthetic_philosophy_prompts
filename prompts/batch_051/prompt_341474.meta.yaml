  ---


  I have a standing rule about uncertain singular events: I never assign them a single
  numerical probability or feed them into an expected-value calculation unless there
  is a recognizable reference class or base rate to anchor the number. When my committee
  forecasts whether a particular piece of legislation will pass, whether a startup
  will survive three years, or whether a one-off technology bet will pay off, I restrict
  myself to interval or ordinal judgments—"more likely than not," "unlikely but far
  from negligible"—and I defend this with a Keynesian line: many of these cases are
  uncertainty rather than risk, the underlying evidence is not the sort that determines
  a precise degree of belief, and a number would create a false appearance of measurability.
  I also treat "how much evidence bears on the question" as something distinct from
  "how likely the claim is," and I think high weight of evidence can justify acting
  on a qualitative judgment even when no precise probability can be extracted. But
  a colleague says this is unfalsifiable cover: my qualitative forecasts can be declared
  right whatever happens, and I never have to face a calibration score. Under what
  conditions is my rule genuinely warranted, and under what conditions is it bias
  protecting itself? Could the better policy be to use subjective probabilities with
  wide ranges, or to run expected-value calculations with simple, coarse probabilities?
  Please restate the rule, if it is partly defensible, so that it keeps the Keynesian
  caution without becoming an excuse for avoiding comparison and accountability.


  ---


