  Possible structure:


  A reading group on interpretability; someone presented an argument that seems to
  land at an absurd conclusion.


  Steps:


  (1) Our best window into what a neural network represents is decoding: if we can
  train a simple readout—say, a logistic regression—on the model''s hidden activations
  to recover a feature (e.g., "is this input about..."), then the model represents
  that feature. (We can''t just ask what it "really" represents from the inside.)

  (2) This is how the literature proceeds: trained linear probes recover sentiment,
  truth values, board states, etc., and the accuracy is taken as evidence of representation.

  (3) But the same readout procedure succeeds too often: given a high-dimensional
  set of activations, even a linear probe can recover many features from an untrained
  network with random weights, and from a random nonlinear projection of the input,
  at well above chance, sometimes competitively.

  (4) If decodability is our criterion for representation, then by (1) and (3), a
  randomly initialized network—and arguably the random projection itself—represents
  sentiment and other high-level features.

  (5) That cannot be right. A random network has learned nothing, and a fixed random
  projection is just a scrambled copy of the input; representation shouldn''t come
  for free.

  (6) So decodability cannot be sufficient for representation.

