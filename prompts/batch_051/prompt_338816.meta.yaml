  Draft:


  ---


  A colleague in our interpretability reading group gave the following argument, which
  I now think is either profound or a trap, and I can''t tell which.


  (1) The only evidence we can have that a neural network represents a feature F is
  decodability: we take the network''s hidden activations on a batch of inputs, train
  a simple readout (a linear probe) to predict F from those activations, and find
  it succeeds at well above chance.

  (2) This is the workhorse of modern interpretability—when a probe recovers, say,
  sentiment, board state, or truth-value from hidden states, the field treats that
  as evidence that the network represents the feature.

  (3) But decodability of this kind is cheap. Randomly initialized, untrained networks,
  and even fixed random nonlinear projections of the input, also produce high-dimensional
  activation spaces from which linear probes can recover many of the same coarse labels
  at well above chance (in some setups, nearly as well as the trained network).

  (4) If the criterion in (1) is right, then by (3) a network that has learned nothing—and
  perhaps the random projection itself—represents sentiment, board state, truth-value,
  and the rest.

  (5) That is close to absurd: a random network does not have those representations;
  representation should be something the network acquires through training, not something
  a random matrix gets for free.

  (6) So decodability cannot be a sufficient condition for representation.

  (7) But the natural repair is to demand that the representation be causally used
  by the model: if we can identify a direction and show that intervening on it (zeroing/ablating
  it, or editing the feature) predictably changes downstream behavior, then it is
  a real representation, not a correlate.

  (8) The repair, though, is too strict. Real networks are redundant and distributed:
  a concept may be carried by several directions, and ablating any one of them may
  change nothing, so the causal test will deny that plenty of genuine representations
  exist. It also reintroduces all the problems of interpreting interventions in nonlinear
  systems.


