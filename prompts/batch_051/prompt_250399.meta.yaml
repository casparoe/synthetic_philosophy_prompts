  Let''s think about actual philosophical positions on Turing test/behavioral criteria:


  - Behaviorism (logical/analytical): mental states are behavioral dispositions. A
  perfect behavioral duplicate has a mind.

  - Functionalism (causal role): mind is a matter of internal causal organization;
  the right functional profile suffices, regardless of material or history.

  - Biological naturalism (Searle): only brains cause minds; syntax alone is not semantics.
  Chinese room: no understanding despite behavior.

  - Computationalism: mind is computation over representations; LLM maybe.

  - Enactivism/embodied: mind requires being a living organism coupled to an environment;
  AI no.


