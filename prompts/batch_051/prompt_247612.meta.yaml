  Draft:


  "I recently had a long argument with a friend about Bernard Williams''s Makropulos
  case and whether eternal life would eventually become boring, and I want to write
  up my position for a reading group. Before I do, I''d like a consistency audit of
  the following set of commitments, which reflect where the argument left me:


  1. For a temporal life, I accept Williams''s point: a person with a finite human
  character and a finite stock of categorical desires cannot go on living forever
  without those desires being either exhausted, repeated until they lose their grip,
  or replaced by new ones that no longer express the same person.

  2. But I do not think this threatens heaven as traditionally understood, because
  heaven is not an endless succession of days; it is an atemporal state — participation
  in a timeless good rather than an unending series of satisfying moments.

  3. I also hold that an afterlife is only worth hoping for if it is mine: for the
  blessed person to be me, there must be substantial continuity of memory, character,
  and desire with the person I am now.

  4. Yet I also hold that one can rationally want to be radically transformed — to
  be made capable of a form of life one cannot now find attractive — without thereby
  wanting someone else to be rewarded in one''s place.


  Please go through these and tell me which pairs are actually in tension and which
  only look that way, rank the tensions by severity, and say what the cheapest single
