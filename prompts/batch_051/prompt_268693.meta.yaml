  Then describe the puzzle:


  "The puzzle, as I understand it, is this. Readers can comfortably go along with
  a story that changes ordinary descriptive facts: a story can say that there are
  dragons, that faster-than-light travel is common, that a character has wings, and
  we don''t balk. But when a story changes a moral fact — for instance, a narrator
  asserting as fictional truth that a mother did the right and praiseworthy thing
  when she killed her infant because it was a girl — readers resist or refuse. The
  puzzling thing is that the author''s say-so seems to be able to make descriptive
  claims true in the fiction, but not moral claims."


