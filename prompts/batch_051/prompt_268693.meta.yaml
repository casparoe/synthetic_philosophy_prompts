  "The puzzle, as I have had it described to me, is that readers accept the wildest
  descriptive divergences from reality without complaint — a story can stipulate that
  dragons exist or that faster-than-light travel is trivial, and we simply accept
  it as true within the fiction — but we resist or refuse when a story tries to stipulate
  a moral divergence. The classic case is a story that announces, as a fact of the
  fiction, that a character did the right and praiseworthy thing by killing her baby
  because it was a girl. The author''s say-so appears to be enough to make descriptive
  claims true in the fiction, but not enough to make moral claims true in the fiction.
  Why is authorial authority so much narrower over values than over facts?"


