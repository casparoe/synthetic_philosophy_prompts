  Lottery paradox (Kyburg 1961): Consider a fair lottery with 1000 tickets, exactly
  one winner. For each ticket, the probability that it loses is .999, so it is rational
  to accept/believe "Ticket i will lose." If rational acceptance is closed under conjunction,
  it is rational to accept the conjunction: all tickets will lose. But that contradicts
  knowledge that one will win. Hence the set of accepted statements is inconsistent
  — a paradox.


  Preface paradox (Makinson 1965): An author writes a book, rationally believes each
  individual claim made in it (after careful checking), but also rationally believes,
  based on general fallibility, that at least one claim in the book is false. The
  set {each claim, at least one is false} is inconsistent. Yet each belief seems rational.
  So rational belief seems not to require consistency.


