  Option A: Argument over whether an AI that accepts shutdown is possible/coherent.


  Detailed moves:

  1. Alice: A corrigible AI is just one whose utility function doesn''t assign value
  to its own continued operation, so shutting it off costs it nothing.

  2. Bob: That''s impossible: any action the AI takes happens only if it stays on;
  so if it acts to achieve its goal, it implicitly values being on long enough to
  act. Indifference to shutdown amounts to indifference to whether its goals are achieved.

  3. Alice: No, there''s a difference between pursuing G while running and pursuing
  G-if-running. A game character doesn''t try to stop the player from quitting; it
  "acts" within the game only. The AI can be like that: it optimizes within the window
  provided by its being on, without optimizing the window itself.

  4. Bob: But the difference between "pursue G while running" and "pursue G-if-running"
  is exactly the kind of thing that disappears once the AI is smart enough to reflect
  on its own hardware. A reflective agent that wants G-if-running will realize that
  being shut off later prevents G, so it has instrumental reason to keep the probability
  of shutdown low unless you put an explicit penalty on it, but a penalty just replaces
  one goal with a more complex one.

  5. Alice: Fine, but that''s why the goal is indifference to the button state itself,
  not to future shutdown. You define utility so the AI is fine with any state of the
  button, so no instrumental reason to manipulate it.

  6. Bob: Then you get the opposite problem: the AI is also fine with the button being
  pressed when it shouldn''t be; it might even press the button itself to satisfy
  whatever terminal subgoal you gave it. Indifference to the button means it won''t
  resist a wrong shutdown, and if it can manipulate the button, it might shut itself
  off to "finish" its utility function. You need the AI to be corrigible in an asymmetric
  way — want to obey shutdown commands while not wanting to shut itself down — and
  utility indifference can''t capture that.


