  1. Hidden dependency: the argument''s persuasive force rests on an implicit empirical
  or normative claim never surfaced; the honest debater must first make the judge
  suspicious before spending time, which is itself a cost.

  2. Obscurantist compression: the honest case requires a long chain but the format
  rewards short vivid stories; the liar can always produce a shorter vivid story.

  3. Calibration-attack: the argument induces overconfidence in the same way a sequence
  of plausible-sounding sentences does; judge cannot distinguish cumulative plausibility
  from truth.


