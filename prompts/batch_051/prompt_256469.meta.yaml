  - Heritability is population- and environment-specific: yes.

  - High heritability doesn''t mean immutability: yes (e.g., height heritable but
  secular trends due to environment; PKU).

  - Within-population heritability says nothing about between-population differences:
  standard Lewontin/within-between distinction. Yes.

