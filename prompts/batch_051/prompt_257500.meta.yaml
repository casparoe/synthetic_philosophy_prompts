  3. Naturalness/projectibility: The rule uses a non-gerrymandered vocabulary and
  supports correct classification of new, unseen figures drawn by the same intended
  contrast. (This is the Goodman/grue criterion.)

  4. Determinacy/uniqueness (maybe): There should be one rule that clearly satisfies
  1–3, or at least the intended rule should beat rivals.


