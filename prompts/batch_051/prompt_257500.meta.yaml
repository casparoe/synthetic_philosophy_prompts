  vs vicious when each step depends on completing a prior step.


  Type B (criteria and borderline case) could work: give criteria for viciousness
  of regress (e.g., (1) each step requires the next to be completed before the previous
  is achieved; (2) the regress generates no independent explanation; (3) it contradicts
