  Draft:

  "I''m a journalist who covers science and ideas, and I''ve been trying to understand
  why philosophers have been fighting about dispositions for so long without it going
  anywhere. The basic dispute: some people think a disposition like fragility can
  be analyzed as a conditional — roughly, x is fragile iff if you dropped x, it would
  break. Others say the fink and mask cases kill that. Finks are things that lose
  the disposition exactly when the trigger condition arrives (a live wire that''s
  wired to go dead the instant it''s touched); masks are things that keep the disposition
  but block the manifestation (a fragile glass packed in styrofoam: drop it and it
  won''t break, but it''s still fragile). The pro-analysis side keeps fixing things
  up — adding ceteris paribus clauses, ''in normal conditions'', ''in the absence
  of masks and finks'' — and the other side says every fix either circularly says
  ''fragile = would break unless it wouldn''t'' or just relocates the mystery. Both
  sides seem to agree on all the cases! They agree the wire is live, the glass is
  fragile, and agree on what would happen. So why has this dispute gone on for decades?
  My hunch as an outsider is that it''s actually a verbal fight about whether an analysis
  has to state a list of necessary and sufficient conditions, versus a substantive
  fight about whether dispositions are intrinsic powers or relational/conditional
  properties. But I''m not sure that''s right, and maybe it''s really a disagreement
  about what the word ''fragile'' means in ordinary English vs. what philosophers
  want it to mean. I''d like a diagnosis, not a vote for a side: what kind of disagreement
