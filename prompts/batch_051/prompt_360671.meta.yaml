  Order of ideas:

  1. Modus ponens as a rule: from P and "if P then Q," infer Q. Students need this
  before seeing the paradox.

  2. Distinction between claims/premises (things that can be true or false, asserted
  in the argument) and rules/inferences (licenses/transitions, not extra information).

  3. The dialogue''s move: treating the rule as an additional premise.

  4. The regress: each attempt to add a premise stating the rule creates a need for
  a further rule to apply it.

  5. The moral: logic''s rules can''t be premises among others; deduction can''t be
  justified by adding deductive premises without circularity/regress.


