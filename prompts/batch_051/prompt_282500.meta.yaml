  produced by, any such consistent formal system. Since any candidate mechanism for
  the mind would supposedly be specifiable as a consistent formal system, the argument
  purports to show that the mind cannot be a mechanism of that sort.


  Now consider a development which postdates the classic statements of the argument:
  large language models and related machine-learning systems. These systems are, in
  an important sense, mechanical — they run as finite programs on ordinary digital
  hardware. But they are not naturally described as consistent formal systems with
  fixed axioms and a recursively enumerable set of theorems. They are trained on enormous
  corpora of human text, their behaviour is probabilistic, they can assert contradictions
  on different occasions, their outputs depend on prompts and sampling parameters,
  and they can produce at least the appearance of mathematical reasoning and proof.
  And yet they can sometimes produce correct proofs and identify mathematical truths.


