  Precautionary principle: formulations vary, e.g., Rio Declaration 1992: "Where there
  are threats of serious or irreversible damage, lack of full scientific certainty
  shall not be used as a reason for postponing cost-effective measures to prevent
  environmental degradation." Also stronger forms (Wingspread statement): "When an
  activity raises threats of harm to human health or the environment, precautionary
  measures should be taken even if some cause and effect relationships are not fully
  established scientifically." The burden of proof shifts to the proponent of an activity.


  Decision-theoretic parallel: In decision theory, under uncertainty about the state
  of the world (safe vs. harmful), an agent with a loss function and prior chooses
  action maximizing expected utility. If the loss from wrongly approving a harmful
  activity (false negative / Type II error from the "activity is safe" null) is much
  larger than the loss from wrongly blocking a safe activity (false positive), then
  the optimal rule tends to block unless evidence strongly favors safety — mimicking
  precaution. Also, conservative priors (prior heavy on harmful) do similar. So precautionary
  principle can be seen as an implication of asymmetric loss + uncertainty, i.e.,
  "when in doubt, don''t." But opponents (e.g., Cass Sunstein) argue precaution is
  incoherent or paralyzing because it ignores risks of regulation itself (the opportunities
  foregone, substitute risks), and because sometimes acting to prevent harm is itself
  the precautionary choice. The parallel might break because: (1) In decision theory
  you must specify a loss function; precautionary principle pretends there''s no tradeoff
  but there is — every block has costs too. (2) The principle is categorical/lexicographic,
  whereas decision theory is continuous — no amount of benefit can overcome a "serious
  or irreversible" threshold, but decision theory would trade off. (3) Ambiguity/unknown
  unknowns: precaution concerns not just risk (known probabilities) but radical uncertainty
  (unknown distributions) — where Bayesian expected-utility machinery may not even
  apply; so it may be closer to ambiguity aversion (Ellsberg) or robust control/minimax
  than to ordinary asymmetric loss.


