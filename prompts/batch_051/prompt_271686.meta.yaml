  Maimonides (Rambam), Guide of the Perplexed, Part III, chapters 32 and 46 (also
  26?). His view: The Torah''s sacrificial system was not intrinsically desirable
  to God; it was a concession to the historical circumstances of the Israelites, who
  were accustomed to worship through animal sacrifice from surrounding nations (Sabians).
  God "transferred" their accustomed worship to His name, to wean them from idolatry
  gradually. The ultimate aim is prayer/philosophical worship; sacrifices were a second-class,
  accommodated institution. He argues that a sudden command to abandon sacrifice entirely
  would have been as impossible as asking someone to abandon prayer and seek pure
  meditation, given human nature. He also says sacrifices are a kind of "divine ruse"
  (in some translations "gracious ruse").


  Standard objections/pressure points in the literature:

  1. If sacrifices were a concession, why did the Torah legislate them in such detail,
  and why do the prophets (e.g., Isaiah 1, Jeremiah 7, Hosea 6:6, Psalm 50) criticize
  them as if God never wanted them? Maimonides would say those verses support his
  view, but critics ask: if God never desired them, why give the laws rather than
  just permit existing practices?

  2. Nahmanides (Ramban) criticizes Maimonides in his commentary on Leviticus 1:9.
  Ramban argues that sacrifices were intrinsically meaningful: they symbolize the
  worshiper''s substitution (the animal dies in place of the sinner), drawing on the
  idea that one''s life is forfeit but God accepts a substitute. For Ramban, the "pleasant
  aroma" is genuine, not a concession. So a question could press: how does Maimonides
  account for the repeated phrase "a pleasing odor to the Lord" — is the Torah saying
  something false or merely pedagogically useful? Maimonides addresses this in Guide
  III:46? Actually III:32 addresses concession; III:26 says reasons for all commandments
  exist; III:46 discusses specific sacrifices. The "pleasing odor" issue: Maimonides
  might interpret it as metaphorical or as indicating acceptance, not sensory pleasure.

  3. Messianic/eschatological question: Will sacrifices be restored in the future?
  Maimonides in Mishneh Torah, Hilkhot Melakhim 11:1 says the Messiah will rebuild
  the Temple and reinstate sacrifices. But if sacrifices are a concession for primitive
  times, why would the messianic age restore them? This is a classic tension: Maimonides
  says the world will reach full knowledge of God, yet sacrifices continue in the
  Temple per the king-messiah laws. Some interpret Maimonides as holding sacrifices
  will be restored only temporarily or that the Temple service is commanded like other
  commandments and will be observed though its rationale was historical. This is a
  strong question. Actually this is debated; R. Kook has a view that in the future
  only grain offerings/vegetarian will remain. But for Maimonides, the straightforward
  reading is that sacrifices will be restored. Pressing: doesn''t this undermine the
  "educational concession" story — if the concession remains when its rationale is
  gone?

  4. Prayer vs. sacrifice: Maimonides seems to regard prayer as superior / the essential
  form of worship. Yet the Torah commands sacrifices prominently. If God can legislate
  prayer as the ideal, why not just legislate it from the start and ban sacrifices?
  Maimonides'' answer: pedagogically gradual. Press: But God hardened Pharaoh''s heart
  and did other abrupt things; why not here? Also, God could have revealed the ideal
