  I''m a journalist who covers science and ideas, and I''m preparing a feature on
  how a science of consciousness should handle what people say about their own experience.
  The reporting keeps returning to a single tension, and I''d like you to work through
  it with me rather than hand me a winner.


  On one side is a theory I find genuinely attractive: heterophenomenology, the method
  associated with Daniel Dennett. As I understand it, the method says the study of
  consciousness should begin from subjects'' verbal reports, but should treat those
  reports as data to be interpreted from a third-person point of view. The subject
  is described as the author of a kind of fiction about their own mind, and the investigator''s
  job is to catalogue and explain that fiction, not to accept it as an authoritative
  window into a private inner theater. The scientific virtues are exactly the ones
  I want in a working research program: the method is publicly checkable; it does
  not ask one person to feel another person''s feelings; it refuses to privilege anyone''s
  introspection; and it gives a clean division of labor between what subjects claim
  and what the science is meant to explain. Without something like it, I do not see
  how the study of consciousness avoids collapsing back into untestable first-person
  storytelling.


  On the other side is an intuition I also cannot shake. When I burn my hand and say
  that I am in pain, the report does not feel like a fiction I am authoring about
  myself, and it does not feel like data whose real significance is fixed only by
  a third-person interpreter. It feels like the best, perhaps the only, access anyone
  has to something that is actually happening: there is something it is like for me,
  and my saying so is part of how that fact shows up. A method that brackets that
  authority, or calls the report a fiction, can look as though it has set the target
  phenomenon aside before the investigation even begins. If consciousness is precisely
  the first-person fact such reports point toward, then a method that refuses to point
  with them may purchase rigor by quietly studying something else.


  I am not asking you to declare which side should win. I want to know what it would
