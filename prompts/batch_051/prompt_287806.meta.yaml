  I''m drawn to heterophenomenology, the method associated with Daniel Dennett, for
  solidly scientific reasons. It proposes that the study of consciousness should begin
  with subjects'' verbal reports and treat those reports as data to be interpreted
  from the third-person point of view. On this picture, when subjects describe their
  experience, the scientist''s job is to catalogue what they say and to explain those
  utterances, not to take the reports as an authoritative window into a private inner
  theater. The subject is, in effect, the author of a fiction about their own mind,
  and the investigator adopts a neutral interpretive stance toward that fiction. The
  virtues are exactly the ones a working science needs: the method is publicly checkable,
  it doesn''t ask the investigator to feel anyone else''s feelings, it avoids privileging
  one person''s introspection, and it offers a clean division of labor between what
  subjects claim and what the science explains. Without something like it, I don''t
  see how we keep the study of consciousness from collapsing back into untestable
  first-person storytelling.


