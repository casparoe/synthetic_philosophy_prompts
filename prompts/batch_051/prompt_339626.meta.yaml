  Rietdijk–Putnam argument: There''s an observer O on Earth; a distant event E (e.g.,
  in Andromeda) is in O''s future according to one simultaneity plane but simultaneous/past
  for another observer moving relative to O. The argument: if "real"/"present" is
  relative to an observer''s simultaneity, then E is both real and not real? Actually
  the conclusion: events in our future are already real/present for some possible
  observers, so they can''t be merely potential; hence the future is as real as the
  present — block universe. Alternative: it shows the present is relative, not absolute.


  Presentist responses:

  1. Presentism doesn''t require that "what exists now" coincides with the simultaneity
  planes of special relativity. Presentism is an ontological/existential claim: only
  what is present exists. The present is a thin slice, but its geometry is not given
  by arbitrary inertial frame simultaneity; presentist can say existence is not a
  relation invariant under Lorentz transformations — the present is not a frame-dependent
  hyperplane; perhaps a single privileged foliation exists (neo-Lorentzian presentism).
  But special relativity as normally interpreted has no privileged foliation; presentists
  might add one (and it''s observationally undetectable).

  2. Or, following Stein/Savitt? some argue Rietdijk-Putnam conflates "being present
  relative to an observer" (a coordinate notion) with "being real" (an ontological
  notion). Accepting that simultaneity is relative entails nothing about what exists;
  existence claims are absolute, so presentism can accept relativistic physics while
  denying that a moving observer''s frame is an existence guide.


  Eternalist counter: if presentism requires an absolute now/privileged foliation,
  that''s extra structure beyond what relativity needs, and it''s unobservable; so
  the presentist is adding an ad hoc, empirically inert structure. The presentist
  retorts: it''s not ad hoc; it''s a philosophical primitive; relativity doesn''t
  demand we treat all inertial frames'' simultaneity planes as equally real. The eternalist:
  But what makes one foliation the present? How does a single foliation get picked
  out in a spacetime that''s symmetric? This is the "Now is odd" argument (Bourne?).


  Cruxes:

  - Whether presentism is committed to a unique foliation of spacetime into simultaneously-existing
  slices. If yes, can it be reconciled with Lorentz symmetry without privileging an
  arbitrary frame?

  - Whether "exists" is invariant. If existence claims are frame-dependent, is that
  intelligible? (For presentism, existence must be absolute; but if what exists depends
  on frame, contradiction.)

  - Whether the "walking toward/away" thought experiment: one observer''s present
  includes an event that for another is future — does that show the event is already
  determinate/real? Presentist says the second observer''s frame is just a coordinate
  convention; eternalist says you can''t dismiss an inertial frame as a mere convention
  without giving up relativity.


