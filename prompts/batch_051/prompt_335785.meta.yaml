  Let me think deeply about the content so the exchange shows genuinely decent points,
  not strawmen. I know algorithmic randomness reasonably well:


  Key points:

  - For infinite sequences, Martin-Löf randomness is a well-defined notion: an infinite
  binary sequence is random if it passes all effective statistical tests (no effective
  martingale wins, no constructive null set contains it, etc.). A specific infinite
  sequence like Champernowne''s constant 0.123456789101112... is not random because
  a test exists for it.

  - For finite strings, randomness is usually relative: a string is "random" if its
  Kolmogorov complexity (length of shortest program producing it) is close to its
  length. But this is relative to a reference universal machine up to an additive
  constant; also for any string there exists a machine making it simple, so absoluteness
  fails. So finite sequences can''t be said to be random in an absolute way; only
  with respect to a model or a test. In practice, "random enough for purpose" means
  passing a chosen battery of tests.

  - Another view: randomness is a property of the generating process, not the outcome.
  A sequence of alternating H/T could be generated by a fair coin — but it''s unlikely;
  yet any particular sequence has equal probability. But "random" as attribute of
  process: a deterministic process can produce patternless-looking strings; is it
  random? Algorithmic randomness asserts it''s about the generated sequence (for infinite)
  not the process.


  A nuanced disagreement could be between:

  - Person A (process view / finite strings can''t be random in themselves): "Randomness
  is about how a string was produced, not the string. ''00000000'' isn''t less random
  than ''01001101'' if both came from the same fair coin. Calling a finite string
  random is a category mistake."

  - Person B (sequence view / incompressibility): "But an obituary saying ''the coin
  came up 00000000'' feels significant; the sequence has an internal feature — it''s
  compressible. When we say ''that''s not random,'' we mean it had a short description
  relative to its length. We don''t need to know the coin."

  - A: "But every finite sequence has a short description relative to some machine;
  there''s no absolute notion. A string can look random under one description system
  and patterned under another. So ''random in itself'' doesn''t exist."

  - B: "The machine-dependence only shifts complexity by a constant; a string like
  a million zeros is still enormously simpler on any reasonable machine. The dependency
  is swamped. So incompressibility is almost-absolute."

  - A: "Almost-absolute only for extreme cases. For most strings, properties are ambiguous.
  And if you say randomness is incompressibility, you''ve redefined it — a deterministic
  pseudorandom generator output counts as ''random'' if it''s incompressible, even
