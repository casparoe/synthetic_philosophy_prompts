  bankroll grows faster, and in the limit the bankroll under this policy will almost
  surely exceed any bankroll under a different fixed-fraction policy by an arbitrarily
  large factor. The maximum is achieved by the fraction f = (bp - q)/b, where p is
  the true winning probability, q is one minus p, and b is the net odds received on
  a winning bet. My question is not about the math. It is about the practice that
  has grown up around this result. Many sophisticated bettors and traders treat Kelly
  sizing as the "right" way to size a position when they have an edge. They will say
  things like, "full Kelly is optimal, but I use half Kelly because of uncertainty
  in my edge," or "Kelly maximizes long-run growth, so it''s the rational benchmark."
  Yet the same people will often deviate from log utility in other settings: they
  buy insurance against losses they could easily absorb, they care about drawdowns
