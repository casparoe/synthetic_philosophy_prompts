  Mohism (Mozi, Mo Di, roughly 5th century BCE, Warring States period):

  - The core Mohist doctrine is jian''ai, often translated "impartial care" or "inclusive
  care" or "universal love." The Mohists say the root of disorder is partiality: each
  person cares for their own person, family, state and not for others, so they benefit
  themselves at others'' expense, causing robbery, war, and so on. The remedy is to
  care for others'' persons, families, states as one cares for one''s own — to replace
  partiality with impartiality.

  - Mohists argue for it partly on consequentialist grounds: impartial care brings
  order and benefit; it is what Heaven wants; it is the way of the sage-kings. They
  also argue reciprocity: if everyone cares for others'' parents as their own, then
  others will care for your parents in return — a kind of indirect benefit argument.

  - Mohists support concrete practices: they would feed the hungry, clothe the cold,
  bury the dead, care for the sick; they oppose aggressive war; they follow the will
  of Heaven and believe in ghosts as enforcers.

