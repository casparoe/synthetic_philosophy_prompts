  Draft:


  "I''m taking a seminar on language change and identity — we''ve been reading about
  whether languages are real objects or just convenient labels for continuously varying
  speech, and I''ve been trying to work out a criterion for when Latin stopped being
  Latin and started being Italian. I''ve come up with something I''ve been calling
  the chain-of-acquissibility criterion, and I''d like an honest assessment of it
  before I commit to it in my paper.


  Here''s the idea. Two ways of speaking are the same language just in case they are
  connected by an unbroken chain of normal childhood acquisition: each adjacent link
  is a case where a child could simply pick up the speech of the generation before
  it, the way one picks up a mother tongue, without formal study. By this criterion,
  first-century spoken Latin and today''s standard Italian are the same language,
  because there''s an unbroken sequence of parents and children, each acquiring the
  ambient speech without noticing a break. That''s the part I like: it tells us Latin
  didn''t turn into Italian on any particular day, but it also doesn''t just say ''anything
  goes,'' because abrupt breaks (say, a creole cut off from its lexifier, or a language
  imposed by conquest) clearly fail the test.


  The part that worries me is that the criterion is transitive. French is connected
  to Latin by the same kind of chain, and so is Sicilian, so my criterion seems to
  say French and Sicilian are the same language. I''ve been toying with two fixes.
  One is to relativize sameness to a path: relative to the path through Rome and Florence,
  Italian is the same language as Latin, while relative to the path through Paris,
  French is; sameness between two present-day endpoints would require a present-day
  chain. The other is to deny that ''the same language'' is an identity relation at
  all and treat it as a loose equivalence that can fail to be transitive, like ''is
  intelligible with'' or ''looks the same color as.''


