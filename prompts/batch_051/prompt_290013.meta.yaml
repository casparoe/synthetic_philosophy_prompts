  Dennett''s distinction (from Consciousness Explained): In the color phi, you see
  a red spot then a green spot; you report seeing a moving spot that changes colour
  midway. There are two possible explanations:

  - Stalinesque: the conscious experience itself is a moving colour-changing spot;
  the brain waits until after the second spot before producing the experience, so
  you never consciously experienced the two stationary spots. (The "editing" happens
  before consciousness.)

  - Orwellian: you consciously experienced the two stationary spots, then your memory
  was revised (after the event) to a moving spot, so what you report differs from
  what you consciously experienced. (The "editing" happens after consciousness, in
  memory.)


  Dennett argues no possible experiment could distinguish these because any evidence
  available to the subject is the same: the report. Both are "revisionist" accounts.
  He argues the distinction presupposes a Cartesian theatre.


