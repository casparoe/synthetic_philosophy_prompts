  The two camps:


  Camp 1: "Assertion camp" — lying is a distinctive wrong over and above misleading
  because it involves inviting one''s audience to trust an assertion one believes
  false, and thereby abusing a communicative practice central to cooperation. Even
  when the hearer ends up with exactly the same false belief, the lie contains a further
  wrong: the liar has used the hearer''s trust in assertion against them, treating
  the hearer as a means in a distinctive way. So there can be a moral difference,
  and typically lying is worse ceteris paribus.


  Camp 2: "Outcome camp" — the wrong of deception is in the false belief and the harm;
  if a lie and a misleading true statement are engineered to produce the same false
  belief, the same harm, and the same effects on the relationship, then they are morally
  on a par. Any felt difference is due to incidental features (deniability, culpability
  detection, social sanctions), not the lie itself.


