  Possible prompt:


  ---


  "I''m a software engineer with no formal training in philosophy, but a design problem
  has led me to a position I can''t quite defend or reject, and I''m hoping for a
  sharper statement of it.


  I work on generative systems — programs that produce music, text, or images by taking
  existing material and transforming it along dozens of parameters. A few years ago
  I noticed that every ''original'' output of these systems is really a recomposition
  of its training corpus under a set of continuous adjustments: tempo, register, vocabulary
  frequency, color palette, architectural style. Nothing in the output is genuinely
  new; only the settings are new. What startled me is how far this extends. A jazz
  soloist I listen to seems to be doing the same thing to a standard tune. An architect
  I know designs ''new'' buildings by taking a familiar type and turning dials — massing,
  setback, material, circulation — until it reads as fresh. When I tried to think
  of a genuine counterexample, like the invention of perspective or the first twelve-tone
  row, it still looked like someone had discovered that a dimension everyone treated
  as fixed was actually adjustable — a new dial, not a new kind of thing.


  So I''ve been pushed toward the view that all creativity consists in making variations
  on inherited structures: there are no new elements, only new values and newly discovered
  dimensions of variation. Two things bother me, though. First, I can''t tell whether
  ''discovering a new dimension of variation'' is just more dial-turning or something
  categorically different, and my view seems to collapse the distinction. Second,
  the view sounds like it should be banal — ''nothing comes from nothing'' — but when
  stated this way it seems to say something stronger that many people would reject.


  Is there an established name for this view of creativity, or for the specific distinction
  between turning an existing dial and discovering that something was a dial at all?
  And is the view as I''ve stated it defensible, or does it smuggle in a difference
  between elements and settings that breaks down on inspection?"


