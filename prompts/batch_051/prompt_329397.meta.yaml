  the rest of us -- treats the number as something we could get right or wrong, not
  as a report of the surgeon''s private feeling. A few weeks ago, by contrast, another
  relative announced that he was 80 percent confident that a third family member would
  keep a difficult promise, and I heard myself replying that probability does not
  apply to things like that.


  I have since noticed that the line I drew is unstable. A roulette wheel''s probability
  of landing on 7 (one in 37, say) looks objective because the wheel can be spun again
  and again and has a stable frequency. But the operation cannot be repeated, and
  neither can the promise. Yet I am inclined to place the surgeon''s number with the
  roulette wheel -- as probability in the world -- while placing the promise-number
  with subjective opinion. Weather forecasts and engineering failure estimates also
  concern particular, unrepeatable events, and I treat them as objective too. The
  uneasy case is legal guilt: a probability of guilt in a particular trial seems neither
  clearly in the world nor clearly a mere attitude.


