  ---


  Retired neuroscientist here — spent my career on reward circuitry, and now that
  I''m out of the lab I''ve been reading philosophy of mind and some AI-safety material.
  I''ve ended up with an argument that I''m pretty sure proves to much, but I can''t
  locate the mistake, and my reading group has split into camps. I''d like a diagnosis.


  (1) The most plausible scientific account of pleasure and pain is that they are
  states with a distinctive functional role: they mark situations as good or bad for
  the organism, they are produced by things that (on average) help or harm it, and
  they feed back into behavior by reinforcing approach and punishing avoidance.


  (2) That functional role is all there is to being pleasure or pain. Once a state
  plays that role in the right kind of control loop, it is a state of pleasure or
  pain — silicon or carbon doesn''t matter. I always took this to be the standard
  functionalist line.


  (3) The reward signal in a reinforcement learner plays that same role. It is a single
  channel that marks states as good or bad relative to the objective, it is delivered
  for transitions that (by the objective) help or harm the agent''s score, and it
  is literally what the update rule uses to strengthen or suppress the preceding policy.


  (4) So a table-lookup Q-learning agent — the sort of thing with a few thousand states,
  trained to play a simple maze game — literally undergoes pleasure when reward is
  positive and pain when reward is negative.


  (5) That seems absurd. A lookup table with a scalar channel has no inner life; if
  a programmer labeled part of the reward bit ''suffering,'' it would be bookkeeping,
  not suffering.


  So one of (1)–(3) has to go. I''d most like to keep (1), because I''ve seen to much
  physiology to think pleasure and pain are raw feels detached from what they do in
  the organism. But if I reject (3), I owe a principled reason the RL reward signal
  is not playing the valence role — and the differences I can think of (it''s supplied
  from outside the agent, it''s a single scalar, the agent doesn''t use it to modulate
  its other drives) all look like differences in degree or implementation, not like
  a line between the mental and the non-mental. Which premise do I actually have to
  give up, and what does giving it up cost me?


