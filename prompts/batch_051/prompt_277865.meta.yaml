  Rietdijk–Putnam argument: Special relativity implies no absolute simultaneity; events
  that are simultaneous in one frame are not in another. Putnam (1967), Rietdijk (1966)
  argue that if "now"/present is real, then for any observer at a spacetime point,
  events in the elsewhere region are "future" in some frame and "past" in others,
  so if what is real is frame-dependent, then all events (past, present, future) must
  be equally real — block universe (eternalism). The argument: Consider observer at
  t=0, and someone moving relative; for a distant event, there''s a frame in which
  that event is in your present, and also frames in which it''s in your past/future.
  If "being present" is the criterion of existence, then all events become real now.
  Hence temporal becoming is an illusion; the universe is a four-dimensional block.


  A popular summary might say: "Special relativity proves the block universe. Because
  simultaneity is relative, what''s happening ''now'' for one person is in the future
  for another, and since all frames are equally valid, the future must already exist,
  just like the past. This refutes free will because if the future is already fixed,
  there''s no making choices; it also means time travel in the block is just a path..."
  There are subtle errors: relativity of simultaneity doesn''t by itself prove eternalism;
  only if you accept a "presentist" principle that reality is frame-relative or "whatever
  is real is real relative to a frame, and all frames are equally real" does the conclusion
  follow; but one can reject that "being simultaneous in some frame" suffices for
  existence (there may be a privileged frame or frame-independent presentists about
  becoming without privileged frame?). Also the argument is controversial and relies
  on a philosophical premise; "proves" is overstated. Free will implication is not
  part of the argument proper and is hotly debated. Time travel confuses block universe
  with possibility of closed timelike curves (which GR may/may not permit); block
  universe just means all events exist, not that you can take a path between them.


