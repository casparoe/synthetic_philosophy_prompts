  irrational because they make you vulnerable to a money pump. Steps:


  (1) If an agent prefers A to B, and B to C, and C to A, then there is a finite sequence
  of trades, each of which the agent prefers at the time it is offered, that returns
  the agent to her original holding minus a fee.

  (2) A rational agent never voluntarily enters a sequence of trades that she knows
  will leave her worse off overall.

  (3) The agent can foresee that the sequence will leave her worse off.

  (4) Therefore an agent with cyclic preferences is not rational.


