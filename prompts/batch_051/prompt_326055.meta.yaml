  are cyclic and constant, the agent can foresee the whole sequence; step 2 says a
  rational agent wouldn''t enter. But is that valid? There''s a debate: money pump
  arguments may fail because the agent might refuse the final trade or exploit backward
  induction; or "prefers at the time" doesn''t aggregate. Also the notion that each
  trade is preferred given current preferences but the agent could foresee and refuse
  is weird. Could be an equivocation on "voluntarily enters a sequence" vs individual
  trades. Or the suppressed premise that sequence preferences aggregate from pairwise
  preferences.


