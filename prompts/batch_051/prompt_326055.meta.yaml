  Money pumps and diachronic rationality: The classic idea: if your preferences are
  cyclic (A > B > C > A), a trader can offer you a sequence of trades each of which
  you prefer, returning you to where you started but poorer. Diachronic rationality
  involves decisions over time, changing preferences, etc.


