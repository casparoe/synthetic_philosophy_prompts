  one is at least as plausible as the other (or both equally). (2) The plausibility
  of a conjunction A&B given E depends only on the plausibility of A given E and the
  plausibility of B given A&E — any plausible reasoning scheme that assigns different
  conjunctive plausibilities to the same pair of input plausibilities would be irrational.
  (3) Similarly, the plausibility of not-A given E depends only on the plausibility
  of A given E. (4) Steps 2 and 3, together with ordinary Boolean facts, force the
  plausible-relation to have the structure of a particular algebra: there is a rescaling
  of plausibility values under which the conjunction is the product and negation is
  complement. (5) Therefore any rational scheme is isomorphic to the probability calculus,
  so probability is the unique logic of plausible reasoning. Is this valid? If not,
  which step fails?


