  Cox''s theorem uses desiderata:

  D1: Plausibility of two propositions given common evidence can be compared (ordering).

  D2: Plausibility of a conjunction given evidence is determined by the plausibility
  of the conjuncts (specifically, of A given E and of B given A&E).

  D3: Plausibility of not-A given E is determined by plausibility of A given E.

  From these, plus consistency, one can derive that there exists a monotonic rescaling
  making plausibility satisfy sum and product rules. There are subtle issues: D2 and
  D3 (Cox''s assumptions) implicitly assume Boolean structure and that there''s a
  scalar representation. Also, the derivation has technical gaps (e.g., Halpern''s
  counterexample? Actually Halpern showed Cox''s theorem has a counterexample if you
  don''t assume additional conditions; Paris, Van Fraassen have criticisms). For a
  prompt, I can present a simplified argument and ask which step fails.


