  a proxy for what I''d call generalization rather than performance on whatever outcome-set
  we''re scoring. Process supervision adds a second proxy, yes, but it can reduce
  variance and give earlier and more diagnostic signal about where the model goes
  wrong. That''s a bias-variance tradeoff worth making.


