  The exchange, as I recorded it (both are competent; neither is a strawman):


  (1) A: We should give feedback on each reasoning step, not just the final answer.
  If we only score the final answer, the model can arrive at the right answer through
  a bad step that happens to cancel out an earlier mistake, and we''ll reinforce the
  whole trajectory. Outcome-only supervision cannot tell the difference between a
  solution that is right for the right reasons and one that is accidentally right.


  (2) B: Step-level feedback forces us to judge every intermediate step, which is
  expensive and, more than that, it imposes one particular decomposition of the problem
  onto the model. A final answer is checkable; an intermediate step is a judgment
  call. And plenty of the tasks we care about don''t decompose into clean steps at
  all, so process supervision quietly privileges tasks that do.


  (3) A: Outcome supervision just pushes that same judgment problem downstream. For
  open-ended tasks the "final answer" also needs an evaluator, and that evaluator
  can be gamed. Process supervision gives the model a denser learning signal and catches
  bad intermediate behavior before it has a chance to harden into a policy aimed at
  fooling an outcome judge.


  (4) B: But a weak step-supervisor is worse than a weak outcome-supervisor, because
  with step labels the model is rewarded for performing understanding in the style
  the supervisors expect. You can get a model that is fluent at showing its work and
  still wrong, and you''ve spent a lot of money teaching it that. Spend the same budget
  on more rollouts and better outcome evaluators instead.


  (5) A: A bad outcome evaluator can be exploited wholesale, and you won''t notice
  until the model has already learned to exploit it, because the misbehavior shows
  up only in the thing you''re not inspecting. Step labels at least make a supervisor''s
  standards explicit, so its errors are local and audit-able. The right response to
  a weak step-supervisor is to get a better one, not to throw out the signal density.


  (6) B: Explicit standards are not the same as correct standards, and audit-ability
  doesn''t fix that. The outcome is what we ultimately want; step-labels are a proxy
  for it, and the proxy can drift. If every step is exemplary but the conclusion is
  wrong, we''ve trained the wrong thing. Outcome supervision keeps the training signal
  aligned with the target, even if it''s sparser.


