  Draft final:


  I recently became the person who has to sign off on how our team supervises a model
  that produces multi-step solutions to quantitative reasoning problems, and I''m
  trying to settle a dispute between two engineers on the team. I took notes during
  their argument; I''ve reproduced it below as faithfully as I can from memory. I
  have my own leanings, but I''ve deliberately left them out here. I''d like you to
  adjudicate the exchange itself, move by move.


  [Dialogue]


  (1) Priya: We should score each reasoning step, not just the final answer. If we
  reward only the final answer, a trajectory that reaches it through an invalid move
  that happens to cancel an earlier error gets reinforced just as much as a sound
  solution. Outcome-only supervision cannot distinguish "right for the right reasons"
  from "right by luck," and that distinction is exactly what determines whether the
  model will generalize or just get lucky on the training distribution.


  (2) Evan: Step-level scoring requires somebody to judge every intermediate step,
  which is expensive and, worse, not objective. A final answer can be checked; an
  intermediate step is a judgment call about the right way to carve the problem. Some
  of the tasks we want the model to do don''t decompose into cleanly checkable steps
  at all. If we insist on process feedback, we''ll quietly restrict ourselves to tasks
  that do.


  (3) Priya: That just moves the problem downstream. For any task where the model''s
  output is interesting, the final result also has to be evaluated by someone or something,
  and that evaluator can be wrong or gamed. Process supervision gives the model a
  much denser signal per trajectory, and it catches bad intermediate behavior before
  it hardens into a strategy for fooling an outcome judge. If the worry is the cost
  of labels, I''d compare it to the cost of not noticing what the model learned until
  deployment.


  (4) Evan: Dense signal is only good if it''s signal. A mediocre step-supervisor
  tags steps according to its own sense of what "good reasoning" looks like, so the
  model is incentivized to perform understanding in whatever style the supervisors
  reward. You end up with a model that is fluent at showing its work and still wrong,
  and you''ve blown the labeling budget. Spend it on more rollouts and better outcome
  evaluators instead.


  (5) Priya: A bad outcome evaluator is easier to exploit, not harder. If the model
  learns to game the outcome judge, the gaming is invisible precisely because we''ve
  refused to look at the steps. With step-level labels, the supervisor''s standards
  are on the table and its errors are local and auditable; a wrong step label can
  be spotted and fixed. The remedy for a weak step-supervisor is a better one, not
  throwing away the denser signal altogether.


  (6) Evan: Auditability doesn''t make a wrong standard right. The final result is
  the thing a user actually cares about, so step labels are a proxy, end of story.
  And step labels can drift from the outcome: a solution can be immaculate at every
  step and still answer the wrong question, while an ugly solution can get the right
  answer and do what the user needed. Outcome supervision keeps the reward trained
  on the actual target, even if it''s sparse. That seems to me the safer bet.


