  Let me outline moves:


  Move 1 (Mira, process): We need to supervise the model''s intermediate steps, not
  just the final answer. If we only grade the final answer, the model can reach it
  by an invalid inference and still get reinforced, so it learns to take bad routes
  that happen to work on training cases and fail elsewhere.


  Move 2 (Daniel, outcome): But when we use process supervision, someone has to label
  every step as correct or not. That''s expensive and, worse, it smuggles in one particular
  way of carving a problem into steps. A final answer is at least objective; step
  labels reflect the supervisor''s own idea of what a legitimate step is. Also, many
  real tasks don''t have a clean sequence of checkable steps — open-ended research
  or design, say — so process supervision quietly selects for tasks that decompose
  nicely.


  Move 3 (Mira): The expense is real, but outcome supervision has the same problem,
  just moved: to verify an open-ended outcome you need a judge, and that judge can
  be gamed. With process supervision, you catch the gaming at the step where it happens;
  the model can''t learn an entire policy of deceiving the judge before it has logged
  any intermediate misbehavior. Also, process supervision gives denser signal per
  trajectory, so sample efficiency improves.


  Move 4 (Daniel): But process feedback can teach the model to mimic whatever the
  supervisor expects at each step, not to solve the problem. If the human (or weaker
  model) giving step labels has lousy judgment, the model gets rewarded for a kind
  of performance — showing its work in a way the supervisor likes — that may be unrelated
  to getting outputs right. Better to use outcome rewards and spend the saved labeling
