  I recently moved into a role where I''m responsible for how our team fine-tunes
  a model that produces multi-step solutions to quantitative reasoning problems, and
  I''m now the one who has to sign off on the supervision scheme. At our last design
  meeting, two engineers on the team got into a long argument about process-based
