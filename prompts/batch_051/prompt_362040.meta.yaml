  of intervention uses the very directed, causal notions—path, cause, effect—that
  the analysis was meant to illuminate. Woodward''s reply is that the circularity
  is non-vicious because the project is not reductive: intervention, invariance, and
  causation are defined as a package, and the package earns its keep by making empirical
  sense of controlled experiments and of the invariant generalizations they uncover.


  This paper argues that the usual reply is correct but stops one step short. The
  residual problem is not that the account is circular in itself—many useful explications
  are—but that it is circular at exactly the point where it needs to explain causal
  direction. Suppose we want to test whether X causes Y by asking whether an intervention
  on X changes Y. To know that some I is an intervention on X relative to Y, we must
  know that I does not influence Y along a route that bypasses X. But ''a route that
  bypasses X'' is precisely the kind of directed-fact that the test was supposed to
  establish. Thus a finite inquirer who lacks directed causal knowledge in advance
  cannot apply the interventionist criterion to acquire it; the criterion presupposes
  the direction it is supposed to reveal. Invariance under interventions cannot break
  the circle, because whether a generalization is invariant under interventions on
  X, rather than on Y, can only be assessed once we have identified the interventions
  on X.


