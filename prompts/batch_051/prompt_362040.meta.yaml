  or conceptual account, not an epistemology of causal learning. Yet the circularity
  worry was itself partly epistemic. It arose because the account seemed, in the words
  of its critics, to explain causation by invoking ''hidden experimenters'' whose
  interventions are themselves causal. If the project is only semantic, that reply
  is fine; but then interventionism offers no story about how causal direction is
  fixed in the first place. In practice, I suggest, we fix it by leaning on lower-level
  mechanistic and spatiotemporal knowledge—we know a lever moves a vat and not the
  reverse because we can trace the transfer of momentum. If that is right, interventionism
  does not stand alone as an account of causation: it is parasitic on a production/mechanism
  conception for precisely the feature, directionality, that it needs most."


