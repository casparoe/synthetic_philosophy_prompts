  "James Woodward''s interventionist account says, roughly, that X causes Y just in
  case Y would change under an intervention on X, with the other relevant variables
  held fixed by interventions. The account is circular: an intervention on X with
  respect to Y is standardly defined as a causal process that sets X, that severs
