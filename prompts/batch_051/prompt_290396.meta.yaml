  raise. A''s payoff if quit: -b (loser); B''s: V-(b+ε). So B compares quitting (-(b-ε))
  vs raising, anticipating A''s decision. If A then quits, B gets V-(b+ε). For B,
  raising is better than quitting if V-(b+ε) > -(b-ε) → V - b - ε > -b + ε → V > 2ε.
