  Prompt:


  "I cover science and ideas for a living, and I have been turning over a conflict
  that keeps appearing in my reporting. On one side is a research program I find genuinely
  impressive: the structural-demographic, or ''secular cycles,'' approach to macrohistory
  associated with Peter Turchin. As I understand it, the theory holds that large agrarian
  and early modern societies oscillate through recurrent phases driven by a small
  set of pressures: population growth pressing against the land''s carrying capacity;
  the overproduction of elites relative to the positions and livelihoods available
  to them; falling real incomes and living standards for ordinary people; and a state
  whose spending obligations expand while its revenues stagnate. When these pressures
  peak together, societies become statistically prone to political instability — popular
  revolt, intra-elite conflict, fiscal crisis, state breakdown — and slip into a disintegrative
  phase, after which the cycle resets. The appeal is exactly what I want from a science:
  many apparently distinct crises unified under one causal mechanism, variables measured
  and compared across centuries and continents, and a procedure that at least claims
  to say when instability is more or less likely rather than merely explaining it
  after the fact."


  Then intuition: "On the other side is an intuition I cannot talk myself out of.
  When I think of the French Revolution, I do not think of a society crossing a threshold
  on a composite index. I think of a specific fiscal crisis, specific harvest failures,
  specific pamphlets, and particular ministers and assemblies making particular decisions
  in 1788 and 1789. The difference between reform, constitutional monarchy, terror,
  and military dictatorship seems to lie exactly in those particulars — in beliefs,
  personalities, accidents, and the meanings people attached to their situation. A
  model built from population, prices, and elite numbers would not have told you which
  of those futures France would take, and the choice among them is precisely what
  matters for actual human lives. So I feel as though the theory, however elegant,
  abstracts away the very thing history is about."


  Then ask: "What I want from you is the strongest version of both positions and a
  negotiated verdict. Does the theory actually contradict the intuition, or only contradict
  a philosophical gloss on it (the claim that structure explains everything)? Is the
