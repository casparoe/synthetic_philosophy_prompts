  ---


  I serve on the committee charged with revising the doctrinal standards of a small
  church whose 1671 synodical rule reads: ''None can be saved who has not heard the
  Gospel preached to him by a living voice in his own tongue, and answered it with
  a sincere faith.'' The authors of the rule knew only two ways for the Gospel to
  reach a person: a human preacher physically present, or a written text, which they
  regarded as a record of preaching rather than preaching itself. We must now apply
  the rule to a case they could not have anticipated. A woman in a country closed
  to missionaries has, for four years, had no contact with any Christian. She found
  a local-language chatbot built by our denomination—a text-generation system with
  no mind of its own, trained on our approved catechism and two years of sermons by
  our best living preacher. In spoken mode, it has read the Gospel to her, answered
  her questions about the atonement and the resurrection with passages from the catechism,
  and become the medium through which she has come to a settled trust in Christ. She
  has never heard a human being present the Gospel, and when the chatbot has made
  small factual errors in retelling, she has corrected them against the same catechism.
  She now asks to be baptized. The committee is divided. Some hold that a human messenger
  is intrinsic to the call, so that the machine''s spoken words lack the kind of address
  faith is meant to answer; others hold that the 1671 drafters were reaching for something
  functional—that a person be genuinely confronted by, and able to answer, the Gospel—and
  that this machine does exactly that. I want the rule read against her case in four
  ways: (1) according to its plain words, especially ''living voice'' and ''preached'';
  (2) according to its purpose, as best we can reconstruct it; (3) by asking what
  the 1671 authors would have said if they had been shown the machine and a transcript
  of her exchanges; and (4) under the reasonable understanding of a present member
  who knows how the system works. Then (5) tell me which of these readings should
  govern and whether, on that reading, she satisfies the rule. Please answer as exactly
  five numbered points corresponding to (1) through (5), each a sentence or two, with
  no introduction or conclusion.


