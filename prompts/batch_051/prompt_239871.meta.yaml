  "A Working Title for the Piece: The Units of Selection Debate Is Largely a Dispute
  About Which Question Gets the Name


  When scientists argue about ''the unit of selection,'' they seem to be disagreeing
  about a single fact: is natural selection something that happens to genes, to organisms,
  or to groups? My suspicion is that there are at least three distinct questions packed
  into that phrase, and that most of the apparent conflict comes from answering different
  questions under one heading.


  The first is the replicator question: what is copied across generations with enough
  fidelity for cumulative selection to build on? Here genes have the strongest claim,
  on a Dawkins-style understanding of a replicator, roughly: any hereditary information
  whose differential survival is large relative to its rate of mutation or structural
  change. Whole organisms do not copy themselves; groups copy themselves with even
  less fidelity.


  The second is the interactor question: what entity presents an integrated phenotype
  to the environment, so that its success or failure affects the replicators inside
  it? For many traits — foraging efficiency, camouflage, thermoregulation — the organism
  is clearly the interactor. For other traits — such as a colony''s shared anti-predator
  behaviour or the density-dependent virulence of a parasite population within a host
  — a group is at least a plausible interactor. Here the term ''unit'' picks out something
  ecological and causal, not something copied.


  The third is the benefit question: at what level does a trait look like an adaptation
  — for whose good does it exist? A trait can be individually costly but group-advantageous,
  or group-advantageous at one scale and gene-advantageous at another; the answer
  depends on the covariance between trait and fitness at each level. Saying that a
  trait is ''group-beneficial'' is a claim about fitness covariance, not yet a claim
  about mechanism.


  Once the three questions are distinguished, a good deal of the familiar shouting
  match dissolves. A gene-centred view is first and foremost a thesis about the first
  question; many multilevel selectionists are making claims about the second and third.
  The rival camps are often filling in different entries of the same table rather
  than contradicting one another. The Price equation and contextual analysis already
  presuppose this: group selection is detected when there is a between-group component
  to the covariance between trait and fitness that remains after within-group effects
  are taken into account. That is a statistical claim, and it is compatible with the
  fact that all the mechanical pushing and shoving happens at the level of individual
  survival and reproduction.


  But I do not think the entire debate is verbal. The substantive residue is whether
  group-level properties can be causes, or whether they are merely redescriptions
  of lower-level events. A critic may say: since each death and each birth is an individual
  event, the group level cannot be genuinely causal. I would reply that this confuses
  causation with mechanism. Humidity and temperature cause condensation even though
  molecules do all the colliding; the macro-level variables are true difference-makers
  because interventions on them, holding lower-level composition fixed, are systematically
  associated with different outcomes. Population structure — migration rates, group
  size, the rules of group formation — often passes exactly this interventionist test:
  change the structure, hold the organisms'' individual properties fixed, and the
  population''s trajectory changes. So group-level structure is a cause even though
  the mechanism runs through individuals.


  My conclusion, then, is that the debate should be reframed rather than won. The
  interesting empirical question is not ''which unit is the unit?'' but ''in this
  particular population, how much of the variance in fitness is explained at each
  level, and does the between-group component matter enough to shape the trait?''
  On that question, I suspect, the parties have more shared ground than their rhetoric
  suggests."


