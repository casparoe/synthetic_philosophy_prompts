  Possible prompt:


  "I''m a researcher in an interdisciplinary group that studies how scientific communities
  change their minds, and I keep noticing a pattern I don''t have a name for. A community
  treats a small set of foundational commitments as effectively off-limits: when an
  experiment or observation conflicts with predictions derived from those commitments,
  the community doesn''t question the commitments. Instead, someone adds a new auxiliary
  assumption, a new model parameter, or a new boundary condition that explains away
  the anomaly. These patches often lead to new testable predictions, and sometimes
  those predictions succeed. But over time I''ve seen cases where the patches become
  so numerous and individually reasonable that the original commitments end up doing
  very little work: the community can accommodate almost any outcome by adding another
  patch, and the difference between successful and failed predictions seems to matter
  less and less. I can give two concrete examples: one from early modern astronomy
  before Copernicus, where circles-upon-circles defended geocentrism; and one from
  a contemporary field I won''t name, where a dominant model explains every failed
  intervention by appealing to an additional unmeasured contextual factor. I''ve read
  some Popper, and I know about ad hoc hypotheses, but this is not simply one ad hoc
  move; it''s a long-term pattern in which a research tradition survives by changing
  everything around its core, while the core itself becomes almost untestable. Is
  there a name for this pattern, how is it different from ordinary scientific caution
  about auxiliary hypotheses, and what criterion distinguishes a healthy version of
  this pattern from a pathological one? I''m not satisfied with a bare label: I need
  to know exactly what the phenomenon is, what its boundaries are, and which features
  are essential rather than accidental."


