  Write final prompt:


  "I''m part of an interdisciplinary reading group on scientific change, and I keep
  running into a pattern I don''t have a term for. A research community treats a small
  set of foundational commitments as effectively non-negotiable, so that when an observation
  conflicts with what those commitments predict, the community almost never asks whether
  the commitments themselves are wrong. Instead, it adds a new auxiliary assumption,
  a new parameter, or a new boundary condition that explains away the anomaly. Often
  these additions make new testable predictions, and sometimes those predictions succeed.
  But in other cases I have watched the additions accumulate until the original core
  commitments do almost no work: any outcome, however surprising, can be handled by
  adding one more locally plausible patch, and the community no longer seems to treat
  failed novel predictions as especially damaging. I can think of one historical example,
  the proliferation of epicycles and equants in late Ptolemaic astronomy, and one
  contemporary example from a field I would rather not name, where a dominant model
  explains every failed intervention by invoking an additional unmeasured contextual
  factor. I have read Popper, and I know what an ad hoc hypothesis is, but this is
  not a one-off ad hoc move; it is a long-term pattern in which a tradition survives
  by changing everything around its protected center while the center itself becomes
  harder and harder to test. Does this pattern have an established name? How is it
  different from ordinary scientific caution about auxiliary hypotheses, and what
  criterion separates a healthy version of the pattern from a pathological one? I
  am not looking for a bare label; I need the boundaries and essential features."


