  Naked statistical evidence problem: In civil cases, preponderance of evidence (~50%+),
  but courts are reluctant to find liability on bare statistics. Classic examples:


  - Blue Bus: plaintiff hit by bus, knows 80% of buses on route owned by Blue Bus
  Company. No other evidence. Should the jury find for plaintiff against Blue Bus?
  Most people say no, despite p=0.8 > 0.5.

  - Gatecrasher: 1000 people at rodeo, only 499 paid, 501 crashed; organizers can''t
  identify who. Seat 1000th? Pick a random attendee; probability they gatecrashed
  = .501. Can''t win against a randomly selected attendee... Or the "prison yard"
  example.

  - Prison yard: 99 prisoners and one guard in yard; a prisoner shanks someone; probability
  a given prisoner is the attacker high, but no proof against a particular selected
  prisoner. (See Nesson, "The Evidence or the Event?")


  Distinction: statistical evidence vs individualized evidence. Justice requires more
  than high probability that the defendant is liable? Some philosophers (Thomson)
  argue liability requires that the evidence be about the defendant, not just about
  a class. Critics (e.g., Enoch, Spectre, Fisher) argue there''s no principled epistemic
  difference: if the only thing that matters is the probability that this defendant
  did it, naked statistics can be enough; reluctance is moral/political, not epistemic,
  or that the distinction is dubious. But there are epistemic accounts: sensitivity,
  safety, normic support. Smith''s normic support: legal proof requires evidence that
  makes the error scenario abnormal rather than merely improbable. Naked statistical
  evidence can give high probability but all those probabilities are equally normal?
  E.g., in blue bus, a world where the other 20% bus was the culprit is just as normal
  as the 80% world; no normic support. That''s a defensible epistemic basis for the
  habit.


