  Objective Bayesianism / max entropy principle: choose the prior that maximizes Shannon
  entropy subject to known constraints (e.g., known expectations). This is claimed
  to be the rational prior. A classic problem: "The maximum entropy principle is language/variable
  dependent" — the same background knowledge, expressed in different parametrizations,
  yields different maximum-entropy distributions. E.g., if you''re completely ignorant
  about a parameter θ on [0,1], max entropy gives uniform on θ. But if you reparametrize
  to φ = θ^2, complete ignorance should give... applying max entropy to φ with the
  same "no constraints" yields uniform on φ, not the transformed uniform. These are
  different distributions over θ. So "complete ignorance" doesn''t pick a unique prior;
  max entropy is not invariant under reparametrization. This is a known problem (Bertrand''s
  paradox generalized). Another known problem: marginalization — maximum entropy priors
  for a joint system don''t match marginals; and conditioning. The classic critique
  by Seidenfeld, and reframed as "group invariance" (Jaynes). But we shouldn''t need
  citations.


