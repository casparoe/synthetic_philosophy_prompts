  whether saying "I promise to come" is more like reporting that I promise, or more
  like the act of promising itself. He kept saying it''s a "performative utterance,"
  that saying it under the right conditions doesn''t describe a promise, it makes
  one, and that even ordinary statements like "the cat is on the mat" are doing something
  more than just reporting. I''m a backend engineer, and I think in terms of commands
  versus queries, functions that return values versus functions that mutate state,
  side effects, exceptions, transactions, and whether a call commits or rolls back.
  I tried to translate what he was saying into that vocabulary and it half-worked,
  which is why I''m writing this.


  What I''d like is a careful, honest translation. Take the speech act picture roughly
  as he gave it to me: there are constatives, which state facts and can be true or
  false, and performatives, which do something in the world just by being uttered
  when the surrounding conditions are right (the right speaker, the right context,
  the right authority, everyone understanding what''s going on); if a performative''s
  conditions fail, it doesn''t come out false, it''s void or misfired, the way a function
  that isn''t supposed to return a boolean doesn''t return false, it throws or fails
  to commit. Then there''s the later twist where even the fact-stating ones turn out
  to have a kind of force, so the constative/performative split gets soft.


