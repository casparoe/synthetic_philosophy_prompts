  pure functions versus side-effecting calls, return values versus exceptions, preconditions
  and transactions and commit/rollback, maybe type signatures if they help. Go piece
  by piece: the utterance, the force it carries, the conditions that have to hold
  for it to succeed, the way it can fail without being false, the way context and
  authority matter. For each piece say what translates cleanly, what you had to fudge
  to make it fit, and what has no counterpart at all in my vocabulary. Then the part
  I actually care about: after the translation, is there anything left in his picture
  that my vocabulary just can''t express, and if so, is that because my vocabulary
  is missing something real, or because the speech act distinction is less sharp than
  my friend thinks it is? Keep it honest; if the translation starts to feel like it''s
  doing the philosophy for you, tell me where.


  Oh, and please no headings, bullet points, bold text, or tables: continuous prose
  only, the way you''d write an email.


