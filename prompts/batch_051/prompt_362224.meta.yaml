  (1) A grouping counts as a real kind only if its members share properties downstream
  of the grouping itself in a way that supports reliable projections, and its boundaries
  track genuine discontinuities in an underlying causal process rather than stipulation.
  (2) Generational groupings sort people by birth-year brackets whose endpoints are
  conventions: Boomers are said to begin in 1946 and end in 1964, Millennials to run
  from 1981 to 1996, and so on, and these endpoints were chosen by demographers, pollsters,
  and editors, not located by observing sharp transitions at 1964/1965 or 1996/1997.
