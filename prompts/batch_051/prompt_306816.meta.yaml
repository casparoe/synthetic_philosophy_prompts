  "I have been arguing with a psychiatrist friend about a pattern in how delusions
  are handled, and I cannot find the principle that makes it consistent.


  Consider a patient with Capgras delusion who tells his clinician that his wife has
  been replaced by an impostor. When the clinician writes the notes, she treats the
  utterance as the report of a belief: the condition is picked out by its content,
  the patient is said to believe that his wife has been replaced, and the intervention
  is aimed at this belief. Yet everywhere else in the encounter the same utterance
  is treated as something quite unlike an ordinary belief. Nobody asks the patient
  for his evidence; nobody attempts to reason him out of the claim; and he is not
  criticized or blamed for asserting something so poorly supported. With an ordinary
  false belief, by contrast — a relative who has been taken in by a scam, say — we
  do exactly those things: we demand reasons, we argue, and we hold the person partly
  responsible for having been so credulous. So the practice treats one and the same
  state as a belief for the purposes of classification and as something other than
  a belief for the purposes of epistemic response.


  A widely discussed account in delusion research, the two-factor theory, appears
  to sharpen rather than dissolve the difficulty. On this view, the delusion issues
  from an anomalous experience — here, a powerful feeling that one''s spouse is not
  one''s spouse — together with a second factor, a deficit in the system that evaluates
