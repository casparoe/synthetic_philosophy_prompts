  "I have been discussing with a psychiatrist friend an inconsistency I cannot resolve
  in the way she and her colleagues talk about delusions, and I would like the strongest
  defense of the practice — or a frank admission that it is indefensible.


  Consider a patient with Capgras delusion who tells his clinician that his wife has
  been replaced by an impostor. For diagnostic purposes the clinician treats the utterance
  as the report of a belief: the condition is identified by its content, the patient
  is said to believe his wife has been replaced, and the treatment plan targets the
  belief. But in every other part of the encounter the same utterance is handled as
  something rather different from an ordinary belief. No one asks the patient for
  his evidence, no one tries to talk him out of it, and he is not held to the standards
  we impose on someone who asserts a poorly supported claim. With an ordinary false
  belief — a friend convinced by a bad investment tip, say — we do exactly those things:
  we ask for reasons, we argue, and we hold the person responsible in some degree
  for the quality of his belief. So clinical practice treats one and the same state
  as belief when it is useful to classify it and as non-belief when it comes to the
  responses beliefs normally invite.


  The leading account in delusion research, the two-factor theory, seems to sharpen
  rather than dissolve the puzzle. It says the delusion arises when an anomalous experience
  — such as a profound feeling that one''s spouse is unfamiliar — is met by a second
  factor, a deficit in the system that evaluates candidate beliefs, so that the implausible
  explanation is accepted uncritically. But notice the tension: the second factor
  is described as a failure of belief evaluation, which presupposes that what is produced
  really is a belief, with the usual representational and inferential profile. If
  it is a belief, why does practice withhold the responses ordinary beliefs attract?
  If it is not a belief, then what exactly is the second factor a deficit of, and
  what makes the speech act report the delusion for diagnostic purposes? I want the
  strongest principle that could justify treating delusions as beliefs for classification
  while exempting them from doxastic criticism and correction — and an honest verdict
  on whether that principle survives close testing, or whether we should revise either
  our diagnostic language or our ordinary responses."


