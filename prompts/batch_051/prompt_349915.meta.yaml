  your present credence should be the expectation of your future credence, for future
  states you now regard as rationally reached.


  Two classmates, Elena and Marcus, then argued as follows:


  (1) Elena: Reflection captures an internal coherence requirement about our own future
  opinions. If I expect tomorrow''s version of me to be at least as well-informed
  and careful as today''s, I can''t coherently say that tomorrow I''ll believe the
  defendant is guilty to degree .7 while today I believe it only to degree .4 and
  that this gap needs no correction. If the future method is good, its verdict should
  move me now; if I refuse to move now, I''m treating a method I claim to respect
  as arbitrary.


  (2) Marcus: That can''t hold without qualification. Suppose I know that in a few
  minutes I will take a drug that makes me overconfident about whichever proposition
  is then before my mind—so that after taking it I will believe some fair lottery
  ticket will win to degree .9. Reflection would force me now to raise my credence
  toward .9 on pain of irrationality. But the only irrational state here is the future
  one. A principle of rationality should not require me to defer to a state I know
  is defective.


  (3) Elena: The principle we learned already has the needed qualification: it applies
  only to future credences that you now regard as formed by reasoning no worse than
  your own. A future state caused by the drug fails that test. So your case is a counterexample
  to an unqualified version, not the principle itself.


