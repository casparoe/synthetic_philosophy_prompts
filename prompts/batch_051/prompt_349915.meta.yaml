  Potential prompt draft:


  "I''m a student in a formal epistemology course. Last week we covered Van Fraassen''s
  Reflection principle, which we stated roughly as follows: an agent''s current credence
  in a proposition should equal her expectation of her future credence in that proposition,
  at least for future states that she now regards as rational. After class I listened
  to two classmates, Elena and Marcus, argue about it, and I''d like an expert in
  formal epistemology to adjudicate their exchange."


  Then the exchange:


  1. Elena: The principle captures something we already accept about our past and
  future selves. If I now regard my future opinion as the product of reasoning at
  least as good as mine, then I can''t coherently say "tomorrow I''ll believe p to
  degree .7, but today I only believe it to degree .4, and that gap is fine." If my
  future method is good, its output should move me now; if I won''t move now, I''m
  tacitly treating a method I claim to respect as arbitrary.


  2. Marcus: That''s too strong. Suppose I know that in ten minutes I''ll take a drug
  that makes me highly confident—essentially .9—in whatever proposition I''m then
  considering, including that a given fair lottery ticket will win. Reflection would
  tell me to raise my credence now toward .9, or that my current low credence is irrational.
  But my current credence is exactly right; the irrational one is my future self.
  A principle of rationality shouldn''t require me to pre-defer to a state I know
  is defective.


  3. Elena: The principle as we learned it has a proviso: it only concerns future
  states I now regard as responsibly formed. A drug-induced overconfidence is precisely
  not that. So your case doesn''t touch the qualified principle, and it''s no surprise
  that Reflection would be false for arbitrary future credence profiles.


  4. Marcus: The proviso is doing suspicious work. If "regard as rational" just means
  "endorse," qualified Reflection says only that you should defer to opinions you
  endorse—which is near-tautological, not a substantive constraint. If it means something
  more, like "produced by conditionalizing on the total evidence," then it doesn''t
  cover ordinary agents, who could reasonably suspect they''ll update imperfectly
  even without drugs. Either way, the principle either collapses or loses its generality.
  And there''s a deeper issue: trust in a future self seems partial and gradable,
  not all-or-nothing, whereas Reflection demands full deference to any future state
  that clears the bar.


  5. Elena: Perhaps the charitable reading is that full deference falls out of idealization.
  In the model where I update by conditionalization and never lose evidence, my current
  credence just is the expectation of my future credence; Reflection is then a theorem
  about coherent planned updating, not a separate demand that real agents defer to
  flawed future selves. The principle''s normative force is that, insofar as I approximate
  that ideal, I should update toward future views; insofar as I don''t, I needn''t.


