  Let me draft:


  "I''ve spent my career building systems where you keep the underlying data correct
  and uncompromised, whatever the application layer does with it. That disposition
  is making it hard for me to fully accept a view of history I otherwise find persuasive.
  The view is roughly Nietzschean: the past has no value for its own sake; it matters
  only insofar as it serves present and future life, through the three modes he calls
  monumental (holding up exemplars to inspire action), antiquarian (cherishing a heritage
  that gives a community continuity), and critical (breaking with a past that constrains
  growth). On this view, the historian is doing something like an engineer designing
  an interface: the same past can and should be selected, shaped, and at times left
  aside entirely according to what a living community needs, and an excess of unprocessed
  historical truth can paralyse or destroy. I am drawn to this because it is honest
  about history being selective and service-oriented rather than a passive mirror.


  But I have a firm countervailing intuition, probably from engineering as much as
  anything: brute accuracy matters. If a people has suppressed or mythologised an
  uncomfortable fact about itself, I want the record corrected even if the correction
  has no obvious use for present flourishing and even if it genuinely weakens the
  community''s self-image or capacity to act. I cannot bring myself to say that a
  damaging, useless truth is therefore less worthy of being known, or that a falsification
  that energises a community is therefore fine.


  I am not asking which side wins. I want to know, in a negotiated way: what would
  it take for the intuition to be the thing that gives, what would it take for the
  instrumental view to be amended or abandoned, and whether there is a reading of
  ''worth being known'' on which both can survive — for example one in which the underlying
  record remains uncompromised at the level of evidence while the uses to which communities
  put that record remain life-directed. Please write the response in British English."


