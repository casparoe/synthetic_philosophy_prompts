  Let me define moral trade properly. The term: In deontology, "moral trade" refers
  to cases where one agent can violate one of his own deontological constraints in
  order to prevent another agent from violating one of her constraints, and the second
  does likewise, such that each less important constraint is violated but more important
  ones are respected. The concern: deontological constraints are agent-relative —
  my constraint not to murder binds me regardless of whether my murder prevents more
  murders by others. But can I "trade" my own smaller violation for another''s avoidance
  of a larger violation? Some argue that if constraints are agent-relative, such trades
  are impermissible on standard absolutism, because each agent''s violation is his
  own. Others argue that a moderate deontology (thresholds) can permit them.


  Example: Dr. A has a strong moral objection to performing abortions and a weak objection
  to withdrawing life support; Dr. B has a strong objection to withdrawing life support
  and a weak objection to performing abortions. Two patients: one needs an abortion
  (which Dr. A could perform if he overrides his objection) and one is irreversibly
  dying and life support should be withdrawn (which Dr. B could do). If each treats
  his own patient, each does what he strongly objects to? Wait, need to set it up
  so trade improves.


