  that abortion is gravely wrong and that withdrawing artificial nutrition and hydration
  from a dying patient is only mildly wrong. Dr. S documented the reverse: abortion
  only mildly wrong; withdrawing artificial nutrition gravely wrong. Under the current
  on-call schedule, Dr. R is assigned to perform an early abortion, and Dr. S is assigned
  to withdraw artificial nutrition from a patient whose family and care team have
  agreed it is appropriate. Each would be asking for a conscientious accommodation,
  but our back-up coverage is thin that week. The doctors propose to swap patients:
  Dr. R would perform the withdrawal (an act she regards as mildly wrong), and Dr.
  S would perform the abortion (an act he regards as mildly wrong). Each patient receives
  the same treatment as before; each physician is spared having to perform the act
  he or she regards as gravely wrong, but each still performs an act he or she regards
  as wrong to some degree.


  The committee''s unease is hard to pin down. On one hand, the swap seems to honor
  each clinician''s most serious moral commitments at no apparent cost to patients.
  On the other hand, our conscientious-objection policy treats each clinician''s act
  as the clinician''s own moral act, and the fact that Dr. R''s participation in the
  withdrawal allows Dr. S to avoid a graver wrong is a benefit to Dr. S''s conscience,
  not a feature that changes what Dr. R herself does. There is also a worry about
  making individual moral scruples fungible: approving the swap could turn conscience
  into a resource to be brokered rather than a limit on what one is willing to do.


