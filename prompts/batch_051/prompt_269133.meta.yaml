  Let me develop the domain precisely.


  Gauge freedom: In gauge theories (electromagnetism, Yang-Mills), there are transformations
  of the fields that leave the equations of motion and all observable content invariant.
  Classic view: gauge-dependent descriptions are redundant: different gauges describe
  the same physical possibility; only gauge-invariant quantities (field strengths
  F, Wilson loops, holonomies) are real. The "surplus structure" is an artifact of
  our formalism. The debate: what is real in a gauge theory? Some argue the gauge
  field/A-field is real because of Aharonov-Bohm (a phase shift in an interference
  pattern due to the vector potential in a region where B=0) — though the AB phase
  is itself gauge-invariant under suitable conditions (holonomy). Others argue edge
  modes and topological constraints are physically meaningful but gauge-variant. There''s
  also the structuralist line: the real content is the relational structure captured
  by holonomies (not the gauge potential). Fine.


  The two camps for the adversarial collaboration:

  1. "Redundancy camp": gauge symmetries are nothing but descriptive redundancy; the
  full gauge-variant field is surplus structure; only gauge-invariant observables
  correspond to anything real. Physical content is fully captured by holonomies/Wilson
  loops/curvature.

  2. "Residual-structure camp" (call it "holonomy-plus" or "gauge-cohesion camp"):
  gauge structure encodes physically meaningful relations — the fact that a curve''s
  holonomy transforms under gauge at endpoints reflects the fact that charges source
  fields at separated points; nontrivial boundary conditions, edge modes, and anomalies
  show that some gauge-variant or nonlocal structure is not mere fluff.


  Agreed claims: local gauge transformations connect empirically equivalent descriptions
  of the bulk; no experiment can fix absolute gauge in the bulk; gauge-invariant quantities
  are necessary to state empirical predictions; one shouldn''t reify arbitrary gauge-fixing
  choices.

  Disagreement: whether the full quotient (reduced configuration space) is physically
  complete, or whether the bundle/connection structure is itself part of the furniture.

  Cruxes:

  - The Aharonov-Bohm phase: does it show the gauge potential is real, or only the
  holonomy (a gauge-invariant loop integral)?

  - Edge modes/boundary charges: does the existence of gauge-variant boundary degrees
  of freedom in finite regions show that gauge structure is physically significant,
  or are these artifacts of cutting a system?

  - The charge–gauge coupling relation: does local gauge symmetry as a constraint
  on matter coupling show real constraints on possible worlds, or is it just a representational
  device?

  - Quantum anomalies? Maybe too niche. Keep to AB and boundaries.


  For each crux, each side''s prediction: e.g., "for the finite-region case, the redundancy
  camp predicts that all empirical predictions can be recovered from gauge-invariant
  bulk plus boundary-invariant data, while the residual-structure camp predicts that
  some measurable edge effects require retaining gauge-covariant edge fields."


