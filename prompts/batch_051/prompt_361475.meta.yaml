  Husserl distinguishes:

  - Natural attitude: we accept the world as simply there.

  - Epoché (or bracketing): suspending judgment about the existence of the natural
  world; "putting out of action" the general thesis of the natural attitude. We don''t
  deny it; we refrain from using it.

  - Phenomenological reduction: the method that leads back (re-ducere) from the natural
  attitude''s positing of transcendent objects to the transcendental subject''s constituting
  activity / noetic-noematic structures. Epoché is the entry gate; the reduction proper
  discloses the correlation between consciousness (noesis) and its object (noema),
  and ultimately the transcendental ego as the source of constitution.

  - Psychological reduction (or eidetic psychological reduction?) In Ideas I, Husserl
  distinguishes "phenomenological-psychological reduction" from "transcendental-phenomenological
  reduction." A phenomenologist could perform epoché and describe experiences as psychological
  facts about a human subject (still in the natural attitude, just reflective), versus
  the transcendental reduction, which treats the subject as the constituting transcendental
  ego, not as a mundane psyche. The danger: Cartesian way ends with a "transcendental
  naivety"? Also the "phenomenological reduction" as "transcendental" eidetic science.


