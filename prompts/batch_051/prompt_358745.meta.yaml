  Core philosophical issue: Is pain intrinsically bad, or is its badness something
  added (an evaluative response)? Pain asymbolia: patients report feeling pain (sensory)
  but not minding it — they may say "it hurts but it doesn''t bother me" and may even
  laugh. This is used to argue that the sensory quality of pain and its unpleasantness/badness
  are dissociable. Some argue this undermines the view that pain is essentially/necessarily
  bad; maybe pain''s badness is a contingent response, or at least not part of the
  sensory core.


  A step-by-step argument the asker half-suspects:

