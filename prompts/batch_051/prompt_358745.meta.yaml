  is present while the unpleasantness/aversiveness is absent.

  (2) If pain were bad in itself — bad in virtue of its intrinsic sensory character
  — then anyone in the relevant sensory state would find it unpleasant.

  (3) Therefore pain is not bad in itself; its badness must come from a further response
  or appraisal (and so is, in principle, optional).


