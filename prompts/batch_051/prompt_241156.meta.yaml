  Potential precise claims of "steelman, don''t strawman":

  1. Epistemic charity: interpret so as to maximize truth or rationality before evaluating
  (Davidson/Quine charity).

  2. Logical norm: attack the strongest version of an argument, not the weakest, because
  you haven''t refuted the position otherwise.

  3. Dialectical strategy: if you attack the strong version, your critique is more
  likely to generalize and persuade.

  4. Moral demand: you owe your interlocutor the most favorable interpretation.

  5. Asymmetric commitment: steelman outgroups but not ingroups (or vice versa).

  6. A claim about psychology: people''s real views are usually more reasonable than
  their surface expression.

  7. A rule against "cherry-picking the worst representatives."


