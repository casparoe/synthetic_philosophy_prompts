  "Kant''s criterion for being the object of a direct duty is rationality/self-consciousness:
  only beings who can give themselves a moral law count as ends in themselves. Animals
  don''t have that, so for Kant they are mere things, means to human ends, and we
  can have no direct duties to them. That part is pretty clear.


