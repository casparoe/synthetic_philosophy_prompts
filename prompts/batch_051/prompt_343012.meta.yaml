  The Hinge of History hypothesis: the claim that we live at an unusually influential
  / pivotal time in history — that the current era (or near future) could be the most
  important century. MacAskill discusses it in "What We Owe the Future." Considerations:


  For:

  - Existential risk: for the first time, humanity has the technological power to
  destroy itself (nuclear weapons, engineered pandemics, misaligned AI), so decisions
  now could determine whether the entire future of humanity exists. This is a "hinge"
  because stakes are unprecedented.

  - Anthropics/observation selection? Actually a common argument against is that from
  a self-sampling standpoint, it would be a coincidence to find ourselves at the hinge;
  but the counterargument is observation selection effects — we should not be surprised
  to find ourselves at a point where population is large and influence is high? Hmm.
  Actually there are arguments both ways.

  - The technological maturity argument: the industrial revolution and subsequent
  exponential growth is a one-time transition; per-century growth rates were near
  zero for millennia and are now high, plausibly a unique spike in history. We''re
  near the inflection point.

  - Space colonization: if we expand beyond Earth, the total future population could
  be astronomically large, and whether we get through the next century safely determines
  all of it.

  - Value lock-in: this century may set norms, institutions, and AI values that persist
  for a very long time, a "lock-in" effect analogous to how agriculture or the invention
  of writing locked in certain paths.

  - The "time of perils" hypothesis (Bostrom): the risk of existential catastrophe
  was/is concentrated in a relatively brief period of technological adolescence.


  Against:

  - The self-sampling / mediocrity objection: if we''re at a random point in human
  history, it''s wildly unlikely that we''d be at the hinge; prior probability that
  any particular century is the hinge is low. But this can be countered by observation
  selection: we couldn''t find ourselves before there were observers sophisticated
  enough to ask, and the number of such observers is now large.

  - Base-rate / unexceptionality: every generation has thought itself special ("somehow
  it''s always now"); historical people also believed their era was pivotal (e.g.,
  millenarian movements). This is the "chronocentrism" objection — analogous to geocentrism;
  we''re biased to see our time as central.

  - The hinge may be in the past or future, not now: the most important moment may
  have been the agricultural revolution, or the invention of writing, or the industrial
  revolution, or may be millions of years in the future. Claiming it''s now is arbitrary.

  - High uncertainty: we have low epistemic confidence about the sign and magnitude
  of current actions on the far future; a "hinge" claim requires second-order predictions
  we can''t make reliably.

  - Moral uncertainty / cluelessness: even if our era is pivotal, we don''t know which
  actions push in the right direction, so the hypothesis doesn''t give usable guidance
  (this is less an objection to the descriptive claim than to its action relevance).

  - Continuity/gradualism: the future may be shaped by a long accumulation of small
  decisions rather than by any brief window; no particular time is a hinge.

  - Maybe the "value lock-in" argument cuts the other way: lock-in might be less likely
  than assumed because values keep drifting; future people will revise.

  - S-risks: if the future is more likely to be bad than good, being a hinge is bad,
  not a reason for optimism — but this isn''t exactly an objection to the hinge claim
  itself.


