  Let me consider Van Fraassen''s Reflection in detail to make sure I represent it
  accurately.


  Reflection principle (Bas van Fraassen, 1984, "Belief and the Will"): For any times
  t1 < t2 and proposition A:

  P_{t1}(A | P_{t2}(A) = r) = r

  (or more generally, your current opinion about A must lie in the range spanned by
  your expectations of future opinions about A.)


  The idea: you should treat your future self as an expert; if you''re sure tomorrow
  you''ll assign 0.8 to rain, then you should assign 0.8 now (conditional on that).
  It''s tied to conditionalization being a martingale: expected future credence equals
  current credence. Reflection is a converse/stronger.


  Counterexamples:

  - The "sleeping pill" from van Fraassen? Actually van Fraassen himself considered
  a case: you''re told you''ll be given a drug that makes you believe a proposition
  with probability 1, no matter its truth. E.g., tomorrow you''ll ingest a pill that
  makes you certain the coin will come up heads? Then your current credence in heads
  conditional on future-you being certain is still 1/2, not 1. So Reflection fails
  when you expect your future credence to be formed by a non-truth-tracking process.


  - Christensen''s "Shoemaker"? Let me recall. David Christensen (1991) "Clever Bookies
  and Coherent Beliefs" gives counterexamples involving drugs. Also there''s the "Irrational
  future selves" / "I predict I will be convinced by a persuasive but misleading speaker."


  - A nice case: you know that in ten minutes you''ll be given a drug that makes you
  believe with certainty that you can fly. Reflection would demand you now be certain
  you can fly conditional on future-certainty, which is absurd.


  So the clash: Reflection is compelling as a principle of self-trust/expert deference:
  if you treat future-you as having all your current evidence plus more, conditionalization
  gives you a martingale: E[future credence] = current credence. Reflection takes
  this further. It coheres with "treat your future self as an expert" and is backed
  by Dutch book arguments (though those are controversial). But firm intuition: if
  you know the future credence will be caused by a known bias (brainwashing, peer
  pressure, fever), you should not defer; indeed you should now set credence in a
  way that "predicts" and discounts the future nonsense.


