  Popper''s 1963 "Conjectures and Refutations" introduced verisimilitude: aim of science
  is truth, but since we can''t have certainty, we want theories with high "truthlikeness"
  (verisimilitude). He proposed comparing theories by their truth content and falsity
  content.


  Definitions: Let A be a theory (set of statements closed under consequence). The
  truth content of A, Ct(A), is the class of true statements that follow from A. The
  falsity content of A, Cf(A), is the class of false statements that follow from A
  (or the set of consequences of A that are false). Popper: A has greater verisimilitude
  than B iff either (i) Ct(A) ⊃ Ct(B) and Cf(A) ⊆ Cf(B), with at least one strict.
  (There are two clauses: truth content greater, falsity content not greater.)


  Miller and Tichý (1974) independently showed: for any two false theories A and B,
  A cannot have more verisimilitude than B in this sense. The result: If A and B are
  false theories, then Ct(A) ⊇ Ct(B) implies Cf(A) ⊇ Cf(B). Hence the two conditions
  cannot be jointly satisfied with strictness in the right directions. Therefore Popper''s
  qualitative definition is vacuous: no false theory is closer to the truth than any
  other false theory.


