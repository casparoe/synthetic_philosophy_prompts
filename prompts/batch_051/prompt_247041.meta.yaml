  Exam question (written by me as instructor): "Popper proposed that we can compare
  false theories by their ''verisimilitude'' or closeness to the truth. Explain his
  qualitative definition in terms of truth content and falsity content, and critically
  assess the objection due to Miller and Tichý. Does the failure of Popper''s definition
  show that the very idea of one theory being closer to the truth than another is
  incoherent? Why or why not?"


  Student answer: correct parts:

  - Popper''s motivation: science aims at truth, but theories are often false; we
  need a notion of being closer to truth.

  - Defines truth content (true consequences) and falsity content (false consequences).

  - States comparative definition: A has more verisimilitude than B if A''s truth
  content includes B''s and A''s falsity content is included in B''s, with at least
  one strict.

  - States Miller/Tichý result: on this definition, no false theory has more verisimilitude
  than another false theory; so the definition is vacuous for false theories.

  - Concludes that verisimilitude is a useful regulative idea even if Popper''s formalization
  failed.


