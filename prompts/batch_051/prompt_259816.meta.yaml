  new editor wants to run a front-page editorial called "We are not doomed yet." It
  says, more or less flat out, that if our year group and the town get our act together,
  we can still save the high street, the river, and maybe even the climate. She admits
  she can''t satisfy the clause, because a sceptic could always demand more proof
  than we have. Her arguent is that some things have to be said before the evidence
  is in, because saying them is part of making them true: if we print "we''re doomed"
  we help doom ourselves, and if we print "we can do this" we make it a bit more likely.
  She says hope isn''t the kind of thing the clause was ever meant to police, and
  an editorial is more like a promise or a decision than a claim about how things
  stand.


