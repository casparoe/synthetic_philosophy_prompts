  I help run the student newspaper at a sixth-form college. Our paper''s constitution
  has a clause, written ages ago (I think after someone got sued, or nearly), that
  says:


  "No article may state as fact anything for which the author does not have sufficient
  evidence; evidence is sufficient only if it would convince a reasonable person who
  did not already share the author''s beliefs."


  We''ve always taken this to be about not printing rumours and gossip. But now our
  new editor wants to run a front-page editorial, picked for the end of term, with
  the headline ''We are not doomed yet.'' The piece says, pretty much as fact, that
  if our year group and the town actually get organised, we can still save the high
  street, the local river, and maybe even the climate. She admits she can''t meet
  the clause, because a reasonable sceptic could demand more proof than any of us
  can give. Her argument is that some claims have to be made before the evidence is
  in, because saying them is part of making them true; if we print ''we''re doomed''
  we help doom ourselves, and if we print ''we can do it'' we make it a bit more likely.
  She says treating hope like a factual claim in a news item is a category mistake,
  and the founders would never have wanted the clause to strangle an editorial that
  is really a decision to try.


  So my questions are: does the clause apply to her editorial? Would it help to say
  the piece is an opinion or a commitment rather than a statement of fact, or is that
  just dodging? What would a strict version of the clause (never publish any claim
  that lacks evidence good enough for an impartial sceptic) commit the paper to about
  belief and hope? Is there a coherent reading of the clause that allows her editorial
  without letting back in the gossip and fake news the clause was meant to stop? And
  if the clause really would ban her piece, what does that tell us about the view
  of belief the clause presupposes, and should we change the clause or kill the editorial?


