  I help run the student paper at a sixth-form college. Our constitution has a clause
  from way back (I think after a libel scare) that says:


  "No article may state as fact anything for which the author does not have sufficient
  evidence. Evidence is sufficient only if it would convince a reasonable person who
  did not already share the author''s view."


