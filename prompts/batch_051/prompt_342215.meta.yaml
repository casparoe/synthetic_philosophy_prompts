  pleasure is good. But the absence of pain is good (even if no one exists to enjoy
  it), whereas the absence of pleasure is not bad (if no one exists to be deprived
  of it). So coming into existence: possible pain counts against, possible pleasure
  does not count in favor (or counts less). Therefore non-existence is preferable/less
  bad, or at least asymmetry. People find this controversial.


