  ---


  I am a retired physicist who has only recently begun to work through the philosophical
  literature on free will, and I keep noticing that quantum indeterminism is treated
  as though it automatically counted in favor of freedom. I would like you to construct
  a thought experiment to order, one that separates two ingredients that often get
  run together.


  Build me a scenario in which event-causal libertarianism and agent-causal libertarianism
  give opposite verdicts about the same action. By event-causal libertarianism I mean
  the view that an undetermined choice can be free, and the agent can be morally responsible
  for it, when the choice is caused by the agent''s prior reasons, values, and character,
  provided those antecedents leave open more than one possible action. By agent-causal
  libertarianism I mean the view that freedom requires the agent, as a continuing
  substance and not merely a chain of psychological events, to cause the choice; an
  undetermined event in the agent''s own mental machinery is not sufficient and may
