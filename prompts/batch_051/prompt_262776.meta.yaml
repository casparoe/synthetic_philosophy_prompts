  the work. Then identify the single feature of the case that is carrying the disagreement,
  and say what would happen if that feature were removed—for instance, if the indeterminism
  occurred earlier, during the formation of the agent''s reasons, so that the final
  choice followed deterministically from those reasons. Finally, state the strongest
