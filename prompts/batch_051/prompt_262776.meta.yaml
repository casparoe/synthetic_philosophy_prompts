  ---


  I recently retired from a physics career and have turned to the free-will literature,
  where I keep encountering an assumption that quantum indeterminism, by itself, bears
  directly on moral responsibility. I would like a thought experiment built to my
  specifications, rather than an exposition of the field.


  Please construct a single, ordinary-life scenario in which the following two positions
  come apart:


  (1) Event-causal libertarianism: an undetermined choice can be free, and the agent
  responsible for it, when it is caused by the agent''s prior reasons, values, and
  character, provided those antecedents leave open more than one possible action.

  (2) Agent-causal libertarianism: an undetermined choice is free only if the agent,
  as a continuing substance or "agent-cause," causes the choice; an undetermined event
  in the agent''s psychological machinery is not enough and may actually remove responsibility.


  Specifications. The scenario should be realistic (a workplace or a family setting,
  not a laboratory or a thought-experiment staple such as a neurosurgical device).
  It must involve a genuinely undetermined event within the agent''s own nervous system
  that breaks a tie after deliberation has narrowed the options to two, both of which
  are genuinely supported by the agent''s settled character; the agent must not be
  able to foresee or direct which way the tie is broken; and the episode must be experienced
  as an ordinary act of choosing, not as a twitch or seizure. Keep the scenario to
  one paragraph.


  Then do the demonstration. State the choice, the two candidate actions, the exact
  point at which the process becomes undetermined, and why the agent''s antecedent
  psychology underdetermines the outcome. Explain why the event-causal libertarian
  should judge the agent morally responsible for the resulting action, and why the
  agent-causal libertarian should not—making explicit in each case which ingredient
