  ---

  Two people I know recently argued about price gouging, and I still cannot tell who
  had the better of it. The case was a man who, two days before a hurricane was forecast
  to make landfall, bought the last few portable generators at a hardware store and
  resold them from his truck for roughly four times what he paid. One of them, Maya,
  said this was plainly wrong. The other, Ben, said it was not only permissible but
  close to the best thing the man could have done under the circumstances. The argument
  moved through four distinct claims.


  1. Maya began with consent: a buyer who is choosing between an overpriced generator
  and a flooded house is not meaningfully choosing at all, so the exchange is more
  like coercion than trade, and the seller is exploiting the emergency. Ben answered
  that the exchange is still consensual in the only sense that matters: the buyer
  would not pay unless he expected to be better off than without the generator, and
  the alternative is that the generator sits unused or goes to someone with a weaker
  need. The high price, he said, is a signal that moves scarce goods toward high-value
  uses and draws new supply.


  2. Maya replied that this treats the objection as if it were only about welfare
  and consent, when part of the wrong is expressive: an emergency is the one time
  a community is supposed to default to mutual aid, and price gouging converts it
  into just another occasion for profitable exchange, and thereby changes what the
  transaction is. Ben said "what the transaction is" and "mutual aid" were doing all
  the work. If both parties prefer the exchange to their next-best available option,
  then outside repugnance is an aesthetic reaction dressed up as moral criticism.


  3. Maya answered that repugnance should not be dismissed that quickly. In cases
  like vote-selling or the sale of live organs, revulsion is widely taken to track
  a real wrong, and Ben needs a principle for when moral disgust is informative and
  when it is mere bias. Ben replied that moral disgust has a known track record of
  ratifying whatever the local status quo is, and that it was used against plenty
  of arrangements we now consider benign; as evidence it is weak, so Maya or anyone
  else who wants to condemn a voluntary trade needs a harm.


  4. Maya said the harm is in the norm she was pointing at: permitted and normal price
  gouging teaches people to see disasters as profit opportunities, and that expectation
  gradually replaces the mutual-aid norms that actually make communities function
  in emergencies. That, she said, is a real social consequence, not a mere feeling.
  Ben replied that she had moved from a moral argument to an empirical prediction,
  and that the empirical predictions on the other side are better established: anti-gouging
  rules produce shortages, queues, hoarding, and black markets, with the same goods
  going to the same desperate people but less transparently.


