  Potential argument:


  (1) The introduction of nuclear weapons did not permanently end major-power war,
  but it did change the way great powers compete, shifting conflict to proxy wars
  and deterrence.

  (2) The printing press did not just increase the volume of books; it changed the
  structure of authority by making texts reproducible and interpretable outside priestly
  control, eventually contributing to the Reformation.

  (3) The Industrial Revolution did not just increase production; it transformed labor,
  urbanization, and political economy, creating new classes and new ideologies.

  (4) From these cases, we can extract a general pattern: when a technology is general-purpose
  and reduces a key cost, its most consequential effects are not those immediately
  expected but the restructuring of institutions and power.

  (5) AI is a general-purpose technology that reduces the cost of cognition and prediction.

  (6) Therefore, the most consequential effects of AI will be institutional and political
  restructuring, not the immediate applications or accidents people first warn about.

  (7) Therefore, attempts to forecast AI''s specific harms from current use cases
  are systematically unreliable, but we can still know the kind of transformation
  to expect: a shift in authority and economic organization comparable to the printing
  press and Industrial Revolution.


