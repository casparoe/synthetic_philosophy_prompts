  Let''s draft:


  Act as a philosopher of technology with a background in the history of industrialization
  and modern AI risk. Last night I got into a long argument with a friend about whether
  historical analogies can tell us anything about transformative AI. He defended a
  skeptical view: analogies are just stories we project onto the future. I ended up
  defending the following argument, and now I''m not sure whether it''s actually any
  good.


  (1) The printing press did not merely speed up copying; by making texts widely reproducible,
  it undermined centralized interpretation and eventually restructured religious and
  political authority.

  (2) The Industrial Revolution did not merely raise output; by changing the returns
  to capital and labor, it transformed the class structure, urbanization, and what
  states had to be able to do.

  (3) Nuclear weapons did not merely make one kind of bomb bigger; by making major-power
  total war seem unwinnable, they shifted great-power conflict into deterrence, proxies,
  and technological competition.

  (4) These cases share a pattern: a technology that sharply lowers a deeply embedded
  cost tends to change institutions and distributions of power more than it changes
  the specific task it was first applied to.

  (5) AI sharply lowers the cost of performing a range of cognitive and predictive
  tasks.

  (6) Therefore, AI''s most consequential effects will likely be institutional and
  political restructuring, not the particular applications or accident scenarios that
  currently dominate debate.

  (7) Therefore, forecasting AI''s specific harms from present use cases is unreliable
  in principle, while historical analogies still let us know the general shape of
  what is coming.


