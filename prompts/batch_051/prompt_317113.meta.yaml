  Let''s write prompt:


  "I''ve been rereading William James''s The Will to Believe, and there''s a bit where
  he distinguishes two commands for inquirers: know the truth, and avoid error. He
  says they aren''t two ways of saying the same thing, they''re two separable laws.
  That got me thinking about an asymmetry in ordinary intellectual life. If I tell
  you I have no idea who won the 1958 World Cup final, nobody blames me for not knowing.
  But if I tell you confidently it was Wales 2-1 Sweden, I''m a fool. Both are failures
  of inquiry, but one is a failure to get truth, the other a failure to avoid falsehood.
  More than that: if I refuse to look up the score because I don''t want to clutter
  my head, people think that''s fine; if I read a dodgy source and then assert a false
  score, people think that''s bad. So we seem to treat error-avoidance as a much heavier
  obligation than truth-getting."


  Then "Does anything in accuracy-first epistemology justify that weighting? I mean
  the epistemic utility theory stuff where credences are scored for accuracy and inaccuracy,
  like Brier scores. Could you either justify treating avoid-error and seek-truth
  as two separate desiderata with different weights, or show that ordinary practice
  is tracking something else—like social risk, or whether you ought to have known?
