  A compelling argument for it: Reflection follows if you regard your future self
  as an expert (expected to have strictly more information — conditionalization on
  a partition), via the principle that you should defer to your future self. Under
  Bayesian conditionalization, the future credence is your current credence conditional
  on some evidence E, and by law of total probability your current credence equals
  expectation over possible evidence. So Reflection holds for future selves that update
  by conditionalization on evidence you''ll receive.


