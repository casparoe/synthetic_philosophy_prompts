  The prompt:


  "I''ve taught philosophy of biology long enough to watch the adaptationism debate
  go through several cycles, and I''m struck by how static it has become. On one side,
  you have people working in the adaptationist programme: they treat natural selection
  as the main or default explanation for most traits, they model organisms as if traits
  are solutions to selective problems, and when asked about a puzzling trait they
  start by asking what it''s for. On the other side, since Gould and Lewontin''s spandrels
  paper, the critics say this systematically neglects developmental constraints, allometry,
  pleiotropy, drift, and the fact that many features are by-products or exaptations
  rather than direct adaptations. Everyone now agrees that natural selection is real,
  that constraints exist, that not every trait is an adaptation. And yet the same
  arguments get recycled and neither side moves. My working hypothesis is that the
  real disagreement isn''t empirical at all: it''s about what you''re allowed to treat
  as the null hypothesis when you see a trait. Adaptationists think the null is ''no
  adaptive story yet found''; pluralists think the null is ''no demonstration that
  selection produced this trait.'' But maybe I''m wrong and there''s a hidden factual
  or formal question lurking underneath. Diagnose what kind of disagreement this actually
  is—verbal, methodological, about standards of evidence, about which cases count
  as data, or about starting intuitions that can''t be argued for—and tell me what,
  if anything, would count as progress. I''m not asking for a bibliography, just a
  diagnosis."


