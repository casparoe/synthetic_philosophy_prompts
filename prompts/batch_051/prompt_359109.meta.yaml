  Notes title: "The EpiPen Problem: masks, finks, and where the bearer stops."


  1. Standard set-up. A mask is something that stops a disposition from manifesting
  while the disposition stays in place: a fragile glass wrapped in foam is still fragile
  even though it wouldn''t break if dropped in its packaging. A fink is something
  that removes the disposition when the stimulus condition arrives: a sorcerer makes
