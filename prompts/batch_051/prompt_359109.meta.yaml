  for an allergic disposition, or is an epinephrine-mediated counter-regulation part
  of the system? If my daughter''s body can''t produce the needed counter-response
  and we supply it externally, the disposition to anaphylaxis is masked only relative
  to a boundary that puts the pen outside her system. A diabetic on insulin: at some
  point do we say the person-with-insulin just has different pancreatic dispositions,
  rather than the same disposition masked?


