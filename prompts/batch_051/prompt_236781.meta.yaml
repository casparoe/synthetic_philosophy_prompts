  ---


  I lead a five-person policy team at a large platform that hosts user-generated content,
  and I want to replace the way we resolve our hardest moderation cases with a reusable
  procedure built on reflective equilibrium. Once a month we get 90 minutes to clear
  a backlog of edge cases under three rules: a ban on graphic violence, a ban on coordinated
  harassment, and a ban on harmful health misinformation. Each rule has an open-textured
  exception or threshold — documentary or public-interest value, publicly available
  information, an identifiable false or misleading claim — and in practice we decide
  by a mixture of precedent, intuition, and anticipated press reaction. I have watched
  our group reach opposite conclusions on near-identical facts in different meetings.
  I sign the decisions as policy lead, legal reviews them for risk after the fact,
  and a VP who only sees a one-page summary can block a rule change; none of those
  people is in the room during the working meeting.


  My working understanding of reflective equilibrium, roughly in Rawls''s sense, is
  this: specific judgments about cases and general principles are both fallible; where
  they conflict, you revise whichever is less credible in light of the rest; you iterate
  until the set is coherent; and in wide reflective equilibrium you also bring in
  background beliefs about how the platform actually works, what harms are likely,
  and what the platform is for. The result is always provisional and revisable.


  What I need from you is the operating version my team can run. Give me a decision
  procedure — a checklist or flowchart in words — with the following:


  - The inputs the meeting needs in advance, who prepares them, and how a case gets
  into the backlog at all.

  - The sequence of questions to ask in order, with the decision points explicit:
  when the procedure loops back, when it revises the rule, when it revises or discounts
  the case judgment, and when it stops and escalates on the ground that the remaining
  step is a normative choice rather than an application.

  - An anti-rationalization step: how to tell a principled exception from a post hoc
  patch, and where the anchors outside the two moving parts come from so the procedure
  cannot just reproduce whatever we already wanted to do.

  - What counts as a sufficient answer to each question, given that no one in the
  room has formal philosophy training and we cannot extend the meeting.

  - The points where judgment cannot be eliminated, and which named role should make
  it: the policy lead, the legal reviewer, the VP, or the full committee.


  The deliverable should be usable by a new team member reading only the page you
  write.


  Then apply the procedure to these three cases from our backlog. Be explicit about
  each turn of the loop rather than jumping to a verdict. At least one application
  should produce an answer my team will not like; identify it and say why the procedure
  commits us to it even though our current method would not have.


  1. A user posts unedited footage of a violent police encounter in which a person
  is seriously injured, with no commentary beyond a timestamp and location. Our graphic-violence
  rule has an exception for documentary or public-interest value. Half the team reads
  the exception as covering exactly this; the other half says the exception cannot
  mean any real violence with news value, because then the rule is empty.


