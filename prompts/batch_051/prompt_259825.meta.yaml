  Draft:


  "I have no background in philosophy, so I''ll just describe the situation and my
  judgments as plainly as I can.


  My spouse and I are nonbelievers, and her parents are devout. We have two children,
  eight and six. We''re raising the children without religion, but we want them to
  be close to their grandparents and cousins, who practice. Over the years I''ve noticed
  my reactions fall into a pattern, and I''d like to know whether there is one principle
  behind them — or whether I''m just applying two principles (roughly: don''t lie,
  and preserve the children''s place in the family) and missing where they conflict.


  Here are my verdicts on concrete cases.


  1. When my mother-in-law asks me directly whether I believe in God, I say no, plainly.
  I think hedging (''we''re spiritual in our own way'') would be wrong. Fine as is.


  2. I''ve told my eight-year-old that if a relative asks whether she believes in
  God, she should answer truthfully. When her grandmother asked, she said, ''I don''t
  know yet.'' I thought that was fine, maybe good.


  3. At a holiday dinner, my eight-year-old announced to the whole table, ''Mommy
  and Daddy say God isn''t real.'' I thought that was not fine, and afterward I told
  her: it wasn''t wrong because it was false, but because it was said to score a point
  at someone else''s table. Answering a direct question truthfully is one thing; volunteering
  it like that is another.


  4. My father-in-law asked me to say grace before a meal. I declined and asked him
  to do it. I think that was right: saying the words myself would have been speaking
  as if I believed them.


  5. At a family funeral, though, I joined the responsive prayers and said the creed
  with everyone else. I feel fine about that, even though I don''t believe the words.
  Sitting silent would have turned my unbelief into a statement in a moment that was
  about someone''s death, not about me.


  6. My children are invited to attend services with their grandparents when they
  stay over, and I let them go. I also sent them to vacation Bible school with their
  cousins. I''m fine with this — they experience it as family and music and ritual,
  and when they come home with questions, we answer them honestly.


  7. My daughter told her grandmother, ''I pray every night,'' to make her happy.
  She doesn''t pray. I thought that was not fine, and I told her afterward that she
  doesn''t need to perform belief to be loved, and that I didn''t want her to learn
  that her place with her grandmother depends on saying the right lines.


  8. A devout teenage niece asked my eight-year-old, one-on-one, whether she wanted
  to ''ask Jesus into her heart.'' I thought that was not fine, in the same way I''d
  object if an adult asked my child a pressing question about sex or money. I don''t
  think relatives should put an eight-year-old in a position to make a life-changing
  declaration, whether about faith or anything else.


  Then there''s the case I go back and forth on: my in-laws currently believe, or
  strongly assume, that we are raising the children in the faith. We''ve never corrected
  them, because it hasn''t come up as a direct question. The children are still young
  enough that this false belief hasn''t forced a practical collision, but it will
  eventually (e.g., when a grandparent expects them to be confirmed or to make a statement
  of belief). Is leaving that assumption in place a lie? Should I correct it now,
  or wait until it collides with a concrete request?


  What I''d like from you: (a) a precise statement of the principle (or the two principles,
