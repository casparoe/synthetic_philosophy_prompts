  Draft:


  "I''m teaching a short unit on the distinction between knowing how and knowing that,
  and I keep coming back to The Karate Kid — nobody seems to have written the obvious
  thing about it. The famous training sequence is the interesting part: Mr. Miyagi
  has Daniel sand the deck, wax cars, and paint a fence, deliberately without explaining
  how any of it connects to karate, and Daniel eventually blows up because he has
  been given no propositional account of what he is practicing. Then it turns out
  the motions were the components of blocking techniques all along, and Daniel can
  execute them without having represented them as such. The film appears to be doing
  real work for the anti-intellectualist side of the debate: Daniel''s know-how does
  not only temporally precede his knowing-that, it is what makes the later knowing-that
  possible. The movie even hints that an explanation given earlier would have spoiled
  the training.


  But that appearance may rest on a slide from a weak pedagogical claim to a strong
  conceptual one. The weak claim is just that some skills are best acquired by practicing
  the movements before or without instruction in their rationale. The strong claim
  is that there is a distinctive kind of knowledge — knowing how — that is not reducible
  to or dependent on knowing that, and that Daniel''s performance-after-practice has
