  Prompt draft:


  "I have been teaching a short unit on the knowing-how/knowing-that distinction,
  and I keep coming back to The Karate Kid (the 1984 film), of all things. The central
  training sequence — where Mr. Miyagi has Daniel sand the floor, wax the cars, and
  paint the fence, and Daniel eventually blows up because nobody has told him why
  he is doing chores — looks like a deliberate dramatization of the claim that know-how
  need not pass through propositional knowledge: Daniel acquires the motor patterns
  before he can state what they are for, and when the payoff comes, the movements
  turn out to constitute blocking techniques. The film even seems to suggest that
  explanation would have interfered with acquisition, since Daniel resents the practice
  until he is shown the point.


  But I worry the film is trading on a weaker and stronger claim. The weak claim is
  merely pedagogical: for some skills, you learn the movements first and the articulable
  rationale later, or never. The strong claim is conceptual: there is a kind of knowledge
  — knowing how — that is not reducible to or dependent on knowing that, and a person
  with the movement skill plus no propositional account genuinely knows something
  that the movement-skill-plus-explanation person and the explanation-only person
  lack in different ways. I''d like someone to read the film as a contribution to
  this debate. Where does it take a stand and where does it cheat? Is Daniel''s skill
  a genuine case of Ryle-style intelligent practice, or does the film conflate motor
  conditioned reflex with knowing how? And does the film''s framing — that Daniel
  is entitled to an explanation and Miyagi was wrong to withhold it temporarily —
  end up undermining the anti-intellectualist reading more than the film notices?
  I suspect the film may be smarter than it looks, but I can''t tell whether it favors
  one side of the debate or just flatters both."


