  Wording:


  "Right, here''s one that''s been bugging me since I used the Ellsberg urn in a lecture
  last term, and I''d like you to work through it properly rather than rehearse the
  textbook version. Take the standard two-urn setup: Urn A with exactly 50 red and
  50 black balls, Urn B with an unknown proportion. But now alter Urn B as follows.
  Its composition is fixed by a fair coin toss: if the coin comes up heads, B contains
  60 red and 40 black; if tails, 40 red and 60 black; and you never get to see the
  toss. Urn A remains exactly 50/50. The payoffs are the usual ones -- £100 if you
  draw the colour you bet on, nothing otherwise. Now in the classic case, a person
  prefers a bet on red drawn from A to a bet on red drawn from B, and also prefers
  black-from-A to black-from-B; that combination is meant to show she cannot be a
  subjective expected utility maximiser, since no single probability assignment to
  B can make both preferences come out. But in the fair-coin version, an SEU maximiser
  who reduces compound lotteries will assign red-from-B probability one half, exactly
  as for A, and hence should be indifferent between every matched single-colour bet.
  So my question is: in this altered case, does the Ellsberg paradox still provide
  any argument against SEU, or has it shrunk to a quirk about compound risk? If someone
  still strictly prefers the known urn for both colours, what principle is she now
  violating, and is the failure the same sort of irrationality as in the original?
  Then push it one step further: replace the fair coin with a coin of completely unknown
  bias (still one toss, still 60/40 versus 40/60 depending on the side). At what point,
  as we move from a known fair coin to an unknown bias, does the original paradox
  re-emerge, and what does that tell us about how much second-order ''knownness''
  is needed for ambiguity aversion to be distinct from a dislike of risk?"


