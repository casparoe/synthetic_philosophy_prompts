  would distinguish:


  Possible readings of "all is one":

  1. Trivial/platitude: everything is connected or interdependent (holism). Not a
  monism about what exists; doesn''t imply only one thing.

  2. Numerical monism / existence monism: exactly one thing exists (Parmenides? maybe
  the One, or maybe priority monism variant). Radical.

  3. Priority monism: exactly one fundamental thing exists (the whole/cosmos), but
  many things exist derivatively. Schaffer. More defensible.

  4. Substance monism: there is exactly one substance, but it has many modes/attributes
  (Spinoza). Everything else is a mode of the one substance, not independent.

  5. Kind monism / property monism: there is one kind of stuff (e.g., physicalism?)
  — "all is one kind of thing." Not usually what the slogan means, but a possible
  reading.

  6. Compositional/identity reading: the many things are identical to the one (blobject?)
  or parts are not real.

  7. Cosmological reading: the universe is one unified object (one entangled system);
  perhaps each apparent object is just an arbitrary partition.


  Which readings support dismissing tables/chairs as fundamental? Priority monism:
  tables and chairs exist but are not fundamental; only the cosmos is fundamental.
  Existence monism outright denies tables/chairs exist (or are appearances). Substance
  monism: tables/chairs are modes of the one substance, so not independent substances.
  The slogan "all is one" flattens those.


  Which reading(s) would support the argument "only the whole cosmos is real because
