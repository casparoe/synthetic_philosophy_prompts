  Classic paradox of deontology: If it''s wrong to kill one person, then surely it''s
  even worse if more people are killed. So if you can prevent five killings by killing
  one, you should — but deontology says you may not. Why does the "wrongness" of killing
  not aggregate in the way consequences do? The "paradox": deontological constraints
  seem to be based on strong reasons against violating rights, yet they prohibit minimizing
  violations of those very rights.


  A good argument to construct:


  (1) If there is a deontological constraint against killing innocent people, it exists
  because there is a strong reason against each instance of killing an innocent person.

  (2) Reasons aggregate minimally: if several tokens of a type of act can each be
  prevented, and preventing them does not violate any stronger reason, then one ought
  to prevent the greater number.

  (3) In the case where a runaway trolley is heading toward five people, a bystander
  can prevent five killings only by killing an innocent bystander (e.g., pushing a
  large person in front).

  (4) By (1) and (2), the reasons against the five killings outweigh/reasons against
  the one killing — so killing the one seems required.

  (5) But the deontologist says killing the one is forbidden.

  (6) So deontology imposes a constraint that is insensitive to the number of the
  very same wrongs; that seems irrational, like a rule "Never break a promise" that
  forbids breaking one promise even to prevent five promise-breakings.

  (7) Therefore there is no stable medium: either deontology collapses into consequentialism,
  or it must accept catastrophic non-consequentialist conclusions.


