  \ of deontology can't be dissolved the way most deontologists now try to dissolve\
  \ it. The setup: a constraint says don't kill one person even to stop five other\
  \ killings, but the reason the constraint matters is that killings are bad, so the\
  \ view seems to forbid the very act that would minimize the thing it calls bad.\
  \ I argue the standard repairs — going agent-relative, denying that the relevant\
  \ badness aggregates, saying the constraint protects a status rather than a value\
  \ to be promoted — all make the same quiet retreat: they stop being about what the\
  \ act does to the victim and become about the agent's relation to her own act. And\
  \ once you make that move you've surrendered the thing deontologists actually wanted,\
  \ namely that the act is wrong full stop in virtue of what it does to the person.\
  \ So I defend the unpopular line that the tension between the constraint and the\
  \ underlying value is real, and the honest deontologist lives inside it instead\
  \ of pretending to dissolve it.\n\nThe audience is a mixed normative ethics workshop:\
  \ about half are consequentialists who will treat 'so your view prefers outcomes\
  \ with more killings' as decisive, there are two Kantian constructivists who will\
  \ say I'm turning the categorical imperative into a value to be promoted and misreading\
  \ Kant, and one Scanlonian who will claim the paradox dissapears once wrongness\
  \ is about justifiability to others rather than producing outcomes. Give me the\
  \ objections in the order I'll actually get them, phrased the way these people would\
  \ put them, with how much damage each can do, a two-minute reply for each, what\
  \ I should concede and what I should hold, where each reply is softest, and the\
