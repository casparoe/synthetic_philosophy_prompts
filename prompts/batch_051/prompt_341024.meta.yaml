  × 100, where outcome is 1 or 0 and p is stated probability. So the best score for
  a truthful report is the actual probability. This incentivizes honesty (proper scoring
  rule), though the layperson prompt can describe it simply as "you gain points for
  being right and lose points in proportion to how wrong you were; the math is set
  up so it never pays to exaggerate your confidence."


  3. The crucial manipulation: tips arrive from named "sources." Some rounds have
  sources that are independent (e.g., an eyewitness, a separate document, a measurement).
  Other rounds have sources that secretly share a common origin (e.g., three tips
  all trace back to the same rumor posted online; two documents are photocopies of
  the same original; two witnesses actually overheard each other in the hallway).
  Participants see only the tips, not the connections — until a reveal phase.


  4. Mid-game, after teams have posted prices, the facilitator opens an envelope (or
  reveals on a slide) the "dependency map" for that round: which tips came from the
  same underlying source. Teams then revise their probability and see whether their
  earlier probability over- or under-shot.


  5. Payoff: to give stakes, teams that reported probabilities well (close to the
  true posterior given full dependency knowledge) keep chips; maybe a small prize.
  The key moment: participants discover that when they treat each tip as a fresh,
  independent confirmation, the second and third tips move them too far; when they
  know tips share a source, the extra tips should move them barely at all.


