  - The reveal shows the presumption is a policy, not a fact; it fails when a hidden
  common cause/copy exists.

  - The formal anchor (facilitator supplies): if you know only each report''s individual
  reliability and nothing about how reports are related, the least-committal joint
  model is the product — independence. So the presumption has a principled grounding,
  but the game shows the world isn''t bound by your ignorance.


