  - Teams may overcorrect after the first reveal, treating all future tips as suspicious
  and never moving from 50/50. Handle by pointing out that complete skepticism is
  also a model — it presumes maximal dependence, which is as unsupported as presuming
  independence; the right response is to track the cost of both errors.

  - Participants may fixate on trying to "detect" hidden dependencies from the tips''
