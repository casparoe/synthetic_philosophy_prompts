  Beliefs:

  1. Deployment norm: high-stakes AI systems should not be used unless their outputs
  can be understood by the humans responsible for them, not just validated statistically.

  2. Anti-post-hoc: an explanation someone writes after the fact is legibility only
  if it tracks the actual process that produced the output; otherwise it''s just PR.

  3. CoT: making models produce chain-of-thought reasoning is the single best realistic
  route to legibility; requiring it for consequential tasks is more protective than
  people give it credit for.

  4. Anti-RLHF-on-reasoning: training models to produce reasoning that human evaluators
  rate as good is likely to give us smooth-sounding rationalizations, not faithful
  accounts of why the model did what it did.

  5. Mechanistic gold standard: full legibility means identifying the real internal
  computations, e.g., circuits/features; behavioral proxies are useful only insofar
  as they correlate with those mechanisms.

  6. Tradeoff: I''d accept a modest drop in accuracy for a big gain in legibility,
  even in the clinic or the courtroom.

  7. Modularity optimism: I''m optimistic that we can train models so their internal
  computation is itself legible—say, by encouraging modular circuits or monosemantic
  features—without imposing an unacceptable capability ceiling.


