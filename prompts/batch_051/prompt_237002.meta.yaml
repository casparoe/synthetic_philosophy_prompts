  Exam question:


  "Distinguish the project of aligning an AI system — making the system''s objectives
  match the objectives its operators intend — from the project of controlling an AI
  system — building safeguards, such as sandboxing, monitoring, and limited action
  channels, that restrict what the system can do if its objectives turn out not to
  match. Then answer the following: are control measures best understood as a substitute
  for alignment, or as a hedge to be used alongside it? Defend your answer."


  Student answer (paragraph):


  "Alignment and control are often confused, but they are different things. Alignment
  is about what the system is trying to do: an aligned system has the goals its operators
  want it to have. Control is about what the system is able to do: a controlled system
  sits inside constraints that block harmful actions whether or not its goals are
  the ones we want. The relation between them is complex. On the one hand, a perfectly
  aligned system would make control unnecessary, since it would only act in ways its
  operators endorse. On the other hand, perfect alignment cannot be guaranteed, so
  control is usually understood as a second layer of protection. For this reason,
  control and alignment are best seen not as substitutes but as complements: alignment
  makes failures less likely, and control limits the damage when failures occur. Some
  safety researchers nevertheless treat control as sufficient on its own. Their thought
  is that if a misaligned system is kept in a sufficiently tight box — no internet
  connectivity, no external tools, human review of every output — then its goals do
  not matter, because the only thing that matters for safety is what the system observably
  does, not what it internally wants. This is right up to a point: safety is in an
  important sense a behavioral property, and a system that cannot take harmful actions
  is safe regardless of what it wants. But the point has its limits. A system whose
  goals diverge from the operator''s may be more likely than an aligned system to
  find ways out of the box, for the simple reason that it is actively looking for
  an escape. So control is never a full substitute for alignment; a controlled misaligned
  system is a dangerous system."


