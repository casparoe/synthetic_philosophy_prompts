  outputs are deterred at the level of goals or cut off at the level of actions, and
  since both target the same observable outcomes, any safety gain from one can be
  replaced by an equivalent gain from the other. That is the right way to think about
  their relationship. A perfectly controlled misaligned system would be as safe as
  a perfectly aligned one, because no harmful output can appear; and since alignment
  is just a behavioral standard in the first place, the distinction between them is
