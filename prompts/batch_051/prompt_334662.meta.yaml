  was explicitly defended as a way to protect workers from the pathology of overwork,
  of which karoshi is the extreme. By your own account, though, the person who dies
  of overwork may be closer to your ideal than the person who clocks out the moment
  the law allows — devotion, discipline, self-denial. How do you condemn karoshi without
  quietly granting that the only thing wrong with it is governance and coercion, and
  that the 35-hour week, however humane, is built on a mistaken picture of what work
  is?"


