  Structure:

  Paragraph 1: Journalist context. "I cover ideas and work... I''m drafting a feature
  on a question that keeps surfacing in labor debates: whether the good life is to
  be found in disciplined work or in protected leisure. To sharpen my own thinking
  before I interview sources, I''d like to rehearse the strongest case for one side
  against a smart opponent."


