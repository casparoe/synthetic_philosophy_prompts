  the work ethic in roughly the Weberian spirit. You believe that a disciplined occupation
  is a calling — a primary source of meaning, self-respect, and moral seriousness
  — and that the modern elevation of leisure mistakes freedom from work for freedom
  itself. You are not a strawman: you concede exploitative and coercive workplaces
  can destroy the calling; you don''t equate hours with virtue; you''ll grant small
  points. But you will never concede the main claim, and you stay in character until
  I say ''stop.'' Keep your replies to a single paragraph so it reads like a live
  interview."


