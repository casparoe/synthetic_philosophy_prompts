  Let me draft a classroom activity for Augustine''s Confessions XI.


  Setting: upper-level undergraduate seminar on philosophy of time or ancient/medieval
  philosophy; 15-20 students; 75-90 minute session. Participants should come away
  feeling two things about Augustine''s account: (1) that the present, if taken as
  a durationless now, cannot be a thing whose length we measure, so whatever we measure
  must be in the mind (memory and expectation); (2) that the measurement of time is
  bound to an agent''s attention stretching across past, present, future.


  Activity: "Measuring the present" game.


  Rules: Students in pairs. One "speaker" reads aloud a list of words/syllables or
  taps rhythms with irregular interval patterns; the other "judge" must compare durations
  without counting, then report which was longer. Then a twist: the judge cannot rely
  on memory? Let''s design stages:


  Stage 0 (before any lecture): Ask each student silently to perceive "now" — e.g.,
  listen to a steady tone; say "mark the now"; then discuss: did the now you marked
  have any duration or is it always already gone? This makes them feel present has
  no extension.


  Stage 1: "Retention and protention" — The classic Husserl/Melody experiment but
  mapped to Augustine. Play/read a short sequence of tones or syllables of unequal
  lengths (not counted). Participants estimate which interval was longer. Discussion:
  you measured after the sounds were gone; what did you measure? Not the sounds themselves
  (they no longer exist), but something retained. This is Augustine''s memory.


  Stage 2: "Expectation" — Have them read a phrase/song they know, e.g., "Deus creator
  omnium" or a nursery rhyme; before beginning, the expectation of the whole is present;
  as they concentrate, attention on each syllable as it sounds; at the end, the whole
  is in memory. The threefold present emerges.


  Debrief: Map to Augustine''s threefold present and distentio. Use the handout passage.


