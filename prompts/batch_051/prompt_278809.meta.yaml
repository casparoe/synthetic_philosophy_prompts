  Let''s draft:


  "I help run the philosophy club at my high school, and for the past few weeks we
  have been stuck on a disagreement about Kurt Gödel''s 1949 essay A Remark about
  the Relationship Between Relativity Theory and Idealistic Philosophy. We all agree
  on the basic content: Gödel argues that the relativistic picture of spacetime, and
  especially his rotating-universe solutions to Einstein''s field equations, undermines
  the idea of an objective lapse of time, and he takes this to support a broadly idealist
  conclusion about the unreality of change. But the club has split into two camps.
  One side reads him as making a metaphysical claim: time as it is ordinarily understood
  does not exist, because there is no objective now shared by different observers,
  and in solutions like Gödel''s there are closed timelike curves. The other side
  says this is a philosophical overreading of the physics: relativity only shows that
  simultaneity is frame-relative, which is an epistemological or representational
  point, not a discovery that change is unreal. The same people also point out that
  Gödel himself was a mathematical Platonist and a realist about many things, so reading
  him as a full-blown idealist about time may be too crude.


  We have been going in circles for a month. I suspect the actual standstill is not
  about the physics but about what counts as a conclusion reachable from a physical
  theory: one side treats a globally consistent description of spacetime as enough
  to dissolve objective becoming, while the other demands that the theory say something
  about temporal experience before any metaphysical conclusion follows. I would be
  grateful for a diagnosis of what kind of disagreement this really is—whether it
  is verbal, a difference about the status of scientific models, a clash of bedrock
  intuitions about time, or something else—and what kind of argument or distinction
  would actually move it."


