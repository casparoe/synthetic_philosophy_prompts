  Here is an argument about recursive factored cognition, and I would like your help
  determining whether it goes through.


  First, some terminology. By HCH I mean the idealized scheme in which a question
  is answered by a human who may decompose it into finitely many subquestions, write
  a written brief for each, and delegate each to a fresh human who sees only that
  brief and may decompose further; the answers are then combined upward. By factored
  cognition I mean the underlying idea that real deliberation—however implicit and
  associative it may actually be—can be reconstructed as this kind of tree of small,
  individually checkable steps.


  The argument concerns whether HCH can reproduce the judgment of an expert E on a
  hard, unstructured question Q—say, whether an analogy is apt, whether a proof sketch
  has a hidden gap, or whether a proposed trade-off is acceptable. It runs as follows.


  (1) HCH reproduces E''s judgment on Q only if E''s reasoning can be decomposed into
  finitely many subtasks such that, for each subtask, some written brief plus general
  human competence is sufficient for a competent human who has never encountered E''s
  particular history to produce or check the result E''s reasoning requires.


  (2) Consider any candidate decomposition of E''s reasoning.


  (3) Each brief in the decomposition is a finite text. For the sorts of subtask that
  appear in hard unstructured judgment, the considerations that matter to E''s resolution
  are indefinitely many and contextually interdependent: how to weigh a named consideration,
  which buried comparisons to draw, and when to override a listed consideration all
  depend on further features of E''s total background, which in turn depend on others.


  (4) Therefore, for any such brief, the brief underdetermines the required resolution:
  a competent human can follow the brief competently and still, on some possible background,
  resolve the subtask differently from E.


  (5) But if a subtask brief underdetermines the resolution in this way, then a deployment
  of HCH that happens to agree with E is agreeing only by luck relative to the brief,
  and a procedure whose success would be lucky relative to its own decompositional
  specification is not a reliable reproduction of E''s judgment.


  (6) Thus, for any finite decomposition, HCH does not reliably reproduce E''s judgment.


  (7) So, for hard unstructured judgment at least, HCH is not an idealization of real
  expert deliberation.


