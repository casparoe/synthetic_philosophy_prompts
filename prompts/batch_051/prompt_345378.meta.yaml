  Let''s formulate:


  (1) HCH models a cognitive task as solvable only if the task can be recursively
  decomposed into subtasks each small enough for a single human to verify against
  explicit criteria.

  (2) For any such decomposition to preserve correctness, the criteria for success
  on a subtask must fully capture the contribution of that subtask to the whole.

  (3) In actual expert deliberation, the criteria for success on a cognitive step
  are often not fully explicit: the expert judges a step right by an inarticulate
  sense of fit with the problem.

  (4) If the criteria are not fully explicit, they cannot be handed to a fresh human
  as a verification protocol.

  (5) So many actual steps of expert deliberation cannot be recursively decomposed
  into verifiable subtasks; HCH leaves them out.

  (6) An idealization of deliberation that leaves out actual inferential steps is
  not an idealization of deliberation at all, but a model of a different, more explicit
  process.

  (7) So HCH is not an idealization of actual deliberation.


