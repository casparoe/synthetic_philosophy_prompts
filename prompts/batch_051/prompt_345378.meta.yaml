  expert''s particular history.

  (3) The original expert''s judgment about a hard open problem depends on that expert''s
  particular history in a way that cannot be fully encoded in any finite prompt: each
  factor one tries to write down presupposes further background, and the demand for
  complete instructions regresses.

  (4) So for any finite HCH decomposition of the problem, there is a possible world
  in which a node-occupant, drawing on the shared-but-not-idiosyncratic-resources
  allowed, resolves some subtask differently from the expert.

  (5) But if a scheme can fail to reproduce the expert''s judgment in some possible
