  I''m writing as a journalist who covers science and ideas, and for the past few
  months I''ve been reporting on the dispute over whether people who use image-generation
  systems are engaged in an act of creativity. A view has been forming in my notebook
  that I''d like pressure-tested before I commit to it in print. The starting point
  is that novelty has become almost free: a diffusion model can produce thousands
  of distinct and superficially striking images in an afternoon. So creativity cannot
  consist in the production of new combinations or variations, because that is precisely
  what the machine does without our help and, I take it, without being creative in
  the interesting sense. Instead, I''ve been toying with what I call the signature
  condition: an artefact is creative only if someone stands behind its novelty as
  their own act. That means the person who presents the work could, if asked why this
  particular variation was kept rather than a dozen equally plausible neighbours,
  give an honest, first-person answer — "I rejected the others because..., I darkened
  this because..., the tension here is the point" — rather than merely reporting that
  the system happened to output it. Creativity, on the account, is not generation
  but authorial liability for selection: you are creative when you are answerable
  for the choices the machine''s output lets you make, not when you are surprised
  by what it made.


