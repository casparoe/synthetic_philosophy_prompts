  require not revising in some cases (precommitment). But as stated, (2) says "revises
  whenever current best judgment recommends doing otherwise" — that''s a normative
  claim about what a rational agent does. If we accept (2), then (3) follows definitionally.
  The argument would be valid given (1)-(4). The weak point is (2), plus (4)''s definition
  of improviser. But (2) seems plausible and is the crux: the value of planning may
  lie precisely in shaping what one''s current best judgment is — e.g., not reopening
  deliberation, treating the plan as a default. So (2) is too strong. The correct
  version: a rational agent may stick with a plan even when her current best judgment,
  formed without taking the plan into account, would recommend otherwise, because
  the plan itself is a reason; she revisits only when there is sufficient reason to
  reopen deliberation. That''s a nice answer.


