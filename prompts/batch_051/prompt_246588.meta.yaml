  Let me design precisely:


  Argument that planning is overrated:

  (1) A plan is a standing intention: a commitment, formed in advance, to perform
  some action later.

  (2) A rational agent revises her commitments whenever, at the time of action, her
  current best judgment recommends doing something other than what she planned.

  (3) If an agent always follows her current best judgment at the time of action,
  then her earlier plan never actually determines what she does; it only records her
  earlier guess about what her later judgment would be.

  (4) An improviser is someone whose actions are determined by her current best judgment
  in the unfolding situation, not by a prior commitment.

  (5) So a perfectly rational planner and a perfectly rational improviser act identically;
  the plan makes no difference to rational action.


