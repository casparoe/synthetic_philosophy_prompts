  outcomes now arrive in real time, are benchmarked across jurisdictions, and are
  attributed through social media rather than through state-managed narratives; consequently
  the effective standard of evaluation shifts from the country''s own past toward
  the current best performer, and the regime is held responsible for outcomes it only
  partly controls (global demand, exchange rates, supply chains, demographic drag).
