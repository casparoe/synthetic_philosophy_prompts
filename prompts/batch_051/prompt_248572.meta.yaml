  I am a PhD candidate in comparative politics, and next term I will present a paper
  at our department colloquium. The paper takes up the idea of performance legitimacy
  in the study of authoritarian rule in China and Singapore: the claim that sustained
  prosperity, social order, and rising living standards can stabilize a regime that
  lacks democratic authorization. I argue that this familiar account misdescribes
  the underlying mechanism. It treats performance as a stock of accumulated public
  acceptance that a regime can draw on; I argue that under contemporary information
  conditions performance functions instead as a continuously refreshed audit. Outcomes
  now arrive in real time, are benchmarked across jurisdictions, and are attributed
  through social media rather than through state-managed narratives. The operative
  standard of comparison therefore shifts from a country''s own past to the best performer
  currently visible, and the regime is held responsible for outcomes it only partly
  controls, such as global demand, exchange rates, supply chains, and demographic
  change. On this logic, performance becomes a source of volatility rather than a
  reserve of stability, and credit-claiming is undermined precisely by the information
  openness a regime needs if its performance is to count as credible. I am not predicting
  that either regime collapses; I am making a claim about the changing mechanics of
  performance-based legitimation. I also argue that the two regimes respond differently:
  Singapore manages the baseline by framing external constraints in technocratic terms,
  while China increasingly tries to control the benchmark itself. My claim is about
  the empirical mechanics of public acceptance, not about whether outcomes normatively
  justify rule.


  The audience is a mixed political science colloquium. It includes comparative politics
