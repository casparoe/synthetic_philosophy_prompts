  earn its keep by compressing: it should let you reach the outcome without replaying
  the whole history. My claim is that, faced with irreducible systems, people keep
  producing something that passes for explanation but doesn''t earn its keep: they
  take the step-by-step run, which is just the system replayed, and dress it in a
  causal story so that it feels like understanding. That dressing-up is explanatory
  laundering. The weather did what it did ''because the front stalled''; the market
  fell ''because sellers outnumbered buyers''; the model segregated ''because homophily
