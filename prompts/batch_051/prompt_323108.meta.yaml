  As I understand it, their case goes roughly like this: our moral psychology evolved
  for small groups and slow feedback, but technology now lets small numbers of people
  do enormous harm. Improving people''s cognitive abilities alone, without improving
  their moral motivation, just gives morally ordinary or morally worse people bigger
  levers to pull. So there is an urgent reason to develop moral bioenhancement — drugs,
  genetic changes, or other biomedical means of making people more willing to do what
  they already believe is right, or more sympathetic and fair-minded — rather than
  to focus only on making people smarter.


  That argument was put forward when the obviously dangerous new capacities were things
  terrified to individual humans — engineered pathogens, nuclear materials, and so
  on. But now a lot of the most dangerous emerging capacity sits in AI systems: systems
  that don''t share human moral psychology, don''t need to be made ''more moral''
