  I am a PhD student in philosophy of physics. For the past year I have been convening
  a reading group in which an Everettian and a de Broglie–Bohm pilot-wave theorist
  have argued about quantum mechanics, and they have repeatedly talked past one another.
  Write the document they should have produced: the joint statement of an adversarial
  collaboration. It should record what the two sides actually agree on, state their
  remaining disagreement in wording each side would accept, and identify the issues
  on which a settled answer would move at least one of them.


  Set up the two positions as follows. The Everettian holds that the quantum state
  is the complete physical state of the universe; that the Schrödinger equation always
  applies; and that decoherence explains why components of the state stop interfering
  and why observers within a branch see definite records and relative frequencies.
  The Bohmian holds that the complete state is the universal wave function together
