  Key issues in low-impact AI:

  - Need a baseline: the world as it would have been had the agent not acted. But
  "had not acted" is ambiguous: the agent could have done an alternative action, done
  nothing, etc. Defining this baseline requires a notion of what changes are "relevant"
  to the task.

