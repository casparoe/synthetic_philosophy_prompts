  shifts in the attainability of a broad set of possible goals. But this requires
  a set of goals or a distribution over goals; choosing that set is a value-laden
  choice. Also it may penalize the agent for doing its actual job (if doing its job
  changes what''s attainable). The idea that an agent can be penalized for making
