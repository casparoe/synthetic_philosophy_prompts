  Let me craft commitments. Need precise, plausible positions, each standard-ish,
  but interacting tensely.


  Possible commitments:


  1. Value theory: I accept the core of Marx''s labor theory of value: a commodity''s
  value is determined by the socially necessary labor time required to produce it,
  and living labor is the source of new value; machinery only transfers its own value
  gradually to the product.


  2. Technological unemployment/pauperization: Under capitalism, labor-saving technical
  change tends to produce unemployment and downward pressure on wages (industrial
  reserve army), and in the short-to-medium run immiserates or displaces workers.


  3. Automation under socialism would be liberatory: The same machinery, under different
  relations of production, would shorten the working day and expand the "realm of
  freedom" rather than immiserate anyone.


  4. Falling rate of profit / crisis tendency: I hold that the rising organic composition
  of capital (more constant capital relative to variable capital) generates a tendency
  for the rate of profit to fall, which expresses capital''s own technological dynamism
  as a self-undermining force.


  5. Fragment on Machines / general intellect: I find compelling Marx''s later/other
  remarks (Grundrisse) that once production comes to depend more on science, accumulated
  technique, and "the general intellect" than on the immediate labor time of workers,
  labor time stops being an adequate measure of value, and the real source of wealth
  is the development of the productive forces.


  6. Methodological anti-utopianism? Maybe: I don''t think socialists should design
  blueprints for future automated economies; the character of post-capitalist production
  can''t be read off from its technical possibilities.


