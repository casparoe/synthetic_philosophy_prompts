  Then the argument:

  (1) For a report of one of my own mental states to be authoritative — something
  I know better than an observer does — the state must be detected by some faculty
  whose access is better than ordinary inference.

  (2) What introspection detects is restricted to present-tense sensory and affective
  material: mental images, inner speech, bodily feelings, felt urges. It does not
  detect propositional attitudes, standing motives, or the causal processes that produce
  them.

  (3) Therefore, when I say "I was angry because she interrupted me" or "I believe
  the meeting is at three," I am not reading off a detected fact; I am constructing
  an explanation after the fact from behavior, context, and narrative plausibility
  — the same materials available to an observer.

  (4) Construction after the fact from such materials is the process whose failures
  are documented in split-brain confabulations, hypnotic suggestions, experiments
  where subjects explain choices they demonstrably did not make, and, as I now see,
  in ordinary quarrels.

  (5) So my first-person reports of my attitudes and motives are just plausible third-person-style
  guesses, and they carry no special authority.

  (6) If they carry no special authority, then in the disagreement with my sister,
  I had no better position than she did about why I went silent, and it becomes unclear
  how anyone ever knows their own reasons — apologies, promises, and testimony about
  one''s own mind would all rest on something indistinguishable from speculation.

  (7) But that conclusion is false: something went wrong that evening, but I was not
  merely guessing about my own mind; I was confused about a detail while still knowing
  the broad shape of my own motive. And ordinary life treats first-person reports
  as more than one hypothesis among equals.

