  ---


  I have been trying to formulate a view about moral worth, and I would like an honest
  assessment of it. I call it the Load-Bearing Reason Account. The usual issue is
  whether an action has moral worth only when it is done for the right reasons; I
  think the debate needs a stricter test for what it is for the right reason to be
  the reason one acts on. My proposal is this. A right-making feature R gives an action
  full moral worth only if R is counterfactually load-bearing in the agent''s actual
  motivational economy in both of two directions. First, necessity: if R were absent
  while every other motive stayed as it actually is, the agent would not have performed
  the action. Second, sufficiency: if every other motive were removed while R remained
  in place, the agent would still have performed it. Only a reason that would pass
  both tests is genuinely doing the work; a right-making feature that is merely present
  in the agent''s deliberation, or even sincerely cited, is not enough.


  The view gets its force from cases of overdetermination. Consider a doctor who rushes
  to treat a patient both because it is her duty and because the patient is her father.
  Her duty is a right-making feature, and she would cite it sincerely; but it fails
  the necessity test, because she would have treated her father even if treating him
  had not been her duty. So, on my view, her action does not have full moral worth
  — or at least not in virtue of duty. That sounds harsh, and I partly mean it. I
  know people sometimes use a one-directional counterfactual to test for acting on
  a reason, but my claim is that both directions are needed and that full moral worth
  is scarce. Is this a coherent view rather than just a restatement of the familiar
  right-reasons accounts? What are the three strongest objections, and is any of them
  fatal rather than merely a bullet I have to bite?


