  publicly fund literature because reading novels builds empathy, exercises moral
  imagination, makes people better citizens. On the other side are the people who
  say this instrumentalises fiction, turns it into a delivery mechanism for a lesson,
  and misses what''s actually valuable about it — the experience of the work itself,
  the form, the way it reshapes attention. The weird thing is both sides agree on
  a lot: they agree some books are much better than others, they agree the good ones
  aren''t just pleasant, they agree the state has some role in supporting culture.
  Yet the argument never moves. The instrumentalists can never produce evidence good
  enough to justify specifically funding literature rather than, say, empathy training
  or journalism or whatever; and the autonomists, when pressed, cant say why a liberal
  state, which is supposed to be neutral between conceptions of the good, should spend
  public money on an experience they themselves describe as private and intrinsic.
  So each side is strongest exactly when attacking the other, and weakest when defending
  its own positive position.


  My working theory is that the whole argument is stuck because both sides are assuming
  value has to be either instrumental (good for something) or intrinsic (good in itself),
  and fiction''s value might be neither — something more like a practice or a discipline
  that you get better at noticing things with, which is not a means to an independent
  outcome but also not an isolated experience. But I might be fooling myself; maybe
  one side is just empirically wrong in a way that matters, or maybe they''re answering
  different questions under one heading.


