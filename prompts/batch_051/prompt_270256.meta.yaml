  case it is violence, or a threat of violence, directed at non-combatants or civilian
  property, with the intent of intimidating or coercing a wider audience or government
  into some political course of action. That principle seems to handle most of my
  verdicts, but it leaves the barracks case unclear, and I suspect the cases are pressuring
  me toward commitments I have not made explicit. Is there a single principle that
  captures my verdicts, or at least most of them? Which of my verdicts, if any, does
  it force me to abandon, and what would it say about cases I have not listed, such
  as a cyberattack that shuts down a civilian hospital to pressure a government, or
  a military strike on a legitimate target that predictably kills civilians as collateral
  damage?"


