  Draft:


  "I am a PhD student in political philosophy working on the definition of terrorism,
  and I have been trying to make my account fit my own judgments about cases before
  I commit to any of the standard positions. I keep running into the following pattern.


  I have no hesitation about the first two cases. When a separatist group detonates
  a car bomb outside a government building during rush hour, killing passersby, with
  the stated aim of forcing the government to enter negotiations, that is clearly
  terrorism. And when a state''s air force, in the course of a war, deliberately bombs
  a residential district far from any military objective in order to break the population''s
  will to resist and thereby force the enemy government to surrender, I also say that
  is terrorism, or at least an act of state terrorism — even though the perpetrator
  is a state.


  But other cases pull me in different directions. When uniformed soldiers of one
  state attack an enemy naval base during peacetime and announce that they will continue
  unless the enemy withdraws from a disputed island, I do not call that terrorism;
  I call it an act of aggression or an undeclared act of war, even though it is coercive
  political violence. When animal-rights activists, having checked repeatedly that
  a university laboratory is empty, set fire to it at night and leave a message saying
  the fires will stop only when the university ends a particular line of research,
  I lean toward calling that terrorism, though I am less certain because no person
  was harmed or directly threatened. When a lone gunman assassinates a cabinet minister
  as revenge for a massacre, announces that it was retribution, but issues no demands
  and makes no threats against anyone else, I do not call it terrorism — it seems
  like political assassination or something like it, but not terrorism. When a state
  secret police abducts and kills the child of a prominent dissident and deliberately
  lets that be known in order to deter other dissidents, I call that terrorism as
  well. And the case I keep going back and forth on: insurgents under a foreign occupation
  attack a barracks at night while soldiers are sleeping, in an attempt to make the
  occupation too costly and force a withdrawal; sometimes that feels like an act of
  war by irregular combatants, and sometimes it feels like terrorism.


