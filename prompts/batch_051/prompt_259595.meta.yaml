  there is a fact of the matter that no amount of investigation could reveal, which
  makes the boundary look almost magical. The supervaluationist picture is also more
  charitable to ordinary speakers, because it explains why they refuse to draw the
  line without saying they hold a false belief. So on balance supervaluationism gives
  the better account of the sorites."


