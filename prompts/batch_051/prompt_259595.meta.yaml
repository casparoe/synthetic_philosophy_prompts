  Supervaluationism, associated with Kit Fine, says that words like ''heap'' are semantically
  incomplete: there are many admissible ways of precisifying ''heap'', and each precisification
  draws a sharp line somewhere. A sentence is true outright, or supertrue, if it comes
  out true on every admissible precisification; it is false outright, or superfalse,
  if it comes out false on every precisification; otherwise it is neither true nor
  false. The existential claim ''there is a boundary between the heaps and the non-heaps''
  is therefore true, because on each precisification some particular grain is the
  boundary, even though no particular grain is the boundary. Classical logic is preserved:
  for instance, excluded middle is valid because on any precisification either p or
  not-p holds, so ''p or not-p'' is true on every precisification. Since every sentence
  is true or false on each precisification, supervaluationism also preserves bivalence;
  it just relocates the assignment of truth values to the precisifications rather
  than to the unsharpened language. So the paradox is solved by denying that the tolerance
  premise is ever true: on each admissible precisification there is a last heap, so
  the inductive step fails.


  Epistemicism, defended by Timothy Williamson, also preserves classical logic and
  bivalence, but for a different reason. On this view there really is a sharp boundary,
  but we cannot know where it is. The reason is that the meaning of ''heap'' is semantically
  indeterminate: our use of the word is compatible with all the different precisifications,
  and although one of them is, as a brute matter, the correct one, nothing in our
  linguistic practice picks it out. This is why competent speakers refuse to draw
  the line, even though the line exists. Williamson adds that any true belief about
  the cutoff would fail to be reliable, since nearby cases are too similar for us
  to discriminate, so ignorance is inevitable. Epistemicism thus solves the paradox
  by rejecting the tolerance premise outright: one grain does make a difference, and
  we are simply not in a position to say which one.


