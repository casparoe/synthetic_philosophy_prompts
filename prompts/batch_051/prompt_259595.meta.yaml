  Let me write the question:


  "Explain how supervaluationism and epistemicism each respond to the sorites paradox.
  Your answer should say what each view claims about (i) whether there is a sharp
  boundary between the heaps and the non-heaps, and (ii) whether and how classical
  logic is preserved. Finish by saying which view you find more plausible and why."


  Student answer (~700 words):


  Let me write it.


  "The sorites paradox runs like this: one grain of sand is clearly not a heap, ten
  thousand grains clearly are, and it seems that removing a single grain can never
  turn a heap into a non-heap. By repeated application of that premise we get the
  absurd conclusion that one grain is a heap. So at least one of the premises must
  go, and most solutions try to explain why the ''tolerance'' premise is false without
  saying something crazy about ordinary language.


  Supervaluationism, associated with Kit Fine, says that words like ''heap'' are semantically
  incomplete: there are lots of admissible ways of precisifying ''heap'', each of
  which draws a sharp line somewhere. A sentence is true outright (supertrue) if it
  comes out true on every admissible precisification, false outright (superfalse)
  if it comes out false on every precisification, and otherwise it is neither true
  nor false. The existential claim ''there is a boundary between the heaps and the
  non-heaps'' is therefore true, because on each precisification some particular grain
  is the boundary, even though no particular grain is the boundary. Classical logic
  is preserved: for instance, excluded middle is valid because on any precisification
  either p or not-p holds, so ''p or not-p'' is true on every precisification. Since
  every sentence is true or false on each precisification, supervaluationism also
  preserves bivalence — it only says borderline sentences are true or false relative
  to a precisification rather than absolutely. So the paradox is solved by denying
  that the tolerance premise is ever true: on each admissible precisification there
  is a last heap, so the inductive step fails.


  Epistemicism, defended by Timothy Williamson, agrees that classical logic and bivalence
  are preserved, but for a different reason. On this view there is in fact a sharp
  boundary, but we cannot know where it is. The reason is that the meaning of ''heap''
  is semantically indeterminate: our use of the word is compatible with all the different
  precisifications, and although one of them is, as a brute matter, the correct one,
  nothing in our linguistic practice picks it out. This is why competent speakers
  refuse to draw the line, even though the line exists. Williamson adds that any true
  belief about the cutoff would fail to be reliable, since nearby cases are too similar
  for us to discriminate, so ignorance is inevitable. Epistemicism thus solves the
  paradox by rejecting the tolerance premise outright: one grain does make a difference,
  and we are simply not in a position to say which one.


  Of the two, I find supervaluationism more plausible. It better explains why borderline
  cases feel genuinely unsettled: our hedging reflects the fact that the sentence
  has no determinate truth value until we sharpen the word. Epistemicism, by contrast,
  has to say that there is a fact of the matter that no amount of investigation could
  ever reveal, which makes the boundary look magical. The supervaluationist story
  is also nicer to ordinary speakers, because it does not tell them they are making
  a mistake when they say there is no sharp boundary. So on balance supervaluationism
  gives the better account of the sorites."


