  Let''s outline an argument:


  (1) A rational agent who has no reason to prefer A over B cannot choose A over B
  while remaining rational.

  (2) For any choice between two exactly similar options, there is no reason to prefer
  one over the other.

  (3) So a rational agent cannot choose between exactly similar options.

  (4) But real agents frequently do choose between sufficiently similar options (e.g.,
  identical cans of soup, two copies of same book, left or right door).

  (5) If a rational agent can choose between sufficiently similar options, then the
  similarity of options cannot be what blocks choice; it must be the agent''s preferences,
  which are never perfectly indifferent in practice.

  (6) But if exactly similar options and sufficiently similar options differ only
  in degree, and rationality permits choice among sufficiently similar options, then
  there is no principled threshold — so it should also permit choice among exactly
  similar options, contradicting (3).

  (7) Therefore the distinction between exact and approximate indifference cannot
  do the work; either rationality is impossible or no choice is ever underdetermined
  by preferences (every apparent indifference hides a decisive reason).

  (8) But both horns seem false. Something has gone wrong.


