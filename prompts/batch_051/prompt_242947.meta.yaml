  Draft:


  You are a philosopher of social ontology and collective responsibility with a serious
  working knowledge of the anthropology of ritual. I am a philosophy professor, and
  I want you to stress-test a position I have been developing rather than defend it.
  Think carefully, and begin by making explicit everything the position is committed
  to before you assess what would count against it.


  The position concerns what actually happens in scapegoat rites and substitutionary
  sacrifices — rituals in which a community''s wrongs are loaded onto a victim, animal
  or human, who is then driven out, destroyed, or otherwise removed. My view is deflationary.
  Nothing is transferred in any literal sense: no guilt-property, no moral stain,
  no quasi-substance, and no felt state of the wrongdoer moves to the substitute.
  What the rite transfers is a normative status. Before the rite, members of the community
  are entitled to resent the wrongdoer, to reopen the wrong, and to treat it as outstanding;
  after a public, correctly performed rite, those entitlements lapse. The substitute
  does not become guilty; it becomes the public marker that the books are closed.
  On my view, the rite succeeds not because anything has moved from sinner to scapegoat,
  but because the performance is common knowledge and the participants jointly accept
  that the wrong is no longer open to resentment, sanction, or reopening.


  I hold this because it handles two things a literal-transfer view handles badly:
  substitutes that no one could sincerely believe are guilty (an animal, a bundle,
  a stone), and the fact that the rite''s efficacy seems to depend on publicity and
  common knowledge rather than on any hidden causal transaction.


  I want a map of this position''s exposure, not a defense of it. Specifically:


  1. What would have to be true for the position to be false? Sort the candidate defeaters
  — observations, arguments, intuitions, or results from adjacent fields — into those
  that would be decisive and those that would merely be awkward.

  2. What does the view predict that its rivals (a literal-transfer view and a pure-catharsis
  view, for instance) do not? Where could those predictions fail? I am especially
  interested in whether the view commits me to the prediction that a secret or merely
  private scapegoat rite should fail to close the books, and whether that is a strength
