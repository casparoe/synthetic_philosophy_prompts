  Maya: With the individual rates known and no evidence or known mechanism connecting
  A and B, the right default is to treat them as independent. Any other joint model
  would be inventing correlation out of thin air.


  Ron: Independence is not the absence of an assumption; it''s an extremely specific
  assumption. The space of possible joint distributions is vast, and almost all of
  them involve dependence. "I don''t know of a connection" is not evidence that the
  connection is absent.


  Maya: But we have to put a number on the probability of both happening for patients,
  and we can''t estimate an interaction from the registry. Independence is the least
  informative choice — maximum entropy with the marginals as the only constraints.
  Any dependence we add would require choosing its direction and strength, which is
  more information, not less.


  Ron: Maximum entropy isn''t neutral unless the constraints are neutral. You chose
  to fix the marginals and nothing else. A clinician would expect latent common causes
  — a patient''s overall frailty, hidden surgical complexity, quality of care — that
  would generate dependence between A and B. Conditional on that background knowledge,
  the least informative distribution would not be independent; it would be positively
  correlated.


  Maya: But the background knowledge is exactly the kind of vague, unquantified hunch
  we can''t responsibly encode as a specific covariance. The pragmatic norm in this
  kind of modeling is to start simple and add structure only when the data demand
  it. That''s how you avoid overfitting an imagined dependence to noise.


  Ron: That''s now a different argument, and it''s a pragmatic one, not an epistemic
  one. You started by saying independence is the least committal representation of
  what we know, and now you''re saying it''s a bias–variance heuristic. Those are
  different claims. And the pragmatic argument cuts both ways: assuming independence
  biases the joint probability of A and B downward, which is exactly the quantity
  a clinician using our model would need in order to inform a patient about the chances
  of both complications. When the cost of underestimating co-occurrence is high, the
  convenient default is not obviously the right one.


  Maya: I''ll concede the point about cost asymmetry, but that''s a reason to do sensitivity
  analysis around the independence baseline, not to substitute a different default.
  You haven''t given me a competing default that isn''t even more arbitrary.


  Ron: A competing default does exist: model A and B as conditionally independent
  given a shared latent process, and let the data decide how much shared variation
  there is. Under that model, A and B are dependent unless the shared variation is
  zero, so independence is the special case at one edge rather than the center. The
