  There is an inertial observer whose present/hyperplane includes both our "now" and
  E. That observer''s present is real. Since reality is not frame-relative, E is real.
  Hence all events, past, present, future, are real: eternalism/block universe.


  The key assumptions: (a) relativity has no privileged frame; (b) a "reality" notion
  that is frame-invariant (if something is real relative to any frame, it''s real
