  Woodward''s account (from Making Things Happen, 2003): X causes Y iff there is a
  possible intervention on X that changes Y (or changes the probability distribution
  of Y), under certain conditions. Interventions are characterized in terms of surgical
  changes, ideal interventions, not necessarily humanly feasible; invariance under
  interventions; modularity. The circularity worry: characterizing interventions uses
  causal notions (an intervention is a cause of X that is not caused by... etc.),
  so the account of causation is circular. Woodward responds that it''s non-reductive
  but can be illuminating, and that intervention can be characterized in terms of
  a certain kind of causal relation but the circularity is not vicious because it''s
  a coherence account, not a definition.


  The slogan "no causation without manipulation" is associated with earlier manipulability
  theories (e.g., von Wright, Menzies & Price: an event C causes E iff bringing about
  C would be an effective means of bringing about E). Woodward explicitly says his
  account doesn''t require actual manipulation by humans; it requires hypothetical
  interventions. So the slogan is ambiguous between:

  - No causation without actual human manipulation (strong, anthropocentric, false;
  Woodward rejects)

  - No causation without the possibility of an intervention, which need not be humanly
  possible (Woodward''s view)

  - No causation without an invariant relationship exploitable for manipulation (Menzies
