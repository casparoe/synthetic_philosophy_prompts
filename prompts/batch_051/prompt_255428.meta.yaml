  ---

  I''m grading a homework assignment for a philosophy of language class. The question
  I set was:


  "Linguists and philosophers of language often contrast universal generalizations
  like ''All ducks lay eggs'' with generic ones like ''Ducks lay eggs.'' Explain why
  ''Ducks lay eggs'' and ''Mosquitoes carry malaria'' are both generally judged true
  even though most ducks (males, ducklings) never lay eggs and most mosquitoes never
  carry malaria. Then consider this proposal: a generic ''Ks are F'' is true just
  in case most Ks in a contextually restricted domain are F — say, mature female ducks,
  for the first example, and malaria-transmitting mosquitoes, for the second. Does
  this proposal give a satisfying account of the two examples? Why or why not?"


  Here''s one student''s answer (typos theirs):


  "A generic like ''Ducks lay eggs'' is true because it describes a characteristic
  feature of the kind, not a statistical claim about every member. Generics tolerate
  exceptions: ''Dogs have four legs'' is true even though some dogs lose a leg, and
  ''Birds fly'' is true even though ostriches and penguins can''t. So a semantic theory
  based on ''all'' or on a raw majority over the whole kind fails — most ducks don''t
  lay eggs, and most mosquitoes don''t carry malaria. The majority view can be repaired,
  though, if we choose the domain carefully. For ''Ducks lay eggs'' the relevant domain
  is adult female ducks during their breeding years, and most of those do lay. For
  ''Mosquitoes carry malaria'' the relevant domain is female Anopheles mosquitoes
  that have fed on an infected person, and most of those carry the parasite and can
  pass it on. So the restricted-majority account handles both examples. The only leftover
  problem is to explain which domain restrictions are allowed, but thats a pragmatic
  issue about context, not an objection to the semantics. Overall I''d say the proposal
  is basically right, and the original ''majority view'' just needed better domain
  selection."


  Grade this answer: assign a letter grade, then give the specific point-by-point
