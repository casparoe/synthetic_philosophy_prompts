  about whether an action can carry a distinctive kind of credit only when it is done
  for the right reasons, and whether anyone can ever tell, from the outside, whether
  that condition has been satisfied. The discussion kept returning to the familiar
  Kantian distinction between acting from duty and acting merely in accordance with
  duty: the shopkeeper who gives correct change because honesty is good for business
  does the right thing, but the action does not thereby have moral worth, and no amount
  of outward observation could settle whether he, or anyone else, has ever acted from
  duty at all. My friend insisted that this is not pedantry but a genuine limit on
  moral knowledge; I kept objecting that a condition we can never detect seems to
  have no practical use and may even render the whole notion of moral worth idle.


