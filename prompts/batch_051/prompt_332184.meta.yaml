  Classic issue: Jeffrey conditionalization is the rule: when your experience changes
  your credence over a partition {E_i} (uncertain evidence) from old P(E_i) to new
  Q(E_i), and experience doesn''t affect credences conditional on each E_i (rigidity),
  your new credence Q(A) = Σ_i Q(E_i) P(A|E_i).


  An argument that "proves too much": (1) Any time you update on uncertain evidence,
  you become certain of something: namely, that your credences in the partition elements
  have changed to certain values — you can introspect your own degrees of belief,
  e.g., you become certain that your new credence in E is q. (2) So uncertain evidence
  can always be treated as certain evidence about your own mind/credences. (3) If
  you''re certain of the proposition F = "my new unconditional credence in E is q,"
  then you can update by standard conditionalization: Q(A) = P(A | F). (4) Standard
  conditionalization renders Jeffrey conditionalization redundant. (5) But Jeffrey
  conditionalization is needed because sometimes evidence doesn''t come as a proposition
  learned with certainty. (6) Therefore something wrong: either Jeffrey conditionalization
  is redundant, or there are impossible updates, etc.


  Where does this go wrong? The standard problem: conditionalizing on self-referential
  proposition F gives wrong results unless the old credence function P satisfies something
  like P(E | F) = q, and one can''t generally introspect credence changes without
  already having a function; plus F is about the posterior credence, so the update
  rule becomes circular. Also, Jeffrey conditioning can be decomposed but the decomposition
  (certainty about one''s own probabilities) is not innocent; the relevant "self-locating"
  propositions have probabilities that are notoriously tricky. Another problem: if
  the new credence q is not among values P gave positive prior to? Let''s think.


