  Overdetermination: an effect is overdetermined when it has multiple sufficient causes,
  each of which would have sufficed on its own. In history, Mackie''s INUS condition:
  a cause is an Insufficient but Necessary part of an Unnecessary but Sufficient condition.
  Counterfactual dependence: cause C of E means if C hadn''t occurred, E wouldn''t
  have occurred (or might not, probabilistically). But with overdetermination, counterfactual
  tests fail: remove one cause, the others still bring about E, so no single cause
  is necessary. Yet historians often still cite causes.


  Causal selection: when we pick out one cause from the causal field, we''re influenced
  by explanatory interests, contrast classes, abnormality vs. normality, manipulability.
  Some philosophers (Mill, Hart & Honoré) think of causes as abnormal interventions
  into a normal background. Contrastive explanation: "Why E rather than E''?" determines
  which causes count.


  The procedure could operationalize:

  1. Specify the outcome and the contrast class (caused compared to what?).

  2. Specify the candidate cause and its proposed role (trigger vs. precondition vs.
  structural cause vs. accelerant?).

  3. Run counterfactual tests at the right grain: had C not occurred, would the outcome
  have occurred, when, and in what form? Distinguish "wouldn''t have happened at all,"
  "would have happened later," "would have happened differently," "would have happened
  anyway."

  4. Check overdetermination: were there independent backup causes sufficient in the
  circumstances? If yes, strong single-cause claims may need hedging unless you shift
  the contrast or outcome.

  5. Check INUS structure: is C a necessary component of a broader sufficient condition?
  Spell out the conjunction.

  6. Check abnormal-vs-normal background: is C selected because it''s the abnormal
  change against a stable background? Is that defensible for your audience?

  7. Check manipulability/leverage: if a retrospective agent could toggle C, how likely
  would outcome change? But warn that this imports counterfactual hindsight.

  8. Decide on the claim form: "was a cause," "was one necessary condition," "was
  the trigger," "made a decisive difference," "accelerated," "was one of several sufficient
