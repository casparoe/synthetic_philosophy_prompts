  Key theoretical distinction:

  - Anti-reductionism (Reid): testimony justifies belief by default, without needing
  independent positive reasons for the informant''s reliability, absent defeaters
  (the hearer can be an infant, etc.). Defeaters: evidence of unreliability, background
  beliefs contradicting the content, other testifiers disagreeing.

  - Reductionism (Hume): testimonial justification requires the hearer to have sufficient
  positive evidence of reliability (track record, general conformity between testimony
  and fact), acquired via perception, memory, inference. Without such background evidence,
  belief on testimony is not justified.


