  rational constraint: agents who are honest, share a prior, and have common knowledge
  of each other''s posterior probabilities cannot continue to disagree, so persistent
  disagreement between reasonable people must trace back to differing priors, private
  information, or a failure of common knowledge—and the theorem tells us exactly where
  to look. The other, call him the ''irrelevance theorist,'' thinks the theorem is
  formally true but practically vacuous: in any real controversy, common priors and
  common knowledge of posteriors never hold, so the theorem licenses no conclusion
