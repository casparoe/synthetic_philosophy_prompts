  (1) an agreed-claims section stating the theorem and what it does and doesn''t assume,
  plus which of those assumptions are doing the work; (2) a disagreements table in
  which each side''s positive view is phrased in wording that side would accept; (3)
  the cruxes—sub-questions that would move at least one side; and (4) for each crux,
  a concrete fictional or real disagreement episode whose observable outcome each
  side would predict, recorded in advance. If part of their dispute is about words
  rather than substance, say so and give the neutral restatement. End with \answer{...}
  containing a one-sentence summary of the deepest unresolved crux."


