  C and B given A,C; and plausibility of not-A is some function of plausibility of
  A.


  Actually axioms:

  1. Plausibilities are real numbers; transitivity.

  2. Consistency with deductive logic (if A -> B, then plausibility of B given A is...).

  3. Structure: f(x,y) for conjunction; g(x) for negation. f and g continuous/monotonic
  assumptions.


  The theorem (Cox 1946, refined by others like Aczél, Jaynes, Halpern) aims to show
  that any measure satisfying these must be isomorphic to probability: associative,
  etc., leading to the sum and product rules. Criticisms: Halpern showed some technical
  gaps; the assumptions are strong; the theorem assumes rather than proves; "plausibility"
  can be represented by probability only under specific assumptions. Also Cox''s theorem
  doesn''t establish that probability is the *correct* logic; it shows if you accept
  certain desiderata, then standard probability calculus follows. Many people overstate:
  "Cox proved that any rational agent must use probability theory" — actually it''s
  a representation theorem with assumptions.


