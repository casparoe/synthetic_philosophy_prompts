  ---


  I spent most of yesterday evening arguing with a friend about why the same desire
  for more life is treated as sensible in one corner of medicine and as a problem
  in another. She kept calling the whole thing "deathism" — the way people moralise
  a normal lifespan — and by the end I had to admit I couldn''t pin down what view
  was actually doing the work.


  Here''s the contrast that''s been bugging me since. On the one hand, a health service
  will treat a forty-five-year-old who wants to live to a hundred as perfectly reasonable,
  and will happily fund research that pushes life expectancy up; nobody tells a middle-aged
  patient to come to terms with their mortality. On the other, in palliative and hospice
  care a "good death" is very often described in terms of acceptance: the patient
  stops fighting, lets go, finds peace. A dying patient who keeps pressing about what
  else might be tried, or says outright that they want more time, is likely to be
  talked about as "in denial" and steered gently toward acceptance. So the desire
  for more life is rational at one age and something to be managed psychologically
  at another, and the line looks like it tracks a natural or normal lifespan rather
  than whether any further good life was actually on offer.


  What I want to know is what that pattern presupposes about the value of death and
  the shape of a good life. Does it commit us to the idea that there''s a right time
  to die, after which death stops being a deprivation and becomes something healthy
  people welcome? Or is the whole arrangement compatible with the plain deprivation
  view — death is bad whenever it costs you good life you would otherwise have had
  — with the hospice emphasis on acceptance being just a pragmatic response to treatments
  no longer working? And if we really dropped the presupposition, say if we thought
  a patient''s wanting more time was rational all the way down even when we couldn''t
  grant it, what would end-of-life care have to stop doing? If I''m lumping together
  two practices that aren''t really one thing, or if "presupposes" is the wrong lens
  and I''ve misdescribed how palliative care talks, say so plainly; I''d rather be
  told the question''s broken than get a tidy answer built on a wobbly premise.


