  calculation debate. Mises argued that rational economic calculation is impossible
  without genuine factor markets; Hayek added that the relevant knowledge is dispersed,
  local and often tacit, and that a planning board could not gather it because agents
  lack any incentive to reveal it truthfully. Oskar Lange replied that a Central Planning
  Board could mimic a competitive economy by trial-and-error: it posts prices for
  producer goods, instructs state-owned enterprises to minimise average cost and to
  set output where marginal cost equals the posted price, and raises a price when
  there is excess demand and lowers it when there is excess supply, relying on managers''
  reports of shortages and surpluses.


  Now suppose a modified Lange procedure is proposed, as follows. ..."


  Mechanism details:

  - The Central Planning Board (CPB) owns all non-labour means of production.

  - Consumer goods are sold in ordinary shops at market-clearing prices; consumers
  spend freely; labour is hired on an open labour market.

  - State-owned enterprises produce consumer goods and, subject to rules, trade intermediate
  goods with each other at prices posted by the CPB.

  - Managers must minimise accounting cost at posted prices and set output where marginal
  cost equals the posted price, as in Lange.

  - The novelty is in how the CPB gets shortage information. There are no manager
  shortage reports. Instead, for every intermediate good the CPB operates a real-money
  prediction market, open to all citizens, in which one can buy and sell contracts
  that pay out if an independent statistical office certifies that the good was in
  excess demand over the relevant quarter. "Shortage" is defined by a mechanical audit
  rule: the statistical office measures order backlogs and days of inventory at the
  posted price, and certifies a shortage only if an audited, quantity-weighted backlog
  index exceeds a published threshold. The audit is published with a two-quarter lag.

  - The CPB is bound by a mechanical reaction rule: at the end of each quarter, for
  each good, it raises the posted price by a fixed percentage if the market''s time-averaged
  implied probability of shortage was above 60%, lowers it if below 40%, and leaves
  it unchanged otherwise.

  - Positions are capped, and any citizen may trade; managers may trade on contracts
  concerning their own inputs but not on their own enterprise''s outputs. Trading
  is anonymous.

  - Each enterprise keeps the difference between its sales revenue and its costs;
  the state takes all residual profit but pays managers a bonus proportional to the
  enterprise''s audited profit computed at posted prices.


