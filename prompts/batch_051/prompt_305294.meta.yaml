  Readings:

  1. Mere abstract ideas, unexpressed, cannot be subject to copyright or patent (legal
  truism: idea/expression dichotomy; ideas themselves are not property).

  2. Once an idea has been expressed and absorbed (learned from), it becomes part
  of the reader''s mind and cannot be owned in the way physical things can — since
  ownership of ideas is impossible because they are non-excludable and non-rivalrous.

  3. No one ought to have exclusive rights over ideas, because ideas are common goods
  / products of culture (normative, Lockean-commons).

  4. What is owned in law is never the idea but particular concrete expression or
  instantiation, so saying "you can''t own an idea" is compatible with copyright existing
  (weak reading).

  5. All intellectual property is illegitimate because it tries to turn public ideas
  into private property (strong, contentious).

  6. "You can''t own an idea" in the mind-control sense: no one can own another''s
  thoughts (trivially true but irrelevant).


