  Standard arguments for the Poverty of the Stimulus:

  1. The "negative evidence" argument: children receive little or no reliable correction
  of ungrammatical utterances, yet all normal children converge on the same grammar;
  hence the absence of negative evidence cannot be compensated by positive evidence
  alone. This is classic (Brown and Hanlon; Marcus). Also Gold''s learnability result:
  natural languages (finite cardinality?) are not learnable from positive examples
  alone under certain assumptions.

  2. The "degeneracy and finiteness of input" argument: children''s linguistic input
  is full of false starts, fragments, slips, and ungrammaticalities, yet they filter
  to underlying grammar. Although some argue input isn''t as degenerate as claimed
  (motherese). Hmm.

  3. The "underdetermination by data" argument: children acquire principles/rules
  for which their input provides no direct evidence, e.g., structure-dependence of
  yes/no question formation: the correct rule operates on hierarchical structure (move
  the auxiliary of the main clause after the subject?) rather than linear position
  (first auxiliary). Children never try the simpler linear rule, and input doesn''t
  distinguish in relevant cases.

  4. The "maturational/species-specificity" argument: language develops on a timetable
  despite wide variation in environment, and only humans acquire full language—suggesting
  a species-specific endowment rather than general learning from available input.

  5. The "creole/Nicaraguan Sign Language" argument: when input is a degenerate pidgin,
  children innovate grammatical structures not present in input, showing that learners
  do not merely reproduce input. This is more "language creation" evidence for an
  innate language faculty than strictly PoS.

  6. The "convergence despite different inputs" argument: different children hear
  different corpora but converge on the same grammar (Baker''s paradox?). Also the
  "subset problem"? Hmm.


