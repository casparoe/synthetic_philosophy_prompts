  distortion have been excluded, leaving nothing but the pressure exerted by the better
  argument itself. I find this an attractive standard, but when I try to apply it
  to concrete choices about moderation, workplace speech, algorithmic ranking, and
  social sanctions, I run into a basic difficulty. I do not actually have a working
  definition of coercion that lets me determine which features of a real discussion
  are disqualifying and which are benign.


  I would like you to propose a definition of coercion — or, if you think the concept
  splits into more than one sense, a small set of definitions — that decides the following
  cases in a principled way. I take these to be clear cases of coercion: (a) someone
  threatens physical harm unless you endorse a claim; (b) someone threatens to reveal
  damaging personal information unless you publicly retract a claim you believe. I
