  Facts about quantum indistinguishability:

  - In quantum mechanics, particles of the same type (e.g., two electrons) are indistinguishable
  in principle, not just in practice. The wavefunction is symmetric under exchange
  for bosons and antisymmetric for fermions. Exchanging two identical particles does
  not change the physical state. This is why there are only two statistics in 3D:
  Bose-Einstein and Fermi-Dirac; classical Maxwell-Boltzmann statistics count permutations
  as distinct, leading to Gibbs paradox.

  - Philosophical debate: Some interpret this as showing quantum particles are not
  individuals; they violate Leibniz''s principle of the identity of indiscernibles
  (PII) because two electrons in the same atom can share all intrinsic properties
  yet be distinct (they''re "weakly discernible" by relations? debate). Others (e.g.,
  French and Krause) argue they are non-individuals; others (Saunders) argue they
  are weakly discernible individuals via relations like "having opposite spins" —
  actually fermions are weakly discernible by irreflexive relations, bosons are not
  even weakly discernible in some states? There''s ongoing debate.

  - The parallel with programming: "value objects" vs "reference objects." Two separate
  objects with equal values are equal by value but distinct by identity (reference).
  In quantum mechanics, particles have no such separate identity; two identical particles
  are in a state described without labeled particle names — like a collection with
  value semantics. But the analogy may break: quantum entanglement between two particles
  still allows relational facts (one is spin-up, the other spin-down) to distinguish
  them weakly, like two references in a list with different indices? Actually in programming,
  even immutable value objects can be distinguished by their address if you use reference
  equality, but value semantics deliberately abstracts away from address. Quantum
  mechanics seems to forbid any address. However, fermions are weakly discernible
  by an irreflexive relation (e.g., spin singlet: "x has opposite spin to y"), so
  they are not absolutely indiscernible. This may map to two value objects with transitive
  relations.


