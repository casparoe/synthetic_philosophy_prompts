  Let me recall some results:

  - In normal-form games: common knowledge of rationality (CKR) plus common prior
  implies players choose strategies in the set of rationalizable strategies (Bernheim
  1984, Pearce 1984). Not necessarily Nash.

  - Aumann 1987: correlated equilibrium: if players share a common prior and each
  chooses an action maximizing expected utility given their private information, the
  distribution of play is a correlated equilibrium. And any correlated equilibrium
  can be realized.

  - In extensive-form games, CKR and common knowledge of "material rationality" at
  each node? Backward induction?

  - Aumann (1995) "Backward induction and common knowledge of rationality" claims
  CKR yields backward induction. But this relies on "substantive rationality": players
  choose rationally even at information sets with zero ex ante probability. In contrast,
  Stalnaker (1998) argues that CKR in the standard counterfactual sense doesn''t yield
  backward induction because beliefs at counterfactual nodes aren''t fixed.

  These are niche but maybe LLMs know some.


