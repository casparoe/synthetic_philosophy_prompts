  way to model it is to give each person''s position equal probability, like drawing
  names from a hat. That''s not a guess; it''s forced by symmetry.


  (3) Dana: The "some probabilities and utilities" is doing the work. The representation
  theorem doesn''t tell you where those numbers come from; it reads them off of preferences
  the chooser already has. But behind the veil, those preferences are exactly what''s
  in question — you can''t have preferences over being different people with different
  life plans until you already know something about those lives. So the equal-probability
