  Tolstoy''s theory:

  - Art = infection: "To evoke in oneself a feeling one has once experienced, and
  having evoked it in oneself, then, by means of movements, lines, colors, sounds,
  or forms expressed in words, so to transmit that feeling that others may experience
  the same feeling — this is the activity of art."

  - Infectiousness is the criterion distinguishing real art from counterfeit. A true
  work infects the audience with the artist''s feeling; counterfeit art (which is
  most of what his society calls art) aims at beauty/pleasure and imitates borrowed
  styles; it does not transmit the artist''s sincere feeling.

  - Degree of infectiousness depends on (1) individuality, (2) clearness, (3) sincerity.

  - Good vs bad art: depends on feelings being in line with the religious perception
  of the age (brotherhood). Good art = universal/religious; bad art = exclusive/pagan/particular.


