  \ exotic... Hmm.\n\nType 1 counterfactual + Arrow's theorem: \"Suppose a society\
  \ tried to rank outcomes of all AGI policies using majority vote on pairwise referendums\
  \ with more than two options...\" Could be too abstract.\n\nMeta-problem of consciousness:\
  \ Type 3 asymmetry? We treat our own phenomenal reports as authoritative but deny\
  \ introspective authority to others. Hmm.\n\nLet's brainstorm each.\n\nDomain: meta-problem\
  \ of consciousness (Chalmers): the problem of explaining why we think and say there\
  \ is a hard problem. Why do humans find consciousness puzzling and report phenomenal\
