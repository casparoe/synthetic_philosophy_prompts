  \ 2: Domain = meta-problem; Type 3 asymmetry. This could be very in-the-weeds: The\
  \ asymmetry in how science treats the \"intuition of an explanatory gap.\" Let me\
  \ draft:\n\n\"You are a philosopher of cognitive science. Consider this asymmetry\
