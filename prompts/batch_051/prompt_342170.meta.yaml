  ---


  I''m a software engineer with no formal philosophy background, and I lead a small
  machine-learning team at a company that builds underwriting-support software for
  community banks. Our models flag loan applications for mandatory human review, and
  our model-risk group has started refusing to sign off on new model versions unless
  they meet something they call legibility. As I reconstruct their position, it is
  this: a model can beat the incumbent on held-out accuracy and still be a worse system
  to ship, because if the route from inputs to score is opaque, then being right for
  the wrong reason is a latent defect — one that will eventually surface as an error
  no reviewer sees coming. They distinguish three things I only half-control. First,
  an explanation can sound plausible after the fact without faithfully reflecting
  the features the model actually used. Second, being able to explain one prediction
  is not the same as being able to predict, without re-running the model, how it will
  generalize on nearby cases. Third, legibility for an engineer who can read the code
  is not the same as legibility for a compliance analyst who sees only the output
  and a narrative. I don''t know how much of this survives contact with a real release
  process, and I need it turned into a procedure my team can actually run, not a philosophy
  essay.


  Constraints: we release quarterly, we evaluate two or three candidate model versions
  per release, and each candidate review can get about half a day of attention from
  two senior engineers and one risk analyst. The stakes are real: a false flag sends
  a small-business borrower into a slow manual process, and a missed red flag can
  cost a community bank enough to matter. The model-risk committee still makes the
  final sign-off; our job is to send them a clear recommendation. Please write a reusable
  pre-release decision procedure for judging whether a candidate model version meets
  a legibility standard, with legibility treated as a separate requirement from accuracy
  — so that a more accurate but less understandable version can fail, and a less accurate
  but more understandable version can pass. Structure the response exactly as follows.
  (1) "Operating principle" (about 150 words): restate the legibility requirement
  as a single testable standard, and say explicitly which of the three distinctions
  above survive in the procedure and which are dropped. (2) "The procedure" (about
  350 words): the ordered questions a reviewer asks, what counts as a sufficient answer
  to each, where the procedure stops with a fail, and where it hands the decision
  to the model-risk committee as a matter of values rather than facts. (3) "Worked
  applications" (about 300 words): run the procedure on two candidate versions — one
  with better accuracy than the incumbent whose explanations are plausible but unfaithful,
  and one with strong legibility but lower accuracy than the incumbent, so that the
  procedure gives an answer the accuracy-first engineers on my team, and honestly
  part of me, will not want to accept. (4) "Judgment calls and limits" (about 200
  words): flag where the procedure still requires a human to make a value call, how
  to keep those calls from quietly becoming technical ones, and what the procedure
  cannot guarantee even when it passes a model.


