  individual. But then every obligate symbiosis (lichen, coral) would qualify; question
  is whether that''s a reductio or fine.

  5. Verdict: "organism" is not a natural kind; it''s a pragmatic/interest-relative
  category (or a cluster concept). But possibly argue for a privileged criterion:
  physiological integration captures "organism" in the functional sense while "Darwinian
  individual" tracks units of selection — the two do not always coincide.


