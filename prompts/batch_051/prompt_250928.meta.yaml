  The model answer must hit:

  1. Clarify that "organism" is ambiguous between physiological (metabolic integration)
  and evolutionary (unit of selection/reproduction) senses, and that the three cases
  exercise different senses.

  2. For the man o'' war: zooids are clonal but functionally specialized, no germ-soma
  separation at colony level? Actually Portuguese man o'' war has reproductive gonozooids;
  individual zooids are modules. It can be either a colony of highly integrated modules
  or one organism depending on criterion. Key: genetic identity holds (all zooids
  from same zygote) so genetic homogeneity favors "organism"; but each zooid is homologous
  to a whole organism, so homology/deployment favors "colony."

  3. Honeybee colony: workers sterile, queen reproduces; colony has germ-soma split,
  functional integration (foraging, thermoregulation, pheromonal coordination). But
  genetic heterogeneity (haplodiploid sisters, not a single genome) and not contiguous...
  Superorganism view: colony is the unit whose fitness is tracked. Students should
  distinguish the "levels of selection" claim (colony evolves) from the "individual
  in development" claim (there is no bottleneck at colony level; new colonies are
  founded by queens, a bottleneck passage, arguably yes).

  4. Cow holobiont: host plus microbiota have different genomes, but strong metabolic
  integration; if genetic homogeneity is required, cow is not an organism with its
  microbiome — but then criterion would exclude mitochondria? Actually mitochondria
  have own genomes but are integrated via vertical transmission and immune tolerance.
  The amendment: community of co-evolved lineages with congruent fitness interests
