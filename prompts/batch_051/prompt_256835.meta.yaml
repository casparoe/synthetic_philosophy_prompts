  \ where it seems most exposed: value incommensurability; whether trading changes\
  \ the meaning or integrity of one's actions; epistemic and enforcement problems\
  \ in real deals; and the risk that moral trade launders or enables wrongdoing by\
  \ leaving one's counterpart with resources they will use in ways one condemns. Are\
