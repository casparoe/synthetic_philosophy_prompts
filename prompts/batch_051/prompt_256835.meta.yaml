  \ rationally required. By moral trade I mean the practice of two agents with different\
  \ or even incompatible moral views exchanging actions rather than arguments — each\
  \ doing something the other values more, in exchange for the other doing something\
  \ they value more. For instance, if I care intensely about one cause and only mildly\
  \ about another while you have the reverse weighting, we can each act disproportionately\
  \ for the other's cause and both end up having produced more of what we each value\
  \ than we could have produced by acting alone. The position I now hold is that refusing\
  \ such a trade, when no independently impermissible act is involved, is usually\
  \ a failure of instrumental rationality — a kind of moral fastidiousness that keeps\
  \ one's hands clean at the cost of doing less of what one actually claims to value.\n\
  \nWhat I want is an honest map of the position's exposure: what would have to be\
