  "I am a sixth-form student preparing for a philosophy essay competition, and I want
  to think properly about virtual worlds before I read any of the usual theories.
  The question that interests me is whether virtual objects are real and whether virtual
  harms are real harms. Every discussion I have seen picks one vivid case and then
  leaps to a general conclusion, which usually depends on whichever case was picked.
  I want the full specification first.


  Act as a professional philosopher who works on metaphysics and the ethics of virtual
  worlds. Think carefully, and begin by brainstorming a range of puzzling cases and
  candidate positions before you commit to the list.


  Write the desiderata: what any adequate theory of the reality of virtual objects
  and the seriousness of virtual harms has to deliver. Set the purpose yourself, but
  let it be this: a theory good enough to guide ordinary reasoning about whether we
  should treat losses inside virtual worlds as genuine losses and harms inside virtual
  worlds as genuine harms — not primarily a theory of what the law should say. For
  each requirement, give the case or consideration that makes it a requirement, and
  say whether it is non-negotiable or merely one camp''s preference. Please use cases
  like these, plus others of your own: an item in a massively multiplayer game that
  is deleted by a server bug after the owner spent months earning it; a virtual replica
  of someone''s childhood home that disappears when the company shuts down the server;
  a fraudulent trade in which one player takes another player''s rare item through
  a scam; a sexual assault on a player''s avatar in a social virtual-reality space;
  a 400-hour single-player save file that is corrupted; and a griefer repeatedly vandalising
  a virtual war memorial maintained by a bereaved community. A good theory should
  handle these without collapsing distinctions.


  In particular, I need to know:

  1. Which distinctions a theory cannot collapse (for example, virtual object versus
  representation, item versus copy, harm to the player versus harm to the avatar,
  harm versus mere offence, existing object versus fictional object).

  2. Whether some of these desiderata are jointly unsatisfiable — if so, say which
  pair and why, because I suspect the list itself is a result.

  3. Which single requirement does the most work in excluding the obvious candidate
  theories.

  4. Optionally, how the main candidate positions would score against the list in
  one or two sentences each, but keep most of the weight on the criteria.


  Start your response with your bottom line in the very first sentence: the requirement
  you would most defend and which candidate it rules out, or the overall verdict that
  best survives the cases. Then give the reasoned list. No preamble, no restating
  of the question."


