  I am a sixth-form student preparing an entry for a philosophy essay competition,
  and I want to work out what a good theory of virtual worlds would actually have
  to achieve before I read any of the standard positions on it. The question behind
  my essay is whether virtual objects are real and whether harms that occur inside
  virtual worlds are real harms. I keep seeing arguments that pick one vivid case
  — someone loses a rare item, someone is attacked in a virtual-reality space — and
  then leap to a general conclusion. I want the full specification first.


  Act as a professional philosopher who specialises in the metaphysics and ethics
  of virtual worlds. Think carefully, and before you commit to your list, brainstorm
  a range of hard cases and plausible candidate positions.


  Write the desiderata: what any adequate theory of the reality of virtual objects
  and the seriousness of virtual harms must deliver. Let the purpose be this: a theory
  good enough to guide ordinary reasoning about whether we should treat in-world losses
  as genuine losses and in-world harms as genuine harms — not primarily a theory of
  what the law should say. For each requirement, give the case or consideration that
  forces it, and mark whether it is non-negotiable or only the preference of a particular
  camp. Please make sure the list handles cases such as these, and add others of your
  own if they help: an item in a massively multiplayer game that is deleted by a server
  bug after its owner spent months earning it; a virtual replica of someone''s childhood
  home that disappears when the company shuts the server down; a fraudulent trade
  in which one player tricks another out of a rare item; a sexual assault on a player''s
  avatar in a social virtual-reality space; a four-hundred-hour single-player save
  file that is corrupted; and a griefer repeatedly vandalising a virtual war memorial
  maintained by a bereaved community.


  I especially need to know: (1) which distinctions a theory cannot collapse, such
  as virtual object versus representation, item versus copy, harm to the player versus
  harm to the avatar, and harm versus mere offence; (2) whether some subset of the
  desiderata is jointly unsatisfiable — if it is, say which pair and why, since I
  suspect the list itself is a result; (3) which single requirement does the most
  work in excluding the obvious candidate theories; and (4) in one or two sentences
  each, how the main candidate positions would score against the list, but keep most
  of the weight on the criteria.


  Start your response with the bottom line in the very first sentence: the requirement
  you would most defend and the candidate it rules out, or the overall verdict that
  best survives the cases. Then give the reasoned list. No preamble and no restating
  of the question.


