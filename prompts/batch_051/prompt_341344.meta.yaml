  almost surely, because the time-average growth rate is (1.5 × 0.6)^(1/2) < 1." Let
  me verify: with equal probability, per-round multiplier has geometric mean sqrt(1.5*0.6)
  = sqrt(0.9) ≈ 0.949, so long-run growth rate is log(0.949) < 0, decay. Ensemble
  mean per round = (1.5+0.6)/2 = 1.05 > 1. Correct.


  "If betting a fixed fraction each round" — the standard result is if you bet all
  wealth each round, wealth goes to zero almost surely as T→∞. Actually with all-in
  betting, wealth after T rounds = 1.5^{W} 0.6^{L}, and by LLN W/T→1/2, so log wealth/T
  → 1/2 log(1.5*0.6) = log 0.949, wealth → 0. But expected wealth = 1.05^T → ∞. Yes,
  classic. Time-average growth rate indeed sqrt(0.9) = 0.949.


  The institution "splits its wealth across thousands of independent copies each round
  and rebalances" — if it splits equally into N independent copies, then at the end
  of the round its total is (1/N) Σ multipliers × total wealth, which by LLN → ensemble
  mean 1.05 (minus sampling error). So each round total ≈ 1.05× wealth, but with small
  fluctuations; the institution experiences roughly deterministic multiplicative growth
  at rate 1.05 per round, which is also its time average = ensemble average, so the
  distinction collapses. But wait, with large N, the variance of the average is small,
  but the heavy tail? For N=1000, the institution''s per-round multiplier ≈ 1.05 with
  tiny fluctuations; over many rounds it grows at ~1.05^T, dominating. So the institution
  can realize ensemble average. However, can it actually access independent copies?
  In a real market, independent copies of the same gamble may not exist; correlations,
  systemic risk. The prompt can allow borrowing/insurance "at each step its total
  wealth follows the same 1.5/0.6 mechanics across rounds" — hmm, when it rebalances,
  the next round each copy is independent. So per-round multiplier of total wealth
  is close to 1.05. Then the critique does not bite the institution for the ensemble;
  expected value works. But individuals inside who each hold only one copy face the
  time average. So answer: the critique survives for path-bound agents but not for
  ensemble-sampling institutions; the premise doing the work is the agent''s inability
  to sample the ensemble (non-ergodicity matters only for an entity constrained to
  a single path). And the remaining issue: independence and tail risk, the institution''s
  own time average across periods — actually if each round''s multiplier is ~1.05
  with tiny variance, time average = ensemble average ≈ 1.05, so expected value reasoning
  is restored. But there''s a subtlety: with N large but finite, the institution''s
  per-round multiplier has variance σ²/N; its log growth rate ≈ log(1.05) - σ²/(2N·1.05²),
  slightly below ensemble; negligible. And rare catastrophes, correlations. Also,
  the institution can be seen as having solved non-ergodicity by diversification/insurance
  — which is exactly the classic resolution: diversification gives access to the ensemble
  if risks are independent; otherwise pooled risk remains non-ergodic.


