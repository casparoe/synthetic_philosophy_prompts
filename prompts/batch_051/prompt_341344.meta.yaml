  Ergodicity prompt draft:


  "Consider the ergodicity critique of expected-value reasoning. In a multiplicative
  gamble repeated over time — say, each round you either gain 50% or lose 40% with
  equal probability — the per-round expected value is positive, but the wealth of
  a single agent who bets a fixed fraction each round decays almost surely, because
  the time-average growth rate is (1.5 × 0.6)^(1/2) < 1. The critique concludes that
  a single agent confronting such gambles over time should maximize the time-average
  (logarithmic or geometric) growth rate, not the ensemble-average expectation, and
  that standard expected-value reasoning is misleading for non-ergodic dynamics.


  Now suppose the decision-maker is not a lone individual but a large, long-lived
  institution that each round can split its wealth across thousands of independent,
  identically distributed copies of the gamble, rebalancing its portfolio of copies
  at the start of each round; it therefore effectively realizes the ensemble average
  each period (up to small sampling error). It can also borrow or insure, but at each
  step its total wealth follows the same 1.5/0.6 mechanics across rounds.


  Does the ergodicity critique survive this change? Specifically: is the institution
  now rationally permitted, or required, to maximize expected value per round rather
  than the time-average growth rate of its total wealth? If the critique still applies,
  identify which premise does the work — the non-ergodicity, the multiplicative dynamics,
  the finite lifetime, the inability to sample the ensemble, or something else — and
  say whether the argument has to be restated rather than abandoned. If the critique
  does not apply, explain whether that vindicates expected-value reasoning, or whether
  it only shows that a sufficiently diversified institution is a different kind of
  object from the individual the critique was aimed at, with the critique untouched
  for the individuals inside it who each live one path."


