  Moral luck debate: Nagel claims there are four kinds: resultant (outcome), circumstantial,
  constitutive, causal. The "problem" is that we blame/praise people for things beyond
  their control. Kantian control principle says people are morally assessable only
  to the extent that what they''re assessed for depends on factors under their control.
  Yet our practices of blame, punishment, gratitude, resentment track outcomes and
  other unchosen facts. So either our practices are irrational or the control principle
  is false.


  The stalled debate: Some (Kantians, legal moralists) think outcome shouldn''t affect
  blame but does due to epistemic limitations (we can''t know intentions without outcomes
  as evidence). Others think outcome luck matters intrinsically to how much blame
  is appropriate. Still others (Williams) think the whole aspiration to eliminate
  luck from ethics is misguided; ethics is about how to live, not about a courtroom
  of desert. And some (Strawson?) reactive attitudes are sensitive to outcome.


  What kind of disagreement? Could be:

  - verbal: two senses of "blame" — blame as moral grading (should be control-insensitive)
  vs blame as a social practice/reactive attitude (legitimately outcome-sensitive).
  Both sides use "blame" to mean different things.

  - normative: two different theories of responsibility.

  - different purposes: backward-looking desert vs forward-looking social regulation
  vs expressive significance of life (Williams).

  - different "data": the Kantian''s data are judgments about culpability in pair
  cases; the Williams-style side''s data are the phenomenology of agent-regret and
  the meaning of one''s life.

  - bedrock intuitions about control: whether moral worth can depend on chance at
  all.


