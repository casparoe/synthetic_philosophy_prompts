  Draft final:


  I have been trying to get to the bottom of an asymmetry in how ordinary judgement
  and anti-discrimination law treat different grounds of selection, and I would like
  the strongest case for the distinction, or an honest conclusion that it cannot be
  defended.


  An employer who refuses to hire someone because of her race, sex, religion, or age
  is generally regarded as having done something seriously wrong and, in many jurisdictions,
  something unlawful. An employer who refuses to hire someone because she has a strong
  regional accent, is left-handed, is short, has a weak handshake, or supports a rival
  football club is usually regarded as exercising ordinary managerial discretion,
  even when the trait is irrelevant to the work and the decision rests on a rough
  stereotype. I am trying to determine whether the line between these two classes
  tracks anything principled rather than a historically path-dependent list.


  The familiar candidate criteria strike me as having been built backwards from the
  list. Irrelevance to the job would make nearly every ground of selection suspect,
  including taste in music or the school one attended. Immutability would include
  left-handedness and height but exclude religion and much of age, both of which are
  protected. Historical subordination would cover many protected grounds but not,
  straightforwardly, age or religion; and it would force the question why a newly
  stigmatised group should have to wait for the list to catch up. Choice will not
  do either, since religion is chosen and protected while handedness is not chosen
  and unprotected.


  So my question is this: is there a defensible criterion, or combination of criteria,
  that draws the boundary in roughly the right place and that also decides hard cases
  rather than merely gesturing at them? The hard cases I have in mind are left-handedness,
  obesity, a heavy regional or foreign accent, a surname strongly associated with
  a particular ethnic or national group, political affiliation, smoking status, and
  being unusually good-looking. If no such criterion can be specified, should we conclude
  that the distinction between suspect and non-suspect grounds is itself unjustified,
  and that the law should instead impose something like a general requirement that
  selection turn only on traits shown to be relevant to the task? I would rather be
  given a criterion that does real work than a list I have merely inherited.


