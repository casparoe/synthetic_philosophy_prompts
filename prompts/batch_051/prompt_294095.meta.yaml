  I keep coming back to an asymmetry in how we treat different grounds of selection,
  and I would like the strongest possible justification for it, or an honest statement
  that there isn''t one.


  An employer who refuses to hire someone because of her race, sex, religion, or age
  is generally thought to have done something seriously wrong and, in most jurisdictions,
  unlawful. An employer who refuses to hire someone because she has a regional accent,
  is left-handed, is short, gives a weak handshake, or supports a rival football club
  is generally thought to be exercising ordinary managerial discretion, even when
  the trait is irrelevant to the job and the decision rests on little more than a
  rough stereotype. I want to know whether anything principled separates the two columns.


  The familiar candidate criteria look to me as if they rationalise the existing list
  rather than predict it. Irrelevance to the job would make almost every proscribed
  ground of hiring suspect. Immutability would include left-handedness and height
  but exclude religion, which is protected, and much of age, which is also protected.
  Historical subordination would cover many of the listed grounds but not straightforwardly
  age or, on some accounts, religion; and it would force the question of why newly
  stigmatised groups must wait for the list to catch up. Choice does not work either,
  because religion is chosen and protected, while handedness is not chosen and unprotected.


  So my question is this. Is there a defensible criterion—or combination of criteria—that
  draws the line in roughly the right place, and that also decides the hard cases
  instead of gesturing at them? The hard cases I have in mind are left-handedness,
  obesity, a heavy regional or foreign accent, a surname strongly associated with
  a particular ethnic or national group, political affiliation, smoking status, and
  a candidate''s being conspicuously attractive to the person doing the hiring. If
  no such criterion can be specified, should we conclude that the legal distinction
  between suspect and non-suspect grounds is itself unjustified and should be replaced
  by something like a general rule against selection on traits shown to be irrelevant
  to the task? I would rather have a criterion that does real work than a list I merely
  inherit.


