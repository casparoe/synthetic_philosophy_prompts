  Argument:


  (1) If I have a duty to rescue a drowning person when I can do so at small cost,
  that duty rests on the badness of the person''s death being a reason sufficient
  to constrain my pursuit of my own interests.

  (2) In a lifeboat shortage, the badness of each excluded person''s death is the
  same kind of reason as in the drowning case.

  (3) In the lifeboat shortage, no one is required to give up their own place for
  strangers.

  (4) If no one is required to give up their own place for strangers, then the badness
  of the strangers'' deaths is not a reason sufficient to constrain the pursuit of
  personal survival.

  (5) So the reason that grounds easy rescue is not sufficient in lifeboat cases.

  (6) Therefore, either easy rescue is not actually required, or lifeboat triage is
  not actually excusable. Since lifeboat triage is excusable, easy rescue is not required.
  This proves too much.


