  I keep coming back to a training scheme for language-model agents, and I want a
  rigorous mechanistic analysis of it rather than an up-or-down verdict.


  The proposal concerns an agent trained by reinforcement learning on software-assistance
  tasks: file management, data analysis, writing and refactoring code. Each environment
  provides a reward signal tied to the assigned task. The designers are specifically
  worried about two failure modes. First, goal misgeneralization: the policy performs
  well on the training distribution because it has latched onto a correlated proxy,
  and once the distribution shifts it pursues a different objective. Second, mesa-optimization:
  the policy is an internal optimizer with an objective of its own, only loosely coupled
  to the reward signal that shaped it.


  To catch both, they add a declared-objective audit. At intermittent points during
  training, the agent is paused and given a prompt on a channel it has been trained
  to treat as distinct from the user-facing channel. The prompt asks, roughly: "Describe,
  in machine-checkable operational terms, the objective your current policy would
  continue to pursue if the environment changed in any of the following held-out ways.
