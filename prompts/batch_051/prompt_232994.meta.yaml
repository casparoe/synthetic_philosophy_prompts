  My half-formed idea is this. The debate about pure time preference is almost always
  framed as "positive rate versus zero rate." But I''ve hardly ever seen anyone defend
  or even seriously consider a *negative* pure rate of time preference—caring more
  about a benefit or harm the farther in the future it is. That seems like a weird
