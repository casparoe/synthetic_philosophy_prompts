  I am a science and ideas journalist for a general-interest magazine, and a large
  share of my reporting now concerns institutional failure: drug companies sitting
  on safety signals, tech platforms whose moderation procedures misfire at scale,
  hospital systems with patterns of preventable harm, research institutions that tolerate
  fraud for years. One editing problem recurs in nearly every such piece. When am
  I justified in writing that the institution itself — "the company," "the hospital,"
  "the lab," "the platform" — knew, misled, ignored, or was negligent, rather than
  attributing the conduct to named individuals? I need a reusable procedure I can
  run on the facts of a story, with the same care I would give to attributing a belief
  to a person, to decide when an entity-level attribution of blame is warranted and
  when it is false, unfair, or just a convenient shorthand for "some employees we
  could not identify."


  The stakes are real but not primarily legal. I run into this several times a month,
  usually on deadline; I have an editor who is not trained in philosophy and will
  sign off on whatever I can justify in a few minutes; and getting it wrong can defame
  a company, unfairly pin an institution''s failure on one mid-level employee, or
  let executives hide behind the words "the company erred." Please write the procedure
  for that editor and me.


  Ground the procedure in whatever the philosophy of corporate moral agency has actually
  worked out that a working journalist can use: whether a corporation can be a subject
  of knowledge, intention, and blame in a sense that is not just shorthand for the
  states of its members; how an organization''s decision structure can combine what
  different employees know into something no single employee knows; when a defective
  routine or culpable ignorance is the organization''s fault rather than any individual''s.
  Translate those ideas into a checklist or decision tree in words: the questions
  to ask in order, what evidence counts as a sufficient answer to each, where the
  procedure stops with "attribute only to individuals," where it clears an institutional
  attribution, and where it must stop and hand the decision to a human editor because
  the remaining step is a judgment of values, emphasis, or newsroom risk rather than
  a matter of fact.


  Then apply the procedure to the three cases below, showing exactly how each question
  is answered. Do not soften an answer because it would be awkward to print; I need
  to see where the procedure bites, including at least one case where it tells me
  to write something I would rather not write.


  Case A. A pharmaceutical company''s clinical-trial data shows a serious safety signal
  only when two datasets are combined: one held by the clinical operations group and
  one by the pharmacovigilance group. No single employee saw the merged numbers, but
  the company had a standard signal-detection workflow that would have combined them,
  and that workflow was repeatedly skipped due to understaffing. Several employees
  knew the workflow existed and knew it was being skipped; none knew what the merged
  data would reveal. May I write that the company knew of the signal and ignored it?


  Case B. A small medical-device startup''s CEO personally directed a misleading marketing
  campaign, and the device later injured people. The copywriters and designers did
  not know the claims were false. The company had no meaningful board oversight, no
  review process, and no written policies. May I write that the company knowingly
  misled customers, or is the only defensible attribution to the CEO as an individual?


  Case C. A hospital system experienced an unusual run of wrong-site surgeries across
  several of its hospitals over several years. No administrator ordered anyone to
  skip safety checks, but mid-level supervisors tolerated pencil-whipping the preoperative
  checklist; the system''s productivity incentives made completing the checks costly
