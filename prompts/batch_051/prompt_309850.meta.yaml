  Good''s theorem in its pure form: For any decision problem and any cost-free observation,
  the expected value (in terms of maximum expected utility) after observing is at
  least the prior max EU. Formally E[max_a E[u|X]] ≥ max_a E[u]. This holds because
  for any prior-optimal action a0, E[max_a E[u|X]] ≥ E[E[u|X, a0]] = E[u]. It holds
  regardless of how X is generated, as long as X has a well-defined joint distribution
  with the payoff-relevant state and the agent correctly conditions. So even if a
  recommender adversarially selects what to show, the observation "the recommender
  selected this item this way" is just X, and the theorem holds. So the theorem survives
  selection. Where it breaks: (1) information is not free — attention/time are scarce,
  and the feed consumes them, so the real decision is not just whether to "accept"
  the info but to spend attention. (2) The agent may not process the signal as a signal;
  framing manipulates preferences/affect, not just beliefs, or induces system-1 reactions
  that overwhelm Bayesian updating. (3) The platform can change the agent''s utility
  function (addiction, preference formation), not just beliefs — the theorem assumes
  stable utilities. (4) Bounded rationality: the agent can''t compute the posterior
  or ignore the info effortlessly; actually "free" includes no deliberation cost.
  (5) The platform may show you information correlated with your future opportunities
  or constrain future information (filter bubble) — but a full Bayesian would still
  condition.


