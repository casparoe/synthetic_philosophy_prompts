  In discussions of why some nations are rich, I have repeatedly encountered the claim
  that the best evidence for the institutions-first view comes from "natural experiments":
  the two Nogaleses on either side of the U.S.–Mexico border, the two Koreas, and
  the regions on opposite sides of the former Habsburg and Ottoman frontiers. The
  argument treats these borders as if they were an instrument of randomization in
  a clinical trial. Geography, disease environment, and something like "deep culture"
  are said to be held roughly constant on both sides of the line, while the bundle
  of political and economic institutions differs; the observed gap in long-run prosperity
  is then read as the estimated effect of inclusive versus extractive institutions,
  just as a difference in outcomes between treatment and control arms in a drug trial
  is read as the effect of the drug. This picture does enormous argumentative work,
  because it licenses the strong conclusion that institutions, rather than geography
  or culture, are the dominant cause of national wealth, and that this can be seen
  cleanly, without the usual problem of comparing countries that differ in every way
  at once.


  I would like you to audit this analogy. First, give the mapping explicitly: what
  corresponds to the treatment, the assignment mechanism, the control condition, the
  trial population, and the outcome measurement. Then identify where the mapping breaks
  down — in particular, the respects in which a border does not deliver what random
  assignment delivers, such as the non-random placement and postwar redrawing of borders,
  the fact that the "treatment" is an indivisible bundle of institutions that arrive
  together with legal traditions, bureaucracies, and property rights, the movement
