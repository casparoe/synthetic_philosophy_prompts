  "I am currently taking a course in the philosophy of space and time, and I keep
  coming back to a tension I cannot resolve. On the one hand, I find myself strongly
  attracted to relationism: the view that space and time are nothing over and above
  the network of spatial and temporal relations among material bodies. It seems to
  me the only view that fully respects the principle that we should not multiply entities
  beyond need, and it avoids the epistemic embarrassment of positing a substance that
  underlies all motion and yet cannot be observed directly. Leibniz''s arguments have
  real force for me: if the entire material world were shifted three feet to the left,
  nothing in the relations among bodies would change, so a substantivalist seems forced
  to admit a distinction without an observable difference. And yet, I cannot shake
  the intuition at the heart of Newton''s bucket. If a bucket of water hangs by a
  rope, is twisted, and is then released, the water begins by remaining flat, then
  gradually climbs the sides as the relative rotation between bucket and water is
  greatest? No—actually the surface becomes concave exactly when the bucket and water
  are at rest relative to each other, and it is flat when they rotate relative to
  each other. There seems to be a fact about whether the water is rotating, a fact
  that is not captured by any relation between the water and the bucket. Newton says
  the water rotates with respect to absolute space. When I imagine a universe containing
  nothing but a single spinning bucket, my intuition is that it still makes sense
  to say it is spinning, even though there are no other bodies to relate it to. Mach''s
  reply—that the concavity is caused by the water''s relation to the distant fixed
  stars, and that in an empty universe it would remain flat—strikes me as ingenious
  but I also find it almost perverse: it makes local inertial effects depend on the
  distribution of matter across the universe, and I cannot see how that dependence
  would work mechanically. I am not asking which side is right. I want to understand
  what it would take for the bucket intuition to be something I should give up, what
  it would take for relationism to be the thing that gets amended or abandoned, and
  whether there is a version on which both my parsimony and my conviction that rotation
  is not merely relative can be preserved without invoking an unobservable container.
  Walk me through the costs of each move."


