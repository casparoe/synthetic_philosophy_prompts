  cannot be both obligated; apparent dilemmas are conflicts of prima facie duties
  resolvable by an all-things-considered duty (Ross).

  - Proponents: genuine dilemmas exist (Williams "Ethical Consistency"; Marcus, Lemmon,
  van Fraassen, Gowans); support from moral remainders/regret, guilt, and the rational
  appropriateness of self-reproach even when one did the best possible.

  - Key distinctions: prima facie vs all-things-considered; epistemic vs ontological
  dilemmas; resolvable conflicts vs irresolvable; moral remainders; incommensurability
  of values; whether "ought" implies "can" is rejected.


