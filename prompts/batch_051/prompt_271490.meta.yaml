  The philosophical theory: Ranke''s methodological objectivity (primary sources,
  critical method, eschew moralizing, show "how it actually was"), Carr''s skepticism
  (facts are selected and constituted by the historian; history is a dialogue between
  present and past; the historian is part of the present context), and Hayden White''s
  narrativist skepticism (historiography imposes plot structures — tragedy, comedy,
  romance, satire — that are not in the events; historical narrative is a literary
  artifact; the form itself carries ideology). The conceptual work: translating "objectivity"
  from an epistemic ideal into an editorial procedure — what can survive, what can''t.


  The procedure should include questions in order:

  1. Are the constituent factual claims sourced to primary evidence and accurately
  rendered? (Ranke''s floor)

  2. Has the draft selected its facts in a way that silently excludes well-documented
  countervailing events? (Carr''s selection problem)

  3. Is the narrative''s plot structure doing argumentative work — e.g., a tragedy
  whose ending is framed as inevitable — and is there evidence for the plot as opposed
  to chronology? (White''s emplotment)

  4. Are there competing available emplotments of the same events that would be at
  least as well supported? If so, does the text acknowledge them?

  5. Where does the narrative''s "moral" (presentist agenda) leak in?

  6. Which decisions are value judgments and cannot be eliminated?


