  ---


  I have been unable to decide whether a parallel I keep noticing between two fields
  is a real structural identity or just a metaphor doing all the work. I would like
  you to adjudicate.


  In paleontology, the fossil record is a nonrandom sample of past life. An organism
  must be buried, survive decay, lie in rock that survives erosion, and then be found
  and collected. The result is a systematic bias toward hard-shelled, shallow-marine
  creatures and against soft-bodied or upland ones. Researchers know this and try
  to distinguish an absence in the record from an absence in the world.


  In the study of archives, something similar seems to happen. A person or event must
  leave a written trace, the trace must be kept, it must survive loss or destruction,
  and it must eventually be selected, catalogued, and made available. The result is
  a systematic bias toward the literate, the propertied, and the institutionally powerful,
  and a silence around people who left no records or whose records were not kept.


  The parallel I want tested is that these are, structurally, the same problem: inferring
  the shape of an underlying population from a sample that has passed through multiple
  correlated filters of preservation and selection. The strong version of the claim
  is that the stages match up one-to-one — initial production, survival, later selection,
  discovery — and that methods for correcting bias in one field should have informative
  counterparts in the other. The weak version is just that both can be described with
  the same vocabulary of bias and silence.


  The main reason I hesitate is agency. A trilobite does not choose to be preserved,
  but people and institutions do choose — or are pressured — to record some things,
  omit others, destroy files, and redact. I cannot tell whether that is a deep disanalogy
  in the structure of inference or simply one more filter, different in cause but
  identical in the problem it creates for whoever comes later.


  Please structure your answer in four sections:

  - "The mapping" (~150 words): state the analogy precisely, stage by stage, and say
  what would have to be true for the strong version to hold.

  - "Where it holds" (~200 words): the respects in which the two inference problems
  really do share the same structure.

  - "Where it breaks" (~250 words): the respects in which they come apart, with particular
  attention to agency, intention, and whether silence means the same thing in both
  fields.

  - "Verdict" (~100 words): whether this is a genuine identity of structure, a loose
  analogy, or a confusion, and what the parallel is and is not good for.


  In the verdict, please include how confident you are in the overall assessment and
  single out the specific point you are least sure about.


