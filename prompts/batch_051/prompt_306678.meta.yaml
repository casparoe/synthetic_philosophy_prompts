  Map to systems:

  - A performative utterance = a message that changes state in a social system by
  virtue of the message being sent, rather than reporting a state.

  - Constative = read-only query, truth-valued; truth/falsity vs. felicity/infelicity.

  - Felicity conditions = preconditions/invariants + auth + schema validation.

  - Misfire = transaction aborts / exception before commit (the act doesn''t take
  effect).

  - Abuse = committed but violates a semantic constraint (e.g., bad faith, like a
  transaction completing with a false premise).

  - Uptake = acknowledgment / the message must be delivered and parsed; consensus
  that the operation is applied.

  - Illocutionary force = the operation type (opcode) of the message.

  - Perlocutionary effect = side effects outside the replicated state machine (psychology
  of the recipient), not specifiable in the protocol.

  - Authority/standing = write permissions granted by an identity/role in a smart
  contract; but social authority isn''t a mere capability token.

  - Social institution = the state machine / contract that defines valid transitions
  (marriage registry, property title).

  - Explicit performative = a signed message with an explicit operation code; implicit
  = event-sourced updates inferred from state change.

  - Sincerity conditions = no counterpart in code except perhaps oracle attestation;
  code can''t enforce mental states.


