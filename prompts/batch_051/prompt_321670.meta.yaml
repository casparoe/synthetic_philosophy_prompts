  Supererogation: acts that go beyond duty — morally good but not required; omission
  not blameworthy (not wrong). Classic examples: heroism (soldier throwing himself
  on grenade), saintliness (donating a kidney to stranger), small favors. Key issues:

  - The traditional "threefold" classification of actions: obligatory, permissible
  (including supererogatory?), forbidden. Actually the classical deontic categories:
  obligatory, merely permissible (neutral), supererogatory, forbidden. Some frameworks:
  permitted = not forbidden; supererogatory are a subset of permissible that are praiseworthy
  to do and not blameworthy to omit.

  - Conditions often cited (Urmson, etc.): (1) optional, (2) beyond duty, (3) morally
  good/praiseworthy.

  - Tension with utilitarianism/consequentialism? Utilitarianism seems to have no
  room for supererogation because if an act maximizes utility it''s obligatory, if
  not it''s wrong—so the only acts that would be "supererogatory" are ones that maximize
  utility, but then utilitarians must say they''re required. This is a standard objection:
  utilitarianism can''t accommodate supererogation. But careful: some consequentialists
  (satisficing, Scheffler''s agent-centered prerogatives) make room; rule-utilitarians
  maybe.

  - The "paradox of supererogation": if an act is morally best, how can it be optional?
  The best act seems to be the one we ought to do. Hmm, the paradox: supererogatory
  acts are morally good but not required; yet if they are better than what duty requires,
  then why aren''t they required? This is a known puzzle.

