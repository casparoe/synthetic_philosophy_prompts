  the fact: they form part of the process that produces the answer—they are causally
  upstream of it. Hence the visible chain gives us, if not the model''s complete reasoning,
  at least a faithful trace of the reasoning it actually performed; the model cannot
  be hiding anything, because there is no separate private workspace behind the tokens.


