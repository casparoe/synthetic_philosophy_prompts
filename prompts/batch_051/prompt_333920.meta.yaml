  Frankfurt cases (Harry Frankfurt, 1969, "Alternate Possibilities and Moral Responsibility").
  PAP: A person is morally responsible for what they did only if they could have done
  otherwise. Frankfurt aims to show PAP is false: an agent can be morally responsible
  even if they couldn''t have done otherwise. The standard case: Jones decides to
  kill Smith. Black, a neurosurgeon (or "counterfactual intervener"), wants Jones
  to kill Smith. Black has implanted a device in Jones''s brain that will be activated
  only if Jones shows some sign of deciding not to kill Smith; if activated, the device
  causes Jones to decide to kill Smith. But Jones decides on his own to kill Smith,
  without the device activating. So Jones couldn''t have done otherwise (the device
  ensured that), yet he is morally responsible because he acted on his own decision.
  Thus PAP is false.


  Complications: Frankfurt cases are meant as counterexamples to PAP (that alternative
  possibilities are necessary). There''s a huge literature: the "flicker of freedom"
  strategy (Fischer), which says even in Frankfurt cases there''s some alternative
  possibility (e.g., the sign preceding the decision), a "flicker," but not robust
  enough for responsibility. Others deny Jones is responsible because his action is
  overdetermined. The "dilemma defense" (Kane, Widerker, Ginet): either the device
  is triggered by a prior sign that reliably indicates the agent will decide wrongly
  (determinism), in which case the case doesn''t show what it needs, or there is no
  such sign and the intervener must intervene based on the agent''s own decision,
  which presupposes... This is the "indeterministic world" problem. There''s also
  "sourcehood" vs "alternative possibilities": actual-sequence views, Frankfurt''s
  own "wholehearted identification" hierarchical view? But Frankfurt cases are about
  responsibility requiring actual causal source, not alternative possibilities.


