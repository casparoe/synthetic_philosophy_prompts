  with experience. Actually "satisficing" itself is a named concept (Herbert Simon).
  The "name" prompt asks to describe a phenomenon and ask whether it has a name. We
  could describe something adjacent but distinct from satisficing: e.g., a decision
  rule where people set an aspiration level, and when they can''t meet it they lower
  it (or when they meet it too easily they raise it). In the literature, aspiration-level
  adaptation is part of Simon''s satisficing; but there''s a specific phenomenon:
  "melioration"? "Matching law"? "Aspiration adaptation"? Simon''s satisficing involves
  search until a satisfactory option is found; aspiration levels adjust dynamically.
  Could ask: "I''ve noticed... is there a name for the specific phenomenon where the
  bar moves..." A good answer would distinguish satisficing, aspiration adaptation,
  anchoring, hedonic treadmill/expectation adaptation. This fits type C well and domain
  satisficing/bounded rationality. The asker describes a concrete pattern without
  using the technical term "satisficing" — that would give it away. That could be
  good.


  But note the instructions say the asker describes in their own words a pattern and
  asks whether there''s an established concept. We could have the asker be someone
  who notices "when people choose, they don''t compare everything; they search until
  they find something good enough, and the ''good enough'' bar moves depending on
  how easy the search is going." But "satisficing" is the obvious name; that''s maybe
  too easy. The prompt should be in the weeds. Could describe a subtler phenomenon:
  the adjustment of the aspiration level. E.g., in sequential search, people set a
  threshold; if nothing meets it after a while, they lower the threshold — not because
