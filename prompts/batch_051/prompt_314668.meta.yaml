  Prompt draft (final only, no preamble):


  "I''m preparing a diagnostic for a philosophy of biology course, and I want a ''which
  theory of biological function do you actually hold?'' sorting quiz. It should have
  eight to ten concrete cases, each with three or four answer options, phrased so
  students are choosing what to say about the case rather than choosing a label. Use
  at least these cases: (1) a heart that is congenitally incapable of pumping; (2)
  a novel mutation that happens to increase fitness in the current environment but
  has no history of selection; (3) a trait selected for thermoregulation that is now
  used only in courtship display; (4) a spandrel or by-product that later gets co-opted;
  (5) a trait produced by artificial selection; and (6) a component that contributes
  to a system''s self-maintenance only intermittently. The answer options should force
  the distinction between function as what something was selected for, function as
  what something currently does that explains the system''s capacities, function as
  contribution to self-maintenance, and a pluralist response. Include a scoring key
  that maps patterns of answers to named positions, and explicitly flag any pairs
  of positions that your questions cannot separate, plus any logically possible answer
  pattern that no one occupies and one sentence on why (incoherent, unattractive,
  or merely unexplored). The quiz should sort by cases, not by self-identification."


