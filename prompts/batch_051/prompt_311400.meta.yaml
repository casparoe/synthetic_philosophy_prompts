  difference between ordinary trust in a source and circular appeals to that source.
  I have encountered the terms easy knowledge and the bootstrapping problem, but I
  am still unsure how to apply them to concrete cases. Please rank the following five
  cases from least to most epistemically problematic, and give each a numerical score
  from 0 to 10, where 0 means a person may rely on the source with no independent
  evidence and 10 means the person needs fully independent evidence before relying
  on it.


  1. A student steps onto a brand-new bathroom scale three times, gets exactly 142.0
  pounds each time, and concludes that the scale is working properly.

  2. A friend reports several times that a mutual friend is upset; after two of those
  reports match the mutual friend’s easily observable behavior, the student concludes
  the friend’s reports are generally trustworthy.

  3. A person notices that his perceptual experiences have been coherent and useful
  in many ordinary situations, and concludes on that basis that his perceptual faculties
  are generally reliable.

  4. A historian treats the internal consistency and level of specific detail in an
  old document as evidence that the document is not a forgery.

  5. A textbook says on its first page that it is an authoritative source for the
  subject, and a student accepts that claim solely because the textbook says so.


