  "Hi — I''m a retired atmospheric scientist (aerosol chemistry mostly) who has fallen
  into philosophy late in life, and I''m trying to think clearly about solar geoengineering.
  I keep seeing the 1991 Mount Pinatubo eruption brought up as a natural experiment
  for stratospheric aerosol injection (SAI): the volcano put a big sulphate veil into
  the lower stratosphere, global mean temperature dipped by maybe half a degree for
  a couple of years, and the whole thing faded as the aerosols rained out. I''d like
  an analysis of that episode through the three worries that keep coming up in the
  philosophy side: moral hazard, termination shock, and the ''who decides'' problem."


  Then specifics:


  "For present purposes just take the facts as roughly these: Pinatubo was the largest
  stratospheric aerosol injection of the twentieth century (roughly 15–20 megatonnes
  of SO2), it wasn''t chosen by anyone, it cooled the planet noticeably for a year
  or two, and then the signal was gone once the stratosphere cleaned itself. I don''t
  need more volcano detail; treat it as nature running SAI once, then switching it
  off."


  Then the analytic request:


  "What I want: treat the eruption as a case study for the objections, in both directions.
  (1) Moral hazard — the worry that having a backup plan reduces mitigation. But here
  the ''backup'' wasn''t even a technology; it was a proof-of-concept handed to us
  by a volcano. Does a natural proof-of-concept have the same moral-hazard effect
  as a working technology, and what would have counted as evidence in the 1990s? (2)
  Termination shock — the worry that if you deploy SAI and then stop suddenly, you
  get rapid catch-up warming. Pinatubo didn''t stop ''suddenly'' because of politics;
  it ramped down smoothly on nature''s schedule. Does that make it a poor test of
  termination shock, or does it show something about the difference between a scheduled
  phase-out and an interrupted deployment? (3) Who decides — the eruption imposed
  a global intervention on everyone with no consent, no compensation, and no one to
  blame. Does that make consent look more or less central for the debate, and does
  it tell us anything about the ''free driver'' worry (a single state able to do it
  on the cheap)?"


