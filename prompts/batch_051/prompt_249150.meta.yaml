  Background: Jeffrey conditionalization (probability kinematics) handles uncertain
  evidence: when you have an observation that changes your probabilities over a partition
  {E_i} but doesn''t make any E_i certain, you update via:


  P_new(A) = Σ_i P_old(A | E_i) P_new(E_i).


  Rigidity: P_new(A | E_i) = P_old(A | E_i) for each E_i.


