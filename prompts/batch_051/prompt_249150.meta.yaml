  patch is red", Jeffrey conditionalization on the partition of perceptual experiences
  is supposed to avoid the problem of uncertain evidence. But there''s a subtlety:
  Jeffrey conditionalization on a partition where the E_i are themselves about the
  world (e.g., "the cloth is red", "the cloth is not red") and the new probabilities
  P_new(E_i) are derived from perception may double-count or fail rigidity.


