  Aristotelian syllogistic:

  - Deals with categorical propositions: All S are P, No S are P, Some S are P, Some
  S are not P.

  - Syllogisms: two premises, three terms, conclusion.

  - Subject-predicate form: every proposition is analyzed as a subject term and a
