  Actually relations like "x is larger than y," "some number is between any two primes"
  etc. are not representable in syllogistic because they involve more than one quantified
  term. The classic examples: "Every boy loves some girl" has two quantifiers and
  a relation; syllogistic can''t capture the difference between "every boy loves some
  girl" (∀x(Bx → ∃y(Gy ∧ Lxy))) and "some girl is loved by every boy" (∃y(Gy ∧ ∀x(Bx
  → Lxy))); also "there is some girl whom every boy loves" and "for every boy there
  is some girl that he loves" — the scope ambiguity.

  - Another limitation: statements with nested quantifiers, multiple generality. Frege''s
  quantifier-variable notation and function-argument analysis solved this.

  - Also the inferential power: syllogistic cannot express mathematically important
  inferences like "If a relation is transitive, then..." etc.


  Frege''s changes:

  - Invented the Begriffsschrift (1879), the first predicate calculus.

  - Replaced subject-predicate analysis with function-argument analysis.

  - Introduced quantifiers ∀ and ∃ (in his notation, the concavity), bound variables,
  so multiple generality becomes expressible.

  - Introduced a formal system with axioms and rules of inference — logic as a calculus.

  - The distinction between concept and object: concepts are functions from objects
  to truth-values.

  - Logicist project: reducing arithmetic to logic (Grundgesetze, 1893/1903).

  - Distinction between Sinn and Bedeutung introduced later (1892, "Über Sinn und
  Bedeutung") — that''s philosophy of language, not the core logic change from syllogistic.
  Could be a subtle student mistake: claiming Frege''s key change from syllogistic
