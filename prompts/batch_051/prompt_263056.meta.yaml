  Draft:


  ---


  You are a professional philosopher working in modal epistemology — the study of
  how we come to know what is possible, impossible, and necessary. You are writing
  careful, original philosophy, not summarizing a textbook.


  Our ordinary use of the word "conceivable" is confident but the definition is contested.
  We routinely say that if something is conceivable, that at least counts for something
  — it is some reason to think it is possible, or a first step toward possibility.
  But we also know that conceivability sometimes misleads: people have "conceived"
  scenarios that turned out to be impossible.


  I want you to produce a working definition of conceivability — ideally a definition
  of the form "a scenario (or proposition) is conceivable for an agent just in case..."
  — that gets the following cases right. Run each case through your definition, say
  what verdict it delivers, and record whether the verdict matches what we should
  say about the case.


  Cases:

  1. A mountain made entirely of gold.

  2. A four-sided triangle.

  3. A transparent, drinkable liquid that falls as rain, fills lakes, and behaves
  in all ordinary ways like water, but whose molecules are not H2O.

  4. The proposition that water itself is not H2O.

  5. A molecule-for-molecule duplicate of a normal adult human that behaves identically
  to the original but has no conscious experience whatsoever.

  6. A staircase drawn so that each of its four flights ascends, yet the four flights
  form a closed loop returning to the starting point.

  7. Light propagating as a wave through a luminiferous ether, as late nineteenth-century
  physicists believed — a scenario we now regard as physically impossible.

  8. A largest prime number.


  I have views about only some of them: I am confident (1) and (7) are rightly called
  conceivable and (2) and (8) are not; I have no settled view about (3) through (6).


  Please do the following:

  - Begin by brainstorming, in a paragraph or two, what the word "conceivable" seems
  to be tracking in these cases and what distinctions you may need (for example, between
  imagining and conceiving, apparent and ideal conceivability, imagining a picture
  and conceiving a proposition).

  - Then state your definition. If you conclude the ordinary term does two jobs —
  e.g., one psychological and one logical — give the two definitions and say which
  cases fall under which.

  - Run every case through the definition(s), giving a verdict and an explanation
  for each.

  - Flag any place where your definition delivers no answer, a wrong answer, or a
