  - Tell me which single verdict you are least secure about.

  - Finally, say what your resulting notion implies about conceivability as a guide
  to possibility: under what conditions, if any, is the conceivability of a scenario
  evidence for its possibility, and how does your definition sort the cases where
  conceivability is a trustworthy guide from those where it is not?


  Think carefully and be precise about the distinctions you draw. Do not give me dictionary
  definitions or a literature review; give me your best working account, tested against
  the cases.


