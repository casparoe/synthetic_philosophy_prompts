  Right, so I''ve spent too long reading about the liar paradox, and I want help diagnosing
  why the whole area seems stuck. Everyone agrees that a sentence which says of itself
  that it is false can''t just be treated as an ordinary truth-bearer under naive
  truth and classical logic — something has to go. But which something has been fought
  over for decades, and nobody has moved.


  There are, very roughly, three entrenched camps. The gappers say the liar is neither
  true nor false, and that we should give up bivalence or at least excluded middle.
  The glut camp say it is both true and false, and that we should drop explosion rather
  than tolerate the idea that a contradiction entails everything (dialetheism, if
  you want the jargon). Then there''s the classicist or hierarchist lot, who insist
  on keeping classical logic and instead stratify truth into levels or make it contextual.
  Each of these camps has formal frameworks that technically work in some sense, so
  the dispute can''t be settled simply by pointing at a contradiction.


  My working theory — and its honestly a guess — is that this isn''t a factual dispute
  about natural language, and it isn''t even a substantive dispute about the nature
  of truth. I suspect it''s about which core commitments each side treats as non-negotiable
  when a solution has to pay for itself: contradictions are never okay for the gappers;
  a fully transparent truth predicate is the point for the gluts; classical logic
  is sacrosanct for the classicists. But I keep flip-flopping between thinking the
