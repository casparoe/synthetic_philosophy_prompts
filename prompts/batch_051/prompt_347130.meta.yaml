  genuine moral motive, or the basis of all morality. People in the group use it to
  settle arguments about whether certain political positions are morally decent. But
  when I actually read Schopenhauer''s passage, he seems to be making a more local
  claim about the difference between actions done from duty and actions done from
  egoism: he argues that only when I act from the immediate wish to relieve another''s
  suffering, as opposed to from prudence or principle, does my action have moral worth.
  Nietzsche, in The Antichrist, then attacks almost the opposite idea: that making
  pity the center of ethics is a symptom of decline. I can''t tell whether the slogan
  is a trivial claim about motives, a substantive ethical theory, or a policy proposal.
  What precise claims could it be making? Which are platitudes, which are false, and
  which reading were the people in my group actually relying on when they used it
  to call a position ''heartless''?"


