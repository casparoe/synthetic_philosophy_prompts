  A friend and I spent a long evening arguing about a point in Galois theory, and
  I still cannot state cleanly where we disagreed. He kept insisting that the labels
  don''t matter. I had objected that when one writes √2 and −√2 it looks as if the
  algebra has already picked out one of the roots, when in fact the field Q(√2) by
  itself only knows the pair: the two roots are conjugate and an automorphism swaps
  them. He granted that, and said that this was exactly why the labels are arbitrary
  — any choice yields an isomorphic model, and anything you can say in one labeling
  you can translate to the other.


  The argument turned on whether there is a real question being skipped. I said that
  by the time you write √2 you have smuggled in an ordering from the reals or a choice
  of embedding into C, and that some constructions (the sign of a sum of roots, the
  orientation of a basis, the value of a continued fraction, or the branch of an algorithm)
  do depend on a labeling. He replied that those are just artifacts of the notation,
  and that every interesting property is invariant under permutations of the roots.
  We ended without agreeing.


  I suspect the one-liner "the labels don''t matter" is doing more work than it can
  bear, and that it compresses several different claims. I would like you to lay out
  the distinct precise claims this slogan could be making about roots and their labels
  — for example, claims about definability in the field, about automorphisms and symmetry,
  about transfer of results between isomorphic models, about what extra structure
  (an ordering, an embedding, a choice of branch, an enumeration) would be required
  before a label names more than an arbitrary distinguisher. For each claim, say whether
  it is trivial, plausible, or false, and say which one my friend''s argument actually
  needs. In particular, I want to know whether there is a defensible reading on which
  a choice of labels is never mathematically significant, or whether the slogan is
  only true when restricted to sentences preserved by the Galois group.


