  Standard solutions:

  1. Restricting omnipotence to the logically possible (Aquinas, C.S. Lewis, etc.).
  An omnipotent being cannot do the logically impossible; creating a stone so heavy
  that the omnipotent being cannot lift it is logically impossible if the being is
  essentially omnipotent. Actually more precisely: "a stone which an omnipotent being
  cannot lift" is a contradictory description relative to an essentially omnipotent
  being; so there is no such possible object.

  2. The "relational vs. intrinsic" or "definition of omnipotence" solution: omnipotence
  means the ability to bring about any possible state of affairs; the inability to
  lift a stone is not a state of affairs action; it''s a lack of power. Creating something
  and then lacking a power are distinct.

  3. The "bimodal/power-over-power" solution (Frankfurt? maybe): omnipotence includes
  the ability to do X at t1 and the ability to not do X at t2; the task is not to
  do both simultaneously. If God can create a stone at t1, and later choose not to
  lift it, that''s unproblematic; but literal "cannot lift" after creation... Hmm.

  4. The "temporary abandonment" solution: If God can give up omnipotence, then God
  can create the stone and then abandon the power to lift it; the paradox then turns
  on whether a being that is no longer omnipotent fails to lift. This preserves omnipotence
  as ability to bind oneself. But some reject because if omnipotence is essential?
  Anyway it''s a known move.

  5. The "Anselmian compossibility" solution: omnipotence is the power to do all that
  is possible for a maximally great being; some powers are not compossible, and omnipotence
  doesn''t require having every possible power simultaneously but having all powers
  consistent with perfection.

