  valid contexts of salvation/liberation; the Real (the Ultimate) is ineffable and
  religions are culturally conditioned responses; salvation is transformation from
  self-centeredness to Reality-centeredness. Pluralism is not relativism because it
  doesn''t say all claims are true or any path works; it holds they''re responses
