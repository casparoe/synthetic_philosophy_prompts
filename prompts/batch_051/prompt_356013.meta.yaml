  but may be applied to people who don''t explicitly know Christ (e.g., Rahner''s
  "anonymous Christians"; Vatican II''s Lumen Gentium: those who through no fault
  of their own do not know the Gospel but seek God and do good can be saved). So Christ
  is ontologically necessary but epistemologically not.

