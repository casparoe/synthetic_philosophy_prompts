  Let''s craft prompt:


  I run a community mediation practice in a city where coalitions keep trying to hammer
  out agreements between groups that hold genuinely incompatible values—think a mosque
  and a gay-straight alliance sharing a community center, or a hunting-rights group
  and a rewilding nonprofit on a land-use board. I recently had to mediate a dispute
  between two housing cooperatives over whether to ban meat in shared kitchens, and
  it got messy because both sides kept calling the same arrangement a "compromise"
  but meant wildly different things. I''m now convinced most people use "compromise"
  as a warm word for whatever they can get away with.


  Around the same time, I was reading John Morley''s *On Compromise*—I want to say
  it''s in the first or second chapter—and there''s a passage where he argues that
  political life, maybe all practical life, consists in the constant adjustment of
  claims that will never be reconciled, and that the person who treats every such
  adjustment as a betrayal mistakes the conditions under which ideals become anything
  in the world. I don''t remember the exact wording, but roughly he says that the
  choice is not between pure principle and pure corruption, but between different
  ways of dividing and adjusting. That passage made me think the interesting question
  is not whether to compromise, but what makes one compromise different from another.


  I''d like you to turn this into a procedure I can actually use. Not the Morley passage,
  but the underlying principle—that compromises between value systems can be genuinely
  better for both sides, not just a failure of nerve. Write me a reusable decision
  procedure for a mediator: questions to ask in order, what counts as a sufficient
  answer to each, where the procedure stops with a no, and where it hands the decision
  back to the parties because the question is one of values rather than technique.
  It should help distinguish a moral trade (both sides give up something they value
  less to get something they value more, so the joint agreement is strictly better
  than no deal by their own lights) from a corrupt compromise (one side is caving
  to power, or both are splitting differences in a way that leaves everyone more confused
