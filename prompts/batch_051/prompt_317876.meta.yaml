  changes rather than ad hoc patching. A programme that stays ''progressive'' on this
  index gets its grants renewed almost automatically; a programme rated ''degenerating''
  for two reviews in a row gets cut, and the same group can''t submit under a new
  hard core for a year. We''d grandfather in a few big-name labs so the policy doesn''t
  die at the first faculty meeting.


