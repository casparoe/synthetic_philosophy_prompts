  neutrality claim, especially as it is developed in Of Money and Of the Balance of
  Trade. The ones I already have are:


  1. The transition-delay objection: Hume himself concedes that while prices are adjusting,
  an influx of money stimulates production; this shows neutrality is only a comparative-statics
  result after the adjustment is complete.

  2. The hoarding and reflux objection: money is not necessarily spent into circulation;
  it may be hoarded or sent abroad, so the proportional price adjustment Hume assumes
  need not occur.

  3. The credit object-ion: in an economy with bank-created money or paper credit,
  the mechanism tying the money stock to the price level is loose, and an outflow
  of specie may be offset by domestic credit expansion rather than by falling prices.

  4. The injection/distribution objection: new money enters the economy unevenly,
  changing relative prices and the distribution of wealth along its path, not just
  raising all prices proportionally.


