  "In the essay Of Money (1752), Hume maintains that the absolute quantity of money
  in a country is of no consequence in the long run: prices of commodities are always
  proportioned to the plenty of money, so a greater or lesser stock of specie merely
  changes the numerical level of prices without altering real trade. Money, on his
