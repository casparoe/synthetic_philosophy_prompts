  The ITN framework: importance (how much good could be done if solved), tractability
  (how much progress per resources), neglectedness (how little attention it currently
  gets). Pre-supposes: a consequentialist, calculation-friendly view of doing good;
  commensurability of very different goods (a DALY, a species saved, a life improved,
  freedom of speech) on one scale; a marginal-impact view rather than a "do your duty"
  or "rights" view; neglectfulness presupposes diminishing returns to attention or
  that the best opportunities are where others aren''t; tractability presupposes that
  social change is like engineering — interventions have predictable, measurable effects;
  that expected value across huge uncertainties can be computed; that the unit of
  analysis is the "cause" rather than the community or relationship; that the donor''s
  role is optimization rather than partiality.


