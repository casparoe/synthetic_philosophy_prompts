  Domain: Qualia/quining qualia. Type: list of things and ask for new one. Could ask
  for a new *argument that qualia are an incoherent or idle posit* not on list. The
  list (described, not named):


  1. The intuition-pump/illusionist appeal: what it''s like seems ineffable, intrinsic,
  private, directly apprehensible, but all those purported properties can be explained
  as reports about our own reactive dispositions and public discriminative abilities
  (Dennett''s quining project). Hmm that''s broad.


  2. The "difference without a difference": if a being were functionally identical
  to you but lacked qualia (a zombie), no outward test could ever reveal it; a posit
  that makes no possible difference to behaviour is idle. But this is usually an argument
  for epiphenomenalism being a problem, and philosophical zombies are used by qualia
  realists. Hmm, an eliminativist might use it: the notion is untestable.


  3. The argument from the impossibility of misremembered/changed qualia: Dennett''s
  Chase and Sanborn coffee tasters. Chase says the coffee hasn''t changed but his
  taste has; Sanborn says the taste is the same but he now dislikes it. This is supposed
  to show that the quale — the "way it tastes" — can''t be separated from one''s evaluative
  reaction to it; there is no evidence that there is a stable inner quality over which
  the two are right or wrong. So the posit of qualia does no explanatory work.


  4. The "sorites" / gradual replacement argument? Dennett''s "Caesarean" cases? Hmm.


  5. The argument from introspection''s fallibility and change blindness / inattentional
  blindness: we think we have a rich, detailed phenomenal field; experiments show
  we don''t notice even gross changes; the apparent richness is an illusion generated
  by our access to the world, not a real inner canvas. This is more recent (change
  blindness, refrigerator light illusion).


  6. The argument from simplicity / Occam: physicalism is complete; qualia are either
  physical or an unnecessary add-on.


  7. The "private language" / verificationist argument: if ''what it''s like'' is
  essentially private and incommunicable, then the term ''qualia'' can''t be doing
  meaningful work in our public language.


  8. The argument from illusion: properties like "redness" don''t exist out in the
  world (colour is dispositional/relational), so we posit them in the head; but the
  head doesn''t contain red things either; the whole idea of a red patch in the mind
  is confused. Dennett calls this the "figment"? Actually Dennett on "filling in":
  there is no inner pink ring (the phi phenomenon?). The "Otto" case, "filling in".
  The claim that there''s no place where the "redness" is.


