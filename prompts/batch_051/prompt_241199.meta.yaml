  at truth; otherwise their words just sound like another event in the world. Reductionism
  looks right for what I''d call acceptance: the settled attitude you act on later,
  which ought to answer to all your other evidence. So the relation between them is
  not that one foundation supports the other, but that uptake is the status you need
  to have before evidence about the speaker can even be brought to bear."


