  utterly underived. Aristotle said that God is the Unmoved Mover, and this doctrine
  announces that we are Unmeant Meaners."


  My working idea is that Dennett''s two-bitser argument is often read as denying
  any important difference between a vending machine''s coin validator and a human
  belief, but that the passage points toward a slightly different target: not the
  fact of aboutness, but the demand that human aboutness be utterly underived. I want
  to argue that the real dispute is not about whether human intentionality is causally
  rooted in natural selection and learning, but about whether "derived" is the right
  word for the kind of dependence those roots involve. A coin validator''s capacity
  is assigned by us; a human''s capacity is, in Dennett''s account, maintained by
  an interpretive stance that is not itself assigned by any human. So the charge that
  Dennett merely extends derived intentionality to us may rest on an equivocation
  between two senses of derivation: design by another agent and explanatory dependence
  on a non-intentional process. My worry is that this defense makes Dennett''s view
  too close to the very doctrine he rejects, since once "derived" is split in this
  way, Searle or Fodor could accept the second sense while insisting on the first.
  I am not sure whether the essay should then accuse Dennett of relabeling, or instead
  argue that the relabeling is the substantive point.


