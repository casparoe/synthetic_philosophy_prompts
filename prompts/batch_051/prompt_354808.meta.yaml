  Two members of my reading group — call them Daniel and Sofia — ended up in an argument
  after a session on decision theory, and neither would give ground. The question
  was whether the "embedded agency" problem is a genuinely new obstruction or just
  a relabeling of old, local difficulties. I want a referee who can go move by move.


  Daniel opened with the standard line. Expected utility theory, he said, assumes
  an agent standing outside the world: a set of actions, a set of states, and a probability
  distribution over states; the agent chooses an action and the world does something.
  But a real agent is inside the world. Its beliefs, its utility function, and the
  computation that selects its action are all physical events. The "Cartesian boundary"
  between agent and environment is a modeling convenience, not a fact; once the agent
  is smart enough to reason about its own decision procedure, the convenience stops
  being innocent.


  Sofia said that''s an observation about diagrams, not about the mathematics. Decision
  theory requires only a well-defined action space and a probability measure over
  outcomes; it does not require an ontological split between mind and world. You can
  include the agent''s own code, hardware, even your model-selection procedure in
  the world model if you need to. Self-reference is computationally hard, but calling
  it a boundary problem doesn''t show the framework is broken.


  Daniel: That''s exactly the move that fails. If the agent''s decision procedure
  is a variable inside the model, then the action being evaluated is not independent
  of the beliefs doing the evaluating. "The world in which I choose A" includes a
  different reasoner — one that was disposed to choose A — so comparing actions means
  comparing across different selves. Expected utility maximization gives no rule for
  assigning probabilities to "what would happen if I chose otherwise" when the counterfactual
  modifies the reasoner rather than just the world. That''s not a missing variable;
  it''s a vicious loop.


  Sofia: That''s act-state dependence. Causal decision theory already handles it:
  evaluate an action as an intervention on the choice variable, not as an observation
  about yourself. If your choice is caused by your computation, that''s just more
  causal structure. You don''t need the reasoner to stay fixed while the action changes;
  you need the intervention to leave the rest of the graph unchanged. CDT does that.


  Daniel: CDT works by declaring the choice node exogenous — something you can set
  from outside. But for an embedded reasoner, the choice node is fixed by the very
  computation that is deciding how to intervene. If that computation can represent
  the intervention itself, the causal graph is no longer acyclic in the relevant sense,
  or the node''s exogeneity is false. You can''t escape by moving the boundary back;
  you''ve just hidden the Cartesian assumption inside the do-operator.


  Sofia: But every model carves system from environment somewhere. That''s not a bug,
  it''s a precondition of modeling. Physicists are parts of the world too, and physics
  does fine by making the observer an abstraction. The fact that human agents can
  ask how they are modeled doesn''t make the standard tools invalid; it just means
  typical toy models are too coarse. You''re attacking a strawman — nobody believes
  the action space is ontologically basic.


  Daniel: The physicist''s case is different because physics doesn''t need the observer''s
  possible choices to be variables in its laws. Decision theory does. Its object is
  precisely to say which possible choice gets made, from the inside. When the abstraction
  of a freely settable choice node breaks down, the thing decision theory is for disappears.
  And it breaks down systematically precisely when the agent improves — a stronger
  reasoner is pushed toward modeling its own decision procedure, so the better the
  agent, the worse the Cartesian boundary fits. That''s the embedded-agency one-liner:
  the problem grows with capability, so it isn''t a toy-model artifact.


  Sofia: That may be true of ideal, logically omniscient agents that can fully represent
  themselves. But finite agents can''t fully model themselves — there are diagonalization-style
  limits — so the exotic regress you''re worried about may never actually occur. Real
  agents model simplified versions of themselves and reason with bounded resources.
  You''re letting a failure mode of an impossible ideal dictate the research program
  for a possible one.


  Daniel: You don''t need full self-models to get the pathology. An agent that can
  refer to its own beliefs only approximately already gets loops between its model
  and its modeling, and approximate self-reference is unavoidable once an agent can
  form beliefs about its own outputs. Besides, for rationalists of all people, ideal
  reasoning is supposed to be the target that bounded procedures approximate. If the
  ideal is incoherent, "approximate ideal reasoning" doesn''t have a well-defined
  target.


  Sofia: That overstates the available results. What''s been shown, at most, is that
  certain very strong systems trip over self-reference with certain very strong consistency
  assumptions. It''s a research problem in logical uncertainty and naturalized semantics
  — real problems, but local. You haven''t shown there''s no alternative idealization
  that gives a usable target and avoids the boundary assumption. Calling the local
  problems "embedded agency" makes them sound like one phenomenon when they may be
  a grab bag.


