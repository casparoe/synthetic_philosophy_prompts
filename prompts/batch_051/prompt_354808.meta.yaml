  outcomes. You can model an agent that reasons about its own code as just another
  fact in the world model — self-reference is hard but not a conceptual refutation.
  All you''ve shown is that naive models ignore some dependencies, not that EU theory
  fails.


  A: But once your own decision procedure is inside the model, your possible actions
  are no longer independent of your beliefs. If you''re evaluating an action "choose
  A", you have to evaluate a world in which you chose A — including what your model
  of the world was while choosing. That creates the standard problem: the thing doing
  the evaluation is different from the thing being evaluated. It''s not just a missing
  variable, it''s a vicious loop. Expected utility maximization doesn''t say how to
  assign probabilities to "if I were to choose A" when the counterfactual changes
  your own reasoning.


  B: That''s just the old problem of act-state dependence, which causal decision theory
  already handles: condition on your action as an intervention, not as an observation.
  The counterfactual "if I were to choose A" is evaluated by intervening on the node
