  Concrete disagreement:


  A (say, "Sam"): The classic expected utility framework treats the agent as choosing
  among actions given fixed probabilities over world states. But for an embedded agent,
  the act of choosing is itself a physical event in the world; the agent''s own code,
  its model, and its decision procedure are all part of the environment it is trying
