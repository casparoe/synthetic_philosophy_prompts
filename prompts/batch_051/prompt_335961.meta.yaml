  Possible readings for "the exception proves the rule":

  a) Trivial logical reading: If someone bothers to identify X as an exception, their
  doing so presupposes some rule R from which X deviates; the speech act labels it
  as exception.

  b) Evidential/strengthening reading: A violation that is treated as exceptional
  (noticed, sanctioned, corrected) shows the rule is in force — people orient to it.
  The fact that "baked" is regular but "broke" is noted as irregular indicates a past-tense
  rule governing most verbs.

  c) Legal/maxim reading: An explicit exception in a regulation implies the rule applies
  elsewhere (exceptio probat regulam in casibus non exceptis) — e.g., "no parking
  on Sundays" implies parking allowed other days. This is historically a legal maxim.

  d) Testing reading based on older meaning of "prove" as "test": An exception tests
  a rule; if the rule survives it, it''s strengthened.

  e) Falsification-resistant reading: Any apparent counterexample can be declared
  an exception, which immunizes the rule from refutation — bad faith move (ad hoc
  auxiliary).

  f) In linguistics: ''exception'' vs ''lexicalization/suppletion'': forms like go/went
  are not exceptions to a synchronic rule but instantiations of a lexically specified
  pattern; there is no rule ''add -ed'' being violated if go/went is stored as separate
  forms. Sound change: apparent exceptions may reflect regular sub-patterns (e.g.,
  trisyllabic laxing) or the residue of earlier regular changes.

