  "I have recently been asked to contribute to a working group on how to think about
  the economics of artificial intelligence, and I keep coming back to the Industrial
  Revolution analogy. In the introduction to his Inquiry into the Nature and Causes
  of the Wealth of Nations, Adam Smith writes: ''The causes of this improvement in
  the productive powers of labour, and the order according to which its produce is
  naturally distributed among the different ranks and conditions of men in the society,
  make the subject of the first book of this Inquiry.'' The familiar reading of this
  sentence is that national opulence is to be explained by the productive powers of
  labour, and that distribution is a separate—if intertwined—question. Suppose now
  a world in which a large share of mental and manual work can be performed by general-purpose
  machine intelligence at near-zero marginal cost, so that annual supply is no longer
  a function of the skill, dexterity, and judgment with which the population''s labour
  is applied. Does the Smithian argument—that the wealth of nations is fundamentally
  a story about the productive powers of labour—still have force in that setting,
  or does it collapse into a purely distributional question about ownership of the
  capital that does the working? Be specific about what the argument must assume to
  go through, and whether the changed assumption can be repaired by moving ''labour''
  to mean something broader, or whether the analogy is dead."


