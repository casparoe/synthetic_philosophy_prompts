  1. They disagree about doxastic voluntarism (can we believe at will?).

  2. They have different scope assumptions: Clifford thinks all belief is governed
  by the same epistemic norms; James thinks there are different domains (science vs
  religion) with different aims.

  3. Different pictures of what belief is: Clifford treats belief as a public act
  with social consequences; James treats it as a private, self-defining commitment.

  4. Differences about the standard of evidence: "sufficient" evidence — Clifford
  sets the bar at what would convince an impartial inquiry; James says proving insufficient
  in advance is impossible in momentous cases.

  5. The debate may be partly verbal: Clifford''s "belief" vs James''s "acceptance"/"hypothesis
  adoption."


