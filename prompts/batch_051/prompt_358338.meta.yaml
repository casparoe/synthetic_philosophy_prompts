  months on Clifford and James, and I have the distinct sense that we have stalled.
  The Cliffordians among us hold that it is wrong, always and everywhere, to believe
  anything on insufficient evidence: belief is not a private indulgence but an act
  with consequences, and insufficiently grounded belief corrupts the habit of honest
  inquiry. The Jamesians among us grant that evidence is the only thing that may settle
  a belief in ordinary scientific or everyday matters, but they insist that there
  is a special class of cases — decisions that are living, forced, and momentous —
  in which the evidence is by its nature indecisive and the will, or the passional
  nature, may legitimately decide. On paper both sides agree on the same cases; they
  merely draw the boundary in different places. Neither side has moved in months.


