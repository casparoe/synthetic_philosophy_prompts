  of belief at all but about doxastic voluntarism: Clifford speaks of a duty to believe
  only on evidence, and James speaks of a right to believe, and both seem to presuppose
  that believing is the sort of thing one can do or refrain from doing at will. If
  belief is not under voluntary control, the debate may be misframed. But I am not
  sure whether that is the deepest diagnosis.


