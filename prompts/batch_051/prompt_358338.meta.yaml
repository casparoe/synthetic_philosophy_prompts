  Potential final prompt:


  "I am a retired natural scientist who came to philosophy late, and for the past
  several months I have been in a reading group on the ethics of belief. We have spent
  most of our time on Clifford and James, and the dispute between the two camps has
  hardened into a standstill. The Clifford side holds that it is wrong, always and
  everywhere, to believe on insufficient evidence: belief is not a private affair
