  nothing is ever satisfied (e.g., "to know p you must know that you know p" leads
  to a regress where knowledge of p is never achieved). Benign regresses: truth regress
  ("p is true" → "''p is true'' is true" → ...), which is harmless because each step
  is already true, no unmet condition. There''s the distinction between regresses
  that are impossible because they require completion of an infinite series (vicious)
  vs. regresses that simply generate an infinite series of true propositions (benign).
  Also the debate between foundationalism, coherentism, infinitism in epistemology.


