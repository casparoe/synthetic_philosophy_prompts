  Maimonides'' view on animal sacrifice: In Guide III:32, he says the sacrificial
  system was a concession to the historical situation. God did not command it as something
  desired for its own sake; rather, the Israelites, coming from Egypt, were accustomed
  to sacrificing to idols. God, in His wisdom, did not command them to abandon all
  these forms of worship, because it would be too hard; instead He transferred them
  to His own name. He says something like: "It is impossible to go suddenly from one
  extreme to the other; it is therefore according to the nature of man impossible
  for him suddenly to discontinue everything to which he has been accustomed." In
  III:32 he compares to a physician who cannot cure a sick person by taking away everything
  at once. Also in III:46 he gives reasons for specific sacrifices, saying they are
  directed against idolatrous practices, e.g., the commandments concerning the paschal
  lamb and the goat sent to Azazel, etc. There is a potential tension: he says sacrifices
  are a concession to primitive habits, but he also treats the sacrificial laws as
  having deep religious and pedagogical significance, and he even says in III:46 that
  the purpose of the sacrifices is to convey certain truths and that they are not
