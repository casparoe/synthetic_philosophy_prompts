  In my courses I give the following working criteria for something''s counting as
  a reason for a state of affairs, as opposed to a mere cause. A reason must:

  (1) answer a "why?" question in a way that makes the thing intelligible;

  (2) be capable of being cited as a consideration in favor of the thing''s being
  as it is — not merely be the antecedent that produced it;

  (3) support the relevant counterfactuals (had the reason not obtained, the thing
  would, other things equal, have been otherwise or less probable);

  (4) be such that some subject could, at least in principle, stand in the relation
  of having it — reasons are for or available to somebody, even if nobody actually
  entertains them.


  Now consider the following strain of talk in evolutionary biology. Biologists routinely
  say that the heart exists because it pumps blood; that the humpback''s breaching
  is for communication; that the stick insect''s camouflage is the reason predators
  overlook it. The figure is powerful, but there is a well-known philosophical challenge
  buried in it. Natural selection requires no mind that represents, weighs, or otherwise
  has the rationale; the "reason" floats free of any reasoner. If the heart''s pumping
  blood explains why hearts persisted, then the reason does its explanatory and justificatory
  work without belonging to any subject''s perspective.


  My question: on the four criteria above, is the relation between the heart''s pumping
  blood and the presence of hearts a relation of reason, or only of cause? Work criterion
  by criterion, and say where the criteria underdetermine a verdict. Then address
  the deeper issue: should criterion (4) be kept because it marks a real difference
  between reasons and causes, or should it be abandoned because it makes our theory
  incapable of saying what the heart-pumping relation plainly is? In other words,
  does the case show that a satisfactory account of reasons must accommodate free-floating
  rationales, or that free-floating rationales are a useful metaphor and nothing more?


