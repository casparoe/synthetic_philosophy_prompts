  C3 (antipathy filter): pain that consists solely in one person''s disapproval/disgust
  at what others do does not count as harm for the purposes of C1/C2.

  C4 (ascetic filter): the mere fact that an act renounces pleasure is not itself
  a virtue or a vice; privation isn''t intrinsically good.

