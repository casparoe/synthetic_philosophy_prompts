  Let me think about Bentham''s actual view more to make the criteria accurate. Bentham''s
  "Offences Against One''s Self" argues:

  - Sexual desire is natural; its satisfaction is a source of pleasure, hence (other
  things equal) good.

  - To justify punishing a sexual act, one must show it causes mischief (harm) to
