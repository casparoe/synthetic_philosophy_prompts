  ethics, deliberately stated without any of his historical examples. It says a sexual
  practice or institution is wrong only if:


  1. someone is harmed without genuinely consenting to the risk of that harm;

  2. the practice lowers the total of pleasure minus pain, summed across everyone
  affected, compared to the best feasible alternative;

  3. the pain of third parties'' mere disapproval or disgust at other people''s private
  conduct does not count as harm for purposes of 1 and 2 — otherwise any disliked
  practice could be made wrong by enough bigotry;

  4. nothing is wrong merely because it renounces pleasure (asceticism) and nothing
  is right merely because it pursues it — utility is the only currency;

  5. there''s no special requirement that people''s desires have to be formed reflectively
  or autonomously for their satisfaction to count as a benefit.


  Now the case. The Order of Quiet Joy is a small, legal, well-documented community
  of adults. Members take a permanent vow: no sex, no masturbation, no deliberate
  sexual fantasy. When someone seems restless or admits a fantasy at the weekly check-in,
  the others hold a "mirroring" session: the member stands in a circle while everyone
  else describes, calmly and at length, exactly how the member''s longing looks from
