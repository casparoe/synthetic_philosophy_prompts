  argument he says would justify punishing any mode of conduct that happens to disgust
  people (e.g., eating particular foods), and is not a legitimate ground.

  - He insists consent is essential; force and fraud are wrong because they harm.

  - His conclusion re sodomy: it should not be a criminal offence where consensual
  and between adults; may be wrong in cases producing harm.


