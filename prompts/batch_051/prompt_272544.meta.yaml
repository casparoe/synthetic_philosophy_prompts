  Domain 5: The absurdity doctrine: when may a court ignore what a text plainly says?

  Type C: asymmetry in ordinary judgments or practice.


  Contrast: Courts will disregard literal text when it produces an absurd result (e.g.,
  a statute requiring a 120-day filing window when a typo says 12 days? or a statute
  with "not" instead of "now"), but they will not disregard literal text when it produces
  a merely unwise or unjust result. Also, they correct scrivener''s errors but not
  drafting misjudgments. What justifies the asymmetry?


  Better concrete case: "A court will read ''the applicant must file within 300 days''
  as ''30 days'' when the context shows a scrivener''s error, and it will also decline
  to apply a plainly worded deadline where doing so would produce a result no reasonable
  legislature could have intended. But it will not rewrite a plainly worded deadline
  that is merely harsh, foolish, or unfair. So the court departs from the text for
  absurdity but not for bad policy, and for clerical error but not for substantive
