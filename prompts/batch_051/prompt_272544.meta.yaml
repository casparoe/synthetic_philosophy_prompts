  Prompt idea:


  "Intellectuals who accept historical materialism readily explain other people''s
  deep convictions—religious revivals in deindustrialized towns, family values in
  agrarian societies, resistance to free trade among workers in import-competing industries—as
  effects of economic conditions. Yet they almost never apply the same explanation
  to their own convictions: they treat their own belief in historical materialism,
  and their own moral and political views, as the deliverances of evidence and argument
  rather than as superstructural effects of their economic position. State the strongest
  version of the asymmetry, then ask whether anything justifies exempting one''s own
  beliefs from base-superstructure explanation. If historical materialism is true,
  should its own advocates regard their conviction as caused by their class position,
  and does that causal origin undermine the conviction? Or is the asymmetry merely
  a psychological bias that a consistent historical materialist must give up? Give
  the best defense of the asymmetry and an honest verdict on whether it works."


