  Let me think about the domain facts to not misstate the idea. Unilateralist''s curse:
  a number of agents can each unilaterally undertake an initiative. Each has some
  private information about whether the initiative is a good idea. If each acts based
  on whether their own estimate exceeds a threshold, then the probability the initiative
  is undertaken equals the probability that the most optimistic estimate among the
  agents exceeds the threshold. With many agents, this means the group''s effective
  judgment is the maximum of the sample, which is biased upward. When errors are asymmetric
  (the bad action is worse than the missed opportunity), the curse is severe: everyone
  can be individually sensible yet the group will likely act in cases where, had they
  pooled their estimates, they would have judged the action bad. Exactly.


