  from informational cascades within insulated groups, not from evidence. Generalists
  might say the problem is the social-epistemic process that produces them; particularists
  reply that many ordinary beliefs are also formed via testimony and cascades.

  - Falsifiability: generalists claim conspiracy theories are often unfalsifiable
  ("the absence of evidence is proof of the cover-up"), while particularists note
  that conspiracies necessarily involve secrecy, so demanding certain kinds of evidence
  is unreasonable.

