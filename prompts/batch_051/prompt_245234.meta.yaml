  Let''s ensure accuracy of the dogmatism paradox content:

  - It''s usually traced to Saul Kripke (reported by Gilbert Harman in "Thought" 1973).
  The paradox: If S knows p, then S knows (or is in a position to know) that any evidence
  against p is misleading. So if S encounters evidence e against p, S can dismiss
  it. But this seems to conflict with rational open-mindedness/fallibilism.

  Actually is the principle "if S knows p then S knows any evidence against p is misleading"?
  Suppose S knows p via reliable source. If e is misleading, then p is true. S knows
  p, so p true. For any e that is evidence against p? Actually "evidence against p"
  could still exist while p is true: the evidence is misleading. Since S knows p,
  S is entitled to believe e is misleading. But wait, does S know e is misleading?
  S knows p; p entails that any evidence against p is misleading (given the definition
  of misleading). If S knows that p entails q? S must know that p entails "any evidence
  against p is misleading." Is that a conceptual truth S can know? Usually yes. Then
  by closure, S can know q. So S can know in advance of seeing e that e is misleading.
  Therefore after seeing e, S can rationally ignore it. This threatens any revision
  of knowledge. The Bayesian: evidence e should lower credence in p if e is less likely
  under p than under not-p. But if the agent knows p (credence 1), then no evidence
  can lower it; Bayesian updating with p at probability 1 is absorbing. But Bayesians
  usually avoid probabilities 0/1 for empirical propositions (Cromwell''s rule). So
  the dialogue could pit the dogmatist''s knowledge-based dismissal against a Bayesian
  fallibilist''s insistence that one should never assign probability 1 to empirical
  claims and should update.


