  Let''s formalize:


  The dogmatism paradox is typically attributed to Saul Kripke (unpublished, discussed
  in Gilbert Harman''s Thought? 1973). Harman presents it: If you know p, you know
  that any evidence against p must be misleading. So when you encounter apparent counter-evidence,
  you can dismiss it as misleading without changing your belief. This conflicts with
  the intuition that rational belief should respond to evidence.


  Key principles: Knowledge implies truth (if you know p, p is true). If p is true,
  any evidence against p is misleading (i.e., points away from truth). So if you know
  p, you''re in a position to know that any counter-evidence is misleading. Hence
  you can rationally disregard it. This leads to... the puzzle about how one can rationally
  revise any knowledgeable belief, and tension with the idea that one should be open
  to new evidence.


  There are nuances: closure of knowledge under known entailment. "If a subject knows
