  Actually the standard resolution: You can know p while getting evidence e that (unbeknownst
  to you) undermines your justification for p, so knowledge can be lost. The dogmatist
  says you can know e is misleading, but maybe encountering e destroys your knowledge
  of p, which undermines your basis for dismissing e. This is an "undercutting vs
  rebutting" distinction. Or Harman''s point: the principle "if you know p, then you
  know any evidence against p is misleading" may fail because evidence can defeat
  knowledge even when the belief is true. So the dogmatist inference is blocked. Bayesian
  response: replace "knowledge" with degrees of belief; don''t set P(p)=1.


