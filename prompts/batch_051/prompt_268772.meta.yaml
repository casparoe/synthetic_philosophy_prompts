  Galen Strawson''s Basic Argument (from "The Impossibility of Moral Responsibility",
  Philosophical Studies 1994, and Freedom and Belief 1986):


  1. Interested in true moral responsibility: responsibility of such a kind that,
  if we have it, it makes sense to say we deserve blame/punishment or praise/reward
  in a basic, ultimate way (desert-entailing).

  2. Nothing can be causa sui — nothing can be the cause of itself.

  3. To be truly morally responsible for one''s actions, one would have to be truly
  responsible for the way one is, at least in certain crucial mental respects.

  4. To be truly responsible for the way one is, one must have intentionally brought
  it about that one is that way.

  5. But one cannot intentionally bring it about that one is the way one is unless
  one already has a nature sufficient to do that — which leads to regress.

  Therefore true moral responsibility is impossible.


