  Let me think about the philosophical terminology so I get them right.


  - Simple conditional analysis: x is disposed to M in response to stimulus S iff,
  if x were to undergo S, x would M. So "fragile" = if struck, would break.


  - Fink: an object x is finkish (with respect to disposition D) if x has D at time
  t, but at t, some property/circumstance would cause x to lose D before the stimulus
  would bring about manifestation. Example: C.B. Martin''s "electro-fink" for conductivity:
  a wire is dead unless touched by a conductor, in which case the fink makes it live.
  For fragility: a glass with a guardian angel/sorcerer that, if the glass were struck,
  would make the glass not fragile the instant before impact; so the glass doesn''t
  break. Intuitively it was fragile before the stimulus. The simple conditional says
  not fragile.


  - Mask (antidote): x has D, undergoes stimulus S, but an external factor interferes
  with the causal process so M does not occur. Example: a fragile glass wrapped in
  bubble wrap — when struck, the packaging absorbs the shock, so it doesn''t break;
  intuitively still fragile. Or Bird''s masked disposition: poison masked by antidote.
  The simple conditional says not fragile if it wouldn''t break when struck.


  - Mimic: x lacks D, but if x underwent S, some external factor would cause M anyway.
  Example: a non-fragile object wired to an explosive that would shatter it when struck;
  intuitively not fragile, but simple conditional says fragile.


  Also "antidote" sometimes used for masks. "Fink" and "mask" sometimes both called
  "antidotes" or "maskers." Fink removes the disposition; mask blocks the manifestation.
  Mimic produces manifestation without disposition.


