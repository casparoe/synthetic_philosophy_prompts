  effectively decide whether α(n) is 0 or 1. (1) Suppose we possess a constructive
  proof of the claim not every term of α is 0; formally, ¬∀n(α(n) = 0). (2) According
  to the constructive reading of a negated universal claim, such a proof is a construction
  that converts any alleged proof of ∀n(α(n) = 0) into a proof of a contradiction.
  (3) A construction of that kind must exploit some particular term where α takes
  the value 1: if no term of α were 1, then the universal claim would simply be true,
  and there would be nothing for the alleged contradiction to contradict. So the proof
  must carry with it a specific natural number n₀ such that α(n₀) = 1. (4) But supplying
  such an n₀, together with the decision procedure that confirms α(n₀) = 1, is exactly
  what a constructive proof of ∃n(α(n) = 1) is. (5) Therefore, for every binary sequence
  α, a constructive proof of ¬∀n(α(n) = 0) yields a constructive proof of ∃n(α(n)
  = 1). (6) In particular, whenever one has proved constructively that a decidable
  property does not hold of all natural numbers, one is entitled to assert the existence
  of a definite failing case, even though no finite search or bound has been exhibited.
