  I''ve been thinking on my own about how much weight to give what people say about
  their own thinking at the time. I''ve noticed three kinds of report get conflated
  in our reviews. There is the report made close to the event, while the scene is
  fresh. There is the report reconstructed days later in an interview. And there is
  the report about what someone says they would have done or thought under slightly
  different circumstances. I suspect these are not equally reliable, and that within
  each kind, some features make a report more trustworthy than others. For example,
  an account that was written down before the outcome was known seems different from
  one assembled after the damage is obvious; a claim about what someone noticed seems
  different from a claim about why they chose one action over another; a report delivered
  in the person''s own unprompted words seems different from an answer to a leading
  question.


  I want you to turn whatever is actually known about the reliability of introspective
  reports into a decision procedure I can run in the week after an incident. The procedure
  should tell me, for each self-report, how much weight to attach to it relative to
  the physical record, the sequence of events, and other witnesses'' observations.
  It should have questions to ask in order, what counts as a sufficient answer to
  each, where it should stop and say a report can''t be relied on either way, and
  where it has to hand things to the committee because the question is a judgment
  call rather than something a procedure can settle. It should be explicit about which
