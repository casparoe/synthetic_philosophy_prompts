  Luck egalitarianism: Ronald Dworkin''s distinction in "Sovereign Virtue" (2000),
  building on earlier work. Equality of resources: distribution should be sensitive
  to people''s choices (option luck) but insensitive to circumstances beyond their
  control (brute luck). Brute luck: risks not deliberately chosen (e.g., being born
  with a disability, being hit by a meteor). Option luck: outcomes of deliberate,
  calculated gambles (e.g., choosing to invest in a volatile stock, choosing a risky
  career). Dworkin models ideal insurance markets: people would insure against brute
  bad luck at hypothetical premiums; compensation simulates that insurance. Criticisms:
  Elizabeth Anderson''s "What is the Point of Equality?" (1999) argues luck egalitarianism
  leads to demeaning, intrusive judgments and abandons the badly-off who are deemed
  responsible for their choices; the "shameful revelation" point: claimants must show
  their bad luck wasn''t their fault. Also the harshness objection: those who make
  imprudent choices are left to die. And the "option luck" line is unclear when disadvantages
  are the combined result of choice and unchosen facts.


  This is enough to write a fair satirical prompt. The target could be: the style
  of discourse in which every misfortune is audited into "brute" or "option" luck,
  and the bureaucratic/cruelty problem. The asker can request a mock official communication
  that takes luck egalitarian categories with total procedural seriousness. I can
  say: "I want the parody to be fair to the view: it should exaggerate a real feature,
  not invent one — especially the determination to sort disadvantages into chosen
  and unchosen categories, and the tone-deafness that sorting produces when it becomes
  an administrative practice. A specialist should recognize the target as the bureaucratic
