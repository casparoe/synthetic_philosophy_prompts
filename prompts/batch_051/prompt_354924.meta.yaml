  I run the moderation team for a social VR platform: around 200k monthly users with
  persistent worlds, player-made buildings, inventories, and a real-money exchange
  for some but far from all items. The community has grown to the point where alot
  of our reports are about stuff that''s neither clearly a technical exploit nor clearly
  the kind of harassment our old rules were written for: someone deletes a hand-built
  meeting hall through a permissions bug, an avatar repeatedly presses up against
  another user whose space bubble is turned off, an ex-partner destroys a shared virtual
  garden after a breakup, a group steals a one-of-a-kind item worth thousands on the
  grey market but nothing in our official economy. We clear maybe forty reports a
  day, each with a few minutes of volunteer mod time, and wrong calls produce both
  forum dumpster fires and actual upset.


  Our current policy says "virtual harms are real enough to act on" and then leaves
  it entirely to the mod''s gut. We are small, so I need a reusable procedure—a checklist
  or decision tree in words—that mods with no philosophy background can apply. It
  should help decide which virtual objects and virtual harms to treat as real enough
  to warrant muting, restoring, suspending, or a permaban. The conceptual question
  is whether there is a principled line between a virtual harm that deserves real-world
  sanction and a bad thing happening inside a game that should be handled by game
  mechanics, and what does the actual work: labored time, emotional attachment, consent,
  embodiment, real-money value, recognizability of the space, something else?


