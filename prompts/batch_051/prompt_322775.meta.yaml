  I have recently been appointed to the appeals panel of a professional licensing
  board, and a fellow panelist — who describes himself as siding with Caruso against
  Dennett in the debate over "just deserts" — has circulated the following argument.
  He claims it shows that no one can ever deserve punishment, and that our panel should
  therefore abandon all retributive considerations and treat every infraction purely
  as a matter of public protection, rehabilitation, and deterrence. I find the conclusion
  difficult to accept, but I have not been able to locate the flaw, and I do not want
  to reject the argument merely because its conclusion is unwelcome. I would be grateful
  if you would examine it step by step.


  The argument runs as follows:


  (1) An agent deserves punishment for an act only if the agent was ultimately responsible
  for that act — that is, only if the act is ultimately attributable to the agent
  rather than to factors beyond the agent''s control.


  (2) An act is ultimately attributable to an agent only if the act was under the
  agent''s control in the sense that desert requires.


  (3) If determinism is true, then every act is fully accounted for by factors outside
  the agent''s control, such as heredity, upbringing, and prior causes; no act is
  therefore under the agent''s control in the sense that desert requires.


  (4) If indeterminism is true, then any act that is not fully accounted for by prior
  causes is, to just that extent, a matter of chance; and an act that is a matter
  of chance is not under the agent''s control in the sense that desert requires.


  (5) Either determinism or indeterminism is true.


  (6) Therefore, no act is under the agent''s control in the sense that desert requires.


  (7) Therefore, no one is ever ultimately responsible for an act.


  (8) Retributive punishment is justified only if the person punished was ultimately
  responsible for the wrong.


  (9) Therefore, retributive punishment is never justified.


  Is this argument valid? If it is valid, which premise should a defender of ordinary
  desert-based responsibility deny, and what is the strongest ground for denying it?
