  Prompt draft:


  "I edit the historical notes in a general reference work on science, and every week
  I have to approve or revise sentences of the form ''X is named after Y, who discovered
  it in Z.'' Stigler''s law — stated roughly, the law that scientific discoveries
  are almost never named after their original discoverer — has convinced me that many
  of these attributions are false, but I cannot simply delete every eponym, and I
  don''t want the entries to become a running argument with the literature. Please
  write me a decision procedure I could actually use. It should tell me, for a given
  eponymous attribution, the questions to ask in order, what counts as a sufficient
  answer at each step, the point at which the procedure returns a definite verdict
  (say, ''leave the eponym'', ''hedge it'', or ''state that the name is misleading''),
  and the point at which it stops and hands the decision to a senior editor because
  the matter is one of historical judgement. Ground the procedure in what Stigler''s
  law actually licenses rather than in a blanket scepticism. Then apply it to two
  stipulative cases: (a) a reaction named after a chemist who published the first
  clear and correct account of it, although an unpublished notebook from a contemporary
  describes the same reaction twenty years earlier; and (b) a syndrome named after
  a physician who merely popularised it in a widely read textbook, while the first
  correct description came from someone else and is now all but forgotten. I expect
  the procedure to give an answer I won''t like in at least one of these. Finally,
  say explicitly what the procedure cannot settle and where I will still be making
  a judgement call."


