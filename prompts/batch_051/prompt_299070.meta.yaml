  Yablo''s paradox: consider infinite sequence of sentences S1, S2, S3, ... where
  each Sn says "For all m > n, Sm is false."


  Reasoning:

  Suppose Sn is true for some n. Then every later sentence is false. But consider
  S_{n+1}: it says every sentence after n+1 is false. Since all later sentences (after
  n) are false, all after n+1 are false; so S_{n+1} says something true, so S_{n+1}
  is true. But we said every later sentence is false, contradiction. So no Sn is true
  — every Sn is false. In particular S1 is false, meaning not every later sentence
  is false; there is some m>1 with Sm true, contradicting that no Sn is true.


