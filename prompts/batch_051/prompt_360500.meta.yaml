  Over the past several years I have come to accept what is now usually called the
  singleton hypothesis, though I want to state it more carefully than it often is.
  The hypothesis, as I hold it, is this: if Earth-originating civilization survives
  long enough, the highest level of decision-making will tend to become a single integrated
  agency — not necessarily a single mind or a literal world government, but a unified
  system of control, coordination, or enforced norms from which no significant agent
  can defect and with which no rival agency is in a position to compete on equal terms.
  I think of this as a default trajectory, an attractor, not merely one possibility
  among many. The reasons are broadly structural: as the destructive power of the
  most capable agents grows, the cost of failure to coordinate rises, and the returns
  to unified control increase; competitive multipolar orders generate arms races,
  collective action problems, and destructive conflict, and those pressures select
  for either extinction or unification. I do not claim that a singleton would be good
  — only that it is where the dynamics point. And I want to know what would count
  against this.


  What I am asking for is not a bibliography or a list of sources, and not a discussion
  of whether a singleton would be desirable. I want a map of the hypothesis''s exposure:
  the observations, arguments, formal results, historical analogies, and conceptual
  objections that would most undermine it, ranked from those that would be fatal to
  those that would be merely awkward. I want you to be precise about the distinction
  between evidence that should lower my confidence and evidence that should make me
  abandon the framework altogether. A committed proponent will concede that certain
  things genuinely count against the hypothesis while dismissing others as attacks
  on a strawman; I want you to say which is which, and why.


  In particular, please address the following. First, what does the hypothesis predict
  that a robust multipolar alternative does not, and which of those predictions could
  actually be disconfirmed? Second, is there any reason to think that a competitive
  multipolar order could itself be a stable long-run equilibrium once stakes are very
  high, and do the historical, biological, or strategic records give us any genuine
  evidence either way? Third, has the hypothesis — or have I, in the way I just stated
  it — been qualified so that no possible outcome would count against it, and if so,
  is that a problem for a hypothesis of this kind, or is it the appropriate modesty
  of a view about the very long run? Finally, I would personally be most moved by
  evidence that, under conditions relevantly similar to the ones the hypothesis invokes,
  uncoordinated or loosely coordinated systems have persisted, thrived, and kept the
  relevant failure modes in check without converging on a unified decision procedure.
  But I do not want the whole answer organized around that preference.


  The deliverable should be a structured assessment of where the singleton hypothesis
  risks being false, and whether it risks anything at all.


