  Hedonism: pleasure and only pleasure is intrinsically good; pain and only pain intrinsically
  bad. The heterogeneity problem: the term "pleasure" covers a wildly diverse set
  of states — sensory pleasures, intellectual pleasures, affective states, relief,
  flow, schadenfreude, the satisfaction of a job well done, the pleasures of anticipation,
  the calm pleasure of a quiet walk. They don''t seem to share a single feeling tone.
  If they don''t share any single property, then the hedonist''s claim "pleasure is
  the good" is either (a) tautological but empty (whatever is good we call pleasure),
  or (b) false because there is no unified thing named pleasure to bear the normative
  weight.


  Possible defenses:

  1. Phenomenal unity: maybe there is a common "hedonic tone" — a felt goodness. But
  is that plausible across all cases? The felt quality of relief vs. triumph vs. taste
  feel different.

  2. Attitudinal hedonism (Feldman): pleasure is a propositional attitude of "enjoying"
  that something is the case. This unifies: all pleasures are instances of the same
  attitude-type (attitudinal enjoyment), even if their objects differ. So the heterogeneity
  of objects doesn''t matter, just as the heterogeneity of belief objects doesn''t
  destroy the category "belief."

  3. Functionalist hedonism: pleasures are states that play a certain role (e.g.,
  we''re disposed to want them to continue, they modulate attention/learning). Unity
  is functional, not phenomenal.

  4. Deflationary: "pleasure" is a folk category and not a natural kind, but that''s
  fine — money is also not a natural kind yet real and important. Similarly, hedonism
  could treat "pleasure" as a homeostatic property cluster or response-dependent property.


