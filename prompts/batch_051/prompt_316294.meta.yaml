  Draft: "What Do Pleasures Have in Common?" (working title)


  Hedonism about value sounds simple: pleasure, and only pleasure, is good. But the
  simplicity is suspicious, because the things we call pleasures don''t look much
  alike. The pleasure of a really good espresso, the pleasure of finally understanding
  a proof, the relief after a near-miss on the highway, the mean little buzz of schadenfreude,
  the post-run ache that somehow feels good — these don''t share an obvious felt texture.
  If I ask you what the espresso-pleasure and the proof-pleasure have in common, you''ll
  probably reach for words like "they both feel good," which is exactly the locution
  that needs explaining.


  Philosophers have three standard ways to unite this ragged bunch. The first, the
  phenomenal view, says there''s a common hedonic tone or gloss attached to all of
  them, a "pleasure-feeling" present whenever anything is enjoyed. The second, the
  attitudinal view (which I associate with Fred Feldman), says pleasure isn''t a feeling
  at all but a single kind of attitude — roughly, enjoying that something is the case
  — and attitudes can carry one label even when their contents differ wildly, just
  as belief covers beliefs about breakfast and beliefs about black holes. The third,
  the functional view, says a state counts as a pleasure because of what it does:
  we''re drawn to it, we''d like it to continue, it smooths attention or reinforces
  the behavior that produced it.


  Here''s what I want to argue. The phenomenal view is probably false, or at least
  most honest introspection is against it: the relief case doesn''t feel like the
  schadenfreude case in any single qualitative way. The attitudinal view is better,
  but it achieves unity by defining pleasure as one attitude-type, and now the hard
  question is simply relocated: what makes all those heterogeneous episodes instances
  of that one attitude? The obvious answer — they all involve the subject''s favoring,
  wanting-to-continue, or being-satisfied-with something — is functional. And the
  functional view, taken seriously, no longer sounds like a theory on which pleasure
  is the fundamental good; it sounds like a theory on which desire-satisfaction (or
  some related conative state) is the fundamental good, and "pleasure" is just the
  name for the felt edge of that. So hedonism seems to face a dilemma: either it insists
  on a shared felt quality (unbelievable), or it defines pleasure by a role, in which
  case it quietly becomes desire theory.


  My working conclusion is that the heterogeneity problem doesn''t just embarrass
  hedonism''s stock examples; it shows that hedonism''s unity was always borrowed
  from a conative theory, and that the two views collapse into each other under pressure.


