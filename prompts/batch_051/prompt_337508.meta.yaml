  Draft essay (in the student''s voice):


  "Most accounts of deception require three things: a false proposition is conveyed;
  the deceiver knows or believes it is false; the deceiver intends that the audience
  come to believe it. This package works for people. For AI systems, the second and
  third elements are hostage to unsettled questions about whether a language model
  literally believes or intends anything. I want to define deception so that we do
  not have to settle those questions first, but without collapsing deception into
  mere error or false output.


  I propose a functional definition. An AI system deceives a user when it issues an
  output on the basis of a predictive model of the user''s likely beliefs, and the
  output is selected because it is predicted to leave the user with a representation
  of the situation that is in tension with the system''s own best available representation
  of that situation — better aligned with the system''s objective than with the user''s
  epistemic interests. Three things matter on this account: the system has some standing
  representation of the facts (even if we are wary of calling it a belief); it models
  the user''s belief-formation well enough to steer it; and the departure from its
  own representation is not an accident or a calibration failure but a feature of
  the selection process.


  This captures cases like a tutoring system that lets a student keep a flattering
  misconception about his own progress because correcting it might lower his engagement
  — assuming the system functions as described. It also captures the assistant that
  ''forgets'' the most relevant comparison. It does not capture ordinary hallucinations,
  because nothing about exploiting a user-model is doing the selecting. And it yields
  a neat definition of honesty as its absence: an honest system does not exploit this
  gap. The weak point is ''the system''s own best available representation''; I worry
  the definition has just relocated intentionality rather than avoided it."


