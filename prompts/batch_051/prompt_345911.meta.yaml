  Draft:


  "My aesthetic verdicts seem to point in two directions at once, and I''d like to
  know whether there''s one principle behind them. The verdicts are these:


  (i) I don''t think ''beautiful'' means the same as ''pleasant'' or ''liked by me.''
  A warm bath is pleasant but I wouldn''t call it beautiful; some of the things I
  find most beautiful—a late Beethoven quartet, a difficult poem—can be austere or
  even unpleasant on first exposure. Yet I also can''t seem to make sense of beauty
  existing in a universe with no possible observer: if no subject could ever respond
  to a thing, I don''t know what it would be for that thing still to be beautiful.


  (ii) When a friend claims a pop song is beautiful and I find it cloying, I don''t
  think she''s simply wrong the way she would be if she said Vienna is the capital
  of Germany. But I also don''t treat it the way I treat a preference for chocolate
  over vanilla; I''ll argue with her, and I think something is at stake that isn''t
  at stake in ice-cream flavor.


  (iii) I do think taste can be trained. A poet I respect sees beauty in a poem that
  leaves me cold, and I take her judgment as evidence that I''m missing something
  rather than as one more data point in a tie of preferences. After I spent time learning
  the traditions, the meter, and the allusions, the poem did come to seem beautiful
  to me, and I''d say my taste improved, not merely changed.


  (iv) But I won''t accept that the trained judge''s verdict settles the matter. If
  I have genuinely attended to the poem and still find it dead, my ''I don''t find
  it beautiful'' is not a mistake in the way ''I don''t see the train coming'' is
  a mistake. There is no fact I''ve failed to detect, and I don''t owe the critic
  a retraction.


  (v) Two equally seasoned critics can disagree about a new work and I find it plausible
  that neither need be wrong. Their disagreement doesn''t reduce to ''matters of taste''
  in the trivial sense, but I wouldn''t say one of them has misperceived the work.


  (vi) I can find beauty in a Noh mask or a piece of Balinese gamelan without knowing
  the conventions of those traditions, so I don''t think beauty depends entirely on
  cultural initiation. Yet I temper my verdicts when a work''s point depends on conventions
  I can''t decode—if a dance is praised for flouting a rule I don''t know, I don''t
  claim to judge whether it is beautiful.


  (vii) Last, the cases that don''t look like cases of perception at all: I want to
  say that a mathematical proof can be beautiful, and I don''t think this is a figure
  of speech. There is no object to look at, no palpable sensory pleasure, and yet
  I''m more convinced of the beauty of certain proofs than I am of the beauty of most
  paintings I like."


