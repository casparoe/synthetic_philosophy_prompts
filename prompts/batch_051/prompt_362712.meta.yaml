  Idea: A city''s restaurant-recommendation app currently shows, next to each restaurant,
  the cumulative count of visits by previous users this month. People often skip the
  line at an empty restaurant to join the one with a crowd, leading to self-reinforcing
  cascades. Proposal: instead of showing the raw count, the app shows each user a
  randomly down-weighted or noisy count — specifically, before displaying, the server
  multiplies the true count by a random factor drawn from a known distribution (or
  adds noise), then rounds; each viewer''s displayed number is an independent draw.
  The true totals are never shown. The question: what does this do to herding, to
  trust in the app, to users'' strategies of inference (they''ll notice the noise
  and try to undo it), gaming (restaurants buying fake visits; users refreshing the
  page to sample the noise multiple times — wait, if each viewer sees an independent
  draw, refreshing might reveal more draws and let them estimate the true count better).
  That''s a nice second-order effect: the noise gives strategic users an incentive
  to resample by refreshing/multiple accounts, and the variance itself is information.
  Also, if the distribution is known, users can in principle undo the noise partially
  by treating it as measurement error, but cascades might still form on the noisy
  signal; in fact noise could make cascades worse because the public signal is less
  informative, right? Actually adding noise to the public signal reduces its informativeness
  and could make people rely more on their private information — that''s the intent.
  But there are subtleties: if noise is known to be unbiased, rational users will
  still treat the noisy count as an unbiased but imprecise estimate, and a cascade
  still occurs when a long enough string of noisy public signals overwhelms private
  info. The likelihood-ratio logic: adding noise means more observations needed for
  a cascade, but cascades still form eventually, and the signal extraction problem
  becomes harder. The prompt could ask whether this actually stops cascades or just
  slows them, and where it breaks.


