  ---


  I am a retired geophysicist, and after many years away from the philosophy of physics
  I have been reading Poincaré''s Science and Method. The passage in which he discusses
  how a very small cause that escapes our notice can determine a considerable effect,
  and that we then say the effect is due to chance, has been bothering me. As I understand
  it, Poincaré is not saying that such effects are random in any metaphysical sense;
  he is saying that our classification of something as chance is often the shadow
  of a real sensitivity that makes the world unforecastable in principle. I would
  like you to take that idea seriously and interrogate it through a counterfactual.


  Imagine the following. Starting in 1850, the Earth''s atmosphere is exactly as it
  actually was, except for one change in the underlying fluid mechanics: for every
  pair of initial states that differ by a small amount, the distance between the resulting
  trajectories grows at most linearly with time. Exponential separation never occurs.
  The equations of motion remain deterministic; storms, fronts, cyclones, and ordinary
  weather still occur; only the explosive amplification of very small differences
  is gone. An initial error of one part in a trillion in the pressure field therefore
  cannot become a synoptic-scale difference within a week.


  I want your reasoned prediction of how the next 120 years of meteorology, forecasting,
  and ideas about chance go differently, not a story. Specifically: does the concept
  of a "butterfly effect" ever become culturally available? Does Lorenz-style chaos
  theory emerge, or would something else occupy its place? What happens to the notion
