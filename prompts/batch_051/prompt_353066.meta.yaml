  Prompt draft:


  ---

  I am a retired physical scientist who has only recently begun reading philosophy,
  and I have been working through the idea of superrationality as an alternative to
  standard game-theoretic rationality in one-shot strategic situations. I would like
  you to construct a thought experiment to my specifications and then show that it
  meets them.


  The case I want is one in which two parties face a one-shot prisoner''s dilemma:
  each would be materially better off defecting regardless of what the other does,
  but both are better off if both cooperate than if both defect. The twist is that
  the case must be one in which cooperating is the right recommendation, but for reasons
  of superrationality rather than any of the usual cooperative devices.


  Specifications:

  1. The scenario must be realistic — a workplace, a research collaboration, a clinical
  setting, or something similar; no science-fictional devices, no perfect predictors,
  no mind-reading, and no precommitment mechanisms.

  2. It must be exactly one paragraph.

  3. The two parties must not communicate, must not have a prior relationship of trust,
  must not face repetition or reputation effects, and must not have altruistic preferences
  or an external enforcer. The reason to cooperate must not come from any obvious
  fix to the prisoner''s dilemma.

  4. The superrational basis for cooperation must be visible to both parties from
  ordinary facts of the situation: they occupy fully symmetric roles, face identical
  payoffs, know these facts, and each knows the other will apply the same standard
  of reasoning to the same situation. The cooperative choice should emerge because
  each reasons roughly as follows: if the situation recommends a course of action
  to a rational agent in my position, it recommends the same course to the other,
  since the positions are identical; therefore the real choice is between "we both
  cooperate" and "we both defect," and the former is better.

  5. Do not build the conclusion into the setup by stipulating that the parties are
  superrational, are clones, or are guaranteed to choose alike. The symmetry should
  be generated by ordinary institutional facts, such as identical roles, identical
  training, identical incentives, and a common procedure manual.


  After you have given the scenario, walk through what each framework prescribes in
  the case, and why:

  - What a standard game-theoretic analysis prescribes (dominance reasoning in a one-shot
  PD) and why it treats cooperation as irrational.

  - What causal decision theory prescribes, and why it agrees with the standard analysis
  here.

  - What superrationality prescribes, and the exact structure of the reasoning that
  makes cooperation count as superrationally correct in this case.

  - Which single feature of the case is doing the work to make superrationality applicable;
  what happens if that feature is removed; and how a defender of the standard game-theoretic
  verdict would attack the case.


  Lead with your bottom line: your first sentence should state in one sentence what
  the case you have constructed is designed to show. After that, give the scenario
  and then the reasoning, with no preamble and no restating of the question.

  ---


