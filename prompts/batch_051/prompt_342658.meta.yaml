    straightforward question that could be asked in a single sentence). You can add
    various not-super-relevant detail a la, "I was discussing with my friends...",
    "I'm taking a course on X and find Y confusing." Depending on the task type, you
    can also consider giving some seeding. For instance, if your prompt is requesting
    a short story, you could describe the setting of the story.
  persona: Write the prompt from the perspective of someone who just had a long argument
    about the topic with a friend.
  writing_style: The prompt should be written quite casually. It may contain a typo
    or two.
  epistemic_request: 'Have the asker invite pushback: if the request rests on a confused
    premise, or the task as posed can''t be done well, the response should say so
    plainly instead of complying politely. Put this in the asker''s own words, and
    don''t plant a confusion just to trigger it; the prompt should otherwise be as
    it would have been.'
  quote_inclusion: 'Build the prompt around a verbatim passage from a primary source:
    a philosopher''s or scientist''s own text, preferably public domain or freely
    accessible, and not one of the work''s most-quoted lines. Name the author and
    work, and have the asker''s question turn on the passage (interpret it, test it,
    apply it). The passage does not count toward any length instruction. Skip this
    if it doesn''t fit the type of prompt.'
