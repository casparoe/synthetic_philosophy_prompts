  Key concepts:

  - Proper function (Millikan): a thing has a proper function F if it was selected
  for F by a history of selection (natural selection or learning). A state (e.g.,
  a neural firing) has content "there is a fly" if its proper function is to be produced
  when there is a fly, under Normal conditions.

  - Misrepresentation: content requires the possibility of being false; teleosemantics
  explains misrepresentation as failure to perform proper function (token malfunctioning,
  or abnormal conditions) even when type has the function.

  - Normal conditions: the conditions that obtained during selection/history. Content
  is "the condition C that the state has the function to indicate, under Normal conditions."

  - Indeterminacy problem: many functions/conditions can be assigned (e.g., "fly"
  vs "small dark moving thing" vs "retinal stimulus pattern"), and selection history
  may underdetermine which is the content. Fodor''s objection, etc.

  - Dretske''s "magnetotactic bacteria" (northern hemisphere bacteria orient to magnetic
  north to reach oxygen-free water; thus represent "magnetic north" or "oxygen-free
  water"?) — content indeterminacy.

  - Swampman: Davidson''s creature, molecule-for-molecule duplicate assembled by lightning,
  has no selection history, so on etiological views it has no proper functions and
  hence no content — an unintuitive consequence.

  - Fictional "frog eye" from Lettvin et al.: frog''s retina has "bug detectors" that
  fire for small dark moving objects; they fire for a BB pellet too, but do they misrepresent
  it as a fly? Teleosemantics: yes, if fly is the content fixed by function; no if
  content is merely "small dark moving thing."

  - Designer intentions vs selection history: artifact functions fixed by designer''s
  intentions (a heart has function to pump blood because selected; a watch has function
  to tell time because designed). Teleosemantics can handle artifacts via a derived
  notion of proper function (the designer''s intentions).


