  step 2 is bait. In SCM language: observational data plus assumptions (causal graph
  structure, Markov/faithfulness, no hidden confounding, functional form) can yield
  point or partial identification; the do-calculus tells you when an interventional
  distribution is identifiable from observational distributions. The argument trades
