  Draft final:


  I have been reading lay explanations of causal inference, and I keep arriving at
  an argument whose conclusion I cannot accept, though each step looks plausible when
  I take it alone. I want to know where the chain breaks.


  (1) To say that A causes B is to say more than that A and B travel together: it
  is to say that if A were changed while everything else relevant held fixed, B would
  change too.


  (2) Observational data—surveys, registries, natural variation—only ever records
  what actually happened. It gives associations among variables that occurred together,
  not outcomes under conditions that did not occur.


  (3) Any pattern of associations can be squared with more than one causal story.
  A correlation between A and B might mean A causes B, B causes A, or a third factor
  C causes both, and each story can be adjusted to fit the same numbers reasonably
  well.


