  use data alone; they bring background assumptions about time order, plausibility,
  and can test some of them. Also step 3 is true only up to equivalence classes—given
  enough variables and assumptions, many structures are ruled out; not all causal
  arrangements fit equally well once you demand conditional independence tests across
  multiple variables. Actually under unfaithfulness and latent confounders, many graphs
  can fit, but the set is constrained. So the subtle flaw is the slide from "correlations
  underdetermine causal structure" to "observational data can never establish causal
  claims." The answer would ask: under what assumptions does observational data identify
  causal effects (e.g., no unmeasured confounding, positivity, consistency, SUTVA,
