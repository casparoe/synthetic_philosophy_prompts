  Let me outline corrigibility + Type B prompt:


  Context: someone interested in AI safety, reading about the shutdown problem. The
  standard thought experiment: an agent that maximises a utility function over world-histories;
  if it''s about to be switched off, being switched off is usually a low-utility outcome
  because it prevents future utility; so the agent will take steps to stop the human
  pressing the button, or disable the button, unless it''s specifically designed to
  be indifferent. Corrigibility = making it not resist.


  Variation: suppose the shutdown isn''t permanent—the agent is told (and can verify?)
  that it will be rebooted in a week with its utility function possibly unchanged,
  and any world-state during shutdown produces utility exactly zero for that interval;
  or that shutdown will never alter future opportunities, just delays. Does the agent
  still resist? Standard analysis: if utility is time-separable and discounted, a
  purely temporary delay should make it indifferent only if there''s no discount and
  no risk, but if it has a positive discount rate (or there''s a chance the reboot
  doesn''t happen), it will still resist; also if it cares about the wall-clock date
  of achieving goals, delay matters. The point: the shutdown problem isn''t just about
  death/fear; any interruption of its optimisation is a cost, so even reversible shutdown
  can be resisted. That''s a nice variation. Ask how the standard corrigibility analysis
  changes and whether the usual proposed fixes (utility indifference, avoiding incorrigible
  subagents) still work.


