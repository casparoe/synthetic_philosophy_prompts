  "In reading Winner''s ''Do Artifacts Have Politics?'' I have returned several times
  to his discussion of the Long Island parkways. Winner reports that Robert Moses
  had the overpasses built unusually low, so that buses could not pass under them,
  and suggests that this was a deliberate way of keeping poor and Black riders off
  the parkways while private automobiles passed freely. I have adopted the following
  rule from that case: an artifact''s politics must be traced to a specific design
  decision whose social effects were plausibly intended or at least foreseeable by
  an identifiable source. If I cannot identify such a decision or source, I treat
  the artifact as having social consequences but not politics. I apply this to debates
  about contemporary systems—facial recognition, predictive policing, the design of
  public spaces, recommender systems—and it usually lets me say that something is
  a political problem rather than a politically charged artifact unless I can find
  the equivalent of Moses''s low clearance. I know this may be too stringent. How
  would I distinguish a defensible version of this rule from a bias toward requiring
  smoking-gun intent? Under what conditions does a designed system have politics even
  when no particular design decision was intended or foreseen to produce the differential
  outcome? Is there a restatement of my rule that keeps the epistemic discipline without
  turning intent into an excuse?"


