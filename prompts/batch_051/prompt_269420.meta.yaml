  loss is five times a single loss; there are five separate people, each with a claim
  no stronger than the one''s. A coin flip doesn''t favor the one; it gives all six
  equal prospects. You can''t say it gives the one person the power to cancel five
  claims unless you''ve already assumed the claims can be aggregated.

