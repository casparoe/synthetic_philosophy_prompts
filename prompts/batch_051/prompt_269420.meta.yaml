  A more standard framing of the dialectic:


  - Daniel: save the five because five deaths are worse than one.

  - Mara: that wrongly aggregates harms. Each of the six has an equal claim; the only
  fair way to respect equal claims is to give each an equal chance, so flip a coin.

  - Daniel: equal claims don''t require an equal chance of being saved; they require
  equal consideration in deciding. Taking into account the number of lives is a way
  of giving equal weight to each, because each extra life counts once more. A coin
  flip gives one person''s claim the power to cancel all five claims, which is not
  equal at all.

