  Let''s write prompt:


  I have been reading Wang Yangming''s recorded sayings (the Chuanxilu / Instructions
  for Practical Living), and one passage on the unity of knowledge and action has
  tied me in knots. He gives the examples of knowing cold and knowing pain: you don''t
  know cold in the abstract prior to feeling cold; the knowing is already a kind of
  undergoing. From this he concludes, as I understand him, that the person who knows
  filial piety but does not behave filially does not actually know filial piety. I''ll
  paraphrase because I can''t get the exact wording right. That passage seems to license
  a much stronger argument, which a classmate pushed me to spell out:


  (1) Knowledge and action in the genuine case are one; there is no temporal gap between
  them.

  (2) So if someone genuinely knows that x is right, their action already is x; if
  someone genuinely knows x is wrong, they refraining from x is already part of that
  knowing.

  (3) Therefore, whenever someone fails to do what they say they know to be right,
  they must not have genuinely known it.

  (4) But people do report knowing, with full sincerity, that something is right while
  not doing it — e.g., knowing that a donation would save lives, and not donating.
  If Wang is correct, such reports are self-deceiving or misdescribing something else.

  (5) Wang''s view seems to entail that moral akrasia is impossible, and that all
  wrongdoing is done in ignorance.

  (6) That conclusion seems too strong: it makes a guilty conscience in the ordinary
  sense incoherent, and it turns moral education into a matter of transmitting information,
  with practice and habituation as incidental.


  Where does this argument go wrong? I want to know which numbered step I should reject,
  and what rejecting it costs: does it force us to weaken the unity-of-knowledge-and-action
  doctrine into something less radical, and if so, which part of Wang''s view survives?
  Please also be explicit about which parts of your diagnosis are settled readings
  and which are contested among scholars of Wang Yangming or Chinese philosophy generally.


