  I am a retired experimental physicist who has lately taken up philosophy, and I
  keep returning to a pattern that feels both familiar from ordinary life and more
  troubling than I can yet articulate. I would be grateful for a rigorous treatment
  of it.


  Suppose a person can modulate a condition she lives with along a single dimension,
  from entirely tolerable at one end to clearly unbearable at the other. Offered a
  large sum of money to move, in one act, from the tolerable end to the unbearable
  end, she refuses, and no reasonable observer thinks her refusal was a mistake. Now
  offer her a long sequence of smaller payments instead: each payment requires her
  to advance exactly one step along the dimension, and each step is small enough that,
  taken by itself, it makes no difference she can reliably notice, while the payment
  attached to it seems plainly worth accepting. She accepts every step with full knowledge
  of the entire schedule in advance and eventually finds herself in precisely the
  condition she refused at the outset, for the same total sum of money. She and those
  around her regard each individual acceptance as unproblematic, yet many of the same
  people also regard the final position as one she should never have allowed herself
  to reach.


  The asymmetry I want to understand is between the single leap, which almost everyone
  refuses, and the stepwise route, which almost everyone accepts at each point. Is
  there a defensible principle that justifies treating a long chain of individually
  acceptable steps differently from accepting the endpoint outright? If there is,
  it must survive the case in which the steps are made arbitrarily small, she knows
  the whole schedule, and she is in every other respect a competent chooser. If there
  is not, then one of the two ordinary judgments has to be given up, and I would like
