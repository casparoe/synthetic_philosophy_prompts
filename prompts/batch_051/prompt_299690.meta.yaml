  "I am a retired scientist — physics, then a long spell in administrative roles —
  and have lately been reading philosophy with the luxury of time I once did not have.
  A pattern has come to bother me, and I would appreciate a careful treatment of it.


  Consider a woman facing a medical condition that can be varied along a scale from
  comfortable at one end to reliably awful at the other. If she were offered a large
  sum of money to move, in a single decision, from the comfortable end to the awful
  end, she would refuse, and we would all regard that refusal as sensible. But suppose
  she is instead offered a long series of small payments, each one for advancing a
  single step along the scale. Each individual step is so small that, taken by itself,
  it is barely perceptible and the payment seems clearly worth accepting; there is
  no step at which refusing the next increment, considered alone, seems demanded.
  She accepts every step and eventually occupies the very state she refused at the
  outset, for the same total sum. She knew the whole schedule in advance, and so did
  everyone around her. Most of us judge each local acceptance to be reasonable, yet
  also judge that she has made a mistake in ending up where she did.


  What I want is an argument that either reconciles these judgments or tells me which
  one to give up. Is there a defensible principle that forbids the single leap while
  permitting the stepwise path — for example, a principle about the relevance of imperceptible
  differences, or about what it is appropriate to evaluate at any one moment? Or is
  this a case where our practice embodies an inconsistency that no principle can repair?
  If you defend the judgment that each step is rationally acceptable, say what you
  make of the fact that the steps deliver exactly the endpoint she was right to refuse;
  if you defend a requirement to consider the whole package, say how that fits with
  the intuition that one can properly accept an individually negligible disadvantage.
  I am less interested in policy implications than in finding the form of the rational
  norm itself."


