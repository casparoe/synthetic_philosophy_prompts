  "I am a retired experimental physicist who has lately taken up philosophy, and I
  keep returning to a pattern that seems both familiar from ordinary life and troubling
  in a way I cannot yet articulate. I would be grateful for a rigorous treatment of
  it.


  Suppose a person is told that a condition she lives with can be modulated along
  a single dimension, from entirely tolerable at one end to clearly unbearable at
  the other. Offered a large sum of money to move, in one act, from the tolerable
  end to the unbearable end, she refuses, and nobody would call her refusal unreasonable.
  Now offer her a long sequence of smaller payments instead: each payment requires
  her to advance exactly one step along the dimension, and each step is so small that,
  taken by itself, it makes no difference she can reliably notice, and the payment
  attached to it seems plainly worth accepting. She accepts every step, having been
  told the whole schedule in advance, and eventually finds herself in precisely the
  condition she refused at the outset, for the same total amount of money. People
  around her, and she herself, regard each individual acceptance as unproblematic;
  many of the same people also regard her final position as one she should never have
  accepted.


  The asymmetry I want to understand is between the single leap, which we refuse,
  and the stepwise route, which we find acceptable at each point. Is there a principle
  that justifies treating a long chain of individually acceptable steps differently
  from accepting the endpoint directly? If so, that principle will have to survive
  the case where the steps are made arbitrarily small, she knows the whole schedule,
  and she is otherwise fully rational. If not, then one of the two ordinary judgments
  must be abandoned — and I would like to know which one, and what the coherent alternative
  looks like."


