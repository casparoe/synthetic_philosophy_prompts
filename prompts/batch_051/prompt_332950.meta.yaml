  I''m a novelist, and I''ve spent years charting what my characters believe and want
  on index cards, and I''ve noticed my own common sense about beliefs and desires
  is all over the place. I want to know if there''s any single account of belief and
  desire that gets my verdicts, or close, and which ones I should drop.


  Here are my gut verdicts, as best I can make them out. (1) When I say my character
  Adele believes her brother is alive even though I''ve written him dead, I think
  that''s literally true inside the fiction, not just a figure of speech. (2) When
  my dog waits by the door at six because I usually come home at six, I want to say
  he expects me but doesn''t quite believe I''m coming—there''s something thinner
  about it. (3) When a chess engine sacrifices a bishop "to open up the king''s position,"
  I don''t think it literally wants to open up anything; those are our labels, not
  its states. (4) But when a friend says she isn''t angry and then slams every cabinet
  in the kitchen, I''m happy to say she has a desire to punish someone, maybe without
  fully knowing it. (5) A character I wrote in an early draft believed her husband
  was having an affair, and in the final draft she doesn''t; I don''t think there''s
  a hidden fact about what she "really" believed besides what each draft says, but
  within each draft the belief is real. (6) A sophisticated language model that writes
  it "wants to be helpful" and "hopes you''re doing well"—I can''t bring myself to
  say it has beliefs or desires, even though the words are exactly the kind of thing
  I''d take as evidence of a belief in a person. (7) Yet with a person with Capgras
  syndrome who insists their spouse is an impostor while still acting warmly toward
  them, I''d say they both believe it and don''t, at different levels, and I don''t
  know how to fit that with the chess engine case.


  So: is there a principle (or a decent candidate or two) behind all this, stated
