  always ignore the information and the expected value of the optimal act conditional
  on the information is at least the value of the act chosen without it. I want you
  to play it straight: what would have to be true, fail, or be shown for that principle
  to be false as a guide to real rationality, or to be true only in a way that is
  practically inert?


