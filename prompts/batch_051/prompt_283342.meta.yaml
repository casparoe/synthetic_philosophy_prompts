  Boltzmann brain argument canonical (Carroll): In an eternally inflating / de Sitter
  universe with a cosmological constant, once the universe reaches thermal equilibrium
  (de Sitter vacuum), quantum/thermal fluctuations occasionally assemble localized
  low-entropy configurations. A fluctuation producing a single brain (with false memories
  of a coherent past) is much more probable than one producing an entire universe/planet/life.
  So over infinite time, Boltzmann brains dominate the set of observers, predicting
  we should be Boltzmann brains — a reductio of cosmologies that generate a large
  number of BBs relative to ordinary observers. The standard response: in cosmologies
  with a cosmological constant, ordinary observers are produced during the earlier,
  lower-entropy phase, not by fluctuations from equilibrium; and the rate at which
  BBs form might be negligible compared to ordinary observers if the vacuum decay
  rate is large enough or if the universe lasts long before equilibrium. But if BB
  production is indeed dominant, that''s considered a problem.


  Steps to present:

  1. If a universe settles into a stable high-entropy state (de Sitter vacuum) that
  lasts forever (or long enough), random thermal fluctuations will eventually realize
  every possible low-entropy arrangement, including arrangements that contain conscious
  observers.

  2. Among observer-containing fluctuations, a minimal one — a single disembodied
  brain, assembled with just enough structure to have experiences and apparent memories
  — is vastly more probable than a fluctuation that contains a whole planet, bodies,
  textbooks, and other people.

  3. Over the indefinite lifetime of such a universe, minimal observer-fluctuations
  will vastly outnumber ordinary observers such as us.

  4. If you are an observer but have no special reason to think you are one kind rather
  than another, you should assign overwhelming probability to being one of the far
  more numerous minimal observer-fluctuations — a Boltzmann brain.

  5. But our experience is of a stable, shared, law-governed world, not the evanescent
  chaos a Boltzmann brain would presumably inhabit; so the cosmology that generated
  this prediction is self-undermining, and we should reject it.


  Which step fails? Possibilities:

  - Step 2 is too quick: it underestimates what a minimal fluctuation must include.
  A bare brain is not a functioning observer; it needs a stable local environment,
  oxygen/energy gradient, and time to run a coherent stream of consciousness. The
  smallest fluctuation that could actually support an observer may not be small at
  all, and may be less probable than assumed. This is a good physical objection (but
  also debated; "Boltzmann brain" could be a momentary observer-moment, but our experience
  of extended temporality matters).

  - Step 3 equivocates between "fluctuations" and "observers of our kind": ordinary
  observers are not produced by fluctuations from equilibrium; they are produced during
  the earlier low-entropy era by ordinary thermodynamically open processes. Counting
  only fluctuation-produced observers is a category error.

  - Step 4 commits a self-locating probability fallacy: we should condition on all
