  inconsistency still a dilemma, or has the majority version simply been redescribed
  as an artifact of thresholding? At what thresholds does the dilemma appear, and
  does the thresholded-mean rule have the same problem of manipulability that the
  original argument flags for issue-wise majority voting?"


