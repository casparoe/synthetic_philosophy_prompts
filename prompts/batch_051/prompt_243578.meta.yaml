  Domain: Judgment aggregation and the discursive dilemma. This is a formal theory
  in social choice: a group of individuals whose individual judgments on logically
  connected propositions are consistent, but majority aggregation can produce inconsistent
  collective judgments. Classic example: three judges on a three-proposition set {P,
  Q, P∧Q}. Judge A: P yes, Q no, P∧Q no. Judge B: P no, Q yes, P∧Q no. Judge C: P
  yes, Q yes, P∧Q yes. Majority: P yes (A,C), Q yes (B,C), P∧Q no (A,B). Inconsistent:
  P and Q but not P∧Q. This is the discursive dilemma (Pettit, List). Doctrinal paradox
  in law.


  This domain is quite formal and niche-ish but LLMs will know the discursive dilemma.
  Could combine with type 1 (homemade theory) or type 3 (analogy) or type 2 (vary
  classic puzzle).


  Type 2: vary a classic puzzle. The discursive dilemma itself is a kind of puzzle/paradox.
  Could vary: change majority threshold, weights, number of propositions, allow abstentions,
