  Variation ideas:

  1. Thresholds: replace simple majority with 2/3 supermajority. With three judges,
  2/3 means at least 2, same as majority. Not interesting unless more judges.


  2. Abstentions and quorum: allow judges to abstain; aggregates by majority of expressed
  votes but with quorum rules. Then the dilemma can be generated or avoided by who
  abstains. In the classic example, if some judges abstain on some propositions, majority
  of expressed votes changes.


