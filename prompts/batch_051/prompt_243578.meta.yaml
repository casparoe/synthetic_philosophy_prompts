  Let me draft a type 1 prompt on judgment aggregation:


  "Here is a distinction I keep using and would like checked. I call it ''verdict
  aggregation'' versus ''world aggregation.'' A committee can aggregate what its members
  take to be true of the world (world aggregation), or it can aggregate what they
  are prepared to do or declare on the basis of those beliefs (verdict aggregation).
  I think the discursive dilemma arises because we run these two together: under world
  aggregation the group holds an inconsistent set of beliefs but is in no sense irrational,
  since no member is; the inconsistency belongs to the group, not to any mind, and
  it is only a problem if the group is then supposed to act as if it had a single
  mind. Under verdict aggregation the inconsistency is genuinely a problem, because
  a body cannot be said to have decided contradictory things without failing its procedural
  duty. My claim is that the discursive dilemma is therefore not about aggregation
  at all but about the difference between a group that describes a world and a group
  that resolves to act. Is this already in the literature? It feels too clean not
  to be. Where does it break — does the dilemma really disappear under world aggregation,
  or does the problem come back as soon as the group must rely on those world-beliefs
  as premises for one further decision?"


