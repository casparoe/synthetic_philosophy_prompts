  Let me carefully recall:


  Factorizability (conditional on λ, and settings a,b):

  P(A,B | a,b,λ) = P(A | a,λ) · P(B | b,λ).


  Jarrett (1984) split factorizability into:

  - Parameter independence (PI): P(A | a,b,λ) = P(A | a,λ). (Marginal probability
  of outcome at one wing does not depend on the setting at the other wing.)

  - Outcome independence (OI): P(A | a,b,B,λ) = P(A | a,b,λ). (Probability of outcome
