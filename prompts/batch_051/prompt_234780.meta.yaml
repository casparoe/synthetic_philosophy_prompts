  Let''s draft:


  "I keep running into a version of this in my reading group, and I need an actual
  philosopher to sort it out rather than a guy with a blog (no offense). I''m attracted
  to a deflationary theory of truth — something like Horwich-style minimalism or the
  disquotational view: the whole content of calling a sentence true is exhausted by
  the disquotation schema, ''snow is white'' is true iff snow is white, and the function
  of ''true'' is mostly expressive, letting us endorse infinite conjunctions or blind
  ascriptions like ''what Sarah said is true.'' I also have a strong, persistent intuition
  I can''t shake: when I say general relativity is *closer to the truth* than Newtonian
  mechanics, I''m not just saying one set of sentences is more useful or better confirmed.
  I''m attributing a property that comes in degrees — approximate truth, verisimilitude,
  distance from the way things actually are — and I take that to be involved in explaining
  why later theories do better. It feels like a brute fact about the world, not just
  about our language.


  But it''s not obvious to me that deflationism actually forbids this. Maybe minimalism
  is only a theory of the word ''true'', not of truthlikeness, and the latter is just
  a separate relation between theory and world that deflationists can happily quantify
  over. Or maybe once you give up truth as a substantive property, you''re left with
  no non-circular way to explain what ''closer'' means; verisimilitude talks just
  become disguised talk about our standards of evidence, and my intuition is a reification.
  I can''t tell which move is right, or whether there''s a reading on which they''re
  compatible.


  Please act as an expert philosopher of language, someone who has actually waded
  into deflationism and scientific realism. I want you to do more than split the difference.
  Work through the strongest version of each side: (a) the intuition that science
  literally gets closer to the truth is a core explanatory posit and shouldn''t be
  debunked cheaply; (b) deflationism''s systematic virtues — simplicity, dissolving
  pseudo-problems about the nature of truth, avoiding correspondence-mongering — make
  it attractive. Then give me a negotiated verdict: should the intuition be dropped
  as a pre-theoretic gloss, should deflationism be amended or modified to accommodate
  degrees of truth, or is there a reading where they''re compatible? Say what would
  justify each move, and be specific about which feature of my intuition is doing
  the work. Answer in American English."


