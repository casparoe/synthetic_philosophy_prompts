  protest against the bombings. For context that you can take as given: in the 1950s,
  when Oxford planned to award Harry Truman an honorary degree, Anscombe objected.
  Her position, roughly, was that intentionally killing the innocent — and in particular
  deliberately targeting civilian populations as a means of ending a war — is murder,
  not a lesser evil; that the bombings of Hiroshima and Nagasaki did exactly that;
  and that Truman, who ordered them, was therefore not someone to be honored. The
  film, by contrast, is more ambivalent: it follows Oppenheimer through the Manhattan
  Project, the Trinity test, the bombings, and his later security hearing, and it
  dramatizes both the exhilaration of the science and the moral horror, including
  the argument that the bomb would end the war and save lives, and a scene in which
  Truman dismisses Oppenheimer''s guilt.


