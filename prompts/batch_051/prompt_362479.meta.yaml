  The prompt is good but the asker says "I thought Adams''s thesis was one of the
  more solid results about conditionals." The answer: the standard moves are:

  - Deny closure under conditionalization (Adams''s thesis is only about a single
  rational credence function, not about every conditionalization; but that''s arguably
  ad hoc because rational updating should preserve rationality constraints).

  - Deny that conditionals are propositions in the domain of P (so law of total probability
  doesn''t apply). This is Adams''s own view: conditionals don''t express propositions;
  they have "assertibility conditions" measured by conditional probability. But then
  "P(A→C)" is not really a probability of truth; it''s a different quantity (degree
  of assertibility), and step (2) presupposes it''s a random variable.

  - Deny embedding: conditionals can''t be embedded under negation or in conditional
  positions; so P(A→C | C) is undefined, because you can''t conditionalize on the
  conditional? Wait step (3) conditions on C, a plain proposition, not embedding the
  conditional. The thesis is applied to the probability function P(·|C). So P(A→C
  | C) is well-defined if A→C is an event. The issue is whether the thesis must hold
  for the conditionalized function. One can reject the claim that Adams''s thesis
  is preserved under Bayesian conditionalization. But that''s a real cost: if the
  thesis expresses a constraint on rational credence, updating on evidence should
  keep credence rational.


  So a good answer: the argument is valid; the likely escape routes are (i) conditionals
  don''t express propositions (denying that P(·) is a probability of truth), (ii)
  Adams''s thesis isn''t closed under conditionalization, (iii) the thesis holds only
  for simple, unembedded conditionals and the proof''s applications to P(A→C|C) embed
  it under conditioning. Price of each. That''s rich and exactly type 3.


