  Frege-Geach: I know it well. Expressivism (non-cognitivism about a domain, typically
  ethics): moral sentences conventionally express non-cognitive attitudes like approval/disapproval,
  rather than beliefs or descriptive propositions. Frege-Geach problem (Geach 1965,
  Searle 1962): even if "lying is wrong" expresses disapproval in an atomic utterance,
  the same sentence occurs embedded in conditionals, disjunctions, negations, questions,
  and in valid arguments: (P1) Lying is wrong. (P2) If lying is wrong, then getting
  your little brother to lie is wrong. (C) Therefore getting your little brother to
  lie is wrong. The first premise and antecedent express something non-cognitive;
  but in the antecedent the speaker need not disapprove of lying; the inference is
  valid in virtue of semantic content that must be shared across embedded and unembedded
  occurrences. Expressivism must explain how moral sentences have a compositional
  semantics and how moral arguments can be valid without treating moral sentences
  as describing facts or expressing beliefs. The problem is widely considered the
  central challenge; Blackburn''s quasi-realism, Gibbard''s norm-expressivism with
  hyperplan/worlds, Schroeder''s hybrid? etc.


