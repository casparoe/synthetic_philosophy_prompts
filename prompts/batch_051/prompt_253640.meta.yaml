  Let me refine to be crisp:


  For a discussion group, I''ve been asked to write down my views on the limits of
  the criminal law, and I''d like a consistency check before I present. Here they
  are:


  1. Private, consensual conduct between adults should be none of the criminal law''s
  business, no matter how degrading or "unnatural" other people find it.

  2. A society may use the criminal law to protect its basic shared institutions —
  for instance, the family or the practices surrounding the dead — even when no specific
  individual is harmed by the conduct being punished.

  3. The harm principle, taken literally, is too narrow to account for everything
  the criminal law may legitimately do.

  4. The mere fact that a majority finds conduct disgusting is never, by itself, a
  sufficient ground for criminalizing it.

  5. If a practice spreads widely enough, it can change what people are able to regard
  as wrong, and a society is entitled to take that long-term effect into account when
  it decides what to criminalize.


