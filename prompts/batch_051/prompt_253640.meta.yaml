  Let me design commitments:


  (a) I think the criminal law should not be in the business of making people virtuous,
  and that private, consensual conduct should generally be none of the law''s business.

  (b) I think a society is entitled to use the criminal law to protect the shared
  understandings that its basic institutions depend on — for example, the understanding
  that marriage is exclusive, or that the dead are owed certain treatment — even when
  no assignable individual is harmed by a violation.

  (c) I think the harm principle, taken literally, cannot explain why we may punish
  someone for desecrating a corpse that no one alive cares about, but I still think
  such punishment can be legitimate.

  (d) I think the mere fact that conduct is seen as "unnatural" or degrading is never
  a sufficient reason to criminalize it.

  (e) I think that if a practice becomes common enough, it can change what people
  are able to feel as wrong, and that a society may take that into account when deciding
  what to criminalize.


  Now tensions:

  - (b) and (e) vs (a)/(d): genuine tension, but not obvious? (b) and (e) are basically
  Devlin''s disintegration thesis; (a) and (d) are Hartian. The asker holds both.
  The tension is real: if shared moral sentiments can be protected for their own sake,
  then private consensual conduct that erodes them could be criminalized, which contradicts
  (a). But (a) says "generally" not absolutely, and (d) says "mere fact... never sufficient."
  So there''s a reconciliation: the state may criminalize to protect institutions,
  not morality per se. The hard question: is protecting institutions just enforcing
  morality indirectly? This is the classic Hart–Devlin issue. The tension is genuine
  but has a possible fix.


  - (c) and (d): apparent tension? (c) allows punishing corpse desecration with no
  assignable harm; (d) says "unnatural" is not sufficient. These are compatible if
  the ground for (c) is something other than unnaturalness (e.g., protecting a shared
  practice of respect for the dead). So an apparent tension that dissolves.


