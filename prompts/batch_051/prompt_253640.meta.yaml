  5 says society may criminalize it to prevent erosion of moral sensibility, while
  1 says no). Also 2 vs 1 (protecting family could involve criminalizing private conduct
  like...). 5 is Devlin''s disintegration thesis; 1 is Hartian.

  - Apparent tension: 2 vs 4 — looks like enforcing morality, but can be reconciled
  if the ground is protecting institutions rather than enforcing disgust. Also 3 vs
  1? 3 says harm principle too narrow; 1 says private conduct should be free — these
  are compatible because 3 might be about corpse desecration or public order, not
