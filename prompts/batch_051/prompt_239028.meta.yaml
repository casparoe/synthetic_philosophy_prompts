  Potential prompt:


  "I''m putting together a paper on the question of when Latin becomes Italian, and
  I keep running into a more basic problem: I don''t actually have a criterion for
  when two ways of speaking count as the same language, either across time or across
  communities, and my ordinary judgments run ahead of any definition I can state.
  So I''d like a working definition of ''the same language'' — or, if you think the
  phrase is ambiguous, a definition of the diachronic notion I actually need, namely
  being stages of one language rather than successive languages.


  Here are the cases I want the definition to handle. I''m confident that the standard
  Italian of Milan and the standard Italian of Palermo are the same language, despite
  accent and lexical differences; and I''m equally confident that Classical Latin
  and contemporary Italian are not the same language, even though the latter descends
  from the former by an unbroken chain of speakers. The cases I genuinely don''t know
  how to classify include: the spoken Latin of Gaul around 700 and what scholars call
  Old French three centuries later; Serbian and Croatian, which are mutually intelligible
  but politically distinct; Old English and Modern English, which are traditionally
  treated as stages of one language despite being mutually unintelligible; and an
  imagined case in which each generation in an isolated village understands its parents
  and its children perfectly, but the generation at the end of a thousand-year chain
  cannot understand recordings of the generation at the beginning. I''d also like
  a verdict either way on whether Mandarin and Cantonese are the same language, if
  the definition can be applied there.


  Please propose a definition, run it through all the cases, say explicitly where
  it gives the wrong answer or no answer, and then either revise it or defend the
  surprising verdicts. Throughout, I''d ask you to separate what is settled descriptive
  linguistics from what is a genuinely contested conceptual choice — for instance,
  mutual intelligibility, unbroken transmission, structural distance, and political
  self-identification all pull in different directions, and I don''t want any one
  of them presented as the agreed-upon criterion."


