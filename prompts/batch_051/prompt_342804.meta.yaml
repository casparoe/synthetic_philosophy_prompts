  own amendment, can it be used to amend itself? If a rule-change changes the rule
  that authorises the change, which rule authorised the change — the old or the new?
  Two views:

  - The amendment must be authorised by the old rule at the moment of change; the
  new rule''s validity is derivative, so it''s fine (the old rule authorised changing
  itself). The old rule governs the act; the new rule governs later acts.

