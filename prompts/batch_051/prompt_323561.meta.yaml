  "I am writing a paper defending what I will call the fitting-response view of negative
  emotion, and I need a thought experiment built to order. Construct a one-paragraph
  case comparing two possible lives of the same person after the same grave loss —
  the death of a deeply loved person. In the first life the person grieves: the grief
  is fully informed, deep, and sustained, but not disabling. In the second life the
  absence of grief is produced by a realistic post-loss intervention (for example,
  a drug that blunts affective response to the loss), not by ignorance, denial, or
  any difference in the facts believed. The case must be engineered so that hedonism
  and a simple actual-desire-satisfaction theory both rank the non-grieving life as
  the better of the two, while the fitting-response view ranks the grieving life as
  the better of the two. The fitting-response view, as I mean it, holds that a life
  goes better not only through pleasure or the satisfaction of desires but also through
  its emotional responses being fitting to their objects: joy at the genuinely good,
  grief at a genuine loss. On this view fitting grief is itself a constituent of a
  life lived in proper contact with what matters, and when the loss is of something
  of great value, the fittingness of deep grief can outweigh the felt pain of that
  grief; a post-loss emotional blank, however comfortable, is a defect in the life,
  not merely the absence of a symptom. To make the desire-satisfaction verdict straightforward,
  build the case so the person has no antecedent or second-order desire to grieve
  and no desire that grieving would satisfy; the only desires at stake are a desire
  for comfort and a desire for the loved person''s welfare, with the second equally
