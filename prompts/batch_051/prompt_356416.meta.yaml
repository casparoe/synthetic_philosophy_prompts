  seek out free information, since refusing costless information would be passing
  up a nonnegative expected gain, and an expected-utility maximizer should never pass
  up an option that can only help in expectation. The only exceptions would be cases
  where the information itself changes the decision problem, but those are outside
  the theorem rather than counterexamples to it."


