  A result sometimes called Good''s theorem says, roughly, that the expected value
  of cost-free information is never negative: an agent who may observe a signal before
  choosing an act can expect to do at least as well as an agent who must choose without
  the signal. (a) State the result precisely, making clear what it assumes about the
  agent and what exactly it concludes. (b) Explain the proof idea. (c) Identify two
