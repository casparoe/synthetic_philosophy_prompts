  each failure does to the conclusion. (d) Does the result show that a rational agent
  should always seek out free information? Justify your answer.


  Student answer:


  Good''s theorem states that the expected value of information is always positive
  when the information is free. To prove it, let a* be the act that maximizes expected
  utility relative to the agent''s prior beliefs, and let a_s be the act that maximizes
  expected utility relative to the agent''s posterior beliefs after observing signal
  s. Since a* is an act the agent could still choose after seeing s, the posterior
  expected utility of a_s must be at least that of a*. So for each signal s, EU(a_s
  | s) ≥ EU(a* | s). Taking expectations over signals, weighted by the prior probability
  of each signal, gives E_s[EU(a_s | s)] ≥ E_s[EU(a* | s)] = EU(a*), where the last
  equality follows from the law of iterated expectations. Hence the expected value
  of the information, E_s[EU(a_s | s)] − EU(a*), is nonnegative—indeed positive whenever
  there is at least one possible signal that would change the agent''s choice.


  The result assumes that the agent updates by conditionalization, that the information
  is free, and that the agent chooses the act that maximizes expected utility relative
  to her updated beliefs. If any of these assumptions fails, the conclusion can fail.
  For example, if the agent updates in a biased way, the information may push her
  posterior away from the truth and the value of information can be negative. Also,
  in realistic settings information is rarely free in the relevant sense, because
  acquiring and processing it takes time and attention; these are real costs, so the
  theorem is consistent with its often being rational to pay nothing for information
  one has to process.


