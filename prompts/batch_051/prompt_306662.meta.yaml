  In my department’s ethics working group, a dispute about what adult children owe
  their parents has been running for nearly two years without either side moving,
  and I want a diagnosis of the disagreement itself rather than a verdict on which
  position is correct.


  The first camp defends what I will call the debt model. On this view, whatever obligations
  grown children have toward their parents are grounded in what the parents actually
  did: years of care, material support, and sacrifice generate obligations of repayment,
  or at least of gratitude, whose content tracks the size and character of those past
  contributions. The obligations are backward-looking; they can survive the cooling
  of affection, and they explain why even an emotionally difficult parent can sometimes
  still have claims.


  The second camp defends the friendship model. On this view, there is no debt-like
  obligation of repayment to one''s parents at all. Whatever adult children owe arises
  from the ongoing relationship itself — and only when that relationship is the kind
  of thing a friendship is: reciprocal, voluntary, and valued by both parties. The
  past matters, but only by way of shaping the present relationship; it does not function
  as an independent ledger. Abuse, neglect, or estrangement therefore do not "cancel
  a debt"; they show that the relationship out of which obligations could arise did
  not exist or has ended.


  What puzzles me is that the two groups agree on nearly every concrete case, and
  each can absorb the other''s favorite data. The debt theorist says: if obligations
  are grounded only in the present relationship, then a grown child could walk away
