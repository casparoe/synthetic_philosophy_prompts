  So my book club read Montaigne''s essay "Of Cannibals," and two people got into
  a long argument about it that I wanna get sorted out. They both know the essay pretty
  well, and neither is a scholar, but they came armed. I''ll reconstruct it as close
  as I can.


  Priya said the essay is, at bottom, a piece of cultural relativism. Her claim was
  that the whole structure of the essay is: you think the Brazilian Tupinambá are
  barbarous for roasting and eating their dead enemies, but that''s only because you''re
  using your own customs as the standard. Montaigne opens by saying we call barbarous
  whatever falls outside our own practices, and that custom is the only thing we ever
  really appeal to when we call something true or reasonable. Then he describes the
  Tupinambá''s warfare, their prisoners, their songs, their polygamy, and shows that
  from inside their way of life these practices have a logic: the prisoner is honored,
  fed, housed for months, and given a chance to speak back; the eating isn''t for
  nourishment, it''s a kind of grim ritual of revenge and courage. So there isn''t
  some neutral vantage point from which we can say their way is worse. At most he''s
  showing that our horror is parochial.


  Dan pushed back. He said no, Montaigne''s actual argument is pointed and comparative,
  not equalizing. The essay doesn''t say "both practices are equally fine." It says
  the Europeans are more barbarous, and it gives a specific reason: the Tupinambá
  kill a man in war and eat him after he''s dead, whereas Europeans roast a man alive,
  stretch him on the rack, let dogs and pigs tear at his still-feeling body — and
  do it in the middle of their own religious civil wars, supposedly in the name of
  God. That''s a ranking, Dan said, and the ranking rests on a criterion Montaigne
  treats as universal: cruelty is measured by what you do to a living, feeling person,
  and by whether the act serves something beyond sadism. By that standard the cannibals
  come off better, not because the standard is "theirs," but because the Europeans
  fail even their own professed standard of humanity.


  Priya came back: sure, he ranks them, but that doesn''t make him a universalist.
  He''s doing what a satirist does — he''s borrowing the audience''s own categories
  (piety, humanity, barbarism) and showing they generate an embarrassing verdict.
  But the deeper skepticism of the essay is that any such verdict is an artifact of
  a custom too. The fact that he picks "suffering inflicted on the living" as the
  measure is itself a choice, not a discovery. There are ways of ranking these acts
  where the Tupinambá come off much worse — terrorizing prisoners for months before
  killing them, treating eating a human body as fine in itself, and so on. Montaigne
  doesn''t prove his criterion; he just switches which local lens he''s looking through.
  And his lens, Priya said, is this idealized "nature" — he keeps calling the Tupinambá
  natural, unspoiled, close to the source — while describing a people with wars, class
  distinctions, prophets, and elaborate ritual. That''s not nature, it''s a pastoral
  fantasy, which is just another custom wearing a different mask.


  Dan answered that the living/dead distinction isn''t a random local preference,
  and calling the Tupinambá "natural" is Montaigne''s way of saying they haven''t
  added a layer of cruelty that even they wouldn''t need for their own goals — not
  that they have no culture. He pointed to the bit at the end where three Tupinambá
  visit France and are astounded that thousands of armed men obey a child king, and
  that the poor don''t just kill the rich or burn their houses. The point of that
  anecdote, Dan said, is that the Tupinambá are judging the French by the very sort
  of rough natural criterion — why would the strong submit to a child, why would the
  starving tolerate the full? — that Montaigne endorses. So Montaigne is not just
  flipping local lenses; he''s advancing a substantive standard, something like: force
  that isn''t noble or self-imposed, and suffering that isn''t necessary, are worse
  than acts that at least have a kind of valor and function inside a way of life.


  Priya said that last bit gives the game away: "inside a way of life." If the valor
  and function of cannibalism can be certified only from inside the Tupinambá way
  of life, then the standard itself is internal to a way of life, and we''re back
  to relativism with extra steps. Also, she added, Montaigne''s skeptical opening
  — custom is the only criterion of truth and reason — applies to his own essay too.
  If he''s right about that, then his appeal to "nature" is just another custom, and
  the whole comparative ranking is undercut by his own premise. If he''s wrong about
  that, then the relativist reading of the essay collapses for a different reason,
  but so does half the essay.


  There was a bit more back and forth after that, mostly about whether Montaigne actually
  endorses the Tupinambá''s judgments of France or is just using them to embarrass
  the French the way he used the French to educate the Tupinambá, but I think I got
  the main thread.


  I genuinely can''t tell who got the better of it. Can you go through their exchange
  and rule on the exact claims — where each of them is right, where each overreaches,
  and whether there''s a reading that keeps the parts of both that actually survive?
  I''m less interested in who "wins" than in which specific moves hold up.


