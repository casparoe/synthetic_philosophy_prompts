  as the problem of relevance: how a cognitive agent knows what to consider and what
  to ignore, how it updates its world model. In fiction with AI characters, a common
  error: writers make the AI either omniscient about plot-relevant info or inexplicably
  oblivious. A procedure for the novelist could operationalize: when the AI takes
  an action or observes a change, list what changes (direct effects), what plausibly
  stays the same (inertia/default assumptions), what the AI is "paying attention to"
  given its relevance filter, and what it fails to update because it''s outside its
  frame. The procedure would ask: (1) What is the action/event? (2) What are the direct
  intended effects? (3) What are the immediate physical/causal consequences (ramifications)?
