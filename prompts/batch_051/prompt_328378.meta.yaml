  Let me flesh out Ellsberg type 2.


  The asker holds (as a "decision theorist / behavioral economist"):


  (1) Expected utility theory with a single, well-defined subjective probability is
  the right normative model for decision under risk — when probabilities are objective
  and fully known.


  (2) In decision under uncertainty, where probabilities are not objectively given,
  it can be rational to exhibit the Ellsberg preferences: prefer a bet on a known-probability
  event to the corresponding bet on an event with unknown probability, even though
  no single prior makes both choices expected-utility maximizing.


  (3) The right formal model of this is the smooth ambiguity model: represent the
  agent as having a second-order probability measure over the possible first-order
  priors, and evaluate acts by the second-order expectation of a concave function
  of their first-order expected utility. (The concavity is what makes them ambiguity-averse.)


  (4) Ambiguity aversion and risk aversion are distinct phenomena with distinct sources;
  specifically, the Ellsberg pattern cannot be fully reduced to ordinary first-order
  risk aversion, but can be understood as aversion to second-order risk — uncertainty
  about the correct probability.


  (5) A rational agent''s attitude toward ambiguity should be invariant across different
