  ---


  I am a third-year undergraduate taking a seminar on value pluralism and the ethics
  of compromise, and in parallel I coordinate a small student mediation program in
  our residence life office. We handle disputes between student organizations whose
  members hold sharply different value commitments — religious, political, environmental,
  dietary — where the university encourages us to seek "common ground" but gives us
  no method for deciding when common ground is a good thing.


  Our course has been developing a picture of compromise I find persuasive but hard
  to make operational. On this picture, because value systems don''t all rank the
  same goods the same way, two groups can sometimes trade concessions so that each
  side ends up better off by its own lights than it would be under the status quo
  or after a victory by default. Compromise of this kind need not be a failure of
  conviction; it can be a way for each side to realize more of what it actually values.
  But the picture also marks off several failures: a compromise can be coercive (extracted
  by power rather than consented to), corrupt (one side trades away a commitment it
  holds to be non-negotiable), exploitative of third parties, or merely strategic
  (a truce that papers over the conflict without either side gaining anything it values).


  I want a decision procedure my mediators can actually run. Be specific about the
  following.


  First, give me a screening procedure — the questions in order, what counts as a
  sufficient answer to each, where the procedure returns a clear "no deal" or "this
  needs escalation," and where it hands the decision to a person because the question
  is one of values rather than facts. The procedure has to be teachable in a ninety-minute
  training session to undergraduates who have not taken the seminar, and runnable
  in under twenty minutes before a mediation. It should output one of three things:
  (a) a recommendation that this is the kind of compromise the course''s picture endorses;
  (b) a recommendation against pursuing it as a moral compromise; or (c) a flag that
