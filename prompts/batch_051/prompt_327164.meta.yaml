  ---


  I am a third-year undergraduate taking a seminar on value pluralism and the ethics
  of compromise, and I also coordinate a small student mediation program in our residence
  life office. We see about one dispute a week between student organizations with
  sharply different value commitments — religious, political, environmental, dietary.
  Our recommendations influence which organizations receive space, funding, and recognition,
  so the stakes are modest but real, and the Dean of Students'' office signs off on
  our memos.


  The seminar has been developing a picture of compromise I find persuasive but hard
  to make operational. On this picture, because rival value systems do not rank the
  same goods the same way, two groups can sometimes trade concessions so that each
  ends up better off by its own lights than it would be under the status quo or after
  a winner-take-all outcome. Compromise of that kind need not be a failure of conviction;
  it can be a way for each side to realize more of what it actually values. But the
  picture also marks off several failures: a compromise can be coercive (extracted
  by power rather than genuinely consented to), corrupt (a side trades away a commitment
  it holds to be non-negotiable), exploitative of third parties, or merely strategic
  (a truce that keeps the peace without either side gaining anything it values).


  I want a decision procedure my mediators can run. It must be teachable in a ninety-minute
  training session to undergraduates who have not taken the seminar and runnable in
  under twenty minutes before a mediation. It should return one of three outputs:
  (a) this is the kind of compromise the seminar''s picture endorses; (b) this should
  not be pursued as a moral compromise; or (c) the procedure cannot decide and the
  matter should be escalated to the Dean of Students'' office, with the reason stated.


  Please give me: (1) the procedure itself — the questions in order, what counts as
  a sufficient answer to each, where it returns a "no" or an escalation, and which
  distinctions from the theory must survive in the procedure and which can be dropped
  for usability; (2) an explicit marking of the judgment calls your procedure cannot
  eliminate, and where it is likely to misfire — compromises it will wrongly approve
