  Prompt:


  I coordinate public consultation meetings for a municipal planning department. We
  hold them roughly monthly, sometimes on decisions with high stakes and deeply polarized
  participants (housing density, flood-control measures, siting of social services).
  The department wants a standard facilitator''s procedure grounded in Habermas''s
  ideal speech situation, to make meetings fairer and less subject to domination by
  the loudest or most powerful voices. I am not a philosopher and neither are most
  participants.


  Please translate Habermas''s ideal speech situation into a practical decision procedure
  I can run in each session. In his early formulation, the ideal speech situation
  asks that every participant capable of speech and action be allowed to take part;
  that everyone be allowed to question any assertion whatever; that everyone be allowed
  to introduce any assertion whatever; that everyone be allowed to express their attitudes,
  desires, and needs; and that no speaker be prevented, by internal or external coercion,
  from exercising those rights. Treat those requirements as the design target.


  The procedure should be a checklist or sequence of tests in order, with: what questions
  to ask before and during a meeting; what counts as a sufficient answer to each;
  where the procedure stops with a no or sends the meeting to a different format;
  where it must hand the decision to a person because a Habermasian condition conflicts
  with another value or cannot be checked empirically; and which distinctions in Habermas''s
  original account must survive the simplification and which can be dropped for a
  two-hour meeting with non-specialists.


  Then apply your procedure to three scenarios: (1) a meeting about whether to build
  a flood-retention basin that would require removing a community garden; (2) a meeting
  at which a small group of repeat speakers tries to define the agenda before others
  can speak; and (3) a meeting where an expert consultant''s technical model is repeatedly
  challenged by residents as biased, and the facilitator must decide whether to treat
  the challenges as obstruction or as legitimate questioning. Include the likely answer
  for each, and identify one scenario where the procedure gives an answer I or the
  department will not like. Finally, say what the procedure cannot do—particularly
  what it cannot guarantee about power, sincerity, or consensus.


