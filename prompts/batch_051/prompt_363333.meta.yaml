  Davidson''s relevant ideas: Radical interpretation starts from evidence of which
  sentences the speaker holds true, and assigns truth conditions to maximize agreement
  (charity); meaning is holistic; the "principle of charity" says assume the speaker
  is largely right and rational so interpretation can get off the ground. In "A Nice
  Derangement of Epitaphs," Davidson distinguishes prior theory (interpreter''s standing
  theory for the language) and passing theory (the theory adjusted on the fly for
  the occasion, including malapropisms). He argues communication depends on convergence
  of passing theories, not sharing a prior theory/language. A malapropism like Mrs.
  Malaprop saying "a nice derangement of epitaphs" for "a nice arrangement of epithets"
  — the hearer uses passing theory to interpret.


