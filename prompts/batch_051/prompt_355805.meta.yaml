  The analogy: In debates about whether a compelling theory can override firm intuitions
  (e.g., utilitarianism telling you to harvest organs in a transplant case; or physicalism
  explaining away the intuition that consciousness is nonphysical), defenders of intuition
  often say: philosophical intuitions play the same role in philosophy as observations
  in science — they''re the data that theories must accommodate, and rejecting a firm
  intuition is like rejecting a clear observation just because it doesn''t fit your
  theory.


  Audit asks: what maps to what, where it breaks, what it smuggles in, does the conclusion
  (compelling theory should not override firm intuition) survive once disanalogies
  are on the table.


  Mapping:

  - intuition about a thought experiment ↔ observation in an experiment

  - philosophical theory ↔ scientific theory

  - firm/clear intuition ↔ clear observation

  - thought experiment ↔ experimental setup

  - philosopher''s judgment ↔ researcher''s measurement/reading

  - perhaps "recalcitrant intuition" ↔ "anomalous observation"

  - reflective equilibrium ↔ theory revision in light of data


  Disanalogies:

  - Observations are public and repeatable across observers; intuitions are private,
  partly introspective, and vary across people/cultures/demographics (x-phi findings).
  A "firm" intuition for one person may be absent in another.

  - Science has independent calibration/error theory for instruments: we know when
  a thermometer is broken and can discard a reading without ad hocness. Intuitions
  lack a well-established error theory: you can''t non-circularly say which intuitions
  are defective (dumbfounding, order effects).

  - Observations are causally connected to the world; intuitions may be generated
  by heuristics, emotions, or cultural learning, so they might tell us about our concepts/psychology
  rather than the target facts (especially in metaphysics or morality).

  - In science we can sometimes derive theoretical reasons to distrust an observation
  (e.g., a measured particle faster than light gets rechecked; illusions are explained
  by optics, not enshrined as data to accommodate). The observation/theory relationship
  is two-directional: sometimes theory rightly overrides observation (e.g., perceptual
  illusions, known instrument errors). So the analogy actually admits cases where
  theory overrides observation, which cuts against the rhetorical use.

  - The analogy smuggles in that intuitions are a kind of perception tracking truth
  reliably, and that "firmness" correlates with reliability; they may instead be rehearsed
  cultural judgments.


  Conclusion: The analogy does support a modest point — intuitions are data that need
  explaining — but not the strong conclusion that theory must defer to firm intuitions.
  It can''t by itself settle when theory should override intuition; whether intuition
  deserves trump status depends on whether you can supply something like the calibration
  story science has for observation. A better analogy might be: intuitions are like
  the reports of an untested, user-fabricated instrument, or like folk theories embedded
  in ordinary language; or intuitions are to philosophy what symptoms are to diagnosis
  — informative but not authoritative, and sometimes themselves explained away by
  the theory.


