  Consider the following broadly Kantian criterion of direct moral considerability.
  A being can be wronged directly — that is, one can have a duty to that being itself,
  rather than merely a duty regarding it — only if the being is an end in itself by
  virtue of having a rational nature: the capacity to set ends, act on principles
  it gives itself, and be subject to moral law. On this criterion, sentient nonhuman
  animals are not ends in themselves; they are, in Kant''s language, things that we
  can use as means. We may still have indirect duties concerning them, because abusing
  them degrades dispositions we owe to rational beings, but the animal itself is not
  the bearer of the duty. Now consider three cases.


  (a) A nonhuman primate raised in a research program who has learned several hundred
  arbitrary signs, combines them in novel ways, can report on absent objects, and
  appears to delay gratification according to self-imposed plans. (b) An adult human
  being with a congenital condition that leaves them with profound cognitive impairment:
  they feel pleasure, pain, and attachment, but they cannot form or follow self-given
  rules and are not morally responsible for their actions. (c) A hypothetical nonhuman
  animal bioengineered to possess the neurological prerequisites of practical reason
  — foresight, inhibition, means-end planning, and a sense of obligation — yet without
  human ancestry or human cultural formation.


