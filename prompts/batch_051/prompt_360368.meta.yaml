  Dancy''s key distinctions:

  - Generalism: the possibility of moral thought depends on the existence of a suitable
  supply of moral principles.

  - Particularism: the possibility of moral thought does not depend on such principles.

  - Holism in the theory of reasons: a feature that is a reason in one case may be
  no reason or a reason the other way in another.

  - Default reasons: generalists try to salvage principles by saying reasons have
  default valences, overridable; Dancy argues this is empty unless the default can
  be specified in terms of features, which reintroduces principles.

