  ---


  I chair the ethics committee at a mid-size teaching hospital. We meet every week
  and review contested treatment decisions in roughly an hour per case: refusals of
  recommended care, disputes about withdrawing or withholding treatment, and discharge
  plans the care team cannot settle internally. Our recommendation goes to the attending
  physician, who nearly always follows it, so the procedure has to be defensible without
  the physician ever reading it. The committee is mixed — physicians, nurses, a social
  worker, a chaplain — and none of us has formal training in philosophy.


  We currently work from a loose set of principles — autonomy, beneficence, nonmaleficence,
  justice — that we mostly use after the fact to rationalize a decision we have already
  reached. I have been reading the particularist critique of that way of working,
  and I want to know whether it can be made usable in our room without quietly turning
  back into generalism.


  Please write a reusable decision procedure for this committee, honestly grounded
  in moral particularism. By that I mean the view that the possibility of moral judgment
  does not depend on a supply of codifiable principles, together with the holism of
  reasons: a feature that counts in favor of an action in one case may count against
  it, or not at all, in another, so its valence is not fixed by any finite specification
  of the feature itself. Respect what the theory actually claims: it is not the weaker
  view that principles just have exceptions, and it is not the view that anything
  goes. Mark explicitly where a feature''s salience can be mistaken for its valence,
  where the procedure itself would be doing the work particularism says no principle
  can do, and where the procedure must hand the decision to a person because what
  remains is a judgment call rather than a fact. Be especially honest about the places
  the procedure will misfire, including where it will smuggle generalism back in under
  phrases such as default reasons, prima facie duties, or other things being equal.


  The deliverable is the procedure itself, not three separate consultations. It should
  be a checklist or ordered sequence of questions we can actually run in the meeting,
  with what counts as a sufficient answer to each question, the point at which the
  procedure stops with a no, and the point at which it hands the decision to a person.
  Then apply it to these three cases: (1) a competent young woman with strong family
