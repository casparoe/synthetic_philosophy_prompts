  Standard replies for historical materialism:

  - To the "base needs legal property" objection: relations of production are relations
  of effective control over productive forces, not juridical property; law encodes
  but does not constitute them. Follow-up: but "effective control" is itself a normative/modal
  notion — how do you identify control without legality or social rules? Likely answer:
  de facto powers, regularities, sanctions. Then follow-up: does that reduce the base
  to brute power, and can that explain the normativity of property law?

  - To relative autonomy: "relative autonomy" is compatible with determination in
  the last instance; base sets limits and selects among possibilities rather than
  dictating every detail. Follow-up: if the base only sets broad constraints, what
  content remains for "explains everything else"? When does a divergence count as
  refutation vs. a selection within constraints? What would an autonomous superstructure
  look like to make the thesis false?

  - To the scientific/testing issue: functional explanation: superstructural features
  exist because they stabilize reproduction of the base. The base explains by way
  of effects. Follow-up: how do we avoid an unfalsifiable "just-so story" where every
  surviving institution is said to benefit the base? What evidence would distinguish
  a functionally explained institution from an accidentally persisting one? This is
  good.


