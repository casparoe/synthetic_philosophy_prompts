  value actually have to deliver?


  Write the desiderata. That is: the cases it must get right, the distinctions it
  cannot collapse, the structural constraints it must satisfy — with the consideration
  behind each. Please include ordinary cases (the extra child in an already happy
  family; the city that grows denser or larger; the species rescued or left to disappear)
  as well as the canonical problem cases, described so the requirements stand on their
  own. In particular, make sure the list takes positions on at least the following,
  and flag where you think ordinary moral thinking is conflicted:


  1. Any theory must say explicitly how the value of a group relates to the well-being
  of its members: whether it sums, averages, or does something else, and whether that
  changes when we move from existing members'' well-being to additional members''
  well-being.

  2. It must not simply collapse average and total value. It has to explain why average
  seems to matter for some ordinary cases (the city that works worse as it grows)
  and why total-like thinking seems to matter for others (the species case, the last
  members of a group).

  3. It must handle the case where adding someone with a life worth living doesn''t
  lower anyone''s well-being but lowers the average: is the larger population better,
  worse, or neither? The answer shouldn''t be assumed; it should follow from the theory''s
  commitments.

  4. It must respect — or deliberately and explicitly reject — the person-affecting
  constraint: many find it odd to say a population is better because of additional
  people who never exist in the alternative, since there is no one for whom it is
  better. But rejecting that constraint looks like endorsing the view that making
  happy people is like making happy people better off. So the desiderata should say
  which of these two pressures is a datum and which is negotiable.

  5. It must take a stand on whether "no population with a lower average but a much
  larger number of lives worth living could be better" (the conclusion many find repugnant)
  is a requirement, a non-negotiable datum, or a bullet that a consistent theory can
  take. And it must say what else the theory must be able to say if it refuses that
  bullet.

  6. It must not pretend the question is the same at every scale. Ordinary thinking
  distinguishes the extra child, the growing city, and the preservation of a species.
  The list should say whether these differ in kind or only in degree, and what follows
