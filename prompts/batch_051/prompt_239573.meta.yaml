  and says, calmly and repeatedly, ''that woman is not my wife,'' then that''s what
  he believes, full stop. The two-factor account is actually on my side: one factor
  gives him a strange experience — he sees her face but doesn''t get the usual rush
  of familiarity — and the second factor is a broken hypothesis-checker, so the impostor
  story gets through when it shouldn''t. That''s the machinery that produces an irrational
  belief. It''s still a belief."


  Davinder: "It produces the words, sure. But then he sits down and eats dinner with
  her, shares a bed, doesn''t call the police, doesn''t even ask where his real wife
  is. His behavior treats her as his wife all day long. If ''she is an impostor''
  functioned like a belief, you''d expect it to leak into some of that. I''d say the
  speech is more like a report of an experience he can''t integrate — something is
  deeply wrong, the face doesn''t feel like her, and ''impostor'' is the only label
  that seems to fit."


  Elinor: "That''s too strong a test. I believe exercise would be good for me and
  I haven''t been to the gym in a year. People hold beliefs that fail to guide action
  all the time — contradictory beliefs, half-spheres of belief, weakness of will.
  Delusion is just an extreme case of same."


