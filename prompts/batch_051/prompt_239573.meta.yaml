  After forty years in a lab I retired and joined a philosophy discussion group, and
  last month two of its members got into a genuine row about the Capgras delusion
  — the one where a patient insists a loved one has been replaced by a lookalike.
  I kept my mouth shut because I always say I''m just a chemist, but at the end they
  both looked at me and asked me to referee. I still can''t. Here''s roughly the exchange.


