  NFL theorems (informally): for any two optimization algorithms A and B, the average
  performance over all possible objective functions is the same; no algorithm is universally
  better than random search when averaged over all problems. Improvement on one class
  of functions is exactly paid for by worse performance elsewhere. The theorem presupposes
  a uniform/averaged measure over all functions.


  Hume''s problem of induction: inductive inference from observed regularities to
  unobserved cases presupposes uniformity of nature, but that uniformity itself can
  only be justified inductively (circular) or not at all. No non-question-begging
  justification of induction.


  The parallel: Both are impossibility/limitation results of a sort. NFL says you
  cannot get generalization for free across all possible worlds/problems: an inductive
  bias is a bet on the structure of the world; it helps if the world has that structure,
  hurts otherwise. The problem of induction says the claim that the world has the
  structure (uniformity) can''t be justified from data alone. Both point to the role
  of an unjustified/unguaranteed assumption (a prior, a bias, a regularity assumption)
  that must be supplied from outside the data. In ML terms, generalization requires
  a prior that concentrates on simple/regular hypotheses; but that''s the same move
  Hume flagged: our preference for simple/regular hypotheses is itself not justified
  by experience.


