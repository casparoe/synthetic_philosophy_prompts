  behavior including reports about qualia are caused physically, not by qualia. The
  paradox/self-stultification: if phenomenal judgments are not caused by phenomenal
  states, then our introspective judgments about consciousness are unreliable / unjustified.
  James''s "The automaton theory" objection? James argued that if consciousness has
  no effects, it''s a mere passenger. Also "paradox of phenomenal judgment" specifically
  term from Chalmers'' "The Conscious Mind" — he discusses the paradox: epiphenomenalism
  implies our judgments about consciousness are not explained by consciousness itself,
  so we have no reason to trust them. Chalmers tries to solve via naturalistic dualism:
  experience and physical are related by laws but experience doesn''t causally affect;
  he argues phenomenal judgments are causally explained by physical processes but
  are true because of a harmonious relation; he suggests the coherence between consciousness
  and judgments is something like a "psychophysical law." Maybe too niche but LLMs
  may know the term "paradox of phenomenal judgment" from Chalmers. Small LLMs may
  not. But instruction says inject niche ideas. I can define it.


