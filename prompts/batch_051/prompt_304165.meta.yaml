  ---


  I have been rereading Henry Sidgwick''s The Methods of Ethics, and I find myself
  wondering how far his arguments reach into a problem he never faced. Sidgwick says,
  in effect, that from the point of view of the universe the good of any one individual
  is of no more importance than the good of any other. He is explicit that this impartiality
  extends across time as well as space: just as my being here rather than there gives
  me no reason to count my own location as specially important, my being now rather
  than then gives me no reason to discount the happiness of people in other centuries.
  He treats temporal position as morally arbitrary in much the way that spatial position
  is.


  What I would like you to do is predict, with careful reasoning, how Sidgwick would
  have come down on the modern debate about discounting future welfare in climate
  policy. Would he reject a pure rate of time preference as a violation of universal
  impartiality? Would he accept some practical discounting for uncertainty about the
  future, or for the possibility that future generations will be richer and better
