  The relevant distinction is roughly this. Apatheia, in its Stoic form, is not mere
  numbness or stiff-upper-lip repression: it is the extirpation of the passions through
  correct judgment about what is and is not ''up to us'' — the sage still has feelings
  (proto-passions) but no passions that carry him away, because he has judged externals
  as indifferent. Equanimity is broader and less committed: a stable calm, a readiness
  to remain undisturbed, which the Epicureans and Skeptics pursued as ataraxia and
  which ordinary moral psychology treats as a trait rather than a philosophical achievement.
  The novel, I think, puts pressure on both ideals. Stevens, the butler, has spent
  decades perfecting a discipline of composure he calls dignity: he serves without
  complaint, subordinates his own judgments to his master''s, stays at his post while
  his father dies, refuses to feel or act on what he feels for Miss Kenton, and only
  late in the novel admits that all this composure has cost him a life. At the same
  time the novel refuses to make him simply a fool or a cautionary tale: there is
  something real and even admirable in his discipline, and his last decision is not
  to grieve but to make the best of what remains.


