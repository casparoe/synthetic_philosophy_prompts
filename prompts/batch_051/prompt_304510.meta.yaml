  The prompt (first person, casual):


  "I''m trying to sort out when local conventions generate real moral obligations
  for visitors, versus when they''re just etiquette that it would be nice but not
  obligatory to follow. The rough criteria I''ve been working with are: (1) the convention
  is actually practiced by locals and not just preached; (2) violating it would leave
  some identifiable person or group materially worse off (lost income, lost time,
  physical risk); (3) a reasonable visitor could find out about the convention easily
