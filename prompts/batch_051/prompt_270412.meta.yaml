  Potential final prompt:


  ---

  You are a philosopher of cognitive science who designs diagnostic instruments for
  teaching. I am building a "which theory of intelligence do you actually hold?" quiz
  for an upper-level seminar on animal and machine minds, and I want it to sort people
  by how they respond to concrete cases rather than by which label they find flattering.
  Please produce a complete instrument: a short planning section, 8–10 case-based
  questions, and a scoring key with a diagnostic paragraph.


  Begin with a planning section (not part of the quiz itself) in which you lay out
  the axes along which positions on intelligence actually differ. At minimum, work
  with these four axes, and add others only if strictly necessary:


  (a) Behavioral vs. internal: is intelligence a matter of what a system does, or
  of what goes on inside it?

  (b) Representation vs. goal-directedness: if something internal matters, is the
  crucial ingredient structured information-processing, or is it the agent''s capacity
  to achieve goals across a range of environments?

  (c) Generality vs. domain-specificity: is intelligence one coherent general capacity,
  or is it always a matter of performance in a domain?

  (d) Consciousness/understanding: does genuine intelligence require phenomenal experience
  or grasping why one''s answer is correct, or can it be subpersonal and unconscious?


  Then write 8–10 questions. Each question presents a concrete case with two or three
  answer options, and no question may ask respondents which view they like or use
  the word "intelligence" in the case description (the task of the series is to determine
  what the respondent means by it, not to have them judge the label). Include all
  of the following cases somewhere in the instrument, in your own words:


  - a thermostat;

  - a system that passes every dialogue test by storing a giant lookup table of possible
  exchanges rather than by understanding anything;

  - a clerk in a room who follows an instruction book to answer questions in a language
  they do not understand, producing perfect answers;

  - a slime mold that solves a shortest-path maze without a brain;

  - evolution by natural selection, which produces well-adapted organisms though the
  process itself does not plan or represent anything;

  - a large language model that scores well on exams but is trained only to predict
  the next word.


  You may use additional cases (e.g., a human in a vegetative state, an octopus, an
  insect colony, a savant with prodigious memory but poor transfer, a theorem prover).


  Then provide a scoring key. The key should map answer patterns onto at least these
  positions, precisely because they occupy distinct cells in your logical space: (i)
  a behavioral/psychometric view; (ii) a computational-representational view; (iii)
  a goal-directed/ecological view (intelligence as an agent''s capacity to achieve
  its goals across varied environments); (iv) a learning-and-compression view; (v)
  a consciousness- or understanding-requiring view; and (vi) a deflationary or family-resemblance
  view on which "intelligence" tracks a loose cluster of capacities with no hidden
  essence. The positions should be located in the space of answer combinations, not
  simply listed: for any combination of answers that no defensible position occupies,
  say whether it is empty because the view is incoherent, unattractive, or merely
  underexplored. Also flag at least one pair of positions your key cannot cleanly
  separate for some answer patterns, and explain what extra question would be needed
  to do so.


  The result should be usable as a handout: the questions first, then the key, then
  a short note (''What this sorting misses'') summarizing the limitations. Think carefully
  about whether the answer options force false dichotomies, and avoid them or add
  options like ''neither / it depends on further facts.''


