  Let''s craft prompt:


  I''m a longtime reader of rationalist blogs and forums, so I know the standard Pascal''s
  mugging discussion: an expected utility maximizer with an unbounded utility function
  can be held hostage by tiny probabilities of enormous payoffs, and the standard
  repair is to bound utility or impose a prior that penalizes such hypotheses. But
  I realize I have never seen anyone go back and ask whether Pascal''s original argument
  in the Pensées survives this critique. (Paraphrase of passage: Pascal argues that
  reason cannot settle whether God exists, but one must choose a way of life; if God
  exists, the reward is an infinite eternity; if not, the sacrifice is finite. Therefore
  the expected outcome of wagering on God is infinitely better. He also says a game
  is being played at the extremity of an infinite distance between our finite knowledge
  and an infinite unknown.) My question: when you restate that original wager in the
  vocabulary of modern expected utility theory—including the distinction between finite
  and infinite utilities, the St. Petersburg paradox, bounded utility functions, and
  Pascal''s mugging—does Pascal''s argument survive the translation? Or does the modern
  framework show that the original argument was already a mugging? I also want a residue
  report: which parts of Pascal''s reasoning have no counterpart in expected utility
  theory, and whether those parts are doing real work or are just rhetorical framing.


