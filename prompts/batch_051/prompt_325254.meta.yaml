  I have read the standard Sequences-era discussions of Pascal''s mugging, and I keep
  seeing Pascal''s wager treated mostly as a historical curiosity that got formalized
  into a pathology about unbounded utility. I want to go the other direction. Near
  the start of the Pensées passage on the wager, Pascal does something more specific
  than just say "infinite payoff." He insists that we cannot know whether God exists;
  that we are already forced to choose a way of life; that what we stake is finite
  and what we may gain is infinite; and that a game is being played at the far end
  of an infinite distance where heads or tails will turn up. Restate this argument
  as carefully as you can in the language of modern expected utility theory—outcomes,
  probabilities, utilities, dominance, expected values, infinite utility, bounded
  utility—and then say what does and does not survive the translation. In particular:
  after the translation, is the original wager identical to the mugging that bears
  Pascal''s name, or are there assumptions in the original that the mugging drops?
  And what are the residues: elements of Pascal''s passage that cannot be expressed
  in the expected utility framework at all, and are they load-bearing or merely rhetorical?
  I want to know whether my standard rationalist toolkit actually contains the argument,
  or whether it has quietly changed the subject.


