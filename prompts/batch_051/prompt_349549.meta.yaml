  I''m a backend engineer, and I''ve spent way too much time debugging recursive functions
  that never terminate, writing type checks to block certain self-referential definitions,
  and reasoning about SQL nulls. I recently got into the liar paradox and can''t shake
  the feeling that it''s just a non-terminating recursive call. The sentence says
  of itself that it is false: if it''s true then it''s false, and if it''s false then
  it''s true, around forever. The two fixes I keep seeing are (a) split truth into
  a hiearchy of languages, so a sentence can only talk about the truth of sentences
  one level down, and (b) allow a third, undefined/gappy truth value and evaluate
  the sentence against itself repeatedly, updating the truth value until you land
  on a fixed point.


  I know recursion, fixed-point iteration, lazy versus strict evaluation, three-valued
  logic from SQL (true, false, null), and why an equation like x = not x has no boolean
  solution, but I don''t know the philosophy vocabulary beyond a few forum posts.
  Restate both fixes in my programming vocabulary as precisely as you can: where is
  the bug in the original sentence, what is the hierarchy-of-languages idea in programming
  terms (a type system? ban self-reference from the type of a variable?), what is
  the fixed-point construction (a loop until the value stops changing? a constraint
  solver?), and what happens when you "evaluate" the liar under each fix. Then give
  me the residue report: which parts of the philosophical debate map cleanly onto
  recursion, termination, type safety, and null handling, which parts you had to twist
  to make them fit, and which parts have no counterpart in programming at all. I especially
