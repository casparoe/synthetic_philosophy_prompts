  The classic Thomson argument:

  1. The lamp is off at t=0 (or before noon). At t=1/2^n hours before noon, the switch
  is toggled.

  2. At noon, the lamp must be either on or off.

  3. If on, there was a last time it was switched on before noon? Hmm no.

  4. For every toggle before noon, there is a later toggle. So there is no last toggle.

  5. Thomson: if on at noon, it must have been switched on at some time and not switched
  off after. But there is no time at which it was switched on without a later off-toggle;
  similarly for off. So it can''t be either.


  Actually Thomson''s reasoning: if the lamp is on at t, there was a time before t
  at which it was turned on, and no subsequent time before t at which it was turned
  off. But for any time, there is a subsequent switch; so impossible. Thus the lamp
  is neither on nor off at the limit, contradicting bivalence.


