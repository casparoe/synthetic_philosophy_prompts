  Draft:


  "I am preparing a talk on the ethics of depicting war in video games, and I have
  been trying to turn a set of scattered critical judgments into a coherent position.
  The judgments are all ones I would defend individually, but I want to know whether
  they can be defended together. The views are these." Then list (a)-(f).


  Let me formalize the commitments:


  (a) There is nothing inherently wrong with playing a video game in which war is
  depicted and in which the player performs simulated acts of violence; no actual
  person is harmed by what happens to simulated characters, and the fact that the
  content resembles real moral horrors does not, by itself, make the playing of it
  morally criticizable.


  (b) Nevertheless, I think some war games are objectionable in a strictly moral sense
  and not merely as bad taste. What makes them objectionable, when they are, is not
  that they show killing but that they are designed so as to invite the player to
  adopt a gloating or triumphal stance toward the violence — for example by making
  the game''s pleasures consist in savoring the deaths of enemies or by converting
  a real massacre into a spectacle one is meant to enjoy.


  (c) I also think that the player''s own motives and private pleasures bear on the
  moral assessment of their playing in a way that is independent of the game''s framing.
  A person who plays a historically serious and condemnatory war game while privately
  delighting in the suffering of the simulated victims is doing something worse than
  a person who plays a morally sloppy game out of historical curiosity, even if the
  two sessions are on-screen indistinguishable.


  (d) I think production and consumption can come apart: a studio can do something
  wrong by making and marketing a game that turns a real atrocity into light entertainment,
  while an ordinary player who picks it up unreflectively is only mildly criticizable
  at most; and conversely a player can be blameworthy for the spirit in which they
  play a game even when it was perfectly fine for the studio to have made that game.


  (e) I am skeptical of treating war games as a special moral kind. Any principle
  broad enough to condemn a given war game would, if applied in good faith, also condemn
  at least some canonical serious works of art about war — films, novels, memorials
  — which I take to be beyond reproach. So the difference must lie in the particulars
  of how a given work frames its violence, and in whether the work is serious, rather
  than in interactivity, the medium, or the fact that it is played for fun.


  (f) I hold that the mere enjoyment of simulated violence is not the kind of thing
  that can be wrong in itself; it becomes morally relevant only when it actually shapes
  how a person treats or regards real others. This is partly why I am slow to condemn
  players, even of games I think are objectionable to make or design.


