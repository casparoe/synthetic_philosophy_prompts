  version says it should be a top priority, perhaps the key priority. Common misrepresentations:
  that it means ignoring present suffering, that it''s just about existential risk
  only, that it ignores the probability/uncertainty because EV is dominated, that
  it commits to fanatical expected value with tiny probabilities of astronomical payoffs,
  that it says any small chance of huge impact swamps all else. Also the objection
  about "fanaticism" / Pascal''s mugging — but longtermists do address via bounded
  utility or rejecting fanaticism, yet the paradox is real. Another subtle conflation:
  discounting / temporal discounting; longtermism isn''t committed to zero discounting
  of welfare but argues against pure time preference. Another: "future people count
  the same as present" — strong longtermism involves interpersonal aggregation, not
  just a future focus.


