  Draft:


  "I''m a PhD student in philosophy of mind, and I''ve been reading around the physicalism
  literature for the last couple years, and I''ve gotten a bit stuck on a meta-question.
  The whole debate between physicalists and anti-physicalists seems to turn on what
  ''physical'' even means, and as far as I can tell that question has been stalled
  for decades. Hempel''s dilemma is usually trotted out: if ''physical'' means whatever
  current physics says, then physicalism is almost certainly false, because current
  physics is incomplete and will probably be revised; but if ''physical'' means whatever
  some future, completed physics says, then physicalism is either trivially true (whatever
  exists is whatever the completed physics describes) or is empty until we actually
  have that physics, so nobody knows what they''re asserting. People have tried to
  get around this by saying ''physical'' means the kinds that physics fundamentally
  posits, or by defining physical as non-mental (the via negativa), or by saying physicalism
  is about closure of the physical under causation rather than about a definition,
  but none of these has obviously won, and the argument just keep running in place.


  My working theory is that the real disagreement isn''t actually about any proposed
  definition—it''s about how theoretical terms get their meaning. Some people talk
  as if ''physical'' is a natural kind term whose reference is fixed by the actual
  stuff around us; others talk as if it''s a placeholder for whatever an ideal physics
  converges on, like a definite description with a gap in it. If that''s right, the
  two sides are doing different metasemantics, and they''d never reach agreement by
  arguing about physics. But I''m not fully confident: maybe there is a substantive
  disagreement underneath, about whether future physics could in principle include
  phenomenal properties, or about whether being exhaustively characterizable in structural
  terms is enough for physicalism.


  What I''m after is a diagnosis more than a verdict. Is this a verbal dispute about
  the word ''physical,'' a substantive dispute that''s been misdescribed as verbal,
  or a case where the question is ill-posed until someone fixes the metasemantics?
  And given whatever diagnosis you give, what would actually count as progress—a definition
  of ''physical'' that sticks, a distinction people haven''t drawn, or maybe an argument
  that we should stop expecting progress here? < something about honest answer>"


