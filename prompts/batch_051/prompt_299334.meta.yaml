  I''m a PhD student in philosophy of mind, and after a couple years reading around
  the physicalism literature I''ve gotten stuck on a meta-question about the debate
  itsself. The physicalist/anti-physicalist fight seems to hinge almost entirely on
  what ''physical'' is supposed to mean, and yet the argument about that definition
  has been running in place for decades. Hempel''s dilemma is the classic way of putting
  the problem: if ''physical'' means whatever current physics says, physicalism is
  almost certainly false, because current physics is incomplete and will very likely
  be revised; but if ''physical'' means whatever some future, completed physics says,
  then physicalism either collapses into something trivially true (whatever exists
  is whatever the completed physics ends up describing) or is just a placeholder assertion
  nobody can evaluate until that physics arrives. People have tried to wiggle out
  by saying the physical is what a future physics fundamentally posits, or by defining
  it negatively as non-mental, or by shifting the claim to something like causal closure
  of the physical, but none of those fixes has won, and the debate just keeps going.


  My working theory is that the real disagreement isn''t actually about any of these
  proposed definitions. It''s about metasemantics—how the term ''physical'' gets its
  meaning in the first place. Some people talk as if it''s a natural kind term, with
  its reference fixed by the actual stuff around us; other people talk as if it''s
  a placeholder for whatever an ideal science converges on, like a description with
  a blank left in it. If that''s right, the two sides wouldn''t be disagreeing about
  the world at all; they''d be running different theories of reference under the same
