  on what their text means.

  (2) But an author can misremember their intention, or can lie about it.

  (3) So the author''s report is just more evidence, not a final authority.

  (4) If the author''s report is just evidence, then intention is not what determines
  meaning.

  (5) So intention does not determine meaning.

