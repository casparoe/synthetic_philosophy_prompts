  Domain: Ethical egoism and psychological egoism.


  Essay idea: Argue that psychological egoism, in its strong form, is not an empirical
  claim but a "hermeneutic stance" or an interpretive convention: any apparent counterexample
  can be re-described as revealing a hidden self-interested motive, and because motives
  are unobservable, the doctrine is immunized. Then argue this "motive skepticism"
  is self-undermining: it requires taking an agent''s first-person reports as systematically
  unreliable, but the only evidence for the hidden motives is an a priori commitment.
  Then argue ethical egoism''s harder problem is not "how to justify altruism" but
  the "egoist''s paradox": if someone adopts ethical egoism, they may have reason
  to conceal or abandon the doctrine (in two-level terms) to reap cooperation benefits,
  so publicly espoused egoism is self-defeating — which suggests egoism fails as a
  public moral code even if privately true. Also the problem of other egos: egoism
  gives no non-arbitrary reason why the agent''s own good counts, once the agent counts
  as one among many. Ask for comments on whether the "interpretive convention" move
  mischaracterizes psychological egoism, whether the two-level move is actually available
  to an egoist, and whether the essay''s conclusion is interesting or trivial.


