  Domain: Futarchy and governance by prediction markets.


  Essay idea: "Futarchy''s metric problem and the self-reference problem." Argue that
  futarchy ("vote on values, bet on beliefs") silently assumes that the welfare metric
  can be measured and timestamped by markets, but for many governance decisions the
  metric is contested, gameable, or affected by the very prediction market. Specifically,
  conditional markets on "GDP if policy X passes" face reflexivity: the existence
  and interpretation of the market can influence the measured outcome (Goodhart''s
  law), and when the policy would restructure the institutions that report the metric,
  the market is predicting its own measurement apparatus. Then argue futarchy''s two-stage
  separation of values from beliefs is less clean than claimed because choosing the
  metric is itself a value-laden act, and market participants'' attempts to trade
  against a metric create "influence-seeking" behavior (adversarial Goodharting) distinct
  from ordinary expertise. End with a proposal: futarchy may be viable only for a
  narrow class of decisions with exogenously defined, hard-to-manipulate, near-term
  metrics. Ask for comments on the strongest objection to my proposal, on which steps
  are unsound, etc.


