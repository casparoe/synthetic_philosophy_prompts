  conflates two different theses: (i) the "negative" thesis that the primary linguistic
  data underdetermines the grammar (an epistemological claim), and (ii) the "positive"
  thesis that the child''s grammar is explained by domain-specific innate constraints.
  The first is almost trivially true (any finite corpus underdetermines a generalization)
  but it''s the second that is contested. Then focus on an underappreciated point:
  POS arguments typically assume the child''s input is the linguist''s transcribed
  corpus, but modern work on child-directed speech, distributional statistics, and
  lexical co-occurrence patterns may supply richer evidence than the idealized argument
  assumes. Thus POS becomes an empirical claim about what a realistic learning algorithm
  can extract from realistic input — a "poverty of the stimulus" question is really
  a "poverty of the imagination" worry about learners. Conclude that the interesting
  debate is not whether innate constraints exist but whether the constraints are grammar-specific
  or domain-general (e.g., general inductive biases, information theory). Ask for
  comments.


