  ---


  I spent most of yesterday evening arguing with a friend who designs onboarding and
  retention features for a subscription app, and the argument showed me that my paper
  is going to be tested in ways I have not rehearsed. She kept returning to three
  points: every designed environment shapes behavior, users freely choose to keep
  scrolling, and calling engagement techniques "manipulation" is a way for critics
  to moralize about choices they happen not to like. By the end I could meet her point
  by point, but a Q&A with fifty practitioners is a different matter. I would like
  you to prepare me.


  In three weeks I am presenting a paper at a university-industry workshop on technology
  ethics. The thesis I am defending is this. A product team that ships default settings
  deliberately optimized to maximize time-on-device, where the optimization runs against
  users'' own stated intentions to limit use, is engaged in manipulation in a morally
  substantive sense — not merely in persuasion or ordinary design. The distinction
  between manipulation and persuasion can be drawn without condemning every recommendation
  algorithm or menu default, and the responsibility for refitting the most predatory
  defaults lies, in the first instance, with the teams that ship and tune them, not
  only with platforms or advertisers.


  My argument in brief is what follows. (1) Manipulation is best understood as influence
  that works by subverting or bypassing the deliberative capacities a person would
  need to act in line with her own settled commitments; persuasion, by contrast, engages
  those capacities. (2) An engagement feature is open to that charge when its designers
  deliberately optimize it against a metric that tracks the user''s own self-reported
  or behaviorally measured intention to stop or cut down. (3) Several common techniques
  — the endless feed with no natural stopping point, variable-ratio rewards from notifications,
  autoplay chains, and streak mechanics that lean on loss aversion — are routinely
  optimized in exactly that way. (4) The fact that these techniques are delivered
  through apparently neutral interface code does not dissolve the team''s agency in
  selecting and tuning them.


  The audience is the part that worries me. Most attendees are human-computer interaction
  researchers and practicing product designers, several of whom work on engagement,
  notifications, or recommender systems; there are also two behavioral scientists
  who run retention experiments. Their likely shared commitments are these: designed
  environments always steer behavior, so singling out "persuasive design" is arbitrary;
  A/B tests and revealed behavior are at least as good a guide to what users want
  as their self-reports; talk of "addiction" is inflated; and moralized categories
  mostly smuggle in policy preferences under a philosophical veneer. They care about
  good craft, about not being blamed for an industry they did not create, and about
  users'' dignity as competent choosers.


  Act as a moral philosopher who works on autonomy, manipulation, and the ethics of
  technology, and who has coached people through hostile but fair Q&A sessions. Before
  you write anything final, take yourself through a genuine brainstorm of the audience''s
  likely commitments and where my argument is weakest; then produce the prep sheet,
  not a defense of the paper.


  The prep sheet should contain: the eight or so objections I will actually get from
  this audience, ordered as nearly as you can by how likely they are and how much
  damage they can do, each phrased in the way this audience would put it; for each
  objection, a reply I can deliver in about two minutes; for each reply, a note on
  where it is soft; a short list of what I should concede in my opening remarks to
  protect my credibility; the one reply that has to land for the talk to hold; and
  the question I am hoping nobody asks. Do not give me a bibliography or reading suggestions
  — I need spoken replies and tactical judgment, not citations.


