  Strawson''s "Freedom and Resentment" (1962). Key moves:

  - The reactive attitudes (resentment, gratitude, forgiveness, etc.) are natural
  human responses to the attitudes and intentions of others.

  - Determinism, as a general thesis, cannot lead us to abandon these attitudes; it
  is not a real option because the attitudes are too deeply rooted in human life.
  "The human commitment to participation in ordinary inter-personal relationships
  is... too thoroughgoing and deeply rooted for us to take seriously the thought that
  a general theoretical conviction might so change our world..." (paraphrase).

  - Yet he also describes the "objective attitude" (or objective stance) which we
  can and do adopt toward some people (children, the mentally ill, perhaps a person
  under extreme stress) — suspending reactive attitudes and treating them as objects
  of social policy, management, treatment, or training. And he says "suspension...
  is possible" in particular cases or types of cases.


  Tension: If the reactive attitudes are so deeply rooted that we couldn''t abandon
  them wholesale, how can the objective attitude be a genuine stance we adopt? And
  Strawson says the objective attitude is not the same as holding someone responsible;
  it is a suspension. Does the fact that we can adopt it locally show the supposed
  impossibility is only practical, not conceptual? Or is the general thesis about
  wholesale abandonment different from local suspension?


  Possible reconciliations:

  1. Scope distinction: global vs. local. The naturalness/inescapability claim concerns
  the whole framework of interpersonal life; the objective attitude is available only
  in limited, isolated cases (or toward particular individuals for particular reasons)
  and is itself a modification within the framework, not an alternative to it.

  2. Different senses of "can"/"possible": psychological impossibility vs. conceptual/logical
  possibility. We can''t take seriously wholesale suspension, but we can locally.

  3. Change of standpoint: when we adopt the objective attitude, we are not abandoning
  the reactive attitudes generally; we are making an exception. The tension dissolves
  by distinguishing "the general framework" from "particular applications."

  4. Tension irreducible: Strawson overstates the inescapability; the fact that we
  suspend attitudes toward excused agents or special classes shows the reactive attitudes
  are more optional than he acknowledges, and the claim must be weakened to "we don''t,
  as a matter of social fact, suspend them wholesale."

  5. A distinction between being determined by the general thesis (which gives no
  specific reason to exempt anyone) vs. specific excusing or exempting conditions
  (which do give reasons). The general thesis would put everyone in the objective
  stance at once, and that is what''s impossible; local exemptions are possible because
  they are motivated by specific features.


