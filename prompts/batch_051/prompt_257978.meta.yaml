  Draft:


  "I teach an upper-level undergraduate seminar called ''The Value of Death in Life,''
  and I want to spend one session on Bernard Williams''s Makropulos argument — the
  claim that an endless life would, sooner or later, become unbearably boring and
  that death is therefore not necessarily an enemy. I plan to show Groundhog Day as
  the session''s centerpiece. Write me a reading of the film through the lens of Williams''s
  argument, precise enough that I can teach from it.


  I want the reading to be faithful in both directions. On the Williams side, I mean:
  take seriously his distinction between categorical and contingent desires, his view
  that a life needs some projects or commitments to give one a reason to go on rather
  than merely appetites that come and go, and his worry that in a life long enough,
  any set of categorical desires would eventually be exhausted, so immortality would
  flatten into tedium. On the film side, I mean: work scene by scene with Phil Connors''s
  phases — the early instrumental mastery (seducing Nancy, robbing the armored car,
  punching the insurance agent), the middle despair and suicide attempts, and the
  long final phase of piano lessons, ice sculpting, and tending to the town — and
  ask at each stage what kind of desire is driving him.


  Then take a position on a set of questions I haven''t seen cleanly separated before.
  Does the film vindicate Williams''s pessimism by showing that even a man with endless
  time eventually hits the wall of meaningless repetition, and then rescue itself
  only by letting the loop end? Or does Phil''s transformation show that categorical
  desires can be generated indefinitely — that one can find new reasons to go on in
  competence, care, and small particular acts — and thereby supply a counterexample
  to Williams? Is the film even about immortality at all, or about something narrower,
  like the difference between living through many repetitions of the same day and
  living through many different days, so that it can''t settle the question Williams
  raises? And what should we make of the fact that the film''s happy ending is precisely
  the end of the loop: does the film quietly concede that unending life is not something
  it can imagine as happy except as a story about escaping it? I want you to end with
  what the film adds to the philosophical debate that Williams''s essay, or the broader
