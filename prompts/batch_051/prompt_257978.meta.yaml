  Draft final:


  "I teach an upper-level undergraduate philosophy seminar on death and the meaning
  of life, and I want to spend one session on Bernard Williams''s Makropulos argument
  — the contention that a life without end would eventually go flat, so that death
  is not the worst thing we can imagine. I plan to make Groundhog Day the centerpiece
  of the session, and I need a reading of the film that I can actually teach from.


  The reading should be faithful in both directions. On the Williams side, I mean
  taking seriously the machinery of the argument: the distinction between categorical
  desires — the projects, loves, and commitments that give a person a reason to go
  on — and contingent desires, which are merely the appetite for things that presuppose
  life; and the worry that, over a long enough life, any finite stock of categorical
  desires would be used up, leaving only repetition and tedium. On the film''s side,
  I mean reading the actual arc rather than treating the movie as an illustration.
  Go through Phil Connors''s phases: early instrumental mastery of the loop (seduction,
  money, cheap power), the middle despair and suicide attempts, and the long final
  phase of piano lessons, ice sculpting, and small acts of care for the town. For
  each phase, say what kind of desire is doing the work and whether anything like
  Williams''s exhaustion is setting in.


  Then work out an answer to the questions that most interest me. Does the film confirm
  Williams''s pessimism — showing that even someone with unlimited time eventually
  hits the wall of meaningless repetition — and then rescue itself only by allowing
  the loop to end? Or does Phil''s transformation amount to a counterexample: evidence
  that categorical desires can be regenerated, and that one can find new reasons to
  go on in competence, care, and particular attention to other people? Is the film
  about infinite life at all, or only about infinite repetitions of one day, so that
  it cannot decide the question Williams actually raises? And should we read the happy
  ending — the loop breaking — as an implicit admission that the film cannot imagine
  unending life as something other than an escape from itself? Conclude with what
