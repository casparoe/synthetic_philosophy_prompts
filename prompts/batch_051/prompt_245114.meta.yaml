  For ergodicity economics, a classic conceptual argument:

  (1) An individual investor does not live an ensemble of parallel lives; they live
  one path through time.

  (2) The expectation value of wealth averages over many parallel copies (ensemble
  average).

  (3) What matters for an individual making repeated decisions is what happens over
  time along their single path (time average).

  (4) When a multiplicative process is non-ergodic, the ensemble average and the time
  average diverge: the ensemble average can grow while almost every individual path
  decays.

  (5) Therefore, rational choice should maximize the time-average growth rate (e.g.,
  expected log returns), not the ensemble-average expected value.

  Then ask whether valid, which step fails. The key potential flaw: a one-shot gamble
  vs repeated gamble distinction; or step (5) normatively doesn''t follow from descriptive
  (4) unless you assume a particular objective/utility; risk aversion vs time-average
  growth; the fallacy of assuming the individual necessarily repeats indefinitely;
  also limitation: if a gamble is one-shot, ensemble average still matters for that
  one-shot under expected utility. Also the move from "almost every path decays" to
  "should maximize time-average growth" may be valid under certain assumptions of
  ergodicity economics.


