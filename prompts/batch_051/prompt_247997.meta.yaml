  Conceptual positions:

  1. Strict naturalism (Boorse-style biostatistical): disease = statistically subnormal
  functioning relative to reference class, value-free. Health = normal functioning.

  2. Harmful dysfunction hybrid (Wakefield): dysfunction (failure of a mechanism''s
  evolved/natural function) + harm judged by social values.

  3. Normativism (pure): disease/disorder is fundamentally a value-laden category;
  conditions are diseases because we judge them bad/dysfunctional relative to norms.

  4. Social constructionism/labeling: classifications reflect social arrangements
  and power, the label creates/manages deviance; no medical essence.

  5. Eliminativism or "disease is not a natural kind" / pragmatism: maybe "there''s
  no univocal concept; ask what work the label does." Or "medicalization thesis":
  x is a disease if it''s treated as one / can be intervened medically.

  6. Perhaps "Sadler-style values-based" not needed.


