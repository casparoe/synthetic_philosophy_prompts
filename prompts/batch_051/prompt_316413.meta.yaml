  Subtle mistakes:

  1. Conflation: defines incorruptibility as "stick to your principles no matter what
  incentives, threats, or social pressures" — this absorbs legitimate influence (evidence,
  moral criticism, loved ones) into "pressures." But then says "no further failure
  mode once principles are correct." This is the central mistake: incorruptibility
  (unbribable, not swayed by self-interest) is not the same as imperviousness to reasons.
  A person who never revises principles in response to evidence or moral testimony
  is dogmatic, not virtuous.

  2. "Always good for the community because predictable" — even with bad principles?
  A predictable Nazi is arguably worse for the community than a corruptible one, not
  better. The student tries to handle the Nazi objection by saying content is the
  problem, but predictability has instrumental value only relative to the principles;
  an immovable bad person is more dangerous, not less.

