  Question: "What is it to be incorruptible, and is incorruptibility always a virtue?
  If not, under what conditions does it fail? Defend your answer."


  Student answer:


  "Incorruptibility is the disposition to stick to your principles no matter what
  incentives, threats, or social pressures you face. An incorruptible person can''t
