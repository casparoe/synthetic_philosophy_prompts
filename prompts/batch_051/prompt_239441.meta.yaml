  Original Parfit''s hitchhiker: You are in a desert, dying of thirst. A driver stops
  and offers to rescue you only if you promise to pay him $1000 when you reach town.
  You are a rational egoist; if he knows this, he knows that once safe in town you''ll
  have no reason to pay. So he won''t help. Parfit''s answer: you should make yourself
  into the kind of person who keeps promises, i.e., become trustworthy, even if that
  disposition leads you to do things that a rational egoist wouldn''t do. So rational
  irrationality: it can be rational to have a disposition that makes you act irrationally
  in some cases.


  Variation possibilities:

  - The driver doesn''t know your disposition for sure; he has some signal, maybe
  70% accurate that you''re a promise-keeper. So your likelihood of being helped depends
  on your reputation/signals. Does it still pay to become a promise-keeper? What threshold?

  - Sequential repetition: you might get stranded again in the future with a non-zero
  probability, and each rescue requires promises. Then keeping the promise has future
  instrumental value via reputation. The original already has the "one-shot" aspect;
  but actually Parfit''s point is even in one-shot cases, the disposition is useful.
  A variation: multiple drivers, repeated games, reputation.

  - The promise is to pay not to the driver but to a charity the driver picks. Does
  that change whether it''s rational to keep it?

  - The rescue is not certain: the driver says he''ll help but his car might break
  down; the promise is conditional on actually being rescued.

  - The amount is small vs. large; maybe the cost of keeping the promise is greater
  than the benefit of being rescued? Actually the cost of keeping is $1000 and the
  benefit is your life, so keep. If the payment is huge relative to your wealth, what
  then?

