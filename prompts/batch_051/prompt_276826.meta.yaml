  Sidgwick''s dualism of practical reason, defended in The Methods of Ethics, holds
  that rational egoism and utilitarianism are each intuitively compelling but can
  issue incompatible injunctions, and that there is no further principle of practical
  reason to decide between them. The argument takes for granted two distinct standpoints:
  the agent''s own good, and the good of all persons impartially considered, with
  the boundary between me and others regarded as fundamental.


  Now suppose that reductionism about personal identity is correct. This is the view,
  developed most prominently in the later twentieth century, that a person is not
  a separately existing subject; rather, a life is constituted by overlapping chains
  of psychological and physical continuity across time-slices, and whether some stretch
  of these relations counts as one person or several is, at the margins, an empty
  or partly conventional question. On this picture, my concern for my own future self
  already spans a boundary: it is a concern for a succession of states only loosely
  connected to my present one. Equally, impartial concern for other persons spans
  boundaries of continuities of a different character or lesser degree.


