  desuetude. The case: a city ordinance from 1898 making it a misdemeanor to carry
  a ladder horizontally on a sidewalk, never prosecuted in living memory; today someone
  uses it to challenge a citation or a prosecution. Or use a more realistic law: a
  nineteenth-century statute banning fortune-telling or "disturbing the peace on the
  Sabbath," unenforced for decades but still on the books; a new prosecutor dusts
  it off. The dispute: is enforcing it now a violation of the rule of law? Does the
  rule of law require a doctrine of desuetude?


  Let''s flesh out positions:


  Move 1 (A): Enforcing a law no one has relied on being unenforced violates the rule
  of law because law must guide conduct. A law that lies dormant for generations cannot
  have guided anyone; people reasonably organized their lives around its absence.
  To punish someone now violates fair notice and makes law unpredictable — a kind
  of retroactive criminalization, since the law was "dead" in practice.


  Move 2 (B): But the rule of law is usually taken to require fidelity to enacted
  law, not to enforcement habits. A statute remains valid law until repealed by the
  legislature. If courts let laws die by neglect, they arrogate a legislative power:
  judges, not elected lawmakers, decide which laws are obsolete. That undermines the
  separation of powers and the idea that law''s authority comes from its enactment,
  not from executive convenience. If the law is bad or obsolete, the legislature should
  repeal it; until then officials have no general license to ignore it.


  Move 3 (A): Concedes repeal is the cleaner route, but says rule of law also includes
  protection against arbitrary enforcement. A dormant law is a loaded weapon that
  an official can level selectively: it cannot be enforced generally because enforcing
  it against everyone would be absurd and harsh, so it will inevitably be enforced
  against a few. That selective enforcement is the opposite of generality and impartiality.
  Desuetude is not judges making policy, but judges applying a background principle
  that government may not use long-abandoned prohibitions as surprise tools.


  Move 4 (B): Replies that the selective-enforcement worry is real, but desuetude
  is the wrong remedy because it rewards the executive''s past failure and lets a
  norm die through the very misconduct (non-enforcement) that the rule of law condemns.
  Also, the unfair-surprise point proves too much: many new interpretations of old
  statutes also surprise people, yet we do not say an old statute loses force just
  because it was underused. The difference between a dormant statute and any newly
  applied one is only a matter of degree — how much reliance and for how long — and
  desuetude cannot draw a principled line.


