  under conditions of full information and mutual justification.

  3. Constructivist/symbolic: the will is an artifact of representation — the "people"
  only exists as a collective subject once someone speaks in its name; the will is
  whatever the constituted "people" comes to recognize as its own, not reducible to
  pre-existing individual preferences.


