  Here''s one I''ve been turning over for a while. The standard least-harm argument
  in animal ethics says that if you''re going to eat meat, beef beats chicken, because
  a single steer gives you on the order of 400,000 calories while a broiler gives
  you maybe 3,000, so chicken kills something like a hundred times as many animals
  per calorie. Fine. But that count only looks at the animals killed directly for
  meat. The minute you add in what gets killed growing feed — mice, voles, insects
  from harvest and pesticide — and the fact that feedlot cattle eat grain too, the
  ranking starts to move. And then there''s wild animal suffering: pasture creates
  habitat for wild animals, which is only a point in beef''s favor if you think wild
  lives are on net good.


  So let me actually ask you to run the calculation, not just gesture at it. Set it
  up like this. Per 1,000 calories: beef directly kills b animals (fraction of a cow),
  chicken directly kills c birds; beef requires f_b kg of feed grain, chicken requires
  f_c kg; growing a kg of grain kills m animals; beef uses p hectare-years of pasture
  per 1,000 calories and chicken uses none; and a hectare of pasture produces w net
  welfare points for wild animals per year, where a negative w means wild lives are
  on net painful. Work out, in terms of b, c, f_b, f_c, m, p, and w, when beef still
  beats chicken and when chicken beats beef. Then tell me: does the standard least-harm
  argument survive the addition of crop deaths and wild animal suffering, or does
  it only survive as the much weaker claim that beef is better under a certain range
  of parameter values? And is that weaker claim actually a different argument, or
  just the old one with more moving parts? Give me the bottom line in the first sentence,
  then the reasoning. I also want you to say where your reasoning is most likely to
  fail, and what single number or consideration, if it came out differently, would
  flip your verdict.


