  Let me define positions:

  - Honor camp (Appiah-ish): a practice like dueling or slavery is kept alive by honor:
  those who engage in it are seen as honorable, and those who don''t are shamed. A
  moral revolution happens when the honor code flips—when the practice starts to look
  ridiculous or dishonorable to the very people whose honor it was supposed to serve.
  Arguments matter only insofar as they rebrand the practice within an honor economy.

  - Interests camp (Williams-ish): moral and honor talk is epiphenomenal; the engine
  is material interest. Slavery ended because it stopped paying: the West Indian sugar
  economy declined, free-trade industrial capitalism rose, and the powerful needed
  a different labor order. Norms change when maintaining them no longer serves the
  people who can enforce change.


  Maybe also note a third view (arguments) that neither holds but that keeps intruding,
  and the collaboration should decide whether their disagreement partly exists because
  both define themselves against that third view. That adds depth but Type C says
