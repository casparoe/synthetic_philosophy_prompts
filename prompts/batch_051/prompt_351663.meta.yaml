  ---

  In popular science writing and everyday decision-making, I keep seeing the "butterfly
  effect" used as a license for a kind of causal conclusion: that because a butterfly
  flapping its wings can (allegedly) set off a tornado, small choices or accidents
  in human life can be said to cause large downstream events in the same way, and
  therefore we cannot dismiss even tiny actions as causally negligible. Lately I found
  the original passage in Edward Lorenz''s 1972 talk on weather predictability where
  the butterfly appears. As I understand him, Lorenz is not offering a single chain
  from one butterfly to one tornado; he is asking what it would take for such a chain
  to exist, and using the image to illustrate the forecaster''s predicament: if the
  atmosphere is sensitive to perturbations at that scale, then the information needed
  to predict a specific tornado lies below any feasible observing network. So the
  image seems to be doing two different jobs: popular causality says small causes
  can be responsible for large outcomes; Lorenz''s own use seems to be about the limits
  on knowing which small causes will do what. I want an audit of this analogy. What
  maps onto what in the butterfly–tornado image, where does the popular version break
  against Lorenz''s actual use, what is the analogy quietly importing about causation
  and responsibility that a nonlinear dynamical system does not contain, and can the
  popular conclusion—that tiny actions matter because they may be the cause of large
  events—survive once the disanalogies are out? If a better analogy exists for how
  small perturbations relate to later outcomes in a chaotic system, I would want that
  too.

