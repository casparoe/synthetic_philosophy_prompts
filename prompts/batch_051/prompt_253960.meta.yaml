  Misconceptions for Williams''s integrity objection:

  1. Confusing integrity with simply doing what you feel like, or thinking Williams
  is against impartiality altogether / just squeamish.

  2. Thinking the objection is about guilt or "dirty hands" — that the problem is
  Jim would feel bad. Actually that''s a common misreading.

  3. Treating the one thought too many point as anti-deliberation in general, i.e.,
  "we should never think about whether to save a loved one" or that any moral reasoning
  is suspect. Actually Williams''s point is about the place of justification in personal
  relationships, not that deliberation is bad.

  4. Conflating the Jim case with the wife case: integrity (ground projects) vs the
  personal relations point. Both involve impartiality but different dimensions.

  5. Thinking Williams''s target is only act-utilitarianism, or that rule-utilitarianism
  escapes.

  6. Thinking the objection shows consequentialism is false by counterexample, when
  Williams''s argument is more about what a moral theory demands of agents.


