  Full text:


  My friend and I got into it last night about whether consciousness is a user illusion
  — the idea that your conscious self is like the desktop on a computer screen: a
  tidy little interface of icons and folders that hides the absolute mess of machine
  code underneath, and we mistake the interface for the thing actually doing the work.
  He kept saying the science is basically settled: change blindness shows you don''t
  have the rich picture you think you have, split-brain patients invent reasons for
  actions the other hemisphere performed, and the feeling of deciding can arrive after
  the neural processes that predict the action are already underway. I kept saying
  those show the interface is lossy and sometimes confabulates, but they don''t show
  the interface is all there is — that the what-it''s-like part is a useful fiction
  doing no causal work. We went round and round because neither of us could say what
  would actually settle it.


  So take the strong version of that claim: not just that introspection is unreliable,
  but that the conscious self is a constructed, radically simplified representation
  of what the brain is doing, that its apparent role in deciding and acting is largely
  post hoc storytelling, and that the whole felt scene is a dashboard, not the engine.
  How would you bring evidence to bear on that, concretely? What would the experiment
  or observational program look like — subjects, measures, what pattern of results
  would push you toward thinking yes, this really is an interface perched on top of
  deeper machinery, and what pattern would push you toward thinking the interface
  metaphor has bottomed out? Then tell me what part of the claim no test can reach,
  and whether a smart defender of the user illusion should be worried that the core
  of the view survives every possible outcome.


