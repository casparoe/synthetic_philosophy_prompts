  The user illusion as a concept: The term comes from Tor Nørretranders'' book "The
  User Illusion" (1991 Danish, 1998 English), which borrowed from computing/HCI. The
  core: consciousness presents a simplified, serialized, edited story of what the
  brain is doing — like a computer''s user interface hides the machine code. Dennett''s
  "consciousness is the brain''s user illusion" (though Dennett was careful; he said
  the self is a "center of narrative gravity", and the user illusion metaphor). Keith
  Frankish''s "illusionism" is related but distinct: phenomenal consciousness doesn''t
  exist as such; introspection misrepresents. The "user illusion" specifically: the
  desktop metaphor — icons, folders — none of that is real in the computer; it''s
  a useful fiction that lets users operate the machine. The claim: our experience
  of ourselves as conscious agents is like that — a functional simplification, not
  a transparent window onto neural processing.


  Testing: one could test whether the order/richness/authority we attribute to consciousness
  tracks actual processing. E.g., backward masking experiments, Libet-style timing,
  change blindness (we think we have a rich picture but don''t — the "grand illusion"
  of rich vision), split-brain confabulation (left hemisphere invents reasons for
  actions), post-hoc rationalization, Nisbett & Wilson "telling more than we can know",
  inattentional blindness. These show the contents of consciousness are a construction,
  gappy, after-the-fact. But they don''t establish that consciousness is *only* a
  user illusion, or that phenomenality doesn''t exist. There''s a residue: the very
  fact that there is something it''s like to operate the interface — the hard problem
  — no test can settle, because the claim is partly about what experience is, not
  just what it reports.


