  Draft:


  "I am currently taking a seminar on the distribution of consciousness across the
  animal kingdom, and I have been asked to write down my settled view before the rest
  of the class examines it. I would like an audit of whether these commitments hang
  together. Here is the view I have arrived at:


  1. Realism about sentience: for any animal, there is a fact of the matter whether
  it is at least minimally phenomenally conscious, even when that fact is hard to
  access.

  2. Gradedness: phenomenal consciousness comes in degrees. There is no sharp joint
  between being ''dimly'' conscious and being ''richly'' conscious, and no amount
  of detail will reveal a bright line across the animal kingdom.

  3. Nociception is not sufficient: reflex withdrawal from tissue damage is never
  by itself enough for felt pain. I require some integrated, first-person-like evaluation
  of a bodily state — something like a minimal self-model — before I count a state
  as felt.

  4. Convergence, not just homology: I take flexible, learning-based responses to
  bodily damage, implemented in a centralized/integrative nervous system, as prima
  facie evidence of felt affect, even when the architecture is evolutionarily distant
  from ours.

  5. Case judgments: I consider teleost fish at least minimally sentient, but I do
  not think the current behavioral and neural evidence yet supports insect sentience.

  6. Precautionary threshold: for policy, a non-negligible probability that members
  of a taxon are sentient is enough that we should treat them as sentient in research
  and farming.

  7. The line is partly ours: the boundary between sentient and insentient is not
  purely a discovery of a hidden joint in nature; in hard cases it is partly a decision
  about how to use the concept.


  Which of these are actually in tension, and which only look as though they are?
