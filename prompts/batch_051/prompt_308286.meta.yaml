  The domain: state and identity in programming. Key ideas:


  - Mutation is conceptually hard because it forces us to distinguish between a thing''s
  identity (a location in memory, an object/reference) and its value (the sequence
  of bits or the abstract value it currently holds).

  - In mathematics, variables are names for values, fixed; identity doesn''t change.
  In programming with mutation, a variable name is a fixed name for a mutable cell;
  the value changes while the identity (the cell) remains. This creates "same but
  different" puzzles.

  - Reasoning about identity over time: when two references are compared, do we mean
  the same object (aliasing) or the same value? This gives rise to the distinction
  between equality and identity (== vs ===, equals vs ==, structural vs reference
  equality).

  - The "frame problem" in miniature: when you mutate a shared structure, changes
  propagate to all who hold references; reasoning about which things changed requires
  tracking the graph of pointers, not just local values. This is why pure functions
  are easier to test/reason about.

  - Temporal logic / reasoning under change: with immutable values, substitution is
  safe and order doesn''t matter for values; with mutation, evaluation order matters,
  and equations like x = x no longer hold as substitutivity of equals (referential
  transparency) breaks. An assignment statement doesn''t assert equality; it commands
  a transition. Mathematics'' "equals" is symmetric and permanent; assignment is asymmetric
  and temporal.

  - Identity over time resembles philosophical puzzles (Ship of Theseus, personal
  identity), but with a special feature: in programming we get to stipulate identity
  (the address, the object ID) — identity is a metaphysical primitive we manipulate.
  Yet that stipulation makes program behavior hard to predict because identity is
  a hidden side channel.

