  [Essay]


  A variable in a pure functional program is a fixed name for a value. In a language
  with assignment, a variable is better understood as a fixed name for a location:
  the location abides while the value stored there changes, so identity and state
  come apart. Assignment makes that explicit — x := x + 1 is not a claim that x equals
  x + 1, but a command to change the contents of a place while the place itself continues.
  Once identity and state come apart, two kinds of sameness diverge, namely same location
  with a different value and same value in a different location. The judgment that
  two program fragments are interchangeable can then no longer be read off from their
  current values alone. Two expressions that print the same number may behave differently
  because one of them denotes a cell that is also reachable under another name. Substitutivity
  of equals fails not because the value of x is unclear, but because the identity
  of x is invisible in the value yet relevant to the outcome.


