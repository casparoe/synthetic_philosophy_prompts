  "A variable in a pure functional program is a fixed name for a value. In a language
  with assignment, a variable is better understood as a fixed name for a location,
  and the value found at that location changes; the identity of the location abides
  while its contents vary. This splitting of a ''thing'' into an abiding identity
  and a changing state is what makes the two forms of sameness diverge: the same location
  with a different value, and the same value in a different location. Once the two
  can come apart, the judgment that two program fragments are interchangeable can
  no longer be read off from their current values alone. Two expressions that print
  the same number may behave differently because one denotes a cell that is also reachable
  under another name. Substitutivity of equals fails not because the value of x is
  unclear, but because the identity of x is invisible in the value and relevant to
  the outcome.


  This suggests that the true cost of mutation is not temporal but intensional. We
  can reason about change in time well enough when time is an explicit parameter;
  a function from times to values composes like any other function. What we cannot
  do is reason compositionally when the meaning of a term depends on an identity that
  is global, hidden, and shared. Aliasing generalizes the problem: a call whose two
  arguments happen to denote the same object can behave differently from a call with
  two distinct objects that have indistinguishable printed values. Since whether those
  arguments are aliased is a fact about the whole object graph rather than about either
  argument, local reasoning breaks. Complete information about the graph would restore
  it, but complete information is precisely what finite reasoners cannot carry around,
  so language designers keep reaching for rules that make the global fact local: immutability,
  value semantics, ownership, separation, and so on.


  One way to read the history of programming-language design is as a series of attempts
  to confront this split between identity and state directly. Immutability solves
  the problem by refusing one side of the split: there are values, and no abiding
  identity that changes. Value semantics does something similar at the type level.
  Ownership and separation logics let identity change hands but not overlap, so reasoning
  can stay local. Object identity and pointer comparison are just the reverse strategy
  of making identity explicit. The fact that all these designs remain awkward in their
  own ways is evidence that the underlying concept, a persisting individual whose
