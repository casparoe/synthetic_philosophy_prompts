  can reason about change over time well enough when time is an explicit parameter;
  a function from times to values composes like any other function. What breaks is
  compositional reasoning, that is, reasoning where the behavior of the whole is fixed
  by the behavior of the parts, because the meaning of a term now depends on an identity
  that is global, hidden, and shared. Aliasing generalizes the problem. If a and b
  happen to refer to the same list, appending through a changes what one sees through
  b; if they refer to two equal but distinct lists, it does not. Yet whether a and
