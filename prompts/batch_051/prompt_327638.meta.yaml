  perhaps there are four or higher dimensions — the Sphere (a 3D being) is horrified/denies
  it. The Square returns to Flatland, is imprisoned for heresy (proclaiming the third
  dimension). The book is an allegory about Victorian hierarchy (women as lines, irregularity
  as criminality) and about the limits of our perception of higher dimensions.


  Embedding spaces: words as dense vectors; semantic similarity as cosine/euclidean
  distance; linear analogies as vector arithmetic (king - man + woman ≈ queen); dimensions
  not individually meaningful but the space as a whole supports relational structure;
  embeddings are learned from distributional contexts (distributional semantics, Firth
  "a word is characterized by the company it keeps"); high-dimensional geometry has
  counterintuitive properties (concentration of measure — points in high dimensions
  all tend to be roughly equidistant from each other, the "curse of dimensionality");
  dimensionality reduction to 2D for visualization distorts.


  The allegory hooks:

  - The Sphere insists the third dimension is "up" and cannot be inferred from Flatland
  phenomena; but Flatlanders could observe cross-sections (circles appearing/disappearing)
  — analogous to us observing word co-occurrence patterns and inferring a latent high-dimensional
  space (the embedding) from lower-dimensional observed contexts. The Square''s data
  is consistent with a 3D source; embeddings'' data is consistent with a latent semantic
  manifold.

  - The analogy between Flatland''s 2D plane and our 2-3D visualizations (t-SNE/UMAP)
  — the viz squashes high-D semantics into a plane, and we may miss/误解 the structure,
  just as the Square misreads the Sphere''s cross-sections.

  - The Square''s leap to "four dimensions" when the Sphere denies it dramatizes the
  "there''s always one more dimension" move; in embeddings, dimensionality is a hyperparameter
  chosen by the modeler, not given by nature.

  - The Sphere''s ability to "see inside" the house parallels how embeddings capture
  relationships not visible in any single textual context (global structure from aggregates).

  - Important disanalogy: physical dimensions (x, y, z, ...) are intrinsic and metric
  in a specific way; embedding dimensions are the components of a learned vector,
  basis-dependent, with no intrinsic semantics; the vector space''s metric is chosen
  (cosine similarity, dot product, Euclidean) and can be misleading; and word meaning
  isn''t literally position in a fixed space because context can shift meaning (the
  same word can have multiple senses; embeddings often conflate senses into one vector,
  or contextual embeddings like BERT/GPT make each token a vector depending on context).

