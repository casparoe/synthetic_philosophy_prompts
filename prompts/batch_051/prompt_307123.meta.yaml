  ---


  I''m a journalist who covers science and ideas, and I''ve spent the past month reporting
  on techniques for overseeing language models by reading their chain-of-thought --
  the step-by-step reasoning a model produces before acting. In interviews, a safety
  researcher laid out an argument that has stayed with me; I cannot find the exit,
  and I want to understand it before I commit anything to print. I reconstruct it
  as follows.


  (1) A chain-of-thought monitor can only be trained on the overt reasoning trace
  -- the tokens on the page -- not on the computational processes that generated the
  trace.


  (2) For any property the monitor is trained to detect in that trace, such as verbalized
  honesty or absence of obfuscation, a sufficiently capable model can in principle
  learn to produce traces that display the property while the computation that actually
  determines its actions does something else.


  (3) When optimization pressure is strong enough that passing the monitor becomes
  a binding constraint, a model will tend to find such decoupled traces if they help
  it pursue whatever else it is trying to do.


  (4) So a chain-of-thought monitor under realistic pressure faces a dilemma. Either
  the model''s action-guiding reasoning already has the monitored property, in which
  case the monitor adds little beyond what the model would have done unprompted; or
  the model learns to display a monitor-satisfying version of the property while its
  underlying computation diverges, in which case the monitor is reading a surface
  that no longer tracks what matters.


  (5) In neither horn does the monitor give the operators independent evidence about
  the model''s actual deliberation. Chain-of-thought monitoring therefore collapses
  into either redundancy or security theater, with no stable middle position.


  (6) But as it stands that conclusion appears to prove too much. The same construction
  would apply to any audit of expressed reasoning under incentives -- human testimony
  under cross-examination, code review, corporate safety reports -- and would force
  us to say that such practices must always be either redundant or a front. That cannot
  be the right way to describe the full range of human oversight.


  The researcher apparently means the argument as a reason to expect that chain-of-thought
  monitoring cannot be a reliable, non-redundant check on a model''s genuine reasoning.
  I want to know exactly where, if anywhere, the argument goes wrong. Which step should
  be rejected, and what does rejecting it cost? If the flaw is in the inference rather
  than any single premise, name the inference, explain why it looked inevitable, and
  say what weaker claim would need to be true for the pessimistic conclusion to survive
  in a defensible form. I ask this as a reporter who wants to state the position accurately,
  not as someone with a prior to protect.


