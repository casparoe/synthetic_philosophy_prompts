  pain between one setting and the next is so small that the agent cannot perceive
  it at all; each move upward brings a small but genuine sum of money. At setting
  0 he is comfortable, and at the highest setting the pain is severe and unremitting.
  Presented with the whole sequence as a single offer, he would refuse the highest
  setting in exchange for the accumulated money. Yet at each individual step it seems
  rational for him to accept the reward and move one setting higher: the increase
  in pain is imperceptible, the payment is real, and the next setting feels exactly
  like the one before. Thus there is a chain of pairwise rational choices whose endpoint
  he would reject if offered directly.


  Everyone in the group accepts this description, and everyone agrees that the agent
  should not end up at the highest setting. The disagreement is entirely about what
  lesson to draw, and neither camp has moved for several months.


  One camp reads the example as a counterexample to the transitivity of rational preference.
  Strictly speaking, it cannot matter to the agent whether he is at one setting or
  the next, so no adjacent preference can be faulted; yet he prefers setting 0 to
  the highest setting; therefore the relation of rational preference need not be transitive,
