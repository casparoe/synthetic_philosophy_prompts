  Student answer:

  "Mozi''s jian''ai is often mistaken for a demand to treat everyone identically,
  but it is better read as equal concern for all human beings: one should care about
  the welfare of a stranger no less than about the welfare of one''s parent. This
  does not of course require identical behavior, because a parent and a stranger stand
  in very different circumstances relative to any given agent; feeding one''s own
  elderly father may be the only way to care for him, while caring for a stranger''s
  father may take different form. So Mozi can say that filial behavior survives, but
  it is redefined as a set of practical responsibilities that arise from role and
  proximity rather than from a special intensity of concern reserved for one''s own.


  Mozi''s main argument is a sort of proto-utilitarian argument. Partiality, he thinks,
  is the root of the world''s harms: thieves steal because they favor their own gain
  over the property of others, and rulers invade because they favor their own state
  over others. If everyone instead cared equally for all, each person would benefit,
  since the way to get others to care for one''s own parents is first to care for
  others'' parents. So impartial care is justified because it maximizes total benefit:
  it produces more aggregate well-being than graded love could.


  The Confucian position, developed especially by Mencius, starts from the claim that
  human nature simply is partial: we naturally love our family more than strangers,
  and a morality that goes against this natural grain cannot be stable. Mencius''s
  child-at-the-well example shows that universality is possible, but only as an extension
  of a feeling whose intensity fades with distance; that is why we ought to care more
  for our parents than for strangers. Graded love is therefore the expression of human
  nature itself, and Mozi''s doctrine, by asking us to love the stranger''s father
  as our own, is unfilial because it denies what is most natural and most basic.


  However, this Confucian reply misses its target. Even if partiality is natural,
  that does not make it right; Mencius seems to slide from ''we do care more for our
