  In a midterm examination for a course in classical Chinese philosophy, students
  were given the following question:


  "Explain the disagreement between the Mohist doctrine of impartial care (jian''ai,
  sometimes translated ''universal love'') and the Confucian doctrine of graded love,
  according to which one properly cares more for those closer to oneself, especially
  one''s family. Then evaluate the strongest Mohist reply to the Confucian charge
  that impartial care is unfilial. Does impartial care abolish filial piety, or does
  it reinterpret it? Be specific about the point at which the two positions genuinely
  come apart."


  A student submitted this answer:


  "Impartial care is often misread as a demand to treat everyone identically. It is
  better understood as a demand for equal concern: the welfare of a stranger must
  count no less than the welfare of one''s own parent. Equal concern does not require
  identical treatment, because parents and strangers stand in different practical
  relations to the agent. When needs and capacities are otherwise equal, one can attend
  to one''s own elderly father rather than a stranger''s, since one is the person
  best situated to know and meet his needs. Filial behavior therefore survives under
  impartial care, but it is redefined as a set of role-based responsibilities rather
  than as the expression of a special concern owed only to one''s own kin.


  Mozi''s central argument is best reconstructed as a proto-utilitarian argument.
  Partiality, he contends, is the root of the world''s disorder: thieves steal because
  they care more about their own gain than about others'' property, and rulers invade
  because they care more about their own state than about neighboring ones. If impartial
  care replaced these partial attitudes, people would not harm one another for private
  advantage, and the result would be mutual security for everyone. But why should
  anyone already in a position of advantage adopt impartial care? Mozi answers that
  the advantages are reciprocal: the person who cares for the parents of others thereby
  prompts others to care for his own parents. The doctrine is therefore justified
  because, when universally adopted, it maximizes aggregate benefit — the total welfare
  produced by impartiality exceeds that produced by graded love.


  The Confucian position, developed most fully by Mencius, is grounded in human nature.
  Mencius holds that we naturally love our own more than we love strangers, and that
  the moral life consists in extending this natural love outward from the family.
  The child-at-the-well example is sometimes read as evidence of impartial benevolence
  toward any human being, but its real point is that even universal compassion is
  exercised on the particular case before one and grows out of the same natural equipment
  as family love. Because the intensity of this feeling fades with distance, the proper
  degree of care also fades: one ought to care more for one''s parents than for strangers.
  This is not a concession to human weakness but the very pattern of ren. On this
  view, Mohist impartial care is not a higher moral achievement but a distortion:
  by making one''s father interchangeable with any other man''s father, it cuts off
  the root from which all genuine care grows.


  The Confucian argument nevertheless has a flaw. Even if human beings naturally favor
  their own, natural partiality cannot by itself justify graded love; that would be
  an unwarranted slide from ''we do'' to ''we ought.'' Indeed, the existence of natural
  partiality is precisely the problem impartial care is meant to solve: the thief
  and the invading ruler are acting on natural partiality. The charge of unfiliality
  also fails. Mozi is not saying that one should abandon one''s parents; he is saying
  that the reason for caring for them cannot be the thought that they are mine. If
  a Confucian asks why I should care for my parents in the first place, the Mohist
  can answer: because their welfare matters as much as anyone else''s, and as their
  child I am the person best placed to do something about it. Filial piety is therefore
  reinterpreted, not abolished, and the reinterpretation avoids the partiality that
  breeds social division. The Mohist position is the stronger one."


