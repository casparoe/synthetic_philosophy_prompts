  Cox (1946) tried to derive the rules of probability from more fundamental desiderata
  for "plausibility" / "degree of rational belief". Jaynes popularized. The desiderata
  commonly:

  1. Degrees of plausibility are represented by real numbers; if one is greater, it''s
  more plausible. (comparability, transitivity)

  2. Qualitative correspondence with common sense.

  3. Consistency: (a) if a conclusion can be reasoned out in more than one way, every
  way must give same result; (b) all relevant evidence must be taken into account;
  (c) equivalent states of knowledge have same plausibility assignments.

  Then Cox''s functional equation assumptions: plausibility of A&B given C is some
  function of plausibility of A given B&C and plausibility of B given C (universal
  function F); plausibility of ¬A given C is some function of plausibility of A given
  C (universal function G). Then with differentiability assumptions, derives product
  and sum rules up to rescaling.


