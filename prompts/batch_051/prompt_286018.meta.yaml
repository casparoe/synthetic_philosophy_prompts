  Arguments for self-sufficiency/autarky as an ideal:


  For individuals:

  1. Vulnerability/resilience argument: depending on others exposes you to supply
  shocks, broken promises, changing preferences; self-sufficiency insulates you. (e.g.,
  growing your own food, skills.)

  2. Independence/agency: being self-sufficient means your choices aren''t constrained
  by another''s will; dependence can be a form of domination (cf. republican non-domination),
  so self-sufficiency is tied to freedom.

  3. Virtue/excellence: self-sufficiency is a kind of completeness or perfectionist
  ideal; needing little is aligned with flourishing (Stoic, Aristotelian autarkeia);
  not being needy is virtuous.

  4. Character argument: reliance on others can make you soft, servile, or vulnerable
  to corruption; producing for yourself builds industry, prudence.


  For nations:

  1. Security/strategic argument: dependence on foreign trade (especially necessities
  like grain, energy, semiconductors) leaves a nation vulnerable to blockades, embargoes,
  and coercion in wartime.

  2. Economic independence/sovereignty: trade interdependence gives other states leverage
  over domestic policy; autarky preserves policy autonomy.

  3. Infant industry/development: protection and import substitution develops domestic
  capacity (List, Hamilton); autarkic policies, even if partly autarky, are a path
  to development.

  4. Balance of payments/macroeconomic stability (more technical): avoiding external
  deficits, foreign debt crises, and terms of trade volatility.

  5. Cultural/communal: a nation that produces its own goods keeps its culture, crafts,
  foodways rather than being homogenized.


  Arguments against autarky:

  1. Gains from trade / comparative advantage: autarky forgoes the productivity benefits
  of specialization and exchange; a self-sufficient person/nation is poorer.

  2. Diversity/interdependence is actually the source of resilience: buffers, redundancy
  across networks; a diversified supply chain is more robust than local self-provision.

  3. Freedom as non-domination actually cuts the other way: being able to exit relationships
  requires alternatives, which interdependence provides; autarky creates fewer exit
  options and can be a form of isolation or control.

  4. Moral/cosmopolitan: self-sufficiency can be a vice — smugness, failure to acknowledge
  what we owe others; no one is truly self-sufficient, so the ideal is based on a
  myth (incorrect moral anthropology).

  5. Peace/interdependence ("doux commerce"): commercial interdependence makes war
  costly and cultivates cooperation.


