  I''m a high school student, and in my school''s philosophy club we have been discussing
  consequentialism. I found myself stuck on a version of an objection that I''ve seen
  called the cluelessness objection. As I understand it, the thought is this. An ordinary
  choice — whether to buy coffee at one shop rather than another, whether to spend
  an extra hour studying, whether to take a different route home — sets off a causal
  chain whose long-run effects fan out across everyone who comes later. A small difference
  now can change which people meet, which jobs get filled, which children are eventually
  born, and so on, so the resulting world could be better or worse in ways that no
  one can realistically foresee. If that is right, then a consequentialist seems to
  be told to perform whichever action makes the world best while being unable to know
  which action that is. The objection is usually pressed against consequentialism
  as a practical decision procedure, and sometimes against it as an account of what
  makes an action right.


  The objection was developed at a time when this kind of ignorance looked like a
  permanent fact of the human situation. Since then, however, we have acquired massive
  behavioral datasets, cheap large-scale randomized experiments, and machine-learning
  systems trained to forecast things like disease spread, consumer behavior, labor-market
  shifts, and other social outcomes. Suppose, for the sake of argument, that such
  systems become genuinely good at tracing how present choices propagate into medium-
  and long-run differences — not perfectly, of course, but vastly better than an unaided
  human could manage. My question is whether that development would actually defuse
  the cluelessness objection, or whether the objection would survive in a repaired
  form. I am less interested in how good today''s models happen to be than in the
  conceptual issue. Which premise of the original argument is the improved forecasting
  power supposed to undercut? And if the argument survives, does it survive by moving
  the problem elsewhere — for example, from plain empirical ignorance to a question
  about risk, about which probabilities are good enough, or about the point at which
  prediction must stop and moral judgment begin?


