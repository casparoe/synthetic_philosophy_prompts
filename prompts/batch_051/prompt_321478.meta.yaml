  I''ve been rereading Gödel, Escher, Bach and I keep chewing on the bit about where
  meaning lives. I find myself genuinely convinced by the view that meaning isn''t
  located in the physical message at all — it''s spread across a kind of inference
  situation: the message, the decoder, and the background that lets the decoder know
  how to read it. The frame message / outer message / inner message scheme seems to
  get this right: you have to recognize that something is a message and meant to be
  decoded; you have to have the code or enough context to reconstruct the decoding
  rules (outer message); and only then do you get the actual content (inner message).
  It explains why the same string can mean one thing in one context and nothing in
  another, why a DNA sequence only "says" something relative to a cell, why a message
  in a dead language seems to hang in limbo until someone cracks the script.


  And yet I have an intuition I can''t shake: a sentence on a page seems to mean what
  it means even when nobody reads it. If I write "the cat is on the mat" and then
  every mind in the universe disappears, it feels wrong to say the sentence no longer
  means anything — it''s still true or false, still about cats and mats, still different
  from random letters. The location-of-meaning view seems to make meaning too much
  a matter of being interpreted, and I don''t see how it tells us the difference between
  a genuine message awaiting decipherment and a string of noise that could be given
