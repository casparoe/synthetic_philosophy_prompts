  Perhaps better type: "Argument that seems to prove too much." A retired physicist
  (natural scientist) reconstructs Leibniz''s sequence:

  (1) God is omnipotent, omniscient, perfectly good.

  (2) A perfectly good being always chooses the best available option.

  (3) So out of the infinite possible worlds, God chose the best.

  (4) Therefore this world''s total package — including every evil — is better than
  any alternative without it.

  (5) But then any inference of the form "this particular evil is gratuitous" is never
  licensed: for any E, we can''t rule out that removing E would make the world worse
  overall, and God''s choice gives us a guarantee that it would.

  (6) Yet that seems to prove too much: it would immunize theodicy against all counterevidence,
  even worlds that are uniformly horrific.

  Which step goes wrong, if any, and what would it cost to reject it?


