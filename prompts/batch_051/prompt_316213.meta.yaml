  and I can''t find the exit.


  Here''s the argument as I''ve formalized it.


  (1) God is perfectly wise and perfectly good, so whenever he acts he chooses the
  option with the greatest degree of perfection.

  (2) Creation is an act, so God chose the possible world with the greatest degree
  of perfection.

  (3) If the best world is unique, then given God''s nature, he could not have chosen
  any other world.

  (4) A free act requires that the agent could have chosen otherwise.

  (5) So creation is not a free act—or at least not in any ordinary sense.

  (6) But Leibniz insists that God is free in creating, and that this freedom is real,
  not just a façon de parler.

  (7) Therefore either (1), (4), or Leibniz''s view of divine freedom must be adjusted.


  The part that feels like it proves too much is step (4 to 5). If acting according
  to one''s nature always removes freedom when one could not do otherwise, then not
