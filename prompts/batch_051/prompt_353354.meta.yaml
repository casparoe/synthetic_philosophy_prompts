  Potential final prompt:


  "The assumption of common knowledge of rationality carries a great deal of weight
  in game theory and in economic models of information. Yet there is a persistent
  suspicion that common knowledge is not the sort of thing an experiment could ever
  reveal: if one agent merely reasons ''she knows that I know that she knows'' repeated
  to level seventeen, while another reasons the same way to level thirty, their behavior
  in any finite game will differ only for games that hinge on that exact level, and
  we may have no way of telling that neither has the infinite hierarchy. Consider
  the following claim:

  Claim. Common knowledge of rationality (or of the structure of the game) is a property
  of the modeler''s description, not a state that actual agents can be said to be
  in; no finite body of observed behavior can distinguish genuine common knowledge
  from sufficiently deep finite iteration of belief. The infinite hierarchy has no
  behavioral signature of its own.


  Your task is to bring evidence to bear on this claim as far as it is possible to
  do so. Choose one concrete interactive setting to work with: for instance, a public
  announcement of the rules followed by a coordination or guessing game, the p-beauty
  contest, iterated deletion of dominated actions, or a setting in which Aumann''s
  no-bet theorem applies. Specify the setting precisely (players, information, incentives,
  the sequence of public events), and design the best empirical or experimental test
  you can of whether the subjects are in a state of common knowledge of rationality,
  of the game structure, or both. Then answer: what pattern in the data would favor
  the claim (the hierarchy is no more than the modeler''s fiction) and what pattern
  would favor its denial (there is a behavioral difference that tracks the presence
  or absence of common knowledge). Finally, identify the residue the test cannot reach,
  even in the best conceivable version: what precisely does the operationalization
  leave out, and is that residue a limit of measurement or a defect in the notion
  itself?"


  Then prescribe sections:

  "Please structure the answer in the following sections, in this order:

  1. The claim under test (roughly 120 words): restate the claim and distinguish it
  from nearby claims (e.g., that people are irrational, or that full rationality is
  rare).

  2. The setting and design (roughly 350 words): specify the game or situation, the
  public events, what is varied or measured, and the treatment conditions that are
  meant to separate the readings.

  3. What a favorable result would show (roughly 180 words): state the pattern that
  supports the claim and the inference it licenses.

  4. What an unfavorable result would show (roughly 180 words): state the pattern
