  5. What the test cannot settle (roughly 200 words): give the residue, and say whether
  the untestable remainder matters for the use of common knowledge in game theory,
  or whether it is harmless idealization.

  6. My verdict (roughly 150 words): offer your own assessment of the claim in light
  of the proposed test."


