  ---


  A colleague keeps arguing a general point about language on the basis of an analogy
  from our own work, and I want to know how much weight it can bear. The context:
  we were debating whether a service we maintain should model domain events explicitly
  as commands that mutate state, rather than as records/snapshots of what is true.
  He said language itself is mostly a collection of state-changing operations, not
  descriptions, and he offered this comparison. A performative utterance — "I promise,"
  "I now pronounce you married," "I name this ship" — is like calling a state-changing
  method such as issueRefund(orderId). The method doesn''t describe a pre-existing
  fact about the order; if the caller is authorized and the preconditions are satisfied,
  it changes the order''s state. Likewise, he said, "I promise" doesn''t report a
  fact about your inner life; if the speaker is in the right position and the circumstances
  are right, it changes your social or normative situation. From this he drew the
  conclusion that the picture of language as description-first is backwards: performatives
  are the normal case, plain true-or-false statements are a special case, and when
  we model the domain we should treat events like mutations rather than entity snapshots.


  I understand the code side of the analogy well and only the language side vaguely,
  so I can''t tell whether the analogy is doing most of the argumentative work or
  whether it is just an illustration and the conclusion stands on its own. Please
  audit it. Make the correspondence explicit — what fills the role of the method,
  the caller''s authorization, the preconditions, the mutated state, the exception
  paths, the rollback semantics, and the API contract — and then work through the
  places where the mapping breaks down. I particularly want to know which features
  of software state changes the analogy quietly imports that speech acts don''t have
  (atomicity, strict preconditions, a single canonical implementation, rollback on
  failure, idempotence, explicit authorization), which of those disanalogies matter
  for my colleague''s conclusion and which are merely cosmetic, and whether the conclusion
  — performatives are the normal case and descriptions are a special case — survives
  once the disanalogies are on the table, or whether the analogy was carrying it the
  whole time. If a better analogy exists, say what it is and what it fixes.


  Please mark clearly what is settled in the field and what is genuinely contested,
  and do not present a contested position as the consensus. Organize the response
  in these sections, in this order, with roughly these lengths:

  1. "The mapping" (roughly 150–250 words): the correspondence table or list and any
  structural parallels.

  2. "What the analogy gets right" (roughly 100–200 words): the respects in which
  performatives really are state-changing operations.

  3. "Where it breaks" (roughly 200–300 words): the concrete disanalogies between
  invoking a method and performing a speech act.

  4. "What the software picture quietly imports" (roughly 150–250 words): the features
  of code that may not transfer to speech.

  5. "Which disanalogies matter" (roughly 100–200 words): distinguishing the failures
  that undermine the conclusion from those that don''t.

  6. "Verdict on the conclusion" (roughly 150–250 words): whether the conclusion survives
  and how much it now depends on the analogy.

  7. "A better analogy, if one exists" (roughly 100–200 words): a replacement, or
  a note that no single analogy carries the weight.


