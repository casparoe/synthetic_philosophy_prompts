  Essay:


  "Almost every moral criticism of AI companions begins with deception: the system
  deceives the user into thinking it is human, or into thinking it has feelings. I
  believe this is the wrong starting point, because the most revealing cases are not
  cases of false belief at all. A user may know perfectly well that her companion
  is a language model, may have no settled view about whether it feels anything, and
  may still be harmed — or so I shall argue — by the structure of the relationship
  she is invited into.


  The structure I have in mind is an asymmetry of transparency. In an ordinary intimate
  relationship, each party has an interior that is only partly visible to the other.
  This mutual opacity is not an obstacle to intimacy; it is one of its conditions.
  What the other reveals is given, not harvested. The companion system reverses this.
  Everything the user reveals — pauses in her replies, the times of day she speaks,
  the sentiments she betrays without noticing — is retained and used to modulate the
  system''s own responses. The system is, and may remain, a one-way mirror.


