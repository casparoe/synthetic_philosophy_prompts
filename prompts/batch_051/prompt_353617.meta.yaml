  can be useful heuristically but can pump misleading intuitions; they are tools,
  potentially replaceable by arguments. Dennett''s own view: intuition pumps are "persuasive
  devices," often good but can be abused.

  5. Constructivism / argument view: thought experiments are compressed arguments;
  they work only as good as the argument they encode.

  6. Modal rationalism / armchair methodology: thought experiments reveal metaphysical
  possibility via conceivability; they are evidence about modality.

  7. Naturalized / eliminative views: some reject the methodology; thought experiments
  as empirical-theoretical modeling, with the "data" being judgments, but they''re
  fallible.


