  "I''m a novelist, not a philosopher, so go easy on the jargon. I''ve been turning
  over a passage from Richard Rorty''s Contingency, Irony, and Solidarity, in the
  chapter ''The contingency of language'': ''The world does not speak. Only we do.
  The world can, once we have programmed ourselves with a language, cause us to hold
  beliefs. But it cannot propose a language for us to speak. Only other human beings
  can do that.'' I''ve built a small homemade theory on it that I call ''pressure
  realism.'' The thought is: a novel is realistic not because its language mirrors
  the world but because the world gets to push back against the vocabularies the narration
  tries on. The world can''t propose a language, but it can make a character''s descriptions
  fail, a narrator''s confidence wobble, a plot refuse the terms being used to describe
  it. Realism, on this view, is a kind of managed breakdown of description. The book
  doesn''t represent; it absorbs resistance. My question: is pressure realism actually
  distinct from Rorty''s antirepresentationalism, or have I just renamed it? Give
  me the three strongest objections to pressure realism as a theory of why some passages
  feel realistic and others don''t, and say if any is fatal rather than just a problem
  of taste. Where does the ''pressure'' metaphor do too much work? Lead with your
  bottom line in the first sentence, then the reasoning, with no preamble and no restating
  of the question."


