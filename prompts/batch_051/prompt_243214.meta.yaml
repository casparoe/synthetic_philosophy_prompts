  Let''s write prompt:

  "I''m a novelist, and Rorty''s line from Contingency, Irony, and Solidarity has
  been bugging me: ''The world does not speak...'' I started building a mini-theory
  of narration out of it. I call it ''pressure realism.'' The idea: a novel''s narration
  is realism not because it mirrors the world but because it lets the world push back
  against the vocabularies on offer. The world can''t propose language, so novels
  have to stage that pushback indirectly—through plot refusals, failed descriptions,
  characters whose words stop working. I think of a realistic scene as one where the
  narration keeps trying to say what happened and gets corrected by events, not by
  finding a better picture but by switching vocabulary under pressure. My question:
  is pressure realism just Rorty''s antirepresentationalism with a literary hat on,
  or is it a genuinely distinct idea? What would it get wrong or leave out that a
  novelist would actually notice? And where does the pressure metaphor do too much
  work — what does it wrongly count as ''realist''?"


