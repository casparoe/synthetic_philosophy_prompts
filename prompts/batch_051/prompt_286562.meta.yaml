  Arguments/criticisms in literature:

  1. Circularity: the standard defines good critics as those who judge correctly,
  but correct judgment is defined by pleasure of good critics. Can''t use the standard
  to resolve disputes without independent access to which critics are ideal.

  2. The "joint verdict" is a sociological-predictive claim, not normative: even if
  ideal critics converge, it doesn''t establish that their verdicts are correct, only
  that they agree. The standard turns into a fact about convergence.

  3. The problem of acquiring/identifying the ideal critic: if ideal critics are rare
  and we can''t identify them, the standard is practically inert; and if we propose
  tests for delicacy (e.g., detecting the key and the leather in the wine), these
  tests don''t cover aesthetic appreciation generally.

  4. The test of time and the canon: appeals to what has pleased across ages/nations
  could just encode power, exclusion, and the choices of past elites; it can''t distinguish
  universal merit from historical dominance. Also the "blameless" variations (different
  humours, manners of time/place) mean the standard doesn''t arbitrate many cases.

  5. The circularity between the rules of art and the standard: rules are drawn from
  works already deemed excellent, but identifying those works requires the standard;
  so the rules can''t ground the standard.

  6. Hume''s theory of taste as sentiment may sit badly with the normative standard:
  if beauty is a sentiment, by what right do we correct anyone''s sentiment? The claim
  that some tastes are defective presumes an objective norm that his sentimentalism
  denies.

  7. The "good sense" requirement imports moral/cognitive judgment into aesthetic
  response, possibly making the standard moralized or intellectualized.


