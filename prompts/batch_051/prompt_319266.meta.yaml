  I am a PhD student working between the philosophy of language and the epistemology
  of religious experience, and I keep running into a structural problem: the literature
  on ineffability is scattered across negative theology, Buddhist and Vedantic sources,
  and analytic treatments of the limits of language, and each subliterature treats
  its own cases as the center of the phenomenon. Before I go further with any particular
  account, I want the target specified. Please write out the desiderata that an adequate
  theory of ineffability must satisfy, where by a theory of ineffability I mean an
  account of what it is for something to resist or defeat articulation, and of how
  something can be in some sense beyond language while still being known, experienced,
  indicated, or taught. For each requirement, give the case or consideration that
  motivates it, and say whether you take it to be non-negotiable or merely the preference
  of one camp. I want the list itself, not a survey of who holds which view.


  I would like the list to address at least the following pressure points, though
  the essay should not be a mechanical walk through them. First, the self-undermining
  problem: saying that X is ineffable appears to characterize X, and denying that
  the ineffable has any properties appears itself to ascribe a property to it, so
