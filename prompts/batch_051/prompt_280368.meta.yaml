  Prompt text:


  "I''m a PhD student in philosophy of technology, working on a chapter about automation
  and meaningful work, and I keep coming back to a pattern I can''t find a name for.
  I''ve been reading a bunch of ethnographies of automated workplaces — chemical plants,
  long-haul trucking with driver-assist, warehouses with algorithmic task allocation,
  modern cockpits — and the same structure keeps appearing. The automation is sold
  as taking over the dangerous or monotonous parts of the job, and what''s left for
  the human is watching, monitoring, confirming. The workers describe it as simultaneously
  boring and exhausting; they''re not doing much, but they''re on edge all shift.
  And the weird part is the skill dynamic. The system has absorbed all the routine
  cases, which were exactly the cases where workers used to build and maintain an
  intuitive feel for the process. So the only time a human is genuinely needed is
  when the system hits a case it can''t handle or fails outright, which is precisely
  the moment when the human is most out of practice. You end up with a job that formally
  still requires high-level expertise—nobody will say the person is replaceable, because
  in an emergency they''re the last line—but the day-to-day conditions systematically
  prevent them from maintaining that expertise. Some of the older workers talk about
  it as a loss of "the feel" or say the job stopped feeling like a craft and started
  feeling like supervision. My question: is there an established name for this specific
  configuration? I''m not looking for the broad story about automation destroying
  skills, and not just the claim that monitoring work is boring; what interests me
  is the trap where the human is kept around for rare, high-stakes interventions that
  the routine of the job no longer trains them for, and how that reshapes the meaning
  of the work. If there''s no exact name, I''d want a term that distinguishes it from
  both plain deskilling and from generic alienation, and says where the edges are—e.g.,
  does it apply when the automation is unreliable in a predictable way, or only when
  failures are genuinely rare and novel? And I''d appreciate it if you could separate
  what''s settled in the literature from what''s still contested."


