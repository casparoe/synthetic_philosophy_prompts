  "I am a high school student preparing a term paper for an introductory philosophy
  course. I am defending a measured version of Bernard Williams''s claim in his essay
  on the Makropulos case: that a life without end would, for creatures like us, sooner
  or later become tedious in a way that undermines the reasons to want to continue
  it. I am not arguing that death is good, only that the burden is on accounts of
  heaven or utopian immortality to explain what would stop the slide into boredom.


  Here are six objections to Williams''s line of argument that I have collected from
  classmates, my teacher, and online forums. Please rank them from most damaging to
  least damaging, and assign each a rough percentage of the total force you think
  the objections collectively have (so the six percentages sum to 100). For each,
  give a one-sentence reason for its placement.


  1. The analogy with ordinary long marriages or careers doesn''t work: boredom in
  finite activities is produced by repetition of one role, but an infinite life could
  contain infinitely many distinct projects, friendships, and skills.

  2. Williams illicitly assumes that the person''s character stays fixed; if personality
  and desires can change enough, each stretch of life may feel as urgent as the last.

  3. Heaven is usually described as involving a perfected or glorified nature, so
  objections based on ordinary human psychology may simply not apply.

  4. Even if a particular person would get bored, that is not a necessary truth about
  every possible immortal; some temperaments might be endlessly fascinated by a single
  pursuit.

  5. Boredom is not an all-or-nothing state; a life could be punctuated by long stretches
  of calm or routine without the person wishing for nonexistence.

  6. The argument proves too much: if categorical desires are needed to make sense
  of continuing, then many ordinary finite lives would also become boring or pointless
  after their main projects are complete, yet we do not usually think those people
  should wish to die."


