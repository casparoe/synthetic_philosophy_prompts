  Potential prompt:


  I''m a software engineer, not a philosophy person, but I''ve been reading Frank
  Ramsey''s 1927 paper Facts and Propositions because it kept coming up in a blog
  about logic. The gist I got is that Ramsey thinks there isnt a separate problem
  of truth, just a linguistic muddle about the word "true." I want to test that against
  my own instincts. Here are some things I feel pretty strongly about, as cases:

  - When a coworker says "the build is broken" and I check the CI pipeline and the
  build is broken, I treat what he said as true. But I don''t feel like I''ve discovered
  a new fact about his sentence, like it now has a truth-property attached to it.
  Saying "what he said is true" just feels like a roundabout way of saying the build
  is broken.

  - If my boss says "everything the client told us in the morning meeting is true,"
  I don''t take him to be asserting a huge conjunction I already know. It feels like
  he''s using "true" to endorse a bunch of statements without actually listing them.
  That seems like a useful compression device.

  - But when asked whether there are true statements that no one will ever prove or
  verify, I get pulled. I want to say yes, that''s obviously right: there are facts
  about, say, the exact number of gummy bears in a jar I''ll never open, and the statement
  saying that number is either true or false even if nobody ever checks. But if "true"
  is just a compression device for endorsement, I don''t know what I''m endorsing
  when no one can ever state the specific number. This case feels different from the
  build case.

  - "It''s true that the server is down" just sounds like the same thing as "the server
  is down." No extra content.

  - When debugging, I sometimes add "if the original developer''s assumptions are
  true, then the bug must be in the parser." That use of true in the antecedent seems
  needed for logical structure, not just emphasis. It''s not just a long way of asserting
  the assumptions, because I''m not asserting them.

  - If a coworker says "the code compiles" and it actually doesn''t, I say his statement
  is false. That also feels not like a property, just the flip side of the same coin.


  So my question: is there a single principle about "true" that gets all these cases?
  If so, state it and say what it predicts for a case I haven''t listed. If not, which
  verdicts should I overturn? Also, I''d like to know whether my instincts actually
  match Ramsey''s position or whether I''m smuggling in something he''d reject.


