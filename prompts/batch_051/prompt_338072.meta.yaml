  Potential prompt:


  I''m a software engineer and I can''t shake a tension I keep running into when I
  read about molecular biology. On one hand, the idea that DNA is a code looks like
  a wildly successful theory: Crick''s 1958 paper On Protein Synthesis proposes, as
  I understand it, that the sequence of bases in nucleic acid is a code for the amino
  acid sequence of a protein, and from there you get codon tables, start and stop
  codons, transcription and translation, all the stuff that makes cells look like
  they are executing a program. I can''t deny the predictive power: you can read a
  DNA sequence and infer a protein, and mutations have predictable effects in a way
  that really does resemble source code changes. On the other hand, I have a strong
  intuition that this cannot be literally true. As far as I know, a code requires
  an encoder, a convention, and something that interprets the symbols according to
  that convention. But in the cell there''s no programmer, no agreed convention, no
  representation that is "about" an amino acid in the way a write to a register is
  about a value. The DNA molecule, the tRNAs, the ribosome, the amino acids just interact
  with each other according to chemistry and physics. Calling it a code seems like
  a post hoc projection from an engineer, not a fact about the molecule.


  So here''s the clash. The systematic virtues of the code theory are huge: it gives
  you a clean abstraction layer, it unifies an enormous amount of data, and it generates
  testable predictions. My intuition says a literal code without an encoder is incoherent.
  Should I give up the intuition and allow that biological systems can contain codes
  without an intentional sender, maybe by defining ''code'' in a naturalized information-theoretic
  way? Or should I give up taking the code talk literally and say it''s a useful metaphor
  whose cash value is just causal specificity? Or is there a intermediate reading?
  I''m less interested in what to call it and more in what the right underlying picture
  is: is there a real problem with DNA-as-code, or is my intuition just applying a
  parochial engineering concept where it doesn''t belong? Walk me through what each
  option costs.


