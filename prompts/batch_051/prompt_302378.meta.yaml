  by which a signal could maintain a reliable correlation with quality — for example,
  a genuine handicap (a strategic cost paid so that only high-quality senders can
  afford to signal), an index (a signal physically constrained by the trait it advertises,
  so the cost is production necessity rather than waste), and a differential-benefit
  equilibrium (the signal itself is cheap, but low-quality senders don''t gain enough
  from sending it to bother) — plus any others you think are relevant. Then do the
