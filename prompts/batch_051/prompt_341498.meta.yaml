  when knowledge is obstructed by selfish desires (私欲), meaning one''s "knowledge"
  isn''t perfectly genuine/present — but this is not merely a redefinition, it has
  a phenomenology: the knowing is already a doing in the mind (e.g., knowing a smell
  is pleasant is inseparable from liking it).

  - Also he argues for unity of knowledge/action in the *original substance* of mind,
  and says the distinction appears only in the effort to correct separation.

  - Howlers to avoid: saying "so Yangming thought you can''t know what''s right without
  being a sage" etc.


