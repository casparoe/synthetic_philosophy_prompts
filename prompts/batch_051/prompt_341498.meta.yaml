  Subtle points:

  - Yangming''s "knowledge" (知) is more like "the inborn knowledge of the good" (良知,
  liangzhi) which is simultaneously a knowing and an activity of the mind; knowledge
  and action are one continuous process, not two separate steps where cognition precedes
  behavior.

