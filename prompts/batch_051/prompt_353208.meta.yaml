  Domain 4: Coherent extrapolated volition and idealized preferences. Argument that
  CEV proves too much:

  (1) If my actual preferences are unreliable due to ignorance and bias, then what
  I really want is what I would want after ideal deliberation (CEV).

  (2) Ideal deliberation changes not only my beliefs but also my ends.

  (3) There is no fact about which of my ends I should keep after ideal deliberation
  except what I''d actually prefer after such deliberation.

  (4) But to find that, we''d have to run a simulated version of me that is not me
  (it has different beliefs/desires), and its choices are authoritative over my current
  ones.

  (5) Thus my current preferences never bind; only the preferences of a hypothetical
  better version of me bind.

  (6) If a hypothetical better version of me is authoritative, my present self has
  no authority; but then CEV is just rule by an imaginary person.

  (7) So CEV either collapses into my actual preferences (which it was introduced
  to correct) or into arbitrary preferences of a constructed being.

