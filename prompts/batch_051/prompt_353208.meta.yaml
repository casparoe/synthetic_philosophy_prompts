  Let''s formulate a specific philosophical argument using transitivity and simplicity.


  Consider theory choice under reflective equilibrium:

  - We take a principle to be justified when it best explains and systematizes our
  considered judgments about cases (intuitions).

  - Simplicity is a tie-breaker among principles that fit the intuitions.

  - But simplicity is itself a considered judgment about what makes for a good principle;
  it is one of our intuitions/philosophical judgments, not a case judgment.

  - If simplicity is a principle, then it must be justified by fitting our case intuitions,
  but it is a meta-principle and has no direct case fit.

  - So by the method''s own standard, simplicity is unjustified.

  - Without simplicity, theory choice is underdetermined by cases.

  - Therefore, the method cannot simultaneously treat case intuitions as the evidence
  base and also use simplicity; so either case intuitions can''t be the only evidence
  or philosophical method is irrational.


