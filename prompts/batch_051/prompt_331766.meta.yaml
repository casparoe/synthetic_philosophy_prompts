  with it, construct a rival that agrees with T on all the data in hand and on every
  observation we can feasibly make, but departs from T in an inaccessible regime:
  below an energy scale we will never probe, after a time so distant we will never
  reach it, or in a parameter that only differs beyond the nth decimal place.

