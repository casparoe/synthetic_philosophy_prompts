  Possible summary (popular article voice):


  "A recent piece I read in a popular science magazine lays out the mathematics of
  coincidence roughly as follows: ''The birthday paradox shows that events which feel
  strikingly improbable are actually almost guaranteed to occur. With only 23 people
  there is already a better-than-even chance that two of them share a birthday, so
  whenever a coincidence has a one-in-a-million chance of occurring on a given occasion,
  and there are millions of occasions on which it could occur, we should expect it
  to turn up routinely. This is why anecdotes about coincidence carry no evidential
  weight: any given improbable event is just one of the huge number of improbable
  events that must happen by chance, so a report that something odd happened is never
  evidence for a hidden cause.''"


  Errors:

  1. "The birthday paradox shows that events which feel strikingly improbable are
  actually almost guaranteed to occur" — overgeneralization. The birthday paradox
  shows that a class of coincidences (at least one pair among many) can be probable
  even when each specific pairing is improbable; it does not show that any particular
  improbable event is almost guaranteed. There''s a conflation between the probability
  of a particular event and the probability of some event of a broad type.

  2. "whenever a coincidence has a one-in-a-million chance on a given occasion, and
  there are millions of occasions, we should expect it routinely" — this is roughly
  the "law of truly large numbers," a legitimate but overstated principle; it depends
  on independence and on specifying the event class. Also "a report that something
  odd happened is never evidence for a hidden cause" — overstatement. Whether an anecdote
  counts as evidence depends on the prior probability of the hidden cause, the likelihood
  of the report given chance vs. cause, and the specificity of the coincidence. The
  birthday paradox itself only addresses chance baselines, not evidential value.

  3. The move from "some coincidences are common" to "anecdotes carry no evidential
  weight" is the main subtle misrepresentation: it treats base rate/selection considerations
  as if they settle evidential questions, when they only supply the null hypothesis.
  A defender might note that the whole point of a coincidence is often that it is
  *specified in advance* or has low probability under chance given a specific description,
  and such evidence can be quantified (Bayes factors).


