  Pragmatic encroachment: the thesis that whether a true belief counts as knowledge
  can depend on practical matters (stakes, costs of being wrong), in addition to truth,
  belief, and evidence. Epistemic contextualism: the truth-conditions of knowledge
  sentences like "S knows that p" vary with the context of the ascriber (or sometimes
  the subject), particularly with epistemic standards salient in that context. Both
  can explain stakes-sensitivity of knowledge attributions: contextualism says the
  word "knows" is context-sensitive (like "tall" or "flat"); pragmatic encroachment
  says knowledge itself is interest-relative (or at least that practical factors partly
  determine whether a belief meets the epistemic standard). Subject-sensitive invariantism
  (SSI) = pragmatic encroachment as an invariantist position: "knows" is not context-sensitive,
  but knowledge depends partly on practical interests of the subject. Classical/purist
  invariantism denies both: stakes never affect whether someone knows; apparent stakes
  effects are due to something else (e.g., conversational implicature, belief-hesitancy,
  or psychological effects).


