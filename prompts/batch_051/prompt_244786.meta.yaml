  ---


  You are a professional philosopher of language who has been asked to act as a neutral
  facilitator between two long-standing camps in the debate over identity statements.
  One camp, the Fregeans, holds that the difference in cognitive significance between
  the sentence *Hesperus is Hesperus* and the sentence *Hesperus is Phosphorus* must
  be explained by something more than the object referred to: the two names contribute
  different senses or modes of presentation, and this difference does explanatory
  work in accounting for the informativeness of some identity statements and the failure
  of substitution in belief reports. The other camp, the Millians, holds that a proper
  name''s semantic contribution is exhausted by its referent, so that the two sentences
  express the same singular proposition; on this view, the felt difference is to be
  explained pragmatically, psychologically, or metalinguistically, without positing
  senses as part of semantic content. The two sides have spent years talking past
  one another.


  Your task is to draft the joint statement that these two camps would produce after
  a good-faith adversarial collaboration, written so that a clear-headed Fregean and
  a clear-headed Millian would both sign it. Begin with a brainstorming stage in which
  you list the phenomena both camps should agree to save, the candidate formulations
  of their disagreement, and the candidate cruxes, discarding formulations that are
  slanted or merely verbal. Then produce the document itself in two parts: first,
  a numbered list of agreed claims about the data (including the relevant identity
  statements and belief ascriptions), about what a theory must explain, and about
  which merely terminological disputes should be set aside; second, a disagreements
  table whose rows are the remaining cruxes. For each crux, state the neutral formulation
