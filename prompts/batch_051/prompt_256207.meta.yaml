  Student answer:

  "An apparent dilemma is one where two moral requirements seem to conflict, but closer
  inspection shows there is an all-things-considered thing to do: one requirement
  is simply stronger. A genuine dilemma is one where two all-things-considered requirements
  really do conflict, so the agent is required to do each of two things and cannot
  do both; whatever they do, they will fail to do something they ought to do and so
  act wrongly. The question is whether such situations are really possible.


  The standard argument against them starts from ''ought implies can''. Suppose someone
  ought to do A and ought to do B, but cannot do both. By agglomeration, if they ought
  to do A and ought to do B, then they ought to do A and B. But ''ought implies can''
  says they can''t be obligated to do what is impossible for them, and ex hypothesi
  they cannot do A and B. So the pair of obligations can''t both hold. If they can''t
  both hold, then the situation is at most an apparent dilemma: one of the ''oughts''
  was never all-things-considered after all, or it was cancelled. This seems decisive,
  as long as one accepts agglomeration and ''ought implies can''.


  But that''s too quick, and this is where moral remainders matter. Think of someone
  who must break a promise to help someone in an emergency. If I choose the emergency,
  the promise isn''t simply wiped out; I owe something afterwards — apology, recompense,
  a feeling of regret. This is what people mean when they say there''s a ''remainder''.
  Williams brought this out: an overridden requirement does not just disappear. Now,
  the important point is that the appropriateness of regret shows the overridden requirement
  was actually violated, not merely overridden. If the requirement had really been
  cancelled, regret would make no sense, but it does make sense, so I did wrong by
  breaking the promise even though I ought to have broken it. That means some conflicts
  are genuine dilemmas because I do wrong either way, even when one of the options
  is clearly what I ought to do.


  I think a compromise is right. There are real conflicts where I will act against
  a serious pro tanto duty no matter what. In those cases, though, there is always
  an all-things-considered thing I ought to do, even if I cannot always tell what
  it is. So genuine dilemmas, in the strict sense of two all-things-considered oughts
  that cannot both be satisfied, are impossible. But we should still treat the agent
  as having done something wrong when they fail to fulfil the overridden duty, and
  we should express this in how we evaluate them, for example by withholding full
  praise while not exactly blaming them."


