  Let me rewrite the student answer cleanly:


  Question:

  "Are there any genuine moral dilemmas? In your answer, (i) distinguish apparent
  from genuine dilemmas, (ii) explain the argument from ''ought implies can'' (together
  with the agglomeration principle) against the possibility of genuine dilemmas, and
  (iii) discuss whether moral remainders, such as the appropriateness of regret, give
