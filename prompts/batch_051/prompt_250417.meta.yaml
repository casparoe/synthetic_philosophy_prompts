  “The view taken of a University in these Discourses is the following:—That it is
  a place of teaching universal knowledge. This implies that its object is, on the
  one hand, intellectual, not moral; and, on the other, that it is the diffusion and
  extension of knowledge rather than the advancement. If its object were scientific
  and philosophical discovery, I do not see why a University should have students;
  if religious training, I do not see how it can be the seat of literature and science.”


