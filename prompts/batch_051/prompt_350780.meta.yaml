  Let me think about what''s actually right about lottery and preface paradoxes.


  Lottery paradox (Kyburg): For a large fair lottery with n tickets, for each ticket
  i, the probability that i loses is (n-1)/n, which can be arbitrarily high. If a
  rational agent is justified in believing a proposition when its probability is sufficiently
  high (above a threshold < 1), then the agent is justified in believing each "ticket
  i will lose." But if the agent is also justified in believing "some ticket will
  win" (or the conjunction of each ticket losing is impossible given one winner),
  and justified beliefs are closed under conjunction (or under logical consequence),
  the agent is justified in believing the contradictory conjunction "every ticket
  will lose and some ticket will win." So the paradox shows a tension among: (1) high-probability
  threshold suffices for justification, (2) closure of justification under conjunction,
  (3) consistency of justified beliefs. Standard responses reject one of these.


  Preface paradox (Makinson): An author rationally believes each sentence in her book
  (based on evidence/checking), but given fallibility and experience, she also rationally
  believes that at least one sentence in the book is false (she writes in the preface
  an apology for errors). So she rationally holds an inconsistent set of beliefs.
  This challenges closure under conjunction: if she''s justified in believing each
  of p1...pn, closure would make her justified in believing p1&...&pn; but she''s
  justified in believing not-(p1&...&pn). The preface paradox shows that one can have
  good evidence for each of a set of claims while also having good evidence for the
  negation of their conjunction, and hence that rational belief sets may be inconsistent
  — challenging certain coherence or consistency requirements.


  Common subtle errors to build in:

  - Conflating justification and knowledge; saying the lottery paradox "shows justified
  belief isn''t knowledge" — actually it''s about justification, not knowledge per
  se, though there are knowledge versions.

  - Saying the paradox shows "probabilistic justification is incoherent" or "you can''t
  have justified beliefs about lottery outcomes" — too strong; many epistemologists
  accept you are justified in believing your ticket loses (though some deny).

  - The preface paradox doesn''t show "rationality requires inconsistency"; it shows
  that if you accept certain principles, rationality permits (or can yield) inconsistency,
  or that consistency is not a requirement. Saying rationality requires inconsistency
  would be wrong.

  - The last conclusion "standards for justification are purely probabilistic" confuses
  the threshold view with a broader thesis.


