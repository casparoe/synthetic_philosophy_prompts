  Version:


  "I am a PhD candidate in philosophy of language, and I am putting together a graduate
  interview series on assertion and its norms. Next week''s guest is a philosopher
  who defends the knowledge norm: one is properly entitled to assert that p only if
  one knows that p. I do not want a general-audience restatement of the view; I want
  eight to ten prepared questions that make the guest defend the view where the specialist
  literature has pushed hardest, plus a follow-up after each primary question keyed
  to the reply she is most likely to give.


  Please structure the questions around the following pressure points. (1) The lottery
  case: a speaker who asserts, before the drawing, that her ticket in a fair lottery
  lost is ordinarily regarded as having asserted improperly, even though her belief
  is overwhelmingly likely to be true; press her on why the knowledge norm explains
  this, while a truth norm or a norm requiring reasonable rather than knowledgeable
  belief appears to license the assertion. (2) Selfless assertion: a speaker can reasonably
  and sincerely believe what she asserts without knowing it, when asserting it is
  the only way to bring about an important good; many have the intuition that such
  an assertion is not improper. Ask whether the knowledge norm misclassifies it, and
  when she distinguishes what is proper in the primary sense from what is excusable
  or proper in a secondary sense, press her on whether that distinction is independently
  motivated or simply built to match the intuitions. (3) Action-guidance: ask how
  the norm can govern assertion in practice, given that speakers often cannot tell
  whether they know — particularly if the KK principle fails — and a norm that cannot
  be applied in deliberation looks idle. (4) The explanatory competitor: ask what
  the knowledge norm explains or predicts beyond what the simpler norm assert only
  what is true or the norm assert only what your evidence makes (epistemically) probable
  can match; in particular, have her explain the impropriety of Moore-paradoxical
  assertions such as ''it is raining, but I don''t know that it is raining,'' which
  can be true while violating the knowledge norm. (5) The status of the norm: ask
  whether it is best understood as constitutive of assertion — as what makes an utterance
  an assertion — or merely regulative, and press her on how the constitutive reading
  avoids circularity and how the regulative reading does not leave assertion without
  a sense. (6) Graded propriety: ask whether a single binary standard can do justice
  to the fact that our verdicts about bad assertions vary in severity, and whether
  acknowledging secondary or scalar factors would end up collapsing the view into
  a norm of degree of justification or probability.


  Write the questions so that each one can stand on its own for a listener who has
  not followed the literature. Begin your response directly with the first interview
