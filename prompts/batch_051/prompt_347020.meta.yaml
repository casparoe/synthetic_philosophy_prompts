  overwhelmingly likely to be true; ask why the knowledge norm captures this where
  a truth norm or a justified-belief norm seems to permit it. Second, press the selfless-assertion
  problem: a speaker can reasonably and sincerely believe a proposition she does not
  know when asserting it is the only way to secure an important good, and many have
  the intuition that such an assertion is not improper; ask whether the knowledge
  norm gets the verdict wrong. For each of these, include a follow-up aimed at the
  reply the guest is most likely to make — for instance, after she distinguishes a
  primary norm from secondary or graded considerations, press her on what independent
  work that distinction does and whether it can be drawn without already building
  in the intuition it is meant to save. Third, ask whether the knowledge norm can
  actually guide assertion, given that speakers often cannot tell that they know (particularly
  if the KK principle fails); a norm that cannot be applied in deliberation may look
  idle as a norm of assertion. Fourth, press the explanatory competition: ask what
  the knowledge norm predicts or explains that could not be matched by the norm ''assert
  only what is true'' or by the norm ''assert only what is reasonably believed on
  one''s evidence'' — for example, have her explain the impropriety of Moore-paradoxical
  assertions such as ''it is raining, but I don''t know that it is raining,'' which
  can be true even when the speaker lacks the relevant knowledge. Fifth, ask whether
  the knowledge norm is best construed as constitutive of assertion — what makes an
  utterance an assertion at all — or merely as a regulative rule that assertions generally
  ought to obey; press her on how a constitutive reading avoids circularity and how
  a merely regulative reading avoids leaving assertion undefined. Finally, ask how
  a single binary norm of knowledge can accommodate the evidently graded character
  of our judgments about bad assertions, and whether admitting secondary or scalar
  factors threatens to collapse the view into a norm of degree of justification or
  probability. Write the questions so that the content itself orients the audience;
  begin your response directly with the first question, with no preamble, signposting,
  or commentary."


