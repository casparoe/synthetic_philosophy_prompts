  The debate: Is deplatforming / cancel culture a form of punishment?


  Key philosophical distinctions:

  - Punishment requires intention, authority, and the imposition of something burdensome
  in response to perceived wrongdoing (HLA Hart''s standard definition: pain or unpleasantness,
  for an offense, of an offender, intentionally administered by humans other than
  the offender, imposed by an authority with the relevant standing). Social sanctions
  may fail the "authority" condition.

  - But some philosophers (e.g., in debates about informal punishment) argue that
  social sanctions are punishment in a broader sense, or that the state-centric definition
  is too narrow.

  - The distinction between withdrawal of a benefit and imposition of a burden is
  contested (baseline problem).

  - Whether private actors can punish or only the state — or whether punishment is
  a concept that applies to non-state actors too.

  - Due process: if it''s punishment, does due process apply? Some say yes only for
  legal punishment; private punishment can be wrong but not a due process violation.

  - Proportionality: applies to punishment but also to blame, criticism, etc.

  - The "public square" analogy: social media platforms as de facto public forums.

  - Boycotts as speech/association.

  - Coordinated social sanction: distributed agency problem.


