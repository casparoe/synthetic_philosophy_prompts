  Milgrom & Stokey (1982): No trade theorem: When risk-averse traders have common
  priors and begin at a Pareto optimal allocation, then if it is common knowledge
  that a trade is feasible and accepted, it cannot be that someone expects gain merely
  from differing beliefs. More simply: rational risk-averse agents with common priors
  will not engage in purely speculative trade based on differences in information
  alone, because the willingness to trade reveals information and prices already reflect
  it.


