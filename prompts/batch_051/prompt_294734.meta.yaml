  Then present the rounds:


  (1) One of them, a set theorist by training, said the hotel story is a clean reductio
  of actual infinity: if a fully occupied hotel can accommodate a new guest without
  adding rooms, that violates the principle that a whole is greater than any of its
  proper parts, so the only way to make sense of the story is to reject the premise
  that there is a completed infinite hotel. The other replied that this just begs
  the question by importing a principle that is true of finite wholes but not of infinite
  ones; the whole point of the story is to show that the principle does not transfer.


  (2) The first replied: But the story is deliberately concrete—rooms, keys, occupants—so
  if you have to say the principle does not transfer, you have conceded that the phrase
  "fully occupied hotel" has no concrete meaning in the infinite case; you are no
  longer talking about a hotel but about a formal abstraction, which is exactly the
  concession the finitist wants. The second said: That is too fast. Every mathematical
  structure can be illustrated with concrete props without inheriting their finite
  constraints; a sphere in geometry doesn''t become false because no physical sphere
  is perfect. The consistency of the structure is unaffected by the props.


  (3) The first said: The consistency question is separate. The real issue is that
  the story packs in two different things: a rule that for any room n there is a room
  n+1, and the claim that all rooms can be surveyed at once so that the simultaneous
  shift is defined. A finitist can accept the rule and reject the completed totality.
  Hilbert''s hotel is precisely where the completed totality does the work, because
  the move "everyone shifts" is only well-defined if there is a whole collection to
  shift. The second replied: But the shift is just the function f(n)=n+1 on the natural
  numbers. You can grant that f is defined for every natural number without first
  grasping the naturals as a completed object; the function is given by a rule, which
  is exactly the finitist''s own notion. So the hotel does not show that the completed
  totality is doing any work.


