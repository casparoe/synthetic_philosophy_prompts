  Brandom''s inferentialism details I need to get right:


  Core claims (from Making It Explicit, Articulating Reasons):

  - Semantic inferentialism: the content/conceptual content of an expression is to
  be understood in terms of its role in inference — specifically, its role in materially
  good inferences (material inferences, not just formal/logical ones). "Meaning as
  inferential role."

  - He distinguishes broad vs. narrow inferential role? Actually he might; his is
  usually semantic inferentialism: contents are what can both serve as and stand in
  need of reasons.

  - Normative pragmatics: the fundamental concept is the "game of giving and asking
  for reasons." To be a discursive practitioner is to keep score on commitments and
  entitlements. Assertions are moves that undertake commitments and entitlements.

  - Inferential relations include: commitment-preserving (e.g., "Pittsburgh is to
  the west of Philadelphia" commits to "Philadelphia is to the east of Pittsburgh"),
  entitlement-preserving, and incompatibility-entailments (e.g., "this is red all
  over" is incompatible with "this is green all over").

  - He rejects representationalism as primary: representation/reference is explained
  in terms of inference (anaphora and substitution), not the other way around; he
  is critical of the idea that word-world relations are the fundamental semantic relation.

  - He wants to explain semantic content in terms of pragmatic normative attitudes,
  not reduce it away (he''s not an eliminativist; he''s an expressivist? Actually
  he offers a "meaning-use analysis" and a normative pragmatics that is prior). He
  is not saying meaning is private; it''s social, deontic scorekeeping.

  - He draws on Sellars: "the game of giving and asking for reasons"; inferentialism
  is a form of semantic pragmatism.

  - He distinguishes three grades of modal involvement? That''s more advanced (Kant/Sellars,
