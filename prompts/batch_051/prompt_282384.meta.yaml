  Frankfurt''s argument against PAP:

  - PAP: a person is morally responsible for what she has done only if she could have
  done otherwise.

  - Frankfurt cases: Jones decides to shoot Smith. Black, a neurosurgeon, wants Jones
  to shoot Smith, but prefers not to intervene. He monitors Jones''s brain and, if
  Jones is about to decide not to shoot, Black will intervene and make Jones decide
  to shoot. As it happens, Jones decides on his own to shoot; Black never intervenes.
  Intuition: Jones is morally responsible even though he could not have done otherwise
  (because Black would have prevented the alternative). Therefore PAP is false.

  - Subtleties: the alternative is blocked; the actual sequence of events runs through
  Jones''s own decision; responsibility depends on the actual sequence, not alternative
  possibilities. "Flicker of freedom" debate: some argue there remains an alternative
  possibility (e.g., a sign that Jones would decide differently, or the prior inclination),
  and Frankfurt''s case only challenges a strong version of PAP. Also Frankfurt''s
  claim: coercion doesn''t always excuse if the person would have done it anyway.


