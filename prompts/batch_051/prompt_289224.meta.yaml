  Let''s design the Lewis triviality prompt carefully:


  Persona: software engineer building an inference engine or probabilistic rules engine.
  No formal philosophy background. Relatively formal/polished.


  Commitments:

  1. In my system, a rule like "if P then Q" should denote a well-defined event (a
  set of possible worlds/outcomes) so it can be assigned a probability and combined
  with other rules via Boolean operators.

  2. When reasoning under uncertainty, the probability I should assign to "if P then
  Q" is just the conditional probability of Q given P: P(if P then Q) = P(Q|P).

  3. Probabilities obey the standard Kolmogorov axioms, including that logically equivalent
  statements have the same probability.

  4. Conditional probabilities are defined in the usual way by ratios: P(Q|P) = P(Q
  and P)/P(P), at least when P(P) > 0.

  5. It can be rational to assign different probabilities to two conditionals whose
  antecedents and consequents... Hmm.


  Wait, to get Lewis triviality, the standard setup: Adams'' Thesis: P(A→B)=P(B|A)
  whenever P(A)>0. If → is a propositional connective such that this holds for all
  probability functions, then triviality. The proof uses:

  P(A→B) = P(A→B | B)P(B) + P(A→B | ¬B)P(¬B)

  and applying Adams'' thesis to conditional probabilities conditioned on B and ¬B:

  P(A→B | B) = P(B | A and B) = 1

  P(A→B | ¬B) = P(B | A and ¬B) = 0

  so P(A→B)=P(B). Thus P(B|A)=P(B), i.e., A and B independent. For arbitrary B, this
  only if P(A)... The stronger result: P(A→B)=P(B) for all B with P(A)>0? Actually
  the proof shows P(B|A)=P(B), making A probabilistically independent of every B,
  which collapses. So the commitments include (a) conditionals express propositions
  that can be conditioned on and undergo Boolean operations, (b) Adams'' thesis, (c)
  standard probability calculus, including conditioning. That''s enough.


