  Prompt draft (type A, domain 5):


  "Construct a choice scenario that satisfies each of the following simultaneously:

  (i) a consumer chooses among ordinary bundles of goods in two realistic shopping
  episodes, with no lotteries, no uncertainty, no change in budget or information,
  and no prices acting as quality signals;

  (ii) the consumer''s choices violate the Weak Axiom of Revealed Preference: good
  A is chosen while good B is affordable in the first episode, and B is chosen while
  A is affordable in the second;

  (iii) the same consumer is nevertheless best described as maximizing a single, stable
  utility function, because the two choice episodes differ only in a feature of presentation
  that legitimately enters the description of the alternatives;

  (iv) the presentation feature is not a classic third-option decoy and does not change
  the information the consumer has.


  After presenting the scenario, show exactly how WARP is violated, state what the
  standard revealed-preference reading would conclude about the consumer, give the
  stable utility function that rationalizes the choices and explain why it is not
  an ad hoc re-description, identify the single feature of the case that drives the
  verdicts apart, and say how a committed revealed-preference theorist would attack
  the scenario and what modification would make their objection fail."


