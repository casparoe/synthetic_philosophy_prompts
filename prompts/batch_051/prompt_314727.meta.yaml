  Potential prompt:


  So I''m working on a novel about a group of geophysicists in the late 1960s who
  end up on opposite sides of a genuinely major scientific split. I reread Thomas
  Kuhn''s The Structure of Scientific Revolutions to get the psychology right, and
  there''s a stretch where he says, roughly, that after a paradigm shift scientists
  don''t just describe the same observations differently—they work in a different
  world, and even the stable experimental results start to look different because
  the paradigm tells them what to see. I know I''m paraphrasing. But reading it as
  a novelist I found myself wanting to take the strong incommensurability reading
  and run with it: rival paradigms are not just underdetermined; there is no theory-free
  stock of observations, and the criteria that one paradigm uses to dismiss another
  are themselves internal to the winning paradigm. This is important to me because
  it would mean my characters can''t resolve their break by appealing to the data—and
  that''s the story I want. But I can''t tell weather I''ve fallen for a piece of
  science studies rhetoric, or a real claim. So: I hold the strong incommensurability
  position about Kuhnian paradigm shifts. What would count against it? I''d like exactly
  five points, each one or two sentences, no intro or conclusion, ranked from what
  would be the most damaging to what would be merely awkward. Please be honest about
  whether the position has been softened enough to escape testing, and if so whether
  that''s a problem for the view.


