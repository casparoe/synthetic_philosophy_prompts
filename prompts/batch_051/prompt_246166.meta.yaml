  ---


  During a recent seminar on language evolution, a fellow student laid out an argument
  that I cannot shake. Each premise seems, on its own, almost undeniable; the conclusion,
  however, strikes me as obviously wrong, and I would be grateful to know precisely
  where the reasoning overreaches. I work on ambiguity in natural languages, so I
  ought to be able to locate the flaw myself, but my attempts keep collapsing into
  hand-waving.


  (1) A communicative code is well-adapted to the extent that it enables a hearer
  to recover a speaker’s intended message reliably. (2) Homonymy—where a single linguistic
  form (a segmental string, a pitch contour, a tonal specification) carries two or
  more unrelated meanings, with context left to select among them—forces the hearer
  to choose among interpretations, and any selection procedure can miscarry. (3) Therefore,
  other things equal, a code that admits such preventable ambiguity is less efficient
  than one that avoids it. (4) The cost of avoidance appears small: a speech community
  need only decline to retain, or actively prune, forms that collide, since the orphaned
  senses can be covered by existing alternate forms, borrowing, and periphrasis. (5)
  Thus, under ordinary communicative pressures, natural languages should either emerge
  without homonyms or progressively eliminate them once they arise. (6) Yet natural
  languages stablely harbour homonymy of every kind—lexical, morphological, and morphophonemic—and
  speakers routinely treat it as unremarkable; communication does not collapse. (7)
  Therefore either the argument fails at some step, or natural languages are simply
  not well-adapted communicative systems.


  I want to reject (7) and, if possible, to retain (1) together with the assumption
  that languages are shaped by communicative pressures. Which premise or transition
  should I give up instead, and what does that concession cost? Is homonymy best understood
  as a tolerated cost, as a sign that the argument has omitted a competing set of
  pressures on the system, or as something else? Please attend to the numbered steps
  individually; I am less interested in a general catalogue of how ambiguity is resolved
  than in identifying the point at which the inference outruns the premises. I would
  also ask that the response be written in British English.


