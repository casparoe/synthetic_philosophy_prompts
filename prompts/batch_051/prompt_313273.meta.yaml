  The criteria I was taught for a construction being well-defined:

  1. The result must not depend on arbitrary choices: if two people carry out the
  construction and make different choices at the choice points, they end up with literally
  the same object.

  2. If the choices do matter, then the construction just isn''t well-defined — not
  "well-defined up to isomorphism" or "well-defined in spirit," but broken.

  3. A choice only counts as a problem if it''s genuinely unconstrained; if there''s
  a rule that settles it, fine.


