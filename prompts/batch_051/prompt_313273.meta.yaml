  x^2 + 1 = 0 has two solutions, and over the reals nothing picks one out. If I call
  one of them i, then the other is -i, and complex conjugation swaps them while fixing
  every real number. Every true equation/statement stays true if you globally swap
  i and -i. So by criterion 1, "i" is not well-defined — two people can each "pick
  a root" and get objects that are not literally the same, just mirror images. But
  it feels insane to say complex analysis is built on a non-well-defined object, because
