  Prompt:

  "In the Politics, Book I chapter 9, Aristotle writes:

  ‘with every article of property there is a double way of using it; both uses are
  related to the article itself, but not related to it in the same manner—one is peculiar
  to the thing and the other is not peculiar to it. Take for example a shoe—there
  is its wear as a shoe and there is its use as an article of exchange; for both are
  ways of using a shoe, inasmuch as even he that barters a shoe for money or food
  with the customer that wants a shoe uses it as a shoe, though not for the use peculiar
  to a shoe, since shoes have not come into existence for the purpose of barter.’
  Later he says money came to be for exchange, and usury is most contrary to nature
  because its gain comes from money itself.


