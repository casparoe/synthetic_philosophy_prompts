  on — not merely because nobody encounters it or cares about it, but because something
  about the idea itself tends to work against its own retention or transmission.


  The boundary is where I''m stuck. Consider these cases and tell me which your definition
  counts as antimemes, which it counts as non-antimemes, and which it leaves undecided:


  1. A random 16-digit number I generate once, never write down, and forget by tomorrow.

  2. The PIN to my bank card, which I remember perfectly but refuse to tell anyone.

  3. A profitable mathematical theorem that is true and useful, but so unmemorable
  that almost no one retains it even after understanding it.

  4. A joke that lands beautifully the first time but is already stale by the second
  telling, and so almost never gets retold.

  5. "Don''t think about a white bear": an instruction that spreads easily, once heard,
  but that reliably makes people fail exactly at what it asks.

  6. A recurring dream image that feels vivid while I''m asleep, then dissolves the
  moment I wake up and cannot be reconstructed however hard I try.

  7. A safety warning posted above a machine that workers have walked past so many
  times that they no longer notice it''s there.


  I want a definition that draws a principled line, gives defensible verdicts on as
  many of these as possible, and explains why the concept seems to slide around between
  content, memory, attention, and social transmission. Where your definition gives
  a surprising verdict, defend it rather than revising it.


