  definition counts it as an antimeme, rules it out, or leaves it undecided, and explain
  briefly:


  1. A random 16-digit number I generate once, never write down, and have forgotten
  by the next day.

  2. The PIN to my bank card, which I remember perfectly but never share with anyone.

  3. A true and even useful mathematical theorem that almost nobody can remember a
