  4. The epistemic quality of a legislative decision depends on both the decision-makers''
  inputs and the process by which proposals are drafted, amended, and scrutinized;
  a lottery alone guarantees neither competence nor incompetence.

  5. No selection mechanism eliminates staff and lobbyist influence; the question
  is how each channels it.

  6. Perceived legitimacy is partly a habit: institutions can gain or lose legitimacy
  over time, so the current familiarity of elections is not by itself a decisive argument.

  7. Real-world citizens'' assemblies have mostly been advisory and their recommendations
