  I spent my career as an experimental physicist, and I have only recently begun reading
  moral philosophy seriously. A member of my local philosophy reading group set out
  the following argument, which he says he has reconstructed from several books on
  convention and moral obligation. It strikes me as careful, and yet its conclusion
