  so I want to know precisely where it goes wrong, if indeed it does.


  (1) A social convention is a regularity in behaviour that people in a group conform
  to because they expect others to conform, and on whose persistence they rely when
  deciding what to do.

  (2) If a person reasonably relies on a pattern of behaviour, and would be set back
  by its breach, that reliance can ground a moral reason for others to conform to
  the pattern.

  (3) Therefore, whenever a convention is well established, participants have a pro
  tanto moral obligation to conform to it; this obligation binds visitors and locals
  alike, because the reliance of those one encounters is the same.

  (4) In some jurisdictions, paying small bribes to officials in order to obtain routine
  permits is a well-established convention in exactly this sense: everyone expects
  the payment, the officials depend on it for their income, and applicants routinely
  plan around it.

  (5) So in such jurisdictions a visitor has a pro tanto moral obligation to pay the
  bribe.

  (6) But no one can have a pro tanto moral obligation to do what is morally wrong,
  and bribery is morally wrong.

  (7) Therefore the practice described in (4) cannot be a convention that generates
  a pro tanto obligation, despite satisfying the definition in (1) and the test in
  (2).

  (8) Since it does satisfy them, the definition and the test must be too permissive;
  so everyday conventions, merely as conventions, never generate moral obligations.


