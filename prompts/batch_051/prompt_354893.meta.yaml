  ---


  You are grading for an upper-level undergraduate course in nineteenth-century political
  philosophy. The exam question and a student''s answer are given below.


  Exam question:

  Mill''s The Subjection of Women is often described as an attack on appeals to "nature"
  in defense of women''s legal and social subordination. Reconstruct Mill''s critique
  of such appeals. Address at least the following: (a) what, on Mill''s account, is
  the relation between what is customary and what is called "natural"; (b) what Mill
  claims to establish about women''s natural capacities; and (c) how those claims
  figure in his positive case for equality.


  Student answer:

  Mill locates the subordination of women as an anachronistic survival of the rule
  of force within a civilization that now demands that institutions justify themselves
  by utility. On Mill''s view, the appeal to women''s "nature" is question-begging
  in a specific way: the traits that are called natural are themselves produced by
  the very system of subjection that they are invoked to defend. What custom calls
  "nature" is, to a large extent, custom''s own artifact — habits formed by education,
  expectation, and legal disability from infancy. Mill''s comparison with slavery
  serves his argument here: every system of domination has claimed that its victims
  are naturally suited to their subordinate station, but the observable character
  of the dominated is precisely what the domination has manufactured. From this, Mill
  concludes that men and women possess no natural differences in capacities relevant
  to their legal and social standing. He accordingly grounds his case for equal suffrage,
  equal access to occupations, and married women''s property rights on this empirical
  demonstration of natural equality: once it is shown that the alleged natural differences
  are artifacts, the only remaining basis for women''s exclusion is mere force or
  prejudice. On Mill''s view the maxim "follow nature" is therefore not just unreliable
  but contentless, and he thinks it should be discarded altogether. This is what makes
  his argument radical: it rests on a strong factual claim about human nature rather
  than on the weaker, merely procedural point that the defenders of subjection have
  not met their burden of proof.


  Task:

  Grade this answer. Assign a letter grade (if you like, also give the corresponding
  percentage or points). Then provide the specific, point-by-point comments you would
  write to the student to justify that grade. Your comments should identify which
  claims in the answer are correct, which are mistaken or overstated, and exactly
  how the mistakes affect the overall assessment. Do not just give a general impression.


