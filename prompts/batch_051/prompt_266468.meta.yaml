  The blue bus problem: A plaintiff is hit by a bus; the only evidence is that 80%
  of buses on route are Blue Bus Company, 20% other. Statistically, preponderance
  of evidence says blue bus more likely than not, but courts generally refuse liability.
  The debate is why bare statistic is insufficient when no individualized evidence
  linking the defendant. Objections to convicting on naked statistics: reference class
  problem (the 80% may be arbitrary class), the fact that the statistic is not "about"
  the particular event in the right way, risk of punishment without actual culpability
  (with 80% probability, 20% chance of wrong). However, judges accept some probabilistic
  evidence. The gatecrasher: 499 people paid, 1 gatecrashed? Actually gatecrasher
  paradox: if 1,000 spectators at rodeo, only 499 tickets sold, can we say each of
  1,000 is more likely than not a gatecrasher? For each individual, probability of
  being gatecrasher is 50.1%? Wait: if 1000 attendees, 499 paid, 501 gatecrashed,
  then each attendee is 50.1% likely to be a gatecrasher. But courts refuse to find
  any specific person liable on that alone. The paradox: We can prove "most people
  here are gatecrashers" to high confidence, yet cannot prove any one person is. Or
  simpler: the company knows 501 gatecrashed but can''t identify them.


  Proof beyond reasonable doubt in criminal law: We might know that, say, 90% of prisoners
  in a yard participated in a riot, but can we convict each one? Naked statistics
  conflict with "proof beyond reasonable doubt" and presumption of innocence because
  it would convict people with known chance of innocence. The "lottery paradox" and
  "reference class" issues.


