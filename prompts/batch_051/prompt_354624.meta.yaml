  Aumann''s agreement theorem (1976): Suppose two agents have a common prior, observe
  private information (partitions of a finite state space), are Bayesian rational
  (update by conditioning). If their posterior probabilities for an event E are common
  knowledge (each knows the other''s posterior at some level, eventually common knowledge),
  then the posteriors are equal. Actually the theorem: "Agents cannot agree to disagree"
  — if it is common knowledge what the posterior probabilities are, they must be the
  same. Requires common prior and common knowledge of rationality and of posterior
  beliefs.


  Common misrepresentations:

  1. Claiming it shows rational agents with different priors must converge or cannot
  disagree — false, different priors allow disagreement.

  2. Claiming if two people honestly share opinions/information, they will end up
  agreeing — theorem is about common knowledge of posteriors, not about what happens
  after exchanging; indeed there''s a result (Geanakoplos and Polemarchakis) that
  revising through communication leads to agreement under common prior, but Aumann''s
  theorem itself doesn''t give convergence from dialogue; it says if posteriors are
  common knowledge then they''re equal — a static condition, not a dynamic convergence
  result.

  3. Saying any disagreement implies at least one person is irrational — false: disagreement
  can stem from different priors, both rational.

  4. Saying common knowledge of posteriors always obtains in real conversations, so
  real-world disagreement about facts (e.g., juries, scientists) is irrational. False:
  real agents often don''t have common priors and don''t reach common knowledge of
  posteriors.


