  ---


  I recently joined the staff of an institute that advises governments on long-horizon
  public investments, and I have been trying to get clear on how Keynes thought we
  should reason when probabilities cannot be quantified, because our unit is about
  to decide how much of our uncertainty analysis should be numerical. Last week two
  senior colleagues argued about this, and I have been unable to sort out exactly
  who is right.


  The disagreement, as best I can reconstruct it:


  (1) Hartwell said that for something like the net cost of a coastal adaptation project
  in forty years, no meaningful numerical probability is available. He said this is
  Keynes''s distinction between risk and uncertainty: risk is like a roulette wheel,
  where the odds are known, whereas uncertainty involves one-off, structural futures
  where the odds themselves are unknown. He concluded that any number we attach in
  such cases is false precision, and the honest output is qualitative scenarios and
  expert judgment, not an expected-cost figure.


  (2) Okafor replied that Keynes''s point was not that uncertainty rules out all probability
  judgment, only that it rules out a calculable numerical probability. She said Keynes
  still allowed a rational degree of confidence and ordinal comparisons between alternatives,
  so Hartwell''s move from "no precise number is justified" to "no comparison is justified"
  is too strong.


  (3) Hartwell answered that this leans on Keynes''s early Treatise on Probability.
  In his later reply to critics of the General Theory, he said, Keynes described cases
  such as the price of copper twenty years out or the obsolescence of a new invention,
  where there is no scientific basis for any calculable probability; we simply do
  not know. What then fills the gap, Keynes thought, is convention, which holds until
  it suddenly shifts. So, Hartwell said, a ranked comparison of one-off projects is
  just convention dressed up as evidence.


  (4) Okafor said the later passage is a diagnosis of how investors actually behave,
  not an argument that convention exhausts rationality. She added that Keynes''s early
  work already separated a probability from the weight of argument, meaning two non-numerical
  judgments can differ in evidential support even when neither warrants a number;
  nothing in the later passage withdraws that distinction. In any case, she said,
  refusing to rank options is itself a choice under uncertainty, so if Hartwell''s
  reading were right, Keynes would have left us with no rational basis even for preferring
  one qualitative scenario over another, which cannot be the correct reading of someone
  who spent decades on the logic of partial entailment.


  (5) Hartwell replied that market conventions are at least repeatedly tested by outcomes;
  a forty-year coastal decision is a one-off with no such test, and the evidential
  support Okafor invokes is imported from a past that, on Keynes''s own account, is
  not a reliable guide to those futures. So the ordinal comparisons she wants are,
  for this class of decisions, as much a pretense as point estimates.


  (6) Okafor answered that if that were right, the residual rational obligation would
  be to name the limits of any comparison rather than to abandon comparison; Keynes''s
  view, she said, reduces to a demand for honesty about the kind of support a judgment
  has, not to silence about relative likelihood.


