  I would like your judgment on an argument I witnessed at a recent workshop on the
  ethics of risk. Two colleagues — I shall call them Rahim and Vogel — became entrenched
  in a disagreement over a case, and neither I nor the others present managed to referee
  it to anyone''s satisfaction. The case was this. A chemical plant released a substance
  over the course of a year, exposing one hundred thousand nearby residents to a one-in-one-hundred-thousand
  increase in their chance of developing a fatal cancer. The exposure occurred without
  the residents'' consent; they were not informed in time to refuse or move. As it
  happened, no one developed the cancer. The question under dispute was whether the
  company wronged any of the residents.


  Rahim argued that it plainly did. Wrongness, he said, must be assessed ex ante —
  from the standpoint of the agent at the time of acting, with the information then
  available. At that moment the company knowingly imposed a risk of serious harm on
  each resident, without consent. Being subjected to that risk was itself a setback:
  each person has an interest in bodily security and in deciding what risks to bear,
  and the company treated that interest as a cost it could override for its own convenience.
  The fact that the costs failed to materialize does not undo the wrong, any more
  than a reckless driver who luckily hits no one thereby becomes blameless.


  Vogel replied that Rahim was conflating the standpoint of rational decision with
  the standpoint of wronging. A rational agent must compare expected outcomes ex ante,
  but wronging is a relation between persons, and it requires a victim. In this case
  no resident was made worse off; no one''s life went differently than it would have
  gone had the plant never operated. The release may have been dangerous, even grossly
  negligent, but danger is not the same as wrongdoing. If harm never materialized,
  there is no one with a complaint grounded in having been harmed, and without such
  a complaint the language of "wronging" is misplaced.


  Rahim answered that Vogel was ignoring the difference between harming a person and
  wronging a person. One can wrong someone without harming them: a burglar who breaks
  into a home and takes nothing has still wronged the occupant. What the residents
  are owed is not compensation for a harm but acknowledgment that the company treated
  them — each of them — as if their consent did not matter. The complaint is not "you
  made my life go worse"; it is "you made me bear a risk I never agreed to bear."


  Vogel countered that the burglary example cuts the other way. The burglar''s wrong
  lies in the violation of the home and in the wrongful intent, not in exposing the
  occupant to a "risk of loss." Consider instead a factory that installs a faulty
  guardrail on a walkway: if no one falls, we rightly criticize the safety procedures,
  but we do not say that every pedestrian who walked past was wronged by the guardrail.
  Rahim''s view, Vogel continued, would make ordinary life impossible to live morally,
  since driving, maintaining a building, or running a hospital all impose small unconsented-to
  risks on unidentified others. What is needed is an account of when risks are acceptable
  — a threshold or principle of fair social cooperation — not the blanket claim that
  every unconsented-to risk wrongs the person who bears it.


  Rahim replied that the guardrail and ordinary-activity examples smuggle in the very
  thing under dispute: a background of reciprocity and shared benefit that makes the
  risk reasonable. The plant in our case enjoyed all the benefit while the residents
  bore all the risk, without any fair scheme of reciprocity. Moreover, Vogel''s ex
  post view has a morally strange implication. Imagine the identical release in a
  second town, where by chance one resident does develop the cancer. Vogel''s view
  says the company now owes that one resident a full remedy and owes the other ninety-nine
  thousand nine hundred and ninety-nine nothing, even though the company did the same
  thing to all of them. Whether an act wrongs nearly everyone it touches should not
  be settled by a lottery over outcomes.


  Vogel responded that this is not a reductio but an accurate description of responsibility
  for harm: remedies track harm, and we cannot distribute compensation for harms that
  never occurred. The claim that the one unlucky resident and the others were all
  wronged in the same way conflicts with the fact that only one of them has been made
  worse off. Both of us, he added, are circling around a deeper question: whether
  a risk that does not materialize is itself a harm to the person who bears it, or
  merely a danger of harm. On that question, Rahim has been assuming rather than arguing
  his conclusion.


  I found the matter genuinely difficult, and I would value an adjudication. Please
  work through the exchange point by point: on which specific claims is each of them
  right, where does each argument fail, and what — if anything — are both parties
  missing? Then state which overall position you judge to be the stronger, and why.
  Try not to advance a third view without first showing where the two presented positions
  break down or can be reconciled.


