  "My team maintains a big monorepo, and there are a bunch of unwritten conventions
  in it—test file layout, naming, log message format, when to squash commits, that
  sort of thing. No one ever really decided these; they just congealed, mostly through
  imitation and code review. I''ve been reading some of David Lewis''s account of
  convention, the idea that a convention is a regularity everyone goes along with
  because they expect everyone else to go along, even though some other regularity
  would have worked about as well. It''s made me see our repo differently, and also
  made me wonder whether we could manage the drift on purpose.


  So here is a mechanism we''re thinking about. We keep a list of the top two-dozen
  unwritten conventions, each written in one line, and for each one we also write
  down one or two legal alternatives?—the different style that a dissenting dev could
  switch to without it being a bug. Every week a bot picks three of these and attaches
  a tiny survey to the PR that touches the relevant code: who uses which alternative
  in new code, and whether you''d follow if a colleague moved a file to another alternative
  or revert it. The survey is not binding and the results are visible to everyone.
  If a convention gets a supermajority of "I actually use a different alternative"
  votes for three straight weeks, the bot declares a 30-day migration window. During
  that window, any alternative on the list can be used with no review comment, but
  each use is tagged so the bot can count it. When the window closes, the bot picks
  whichever alternative was used in more new files during those 30 days; that becomes
  the bot-enforced convention, and old-style code outside the window gets a non-blocking
  note, not an error. The bot doesn''t care who''s style wins.


  Obviously this is not how conventions normally change. In Lewis terms, I think we''d
  be taking something that works because it''s common knowledge and deliberately messing
  with the expectations underneath it. What I want is a careful walkthrough: what
  happens to the team''s ability to coordinate during the survey and the migration
  window, who would strategically game the poll or the counting, whether the 30-day
  usage plurality actually settles a new convention or just measures whoever owns
