  Let''s write:


  I''m a PhD student in early modern, and I''ve been trying to make my chapter on
  Spinoza''s moral psychology do something more than rehash the standard story. I''m
  pretty conviced by the necessitarian reading of the Ethics: everything follows from
  God/nature with the same necessity, so the ordinary experience of choosing otherwise
  is just the effect of ignorance of causes. And I also want to keep Part V’s picture
  of the intellectual love of God as the highest possible state—understanding myself
  and my affects as modes of the one substance, and thereby passing from bondage to
  blessedness. But then I keep coming back to the opening of Part IV, where Spinoza
  says:


  “Human infirmity in moderating and checking the emotions I name bondage: for, when
  a man is a prey to his emotions, he is not his own master, but lies at the mercy
  of fortune: so much so, that he is often compelled, while seeing that which is better
  for him, to follow that which is worse.”


  That doesn''t sound like a datum to be explained away; it sounds like a firm description
  of something real. The person in that sentence sees the better, so in some sense
  he has an adequate idea, or at least something more than mere ignorance, and he
