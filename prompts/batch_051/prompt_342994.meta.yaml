  couldn''t referee it then, and I still can''t. I scribbled the exchange down as
  best I could remember it.


  Mara said: (1) "Take binary sequence prediction. Whatever rule you use to predict
  the next bit, if you average over all possible binary sequences—each continuation
  equally likely—the rule gets the next bit right exactly half the time. Deep network,
  fancy Bayesian updater, ''always guess 1'': all equal. The only way any rule beats
  another is if it already treats some continuations as more likely than others. But
  that weighting is exactly the assumption induction was supposed to justify. So the
  theorem is Hume with equations: the data earn you nothing, and the prior is unearned."


  Eli said: (2) "That''s a theorem about a distribution nobody believes in. Under
  that uniform measure, almost every sequence is patternless—no compression, no regularity—so
  of course pattern-finding does no better than guessing. The actual world is not
  drawn uniformly from the space of all possible sequences. It''s the one world we
  have, and it''s shot through with stable structure. Induction doesn''t need to work
  in all possible worlds, only in this one. The no-free-lunch theorem doesn''t formalize
  Hume; it formalizes the tautology that in a patternless world, pattern-hunting doesn''t
  work."


  Mara: (3) "You just made my point. Saying ''this world has stable structure'' is
  itself an induction—you learned that structure from past experience. The theorem
  shows why that can''t help: any inductive rule only wins inside a small region of
  sequence space, and the only reason to think you''re in that region is a prior that
  the data themselves can''t supply. You can''t bootstrap yourself from the data to
  the bias without already having the bias. So the theorem isolates the justificatory
  gap."


  Eli: (4) "Only if ''justified'' means ''performs well in every possible world,''
  which was never our standard. Induction is justified the way any instrument is justified:
  by its track record in the actual world. Our inductive practices deliver planes
  that fly and drugs that cure. You can''t make that disappear by averaging over goblin
  worlds where induction fails. No-free-lunch says lunch isn''t free in all possible
  worlds; fine—we pay for our lunch with assumptions that have so far paid rent."


  Mara: (5) "The track record move is the circle Hume already spotted. ''Induction
  has worked in the past'' is a fact about the past, and you''re using induction to
  project it forward. No-free-lunch makes the circle visible: the track record is
