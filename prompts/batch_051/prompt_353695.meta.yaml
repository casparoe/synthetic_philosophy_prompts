  "What Revealed Preference Reveals: A Projection Problem for the As-If Reading"


  The revealed-preference tradition was built partly to rid economics of the old psychological
  conception of utility as an inner magnitude that agents consciously or unconsciously
  maximize. In its place, the theory starts from observable choices over budget sets
  and imposes consistency conditions — the weak and generalized axioms of revealed
  preference, in the standard formulations — under which a real-valued utility function
  can be found such that the choices are representable as maximizing that function.
  Utility, on this reading, is not a mental substance; it is a numerical index constructed
  from a pattern of choices.


  But the as-if reading rests on a fault line. The consistency conditions are not
  properties of any single choice; they are constraints on a whole family of choices
  across different menus. When the data are finite, as they always are in empirical
  work, the usual rationalizability results are existence results only: many distinct
  utility functions fit the same observations equally well, and the axioms guarantee
  that at least one such function exists, not that a unique one does. Every substantive
  use of estimated utility — predicting how the agent will choose on a menu she has
