  Let me write:


  Title: "What Does Revealed Preference Reveal? A Projection Problem for the As-If
  Reading"


  The revealed-preference tradition in economics was built, in part, to cleanse utility
  of its old psychological associations. Instead of starting from an inner magnitude
  called "utility" that agents consciously or subconsciously maximize, we start from
  observable choices. Subject to consistency conditions such as the weak and generalized
  axioms of revealed preference, there exists a real-valued utility function such
  that the agent''s choices can be represented as maximizing that function. Utility,
  on this reading, is not a mental substance; it is a numerical index constructed
  from a pattern of choices.


  But the as-if reading sits on a fault line. The consistency axioms are not properties
  of a single choice but constraints on a whole family of choices across different
  menus. When the data are finite — as they always are for empirical work — the usual
  rationalizability results are existence results only: many distinct utility functions
  fit the same observations equally well, and the axioms guarantee at least one, not
  a unique one. So every substantive use of estimated utility — to predict how the
  agent will choose on a menu she has not yet faced, to compute a welfare change,
  or to recover a "true" preference from noisy or inconsistent choices — requires
  choosing among functions that are indistinguishable on the observed data. That choice
  is an act of projection: we must stipulate which aspects of past choice the agent''s
  future choice will preserve.


  Here is the difficulty. If "the agent acts as if she maximizes u" is read as a mere
  redescription of the observed choice data, then it licenses no projection; it is
  a compact summary, not an explanation or a prediction. If it is read as licensing
  projection and welfare analysis, then it amounts to a substantive claim that the
  agent possesses a stably ranked set of dispositions across menus — precisely the
  kind of psychological or behavioral commitment the as-if language was meant to avoid.
