  does, (3) there''s some clear alternative R'' the population could have followed
  instead, and (4) this is all common knowledge. A norm, I thought, is just a convention
  plus sanctions. But my verdicts on cases are pulling away from that.


  Here are the cases:


  (a) Driving on the right. Pure convention. If I woke up in a world where everyone
  drove on the left, I would too, with no feeling that anything was lost.


  (b) Calling dogs "dogs." Also convention, but I''d be much readier to correct someone
  than my definition predicts, and it doesn''t feel arbitrary in the way driving side
  does — though I can''t say why. Maybe just because language is my machinery, not
  my policy.


