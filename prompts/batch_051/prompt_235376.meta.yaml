  "I spent my career running dose-response experiments, and lately I''ve been reading
  philosophy, and I''ve got a homemade idea about thought experiments I''d like checked.
  I think of a thought experiment as a single-point titration: the author fixes a
  huge dose of one factor (push the fat man off the bridge, harvest the healthy organs,
  flick the switch) and asks our moral instrument to read out a number. But in the
  lab you''d never infer a whole response curve from one near-saturating dose. Real
  moral responses are probably non-monotonic in the dose of a factor—causing harm
  to one to save five feels different at small scale than at enormous scale—and at
  extreme doses the machinery saturates: it tracks the presence of an enforced tradeoff,
  not the normal operation of the relevant principle. So I suspect many famous intuitions
  from extreme cases are mostly artifact. I call this the saturated-probe view: thought
  experiments are fine as probes, but they mislead when a case sits in the saturation
  range for the very concern being tested. Is this already a known objection (probably
  is), is it distinct from just saying cases are unrealistic, and where exactly does
  it break down? Give me the clearest counterexample to my view: a thought experiment
  with an extreme dose that nevertheless tracks the ordinary range."


