  Let''s draft:


  "I''m taking a course on statutory interpretation, and I''ve been trying to make
  sense of the absurdity doctrine by sorting the cases we''ve read into what look
  like three different doctrines that all go by the same name. I''d like an honest
  assessment of whether the distinction holds up, whether it''s already in the literature,
  and where it breaks.


  The three kinds:


  1. **Doctrinal incoherence** (maybe call it ''textual absurdity''): the literal
  reading is self-defeating or internally contradictory — e.g., a statute that directs
  a board to ''hear an appeal of its own decision'' which, read literally, makes the
  board both party and adjudicator and thereby defeats the point of an appeal; or
  a provision whose plain terms require two duties that cannot both be performed.
  Here the court isn''t overriding policy so much as repairing a broken instruction.


  2. **Purpose-defeating absurdity** (''purposive absurdity''): the literal reading
  is fully coherent but would produce the exact opposite outcome of the statute''s
  evident purpose — the classic Holy Trinity pattern, where a ban on importing foreign
  labor would be applied to a church bringing over its minister even though the law
  was aimed at cheap manual labor. The court departs from the letter to preserve the
  point.


  3. **Repugnance absurdity** (''value-repugnant absurdity''): the literal reading
  is coherent and arguably even faithful to purpose, but it yields a result so contrary
  to background legal or moral commitments — e.g., a statute read literally would
  require the state to pay a benefit to a murderer,... or would convict someone who
  couldn''t possibly have known... etc. — that the court refuses to apply it.


  My working thought is that these are genuinely different: (1) is about semantic
  or practical incoherence, (2) is about fidelity to legislative intent, and (3) is
  a limited license for courts to impose normative limits on statutes. Calling them
  all ''absurdity'' lets courts borrow the legitimacy of the easy cases (1) for the
  hard ones (3). I want to know: is this trichotomy coherent, is there already a standard
  version of it in the literature, and does it actually track what courts are doing
  — or does every supposed case of (3) collapse into a disguised version of (1) or
  (2)?"


