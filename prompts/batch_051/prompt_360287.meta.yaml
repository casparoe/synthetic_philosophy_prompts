  Student answer:


  "Etiological accounts say the function of a trait is the effect that explains the
  trait''s persistence through natural selection: roughly, a trait''s functions are
  its selected effects. Causal-role accounts, due to Cummins, say the function of
  a part is whatever contribution it makes to a capacity of a larger system, regardless
  of evolutionary history. They come apart in cases of exaptation. Suppose a trait
  originally spread because of effect A and later was co-opted for effect B. The etiological
  account assigns it only A until selection has acted to maintain B; the causal-role
  account can assign it B now, relative to the organism''s current capacities. For
  example, insect wings may have originated as thermoregulatory structures and only
  later been used for flight. Etiologically their function is still thermoregulation;
  causal-role says their function is flight. The two accounts therefore give different
  answers whenever a trait is currently useful in a way that didn''t play a role in
  its selection. A further difference is that causal-role accounts allow nearly any
  arbitrary effect to count as a function: a nose''s function of supporting glasses
  would count, since it occupies a role in the ''holding up glasses'' system. For
  this reason, etiological accounts are normatively richer: they let us say a malfunctioning
  heart is still a heart, because its selected effect is pumping blood even when it
  currently cannot do so."


