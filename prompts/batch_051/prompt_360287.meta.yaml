  Let''s reason deeply about biological function accounts.


  Etiological (Wright, Millikan, Neander) account: a function of a trait is the effect
  for which it was selected—i.e., effects that explain why the trait has been maintained
  by natural selection (or reproduction/differential replication). Causal-role (Cummins)
  account: function of a part is its contribution to some capacity of the containing
  system that the analyst picks out; functions are relative to an explanatory interest
  in a system capacity. Difference: a nose''s causal role may be to hold up glasses,
  but not etiological function; a trait can acquire a new causal role (heart pumping
  blood? actually heart has etiological function of pumping blood, but exaptation:
  feathers initially selected for thermoregulation, now used for flight; causal-role
  function relative to flight? But if not yet selected for flight, etiological function
  is thermoregulation).


  Student answer could correctly distinguish but mistakenly assert that causal-role
  accounts identify functions with any actual effect a trait has; actually causal-role
  accounts identify function relative to a chosen capacity of a containing system,
  not every effect; and the effect must be a dispositional contribution to that capacity
  under analysis, not just any effect. Another subtle mistake: claim Cummins'' account
  entails "everything has functions" because any component contributes some capacity?
  Actually that''s a known objection but maybe misstep: it makes functions explanatory
