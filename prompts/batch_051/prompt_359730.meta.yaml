  The mechanism. Each citizen receives an annual endowment of one hundred value tokens.
  A standing commission draws up a fixed list of evaluative criteria (welfare, autonomy,
  equality, dignity, social trust, care, cultural continuity, and so on); the list
  is revised only by supermajority of the commission. At any point during the year
  a citizen may permanently burn tokens on one criterion; each criterion''s weight
  in the AI''s objective rises with the square root of the tokens burned on it, so
  the first token on a criterion buys a full unit of weight, but the tenth buys far
  less than the first. At year''s end the weights are summed, normalized to one, and
  published. For the following year the AI maximizes only this weighted sum, across
  every citizen, in its public-service decisions.


