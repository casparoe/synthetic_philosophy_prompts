  percent of the total weight: any surplus above forty percent is discarded and the
  remaining weights renormalized. Second, citizens may not burn tokens on behalf of
  others'' allocations, and a token''s provenance is irrelevant—only the act of burning
  counts—so there is nothing to trade.


