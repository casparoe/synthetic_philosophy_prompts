  Positions in the imagery debate:

  - Pictorialism / depictivism (Kosslyn): mental images are depictive representations,
  functionally spatial.

  - Propositionalism / descriptivism (Pylyshyn): mental images are carried by structured
  symbolic descriptions; the apparent spatial properties are epiphenomenal or due
  to tacit knowledge.

  - Enactivism / sensorimotor view (Thomas, maybe): imagery is not representation
  but re-enactment of perceptual exploration; no inner picture.

  - Eliminativism/aphasia? Not a theory exactly.

  - Maybe "functionalist/format-neutral" view.

  - Maybe "adverbialism" (imagining is a way of experiencing not an object).


