  1. Mental rotation: RT linear with angle, max speed ~60°/s. Depictivists take this
  as evidence for analog rotation; propositionalists say tacit knowledge + demand
  characteristics could explain, but the linearity and neural evidence? Enactivists
  say it''s motor anticipation. A question: "When you rotate a seen letter to judge
  if it''s mirror-reversed, the time it takes increases continuously with angle. Which
  best describes why?" Options: (a) I actually turn an internal image through intermediate
  positions; (b) I apply a step-by-step algorithm whose steps increase with angle;
  (c) I feel my head/eyes/hand doing the rotation vicariously; (d) It doesn''t feel
  like anything spatial to me. Sort.


  2. Image scanning: Kosslyn''s island/map: time to scan between two points on a memorized
  map is linear with distance. Depictive: there''s a spatial array; propositional:
  inferred from expectations, tacit knowledge; enactive: scanning is motor/perceptual
  exploration. Question about scanning across imagined map.


  3. Resolution / acuity: imagining a small animal next to a large one; questions
  about whether you can "see" the whiskers of an imagined fly when it''s next to an
  elephant. Depictive says images have limited granularity/field; propositional says
  you have the info only as descriptions; etc.


