  Prototype account: category membership determined by similarity to abstract summary/prototype;
  typicality gradient; some cases borderline.

  Exemplar account: categories represented by stored exemplars; similarity to recalled
  instances; can explain odd effects (e.g., classification depends on specific remembered
  instances, context effects).

  Theory theory: concepts embedded in intuitive theories; hidden/essential features
  trump superficial features; e.g., a raccoon painted to look like a skunk is still
  a raccoon (Keil). A grandmother? "The tiger that''s been shaved and taught to act
  like a housecat" still a tiger.


