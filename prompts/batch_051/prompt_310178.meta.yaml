  Position A (nativist/rationalist-ish, "hypothesis selection"): The learner approaches
  the task with a rich, pre-specified space of candidate concepts, ordered by something
  like simplicity or naturalness; a few examples serve to eliminate most candidates;
  the heavy lifting is done by the ordering/hypothesis space, not the examples. This
  is like a strong inductive bias / small-but-well-chosen hypothesis class + simplicity
  prior.


  Position B (empiricist/constructivist, "feature construction"): The learner doesn''t
  bring a pre-ranked concept space; concepts are assembled from the examples via noticing
  similarities, shared features, analogies. The examples do the heavy lifting; any
  bias is minimal/domain-general (e.g., a similarity metric, attention, working memory).
  This is like learning a representation from data with minimal architectural bias.


  The debate: which is the right account of how a system can induce a concept from
