  two strongest considerations on each side.


  By moral particularism I mean the view that the possibility of moral thought and
  judgment does not depend on the provision of a suitable supply of moral principles:
  roughly, there are no true, exceptionless, non-vacuous general moral principles
  that explain or justify our particular moral verdicts. By minimal moral generalism
  I mean the negation: there is at least one true, exceptionless, non-vacuous general
  moral principle that does genuine explanatory or justificatory work for at least
  some particular moral verdicts, rather than merely summarizing them after the fact.


  Give me your credence in minimal moral generalism, with a full decomposition of
  the reasoning, as follows. You must produce, at minimum:


