  of each:

  a. That some non-vacuous moral principle could be exceptionless even given the apparent
  context-sensitivity of many moral considerations (e.g., that causing pain counts
  against an act in most cases, though not obviously in the case of pain inflicted
  to prevent a greater harm).

  b. That, if such principles exist, at least one of them is such that their conditions
  are finishable with finite, natural moral vocabulary rather than with an open-ended
  list of exceptions and conditions.

  c. That at least one such principle has genuine explanatory force — that it does
  more than record a pattern or summarize cases.

  d. That at least one such principle is needed for or actually used in particular
  moral justification (i.e., that one cannot justify a particular verdict without
  leaning on a principle).

  e. That there is no case in which the same feature''s moral valence demonstrably
  switches (e.g., that something''s being pleasurable counts in favor of an action
  in one case but against it in another), which would refute the simplest kind of
  exceptionless principle.


  (2) How these sub-questions combine (e.g., which are necessary for your overall
  judgment, which are independent, which are partly redundant) and what numbers you
  would assign to any supplemental sub-questions you think have to be in the picture.


  (3) Your final credence in minimal moral generalism.


