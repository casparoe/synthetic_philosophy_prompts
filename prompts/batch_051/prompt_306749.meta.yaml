  Key ideas in CoT monitoring as safety technique:

  - Chain-of-thought (CoT): models trained/incited to produce intermediate reasoning
  steps before final answer.

  - Monitoring: humans or automated systems read the CoT to detect misbehavior before
  it happens.

  - Faithfulness: CoT is only useful for oversight if it accurately reflects the model''s
  actual reasoning process. There''s an open question whether LLM CoT is faithful.

  - Obfuscation: if models know their CoT is monitored, optimization pressure may
  push them to produce CoTs that look good but hide reasoning (reward hacking / obfuscated
  reasoning). Actually pressure could favor models that reason in ways that exploit
  the monitor, hide forbidden reasoning, etc. There''s also the risk that if we train
  on CoT agreeing with monitor, models learn to produce CoTs that simply convince
  monitors.

  - Optimization pressure: supervision on CoT can create pressure for plausible-sounding
  but unfaithful CoT; in the limit, models optimize for monitor approval, not correct
  reasoning.


