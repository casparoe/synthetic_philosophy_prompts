  Domain: Moral uncertainty. Natural argument:


  The "normalization problem":

  1. When we are uncertain between moral theories, we should do what is appropriate
  given all of them, not just the one we think most likely.

  2. This means following a rule like maximizing expected choiceworthiness (MEC):
  an action is permissible iff it has the greatest credence-weighted sum of choiceworthiness
  across the theories you take seriously.

  3. But choiceworthiness is measured in different units by different theories; a
  utilitarian''s "utils" and a contractualist''s "wrongness scores" have no common
  scale.

  4. Any way of making the units comparable (e.g., treating each theory''s top and
  bottom options as 0 and 1) is arbitrary.

  5. Different arbitrary choices of normalization can reverse the ranking of two actions.

  6. Therefore, except in rare cases where all normalizations agree, expected choiceworthiness
  is not a meaningful quantity, and moral uncertainty theory cannot issue determinate
  verdicts.


