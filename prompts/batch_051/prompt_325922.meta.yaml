  careful causal claims: he did not claim Protestantism caused capitalism; he claimed
  an "elective affinity" between the Protestant ethic and the spirit of capitalism.
  He also had other factors (rational law, free labor, double-entry bookkeeping, cities).
  And he used ideal types as one-sided accentuations, not descriptions of reality.


  The problem of explaining with values: values/culture are often invoked as causes,
  but there are questions: (1) Can a value/ethic be identified independently of the
  behavior it''s supposed to explain? If we infer the ethic from the behavior (e.g.,
  seeing disciplined saving and calling that "the Protestant ethic"), the explanation
  is circular. (2) Values underdetermine action: the same value can rationalize opposite
  behaviors; people can have values without acting on them. So postulating a value
  doesn''t by itself explain a specific practice. (3) Causal direction and selection:
  maybe the ethic arose as a rationalization/after-the-fact justification of economic
  behavior, or both were caused by something else (e.g., capitalism created the ethic).
  (4) Values can be consequences as much as causes. (5) Weber''s use of ideal types
  and elective affinity suggests he understood these issues.


