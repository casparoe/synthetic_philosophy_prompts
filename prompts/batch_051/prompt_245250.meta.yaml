  One student wrote this answer:


  The self-torturer has a device with 1001 settings, 0 to 1000. Each increase is so
  small he cannot detect any difference in how it feels, and each increase brings
  him $10,000. So at any step, moving from n to n+1 seems like a pure gain: the money
  goes up and the felt discomfort is the same. But the distant setting 1000 is excruciatingly
  painful, and he would prefer 0 to 1000 no matter how much money he accumulates.
  Thus his preferences go 0 < 1 < 2 < ... < 1000, yet 0 > 1000. This is a preference
  cycle, so transitivity fails. The self-torturer is being irrational because he knowingly
  creates a situation he does not want. The standard solution is to distinguish actual
  pain from felt pain: although adjacent settings feel the same, each step actually
  adds a tiny bit of pain, so the stepwise preference for n+1 over n is based on a
  false belief. Once we correct the false belief, the intransitivity disappears, and
  he should stop at the setting where the actual amount of pain starts to outweigh
  $10,000. That''s Quinn''s point: apparent violations of transitivity of preference
  always rest on mistaken beliefs about the outcomes."


