  Filippo Santoni de Sio and Jeroen van den Hoven, "Meaningful Human Control over
  Autonomous Systems: A Philosophical Account" (Frontiers in Robotics and AI, 2018).
  They propose that an autonomous system is under meaningful human control if the
  system has the capacity to "track" the relevant human reasons and the human''s decisions,
  and the human has the capacity to "trace" the system''s behavior back to their decisions
  — thus designing and operating systems so that human agents can be held morally
  accountable for the system''s actions. They discuss two "fingers" of MHC: tracking
  and tracing. They define: "A system S is under meaningful human control (MHC) to
  the extent that it exhibits the properties of ''tracking'' and ''tracing''." Tracking:
  the system tracks the relevant moral reasons of the humans responsible for it, i.e.,
  the system is responsive to the reasons of the human. Tracing: the system''s actions
  can be traced back to one or more human agents (the "fingerprints" of agency?).


  Objections in the literature: (a) The "control dilemma" — as autonomy increases,
  human control decreases; (b) responsibility gap (Matthias 2004, Sparrow 2007): no
  human can be fairly held responsible for the system''s behavior because it is unpredictable
  or because the system''s "decisions" break the chain; (c) the tracking/tracing account
  may be too permissive: many automated systems (e.g., an airliner autopilot) track
  and trace yet pilots can be held responsible; or too restrictive; (d) accountability
  ≠ control: tracing might be satisfied ex post even when control was absent ex ante;
  (e) the standard reply from defenders: MHC is not about individual moment-to-moment
  control but about overall oversight, systems design, and the distribution of responsibility
  across designers, operators, commanders, etc.; demanding more would ban many uses
  that are safer than human alternatives.


