  I co-host a small podcast on the ethics of emerging military technology, and next
  month we are recording an episode with a guest who defends a tracking-and-tracing
  account of meaningful human control over autonomous weapons. On her view, a weapon
  system remains under meaningful human control only if two conditions are met: a
  tracking condition, requiring the system to respond to the relevant moral reasons
  of the humans who design and deploy it and to the relevant facts of the operating
  environment; and a tracing condition, requiring that the system be designed so that
  the outcomes of its operations can always be traced back to at least one human along
  the chain of design and operation. She argues that this amounts to neither a demand
  for a human to approve each individual engagement in real time nor a license to
  field whatever system one can build, but a design standard that keeps responsibility
  from evaporating. The episode has become personal for me: my sibling works in sensor
  support for unmanned platforms, and I have begun to suspect that the familiar assurance
  that a human remains in the loop does more to reassure the public than to secure
  actual control. I therefore want the conversation to test whether the account really
  distinguishes meaningful human control from mere administrative traceability.


