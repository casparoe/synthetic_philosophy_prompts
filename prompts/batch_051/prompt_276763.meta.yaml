  Potential final:


  "I''m in this philosophy club at school and two people got into a weird fight about
  the paradox of hedonism last week. We''d read a bit of Henry Sidgwick''s Methods
  of Ethics, and the passage we looked at says, basically, that if you aim directly
  at being happy/pleased, you often end up with less of it than if you aimed at something
  else for its own sake. I don''t have the exact wording in front of me, but that
  was the gist.


  One friend, call him A, said this is a devastating problem for hedonism as a practical
  view. If pleasure is the only thing that matters, then the rational thing is to
  pursue it directly. But Sidgwick''s point shows that pursuing it directly tends
  to fail. So hedonism tells you: the best way to get the only thing that matters
  is to stop trying to get it and care about other stuff for its own sake. But you
  can''t just switch off the belief that pleasure is the only thing that matters,
  so you''re stuck pretending. He said that''s self-defeating.


  The other friend, B, said A is overstating it. First, the paradox is not universal.
  It''s true for certain kinds of complicated, self-conscious pleasures — like trying
  to force yourself to have fun at a party or trying to be happy. But there are plain
  sensory pleasures where aiming directly at them works fine: if I''m hungry and eat
  something really good, the direct aim at the pleasure of eating doesn''t destroy
  it. Second, even when the paradox applies, the hedonist can decide to focus on activities
  for their own sake while still believing those activities are justified by the pleasure
  they''ll bring. Motivation and justification are different. You don''t need self-deception,
  you just need to get absorbed in the thing. People do it all the time.


  A came back: that''s exactly the problem. A hedonist''s reason for choosing the
  activity is the pleasure it will bring, so the "for its own sake" focus is instrumental
  all the way down. If you truly believed the activity mattered only as a means to
  pleasure, you couldn''t genuinely get absorbed in it; the absorption would depend
  on hiding your own reason from yourself. Maybe it''s possible for a while, but it''s
  fragile, and the moment you remember why you''re really doing it, the paradox bites
  again.


  B said: no, because we can have two attitudes at once. You can know the moon is
  a huge rock, but still see it as a beautiful glowing thing. You can know a game
  is just made of rules invented for fun, and still care about winning within the
  game. The hedonist is in the same position: she knows her ultimate value is pleasure,
  but she can still take the activity seriously while she''s doing it.


  Neither would budge. I''m supposed to write a short paper on who''s right about
  what. Can you go through their back-and-forth and say, not just who wins overall,
  but which specific claims each one gets right and which they get wrong? And if there''s
  a version of hedonism that escapes the paradox, what does it have to give up?"


