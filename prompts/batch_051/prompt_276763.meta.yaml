  Let''s outline:


  I''m in this philosophy club at school and two friends got into a whole thing about
  the paradox of hedonism. I read a bit of Sidgwick for it — in Methods of Ethics
  he says something like (no quote) happiness is something you get as a byproduct
  of doing other things, and aiming straight at it tends to make it slip away. Actually
  the exact line is not in front of me but that''s the gist.


  Then friend A says: So hedonism is self-defeating as a practical philosophy. If
  pleasure is the only thing that matters, then the way to get it is to not aim at
  it, which is psychologically impossible if you really believe pleasure is the only
  thing that matters. So hedonism asks you to act in ways that require forgetting
  it''s hedonism.


  Friend B says: That''s too strong. The paradox only says the direct pursuit of pleasure
  often fails, not always. There are pleasures where you can aim directly at them
  and they don''t disappear — eating good food, resting, etc. Sidgwick''s examples
  were about excitement or happiness, not plain sensory pleasure. So the paradox is
  an empirical generalization about certain higher pleasures, not a conceptual trap
  for hedonism. Also, you can aim at a specific activity for its own sake while still
  knowing it will make you happy; that''s not self-deception. You can have a "commitment
  strategy" — decide to focus on the activity, not the happiness.


  Friend A counters: But if hedonism is true, the only reason to commit to the activity
  is because it produces happiness. So your focus on the activity is instrumental,
  and the paradox kicks back in: you can''t genuinely care about the activity for
  its own sake if you''ve already judged its value to be only instrumental. You''d
  be faking it. Maybe you can fool yourself for a while, but it''s unstable.


  Friend B: That conflates justification and motivation. A hedonist can justify the
  activity by the pleasure it brings, but once engaged, she can be motivated by the
  activity itself. There''s no contradiction in doing something for its own sake while
  having a background belief that its value comes from pleasure. People do that all
  the time: they get absorbed in games, food, music. The paradox is real but limited.


