  The classic argument (Downs 1957):

  1. The only effect your vote has on the outcome is through the possibility that
  it breaks a tie or makes a tie (i.e., is pivotal).

  2. In a large electorate, that probability is minuscule.

  3. So the expected instrumental benefit of voting (probability of pivot × the difference
  in value between better and worse candidate) is tiny — smaller than the cost of
  voting (time to register, travel, wait, inform yourself).

  4. Therefore a purely self-interested rational voter shouldn''t bother to vote.

  5. But if everyone follows step 4''s reasoning, no one votes, and democracy can''t
  aggregate preferences, which is worse than any candidate winning.

  6. Therefore either the argument proves too much (rationality would recommend the
  collapse of the institution that makes voting rational) or one of the premises is
  false.


