  "I keep returning to the strange-loop account of the self, and it leaves me in an
  uncomfortable position. The account has exactly the virtues I want in a theory of
  mind: it does away with the homunculus and with any substantive ego whose existence
  would require its own explanation; it treats the first-person pronoun not as the
  name of a thing but as a self-referential symbol, a pattern in a symbol-processing
  system that points back at the very process that produces it; and it thereby explains
  persistence across material change, the portability of a mind, and why no one brain
  structure needs to be identified as the seat of the self. On this picture, the causal
  powers I attribute to myself are the powers of the system that reads, writes, and
  re-reads the ''I''-symbol, not of a ghost in the machinery. I find the alternatives
  worse, and I do not want to reintroduce a soul or a Cartesian theater.


  But I also have a firm and persistent intuition that I am not, in the end, a symbol.
  Symbols are the sorts of entities that can be tokened in multiple places, whose
  existence depends on being interpreted by a code, and whose identity is a fact about
  that code; none of this is true of me as I find myself. When I deliberate, I take
  there to be something that is answerable for the choice, and a representational
  token, however self-referential, is not the kind of thing that can be answerable.
  The strange-loop view can explain why the system says ''I,'' but it seems to leave
  out the one the system is speaking for. The duplication thought experiment only
  sharpens the worry: if I am a symbol, then an exact copy of my cognitive system
  tokens the same symbol, and nothing about my first-person perspective marks this
  token as privileged; yet I cannot get myself to believe that the one here is not
  the one who matters.


