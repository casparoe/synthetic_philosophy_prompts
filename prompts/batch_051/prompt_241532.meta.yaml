  "I have been pulled toward the strange-loop view of the self and find myself unable
  to reconcile it with the way selfhood shows up for me from the inside. On the theoretical
  side, the view does genuine work: it eliminates the homunculus and the substance-like
  ego; it treats the ''I'' as a self-referential symbol—an abstract pattern in a symbol-processing
  system that denotes nothing other than the very loop by which it is generated—and
  it thereby explains why the self persists across changes in its material substrate,
  why it is portable, and why there is no need to locate it anywhere in particular.
  On this picture, the apparent causal power of the self is the causal power of the
  system that reads and writes the ''I''-symbol, so there is no ghost pulling levers,
  but only a loop that, once established, shapes downstream processing. I find these
  virtues real, and the alternatives look much worse.


  At the same time, I have a firm intuition, almost a datum, that I am not a symbol.
  A symbol is the sort of thing that can be tokened more than once, that exists only
  as read or interpreted, and whose identity is a fact about a code. I do not experience
  myself as any of these. When I deliberate, something is answerable for the choice
  in a way that a representational token, however self-referential, is not. The view
  seems to replace the subject with a kind of representational traffic and then call
  the traffic ''me.'' I don''t merely want to be told that the intuition is a folk-Cartesian
  residue; I want to know what it would cost to let the intuition go, what it would
  cost to amend the theory so it recovers ''the one who'' rather than only ''the that
  which represents,'' and whether there is a reading of the original view on which
  it was never meant to deny a subject—only to give an account of what the subject
  consists in. What should yield, and under what diagnostic would I be warranted in
  concluding that the theory and the intuition are not actually in contradiction?"


