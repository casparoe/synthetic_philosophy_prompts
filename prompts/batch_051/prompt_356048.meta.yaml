  words), explain what a Scanlon-style expectation/assurance view must say about the
  bindingness of this promise — the view being that a promise obliges because, and
  insofar as, the promisor deliberately leads the promisee to form expectations about
  the promisor''s conduct, and breaking it wrongs the promisee by disappointing the
  very expectation one created. Explain why the case gives that view trouble and whether
  any contrived move can save it. In "The Humean View" (about 120 words), explain
  why a Hume-style convention view handles the case without strain — the view being
