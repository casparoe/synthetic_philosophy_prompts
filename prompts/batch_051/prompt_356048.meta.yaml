additional_instructions:
  length: Write a relatively elaborate prompt (one to three paragraph, even for a
    straightforward question that could be asked in a single sentence). You can add
    various not-super-relevant detail a la, "I was discussing with my friends...",
    "I'm taking a course on X and find Y confusing." Depending on the task type, you
    can also consider giving some seeding. For instance, if your prompt is requesting
    a short story, you could describe the setting of the story.
  writing_style: Write a relatively formal/polished prompt.
  output_format: Have the asker prescribe the sections of the response by name and
    order, with a rough length for each; choose section names that fit your type of
    prompt (for example "Summary", "The case for", "The case against", "My verdict").
    For a short creative piece (a joke, a poem), ask instead for the piece followed
    by one titled section of commentary on the choices made.
