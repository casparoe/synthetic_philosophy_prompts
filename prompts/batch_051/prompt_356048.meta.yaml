  ---


  I''m running a graduate tutorial on the morality of promising, and my students keep
  treating two different sources of promissory obligation as if they were the same
  thing: the expectations the promisee forms, and the standing social practice of
  promising itself. In nearly every everyday example, expectation and convention travel
  together, so the students have no reason to pull them apart. I want a thought experiment
  designed to force the dissociation: a promise, made within an established practice
  of promising and with full uptake by the promisee, that forms no expectation in
  the promisee and no reliance in anyone else, but that is nevertheless clearly and
  robustly binding — a case where nearly anyone would say the promisor wrongs the
  promisee by breaking it. Constraints: keep it realistic (ordinary people, ordinary
  stakes), one paragraph, no legal or professional obligations (no contracts, oaths,
  or promises to a court), no deception about the meaning of the words or the promisor''s
  identity, and no one may ever learn whether the promise was kept. The promisee''s
  lack of expectation must be an honest feature of their psychology, not a consequence
  of their failing to understand the promise.


