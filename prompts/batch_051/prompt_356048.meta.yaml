  benefits everyone, and that breaking a promise wrongs others by free-riding on that
  practice. In "Shiffrin''s Addition" (about 100 words), say what a Shiffrin-style
  personal-relationship/authority-transfer view would add — the idea that promising
  matters because it grants the promisee authority over one''s future conduct, and
