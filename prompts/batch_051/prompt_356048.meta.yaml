  In "The Load-Bearing Feature" (about 80 words), identify the single feature of the
  case that does the work against the expectation view, and say what the verdict would
  become if that feature were deleted. In "The Scanlonian Reply" (about 150 words),
  give the strongest reply a committed Scanlonian would make — whether by locating
  a subtle residual expectation, by arguing the intuition that the case is binding
  is mistaken, or by relocating the obligation to some neighboring principle — and
  assess whether that reply recovers the full wrongness, or merely replaces a promissory
  wrong with a lesser one.


