  I''m leading a graduate tutorial on the morality of promising, and I want a single
  thought experiment that will force my students to stop running together two things
  they have been treating as interchangeable: the expectations a promisee forms, and
  the social practice of promising itself. In almost every everyday promise the two
  travel together — you promise, your word is underwritten by a shared practice, and
  the promisee forms an expectation — so no amount of ordinary case-mongering forces
  them apart. The case I want is designed to hold the practice fixed while removing
  expectation and reliance entirely: a promise, made within an established practice
  of promising and with full uptake by the promisee, that produces no expectation
  of performance in the promisee, produces no reliance in anyone, and remains binding
  in the full-blooded way that makes breaking it a wrong against the promisee. Constraints:
  it should be realistic (ordinary people, ordinary stakes, no philosophy-fiction),
  one paragraph, and it should involve no legal or professional obligation — no contracts,
  oaths of office, or promises to a tribunal. The promisee must understand the words
  and the act perfectly well; their lack of expectation should be a stable feature
  of their psychology, not the result of being misled about what was said or who is
  promising. No one should ever learn afterward whether the promise was kept, so that
  reputation and third-party effects are out of the picture. The case should generate
  its verdict from its details rather than stipulating it; I''ll count it a failure
  if the only reason to call the promise binding is that the case announces it is.


  Start with a section called "The Case" (about 150 words) that presents the scenario
  itself. Then work through the named views in order. In "Scanlon''s View" (about
  150 words), say what a Scanlon-style expectation/assurance view must say about this
  promise — on that view, roughly, a promise obliges because the promisor deliberately
  leads the promisee to form expectations about the promisor''s conduct, and breaking
  it wrongs the promisee by disappointing the very expectation the promisor created
  — and explain why the case gives that view trouble, including any contrived move
  available to it and why it is contrived. In "The Humean View" (about 120 words),
  explain why a Hume-style convention view has no comparable trouble — on that view,
  roughly, promising has force only inside a social practice whose general reliability
  is mutually advantageous, and breach wrongs others by free-riding on a practice
  one benefits from — and say exactly which feature of the case lets the view accommodate
  the verdict. In "Shiffrin''s Addition" (about 100 words), say what a Shiffrin-style
  personal-relationship/authority-transfer view would add to the diagnosis — the idea
  that promising matters because it vests the promisee with authority over a slice
  of the promisor''s future conduct, so that breach is an exercise of authority the
  promisor no longer has, not merely a disappointed prediction. In "The Load-Bearing
  Feature" (about 80 words), identify the single feature of the case that does the
  work against the expectation view, and say what would happen to the verdict if that
  one feature were deleted. Finally, in "The Scanlonian Reply" (about 150 words),
  construct the strongest reply a committed Scanlonian would actually make — by locating
  a subtle residual expectation, by denying the intuition that the case is binding,
  or by relocating the obligation to some neighboring principle — and assess honestly
  whether that reply preserves the specific wrong of breaking a promise or substitutes
  a weaker, different wrong for it.


