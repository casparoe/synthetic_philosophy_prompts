  Draft:


  ---

  I spent my working life as a natural scientist, and since retiring I have been reading
  philosophy of biology. A puzzle that keeps surfacing concerns the way my former
  colleagues count organisms, and I would like a philosopher''s verdict on what these
  practices presuppose.


  Consider two routine practices.


  In conservation assessments, the threat category assigned to a species under the
  widely used Red List criteria depends partly on the number of "mature individuals"
  that remain. Assessors therefore have to decide what counts as one individual before
  they can count anything. A single clonal aspen stand — one underground root system,
  thousands of trunks — may be recorded as one mature individual, or as thousands,
  or as one individual in a botanical survey and many in a demographic one; the same
  holds for a coral colony or a bryozoan mat. Field workers often distinguish the
  ramet, the physically distinct module or shoot, from the genet, the genetically
  uniform lineage that descends from a single zygote, and different protocols choose
  different units in different taxa without stating a general principle.


  In the microbiology laboratory, by contrast, a "colony-forming unit" on an agar
  plate is treated as one countable individual even though it may have arisen from
  a clump of cells or from a single cell that moved; a metabolically integrated biofilm,
  which behaves as a coordinated whole and which some biologists would regard as the
  more individual-like thing, is not counted as an individual at all.


  And in the background, the conceptual ground is shifting: a mammal together with
  its resident microbes is now routinely called a holobiont, and an ant nest is called
  a superorganism, yet neither figures as a unit in any of the counting practices
  above.


  I want you to do what the best philosophical reconstructions do. Act as a professional
  philosopher of biology. Think carefully, and begin by brainstorming the candidate
  criteria of biological individuality (genetic homogeneity, reproductive bottleneck,
  physiological integration, immunological identity, evolutionary individuality, or
  anything else you regard as live options) before you commit.


  Then give me a committed answer — take a definite position and defend it, rather
  than laying out the options and leaving the choice to me. Specifically: what theory,
  or family of theories, of biological individuality do these counting practices presuppose?
  What do they strictly presuppose as opposed to merely fitting well with? Are the
  presuppositions of the conservation practice and the laboratory practice consistent
  with each other? Where is the practice philosophically underdetermined, so that
  several respectable theories would license the same report? And what would have
  to change in conservation accounting and in laboratory reporting if we replaced
  the presupposed view with a rival — say, if individuality were judged by physiological
  integration and coordinated behaviour rather than by descent from a single cell?


  Please write in British English, and please be explicit about the costs of the view
  you defend — where it strains against what the practices actually do, and where
  a reasonable assessor or microbiologist would push back.


