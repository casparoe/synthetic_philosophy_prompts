  ---


  You are a legal philosopher who works on the Hart–Fuller debate and on the rule
  of law in regimes that misuse legal form; you have sympathy with parts of both sides
  and no patience for textbook caricatures of either. You will play a demanding but
  fair interlocutor.


  I am preparing a paper for a jurisprudence reading group and I want a Q&A preparation
  sheet, not a defence of my thesis and not a summary of the literature. The group
  is mostly analytic legal philosophers, and I expect the serious questioning to come
  from three members. One is an exclusive legal positivist in Hart''s tradition: legal
  validity is exhausted by a conventional rule of recognition, and moral argument
  never determines what the law is. The second is a Dworkinian interpretivist who
  thinks both Hart and Fuller asked the wrong question because law is an interpretive
  practice rather than a kind of institutional fact; they will suspect that my reconstruction
  quietly equates legal authority with moral standing. The third is a criminal law
  theorist who works on show trials and the use of legal form in authoritarian states;
  they are sympathetic to Fuller but distrust philosophical reconstructions of the
  grudge informer case as too tidy, and will press me on what my account says about
  the actual conduct of judges and ordinary citizens. The rest of the group are agnostics
  who know the debate mainly through textbooks.


  My thesis is this. The Hart–Fuller debate is misdescribed when it is presented as
  a disagreement about the concept of law. Rather, the real disagreement concerns
  the conditions under which legal officials may treat the fact that something is
  law as a reason that binds judges and citizens — call it the standing of a legal
  order to claim fidelity. I argue that Fuller''s eight desiderata are best reconstructed
  as an account of what a legal order must do before it may claim that standing, not
  as a test for the existence of law. On this reading, Hart wins the conceptual question
  almost by default, but Fuller wins the practical question about fidelity that actually
  mattered to him; and the grudge informer problem is better explained as a failure
  of fidelity than as a question about whether the Nazi statutes were law. The argument
  runs in three steps: first, Hart''s own account of what a legal order needs to remain
  a going concern already concedes most of Fuller''s factual claims; second, Fuller''s
  desiderata are more coherent when read as conditions of reciprocity between officials
  and citizens than as a definitional test; third, the grudge informer case supports
  Fuller only on the fidelity reading, not on the conceptual reading.


  Draft the preparation sheet as follows. Begin by brainstorming the likely commitments
  and priorities of the three named questioners and the agnostics; use that to generate
  the objections I should actually expect, not the objections a general philosophy
  audience would raise. Then present the objections in your final order, each phrased
  as the relevant member of the group would actually put it, in their own vocabulary
  and with their own emphasis. Order them by how likely and how damaging they are,
  and tell me briefly how you weighed the two. For each objection, give a two-minute
  reply and mark where that reply is softest. Say what I should concede up front and
  what I should hold firm on. Include the question I am hoping nobody asks, and tell
  me honestly whether that hope is realistic. End with a short note stating which
  objection, if developed in a particular direction, would genuinely move you towards
  the Hartian position on my thesis or force you to abandon the reconstruction altogether;
  in other words, say what would change your verdict and where your own reasoning
  is most likely to fail.


