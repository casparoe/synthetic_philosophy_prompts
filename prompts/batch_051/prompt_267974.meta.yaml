  Let me flesh out the concept in the prompt. The distinction:


  - Outcome-regret: the gap between the payoff you got and the best payoff you would
  have gotten in the actual state of the world, once the uncertainty resolves. This
  is what standard minimax regret computes: for each act and state, the shortfall.

  - Procedure-regret (or "diagnostic" regret): regret about the quality of the decision
  given what you knew at the time — whether your procedure was reasonable, whether
  you gave appropriate weight to evidence, etc. Example: a doctor who follows the
  correct protocol and the patient dies may feel little procedure-regret but maximum
  outcome-regret; a gambler who bets on a hunch and wins feels no outcome-regret but
  should feel procedure-regret.


