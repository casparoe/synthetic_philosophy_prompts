  ---


  I cover science and ideas for a general-interest publication, and I''m working on
  a piece about the governance of frontier AI training runs. I need to stress-test
  a concrete proposal before I write about it, and I want the analysis done the way
  a mechanism designer or political economist would do it: not as a moral argument
  for or against a pause, but as an account of how the rule would actually behave
  once the people it governs start adjusting to it.


  Here is the proposal. An international body maintains a public compute registry.
  Any organization planning to train a model whose training run is expected to exceed
  10^25 floating-point operations (FLOP) must file a pre-registration describing its
  intended capabilities, its data, its safety measures, and the capabilities it expects
  the model to show. Between 10^25 and 10^26 FLOP, the developer may proceed unless
  a review board objects within sixty days; the board can attach conditions, including
  staged training, external monitoring, and limits on deployment. Any run above 10^26
  FLOP is automatically paused until the board grants a license. To receive a license,
  the developer must show that the run''s expected marginal risk is small, that it
  can shut the run down and secure the weights, and that the safety benefit of training
  in the open outweighs the benefit of driving the work underground. The board may
  grant at most three such licenses per year. Major cloud providers must report monthly
  on customers'' large compute purchases, and export controls on accelerators make
  unregistered purchases harder.


  Before you commit to an overall verdict, brainstorm systematically: list every actor
  who has a margin of adjustment, and every number, term, or judgment in the mechanism
  that someone could manipulate, contest, or redefine.


  Then treat it as a mechanism. Walk through what it incentivizes among frontier labs,
  smaller developers, cloud providers, host governments, and the review board itself.
  Work through the ways it would be gamed, keeping in mind that compute is partly
  under the developer''s control, runs can be partitioned or underreported, expected
  marginal risk is extremely hard to estimate before training, and enforcement runs
  through parties with their own interests. Then assess where it fails or gets captured
  first. Does it select for real safety work or for the appearance of it? Does it
  produce the pause its advocates want, or does it mostly move the activity somewhere
  less legible? And since the case for pausing rests on compute being a workable proxy
  for dangerous capability, say what the mechanism''s likely behavior implies for
  that premise.


  I want the self-critical version of this analysis. Be explicit about where your
  reasoning is most likely to fail, and tell me which empirical finding or argument
  would change your overall verdict about whether the mechanism is worth defending.


  ---


