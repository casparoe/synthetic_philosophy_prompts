  "You are a professional philosopher working in metaethics and the philosophy of
  language, and you are assessing an analogy that structures much of the expressivism
  debate. In many introductions, expressivism about moral language is introduced through
  an analogy: moral utterances are like cheers and boos, or like exclamations of approval
  and disapproval, such as a spectator''s ''hooray'' or ''yuck'' at a play. On this
  picture, to call an act wrong is not to describe it but to express a non-cognitive
  attitude toward it, much as a boo expresses disapproval without stating that one
  disapproves. Critics then argue that this analogy cannot survive embedding: a conditional
  such as ''If lying is wrong, then getting your brother to lie is wrong'' cannot
  be treated as ''If boo lying, then boo getting your brother to lie,'' because the
  antecedent is not booed, and the whole conditional expresses a pattern of attitudes
  rather than a single attitude.


  Your task is to audit this cheer/boo analogy, not to decide expressivism in the
  abstract. Begin by making a correspondence table: what in moral discourse corresponds
  to what in the cheer/boo picture (the utterance, the attitude, the content, the
  speaker, disagreement, inference, etc.). Then identify where the mapping breaks
  down. In particular, separate the disanalogies that matter for the standard Frege–Geach
  objection — compositionality, embedded contexts, mixed sentences, attitude ascriptions,
  valid inference — from the disanalogies that are superficial and do no argumentative
  work. Then answer: does the Frege–Geach objection refute expressivism, or only the
  cheer/boo caricature of it? What would a better analogy be, if any, and can any
  single analogy do the work the cheer/boo analogy is asked to do? Be candid about
  the places where the analogy, properly repaired, still leaves expressivism with
  a hard problem to solve."


