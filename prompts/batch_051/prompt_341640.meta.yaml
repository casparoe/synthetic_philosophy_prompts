  I''m a PhD student in philosophy of science, working on predictability, and a friend
  in the geosciences dept walked me into an argument I can''t get out of. It''s not
  his original argument — everyone half-remembers some version of it — but he wrote
  it out cleanly and now it looks like it proves too much. I''ll number the steps.


  (1) A system has sensitive dependence on initial conditions (the butterfly effect)
  when arbitrarily small differences in its initial state grow until two trajectories
  that started close together look as different as randomly chosen states.

  (2) Weather is like this: that''s the standard reading of Lorenz, and it''s why
  forecast skill drops off after a week or two.

  (3) If a system is chaotic in this sense, then predicting its state at time t requires
  pinning down the initial state to a precision that grows exponentially in t.

  (4) Since any measurement has finite precision, no weather model can be reliable
  beyond some finite horizon — the further out you go, the more your error bars swallow
  the forecast.

  (5) Climate is just weather considered over long timescales and large spatial scales;
  it''s the same underlying atmosphere, ocean, etc., obeying the same equations.

  (6) So the same reasoning should apply: climate models also have a horizon beyond
  which they''re useless, the only difference being where the horizon sits.

  (7) But climate scientists do issue projections for decades to centuries — global
  mean temperature, regional precipitation distributions, and so on — and we treat
  these as informative enough to act on.

  (8) So either those projections aren''t really informative (the butterfly effect
  quietly refutes much of climate science), or one of the earlier steps has to go.


