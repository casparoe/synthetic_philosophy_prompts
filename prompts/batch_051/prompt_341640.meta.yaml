  Argument labelled "my supervisor says it proves too much" or "a friend walked me
  into this."


  Steps:

  1. A system exhibits sensitive dependence on initial conditions (SDIC) iff arbitrarily
  small differences in initial state grow large enough that, after some finite time,
  two nearby trajectories are as different as two randomly chosen states of the system.

  2. Weather is a chaotic system in this sense (the butterfly effect).

  3. For any chaotic system, exact prediction of the state at time t requires specifying
  the initial state to a precision that grows exponentially with t.

  4. No measurement is infinitely precise, so for any fixed precision, weather forecasts
  become useless after some finite lead time (around two weeks in practice, give or
  take).

  5. Climate is just weather considered over long timescales and large spatial scales.

  6. Therefore, by the same reasoning, climate prediction also has a finite horizon
  beyond which it is useless — the only difference is scale.

  7. But climate scientists do issue projections about global temperature, rainfall
  distributions, etc. for decades to centuries, and we treat these as genuinely informative.

  8. So either those projections aren''t genuinely informative (the butterfly effect
  refutes climate prediction), or the butterfly effect doesn''t do what we thought.

  Where does this go wrong? I''d like to keep both (4) and (7), but I suspect something
  happens between (5) and (6)."


