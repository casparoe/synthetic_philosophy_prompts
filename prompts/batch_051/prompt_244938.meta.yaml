  "Recently I''ve been working through Butler''s Sermon on Resentment and its relation
  to contemporary debates about unconditional forgiveness. Without quoting, he distinguishes
  forgiveness from forgetting and from excusing; he also says resentment is a natural
  check against wrongdoing. That distinction suggests the following argument."


  Then numbered steps:

  (1) If forgiveness is something one can be obligated to give, it must be appropriate
  to forgive even when the offender has not repented, apologized, or repaired the
  wrong.

  (2) Forgiving an unrepentant offender cannot require the victim to forget the wrong,
  since memory is not under voluntary control; instead it requires forswearing or
  substantially tempering resentment.

  (3) Resentment is a backward-looking negative attitude that treats the offender''s
  past action as a wrong done to the victim.

  (4) To forswear or substantially temper resentment toward an unrepentant offender
  is to cease treating the wrong as a reason for hard feelings, blame, or reduced
  trust.

  (5) But if the offender has neither repented nor repaired, the wrong remains a standing
  reason for hard feelings, blame, or reduced trust.

  (6) Therefore forgiving an unrepentant offender requires treating something that
  remains a standing reason as if it were not a reason.

  (7) But no one can be obligated to treat a standing reason as if it were not one;
  at most this is a supererogatory act of grace.

  (8) Hence unconditional forgiveness—forgiveness without repentance—can at most be
  permissible and admirable, not obligatory.


