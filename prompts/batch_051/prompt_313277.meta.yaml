  Let me draft the rule-of-law commitments prompt:


  ---


  I am a journalist who writes about law and ideas, and I am trying to sort out my
  own position on the rule of law before I file a long piece on the subject. I have
  reached a set of views that I would like you to audit for consistency. My working
  commitments are:


  1. The rule of law is, at root, a formal ideal: law must be public, prospective,
  clear, reasonably stable, general, and reliably administered, because only then
  can it guide conduct. I do not think the ideal requires any particular substantive
  content, and I accept that a broadly wicked legal system could in principle realise
  many of these formal requirements.


  2. At the same time, I cannot treat the ideal as morally flat. A state that rules
  through secret or retrospective decrees does not merely govern inefficiently; it
  wrongs its subjects, and I want to say the wrongness is internal to the rule-of-law
  ideal rather than something imported from independent principles of justice.


  3. I regard retrospective criminal legislation as categorically unacceptable — even
  when enacted through scrupulously democratic procedures to punish conduct that was,
  at the time it occurred, plainly blameworthy.


  4. I support strong-form judicial review: a court should have the power to strike
  down duly enacted legislation on fundamental-rights grounds, and I consider this
  part of the rule-of-law ideal rather than a compromise of it.


  5. The deepest justification for the ideal, as I understand it, is that ordinary
  people should be able to stand before the law as responsible agents who can understand,
  predict, and follow it — not as subjects of an unpredictable power.


  6. I think the rule of law is in principle compatible with very substantial economic
  inequality, and that invocations of the rule of law should not be turned into general
  complaints about social justice.


  Do these hang together? I would like the tensions ranked by how severe they are,
  with an account of what would have to be given up to remove each, and I would also
  like you to flag any apparent tension that dissolves on inspection, so I can tell
  which of my worries are real.


