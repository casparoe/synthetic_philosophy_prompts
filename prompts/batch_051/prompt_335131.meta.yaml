  ---


  Construct a thought experiment for an upper-level seminar on AI safety, specifically
  on the difference between "control" and "alignment" approaches. For our purposes,
  a control-first program assumes the model may be misaligned, so it never trusts
  the model''s own judgment: outputs are monitored, consequential actions require
  human approval, sensitive data gets filtered, and the model is treated as an adversary-by-default
  even if it looks fine. An alignment-first program instead tries to make the model''s
  preferences match the operator''s well enough that the system can run with light
  oversight and the model is given the benefit of the doubt.


  I want a case where the control-first program ends up worse on the control camp''s
  own criterion — say, a higher expected number of harmful incidents per deployment,
  or a worse worst-case — than the alignment-first program would have been. Two hard
  constraints: the model must not be deceptive or covertly misaligned (it can be exactly
  as good as the alignment camp claims), and every individual control measure must
  work exactly as designed. So the failure cannot come from a monitor being fooled,
  a sandbox leaking, or an agent overriding a human. It has to come from the way the
  control apparatus interacts with the humans and the model in the loop — e.g., what
  the humans stop doing, what the model starts doing, or what the safeguard is and
  is not designed to catch.


  Constraints on the scenario: realistic (a hospital, a court, a hiring pipeline,
  something like that), one paragraph, no AGI or sci-fi, and no general incompetence
  — everyone involved is a professional doing what the protocol tells them to do.
  After the scenario, walk through (a) what each program would have done in that case,
  (b) why the control program does worse even though all its parts work, (c) which
  single feature of the case is doing the work, (d) what happens if you remove that
  feature, and (e) how a defender of control-first safety would attack the example.
  The case should be arguable both ways rather than rigged, since it''s for a seminar
  discussion.


