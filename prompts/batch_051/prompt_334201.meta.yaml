  Last night I had a long argument with a friend about the norm of assertion: whether
  the fundamental rule governing flat-out assertion is that one must assert only what
  one knows, only what is true, or only what one believes. We left the argument roughly
  where we began, but something kept nagging at me, because I found myself reaching
