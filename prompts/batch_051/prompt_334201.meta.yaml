  Consider sworn testimony in a common-law trial — or a deliberately simplified version
  of it. A witness must swear or affirm to tell the truth and not to hold back any
  part of it, and a witness who does not do so can be punished; yet the offense punished
  is not simply false assertion, but, as I understand it, deliberately testifying
  to what the witness does not actually believe under oath. A witness who guesses
  and happens to be right has not committed perjury, and a witness who testifies to
  a falsehood they sincerely believed is not a straightforward case of perjury either.
  At the same time, the law imposes a separate requirement that points in a different
  direction: witnesses must testify from their own first-hand knowledge, not from
  hearsay or speculation. So the practice binds the witness, in one breath it seems,
  only to truth; punishes the witness only for insincerity about what they believe;
  and screens out some sincere testimony on the grounds that it is not known in the
  right way.


