  Let me think about the details of clinical equipoise for accuracy:


  - Clinical equipoise: a state of genuine uncertainty/conflict within the expert
  medical community about the comparative merits of treatments; a trial is ethical
  if there is honest, professional disagreement among expert clinicians about which
  treatment is preferable. This contrasts with "theoretical equipoise" (individual
  clinician must be perfectly balanced between arms), which is too fragile and makes
  most trials unethical because the moment data accumulates, the clinician''s equipoise
  is disturbed. Freedman proposed clinical equipoise.

  - Individual/theoretical equipoise: each physician-investigator must be genuinely
  uncertain which arm is better.

  - Community equipoise: uncertainty at the level of the community of expert practitioners.

  - Therapeutic misconception: research participants believe that treatment decisions
  in a trial are made in their individual best interest, like ordinary clinical care,
  when actually they''re made for scientific validity.

  - The uncertainty principle (Peto et al.): a patient should not be randomized if
  the responsible clinician is substantially uncertain which treatment is better;
  otherwise the patient should be offered the preferred treatment.

  - Zelen''s designs: randomization before consent (pre-randomization), single-consent
  design, double-consent design — controversial because patients aren''t asked before
  randomization.

  - Equipoise and early stopping: when do interim results disturb equipoise enough
  to stop.

  - "A vs A+B" trials, sham controls in surgery, placebo controls when proven effective
