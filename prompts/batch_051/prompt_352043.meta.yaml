  I''m a journalist covering the cognitive science of language and ideas, and I''m
  working on a piece about a foundational question that the field has never quite
  closed: Does metaphor have a special kind of meaning, or does it only have the literal
  meaning it would have in any context? The philosopher Donald Davidson argued the
  latter — roughly, that whatever metaphor does, it does without metaphorical meaning
  as a semantic or cognitive item. The rival camp, exemplified by conceptual metaphor
  theory, treats metaphor as a systematic mapping between domains that structures
  thought, not just talk. I want to force my own reporting to be precise, so I''d
  like your actual credence that Davidson is right about the specific claim that a
  metaphor''s contribution to understanding includes no propositional content beyond
  the literal truth-conditional content of the sentence as uttered. By ''right'' I
  mean: the best account of metaphor comprehension should not posit a level of metaphorical
  meaning that determines truth conditions, licenses entailments, or serves as the
  content of a hearer''s understanding in the way literal content does. Please give
  a single number, then decompose it. I want at least four sub-questions, with a probability
  for each, and a one-sentence justification. Which sub-question would most move your
