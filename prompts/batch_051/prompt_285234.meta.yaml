  Draft:


  "I''m a developer, not a lawyer, but this has turned into my problem: our company
  ships a proprietary plugin that loads a GPL-3 library at runtime and calls into
  it, and I''ve spent the last week trying to get a straight answer about whether
  we have to open-source the plugin. Our outside counsel says we''re fine, but the
  FSF''s docs seem to say we''re not, and I want to actually understand the disagreement
  instead of just picking whichever answer feels better.


  Pretend you''re an expert on free-software licensing and US copyright law. I want
  you to construct a thought experiment (a hacker-ish scenario, not a court case)
  to my specifications, and I''d like you to think carefully and brainstorm a few
  candidate setups before committing, then give me the one that works.


  Here''s the setup I want. There are two rival standards for when a new program counts
  as a derivative work of a GPL''d library:


  Standard A (the FSF-style intimacy standard): roughly, if the new program and the
  GPL''d library run in the same process and make function calls into each other,
  they form a single combined work, and the new program has to be GPL''d too. Crossing
  a process boundary — like talking over pipes or a socket — generally keeps them
  separate.


  Standard B (the abstraction-filtration-comparison style standard): roughly, you
  abstract the two programs into layers, filter out everything unprotectable — ideas,
  functionality, merger, scenes a faire, public-domain material — and then compare
  whatever protected expression is left. On this view, sharing function signatures
  or an API is not enough to make a derivative work; something protectable actually
  has to be copied or adapted.


  Build me a realistic scenario — ordinary proprietary software shipping to ordinary
  users, no sci-fi — where Standard A says the plugin is a derivative work of the
  GPL library and Standard B says it is not. Constraints: the plugin contains no copied
  GPL code, it''s distributed seperately from the library (the user installs the library
  themselves), and the whole thing should fit in one paragraph. After you give the
  scenario, walk through each standard and explain exactly why it gives its verdict.
  Then tell me which specific technical feature is doing the work, what happens if
  you remove that one feature, and how a defender of the standard that comes out looking
  aggressive would attack the case. I''m using this to explain the disagreement to
  a coworker, so don''t just stipulate the verdicts — the two verdicts should fall
  out of the technical details."


