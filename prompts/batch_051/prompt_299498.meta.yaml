  "I''m a PhD student in philosophy of science, and I''ve been going in circles on
  laws of nature for months, so I want someone to help me figure out what I''m allowed
  to keep. The view I''m attracted to is Humeanism — roughly, Lewis''s best-systems
  account: the laws are just the axioms or theorems of whichever deductive system
  best balances simplicity and strength in systematizing the whole mosaic of local
  matters of fact. Its virtues are real: no primitive ''nomic necessitation,'' no
  modal glue beyond the actual facts, and laws stay epistemically accessible because
  they''re just patterns in the very facts we can go look at. It also gives a clean
  story about the law/accident distinction — ''all the coins in my pocket are silver''
  is an accident because putting it into the system would add complexity without buying
  much strength, while ''all electrons have unit negative charge'' earns its keep
  by covering a huge range of phenomena cheaply.


  But I have an intuition I can''t shake: that laws don''t just summarize how things
  happen, they''re part of why they happen. If the law is a theorem of the best system,
  then this electron''s charge isn''t explained by the law; the electron''s charge
  is part of the mosaic that makes the law true. The arrow of explanation points up
  from the instances to the regularity, and that feels exactly backwards. It''s like
  saying the periodic table explains why this lump of sodium fizzes in water, when
  the table is just a summary of how lumps of sodium behave. It also makes me unsure
  how laws can support counterfactuals the way they seem to: everyone agrees that
  if this bit of sodium had been dropped in water, it would have fizzed, and we want
  to say the law underwrites that. But a non-governing summary seems to underwrite
  counterfactuals only in the loose sense that the closest worlds at which the summary
  is true are worlds where the thing happens — and it''s unclear to me whether that''s
  enough or just a paraphrase.


  So here''s the fork. Should I (a) debunk the intuition as leftover anthropomorphism
  about ''governing'' — the universe doesn''t legislate, it just is, and I should
  get over it; (b) keep the intuition and amend or abandon Humeanism — maybe laws
  are irreducibly relational facts about properties (Armstrong-style), or primitive
  facts about how the universe produces its next state (the ''governing'' view), and
  pay whatever metaphysical price that costs; or (c) accept a compatiblist reading
  where laws explain their instances in a deflationary, non-causal sense (structural
  explanation, or explanation by unification) that Humeans can honestly live with?
  I want a negotiated verdict, not just a side: what does each move cost, and is (c)
  a real reconciliation or just re-christening the intuition so it stops complaining?"


