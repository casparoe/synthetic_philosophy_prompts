  "I''m doing my PhD on laws of nature, and I keep finding myself pulled toward Humeanism
  and then yanked back by a basic intuition I can''t shake. The pull: the Humean view
  — roughly, Lewis''s best-systems account — says the laws are just the theorems of
  the deductive system that best balances simplicity and strength in describing the
  whole mosaic of local matters of fact. That''s so appealing: no primitive ''nomic
  necessitation,'' no modal glue holding the universe together, no mystery about how
  we could ever know laws, since they''re just patterns in the very facts we observe.
  It also gives a tidy answer to what makes a law different from an accident: an accidentally
  true generalization like ''all the coins in my pocket are gold'' isn''t part of
  the best system, while ''all electrons have charge -e'' is, because it buys enormous
  strength for almost no simplicity cost. I get all that.


  But here''s what yanks me back: I can''t shake the feeling that laws govern, or
  at least explain, their instances — that the reason this particular electron has
  charge -e has something to do with the law, and not merely that the law is a summary
  of lots of local facts including this one. On the best-systems view the explanatory
  arrow points the other way: the mosaic makes the laws true, so the electron''s charge
  is part of what explains the law, not vice versa. That feels like saying the periodic
  table explains why this chunk of sodium reacts with water, when really the table
  is a summary of the behavior of chunks of sodium. Also, if laws are just summaries,
  it''s hard for me to see why they should support counterfactuals the way they seem
  to: ''if this electron had been a positron, it would have been attracted to the
  electron...'' whatever. And the old complaint that Humeanism makes ''lawhood'' depend
  on our standards of simplicity and strength — the line between laws and accidents
  starts to look gerrymandered or interest-relative in a way that makes me uncomfortable.


  So I want help deciding what to give. Possibilities I see: (a) the ''governance''
  intuition is anthropomorphic residue and should be debunked — laws don''t push,
  they summarize, and that''s just the way it is; (b) the intuition is tracking something
  real and the Humean view should be amended or abandoned (maybe laws are primitive
  relations among universals, or some kind of dispositional essence); (c) there''s
  a reading on which they''re compatible — maybe laws can explain their instances
  in a weaker, non-causal ''structural explanation'' sense without contradicting Humeanism.
  What I want is not just which one you''d pick, but what each move costs, and whether
  (c) is an honest reconciliation or just relabeling the intuition so it stops hurting."


