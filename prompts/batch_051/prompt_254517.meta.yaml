  R a member of itself? (3) If R ∈ R, then by definition R ∉ R. (4) If R ∉ R, then
  by definition R ∈ R. (5) So R ∈ R iff R ∉ R, contradiction. (6) Therefore there
  can be no set of all sets... etc.


