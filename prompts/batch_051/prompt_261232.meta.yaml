  Prompt draft:


  "One of the central disputes in twentieth-century neuroscience was the ''soup versus
  sparks'' controversy over synaptic transmission. On one side, workers in physiology
  and pharmacology — most notably Henry Dale and Otto Loewi — argued that signaling
  across the junction between a nerve and its target is chemical: stimulation of a
  nerve releases a substance (something like acetylcholine) that diffuses across the
  gap and excites or inhibits the target cell. Their evidence included Loewi''s frog-heart
  demonstration that fluid from a stimulated donor heart could slow a second, unstimulated
  heart, and the observation that drugs which block or potentiate acetylcholine''s
  peripheral effects also alter transmission. On the other side, electrophysiologists
  such as John Eccles argued that transmission was electrical: the action current
  of the presynaptic nerve, they held, could spread directly across the junction,
  because the measured synaptic delay seemed too brief for a chemical cascade of release,
  diffusion, and binding. The dispute lasted decades and was not decided by a single
  experiment; it shifted when intracellular recording techniques allowed Eccles and
  colleagues to measure the electrical sign of synaptic events at the muscle endplate
  and compare it with the predictions of the chemical account, after which Eccles
  changed sides."


