  ---


  One of the classic disputes in twentieth-century neuroscience is the "soup versus
  sparks" controversy over synaptic transmission. On one side, physiologists and pharmacologists
  — most prominently Henry Dale and Otto Loewi — argued that signaling across the
  junction between a nerve and its target cell is chemical: arrival of the nerve impulse
  releases a substance, such as acetylcholine, that diffuses across the narrow gap
  and alters the target. Their evidence included Loewi''s frog-heart preparation,
  in which fluid collected from a stimulated donor heart slowed a second, unstimulated
  heart, and the tight parallel between the effects of acetylcholine and the effects
  of specific nerve stimulation, including their common susceptibility to blocking
  and potentiating drugs. On the other side, electrophysiologists such as John Eccles
  argued that transmission was electrical: they measured a synaptic delay so short
  that it seemed to rule out a chemical sequence of release, diffusion, and receptor
  binding, and they proposed that the action current spread directly from the presynaptic
  terminal to the postsynaptic cell. The controversy persisted for decades; it turned
  in the chemical direction only after intracellular microelectrode recording allowed
  the synaptic event to be characterized against the quantitative predictions of the
  chemical account, after which Eccles himself changed sides.


  I want to test a philosophical theory of explanation against this episode. The theory
  is the entities-and-activities account of mechanistic explanation associated with
  Peter Machamer, Lindley Darden, and Carl Craver. On this view, a phenomenon is explained
  by specifying the mechanism that produces it: the relevant entities (the parts),
  the activities (what those parts do), and the spatial, temporal, and causal organization
  that connects them, so that each stage of the mechanism gives rise to the next in
  a chain of productive continuity. Laws are not required, and explanations may be
  given as mechanism sketches that leave gaps and are later filled into fuller schemas.


  Analyze the soup-versus-sparks controversy through this lens, but do not force the
  fit. In particular:


  (a) Reconstruct, for each camp, the mechanism it defended — its entities, activities,
  organization, and the gaps in productive continuity it left open — and say to what
  extent the two sides disagreed about the mechanism itself, as opposed to disagreeing
  about which gaps in the productive continuity were acceptable while the empirical
  record was incomplete.


  (b) Identify what the entities-and-activities account explains well about the episode,
  and what it leaves out. Consider, for example, how rival mechanistic sketches competed,
  the role of new recording technology in changing what counted as a plausible sequence
  of activities, and the norms that governed when a gap could be left open and when
  it had to be filled.


  (c) Then run the lesson in the other direction. Does the episode show a mechanistic
  sketch doing genuine explanatory work before its productive continuity was filled
