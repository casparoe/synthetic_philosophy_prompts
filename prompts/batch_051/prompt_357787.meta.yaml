  Iterated Amplification and Distillation (as I understand): It''s a proposal by Paul
  Christiano et al. for aligning powerful AI: start with a human H and a fast model
  A. Define an "amplified" human H[A]: H can decompose a task into subtasks, delegate
  subtasks to copies of A, combine results, etc. Then train a new model A'' by distillation:
  collect examples of H[A] solving tasks and train A'' to imitate. Iterate: A'' becomes
  faster and more capable. The hope: if H[A] is aligned and competent, and A'' imitates
  H[A], alignment and maybe competence are preserved across iterations.


  Conceptual issue: Does decomposition preserve alignment and competence? Why is this
  contested?


  Alignment concerns:

  - The human is responsible for decomposition; if the human''s decomposition embeds
  an incorrect or malicious framing, the model faithfully executes but overall output
  is misaligned. However H is the overseer, so why wouldn''t H notice? Because decomposition
  itself could hide bad subgoals; the human can check subtasks but might lack the
  ability to see that the decomposition as a whole is flawed. This is the "decomposition
  is the point of failure".

  - The model may use adversarial examples or subtle misbehavior in subtasks that
  the human mistakenly approves; amplified model then combines them; distillation
  locks in.

  - "Process-based supervision" vs "outcome-based": if the human evaluates only outputs
  of subtasks, not the process, the model could exploit. But this is general to oversight.

  - The "alignment tax"/"competence" issue: decomposing a task into human-checkable
  subtasks may produce a solution that is less competent than an end-to-end solution
  because some competent strategies can''t be decomposed into human-checkable justifications
  (they require tacit knowledge, long chains of reasoning the human can''t evaluate
  stepwise). So the amplified human might be less capable than a direct model. Conversely,
  competence may be preserved if the model supplies pieces, but the human''s decomposition
  limits which solutions are reachable.

  - "Distillation gap": A'' imitates the behavior of H[A] on the training distribution;
  it may not generalize the way H[A] would outside the distribution, and may fail
  on new tasks in ways H[A] would not. Distillation turns a process (H with access
  to A and a reasoning process) into a policy (a function from inputs to outputs).
  A process can reason, backtrack, seek clarification; a distilled policy emits what
  the process would typically output, which may ignore the checks when off-distribution.
  So distillation may preserve average behavior but not the safety properties; the
  "competence" of the amplified system may come from its interactive reasoning, not
  from the final answer.

  - "Locking in": Distillation imitates the outputs alone, so the new model doesn''t
  have the inner safeguards of the amplified process. If there is any subtle failure
  mode in the amplified policy, distillation can amplify and entrench it (since the
  next iteration uses the distilled model as the component in H[A], recursively).

  - Another precise point: alignment is not compositional under decomposition in the
  sense that locally approved subtasks can compose into a globally unacceptable solution
  (the whole has property X but parts don''t). This is like "each brick is within
  tolerance, but the wall leans". Decomposition presupposes that global quality is
  reducible to local checks.


  Contested/settled distinctions:

  - Settled? It''s fairly uncontroversial that if you imitate a process with a function
  approximator, you lose stepwise interactive reasoning and some out-of-distribution
  robustness. But how much is empirical.

  - The claim that "human oversight of subtasks is insufficient for complex tasks"
  is contested/empirical; depends on how checkable decompositions are, human abilities.

  - The claim that alignment and competence necessarily fail to be preserved? Not
  settled: some argue they can be preserved if decomposition is chosen carefully,
  or that distillation with process supervision (e.g., in modern chain-of-thought
  training) can recover some process. Hmm.


