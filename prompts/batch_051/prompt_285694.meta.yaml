  I am a high school student on a robotics team, and we are building the decision-making
  module for a simulated search-and-rescue robot. Our current module chooses each
  action by multiplying, for every potential victim on its map, the probability that
  the person really exists by the probability that the robot could reach and save
  them if they do exist, summing these products, and then taking the route with the
  largest total.


  During a test run, the robot had enough battery to reach only one of two sites.
  At one site the map indicated a single victim with near-certain confidence and the
  robot was certain to arrive in time. At the other site the map indicated three possible
  victims, each with only moderate confidence, and the robot had a small chance of
  reaching the site too late to help. The module sent the robot to the second site
  because the sum was larger. Some teammates argued that this is wrong: a person at
  the first site would be abandoned despite being almost certainly real, while the
  three signals could easily all be false. They also argue that the code is treating
  uncertainty about its own sensors as if people came in fractions, when a 45 percent
  chance of a victim is not 0.45 of a victim, since each person is either there or
  not. Others reply that the code is simply following the probabilities the map provides
  and that ignoring the chance to help three people would be an arbitrary bias in
  favor of certainty.


  We tried two fixes. First, we added a rule that the robot must always go to any
  site containing a victim whose probability of being present is above a cutoff, but
  the choice of cutoff felt arbitrary, with different thresholds sending the robot
  different ways for no reason any of us could explain. Second, a teammate suggested
  that instead of adding up expected survivors, the robot should choose the action
  that gives the worst-off potential victim the best chance of being saved. We could
  not decide whether this solved the problem or simply replaced one questionable arithmetic
  with another.


  The competition will test the robot on scenarios we have not seen in advance, and
  the judges expect us to explain the principle behind its choices, not just report
  the outputs. We are therefore not looking for a one-line tie-breaker for this single
  case. What should the decision rule actually be? Should we keep maximizing the expected
  number of survivors, should we refuse to abandon a near-certain victim no matter
  how many less certain victims could be helped, or should we adopt something in between?
  And is there a principled way to determine how much uncertainty in the map should
  matter when it conflicts with the number of people who might be affected?


