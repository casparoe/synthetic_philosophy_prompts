  I keep going back and forth on something in the moral testimony debate, and I''d
  rather not be told which side wins. The view I''m drawn to is basically continuity
  with ordinary deference: everywhere else, if someone has thought about a question
  much longer and more carefully than I have, I shouldn''t trust my hasty reasoning
  over theirs, and my accepting their answer can be a way of knowing. I have a hard
  time seeing why moral questions should be the one subject where this never works.
  Morality is full of specialists too, or at least people who are dramatically better
  attuned to certain moral facts, and my own off-the-cuff moral reasoning is unreliable
  in exactly predictable ways (post-hoc rationalizing, status quo bias, etc.). So
  the tidy principle is: if the balance of epistemic considerations favors someone
  else''s moral judgment over mine, I should defer, exactly as I would in science
  or law.


  And yet. I recently reread Kant''s "What Is Enlightenment?" and hit this passage:


  "It is so easy not to be of age. If I have a book which understands for me, a pastor
  who has a conscience for me, a physician who decides my diet, and so forth, I need
  not trouble myself. I need not think, if I can only pay - others will easily undertake
  the irksome work for me."


  ... and it lands with me in a way I can''t fully integrate with the deference view.
  It isn''t that I think other people''s moral views are never informative: of course
  they are. It''s that there seems to be a difference between my conscience and my
  diet. If my physician decides my diet, I can check it against expert consensus,
  and if I''m rational I''ll follow it; but the position of "a pastor who has a conscience
  for me" feels like a mistake not just mistaken, a category error, a failure to do
  something that''s specifically mine to do. I can''t delegate the act of judging
  what to do without ceasing to take myself seriously as a moral agent.


  So which yields? What would it take for the anti-deference intuition to be the thing
  that goes (maybe: it''s just an autonomy-flavored self-image, and the real content
  is downstream procedural values)? And what would it take for the deference view
  to need amending (maybe: testimony can supply moral premises but not the concluding
  judgment, or can transfer knowledge but not warrant for action)? Or is there a reading
  where they''re compatible: I defer about the moral facts yet still cannot delegate
  my final "this is what I''ll do"? I want the costs of each move, not a verdict.


