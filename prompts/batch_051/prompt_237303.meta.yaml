  Last Saturday two friends of mine, Priya and Marcus, got into a long argument over
  our mutual friend Sam, who has a decision to make and can''t figure out what to
  do. Sam promised a friend he''d help them move this weekend, but meanwhile he got
  asked to spend that same day helping at a free clinic that is short-staffed and
  will probably turn people away if he doesn''t show. Sam genuinely can''t decide
  whether keeping a promise is one of those things you just aren''t allowed to break,
  or whether promises are just one factor among others and you should usually do whichever
  ends up helping more. He''s honest about it: he thinks there''s maybe a real chance
  promises are absolute, and maybe a real chance they''re not.


  Priya said Sam should keep the promise. Her reasoning: if promises are absolute
  and he breaks this one, he''s done something wrong in a way that can''t be made
  up for. If he keeps it and promises turn out to be just one factor, then the worst
  thing is he didn''t help as many people as he could have—bad, but not the same kind
  of bad as violating an absolute rule. So the downside of breaking is way worse than
  the downside of keeping, and the safe move under uncertainty is to keep the promise.


  Marcus said that''s exactly backwards. He said Priya is assuming the "absolute"
  view''s own scale to weigh the downsides. If promises are just one factor, then
  there''s no special category of "wrong in a way that can''t be made up for"—the
  only thing that matters is that more people get helped. On that view, skipping the
  clinic to go move boxes is the bigger moral failure, because it means real people
  get turned away. So the supposed asymmetry is just one side''s view wearing a neutral
  costume.


  Priya shot back that Marcus was flattening things on purpose. She said that if the
  "just one factor" view is true, you can still say that choosing to help fewer people
  is a less serious thing than knowingly doing something that, on another live view,
  is forbidden. There''s a difference between picking an option that ends up being
  suboptimal and picking an option that might be prohibited. Even if you haven''t
  settled which theory is true, you can care about which mistakes are irreversible
  in a moral sense.


  Marcus said that''s circular. "Forbidden," "prohibited," "wrong in a special way"—those
  are exactly the words the absolute view supplies. If you don''t assume that view,
  a mistaken act is just an act that led to less good. There is no neutral unit of
  "moral badness" that both sides can read off the same ruler, so any attempt to say
  one risk is worse than the other quietly takes a side. Under genuine uncertainty,
  he said, you should go with expected value across badness? No—he said you should
  just decide which view is more likely and act on it, because any "safe" rule is
  itself a moral bet.


  Priya said that still leaves Sam with a fifty-fifty-ish mix and no honest way to
  rank the two kinds of wrong, so "go with the more likely view" doesn''t tell him
  anything unless he''s already resolved the weighting problem. And if the two kinds
  of wrong can''t be compared, the only sane rule is caution about the irreversible-looking
