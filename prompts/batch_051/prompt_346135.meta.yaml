  "I have been thinking about the instrumentalist position in the philosophy of economics
  and modelling, often associated with Milton Friedman''s essay on positive economics.
  The position, as I understand it, is not merely that all models simplify — that
  part I accept — but that the realism of a model''s assumptions is irrelevant to
  its scientific value. What matters is whether the model yields sufficiently accurate
  predictions about the phenomena it is aimed at. On this view, asking whether firms
  ''really'' maximise profit or whether people ''really'' have rational expectations
  is to misunderstand what models are for; they are instruments of prediction, not
  descriptions of the world. The view has real virtues: it gives a single, non-arbitrary
  criterion for model choice, it explains why wildly different models of the same
  system can both be useful, and it stops science from descending into disputes about
  unobservable plausibility."


