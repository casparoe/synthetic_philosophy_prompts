  for immortality, which shows Epicurus is mainly offering a therapeutic cure for
  anxiety, not a metaphysical proof. One subtle point is that Epicurus does not need
  to be a hedonist: even a pluralist about value could agree that nonexistence cannot
  be bad because a subject is absent. However, the argument fails because it only
  addresses death''s being bad after it occurs; it ignores the badness of death as
  deprivation. A person who dies at 30 is deprived of the goods she would have had,
  so death can be bad for her even though she never experiences the deprivation. Another
  problem is that Epicurus assumes all badness must be experienced, but we can be
  harmed by events we don''t know about, such as betrayal behind our backs. Therefore
  the argument is too quick."


