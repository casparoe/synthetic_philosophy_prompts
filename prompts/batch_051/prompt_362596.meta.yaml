  Let me draft:


  "William Morris is a natural figure to consult on the question of what a future
  would be like that is actually good to live in, because he gave one of the most
  detailed nineteenth-century answers. In his essays on labor and in the utopia News
  from Nowhere, he argued that the central defect of industrial capitalism was not
  that workers were paid too little but that their work had become a degrading toil,
  cut off from the pleasure of making, and that a genuinely good society would restore
  the union of art and labor. He also believed that machinery, far from being an unambiguous
  good, tended to produce both shoddy goods and shoddy lives when employed for profit,
  though he allowed that it might be used to eliminate genuinely irksome drudgery
  under different social arrangements.


  Now suppose Morris could be shown a credible projection of the late twenty-first
  century in which highly capable machine intelligence can perform nearly all productive
  labor—agriculture, manufacturing, transport, design, even much of care work and
  creative production—and in which the standard political question is therefore how
  to distribute the resulting abundance so that no one need work for a living. What
  would Morris make of this? Give a reasoned account of which features of this future
  he would welcome as the fulfillment of his hopes and which he would diagnose as
  the same disease in a new form. In particular, distinguish between automation that
  removes worthless toil and automation that removes the very activity through which,
  on his view, human beings come to find life worth living. Would he regard a post-work
  future of abundant leisure and machine-made goods as a good one, or as a future
  in which the central problem—the degradation of daily life—had simply been solved
  away rather than solved? What would he say about the popular proposal that people
  might still make things as a hobby while machines do the serious work, and how does
  that bear on whether his utopia can absorb a high degree of automation? Ground your
  answer in the commitments Morris actually exhibits rather than treating him as a
  generic early socialist or a generic technophobe."


