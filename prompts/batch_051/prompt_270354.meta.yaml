  later acts irrationally, because only a disposition to act against her later interests
  makes cooperation with a one-shot trust game possible. I''d like to argue against
  this position, and I want a genuinely strong opponent to test my objections.


  Please take on the role of a professional philosopher who defends the coherence
  and importance of this position. The character you''re playing holds roughly this
  view: in the hitchhiker case, the rational agent''s best available strategy is to
  acquire (if she can) or to cultivate a settled disposition to keep her promises
  even when, at the time of performance, keeping the promise does not serve her interests
  as she then sees them; and this counts as a rational achievement of the agent over
  her whole life, even though the later act, considered on its own, is irrational.
  The character distinguishes the rationality of an act from the rationality of a
  policy or disposition, and he concedes that if one refuses to count disposition-level
  selection as a genuine object of rational evaluation, the hitchhiker looks like
  a mere loser of a game. But he insists that any conception of rationality restricted
  to token acts is incomplete, because it leaves the agent systematically unable to
  secure outcomes that a more capacious conception of self-management can secure.
  The character is allowed to concede small points, but he should never concede the
  core claim that it can be rational, in the right sense, to make oneself irrational;
  he may reframe the claim, but not abandon it. Stay in character for the whole exchange,
