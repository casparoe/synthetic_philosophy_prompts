  Gödelian anti-mechanist argument (Lucas, Penrose) roughly:

  - Gödel''s first incompleteness theorem: for any consistent, sufficiently strong
  formal system F, there is a sentence G_F in the language of F such that F neither
  proves G_F nor its negation; moreover, if F is sound (or ω-consistent), G_F is true
  (in the standard model), and we can see it is true.

  - Lucas (1961) argued: For any machine M, there is a formal system F_M representing
  M''s output. By Gödel, there is a sentence G that F_M cannot prove but which (since
  the system is consistent/we accept it) we can see is true. Therefore the machine
  cannot produce that truth, but I can; so mind is not a machine.

  - Objection (Putnam, Benacerraf, others): this only works if we can know/assume
  that F_M is consistent; for a given machine, we might not be able to establish its
  consistency. Also "we" as a whole may not be consistent. Also the machine might
  be able to prove G by using a different formal system; Lucas''s argument relies
  on the machine being a specific consistent formal system that can''t step outside
  itself, but a human could also be a machine whose formal system is not the one we
  know. Also Gödel''s theorem gives for each consistent system a sentence that system
  can''t prove; but that doesn''t imply there is a single sentence that no possible
  machine can prove and humans can. The machine could also be programmed with the
  ability to recognise the Gödel sentence of any system it is given.

  - Penrose''s version (Shadows of the Mind) adds: the human ability to grasp the
  consistency/soundness of the system goes beyond any algorithm; he uses a formalized
  version to argue that the human mathematician can see soundness, but algorithm cannot.
  Feferman and others criticize.

  - Important mistake: asserting that Gödel''s theorem says no formal system can prove
  its own consistency (second incompleteness), and from that alone concluding humans
  can''t be machines. Actually a machine could prove its own consistency if inconsistent;
  or a machine could derive the Gödel sentence in a different system.


