  floats free of any particular wording, even though the only evidence the interpreters
  have is the wording in the several languages. Elsewhere, though, the same legal
  systems are very suspicious of paraphrase: two formulations in the same language
  are routinely argued to have different legal effects, and altering a single phrase
  in a statute is treated as important. What view of meaning—and in particular of
  synonymy across languages—does the practice of equally authentic treaty versions
  presuppose? Be precise about how much it strictly presupposes and how much it merely
  fits with. Does it, for example, commit the law to the claim that there is always
  a determinate fact of the matter about which of several incompatible renderings
  is correct? And how much pressure does Quine''s thesis about the indeterminacy of
  translation put on that commitment? I am less interested in a survey of doctrine
  than in having the implicit semantics reconstructed and tested for coherence."


