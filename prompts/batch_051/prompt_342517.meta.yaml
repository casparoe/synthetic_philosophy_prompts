  Adequacy of a theory of valid consent: the question is what transforms a person''s
  "yes" into morally/legally transformative permission. Desiderata might include:


  1. It should explain the difference between valid and invalid consent across the
  canonical defeaters: deception, coercion, and incompetence — but not merely by stipulation;
  it should unify them or explain why disunified.


  2. It must handle the asymmetry between deception and non-disclosure: if I lie to
  get a yes, why does that void it, while not volunteering unflattering facts often
  doesn''t? Where''s the line, and does it depend on the relationship or stakes?


  3. It must accommodate the fact that consent can be valid while the act is harmful
  or unwise: consent is not the same as good judgment — but it must also explain when
  disastrous choices remain competent (or when paternalism intrudes).


  4. It should distinguish coercion from hard choices and from seduction/persuasion:
  an offer is not a threat, but "your money or your life" is; what about offers one
  cannot reasonably refuse? Institutional power asymmetries?


  5. It must say whether consent is a mental state (an inner act of will) or a communicative
  act (what one manifests publicly), because the two can diverge: secret reservations,
  feigned consent, misunderstanding, later regret. A theory must handle cases where
  the person consents mentally but not behaviorally or vice versa, and decide which
  one (or both) does normative work.


  6. It should treat consent as revocable and explain the temporal shape: prospective
  consent, contemporaneous consent, retroactive ratification; can consent be given
  for future acts under uncertainty (e.g., medical procedures, sexual encounters where
  unplanned acts happen), and what determines whether they fall within the scope of
  the original consent?


  7. It must explain whether consent is topic-specific (consent to A not B, the "scope"
  problem) and what fixes the boundaries: e.g., consent to surgery includes what incidental
  touches? consent to a sexual act doesn''t include another act not requested.


