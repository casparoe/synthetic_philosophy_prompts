  ---


  I teach an upper-level undergraduate seminar in formal epistemology with fourteen
  students, mostly philosophy majors. We have just spent two sessions on conditionalization,
  and I want the next hundred-minute session to be the students'' introduction to
  van Fraassen''s Reflection principle — run as a game they play before the principle
  is named or explained, with the debrief doing the naming.


  Design that activity. It should be a two-stage game in which participants write
  down numerical credences for a set of propositions, together with the odds they
  would accept now on claims about what their own credences — or a partner''s credences
  — will be after a piece of information is revealed. The rules must be arranged so
  that at least one genuine violation of Reflection shows up in the students'' own
  recorded numbers before the debrief, and so that at least one other condition produces
  a violation the group can rationally defend. Between those two cases, the class
  should be able to locate which premise of the principle does the work: the assumption
  that one''s future self is at least as well informed and shares one''s epistemic
  standards.


  Please provide the complete runnable design: setup, materials, roles, exact scoring
  rules (no real money; points toward a low-stakes course trophy or standing are fine),
  a minute-by-minute timeline, and a debrief script. The debrief should map specific
  moments in the game onto: (i) conditionalization versus Reflection, (ii) the premise
  that the future self is at least as informed and shares one''s standards, (iii)
  the diachronic-Dutch-book intuition behind the charge of incoherence, and (iv) standard
  ways the principle can rationally fail — forgetting, loss of information, a foreseeable
  change in standards. Also tell me the failure modes to expect the first time I run
