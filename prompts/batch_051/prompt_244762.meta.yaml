  - What realism predicts vs instrumentalism: robustness and systematicity — real
  representations should be reusable across tasks, should be needed for the network''s
  competence (not epiphenomenal), should support generalization in a content-respecting
  way (e.g., a "dog" representation should transfer to dog-related tasks but not to
  arbitrary ones), and should allow misrepresentation (the system can be wrong).

  - Could be insulated via degrees: "representation comes in degrees" is a common
