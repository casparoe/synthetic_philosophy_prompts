  Mental imagery debate (Kosslyn vs. Pylyshyn): The debate about whether mental images
  are depictive (analog, quasi-pictorial) or descriptive (propositional, language-like).
  Kosslyn: imagery is depictive, functional pictures. Pylyshyn: imagery is epiphenomenal,
  representations are propositional, and the "picture" is an effect of tacit knowledge
  and demand characteristics. The key experiments: mental scanning (longer time for
  greater distance), mental rotation (time linear with angle), image size. Pylyshyn''s
  critique: subjects'' performance reflects tacit knowledge and experimenter expectancies,
  not the format of representation. Kosslyn''s rebuttals: neuroimaging shows topographic
  activation in early visual cortex.


  Commitments someone might hold:

  1. I think mental images are depictive/analog, not discursive/propositional.

  2. I think the empirical evidence from scanning and rotation experiments is robust
  and supports (1).

  3. But I also think Pylyshyn''s tacit-knowledge objection is basically right: subjects
  in these tasks are trying to comply with what they think the experiment expects,
  so reaction-time data are contaminated.

  4. Conversely, I think the neuroimaging evidence (topographic early visual cortex
  activation) rescues the depictive view without relying on introspective or reaction-time
  data.

  5. I think the format of representation is an empirical question, not a conceptual
  one.

  6. I also think functionalism: if two systems have the same functional profile,
  there''s no further fact about what their representations "really look like."

  7. I am attracted to the view that mental images never enter into explanation, only
  into our phenomenology.


