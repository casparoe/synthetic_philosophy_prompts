  - The informational/scaling objection: the theorem is compatible with arbitrary
  positive affine rescaling of each person''s utility, so the weights have no ethically
  meaningful interpretation until interpersonal comparisons are supplied; vNM utility
  plus Pareto indifference does not by itself determine a unique weighting.

  - The arbitrary-weights objection: even taking the theorem at face value, it yields
  a weighted sum, not an equally weighted sum. Equal weights require a further anonymity
  or impartiality premise, and the proof of utilitarianism is being hidden in that
  extra premise rather than derived.

  - The Diamond-style fairness objection: the social evaluator need not satisfy the
  vNM axioms at all, because a social evaluator may care about the fairness of lotteries
