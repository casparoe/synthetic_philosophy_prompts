  must be a relation R'' relating R to a and b, and so on infinitely. If instead R
  is just "stuck" to a and b without a further relation, then how is the unity achieved?
  This is often applied to the unity of the proposition: how do the constituents of
  a proposition (e.g., a universal/relation and objects) combine into a unified proposition/state
  of affairs rather than a mere list? Russell, Frege, and others grapple with this.
  Frege''s solution: functions/unsaturated concepts — the concept is "unsaturated"
  (ungesättigt), it inherently needs to be completed by an object; application/saturation
  is built into the nature of the function, so no further relation is needed. Russell''s
  early view: relations themselves relate; he posited that the relation is a "relating
  relation" that actually does the relating. Bradley''s regress presses: is the relating
  itself another relation? The standard modern treatments: instantiation as a non-relational
  tie; or the constituents are incomplete and complete each other (Frege); or facts/propositions
  are primitive unities, not built from independently existing constituents.


