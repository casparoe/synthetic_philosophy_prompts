  "I recently sat in on an argument between two friends, one an economist and one
  a philosopher, about Daniel Bernoulli''s solution to the St. Petersburg paradox.
  They both agreed on the details of the famous game — a coin is tossed until it comes
  up heads; if heads first occurs on the nth toss, the payoff is 2^n ducats — and
  they both agreed that the expected monetary value is infinite. The economist insisted
  that Bernoulli''s paper of 1738, Specimen Theoriae Novae de Mensura Sortis, translated
  as Exposition of a New Theory on the Measurement of Risk, put the matter to rest
  with a single move. He paraphrased the relevant passage as follows: the value of
  an item is to be assessed not from its price but from the utility it yields, and
  the utility of a gain is measured by the change it produces in one''s fortune, not
  by the absolute sum; Bernoulli then proposes that the utility of a small increase
  in wealth is inversely proportional to the wealth one already possesses. The economist
  said this yields a logarithmic utility function, under which the expected utility
  of the St. Petersburg game is a small finite number, and so the paradox dissolves.
  The philosopher pushed back: Bernoulli''s move, he said, does not answer the question
  of what a fair price is; it answers a different question about the psychology of
  a particular risk-averse person. He admitted that concave utility makes the sum
  converge, but he argued that if the payoffs were themselves specified in utils rather
  than ducats, or if one allowed an unbounded utility function, the same expectation
  blows up again. Bernoulli has not shown that rationality requires bounded or logarithmic
  utility; he has merely shown that one special utility function makes the math tractable.
  The economist replied that this is a standard and rather shallow objection: Bernoulli''s
  point is not primarily about the functional form but about the principle that the
  value of a risky prospect is the expectation of its utility, not the expectation
  of its money, and that this principle is independently motivated by the observation
  that an extra ducat means less to a rich man than to a poor one. The philosopher
  came back: independent motivations are not enough; the original puzzle was that
  a person who rejects paying a million ducats for the game seems prudent even though
  expected monetary value is infinite. Concave utility explains why they reject it,
  but it does not vindicate the rejection as rational unless one already accepts that
  expected utility with that function is the correct normative criterion — and that
