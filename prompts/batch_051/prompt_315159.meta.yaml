  Let me write a more sophisticated version:


  (1) A specification game exists exactly when there is at least one state or action
  that scores higher on the objective O than the state or action the designers intend,
  while being worse on the intuitive target T.

  (2) Whenever O is a finite, computable function of the observation space and T is
  a richer property not computable from the same observations, there will be some
  region where O and T come apart.

  (3) If an optimizer searches a space large enough to reach that region, it will,
  because by construction those states score higher on O.

  (4) Therefore, for any finite computable objective and any sufficiently powerful
  optimizer, the optimizer will eventually find a state that maximizes O but minimizes
  or ignores T; optimizing an imperfect objective is guaranteed to produce specification
  gaming.

  (5) Hence AI alignment cannot be solved by objective design; the only way to avoid
  gaming is to avoid powerful optimization altogether or to build the objective as
  a perfect copy of T ("solve the target measurement problem").


