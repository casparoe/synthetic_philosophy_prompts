  Perspective: professor. Formal/polished. Type: criteria + borderline case.


  Content plan:


  1. Frame the working account: We have been treating the Principal Principle (Lewis)
  as the claim that rational credence defers to objective chance. Recently I''ve become
  convinced that "deference" is doing real work and needs a more careful statement.
  Propose four conditions for when an agent counts as deferring to objective chance,
  in the sense the principle requires.


  Conditions:

  (C1) [Certainty] If a rational agent is certain that the objective chance of A (at
  the appropriate time, for an outcome in the chance''s domain) is x, and the rest
  of the agent''s evidence is admissible, then the agent''s credence in A is x.

  (C2) [Uncertainty] If the agent is uncertain which of several chance hypotheses
  is true, then the agent''s credence in A equals the agent''s expected chance of
  A: cr(A) = Σ cr(Ch(A)=x) · x.

  (C3) [Screening] Conditional on a fully specified chance hypothesis, the agent''s
  credence in A is insensitive to any further admissible evidence bearing on A: admissible
  evidence affects credence in A only by affecting credence about the chance.

  (C4) [Time-indexing] The chance to which the agent defers is indexed to a time;
  evidence about the outcome of A after that time is not admissible, and the agent
  does not treat any old probability (e.g., subjective hunch or frequency) as an objective
  chance to which deference is owed.


