  The Principal Principle (Lewis 1980): Let C be rational credence function, X a proposition,
  E admissible evidence, and "Ch(X)=x" the proposition that the objective chance of
  X at time t is x. Then C(X | E & Ch(X)=x) = x, provided E is admissible (doesn''t
  contain information about the future or inadmissible crystal balls).


  Criteria for deference to objective chance might be:

  1. If a rational agent learns that the objective chance of X is x, and nothing inadmissible,
  they set their credence in X to x.

  2. Deference screens off: conditional on chance being x, the agent''s credence in
  X is independent of other admissible evidence (the chance is a sufficient statistic
  / credence is a deterministic function of chance).

  3. The agent''s credence in X should track expected chance: C(X) = sum_x C(Ch(X)=x)*x.

  4. Deference applies to propositions in the domain of chance (outcomes of chancy
  setups) and not to chance itself or to output of chance processes outside the domain.


