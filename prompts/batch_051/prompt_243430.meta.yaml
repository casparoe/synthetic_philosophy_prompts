  accounts) treats them as the same problem, and others distinguish knowledge from
  rational/justified belief. A good answer would correct: the preface is usually described
  as rational but not knowledge, while the lottery is usually taken to show you don''t
  know your ticket will lose, despite high probability; so they''re two halves of
  one puzzle about probabilistic evidence and closure, not a contradiction. That''s
  a nice subtle confusion.


