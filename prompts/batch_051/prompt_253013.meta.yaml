  This summary has subtle misrepresentations:

  - "no human supervision beyond the raw text itself" — the text itself is human-produced
  and meaningful; also training choices/tokenization/window/parameters are human decisions.
  But mostly okay as simplification.

  - "everything it knows about which words are alike comes from patterns of co-occurrence"
  — accurate for static embeddings.

  - "vector arithmetic seems to capture relations between meanings... king - man +
  woman ≈ queen" — accurate as demonstration, but "woman" analogies are methodologically
  contested (the original Mikolov paper''s king-queen example; evaluation shows variance).
  But in a popular summary, fine.

  - "the word''s entire semantic contribution is its location in the space" — an overstatement:
  embeddings are one model of distributional similarity; they fail at polysemy, composition,
  logical relations; similarity isn''t equal to meaning.

  - "empirical confirmation of the idea that the meaning of a word is its use" — this
  is a subtle equivocation: "use" in distributional semantics = statistical contexts;
  "use" in Wittgenstein = role in social practices/language-games. Also the distributional
  hypothesis (Firth) predates and doesn''t imply Wittgenstein''s whole doctrine. The
  success confirms a specific distributional hypothesis, not the full slogan.

  - "old idea that meanings are definitions in the head is dead" — overstatement;
  embeddings don''t refute mentalist/definitional theories; dictionary definitions
  could be one source of supervision; word sense representations may correspond to
