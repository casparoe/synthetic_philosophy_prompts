  Subtle misrepresentations to audit:

  1. Conflating works: "words with similar meanings have similar vectors" vs. "the
  vector is the meaning." The fact that distribution predicts similarity doesn''t
  establish that the vector is the meaning. Even Firth''s distributional hypothesis
  is about contexts/meanings, but "meaning is use" can mean something stronger or
  weaker. The embedding is a proxy/model, not meaning itself.

  2. Overstatement: "this completely vindicates Wittgenstein / refutes mentalist theories."
  The distributional hypothesis is older than Wittgenstein? Firth 1957. But more importantly,
  distributional semantics is compatible with some mental representations; the embedding
  provides evidence for a certain coarse-grained structural relations but doesn''t
  settle philosophical questions about grounding (symbol grounding problem, Chinese
  Room).

  3. Conflating "similar distribution = similar meaning" with "meaning is exhausted
  by distribution." The success of embeddings shows distributional information is
  sufficient for many tasks, not that it is all meaning is.

  4. The analogy king - man + woman ≈ queen: often described as "meaning is encoded
  as directions." This is real but not full semantic composition; vector arithmetic
  fails on many cases and doesn''t capture logical structure (e.g., intensionality,
  negation, quantification).

