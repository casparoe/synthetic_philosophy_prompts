  sentences like "Sherlock Holmes is a fictional character" or "Sherlock Holmes never
  existed," it either drops them as nonsense or stores them as ordinary properties
  of a person. I have no training in philosophy, and I do not need a survey of authors
  or positions. But I am told that philosophy has worked for a long time on exactly
  this: names without referents, negative statements about what does not exist, and
  the difference between being true and being true in a story. I need that thinking
  converted into code-adjacent, repeatable procedure.


  Write a decision procedure my team can run on a single extracted sentence to decide
  how it should be stored in our knowledge base. Assume the knowledge base has three
  layers: the real world; the internal world of a specified fiction (the declared
