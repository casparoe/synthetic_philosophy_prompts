  is a possible intervention on X that changes Y. Interventions defined via: (I) I
  is an intervention variable on X wrt Y iff (i) I causes X; (ii) I acts as a switch
  such that when I is present, X ceases to depend on its other causes; (iii) any causal
  route from I to Y goes through X; (iv) I is statistically independent of any variable
  Z that causes Y and is not on the I→X→Y route. The circularity: defining ''intervention''
  uses ''causes''. Woodward acknowledges this is not a reductive definition but a
  non-reductive one; he says manipulation is a different kind of information, not
  a reduction to non-causal notions. The circularity worry is a major theme.


