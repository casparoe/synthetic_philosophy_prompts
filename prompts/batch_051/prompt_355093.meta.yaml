  Goal: an argument that seems to show prioritarianism cannot avoid the leveling-down
  objection. Steps:

  1. Prioritarianism: the moral value of a fixed size benefit is greater the worse
  off the recipient is, for welfarist reasons having nothing to do with comparisons.

  2. Suppose prioritarianism is true. Then consider two people, A at 100 and B at
  50. A benefit of +10 to B adds more value than +10 to A.

  3. This means the value of the outcome depends on how well-being is distributed
  between A and B, not just on the sum total.

  4. If the value of an outcome depends on the distribution, then the distribution
  itself is something the theory treats as good or bad.

  5. If the theory treats distribution as good or bad, then a move from <100,50> to
  <50,50> — reducing inequality by making A worse off and no one better off — must
  be better in at least one respect.

  6. But that is exactly the leveling-down conclusion prioritarianism was designed
  to avoid.

  7. So prioritarianism either is egalitarianism in disguise (if it accepts the leveling-down
  result) or must abandon the idea that value depends on the distribution, which contradicts
  (3) and so abandons the priority claim.

