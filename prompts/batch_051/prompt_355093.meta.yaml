  Desiderata list for climate model ensembles:

  - distinguish "model agreement" from "support by evidence," because models are not
  independent (shared components, shared training/calibration data, shared code);
  double counting. A theory must not treat correlated models as independent draws.

  - respect that ensemble spread is not a probability forecast of real-world climate;
  spread depends on which models are included and can be systematically biased. So
  must explain what, if any, decision-relevant content ensemble distribution has.

  - handle the "confirmation by robustness" problem: agreement among diverse but jointly
  flawed models may not increase confidence if errors are common cause.

  - account for structural uncertainty (unknown unknowns / missing processes) vs parametric
  uncertainty (within-model parameter values).

  - account for the historical track record (hindcasting) but not overfit to it; past
  performance is not guarantee under novel forcing.

  - connect to decisions: decision-relevance requirements like the info needed by
  a planner choosing between mitigation/adaptation pathways; distinguish "deep" vs
  "shallow" uncertainty; maybe "robust decision-making" criteria.

  - not contradict basic stats: dependence, common causes, model skill scores, calibration.

  - possible joint unsatisfiability: maybe "empirical adequacy" and "full PDF of climate
  sensitivity"? Or "treat models as independent" and "ensemble spread as uncertainty"
  might conflict. The asker asks mark non-negotiable vs camp preferences (e.g., "no
  model weighting" vs "Bayesian weighting" camps).


