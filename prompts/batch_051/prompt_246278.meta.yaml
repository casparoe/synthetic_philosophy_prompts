  Let me write:


  I have been working through Aristotle''s account of money in Nicomachean Ethics
  V.5 (the passage around 1133a–b where he discusses exchange, need, and the role
  of currency), and I keep seeing a structural parallel that I want checked for depth
  rather than just pattern-matching. As I understand the passage: Aristotle says exchange
  requires commensurability between unlike goods, that need (chreia) is what makes
  them commensurable, and that money was introduced as a representative of need so
  that exchange can occur even when the parties do not need each other''s goods at
  the same time. Money, on his account, acts as a kind of pledge or guarantee that
  a person who has it can obtain what is needed later; its value rests on convention
  rather than on the nature of the thing itself. The temporal part seems essential
  to him: money bridges a mismatch between the times at which needs arise.


  Now the parallel. In asynchronous programming, a Future or Promise is an object
  that stands in for a value that has not yet been computed; it lets a program continue
  executing now by treating the future value as if it were already available, binding
  it only when it actually resolves. The Future is a placeholder defined by a protocol,
  not by the final value; it can fail to resolve, can be composed with other Futures,
  and can be awaited. What I noticed is that Aristotle''s money seems to be doing
  exactly this within a network of exchangers: it is a placeholder for an unspecified
  future good, accepted by convention, that lets exchange proceed now despite non-coincident
  needs, and whose value can fail if convention breaks down.


  Is this a genuine identity of structure, a loose analogy, or a confusion? To make
  that question precise: does a monetary economy stand to barter as asynchronous composition
  stands to synchronous call-return? What would have to be true of both sides for
  results to transfer? And is there a plausible consequence of the analogy that turns
  out false — for example, money has no defined resolution event the way a Future
