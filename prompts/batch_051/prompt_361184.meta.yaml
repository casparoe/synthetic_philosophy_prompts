  The setting: an agent is deliberating between A and B. Can she have a subjective
  probability for "I will do A" during deliberation? The crowding-out thesis says
  no — either such probabilities are impossible, rationally forbidden, irrelevant/inadmissible
  to the decision, or they undermine deliberation.


  Standard arguments/considerations:


  1. Deliberation requires treating the options as open (the openness/incompatibility
  argument). To deliberate whether to A, you must regard both A and not-A as up to
  you. Assigning a probability to A, even a middling one, means adopting a settled
  view about how likely you are to A, and that treats your choice as an object of
  prediction rather than as something to be made. So the predictive stance crowds
  out the deliberative stance; you can''t occupy both at once.


