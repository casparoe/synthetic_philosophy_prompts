  2. The instability/self-reference argument. Your probability for doing A would enter
  into the expected utilities of A and B. For example, if you think you are likely
  to A, that may reveal something about your dispositions or state, which alters the
  evaluation of A and B, which alters the probability — the prediction has no fixed
  point. Any probability you assign is either the output of deliberation (so no independent
  basis before it ends) or a perturbing input. Therefore you can''t have a stable,
  well-grounded self-probability while deliberating.


  3. The evidential-bootstrapping / Newcomb argument. If you allow probabilities over
  your own choices, then an "evidential" decision rule lets a prediction of A raise
  the expected value of A when A is merely correlated with good news even if it causes
  nothing, and you can manufacture good news by drifting toward predicting whatever
  is correlated with reward. To avoid this pathology, your own choices must be treated
  as probabilistically independent from the states with which they are correlated
  — but that independence condition is essentially the requirement not to form self-probabilities
  in the first place.


