  you adjust a small set of its parameters a few clicks at a time: transpose the melody,
  alter the metre, swap a premise, vary the material. You keep the settings that ''work''
  and discard the rest. Over enough small adjustments, the claim goes, you reach things
  that look radically new, so there is no difference in kind between the competent
  variation of a received pattern and genuine innovation. The people advancing this
  picture use it to license a specific conclusion: that creativity is continuous and
  local, that talk of leaps, incommensurable breaks, and irreducible genius is mystification,
  and therefore that procedural variation-and-selection is all the ''spark'' amounts
  to. Audit the analogy in this picture. Identify what is doing the work of the knobs,
  the parameter space, the evaluation of a setting, and the increment of a click.
  Then press on the mapping: where does the knob-twiddling picture smuggle in features
  of physical dials (fixed dimensions, known ranges, reversible adjustments, independent
  axes, a stable device) that conceptual spaces may lack, and which of these disanalogies
  actually threaten the intended conclusion? Say whether that conclusion survives
  the audit, and propose a better analogy if one is available."


