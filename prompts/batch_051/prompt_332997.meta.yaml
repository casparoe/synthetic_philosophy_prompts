  contradiction. The teaching order: (1) distinguish numerical identity from qualitative
  similarity; (2) distinguish persistence questions from "what makes someone the same
  person" vs "how we know"; (3) introduce Locke''s criterion as a criterion of constitution
  not epistemology; (4) run the brave officer; (5) distinguish two ways out: giving
  up transitivity vs making memory indirect/overlapping chains (memory connectedness
  vs continuity). Misconceptions: students think Locke means memory as evidence; students
  think Reid''s example shows memory is fallible rather than showing a structural
  problem; students conflate "same person" legal/moral notion with metaphysical identity;
  students think the objection is just that old people forget.


