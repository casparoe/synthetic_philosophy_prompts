  Prompt:


  "In my AP Psychology class, my teacher uses one image to settle nearly every debate
  about why people think, feel, and behave the way they do. She says the human mind
  is a Swiss Army knife. Evolution, in her telling, assembled it by adding one specialized
  implement at a time, each one shaped for a specific problem in our ancestors'' environment:
  a language implement, a face-recognition implement, a mate-preference implement,
  a cheater-detection implement. Crucially, she insists there is no general-purpose
  blade in the handle, and that this is why the mind should not be compared to a desktop
  computer running one flexible program. On the strength of this picture, she concludes
  that when a behavior or pattern of thinking appears in essentially every human culture,
  we should posit a dedicated, built-in mechanism behind it and then ask what ancestral
  problem that mechanism evolved to solve. She used jealousy this way: as a cross-cultural,
  apparently automatic response, so, she argued, it must be a dedicated evolved module
  rather than a social construction or a byproduct of something else.


  I can tell this analogy is carrying a real argument, and I want to know how much
  weight it can bear. Please audit it. Give the correspondences first: what maps to
  the knife itself, the individual implements, the manufacturer, the process of adding
  a new implements, and the missing general-purpose blade. Then show where the mapping
  breaks or quietly imports features of a physical tool collection that a mind may
  not share — for instance, the implements in a knife are physically separate, deliberately
  designed in advance for one foreseen job, and fixed when the knife leaves the factory,
  while evolved systems can be repurposed, can serve several functions at once, and
  develop through interaction with an environment. For each disanalogy, tell me whether
  it actually matters for her conclusion or is just a harmless difference. Finally,
  say whether her conclusion survives the audit or whether the Swiss Army knife image
  was doing the argumentative work, and if it fails in an important way, describe
  a better image or a cleaner set of distinctions that would replace it."


