  An adequate theory of informal social sanction (cancellation, deplatforming, public
  shaming) should:


  - Explain what makes a sanction a sanction, as opposed to ordinary criticism, free
  speech, or simply choosing not to associate. Distinction: expressing disagreement
  vs imposing costs.

  - Handle the continuum from a single retail worker whose old tweet resurfaces to
  a celebrity with a platform; the scale asymmetry problem: the same act can be negligible
  from one person and devastating from another — need theory not just about act but
  about the power gradient and audience size.

  - Distinguish among sanctions: criticism, mockery, boycott, deplatforming (removal
  of access to a platform), employment termination, doxxing/harassment. Some are plausibly
  legitimate expressions of speech; others are coercion.

  - Handle coordination: a million uncoordinated individual decisions to unfollow
  vs an organized campaign. Individual actions that are innocent in isolation may
  aggregate into a punishment not intended by any individual — moral responsibility
  for aggregate outcome.

  - Distinguish punishment/punitive function from accountability: corrective vs expressive
  vs deterrence vs incapacitation. Must say whether the theory aims at desert, deterrence,
  or norm enforcement.

  - Handle reputational information: publicizing a true, documented wrong vs false/misleading
  accusation; due process absent; permanent searchable records; context collapse (different
  audiences see different norms).

  - Consistency with facts about online environments: asymmetric virality, decontextualization,
  permanence/inability to live down, audience capture, algorithmic amplification of
  outrage, demographic differentials in who gets deplatformed (actually contested—don''t
  need empirical claims that models can''t verify; give structural facts like amplification
  and permanence).

  - Handle deplatforming as distinct: deplatforming is removal of someone''s ability
  to reach an audience via a platform. Is it a sanction, or just a private refusal
  to host? Need to say why the distinction matters: platforms are not the state, but
  they are not purely private either when they control public fora? This is where
  First Amendment-style concerns vs private action.

  - State/nonstate distinction: liberal theories of punishment assume a state with
  legitimacy, due process, proportionality; informal sanctions bypass these. A requirement:
  explain why or whether informal sanctions need analogues of proportionality, fair
  hearing, presumption of innocence.

  - Distinguish justice of the underlying offense from justice of the sanction: someone
  can deserve criticism but not the specific sanction they receive.

  - Distinguish ex ante norms (what conduct should be discouraged) from ex post treatment
  of specific individuals.

  - Collateral damage: sanctions hit family, employees; chilling effects on third
  parties; effects on the sanctioned person''s employer signals.

  - Statistical vs identified targets.

  - Whether the sanction is reparable: retraction, apology, amends.

  - Consistency with legal results: private actor rights vs employment-at-will etc.
