  The theory I find compelling is subjective expected utility theory. It says that
  any rational preference among bets can be represented as maximizing expected utility
  relative to a single probability measure over states of the world, and that this
  follows from axioms such as the sure-thing principle: if two acts agree on some
  event and differ only elsewhere, your preference between them should be driven only
  by how they differ. The attraction of the theory is that it gives one unified account
  of all uncertainty. It denies any fundamental difference between risk, where chances
  are known, and ambiguity, where they are not: in both cases you have beliefs, those
  beliefs have degrees, and those degrees determine what you should choose. It also
  gives a crisp standard of coherence, because preferences that violate it can be
  turned into a Dutch book: a set of bets, each acceptable to you on its own, that
  guarantees you a loss.


  The intuition I cannot shake is the standard Ellsberg one. One urn contains fifty
  red and fifty black balls. A second urn contains a hundred balls, each either red
  or black, but the proportion is completely unknown. If I am choosing a color and
  will be paid for drawing that color, I prefer to draw from the first urn whether
  the color named is red or black. That pair of preferences feels not like a mistake
  but like recognizing that the second urn confronts me with a different and worse
  kind of uncertainty: I lack even a settled basis for assigning probabilities to
  the possible compositions. Yet the theory tells me this pair of preferences cannot
  be represented by any single probability assignment to red in the second urn; it
  requires simultaneously treating red as less likely than black and black as less
  likely than red. Worse, if I had a symmetric prior over the possible compositions
  of the second urn, the theory says the expected chance of red is exactly one half,
  so I should be indifferent between the urns. My preferences say I am not.


