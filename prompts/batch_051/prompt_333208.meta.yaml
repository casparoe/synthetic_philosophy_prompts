  Subtle mistakes in Simpson''s paradox context:

  1. Conflating "the aggregate association is statistically spurious" with "the aggregate
  association is not a fact about the population." Simpson''s paradox doesn''t show
  the aggregate is meaningless; it shows effect reversal due to confounding/marginalization.
  The aggregate proportion difference is a true feature of the dataset, but may mislead
  about causal effect.

  2. Misattributing the paradox: calling it a statistical illusion that disappears
  when you have more data; actually it can persist even with infinite data (it''s
  not sampling variability).

  3. A step that doesn''t follow: concluding from reversal that the subgroup-level
  effect is always the correct one. In many contexts (e.g., with mediators, or when
  group membership is affected by treatment), the disaggregated effect can also mislead.

  4. Conflating Simpson''s paradox with Berkson''s paradox or with the ecological
  fallacy. The ecological fallacy is inferring individual correlations from group
  correlations; related but distinct. A subtle misattribution: student says the paradox
  is "another name for the ecological fallacy" — that''s a conflation a hasty grader
  might pass over.


