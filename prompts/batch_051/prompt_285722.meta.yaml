  a conversation with an old friend has unsettled a conviction I held throughout my
  working life. The friend, whom I will call D, has discovered that a cheap and highly
  reliable genetic test can tell him whether he carries the variant responsible for
  a degenerative neurological condition that killed his father. The condition cannot
  currently be treated or prevented, and D insists that no decision in his life would
