  Draft:


  ---


  Last week our graduate seminar in political economy discussed Oskar Lange''s model
  of market socialism, and afterwards two of my classmates, Alex and Sam, got into
  a disagreement I couldn''t referee. Alex had defended Lange against the Austrian
  critique; Sam thought the Austrian critique, especially Hayek''s, still stands.
  I took notes on their exchange and would like a careful, move-by-move adjudication
  of it.


  (1) Alex said the original Mises challenge was computational: without markets in
  producer goods there are no prices, so planners cannot compare alternative techniques.
  Lange directly answered this with a trial-and-error procedure — the Central Planning
  Board announces provisional prices, plant managers are told to minimize average
  cost and set output where marginal cost equals price, and the Board then raises
  prices where there is excess demand and lowers them where there is excess supply,
  exactly as a Walrasian auctioneer would. So Lange established that rational allocation
  is possible in principle under socialism, and the remaining objections are practical.


  (2) Sam replied that Alex had changed the subject. Hayek''s point, Sam said, is
  not that the equations can''t in principle be solved, but that the information they
  require is never given to any single mind. Real prices transmit dispersed knowledge
  — local bottlenecks, a foreman''s tacit sense of which machine will fail, a farmer''s
  read of the weather — that no board could collect in reports. Lange''s auctioneer
  only works after somebody has already decided which goods are to be priced and what
  the categories of "shortage" and "surplus" mean, and those decisions are themselves
  the very discovery process markets perform.


  (3) Alex answered that this runs two distinct objections together. Mises claimed
  calculation is impossible; Lange produced a procedure that would in principle find
  the right prices. If Sam''s real worry is that the Board would lack the data, or
  that managers would withhold or falsify information, those are incentive and reporting
  problems — enforceable with audits and bonuses — not an in-principle refutation
  of Lange''s logical claim. You can''t defeat a possibility proof with implementation
  difficulties.


  (4) Sam said the two objections cannot be pried apart, because the data do not exist
  in reportable form. A manager''s knowledge is often embedded in habits and hunches
  rather than figures he could transmit. And prices do more than solve equations:
  they allow people to act sensibly on others'' knowledge without knowing the reasons.
  A Board that adjusts a handful of prices by trial and error has no counterpart to
  the entrepreneurial process that discovers which goods are worth pricing at all
  and continually brings new products and methods into the system.


  (5) Alex conceded the force of this but said Sam was then holding socialism to an
  idealized standard. The trial-and-error process does use market feedback — it watches
  whether shelves clear — so it is a discovery procedure, just a slower one. Real
  capitalist markets don''t clear instantly either; they are full of monopoly, asymmetric
  information, and coordination failures. The right comparison is not socialism versus
  the perfect market but socialism versus the market we actually get, and Lange only
  needs approximate allocative efficiency.


  (6) Sam''s final reply was that the difference is not imperfection but systematic.
  In a competitive market, an entrepreneur who misreads an unfilled demand loses her
  own capital and is replaced; the discipline is decentralized and the errors are
  someone''s loss. In Lange''s model the Board is a monopolist price-setter with no
  residual claim on its own success and no outside competitor, so the mechanism has
  no force pushing it toward the equilibrium it is supposed to discover, and nothing
  generating the novelties that make yesterday''s prices obsolete.


