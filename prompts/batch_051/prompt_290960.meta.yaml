  Rawls''s actual view (from memory, not quote): In Theory of Justice, he discusses
  envy. Envy is the propensity to view with hostility the greater good of others even
  though their being more fortunate does not detract from our advantages. Envy is
  not a moral feeling; no moral principle can be constructed from it. It is a vice
  that harms both the envious person and others. Resentment, by contrast, is a moral
  feeling: we resent injustice (departures from right and justice). Jealousy is about
  wanting to keep what one has (a lover''s affection). Excusable envy: when there
  are large inequalities, those in the least advantaged position may be envious; this
  envy is excusable because the inequalities may be such that the situation hurts
  their self-respect, and it would take an unreasonable degree of self-command not
  to feel it. But excusable envy is not a ground of justice; rather a well-ordered
  society should be arranged so that, if possible, excusable envy doesn''t arise.
  The difference principle isn''t justified by envy; the parties are mutually disinterested
  and not envious. A just society does not necessarily eliminate envy (special psychology),
  but principles of justice reduce the conditions.


