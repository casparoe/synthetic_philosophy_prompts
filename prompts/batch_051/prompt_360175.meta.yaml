  Prompt text:


  I''m a novelist, and I''ve been doing research for a book set in a big urban hospital.
  It''s about a quality-improvement program that starts measuring surgeons'' mortality
  rates, and as you''d expect, the whole thing starts to rot — surgeons avoid the
  hard cases, gaming, coding tricks, all that. So I started reading about Goodhart''s
  law, and here''s the thing I keep bumping into. The theory, as I understand it from
  Goodhart''s 1975 paper on monetary management, is something like: once you put pressure
  on a statistical regularity by using it for control, that regularity stops being
  a regularity. I''m paraphrasing because I don''t have the paper in front of me.
  Campbell said a version of the same thing for social indicators, though I''m even
  fuzzier on his wording.


  Now here''s my problem. That theory feels almost too powerful — it predicts that
  any metric you use will be corrupted, so all you''ve done is move the corruption
  around. But my intuition refuses to go along. My grandfather ran a small grocery
  for forty years, and he kept honest scales even though the health inspector checked
  them. Surgical checklists seem to actually reduce infections without just shifting
  the lying somewhere else. Baseball on-base percentage still tracks something real
  even after teams started optimizing for it. So my question is: should I treat Goodhart''s
  law as a universal law about measurement and write my novel as a tragedy where every
  improvement metric is doomed, or should I treat my intuition that some numbers stay
  honest as evidence that the theory needs boundaries? Walk me through what each side
  costs. Is there a reading where Goodhart is right about pressure and my intuition
  is right about some measures — maybe because some metrics are harder to game, or
  because some agents have non-strategic reasons to keep them honest — or is one of
  these just wrong? And please separate what''s actually settled among people who
  study this from what''s genuinely contested; don''t present a contested view as
  the consensus. Keep it under 800 words.


