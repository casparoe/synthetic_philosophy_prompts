  Norms of assertion: The central question: under what conditions may one properly
  assert that p? Options: (1) Knowledge norm: one may assert p only if one knows p
  (Williamson). (2) Truth norm: one may assert p only if p is true (maybe Weiner).
  (3) Belief/reasonable-belief norm: one may assert p only if one believes p or reasonably
  believes p. There''s also justified belief. The debate uses cases: lottery propositions
  (you don''t know you lost, but it''s true; can you assert "your ticket lost"? It
  seems improper but true). Moore''s paradox ("It''s raining but I don''t believe
  it"). Insinuation and implicature: you can convey falsehoods without asserting them.


