  I work as a software engineer and have been arguing with colleagues about whether
  current text-to-image models understand what they depict. The claim I want to test,
  which I keep seeing in slightly different forms, is roughly this: a diffusion model
  trained on text-image pairs has no representation of the objects in its images —
  a prompt like "an armchair seen from directly above" works only because the training
  distribution contains enough top-down armchair images to interpolate against, not
  because the model has inferred anything about the chair as a three-dimensional thing.
  The model, on this view, is doing something closer to a very high-dimensional lookup
  over 2D pixel statistics, and all the apparent depth, occlusion, and lighting consistency
  are features of the training data, not of anything the model knows.


  I can imagine plenty of ways to collect suggestive evidence in either direction
  — prompting for unusual viewpoints, generating an image and then asking for the
  same scene from another angle, probing activations, checking whether shadows and
  reflections stay consistent under changes to the scene — but I don''t trust my own
  sense of what any of these would show, because "having a representation" is not
  a quantity I know how to measure directly.


  Design the best empirical test you can of the claim that a current text-to-image
  model lacks anything worth calling a representation of depicted objects as three-dimensional
  things, and is instead only recombining statistics over 2D images. Be concrete about
  the setup, the prompts or measurements involved, and the interpreting in advance.
  Say what pattern of results would count clearly against the claim, what would count
  clearly for it, and what would look ambiguous. Then say which part of the claim
  survives even a clean test: what, if anything, could the test not settle about whether
  the model "understands" or "represents" the object, and why not.


