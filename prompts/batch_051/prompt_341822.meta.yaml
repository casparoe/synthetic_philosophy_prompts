  even when the choices look self-destructive.

  (5) Still, I can''t shake the thought that some preferences are adaptive: a person
  who has stopped wanting something because it''s out of reach isn''t better off for
  not wanting it, even if they''d choose not to pursue it.

  (6) Utility is ordinal only; interpersonal comparisons of utility are meaningless.


