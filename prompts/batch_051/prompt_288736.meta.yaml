  actually asserting. It seems to me it could mean very different things: that past
  facts cannot be retroactively changed; that a monument is itself a surviving trace
  whose loss would damage the historical record; that people will think less about
  the figure or the events if the statue is no longer in front of them; that removing
  it expresses or encourages a community''s desire to avoid confronting its own past;
  or that a community''s choices about what to honor are themselves part of its history.
