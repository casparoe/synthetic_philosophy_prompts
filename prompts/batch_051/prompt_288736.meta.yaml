  In debates about commemoration, defenders of monuments say removing or renaming
  erases history. Possible precisifications:


  1. Historical record claim: removing the object destroys evidence/documentation,
  making future scholarship harder. But usually false or weak: photographs, archives,
  museum contexts preserve record; the removal from public honorific space doesn''t
  erase evidence. Also the object isn''t the history.


  2. Public memory claim: removing from prominent public space reduces the likelihood
  that ordinary passersby will think about that history, so it removes a prompt to
  public recollection. Substantive but empirical; could be true of that effect, though
  contested; also doesn''t distinguish history from honorific display.


  3. Collective amnesia/intention claim: the act is motivated by or expresses a desire
  to avoid confronting the past; removal is part of a policy of forgetting. Defensible
  in some cases but may overstate motives; removal can be motivated by moral reassessment,
  not forgetting.


  4. Pedagogical claim: future generations won''t learn about the figure/event if
  the monument is gone. Empirical and mostly false or overstated given textbooks/curricula;
  perhaps true for incidental learning.


  5. Commemorative/normative claim: removing the statue changes what a community officially
  honors; it "erases" the past honorific status, not the historical fact. Often true
  but trivial-ish; almost tautological that removal ends an act of commemoration.


  6. Identity/history-as-narrative claim: a nation''s history is partly constituted
