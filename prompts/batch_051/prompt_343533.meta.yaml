  Need to make sure the physics is stated correctly:

  - In classical electrodynamics, electric and magnetic fields fully determine the
  forces. The potentials are not uniquely determined; gauge transformations A'' =
  A + ∇χ, φ'' = φ − ∂χ/∂t leave E and B invariant.

  - AB effect: magnetic AB effect: an electron passing around a solenoid sees no B
  along its path, but the interference pattern depends on the phase shift (e/ħ)∮A·dl
  enclosed. The loop integral equals the magnetic flux through the loop. This is a
  gauge-invariant quantity; adding ∇χ changes A but the loop integral is invariant
  for a single-valued χ. Thus two potentials with different loop integrals (i.e.,
  different enclosed flux) are not gauge-equivalent and yield different shifts. The
  field strength says B=0 everywhere outside the solenoid, so if one only allows fields
  as local gauge-invariant objects, one misses the effect; including the entire B
  (inside the solenoid) as flux captured by loop integral works.

  - The repaired notion: "connection up to gauge equivalence" (equivalence class of
  potentials with the same loop integrals/holonomies) is the physically real structure;
  the potentials still have redundancy within a class, but the class itself can encode
  effects that local fields do not. Or more strongly: "field strength plus nontrivial
  topology/holonomies." Good.


