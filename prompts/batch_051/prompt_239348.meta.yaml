  ---


  I chair the general education committee at a mid-sized university that still has
  a “science for understanding” requirement, and we’re about to vote on a proposal
  to replace our second natural science course—currently picked from a list of mostly
  non-applied subjects like cosmology, evolutionary biology, or geology—with a required
  course in “quantitative reasoning for real-world decisions.” The main argument in
  favor is that it’s more useful, students complain the pure science courses don’t
  have any obvious payoff, and we could market the change to parents. Some of us are
  uneasy but can’t articulate why without sounding elitist. I’d like you to draft
  the short written opinion I’ll circulate before the vote. It should take a concrete
  position—keep the pure-science requirement as is, adopt the substitution, or some
  hybrid—and it should engage the strongest arguments on the other side seriously,
  not just dismiss them as philistines. In particular, I want the memo to work through
  this passage from Aristotle’s Metaphysics (Ross translation), which we discussed
  in our last meeting:

  “But as more arts were invented, and some were directed to the necessities of life,
  others to recreation, the inventors of the latter were naturally always regarded
  as wiser than the inventors of the former, because their branches of knowledge did
  not aim at utility. Hence when all such inventions were already established, the
  sciences which do not aim at giving pleasure or at the necessities of life were
  discovered, and first in the places where men first began to have leisure. This
  is why the mathematical arts were founded in Egypt; for there the priestly caste
  was allowed to be at leisure.”

  How should this bear on our vote? Is Aristotle giving a historical explanation of
  why such sciences arose—leisure, Egypt, priestly caste—that we should not mistake
  for a justification, or is he also making a normative claim about the value of knowledge
  that doesn’t aim at use? And does that claim survive if his historical story is
  shaky? Write it as a memo the committee could actually act on, with a clear recommendation
  and a timeframe.


