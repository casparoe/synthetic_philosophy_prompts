  **Imprecise probabilities background:**

  - Represent uncertainty with a set of probability distributions (credal set), often
  convex.

  - Aggregation: For a group of experts each reporting a set of probabilities, different
  pooling rules: pooling intervals endpoint-wise (M-admissible sets), pooling by intersection,
  etc.

  - Averaging lower and upper bounds yields the interval [mean of lowers, mean of
  uppers], which may be narrower than the union/intersection, and can indeed be more
  informative than any individual set. Known problem: linear pooling of imprecise
  probabilities can produce "precise" group estimates that no individual would endorse;
  also "agreement to disagree" variant.

  - Dilation: conditioning on more information can enlarge an imprecise probability
  interval (for non-Bayes, credal sets), e.g., a coin of unknown bias; before conditioning,
  P(heads)=0.5; after learning the coin is either double-heads or double-tails, the
  set becomes {0,1} — an increase in imprecision despite more information. Dilation
  is a specific, well-known phenomenon. The described pattern could be dilation in
  a dynamic setting: when you average ranges then condition, intervals can widen.

  - Non-conglomerability and order effects.


