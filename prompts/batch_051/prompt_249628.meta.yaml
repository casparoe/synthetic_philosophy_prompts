  Possible argument:


  (1) If a state joins a customs union, it transfers the power to set tariffs on goods
  from outside the union to a common external tariff set collectively.

  (2) If a state is sovereign, it retains the final say over at least its external
  economic borders (tariffs are a core sovereign power).

  (3) So joining a customs union is incompatible with full sovereignty.

  (4) But if setting a common external tariff means giving up sovereignty, then every
  treaty that binds a state''s future conduct also gives up sovereignty: a state that
  promises not to torture, or to cap emissions, has given up its final say over those
  matters.

  (5) But then sovereignty is incompatible with any binding international commitment,
  which is absurd (almost all states make such commitments and we still call them
  sovereign).

  (6) Therefore either no state in a customs union is sovereign, or (2) is false and
  sovereignty is compatible with losing final say over core powers. But the latter
  seems to prove too much: if you can give up final say over tariffs and still be
  sovereign, you can give up final say over everything and still be sovereign, which
  would mean a state that outsources all its decisions is still sovereign.


  Where does it go wrong? The argument slides between sovereignty as "final say" over
  particular policy domains and sovereignty as a status/competence. Or it assumes
  sovereignty is divisible vs indivisible. Or it equivocates between "delegating"
  and "alienating" (transferring competence) — in a customs union, the state has transferred
  but can withdraw (Brexit), or it retains a say in the common tariff via the council,
  so it''s pooled not lost. Also the step from "can give up final say over tariffs"
  to "can give up final say over everything" is a scope shift / no limiting principle,
  but there is a limiting principle: sovereignty requires retaining competence to
  reclaim or the legal right to withdraw, or retaining some ultimate authority.


