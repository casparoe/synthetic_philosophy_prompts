  a necessary condition for sovereignty simpliciter, then (3) implies not sovereign
  at all, not "not fully." The slide from "not sovereign" to "not fully sovereign"
  is a subtle slide: it assumes sovereignty can be partial. Actually (4) introduces
  "fully" without justification. Then (5) says if not fully sovereign, sovereignty
  comes in degrees — that''s a non sequitur: "not fully sovereign" might just mean
  "not sovereign" (the binary). The argument equivocates between a threshold concept
  (sovereignty as a status you have or lack) and a scalar concept (sovereignty as
  a matter of degree).


