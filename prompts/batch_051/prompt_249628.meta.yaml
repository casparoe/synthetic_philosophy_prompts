  as divisible, so maybe the argument''s step (5) is plausible. But step (6)-(7):
  if scalar, then the total handover state is "sovereign to a small degree" — but
  the absurdity of (8) may be denied: some would say it''s not sovereign at all because
  a threshold has been crossed, i.e., scalar until a threshold. So the argument needs
  an account of thresholds.


