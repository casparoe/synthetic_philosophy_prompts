  I''ve been running an advanced seminar on the epistemology of markets, and for the
  past several years the discussion has stalled at the same point: what the no-trade
  theorem actually shows. The group is split. One side reads it as a fatal result
  for the information-aggregation view of markets. On their telling, the theorem shows
  that rational Bayesian agents with common priors, common knowledge of their rationality,
  and common knowledge that exchange is voluntary could never trade purely on differences
  in private information: each would treat the other''s willingness to trade as itself
  adverse information, and the trade would be a zero-sum bet that at least one party,
  knowing what the other''s offer reveals, should refuse. So, if observed speculative
  trading really is as information-driven as it looks, it must be riding on noise,
  overconfidence, or divergent priors — none of which underwrites the claim that markets
  efficiently discover fundamentals. The other side reads exactly the same theorem
  as a reductio of its own assumptions rather than of markets. On their view, the
  result merely pins down the conditions under which the price system cannot do its
  informational work: common priors and common knowledge of rationality are precisely
  the idealizations that suppress the very process — heterogeneous beliefs, costly
  information, the discipline of profit and loss — that the market story needs in
  order to get started. So the theorem tells us about a stylized model, not about
  actual markets.


  The odd thing is that no one in the room disputes the facts: everyone agrees that
  speculative trade occurs, that prices contain at least some information, and that
  the theorem is valid as a piece of model logic. The disagreement concerns what kind
