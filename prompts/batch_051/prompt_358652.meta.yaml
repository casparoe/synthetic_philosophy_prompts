  Key Strawsonian points to get right in designing the prompt:

  - Reactive attitudes = attitudes we hold toward others (resentment, gratitude) and
  ourselves (guilt); they''re natural and partly constitutive of interpersonal relationships.

  - Participant stance vs objective stance: taking part in relationships vs viewing
  someone as object of social policy/treatment.

  - Two types of conditions that modify our reactive attitudes: excusing conditions
  (the agent isn''t fully blameworthy but is still a participant: "he didn''t know,"
  "he was pushed") and exempting conditions (the agent is not a proper target of reactive
  attitudes at all: "he''s a child," "he''s mentally ill," "he''s not himself").

  - Strawson argues the truth of determinism doesn''t force us to abandon reactive
  attitudes; the objective stance is pragmatically impossible to sustain wholesale
  and, if it were, would cost us interpersonal life; justificatory questions are internal
  to the framework.

  - The debate: naturalistic readings vs normative readings.


  RL mapping candidates:

  - Reactive attitudes as credit assignment: tempting but lossy because reactive attitudes
  aren''t only about updating blame parameters; they''re also communicative/demanding
  — second-personal. Indeed key residue: the second-personal nature (Strawson''s insight
  developed by Darwall) — resentment addresses a demand TO the other; credit assignment
  is third-personal. That''s great residue to ask about.

  - Participant vs objective stance as "model as agent vs model as part of environment":
  clean.

  - Excusing vs exempting: excuse = still an agent, but under corrupted observation/action/transient
  policy, so discount; exemption = not an agent (or below the threshold of agency),
  so treat as environment. Distorts: in Strawson, exemption isn''t a factual classification
  but a stance we take for reasons; and excuses appeal to the agent''s own capacity
  for reactive attitudes (he couldn''t have done otherwise given his state), whereas
  RL discounting is purely predictive.

  - Inescapability: Strawson''s point isn''t a statistical claim about non-stationarity;
  it''s that the participant stance is conceptually tied to human relationships. RL
  vocab may express the cost of excluding all agents but not the conceptual/normative
  point.


