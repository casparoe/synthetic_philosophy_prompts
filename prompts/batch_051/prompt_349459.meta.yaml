  Draft:


  "Prompt:


  I am in a PhD program in moral philosophy, and over the past year I have become
  convinced of a broadly Taurekian position about aggregation in forced-rescue cases,
  and I want to know what would count against it.


  The position, as I now hold it: In a choice where I can save exactly one of two
  groups of strangers — say, David or the five — the fact that there are five on one
  side and one on the other is not itself a reason to save the five. What each of
  the six is owed is equal consideration of his individual claim, and no individual''s
  claim is made more weighty by the presence of others with matching claims. From
  this I draw the further conclusion Taurek drew: one may, and perhaps should, give
  each of the two groups an equal chance — a fair coin toss — rather than a chance
  weighted by group size, because a weighted lottery would already concede that the
  five jointly generate a claim that David cannot match. I also hold that this generalizes
  beyond mortal rescue to any forced distribution of a scarce good among competing
  burdens — that it would not be wrong, for instance, to relieve one person of a severe
  torment rather than many people of mild discomforts, and that the numbers never
  do independent work.


  I know the obvious objections — the aggregationist one is no surprise to me — so
  I''m asking for something more: I want a map of what this view risks, and what a
  defender of it ought to recognize as counting against it. Specifically:


  (1) Which arguments, cases, or formal results would count against the view if they
  succeed, sorted from fatal to merely awkward?

  (2) Which of these would a committed Taurekian concede as genuine costs — things
  the view must accept and defend — rather than dismiss as question-begging?

  (3) What does the view predict or commit one to that its rivals do not, and where
  has it been modified, qualified, or shored up in ways that might have insulated
  it from counterevidence?

  (4) Is it even the kind of view that can be falsified, or is it better described
  as a normative framework that only has costs, not defeaters? If so, is that insulation
  a problem or simply the standing of a first principle?

  (5) Are there empirical or formal developments outside the usual seminar-room debate
  — in psychophysics of pain comparisons, in social choice theory, in jurisprudence
  about group claims — that a conscientious holder of this view should regard as inflicting
  damage?


  I am most likely to be moved by things a defender of the view would themselves identify
  as a cost, and least moved by the bare insistence that of course numbers count."


