  I am a philosophy PhD student working in normative ethics, and I have come to hold
  a broadly Taurekian position on so-called "saving the many" cases. I accept that,
  when I can rescue one stranger from one threat or five strangers from another, the
  fact that five is a larger number gives me no more reason to save the five than
  the one. My reason is the individualist restriction: benefits and harms attach to
  subjects; the death of each of the five is equally as bad for that person as the
  death of the one is for the one, but there is no sixth subject who bears the aggregate
  loss, so the five losses cannot combine into a weightier reason. On the procedural
  side, this leads me to reject giving the five a weighted chance proportional to
  their number and instead to treat each imperiled person''s claim to rescue as equal:
  a fair procedure is one that gives each person, including the one, the same ex ante
  chance, such as a coin toss.


