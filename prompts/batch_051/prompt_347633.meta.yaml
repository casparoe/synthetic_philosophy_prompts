  A friend and I were messing around with the doomsday argument and he built a version
  of it that I can''t shake, but I also can''t quite buy where it lands. I''ll lay
  it out as he gave it to me; tell me where it goes wrong, if it does.


  (1) I should reason as if I''m a random draw from the class of all humans who will
  ever live. Not in some cosmic sense, just: conditional on there being N humans total,
  my birth rank is equally likely to be any whole number from 1 to N.


  (2) I''m roughly the 100 billionth human to have been born, give or take.


  (3) If the total number of humans who ever live is, say, 200 trillion, then my rank
  is in the first 0.05% of all humans, which is wildly early. If the total is more
  like 200 billion, my rank is middling. The former hypothesis makes my observed rank
  a thousand times less likely than the latter does.


  (4) So my observation of my own birth rank is very strong evidence for a smaller
  total, i.e., for the species ending relatively soon rather than going on for millions
  or billions more years.


  (5) But this is where it starts proving too much. Run the same reasoning with different
  classes. If I take my class to be all conscious beings, not just humans, my rank
  is different and the predicted doomsday shifts. If I take it to be all mammals,
  or all English sentences ever written, or the years of my own life, I get different
  answers again — and the lifespan version says I should expect to die much sooner
  than my age cohort''s actuarial tables say, which seems like a reductio.


  (6) And yet his conclusion stands: unless I had some independent reason to think
  the total will be enormous, I should update hard toward "not too many more of us,"
