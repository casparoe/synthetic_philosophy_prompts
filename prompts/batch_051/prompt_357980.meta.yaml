  "Sam hasn''t stopped smoking" still presupposes he used to. That''s the classic
  diagnostic.

  2. But presuppositions sometimes fail: speaker can use a sentence whose presupposition
  isn''t in the common ground. Addressee can quietly "accommodate" — add the presupposition
  to the background so the conversation proceeds: "Sorry I''m late — my sister''s
  car broke down" presupposes the speaker has a sister; hearer accepts, common ground
  updated. Accommodation is not repair: it''s the presupposition being treated as
  already part of context, not challenged.

  3. Scorekeeping: Lewis''s metaphor: conversation is like a baseball game with a
  scoreboard tracking indefinite, evolving components (presupposition sets, standards
  of precision, salient possibilities, etc.). A rule of accommodation: if at a point
  something is required to be on the scoreboard for the utterance to be acceptable,
  and it''s not there, and no one objects, it gets added — within limits. Scorekeeping
  generalizes accommodation: what gets accommodated isn''t just propositions but standards
  (gradable adjectives, "flat", "empty", epistemic modals?).


