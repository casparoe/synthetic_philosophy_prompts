  Potential prompt final:


  "Early in Empiricism and the Philosophy of Mind Sellars runs through the things
  philosophers have said are given: sense contents, material objects, universals,
  propositions, real connections, first principles, even givenness itself. I want
  to use that list as a test suite for what an account of observational knowledge
  is supposed to accomplish once you reject the given. So here is what I''d like.
  Write the desiderata for a theory of perceptual justification that can accept Sellars''s
  negative point without collapsing into mere coherentism. For each desideratum, give
  the motivating case or consideration and say whether it is non-negotiable or just
  a preference of one camp. Make sure you cover at least these questions: What distinguishes
  a sensation from a seeing-that? What must a theory say about the difference between
  being a reliable differential response and being able to offer a reason? What cases
  must it get right—the chicken sexer who can sort but not explain, the novice looking
