  "I am writing a paper on Carl Hempel''s Studies in the Logic of Confirmation. I
  want to understand the ravens paradox by having a case built to order. In the article
  Hempel considers two principles: that a positive instance of a generalisation confirms
  it (often called Nicod''s criterion), and that whatever confirms one statement confirms
  any logically equivalent statement. Because ''All ravens are black'' is equivalent
  to ''All non-black things are non-ravens'', a white shoe seems to confirm the raven
  hypothesis. A standard Bayesian response says this is not a paradox because the
  white shoe confirms only by a negligible amount once background knowledge is taken
  into account.


