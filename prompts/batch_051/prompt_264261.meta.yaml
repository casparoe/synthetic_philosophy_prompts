  Let me think about the color phi phenomenon accurately.


  Color phi: In the classic experiment (Kolers and von Grünau, 1976?), two small spots
  of light are flashed successively at different locations, one red and one green.
  Observers report seeing a single spot that moves from the first location to the
  second and changes color abruptly midway. The issue: how can the brain "know" to
  fill in the color change before the second flash occurs? If the second flash hasn''t
  happened yet, how can the interpolation include the color change at the midpoint?
  Dennett uses this to argue against the "Cartesian Theater" of a fixed timeline of
  experience, and distinguishes "Orwellian" revision (the memory/record of experience
  is edited after the fact, like Orwell''s Ministry of Truth rewriting history) versus
  "Stalinesque" revision (the experience itself is staged/tampered with before it
  reaches consciousness, like Stalin''s show trials). Dennett argues the two are empirically
  equivalent and the distinction collapses — there''s no fact of the matter about
  whether the revision happened before or after consciousness because there''s no
  single place/time where consciousness happens.


