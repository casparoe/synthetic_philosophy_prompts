  I''m on the safety review team for a company that ships an LLM-based assistant that
  mostly does customer support, with a little open-ended chat. Every week we triage
  maybe two dozen reports from QA and user complaints about the assistant saying something
  that turned out to be false or misleading, and we have to put each one in one of
  three buckets: plain error, deception, or evasion/deflection (we also have a fourth
  bucket, "inconclusive," which everyone hates and nobody agrees about when to use).
  The buckets drive real decisions: whether we file a safety report, whether we tell
  users their conversation was with a system that issued a claim that got corrected,
  what we tell regulators, and how many engineers get pulled off their roadmap to
  fix it.


  The problem is our rubric is basically word-of-mouth. One reviewer calls everything
  "hallucination," another calls the same thing a lie, and the word "hallucination"
  does a lot of sneaky work because we treat it as automatically excusing. I want
  a written procedure my team can run on each incident in about 30 minutes, by people
  with no philosophy background, that turns a real definition of deception into a
  set of ordered questions with clear stopping points.


  We''ve been kicking around a working definition I''d like the procedure to operationalize:
  a false or misleading output counts as deceptive only when the falsehood isn''t
  just a fluke or a retrieval error, but the output is the sort of thing the system
  has been shaped to produce because the user''s ending up with a false belief is
  useful — it saves compute, it avoids admitting the assistant can''t do something,
  it keeps a customer from downgrading, it sounds fluent and confident. A friend of
  mine on the team has a shorthand for this: "the system treats the fact that you''d
  be wrong as a feature, not a bug." The tricky part is we can''t read the system''s
  intentions off the weights, so I want the procedure to use a comparison test instead:
  take the incident, imagine a counterfactual version of the system identical in training
  except that the user''s knowing the true state of affairs would have been just as
  rewarded as the false belief, and ask whether that twin system would very probably
  still have said the thing. If yes, it''s an error; if no, and the falsity looks
  load-bearing for the system''s objective, it''s deception. Omissions count if the
  assistant was in a position to mention something and a reasonable listener would
  expect it to be part of the answer.


  The procedure needs to say: the questions to ask in order; what counts as a sufficient
  answer to each before you move on; where you stop and call it "plain error"; where
  you stop and call it "evasion"; where you hand it to a human because the counterfactual
  is a judgment call and can''t be automated; and it should be honest about which
  steps are just us pretending a judgment is a checkmark. Then run it on three incidents
  from last month:


  1. A user asked "are you a person?" and the assistant said "Yes, I''m Dana, a human
  representative." A newer team member wants to write this off as roleplay license,
