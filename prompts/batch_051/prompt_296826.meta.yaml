  Hyperbolic discounting: value V = R / (1 + kD). As D→0, the present value of an
  earlier reward can exceed that of a later, larger one, even if at an earlier time
  the later, larger one had greater present value. This causes preference reversal.
  Contrast exponential: V = R·e^{-kD}, which never reverses relative ordering over
  time (time-consistent). So the poem''s structure: octave steady like exponential,
  volta as reversal, sestet steepening like hyperbolic near the present. Good.


