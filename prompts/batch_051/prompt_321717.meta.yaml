  Here is a case I keep returning to. In the standard color phi setup, a red spot
  is flashed briefly at one location, and then, after a short interval, a green spot
  is flashed at a second location. Subjects do not report two successive flashes.
  They report a single spot that moves from the first location to the second and changes
  from red to green roughly midway along its trajectory, with the color change represented
