  the puzzle distinguishes two accounts. On the Orwellian account, the subject first
  consciously sees a stationary red spot, and once the green flash arrives the brain
  edits the experienced past, overwriting the prior episode with a memory of a moving,
  color-changing spot. On the Stalinesque account, conscious experience of the first
  flash is delayed until the second flash can be integrated, so the subject never
  consciously sees a stationary red spot at all; the moving, color-changing spot is
  the first thing experienced.


