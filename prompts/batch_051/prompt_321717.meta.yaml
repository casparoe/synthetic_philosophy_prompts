  Let me think carefully about color phi to ensure accuracy. The color phi phenomenon:
  In experiments by psychologists (Paul Kolers and Michael von Grünau, 1976), two
  colored spots are flashed in sequence at different locations with a brief delay.
  Observers report seeing a single spot moving from the first location to the second
  and changing color abruptly midway. The puzzle: how can the object appear to change
  color before the second spot is presented? It suggests the brain''s representation
  of the initial red spot must be revised after the second green spot arrives, or
  that conscious experience is delayed. Dennett and Kinsbourne (1992) discuss "Orwellian"
  vs "Stalinesque" revisions: in Orwellian, you consciously experienced red, then
  later memory is revised so you recall green; in Stalinesque, consciousness of the
  first spot is delayed until after the second arrives, so you never consciously experienced
  red at all. Dennett argued that the question is based on a mistake — the assumption
  of a single, determinate "stream of consciousness" with a definite timeline, and
  that there may be no fact of the matter distinguishing the two. This is from "Consciousness
  Explained" and Dennett & Kinsbourne "Time and the Observer" (1992). Well-known enough.


