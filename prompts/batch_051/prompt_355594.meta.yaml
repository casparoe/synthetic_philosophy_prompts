  several hundred milliseconds before the reported time of conscious intention (W)
  to flex wrist/finger, and W precedes the movement by ~200 ms. Libet concluded: the
  initiation of the act begins unconsciously, but the conscious self can still veto
  or permit the act in the ~150-200 ms before movement — "free won''t" / veto power.


