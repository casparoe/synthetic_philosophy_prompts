  suffering has moral relevance, while positive wellbeing has at best instrumental
  value. Prioritarianism gives extra weight to benefits to the worse off. Since the
  very badly off are suffering and the well-off are not, both views oppose the policy.
  The only difference is that negative utilitarianism is a version of consequentialism,
  whereas prioritarianism is not..." Hmm, that''s actually wrong—prioritarianism is
  a form of consequentialism (welfarist). Could be a subtle misattribution? Many students
