  Exam question (posed to student): "Explain whether a negative utilitarian and a
  prioritarian would necessarily disagree about a policy that slightly increases the
  wellbeing of the already well-off at the cost of slightly increasing the suffering
  of the very badly off. If not, explain which further commitments would determine
  their verdicts."


