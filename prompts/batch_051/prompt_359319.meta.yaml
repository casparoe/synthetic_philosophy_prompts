  ---


  I''m a teaching assistant for an upper-division ethics course, and I''m grading
  a batch of short-answer questions on consequentialism and population ethics. One
  question concerned the practical differences between negative utilitarianism and
  prioritarianism. I''ve copied the question and one student''s answer below. I''d
  like you to act as a second grader: assign a grade (say, out of 10) and give me
  the specific comments that justify that grade, the way you''d write them for the
  student. I don''t want a general impression; I''d like a point-by-point assessment
  of where the answer earns credit and where it goes wrong, and how serious each error
  is.


  Question: "A policy is proposed that would slightly increase the well-being of some
  people who are already very well off, while slightly increasing the suffering of
  a smaller group of people who are already very badly off and whose suffering is
  severe. Must a negative utilitarian and a prioritarian reach the same verdict about
  this policy? Explain your answer, attending to what each view says about the moral
  significance of suffering as opposed to positive well-being."


  Student''s answer: "They will very likely agree here, and in many cases must. Negative
  utilitarianism holds that suffering is the only thing of intrinsic moral importance,
  while positive well-being has no intrinsic value at all, so a negative utilitarian
  is committed to rejecting any policy that increases anyone''s suffering no matter
  how much other people gain. A prioritarian also gives extra weight to improvements
  for the badly off, and in particular to relieving their suffering, so the prioritarian
  will also reject the policy. The views differ mainly in their deeper rationale:
  negative utilitarianism is a form of consequentialism that cares only about the
  lower end of the distribution, whereas prioritarianism is not a consequentialist
  view at all but a kind of egalitarianism concerned with how benefits and burdens
  are distributed. Thus the two views converge on this case, and their disagreement
  is mostly theoretical rather than practical."


