  ---


  I''m a journalist who covers science and ideas, and I''m working on a long piece
  about the way the language of "commitment" — commitment devices, credible commitments,
  self-binding — has drifted away from the older moral notion of a promise. In the
  course of reporting I''ve come to think I never really understood the philosophical
  question of why promises bind in the first place, and I want to test whether my
  usual vocabulary can even say what the philosophers are arguing about. I am not
  a trained philosopher, but I am fluent in the vocabulary of game theory and behavioral
  economics: commitment devices, cheap talk versus costly signaling, repeated games
  and reputation, Nash equilibria of commitment games, self-enforcing arrangements,
  third-party enforcement, and the distinction between a binding contract and an arrangement
  that simply gives each party an incentive to follow through.


  Please restate, as faithfully as you can, the main philosophical positions on why
  promises bind — for instance, the conventional-practice view that promising is a
  rule-governed social institution and that making a promise is performing a move
  whose normativity comes from the practice rather than from any single individual''s
  will; the expectation-based view that a promise obligates because the promisor knowingly
  leads the promisee to form expectations and signals that the promisee may hold the
  promisor responsible if those expectations are disappointed; and the deflationary
  or skeptical view that promising is essentially a signaling-and-coordination device
  and its "bindingness" is nothing over and above the costs of breaking it. Translate
  each into the vocabulary I just described. Then give me the residue report: which
  parts map cleanly onto commitment, signaling, reputation, or contract-theoretic
  ideas; which parts can be forced to fit only by distortion; and which parts have
  no counterpart in my vocabulary at all. I especially want to know whether the philosophers''
  notion of obligation or bindingness is captured by the notion of a self-enforcing
  equilibrium, or whether my vocabulary is structurally blind to the very thing the
