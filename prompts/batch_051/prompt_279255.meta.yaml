  Freeganism and byproducts of rescued animals: The question is whether using animal
  products that would otherwise go to waste (eggs from hens who lay anyway, wool from
  sheep that need shearing, leather from roadkill or naturally dead animals, dumpster-dived
  dairy) is morally permissible or even required. Arguments:

  - Demand/causation: buying animal products creates demand; but using what would
  be discarded doesn''t increase demand, so no additional suffering. If the only objection
  to animal products is that purchasing them causes harm, then using waste products
  is fine.

  - Opportunity cost / price effects: taking free discarded meat might still have
  indirect market effects? Probably negligible. But someone might say it normalizes
  a category? Actually consuming "meat" at all may maintain one''s taste for meat,
  leading to future consumption when not freely available; or normalizes animal products
  in social settings, influencing others'' demand. That''s an indirect causal argument.

  - Expressivist/symbolic: eating an animal''s body or secretions expresses a view
  that animals are resources for humans, which is the very attitude that sustains
  exploitation; even without demand, it embodies disrespect. Conversely, using everything
  might express gratitude/respect, as in many indigenous/peasant traditions.

  - Purity/avoidance: veganism is an identity/ethic of abstention; using animal products
  is simply off-limits regardless of consequences.

  - The "victim''s consent" question for rescued animals: eggs from rescued hens.
  Does the hen consent? Can we take eggs? Some argue we should feed the eggs back
  to hens to replenish calcium, or leave them. Others argue the hen doesn''t care
  and the eggs would rot.

  - The non-identity/waste issue: if the product would otherwise rot, no one is harmed
  by using it.

  - Freeganism as protest: consuming waste is a way to avoid participating in the
  economy, but using animal waste doesn''t protest animal agriculture; it might even
  make one dependent on its byproducts.


  Now the proverb "waste not, want not" could be precisified along dimensions:

  - Scope: all resources or only animal byproducts? Does it apply to waste that came
  from injustice?

  - Modality: obligation vs permission vs supererogation.

  - Normative basis: welfare (pain of producing replacement), respect for the animal,
  environmental impact, thrift.

  - Causal vs. expressive significance: does using it cause demand or only express
  an attitude?

  - Temporal/status: does it matter that the waste already exists, or that someone
  else''s demand created it?


  Readings:

  R1 (Prudential): If you avoid waste, you won''t be in want; using byproducts is
  a wise practice of thrift. Trivial/deceptively true as economics, but silent on
  animals.

  R2 (Waste-minimization beneficence): It is better that a good be used than destroyed;
  using the eggs or leather makes the world slightly better (or less wasteful). Plausible
  but weak; doesn''t override other considerations.

  R3 (Permissibility from no-new-harm): If using a byproduct causes no additional
  animal suffering or demand, then it is morally permissible. Arguably true w.r.t.
  animal harm; does support friend''s conclusion but only against harm-based objections.

  R4 (Wrongness of waste / obligation): You ought to use anything that would otherwise
  go to waste. Strong and almost certainly false: not every opportunity to use a resource
  is an obligation; there can be good expressive, religious, or identity-based reasons
  to abstain.

  R5 (Transactional reading): The harm in animal exploitation was in the original
  production; if that harm is already done, the consumer of the byproduct is not complicit
  and need not feel guilty. This is a complicity/clean-hands reading; it supports
  use but fails against the expressivist objection.

  R6 (Honor/respect reading): Letting an animal''s body or labor go to waste compounds
  the wrong; using it fully is a way to respect the animal. Controversial, depends
  on views of what respect requires; arguably backfires because using an animal as
  a resource may itself be the disrespect.

  R7 (Demand-shifting/social normalization reading — cautionary): Actually "waste
  not, want not" could be used to mean using animal product hasn''t got anything to
  do with one''s attitudes; but it neglects that use may keep one''s taste/identity
  as a consumer alive and normalize others'' consumption, causing later demand. So
  the proverb''s own logic ("want not") might cut the other way: to avoid wanting,
  one should not use.

  R8 (Expressivist counter-reading): If signaling matters, refusing even free animal
  products expresses the strongest rejection of the practice; using waste signals
  that animal products are acceptable resources. On this reading, the slogan is false
  as a general moral claim because it ignores expressive meanings.


