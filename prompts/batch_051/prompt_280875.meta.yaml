  Let me think about the substance. The known landscape: group fairness criteria:

  - Independence/statistical parity: decisions/scores independent of group membership.

  - Separation/equalized odds: for both groups, given outcome, score distribution
  same (equal false positive and false negative rates).

  - Sufficiency/calibration: outcome independent of group given score (score means
  same risk regardless of group).


  Impossibility: cannot satisfy independence and sufficiency simultaneously except
  when base rates equal or scores are useless; cannot satisfy separation and calibration
  simultaneously except in degenerate cases (Kleinberg et al.). The COMPAS debate:
  ProPublica showed COMPAS had unequal false positive rates (violates equalized odds)
  while Northpointe/Equivant defended it as calibrated (satisfies sufficiency). So
  calibration and equalized odds conflict when base rates differ.


  A homemade theory could be: "Fairness is calibrationism" — the view that the only
  fairness requirement on a predictive algorithm is that the score or decision have
  the same meaning across groups (sufficiency), and that once calibration holds, any
  remaining disparities are not defects of the instrument but properties of the underlying
  distributions; to demand anything more is to ask the algorithm to lie about the
  data. This is a real stance people defend (though not always with that name). It''s
  not obviously silly; it''s the position of some practitioners. But as a "coined"
  theory, it exists under names (sufficiency, calibration, "Fairness Through Awareness"
  to some extent). A good answer would say: this is a recognizable and sometimes defended
  position — roughly the "we calibrate" view — but it isn''t a complete theory of
  fairness: it makes fairness a property of labels rather than of how benefits and
  burdens are distributed; it treats base-rate differences as exogenous even when
  they are products of historical injustice; it can endorse large imbalances in false
  positives as long as score thresholds align; it conflates reliability with legitimacy;
  and the impossibility result shows calibration and equalized error can''t both hold
  — calibration picks one horn. The concept breaks when we care about the harms of
  decisions, not just the accuracy of probabilities.


