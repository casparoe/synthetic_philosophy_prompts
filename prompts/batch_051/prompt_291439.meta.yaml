  Fear and Trembling (1843), pseudonym Johannes de Silentio. It discusses Abraham''s
  binding of Isaac (Genesis 22). Problemata:

  I. Is there a teleological suspension of the ethical? (the ethical is the universal;
  Abraham''s act is a "teleological suspension" for a higher end/telos — relation
  to God)

  II. Is there an absolute duty to God? (duty to God cannot be mediated by the universal)

  III. Was it ethically defensible for Abraham to conceal his undertaking from Sarah,
  Eleazar, Isaac? (silence)


  Key concepts: the ethical is the universal (Hegelian Sittlichkeit); the tragic hero
  (Agamemnon sacrificing Iphigenia, Jephthah, Brutus) remains within the ethical because
  his sacrifice serves a higher ethical universal; Abraham has no such universal justification
  — his act is a private relation to the absolute, making him either a murderer or
  a knight of faith. The "double movement" of faith: infinite resignation (renouncing
  Isaac with pain/resignation) then the movement of faith by virtue of the absurd
  (belief he will get Isaac back). The knight of infinite resignation vs knight of
  faith. Faith involves the absurd, the impossible, the moment. The "teleological
  suspension" is not the same as aesthetic concealment or ethical self-justification;
  Abraham cannot speak because he cannot be understood — he cannot mediate his act
  in the universal.


