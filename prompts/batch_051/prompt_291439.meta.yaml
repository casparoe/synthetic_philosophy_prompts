  The asker wants: "Write the desiderata a theory in an area must meet." The prompt
  should:

  - Be formal/polished.

  - Specify what a theory of the direction of time / thermodynamic arrow must do to
  count as adequate.

  - Include phenomena/cases, distinctions, results it must respect, with case behind
  each.

  - Mark negotiable vs non-negotiable.

  - Flag any subset jointly unsatisfiable given Loschmidt/Zermelo etc.

  - Keep weight on criteria and motivating cases rather than scoring contenders.

  - The asker can fix the purpose.


  Let me write it. Some core content:


  Introduction: "I want a specification of what an adequate theory of the direction
  of time—specifically the thermodynamic arrow—has to deliver, before I weigh the
  existing candidates." Maybe specify purpose: "for a theory of why entropy increases
  toward the future, understood as an objective temporal asymmetry in the world, not
  merely a convention." That fixes the purpose.


  Then ask for requirements list:

  - The theory must state what explanatory target exactly: the fact that entropy increase
  is overwhelmingly likely in one time direction in isolated systems, or the observed
  asymmetry of records/interventions? Must distinguish the thermodynamic arrow from
  the psychological, causal, epistemic/epistemic arrow? A theory must say which arrows
  it takes as primitive and which it derives; can''t define future as the direction
  of entropy increase and then claim to explain why memories are of the past, unless
  it earns the reduction.

  - It must be consistent with time-reversal (or near-) invariance of the underlying
  microdynamics: insofar as the laws are symmetric, the arrow must arise from boundary
  conditions or asymmetric initial conditions, not from a lawlike bolt-on. But if
  a theory posits T-violating fundamental dynamics, it must show why that violation
  is relevant to ordinary heat flow. So requirement: locate asymmetry in laws vs boundary
  conditions honestly.

  - It must handle de facto irreversibility without contradiction with Loschmidt''s
  reversibility objection: every forward entropy-increasing trajectory has a time-reversed
  counterpart allowed by the microphysics, so a candidate must temper the "always
  increases" claim into "overwhelmingly likely increase given the initial macrostate."

  - It must handle Zermelo''s recurrence: a finite closed system with bounded phase
  space will have Poincaré recurrences; so strict monotonic increase is false; the
  theory must accommodate recurrences and their measure.

  - It must account for the asymmetry in a way that is not time-symmetric at the level
  of boundary conditions: a single low-entropy initial condition (Past Hypothesis)
  as opposed to a symmetric one; a theory must explain why we posit low-entropy past
  but not low-entropy future, or say it''s brute — and mark which is acceptable.

  - It must distinguish "entropy" in statistical mechanics (Boltzmann entropy vs Gibbs
  entropy) and not conflate it with ordinary "disorder": the theory must specify which
  notion it uses and why; e.g., explain why a cup of lukewarm coffee doesn''t spontaneously
  unmix, why gases expand.

  - It must get the mundane cases right: mixing, heat conduction, friction, gas expanding
  into vacuum, ice melting in warm room; and the non-mundane: Maxwell''s demon (records
  and erasure), Brownian motion, fluctuation theorem, small systems.

  - It must explain the observed co-direction of many arrows (thermodynamic, records,
  intervention, memory) or justify taking one as basic; the epistemic arrow — we know
  more about past states (records) than future states — must not be stipulated as
  the same thing as the thermodynamic arrow.

  - It must be wary of Boltzmann-brain problem / anthropic self-undermining: if the
  arrow is merely an anthropic fluctuation out of a generic high-entropy state, the
  most probable observers would be Boltzmann brains; a candidate must show why typical
  observers are like us. Maybe include as requirement or as a pressure.

  - It must address whether the cosmological arrow (expansion) is explanatory, independent,
  or irrelevant — a theory must not simply assert the two arrows align.

  - It must respect the asymmetry of intervention/causation? The causal arrow: causes
  precede effects. Many see this as derived or folk; the theory should say whether
  it takes causal asymmetry as primitive.


  Negotiable vs non-negotiable:

  - Non-negotiable: compatibility with the time-reversal invariance of the underlying
  dynamics (or a demonstrable, relevant T-violation); explains, not defines, the observed
  asymmetry; doesn''t assert strict monotonic increase in finite closed systems; handles
  Loschmidt/Zermelo; specifies boundary conditions; doesn''t confuse ordinary/thermodynamic
  entropy definitions; handles mundane cases.

  - Negotiable/camp-specific: whether the arrow is fundamental or emergent; whether
  the psychological arrow reduces to the thermodynamic one or is independent; whether
  the past hypothesis is acceptable as a brute fact or requires a dynamical explanation
  (e.g., inflationary or fluctuation cosmology, though don''t need details); whether
  the causal arrow is primitive; how much the cosmological arrow matters; whether
  we need an objective arrow at all or a perspectival/anthropic account.


