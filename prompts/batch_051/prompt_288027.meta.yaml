  Aumann''s Agreement Theorem: If two agents have the same priors, their posterior
  beliefs for a given event are common knowledge, and each uses Bayes'' rule based
  on private information partitions, then their posteriors are equal. Hence rational
  agents with common priors cannot agree to disagree. This requires common priors.


  Milgrom-Stokey No-Trade theorem: In a market with rational risk-averse agents and
  common priors, if it is common knowledge that all are rational and have common priors,
  then no speculative trade occurs when they receive asymmetric information. More
  precisely, if there is common knowledge of an allocation being Pareto-optimal? Actually:
  "no speculative trade" result: private information alone cannot generate trade when
  agents are rational with common priors; any trade that occurs must be for risk-sharing
  or liquidity, not informational speculation. If all agents are rational and common
  priors, then any proposed trade that is common knowledge would be rejected.


  No-trade is often seen as paradoxical: real markets trade on information. The resolution:
  trades occur because of asymmetric info + differences in endowments/risk + noise
  traders, but the theorem says that if the only motive is differing beliefs generated
  by private info, and common priors + rationality are common knowledge, then one
  party''s willingness to trade is itself information: the other party updates and
  no trade. Hedging/liquidity trades are not speculative, so they can happen.


  The Groucho Marx effect: "I wouldn''t want to belong to any club that would have
  me as a member" — in markets, "I wouldn''t buy from someone who wants to sell to
  me."


