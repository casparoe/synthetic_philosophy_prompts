  Let''s ensure the argument is genuinely hard and not accidentally flawed in an obvious
  way. Steps:


  1. Bounded rationality, following Simon, says agents satisfice: they set an aspiration
  level and take the first option that meets it, rather than maximizing expected utility
  over all options.

  2. But in any well-defined sequential search problem, the optimal strategy under
  expected utility maximization with search costs is exactly a stopping rule of this
  form: continue searching until a draw exceeds a reservation threshold.

  3. Any satisficing action can be redescribed as using the optimal reservation threshold
  for some set of beliefs about the value distribution and search costs.

  4. So satisficing is indistinguishable from constrained optimization (maximizing
  expected value net of search costs).

  5. So the very idea of an alternative to optimizing collapses: either satisficing
  is a special case of optimizing, or it''s just a behavioral description with no
  normative import.

  6. That cannot be what Simon meant, since his point was that real agents cannot
  perform even this embedded optimization (knowing distributions, computing thresholds).


