  ---

  A friend of mine has what she claims is a coherent line on which systems genuinely
  have beliefs, as opposed to ones where we just find it useful to take the intentional
  stance for prediction. She''s not doing the Dennett-as-if thing; she seems to care
  about whether there''s something it is like, or something close to it. Over the
  last few months I''ve been keeping a list of her verdicts:


  - Thermostat: no.

  - An image classifier with 99% accuracy on its test set: no.

  - A numerical weather model that predicted last week''s storm more accurately than
  the Met Office: no.

  - A dog: yes.

  - A macaque: yes.

  - A pure next-token language model (no RLHF, no tool use, no persistent goals):
  no.

  - A customer-service chatbot that''s been RLHF''d to say things like ''I believe
  the refund was processed'': no.


  This week''s case is a model-based RL agent that was trained in a little simulated
  environment. It learns a probabilistic causal model of its gridworld (where the
  food is, where predators tend to appear, which obstacles move), feeds that model
  into a planning algorithm, and picks multi-step actions to maximise expected reward.
  It can plan a route through a part of the environment it has never visited, using
  its learned model. It has no language, no self-model beyond an (x,y) location variable,
  and no way to report its beliefs. If I had to bet, it isn''t conscious.


  What would she say, and which rule is she actually running? The obvious candidate
  is something like ''uses a stored model of the world to plan,'' which would say
  yes. But there are other rules that fit her earlier verdicts just as well — probably
