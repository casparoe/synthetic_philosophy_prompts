  share all properties. Many philosophers treat "Leibniz''s law" as the indiscernibility
  of identicals; the identity of indiscernibles is the controversial converse. I should
  be precise: The principle of identity of indiscernibles says no two distinct things
  can be exactly alike in all respects; or if a and b share all properties, a = b.
  Black''s spheres are a putative counterexample: a universe containing nothing but
  two exactly similar spheres two miles apart. They appear to share all monadic/intrinsic
  qualities, and perhaps all relational properties except those involving identity
  (each is two miles from a sphere; both share that), so if they''re distinct, PII
  fails. Black argues they are distinct despite being indiscernible. The defender
  of PII must deny that the situation is genuinely possible, or deny that they share
  all properties (e.g., this sphere is here / that sphere there, or being two miles
  from the other sphere, or each has a different haecceity, but Black might say those
  are just identity-involving or question-begging).


  - In programming/data modeling: two objects can be reference-equal (same object
  identity) or value-equal (structurally equivalent, same fields). For example, in
  Java/Python, two distinct list objects [1,2,3] and [1,2,3]: `==` (value equality)
  may return true while `is` (reference identity) returns false. In databases, two
  rows can have identical attribute values yet be distinct rows (different primary
  keys); whether to treat them as duplicates is a modeling decision. Some languages
  (e.g., value types, immutable data classes) collapse identity into structural equality:
  if all fields equal, the values are the same; others (reference types) keep identity
  primitive.


