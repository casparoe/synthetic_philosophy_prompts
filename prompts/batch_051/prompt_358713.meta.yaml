  Essay idea:

  Most popular invocations of von Neumann in discussions of the brain reduce him to
  the claim that the brain is a digital computer in disguise, because neurons fire
  all-or-none spikes and the brain can be described by logic. I think this is a misreading.
  In his late, posthumously published reflections, his emphasis is different. He grants
  that at one level the nervous system operates with pulse trains that look digital;
  but he insists that the underlying processes are chemical and analog, and that the
  more fundamental contrast between natural and artificial automata concerns reliability
  and the logical organization of computation under noise. Artificial machines compute
  by keeping error rates extremely low at each elementary step and preserving a sharp
  distinction between signal states. The brain instead computes reliably with components
  that are individually noisy, slow, and cheap, by using massive parallelism and statistical
  redundancy. The philosophical lesson I want to draw is that von Neumann''s question
  is not ''is the brain digital or analog?'' but ''what kind of language, or logical
  structure, can support reliable computation when the elementary operations are not
  trustworthy?'' The interesting category is neither hardware nor software but what
  one might call a reliability architecture: the pattern of trade-offs among precision,
  parallelism, energy, and error correction that makes a physical system able to carry
  out meaningful transformations. If that is right, then the now-standard distinction
  between digital and analog may be less philosophically deep than a distinction between
  architectures that achieve reliability by eliminating noise at the source and architectures
  that achieve it by exploiting and correcting for noise statistically.


