  ---


  Hey, so I''m a backend engineer and I''ve been building a little toy app where you
  can ask historical figures what they think about modern stuff, and right now I''m
  stuck on money. Not my wheelhouse, I have zero formal philosophy training, so bare
  with me.


  The page is for George Berkeley, the Irish bishop from the 1700s. I know he''s mostly
  remembered for his metaphysics — everything is minds and ideas, matter isn''t real,
  that whole thing — but it turns out he also wrote this weird little book in the
  1730s called The Querist, which is basically a giant numbered list of questions
  about why Ireland was so poor. From what I can tell, his actual position on money
  was roughly this:


  - Money''s value comes from people accepting it as a circulating token for buying
  and selling stuff, not from the metal in the coins. He was pretty dismissive of
  the idea that gold and silver are automatically wealth.


  - A poor country can help itself by setting up a national bank that issues paper
  money backed by public credit (or land), because the real problem in Ireland was
  that there just wasn''t enough circulating cash.


  - Hoarding money, chasing luxury imports, and treating money as an end in itself
  are bad; money is supposed to keep productive activity moving.


  If I''ve got any of that wrong, say so and then keep going with the corrected version.
  But don''t waste half the answer on exegesis — I need predictions.


  So here''s what I want. Walk me through what you think Berkeley would have said
  about each of these modern financial things, assuming someone explained them to
  him patiently. For each one, give me (a) your best guess at his verdict in plain
  English, (b) which of his commitments is actually driving the verdict, and (c) a
  confidence level, and tell me one thing you''d need to know about him that could
  flip the answer. Where his old views underdetermine the modern case, just say so
  instead of pretending he''d have a crisp take.


  1. Bitcoin — a digital token with no issuer, a fixed supply, and a hard cap, that
  people mostly hold as an investment.


  2. A central bank digital currency, i.e. a CBDC — in effect, the national-bank paper-money
  idea, except it''s a liability of the central bank and lives on your phone.


  3. Fractional-reserve banking, where commercial banks create most of the money supply
  when they make loans, and the state doesn''t directly control most of the money.


  4. Quantitative easing after the 2008 crash, where a central bank buys government
