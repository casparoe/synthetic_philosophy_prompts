  Prompt draft:


  I''ve been arguing with a colleague about labor law and I keep noticing an asymmetry
  I can''t make sense of. In most developed economies, we treat it as a fundamental
  right for workers to combine and withhold their labor—to form a union, bargain collectively,
  and strike. We even praise strikes as a form of solidarity and self-respect. But
  when firms combine to set the price at which they buy labor—when employers in an
  industry agree on a wage scale or agree not to poach each other''s workers—we treat
  that as collusion, a kind of wage-fixing that antitrust law condemns and the public
  finds repugnant. Yet the underlying behavior looks structurally similar: a group
  of sellers of labor jointly refusing to sell below a given price, versus a group
  of buyers of labor jointly refusing to buy above a given price. Both are collective
  refusals to deal. Both distort the market. Both can raise the cost of living for
  third parties. So why is one a right and the other a violation?


  The asymmetry gets starker when you vary the cases. A union of already well-paid
  professionals—say, airline pilots—can lawfully extract higher pay by threatening
  to ground an airline, and we call that collective bargaining. A group of businesses
  agreeing not to bid up each other''s engineers would be illegal no-poach collusion.
  Is the difference just that workers are individuals and firms are corporations?
  That seems shaky, since a union is also a collective entity with power. Is it that
  labor is not a commodity? But that''s a slogan unless you can say what it means
  functionally. Is it that workers need countervailing power against employers? That''s
  an empirical claim about relative bargaining power, and it wouldn''t explain why
  the right survives when the workers are already powerful. Or is it ultimately about
  voice and workplace democracy—the idea that workers should have a say in the governance
  of the enterprise, not just sell their time—and if so, why does that principle stop
  at the plant gate and not extend to consumers or neighbors affected by the enterprise?


  I''d like you to either defend the asymmetry with a principle that survives these
  variations, or concede that one side of our practice is unjustified. If you defend
  it, defend it against the hardest case: should a union of highly paid, hard-to-replace
  workers be allowed to strike for higher pay when the main effect is to raise prices
  for people poorer than the workers themselves?


