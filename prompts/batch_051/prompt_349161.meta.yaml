  Prompt draft (Confucian):


  A friend who teaches ethics keeps pressing me with a pair of cases. In the first,
  a mother sits on the admissions committee of a selective school; she quietly ensures
  her less-qualified son is admitted over strangers. We call this nepotism and corruption.
  In the second, a mother is present when her child and a stranger''s child are both
  drowning; she saves her own first, without a second thought, and no one calls it
  corruption—indeed, someone who saved the stranger''s child first would strike many
  of us as monstrous. But both are cases of partiality toward one''s own. So what
  principle tells us that partiality is corruption at the admissions desk but a moral
  requirement in the water? Confucian role ethics seems to say the water case is the
  template for morality: obligations are first of all role-obligations, and treating
  your child as just one beneficiary among others is already a moral mistake. But
  if role-based partiality is proper as a general matter, why shouldn''t it be proper
  in hiring, grading, and public office? And if it isn''t proper there, what is the
  principle that keeps filial love from bleeding into nepotism?


  Maybe the answer is something like: role obligations have contexts and limits—being
  a good mother requires saving your child, but it doesn''t require giving him a job.
  But that just restates the problem unless you can say why the same role generates
  radically different requirements across contexts. Is it about scarcity? Fiduciary
  duty? The fact that an admissions committee member acts as an office-holder rather
  than a private person? If so, then the water case and the admissions case are asymmetrical
  because the second involves a public trust, not because partiality is wrong as such.
  But then consider the private employer who hires her nephew over a better-qualified
  stranger: it''s her own money, yet many of us still wince. Is that a remaining intuition
  you''d defend, or would you give it up? I want a single account that handles all
  three: the drowning mother, the admissions committee, and the private employer.


