  I''ve been taking a seminar on Confucian role ethics, and a set of cases from the
  reading has been troubling me. Here are the two that won''t separate. A mother is
  on a beach when her child and a stranger''s child are both caught in a current.
  She swims to her own child first; the stranger''s child drowns before help arrives.
  We do not merely excuse this—many of us would find it wrong had she saved the stranger''s
  child first and let her own die. Now the second case: the same mother chairs the
  admissions committee of a selective school. She quietly arranges for her own child,
  who ranks below the cutoff, to be admitted over a better-qualified stranger''s child.
  That, we say, is nepotism, corruption, a betrayal of a public trust.


  Both are forms of partiality toward one''s own. So what principle distinguishes
  the rescue on the beach from the decision at the admissions desk? The obvious answer
  is that the second involves a public office, not a private choice. But that doesn''t
  yet tell us why the content of the mother''s role differs so sharply in the two
  settings; and it leaves a third case dangling: a private employer who hires her
  own niece over a stranger with a better résumé. It is her firm and her money, yet
  many of us still wince.


  What makes this more than a puzzle about inconsistent intuitions is that Confucian
  role ethics seems to take the beach case as the template rather than the exception:
  persons are constituted by their relations, obligations are first of all role-obligations,
  and treating one''s child as merely one beneficiary among others is already a moral
  failure. If that is right, why doesn''t role-based partiality extend to hiring,
  grading, and admissions? If it does, are we prepared to accept the consequences?
  If it doesn''t, I would like to know the principle that keeps filial love from becoming
  nepotism—and whether it would also make the classmate who stays neutral between
  her friend and a stranger in a conflict count as a bad friend, while the judge who
  favors her friend count as a corrupt judge. I want a single account that handles
  all of these, or an argument for why our ordinary judgments simply don''t cohere.


