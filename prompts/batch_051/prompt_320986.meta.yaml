  On the physics side, consider the Rietdijk–Putnam argument for the block universe.
  In special relativity, there is no privileged frame, so there is no frame-independent
  simultaneity relation: two inertial observers passing through the same event slice
  spacetime into ''now'' differently. If one assumes that everything simultaneous-with-me-now
  is real and that reality cannot be frame-dependent, then events that lie in my future
  (from my frame) can nonetheless be located on another observer''s simultaneity slice,
  and so must already be real. The usual moral is that the whole four-dimensional
  manifold exists at once and the moving ''now'' is merely an observer-dependent index
  into it.


  On the computing side, this looks uncannily like the distinction between a pure
  functional program considered denotationally and the same program considered operationally.
  In a lazy language, the full expression tree is there from the start; evaluation
  does not create any part of it but merely forces thunks on demand. What counts as
  ''the current state of the computation'' — the set of thunks already forced and
  the one now being forced — depends on the reduction strategy and the demand pattern,
  much as the ''now'' slicing of spacetime depends on the observer''s frame. And in
  both cases there is a partial order that is invariant: the light cone / causal order
  on one side, and data dependencies on the other. Events with timelike separation
  have an absolute temporal order; subexpressions whose values depend on one another
  must be forced in the appropriate order. But spacelike-separated events, like independent
  subexpressions, can be ordered or simultaneous differently in different frames or
  strategies without changing the underlying object.


