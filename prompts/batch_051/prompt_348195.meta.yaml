  1. Conditional structure: A tells B that A will do X unless B does Y, where Y is
  a transfer of value from B to A (paradigmatically money).

  2. Liberty: X is an act A is legally at liberty to perform — for example, disclosing
  true, lawfully acquired information that B would rather keep private.

