  Argument embodying Bradley''s regress: The unity of the proposition problem: if
  a proposition (or a state of affairs) such as "a is F" is a complex of a and F,
  what unites them? If nothing unites them, then they are just a pair; if something
  (a relation R) unites them, then we need a further relation to unite R with a and
  F, and so on.


  We can turn into "proves too much": An argument that seems to show no relation can
  ever relate its relata, or that there are no structured propositions. Steps:

  (1) For a relation R to relate a and b, R must be connected to a and b.

  (2) Connection is itself a relation between R and a (and b).

  (3) So R relates a and b only if there is a connection relation C such that C relates
  R and a.

  (4) By the same reasoning, C must itself be connected to R and a by a further relation
  C′.

  (5) Therefore, for any relation to relate its relata there must be an infinite regress
  of connecting relations.

  (6) But an infinite regress of this sort is vicious (nothing in the chain ever completes
  the connection).

  (7) So no relation ever relates any relata, which is absurd.

  Conclude: something in premises/standards must go. Which step do you reject and
  what does rejecting cost (Bradley''s monism vs. brute non-relational tie vs. infinitary/holistic
