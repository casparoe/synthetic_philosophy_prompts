  cares about. I want the training to be built around the distinction between internal
  and external reasons as it is drawn in moral philosophy (the position associated
  with Bernard Williams): roughly, that a person has a reason to do something only
  if that reason can be reached by sound deliberation from what the person already
  cares about, and the contrasting view that some reasons apply to a person independently
  of his or her present motivations.


