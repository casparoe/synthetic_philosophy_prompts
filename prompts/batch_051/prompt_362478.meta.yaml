  Work: Amadeus. Let me plan the prompt.


  Elements:

  1. A context: "I''m putting together a course module / writing an essay / preparing
  a film-club discussion on what we owe the dead when we turn their lives into drama."
  Something like: "For a seminar I''m teaching on the ethics of historical fiction,
  I''m using Peter Shaffer''s play Amadeus and Milos Forman''s film version..."

  2. The work and the frame: The work takes as its dramatic engine the claim that
  Salieri, out of envy of Mozart''s God-given gift, destroyed him — e.g., sabotaging
  commissions, wearing the masked figure commissioning the Requiem, helping complete
  it... Actually the film has Salieri commissioning the Requiem disguised as the "gray
  figure" and then that is dramatized. But I don''t need plot specifics beyond common
  knowledge. Keep it general: "portrays Antonio Salieri as having schemed against
  and, in effect, brought about Mozart''s death; the story unfolds as the elderly
  Salieri''s confession to a priest."

  3. The philosophical lens: "what, if anything, do the living owe the real dead when
  they are made into characters? The historical Salieri was a real, respected composer
  and teacher; whatever the truth about the rivalry, the murder-plot is widely treated
  as invention." Also note that Mozart too is caricatured (childish, scatological)
  and Constanze Mozart (film portrays her in a possibly unflattering way). "Does the
  film wrong Salieri — and Mozart, and Constanze — and if so, what kind of wrong is
  it: an offense against their reputations, a failure of truth, a violation of something
  like counterfactual consent, or nothing at all because the dead no longer have interests?"

  4. The interesting tension: does the confession-frame and Salieri''s self-presentation
  save the work or double down? "The play undercuts Salieri-as-narrator by showing
  him embittered, self-justifying, and confessing to a priest who is plainly out of
  his depth" — does the film''s awareness of its own unreliability change the ethics?
  A work that says ''I am a distorting portrait by a jealous rival'' might be less
  of a lie than a straight docudrama; but if audiences take it as history, is the
  artist responsible for foreseeable misreading?

