  The MU-puzzle specifics: Rules: 1. If a string ends in I, append U (MI -> MIU).
  2. Mx -> Mxx (MI -> MII). 3. Replace III with U (MIII -> MU). 4. UU -> nothing (remove).
  Starting with MI, can you get MU? The invariant: the number of I''s is 2^n or...
  actually count the I''s; rule 1 and 4 don''t change count, rule 2 doubles, rule
  3 reduces by 3. Starting with 1 I (MI). You can get 2^n mod 3, never 0 because powers
  of 2 are 1,2,1,2 mod 3, never 0. To reach MU (0 I''s) would require count divisible
  by 3 at time of III->U. So impossible. To see this you must leave the system''s
  chase (generating strings) and reason about the system (metamathematics). Hofstadter
  calls this "jumping out of the system" — and relates to Gödel.


