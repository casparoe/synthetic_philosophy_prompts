  I am a novelist, writing a long essay for a literary-philosophical magazine on the
  question of whether novelty is a component of well-being, and I want to read Flaubert''s
  Madame Bovary through that question. I would like a philosophical reading of the
  novel rather than a general literary analysis.


  Here is the shape of the problem as I see it. Philosophers of well-being often treat
  goods such as pleasure and desire-satisfaction as the constituents of a good life,
  and treat variety, novelty and adventure as at best instrumental: they refresh attention,
  prevent hedonic adaptation, or supply opportunities for pleasure. Against this,
  I want to test the thought that novelty matters in its own right — that a life can
  be made worse by sameness even when the repeated experiences remain pleasant, and
  that the fear of a boring life is tracking something real rather than a merely aesthetic
  preference.


  I have been working with a distinction of my own. Felt novelty is the texture of
  an experience: the shock or freshness of a new place, a new lover, a new purchase.
  Trajectory novelty is the sense that one''s life is moving toward something new
  rather than cycling through the same season. Emma Bovary seems to me to be rich
  in felt novelty — the ball at La Vaubyessard, the beginnings of the affairs with
  Rodolphe and with Léon, each new acquisition — but starved of trajectory novelty,
  and the felt novelty repeatedly decays back into provincial sameness. My question
  is how Flaubert''s irony bears on this distinction. Does the novel treat Emma''s
  craving for novelty as a genuine response to a real deficit — a life genuinely impoverished
  in some good — or as an appetite manufactured by the sentimental novels of her youth
  and by the images of Paris and luxury she consumes, so that the craving is itself
  part of the disease? And what, if anything, does the novel contribute to the well-being
  debate that the arguments alone cannot: perhaps something about how the desire for
  novelty is formed by stories one has absorbed about what an intense life looks like,
  or about why felt novelty without trajectory novelty fails?


  Please give me a reading that takes both the novel and the philosophy seriously,
  that points to particular episodes as evidence, that is willing to say where the
  novel resists a clean verdict on whether novelty is a constituent of well-being,
  and that ends by naming what the novel adds to the philosophical discussion that
  a paper would not. Do not quote; paraphrase scenes from memory of the plot. Write
  in British English. End the response with a one-sentence summary of your reading
  as the final line, beginning "Summary:".


