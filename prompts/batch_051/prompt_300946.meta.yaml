  I''m a novelist, and I''m writing an essay on Flaubert''s Madame Bovary for a mixed
  literary-philosophical magazine. I want to read the novel through a particular philosophical
  question: whether novelty is a component of well-being, rather than merely an instrument
  for obtaining pleasure or satisfying desires. My working distinction is between
  the felt texture of a life (the pleasurable newness of an experience) and the trajectory
  of a life (the sense that things are moving somewhere rather than repeating). Emma
  Bovary''s restlessness seems to me to live exactly in the gap between those: she
  has moments of intense felt novelty — the ball at Vaubyessard, the early stage of
  each affair — but the trajectory of her life is static, and the novelty always decays
  into the same provincial sameness. I can''t decide whether the novel is diagnosing
  her as someone who has mistaken a real component of well-being for the whole of
  it, or as someone who has been taught by romantic novels and consumer culture to
  want novelty she doesn''t actually benefit from. Read the novel through this lens
  for me: where does Flaubert treat Emma''s craving for novelty as tracking something
  genuinely missing from her life, and where does he treat it as an appetite that
  novel-reading and the fantasies of Paris and luxury have implanted? Does the novel,
  taken as a whole, contribute anything to the philosophical debate that argument
  alone doesn''t — for example, about whether the fear of a boring life is a rational
  response to a genuinely impoverished environment or a self-defeating script? I want
  a reading that takes both the novel and the philosophical question seriously, and
  that is willing to say where the novel resists a clean verdict rather than forcing
  it to illustrate one side.


  Please write the response in British English. End with a one-sentence summary of
  your reading, as the final line, beginning "Summary:".


