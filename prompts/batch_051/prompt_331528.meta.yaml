  Let me refine the formal content.


  In diagnostic testing: two tests T1, T2 for disease H. Their results are conditionally
  independent given H (or given disease status) if P(T1+,T2+|H)=P(T1+|H)P(T2+|H) and
  same for ¬H. Under conditional independence, the likelihood ratio for H vs ¬H from
  the joint result multiplies: LR_joint = LR1 × LR2. This multiplicative property
  is the "agreement multiplies evidence" claim. For witnesses: each witness''s testimony
  E_i has a certain probability given guilt (H) vs innocence (¬H); if conditionally
  independent given H (and ¬H), joint testimony updates odds multiplicatively. But
  the analogy breaks:

  1. Conditional vs unconditional independence: two tests can be unconditionally correlated
  (because both correlate with disease prevalence) but conditionally independent given
  disease status; or vice versa. The witnesses analogy typically conflates "not colluding"
  (absence of a direct causal link between testimonies) with conditional independence.
  Not colluding is neither necessary nor sufficient for conditional independence:
  witnesses could be uncolluded but share a common cause (both saw the same misleading
  news report, same genre of crime, racial bias), yielding correlated testimony conditional
  on innocence; conversely, conditionally independent evidence might still be correlated
  through a common cause that doesn''t matter...

  2. Common cause / shared background: tests share the same instrument calibration,
  same lab, same patient physiology — correlated errors given no disease. Witnesses
  share culture, media, expectations. The presumption of independence given absence
  of known collusion ignores common-cause correlation.

  3. Selection effects: we only hear about agreeing witnesses (e.g., prosecutor brings
  witnesses who agree; contradictory witnesses may not testify; the "testimonies"
  may be influenced by the same police interviews). Independence must be assessed
  on the full joint distribution, not the observed agreement; agreement itself is
  selected.

  4. Calibration and known characteristics: diagnostic tests have measured sensitivity/specificity;
  witnesses'' reliability is unknown and context-dependent; the formal LR multiplication
  requires known conditional probabilities, which the legal case lacks. The analogy
  imports the "known test" feature.

  5. Base rates and multiple hypotheses: in medicine, H is a well-defined disease;
  in law, the hypothesis space is open-ended.

  6. Redundancy ceiling: even conditionally independent tests, if each weak, multiplying
  small LRs; and if prior is low, might still not reach threshold; certainty illusion.


