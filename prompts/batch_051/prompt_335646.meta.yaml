  Theories of humour:

  - Superiority: laughter arises from feeling superior to others, from others'' misfortunes
  or vices (Plato, Aristotle, Hobbes).

  - Incongruity: humor arises from perception of incongruity, a mismatch between expectation
  and actual (Kant, Schopenhauer).

  - Relief: laughter releases pent-up nervous energy / psychic tension (Spencer, Freud).

  - Benign violation: humor occurs when something is simultaneously perceived as a
  violation (wrong/threatening/abnormal) and benign (safe/acceptable/not actually
  threatening) (McGraw & Warren).


