  superiority theory ranks it as not funny at all (or vice versa), and benign violation
  theory gives a mixed or intermediate verdict. Constraints: the humor has to be plausible
  enough that a normal audience might genuinely laugh; no professionals (not a comedy
  club); the funniness must fall out of the theories rather than being stipulated."


