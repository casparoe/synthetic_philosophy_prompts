  Let me draft full prompt:


  ---


  I have been thinking about complicity — the way people can be mixed up in someone
  else''s wrongdoing — and I keep running into the slogan that a person can be complicit
  "without causing anything." I want to test a line of argument I''ve been developing
  against that idea. It isn''t from any particular reading; it''s my attempt to make
  the causation requirement precise.


  Here is the argument:


  (1) If A is complicit in B''s wrongdoing, then A participates in B''s wrong; a bystander
  who merely knows about the wrong is not complicit.

  (2) Participation in an event is a causal notion: A participates in B''s wrong only
  if A''s act helps bring the wrong about, where this means that had A not acted,
  the wrong would not have occurred, or would have occurred later, in a materially
  different way, or only with materially greater difficulty. (This is a counterfactual
  test, I know.)

  (3) Every alleged example of complicity without causation is either (i) a case that
  actually passes that counterfactual test once the act is described at the right
  level — the lookout really does make the burglary safer, the accountant''s signature
  really does make the fraud easier — or (ii) a case of mere approval, acquiescence,
  enjoyment, or profit-taking, where the wrong would have gone exactly the same way
  without the person.

  (4) Mere approval, acquiescence, enjoyment, and profit-taking are not participation:
  they are reactions to or extractions from the wrong, not elements in its production.

  (5) Therefore, complicity always involves causal contribution, and "participation
  in wrongdoing without causing it" is a misdescription.


  The hard case for my argument is the extra member of a firing squad whose shot would
  make no difference, or the second lookout in a deserted street. I am torn between...
  etc.


  Please assess: Is the argument valid? If not, identify the exact step that fails
  and under what reading of the key term; if it is valid, say how it should handle
  the firing-squad case and what the argument leaves open about overdetermined contributions.


  Format: sections:

