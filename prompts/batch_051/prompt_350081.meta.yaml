  or the assumption that all frames'' presents are equally real (which is itself eternalism).
  Actually the Rietdijk–Putnam argument leverages special relativity: if two observers
  moving relative to each other disagree about simultaneity, and one can claim future
  events are already real, then... The flaw: special relativity defines simultaneity
  relative to a frame; "real for observer A" doesn''t establish frame-independent
  existence. But the argument may be valid if you accept the "reality is frame-invariant"
  premise. Interesting: the argument can be reconstructed: (1) SR implies that for
  any two spacelike-separated events, there is a frame in which they are simultaneous.
  (2) If two events are simultaneous in some frame, and one is real, then the other
  is real (or at least both are real). (3) Reality (existence) must not be frame-relative;
  if an event is real in any frame it is real simpliciter. (4) So all events in the
  future cone... actually the Putnam version shows that a future event is "real now"
  because it is simultaneous with a present Earth event in some frame. The premises:
  for a future event E (relative to me now), there is an observer at me-now moving
  at high velocity for whom E is simultaneous with me-now. Since for that observer
  E is present, and reality is objective/frame-independent, E is present/real now.
  So the future is already real. Then likewise, the past is real. Therefore all times
  coexist: block universe. The crucial step is the premise "if an event is present
  for any observer, it is real" and "reality simpliciter" — one might question whether
  being present in a frame implies existence, or whether transitivity across frames
  can combine with a frame-independent reality to give eternalism. The logic might
  actually be valid if all premises accepted; so the right answer might be "the argument
  is valid given its assumptions, and the questionable step is the identification
  of ''present for some frame'' with ''real'' — but if you accept that premise, the
  conclusion follows." The prompt could ask exactly which step does the work and whether
