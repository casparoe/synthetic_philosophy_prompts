  "Lately I''ve been thinking about a rule I catch myself using in arguments, and
  about whether it is earned by the mathematics or just by impatience. When two careful
  people who start from different background assumptions are exposed to a long run
  of the same evidence, the Bayesian convergence results are often glossed as showing
  that their priors should wash out: with enough shared data, their posterior distributions
  should come to agree. I find I have internalized this as a social-epistemic policy.
  If someone has seen the same studies, read the same public record, and still lands
  far from me on a factual question, I treat that as strong evidence that at least
  one of us—usually, I assume, the other person—has failed to update, or is weighting
  the evidence by a prior that is not just different but defective. I don''t apply
  the same suspicion to my own starting point."


