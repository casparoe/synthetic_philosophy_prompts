  The domain climate models with ensemble robustness: a natural argument:


  (1) Climate models are the best available representations of the physical processes
  governing the climate system.

  (2) An ensemble of independently developed climate models produces a spread of projections
  for, say, equilibrium climate sensitivity or regional precipitation change.

  (3) When the models in the ensemble agree on a robust qualitative result despite
  differences in their parameterizations and resolutions, that agreement is evidence
  that the result is not an artifact of any particular model''s choices.

  (4) Therefore robustness across the ensemble warrants high confidence in that qualitative
  result.

  (5) The ensemble spread is a reasonable estimate of the true uncertainty range for
  quantitative projections.

  (6) Therefore decision-makers should treat the ensemble range as the decision-relevant
  uncertainty and plan for the middle-to-upper part of it.


  Where does this fail? There are known critiques: models are not independent (shared
  code, shared training/observations, shared human biases); agreement can be due to
  common structural errors, not robustness; the ensemble was not designed as a random
  sample of possible models ("ensemble of opportunity"); spread underestimates uncertainty
  because unknown unknowns/structural uncertainty are not sampled; confirmation across
  models that all get the same data and share parameterization schemes doesn''t provide
  independent confirmation. So step 3 or 4 fails because independence is absent; step
  5 fails for same reason plus the "ensemble of opportunity not a probability sample."


