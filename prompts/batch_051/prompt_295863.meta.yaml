  I am a PhD student in climate science, and I have been trying to pin down exactly
  what multi-model ensemble spread does and does not entitle us to say. Below is an
  argument that I have heard in a lab meeting, and I find it too smooth, but I cannot
  identify the precise step at which it goes wrong—if it goes wrong at all. I would
  like you to evaluate it step by step.


  (1) Each model in a multi-model ensemble is a physically plausible representation
  of the climate system, in the sense that it reproduces the observed 20th-century
  global mean temperature record within the range of observational uncertainty.

  (2) The models in such an ensemble produce a range of values for a target quantity—for
  example, the equilibrium climate sensitivity, the long-term global warming expected
  after a doubling of CO2.

  (3) We have no principled basis for trusting any one of these models more than another
  for that target quantity.

  (4) If we have no principled basis for trusting one model more than another, then
  our uncertainty about the target quantity should be represented by treating the
  models'' outputs as equally weighted draws from the relevant possibility space.

  (5) Therefore, the spread of the ensemble output should be treated as a defensible
  estimate of our uncertainty about the target quantity.

  (6) Therefore, decision-makers should treat the ensemble distribution—its central
  tendency and its spread—as the decision-relevant uncertainty, e.g., by planning
  around the interval between the ensemble''s low and high estimates.


  I suspect the trouble lies with premise (4), but I cannot tell whether the correct
  response is to reject the principle of indifference it embodies, to insist that
  models are not independent enough for it, or to accept the argument''s conclusion
  in weakened form. Can you:


