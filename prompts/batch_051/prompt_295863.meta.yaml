  I am a PhD student in climate science, and I have been trying to say exactly what
  a multi-model ensemble does and does not entitle us to claim about the future. The
  following argument has been going around my group, and it strikes me as too smooth,
  but I cannot pin down the step where it breaks—if it breaks at all. I would like
  you to treat it as a formal argument: say whether it is valid as stated, and if
  it is not, identify the first failing step and explain how to amend it (or why no
  amendment saves the conclusion).


  (1) Each model in a multi-model ensemble is a physically plausible representation
  of the climate system, in the sense that it reproduces the observed 20th-century
  global-mean temperature record within the range of observational uncertainty.

  (2) For a target quantity such as equilibrium climate sensitivity—the steady-state
  warming from a doubling of CO2—the models in the ensemble produce a distribution
  of values.

  (3) We have no principled, target-specific reason to trust any one of these models
  more than any other.

  (4) If we have no principled reason to trust one model more than another, then our
  uncertainty about the target quantity is properly represented by treating the models''
  outputs as equally weighted samples from the space of plausible climates.

  (5) Therefore, the spread of the ensemble''s outputs is a defensible estimate of
  our uncertainty about the target quantity.

  (6) Therefore, decision-makers should treat the ensemble distribution—its central
  tendency and its spread—as the decision-relevant uncertainty, for example by planning
  around the interval between the ensemble''s low and high values.


  My own suspicion is that the trouble is somewhere around (3)–(4), but I cannot tell
  whether (3) is just false for known reasons, whether (4) is an illicit move from
  "we cannot rank the models" to "we must weight them equally," or whether the argument
  is fine as far as it goes and is only misused downstream. Please tell me which step
  fails (or whether none does), what the correct version of that step would be, and
  what the nearest true conclusion is—in particular, what conditions an ensemble would
  have to satisfy for the move from no-known-ranking to equal weighting to be sound.


