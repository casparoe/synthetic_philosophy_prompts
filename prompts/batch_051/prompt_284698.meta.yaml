  Lucas-Penrose argument:

  - Gödel''s second incompleteness theorem: for any consistent, sufficiently strong
  formal system F, F cannot prove its own consistency Con(F).

  - Lucas: given any formal system F that purports to capture human arithmetical reasoning,
  provided we can see F is consistent, we can see Con(F) is true while F cannot prove
  it. Therefore human reason exceeds any formal system; mechanism is false.

  - Penrose: uses Gödel''s theorem plus the claim that human mathematical insight
  is sound to argue that human understanding is non-computable (Shadows of the Mind).

  - Counterarguments: Benacerraf "Gödel''s theorem and mechanism" — the gap argument:
  to know that the machine''s output is true, the human must know the machine is consistent,
  but mechanism doesn''t assert that; knowability of Con(F) requires proof that F
  captures the mind''s algorithms, which is itself non-mechanical? Actually Benacerraf:
  the mechanist cannot be given; the human can''t identify its own formal system.
  Putnam: consistency may be inductively supported but not mathematically established.
  Feferman: issues of formalizing consistency; the human might not know Con(F) in
  the required sense. Also arguments that the human mind might be an inconsistent
  formal system (Lucas admits?).


  Now, a belief set like:

