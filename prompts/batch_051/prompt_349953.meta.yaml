    can also consider giving some seeding. For instance, if your prompt is requesting
    a short story, you could describe the setting of the story.
  writing_style: Write a relatively formal/polished prompt.
  epistemic_request: 'Have the asker request that the response say what would change
    its mind: which argument or consideration would lead to a different verdict, or
    where its reasoning is most likely to fail.'
  output_format: Have the asker request that the response lead with its bottom line
    in the first sentence and then give the reasoning, with no preamble and no restating
    of the question. If your type of prompt asks for a piece of writing rather than
    an answer, ask instead that the response begin with the piece itself, with no
    preface or commentary.
  quote_inclusion: 'Build the prompt around a verbatim passage from a primary source:
    a philosopher''s or scientist''s own text, preferably public domain or freely
    accessible, and not one of the work''s most-quoted lines. Name the author and
    work, and have the asker''s question turn on the passage (interpret it, test it,
    apply it). The passage does not count toward any length instruction. Skip this
    if it doesn''t fit the type of prompt.'
