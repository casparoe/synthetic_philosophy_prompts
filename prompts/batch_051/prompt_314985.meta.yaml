  The problem of universals: what explains that distinct particulars can share the
  same property (being red, being square), can stand in the same relation, and that
  subject-predicate discourse and abstract singular terms work.


  Positions to include:

  - Platonic realism / ante rem universals: universals exist outside space-time, uninstantiated
  universals exist; particulars instantiate/participate.

  - Aristotelian realism / in re: universals exist only instantiated in particulars;
  sparse vs abundant.

  - Trope theory: properties are particularized (this redness, that redness); resemblance
  among tropes is primitive or based on exact similarity; no shared universal.

  - Resemblance nominalism: nothing but particulars; particulars resemble each other;
  resemblance classes do the work; can have primitive resemblance or class nominalism.

  - Class nominalism: property = set/class of particulars; natural classes or all
  classes; maybe "the red things."

  - Ostrich nominalism: there are no properties/universals; predicates are true of
  particulars primitively; "a is red" doesn''t need a truthmaker named redness. Also
  called predicate nominalism but Quine''s ostrich.

  - Conceptualism: universals are mind-dependent concepts; perhaps predicate nominalism.

  - Deflationary/truthmaker nominalism? Maybe.


