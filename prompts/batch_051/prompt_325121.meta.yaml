  I’m rereading Foundation with a few mates from a book club and we kept coming back
  to the same argument. The book presents Hari Seldon’s psychohistory as a genuine
  science of long-run human history: if you have enough people and they don’t know
  the predictions, you can plot the fall of an empire and the rise of its successor.
  That already sounds quite close to what cliodynamics claims, at least in its softer
  versions—Turchin’s secular cycles, structural-demographic pressures, elite overproduction
  and all that. But there’s a difference: Asimov seems to need the subjects to be
  ignorant of the prediction for the science to work, whereas real macrohistory, if
  it works at all, has to keep working even when people have read the paper. I''d
  like you to read the novel through that lens and say where the science in the story
  is genuinely cliodynamic, and where its actually just Laplace-style determinism
  in disguise.


