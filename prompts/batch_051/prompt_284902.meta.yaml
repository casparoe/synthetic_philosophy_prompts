  I know Davidson''s position: "What Metaphors Mean" (1978) argues that metaphors
  have no special cognitive content beyond their literal meaning; a metaphor''s effect
  is causal (like a bump on the head) and it makes us notice things, but there is
  no propositional "metaphorical meaning." Objections to Davidson:

  1. Dead metaphors/standardized metaphors: if metaphors only have literal meaning,
  how do they become conventionalized with new meanings? Davidson has a story: a metaphor
  that catches on becomes a new literal meaning; the process is causal, not semantic.
  But objection: if there''s no metaphoric meaning at the moment, how does it acquire
  the new literal meaning? Davidson answers by brute causal history.

  2. The "we can paraphrase approximately" worry: we do paraphrase metaphors, and
  some content seems to survive; but Davidson says paraphrase fails, only the literal
  content is preserved and the metaphor''s point is lost.

  3. The objection that metaphors figure in reasoning and inference, embedding in
  propositional attitudes: e.g., "her marriage was a prison" can be believed, denied,
  reasoned with; if no metaphoric content, can''t explain.

  4. Conceptual metaphor theory objection: systematic conceptual mappings show metaphor
  structures thought, not just language, and carries inferential structure (Lakoff
  & Johnson). So Davidson''s denial of metaphorical meaning is false.

