  deceiver would have to know the truth and hide it from the deceived who is the same
  person. Sartre rejects the Freudian censor (a partitioned unconscious) because the
  censor would itself have to know what to repress, regressing the problem. His solution:
  consciousness is not what it is (it is what it is not, and is not what it is); a
