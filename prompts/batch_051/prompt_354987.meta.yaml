  would not have occurred (counterfactual dependence), or chains of it. Famous problems:
  preemption (early/late), overdetermination, effects of a common cause, etc.


  Interventionist theory (Woodward): C causes E iff there is some possible intervention
  on C that changes E (or probability of E), holding fixed other variables; more precisely,
  if under some intervention setting C to a different value, E changes. It handles
  overdetermination via interventions on one variable with others at actual values.


