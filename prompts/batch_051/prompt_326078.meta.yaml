  ---


  For the final session of my graduate seminar on rationality, we have been working
  through the structure of money pumps, with particular attention to the diachronic
  case. The standard synchronic version is familiar enough: if someone''s pairwise
  preferences are intransitive — they prefer A to B, B to C, and C to A — then a trader
  can offer, for a small fee at each step, to take B for A, then C for B, then A for
  C, at every step giving the person the thing they prefer, and ending where they
  started but poorer. What interests us is the temporal variant, where there is no
  single inconsistent preference ranking; instead the agent''s valuations are stable
  enough at each moment for them to sincerely accept the trade on offer, but the very
  act of trading (or the passage of time, or the change of perspective from prospective
  to retrospective evaluation) shifts what they value next. Each choice looks locally
  rational, and the cycle is visible only across time.


  Please write a villanelle from the point of view of such an agent being led around
  the cycle. The two refrains should be the two recurring thoughts the agent uses
  to justify the exchanges — one for moving along the cycle, one for moving back —
  so that the villanelle''s alternation and final convergence enact the structure
  of the pump itself. In the last two lines, when the refrains finally meet, the poem
  should let the reader see that the agent has returned to the original holding with
  nothing permanent gained except the accumulated fees. The poem should be precise
  enough that someone who knows the theory recognizes exactly which pairwise trade
  each tercet is performing and why the form keeps reasserting itself; but it should
  also stand as a good poem for someone who has never heard of a money pump.


