  Potential final:


  "Over the past year I''ve been trying to dissolve the bootstrapping problem, and
  I''ve arrived at a distinction that I think does real work. I''d like an honest
  assessment of it.


  I call the distinction tracer use versus background use of a cognitive source. A
  source is used in background mode when its deliverances are simply accepted in order
  to answer an object-level question: I look at the wall and form the belief that
  it is red. A source is used in tracer mode when its deliverances are treated as
  data about the source''s own reliability: I notice that my visual experience represented
  the wall as red and that the wall is red, and I take this as evidence that vision
  is reliable. My central claim is that tracer mode is epistemically parasitic on
  background mode. More precisely: no agent can obtain justification for believing
  that a source is reliable solely by accumulating coincidences between the source''s
  deliverances and the world, because assembling such a record already requires the
  agent to use the source in background mode to identify what the world is like; the
  inference from ''vision said p and p'' to ''vision is reliable'' is therefore never
  neutral evidence, but a background use of vision dressed up as a metasource.


  The bootstrapping problem, on my view, is exactly this disguise. The bootstrapper
  treats a sequence of background successes as if they were generated independently
  of the source being evaluated. The distinction would explain why the inference is
  vicious: it converts background deliverances into tracer data without a license
  to do so. What would the license be? I think unaffected background failures would
  have to be detectable in background mode—if vision were unreliable, the agent would
  still have to be able to notice some conflict with the world through vision itself,
  which of course the agent cannot do if the source is globally unreliable. Still,
  I worry the distinction collapses: maybe every tracer use is just background use
  with a different question in view, and maybe some background uses, such as using
  perception to settle the color of the wall, already smuggle in the reliability claim.


