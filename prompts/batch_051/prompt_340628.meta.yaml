  "I''ve spent the last year developing a distinction that I think dissolves the bootstrapping
  problem, and I''d like an honest assessment before I invest more in it. I call the
  two sides ''tracer'' and ''background'' uses of a cognitive source.


  A source is used as a tracer when its output is treated as evidence for a claim
  about the source itself—as when I take a series of visual experiences of red walls
  as evidence that my vision is reliable. A source is used as background when its
  output is taken for granted in order to answer some other question—as when I simply
  look at the wall and conclude that it is red. My claim: tracer uses are never sufficient
  by themselves to justify claims about the reliability of a source, but background
  uses can legitimately yield knowledge even in the absence of independent evidence
  that the source is reliable; the bootstrapping problem arises because we flip from
  background to tracer use mid-inference, and then treat the accumulated background
  outputs as if they had been tracer data all along.


  So my principle: a subject may not convert background use into tracer use unless
  she already has independent grounds for thinking the source is at least minimally
  reliable. But this leads me to a puzzle: some sources seem to demand exactly such
  a conversion—I can''t do astronomy without treating my telescope plus my eyes as
  background, yet I can also systematically test my telescope against itself... I
  think the distinction still holds if we add a ''calibration asymmetry'' clause,
  roughly that a source can be tested against its own past outputs only when failures
  would be detectable by the source itself in its background mode.


