  a mechanism, I stop the discussion and require them to state that mechanism as a
  specific sequence of conditions and events: what triggers it, what propagates it,
  and what would interrupt it. If they cannot give me such a sequence in a few minutes,
  I treat the sameness claim as noise and vote to keep the clusters separate.


