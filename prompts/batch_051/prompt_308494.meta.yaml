  people lump together events that merely look alike. But I have begun to suspect
  that it encodes one narrow picture of what a mechanism is, and that I may be using
  a demand for detail as a shield against comparisons that are correct at a higher
  level of description. Two infection clusters might involve different organisms,
  different wards, and different individual errors, and yet an experienced clinician
  might be right that they are, in an important sense, the same kind of breakdown
