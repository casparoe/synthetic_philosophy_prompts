  ---


  I am the registrar at a mid-sized encyclopedic museum that has been working through
  a queue of restitution claims for objects acquired during the colonial period, and
  I have hit an interpretive problem with our own collections policy. The clause in
  question was adopted in 2003 and has not been revised since. It reads:


  "6.1(d) The Museum shall not acquire or retain title to any object whose acquisition
  involved theft, looting, or removal under duress. Where there is credible evidence
  that an object was removed from its country of origin under conditions of colonial
  occupation, armed conflict, or political coercion, the Museum bears the burden of
  establishing that the removal and subsequent transfers were consensual; absent such
  a showing, the Museum shall transfer the object to an appropriate custodian."


  We are now in a situation the 2003 drafters did not anticipate. Under a negotiated
  agreement, a Benin plaque in our collection will physically return to Nigeria in
  six months. In 2016 we commissioned a high-resolution 3D scan of the plaque. The
  raw scan data, the cleaned mesh, and AR viewer assets sit on our servers; our licensing
  arm sells 3D-printed replicas, and the digital team now wants to keep licensing
  the files after the physical object departs and has floated issuing an NFT derived
  from the scan. The Nigerian representatives argue that retaining and profiting from
