  ---


  For a reading group I belong to, I have been asked to write down my working view
  on how much rule-following a society should demand, so that the others can test
  whether it is internally consistent. The group covers cultural psychology and social
  philosophy, so it is fine to take tight-versus-loose cultures as the frame. I have
  written the following commitments, all of which I find myself wanting to hold. I
  am not sure they are compatible, and I am honestly not sure where the strain lies.


  1. The moral/conventional distinction is real. Some rules are such that violating
  them deserves moral blame; others are such that violating them deserves only mild
  social correction. Most everyday social norms — queue manners, forms of address,
  punctuality, dress — are of the second kind.


  2. Tightness and looseness form a genuine spectrum of social norms. Where a society
  sits on it is mostly a response to the ecological and historical threats it has
  faced. The same population, placed under different levels of threat, would end up
  somewhere different; a society''s position on the spectrum therefore says little
  about the moral character of its members.


  3. Tightness and looseness are a true trade-off rather than a hierarchy. Tightness
  buys coordination, predictability, and social order; looseness buys creativity,
  tolerance of deviance, and openness to change. Neither pole dominates the other
  on the whole.


  4. From (2) and (3) I draw the further conclusion that tight and loose cultures
  are different equilibria rather than better or worse ones. I want to resist the
  liberal reflex that treats looser cultures as automatically more freedom-respecting
  and therefore more justified.


  5. Even so, people have a right to be eccentric. The fact that others find a person''s
  difference uncomfortable, or that it would be easier to coordinate if everyone were
  more alike, is not by itself a good enough reason to pressure that person into conforming
  to a convention.


  6. A community may use informal sanctions — including shaming, coldness, and pointed
  exclusion — to uphold its conventions, provided that membership in the community
  is voluntary and exit is a live option for the person sanctioned.


  7. When visiting a culture, one should follow its local conventions even when those
  conventions strike one as pointless, so long as the conventions are not independently
  unjust.


  [then the ask]

