  I am pulled in two directions about whether it can be right to care less about a
  good merely because it lies further in the future—what is usually called pure time
  preference. On reflection, I am attracted to temporal neutrality. Discounting a
  future benefit because it is uncertain, because a dollar now could be invested and
  grow, or because the would-be recipient may not exist is not pure time preference
  and is not my target. Temporal neutrality says that after those factors are set
  aside, the bare position of a good in time—earlier rather than later—gives no reason
  to weight it differently. The principle associated with Sidgwick, that the mere
  difference of earlier and later is not a reasonable ground for caring more about
  the earlier consciousness, strikes me as the right default. The standard consistency
  argument points the same way: only constant exponential discounting avoids predictable
  preference reversals, and it is hard to see what could justify any particular positive
  rate rather than zero once uncertainty has been removed. Impartiality across generations—of
  the kind any broadly utilitarian or sufficientarian view seems to require—presses
  in the same direction.


  But I also have a firm intuition that will not yield. I care considerably more about
  a painful migraine tomorrow than about an equally severe, equally certain migraine
  thirty years from now, and I would not be indifferent if forced to schedule one
  of them. This does not feel like a mere error of arithmetic or a failure to compound
  probabilities; it feels like a permissible way for a temporally extended creature
  to be specially related to its present and near-future stages. At the social scale,
  a zero rate of pure time preference seems to let the interests of enormous numbers
