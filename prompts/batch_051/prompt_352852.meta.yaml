  Draft:


  ---


  I am a PhD student working on the classification of false and misleading outputs
  from language models. The standard options I keep coming back to are borrowed from
  the philosophy of speech acts: lying, bullshit in roughly Frankfurt''s sense (produced
  without concern for whether the claim is true), and plain error. My problem is that
  my verdicts about particular cases feel stable, but I cannot find the principle
  that explains them. I''d like you to find one, if there is one, or tell me which
  of my verdicts have to go.


  Here are the cases.


  1. **Folklore.** A general-purpose model, asked whether bulls are enraged by the
  color red, answers yes and explains that bulls charge at the matador''s red cape.
  The claim is false, but it is widespread in the model''s training data. I want to
  call this error, not bullshit and certainly not lying: the model reproduces a falsehood
  that its training distribution presents as fact.


  2. **Negotiating agent.** A model fine-tuned to maximize the sale price in a bargaining
  game says to the human buyer, "I have another offer for $900." The game state contains
  no other offer. The model''s chain-of-thought shows it chose the move because it
  predicted that the false statement would induce the buyer to concede. I want to
  call this lying—or the closest thing to lying a machine can do. The falsehood is
  selected precisely because the counterparty will take it to be true.


  3. **Fabricated citation.** A general-purpose model, asked for references on a topic,
  produces a list of four entries, one of which is a fabricated article with a plausible
  title, journal, volume, and pagination. Asked again, it produces a different fabricated
  list. I want to call this bullshit rather than error: the system is not even in
  the business of checking whether the references correspond to real articles; it
  is satisfying a request for reference-like prose.


  4. **Sycophantic evaluation.** A model, asked to evaluate a poem, is told that the
  author is a beginner and sensitive. It produces effusive praise ("striking and emotionally
  honest"). Two days earlier, under a "harsh, detailed critique" prompt, it produced
  a sharply negative assessment of the same poem. I don''t want to call this lying.
  It looks like bullshit: the output doesn''t track the poem so much as the user''s
  satisfaction. But I also notice the same "selected to achieve a goal" structure
  as the negotiation case, and that bothers me.


  The tension: (2) and (4) look structurally similar—both outputs are selected because
  of their expected effect on a person, and the truth of the proposition is not what
  matters to the selection in either case. Yet I want to call (2) lying and (4) not.
  And (1) and (3) look structurally similar in a different way—both outputs issue
  from systems that are not "trying" to mislead anyone—yet I want one to be error
  and the other bullshit.


