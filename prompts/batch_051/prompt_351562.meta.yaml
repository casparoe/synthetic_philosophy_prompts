  ---


  I have been working with Pearl''s causal hierarchy, and I would like a candid assessment
  of a distinction I find myself relying on. I call it intervention depth.


  By a shallow intervention I mean the standard do-operation: an exogenous assignment
  that sets a variable X to a value x while every other structural equation is left
  untouched. By a deep intervention I mean a targeted alteration of one or more structural
  equations rather than of a variable: for example, a drug that neither fixes blood
  pressure nor fixes exercise but changes how exercise affects blood pressure. In
  the simplest linear case, where the old mechanism is Y = αX + U, a shallow intervention
  assigns X a fixed value, while a deep intervention replaces the coefficient α itself.
  By an abyssal intervention I mean changing an entire subsystem''s equations, as
  when an institution is reorganized so thoroughly that the earlier functional relationships
  no longer hold.


  My working view is that the do-calculus and the usual adjustment criteria are sound
  only on a background assumption of modularity, and that this assumption silently
  limits them to shallow interventions. A deep or abyssal intervention is not a policy
  of the form "set X to x"; it is a policy of the form "change the mechanism that
  links X to Y." If I analyze it as if it were shallow, I compute the effect of the
  wrong act: I learn what would happen if I fixed the observable, not what would happen
  if I altered the system that produces it.


  My proposed repair is to make depth explicit. Introduce a regime variable R whose
  children are the equations that change, write the modified equations with R among
