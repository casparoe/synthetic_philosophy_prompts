  ---


  I''m a PhD student in philosophy of cognitive science, and I''ve been asked to run
  a fifty-minute session for a cognitive neuroscience lab group on Dennett''s idea
  that the self is a center of narrative gravity. The claim, as I''ll introduce it,
  is that the self is not a substance or a dedicated site in the brain; it is an abstraction
  — something like a center of gravity — that we posit over a person''s self-directed
  talk, memories, and explanations, and that it earns its keep through its explanatory
  and predictive usefulness. The audience matters here: they work on self-referential
  processing and the default-mode network, and they will enter the room wanting to
  know where the self is implemented. I expect at least one of them to hear the view
  as "the self is just an illusion" and another to hear it as "the self is only a
  story."


