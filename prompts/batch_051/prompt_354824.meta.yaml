  Let''s draft prompt:


  "I’ve come to accept a suffering-focused ethical outlook, and I want you to pressure-test
  it. My position is a form of negative consequentialism: the reduction of severe
  suffering has strict lexical priority over the creation or preservation of happiness,
  so that no amount of happiness for a being can by itself justify imposing severe
  suffering on that same being, and a world with fewer suffering beings is, other
  things equal, better even if it contains less positive happiness. The position did
  not start for me in formal ethics; it started with a passage in Schopenhauer’s essay
  On the Sufferings of the World, from the collection Studies in Pessimism. In the
  passage I have in mind, Schopenhauer maintains that pain and want are the positive,
  directly apprehended realities of experience, while happiness and satisfaction are
  merely negative: they are the felt absence of pain or the brief ceasing of a want,
