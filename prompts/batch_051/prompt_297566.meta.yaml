  chance of making landfall. In the second sort of case, the probability is astronomical
  rather than merely tiny and the stake is astronomical rather than merely large:
  imagine a politician who must choose between a policy that will save one identifiable
  person for certain and a policy with, say, a one-in-ten-to-the-thirtieth chance
  of saving ten to the fortieth lives. Expected-value reasoning, which seemed to do
  the work in the seatbelt and insurance cases, now says the second policy is overwhelmingly
  better — yet most people would judge it reckless, fanatical, or worse to gamble
  a certain rescue on odds that small, whatever the prize. So ordinary practical judgment
  seems asymmetric: we let expected value govern when probabilities and stakes are
  in a familiar range, but we refuse to let it govern when both are pushed far outside
