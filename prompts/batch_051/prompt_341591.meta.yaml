  Prompt draft:


  "Consider the classical sea-battle passage from Aristotle''s De Interpretatione.
  The standard version runs: two admirals will meet in battle tomorrow, and today
  one side asserts ''There will be a sea battle tomorrow.'' If that sentence is already
  true, the battle seems fixed; if it is already false, the non-battle seems fixed;
  either way, necessity apparently follows from the mere fact of the sentence''s having
  a determinate truth-value. Aristotle''s own way out, or at least the way traditionally
  attributed to him, is to deny that future contingents are already true or false.


  Now modify the case. Tomorrow''s battle is governed by a device that will settle
  the question at first light: a sealed chamber contains a single unstable atom of
  some isotope with a half-life of exactly twelve hours; if it decays before dawn,
  the attack proceeds, and if it does not, the fleets withdraw. Everyone concerned
  understands the mechanism, and the admirals have resolved to abide by it without
  discretion. Consider the sentence, uttered today, ''There will be a sea battle tomorrow.''
  [Or: "A sea battle will occur tomorrow."]


  Does the standard truth-value-gap analysis still recommend the same answer? In the
  original, one might say the future is open because deliberation has not concluded;
  but here the future is chancy in a precisely specified way. But a chancy fact is
  not an open fact in the same sense: the probability is fully determinate, and quantum
  mechanics may or may not supply a fact about the unobserved atom''s state. Does
  this change the case for a third truth-value? Or does it sharpen the dispute between
  a bivalent semantics and a trivalent one? Spell out what you take the strongest
  bivalent and the strongest gap-theoretic treatment of the modified case to be, and
  say which survives the variation."


