  Let''s reread Kant''s actual argument in "On a Supposed Right to Lie." Key claims:

  1. Truthfulness in statements that cannot be avoided is a formal duty of everyone
  to everyone, however great the disadvantage.

  2. If you lie to the murderer and the victim (unbeknownst to you) has gone out,
  so the murderer doesn''t find him, you are legally responsible for the consequences
  — because "the untruth is a violation of the right of humanity in your own person."

  3. If you tell the truth and the murderer finds and kills the victim, that''s not
  your doing but "accident" (casus); you did not wrong by telling truth.

  4. Lying harms humanity generally: it makes "the source of right" (the reliability
  of all testimony/contract) unusable.


