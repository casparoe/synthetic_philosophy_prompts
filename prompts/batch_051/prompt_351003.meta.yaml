  Prompt content:

  - Start: "I got into a long argument last night with a friend about Szasz..."

  - Friend''s claim: mental illness is a myth; real diseases are physical; psychiatry
  just labels socially deviant/problematic behavior as illness; no blood test or brain
  scan for depression/schizophrenia; diagnosis is just symptom checklists; therefore
  not real diseases.

  - My pushback: the absence of a biomarker doesn''t prove the category is fake —
  you can have a real pattern of dysfunction before you know the mechanism; epilepsy
  was real before EEGs.

  - Ask: How could one test this? What observation/measurement could distinguish a
  genuine disease entity from a merely constructed label? What result would count
  for/against Szasz, and what part of the dispute is not empirically decidable at
  all?


