  Bayesian convergence: The classic result (Blackwell-Dubins 1962, merging of opinions;
  also Doob''s consistency theorem) says that under certain conditions, two Bayesian
  agents'' posterior distributions will merge (agree in the limit) even if they start
  with different priors, provided their priors are mutually absolutely continuous
  (agree on which events have zero probability) and they share the same likelihood
  and observe the same infinite sequence of data. "Washing out of priors" is the informal
  idea: with enough evidence, the prior doesn''t matter.


  The type C prompt: "Does the washing-out-of-priors argument survive [specific development]?"
  Good developments:

  - Misspecification: if the true data-generating process is not in the support of
  the agent''s prior (the model class is wrong), convergence results that rely on
  the true hypothesis being in the support fail; posteriors can converge to the closest
  (KL-projection) hypothesis, but two agents with different priors over a misspecified
  class need not agree — actually they might still merge under some conditions, but
  the limit is the KL projection within each''s support, and if supports differ, they
  don''t merge. This is a real bite.

  - Computationally bounded agents: they can''t compute full posteriors, use approximation
  algorithms (variational Bayes, MCMC), which may not preserve merging.

  - Selective observation / choosing what data to look at: the standard result assumes
  exogenous data (i.i.d., observed passively); with active data selection or echo
  chambers, no guarantee.


