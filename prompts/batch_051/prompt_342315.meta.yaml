  Dennett''s three stances:

  - Physical stance: predict behavior from physical constitution and laws of physics.

  - Design stance: predict behavior by assuming the thing is designed a certain way
  and will behave as designed (malfunction aside).

  - Intentional stance: treat the system as rational agent with beliefs/desires and
  predict that it will act to further goals in light of beliefs.


  Dennett also has "real patterns" idea: beliefs/desires are real patterns in behavior,
  like centers of gravity are real patterns in matter; the pattern exists, not an
  illusion but not a thing.


