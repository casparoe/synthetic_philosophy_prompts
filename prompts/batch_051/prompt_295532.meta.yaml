  ---


  I''m a software engineer and I keep going in circles on something, so I want a straight
  answer from someone who does this kind of thinking. A while back I read about Nomic,
  the game where the rules explicitly let players change the rules as a move, and
  since then I''ve been modeling legal-ish systems as code that can rewrite its own
  source while it''s running. I came up with a concept I call the "Boot Gap."


  Here''s the idea. Any rule system that can amend itself needs an initial rule that
  says how amendments work. That root rule either (a) applies to itself, or (b) doesn''t.
  If it applies to itself, then the system can lawfully amend the amendment rule into
  something that forbids amending it. The moment you make the change you''re acting
  legally, and the moment after you''re in violation of the new rules — same actor,
  same rules, just evaluated one commit apart. If the root rule doesn''t apply to
  itself, then there''s a hardcoded rule whose authority can''t be derived from the
  system; it''s like a repo where the first commit was created with commands that
  aren''t in the repo. Either way there''s a gap between the rules and whatever gave
  them authority, and I claim every self-amending system has this gap. Adding more
  rules just moves the gap up a level, like adding a bootloader before the bootloader.


  The three ways out I can see are: hardcode the root rule and accept that the foundation
  is just posited; accept an infinite chain of amendment rules (which no finite rulebook
  can actually contain); or let the amendment rule apply to itself and eat the weird
  transitions. I think the third one is the most honest but it feels like it makes
  "legal" a time-indexed property, and I''m not sure if that dissolves the paradox
  or just hides it.


  So: is the Boot Gap a real thing, or am I confusing law with version control? Has
  someone already worked this out under a name I''d know? And if you had to defend
  one of the three options, which is least broken and why — or is there a fourth option?


