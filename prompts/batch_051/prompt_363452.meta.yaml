  Rough argument:

  1. In outcome-based supervision, you only label/score the final result (correctness,
  helpfulness, alignment of the final answer). In process-based supervision, you label/score
  individual steps of reasoning (this step is good/bad/neutral).

  2. The usual pitch for process supervision is that it prevents reward hacking and
  improves interpretability: by scoring steps you constrain the path, so the model
  can''t just reward-hack the final answer (e.g., produce the right final answer for
  the wrong reasons) and you get more interpretable rollouts. Also process labels
  give denser training signal.

  3. But here''s the tension: what makes a reasoning step "good"? Two initially plausible
  answers: (a) it''s good if it''s a valid inference from what came before (formal
  criterion), (b) it''s good if it tends to be part of trajectories that end in good
  outcomes (outcome-relative criterion). If (a), process supervision can only capture
  local validity, not truth-seeking, and a chain of locally valid steps can go badly
  wrong (valid reasoning from false premises). To fix that, process labelers fall
  back on (b): they label a step good because it''s the kind of step that would be
  present in a trajectory that reaches the right answer. That''s just outcome supervision
  redistributed. So process supervision doesn''t escape outcome dependence; it relocates
  the outcome judgment to each step, often without noticing.

  4. Moreover, process labels are typically generated by models or by humans who rely
  on their own sense of where the reasoning "should" go — which is a covert forecast
  of outcomes. Even backtracking: labeling a step "bad" because it would lead to a
  dead end is a claim about the outcome of that sub-trajectory.

  5. Counter-consideration: One might object that there''s a genuine distinction between
  "production" norms and "evaluation" norms: a step can be recognized as a good step
  (e.g., deriving the correct equation from the setup) even when the final numerical
  answer is wrong due to a later arithmetic slip. So process supevision is not simply
  relabeled outcome supervision because the process verdict is rendered before the
  outcome exists, and can disagree with the outcome. But this seems weak: the process
