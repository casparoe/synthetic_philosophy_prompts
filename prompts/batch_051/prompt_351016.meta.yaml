  Complexity of the mixture.


  2. "proves Occam''s razor — a rational agent must prefer the simplest hypothesis"
  — Overstatement. Solomonoff induction is a specific ideal; its optimality is defined
  under a particular prior (the universal semimeasure) and it converges on computable
  sequences in a specific sense; it doesn''t "prove" the normative claim that rational
  agents must be Occamist. The prior is one possible choice; other priors can also
  be made to work, or the "rationality" is assumed via the prior rather than derived.
  Subtle overstatement.


