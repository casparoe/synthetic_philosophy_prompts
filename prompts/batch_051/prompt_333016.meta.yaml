  Zeno''s arrow paradox: At each instant of its flight, the arrow occupies a space
  equal to itself (i.e., it is somewhere, not moving to somewhere else). If at each
  instant it is at rest, then throughout the whole flight it is at rest; motion is
  impossible.


  Standard reply (Aristotle, calculus, Russell): The premise "at an instant the arrow
  is at rest" is false or meaningless. At an instant, the arrow has a position but
  no velocity; being at rest means having zero velocity over an interval, i.e., same
  position at successive instants. An instantaneous snapshot can''t distinguish rest
  from motion. Motion consists in being at different places at different times, which
  is entirely compatible with each instantaneous state being a point position.


  Quantum Zeno effect: In quantum mechanics, if you continually measure a system (e.g.,
  check whether an unstable particle has decayed at very short intervals), the system''s
  evolution is inhibited; the particle never decays. It''s the "watched pot never
  boils" realized. Formally, frequent projective measurements reset the system to
  its initial state and suppress transitions (the Zeno effect, Misra & Sudarshan 1977).
  There''s also classical analogues: a watched pot doesn''t boil if "watching" involves
  removing energy? Hmm.


