  ---


  Here is a parallel I keep noticing and cannot yet decide about; I would like help
  working out whether it is deep or superficial.


  In recent philosophy of games, there is a family of views (sometimes called an "aesthetics
  of agency") according to which the artistic medium of a game is primarily neither
  its imagery, its story, nor its rulebook, but the agency it structures. On this
  view, a game designer does not decide exactly what a player will do; the designer
  sets goals, obstacles, permissions, and capacities, and thereby composes a shape
  of practical activity — a particular way of wanting, planning, risking, and striving
  — that the player can inhabit and appreciate from the inside. What a good game offers,
  on this picture, is not just a problem but a temporary alternative form of agency:
  the experience of acting deliberately within constraints the player has agreed to
  treat as binding for the sake of the activity. Appreciating the game, then, includes
  appreciating what it is like to be an agent of that kind.


  Something structurally similar seems true of constitutional design. A constitution
  can be characterized not primarily as choosing a set of outcomes but as designing
  the space of political agency itself: it distributes offices, powers, vetoes, jurisdictions,
  procedures, and standing, and in doing so it constitutes a determinate form of collective
  and official action rather than dictating every decision that will be made within
  it. And part of what is valued in constitutional design — due process, separation
  of powers, the possibility of accountability, the experience of self-government
  — looks like a value attached to the form of agency made available, over and above
  the value of whatever decisions happen to come out of it.


  The parallel, put abstractly: both games and constitutions are artifacts whose primary
  designed object is the structure of agency rather than its outputs; both are evaluated
  in part for the character of the activity they make possible; and both involve systems
  of constraints whose force seems to depend constitutively on participants treating
  them as binding. If the parallel is sound, then some of the apparatus developed
  to explain how games can be art in the medium of agency might transfer to the evaluation
  of institutional design, and the game case might inherit from the constitutional
  case worries about legitimacy, coercion, and the non-optionality of the constraints.


  But I can also see reasons the analogy may break. Games are, standardly, entered
  voluntarily, and their goals are bracketed from the rest of life: the player consents
  to artificial constraints for the sake of the activity. Constitutional orders are
  not entered voluntarily by most people subject to them, and their constraints are
  not bracketed. A game''s goals can be arbitrary because they are adopted only for
  the experience of striving; a constitution''s goals are the reverse of arbitrary,
  and the stance of "appreciating the shape of agency from the inside" might amount
  to an objectionable civic aestheticism when the activity is ruling and being ruled.


  Please assess whether this parallel is deep or superficial. In your answer I would
  like you to: (a) state the mapping precisely, marking where the two sides are genuinely
  alike and where the analogy is merely verbal; (b) say what would have to be true
  of both sides for any substantive result to transfer from one field to the other;
  (c) name at least one thing the parallel predicts that is actually false, or one
  disanalogy that does real explanatory work; and (d) distinguish what is reasonably
  settled in each literature from what is genuinely contested among people working
  on it, and avoid presenting any contested reading — about art, games, or constitutions
  — as settled consensus.


