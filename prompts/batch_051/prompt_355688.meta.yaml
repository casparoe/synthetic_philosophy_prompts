  violations. (Kantian, maybe.)

  2. Threshold deontology: Constraints bind until some threshold of catastrophe (e.g.,
  many deaths), then give way. (Robert Nozick? Kamm? "threshold deontology").

  3. Agent-relative side-constraints: it matters not just how many violations occur
  but whose agency does them; I lack the standing to violate; I should respect inviolability.
