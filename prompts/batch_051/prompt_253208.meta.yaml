  "I''ve been trying to settle an argument about what an organism is, and I''ve come
  up with a criterion I''d like checked. I call it the principle of non-rival futures:
  an entity counts as an organism just in case no proper part of it has a realistic
  future in which that part flourishes while the entity (or the lineage that entity
  belongs to) fails. By ''proper part'' I mean a component we''d ordinarily count
  as part of the living thing, and by ''realistic'' I mean a future reachable under
  ecologically normal conditions, not laboratory rescue. The attraction is that it
  gets the cases I care about right: a worker termite has no future in which it flourishes
  while the colony collapses, so a termite colony counts as an organism; the zooids
  of a Portuguese man o'' war are in the same position, so siphonophores count; and
  a coral branch can fragment and do fine after the parent colony dies, so a coral
  colony is not an organism. It also lets me say something principled about holobionts:
  since a host''s gut microbes can typically colonize another host or persist in the
  environment after this host dies, the holobiont fails the test and is better described
  as a tight community. I know there''s a big literature on biological individuality,
  and this probably overlaps with things like ''evolutionary individuals'' or ''reproducers,''
  but I can''t tell if I''ve just reinvented one of those ideas or added anything.
