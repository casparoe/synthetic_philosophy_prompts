  Proposal: "A consortium of philosophers, lexicographers, and science-policy researchers
  proposes a standing ''Concept Commission''. Every five years, the Commission selects
  a small number of contested everyday and semi-technical concepts (examples given:
  ''planet'', ''fish'', ''vegetable'', ''sandwich'', ''weed'', ''memory'', ''addiction'')
  and drafts a revised official definition for each — a ''stewardship definition''.
  The revision must satisfy two tests, each enforced by separate sub-panels: a continuity
  test (the revised definition must classify at least, say, 92% of the clear cases
  that ordinary speakers currently classify in the same way, measured by pre-registered
  surveys) and an ameliorative test (a second panel must certify that the revision
  better serves the legitimate purposes for which the term is used, e.g., legal clarity,
  scientific classification, dietary labelling, horticultural regulation, mental-health
  practice). Approved definitions are published in an official register; jurisdictions
  and institutions are encouraged — not required — to adopt them; after a transition
  period, bodies that keep using the old sense can apply for a ''legacy usage'' label;
  courts and regulators may cite the register as a default but not a trump. There''s
  also a dispute mechanism: any group of at least X registered speakers can petition
