  ordinary speakers, that the revised definition still classifies cases the way at
  least 90 per cent of clear current usage classifies them. An amelioration panel
  would certify that the revision better serves the legitimate purposes for which
  the term is actually used — legal drafting, scientific classification, dietary labelling,
  horticultural regulation, psychiatric practice, and so on. Approved definitions
  would be entered in a public Concept Register. Jurisdictions, scientific bodies
  and publishers would be invited, not compelled, to adopt register definitions as
  defaults in their own rules and style guides; organisations that deliberately retain
  an older sense could apply for a ''legacy usage'' notice on the register for up
  to ten years, renewable. Courts and regulators could cite the register as a default
  but not as a trump; and any group of, say, 5,000 registered members of the public
  could petition after three years to have a definition reopened, which would restart
