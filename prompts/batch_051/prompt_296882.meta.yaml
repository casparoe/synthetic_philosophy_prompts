  Prompt skeleton:


  "You are an expert on forecasting methodology, the base-rate/outside-view literature,
  and comparative historical political science. Please think carefully and, before
  giving your final assessment, spend some time brainstorming possible objections
  and possible prior articulations of the idea.


  I am a PhD student in comparative politics, and I have been developing an idea I
  provisionally call ''reference-class telescoping.'' It is meant to fix something
  I find unsatisfying in how outside-view reasoning gets applied to the survival of
  states, empires, and regimes.


  Here is the idea. Standard outside-view advice says: choose a reference class of
  comparable cases and start from its base rate. But the choice of reference class
  is usually made once, for the entire forecast horizon. I think it should change
  systematically with the horizon. For short horizons, we can legitimately use a narrow,
  high-information class, because the features that define it — say, being a nuclear-armed
  superpower in a bipolar system — are themselves likely to persist over that horizon.
  But as the horizon lengthens, the defining features of any narrow class start to
  decay: they are themselves variables with base rates. A 200-year forecast conditioned
  on ''being a nuclear superpower'' is implicitly conditioning on something that may
  not last 50 years. So the correct outside view should ''zoom out'' as the horizon
  grows: from superpowers since 1945, to great powers since 1815, to all large territorial
  states, to all complex societies, and so on. I call this telescoping because the
  reference class expands in nested steps, with the expansion rate set by the estimated
  persistence of the feature that defines each class.


  Formally, I have been toying with a rule: rather than selecting one class, assign
  each plausible reference class a weight proportional to the estimated probability
  that the features defining that class still hold at the target date, times the class''s
  own base rate; then forecast using the mixture. So a 10-year forecast for U.S. hegemony
  is mostly drawn from the postwar-superpower class, but a 100-year forecast is mostly
  drawn from something much broader, like premodern and modern empires.


  An example: forecast the survival of the British Empire from the perspective of
  1900. A 10-year forecast using ''current great powers'' would have missed little;
  a 50-year forecast using that same class would have been badly misleading, because
  the class ''current great powers'' had a short half-life. The telescoping rule would
  have pushed a longer-horizon forecaster toward the base rate of maritime empires
  or imperial systems generally, which was much grimmer, and would have given a better
  calibration.


  I know this is close to a few things: hierarchical Bayesian forecasting, model averaging,
  Markov-switching models, and the old reference-class problem. But I have not seen
  the horizon-dependence of the reference class made explicit as a principle. My questions:
  Is this a coherent idea or mostly a metaphor? Has it already been worked out under
  some name I should know? What is the strongest version of it a sympathetic reader
  could construct, and where exactly does that strongest version fail? I would especially
  like to know whether it makes bad predictions for cases where narrow reference classes
  remain informative for long horizons, or where broad classes are too heterogeneous."


