  Draft:


  "I write alternate-history novels, mostly what-ifs about nineteenth-century technology
  and empire, and after the last one I realized I''ve been helping myself to a bunch
  of half-remembered ideas about how much history can actually bend. Before I build
  a whole plot on them I want a consistency check. Here''s roughly where I''ve landed:


  1. Path dependence is real and sometimes decisive: some standards and institutions
  got locked in by small early accidents and increasing returns rather than because
  they were better — QWERTY, VHS, that sort of thing — and once they''re locked in
  they can persist for generations even when almost everyone can see a better option.

  2. But I also think the lock-in talk gets oversold. Over long enough stretches,
  market and political selection grinds down most inefficient arrangements; most things
  that stick are sticking because they''re good enough with real switching costs,
  not because people are caught in a mistake they can''t undo.

  3. As a working method I believe in the minimal-rewrite counterfactual: you change
  one small, well-attested event, hold the big structural background fixed, and let
  the ripples run. But I also think an alt-history stops being informative if divergence
  snowballs without limit, so the story shouldn''t have the world become unrecognizable
  from a single nudge.

  4. I think the huge macro outcomes — agriculture, states, fossil-fuel industrialization,
  the broad shape of modernity — are overdetermined by material conditions. Even fairly
  large changes to particular events or particular people wouldn''t move there timing
  or location by much.

  5. Yet I don''t want path dependence to be an excuse machine. I think later actors
  are never really trapped: the path persists because their ordinary choices keep
  reproducing it, and at some point enough of them could coordinate to break it if
  they wanted to, so responsibility for keeping an arrangement alive belongs to the
  present, not to the original accident.


