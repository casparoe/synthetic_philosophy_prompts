  to prove too much, so I''m worried I''ve gone wrong somewhere."


  Numbered steps:

  (1) Smith''s passage claims that Britain''s American empire has cost immense expense
  without profit, and that its monopoly of the colony trade brings "mere loss instead
  of profit" to the great body of the people.

  (2) If a policy brings no benefit to the great body of the people and benefits only
  a small interest (the merchants who profit from the monopoly), then the public-spirited
  course is to abandon it, even if concentrated interests lose.

  (3) Therefore Britain should voluntarily give up its authority over the American
  colonies.

  (4) The reasoning in (1)–(3) does not depend on anything peculiar to America: it
  applies wherever a central power maintains distant dependencies through trade restrictions
  and military spending that enrich a few and cost the many.

  (5) So any such imperial relationship should be dissolved.

  (6) But that conclusion is stronger than I can stomach: by parallel accounting,
  many large territorial states would be required to shed distant provinces whose
  fiscal costs exceed their revenues and whose attachment mainly benefits particular
  interests; even some homeland regions might qualify. That makes political union
  conditional on running a profit, which seems false.

  (7) Therefore something in (1)–(4) is too strong, but I can''t locate the bad step
  without also abandoning Smith''s critique.


