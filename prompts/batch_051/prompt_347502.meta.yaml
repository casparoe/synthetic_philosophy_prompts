  Plan prompt structure:


  Para 1: Journalist framing. "For a piece I''m reporting on how people in the eighteenth
  century thought about the costs of empire, I''ve been reading the closing sections
  of Adam Smith''s Wealth of Nations, where he assesses Britain''s American colonies.
