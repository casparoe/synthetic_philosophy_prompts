  Draft:


  "I''ve been thinking, in an amateur way, about two ideas that come up whenever people
  discuss who gets believed and who doesn''t. As I understand them, a testimonial
  injustice is when someone suffers because a hearer gives their word less credibility
  than it deserves, and the hearer''s misjudgment is driven by a prejudice about a
  social group the speaker belongs to — so that the speaker is wronged specifically
  in their capacity as a giver of knowledge. A hermeneutical injustice is different:
  it is when someone is put at an unfair disadvantage in making sense of, or communicating,
  an important area of their own experience, because the shared stock of concepts
  and categories available in their community has a gap in it — a gap that exists
  because people like them were never in a position to shape those interpretive resources.
  I''m not completely sure I''ve got either definition right, which is part of why
  I want the case built.


  Please construct a single realistic scenario — something like a hospital ward, a
  school, or a small business, over a period of weeks or months — that meets all of
  the following conditions.


  First, the scenario must include a credibility deficit: a hearer gives a speaker
  S noticeably less trust than S deserves given the available evidence, and as a result
  S suffers a concrete, serious setback. Second, there must nonetheless be no testimonial
  injustice anywhere in the case. The credibility deficit must come from something
  other than identity prejudice — for example, an honestly held but poorly calibrated
  response to some generic feature of how S presents — and no one in the case should
  act maliciously or lie. Third, the same scenario must also contain a hermeneutical
  injustice suffered by a different person, T. T''s disadvantage should not involve
  anyone disbelieving T; it should be a matter of T lacking, within that setting,
  the concepts needed to make sense of a recurring and significant pattern in T''s
  own experience, where the absence of those concepts is plausibly the product of
  the marginalization of people in T''s position.


  After you present the scenario, do the following. Explain why the credibility deficit
  suffered by S does not rise to testimonial injustice, and say precisely which feature
  of the case prevents it from rising to that. Then explain why T''s situation does
