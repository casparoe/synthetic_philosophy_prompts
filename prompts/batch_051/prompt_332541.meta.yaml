  as seamless, but the green/red changing dot''s color change point is "filled in"
  before the second stimulus appears — how does the brain know to fill in green before
  the green dot appears? This creates the problem of "referral backwards in time"
  or "editing of consciousness."


  The Orwellian/Stalinesque distinction: two explanations. Stalinesque: the brain
  delays the conscious experience until after the second stimulus, then presents an
  already-edited version — consciousness is a "show" that gets revised before the
  audience (the homunculus?) sees it. Orwellian: conscious experience is real-time
  with the red dot then the gap then the green dot, but immediately after, memory
  is rewritten (like the Ministry of Truth in 1984) so the subject remembers a seamless
  moving dot. The distinction matters because both predict the same verbal report.
  Dennett argues the dispute is illusory/undecidable because it presupposes a "finish
  line" in the brain (Cartesian Theater). The prompt could ask for a teaching plan
