  The "Orwellian vs. Stalinesque" topic: The terms come from Dennett''s "Consciousness
  Explained" (1991), chapter on time and experience, I believe. There''s a distinction
  between two models of how the brain handles apparent motion with backward referral:
  Stalinesque (the brain revises the "show" before it reaches consciousness, so the
  experience itself is edited; there was only one, already-revised experience) vs
  Orwellian (the experience arrives quickly, then memory is revised immediately so
  that subsequent reports and recollections are edited). The color phi phenomenon:
  two colored dots flashed in sequence produce an apparent motion with color change
