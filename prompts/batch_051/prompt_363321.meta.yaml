  Student answer: "Peirce''s pragmatic maxim says that the whole meaning of a concept
  consists in the effects we expect it to have, so clarifying a concept requires setting
  out the observable consequences of the object''s existing or the proposition''s
  being true. This is close to verificationism, but Peirce differs from verificationsists
  by talking about effects that could conceivably have practical bearings rather than
  only effects we have actually observed. Even so, the maxim is ultimately a criterion
  for sorting meaningful empirical claims from meaningless metaphysical ones. In ''The
  Fixation of Belief'' Peirce distinguishes tenacity, authority, the a priori method,
  and the method of science. Tenacity fails because it cannot survive contact with
  other people''s contrary beliefs; authority is more stable but it cannot regulate
  opinion on every question, and it eventually confronts the fact that other societies
  believe differently; the a priori method fails because it makes belief answer to
  what is agreeable to reason, which is really just taste. The method of science is
  the only one that places an external, public constraint on belief, and that is why
  Peirce takes it to be superior. Peirce is, however, a fallibilist: he denies that
  we can ever know for certain that a present opinion is the final one. If every claim
  to superiority is itself fallible, then no method can be shown to be better than
  the others at reaching the truth, so Peirce''s preference for science rests on a
  regulative ideal that he must accept on faith rather than on an argument."


