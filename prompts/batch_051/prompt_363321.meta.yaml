  2. Fallibilism (no certainty) -> no method shown better -> preference rests on faith.
  Non sequitur, because Peirce''s argument for science''s superiority doesn''t require
  certainty; the external constraint is what distinguishes it, and fallibility doesn''t
  make all methods equal.


  But note the student says "Peirce differs from verificationists by talking about
  effects that could conceivably have practical bearings rather than only effects
