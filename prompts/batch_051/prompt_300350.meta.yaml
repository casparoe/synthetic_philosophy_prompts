  Prompt draft:


  "I''m a software engineer, not a philosopher, so I want to make sure I''m reading
  this correctly rather than pattern-matching. I recently read Mill''s The Subjection
  of Women, and the following passage stuck with me: [quote]. Mill seems to be saying
  that in ordinary disputes there''s an asymmetry in where the burden of proof sits:
  the person claiming that an historical event occurred must produce evidence; the
  person charged with a crime doesn''t have to prove innocence; and the person who
  wants to restrict liberty bears the burden of showing that the restriction is justified.
  But the moment the restriction in question is men''s authority over women, the asymmetry
  flips: the people who want to keep the restriction get to demand that the critics
  prove it should be dismantled. I''m used to thinking of burden of proof as a property
  of the claim being made, not of how old or familiar the institution behind it is.
  So here''s my question: is there a defensible principle that justifies the asymmetry
  Mill identifies — treating long-standing arrangements as entitled to a presumption
  in their favour that novel restrictions would not get? Or is the asymmetry just
  a bias toward the status quo that we should drop? If you defend the asymmetry, I''d
  like to see it defended against the hard case where the long-standing arrangement
  is one we now agree was unjust (e.g., chattel slavery or debt bondage), not only
  the easy cases where we happen to like the arrangement."


