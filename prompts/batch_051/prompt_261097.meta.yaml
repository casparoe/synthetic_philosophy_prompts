  "I recently watched two friends argue, over several rounds, about a third friend''s
  decision, and I could not settle it myself.


  Our friend Dana runs a small backyard setup for four hens she took in when a local
  egg operation shut down. The birds are healthy, have a secure run, and get veterinary
  care; Dana does not cull them and does not acquire more birds. They lay eggs almost
  every day. Dana, who had avoided eggs for years for ethical reasons, has begun eating
  the ones her hens lay, and she gives the surplus to neighbors. Two other friends,
  Mateo and Priya, argued about it in front of me.


  Mateo opened by saying Dana had quietly abandoned her principles. She refuses to
  treat animals as sources of products for humans, yet she now takes the output of
  her hens'' reproductive systems for herself. She could feed the eggs back to the
  hens instead, which also restores some of the calcium the hens lose. By eating them,
  she sends the message that an animal''s body is still, at bottom, a legitimate resource
  for people once the circumstances look clean enough.


  Priya replied that Dana creates no market demand, funds no operation, and harms
  no bird. The eggs will rot or need disposing of regardless. The moral problem with
  eggs has always been the industry behind them — confinement, culling, and purchase
  — not the egg itself. To refuse to eat an egg from a hen you feed and shelter is
  to mistake an object for the relationship that produced it. It is like freeganism:
  taking discarded food does not fund the system that discarded it.


  Mateo answered that ''creates demand'' cannot carry the whole weight. If a rescued
  cow had to be milked for her own health, would Priya drink the milk? If a sheep''s
  overgrown wool had to be shorn for her comfort, would she spin it into clothing?
  If a beloved dog died of old age, would she use the leather? Each of those uses
  would also be ''waste'' in the relevant sense. What Dana has become is not a guardian
  who happens to find a byproduct, but a guardian who also benefits from the animal''s
  body — and ''guardian plus beneficiary'' is how farmers have always described themselves.


  Priya said those other cases have to be judged one at a time, by whether the byproduct
  has to be removed anyway for the animal''s welfare and whether any demand is being
  fed. Wool that must be shorn and would otherwise be thrown away is not made more
  respectful by throwing it away; refusing to benefit from it is a kind of ritual
  purity, not a protection of the sheep. She added that the cow-and-dog challenges
  are designed to provoke disgust rather than to track a moral difference.


  Mateo then said the eggs are not waste unless someone first decides to treat them
  as waste. Laying is costly to the hen, the egg belongs to her, and the respectful
  default is to reduce or interrupt laying where that is feasible, not to consume
  the result and call it a byproduct. He also said Dana''s rule could not be made
  general: if everyone were willing to eat eggs only from well-kept rescue hens, there
  would not be nearly enough such eggs for everyone, so the practice is an exemption
  that depends on the very industry she objects to.


  Priya granted that the general rule fails but said that is not a moral test she
  accepts. Donating a kidney or buying a secondhand coat also cannot be made general
  in that blunt way, and that does not condemn them. What matters, she argued, is
  whether Dana''s own act involves harm, demand, or complicity. Mateo has not named
  the feature that makes it wrong; he has only shown that it can be made to sound
  unappetizing.


