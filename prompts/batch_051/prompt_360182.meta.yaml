  I''ve been reading Peirce''s "The Fixation of Belief," and I want someone who really
  knows Peirce to pressure-test his argument against something modern.


  [Summarize Peirce''s argument in own words.] Peirce lays out four ways people settle
  opinion: tenacity (just stick to what you believe and avoid contrary influences),
  authority (an institution tells people what to believe and punishes dissent), the
  a priori method (beliefs are adopted because they feel natural or agreeable to reason,
  like a lot of metaphysics), and science (beliefs answer to an "external permanency"
  -- a reality whose character doesn''t depend on what anyone thinks). His argument
  is that only science can genuinely fix belief: tenacity is destabilized by the social
  impulse, authority always leaks dissent because no institution can regulate every
  question, and the a priori method just makes inquiry a matter of taste, so it''s
  unstable; science alone has a right/wrong distinction and produces convergence.


  [Development.] Here''s the development I want to throw at it. Today, a huge share
  of people''s beliefs are fixed not by any of the four methods, but by engagement-optimized
  ranking systems -- feeds, recommender algorithms, search autocomplete. These systems
  don''t care whether a belief tracks reality; they care whether it holds attention.
  Yet they seem to produce something that looks a lot like fixation: people in different
  algorithmic bubbles hold their beliefs with enormous confidence and almost never
  encounter the evidence that would unsettle them. The disagreement Peirce thought
  would destabilize tenacity and authority does not seem to land anymore, because
  the systems filter it out before it can do its work.


  Does Peirce''s argument survive this? Or is this a genuinely fifth method that does
  what science does -- stabilize belief -- without any external permanency? [Questions:
  which premise under pressure, can it be repaired.] I want a committed answer, not
  a menu of options. Start by brainstorming a few ways of classifying the new development
