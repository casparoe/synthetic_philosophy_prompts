  I am the grants director of a private land-conservation foundation. Our board has
  added a new criterion to every funding decision: alongside biodiversity, connectivity,
  and carbon, each habitat protection or restoration project must be evaluated for
  its expected effect on the welfare of individual wild animals. This is not symbolic;
  a project can be declined on welfare grounds alone. My program staff review about
  forty proposals a year, from wetland restoration and reforestation to purchases
  of old-growth remnants and grassland easements. The staff are trained conservation
  biologists, not animal welfare scientists or philosophers. Each proposal must get
  a written recommendation of fund, modify, or decline within two weeks, and anything
  unusual goes to a board committee for final approval.


  The staff are divided. One group argues that protecting or restoring habitat is
  usually welfare-positive: it supports long-lived, slow-reproducing animals, and
  it prevents the injuries and deaths caused by clearing, draining, mowing, and burning.
  The other group argues that many of our projects create or maintain habitat for
  very large numbers of small, short-lived, heavily predated or disease-prone animals,
  and if a typical such life is on balance more suffering than enjoyment, then more
  habitat means more net suffering. They point to our standard wetland restorations,
  which produce amphibians, small fish, and invertebrates whose most common fate is
  to be eaten shortly after hatching or to die in the first dry season. A third position
  in the office says that the procedure should not count animals whose existence depends
  on our decision at all, or should count them at a discount; a fourth says that destroying
  habitat kills present animals in a way we can see, and this is morally different
  from merely failing to bring future animals into existence. The board has told us
  it wants one written procedure, not a weekly argument.


  Please design a decision procedure my staff can actually run on each of these proposals.
  It should be a sequence of questions in order. For each question, say what would
  count as a sufficient answer, and say what the staff should do if the answer is
  simply unknown. The procedure must mark the points at which it stops with a clear
  decision of decline or of welfare-grounds approval, and the points at which it stops
  being an empirical assessment and requires a value judgment; at those points the
  procedure should hand the matter to the board committee with the specific value
  question stated in plain language. The procedure should also say explicitly which
