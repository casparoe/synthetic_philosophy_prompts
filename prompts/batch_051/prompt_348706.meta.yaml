  The unilateralist''s curse: Suppose a number of agents are considering whether to
  carry out some action that will affect them all. Each agent has an independent estimate
  of whether the action is good. The action is undertaken if any agent chooses to
  do so. If the action is actually bad, but each agent has a small chance of mistakenly
  thinking it''s good, then a large group will almost surely contain someone who makes
  this error and acts. Thus a group can collectively do what almost all its members
  would oppose. This is distinct from the tragedy of the commons; it arises from asymmetric
  action (anyone can say yes, no one must be convinced). Proposed remedies: raising
