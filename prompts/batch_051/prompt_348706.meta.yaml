  (or is rational individually) but imposes diffuse costs, so overuse — e.g., each
  author wants their own big canon event, leading to overcrowded lore. Unilateralist''s
  curse: each author acts when they think the addition is good overall (not just for
  them), but because of noisy private judgment and unilateral action, a bad addition
  is likely to be enacted by someone. The distinction: in the curse, the actor is
  motivated by the perceived common good (they think the change improves the shared
  world for everyone), not private benefit. The bad outcome is an information aggregation
  problem: with many people, someone''s false positive will trigger the bad action.
