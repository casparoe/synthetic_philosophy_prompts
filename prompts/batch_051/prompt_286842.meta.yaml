  I''m a philosophy department member who got roped into running this year''s historiography
  seminar for the history grad students, and the historian co-teacher asked me to
  send around a one-page statement of where I stand on the objectivity debate so the
  students know what they''re dealing with. I''m mostly happy with it, but before
  I circulate it I''d like someone to poke holes in it, because the students definitely
  will. Here''s the list I''ve ended up with:


  (1) The past is real and fixed: there''s a determinate set of things that happened,
  even where no record survives and no historian will ever recover them.


  (2) Ranke was basically right as a regulative ideal: historians should be trying
  to set aside present concerns, avoid anachronism, and get at the past on its own
  terms rather than on ours.


  (3) Carr, though, was on to something when he said facts only become historical
  facts through being selected and framed by a historian; significance isn''t lying
  around in the archive pre-packaged — it''s assigned from some standpoint.


  (4) Following Hayden White, I think the more literary part of historiography is
  real and not decorative: any full-scale historical account gets emplotted, and the
  plot forms (tragedy, romance, comedy, satire) are brought to the sources rather
  than found in them.


  (5) All the same, I think some histories are just better than others in a non-aesthetic
  sense — more accurate, more responsive to the evidence, more adequate to what happened
  — and that this isn''t merely a matter of persuading our audience or fitting our
  present politics.


  (6) The difference between history and historical fiction is that history is answerable
  to the evidence in a way fiction is not, so a historian can be flat-out wrong about
  the past even when their narrative is rhetorically effective.


