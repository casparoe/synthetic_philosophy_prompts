  I am that I have a position rather than a list of six claims I happen to like. Which
  pairs are genuinely in tension, which only look that way, and what is the cheapest
  revision to make the set consistent as a whole? I''d also like to know which of
  these tensions would actually change my mind if pressed, or where my reasoning is
  most likely to fail.


