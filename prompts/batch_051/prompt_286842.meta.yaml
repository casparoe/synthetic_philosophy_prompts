  I''m a philosopher who got roped into co-teaching this year''s historiography seminar,
  and the historian I''m teaching with asked me to circulate a one-page statement
  of where I stand on the objectivity question so the grad students know what they''re
  disagreeing with. I''m not a historian myself, so I want to be sure I''m not about
  to hand out something incoherant to thirty people who have actually spent time in
  archives. Here''s the list I''ve ended up with:


  (1) The past is real and fixed: there is a determinate set of things that happened,
  even where no record survives and no historian will ever recover them. (2) Ranke
  was basically right as a regulative ideal: the historian should try to set aside
  present concerns, avoid anachronism, and get at the past on its own terms rather
  than ours. (3) Carr, though, was on to something: facts only become historical facts
  through being selected and framed by a historian; significance isn''t lying around
  in the archive pre-packaged, it is assigned from some standpoint or other. (4) Following
  Hayden White, I also think the literary side of historiography is real rather than
  decorative: a full-scale historical account gets emplotted, and the plot forms (tragedy,
  romance, comedy, satire) are brought to the sources rather than found in them. (5)
  All the same, I think some histories are just better than others in a non-aesthetic
  sense — more accurate, more responsive to the evidence, more adequate to what happened
  — and that this isn''t merely a matter of audience persuasion or fidelity to present
  politics. (6) History is answerable to the evidence in a way that historical fiction
  isn''t, so a historian can be flat-out wrong about the past even when the narrative
  is rhetorically effective.


