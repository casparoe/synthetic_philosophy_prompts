  The maxim must (i) be drawn from an ordinary modern setting, such as a workplace,
  a household, or a transit system, with no exotic examples; (ii) be none of Kant''s
  own four illustrations from the Groundwork — false promises, suicide from self-love,
  neglecting one''s talents, and refusing help to those in need; and (iii) fail the
