  agent might someday need help and would wish others disposed to give it. State the
  maxim in one sentence, with its end explicit. Then do the work: first show that
  the maxim''s universalization is logically conceivable — describe the world in which
  everyone acts on it and explain why the practice the maxim references would still
  exist; second, show why a rational will cannot will that world, tracing the contradiction
  to a precise feature of the maxim. End with a one-paragraph diagnosis: name the
  feature that does the work, and say how a defender of the conception test would
  argue that your maxim actually fails the conception test too. Keep the whole answer
  under 900 words."


