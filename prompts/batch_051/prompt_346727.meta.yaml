  (b) causal necessity: knocking out or perturbing the component destroys the network''s
  ability to respond based on that content;

  (c) downstream uptake: the component''s outputs are actually consumed by later parts
  of the network in ways that preserve the content;

  (d) selectivity and invariance: the component responds selectively to the content
  while staying relatively invariant to confounds;

  (e) structured similarity: distances or similarity relations among the component''s
  activation vectors mirror similarity relations among the represented items;

  (f) membership in an interpretable circuit: the component figures as a named part
  in a compact, human-readable algorithm that performs the task;

  (g) counterfactual robustness: the content attribution continues to hold when the
  network is tested out-of-distribution or on synthetic probe stimuli.


