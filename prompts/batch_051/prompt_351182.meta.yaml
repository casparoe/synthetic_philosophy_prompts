  Bayesian convergence facts:

  - Doob''s consistency theorem: for any prior that assigns probability 1 to a set
  on which a model is identifiable/well-behaved, the posterior concentrates at truth
  with prior probability 1. That''s about a single agent converging to the truth,
  not about multiple agents agreeing.

  - Blackwell-Dubins theorem: if two agents'' predictive distributions (their probability
  measures over infinite sequences) are absolutely continuous with respect to each
  other, then their one-step-ahead predictive distributions merge (total variation
  distance between conditional predictive distributions goes to 0) as data accumulates.
  If they are mutually singular, they may not merge.

  - "Merging of opinions" and the work of David Blackwell and Lester Dubins (1962).
  Philip Dawid''s prequential approach. The "agreeing to disagree" by Aumann (common
  knowledge of posteriors implies equal posteriors if common prior). Hmm.


  The "washing out of priors" slogan: with enough data, the posterior is dominated
  by the likelihood, so different priors that are not dogmatic (assign positive probability
  to the true model / overlapping support) converge. If priors assign zero probability
  to the truth or are mutually singular, they need not converge.


  Conditions for washing out:

  1. Common likelihood: agents agree on how the evidence bears on hypotheses (same
  statistical model / likelihood function).

  2. Non-dogmatic / overlapping support: each agent''s prior assigns positive probability
  to the hypotheses the other takes seriously (absolute continuity); particularly,
  neither assigns probability zero to the true hypothesis.

  3. Shared, accumulating evidence: both agents observe the same data (or common knowledge
  of it) — no filtered information diets.

  4. Possibly bounded model space and correct specification / no model misspecification.


  Real-world failures: people use different likelihood functions (interpret the same
  evidence differently — e.g., "the lab result was fabricated" vs "the lab result
  is reliable"), have mutually singular priors (conspiracy theories assign zero credence
  to mainstream explanations), see different evidence (media bubbles), and the hypotheses
  are not fully specified.


