  Humeanism about laws (Lewis''s best systems account): laws supervene on the Humean
  mosaic — the totality of local, particular, non-modal facts (arrangements of qualities
  at spacetime points). Laws are the theorems of the deductive system that best balances
  simplicity and strength. Two worlds with the same mosaic have the same laws; no
  difference in laws without a difference in the mosaic. A "law" is not an extra governing
  entity; it''s a summary. Therefore, two possible worlds with identical histories
  and identical future courses of events are literally the same world; there cannot
  be a pair of worlds differing only in which regularities are laws.


  Anti-Humeanism (governing view): laws are primitive nomic facts/relations (Armstrong:
  relations of necessitation between universals; Maudlin: fundamental laws that generate
  the future). Two worlds can have the same arrangement of matter throughout all time
  and yet differ in laws, because laws are additional entities not reducible to regularities.
  So a world where "all Fs are Gs" holds by cosmic coincidence differs from a world
  where it holds because a law of nature makes Fs be Gs, even if the total history
  of particular facts is identical.


  Classic example: All spheres of gold-195? Actually the standard example: "There
  are no gold spheres larger than one mile in diameter." Could be a law or an accident.
  Or "all uranium spheres are less than one mile in diameter." In one world it''s
  law, in the other a coincidence. With identical histories.


