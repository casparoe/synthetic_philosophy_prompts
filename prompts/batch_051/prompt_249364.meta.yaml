  - In run B, the same transition happens every time, but only as a cosmic fluke (the
  code has no rule; each cell''s transition is set by an enormous lookup table, or
  the coincidence just happens).

  - The anti-Humean says run A and run B are different worlds: one has a law, the
  other a cosmic accident, despite identical logs. The Humean says they''re the same
  world, because the log is all there is; "law" is just our summary of the log, so
  there''s no real difference between "enforced by code" and "lookup table that happens
  to match" — any difference is in our description, not in the world.


