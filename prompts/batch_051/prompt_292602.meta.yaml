  ----

  I’m the lead moderator for a mid-sized political discussion forum that deliberately
  mixes posters from across the spectrum, and I need to turn the vague rule "no arguing
  in bad faith" into an actual procedure my team can use. We do maybe 200 moderation
  calls a day, each gets two or three minutes, my mods are smart but have no philosophy
  background, and the decisions get appealed to me. The thing I keep noticing is that
  the easy heuristics fail: someone can be perfectly polite while poisoning the well;
  someone can be sincere while being completely sealed off inside their own info bubble;
  someone can use "just asking questions" for a claim they plainly already believe.
  I''d like you to write us a decision procedure, grounded in what philosophers and
  social epistemologists actually know about good-faith argument, echo chambers, and
  polarization, that a mod can run in about two minutes. It should separate good faith
  from mere civility, from sincerity, and from openness to being persuaded -- and
  it should be honest about how much of each distinction is observable from a single
  comment versus a judgment call about a person''s intentions. Also build in something
  about how to handle the fact that two sides can genuinely live in different information
  environments, so that what looks like refusing to engage with evidence may be a
  disagreement about what the evidence even is.


  Before you write the final checklist, brainstorm the candidate criteria you''re
  rejecting and why. Then apply the procedure to these three cases: (a) a user who
  is unfailingly civil but responds to every correction with a whatabout the other
  side; (b) a regular who sincerely believes a claim and miscites a study they half-remember,
  and when shown the actual study says "well I don''t trust that journal"; and (c)
  someone who concedes small points all the time but moves the goalposts so that no
  amount of evidence would ever change their bottom line. I want at least one of these
  to come out in a way the mods won''t like, and I want you to flag the specific steps
  where the procedure is just dressing up a judgment call as a rule. Finally, tell
  me straight what the procedure cannot catch -- for example, people who are fluent
  in the vocabulary of good faith but use it instrumentally -- and what I should tell
  my mods to do when the checklist runs out.

