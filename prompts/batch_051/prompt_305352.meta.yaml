  a new government or a breakaway territory as a state), international lawyers distinguish
  declaratory vs constitutive theories. According to declaratory theory, recognition
  merely acknowledges a statehood that already exists because of factual criteria
  (defined territory, permanent population, government, capacity to enter relations)
  under the Montevideo Convention. According to constitutive theory, recognition is
  what actually creates the state as a subject of international law — statehood is
  a status that comes into being through recognition by others. The practice is mixed:
  states often say "we recognize that Kosovo is a state" verbally framing as declaratory,
  but in practice non-recognition by major powers seems to affect its ability to act
  as a state. The UN membership requires recognition by peers. There''s tension: they
  treat recognition as confirming what is already there, yet also gatekeeping access
  to statehood.


