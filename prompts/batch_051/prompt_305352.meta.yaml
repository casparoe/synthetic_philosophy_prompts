  "You are an expert in Hegel''s social philosophy and in the metaphysics of social
  status. Think carefully... I have an interdisciplinary puzzle about the international
  practice of diplomatic recognition, and I''d like you to reconstruct the theory
  of recognition that the practice implicitly commits its participants to.


  Here is the practice as I understand it. When a new entity claims to be a state
  — after a revolution, a secession, or a colonial withdrawal — the established states
  must decide whether to ''recognize'' it. In their official statements they usually
  speak as though recognition is a kind of factual report: they say they have determined
  that the entity possesses the attributes of statehood (a defined territory, a stable
  population, an effective government, and the ability to conduct foreign relations),
  and that recognition merely acknowledges what already exists. Yet the same states
  act as though their collective recognition is what confers statehood: an unrecognized
  entity is denied access to the IMF and World Bank, is often excluded from treaties
  and international courts, cannot easily open embassies, and may be treated as a
  criminal or terrorist organization rather than a belligerent. Entities that lack
  widespread recognition — even when they plainly govern territory and people — behave,
  in international life, almost as if they do not fully exist as states, while states
  are admitted to the UN only by a vote of the body they seek to join. So the practice
  seems to oscillate between two pictures: recognition as the discovery of a status
  and recognition as the making of a status.


  My question is not ''which one is correct in international law?'' but ''what conception
  of recognition — of the relation between being X and being recognized as X — does
  this practice itself presuppose, and is that conception coherent?'' In particular,
  bring Hegel''s discussion of recognition in the master-slave dialectic to bear.
  Hegel seems to think self-consciousness is not first complete and then recognized,
  but comes to be what it is only in and through recognition; yet genuine recognition
  also presupposes an other who is already independent. Does the diplomatic practice
  instantiate something like that two-sidedness, or does it quietly presuppose a different,
