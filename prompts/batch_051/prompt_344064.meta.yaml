  ---


  I cover science and ideas for a general-interest magazine, and I am preparing a
  long feature about whether long-running disputes in metaphysics are as intractable
  as they appear. For that feature I want to reconstruct, as a document rather than
  a retrospective summary, an adversarial collaboration between a committed counterpart
  theorist and a committed defender of transworld identity over de re modal attribution.
  By counterpart theory I mean the Lewisian view that possible worlds are concrete
  and pairwise disjoint, that no individual exists in more than one world, and that
  a sentence such as that Humphrey could have won is made true by a counterpart of
  Humphrey in another world, a counterpart that resembles him in the respects selected
  by context and that represents him de re. By transworld identity I mean the view
  that one and the same individual exists in, or according to, more than one possible
  world, and that de re modal predication is assessed by tracking that single individual
  across worlds, the worlds being ways that very individual could have been.


  Draft the joint statement the two camps could both sign after a good-faith effort
  to state exactly where they part ways. Do not adjudicate, and do not manufacture
  disagreement where they already agree. Structure your response as follows.


  First, offer a numbered agreed-claims section. The claims should be substantive:
  they should state what a semantics for de re modal sentences must be able to do,
  which ordinary modal judgements and inferences (involving existence, identity, actuality
  and nested modal operators) both camps preserve, and what they agree their disagreement
  is not about. Avoid wording that is so ecumenical it says nothing.


  Second, produce a table of residual disagreements. For each row state the precise
  question at issue, then give the transworld identity theorist''s formulation in
  wording that side would accept, then the counterpart theorist''s formulation in
  wording that side would accept.


  Third, identify the cruxes: the sub-questions such that settling one would move
  at least one camp. For each crux, specify a concrete case or argument both sides
  would accept as bearing on it, and record each side''s prediction in advance. I
  would expect the cruxes to include, for example: whether the Humphrey objection
  is better met by relinquishing transworld identity or by arguing that it poses no
