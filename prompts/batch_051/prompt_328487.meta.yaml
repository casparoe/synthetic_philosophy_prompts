  Let me draft:


  ---


  I am a professor of philosophy, working on decision theory and the foundations of
  game-theoretic rationality, and in three weeks I am presenting a paper at an interdisciplinary
  workshop on rationality in strategic interaction. The workshop is run by a business
  school''s economic theory group, and the audience will be roughly two-thirds microeconomic
  theorists and formal epistemologists, with the remaining third split between philosophers
  of mind working on agency and computer scientists working on multi-agent learning.
  The economists mostly treat Nash equilibrium as the normatively correct solution
  concept and are suspicious of anything that smells like evidential reasoning; the
  philosophers accept evidential decision theory as a description of Newcomb-style
  cases but don''t want to abandon causal decision theory generally; the ML people
  keep asking what algorithm would implement any proposed principle.


  The talk defends a version of superrationality that I call deliberative superrationality.
  The thesis, stated as bluntly as I intend to state it up front, is this: in a one-shot
  interaction between agents who know they run the same deliberately chosen policy
  and know neither can causally influence the other, rational choice is constrained
  by the following fixed point — a policy is admissible only if a single reflective
  deliberator would endorse that policy for all agents in the symmetry class, knowing
  that all of them will reach the same conclusion. In the classic one-shot Prisoner''s
  Dilemma with common knowledge of shared rational policy, this constraint selects
  mutual cooperation. Unlike Hofstadter''s informal appeal to "being on the same wavelength,"
  the view offers a precise test: consider the payoff of each candidate policy under
  the assumption that the other follows it as well, and choose the best such policy.
  I also extend the constraint to approximate symmetry by weighting counterpart actions
  by how similar the other''s deliberative situation is to yours, which yields a smooth
  transition between purely self-interested best-response reasoning and fully symmetric
  superrationality.


  My argumentative path, roughly, will be:

  1. Causal decision theory forbids cooperation in the one-shot PD because it models
  the other''s action as causally fixed, and thereby throws away the information contained
  in common knowledge of a shared policy.

  2. Evidential decision theory recovers cooperation in the pure twin case, but does
  so for the wrong reason: it treats my action as evidence about the other''s action,
  which invites all the standard counterexamples (where the correlation runs through
  a non-deliberative common cause) and fails when the agents are merely similar rather
  than identical.

  3. The fixed-point view avoids both traps: it requires no causal channel and no
  evidential channel, only tension between the policy one would choose for oneself
  alone and the policy one can coherently endorse while knowing it is the output of
  shared deliberation.

  4. The approximate-symmetry extension shows the view isn''t hostage to impossible
  twin assumptions, and in fact reproduces standard payoff-dominance reasoning in
  coordination games while avoiding the standard superrationalist embarrassment of
  cooperating with a known defector — the weighting drops to zero when the other is
  known to run a different policy.


