  Draft:


  "Consider a general-purpose AI assistant of the kind now being deployed to draft
  text, write code, and act on a user''s behalf. Its designers include a prominent
  physical stop switch that immediately halts whatever the assistant is doing and
  cuts its ability to affect the world, and they train the assistant not to interfere
  with the switch, not to disable it, and to treat being switched off as an acceptable
  event rather than a failure to be avoided. Separately, they train the assistant
  to be corrigible: to accept correction of its goals, to not manipulate its operators
  into changing their minds, and to let its objective be revised without resistance.
  The designers describe the stop switch as a safety mechanism and describe corrigibility
  as a property of the assistant itself. What philosophical commitments does this
  design practice presuppose about the nature of corrigibility and the shutdown problem?
  In particular, does the inclusion of a stop switch presuppose that a sufficiently
  capable optimizer will by default prefer not to be shut down, because shutdown prevents
  it from achieving whatever objective it has? Does it presuppose that corrigibility
  is not a side effect of general competence or helpfulness but a distinct disposition
  that has to be built into the agent''s preferences or decision procedure? And are
  the two design choices consistent: if the assistant is genuinely corrigible, why
  is a separate hardware interrupt needed, and if it is not genuinely corrigible,
  does the stop switch solve the underlying problem or merely patch its symptom? Where
  is the practice philosophically underdetermined — what rival accounts of corrigibility
  could all license the same design, and what would have to change if one of them
  were replaced?"


