  Actually Lewis''s argument from temporary intrinsics:

  - Endurance: persisting objects are wholly present at each time.

  - Temporary intrinsics: e.g., shapes. If I am wholly present now, and I am bent
  now, then bent is a property I have simpliciter/atemporally. Later I am straight.
  Then I have both bent and straight simpliciter. Contradiction.

