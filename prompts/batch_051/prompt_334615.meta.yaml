  Kripke''s Wittgenstein skeptical argument:

  (1) Meaning something by a word requires that some fact about the speaker determine
  how the word is to be applied in indefinitely many cases.

  (2) The only candidate facts are: occurrent mental images/interpretations, dispositions
  to respond, felt experiences of guidance, and past usage.

  (3) For any such candidate fact, it is compatible with the expression''s being correctly
  applied either in the standard way (addition: 68+57=125) or in some deviant way
  (quaddition: answer 5 if the case has never been computed before...).

