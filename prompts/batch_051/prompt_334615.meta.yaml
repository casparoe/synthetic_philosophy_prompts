  times, or that there is no such thing as having a property simpliciter, only at
  times; but Lewis finds this unacceptable for intrinsics.


  In prompt form:

  (1) Suppose endurantism is true: a persisting object is wholly present at each moment
  it exists.

  (2) If a thing is wholly present at t1 when it is straight and at t2 when it is
  bent, then it is one and the same whole that is straight and bent, with no temporal
  part to absorb only one of the two shapes.

  (3) But ''straight'' and ''bent'' are incompatible intrinsic shapes: one and the
  same whole cannot be both without contradiction.

  (4) A thing can change shape only by being straight at one time and bent at another.

  (5) So endurantism cannot accommodate change: it entails a contradiction, whereas
  perdurantism avoids it by giving the object different temporal parts.

  (6) Therefore change requires perdurantism.


