  Option A: Grading prompt on delusions.


  Exam question:


  "Most clinicians and philosophers who study monothematic delusions accept something
  like the two-factor theory. Set out the two factors, using Capgras delusion as an
  illustration, and then evaluate the claim that delusions are not beliefs because
  patients frequently fail to act on them. Your answer should distinguish questions
  about a delusion''s aetiology from questions about its status as a belief."


  Student answer (I write it):


  "The two-factor theory says that a monothematic delusion requires two factors. The
  first factor is an anomalous experience. In Capgras delusion, the patient sees a
  person who looks exactly like their spouse but does not feel the normal autonomic
  response of familiarity, so the spouse looks like a stranger wearing the spouse''s
  face. The second factor is a failure of reasoning or hypothesis evaluation: the
  patient does not consider or accept the more plausible explanation that something
  has gone wrong with their own responses, and instead concludes that the person is
  an impostor. This explains why only some people with the same experience develop
  a delusion. It also shows that delusions are normally caused by a combination of
  an experience and an inference. Because the inference is faulty and the resulting
  claim is absurd, delusions are irrational, so a delusion is not the sort of thing
  that can be true or false — it is more like an emotion or a piece of imagination.
  A second reason is behavioural: patients with Capgras delusion often continue to
  live with the ''impostor'' and do not call the police, which shows they do not really
  accept the claim. Therefore, delusions fail the doxastic state test because a belief
  should be something that we treat as real in our actions. I conclude that delusions
  are not beliefs."


  Now, what''s right and wrong?


  Right:

  - Describes factor one (affective/autonomic) accurately enough.

  - Describes factor two as a reasoning/evaluation failure, along with motivation
  (explains why only some develop delusion).

  - Notes Capgras correctly.


  Wrong:

  1. Conflation: "delusions are irrational, so a delusion is not the sort of thing
  that can be true or false" — irrationality concerns the epistemic status of a state,
  not its being truth-apt or being a belief. A belief can be irrational and false.
  Also "not the sort of thing that can be true or false" says not propositional/truth-apt
  — that''s a claim but not established; delusions clearly have propositional content
  (the sentence "my wife is an impostor" is true or false), so the claim is confused.
  This is a big subtle mistake.

  2. The action argument: failure to act on the delusion doesn''t unambiguously show
  non-belief. Beliefs do not always produce corresponding actions; individuals often
  hold beliefs without acting on them across all contexts (inert beliefs), and acting
  on a belief can be outweighed by other considerations (emotional attachment, habit,
  practical cost). Also, many Capgras patients do act on the delusion in some ways
  (e.g., hostility, contacting police, refusing to accept the person). The "double-bookkeeping"
  where patients alternate is debated. The student presents it as decisive, but at
  most it shifts the burden and motivates anti-doxasticism; doxasticists have replies.

