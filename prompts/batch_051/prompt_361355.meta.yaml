  "Below are the criteria I was taught for deciding whether program B is a derivative
  work of program A under a copyleft license:


  1. Expression: B contains code copied from A, or a translation/adaptation of A''s
  code (e.g., porting, scripting, machine translation between languages).

  2. Combination: A and B are compiled or linked into a single executable or share
  an address space at runtime, so the operating definition of ''the program'' includes
  both.

  3. Functional dependence: B is unusable or meaningless without A — it exists only
  to invoke A''s functionality, not as a standalone tool.

  4. Interface depth: A and B exchange structured internal data or function calls
  through an interface that exists for A''s sake, rather than through a general-purpose
  mechanism like a command line, a pipe, a network socket, or a file in a neutral
  format.


  Now consider this case. A physics simulation package, SimCore, is released under
  a strong copyleft license. A startup has written a closed-source visualizer called
  ViewSim. ViewSim ships with no SimCore code. At launch, ViewSim starts a copy of
  SimCore as a subprocess and keeps it running invisibly. It sends SimCore commands
  over the process''s standard input, using SimCore''s documented text command language,
  and parses SimCore''s standard output to draw the scene. When the user edits the
  simulation, ViewSim rewrites a plain-text scene file in the format SimCore reads
