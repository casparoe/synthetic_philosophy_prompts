  Draft 2:


  "Here are the criteria I was taught for deciding whether program B is a derivative
  work of program A, for purposes of a strong copyleft license:


  1. Copied expression: B contains code taken from A, or a close translation of A''s
  code into another language or form.

  2. Combination: A and B are compiled, linked, or loaded into the same executable
  or shared address space, so that the running thing the user operates is best described
  as one program.

  3. Functional dependence: B is useless, or nearly so, without A — it exists to drive
  or display A''s functionality rather than to stand as an independent tool.

  4. Interface depth: A and B exchange structured, A-specific data or commands through
  an interface that exists primarily for A''s internals, rather than through a general-purpose
  mechanism such as an ordinary command line, a generic file format, a pipe, or a
  network socket.


  Now consider this case. SimCore is a physics simulation package released under a
  strong copyleft license. A startup sells ViewSim, a closed-source 3D visualizer
  for SimCore. ViewSim ships without any SimCore code: no source files, no headers,
  no build scripts. When ViewSim starts, it locates SimCore on the user''s machine
  and launches it as a separate subprocess. The two communicate only by text: ViewSim
  writes a scene file in SimCore''s scene format, then sends SimCore instructions
  over the subprocess''s standard input and reads its standard output to draw the
  result. The protocol ViewSim uses is not SimCore''s documented end-user command
  language; it is a fine-grained control interface that SimCore''s own test harness
  uses, exposing operations like advancing one simulation step at a time or reading
  the raw value of a field at a mesh point. ViewSim learned the protocol by running
  SimCore''s test suite and reimplemented the client side from scratch. At no point
  do the two programs share memory or an address space, and no SimCore code is reproduced
  in ViewSim. ViewSim cannot simulate anything on its own: if SimCore is not installed,
  ViewSim refuses to start.


  Is ViewSim a derivative work of SimCore under these criteria? Work through the four
  criteria one at a time, say where each is satisfied, violated, or left underdetermined,
  and then answer the underlying question: is the boundary between one program and
  another best drawn at the process boundary and copied expression, or can it also
  be drawn at functional dependence and the intimacy of the interface? If the criteria
  give conflicting answers, identify which criterion is doing the real work and whether
  it should be revised."


