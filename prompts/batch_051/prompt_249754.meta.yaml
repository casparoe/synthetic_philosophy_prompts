  ---


  I am preparing a single 90-minute session for a public-library reading group of
  intelligent non-specialists — a retired nurse, a civil engineer, a parish administrator,
  a part-time magistrate, and a few others — none of whom have studied philosophy
  and most of whom hold the firm, unexamined view that people ordinarily deserve the
  praise and blame they get. I want to explain Galen Strawson''s Basic Argument against
  ultimate moral responsibility so that the group genuinely grasps the regress and
  can run it themselves, rather than merely hearing it described and then rejecting
  it as an intellectual curiosity.


  Please give me a teaching plan, not the explanation itself, and structure the response
  in the following sections, in this order, with roughly the indicated lengths:


  1. Sequence and dependencies (about 40%). Lay out the components in the order they
  must be introduced, and for each step say what earlier step it depends on and why
  it cannot come sooner. Include the opening move, made before any thesis is stated,
  so that the audience does not hear the conclusion as the absurd claim that nobody
  ever really acts or chooses. The plan must be built so that the argument''s independence
  from determinism is a load-bearing insight introduced at the right moment rather
  than a footnote near the end. Say also when and how the qualifier ultimate in "ultimate
  moral responsibility" gets cashed out, since the whole session turns on it.


  2. The carrying example (about 20%). Specify the one example or case that will carry
  the argument through the entire session: what it must have and what it must lack,
  and how the same example is revisited at each step of the sequence. It should be
  a small, everyday moral failure rather than a dramatic crime, and you should explain
  why that constraint matters for this particular audience.


