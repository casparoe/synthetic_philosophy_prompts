  calling ''invitationism'' (bad name, sorry), is that when someone says ''you should
  read this, it''s devastating'' or ''that film is a masterpiece,'' they usually aren''t
  asserting something that could be true or false. They''re issuing an invitation
  to an experience. Like ''come to dinner'' or ''you should visit Florence.'' Invitations
  can be accepted or declined; they can be welcome, annoying, badly timed, or half-hearted,
  but they aren''t the sort of thing that stands in need of justification in the way
  testimony does. So the pessimist who says you can''t be justified in believing a
  film is good on someone else''s say-so, and the optimist who says you can, are both
  wrong about what kind of speech act is going on in the central cases. The reason
  my friend''s rave review of a movie doesn''t make it rational for me to believe
