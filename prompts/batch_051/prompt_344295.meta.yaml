  "I''m taking a course on suffering-focused ethics and I keep thinking about one
  real case that seems like a natural experiment. Up until roughly the late 1980s,
  it was standard practice in many hospitals for newborn and premature infants to
  undergo major surgery (heart surgery, even) without pain relief. The reasoning wasn''t
  cruelty: many doctors genuinely believed the infant nervous system was too immature
  to register pain, and they worried anesthesia was too dangerous for a baby. Some
  infants were given only a paralytic drug so they wouldn''t thrash around — meaning
  they experienced the surgery (if they experienced anything) while unable to move
  or cry. Then in the 1980s, studies began showing that infants mount a huge stress
  response to surgery and that giving actual analgesia improves their outcomes, and
  practice changed fast. I''d like you to analyze this episode through the lens of
  a suffering-focused ethic — the family of views that gives the reduction or prevention
  of suffering a special, maybe overriding, moral priority. What should a serious
  suffering-focused ethicist in 1975 have said about this practice, on the evidence
  available then? Which features of the episode does the view explain well (e.g.,
  the irrelevance of the fact that the infant won''t remember, the moral status of
  pain that isn''t expressed), and which features does it struggle with or misdescribe
  — for example, the fact that the real crux looks like an empirical question about
  whose pain reports (or lack of them) get taken seriously, and the risk tradeoff
  between certainty of pain and small risk of death from anesthesia? And what does
  the episode tell us about what a suffering-focused ethic still needs to solve before
  it can guide practice — is the weakness here in the axiology, or somewhere else
  entirely?"


