  didn''t explicitly foresee, because the teacher''s feedback plus the child-machine''s
  initial structure does the work, not a fully specified adult program.

  2. It replaces the question "can a machine be intelligent?" with the question "can
  a machine be educated?" and treats the second as weaker and more tractable.

  3. It supports an anti-intellectualist reading of human intelligence: we ourselves
  start as child minds and get educated, so the adult mind is already the product
  of teaching rather than built-in content.

  4. It anticipates modern machine learning by making learning rules and feedback
