  Draft:


  "I''m a novelist, so in theory I''m in the business of other people''s heads. But
  I''ve started to notice a weird split in myself, and I don''t know what to call
  it. On the one hand I''d swear I believe, with total sincerity, that every stranger
  walking past me has an inner life as thick and granular as mine — an ongoing hum
  of memories, plans, private jokes, whatever. On the other hand, my attention doesn''t
  seem to have gotten the memo. Left to itself, it hands me low-resolution versions
  of people. The guy who fixed my boiler last week exists in my mind as a mood and
  a pair of hands and one or two stock worries; I have a whole weather system. It''s
  not that I doubt he has interiors; I just catch myself filing him as a supporting
  part. If I make an effort, I can ''open the lens'' and imagine him as the protagonist
  of his own day, with rooms I can''t see and a backstory I''d never guess. But it''s
  exactly that — an effort, like the effort of writing a minor character well. And
  the moment I stop paying the bill, he collapses back into a bit-part."


  "Writing fiction shows me the same mechanism from the other side. My first drafts
  always have the point-of-view character brimming with layered thought, while the
  secondary characters get, if I''m honest, one want, one wound, and a speech tic.
  I know the fix is to spend some ''interiority budget'' on them, and once I do they
  thicken up. But the thing interests me: my default as a novelist and my default
  as a person are the same default. So here is what I want to know. Is there a name
  for that default — the automatic, doxastically unsupported habit of treating other
  minds as lower-resolution than my own? I know it isn''t solipsism, because I genuinely
  disbelieve the solipsist''s picture; and it isn''t the little rush you get when
  you remember a stranger has a whole life — that feels like the exception that proves
  the thing exists. Is it just selfishness or absentmindedness, or is it its own thing?
  And if there''s no name, what should it be called, and how would you keep it from
