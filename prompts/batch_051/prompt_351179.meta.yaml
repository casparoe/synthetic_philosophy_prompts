  I recently had a long argument with a friend about the "AI safety via debate" proposal
  — the idea that two AI systems could present arguments for and against a claim while
  a human judge decides, and that this would let a human supervise systems smarter
  than them. My friend kept insisting that the proposal is empty for the fallible
  judge. After going around in circles, I''ve tried to press my friend''s worry into
  a compact argument, but I can''t tell whether it actually goes through or where
  it overreaches. I''ve numbered it below.


  (1) A debate between two agents lets a human judge identify the more truthful answer
  only if, whenever the dishonest agent offers a misleading argument, the honest agent
  can offer a rebuttal the judge finds more convincing. (2) But an honest rebuttal
  can be more convincing to a judge than the misleading argument only if the judge
  can see that some specific step of the misleading argument fails — that a premise
  is false, the inference is invalid, or a key fact has been omitted in a way that
  matters. (3) A judge can see that a specific step fails only by checking that step
  against the subject matter itself, which is exactly the kind of checking the debate
  was supposed to spare the judge from doing on the whole answer. (4) And a sufficiently
  capable arguer can construct "obfuscated" arguments: misleading chains in which
  every single step, checked from the judge''s limited vantage point, looks individually
  plausible, so that no step can be pinned down as the failure. (5) Therefore, for
  obfuscated arguments, the judge cannot see that any specific step fails. (6) Therefore
  the honest agent cannot produce a rebuttal the judge finds more convincing. (7)
  Therefore debate does not, in general, let a human judge reliably identify the more
  truthful answer. I can''t tell whether the flaw is in (2) — maybe a judge can reasonably
  reject the whole argument without pinpointing the bad step — in (4), or somewhere
  else. Is the argument valid as it stands? If it fails, say exactly which step is
  the first to fail and what the corrected version of that step would need to say.


