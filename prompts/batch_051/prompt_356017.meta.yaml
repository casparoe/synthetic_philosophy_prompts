  Prompt text:


  "My training is in evolutionary biology, and my comfortable working vocabulary runs
  to fitness landscapes, honest signals, the handicap principle, Fisherian runaway,
  kin and group selection, mismatch, exaptation and spandrels. I have no philosophical
  training, and I want not an introduction to the literature but a translation into
  the terms I already think in.


  There is a long-standing philosophical argument about whether excellence can be
  good when no one benefits from it: whether a technically superb performance that
  no audience ever hears, an achievement no one learns of, or a capacity developed
  and exercised in perfect privacy is worth pursuing, or whether its value is exhausted
  by the good it does for others. The positions I have in mind are roughly these:
  (1) excellent exercise of a human capacity is good in itself, final and not instrumental;
  (2) such exercise is only as good as its downstream benefit to some sentient being,
  and a private, unobserved excellence is at best wasted; (3) what gives an achievement
  its value is the difficult process of bringing skill to bear against resistance,
  so that the value is in the doing rather than in any audience or product.


  Restate each of these three positions in my vocabulary as faithfully as possible.
  For each, say which parts translate cleanly, which parts you had to bend to make
  them fit, and which parts have no expression at all in fitness-and-signalling terms.
  Then give me the residue report that matters to me: after the translation is done,
  does the sentence ''excellence is good for its own sake'' survive as a substantive
  claim, or does it shrink to ''we have evolved to admire costly, difficult-to-fake
  performances''? If it shrinks, tell me whether that is because my vocabulary is
  missing something the debate is actually about, or because the original claim was
  doing less work than it appeared. And do not quietly assume that what selection
  has made us admire is what we ought to value; if any translation needs that assumption,
  say so and flag it as an import, not a translation."


