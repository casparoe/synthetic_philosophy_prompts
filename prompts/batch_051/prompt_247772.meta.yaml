  ---


  I recently had a long argument with a friend about whether it does any real work
  to describe a pathogen, a climate shift, or a volcanic eruption as a historical
  actor, and I came away unable to say exactly where his central analogy failed. As
  he presented it, a human actor in history has three features: standing dispositions
  accumulated from prior circumstances, a trigger that activates them, and an action
  that forecloses some futures and opens others for everyone downstream. A volcano,
  he argued, has all three: an internal state built up over time (pressure, stored
  magma), a triggering event, and an eruption that violently changes what remains
  possible for the human societies around it. A pathogen has a genome, a reservoir
  or host population, and transmission dynamics; a drought has slowly accumulating
  atmospheric or oceanic conditions, a threshold, and a cascade of crop failures.
  He granted the obvious disanalogies — no beliefs, no desires, no deliberation, no
  intentions, no responsibility — but insisted that these are exactly the disanalogies
  that do not matter, because his claim was about explanation rather than blame. For
  explanatory purposes, he concluded, the difference between a king ordering an invasion
  and a drought collapsing a state is one of degree, not kind: both are nodes that,
  once triggered, redistribute what is possible, and both can occupy the same slot
  in a narrative. He saw this as the only honest way to avoid a history that treats
  human choice as the sole motor of events; I suspected it quietly licenses environmental
  determinism, but I could not make the objection precise without simply insisting
  that humans are different.


  I would like you to audit this analogy. Start with the explicit correspondence table:
  what in the nonhuman case is supposed to play the role of disposition, trigger,
  action, and consequence, and which terms from the human side — intention, deliberation,
  choice among perceived alternatives, responsiveness to reasons, answerability —
  have no counterpart at all. Then separate the disanalogies that matter for his explanatory
  conclusion from those that do not. In particular, does anything in the human-actor
  image smuggle in a unity, narrativity, or personhood that climate and disease lack,
