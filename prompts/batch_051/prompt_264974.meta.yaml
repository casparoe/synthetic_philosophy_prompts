  Prompt:


  "I''ve been reading about the old debate between ''internal'' and ''contextual''
  history of science, and I keep going back and forth on a specific case: early modern
  geometry before the limit concept. On reflection I''m persuaded that to say Newton
  ''took a limit'' or that Archimedes ''used integration'' is anachronism: the words
  pick out conceptual apparatus that didn''t exist in their texts, and reading it
  in makes their arguments seem to solve problems they weren''t even posing. At the
  same time, I can''t wholly shake the intuition that there is a real and nontrivial
  sense in which Archimedes did integrate — he applies a systematic method of exhaustion
  to parabolic segments, and the procedure has a precise formal translation into modern
  integral calculus. So I''m torn between a theory (anti-anachronism: mathematical
  concepts are historically individuated, so retrojecting them falsifies) and a firm
  intuition (mathematical content is more fine-grained than vocabulary: there can
  be genuine sameness across notation). Which should yield? Present the strongest
  version of each side and give me a negotiated verdict: where can ''he integrated''
  be defended as true in a stripped-down sense, and where is it misleading even if
  translatable? What would justify giving up the anti-anachronist principle rather
  than qualifying it?"


