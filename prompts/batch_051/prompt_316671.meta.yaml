  Argument for methodological individualism (let''s call it "the reduction argument"):


  1. A social structure is nothing over and above the individuals that constitute
  it and their properties, relations, and interactions.

  2. If X is nothing over and above Y, then any causal/explanatory claim about X is
  equivalent to (or can be replaced by) a claim about Y.

  3. Therefore, any causal claim about a social structure is equivalent to a claim
  about the individuals composing it.

  4. A satisfactory explanation of a social event must state its causes truthfully.

  5. Hence, any satisfactory social-structural explanation can be restated, without
  loss, as an individual-level explanation; structural explanations are at best shorthand.


