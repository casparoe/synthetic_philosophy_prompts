  ---


  I have never studied philosophy, so I have had to work this out from my own reactions
  rather than from anything I have read. For the past year I have been trying to settle
  a plain question: where does my own mind end and everything outside it begin? I
  have kept a list of cases and my honest first verdicts. I want to know whether a
  single principle captures them, or whether some of my verdicts should be overturned.


  Here are the cases.


  1. My uncle had a stroke that damaged his memory. He now keeps a thick binder with
  the names and faces of relatives, the story of his own life, and instructions he
  has written to himself about managing his day. He consults it constantly and treats
  its contents as authoritative as his own recall. When the binder was once mislaid,
  he described the sensation not as losing an object but as forgetting a stretch of
  his own past. I think he was right: that binder is part of his memory.


  2. My phone contains all my contacts and appointments. Without it I could not reach
  most of the people I know or be on time for anything. Yet I would never say my phone
  is part of my mind. It feels like a tool I consult, not a part of me. I cannot explain
  why the binder feels different from the phone, but it does.


  3. A blind friend of mine walks with a long cane. After years of practice, he says
  he feels the texture of the pavement at the tip of the cane, not in his hand, and
  watching him move I believe him. I think that while he walks, the cane is part of
  his perceiving, not merely a device that reports to him.


  4. When I work through a difficult geometry or layout problem, I draw rough figures
  and stare at them and correct them. If someone takes the page away in the middle,
  my thinking stops, not just my drawing. I think the page is genuinely part of my
  reasoning during the work.


  5. When I use a calculator, the arithmetic does not seem to happen in my mind. The
  machine computes for me; I have the result, but not the way I have an answer I reached
  mentally. I would not call the calculator part of my calculating, even while I am
  using it.


  6. When I drive somewhere unfamiliar with GPS, I follow spoken directions and arrive
  with no mental map of where I have been. The navigating happens outside me: the
  phone knows the route and I obey it. I do not think the GPS is part of my navigating.


  7. My spouse remembers most of our social obligations and reminds me when they are
  approaching. I rely on him at least as much as I rely on my phone. But I do not
  think his memory is part of mine; he is another person, with his own mind. Although
  I catch myself saying "we forgot," which gives me pause.


  The closest I have come to a rule is this: a thing becomes part of someone''s own
  mind when its contents were put there by that person and it is available in the
  smooth, unhesitating way that memory or perception are available. But I can already
  see trouble. On that rule, my phone should count, because I entered every contact
  myself and I use it without thinking, yet I excluded it. And the rule would exclude
  my blind friend''s cane, because he did not write anything in it, yet I included
  it. So either the rule is wrong, or some of my reactions are.


  There is one further case I cannot settle. A colleague has a severe problem recognizing
  faces. He wears a small camera and earpiece that matches people he sees against
  a database he built himself and whispers their names to him. He says it now feels
  like recognizing people, just slightly slower and less vivid than it once did. I
  cannot decide whether his device is more like the binder and the cane, or more like
  the phone and the GPS.


  Please tell me whether there is one defensible principle that captures my verdicts,
  or nearly all of them. State it as precisely as you can, show how it handles each
  of the seven cases, say plainly which of my verdicts it forces me to give up and
  why, and then apply it to the name-whispering device. If no single principle will
  do, I would rather hear that than have you bend one out of shape to save every case;
  in that case, give me the smallest set of principles that can do the work.


