  Ok so I just got back from a long argument with a friend and I need somebody to
  help me figure out which of us was actually making the stronger point.


  The argument was about whether a finite mind would eventually run out of experiences.
  My friend kept pushing this line: the brain only has finitely many neurons and finitely
  many ways to arrange them (or at least finitely many relevantly different arrangements),
  so there are only finitely many possible brain states. Each distinct experience
  just is a distinct brain state. So there are finitely many possible experiences.
  Live forever, and eventually you have had every experience at least once, after
  which you''re stuck in reruns. Nothing actually new could ever happen to you again.


  I kept resisting him. My move was: the world is not the brain. Even if your internal
  states are finite, the world can feed you an endless sequence of new inputs, so
  the stream of experiences could stay novel forever. The same internal state paired
  with a different external fact or a different history is not "the same experience."
  I compared it to a finite-state machine reading an infinite tape: states repeat,
  but the sequence of state-plus-input pairs doesn''t have to. He answered that this
  is cheating, because an input only matters once it has changed your state; the world
  can surprise you only by putting you in a state you''ve already been in, so over
  an infinite life the novelty still runs out. We went in circles for hours.


  I''m a systems programmer, so the vocabulary I actually think in is states, transition
  tables, state spaces, inputs, outputs, determinism vs nondeterminism, reachable
  states, eventual periodicity, observability. It''s not just an analogy to me, its
