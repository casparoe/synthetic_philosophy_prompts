  issues: (a) step (5) requires that moral theories can assign unboundedly large values
  — maybe moral value is bounded or normalized, which is a substantive position; (b)
  the move from (2)-(4) presupposes intertheoretic comparability, i.e., that the "huge
  value" in the wild theory is on the same scale as ordinary theories'' values; (c)
  "take seriously" in (1) might exclude theories with arbitrary scale; (d) the final
  "can''t be required" is a form of conservatism that may have its own costs.


