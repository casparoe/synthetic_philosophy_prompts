  Moral uncertainty / expected choiceworthiness setup:


  - There are multiple first-order moral theories you might assign credence to: utilitarianism,
  Kantianism, common-sense deontology, maybe a demanding altruistic view.

  - The standard approach (MEC): choose the option with maximal expected choiceworthiness,
  where the choiceworthiness of an option is the weighted sum over theories of credence
  × theory''s degree of choiceworthiness for that option.

  - Problem 1: intertheoretic comparability — how do you compare "units" of choiceworthiness
  across Kant and utilitarianism? Some deny comparability; there are normalisation
  proposals (variance voting, range voting, etc.).

  - Problem 2: fanaticism — tiny credence in a theory that assigns enormous value
  to some action swamps everything.


  An argument that seems to prove too much:


  (1) Under moral uncertainty, I should maximize expected choiceworthiness across
  the moral theories I take seriously.

  (2) I have some nonzero credence in a theory according to which donating to [some
  cause] produces huge value per dollar — say, orders of magnitude more than any ordinary
  theory allows.

  (3) For any ordinary option, the expected choiceworthiness of donating everything
  to that cause is higher.

  (4) So MEC demands I donate essentially all my resources to that cause.

  (5) This holds even if my credence in that theory is one in a billion, provided
  the theory assigns a large enough value.

  (6) But I can''t be rationally required to do something on the basis of a credence
  that tiny in a theory that wild.

  (7) Therefore MEC is false — but then what''s the alternative?


