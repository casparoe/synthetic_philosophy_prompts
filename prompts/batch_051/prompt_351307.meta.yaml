  Key philosophical issue: What kind of thing is a musical work? Classical view (Platonist):
  a work is an abstract type (a sound structure or a normative kind), performances
  are tokens/instances, recordings might be instances too or representations. Nominalism:
  works are identified with sets of performances or with score-notation. Another view:
  works are "indicated" by historical acts of composition; a performance must follow
  the score and be intended to be of that work. Recordings: in rock/jazz, the recording
  is often the work itself (the track), not a performance of an independent work (Theodore
  Gracyk''s "work and performance" view vs. "phonographic" works). Jazz improvisation:
  each performance may be considered a unique work or no work at all. Covers vs. performances.
  The type/token distinction: performances are tokens of the work-type, but this doesn''t
  fully explain identity conditions (which changes count as same work).


