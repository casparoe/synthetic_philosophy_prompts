  ---


  Next month I am leading the monthly discussion at my local Stoicism meetup, a group
  of people who came to Stoicism mostly through popular books and through CBT-style
  therapy, not through academic philosophy. I have proposed a session arguing that
  the modern "dichotomy of control" is not a neutral restatement of ancient Stoicism
  but a distortion of it, and that the popular version quietly depends on commitments
  that most people in the modern revival do not actually accept.


  My position, briefly: the ancient Stoics treated the distinction between what is
  up to us and what is not as downstream of a larger picture of what a person is and
  what makes a life go well. What is up to us is the use of our judgments, desires,
  and choices; everything else — health, wealth, reputation, even whether an action
  we take succeeds — falls outside, and is valuable only in a secondary way. That
  is why the old archer example makes sense to them: the skill is in aiming well,
  not in whether the wind gives you the bullseye. The modern revival, by contrast,
  wants the dichotomy as a standalone technique for reducing distress while continuing
  to care intensely about outcomes like health, relationships, and career. So the
  modern version either quietly stretches "in your control" to mean "influence" or
  "effort" — which is a different doctrine — or it keeps the ancient meaning and commits
  its users to an indifference toward their own bodies and failures that most of them
  do not live by. I want to argue the revival should stop claiming Epictetus''s authority
  and either defend its own narrower psychological claim or give up the dichotomy
  as a principle.


  The audience will be about forty people, mostly professionals in their thirties
  and forties. Several have told me the dichotomy of control is the single most useful
  thing they have taken from Stoicism, and at least one or two have read the Enchiridion
  in translation and will push back with details from the text; others will defend
  the practice on the grounds that it works and will be suspicious of anything that
  sounds like academic nitpicking. A few have read the modern books that add a third
  category of "partial control," and they will offer that as a repair.


  Write me a Q&A prep sheet for the discussion: the eight or so objections I will
