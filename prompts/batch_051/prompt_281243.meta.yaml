  Let''s focus: Causation by omission is about whether absences can be causes. Standard
  debaters: it''s counterintuitive to say absences cause, but we do attribute (the
  drought caused the famine). The philosophical issue: causation is usually a relation
  between events/things; omissions aren''t events. Counterfactual accounts easily
  treat omissions as causes because if the omission hadn''t happened (e.g., gardener
  had watered) the effect wouldn''t have occurred. Normative accounts question whether
  all omissions count.


