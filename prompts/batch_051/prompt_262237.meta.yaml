  ---


  I keep hitting the same question in my work, and I want to think about it rigorously
  rather than by intuition. I spend a lot of time building systems that act as if
  they represent the world: a path planner avoids a region because it ''expects''
  delays there; a perception model slows the vehicle because it ''thinks'' a pedestrian
  might enter the crosswalk. I don''t know whether those ways of speaking are literal
  or just convenient. The easiest way to decide is to get precise about what a belief
  is. So I''m asking for a working definition of the contested term ''belief'' — one
  precise enough to be run, function-like, against a set of test cases, including
  edge cases.


  Here are the cases I want the definition to get right. First, the clear positives.
  A person sincerely, stably asserts that it is raining, takes an umbrella under clear
  skies? Wait, no: the person asserts it''s raining and takes an umbrella, cancels
  outdoor plans... Keep it stable and acted upon. I want this case to count as a belief.
  Second, clear negatives: a thermostat registers that the room is below the target
  temperature and closes a circuit. I want this not to count, though I acknowledge
  that both devices have internal states that track the world and guide behavior;
  the definition should explain what the person has that the thermostat lacks.


  Then the hard cases:

  1. A chess engine that, after search, evaluates a position as losing and avoids
  the move it would otherwise play. Does it believe the position is losing?

  2. A self-driving car''s prediction system assigns 0.8 to a pedestrian entering
  the crosswalk and the car slows. Is that a belief that the pedestrian will cross?

  3. A person sincerely reports egalitarian views and would disavow any prejudice,
  yet their behavior across timed classification tasks and hiring simulations shows
  systematic differential treatment. Do they believe, in any sense, that the group
  is inferior? (Some people might call this implicit bias?; not sure wording.)

  4. Someone with a delusion states that a family member has been replaced by an identical
  impostor, but behaves in most contexts as though the family member is who they appear
  to be and doesn''t search for the original. Do they believe the impostor claim?

  5. A large language model receives the prompt "What is the capital of Spain?" and,
  in a single forward pass, outputs "Madrid." Does the network believe that Madrid
  is the capital of Spain? (Notably, no deliberation or stored proposition, but the
  weights encode a disposition?)

  6. Maybe a person who has forgotten but would, if reminded...? Too many. 5 hard
  cases enough.


