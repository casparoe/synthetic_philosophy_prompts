  The asker''s commitments might be:


  - I think Hayek is basically right that market prices aggregate dispersed private
  information in a way no central planner could replicate.

  - I accept Milgrom and Stokey''s no-trade theorem result: when traders are rational
  and have common priors, differences in information alone cannot generate trade,
  because each would infer information from the other''s willingness to trade.

  - I think real speculative markets do something valuable — they impound information
  into prices.

  - I think stock trading is often driven by differences of opinion, not just differences
  in endowments/hedging needs.

  - I think bubbles show that prices can detach from fundamentals for long stretches.

  - Maybe: I think the kind of information Hayek praises is precisely the kind of
  private, dispersed beliefs that the no-trade theorem says cannot be exploited for
  mutual gain without irrationality or prior differences.


