  Once we file, agencies often fight by attrition: over-broad objections, slow-rolled
  document production, depositions, and interlocutory appeals. At each major step
  I have to decide whether to keep funding a case that has already cost more than
  we budgeted. These decisions come up five or six times a year, involve amounts between
  $150,000 and $800,000 of an annual budget of roughly $3 million, and I typically
  have a week to decide before the next filing deadline. I have no economics training,
  and my staff are litigators, not decision scientists.


  Martin Shubik''s 1971 paper introduced a game of this kind: an auction in which
  the high bidder wins a dollar and pays his bid, but the second-highest bidder also
  pays his bid and receives nothing. Once the bidding passes a dollar, both remaining
  bidders face a choice between bidding again to avoid losing their already-spent
  bid and dropping out to avoid throwing more money after a losing position; the structure
  can drive both bidders to spend far more than the prize. I suspect my agency litigation
  is a slow-motion version of this, with legal fees as the bids, the judgment or settlement
  as the prize, and the agency''s own litigation costs as its second-place payment.


  Please write a reusable decision procedure I can run at the start of each major
  litigation phase, grounded in what the dollar auction and escalation-of-commitment
  literature actually shows. It should be a sequence of questions an associate can
  work through in a day, with what counts as a sufficient answer to each, where the
  procedure says stop, where it says continue, and where it says the decision is a
  values judgment I must make rather than a mechanical output. The procedure must
  specifically handle the two-party dynamic (the agency is also spending resources,
  and my decision to continue changes the cost it expects to pay), the difference
