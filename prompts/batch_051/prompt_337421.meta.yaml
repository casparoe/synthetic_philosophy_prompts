  Background: The unilateralist''s curse: a group of independent actors, each can
  take an irrevocable action affecting all; since each acts on their own estimate,
  the most optimistic member tends to act even when group consensus would oppose.
  Common solutions: require unanimity, delegate to authority. But those produce gridlock
