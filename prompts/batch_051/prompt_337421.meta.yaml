  Mechanism idea 1: "Unilateral action bond with retroactive review." The consortium
  adopts this rule: any member may take a unilateral action, but beforehand they must
  deposit a bond of size B into escrow. After the consequences are known (or after
  a fixed horizon), the other members vote on whether the action was net-beneficial
  ex post. If a supermajority votes ''yes'', the bond is returned; if not, the bond
  is forfeited to the other members in proportion to their losses (or to a common
  fund). This creates a cost for actions that the group would later condemn, aligning
  the actor''s incentives with the group''s posterior. But it has many failure modes:
  risk aversion and the entrepreneur''s curse (actors with no capital), hindsight
  bias in the vote, strategic votes to punish rivals or protect one''s own prior actions,
  sunk costs, inability to post bond for catastrophic risks (judgment-proof problem),
  temporal mismatch (ex post review cannot save those already harmed), and the fact
  that bad outcomes vs bad decisions diverge (outcome bias). Could also create a chilling
  effect on beneficial but initially controversial unilateral actions, because ex
  post majorities may be conservative. Fixes: pre-registration of criteria, cause-based
  review (decide based on ex ante expected value given public info) or blinded juries,
  third-party actuaries, insurance. Hmm, this is rich but is it too similar to the
  planning-deposit example? The example includes deposit refunded if objection succeeds;
  my mechanism is a deposit refunded if group later approves. Similar but distinct
