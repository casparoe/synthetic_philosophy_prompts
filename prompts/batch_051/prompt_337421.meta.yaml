  even if the group''s average/consensus view is that it''s harmful. The person with
  the most extreme positive estimate acts. This is worsened when there''s asymmetry:
  no one can act to *prevent* the action; only acts to *perform* it. The curse is
  particularly bad for "low-probability high-stakes" actions with irreversible bad
  outcomes.


