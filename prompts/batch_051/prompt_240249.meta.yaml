  to them in writing. My current commitments are these:


  (1) When public health systems allocate scarce resources, they should aim to maximize
  the expected number of quality-adjusted life years (QALYs) produced.

  (2) Triage and allocation rules must not deprioritize disabled patients; disability
  should not count against the value of someone''s remaining life.

  (3) Age may matter only in a narrow fair-innings sense: between patients with equal
  expected QALY gain, it can be acceptable to prioritize a 25-year-old over an 85-year-old,
  but an 85-year-old''s remaining years are not worthless.

  (4) When agencies set the value of a statistical life, they should use estimates
  based on individuals'' own willingness to pay for small reductions in mortality
  risk, because individuals are the best judges of how much a given risk matters to
  them.

  (5) Allocating ordinary medical resources should not spend more to save a rich person''s
  life than a poor person''s simply because the rich person can pay more.

  (6) In a pandemic, a ventilator triage protocol may legitimately give some priority
  to frontline clinicians.

