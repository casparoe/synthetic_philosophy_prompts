  Prompt draft:


  "I''m taking a course on health policy and distributive ethics this term, and for
  my final paper I want to lay out a view on scarce-resource allocation. Before I
  write it up, I''d like a consistency check on the set of claims I find myself endorsing.
  My current commitments are:


  (a) When public systems allocate scarce health resources, they should aim to maximize
  the expected number of quality-adjusted life years (QALYs) produced.

  (b) We should reject triage rules that deprioritize disabled patients; disability
  is not a reason to treat someone''s life as worth less.

  (c) Age should matter in allocation only in a narrow fair-innings sense: between
  patients with equal expected QALY gain, a 25-year-old may be prioritized over an
  85-year-old, but an 85-year-old''s remaining years are not worthless.

  (d) A statistical life should be valued by aggregating individuals'' own willingness
  to pay to reduce small mortality risks, because people are the best judges of how
  much a given risk matters to them.

  (e) It would be wrong for a government to spend more to save a rich person''s life
  than a poor person''s life merely because the rich person is willing to pay more.

  (f) In a pandemic, a ventilator triage protocol may legitimately give some priority
  to frontline clinicians, not because their lives are more valuable, but to preserve
  the capacity to save others.

  (g) QALY-based cost-effectiveness should guide program and insurance coverage decisions,
  but bedside clinicians should not be telling individual patients that their life
  is too expensive."


