  Let me design a rich Type C prompt on reflective equilibrium:


  "Consider reflective equilibrium as a method of moral or philosophical justification.
  Please sort the following objections into three tiers — fatal, serious but answerable,
  and largely misplaced — according to how much damage they do to the claim that reflective
  equilibrium can yield justification (as opposed to mere coherence among the reasoner''s
  starting commitments). Give a one-sentence reason for each placement."


  Then list objections:

  1. The garbage in, garbage out objection: the method inherits whatever prejudices
  are embedded in the initial considered judgments, so it cannot provide independent
  leverage on them.

  2. The indeterminacy objection: different starting points / different orders of
  adjustment can lead to different equilibria, so the method yields no unique justified
  conclusion.

  3. The regress objection: the credibility of considered judgments themselves is
  what is at issue, so using them as inputs begs the question against the skeptic.

  4. The coherentism objection: reflective equilibrium at best establishes that a
  set of commitments is internally consistent, and a set of false commitments can
  be mutually supportive.

  5. The "wide equilibrium collapses into theory choice" objection: once you bring
  in background theories, the method just relocates the problem to which theories
  to accept.

  6. The psychologism/idealization objection: it describes an idealized process nobody
  actually performs and licenses no actual normative conclusion.


