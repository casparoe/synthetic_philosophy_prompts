  Type: Present an argument that seems to prove too much and ask where it goes wrong.
  Domain Hume on money and trade. The argument could be reconstructed:


  Reading Hume''s essay "Of the Balance of Trade," I encountered his thought experiment
  where four-fifths of all money in a country vanished overnight; Hume says prices
  would fall proportionably, and labor and goods would remain the real power. He extends
  this: whether money is scarce or abundant, after proportional price adjustment the
  nation''s real wealth is unchanged. From this someone in our study group built a
  stronger argument:


  (1) A nation''s real wealth consists in its goods, labor, and industry, not in its
  stock of money; money merely represents the proportion of these.

  (2) If the total stock of money changed but all prices and wages adjusted perfectly
  in proportion, then all relative prices, real balances, and incentives would be
  identical to before. (Maybe real balances not identical if nominal money changes
  with prices? If price level changes proportionally, real money stock same? Actually
  if nominal money doubles and prices double, real balances same. Yes.)

  (3) Since trade ultimately depends on real goods and industry and relative prices,
  any effect of a change in the money stock must come only from the transition, not
  from the new level.

  (4) But no transition can be perfectly instantaneous in a real economy; some prices
  adjust faster than others.

  (5) Therefore, any pure change in the money stock, however large or small, can affect
  the economy only through the temporary distortions caused by uneven adjustment.

  (6) So if you could engineer a money-stock change with perfectly even and anticipated
  price adjustment, it would be as if nothing happened; conversely, all real effects
  of monetary changes are mispricings, and there is no reason to prefer one steady
  money stock over another for its own sake.

  (7) This proves too much: it implies that the entire distinction between a rich
  and poor monetary policy is just a matter of transition costs, and that even a vanished
  money stock would be harmless if it happened smoothly.


