  Metzinger: the phenomenal self is a transparent self-model. Two notions: (1) the
  self-model is a representation generated by the organism (a model of the system
  as a whole embedded in the world); (2) transparency: the system lacks access to
  the earlier processing stages that constructed the model, so it experiences only
  their content and must take it as reality; the model is not introspectively available
  as a model. There is no "self" in the model; the model''s content includes a first-person
  perspective. "Ego Tunnel": subjectivity is a tunnel because we cannot see the walls.
  Also "phenomenal property of mineness" — the feeling that this body, this thought,
  is mine arises from the model, not from a substance. Ownership and agency: the self-model
  generates the sense of ownership; when damaged (e.g., alien hand, out-of-body, depersonalization),
  the transparency breaks.


  Film "Being John Malkovich": Craig Schwartz discovers a portal behind a filing cabinet
  on the 7½th floor that drops him into John Malkovich''s head for 15 minutes; he
  sees, hears, feels what Malkovich does—as a passenger, unable to control—then is
  ejected by the Jersey Turnpike. Later Craig learns to control Malkovich''s body,
  displacing Malkovich''s will, making Malkovich a passenger in his own body. Others
  pay to enter; the portal becomes a business. Malkovich himself enters his own portal
  and sees a world of Malkoviches. The questions: The film literalizes the first-person
  perspective as a place one can be inside and be ejected from; it separates the "point
  of view" (visual/auditory perspective) from the "self" (Craig has Malkovich''s perspective
  but not his sense of agency/mineness—initially). This maps onto Metzinger: the self-model
  is not just a point of view; it includes prereflexive mineness and agency, which
  Craig does not have full access to; he feels like a passenger. When Craig takes
  over, does he acquire mineness for Malkovich''s body? Or does it suggest ownership
  and agency are dissociable modules? The film''s fantasy that selfhood is an "occupiable"
  tunnel trades on a confusion: it imagines consciousness as a theater with a seat
  that can swap occupants (the Cartesian homunculus), whereas Metzinger''s transparency
  says there is no occupant separate from the model—the "passenger" is itself a model.
  But the film also dramatizes transparency in the way characters cannot "see" the
  machinery: Malkovich''s self is transparent to him until it is hijacked. Also the
  moment Malkovich enters his own portal: a mise en abyme—what is it like for a self-model
  to model itself? Metzinger says self-model is not the whole person; it''s a model.
  The scene where everyone is Malkovich could be a joke about what the tunnel looks
  like from inside.


