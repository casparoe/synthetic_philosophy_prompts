  Content for Fitch''s paradox prompt:

  The asker writes something like: "I have been working through an old argument in
  epistemic logic and I''m stuck; here''s the proof..." The paradox: Assume the "knowability
  principle" (KP): every truth is knowable, i.e., φ → ◇Kφ. Seems plausible to verificationists/anti-realists
  (truth can''t outrun possible knowledge). But the proof derives that every truth
  is actually known.


  Standard derivation:

  1. Let p be any true proposition that is not currently known: p ∧ ¬Kp.

  2. By KP, if (p ∧ ¬Kp) is true, then it''s possible to know it: ◇K(p ∧ ¬Kp).

  3. Knowledge distributes over conjunction: K(p ∧ ¬Kp) implies Kp ∧ K¬Kp.

  4. Knowledge is factive: K¬Kp implies ¬Kp. So K(p ∧ ¬Kp) implies Kp ∧ ¬Kp — contradiction.

  5. So it''s impossible to know (p ∧ ¬Kp): ¬◇K(p ∧ ¬Kp).

  6. By contraposition of KP, if something is impossible to know, it must not be true:
  from (2) and (5), ¬(p ∧ ¬Kp).

  7. So p → Kp (given p true, ¬Kp leads to p∧¬Kp which can''t be true). Thus all truths
  are known.

  But (7) is absurd: there are unknown truths.


