  "I have been trying to formalize an argument that was discussed in one of the old
  Yudkowsky–LW comment threads, and I want to know where it goes wrong because it
  seems to prove that a perfectly reasonable modal-epistemic principle entails omniscience.
  The argument is as follows. Let K be a knowledge operator and ◊ a possibility operator.
  Suppose the knowability principle: for every true proposition p, p → ◊Kp. Now suppose
  there is at least one truth that nobody in fact knows, and call the unknown proposition
  q. The conjunction q ∧ ¬Kq is true, but consider whether it can be known. If someone
  knew that q ∧ ¬Kq, then, since knowledge distributes over conjunction, that person
