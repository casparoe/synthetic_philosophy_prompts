  who eat them create no demand for egg production and do not harm the hen. So eating
  them is permissible.

  (3) The same applies to milk from a rescued cow who must be milked for her comfort
  after losing a calf; drinking it creates no demand for dairy.

  (4) The same applies to the body of a pig who dies of old age at the sanctuary;
  eating it creates no demand for pork, and the pig is beyond harm.

  (5) But by the same logic, a human who dies of natural causes and has left explicit,
  competent advance consent that their body be used "for whatever purpose prevents
  waste, including as food" would likewise be permissibly eaten.

  (6) Eating such a human would be wrong even with consent and even where no market
  in human meat exists; the wrongness is not explained by demand, harm, or waste.

  (7) So the freegan principle about waste and demand cannot explain even its own
  animal cases; if it condemns (5) but permits (4), it needs a further principle distinguishing
  human and non-human remains, and if it cannot supply one, then (1) is false and
  the waste argument proves too much.


