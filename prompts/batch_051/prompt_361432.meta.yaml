  Better structure:


  (1) Universalizability tests require a description of the circumstances under which
  the act is done. An act is permissible only if the maxim, with its description of
  circumstances, can be willed as universal law.


  (2) If circumstances are described thinly — for instance, "being a person with more
  money than needed for necessities, faced with someone else''s extreme destitution"
  — then I must will that everyone in that situation gives, and the logic yields something
  close to Singer''s conclusion that each of us in affluent circumstances is obligated
  to give until further giving would sacrifice something of comparable moral importance.


  (3) If circumstances are described thickly — "being me, with exactly my projects,
  relationships, psychological history, and precise resources" — then the maxim is
  one almost no one else could act on, and universalizability is trivially satisfied:
  I can will that the single agent who is exactly like me in all these respects acts
  as I do.


  (4) The choice between thin and thick descriptions cannot itself be settled by the
  test, because the test operates only after a description is fixed; any description
  can be made universalizable by adding detail, or made impossible by stripping detail
  away.


  (5) Therefore the universalizability test either yields Singer-style demands when
  applied thinly, or collapses into vacuity when applied thickly — and no application
  of the test tells us which description is the right one.


  (6) But universalizability is supposed to do the central work of filtering permissible
  from impermissible maxims; if it can be made to deliver any verdict by redescribing
  the circumstances, it provides no real constraint.


  (7) So either we reject the idea that universalizability is a substantive moral
  test (Hare''s universal prescriptivism, for example, was meant to exclude self-interested
  exceptions), or we must supply an independent account of relevant descriptions —
  but that account, not universalizability, would be doing all the moral work.


