  for pain: patients do not withdraw from painful stimuli, may laugh, describe the
  stimulus as "painful" but "not unpleasant" or deny that it bothers them. It''s different
  from congenital insensitivity to pain (which is absence of nociception). In asymbolia,
  sensory discrimination is preserved but the affective-motivational component is
  lost. This is well established enough for LLMs.


  Criteria proposal. Let me formulate criteria for pain (as a mental state/experience):


