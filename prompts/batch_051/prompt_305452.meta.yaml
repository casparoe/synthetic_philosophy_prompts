  IRL background: The core problem in inverse reinforcement learning is that observed
  behavior is consistent with infinitely many reward functions. In the simple discrete/optimal
  policy setting, any policy that is optimal for some reward function is also optimal
  for many reward functions; Ng & Russell (2000) formalized: for a policy to be optimal,
  the reward must satisfy a set of linear constraints (visiting preferred trajectories).
  The degenerate solution reward=0 everywhere makes all policies optimal. So without
  additional assumptions, the reward is wildly underdetermined. This puts us in a
  position: humans infer goals from behavior all the time with strong priors (efficiency,
  simplicity, shared preferences). But the raw IRL problem is ill-posed.


