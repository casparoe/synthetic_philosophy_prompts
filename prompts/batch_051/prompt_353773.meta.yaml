  the maximizing choice: conditional on that agent cooperating, there is a higher
  probability that similar counterparts cooperate, so the act is evidence about what
  one will get. Call this evidential cooperation in large worlds. The puzzling feature
  is that the act need not change anything outside the agent''s own mind to be, in
  this sense, worth doing.


