  ---

  After retiring from a research career in the physical sciences, I have been reading
  systematically in moral philosophy, and I would like an audit of a position I intend
  to defend at an interdisciplinary seminar. The position concerns the possibility
  of genuine moral dilemmas. I am less interested in a survey of the literature than
