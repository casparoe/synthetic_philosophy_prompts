  Tension points:


  1. Ought implies can, stated modally: an agent ought to φ only if φ is within the
  agent''s power (roughly, no obligations to do the impossible).


  2. Agglomeration: if an agent ought to do X and ought to do Y, then the agent ought
  to do X-and-Y. This seems to follow from what "all things considered" means.


  3. Genuine dilemmas exist: there are possible (indeed actual) circumstances in which
  an agent faces two mutually exclusive obligations, each of which remains binding,
  such that whatever the agent does she fails to do something she ought to have done.
  As a scientist I am inclined to think of this as the moral analogue of a system
  with incompatible constraints: the obligations do not dissolve merely because they
  cannot all be satisfied.


  4. Oughts in the relevant sense are all-things-considered verdicts, not merely pro
  tanto considerations; "you ought to do A and you ought to do B" in a dilemma is
  not just "there is something to be said for each."


