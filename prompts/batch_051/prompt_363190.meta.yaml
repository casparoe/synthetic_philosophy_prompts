  I hold the following:


  (1) Moral realism: there are stance-independent moral facts, at least about a core
  class of deontic considerations such as promise-keeping, truthfulness, and avoiding
  serious harm.


  (2) Rossian pluralism: these considerations are prima facie duties; when they conflict,
  the all-things-considered obligation is determined by whichever duty is weightiest
  in the circumstances, and the overridden duty ceases to be a live requirement.


  (3) Incommensurability: some conflicts involve considerations that cannot be completely
  ranked against one another, and in such cases there is no fact of the matter about
  which duty is weightiest.


  (4) Genuine dilemmas: in some of those incommensurable conflicts, both requirements
  remain genuinely binding; the agent cannot satisfy both; and whatever she does she
  violates a genuine obligation, leaving a moral remainder for which she is not necessarily
  blameworthy.


  (5) Ought implies can: an agent cannot be under an all-things-considered obligation
  to do something impossible.


  (6) No residual duties after right action: if an agent has done what she was all-things-considered
  required to do, then any overridden prima facie duty has lapsed, and no unmet moral
  demand remains; any remaining discomfort is not the response to a real obligation.


