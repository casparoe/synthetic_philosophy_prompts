  Full text:


  My friend and I spent most of a long car ride arguing about whether shame gets an
  unfairly bad name, and he ended up laying out a version of the anti-shame case I
  can''t get out of my head. I''m reconstructing it from memory, so I may have tightened
  it a little. He went something like this:


