  dependent on them, change; and how these altered structures interact with later
  developments such as the Black Death, the arrival of New World crops, and the shift
  of European gravity toward the Atlantic.


  For each major prediction, indicate whether you regard it as robust, conditional,
  or speculative. Say which effects follow directly from the changed constraint and
  which depend on further assumptions, and for the central predictions specify what
  evidence or consideration would most change your assessment, and where your chain
  of reasoning is most likely to fail.


