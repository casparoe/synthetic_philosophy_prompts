  Consider the following counterfactual. From the year 1000 CE onward, the Mediterranean
  basin develops a climate in which the characteristic summer drought is replaced
  by regular and reliable summer rainfall. Precisely: an extra 400 millimetres of
  rain falls across the basin and its immediate hinterlands during June to September,
  while winter precipitation, temperatures, winds and the geography of coasts, mountains,
  straits and islands remain unchanged. However meteorologically implausible this
  is, the state persists indefinitely, and the region''s inhabitants experience it
  simply as the weather. Nothing else changes at the outset.


  Give your best argued prediction of how the longue-durée structures of the Mediterranean
  world differ over the following six centuries, from roughly 1000 to 1600 CE. Trace
  the chain of reasoning through concrete mechanisms rather than telling a story.
  Address at least: how the new rainfall regime affects the dry-farming triad of wheat,
  olives and vines, and what replaces it; how settlement distributes itself between
  malarial lowlands, hill towns and mountains once lowland summer pasture and water
  are abundant; what happens to transhumance and the position of pastoral peoples;
  how the altered disease ecology reshapes demographic and political power; how storage
