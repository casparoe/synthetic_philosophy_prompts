  As I understand it, the updateless argument runs like this. In Newcomb-like problems,
  conditionalizing one''s choice on one''s current observation is a mistake: if the
  predictor has arranged the correlation between observation and outcome, then choosing
  the act that looks best conditional on observing X concedes the very correlation
  that makes a better general policy available. The remedy is to choose a policy —
  a mapping from each observation you might have made to an action — as if from a
  position before you learned which observation you have, and then merely implement
  the policy''s output at the observation you actually occupy. On this view, both
  evidential and causal decision theory are two special cases of the same error: they
  update, and then decide.


  The original setting tacitly assumes what is sometimes called a Cartesian picture:
  the agent sits outside the world or at its fixed boundary, receives an observation
  drawn from a definite space of possible observations, and selects a policy over
  that space while the world runs its course. Recent thinking about AI and about self-modeling
  systems has put pressure on exactly this picture. The agent is now described as
  embedded: it is itself part of the world, its computations are physical events with
  causal consequences, its own modeling of its options is among the things that can
  be correlated with outcomes, and there may be no vantage point from which a definite
  prior over ''the observations the agent might have made'' is well-defined, because
  the agent''s own construction and self-modification are among the possibilities
