  Ideas: "washing out of priors" — the claim that if two agents start with different
  priors but are both open-minded (assign positive prior probability to the true hypothesis)
  and update by Bayes''s rule on shared evidence, then their posterior probabilities
  for the true hypothesis will both converge to 1 almost surely (Doob''s martingale
  convergence theorem). Therefore, in the long run, their beliefs wash out. The too-much
  conclusion might be: "So any two Bayesians who share evidence must end up agreeing,
  and anyone who still disagrees after enough evidence is irrational."


  Where does it go wrong? The classic subtlety: Doob''s theorem gives almost sure
  convergence with respect to the *true* prior (the actual measure). For two agents
  with different priors, each is almost sure *by their own prior''s lights* that they
  will converge to certainty on the true hypothesis. But if their priors are mutually
  singular over the sequence space (or one hypothesis assigned zero probability),
  then what one is almost sure of may have probability zero under the other''s prior.
  Thus the "washing out" of priors in Doob''s theorem is a theorem about a single
  agent''s self-assurance: each agent expects to converge, but that doesn''t mean
  both will actually converge on a shared path, and it doesn''t imply actual agreement
  by any finite time.


  A common mistake: "With enough evidence, their posterior distributions will merge"
  — Blackwell-Dubins shows merging of *predictive* distributions if one prior is absolutely
  continuous with respect to the other. But merging of one-step-ahead predictions
  does not imply merging of posteriors over the entire hypothesis space; and if the
  priors are mutually singular, even predictive merging can fail. So both Aumann and
  B-D have conditions.


