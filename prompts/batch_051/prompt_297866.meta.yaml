  most reluctant to give up premises (1) and (2), since they are the least controversial
  parts of conditionalization.


  Here is the argument:


  (1) An ideal rational inquirer updates by strict conditionalization: upon learning
  new evidence E, her credence function becomes her old credence function, conditioned
  on E.


  (2) Consider a countable partition of hypotheses H_1, H_2, ... about an infinite
  sequence of observations, where each H_i fixes a conditional probability law over
  the sequence. A rational inquirer''s prior is countably additive over this partition.


  (3) For any such inquirer with prior P, the posterior probability P(H_i | first
  n observations) is a martingale. By Doob''s martingale convergence theorem, for
  each H_i, P(H_i | first n observations) converges almost surely to the truth value
