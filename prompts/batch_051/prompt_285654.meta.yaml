  Draft:


  I''m a PhD student working on social epistemology and the ethics of emerging media.
  My dissertation chapter concerns what some call the epistemic backstop: the idea
  that, at least in recent decades, the availability of photographic, audio, and video
  recordings provided a kind of default check on spoken testimony — if someone''s
  report was challenged, we could in principle appeal to a recording of the event.
  A familiar worry is that deepfakes break this backstop: once convincing synthetic
  recordings are cheap and widespread, the existence of a video can no longer play
  the same checking role.


  I''ve been collecting the responses to this worry that are standard in the literature,
  and I have the following list:


  1. Cryptographic authentication and provenance tracking, so that only signed recordings
  from trusted devices count as backstop-quality evidence.

  2. Relying on live, in-person witnessing and locally co-present epistemic communities
  as the new backstop.

  3. Institutional deflation: treat recorded evidence as just one more fallible source
  and rely on the general reputation of media organizations.

  4. Improving public epistemic hygiene — detection skills, source-checking habits
  — so people become less vulnerable to deceptive recordings.

  5. Legal deterrence and platform-level moderation to keep deepfakes out of circulation.


