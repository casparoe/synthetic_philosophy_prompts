  the strongest version of each side, including the costs, then give me a negotiated
  verdict.


  The theory side: teleosemantics, especially the selected-effects/etiological version.
  The basic move is that a representation''s content is fixed by what the representing
  mechanism was selected to do — its proper function... [explain]. Its virtues: it''s
  naturalistic, non-circular, and it solves the disjunction problem: a frog that snaps
  at flies, BBs, and shadows can be wrong about the BBs, because the snap-detector
  has the proper function of detecting flies; the BB cases are malfunctions. Without
  the selection history, the state merely covaries with "fly-or-BB-or-shadow-or..."
  and you can''t get misrepresentation off the ground. So history isn''t an optional
  add-on; it''s what allows error. That''s the part I find compelling.


  The intuition side: now the swamp-duplicate. A lightning bolt over a swamp assembles,
  by cosmic coincidence, a molecule-for-molecule duplicate of me at this instant,
  right down to my brain state as I think "the coffee is getting cold." This duplicate
  has no ancestors, no evolutionary history, no learning history. My gut says: he
  is thinking what I''m thinking. His "coffee" means coffee, his "cold" means cold;
  if his internal states are type-identical to mine at t, then the semantic facts
  should be identical at t. It seems insane to say that his states are just meaningless
  chemistry while mine are contentful, purely because my lineage was selected and
  his wasn''t. Meaning has to supervene on what''s here now, not on a genealogy. And
  if the theory says otherwise, I don''t feel like biting that bullet.


