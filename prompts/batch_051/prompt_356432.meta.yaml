  I need to define:

  - Scorekeeping in a language game (Lewis): conversations have a scoreboard tracking
  common ground, presuppositions, etc. Rules update it.

  - Presupposition: a proposition that has to be in the common ground for the utterance
  to be appropriate (e.g., "The king of France is bald" presupposes there''s a king
  of France).

  - Accommodation: when a speaker says something whose presupposition isn''t in common
  ground, listeners often quietly add it, as long as it''s uncontroversial.

  - "Hey, wait a minute": listeners can object to presuppositions rather than accommodate.


  The "too much" argument: It seems to show that under the standard scorekeeping model,
  a speaker can get the audience to accept any proposition at all by stuffing it into
  a presupposition, making ordinary assertion redundant — but that''s absurd, since
  we need assertion, and people do object. So one of the scorekeeping rules must be
  wrong or missing.


