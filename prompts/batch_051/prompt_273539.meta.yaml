  Scanlon''s account: promising involves giving assurance that you''ll do X, intending
  the promisee to rely on it; the obligation is to not disappoint the expectation
  you''ve induced. Breaking a promise wrongs the promisee. If the promisee releases
  you, no wrong. The practice view (Rawls): promising is a practice defined by rules;
  the obligation comes from the rules, and the practice defines conditions of release;
  promisee''s consent is relevant because the rules make it so. So they might agree
  on release but for different reasons.


