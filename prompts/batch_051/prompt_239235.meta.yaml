  Two-envelope problem:


  Setup: two envelopes; one contains twice the other. Player picks one. Variants:
  must decide without opening vs after opening.


  The switching argument (after opening): Suppose you see X. Other envelope contains
  either 2X (if X is smaller) or X/2 (if X is larger). If each equally likely, expected
  other = 5X/4 > X. So switch. Applies to every X, so you should switch regardless.
  But then you might as well decide to switch before opening, which violates symmetry.


