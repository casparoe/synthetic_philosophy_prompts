  Let me build the argument carefully so the "audit" is interesting. A version:


  "(1) Let L be the sentence ''L is not true.'' (2) Suppose L is true. Then what L
  says must be the case, so L is not true. (3) Suppose instead L is not true. But
  that''s exactly what L says, so L is true. (4) Now, by the law of excluded middle,
  either L is true or L is not true. (5) In the first case, by (2), L is true and
  not true; in the second case, by (3), L is true and not true. (6) So either way,
  L is both true and not true. (7) Therefore, at least one sentence is both true and
  false; so dialetheism is right."


  Ask: is this valid? If not, which step fails? The asker says "I''m pretty sure step
  (6) is allowed, so my money''s on (3), but my friend says (3) is undeniable." This
  is a nice setup.


  But the step (3) "L is not true -> L is true" relies on the T-schema run backward:
  if p, then ''p'' is true, i.e., if things are as L says, then L is true. More precisely,
  L says "L is not true." If L is not true (the state of affairs), then L says exactly
  that, so L is true. That''s the upward T-schema: Tr(⌜p⌝) ← p. The classical response:
  reject the T-schema (or restrict it), or reject that L is a legitimate sentence/the
  Liar is expressible, or reject excluded middle for truth-gap approaches. A dialetheist
  might accept all steps and accept (7). A paracomplete theorist (Kripke) denies excluded
  middle: L is neither true nor not true. Actually step (4) uses LEM — some deny LEM
  for the Liar (Strong Kleene). So there are multiple places to dig in: (3) assuming
  the T-schema, (4) assuming bivalence/LEM for gappy sentences, and maybe (2) uses
  T-out. The argument is classically valid given (2)-(4); the question is which premise
  to reject. Perhaps the most common response: (4) fails because L is neither true
  nor false (gaps), or (3) fails because the T-schema doesn''t hold unrestrictedly.
  This is good.


