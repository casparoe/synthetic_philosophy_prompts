  "I am a novelist, not a philosopher. I am working on a novel about a woman who must
  decide whether to protect a colleague in a small professional community, and I have
  been using a distinction I invented to keep my characters'' moral failures precise.
  I would like an expert to stress-test it before I let it quietly structure the book.


  I call it the mutuality condition on loyalty. My claim is this: partiality toward
  a group counts as loyalty — rather than as mere bias, favoritism, or tribalism —
  only when it is embedded in a scheme of mutual partiality. More exactly, an agent
  A''s special concern for group G is loyalty only if two conditions hold. First,
  reciprocity: members of G would extend comparable special concern to A in relevantly
  similar circumstances. Second, endorsement: A would regard that reversed partiality
  as appropriate — as something A could accept from the other side — rather than as
  an imposition or a corrupt favor.


  On my account, the difference between loyalty and bias is not the intensity, duration,
  or sincerity of the feeling, and not whether the agent stands to benefit. It is
  whether the partiality is bilateral in this specific way. Loyalty is mutual partiality;
  bias is unilateral partiality. The account is meant only to settle whether an instance
  of partiality deserves the name ''loyalty'' with its positive connotations, not
  whether the act is all-things-considered right: two people can be loyal to each
  other in covering up an embezzlement, and still be doing something wrong on other
  grounds.


