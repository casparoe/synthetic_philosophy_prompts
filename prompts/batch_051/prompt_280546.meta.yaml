  Draft for Type B + Disjunctivism:


  "I''m a novelist, not an academic philosopher, but I''ve been haunted by a dispute
  in the philosophy of perception because it bears directly on how I write point of
  view and hallucination. The dispute is the argument from illusion and the disjunctivist
  response to it. On one side, the argument from illusion treats a hallucination and
  the matching veridical perception as cases of the same underlying kind of experience
  — the subject can''t tell them apart from the inside, so, the reasoning goes, what
  the subject is directly aware of must be the same kind of thing (a sense-datum,
  or the same representational content). On the other side, disjunctivists insist
  that a hallucination is not a defective instance of the same kind of mental state
  as the perception; the two cases are only ''subjectively indistinguishable,'' and
  the fundamental kind differs even though the subject cannot tell which kind they
  are in. This debate has run for something like half a century and, to an outsider,
  seems to have settled nothing: both sides agree on the empirical facts (the subject
  cannot distinguish the cases), both sides have elaborate moves for every counterexample,
  and neither side''s formal machinery yields a decisive advantage. I want to understand
  what kind of disagreement this really is. Is it substantive metaphysics, or is it
  a verbal dispute about what ''experience'' or ''seeing'' means, or are the two sides
  answering different questions — one about the nature of the state itself, one about
  what explains the subject''s ability to report and act? Or is it ultimately a dispute
  about what a philosophical account of perception has to explain, so that no argument
