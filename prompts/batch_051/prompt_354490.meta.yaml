  ---


  I''m a PhD student in philosophy of cognitive science, and I''ve been reading the
  recent debate over whether large language models genuinely understand language or
  are merely "stochastic parrots." I keep noticing a pattern in the way the debate
  is conducted that I don''t have a precise term for.


  On one side, skeptics argue as follows: there is some ingredient X—phenomenal consciousness,
  or a nervous system embedded in a world, or communicative intent—that is absent
  in LLMs, and they move from the absence of X to the conclusion that there is no
  meaningful sense in which the system understands. On the other side, optimists often
  grant the absence of X but argue that X isn''t required for understanding; they
  point to a system''s ability to answer novel questions, follow instructions, translate,
  summarize, and solve problems, and say that this is what understanding amounts to.
  Then each side accuses the other of changing the meaning of "understanding" mid-argument.


  What strikes me is that this is not just a verbal dispute, because the question
  of whether X is part of the meaning of "understanding" is apparently itself what''s
  at issue—the parties disagree about which concept of understanding is the right
  one to use, and that disagreement does real argumentative work. It''s as if the
  same move—"your premise only follows if we accept my definition"—is made by both
  sides, but starting from opposite ends, so the dispute becomes impossible to adjudicate
  from either definition without begging the question.


  Is there an established name for this specific configuration: a dispute that is
  partly verbal and partly substantive, where the boundary between the verbal and
  substantive parts is itself one of the things being contested? I''m aware of "merely
  verbal dispute" and of "metalinguistic negotiation," but neither seems exactly right—"merely
  verbal" suggests the disagreement dissolves once terms are clarified, whereas here
  clarification would itself require taking a side; and "metalinguistic negotiation"
  is usually applied to ordinary normative disputes (like whether a certain novel
  counts as "art"), not to scientific or cognitive claims with an apparently empirical
  component. Does this configuration have a name of its own, or is it just metalinguistic
  negotiation in a scientific setting? And if there''s no established name, can you
  define one that distinguishes it from both a merely verbal dispute and ordinary
  metalinguistic negotiation?


