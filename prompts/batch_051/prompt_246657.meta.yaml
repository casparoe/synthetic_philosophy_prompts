  Mechanism idea refined:


  "Suppose a jurisdiction sets up a Nudge Registry. Any body that deploys a nudge
  in a public-facing context—a government department, utility, employer, commercial
  platform, or advertiser—must, before deployment, deposit a fee with a regulator
  and file a description of: (i) the target behaviour before and after; (ii) the mechanism
  by which the nudge is expected to work; (iii) the population affected. The deposit
  is refunded only if, after a prescribed trial, the nudge passes a ''transparency
  test'': the effect must survive full disclosure to a representative sample of users.
  If the nudge''s effect shrinks by more than X under disclosure, deposit is forfeited
  to fund independent testing; if the nudge works only because it was undisclosed,
  it is banned or relabelled as manipulation. Repeated failures raise deposits for
  that deployer."


  Ask how this would play out: incentives for deployers (to design disclosure-proof
  nudges, choose easy-to-defend behaviours, test narrowly, register trivial nudges,
  relabel as user choice, game measurement by choosing samples/time windows), incentives
  for regulator (measurement errors, baseline effects, heterogeneity), second-order
  effects (innovation in "nudge design" shifts toward education/information rather
  than subconscious steering; or toward even more opaque techniques not classified
  as nudges, like friction placement, design of the choice environment''s physical
  layout; or toward lobbying the regulator). Failure modes: regulators may define
  disclosure too harshly; small deployers cannot afford trials; existing behaviour
  may persist from before registration; substitutes that are not regulated (peers,
  algorithms with recommender systems). Can fixes work without gutting the scheme:
  partially refunded deposits, negative list of hard-to-disclose techniques, independent
  pre-registration of evaluation protocols, etc.


