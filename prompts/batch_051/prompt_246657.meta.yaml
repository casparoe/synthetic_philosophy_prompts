  Phenomenon in the weeds of revealed preference: People''s choices vary with seemingly
  arbitrary features of the choice situation (ordering of options, defaults, framing),
  so the set of choices is not consistent with any single underlying preference ranking.
  Economists sometimes say preferences are just whatever choices reveal; but then
  the same person can be said to have contradictory preferences with no way to say
  which is "real." Some researchers try to recover "true" utility by using binary
  choices, willingness to pay, or by debiasing; others say utility is a representation
  of behaviour and questions about true preferences are meaningless. The asker describes
  a specific pattern: in one context, someone chooses A over B; in another context
  with the same goods/info, they choose B over A, and the only difference is the frame,
  ordering, or default. The asker wants to know whether this configuration has a name
  and how it relates to the standard idea that choice reveals preference. Could mention
  "it''s like the opposite of the revealed preference assumption."


  Hmm, but the phenomenon "choices depend on framing/context" has established names:
  preference reversal, context-dependent preferences, behavioural welfare economics,
  constructed preferences. There''s a big literature. The prompt should describe it
  concretely and ask whether there is an established concept. Good answers would discuss
  preference reversals (Lichtenstein and Slovic), the invariance assumption, revealed
  preference''s commitment, and the "soft paternalism"/libertarian paternalism debate,
  plus the distinction between "decision utility" and "experienced utility" (Kahneman,
  Wakker, Thaler). But the type examples expect the described thing to fit an established
  concept only imperfectly or fit none. I can craft it so it''s a specific variant:
  "the same individual, same options, same information, same stakes, only difference
  is the order in which options are presented or framing; all these choices are recorded
  with full awareness; nobody corrects any of them. What does an economist make of
  the fact that the only possible ''revealed preference'' relation is cyclical/intransitive?"
  That''s preference reversals / intransitivity / choice-set dependence (menu dependence).
  There are names: "menu dependence", "context dependence", "preference reversals",
  "framing effects". But the asker wants more than a bare name: distinguish from plain
  irrationality, intransitive indifference, accommodation via multiple preferences.


  Alternatively, craft a more subtle phenomenon: "People''s stated willingness-to-pay
  for an item depends on whether they are first asked to sell it (endowment effect)..."
  that''s endowment effect—too standard.


  Another idea: a phenomenon around what utility means: "An economist says a policy
  is welfare-improving because consumers choose more of A when its price falls; a
  psychologist says the consumers later regret it and are less happy. The economist
  replies that utility is just a measure of what maximises choices, not happiness.
  The asker notes this pattern: the same term ''utility'' does two jobs—as an explanation/prediction
  of choice and as a normative measure of welfare; when they come apart, the theory
  can''t say which wins." Ask for name. That''s the "meaning of utility" and the distinction
  between decision utility and experienced utility, plus the "normative/positive"
  distinction. Could be a phenomenon in arguments: "economists retreat to ''utility
  just summarises choice'' when challenged, but then use utility to make welfare claims."
  This is almost like motte-and-bailey. Interesting but maybe fits type 3 less cleanly.


