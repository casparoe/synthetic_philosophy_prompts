  Let me refine the mechanism for conceptual interest:


  One key subtlety: The disclosure test as described—requiring effect to persist at
  ≥80% when subjects are informed—might actually favor paternalistic nudges that work
  even when disclosed (e.g., adjusting portion sizes, simplifying forms, defaulting
  to safer option with explicit note) and penalize purely manipulative ones (subscription
  dark patterns). But it might also push deployers to use harms that persist because
  users can''t easily undo them (addiction, switching costs) rather than ignorance.
  That''s an interesting second-order effect: "disclosure-proof" is not the same as
  "respectful of autonomy," because a disclosed manipulation can be just as effective
  if the underlying mechanism is inertia, cost, or cognitive load rather than deception.
  The rule might select for stickier, more burdensome opt-outs. I can hint at this
  without spelling it out: "and whether the scheme inadvertently selects for techniques
  whose effects survive disclosure because they operate through burdens, inertia,
  or switching costs rather than through potentially defensible information." Good
  to push.


  Also, the trial itself: Companies may run many trials until one passes (multiple
  testing), p-hack, report selective outcomes. Regulator may not be able to do independent
  trials; baseline selection, heterogeneous effects.


  Another subtlety: "Classification of nudges" creates a boundary problem: a rewards
  programme or price discount also shapes behaviour but is not a nudge; firms will
