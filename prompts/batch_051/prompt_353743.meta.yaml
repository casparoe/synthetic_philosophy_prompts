  Let me recall Arendt''s actual views:


  In "Truth and Politics" (1967), Arendt distinguishes rational truth (necessary,
  like 2+2=4) and factual truth (contingent, about events and facts). Factual truth
  is political because facts inform opinions; factual truth is fragile because it
  is contingent and can be destroyed by lies and by the "rewriting of history." She
  says the political lie has an inherent limit: the liar, unlike the truth-teller,
  is aware of the truth and must remember it; organized lying tends to destroy the
  record, but totalitarian regimes also use "holes of oblivion." The modern "image-making"
  and "public relations" don''t lie about facts so much as "remove the common world"
  — they make it impossible to have a shared factual basis for debate. She argues
  that the hallmark of totalitarian propaganda is not lying per se but "the replacement
  of the factual world by a fictional one" and making people unable to tell truth
  from falsehood. She also has the famous line: "The trouble with lying and deceiving
  is that their efficiency depends entirely upon a clear notion of the truth that
  the liar and deceiver wishes to hide." And in "Lying in Politics" (1971), about
  the Pentagon Papers, she discusses the "defactualization" of politics and "problem-solving"
  mentality; she says the real danger is not that politicians lie but that they start
  believing their own lies / lose the ability to distinguish fact from fiction. She
  calls it "the modern lie" — "the deliberate attempt to make lies plausible" via
  images, and "the defactualization of reality."


  So the classic Arendtian argument: totalitarian/ideological lying ultimately undermines
  itself because reality (facts) reasserts itself; the liar must keep in touch with
  truth; factual truth is stubborn though fragile; and the complete destruction of
  the fact-fiction distinction requires terror (total domination), not just lies.


  New development: algorithmic, personalized political misinformation. Assumptions
