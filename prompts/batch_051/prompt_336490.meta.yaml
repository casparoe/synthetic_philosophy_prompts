  the experimenter planned a fixed sample or flexibly stopped early, while the Bayesian''s
  conclusion stays the same — but then construct it so that, in the replication attempt,
  this asymmetry causes a disagreement about whether the original result replicated,
  with the frequentist saying the original was likely a false positive and the Bayesian
  saying the evidence is unchanged.


