  moved on. I am not convinced the reply settles the matter, and I would like to know
  exactly what it could be claiming.


  I would be grateful if you would do the following. First, distinguish the precise
  theses that the slogan might be used to express. I can think of at least a few families
  of reading — for example, a psychological claim about attention or cognitive effort;
  an epistemic claim about whether a deliberating agent can have justified or stable
  credences in her own forthcoming choice; a claim about decision-theoretic coherence,
  perhaps to do with whether one''s own acts should be treated as observations to
  be conditioned on or as interventions chosen outright; and perhaps a normative claim
  about how one ought to allocate mental effort. But I do not trust my list to be
  exhaustive or cleanly drawn. For each reading, say briefly whether it is trivial,
  plausible but substantive, contentious, or straightforwardly false, and give a reason.


