  I’m a high school student writing a paper for a biology class on animal behavior,
  and I’ve been trying to pin down what I actually think about when it’s legitimate
  to attribute cognition to an animal. The standard rule we learned is Morgan’s canon,
  which, as our textbook put it, is something like: don’t explain an action by a higher
  psychological faculty if a lower one would do. But when I apply that rule to my
  own intuitive judgments, I get a mess, so I want to know what principle, if any,
  actually captures them.


  Here are my verdicts. A dog standing at the back door and whining at its usual evening
  time is, I think, wanting to go out; I don’t feel any need to reduce this to a learned
  association between a full bladder and the door. A crow that bends a piece of wire
  into a hook to lift a bucket from a tube seems to me to be problem-solving, though
  I stop short of saying it had a plan before acting. An octopus that removes an unfamiliar
  lid from a jar to reach a crab seems to me to be genuinely dealing with an obstacle,
  not just mechanically repeating a reinforced prying motion. A parrot that says want
  nut only when nuts are present seems to me to be requesting, not just emitting a
  sound that has been rewarded in the past. But when a jumping spider takes a detour
  around a gap to reach prey it can see, I don’t want to say it planned the route,
  even though the detour was not previously rewarded. And I’m genuinely torn about
  a dog that picks up its leash and drops it at my feet when I’ve been in a bad mood:
  I want to say it is trying to comfort me, but that feels like a much bigger claim
  than the ones I made about the crow and the parrot.


  Is there a single account of when to attribute desire, intention, problem-solving,
  or understanding that delivers all of these verdicts, or at least most of them?
