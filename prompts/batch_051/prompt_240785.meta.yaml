  simplicity and fit. That view gets a lot of elegant machinery for free, and it doesn''t
  posit anything I can''t in principle observe. But then I read Hume himself and this
  passage keeps tripping me up: [quote]. ... Hume is saying we never observe any power
  or connection — just succession. And I believe that when I''m being observational.
  But I also can''t shake the intuition that a law is something more than a summary:
  when I push a cart, the force isn''t just a story I tell; the future isn''t just
  going to resemble the past by luck or habit. It feels like the law is doing work
  that a mere description doesn''t do — it explains why, not just that. Everyone around
  me tells me to either (a) bite the bullet and drop the intuition, since talk of
  ''powers'' is unobservable and hence either nonsense or projectivist, or (b) give
  up the tidy Humean picture and admit laws are real extra things (governors, dispositions,
  primitive necessitation) that summaries merely report on. Or maybe (c) there''s
  a reading where these are compatible. Walk me through what each option actually
  costs, and which one I should take — not just which side is popular, but what would
  justify dropping an intuition like mine vs. amending a clean theory vs. declaring
  them compatible. Is my ''laws do work'' intuition a respectworthy datum or just
