  Type 1: Present a clash between compelling theory and firm intuition and ask which
  should yield.


  Software engineer voice, no formal philosophy. Casual.


  Ideas: The compelling theory: Humean regularity/Best System view of laws (though
  asker may not call it "Best System"; maybe "the clean version of laws I keep coming
  back to"). Systematic virtues: doesn''t posit invisible glue; treats laws as compressed
  descriptions/patterns; fits empiricism; no unobservable necessity; handles counterfactuals
  via overall fit perhaps.


  The firm intuition: when a billiard ball strikes another, or I push a cart, the
  law (e.g., conservation of momentum) isn''t just a summary; it''s doing causal work;
  the future isn''t like the past just by habit. The intuition: there is something
  about the world that makes the effect happen—power, disposition, necessitation—not
  just regularity.


  The passage is from Hume: he says we never observe power or connection, only that
  one follows the other; the impulse of one ball is attended with motion in second;
  that''s all that appears to outward senses.


  The asker half-agrees with the passage but can''t drop the intuition. Asks: should
  intuition be debunked as projection from physics class, should the clean theory
  be amended/abandoned by admitting powers/necessary connections, or is there a reading
  where both are compatible (e.g., laws as summaries but summaries are what do explanatory
