  don''t need a final metaphysical verdict. Give me your best reconstruction, flag
  how confident you are in each part, and tell me where the practice is genuinely
  underdetermined. If the honest answer is that my question is badly formed — that
  there is no single notion of randomness these practices collectively presuppose
  and the task as posed can''t be done well — say so plainly instead of forcing a
  unified theory.


