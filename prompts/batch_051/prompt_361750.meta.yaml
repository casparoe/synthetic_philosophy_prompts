  I write software in which "random" seems to do several different jobs at once, and
  I''m trying to figure out what notion of randomness each job actually presupposes.
  In one codebase we seed a Mersenne Twister from a few bytes of `/dev/urandom` and
  then treat the resulting bitstream as random for a Monte Carlo simulation, even
  though the stream is a deterministic function of the seed and anyone who knows the
  seed can reproduce every bit. In another system we use a cryptographically secure
  PRNG whose contract is that no feasible adversary, given any finite prefix, can
  predict the next bit with non-negligible advantage. And when we validate either
  of these, we feed finite files to statistical test batteries — Diehard, TestU01,
  the NIST suite — and the tool prints a p-value and effectively calls a particular
  finite sequence "random" or "not random."


  These practices seem to pull in different directions. The statistical battery treats
  a finite sequence as something that can be random full stop; the cryptographic contract
  doesn''t care about the sequence in itself, only about unpredictability relative
  to bounded adversaries; the Monte Carlo code treats deterministic output as random
  because it''s patternless enough for the sampler. Meanwhile, the algorithmic-information-theory
  accounts I''ve run into (Kolmogorov complexity for finite strings, Martin-Löf-style
  tests for infinite sequences) suggest that randomness in the strict sense is a property
  of infinite sequences or of sequences relative to a reference measure, while a finite
  string can at best be more or less incompressible. What theory of randomness does
  each of my three practices actually commit me to? Is there a single coherent notion
  underneath all of them, or are they just borrowing one word for several distinct
  properties — incompressibility, unpredictability, typicality under a distribution
  — and would anything about how we build and certify these systems have to change
