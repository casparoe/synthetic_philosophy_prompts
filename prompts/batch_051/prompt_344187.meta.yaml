  I am a retired chemist, and I have been reading Hume''s economic essays alongside
  recent debates about monetary policy. I keep returning to one of his central arguments
  and wondering whether it survives the world we actually live in now.


  Hume argued against the mercantilists that a nation''s stock of money is not its
  wealth. Money, in his account, is only a device for circulating real goods and labor;
  in the long run the quantity of money adjusts to the level of prices, and an unfavorable
  balance of trade tends to correct itself automatically. In a metallic currency world
  the mechanism ran like this: a trade deficit drains specie abroad, the domestic
  money supply contracts, domestic prices fall, exports cheapen while imports dear,
  and the balance swings back toward equilibrium. Doubling the money in circulation
  would, in the end, only double prices. From this Hume drew a larger conclusion:
  trade between nations is not a zero-sum struggle over a fixed stock of precious
  metal, the prosperity of one''s trading partners is not a threat, and the jealousy
  of trade is a mistake.


  That argument was built for commodity money — coin, bullion, convertible paper.
  We now use irredeemable fiat currency, central banks that set interest rates and
  supply reserves, and floating exchange rates, and the adjustment mechanism Hume
  relied on no longer operates as he described. A country can run a large current-account
  deficit for decades without undergoing a Humean internal deflation; the exchange
  rate, capital flows, and the position of reserve-currency issuers absorb much of
  the pressure. The link between the stock of money and the price level is far looser
  than the specie-flow story assumes.


