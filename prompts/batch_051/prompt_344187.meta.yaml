  development? I want to know precisely which premise carries the weight: the quantity
  theory of money, the specie-flow adjustment mechanism, the claim that money is not
  itself wealth, the assumption that prices are flexible, or the identification of
  money with metal. Can some of these premises be discarded while keeping the core
  conclusions — that trade is mutually beneficial and that accumulating money is not
  the proper end of economic policy — and if so, what is the repaired argument? Or
  does the conclusion now rest on entirely different grounds, so that we should say
  plainly that Hume''s original argument is dead even if his anti-mercantilist conclusion
