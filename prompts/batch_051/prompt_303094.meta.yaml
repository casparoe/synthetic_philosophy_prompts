  ---


  I''m a journalist who covers science and ideas for a public radio show, and I''m
  putting together a short segment on Nozick''s truth-tracking account of knowledge.
  I want to close the segment with a sonnet that actually does some philosophical
  work rather than just name-dropping the theory. You''re a poet who knows this material
  cold. Before you write, take a couple minutes to brainstorm how the poem''s turns
  and rhyme scheme can carry the argument, and think carefully about the order of
  ideas.


  Here''s the shape I have in mind. Use the octave to build up the closure intuition:
  if you know you have hands, and you know that having hands entails you''re not a
  brain in a vat being fed a simulation, then you should be able to know you''re not
  a brain in a vat. Let that intuition sit there, with the skeptical dread humming
  underneath. The turn, at line nine, should be the moment Nozick shows up: knowledge
  isn''t about deducing every consequence; it''s about whether the belief tracks the
  truth — roughly, you wouldn''t have believed it if it were false, and you would
  believe it if it were true, by the same method you actually used. Then the sestet
  can show why tracking treats skeptical hypotheses so cleanly: my belief that I''m
  not a brain in a vat doesn''t track, because in the vat world I''d still believe
  it. The final couplet should name the price of this move — giving up closure under
  known entailment — and make it feel like a loss and a gain at once. It should be
  accurate enough that an epistemologist wouldn''t wince, but it should also land
  as a poem for listeners who''ve never heard the name Nozick, so dont let the jargon
  do the heavy lifting.


