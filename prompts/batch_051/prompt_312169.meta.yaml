  and we have one session to get students to see why the question ''what did the author
  mean?'' isn''t straightforward. Most of them come in assuming that if we could just
  ask the author, all interpretive disputes would dissolve, and that later readers''
  interpretations are only approximations. I want to teach the distinction between
  an utterance meaning and a work meaning, or maybe between actual intention and the
  best hypothesis about intention, using a single extended example. I want the session
