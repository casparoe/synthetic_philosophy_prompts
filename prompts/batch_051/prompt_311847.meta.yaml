  expected value positive (indeed arbitrarily large).

  (5) Therefore expected value reasoning says we should make arbitrarily large sacrifices
  on any option with a non-zero probability of a sufficiently enormous payoff — even
  if the probability is as small as 1 in 10^100 and the payoff story is... something.

