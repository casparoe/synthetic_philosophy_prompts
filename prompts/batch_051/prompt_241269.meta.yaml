  Draft:


  "I have been thinking about Lewis Carroll''s dialogue between Achilles and the Tortoise,
  and I have worked out a position I call the License Account of inference. I would
  like an honest assessment of it.


  The License Account says that a rule of inference such as modus ponens is not a
  premise and not a proposition; it is a license — a standing permission to move from
  propositions one accepts to a further proposition. A license can be expressed in
  a conditional form, such as ''if you accept P and if P then Q, you may accept Q,''
  but the expression is not what the license is. The expression is a proposition about
  the license; the license itself is the authorization to make the move. Licenses,
  unlike propositions, are not true or false. They are granted, exercised, declined,
  or revoked.


  On this view, the regress Carroll dramatizes arises only because the Tortoise keeps
  demanding that the license be supplied to him as an additional premise. Each time
  Achilles complies, the license is converted into a conditional proposition that
  the Tortoise can accept without exercising any authority to conclude; so the Tortoise
  needs another license to use that new proposition, and the regress follows. The
  License Account therefore treats the regress as an artifact of misrepresenting a
  license as a content, not as evidence of a gap at the bottom of deduction. A deductive
  transition is justified not by adding a further truth to the premises but by a reasoner''s
  acceptance of the license that authorizes the move. Once the premises and the license
  are accepted, nothing remains to be justified; there is only the drawing of the
  conclusion.


  A plain example: in a board game, a player who recognizes the position on the board
  and accepts the rule about how a piece moves does not need an additional premise
  saying that the rule should be applied to this position. The rule is precisely what
  makes the move count as legal rather than as a description of the board plus an
  inert sentence. I think the Tortoise is best understood as someone who wants to
  play logic while refusing to let the rules apply from within.


  I realize some of this will sound close to familiar distinctions — between rules
  and propositions, or between knowing-that and knowing-how — and I want to know whether
  the License Account is merely one of those in different wording or whether it earns
  its keep. Please give me the three strongest objections to it and say whether any
  of them is fatal rather than merely uncomfortable. In particular, I am worried about
  the following: if drawing a conclusion is the exercise of a license and the exercise
  of a license is voluntary, then a reasoner who accepts the premises and the license
  but refuses to draw the conclusion seems to have made no mistake at all. Yet ordinary
  thought says such a person is logically irrational. Does the License Account have
  the resources to explain that irrationality, or does it turn logical rationality
  into an act of choice?"


