  Actually there''s a subtlety about Gricean non-natural meaning and implicature with
  deception: For speaker meaning (meaning-NN), Grice requires the speaker intend to
  produce a belief in the audience and intend that the audience recognize the intention
  behind the utterance. In the lying case, the liar does not intend the hearer to
  recognize the intention; the liar intends the hearer to take the utterance as truthful
  without recognizing the deceptive intent. For conversational implicature, the speaker
