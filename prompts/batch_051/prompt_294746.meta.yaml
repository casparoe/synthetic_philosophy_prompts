  Prompt: "I chair the adverse-event review panel at a medical device manufacturer.
  Each month we review roughly ten reported incidents and decide, for each one, whether
  the evidence supports a causal link to one of our products. The decision determines
  whether we file adverse-event reports, issue a correction, or restrict use of a
  device, so mistakes in both directions are expensive. Panels of three to seven clinician-engineers
  vote yes/no, after reading a shared file and deliberating for about half an hour.
  I have to ratify or challenge their majority votes, and I want a durable procedure
  rather than case-by-case improvisation.


  Please turn the Condorcet jury theorem, together with its known failure modes, into
  a reusable decision procedure for deciding how much weight to give to such a majority
  vote in a given case. The procedure should be written so my colleagues without formal
  background can run it in fifteen minutes. It should tell us when to take a majority
  at face value, when to require a supermajority or unanimity, when to weight members
  instead of count heads, and when to treat the vote as carrying little or no information
  about the truth — including cases where a strong majority should push us away from
  its conclusion rather than toward it. Be explicit about how to check the theorem''s
  preconditions in practice: a single well-defined yes/no question with a fact of
  the matter, individual competence better than chance, and — the part we find hardest
  — independence of votes once shared files and deliberation are factored in. Pay
  particular attention to correlated evidence: multiple people reading the same faulty
  log are not multiple independent tests.


  Then apply the procedure to three worked cases: (a) six of seven members vote ''caused''
  after all rely on the same unreproduced firmware readout supplied by one engineer;
  (b) three members read fully separate evidence packages and vote 2–1 ''not caused,''
  but neither of the two in the majority has the clinical specialty relevant to the
  failure mode while the dissenter does; (c) the panel votes 4–1 ''not caused'' in
  a case where a recent internal training module and a shared anecdote about a competitor''s
  over-reporting have given everyone a strong prior that devices like ours rarely
  cause this type of harm. For each, show what the procedure does and why. Include
  at least one case where the procedure tells me to overturn or disregard a comfortable
  majority, and say in plain terms what the procedure cannot do (for instance, manufacture
  independence, set the base rate, or choose our tolerance for risk).


  Finally, say how confident you are in the specific recommendations and identify
  the single point you are least sure about."


