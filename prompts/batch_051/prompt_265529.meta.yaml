  Let me explore Lewis argument substance.


  Lewis, Convention (1969): A convention is a regularity R in the behavior of members
  of a population P in recurrent situation S such that (1) everyone conforms to R;
  (2) everyone expects everyone else to conform to R; (3) everyone prefers to conform
  given the others do (coordination equilibrium); (4) there is a common knowledge:
  everyone knows these facts, knows everyone knows, etc.; (5) there is an alternative
  regularity R'' that would also be a coordination equilibrium (arbitrariness). Conventions
  arise to solve coordination problems through precedent and salience.


  Evolution of norms: norms (e.g., driving on a side, greeting conventions, property
  rules) may evolve via cultural evolution, selection of equilibria. Some may become
  "non-arbitrary" because changing them is costly, or because one equilibrium Pareto-dominates
  another (e.g., coordination on efficient technology standards).


  Craft an argument that an evolved norm is binding/justified because it is a convention,
  or that it''s arbitrary and thus can be flouted. Potential argument:


  "Argument that evolved social norms have no normative force:

  (1) A conventional norm is, by Lewis''s definition, an arbitrary solution to a coordination
  problem: had history gone differently, we would now follow a different regularity
  in its place.

  (2) Norms that emerge through cultural evolution are selected by historical accidents
  — salience, precedent, imitation, drift — not by their moral quality.

  (3) So the norm we happen to have is arbitrary in the sense that a different norm
  could have done equally well.

  (4) But an arbitrary rule carries no genuine normative force — you are not bound
  by a rule that could just as well have been otherwise.

  (5) Therefore evolved conventional norms (say, norms of gift exchange or politeness)
  generate no real obligations to follow them."


