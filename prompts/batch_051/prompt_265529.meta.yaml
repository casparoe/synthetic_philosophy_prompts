  Let me think through the substance of the situationist critique for accuracy.


  Virtue ethics (Aristotelian) holds that virtues are stable dispositions of character
  — reliably expressed across relevant situations. Situationist social psychology
  (Hartshorne & May 1928, Milgram 1963, Isen & Levin 1972, Darley & Batson 1973) found
  that behavior varies significantly with situational factors and that cross-situational
  consistency of behavior is low (correlations ~0.2-0.3, Mischel 1968). Doris (1998,
  2002) and Harman (1999) argue this undermines the global character traits virtue
  ethics requires. Defenders (e.g., Kamtekar, Sreenivasan, Sabini & Silver, Adams,
  Annas) argue: (a) virtue ethics doesn''t require total behavioral consistency; (b)
  virtues are rare ideals, not claims about how most people actually are; (c) situations
  matter for virtue too — the virtuous person perceives situations accurately (practical
  wisdom), so the critique assumes a naive view; (d) the experiments show people lack
  virtue, not that virtue is impossible.


  Crafting an argument with a subtle flaw:


  Argument that situationism shows virtue ethics is self-undermining:

  (1) For an action to count as virtuous, it must issue from a stable character trait
  that manifests across relevantly similar situations.

  (2) But philanthropy experiments (e.g., helping a stranger) show that whether a
  person helps is driven by minor situational factors (being in a hurry, finding a
  dime, ambient noise, etc.).

  (3) If behavior is driven by such factors, then the sort of stable dispositions
  that could ground acts of virtue are psychologically unrealistic — normal agents
  lack them.

  (4) Virtue ethics, unlike rule-based theories, requires that ordinary agents possess
  such dispositions to guide action.

  (5) Therefore virtue ethics rests on a psychology we now know to be false, so its
  account of right action is inapplicable (or its ideal is unattainable for normal
  agents).


  Ask: Is this argument valid? If not, which step fails and what is the correct version?


  Potential flaws:

  - Step 1: Virtue ethics does not require the trait to manifest in all or even most
  situations; it requires a reliable disposition together with practical wisdom that
  discriminates when the virtue applies. The experiments test helping behavior across
  situations that may be relevantly different; taking them as showing inconsistency
  may conflate "same situation" and "same circumstance." Actually the step 1 could
  be fine.

  - Step 2/3: The inference from low cross-situational consistency of behavior among
  ordinary people to the claim that stable dispositions are psychologically unrealistic
  is an illicit move: low consistency could mean people lack the trait, not that traits
  can''t exist; and the experiments mostly show that most people aren''t virtuous,
  which virtue ethics already granted (virtue is rare). But the argument says the
  ideal is unattainable, which is stronger.

  - Step 4 is a mischaracterization: virtue ethics does not say ordinary agents already
  possess full virtues; it gives an ideal and a developmental path. Some versions
  (e.g., Hursthouse) don''t claim agent-possession of discrete traits is the sole
  determinant.

