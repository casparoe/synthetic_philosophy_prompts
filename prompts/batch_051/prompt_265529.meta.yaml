  arbitrariness (alternative equilibrium available) is about the origin/selection
  of the regularity, not about its currently binding force within the coordination
  scheme. Once a convention is established and others rely on it, the fact that it
  could have been otherwise does not undermine the reason to conform — indeed, in
  a coordination problem, the very fact that others conform gives each person a reason
