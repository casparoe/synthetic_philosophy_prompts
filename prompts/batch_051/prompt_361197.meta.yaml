  Panpsychism combination problem: panpsychists hold that consciousness is fundamental
  and present at the micro-level. The combination problem (William James, William
  Seager) asks how micro-experiences could combine to yield a unified macro-consciousness
  like ours. Various responses: constitutive panpsychism (micro-subjects directly
  constitute a macro-subject, but subject-summing problem), emergentist panpsychism
  (macro-consciousness strongly emerges from micro-consciousness, but worries about
  brute emergence), and solutions via fusion/co-consciousness. The problem is often
  thought more difficult than the analogous problem for physical properties: physical
  parts sum into wholes straightforwardly, but subjects don''t seem to sum.


  A poem prompt could ask: "Write a sonnet about the combination problem for constitutive
  panpsychism. Use the octave to set out the promissory note of micro-subjects combining
  into one mind, the volta to mark the subject-summing objection (why should many
  I''s add up to one I?), and the couplet to state what panpsychism must either explain
  or abandon. Specialists should recognize the subject-summing problem, not just generic
  combination."


