  Van Fraassen''s Reflection: P(A | P_morrow(A)=r) = r. It says your current opinion
  should be the expected value of your future opinion. It''s a diachronic coherence
  constraint: you should treat your future self as an expert, absent reasons to think
  you''ll be less informed. But as many have noted (Christensen, Talbott, etc.), Reflection
  fails in cases of anticipated irrationality or belief loss: if you know you''ll
  be drunk, you shouldn''t defer. Van Fraassen''s original defense assumes future
  self is a "continuer" with no relevant loss of information. The principle is meant
  for rational future credences.


