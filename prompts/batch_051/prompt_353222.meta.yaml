  ---


  I am a philosophy professor, and next month I am giving a colloquium talk on the
  St. Petersburg paradox to a joint workshop of the philosophy and economics departments,
  with a few formal epistemologists also attending. I''d like you to prepare me for
  the question period.


  The talk defends this thesis: the standard moral drawn from the St. Petersburg paradox—that
  rational agents must have bounded utility functions—is a repair to the wrong component
  of the theory. The paradox is not fundamentally a problem about infinity, or about
  how to weigh tiny probabilities of enormous payoffs. It is a problem about representability:
  it shows that a rational agent''s preferences over a space of outcomes that includes
  the gamble''s infinitely many possible outcomes need not admit of any real-valued
  expected-utility representation at all, and that the demand that the agent price
  the gamble is exactly the step at which the representation is being imposed without
  justification. On my view, the fully rational response can be to refuse to buy or
  sell the gamble at any finite price—not because its utility is finite and lower
  than the price, but because the gamble is not in the domain of alternatives over
  which the agent''s preferences are cardinally representable. The usual patches—bounded
  utility, discounting small probabilities, the finite wealth of the casino—are attempts
  to force the gamble back into the domain of the theory rather than acknowledgments
  of a limit of the theory.


  In the talk I argue for this in three steps: first, that the paradox''s force comes
  from treating expected monetary value as the criterion of choice and then noticing
  it cannot be the criterion; second, that replacing monetary value with a bounded
  utility function solves the pricing puzzle only if one has already assumed that
  the gamble must receive a real-valued utility, which is the assumption in question;
  and third, that the same issue arises in less exotic cases—decisions involving theoretical
  idealizations, Pascal''s-wager-like structures, and long-shot scientific gambles—so
  this is not a remote curiosity.


  The audience: most are economists, including several decision theorists and behavioral
  economists; there are two formal epistemologists and two philosophers of science;
  and one senior decision theorist known for defending the view that all rational
  preferences are representable. The economists will come in thinking the paradox
  was settled by Bernoulli and that I am re-opening a closed question; the formal
  epistemologists will worry that my view licenses irresolvable indecision or violates
  the expected-accuracy norm; the philosopher of science will be the most sympathetic.


  Please give me a Q&A prep sheet, not a restatement of my argument. I want: (1) the
  eight or so objections I am actually most likely to get from this audience, ordered
  by how likely and how damaging they are; (2) each objection phrased roughly the
  way this audience would actually put it—in the economists'' or formal epistemologists''
  own idiom; (3) for each, a two-minute reply and a note on where that reply is weakest,
  including what I should concede up front rather than defend; and (4) the one question
  I should most hope nobody asks, with the reason it would be hardest to answer.


