  Let me draft community + taxonomy:


  "For most of my career I directed a small marine-biology field station, and I retired
  just as it was being wound down and absorbed into a remote collaboration. The change
  has been much on my mind: the science continued, by some measures more efficiently,
  but something about the place—shared meals, the ritual of the morning tide check,
  arguments that were possible only because people were physically present—disappeared.
  I have since become involved with a continuing-education programme at a local university,
  and I have been reading philosophy about community and belonging. The readings have
  convinced me that my fellow participants use the word ''community'' in several incompatible
  ways, and that our disagreements about whether anything valuable was really lost
  reduce to deeper disagreements we never articulate."


  Then: "I would like to produce a sorting quiz for the group—eight to ten questions,
  each a concrete case—that sorts each of us into a named position by what we say
  about cases, not by labels. The leaves should include at least: an instrumentalist
  view (the value of a community is exhausted by the goods it delivers to members),
  a communitarian or constitutive view (membership and belonging are themselves goods,
  not mere means), a social-needs or capability view (community answers a basic human
  need, like health or recognition), and a deflationary or sceptical view (what is
  lost is chiefly nostalgia or familiarity, attractive but not a distinctive good).
  You may add a further leaf if you think the logical space requires it."


  Then fault lines: "The questions should sort along several axes: (1) whether a community
  that delivers exactly the same services, rituals, and conversations online is a
  genuine replacement or a different kind of thing; (2) whether the value of a community
  is fungible across communities—whether losing one can be fully made good by joining
  another equally good one; (3) whether unchosen communities (a family, a place one
  grew up in, a profession one inherited) can be good for a person in ways that chosen
  associations cannot; and (4) whether the destruction of a community can be a wrong
  even when no individual member''s preferences are frustrated. Each question should
  be answerable by someone who has never read the literature; no question should ask
  ''do you think belonging is intrinsically valuable?'' Then provide a scoring key
  mapping answer patterns onto the leaves, and flag any pair of positions the quiz
  cannot cleanly separate. Where an answer combination is logically possible but has
