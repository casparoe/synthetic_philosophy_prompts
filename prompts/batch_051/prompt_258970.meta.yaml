  Para 1: Introduce persona and situation.


  "For most of my working life I directed a small marine-biology field station; I
  retired in the same year it was wound down and folded into a distributed collaboration.
  By several measures the science improved: costs fell, the data pipeline widened,
  and people no longer spent hours on a boat merely to change a sensor. Yet something
  about the place vanished—the shared mess at midday, the arguments that were only
  possible because people were in the same room, the unplanned favours. I have since
  taken up philosophy through a continuing-education programme, and I keep returning
  to the question of what, if anything, was genuinely lost. A difficulty is that my
  reading group uses ''community'' in several incompatible ways, and our arguments
  about the field station keep bottoming out in unstated assumptions rather than in
  reasons."


  Para 2: Request the quiz.


  "I should like a sorting quiz for the group, of eight to ten questions, each a concrete
  case, that sorts each of us into a position by what we say about cases rather than
  by which label we like. The leaves should include at least: an instrumentalist view,
  on which the good of a community is exhausted by the goods it delivers to its members;
  a communitarian or constitutive view, on which membership and belonging are themselves
