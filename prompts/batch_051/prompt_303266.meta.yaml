  ---


  Before I read any more theories about what "left" and "right" actually pick out
  in politics, I want the desiderata rather than a theory: the list of jobs an adequate
  theory of the left/right distinction has to do, with the case or example behind
  each job, and a call on which jobs are negotiable and which aren''t. I mean a theory
  good enough for understanding political alignment — predicting coalitions, explaining
  realignments, making sense of cross-national variation — not just a dictionary definition.


  Some jobs I think belong on the list (push back if any of these is a prejudice rather
  than a genuine requirement):


  1. The inferential-ticket job. If you tell me someone is left-wing, I can predict
  better than chance how they''ll lean on inheritance tax, policing, immigration,
  climate — and vice versa, with the content flipped. None of those follows logically
  from the label. A theory has to explain what makes the label carry that predictive
  information: either something real holds the bundle together, or the prediction
  is a trick that needs debunking. Either way the theory owes us that account.


  2. The crossover cases. The anti-immigration leftist, the pro-single-payer right-winger,
  the economically radical and socially conservative Catholic. A theory that just
  says "those people are confused" is dodging unless it can say exactly what principle
  they''re confused about, and why the label still stings from both sides.


  3. The seat-history problem. The terms come from people sitting to the left and
  right of the king in the French assembly, which is a seating accident. But the content
  attached to each side has drifted so far since then that the words should have died,
  and instead they keep getting re-used across countries and generations. So the theory
  can''t be pure essentialism — the distinction is not just written in nature — and
  it can''t be pure nominalism either, because the accident has stayed useful in a
  way accidents normally don''t.


  4. The not-just-any-axis problem. If left/right were only team jerseys, any labels
  should work as well — up/down, mountain/coast. They don''t. So a theory should say
  why this particular axis got the job and keeps it, and what a fake axis would do
  differently.


  5. The one-axis-or-two problem. The standard move is to split left/right into an
  economic axis (equality vs hierarchy) and a social axis (openness vs tradition).
  But then the main thing left unexplained is why those two axes have correlated as
  hard as they do in most countries — and why the correlation now seems to be weakening
  in rich countries, producing people who are economically left and culturally conservative,
  or the reverse. If you dissolve the one axis into two, you inherit the correlation
  as a fresh anomaly.


  6. The realignment problem. Positions migrate across the line without anyone deciding
  the words stopped making sense. Free trade was a progressive and liberal reform
  cause in the nineteenth century, and in a lot of the rich world today it reads as
  right- or establishment-coded, with the left split between defending trade deals
  for growth and attacking them for labor, and the right likewise split. A theory
  has to say what, if anything, stayed constant across that migration.


  The part I actually care about: I suspect some of these jobs cannot be jointly satisfied.
  If one deep principle is doing the work (jobs 1, 4, 5), then realignment and seat-history
  (3, 6) look like failures of the principle. If it''s mostly historical coalition-building
  and self-labeling, then the predictive punch in job 1 looks like luck. So (a) which
