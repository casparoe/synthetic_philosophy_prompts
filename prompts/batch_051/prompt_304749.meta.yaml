  Expressivism: the view that moral statements are not truth-apt descriptions but
  expressions of non-cognitive attitudes (approval/disapproval, plans, or similar).
  The Frege–Geach problem: embeddings. The classic argument:


  P1. The meaning of a moral sentence is the attitude it expresses.

  P2. "Lying is wrong" expresses a negative attitude toward lying.

  P3. In "If lying is wrong, then getting your little brother to lie is wrong," the
  sentence "lying is wrong" (in the antecedent) does not express a negative attitude
  toward lying; the speaker may be precisely someone making a conditional claim without
  condemning lying.

  P4. Therefore, "lying is wrong" means something different inside the conditional
  than it does when asserted on its own.

  P5. Valid inference (modus ponens) requires that an expression occurring inside
  a conditional has the same meaning as the same expression when it occurs as a standalone
  premise.

  C. Therefore, expressivism makes moral modus ponens invalid, or cannot explain its
  validity.


  Which step could fail? Expressivists can reject P1: the meaning of a moral sentence
  isn''t simply the attitude it expresses; rather, the sentence has a conventional
  role that includes its contribution to complex constructions. Or reject P4/P5: same
  expression can have same meaning while its force varies across contexts; force/pragmatic
  role ≠ semantic content. Or accept P1 but give a theory of conditionalized attitudes:
  "If X is wrong then Y" expresses disapproval of the combination of... etc. Actually
  Blackburn: "Boo to (lying & not boo-to brother-lying)"? He treats conditionals as
  expressing higher-order attitudes toward combinations of attitudes. The antecedent
  doesn''t express the first-order attitude but the whole conditional expresses an
  attitude. So step 3 is true but doesn''t establish P4 if meaning of "lying is wrong"
  is not to be equated with the attitude expressed on any given occasion; rather the
  semantic value is the attitude-type that can be embedded via attitude-composition.


  So the right answer might be: the argument is valid up to P4, but P1 (or the inference
  from P3 to P4) is where it fails: expressivism need not identify meaning with the
  attitude expressed in *unembedded* use; it can identify the word''s meaning with
  a standing attitude disposition or a role that the clause contributes even when
  unasserted. A good prompt should ask exactly this.


