  The Frege–Geach problem (also embedding problem) for expressivism. Standard problem:
  expressivists analyze moral judgment as non-cognitive attitude expression (e.g.,
  "Stealing is wrong" expresses disapproval). But moral terms embed in unasserted
  contexts: "If stealing is wrong, then getting your little brother to steal is wrong."
  The antecedent doesn''t express disapproval, yet the term "wrong" must mean the
  same thing. An expressivist needs a compositional semantics for such embeddings.
  The problem is that the meaning of "wrong" in antecedent cannot be the attitude
  of disapproval, because the speaker isn''t disapproving of stealing. So expressivism
  seems unable to account for the validity of modus ponens in moral reasoning.


