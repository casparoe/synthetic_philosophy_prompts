  Cases should be concrete and historically plausible:


  Possible cases:

  1. A person robs a store at gunpoint because a hijacker holds his family hostage
  and threatens to kill them if he refuses. Verdict: not morally responsible/absolved
  or at least not blameworthy in the full sense? But he still intentionally does it.

  2. A person with a brain tumor causing severe personality change and rage kills
  someone. Verdict: diminished/not responsible.

  3. A person groomed since childhood by a cult/ideology commits an attack. Verdict:
  complicated, somewhat responsible but less? Hmm.

  4. An ordinary person who was never coerced but whose action was fully caused by
  their desires and reasoning, where they could have done otherwise only if they had
  different motives. Verdict: responsible. This is the compatibilist intuition.

  5. An addict who steals to get drugs; says he wants to stop but can''t. Verdict:
  less responsible but not zero.

  6. A person hypnotized to perform an action while conscious. Verdict: not responsible.

  7. A manipulated agent case (Pereboom''s four-case manipulation): a neuroscientist
  secretly implanted in someone desires, character, etc., such that the agent acts
  exactly as planned; the agent satisfies all compatibilist conditions (acts on first-order
  desires that are consistent with second-order desires, reasons normally). Verdict
  per many incompatibilists: not responsible. But compatibilists might say responsible
  if the manipulation is not currently coercive and the agent endorses it. This case
  is the hard-to-reconcile pair with ordinary determined agent.

  8. A person with severe mental illness who hears command hallucinations. Not responsible.

  9. A generally law-abiding person who, in a moment of rage, kills a spouse after
  provocation. Verdict: responsible but maybe mitigated.


