  Casual, first-person, maybe a bit rambling.


  ---


  You''re a philosophy graduate student who knows the free-will-and-moral-responsibility
  literature really well, especially the Dennett/Caruso debate over whether anyone
  ever "deserves" punishment in the basic sense. I''d like you to think out loud and
  work through a puzzle about a friend of mine before you settle on an answer.


  My friend Priya used to be a public defender, and over the years I''ve collected
  her verdicts on a bunch of cases — not the legal details, more whether the person
  "deserved" what they got or what should happen to them. Her track record:


  - Marta had a brain tumor pressing on her frontal lobe and one day attacked a coworker
  with a stapler. Priya: she wasn''t responsible; she belongs in a hospital, not a
  prison, and after the tumor came out she was horrified, so she wasn''t dangerous
  either.

  - Carl was in the middle of a schizophrenic episode, off his meds, and set a fire
  in the lobby of his apartment building. Priya: treating him as a criminal would
  be like punishing the illness; he needed forced medication and supervision, not
  a sentence.

  - Darnell was 16, grew up in a house where he was beaten and neglected, and robbed
  a corner store with some older gang members. Priya: he shouldn''t do adult time;
  he needed a stable placement and therapy, and she couldn''t see the point of ruining
  him.

  - Viktor has full-blown antisocial personality disorder, three violent assaults,
  and tells clinicians he''ll do it again and that he enjoys it. Priya: he can''t
  be on the street, but she wouldn''t call it punishment — more like containment or
