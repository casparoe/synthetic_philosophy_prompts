  Higher-order evidence: evidence about what your evidence supports, or about your
  own cognitive performance. Standard example: you''ve done a careful calculation
  and get answer P; then you learn that you''re sleep-deprived, or that a smart peer
  disagrees. The question: what is the rational response? Can it be rational to believe
