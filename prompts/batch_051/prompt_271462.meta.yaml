  The debate: For example, you assess the evidence and conclude the defendant is guilty.
  Then you get higher-order evidence that you''re too tired to think straight. Should
  you lower your confidence? Conciliatory views (Christensen, Elga) say yes, you should
  be moved by higher-order evidence even about your own reasoning. Steadfast views
  (Kelly, Titelbaum) say sometimes you can stick with your first-order conclusion.
  Epistemic akrasia is the state of believing P while believing your evidence doesn''t
  support P — usually regarded as irrational. The puzzle: if you lower your confidence
  in P in response to higher-order evidence, but your first-order evidence still supports
  P, are you being akratic? There are views: "the reasoning-first view," "calibrationism,"
  etc.


