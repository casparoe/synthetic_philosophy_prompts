  "In debates about verse translation there is a recurring analogy between translating
  a poem under formal constraints and performing a musical work from a score. On this
  picture, the source poem is like the score: it fixes certain parameters exactly
  (meter, rhyme scheme, stanza shape, often the sequence of images or moves), while
  leaving a great deal open—local word choice, syntax, nuance, emphasis—in the way
  a score fixes pitches and durations but leaves tempo, articulation, dynamics, and
  timbre to the performer. The analogy is used to argue that a translation that preserves
  rhyme and meter is not a distortion of the original but an interpretation of it,
  and that the translator''s departures at the level of the word are not failures
  of fidelity any more than a cellist''s rubato is a failure to play what Bach wrote.
  Conversely, it is used to say that a free-verse paraphrase of a rhymed poem is like
  describing a sonata rather than playing it. Audit this analogy. Give an explicit
  mapping—what plays the role of score, performer, instrument, performance, interpretation,
  audience, venue, and repeated performance—and then identify where the mapping breaks.
  In particular, consider whether the score/poem difference matters: a musical score
  is a set of instructions for producing sounds, not itself a completed artwork in
  the way a poem in its original language already is; a translation produces another
  text rather than an ephemeral event; and the target language may simply lack the
  resources that make a given formal effect possible. For each disanalogy, say whether
  it matters for the conclusion the analogy is used to support, namely that preserving
  form is a species of fidelity. Finally, state whether that conclusion survives,
  and if the analogy should be replaced or repaired, offer a better one."


