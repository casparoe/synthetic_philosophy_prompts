  - Kelly requires a binary/known-outcome bet; real projects aren''t clean. The mechanism
  forces members to state a probability and a payoff multiple, turning messy projects
  into bets — incentivizes gaming the parameters: lowball success criteria, redefine
  payoffs, choose short-horizon milestones so outcomes resolve quickly, book wins.

