  Kelly criterion: for a bet that pays b-to-1, with win probability p, q=1-p, the
  optimal fraction f* = (bp - q)/b = p - q/b. For even-money bets b=1, f* = p - q
  = 2p - 1. Full Kelly maximizes expected log of wealth; fractional Kelly (e.g., half-Kelly,
  f*/2) trades off growth for lower variance. Overbetting beyond full Kelly reduces
  expected long-run growth and can be ruinous; more than ~2× Kelly leads to negative
  expected log growth. Underbetting (fractional Kelly) gives slower growth but much
  lower drawdowns.


  Geometric mean vs arithmetic mean: maximizing expected log wealth ≈ maximizing the
  geometric mean growth rate of wealth for multiplicative processes. Ergodicity: for
  ensemble average (expected value) vs time average (what one person experiences over
  time).


