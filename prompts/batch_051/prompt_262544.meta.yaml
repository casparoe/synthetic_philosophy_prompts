  Prompt draft:


  "I''m a software engineer, not a student of philosophy, but I''ve ended up thinking
  about decision rules after building a personal project that sizes bets automatically,
  and I''d like a careful analysis of a mechanism a committee at my company is considering.
  Our R&D group funds maybe thirty internal projects a year out of a fixed budget.
  The current process has familiar pathologies: sponsors oversell their projects,
  committee members face no personal consequences for repeated overconfidence, and
  the portfolio drifts toward whatever sounds impressive in the room. A colleague
  proposed replacing the committee''s evaluation step with a structured betting overlay,
  on the theory that a funding committee is really making a sequence of compounding
  bets and should be judged the way a bettor''s bankroll is judged — by how the stake
  actually compounds, not by the average outcome."


  "The proposal is this. Each committee member begins the year with an account of
  100 points. For every project, the sponsor must register in advance a success criterion
  and a payoff multiple m (points of value per point of cost if the criterion is met).
  When a member votes to fund the project, the member must stake a fraction of their
  current account equal to the Kelly fraction for a binary bet that wins with their
  stated probability p and pays m-to-1: namely, (p(m+1) − 1)/m, with zero stake if
  the edge is nonpositive. A success credits 1 + m times the stake; a failure wipes
  the stake. Members who vote no neither stake nor gain. At year-end, each member''s
  bonus is proportional to the natural logarithm of their final account balance, and
  anyone finishing below 50 points loses their seat for the following year. The votes
  still determine funding by ordinary majority, so the accounts are an overlay, not
  the actual budget."


  "Treat this as a mechanism rather than as a good idea in the abstract. Walk me through
  what it incentivizes: how members will choose their stated probabilities and which
  projects will get funded; what the first and most damaging games will be (in the
  criteria, the multiples, the voting, or the seat threshold); how the composition
  of the committee changes after several years; and which of these failure modes can
  be fixed without giving up the underlying point. I would also like to know whether
  the design actually implements the thought that repeated risky decisions should
  be judged by expected log growth, or whether it smuggles that conclusion in by paying
  the log of the balance."


