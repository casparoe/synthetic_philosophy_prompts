  Objective Bayesianism: rational priors are determined by symmetries / constraints;
  the maximum entropy principle (Jaynes) says: given testable constraints (e.g., expectations
  of some functions), choose the distribution maximizing Shannon entropy subject to
  those constraints, because it is "maximally noncommittal" / "least biased" and makes
  use of only the information given.


  The argument to evaluate:


  (1) Where the evidence imposes no constraints, all elementary possibilities are
  symmetric, so the rational prior is uniform.

  (2) Where the evidence imposes constraints (e.g., a known expectation value), the
  rational prior should come as close to uniformity as the constraints permit.

  (3) The Shannon entropy of a distribution measures how close it is to uniformity
  — equivalently, how uninformative it is.

  (4) Hence the rational prior is the distribution that maximizes Shannon entropy
  subject to the evidential constraints.

  (5) Because constraints of the relevant sort pick out a unique maximizer, this procedure
  yields a unique rational prior for every evidential situation.

  Therefore, objective Bayesianism is right: there are fully rational, uniquely determined
  priors.


  Question: Is argument valid? If not, which step fails? More specifically: evaluate
  whether "closeness to uniformity" is well-defined before a metric or reference measure
  is chosen; whether entropy is the right measure; and whether the constraints themselves
  (which expectations are fixed?) encode information.


