  5. Bottom line (roughly 100 words). State whether the practice has a stable, defensible
  implicit theory, or whether it has drifted into its current shape without one.


  Do not include a bibliography or reading list, and do not cite sources; the analysis
  should stand entirely on the reasoning you present.


