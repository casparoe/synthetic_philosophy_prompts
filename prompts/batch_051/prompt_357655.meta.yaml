  You are a professional philosopher working in applied ethics, animal minds, and
  decision-making under moral uncertainty. Think slowly; begin by brainstorming several
  candidate commitments the practice below could rest on, then whittle them down to
  the ones the practice strictly requires.


  In commercial agriculture and public health, we routinely kill insects on a scale
  that dwarfs almost every other human-caused harm to animals: fields are sprayed
  prophylactically with broad-spectrum insecticides, districts are fogged to suppress
  mosquitoes, and industrial facilities rear insects for feed and food and then process
  them by the billion. In none of these practices is the possible suffering of the
  insects treated as a factor that counts; there is no welfare assessment, no dose–welfare
  trade-off, no institutional channel for the question even to be raised. Yet there
  is a serious line of argument — often put as a scale argument — that this is not
  defensible. It runs roughly as follows: even if the probability that an individual
  insect has a capacity to suffer is modest (say, one to ten percent), the expected
  number of suffering-capable creatures affected by ordinary annual insect-killing
  practices is still staggering, because the denominators are so vast; on ordinary
  expected-value reasoning, we should therefore be treating insect welfare, and our
  uncertainty about it, as one of the most consequential issues we face. The practice
  behaves as though that expected value is zero.


  Your task is to say what philosophical commitments this practice presupposes, not
  merely what it fits well with.


  Structure your response into the following sections, in this order:


  1. The presupposition stated (roughly 250 words). Reconstruct, as precisely as you
  can, the implicit view of insect sentience, its moral weight, or the decision rule
  that the practice must be relying on to treat vast possible suffering as nothing.
  Write it as a set of explicit principles.


  2. Strictly presupposed versus merely compatible (roughly 400 words). Distinguish
  what the practice is committed to, if anything, from what it merely coheres with.
  Show where the practice is philosophically underdetermined: identify the rival theories
  (about sentience, about value, about decision under uncertainty) that would each
  license the same behavior, and say which ones the practice rules out.


  3. Internal consistency (roughly 250 words). Ask whether the commitments you identified
  cohere with the precautionary and expected-value reasoning the same institutions
  use elsewhere — for example, when the stakes are very high but the probability is
  small in food safety, drug approval, or the protection of a rare vertebrate species.
  If there is an inconsistency, say exactly where it sits; if the positions can be
  reconciled, say how.


  4. The practice under the alternative (roughly 300 words). Suppose we ran the same
  practice under the scale argument instead: assign even a low subjective probability
  (say, a few percent) to insect sentience, treat it as decision-relevant, and apply
  ordinary expected-value reasoning. Describe concretely what would have to change
