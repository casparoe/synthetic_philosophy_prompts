  Actually the literature: "Death in Damascus" motivates "deliberational dynamics"
  (Brian Skyrms) and "ratifiability" (Richard Jeffrey). It''s a key case for deliberational
  decision theory: an act is ratifiable if it maximizes expected utility given that
  you choose it and are committed to it; in Death in Damascus, neither act is ratifiable,
  so rational deliberation may not settle on a pure act; mixed acts (randomization)
  can be ratifiable. Skyrms'' "Death in Damascus" example shows EDT fails but deliberational
  dynamics might settle on a mixed equilibrium where you randomize.


