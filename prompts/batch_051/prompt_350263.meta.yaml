  Domain: Mill''s views on India and colonial rule.


  Type: Present an argument that seems to prove too much and ask where it goes wrong.


  Student context: currently taking a course on 19th century political thought or
  British empire and political theory. They''re reading Mill''s "Considerations on
  Representative Government," chapter XVIII. They constructed an argument based on
  Mill''s assignment. They find conclusion absurd but can''t pinpoint flaw.


  Need to write casual, with maybe a typo. Use first person perspective as student.


  Construct argument:


  (1) For a free state holding a dependency, the only justification for governing
  that dependency without its consent is that the dependency is not yet capable of
  representative institutions, and that the ruling state is using its power to prepare
  the dependency for such institutions. [This is Mill''s claim, paraphrased]


  (2) Whether a people is capable of representative institutions is determined by
  whether their social conditions, habits, and degree of civilization allow them to
  practice them. [Mill''s criterion]


  (3) A free state that judges a dependency incapable is, in practice, the sole judge
  of that incapacity and of whether its rule is improving them.


  (4) If a free state can justify despotic rule over a dependency whenever it judges
  the dependency incapable, then any strong state can justify ruling any weaker people
  it deems backward, provided it claims to be improving them.


  (5) Therefore, by Mill''s reasoning, imperial conquest of any "less civilized" people
  is legitimate whenever the conqueror sincerely believes the conquered are not ready
  for self-government and that conquest will improve them.


  (6) That conclusion is unacceptable, because it would license unlimited colonial
  subjugation on the basis of the conqueror''s own self-serving judgments.


  (7) Therefore either Mill''s criterion of capability is inadequate, or the move
  from (3) to (4) is flawed, or we must accept the unacceptable conclusion.


  The prompt asks: where does this go wrong? Probably the flaw is an equivocation/justification
  asymmetry: Mill''s justification requires that the rule actually improves them,
  not merely claims to; and the capability judgment is not a purely factual matter;
  also there is a missing premise that the power''s judgment can be trusted in its
  own case. The argument from (3) to (4) may be an invalid induction or a slide from
  "a condition exists" to "whenever someone judges it exists." That''s a likely subtle
  flaw. The prompt should not signal answer; maybe say "I want to keep (1) because
  I think Mill''s distinction between settlement colonies and dependencies is real,
  but I can''t accept (5)."


