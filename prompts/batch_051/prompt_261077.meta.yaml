  (4) A sufficient reason for a series of contingent things is either internal to
  the series or external to it.

  (5) If internal, then the series would explain itself, either by each member being
  explained by another member, or by the whole explaining itself.

  (6) An explanation of the whole by the parts cannot terminate: each member is contingent
