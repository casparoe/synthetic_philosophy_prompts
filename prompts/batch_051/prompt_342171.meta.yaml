  The Principal Principle (Lewis 1980, "A Subjectivist''s Guide to Objective Chance").
  The Principle says roughly: a rational initial credence in a proposition A, conditional
  on the proposition that the objective chance of A at time t is x, and on admissible
  evidence E, should be x. Formalish: C(A | Htw & E) = x, where Htw says the chance
  of A is x. Admissibility is key — only inadmissible if it bears on A by means other
  than chance, e.g., future facts, crystal balls, better "evidence". This domain is
  nice and in-the-weeds. A Type A prompt could be: a student''s epistemic habit —
  deference to objective chance. But the instruction says the student is currently
  taking a related course; Type A asks about a defensible epistemic habit. Could be:
  "In my philosophy of probability class, we read Lewis on the Principal Principle.
  I''ve started... when someone gives me evidence about the future and I also know
  the objective chance..., I defer to the chance..." Hmm.


