  The Condorcet jury theorem domain specifics to weave in:

  - The theorem: if each voter in a group has independent probability p > 1/2 of choosing
  the correct of two options, then the majority''s probability of being correct increases
  with group size and approaches 1 as n grows. If p < 1/2, majority approaches 0 (or
  converges to incorrect).

  - Assumptions: binary choice, independence, equal competence, sincere voting.

  - Extensions/modern refinements: the "Jury Theorem" results with heterogeneous competences,
  the "non-asymptotic" bounds, the result that majority rule outperforms any single
  judge only conditionally, the "competence" threshold, the "Condorcet jury theorem"
  as an epistemic argument for democracy.

  - Problems: correlated votes (a shared bias breaks independence), strategic voting,
  common-cause dependence, voters not being better than chance (e.g., taste, arbitrariness),
  and the theorem doesn''t say which option is right or when p > 1/2 holds.

  - Also Condorcet''s related voting paradox / jury theorem distinction. But domain
  specifically "Condorcet jury theorem" so focus on epistemic aggregation.


  Now the novel twist (niche ideas injected): the prize context has a mix of question
  types:

  1. Adjudicative/factual questions that may have an objective "right" answer but
  with error: e.g., whether two submitted books are substantially the same work; whether
  a book meets eligibility rules (publication dates, author nationality); whether
  a translation is from the same original. Jurors as multiple readers improving accuracy
  through majority.

  2. Evaluative judgments among eligible books: "best novel" — no shared p > 1/2 because
  there''s no regimented right answer; taste and faction. Majority rule can still
  be a fair aggregation of preferences, but it''s not for epistemic reasons — Condorcet''s
  jury theorem should not be invoked.

  3. Intermediate: recognising "literary quality" maybe there is a partially shared
  standard; but risk of correlated error from fashion, groupthink, prize culture.
  The procedure should detect when jurors aren''t independent (e.g., all read the
  same reviews, all admire the same famous author) and either diversify information
  or flag reduced confidence.


  The prompt should ask the model to build a procedure that:

