  vs. hybrid.

  - For factual: use majority rule with odd-numbered panels; establish a competence
  check (e.g., each juror reads the relevant texts independently before discussion;
  written individual verdicts before deliberation to preserve independence); aggregate;
  if competence cannot be presumed, don''t dress it up as truth-tracking.

  - For evaluative: majority rule may be legitimate as a fair preference-aggregation
  device (or Borda/ranked voting?), but justify it on different grounds, not the jury
  theorem; the procedure should not pretend aggregate taste converges to quality.

  - Where correlation is a worry (everyone read the same review or shares the same
  aesthetic ideology), the procedure should route to a different mechanism: split
  the panel, assign different primary texts to different jurors, or acknowledge the
  decision is one of values.


