  answer to each; a clear statement of where the procedure authorises a majority vote,
  where it authorises deliberation toward consensus, and where it stops and the decision
  is handed to a named person as a matter of taste or values rather than aggregation;
  and the points at which judgement cannot be eliminated, marked as such. I want the
  distinctions that the jury theorem actually depends upon to survive the simplification
