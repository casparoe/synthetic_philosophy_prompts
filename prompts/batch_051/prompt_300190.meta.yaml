  I have read a little about Condorcet''s jury theorem and I think it might do some
  useful work here, but I also fear it will be misapplied. My rough understanding
  is this: if each voter in a group is independently more likely right than wrong
  on a two-option question, then a majority of a sufficiently large group is very
  likely to be right, and the likelihood rises with group size; if the voters are
  worse than chance, the majority is very likely to be wrong. Please write a procedure
  grounded in what this theorem can and cannot support, not a lay paraphrase.


  The procedure must be usable by a prize administrator and seven jurors, none of
  whom have any training in formal or social-choice theory, over a single weekend,
  with decisions that meaningfully affect writers'' livelihoods. It should cover at
  least these stages of our work: (a) eligibility disputes and other factual matters,
  such as whether two shortlisted books are substantially the same work, where there
  seems to be a fact of the matter that a panel might get wrong; (b) the cut from
  longlist to shortlist; and (c) the choice of the winner.


