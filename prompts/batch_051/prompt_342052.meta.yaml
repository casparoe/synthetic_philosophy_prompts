  ---


  I''m recently retired — atmospheric chemistry was my field for thirty-some years
  — and I''ve fallen into reading philosophy of risk and collective decision-making,
  which means the old crowd has started using me as the dinner-table referee. The
  other week two of them, Diane and Martin, got into it over geoengineering research,
  specifically stratospheric aerosol injection, and neither gave an inch. I''d like
  a neutral breakdown of whose right about what, because I honestly keep flipping
  sides myself. Here''s the exchange as best I remember it:


  (1) Martin: Funding research into solar radiation management is a moral hazard.
  The minute a serious program exists, the pressure to actually cut emissions softens,
  because there''s a cheap-looking fallback on the shelf. You can already see it with
  carbon capture R&D being waved around to keep fossil fuel projects alive. Aerosol
  research would be that, but much worse.


  (2) Diane: That''s an argument for ignorance, not caution. Emitters don''t need
  an excuse to delay; they''re delaying anyway. If we hit a threshold — ice-sheet
  collapse, methane release, something like that — we''d want to know whether a temporary
  aerosol brake works and how it fails. Termination shock is exactly the kind of thing
  you''d want studied before anyone tries it. Refusing to learn isn''t precaution,
  it''s gambling blind.


  (3) Martin: But termination shock cuts the other way. It''s a reason never to deploy,
  because you can''t guarantee you''ll never stop once you start. So what''s the end
  state of this research? Either it goes nowhere — pure waste — or it becomes a pipeline
  to deployment. Either way, it raises the odds of a start-and-stop catastrophe, not
  lowers them.


  (4) Diane: The start-and-stop catastrophe is already on the table, because some
  stressed country with a modest industrial base can do a unilateral deployment if
  it gets desperate enough. Our not funding research doesn''t remove that option;
  it just removes the baseline measurements, the monitoring, and the norms that might
  restrain the first actor. "Who decides" is a real question, but it doesn''t get
  answered better by ignorance — it gets answered by whoever acts first.


  (5) Martin: So your answer to the governance problem is to build the technology
  and then hope the institutions catch up. That''s backwards. Once the thing exists,
  the people who control it decide, and everyone else lives with it. The only way
  to stop a unilateral actor from answering "who decides" is for the technology not
  to exist.


  (6) Diane: But not funding research doesn''t vote to keep aerosols out of the atmosphere.
  It votes to have the first deployment happen blind — no baselines, no prior modeling,
