  A human assistant who confidently gives a client a plausible-sounding but false
  answer — dates, legal details, the side effects of a drug — is typically taken to
  have done something specific: if they knew it was false, they lied; if they didn''t
  care enough to check, they bullshitted; if they checked and were mistaken, they
  erred. The classification matters for blame, trust, and whether the assistant should
  be retrained or fired.


  A language model that does the same thing is normally described as having "hallucinated,"
  and the lie/bullshit/error question is mostly dropped. We treat it as an engineering
  defect: the output is bad, but we don''t ask what the output says about the speaker''s
  relation to the truth.


  State and assess the asymmetry. Is the difference between the two cases one that
  justifies dropping the lie/bullshit/error framework for LLMs, or is the "hallucination"
  label doing work that the older vocabulary would do better? In particular: Frankfurt''s
  distinction between lying and bullshitting turns on the speaker''s orientation toward
  truth — the liar is tracking the truth in order to conceal it, the bullshitter is
  indifferent to how things stand. Does a language model, or the practice of presenting
  its outputs as answers, have enough of an orientation toward truth to make that
  distinction apply, or are LLM falsehoods a fourth category that the distinction
  merely obscures?


