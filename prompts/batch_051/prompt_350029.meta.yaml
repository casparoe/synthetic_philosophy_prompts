  At a reading group, two people argued about Turing''s ESP section in "Computing
  Machinery and Intelligence" (1950). I was asked to referee.


  Frame: One said section 6(9) is a rare case of a top scientist taking parapsychology
  seriously and showing how to handle an awkward empirical finding. He noted Turing
  after listing objections goes to extra-sensory perception. Paraphrase: Turing says
  the statistical evidence, at least for telepathy, is overwhelming, and if telepathy
  does exist,it would let an interrogator''s thoughts leak to the contestant, so the
  imitation game would need a telepathy-proof room. He adds that the idea fits some
  of the otherwise puzzling facts about miracles, faith healing, etc. First coworker
  says this is methodologically beautiful: rather than pretending there are no anomalous
  data, Turing turns them into an experimental nuisance variable and proposes a control.
  He didn''t assert telepathy is real; he conditionally conceded that if it''s real,
  the test is flawed.


  Second coworker says no, the move is embarrassing precisely because Turing treats
  ESP as the only "serious" objection among eight; he gives parapsychology the same
  epistemic standing as mathematics or consciousness. The "statistical evidence overwhelming"
  line is credulous; by 1950 parapsychology was already messy. And a telepathy-proof
  room isn''t actual experimental control because there''s no procedure to know when
  it''s achieved—it''s a fantasy control. She says Turing later says he would be more
  inclined to explain away telepathy, but still wants to keep it in the design. She
  says this gives respectability to junk.


  First replies: she''s conflating prior probability with design. If you''re designing
  a discriminating test, you should guard against every channel of information you
  haven''t closed, including ones you find unlikely. You don''t have to believe telepathy
  is real to demand a blindfold in a card trick; you just need an opponent who could
  be using it. And Turing''s line about "misunderstood forms of telepathy" etc is
  him doing ordinary scientific fallibilism.


  Second says: no, the difference is blindfolds close a known channel with known physical
  properties; telepathy-proofing closes a channel whose existence isn''t established,
  so no engineering specification. And Turing''s claim that telepathy would explain
  miracles is armchair theology, not science. The right experimental response to ESP
  evidence is better replication, not folding it into AI''s imitation game.


