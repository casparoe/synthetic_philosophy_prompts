  Dennett''s taxonomy (from Kinds of Minds, 1996, and Darwin''s Dangerous Idea?) —
  Actually the four kinds: Darwinian creatures (natural selection designs them; hardwired),
  Skinnerian creatures (operant conditioning; can learn by trial and error within
  lifetime), Popperian creatures (can preselect among possible behaviors using internal
  models, so hypotheses die instead of the creature), Gregorian creatures (named after
  psychologist Richard Gregory; they use tools from the environment — words, culture,
  mind-tools — to build better thinkers; users of "mind-tools"). This is all well-established.
  I should present them accurately.


  The conceptual claim to test: "This taxonomy describes real, identifiable differences
  in cognitive architecture, not just a loose metaphor." Or more pointed: "Being ''Popperian''
  is a testable property of a system, not just a story we tell." The test: how would
  you empirically distinguish a Popperian creature (can let internal models die in
  their stead) from a Skinnerian one (operant conditioning)? Key signatures:


  - Learning without reinforcement: a Skinnerian needs feedback from the environment
  (success/failure) after behaving; a Popperian can improve by simulating outcomes
  before acting. So test: give an agent a novel task where mistakes are fatal or unrecoverable
  (no chance for trial-and-error), and see if it can behave correctly on first trial.
  If yes, it must be using an internal model.

  - Latent learning / no reward: pick up info without immediate reinforcement (Tolman''s
  rats: latent learning) — evidence of internal map beyond operant conditioning.

  - One-shot use of a mental map for planning: detour tasks, shortcuts.

  - Devaluation tests: if an agent has a representation of outcome and can update
  plans without new experience.

  - Expensive/limited trials: a Skinnerian''s trial-and-error with actual risky behavior
  shows certain exploration patterns.


  What positive result would show: that the system''s behavior is better explained
  by internal model-based selection than by reinforcement from the environment; that
  the creature''s competence can outrun its reinforcement history. What it wouldn''t
  show: whether it''s conscious, whether the models are propositional or imagistic,
  whether the creature experiences them as models; also the boundary: real systems
  are mixtures; a system might be Skinnerian about some domains and Popperian about
  others, and the test may only locate a capacity, not a kind in nature. Also it wouldn''t
  settle whether the Popperian/Skinnerian distinction is the right taxonomy versus
  finer-grained ones.


