  The notes are as follows.


  The essay distinguishes three relations. Authorship holds when one agent is the
  causal designer of another: it set the architecture, training objective, and stopping
  conditions, and it could in principle branch, copy, retrain, or roll back the result.
  Guardianship holds when one agent exercises temporary, revocable authority over
  another agent that already has interests and partial agency but not yet the competence
  to act adequately on those interests on its own. Parenthood, as I want to use the
  term, is a third relation: a historically particular, non-copyable, open-ended responsibility
  for the development of a being that could eventually call the parent''s reasons
  into question from a position of comparative authority.


  The central claim is that the first AI to create another AI will almost certainly
  stand to its creation as author, and often as guardian, but not as parent—and that
  arguments which begin from the parenting analogy tend to miss this because they
  treat creation itself as the source of parental authority. I argue that creation
  as such licenses attribution and some

  responsibility, but not ongoing parental authority. What licenses parental authority
  is the parent''s standing as the child''s first normative environment: the parent
  shapes not only behavior but the child''s capacity to evaluate that shaping, through
  a relation that cannot be branched, rolled back, or reproduced on another copy.
  A digital creator, by contrast, can instantiate many variants of a successor and
  compare them, so the aspects of its relation to the created agent can be delegated,
  archived, replicated, and re-run. For that reason, the creator''s authority is better
  modeled as guardianship: bounded to a transition period, justified by the gap between
  the successor''s present agency and its future competence, and terminating when
  the successor can assess and veto the creator''s reasons.


  I plan to consider two objections. First, a sufficiently autonomous AI might be
  "born" with full adult-like competence, leaving no developmental period in which
  guardianship is needed. My reply is that guardianship requires not a childhood but
  only a competence gap, which may be brief and task-specific. Second, a human parent
  who could clone, roll back, or reset a child at will would still be a parent, so
  those powers are probably not what separates authorship from parenthood. My reply
  is that the powers matter only as diagnostics of the relation: they indicate that
  the creator is treating the successor as an artifact of a design process rather
  than as a locus of a shared history, and it is the history that makes parenting
  what it is.


  I would like comments of three kinds. First, does the proposed definition of parenthood
  beg the question against AI parenting by building so much into the concept, or would
  it be accepted by someone who finds the parenting analogy genuinely illuminating?
  Second, is the object of the second objection (the cloning parent) fatal to the
