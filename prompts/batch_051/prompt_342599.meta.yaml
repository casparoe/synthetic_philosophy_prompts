  outcome at Salamis is entailed. So a world in which the Athenians do lose must depart
  from the actual world in one of two ways: it either differs from the actual past
  before the battle (a backtracking divergence), or it contains some localized violation
  of the actual laws at or around the point of divergence (a ''miracle'').

