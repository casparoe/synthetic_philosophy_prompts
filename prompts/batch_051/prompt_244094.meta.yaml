  Draft:


  "I am a PhD student working on depiction and the philosophy of perception, and a
  discussion in our aesthetics seminar has left me unable to locate the flaw in an
  argument. We were considering the transparency thesis in the philosophy of photography:
  the view that when we look at a photograph, we literally see the photographed object
  through the photograph, in roughly the way we see things through a mirror or a telescope,
  whereas when we look at a handmade picture we see only the marked surface. The usual
  motivation is that a photograph''s visible features are counterfactually dependent
  on the scene through a mechanical process that does not require the photographer''s
  beliefs about the scene to be true, while a painter''s beliefs and intentions mediate
  the relation between scene and canvas."


  Then the argument:


  "A colleague in the seminar pressed the following objection, which he said shows
  that the thesis, so motivated, proves too much.


  (1) If photographs are transparent in virtue of a counterfactual dependence between
  scene and image that is secured mechanically and independently of anyone''s beliefs
  about the scene, then any representation with that same dependence structure is
  transparent for the same reason.

  (2) Photographs have that structure: had the scene differed in visible respects,
  the photograph would have differed correspondingly, and this holds even if the photographer''s
  beliefs about the scene were false.

  (3) So photographs are transparent.

  (4) But a careful drawing made with a camera lucida, or a freehand copy made by
  an artist who simply transcribes the projected image, also has that structure: the
  visible features of the drawing are fixed by the optical projection, and the drawing
  would track changes in the scene even if the artist misdescribed or misunderstood
  what she was drawing.

  (5) So by parity of reasoning, we literally see the depicted object through such
  a drawing.

  (6) The same reasoning extends further: a plaster cast of a face, a brass rubbing
  of an inscription, even a thermographic image? ... maybe a photogram... also transparent.

  (7) But if we are willing to say we literally see the object through any mechanically
  produced, belief-independent representation, then the line between photograph and
  handmade picture collapses everywhere a mechanical aid is used; and if we refuse
  to say this, we need some further feature that photographs have and camera lucida
  drawings and casts lack.

  (8) No such further feature is available that isn''t ad hoc.

  (9) Therefore the transparency thesis either proves too much or rests on an ad hoc
  distinction."


  Then ask: "I would most like to keep the thought that there is a difference in kind
  between looking at a photograph and looking at even a very accurate handmade drawing,
  and also the thought that we do not literally see a person through a death mask.
  But I cannot see which step to reject without giving up one of the premises that
