  Let''s write:


  I''m an engineer at a small robotics company. We build a home robot that does fetch-and-carry
  tasks, and I write behavioral specs for new features. The problem I keep hitting
  is that every new behavior seems to require saying not only what should change,
  but explicitly that every other thing in the house stays the same. Our specs end
  up as giant double negatives and no one actually knows what''s normative. I recently
  read a summary of the frame problem in McCarthy and Hayes, Some Philosophical Problems
  from the Standpoint of Artificial Intelligence, and the bit about how you shouldn''t
  need to enumerate all the non-effects of an action feels like my life, but I don''t
  know how to turn that into a spec-writing method instead of a philosophy gripe.


  Give me a reusable decision procedure for writing a robot behavior spec, for engineers
  who are not logicians, that decides, for each state variable or object in the robot''s
  world model: (a) whether it must be listed as a precondition, (b) whether it can
  be treated as unchanged by default and thus omitted, (c) whether it needs a monitored
  condition that triggers re-planning, or (d) whether it belongs in a separate "things
  this behavior may disturb" list that the robot must check after acting. The procedure
  should include the questions in order, what counts as a sufficient answer, and where
  the spec writing stops being mechanical and has to go to a systems lead or safety
  reviewer.


  Then run the procedure on two cases we''re actually dealing with: picking up a mug
  from a breakfast table covered in other dishes and napkins, and navigating across
  a living room where a child''s toys may be on the floor. The third worked case should
  be one where the procedure tells us to omit something that our safety reviewer would
  expect to see in the spec; make it honest about that.


  Structure the answer with these sections and approximate lengths: The procedure
  (500 words), Case one (200 words), Case two (200 words), Where it gives me an answer
