  ---


  I am a high school student, and in my school''s political philosophy club two members
  got into a long argument about economic inequality that we had been assigned to
  read for: one defended what our materials called the American attitude, the other
  defended the European attitude. I was asked to referee and found I could not settle
  it, so I am writing this out for a point-by-point adjudication.


  The exchange went roughly as follows.


  (1) The first student said the American attitude is that what matters is not where
  people end up but whether the process that got them there was fair; if people begin
  with adequate opportunities and trade freely, the resulting differences are not
  themselves unjust. A society that tries to equalize outcomes, he said, must interfere
  with liberty to a degree that is worse than the inequality it prevents.


  (2) The second answered that the American attitude refutes itself in practice, because
  starting positions are never equal: wealth, education, and social connections pass
  from parents to children, so by its own test of fair competition the standing inequalities
  in American-type societies fail. The attitude, she said, functions mostly as a rationalization
  for inherited advantage.


  (3) The first replied that this is an objection to American practice, not to the
  American principle. The distinction between fair and unfair processes is presupposed
  by the European side too, he said; otherwise no one could say which outcomes are
  unjust. The American attitude is best understood as a severe standard against which
  actual economies are judged, not as an apology for them.


  (4) The second then shifted ground. Even inequalities that do arise from a fair
  process, she said, become objectionable once they grow large, because money converts
  into political influence and social rank. The harm is not only that the poor lack
  resources; it is that they cannot participate in public life without shame, and
  the very rich come to dominate it. That, she said, is an injustice independent of
  any procedural failure.


  (5) The first said this blurs two distinct concerns. Politics being captured by
  money and citizens failing to treat one another as equals are both failures of fairness,
  and the American attitude can condemn them without condemning inequality as such.
  The European argument, he said, slides from "extreme inequality has bad effects"
  to "any durable inequality is unjust," and only the first has been defended.


  (6) The second said the line between process and outcome cannot be maintained across
  time, because this year''s unequal result becomes next year''s unequal starting
  point. The only way to prevent economic advantages from hardening into unequal opportunities
  is to keep the gaps compressed from the outset, which is exactly the European insistence
  that inequality is a public problem before it produces any particular harm.


  (7) The first said this conclusion outruns the premises. It may justify progressive
  taxation, public education, and limits on political spending, but it does not justify
  the specifically European view that equality of condition is valuable in itself.
  Once the feedback loop between wealth and opportunity is contained, he said, a society
  may still tolerate large distances between top and bottom; the remaining European
  objection reduces to the fact that those distances are unpleasant to contemplate,
  which is a preference rather than a finding of injustice.


  (8) The second said the remaining objection is not a preference but a point about
  status. Where some citizens are vastly richer than others, the poorer are treated,
  and come to regard themselves, as inferiors, and the shared political life of the
  society decays into mutual suspicion and contempt. What the American attitude counts
  as a tolerable cost is, on the European view, the very thing a political community
  exists to prevent.


  Please go through the exchange and adjudicate it point by point: for each move,
