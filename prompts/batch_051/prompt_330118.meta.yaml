  Let me draft:


  ---


  I''m a PhD student in phil of bio, and I''ve been trying to get my head around the
  handicap principle by testing my reactions to a handful of cases. I keep making
  judgments that don''t obviously line up, and I''d like to know whether there''s
  a single principle behind them or whether I should drop some of the judgments.


  Here are my verdicts.


  1. Peacock''s tail. I think it''s honest, and the mechanism is the cost: a tail
  that big is a burden in everyday life, so only a male in genuinely good condition
  can grow and carry one and still stay alive. Cost is doing the work.


  2. A gazelle that spots a cheetah and does those stiff-legged bouncing leaps instead
  of bolting. I''m sure the stotting is honest — predators apparently use it to decide
  who to chase — but I don''t think the cost of stotting is what makes it honest.
  It''s honest because the leap itself is a performance you can only do if you''re
  fast and full of energy, like a feat of strength. If every gazelle could do the
  same leap at the same cost, the signal would dissolve. So this looks like a different
  mechanism from the peacock.


  3. A poison frog''s bright colors. Honest enough (the colors track toxicity), but
  the color isn''t costly to produce in the relevant sense; it''s tied to the poison.
  So definitely not a case of cost keeping things honest.


  4. Nestling birds begging loudly. I''m convinced the loudness is honest because
  it''s dangerous: it attracts predators. A full nestling won''t scream for a marginal
  extra worm if screaming might get it eaten, but a starving one will. That''s the
  handicap/cost story through and through — although I notice the cost is paid only
  after the parent starts responding, which feels importantly different from the peacock''s
  tail that''s continuously costly. (Maybe that distinction doesn''t matter.)


  5. The guy who buys a Rolex to signal that he''s wealthy. I find myself thinking
  this is a handicap when the cost is a real sacrifice for him, but just a convention
  when it isn''t; and counterfeits ruin it precisely because they break the link between
  the cost and the trait. So cost matters, but only relative to the signaler''s means.


  6. Diamond engagement rings. I have much less sympathy for the claim that they''re
  honest signals of commitment. A rich man can drop a month''s salary (or whatever
  the supposed rule is) without feeling it, while a poor man can''t; so the ring seems
  to track willingness and ability to spend, not fidelity. If anything the signal
  that would track commitment is something like closing off exit options, not buying
  a thing. I don''t know why I''m happy to call the Rolex a handicap but not the ring.


  7. Costly religious requirements — dietary restrictions, scarification, that sort
  of thing. I think they work as honest signals of commitment to the group, and the
  cost is what keeps out shirkers. But here the quality being signaled (commitment
  to the group) is, as far as I can tell, created by paying the cost. The peacock''s
  tail doesn''t create his quality; the initiation scar maybe creates the commitment
  it signals. That feels like a different beast, and it bothers me that the same "handicap
  principle" is supposed to cover both.


  8. A Fisherian runaway ornament: females develop an arbitrary preference for a longer
  tail, and the trait spreads even though the tail says nothing about the male''s
  quality. I believe such ornaments can evolve and be expensive without being informative
  at all. But then why doesn''t this threaten my peacock verdict? I want to say the
  peacock''s tail is honest because the cost is condition-dependent in a way the runaway
  tail isn''t, but I can''t state that cleanly.


  So: is there one principle (or a small set) of signal honesty that yields all or
  most of these, and if not, which verdicts do I have to give up? Please state the
  principle(s) precisely, say what each clause is for (which case motivates it), tell
  me what it predicts for a case I haven''t listed — say, a male bird that defends
  a rich food territory to attract females — and be honest about which of my eight
  judgments the account can''t accommodate.


