  could become invisible would eventually help himself at the expense of others, because
  people generally act justly only out of fear of punishment or loss of reputation,
  and the ring removes exactly that check. Wells gives us a character in Griffin who
  actually performs the experiment, and within a short time he has moved from theft
  and deception to violence and to a plan for systematic terror. On the surface this
  looks like a literary confirmation of Glaucon''s pessimism.


  But I am not sure the novel is really just an illustration, and I would like a careful
  reading of it through Glaucon''s challenge. Glaucon asks us to imagine an otherwise
  decent person acquiring invisibility, whereas Wells spends the early part of the
  novel making Griffin secretive, proud, and isolated long before the experiment;
  the novel also makes invisibility itself a source of hardship rather than pure freedom,
  from the practical problems of keeping warm, eating, and moving through a society
  that responds to him as a monster. I would like to know whether the novel should
  be read as a genuine test of Glaucon''s claim about the just man freed from detection,
  or as a deliberately rigged case that changes the question. Which scenes most reward
