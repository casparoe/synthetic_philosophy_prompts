  thesis. I take the thesis, in its proper epistemic form, to be neither a mathematical
  theorem nor a stipulative definition of ''computable,'' but a robust, corrigible
  hypothesis about the extension of our pre-theoretic notion of effective computability:
  roughly, that the class of functions computable by an idealized finite procedure
  following explicit rules coincides exactly with the class captured by Turing machines
  and the equivalent formalisms. The striking convergence of independent formal explications
  — Turing machines, lambda calculus, general recursive functions, and the rest —
  plus the persistent failure of anyone to produce an intuitively effective procedure
  that outruns them, is what makes the thesis compelling; but because one side of
  the identity statement is informal, the thesis could in principle have been false,
  and its security is empirical or quasi-empirical rather than purely mathematical.


  I would like you to tell me what would count against this specific position, not
  merely what would count against the bare Church-Turing thesis itself. In particular:
  (1) classify the possible defeaters — e.g., a generally accepted example of an effectively
  computable function that is not Turing-computable; an argument that the informal
  notion is too indeterminate to support a stable identity claim; a demonstration
  that the convergence of formalisms is less independent than it looks; a result in
  physics or computability that forces a revision of the physical Church-Turing thesis;
  and so on — and say which of these undermine my meta-level reading of the thesis,
