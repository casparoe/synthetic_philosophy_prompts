  ---


  I''m giving a department colloquium next month defending a reading of Rousseau''s
  Letter to d''Alembert that''s meant to be a bit revisionist. My thesis is that the
  standard reading—that he opposed theater because it corrupts morals, licenses bad
  passions, and degrades actors—understates the real argument. I think the deeper
  worry is about civic spectatorship: theater trains people to be an audience, watching
  and judging from outside, and that stance leaks into how citizens relate to their
  own political community. On my reading, this explains why Rousseau treats a theater
  in Paris differently from a theater in Geneva: in a large, already-corrupt capital
  it''s just another distraction, but in a small republic it would displace the participatory
  practices that keep citizens republican. It also explains how he can grant that
  a well-made play is well made and still object to it, because the problem isn''t
  primarily the content being shown; it''s the relation to the audience that showing
  creates.


  The audience will be mostly political theorists and early-modern historians of philosophy.
  There are maybe six Rousseau specialists, a couple of people who work on deliberative
  and epistemic democracy, and the rest are generalists who know the Social Contract
  much better than the Letter. The deliberative-democracy people are likely to resist
  the participation/spectatorship opposition, and the Rousseau people are going to
  think I''ve underweighted the moral psychology of amour-propre and his actual claims
  about women, actors, and Geneva. The chair is a Kantian who will think the whole
  thing is a mess, but she''ll probably keep quiet.


  Give me a Q&A prep sheet, not a defense of my reading. I want the objections I''m
