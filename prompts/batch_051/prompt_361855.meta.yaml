  Prompt draft:


  "I''m giving a department colloquium next month defending a reading of Rousseau''s
  Letter to d''Alembert. My thesis is that the usual line—that Rousseau opposed theater
  because it corrupts morals, inflames passions, makes actors into pariahs, etc.—misses
  his real worry. I argue the deeper objection is about what theater does to civic
  attention: it trains people to be spectators in their own political community, not
  active participants. The play presents a world that asks to be watched and judged,
  and over time that spectatorial stance leaks into how citizens relate to the republic.
  I use this to explain why he treats Geneva differently from Paris: in a large, already
  corrupted capital theater is an anodyne distraction, but in a small republic it
  would replace the activities that keep a citizenry republican. I also claim this
  reading lets him concede that Molière''s *Misanthrope* is well made while still
  objecting to it—because the problem isn''t the content of the play so much as the
  stance it puts the audience in."


