  different branches of a multiverse, or across a large universe beyond each other''s
  light cones, who can''t communicate but can predict each other''s source code. Decision
  theory: in Newcomb-like problems, one-boxing is justified because your decision
  correlates with the predictor''s prediction even though there''s no causal influence
  from action to prediction. Acausal trade extends this: two agents each facing a
  decision, each would benefit if both cooperate, neither can causally affect the
  other, but they can run versions of each other or commit to decision procedures;
  if each knows the other runs the same decision theory, "cooperate" is the move that,
  conditional on choosing it, makes it more likely the counterpart chose the corresponding
  move. Critiques: evidential vs causal decision theory divide; the "counterfactual
  mugging" issue; the problem of which counterpart to trade with, the huge space of
  possible agents doing "acausal blackmail" (someone precommits to hurt you unless
  you pay, you can''t causally affect them; should you pay?); commitment mechanisms;
  selecting the right correlation; infinite fair bot multiplicity; perfect prediction
  unrealistic.


