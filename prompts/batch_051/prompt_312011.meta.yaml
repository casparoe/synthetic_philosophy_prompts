  I have been trying to work out, in a principled way, whose values an AI system should
  be aligned to, and my own reactions to particular cases keep pulling me in different
  directions. I would like you to help me find the principle — or small set of candidate
  principles — that best captures those reactions, test it against cases I have not
  considered, and tell me honestly which of my verdicts, if any, it cannot save.


  Here are the reactions I want to accommodate. First, when a personal assistant helps
  one user keep kosher and another follow a strict carnivore diet, I want the system
  to take each user''s dietary values as given and help them pursue their own conception
  of a good meal, rather than imposing some independent standard of correct nutrition.
  Second, when a city uses an AI to rank applicants for scarce subsidized housing,
  I want the system to use impartial public criteria — need, vulnerability, time on
  the waiting list — and not let any group''s view of who deserves housing govern
  the ranking. Third, when a private religious association runs an AI moderator that
  removes posts conflicting with the association''s teachings, I think that is permissible:
  a private association may enforce its own thick norms on its own forum. Fourth,
  when a very large general-purpose social platform — large enough to function as
  a de facto public square — tunes its ranking and moderation AI, I want it to refuse
  to become an instrument of any one group''s comprehensive doctrine, and to confine
  itself to a thin set of widely defensible rules about spam, harassment, incitement,
  and platform manipulation, even if every group ends up with some content it dislikes.
  Fifth, when a manager gives an AI assistant the instruction to optimize layoff decisions
  for her team''s short-term output and ignore everything else, I do not want the
  system simply to defer to her values; I want it to surface the interests of the
  affected employees and the fairness implications of the selection rule.


  The two pairs that look alike but feel different to me are the first and fifth cases
  (both involve an individual''s AI assistant, yet I want deference in one and not
  the other) and the third and fourth cases (both involve a private company''s moderation
  AI, yet I permit thick norms in one and demand neutrality in the other). I keep
  reaching for something like this: defer to the principal''s values in private, low-externality
  contexts; switch to liberal neutrality, public reason, and impartial aggregation
  when the AI performs a public function or when third parties are seriously affected;
  and treat sufficiently large private platforms as public functionaries for this
  purpose. But that principle looks like a patchwork to me, and I suspect it may be
  rationalizing my verdicts rather than explaining them. Please state the most defensible
