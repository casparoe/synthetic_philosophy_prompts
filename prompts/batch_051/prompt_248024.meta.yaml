  the difference between a mere convention and a full-blown social norm: in particular,
  the moment at which a coordination regularity that could have been otherwise comes
  to feel obligatory, with violation inviting not just surprise or frustration but
  something like censure. I don''t want to lecture first, and the students shouldn''t
  hear the words convention and norm in the technical sense until the debrief.


  The game should move through two or three stages. Stage one should be a pure coordination
  problem with multiple equally good equilibria (e.g., choosing a side, a meeting
  place, a price, a shared signal), with modest payoffs that don''t require real money;
  students should be forced to solve it repeatedly without talking, so a regularity
  emerges from precedent and common knowledge. Stage two should keep the same underlying
  coordination problem but add some pressure that makes deviations tempting — unequal
  payoffs, a costly "outside option," or a subset of players who can profit by breaking
  the emergent regularity. Stage three should add the possibility of cheap but not
  free sanctioning (e.g., a player can spend a point to deduct points from a deviator,
  or can publicly mark a defector in a way that shapes later play) so that students
  face the second-order question of whether to pay to punish someone who broke a rule
  that was never agreed to. The whole point is that they should feel the shift from
  "everyone happens to do X" to "doing Y is wrong," and they should also feel how
  precarious that shift is — how easily the norm collapses if the sanctioners are
  not themselves sanctioned.


