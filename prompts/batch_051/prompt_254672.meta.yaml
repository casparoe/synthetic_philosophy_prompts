  Contingency argument (Leibnizian):

  - PSR: every contingent truth has an explanation/sufficient reason.

  - The world (the totality of contingent things/facts) is contingent (it could have
  been different or not existed).

  - Therefore the world has an explanation outside itself.

  - That explanation is a necessary being (God) who freely chooses to create this
  world.


  The "too much" argument:

  1. PSR: every contingent fact has an explanation.

  2. For any contingent fact p, p''s explanation will itself consist in facts; if
  the explanation includes any contingent fact q, then by PSR q has an explanation,
  and so on. A chain of contingent explanations can''t explain anything unless it
  bottoms out in something necessary (or at least non-contingent). [This is standard,
  not too much.]

  3. Now apply PSR to the fact "God freely chose to create this world rather than
  another" — if this choice is contingent, it has an explanation.

  4. The explanation of God''s choice can''t lie in anything outside God (God is the
  ultimate explainer) and can''t lie in a further contingent choice by God (regress).
  So it must lie in something necessary about God.

  5. If the explanation of why God chose this world lies in something necessary about
  God''s nature, then given God''s nature, God could not have chosen otherwise. Hence
  God''s choice is not free in the sense of being able to do otherwise.

  6. But if God''s choice is not free (couldn''t have been otherwise), and God''s
  nature exists necessarily, then this world exists necessarily. So no contingent
  facts at all — everything actual is necessary.

  7. That is absurd (or, at least, it contradicts the standard theist view that creation
  is a free contingent act).

  8. Therefore the contingency argument either fails to explain creation or yields
  necessitarianism.


