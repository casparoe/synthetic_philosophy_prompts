  ---


  I''m applying for a one-year dissertation fellowship and I have to submit a two-page
  proposal. My half-baked idea is about the possibility that the basic axioms of math
  are inconsistent, and I want to turn it into something a committee would actually
  fund.


  The thing that''s been nagging me: the usual debate seems to assume there''s a single
  question "are the axioms consistent?" with a single answer, and then people divide
  into camps. The skeptics say we can''t prove PA/ZFC consistent from below, so our
  confidence is just inductive; the defenders say we have relative consistency proofs
  and Gentzen-style results, or that the whole worry is unthinkable because if arithmetic
  were inconsistent we couldn''t trust anything. But I suspect the question is actually
  several different questions stuck together: whether the axioms are in fact consistent,
  what kind of evidence could bear on that, and what we should do if a contradiction
  showed up. And the last one isn''t the same as the first: a proof of 0=1 in PA wouldn''t
  automatically tell you which ordinary arithmetical beliefs to throw away.


  My angle: instead of asking whether the axioms are consistent, ask what a rational
  agent should do on discovering an inconsistency in a system it has been using. Some
  options: quarantine the offending axiom-scheme, restrict induction, move to paraconsistent
  logic, keep using the system instrumentally... The philosophical payoff would be
  a distinction between trusting a system because it''s true vs. trusting it because
  it''s useful, and an argument that the consistency debate collapses if you don''t
  draw that distinction. I also think this connects to why people treat "PA is inconsistent"
  as either a mundane technical possibility or a world-ending catastrophe, with no
  stable middle.


