  Draft:


  "You are a professional philosopher who works on the foundations of optimisation
  and inductive inference; please think carefully and in British English throughout.


  I am a software engineer and I build systems that optimise things — delivery routes,
  scheduling, recommendations. I have no formal philosophy background, so I''ll describe
  the problem in my own terms. Lately I''ve noticed that I hold several specific judgements
  about when I''m entitled to say what a system is ''really'' optimising, and over
  what search space, on the basis of its behaviour alone. I want a principle — or
  a small set of candidate principles — that makes sense of these judgements, tells
  me which of them I should keep, and rules on cases I haven''t yet made up my mind
  about. Below are my cases and verdicts.


  Case 1. I observe two delivery-routing systems that produce exactly the same route
  choices on every one of ten thousand historical orders. I''m told afterwards that
  the first was trained to minimise mean delivery time, the second to optimise a weighted
  combination of on-time percentage and fuel savings. From the choices alone I refuse
  to attribute either objective, and even after being told the intended objectives
  I don''t think the behaviour itself picked one out. Verdict: the objective is underdetermined
  by the behaviour.


  Case 2. A scheduling service emits the same weekly timetable no matter what demand,
  staffing, or outage data it receives. I don''t take this as evidence that it has
  a rich ''preference'' for that timetable. Almost any objective function that simply
  ranks that timetable at the top, combined with a very narrow search, would produce
  the same output. Verdict: with no variation in the chosen output, I won''t infer
  an objective at all.


  Case 3. A chess engine beats me from every opening I try. I have no hesitation saying
  that it is optimising for winning (wins preferred to draws preferred to losses),
  and that its search space is at least roughly the legal moves from any position.
  Verdict: behaviour across a wide and adversarial-looking range of inputs can reveal
  both the objective and the search space.


  Case 4. I later discover that the same chess engine, under time pressure, prunes
  nearly all candidate moves except captures and checks. My inference about the search
  space was simply wrong, but my inference about the objective survives. Verdict:
  objective-inference and search-space-inference are asymmetrical — the objective
  can be right even when the search space is misread.


  Case 5. Two planners always output the same list of approved changes. For one of
  them I later see a search trace: it considered merging modules A and B, rejected
  the merge because it would have increased response time, and chose the reordering
  that kept response time flat. For the second planner I never see any trace. Even
  though the two planners'' final outputs are identical, I now take myself to know
  something about the first planner''s objective — that low response time matters
  to it — and nothing about the second''s. Verdict: a search trace showing which alternatives
  were considered and rejected is evidence about the objective, even when final outputs
  match.


  Case 6. A network planner consistently chooses paths that avoid a particular node.
  I cannot tell whether avoiding that node is part of the objective, a hard constraint,
  or merely a bias in the way candidate paths are generated — the chosen path would
  look the same in all three situations. Verdict: without knowing whether paths through
  the node were ever generated and rejected, or never generated at all, behaviour
  alone cannot separate objective, constraint, and search bias.


  Case 7. A resource allocator''s chosen allocations are, across a thousand randomly
  sampled environments, always the unique optimum of a linear cost function that weights
  throughput at 0.7 and fairness at 0.3. I infer that this weighted sum is its objective.
  Yet when I later vary one background variable that happened to be fixed in my sample,
  its choices bend in a way that no single linear weighting predicts. Verdict: I over-inferred;
  the objective was only determined relative to the sampled environments, and the
  new variation shows the system is tracking something else, perhaps a learned proxy.


