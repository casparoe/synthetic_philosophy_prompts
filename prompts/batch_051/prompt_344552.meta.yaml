  Naked statistical evidence is a classic philosophical topic: the "blue bus" case
  (a bus hits a pedestrian, plaintiff sues Blue Bus Co., evidence shows 80% of buses
  in town are blue, but no witnesses identify the bus; can we find liability on preponderance?)
  and the "gatecrasher" case (1000 people at rodeo, only 499 paid, randomly select
  someone; can we hold them liable on statistical evidence?). Also "proof beyond reasonable
  doubt" in criminal law. Naked statistical evidence is evidence that is probabilistic
  but lacks a causal/individualizing connection to the defendant. The philosophical
  issue: why is it insufficient? There are competing accounts: epistemic (sensitivity/safety/accuracy?),
  moral (risk of punishing the innocent, respect for persons), and legal (burden of
  proof, individualized proof).


  The "most important implications" type could be: "what are the most important implications
  of the debate over naked statistical evidence for how I, as a software engineer
  building risk-scoring/predictive models, should think about model outputs?" That''s
  a good bridge to new/niche ideas: the asker can inject the novel angle of applying
  philosophical distinctions from legal evidence to ML systems (e.g., individual vs.
  aggregate fairness, algorithmic adjudication). This makes it not a standard regurgitation.


