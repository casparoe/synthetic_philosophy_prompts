  Naked statistical evidence key cases:

  - Blue Bus: plaintiff hit by a bus; 80% of buses on that route owned by Blue Bus
  Co. Only statistical evidence that it was a blue bus. Preponderance standard (more
  likely than not) would seem satisfied (0.8 > 0.5), yet courts/people are reluctant
  to impose liability.

  - Gatecrasher: 1000 attend a rodeo, 499 paid; random person selected—probably a
  gatecrasher (501/1000?), more likely than not — but courts would not impose liability.
  Actually the classic: 1000 people in the stands, only 499 paid (others jumped fence).
  The probability any given person didn''t pay is 501/1000 = 50.1%. Still, can''t
  pick someone at random and sue them.

  - Prison yard: 100 prisoners, 99 attack a guard and kill him; one is innocent. The
  evidence against any one is 99% but not individualized. Shouldn''t convict. (Nesson''s
  "prisoners in the yard" case.)


  The philosophical debate: why does naked statistical evidence fail? Main accounts:

  1. Epistemic: statistical evidence doesn''t make the belief safe/sensitive/knowledge;
  verdicts require knowledge or proof, not mere high probability. Though one can form
  a true justified belief based on 80%? The "lottery paradox" connection: you can''t
  know your lottery ticket lost before the draw, even with high probability. Statistical
  evidence doesn''t track the truth in the right way.

  2. Moral/legal: punishing/assigning liability on statistical evidence treats the
  defendant merely as a member of a reference class; fail to respect their individuality;
  imposes risk on possibly innocent without adequate individualized blame; also could
  erode norms and public trust.

  3. Incentive/rule-consequentialist: if courts allowed naked statistical evidence,
  actors wouldn''t have incentive to produce better evidence, etc.

  4. Enoch, Spectre, Fisher''s "statistical resentment" and "against the odds"? There''s
  a literature. But we shouldn''t cite.


  Does ML output count as naked statistical evidence? Interesting angle. Models estimate
  P(y|x) using features. Is that "individualized" because conditioned on specific
  features? In the blue bus case, if we condition on route, time, vehicle type? Some
  argue statistical evidence is statistical *relative to a reference class*; ML picks
  features. If an ML model is audited and well-calibrated, should a bail judge be
  allowed to detain someone because a model says 78% flight risk? This resembles mechanical
  jurisprudence and "evidence-based sentencing"; also debates about algorithmic fairness
  and "actuarial justice." But the prompt should ask the model to write a proposal
  exploring this, not answer it. The model can draw on concepts it knows.


