  ---


  I have been thinking about the problem of old evidence for Bayesian confirmation
  theory, and I want to test an idea about whether it still has force for reasoners
  who are never certain of anything empirical. As I understand it, the classic problem
  is this: if an agent is rational in the Bayesian sense, confirmation is a matter
  of conditionalising on evidence that is newly learned. For old evidence, the agent
  already knew the data before the theory was proposed, so the agent''s probability
  for that data was already one; Bayes''s theorem then leaves the probability of the
  theory exactly where it was, because an event that is already certain cannot be
  made more probable by any hypothesis. Hence a Bayesian seems unable to say that
  the known anomaly in Mercury''s perihelion confirmed general relativity, even though
  almost everyone agrees that it did.


  Now consider a different sort of reasoner, one that is more like the systems we
  actually build and perhaps more like us. This reasoner never assigns probability
  exactly one to any empirical proposition, because it models its own memory and measuring
  instruments as fallible; an archived observation, even one it has relied on for
  years, carries probability at most 0.999 and can be revised if a theory gives reason
  to distrust the recording. It can also treat the proposition "this hypothesis makes
  that old datum probable" as something it learns for the first time. Does the problem
  of old evidence survive this change? I want to know which premise of the classic
  argument is really doing the work: is it the assumption that known evidence has
  probability one, is it the assumption that confirmation must come from newly acquired
  observations, or is it something else about how the agent''s old records are stored?
  And is there a repaired Bayesian view that handles old evidence for such a fallible,
