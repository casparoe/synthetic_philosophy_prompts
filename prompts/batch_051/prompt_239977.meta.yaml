  including agreements about the forum in which disputes will be resolved; freedom
  of contract is not a small thing to override.


  (2) But I think mandatory pre-dispute arbitration clauses in consumer and employment
  contracts are presumptively illegitimate. Their defining feature is that the stronger
  party imposed the forum as a take-it-or-leave-it condition of getting the phone,
  the bank account, or the job; whatever the signature says, that is not voluntary
  in the sense I mean in (1).


  (3) I have no objection to arbitration as such. Post-dispute agreements to arbitrate,
  and pre-dispute clauses negotiated between sophisticated parties with real bargaining
  power, strike me as legitimate and often better than litigation: faster, less formal,
  more expert, cheaper.


  (4) I also think the public court system has a value that goes beyond resolving
  the two parties'' dispute. It announces and develops legal norms through public,
  appealable, precedent-setting decisions, and privatizing dispute resolution quietly
  gives that up.


  (5) I think access to a court is the kind of basic good that a person should not
  be able to sign away in advance, because at the moment of contracting one cannot
  foresee what is being relinquished.


  (6) I think class action waivers in consumer and employment arbitration should be
