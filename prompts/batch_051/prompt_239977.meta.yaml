  Let me brainstorm commitments on mandatory arbitration.


  Real positions people hold:

  - Freedom of contract: competent adults should be held to agreements they made,
  including agreements to arbitrate.

  - But mandatory pre-dispute arbitration clauses in consumer and employment contracts
  are often not meaningfully consented to (adhesion contracts, take-it-or-leave-it),
  so they''re different from negotiated arbitration.

  - Arbitration can be efficient, cheaper, faster, less formal; good for courts''
  dockets too.

  - But arbitration clauses often waive class actions, and class actions are an important
  enforcement mechanism for diffuse small harms; without class actions, many claims
  aren''t worth bringing individually.

  - Repeat-player bias: arbitrators depend on repeat business from companies (the
  drafting party), creating structural incentive to favor them; employees/consumers
  are one-shotters.

  - Arbitration is private: awards are confidential, no public precedent, so the law''s
  development is stunted; public norms aren''t articulated.

  - The state has a monopoly on legitimate adjudication / public reason; justice is
  a public good that shouldn''t be contracted around.

  - But parties sometimes have legitimate reasons for privacy and expertise (trade
  secrets, technical matters).

  - Consent: if someone knowingly and voluntarily agrees, even to waive public courts,
  that''s their right; but many clauses are mandatory as a condition of employment/opening
  a bank account.

  - The Federal Arbitration Act (1925) and its interpretation (AT&T Mobility v. Concepcion,
  Epic Systems) have expanded FAA preemption; state law defenses like unconscionability
  are constrained.


