  I''m trying to get my judgments about information-avoidance into reflective equilibrium,
  and I keep colliding with Good''s theorem. As I understand it, the theorem says
  that for a decision-maker with a consistent utility function, the expected value
  of a piece of cost-free information is never negative: at worst you ignore it, and
  sometimes it lets you choose a better act. So a rational agent should never pay
  to avoid learning something that would otherwise come to them for free. But my intuitive
  verdicts on cases don''t all line up with that, and I want to know which side has
  to give.


  Here are the verdicts.


  1. If someone offered to tell me, for free, the date and manner of my death, with
  a guarantee that knowing could not change any decision I''d make, I would pay real
  money not to be told.


  2. If a genetic test revealed a risk that would clearly change what screenings I
  should get, I would not pay to avoid the result. I''d consider paying to get it
  sooner.


  3. If a film I''m about to watch tonight is spoiled for me, I''d pay a small amount
  to have avoided the spoiler, even though I''ll still watch the film either way.


  4. If I discovered that my current partner had, years ago and before we met, once
  been unfaithful, and I knew there was no way this fact could affect any future decision
  I made about the relationship, I would still want to know.


  5. If a friend offered to tell me whether a third party secretly dislikes me, when
  that third party has no power over me and I will have no relationship with them,
