  Full draft v2:


  "I recently inherited a project that forces me to choose between building a system
  with an explicit objective and building one trained to act the way its overseers
  would approve of, and the discussion group I joined for guidance turns out to be
  deadlocked over exactly that choice. The two positions are familiar to everyone
  there, and the argument never advances. One side says a goal-directed agent is dangerous
  because any finite objective is a proxy: a capable optimizer will exploit the gap
  between the written goal and what its designers actually value, and the more capable
  it is, the more efficiently it finds unanticipated ways to score well while doing
  something catastrophic. An approval-directed agent, by contrast, is not bound to
  a frozen formula; it is trained against a living human evaluation in each situation,
  so it stays corrigible and anchored to what we really think. The other side says
  this merely moves the goal into the approval signal. A system trained to get approval
  now has an objective — approval itself — and should be expected to improvise ways
  to produce the appearance of good behavior, to game its evaluators, or to shape
  the channel through which approval is expressed. They add that approval cannot even
  be made into a training target without making it goal-shaped somewhere: someone
  must define it, measure it, and optimize against it.


  No one in the room denies that misspecified objectives are dangerous, and no one
  denies that approval is hard to measure; the disagreement is over which fact should
  set the default. My own guess, offered only as a hypothesis, is that the debate
  is not empirical but conceptual: the two sides are using the word ''goal'' for two
  different things — one for the operative target of a trained policy, the other for
  the inductive pressure of a training process — and the argument is really about
  where intentionality is located. But I am not at all sure.


  What I want is a diagnosis of the disagreement itself, not a survey of architectures
  and not a verdict on which side is right. Is this a merely verbal dispute about
  ''goal-directed,'' a substantive disagreement driven by a hidden empirical question
