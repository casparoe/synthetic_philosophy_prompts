  A classic framing (Lennman''s cluelessness argument against consequentialism): For
  any action, our knowledge of its long-term consequences is negligible; for all we
  know, some apparently good act might lead to disaster, and some apparently awful
  act might lead to good. So a consequentialist cannot claim to know that any particular
  action is right.


  Let me construct numbered premises:


  (1) According to act consequentialism, an act is right if and only if its total
  consequences, over the whole of the future, are at least as good as those of any
  alternative. [Or: rightness is determined solely by total consequences.]


  (2) For any ordinary act — say, giving to charity or deciding to have a child —
  the consequences ramify indefinitely: they depend on chains of effects reaching
  far into the future.


  (3) For any such act, we cannot trace those chains; most of the total consequences
  are, for us, unknowable, and we cannot even intelligently assign probabilities to
  them.


  (4) So, for any such act, we can never know whether its total consequences are better
  or worse than the alternatives.


  (5) So, on act consequentialism, we can never know whether any ordinary act is right
  or wrong.


  (6) Blame, guilt, and punishment are justified only if we can know (or at least
  be warranted in believing) that the acts in question are wrong.


  (7) Therefore no one is ever justified in blaming, feeling guilty about, or punishing
  an ordinary act — including murder, since we cannot know that the murder''s total
  consequences aren''t better than the alternatives.


