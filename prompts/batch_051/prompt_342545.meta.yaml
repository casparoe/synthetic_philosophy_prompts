  A strong answer: The argument is valid on an "objective" reading, and the real question
  is which premise to abandon. But there is also a specific equivocation: "wrong"
  in (5)-(6) gets its content from (1), which defines rightness as actual total consequences
  (often "objective rightness"); but (6)''s notion of blame-appropriate wrongness
  is not actual-consequence wrongness — it''s wrongness relative to what the agent
  could reasonably have known/expected ("subjective rightness" or "blameworthiness").
  If we distinguish them:

  - From (1)-(5), all we get is that we cannot know whether an act is *objectively*
  right (i.e., whether it in fact produced the best total history). That''s true and
  unsurprising; it doesn''t yet touch blame.

  - Blame is keyed to subjective rightness: whether the agent''s choice was reasonable
  given their evidence. A murderer''s choice is subjectively wrong (the expected consequences
  were terrible), so (7) doesn''t follow.

  So the argument "proves too much" only by conflating two senses of "wrong." The
  fix: either (a) keep (1) but refine (6) to invoke the evidence-relative ought, giving
  up the claim that blame tracks objective rightness; or (b) abandon (1) for a decision-theoretic/expectational
  consequentialism, where rightness is determined by expected consequences rather
  than actual ones; cost: this is no longer the classic act-consequentialism of (1),
  and it still faces the problem that cluelessness (premise 3) may infect our ability
  to form well-grounded expectations on natural partitions, leading to skepticism
  at the level of choice guidance for far-future impacts; or (c) reject (3) or (6)
  wholesale.


