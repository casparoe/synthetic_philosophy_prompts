  Let me think through the love''s reasons literature to get the subtle views right.


  - Appraisal view (Velleman, Keller?): love is a response to the beloved''s valuable
  properties. Problem: fungibility — if love is based on qualities, then anyone with
  the same qualities would do; but lovers don''t exchange beloveds for qualitatively
  identical others. Velleman''s solution: love responds not to particular qualities
  but to the beloved''s rational nature / personhood — the same in everyone, but you
  appreciate it through a particular person; this avoids fungibility because the value
  is instantiated in this particular. But then it''s unclear why you love THIS person
  rather than another (if the property is universal). Kolodny''s relationship view:
  love''s reasons are relational — the reason to love someone is the relationship
  you share (being friends, siblings, partners), not their properties. This explains
  non-fungibility and why love can survive property changes. Frankfurt: love is not
  rationally justified at all; it''s a kind of concern/volitional necessity that itself
  provides reasons (bestowal-ish: we confer importance).


  Bestowal: the lover confers value on the beloved; love isn''t a response to antecedent
  value. Problem: if love bestows value, then it seems arbitrary — love is not answerable
  to the beloved''s actual nature; also it makes the lover''s attitude self-justifying,
  hard to criticize ("I love them, therefore they are valuable to me").


  A subtle tension for Type C: someone might hold:

