  whether someone is lovable.

  (b) But those reasons aren''t the beloved''s qualities in a way that makes them
  fungible — I shouldn''t transfer my love to a duplicate with the same properties.

  (c) Following Kolodny, I think the reasons are relational: the fact that she''s
  my partner/sibling/friend grounds the reasons.

  (d) But I also think relationships themselves can be defective and criticized (I
