  "I''m a science writer, and I''ve developed a policy for how I refer to things named
  after people. I basically treat every eponym — Halley''s comet, the Krebs cycle,
  Euler''s number, the Coriolis force, you name it — as a low-grade epistemic red
  flag. My heuristic is that the name is probably misleading about who actually discovered
  or first formulated the thing, because of Stigler''s law (the idea that scientific
  discoveries are usually not named after their actual discoverers) and the Matthew
  effect, where credit piles onto already-famous people. So I''ve stopped using eponyms
  in my own writing unless I''ve personally checked the history. If the attribution''s
  contested or the real priority is messy, I fall back on a neutral descriptive phrase
  instead (''the constant 2.71828...'' rather than ''Euler''s number''). Lately I''ve
  been catching myself doing this in conversation too. I''ve started to wonder: is
  this a defensable bit of epistemic hygiene, or is it a bias dressed up as a rule?
  Part of my worry is that the heuristic is self-reinforcing — I only notice the eponyms
  where the name is misleading, because those are the ones that make history interesting,
  so I might be ignoring all the cases where the eponym is fair. How would I tell
  the difference from the inside?"


