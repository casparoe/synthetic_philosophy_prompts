  DRAFT ESSAY


  We praise the judge who cannot be bought. We also suspect that there is something
  chilling about the person who cannot be moved at all. I want to distinguish two
  things that travel under the name ''incorruptibility'' and argue that only the first,
  suitably located, deserves to be called a virtue.


  The first is narrow incorruptibility: immunity to inducement, intimidation, flattery,
  and the various ways in which a decision-maker''s judgement can be captured. The
  honest official who refuses a bribe, the civil servant who resists a minister''s
  threat, the referee who ignores the crowd: all display this. It is, in the appropriate
  roles, an unqualified good. Where someone acts for a public trust or on behalf of
  others, her decisions should track the reasons proper to the role rather than her
  private advantage; being unbuyable is a condition of our justified reliance on her.


  But ''incorruptible'' is sometimes inflated into a wider ideal: the wholly unbending
  person, uniformly indifferent to every particular attachment, favour, and pull of
  sympathy. On this picture, any departure from an impartial standard — giving the
  benefit of the doubt to a friend, showing mercy where the rule permits no exception,
  preferring one''s own child''s welfare — is treated as latent corruption. I want
  to argue that this wider ideal is not an ideal at all. A parent who weighs her child''s
  bedtime with the perfect impartiality of a stranger is not a more excellent parent;
  she has failed at something her role requires. A friend who will not take his friend''s
  side because ''taking sides'' is a form of bias has misunderstood friendship. Mercy
  in sentencing is not necessarily the corruption of justice; it can be the recognition
  that justice must sometimes answer to the particular person, not only to the rule.


  The conclusion is that incorruptibility is best understood as a role-relative virtue:
  a disciplined suspension, within a defined office, of partialities that are legitimate
  elsewhere. The judge is professionally unmoved by the parties before her, yet may
  rightly be moved by those same people after she leaves the bench. The aim, therefore,
  is not to become incapable of being moved, but to learn what should move one, and
  when. A maximally incorruptible person in the wider sense — someone who could not
  be moved at all — would not be an ideal human being. He would be a machine for applying
  rules, and the machine''s emptiness and not its purity would be the truth about
  it.


