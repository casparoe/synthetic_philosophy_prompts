  Unilateralist''s curse:

  - Many agents, each can unilaterally take an action.

  - Each has noisy private evidence about whether action is net good.

  - Expected value of action conditional on one''s evidence is positive, so each rationally
  acts.

  - Even if aggregated evidence would show action net negative, probability someone
  acts increases to near 1 as number of agents grows.

  - Fixes: require deliberation with all evidence; raise the bar/threshold with number
  of agents; assign central authority.


  Thundering herd:

  - Many worker processes/threads wait on a resource/event.

  - When the event occurs, each wakes and independently decides to handle it, each
  thinks it can do the job.

  - They stampede, causing load and contention.

  - Fixes: leader election, jitter/backoff, load balancing, one designated worker.


  The analogy: both feature independent local decisions, each locally self-justifying,
  whose aggregate causes harm; both cured by coordination and by making the decision
  depend on the number of potential actors. Differences: in thundering herd, the decisions
  are not based on private *evidence* about net value — they''re triggered by a shared
  event, and the harm is resource contention rather than a bad intervention; the agents
  in thundering herd are usually identical/cooperative, not heterogeneous with different
  info. So the parallel is: multiple agents act "as if I''m the one" without considering
  others, but the underlying failure differs — one is an inference problem (info aggregation),
