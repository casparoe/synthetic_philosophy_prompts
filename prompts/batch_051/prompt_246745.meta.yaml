  Draft:


  "I''m a software engineer with no formal training in philosophy, so I may be using
  some of this terminology imprecisely. In my work I regularly deal with objects that
  behave like infinite data structures: lazy streams, coinductive types, and loops
  that are understood by their invariants rather than by their final state. I had
  always treated ''infinite'' as a kind of idealization — a convenient way of talking
  about processes that never actually finish. Then I read about Hilbert''s hotel,
  Cantor''s diagonal argument, and the fact that there are different sizes of infinity,
  and I realized that mainstream mathematics treats infinite totalities as completed
  objects — actual infinities — not just as potential infinities that can be extended
  without end. What surprised me is that the finitist position never really went away:
  there have always been serious mathematicians and philosophers who hold that an
  actually infinite set is not a legitimate object, that talk of ''all natural numbers''
  is only shorthand for an open-ended process, or that only objects that could in
  principle be constructed should count as existing. Yet the mathematical mainstream
  went ahead and built set theory, analysis, and a lot of computer science on the
  assumption that actual infinities are fine. So the debate looks to me like it stalled
  rather than got resolved: the two sides still talk past each other, and the majority
  view won by adoption rather than by convincing the minority. My working hypothesis
  is that the disagreement is not really a mathematical one, but a disagreement about
  what ''exists'' is supposed to mean in mathematics, and about whether a proof that
  uses non-constructive reasoning over infinite totalities is a proof of something
  real. But I''m not sure that''s right. I''d like a diagnosis rather than a verdict:
  is this a substantive disagreement, a verbal one about the word ''exists'' or ''infinite,''
  or are the two sides answering different questions — one about what is true in a
  formal system, the other about what can be exhibited or constructed? And what would
  actually count as progress: a formal result, a conceptual distinction, a change
  of question, or is this a dispute where neither side should expect to move the other?"


