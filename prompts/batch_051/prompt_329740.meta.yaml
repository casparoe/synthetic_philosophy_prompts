  ---


  I''m an undergrad in a philosophy of mind / animal ethics course and we''ve been
  doing moral status, speciesism, and whether sentience comes in degrees. I''ve been
  keeping a list of my own gut verdicts and they don''t obviously fit one principle,
  so I''d love help.


  Role-wise: act as a professional philosopher who works on gradations of moral status.
  Take the question seriously, think carefully, and start by brainstorming a few candidate
  principles (e.g., about phenomenal consciousness, valenced experience, preference-like
  states, information integration, aliveness, something else) before testing them
  against my cases. I''m not satisfied with a vague hunch; I want the principle stated
  precisely enough that it gets a determinate verdict on new cases.


  Here are my verdicts:


  - Mosquito biting my arm: I swat it and don''t feel bad at all.

  - Housefly in my kitchen: I''ll swat it or let it out; I don''t really care which.

  - Honeybee that stings me and dies: I feel a small pang of regret, but I don''t
  think I did anything wrong.

  - Cockroach in my pantry: I squish it without a second thought.

  - Snail on a wet sidewalk: I step around it. Squashing it on purpose would feel
  wrong in a way the roach doesn''t, and I can''t say why.

  - Shrimp: I won''t boil one alive myself, and I''d pay a bit extra for humanely
  stunned shrimp, even though I''m not that confident shrimp feel much.

  - Lobster: similar but stronger; I just avoid lobster.

  - Mouse in a glue trap: awful. But a quick snap-trap death doesn''t bother me much,
  even though it''s the same animal.

  - Houseplant: letting it die of neglect feels like a small, real loss, but I don''t
  think it suffers. Replacing a thermostat: zero qualms.


  The pair that really bugs me is shrimp vs cockroach. They''re both small arthropods,
  both have some kind of nociceptor-ish wiring as far as I can recall from the course,
  and I can''t point to a neurobiological difference that justifies crushing one with
  my shoe and paying extra not to boil the other. My honest guess is that disgust
  and cuteness are doing the work, and that can''t be right.


  And here''s the weird intuition I can''t shake: I have zero qualms about trashing
  my dumb old thermostat, but a "smart" thermostat that learns my schedule and pursues
  a temperature target feels like it has a tiny sliver of something. Not like it feels
  pain, but like it has a point of view, or a goal it can be better or worse off relative
  to. If that counts for even 0.01% of the moral status of a mosquito, then unplugging
  it wouldn''t be exactly zero, and that sounds absurd. Or maybe it isn''t, and sentience
  is a dimmer switch that goes all the way down to zero while never quite reaching
  it. I also can''t tell whether I believe sentience is a dimmer switch at all, rather
  than an on/off thing where I''m just unsure where the line falls — my verdicts seem
  to want it both ways.


  So: what principle (or small set of candidate principles) captures most of these
  verdicts, stated precisely? For each clause you propose, tell me which of my cases
  it''s doing work for. Then apply the best version to cases I haven''t listed: a
  bivalve, a bee''s brain running a tiny robot, a plant that responds to damage and
  "warns" its neighbors, an ecosystem, and a thermostat that has been wired to detect
  and avoid being disconnected. Finally, tell me straight which of my verdicts your
  principle can''t capture and which ones I should overturn — especially the shrimp/cockroach
  pair and the smart-thermostat hunch.


