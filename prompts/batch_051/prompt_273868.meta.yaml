  annihilation or by eventual reconciliation with God.


  I am not asking for your credence in God''s existence or in any particular religion;
  treat the antecedent as given and estimate your probability for the conditional.
  I want a single number, the sub-questions you take your estimate to depend on, a
  rough probability for each, and an account of how they combine. Likely terms include:
  (a) whether the correct theory of punishment is retributive, so that suffering must
  track desert, as opposed to corrective, deterrent, or protective; (b) whether a
  finite being''s wrongdoing can genuinely have infinite demerit—for example because
  the gravity of a wrong is measured by the dignity of the one wronged, or because
  a final and unrepentant state of will is itself an ongoing wrong rather than a mere
