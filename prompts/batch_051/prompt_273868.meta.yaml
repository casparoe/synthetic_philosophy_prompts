  ---


  Please give me your credence in the following proposition, treated as a philosophical
  estimate, and show the decomposition that produces it.


  Proposition: If the God of classical theism exists—omnipotent, omniscient, perfectly
  good, and perfectly just—then at least one human being will undergo eternal conscious
