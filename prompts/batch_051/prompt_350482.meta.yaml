  Potential prompt:


  I am a PhD student in cognitive science working on computational models of semantic
  representation. In our reading group, the discussion keeps returning to a disagreement
  that seems to me to have the same shape every time: where exactly is the meaning
  of an utterance, a sign, or a neural representation? Some members argue meaning
  is essentially in the symbolic structure itself—the syntactic object, the pattern
  of activation, the token—because any competent decoder with the right rules will
  recover the same interpretation. Others argue meaning is in the decoder or interpreter—the
  organism or system that assigns significance, since without an interpreter the marks
  are just physical marks. A third group argues meaning is in the interaction, or
  in the surrounding context of use—the shared practices, the causal history, the
  environment that stabilizes reference. Everyone concedes that these factors all
  contribute somehow, but they sharply disagree about where the meaning is located,
  and the debate hasn''t moved in months. That is why I''m writing to you: I want
  a diagnosis rather than a verdict. My working hypothesis is that Hofstadter''s trichotomy
  of frame message, outer message, and inner message names three different questions
  that the group keeps conflating: one about how something is recognized as a message
  at all, one about what information is physically or formally carried, and one about
  what the message is about or means for someone. Is that diagnosis right, or is the
  disagreement really about something else—an empirical question about generalization,
  a normative question about what we want explanations of representation to do, or
  just a verbal disagreement about the word ''meaning''? Please give me a diagnosis
  of what kind of disagreement this is, grounded in what each side actually says,
  and tell me what would count as progress given that diagnosis—a distinction, an
  experiment, a formal result, a change of question—or argue that no progress should
  be expected and why. Please keep it under 900 words.


