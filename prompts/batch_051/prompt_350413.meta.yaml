  Central claim: cross-person welfare comparisons reduce to hypothetical swap judgments,
  cashed out via each person''s own preferences. Outcomes:

  - exactly one would swap → the swapper is worse off.

  - neither would swap → incommensurable.

  - both would swap → contradiction / no ranking.


  This is indeed adjacent to:

  - Envy-freeness (Foley 1967): an allocation is envy-free if no agent prefers another''s
  bundle. The "swap" is about bundles of goods, not whole lives; it''s a property
  of allocations, not a theory of welfare comparison. But the asker''s move is similar.

  - "Extended sympathy" / Harsanyi''s extended preferences: judging by imagining being
  someone else. But Harsanyi assumes we can make such judgments; the asker restricts
  comparisons to actual swap choices.

  - The "both would swap" case shows non-transitivity/cycles; this is analogous to
  Condorcet cycles or the fact that "would trade lives" preferences can be cyclic.
  Actually, is "both would swap" really possible? If A, with A''s preferences, prefers
  B''s life, and B, with B''s preferences, prefers A''s life. Yes, possible, because
  each evaluates by their own standards. E.g., A is a monk who wants a family; B is
  a family person who wants solitude; each thinks the other''s life is better. So
  both prefer the other''s life. Then by the rule both are worse off than the other
  — contradiction.


  Can you fix it? Maybe by not treating swap preferences as transitive, or by requiring
  "full information" or by using a third impartial judge (extended sympathy), but
  that reintroduces the comparison you were trying to avoid. Or by saying comparisons
  are agent-relative: "A is worse off than B according to A" etc. That dissolves the
  contradiction but abandons a single ranking.


