  but he denies that it is already settled which branch is true, and he seems to resist
  the inference from ''the sentence is already true'' to ''the event is necessary.''
  The class has split roughly in two. One side says that bivalence is nonnegotiable:
  every declarative sentence is either true or false, so if ''there will be a sea-battle
  tomorrow'' is true now, the battle is already inevitable, and that is the very outcome
  Aristotle wants to avoid. This side therefore says Aristotle is best read as rejecting
  bivalence for future contingents, leaving a truth-value gap until the event happens.
  The other side says bivalence is harmless; truth is not the same as settledness
  or necessity, and the necessity belongs only to the disjunction or to the conditional,
  not to either branch. They think Aristotle himself says exactly this, and that the
  first side has confused the law of excluded middle with the law of bivalence. We
  all agree on the words of the chapter and we all understand the formal options;
