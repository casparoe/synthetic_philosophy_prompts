  Need concrete positions:

  - Classical logicians: bivalence holds; exclude middle; Tarski biconditional; semantic
  paradoxes handled via object/metalanguage.

  - Advocates of truth-value gaps: future contingents (Aristotle, Łukasiewicz, Prior/Thomason),
  vagueness (supervaluationism gives gaps? Actually supervaluationism: borderline
  sentences neither true nor false in some precisifications? Supervaluationism says
  borderline predications are neither true nor false), presupposition failure (Strawson,
  van Fraassen).

  - Epistemicists (Williamson): vagueness is epistemic ignorance, bivalence holds.

  - Many-valued logic (Łukasiewicz L3, Kleene K3) gives third truth value, rejecting
  bivalence.

  - Others distinguish bivalence from excluded middle: in supervaluationism, "P or
  not P" is true even when P and not-P are neither true nor false, so excluded middle
  retained while bivalence rejected.

  So the debate is partly about whether logic is topic-neutral and truth is disquotational,
  whether abandoning bivalence is coherent with classical mathematics, whether gaps
  solve the puzzles or merely relabel them.


