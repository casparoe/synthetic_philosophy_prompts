  Predict, with the chain of reasoning explicit, how this reform changes voting and
  electoral politics over the next three election cycles. Cover at least: overall
  turnout and the demographic composition of who votes; where campaigns spend money
  and target mobilization (do they concentrate on the small set of voters who now
  know they are pivotal, and what does that do to candidate platforms?); voters''
  stated and revealed reasons for voting, and the standing of "duty" and expressive
  accounts; and the perceived legitimacy of elections and of mandates once the numbers
  are public.


