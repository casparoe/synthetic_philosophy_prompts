  Suppose that, beginning with the next general election, a stable democracy with
  first-past-the-post districts and voluntary voting introduces the following reform.
  One week before election day, every registered voter receives from a trusted, nonpartisan
  electoral commission a personalized, costless estimate of the probability that their
  ballot will be pivotal. "Pivotal" is defined at two levels: the probability that
  the district contest would be decided or tied by exactly one vote, and the probability
  that the district contest would itself decide or tie national control of the chamber.
  The commission also reports the product—the voter''s chance of deciding the national
  outcome with one ballot. The numbers come from a public statistical model of the
  distribution of all other ballots; the model is updated daily, is designed to reabsorb
  the behavioral effects of its own publication, and is accepted across the major
  parties as unbiased, with negligible error. Most voters will see district-level
  numbers on the order of a few in ten thousand, and national-level numbers many orders
  of magnitude smaller; a minority in knife-edge districts will see district-level
  numbers in the low single-digit percentages.


