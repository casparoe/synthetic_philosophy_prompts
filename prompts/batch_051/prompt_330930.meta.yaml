  Frege''s change: Syllogistic logic (Aristotelian) analyzes propositions into subject-predicate
  form, with monadic predicates (one-place), and handles quantifiers like "All S are
  P", "Some S are P", "No S are P", "Some S are not P", plus singular terms via a
  slight extension. Frege introduced function-argument analysis, relational (polyadic)
  predicates, and variable-binding quantifiers, enabling multiple generality ("every
  boy loves some girl" with the two possible scope readings) and nested quantification.
  The key limitation: syllogistic can''t represent relations among multiple individuals
  or distinguish scope of quantifiers. Also syllogistic struggles with singular propositions?
  But Aristotle''s syllogism traditionally handles general terms; singulars were shoehorned.
  Also identity and functions ("the father of x") need modern logic.


  A decision procedure a practitioner could follow: For a given natural-language argument,
  classify whether it can be adequately handled by syllogistic or requires modern
  (Fregean) analysis. Steps:

  1. Check for relational verbs/adjectives expressing relations between two or more
  things: "is taller than", "loves", "is the parent of", "is a head of". If the argument''s
  validity turns on such a relation, it needs relational logic.

  2. Check for multiple quantifier expressions in a single proposition ("everyone
  loves someone") — if the argument relies on reading scope, modern.

  3. Check for nested/genitive expressions ("every head of a horse") where validity
  depends on function-like expressions connecting one object to another — modern.

  4. Check for identity statements ("Hesperus is Phosphorus", "the morning star is
  the evening star") — syllogistic can''t express identity, modern needed.

  5. Check whether after "flattening" to subject-predicate (treating relational phrases
  as monadic predicates, e.g., "Every horse is an animal"; "Every horse-head is an
  animal-head") the argument could go through in syllogistic — sometimes it can and
  we lose nothing; the art is deciding when flattening is safe.

