  Let''s draft:


  "I''ve got a question from a running argument in my lab, and I want you to treat
  it as a design problem. The claim on the table is this: the standard prototype effects
  in the categorization literature (e.g., people rating a robin as more bird-like
  than a penguin, or being faster to verify ''sparrow is a bird'' than ''ostrich is
  a bird'') don''t show that individual people internally represent prototypes at
  all. The person making the claim says they''re an artifact of averaging across participants:
  each subject stores a smallish set of exemplars, and when you pool everyone''s responses,
  the central tendency is a statistical group-level prototype that no individual actually
  has. What would be the best concrete test of that? I want you to actually specify
  an experiment or modeling comparison, say what outcome would count for the ''prototype
  as averaging artifact'' claim and what outcome would push back toward each individual
  having something prototype-like. Also, what''s left unsettled even by a clean result?
  If you think the claim as I''ve stated it is too vague or untestable without more
  assumptions, tell me that plainly rather than pretending it''s fine."


