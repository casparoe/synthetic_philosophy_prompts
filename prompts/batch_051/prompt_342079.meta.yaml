  Let''s formulate:


  "Okay, so I''ve been reading about the old prototype/exemplar debate in concept
  research, and a lab mate of mine keeps defending a fairly strong version of the
  exemplar view. His claim is that the standard prototype effect—where people rate
  a robin as a better bird than a penguin, or classify a 2-wheeled motorized thing
  with seat as motorcycle-ish? no wait. He says that all prototype effects are an
  artifact of averaging data across subjects. If you fit each participant separately,
  each person actually stores a handful of specific exemplars and there''s no single
  internally represented prototype. Average all participants'' judgments and you get
  something that looks like a group-level prototype, but that''s not a representation
  anyone has. I''m not sure I buy it, but I don''t know how to get evidence. I''d
  like you to design the best concrete test you can—what experiment or modeling comparison
  would count? What pattern of results would make you accept the group-artifact story,
  and what pattern would push you back toward each individual storing a prototype?
  And crucially: what couldn''t such a test settle even if it came out cleanly? Also,
  if my lab mate''s claim is too under-specified to be testable as stated, say that."


