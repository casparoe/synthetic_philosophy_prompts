  Internal vs external reasons: Williams'' internalism: "A has a reason to φ only
  if φ-ing is related to A''s existing motivations (subjective motivational set) via
  a sound deliberative route." Externalism: there can be reasons that don''t connect
  to your motivations. Standard objection to internalism: it can''t explain how someone
  with no motivation whatsoever (e.g., cruel husband who is nasty to his wife and
  has no desire to be nice) has a reason to be nice. Williams says there''s no "external
  reason" — at most we can persuade him, or he''s beyond the motivational pale. The
  internalist worries external reasons are mysterious: if a reason is supposed to
  be able to explain action, and the agent is entirely unmoved, in what sense does
  he "have" it? Externalists say: there are normative truths independent of your desires;
  e.g., you have a reason not to harm others even if you don''t care.


