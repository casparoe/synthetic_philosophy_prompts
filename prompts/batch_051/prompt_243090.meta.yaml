  On one side is a broadly Kantian view: dignity is the ground of a special moral
  status, and it attaches to beings with a rational nature. On this view, the relevant
  criteria for being a bearer of dignity are roughly these: (1) the being has the
  capacity to set ends, to deliberate about means, and to adopt and revise maxims;
  (2) the being has an unconditional, non-negotiable worth, a worth that has no price
  and cannot be traded off against aggregate welfare or social usefulness; (3) the
  being is an end in itself, so others owe it duties of respect that do not depend
  on their inclinations, their relationship to it, or its current psychological state;
  and (4) this worth grounds at least some claim-rights, such as a right not to be
  used merely as a means and a right to have one''s bodily integrity respected.


  On the other side is a deflationary challenge of the sort associated with Ruth Macklin.
  The challenge says that, in actual bioethical practice, dignity does no independent
  work: when the person can exercise autonomy, dignity-talk just is respect for autonomy,
  and when autonomy is gone, dignity-talk is a rhetorical placeholder for other values
  — the sanctity of human life, the feelings of the family, professional integrity,
  or a social taboo around treating a human body as mere matter.


