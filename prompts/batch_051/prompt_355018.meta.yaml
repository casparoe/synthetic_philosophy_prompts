  Criteria I teach for a meaningful unit being an indexical:

  1. Context-sensitivity: the referent changes with context of utterance.

  2. Character rule: the unit''s linguistic meaning is a rule from context to content,
  e.g., "I" refers to the producer of the token. (Kaplan character/content)

  3. Token-reflexivity: the rule has to mention the utterance token (or event) itself,
  not merely features of the situation that could be identified independently.

  4. Non-redundancy / essential indexical: You can''t paraphrase it away with a description
  and keep the same cognitive or communicative significance (Perry''s essential indexical).


