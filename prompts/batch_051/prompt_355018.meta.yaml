  Draft criteria for an indexical:

  (i) It is a referring expression whose referent shifts systematically with the context
  of utterance.

  (ii) Its linguistic meaning is constant but thin: a rule that maps features of the
  context to a referent (e.g., "first-person refers to the producer of the token").

  (iii) It is token-reflexive: the rule mentions the utterance token or event itself
  rather than just describing the world.

