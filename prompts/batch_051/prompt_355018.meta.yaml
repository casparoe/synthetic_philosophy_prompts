  I teach the indexical/non-indexical line this way. A meaningful unit counts as an
  indexical iff it meets four conditions:


  (a) Its referent shifts with the context of utterance.

  (b) Its standing meaning is just a rule that maps a feature of the context onto
  a referent — the Kaplan-style character/content story (the character is constant,
  the content is whatever the rule picks out).

  (c) The rule is token-reflexive: it has to mention the utterance token itself, or
  some event it''s part of, rather than merely describing the scenario from outside.

  (d) You can''t replace it with a non-indexical definite description without losing
  something essential — roughly Perry''s point that ''I am being chased by a bear''
  is not equivalent to ''John is being chased by a bear'' for the person who needs
  to run.


  Now consider a language, call it Brel, spoken by a small island community. Brel
  has no personal pronouns at all — no I, no you, no we, not even a third-person pronoun.
  It has plenty of proper names, common nouns, and descriptions. But its speakers
  have an obligatory manual channel: whenever they refer to anyone present — including
  themselves — they point at the person at the same time, and everyone treats the
  utterance as infelicitous or referentially unresolved without some suitable indication
  (a point, or for the addressee, direct gaze if the hands are occupied). The community
  insists these points are not part of the language: they call them ''just showing
  who,'' children are not drilled on them the way they''re drilled on vocabulary,
  and there''s no sign for them in writing.


  Does Brel have indexicals? Go through my four criteria carefully. If your answer
  is ''depends on whether the pointing channel is part of the language,'' then say
  whether you think my criteria pull it in or leave it out, and whether the language/gesture
