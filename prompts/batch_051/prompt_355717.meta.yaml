  (806, −2?). And they are faster to answer ''yes'' to ''Is 4 an even number?'' than
  to ''Is 806 an even number?'' Yet even number has an exact definition: an integer
  divisible by 2. Some of my colleagues say these typicality effects show that even
  our mathematical concepts are represented by prototypes. Others say the effects
  live in the periphery—in how we quickly judge things—not in the underlying representation,
  which remains a rule. I want to know how one could actually test the claim that
  EVEN NUMBER is stored as a prototype rather than as a rule. Propose the strongest
  experiment you can, specify what pattern of results would support each side, and
  then say what the test could not settle: in particular, whether a prototype account
  can explain the fact that people also, on reflection, classify 806 as even perfectly
  well, and whether the distinction between ''representation'' and ''performance''
  is even a testable one or just a philosophical dodge."


