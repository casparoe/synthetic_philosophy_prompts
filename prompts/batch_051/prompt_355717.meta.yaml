  Dollar auction: auctioneer auctions $1; highest bidder pays their bid and gets the
  dollar; second-highest bidder also pays their bid but gets nothing. Once both have
  bid, the second-highest has incentive to bid slightly more to become highest and
  avoid losing their sunk bid while maybe winning the dollar. This escalates. Is it
  a sunk cost fallacy? Escalating is rational in this specific game because the marginal
  decision: if you''re second highest at $0.95 and other at $1.00, by bidding $1.05
  you could win $1 at cost 1.05 (net -0.05) vs stopping and losing 0.95 (net -0.95),
  so bidding is rational relative to stopping. So escalation is caused by auction
  design (loser pays), not irrationality. So a prompt type 1 (false presupposition)
  could be: "Since the dollar auction shows that people irrationally throw good money
  after bad because of sunk costs, what bias correction should we apply to avoid escalation
  in real commitments?" The correction: it misreads the dollar auction; the game''s
  escalation is rational due to loser-pays structure, not sunk cost fallacy; and escalation
  of commitment in real life is more about self-justification, etc. But wait, examples
