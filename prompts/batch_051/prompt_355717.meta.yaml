  people even rate 4 a better example of EVEN NUMBER than 806, although EVEN NUMBER
  has an exact definition, so graded typicality judgments do not show that a concept
  lacks a rule-like core. With that warning in mind, how would one actually test whether
  GAME is stored as a prototype, as exemplars, or as a mini-theory? Design the strongest
  experiment or set of experiments you can, say what pattern of results would favor
  each account, and then say what the test could not settle—for instance, whether
  a hybrid model would always be able to absorb whatever data you get, and whether
