  My friend is auditing a course on Indian epistemology and keeps relaying the instructor''s
  rulings about whether someone genuinely knows the thing in question. So far the
  instructor has said yes in all of these: a man sees a mango on the table in good
  light and knows there''s a mango; a traveler sees smoke above a distant ridge and
  knows there''s a fire; a villager learns the bridge is washed out from a forester
  who has been reliable about trail conditions for years; and a visitor who was told
  that a gavaya is basically a cow-like wild ox later spots a cow-like animal in the
  forest and knows it''s a gavaya. The instructor also said no in some cases: a man
  who guesses the winning team from a lucky hunch doesn''t know; and a villager who
  believes the river is safe from a known local drunkard who happens to be right that
  day doesn''t know either.


  The instructor''s framework is that there are four recognized means of knowledge
  — perception, inference, analogy, and testimony — each supposed to be a distinct
  source, not just a special case of the others. The new case for next week: a traveler
  in an unfamiliar town asks a stranger for directions to the train station; the stranger
  is honest and gives correct directions, but the traveler has never met him, knows
  nothing about him, and has no prior track record to go on. Does the traveler know
  the way?


  I''m less interested in the bare yes/no than in the best guess at her verdict, which
  of the candidate rules she''s implicitly running (is testimony truly independent
  of inference, or does it need the hearer to establish the speaker''s reliability?),
  the other rules that fit her earlier verdicts, and which further case would most
  cleanly tell the answers apart.


  Oh, and if you can: lead with your bottom line in the first sentence, then give
  the reasoning, no preamble and no restating of the question.


