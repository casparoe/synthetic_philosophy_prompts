  I am preparing a unit in my philosophy of history seminar on whether large-scale
  historical change can be quantified, modeled, and predicted, and a colleague has
  directed me to a widely read long-form profile of Peter Turchin and the research
  program he calls cliodynamics. The article is written by a competent science journalist
  rather than an opponent, and it summarizes the view this way.


  According to Turchin, all premodern agrarian states, whatever their culture or institutions,
  pass through secular cycles lasting roughly two to three centuries. A cycle begins
  with population growth, which gradually fills the land, lowers real incomes, and
  immiserates ordinary people. At the same time, elite families keep producing more
  sons than there are top positions, so a surplus of frustrated elite aspirants accumulates.
  These surplus elites factionalize, compete for a shrinking pool of offices and sinecures,
  and eventually shatter the state''s finances; the society then descends into civil
  war, rebellion, or foreign defeat, which kills enough people and strips enough elites
  of their standing to relieve the pressure on land and offices. The cycle then resets
  and repeats. The article presents this as a demographic clockwork: the real drivers
  are the ratio of commoners to resources and of elites to positions, while culture,
  beliefs, individual leaders, and contingent events merely affect the timing and
  outward form of the collapse, not the fact that it will occur. On the article''s
  account, this is why Turchin was able to forecast, years in advance, the political
  instability that arrived in the West in the 2010s; it further reports that the model
  places the United States in a pre-revolutionary phase in the present decade and
  regards a major crisis in the 2020s as substantially more likely than not.


  Before I present this to students or criticize it in my own lectures, I would like
  an audit of the article''s summary. Could you work through it sentence by sentence
  and say, for each component, whether a careful cliodynamicist would accept it, would
  call it a defensible simplification, or would reject or heavily qualify it? I am
  especially interested in whether the article is right to call the cycle a demographic
  clockwork in which culture and institutions affect only timing and form; whether
  elite overproduction is being used in the way the theory actually uses it; and whether
  the inference from the model to the ability to forecast particular episodes of instability,
  including the unrest of the 2010s and a likely crisis in the 2020s, is actually
  supported by the accurate parts of the summary. If the article''s headline conclusions
  lean on the distorted parts, tell me what survives the correction.


