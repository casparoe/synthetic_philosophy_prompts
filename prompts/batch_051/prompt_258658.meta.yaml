  Prompt:


  "For the past year I''ve been helping to write the rules of a small but very formal
  debating league, and we''re considering a change to the way the shared discursive
  record is maintained during a match. The background is the scorekeeping picture
  of conversation: at every point in a debate there is a body of propositions that
  all participants are treating as taken for granted—call it the board—and speakers
  constantly add to it not only by asserting things outright but by presupposing them
  through the choice of words, for example by using definite descriptions (implying
  existence and uniqueness), factive verbs such as ''regret'' or ''realize'', aspectual
  verbs such as ''stop'' or ''continue'', clefts such as ''it was the chair who rejected
  the amendment'', and particles such as ''even'', ''too'', or ''yet''. In ordinary
  conversation, hearers often accommodate these presuppositions quietly, simply absorbing
  them into what is taken for granted unless someone objects. The proposal is to codify
  exactly that into the rules. Here is the mechanism. At any moment the board lists
  every proposition that is currently established in the debate''s common ground.
  When a speaker presupposes a proposition that is not yet on the board, the proposition
  is placed there with the status pending. If no speaker on the opposing side issues
  an explicit challenge—formally, by saying something of the form ''I deny the presupposition
  that P'' and undertaking to argue against P—before the end of their next turn, the
  proposition is automatically seated: it moves to the established section of the
  board, and afterward neither side may deny it except by a motion to amend the board,
  which costs one challenge point and requires the chair''s approval. Seated propositions
  may be used freely as premises by both sides.


  We are not asking whether this is a good rule in the abstract. We''re asking how
  it would actually behave in practice. What would skilled first speakers presuppose
  in their opening statement, and what would they deliberately avoid presupposing?
  How should an opposing team spend its finite attention—hunting for false presuppositions
  on the first pass, or saving objections for later? Where would this be gamed first:
  presuppositions buried inside questions, presuppositions built from quantifiers
  that are true on one reading but false on another, or presuppositions about the
  debate itself? Would the mechanism make debates track the truth better, or would
  it just select for speakers who are good at placing and detecting booby-traps? And
  are the failure modes fixable by small changes to the seating rule, or do they follow
  from the basic idea?"


