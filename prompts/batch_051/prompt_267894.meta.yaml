  Final:


  For the past year, my reading group has been working through Adam Smith’s The Theory
  of Moral Sentiments, and our discussions now stall at exactly the same place every
  few weeks. The focal point is the passage in Part III where Smith distinguishes
  the man without, whose jurisdiction rests on the desire for actual praise and the
  aversion to actual blame, from the man within the breast, whose jurisdiction rests
  on the desire for praiseworthiness and the aversion to blameworthiness. One camp
  reads the man within as an internalised social spectator: I imagine how a real other
  would judge me, then abstract from local bias until I have a corrected representative
  of public judgment. A second camp reads it as a normative ideal: the impartial spectator
  is not any actual social voice, however corrected, but a standard of what an informed
  and disinterested spectator ought to feel. A third camp argues that Smith deliberately
  blends these roles, moving between a causal account of how conscience arises and
  a normative account of what conscience demands. The strange thing is that all three
  camps agree on the translation, the surrounding argument, and the broader chapter,
  yet no one has moved in months. My working hypothesis is that the disagreement is
  not really about Smith’s text at all, but about whether an account of moral judgment
  can be derived from an account of social psychology. I’d like you to diagnose the
  structure of this dispute rather than adjudicate it. Is it a substantive disagreement
  about Smith’s intended concept, a conceptual disagreement about whether impartiality
  can be reduced to idealised social agreement, or a case of the parties asking different
  questions under one heading? In particular, are they disagreeing about what Smith
  believed, about what the impartial spectator must be if his theory is to work, or
  about whether moral judgment is ultimately an explanatory or a justificatory notion?
  And given your diagnosis, what would count as progress: a sharper distinction, an
  argument that Smith himself runs the two functions together, or an honest acknowledgment
  that the text underdetermines the answer and the real debate is a philosophical
  one about conscience? Please answer in British English.


