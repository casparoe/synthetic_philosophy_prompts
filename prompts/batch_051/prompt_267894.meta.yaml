  camp treats it as a normative ideal: the impartial spectator is not what any actual
  spectator would feel, but what an ideal, fully informed spectator ought to feel.
  A third camp says Smith fuses both and the passage deliberately shifts between social
  explanation and normative justification. We have been over the same textual evidence
  all term and no one has moved.


