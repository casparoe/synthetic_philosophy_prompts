  I have been reading Adam Smith''s The Theory of Moral Sentiments with a group, and
  our discussions keep stalling over the same point. In Part III, when Smith contrasts
  the man without, whose authority is tied to actual praise and blame, with the man
  within the breast, whose authority is tied to praiseworthiness and blameworthiness,
