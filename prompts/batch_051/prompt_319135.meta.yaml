  LaFollette''s argument for licensing parents:

  - We require licenses for activities that are (a) potentially harmful to others
  and (b) require competence to perform safely. Driving, practicing medicine, lawyering.

  - Parenting is potentially harmful (indeed, more so than driving much of the time)
  and requires considerable competence.

  - Therefore, by parity of reasoning, society should require parental licenses.

  - He notes: mere biological ability is not moral entitlement. We don''t let anyone
  drive just because they can reach the pedals.

  - Objections: enforcement/privacy, and some say licensing would be abused; LaFollette
  admits practical problems but says it doesn''t undermine the principle.

  - The "right to an open future" (Feinberg): children have "anticipatory autonomy
  rights" — rights-in-trust that protect their future autonomy; parents/state shouldn''t
  foreclose options before the child can choose. Raise children in ways that keep
  the maximum reasonable number of life paths open (education, exposure to diverse
  ways of life).


