  Key ML counterparts:

  - Your current probability P_t(H) is a posterior after evidence up to t.

  - Future credence P_{t+1}(H) after new data is obtained by Bayesian updating.

  - The law of total probability / law of total expectation gives E[P_{t+1}(H)] =
  P_t(H), i.e., your posterior is a martingale if you condition on future data.

  - Reflection is stronger: it says conditional on the future posterior taking a specific
  value r, your current probability should be r. In ML terms, this is like saying
  your future posterior is a perfectly calibrated forecast of truth? Hmm, conditional
  calibration: the long-run frequency of H among cases where your future posterior
  is r should be r, relative to current information. Actually that''s exactly calibration
  in the sense that P(A | P(A)=r) = r for a random variable P(A). If P_{t+1}(H) is
  a random variable from the perspective of t with expectation P_t(H), then calibration
  in the sense P_t(H | P_{t+1}(H)=r)=r is the identity that the conditional expectation
  of H given the forecast is the forecast. This is the definition of calibration of
