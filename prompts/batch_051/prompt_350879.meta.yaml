  In the course of reporting on how courts and clinics use algorithmic risk scores,
  I have collected my own reactions to a series of single-case probability claims,
  and they do not seem to hang together. A cardiologist tells a 62-year-old patient
  with elevated LDL that his ten-year risk of a heart attack is 14 percent, from a
  model that uses only age, sex, cholesterol, blood pressure, and smoking status.
  That strikes me as a perfectly good answer, even though it ignores his diet, exercise,
  and family history, which would move the number. But if the same cardiologist knew
  the patient carried a rare variant that doubles cardiac risk independently of the
  model''s variables and still said 14 percent, that would be an error about the patient,
  not just a simplification. An actuary placing a specific driver in a broad, statistically
  robust class to arrive at next year''s accident probability seems fine to me, and
  I would rather the actuary use a broad stable class than the most specific one available,
  which might be built from a handful of similar drivers and be noise. A fire investigator
  saying "the probability this wiring caused the fire is 90 percent" also seems fine,
  though I find it hard to say what exact reference class makes it so. A weather service''s
  "30 percent chance of rain tomorrow" for the city is a legitimate statement but
  not, I think, a fact about any particular address. A judge receiving a recidivism
  score that says this defendant has a 62 percent chance of re-arrest within two years
  makes me want to reject the number as ill-posed, even when the underlying comparison
  class is large; yet I cannot see how that is different in kind from the cardiologist''s
  14 percent. And a coin that has already been tossed and covered: I am happy to say
  the probability of heads is one-half as a statement about my information, but I
  do not believe there is any mind-independent chance about that particular toss,
  which already happened.


