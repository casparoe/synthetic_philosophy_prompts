  legitimate just when there is a reference class relative to which the individual
  can be treated as a random draw, the class is broad enough to support a reliable
  frequency, and the right class is the most specific class satisfying that constraint;
  where no such class exists, no single-case probability. But the principle, so stated,
  seems to fail my own cases. It would license the judge''s recidivism number, which
  I wanted to reject. It cannot explain why the cardiologist may ignore diet but must
  not ignore the known genetic variant. It says nothing about the already-tossed coin,
