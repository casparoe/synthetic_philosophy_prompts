  as separable. Among them: (i) whether there is any non-circular criterion that sorts
  right-kind from wrong-kind reasons, rather than an intuition-driven case-by-case
  sorting; (ii) whether wrong-kind reasons are best understood as genuine reasons
  for the attitude, as derivative reasons to cause or cultivate the attitude, or as
  reasons of some further kind; (iii) whether the problem is local to fitting-attitudes
  and buck-passing views of value or generalises to any view on which normative support
