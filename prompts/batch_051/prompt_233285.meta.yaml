  Malthus''s actual view: In "An Essay on the Principle of Population" (1798), Malthus
  argued:

  - Population, when unchecked, increases in a geometrical ratio; subsistence increases
  only in an arithmetical ratio.

  - This implies a strong tendency for population to outstrip food production.

  - Checks on population: "preventive checks" (moral restraint, later also vice —
  delaying marriage, celibacy) and "positive checks" (war, famine, disease, etc. raising
  death rate).

  - He was responding to Godwin/Condorcet''s utopianism, arguing perfectibility impossible
  because of this natural inequality.

  - Not a simple prediction of inevitable catastrophe at a fixed time; he thought
  the check was always in operation, keeping population roughly in line with subsistence,
  through misery and vice or moral restraint.

  - He opposed the Poor Laws because he thought they encouraged population growth
  among the poor without increasing the food supply, thereby increasing misery, but
  his views changed somewhat across editions.


  Common popular mischaracterization:

  - "Malthus predicted mass starvation by the 19th century" — he didn''t give dates;
  he offered a tendency.

  - "Malthus was simply wrong because technology increased food production" — ignores
  the check mechanism and that his claim was about tendencies and limits, and that
  some limits may still bind; also ignores that agricultural productivity existed
  in his model only as favorable circumstances.

  - "He said food grows linearly and population exponentially therefore famine is
  mathematically certain" — he didn''t make it a deterministic prediction; the arithmetic
  ratio was a maximum-supped upper bound given diminishing returns.

  - The "right but early" question: was Malthus right about the principle but wrong
  about timing due to fossil fuels/industrial revolution/Green Revolution/demographic
  transition? Can a long-run prediction be rescued by saying "not yet", or does that
  make it unfalsifiable?


