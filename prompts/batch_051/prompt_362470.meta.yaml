  Suppose a person at forty is offered a genuine open-ended immortality: no aging,
  no disease, memory intact, and a world that supplies an unbounded sequence of genuinely
  new worthwhile projects, relationships, and pleasures. The novelty is real — nothing
  literally repeats — but the person''s basic character and their standards of what
