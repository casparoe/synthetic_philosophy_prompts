  in a specific sense: their engagement with new projects and relationships would
  progressively flatten; they would lose what, following Williams, can be called categorical
  desires — desires whose objects matter to them independently of merely staying alive
  and which give them a reason to go on at all; and they would eventually prefer death
  to continuing, though their life contains no unusual pain, illness, or incapacity.


  Give me a number for PROP, but make the reasoning explicit by decomposing the estimate.
  I expect at least these terms, with a rough probability and a one-line justification
  for each:


  1. Fixed-character satiation: the probability that a fixed character with fixed
  standards of worth, facing endlessly novel inputs, will eventually satiate; the
  goods keep their kind but lose their grip.

  2. Finitude-dependence of categorical desire: the probability that categorical desires
  depend essentially on the finitude of a human life — on the shape that death gives
  to projects and relationships — so that they cannot be indefinitely replenished
  in an open-ended life.

  3. Character revision is not a rescue: the probability that the only way to restore
  engagement would be to deliberately revise one''s standards and desires, and that
  doing so enough to matter would amount to becoming a different person in the sense
  relevant to whether the original offer was good for the person who accepted it.

  4. No boredom-free successor state: the probability that there is no stable successor
  state — e.g., calm contemplation, aesthetic appreciation, serene contentment — in
  which a finite human psychology could go on indefinitely without the kind of project-centered
  engagement in (1) and (2) and still correctly regard its continued life as worth
  living.


