  Final prompt plan:


  Paragraph 1: The situation and thesis.

  "I cover science and ideas for a general-audience publication, and in a few weeks
  I am giving a lunch seminar at a university artificial-intelligence institute about
  a piece I have spent the past year reporting. The position I intend to defend is
  this: a machine that is genuinely doing ethical reasoning, rather than merely behaving
  to spec, will have to reason from a retrievable, contestable library of paradigm
  cases and analogies — a modernized casuistry — and will have to show those cases
  in its outputs, rather than applying a fixed moral principle or learning a policy
  end-to-end from human preference data. The headline claim is not that casuistry
  is philosophically superior, but that it is the only one of the three approaches
  that gives auditors, regulators, and affected people the materials they need to
  contest a decision."


  Paragraph 2: Sketch of argument/moves.

  "My central moves in the talk will be these. Top-down principles fail in implementation:
  maximally general rules such as minimizing expected harm stay vague where they are
  safe and become arbitrary where precision is forced on them. End-to-end preference
  learning produces behavior without reasons, so a system that has learned to match
  raters can fail in ways no one can localize or correct; when it does fail, the only
  remedies are more data and retraining, not a reason to which an affected person
  can object. A case-based system, by contrast, forces each decision to be a kind
  of visible analogical act: which past cases are treated as similar, and why, can
  be audited; and the system''s principles, if it has any, are recoverable from the
  case record rather than stipulated in advance. I will concede that this reintroduces
  human judgment at the edges — in selecting and annotating the case library — and
  I will treat that as a feature, not a bug, because it is the one place the judgment
  can be inspected and named."


  Paragraph 3: Audience description.

  "The room will be mostly machine-learning researchers and engineers who work on
  safety, alignment, and RLHF; they will judge the proposal by whether it can be specified,
  trained, evaluated, and scaled, and they are allergic to anything that strikes them
  as a hand-coded wrapper around a black box that quietly reimports unaccountable
  human discretion. There will also be a few applied moral philosophers attached to
  the institute; they will be looking for whether casuistry without an underlying
  moral theory is anything more than pattern-matching with a historical label. And
  there will be one former clinician now working on regulation of medical algorithms,
  who will care about time pressure, legal liability, and what the system outputs
  in a genuinely novel case."


  Paragraph 4: The ask.

  "Please build me a question-period rehearsal rather than a general defense. Identify
  the eight or so objections this particular room is most likely to raise, order them
  by some combination of likelihood and damage, phrase each one in the way a member
  of this audience would actually put it, and give each a reply I could deliver in
  two minutes, with a candid note on the point at which that reply is weakest. Concede
  where the position should bend and hold where it should not. Close with the question
  I am hoping no one asks."


