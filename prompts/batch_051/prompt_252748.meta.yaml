  serious just because avoiding it is costly for the eater. If the wrongness of the
  underlying act is accepted, then hardship changes what we should do about the obligation
  — how quickly we phase in changes, what we do to build alternatives — not whether
  the obligation exists. Having limited good options does not cancel the moral relevance
  of the harms a chosen option causes.''


