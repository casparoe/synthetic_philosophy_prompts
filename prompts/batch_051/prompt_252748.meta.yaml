  Let me craft a disagreement where both sides make decent points:


  Person A: argues that when we say "what Sarah said is true," we''re attributing
  a real property — matching reality — and that property explains why we trust, act
  on, and value true beliefs. Without that property, our whole practice of inquiry
  (science, courts) makes no sense.


  Person B: argues that "is true" doesn''t pick out any hidden property. To say "Snow
  is white is true" is just to say "Snow is white." The word "true" is a convenient
  device for endorsing collections of claims ("everything she said is true") without
  repeating them, but it adds no content. The appearance that it does real explanatory
  work comes from the content of the claim itself, not from truth.


  A few rounds with genuine points:


  First round:

  A: Consider a jury: they conclude "The defendant committed the theft." The verdict
  can be right or wrong depending on whether the defendant actually committed the
  theft. That rightness isn''t just a linguistic convenience—it''s a substantive matter
  of correspondence with the facts. If "true" didn''t name that correspondence, we
  couldn''t say what makes a true verdict better than a false one.


  B: But saying "the defendant committed the theft" already says that the defendant
  committed the theft. Adding "it is true that..." doesn''t add a further fact about
  correspondence we can go inspect. The question "Is the verdict true?" is just the
  question "Did he do it?" asked again. So truth does no extra explanatory work; the
  facts do the work, and our sentences describe them.


  Second round:

  A: That can''t be right, because truth generalizes. When I say "Everything the witness
  said is true," I''m not re-asserting a list of sentences I haven''t heard; I''m
  attributing a shared feature to all of them. That feature is what guides my trust.
  So truth must be a genuine property of propositions.


  B: Generalization is exactly what a disquotational device does. "Everything the
  witness said is true" expresses my willingness to endorse whatever claims the witness
  made. It condenses potentially infinite conjunctions: if the witness said p and
  q and r, the statement licenses "p and q and r." The device is indispensable, but
  being useful doesn''t make it refer to a property—like "etc." is useful without
  naming a thing.


  Third round:

  A: But there''s a real difference between a claim being true and being justified
  or believed. Many true claims have never been believed; some false claims are widely
  believed. If "true" were just a device for expressing endorsement, it would collapse
  truth into what we''re willing to assert, and then we couldn''t explain how every
  careful person could be wrong about something while the truth was otherwise.


