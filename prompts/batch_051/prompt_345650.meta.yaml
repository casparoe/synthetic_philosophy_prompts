  Prompt (Type C, domain Frege):


  "I work on entity representations in generative language models, and recently I
  trained a model on a corpus in which ''Hesperus'' and ''Phosphorus'' constantly
  appear in the same roles — both are governed by ''the evening star'' and ''the morning
  star'', both co-refer, and the model eventually maps them to almost the same vector.
  For that model, the sentence ''Hesperus is Phosphorus'' is functionally indistinguishable
  from ''Hesperus is Hesperus''; neither changes any downstream representation or
  behavior. That has made me take Frege''s puzzle personally, and I want to know what
  becomes of his argument under this development.


  Frege''s argument, as I understand it, runs roughly as follows. If the meaning of
  a proper name were exhausted by the object it designates, then a true identity statement
  like ''Hesperus is Phosphorus'' would express the same thought as the trivial ''Hesperus
  is Hesperus,'' because both would assert that a single object is identical with
  itself. But the two sentences are clearly not cognitively equivalent: the first
  can be a genuine astronomical discovery, while the second can be known a priori
  and extends no one''s knowledge. Therefore, names must carry something over and
  above their referents — a mode of presentation, or sense — and an identity statement
  can be informative only when its two names present the same object under different
  senses. The argument assumes a subject for whom the two terms are associated with
  distinct modes of presentation and for whom substitution of codesignative terms
  can change cognitive value.


  Now consider the trained model, or more generally a system that represents co-reference
  directly in a single, fused representation. There are no two senses; the identity
  is genuinely not informative, yet the system is (by ordinary engineering standards)
  competent with both names, in the sense that it can use them appropriately across
  contexts. Does Frege''s argument survive this? Which premise is under pressure —
  the claim that understanding two names requires distinct modes of presentation,
  the claim that informativeness differences are merely about the agent''s information
  state, or something else? Is the correct conclusion that such a model simply falls
  outside the class of subjects about which Frege was theorizing (and why should it?),
  or that Frege''s puzzle reveals something about representational systems at a certain
  grain but not about meaning in general? I''d like a repaired version of the argument
  that says either what sense must be in such a system or what Frege''s original argument
  should be amended to claim once direct coreference representation is available."


