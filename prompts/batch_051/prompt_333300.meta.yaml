  Good''s theorem: For a Bayesian decision maker, the expected value of (free) information
  is nonnegative: E[max_a E[u|a, X]] ≥ max_a E[u|a] where X is the information. In
  other words, you should never refuse free information if you can ignore it. Assumptions:
  you update by conditioning (Bayes rule), your utility over outcomes doesn''t depend
  directly on the information or the act of observing, you can freely decide after
  seeing the information, and you''re an expected utility maximizer. Counterexamples/puzzles:
  information that is irrelevant but changes your emotional state (anxiety); "information
  aversion" (not wanting to learn genetic risk) seems irrational under the theorem
  if it doesn''t change decisions, but if it has emotional costs, that''s a direct
  utility impact — the information isn''t free in utility terms; so the theorem doesn''t
  apply. But that''s often seen as moving the goalposts. Another subtlety: if knowing
  information could change your choices in a way that is bad for you because other
  people infer from your having the information — e.g., revealing that you know; or
  if your future choices would be manipulated. Also the "Newcomb-like" cases where
  the predictor knows whether you''ll two-box; but the free information in Newcomb''s
  problem (seeing the contents of box B) — if the predictor is infallible, you can''t
  have the info as a free act maybe. Self-locating/absent-minded driver? Not necessarily.


  Misconceptions: (1) That "ignorance is bliss" refutes the theorem — actually if
  learning causes disutility, the info isn''t costless in utility terms; the theorem
  assumes costs are accounted for. (2) That the theorem says you should always acquire
  all information — actually it says free information can''t lower expected utility;
  acquiring it may be optional, but refusing it is not expected-utility maximizing.
  (3) That the theorem justifies information "for its own sake" or that more info
  always helps decision accuracy — actually if the info can''t affect your action''s
  outcome distribution (payoff-relevant) but has emotional costs, no. (4) The theorem
  seems to imply you should open a letter even if you believe it contains bad news;
  but the theorem holds only before you know contents; after you see it, your expected
  utility may drop (regret? no — expected utility conditional on bad news can be lower;
  ex ante expectation doesn''t). People conflate ex ante and ex post. That''s a key
  teaching point: the theorem is ex ante, not ex post. (5) "Nonnegative value" assumes
  you can ignore the info and act exactly as before; if info arrives but you cannot
  unbias yourself, or you''re not a perfect Bayesian, then it might hurt. But that''s
  outside assumptions.


