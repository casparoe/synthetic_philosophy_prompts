  literally, distorts what gratitude is. Along the way, distinguish the material benefit
  from the benefactor''s good will as possible objects of gratitude, and say why the
  latter is primary. Conclude by stating what someone who owes gratitude actually
  owes, in your view, and what would count as repaying it."


