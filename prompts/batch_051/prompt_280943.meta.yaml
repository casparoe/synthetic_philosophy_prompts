  In his De Beneficiis (On Benefits), in the Aubrey Stewart translation, Seneca writes:
  ''for a benefit is a loan, the repayment of which depends merely upon the good feeling
  of the debtor. To misuse a benefit like a spendthrift is most shameful, because
  we do not need our wealth but only our intention to set us free from the obligation
  of it; for a benefit is repaid by being acknowledged.''


  I want you to argue for the following position: the core of gratitude is not a debt-like
  liability to repay or reciprocate, but a distinct kind of normative relation — roughly,
  a duty of accurate acknowledgment of the benefactor''s good will — and the widespread
