  feeling of the debtor. To misuse a benefit like a spendthrift is most shameful,
  because we do not need our wealth but only our intention to set us free from the
  obligation of it; for a benefit is repaid by being acknowledged.]''


  I want you to argue for the following position: the essential core of gratitude
