  Dennett & Kinsbourne (1992) "Time and the Observer": They describe two models: "Stalinesque"
  — the brain gathers all the information and then presents a digested version after
  a delay, so there is no unrevised conscious experience; "Orwellian" — there is a
  real-time entry into consciousness, and subsequent revision of the record (memory).
  In the color phi case, Orwellian: the subject originally has some conscious experience,
  e.g., a red spot moving along and maybe then green at the end, and then after the
  second flash, the memory is edited so the subject subsequently recalls a color change
  mid-trajectory. Stalinesque: the second flash''s information is used before the
  perceptual stream is delivered to consciousness at all, so the subject actually
  experiences the moving red-then-green dot from the start of the (slightly delayed)
  experience.


