  "I''m a journalist who writes about ideas at the point where a thinker''s big claim
  meets the historical record. I''m working on a piece about a specific test of that:
  Hannah Arendt''s banality-of-evil thesis. Arendt reported on Adolf Eichmann''s 1961
  trial in Jerusalem and argued that what made Eichmann monstrous was not sadism or
  ideological fanaticism but the opposite—an inability to think from the standpoint
  of another, a life conducted in bureaucratic clichés and careerist self-absorption.
  The general claim she drew from the case was that modern evil can be carried out
  by people who are, in a disturbing sense, thoughtless and ordinary.


  The development I want to put to the thesis is this: later researchers, above all
  Bettina Stangneth in Eichmann Before Jerusalem, made use of the so-called Sassen
  interviews—recorded conversations Eichmann held in Argentina in the 1950s with a
  circle of former Nazis and sympathizers. In those conversations Eichmann apparently
  presents himself not as the hollow transport administrator of the Jerusalem dock
  but as an ideologically committed man who took pride in what he called his work.
  Stangneth''s conclusion is that the unthinking bureaucrat persona was in part a
  courtroom performance, and that the historical Eichmann was more deliberate, more
  committed, and more self-aware than Arendt took him to be.


  What I''m trying to sort out is what this does to the philosophical argument, not
