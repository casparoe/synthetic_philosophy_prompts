  ---


  Last night a friend and I spent several hours arguing about whether mathematics
  can get by without completed infinities. He took a finitist line: Cantor''s paradise
  is an artifact of language, Hilbert''s hotel is a parlor trick that shows only that
  "infinite" doesn''t mean what we pretend, and most of what mathematicians actually
  use is either finite or can be rephrased as talk of algorithms and approximations.
  I pushed back with the usual points — the diagonal argument, the completeness of
  the reals, the way nonconstructive existence proofs are everywhere in analysis —
  and we ended stuck, because neither of us could say what the discipline would actually
  look like if his position were enforced. His challenge was: don''t argue from prettiness
  or familiarity; tell me concretely what would happen if we really did it.


  So here is the counterfactual I want you to work through. Suppose that in 1935,
  after Gödel''s incompleteness theorems were known but before Bourbaki-style structural
  mathematics had set in, the major mathematical societies, journals, and top departments
  jointly adopted — as a professional norm enforced through publication standards,
  hiring, and prizes, not by law — the following rule: a theorem is publishable in
  mainstream venues only if every assertion about an infinite domain meets constructive
  constraints. In particular, an existence claim over an infinite domain must come
  with an explicit witness or an effective procedure for producing one; one may not
  prove a universal claim merely by deriving a contradiction from its classical negation
  (no unrestricted excluded middle over infinite totalities); and a function on an
  infinite set must be given by a rule, not by flat assertion that a correspondence
  exists. Classical results that cannot meet the rule are not refuted, but they are
  relabeled "conditional" or "nonstandard" and excluded from the main journals.


  Give your best reasoned prediction of how the next fifty years of mathematics, roughly
  1935 to 1985, play out. I want the chain of reasoning, not a narrative: which areas
  of the existing canon survive translation into constructive terms, which results
  demote to statements about algorithms or approximations, where mathematicians retool
  and where they migrate to physics, engineering, or logic, and whether the discipline
  ends up smaller-but-stronger or genuinely crippled. Pay special attention to the
  incentives the rule creates — what young mathematicians choose to work on, what
  departments reward, what textbook mathematics becomes — and to where the rule itself
  gets gamed or reinterpreted. Distinguish clearly between links in the prediction
  you are confident about, links that are guesses, and the factual or sociological
  assumptions that, if they didn''t hold, would make the prediction go the other way.


