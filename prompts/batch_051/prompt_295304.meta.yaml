  Humean view (Lewis-style): the laws of nature are just the best system — the axioms
  of the true deductive system that best balances simplicity and strength (informativeness)
  about the mosaic of particular facts. Laws are summaries; they don''t govern or
  produce anything. Anti-Humean view (Armstrong/Dretske/Tooley, or Maudlin): laws
  are primitive relations among universals, or fundamental governing entities; regularities
  hold because of laws. Laws explain regularities.


  Now construct a debate between two people, maybe named characters, about specific
  sub-issues:


  Round 1: One (say, call them Elena) argues that laws are just compressed descriptions
  of regularities; if you list every particular fact, the "law" adds nothing over
  and above them. The other (Marcus) says that gets explanation backwards: the law
  explains why all the particular facts share a pattern; a mere summary can''t explain
  its own instances — a list of Fs doesn''t explain why each F is G.


  Round 2: Elena responds that explanation is cheap: the fact that all the coins in
  a bag are copper doesn''t require a governing "copper-making" force; it''s explained
  by the arrangement of the bag plus no non-copper coins. Similarly the law is just
  a general fact about the mosaic, and general facts can explain their instances.
  Marcus replies: but then the law is just a cosmic coincidence; why should the whole
  universe''s mosaic be so neatly summarizable? The anti-Humean says the law is what
  makes the mosaic neat. Elena says that treats laws as an extra cosmic enforcer,
  which is exactly the sort of thing we should avoid.


