  Dogmatism paradox: valid-ish, with key premise being the one about misleading evidence
  rational significance. There are subtle issues about known evidence vs unknown,
  the "known misleading evidence" requiring second-order knowledge. The argument has
  a subtle flaw potentially: from "if p is true, evidence against p is misleading"
  to "I know in advance that any evidence against p would be misleading" and "so I
  can ignore it." There''s a shift: I may know p, but when actually confronted with
  counter-evidence, my knowledge of p can be defeated, and the counter-evidence isn''t
  "against a truth I still know." Also "misleading evidence" can be rationally relevant;
  rationality requires responding to evidence, not ignoring it. The key flaw is that
  knowledge doesn''t imply I can ignore new evidence because new evidence can defeat
  my knowledge; I can''t know in advance that it''s misleading in the relevant sense.
