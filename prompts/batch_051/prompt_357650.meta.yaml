  When one solves the equation x² − 2 = 0, the two solutions are conventionally labelled
  √2 and −√2. But that convention already goes beyond the equation itself. Over the
  rationals, the two roots are perfect mirror images of one another: the splitting
  field ℚ(√2) has an automorphism that fixes every rational and sends √2 to −√2, so
  in the language of fields alone there is nothing that distinguishes one root from
  the other. Whatever is true of the one is true of the other. The familiar distinction
  between them appears only once the field is embedded in the ordered real numbers,
  where one root is positive and the other negative. This is an instance of a wider
  phenomenon in algebra. The two square roots of −1 are similarly interchangeable,
  as are the roots of an irreducible cubic; the objects are distinct, yet no intrinsic
  property selects one as canonical, and mathematical practice nonetheless wields
  definite-looking expressions such as √2 or i.


  Some people draw the structuralist moral that mathematical objects are nothing over
  and above their structural role, so swapping labels changes nothing of importance;
  the names √2 and −√2 are a harmless convention, and there is no fact of the matter
  about which root is which until extra structure is chosen. Others reply that this
  is too quick: once one works in the ordered field of real numbers, √2 genuinely
  is the positive root, and the convention does real mathematical work, for example
  in stating inequalities, evaluating functions, or fixing decimal expansions. So
  the question whether labelling matters seems to depend on what mathematical structure
  one takes the symbols to live in.


