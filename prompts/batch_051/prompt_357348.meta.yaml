  Potential prompt:


  "Consider the disappearance of dueling among British and American gentlemen over
  the course of the nineteenth century. The salient facts: dueling had been illegal
  for centuries and was widely condemned by clergy and moralists, yet it persisted
  among officers, politicians, and other ''gentlemen'' because refusing a challenge
  was treated as cowardice and social death. By roughly the 1840s in Britain — and
  later in the American South — it had all but vanished. Appiah''s honor-based account
  says such moral revolutions happen when a practice is reclassified from honorable
  to dishonorable: the duel did not die from moral argument or legal penalty but because
  ridicule and social pressure made it possible for a gentleman to refuse without
  shame, and made accepting a duel a mark of absurdity rather than courage. An Eric
  Williams-style interest account, by contrast, would trace the change to material
  interests: the rise of a commercial and professional society made dueling costly
  to careers, and the social class that valued it lost status. An argument-based account
  says the accumulating moral case against dueling finally persuaded enough people.


