  Precise claims:

  1. Ex ante expected value of cost-free information is non-negative for a Bayesian
  expected-utility maximizer who can condition on the information and act accordingly.
  (True, given conditions — but note strategic settings, non-Bayesian, etc.)

  2. Ex post, the information never leaves you worse off in realized utility. (False:
  you might learn something that leads to a choice that turns out worse; textbook
  "value of information" is ex ante.)

  3. Information is always instrumentally useful (increases expected payoff in any
  decision problem). (True in single-agent, but false if the information affects others''
  beliefs or you have to commit to a policy? Actually Good''s theorem: in a single-person
  decision, information never decreases expected utility. But in multi-agent/strategic
  settings, information can hurt — e.g., in games, more information can hurt; also
  if information is received by others, or if it removes the possibility of beneficial
  ignorance, e.g., in a principal-agent context, or if it incurs cognitive processing
  costs.)

  4. The slogan might be about the intrinsic value of true belief / curiosity, not
  only instrumental value: knowing more is better even when no decision depends on
  it. (A different, evaluative claim; Good''s theorem doesn''t address it.)

  5. It might be a norm of rationality: a rational agent must not be information-averse;
  refusing free information is irrational. (Depends on what "irrational" means; in
  single-agent expected utility it follows, but there are complications: regret, emotional
  costs, information avoidance in health contexts may be rational given preferences.)

