  **Grammatical Categories as Attractor Kinds**


  It is tempting to ask whether grammatical categories—parts of speech such as noun
  and verb, cases such as nominative and accusative, and classes such as prepositions—carve
  language at its joints. The available answers often fall into a dichotomy: either
  these categories are real in the way a natural-kind realist would require, or they
  are convenient labels that grammarians impose on a continuous and unruly reality.
  This essay sketches an intermediate position, which I call the attractor view.


  Define the space of possible grammatical systems as an abstract space whose points
  are complete grammars, with similarity measured by the categories those grammars
  employ. A category is an attractor just in case grammatical systems tend to evolve
  toward, and then settle into, configurations containing it. An attractor is a basin
  in that space, not a point every possible grammar must reach.


  On this view, noun and verb are strong attractors because several pressures converge
  on them. A distinction between referring expressions and predicating expressions
  is broadly useful for communicative need; the linearity of speech and limits of
  short-term memory favor reusing a small inventory of distributional classes; and
  ambiguity avoidance favors marking whether an expression is being used to pick out
  an object or to attribute a property. Core cases, such as nominative and accusative,
  can be treated similarly, since they encode something languages are under pressure
  to track: which participant is acting and which is acted upon. Prepositions look
  like a weaker and more language-specific attractor. Languages can express relational
  material through case, verb marking, or word order, so the pressure to crystallize
  a distinct class of prepositions is less constant.


  Attractor status alone, however, licenses only a weak conclusion—it tells us where
  grammars tend to go, not whether the resulting categories carve anything at the
  joints. For the stronger claim, I propose projectibility as the measure of naturalness:
  a grammatical category is natural-kind-like to the degree that knowing the behavior
  of a few members warrants confident inference about the behavior of other members.
  If membership in a category is predictive across several grammatical processes—inflection,
  selection, linear position—then the category behaves like a kind. If membership
  is predictive only under a list of exceptions, it behaves like a notation of convenience.


  This yields a graded picture. The core of the noun/verb contrast is strongly projectible:
  once an item is nominal, much follows about how it inflects, what it combines with,
  and what positions it occupies. Cases have a projectible core around the encoding
  of clausal participants, while their outer extensions—quirky case, lexicalized case,
  semantically opaque assignment—are less so. Prepositions are the most mixed: the
  class as a whole is partly negative and partly historical, and only a core of spatial
  relational items is strongly projectible.


