  Below is a draft of a short essay I''m developing. I''d welcome comments, especially
  on the objections listed at the end.


  **Grammatical categories as attractor kinds**


  It is tempting to ask whether grammatical categories—parts of speech such as noun
  and verb, cases such as nominative and accusative, and classes such as prepositions—carve
  language at its joints. The available answers often line up as a dichotomy: either
  the categories are real, in the way a natural-kind realist would require, or they
  are convenient labels that grammarians impose on a continuous and unruly reality.
  I want to sketch an intermediate position, which I''ll call the attractor view.


  *The attractor view.* Let the "space of possible grammatical systems" be an abstract
  space in which each point is a complete grammar, and similarity between points is
  similarity in the categories the grammar employs. Say a category is an attractor
  just in case grammatical systems tend to evolve toward or settle into configurations
  that contain it. An attractor need not be inevitable; it is a basin in the space
  of grammars, not a point all paths must reach.


  On my view, categories like noun and verb are strong attractors because of convergent
  pressures: a distinction between referring expressions and predicating expressions
  is useful across an enormous range of communicative needs; linear speech and short-term
  memory favor reusing a small stock of distributional classes; and ambiguity-avoidance
  favors signaling whether an expression is being used to pick out an object or to
  attribute a property. Core cases (nominative and accusative, or spatial adpositions)
  can be explained similarly, while the full class of prepositions looks like a weaker,
  partly language-specific attractor: many languages express the same relational material
  through case or verb marking, so the attraction to a distinct preposition class
  is not as strong as the attraction to a noun/verb contrast.


  *Naturalness as projectibility.* Attractor status alone, however, would be a weak
  and perhaps merely historical fact. To say something stronger, we need a criterion
  of naturalness. I propose projectibility: a grammatical category is natural-kind-like
  to the degree that knowing the behavior of a few members warrants confident inferences
  about the behavior of other members. If the core of a category supports reliable
  induction across multiple grammatical processes (morphological paradigm, selectional
  restrictions, word-order possibilities), it behaves like a kind; if membership in
  the class is predictive only under an explicit list of exceptions, it behaves more
  like a notation of convenience.


  This yields a graded picture. The core of the noun/verb distinction is strongly
  projectible across languages: once you know that an item is nominal in a language,
  you can predict a great deal about how it can be inflected, what it can co-occur
  with, and what roles it can occupy. Cases have a projectible core around the encoding
  of clausal participants, while their outer extensions (quirky case, lexicalized
  case, semantically opaque assignment) are less projectible. Prepositions are the
  most mixed: the class is partly negative and partly historical, and its projectibility
  is high only for a core of spatial relational items.


  If this is right, the question "are grammatical categories natural kinds?" has no
  all-or-nothing answer. The interesting questions are gradable: how strong is the
  attractor, how projectible is the class, and how much of the class is core as opposed
  to periphery?


  *Objections I''m currently worried about.* (a) The attractor view may be insulated
  against counterexamples: if a category is widespread, I credit its functional pull;
  if it is rare, I say it''s a weak attractor; if it is absent, I say no attractor
  formed. What would make the view falsifiable? (b) Maybe projectibility is a poor
  measure of naturalness, because many non-natural categories (institutional kinds
  and genealogical classes) are highly projectible, while arguably natural categories
  may be too rare or too local to ground confident induction. (c) The essay as written
  may overstate the strength of functional explanation; inherited categories can persist
  long after their original functional rationale has eroded, and the attractor story
  may end up redescribing historical accident rather than explaining convergence.


  I''d especially appreciate comments on whether objection (b) can be met without
  giving up the projectibility criterion, and whether the graded core/periphery move
  is doing real work or merely postponing the problem.


