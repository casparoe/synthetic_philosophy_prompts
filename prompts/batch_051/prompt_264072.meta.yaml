  ---


  For several years I have opened my graduate seminar on free will with the digger
  wasp. As the stock example goes, the wasp paralyzes a cricket, drags it to the mouth
  of its burrow, leaves it on the threshold, enters alone to inspect the nest, comes
  back out, and only then pulls the cricket inside. If an experimenter moves the cricket
  a few inches while the wasp is inspecting, the wasp does not simply drag it over
  the threshold on returning; it drags the cricket back to the threshold and performs
  the entire inspection routine again — and it can be made to repeat this indefinitely
  by moving the cricket after each inspection. The behavior looks purposive, even
  cautious, but the intervention reveals a fixed loop. Sphexishness names that combination:
  apparent intelligence borne by mechanical rigidity.


  A colleague of mine now defends the following claim: what separates an agent of
  the sort relevant to free will from the wasp is not that the agent lacks triggering
  conditions, but that the agent''s behavior is revisable in a way the wasp''s is
  not — upon perturbation, the agent can notice the intervention, re-represent the
  problem, and alter its means rather than re-enter the interrupted routine. She says
  genuine agency just is the opposite of sphexishness, and she insists the difference
  is at least partly empirical: under the right perturbations, the two kinds of system
  should come apart. I keep pressing back that her thesis is either a definition dressed
  up as a discovery or an untestable one, since any finite demonstration of flexibility
  can be redescribed as a larger library of blind routines.


  I would like you to show that the debate can be made empirical without pretending
  it can be made fully empirical. Please:


  (1) Design the strongest concrete intervention, or short battery of interventions,
  that would separate merely high-dimensional sphexishness (a large set of routines,
  each as blind as the wasp''s) from genuinely revisable control. You may pick the
  population best suited to the test — human subjects, nonhuman animals, or a well-specified
  artificial system — but the design must be concrete enough that the result could
  in principle be observed.


  (2) Say precisely which result would support each reading, and what a positive result
  (for instance, subjects reliably bypassing the interrupted routine or improvising
  a new means) would and would not show about the colleague''s claim.


  (3) Address the hardest skeptical reply: that any finite battery of tests can be
  absorbed into a more complicated set of routines, so that what we call flexibility
  is always relative to our description of the system. Does your test do better than
  this, or does it merely push the threat back?


  (4) Conclude by stating what no such test could settle in principle — for example,
  whether the capacity successfully demonstrated deserves the name free will, rather
  than merely non-sphexish control, and whether the "revisability" at issue is itself
  only higher-order rigidity.


