  Let me think what subtle mistakes in a Newcomb''s problem answer would be. Newcomb''s
  problem: predictor, two boxes, transparent? Usually one box $1,000, opaque box $1,000,000
  (or $0). Predictor predicts your choice; if predicted one-box then $1M in opaque,
  if predicted two-box then nothing. You choose either both boxes or only opaque.
  Causal decision theory (CDT) says two-box dominates: the money is already there
  or not, taking both gives extra $1,000 regardless. Evidential decision theory (EDT)
  says one-box, because evidence that you one-box makes it likely $1M. The subtle
  issues: dominance reasoning assumes acts are independent of states, but here the
  prediction makes acts evidence about states; whether you should ratify; Newcomb''s
  problem as a case where dominance conflicts with maximizing expected utility conditional
  on act; the predictor''s reliability; backward causation vs. evidential correlation;
  the "Why ain''t you rich?" argument; smoking lesion as analogous.


