  cannot accommodate.


  5. The verdict on the theory (about 200 words). Say whether the episode confirms,
  qualifies, or undermines explanation by symmetry, which reading it favours if either,
  and what someone should conclude about the explanatory power of symmetry principles
  from this one case."


