  1. The case and the lens (about 150 words). State the two claims of explanation
  by symmetry you will test and the two features of the episode that will do the testing.


  2. What the theory says the episode involves (about 250 words). Set out precisely
  what the ontic reading and the epistemic reading each say about the decuplet argument:
  what is the explanans, what is the explanandum, and what the symmetry argument would
  have to do for the prediction to count as an explanation.


  3. What the lens explains well (about 300 words). Where the episode fits each reading
  naturally, including the sense in which the missing particle was forced by the structure.


  4. Where the lens strains or goes silent (about 350 words). Confront the two awkward
  features: the symmetry is approximate and mass-broken, and the argument looks like
