  Draft:


  "I want an analysis of a real episode in the history of particle physics through
  the lens of a philosophical theory of scientific explanation, running in both directions:
  the theory should illuminate the episode, and the episode should test the theory.


  The theory is explanation by symmetry: the view that symmetry principles do explanatory
  work in physics rather than merely summarising regularities. Its strongest exhibit
  is Noether''s first theorem, which derives a conservation law from each continuous
  symmetry of a system''s action; its central claim is that when a theory is form-invariant
  under a transformation, the invariance can explain why some quantity is conserved
  or why some object must exist. The theory comes in at least two readings. On the
  ontic reading, the symmetries are structural features of the world and the explanation
  runs through that fact. On the epistemic or deflationary reading, the symmetry argument
  explains only in the sense that it organises and unifies our descriptions, and the
  real explanatory work is done by the underlying laws.


  The episode is the prediction and discovery of the omega-minus baryon in the early
  1960s. Here are the salient facts, supplied so that no outside research is needed.
  Gell-Mann and, independently, Ne''eman had proposed the Eightfold Way, a classification
  of strongly interacting particles using the group SU(3). The spin-3/2, positive-parity
  baryons were arranged in a decuplet, a ten-member multiplet; by 1962 only nine of
  its members had been observed. The pattern of the decuplet implied a tenth: a negatively
  charged baryon with strangeness minus three (the omega-minus), with a mass roughly
  150 MeV above the next-lighter member of the decuplet, in line with the spacing
  of the others. The particle was found in 1964 in a Brookhaven bubble chamber photograph,
  with mass and decay properties matching the prediction. Two features of the case
  matter for the analysis: the SU(3) symmetry involved is approximate, not exact,
  because the members of the multiplet have different masses; and the argument was,
  in effect, an interpolation on a pattern rather than a derivation from dynamics.


  Please analyse this episode through the lens of explanation by symmetry, doing two
  things at once. First, say what the theory says the physicists faced and what their
  successful prediction established: did the decuplet structure explain the existence
  and properties of the omega-minus, on either the ontic or the epistemic reading,
  or did it merely describe a regularity that something else explains? Second, say
  what the episode shows about the theory: is a successful prediction from an approximate
  symmetry a confirmation, a qualification, or an anomaly for explanation by symmetry,
  and does the distinction between the ontic and epistemic readings do useful work
  here? Be disciplined about the mapping: say clearly what counts as the symmetry,
  what counts as the explained item, where the explanation is meant to flow, and where
  the theory is silent rather than forcing it to speak.


  Please organise your answer under the following headings, with roughly the lengths
