  My present commitments:


  1. The standard evolutionary and paleontological account is correct, and I regard
  it as settled: sentient animal life existed for hundreds of millions of years before
  human beings, and throughout that span animals injured, killed, parasitized, starved,
  sickened, and died. I am not willing to reopen this claim.


  2. A theological position that requires denying or distorting well-established empirical
  findings has already failed. Scripture is authoritative in matters of faith and
  practice, but it is not a scientific textbook; where a biblical text and a well-established
  scientific finding appear to conflict, the finding constrains the interpretation
  rather than the other way around.


  3. God is the perfectly good creator of all that exists.


  4. The creation that proceeded originally from God was good—not merely instrumentally
  good as a stage on the way to human beings, but good in its own right. The goodness
  of the pre-human world is not exhausted by its eventual issue in us.


  5. The pain, fear, and death of sentient nonhuman animals are genuine evils. They
  are not morally neutral features of nature, and a perfectly good creator would not
  build them into the fabric of the world without a morally sufficient reason.


  6. The Fall is best understood as the entry of sin and spiritual death into the
  human moral world, not as the first biological death among animals. Consequently,
  the Fall cannot be invoked to explain the animal suffering that preceded human beings.
  Whatever explains that suffering must be sought elsewhere, if it can be found at
