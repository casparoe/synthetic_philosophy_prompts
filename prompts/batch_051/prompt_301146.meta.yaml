  you hold the legal rights, you can exclude people, license it, sell it. And there''s
  maintenance-ownership: you''re actually doing the work of keeping the thing alive
  — keeping the servers up, making the files available, fixing bugs, answering the
  email address, deciding what happens to the manuscript. I want to say the second
  one is the part that actually matters, and the first is just the legal shadow of
  the second.


