  is dead without heirs, the studio dissolved, the maintainer disappeared and the
  domain lapsed — after some reasonable period the entitlement-ownership should be
  treated as lapsed too. Not "we can''t find the owner so we''ll make an exception,"
  but "there is no owner in the full sense anymore, because ownership of a work is
  a role, and the role is vacant." The work becomes an unkept thing, and the first
  person to take up maintenance again (rehost the game, digitize and publish the novel,
  patch the font) becomes something weaker than an owner: a custodian. They get protection
  against people ripping off their labor (someone mirroring their re-release and slapping
  ads on it) but they don''t get to abuse the position — no locking the thing away,
  no suing the original fan community that kept it alive. If they drop it, custodianship
  passes like the office was vacated again.


  So it''s like a use-it-or-lose-it rule for ownership, but grounded in the idea that
  owning a work is more like holding an office than holding a potato.


