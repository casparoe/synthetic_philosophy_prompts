  Possible list of arguments for the view that lying is morally worse than misleading:

  1. Lying involves asserting a falsehood, and assertion invites reliance in a way
  that implication does not.

  2. When you mislead someone, they retain an opportunity to notice the false implicature
  / draw the right conclusion; a lie forecloses that.

  3. The liar, unlike the misleader, cannot defend himself later by saying "what I
  said was technically true" — so lying is more culpable/worse because it forfeits
  deniability.

  4. Lying requires asserting something you believe false, and assertion is governed
  by a norm of truthfulness (e.g., Williams: truthfulness is a disposition that underpins
  trust).

  5. Misleading can sometimes be more respectful of autonomy because it allows the
  hearer to exercise their reasoning.


  Arguments that there is NO moral difference (or that misleading is just as bad or
  worse):

  1. The intention to deceive is the same; the content communicated is the same; so
  the wrong-making feature (deception) is present in both.

  2. Misleading can be more manipulative because it deliberately exploits the hearer''s
  reasoning as a means.

  3. The deniability point cuts the other way: misleading is pre-meditated and self-protective,
  which makes it worse.

  4. Saul''s example: in extreme cases, misleading can be worse.

  5. Kantian: both use the hearer as a mere means.


