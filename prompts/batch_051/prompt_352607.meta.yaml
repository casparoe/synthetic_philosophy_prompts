  Let''s draft:


  "I''ve been reading Dewey for a course on pragmatism and American public administration.
  The professor has been using the Tennessee Valley Authority as a recurring example,
  but I''d like a careful case analysis rather than a quick illustration. The standard
  description of the TVA is that it was created in 1933 as a federal corporation to
  plan the Tennessee River watershed: building dams for flood control and electricity,
  improving navigation, promoting soil conservation, and encouraging economic development
  in a chronically poor region. It was deliberately regional rather than national,
  and it combined technical expertise with local agricultural extension and citizen
  participation, at least at some stages.


  Dewey held, especially in The Public and Its Problems, that a public forms when
  people recognize the indirect consequences of their associated activities and organize
  to regulate them, and that inquiry into public problems must be experimental: policies
  are working hypotheses to be tested, revised, or abandoned in light of consequences.
  He also worried that modern industrial society had dispersed and complicated those
  consequences so much that the public was, as he put it, ''in eclipse'' — present
  in effect but not in self-conscious identity.


  I want you to use the TVA as a test case for that theory. Specifically: (1) In what
  respects does the TVA look like a Deweyan experiment in democratic inquiry, with
  its regional scope, its integration of research and action, and its attempts to
  involve local communities? (2) Where does the analogy bend — for example, in the
  role of federal authority, the displacement of residents, the priority given to
  centralized technical expertise, or the fact that the ''experiment'' was not designed
  to be discontinued if it failed? (3) Does the TVA episode tend to confirm Dewey''s
  view that inquiry and democracy can be fused in public administration, or does it
  expose a tension between experimentalism as method and democracy as self-government?
  I want the mapping to be explicit and honest about which features of the TVA the
  theory is silent about, not forced."


