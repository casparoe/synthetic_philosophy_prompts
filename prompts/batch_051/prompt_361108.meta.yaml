  The precautionary principle: when an activity raises threats of serious or irreversible
  harm, lack of full scientific certainty should not be used as a reason to postpone
  cost-effective measures. In practice, it''s invoked for new technologies (GMOs,
  nanomaterials, gene drives) more than old ones (automobiles, coal, existing chemicals).
  This asymmetry: new risks get precautionary scrutiny; incumbent risks get to stay
  until proven harmful.


  Is there a justification? Candidate principles:

  - Consent/voluntariness: incumbent risks have been accepted by living with them;
  new risks are imposed. But people born into the status quo didn''t consent either.
  Also, existing risks often affect disadvantaged groups.

  - Optimization/status quo as default: decision theory needs a baseline; we can''t
  regulate everything. But why place baseline at status quo?

  - Innovation''s irreversibility or unknown-unknowns: new risks may have more severe
  worst cases or less data; old risks have known distributions. This is epistemic:
  we genuinely know more about incumbents. But not always—some incumbent risks are
  poorly studied too (asbestos-like histories).

  - Procedural: the law''s default favors existing entitlements; reversing them requires
  more proof. But that''s legal, not moral.

  - Psychological: status quo bias and loss aversion; novelty aversion.

  - Precautionary principle itself could actually demand the opposite in some cases:
  for incumbents whose hazards are emerging, lack of certainty about magnitude should
  not prevent protective measures (e.g., lead in gasoline history).


