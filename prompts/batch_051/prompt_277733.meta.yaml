  Prompt text:


  I''ve been preparing a week of a paradoxes course on supertasks — the idea that
  infinitely many acts can be completed in a finite interval because the intervals
  shrink fast enough — and a colleague in the mathematics department left me with
  the following argument. I can''t find the flaw, and the conclusion seems to wipe
  out more than it should.


  Consider Thomson''s lamp, described without relying on any contested mathematics.
  A lamp has an ordinary two-position switch. At the start it is on. Exactly half
  a minute later it is switched off; exactly a quarter of a minute after that, on;
  an eighth of a minute after that, off; and so on, each interval being exactly half
  the preceding one. Every switch assigned by this rule comes before the end of one
  minute, and the minute is the limit of the switching times. The question is what
  state the lamp is in at the one-minute mark. The argument runs:


  (1) A lamp with a two-position switch is, at every instant of its existence, either
  on or off.

  (2) Suppose it is on at the one-minute mark. Since the switch is the lamp''s only
  means of changing state, its being on then would have to be the result of some particular
  switching. But every "on" switch in the sequence is followed, later and before the
  minute ends, by an "off" switch. So no "on" switch is the last switch, and none
  can leave the lamp on at the limit.

  (3) By the same reasoning, the lamp cannot be off at the one-minute mark: every
  "off" switch is followed, before the minute ends, by an "on" switch.

  (4) Therefore at one minute the lamp is neither on nor off, which contradicts (1).

  (5) Since (1) is built into the very idea of a two-position switch and the schedule
  is perfectly explicit, the culprit must be the assumption that the schedule could
  be carried out; so this supertask, and by extension any completed supertask of this
  shape, is impossible.

  (6) But now consider an ordinary marble rolling along a one-metre track from left
  to right, arriving at the right-hand end after one second. Its motion contains the
  same convergent structure: it passes the halfway point at half a second, the three-quarter
  point at three-quarters of a second, and so on, with no last intermediate point
  before arrival. If the lamp argument is sound, we should be able to argue that the
  marble never really arrives: since no particular intermediate position is the last
  one before the end, the marble''s being at the end could not be the result of any
  stage, and therefore it could not be at the end. But the marble does arrive.


  Which step, if any, should be rejected, and what exactly does rejecting it cost?
  I want to know whether the lamp and the marble can be separated without giving up
  the thought that a convergent series of states can have a determined limit, and
  whether the cost is that we must allow a physical object to have no definite state
  at an instant, or that some supertasks are specifiable but not executable, or something
  else. If I have to say what I am attached to, it is step (1); but I suspect that
  attachment is doing a lot of work, and I want to know what I would have to pay to
  keep it.


