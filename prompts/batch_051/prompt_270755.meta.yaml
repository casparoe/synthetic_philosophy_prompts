  The argument:


  1. A translation is faithful only if it preserves what the original says and how
  it works (its "meaning" in the broad sense that includes form).

  2. A fixed-form poem (say, a sonnet or Marot''s "Ma mignonne") works as a poem partly
  through its formal constraints: rhyme scheme, meter, syllable count, line length.

  3. These formal features exist only as patterns in a particular language''s sounds.
  E.g., a rhyme is a correspondence of sounds in a particular language; a meter is
  a pattern of stresses/syllables in that language.

  4. A translation must be written in the target language, which has a different sound
  system and different word-stock. So the same formal pattern cannot, in general,
  be reproduced while preserving the same words/meanings.

  5. Therefore a faithful translation must either preserve the formal pattern or the
  lexical meaning, but not both.

  6. But translators produce translations of fixed-form poems all the time, and we
  call them translations (not paraphrases).

  7. So either all translations of fixed-form poems are unfaithful (and we should
  stop calling them translations), or form is not part of what must be preserved (and
  something important is lost from the very idea of translating a poem).


