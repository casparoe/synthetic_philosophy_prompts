  Let me make sure I understand Sellars''s myth of the given well enough to write
  a rich prompt without errors. Sellars (Wilfrid Sellars, "Empiricism and the Philosophy
  of Mind," 1956). The myth of the given: the idea that there is a self-authenticating,
  non-inferential foundation for empirical knowledge in immediate experience — sense
  data, raw feels, the "given." Sellars argues that anything that can stand in justificatory
  relations must be conceptual; "the given" is a confusion: sensory episodes can cause
  beliefs but cannot justify them unless already conceptual. There''s a distinction
  between the manifest image and the scientific image, but maybe not needed. The prompt
  can inject the core: a pre-conceptual layer of experience that is immediately known
  and can serve as a foundation for justifying the rest. Sellars''s critique: any
  episode that is a knowing must be in "the space of reasons"; nothing nonconceptual
  can justify a belief. The poem "The Red Wheelbarrow" is imagist; it presents an
  image of ordinary things, "so much depends upon..." The poem seems to valorize bare
  perception of things, as if the image alone carries significance. Could ask: does
  the poem''s insistence on the thing itself constitute a claim that there''s a given?
  Is the poem trying to return us to a pre-conceptual encounter, and if so, is that
  the myth Sellars warns against? Alternatively, read the poem as exemplifying the
  conceptual mediation even in bare description — that "so much depends" smuggles
  in a conceptual/human framework. The asker may be teaching a philosophy and poetry
  unit or a philosophy of perception class.


