  Benacerraf''s puzzle in "What Numbers Could Not Be" (1965): There are multiple set-theoretic
  reductions of arithmetic (e.g., Zermelo: 0=∅, n+1={n}; von Neumann: 0=∅, n+1=n ∪
  {n}). Both satisfy the Peano axioms; each makes "2 ∈ 4" either true or false, but
  there''s no non-arbitrary way to choose. Therefore numbers aren''t sets; arithmetic
  is about an abstract ω-sequence (structure), and any object answering to it works.
  Junk theorems: "2 ∈ 4" and "1 ∈ 3" etc. The structuralist says these are meaningless/unanswerable,
  not real arithmetic questions.


