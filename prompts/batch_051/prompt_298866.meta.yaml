  Disjunctivism about perceptual experience: the claim that veridical perception and
  hallucination don''t share a common fundamental kind (mental state) — they''re disjunctive:
  either one is seeing X (a state involving the object) or one is hallucinating X.
  The argument from illusion: (1) in illusion/hallucination, we''re aware of something
  that has sensory qualities but isn''t a physical object out there; (2) since veridical
  experience is subjectively indistinguishable from illusion/hallucination, the same
  kind of thing is going on; (3) therefore in all cases we''re directly aware of sense-data
  / non-ordinary objects; so direct/naive realism is false. Disjunctivists reject
  premise (2): subjective indistinguishability doesn''t license a common-kind conclusion.
  They deny the "common kind assumption" (Martin). Key pressure points:

  - The causal argument: local supervenience/same proximate cause should yield same
  effect; if a brain state causes both veridical perception and matching hallucination,
  same mental state. Disjunctivist replies: sameness of neural cause doesn''t guarantee
  sameness of conscious state? Or deny the "same cause" (the object is part of the
  cause/metaphysical ground)?

  - The "screening-off" problem: Martin''s argument that if introspection is only
  of a mental event type indifferent between good and bad case, it can''t reveal which
  disjunct obtains — but disjunctivism says we can know by reflection that we''re
  seeing? Actually screening-off is about epistemological disjunctivism: if the subject
  has the same evidence in both cases, the fact that she''s veridically seeing can''t
  do epistemic work because it''s screened off. Need to fix.


  Actually "screening-off" problem is often posed against epistemological disjunctivism:
  in the bad case, subject''s evidence E is the same; in good case, E plus fact of
  seeing. If E is the same, the additional fact is screened off from the subject''s
  rational basis. Disjunctivists respond by denying that evidence is the same in both
  cases — evidence in the good case involves the fact seen itself (factive evidence).


  - The "basis" problem: what explains the indistinguishability of the good and bad
  cases? Naive realists/disjunctivists owe an account of why hallucinations can be
  introspectively indiscriminable from veridical experiences if they have no common
  kind. Martin''s "negative epistemic conception of hallucination" claims hallucinations
  have no positive nature; they''re defined as states that can''t be introspectively
  distinguished from veridical perceptions. But this faces the "causal-explanatory"
  objection: how can a state with no positive nature be caused by a brain? Also "hallucination
  as such" problem.


  - Epistemological vs metaphysical disjunctivism: McDowell''s epistemological disjunctivism
  (perceptual warrant differs between good and bad cases) vs Martin''s metaphysical
  disjunctivism. Some accept epistemic disjunctivism while rejecting metaphysical.


  - The "fundamental kind" vs "how things seem" distinction: disjunctivism does not
  deny that good and bad cases have something in common in terms of "subjective character"
  or phenomenal similarity; it denies they share a fundamental mental kind. But then
  what is this shared seeming? "Phenomenal indistinguishability" as a relation, not
  a shared property.


  - Higher-order issues: Is disjunctivism compatible with the "transparency" of experience?
  Is disjunctivism a form of naive realism, or could there be disjunctivism with representational
  contents?


  - Negative vs positive disjunctivism: negative disjunctivism (there''s no more to
  the bad case than its indiscriminability from a good case) vs positive disjunctivism
  (hallucination has its own positive nature).


