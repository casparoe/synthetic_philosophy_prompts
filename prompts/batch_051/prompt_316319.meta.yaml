  Condorcet jury theorem: Given a group of voters/jurors choosing between two options
  (e.g., guilty/not guilty), with each voter having independent probability p > 0.5
  of choosing the correct option, the probability that a majority vote chooses the
  correct option increases with the group size and tends to 1 as group size → ∞.


  Assumptions: binary choice, voters independent, each voter''s competence p > 1/2,
  identical competence (in simple version), sincere voting, and votes aggregated by
  simple majority.


  Common misrepresentations:

  1. Conflating independence with diversity of opinions. The theorem requires votes
  to be independent conditional on the true state, not that jurors are diverse/dissimilar.
  Homogeneous but independent voters still work.

  2. Overstating: "the majority is always more likely to be right than any individual"
  — actually the majority is more likely than any single voter when p > 0.5 and votes
  independent. That''s true. But people overstate by saying "large groups are wiser
  even if individuals are only slightly better than chance" — that''s roughly true.

  3. Saying "the theorem shows democracy works" — it says if assumptions hold, majority
  is superior; small departures (e.g., slight correlation) can destroy it. Also p
  < 0.5 gives majority worse than individuals (in fact tends to 0 as n grows). If
  p = 0.5, majority is 0.5.

  4. Saying "correlated voters are fine as long as they''re somewhat independent"
  — actually correlation can reverse result; with correlation, asymptotic competence
  can fail.

  5. Conflating epistemic independence with causal independence.

  6. Saying the theorem assumes voters have private information and don''t influence
  each other — that''s partially right; the theorem assumes independent signaling,
  no deliberation. The "no deliberation" part is an assumption of the standard theorem,
  not a result.


