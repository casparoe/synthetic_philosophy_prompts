  Draft v1:


  "In my reading group on the foundations of cognitive science, a dispute about the
  sentence ''the brain is a computer'' has now run for over two years without either
  side moving, and I want a diagnosis of what kind of disagreement we are actually
  having. The empirical facts are not in dispute. Both sides agree that neural spike
  trains carry information in Shannon''s sense, that many circuits are usefully described
  as implementing algorithms, and that the brain is a noisy, analog, massively parallel
  physical system rather than a stored-program digital machine. What they disagree
  about is whether ''the brain computes'' is a literal description of the brain''s
  causal organization or a piece of modeling shorthand.


  One camp — call them the mechanists — says the brain computes literally. They grant
  that ''computer'' cannot mean ''silicon stored-program device,'' but they insist
  there is a perfectly literal sense in which a system computes when a mechanism manipulates
  medium-independent vehicles according to a rule: spike-time patterns or contents
  of working memory get transformed by neural machinery the way a processor transforms
  symbols. For them, whether the brain computes in this sense is a discoverable fact
  about the system, not something we merely choose to say; computational neuroscience
  is a science of computation in the brain, not a metaphor for it.


  The other camp — call them the deflationists — says the literal claim is either
  false or trivial. They point out that any sufficiently regular process, from a rock
  falling to the orbit of Jupiter, can be assigned a computational interpretation,
  and that Shannon information is too cheap to distinguish brains from anything else.
  What makes a laptop a computer, on their view, is not just its dynamics but its
  design history and the semantic contents we assign to its states, and brains lack
  exactly that. So ''the brain computes'' is at best a useful way of saying the brain
  can be fruitfully simulated or modeled computationally.


  The frustrating thing is that the two sides keep making the same moves. The mechanists
  accuse the deflationists of conflating computation with its simulation; the deflationists
  accuse the mechanists of smuggling in a homunculus to decide which physical states
  count as vehicles. My own suspicion is that ''computer'' is doing three different
  jobs at once — (i) anything simulable by a Turing machine, (ii) a mechanism that
  actually manipulates discrete, medium-independent vehicles, and (iii) a functional
  kind partly defined by design and semantic interpretation — and that the camps are
  answering different questions under one name. But I doubt this disambiguation is
  the whole story, because the mechanists and deflationists still disagree, even after
  the senses are separated, about whether the brain in fact manipulates vehicles and
  about whether ''manipulates a vehicle'' can be spelled out without an interpreter.


