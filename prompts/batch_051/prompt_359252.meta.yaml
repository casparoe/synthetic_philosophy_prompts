  uniquely defined.

  - Extreme versions: probability of "this coin lands heads" — classes: fair coin
  tosses, this coin''s tosses, coin tosses in this room, this exact physical initial
  condition (deterministic → 0 or 1). Different classes give 1/2, 0.49, 0.53, 1...
