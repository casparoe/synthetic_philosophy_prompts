  The reference class problem:

  - To assign a probability to a single event (single-case probability), one standard
  interpretation (frequentism) uses a reference class: the set of similar cases; probability
  = relative frequency in that class.

  - The problem: many reference classes are available, giving different probabilities;
  e.g., probability that a particular patient, Jones, will survive surgery? Classes:
  all patients having this surgery, males in their 50s, patients with this comorbidity,
  patients under this particular surgeon, patients identical in every medical respect...
  The narrower classes yield different frequencies.

