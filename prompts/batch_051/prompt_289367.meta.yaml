  Exam question: "Does the Condorcet jury theorem show that government by majority
  vote is more likely to make correct decisions than government by a single competent
  ruler? Explain the theorem''s assumptions and whether real polities satisfy them."


  Student answer (to be graded): Something like:


  "The Condorcet jury theorem says that when a group votes on a yes/no question and
  each member independently has a probability p greater than 0.5 of choosing the right
  answer, the probability that the majority chooses the right answer is greater than
  p, and as the group gets bigger this probability approaches 1. So yes, bigger electorates
  are better than any single ruler, because the majority is always more reliable than
  any individual voter. The only real assumptions are that voters are independent
  (they don''t talk to each other or bribe each other before voting) and that they
  are more often right than wrong. The theorem still works if voters have different
  levels of competence, since all that matters is whether the average voter is better
  than an even chance. One famous consequence people mention is that if voters are
  worse than even (p below .5), then the majority will be wrong, but that just proves
  you should vote the opposite of the majority, so even a very ignorant electorate
  can be turned into a good decision procedure. In real democracies these conditions
  mostly hold: elections are binary choices between two parties, voters have private
  information from their own lives, and most people are better than chance at judging
  which party will govern better, so the theorem does provide a real epistemic justification
  for majority rule."


  Now the mistakes:

  1. "the probability that the majority chooses the right answer is greater than p"
  — for odd n with homogeneous p> .5, yes this is true (Condorcet''s theorem first
  part). OK, not a mistake.

  2. "as the group gets bigger this probability approaches 1" — true under homogeneity
  and independence.

  3. "So yes, bigger electorates are better than any single ruler, because the majority
  is always more reliable than any individual voter." This is an overgeneralization:
  majority is more reliable than *a randomly selected voter from the same distribution*
  assuming same p and independence, but "any single ruler" is not the same as the
  pooled voters; a single ruler could have p > the majority. Also real democracy is
  not a binary "correct/incorrect" factual question; preferences and interests aren''t
  common truth. This is a visible but commonly-noted critique; the student''s response
  actually maybe includes it? Not exactly.

  4. "The only real assumptions are ... independence (they don''t talk to each other
