  Sellars''s "Empiricism and the Philosophy of the Mind" (1956): attacks the "Myth
  of the Given." The Given: the idea that there are certain self-authenticating, non-inferential
  bits of awareness (sense data, the immediate apprehension of particulars) that can
  serve as foundation for empirical knowledge and do not themselves stand in need
  of justification. Sellars: nothing can be both (i) a brute particular merely present
  to the mind and (ii) something that can stand in a justificatory relation to a proposition,
  because justification is a normative/inferential relation requiring conceptual content
  ("the space of reasons"). Various "givens" (sense data, first-person reports, universals
  apprehended directly) either have non-conceptual content and thus can''t justify
  (the "naturalistic fallacy" in epistemology? Actually he says the given involves
  a confusion between causal conditions and justifications), or they have conceptual
  content and thus are already within the space of reasons and can''t be a pure given.


  Sellars does NOT deny that there are sense impressions or that perception causally
  requires sensory input. He does say observation reports like "this is red" are justified,
  but they''re justified partly because the reporter has learned to respond reliably;
  the perception is a causal condition but the justification also involves conceptual
  capacities. He is not a pure coherentist in the sense that empirical content is
  an illusion or that coherence is sufficient; he holds that observational knowledge
  is possible, though its authority is not self-authenticating but is itself a matter
  of the reliability and standing of the reporter. He also has scientific realism:
  the "scientific image" is in some way the measure of what there really is? He says
