  Imprecise probabilities theory: The view that rational credences need not be precise:
  instead of a single probability function, an agent''s doxastic state is represented
  by a set of probability functions (a credal set), and rational belief can be indeterminate
  between them. Virtues: it accommodates the Ellsberg paradox without irrationality,
  models ambiguity, lets you reflect incomplete evidence without pretending to have
  exact numbers, avoids the false precision of Bayesianism; it also handles cases
  where you have no meaningful precise prior (e.g., ignorance between many possibilities).
  Firm intuition: in an actual decision, there is a fact of the matter about what
  you ought to do; or if you are offered a bet at a price, there is a determinate
  answer whether to accept. Imprecise decision theory gives only indeterminate recommendations:
  an act is permissible if it maximises expected utility under some member of the
  set, so both taking and refusing can be rationally permissible, and it generates
  a bid-ask spread rather than a unique fair price. The clash: does the theory contradict
  the intuition that rationality is practically action-guiding/complete, or is the
  intuition an artefact of pragmatic decision contexts (e.g., but decisions force
  precision, so at choice point you must sharpen — Levi''s thesis?).


