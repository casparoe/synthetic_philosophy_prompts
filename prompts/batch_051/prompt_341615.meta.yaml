  ---


  You are an expert in both the philosophy of classification (natural kinds, homeostatic
  property clusters) and grammatical theory (parts of speech, grammaticalisation).
  I have been developing a view about parts of speech and would like you to evaluate
  a particular application of it.


  First, here are the criteria I am using for what it takes for a grammatical category
  to count as a natural kind rather than a merely conventional or historically accidental
  grouping.


  1. Property clustering: members of the category tend to share a non-trivial cluster
  of morphological, syntactic, and semantic properties, though no single property
  is necessary.

  2. Explanatory grounding: the clustering is underwritten by a common causal or functional
  pressure — e.g., a shared grammaticalisation pathway, a shared underlying semantic
  field, or a shared role in phrase structure — rather than by the whim of the descriptive
  tradition.

  3. Projectability: knowing that an item belongs to the category licenses reliable
  inferences about its behaviour in new constructions.

  4. Non-arbitrary boundaries: the boundary of the category is where it is for theoretical
  reasons, and cropping the category differently would cost us generalisations.


  Now consider the traditional part-of-speech category ''preposition'' in English.
  At one edge it contains items like under, behind, through, and beside, which denote
  spatial or concrete relations and can be modified, graded (further under), and contrast
  with particles in ways that look semantically full. At the other edge it contains
  items like of, which in many uses is closer to a genitive case marker than to a
  relational predicate; to, which ranges from a spatial preposition (to the shop)
  to a dative marker (give it to her) to an infinitive marker (to leave); and forms
  like because of, which is a complex preposition with an internal semantics of its
  own. Traditional grammars lump all of these into one class; many modern syntactic
  frameworks split them into lexical prepositions, functional case markers, and complementisers.


  Using the four criteria above, assess whether the traditional category preposition
  qualifies as a natural kind. Please work through the criteria one by one, including
  a short initial brainstorming pass in which you canvass the strongest considerations
  on each side before you commit. Where the category fails a criterion, say whether
  the failure lies with the category, with the criteria, or with the traditional grammar
  that created the category. Then say what your overall verdict is and, importantly,
  what your analysis suggests about the criteria themselves: are they too demanding,
  too weak, or adequate but being applied to the wrong kind of object?


