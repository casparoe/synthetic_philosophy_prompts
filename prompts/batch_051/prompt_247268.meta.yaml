  Quantum identical particles: In classical mechanics, two particles of the same type
  are indistinguishable in the sense that we may not know which is which, but there
  is a fact of the matter; we could in principle follow their trajectories and label
  them. Swapping two classically indistinguishable particles yields a different configuration
  (label swap) but is observationally identical. In quantum mechanics, states of identical
  particles are required to be symmetric (bosons) or antisymmetric (fermions) under
  exchange; there is no state corresponding to "particle 1 here and particle 2 there"
  with which-is-which labels — only the symmetrized/antisymmetrized combination. The
  permutation operator generates no distinct state; permutations are not observables.
  Consequently, identical particles can violate the principle of identity of indiscernibles
  (PII): e.g., two electrons in a helium atom can be in the same... actually fermions
  can''t be in the same one-particle state, but they can occupy entangled superpositions
  where no individuating property distinguishes them; still they are two. Many philosophers
  argue quantum particles are "weakly discernible" via relations (e.g., being in opposite
  spin states / Pauli exclusion relations), so not indiscernible in the strongest
  sense. Others argue for primitive thisness/haeccitism, others for a structuralist
  or bundle view where particles are not individuals.


