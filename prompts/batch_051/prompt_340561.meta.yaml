  Reflective equilibrium: method of justification where one works back and forth between
  considered judgments (moral intuitions) and principles, adjusting both until coherence.
  Distinctions:

  - Narrow vs wide reflective equilibrium: narrow only tests candidate principles
  against considered judgments about a particular subject; wide treats background
  theories (of the person, society, etc.) as also revisable and seeks coherence with
  them.

  - Goodman introduced reflective equilibrium (justification of rules of inference
  by adjusting rules and inferences).

  - Rawls uses it for justice as fairness; what role it plays: some read Rawls as
  coherentist, others as a form of intuitionism? Actually Rawls says it''s a form
  of "coherence" view.

  - Scanlon: justification is via what principles no one could reasonably reject,
  not reflective equilibrium per se? Scanlon has some discussion.

  - Daniels: wide reflective equilibrium and independent credibility.

  - Mistakes: (1) saying Rawls invented reflective equilibrium (he didn''t; Goodman
  did for inductive logic; Rawls adapted it). (2) Conflating "considered judgments"
  with "intuitions we''re born with" or treating them as infallible fixed points.
  Rawls says considered judgments are those made under conditions favorable to avoiding
  error; they''re provisional, not fixed. (3) Saying reflective equilibrium is a decision
  procedure or algorithm that outputs unique answers, when it''s a method with underdetermination;
  multiple equilibria possible. (4) Claiming reflective equilibrium guarantees or
  discovers moral truth; Rawls is cautious—it''s about justification/objectivity for
  practical purposes, not necessarily truth (though some commentators disagree). (5)
  Saying narrow and wide are the same or that wide means just taking more principles
  without revising background theories. (6) Misattributing to Rawls the view that
  the original position is the method of reflective equilibrium; actually the original
  position itself is set up so its principles match considered judgments, and reflective
  equilibrium is the test.


