  admiration is fitting toward the admirable, fear toward the fearsome, and so on.


  (2) Value is to be analyzed in terms of fitting attitudes: for a thing to be good,
  or valuable, is for it to be a fitting object of a favorable attitude (such as admiration,
  respect, or desire).


  (3) The wrong-kind reasons problem is a real problem for reasons-based analyses:
  the demon''s threat gives you a reason to admire him, but that reason doesn''t bear
  on whether he is admirable, so not just any reason to favor a thing makes that thing
  good.


