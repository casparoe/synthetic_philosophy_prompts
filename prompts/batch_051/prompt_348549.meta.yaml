  threat is real, you really ought, other things equal, to bring it about that you
  admire him; it would be rational in an ordinary sense to try.


  (6) The standard reasons framework — according to which what you ought to do/think/feel
  is a function of the balance of reasons — applies to attitudes just as much as to
  actions.


