  or two sentences, and nothing else: no title, no preamble, no signature block, no
  explanatory notes. Start directly at clause one and stop at clause five.


  The satire should target two habits of thought at once: the assumption that the
  person who signs a form today is entitled to bind a later self simply because the
  signatory came first, and the opposite assumption that a later self may brush away
  the signatory''s wishes as the demands of a stranger. The comedy must come from
  real features of the underlying problem, as a non-specialist would run into them:
  the stability of values over decades, whether a wish survives losing the memories
  that made it intelligible, whether disagreeing with the signed form is treated as
  loss of capacity or as the illness talking, and the fact that someone still has
  to decide which self counts as the real one. It should stay entirely deadpan, with
  no winking. A reader with no background in philosophy should find it legible, and
  a specialist in the ethics of advance directives should find it fair rather than
  a caricature. British English throughout, please.


