  "Lewis on convention" — David Lewis, Convention (1969). Key ideas: convention as
  a regularity R in behavior of members of a population P in recurring situation S,
  such that: (1) everyone conforms to R; (2) everyone expects everyone else to conform
  to R; (3) everyone prefers to conform to R given others conform (coordination equilibrium);
  (4) there is an alternative regularity R'' that also satisfies these; (5) common
  knowledge of (1)-(4); (6) precedent/arbitrariness. Norms emerge as conventions solving
  coordination problems. Explaining normativity.


  "Moloch" — Scott Alexander''s essay (2014). Multipolar traps: each agent acting
  in its own interest leads to collectively bad outcomes; even when every agent would
  prefer the coordinated outcome, the "Moloch" dynamics push them to defect. Examples:
  arms races, advertising, positional goods, sacrifice to Moloch. The distinctive
  point: unilateral non-participation loses, so you can''t opt out; the bad equilibrium
  is a Nash equilibrium but Pareto-inferior.


