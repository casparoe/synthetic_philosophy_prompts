  Updateless decision theory: In problems involving logical correlations or indexical
  uncertainty, the agent doesn''t update its beliefs on evidence that is downstream/correlated
  of its own decision, but rather selects a "policy" mapping all possible observations
  to actions, maximizing expected utility computed from a prior that includes all
  possible observations. E.g., in Newcomb''s problem, the predictor predicted your
  action; when in the room, you observe the problem; if you update to "I am the one-boxing
  type" vs "I am the two-boxing type" and choose accordingly, you lose; rather choose
  the action that the best policy would output for all instances.


