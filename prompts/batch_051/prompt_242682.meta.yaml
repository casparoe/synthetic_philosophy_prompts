  Prompt:


  "I convene a reading group of twelve retired scientists and engineers — mostly chemists,
  physicists, and one economist — who meet monthly to work through philosophy of economics
  and social epistemology. We have been reading around the idea that markets do epistemic
  work: prices aggregate dispersed information, and yet the no-trade theorem seems
  to say that purely information-based trade should unravel, since a rational person''s
  willingness to trade at a given price is itself information. I would like to make
  this tension felt rather than merely discussed.


  Please design a 90-minute in-class game for our next meeting, for twelve participants
  (I can adjust numbers in pairs). The game should give each participant a private
  signal about the value of a single asset, then let them trade it through a simple
  double-auction or one-on-one offer procedure, with a payoff scheme that rewards
  accurate final valuations rather than trading profit and needs no real money. The
  rules should be arranged so that the group first experiences a wave of eager trade
  and then, ideally, watches the market freeze as they learn to read each other''s
  willingness to trade as information. Afterward, a debrief should map what happened
  to the assumptions of the no-trade theorem: common priors, common knowledge of rationality,
  and strict risk aversion — and should say which of these the game actually enforced
  and which it merely approximated. I would also like an honest note on what the activity
  cannot reproduce: real markets have noise traders and liquidity needs, and the theorem
  says trade should be zero, not that people are irrational when they trade.


  Give me a definite design, not a menu: the exact rules, materials, the payoff formula,
