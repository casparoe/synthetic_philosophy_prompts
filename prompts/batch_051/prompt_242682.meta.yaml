  No-trade theorems: Milgrom and Stokey (1982): if agents have common priors, are
  rational (Bayesian), and it is common knowledge that they are rational, then they
  cannot agree to disagree... Actually the no-trade theorem: no speculative trade
  can occur purely on the basis of differences in information when all agents have
  common priors, common knowledge of rationality, and are risk-averse (strictly),
  because any proposed trade that one accepts reveals information that makes the other
  unwilling. Related: Akerlof''s lemons (adverse selection); "no-trade" result. The
  epistemology of markets: prices aggregate information (Hayek), but no-trade theorem
  says informationally-based trade should unravel; market participation itself reveals
  private information.


  A classroom activity: simulate a market for an asset whose value is the sum of several
  private signals held by different participants. Each participant gets a private
  clue about the value; they can trade a single asset; we observe how much trade occurs
  and at what prices. The "force of the idea": students who hold positive signals
  want to buy, but when someone is willing to sell to them, they should downgrade
  their valuation (the willingness to sell is itself information). With enough iterations
  or structured offers, trade dries up; then compare to a baseline with different
  priors where trade continues. The debrief maps moments to common prior assumption,
  rationality, adverse selection, information aggregation in prices.


