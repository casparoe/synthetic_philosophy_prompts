  Construct a thought experiment with this target result: a community loses the backstop
  function of recordings even though its detection and authentication tools are genuinely
  very good, and even though no particular deepfake in the story fools anyone. The
  collapse should come from the way the mere availability of deepfakes changes how
  people reason about recordings, not from a detector being defeated or a fake being
