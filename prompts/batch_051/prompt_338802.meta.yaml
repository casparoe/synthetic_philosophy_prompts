  Let me refine the argument for rigor.


  Setup:

  Two agents, A and B, are in causally isolated rooms. Each chooses between "Pay"
  (cost 3 to self, benefit 10 to other) and "Pass" (cost 0, benefit 0). Payoffs: if
  both Pay, each gets +7 (i.e., -3 +10). If both Pass, each 0. If one pays and other
  passes, payer -3, other +10. Each knows the full setup and knows that both are running
  the same deterministic decision algorithm on the same information.


  Argument:

  (1) Since A and B run the same deterministic algorithm on the same information,
  their actions will coincide: either both pay or both pass.

  (2) Therefore, conditional on A''s paying, B will pay; and conditional on A''s passing,
  B will pass.

  (3) So A''s expected payoff from paying is −3+10=7, while from passing it is 0.

  (4) A ought to take the action with the higher expected payoff.

  (5) Therefore A ought to pay, despite there being no causal path from A''s action
  to B''s action.

  Conclusion: sometimes rationality requires acting even when the act cannot causally
  influence the outcome that makes it worthwhile.


  Now, where''s the flaw? Let''s think carefully.


  If A and B run the same deterministic algorithm on the same information, then (1)
  is true. (2) is true as conditional probability / evidential conditioning: P(B pays
  | A pays)=1 and P(B pays | A passes)=0 (assuming the only worlds consistent with
  setup). (3) computes *evidential* expected utility: EU_causal(A pays) = -3 + 10
