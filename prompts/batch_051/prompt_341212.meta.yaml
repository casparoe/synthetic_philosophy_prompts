  So I got into this long argument last night with my friend who kept insisting that
  deterministic means predictable in principle: any randomness in the forecast just
  reflects our ignorance, not anything real. I realized I know the standard responses
  but I couldn''t make him feel the point. I teach a 75-minute undergraduate philosophy
  of science seminar, 14 students, and I want to run an activity where they experience
  a deterministic rule becoming effectively unpredictable even when everyone is following
  the rule exactly. They should come away seeing that determinism at the level of
  the rule and predictability at the level of a forecaster can come apart, and that
  the gap is about precision, amplification, and the horizon of prediction, not about
  randomness. No lecture up front, and they shouldn''t hear the word "chaos" until
  the debrief.


  Design a runnable activity around a simple deterministic recurrence, something like
  the logistic map x_{t+1} = 4x_t(1−x_t). Include roles for forecasters and a "world"
  that follows the rule, a scoring scheme that doesn''t use real money, and a concrete
  timeline for 75 minutes. The key mechanic should be that the forecasters are given
  the initial condition only to some number of decimal places, while the world is
  secretly run from a slightly different value inside that uncertainty range. The
  teams should discover that their forecasts get worse over time, but they shouldn''t
  be able to fix it by being smarter, because the missing digits are simply not in
  the information they were given. Then give me the debrief: map what happened to
