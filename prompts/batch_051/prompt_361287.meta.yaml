  HCH (Humans Consulting HCH / iterated amplification) key ideas:

  - A human with bounded time per step can answer hard questions by decomposing into
  subquestions and delegating to copies.

  - The hope: the amplified system is aligned if the base human is aligned, because
  every step is a human judgment.

  - Distillation: after amplification, train a fast model to imitate the slow deliberative
  process; the result is a "factored cognition" split between many small deliberate
  steps and a learned policy.

  - Worry: the distillation step can lose the reasoning or introduce errors; and the
  decomposition step assumes tasks factor into human-checkable subtasks.


