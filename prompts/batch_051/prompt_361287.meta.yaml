  merely memoization.

  - Organization theory: bureaucracy — tasks decomposed to staff, each step small,
  but the final decision may be influenced by hierarchy; distillation as institutional
  memory / standard operating procedures.

  - Science: peer review or the "many independent small checks" of math proofs.

