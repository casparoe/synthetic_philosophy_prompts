  Classical: Two Bayesians observe i.i.d. coin flips. Each has prior over some parameter
  space (e.g., Bernoulli biases θ∈[0,1]). If both priors have full support and are
  not too weird (Kullback-Leibler support / positive density at true θ0), then posterior
  concentrates on θ0 at rate 1/√n, and their predictive probabilities P(X_{n+1}=H
  | data) both → θ0, so priors wash out. This is the Blackwell-Dubins merging / Doob
  consistency.


