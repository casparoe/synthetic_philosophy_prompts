  The adaptationism debate: Gould and Lewontin (1979) critiqued "adaptationist programme"
  which atomizes organisms into traits, assumes each trait is optimal/adaptive, and
  constructs plausible stories with insufficient evidence. They proposed alternatives:
  constraints (phyletic, developmental, architectural), allometry, chance/drift, and
  by-products (spandrels). Key conceptual points:

  - Distinction between adaptation (trait shaped by selection for current/ancestral
  function) vs exaptation (feature co-opted for new function) vs by-product/spandrel.

  - Distinction between current utility and historical genesis (selected effect vs
  causal role theory of function).

  - The "just-so story" problem: adaptationist hypotheses are often unfalsifiable
  because any trait can be given a story.

  - The null hypothesis debate: should non-adaptation (drift, constraint) be the null?
  Or is selection the best default given the strength of natural selection (e.g.,
  even small selection coefficients)?

  - "Adaptive landscape" and constraints.

  - Reverse engineering an organism vs testing quantitative predictions.


  Two camps in adversarial collaboration:

  Camp A: Adaptationist (careful one, not Panglossian) — says natural selection is
  the only known force producing complex adaptive fit, so for traits that show fit,
  adaptation is the default explanatory target; alternatives are possible but require
  positive evidence, not just possibility. Holds that many spandrels are later co-opted
  (exapted), so the prevalence of spandrel-like traits doesn''t undermine adaptationism
  as a research programme; what matters is current maintenance by selection.

  Camp B: Gould-Lewontin pluralist/structuralist — says the historical process is
  not inferable from current utility, and that adaptationist explanations overreach;
  you cannot infer selective origin from current role. Constraints and by-products
  are first-class explanations, and the burden should be symmetric: selective origin
  and non-adaptive alternative both need evidential support. They emphasize the contingency
  of trait individuation: the "atomization" problem.


