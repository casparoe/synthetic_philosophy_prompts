  are quietly wrong; then tell me whether the concluding claim about reading off "true
  preferences" follows from anything accurate in the passage. I would like a committed
  verdict with reasons, not a survey of possible readings. Please lead with your bottom
  line in the first sentence and then give the reasoning, with no preamble and no
  restating of the question.


