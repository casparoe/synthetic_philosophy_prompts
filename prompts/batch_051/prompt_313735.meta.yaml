  I am a retired chemist who has lately been reading philosophy of mind and the theory
  of decision, and I would welcome a careful assessment of a passage I encountered
  in a piece of science journalism on "inverse reinforcement learning." The article
  summarized the technique, as best I can reconstruct it, like this:


  "Inverse reinforcement learning lets researchers recover what an agent really wants
  without asking it: you observe the agent''s choices and run the behavior backward
  to infer the hidden reward function. The engine of the method is a rationality assumption,
  namely that the behavior you see must be optimal for the goal being sought; so the
  goal that best rationalizes the observed choices is the one the agent actually has.
  The inference is admittedly underdetermined, since any finite batch of behavior
  is consistent with many goals, but the usual remedy is to model the agent as a slightly
  noisy maximizer of its preferences, and that extra structure is enough to recover
  the true reward. In a standard illustration, a mouse that hesitates at a fork and
  then takes the cheese gives the algorithm grounds to rank cheese above the apple.
  Scaled up to humans, this promises a scientific route past self-report: you can
  read off a person''s true preferences from what they do, not from what they say
  they want."


