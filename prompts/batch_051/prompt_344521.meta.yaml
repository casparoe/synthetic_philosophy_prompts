  Actually let me formulate Aumann''s theorem carefully.


  Aumann (1976): Suppose two people have the same prior over a finite state space
  Ω. Each person i has an information partition P_i. After receiving private information,
  agent 1''s posterior for an event A given his information cell is p1, and agent
  2''s is p2. If at some state ω their posteriors p1 and p2 are common knowledge (i.e.,
  the event that 1''s posterior is p1 and 2''s posterior is p2 is common knowledge
  at ω), then p1 = p2.


  Proof sketch: Let E be the event that agent 1 assigns posterior p1 to A and agent
  2 assigns p2 to A. Common knowledge of posteriors means that at ω, the meet of their
  partitions (finest common coarsening) containing ω is a subset of E. So for any
  cell in the meet M(ω), the posterior of each agent conditional on M(ω) is p_i. Actually,
  if the posteriors are common knowledge, then each agent''s posterior given their
  information is constant on M(ω): agent 1''s posterior is p1 on all of M(ω) since
  M(ω) ⊆ E and E = {state : P(A|P1(ω)) = p1 and P(A|P2(ω)) = p2}. Hence P(A | P1(ω))
  = p1 for all ω in M(ω), and similarly. Since M(ω) is a union of cells of each partition,
  by the law of total expectation, P(A | M(ω)) = p1 and = p2. Hence p1 = p2.


