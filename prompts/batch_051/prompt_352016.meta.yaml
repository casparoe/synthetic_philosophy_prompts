  Question:


  Explain the difference between semantic presupposition and entailment. Then explain
  the phenomenon of presupposition accommodation within David Lewis''s scorekeeping
  model of conversation, and discuss, with an example of your own, one case in which
  a presupposition is not accommodated and what that shows about the state of the
