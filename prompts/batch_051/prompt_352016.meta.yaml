  Student answer:


  An utterance presupposes a proposition when that proposition must be true, or at
  least must be taken to be true, for the utterance to have a truth value at all.
  An entailment is different: it is a proposition that must be true if the utterance
  is true, and its falsity makes the utterance false rather than merely unevaluable.
  For instance, the sentence "The present King of France is bald" presupposes the
  proposition that there is a present King of France, while the sentence "Jack has
  a sister" entails that Jack has a sibling. If the presupposition fails, the sentence
  is neither true nor false; if the entailment fails, the sentence is simply false.


  Accommodation comes in because speakers frequently say things whose presuppositions
  are not already part of what the conversational participants take for granted. Lewis''s
  scorekeeping model compares conversation to a game in which various parameters —
  including the set of presuppositions — make up a conversational score that is updated
  at every move. According to Lewis, when a speaker produces a sentence with a presupposition
  that is not part of the current score, the hearer accommodates by quietly adding
  that proposition to their own beliefs before the conversation continues, provided
  the hearer sees no particular objection. This is what allows speakers to say things
  like "Even John''s dog loves him" when it is not yet established that John has a
  dog; the hearer simply accepts it.


  Accommodation is blocked when the hearer does not believe the presupposed proposition.
  For example, if Alex says to Sam, "Have you stopped leaving your bicycle in the
  corridor?", the presupposition that Sam has been leaving the bicycle there is not
  accommodated if Sam does not accept it; Sam''s natural reply is "I never left it
  there in the first place." The failure of accommodation in this case shows that
  the conversational score has not changed in the way Alex''s move anticipated, and
  that Sam has instead challenged the presupposition.


