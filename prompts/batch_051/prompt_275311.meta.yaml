  I am preparing a short paper on the authority of advance directives and want an
  audit before I circulate it. My current view, as best I can state it:


  1. An advance directive made by a competent adult derives its binding force from
  respect for autonomy, and it should ordinarily be honoured even when the person,
  later demented, now expresses contrary wishes (for example, to go on living).

  2. The later self''s current wishes deserve a hearing, but they cannot by themselves
  repeal the earlier directive, because the later self lacks the kind of global, life-planning
  capacity that made the earlier choice an exercise of autonomy.

  3. A person is not a series of separate selves; he or she is a temporally extended
  whole, and the earlier competent self is the best spokesman for that whole when
  the whole lacks a unified present voice.

  4. Autonomy is valuable chiefly because it lets a person lead his or her life as
  a whole: the point of respecting an advance directive is not to satisfy a past preference
  but to respect the person''s own overall critical interests, which reach across
  time.

  5. Some people with mild-to-moderate dementia retain enough capacity for meaningful
  day-to-day decisions (what to eat, whom to see, what music to play), and we should
  respect those choices, even while holding them to the terms of the larger advance
  directive.

  6. A present, non-autonomous person''s strong and repeated expressions of a wish
  to live should sometimes outweigh a previously competent person''s contrary instruction
