  is quasi-emotion, part of a game of make-believe); Peter Lamarque and Stein Olsen''s
  thought theory (we respond to the thought of the character, not the character);
  Colin Radford''s view that our emotional responses to fiction are irrational/brute;
  Noël Carroll on horror etc. These are standard enough that LLMs know them.


