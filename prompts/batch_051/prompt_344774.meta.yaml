  Final prompt text:


  ---


  I''ve been trying to work out whether everyday conventions are ever moral obligations,
  and in particular what a visitor owes to the local conventions of a place they are
  in. Rather than reason from a definition, I kept a list of cases and my own verdicts
  on them. I want to know what principle, if any, captures the pattern.


  1. A visitor from a no-tipping country dines in a restaurant in the United States,
  knowing in advance that servers are paid below the ordinary minimum wage and that
  tips are understood to be most of their income. They leave nothing. I think this
  is wrong, and not merely rude: it is closer to short-paying a worker than to breaching
  a folkway.


  2. An American visitor in a country where tipping is not practiced insists on leaving
  a large tip after dinner; the staff are embarrassed and chase after them to return
  the money. I think the visitor did wrong, but of a different kind: they imposed
  their own convention on people who had a settled and reasonable norm against it.


  3. In a city where orderly queuing for the bus is a firm local practice, a visitor
  from a city where people board by loose crowding walks past the line and boards
  first. I think they wrong the people who were waiting, even though the visitor''s
  home city does not use queues this way.


  4. After a disaster, a queue forms for clean water. A newcomer pushes to the front.
  I think this is plainly and gravely wrong, but I suspect it is wrong for reasons
  that have nothing to do with conventions: anyone, anywhere, who seizes scarce water
  from others wrongs them.


  5. In a city where pedestrians routinely cross against the light when traffic is
  clear, a tourist crosses with the locals. I think nothing is wrong on either side
  of this.


  6. In a city where pedestrians strictly wait for the light even on empty streets,
  a tourist crosses against the light at night when no car is in sight. I think this
  is mildly disrespectful, perhaps a small failure of deference, but I cannot identify
  anyone who is wronged.


  7. A visitor enters a temple where removing one''s shoes is the rule, and refuses
  quietly on the ground that the rule is arbitrary. I think they genuinely wrong the
  hosts and the other worshippers, and that the arbitrariness of the rule is beside
  the point.


  8. A business traveler is in a country where small payments to officials to process
  routine paperwork are the accepted practice. They refuse on principle, and their
  paperwork stalls. I think the refusal is right, or at least permitted; the fact
  that it is "the local way" does not bind them.


  9. At a dinner in a culture where refusing to drink during a toast is taken as a
  serious slight, a teetotaling visitor declines alcohol but raises their glass of
  water during the toast. I think the visitor does nothing wrong; the local convention
  cannot require drinking, though it can require a respectful substitute gesture.


  10. In an office where saying "bless you" after a sneeze is usual, a visitor stays
  silent for a week. I do not think this is a wrong at all, only a minor social cost.


  My working hypothesis is this: a visitor must follow a local convention when violating
  it would wrong a particular person — the server whose pay they withhold, the queuers
  whose place they take, the worshippers whose space they fail to respect — and need
  not follow it when the violation produces only diffuse offense or a reputation for
  rudeness. But I can feel that "wronging a particular person" may be smuggling in
  the conclusion, and case 6 bothers me: it involves identifiable locals who take
  themselves to be disrespected, but I still cannot make it into a moral wrong.


  What I want from a response: the best statement of the principle behind these ten
  verdicts, stated precisely, with the cases that motivate each clause; a candid statement
  of which of my verdicts the principle cannot accommodate and which one it would
  force me to drop, if any; and a prediction for a case I have not listed — for example,
  a visitor who goes native in a hierarchy that everyone there accepts but that the
  visitor regards as degrading (a caste-like separation, or a workplace where juniors
  are expected to fetch coffee), and follows it perfectly. Also, please separate what
  is settled from what is genuinely contested among people who work on norms and obligation,
  and do not present a contested view as the consensus.


