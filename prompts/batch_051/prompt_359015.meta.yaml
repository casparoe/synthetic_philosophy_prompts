  Let me think about actual scholarly issues around FUL.


  Key debates:

  - What is a maxim? Level of generality (O''Neill: maxims should be tested at a general
  level; Korsgaard: the agent''s maxim with its full specificity can let too much
  through).

  - Contradiction in conception (CC) vs contradiction in the will (CW). CC for perfect
  duties, CW for imperfect duties. Some argue CW can''t yield genuine duties or is
  too weak.

  - The "false promising" derivation: universalizing false promising undermines trust/practice.
  But if maxim is specified narrowly ("whenever I am in financial distress and can
  get away with it and need money to repay gambling debts..."), does universalizing
  still yield a contradiction? The "acting on a maxim whose success depends on being
  an exception" issue.

  - The empty formalism objection (Hegel, Mill): FUL by itself can be made to yield
  anything depending on maxim specification.

  - Kant''s rigorism cases: lying to murderer, inquiring murderer.

  - The relationship between FUL and the Formula of Humanity (FH). Some think FUL
  and FH are equivalent; others think FUL is empty and FH does the work.

  - Wide duties and latitude: imperfect duties require adopting ends, not specific
  actions; no contradiction in a world where no one ever helps.


