  Potential prompt:


  "After a long argument with a friend about whether satisficing is genuinely distinct
  from optimizing, he left me with the following challenge. Herbert Simon''s early
  paper, ''Rational Choice and the Structure of the Environment'' (1956), contains
  the scissors metaphor: one blade is the structure of the task environment, the other
  the computational capacities of the agent, and the two cut together. That convinced
  me that a theory of rational choice should not ignore either side. But my friend
  reconstructed Simon''s own view as follows:


  (1) A bounded agent cannot maximize expected utility, so it sets an aspiration level
  and chooses the first option that meets it.

  (2) The aspiration level itself must be chosen. Either the agent chooses it by estimating
  the expected costs and benefits of further search, or it is set by some process
  that does not represent the agent''s reasons.

  (3) If the aspiration level is chosen by estimating expected costs and benefits
  of further search, then satisficing is just an implementation of expected utility
  maximization under computational constraints.

  (4) If it is set by some process that does not represent the agent''s reasons, then
  satisficing is not a normative account of rationality, merely a description of how
  agents happen to behave.

  (5) Therefore satisficing either collapses into optimizing or forfeits its claim
  to be a theory of rational choice.


