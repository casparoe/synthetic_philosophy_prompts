  Essay idea: "Approval-direction is just goal-direction with a social reward function;
  the real distinction is whether the reward function is inside or outside the head."
  Notes:

  - Argument 1: People who seem approval-directed (teachers'' pets, people-pleasers)
  have internalized the audience; they chase approval even when no one is watching,
  so their goal is a model of being approved, not actual approval.

  - Argument 2: Conversely, supposedly goal-directed behavior is shaped by imagined
  evaluators (one''s future self as audience), so goal and approval collapse.

  - Argument 3: The practical difference is robustness to distribution shift: an approval-directed
  agent will stop when the audience disappears; a goal-directed one won''t. But if
  the audience is internalized, it never disappears.

  - Argument 4: For LLMs trained with RLHF, the "audience" is a learned reward model
  that continues running in deployment, so they''re approval-directed toward a fixed
  internalized critic; this is closer to human superego than to sycophancy.

  - Tentative conclusion: use a two-axis scheme: (a) where the reward signal lives
  (external audience vs internal model), (b) what content it rewards. Approval-direction
  is an unstable compound, not a natural kind.

