  Now craft the summary of Meno with subtle errors. Let''s recall Meno''s actual content.


  In Plato''s Meno:

  - Meno asks whether virtue can be taught, or comes by practice, or nature, or some
  other way.

  - Socrates says he doesn''t know what virtue is at all; Meno tries definitions;
  gets refuted.

  - Meno raises the paradox: "How will you look for it, Socrates, when you do not
  know at all what it is? ... And if you should meet with it, how will you know that
  this is the thing you did not know?" Or known as Meno''s paradox / learner''s paradox
  / eristic paradox.

  - Socrates responds with theory of recollection: the soul is immortal, has learned
  everything, so inquiry is recollection. Demonstrates with slave boy and geometry
  (doubling square).

  - Then they examine whether virtue is teachable via hypothesis: if virtue is knowledge,
  it can be taught. Meno agrees knowledge is teachable.

  - They discuss true belief vs knowledge: true opinion is as good a guide to correct
  action as knowledge, for practical purposes, as long as it is right. The road to
  Larissa example: someone who has true opinion about the way will guide correctly
  just as well as someone who knows.

  - So why is knowledge prized more? Socrates: true opinions, as long as they remain,
  are fine and do all sorts of good; but they don''t remain long; they run away from
  the soul, unless tied down with reasoning about the explanation (aitias logismos).
  This is recollection. When tied down, they become knowledge, and are stable. Daedalus
  statues: if not fastened, they run away; if fastened, they stay.

  - Knowledge differs from right opinion in being tied down. Knowledge is more valuable?
  Socrates says in some sense knowledge is prized because it is stable/abiding; but
  he also says true opinion is no worse in guiding action. Some scholars read this
  as Plato failing to solve the value problem or noting that knowledge''s value is
  instrumental (stability), which doesn''t fully account for its greater value. Contemporary
  "value problem" from Meno: why is knowledge more valuable than true belief? Gettier
  complicates JTB.


