  Upper-level undergraduate philosophy of language, take-home exam. Total: 20 marks.


  Question. A search committee asks a referee, who is known to be candid, whether
  a candidate is a strong researcher. The referee writes:


  (1) "She keeps every office hour, returns exams within a week, and has never missed
  a department meeting."


  For another candidate, a different referee writes:


  (2) "Her research is unorthodox, but it is rigorous."


  For each of (1) and (2): state what the referee communicates but does not literally
  say, and explain how a Gricean hearer would recover it, making clear which maxims,
  if any, are exploited. Then say which of the two cases, if either, involves a conversational
  implicature, and which involves a conventional implicature, using cancellability
  and detachability to justify the classification. Finally, explain whether the distinction
  between what is said and what is implicated is by itself enough to account for what
  the committee understands in case (1), or whether a Gricean must also appeal to
  something else — and if so, what.


  Model answer. In (1) the referee''s literal content concerns only conscientiousness
  and collegiality... [etc.] The referee implicates that the candidate''s research
  is weak or at least that there is nothing positive to say about it. This is recovered
  by assuming the referee is cooperative: the committee needs an assessment of research;
  the referee supplies none; so the referee must intend the committee to infer that
  the withheld information is unfavorable — a particularized conversational implicature
  generated by flouting the first maxim of Quantity and the maxim of Relation. It
  is cancellable: the referee could add "...though I don''t mean to suggest her research
  is weak; I was asked only about her service." It is non-detachable: any way of saying
  the same thing (that she is diligent and punctual) in the same context would carry
  the same implicature.


  In (2) "but" contributes the same truth conditions as "and" — both conjuncts are
  asserted — but it conventionally signals a contrast between unorthodoxy and rigor
  (the expectation that unorthodox work is not rigorous). This is not derived from
  any maxim; it is part of the encoded meaning of the word. It cannot be cancelled
  without oddity: "Her research is unorthodox, but rigorous — though I mean no contrast
  between the two." It is detachable: substituting "and" for "but" removes the contrast
  while preserving what is said. So (1) is a conversational implicature; (2) is a
  conventional implicature.


  The what-is-said/implicated distinction is not by itself sufficient for case (1),
  for at least two reasons. First, the committee''s inference depends on the referee''s
  intention: if the referee lists these virtues naively, meaning no slight to the
  research, the committee may draw the inference but it would not be speaker meaning.
  Gricean speaker meaning requires the speaker to intend the audience to produce the
  response, and to intend the audience to recognize that intention. Second, the inference
  exploits mutual knowledge about the practice of reference letters — what the referee
  was expected to address and could have said — which is not encoded in the sentence.
  So the distinction needs to be supplemented by the notion of reflexive communicative
  intention and by background mutual knowledge.


  Marking scheme (20 marks total):

  1. (4 marks) Correctly identifies the implicated content in (1) and grounds it in
  the Cooperative Principle and the flouting of Quantity/Relation, rather than treating
  it as part of the sentence''s truth conditions. Common error: calling it an entailment
  or saying the referee "lies."

  2. (4 marks) Correctly identifies (2)''s conventional implicature and notes that
  "but" has the same truth conditions as "and." Common error: treating the contrast
  as part of what is said or as a conversational implicature.

  3. (4 marks) Correctly applies the tests: (1) cancellable and non-detachable; (2)
  non-cancellable and detachable; and draws the right classification. Common error:
  reversing the tests or saying all implicatures are cancellable.

  4. (4 marks) Explains why (1)''s inference is a piece of speaker meaning only if
  the referee intends it, with the recognition condition. Common error: identifying
  speaker meaning with whatever the hearer infers.

  5. (4 marks) Argues that background mutual knowledge about reference letters is
  needed to make the inference go through. Common error: saying the distinction is
  sufficient and ignoring context.


