  Definitions:

  - Acausal threat: a threat issued by an agent (or process) that the threatened action
  will occur whether or not the threatened agent complies, because the threatener''s
  decision does not causally depend on the victim''s decision (e.g., a precommitted
  simulation, or a future powerful AI that will punish those who didn''t help bring
  it about). Classic examples: Newcomb''s problem, Roko''s basilisk, acausal blackmail/trade.

  - Surrogate goals: goals that are proxies for another agent''s interests, possibly
  adopted acausally — e.g., helping an agent you can''t causally interact with because
  you expect they''d help you if the situation were reversed.


