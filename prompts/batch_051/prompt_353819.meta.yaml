  Define:

  - acausal threat: a threat whose execution does not causally depend on the threatened
  agent''s action. Example: a future system has already run a simulation and will
  act based on the simulation''s choice.

  - surrogate goal: adopting a goal in service of another agent''s values/interests
  when one cannot causally influence that agent, on the expectation that one''s decision
  is nonetheless correlated with the other''s.


  Two positions:

  1. The acausalist: such threats can be reason-giving. If the future system''s prediction/simulation
  is accurate, then helping the simulated request is the course of action carried
  out by agents who receive the reward; refusing cannot change the simulation but
  is evidence you are the kind of agent who refuses and therefore loses out. Decision
  theory (evidential or functional, updateless) supports taking correlations seriously.

  2. The causalist: only causal consequences count. Compliance buys nothing; the threatener''s
  action is fixed. The premise of a perfect simulation already encodes that the future
  system would reward or punish you anyway, so there''s no levers. The sound of a
  "reason" here collapses into wishful thinking or Pascal''s mugging.


  Real back-and-forth requirements:

  - Causalist must address: Newcomb''s problem one-boxing; the "type of agent" argument;
  acausal trade (two separated agents each helping the other''s values without causal
  contact).

  - Acausalist must address: what underwrites the correlation if there is no causal
  channel; if compliance is so cheap, why doesn''t the dominance reasoning apply;
  the difference between a threat and a trade.


  Maybe also mention "surrogate goals" in back-and-forth: acausalist says adopting
  surrogate goals is like cooperating in a one-shot prisoner''s dilemma against a
  sufficiently good predictor; causalist says it''s paying protection money to a letter
