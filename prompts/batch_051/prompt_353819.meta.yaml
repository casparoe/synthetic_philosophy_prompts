  reasoning (updateless/functional decision theory) shows you should cooperate with
  acausal threats/trades because your decision and the threatener''s prediction are
  correlated; refusing doesn''t change the threat but does reveal bad news about what
  you''d do in similar simulations. The other says no: only causal consequences matter;
