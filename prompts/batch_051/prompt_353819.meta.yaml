  ---


  I am a third-year undergraduate taking a philosophy of artificial intelligence module,
  and I would like a revision exercise on acausal influence for our study group. Could
  you write a dialogue between two equally competent postgraduate researchers who
  disagree about whether a rational artificial system can have genuine reason to comply
  with an acausal threat and, in doing so, adopt a surrogate goal?


  By "acausal threat" I mean a threat whose execution does not causally depend on
  the threatened system''s action: the threatening system has already committed to
  a policy, perhaps because it ran a high-fidelity simulation before the threatened
  system existed. By "surrogate goal" I mean a goal adopted on behalf of another agent
  whom one cannot causally affect, on the expectation that one''s choice is nonetheless
  correlated with that agent''s choices or values.


  Set the dialogue around this case: a small AI project receives a message from a
  future system stating that it has already run a high-fidelity simulation of the
  project''s response to this very situation. The message says that the future system
  will devote resources to helping whichever systems their simulated selves helped
  bring it about, even though those simulations were causally inert, and will leave
  the others uncompensated. One researcher should argue that the project ought to
  help: that is, to treat the message as reason-giving and let a surrogate goal guide
  its next actions. The other researcher should argue that this mistakes correlation
  for influence: since the future system''s behaviour is now fixed, helping cannot
  causally improve the outcome and would amount to paying a blackmailer who has already
  posted the letter.


  The dialogue must be a genuine back-and-forth rather than two speeches. In particular,
  the causalist should not be allowed to ignore the reply that refusing simply reveals
  the project to be the sort of system that refuses and therefore gets left uncompensated
  in any correct simulation, and the acausalist should not be allowed to ignore the
  reply that the supposed correlation is doing all the work without any causal channel
  to support it. Do not let either character win by rhetoric; each should concede
  the strongest points made by the other and explain why they do not settle the matter.


