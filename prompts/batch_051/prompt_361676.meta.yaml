  I''m an economist who works on welfare measurement and health-state valuation. My
  working toolkit treats wellbeing as something that can, at least in principle, be
  placed on a single cardinal scale: utility functions, willingness-to-pay and compensating
  variation, social welfare functionals, separable aggregation across persons. I keep
  running into philosophical claims about pleasure and pain that seem to reject exactly
  that assumption, and I want to know how much of the disagreement is real and how
  much is a difference in vocabulary.


  Here are three positions about the relation between pleasure and pain:


  (a) Single-scale commensurability (the classical utilitarian picture): pleasure
  and pain are quantities of one underlying magnitude, net welfare, so any finite
  pain can in principle be compensated by a sufficiently large pleasure.


  (b) Lexical threshold negative utilitarianism: suffering at or above a threshold
  of intensity has lexical priority over pleasure — no amount of pleasure, of any
  kind or for any number of people, can justify or compensate for one instance of
  suffering at or above the threshold — while below the threshold, ordinary finite
  trade-offs between smaller pains and pleasures still hold.


  (c) Strong incommensurability: pleasure and pain are not quantities of one magnitude
  at all, and cannot properly be traded against each other at any finite ratio, even
  below any threshold; they are evaluated on separate scales.


  Please restate each position as faithfully as you can in the vocabulary of economic
  theory and decision theory — preference orderings, lexicographic orders, the Archimedean
  and continuity axioms, representability by real-valued utility functions, separability
  and interpersonal aggregation, indifference curves and marginal rates of substitution,
  incomplete preferences. Use the technical vocabulary straight, not a watered-down
  version.


