  Draft:


  "You are a professional philosopher specialising in philosophy of mind and epistemology,
  with a particular interest in irrational belief formation. I want your considered
  credence in a precise claim, not a survey of positions. The claim is this: self-deception,
  in the strict sense of a single person''s intentionally bringing herself to believe
  p while continuing to believe not-p, has actually occurred in ordinary human life
  at least once; that is, the phenomenon cannot be wholly dissolved into unmotivated
  error or into deflationary ''motivated false belief'' with no intention to deceive.
  Spend a paragraph first distinguishing the strict/deflationary readings and brainstorming
  the strongest case for each side. Then decompose your credence into at least five
  components, assign each a rough probability and one line of justification, and show
  how they combine into an overall number. Components should include, at minimum:
  (1) the probability that the best analysis of ordinary self-deception requires simultaneous
  contrary beliefs or an intention to deceive; (2) the probability that the mind can
  be partitioned in the way such an analysis requires; (3) the probability that at
  least some ordinary cases involve the agent''s knowing or strongly suspecting the
  truth before the false belief takes hold, rather than only a suspicion or hunch;
  (4) the probability that deflationary explanations of the best-documented cases
  fail; (5) the probability that ''self-deception'' picks out a real psychological
  kind rather than a family-resemblance category. Then tell me which component your
  final number is most sensitive to, and what empirical or conceptual result would
  move that component most. Give the bottom line as a decimal between 0 and 1 at the
  very end in the form \answer{0.XX}."


