  Self-deception paradox: How can one person be both deceiver and deceived? Deceiving
  requires the deceiver to believe ~p and intentionally bring about belief p in the
  deceived. If deceiver = deceived, the person would have to believe both p and ~p,
  or intend to believe what they know false, which seems impossible or irrational.
  Yet we commonly say people are self-deceived.


  Responses:

  1. Intentionalist/homuncular/partitioning: the mind is divided into sub-systems
  or partitions, with one subsystem deceiving another; the "deceiving" subsystem knows
  ~p and brings about p in the conscious/deceived subsystem. Davidson: boundaries
  between parts of the mind; the deceiving part acts intentionally. Pears: motivated
  irrationality. This makes self-deception literally possible but only with a divided
  self.

  2. Deflationary (Mele): self-deception need not be intentional; it''s just a false
  belief formed through motivationally biased belief-formation (selective evidence-gathering,
  misremembering, charitable interpretation), while the agent''s evidence doesn''t
  support the belief. Mele argues agents can enter self-deception without intending
  to deceive themselves and without initially knowing the truth; he denies the standard
  paradox dissolves because there''s no need for simultaneous contradictory beliefs.
  So self-deception is possible but deflated: it''s a kind of motivated false belief.

  3. Strategy: maybe other accounts: Alfred Mele''s "self-deception unmasked" argues
  self-deception doesn''t require simultaneous contradiction. Others: Robert Audi?
  Mark Johnston? There''s "twisted self-deception" (believing p you wish false) which
  challenges desire-based accounts. Some argue self-deception is impossible in strict
  sense and ordinary talk is loose.


