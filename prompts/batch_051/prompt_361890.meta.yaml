  Prompt:


  I have spent the last few months as a newly elected member of a small municipal
  council, and one episode has unsettled me. To prevent a developer from suing the
  town into insolvency, I voted to approve a settlement in which the town publicly
  stated that a rejected permit had been incomplete on procedural grounds, even though
  we all knew the real reason was political pressure from an influential neighborhood
  group. In private life I would not accept that a person may write a knowingly false
  official statement to escape a costly conflict. But I found, and my fellow councillors
  found, that the public role changed the way we reasoned: the falsehood appeared
  justified by the office, yet I also felt it had stained me in a way that the same
  act would not have stained a private person if it had been plainly excused.


  That tension led me back to Chapter XV of The Prince, where Machiavelli argues that
  a ruler who takes it as his profession to be good in every matter will come to ruin
  among many who are not good, and that a prince who wishes to keep his state must
  therefore learn how not to be good and to use or not use that capacity as necessity
  dictates. I take the passage to be making a claim not only about effectiveness but
  about the status of the act: the ruler is not simply permitted to do what private
  persons may not do; he is in part constituted by that permission. The ordinary view
  he is rejecting seems to be that the moral law applies to rulers exactly as it applies
  to anyone else, and that a good end cannot clean an unclean instrument.


  The asymmetry I want you to examine is this. When a private citizen tells the same
  kind of official lie to avoid a comparable disaster, we tend to say either that
  it was wrong but excusable or that it was right all things considered; we rarely
  insist on both. But when an officeholder does it under color of office, many people
  say it was required by the office and that the officeholder is nonetheless rightly
  guilty. Is there a principle that generates that difference? The strongest candidate
  I can formulate is something like this: public office is a role with constitutive
  norms that require otherwise forbidden acts, and the officeholder voluntarily takes
  on a burden of wrongdoing for the community, so the wrongdoing remains real but
  the act may be required by the role. That is a version of the dirty hands thesis.
  But I am not sure it is more than a redescription. Test it against closer cases:
  a union negotiator who lies about a strike threat, a parent who falsifies a school
  district document to get a child into a safer school, a surgeon who coerces a detained
  patient into a necessary operation. Does the office-role principle mark a difference
  between any of these and my settlement vote, or does it collapse into the ordinary
  excuses of necessity and duress? I want an honest verdict on whether the asymmetry
  between the officeholder and the private agent is defensible, or whether it should
  be given up in favor of treating both with the same moral categories.


