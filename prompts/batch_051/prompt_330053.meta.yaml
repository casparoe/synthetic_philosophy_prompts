  Option prompt:


  I''m a software engineer at a company building symbolic computation tools. I keep
  hitting the same problem: we have a mathematical object that is defined only up
  to a symmetry — a root of a polynomial, a square root of -1, a branch of a logarithm
  — and our API has to return some concrete value or name, like an object labeled
  `root1` or a complex number. I want a procedure we can follow when deciding whether
  a computation is well-defined enough to expose in an API, and how to handle cases
  where the answer changes under relabeling. In Science and Hypothesis, Poincare has
  a passage where he argues that after you have called one of the two imaginary square
  roots i, every theorem remains true if you systematically swap i and -i; the names
  carry no individual content, only the relations do. Use that as the theoretical
  anchor. Please write a decision procedure for my team: the questions to ask in order
  before we ship a function or data type whose output is a mathematically non-unique
  choice; what counts as a sufficient answer to each; where the procedure stops with
  a no; where it hands the decision to a human because the issue is a mathematical
  convention rather than a bug; and how to document the residual symmetry. Then apply
  it to: returning the "positive" square root of a complex number, and enumerating
  the roots of a polynomial in a deterministic but arbitrary order. Include one application
  where the procedure tells us not to ship something we were about to ship. Keep it
  rigorous but usable for engineers who don''t know Galois theory.


