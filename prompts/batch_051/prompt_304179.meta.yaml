  ---


  I write historical novels, and I''ve been having a running argument with myself
  about how much causal credit to give to non-human things — germs, weather, volcanoes
  — in stories about political change. My gut calls on specific cases don''t obviously
  hang together, and I want to know what principle (if any) I''m actually using.


  My verdicts:


  1. A volcanic eruption that blackens the summer, kills the harvest, and sets off
  a bread riot: I''m comfortable making the volcano a major driver of the plot, but
  I resist giving it a "mood" or intentions. It''s an event with huge leverage, not
  a character.

  2. A plague that kills a third of the workforce and thereby shifts bargaining power...
  Fine as cause; I wouldn''t personify the plague, but I would let it reshape the
  whole social world.

  3. A drought that lets a landowner evict tenants and then style himself as a man
  of providence: I don''t think the drought causes his cruelty. The drought is fuel;
  the man''s choices are the fire.

  4. A sea storm that scatters an invasion fleet... comfortable giving the storm causal
  agency; in fact I think it would be dishonest to leave it out.

  5. A "great man" account of a revolution that never mentions harvest failures. I
  think it''s not just incomplete, it''s false—the weather matters as much as the
  key political figures.

  6. But when I read histories or novels that explain the entire course of a country
  by geography, climate, or disease, something in me revolts; I call it environmental
  determinism and I distrust the writer.


  So I want a principle that accounts for these: when is it right (in a serious historical
  narrative) to treat a non-human force as a historical actor or major cause, and
  where does it tip into environmental determinism or the pathetic fallacy? Which
