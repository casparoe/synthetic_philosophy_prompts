  Davidson "What Metaphors Mean" (1978) argues metaphors mean what their words, in
  their most literal interpretation, mean, and nothing more. He denies there is a
  special "metaphorical meaning" — a cognitive content the metaphor conveys besides
  literal meaning. What metaphors do is not a kind of meaning but a causal effect:
  "a metaphor makes us attend to some likeness" or "nudges us into noticing." He compares
  them to pictures, jokes, bumps on the head: they have effects but no propositional
  content. He says "Juliet is the sun" has only literal meaning; the sentence is false,
  but the metaphor is not thereby a failed communicative act, because the point isn''t
  to assert a truth but to make us see Juliet in a certain light. He allows that metaphors
  can "intimate" things, but intimation is not meaning. So a summary saying "he thinks
  metaphor is just false, nothing more to say" would be wrong; the correct gloss:
  metaphor has no special semantic content, but has a role in communication as a device
  for producing effects.


  Conceptual metaphor theory (Lakoff & Johnson): metaphors are not just language;
  they''re conceptual mappings (e.g., ARGUMENT IS WAR) that structure thought and
  understanding. The relation to Davidson: CMT would say metaphorical expressions
  are surface manifestations of underlying conceptual mappings; but do they claim
  "metaphorical meaning"? Lakoff and Johnson argue metaphor is a matter of thought
  and reasoning, not primarily language. They might say Davidson''s account misses
  that the reason metaphors work causally is because of preexisting conceptual structure.
  Some might say CMT assigns a kind of "cognitive meaning" — understanding one domain
  in terms of another — which is not sentence-level truth-conditional content. So
  a summary that says "Davidson says metaphor has no meaning, period, while Lakoff
  says it does" is an oversimplification. The prompt for type B could be a summary
  of Davidson specifically, or a comparison.


