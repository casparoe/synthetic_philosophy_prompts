  Dennett''s "Quining Qualia" argument against qualia: He targets four properties
  traditionally attributed to qualia: ineffable, intrinsic, private, directly/immediately
  apprehensible. He argues that these properties are incompatible or undermined by
  cases (Chase and Sanborn being the centerpiece: two coffee tasters at Maxwell House;
  both report that the taste of the coffee has changed — Chase says his taste buds
  have changed / the coffee tastes different now, Sanborn says his standards have
  changed / he now has a more refined judgment, but the tasting experience is the
  same. Dennett argues that introspective evidence can''t distinguish "the taste changed"
  from "my judgment about the taste changed" — memory of past qualia is unreliable;
  the idea of qualia as immediately apprehensible fails because whether Chase''s qualia
  have changed or only his judgment has changed is indistinguishable even to him.
  The boundary between the way things seem and how we judge them to be cannot be drawn;
  any claim that qualia are ineffable etc. is an artifact.)


