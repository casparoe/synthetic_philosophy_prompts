  - Denotational semantics: compositional meaning of a program as a mathematical object
  (typically a function from inputs to outputs, possibly in some domain).

  - Operational semantics: meaning as transitions/execution steps of an abstract machine.

  - Two programs can have the same denotation (compute the same I/O function) but
  different operational behavior (e.g., one sorts by mergesort, the other by bubble
  sort; same sorting function, different step counts, memory).

  - Observational/contextual equivalence: programs are equivalent when no program
  context (a surrounding program with a hole) can distinguish them via observable
  results of running the whole. This is extensional but sensitive to more than pure
  I/O function in effectful languages — e.g., for pure functional languages, observational
  equivalence often coincides with denotational equivalence (full abstraction!). Actually
  for PCF, contextual equivalence coincides with denotational equality for the standard
  domain model — that''s a full abstraction result (Milner, Plotkin). For languages
  with state/control, full abstraction is harder. Also side effects: two programs
  with same I/O might differ observably if they can be put in a context that detects
  their internal differences (e.g., timeouts if we include timing as an observation,
  or memory if the language exposes allocation). So the parallel is: by changing what
  counts as an "observation" or what "contexts" are allowed, you get different equivalence
  relations. This is a nice point: full abstraction shows that "inner" differences
  matter only if the language''s observations can reach them; otherwise the semantics
  ignores them.


