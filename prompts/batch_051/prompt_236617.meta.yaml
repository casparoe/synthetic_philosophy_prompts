  Let me check Good''s theorem conditions more carefully. Good (1967) "On the Principle
  of Total Evidence": the expected value of information is nonnegative for a Bayesian
  decision maker. The proof: Let V*(prior) = max_a E[u(a,s)]. After observing signal
  x, V*(posterior) = max_a E[u(a,s)|x]. Expected value of information = E_x[V*(posterior)]
  - V*(prior). Since choosing the ex ante optimal action after each signal would yield
  V*(prior), and conditional optimal actions can only do at least as well in each
  posterior, the difference is nonnegative. The key assumptions: (1) expected utility
  maximization, (2) a stable utility function over outcomes, (3) the set of feasible
  actions is unchanged by the information, (4) the information is costless and does
  not otherwise affect the world (e.g., observing it doesn''t change payoffs or others''
  behavior and is not known to others), and (5) the agent updates by conditioning
  / Bayes, and (6) a well-defined state space. If the act of receiving information
  changes the feasibility set or payoffs (e.g., must disclose condition), the theorem
  can fail. If preferences change, fail. If decision maker is non-Bayesian, can fail
  (e.g., ambiguity aversion? Actually with ambiguity, Ellsberg, information can hurt
  because hedging? There are cases where an ambiguity-averse agent may strictly prefer
  less information? I think under ambiguity aversion, more information can lower maxmin
  EU? There is a known result: with incomplete preferences/multiple priors, value
  of information can be negative. Also in strategic settings, information can hurt
  if others know you have it. Also with "indoctrination" etc.)


