  at the time, gets the answer wrong.

  2. The inside-view forecaster, using only information that was available at the
  time and a causal story about the institutions/economy/geography, gets it right.

  3. The outside view''s failure must not come from the reference class being obviously
  bad, small, or cherry-picked; it should be a reference class that a thoughtful outside-viewer
  would have chosen, with a clear base rate, and the base rate must push toward the
  wrong answer.

