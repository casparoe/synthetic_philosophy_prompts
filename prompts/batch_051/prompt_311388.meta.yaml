  ---


  You''re an expert on forecasting, especially outside view / reference-class reasoning,
  and you know a fair bit about why states and empires actually collapse. I need a
  thought experiment built to order for a paper I''m writing, so don''t just give
  a stock example — I want you to start by brainstorming three or four candidate polities
  (real or invented, but realistic), then pick the one that fits my constraints best
  and develop it.


  The paper is trying to show that the authority of the outside view depends on a
  usually-ignored feature: whether the reference class is homogeneous with respect
  to the mechanism that really drives the outcome. So I need the cleanest possible
  case where the outside view gets a big forecast wrong and the inside view gets it
  right, without the inside view just being lucky.


  Here are the specs.


  At some point in the past (you pick), a decision-maker faces a forecasting question:
  will their polity survive the next, say, 40 years, or avoid a specific failure mode
  (breakup, conquest, state collapse, etc.). Construct the case so that:


  - An outside-view forecaster uses a reference class of similar polities and derives
  a base rate that is high for the failure mode — high enough that the outside-view
  answer is clearly "yes it fails."

  - An inside-view forecaster, using only information available at the time, comes
  to the opposite conclusion.

  - Crucially, the outside-view forecaster''s reference class has to be the one a
  smart person would actually have chosen at the time. No obviously bad, tiny, or
  cherry-picked classes. The base rate should be forceful.

  - The inside view''s success can''t require hindsight or private information. Name
  the specific contemporaneous facts and the causal story that a good analyst could
  have used.


  After you give the scenario, walk me through it. What was the exact reference class
  and its base rate? What was the inside-view causal story? Which feature of the case
  does the real work — that is, which feature makes the reference class misleading
  even though it looked right? If you removed that single feature, would the outside
  view have won? And finally, be a hostile critic for me: what would a committed outside-view
  theorist say to explain away this case, and how would you revise the case to survive
  that attack without cheating (no hindsight, no freak accidents, no making the reference
  class unreasonable)?


  Also, please make the outside view''s failure interesting. Don''t make it fail because
  of an unforeseeable earthquake, assassination, or meteor. The break in the analogy
  should be something visible in advance but easy to miss.


