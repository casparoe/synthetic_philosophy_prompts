  underdetermined: whether several different accounts of concepts could all license
  exactly the same definitional choices, so that the practice by itself settles less
  than it appears to. Finally, if someone held the contrary view, that a concept is
  whatever its motivating examples had in common and that a definition extending past
  them simply changes the subject, what would have to change about the practice to
  make it consistent with that view — and would the resulting activity still look
  like mathematics?


