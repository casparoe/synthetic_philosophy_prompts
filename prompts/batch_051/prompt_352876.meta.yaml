  I have been trying to work out why mathematicians choose their definitions the way
  they do, and I keep running into something that seems, from the outside, philosophically
  strange. I want to describe the practice as I understand it and ask what picture
  of concepts, meaning, or discovery it commits someone to.


  Consider continuity. The earliest workable version says a function is continuous
  when small changes in the input produce small changes in the output; this depends
  on having a notion of distance. The standard modern definition, as I understand
  it, says a function between two spaces is continuous when the preimage of every
  open set is open. No distance appears in it, and it applies to spaces where talk
  of small changes makes no literal sense. Mathematicians seem to prefer the second
  definition not because it matches the original idea better, but because it generalizes
  the original idea to a level where the important theorems become true in the widest
  setting.


  The same pattern shows up in the definition of a group. A group is not defined as
  "the symmetries of some object," even though that is where the idea came from. Instead
  it is defined by a short list of axioms about a set and an operation, and that definition
  admits the one-element group and other structures nobody would have arrived at by
  collecting symmetries. The boundary cases seem to be treated as evidence that the
  definition is on the right track, not as embarrassment for it. Definitions are routinely
  arranged so that trivial or degenerate cases count: the empty set is a subset, the
  zero vector space is a vector space, the one-point space is connected, and so on.
  When a definition fails to behave well under a natural operation—building products,
  forming subobjects, taking limits—mathematicians usually repair the definition rather
  than accept that the operation works only sometimes.


  I have also noticed that mathematicians talk about definitions as "right" or "wrong"
  in a way that is not simply about convenience. A definition may be easy to compute
  with and still be judged not the right notion, because it sits at the wrong level
  of generality, because it draws a line through something that later proves to be
  one phenomenon, or because it does not get the boundary cases right. A definition
  may also be accepted even when nearly all the clean examples it covers look unlike
  the original examples, provided it fits neatly with nearby definitions and survives
  standard constructions.


  My question is what philosophical commitments this practice presupposes. What kind
  of thing would a general notion have to be for extending a definition beyond its
  original examples to be a way of revealing the right notion rather than changing
  the subject? Does the practice presuppose that mathematical concepts are objective
  enough to be tracked by definitions, or merely that some stipulations are more fruitful
  than others? Does it rule out the view that a concept is fixed by what people originally
  meant by the word? Are its commitments consistent — can a boundary case be treated
  both as included by convention and as required by the thing itself? And how much
