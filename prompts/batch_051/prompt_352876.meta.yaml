  I''ve been trying to understand something about how mathematicians choose their
  definitions, and it keeps striking me as philosophically strange, so I want to lay
  out the practice as I see it and ask what picture of concepts it commits someone
  to.


  Take continuity. For a long time, a function was thought of as continuous if you
  could draw it without lifting the pen, or more precisely if small changes in the
  input produced small changes in the output. That epsilon-delta picture works wherever
  there is a notion of distance. But the definition that became standard in topology
  doesn''t mention distance at all: a function between spaces is continuous if the
  preimage of every open set is open. As I understand it, this definition was preferred
  even though it lets in functions whose behavior doesn''t match the pencil test,
  and it applies to spaces where the pencil test makes no sense. The stated reason
  for preferring it is not that it better matches our prior idea of continuity, but
  that it makes a large body of statements true in general and only needs the structure
  of open sets.


  The same pattern appears elsewhere. A group is not defined as "the symmetries of
  some object," even though that is where the idea came from; it is defined by a few
  axioms about a set and an operation. That definition includes the one-element group
  and structures that aren''t symmetries of anything one would have started with,
  and mathematicians seem to regard this as a feature rather than a defect. Definitions
  are often set up so that boundary cases count rather than being excluded: the empty
  set is a subset of every set, the zero vector space counts as a vector space, the
  one-point space counts as connected, and so on. When a definition doesn''t behave
  well under a natural operation — taking products, forming subobjects, passing to
  limits — mathematicians tend to adjust the definition rather than accept that the
  operation only works sometimes.


  I''ve also noticed that mathematicians talk about definitions being "right" or "wrong"
  in a way that isn''t just about usefulness. A definition can be perfectly useful
  for a calculation but still be regarded as not the right notion, because it doesn''t
  place the concept at the level of generality where the important theorems live,
  or because it splits a phenomenon that later turns out to be one thing. And a definition
  can be accepted even when most concrete examples one can picture look quite different
  from the original motivating examples, as long as it gets the boundary cases right
  and fits cleanly with neighboring definitions.


  What I want to know is what view of concepts a person is quietly committed to if
  they take this practice at face value. Specifically: what would a general notion
  have to be like, such that expanding a definition past its original examples could
  reveal the "right" notion rather than just change the subject? Does the practice
  presuppose that mathematical concepts are discovered and that definitions try to
  track them, or that definitions are partly stipulated and the question is which
  stipulation pays off? Does it rule out the idea that a concept just is whatever
  people originally meant by the word? And are these commitments consistent with each
  other — for example, can boundary cases be both "included by convention" and "required
  by the thing itself"? I''d also like to know where the practice genuinely underdetermines
  the philosophy: are there rival accounts of concepts under which all of this would
  look exactly the same, so that the practice doesn''t by itself settle whether concepts
  are mind-independent?


