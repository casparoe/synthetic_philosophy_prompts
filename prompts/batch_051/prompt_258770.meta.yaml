  Fitch''s paradox: Knowability principle: for all p, if p then ◇Kp (every truth is
  knowable). Then via Fitch''s derivation, it implies for all p, if p then Kp (every
  truth is known). The standard "Church-Fitch" argument: assume p is an unknown truth:
  p ∧ ¬Kp. By knowability, ◇K(p ∧ ¬Kp). Knowledge distributes over conjunction: K(p
  ∧ ¬Kp) implies Kp ∧ K¬Kp. K¬Kp implies ¬Kp (knowledge is factive). So Kp ∧ ¬Kp,
  contradiction. Thus no unknown truths; every truth is known. This is valid in normal
  modal logic with factivity and distribution.


