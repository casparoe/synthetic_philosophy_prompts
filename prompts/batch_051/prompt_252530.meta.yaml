  Color phi: In the color phi phenomenon, two dots flash in succession at different
  positions and colors (e.g., red then green), and subjects report seeing a single
  moving dot that changes color midway. The question: when did you consciously experience
  the color change? If the second dot''s color is "projected backwards" into the perceived
  trajectory before the second flash occurs, then your experience of the change would
  have to be retrospectively revised (Stalinesque: you never consciously experienced
  the true sequence, an edited version was shown after a delay; Orwellian: you did
  experience the true sequence but memory was revised afterward). Dennett uses this
  to argue against a "Cartesian Theater" where there''s a fact about the timing of
  conscious experience; rather the whole question of "when" may be a confusion.


