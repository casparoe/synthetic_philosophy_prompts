  The domain: rigid designators and the necessary a posteriori. Key ideas: A rigid
  designator designates the same object in all possible worlds where it exists. Identity
  statements between rigid designators, if true, are necessarily true. Yet we can
  discover them empirically (a posteriori). Example: Hesperus = Phosphorus, water
  = H2O. The apparent paradox: if necessarily true, why does it take empirical investigation
  to know? Because the necessity is metaphysical; epistemic status (a posteriori)
  is about how we come to know, not the modal status. The argument could trade on
  conflating "could have turned out otherwise" (epistemic possibility) with "could
  have been false" (metaphysical possibility).


