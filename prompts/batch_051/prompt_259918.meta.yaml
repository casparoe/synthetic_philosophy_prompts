  I''m a philosophy professor who works mostly on applied ethics, and I''ve ended
  up on the bioethics advisory panel of a private research foundation that funds "bold"
  biomedical interventions. The proposals we now get are increasingly framed in terms
  of the hedonistic imperative: roughly, the view that suffering is a biological bug
  rather than an ineliminable part of a meaningful life, and that we should use biotechnology
  — genetic edits, neural implants, designer drugs, animal modifications — to phase
  out (or at least drastically shrink) the felt badness in the world. I''m broadly
  sympathetic to the idea, which is why I''m on the panel, but right now we are making
  ad hoc calls on each proposal and the inconsistency is starting to show.


  I need you to turn the hedonistic imperative into a decision procedure my panel
  can actually run on a proposal. We meet every quarter, we get maybe a dozen proposals
  a cycle, and each one gets about 20 minutes of discussion before we vote whether
  to move it to full review. The board has final sign-off, but they mostly follow
  our recommendation. The stakes are high: we''re talking about irreversible or semi-irreversible
  changes to nervous systems, sometimes in people who can''t consent, sometimes in
  non-human animals, sometimes at population scale. The people on the panel are not
  all philosophers — two clinicians, a neuroscientist, a lawyer, a disability-rights
  advocate — so the procedure has to be usable by someone who hasn''t read the theory,
