  Etiological vs. causal-role accounts of biological function.


  Core:

  - Causal-role (or systemic capacity) accounts: function of an item is whatever causal
  role it plays in a system that the analyst picks out; e.g., Robert Cummins. Functions
  are capacities/effects relative to an explanatory interest.

  - Etiological (selected effects) accounts: function of a trait is the effect for
  which it was selected in the past, i.e., why it evolved/why it''s there. Ruth Millikan,
  Karen Neander, Larry Wright (though Wright''s is "consequence etiology" — function
  is a consequence that explains why the thing is there). Wright''s account: X''s
  function is Z iff (i) X is there because it does Z and (ii) Z is a consequence of
  X''s being there. Selected effects is a refinement: functions are effects that increased
  fitness in ancestors and were selected for.

  - Distinguish: For causal-role, a novel trait can have a function; function is present,
  not historical. For etiological, novel mutations that happen to be useful have no
  function yet; function requires selection history.

  - Casper the friendly ghost? Swampman: an accidental molecule-for-molecule duplicate
  of a human has no functions on etiological account because it has no selection history,
  but causal-role accounts assign functions. Heart pumping blood: both accounts agree.
  Heart making thumping sounds: causal-role can count as a function relative to a
  system; etiological says not the function unless selected for it.

  - Vestigial organs: etiological accounts face issue — an organ whose selected effect
  no longer obtains; does it still have function? Neander distinguishes function (what
  it was selected for) from what it does now. Causal-role says if it plays no role
  now, no function.

  - Dysfunction: etiological can explain malfunction — organ has function F but fails
  to perform; causal-role accounts have trouble with dysfunction because if it''s
  not performing a role, no function, so "malfunctioning heart" is hard. But causal-role
  can say it fails to perform the role typical of hearts in the system.

  - Novel beneficial traits, exaptations/co-optations (feathers first for thermoregulation
  then flight): etiological says feather function is thermoregulation (selected for),
  not flight (later co-opted) — though some say co-opted functions can be acquired.
  Causal-role can say flight is a function now.


