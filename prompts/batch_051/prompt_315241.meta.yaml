  I''ve been working through John Milton''s Paradise Lost alongside some readings
  on the so-called problem of evil, and I keep getting stuck on the same passage in
  Book III. After the Father sees Satan winging toward the new world, he delivers
  a long speech to the Son in which he insists that neither his foreknowledge nor
  his decrees make him responsible for the fall of the rebel angels or of mankind.
  The passage I have in mind is around lines 95–134:


  [quote lines 95-134]


  My difficulty is this. Milton''s God seems to offer an account of how evil could
  arise within a creation that is both wholly good and made by a good creator: the
  creatures were created "sufficient to have stood, though free to fall," and their
  freedom is supposed to be what makes their sin genuinely theirs. But I can''t tell
  whether this is an explanation or just an elegant restatement of the problem. Specifically,
  I''d like help with three things, or however many are usable. (1) What exactly is
  the argumentative force of the rhetorical questions in lines 102–111 about praise,
  obedience, and necessity — what is God trying to rule out when he says a not-free
  creature couldn''t give proof of "true allegiance"? (2) The lines on foreknowledge
  (especially "if I foreknew, / Foreknowledge had no influence on their fault, / Which
  had no less proved certain unforeknown") are doing a lot of work; how should I understand
  the distinction between foreknowledge making something certain and foreknowledge
  causing or compelling it, as Milton uses it here? (3) When God says the first sort
  (Satan and the rebel angels) "self-tempted, self-deprav''d" fell and that "they
  themselves ordain''d their fall," is Milton presupposing the very thing at issue
  — namely, that a perfectly good will could choose evil without any prior defect
  or temptation to explain the choice? I''m not asking for a verdict on Milton''s
  theology from the outside so much as for help seeing what this passage is actually
  arguing and whether it fits together as an account of Satan''s fall.


