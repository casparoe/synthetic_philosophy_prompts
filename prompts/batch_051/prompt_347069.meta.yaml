  Let''s outline argument:


  (1) A singular probability statement—e.g., "The probability that S will recover
  is 0.8"—is true only if there is a correct reference class for S.

  (2) Every event or individual belongs to indefinitely many reference classes: smoker,
  male, age 50, age 50–60, smoker with this mutation, etc.

  (3) Different equally legitimate reference classes can yield different probabilities
  for the same event.

  (4) If there is a correct reference class, it must be specified by the rules governing
  singular probability, but any proposed rule either is empty, appeals to totality
  of evidence, or selects arbitrarily.

  (5) No non-arbitrary rule can select a unique correct reference class.

  (6) Therefore no singular probability statement is true.

  (7) But clinicians, actuaries, and courts make such statements, and some clearly
