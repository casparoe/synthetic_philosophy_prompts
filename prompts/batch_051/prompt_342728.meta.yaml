  Prompt draft:


  "I have been thinking about Bongard problems — those little puzzles in which you
  are shown six boxes on the left and six on the right, and you must state the rule
  that separates them; the left boxes all satisfy some hidden property (say, ''contains
  one large triangle'') while the right boxes all violate it (say, ''contains no large
  triangle''), and the examples are chosen so that many simpler rules fail. I have
  worked out what I call the ''first unrefuted invariance'' theory. The idea is this:
  a learner facing a few positive and negative examples generates a partial ordering
  of candidate invariances by their ''cost'' (roughly, how much structure in the examples
  the learner would have to commit to in order to state the invariance). A candidate
  invariance is unrefuted if it holds for all the positive examples so far and fails
  for every negative example so far. The theory says: at any moment, the concept a
  thinker should hold is not a single rule but the frontier of the cheapest unrefuted
  invariances; the thinker ''has'' the concept only in the sense of holding this frontier,
  and learning a new Bongard problem is the process of eliminating the cheapest invariance
  that the next example refutes, exactly as in competitive elimination. I like the
  theory because it predicts characteristic mistakes (e.g., a learner who has only
  seen one triangle-containing box will overgeneralize to ''left contains a triangle''
  and only replace it when a triangle appears on the right, at which point the next
  cheap invariance takes over), and it also predicts that someone who cannot articulate
  the rule may still solve new examples correctly, because she may be acting on a
  frontier rather than an explicit formula.


