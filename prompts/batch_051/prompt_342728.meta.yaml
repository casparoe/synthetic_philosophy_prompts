  Draft:


  "I have been spending my spare time on Bongard problems — the little two-panel puzzles
  in which six boxes on the left and six on the right are separated by some hidden
  rule, and the solver has to induce the rule from the examples alone. I have convinced
  myself that the standard story about what is going on, on which the solver weighs
  and tests one rule at a time, is wrong. Instead, I have a theory I call First Unrefuted
  Invariance. Here is the core of it. When a learner has seen only some of the relevant
  examples, there are always many candidate rules that currently separate the positives
  from the negatives. I call a candidate an invariance when it picks out something
  that all the positives so far share and that all the negatives so far lack; the
  examples are never rich enough to leave only one such rule, so the learner is always,
  implicitly, holding a crowd of them. These candidates can be ranked by how much
  structure they commit the learner to — roughly, how much of the observed arrangement
  the rule has to build into itself in order to be stated. The central claim of First
  Unrefuted Invariance is that a thinker does not actually possess a single concept
  at a time, but instead possesses the frontier of the cheapest currently unrefuted
  rules: her explicit guess is whatever rule is currently cheapest, while her recognitional
  behavior on new cases is governed by where the rules on the frontier agree and disagree.
  Learning is therefore not confirmation or strengthening; it is just the serial execution
  of cheap rules by the next example, with a new cheap rule stepping forward each
  time the old one is shot down. The theory makes a few predictions I like. A solver
  who has seen only part of a Bongard problem should overgeneralize exactly along
  the cheapest line that has not yet been refuted, and her mistake should be predictable
  from cost alone rather than from similarity. It should also be possible for someone
  to be unable to state the hidden rule while still classifying new examples correctly,
  because the frontier can agree in practice even when its cheapest member is not
  the true rule. There is also an elegant prediction about the order in which wrong
  rules are tried, and about the particular point at which ''insight'' should occur:
  insight is nothing but the loudest collapse of a frontier when a very cheap rule
  is refuted.


