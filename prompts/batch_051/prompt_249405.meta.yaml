  Moral particularism (Jonathan Dancy, "Moral Reasons" 1993, "Ethics Without Principles"
  2004) denies that morality is governed by principles. Arguments:


  1. The argument from the holism of reasons: a consideration that counts in favor
  in one context can count against in another, or be a reason in one case but not
  another (e.g., pleasure in the context of sadistic enjoyment; "that it was a lie"
  counts against, but maybe in a game counts in favor?). Since reasons function holistically,
  no stable atomistic general principles can capture them.


  2. The argument from uncodifiability / the "no useful moral principles" argument:
  a moral principle stated exceptionlessly is vulnerable to counterexample; but with
  exceptions encoded it becomes too complex and ultimately ad hoc; the only true "principles"
  are ones like "do what is right" which are empty. So generalism faces a dilemma:
  usable principles are false, true principles are useless.


  3. The argument from the nature of moral judgment as a capacity/perception: competent
  moral judges discern what to do without subsuming the case under a rule; principles
  are unnecessary for moral knowledge. This is more epistemological.


  4. The argument from the shapelessness of the moral (against a generalist assumption):
  there is no shape/common non-moral property shared by all right actions; "rightness"
  is not a property that supervenes on a specifiable set of natural features in a
  projectible way. Actually shapelessness is an argument that moral concepts aren''t
  reducible/that there is no finite set, used by particularists.


  5. The argument from the possibility of moral conflict and the need for judgment:
  principles conflict (don''t lie vs. prevent harm) and no higher-order principle
  can resolve conflict; at some point judgment without principle is needed, so principles
  are not bedrock.


  6. The argument from moral regret/remainder? Not exactly.


