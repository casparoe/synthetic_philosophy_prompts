  primarily for their physical attractiveness, wealth, or social status. What could
  justify this asymmetry?


  Candidate justifications:

  1. Character vs. appearance: character is "who the person is" while looks are "what
  they have." But humor and intelligence are also partly brute gifts (genetic, luck),
  and people''s personalities change; so the distinction is not clean.

  2. Agential/voluntary: you can be praised/blamed for kindness because it involves
  choice, whereas you can''t choose your face. But much of kindness is temperament,
  and wit is largely natural.

  3. Relation to the lover: kindness/wit make the relationship good for you in a way
  that involves the other''s agency toward you; looks/money are "goods" that happen
  to be attached but don''t constitute how they relate to you. But being loved for
  wit is being loved for the effect wit has on you (amusement), which is also rather
  passive.

  4. Fragility/stability: looks and money are more fragile/coincidental, so a love
  based on them is less secure? But kindness can vanish with depression, wit with
  aging/dementia.

  5. Moral worth: kindness is a moral quality, while beauty/wealth are not; but humor/creativity
  aren''t moral either.

  6. The beloved''s own perspective: We want to be loved for features we identify
  with, not features that feel like accidents. But people also identify with their
  beauty; and many identify with achievements that others see as status.

