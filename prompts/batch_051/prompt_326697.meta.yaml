  attraction to beauty/wealth because those are lower-status grounds, while valorizing
  attraction to wit/intellect because the judge shares those valuations. Or maybe
  it tracks something real about fungibility: if someone loves you for your wit, and
  someone wittier comes along, they have just as much reason to switch. So our preference
