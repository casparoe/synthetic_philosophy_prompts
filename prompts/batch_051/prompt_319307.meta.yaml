  The species problem: Are species real? If so, what kind of thing? Main positions:

  - Species are natural kinds (classes): organisms are members of species; species
  have essential properties, laws of nature apply; species are universals.

  - Species are individuals (Ghiselin, Hull): a species is a particular entity, a
  historical individual, a spatiotemporally continuous lineage, with organisms as
  parts not members. Not classes; names are proper names; no necessary/defining traits;
  species can change; they have origins and extinctions; integration via gene flow,
  etc.

  - Species as sets/classes, pluralism, conventionalism.


