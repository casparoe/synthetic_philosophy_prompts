  Let''s write the summary about epistemic testimony: reductionism vs anti-reductionism.


  Key accurate points:

  - Reductionism: testimonial justification is reducible to other sources: perception,
  memory, inference/induction; e.g., Hume: we trust testimony because experience of
  regular connection between reports and facts.

  - Anti-reductionism (Reid): testimony is a basic source of justification, like perception;
  default entitlement to believe unless defeated; children acquire knowledge from
  testimony without needing inductive track record.


  Subtle misrepresentations to plant:

  1. Present reductionism as requiring each hearer to have checked a speaker''s reliability
  for that occasion before believing — conflating global vs local reductionism. Global
  reductionism requires background inductive support in general; local requires specific
  reasons. Many reductionists reject local.

  2. Present anti-reductionism as saying testimony is infallible or "always believe
  unless proven a liar" — actually default entitlement, defeasible, not infallible.
  Also "presumption of truth" perhaps overstates: anti-reductionism says positive
  status absent defeaters, not that one must believe.

  3. Maybe conflate "testimony" as evidence with "assertion" as speech act.

  4. Could include a standard objection presented as refutation: "the child-objection
  refutes reductionism because children can''t run reliability checks" — but reductionists
  reply with subpersonal/inherited induction or developmental story. So not strictly
  refutation.


