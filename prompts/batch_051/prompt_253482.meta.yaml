  growth will almost surely outperform in the long run, and this isn''t just one arbitrary
  utility function among many, but has a special status because of ergodicity/time
  averaging. Also the standard objection (Samuelson''s): for a single-period decision
  with a non-log utility function, Kelly is wrong; maximizing log is only normative
  if you actually have log utility; "long-run" arguments subtly change the setup.


  Translate into RL vocabulary: an agent in an episodic environment with stochastic
  multiplicative reward, state is wealth at time t, action is fraction of wealth to
  stake, reward is growth rate log(W_{t+1}/W_t) (or actual wealth?). Kelly policy
  equals the policy that maximizes expected per-timestep log reward = expected growth
  rate. The Samuelson objection translates: if your reward is wealth (or CRRA utility),
  the Kelly policy is suboptimal; the choice of reward function is the goal, not something
  the environment determines. Long-run almost-sure dominance doesn''t translate to
  expected-return objective; it corresponds to optimizing mean log return, i.e., a
  different reward function. Variance adjustments / exploration in RL (e.g., controlling
  variance of returns) have some resonance.


