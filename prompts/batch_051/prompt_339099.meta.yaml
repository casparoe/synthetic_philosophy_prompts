  I''m part of a small team building a bank''s fraud-detection system, and we have
  to choose between two versions of the same model. Version A is right 96% of the
  time on our held-out data, but no one can say, in any particular case, what drove
  its decision; the best we can do is point to a weighted combination of several hundred
  weak signals. Version B is right 91% of the time and always emits a short plain-language
  reason for each decision — for example, "the account''s activity pattern changed
  suddenly after a long dormant period, and the recipient bank is in a high-risk jurisdiction."
  My co-founder wants to ship Version A. His argument is that the bank needs the most
  accurate decision available, not the most agreeable one, and that my preference
  for explanations is aesthetic: a plausible-sounding reason attached to a wrong answer
  is no better than a wrong answer, and neither explanation nor understanding changes
  whether any given transaction was actually fraud. I feel he is missing something,
  but I keep failing to say what it is.


  There is also a complication. When we tried to close the accuracy gap by training
  Version B on more data, its accuracy rose to about 93.5%, but we discovered that
  its plain-language reasons no longer tracked what the model actually responded to.
  Changing a feature mentioned in the reason often left the decision unchanged, while
  changing a feature the reason never mentioned could flip it. The reasons still read
  well; they just do not correspond to what is doing the work. My co-founder says
  this settles it: the reasons are cosmetic, so sacrificing two points of accuracy
  for them is irrational. I find myself retreating to the line that we should be able
  to understand our own system, and he replies that "understandable" is doing no real
  work beyond "soothing."


  Help me figure out what, if anything, is wrong with his position, and what I should
  actually do.


