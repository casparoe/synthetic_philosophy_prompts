  the first 5% of all humans is 5%. So if N > r/0.05 = 20r, then r < 0.05 N, so being
  at rank r puts you in the first 5% — which is unusual. So you can be 95% confident
  N ≤ 20r. Since r ≈ 100 billion for you, N ≤ 2 trillion with 95% confidence. So doomsday
  sooner than expected.


