  In the Philosophy of Right (1821), Hegel treats war as an integral moment in the
  ethical life of nations rather than as a mere breakdown of the human order. Sovereign
  states answer to no common earthly judge, so their disputes are at the last resolved
  by war, and the claims of peoples and their governing principles are finally passed
  upon in the tribunal of world history. War also performs, in his account, a positive
  ethical function inside the state: it breaks the pull of private property, commerce,
  and comfort, makes present to citizens the fact that the political whole is their
  highest end, and guards a people against the stagnation and inner corruption that
  he thinks a prolonged or perpetual peace would bring. He accordingly regards modern
  war as more humane than ancient war in one specific respect—it is waged between
  states as such rather than against private persons, families, and the ordinary life
  of civil society. And the state is not, for him, a mere instrument for securing
  individual rights; it is the actuality of ethical life, an end in itself, and it
  is through membership in it that individual freedom first becomes concrete and real.


  Hegel never encountered, however, the contemporary practice known as humanitarian
  intervention: the use of military force by outside powers inside another sovereign
  state, ostensibly to halt genocide, mass atrocity, or ethnic cleansing, and justified
  in the name of universal human rights rather than self-defense or plain national
  interest. In its most codified form, the Responsibility to Protect doctrine, sovereignty
  is treated as conditional: a state that fails to protect its own population from
  mass atrocity is said to forfeit the shield that sovereignty normally provides.


