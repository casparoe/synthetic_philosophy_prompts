  asserting its own interest under a moral guise, or as a sign that the defending
  state has lost substantial ethical life. But perhaps he''d see the advancement of
  freedom through world history.

  - Nuclear deterrence / mutually assured destruction: war as total annihilation;
  no longer a test of ethical health since it could destroy civil society utterly.
  Hegel''s claim that war has a rational ethical moment depends on it being limited
  and survivable. Would he still defend it? Maybe he''d say nuclear war is meaningless
