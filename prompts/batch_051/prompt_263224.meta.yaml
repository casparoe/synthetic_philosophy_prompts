  a prolonged calm, so also corruption in nations would be a product of prolonged,
  let alone ''perpetual'', peace"). I recall the phrase about winds and sea — but
  I must not quote from memory. I can paraphrase without quotation marks if I don''t
  retrieve. So I''d paraphrase: he compared war''s preservative function to the wind
  keeping the sea from stagnation. But if I put anything in quotes, I must fetch.
  I can just paraphrase.


  - War actualizes the state''s unity and citizens'' willingness to sacrifice for
  the ethical whole; it reveals the priority of the universal over particular interests.

  - War is not waged against persons as such but against the state as a whole; civilians,
  family life should be spared as much as possible (he praised modern warfare for
  being more "humane" than ancient).

  - World history is the world''s court of judgment; the "spirit" of a people may
  be superseded; war can be the means by which the universal world spirit advances.

