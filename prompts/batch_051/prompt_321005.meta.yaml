  4. Handle structural sharing in persistent/immutable data structures: a "new" list
  that shares its tail with the old one — what''s identical there? Are the nodes the
  same while the list values differ? (value vs node identity).

  5. Equality vs identity: when should `==` be structural (values) and when reference
  (location)? The theory must respect the distinction and explain why Java''s `==`
  vs `equals`, Python''s `is` vs `==`. Distinction between "same value" and "same
