  ---


  I teach an upper-division undergraduate seminar on truth and paradox. The class
  has fourteen students and one 75-minute meeting; they''ve already worked through
  the liar paradox and Tarski''s hierarchy but have not seen Curry''s paradox or Yablo''s
  sequence. Design a classroom activity—no lecture up front—that makes them feel the
  force of the claim that paradox does not depend on direct self-reference, and that
  avoiding the result forces a choice among logical principles they have been using
  without comment.


  The centerpiece should be Curry''s paradox. Arrange the activity so that the students
  themselves construct (or are led, step by step, to construct) a Curry sentence—something
  in the spirit of a sentence that says if this very sentence is true, then some arbitrary
  claim F is true—and then derive F under rules they endorse in advance. Let them
  notice afterwards what they have done. Then debrief by mapping each step of the
  derivation onto a possible escape route: rejecting the T-schema, restricting or
  rejecting conditional proof, rejecting modus ponens, rejecting contraction (the
  structural rule that permits using a premise more than once), or treating the relevant
  sentence as truth-valueless. The debrief should make clear that each escape route
  is live in the literature and that each has costs.


  Follow this with a shorter second phase on Yablo''s sequence: an infinite list of
  sentences, each saying every later sentence is false. Have the students work through
  the back-and-forth and see how contradiction seems to arise without any sentence
  referring directly or indirectly back to itself—or, if you judge that this cannot
  be made vivid in the remaining time, say so and tell me what to cover instead.


  Give me concrete rules, materials, team roles, and a minute-by-minute timeline for
  75 minutes. Include a debrief script in outline, an explanation of what predictably
  goes wrong the first time I run it (for instance, one team refusing the T-schema
  too early and so missing the pressure on the other principles), and how to handle
  that. Finally, be frank about which feature of the underlying idea the activity
  cannot reproduce and what I will need to supply explicitly in a short closing remark.


