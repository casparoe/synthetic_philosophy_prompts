  At a reading group on animal ethics I regularly attend, two other members got into
  a disagreement that the rest of us could not resolve, and I would welcome a careful
  adjudication of it. Both are scientifically literate but not professional philosophers,
  and I am a retired chemist, so I have followed the empirical claims more easily
  than the normative ones.


  The dispute began when one member, whom I will call M, advanced what she called
  the scale argument. She said: even if you assign a low probability to insect sentience
  — suppose, for the sake of argument, somewhere between five and thirty percent —
  the number of individual insects is so vast that the expected number of sentient
  beings affected by our choices dwarfs the number of vertebrates. Therefore, in deciding
  where to direct concern, insects cannot simply be set aside; the expected welfare
  stakes are enormous.


  The other member, D, replied that this is a disguised Pascal''s mugging. If enormous
  numbers can be multiplied by small probabilities to generate moral obligations,
  then a sufficiently tiny probability of an even larger number of minds — in a simulation,
  in the distant future, or in some other unverified scenario — would swamp the insect
  case too. Expected-value reasoning of this kind, he said, has no principled stopping
  point, and so it cannot serve as a guide to priorities.


  M answered that this overstates things: the probability of insect sentience is not
  an arbitrary, infinitesimal one. It is anchored in observable capacities — nociceptors
  or their analogues, avoidance learning, behavioural trade-offs that look like pain
  — so even a modest credence is empirically respectable. Pascal''s mugging, by contrast,
  trades on bare logical possibilities with no evidence. It is a mistake, she said,
  to treat an evidence-bearing low probability like an evidence-free one.


  D said that this only moves the problem: the same evidence also underwrites many
  low-credence but vast-stakes hypotheses, such as the possibility that simpler arthropods,
  nematodes, or future artificial systems are sentient, and once finite credence is
  granted, one must rank them by expected value rather than by evidence alone. If
  one draw the line at insects, one is doing so for psychological reasons, not principled
  ones.


  M then made a different point. She conceded that expected value is only one input:
  one must also consider tractability. Even if the expected welfare stakes for insects
  are high, our interventions may be unreliable, and in the case of wild insects we
  may not know whether reducing suffering in one place increases it elsewhere. So
  the scale argument does not by itself settle what to do. But, she insisted, it does
  settle a more limited question: it shows that dismissing insect welfare as insignificant
  because each insect is small and short-lived is a mistake.


  D replied that even this limited conclusion depends on the very expected-value framework
  he is challenging. If one is unwilling to let tiny probabilities of astronomically
  large populations dominate one''s priorities, then the scale argument does not show
  even that dismissal is mistaken; it just shows that dismissal would be mistaken
  within a framework he has reason to reject.


