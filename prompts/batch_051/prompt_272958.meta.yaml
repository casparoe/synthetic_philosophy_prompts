  "I teach a third-year epistemology course, 22 students, one 80-minute block. I want
  to run a live Sleeping Beauty game, but I don''t want to announce that name until
  the very end, and I don''t want to lecture up front — the students should get caught
  in the disagreement first and only then have it named and dissected. Could you design
  the full session?


  The core setup is the standard one: a fair coin is flipped on Sunday night; if heads,
  the sleeper is woken exactly once on Monday; if tails, the sleeper is woken on Monday
  and again on Tuesday, with the Monday memory wiped so the two wakings feel identical
  from the inside. At each waking the sleeper must set a fair price for a $1 ticket
  that pays if the coin came up heads. The stakes should be real but small — nickels,
  quarters, whatever. Participants should come away feeling the pull of both 1/2 and
  1/3, and seeing that the dispute is really about what space of possibilities a given
  wake-up is drawn from (the reference-class issue), not about anyone being bad at
  fractions.


  Now the hard part which I want you to take seriously: you can''t actually drug anyone.
  I don''t want the usual cop-out of ''students are just told to pretend they forgot.''
  Give me a multi-role protocol that substitutes for amnesia — my thought is that
  each potential waking slot gets played by a different student who genuinely does
  not know which slot they are (the lone Monday-heads slot, the first tails slot,
  or the second tails slot), but you can improve on that idea. Design it so the self-locating
  uncertainty is real for the person making the bet, not just narrated.


  Also build in a bookie or market-maker role, rotated, so there''s genuine price
  pressure and not just an opinion poll. And I want a settlement rule that''s deliberately
  ambiguous between settling per trial and per waking, so that in the debrief we can
  show why halfers and thirders often aren''t disagreeing about the coin''s fairness
  but about which bet is being made. Then give me the exact rules, materials (cards,
  envelopes, slips, a schedule, suggested wording), a minute-by-minute plan for 80
  minutes, and a debrief that maps moments in the game onto halfer, thirder, and the
  reference-class problem — names and labels held back until that debrief.


