  - The judiciary is the least dangerous branch: no sword or purse.

  - Its duty is to interpret laws and, when laws conflict with Constitution, to prefer
  the Constitution as the fundamental law, reflecting the will of the people over
  the will of their agents.

  - Judicial independence is needed to guard the Constitution against legislative
  encroachments, especially because the legislature''s will sometimes contradicts
  the people''s will.

  - Courts should be bound by strict rules and precedents to mitigate discretion.


