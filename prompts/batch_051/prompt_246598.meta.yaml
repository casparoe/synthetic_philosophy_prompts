  I am a PhD student in the philosophy of physics, working on coarse-graining and
  emergence, and I have been unable to settle a question about a structural parallel
  between Daniel Dennett''s account of real patterns and the renormalisation group.


  Dennett holds that a pattern is real to the extent that it is there in the data,
  permits prediction, and compresses the data: there is a hierarchy of real patterns
  at different levels of grain, and the higher-level patterns are not merely instrumental
  fictions, though they are also not fundamental. He pairs this with his three stances.
  The physical stance predicts behaviour from physical constitution and law. The design
  stance predicts behaviour by assuming the system has been designed or selected to
  perform some function. The intentional stance predicts behaviour by treating the
  system as a rational agent with beliefs and desires, and it works when the system
  approximates rationality. The higher stances, on his telling, latch onto real patterns.


  In physics, renormalisation group methods and effective field theories give a parallel-sounding
  picture: one integrates out the fine degrees of freedom to obtain a description
  valid at a chosen scale, with the micro-detail compressed into a small number of
  effective parameters. The low-energy description is predictive within its regime
  and is usually taken to capture real scale-relative structure, not to be a mere
  placeholder for the fundamental theory; it breaks down outside its regime of validity.


