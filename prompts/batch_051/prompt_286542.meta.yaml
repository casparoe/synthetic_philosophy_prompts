  Prompt draft:


  "Since Plato''s Meno, epistemologists have suspected that knowledge is more valuable
  than mere true belief, but it has proved surprisingly hard to say why. The obvious
  answer — that knowledge is true belief plus some third condition — only pushes the
  question back: unless the third condition itself is valuable, adding it to true
  belief shouldn''t make the composite better. Call this the Meno problem. I want
  you to reflect on where the interesting unresolved work is in this area.


  Imagine you are advising a talented graduate student who has three years to work
  on the value problem. Which of the following questions should they pursue, and in
  what order? For each, state whether it is upstream of others, how tractable it is
  with the tools of contemporary epistemology (rather than, say, empirical psychology
  or formal epistemology alone), and what evidence over the next two or three years
  would most change your ranking.


  Rather than survey the field, I want a defended agenda.


  Candidate questions you might consider (you are not limited to these):


  1. Whether the value problem is a single problem at all. Is there one question about
  why knowledge is better, or are there several (e.g., why knowledge is better than
  any proper subset of its parts; why knowledge is better than any weaker epistemic
  standing; why knowledge is a norm of assertion and practical reasoning) that run
  together in the literature?


  2. Whether the problem dissolves once we distinguish final from instrumental value
  and ask the right one. Does knowledge have to be finally valuable, or is it enough
  that it is constitutively valuable, or valuable as the natural home of true belief?


  3. Whether the correct response is to deny the datum: is knowledge actually more
  valuable than true belief? If the intuition stands up only in some contexts, which
  contexts are those, and what follows?


  4. Whether the value problem is really a problem for epistemic value at all, or
  a symptom of a mistaken picture of belief...


  5. The route through the norm of assertion: if knowledge is the norm of assertion,
  does that explain its value, or does it just relocate the question?


  6. Whether virtue epistemology / credit views (Greco, Sosa, Zagzebski) actually
  solve the problem or merely relabel it, and whether they can handle testimonial
  knowledge.


  7. Whether the anthropological or "social role" angle — knowledge as what we attribute
  to others to regulate a community of inquirers — has an answer.


