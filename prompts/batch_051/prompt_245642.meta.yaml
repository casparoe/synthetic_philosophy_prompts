  Keynes (Treatise on Probability, 1921):

  - Probability as logical relation between propositions (evidential). Degree of rational
  belief, not frequency, not psychological.

  - Probabilities not always numerically measurable; some are comparable ordinally,
  some not comparable at all; probability relations form a partially ordered set.

  - Principle of Indifference: if no reason to prefer one alternative, assign equal
  probabilities — but Keynes restricted it (only when alternatives are ultimate and
  indivisible); paradoxes arise when misapplied.

  - Weight of argument: amount of relevant evidence; distinct from the balance of
  probability. Practical action may depend on weight.

  - Induction: Keynnes appeals to "finite plurality" / limited independent variety
  to justify induction.

  - Knightian uncertainty (Frank Knight 1921) distinguished risk vs uncertainty; Keynes''s
  Treatise also discussed weight of evidence as distinct from probability. Keynes''s
  later work (1937 QJE paper "The General Theory of Employment") emphasised "uncertain"
  in the radical sense: we simply do not know.


