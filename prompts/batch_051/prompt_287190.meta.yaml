  On that account, the baseline is exponential discounting, whose constant rate makes
  an agent time-consistent: a plan that is optimal now remains optimal later, so there
  is no room for acting against one''s own standing judgment. Hyperbolic discounting
  changes this. It weights near rewards disproportionately, so that a smaller, sooner
  reward can overtake a larger, later one as the moment of temptation approaches.
  What we call weakness of will is then not a failure of some inner faculty but the
  predictable working of a time-inconsistent discount function. The person who on
  Sunday resolves to run on Tuesday morning and on Tuesday stays in bed has not contradicted
