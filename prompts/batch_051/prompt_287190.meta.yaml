  Much of my working life in the natural sciences was spent with models that describe
  a system by a few parameters and then predict its behavior; the vocabulary of "will,"
  "self-control," and "resolution" always struck me as, by contrast, descriptively
  idle. Now that I am retired and reading philosophy in earnest, I find myself drawn
