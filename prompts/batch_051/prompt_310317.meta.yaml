  Let me write type 2 equality prompt:


  ---


  For a reading group I''ve been asked to write a one-page "where I stand" note on
  distributive equality, and I''d rather have it stress-tested before I circulate
  it. Here''s roughly what I believe:


  1. The point of equality is to neutralise luck, not to make everyone equally happy
  or to equalise holdings for their own sake. So I''m basically a luck egalitarian.

  2. If someone chooses a risky career and it goes badly, the fact that she is now
  worse off through her own choice matters: we owe her less by way of compensation
  than we owe someone who is equally badly off through brute bad luck.

  3. But I don''t think a bad choice forfeits her claim to a decent minimum. Even
  imprudent people have a claim to enough healthcare, housing and food, and I''d tax
  to guarantee that.

  4. I have no patience for subsidising expensive tastes. If you cultivate a taste
  for some absurdly costly wine, that''s on you, even if you didn''t choose to have
  the taste.

  5. But I think a congenital disability that makes ordinary living expensive is a
  paradigm case for compensation, even when the person reports she''s just as happy
  as anyone else.

  6. I''m suspicious of welfare as a metric anyway because of adaptive preferences:
  people can report high satisfaction with objectively awful options.

  7. I''m drawn to the capability approach, but I worry that until someone fixes which
  capabilities matter it''s less a theory than a placeholder.

  8. The envy test for whether resources are equally distributed strikes me as basically
  right, at least as a benchmark.


  Go through these and tell me which pairs or larger subsets are in tension, how severe
  each tension is, and what the cheapest fix would be in each case. I''m also interested
  in which pairs only look like a conflict but dissolve when you press on them. Finally,
  tell me which single revision would do the most to make the whole set hang together,
  and what it would cost me.


