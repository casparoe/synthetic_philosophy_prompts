  Hey! I''m in a philosophy of mind / cognitive science course right now, and we just
  covered Dennett''s four kinds of creatures: Darwinian, Skinnerian, Popperian, and
  Gregorian. The rough version from lecture: Darwinian creatures only adapt across
  generations by natural selection; Skinnerian ones can also learn within a lifetime
  by trial and error and reinforcement; Popperian ones can simulate possible actions
  inside their heads and weed out bad ideas before acting; and Gregorian ones use
  external mind-tools—especially language—to pass ideas around and improve their thinking
  over time. I kept feeling like the jump from Popperian to Gregorian does a lot more
  work in human evolution than the reading gave it credit for, so I want to work through
  a counterfactual.


  Here''s the scenario. Imagine a sister lineage of hominins split from our ancestors
  around 300,000 years ago in East Africa. Physically and ecologically they''re very
  close to early Homo sapiens—same bodies, hands, diet, habitat, group sizes. Their
  cognition is fully Popperian: an individual can represent several possible courses
  of action, simulate their likely outcomes internally, and discard the ones that
  look bad without having to actually try them out. But they never become Gregorian.
  No language in anything like the human sense, no writing, no notational systems,
  no external storage of ideas. The only way anything learned gets out of one head
  and into another is through ordinary animal communication (calls, gestures, facial
  expressions) and whatever imitative copying they can manage, the way some living
  primates and birds copy actions. If one of them figures out a better way to make
  a stone tool, it dies with them unless someone else manages to copy it.


  I want your best reasoned prediction of what this species looks like 50,000 years
  later. Focus on material technology, social organization, and cumulative culture.
  Do they get composite tools like hafted spears or bows, long-distance exchange,
  multi-band alliances, or do they stall out near simple stone tools and small family
  bands? Does anything like culture accumulate anyway through imitation alone? Would
  something like language (or another external mind-tool) eventually appear, and what
