  Condorcet sketch:


  Title-ish: "I''m building a teaching handout..." We must output the prompt text
  only.


  Prompt:


  "You are a political philosopher with a strong background in formal social choice
  theory. I''m making a handout for a graduate seminar in democratic theory, and I
  want a decision tree that sorts someone into their actual view about what the Condorcet
  jury theorem (CJT) shows about real democracies, as opposed to what they call themselves.
  The tree should begin from a point anyone in the seminar would accept: the theorem
  says that, under certain conditions, a majority of independent voters each more
  likely than not to judge correctly is more likely correct than any single voter,
  and that this reliability increases with group size. But the publication we start
  from is not what I want people to sort over. Build the tree out of four or five
  binary split questions, each a concrete claim a seminar participant could answer
  without knowing which position it leads to. Please use at least these four: (1)
  whether voters'' choices in real elections are judgments about a mind-independent
  correct alternative at all (or are they preferences/interests over which there is
  no fact of the matter for the theorem to track); (2) whether actual voters meet
  the individual competence condition at better-than-chance levels on the questions
  that matter; (3) whether the sources of voter error are adequately modeled as independent
  (or are they mostly common causes like media narratives, party cues, and correlated
  elite misinformation); (4) whether the asymptotic result that large groups outperform
  any individual survives once we worry about those common causes. Each node should
  be phrased so that someone can answer it with an example about a particular kind
  of real-world vote: a referendum on a technical policy, a jury verdict, a general
  election for a candidate, etc. The leaves must include, at minimum: an unqualified
  epistemic democrat, a qualified epistemic democrat who restricts the theorem''s
  application to juries or small truth-oriented bodies, a common-cause skeptic, a
  preference-aggregation proceduralist, and a formalist who accepts the mathematics
  but denies it says anything about what makes decisions legitimate. Two leaves the
  tree should flag as hard to separate: a pure preference-aggregation proceduralist
  and someone who accepts the theorem but thinks legitimacy comes from equal treatment
  rather than correctness. Also identify any unoccupied cells in the 2^4 table and
  diagnose whether each is empty because the combination is incoherent, unattractive,
  or merely unexplored. No question or leaf should presume knowledge of the labels
  in advance. Finish with a short ''how to read this tree'' paragraph. Keep the whole
  handout to at most 1,200 words."


