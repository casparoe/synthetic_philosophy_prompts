  as an individual, judged by conscience), metaphysical guilt (solidarity with human
  beings, responsibility for wrongs done in my presence or with my knowledge; lack
  of resistance). "Can a nation be guilty?" — Jaspers says only individuals can be
  morally/criminally guilty, but political guilt attaches to a collectivity. Good.


