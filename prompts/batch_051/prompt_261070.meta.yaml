  Woodward''s interventionism (from Making Things Happen, 2003). Key ideas:

  - Causation understood via manipulation: X causes Y iff there is some intervention
  on X that changes Y (or changes the probability distribution of Y), where interventions
  are "ideal" interventions that set X independently of other causes of X, and affect
  Y only via X (no direct effect on Y except through X).

  - Invariance: causal generalizations are relationships that are invariant under
  interventions; they remain stable under some range of interventions. Invariance
  is a matter of degree (range of invariance). This distinguishes causal from merely
  correlational relations.

  - Circularity worry: defining causation in terms of interventions while interventions
  themselves are characterized causally (an intervention on X must not affect Y independently
  of X, and must be a cause of X). Woodward''s response: he gives a non-reductive,
  non-anthropocentric account; the notion of intervention is itself causal but the
  account is meant to show how manipulation connects to causation, and is acceptable
  as a "naturalistic" account without reduction. The circularity is benign or "virtuous"
  not vicious; the project isn''t reductive.

  - Manipulation: Woodward''s "manipulability" notion is not restricted to human manipulation;
  possible hypothetical interventions suffice. But the concept is tied to what would
  happen under interventions.


  Subtle misrepresentations to embed:

  1. Claim that Woodward defines "intervention" purely in statistical terms (e.g.,
  as setting a variable to a value while holding everything else fixed as in an RCT)
  — actually ideal interventions require causal/structural conditions (an intervention
  must avoid affecting Y via routes that bypass X, must not be caused by other variables
  in the system), and Woodward is explicit that "setting X" / breaking arrows is causal
  language.

  2. Claim that invariance just means the relation holds across many different contexts/heterogeneity
  — that conflates invariance with robustness or external validity. Actually invariance
  under interventions is more specific: the generalization continues to hold for some
  range of interventions on X and other variables; not mere passive observation across
  contexts.

  3. The circularity worry presented as a fatal objection that Woodward didn''t address,
  or alternatively as fully solved. Actually Woodward acknowledges the circularity
  and argues it''s not vicious because the theory isn''t reductive.

  4. Maybe: "Woodward thinks causal claims are reducible to facts about what happens
  if you twiddle knobs" — that''s a misrepresentation: he disavows reduction and allows
  hypothetical (non-actual) interventions, and says the account is not epistemic/reductionist.

  5. Or "for Woodward, X causes Y just in case someone can actually manipulate X"
  — misrepresents because interventions can be merely possible/hypothetical, even
  impossible for humans (e.g., intervening on the moon''s mass).

  6. "Invariance can be read off from a dataset" — misrepresents: invariance is a
  modal notion, not identified by passive observational data.


