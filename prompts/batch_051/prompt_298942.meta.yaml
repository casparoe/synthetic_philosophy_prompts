  Lewis''s actual view (from memory, but I won''t quote): In "The Paradoxes of Time
  Travel," Lewis argues time travel could be possible in a world with a "personal
  time" diverging from "external time." Grandfather paradox: Tim can kill Grandfather.
  Lewis says: in one sense Tim *can* kill Grandfather — he has what it takes (marksmanship,
  opportunity, gun works). But in another sense, Tim *cannot* kill Grandfather — because
  his killing Grandfather is compossible with a set of facts including Grandfather''s
  survival (Grandfather lived until 1957 or whatever). Since Tim''s grandfather did
  survive, the fact that Tim kills him is not compossible with the facts of the past.
  But this doesn''t mean Tim is physically prevented; it''s not like the gun must
  jam. Rather, we misdescribe the situation: there''s no "he could do it but something
  would stop him" mystery; the fact that he doesn''t do it is part of the setup. Actually
  Lewis''s point: Tim''s ability is not compromised by the compossibility fact; we
  just must be careful about which "can" we mean. He doesn''t say fate or a spooky
  force; if Tim tried, he''d fail for some ordinary reason (he slips on a banana peel,
  his nerve fails, etc.), but we can''t predict which. Agglomeration: "Tim can kill
  Grandfather" and "Tim cannot kill Grandfather" can both be true in different senses.


