  Prompt:


  I was reading Keynes''s A Treatise on Probability and he restates the principle
  of indifference roughly like this: when the evidence gives you no known reason to
  expect one alternative rather than another, assign them equal probability. Sounds
  harmless enough. But my roommate says Bertrand''s paradox shows exactly why it doesn''t
  work. He gave me this argument:


  (1) A chord of a circle is drawn at random. The principle of indifference says any
  way of splitting the possibilities that gives no reason to favor one case over another
  should yield the same probability.

  (2) One natural way to pick a chord is to pick a distance from the center along
  a fixed radius and draw the chord perpendicular to that radius. The chord is longer
  than the side of an inscribed equilateral triangle exactly when the distance from
  the center is less than half the radius, so that probability is 1/2.

  (3) Another natural way to pick a chord is to pick its two endpoints independently
  and uniformly on the circumference. The chord is longer than the triangle side exactly
  when the shorter arc between the endpoints is more than 120 degrees, which is one
