  ---


  I facilitate a six-week adult-education course at a public library called After
  the Facts, for about fourteen participants with no formal background in historiography.
  Next week''s ninety-minute session is meant to land a single idea: that a community''s
  collective memory and the work of professional historians are not two competing
  descriptions of the same past graded by the same standard of accuracy, and therefore
  the question "when they conflict, which should give way?" is usually the wrong question.
  The useful question is what each practice is for, what each is answerable to, and
  which one should govern which decision. I want the participants to leave able to
  spot the moment someone slips from "these differ" to "therefore one is defective,"
  rather than leaving with the flat lesson that memory is subjective and history is
  objective.


  Please provide a plan for the explanation, not the explanation itself. Structure
  the answer as a JSON object in American English with exactly these fields:


  - "learning_goal": a one-sentence statement of what participants should be able
  to see or do by the end.

  - "sequence": an ordered array of objects, each with "step" (what is introduced
  or done), "why_here" (what earlier step it depends on and what later step it enables),
  "minutes", and "misconception_to_unseat_here" (a misconception predictably forming
  at this point and how to defuse it).

  - "carrying_case": an object with "description" of the single concrete case used
  throughout, "must_have" (the features the case must have to carry the idea), and
  "must_lack" (the features that would let the case become a red herring or a referendum
  on which side wins). The case should be invented and close enough to feel real but
  not one the participants already have loyalties about.

  - "misconception_map": an array of objects, each with "misconception", "likely_origin"
  (where it comes from or at which step it forms), and "defusal_move".

  - "check_for_understanding": a closing check that would show the idea has landed,
  plus one example of a response that passes and one that shows the idea has not landed.

  - "leave_out": an array of objects, each with "item" (what you will deliberately
  not cover) and "say_to_students" (what the facilitator says to acknowledge the omission).


