  it becomes unstable. His solution is the ''inviolate level'': every coherent system
  must have a level of rules that cannot be changed by the levels above it, which
  stops the loop from devouring itself. For instance, neurons can change connections,
  but the laws of chemistry stay fixed; a program can modify itself, but the hardware/operating
  system can''t be changed by it. Thus Hofstadter proves that no system can ever inspect
  its own deepest assumptions."


