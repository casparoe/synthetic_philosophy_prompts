  motor.


  Paul (friend two): That is exactly the mistake: you''re treating ''motorized'' as
  if it were a chemical property of the object, but whether a hybrid machine counts
  as ''motorized'' depends on what the word is doing in the rule. The rule was aimed
  at machines that are driven by their engines — loud, heavy, trail-scarring vehicles.
  A pedal-assist bike is driven by the rider; the motor only helps. If your mechanical
  test were right, the rule would also ban electric wheelchairs and powered mobility
