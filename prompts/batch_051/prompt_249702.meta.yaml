  So my friend and I just spent a whole evening arguing about whether it''s meaningful
  to call something "bad grammar." She''s basically a descriptivist: languages are
  just different systems, so the best you can say is "wrong for the context," and
  rules like "don''t split infinitives" are just class markers. I kept wanting to
  say no, if a student writes "I could of stayed longer" on a college essay, they
  made an error, in a way that''s different from saying "He be working nights." By
  the end we were talking past each other and I realized I can''t actually state what
  I think a grammatical error is.


  So give me a working definition of "bad grammar" (or "grammatical error" — use whichever
  term can carry the weight). I want a definition that correctly handles these cases,
  and then I want you to run the definition through each of them, say where it surprises
  you, and where it has to be patched to avoid nonsense:


  - "I could of stayed longer" in a college paper

  - "For all intensive purposes, the plan is fine" in an office email

  - "He be working nights" said by a speaker of African American English

  - Chomsky''s colorless-green-ideas sentence — grammatical, but it means nothing

  - "The committee have reached their decision" (UK publishing)

  - "Whom do you think is attending?"

  - "Every student should submit their homework" in a formal handbook

  - "I ain''t done nothing" in casual speech


  For the record: I''d call "could of" a real error, I''d call the nonsense sentence
  not a grammar error at all, and I have no solid view on the rest. My friend called
  "whom do you think is attending" an error even though it''s hypercorrect, which
  sounds like it cuts against her. Propose the definition, run the cases, and tell
  me which verdicts you''re least secure about.

