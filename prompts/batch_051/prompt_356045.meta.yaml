  a word. (I want to say this is agreement — but this is where the whole thing starts
  feeling uncomfortable.)

  5. A paper contract that a person signs without reading, under no time pressure
  and with no one misleading them. (I''d have said yes in court, but conceptually
  I''m no longer sure.)

  6. A website footer link says something like "by continuing to use this site, you
  agree to the Terms". No click, no scroll, no acknowledgement. (No idea.)

  7. Shrink-wrap software: the licence is inside the box, you only see it after you''ve
  paid and opened it, and the terms say using or even keeping the product counts as
  accepting. (Also no idea.)

  8. An email tells you: "we''ve updated our terms; continued use of the service after
  30 days constitutes acceptance", and you keep using it. (Leaning no, but I can''t
  say why.)

  9. A thirteen-year-old clicks the same I Agree button as in case 3 after reading
  the terms.

  10. You''ve installed a browser extension / LLM agent set to auto-accept cookie
  banners and terms popups on your behalf. (Feels not-agreement, but you did set it
