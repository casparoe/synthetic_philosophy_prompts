  I want you to think carefully and brainstorm two or three candidate definitions
  before you commit, then run the best one through the cases below. I have rough pretheoretical
  verdicts on some of them, and I''m genuinely unsure on others. Where your definition
  disagrees with me, either fix it or defend the surprising verdict.


  The cases:


  1. Two businesses negotiate a software contract over several weeks, read the final
  text, and both sign it. (This is just agreement, non-controversially.)

  2. A cat walks across a keyboard and clicks the I Agree button on a EULA. (Not agreement.)

  3. An app shows the full terms in a scrollable box and the user reads the whole
  thing and clicks I Agree.

