  Actually, let me double check the terms and their meaning: In "Consciousness Explained"
  chapter 5 (or around there), Dennett discusses "Multiple Drafts" and the "Orwellian"
  and "Stalinesque" alternatives. Orwellian revision: like Winston Smith in 1984,
  records are rewritten; in memory theories, the brain revises memory after the fact
  so there''s no false experience, only false memory. Stalinesque revision: like a
  Stalinist show trial, the event is edited before it reaches consciousness; the conscious
  experience itself is crafted, delay. Dennett argues these two accounts are empirically
  equivalent, a "difference that makes no difference" unless you believe in a Cartesian
  theater where there''s a fact about when something "reaches consciousness."


  Also the color phi: a red spot at one location, green spot at another; observer
  reports a red spot moving and changing to green midway. The puzzle: how can the
  change to green be experienced before the green spot arrives? The Orwellian account:
  the brain initially records red at position one; when green arrives, it retrospectively
  revises the record so the spot seems to have changed color midway. The Stalinesque
  account: the brain delays the whole conscious episode until the green arrives, then
  presents a single moving spot changing color. So under Orwellian, the subject did
  consciously experience red first, then the memory was edited; under Stalinesque,
  the subject never consciously experienced red-first; the delay means the only conscious
  experience is the moving, color-changing spot.


