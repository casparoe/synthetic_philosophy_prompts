  Prompt draft:


  "I have been going back and forth on an argument against the coherence of the doctrine
  of the Incarnation, and I would like you to tell me exactly where it goes wrong,
  if it does. I am using ''nature'' in the sense the classical debates use it: roughly,
  what a thing is, or the set of properties that make it the kind of thing it is.
  The argument runs as follows:


  (1) For a person to have a nature is for that person to have the properties that
  belong to that nature essentially. (2) The divine nature includes essential omniscience.
  (3) The human nature includes essential non-omniscience — that is, limited or finite
  knowledge is part of what it is to be human rather than an accidental feature of
  particular human beings. (4) If one person, Christ, has both the divine and the
  human nature, then that one person has both essential omniscience and essential
  non-omniscience. (5) Nothing can have both omniscience and non-omniscience at the
  same time and in the same respect. (6) Therefore the doctrine that Christ is one
  person in two natures is incoherent.


  The standard two-natures doctrine holds that Christ is one person (one hypostasis)
  with a divine nature and a human nature, neither mixed into a third kind of thing
  nor running alongside each other in two separate subjects. A defender of that doctrine
  will, I take it, either block step (1) by denying that a person ''has'' the properties
  of a nature in that direct way, or block step (3) by denying that non-omniscience
  is essential to human nature, or allow the contradiction but relativize it to the
  two natures. The third reply worries me most: once the properties are relativized
  in that way, I can no longer see what makes Christ a single subject of both natures
  rather than a composite of two minds or two persons. Please assess whether the argument
  is valid, identify the step (or steps) at which an orthodox defender should and
  should not resist, and say what, if anything, remains of my coherence objection
  once the best version of the doctrine is in place."


