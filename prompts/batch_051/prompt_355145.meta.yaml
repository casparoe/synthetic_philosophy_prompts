  The Münchhausen trilemma says any attempt to justify a belief leads to (i) infinite
  regress, (ii) circularity, or (iii) dogmatic stopping point. A step-by-step argument
  could be:


  (1) A belief is justified for you only if you can give a reason for it that is itself
  justified.

  (2) If a reason is justified by another reason, and that by another, then either
  the chain goes on forever, loops, or stops at an unjustified reason.

  (3) An infinite chain cannot provide justification, because no link is ever finally
  grounded.

  (4) A circular chain cannot provide justification, because it assumes what it is
  trying to show.

  (5) A chain that stops at an unjustified reason cannot provide justification, because
  the stopping point is arbitrary.

  (6) Therefore no belief can be justified at all.


