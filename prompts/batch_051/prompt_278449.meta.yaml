  to cognition, together with work on interoception and the neuroscience of self-consciousness,
  have built up a rival picture. On this picture even minimal self-awareness — the
  basic sense of being a distinct subject, located in a body and in a world — is generated,
  structured, and maintained by the continuous integration of bodily signals (heartbeat,
  breathing, proprioception, the sense of balance, touch) and by sensorimotor interaction
