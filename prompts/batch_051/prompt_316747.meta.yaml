  Possible prompt:


  "I''m teaching Shirley Jackson''s ''The Lottery'' in a course that has been discussing
  expiatory sacrifice, scapegoating, and the transfer of guilt. I want to use the
  story to test the standard view that a scapegoat is a victim onto whom a community
  projects (and perhaps ritually transfers) its collective sin or impurity, with the
  killing or expulsion discharging that burden. But Jackson''s village appears to
  do something stranger: no one accuses Tessie Hutchinson of anything; no priest lays
  the community''s sins on her; the ritual seems to have lost whatever theology once
  explained it, and is carried on mainly as a piece of inherited civic routine that
  some villagers explicitly worry is dying out elsewhere. The victim is chosen by
  lot, not by accusation or desert, and the only hints of a rationale are a vague
  link to the harvest and a saying that things have always been done this way.


  I''d like a reading of the story that treats it as a contribution to philosophical/anthropological
  thinking about ritual substitution. Specifically: In what sense, if any, is Tessie
  a scapegoat rather than merely an arbitrarily selected victim? For scapegoating
  to occur, must anyone in the community believe that the victim is guilty or that
  her death transfers something—sin, blame, bad luck, future misfortune—from the group
  to her? Or is it enough that one person''s suffering marked as a ritual repayment
  substitutes for harms the community would otherwise have to bear? Does the story
  show that the guilt-transfer model is dispensable, and that ritual killing can persist
  on nothing but convention and fear? Or does it show the opposite—that once the guilt-transfer
  content is hollowed out, the ''scapegoat'' collapses into a victim of pure collective
  violence and the concept does no work?


  I also want to know what the story does to the idea that the victim is ''one of
  us.'' Scapegoating often targets a marginal or vulnerable figure, yet Tessie is
  selected among longstanding neighbors, and the day begins with friendships and casual
  talk. Does this strengthen or break the analogy with scapegoating? How should we
  weigh the moment when the crowd closes in—including her family—in thinking about
  whether guilt is really transferred or whether the violence itself creates a temporary
  solidarity? Finally, does the story imply that the villagers'' blindness to the
  point of the ritual is itself part of what allows them to do it, or would a fully
  articulated belief in substitution make them more culpable or less? I''d like a
  reading that is faithful to the detail of the story without pretending it answers
  all of these questions."


