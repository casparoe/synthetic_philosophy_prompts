  and (iv) sacrificing the intuition doesn''t force you to give up a whole cluster
  of other intuitions you''d still want. Now here''s a case that''s wobbling my confidence
  in the test. There''s a standard result that a rational agent should never pay for
  information that cannot possibly change what she will do, because the expected value
  of such information is zero — the decision tree branches on the message but all
  branches lead to the same act, so you''re paying to be in a situation identical
  in payoff to the one you were in. But in a study making the rounds, people reliably
  pay to know whether family member would have survived under the course of treatment
  not chosen, even told up front that the answer can''t affect any decision (the medical
  outcome is already fixed and there are no future comparable choices). The intuition
  is strong, stable, and survives debiasing-ish prompts. Is this a case where my test
  says the theory should win, or a case where the theory should lose? Work through
  the four conditions one at a time and flag where they underdetermine the verdict.
  Then tell me whether the real lesson is that paying for this information can be
  rational after all (so the theory isn''t compelling enough), or that my condition
  list is missing something — maybe a clause about whether the information itself
