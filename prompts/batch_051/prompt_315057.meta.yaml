  itself is uncertain — e.g., you''re not sure whether the test kit line appeared
  — Jeffrey handles that. Hmm.


  There''s a subtlety: if you can''t pin down P(E|H) and P(E|not H), Jeffrey conditioning
  doesn''t obviously help, because to update on the proposition "the test said positive"
  you still need old(H | test positive), which involves likelihoods. But Jeffrey''s
  point is that you can update on the *uncertain* observation directly: you set new(glow)
  = 0.9 because you''re 90% sure you saw a glow, then kinematics gives new hypotheses
  without needing to condition on "there was a glow simpliciter." Wait, let me think
  carefully.


  Standard Bayesian conditioning: if you learn E with certainty, P_new(H) = P_old(H|E).
  This requires you to become certain of E. Jeffrey generalization: if your probabilities
  over a partition {E, not E} shift to q, 1-q (you''re not certain E happened), then
  P_new(H) = q*P_old(H|E) + (1-q)*P_old(H|not E). This requires old conditional probabilities
  P_old(H|E), which encode likelihoods P(E|H) via Bayes? Actually P(H|E) = P(E|H)P(H)/P(E).
  You need those, but you can compute P_old(H|E) if you have P(E|H), etc. But Jeffrey''s
  point is that the input is not "E occurred" but "my probability for E changed to
  q". Still, to apply the rule you need old conditional probabilities. So the arbitrariness
  in likelihoods is still there. However, maybe one can use "probability kinematics"
  without exact likelihoods by making other commitments. There''s also the idea of
  updating on the fact of an experience: you may be certain about your experience
  (I had an experience as of seeing the cat), and then if you have prior probabilities
  about the reliability of such experiences, you can condition normally. If you don''t
  know reliability, you have a prior over reliability.


