  Theological-philosophical problem: How can a sinless being with full knowledge of
  God and no passions fall? This is called "the fall of the angels" or "the origin
  of evil in a good creation." The puzzle: to choose evil, you must see it as good
  (since the will aims at the good as apprehended), but a perfectly rational creature
  with full knowledge wouldn''t misapprehend. So either (a) the angel lacked full
  knowledge (probation), or (b) there''s a defect in its judgement, which is already
  evil, leading to regress, or (c) the will has the power to choose a lesser good
  while fully knowing the greater good (Scotistic freedom of indifference), which
  makes the choice arbitrary, or (d) pride: the angel loves its own excellence inordinately
  — but that is the sin, not an explanation. Also issue: if God creates the angel,
  and the first sin has to originate from either God or the creature; if the creature''s
  nature is wholly good, how can it be the source? Maybe the will''s "defection" is
  a non-positive cause (Augustine''s deficient cause). The model answer should distinguish
  first-cause vs. deficient-cause explanations, motive vs. enabling condition, and
  required premises.


