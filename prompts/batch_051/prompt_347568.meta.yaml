  on the mast; it''s Ulysses and the crew agreeing on a procedure before they sail,
  because they know that once the Sirens sing, the captain will want one thing and
  the rowers another. Constitutional entrenchment, on this picture, is less about
  protecting considered judgment from hot passions and more about making sure that
  anticipated disagreement does not unravel a shared scheme of government at the first
  moment of stress.


