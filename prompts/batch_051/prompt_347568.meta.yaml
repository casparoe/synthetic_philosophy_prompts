  aren''t ropes that can be slipped...; they''re amendment procedures, judicial review,
  etc., whose whole point is to make exit costly. So the normative story can''t just
  be ''the people bind themselves for their own good''; it has to be a story about
  why the dead (or the young) may bind the unborn."


