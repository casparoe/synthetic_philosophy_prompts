  Here are the notes.


  Working title: ''Precommitment as coordination among the antsy, not self-binding
  by a single self.''


  The usual thought is that a constitution is a Ulysses contract: a people binds its
  future self so it won''t give in to passing passions, like Ulysses tying himself
  to the mast. I want to argue this picture is wrong in a way that matters, but that
  a modified version can be saved.


  First, three disanalogies.


  1. The bound self. Ulysses binds a future version of himself. It''s the same agent,
  with the same life, and he anticipates a temporary and well-understood incapacity
  (the Sirens-induced madness). In the constitutional case, the ''binders'' and the
  ''bound'' are not the same people at all. Future citizens did not participate in
  the original choice; they are not temporarily impaired; they just don''t exist yet.
  So the self-binding part of the story is doing hidden work.


  2. The exit conditions. Ulysses wants a constraint that is effective but that in
  principle someone else could end (he tells the crew not to untie him no matter what).
  Constitutional mechanisms, like entrenched clauses or amendment rules, are designed
  to make exit costly but possible; the question is not whether the bound party would
  beg to be untied, but who gets to count as the party entitled to do the untying.
  That''s a question about membership and authorization, not about weakness of will.


  3. The nature of the threat. The Sirens are a threat to a given preference ordering:
  Ulysses'' lower-order desire (to go to them) conflicts with his higher-order or
  all-things-considered desire (to get home). But future generations'' ''passions''
  aren''t a pathology of an otherwise stable self; they are often just their considered
  judgments about the same matters, made in a different situation. So the constitution
  doesn''t protect a people from its own irrationality; it imposes a particular settlement
  on people who may reasonably disagree with it.


