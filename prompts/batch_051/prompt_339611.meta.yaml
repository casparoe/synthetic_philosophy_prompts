  \nThe core issue: the apparent paradox that it can be instrumentally rational to\
  \ have a disposition that produces individual acts that are instrumentally irrational\
  \ (or at least not self-interested). Since being trustworthy enables cooperation\
  \ (the ride), it seems rational to cultivate trustworthiness. But being trustworthy\
  \ means being disposed to keep promises even when breaking them would be better\
  \ by one's own lights. Thus the disposition is \"irrational\" at the level of acts;\
  \ yet it's rational to adopt it. This threatens either:\n- the view that rationality\
  \ is a matter of maximizing self-interest (S),\n- the idea that rationality is act-by-act\
  \ or local,\n- or it collapses \"rational irrationality\" into rational rationality\
  \ via a global/dispositional notion.\n\nWe can press on several debates:\n1. Is\
  \ the dispositional state really irrational? Maybe rationality applies primarily\
  \ to dispositions or character, not individual acts; then paying is rational because\
  \ it flows from a rationally adopted disposition. But then what does \"rational\
  \ at the act level\" mean? This resembles rule-consequentialism vs act-consequentialism.\n\
  2. The bootstrapping problem: can you actually make yourself trustworthy? You can't\
  \ just decide to be the kind of person who keeps promises when it's not in your\
  \ self-interest; adoption of a disposition is not purely volitional. If you can't\
  \ cultivate it, the alleged rationality of being trustworthy doesn't translate into\
  \ guidance.\n3. The transparency/assurance problem: the benefit depends on the driver\
  \ knowing you're trustworthy. If the driver can't distinguish a genuinely trustworthy\
  \ hitchhiker from a feigned one, the incentive collapses. But if you could feign,\
  \ why pay? Self-signaling or reputation effects.\n4. The asymmetry between threats\
