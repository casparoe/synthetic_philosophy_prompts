  "I''ve been working on a short paper about what rationality requires when an agent
  has no reason to prefer one option over another, and I find I''m drawn to all of
  the following claims at once. (1) Buridan''s ass is not a genuine paradox: a rational
  agent facing two exactly similar bales of hay may simply take one of them, and the
  agent is neither irrational nor in any way impaired in doing so. (2) Intentional
  action is action performed for a reason, and reasons of the relevant kind are contrastive:
  a reason that would justify taking the left bale must favor the left bale over the
  right bale, so a consideration that applies equally to both is not by itself a reason
  for taking either. (3) Revealed preference theory captures something important:
  when an agent freely selects one of two available options in the absence of coercion
  or mistake, we are entitled to attribute to that agent at least some preference
  for the selected option over the alternative. (4) Indifference is not the same thing
  as incomparability: two options can be equal in value, in which case taking either
  is rationally unproblematic, or they can fail to stand in any evaluative relation,
  in which case choosing either would misrepresent the agent''s values and is rationally
  unavailable. (5) The fact that some tie-breaking mechanism would select one of two
  options does not by itself make taking that option any more rational; principles
  of rational choice and descriptions of selection mechanisms answer different questions."


