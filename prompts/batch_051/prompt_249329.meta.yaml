  Exam question (invented by me):


  "In applied ethics, the routine use of insecticides in agriculture and public health
  kills enormous numbers of insects every year. Is this morally permissible? Write
  a short critical response in which you consider (a) whether insects deserve direct
  moral consideration, (b) how at least two moral frameworks bear on the question,
  and (c) how uncertainty about insect sentience should affect practice."


  Student answer:


  "Whether insects deserve direct moral consideration depends on whether they are
  sentient. Nociception—the capacity to detect and respond to tissue damage—is widespread
  among insects, but nociception is not the same as feeling pain, so it does not by
  itself establish sentience. Behavioral evidence, such as insects avoiding harmful
  stimuli, is also inconclusive because such responses can be reflexive. For this
  reason, many philosophers hold that we should have low confidence that insects are
  sentient. Nevertheless, the sheer number of insects killed by insecticides—commonly
  estimated in the trillions annually—means that a utilitarian calculation cannot
  simply ignore the question. Even if each insect''s suffering matters very little,
  the total expected disutility could be enormous. A rights view would go further:
  if insects are subjects with any subjective experience at all, then they are ends
  in themselves, and killing them as a means to agricultural convenience is impermissible.
  But deontologists generally restrict rights to rational beings, so a Kantian framework
  gives us little reason to worry about insects; insects are simply means. Finally,
  given uncertainty about insect sentience, a precautionary approach seems most defensible:
  because we do not know whether insects suffer, and the stakes are high, we should
  act as if they do and prefer non-insecticidal pest control, or at least targeted
  rather than broadcast spraying, except where serious human health is at stake."


  Now identify subtle mistakes:


  1. "A rights view would go further: if insects are subjects with any subjective
  experience at all, then they are ends in themselves" — This conflates having any
  subjective experience with being an "end in itself" in the Kantian sense. Also "subjects"
  terminology. Actually "subjects-of-a-life" is Regan''s criterion, which requires
  more than mere sentience (beliefs, desires, memory, sense of future). This is a
  subtle conflation: the student equates sentience with the robust subjectivity that
  rights views like Regan''s require. Good subtle error.


  2. "But deontologists generally restrict rights to rational beings, so a Kantian
  framework gives us little reason to worry about insects; insects are simply means."
  — This overgeneralizes: (a) many deontologists don''t restrict moral standing to
  rational beings (Regan is a rights theorist and deontological); (b) Kant''s indirect
  duty view gives some (though not animal-directed) reason for concern about cruelty,
  so "little reason" is too quick and ignores Kantian duties regarding oneself/imperfect
  duties. Also "insects are simply means" is a mischaracterization of Kant, who held
  animals are not ends but we still have indirect duties; and whether insects count
  for indirect duties is debatable. So this is a good subtle mistake.


  3. "Even if each insect''s suffering matters very little, the total expected disutility
  could be enormous." This is somewhat right under utilitarianism but elides an issue:
  expected-value aggregation across enormous numbers of tiny probabilities/magnitudes
  can be controversial (Pascal''s mugging) and, more importantly, the argument uses
  expected disutility of possible sentience; a subtle issue: it conflates "expected
  disutility" (probability × magnitude) with certainty that insects suffer. Actually
  the student does hedge "expected." It''s fine; maybe not a clear error. It''s a
  defensible move. Keep as correct content.


  4. "A precautionary approach seems most defensible... we should act as if they do
  and prefer non-insecticidal pest control, or at least targeted rather than broadcast
  spraying, except where serious human health is at stake." — The subtle issue: the
  conclusion doesn''t follow from uncertainty alone. The precautionary principle is
