  Draft:


  "I''m a journalist who covers science and ideas, and I''m working on a long feature
  about mechanistic anomaly detection: the practice of checking whether a neural network''s
  behavior is produced by the same internal mechanism as usual, or by an anomalous
  one. I want the piece to include a worked, borderline example, and I''d like you
  to produce the analysis.


  Background: In this literature, a mechanism is an internal computational process
  that mediates between a model''s input and its output — for example, a path through
  specific attention heads and MLP features that implements a sub-computation such
  as copying a token or detecting texture. For two runs (or two inputs) that produce
  the same behavior to count as using the same mechanism, a researcher might require:


  1. Implementation identity: the same components and connections (the same heads,
  units, feature directions, roughly the same weights) lie on the mediating path.

  2. Causal-mechanical invariance: the same ablation or patching interventions on
