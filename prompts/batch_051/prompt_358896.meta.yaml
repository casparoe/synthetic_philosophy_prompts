  Let me lay out the moves:


  Round 1:

  A (biologist, or skeptical friend): The phrase "survival of the fittest" is either
  false or circular. If fittest just means "those that leave the most offspring,"
  then the claim that the fittest leave the most offspring is true by definition and
  explains nothing — it''s a tautology. If fittest means something else like strongest
  or fastest, then the claim is false — the fittest don''t always leave the most offspring.

  B: That''s exactly why people use the propensity interpretation. Fitness isn''t
  actual reproductive success; it''s a probabilistic disposition to produce offspring
  in a given environment. Like a biased coin has a propensity to land heads more often,
  an organism has a fitness relative to an environment. Actual survival and reproduction
  are evidence of the propensity but not identical to it.


  Round 2:

  A: Fine, but a propensity is unobservable. The only way you know a coin is biased
  is by flipping it a bunch. So fitness is inferred from the very frequencies it''s
  supposed to explain. It''s the classic dormitive-virtue move: you observe that this
  moth genotype out-reproduces the other, and then "explain" it by saying it has a
  higher fitness. You''ve just renamed the data.

  B: Not true. You can measure the physical basis of fitness independently — camouflage,
  foraging efficiency, metabolic rate, viability of larvae — and then use it to predict
  future frequencies before you''ve counted them. That''s a genuinely risky prediction.
  A fair coin and a biased coin aren''t just summaries of outcomes; the bias is a
  real feature of its construction. Same with organisms.


  Round 3:

