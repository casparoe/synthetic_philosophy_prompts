  environment into the propensity. Fitness is always relative to an environment, so
  the "disposition" changes whenever conditions shift. That makes it flexible enough
  to fit anything: if the moth does poorly next season, you''ll say the environment
  changed or you mis-specified the environment. So the purported explanation is unfalsifiable
  in practice.

