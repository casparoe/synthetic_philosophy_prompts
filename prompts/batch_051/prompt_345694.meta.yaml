  ---


  The political obligation debate has been stuck for as long as I''ve been reading
  it, and my discussion group is now rerunning the same moves without anyone changing
  position. Consent theorists say we owe obedience to the law because we have consented—by
  voting, taking public benefits, using state services, or simply not emigrating.
  Fair-play theorists say the obligation comes instead from receiving the benefits
  of a cooperative scheme: once we accept the goods the state provides, we owe our
  fair share of doing what it says, whether or not we asked for those goods. Associative
  theorists say membership itself does the work—being born into and continuing to
  live within a political community binds us in something like the way family membership
  does. Against all of this, philosophical anarchists rejoin that no actual state
  secures meaningful consent, that unsolicited benefits cannot generate debts (the
  old neighbors-with-a-loudspeaker move), and that appeals to membership either sneak
  consent back in or beg the question by treating the fact of membership as though
  it were already a normative status. The defenders then reply that the anarchist''s
  notion of "meaningful consent" is so demanding it would rule out obligations almost
  everywhere, while the anarchists reply that this is precisely the point. And around
  we go.


  What makes the impasse feel tractable to me is that everyone in the room agrees
  on the descriptive facts: almost nobody consents in any robustly voluntary sense;
  states do supply genuine benefits; most people nonetheless feel bound. They also
  agree that not all obligations arise from consent—we have duties not to harm others,
  whatever we have agreed to. Yet nobody moves. My working hypothesis, which I''m
  offering only as a hypothesis, is that this is less a substantive moral disagreement
  than a disagreement about defaults: one side treats obligation as the normal condition
  needing a defeater, while the other treats no-obligation as the normal condition
  needing a positive ground, and each side''s arguments are only persuasive once its
  own default is already assumed. But it may instead be a verbal disagreement about
  the word obligation, a methodological dispute about whether exotic hypotheticals
  or ordinary political life should count as the data, or two groups answering different
  questions under one heading (something like "what obligations would a legitimate
  state generate?" versus "what obligations do actually existing states manage to
  generate?"). How would you diagnose what kind of disagreement this is? And on that
  diagnosis, what would actually count as progress—or is this a case where we should
  stop expecting movement?


