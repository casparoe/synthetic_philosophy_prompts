  fix things, stops depending on shops and employers — we tend to call it admirable:
  self-reliant, resilient, grounded. Some people roll their eyes if it goes too far,
  but the baseline reaction is respect. If a nation-state tries the same thing, though
  — food and energy autarky, import substitution, closed borders, making sure it doesn''t
  depend on other countries for anything essential — most of us, including my students,
  call it economically ruinous, paranoid, even a warning sign. The word "autarky"
  basically functions as an insult. Same aspiration, two very different judgments.
  The obvious move is that persons and states are just different kinds of things,
  so of course the standard is different. But when I push on it, I''m not sure what''s
  doing the work: we also think a person who can''t accept help is emotionally stunted,
