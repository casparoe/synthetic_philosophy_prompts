  the argument only appears to work because it treats the two bets as a package and
  assumes the agent must value the package at the sum of its parts. But package acceptance
  is an extra step. The agent can say: I will buy the heads ticket for 60 cents if
  offered it on its own, and I will buy the tails ticket for 60 cents if offered it
  on its own, but I will not buy both, because I can see that the pair costs $1.20
  and returns $1. Saying fair prices are 60 and 60 does not commit me to a fair price
  of $1.20 for the bundle; the value of a bundle can fail to be additive when the
  items interact, and two state-contingent tickets interact by sharing the same state
  space. So the argument is circular: it needs a principle of composition — that individually
  fair bets remain jointly acceptable — and that principle is itself one of the things
