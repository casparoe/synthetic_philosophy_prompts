  said, and it''s not about a malicious bookie. Take someone who sets a fair price
  of 60 cents on a ticket paying $1 if this coin comes up heads, and 60 cents on a
  ticket paying $1 if it comes up tails. The two tickets together guarantee exactly
  $1. Yet by the person''s own lights the pair is worth $1.20, since each ticket is
  worth 60 cents. That is an inconsistency in their evaluations themselves, visible
  without any bookie. The bookie just makes the inconsistency vivid. So a Dutch-bookable
  agent isn''t merely exploitable; their system of degrees of belief conflicts with
  the logic of the propositions they''re beliefs about. To tolerate a sure loss is
  to in effect price a tautology below certainty, or price two exhaustive possibilities
  above certainty, and that''s exactly the kind of thing ''irrational'' should mean.


