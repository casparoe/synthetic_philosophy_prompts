  that the story keeps returning to. The source of a narrative is whatever actually
  produces the story: the psychological system that selects which episodes belong,
  assigns them salience, and supplies the narrative''s characteristic biases and omissions.
  My central claim is that the center-of-narrative-gravity view of the self secretly
  runs these two together, and that the view survives only if we split it in two.
  The self-as-center is a construct: it can be an abstraction or a useful fiction,
  precisely because it is just the point where the mass of first- and third-person
  stories about a life balances. But the self-as-source cannot be a useful fiction
