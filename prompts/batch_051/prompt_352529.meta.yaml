  Argument sketch:

  1. Risk-weighted expected utility (REU) permits risk-aversion that isn''t captured
  by utility curvature, by letting the agent weight probabilities with a risk function
  r.

  2. For any two-outcome gamble, a REU maximiser with risk function r behaves exactly
  like an expected utility (EU) maximiser who assigns probability r(p) rather than
  p to the better outcome.

  3. Since subjective probabilities are not directly observable but are inferred from
  choices, there is no behavioural difference between "distorting probabilities" via
  r and "having different subjective probabilities" to start with.

  4. Any REU maximiser can therefore be redescribed as an EU maximiser with a suitably
  chosen subjective probability function (one that maps objective p to r(p) for each
  gamble).

  5. But REU was meant to explain choice patterns, such as the Allais preferences,
  that EU allegedly cannot accommodate.

  6. If REU and EU are behaviourally interchangeable, then REU cannot explain anything
  EU cannot; conversely, if REU does explain the Allais pattern, then (4) must fail.
  So either the original motivation for REU collapses or the theory is nothing more
  than EU in disguise.


