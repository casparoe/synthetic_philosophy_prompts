  Draft:


  "I run a monthly discussion group for adults who like to argue about rational belief
  but have no formal training in philosophy — the regulars are an actuary, a nurse,
  a retired schoolteacher, and a couple of high-school debaters. We have spent the
  last two meetings circling around one question: what does it take to say that a
  person rationally believes something? It is now my turn to lead a ninety-minute
  session, and I want to push the group into two familiar-looking puzzles I keep failing
  to keep separate in my own head. In the lottery puzzle, there is a fair lottery
  with a million tickets and one guaranteed winner. For any particular ticket, it
  seems rational to believe that it will lose; at the same time, it seems rational
  to believe that one of the tickets will win. So a person ends up with a set of beliefs
  that cannot all be true. In the preface puzzle, an author writes a book and checks
  each sentence so carefully that she rationally believes every sentence; she then
  writes in the preface that, nonetheless, at least one sentence in the book is probably
  false. Again, she holds beliefs that cannot all be true. The group can handle something
  thorny, but I do not want to lecture for ninety minutes."


  "I am not asking you to explain the puzzles to me. I am asking you to plan the session:
  the order in which the pieces have to be introduced and what depends on what. Specifically,
  which puzzle should come first, and what has to be in place before the second one
  can do its work rather than look like a rerun of the first? I have been assuming
  the lottery should be the carrying example because it is numerical and clean, but
  I have begun to suspect that the numbers push people toward a boring dispute about
  probability thresholds and away from the deeper trouble. Is that suspicion right,
  and if so, what example should carry the whole session instead, and what does that
  example need to have — and need not to have — if it is to keep the real difficulty
  in view? I also want a map of where the group will go wrong. My guesses are that
  someone will say rational belief just means believing what is more likely than not;
  someone will say the author has simply made a mistake by believing every sentence
  once she admits error; and someone will say the contradiction dissolves because
  there is no rule forcing a person to believe what obviously follows from things
  she already believes. For each of these — or for better ones, if I have misdiagnosed
  the group — where in the sequence should I head it off, and how should I use it
  rather than just refute it on the spot? Finally, what one question or tiny task
  at the end would show me that they have seen the shared problem and not just concluded
  that rationality is messy? And what should I tell them I am leaving aside tonight,
  so that a question about something else does not take over the room?"


