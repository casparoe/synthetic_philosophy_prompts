  that cannot all be true. Second, the preface puzzle: an author writes a carefully
  checked book and believes each sentence in it, but also honestly writes in the preface
  that at least one sentence is probably false — again beliefs that cannot all be
  true. The group can handle something thorny, but I don''t want to lecture."


