  Final draft:


  For some time I have been working with a distinction between sponsored and unsponsored
  assertion, and I want it checked before I continue relying on it.


  By a sponsored assertion I mean an assertion with an agent behind it who is answerable
  for its truth: someone who can be asked to defend it, who is expected to have arrived
  at it through some minimally competent relation to how things are, and who stands
  to lose credibility if it fails. A person who says "the train leaves at six" sponsors
  that sentence. On Frankfurt''s picture, the liar and the bullshitter are both sponsors
  with different defects: the liar sponsors a sentence he takes to be false while
  intending to mislead; the bullshitter sponsors sentences while indifferent to their
  truth. Both failures are failures of a truth-answerable agent.


  By an unsponsored assertion I mean sentence-shaped output that carries the surface
  demands of assertion — it has the grammar, the confident register, and the implicature
  of testimony, and it invites the reader to take it as information — but that has
  no truth-answerable backer within the system that produced it. The system is not
  indifferent to truth as a bullshitter is, since indifference is a defect of an agent
  that could have cared. It does not regard its output as false, as a liar does. It
  is neither in the business of caring nor not caring. I want to say that unsponsored
  assertion is a fourth posture, not a blend of lying, bullshit, and error.


  My central claim is that most of the dispute about whether LLM hallucination is
  lying, bullshit, or error is mis-posed. Hallucination is best classified as unsponsored
  assertion. It belongs to none of the three standard categories because each standard
  category requires a sponsor standing in some defective relation to truth; the model
  lacks the sponsor, not the virtue. The evaluative consequences therefore land entirely
  on the human beings and institutions who choose to present the output as if it were
  sponsored — the publisher who lets a generated statistic into an article, the company
  that puts the model in front of customers with no disclaimer, the reader who converts
  unowned sentences into private belief. On this view a model cannot lie, but a person
  can lie with one; a model cannot bullshit, but an institution can bullshit through
  one.


  A case I think the distinction handles: a newsroom publishes an AI-generated figure
  without checking it. Ordinary reaction oscillates between saying the model hallucinated,
  confabulated, or made things up; my distinction says the model did none of those
  things — it issued an unsponsored assertion — while the newsroom may have committed
  a familiar epistemic wrong (likely reckless bullshit or negligent error). I also
  think the distinction predicts that treating hallucination as a moral failing of
