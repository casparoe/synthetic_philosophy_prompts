  For several years I have distinguished what I call sponsored from unsponsored assertion,
  and I want the distinction checked before I use it any further.


  By a sponsored assertion I mean an assertion made by an agent who is answerable
  for it: someone who can be asked to defend it, who is expected to have formed it
  through some minimal competent relation to the truth, and who stands to lose credibility
  if it fails. A human who says "the train leaves at six" sponsors that sentence.
  Frankfurt''s liar and bullshitter are both sponsors. The liar sponsors a sentence
  he believes false while intending to mislead; the bullshitter sponsors sentences
  while being indifferent to their truth. Both are defects of a sponsor, different
  defects.


  By an unsponsored assertion I mean a sentence-shaped output that carries the surface
  demands of an assertion — it looks like testimony, it gets written in the same registers,
  it invites uptake — but has no truth-answerable backer inside the system that produced
  it. The system is not indifferent to truth the way a bullshitter is, because indifference
  is a failure of an agent who could have cared. It does not believe false the way
  a liar does. It is not in the business of caring at all. I propose that "unsponsored
  assertion" is a fourth posture, not a combination of lying, bullshit, and error.


  The central claim: most of the debate about whether an LLM hallucination is lying,
  bullshit, or error is asking the wrong question. Hallucination is primarily unsponsored
  assertion; it belongs to none of the three because each of the three requires a
  sponsor with a defective relation to truth. The interesting normative consequences
  all land elsewhere — on the institution or person who chooses to present the model''s
  output as if it were sponsored, on the platform for making the output indistinguishable
  from sponsored testimony, and on the user who reads unsponsored outputs with sponsored
  trust. This is why a model cannot be said to lie but can be used to lie, and why
  a model cannot bullshit but can be used as an engine of bullshit.


