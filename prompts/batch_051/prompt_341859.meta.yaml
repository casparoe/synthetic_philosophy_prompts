  I am an undergraduate taking a philosophy of science course, and we have just finished
  the unit on underdetermination: Duhem''s point that a prediction always tests a
  whole network of theory plus auxiliary assumptions, so a failed test does not tell
  you which element to blame; Quine''s stronger claim that, with enough adjustment
  elsewhere in the web of belief, any hypothesis can be preserved in the face of any
  evidence; and the usual distinction between a transient underdetermination that
  later evidence breaks and a permanent underdetermination that no evidence could
  break. I want to stress-test these ideas against a real scientific controversy rather
  than the stock examples.


  Take the debate over the cause of the end-Cretaceous mass extinction, the K-Pg boundary
  about 66 million years ago. The broad facts are these. One camp, following the Alvarezes,
  proposed a bolide impact: an iridium-rich asteroid striking near what is now Chicxulub,
  Mexico, producing the global iridium layer, shocked quartz, tektites, soot from
  wildfires, and a dust cloud that shut down photosynthesis. The main rival proposed
  that the massive Deccan Traps flood volcanism in India, erupting over roughly the
  same interval, released enough carbon dioxide, sulphur dioxide and other material
  to drive the extinction, with some of its advocates arguing that volcanism could
  also account for the iridium anomaly. Over the following decades the Chicxulub crater
  was identified and dated to the boundary, and the timing of the Deccan eruptions
  relative to the extinction was refined; most, though not all, geologists now favour
  the impact as the primary cause, with the role of the Deccan Traps still argued.


  Analyse this episode through the lens of underdetermination. In particular: (a)
  During the 1980s and 1990s, did the two hypotheses truly share the same body of
  evidence, or did each camp have its own favoured evidence and its own auxiliary
