  Evidential Decision Theory (EDT): choose the action that provides the best evidence
  about the world. In Newcomb''s problem, EDT one-boxes because one-boxing is evidence
  that the predictor predicted one-boxing. CDT two-boxes because the prediction is
  causally fixed. "Evidential cooperation in large worlds" extends this: in a large
  world with many similar agents, your action can be evidence about the actions of
  other correlated agents even when there is no causal channel. E.g., if you and many
  others are all copies of the same code/psychology asked to donate in an anonymous
