  "I am an undergraduate in a course on the philosophy of perception and epistemology,
  currently working through Sellars and the responses to his attack on the given.
  We have to write a position statement, and I have a set of commitments I find myself
  wanting to hold all at once. I''d like an audit of the set before I commit to it
  in writing. I''m not asking for a survey of possible positions; please take a definite
  stand about where the pressure points are, which pair or larger subset does the
  most damage, and what I should revise first.


  Here are the commitments:


  1. The given is a myth. There is no self-justifying stratum of experience or awareness
  that can serve as the foundation for empirical knowledge simply in virtue of being
  present to the mind. In particular, nothing with merely non-conceptual content can
  play that justificatory role.


  2. Ordinary perceptual beliefs are nonetheless non-inferential. When I form the
  belief that there is a red mug on the desk in good light, that belief is justified
  by my experience even though I do not run through any argument from premises about
  how things look or what I sense.


  3. Only states with conceptual or propositional structure can stand in rational
  justificatory relations to a belief. A state that cannot function as a premise or
  a reason cannot function as evidence.


  4. Some non-language-using animals have perceptual knowledge of their immediate
  environment. My dog knows someone is at the door; she is not merely responding to
  stimuli.


  5. There are raw feels: non-conceptual qualitative aspects of experience that outrun
  what I can classify or articulate. I do not think these raw feels are themselves
  reasons for any belief; they are sensory residue that remains after the conceptual
  content of experience has done its epistemic work.


  6. Being caused by the environment is not by itself enough to justify a perceptual
  belief. For a perceptual belief to be justified, the subject must have the ability
  to situate it in the space of reasons, for example by indicating what would count
  for or against it.


  For each pair, and for the set as a whole, tell me whether the tension is real or
  merely apparent. Rank the real tensions by severity, say which commitment would
  have to be revised or abandoned first, and explain what that single revision would
  cost me with respect to the others. I want to know where my position actually breaks,
