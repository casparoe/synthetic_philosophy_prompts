  that students need the hard version of the view before they can sensibly criticize
  it, so the octave should give the strong, genuinely materialist determinism: not
  ''money explains everything'' as a vulgar slogan, but the claim that the forms of
  law, state, religion, and art are, in their actual historical content, shaped —
  conditioned, made intelligible, in the last instance determined — by the organization
  of production, by property relations, and by class position; that the hand-mill
  is not simply accompanied by a caste of feudal lords but is part of why feudal lords
  and feudal piety take the shape they do; and that the ruling ideas of an age stand
  in some non-accidental relation to the ideas of its ruling class. The volta, when
  it comes, should introduce the genuine objection from the ''superstructure striking
  back'': legal forms, religious idioms, and aesthetic conventions that persist long
  after their original economic basis has gone, that react back upon production, and
  that seem to have their own internal history; the problem that the base-and-superstructure
  picture looks increasingly mechanical the more one insists the direction of causation
  runs only one way, and that the base itself may be unintelligible without the interpretive,
  legal, and normative forms that are supposed to be mere superstructure. Your closing
  lines should not resolve this tension — not choosing sides or congratulating dialectics
  for dissolving the whole problem — but should leave the reader with both the explanatory
  force of the economic base and the stubborn resistance of the rest. The specialist
  should recognize the poem as about relative autonomy, determination in the last
  instance, and the long running dispute over whether the base explains everything;
  a reader who has never heard those phrases should still find it a good poem."


