  Prompt:


  "Adam Smith, in The Theory of Moral Sentiments, observes in passing—I won''t try
  to quote him exactly—that a man is more troubled by falling from a better to a worse
  condition than he is pleased by rising from a worse to a better one. I can''t stop
  thinking about this because it seems to describe something much wider than mood.
  The same asymmetry shows up in buying and selling: people typically demand more
  to sell an ordinary object they have been given than they would pay to buy it from
  someone else, even after very little time has passed. It also shows up in regret:
  a loss from a decision stings more than a foregone gain of the same size pleases.


  I want to know whether these are instances of the same underlying asymmetry, and
  whether anything justifies treating the two directions differently. Is there a defensible
  reason why losing should count as more important than gaining, or why possessing
  a thing should make it genuinely worth more to a person rather than merely seem
  worth more? I can see two possibilities: one is that the asymmetry is a mistake—a
  quirk of fear or attachment that we should try to correct. The other is that we
  are tracking something real, such as the fact that your current situation is the
  one you have already built around, so a loss threatens your actual plans in a way
  a possible gain never does.


