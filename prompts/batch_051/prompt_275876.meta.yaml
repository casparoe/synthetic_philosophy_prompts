  not simply "the practice collapses." Maya''s argument says "since a world in which
  everyone takes works without paying would destroy the practice...". That''s actually
  the generalization argument, not Kant''s test of contradiction in conception. So
  Amir''s correction is substantively right. But it''s plausible for a student to
  phrase it that way. Good.


