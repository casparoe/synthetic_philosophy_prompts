  universal law, not whether universal compliance would have bad consequences. That''s
  correct. But then he says he can will the narrow maxim because he can will that
  anyone in exactly that situation do likewise. The problem: for Kant, maxims include
  the act, its circumstances, and its end/purpose; the agent''s actual maxim might
  be narrowly self-serving and the universalization is trivially consistent only if
