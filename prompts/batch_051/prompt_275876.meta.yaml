  Key concepts:


  Kant''s Formula of Universal Law: "Act only in accordance with that maxim through
  which you can at the same time will that it become a universal law." Two tests:
  contradiction in conception (a maxim that cannot even be conceived as universal
  law, like false promising — if everyone made false promises, promising would be
  impossible) and contradiction in willing (you can conceive it but can''t rationally
  will it, like refusing to help others — you could conceive a world where no one
  helps, but as a rational being you can''t will it because you might need help).


  The "what if everyone did that?" objection: generalization arguments. Marcus Singer''s
  "Generalization in Ethics" (1961) argued that the generalization principle (what
  would happen if everyone did it) is distinct from the generalizability principle
  (universalizability in Hare''s sense). Hare''s universal prescriptivism: moral judgments
  are universalizable because they are prescriptive; if you judge "I ought to do X
  in circumstances C," you must judge that anyone in C ought to do X. Crucially, for
  Hare universalizability is a logical constraint on moral terms, not a consequentialist
  test of universal practice. Hare criticized the generalization argument: "If everyone
  did X, the consequences would be bad" is not the same as "It would be inconsistent
  to prescribe that anyone in exactly my situation do X when I prescribe it for myself."


  The problem of relevant description: any maxim can be universalized if described
  narrowly enough — "when I am exactly in this position with exactly these features..."
  This is a classic objection to Kant''s first formulation. The two-level approach:
  Hare''s critical thinking vs intuitive thinking; intuitive-level rules (don''t lie)
  handle the generalization.


