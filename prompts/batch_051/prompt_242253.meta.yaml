  Potential prompt:


  "As someone who teaches philosophy of history, I have repeatedly encountered the
  slogan ''the arc of the moral universe is long, but it bends toward justice'' deployed
  in seminar rooms and in public political rhetoric as though it were a single, settled
  claim. In my experience it is made to do far too much work: sometimes it is cited
  as an empirical generalization about the long-run direction of social change, sometimes
  as a reason to accept present suffering, sometimes as a thesis about the built-in
  logic of institutions, and sometimes as a barely disguised article of faith. I want
  to get clear on what exactly one might be asserting in saying this, and which versions
  can survive scrutiny.


  Please lay out, with as much precision as possible, the distinct claims the slogan
  could be making. For each reading, say whether it is a platitude, a substantive
  empirical thesis, a metaphysical or teleological doctrine, a normative commitment,
  or something else; say what evidence or argument would be needed for it; and indicate
  whether the slogan, so interpreted, could actually support the uses to which it
  is ordinarily put — especially the inference from ''there has been moral progress
  in some respects over long periods'' to ''present injustices will in time be corrected.''
  I am particularly interested in whether a purely descriptive reading could ever
  justify the practical trust people place in the claim, and whether the stronger
  providential or teleological readings are intelligible without any theistic or idealist
  metaphysics. If some popular readings are false or empty, I would like them identified
  as such."


