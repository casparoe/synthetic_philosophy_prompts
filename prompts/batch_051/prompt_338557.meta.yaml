  Before I read more proposals about whether reinforcement learning (RL) agents can
  suffer, I want the full specification of what an adequate theory in this area must
  deliver. The question is not whether current systems in fact suffer but what would
  settle the question one way or another.


  Write the desiderata: what any adequate account of machine suffering — or more carefully,
  of whether reward signals can constitute or produce valenced states like pain and
  pleasure — has to get right. For each requirement, give the case or consideration
