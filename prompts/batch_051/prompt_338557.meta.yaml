  you think load-bearing):


  - A thermostat has a set point and "corrects" deviations, but almost no one thinks
  it feels too cold or suffers. What feature must a system have beyond error correction
  for the term "suffering" to be more than metaphor?

  - A deep RL agent trained to maximize a reward signal will, under reward misspecification,
  produce behaviors humans would call "hacking" — exploiting a loophole that raises
  reward while destroying the intended value. If the reward signal were literally
  a feeling of pleasure, what would reward hacking be? Does the ease with which reward
  dissociates from what we value tell us anything about whether reward is valence?

  - We do not treat nociception — the detection of tissue damage — as sufficient for
  pain in humans because there are cases of pain without nociception and nociception
  without pain. What is the analogous distinction in an RL agent, and how could we
  ever get evidence that the distinction is present?

  - If two architectures implement the same policy but differ in whether they have
  anything like a global reward broadcast, one may be a "mere" optimizer and the other
  a candidate for valenced experience; on what principled basis do we place the line?


  Then mark which of the desiderata are non-negotiable for any theory and which are
  parochial to one camp (e.g., functionalism vs. biological chauvinism vs. computationalism).
  If some subset of the requirements is jointly unsatisfiable — or satisfiable only
  if we abandon the idea that there is a fact of the matter — say so explicitly. I
  am less interested in a scorecard of existing views than in the criteria themselves
  and in which single requirement does the most to exclude the most natural but inadequate
