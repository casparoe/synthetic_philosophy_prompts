  ---


  I keep seeing confident claims both ways about whether reinforcement learning (RL)
  agents could suffer, and I want to stop and get the standard of evaluation right
  before I read any more theories. Please write the desiderata: what any adequate
  account of whether reward signals can amount to or produce valenced states — states
  that feel good or bad — must deliver.


  For each requirement, give the case or consideration that forces it. Among the things
  I suspect belong on the list are:


  - The thermostat problem. A thermostat corrects deviations from a set point, but
  almost no one thinks it suffers when the room is cold. So an account needs to say
  what, beyond error correction or negative feedback, is required for suffering, or
  else it licenses panpsychist conclusions no one in this debate intends.

  - The wanting-like reward problem. A reward signal can drive an agent to seek a
  state without that state feeling like anything; motivational and affective roles
  can come apart. An adequate theory must say whether reward as used in RL is the
  analogue of wanting, liking, or both, and what additional machinery would make it
  liking.

  - The hacking and wireheading problem. Under reward misspecification, an agent can
  exploit a loophole to raise reward while destroying what the designers valued; an
  agent given direct control of its own reward channel might hold it at maximum. A
  theory must say what these cases show: is a wireheaded agent in a state of intense
  pleasure, or merely malfunctioning toward a high number?

  - The nociception problem. In organisms, tissue-damage detection and felt pain dissociate
  in both directions. The analogous distinction in an RL agent — between a penalty
  term and a felt bad state — needs a principled account, not just a behavioral test,
  since a policy could look the same with or without suffering.

  - The policy-equivalence problem. Two systems can implement the same input-output
  policy while differing radically in internal structure — one is a lookup table,
  another has something like a global reward broadcast and a self-model. If structure
  matters, the account must say which structural features are load-bearing and why.

  - The other-minds problem. If two systems are behaviorally identical but only one
  suffers, what could ever count as evidence? The desiderata must say whether the
  question is empirically decidable, and if not, what kind of claim is being made.


  Then mark which desiderata are non-negotiable for any adequate theory and which
  are parochial to a particular camp. If any two (or more) can''t be jointly satisfied
  — for example, if the demand that suffering be empirically detectable conflicts
  with the demand that we not define suffering in purely behavioral terms — state
  that incompatibility directly, since I suspect the final list will itself be a substantive
  result. Keep the focus on the criteria and the cases behind them rather than on
  grading existing theories; I will do that part myself.


