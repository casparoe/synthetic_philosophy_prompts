  Let me think about actual positions in the equipoise debate:

  - Clinical equipoise (Freedman 1987): an RCT is ethical only if there is honest,
  professional disagreement among expert clinicians about the preferred treatment,
  i.e., no consensus that one arm is superior. At the individual level, if a physician
  has a preference, can still randomize if they recognize their preference is not
  shared by the community; they can''t enroll if they have a definite preference and
  the community agrees.

  - Theoretical equipoise (Fried): an individual physician must be genuinely uncertain
  (50-50? Actually "genuine uncertainty/indifference" between arms) to offer randomization.

