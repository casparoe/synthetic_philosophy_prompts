  doesn''t meet standard? Hmm. Alternative: "non-exploitation" view (Emanuel, Wendler,
  Grady''s framework) — research is ethical if risks minimized, consent respected,
  fair subject selection, etc., not requiring equipoise. Others: "integrative" views;
  "de minimis" risk trials.


