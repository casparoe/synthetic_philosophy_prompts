  ---


  I''m working on a long essay about an argument that has been running, in different
  vocabularies, for more than two thousand years: the dispute between the Mohists''
  impartial care (jian''ai, usually rendered "universal" or "impartial care") and
  the Confucians'' graded love. I want the essay to be a diagnosis of the disagreement
  rather than a verdict for one side, and I''d like you to help me think it through.


  Let me lay out the positions as I understand them. The Mohists argued that partiality
  — caring more for one''s own parents, family, and state — is the engine of conflict:
  people favor their own and thereby neglect or harm others. Their remedy was that
  we should care for others'' kin and states in the way we care for our own, and they
  insisted this was both psychologically possible and, over the long run, mutually
  beneficial. The Confucian response, most sharply in Mencius, was that care naturally
  begins in the family and must be extended outward through graduated stages; a duty
  of equal care for all would, on this view, either be psychologically impossible,
  destructive of the special relationships that make moral development possible, or
  both. Mencius''s charge against Mozi is usually paraphrased as the accusation that
  impartial care amounts to having no father — that it denies the special place of
  one''s own parents.


  The same structure shows up in contemporary moral philosophy as the standoff between
  impartialists and partialists, with the usual moves on both sides well rehearsed:
  partialists point to the apparent moral requirement to save one''s own child before
  a stranger''s, impartialists reply that this is a pragmatic concession or a heuristic
  rather than a deep normative truth, partialists counter that the impartialist is
  smuggling in a view of agency from nowhere, and so on. Nobody seems to move.


  I want your diagnosis of why this debate has stalled, and what kind of disagreement
  it actually is. In particular: is this a substantive disagreement about a single
  question, a verbal disagreement about the word "care" or "love," or two groups answering
  different questions under one heading? Do the sides diverge over descriptive-psychological
  facts (whether impartial care is sustainable or whether graded love actually produces
  better outcomes), over normative standards (what would make a distribution of care
  correct), over starting intuitions that neither side can argue for, or over the
  concept of care itself? One hypothesis I''ve been toying with, which I''d like you
  to stress-test rather than confirm: the two sides are answering different questions
  — the Mohist/impartialist is asking what a good world looks like from nowhere, while
  the Confucian/partialist is asking what a good human life looks like from inside
  a web of relationships. A second possibility is that the dispute is kept alive by
  an unnoticed slide between three senses of care: care as an occurrent feeling, care
  as a stable policy of attention and action, and care as a claim on resources.


  Please give me your diagnosis in prose, engaging the positions as I''ve described
