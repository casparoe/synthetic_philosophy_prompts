  ---


  I chair what my hospital calls the "Access and Revenue Committee" — in plainer English,
  I''m the person who has to sign off every time the business office wants to take
  something patients currently get for free, by waiting, or by medical need, and make
  it something you can pay for. Every month or two they bring us a proposal: a concierge
  tier that lets people skip the line for primary care, a contract with a plasma company
  that pays donors, a scheme to sell priority scheduling for elective surgery, paid
  enrollment in clinical trials, stuff like that. I need a reusable procedure, not
  a fresh gut reaction each time, so I''m not just back-rationalizing whatever the
  CFO wants.


  I know there''s a whole philosophical literature on commodification and "repugnant
  markets," and people throw around terms like "corruption of a good," "blocked exchanges,"
  and "noxious markets," but I can''t turn any of that into a checklist. Please write
  me a decision procedure my committee can actually run on a proposal. It should ask
  the questions in order, say what counts as a sufficient answer to each, say where
  the procedure stops with a no, say where it says "allow but regulate" instead of
  banning, and — maybe most important — flag which steps are genuine judgment calls
  disguised as procedure, where the committee just has to make a values decision.


  A few constraints: the committee meets monthly for two hours; these proposals are
  usually lucrative and the hospital is short on money; the general counsel and chief
  medical officer both have to sign off; and my memo to them has to be one page. The
  procedure should handle the difference between "this will predictably harm or exploit
  people" and "this changes what the thing means, or how the people involved are valued"
  and "this just feels gross but we can''t say why." If those call for different treatment,
  the procedure should say so.


