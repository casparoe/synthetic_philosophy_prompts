  I am a novelist, and while plotting my current novel I have been leaning on a piece
  of craft advice that increasingly strikes me as both illuminating and possibly rigged.
  The advice, presented in a book on fiction I have been consulting, runs roughly
  as follows: treat each of a character''s values as a currency, and treat every dramatic
  choice as a foreign-exchange transaction. When a character trades fidelity for ambition,
  or mercy for order, they are selling one value-currency to purchase another, at
  a personal exchange rate that reveals who they are; the writer''s task is to know
  each character''s exchange rates and to hold them steady enough that the character''s
  choices feel inevitable in retrospect. So far, so useful. But the book then draws
  a stronger conclusion: beneath this surface of many local currencies, every well-constructed
  character must actually operate with a single underlying currency in which all of
  their values can be denominated, since otherwise their choices would be arbitrary
  and no reader could understand them. It even recommends constructing a value budget
  for each character on the model of a household or national budget.


  I would like you to audit this analogy in detail, because I suspect it may be smuggling
  in more than its author realises. Lay out explicitly what maps onto what in the
  currency picture; identify the points where the mapping breaks down; and separate
  the disanalogies that are merely decorative from those that matter for the intended
  conclusion. In particular, the analogy seems to import quietly from real money markets
  the ideas of fungibility, a common numeraire, exchange rates that converge on a
  single scale, transaction costs, arbitrage, inflation, reserve currencies, and even
  black markets. Which of those imported features do genuinely illuminating work in
  understanding a person''s commitments, and which of them assume exactly what the
  book is trying to establish? Most importantly: does the book''s conclusion survive
  the audit—that human values, however many they appear to be, must in the end be
  one thing in disguise, priceable on a single scale? If not, what would a better
  analogy be, and what would it correctly refuse to import from the world of money?


