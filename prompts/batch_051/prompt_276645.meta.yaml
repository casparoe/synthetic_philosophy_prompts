  ---


  "I have been using a principle that I''d like checked, because I''ve begun relying
  on it in arguments and I''m no longer sure it can bear the weight. I call it ''partition
  debt.'' The claim is that a statistical association reported from aggregated data
  is never simply given: it is computed at some chosen level of grain, and the person
  who reports it thereby owes the reader an account of the partitions of the data
  under which it holds. I also hold the stronger view that if an association reverses
  under a partition by a variable that is relevant to the outcome, the aggregate association
  is an artifact of binning rather than a fact about the world; the disaggregated
  comparisons are the honest ones, and only associations that preserve their direction
  across every defensible partition deserve to be called effects. Here is my standard
  example. Two interviewing panels, A and B, see junior and senior candidates. Panel
  A hires 10% of juniors and 75% of seniors; Panel B hires 20% of juniors and 80%
  of seniors, so B hires better within each level. But A interviews 300 seniors and
  30 juniors while B interviews the reverse, so A''s overall hire rate is about 69%
  and B''s is about 25%. I say the sentence ''Panel A hires better than Panel B''
  is simply false: the only genuine comparisons are the within-level ones, and anyone
  quoting the overall rate is confusing the coarsest partition with the causal grain
  of the data. I want to know whether this is a real concept or just a metaphor, whether
  the defensible version of it already exists under another name, what it gets right,
  and where it breaks. In particular: is there a case where the aggregated association
  is the more truthful one even though it reverses under a relevant partition, and
