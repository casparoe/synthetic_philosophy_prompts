  Then essay draft:


  Title maybe.


  "In discussions of tragic pleasure, two questions are often run together. The first
  is motivational: why do people seek out and sit through works that represent suffering,
  death, and injustice, when they avoid such things in real life? The second is experiential:
  why do they describe the experience of such works as pleasant or satisfying, even
  while reporting genuine sadness, pity, or horror? I suspect these are not the same
  question, and an answer to one need not answer the other."


  Then paragraph 2: "Consider a person who rereads a novel of disastrous ending. We
  can explain the reading behaviour by appeal to curiosity, reacquaintance, or a liking
  for the formal construction. None of that yet explains why the overall experience
  feels, to the reader, good. It might have been pursued for reasons other than felt
  pleasure, and still be felt as pleasant. So the first question can be answered by
  non-hedonic motives. The second cannot."


  Paragraph 3: "I propose to distinguish two layers of affective response. First-order
  responses are the emotions directed at the represented events: fear for the protagonist,
  grief at the death. Second-order responses are responses to one''s own first-order
  states: e.g., satisfaction that one''s fear is proportional to what the work invites,
  or pleasure in the precision with which the work elicits the response. The pleasure
  of tragedy, I suggest, belongs primarily at the second order. It is not the sadness
  that pleases, nor even a transformed sadness; it is the recognition that one has
  responded fittingly, and that the work has produced that response with economy."


  Paragraph 4: "This lets me object to conversion accounts in their traditional form.
  Hume, in his essay Of Tragedy, argued roughly that the painful passions excited
  by a tragic scene are converted into pleasure by the predominant force of beauty
  and eloquence in the representation. But if the second-order view is right, the
  pleasure does not need to be produced by converting the painful passion. The painful
  passion remains painful; what pleases is a different state, directed at the pain
  as well-fitted to its object. The two states can coexist without one having to dominate
  or transform the other."


  Paragraph 5: "A further advantage is that the second-order view can explain why
  badly made tragedy does not please even when it is equally saddening. It is not
