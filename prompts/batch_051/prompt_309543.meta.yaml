  Let me evaluate accuracy: The dogmatism paradox (sometimes Kripke''s/Harman''s)
  says: If S knows p, and S knows that if q were true then p would be false (q is
  counterevidence), then S can know q is false/misleading? More carefully: knowing
  p, and knowing q entails not-p, you can infer not-q via closure. So you can know
  any alleged counterevidence is misleading without examining it. Thus you''re justified
  in dismissing it, which sanctions dogmatism. The puzzle: why isn''t it permissible
  to ignore all counterevidence once you know something? The standard move: even if
  you know p, you don''t know that q is misleading? Wait if q entails not-p, and you
  know p, then by closure you can know not-q. So you can know q is false. But is q
  "misleading" in the same sense? Yes: misleading if it points to not-p while p. There
  are complications about losing knowledge upon getting new evidence, but you know
  q is false before examining. The paradox is that this reasoning seems to legitimate
  ignoring evidence.


