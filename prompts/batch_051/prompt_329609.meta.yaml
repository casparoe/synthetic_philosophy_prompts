  The model must reply as Davidson. Davidson''s known replies: (1) Charity is required
  for interpretation to get off the ground; error must be local and set against a
  background of massive agreement; (2) We can discover false beliefs because we can
  locate disagreement within agreement, using translation and attribution of desire/belief
