  belief is veridical by nature; we can''t make sense of a person whose beliefs are
  mostly false. Also his arguments about the omniscient interpreter: radical skepticism
  about other minds undermines the standard of truth itself. Interesting: Davidson
  claims if we can interpret at all, the beliefs must be mostly true, and it''s a
  refutation of conceptual relativism and general skepticism.


