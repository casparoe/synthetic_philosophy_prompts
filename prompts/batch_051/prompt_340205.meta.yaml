  ---


  In discussions I''ve followed on rationalist-adjacent blogs, I keep seeing the slogan
  "the numbers don''t count" invoked as a summary of T. M. Scanlon''s contractualism,
  usually in arguments about whether you may save a larger number of people at the
  cost of a smaller number. I suspect the slogan is doing too much work, and that
  different people mean quite different theses by it. I want you, as a professional
  moral philosopher who specializes in Scanlon-style contractualism and the aggregation
  literature, to lay out the distinct precise claims this slogan could be making,
  and to say for each whether it is plausible and whether it would actually support
  the use the slogan was being put to in those debates.


  The use I have in mind: someone defends the view that a principle permitting us
  to kill one person to prevent, say, five people from suffering comparable harms
  is impermissible, because the one person could reasonably reject a principle that
  treats his life as merely a unit to be summed against others. A critic replies that
  "the numbers don''t count" is absurd, since surely if the choice is between one
  death and five deaths, and nothing else differs, you should save the five. In other
  places I''ve seen the slogan used to deny that we may cause one severe harm to provide
  many people with small benefits (roughly the transmitter-room-style case, as I understand
  it, but I won''t pretend to have the details right). So the slogan gets deployed
  against both same-magnitude and different-magnitude trade-offs, and I can''t tell
  which target it is actually fitted for.


  I''d like you to separate several questions that might be getting run together.
  For example: Is the claim about what reasons individuals have to reject principles,
  or about what a principle is doing when it aggregates? Is it about the justificatory
  standard (must each person be able to accept?) or about a substantive side-constraint
  (never trade one life for five)? Does it deny that numbers ever matter, or only
  that numbers matter in a particular way, such as by summing small individual benefits
  to outweigh a serious individual burden? What would Scanlon''s actual contractualism
  need to say about cases where all affected persons face harms of the same kind,
  where the same person might benefit from the principle, or where the numbers are
  very large? For each reading, say whether it is trivial, defensible, false, or contested
  among people working in the area, and which readings would actually support the
  uses of the slogan I described.


  Please take this seriously as an exercise in philosophical disambiguation rather
