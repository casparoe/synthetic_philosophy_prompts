  Draft:


  "I am a high school student working through some philosophy of language on my own,
  and I have become interested in a view called inferentialism: the claim that the
  meaning of an expression is the role it plays in reasoning—the inferences it licenses
  and the inferences that license it—rather than what it denotes or represents. I
  find the view attractive, but my reactions to particular cases seem to pull against
  one another. I want a principle that captures my verdicts where possible, and an
  honest account of which verdicts it cannot save. I would also like the principle
  stated precisely enough to yield verdicts on cases I have not considered, with at
  least one such case worked through."


  Then cases:


  1. Connectives. "For ''and'' and ''or,'' I cannot find any meaning over and above
  their inference rules. Someone who can use the introduction and elimination rules
  correctly—from ''it is raining and it is snowing'' to ''it is raining''; from ''it
  is raining'' to ''it is raining or it is snowing''—knows what these words mean.
  Verdict: for the logical connectives, inferential role exhausts meaning."


  2. Coextensive terms. "''Renate'' and ''cordate'' pick out exactly the same animals,
  but they plainly differ in meaning. The difference seems to consist in the different
  inferences they support, such as from ''x has kidneys'' to ''x is a renate'' but
  not to ''x is a cordate.'' Verdict: this is exactly the kind of fact inferentialism
  explains well."


  3. Material inferences. "Some good inferences are not logically valid but seem meaning-constitutive:
  from ''Pittsburgh is west of Philadelphia'' one may infer ''Philadelphia is east
  of Pittsburgh.'' I would say this inference is good because of what ''west'' and
  ''east'' mean, not because of some separate empirical addition. Verdict: meaning
  includes material inferential connections, not just formal ones."


  4. Color vocabulary. "For ''red,'' I am not convinced. Knowing every inference involving
  ''red''—what typically causes it, what it is compatible and incompatible with—still
  seems to leave out what it is like to see red, or at least the fact that the word
  is answerable to a perceptible quality. Verdict: ''red'' has a non-inferential,
  representational residue that inferentialism leaves out."


