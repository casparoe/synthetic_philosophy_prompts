  Next week I''m presenting to the philosophy reading group at my university, defending
  a deliberately strong version of Abelard''s claim about sin and intention. The usual
  gloss is that Abelard is just saying the internal act is where the real moral action
  is — that the sin is in the state of mind, while the outer deed is merely its execution.
  I want to go further, and that''s the part I need help with.


  My thesis: on Abelard''s own principles, the completed outward act adds nothing
  whatsoever to the sin — not merely that it adds nothing in God''s eyes, but that
  it adds no moral badness, period. The difference between a murder and an attempted
  murder is, on this view, a difference in harm, in persistence or repetition of the
  will, in what earthly penalties we need for deterrence, and in scandal — but it
  is not a difference in how wicked the agent is. Once the will has consented to contempt
  of God, the body''s cooperation is morally inert with respect to the agent''s guilt.


