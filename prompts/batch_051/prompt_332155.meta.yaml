  analyzes sin as consent, and consent as resolving to do something one believes one
  should not do for God''s sake — so its object is already complete before any deed
  occurs; (2) the deed cannot add anything to sin because sin is a property of the
  will''s relation to God, not of states of affairs in the world; (3) our intuition
  that finishing the job makes it worse confuses moral badness with either the amount
  of harm or with the fact that a completed act usually takes more points of continued
  consent and nerve. I expect to get hammered on that last step.


