  than the usual game-theory illustration. In the scene, the Joker puts explosives
  on two evacuation ferries—one carrying civilians, one carrying convicts—gives each
  boat a detonator for the other''s bomb, and announces that if neither boat uses
  it by the deadline he will blow up both. The scene is usually called a prisoner''s
  dilemma, but I''m not sure that''s right: the choices may be more like a one-shot
  public goods game, Chicken, or an assurance game, and the passengers'' restraint
  is doing more than solving a payoff matrix. Read the scene through the philosophy
  and formal structure of the one-shot prisoner''s dilemma, the iterated prisoner''s
  dilemma, and evolutionary explanations of cooperation. I want you to say exactly
  where the prisoner''s dilemma model fits the scene and where it distorts it; whether
  the scene''s cooperation is explicable in terms of shadow of the future, reputation,
  or group selection, or whether the film is instead making a point that game theory
  would count as irrational; and whether the film itself seems aware of the difference
  between a one-shot interaction and the kinds of repeated interaction that evolutionary
  and iterated-game explanations rely on. In the end, tell me what the scene adds
  to the philosophical debate, and what the honest critic should concede it gets wrong.
  Also, tell me how confident you are in the reading overall and which single point
