  Content:

  - Student in PHIL 281: Philosophy of History / Social Science.

  - We read Karl Popper''s The Poverty of Historicism.

  - Two strands seem to conflict:

  A) In the book''s polemical passages, Popper denies that history has a plot or that
  there can be laws of historical development that warrant large-scale predictions
  about the future of society. He claims the growth of knowledge cannot be predicted
  because to know now what we will know later would be to know it now; hence the future
  of social institutions depends on unpredictable discoveries, and substantive long-run
  historical prophecy rests on a mistake (no laws of the whole historical process).

  B) Elsewhere Popper insists that the social sciences should not abandon causal explanation
  or systematic theory. He says there are sociological laws and the method of the
  social sciences is fundamentally the same as natural science: formulate universal
  hypotheses, deduce predictions conditional on initial conditions, test them. He
  also allows "trends" to be stated, as long as they are conditional on stable conditions;
  but trends are not laws.

  - The apparent tension: If there can be no laws of history in the sense of laws
  of historical development, how can social science issue law-based conditional predictions
  about the future? Conversely, if ordinary causal laws apply to social phenomena,
  why couldn''t enough of them be assembled to predict large-scale history? Is the
  prohibition merely epistemic (cannot know the whole) or metaphysical (no such laws)?

  - Ask: Are these two strands compatible? Candidate reconciliations: different senses
  of "law of history" (laws of the whole process vs. laws of individual mechanisms);
  different objects (historical wholes vs. open systems); the distinction between
  unconditional prophecy and conditional, ceteris paribus predictions; the distinction
  between trends and laws; the growth-of-knowledge argument as a special obstacle,
  not a denial of social-scientific laws.

  - Ask for verdict: which reconciliation is most textually honest and which is special
  pleading; whether Popper''s own position is stable; does he need the growth-of-knowledge
  argument or does the distinction between law and trend suffice?

  - Prompt-engineering: "You are a professor of philosophy of social science..." "Think
  carefully; begin by brainstorming possible reconciliations before evaluating them."
  "If possible, put pressure on each reconciliation and say which one survives."


