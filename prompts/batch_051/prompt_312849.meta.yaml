  Draft:


  "Consider the following criteria for rational theory change in science: a change
  is rational just in case the new theory is empirically testable, its advocates can
  state the evidence that counts against it and would change their minds if it appeared,
  and the transition is explainable by the scientific community''s shared epistemic
  values rather than by institutional power or rhetorical fashion. Now take a borderline
  case. A field has worked for decades inside a framework that makes precise predictions
  but has accumulated a set of persistent anomalies at its margins. A newer program
  treats those anomalies as central and offers a unifying explanation, but it is mathematically
  less developed, can make only semi-quantitative predictions, and its most distinctive
  tests await instruments expected in a decade or more. The field splits: the newer
  program''s advocates argue that the older framework survives only by tacking on
  adjustable parameters, while the older program''s defenders argue that abandoning
  quantitative precision for a promissory unification is exactly what a rational science
  should not do. Go through the criteria one by one and say whether this case qualifies
  as a rational scientific revolution. Then say whether the case fits Kuhn''s claim
  that during revolutions theory choice is still rational though not rule-governed,
  Popper''s claim that what matters is whether participants are willing to specify
  in advance what would refute them, or neither. Does the borderline case reveal that
  one of the criteria, or one of the two pictures of scientific rationality, needs
  to be amended?"


