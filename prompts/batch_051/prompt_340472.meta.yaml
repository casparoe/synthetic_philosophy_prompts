  Here''s the set of things I''m inclined to believe (call them my commitments):


  1. Commensurability. Pain and pleasure are on a single underlying scale of how good
  an experience is, with a natural zero between them. For any two episodes, I can
  in principle say which is better, which is worse, or that they''re level; and I
  can add values from different episodes to get a total.


  2. Additivity. If adding one more unit of pleasure is worth +1 to a life, adding
  it to two different people (or two different moments) is worth +2 overall, etc.
  So small benefits can accumulate without any cap.


  3. Lexical threshold. There is a threshold of pain severity somewhere around, I
  don''t know, genuine agony or torture. Above that threshold, no finite amount of
  mild pleasure is better than preventing one such pain. That is, no number of pleasant
  afternoons can make up for one person being tortured.


  4. Below-threshold tradeoffs. Below the threshold, I''m perfectly willing to trade
  pain against pleasure in the ordinary way: a mild headache can be outweighed by
  enough mild pleasures.


  5. Asymmetry. I think pains are weightier than pleasures overall — reducing a pain
  is more important than producing an equal-sized pleasure. But I don''t take this
  to be a rejection of commensurability; it just means the scale gives negative values
  more weight than positive ones.


  6. The threshold is real. The threshold isn''t just a pragmatic rule of thumb for
  when we should stop calculating. It marks a genuine structural boundary in how bad
  states of affairs can be.


