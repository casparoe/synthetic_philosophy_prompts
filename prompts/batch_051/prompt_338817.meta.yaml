  I keep flip-flopping on whether there''s a real moral difference between lying and
  misleading, and I can''t get the two sides to sit still. The view I''m most attracted
  to on paper is roughly this: lying is asserting something you believe is false,
  and assertion is a special kind of act. When you assert, you hand your hearer a
  kind of assurance; you put yourself on the line and invite them to rely on your
  say-so. Merely misleading someone—saying something true while knowing full well
  they''ll draw a false conclusion—still aims at the false belief, but it works by
  exploiting the hearer''s own background assumptions. On this view the hearer is
  partly responsible for the false belief they end up with, and that changes the wrong.
  The view has virtues I like: it explains why "well, technically I never lied" can
  be a legitimate moral defense in some contexts, why being lied to feels like a more
  intimate betrayal than being allowed to fool yourself, and it gives a clean-ish
  rule: don''t assert what you don''t believe.


