  Potential list:


  1. Aesthetic autonomy: the work''s artistic properties—form, style, narrative, expressive
  power—are internal to the object and can be judged without reference to the artist''s
  biography. The moral character of the maker is simply not an artistic property.


  2. The public-object argument: once a work is published or exhibited, it becomes
  a public artefact whose meanings and values are constituted in the encounter between
  audience and work, not by the artist''s private life.


  3. Inconsistency of selective purging: if we refused to engage with works by morally
  bad artists, we would have to quarantine much of the canon—Caravaggio, Wagner, Gauguin,
  and others—and virtually no one follows this principle across the board. The selective
  outrage is driven by fashion or availability of scandal, not by a principled position.


  4. Wrong-target argument: withholding appreciation or removing the work punishes
  audiences, fellow artists, and cultural memory, while the artist, especially if
  dead or insulated, often suffers little. The moral remedy should target the person
  through law and social sanction, not the object.


  5. Earning insight through imperfection: a work can embody moral insight, or can
  help us understand the human capacity for cruelty or self-deception, even if the
  artist did not live by that insight. The work may be wiser than the maker.


  6. Denial of endorsement: engaging with a work does not entail endorsing the artist''s
  actions, just as reading a book by a wrongdoer is not an act of friendship. Appreciation
  is a response to the work, not a moral certification of its creator.


