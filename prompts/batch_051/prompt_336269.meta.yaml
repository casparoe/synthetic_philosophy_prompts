  Category: ritual behavior as inferred from the archaeological record. Criteria:
  How do archaeologists infer that a pattern of objects reflects ritual rather than
  mundane activity? Common criteria (I should phrase as my criteria, like the examples):

  1. Non-utilitarian / surplus expenditure: labor or material spent beyond practical
  need.

  2. Structured repetition: actions repeated in a rule-governed, standardized way
  across time.

  3. Spatial segregation: activity confined to spaces set apart from quotidian use.

  4. Symbolic elaboration: objects bear signs or arrangements that depict or allude
  to something absent.

  5. Emotional or costly commitment: disposal of valuables, breaking of fine objects,
  no recovery of usable goods.


