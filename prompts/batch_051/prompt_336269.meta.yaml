  ---


  Suppose I hold that a deposit found in the ground earns the description ''ritual''
  only when it displays several of the following five features, which I treat as signs
  rather than as individually necessary conditions: (1) prodigal expenditure — material,
  labor, or skill beyond any obvious practical return; (2) invariant repetition —
  the same sequence of operations repeated with little variation over multiple generations;
  (3) spatial separation — the activity occurs away from the places where the objects
  were made and used; (4) deliberate arrangement — objects placed or sorted so that
  the pattern seems to refer beyond itself; and (5) renunciation of utility — usable
  or valuable objects broken, buried, or left unrecycled.


  Now consider a deposit excavated at a small settlement devoted to pottery production.
  Behind a bank of kilns, excavators find a masonry room containing thirty shallow
  basins, one built above another over roughly two hundred years. Each basin holds
  hundreds of cups from the same workshop, all of them smashed. The cups are unusually
  thin-walled and carefully burnished, but none shows scratching, staining, or other
  traces of use. Every cup was pierced through its base with a smooth-edged hole before
  firing, and the breakage is deliberate, not accidental. The sherds in each basin
  are graded by size into concentric rings, coarsest at the edge, finest at the center,
  and at the exact center of every basin sits a single intact miniature cup, one to
  two centimeters high, too small to hold more than a sip. The settlement''s domestic
  quarter contains intact, heavily used cups of the same type, but no basins, no sorting,
  and no miniatures.


  Is this basin deposit evidence of ritual, on my criteria? Go feature by feature;
  say explicitly where the features underdetermine the verdict; and then say whether
  the case exposes any of the five criteria as doing less work than it appears to
  do — for instance, whether prodigal expenditure, invariant repetition, and renunciation
  of utility merely redescribe the fact that a skilled craft tradition does something
  whose purpose you cannot recover. If you conclude the criteria cannot settle the
  case, say what additional evidence would settle it, and whether ''ritual'' is carrying
  its weight as an inference from objects. State your bottom line in the first sentence;
  give no preamble and do not restate the question; then give your reasoning.


