  (non-ergodic) processes, the ensemble mean (expected value) can diverge from what
  a single agent experiences over time — the time-average growth rate is determined
  by the geometric mean / log returns, not arithmetic mean. So a policy, market, charity,
  betting pool, insurance scheme, investment product, or redistribution mechanism
  that is "fair" or "profitable" in expected-value terms may actually make individual
  participants poorer with certainty over time, while someone else captures the difference.


