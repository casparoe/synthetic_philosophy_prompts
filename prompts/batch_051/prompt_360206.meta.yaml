  Let''s craft:


  "I''ve been using a distinction I call ''first-person aggregation'' vs. ''third-person
  aggregation'' to make sense of why Mill''s argument bothers me."


  Definitions:

  - First-person aggregation: a single person may trade a certain loss at one time
  against a greater gain at another time, because the same subject bears both. The
  sacrifice is "repaid to the same account."

  - Third-person aggregation: summing gains and losses across different people and
  treating the positive balance as if it were owed to a single account.


  Claim: The separateness objection is usually pitched as the claim that only first-person
  aggregation is legitimate because there is no single account in the third-person
  case. But Mill''s proof does something trickier: he never actually performs third-person
  aggregation at the point Rawls attacks. He first establishes that each person''s
  happiness is "a good to that person" — that''s first-person. Then he says the general
  happiness is "a good to the aggregate of all persons." The student reads that as
  a definitional slide: "to the aggregate of all persons" does not name a person who
  stands to the total happiness as each person stands to their own; it simply names
  the collection twice. The student''s term for this slide: "the unsponsored aggregate"
  or "beneficiaryless good."


  Then ask: Is this distinction between first-person and third-person aggregation
  doing real work, or am I just restating the objection in worse language? Under what
  interpretations of "good" does Mill''s inference go through, and do any of them
  survive my challenge? Give strongest objection to my claim that Mill''s proof relies
  on this slide; could a utilitarian reply that the inference is not meant to establish
  a moral principle at all, only to clarify what "desirable" means?


