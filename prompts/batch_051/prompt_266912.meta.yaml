  Draft:


  "I spent my career in the natural sciences, and I have only recently begun reading
  philosophy seriously. I have been working through Karl Jaspers'' The Question of
  German Guilt, and I find myself both impressed and puzzled by his taxonomy. As I
  understand it, he distinguishes criminal guilt, which a court adjudicates for individual
  acts; political guilt, which falls on all citizens of a state for the deeds done
  by that state, regardless of what any given citizen did; moral guilt, which concerns
  what I myself have done or failed to do; and metaphysical guilt, which rests on
  a kind of solidarity with all human beings such that I bear some responsibility
  for wrongs I did nothing to prevent. The category that troubles me is political
  guilt. It seems to be collective in a strong sense: it attaches to citizens as citizens,
  and it can outlive the generation that committed the wrongs. The claim that a polity
  can be guilty in this way, and that later generations inherit that guilt, looks
  to me like it might be either a morally important truth or a confused way of talking.
  I want to know whether there is any empirical or quasi-empirical content to it.
  So my question is this: How would one test the claim that a nation can bear guilt
  across generations in Jaspers'' political sense? I want a concrete design: what
  would you observe or measure, in whom, over what timescale? What pattern of results
  would support the claim that this is a real property of collectives rather than
  a metaphor or a social convention? And after the test comes back positive, what
  exactly would it have shown, and what part of the claim would remain untested? I
  am especially interested in where the operationalization does violence to the concept."


