  ---

  I am writing a short "philosophical profile" for a seminar, reconstructing the view
  of moral self-improvement that Franklin develops when he describes his attempt to
  attain moral perfection. Before I submit it, I want a consistency check. Here is
  the view I have distilled.


  (1) Moral perfection is a coherent and useful regulative ideal, even though it is
  not attainable; the ideal''s value lies in orientation and self-correction rather
  than in being reached.


  (2) The right method of moral improvement is roughly Franklin''s own: divide virtue
  into a fixed list of named excellences, attend to one at a time in a rotating cycle,
  and keep a daily chart in which each lapse is recorded, so that failure is tracked
  concretely instead of being vaguely regretted.


  (3) The ultimate object of this method is to render the virtues habitual and automatic,
  so that right conduct stops depending on case-by-case deliberation.


  (4) The undertaking should nevertheless be judged by improvement and happiness rather
  than by attainment. A person who falls far short of the ideal but is made better
  and happier by the attempt has not failed in the sense that matters.


  (5) A few visible faults in an otherwise decent person are not merely excusable
  but positively valuable: they lessen envy, put others at ease, and spare companions
  the discomfort of comparison.


  (6) Humility is to be cultivated by the same method as the rest of the virtues:
  enter it on the list, give it its week of attention, mark each failure, and gradually
  work it in as a settled disposition.


  (7) Acquiring the outward appearance of a virtue, even where the underlying trait
  is not fully possessed, is still a real gain for the project rather than a failure
  of it.


  Which of these commitments are actually in tension with one another, and which pairs
  only seem to be? For each genuine tension, assess how severe it is, identify what
  would have to be revised to remove it, and say how costly that revision is. Then
  tell me which single revision would make the overall view most coherent, and whether
  the resulting view is still recognizably Franklinian.

