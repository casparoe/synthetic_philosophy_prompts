  Conceptual engineering / ameliorative analysis key ideas:

  - Descriptive vs. normative questions about concepts: what does X mean vs. what
  should X mean?

  - Haslanger''s ameliorative project: asking what work we want a concept to do, then
  revising it to serve legitimate purposes.

  - Cappelen''s "Fixing Language": conceptual engineering as evaluating and improving
  representational devices; the "master argument" about conceptual change.

  - The "Cambrian explosion" of concepts? Actually Cappelen has the "Conceptual Engineering"
  terminology.

  - Objections: changing the subject (the "topic continuity" problem): if you revise
  a concept, are you still talking about the same thing or have you replaced the question?
  Strawson? Actually "changing the subject" is an objection to revisionary analyses.

  - Semantic externalism: meanings aren''t under our control; concepts may have hidden
  essences; speakers can''t just stipulate changes.

  - The implementation challenge: how do you actually get a revised concept to take
  hold?

  - The "familiarity" of concepts: the distinction between concepts, words, meanings,
  and extensions.

  - Carnap''s "explication": replacing a vague pre-theoretic concept with a precise
  one for scientific purposes; Carnap explicitly says the new explicatum can diverge
  from the explicandum. This is the historical ancestor.

  - The "ameliorative vs. conceptual analysis": Haslanger asks "What is gender?" vs.
  "What should we take gender to be?" Three questions: conceptual, descriptive, analytical.
  Actually Haslanger distinguishes: conceptual analysis (what do we mean), descriptive
  (what actually is), ameliorative (what should the concept be, given our purposes).

  - The "paradox of analysis."


