  My paper defends a revised Moorean position drawn from Principia Ethica, chapter
  VI, the chapter on the ideal. The passage I hang the interpretation on is the one
  in which Moore lists personal affection and aesthetic enjoyment together, says they
  include almost all the greatest goods we can imagine, and then treats each as an
  organic unity whose value depends on the presence of certain cognitive and emotional
  elements. I won’t quote the passage; I’ll distribute it and paraphrase it in those
  terms. My thesis is that Moore is best read as holding that beauty and friendship
  are not two separate highest goods but two mutually illuminating species of appreciative
  cognition: genuine appreciation of a person has an aesthetic, contemplative structure,
  and genuine aesthetic appreciation of an artwork involves a quasi-personal receptiveness
  to the object. The payoff is that Moore avoids the charge that his ideal reduces
  to a list of pleasant experiences, because on this reading the supreme goods are
  partly constituted by how one attends to the object, not merely by the resulting
