  Actually the standard strategy-stealing proof for Hex:

  - Assume second player has a winning strategy S.

  - First player makes an arbitrary first move m.

  - First player then pretends to be second player, following S.

  - When S calls for playing m (already occupied), first player plays an arbitrary
  empty cell instead, and from then on pretends m was that arbitrary cell... Wait
  the trick: extra stone cannot hurt. In Hex, having an extra stone is never a disadvantage
  (monotonicity). So if S calls for a cell already occupied by first player, first
  player plays anywhere (an "extra" stone) and continues as if he had played the called-for
  cell. The extra stone does not hurt. Since S is a winning strategy for second-player''s
  role, first player wins. Contradiction, so no second-player winning strategy.


