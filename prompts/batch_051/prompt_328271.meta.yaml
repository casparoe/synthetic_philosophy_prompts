  Let me draft the argument about average vs total value. Potential argument:


  Suppose we want a principle for evaluating whether adding a life makes the world
  better. The natural everyday intuition is that if the new life would be worth living
  (positive well-being), adding it is good, other things equal. But if we apply that
  stepwise, we might end up concluding that a world with a huge number of lives each
  barely worth living is better than a world with fewer very happy lives — the repugnant
  conclusion. The argument could try to prove that anyone who accepts that adding
  a happy life is good is committed to the repugnant conclusion, unless they accept
  something even more counterintuitive, like a lexical threshold or a diminishing
  marginal value of additional lives. The "proving too much" angle: the same stepwise
  reasoning might seem to prove that a larger city with slightly lower average happiness
  is always better, which conflicts with ordinary judgements about quality of life.


  Maybe a sharper argument: an argument that seems to prove that the average view
  and the total view are both self-defeating, because under each view there''s always
  a policy that improves the world but makes the other view worse. Something like:


  (1) In ordinary moral thinking, we evaluate changes by comparing the lives affected.

  (2) If adding a person with positive but below-average well-being is permissible
  or good, then by iteration we can improve the world by repeatedly adding such people,
  even though average well-being falls.

  (3) If instead we reject the addition because average well-being falls, we must
  hold that a single very happy person is better than a trillion slightly less happy
  people — which few would accept.

  (4) So either the total view or the average view leads us somewhere we don''t want
  to go.

