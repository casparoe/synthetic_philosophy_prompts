  Over the last year I have been trying to define a notion of "side effect" for AI
  systems that does not require specifying a full theory of value. I have arrived
  at a distinction that I want assessed before I build on it.


  I distinguish what I call path effects from option effects. A path effect is any
  difference between the actual state of the world after an action and the state the
  world would have been in had the agent done nothing. An option effect is a difference
  in which future states remain reachable from the post-action state compared to the
  reachable futures from the baseline state.


  My central claim is that a side effect is, properly speaking, an option effect.
  Breaking a vase is a side effect not because the world now contains broken porcelain
  — that is just a path difference — but because the action closes off the futures
  in which the vase is intact, can still be used, displayed, repaired, or given away.
  A robot that moves the vase from a table to a cabinet changes the actual path of
  the world while leaving almost the entire envelope of relevant futures open, so
  it has produced almost no side effect. A robot that deletes a backup merely changes
  a few gigabytes; as a path effect this is trivial, but as an option effect it is
  enormous because it closes off many recoveries. If this is right, an agent could
  avoid side effects by comparing the coarse-grained set of futures reachable from
  its post-action state with the set reachable from a do-nothing baseline, and by
  refusing actions that shrink the envelope, without ever needing a full value function
  — it would not need to know which futures are good, only whether they remain open.


