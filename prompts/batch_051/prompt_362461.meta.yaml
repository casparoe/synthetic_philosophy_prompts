  - R2: Levin''s universal distribution / mixture over programs? Actually similar.

  - R3: Minimum Description Length (MDL) with two-part codes: prefer shortest two-part
  description in a particular coding scheme; prior ∝ 2^{-L}, where L is a description
  in a practical language. This differs from Kolmogorov due to the coding scheme.

  - R4: Speed prior: P ∝ 2^{-K - c log t} biasing against slow programs.

  - R5: Simple "counting" prior over Turing machine enumeration: P ∝ 2^{-|program|},
  where |program| is length in a fixed language (not K, which includes the interpreter).

