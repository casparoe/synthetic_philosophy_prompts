  seems to me about as close to a tidy scientific theory as evolutionary biology ever
  gets. It says the unit of selection is the gene, or more precisely the replicator,
  and organisms are just vehicles that replicators build to get themselves copied.
  Lots of things click once you say that: altruism toward kin, selfish elements, why
  sex ratios do what they do, why we don''t see adaptations ''for the good of the
  species'' very often. On paper, I find the arguments hard to resist.


