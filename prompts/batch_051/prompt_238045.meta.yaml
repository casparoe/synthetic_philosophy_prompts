  I can''t shake. When I watched a sockeye dig a redd or a tundra swan pull off a
  migration, the thing that seemed to be living or dying, succeeding or failing, was
  the whole integrated organism — one coordinated life history thrown against an environment.
  It didn''t feel like a gene-level bookkeeping trick; it felt causal. The genome
  is pulled along, but the organism is the entity that actually meets selection. The
  phrase ''a gene for migration timing'' or ''a gene for territory defense'' sounds
  to me like the kind of post hoc abstraction I spent my career warning students against.


