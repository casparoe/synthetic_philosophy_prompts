  his way was to carry his mind into his laboratory, and literally to make of his
  alembics and cucurbits instruments of thought, giving a new conception of reasoning
  as something which was to be done with one''s eyes open, in manipulating real things
  instead of words and fancies.


  Since then I''ve adopted a policy: in my own thinking and in arguments, I don''t
  count a claim as a real belief unless I can state, in advance, something concrete
  it predicts or some operation I could perform that would make me more or less confident
  in it. If I can''t do that, I set the idea aside as ''words and fancies,'' even
  if the abstract argument feels compelling. I''ve caught myself doing this with e.g.
  debates about compatibilism, whether institutions cause growth, p-zombies, etc.
  It feels like the right kind of pragmatism, but I also notice it lets me dismiss
  clever arguments that might just be beyond my current ability to operationalize.
  Is my policy a defensible version of Peirce''s point, or have I turned a piece of
