  I have been working on a system that infers what users value from how they behave
  — clicks, purchases, dwell time — and I noticed something that has started to nag
  at me. The core assumption in inverse reinforcement learning is that, given known
  environment dynamics and observed behavior, one works backwards to a reward function
  under which that behavior comes out optimal (or near-optimal). The reward function
  is never directly observed; it is a hidden variable that is rendered visible only
  through the rationality assumption that the agent is maximizing it. Without that
  assumption, the observed behavior is compatible with indefinitely many reward functions.
  To make the inference tractable, one imposes constraints: simplicity, or maximum-entropy
  policies, or features that one refuses to radically reshape.


  This looks to me almost exactly like Donald Davidson''s problem of radical interpretation.
  There, an interpreter faces an agent whose behavior — linguistic and otherwise —
  is observed, while beliefs, desires, and meanings are all hidden. Davidson''s constraint
  is that one attributes beliefs and desires so as to make the agent come out mostly
  rational and, where observable, mostly right. As in inverse reinforcement learning,
  the hidden states are not read off from behavior; they are posited to explain it
  under a normative idealization. And as in inverse reinforcement learning, there
  is a residual underdetermination that has to be handled by constraints that feel
  more methodological than empirical.


