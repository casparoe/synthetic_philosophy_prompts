  I''ve been trying to work out whether Leibniz''s "best of all possible worlds" claim
  can be tested against a carefully drawn thought experiment, and I''d like you to
  reason through it with me.


  As I understand him, in the Theodicy Leibniz holds that before creating, God in
  effect surveys an infinity of possible worlds. A possible world is not just any
  set of facts; it is a complete, mutually compatible system of things, each of which
  could coexist with all the others. Since only one such world can be actual, God
  must have a sufficient reason to pick one, and that reason is that the chosen world
  has the greatest total perfection. Leibniz takes perfection to involve at least
  two features that can pull against each other: the world should be as rich and varied
  as possible in the kinds of beings and events it contains, while also being as orderly
  and lawlike as possible, because order and simplicity in the principles that produce
  variety are themselves a kind of beauty.


  Here is the case I want to test. Suppose there are two candidate worlds. In world
  A, there is exactly the variety of finite things we actually observe, but the underlying
  laws are beautifully few and general, and every apparent evil can be traced to a
  role that increases the overall variety without which that variety could not be
  had. In world B, there is slightly less variety—one entire class of conscious life
  is missing—but there is also one less kind of apparently pointless suffering: a
  particular form of animal pain that, in world A, occurs late in evolutionary history
  and seems to make no difference to any further good. By every ordinary measure,
  B looks better to us; by Leibniz''s stated criterion, though, it is not obvious,
