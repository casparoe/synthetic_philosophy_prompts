  Domain: fakes/forgery debate. Key philosophical positions:

  - Aesthetic empiricism: if a forgery is perceptually indistinguishable from the
  original, it has the same aesthetic value. The value of art is in how it looks/sounds
  (formalists).

  - Non-empiricist/historical: the value of a work depends partly on its history,
  achievement, provenance — who made it, when, what it represents in the development
  of art. A perfect copy lacks the achievement, originality, meaning.

  - (Goodman''s autographic/allographic distinction: for autographic arts like painting,
  identity of the work is tied to the history of production; a copy, even if indistinguishable,
  is not the same work. For allographic arts like music, works are defined by notation,
  and copies/performances can be genuine instances.)

  - "The perfect fake" thought experiments: van Meegeren''s Vermeer forgeries, etc.


