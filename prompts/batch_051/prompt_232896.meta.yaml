  Access-control vocabulary:

  - Subject/principal: an entity that can be granted or denied access.

  - Object/resource: what is accessed.

  - Permission/right: authorization to perform an operation on an object.

  - ACL (access control list): list attached to object specifying which principals
  may do what.

  - Capability: an unforgeable token/handle that confers authority to perform operations;
  possession of the capability is both necessary and sufficient; capabilities can
  be delegated; capability-based security treats authority as something held by subjects,
  not properties of objects.

  - Role-based access control (RBAC): permissions assigned to roles, principals assigned
  to roles.

  - Mandatory access control (MAC): system-enforced policy, not changeable by users;
  vs discretionary access control (DAC).

  - Ambient authority: authority exercised automatically based on the principal''s
  identity/environment, not on explicit designation—can lead to confused deputy problem
  (where a deputy with broad permissions is tricked into misusing them).

  - Revocation: taking back a capability; hard with capabilities (requires indirection),
  easy with ACLs.

  - Sandboxing / least privilege.

  - Root/admin: a principal whose will isn''t checked.

  - Confused deputy.

  - Delegation.

  - Authorization vs authentication.


