  Let''s explore pain asymbolia domain. Background knowledge: Pain asymbolia (also
  "asymbolia for pain" or "pain without unpleasantness") is a neuropsychological syndrome,
  often after insular cortex lesions or prefrontal lobotomy/cingulotomy, where patients
  can identify noxious stimuli as painful (they can discriminate sharp/dull, hot/cold,
  know they are being stuck with a pin) but lack the normal affective reaction: they
  don''t withdraw, don''t complain, may even laugh. They say "it hurts but it doesn''t
  bother me." Some patients under morphine or cingulotomy report similar. Philosophical
  distinction: sensory-discriminative vs affective-motivational components of pain
