  Philosophers debate: evaluativism (pain''s unpleasantness is built into its representational/evaluative
  content — representationalists like Michael Tye, David Bain) vs imperativism (pain
  is an imperative/command to change bodily state — Richard Hall, Colin Klein, Manolo
  Martínez) vs attitudinal views. Evaluativism: pain represents bodily damage as bad;
  that''s why it''s unpleasant. Imperativism: pain commands "stop that!"; unpleasantness
