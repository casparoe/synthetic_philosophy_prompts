  Let me design the Boltzmann brain argument.


  What is the Boltzmann brain argument? In brief:


  1. If the universe is very large (or eternal), with a future that contains endless
  random fluctuations (e.g., de Sitter space, thermal equilibrium with rare fluctuations),
  then over the full history, the number of "Boltzmann brains" — observers produced
  as random low-entropy fluctuations from thermal equilibrium — vastly outnumbers
  "ordinary" observers like us, who are the product of thermodynamically normal evolution
  (planets, biological evolution, etc.).


  2. We should reason as if we are randomly selected among all observers (or at least
  among observers sharing our evidence): the principle of mediocrity / self-sampling
  / typicality.


  3. Our evidence includes the fact that we seem to have a coherent sequence of memories
  and a relatively ordered local environment. Actually Boltzmann brains typically
  would have fleeting, disordered experiences, not coherent memories of a lifetime.
  But the argument can include the "Boltzmann brain" that happens to have exactly
  your current experience, including apparent memories. The key: among all observers
  having *exactly your current evidence*, most are Boltzmann brains that momentarily
  fluctuated into a brain-state identical to yours, including fake memories, and then
  immediately dissolve — compared to normal observers. Wait, but if we condition on
  exact current evidence, the numbers depend on measure. There''s a subtlety: normal
  observers have the same current evidence as you as part of a long life; the fluctuating
  brain has it for an instant. In eternal inflation / de Sitter, the number of both
  may be infinite, but the rate of Boltzmann brains can vastly exceed the rate of
  normal observers.


  4. Therefore, it is overwhelmingly likely that "I" am a Boltzmann brain, with all
  my apparent memories, including memories of scientific observations, being false.


  5. But if I am a Boltzmann brain, then the reasoning that led me to believe the
  universe is large/eternal and dominated by fluctuations is itself unreliable (since
  it is based on false memories of evidence).


  6. So the argument undermines itself: if it succeeds, I should not trust its premises;
  if it fails, it fails.


  Where does it go wrong? There are several candidate flaws:


  - Self-undermining: the conclusion "I probably am a Boltzmann brain" cannot be rationally
  accepted because if true, rational acceptance is impossible/untrustworthy. But self-undermining
  arguments aren''t automatically flawed; some skeptical arguments are self-undermining
  yet still force us to give up something.


  - The typicality/self-sampling assumption: we are not randomly selected among all
  observer-moments; the right reference class is observer-moments produced by "ordinary"
  physical processes, or only observers in universes/branches with histories connected
  to ours. This is question-begging if not justified; but maybe the premise to reject.


  - The measure problem: in an infinite universe, "number of observers" is not well-defined;
  ratios depend on an arbitrary cutoff/measure. So premise (1) is not well-formed.
  This is the standard physics response: the argument presupposes a well-defined measure
  over observers, but any conclusion is measure-dependent, and the measure that makes
  Boltzmann brains dominate may not be the one we should use. Also, there''s the "Boltzmann
  brain problem" for cosmological measures: any measure that predicts we are typical
  among observers must avoid BB domination. So the real issue: the argument proves
  too much only if we grant a naive counting measure; rejecting typicality across
  arbitrary observer-moments.


