  I''m a retired chemical engineer — spent thirty years doing process control and
  anomaly detection in refineries, and I''ve only recently started reading philosophy
  of science seriously. The mechanisms literature finally gave me words for a problem
  that used to drive me up the wall on night shifts: when the monitoring system flags
  something, how do you know whether it''s the same mechanism misbehaving or a different
  mechanism altogether? The detector just sees a departure from a learned baseline;
  it doesn''t see mechanisms.


  A friend of mine who teaches an upper-level undergrad course called Mechanisms and
  Explanation in the Sciences asked me to draft a final exam question for her. She
  wants something students can''t answer by reciting definitions — it has to force
  them to work through a real case. I''d like you to write the question, a model answer
  of about 700 words, and a marking scheme. And please, no reading lists or citations:
  the answer should be all conceptual work, not a lit review.


  Here''s the case I want the question built around. A continuous stirred-tank reactor
  runs an exothermic reaction with a cooling jacket and a feedback temperature controller
  — a standard PID loop. A novelty detector has learned a baseline from months of
  normal operation: reactor temperature tracks setpoint, cooling flow responds within
  a band, no oscillation. One night it flags a forty-minute episode in which temperature
  and coolant flow oscillate in phase opposition with growing amplitude until an operator
  intervenes. The incident review has to classify the episode, and the classification
  turns on whether this is the same mechanism perturbed (say, a gain parameter gone
  wrong), the same components reorganized into a different mechanism (a new coupling),
  or a different mechanism doing a similar job.


  So the exam question should do the following: state the scenario; ask the student
  to lay out at least two rival ways of individuating mechanisms and apply each to
  the episode; ask what further observations or tests would discriminate between the
  rival classifications; ask why the novelty detector''s flag, by itself, can''t settle
  the matter; and require the student to defend one classification while flagging
  what''s conventional or interest-relative in that choice. It should be answerable
  in 90 minutes and carry 25 marks.


  For the model answer, make it clear that mechanisms are individuated by their components,
  activities, and organization, not by the shape of the output time-series; that the
  same mechanism can produce very different outputs under parameter drift, while different
  mechanisms can produce identical outputs; and that an anomaly detector learns a
  statistical envelope, not a mechanism identity. Then it should work through the
  three candidate classifications for the episode and say what would favor each —
  for instance a step-response test, a structural model of the loop, or checking whether
  one parameter change accounts for the whole episode.


  For the marking scheme, give me five must-hit points at 5 marks each, with a one-line
  note on how students typically get each one wrong. The mistakes I''ve seen are:
  identifying the mechanism with the observed behavior, thinking a more extreme deviation
