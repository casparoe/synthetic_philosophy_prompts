  illegitimate: you can''t use your color vision to validate itself. Reliabilism says
  knowledge just requires reliable process, so the bootstrapping reasoning is valid,
  but intuitively it''s bad. Easy knowledge: Cohen notes reliabilism allows "easy
  knowledge" — e.g., from the fact that the table is red, you can infer it is not
  a white table illuminated by red light; or that your senses are reliable. That seems
  too easy and is a problem.


