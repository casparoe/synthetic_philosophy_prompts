  Let me make the argument:


  1. To block the tautology objection, adopt the propensity view: the fitness of a
  trait or genotype is its probabilistic propensity to contribute a certain number
  of offspring in a specified environment, not its actual reproductive output.

  2. A probabilistic propensity is a disposition that can be realized in many possible
  outcomes; in particular, a type with higher fitness can, in any finite population
  and any finite time, leave fewer offspring than a type with lower fitness.

  3. The empirical content of a hypothesis consists in what observations would count
  against it (falsifiability). [maybe]

  4. For any finite observed sequence of reproductive outputs, there is a probability
  assignment (a pair of propensity values) under which that sequence has high probability
  and which ranks the two types opposite to how sequence ranks them. So no finite
  sequence of outcomes rules out any fitness ranking.

  5. Therefore no finite data can ever count against an assignment of fitness differences;
  the claim "A is fitter than B" is empirically unfalsifiable.

  6. A theoretical claim that is empirically unfalsifiable is exactly the defect the
  tautology objection alleged — it is empty. So the propensity interpretation has
  not solved the problem; it has relocated it.

  7. If instead we make fitness answerable to data by identifying it with actual reproductive
  success (or taking actual success as constitutive of fitness), then "the fitter
  type reproduces more" is again true by definition. So we face a dilemma.


  Conclusion: the propensity interpretation either fails to avoid the tautology (if
  data-determinate) or fails to be empirical (if genuinely probabilistic). So the
  tautology objection cannot be answered.


