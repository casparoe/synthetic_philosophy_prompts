  Full draft:


  ---


  I''m a philosophy of biology PhD student working on the fitness concept, and I''ve
  been reconstructing the propensity interpretation''s reply to the tautology objection.
  In doing so I built an argument that now seems to prove too much: it appears to
  show that the propensity interpretation is caught in a dilemma — either it collapses
  back into the tautology it was meant to escape, or it makes fitness claims empirically
  undetectable. I don''t want to accept either horn, but I can''t locate the mistake,
  or whether there is one. The argument, as cleanly as I can state it:


  (1) The tautology objection is best met by defining fitness not as actual reproductive
  success but as a propensity: the probabilistic disposition of an organism or trait
  type to leave a certain number of offspring in a specified range of environments.

  (2) A propensity is not identical with its manifestation. So on this view it is
  possible, in any finite population over any finite number of generations, for a
  less fit type to out-reproduce a fitter one purely by chance.

  (3) If fitness is a probabilistic propensity, then no finite sequence of reproductive
  outcomes is logically inconsistent with any particular ranking of two fitness values:
  for any observed outcome, there is some assignment of propensities that makes that
  outcome likely while ranking the types opposite to how the observed outcome ranks
  them.

  (4) Empirical content requires that something be able to count against a hypothesis;
  if no possible finite observation can count against an assignment of fitness differences,
  then the claim that one type is fitter than another is empirically empty.

  (5) By (2) and (3), no possible finite observation counts against any assignment
  of fitness differences.

  (6) But a claim with no empirical content is just the tautology objection all over
  again, relocated to the level of evidence. The propensity interpretation therefore
  has not solved the problem.

  (7) The only way out is to let actual reproductive success determine fitness after
  all; but then the principle that fitter types reproduce more is again true by definition,
  and the tautology returns directly.


  Conclusion: either the propensity interpretation is vacuous or it is indistinguishable
  from the definitional view it replaced. So the tautology objection cannot be answered
  by going dispositional.


  I would most like to keep (1) and (2): if those go, I lose the propensity interpretation
  entirely. My suspicion is that something slips in the move from no finite sequence
  being inconsistent with a ranking to no observation counting against it (steps 3
  through 5), but I can''t say exactly what that something is, and I worry that a
  frequentist about evidence would tell me that''s just what empirical content amounts
  to. So: where does the argument first go wrong, and what does rejecting that step
  cost? If instead it doesn''t go wrong, tell me which premise I must swallow giving
  up, and what remains of the propensity interpretation if I do.


  Please also say what would change your mind about the diagnosis — what argument
  or consideration would make you locate the failure at a different step, or make
  you accept the conclusion — and where your reasoning is most likely to fail.


  End your answer with a single line in the form \answer{n}, where n is the number
  of the first step you reject, or 0 if you think the conclusion follows and no step
