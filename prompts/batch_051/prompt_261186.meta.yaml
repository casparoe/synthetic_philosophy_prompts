  I want a critical reading of Peter Shaffer''s Amadeus, in either the play or Milos
  Forman''s film, through Rawls''s account of envy in A Theory of Justice, and in
  particular through his category of excusable envy. Rawls''s opening move is to treat
  envy proper as a vice: being pained at another''s good even when that good takes
  nothing from you, a disposition that no moral principle asks us to cultivate. But
  he then makes room for a different species of the attitude, which he calls excusable
  envy: cases where it would be unreasonable to expect someone to overcome the feeling,
  because it is a predictable response to social arrangements that are themselves
  unjust or that systematically erode self-respect. On that picture, the moral diagnostic
  question about an envious person is not settled until you ask what the envy is responding
  to: the vice belongs to the person, but the excuse may belong to the arrangement.


  Amadeus is built almost entirely around Salieri''s envy of Mozart—an envy Salieri
  himself narrates, in a confession, with unusual self-awareness: he is the industrious,
  devout, socially established court composer, and Mozart is the vulgar, effortless
  prodigy in whom Salieri sees the talent he bargained with God for and was denied.
  The play seems to know the vice reading and the injustice reading and to keep both
  in play. But it also complicates a Rawlsian reading almost at once, because the
  distribution Salieri protests is not one of social goods: his quarrel is with God,
  over natural gift and its apparent misallocation, and his self-respect collapses
  while his worldly position stays secure.


  Write the reading I could use with a philosophy and literature class. I want it
  to do three things. First, apply the Rawlsian distinction carefully: which features
  of Salieri''s envy look like envy proper, which look like excusable envy, and whether
  the category even applies when the perceived injustice is cosmic rather than social.
  Second, work through concrete dramatic material—the confession frame, Salieri''s
  childhood bargain with God, his reaction to Mozart''s manuscripts, the masquerade
  if you know the play as well as the film, and the final scene of mediation—and say
  what each scene shows or complicates about the distinction. Third, be honest about
  where the lens fits and where the play resists it: does Amadeus ultimately treat
  Salieri''s envy as a moral failing, as a signal that something genuinely unjust
  has happened to him, as a mixture the philosophy has trouble holding together, or
  as something the play leaves genuinely undecidable? In the parts of the answer that
  are about Rawls, separate what is settled from what is genuinely contested among
  people who know the material, and do not present one disputed reading as the consensus.


