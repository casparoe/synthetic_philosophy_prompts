  (since equations covariant). They agree on M\H but differ inside.

  - Determinism: for a Cauchy surface S (in M\H), the two models have identical data
  on/for S but different developments inside H. So if the two models are distinct
  physical possibilities, determinism fails.

  - Substantivalist: manifold points are real individuals, so shifting the metric
  across points yields a different possibility — but must deny Leibniz equivalence:
  (M,g) and (M,h*g) as distinct. So substantivalism + determinism conflict. Options:
  (1) deny substantivalism (relationalism: points are not individuals; the two models
  are the same possibility); (2) modify substantivalism (sophisticated substantivalism
  / anti-haecceitism) denying that the models are distinct; (3) accept indeterminism.

  - Conclusion: not that GR is indeterministic; rather a dilemma for a certain metaphysics
  of spacetime (primitive identity of manifold points).


