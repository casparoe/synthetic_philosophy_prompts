  Let me write:


  "I''m a PhD student in philosophy working on early modern theories of the passions,
  and I keep returning to a puzzle about the place of hope in Spinoza''s Ethics. In
  Part III, in the definition of the affects, Spinoza defines hope as a fluctuating
  pleasure produced by the idea of a future or past event whose outcome we partly
  doubt; when doubt is removed, the same affect becomes confidence, not hope. Part
  IV, Proposition 47 then claims that the affects of hope and fear cannot be good
  in themselves, though Spinoza allows that they can be useful insofar as they restrain
  excessive pleasure; the underlying thought seems to be that hope always carries
  uncertainty and fear in its train, and that a person guided by reason would want
  less of both. So hope looks less like a virtue than an epistemic defect plus a hedonic
  patch.


  I''d like to put that account to work on Voltaire''s Candide. The obvious reading
  is that Pangloss''s optimism — his insistence that this is the best of all possible
  worlds — is a cognitive vice, and the book punishes it with earthquakes, syphilis,
  slavery, and the rest. But I''m not sure the novel is only attacking theoretical
  optimism; it also seems to track the passional economy of hope: characters constantly
  set their expectations on some future outcome — being reunited with Cunégonde, escaping
  Lisbon, recovering wealth in Eldorado, arriving at a comfortable retirement on the
  farm — and the narrative keeps showing that the hope itself, not just the events,
  is part of their misery. At the end, the little society''s rule of cultivating the
  garden looks suspiciously like Spinoza''s preference for what can be done and known
  in the present over what is uncertain and future.


  I want a careful philosophical reading of Candide through this Spinozist lens. Specifically:
  does Voltaire''s satire dramatize Spinoza''s claim that hope and fear cannot be
  good in themselves, or does it present a form of hope — perhaps hope directed at
  modest, local ends — that Spinoza''s definition would misclassify? Which episodes
  would you point to, and where does the work resist the Spinozist reading? I''d like
  a reading that treats both Spinoza and Voltaire as more than stalking horses: the
  result should not reduce Candide to an illustration of the Ethics, nor turn Spinoza
  into the village atheist. And please resist the temptation to force the pairing:
  if you think the Spinoza-Voltaire fit is essentially wrong, or that Spinoza''s target
  is not the same optimism Voltaire attacks, say so directly and tell me which live
  philosophical issue remains." That''s good. But need "Don''t ask for quotation"
