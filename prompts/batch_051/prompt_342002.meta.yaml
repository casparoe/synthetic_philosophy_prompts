  Prompt draft:


  "Construct a thought experiment for a graduate seminar on the moral boundaries of
  sentience. The case should be a single scenario, stated in no more than two paragraphs,
  involving exactly three candidate moral patients: a biological human brain in a
  body, a neuron-level whole-brain emulation running on ordinary silicon hardware
  and controlling a robot body, and a lookup-table device that produces the same responses
  as the other two by retrieving stored records rather than computing them. The lookup
  table should be described so that its answers are supplied in advance by an outside
  designer rather than generated by causal interactions among the system''s own states.


