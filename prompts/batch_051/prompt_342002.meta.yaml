  1. Biological naturalism: only the biological brain is conscious.

  2. Substrate-neutral computationalism about consciousness (the view that any system
  with the same fine-grained causal organization as a conscious brain is conscious,
  whatever its material): the biological brain and the emulation are conscious; the
  lookup table is not.

  3. A behavioral disposition criterion (the view that if a system has the same behavioral
  dispositions as a conscious being, it should be treated as having mental states):
  all three systems are conscious.


  The verdicts must be generated by the views themselves, not stipulated by fiat in
  the description of the scenario. After laying out the scenario, show the reasoning
  each view runs on each system. Then answer two questions. First, identify the structural
  feature that does the work in each split — for instance, to what extent is substrate
  doing the work only because causal organization is held fixed? Second, explain what
  happens if that feature is removed or altered: would the case collapse into a standard
  Chinese room or China brain problem, or would a residual disagreement survive? End
  by anticipating the strongest objection, namely that the lookup table could be redescribed
  as having the right organization, and say whether that objection collapses the second
  and third views into each other."


