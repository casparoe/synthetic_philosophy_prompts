  Draft:


  "I chair the coverage committee of a large public health system. Fourteen times
  a year we sit in a room for ninety minutes and decide which treatments, vaccines,
  and services the system will pay for out of a fixed annual budget; every no means
  someone on the margin goes without. None of us is a philosopher, but we feel the
  shape of the problem: a very large number of small benefits (extending life by weeks
  for thousands) can look, on a spreadsheet, bigger than a very large benefit to one
  identified person (a rare disease drug that saves a child''s sight). Our decisions
  are reviewed under a standard of being procedurally fair and reasonable, and the
  finance director has to sign off on a written justification each time.


  I have been reading moral philosophy and rationalist blogs for years, and I keep
  coming back to Scanlon''s contractualism as the only framework that seems to take
  each person''s complaint seriously without collapsing into cost-per-QALY arithmetic.
  As I understand it, the view is that an act or policy is wrong when it can be rejected
  under a principle no one could reasonably reject; and it is usually read as hostile
  to aggregation, because it is not obvious that a thousand small benefits to different
  people answer one person''s serious complaint. But a real coverage committee cannot
  operate without some aggregation, since almost every budget decision distributes
  small gains across many and large losses across few. I want you to help me build
  a reusable decision procedure, grounded in contractualist reasoning, that we can
  actually run in the meeting—one that operationalizes the difference between legitimate
  and illegitimate aggregation rather than just stating it.


  Please write the procedure:


  - as an ordered list of questions we work through for each proposal, with what counts
  as a sufficient answer to each;

  - with clear stopping rules: which answers terminate in a no, which in a conditional
  yes, and where the question is genuinely a value judgment that the procedure must
  hand to the committee rather than resolve;

  - with a small set of tests or cases to apply at each step, so that a clinician
  and a financial analyst can apply the same rule and converge most of the time;

  - with explicit warnings about the steps that look mechanical but are really judgment
