  Let me ensure terminology is clear:

  - Classical hedonistic utilitarianism: both pleasure and pain count symmetrically.

  - Prioritarianism: pain counts more, especially when severe, but happiness still
  has positive value.

  - Weak negative utilitarianism: reduction of suffering has stronger weight than
  promotion of happiness, perhaps non-Archimedean but not exclusive.

  - Strong negative utilitarianism: only the reduction of suffering has positive moral
  value; happiness matters only as relief of suffering.

  - Lexical threshold negative utilitarianism: any amount of suffering above some
  intensity cannot be outweighed by any amount of mild well-being, while below the
  threshold trade-offs are normal.

  - Antifrustrationism: preference satisfaction has no positive value; only frustration
  is bad.

  - Procreative asymmetry / antinatalist-leaning: absence of pain is good in a way
  that absence of pleasure is not bad, so creating a life with any non-trivial suffering
  is never permitted / or we should not create lives that will contain suffering.
  This is more Benatar than NU but commonly debated in suffering-focused ethics.

