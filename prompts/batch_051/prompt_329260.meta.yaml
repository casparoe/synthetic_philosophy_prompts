  Draft:


  "Okay here''s a thing that''s been bugging me, and I''d like you to think it through
  carefully like an expert philosopher who works on anthropics and population ethics.
  Start by brainstorming the different assumptions the practice could be making before
  you settle on a reconstruction.


  I spend a lot of time reading effective altruism-adjacent grant writing, and there''s
  a pretty standard move: an evaluator will compare two programs, one that saves or
  improves lives now (say a malaria prevention program expected to save a few thousand
  present-day people) and one that reduces existential risk (say technical AI safety
  work with maybe a one-in-ten-thousand chance of preventing a catastrophe that would
  kill all future humans). They then rank the existential-risk program as overwhelmingly
  more valuable, because the expected number of future lives involved is so astronomically
  large. They do this even when the probability of success is tiny.


  But then I re-read this passage in Nick Bostrom''s paper Are You Living in a Computer
  Simulation? (2003):


  [quote]


  He seems to be saying that, unless we already think we''re currently simulated,
  we shouldn''t be confident we''ll have descendants who run vast numbers of simulations
  of their forebears. But the big far-future numbers the grantmakers are multiplying
  by seem to depend on exactly that kind of future—trillions of biological descendants,
  digital minds, ancestor-simulations, the whole thing.


  So here''s my question: what philosophical commitments does that grantmaking practice
  presuppose? Specifically: what view of anthropics, of the value of simulated lives,
  and of how to handle expected value over the unknown future does the practice only
  make sense under? Which rival views does it quietly rule out? Is the practice actually
