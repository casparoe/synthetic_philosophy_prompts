  Question: Reconstruct Lucretius''s reasoning in this passage for the conclusion
  that there must be solid, voidless primal bodies, and assess whether it adequately
  answers the initial observation that ordinary bodies are penetrated, melted, or
  destroyed.


  Student answer: Lucretius starts by admitting that ordinary visible bodies are perishable
  and penetrable, but then claims that the whole of nature is composed of only two
  kinds of thing, body and empty space. Since body and void must be perfectly exclusive,
  wherever there is body there is no void, and wherever there is void there is no
  body. Therefore the ultimate parts of things, the "primal germs," are solid in the
  sense of containing no void. Because compound bodies all contain void, the solid
  material that surrounds that void is what keeps each compound together. And because
  solid bodies contain no void, nothing can crush, penetrate, or split them, since
  all damage requires empty space for parts to move into. The passage therefore proves
  a priori that solid, eternal atoms exist, and this fully answers the opening worry:
  lightning or heat passing through a wall only shows that the wall is porous with
  void between its solid atoms, not that anything solid was penetrated.


