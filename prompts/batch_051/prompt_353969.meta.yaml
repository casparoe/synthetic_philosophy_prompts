  1. The moral-hazard objection to solar geoengineering research should not by itself
  justify suppressing or stigmatizing that research. The objection is an empirical
  claim about how publics and governments will react to the existence of the technology,
  and as an empirical claim it needs evidence before it can outweigh the value of
  better knowledge; ignorance is a governance liability, not a safeguard.


  2. Termination shock is real and distinctive. A world that holds temperatures down
  by maintaining a reflective aerosol layer cannot simply stop: an abrupt halt would
  produce rapid, chaotic warming far worse than the warming that was masked. This
  makes stratospheric aerosol injection different in kind from emission cuts and from
  carbon dioxide removal, not merely different in degree.


  3. The people and states most exposed to the regional side effects of stratospheric
  aerosol injection — shifting precipitation, weakened monsoons, altered drought patterns
  — should have an effective veto over deployment, not merely a consultative seat
  at the table.


  4. Unilateral or small-coalition deployment is nonetheless the most plausible route
  to deployment. The entry cost is low in comparison with the cost of global mitigation,
  and after a sufficiently brutal climate catastrophe the incentive for a technologically
  capable state to act alone would be overwhelming.


  5. Some outdoor experimentation is necessary before anyone can claim to know the
  loading, regional effects, and reversibility of aerosol injection; indoor models
  are valuable but cannot by themselves close that gap.


