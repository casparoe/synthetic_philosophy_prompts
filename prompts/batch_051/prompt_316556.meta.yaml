  4. The pluralism/disagreement objection: what counts as moral improvement is contested;
  who decides what counts as morally better?

  5. The value of moral conflict / moral diversity objection: boosting altruism/empathy
  might reduce valuable moral disagreement, or erode distinction between right acts
  for wrong reasons.

  6. The alienation/authenticity objection: enhanced motivations may not be "mine";
  undermines moral identity.

  7. The "doesn''t address the real problem" / political objection: catastrophic risk
  is best mitigated by political/institutional change, not individual psychology.

  8. The inequality/access objection: enhancement would be distributed unequally,
  exacerbating injustice.

  9. The slippery slope / coercion objection: if moral enhancement exists, states
