  Standard objections to their case for moral bioenhancement:

  1. Freedom/autonomy objection: altering moral dispositions pharmacologically undermines
  freedom, acting freely, or moral worth; it bypasses agency.

  2. The risk/unknown side-effects objection: moral enhancement tech may be unsafe;
  meddling with complex emotional systems.

