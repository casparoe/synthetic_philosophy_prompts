  10. The "Moral bioenhancement would be self-defeating / makes no difference to behavior"
  objection: bridging motivation–action gap not solved.

  11. The emotional bias objection: enhancing empathy/sympathy might make people more
  partial, not more moral (e.g., increase favoritism toward near and dear).

  12. The "wrong conception of morality" objection: their account assumes utilitarianism
