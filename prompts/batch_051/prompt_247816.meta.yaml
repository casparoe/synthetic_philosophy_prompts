  right: passions like grief, anger, and even exuberant hope are ways of letting externals
  boss you around, and a wise person would dissolve them into something calmer. The
  other — call him the engagement camp — thinks this is a recipe for a flattened life:
  grief is part of loving someone mortal, anger at cruelty can be exactly what''s
  called for, and a person who never gets knocked sideways has probably just stopped
  paying attention. They''ve decided to write an adversarial-collaboration document
  instead of another year of circular arguments. I told them I''d help draft it."


