  Husserl:

  - Natural attitude: everyday belief in the world''s independent existence, taken
  for granted (Generalthesis der natürlichen Einstellung).

  - Epoché (phenomenological epoché): suspending/bracketing the general thesis of
  the natural attitude, not doubting it or negating it; we "parenthesize" it, abstain
  from judgment about spatiotemporal existence. We don''t deny the world; we put out
  of action our commitment to it.

  - The epoché opens the field of transcendental subjectivity — not the empirical
  ego/private inner experiences. The reduction leads from natural attitude to transcendental
  consciousness: world as phenomenon/correlate of consciousness (noema-noesis).

  - Difference from Cartesian doubt: Descartes doubts to find an indubitable foundation
  and eventually prove the external world; Husserl''s epoché is not doubt but suspension,
  and it doesn''t aim to secure the world''s existence but to examine how the world
  is given/meant in experience (constitution).

  - Epoché vs reduction: epoché is the suspending; the reduction is the reflective
  turn (transcendental reduction) that discloses the transcendental sphere. Sometimes
  terms used interchangeably, but careful distinction.


