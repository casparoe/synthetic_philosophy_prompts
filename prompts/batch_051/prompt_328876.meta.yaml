  Let me draft:


  "I recently retired from a career in [say, molecular biology?] and have started
  reading moral and political philosophy. A practice that puzzles me is peer review
  in the natural sciences: journals rely on referees who are not paid and typically
  remain anonymous, while the same publishers charge university libraries substantial
  subscription fees, and a researcher''s own career depends on publishing in those
  journals. Everyone in the field benefits from the system, yet any individual referee
  can decline — and, as one grows more senior, one can plausibly reason that ''someone
  else will do it.'' I''d like you to act as an expert moral and political philosopher
  who works on collective action and fairness. Please start by brainstorming the different
  ways one might characterize what, if anything, is wrong with this kind of free riding
  (fairness, reciprocity, assurance, exploitation of a cooperative surplus, virtue,
  etc., or a deflationary view that nothing much is wrong). Then reconstruct, as precisely
  as the practice allows, what philosophical commitments the institution of unpaid
  peer review presupposes about our obligations to contribute to shared intellectual
  enterprises. Distinguish what the practice strictly presupposes from what it merely
  fits comfortably with, and identify the points at which the practice is underdetermined
  between rival theories. Finally, tell me what would have to change — in norms, incentives,
  or self-understanding of scientific authorship — if one adopted instead the view
  that there is no duty to contribute and all refereeing should be a paid market transaction.
  Make sure your answer is responsive to the actual texture of scientific peer review,
  not a generic retelling of the free-rider problem; I want the philosophy to illuminate
  the practice and the practice to discipline the philosophy."


