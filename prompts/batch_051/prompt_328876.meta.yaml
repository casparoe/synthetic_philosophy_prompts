  Draft final:


  "After spending my working life in the natural sciences and recently retiring into
  a serious engagement with philosophy, I find myself circling back to one institution
  I participated in for decades: peer review. Referees are unpaid, usually anonymous,
  and receive no formal professional credit, while the journals that depend on this
  labor are often owned by publishers who charge university libraries large subscription
  fees. Every active researcher benefits from the existence of a refereed literature,
  yet any individual can decline to referee, and there is no mechanism tying a researcher''s
  own submissions to the reviews they have performed; senior scholars sometimes reason
  that someone else will do it.


  I would like you to take on the role of a professional philosopher working on collective
  action, fairness, and institutional ethics, and to think through this concrete practice
  rather than lecture in generalities. Please begin with some unstructured brainstorming
  before you commit to an answer, and do not rush to a single framework too quickly.


  In your response, do the following three things.


  First, distinguish the main ways one might characterize what, if anything, is morally
  wrong with this form of taking without contributing in the scientific context: for
  example, unfairness to those who do the actual reviewing, failure of reciprocity,
  free riding on a cooperative surplus, a species of social parasitism, a defect of
  professional virtue, a collectively self-undermining assurance problem, or the deflationary
  view that nothing serious is wrong because each unilateral decision to decline is
  harmless at the margin.


  Second, reconstruct the philosophical commitments that the institution of unpaid
  peer review presupposes about an individual scientist''s obligations to contribute
  to shared intellectual enterprises. Be precise about the difference between what
  the practice strictly presupposes, what it merely sits well with, and where the
  evidence of the practice underdetermines the philosophy. I am especially interested
  in an apparent inconsistency: the institution''s rhetoric treats refereeing as a
