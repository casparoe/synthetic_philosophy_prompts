  Let me flesh out ECL correctly from memory. Evidential cooperation in large worlds
  (ECL) — associated with discussions by Eliezer Yudkowsky? Actually "evidential cooperation
  in large worlds" is a post/concept on LessWrong (by Caspar Oesterheld?) about how,
  in a large universe with many similar agents, evidential decision theory (EDT) recommends
  cooperating with similar agents because your action is evidence about their actions.
  It argues that in a big universe, the evidential correlations across similar agents
  can make "non-causal" cooperation rational — e.g., in a one-shot prisoner''s dilemma
  against a copy, EDT says cooperate because your cooperating is evidence the copy
  cooperates. Large worlds extend this beyond perfect copies to any agents whose decision
  procedures are correlated with yours (same source code? or sufficiently similar
  reasoning). It can support a kind of "acausal" cooperation / superrationality. The
  Categorical Imperative: act only according to that maxim through which you can at
  the same time will that it become a universal law. This can be read as: choose as
  if your maxim determines what all rational beings in your situation would do. So
  both say: reason about your action as representative of a class of similar agents,
  and choose the action you''d want instantiated by all of them.


  Differences: Kant''s test isn''t about outcomes/payoffs but about contradiction:
  can the maxim be conceived as universal law without contradiction (perfect duty)
  and can it be willed without contradiction of the will (imperfect duty). ECL is
  about expected utility and evidence — it doesn''t forbid defection if the correlation
  is weak or if different payoffs make defection better. Kant''s universalization
  is not probabilistic; it treats the maxim as literally becoming universal, not as
  evidence. Also ECL requires actual large worlds / many similar agents to ground
  the correlation; Kant grounds it in pure practical reason, not in cosmological abundance.
  ECL might also license "cooperating with copies" for self-interested reasons, whereas
  Kant''s motive must be duty, not expected payoff. And Kant''s formula concerns the
  maxim''s form; ECL is consequentialist/deontic neutral.


