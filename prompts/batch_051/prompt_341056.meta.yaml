  Quantum immortality (QI): In many-worlds/Everettian QM, when a quantum event with
  a branch where you survive occurs, there is always a branch where you survive. Since
  you can only experience branches where you''re alive, from your first-person perspective
  you will never experience death — you''ll find yourself in the branch where the
  unlikely survival happens, however improbable. Quantum suicide is the experimental
  version: a device that kills you if a quantum measurement yields one outcome. Since
  you''ll only observe the outcome consistent with survival, you''ll keep surviving.


  What could count against QI? Good material:

  1. The "branch counting" / probability objection: QI seems to require that one''s
  own survival is what matters, but in Everettian QM probabilities should be based
  on branch weights (amplitudes modulo square), not on there existing at least one
  branch in which you survive. If weighting is taken seriously, most of your "measure"
  or probability mass dies; you should not expect to find yourself in the tiny-weight
  survival branch. So QI might rest on a misunderstanding of how probability works
  in MWI. For QI to work, you''d have to reject or revise the Born-rule probabilities,
  or hold that subjective experience tracks branch existence rather than amplitude.
  Evidence that would count against: a coherent decision-theoretic account (Deutsch–Wallace)
  where rational agents must weight branches by amplitude — then expecting to survive
  is simply irrational.


  2. The requirement that there be at least one branch where "you" survive. Many death
  events aren''t clean quantum measurements; macroscopic death involves decoherence
  where the "alive" branch may have vanishingly small amplitude, and for many causes
  of death (e.g., being at ground zero of a nuclear blast) there''s arguably no physically
  continuous path to a branch with a surviving you. QI needs the branch structure
  to actually contain a survivor-branch with your continuity of consciousness. What
  would count against it: showing that decoherence doesn''t produce the needed branches,
  or that personal identity can''t be continued across such branching (e.g., if psychological
  continuity requires causal continuity of the same neural processes and the surviving
  copy''s causal chain is too gerrymandered).


  3. The measurement-basis problem: The MWI branches are basis-dependent / environment-selected
  (pointer basis). QI assumes a preferred decomposition where "you survive" vs "you
  die" is a well-defined branch property. If the branching isn''t over death/survival
  in the relevant way, or a continuous infinity of branches has no "you" in them,
  the argument doesn''t get off the ground.


  4. The fact that people do experience death? Well, we can''t observe others'' first-person
  deaths, so that''s weak. But the decaying survival probabilities: as you age, the
  amplitude of branches where you survive approaches zero but never hits zero, so
  QI predicts you''d find yourself increasingly in astronomically improbable branches
  (e.g., every quantum event in your body just happening to forestall death). Some
  might say this is not what people report: people do report near-death... but QI
  only says you won''t experience death, not that you won''t feel aging.


  5. The "you" who survives may not be you: branching might mean the survivor is a
  different person, a successor or duplicate. If personal identity does not survive
  branching (fission objection from personal identity debates), then QI doesn''t give
  you immortality, it gives someone else.


  6. The many-minds / single-mind version: QI might require a particular interpretation
  (e.g., a "stream of consciousness" that follows a continuous path through branches
  — like a many-minds or Bohmian-ish outcome). Without that, there''s no single trajectory
  that is "your" experience; all branches are equally real and none is privileged.
  Evidence against: if Everettian QM is right without extra structure, QI''s talk
  of "your" trajectory is illegitimate.


  7. The view is insulated: it''s a prime example of a self-verifying/unfalsifiable
  position — any observation of survival is what it predicts; any apparent death is
  experienced by someone else. So it may be unfalsifiable. The prompt can ask whether
  that''s a problem for a view of this kind, exactly as the first example does.


  8. Quantum mechanics itself: if MWI is false (e.g., objective collapse theories
  like GRW are true), QI is dead. But one could still ask: is QI "what would count
  against it given MWI?" The asker should perhaps fix MWI as background, or ask whether
  the view depends on MWI being true. Actually QI presupposes MWI. So if collapse
