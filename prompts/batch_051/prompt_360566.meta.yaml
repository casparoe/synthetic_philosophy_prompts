  Let me double-check counterpart theory accuracy:

  - Lewis: counterpart theory posits that no object exists in more than one possible
  world. An object has properties in a world only if it exists (is a part of) that
  world. De re modal statements are made true by counterparts: "Possibly P(a)" is
  true iff some counterpart of a in some world is P. The counterpart relation is a
  relation of comparative similarity, and it''s context-dependent and vague; different
  counterpart relations are selected by different interests. Transworld identity is
  the standard view (e.g., Kripke): modal statements quantify over the same object
  in different worlds; "a is possibly P" iff a itself is P in some world. Both are
  rival semantics for quantified modal logic. Good.


  One nuance: Kripke didn''t propose "transworld identity" as a theory with known
  criteria; he criticized the demand for qualitative criteria of transworld identification.
  He said we don''t identify across worlds by qualities; possible worlds are stipulated,
  not discovered, and the object is stipulated to have certain properties. In contemporary
  terms, transworld identity is more associated with the "possibilism vs actualism"
  debate and quantified modal semantics. But the prompt can use "transworld identity"
  as the family of views that take the same object to exist in multiple worlds. That''s
  a standard, recognizable label.


