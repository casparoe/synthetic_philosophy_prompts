  Let me think about the precise readings of "If you have nothing to hide, you have
  nothing to fear" / "nothing to hide":


  1. Literal conditional: if you have no information you wish to conceal, then surveillance
  won''t harm you. This is false/naive because harm doesn''t require concealment:
  being observed can chill, lead to errors, power asymmetry.

  2. Privacy has only instrumental value as protection for the guilty / wrongdoers;
  if you do nothing wrong, privacy is worthless to you. This is substantive and false
  (or at least controversial) because privacy has constitutive value for intimacy,
  autonomy, development; also instrumental value even for innocent (security against
  false positives, discrimination).

  3. Only the guilty need fear surveillance. False: innocent people can be suspected,
  misinterpreted, aggregated; data can be taken out of context; the watcher can make
  mistakes; also future norms/regimes may criminalize current innocuous behavior.

  4. If the watcher is trustworthy and error-free, then surveillance harms only wrongdoers.
  This is a conditional whose antecedent is rarely met; substantive claim about what
  would follow, but the conditions are idealized.

  5. "Nothing to hide" as a heuristic: the burden of proof is on privacy advocates
  to name a concrete harm; if you can''t name one, the surveillance is acceptable.
  This is a methodological claim about argumentative burdens, plausibly contestable
  because the burden should be on those expanding surveillance.

  6. Privacy = concealment of wrongdoing; by definition if you have nothing to hide,
  you lose nothing. This is a definitional stipulation that begs the question by defining
  privacy too narrowly.

  7. Transparency makes the innocent safer / benefits everyone (security), and the
  cost is only borne by wrongdoers. Empirical claim, often false because innocent
  bear costs too.

  8. Perhaps "I have nothing to hide" as a statement of personal preference, not universal:
  "I personally don''t mind." That''s fine but doesn''t generalize; the slogan is
  used to justify policy over others.


