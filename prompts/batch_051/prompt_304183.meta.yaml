  Let me think carefully about the shutdown problem to write a technically meaningful
  variant.


  The classic shutdown problem: An agent has a utility function over outcomes. It
  has the option to press a shutdown button (or a human has a button). The agent might
  disable the button because it expects to get more utility if it continues. The core
  difficulty: a consequentialist agent with a utility function over world states will
  prefer to prevent shutdown if shutdown leads to lower utility, unless we design
  it to be indifferent. One proposed solution: indifference via a utility function
  that gives equal value to worlds where it''s shut down and worlds where it continues
  (utility indifference). But naive utility indifference has issues: the agent can
  manipulate its own expectations / self-modify, or it might trade off safety.


  Corrigibility (Soares, Fallenstein, Yudkowsky, Armstrong 2015): the agent doesn''t
  try to stop the operator from shutting it down or changing its utility. The "shutdown
  problem": how to build an agent that is useful but also lets a human shut it down
  without trying to prevent it.


  A classic variation type: change one assumption, parameter, timing, information.
  What variation could be precise and meaningful?


  Possible variations:

  - The shutdown button is pressed by a human who is itself uncertain / the button
  press is noisy (the human only presses when they have information that something
  went wrong). Then shutdown is informative: if the human presses the button, that''s
  evidence the agent is misbehaving, so a rational agent should welcome shutdown even
  with an ordinary utility function (since the button press reveals info). This is
  a known point: shutdown as evidence. Actually the classic analysis: under uncertainty
  about whether the operator is satisfied, the agent may learn from non-shutdown that
  things are going well; a naive agent values continuation. So the standard puzzle
  often assumes the agent already knows it''s doing what the human wants.


