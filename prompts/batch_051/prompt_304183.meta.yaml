  Let me formulate a precise variant: In the standard shutdown problem, the agent
  is uncertain about the operator''s preferences but at the time of action it treats
  continuing as higher expected utility than shutdown. Variation: suppose the operator
  commits (credibly) to press the button only in exactly the states where the agent''s
  continued operation would be harmful according to the agent''s own current values,
  and otherwise not press. Then does the ordinary utility-maximizer resist shutdown?
  That turns shutdown into an informative signal and collapses the problem — the agent
  should want to be shut down when the button is pressed, because that indicates continuation
  has low value. The puzzle''s force depends on the button press being uninformative
  (e.g., the operator will press based on values the agent doesn''t share, or for
  reasons exogenous to the agent''s utility). So we can ask: how does the problem
  change when the button press is informative vs. uninformative? Actually the standard
  analysis is that for an expected utility maximizer, the relevant quantity is P(button
  pressed | ...) — the agent will resist iff expected utility conditional on not-pressing
  continuing > being shut down. If pressing is informative (correlated with low value
  of continuing), resistance can vanish.


