  Let''s craft the argument:


  (1) First member (A): The Rietdijk–Putnam argument shows relativity already commits
  us to the block universe. In special relativity there is no absolute simultaneity.
  Pick some event in your future that is spacelike separated from you—say an event
  happening ''now'' on a distant star or a decision someone will make next year on
  a planet far enough away. For someone in a sufficiently fast-moving frame passing
  you right now, that event is simultaneous with your here-and-now. Since no frame
  is privileged, if we grant that what is simultaneous with you is real, then that
  future event is already real. Relativity thus dissolves the specialness of the present.


  (2) B replies: That argument must be sneaking in a philosophical premise. Special
  relativity is a physical theory about how coordinates transform; it tells us what
  different observers will measure, not what exists. The claim that everything simultaneous
  with you is real is a piece of presentism, not relativity. You can''t base an argument
  for eternalism on the assumption that simultaneity tracks reality, then appeal to
  relativity to relativize simultaneity; that''s exactly what''s in dispute. At best
  the argument shows that if you already think simultaneity is existence, then relativity
  forces you to treat many frames'' ''nows'' as real—but that conditional is the contested
  part.


  (3) A: But the premise I''m using is weaker: it''s the principle that no inertial
  frame gets to be the one true ''now.'' If the rock in the fast-moving frame is equally
  valid as a description of nature, and in that frame the future event happens now,
  then nature itself contains that event as present. Denying this means singling out
  one frame''s now as metaphysically special, which is exactly the sort of absolute
  simultaneity relativity rejected. So the burden is on the presentist to find a non-arbitrary
  privileged frame.


  (4) B: Not so. I don''t need a privileged frame to avoid your conclusion, because
  I can deny that being simultaneous in some frame is what makes an event real. Presentists
  and growing-block theorists generally take existence to be global, not defined by
  any frame''s simultaneity surface. Special relativity constrains the geometry of
  spacetime, but the debate between presentism and eternalism is about whether non-present
  events have the same kind of reality; that debate is not settled by coordinate transformations.
  Besides, your argument doesn''t even reach the events that matter—the ones in your
  future light cone, like your future actions—because no frame can make a timelike-separated
  event simultaneous with you. So if the argument can''t establish that tomorrow''s
  breakfast is already real, it''s much weaker than the usual ''block universe'' claim
  implies.


  (5) A: The timelike point is a detail, not an escape. The region the argument covers—the
  elsewhere—is still full of real events that commonsense regards as not yet real.
  And if those are already real, the most natural picture is that the whole four-dimensional
  manifold is equally real; carving out a special ''now'' that advances would be unmotivated.
  Also, your alternative sounds like you''re treating the present as a frame-independent
  fact, yet special relativity shows there is no frame-independent partition of events
  into past, present, and future at a spacetime point. So your presentism has to invoke
  a hidden structure—a privileged foliation—that the physics does not supply.


  (6) B: I can grant the geometry and still resist the modal/conceptual leap. There
  are well-developed positions—presentism with a privileged foliation is only one,
  but also ''fragmentalism,'' or the view that ''real'' is not a relation to frames
  at all even if becoming has no global meaning—that accept the relativity of simultaneity
  and deny the block. My point isn''t that presentism is obviously correct; it''s
  that the Rietdijk–Putnam argument can''t by itself settle the metaphysics because
  its first premise is a thesis about what reality consists in, not a theorem of physics.
  The physics constrains the metaphysics, but it underdetermines it.


