  Rietdijk (1966) and Putnam (1967) argued from special relativity to determinism/eternalism:
  For any event e that is in your future and spacelike separated (i.e., outside light
  cone), there''s an inertial frame in which e is simultaneous with your here-now.
  If we say all events simultaneous with a given event (in any frame?) are real, then
  future event e is real. The argument typically: Let observer O at spacetime point
  p. Take a future event E spacelike separated from p (outside future light cone of
  p). There exists an observer O'' passing through p (or near p) for whom E is simultaneous
  with p. Relativity says all inertial frames are equally valid; so if events simultaneous
  in any frame are equally real, E is real now. Thus future is real; no objective
  becoming; block universe. The key premise is that "real at a time" is frame-independent
  (ontological parity of simultaneity). The argument can be resisted by rejecting
  the "reality of simultaneity" premise: presentism defines existence relative to
  a privileged frame; or by saying simultaneity is conventional/coordinative, not
  ontological; or that "being real for an observer" is epistemic. Also Putnam used
  the word "real" with a specific assumption.


