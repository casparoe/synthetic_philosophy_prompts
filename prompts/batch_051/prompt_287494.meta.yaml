  Argument sketch:

  1. Standard move: a strange loop is only apparently paradoxical because there is
  some inviolate level below it (the paper, the artist, the proof-theoretic meta-language,
  the hardware). The loop "borrows" its coherence from that level.

  2. But in many real systems the candidate inviolate levels are multiple and mutually
  inconsistent: in a self-hosting compiler, the initial bootstrap compiler vs. the
  current compiler vs. the language spec vs. the machine; in law, original text vs.
  precedents vs. current practice.

  3. Choosing among them is not value-neutral; it''s where you locate semantic authority.
  E.g., if you say the spec is inviolate, then the compiler is always checked against
  it; if you say the bootstrapped compiler is inviolate, then the spec just floats
  free.

