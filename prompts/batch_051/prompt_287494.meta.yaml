  I''ve been chewing on a short essay about Hofstadter''s idea of the inviolate level
  in tangled hierarchies, and I''d like some comments on the idea before I invest
  more time. The rough thesis is that the inviolate level is not something you discover
  about a strange loop but something you choose or impose, and that choice does more
  explanatory work than people admit.


  Sketch of the argument: in the standard treatment of Escher''s Drawing Hands, the
  apparent paradox (the hands draw each other into existence) gets dissolved by pointing
  to an inviolate level underneath the loop: the paper they''re drawn on, the artist
  who drew the lithograph, the fact that it''s a static image. The hands only seem
  to create each other because the lower level does the actual creating. My claim
  is that in messier cases there isn''t one obvious inviolate level—a self-hosting
  compiler has the bootstrap binary, the source of the current compiler, the language
  specification, and the hardware all as candidates; a legal system has the founding
  text, the amending procedures, the latest precedents, and the sitting judges. These
  candidates can disagree about what the system even says. So picking one as inviolate
  is a modeling or normative decision, not a factual one. I want to push this toward
  a claim that in AI safety discussions, when people say a model''s reward function
