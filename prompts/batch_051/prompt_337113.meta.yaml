  about your own unreliability. The classic question: can higher-order evidence about
  your cognitive malfunction defeat first-order evidence? "Level-splitting" or "rational
  epistemic akrasia."


  But to write a prompt I don''t need names. The role-play could be: you play a committed
  defender of "one must always align one''s first-order belief with one''s higher-order
  judgment about what the evidence supports; epistemic akrasia is never rational."
