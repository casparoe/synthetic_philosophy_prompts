  A debate in formal epistemology has been stuck for decades, and I want a diagnosis
  of why. The subject is a principle of diachronic coherence: roughly, my present
  credence in a proposition, conditional on my future credence in that proposition
  being p, should itself be p. Put another way, I should treat my future opinion as
  authoritative over my present one. Defenders present this as a genuine requirement
  of rationality, grounded in the idea that if I regard my future self as following
  the same rules of evidence, I cannot coherently expect that self to be wrong without
  taking present evidence for that expected error. Critics counter with cases where
  I already know my future credence will be unreliable: I will be sleep-deprived,
  manipulated, under the influence of a drug, or suspiciously confident after an experience
  I will not be able to reconstruct. In those cases, they say, deferring to that future
  self is not rationality but a strange form of self-abandonment. Defenders reply
  by restricting the principle to future states that are themselves rational or formed
  under ideal conditions. Critics say the restriction is ad hoc and circular: I would
  have to already know, from the present, which future selves are trustworthy, and
  that is exactly the judgment the principle was supposed to supply. Each side seems
  to regard the other''s key example as simply beside the point, and nobody moves.


  What kind of disagreement is this actually? Is it substantive (about the norms of
  rationality), verbal (about what words like belief, commitment, or future self mean),
  or a matter of the two sides answering different questions under one heading — one
  about synchronic coherence at a time and the other about diachronic reliance across
  time? Or is the principle itself ill-posed? Give me the diagnosis that best fits
  the actual pattern of the debate, and say what would count as progress given that
  diagnosis: a sharper distinction, a formal result, a new kind of case, or the conclusion
  that progress should not be expected."


