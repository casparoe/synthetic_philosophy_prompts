  "You are a professional epistemologist with a knack for diagnosing the structure
  of long-running debates rather than just adjudicating them. Think carefully, and
  before you settle on an answer, briefly brainstorm at least three candidate diagnoses
  of the disagreement and test each against what the two sides actually say. Write
