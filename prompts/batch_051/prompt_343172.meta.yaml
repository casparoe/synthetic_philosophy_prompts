  without being justified by further beliefs. Otherwise, he claims, you get either
  an infinite regress — no ground ever reached — or a circle, with the structure supporting
  itself only by leaning on itself, and neither is a way for a structure to stand.
  People on the other side reach for different images: the raft at sea, kept afloat
  while its planks are replaced one at a time, or a web whose knots hold one another
  in place. Infinitists suggest that a chain can be ungrounded and still supportive
  if it goes on forever.


