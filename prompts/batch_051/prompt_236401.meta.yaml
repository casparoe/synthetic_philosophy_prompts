  Let''s plan prompt:


  Paragraph 1:

  "I''m a PhD student working on decision theory, and in our reading group we''ve
  been arguing about what it takes for an gamble''s expected value to be genuinely
  well defined. A visiting speaker dismissed the St. Petersburg game as a special
  pathology of infinite expectation and claimed that once expected value is finite,
  everything is fine. I want to push back with a case I''ve been sketching, and I''d
  appreciate a careful audit of the criteria I''m using."


  Paragraph 2:

  "Here are the criteria I was taught/use for a monetary gamble to have a well-defined
  fair price: (1) the set of possible outcomes forms a countable partition of the
  state space; (2) each outcome has a determinate probability and a determinate numerical
  utility/payoff; (3) the expected value exists as an absolutely convergent sum of
  probability-weighted payoffs; and (4) the value is invariant under any reasonable
  re-indexing or regrouping of the outcomes — e.g., it can''t depend on the order
  in which we list the events. Now consider the following game. A fair coin is tossed
  until it lands heads. If the first heads is on the nth toss, you receive $(-1)^{n-1}
  2^n/n$: on odd-numbered tosses you gain that amount; on even-numbered tosses you
  owe that amount. The probability-weighted payoff is $(-1)^{n-1}/n$, so the natural
  sum is the alternating harmonic series, which converges to ln2. But the convergence
  is only conditional, not absolute, so under different orderings of the same possible
  outcomes the sum can be made to approach any real number or diverge to ±∞. By my
  criteria, this ''Pasadena game'' has no well-defined expectation, despite the natural
  ordering yielding a finite value."


  Paragraph 3:

  "Question: go through the criteria one by one and say whether the Pasadena game
  qualifies as a game with a well-defined expected value. Is the natural-order value
  ln2 a legitimate fair price, or is it an artifact of the way I wrote the game''s
  description? Should the envy? Is criterion (3) too strong, or does the case show
  that a finite but conditionally convergent sum should not ground a fair price? Where
  do respectable decision-theoretic treatments disagree? I''d like you to separate
  what is mathematically settled from what is genuinely contested, and not present
  a contested view as the consensus."


