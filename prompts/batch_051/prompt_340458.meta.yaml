  Expected value fanaticism: the problem that if you take expected value maximizing
  seriously, and allow unbounded utilities or tiny probabilities of astronomically
  valuable outcomes, then EV reasoning may demand fanatical actions (e.g., Pascal''s
  mugging: a mugger claims to return infinite or huge reward). In effective altruism,
  existential risk people use tiny probabilities of vast future value to justify focus
  on x-risk. Critics say such "fanaticism" is absurd: no finite proof should dominate
  all ordinary concerns. Defenders say EV maximization is coherent; refusing tiny
  probabilities is the irrationality (intransitivity, money pump). There''s the "fraction
  of probability" issue, "unbounded utility" issue, and "but there are infinitely
  many possible vast claims, each tiny probability" — Pascal''s mugging can be recast
  so that competing muggers trade off.


