  "A moral agent is not the same as a moral patient. A patient is something we owe
  things to, while an agent is something that can be held responsible for what it
  does. The AI here is plausibly a moral patient in some weak sense, but the question
  is whether it is an agent.


  I will focus on Kant. In the Groundwork, Kant argues that a good will is good not
  because of what it effects or accomplishes, but simply through its willing. This
  shows that the value of a will does not depend on whether it succeeds in bringing
  anything about in the world. It follows that a system which can form the right judgments
  is already a moral agent in the Kantian sense, because its will is what matters
  and the fact that humans gate its outputs is irrelevant to its status as an agent.


  One might object that ought implies can: if the system cannot act, then it cannot
  be under an obligation to act, and so it has no duties. But having duties is not
  the same as being an agent either. Agency is a status you can have before you are
  assigned specific duties, like legal citizenship is a status before specific rights
  and obligations are attached to it. So the objection fails.


  A second objection is that the system cannot be blamed or praised for anything,
  since its judgments only affect the world through the choices of the human operators.
  But this only shows that the operators share in the causal chain; it does not show
  the system has no causal influence at all. The judgments are a necessary input into
  the operators'' decision. So it would be unfair to say the system cannot act in
  any sense.


  I conclude that the AI is a moral agent, though a limited one: it meets the Kantian
  condition, and the fact that it cannot execute its judgments directly only bears
  on how much it is responsible for, not on whether it is an agent at all."


