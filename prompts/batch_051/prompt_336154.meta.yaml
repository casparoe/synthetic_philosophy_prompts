  on its own to bring about any change in the world. Discuss whether such a system
  could count as a moral agent. Your answer should (i) distinguish moral agency from
  moral patiency, (ii) engage with at least one classical view about what makes something
  an agent, and (iii) consider the objection that without the ability to act the system
  cannot have moral duties or be held accountable."


