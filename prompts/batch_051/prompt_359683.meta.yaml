  Let me explore the domain of Fitch''s paradox. The paradox: from the claim that
  all truths are knowable (∀p(p → ◇Kp)), it follows (in a modal-epistemic logic) that
  all truths are known (∀p(p → Kp)). The proof uses the instance p = "q ∧ ¬Kq" for
  some unknown truth q. If p is knowable then possibly K(q ∧ ¬Kq). But K(q ∧ ¬Kq)
  implies Kq ∧ K¬Kq; since knowledge is factive, K¬Kq implies ¬Kq, contradiction.
  So there can be no unknown truth given all truths are knowable. Hence if there is
  any unknown truth, not all truths are knowable — undermining anti-realism/verificationism.


  A prompt for type A could ask to construct a concrete scenario illustrating the
  collapse: e.g., "Design a scenario where all truths are knowable in the way a verificationist
  might want, and show how a particular unknown truth generates the contradiction."
