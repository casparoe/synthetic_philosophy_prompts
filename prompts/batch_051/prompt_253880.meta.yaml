  Copernican version; the rejoinder that the doomsday inference conflates self-location
  with ordinary evidence and that a self-indication assumption — that your own existence
  should favor hypotheses with more observers — cancels or reverses the update; and
  the fallback position that any such conclusion is hostage to an arbitrary choice
  of reference class (humans? sentient beings? observer-moments?). Since then, the
  field has mostly refined formalisms without changing any minds: people who find
  self-sampling compelling are not moved by self-indication, and vice versa, even
  when they agree on the conditional probabilities on each side. My working hypothesis
  is that this is not really a disagreement about probabilistic inference at all —
