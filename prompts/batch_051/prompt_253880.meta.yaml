  I''m a PhD student in philosophy of science working on the doomsday argument, and
  I''ve been struck by how stationary the debate has become. The basic moves were
  on the table decades ago: Carter''s and Leslie''s claim that treating one''s birth
  rank as typical among all humans who will ever live should raise your credence that
