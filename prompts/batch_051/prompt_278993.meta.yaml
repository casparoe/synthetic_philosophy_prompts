  finite body of evidence, there are indefinitely many mutually incompatible theories
  that accommodate that evidence equally well, and that no purely evidential consideration
  can pick one out. I also think this is not merely a logical curiosity: it threatens
  the idea that scientific theory choice is, at bottom, governed by the evidence.
  On my view, what actually breaks the ties are extra-empirical virtues — simplicity,
  unification, explanatory power, elegance — which are not themselves forced on us
  by the evidence. I''d like you to tell me what would count against this position:
  which arguments, formal results, historical facts, or possible findings would show
  that I''m wrong, or at least that the position is much less interesting than I take
  it to be."


