  I''ve come to accept a strong version of the underdetermination of theory by evidence,
  and I want you to tell me what would count against it. My view is not just the weak
  Duhem–Quine point that auxiliary assumptions can be adjusted to protect a hypothesis.
  It is the stronger claim that for any finite body of evidence, there are indefinitely
  many mutually incompatible theories that accommodate that evidence at least as well
  as any rival, and that no appeal to the evidence alone can single one out. I also
  take the view to be epistemically consequential: it means scientific theory choice
  is never settled by evidence alone, and that what breaks the underdetermination
  are extra-empirical qualities of theories—simplicity, unification, elegance, explanatory
  power—that are not themselves forced on us by the data. I want an honest map of
  what would have to be true for this position to be false or deflated, not a defense
  of it.


  Please write the response in the following five sections, in this order, with roughly
  the indicated lengths.


  1. The position sharpened (about 250 words). Restate my view in your own words and
  distinguish the versions a critic might target: underdetermination of a single hypothesis
  by data given auxiliaries; underdetermination of whole theories by all possible
  evidence; transient underdetermination, which might be resolved by further data;
  and permanent underdetermination, which could not be. Say which version the rest
  of your response treats as the one I am committed to.


  2. Decisive defeaters (about 600 words). What, if it were shown, would seriously
  damage or refute the strong permanent underdetermination claim? Consider at least:
  an argument or formal result showing that evidential support can be characterized
  so that the data do rule out all but one theory; a demonstration that alleged empirically
  equivalent rivals are mostly notational variants or reparametrizations of one another
  rather than distinct theories; and evidence that the extra-empirical virtues I appeal
  to are themselves empirically grounded, for instance by a reliable track record
  of picking true theories. Rank these from most to least decisive and say what each
  would establish if successful.


  3. Merely awkward defeaters (about 400 words). What would weaken the position without
  refuting it? Consider historical cases where apparent underdetermination dissolved
  under better evidence; the fact that many of the constructed rivals are gerrymandered
  or unprojectible; and the observation that scientists in practice treat some theories
  as decisively supported even when an underdetermination argument can be reconstructed
  around them. For each, say whether it narrows the scope of the view, lowers its
  stakes, or just annoys its defenders.


  4. What a committed defender should concede (about 300 words). Which of the above
