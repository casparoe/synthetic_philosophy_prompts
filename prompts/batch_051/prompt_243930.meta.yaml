  Let''s draft a "Variants of a myth" criteria prompt:


  ---


  I''m a novelist, and for my current project I need to get straight what counts as
  "the same myth." My narrator is a folklorist, and I keep putting words in her mouth
  that I''m not sure survive scrutiny. Here''s the working criteria I''ve given her
  for two tellings being variants of the same myth rather than just two myths that
  happen to share themes:


  1. They share a plot kernel: at least three of five episodes in roughly the same
  order (separation from kin, forbidden act, encounter with a dangerous helper, loss
  of name, transformation).

  2. The prohibition is the same type of rule (a food taboo, a gaze taboo, a naming
  taboo), even if the specific object shifts.

  3. The ending serves the same explanatory function (it explains the same sort of
  thing: an animal''s markings, a landform, a calendar ritual).

  4. The protagonist keeps the same structural role (e.g., youngest daughter, orphaned
  nephew, outsider-bride).

  5. The two communities who tell them treat them as versions of one story, e.g.,
  trade-brokers say "ours is the mountain way of telling your story."


  Now the borderline case I''m worried about. In the novel, a travelling bard brings
  back a telling from the upriver villages. In it, the protagonist is an old man,
  not a youngest daughter. The forbidden act is identical (eating the winter fish
  before the ice breaks) and the punishment is the same in mechanism—he is unmade
  in stages, losing first his name, then his shadow, then his body—but the ending
  lands differently: instead of becoming a stone in the river so that the river can
  speak to the dead, he becomes a piece of driftwood that floats and teaches a different
  lesson about restlessness. The upriver people insist it''s the same story, they
  even perform it at the same thaw ritual. My narrator thinks it clearly is a variant.
  Her rival says it''s a separate myth that has borrowed the taboo and should be catalogued
  under its own name.


  Does the old-man version qualify as a variant of the same myth under my criteria?
  Work criterion by criterion, say where my criteria underdetermine the verdict, and
  tell me whether this case shows one of the criteria should be dropped or modified—or
  whether "same myth" just isn''t a sharp category in the first place.


