  is not about cognitive load or temporal delay. It is about the normative source
  of the action. If the husband''s action is made right by an impartial criterion,
  even one that he never consciously deploys, then his wife''s particular importance
  to him is not doing the justifying. The relationship becomes, in Williams''s terms,
  an implement or occasion for the impartial rule, rather than what grounds his action.
  A dispositional view just relocates the alienating thought: it is a thought the
