  Let me draft the essay. Thesis idea: Williams''s integrity objection and the "one
  thought too many" objection are usually treated as two separate criticisms — the
  first about the demands of utilitarianism on an agent''s projects, the second about
  the place of personal relationships within impartial morality. I''ll argue they
  share a common structure: both target the demand that an agent treat his deepest
  commitments as data for a justificatory calculation that they could in principle
  disavow, and both are therefore better understood as objections to a certain picture
  of practical reason than as objections to consequentialism as such. Then maybe a
  nuance: the integrity objection is often misread as a complaint about self-sacrifice
  or demandingness. But Williams''s point is not that utilitarianism asks too much
  of the agent (in the sense of cost), but that it alienates the agent from the very
  projects that give his actions their meaning — and from the reasons he can wholeheartedly
  acknowledge. Likewise, the husband who saves his wife doesn''t lack a justification;
  the problem is that the utilitarian reconstruction supplies him with a thought —
  that it is permissible in such situations to prefer one''s wife — that plays no
  live role in his practical reasoning and whose absence is no defect. The added thought
  doesn''t add justification; it replaces the agent''s actual reason with a generic
  one.


  Then in the essay I could draw a distinction: the problem described is not necessarily
  an objection to impartiality in the abstract; it is an objection to requiring that
  the agent''s motivating reasons be translatable into impartial ones. A utilitarian
  could reply that the theory only evaluates actions, not motives. But Williams''s
  rejoinder implicates the account of the agent''s character: a person for whom the
  generic thought was the operative reason would have a worse character, not a better-justified
  action. So the one-thought-too-many objection survives indirect forms of utilitarianism
  that allow motives to deviate from the criterion of rightness, because the issue
  concerns which considerations count as reasons for the agent, not which decision
  procedure maximizes utility.


