  the virtues can be reconceived as local, domain-specific traits or situation-indexed
  skills; the empirical data only counts against global traits.

  4. But virtue ethics should not quietly abandon talk of the traditional virtues
  as ideals: courage, honesty, and compassion remain the correct regulative ends of
  moral development, even if few or no human beings fully possess them.

  5. Moral psychology places legitimate constraints on moral philosophy: an ethical
  theory that required ordinary agents to possess psychological structures humans
  could not acquire would be defective for that reason.


