  Prompt text:


  ---


  Last night I had a long argument with a friend about whether Bertrand''s paradox
  is a narrow problem about defining "random chord" or a deeper problem for the principle
  of indifference. She held that once you specify a real physical procedure for selecting
  the chord, the paradox dissolves; I countered that the principle of indifference
  is supposed to earn its keep exactly when no sampling procedure has been specified,
  so treating it as an instruction to always specify a procedure is to give it up.


  In Chapter IV of A Treatise on Probability, Keynes argues that the principle of
  indifference should be applied only to alternatives that are, relative to one''s
  evidence, indivisible. If the alternatives can be further divided, he says, applying
  the principle to different partitions can produce incompatible equal probabilities;
  his illustration is the color of an unknown book, where red/not-red, blue/not-blue,
  and so on would each seem to license a probability of one-half for the first alternative.
  The text concedes that the principle is not self-applicable, but it also doesn''t
  fully solve the problem.


  Here is the list I want you to rank:


  1. The naive principle: when no evidence distinguishes them, assign equal probability
  to every alternative.

  2. Keynes''s indivisibility restriction: apply the principle only to alternatives
  that are ultimate or indivisible relative to the evidence.

  3. A transformation-invariance restriction: require the resulting probabilities
  to be invariant, or to transform consistently, under relevant reparameterizations.

  4. A maximum-entropy rule: among all distributions that encode exactly one''s stated
  constraints, choose the one with maximal entropy.

  5. The deflationary view: treat indifference only as a convention for fixing a privileged
  partition, with no claim to track objective ignorance.


  Please sort these into tiers by how well they cope with the Bertrand cases and with
  the book-color type of contradiction, while still licensing priors where ignorance
  appears to demand them. For each tier, give a sentence or two of reasoning. Then
  say what would change your mind about at least the top and bottom tiers: which argument
  or example would most plausibly move the top item down, and which would move the
  bottom item up.


  ---


