  the user actively intervenes. The interface occasionally varies that delay and the
  order of recommended videos, even when the content is identical in kind, in the
  way a slot machine varies outcomes. The app never asks users whether they are satisfied
  with the time they spent; the design team''s A/B tests treat any change as an improvement
  if it raises watch time.


