  What theory of agency, welfare, and attention does this cluster of practices presuppose?
  Does the design make sense only if we accept a particular view — for instance, that
  revealed engagement is a reliable measure of welfare, that users'' momentary choices
  are authoritative, that attention is an extractable resource rather than a capacity
  for autonomous choice, or that a nudge is acceptable if it preserves the option
  to leave? Or is the practice compatible with several rival theories? I would also
  like to know whether the different elements presuppose inconsistent things: e.g.,
