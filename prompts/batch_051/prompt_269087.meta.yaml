  Prompt draft:


  "I''m putting together a study guide for an advanced undergraduate philosophy of
  language seminar on generics — sentences like ''ducks lay eggs,'' ''mosquitoes carry
  malaria,'' and ''ravens are black'' — and I''d like your help building the centerpiece:
  a ''which theory of generics do you actually hold?'' sorting quiz. You are an expert
  philosopher of language who regularly designs diagnostic materials for seminars,
  and I''d like you to think through the logical space carefully before writing the
  quiz.


  The quiz should have eight to ten questions. Each question should present a concrete
  generic sentence (or a pair of them) plus a short scenario, and offer answer options
  that register both the respondent''s truth-value judgment and their reason: for
  example, whether the sentence is true but only because the property is statistically
  typical, because it is striking or dangerous, because it belongs to the kind''s
  normal or characteristic functioning, or because it predicates something of the
  kind itself rather than of individual members. No question should ask the respondent
  to identify or choose a theory by name; every question should sort by what the respondent
  says about cases.


  Build the scoring key around five positions, and make these the leaves: (i) the
  statistical view (a generic is true roughly when most members of the kind have the
  property); (ii) the salience/striking-property view (a strikingly small minority
  can suffice when the property is noteworthy or dangerous); (iii) the normality/prototype
  view (truth depends on what normal members or normal conditions are like, so principled
  exceptions such as sex or developmental stage can be set aside); (iv) the kind-predication
  view (generics directly predicate a capacity or property of the kind itself, which
  is why ''ducks lay eggs'' is true even though only females do); and (v) a contextualist/mixed
  view on which different generics get different readings depending on the predicate
  and the contrast class. Structure the result from the logical space rather than
  from this list: work from the underlying questions — whether generics quantify over
  individual members at all, whether prevalence or salience or normality fixes truth,
  and whether principled and accidental exceptions are treated differently — and then
  locate the five positions within that space, explicitly noting answer combinations
  that no position occupies and briefly diagnosing why (incoherent, unattractive,
  or merely unexplored).


  Some cases must appear among the questions: ''ducks lay eggs'' against ''ducks are
  female''; ''mosquitoes carry malaria'' against ''ticks carry Lyme disease''; ''sharks
  attack swimmers''; ''ravens are black'' against ''ravens are white''; ''books are
  paperbacks''; ''peacocks have colorful tails''; and ''cats have four legs'' next
  to ''cats have three legs'' (as a description of the species as a whole, not a particular
  cat). Where two or more positions cannot be separated by any question, flag that
  explicitly and say in one sentence how they differ despite agreeing on all quiz
  cases; do not pretend the quiz has more resolving power than it does. Begin with
  a short note on the logical space you found, and then present the quiz with the
  scoring key."


