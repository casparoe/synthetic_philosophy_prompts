  ---


  Hey—I''m in a political theory seminar and I have to hand in a short "where I stand
  on religion in democratic politics" memo next week, and I''d honestly rather get
  my position audited before the class rips it apart. I have a set of commitments
  and I can''t tell which of them are actually pulling against each other, and I don''t
  want to just write something blandly consistent by throwing out whatever seems hard.
  I''m not asking for citations or reading suggestions; treat the following as my
  actual view and tell me where the stress points are.


  Here''s roughly the package:


  (1) The state may not coerce people on matters of basic justice unless the justification
  for that coercion is in principle acceptable to reasonable people from different
  faiths and from none. So the laws that really matter need to rest on shareable reasons,
  not just on the fact that a majority happens to share one religion.


  (2) But ordinary citizens in the informal public square should be welcome to argue
  from their religious convictions. Demanding that they first translate their faith
  into neutral-sounding language is an unfair burden, and honestly a lot of the best
  moral progress would have been blocked if people had muzzled themselves that way.


  (3) Elected officials are a special case. When a legislator is actually voting,
  or a judge is writing an opinion, they should hold themselves to a stricter standard
  and set aside their private comprehensive doctrines, voting only on grounds that
  could be shared across worldviews.


  (4) At the same time, I''m not interested in policing souls: if a genuinely adequate
  public justification for a policy is available, then it doesn''t matter to the law''s
  legitimacy that a bunch of voters (or even the representative who introduced the
  bill) were actually moved by religious reasons; what matters is the public case
  that can be offered, not the private motives behind the votes.


  (5) But here''s what bugs me: I also think there is no religion-neutral way to draw
  the boundary between public and religious reasons in the first place. What counts
  as a reason "everyone has access to" depends on what you already count as shared
  standards of evidence or authority, so the sorting itself tends to favor secular
  worldviews while pretending to be neutral.


  (6) Finally, I care a lot about symmetry: I don''t want to impose a rule on religious
  citizens that I wouldn''t accept if I were a member of some minority faith, and
  likewise I don''t want a rule for officials that would look like naked majoritarianism
  if the shoe were on the other foot.


  Please go through this and tell me which commitments are genuinely in tension and
  which only look like they are, rank the tensions by severity (if there are more
  than one), and for each tension say what would have to give for the cheapest repair.
  I genuinely don''t know which of these is causing the problem, so don''t assume
  I''m attached to any particular one.


