  "The paradox of deontology is that a deontological constraint forbids, e.g., killing
  one innocent person even when that killing is the only way to stop five other people
  from being killed. Nozick captures this by saying that moral constraints are side
  constraints on action rather than goals to be promoted: a constraint does not identify
  a bad state of affairs that we should minimize, since that would license violating
  the constraint in order to reduce violations of it. The agent-relative reply says
  that a deontologist''s reason not to kill is indexed to her own agency. It is a
  reason for her not to kill, not a reason to minimize killings wherever they occur.
  So the paradox is only an artifact of assuming agent-neutral reasons. Once we give
  that assumption up, the constraint is perfectly coherent: I may not kill one to
  prevent five killings, and the five are attributable to the people who perform them,
  not to me. The agent-relative structure also explains the doing/allowing distinction
  and why I may not harvest one healthy person''s organs to save five patients. The
  only residual worry is that agent-relative reasons can seem mysterious, but Kantian
  and contractualist accounts of duties to others provide adequate grounds for them."


