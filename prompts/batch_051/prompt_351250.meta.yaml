  Question:

  "Deontologists sometimes claim that certain types of action are wrong even when
  performing that very type of action is the only way to prevent a greater number
  of performances of that same type of action by others. Explain why this structure
  has seemed paradoxical to critics, and evaluate the response that the paradox disappears
  once deontological reasons are understood as agent-relative. In your answer, distinguish
  a constraint from a goal, and say what, if anything, remains problematic for the
  deontologist."


