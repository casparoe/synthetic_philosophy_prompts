  may infer ''Q.'' In a well-known story, a tortoise accepts both statements but still
  refuses to accept Q, so we offer it a third statement: ''If P, and if P then Q,
  then Q.'' The tortoise accepts that too but still will not take the step to Q, and
  the same thing happens no matter how many further statements we add. The lesson
  people usually draw is that a rule of inference is not just another premise: adding
  premises can never force the step the rule is supposed to license, so treating the
  rule as a premise starts an endless regress.


  Now consider proof-checking software of the sort used to verify mathematical proofs.
  The checker is programmed with a fixed list of inference rules. It verifies a proof
  by confirming that every step is an application of one of those rules, and it certifies
  the proof if so. But the rules themselves are built in and are never proved, questioned,
  or justified by the checker; they are simply applied. That looks like a quiet commitment:
  the software treats basic rules of inference as things we are entitled to use without
  first establishing them, and perhaps as things that cannot be established by the
  kind of argument the software checks.


