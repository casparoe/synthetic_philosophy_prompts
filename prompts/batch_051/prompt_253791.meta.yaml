  proofs by checking every step against a fixed list of built-in inference rules.
  If a proof follows the rules, the checker certifies it; if a step doesn''t follow,
  it rejects it. But the rules themselves are just programmed in and never questioned,
  proved, or justified by the checker. This seems to be a design choice that quietly
  takes a side in the tortoise puzzle. It treats the rules as things that can simply
  be applied, not as statements that need to be accepted.


