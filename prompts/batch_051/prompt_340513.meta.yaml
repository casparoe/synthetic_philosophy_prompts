  I am putting together a document for a working group on the conceptual foundations
  of learning human preferences from behavior, and I would like you to draft it. The
  document is to be the joint statement of an adversarial collaboration between two
  camps in inverse reinforcement learning (IRL) and preference inference. The first
  camp — call it the recovery camp — holds that the reward functions IRL algorithms
  extract from observed behavior are, at least in principle, recoverable descriptions
  of an agent''s actual preferences: choices are produced by (possibly noisy or bounded)
  optimization of a reasonably stable underlying reward, and with enough structure,
  the right state representation, and suitable priors, IRL can be said to discover
  the preference that was already there. The second camp — call it the constructivist
  camp — holds that IRL does not discover a pre-existing preference so much as construct
  a compact rationalizing summary of a behavioral record; human and animal behavior
  is shaped by habits, norms, framing, affect, and context, and there may be no unique,
  stable utility function behind it. On this view the reward function is an artifact
  of the modeler''s choice of features and priors, and two equally predictive but
  different inferred rewards often have equal claim to being "the" preference.


  The deliverable should read as a document both camps could put their names to. It
  should include: (1) a numbered list of substantive claims both sides can sign —
  about the IRL formalism, about what gets assumed when a reward function is fit to
