  Draft:


  "For a work-in-progress piece on well-being, I''ve set down my current views and
  I want a consistency audit before I circulate them. My commitments, as precisely
  as I can state them:


  1. Hedonism: a life goes better or worse for the person living it solely in virtue
  of the felt quality of experience — the balance of pleasant and unpleasant states,
  broadly understood.

  2. Adaptation: we adapt to stable circumstances, good or bad; the hedonic treadmill
  largely neutralizes standing conditions. Because of this, novelty, variety, and
  adventure are among the most important prudential goods — but their importance is
  entirely instrumental, as bulwarks against adaptation.

  3. A case verdict: take two eighty-year lives with equal lifetime sums of pleasant
  and unpleasant experience. The first is the same very pleasant day looped; the second
