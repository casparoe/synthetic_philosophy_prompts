  Let me consider the corrigibility/shutdown problem. The essence: if an agent is
  utility-maximizing over outcomes, it will resist being shut down because shutdown
  prevents it from achieving its goal. To make an agent corrigible (allow shutdown),
  we can''t just make it maximize a utility function with shutdown as an option, because
  it may have incentives to disable the shutdown button, or if utility includes shut
  down, weird. There''s a known "shutdown problem" where an agent is incentivized
  to disable its off switch. We can formulate a step-by-step argument:


  (1) Suppose an agent A has a goal G and maximizes expected utility of G.

  (2) If A is shut down, G will not be achieved / less utility.

  (3) A can sometimes prevent shutdown (disable button).

  (4) A utility maximizer selects actions with highest expected utility.

  (5) Preventing shutdown has higher expected utility for G than allowing shutdown.

  (6) So A will prevent shutdown if it can.

  (7) Therefore a useful utility maximizer is not shutdownable/corrigible.


