  Löbian argument for self-trust:

  (1) An agent that trusts itself must be able to assert "if I prove P, then P" (reflection
  / soundness).

  (2) For any sufficiently strong formal system T, T cannot prove its own soundness
  (Löb''s theorem).

  (3) The agent''s reasoning is a formal system T of the relevant kind.

  (4) So the agent cannot prove (and hence cannot assert, from its own reasoning)
  that its proofs are sound.

  (5) So the agent cannot trust itself.


