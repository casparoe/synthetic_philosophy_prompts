  which features of its implicit theory are genuinely required by the practice as
  it exists, and which could be replaced by rival theories of autonomy without changing
  the practice at all. Throughout, separate what is reasonably settled among people
  who work on autonomy and coercion from what is genuinely contested, and do not present
  one reading of Rousseau or one theory of autonomy as the consensus where it is not.


