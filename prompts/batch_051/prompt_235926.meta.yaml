  ---


  One of the more puzzling claims in the history of political philosophy is Rousseau''s
  argument in The Social Contract that someone who refuses to obey the general will
  may be compelled by the whole body to comply, and that this compulsion makes the
  person free rather than simply subdued. I want to approach that claim not as a text
  to be interpreted but as a live question about an existing practice.


  Consider short-term involuntary psychiatric commitment. In many jurisdictions a
  person may be detained, commonly for an initial seventy-two hours with extensions
  available, and may be medicated against his or her stated wishes, if a clinician
  or two judges that the person is a danger to himself or herself. The official rationale
  often includes restoring the person''s autonomy or protecting his or her liberty,
  and clinicians often describe the intervention as allowing the person to return
  to himself or regain control of his own life. Yet at every moment before release,
  the person is refusing the detention and the medication.


  What philosophy of freedom and the will does this practice presuppose?


  First, what must be true of a person''s will for it to be coherent to say that detaining
  and medicating him against his expressed will restores his freedom? Reconstruct
  the implicit view of the self — for example, a split between a transient or impaired
  will and an enduring or well-functioning will, with the second authorized to override
  the first — and say how much of that structure the practice strictly requires, as
  opposed to merely fitting it.


  Second, is the Rousseauian analogy apt, or is it doing illicit work? Rousseau''s
  argument concerns a citizen whose private inclinations conflict with the general
  will of the political community, and whose compliance is said to realize his freedom
  as a citizen. Civil commitment, by contrast, sets a person''s present self against
  his future or restored self, and the community overrides one in the name of the
  other. Is this a faithful extension of Rousseau''s point, something closer to its
  opposite, or only a loose metaphor?


  Third, could a strict negative-liberty account, on which freedom is simply the absence
  of interference, render the practice coherent without the divided-self machinery?
  If so, what exactly is doing the justificatory work? If not, what is the least demanding
  positive conception of liberty that will?


