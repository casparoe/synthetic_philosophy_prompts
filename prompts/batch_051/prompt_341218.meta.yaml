  The debate is interpersonal utility comparisons. Jevons in The Theory of Political
  Economy says something to the effect that every mind is inscrutable to every other,
  and that there is no common denominator of feeling, so you cannot compare the amounts
  of utility two different people get from a thing. Robbins later made this the official
  line: comparing one person''s satisfaction with another''s is not a scientific statement.
  But a lot of welfare economics and moral philosophy keeps quietly doing it or presupposing
  it—Harsanyi''s impartial observer needs it, as do most uses of social welfare functions,
  and Sen''s whole project of comparing capabilities or functionings seems to require
  saying something about who is worse off. Nobody has refuted the ordinalist point,
  and yet the discipline hasn''t stopped using interpersonal comparisons either.


  My question is not who is right. I want a diagnosis of what kind of disagreement
