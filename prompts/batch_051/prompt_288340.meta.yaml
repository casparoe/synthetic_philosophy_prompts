  Satisficing: Herbert Simon. Satisficing = choosing an option that is "good enough"
  rather than optimal. Bounded rationality: humans have limited cognitive resources,
  so optimizing is infeasible.


  Standard objections to satisficing as a normative theory of rational choice:

  - The "why not maximize under constraints" objection: some argue satisficing isn''t
  really distinct from optimizing once search/decision costs are included; it''s optimal
  to satisfice in the presence of computation costs. So satisficing collapses into
  maximizing expected utility with information costs.

  - The "arbitrariness of the aspiration level" objection: the threshold is arbitrary
  — why set it here rather than there? Without a principled way to set aspiration
  level, satisficing is underdetermined.

  - The "too permissive" objection: satisficing licenses choosing any option above
  threshold even if slightly better options are available at no extra cost — it seems
  irrational to leave known free value on the table.

  - The "incompatibility with the axioms of rational choice / with transitivity of
  preferences or with dominance reasoning" objection.

