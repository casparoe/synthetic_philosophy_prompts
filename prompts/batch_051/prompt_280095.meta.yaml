  Let me write:


  ---


  I''m a PhD student in bioethics, working on the ethics of randomized controlled
  trials. Before I commit to a framework, I want a complete specification of what
  an adequate account of the ethics of randomization has to deliver. I know the rough
  positions — theoretical equipoise, clinical equipoise, the uncertainty principle
  — but what I need is the systematic list of requirements those positions are trying
  to meet, and which requirements are doing the real argumentative work.


  You are an expert research ethicist. Think carefully and with an eye to the hard
  cases; begin by brainstorming a list of candidate requirements in note form, stress-test
  each against actual trial designs and controversies, then present the refined desiderata.
  Give me the requirements list, with the case or consideration behind each, and say
  for each whether it is non-negotiable or a preference of a particular camp. Flag
  any requirement you suspect is smuggling in a prior commitment, and tell me whether
  any pair or subset of the requirements is jointly unsatisfiable — I most want to
  know where the list itself becomes a result. Then, briefly, how theoretical equipoise,
  clinical equipoise, and the uncertainty principle each do against the list; but
  keep that part short, since the criteria are the point. No bibliography, no citations,
  no literature summary.


  The theory should be good enough to guide an ethics committee or data monitoring
  committee in deciding when a trial may start, continue, or must stop, and good enough
  to explain, not just assert, the moral footing of randomization.


  Here are the kinds of demands I already suspect belong on the list, to give you
  the level of grain I''m after:


  - Someone''s physician enrolls them in a trial even though the physician personally
  believes — on clinical impression more than published evidence — that one arm is
  superior for this particular patient. The account must say whether the relevant
  uncertainty is a state of the individual clinician or of the community of experts,
  and must not let the two collapse into each other. Is individual therapeutic obligation
  compatible with randomizing one''s own patient?


  - A placebo-controlled trial for a condition that already has a proven effective
  treatment. The account must explain when, if ever, withholding or delaying that
  treatment is not exploitation, and why consent does or doesn''t do the justifying.
  It must also mark the difference between no prospect of direct benefit (the placebo
  arm) and justified risk in a trial that offers benefit to everyone.


  - Distinguish trials that answer a genuine unresolved question from trials run to
  satisfy regulators or to create marketing fodder — e.g., non-inferiority trials
  of me-too drugs, or placebo-controlled trials run when an established active comparator
  exists. How does the account rule out randomizing people to answer a question nobody
  actually needs answered?


  - Healthy-volunteer and human challenge trials: where the participant has no prospect
  of direct benefit and the risks are borne entirely for others. The account needs
  upper bounds on what may be asked, and a story about why those bounds differ for
  adults who can consent, children, pregnant people, and the unconscious or cognitively
  impaired, where consent is at best surrogate.


  - Trials that adapt: interim analyses that force early stopping because one arm
  is clearly winning, and response-adaptive or platform designs (of the sort used
  in some intensive-care and COVID-era trials) in which the randomization probabilities
  shift as data accrue. The account must say at what point continuing to randomize
  becomes wrong — what disturbs the initial permission — and whether a design that
  knowingly tilts chances toward a favored arm is compatible with the theory.


  - The cross-border case: the 1990s controversy over placebo-controlled trials of
  short-course AZT regimens to prevent perinatal HIV transmission, where an established
  longer regimen existed but was unaffordable in the trial sites. The account must
  say whether the relevant standard of care is local or global, and why — and what
  that does to the claim that uncertainty alone legitimates a placebo arm.


  I am aware that some of these may force a choice rather than a reconciliation. If,
  for example, the community-level condition that authorizes the trial in the first
  place and the individual-priority condition that forbids assigning a participant
  to an arm the emerging evidence marks as inferior cannot both be satisfied once
  the data start coming in, show me that tension explicitly and say which requirement
  you would relax and why. If you think the best list ends up excluding all three
  major positions, that is a fine answer too — say so. But make the requirements carry
  the argument."


