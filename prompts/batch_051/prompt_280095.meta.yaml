  Content of desiderata for a theory of the ethics of randomization:


  A theory must specify when it is ethically permissible to assign a participant to
  one arm of a randomized controlled trial by a method that ignores individualized
  judgment (randomization), given the treating physician''s fiduciary duty of personal
  care.


  Requirements (genuine desiderata) that must be satisfied:


  1. The consent and non-exploitation requirement: any account must explain why randomization
  does not amount to using the participant merely as a means or violating informed
  consent. Cases: participants in the control arm of a placebo-controlled trial when
  a known effective treatment exists. The theory must distinguish acceptable "no treatment"
  arms from those that withhold proven effective therapy.


  2. The fiduciary duty / therapeutic obligation requirement: must reconcile the trialist''s
  role as researcher with the clinician''s duty to each patient''s best interests.
  Cases: a clinician enrolling their own patients. The theory cannot just say "the
  role changes" without explaining when it''s OK to change roles.


  3. The individual vs. group uncertainty distinction: must explain whether the relevant
  uncertainty is a fact about the individual clinician (theoretical equipoise) or
  about the community of experts (clinical equipoise). Requirement: not collapse genuine
  first-person moral permission into statistical uncertainty. Case: a physician who
  strongly believes A is better for her patient based on clinical impression but the
  expert community is divided.


  4. The "which questions license randomization" requirement: must distinguish trials
  designed to resolve genuine disagreements/uncertainty among reasonable experts from
  trials designed for marketing, regulatory convenience, or to induce use of a product.
  Cases: non-inferiority trials for me-too drugs; trials against placebo when a better-established
  comparator exists.


  5. The requirement to respect inter-role and non-delegable duties: even in equipoise,
  an account must say why a patient''s doctor may farm out treatment selection to
  a coin toss while continuing to retain ultimate responsibility; can moral permission
  be transferred?


  6. The priority of the individual over science requirement: must satisfy the constraint
  that the benefits to future patients cannot, by themselves, justify harming or risking
  current participants. The theory must mark the asymmetry between therapeutic and
  non-therapeutic procedures: consent can make non-beneficial risk acceptable up to
  a degree, but there are upper bounds; no "social value" exception is unlimited.
  Cases: challenge trials, pediatric research, testing interventions with no prospect
  of benefit to the participant.


  7. The special-populations requirement: must explain what changes for children,
  pregnant people, the unconscious, the severely cognitively impaired — those who
  cannot consent. A theory can''t hand-wave "surrogate consent." Requirement: risk
  thresholds must differ, and equipoise might not be enough.


  8. The requirement to handle evolving evidence / early stopping and adaptive designs:
  the theory must say how the permission to randomize changes as data accrue — at
  what point does continuing to randomize become unethical because equipoise has been
  disturbed — and whether adaptive/response-adaptive randomization (which intentionally
  skews probabilities) is compatible with the theory. Cases: interim analyses forcing
  early termination (e.g., the classic example of a treatment showing clear benefit
  early); response-adaptive designs like those proposed in platform trials (e.g.,
  during COVID).


  9. The requirement to handle international/justice dimensions: must explain whether
  the uncertainty condition is sufficient to permit placebo-controlled trials in low-resource
  settings when effective but unaffordable treatment exists in high-resource settings.
  The theory needs to say whether "standard of care" is local or global and why. Cases:
  AZT trials for prevention of mother-to-child transmission in the 1990s; later debates
  over revisions to Declarations.


  10. The requirement to explain the moral relevance of randomization itself vs. the
  no-treatment arm: is randomization the morally problematic bit, or is it the failure
  to provide a preferred treatment? The theory must distinguish.


  Now, which are non-negotiable vs preferences? Non-negotiable: consent/non-exploitation,
