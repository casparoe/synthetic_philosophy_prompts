  Simpson''s paradox classic: Berkeley gender bias case. An argument like:


  "(1) Before stratifying, a treatment appears better; after stratifying by a confounding
  variable, the effect reverses. (2) Since adding any conditioning variable can reverse
  an association, and we can''t know in advance which variables to condition on, (3)
  any observational association is consistent with any causal conclusion. (4) So observational
  epidemiology can never produce evidence for causation. (5) But that''s absurd, because
  smoking-causes-cancer was established observationally. Therefore one of (1)-(4)
  is false. Where does it go wrong?"


  That''s good: the subtle flaw is between associational and causal claims; Simpson''s
  paradox is about association reversal, not about whether causal inference is impossible;
  the resolution is causal modeling (do-calculus, confounder selection, etc.). It''s
  "prove too much." The conclusion (4) is absurd given (5). The prompt asks where
  it goes wrong. It could be type C. This is nice and doesn''t need web.


