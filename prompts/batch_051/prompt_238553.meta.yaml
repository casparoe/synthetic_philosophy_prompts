  freedom by turning themselves into a thing, a passive object pushed around by circumstances.
  It''s a lie to himself.


  Move 2 (Daniel): That''s not fair. Sartre never says constraints are unreal—facticity
  is those constraints. Tunde''s job isn''t a pretend obstacle. A child who needs
  expensive care isn''t just "a fact he gives a meaning"; the treatment has a monthly
