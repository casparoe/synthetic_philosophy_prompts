  Delusions: In psychiatry/philosophy, delusions are fixed false beliefs not explained
  by cultural background, held despite evidence. The question: are delusions really
  beliefs? Doxasticism holds that delusions are beliefs (they simply are irrational
  beliefs); anti-doxasticism (e.g., Gregory Currie, Tim Bayne? Actually Bayne & Pacherie)
  suggests delusions are not beliefs but imaginings, or "empty speech acts"; there''s
  also the "two-factor theory" of delusion formation, defended by Max Coltheart, Martin
  Davies, Robyn Langdon, Philip Gerrans, etc. Two-factor: Factor 1 = a neuropsychological
  anomaly that provides the experiential content or datum (e.g., in Capgras, loss
  of affective response to familiar faces leads to the experience that the spouse
  is unfamiliar); Factor 2 = a failure of the belief-evaluation / hypothesis-testing
  system that would normally reject the bizarre hypothesis (so it gets endorsed).
  There is debate about whether the endorsement is a belief or an avowal. The two-factor
  theory is about how delusions arise, not directly whether delusions are beliefs,
  but there is interaction: if the second factor is a failure to reject implausible
  content, maybe the patient forms a belief; anti-doxasticists say the second factor
  is a failure to monitor imaginings, so it''s not a belief.


