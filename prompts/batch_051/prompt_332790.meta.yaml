  ---


  Recently I took over a safety model at work, and the central dispute is philosophical
  rather than technical. On one side I am drawn to a principle — let me call it regularity
  — that a rational probability assignment should give positive probability to every
  possibility. The principle is compact and appealing: if probability represents epistemic
  possibility, then a zero seems to say "this cannot happen," and using zero for something
  that could happen looks like an outright mistake, not a conservative rounding. It
  even functions as a decision procedure, since it rules out whole classes of assignments
  rather than leaving every judgment to case-by-case intuition.


  On the other side I have a conviction I cannot dislodge: a continuous measurement
  such as the exact load on a structural component has a continuum of possible values,
  and a well-built continuous model assigns each exact value probability zero. I would
  not regard an engineer as irrational for using such a model; I would regard the
  alternative as unusable in practice. But I also hesitate to accept the easy response
  that the zero-probability outcomes are impossible, because that rewrites the meaning
  of "possible" to make the intuition fit.


  I am not asking which side is standard. I am asking what it would cost to surrender
  either side, and whether there is a reading under which both can be kept. In particular:
  should I debunk the intuition that each of a continuum of exact values is possible,
  or amend the regularity principle, and what would each move require? Is the right
  resolution to distinguish senses of "possible" (logical, physical, epistemic) and
  claim the principle only governs one of them? Would moving to infinitesimal probabilities
  or relaxing countable additivity preserve the principle at an acceptable price?
  And if the principle must be given up, what remains of the idea that probabilities
  measure possibilities?


  Please write your answer in American English.


