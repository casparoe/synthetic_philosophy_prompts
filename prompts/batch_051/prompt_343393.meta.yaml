  In debates about long-term institutional development and AI alignment, one often
  encounters a warning pressed into the shape of an analogy: a value system, institution,
  or civilization changes its values the way a ship has its planks replaced one at
  a time over many years — no single replacement is alarming, the repair each time
  is locally reasonable, the vessel keeps its name and seems to be the same ship,
  and yet at the end there may be nothing of the original planks left, so that the
  ship that arrives in port is, in the only sense that matters, a different ship that
  no one ever explicitly chose to board. The analogy is used to argue that gradual,
  individually tolerable value drift is a serious risk across long time horizons:
  a future civilization or AI system could end up with values that no present person
  would endorse, without any dramatic betrayal or takeover ever occurring.


