  I am a student taking a course on classical Chinese philosophy, and a debate from
  that course has been colliding in my mind with something I learned in a course on
  law and society. The Confucians we read defend the view that care and obligation
  should be graded: one owes most to parents and children, less to more distant relatives,
  less again to acquaintances, and least to strangers, and they regard this hierarchy
  not as selfish favoritism but as the seedbed of moral development. Mozi attacks
  just this ordering and argues that we should practice impartial care toward everyone,
  taking a stranger''s welfare as seriously as our own parents'' when we decide what
  to do. I want to understand a concrete institution in light of that dispute.


  The institution is family-based immigration policy. In the country where I am studying,
  the immigration system gives an enormous priority to family reunification: a citizen
  or permanent resident can sponsor a spouse, child, or parent, and in some categories
  an adult sibling, while a foreigner with scarce skills or a pressing humanitarian
  claim may wait for years or have no comparable path. The sponsoring relative must
  also sign a legal undertaking promising to support the sponsored family member financially
  so the newcomer does not become dependent on public funds.


