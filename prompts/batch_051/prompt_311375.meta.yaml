  ---


  I recently read a magazine article about whether we have moral obligations to insects,
  and it put forward something called the "scale argument" in a way that unsettled
  me. The article''s account went roughly like this: At any moment, there are on the
  order of a quintillion insects alive, which is vastly more than all humans and farmed
  animals combined. Science cannot yet tell us whether insects are conscious, and
  for most insects the probability that they can feel anything at all is probably
