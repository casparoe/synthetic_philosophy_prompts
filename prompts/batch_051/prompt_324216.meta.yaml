  "Decomposition is an implicit theory of the task"


  Consider a base task that is value-laden in a familiar way: "Draft a fair promotions
  policy for our department." In iterated amplification, a human overseer decomposes
  this into subtasks — say, gather legal constraints, survey how past promotion decisions
  were made, list affected stakeholders and their interests, draft candidate policies,
