  copies to speed up subtasks, and the subtasks can be recursively decomposed further.
  The result is an amplified policy: a slow, expensive procedure that combines human
  judgment with machine assistance and that, in the ideal case, does the base task
  better than either alone.


  My target is a step that is usually treated as a mere implementation detail: every
  act of decomposition must specify interfaces between subtasks. Each subtask has
  an input contract and an output contract, and these contracts fix what information
