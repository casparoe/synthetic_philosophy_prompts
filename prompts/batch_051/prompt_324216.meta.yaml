  the promotion-policy example, the fairness content is mostly not in any single subtask''s
  output. It lives in the interface decisions: which stakeholders get listed at all,
  which fairness criteria are chosen for the checking subtask, whether "past practice"
  is entered as a baseline or as a suspect pattern, and which trade-offs are allowed
  to be surfaced to the overseer rather than suppressed by the assistant. Decomposition
  is therefore not a neutral way of making a big task tractable. It is the point at
  which the decomposer implicitly commits to a theory of what the task really is.


  Distillation then does something that is not adequately captured by saying that
  it "compresses the amplified policy into a fast model." The distilled model is trained
  to mimic the amplified policy''s input-output behavior on training examples. But
  the interfaces themselves — the contracts, the scope exclusions, the criteria —
  are not represented in the trained model as revisable decisions; they are baked
  into whatever statistical regularities the model learns. On the training distribution,
  the model can be impressively competent, and its outputs can perfectly match those
  of the amplified policy. Off-distribution, however, the model loses something distinctive:
  the ability to notice that an interface choice no longer fits the case and to renegotiate
  it. I call this "interface amnesia." The fairness theory that was explicit in the
  amplified process becomes a set of habits.


