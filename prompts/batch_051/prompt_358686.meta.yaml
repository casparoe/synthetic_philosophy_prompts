  Classic lottery paradox:

  - (1) If the probability of a proposition is sufficiently high (above threshold),
  then it is rational to believe it.

  - (2) In a fair lottery with n tickets, for each ticket i, it is highly probable
  that ticket i will lose, so it is rational to believe "ticket i loses".

  - (3) If it is rational to believe p and rational to believe q, then it is rational
  to believe p & q (conjunction closure).

  - (4) So it is rational to believe all tickets lose.

  - (5) But it is rational to believe some ticket wins (because you know the lottery
  is fair and guaranteed).

  - (6) Contradiction.

  Ask, assuming one refuses to reject (5), where does the argument fail? That''s standard.


  Preface paradox:

  - (1) For each sentence in your carefully checked book, you rationally believe it''s
  true.

  - (2) If you rationally believe each of p1...pn, then you rationally believe their
  conjunction.

  - (3) But you also rationally believe your book contains at least one error.

  - (4) Contradiction.


