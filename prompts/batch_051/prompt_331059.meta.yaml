  ---


  As the director of food procurement for a network of fourteen regional school districts
  serving roughly 110,000 meals per school day, I need to operationalize a commitment
  our board has already made: to minimize expected animal suffering per meal, counting
  not only farmed animals but also wild animals harmed in the production of feed crops
  and plant-based ingredients. My team of three procurement analysts, none of whom
  has formal ethics training, reviews our protein portfolio twice a year and scores
  each product line (beef, pork, chicken, eggs, dairy, textured plant protein, legumes
  and grains) for the coming two semesters. The board will approve any recommendation
  that raises per-meal cost by more than ten percent only if it is accompanied by
  a written animal-welfare justification using the procedure you give us. The analysts
  have about ten working days per review cycle, working from vendor data sheets that
  report species, average stocking density, days to slaughter, feed tonnage per kilogram
  of output, and crop sources but no welfare estimates.


  The principle we are trying to translate is, roughly: expected animal suffering
  should be minimized, and no source of animal suffering should be dismissed merely
  because it is indirect, wild, small in individual magnitude, or uncertain. But that
  principle immediately collides with the practical choices we face: beef scores badly
  on feed conversion and uses large amounts of field crops, whose cultivation kills
  small wild animals; chicken scores badly on the number of individual lives and days
  of confinement but better on feed conversion; plant-based patties avoid farmed animals
  but may still depend on large-scale monocrop production with its own field-animal
  deaths. Some of my analysts now argue that beef might, on the wild-animal account,
  look *better* than chicken once crop deaths are counted, and that plant protein
  might look no better than chicken once you count harvest deaths. I cannot adjudicate
  these claims, and I do not want a procedure that simply assumes a number for how
  many field animals die per hectare.


  Please give me a reusable decision procedure — a checklist or ordered set of tests
  with decision points — that my analysts could actually run on each product line,
  and that respects the following constraints:


  - It must treat all quantities (deaths per hectare, days of suffering per animal,
  probability of sentience in invertebrates, etc.) as placeholders: for each empirical
  input, state what measurement or monitoring we would need, and specify how the ranking
  of beef, chicken, and plant protein changes across a reasonable range of that input
  rather than pinning the whole procedure to one contested figure.

  - It must be usable by people with no philosophical training: it should not require
  them to understand terms like ''valence,'' ''expected value,'' or ''aggregation''
  without an operational gloss.

  - It must explicitly mark every point at which a value judgment is being made —
  for example, whether juvenile field animals'' deaths count for less than adult chickens''
  deaths, whether deaths are discounted by the fact that the animals would not otherwise
  have existed, or whether aggregated small losses can outweigh one large loss.


  Work through the procedure on the following three cases, one of which should generate
  a result the board will not like:


  1. Replacing the default beef burger with a chicken patty, under the hypothesis
  that beef''s crop-footprint deaths are substantial once feed crops are counted.

  2. Replacing the chicken patty with a lentil-and-grain patty made from high-input
  monocrop legumes and wheat, under the hypothesis that harvest deaths in those crops
  are substantial.

  3. Continuing to serve whole eggs rather than switching to a low-welfare beef product,
  where the procedure must say whether the lifetime welfare of layer hens plus the
  male chick culling can be offset or not.


  Finally, tell me honestly what this procedure cannot do: where it would force a
  decision that rests on a contested philosophical choice rather than on facts, where
  it is likely to misfire, and which of our product rankings will remain genuinely
  indeterminate no matter how carefully the analysts follow it.


