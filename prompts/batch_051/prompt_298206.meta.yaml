  Scanlon''s contractualism: "An act is wrong if its performance under the circumstances
  would be disallowed by any set of principles for the general regulation of behaviour
  that no one could reasonably reject as a basis for informed, unforced, general agreement."
  Wrongness is about justifiability to each person: principles must be ones no one
  could reasonably reject. The aggregation problem arises because if we aggregate
  the complaints of many, we might justify harming one to benefit many. Scanlon resists
  this: the reasonableness of rejecting a principle is based on the strongest individual
  complaint, not the sum of complaints. So a principle permitting one person to die
  to save many from minor annoyances could be reasonably rejected by the one person;
  the many minor burdens don''t outweigh. But in cases where many people each face
  equally serious harms, aggregating can matter: if you can save either one stranger
  or five strangers from death, the numbers matter, and Scanlon allows that because
  each of the five has the same kind of complaint — the "tiebreaker" view. Actually,
  Scanlon''s view: numbers count when the claims are comparable/equal in force; the
