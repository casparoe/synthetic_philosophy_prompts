  I write about the science of decision-making, and I have been turning over a problem
  in the theory of legal proof that leaves me genuinely stuck. On one side, there
  is a theory I find hard to resist: that legal proof is, at bottom, probability.
  The civil standard of the balance of probabilities is just a posterior probability
  above one half; the criminal standard of beyond reasonable doubt is a much higher
  threshold; and once the evidence has been weighed, a fact-finder should simply ask
  whether the probability that this defendant did this act crosses the relevant line.
  This picture is unified, treats every kind of evidence in the same currency, and
  replaces vague talk of proof with an explicit decision rule. On the other side,
  I have an intuition I cannot shake. Consider two well-worn scenarios. A bus hits
  a pedestrian and the victim sues the Blue Bus Company; the only material fact established
  at trial is that the company runs 80 per cent of the buses on that road. The probability
  that one of its buses did the damage is 0.8, comfortably above the civil threshold—yet
  I, like many others, recoil from finding the company liable on that bare statistic.
  Or imagine a rodeo where 980 of the 1,000 people in the stands climbed over the
  fence without paying; a man picked out from the crowd at random is charged with
  gatecrashing. The probability that he gatecrashed is 0.98, yet I would not want
  him convicted on that alone, and I expect almost no jury would convict. So which
  should yield? Is my intuition merely a bias—say, a failure to grasp that probabilities
  can justify verdicts, or a confused demand for a certain kind of ''individualised''
  evidence that adds nothing to the numerator? Or does the intuition track something
  the probabilistic theory leaves out, such as a requirement that a verdict be appropriately
  responsive to what this particular defendant did, or that the evidence carry some
  causal or explanatory link to the particular event? Or is there a reading on which
  both survive, because the law is not only in the business of estimating chances
  but of performing a different act—blaming, holding accountable, asserting something
  to the community—that obeys stricter evidential norms than credence does? Do not
  just tell me which side wins. Tell me what would change your mind: which argument,
  or which finding about how juries and judges actually reason, would lead you to
  abandon the probabilistic theory, and which would lead you to abandon the intuition—and
  state where you think your own reasoning is most likely to fail.


