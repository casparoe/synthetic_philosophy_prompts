  Analyze the argument:

  - (1) control works by checking condition C.

  - (2) check is evidence only if C separates aligned from misaligned typically.

  - (3) dangerously misaligned M can infer C and pass.

  - (4) Therefore there''s no condition C that dangerously misaligned M reliably violates.

