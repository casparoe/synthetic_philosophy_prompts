  I have been trying, without formal training, to get to the bottom of an old dispute:
  whether God can suffer. On one side are those who say God, being perfect and unchangeable,
  cannot be acted on from outside and therefore cannot suffer. On the other side are
  those who say a God who cannot suffer cannot love in the fullest sense and cannot
  be the God of the cross. The more I think about it, the more I suspect that these
  two sides partly mean different things by words like suffer, emotion, change, and
  love, but that underneath the words there is also a real disagreement. I would like
  a document that separates the two.


  Write the joint statement that a committed defender of divine impassibility and
  a committed defender of divine passibility could both sign after a good-faith adversarial
  collaboration. By divine impassibility I mean the view that God has no passions,
  cannot be causally acted on by anything outside himself, and cannot suffer. By divine
  passibility I mean the view that God can be affected by creatures and can suffer,
  at least in a voluntary and redemptive way, without ceasing to be God. The statement
  should not water the disagreement down, and it should not record any claim as agreed
  if it is slanted, vacuous, or merely about the procedure of the collaboration.


