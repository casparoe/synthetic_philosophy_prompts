  jointly satisfied, and tell me which single requirement does the most to exclude
  the theories currently on offer. At the end, score briefly (a sentence each) how
  the standard consequentialist justification, the ''performance as evidence of consent''
  view, and the ''no independent standard of legitimacy'' view do against the list.
  Do not propose new theory, only the requirements. Keep the emphasis on the requirements
  and their cases."


