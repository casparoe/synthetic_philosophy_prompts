  I''m taking a course on Augustine''s ethics, and for an upcoming seminar I have
  to defend a reconstruction of his position on lying. As I was taught it, the position
  is this: a lie is a false statement made by a speaker who believes it to be false
  and who makes it with the intention that the hearer believe it; every such lie is
  a sin, though lies differ in gravity, and the prohibition admits no exception —
  not even a falsehood told to save an innocent life. The standard test case is the
  person who tells a would-be murderer that his intended victim is not in the house
  when in fact he is hiding there; Augustine, on this reconstruction, says the person
  must not lie, whatever the cost.


  But I have been turning over a different case that seems to fall just outside the
  definition, and I want to know whether that is a defect in the definition or a discovery
  about what Augustine meant by a lie. Suppose I am hiding a neighbor from someone
  who means to kill him. The man asks me, in a tone that leaves no doubt about his
  intentions, whether the neighbor is in my house. The neighbor is, right now, in
  the cellar. I look the man in the eye and say, truthfully, "I saw him heading toward
  the river half an hour ago." I say this because I know the man will infer that the
  neighbor is no longer here and will leave to search the river. Every clause I utter
  is true, and I know it is true; but I utter it precisely in order to produce a false
  belief. Is this a lie on the criteria above? Work through the criteria one by one.
  Where the verdict turns on how "the intention that the hearer believe it" is read
  — whether it means intending the hearer to believe the content of the assertion,
  or intending to bring about a false belief by any means — say so explicitly, and
  say which reading Augustine''s overall position requires and why. Then tell me whether
  the case is a counterexample to the criteria as stated, or a reason to distinguish
  lying from the wider class of intentional deception; and if the criteria need to
  be amended, propose the amendment and test it against the original murderer-at-the-door
  case.


