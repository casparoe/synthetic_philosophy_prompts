  Draft:


  "Camus held that the question whether life is worth living is the fundamental question
  of philosophy, and that any honest answer must begin from the absurd — the collision
  between the human demand that the world be intelligible and the world''s refusal
  to supply that intelligibility. On his account, meaning is not something the universe
  hands us; it is something built out of lucid revolt, freedom, and intensity of experience,
  with no appeal to hope or transcendence. Yet Camus insisted, in his essay on Sisyphus,
  that we must imagine Sisyphus happy as he returns down the hill for the boulder
  that has rolled back down.


  Now suppose Camus could read the last few decades of empirical and philosophical
  work on ''meaning in life.'' There, meaning is widely treated as an ordinary psychological
  variable: a life can have more or less of it, and it is measured by self-report.
  A standard framework decomposes meaning into three components: coherence (one''s
  life makes sense and hangs together as a narrative), purpose (one''s life is organized
  around valued goals and strivings), and significance (one''s life matters beyond
  itself, to other people or to something larger). Researchers find that people''s
  scores rise when they belong to groups, feel that their work matters, and can tell
  a redemptive story about suffering; people report that a purely pleasant and morally
  blank life sounds meaningless. Nothing in the framework requires that the universe,
  taken as a whole, be meaningful, or that life have a meaning in any cosmic sense.


  The question is not whether this research is methodologically sound. The question
  is what Camus would make of it. Would he see this notion of meaning as a harmless
  relabeling of the very revolt he praised, as a systematic evasion of the absurd,
  or as something else? More specifically: on the tripartite model, would Sisyphus
  — lucidly revolting, without hope, fully engaged in a task he knows is futile on
  the scale of the universe — score high in meaning or low? And can he think the scales
  are capturing something real while maintaining that the question ''what is the meaning
  of life?'' has no answer? Argue from Camus''s actual commitments; do not merely
  assert that he would be for or against."


