  I''ve been thinking on my own about whether some acts are wrong for a different
  reason than harm, and I keep coming back to desecration. I''m writing a short essay
  for a general audience, and I need a single, clean case built to order, because
  the ones I''ve invented all smuggle in a harmed person somewhere.


  The case I want: a person, acting alone and in secret, treats an object that is
  sacred to a living community (their own, ideally) with deliberate contempt — the
  kind of act a sanctity-based view would call desecration — but every harm-based
  consideration comes back empty. No one else sees it or ever learns of it; no one''s
  feelings are hurt; no one''s plans, practices, or relationships are disrupted or
  put at risk; the object is left physically unchanged in every observable respect;
  the person is neither caught nor distressed afterward. No other persons or sentient
  beings are affected. And I want this to involve an ordinary object such as a consecrated
  vessel, an icon, or a scripture, not a human body, remains, or grave, and with no
  appeal to God, supernatural punishment, or an afterlife.


  The two views I want the case to separate are these. The harm-only view says an
  act is wrong only if it makes some actual person (or sentient animal) worse off
  in a way that matters to them, by its actual consequences. So this case should leave
  a harm-only theorist with no one whose interests are set back. The sanctity view
  says certain objects have a set-apart status such that treating them with contempt
  is wrong in itself, independently of anyone''s awareness, distress, or any further
  consequence. Both views should be stated without metaphysics beyond the community''s
