  I direct a small high-risk seed-grant program at a private science foundation. Twice
  a year my screening committee reviews roughly thirty proposals that explicitly set
  out to overturn a consensus theory, method, or taxonomy rather than extend it. The
  committee members are competent scientists but rarely specialists in the field at
  issue, and they can spend no more than twenty minutes per proposal. Most of these
  proposals are almost certainly wrong, a few are probably right too early, and nearly
  all would be rejected by ordinary peer review as too risky. I need a reusable decision
  procedure, in numbered steps, for triaging such heterodox proposals. Ground it in
  the dispute between Popper and Kuhn over whether science can be rational during
  a revolution. Use Popper to build operational tests: whether a core claim is falsifiable,
  whether the proposers specify what observation would count against it, whether they
  offer a severe rather than perfunctory test, and whether the proposal protects itself
  with ad hoc qualifications. Use Kuhn to mark the limits of those tests: distinguish
  normal-science puzzle-solving from anomaly-driven revolutionary work, check whether
  the proposal engages the strongest current account rather than a strawman, and recognize
  that when the standards of a field are themselves at stake no neutral algorithm
