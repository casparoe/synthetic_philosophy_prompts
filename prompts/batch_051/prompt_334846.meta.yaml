  Draft unilateralist''s curse (criteria + borderline case):


  "I''m a software engineer on a platform team, no philosophy background, and we''re
  arguing about our merge policy. We have a rule that any engineer can approve their
  own PR and merge it as long as CI passes. For most code this is fine and keeps things
  fast. But for changes to shared infrastructure—auth, schema migrations, API contracts—one
  person''s decision can break everyone, and unlike a normal bug it can be really
  hard to unwind.


  I''ve been trying to articulate when we should switch from ''anyone can act'' to
  ''need several independent approvals before acting.'' The way I think about it,
  a decision is ''unilateralist''s-curse-y'' if it meets roughly these criteria:


  1. The person acting captures most of the benefit or convenience, but the cost of
  being wrong lands mostly on other people.

  2. Reasonable people genuinely disagree about whether the action is a good idea,
  and each person has private information (about the code, the risk, the user impact)
  that others don''t.

  3. The action is cheap for the actor to take, so there''s little natural brake.

  4. The bad outcome is hard or expensive to reverse.

  5. Waiting for a second or third opinion is cheap relative to the downside.


  The borderline case we keep fighting about: a senior engineer unilaterally merged
  a sweeping refactor of our logging library over a weekend. It wasn''t urgent. It
  touched like 200 files, broke a bunch of downstream dashboards that CI didn''t cover,
  and took us a week to sort out. But the refactor itself was arguably right—the old
  API was a mess—and the same person had a ton of private context on why the old design
  was causing outages. By my criteria... I honestly can''t tell if it qualifies as
  the kind of decision that should have required sign-off, or if it''s just a normal
  autonomous action that happened to go wrong and the lesson is ''better tests,''
  not ''more process.''


  So: does that case qualify as a ''requires multiple approvals'' decision under my
  criteria? Walk through each criterion, tell me where the criteria underdetermine
  the verdict, and say whether the case shows I need to add, drop, or sharpen a criterion.
