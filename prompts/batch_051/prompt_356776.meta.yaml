  The paradox of blackmail, classically: A threatens to reveal embarrassing (but true)
  information about B unless B pays A. The threat to reveal is legal (either because
  it''s true, or because revealing the information is generally not a crime, and sometimes
  it''s not defamatory since true), and the demand for money is legal (asking for
  money is fine). Yet the combined act—blackmail—is criminal/wrongful. So we have
  a situation where the conjunction of two permissible acts is impermissible. This
  is the "paradox" given a decompositional/compositional assumption about wrongfulness.


  Some solutions:

  - The threat is not really a threat to do something permissible because the information
  is B''s to control? Scholars differ.

  - Blackmail is wrong because of the harm to the victim''s autonomy/reputation; but
  that can''t distinguish it from other pressure.

  - Using private information as leverage constitutes wrongful exploitation.

  - The "seller" is profiting from a "third-party wrong"? Hmm.

  - The paradox in law/economics: blackmail as "the offer to refrain from an act that
  the offeror has a legal right to do" looks like a normal bargain — same as "pay
  me and I won''t build on my land." Yet blackmail is illegal. So the paradox is about
  the "commodification" or "rent extraction" from information.


  Some standard moves: James Lindgren''s "triangular" explanation: blackmail involves
  a third party (the person whose secret it is) whose interests the blackmailer threatens.
  But Lindgren notes the puzzle.


  Actually there''s a well-known formulation: "Why is it legal for A to reveal B''s
  secret, legal for A to ask for money, but illegal for A to offer to refrain from
