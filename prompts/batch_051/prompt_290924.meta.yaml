  Draft:


  "Two colleagues in my department, both working in metaethics, got into a dispute
  about whether expressivism can handle the Frege–Geach problem. I wrote down the
  exchange as they made it, and I would like a point-by-point adjudication of the
  argument as it actually unfolded.


  (1) The first said: Expressivism claims that a moral sentence''s meaning is the
  non-cognitive attitude it expresses — for instance, ''Lying is wrong'' expresses
  disapproval of lying. But consider the conditional ''If lying is wrong, then getting
  your little brother to lie is wrong.'' In asserting this conditional I need not
  disapprove of lying at all; I might simply accept the general principle that if
  some act is wrong, then enlisting a child to perform it is wrong. So the expressed
  attitude cannot be the meaning of the embedded sentence. Worse, the inference from
  ''Lying is wrong'' and that conditional to ''Getting your little brother to lie
  is wrong'' is a paradigm of valid inference, and validity is standardly defined
  as preservation of truth; if moral judgments are not truth-apt, expressivism cannot
  even state what makes this inference valid.


  (2) The second replied: that is too quick. The expressivist can treat accepting
  the conditional as a higher-order attitude, e.g., disapproval of the combination
  of disapproving of lying while failing to disapprove of getting one''s little brother
  to lie. Someone who accepts both premises but rejects the conclusion thereby holds
  a combination of attitudes of which, by accepting the conditional, they have already
  expressed disapproval. So validity here need not be truth-preservation; it can be
  a kind of attitudinal coherence. Being valid is the property of an inference whose
  premises and conclusion one cannot jointly accept in full. That is a distinctively
  expressivist account of the apparently logical relations, and it is exactly the
  kind of thing the Frege–Geach problem demands.


  (3) The first came back: that is a sketch, not a compositional semantics. You have
  not said how ''Lying is wrong'' contributes the same semantic value when it stands
  alone, when it appears in the antecedent of a conditional, under negation, or inside
  ''Either lying is wrong or we should move abroad.'' If you answer by assigning each
  such sentence a more complicated higher-order attitude, you get an unending hierarchy
  and no finite account of the meanings speakers grasp. If instead you assign moral
  sentences truth-values relative to a standard or to a world-plus-norms index and
  compute embeddings in the familiar way, then your theory looks like a version of
  relativism or descriptivism, and you owe an account of what is left of the idea
  that moral language is essentially expressive rather than descriptive.


  (4) The second answered: the hierarchy objection confuses two things. The semantic
  value of a sentence is given recursively, once and for all; that a different attitude
  may be involved in accepting more deeply embedded sentences does not mean the semantic
  theory itself contains an infinite descending regress. And giving a compositional
  semantics through world-plus-norms indices is not the same as admitting that moral
  sentences are purely descriptive. The expressivist''s thesis is not that moral language
  lacks truth-conditions in every relativized sense, but that its point and function
  in thought and talk is to express attitudes and to coordinate action; a semantics
  can assign truth-conditions relative to standards and still say that what makes
  the language moral is its expressive function. So the collapse charge assumes a
  false equation between ''has a model-theoretic semantics'' and ''is descriptive.''


  Please adjudicate the dispute move by move: rate each of the four moves from clearly
  mistaken to clearly right, briefly justify each rating, and say who is right about
  which specific point and what, if anything, both of them are missing."


