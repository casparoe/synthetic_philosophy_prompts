  Expressivism (e.g., Ayer, Stevenson, early emotivism) says moral sentences express
  non-cognitive attitudes rather than beliefs. "Murder is wrong" expresses disapproval
  of murder. The Frege–Geach problem: when moral sentences are embedded in unasserted
  contexts, the attitude isn''t expressed. "If murder is wrong, then paying a hitman
  is wrong" — the speaker isn''t necessarily disapproving of murder in asserting the
  conditional. An expressivist needs a compositional semantics where the meaning of
  "murder is wrong" in embedded contexts combines to yield the meaning of the whole
  conditional. Moreover, expressivists need to explain why modus ponens preserves
  validity: if expressivism denies that moral sentences are truth-apt, how can moral
  arguments be valid in the standard sense?


  Standard accounts: Blackburn''s quasi-realism and attitude semantics (higher-order
  attitudes: disapproval of combinations of attitudes); Gibbard''s norm-expressivism
  and factual–normative worlds; Schroeder''s criticism that expressivism can''t give
  a compositional account without collapsing into a form of descriptivism (the "negation
  problem" etc.).


  I can craft a disagreement between two graduate students. Moves:


  (1) Person A: Expressivism dies on the Frege–Geach problem: it says "lying is wrong"
  expresses an attitude, but in "If lying is wrong, then getting your little brother
  to lie is wrong," the speaker need not have any negative attitude toward lying itself.
  So the meaning of the embedded sentence can''t be the attitude, and standard validity
  for the inference is unexplained.


  (2) Person B: That''s too quick. A conditional can be seen as expressing a higher-order
  attitude: disapproval of simultaneously disapproving of lying and yet failing to
  disapprove of getting your brother to lie. The inference goes through because you
  can''t accept the premises (hold the higher-order attitude plus the first-order
  attitude) and reject the conclusion without a kind of incoherence (like being "fettered
  by attitudes"). So the expressivist can explain validity as a kind of attitudinal
  inconsistency, not truth-preservation.


  (3) Person A: But that''s exactly the problem: you''ve just helped yourself to attitudes
  whose content includes moral concepts — "disapprove of failing to disapprove of
  getting your brother to lie" — without explaining how the embedded sentence contributes
  its meaning compositionally. You need a compositional semantics that assigns to
  "lying is wrong" the same thing in embedded and unembedded contexts; otherwise meaning
  isn''t compositional and you haven''t explained how speakers understand novel sentences.
  And when you try to make it compositional, you either end up needing an infinite
  hierarchy of attitudes (each embedding adds another layer), or the account collapses
  into treating moral sentences as describing attitudes — i.e., descriptivism.


