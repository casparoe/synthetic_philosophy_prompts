  No-trade theorem (Milgrom & Stokey 1982): If all agents are rational (Bayesian),
  have common priors, and trade is common knowledge, then speculative trade on differences
  in information alone cannot occur — because an offer to trade at a given price reveals
  that the counterparty has information favoring the trade, which should make you
  update and not trade. More precisely: no trade can be common knowledge as mutually
  beneficial when starting from a Pareto-optimal allocation and differences are purely
  informational. If everyone is rational and has common priors, then if someone is
  willing to sell at price p, that willingness itself is information that should move
  your posterior; there''s no room for "agreeing to disagree" (Aumann). So no-trade
  theorem generalizes Aumann''s agreeing-to-disagree.


  The puzzle: why was there massive trading volume on Black Monday if no-trade theorem
  predicts thin markets? Also the Grossman-Stiglitz paradox: if prices fully reflect
  all information, no one has incentive to gather information, so markets can''t be
  informationally efficient. Trading volume itself is a puzzle for the strong efficient
  market hypothesis.


