  Draft full prompt:


  ---


  I am a journalist who covers ideas across the life sciences and the physical sciences,
  and for years I have noticed that my scientific sources enforce a rule they never
  state. Teleological language — explaining something by what it is for — is permitted,
  even encouraged, in one part of science and barely tolerated as metaphor in another.


  A physiologist will tell me without hedging that the function of the heart is to
  pump blood, that the kidney is there to filter metabolic waste, and that the role
  of the nephron is osmoregulation. An evolutionary biologist will say, just as literally,
  that feathers arose for thermoregulation and only later acquired the function of
  flight. None of this is understood as figurative. Yet if a planetary scientist said
  that the ozone layer exists to shield the Earth''s surface from ultraviolet radiation,
  or a physicist said that an atom fills its valence shell in order to become stable,
  colleagues would take the words back as a manner of speaking — not as an explanation.
  Engineering sits oddly between: a control engineer says a governor''s function is
  to stop a turbine running too fast, and no one demands a history of natural selection
  to make the statement respectable.


  The border looks at first as if it is just natural selection: organisms have parts
  shaped by selection for their effects, whereas atoms, rivers and ozone layers do
  not. But I can already see that selection cannot be the whole story. Some features
  with a biological ''function'' were not selected for the role they now perform;
  some by-products keep organisms alive without ever having been selected for that
  effect; and artifactual functions arise by design rather than selection. Meanwhile,
  the ozone layer is itself a by-product of the evolution of oxygenic photosynthesis,
  yet scientists hesitate to call its shielding effect a function.


  What I want from you is the strongest principled account of this border — the best
  justification that can be given for treating ''the heart is for pumping blood''
  as explanatory while treating ''the ozone layer is for shielding the surface'' as
  metaphor. Please state the principle precisely, test it against the hard cases above
  and at least one further case of your own (say, a synthetic bacterium engineered
  to degrade plastic, or a physical system that a physicist might describe in overtly
  functional terms), and then tell me honestly whether the border as working scientists
  actually draw it should be kept, dropped, or redrawn — and if it should be redrawn,
  where.


  I am interested in the argument itself, not in a survey of the literature, so please
  do not pad the answer with references or a reading list. I ask for British English
  throughout. Finish with a final line beginning ''Verdict:'' that gives the one-line
  bottom line.


  ---


