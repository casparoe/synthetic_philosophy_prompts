  ---


  As a journalist who covers both the life sciences and the physical sciences, I have
  become puzzled by a rule my sources seem to apply without ever stating it. The same
  teleological grammar that is treated as literal and respectable in one discipline
  is treated as a metaphor to be corrected in another.


  Some examples from routine scientific speech. A physiologist will say, without any
  hedging, that the function of the heart is to pump blood, that the kidney is there
  to filter waste, that the role of the nephron is osmoregulation. An evolutionary
  biologist will say that feathers originally served thermoregulation and only later
  acquired the function of flight. In the same week, a planetary scientist who remarked
  that the ozone layer exists to shield the surface from ultraviolet radiation would
  probably add, ''of course, not literally to'', and a physicist who said that an
  atom fills its outer shell in order to become stable would be understood as speaking
  figuratively. Yet neither of those scientists seems to think they are denigrating
  their own field; they are enforcing a distinction they could not easily state.


  Engineering sits awkwardly: a control engineer will say, quite literally, that the
  function of a governor is to limit the speed of a turbine, though no one supposes
  the governor was produced by natural selection.


