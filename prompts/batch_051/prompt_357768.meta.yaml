  Domain: propensity interpretation of fitness and tautology objection.


  Core concepts:

  - Tautology objection: "survival of the fittest" looks like defining fitness by
  survival/reproductive success. If fitness = actual reproductive success, then "organisms
  with higher fitness leave more offspring" is true by definition; natural selection
  explains nothing, tautological.

  - Propensity interpretation (e.g., Mills & Beatty 1979, Brandon): fitness is not
  actual offspring count but a probabilistic disposition — a propensity — of an organism
  (or genotype/trait) to contribute offspring in a specific environment. Then survival
  of the fittest becomes: those with a higher propensity (expected reproductive success)
  leave more offspring on average, but not necessarily in any given case. This is
  a substantive empirical claim because propensities can be specified independently
  of actual outcomes, like a loaded die has a propensity to land six even before you
  roll.

  - Problems: single-case propensities vs. long-run frequencies; measurement circularity
  (how estimate probability of reproduction without counting outcomes); environmental
  relativity; drift — random variation can cause fitter types to lose; "expected offspring
  number" depends on population growth vs. selection; propensity as cause vs. statistical
  summary. Beatty and Sober later? The tautology objection vs. propensity solution.


