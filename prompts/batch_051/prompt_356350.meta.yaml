  Ergodicity economics: Ole Peters and Murray Gell-Mann (and collaborators) argue
  that in economics and decision theory, expected values should be evaluated by time
  averages over a single realized trajectory, and that ensemble averages equate time
  averages only if the process is ergodic. For non-ergodic processes (e.g., multiplicative
  wealth dynamics), optimizing expected wealth ignores the difference between time-average
  growth and ensemble-average growth, leading to "irrational" choices from the individual''s
  perspective (e.g., accepting a favorable coin toss repeatedly that leads almost
  surely to ruin). The debate: mainstream economics/decision theory uses expected
  utility/ensemble averages; ergodicity economists say this is a mathematical error
  (assuming ergodicity where it doesn''t hold) and propose growth-optimal/time-average
  decision criteria.


  Why has the debate stalled? Possible diagnoses:

  (a) Verbal/substantive: maybe both sides agree on the mathematics (Jensen''s inequality,
  non-ergodicity) but disagree on which quantity is the correct object of choice—expected
  utility across states versus long-run trajectory. Expected utility theory is about
  preferences over gambles at a point in time, not necessarily about repeated choices;
  so Peters may be attacking a different problem ("What maximizes expected wealth?"
  vs "What should an individual choose to do repeatedly over time?"). The disagreement
  could be about the appropriate model of the decision problem.

  (b) Normative vs descriptive: Expected utility could be a normative theory of rational
  preference, whereas time-average optimality is a descriptive criterion for long-run
  survival/growth; they answer different questions.

  (c) A hidden empirical/substantive question: are real-life decision problems ergodic
  or non-ergodic? Is the relevant average tied to one lifetime (time) or a cross-section
  of agents (ensemble)? These are partly empirical and partly modeling choices.

  (d) A disagreement about what "expected value" means: ensemble-average expected
  value vs time-average. Maybe one side defines utility over wealth and one over growth
  rate or log wealth; again possibly verbal but also substantive risk preferences.


