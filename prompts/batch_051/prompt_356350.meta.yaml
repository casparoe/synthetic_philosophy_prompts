  ---


  Over the past decade and a half, decision theory and economics have hosted a stalled
  dispute about how to average a risky prospect. The standard expected-utility and
  modern-portfolio frameworks evaluate a gamble by its ensemble average: the mean
  over all possible parallel realizations at a fixed time, weighted by their probabilities.
  The ergodicity critique, most closely associated with Ole Peters, answers that for
  a single agent whose wealth evolves over time, the quantity that actually accumulates
  is the time average—the growth rate along one realized trajectory, which for multiplicative
  dynamics is the geometric mean, or equivalently the expected logarithm of the growth
  factor. The two averages agree when the relevant process is ergodic; for non-ergodic
  multiplicative growth they can diverge. The canonical illustration is a repeated
  favorable coin toss, positive in ensemble expectation, whose time-average growth
  rate is negative, so that an agent who always accepts it has wealth that almost
  surely tends toward zero. The mathematics here is not contested. Yet after years
  of exchanges, the two camps have not moved toward a common evaluation rule: the
  orthodoxy treats the time-average criterion as a confusion between a one-shot gamble
  and a repeated strategy, while the critics treat the ensemble criterion as an ergodicity
  assumption smuggled into problems where it does not hold.


  My working hypothesis is that this is not a live formal disagreement and not an
  empirical one either, but a disagreement about how to individuate a decision problem
  and which probability space is the correct object of choice: the ex ante spread
  of states at a time versus the temporal path of a single world. I want a diagnosis
  rather than a survey or a verdict. Is the standoff verbal, substantive-formal, substantive-empirical,
  or a case of two camps answering different questions under one label—one about rational
  preference at a time, the other about long-run survival and growth? Support the
  diagnosis from what each side actually says, state precisely which claims both sides
  should accept, and then say what would count as progress given that diagnosis: a
  theorem, an experiment, a conceptual distinction, or a reformulation of utility
  that makes the two criteria coincide. And give me an honest answer about whether
  any of that could actually end the debate, or whether the field should stop expecting
  convergence.


