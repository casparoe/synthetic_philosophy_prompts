  Guilt, properly speaking, is a verdict on a person''s own wrongdoing; it requires
  awareness and freedom. To say a newborn is guilty of Adam''s sin is to treat moral
  status as a kind of biological or legal property that can be transmitted, which
  destroys the distinction between being and doing. She might also add that even in
  human law we reject punishing children for parents'' crimes (attainder), which reflects
  the same principle.


  Person B (let''s name Daniel): counters that this confuses guilt-as-feeling with
  guilt-as-standing or guilt-as-state. In many traditions and even in secular contexts
  (family honor, reparations, national responsibility), persons can inherit a burden
  that isn''t tied to their own action: a debt, a stain, a liability that functions
  like guilt without implying they personally committed the act. He argues Miriam''s
  view assumes an individualistic picture of the self, whereas identity is partly
  constitutively inherited — we are members of families, peoples, histories, and to
  disown all inherited debts would be to deny who we are.


  Miriam replies: a debt or liability isn''t guilt; we can inherit obligations (e.g.,
  to repair harm) without being "guilty." Calling inherited burdens "guilt" is either
  a metaphor or a category mistake. If the point is just that we should repair inherited
  harms, say so; original sin as guilt adds a condemnatory element that no one could
  deserve.


