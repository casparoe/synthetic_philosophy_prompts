  The analogy posits: revolution is like a parent (Saturn) that eats its own offspring.
  In French Revolution context: the children are the revolutionaries themselves —
  the Girondins, Danton, the Hébertists, eventually Robespierre — who are consumed
  by the process they created (the Terror, the revolutionary tribunals). The saying
  is used to argue that internal purges are a structural inevitability of revolutions:
  radicalisation means each faction gets outflanked and liquidated; the logic of the
  revolution requires purity, and no leadership can survive it. The "devouring" maps
  to the purges, trials, executions; the "children" map to the groups that brought
  the revolution into being; the "parent" maps to the Revolution as an agent-like
  process; "devouring" suggests a natural, automatic, perhaps self-destructive mechanism.


  Where it breaks:

  - Revolutions are not organisms or persons; no intentional agent, no digestive necessity.
  The Terror was a set of political decisions made by identifiable actors facing war,
  counter-revolution, factional conflict — contingency matters. A "devouring" framing
  naturalises choices as if they were a biological process.

  - The "children" aren''t all equal victims: the Girondins and Danton and Robespierre
  each had agency, made choices, denounced others; some were also parents/devourers.
  The analogy flattens them into innocent offspring, obscuring that the victims were
  often themselves executing others (Danton created the Revolutionary Tribunal; the
  Girondins pushed for war, etc.).

  - Direction: Saturn eats his children to prevent them from overthrowing him; the
  Revolution doesn''t have a self-preserving parent distinct from the children — the
  revolution *is* those people, so it''s more self-cannibalism or an immune/autoimmune
  process than a parent eating children. (That could be a better analogy: an autoimmune
  response, or a purification spiral.)

  - Who counts as "children"? The royal family? The sans-culottes? The analogy is
  selective; it tends to centre prominent revolutionaries and ignore the popular classes,
  women, the Vendée, the colonies — the people the revolution also "devoured" who
  weren''t its children in any meaningful sense (or were they?).

  - Does the conclusion survive? The conclusion that the escalation was inevitable
  is only partly supported: the pattern recurs (English, Russian, Chinese revolutions
  have purge dynamics), but each case has contingent triggers (foreign war, economic
  crisis, personal rivalries). So it doesn''t licence a strong inevitabilist claim;
  at most a weak structural tendency under specific conditions.


