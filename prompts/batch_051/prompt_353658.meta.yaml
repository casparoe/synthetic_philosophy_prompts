  Let''s think about what the genuine philosophical issue is: The tautology objection:
  if fitness is defined as actual differential reproductive success, then "the fittest
  survive" is tautological. The propensity interpretation (Mills, Beatty) defines
  fitness as probabilistic propensity—expected reproductive success—which is not identical
  to actual success, so it can explain actual success, not tautologically. But then
  a problem: propensities are hard to measure independently; we infer them from actual
  reproductive success, which can reintroduce circularity/empirical emptiness. Also
  there''s debate about whether natural selection requires "heritable variation in
  fitness" (Lewontin) and whether the principle of natural selection is a tautology
  or an empirical claim; some (Popper initially) said it''s tautological but later
  retracted. The debate could be diagnosed as: disagreement about the semantics of
  "fitness" (definitional/verbal) coupled with disagreement about what a theory of
  evolution should do (predict vs explain) and about what counts as independent evidence
  for propensities. Progress might come from measurement models (e.g., estimating
  fitness from multiple components, Price equation, long-term studies) or from distinguishing
  token vs type fitness. These are weedy.


  But the model doesn''t need citations; it can reason. The prompt should "describe
