  payoff zero, EDT has no reason to one-box from self-interest. To make EDT have a
  reason, the chooser must care about the surrogate''s welfare. Then the utility includes
  the surrogate''s pain. EDT''s expected utility of one-boxing: high probability the
  surrogate one-boxed and is not being tortured; the chooser one-boxing itself does
