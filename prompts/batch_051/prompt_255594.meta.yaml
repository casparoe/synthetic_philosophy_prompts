  The thing I keep circling is this. Wittgenstein''s remarks on religious belief (the
  lectures on that topic, plus scattered later remarks) keep insisting that religious
  belief is not a hypothesis about how the world is, the kind of thing evidence could
  confirm or disconfirm. Believing in God, or in providence, is more like living inside
  a picture — a framework that determines what counts as a sign, a coincidence, a
  test, a punishment — rather than a claim you check against the data. The believer
  and the skeptic can look at the same events and not really be disagreeing about
  the facts; they''re taking the facts differently. Signs seems almost designed for
  this: Graham Hess is an ex-Episcopal priest who lost his faith after his wife died
  in a car accident, and over the course of an alien invasion the film piles up details
  — his son''s asthma, his daughter''s habit of leaving glasses of water around, his
  brother''s old baseball career, the dying words of his wife — and at the end Graham
  re-reads all of it as providential and puts his collar back on. My worry is that
  the film can''t decide whether it''s doing the Wittgensteinian thing or the exact
  thing Wittgenstein warns against: treating the events as evidence for a religious
  hypothesis, as if the question ''is there providence?'' gets settled by how well
  the signs fit together. And I keep going back and forth about whether the film knows
  the difference between those two readings.


