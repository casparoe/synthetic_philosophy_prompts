  than in the lives saved, which is weird: if she can prevent five murders at the
  cost of committing one, her refusal makes the world contain more murders, and "that
  wasn''t my doing" is exactly the self-centered concern the rule was supposedly against.
  Also, if the rule is about preserving the agent''s purity, then it''s egoistic,
  not moral.


  Move 4: B says not egoistic: it''s not about her purity but about the separateness
  of persons. Each of the five has a claim not to be killed, but none of those claims
  is a claim on her to kill a sixth person. Rights structure what agents may do, not
