  Let me get the content right for paradox of deontology.


  The paradox of deontology: Deontological theories include agent-relative constraints
  against certain action-types. These constraints prohibit an agent from performing
  an action of type X even when doing so is the only way to prevent more actions of
  type X (by herself or others). For example: it is wrong to torture one detainee
  even if torturing him would prevent the torture of five others, or wrong to kill
  an innocent person even to prevent five murders. The paradox is that if the underlying
  rationale for the constraint is the disvalue of X / the wrongness of X, then the
  theory seems to forbid the action that best serves that very rationale. A consequentialist
  sees this as irrational: you''re committed to "murder is the kind of thing that
  should not happen," yet you refuse to minimize occurrences of it.


  Resolution attempts:

  1. The doing/allowing distinction: constraints forbid doing harm but do not require
  preventing harm; so killing one to prevent five is doing, not allowing, and deontology
  only forbids doing. Counter: why should a rational morality care so much about the
  distinction when the outcome is strictly fewer murders? Unless we add an independent
  premise about the moral significance of agency/doing.

  2. The intending/foreseeing distinction (double effect): you may not intend the
  death of one as a means but may foreseen it as a side effect. Counter: In the standard
  kill-one-to-save-five case, the death is intended as means, so still forbidden;
  but why should intending make that difference when the same deaths occur? Again
  needs an underlying rationale, e.g., the separateness of persons where each person
  is owed a kind of treatment that cannot be traded off.

  3. Agent-relativity: the constraint is not "minimize murders" but "do not commit
  murder." Rationality doesn''t require maximizing the satisfaction of one''s own
  deontic aims across agents; each agent''s action has special normative status. The
  rationale is that morality addresses each agent individually, not as a collective
  teleological enterprise. Counter: this is a description of the structure, not a
  justification; the question remains why an individual should adopt a constraint
  that predictably leads to more of the very thing the constraint condemns.

  4. Redescription of the good: constraints are grounded not in the impersonal disvalue
  of wrong acts but in the value of each person''s inviolability / the relation between
  agent and victim. If the value is "it would be wrong for me to kill," then killing
  one to prevent five killings doesn''t serve that value at all; it violates it once.
  Choosing not to kill isn''t "allowing five murders" in the same sense, because the
  five murders are others'' doings; my failure to prevent is different. Counter: this
  makes the theory self-effacing — it ties rightness to my agency rather than to what
  happens, and from any impartial standpoint that''s puzzling; also it seems to license
  standing by while atrocities occur.

  5. The paradox may dissolve if we deny that the rationale of a constraint is to
  minimize token violations and instead see deontology as about the conditions under
  which one may act / the kind of agent one is (virtue/character), not about optimizing
  the world''s violation count. Counter: but then the label "wrong to murder" seems
  misleading; if the real object is "don''t be a murderer," the theory loses its claim
  to be about the rights of victims.


