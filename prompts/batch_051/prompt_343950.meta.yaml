  So I spent all weekend arguing with a friend about what should and shouldn''t count
  as genocide, and it spiraled into a much more annoying argument about what the word
  even means. We ended up agreeing on a rough list of criteria, pulled mostly from
  how the standard legal definition goes: the acts have to include killing members
  of the group, causing serious bodily or mental harm, deliberately imposing living
  conditions meant to physically destroy the group, trying to stop births within the
  group, or forcibly moving children to another group; and, crucially, all of this
  has to be done with the aim of destroying a national, ethnic, racial, or religious
  group as such, in whole or in part.


  The case we couldn''t settle was this. Imagine a state invades a region that''s
  home to a distinct ethnic group. Over a couple decades it takes most of their land,
  pushes the population into settlements, and bans the language in schools and courts.
  It runs a systematic program of taking children from their families and raising
  them in state boarding schools where they''re educated in the majority language
  and religion. The official line is that the state isn''t trying to destroy anybody;
  it says it''s "integrating" the group into the nation and even improving their lives.
  Some internal planning documents talk about making the group''s separate identity
  "disappear" within a generation or two, and they explicitly rule out mass killing—and
  in fact there''s no large-scale killing campaign. My friend says this has to count
  as genocide; he kept going back to Lemkin, the guy who coined the term, and saying
  Lemkin cared at least as much about destroying a group as a social and cultural
  unit as about physically exterminating it. I said that if you call this genocide,
  the category loses all its edges, because then basically every forced assimilation
  policy in history counts, and the word stops doing the special moral and legal work
  it''s supposed to do.


