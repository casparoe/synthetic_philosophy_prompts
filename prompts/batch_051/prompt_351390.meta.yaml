  Let''s define the commission''s framework: It has used a distinction (call it four
  categories):

  - Criminal responsibility: for acts that violate positive law; borne by individuals
  proven to have acted.

  - Political responsibility: borne by citizens and their governing institutions for
  the deeds of the state they constitute and sustain, regardless of individual culpability;
  it grounds collective obligations such as apology, reparations, constitutional reform.

  - Moral responsibility: borne by individuals for their own choices and omissions,
  not inherited.

  - Metaphysical responsibility: a solidarity-based responsibility of each person
  for remaining a bystander to injustice when one might have acted, not tied to law
  or causality.


