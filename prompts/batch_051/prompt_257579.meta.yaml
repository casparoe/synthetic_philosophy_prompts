  Prompt:


  I find myself pulled in two directions about envy and resentment, and I want a decision
  procedure for how to allocate them rather than just a side.


  On one side, I am convinced by something like the Rawlsian claim that envy is not
  always a vice to be suppressed: when the better-off hold advantages produced by
  institutions that violate the difference principle, the envy of the worse-off is
  excusable, perhaps even a fitting response to injustice. It tracks something real
  about the structure of social cooperation: not merely that I want what you have,
  but that you are benefiting from terms that could not be justified to me. Resentment,
  similarly, looks like the appropriate moral emotion when someone violates my rights
  or treats me as less than free and equal.


  On the other side, I have the standing intuition that envy is one of the vices —
  other-directed, self-corrosive, and essentially comparative — and that resentment
  is the kind of emotion a virtuous agent should expel, or at most observe in themselves
  as a diagnostic warning of their own pride and wounded entitlement. Envy in particular
  seems defined by the wish that the other be worse off, not that the arrangement
  be made fair; and when we redescribe our envy as concern for justice we are very
  likely rationalizing. A world of justified, endlessly narrated envy sounds to me
  like a world where civic friendship is impossible.


  My question is not which side to pick. I want to know what would have to be true
  for each to yield. Specifically:


  1. Are envy and resentment best understood as, at bottom, the same kind of social
  comparison, differing only in whether the disadvantage is perceived as deserved
  or undeserved? Or is the difference more fundamental?

  2. If Rawls says envy is excusable when inequalities are unjust, does that mean
  envy itself is an epistemic signal of injustice, a practical motivator for political
  action, a morally fitting attitude, or merely a predictable and non-blameworthy
