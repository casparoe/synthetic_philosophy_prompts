  Evidential Decision Theory (EDT): choose the action such that, conditional on you
  choosing it, the expected utility is highest — evidence about states, not causal
  consequences. In Newcomb''s problem, EDT one-boxes because one-boxing is evidence
  that the predictor predicted one-boxing. In the "twin prisoner''s dilemma," if you''re
  told your twin (in a separate room, no communication) is in the same situation and
  will reason exactly like you, EDT reasoning: if I cooperate, that''s evidence my
  twin cooperates (since we reason alike), so high payoff; if I defect, evidence twin
  defects. So EDT cooperates. This is "acausal" cooperation via correlation, not causation.


