  Title: "Quasi-empirical in the wrong way: Lakatos between method and metaphysics"


  Essay:


  "The standard summary of Proofs and Refutations is that Lakatos showed mathematics
  to be quasi-empirical: theorems are conjectures, proofs are thought-experiments,
  and counterexamples play the role of observations. That summary, I want to argue,
  runs together two claims that should be kept apart.


  The first claim is methodological. Mathematical knowledge does not grow by deduction
  from self-evident axioms; it grows through a dialectic of conjecture, informal proof,
  and attempted refutation. The proof is not merely a justification; it is a tool
  for discovering the theorem''s hidden lemmas and the domain over which it is true.
  In Euler''s polyhedron formula, the apparent counterexamples — the picture frame,
  the nested cubes, the polyhedron with the tunnel — force the community to do something:
  it can bar the alleged polyhedron as a monster, carve out the exception, or fold
  the refuted lemma back into the theorem as an explicit condition. Each of these
  moves changes the content of the theorem while preserving the appearance of a growing,
  more secure result. This is a rich, fallibilist picture of mathematical practice,
  and the dialogue supports it well.


  The second claim is stronger and, I think, not supported: that mathematics is quasi-empirical
  in a sense parallel to natural science, with mathematical statements tested against
  an independent mathematical reality. The parallel fails because the ''observations''
  are not independent of the theory in the right way. In natural science, a falsifying
  observation is, at least roughly, produced by the world; the auxiliary hypotheses
  may be adjusted, but the observation reports a stubborn piece of reality. In the
  mathematical case, what counts as a counterexample is partly constituted by the
  very definitions and proof-analysis under revision. The picture frame is not an
  anomaly found ''out there'' in mathematical nature; it is generated by asking what
  the proof''s hidden lemmas presuppose about polyhedra. When the community responds
  to it, it is not accommodating nature''s resistance; it is renegotiating the meaning
  of the terms and the scope of the theorem. That is ontology management, not empirical
  testing.


  So I think the safe conclusion is: Proofs and Refutations demonstrates methodological
  quasi-empiricism — mathematics as a fallible, historical, community-governed process
  of conjecture and refutation — but it gives no reason to accept ontological quasi-empiricism,
  the view that mathematics has an independent subject matter that pushes back the
  way nature does. If that distinction is right, the usual slogan that Lakatos made
  mathematics empirical is not merely loose; it is wrong in a philosophically important
  way."


