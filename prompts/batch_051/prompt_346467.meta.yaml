  that way.

  (3) To choose to become that way, you must already have had a self with certain
  principles of choice, preferences, values, and so on.

  (4) For you to be truly responsible for that self, you must have chosen it in turn,
  which requires a prior self...

  (5) Therefore true responsibility requires an infinite regress of selves; since
  finite agents cannot complete such a regress, no one is truly morally responsible.


