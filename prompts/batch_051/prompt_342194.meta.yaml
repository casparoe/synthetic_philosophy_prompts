  turns planning the sessions. For our next meeting I want an activity on obedience
  and authority: specifically, on how ordinary, reasonable deference to someone in
  charge can gradually turn into something a person would not defend if they looked
  at each step by itself. I do not want a lecture, and I would prefer that names such
  as Milgram or Arendt not appear until the debrief. The aim is for people to feel
  the force of the question — when is deference a virtue and when is it an abdication
  of judgement? — before they have a label for it.


  The activity must be runnable by one of us, with no special equipment beyond paper,
  pens, a table, and perhaps a score sheet. Everyone should be involved throughout;
  no spectators. I imagine a two-part exercise. In the first part, a rotating ''operator''
  gives instructions that are plainly sensible, and the group is rewarded for following
  them quickly; this is meant to establish that deference to a co-ordinating role
  can be good and satisfying. In the second part, the same format continues but the
  instructions shift gradually — small extra steps, slight restrictions, requests
  that are individually minor but cumulative — and participants have to decide, in
  real time, when they will no longer co-operate. There should be small but genuine
  stakes (points, or losing a break privilege) so choices are not merely hypothetical.
  Somewhere near the middle, perhaps before the final round, each participant should
  privately write down the most recent instruction they now think they should have
  refused; the slips are pooled and read aloud without names, so that the gap between
  private judgement and public behaviour becomes visible before anyone names it.


