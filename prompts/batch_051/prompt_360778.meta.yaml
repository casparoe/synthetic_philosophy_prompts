  Prompt draft (Arrow asymmetry), journalist voice:


  "Here is a striking asymmetry in the way we talk about inconsistent preferences.
  Suppose a single person, choosing between coffee, tea, and water, prefers coffee
  to tea, tea to water, and water to coffee when the pairings are offered one at a
  time. Economists and psychologists will call this person irrational, weak-willed,
  or at least shifting — a defect located in the chooser. Now suppose a three-person
  committee with the same pairwise outcomes: a majority prefers coffee to tea, tea
  to water, and water to coffee. The same cyclic pattern now gets a much grander name
  — a Condorcet paradox, an impossibility, a proof that there is no coherent ''will
  of the people.'' And the defect, if there is one, gets located not in the members
