  Prompt:


  "Consider the following reconstruction of the brave-officer objection, familiar
  from Reid but here presented as a numbered argument against Locke''s memory criterion
  of personal identity.


  (1) According to the memory criterion, a person P2 at a later time is the same person
  as P1 at an earlier time if and only if P2 can remember P1''s experiences or actions.

  (2) As a young man, the officer can remember being flogged as a schoolboy for stealing
  from an orchard. Thus, by (1), the officer is the same person as the schoolboy.

  (3) In advanced life, the general can remember the officer''s brave action in battle
  but cannot remember being flogged as a schoolboy. Thus, by (1), the general is the
  same person as the officer but is not the same person as the schoolboy.

  (4) Identity is transitive: if a is the same person as b, and b is the same person
  as c, then a is the same person as c.

  (5) By (2), (3) and (4), the general both is and is not the same person as the schoolboy.

  (6) Therefore, since the criterion leads to contradiction, the memory criterion
  as stated in (1) must be rejected.


