  The Condorcet jury theorem (CJT): if n voters each have probability p > 0.5 of choosing
  the correct of two alternatives, independently, then the probability that a majority
  chooses correctly increases with n and tends to 1 as n → ∞. If p < 0.5, majority
  tends to be wrong; if p = 0.5, no benefit.


