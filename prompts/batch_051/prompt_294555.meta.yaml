  make sure the list addresses at least the following — correcting or discarding any
  item if you think it is not a genuine requirement:

  (1) the difference between lateness and failure to notify, and between breach, excuse,
  blame, and owing repair;

  (2) the apparent mismatch between the triviality of any single small breach and
  the seriousness of being the person who reliably breaches;

  (3) the line between voluntary incurring and background expectation (the difference
  between "I''ll be there," "I''ll try to be there," and merely having been invited),
  and whether silence or delay can itself create a commitment;

  (4) the relation between moral obligation and social norm — a theory must neither
  collapse them nor simply identify them, and must explain why not every expectation
  someone forms (instant replies, permanent availability) is an obligation merely
  because it is felt;

  (5) the directed character of these commitments — that they can be owed to a particular
  person — and what that entails about standing to forgive, waive, or complain;

  (6) the contextual variability of expectations across relationships, settings, and
  cultures, and how a standard can be context-sensitive without making everything
  arbitrary;

  (7) the role of repair: apology, updating, making good — what these accomplish on
  pain of their being mere ritual; and

