  Potential final prompt:


  "I am an undergraduate taking a module on criminal law and the philosophy of law,
  and we have just been through the void-for-vagueness doctrine. I am trying to work
  out what I actually think by testing my reactions against a series of hypothetical
  offences. I would like you to help me extract the principle behind my reactions,
  or tell me which of them I should revise.


  Here are the cases and my verdicts.


  1. A by-law provides: ''No person shall ride or operate any wheeled conveyance within
  the park.'' I think this is valid. ''Wheeled conveyance'' has borderline instances
  (rollerblades, a child''s toy car, a wheelchair), but the core is plain and the
  borderline can be handled by ordinary statutory interpretation.


  2. A statute provides: ''A person commits an offence who drives on a public road
  at a speed that is unreasonable, having regard to the traffic, the weather, and
  the condition of the road.'' I think this is valid. The standard is evaluative,
  but a driver can sensibly ask what a careful driver would do in those conditions,
  and a court can apply that standard.


  3. A statute provides: ''A person commits an offence who annoys any other person
  in a public place.'' I think this is impermissibly vague. Whether an act annoys
  turns almost entirely on the complainant''s subjective reaction, so it gives no
  fair notice and invites arbitrary enforcement.


  4. A statute provides: ''A person commits an offence who carries in a public place
  an object designed or adapted for use in stealing, unless the person proves a reasonable
  excuse.'' I think this is valid. I am slightly uneasy about the open-ended defence
  of ''reasonable excuse'', but the conduct element is clear and the defence can only
  operate in the defendant''s favour, so I do not think it creates a notice problem.


  5. A statute provides: ''A person commits an offence who behaves in a disorderly
  manner in a public place.'' I think this is impermissibly vague. ''Disorderly''
  seems to have no settled legal content and leaves both citizens and police to guess.


  6. The case I keep going back and forth on is a statute providing: ''A person commits
  an offence who loiters in a public place in circumstances giving rise to a reasonable
  suspicion that the person is present for the purpose of supplying a controlled drug.''
  Part of me thinks it is fine, because ''reasonable suspicion'' is a familiar legal
  standard and the suspected purpose is specific. Part of me thinks it is worse than
  the speed provision, because it licenses police attention to people who are merely
  present and behaving oddly, without any definite act.


  My working hunch is that the doctrine should distinguish between standards an ordinary
  person can apply to their own conduct (even if evaluative) and standards whose application
  depends on another person''s subjective response; but that hunch does not obviously
  explain why I reject ''disorderly behaviour'' while accepting ''unreasonable speed''.


  Is there a single principle that captures all or most of these verdicts? Please
