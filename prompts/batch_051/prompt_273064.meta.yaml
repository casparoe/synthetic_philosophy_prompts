  I''m taking an undergraduate philosophy of language seminar that''s currently on
  generics, and after class two students in my discussion group argued past each other
  long enough that I''d like someone to go through it step by step. I have my own
  leanings but genuinely don''t know how to apportion what''s right, so I''ll report
