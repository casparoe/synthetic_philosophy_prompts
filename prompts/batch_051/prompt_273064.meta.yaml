  A: "The standard truth-conditional reflex is to treat a generic like ''ducks lay
  eggs'' as a loose universal: ''ducks, generally, lay eggs.'' But that can''t be
  right. Most ducks don''t lay eggs—males and juveniles don''t. Since the generic
  is true, truth can''t be a matter of what holds of most members of the kind. It
  has to be about the kind itself: egg-laying is part of the duck life history, the
  reproductive nature of the species."


  B: "That''s too quick. When speakers evaluate ''ducks lay eggs,'' they don''t quantify
  over all ducks and then get a majority; they first restrict the domain to the relevant
  ducks—sexually mature females—and then say of that class that it normally or generally
  lays eggs. So the truth conditions can remain statistical: a generic is roughly
  a quantifier like ''normally'' or ''in general'' over a contextually restricted
  set. The restriction does the work; no special analysis of ''the kind'' is needed."


  A: "But the restriction is doing exactly the work you need to explain, and it isn''t
  coming from context in the ordinary way. Compare ''ducks lay eggs'' with ''ducks
  are female.'' Both properties are instantiated by about half of all ducks, yet one
  generic is true and the other is false. Any purely statistical account predicts
  they should be on a par. The asymmetry is that egg-laying is characteristic of what
  ducks are—bound up with how the kind reproduces—whereas being female is a fortuitous
  fact about half the kind. That''s kind-based information, not prevalence."


  B: "I don''t need raw prevalence to explain that. ''Lays eggs'' selects a domain
  of female ducks because the predicate itself, together with world knowledge, is
  associated with the reproducing sex. The semantics says: take a contextually/predicate-determined
  domain, and require that the property holds normally within it. ''Female'' doesn''t
  select a domain that excludes males, so it reads as a claim about all ducks and
  fails. So the statistical account explains the asymmetry without a primitive notion
  of characteristicness."


  A: "But now look at ''mosquitoes carry malaria.'' There''s no natural restriction
  that yields a majority; an extremely small fraction of mosquitoes ever carry malaria,
  even among the species, sex, and life stage that can. If you lower the threshold
  enough to make that generic true, the quantifier becomes vacuous—it would license
  far too many false generics. What makes the sentence true is that carrying malaria
  is a salient, characteristic thing mosquitoes do, not the number that do it. And
  that salience is again a fact about the kind''s interactions with us, not about
  statistics."


