  1. Debunking/explaining away intuitions: The sense that consciousness is "special"
  is just an introspective illusion; introspection doesn''t reveal real properties,
  it just triggers the sense of a private qualitative world. Our strong conviction
  that qualia exist is a systematically misleading product of how introspection works.
  (Dennett, Frankish)

  2. Anti-mysterian / scientific optimism: Physicalism about everything else has succeeded;
  treating consciousness as a special exception is like vitalism about life, which
  was abandoned once mechanism advanced. Illusionism avoids "magical" additions.

  3. The "hard problem" as a symptom of illusion: The fact that there *seems* to be
  an explanatory gap is explained away—the gap itself is an illusion generated by
  phenomenal concepts; there''s nothing real it corresponds to. The apparent irreducibility
  is an artifact of the way we think about ourselves.

  4. Physical closure / causal argument: If phenomenal properties are non-physical,
  they''d be epiphenomenal or causally excluded; illusionism avoids this by denying
  there are such properties in the first place.

  5. The incoherence/elusiveness of qualia arguments: When you try to pin down exactly
  what a "quale" is—what it is over and above functional/representational properties—it
  either becomes vacuous or collapses into something physical; introspection can''t
  get a grip on it. (Dennett''s "quining qualia" type move, but I won''t quote.)


