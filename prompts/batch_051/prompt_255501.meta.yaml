  The classic picture (Lewis 1979 "Scorekeeping in a Language Game"): conversation
  has a scoreboard; rules of accommodation adjust the score so that what''s said counts
  as acceptable. Stalnaker common ground: presuppositions are what''s taken for granted
  by participants; assertion updates common ground. The model assumes a single shared
  scoreboard/common ground that all participants track and update together.


  New development: Large asynchronous online conversations — e.g., a big group chat
  or forum thread where participants read different portions, join late, scroll past,
  and messages can be read by an indefinite, shifting audience (including lurkers
  who never post). There''s no moment at which all participants'' common ground is
  synchronized; each reader has a different "scoreboard" depending on what they''ve
  seen; an audience can''t all accommodate a presupposition because they encounter
  messages in different orders.


  Question: Does the scorekeeping/accommodation model survive this? Which assumption
  is under pressure — that the scoreboard is shared, that the audience is definite,
