  ---


  Here''s a short answer question I gave on my intro philosophy of biology midterm,
  plus one student''s response. Can you grade the response and give me the point-by-point
  comments I should write for the student?


  The question was:


  "A study of a large, genetically diverse sample in the contemporary US reports that
  the heritability of height is about 0.8. A journalist writes that this means 80%
  of a person''s height is caused by their genes and the other 20% by their enviornment,
  and that since genes are fixed, environmental interventions like childhood nutrition
  programs can only ever matter for that 20%. Identify at least two things wrong with
  the journalist''s interpretation, and say what the 0.8 does and doesn''t tell us."


  The student wrote:


  "The journalist is wrong on both counts. Heritability is the proportion of phenotypic
  variance in a population that is attributable to genetic variance, so the 0.8 is
  a claim about the sample as a whole (really the population it represents), not about
  how much of any one person''s height comes from genes. The journalist also mistakes
  heritability for immutability: even if a person''s genes were completely fixed,
  a trait with high heritability could still respond strongly to a new environment—height
  has gone up across generations as nutrition improved, while staying highly heritable.
  So the 0.8 does not set a cap on what a nutrition program could do. What it does
  tell us is that, under current conditions, genetic differences account for more
  of the variation in height than environmental differences do. It doesn''t tell us
  about the causes of average differences between populations, and it doesn''t tell
