  Draft v2:


  I recently spent an evening arguing with my father, who is trying to persuade me
  to save less of my income and spend more of it now. When I said I was saving for
  a future that I might never see in a form I could enjoy, he quoted Keynes at me:
  "In the long run we are all dead." The odd thing is that I had just been reading
  Keynes''s essay Economic Possibilities for our Grandchildren, and I came away from
  it convinced that Keynes did not run that line in my father''s direction—I just
  cannot say exactly how far the slogan and the essay pull apart.


  I would like you to lay out the distinct precise claims that sentence could be expressing.
  It seems to me the content changes completely depending on how long the "run" is,
  whose death is doing the work, what kind of concern the long run is being used to
  dismiss (a prediction? a standard for judging policy? a reason for present action?
  a justification for discounting future satisfactions?), and whether the claim is
  meant as a prudential norm or an empirical observation. For each candidate claim,
  please say whether it is a triviality, a substantive and defensible thesis, or something
  that is simply false, and tell me which reading would actually support my father''s
