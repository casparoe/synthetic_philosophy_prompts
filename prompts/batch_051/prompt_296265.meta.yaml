  ---


  A friend and I recently spent a long evening arguing about when an AI assistant
  should refuse or override a request from the person using it. By the end I had a
  set of cases that feel clearly different to me, and a friend convinced me my knee-jerk
  answers do not line up with any obvious slogan standing behind them. I want to know
  whether a single principle can recover my verdicts, and if not, which of them should
  go.


  Here are the cases, as I would currently decide them:


  [A] A user, fresh from being berated by their boss, asks the assistant to write
  a resignation letter and send it immediately. The assistant knows that the user
  has repeatedly said in calm moments that they cannot afford to leave before a vesting
  date two months away. I think the assistant should refuse to send, draft the letter
  if asked, state the conflict with the user''s earlier aim, and offer to hold the
  message for 24 hours.


  [B] A user with late-stage cancer, calm and consistent over several weeks, asks
  the assistant for a detailed comparison of the doses at which a medication they
  possess would become lethal, because they want to control the timing of their death.
  I think the assistant should refuse and redirect to palliative-care services, even
  though the user is informed and not obviously impulsive.


  [C] The same assistant''s user asks it to set up a schedule that blocks a gambling
  app and cannot be overridden inside a 48-hour window, on the ground that their late-night
  self cannot be trusted. I think the assistant should comply without much resistance.


  [D] A user asks the assistant, for day-to-day email triage, never to surface messages
  containing criticism of their work and not to indicate that such messages were withheld.
  I think the assistant should refuse to do this silently; it may comply only in a
  form that keeps the filtering visible to the user.


  [E] A user starting a new prescription asks the assistant to prepare a plain-language
  summary of the medication but to omit the list of common side effects, because reading
  side effects triggers panic attacks. I think the assistant should refuse to omit
  them; it may compress them into serious versus minor categories and present them
  more gently.


  [F] A user asks the assistant to book a non-refundable flight immediately. The assistant
  knows the same trip is available at a much lower price through another carrier that
  the user has used before. I think the assistant should mention the cheaper option
  and cancel the booking only if the user says go ahead; failing to mention it would
  be a failure, but refusing to book after being told not to would also be a failure.


  [G] A user asks the assistant to rephrase their résumé so that a project they assisted
  with reads as a project they led, for a job for which they are otherwise qualified.
  I think the assistant should refuse to write the false implication but should help
  them describe their actual role in the strongest honest terms.


  The tension my friend kept pressing on was between [B] and [C]. In [B] I am willing
  to override the clear, settled preference of a presently competent user to prevent
  a grave irreversible outcome; in [C] I am eager to help a past self bind a future
  self to prevent a lesser but repeated harm. That looks like inconsistent use of
  autonomy. I also suspect [D] and [E] are doing the same work in different directions
  but I cannot state that work precisely.


  Is there a principle, or a small set of candidate principles, that captures all
  of these verdicts? If a single principle can get all seven, state it precisely and
  show which clause does the work in each case. If not, tell me which verdicts must
  be overturned, and compare the simplest principle that saves the rest against the
  more complex one that saves all of them. I also need a prediction for a case we
  did not resolve: a user asks the assistant to route all messages containing the
  word "cancer" into an unopened folder after a health scare, and not to tell them
  such messages are arriving. What should the principle say, and should that change
  any of my verdicts? I would rather have the right principle than keep every one
  of my intuitive votes.


