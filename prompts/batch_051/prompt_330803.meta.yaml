  The Ellsberg paradox: There are two urns. Urn A has 50 red and 50 black balls. Urn
  B has 100 balls, red and black in unknown proportion. Suppose you win if you draw
  a red ball. People prefer to bet on the known urn (50/50) rather than the unknown
  urn. Then if you win on black, people again prefer the known urn. This pattern (choosing
  known urn both times) violates subjective expected utility theory because it suggests
  p(red from unknown) < 1/2 and p(black from unknown) < 1/2, which are inconsistent
  with probabilities summing to 1. Ambiguity aversion is the preference for known
  risks over unknown risks. Key nuance: it does not show people are irrational; it
  shows a pattern that cannot be represented by a single subjective probability distribution
  (under SEU), but can be modeled by maxmin expected utility (Gilboa-Schmeidler),
  Choquet expected utility (Schmeidler), smooth ambiguity (Klibanoff et al.), alpha-maxmin,
  etc. It''s about ambiguity vs risk distinction.


  A popular summary might say: "Ellsberg showed that people prefer known risks to
  unknown risks, even when the unknown risk is objectively better. He called this
  the Ellsberg paradox, and it proves that expected utility theory is false and that
  people are irrational." Subtle errors: (1) it doesn''t prove people are irrational,
  only that their choices are inconsistent with a single additive subjective probability;
  (2) "objectively better" is wrong—the unknown urn isn''t objectively better; (3)
  Ellsberg didn''t necessarily "call" it that; (4) it refutes Savage''s sure-thing
  principle / subjective expected utility, not expected utility theory per se (von
  Neumann–Morgenstern with objective probabilities is untouched). That''s a nice subtle
  conflation: conflating von Neumann–Morgenstern expected utility (objective probabilities)
  with Savage''s subjective expected utility. A competent popularizer would likely
  commit exactly this.


