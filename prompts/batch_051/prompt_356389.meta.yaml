  4. Collusion: two friends log fake trades to inflate reputation.

  5. Verification problem: verifiable actions (donations, logged hours) favored over
  unverifiable but morally weighty ones (not lying, changing attitude). Selection
  for quantifiable morality.

  6. Reputation inflation and status games: reputation becomes a currency; people
  trade to maximize score, not moral improvement.

  7. Market for counterparties: people with popular "imports" gain bargaining power;
  commodification.

  8. The no-double-counting rule creates accounting complexity; people fragment their
  good deeds to satisfy multiple commitments.

