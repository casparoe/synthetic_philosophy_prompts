  Let me think about potential failure modes to ensure the prompt invites rich analysis:


  1. Strategic self-description: members misrepresent their moral type to attract
  trades.

  2. Cheap commitments: choose acts that are easy to verify but low moral weight;
  inflation of trivia.

  3. Offset mentality / moral licensing: "I earned my meat by making the other donate;
