  Draft prompt:


  ---

  Below are notes for a short essay I am drafting, "The Heterogeneity Problem Is a
  Measurement Problem." I would like your comments before I write it up. The Bentham
  passage is the fixed center of the essay; the rest is a working outline.


  Consider Bentham''s opening move in the felicific calculus, where he lays out how
  to estimate the value of pleasures and pains:


  [block quote from Wikisource]


  The essay makes three claims.


  First, interpretively: Bentham''s list of dimensions—intensity, duration, certainty,
  propinquity, fecundity, purity, extent—is best read as an answer to the heterogeneity
  problem in advance. He does not first say what all pleasures share as a feeling;
  he says instead that they all share a structure: each token pleasure sits at a point
  in a small set of quantitative dimensions. Heterogeneity of content ("the pleasure
  of scratching an itch, solving a proof, gloating, seeing a wrong redressed") is
  therefore orthogonal to the calculus, because the calculus does not traffic in qualitative
  content at all.


  Second: the familiar version of the heterogeneity problem—"there is no common felt
  quality among pleasures"—is too weak to damage hedonism. A hedonist can grant the
  point and switch to an attitudinal account: pleasantness is not a sensation but
  a mode of being wanted, or a way an experience occupies the mind. The strong objection
  has to be a commensurability objection: intensity and duration must be scalar across
  radically different contents, and the attitude of "wanting" must come in degrees
  that compare across categories, or the summing step of the calculus is undefined.


  Third, and this is where I am least sure I am right: Bentham himself activates the
  strong objection when he concedes that fecundity and purity are "scarcely to be
  deemed properties of the pleasure or the pain itself" but rather properties of the
  act by which it is produced. If value-relevant dimensions are not properties of
  the pleasure, then the unit being measured is not the token experience but the act''s
  tendency to produce experiences. But once the object is the act rather than the
  pleasure, the distinctive claim of hedonism—that pleasure is the sole intrinsic
  good—becomes harder to state cleanly, because the same act-properties could in principle
  make sense even for non-hedonic goods. If this is right, the interesting heterogeneity
  problem is not "what do pleasures feel like in common?" but "what exactly is the
  magnitude that the calculus measures, and why must it be pleasure?"


  Comments I want, in order of importance: (1) whether the third claim overreaches
  or rests on a misreading of Bentham''s strictness caveat; (2) whether the second
  claim dispatches the heterogeneity problem too quickly, in particular whether switching
  to an attitudinal account just relocates the commensurability problem rather than
  solving it; (3) where a hostile reviewer would aim their objection at the essay''s
  overall argument. Please commit: say whether the essay''s central reframing—that
  the deep version of the heterogeneity problem is a measurement problem, not a common-quality
  problem—survives these objections or should be abandoned, and defend that judgment
  rather than laying out the options.


