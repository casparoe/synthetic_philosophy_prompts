  "I cover science and ideas for a magazine, and I''m trying to get my head around
  how the replication crisis and the rise of mega-collaborations and machine-learning-based
  discovery should change how we think about Lakatos''s ''methodology of scientific
  research programmes.'' Lakatos''s big argument, as I understand it, was that individual
  theories aren''t the right unit for judging science; whole research programmes are.
  A programme is progressive when each modification of its ''protective belt'' keeps
  making novel predictions that get confirmed, and degenerating when scientists just
  patch the belt with ad hoc adjustments to fit data they already have. He argued
  this against Popper''s naive falsificationism... Now here''s my question: does that
  argument survive a world where ''novel prediction'' is much harder to define because
  preregistration tells us what was predicted in advance, but also because machine
  learning lets researchers search enormous hypothesis spaces and dig up ''novel-looking''
  results after the fact? Also with big team science and open data, anyone can mine
  a dataset... Is Lakatos''s prediction-based criterion killed, repairable, or mostly
  fine? Which premise actually takes the hit? I''d like you to think carefully as
  a philosopher of science, maybe brainstorm the different senses of ''novel prediction''
  first, then answer."


