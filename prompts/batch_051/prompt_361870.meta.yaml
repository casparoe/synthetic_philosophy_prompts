  Draft:


  "I''m a journalist who covers science and ideas, and I''m trying to get my arms
  around something for a piece on how the replication crisis and the way big lab collaborations
  and machine learning have changed what it means to have a ''result.'' I keep coming
  back to Lakatos. As I understand him, his big move was to say the unit of scientific
  success isn''t a single theory, it''s a research programme: a hard core of background
  assumptions surrounded by a protective belt of auxiliary hypotheses. A programme
  is progressive when tinkering with the belt produces predictions that are new and
  that eventually get confirmed; it''s degenerating when the belt just gets patched,
  after the fact, to soak up data the programme didn''t anticipate. He offered this
  as a way to be tougher than Kuhn but fairer than Popper about how science actually
  works.


  Here''s the thing I can''t stop turning over. Lakatos''s criterion leans very hard
  on being able to distinguish a prediction the programme genuinely made in advance
  from an adjustment that merely explains what''s already on the table. But now we
  have preregistration, which is supposed to lock in the ''in advance'' part; at the
  same time we have machine-learning pipelines and enormous open datasets where a
  researcher can, in effect, test a million theory-adjacent tweaks after seeing the
  data and then report the one that looks novel. We also have huge team-science consortia
  where no single person holds the belt and the sequence of who-tweaked-what-when
  is very hard to reconstruct. Does Lakatos''s argument for judging research programmes
  survive these developments? Is the novel-prediction criterion dead, is it repairable,
  or is the damage only superficial? Which premise actually takes the hit?


