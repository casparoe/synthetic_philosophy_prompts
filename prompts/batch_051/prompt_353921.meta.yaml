  A pantoum structure: A pantoum consists of four-line stanzas where lines 2 and 4
  of each stanza become lines 1 and 3 of the next, and the final stanza reuses the
  first and third lines of the first stanza as its second and fourth lines (often
  the first line of the poem returns as the last line). Thus each line appears twice,
  in different contexts. The prompt can ask: Write a pantoum about "Sherlock Holmes"
  that acts out the distinction between truth in the fiction and truth outside it.
  Let the repeated lines be sentences of the same wording that switch their truth-value
  as the pantoum moves them from the context of the stories (e.g., "he lives at 221B
  Baker Street") to the context of the real world (where the same line should be read
  as false, or at least as not referring). Hmm, but the pantoum''s lines repeat verbatim,
  which mirrors how the same sentence can be true in one context and false in another.
  The structural work: the poem''s repeated lines demonstrate how the same words get
  their truth values from the frame in which they are read; the poet has to select
  lines that can mean differently inside and outside.


