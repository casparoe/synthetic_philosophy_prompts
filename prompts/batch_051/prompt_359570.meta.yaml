  A friend has been pressing the following argument on me, and I cannot find the flaw
  even though I dislike where it leaves us.


  (1) The aesthetic value of a work is fixed by what a suitably informed perceiver
  can see in it; facts about its history are relevant only insofar as they show up
  in the work''s perceptible features.

  (2) A perfect forgery is, by hypothesis, indistinguishable from the original by
  any perceptual examination: it presents exactly the same appearance to the same
  suitably informed eye.

  (3) Therefore a perfect forgery has precisely the same aesthetic value as the original.

  (4) Original and perfect forgery differ only in their histories: who made them,
  when, and with what intentions and achievements.

  (5) If that historical difference could make an aesthetic difference, two works
  could present identically and yet differ aesthetically, which contradicts (1).

  (6) So the preference for an original over a perfect forgery cannot be an aesthetic
  matter; it must come from non-aesthetic concerns such as provenance, rarity, investment,
  or snobbery.


  I am not sure I can accept (6), because it seems to prove too much. The same reasoning
  would force me to say that learning that a painting I admired is a forgery can never
