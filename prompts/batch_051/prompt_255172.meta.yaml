  ---


  I''ve been reading William Blackstone''s Commentaries on the Laws of England, Book
  I, Chapter 7, "Of the King''s Prerogative," because I''m trying to understand the
  old legal background of sovereign immunity: the idea that the state, or the crown,
  can''t meaningfully be said to wrong its subjects. Blackstone quotes two maxims
  side by side:


  "It is a maxim of the English law, as we have seen from Bracton, that ''rex debet
  esse sub lege, quia lex facit regem:'' the imperial law will tell us, that ''in
  omnibus, imperatoris excipitur fortuna: cui ipsas leges Deus subjecit.''"


  My rough translation/gloss of the Latin: the first says the king must be under the
  law because the law makes the king; the second says the emperor''s condition exempts
  him, because even the laws have been subjected to him by God. Blackstone then says
  he doesn''t hesitate to prefer the English maxim over the Roman one, as better suited
  to the ends for which societies are framed. So on its face he seems committed to
  the state being under the law, not above it.


  But then I know the tradition he''s associated with also contains the slogan that
  the king can do no wrong, which I''d always understood as a denial that the sovereign
  can commit a legal injury at all. Those two ideas feel like they pull in opposite
  directions. I''m trying to figure out whether the two maxims Blackstone quotes are
  actually in conflict, or whether they only look that way because "can do no wrong"
  is ambiguous between "the law never holds the sovereign liable" and "the sovereign''s
  acts are never legally wrong." Or maybe the Roman maxim is about something narrower
  than I''m reading into it. What are the plausible ways to reconcile Blackstone''s
  preference for the first maxim with the doctrine of sovereign immunity, and which
  of those reconciliations are honest readings of what he says rather than special
  pleading? If they can''t be reconciled, which claim is doing the real work? If my
  framing of the question is wrong — for example, if I''m importing a later doctrine
  into an older text — I''d rather you tell me that directly than smooth it over.


