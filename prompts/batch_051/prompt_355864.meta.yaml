  I''ve been messing with a version of the Ellsberg paradox and I''m not sure the
  usual lesson survives it.


  Standard setup: urn A has 50 red balls and 50 black balls, and you know that for
  sure. Urn B also has 100 balls, each red or black, but you know nothing about the
  proportion; the usual finding is that people prefer to bet on red drawn from urn
  A rather than red from urn B, and also black from urn A rather than black from urn
  B. That pair of preferences is supposed to be incompatible with expected utility,
  because no single probability you could assign to red in urn B makes both bets on
  urn A better.


  Now the variant. Urn B is filled as follows. A fair coin is flipped, and you don''t
  see the result. If it comes up heads, urn B gets 20 red balls and 80 black balls.
  If it comes up tails, urn B gets 80 red balls and 20 black balls. You know all of
  this, including that the coin is fair; you just don''t know which fill actually
  happened. Urn A is still a known 50/50.


  Here''s the question. If someone still has the original Ellsberg pattern of preferences
  in this modified setup—betting on red from A rather than red from B, and black from
  A rather than black from B—does the original paradox still go through, or has the
  variation turned it into something else? Work through what an expected-utility maximizer
  who accepts the reduction of compound lotteries would say about the two urns, and
  then what someone who rejects reduction could say. And then say whether the standard
  ambiguity-aversion explanation (maxmin or whatever formal version you find cleanest)
  carries over to this case unchanged, or whether the modification pushes the behavior
  into a different box—compound-lottery aversion, or aversion to not knowing the coin,
  rather than ambiguity about an unknown distribution. More pointedly: is this a good
  test of ambituity aversion at all, or have I accidentally replaced the ambiguity
  with ordinary risk?


