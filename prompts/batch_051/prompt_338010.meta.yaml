  ---


  I cover behavioral genetics for a general-interest science magazine, and I am planning
  a long feature on the gap between what heritability coefficients actually measure
  and what confident readers take them to license. The audience is policy-literate
  but not statistically trained: people who can recite that heritability is a population
  statistic and not a verdict about any particular person, but who have rarely seen
  that slogan forced to do real work on the claims that circulate about education,
  public health, criminal justice, and racial or socioeconomic group differences.
  I want to avoid the usual explainer that simply lists misconceptions, and instead
  write something with a thesis: some of the inferences people draw from heritability
  results would genuinely reorder a policy conversation if they were properly understood,
  while others are much less important than they seem, and a few are outright invalid.


  Suppose I have room for three substantive sections. Please rank the following candidate
  takeaways and defend the ordering. The candidates are: (a) a high heritability estimate
  does not mean environmental interventions are futile, and it is fully compatible
  with large average effects of environmental change; (b) heritability estimates are
  local to a specific population and environment, so they cannot be exported unchanged
  to new conditions and set no ceiling on how much a distribution can shift; (c) the
  fact that variation within a population is partly genetic does not license any inference
  about the causes of average differences between populations; (d) heritability is
  a claim about variance in a population, not about the cause of any individual''s
  outcome; (e) the textbook distinction between narrow-sense heritability, which tracks
  additive genetic variance and predicts response to selection, and broad-sense heritability,
  which also counts non-additive effects, matters more than most public discussion
  concedes; (f) a trait can be substantially heritable while its population distribution
  is highly responsive to social and institutional arrangements; and (g) a high heritability
  estimate for an outcome that shows a socioeconomic gradient implies that the gradient
  itself is largely genetic in origin. For each candidate, say whether it survives
  scrutiny, what practice or research program it would most change if internalized,
  and why it occupies that place in the ranking. I am less interested in the list
  than in the weighting: which criteria should dominate when the candidates pull in
  different directions, and how you would trade off immediate policy consequences
