  Actually the driver chooses a strategy p = probability of exiting when at an exit.
  Because he can''t distinguish, at each exit he uses same p. Expected payoff calculation:
  At the first exit: he exits with prob p -> payoff 0; with prob (1-p) he continues.
  At second exit: he exits with prob p -> payoff 4; continues with prob 1-p -> payoff
  1. But to reach second exit he must have continued at first, so overall expected
  payoff = p*0 + (1-p)*[p*4 + (1-p)*1] = (1-p)(4p + 1 - p) = (1-p)(1+3p). Maximize:
