  Prompt text:


  I am a PhD student in behavioral public policy, and for the past year I have been
  embedded in a mid-sized city''s health department, where I help screen proposals
  for "nudge" interventions before they reach the public health ethics review board.
  The department considers several proposals a week: changing default side options
  in public cafeterias, reordering forms so a healthier or more prudent option is
  preselected, rewriting letters about energy use or vaccination to use peer-comparison
  language, adding graphic warnings, and introducing small cooling-off delays for
  certain purchases. The officials who run the screen have no formal philosophy training,
  and they want one reusable checklist they can apply in about fifteen minutes to
  decide whether a proposal is the sort of intervention that a liberal public body
  may adopt, and what to do when the answer is unclear. I would like the checklist
  to be grounded in the paternalism debates rather than in a flat list of "nudge vs.
  shove" heuristics. In particular, I keep coming back to a passage in Chapter IV
  of John Stuart Mill''s On Liberty. Mill argues there that a person''s own good,
  whether physical or moral, is not a sufficient warrant for using compulsion against
  him, but also that this does not require the state or society to be neutral or silent:
  we may reason with the person, persuade him, even plead with him, but we may not
  compel him or impose some disadvantage on him for not doing what we think best.
  I want that distinction between persuasion and compulsion translated into a concrete
  screening procedure for the kinds of interventions my department actually sees.


  Please write the procedure itself: the questions to ask in order, what counts as
  a sufficient answer to each, where the procedure stops with a "do not proceed,"
  and where it hands the decision to a person because the question is one of values
  rather than facts. Then apply the procedure to three proposals: (1) making a lower-sodium
  option the default in hospital vending machines, with a small sign indicating that
  the regular option is available on the next screen; (2) automatically enrolling
  new employees in a retirement savings plan at a 4 percent contribution rate with
  an easy opt-out, where the city is also the employer; and (3) imposing a 48-hour
  delay, but no outright prohibition, on the purchase of cigarettes within city limits,
  implemented as a mandatory waiting period before the sale is completed. One of the
  applications should be a case where the procedure yields an answer the department
  will not like. Be explicit about which steps are genuine judgment calls, where the
  Millian distinction breaks down or needs supplementation, and what the procedure
  cannot settle.


