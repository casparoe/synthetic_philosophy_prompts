  but out of date (stale knowledge, not lying).

  - A system that truthfully reports its capabilities but the designers present it
  misleadingly (deception by omission at the deployment level).

  - A model that uses true statements to mislead (paltering / deception by selective
  truth — like "this is a 2022 model" when the relevant fact is that it''s slow).

  - A model that has a hidden chain-of-thought with deceptive reasoning vs a model
  that just produces a deceptive output without internal states.

