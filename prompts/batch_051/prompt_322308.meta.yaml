  Let me check what I know about Sellars''s "Empiricism and the Philosophy of Mind"
  (1956). Key ideas:

  - "The Myth of the Given" — the idea that there are raw, immediate, non-inferential
  episodes (sense data, impressions) that (a) are known directly and (b) serve as
  ultimate court of appeal for empirical knowledge.

  - Sellars''s attack: to have perceptual knowledge is to endorse a proposition; perception
  involves concept application, which presupposes acquired capacities, language, inferential
  patterns. "All awareness of sorts, resemblances, facts, etc., in short all awareness
  of abstract entities — indeed, all awareness even of particulars — is a linguistic
  affair."

  - The "space of causes" vs "space of reasons": characterizing knowledge as a natural
  process vs. as justification.

  - The distinction between sentience (sensation, responsive discrimination) and sapience
  (knowing-that, being a concept user). Sellars allows discrimination but not *justification*
  at the sentient level.

  - The "inference ticket" idea: an observation report like "This is red" has authority
  not because it''s given but because of its place in a network of inferences; it''s
  the manifestation of a reliable differential responsive disposition, and its authority
  is a matter of socially conferred status.


