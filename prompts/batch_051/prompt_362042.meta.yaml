  Draft:


  "You are a senior philosophical advisor to a small research fund that can support
  about five theorists for three years to work on the conceptual foundations of the
  definition of terrorism — what the term should mean, how it should be delimited,
  and what follows from drawing the boundaries one way rather than another. The fund''s
  eventual audience is legal scholars, human-rights lawyers, and legislative staff,
  so the deliverables need to be the sort of thing that could change how those people
  argue in courtrooms, briefs, and committee rooms — not semantics that stays inside
  philosophy departments.


  I''m a trustee of the fund, and I''ve spent enough time around rationalist-adjacent
  writing to suspect that a great deal of definitional work is really a proxy war
  over policy, conducted in the vocabulary of concepts. I half-believe the question
  ''what is terrorism?'' should be dissolved rather than answered; but I also can
  see that the boundaries of the term quietly determine which violence gets condemned,
  which actors get designated, and which countermeasures look proportionate. I want
  you to show me which definitional questions are genuinely load-bearing and worth
  three years of talented people, and which are verbal quicksand.


  Your task is to produce a defended research agenda, not a literature review. Begin
  by brainstorming a wide net of live conceptual questions about the definition of
  terrorism — questions like whether the term is by definition restricted to non-state
  actors, or whether the defining feature is the aim of intimidating an audience beyond
  the immediate victims, and then the less obvious questions hiding behind those.
  Once you have the menu, narrow it to the questions the fund should actually pay
  people to work on, and rank them. For each ranked question, defend its place: why
  it is upstream of other work (what else changes if it gets settled), how tractable
  it is for philosophers and legal theorists rather than requiring empirical data,
  how neglected it is given how much it matters, and what evidence or developments
  over the next two or three years would push it up or down your list. I care far
  more about the reasoning behind the ordering than about the list itself.


  Take your time and think carefully. It is fine — encouraged, even — to show your
  work: state the criteria you are using, how you are trading importance off against
  tractability, and whether any of the items collapse into the same underlying question.
  If you would need to know some empirical fact to rank two questions confidently,
  say so and tell me what fact would decide it. Do not give me a reading list or citations;
  I already know how to find the literature. I want your judgment about where scarce
  attention should go, and why."


