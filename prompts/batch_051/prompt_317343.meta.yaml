  Prompt draft:


  "I manage operations at a shipping company whose safety manual, written in 1997,
  contains this clause: ''The operator of a vehicle shall maintain full and effective
  control over the vehicle at all times and shall be held responsible for the safe
  operation of the vehicle and for any injury, loss, or damage arising from its use.''
  Our company has since introduced a small fleet of autonomous delivery vans. They
  plot their own routes, accelerate, brake, and change lanes without human input,
  and they request human approval only when their own confidence falls below a fixed
  threshold. A mission supervisor watches up to eight vehicles at once from an office
  and can send a remote stop or reroute command, but cannot continuously steer, brake,
  or accelerate any vehicle.


  Last month one van misjudged a corner in heavy rain, mounted a curb, and damaged
  a storefront and a parked car. The supervisor saw the alert, tried to send a stop
  command, but the impact occurred before the command took effect. No one disputes
  the facts; the question is whether our manual''s clause reaches the case. Since
  there was no driver in the van, some of my colleagues say no ''operator'' existed
  and so the clause is silent; others say the mission supervisor was the operator
  because she alone had any intervention capacity; still others say the company itself
  is the operator in the only sense the manual can now have. I want a careful interpretation
  of the clause, not a guess about liability law.


  How should the word ''operator'' be understood in a rule written when vehicles had
  drivers? Consider what the text says, what the clause was for, what its drafters
  would likely have said if asked about autonomous vehicles, and what a reasonable
  employee reading it today would take it to require. Which of these approaches should
  decide the matter, and why? More broadly, when a rule distributes responsibility
  to a human operator, can it survive the move to a system in which no human continuously
  controls the vehicle, or does responsibility fall into a gap?"


