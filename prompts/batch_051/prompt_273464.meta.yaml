  conditional expresses. They can say the conditional expresses a higher-order attitude,
  e.g., disapproval of combining acceptance of stealing with not disapproving of getting
  your brother to steal — like Blackburn''s idea of a moral sensibility that approves
  or rejects combinations of attitudes. The antecedent doesn''t need its own attitudinal
  contribution because logical operators work at the level of commitments, not truth
  conditions.


