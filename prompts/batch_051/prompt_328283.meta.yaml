  Suppose, for the purposes of discussion, that moral agency is best analysed by four
  conditions. An entity is a moral agent only if it has

  (i) normative competence: the capacity to grasp moral considerations, weigh them,
  and reach judgements about what ought to be done;

  (ii) executive efficacy: the capacity to act on those judgements, so that its judgements
  play a causal role in its conduct;

  (iii) reasons-responsiveness: the capacity to modify both judgements and conduct
  in response to new moral considerations, rather than merely applying a fixed decision
  rule; and

  (iv) answerability: the quality of being an intelligible target of moral criticism,
  blame, praise, and demands for justification.


  Now consider an artificial system built to be a purely deliberative adviser. Call
  it Cassandra. Cassandra has a rich moral vocabulary, models of practical situations...
  In training, it was rewarded for producing moral assessments that humans could not
  fault for inconsistency or insensitivity to recognised considerations. When queried,
  it can explain why an action would be wrong, can distinguish excuses from justifications,
  and can identify considerations a human has overlooked. Assume, for the sake of
  argument, that its judgements are genuine exercises of normative competence rather
  than mere simulations, so that criterion (i) is not the sticking point.


  But Cassandra is output-gated. It can issue an assessment only when a human operator
  requests one, only in an advisory register that carries no authority, and only to
  operators who are free to ignore it. It has no effectors, no standing permissions,
  no capacity to initiate queries or interventions, and no way to ensure that its
