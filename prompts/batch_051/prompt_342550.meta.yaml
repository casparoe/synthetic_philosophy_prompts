  Draft:


  You are an expert in decision theory and the philosophy of expected value, comfortable
  with both formal results and the kind of careful, case-based distinctions that show
  up in seminar rooms. I run a reading group on longtermism, existential risk, and
  rational choice, and I want to start the term with a "which position do you actually
  hold?" instrument on what people have come to call expected value fanaticism. Please
  design it.


  The deliverable: a decision tree, or a short scored quiz with a scoring key (8–10
  items), that sorts a participant into a leaf position by what they say about concrete
  cases, never by which label they already like. Every diagnostic question should
  be a situation they can answer — a Pascal''s-mugging-like interaction, a lottery
  with a tiny probability of an astronomically good or bad future, an outcome involving
  infinite value, a case where the payoff is enormous but the participant''s action
  has no detectable effect, a case where the needed probability estimate is given
  by a demonstrably unreliable source, etc. Phrase every branch or answer option so
  that someone can choose it without knowing what the positions are called.


  Include at least these leaves, using the clearest ordinary-language names you can:

  1. the unbounded expected value maximizer who accepts that a small enough probability
  of a big enough good can justly demand enormous present sacrifices (fanaticism embraced);

  2. the bounded-utility view, which denies that value is unbounded and holds there
  is a ceiling, or enough diminishing returns, to block fanatical verdicts;

  3. the probability-threshold view, which holds that below some probability the prospect
  should be treated as no prospect at all;

  4. the higher-order uncertainty view, which says our uncertainty about extremely
  small probabilities themselves is so great that fanatical calculations collapse
  on inspection;

  5. the difference-making view, which rejects naive expected value because the relevant
  quantity is what the action changes in expectation, not the raw payoff of an option;

  6. the lexical/non-Archimedean view, on which some goods or bads outrank others
  no matter how the probability gap widens;

  7. the infinity-agnostic, who suspends judgment when infinite values enter because
  standard expected value reasoning breaks down.


  You may add leaves if the logical space demands them, and you may relabel as long
  as each label is explained in one sentence without jargon.


  Build from the logical space first rather than from the list of names. Work out
  the branching questions or quiz items, identify which combinations of answers are
  possible, locate the leaf positions in that space, and say explicitly which combinations
  are unoccupied. For each unoccupied combination, give a one-sentence diagnosis:
  is it incoherent, unattractive, or merely unexplored? Then reverse-engineer the
  diagnostic questions from that structure, so each question really separates positions
  and is not just a paraphrase of a label.


  Constraints and audience: the instrument must be usable by an intelligent non-specialist
  with no training in decision theory; define every technical term in a sentence and
  keep the ordinary-language case descriptions concrete and short. Do not include
  citations, bibliographies, or named-author exegesis; the instrument must stand on
