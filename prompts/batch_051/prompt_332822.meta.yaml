  ---


  I am a high school student writing a research paper for a Model United Nations crisis
  simulation on extended nuclear deterrence, and I have developed a distinction that
  I would like assessed before I build an argument around it. I have been calling
  it "curated unpredictability." The standard framework I keep encountering says that
  a threat deters only if it is credible: the adversary must believe you would actually
  carry it out. Perfect credibility, however, is impossible for catastrophic threats,
  because no one would install a doomsday machine that automatically destroys one''s
  own country, and a pure bluff is testable and therefore unstable. My proposal is
  that effective nuclear brinkmanship aims at neither credibility in the ordinary
  sense nor bluffing, but at making one''s decision process deliberately unmodelable.
  On this view, a state wants its adversary to believe that several different actors
  might be at the controls at the decisive moment — the calculating cost-benefit analyst,
  the honor-bound nationalist, the leader boxed in by domestic politics — so that
  no matter how carefully the adversary models you, it cannot set the probability
  of catastrophic retaliation below some non-trivial floor. You do not commit to a
  specific response; you commit to being the kind of agent whose response cannot be
  read in advance.


  The historical material seems to gesture at this without naming it: the madman theory,
  Schelling''s idea of deliberately leaving something to chance, opaque command-and-control
  arrangements, contradictory red lines, and the carefully cultivated worry that authority
  over launch decisions might be delegated or automated in ways outsiders cannot verify.
  But I think my mechanism is distinct. The madman theory asks the adversary to believe
  you are irrational; curated unpredictability asks only that the adversary be unable
  to decide which rational or irrational type you are. Schelling, as I understand
  him, locates the residual chance in the world — a process that could slip out of
  control, an accident, a rogue commander — whereas I locate it in the adversary''s
  inability to model the decision procedure itself. My question is whether this distinction
  survives scrutiny. Does curated unpredictability collapse into a bluff, into reputation,
  into standard game-theoretic uncertainty about one''s type, or into Schelling''s
  idea with the stochastic element merely relocated? Where does it break in a prolonged
  crisis, when an adversary can observe behavior and update? And is any of these objections
  fatal rather than merely uncomfortable? I would also like to know whether I have
  reinvented an existing idea under a term I have not encountered, because I do not
  want to claim originality where none exists.


