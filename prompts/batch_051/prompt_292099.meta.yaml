  Let''s brainstorm the utility monster content.


  The utility monster (Nozick 1974, Anarchy, State, and Utopia) is a thought experiment:
  a being who gets enormous utility from resources compared to others, so any utilitarian
  maximizes total utility by giving everything to it, which seems repulsive. Standard
  replies/defusings:

  1. Diminishing marginal utility: actual beings have diminishing returns, so a single
  monster with unlimited capacity is unrealistic; but a monster could be defined otherwise.

  2. Empirical impossibility: no such being exists; utility monsters are physically/psychologically
  implausible; ignore.

  3. Rights-based side constraints: reject utilitarianism; no distribution violates
  rights, even if it maximizes utility.

  4. Equality/priority to the worst off: switch to prioritarianism/egalitarianism
  — moral value should not allow one to absorb everything.

  5. Lexical thresholds / sufficiency: everyone is entitled to a decent minimum; above
  that, utility maximization can operate.

  6. Second-order/dynamic effects: feeding the monster would lead to political power,
  tyranny, misery for others, instability, so total utility is actually lower; or
  the monster''s utility function is unreliable.

  7. Biting the bullet: accept that morality may require feeding the monster; intelligibility
  of intense utility.

  8. Claim that the thought experiment presumes interpersonal utility comparisons
  or a cardinal utility that is problematic.

  9. Kantian response: treat humanity/beings as ends, not just utility buckets.

  10. The "monster" gets utility from others'' suffering, which raises different issues;
  negative externalities.

  11. Rule-utilitarian reply: a rule permitting utility monsters would have worse
  overall consequences than one that doesn''t.

  12. Fairness/justice intuitions: distribution should be justifiable to each; the
  monster''s pleasure doesn''t outweigh others'' lives.


