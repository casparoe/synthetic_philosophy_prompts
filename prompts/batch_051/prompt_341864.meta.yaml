  For gavagai, key conceptual architecture:

  1. First, the setup: radical translation — a linguist in a community with no shared
  language, no interpreters, no bilinguals. Must establish that all evidence is the
  natives'' dispositions to assent/dissent to sentences under stimulation. Need this
  before anything else because indeterminacy is a claim about what that evidence fixes.

  2. Then stimulus meaning and the toy case: native says "Gavagai" when a rabbit scurries
  by. The linguist tentatively writes "Rabbit" — but the evidence also fits "undetached
  rabbit part," "rabbit stage/time-slice," "rabbithood/universal," etc. So the observational
  sentence gets a stimulus meaning, but term-level reference is underdetermined.

  3. Then the crucial distinction: this is not ordinary underdetermination by evidence
  (where there''s a fact and we just can''t tell) — Quine''s stronger claim is that
  there is no fact of the matter; the two manuals are both right, and there''s no
  sense in asking which is the "correct" one. This is where students misfire.

  4. Then analytic hypotheses and the holism: the linguist''s choice gets made at
  the level of whole analytical hypotheses that project, not word-by-word through
  pointing; the indeterminacy is systemic, not just a missing gloss.

  5. Maybe tie to gavagai as an observation sentence vs term: the indeterminacy is
  sharper for terms than observation sentences.

  6. Leave out: details of before/after matrices, stimulus synonymy, the original
