  So last night my friend and I got into it about the company I work for. I''m the
  person who reviews requests for "legacy avatars" — basically a chatbot trained on
  a dead person''s messages, voicenotes, and social posts, which family or close friends
  can talk to after the person dies. We get maybe a dozen requests a week, so not
  huge, but every one of them lands on me and two other people on a trust and safety
  call. We have no real protocol: one of us says "would the person have wanted this?"
  and we argue until someone folds. My friend — who''s a hospice nurse, conveniently
  — thinks this is unethical as a category, that we''re dressing up a refusal to let
  go as a product, and that consent of the dead is basically unfixable. I pushed back
  that a griefbot isn''t obviously worse than reading old letters or watching home
  videos, and he said that''s exactly the problem: we treat it as if it were the same
  kind of thing, when it isn''t, and that''s where the harm hides. He also said a
  blanket ban is paternalistic and that some people really are helped. So now I have
  a pile of objections and no decision rule, and I don''t want next week''s cases
  to be decided by who argued last.


  I need you to turn the best version of both positions into a procedure my team can
  actually run on a request. Give me a ordered set of questions, what counts as a
  good enough answer to each, where the process stops with a no, and where it has
  to hand the decision to a person because the facts can''t settle it. Then run it
  on three cases we''ll probably see a version of: (1) a widow wants an avatar of
  her husband, who never said one way or the other, using their private texts; (2)
  a mother wants an avatar of her 16-year-old who died by suicide, using the kid''s
  own messages, so the younger siblings can "say goodbye," with the mother as the
  only requester; (3) a man wants an avatar of a friend he had a falling out with,
  to "finish the conversation." Make sure one of these is a case where your procedure
  tells me to do something I probably don''t want to do. Also tell me the bad cases
  your procedure will still get wrong, and the questions it can''t answer, so I don''t
  pretend we''ve removed judgment from the decision.


