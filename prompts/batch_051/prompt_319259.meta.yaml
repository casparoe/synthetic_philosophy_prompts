  ---


  I am a PhD student in philosophy of law, working on coercion and the moral limits
  of the criminal law, and I have been circling around the familiar problem of blackmail.
  The puzzle as I understand it is roughly this: a person may, in many cases, permissibly
  reveal a damaging truth about someone, and a person may permissibly ask another
  for money; yet when the two acts are combined into a single conditional proposal
  — pay me or I make the information public — the law and much ordinary moral thought
  treat the result as blackmail and condemn it. Why the conjunction should be worse
  than its parts is what I find puzzling, and I suspect the answer to that question
  also has wider consequences for how we individuate actions and distinguish threats
  from offers.


  To focus my thinking, I have collected five broad rationales for criminalizing blackmail,
  stated in my own words rather than as named theories. (1) The privacy/autonomy rationale:
  disclosing intimate or reputation-damaging truths is often itself a wrong against
  the victim''s interest in controlling private information, so one of the supposedly
  permissible component acts was not, in fact, morally neutral. (2) The third-party
  harm rationale: blackmail predictably harms people other than the two parties —
  the victim may embezzle or defraud to raise the money, and suppression of the information
  may leave employers, creditors, or a political community exposed to hidden misconduct.
  (3) The unproductive-transaction rationale: blackmail creates no value; it merely
  transfers wealth through a threat, wastes resources, and rewards the strategic discovery
  of damaging secrets rather than any socially useful activity. (4) The coercive-threat
  rationale: the decisive feature is that the blackmailer announces he will perform
  a harmful or unwanted act unless paid, and this conditional structure makes the
  proposal coercive regardless of whether the threatened act would otherwise have
  been lawful. (5) The wrongful-relationship rationale: the objection is not chiefly
  to the threatened disclosure but to the kind of relation the blackmailer creates,
  one in which another person''s vulnerability is converted into a private source
  of revenue and a lasting dependency on the blackmailer''s continued silence.


  I would like you to rank these five rationales from most to least explanatory of
  why blackmail, in its central cases, is properly criminalized. Give a complete ordering
  rather than grouping them into loose tiers, and make clear where the ranking is
  most contestable. I am not looking for a survey of each view''s advantages and disadvantages;
  I want you to commit to a definite ranking, say which single rationale you would
  defend as doing the most fundamental explanatory work and which you would demote
  as the weakest, and then justify those choices in terms of what you take the core
  of the wrong of blackmail to be.


