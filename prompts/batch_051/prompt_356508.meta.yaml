  Prompt:


  I''m a journalist who covers science and ideas for a general-interest magazine,
  and I keep running into the same problem. Every few months I have to write a short
  piece about some new claim concerning the distant past—say, a book arguing that
  a volcanic eruption caused a Bronze Age collapse, or a paper claiming that a particular
  prehistorical migration can be inferred from potsherds. My editors want the piece
  quick, 600 words, and I have no background in ancient history or archaeology. I
  can usually get one expert on the phone. What I want is a reusable procedure for
  deciding how much credence to give to a claim about the distant past before I write
  it up.


  Thucydides, at the beginning of The History of the Peloponnesian War (Crawley translation),
  writes: "For though the events of remote antiquity, and even those that more immediately
  preceded the war, could not from lapse of time be clearly ascertained, yet the evidences
  which an inquiry carried as far back as was practicable leads me to trust, all point
  to the conclusion that there was nothing on a great scale, either in war or in other
  matters." I read that and it sounds like he''s doing something more nuanced than
  just saying "we can''t know." He seems to be distinguishing between what evidence
  can support, and what he trusts only after an inquiry. But I don''t know how to
  turn that into a working checklist. Please write me a decision procedure I can actually
  run on a book chapter or paper before an interview: the questions to ask in order,
  what counts as a sufficient answer for each, where the procedure stops with a no,
  and where I should hand the decision to the expert because it''s a matter of judgment
  rather than checking. Then run it on two cases: (1) a claim that a volcanic eruption
  on the other side of the world caused the collapse of a kingdom whose written records
  are almost nonexistent, based mostly on chemical signatures in ice cores and a few
  burnt rooms; and (2) a claim that a single battle described by two ancient authors—who
  give different casualty figures and write at different removes from the event—decisively
  ended a centuries-old trading network. I''d especially like to know where the procedure
  would make me say "we just can''t report this as fact" even if the book''s prose
  is very confident.


