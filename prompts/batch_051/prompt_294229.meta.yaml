  Question: "Explain the following passage from C. S. Peirce''s ''How to Make Our
  Ideas Clear'' (1878): [quote]. Then say whether William James''s pragmatic account
  of truth, in your own words, can be defended against the objection Peirce raises
  here. If it cannot, explain why not and why someone might still think it can."


  Student''s answer:


  "Peirce defines a clear idea as one recognized wherever met and not mistaken for
  another, and an obscure idea as one that fails this. His real target is the old
  logical idea that familiarity is enough. He says a subjective feeling of mastery
  can be wrong. James thinks a belief is true when it works, meaning it fits our experience
  and lets us make successful predictions and actions. Since James treats practical
  success as evidence for truth, he is not just looking at a subjective feeling; he
  is looking at objective consequences. So James is not vulnerable to Peirce''s point
  because James adds an external check: true ideas work, and when they don''t work
  experience forces us to change them. Peirce might object that ''works'' is still
  too vague, but the passage only rejects mere familiarity, not practical consequences.
  James''s account can be defended by saying that truth is a species of good: true
  beliefs are profitable to believe in the long run. Peirce''s own view, that truth
  is fated to be agreed in the long run by inquirers, similarly uses a future consensus
  as the mark of truth."


  This is mixed: It correctly identifies clear/obscure, subjective feeling. It gets
  James partially right: true when it works is crude; James''s "practical consequences"
  does provide external check; but the answer mischaracterizes James''s "truth is
  a species of good" maybe okay. The subtle mistake: It attributes to James a long-run
  profitability that actually is Peirce''s. It says "true beliefs are profitable to
  believe in the long run" as James''s, but that''s a common misattribution; James
  would say true ideas are those we can assimilate/validate/verify, not merely long-run
  profitable. Also last sentence connects Peirce''s long-run consensus to James''s,
  suggesting both use future consensus, when Peirce''s long-run agreement is not a
