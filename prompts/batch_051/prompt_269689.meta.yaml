  Key ideas:

  - Jus in bello vs. jus ad bellum independence: traditionalists hold the rules governing
  conduct in war are independent of whether the war is just, because soldiers cannot
  plausibly know or be responsible for the latter, and because wars are fought by
  collectives.

  - Revisionists (McMahan) reject independence: in idealized deep morality, liability
  to be killed is individualized; a soldier fighting an unjust war is not morally
  different from a criminal attacking someone; therefore his killings are not justified—at
  best excused. Defenders on the just side cease to be liable when they defend.

  - Walzer''s later view: war is a condition of enforced collectivity; we cannot apply
  peacetime morality to soldiers; the "moral equality" is a convention we should maintain
  because it protects civilians and contains war, and because soldiers are not in
  a position to judge.

  - Law vs. deep morality: both camps can agree that the laws of war (symmetrical
  permissions) may be justifiable pragmatically even if deep morality is asymmetric.
  Revisionists often say we should keep symmetrical law but not teach it as morality.

  - Excuse vs. justification: a key crux. Traditionalists sometimes slide between
  "soldiers are excused" and "soldiers are justified." Revisionists insist unjust
  combatants can be excused (duress, epistemic limitation) but not justified.

  - Pooled/collective liability? Some traditionalists argue soldiers acquire role-based
  liability by entering the military, perhaps even on an unjust side.

  - Democratic accountability: McMahan argues civilian and soldier liability varies
  with responsibility. Traditionalists say sorting liability individually in war is
  impossible and dangerous.

  - Uncertainty: soldiers almost always lack the epistemic position to determine the
  justice of the war; should the morality of action be evaluated from the agent''s
  perspective (subjective permissibility) or fact-relative (objective)? A key crux:
  the revisionist''s asymmetry is fact-relative, but soldiers'' actions may be subjectively
  permissible. Traditionalists can sign that much? Actually traditionalists might
  not accept the fact-relative framing.


