  I am a novelist, not a philosopher or a computer scientist, and I have been reading
  the long-running dispute over machine translation for a novel I am writing. By now
  the debate seems to have stalled completely. On one side, Hofstadter and those persuaded
  by him argue that statistical machine translation — neural or otherwise — is fundamentally
  shallow: it produces target-language text by manipulating surface patterns and co-occurrence
  statistics, without grasping the meaning of what it renders, and its occasional
  successes are just the statistics of large corpora doing their work. On the other
  side, defenders of modern neural MT reply that the systems demonstrably learn structured
  internal representations, track cross-linguistic dependencies, resolve ambiguity
  in ways that require sensitivity to context, and generalize to sentence types no
  corpus could have contained verbatim; from this they conclude that the systems encode
  something semantic enough that the line between their "shallowness" and our competence
  is one of degree, not kind.


  What strikes me is that both camps largely accept the same technical facts about
  how the systems are trained and mostly cite the same outputs as evidence — one side''s
  case study of a howler becomes the other side''s anecdote — yet nobody moves. I
  want a diagnosis of the disagreement itself, not a verdict for one side. Is this
