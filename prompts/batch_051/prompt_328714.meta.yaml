  ---


  For a discussion group on mind and evolution, I''ve been asked to write down my
  working commitments about competence without comprehension—the Darwinian and Turing-style
  inversions of reasoning. I''d like you to audit the set and tell me whether these
  commitments hang together. Here they are:


  1. Darwinian inversion: biological design and well-adaptedness can be fully explained
  by natural selection, a process with no foresight, no representation of goals, and
  no comprehension of what it is producing. I don''t think any appeal to a designer
  or to nature''s purposes does explanatory work.


  2. Turing inversion: a physical mechanism can be competent at a cognitive-looking
  task—computing arithmetic, playing chess, parsing sentences—by manipulating uninterpreted
  symbols or states according to rules, without any understanding of the task, its
  symbols, or of arithmetic/chess. The understanding we attribute to such a system
  is something we, the interpreters, bring to it rather than an ingredient inside
  the mechanism.


  3. Nonetheless, I hold that there is a real difference between a person who understands
  arithmetic and a pocket calculator that merely turns out correct answers. Understanding
  is not just matching the outward input-output behavior, and I reject a purely behavioristic
  account of comprehension.


  4. I also think comprehension is a product of the same Darwinian process: it is
  a biological competence that evolved by natural selection, it admits of degrees
  across species (and potentially across artifacts), and it involves no extra ingredient
  over and above organized matter and energy—no res cogitans, no élan vital.


  5. Selection explanations are genuinely explanatory even though nothing in the process
  represents them. When we say a moth''s coloration evolved because it provides camouflage,
  the reason of camouflage is not arbitrary or merely projected: it picks out a real
  selective advantage in the moth''s environment. So reasons can be real and explanatory
  without being represented by the organism.


  6. I take the philosophical payoff of the inversions to be that we can explain competence,
  even sophisticated competence, in terms of underlying mindless processes, without
  treating purpose or meaning as primitive or as a causal force of its own.


  Please go through these and tell me which pairs or triples are in tension, and how
  badly. For each tension, order them by severity and say what would have to give
  to resolve it, and at what cost to the overall view. I also suspect at least one
  apparent tension among these dissolves on closer inspection—say where that happens
  and why it''s only apparent. Don''t try to make them all consistent: I want the
  trouble spots, not a defense of the set. I don''t know where the problem is, and
  I don''t have a preferred bullet to bite.


  Finally, for each substantive claim you make in the audit, please say how confident
  you are in it, and single out the one point you are least sure about.


