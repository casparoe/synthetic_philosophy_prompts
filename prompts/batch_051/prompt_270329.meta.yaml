  I am a reporter at a science-and-ideas magazine, and several times a year I face
  a version of the same editorial decision: whether to run a story identifying a particular
  person or organization as responsible for a specific harmful event when the only
  evidence we have is statistical. For example, we may know that most of the buses
  on a route belong to one company, or that a very high proportion of attendees at
  an event entered without paying, or that exactly one member of a small team must
  have fabricated data — but we have no witness, document, or forensic result that
  ties the named individual or body to the particular act. When we get it wrong, we
  ruin a reputation and may face defamation action; when we decline to publish, we
  may be suppressing something the public genuinely should know. My editors are intelligent
  but have no training in philosophy or probability, and we work on deadline.


  I want a reusable editorial procedure for these cases, drawn from the philosophical
  and legal discussion of naked statistical evidence — the blue bus and gatecrasher
  cases, and the difference between a high probability and proof beyond reasonable
  doubt — but translated into something a working newsroom can actually execute. The
  procedure should be a checklist or flowchart in words: the questions to ask in order;
  what counts as a sufficient answer to each; where the procedure stops with a no;
  where it tells us the remaining question is one of values rather than evidence and
  must be handed to the editor or legal counsel. It should be runnable in under an
  hour by a reporter with no formal statistical training, and it should make clear
  which distinctions from the philosophical discussion must survive the simplification
  and which can be dropped in practice. I am less interested in a summary of the theory
  than in the operational version of it.


  Then run the procedure on these three situations, showing the reasoning in enough
