  Key distinctions in the literature (I know them):

  - Scapegoat in Leviticus 16: sins of Israel confessed over the goat, which is sent
  into wilderness to Azazel; the goat carries away iniquities. The community''s guilt
  is transferred to a substitute who is expelled. The victim is not punished; it''s
  removal/atonement.

  - Sacrifice: offering kills a victim; the victim substitutes for the offerer (e.g.,
  animal in place of firstborn, or in place of the sinner''s death); blood as life
  given to appease/atone.

  - Girard: scapegoat mechanism — mimetic desire leads to rivalry, crisis, all-against-all;
  community channels violence onto a single victim, whose killing restores peace;
  the victim is arbitrary, accused, mythologized as guilty; the mechanism works only
  if hidden.

  - Frazer: the scapegoat as a vehicle to transfer evil to something that can be destroyed/expelled;
  corn-spirit, etc.

  - Kantian/utilitarian: punishing an innocent to deter or to maximize welfare — scapegoating
  as injustice; the criminal law constraints (no punishment of the innocent even if
  useful).

  - Atonement theories: penal substitution (Christ bears penalty), satisfaction (Anselm),
  moral influence (Abelard), Christus Victor. Scapegoat themes.


