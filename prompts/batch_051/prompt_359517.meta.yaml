  and sacrifice tradition in which a community''s sin or impurity is loaded onto a
  victim, who is then killed or driven out, and the community is cleansed by the transaction.


  Please give me a careful reading of the story through that lens, one that treats
  both the story and the sacrificial logic seriously and is explicit about where they
  diverge. In particular: (1) In the Leviticus scapegoat rite and in Girard-style
  accounts of the scapegoat mechanism, the victim is cast as guilty or impurity-bearing,
  and the community''s violence against it restores order in part because the community
  can believe in that guilt. Omelas seems to keep the mechanism but drop the mystification:
  everyone knows the child is innocent and that the city''s flourishing is purchased,
