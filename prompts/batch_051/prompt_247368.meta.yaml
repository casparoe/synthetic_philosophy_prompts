  Clinical genetics has an unusual feature. On the one hand, the field is built on
  informed consent: patients and research participants are supposed to be given more,
  clearer information about tests, risks, and results, and consent is considered invalid
  without it. On the other hand, the same field has institutionalized a right not
  to know. A person at risk for a serious, incurable, late-onset condition such as
  Huntington''s disease can decline testing; a research participant can opt out of
  receiving incidental findings even when a variant is discovered; and some centers
  have policies for handling results that a patient has said in advance they do not
  want to receive. These refusals are treated as legitimate choices, not as irrationality
  that the clinician should override.


  Now consider Good''s theorem on the value of information. Roughly, it says that
  for an agent who maximizes expected utility and updates by conditionalization, cost-free
  information can never have negative expected value: the agent can always ignore
  the information, and having the option to act on it can only improve the agent''s
  best achievable outcome. On that picture, refusing free information looks like a
  mistake, unless the information itself carries costs.


