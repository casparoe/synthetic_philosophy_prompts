  "In discussions of moral motivation I repeatedly encounter a configuration for which
  I have no label. A person is moved to help by what he calls compassion, and the
  immediate act looks benevolent. But the help seems structured around the continued
  suffering of the recipient: it relieves distress enough to keep the recipient as
  a suitable object of concern, while avoiding measures that would make the recipient
  independent; the helper''s interest cools once the recipient begins to recover or
  assert competence. At the same time the helper experiences the encounter as a confirmation
  of his own sensitivity, and interprets the recipient''s resistance or ingratitude
  as a failure of the recipient rather than as information about the help. A public
  variant appears when displays of pity for a group function as a credential of moral
  seriousness, while the group''s own agency is treated as an inconvenience. I am
  aware this overlaps with the familiar charge that pity is patronizing, and that
  Nietzsche offered a sharper version of that charge against Schopenhauer''s elevation
  of compassion. But I am after something more specific: the way compassion can depend
  on, and quietly preserve, the suffering it claims to want to eliminate. Does this
  phenomenon have an established name in philosophy or moral psychology, and what
  separates it from ordinary compassion, condescension, and straightforward hypocrisy?
  If no term exists, what should it be called?"


