  The domain: "when is deference a virtue?" Deference can be a virtue? The prompt''s
  job: desiderata for a theory of when deference to authority is a virtue (or more
  broadly, when following an authority is justified/blameworthy/praiseworthy).


  Distinctions:

  1. Epistemic deference vs. practical deference. Taking someone''s word for a proposition
  vs. doing what they say. Different norms. A theory must not collapse them: you can
  rationally believe a meteorologist and still not obey their orders; you can obey
  a drill instructor without believing they''re smarter.

  2. The question "is this authority legitimate" vs "should this subordinate comply"
  vs "should the subordinate be blamed for complying/refusing". These can come apart:
  a legitimate authority may issue an order that the subordinate should not carry
  out; an illegitimate authority may issue a demand that happens to coincide with
  what you should do.

  3. Deference as an act vs. as disposition/character trait (the virtue of due deference,
  related to teachability, humility, order). A theory should say whether the virtue
  is in the act or the disposition, or both.

  4. Protected (preemptive) reasons vs. ordinary reasons. Raz-style: authority''s
  directive is supposed to exclude some first-order reasons. A theory must say whether
  deference requires excluding one''s own judgment or just weighing the authority''s
  say-so heavily. That''s real in-the-weeds.

  5. Authority of office vs. authority of expertise vs. authority of the wise/exemplar
  vs. authority of force. Military chain of command is authority of office; a doctor
  has epistemic authority; a parent has authority of care. A theory should handle
  all or say why not.


  Phenomena/cases:

  - Milgram baseline: majority of ordinary people administered what they believed
  were dangerous shocks when a nearby experimenter (legitimate-seeming scientific
  authority, no threats) encouraged them. A theory must explain why this is (or isn''t)
  a failure of deference — and why people predicted they''d refuse yet mostly didn''t.

  - Milgram variations: when experimenter gave orders by phone, obedience dropped;
  when another "teacher" refused, obedience dropped; when in an office building, dropped.
  So the situational features — proximity, institutional setting, dissenting peers
  — matter. A theory must be consistent with those.

  - Military: lawful vs unlawful orders; doctrine that obedience to lawful orders
  is expected, that manifestly unlawful orders must be refused; the fact that "I was
  following orders" is not generally treated as full defense in war crimes law. Theory
  must explain the asymmetry between the virtue of obedience in normal command and
  the duty to disobey manifestly illegal orders, including why "manifestly" does work
  that ordinary "wrong" doesn''t.

  - Arendt/Eichmann: the claim that Eichmann''s deference to career and orders was
  part of the evil, not an excuse; think of it as a limit case where deference can
  be a vice. A theory must say why deference in a bureaucracy can be corrupting even
  when each order is laweful (or at least official).

  - The expert disagreement: deferring to a consensus expert on a factual matter (climate
  science, medicine) can be a virtue of epistemic humility; but too much deference
  to experts can enable fraud (replication crisis) and returns to incentives. A theory
  must distinguish when epistemic deference is warranted by track record/calibration
  rather than credentials.

  - The nurse: a nurse who obeys a physician''s obviously wrong dosage is blamed;
  but a nurse who refuses every physician order is not a good nurse. So there''s a
  middle: deference is required for coordination and division of labor, refused at
  the edges.

  - The parent/child: we want children to defer to parents as a developmental stage
  but the same disposition can make abused children unable to report. A theory should
  say whether deference is a virtue simpliciter or relative to role/position/development.

  - The banker/compliance officer: someone who defers to a "just doing my job" role
  in a harm-producing system (defense lawyer? not harm). Could include "Sanford prison
  guards" but Zimbardo''s Stanford prison experiment is debated; might include as
  "institutional role" point without leaning on details.


  Results it can''t contradict:

  - The empirical regularity that people systematically overestimate their own independence:
  many who say they''d refuse actually comply. So a theory of the virtue can''t just
  say "defer when the content is right" without explaining why content monitoring
  fails under authority cues.

  - Obedience to authority is not reducible to coercion or sadism; ordinary people
  comply with polite prodding. A theory must account for the fact that authority exerts
  pull without threats.

  - The presence of a dissenting peer drastically reduces compliance — so deference
  is socially/informationally mediated, not just an individual''s rule.

  - The fact that hierarchical deference solves coordination and specialization problems:
  militaries, surgical teams, air traffic control need it. A theory can''t make deference
  intrinsically bad or intrinsically good without explaining why it tracks institutional
  function.


  Camp preferences / negotiable:

  - Whether legitimate authority thereby gives a preemptive reason (Raz''s "service
  conception") or just a strong evidentiary/procedural reason — probably not a desideratum,
  it''s a theoretical choice.

  - Whether there is a distinct virtue of "due deference" or it''s just the application
  of practical wisdom — camp preference.

  - Whether epistemic and practical deference are unifiable under one principle or
  must be treated separately — perhaps a desideratum to at least address, but unification
  itself negotiable.

  - Whether the correct account must be moralized (only good institutions generate
  genuine authority) or empirical/legal.


  Flag jointly unsatisfiable pair:

  - Pair (A): "An authority''s legitimate directive is a protected reason: the subordinate
  must not substitute their own judgment of the merits." and (B): "The subordinate
  is blameworthy whenever they carry out a legitimate directive that is seriously
  wrong." These can''t both hold unrestricted: if the agent is not permitted to re-judge
  the merits, they can''t be blamed for failing to catch an error; if they are blamed,
  some re-judgment duty must survive. A theory has to either reject full preemption
  or reject blanket blame, or restrict each by role/domain.

  - Pair (C): "Deference is a virtue only when it tracks objective rightness (the
  order is good)" and (D): "Deference is valuable partly because it lets agents act
  without computing the rightness themselves." These are in tension: if the whole
  point is not having to compute, you can''t condition the virtue on the computation''s
  output. This is a nice in-the-weeds tension.


