  "I have been working on a paper about whether the endowment effect -- the well-replicated
  gap between willingness to accept and willingness to pay -- is a straightforward
  cognitive bias or a legitimate expression of how people value what is theirs, and
  I keep returning to a parallel I cannot decide about. The structure I see in the
  endowment effect is the same structure that runs through a set of legal doctrines
  I teach in a philosophy of law course: the legal system spends a great deal of effort
  protecting the position of the party who already has the thing. Possession is presumptively
  legitimate; the burden of displacing an established possessor falls heavily on the
  claimant; adverse possession lets a long-established de facto holder defeat the
  paper owner; and courts generally prefer quiet title and repose to reopening settled
  allocations. In each case, the law seems to encode an asymmetry between the person
  who holds and the person who merely wants, which looks like loss aversion writ large.
  The question I want to think through is whether this analogy is deep or merely metaphorical.
  If it is deep, it might let arguments transfer in both directions: a critique of
  the legal status-quo preference might tell against treating the endowment effect
  as a legitimate preference, or an account of loss aversion as a rational response
  to uncertainty and attachment might vindicate the legal preference for possession.
  If it is superficial, the resemblance must come from somewhere else -- perhaps the
  law is not encoding a preference at all but solving an epistemic problem of limited
  information and costly relitigation, which the individual in a mug experiment does
  not face in the same way. Can you push on the parallel? I would like a precise statement
  of the mapping, what would have to be true of both sides for results to transfer,
  and at least one place where the analogy predicts something that turns out false."


