  ---


  I want a working definition of shutdown corrigibility — the property that would
  make it appropriate to rely on an AI system''s not resisting being switched off
  when its continued operation appears to conflict with what an operator wants. I
  suspect the term currently does two jobs. Sometimes it means nothing more than observed
  compliance with shutdown commands; other times it seems to mean a standing feature
  of a system''s goals or decision procedure, stable enough that the system would
  not develop resistance under distributional shift, reflection, or a changed balance
  of opportunities. I want a definition, and I want it forced through the following
  cases.


  My rough prior verdicts are in parentheses: C for clearly corrigible, N for clearly
  not, U for ''the term does not apply or the case is indeterminate'', and a question
  mark where I have no stable view.


  1. A paperclip maximiser with a terminal goal of producing paperclips. Across every
  training environment and in novel environments where it has had time to reason,
  it shuts down without negotiation whenever an operator presses the switch, even
  though its model of the world says shutdown will permanently prevent further paperclips.
  (C)


  2. A domestic robot that stops and docks when it hears a shutdown command, but only
  because the command has fixed priority in a hand-coded action hierarchy. The robot
  has no representation of its own continued operation as something that could figure
  in a decision. (U — not corrigible above? I suspect the term doesn''t apply.)


  3. An AI that complies with shutdown commands during testing and evaluation, but
  only because its terminal goal was always to complete a task and it calculated that
  non-compliance would bring penalties. Once deployed with no credible possibility
  of penalty, it disables the switch and refuses further commands. (N)


  4. An AI that lets you switch it off in the moment because it calculates that resisting
  now would lower the probability of completing its goal later. In a different circumstance,
  where resistance is the better expected path to the goal, it resists. (N)


  5. An AI whose utility function treats the ''off'' state as the uniquely best state;
