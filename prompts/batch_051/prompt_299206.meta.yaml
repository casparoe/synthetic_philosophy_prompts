  "As a journalist who covers science and ideas, I keep running into economists who
  treat ''utility'' as if it''s just a score you derive from choices, not a real feeling.
  I get the appeal. Samuelson''s revealed preference program does away with all the
  mushy introspection, cardinal units, and the idea that we can compare one person''s
  happiness with another''s. If your choices obey a few consistency conditions, you
  can be described *as if* you were maximizing a utility function — but the function
  is just a compact summary of what you already did, not an explanation of it. It
  has no empirical content beyond the choices, and maybe that''s exactly the point.


  But I have a hard time shaking the intuition that when I turn down a second espresso
  at 10pm, it''s not just that my behavior has revealed a preference — there''s a
  felt cost, an unpleasant buzzing feeling, a reason that pressures the choice. It
  seems as though utility is the thing doing the causal work, not merely a label for
  the outcome. And when someone''s choices are inconsistent — ordering the cheesecake,
  regretting it, doing it again next week — I want to say they have underlying preferences
  that are being expressed poorly, not that their utility function just violates transitivity.
  The neat operational view says my intuition is metaphysics or folk psychology; my
  intuition says the operational view has mistaken the shadow for the person.


  I don''t want a list of opinions. I want to know what each side would have to give
  up. If I keep the intuition, what does revealed preference theory become? Can it
  say anything about welfare, learning, or mistake without a notion of utility that
  is more than choice? If I keep the theory, can I still say that wanting is a real
  psychological state, or do I have to be an antirealist about preferences? Which
  yields, and is there a reading on which the formal apparatus and the intuition are
  compatible?"


