  Final prompt:


  "I cover science-and-ideas stories for a general audience, and I keep running into
  economists who talk about ''utility'' purely in the revealed-preference way: a person''s
  choices satisfy a few consistency conditions, so we can model them as maximizing
  a utility function, but the function is just a summary of behavior, not a description
  of some inner stuff. I''ve gone back to Samuelson''s 1938 consumer-behaviour paper
  and the parts of it I can follow make a very seductive case for dropping introspection
  altogether. You don''t have to ask how someone feels; you just have to see what
  they do. The weak axiom of revealed preference tells you whether the data are consistent
  with maximization, and that''s all the ''utility'' there is.


  Yet I can''t get myself to accept that. When I choose the small coffee at 3pm because
  a large one will make me twitchy and anxious, there is a felt cost, a bad edge,
  that is doing the forcing. The choice is not just *revealing* a preference; the
  feeling seems to be the reason for the choice. And when someone keeps ordering the
  dessert, then saying they regret it, then ordering it again, I want to say they
  have a real underlying preference that is being poorly expressed — not merely that
  their chosen sequence violates the consistency axioms. The operational story says
  this is folk psychology with no scientific content; my gut says the operational
  story has mistaken the record of wanting for the wanting itself.


  So here''s my question: if I take the intuition seriously, what does revealed-preference
  theory have to surrender or develop? Could it still make claims about welfare, mistakes,
  or learning without a utility notion that is more than a label? If I take the theory
  seriously, am I forced into antirealism about wanting — is preference literally
  nothing but choice consistency? Or is there a version where utility functions and
  felt desires are compatible, and what would have to be true for that version to
  work? I want the strongest version of both sides, including what each side would
  most plausibly concede, not a noncommittal survey."


