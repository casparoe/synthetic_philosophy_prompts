  vocabulary of distributed-systems and reliability engineering:


  1. The atomist position: only individual persons are the kinds of things that can
  be morally blamed; talk of blaming a company is shorthand for blaming (some set
  of) individuals, and where no individual is clearly at fault, the corporation is
  not a blameworthy agent.

  2. The emergentist/intentionalist position: a corporation can be a blameworthy agent
  in its own right because its decision structure can produce decisions, policies,
  and a kind of continuity of purpose that no individual employee holds or intends.

  3. The accountability-without-culpability position: a corporation can properly be
  held answerable, fined, sanctioned, or required to make amends irrespective of whether
  it is the kind of entity that can be culpable in the way individuals are.


