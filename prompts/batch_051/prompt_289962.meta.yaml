  when expressed in terms of nodes, state, message-passing, control loops, failure
  modes, and so on; (b) the distortions — claims that can be forced into the vocabulary
  only by bending the usual meaning of the engineering terms; (c) the blanks — claims
  that have no counterpart in the vocabulary at all.


  Then step back and report the residue: compile the main things that failed to translate
  across all three positions, and assess whether each one is (i) a signal that the
  distributed-systems vocabulary is missing something morally important, or (ii) a
