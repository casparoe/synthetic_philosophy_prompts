  injustice... Actually Rawls says envy is not a moral feeling (it''s not based on
  principles) but can be excusable under conditions where inequalities are so great
  that... In a well-ordered society envy is less likely. Envy proper: propensity to
  view others'' greater good as subtracting from one''s own, even when their being
  better off doesn''t deprive us. Rawls distinguishes benign envy (we want what they
  have too) from envy proper (we want to deprive them). Excusable envy: when differences
  are so great that they undermine self-respect; envy may be an excusable reaction
  though not morally justified.


  This could work for type 3: construct a thought experiment where Rawls''s excusable
  envy and something... or type 2: which open questions in envy/resentment literature
  matter most.


