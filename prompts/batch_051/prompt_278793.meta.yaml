  Question text:

  "State the principle of alternative possibilities (PAP) as Frankfurt defines it.
  Then describe a Frankfurt-style case and explain why it is meant to show that PAP
  is false. Finally, evaluate the argument: does the case genuinely remove all alternative
  possibilities, and does its conclusion support compatibilism about determinism and
  moral responsibility? Address at least one standard objection."


  Student answer:

  "Frankfurt''s principle of alternative possibilities says that someone is morally
  responsible for an action only if they could have done otherwise. His example concerns
  Jones and Black. Black wants Jones to kill Smith and has a device that will cause
  Jones to kill Smith if Jones shows any sign of deciding not to. Jones shows no such
  sign and kills Smith on his own. Black never intervenes. Since Jones would have
  been stopped from doing otherwise had he tried, he could not have done otherwise;
  but because the actual decision was his own, he is still morally responsible. This
  shows that PAP is false. It also shows that compatibilism is true. Determinism works
  like Black''s device: it ensures that there was no alternative path, but the actual
  deliberation and choice remain the agent''s own, so responsibility is compatible
  with the absence of alternative possibilities. One standard objection is the flicker-of-freedom
  reply. It says that Frankfurt''s case never fully removes alternatives, because
  Jones retains a faint alternative such as showing the prior sign or beginning to
  decide otherwise. Frankfurt himself answered this by saying no flicker remains,
  since Black can detect the sign infallibly and therefore even the sign was not something
  Jones could avoid. But defenders of PAP insist that as long as any flicker remains,
  however faint, PAP''s requirement is still met, and Frankfurt has not shown the
  principle to be false."


