  - The context: long argument with a friend about authorial intention; asker defended
  the anti-intentionalist side, or was trying to. The friend, a competent opponent
  (maybe an English lit grad student? Or a philosopher friend?).

  - The friend''s summary (the characterization to audit). Should be plausible and
  mostly right, in the voice of a confident opponent, with one or two subtle misrepresentations.

  - The asker wants an accuracy audit: what''s accurate, what''s subtly wrong, what
  a defender would object to, and whether the conclusion drawn survives.

  - The asker may mention what they''re inclined to believe (e.g., "I agreed with
  the first part but the step to ''any reading is valid'' felt like a bait-and-switch").


  Let me ensure the summary contains subtle misrepresentations, not howlers:


  Possible summary (friend''s words):

  "Look, the anti-intentionalist position is simple. Once a text is out in the world,
  its meaning is public: it is fixed by the words in their ordinary sense and by the
  text''s internal structure, not by what the author had in mind. The author''s stated
  aims, drafts, letters, and later comments are not evidence about what the text means;
  at best they are evidence about the author. The author is just another reader, and
  her reading has no authority over anyone else''s. So any interpretation that is
  faithful to the words on the page is as good as any other; you can''t say a reading
  is wrong unless it''s based on a factual mistake or ignores plain textual evidence,
  and beyond that there''s no fact of the matter about which interpretation is correct."


  Now, which parts are accurate, which subtly wrong?


  Accurate core:

  - Anti-intentionalism (especially Wimsatt & Beardsley''s "intentional fallacy")
  holds that the success of a literary work is not judged by authorial intention;
  meaning is constituted by what is in the text and its public language. "The poem
  belongs to the public." The poem''s meaning is not a private mental state. External
  evidence (letters, diaries) is distinct from internal evidence.

  - Meaning fixed by public conventions and internal textual structure — roughly accurate.

  - Author''s stated aims/letters not authoritative evidence about the meaning — roughly
  accurate, but there''s nuance (anti-intentionalists often distinguish between evidence
  used to discover what the words say vs. evidence used to decide what the work means;
  and some forms, like hypothetical intentionalism, use author intentions but only
  as publicly inferred — not W&B though).


  Subtle errors:

  1. "The author''s ... intentions are not evidence about what the text means; at
  best they are evidence about the author" — Wimsatt & Beardsley actually say external
  evidence about the author''s intention is not to be used to judge the work; but
  they allow that it may be "used for what it is worth" in some biographical or historical
  studies, and they distinguish between internal and external evidence. The stronger
  claim "not evidence at all" overstates; they allow internal evidence of intention
  (what the design itself suggests) and external evidence can be relevant to determining
  what words mean historically. Also, anti-intentionalism doesn''t typically deny
  that the text is a communicative act with an author; it denies the author''s private
  intention is the standard.

  2. "The author is just another reader, and her reading has no authority" — overstates:
  while the author''s later pronouncements don''t settle meaning, the author is not
  merely "another reader" in all respects; the author produced the text in a context
  of utterance, and the text''s context is needed to fix pronoun referents, genre,
  etc. Some anti-intentionalists might accept this though. Actually W&B might not
  object to "the author is just another reader" for judging the poem? Hmm, they wouldn''t
  say author''s "reading" has no authority over anyone else''s because it''s not about
  people''s readings; it''s about the poem. But the phrasing suggests a democracy
  of readers. Subtle shift from "author''s intention isn''t the standard" to "all
  readers are equal interpreters."

  3. "Any interpretation faithful to the words is as good as any other" / "no fact
  of the matter" — this is the big slide: anti-intentionalism says meaning is public,
  but that doesn''t entail interpretive pluralism or equality of readings; criteria
  like coherence, complexity, allusiveness, fitting the poem''s unity, etc., and judgment
  may rank readings. Some readings are better; "as good as any other" is not entailed.
  The conclusion drawn (no reading can be wrong except factual error) doesn''t survive.


