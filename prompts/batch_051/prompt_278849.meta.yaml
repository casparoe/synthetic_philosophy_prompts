  I have a set of verdicts about everyday risks, and I want to know what principle,
  if any, lies behind them. I accept the ordinary definition of a micromort as a one-in-a-million
  chance of death, and I have deliberately kept the probabilities in cases 1 to 5,
  7 and 8 close to one micromort so that the size of the risk is not what is doing
  the work. The numbers are approximate; I am more confident in the verdicts than
  in the arithmetic.


