  hesitation. Yet I notice that the thought of a bomb or a hijacking arouses a dread
  wildly out of proportion to its contribution to the overall figure, and I still
  fly.

  3. Living for a year near a factory that imposes roughly one micromort of additional
  mortality risk on each resident, without their consent and mainly for the firm''s
  profit: I regard this as objectionable and think the operator should be compelled
  to reduce it, even though I accept exactly the same probability when I choose the
  drive in 1.

  4. An X-ray, with an estimated fatal-cancer risk of about one micromort, ordered
  to investigate a symptom that is worrying me: I accept it without hesitation.

  5. The same X-ray, at the same risk, offered only as routine screening in the absence
  of any symptom: I hesitate and might decline, though I cannot say precisely why
  the benefit should matter if the risk is the same.

  6. A single recreational parachute jump, with an expected fatal risk of about ten
  micromorts: I decline, and I have declined for years. I suspect my real objection
  is not to the ten micromorts but to the fact that I would be purchasing a danger
  I do not need.

  7. A one-micromort risk of death taken to pull a stranger from a burning car: I
  take it without pausing, and I would think worse of someone who refused on the ground
  that the expected cost was one micromort.

  8. A one-micromort risk of a slow and painful death twenty years later, from an
  industrial exposure: I avoid it far more strenuously than I avoid 1 or 2, even though
  the probability of dying is the same and the death is no more likely.


  I am aware that the usual psychometric factors — dread, voluntariness, control,
  unfamiliarity — will be wheeled out to explain all this. My question is narrower
  and more demanding: is there a defensible principle of acceptable risk that actually
