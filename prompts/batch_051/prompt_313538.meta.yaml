  Domain: Why do promises bind?


  Possible specification with three theories:

  - Causal/expectation view (Scanlonish): the wrong in breaking a promise is that
  one frustrates an expectation one has intentionally caused and led the promisee
  to rely on.

  - Reliance view: the wrong is harm caused by breach after one has induced reliance.

  - Normative powers view: a promise binds because promising is an act that gives
  the promisee a right against the promisor; the wrong is violating a right, independent
  of expectations and reliance.


  Specification: "Construct a case in which the normative powers view counts a promise
  as binding while the expectation and reliance views do not. Constraints: realistic,
  no one actually relies or is harmed by the breach, the promisee does not release
  the promisor, and the promise is made to someone capable of holding a right. After
  the scenario, state the promise, walk through the three views'' verdicts and reasons,
  identify the feature of the case that drives the divergence, and then give the strongest
  reply an expectation theorist could make to block the case."


