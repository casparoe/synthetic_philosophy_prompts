  not rely or be harmed, but still accepts? But if they don''t believe, they still
  can hold a right. They don''t release. The promisor knows they don''t expect. Yet
  promisor has undertaken a commitment. Normative powers says yes, because the act
  was valid: communicated intention to undertake an obligation. But expectation view
  may say there''s no expectation to frustrate; the promisee hasn''t taken it seriously,
  so no wrong. Reliance view says no reliance/harm. Good.


