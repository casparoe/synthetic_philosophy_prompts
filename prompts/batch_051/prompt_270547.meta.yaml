  Kelly betting basics:

  - Kelly criterion: for a sequence of favorable bets with known edge and odds, the
  growth-optimal fraction to bet is f* = (bp - q)/b for simple win/lose bet, where
  p = prob of win, q = 1-p, b = net odds (you win b per 1 staked). For b=1 (even money),
  f* = p - q = 2p-1. More generally maximize E[log(1 + fX)] where X is net return
  per unit staked.

  - Geometric rationality / time-average growth: maximizing expected log wealth maximizes
  long-run growth rate, and is argued to be what a rational agent should maximize
  over many sequential decisions rather than expected wealth (arithmetic mean), because
  wealth compounds multiplicatively and the ergodic growth rate is the relevant quantity.

  - Half Kelly / fractional Kelly: common practice to bet less than full Kelly to
  reduce volatility/drawdowns; expected log maximization doesn''t by itself justify
  fractional Kelly unless you account for estimation error, non-log utility, or risk
  aversion.

  - Expected utility theory (EUT): if you have a utility function over final wealth,
  you should maximize expected utility; log utility is just one possible utility function.
  A person who maximizes E[U(W)] with U ≠ log will generally not bet Kelly. So a tension:
  endorsing EUT with a non-log (e.g., CRRA with γ ≠ 1, or any concave but not log)
  utility vs. endorsing Kelly for repeated bets. But under EUT with log utility, Kelly
  is the optimal policy; this dissolves if one''s utility is log.

  - The standard argument: Kelly is not generally the policy that maximizes expected
  utility of wealth for arbitrary utility; it maximizes log utility or long-run growth.
  A tension: (a) I accept Savage/vNM expected utility theory with Bernoulli utility
  over wealth; (b) I think rational agents should bet full Kelly on favorable repeated
  bets; (c) I think risk aversion is a matter of diminishing marginal utility of wealth;
  (d) I don''t think there''s any special privilege to log utility among all concave
  utilities. Do these hang together? Under EUT, (b) requires log utility; (d) denies
  privilege; tension. But it might dissolve if the domain is "long-run growth" as
  a distinct objective. Hmm.


