  Role: a clinical psychologist/psychiatry resident doing initial assessments or CBT?
  The two-factor theory: delusions arise from two factors — a neuropsychological anomaly
  giving rise to an experience/representation (factor 1), and a deficit in belief
  evaluation (factor 2) leading to acceptance of the delusion. The debate: are delusions
  beliefs (doxastic) or not? Some say delusions are beliefs but not responsive to
  evidence; others say they''re not beliefs because they fail to guide action or integrate
  with other beliefs; others (Bortolotti) say they''re beliefs, just irrational; against
  doxastic: they''re imaginings or empty speech acts. Phenomena: double-bookkeeping
  (patient says their arm belongs to someone else yet doesn''t act on it), circumscribed
  delusions, monothematic vs polythematic.


