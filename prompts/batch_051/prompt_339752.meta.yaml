  decision should stand.


  One said: The decision is not legitimate. The entire reason we use consensus rather
  than majority vote is to ensure that agreement is not manufactured by hierarchy,
  fear of social consequences, or fatigue. A silent member is not a consenting member.
  The fact that she had the formal opportunity to object means little, because she
  may have felt that objecting would mark her as difficult or damage relationships
  she depends on. If we treat absence of objection as consensus, we have rebuilt majority
  rule under a friendlier name, with the chair''s power to declare consensus doing
  the work a vote would otherwise do. We should privately ask her whether she genuinely
  agreed, and if she did not, reopen the matter.


  The other replied: That standard is unmeetable, and using it as a test for any particular
  decision is a category mistake. The ideal of a coercion-free discussion is a regulative
  idea: it tells us how to design our procedures and what to aim at, not a property
  we can verify in any actual meeting. We can never know why someone was silent —
  whether from genuine agreement, indifference, fear, or simple tiredness. If every
  decision can be reopened because someone was quiet, we create an incentive for endless
  challenge and give a de facto veto to whoever is least willing to speak. The member
  had the opportunity, no one threatened her, and the facilitator explicitly invited
  objections. At some point we have to accept that a procedure was good enough and
  live with the result.


  The first answered: But ''good enough'' is precisely what consensus procedure is
  meant to displace. Majority rule is already a way of being good enough. The value
  of consensus is that it detects objections that voting would override; if we adopt
  it but then shrug at the most predictable way it fails — the silencing of low-status
  members — we have kept the cost of the procedure while abandoning its point. Legitimacy
  need not be all-or-nothing, but we can do better cheaply: anonymous written objections,
  a private check-in with anyone who has not spoken, or a cooling-off period before
  a decision is final.


  The second answered: Those fixes have costs too. A private check-in turns the facilitator
  into an inquisitor and may pressure the quiet member just as much as the meeting
  did, only in private. Anonymous objections break the connection between a reason
  and the person who stands behind it, which matters because we are trying to reach
  agreement among persons, not just aggregate preferences. And if a member will not
  object when explicitly invited twice, there is no institutional fix that can consent
  for her. At some point the burden falls on members to speak.


