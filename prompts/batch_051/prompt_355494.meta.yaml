  study and was offered a free genetic risk report for a slow-developing condition
  that has a lifestyle intervention but no cure. He declined, saying he''d rather
  not know. Elena (a former colleague, statistician by training) said this is irrational:
  you can always do the same thing you would have done without the information, and
  if the result would change your behavior, then the expected health gain from better
  choices must be nonnegative; there''s a decision-theoretic theorem to that effect.
  Marcus (a physician, now retired) said that''s not how human beings work, and told
  a story about a patient whose life went worse after he learned a risk marker — he
  became preoccupied, stopped doing the things that had been keeping him well, maybe
  even sought unnecessary further testing with harms. Elena: "actual bad outcome"
  is hindsight; the antecedent expectation was still positive; the patient''s anxiety
  and biopsies are costs I agree should be counted, but they are costs of acting on
  the information, not the information itself; put them in the decision tree and recompute.
