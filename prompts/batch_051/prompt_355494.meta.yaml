  Let me think of the actual philosophical literature nuances to inject:


  - Good''s theorem: expected value of perfect information is nonnegative; value of
  partial information also nonnegative for decision-relevant partitions. The standard
  proof relies on the agent having a prior, updating by conditionalization, and choosing
  an action maximizing expected utility given the posterior. It also requires that
  the set of actions available after the information is the same (or a superset) as
  before. Strategic/competitive settings can violate it: e.g., in a zero-sum game,
  being publicly known to have information can make others alter their behavior to
  your detriment; or if a third party can compel disclosure. Also if the information
  affects your utility directly (e.g., news of a loved one''s death causes grief;
  suffering is a direct utility effect, not merely informational). Actually the theorem
  assumes information only changes beliefs, not preferences/payoffs. If knowing makes
  you sad per se, that''s a direct payoff effect; but could be included as a cost.
  Conversely, the value of information can be negative if the information itself is
  disturbing or if the agent is an imperfect decision-maker.


  This is a rich, real debate (Good, Kadane & Schervish on "Information and the will",
  etc.), but I don''t need citations. The prompt can say one party "sketched what
  he called the value-of-information theorem" — a paraphrase, no quoting. That injects
  substantive content without requiring citations.


