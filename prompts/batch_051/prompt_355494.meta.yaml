  in any decision problem, the expected value of receiving information, provided it
  costs nothing, can never be negative for an agent who updates her probabilities
  competently and then chooses the act with the highest expected value. The reason
  is that the agent can always, after seeing the report, choose whatever act she would
  have chosen without it; so the option of learning must be at least as good in expectation
  as remaining ignorant. If the report would change Daniel''s habits in a favorable
  direction when the risk is high and leave them unchanged when it is low, then Daniel
  is giving up an option whose expected value is nonnegative, perhaps strictly positive.


  Marcus answered that this is exactly the kind of theorem that floats free of life.
  He described a patient he had years ago who received an ambiguous result from a
  similar kind of testing, became preoccupied with it, pursued further procedures
  with real risks, and, in Marcus''s judgment, ended up worse than if he had never
  been tested. Information, Marcus said, changes people, and sometimes for the worse;
  a paper theorem about ideal agents tells us nothing about Daniel.


  Elena replied that this conflates a bad realized outcome with a bad prospect. The
  theorem, she said, is about expectation before the information arrives, not about
  how things turn out in hindsight. If the anxiety, the follow-up procedures, and
  their complications are genuine bads, then they belong in the decision setup with
  their probabilities attached; once they are included, the option may no longer be
  attractive, but that is not a counterexample to the theorem—it is the theorem working
  with a fuller specification of the choice. In Daniel''s case, she added, the report
  itself is non-invasive and free, and no one would force him to act on it.


