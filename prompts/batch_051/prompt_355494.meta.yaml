  Requirements:

  - From perspective of retired natural scientist recently gotten into philosophy.

  - Formal/polished.

  - No citations/bibliographies/reading lists.

  - Should not quote real texts (we won''t).

  - Dispute between two people other than the asker; asker a bystander, doesn''t signal
  favor.

  - A few rounds of actual back-and-forth; both sides make decent points; no strawmen.

  - Ask for a point-by-point adjudication, who is right about which specific point,
  what both are missing.


  The domain''s key content:

  - Good''s theorem: for a Bayesian expected-utility maximizer, the expected value
  of costless information is nonnegative; before seeing the data, the expectation
  over posterior optimal achievable utility is at least the prior optimal expected
  utility.

  - Conditions/assumptions: same action set after information (no strategic constraints/disclosure
  obligations); preferences/payoffs unaffected by the information itself; rational
  updating (conditionalization); optimal action choice; maybe no computation costs.

  - Failure modes: direct psychic/hedonic costs of knowledge; dynamic inconsistency
  / inability to act optimally; strategic contexts where others'' knowledge changes
  (signaling) or action sets shrink; information can make a real agent worse off ex
  ante if update/act suboptimally.


  The disagreement could run through a concrete running example while also exchanging
  general claims. I''ll use a medical example because the retired scientist persona
  could plausibly hear this from a statistician and a physician; but I want to avoid
  a specific real disease with controversial screening facts if possible, or at least
  keep it stylized and generic.


