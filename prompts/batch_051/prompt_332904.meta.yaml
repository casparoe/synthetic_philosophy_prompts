  I think the most compelling, formal, polished prompt is:


  Domain: Population size and average vs. total value in ordinary moral thinking.

  Slogan: "The more the merrier."

  Context: A city council / housing plan discussion. Someone uses the proverb to support
  allowing a development that would both add thousands of residents and modestly reduce
  average well-being (crowding, longer commutes, etc.). Another person says this is
  "quality over quantity" or "averages are what people actually live." The asker wants
  the proverb disambiguated.


  Precise claims could include:

  1. A group/gathering is pleasanter when larger (allowing more people to join improves
  the event, holding each person''s experience fixed). Trivial sometimes, false at
  scale.

  2. Additional members with positive well-being make the world better in total (a
  total-value claim).

  3. Additional members make things better only if they don''t lower the average (a
  Pareto/quality claim).

  4. A population''s value is measured by the sum of individual well-being (totalism),
  and "merrier" means each new person meets a threshold above zero.

  5. The value of a city/community is not reducible to average or total individual
  welfare but includes diversity, vitality, choice—so "merrier" is a claim about social
  dynamics.

  6. A policy/plan should be evaluated by the well-being of all affected, present
  and future, and more worthwhile lives always counts for something (person-affecting
  vs impersonal).

  7. The claim may be merely a tie-breaker: where average would be unchanged, prefer
  more.

  8. Maybe "merrier" is a predicate on each added person, so the slogan says: if the
  additional people would be happy, it is better; this leaves open vs. existing residents.


  And ask which reading supports the development and which reading actually matters
  morally. The asker should note the important reading is the one the argument needed:
  "from the fact that there would be more people living worthwhile lives, to the conclusion
  that the council should approve the plan."


