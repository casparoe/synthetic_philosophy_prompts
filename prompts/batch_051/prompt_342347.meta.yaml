  Idea: A novelist is writing a character who is chronically late and wants the character
  to defend himself with a serious argument. The prompt presents the character''s
  argument and asks if it goes through.


  Argument:

  (1) If you tell someone you''ll meet them at 3, and you arrive at 3:15, you haven''t
  failed to do anything they reasonably relied on, because no reasonable person builds
  their schedule on a friend arriving at the exact minute.

  (2) What you owe someone when you make a promise is to protect them from the harm
  of relying on you, not to make a particular proposition true.

  (3) So being late breaks a promise only if the lateness causes actual harm through
  reasonable reliance.

  (4) A friend who waits 15 minutes is not ''harmed'' in any sense but mild annoyance;
  and annoyance at a friend''s lateness, if you know they''re habitually late, is
  unreasonable reliance.

  (5) So chronically late people rarely break a promise, and the right response is
  to adjust your expectations, not resent them.


