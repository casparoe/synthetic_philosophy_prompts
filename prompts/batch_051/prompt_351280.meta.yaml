  Let''s write a more sophisticated version:


  At a reading group, the discussion settled on four sentences:

  (a) Sherlock Holmes is a detective.

  (b) In the stories, Sherlock Holmes is a detective.

  (c) Sherlock Holmes was created by Arthur Conan Doyle.

  (d) Sherlock Holmes does not exist.


  The two members argued:


  1. Tamara: (a) is false (or lacks truth-value) because "Sherlock Holmes" is an empty
  name; nothing in the world answers to it, so you can''t truthfully predicate being
  a detective of Holmes.

  2. Apollo: But (b) is plainly true. The only natural reading of (a) is as shorthand
  for (b). So (a) is true, not false — just true in a licensed ellipsis.

  3. Tamara: That move gives us no stable subject. If (a) is just (b) by omission,
  then (c) too should be read as elliptical for (b)? But (c) isn''t part of the stories
  — being created by Conan Doyle is something true of Holmes from outside. Yet (c)
  is true and (d) is true, so "Holmes" cannot be empty in all contexts. The ellipsis
  story collapses.

  4. Apollo: It doesn''t collapse: there are two domains of discourse, or two operators.
  Inside the story-operator the name denotes the character; outside, the name denotes
  an abstract artifact. The artifact is not a detective, but the character is. There''s
