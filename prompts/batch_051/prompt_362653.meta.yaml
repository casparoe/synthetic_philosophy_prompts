  ---


  P. F. Strawson argued that our practices of holding one another responsible rest
  on a family of reactive attitudes — resentment, indignation, guilt, gratitude, forgiveness
  — rather than on a settled theoretical judgment about free will. On his account,
  to feel resentment toward someone who has wronged you, or gratitude toward someone
  who has helped you, is already to participate in a practice in which persons confront
  one another as fellow agents; by contrast, in the objective stance one suspends
  these attitudes and treats a person as something to be managed, diagnosed, or avoided.
  Strawson also distinguishes first-personal reactive attitudes (resentment, gratitude),
  vicarious ones (indignation on behalf of a third party), and self-directed ones
  (guilt, remorse, shame). I want to run a counterfactual through that machinery to
  see which parts of the practice of responsibility actually depend on which attitudes.


  Imagine a society of a few hundred thousand people in which every child, from birth,
  receives a drug that has one precise effect: it eliminates the first-personal reactive
  attitudes — the felt sense of being personally wronged, resentment toward the one
  who wronged you, gratitude toward the one who benefited you, and the distinctive
  softening that comes with reconciliation — while leaving everything else intact.
  People retain ordinary non-reactive emotions such as fear, sadness, joy, disgust,
  sympathy, and affection; they retain full cognitive capacities, including the ability
  to judge that an act was wrong, that someone violated a norm, that someone caused
  harm, and that someone deserves censure or thanks. They also retain the vicarious
  and self-directed reactive attitudes: they can be genuinely indignant when a third
  party is wronged, and they can feel guilt and remorse for their own misconduct.
  But no one in this society has ever once felt personally wronged, personally grateful,
  or resentful in the second-personal sense. If you hurt them, they may regret that
  a harm occurred and may regard you as dangerous to others; they do not feel that
  you wronged them, and they feel no resentment toward you. If you help them at real
  cost to yourself, they register the benefit and may judge you praiseworthy; they
  feel no gratitude.


  Suppose the society keeps its inherited vocabulary and institutions — its members
  still say that actions are wrong, still demand apologies, still praise, blame, punish,
  and protest. Over the next three generations, predict what happens to four domains:
  apologies and forgiveness; friendship and intimate relationships; criminal law and
  punishment; and social movements and moral protest, which characteristically run
  on third parties adopting indignation on behalf of victims.


  I want a chain of reasoning about mechanisms rather than a story. Which of your
  predictions are robust across plausible assumptions about human psychology, and
  which hinge on testable claims — for instance, about whether guilt is internally
  generated or depends on reading another person''s resentment, about whether vicarious
  indignation can motivate as reliably as first-personal resentment, or about whether
  gratitude does relational work that approval plus affection cannot? Where does a
  Strawsonian expect collapse, and where only transformation or reinvention? Finally,
  what would have to be true about human beings for your most confident prediction
  to fail?


