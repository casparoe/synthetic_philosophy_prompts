  Possible subtle flaws:

  - The step from "(M,M) is an equilibrium" to "rational players will play M" requires
  equilibrium selection (payoff dominance) which is not mandatory; (D,D) remains an
  equilibrium and is safer under uncertainty about the opponent''s code (e.g., what
  if the opponent''s program has a bug or a different representation).

  - The step from program game to ordinary PD ignores the difference between commitment
  and prediction: in the program game, a player chooses a program and the opponent''s
  action causally depends on that choice; in the ordinary PD, the opponent''s action
  is causally independent of one''s own choice (simultaneous, no causal influence).
  Transparency (the opponent can condition on your program) changes the causal structure:
  your program choice causes the opponent''s action. In a standard PD, your action
  does not cause the opponent''s action. So the argument equivocates between "opponent
  can condition on my code" and "opponent can merely predict my code." Program equilibrium
  concerns conditionals/counterfactuals: If I had submitted D, M would have defected.
  In the ordinary PD, if I unilaterally defect, the opponent''s cooperation is already
  fixed.

  - Also, the "retaliation against deviation" in program equilibrium works only because
  the opponent''s program causally depends on your program. In ordinary simultaneous
  play, each action is chosen independently; even if your decision procedure is predictable,
  the opponent does not get to condition on it in the way M does unless they have
  your actual code before acting.


