  Program equilibrium (Tennenholtz 2004): A "program equilibrium" of a game is a profile
  of programs such that no agent can improve by submitting a different program, given
  the program of the other agent (which is observable). In the PD, there is a program
  equilibrium where both submit "cooperate if the other program cooperates? " Actually
  consider the program P: "If the other program is P, then cooperate; otherwise defect."
  If both submit P, each sees the other is P and cooperates. If one deviates to Q,
  the other (P) sees Q is not P and defects; then Q, facing P? Q knows P defects,
  so Q''s best is to defect; Q gets defect-defect. If Q is a program that cooperates
  against P anyway, Q gets sucker''s payoff, worse. So deviation not profitable. Thus
  both submitting P is an equilibrium with mutual cooperation. There are also defect
  equilibria: program D: "always defect" — if both submit D, no deviation profitable?
  If one submits a program that... D defects regardless, so best response is defect;
  yes DD is a program equilibrium. So multiple equilibria, including cooperative and
  defective.


