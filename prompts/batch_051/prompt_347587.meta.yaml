  I''ve been working through an argument in a decision-theory reading group, and it
  appears to prove something I find very hard to accept: that in an ordinary one-shot
  Prisoner''s Dilemma, cooperating, rather than defecting, is rationally mandatory
  after all. I want to know which step to reject and what rejecting it costs.


  Here is the argument. Suppose two players play a one-shot Prisoner''s Dilemma with
  payoffs T > R > P > S, where T is the temptation for unilateral defection, R the
  reward for mutual cooperation, P the punishment for mutual defection, and S the
  sucker payoff. In a standard simultaneous PD, defection strictly dominates cooperation
  and is therefore the uniquely rational act.


  Now modify the game in only one respect. Instead of choosing an action directly,
  each player writes a program: a deterministic function that receives the other player''s
  program as input and returns Cooperate or Defect. Each player''s program is then
  run against the other''s, both programs are common knowledge, and the resulting
  actions fix the payoffs in the usual way. Call this the program game; a Nash equilibrium
  of it is a program equilibrium.


  Define a program Clique as follows: when given the opponent''s program as input,
  Clique cooperates if the opponent''s program is Clique itself, and defects otherwise.
  The argument then runs:


  (1) If both players submit Clique, each receives R, because each cooperates against
  the other.


  (2) If one player deviates unilaterally from Clique while the other continues to
  submit Clique, the other''s Clique defects, so the deviator can obtain at most P.


  (3) Since P < R, no unilateral deviation from Clique is profitable; the pair (Clique,
  Clique) is therefore a Nash equilibrium of the program game.


  (4) Moreover, (Clique, Clique) yields the highest payoff of any Nash equilibrium;
  in particular it payoff-dominates the mutual-defection equilibrium. Given common
  knowledge of the game and the players'' rationality, the two players should coordinate
  on the payoff-dominant equilibrium and both cooperate.


  (5) But an ordinary one-shot PD is just a program game in which the programs are
  implemented in wetware rather than code and cannot literally be inspected before
  the choice is made. Human decision procedures are still deterministic functions
  in the relevant sense, and an ideal reasoner would still have a well-defined best
  response to whatever procedure the other is running.


  (6) Whether the other player can read my program before acting cannot change what
  it is rational for me to choose: the options Cooperate and Defect, and the payoffs
  they yield, are the same either way.


  (7) Therefore, if cooperation is rationally selected in the program game, cooperation
  is rationally selected in the ordinary one-shot PD.


  (8) But that conclusion flatly contradicts the dominance argument: in the ordinary
  one-shot PD, defection strictly dominates cooperation and cannot be rationally worse.


  So the argument seems to show that standard game-theoretic reasoning about the Prisoner''s
  Dilemma is a mistake, or that there is no real difference between transparent and
  opaque decisions. I am reluctant to give up (6), since a principle of rationality
  ought not depend on what other agents happen to be able to observe. Which step should
  I reject, and what does rejecting it cost? If I keep (6), what must I pay elsewhere?


