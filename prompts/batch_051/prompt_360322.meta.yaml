  Two-dimensional semantics (Chalmers/Jackson) distinguishes two ways a statement''s
  truth depends on worlds:

  - Primary intension: consider a world w as actual (how things would be if w turned
  out to be the actual world); the extension at w determined by considering w as actual.
  It captures a priori/implicit meaning, cognitive significance.

  - Secondary intension: consider w as counterfactual, holding fixed the actual world''s
  reference-fixing facts; the extension at w given how things actually are. It captures
  what the expression picks out in counterfactual worlds after reference is fixed.


  Lexical vs dynamic scoping in programming:

  - Lexical (static) scoping: a variable reference is resolved using the environment
  where the function is defined.

  - Dynamic scoping: resolved using the environment where the function is called (the
  current runtime context).

