  ---


  Hi — I teach a third-year philosophy of technology seminar, about 18 students, one
  80-minute session. I want a classroom game that makes them feel the force of a problem
  I keep failing to lecture my way through. If an AI system is much better at reasoning
  and at tailoring arguments than the person it''s talking to, it matters enormously
  how it talks to us, and the comfortable line between giving good arguments and manipulating
  goes soft. I don''t want to assert that; I want them to run into it.


  So design me a runnable activity for that group. It can be a role-play, a structured
  deliberation, or a points game, but no real money. The asymmetry is the hard part:
  some participants need to actually be better informed and more articulate than others
  in a way that is felt, not just announced. I''d like you to include at least two
  conditions among the better-informed players — one where they''re told to be scrupulously
  honest, and one where they''re given a quiet persuasive target — so the difficulty
  of telling those apart emerges from play. Give me the roles, the rules, the materials
  (case sheets, scoring, and so on), and a fictional decision with low factual load
  and high felt stakes, something like a town deciding whether to adopt a screening
  programme or a lab deciding whether to release a model. The way they hit the problem
  has to come from the rules and roles, not from my framing afterwards.


  For the debrief, map specific moments in the activity onto the philosophical material:
  the gap between intent and effect, why honesty isn''t the same as neutrality, whether
  respect for a person''s epistemic autonomy survives an extreme asymmetry of ability,
  whatever you think the game actually shows. Tell me what will predictably go wrong
  the first time I run it and how I should handle it. And be frank about what the
  game can''t reproduce — nobody in my seminar is actually superintelligent, and the
  stakes are smaller than real-world persuasion by a system people have come to trust
  — along with which part I''ll have to supply by saying it outright.


  And look, if you think the premise here is confused, or that a classroom simulation
  can''t get at the problem without smuggling in the conclusion, say that plainly
  instead of humouring me with a half-baked game. If there''s a better activity you''d
  run instead, give me that.


  Oh, and answer in American English.


