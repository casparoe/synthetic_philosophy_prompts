  would have paid, it would have given you $10,000... Actually the standard CM: a
  predictor tells you that it predicted your behavior in a counterfactual situation:
  if the coin had come up heads, it would have asked you for $100, and if you would
  have given the $100, it would have paid you $10,000; the coin came up tails, you
  can walk away, but the predictor asks you to pay $100 now "for nothing." Expected
  utility accounting: if you''re the kind of person who pays in the counterfactual,
