  self-locating uncertainty approach (Sebens & Carroll) uses epistemic separability
  etc. Branch-counting fails.


  A realistic belief set for a rationalist:

  1. I think the wavefunction is the whole story; once you accept unitary-only QM,
  MWI is basically forced (collapse is an ad hoc extra).

  2. I think probabilities in MWI should be understood as rational credences of a
  pre-measurement agent, not as frequencies over worlds.

  3. I''m sympathetic to the Deutsch–Wallace decision-theoretic approach: the Born
  rule falls out of decision theory plus the symmetries of the wavefunction (envariance/equivalence),
  not from any extra physical postulate.

  4. But I also think self-locating uncertainty is ineliminable: before measurement
  you genuinely don''t know which branch you''ll be in, so you need an indifference
  principle over branches.

  5. I think naive branch counting is obviously wrong because the number of branches
  isn''t well-defined (decoherence gives no sharp count) and amplitudes carry the
  weights.

  6. I''m also inclined to think that credences in MWI should track objective features
  of the wavefunction, not just pragmatic betting odds, because I don''t want the
  Born rule to be merely a decision-theoretic artefact.

  7. Maybe: I find envariance convincing for getting equal amplitudes, but I worry
  that extending from equal to unequal amplitudes smuggles in something.


