  I have been trying to settle a question about quantum mechanics, and I keep getting
  stuck on a more basic word: real. On one side, people seem to treat the wavefunction
  — the mathematical object that specifies the state of an electron — as a genuine
  feature of the world. On the other side, people treat it as a bookkeeping device,
  more like a weather forecast than a storm: something that sums up an observer''s
  knowledge and makes predictions, but is not itself out there. Before I can make
  up my mind about the wavefunction, I think I need a working definition of "physically
  real."


  Here is my list of test cases. I am confident that a baseball is physically real.
  I am also confident that the center of mass of a spinning dumbbell is not: it is
  a useful abstraction, and in a U-shaped object it sits in empty air rather than
  in the object. I have no firm view about the rest, though I lean toward saying the
  electromagnetic field is real and a rainbow is not, and I cannot find a criterion
  that separates those two without doing damage elsewhere.


  1. A baseball.

  2. A rainbow.

  3. A shadow on a wall.

  4. The center of mass of a spinning dumbbell.

  5. The electromagnetic field around a magnet.

