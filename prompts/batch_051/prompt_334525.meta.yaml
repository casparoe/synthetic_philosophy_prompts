  1. A baseball.

  2. A rainbow.

  3. A shadow on a wall.

  4. The center of mass of a spinning dumbbell.

  5. The electromagnetic field around a magnet.

  6. A law of nature, like the inverse-square law of gravitation.

  7. The Maxwell–Boltzmann distribution of speeds in a hot gas.

  8. The wavefunction of a single electron in an atom.


