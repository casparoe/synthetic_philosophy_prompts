  Need to identify subtle mistakes:

  - "Because I cannot doubt that I think without thereby thinking" — okay.

  - "From this he concludes that he is a thinking substance, distinct from the body"
  — in the Second Meditation, Descartes says he is "a thing that thinks" but he does
  not yet conclude he is a thinking substance distinct from body? Actually he does
  say "sum res cogitans" — "I am a thinking thing." But is "thing" = substance? In
  the Second Meditation he notes that he cannot yet establish that the "I" is not
  something bodily; the meditator says the "I" is whatever thinks, but "it is not
  yet entirely clear what this I is." Actually Descartes'' claim "sum res cogitans"
  is often translated "I am a thinking thing." Whether this means substance is debated;
  he says "I am a thing that thinks, that is to say, that doubts, affirms, denies..."
  The "thing" here is substantive enough, but the conclusion that it is an immaterial
  substance distinct from body is drawn more fully in the Sixth Meditation. The student
  claims "distinct from the body" at the cogito stage — that''s a subtle overreach.
  Descartes expressly says in Med II that the fact that I am a thinking thing does
  not yet prove what this ''I'' is or that it isn''t "some thin vapor" etc. So mistake
  #1: cogito alone doesn''t establish immateriality or distinction from body; that
  requires the argument for the real distinction via clear and distinct ideas (Med
  VI). The student partly corrects by saying God is needed to secure clear and distinct
  ideas, but then misassigns: Med VI. Also, "the idea of myself as a thinking substance
  is clear and distinct, so my existence as a thinking substance is secured" — Descartes
  does hold that my clear and distinct idea is of myself as a thinking, non-extended
  thing; but the student might be conflating "indubitable existence as thinking thing"
  with "existence as immaterial substance." Subtle.


