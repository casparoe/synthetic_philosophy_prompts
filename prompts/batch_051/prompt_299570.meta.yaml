  Draft:


  "I''m taking an intro EU politics class and the textbook opens its chapter on the
  democratic deficit with a summary that sounds off to me but I can''t pinpoint why.
  It goes roughly like this: ''The EU is not a state; it''s an intergovernmental organization
  whose member states have pooled a bit of sovereignty. The EU itself has no sovereignty,
  since only the member states can change its powers by treaty. The EU''s real problem
  is its democratic deficit. The European Commission is unelected, but it has a monopoly
  on proposing laws, which means legislation is effectively made by unelected officials
  in Brussels. The Parliament is directly elected but toothless: it cannot propose
  legislation and cannot force the Commission to resign. Voters therefore have no
  way of throwing the people who make EU law out of office, and that is why further
  integration would make things worse.''"


  Then ask: "How fair is that as an account? Go sentence by sentence and tell me what
  my lecturer would nod at, where it''s misleading, and what''s just wrong. Does the
  anti-integration conclusion follow from the accurate parts? Also, is the bit about
  the EU having no sovereignty right, or is that contested?"


