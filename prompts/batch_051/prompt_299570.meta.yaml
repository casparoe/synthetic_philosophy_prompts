  Summary of an op-ed or textbook:

  "My EU politics textbook says something like: ''The European Union is best understood
  as an intergovernmental organization, not a state. Its member states have pooled
  some sovereignty, but the EU itself has no sovereignty because it cannot change
  its own powers — only the member states can, through treaties. The real problem
  is the democratic deficit: the European Commission is unelected, yet it has the
  monopoly on proposing legislation, so laws are effectively made by unelected bureaucrats
  in Brussels. The European Parliament is directly elected but is too weak to fix
  this because it can''t propose legislation and can''t force the Commission to resign.
  Ordinary citizens have no way to throw the people who make EU law out of office,
  and that is why the EU should not integrate further.''"


  Then ask: How much of this is fair? Go sentence by sentence, what an EU scholar
  would accept, wince at, what''s wrong. This has subtle errors:

  - "intergovernmental organization" oversimplifies: EU is sui generis, has supranational
  elements.

  - "Commission is unelected" — the Commission President is proposed by European Council
  and elected by Parliament; the Commission as a whole is approved by Parliament,
  so "unelected" in the sense of no direct electoral mandate, but not simply appointed;
  Parliament can force Commission to resign (motion of censure, Art 234 TFEU). The
  summary claims Parliament can''t force the Commission to resign — that''s wrong.

  - "monopoly on proposing legislation" — Commission has near-monopoly of legislative
  initiative in most areas, but not all (member states in CFSP/justice? Also Parliament
  can request proposals). Mostly true but maybe needs nuance.

  - "member states have only pooled some sovereignty; EU has no sovereignty because
  it cannot change its own powers" — competence-competence point; debatable: EU has
  pooled/transferred powers, direct effect, primacy; but no Kompetenz-Kompetenz. Could
  be fair-d/winced-at.

  - "Citizens have no way to throw out the people who make EU law" — they can vote
  in European Parliament elections and national elections that determine Council/European
  Council members; but no direct election of Commission; Spitzenkandidat. This is
  partly wrong.

  - "that is why the EU should not integrate further" — normative conclusion not entailed.


