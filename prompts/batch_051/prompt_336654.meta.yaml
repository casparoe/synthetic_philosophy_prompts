  Draft:


  "I am a retired chemical engineer who came to philosophy late, and I have been working
  through the literature on causation by omission—whether an absence can be a cause,
  and what work the distinction between doing and allowing is doing in ordinary causal
  judgment. A draft bill in my state has brought the two interests together, and I
  would like you to analyze it as a mechanism rather than as a moral position.


  The bill creates a limited civil Good Samaritan liability. Its core: whenever a
  person suffers serious bodily injury, and a preponderance of the evidence shows
  that an identified adult bystander could have prevented the injury at a direct out-of-pocket
  or time cost no greater than the lesser of $400 and 8 percent of the bystander''s
  monthly income, without substantial physical risk to themselves and without violating
  any duty they owed to someone else, that bystander is liable to the injured person
  for 20 percent of economic damages. The bystander''s failure to act is, by statute,
  deemed a cause of the injury for purposes of this liability; no prior relationship,
  professional role, or pre-existing legal duty is required. There is no criminal
  penalty. Insurers may sell optional first-party policies covering this liability,
  with premiums keyed to an audited ''bystander exposure score'' based on the insured''s
  address, occupation, and training. A state board publishes quarterly, anonymized
  case summaries used as guidance by small-claims and civil judges.


  I want to know how this institution would actually behave. Please use the following
  sections, in this order:

  1. Intended logic (one paragraph): what behavior the drafters are trying to produce,
  and which commitments about the metaphysics and ethics of omissions are built into
  the statutory language.

  2. Direct incentives (two paragraphs): who becomes more likely to act, who becomes
  more cautious about being in a position to act, and how the income-indexed threshold
  alters behavior at different points in the income distribution.

  3. Gaming and avoidance (two paragraphs): strategic ignorance of risk, deliberate
  failure to acquire or maintain aiding skills, positioning so that someone else is
  the best-positioned bystander, collusion among witnesses, and nuisance or retaliatory
  claims.

  4. Second-order effects (one to two paragraphs): emergence of a market for omission-liability
  insurance, effects on social trust and on simple everyday helping, and what the
  published anonymized case summaries do to public knowledge of the rule and to litigation
  strategy.

  5. Where the metaphysics leaks in (one paragraph): where the statute''s stipulation
  that qualifying omissions ''count as causes'' does and does not settle the philosophical
  question whether omissions are genuinely causes, and which disputes about causation
  by omission would resurface in doctrine.

  6. Defects and whether they are fixable (two paragraphs): which failure modes can
  be repaired by adjusting the cost threshold, the damages fraction, the insurance
  provisions, or the evidentiary standard, and which are intrinsic to any liability
  rule built on counterfactual prevention.

  7. Bottom line (one paragraph): the single most important consequence of the bill
  and whether, on the whole, it selects for rescue or for something else."


