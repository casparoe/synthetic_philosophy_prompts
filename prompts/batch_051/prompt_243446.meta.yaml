  B (skeptic): But autonomy is a capacity of persons, and the person now in front
  of us is not the same person who wrote the directive in any morally relevant sense.
  She no longer has the memories, projects, or values that made that decision hers.
  A person''s authority over their future is usually justified by continuity — the
