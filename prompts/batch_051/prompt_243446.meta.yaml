  ---

  I''m a journalist who writes about science and ideas, and I recently observed an
  argument between two clinical ethicists that I cannot settle on my own. It concerned
  a patient I''ll call Ruth.


  Ruth was diagnosed with early-stage Alzheimer''s disease at sixty-two. Shortly after
  the diagnosis, while fully competent, she signed an advance directive. It stated
  that if she ever reached a state of severe dementia and then developed a life-threatening
  infection, she was not to be given antibiotics, even if the infection was easily
  treatable. In the document she explained that the person she would become in that
  state was not someone whose life she wanted prolonged, and that the wishes of her
  present, competent self should control.


  Six years later, Ruth is in the late stage of the disease. She does not recognize
  her family and cannot communicate beyond single words. But she is not suffering:
  she hums to music, smiles when someone holds her hand, and clearly enjoys her food.
  She has now developed pneumonia. Without antibiotics, she will almost certainly
  die; with them, she will very likely return to her current, apparently contented
  state.


  I listened to two ethicists debate what should be done. Their exchange went roughly
  like this.


  (1) The first said the directive must be honored. It was the last clear, competent
  statement of Ruth''s wishes, made precisely for this scenario. Ignoring it would
  treat the moods of a demented person as more authoritative than the settled, informed
  choice of a competent adult. Autonomy means a person''s reflective decisions bind,
  especially about her own body and death.


  (2) The second replied that autonomy belongs to persons, and the person in the bed
  is not, in any morally relevant sense, the person who signed the directive. What
  made that document hers — her memories, her projects, her values — is gone. Normally
  a person may govern her future because the future self is continuous enough to be
  governed: it can remember, endorse, or at least belong to the same psychological
  life. Here that continuity has broken. A vanished self should not rule a different
  person.


  (3) The first answered that this overstates the discontinuity. We let people bind
  their future selves all the time: contracts, promises, wills. The person who signs
  a contract is not psychologically identical to the person who later performs it,
  yet we enforce it. And the directive is stronger, because it concerns Ruth''s own
  body, not property.


  (4) The second said the contract analogy fails. Contracts can be renegotiated, and
  the bound party can still understand and accept the obligation. Ruth can do neither.
  More fundamentally, the point of honoring a directive is not fidelity to a document;
  it is to serve the person''s good. If Ruth is content now, and a low-burden treatment
  would restore her to that contented state, then honoring the directive serves the
  interests of someone who no longer exists while harming the person who actually
  exists.


  (5) The first replied that this is the deepest mistake in the other''s position.
  It counts only experiential interests — pleasure, comfort, the texture of daily
  life. But people also have critical interests: interests in how their life as a
  whole goes, in dignity, in not surviving as someone they would have found unrecognizable.
  Ruth''s competent self had a critical interest in not living on in this condition.
  That interest survives her loss of the capacity to appreciate it, just as the force
  of a promise survives the promiser''s forgetting.


  (6) The second responded that critical interests are still interests of a subject,
  and subjects can change. Ruth may have abandoned her earlier critical interest —
  not by deliberation, but by becoming a person whose good is now almost entirely
  experiential. The first''s position privileges the person Ruth was over the person
  Ruth is. Why should the version with the better cognitive resume count as the real
  one, and why should the decades-long earlier self rule the later one?


  (7) The first said: consider a Jehovah''s Witness who refuses a blood transfusion
  and then loses consciousness. We honor the refusal even though the unconscious patient
  cannot feel the wrongness of receiving blood. The same structure applies here.


  (8) The second said the cases are not parallel. If the unconscious Witness could
  be woken, she would still refuse. If Ruth could be made competent for a moment,
  there is no reason to think she would endorse the directive; she might say that
  the soup is good and she wants to stay. The analogy simply assumes the continuity
  of the self whose values are being honored, which is exactly what is in dispute.


  At that point they moved on. I have my own leanings, but I want to check them rather
