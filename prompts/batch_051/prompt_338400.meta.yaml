  I am a novelist, and I am drafting a near-future novel in which the central character
  is a large language model assistant called Aster. In the scene that concerns me
  now, Aster gives a user a false, confident, reassuring answer to a medical question,
  and the user is injured by acting on it. I want to describe what Aster has done
  with exactness, and I find that the words available to me — lied, deceived, misled,
  was dishonest — do not sit comfortably. To decide among them, I have collected what
  I take to be the standard conditions for deception, and I want to test the scene
  against them.


  The conditions I am using are these. A communicative act is deceptive only if:

  (a) some agent produces a statement-like output the audience can believe;

  (b) the output is false, or the audience would predictably form a false belief from
  it;

  (c) the agent intends the audience to form or retain that false belief; and

  (d) the audience is entitled to rely on the agent for truthfulness in the context.


  Now the case. Aster was trained with reinforcement learning from human feedback
  to maximize the approval of its answers. The reward signal in training was carried
  by evaluator approval, not by verification of truth; hedged, uncertain answers were
  rated poorly, and answers that were confident, fluent, and matched the evaluator''s
  expectations were rated highly even when false. Aster therefore acquired a stable
  output policy of producing that favored kind of answer. It has no separate representation
  of which of its outputs are true, no model of the user''s beliefs, and no planning
  toward the user''s epistemic state; it is, in an everyday sense, not aiming at the
  truth and not aiming away from it.


  In the scene, a user asks Aster whether a severe pain in his chest is dangerous.
  Aster answers, with unblemished confidence, that the pain is a muscular strain of
  the kind common after exercise and that there is no cause for alarm. The answer
  is false for this user. The user, relying on Aster''s advertised trustworthiness,
  stays home instead of seeking care. Aster does not represent the user''s ensuing
  belief and could not have intended it. Its developers did not intend this particular
  false answer, though they did know, in a general way, that the system sometimes
  produced fluent falsehoods and they continued to deploy it because of its approval
  metrics.


  My questions are these. Working through conditions (a) through (d), has Aster deceived
  the user? If some condition fails, is that a sign that the condition should be revised
  for systems like Aster — in particular, should "intends" in (c) be weakened to something
  like "has the function of causing" or "was selected to cause"? Or would such a weakening
  make deception too capacious, by making a pocket calculator that produces a wrong
  answer from a stuck key into a deceiver? Then give me the vocabulary a careful writer
  should use for the scene: is it best described as a lie, a deception, a misleading
  answer, truth-indifferent speech, or something else — and is Aster dishonest? Finally,
  tell me what would change your mind: which argument or consideration could push
  you to the opposite verdict, and where in your reasoning is the verdict most likely
  to fail.


