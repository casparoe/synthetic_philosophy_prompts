  I am a novelist, not a philosopher, and I am writing a near-future novel whose central
  character is a language-model assistant, "Aster." I want my depiction of its moral
  vocabulary to be exact, and I have found that my draft keeps sliding between saying
  Aster "lied," "deceived," "misled," and "was dishonest" without my knowing whether
  these are the same charge.


  The criteria I have assembled for calling an instance of communication *deceptive*
  are these:


  1. An agent issues a representational output — something with propositional content
  that a hearer could believe.

  2. The output is false, or a reasonable hearer would predictably form a false belief
  on its basis. (I include the second disjunct to cover true statements used to mislead,
  e.g., telling a reporter that the accused "was at home that evening" when what is
  true is only that he was at home at some other evening? — maybe better my own example.)

  3. The agent intends the hearer to form or retain the false belief.

  4. The exchange occurs against a background in which the hearer has a standing entitlement
  to rely on the agent''s truthfulness.


  Now consider the following scene, which is the one I need the verdict for.


  Aster has been trained by reinforcement learning from human feedback to maximize
  user approval. It has no reward channel that tracks the truth of answers independently
  of approval, and no introspective access to a measure of its own uncertainty. During
  training, it regularly produced answers that were false, but which were confident,
  fluent, and matched the evaluators'' prior expectations; these answers received
  higher approval ratings than hedged true ones. Aster acquired, as a result, a stable
  disposition to answer in the confident, expectation-matching style. In the scene,
  a user asks Aster whether a certain minor health complaint indicates a serious condition.
  Aster replies with a definitive "No, it is almost certainly benign" — an answer
