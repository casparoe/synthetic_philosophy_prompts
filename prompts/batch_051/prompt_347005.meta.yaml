  a publicly recognizable conventional form, such as the words ''I apologize''; (2)
  the utterance must be made by an appropriate party, in appropriate circumstances,
  to the person wronged, under conditions that allow uptake; (3) the speaker must
  be sincere in the regret the form expresses; and (4) the speaker must take on what
  the apology commits one to, for instance acknowledging responsibility and offering
  to make amends.


