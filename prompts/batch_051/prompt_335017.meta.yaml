  life from harmful ones, and that this requires protecting at least the early, low-cost
  stages of departure from custom. I take the epigraph Mill places at the head of
  the book, quoting Wilhelm von Humboldt''s The Sphere and Duties of Government, as
  the key to this reading:


  [passage]


  On my reading, the phrase ''development in its richest diversity'' is a requirement
  on a society''s collective deliberative resources rather than a celebration of individual
  uniqueness for its own sake, and I want to insist that Mill''s ''experiments'' metaphor
  is not rhetorical decoration but the engine of the argument.


  The audience is my seminar group: the instructor is a political philosopher who
