  The misconception: "accommodation automatically adds the presupposition" — actually
  accommodation is constrained: hearers accommodate only when doing so doesn''t already
  conflict with the score; accommodation is not automatic success, and the score only
  changes in ways that make the utterance acceptable if possible. Also, the scorekeeper
  must be able to find a suitable change; some presuppositions (false, absurd, or
  offensive) either aren''t accommodated or are accommodated via "shifty" interpretations
  (e.g., interpreting the speaker as not really presupposing but pretending). A chatbot
  that accommodates everything would, e.g., accept "The present king of France is
  bald" as presupposing there is a present king of France, adding a false proposition
  to the common ground — but common ground is supposed to be mutually accepted as
  true; you can''t "accept" a known falsehood as true just because it''s presupposed.
  That''s the correction.


