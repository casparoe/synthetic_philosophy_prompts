  (iii) someone genuinely bears the loss of being wrong, so prices work as an error
  signal. Against this, I teach Lange as saying that prices don''t need to come from
  real capital-goods markets; a central board could announce provisional prices, tell
  managers to treat them as given, and revise them by trial and error whenever shortages
  or surpluses appear. Okay. Now a student asks about a planned economy that builds
  something I''ll call PlanSage. It''s a real-time planning system that ingests data
  from every firm''s production function, every household''s purchases, every warehouse''s
  stockouts, and every worker''s job changes. Consumer goods and labor are bought
  and sold for actual money, so those prices are real market prices. But all producer
