  recognized difficulties but accepted the idea of a unit. Robbins criticized. I''d
  better avoid attributing an Edgeworth view without certainty, or describe as "psychophysical
  hedonism" without names.

  - Preference-based accounts with "extended preferences": Harsanyi: each person forms
  preferences over lotteries over both own and others'' circumstances ("extended preferences"),
  then interpersonal comparisons are defined via agreement on extended preferences;
  empathetic preferences with full information.

