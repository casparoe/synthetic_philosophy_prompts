  Art. 2, ''Whether it is becoming to pray?'', he writes: [quote]. I take him to be
  making a stronger claim than the familiar ''prayer changes you, not God'' line:
  he says prayer is one of the secondary causes God has ordered, so asking forms a
  real link in the sequence of effects. But once one grants that, it seems to leave
  open a question Aquinas doesn''t fully settle. If a petition is a divinely appointed
  secondary cause, does its specific semantic content matter, or would any act that
  fills the same causal role (a vow, a wordless act of surrender, a fixed ritual)
  do as well? And if only the specific content matters, what exactly does God''s immutability
  and omniscience allow that content to contribute? I want to turn this into a proposal
