  Let me verify no-free-lunch theorem facts: In ML/optimization, the no free lunch
  theorem (Wolpert and Macready 1997 for search/optimization; Wolpert 1996 for supervised
  learning) states that averaged over all possible problems, all algorithms perform
  equally; a learner can''t generalize better than random guessing on average without
  assuming some prior over hypothesis space. The exact statement: for supervised learning,
  any two algorithms have the same off-training-set error when averaged over all possible
  target functions, uniformly. So "no inductive bias is universally better." This
  is well-known among software engineers/ML practitioners.


  Hume''s problem of induction: no rational justification for inductive inference;
  uniformity of nature cannot be proved a priori (no contradiction in denying it)
  or empirically (circular). This is well known.


