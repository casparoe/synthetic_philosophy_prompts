  The Epicurean argument: death is nothing to us because when death is, we are not;
  so it can''t be bad. The deprivation account: death is bad because it deprives you
  of the good life you would otherwise have had. The symmetry problem (Lucretius):
  if death before birth (prenatal nonexistence) isn''t bad, why is death after life
  bad? Posthumous harm: can events after death harm you? The "experience requirement":
  something can be bad for you only if you experience it (or at least can know). Cases:


  1. Painless killing in one''s sleep at age 30 with a promising future: bad for them.
  Most say yes.


  2. Prenatal nonexistence: the time before you were born — you weren''t deprived?
  Lucretius''s symmetry: if the time before birth doesn''t concern us, why does the
  time after death? Verdict: the period before my birth isn''t bad for me, but my
  death at 30 would be. Hard to reconcile under a simple "nonexistence is bad in proportion
  to how much life it costs" view, because prenatal nonexistence also "costs" potential
  earlier existence? Actually prenatal nonexistence doesn''t deprive one of a life
  one would have had because if born earlier, one would be a different person? The
  standard response (Nagel) is that one couldn''t have been born substantially earlier
  and still be the same person, whereas one could have lived longer. So the asymmetry
  is explained via identity. But many rationalists find the identity response partial.
  Good source of tension.


  3. Reversible coma: someone in a temporary coma for a year misses a year of life
  but wakes up and continues; is the coma bad for them? Deprivation says yes (loses
  a year); but is it as bad as death? Verdict: bad but not as bad as death, maybe
  because the person continues. Need to capture why death is different from a gap
  in consciousness if both deprive.


  4. A person who dies instantly in an accident, never knowing: still bad. Supports
  deprivation/external harm despite no experience.


  5. An old person who has lived a full life and dies in their sleep at 95: perhaps
  considerably less bad, maybe not tragic; maybe "not bad for them" if no more good
  life realistically available. Deprivation can handle via amount deprived.


  6. An infant who dies at one week: very bad? Actually many think it''s bad because
  of the huge future lost, even though the infant never had plans or awareness. Deprivation
  account says yes, very bad. But do we really think an infant is harmed by death
  if never conscious of a self? Some disagree. The asker might say "bad, but in a
  different way; I hesitate." Could be a case where verdicts strain.


  7. Posthumous promise: a friend promises to publish your novel after you die, then
  doesn''t; are you harmed? Verdict: yes, something was done wrong, but "harmed"?
  Maybe the asker says "I feel the dead person was wronged, but not exactly harmed
  — the betrayal is a wrong against the person even if not a harm to their experiential
  states." Tension with experience requirement.


  8. Posthumous reputation destruction, never known: a person''s reputation is destroyed
  after they die; they never know. Verdict: maybe they''re not harmed, but there''s
  still something wrong; or maybe they are harmed as the person they actually were,
  not as a present subject. Hard.


  9. Death of a nonhuman animal? Could inject: a dog that is painlessly killed. Verdict:
  bad for the dog. Deprivation account can handle if animals have future goods. Might
  be extra.


  10. The "never existing" vs. death: If a potential child is never conceived, is
  that bad for the child? Standard view: no, because no subject. But if a child dies
  at 1 week, bad. This is the asymmetry between never existing and early death. Both
  involve no memories/plans, but one has a subject with a future. This is a nice case
  pair to show the demand for a principle.


  11. The Lucretian symmetry: Consider a person who will die tomorrow vs. the fact
  that I didn''t exist in, say, 1800. Both are times of nonexistence adjacent? Hmm.


  12. Terminal sedation / removing life support? Too medical.


