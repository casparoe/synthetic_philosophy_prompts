  Prompt structure:


  - Opening: I''m trying to reconstruct my view on whether death is bad for the one
  who dies, starting from cases rather than a theory I already trust. I''ve long defaulted
  to a deprivation view (death is bad insofar as it deprives you of the life you would
  otherwise have had), but I keep hitting cases where it gives the wrong verdict or
  no verdict.


  - Cases with verdicts:


  1. A 30-year-old is killed painlessly in their sleep; they had a good life and every
  reason to expect decades more. Verdict: clearly and severely bad for them, even
  though they never experienced the loss.


  2. The same person, but instead of being killed, they die instantly and painlessly
  in an accident, never seeing it coming. Verdict: equally bad. So lack of awareness
  changes nothing.


  3. An infant dies painlessly at one week old. Verdict: terrible, though the infant
  had no plans or understanding. Badness seems to reside in the whole life that was
  prevented, not in anything the infant experienced or wanted.


  4. The eons before my birth. Verdict: not a misfortune for me at all — I don''t
  regret that I wasn''t born in 1800. This is the Lucretian symmetry problem: if pre-natal
  nonexistence is nothing to me, why isn''t post-death nonexistence also nothing?
  This is where my deprivation view starts to creak.


  5. A person is in a reversible coma for two years (no awareness, full recovery,
  then lives on). Verdict: bad for them, but far less bad than death would have been
  — even though both involve losing two years of conscious life. Maybe because the
  person continues? I can''t state why.


  6. A friend promises to publish your manuscript after you die, then doesn''t. Verdict:
  you have been wronged — I''m confident about that — but I hesitate to say harmed.
  If I force myself: there''s a real sense in which your interests as a person were
  set back, but no sense in which something bad happened to you as a present subject.
  I keep going back and forth.


  7. A stranger (not your friend) vandalizes your grave / writes a false and damaging
  biography of you after your death that no one who knew you believes? Hmm, more detail
  needed. A widely read, false biography that destroys your posthumous reputation;
  you have no surviving friends or family to be hurt. Verdict: not bad for you — or
  at most a very different kind of wrong from (1). But I can''t say why the posthumous
  promise feels like it touches you and the false biography doesn''t, if both concern
  facts about you after your death.


  Actually, maybe better: posthumous reputation destruction does harm the dead? Many
  think yes (Feinberg). The asker could be uncertain. Let''s make the asker''s verdict:
  "less clearly." The pair of posthumous cases: a promise made to you and broken after
  death (wrong to you, maybe harm), vs. a false biography that blackens your reputation
