  Background: Sorites paradox.


  Epistemicism (Timothy Williamson): vague predicates have sharp boundaries but we
  are necessarily ignorant of them. The sorites major premise is false; there is a
  sharp cutoff between heap and non-heap; we cannot know where. Vagueness = ignorance.
  Supervaluationism (Kit Fine, Rosanna Keefe): vague predicates are semantically indecisive;
  there are multiple admissible ways to make them precise (precisifications). A sentence
  is true iff true on all admissible precisifications, false iff false on all; otherwise
  neither true nor false. Logical truths/classical validities preserved; LEM valid
  but bivalence fails; borderline "P" gappy while "P or not P" true. The major premise
  is superfalse because every precisification has a cutoff. Existential "there is
  a boundary" supertrue though no witness.


