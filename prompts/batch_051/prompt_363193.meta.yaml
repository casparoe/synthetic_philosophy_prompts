  n grains are a heap, then n-1 is a heap" must be false, because the argument is
  valid and the conclusion absurd. But rejecting it commits us to a sharp cutoff.
  We cannot identify it, but that''s just ignorance. Vagueness is a gap in knowledge,
  not in the world or meaning. There is nothing in our concept of "heap" that precludes
  a boundary merely because we cannot know it. (Good point: the logic pushes to sharp
  boundary; epistemic modesty about identifying the cutoff.)


