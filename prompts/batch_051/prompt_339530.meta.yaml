  Prompt draft:


  "Here is a structural parallel I keep noticing and cannot decide whether it is real.
  In one corner is a puzzle I''ve come across about rules and meaning. Suppose I have
  used the word ''plus'' many times in my life, but only on numbers below some bound,
  say 100. The ordinary meaning of ''plus'' fixes that 101 + 102 is 203. But consider
  a different rule that agrees with addition on every pair of numbers I have ever
  actually added, and then diverges for pairs both above the bound — it hands back,
  say, 5. All my past uses are equally consistent with both rules, since I have never
  dealt with a pair above the bound. Nothing in my history of usage seems to pick
  out one rule over the other. Yet I am completely sure that I meant addition all
  along, and that the other rule is not what I meant.


  In the other corner is something I deal with at work: a model is trained on a finite
  set of examples, and if the space of possible functions is rich enough, infinitely
  many of them will fit the training data perfectly. The choice of which one to deploy
  depends on something outside the data — simplicity assumptions, regularization,
  the way the search is set up, or just a guess. This looks to me like the same shape
  of problem as the rule case: a finite past underdetermines an infinite future, and
  some outside factor has to do the choosing.


  I keep going back and forth. The two problems look structurally identical — in both,
  finite evidence cannot single out one continuation among indefinitely many, and
  the lesson seems to be that what is ''right'' is partly constituted by something
  other than the evidence. But the rule case feels as if it is about what I meant,
  not about what will happen next, and that difference might make the analogy superficial.
  So I want someone to work through this with me: state the mapping as precisely as
  you can, say what would have to be true on both sides for conclusions to transfer
  from one case to the other, and then tell me whether the parallel is deep or superficial.
  In particular, try to name something the parallel would predict about one side that
  is false, if you can."


