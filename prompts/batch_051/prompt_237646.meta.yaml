  Theories from collective intentionality:

  1. Bratman''s shared intention: a shared intention is present when each participant
  intends the joint activity, intends it in accordance with and because of meshing
  subplans, and this is common knowledge. Small-scale, no requirement of obligation.

  2. Gilbert''s joint commitment: parties are jointly committed to act as a body;
  each is obliged to the others to conform; created by expressions of readiness; doesn''t
  require shared goal or personal intention; can persist without individual intentions.

  3. Searle''s collective intentionality: "we-intentions"; irreducible collective
  intentionality; individuals have we-intentions of form "I intend we do J"; can exist
  without prior agreement; background capacities.

  4. Tuomela & Miller''s we-mode: we-intentions with "we-mode"; requires group reason,
  ethos, commitment to group.

  5. Simple "common goal + common knowledge" or "mutual responsiveness" rule.


