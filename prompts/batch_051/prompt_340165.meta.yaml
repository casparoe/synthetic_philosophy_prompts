  I''m a PhD student working at the philosophy/decision-theory boundary, and for a
  reading group I''ve been asked to write out my philosophical profile on transformative
  experience so the others can poke holes in it. I''d like you to act as a professional
  philosopher who works on rational choice, and to think carefully about this—start
  by brainstorming candidate tensions in your head and then whittle it down, rather
  than just flagging everything. Here is what I currently believe.


  One, I''m a decision theorist at heart: an action is rational to the extent that
  it maximises expected utility relative to one''s preferences at the time of choice.


  Two, I accept the core transformative-experience claim, at least for big cases like
  becoming a parent or taking religious vows: you cannot know in advance what your
  post-choice evaluative standpoint would be like, because the choice changes the
  standpoint itself and not just your information.


  Three, but I don''t think such choices are arational. I want to say that plenty
  of people rationally decide to become parents, plenty rationally decide not to,
  and neither makes a mistake merely in virtue of that decision.


  Four, I think testimony from people who have crossed the divide is genuinely useful.
  It can sometimes rule a choice out—if everyone who has done it reports it as miserable,
  that is a defeater—but it can never, by itself, establish that it was rational for
  me to go ahead.


  Five, if someone crosses over and later would not undo it, I don''t count that retrospective
  endorsement as evidence that the original choice was rational; the endorsement comes
  from a changed evaluator and I don''t see why the earlier self should defer to it.


  Six, I''m also drawn to an asymmetry: stepping into a transformative state raises
  a problem of rational justification that staying where I am does not.


  I honestly can''t see where the serious strain is, though I suspect there is one.
  Go through these and tell me which pairs are in genuine tension and how badly; which
  pairs only look incompatible and why the appearance is misleading; and for each
  genuine tension, what the cheapest fix would be and what it would cost me. Then
  tell me which single revision would do the most work overall. Please write the answer
  in British English.


