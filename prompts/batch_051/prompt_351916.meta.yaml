  Type B prompt structure:

  - Open with a scene/context: the asker maybe a law student or philosopher puzzled
  by courtroom practice. But prompt shouldn''t be too rambling. 1-3 paragraphs, formal.

  - Describe the practice concretely: In criminal trials, the prosecution must prove
  each element of the charge; witnesses can be cross-examined on their observations
  and memories; but the court does not require anyone to prove or even address that
  the past is knowable, that physical objects persist when unobserved, that other
  people have minds, that memory generally preserves the past. If a witness said they
  were not sure the past happened, the court would treat them as irrational or deceptive
  rather than entertain the doubt. Similarly, the rules about hearsay and competence
  presuppose testimony is generally reliable, but this standing reliability is not
  itself at issue in any particular trial.

  - Ask: What view of knowledge and justification does this practice presuppose? Specifically,
  does the court''s way of treating background certainties match the idea that these
  are "hinge commitments" (à la Wittgenstein''s On Certainty) rather than ordinary
  empirical beliefs? Distinguish what the practice strictly presupposes from what
  it merely fits well with. Is the practice coherent? What would have to change in
  courtroom procedure if we insisted every background certainty be proven like an
  ordinary factual claim?

  - Request: Give a precise reconstruction, say where the practice is philosophically
  underdetermined, and then say how confident you are in each main claim and single
  out the point you are least sure about.


