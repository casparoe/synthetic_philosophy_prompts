  it as "the number is one more than itself," which is false, instead of "the cell
  now holds a number one larger than its previous contents," which is true. The cell
  persists across the assignment; the value does not. Mutation forces you to keep
  these two kinds of sameness apart—the cell is the "same thing" across time while
  the contents are not—and we only have the one word, `x`, doing both jobs.


