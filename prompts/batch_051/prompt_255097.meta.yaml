  Let me recall the standard objections to Locke''s labour theory/mixing argument:


  1. The labour-mixture argument seems to imply you lose rather than gain property
  by mixing labour with unowned things (Nozick''s famous tomato juice in the ocean
  example): mixing my labour with what is unowned makes it less mine, if anything;
  why does mixing one thing I own (labour) with something unowned yield ownership
  of the product rather than a loss of my labour?

  2. The "value-added" reading: labour creates most of the value, but that grounds
  at most a claim to the added value, not to the whole object; you can''t own the
  whole tree by picking its apples.

  3. Confusion about what "labour" is: what counts as labour is undetermined—picking
  up a stick, looking at land, sweeping a sidewalk? The theory gives no principled
  boundary, so it can''t determine acquisition.

  4. The spoilage/appropriation problem: the proviso that one can appropriate only
  as much as one can use before it spoils is incompatible with money and durable goods,
  which Locke introduces to allow large holdings, so the original proviso is effectively
  abandoned.

  5. The "enough and as good left" proviso is empirically false today and can''t be
  satisfied at scale: with a finite earth and private appropriation, later persons
  are born into a world already owned, so how does anyone consent to the status quo?
  Also it''s not clear it can be tested.

  6. The theory says nothing about prior entitlements of others / doesn''t handle
  land inhabited by indigenous peoples: "unowned" often meant not enclosed, ignoring
  use-based occupancy.

  7. Some argue the labour theory grounds only use-rights, not full alienable property
  or right to bequeath, etc.

  8. It can''t justify property in things not produced by anyone/anything, and it
  doesn''t handle collective labor or group acquisition.

  9. Hume/others: consent/original contract issues.


