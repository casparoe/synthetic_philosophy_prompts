  they could misremember or be self-deceived. So (1) is a slide from metaphysical
  determination to epistemic authority. But is it "looks fine"? Many people would
  accept that if meaning = intention, then the author knows best. Actually there''s
  a debate: intentionalists (e.g., Hirsch) do hold the author''s intention is the
  meaning, and often the author has privileged access, but not necessarily infallible.
  So (1) is a good candidate to reject.


