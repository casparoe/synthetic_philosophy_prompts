  Important philosophical details: Goodman''s grue is usually defined as: an object
  is grue iff it is examined before time t and green, or examined after t and blue
  (or not examined before t and blue). If all emeralds observed before t are green,
  they are also grue (observed before t and green). Then both H1 "all emeralds are
  green" and H2 "all emeralds are grue" are supported. H2 predicts that emeralds first
  observed after t are blue; H1 predicts green. So induction doesn''t privilege green
  unless we have a rule favoring "green" over "grue." Goodman''s point: we can define
  "bleen" (observed before t and blue, or after and green); in the grue/bleen language,
  "green" is the disjunctive-looking predicate (grue before t, bleen after t). So
  simplicity is language-relative. The solution: project "entrenched" predicates.
  The new riddle is how to justify entrenchment without circularity.


