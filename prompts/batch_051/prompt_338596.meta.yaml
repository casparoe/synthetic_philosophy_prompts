  Need be formal/polished. Could be:


  Ordinary evaluative practice seems to contain a striking asymmetry about the commensurability
  of pleasure and pain. People routinely accept that mild pains can be outweighed
  by moderate pleasures: they undergo uncomfortable medical tests, break in stiff
  shoes for a social occasion, or accept a mild headache after a pleasant evening.
  Many of the same people, however, refuse to accept that severe pains can be outweighed
  by any ordinary quantity of mild pleasure; they treat severe pain as belonging to
  a different category, not merely as occupying a farther point on a single scale.
  Yet they do not usually treat severe pleasure as belonging to a different category
  in the same way. In fact, someone who declined to endure a mild pain in exchange
  for an extraordinary pleasure might be regarded as irrational or unable to appreciate
  the pleasure, not as someone whose values are merely non-standard.


  Is there a principled reason for treating only the negative end of the scale as
  lexically dominant? One candidate is a threshold view of negative well-being: below
  the threshold, pleasures and pains trade off in the usual way, but once suffering
  crosses the threshold, no amount of positive well-being can compensate for it. But
