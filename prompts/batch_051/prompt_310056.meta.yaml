  4. The vehicle need not be a living victim. Effigies, cloth bundles, threads, and
  similar inanimate objects can serve as genuine substitutes, as long as the transfer
  is ritually enacted.


  5. For a rite to count as substitution, the vehicle must be disposed of: killed,
  burned, expelled, sunk, buried at a boundary, or otherwise removed from the community''s
  space. Merely declaring that the burden has passed, without disposing of any concrete
  vehicle, does not yet amount to substitution.


