  2. Nevertheless, many documented rites are explicitly substitutionary: the burden
  is transferred by a formula or gesture, and the rite''s stated logic is that the
  victim "bears" or "carries away" the community''s sin or impurity.


  3. Ritual substitution is Janus-faced: the substitute is simultaneously identified
  with the offerer/community (that''s what lets it carry the burden) and differentiated
  from them (that''s what lets it be removed without loss). This double movement is
  a feature, not a failure.


  4. The vehicle of substitution need not be a living victim; effigies, figurines,
  and even items like a thread or a bundle can serve, provided the transfer is ritually
  enacted. To count as substitution, the vehicle must be removed from the community
  (destroyed, expelled, sunk, buried at a boundary, etc.).


