  From a PhD student in anthropology of religion. They list commitments:


  (1) I hold a broadly Girardian view: sacrifice functions to channel and contain
  mimetic violence, and the scapegoat mechanism is unconscious — participants genuinely
  believe the victim is guilty/dangerous.


  (2) I also think that many sacrificial systems are fully conscious and transactional:
  the victim is explicitly said to substitute for the offerer or carry away sins,
  as with the Levitical scapegoat and substitutionary atonement.


  (3) I think the efficacy of substitution cannot be reduced to metaphors or social
  functions: the ritual itself accomplishes a real change in ritual status (impurity
  is removed, guilt is transferred), even though no physical change occurs.


  (4) I hold that the substitute need not be innocent or even animate: in some systems,
  dough effigies, dolls, or plants can carry off impurity, and I take these to be
  genuine substitutions rather than mere representations.


  (5) I reject the old Frazerian idea that substitution is a kind of primitive mistake
  — that the offerer simply confuses the victim with themselves; substitution is a
  normative, institutional fact, not a cognitive error.


  (6) I hold that for a transfer to count, the substitute must be actually removed
  from the community''s space (killed, burnt, expelled, thrown in a river, etc.);
  a mere prayer or confession without a concrete vehicle is not substitution.


