  Then list:


  1. In its central case, sacrifice is best explained as a mechanism for redirecting
  intragroup violence onto a substitutable victim, and its substitutionary logic is
  not transparent to the participants. I take this to be the lasting core of the broadly
  Girardian position.


  2. At the same time, a large class of rites are explicitly substitutionary in their
  own stated rationale: through a gesture or formula, sin, impurity, or doom is transferred
  to a victim or object that ''bears'' or ''carries away'' the burden. I regard these
  as central evidence, not as a degenerate or marginal form.


  3. Substitution has a double structure: the vehicle must at once be identified with
  the party whose burden it takes on — otherwise it could not carry that burden —
  and kept separate from them — otherwise its removal would be the community''s own
