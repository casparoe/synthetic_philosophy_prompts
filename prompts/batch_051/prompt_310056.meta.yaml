  (1 vs 2): In Girard, the victim is not consciously a substitute carrying sins; in
  Leviticus/atonement, they are. Can both be true in different systems or is there
  a theoretical inconsistency?

  - (3) real change in ritual status vs. (6) need concrete vehicle — maybe tension
  with (4) inanimate substitutes: can a dough figure "carry away" impurity and accomplish
  real change? Not obviously inconsistent if ritual acts constitute the change.

  - (1) and (2) may be reconciled by distinguishing expiatory sacrifice from scapegoat
  mechanism; but then is the unifying concept "substitution" doing work?

  - (5) anti-Frazer vs. (3): If the efficacy is normative/institutional, then the
  change in ritual status is not a "real" change? Actually compatible.

