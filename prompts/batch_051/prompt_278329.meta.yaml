  "For the last few months I''ve been helping build audience models for a public-interest
  campaign, and I keep noticing a strange double standard in how my colleagues treat
  generational categories. They will move, without any sense of strain, from a line
  in a survey like ''born in the late 1990s'' to broad claims about what Gen Z wants
  from institutions, what it finds credible, and how it should be addressed. Yet when
  I proposed, half as a joke, that we segment the public into even-year and odd-year
  births, or into surname initials A–M and N–Z, and then ask whether even-year people
  are more group-loyal or A–M people prefer security, everyone treated it as obviously
  unserious. The odd thing is that those joke groupings have cleaner boundaries than
  generations do: the standard birth-year cut points for the cohorts drift by several
  years depending on the source, and the people using the categories freely concede
  this. So the asymmetry is not simply that one set of categories is fuzzier than
  another; if anything, the fuzzier categories are the ones being treated as more
  real.


  I can think of candidate justifications for the asymmetry. A generation might pick
  out a shared formative environment—a recession, a war, a technological shift—rather
  than a numerological accident, and it might matter because people who pass through
  the same events at roughly the same life stage develop recognizably different defaults.
  The labels may also partly constitute the phenomenon, since people come to identify
  with a cohort name and behave accordingly. And ''generation'' in the kinship sense
  names a real relationship of transmission, where ''odd-year'' does not. But each
  of these seems to wobble under pressure: the same historical event lands differently
  on an eight-year-old and a twenty-five-year-old; self-identification is itself partly
  a downstream effect of the marketing and journalism that use the categories; and
  biological generations cut across, rather than along, the usual cohort boundaries.
  So here is what I want to settle: is there a principled, non-gerrymandered basis
  for treating generational cohorts as a better kind of social category than even/odd-year
  or surname-initial cohorts—one that licenses the confident generalizations made
  about Gen Z while ruling out the identical move for odd-year people? Or is the asymmetry
  just the familiar situation of categories whose boundaries have been drawn to make
