  ---


  Last night a friend and I argued for several hours about whether a country should
  try to rise in the World Happiness Report, and he left me holding an argument that
  seems to show more than either of us believes. He convinced me that each step is
  plausible, yet the reasoning appears to prove that governments should stop pursuing
  health, education, and prosperity as well — which cannot be right. Here is the argument
  in the form he finally wrote out:


  (1) The rankings rest chiefly on self-reported life evaluation, above all the Cantril-ladder
  item that asks people to rate their own lives on a 0-to-10 scale stretching from
  the worst possible life they can imagine to the best possible life they can imagine.

  (2) A score produced that way can move for reasons that have little to do with how
  good people''s lives actually feel or go: who is sampled, how the question is translated,
  where it sits in the survey, what counts as the best and worst imaginable life in
  a respondent''s frame of reference, and what respondents take to be an acceptable
  answer.

  (3) If a state officially commits itself to climbing the ranking, it makes the score
  a target.

  (4) Once a score is made a target, incentives gather around the number itself: ministries
  are assessed by it, statisticians are directed to improve it, and governments acquire
  reasons to encourage favorable reports rather than to change the conditions the
  reports are supposed to describe.

  (5) So a state that resolves to top the rankings will tend to improve its score
  rather than improve its citizens'' lives; the measure will drift away from the thing
  it measures exactly when it is pursued most intently.

  (6) A measure that systematically detaches from the underlying good when it is adopted
  as a target is not a sound basis for public policy.

  (7) Therefore no country should make topping the happiness rankings an aim.

  (8) But the same reasoning applies, step for step, to GDP per capita, average life
  expectancy, literacy, vaccination coverage, and every other quantity a government
  might track: each has been gamed somewhere, and each becomes gameable once it is
  named as the goal.

  (9) Yet we would not conclude that governments should stop aiming at economic security,
  longevity, or literate, healthy populations just because the associated numbers
  can be gamed.

  (10) So at least one of the premises must go.


  I have an instinct that self-reported happiness must be special — that survey responses
  are softer than death records or school enrollments. But my friend answered that
  mortality statistics have been miscoded to meet targets, GDP counts expenditures
  that do not improve life, and literacy figures have been inflated by governments
  anxious about rankings; the difference is one of degree, not of kind, and a matter-of-degree
