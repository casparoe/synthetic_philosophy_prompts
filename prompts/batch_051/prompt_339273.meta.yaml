  ---


  Last week I spent a long evening arguing with a friend about the easy-knowledge
  problem, and he pushed me into a position I am now supposed to defend in front of
  people who will not be as patient as he was. My position, as it stood at the end
  of the argument, is this: the bootstrapping problem is not a special embarrassment
  for process reliabilism but a version of a difficulty that arises for any epistemology
  once a belief-forming practice is allowed to certify itself, and the reliabilist
  should accept the conclusion that a track-record argument can yield justified belief
  in the reliability of one''s own perception. The appearance of viciousness in the
  standard cases, I now think, comes from conflating two things a subject might be
  doing: using a process to generate a justified reliability belief, and using a reliability
  belief as part of the basis for the very first-order beliefs from which the track-record
  is built. The first is benign; the second would be objectionable but is not what
  the reliabilist says happens in the basic case.


  Next week I present a short paper defending this at my department''s epistemology
  workshop: twenty minutes, then thirty minutes of questions. The audience will include
  two process reliabilists who accept the theory but have said in our reading group
  that the bootstrapping cases make them deeply uncomfortable; one access internalist
  who holds that justification must be reflectively available to the subject; one
  evidentialist who rejects reliabilism outright and thinks a belief is justified
  only if it fits the subject''s undefeated evidence; and a handful of graduate students
  who are drawn to externalism but afraid of sounding permissive. The core of my argument
  in the paper is the following:


  (1) Suppose S forms a series of true perceptual beliefs — the wall is red, the book
  is blue, and so on — by ordinary vision.

  (2) On each occasion S is also in a position to form the corresponding belief that
  things are as they appear to be.

  (3) S then reasons by simple induction from the sample of cases in which things
  were as they appeared to be to the general conclusion that S''s visual appearances
  are reliable.

  (4) A process reliabilist is committed to saying that each premise is justified
  by vision, that the inductive step is justified if induction is reliable, and hence
  that S''s reliability conclusion is justified.

  (5) The objector calls this an absurdly easy route to justified belief that one''s
  perceptual faculties are reliable.


  My paper argues that step (5)''s charge cannot be motivated without either (a) imposing
  an internalist requirement that reliable belief formation is insufficient unless
  the subject has reflective access to its reliability, which the reliabilist independently
  rejects, or (b) endorsing a principle against circularity that would also condemn
  calibrating a thermometer by its own readings or validating memory partly through
  memory — practices the objector''s own account of evidence cannot easily do without.


  Prepare me for the question period. I want, in the order I am most likely to hear
  them, the objections those particular people will raise, phrased in the terms they
  would use, each with a note on what I should concede, what I should hold, and a
  short reply I can deliver in two or three minutes. Be honest about where each reply
  is weakest, and tell me which point in my argument I should most fear having to
  defend at length. I would also like a warning about the objection I am probably
  hoping nobody will ask, and some advice on how to handle the inevitable comparison
  to a clairvoyant or a lucky guesser who bootstraps his way to a delusional confidence
  in a faculty he does not have.


  ---


