  ---


  I am producing a long-form philosophy podcast, and in two weeks I will record an
  episode with a moral philosopher whose recent book defends a rehabilitated Schopenhauerian
  ethics of compassion. Her position, as she presents it, is that Schopenhauer was
  right that compassion—Mitleid, understood as immediate participation in another''s
  suffering rather than a condescending or self-congratulatory sentiment—is the only
  moral motive that is both psychologically real and finally defensible, and that
  the later turn to duty, principle, and impartial rule was a mistake. She grants
  that pity has familiar pathologies: it is partial, easily manipulated, prone to
  burnout, and can demean the person it fixes upon as a sufferer. Her standard answer
  is to distinguish raw pity from what she calls disciplined or reflective pity, and
  to claim that the latter is untouched by Nietzsche''s criticisms—that Nietzsche
  was diagnosing only the raw form, and that mature ethics consists in cultivating
  the reflective form rather than replacing pity with principle. I have interviewed
  her once before and know her pattern: she does not deny objections so much as absorb
  them, patiently showing that they apply only to raw pity while her own account already
  contains the correction. She is very difficult to catch out because the distinction
  keeps expanding to cover whatever has just been said.


  Please write me a sequence of six to eight questions, with the follow-up you would
  press after her likely reply, that makes this absorption strategy progressively
  less tenable. Begin by forcing a precise statement of what distinguishes disciplined
  from raw pity, and in particular what does the disciplining. Then move through the
  hardest pressure points: if the disciplining standard is something other than pity
  itself—say impartiality or respect for persons—then her view begins to look like
  a disguised principle-ethics; if it is more pity, then the bias and partiality may
  simply reappear at the level of the discipline. Press the concern that even disciplined
  pity makes another''s suffering its intentional object and in that way still condescends
  or fixes the other in the role of victim. Press the limits of a motive so tied to
  the concrete and near-at-hand when it comes to distant strangers, future generations,
  or the morally unappealing. And press the empirical problems of compassion fatigue
  and the familiar finding that a single named victim moves people more than a statistic.
  The arc should close with a question about what evidence, experience, or clear counterexample
  would count against her view—not something she could absorb into the distinction,
  but something whose acknowledgment would force genuine revision. The questions should
  engage the substance of her claims; please do not make them requests for citations
  or literature surveys.


