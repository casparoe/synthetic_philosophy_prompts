  up to fail—something older legal and moral ideas already had handles for? And what
  does the crash do to the theory in return: does it confirm the gap as a real feature
  of automated systems, or make it look like the gap was manufactured by the design
  and then used as an excuse? My own hunch is that a real responsibility gap matters
  most for systems that genuinely rewrite their own policies, not for a mostly engineered
  stack with a human safety net—but I don''t know if that''s a useful distinction
  or just me looking for a loophole.


