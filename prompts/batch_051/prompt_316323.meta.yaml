  I''m a software engineer working on autonomy stuff (perception, mostly, with some
  sensor fusion), and I keep getting dragged into arguments about how you even blame
  a self-driving car when something goes wrong. I''ve got no philosophy background,
  so I might mangle this, but a coworker pointed me at this idea called the "responsibility
  gap": when an autonomous or learning system causes harm, all the usual places we''d
  stick blame—the programmer, the operator, the company—seem to have a decent excuse
  (nobody wrote the exact behavior, nobody had real-time control, the system sort
  of "decided" on its own), and the machine itself can''t be blamed, so responsibility
  falls through the cracks.


  The case I can''t stop thinking about is the Uber self-driving car that killed Elaine
  Herzberg in Tempe in March 2018. Quick recap of the facts as I remember them: the
  car was in autonomous mode at night, a backup driver was in the seat but was apparently
  watching something on her phone, and the car hit Herzberg while she was walking
  a bicycle across the road and killed her. The NTSB stuff later said the car''s automatic
  emergency braking was disabled while it was under computer control, and the whole
  safety design just assumed the human would bail it out. Uber settled with the family
  and suspended testing in Arizona, and eventually the backup driver got charged with
  negligent homicide but prosecutors didn''t charge the company. What I want is a
  careful mapping of that crash through the responsibility-gap lens, not just vibes.
  Who are the players, what did each of them actually knew and control, and what does
