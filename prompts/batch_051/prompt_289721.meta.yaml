  I can craft a proof-too-much argument:


  Premise set:

  (1) An anomaly detector can only call a reading anomalous relative to a posited
  mechanism: same mechanism, normal variation; different mechanism, anomaly.

  (2) So we need a fact about whether two episodes are produced by the same mechanism.

  (3) Whether two episodes count as sharing a mechanism depends on how one individuates
  the components and activities — at a coarse grain, nearly anything can be described
  as the same mechanism (some input-output function), and at a fine grain, no two
  episodes are exactly alike.

  (4) There is no principled, non-question-begging level of grain at which counts
  are to be made.

  (5) Therefore whether two episodes are generated by the same mechanism has no determinate
  fact of the matter.

  (6) If there is no fact of the matter, no anomaly detector can be said to be correct
  or incorrect; any alarm is just a decision about description.

  (7) But we do (and must) treat some alarms as correct and others as false positives,
  e.g., the furnace sensor is genuinely malfunctioning vs weather change.

  (8) So the very idea of a same mechanism — and thus anomaly detection — is incoherent.


