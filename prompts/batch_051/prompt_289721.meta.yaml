  Draft:


  "Recently I took a job in a firm whose senior team is about to decide whether to
  abandon a piece of in-house software that several comparable firms have already
  dropped, and at lunch I overheard two colleagues, Daniel and Priya, arguing about
  an example they both treated as test case for how the decision should be made. I
  have a small vote, so I found what they said unsettling; I have no idea who is right."


  Then reproduce exchange:


  Daniel: "When you see a dozen similarly placed firms independently abandon a platform,
  that is evidence that each of them discovered something bad about it. Pooling evidence
  like that is not herding, it is just updating: a rational person''s posterior should
  follow the crowd when one person''s private experiences are noisy."


  Priya: "But they were not independent. The later firms dropped the platform because
  they saw the earlier firms drop it — that is what herding is. You are counting the
  same two or three original signals a dozen times."


  Daniel: "Even knowingly following earlier decisions can itself be informative, because
  later firms could have stayed if their own trials ran better; their decision to
  bear switching costs is revealed preference. If they had access to internal tests
  and still switched, the switch signals that their private evidence was at best not
  strong enough to stop them."


  Priya: "That assumes their costs and reputations are identical, and that what ''revealed
  preference'' reveals is about the platform rather than about their fear of being
  contrarian. If the social cost of departing from the pack exceeds the expected benefit
  of staying, the action is compatible with believing the platform is fine. At that
  point the crowd is a poor measuring instrument."


  Daniel: "Fine, but you do not need the crowd to be a perfect instrument for the
  conclusion to hold. Under uncertainty, the policy of following the crowd dominates
  treating my own paltry private signal as sovereign. If we always allowed ''they
  might be conforming'' to neutralise public action, we would forgo one of the most
  powerful sources of information humans have; that is the worse error."


  Priya: "I am not saying ignore the crowd. I am saying the very same pattern of action
  is consistent with an informational cascade and with reputation-driven imitation,
  and if you cannot distinguish them from the outside, your ''policy'' cannot tell
  the difference between pooling evidence and propagating noise. And cascades are
  brittle — a tiny public signal can reverse them — which should make you suspicious
  that the first small push, not the truth, is carrying everyone along."


