  This is strong. It is formal/polished, from a PhD student, no citations, no quotes,
  in-the-weeds but not too niche. It contains a subtle confusion/false presupposition?
  Actually type 3 doesn''t explicitly require false presupposition, but the answer
  would distinguish. The prompt asks "is it defensible or a bias dressed up as a rule."
  The good answer: your reverse use is not strictly licensed; the theorem is a conditional;
  the contrapositive gives disjunction, not a determinate identification of which
  condition failed. With no independent access to your prior, choosing prior difference
  is ad hoc. But there are defensible versions: under bounded rationality, or if you
