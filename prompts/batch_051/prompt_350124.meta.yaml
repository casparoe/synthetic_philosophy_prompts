  The key subtlety: In Solomonoff induction, posterior ∝ 2^{-K(program)} times likelihood;
  simpler programs have exponentially more prior, but a longer program that predicts
  the data exactly can beat a shorter program that only loosely predicts it, depending
  on evidence length. The prompt could ask: "Construct two hypotheses H1 and H2 and
  a finite observation sequence such that, under a specified idealised encoding, K(H1)
  = 10 and K(H2) = 40 (or whatever), yet the posterior of H2 exceeds that of H1; say
  which feature of the case drives the reversal, and what happens if the evidence
