  The core issue in philosophy of music and emotion: How can music "be" sad if music
  isn''t a sentient being? Positions:

  - Cognitivism/contour theory (Kivy): music expresses emotion by resembling human
  expressive behavior (posture, gait, voice contours). Expressiveness is perceived
  in the music, not felt by listener or composer. The emotion is a property of the
  music (phenomenologically, we hear it as sad) but not literally an emotion the music
  has.

  - Arousal theory: music expresses sadness by arousing sadness in listeners.

  - Persona theory (Levinson): we hear music as the expression of an imagined persona/agent;
  expression is imagined, not real.

  - Resemblance vs convention debate.

  - Davies: emotion characteristics in appearances; "sad" is used analogically; music
  presents emotion characteristics, not emotions.


