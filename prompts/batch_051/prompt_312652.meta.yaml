  Potential prompt text:


  ---


  You are a professional philosopher specializing in aesthetics, with a particular
  focus on the philosophy of music. Think carefully before answering, and begin by
  working through the terrain informally — why each commitment seemed attractive,
  what each commits its holder to, and where the pressure points are — before delivering
  your final audit.


  I am preparing a short position statement for an aesthetics seminar on musical expression,
  and I want a consistency check before I circulate it. My own view on how music gets
  its emotional character is as follows:


  1. When I say that the slow movement of a piece is sad, I mean that the sadness
  is an audible property of the music itself, not a report of the composer''s mood
  and not a report of how the music makes me feel. Sad music can leave me perfectly
  cheerful; cheerful music can leave me cold.


  2. The least mysterious account of this is a resemblance account: musical features
  — slow tempo, low register, drooping or descending contours, soft dynamics, legato
  articulation — resemble the way sadness is carried in human posture, gait, and voice.
  The music''s sadness is, at bottom, heard resemblance to human expressive behavior.


  3. Whether a piece is sad is a matter of right or wrong, and the right answer is
  fixed by the music''s perceptible features together with our shared perceptual competencies,
  not by any listener''s felt response. A listener''s being moved is neither necessary
  nor sufficient for the music''s being sad.


  4. Nevertheless, I believe no purely structural description of the piece — its notes,
  intervals, durations, amplitudes — could ever tell you that the piece is sad. To
  hear the sadness one must have some acquaintance with what sadness is like, and
  there is something about the grasp of the expressive property that such structural
  descriptions leave out.


  5. I also hold that the sadness is not the composer''s or performer''s sadness:
  a piece can be sad even if no one involved in producing it was sad when it was written
  or played, and a composer might write plausible sad music while in a completely
  different state. What the music expresses is in the sound, not in a biography behind
  the sound.


  Please audit this set. Which commitments are in genuine tension, and which only
  seem to be? For every pair in genuine tension, say how severe the tension is, what
  it would take to resolve it, and which commitment a defender of my position would
  reasonably give up first. Also identify at least one apparent tension that dissolves
  on closer inspection and explain what dissolves it. Finally, tell me which single
  revision to my position would remove the most tension at the lowest cost — and whether,
  after that revision, the position still says what I wanted it to say.


  ---


