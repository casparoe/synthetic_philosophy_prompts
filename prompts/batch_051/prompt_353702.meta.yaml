  I''m a PhD student in cognitive science and one argument keeps gnawing at me: the
  claim that a materially realized, finite mind can only ever have finitely many genuinely
  distinct experiences, so an immortal life must eventually bottom out in repetition.
  The version I have in mind goes like this. A bounded brain has finitely many possible
  total neural or functional states — below some resolution, two states just aren''t
  different states at all. So the space of experiences open to such a creature is
  itself finite. An endless life is an infinite sequence of draws from that finite
  set, and by pigeonhole reasoning every state you ever enter you enter infinitely
  many times: novelty has to run out, and immortality collapses into recombining a
  bounded repertoire, or pure tedium. I used to find that argument almost conclusive.


  But recently I''ve been thinking hard about the compositional, language-like character
  of a lot of cognition. Finitely many words, infinitely many sentences; finitely
  many concepts, unboundedly many structured thoughts. Even a machine with finitely
  many internal states can emit a never-repeating, ever-growing sequence of strings.
  That looks like it drives a wedge between "the system has finitely many internal
  states" and "the system has finitely many experiences" — at least if experiences
  are typed partly by the structured contents they tokenc rather than just by the
  bare physical state of the vehicle. You could, in principle, keep having new thoughts
  forever, each one content-novel, with a strictly finite brain.


