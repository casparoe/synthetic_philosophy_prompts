  I''m a retired physical chemist who has spent the last couple years reading philosophy
  to keep my brain busy, and I''ve run into a problem I''d like someone to help me
  think through. I was reading John Stuart Mill, A System of Logic, Book III, Chapter
  VI "Of the Composition of Causes." I don''t remember his exact wording, but he draws
  a contrast there that keeps nagging at me. In mechanical cases, he says, causes
  compose additively: if two forces act on a body, the result can be predicted by
  summing their separate effects. But in chemical cases, the combined effect is not
  additive. The product has different qualities from the elements. According to him,
  you could not have predicted the properties of the compound from the properties
  of the elements before observing the compound. That''s approximate; I''m not quoting.


  Now here''s my tension. As a chemist I have always believed, as a matter of physics,
  that chemical facts are in principle derivable from quantum mechanics. Write down
  the Hamiltonian for a molecule, solve the Schrödinger equation, and you get the
  structure, spectrum, reactivity, all of it. In principle. That''s a very powerful
  reductionist picture: one fundamental theory, no special chemical laws, no emergence
  beyond computational intractability. If I''m being honest, I think I am committed
  to it.


  But I also have an intuition I can''t dismiss, even though I know it sounds like
  what mystics say. When I think about a benzene ring or an enzyme, I have the strong
  sense that the molecule is not just the sum of its electrons and nuclei in some
  particular configuration. Not because there''s any extra stuff, and not because
  the Schrödinger equation is false. The intuition is that the higher-level description—chemical
  bonding, functional groups, active sites—is doing some real structuring of the world
  that the lower-level description misses, not merely a convenient abbreviation for
  something we already understand. My late colleague used to say ''when hydrogen burns
  in oxygen, the character of the product is not contained in the character of the
  reactants.'' That''s almost Mill''s point, and it''s also what reductionism seems
  to deny.


  So my question is that classic one: I have a theory with systematic virtues (reductionism)
  and an intuition it seems to contradict (molecules have genuinely new properties
  at the higher level). Present both sides at their strongest and tell me which should
  yield. Is my intuition just an epistemic artifact—a name for the fact that I can''t
  run the calculation—that should be debunked and dropped? Should the reductionism
  be amended or qualified? Or is there a way to read Mill''s point and modern reductionism
  as compatible because they are using "sum of parts" differently? I want to know
  what would justify each move; don''t just pick a side."


