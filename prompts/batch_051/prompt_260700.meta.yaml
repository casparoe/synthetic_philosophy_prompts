  Let me draft the full prompt:


  A fellow student pressed the following dilemma on me and I cannot find the step
  to reject. It concerns the old Muʿtazila–Ashʿarite dispute over the basis of moral
  obligation, but it drives toward a conclusion stronger than anyone in that dispute
  held.


  (1) On the Ashʿarite view, an act is right just in case God commands it and wrong
  just in case God forbids it; there is no good and no evil prior to, or independent
  of, God''s command. (2) If that is so, then God''s commanding an act is the sole
  feature that makes it right. (3) Therefore, if God commanded us to harm the innocent
  and forbade us to relieve their suffering, harming the innocent would be right and
  relieving them would be wrong. (4) But a view on which the wrongness of harming
  the innocent consists solely in the fact that God forbade it — and could in principle
  have been otherwise — leaves the statement ''God is just'' with no content beyond
  ''God''s will is God''s will.'' (5) A God whose commands are self-certifying in
  that way is, in moral kind, indistinguishable from an omnipotent tyrant whose decrees
  are self-certifying. (6) So Ashʿarism eliminates the very justice it was introduced
  to safeguard.


  (7) The Muʿtazilite alternative avoids this by holding that reason itself can grasp
  certain acts as good and evil independently of revelation, so God''s commands answer
  to a standard they did not create. (8) But if the standard is already rationally
  available, then God''s command adds nothing to the obligatoriness of those acts;
  revelation merely publicizes what reason already knows. (9) Therefore the Ashʿarite
  empties God of justice, while the Muʿtazilite empties God of authority. Since these
  were treated as the live alternatives, the entire debate rests on a false dilemma
  and there is no coherent Islamic account of moral obligation.


