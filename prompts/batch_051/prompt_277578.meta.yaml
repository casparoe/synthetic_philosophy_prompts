  ---


  I chair the review panel for a small Foundations of Learning fund, and we''ve got
  one proposal this cycle that''s split the panel clean in half, so I need a decision
  memo to circulate before Thursday''s meeting. The applicant is an evolutionary biologist
  who now works in an ML group. His proposal starts from the claim that gradient descent
  is in an obvious sense a much stronger optimizer than natural selection ever was:
  it can follow an actual gradient, it has a fixed, computable loss, and it gets to
  restart from scratch thousands of times. He then argues that this advantage is precisely
  the problem. Because natural selection has no fixed loss surface, it can''t overfit
  to one in the way a trained network can, and it tends to produce systems that are
  robust across environments rather than tuned to a benchmark. The funded work would
  (a) formalize the conditions under which the selection-as-optimizer analogy is and
  isn''t safe to use in learning research, and (b) build a worked example in which
  a mechanism from developmental biology — he floats phenotypic plasticity or bet-hedging,
  and promises to pick one early on — is imported into an optimizer and tested on
  a distribution-shift benchmark. Part of the panel reads this as a genuinely fresh
  angle; the rest think the analogy has been doing sloppy work in ML papers for years
  and we shouldn''t pay to keep it alive. Draft the memo I''ll circulate. It should
  recommend fund, reject, or fund with conditions, give reasons the applicant could
  actually respond to, and take the strongest point on the losing side seriously rather
  than strawmanning it. A page and a half is plenty — the committee reads it the night
  before.


