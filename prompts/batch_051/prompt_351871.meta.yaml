  Actually let me reconstruct formally. Harman (1973) in "Thought," ch. 9? gives "the
  paradox of dogmatism." Harman''s version:

  (1) If S knows that p, then S knows that anything that is evidence against p is
  false/misleading. (Because if S knows p then p is true, and anything that is evidence
  against a true proposition is misleading.)

  (2) If S knows that his evidence E is misleading, then S may disregard E.

  (3) Therefore if S knows p, S may disregard any evidence against p.

