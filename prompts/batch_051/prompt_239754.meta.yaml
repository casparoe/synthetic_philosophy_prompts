  Let me draft:


  "Hey — I''m a PhD student in philosophy of technology and I''ve been stuck on an
  analogy, and I''d like a careful sanity check rather than a literature review. Lately
  I keep going back and forth about whether Sartre''s slogan that existence precedes
  essence (no fixed human nature prior to choice; what you are is the result of what
  you do) has a near-identical structure to the difference between class-based and
  duck-typed (or prototype-based) languages. In Java-ish class-based programming,
  the class — the type, the members, the constraints — exists before any object is
  instantiated, and determines what an instance can be; essence precedes existence.
  In Python/JavaScript-style duck typing, the object is just there with whatever properties
  and methods it has at runtime, and its ''type'' is retroactively read off how it
  behaves; if it walks like a duck and quacks like a duck, it is one. That seems to
  me to be existence preceding essence: there is no predetermined type, only the object
  and the actions it performs. I even think the standard charge against Sartre has
  a programming echo: critics say that ''human beings have no fixed nature'' is itself
  a claim about human nature (a nature whose content is having no nature), and similarly
  a dynamically typed language doesn''t literally escape types — ''dynamically typed''
  functions as a type, and the interpreter still enforces a semantics underneath.
  So, is this a real structural isomorphism, or am I just pattern-matching on the
  phrase ''precedes''? I''d care less if it were just a metaphor, but I want to know
  whether anything philosophical transfers: does the fact that duck typing still relies
  on an underlying runtime help explain why facticity and freedom are compatible in
  Sartre, or does the analogy break down exactly there because a language object has
  no first-personal responsibility or bad faith? Please spell out the mapping, say
  what would need to be true on both sides for the analogy to earn its keep, and tell
  me one thing the parallel would predict that turns out false. Give me a one- or
  two-sentence summary right before the machine-readable tag, and end with exactly
