  complexion more faithfully, so that the chamber is a recognizable image of the voters.
  The instructor uses this not merely as illustration but as argument: if the legislature''s
  job is to stand in for the whole public, fidelity of reflection is a constitutive
  virtue rather than one consideration among others.


