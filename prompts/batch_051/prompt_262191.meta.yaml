  what is meant to correspond to the object being mirrored, the mirror''s surface,
  the reflected image, and the sources of distortion; and what assumptions the optics
  quietly import (for instance, that there is a single determinate ''shape'' of public
  opinion out there to reflect, that reflection is passive rather than constitutive,
  and that a good image is one that minimizes alteration). Then identify where the
  analogy breaks down. A mirror does not deliberate, form coalitions, or bind the
  thing it reflects; its errors are random or mechanical rather than chosen trade-offs;
  and real PR systems impose thresholds, district magnitudes, and rounding rules,
  so the ''image'' is always partly a construction. Distinguish the disanalogies that
  matter for the argument from those that are merely cosmetic. Finally, say whether
  the normative conclusion — that PR''s fidelity of reflection gives it a strong advantage
  over FPTP — survives once the analogy is no longer carrying it, and whether some
  better analogy would do the work more honestly."


