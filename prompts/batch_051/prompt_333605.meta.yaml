  Thesis: Norm of testimony is default entitlement; a hearer is entitled to believe
  what is told in the absence of specific defeaters; this is not derived from evidence
  about the speaker. The argument sketch:


  1. Attempts to validate testimony by the speaker''s track record are circular: the
  data points are themselves delivered by testimony (other people, reports) or by
  perception and memory, whose validity is not established in the same demanding way
  — so the reductionist imposes a burden on testimony they don''t impose on perception.

  2. The speech act of assertion carries a constitutive commitment to truth; to interpret
  an utterance as an assertion is already to see it as claiming truth, so a hearer
  who understands it has a prima facie epistemic reason to accept it.

  3. Default and burden: errors are departures from the norm; a default practice of
  non-acceptance would make the practice of assertion unintelligible or self-undermining.

  4. The authorlessness point: for Mīmāṃsā, the Veda''s authority doesn''t depend
  on any speaker''s competence or honesty; I extrapolate: the force of testimony as
  a kind is not essentially a matter of author-assessment. Maybe frame this as the
  deepest premise.


