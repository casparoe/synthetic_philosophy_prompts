  (Oliver & Raney); meta-emotions (pleasure about feeling sad); conversion of pity/fear
  into pleasure (Hume); Aristotle''s katharsis; the empathy-altruism thing. This is
  very teachable. The non-academic angle could be "I run a small film discussion group
