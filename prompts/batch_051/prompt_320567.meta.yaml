  Lucas''s argument (1961): Gödel''s theorem shows that for any consistent formal
  system F strong enough to do arithmetic, there is a formula G_F which is true but
  unprovable in F, and F cannot prove its own consistency (Con(F)) — assuming consistency.
  The mechanist thesis: the mind can be represented as some such formal system M.
  Then, assuming the mind is consistent, G_M is true but not provable by the mind-as-M.
  But Lucas claims a human can "see" that G_M is true (by seeing that M is consistent
  and applying Gödel''s reasoning), so the mind can prove something M cannot — contradiction.
  Therefore the mind is not M, for any M.


  Objections/cruxes:

  1. We don''t know which formal system the mind instantiates; the argument only addresses
  the claim "the mind is this particular system M that we can actually identify" not
  "there exists some true system capturing it we can''t introspect." (Benacerraf /
  Putnam-style objection: given any Turing machine, one can find a true sentence it
  can''t prove; but we can''t determine which machine we are, and the Gödel sentence
  for the true machine might not be something we can actually see.)

  2. Consistency assumption: real human reasoning may be inconsistent (contains contradictions)
  — if the system is inconsistent, Gödel doesn''t apply in the standard way. Is human
  mathematical practice consistent? Probably locally consistent but maybe globally
  inconsistent with hidden contradictions.

