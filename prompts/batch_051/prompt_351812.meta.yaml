  Hofstadter''s dialogue "Little Harmonic Labyrinth" or the "prelude" — he distinguishes
  three levels: frame message, outer message, inner message. Frame message: "I am
  a message; decode me if you can" — the fact that the physical marks form a code;
  outer message: the information that tells how to decode the inner message (e.g.,
  the genre, the language, the conventions); inner message: the intended meaning.
  Actually I recall: In Gödel, Escher, Bach, the "frame message" says "I am a message,
  decode me"; "outer message" carries the decoding mechanisms; "inner message" is
  the meaning once decoded. He uses the example of a bottle washed ashore with Japanese
  writing; the frame message is that it''s a message at all; the outer message is
  the assumption it''s Japanese (?) the inner message is the content.


