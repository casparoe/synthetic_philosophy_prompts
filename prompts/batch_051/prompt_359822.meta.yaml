  The "fixation of belief": four methods — tenacity, authority, a priori, science.
  Peirce argues science is the only one that can satisfy our need because it assumes
  an external reality that opinions can converge to. Fallibilism: no belief is so
  certain as to be beyond revision.


  A step-wise argument:


  (1) For any method of fixing belief, if it can be undermined by the realization
  that beliefs fixed by it may be false, then it loses its power for inquirers who
  make that realization.

  (2) The methods of tenacity, authority, and the a priori method either produce beliefs
  that conflict with experience or with the beliefs of others, and when their adherents
  notice this, the beliefs are undermined.

  (3) The method of science alone fixes belief by requiring that beliefs be answerable
  to something independent of what anyone happens to think.

  (4) Therefore the method of science alone yields beliefs stable under the question
  ''but might I be wrong?''

  (5) But the method of science itself rests on the presupposition that there is a
  reality independent of inquiry, and that real objects will eventually settle opinion
  to one answer.

  (6) That presupposition can never itself be fixed by the method of science without
  circularity, because it is the condition for the method''s being taken to yield
  convergence.

  (7) Therefore the method of science cannot be justified by its own standard, and
  the preference for it over the others is a matter of faith or convention.


  Is this valid? Step (5)-(6) is a standard circularity/regress issue: the rule of
  induction cannot be justified inductively. But is that Peirce''s view? Peirce might
  say the scientific method is the only one that can be self-correcting, and the "hypothesis"
  of reality is itself a fallible hypothesis tested by the success of inquiry, not
  a presupposition. He might resist (7) by saying we don''t need a non-circular, infallible
  guarantee — fallibilism means even the method and its presupposition are open to
  revision on the basis of experience, and the convergence of inquiry is not a premise
  but an eventual result. This is nice and in the weeds.


