  The classic paradox: Mutual Assured Destruction requires a credible threat to retaliate,
  but retaliating after being attacked is irrational because it doesn''t protect anything
  (the attack already happened) and imposes further destruction, possibly suicide.
  So rational adversary won''t believe the threat. Then deterrence rests on uncertainty
  about rationality, automaticity, honor/commitment, or delegation to a machine/doomsday
  device.


  A stepwise argument:


  (1) A deterrent threat works only if the challenger assigns a sufficiently high
  probability to the threatener''s carrying it out after an attack.

  (2) A rational actor carries out a threatened act only if, at the moment of decision,
  the expected value of doing so exceeds the expected value of not doing so.

  (3) After a nuclear attack has landed, retaliating does not undo the attack or save
  any additional target; it only adds the costs of a counter-strike, possibly escalating
  to one''s own annihilation.

  (4) So, at the moment of decision, a rational actor would not retaliate with nuclear
  weapons.

  (5) Since all sides know this, no rational challenger can assign high probability
  to a rational defender''s threat to retaliate.

  (6) Therefore, between rational actors, nuclear retaliation threats cannot deter.


