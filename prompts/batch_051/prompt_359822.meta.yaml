  category, there is a set of objective properties in virtue of which its members
  belong together, and these properties are independent of human interests.

  (2) But whether two objects are similar is relative to a choice of properties: a
  whale and a fish are similar in shape and habitat, dissimilar in metabolism and
  ancestry; a bat and a bird are similar in flight, dissimilar in reproduction and
  descent.

  (3) Science chooses among these property systems — for example, modern taxonomy
  privileges descent and molecular structure over shape, habitat, and mode of locomotion.

  (4) That choice is governed by explanatory and practical interests (prediction,
  intervention, classification convenience), not by the world alone.

  (5) So scientific categories are selected relative to human interests.

  (6) Therefore there is no sense in which the sciences carve nature at its own joints,
  as opposed to carving it along seams our interests make salient.


