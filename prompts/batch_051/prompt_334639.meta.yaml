  Precisifications:

  1. Trivial descriptive: each action is caused by the agent''s own motivational states
  — that''s true but doesn''t distinguish selfish from altruistic acts (a desire to
  help others is one of your own desires).

  2. Hedonic psychological egoism: every action aims at the agent''s own pleasure/satisfaction
  — substantive, widely considered false (e.g., acting on principle against one''s
  interests).

  3. Preference/expected utility egoism: agents always act to maximize their own expected
  utility, where utility is satisfaction of whatever preferences — often tautological
  or contradicted by self-sacrifice.

  4. Instrumental egoism: concern for others is real but always a means to the agent''s
  own benefit (reputation, reciprocation, warm glow) — substantive; false in its strong
  form due to genuine other-regarding behavior.

  5. Rational egoism: even if altruistic motives exist, they''re irrational — normative,
  not descriptive. People confuse this with psychological egoism.

  6. Ethical egoism: one ought to act in one''s self-interest — another normative
  thesis. This says nothing about whether altruism exists.

  7. Definitional: altruism is defined as act that benefits agent in the end, so by
  stipulation no altruism exists — trivial and question-begging.

