  ---


  So my friend Iris is always telling me ethics has no principles, that it''s all
  just particular cases, and that anyone who follows a rule is fooling themselves.
  But I know her actual verdicts on a bunch of cases, and they''re suspiciously consistent:


  - Lying to the murderer who asks where your friend is hiding: she says fine.

  - Breaking a deathbed promise because you get a better offer to go to a party: wrong.

  - Breaking a coffee date because you stop to help someone badly hurt in a bike crash:
  fine.

  - A doctor lying to a terminal patient about the diagnosis to spare her suffering:
  wrong.

  - In the trolly case, pulling the lever: fine; pushing the big guy off the bridge:
  wrong.

  - Stealing a loaf of bread to feed a starving child: fine.

  - Torturing a suspect to get the location of a ticking bomb: wrong.


  I can think of at least two rules that fit everything. One is a harm-prevention
  rule: you may lie, break a promise, or take property only to prevent serious harm
  that can''t be prevented otherwise, but you may never inflict serious physical harm
  yourself as your chosen means. The other is a respect rule: you may bend those norms
  to prevent serious harm, but never in a way that uses someone merely as a means
  or overrides their own say about their own good. And then there''s Iris''s own view,
  which is that there''s no rule at all and the relevant features just switch their
  significance from case to case.


  The new case is this: two climbers are alone, one is pinned and will die unless
  the other immediately amputates the pinned climber''s arm; the pinned climber is
  unconscious and hasn''t consented, but is a reasonable person who would obviously
  want to live. What do you think Iris would say about the amputation if she''s wanting
