  So my friend Iris is always telling me ethics has no principles, it''s all just
  particular cases, and she thinks anyone who follows a rule is fooling themselves.
  But I know her actual verdicts on a bunch of moral cases, and they''re suspiciously
  consistent:


  - Lying to the murderer who asks where your friend is hiding: fine.

  - Breaking a deathbed promise because you get a better offer to go to a party: wrong.

  - Breaking a coffee date because you stop to help an injured cyclist: fine.

  - A doctor lying to a terminal patient about the diagnosis to spare her suffering:
  wrong.

  - Pulling the lever in the standard trolley case: fine; pushing the large man off
  the bridge: wrong.

  - Stealing a loaf of bread to feed a starving child: fine.

  - Torturing a suspect to get a ticking-bomb location: wrong.


  I can think of at least two rules that fit all of this. One is a harm-prevention
  rule: you may lie, break a promise, or take stuff only to prevent serious, otherwise-unpreventable
  harm, but you may never inflict serious physical harm yourself as your means. The
  other is a respect rule: you may bend those norms to prevent serious harm, but never
  in a way that uses someone merely as a means or overrides the person''s own say
  about their good. And of course the third candidate is Iris''s own particularism,
  which says there''s no rule at all and the salience of features just keeps flipping
  case to case.


  The new case is this: two climbers are alone, one is pinned and will die unless
  the other immediately amputates the pinned climber''s arm with a knife; the pinned
  climber is unconscious and hasn''t consented, but is a reasonable person who would
  obviously want to live. My question: what do you think Iris would say about the
  amputation case if she''s being consistent, which rule (harm-prevention, respect,
  or no-rule particularism) best explains her track record, and what''s the closest
  earlier case? Which future case would most cleanly tell those three apart? And honestly,
  is she actually a particularist or is she just a generalist with a fancier vocabulary?


  End with \answer{permissible} or \answer{wrong} or \answer{underdetermined} for
  your best guess about Iris''s verdict on the amputation, and say why in a sentence.


