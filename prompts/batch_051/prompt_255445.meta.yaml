  Commitments:


  1. In a sequential decision problem where each agent has a private binary signal
  of equal quality and observes only the actions (not the signals) of predecessors,
  it can be perfectly rational for an agent to act against their own private signal
  and follow the majority once the public history is sufficiently lopsided. This is
  just Bayesian updating on the information contained in others'' actions.


  2. Such a process can lock a group onto the wrong action even when each individual
  is fully rational, because once a cascade starts, later actions no longer reveal
  the later agents'' private information.


  3. Nevertheless, there is something epistemically defective about joining a cascade:
  an agent who suppresses their own signal is failing to make their information available
  to the group, and a community in which everyone followed the individually rational
  rule would be worse at tracking the truth than one in which agents sometimes deviated
  to act on their own information.


  4. Cascades are fragile in the ideal model: a small amount of public information,
  or the appearance of a single agent known to have a highly accurate signal, can
  overturn a long-standing cascade.


  5. In real-world herding — fads, market bubbles, technological adoption — the striking
  fact is persistence: herding seems highly robust, and deviations are rare and costly.
  I take this to show that the ideal Bayesian story, despite being correct on its
  own terms, is not the main engine of real herding; real herding is mostly driven
  by reputational and payoff externalities.


  6. I also hold that a rational agent who knows they may be in a false cascade should
  still join it if their own signal is weak, because the expected accuracy of the
  accumulated public history is higher than that of their own signal. It is not spinelessness;
  it is the correct response to asymmetric information.


