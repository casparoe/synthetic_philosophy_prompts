  Domain: Negative utilitarianism and suffering-focused ethics.


  A realistic "suffering-focused" person might hold:


  1. The badness of suffering is not merely the mirror image of the goodness of happiness:
  intense suffering has a weight that no amount of mild pleasure can offset (a lexical
  or near-lexical priority of suffering).

  2. When we decide whether to bring new sentient beings into existence, the presence
  of suffering in the life counts against creating it, but the presence of happiness
  does not count in favor (an asymmetry in procreative ethics).

  3. We should reject the "benevolent world-exploder" conclusion: it would not be
  right to painlessly eliminate all sentient life, even if doing so would prevent
  all future suffering.

  4. We have strong pro tanto reasons to intervene in nature to reduce wild animal
  suffering (e.g., by preventing predation or treating disease), not merely to leave
  nature alone.

  5. Morality is impartial and agent-neutral: a stranger''s suffering matters just
  as much as my own, and I should not give special weight to my own interests or those
  of my loved ones in deciding what to do.

