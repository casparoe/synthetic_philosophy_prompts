  The standard Rietdijk–Putnam argument: Because simultaneity is relative, what is
  "present" for one observer includes events in the "future" of another observer (for
  spacelike separated events). For any event M on my worldline now, and any event
  E that is spacelike separated from M (which includes some events that are later
  in time than M? In spacetime, an event with larger time coordinate but more spatial
  distance can be spacelike separated), there is a frame in which M and E are simultaneous.
  If we accept that "what is simultaneous with me is real/present," then E is real;
  since E may be in what my frame calls the future (but spacelike separated), the
  future already exists. So the argument concludes that the distinction between past,
  present, future is not objective, supporting a block universe / eternalism. Caution:
  it only covers spacelike separated "future" events, not future events in one''s
  own light cone; but the argument is often taken to undermine objective present globally.
  Many philosophers note it only shows that "the present" is not invariant, not that
  determinism follows for local future events (timelike). But the claim "future is
  real" roughly.


