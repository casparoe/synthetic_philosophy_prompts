  "Below is a task for a dialogue. In a seminar on public law, two participants are
  discussing an old common-law maxim that purports to explain why the sovereign cannot
  be sued: Rex non potest peccare, or ''the king can do no wrong.'' The first participant,
  a civil lawyer, holds that this maxim is best reconstructed as a normative and institutional
  rule: the state, as a legal person, is constituted by the very norms that would
  supply the standards for wrongdoing, so there is no outside standpoint from which
  the state itself can count as a wrongdoer; particular officials can wrong, but the
  state cannot, because the state is not an agent in the ordinary sense. The second
  participant, a public-law scholar, holds that the maxim is not a conceptual truth
  but a legal fiction that has long been used to block accountability; the state is
  a corporate agent with decision procedures and can be said to commit wrongs in a
  perfectly intelligible way, and sovereign immunity is just a defense the legal system
  chooses to allow. Write a substantial dialogue between them, around 900-1,200 words,
  in which each responds to the other''s actual arguments and neither is a strawman.
  The dialogue should make contact with questions about artificial personality, the
  difference between ''not liable'' and ''cannot wrong,'' the possibility of legal
  wrongs that the law itself refuses to remedy, and whether removing the immunity
  would entail treating the state as an ordinary private person or could preserve
  something distinctive about public law. End not with a forced resolution but with
  the sharpest remaining disagreement."


