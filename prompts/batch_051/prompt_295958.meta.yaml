  Draft:


  "I work as a subtitle/localization editor, and a few months ago I started reading
  Quine in an evening class because translation is, you know, literally my job now.
  Last weekend I rewatched Denis Villeneuve''s Arrival for the first time since I
  started doing this work, and it got under my skin. The film is built around Louise
  Banks doing what Quine would call radical translation: she has no shared language,
  no shared history, almost no shared biology with the heptapods, and she has to build
  a translation manual from scratch out of their behavior and their inkblot logograms.
  So far so Quinean. But the film ends up asserting, pretty strongly, that once Louise
  really learns Heptapod B she gains access to their physics — she experiences time
  the way they do, sees her own future, and uses that knowledge to change events.
  That seems to me like the screenplay is assuming there''s a determinate fact of
  the matter about what the alien sentences mean, and that the right translation isn''t
  just behaviorally adequate but is somehow the true one. Quine''s position — the
  "gavagai" stuff — says that''s exactly the sort of thing we should be skeptical
  of: the totality of behavioral evidence underdetermines the translation manual,
  and there''s no fact of the matter (in the native''s head or anywhere else) that
  picks out the unique correct one."


  Then ask: "So here''s what I want. Could you be a philosopher of language who also
  takes film seriously and do a careful reading of Arrival against Quine''s indeterminacy
