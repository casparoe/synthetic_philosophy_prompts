  I''m a cognitive neuroscience postdoc whose lab works with Bernard Baars''s global
  workspace theory and Stanislas Dehaene''s global neuronal workspace model. In our
  lab meetings, "conscious" basically means globally broadcast information that is
  available to executive functions, verbal report, and memory; anything not in the
  workspace is unconscious. A colleague pressed me on whether this vocabulary can
  even state what Ned Block is worried about in his 1995 Behavioral and Brain Sciences
  article "On a Confusion about a Function of Consciousness." I know the paper by
  reputation but want to work through it systematically. Here is the passage he pressed
  me with:


  [passage]


  Restate Block''s distinction between phenomenal consciousness and access-consciousness,
  and his blindsight-based argument about functions, in the vocabulary I actually
  use — global workspace, broadcasting, ignition, competition among processors, availability
  to executive systems, reportability, and so on — as faithfully as you can. Then
  give me the residue report: which of Block''s claims translate cleanly into workspace-theoretic
