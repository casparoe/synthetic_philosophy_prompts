  the argument goes wrong. Your comments should be precise enough that the student
  could use them to repair the answer.


  Here is the exam question:


  Explain, in terms of varying-domain Kripke semantics for quantified modal logic,
  what the Barcan formula (BF) and the converse Barcan formula (CBF) require of the
  domains of possible worlds. State BF and CBF precisely. Then say which condition
  on domains along the accessibility relation—increasing, decreasing, or neither—is
