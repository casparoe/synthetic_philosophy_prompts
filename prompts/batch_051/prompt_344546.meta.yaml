  ---


  Act as a philosopher of language who has thought a lot about understanding and about
  machine translation — you can take the old Hofstadter objection to statistical translation
  as background, but skip quotes and citations.


  I recently started pre-screening machine-translated asylum interviews at a legal
  aid office, meaning I decide which sentences are safe for the attorney to rely on.
  Ive realized I can''t actually say what I''m asserting when I tell a colleague that
  the translation engine "doesn''t really understand" the Spanish. I want a working
  definition of understanding a sentence — not translation quality, but what it is
  for a person or system to understand a sentence in the course of handling it.


  Here are cases I want the definition to sort. (1) A professional court interpreter
  who can translate an idiomatic line, then explain what it presupposed and why a
  literal rendering would mislead the jury. (2) An old rule-based system that replaces
  each Spanish word with its single most frequent English dictionary entry; it gets
  very simple sentences sort of right and turns figurative language into word salad.
  (3) A retrieval system with access to 50,000 memorized Spanish–English sentence
  pairs; for anything on the list it returns a fine human translation, for anything
  slightly new it is helpless. (4) A translation-memory tool of the kind professionals
  use, which pulls an exact human translation from a subtitle corpus; the output is
  typically flawless. (5) A modern neural MT system that handles news articles and
