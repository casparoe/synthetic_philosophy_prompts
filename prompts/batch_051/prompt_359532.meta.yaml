  Bayesian conditionalization (standard): on learning E with certainty, P_new(H) =
  P_old(H | E).


  Jeffrey conditionalization (probability kinematics, 1965, The Logic of Decision):
  evidence affects the probabilities of the members of a partition {E_i} directly,
  not by making one certain. Given new probabilities q_i = P_new(E_i) over a partition
  E_i that covers the space (the evidence is "the change of the probabilities of E_i,"
  e.g., observation makes S more likely but not certain). To update other propositions
  H, one uses: P_new(H) = Σ_i q_i * P_old(H | E_i), provided "rigidity": P_new(H |
  E_i) = P_old(H | E_i) for each i. This is Jeffrey conditionalization.


  Niche issues:

  - Rigidity: the conditional probabilities inside each cell of the partition are
  held fixed. But outside the partition, other propositions may shift in ways not
  captured.

  - Order-dependence / non-commutativity: Successive Jeffrey updates on different
  partitions do not generally commute; Jeffreys updating lacks an "order-invariance"
  property. Two agents receiving the same uncertain evidence in different orders may
  end up with different posteriors. Bas van Fraassen and others have discussed. Standard
  Bayes also has order effects if evidence order matters? Actually standard conditionalization
  is commutative for two pieces of certain evidence if both are compatible? P(H|E,F)
  equals order-invariant. Yes, standard Bayes on propositions is order-invariant (conjunctive
  certainty). Jeffrey updates on different partitions can fail to commute; this is
  a real known issue.

  - The problem of "unfaithful" or "input probability" being arbitrary: Jeffrey conditioning
  requires that the agent''s new probabilities over the partition be supplied exogenously;
  it doesn''t say where they come from. Some argue this is a feature (evidence as
  uncertain) not a bug.

  - The "garble" or "Blackwell" issues.

