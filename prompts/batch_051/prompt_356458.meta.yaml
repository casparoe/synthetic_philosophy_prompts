  Core philosophical positions on promising:

  - Fidelity as a basic/sui generis duty (W.D. Ross): the act of promising creates
  a prima facie duty to do the thing because of the past act.

  - Practice/convention view (Hume, Rawls): promising is a social practice defined
  by rules; the obligation derives from the value of the institution and one''s participation
  in it.

  - Expectation/assurance view (Scanlon): wrongness of breaking a promise lies in
  the expectation you''ve voluntarily led the promisee to form; principle F: one must
  not lead others to form expectations and then disappoint them when one has reason
  to believe they''d rely.

  - Authority/transfer view (some: Shiffrin?): promising transfers a right to the
  promisee, giving them authority over whether you perform; wrong is acting against
  the promisee''s rightful say-so.

  - Reliance/trust view (Fried?): promises invoke trust, and breaking betrays trust.

  - Redundancy objection to expectation views: if the wrong is misleading expectations,
  then promising is no different from lying about one''s intentions; but we think
  breaking a promise is worse or different even when no one is misled (e.g., promise
  to a dead person? or someone who didn''t believe you).


