  he got a last-minute ticket to a game. Elena said he''d wronged the neighbor. Marcus
  said the neighbor had already lined up someone else and didn''t care, so no harm,
  no foul. What started as a scolding turned into a long argument about what actually
  makes promises bind, and they asked me to referee. I couldn''t. I''ll lay out the
  moves as best I remember them.


  (1) Elena: what makes a promise bind is the assurance. When you promise, you deliberately
  get the other person to form expectations about what you''ll do, and they then arrange
  their life around those expectations. Breaking the promise is wrong because it betrays
  the very expectation you invited. That''s why a bare prediction doesn''t bind but
  a promise does.


  (2) Marcus: but then a promise that fails to produce any expectation wouldn''t bind.
  Suppose I promise to pay you back, and you genuinely don''t believe me — you''ve
  heard it before. You make no plans. On your view I''ve done nothing wrong by not
  paying, because there was no expectation to betray. But I still owe you the money.
  So the obligation must come from the act of promising itself, not from what it happens
  to do inside your head.


  (3) Elena: fine, but ''the act itself'' is just some words. Words only have that
  kind of power if there''s a social practice behind them — promising is a rule-governed
  institution, like a game, and when you say ''I promise'' you''re making a move in
  that game. The problem is that then the obligation comes from the institution, and
  the institution is justified by its general usefulness. So why can''t I break a
  promise when breaking it won''t damage the institution — a promise made in private,
  say, where no one else will ever find out? The practice view seems to make the wrong
  impersonal and too easy to escape.


  (4) Marcus: the practice isn''t just about the institution''s overall health. The
  rules of the practice exist to protect promisees by giving them a claim on the promisor
  — that''s what makes the wrong directed at you rather than at society. And actually
  your earlier view has a worse problem: release. If the wrong is the betrayed expectation,
  then when you release me from a promise, you''re doing what — changing your expectations?
  But you can fully expect me to show up and still release me. Release doesn''t change
  your mind; it changes what I''m permitted to do. So the obligation can''t be identical
  with your expectation.


  (5) Elena: release is a fair point, but it doesn''t force me to your view. In promising,
  the promisee acquires a standing to insist or not insist — the assurance isn''t
  just a prediction in their head, it''s an entitlement. Releasing is waiving that
  entitlement, which is a normative act, not a change of mind. So the assurance view
  can handle release. But notice you''ve now given up the pure practice view too:
  you''re talking about claims and directed wrongs, which is closer to saying promising
  is just a basic moral power — that the past act of promising gives me a reason,
  full stop, like a debt.


