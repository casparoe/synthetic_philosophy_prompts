  I''m an undergraduate in a course on the philosophy of probability, and we''ve been
  reading John Venn''s The Logic of Chance alongside more recent literature on the
  reference class problem. Venn makes the point that any event or individual can be
  assigned to an indefinitely large number of classes, and the probability we assign
  depends entirely on which class we select as the basis for our judgment; there is,
  he suggests, no fact of the matter that tells us which class is the right one. I''ve
  been turning this over in connection with a concrete institutional design I''m considering
  for a term paper, and I''d like your help analyzing the mechanism.


  Suppose a university''s administration sets up a Predictive Score Tribunal to assign
  each student a graduation-probability score, which will be used for early-warning
  outreach and for allocating tutoring resources. The rule is this: for any student,
  anyone in the university community—academic advisors, instructors, administrators,
  even the student—may nominate a reference class (for example, "students in this
  major with this number of failed courses," "first-generation students with this
  high school GPA band," etc.). The Tribunal maintains a public model that, for each
  nominated class, records the class''s historical graduation frequency and a running
  calibration score based on how well that class frequency has predicted outcomes
  for students assigned that class in the past. To produce the student''s score, the
  system takes a weighted average of the frequencies of all nominated classes, with
  weights proportional to each class''s past calibration and capped so no single class
  can receive more than a quarter of the total weight. Any nominator whose class improves
  the system''s calibration over the next year receives a small budget increase or
  administrative credit; any nominator whose class systematically degrades calibration
  loses the right to nominate classes for a semester.


  What I''d like from you is not a verdict on whether this is fair or unfair in general,
  but a detailed account of how it would actually play out: what incentives it creates
  for advisors, instructors, students, and the administration; how people might game
  the nomination or calibration system; how the score distribution might shift over
  time; whether the mechanism would solve Venn''s problem or simply relocate the arbitrariness
  into the weighting and nomination rules; and whether any of the failure modes could
  be fixed without abandoning the core idea.


