  Let''s craft prompt:


  "So I''m trying to pin down whether disgust can ever count as a moral response,
  not just a sensory one. I keep coming back to Darwin, in The Expression of the Emotions
  in Man and Animals, chapter XI. He talks about how disgust starts from things offensive
  to taste, but then the word gets extended to anything that excites a similar feeling
  through smell, touch, or even sight. At one point he says that a native of Tierra
  del Fuego touched some cold preserved meat and showed disgust at its softness, and
  Darwin felt disgust at the food the man had touched. So a sensory reaction, maybe
  a bit of retching movement around the mouth, can attach to something because of
  contact with a person or category.


  Here are the criteria I''ve been using for a moral emotion: (1) it''s directed at
