  I recall the absent-minded driver problem by Piccione and Rubinstein (1997). A driver
  on a highway plans to exit at the second exit. He is absent-minded: when reaching
  an exit, he cannot distinguish whether it is the first or second. Exiting at the
  first exit gives payoff 0, exiting at the second gives payoff 4, and not exiting
  at all gives payoff 1. At the behavioral strategy, he must choose the same probability
  p of exiting at each exit. Expected payoff = p*(1-p)*4 + (1-p)^2 * 1? Wait evaluate:
  with probability p he exits at first, payoff 0. With probability (1-p)*p he goes
  past first then exits at second, payoff 4. With probability (1-p)^2 he drives past
  both, payoff 1. Expected = 4p(1-p) + (1-p)^2. Maximize: derivative 4 - 8p -2(1-p)
  = 4 - 8p -2 + 2p = 2 - 6p = 0 => p = 1/3, payoff = 4*(1/3)*(2/3) + (2/3)^2 = 8/9
  + 4/9 = 4/3? Wait 8/9+4/9=12/9=4/3. Then "at the intersection" reasoning (he might
  think he''s at the first with some probability) yields different p? The paradox
  is that ex ante optimal is p=1/3, but when he finds himself at an intersection,
  he might re-evaluate and choose differently. It''s a known paradox about imperfect
  recall and time consistency.


