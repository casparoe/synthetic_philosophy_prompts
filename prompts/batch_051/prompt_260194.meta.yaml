  The frame problem: originally in AI (McCarthy & Hayes 1969), arises in representing
  effects of actions in logic: how to specify what does NOT change without enumerating
  frame axioms; then broadened (Dennett) to the problem of relevance: how a cognitive
  system ignores irrelevant information/updates. The STRIPS assumption: an operator/action
  schema has preconditions and add/delete lists; anything not in the add/delete lists
  remains unchanged. This is the "STRIPS assumption" or "STRIPS representation." It
  presupposes that the world is decomposable into atomic facts, that actions have
  a small set of relevant effects, and that non-changes are the default. It works
  because environments are designed to be small and changes are localized. It presupposes
  the "closed world assumption" in a sense? Actually the frame assumption is related
  to the closed-world assumption about facts: facts not mentioned in effects remain
  true, i.e., no hidden ramifications. It presupposes that all relevant consequences
  are explicitly enumerated—that the system has solved the relevance problem by fiat.
  It presupposes a view of change as a set of local, independent state transitions,
  similar to a causal view where an action''s effects are a small list and everything
  else is independent.


