  The slogan "the people''s safety is the highest law" can be disambiguated into:

  1. Descriptive/deference: courts should and do defer to emergency measures because
  they protect safety (a claim about judicial behavior).

  2. Interpretive: all existing law implicitly contains a safety exception, so any
  measure protecting safety is already legal (continuitist).

  3. Legitimacy-over-legality: when legality conflicts with public safety, legitimacy
  (or necessity) overrides legal form, so the measure is justified even if illegal.

  4. Definitional: what the law is just is whatever serves the people''s safety, so
  legality is defined by the end.

  5. Authoritative: the safety of the people is the chief aim of the state, and so
  it authorizes extraordinary power.

  6. Rhetorical: a placeholder for "trust us" / "the ends justify the means."


