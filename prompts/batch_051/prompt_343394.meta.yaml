  Let''s think through the philosophical structure to craft a determinate question.


  Original:

  P1. Before release, Mary knows all physical facts about color vision.

  P2. Before release, Mary does not know what it is like to see red.

  P3. On release, she learns what it is like to see red.

  C. There is a non-physical fact (the what-it-is-like fact); physicalism false.


  Standard replies:

  - Ability hypothesis (Lewis, Nemirow): Mary gains an ability (to imagine, recognize,
  remember red), not a fact.

  - Acquaintance hypothesis (Conee): she gains acquaintance with an experience, not
  propositional knowledge (or "knowledge by acquaintance").

  - Phenomenal concept strategy (Loar, Papineau, Tye): she gains a new concept (phenomenal
  red) referring to the same physical property; the fact she learns is a physical
  fact under a new mode of presentation. So no new non-physical fact.

  - A priori physicalism? Some deny P2/P3 by saying she could deduce what it''s like
  from physical facts (rare).

  - Old facts/new guise (Churchland?): she learns an old fact under a new guise.


