  Prompt draft:


  "I''m a software engineer, not a philosopher, but I''ve been pulled into a question
  about what ''function'' means in biology and I''d like a careful analysis. Please
  read this as something between systems thinking and ontology.


  Here''s the background as I understand it. In 2012 the ENCODE consortium reported
  that about 80% of the human genome has some detectable biochemical activity — being
  transcribed, bound by a regulatory protein, chemically modified, and so on. Much
  of the press coverage took this as a refutation of the older ''junk DNA'' idea:
  the genome is mostly functional after all. Many biologists pushed back, saying that
  pervasive biochemical activity does not show that a sequence is doing something
  important, let alone that it was preserved by natural selection; most of the genome
  may still be junk in the sense that matters.


  The conceptual issue seems to be that the word ''function'' is doing at least two
  jobs, and philosophers of biology have a distinction that maps onto this. On one
  account, roughly, the function of a thing is what it was selected for: a heart''s
  function is to pump blood because hearts were favored by natural selection for pumping
  blood. On a second account, the function of a thing is its causal contribution to
