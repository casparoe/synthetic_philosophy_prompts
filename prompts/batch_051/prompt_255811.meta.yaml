  Draft:


  "I am reworking the unit on normative ethics for a course I teach, and I realize
  that I keep appealing to simplicity when I compare theories without being able to
  say what work it is doing. I have assembled my own reactions to a series of concrete
  comparisons, and I would like someone to tell me whether there is a coherent principle—or
  a small set of them—behind the pattern, and, if not, which reactions I must abandon.


  Here are the verdicts. First, if two theories yield exactly the same verdicts about
  every case I care about, and one of them derives everything from a single principle
  while the other postulates three mutually independent principles, I unhesitatingly
  regard the one-principle theory as better, and I do not think this is merely an
  aesthetic preference. Second, if the one-principle theory gets a single serious
  case wrong—for example, it tells me to push a large person onto the tracks to stop
  a runaway trolley from killing five, which I cannot accept—I no longer care that
  it is simpler; I prefer the pluralist theory that handles the case, even if it is
  clumsier. So parsimony seems to weigh only after fit is secured, not against loss
  of fit. Third, I do not count a theory as simple when it has one principle plus
  seven nested exception clauses; I would rather have a clean two-principle theory
  than that. Complexity, I feel, can hide in the exceptions rather than in the number
  of principles. Fourth, I am more tolerant of a second principle that shoulders roughly
  half of the explanatory work than of one that exists only to mop up a single marginal
  case; a patch added solely to save a theory from a counterexample strikes me as
  a vice. But fifth: I recently considered a maximizing consequentialism with one
  counterintuitive implication—it had to permit punishing an innocent person to prevent
  a riot. A pluralist theory blocked the implication by adding a constraint against
  using a person merely as a means. That constraint was introduced exactly to handle
  the kind of case the simpler theory got wrong, yet I do not regard it as a mere
  patch; I prefer the pluralist theory. So I am pulled in two directions: an extra
  principle that exists to fix one failure can look like an objectionable patch in
