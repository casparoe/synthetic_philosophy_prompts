  My working title is ''The Mind of the Hive Is Not in the Hive''. The essay would
  start from the observation that an ant colony does things that look intelligent
  - it finds food, defends itself, moves nest sites, adjusts to seasons - even though
  no individual ant understands these tasks. This is usually explained by saying the
  colony is a kind of self-organising system: simple local rules produce complex collective
  behaviour. I want to push back against the way this point is often extended. People
  sometimes say that because the colony behaves in clever ways, it has a mind in the
  same sense that a human being has one. I think that conclusion is too fast.


  My central idea is to distinguish two senses of the word ''mind''. In the first
  sense, a mind is whatever produces flexible, goal-directed behaviour by integrating
  information from many parts of a system. Call this the ''functional sense''. In
  the second sense, a mind is the thing it is like to be a particular unity; it is
  a perspective, a single point of view on the world. Call this the ''experiential
  sense''. My argument would be that an ant colony may qualify in the functional sense,
  but we have no reason to think it qualifies in the experiential sense. The colony
  is not a point of view; it is a pattern. There is no place in the colony where the
  whole is present to itself.


  I then want to make a stronger claim. The reason many people slide from the functional
  sense to the experiential sense, I suspect, is a hidden picture of control. When
  we see purposeful behaviour, we imagine a little headquarters somewhere - a queen''s
  chamber, a brain, a central office - and we think that is where the mind sits. In
  an ant colony the headquarters does not exist, and in a brain, I gather, there is
  no single headquarters either. But in the human case the parts are so tightly coupled
  that the system can act as one; in the ant colony the coupling is looser and more
  local. My question is whether ''tight coupling'' is enough to ground an experiential
  point of view. I think it may be necessary, but I am not convinced it is sufficient.


  Finally, I want to suggest that the question ''can an ant colony have a mind?''
  is not primarily a factual question about ants. It is a question about how far our
  concept of a mind can stretch before it stops doing useful work. If ''mind'' just
  means ''a system that solves problems'', then we should say yes about the colony,
  but we have not said anything deep - we have just relabelled the problem-solving.
  If ''mind'' means ''a single experiencing subject'', then we should probably say
  no, but we owe an account of why a human brain counts and a colony does not.


  I would be grateful for comments on the following, in British English. First, is
