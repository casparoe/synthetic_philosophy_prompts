  But I must be careful about the details of Harsanyi''s theorem to not misstate.
  Let me recall the theorem.


  Harsanyi''s aggregation theorem (1955): Suppose there are n individuals. Each individual
  i has a preference relation over lotteries over social alternatives that satisfies
  the von Neumann–Morgenstern axioms, so it can be represented by a utility function
  u_i (unique up to positive affine transformation). A social planner (observer) also
  has preferences over lotteries satisfying the vNM axioms, represented by a social
  utility function W. If the social preference satisfies the Pareto condition (if
  all individuals are indifferent between two lotteries, then society is indifferent;
  or if everyone weakly prefers one, society weakly prefers it — actually Pareto indifference
  plus?), then W must be a weighted sum of the individual utilities: W = Σ a_i u_i,
  with weights possibly zero (and at least some positive? Actually with strong Pareto,
  weights positive). This is the "aggregation theorem". The interpretation: it seems
  to show that any social welfare function satisfying minimal rationality (vNM) and
  Pareto must be utilitarian (weighted sum). This is used to defend utilitarianism;
  but there are well-known objections:


  1. The vNM utility functions are only unique up to positive affine transformations;
  interpersonal comparisons are not meaningful from vNM utilities alone. The weights
  a_i are not uniquely determined without interpersonal comparisons; different choices
  of scaling for individual utilities change the weights. So the theorem is compatible
  with any weights (and with zero weights). It doesn''t pin down a unique utilitarian
  SWF; it just says it''s additive in some representation. So it doesn''t solve the
  interpersonal comparison problem.


  2. The theorem assumes the social observer''s preferences satisfy the vNM axioms.
  Why should rationality at the social level require satisfying the same axioms as
  individual rationality? In particular, the independence axiom at the social level
  rules out egalitarian/prioritarian concerns, e.g., a social planner who is risk-averse
  with respect to the distribution of well-being (ex post egalitarianism) or who cares
  about fairness. John Broome, Peter Diamond''s famous counterexample: Diamond (1967)
  argued that a social planner may be indifferent between giving a good to person
  A or B (coin flip) but prefer giving it to A for sure over a 50-50 lottery — actually
  Diamond''s example shows the planner may prefer fairness, violating the independence
  axiom; e.g., society might be indifferent between a 50% chance that A gets it and
  50% chance B gets it and the reverse, but prefer a lottery that gives each a fair
  chance over one that gives it to a single person with certainty. The social observer
  might not satisfy independence because they care about the fairness of the process
  (ex ante fairness), not just the distribution of expected utilities.


  3. The distinction between ex ante and ex post: Harsanyi''s theorem treats social
  preferences over lotteries. If the social observer cares about ex post equality
  (the distribution of final outcomes), then even with vNM individual utilities, the
  social objective might be a nonlinear function of individual ex post utilities (e.g.,
  a prioritarian or egalitarian SWF), which would violate the vNM axioms at the social
  level. So the theorem''s conclusion (additive separability) is partly an artefact
  of imposing the independence axiom on social preferences.


  4. The Pareto condition itself can be questioned, especially ex ante Pareto: a policy
  might increase everyone''s expected utility but be ex post worse for some; Harsanyi''s
  use of Pareto across lotteries (ex ante) is stronger. Broome''s work emphasises
  this.


  5. Sen''s critique: interpersonal comparability and the informational basis. The
  vNM framework is too narrow; Arrow''s impossibility theorem shows that with ordinal,
  non-comparable utilities, aggregation is impossible; Harsanyi needs cardinal, comparable
  utilities to make the weights meaningful, but vNM cardinality is not enough for
  comparability.


  6. The weights and "impartiality": Harsanyi originally added an impartiality assumption
  (the observer''s preferences are "impersonal" — he imagines the observer has an
  equal chance of being anyone). Harsanyi''s impartial observer theorem: if the observer
  is impartial in the sense of being indifferent between being any person (equiprobability),
  then the weights are equal, yielding average utilitarianism. But this extra assumption
  is substantive, not a rationality condition. The aggregation theorem alone yields
  weighted utilitarianism, with no constraints on weights beyond non-negativity. So
  the move from the theorem to utilitarianism requires the further impartiality assumption,
  which is a moral premise.


  7. There''s also the issue that vNM utility represents risk preferences, not necessarily
  welfare or well-being; using it as the unit of utility for welfare is contentious.


  8. "What would count against it" — since the formal theorem is true (given its axioms),
  the question is what would count against the claim that it establishes or strongly
  supports utilitarianism. Defeaters include: formal results showing the theorem is
  sensitive to framework (e.g., if you weaken the axioms, you get prioritarian/egalitarian
  forms); empirical/intuitional evidence that rational impartial observers have non-vNM
  preferences (Diamond''s fairness example); argument that the Pareto principle is
  less compelling than the vNM axiom on social preferences, so one should give up
  the latter or the former, and giving up the social vNM axiom dissolves the utilitarian
  conclusion; the fact that the weights are arbitrary without interpersonal comparisons,
  so the theorem is compatible with radically inegalitarian weighting, hence doesn''t
  vindicate utilitarianism per se.


