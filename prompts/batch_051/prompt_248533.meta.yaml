  Draft:


  "Consider the following position, which I am inclined to accept. Harsanyi''s aggregation
  theorem, in its standard form, says this: if each individual''s preferences over
  lotteries satisfy the von Neumann–Morgenstern expected-utility axioms, and the preferences
