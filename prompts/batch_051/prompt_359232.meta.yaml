  Williams''s integrity objection in "A Critique of Utilitarianism" (in Smart & Williams,
  Utilitarianism: For and Against, 1973). Two famous examples:

  - George the chemist: George is out of work, has family, but is morally opposed
  to chemical/biological weapons research; he''s offered a job in a lab doing such
  research; if he refuses, a more zealous person will take it and research pursued
  more vigorously. Utilitarian calculation says take the job, but this ignores George''s
  integrity — his projects and commitments.

  - Jim and the Indians: Jim stumbles into a South American village where a military
  captain has 20 Indians lined up to be shot to protest recent anti-government protests;
  since Jim is a foreign guest, captain offers Jim the "honor" of shooting one, after
  which the other 19 will be released; if Jim refuses, all 20 shot. Utilitarian says
  shoot one. Williams argues this calculation neglects Jim''s integrity, his agency,
  the fact that it''s his act, and that he cannot just detach from his own projects.


