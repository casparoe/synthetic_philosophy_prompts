  ---


  I hold a conciliationist view about peer disagreement. The version I accept is roughly
  the equal weight view: when I find that someone I have good reason to regard as
  my epistemic peer — someone about as likely as I am to assess the evidence correctly
  on this matter, with access to the same evidence — holds a different view on a proposition
  I have considered, I should move substantially toward their credence, and often
  split the difference. The view is motivated in part by Adam Elga''s "Reflection
  and Disagreement" (2007) and David Christensen''s "Epistemology of Disagreement:
  The Good News" (2007). Elga''s paper contains a passage, early in his statement
  of the equal weight view, where he says — I''ll paraphrase — that once you have
  learned that a peer has a different take, your evaluation of your own reasoning
  should be no more trusted than your evaluation of theirs, because the disagreement
  itself undermines the thought that you have correctly judged the shared evidence.
  Christensen''s restaurant arithmetic case, where an equally competent friend gets
  a different share, is another route to the same result.


  I want to know what would genuinely count against this view. Please give me the
  defeaters, sorted by how decisive they would be, and distinguish three categories:
  (1) things that would be fatal — if they happened or were shown true, conciliationism
  should be abandoned or radically restricted; (2) things that would be merely awkward
  — they put pressure on the view and call for revision of detail but don''t topple
  it; and (3) things a committed conciliationist would reasonably dismiss as not counting
  against the view at all, because they target a strawman or concern a different project.


  For each candidate defeater, tell me: the observation, intuition, or argument as
  it would actually arise; why it threatens the view; and how a sophisticated conciliationist
  should respond — either by accommodating it, showing it doesn''t engage the view,
  or admitting it as a genuine cost. I am especially interested in defeaters that
  do not frontally target the peer assumption: for example, results about the epistemic
  significance of introspection or self-trust, considerations about disagreement with
  future or past selves, cases where the other person is merely your superior in one
  respect but your inferiors in many others, and the possibility that the equal weight
  view collapses into a kind of skepticism. Which of these are live rather than merely
  logically possible? Finally, give an honest assessment: has this position, in your
  hands, been qualified into unfalsifiability, and if so, is that a vice here or an
  acceptable feature of a view about rational response to evidence?


  ---


