  Plausible popularizer summary:


  "David Lewis''s modal realism holds that every way the world could be is a real,
  concrete universe just as full-blooded as our own. The actual world is just the
  one we happen to inhabit; ''actual'' is an indexical term, like ''here'' or ''now''.
  Possible worlds are not abstract representations or linguistic constructions; they
  are made of flesh and blood, tables and chairs, and people, and there is no causal
  or spatiotemporal connection between distinct worlds. To say ''there could have
  been flying pigs'' is true because there is a world containing flying pigs. To say
  ''I could have been a plumber'' is true because there is a counterpart of you in
  another world, a person sufficiently similar to you in relevant respects, who is
  a plumber. Lewis knows this sounds unbelievable, and he says the theoretical benefits
  are worth it: possible worlds give us a reductive account of modality, counterfactuals,
  properties (as sets of possibilia), and propositions (as sets of worlds). His view
  refutes conventionalism about possibility because it makes possibility a matter
  of genuine existence, not of our conventions."


