  Prompt text:


  I''m reading the concluding chapter of an introductory ethics textbook that summarizes
  Sidgwick at the end of a section on the Methods of Ethics. The passage reads roughly
  as follows: Sidgwick set out to find the supreme principle of morality by examining
  the ordinary moral consciousness, but he found that common-sense morality is just
  a set of unreflective rules and that only one method survives critical scrutiny:
  utilitarianism. He tried to prove utilitarianism on hedonist grounds, arguing that
  the only reasonable ultimate end is pleasure and that universal pleasure is the
  rational goal. But he then discovered a fatal problem at the heart of his system:
  rationality demands impartial concern for everyone''s happiness, yet it also demands
  that each person pursue their own happiness, and these two demands conflict whenever
  self-interest and the general good diverge. This contradiction, which he called
  the dualism of practical reason, showed that ethical reasoning breaks down: reason
  gives two contradictory answers to the same question, so no version of rational
  morality can succeed. Sidgwick concluded that in a conflict between duty and self-interest
  there is nothing more to say, that ethics cannot be rationally vindicated, and that
  attempts to ground morality in reason depend in the end on a non-rational preference
  for impartial benevolence over self-love. I suspect this is unfaithful in some ways,
  but it''s in a published textbook and the author is a professional philosopher.
  Can you go through the passage and tell me what a careful Sidgwick scholar would
  accept, what she would call a simplification, and what she would reject as wrong?
  I''d especially like to know whether the final conclusions follow from the parts
  that are accurate, and what is actually left open or unresolved in Sidgwick rather
  than refuted.


