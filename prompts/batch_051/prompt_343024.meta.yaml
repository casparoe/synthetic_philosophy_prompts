  Exam question:


  "In ''The Methodology of Positive Economics'' (1953), Milton Friedman advances a
  thesis about the role of assumptions in economic and scientific theorising, often
  called the F-twist. Reconstruct that thesis in your own words. Then, using either
  Friedman''s billiard-player example or an example from the natural sciences such
  as the ideal gas law, explain why a theorist might accept the thesis. Finally, present
  the strongest objection you can to the thesis and say how Friedman, or one of his
  defenders, might reply. Would the objection be weaker or stronger if the theory''s
  predictions were largely correct but its central assumptions were known to be false?"


  This is good and in the weeds. The student answer should then address it.


  Student answer draft:


  "Friedman''s F-twist is the claim that the realism of a hypothesis''s assumptions
  is irrelevant to whether the hypothesis is scientifically good, and that what matters
  is only its predictive accuracy. He points out that the most important hypotheses
  in economics and science have assumptions that are wildly inaccurate descriptions
  of reality, and he takes this to show that unrealistic assumptions should not be
  counted against a theory. For example, he considers an expert billiard player who
  shoots as if he had deliberately solved the equations of Newtonian mechanics; the
  hypothesis that the player behaves this way predicts the shots well even though
  the player does not actually perform those calculations. Friedman''s point is that
  we care about the predictions of the hypothesis, not about the psychology of the
  player. The same logic supports a natural-scientific example: the ideal gas law
  assumes that molecules are point particles with no mutual attraction and perfectly
  elastic collisions, all of which are false for any real gas, yet the law predicts
  the pressure–volume–temperature relation of dilute gases well. On Friedman''s view,
  a false assumption of this kind is not a defect, because the law does its predictive
  work.


  One objection is that this reduces science to curve-fitting: if only predictive
  success matters, a model constructed purely to track past data without any real
  mechanism would count as a good theory. Friedman might reply that the relevant standard
  is predictive success in new cases, not fitting data already in hand. But this reply
  turns his position into Popperian falsificationism, which I think he accepts; in
  practice Friedman''s methodology is just the requirement that a theory survive stringent
  predictive tests. I think the objection is stronger when the assumptions are known
  to be false and the theory nevertheless predicts well: the ideal gas law predicts
  many gas properties accurately, but treating molecules as non-interacting points
  means the model cannot be extended to dense gases or explain why it works, so we
  should not call it a good theory merely because its predictions are decent."


