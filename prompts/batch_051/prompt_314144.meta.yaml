  must have some state at t=1, and by continuity/induction... A common fallacious
  argument: "Before t=1, the lamp has been switched infinitely many times; the state
  at t=1 is whatever state results from the last switch; but there is no last switch;
  contradiction. Therefore such a supertask is impossible." Is Thomson''s own argument?
