  Thomson 1954 "Tasks and Super-tasks": The lamp is on at t=1? If on, then it must
  have been turned on at some time and never turned off after; but every turn-on before
  t=1 is followed by a turn-off. If off, similarly every turn-off is followed by a
  turn-on. Thus it can''t be on or off, contradiction. But the standard reply is that
  the instructions don''t determine the state at t=1; the function is discontinuous,
  and there''s no contradiction—the lamp is simply not specified at the limit. So
  the argument has a flaw: it assumes the state at the limit must be a causal result
  of immediately preceding states; but for a function with no limit, the value can
  be stipulated arbitrarily or left undefined. The supertask is not impossible; the
  description is incomplete.


