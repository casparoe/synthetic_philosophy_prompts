  The background, as our group summarized it: Williamson defines a condition as luminous
  just in case, whenever it obtains, the subject is in a position to know that it
  obtains. He argues that no mental condition is luminous. His strategy is to consider
  a person who feels cold at dawn and gradually warms up until, at noon, they no longer
  feel cold. If feeling cold were luminous, then at every moment during the transition
  when they still felt cold, they would be in a position to know they felt cold. But,
  Williamson claims, knowing that one feels cold requires a margin for error: if one
  knows one feels cold at a given moment, then one would also feel cold at a very
  nearby moment. Applying this margin-for-error principle repeatedly across the series
  would force the person still to feel cold at noon, which is false. Therefore feeling
  cold is not luminous, and the same structure is supposed to generalize to any mental
  condition.


  Dana read this as a direct refutation of the KK principle—the principle that if
  a person knows a proposition, then they are in a position to know that they know
  it. Her reasoning was that if no mental condition is luminous, then a person can
  know that they feel cold without being in a position to know that they know it.
  Otherwise, being in a position to know that one feels cold whenever one feels cold
  would just be luminosity for coldness, which Williamson has ruled out. So, she concluded,
  anti-luminosity is really an argument against the second-order access that KK demands.


