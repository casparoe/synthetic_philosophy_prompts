  Infinite regress arguments: A regress is an infinite sequence of items, each of
  which depends on / explains / justifies the previous. A regress is "vicious" when
  it''s unacceptable — e.g., when it makes the original claim impossible, or when
  each step presupposes the very thing to be explained, or when it generates an infinite
  chain of obligations that can never be discharged. Regresses can be benign/harmless,
  e.g., an infinite chain of causes in some cosmologies, or the infinite sequence
  of truths "p, it''s true that p, ..." which is not vicious.


  Philosophical criteria for viciousness (from literature, e.g., Nolan, Gratton, Passmore,
  Wieland): a regress is vicious if (a) it cannot be completed (each step is necessary
  and there''s no terminal point, so the original is never established); (b) it''s
  circular (each member depends on the next, and the whole chain depends on itself);
  (c) it''s unbounded without a grounding; (d) the regress itself is claimed to be
  impossible (e.g., an actual infinite cannot exist in some ontologies). Also the
  distinction between explanatory regress and logical regress.


  CS mappings: recursion with a base case terminates; structural recursion over well-founded
  data (finite trees) terminates by induction on the size; coinductive definitions
  allow infinite structures but require productivity (each unfolding makes progress);
  corecursion/guardedness corresponds to a benign regress where each step makes progress
  and the infinite chain can exist as a completed object (e.g., a stream); a regress
  without a base case is like a non-well-founded recursion equation whose "execution"
  diverges — which may be an error (non-termination) or may be fine if productive
  (stream). The translation: "vicious" ≈ non-termination that''s an error, i.e., undefined
  semantics; "benign" ≈ productive coinduction or well-founded induction. But the
  residue: philosophical debates about whether an infinite chain can ground truth
  or explanation often hinge on what "grounding" requires, whereas CS''s notion of
  termination/productivity is syntactic/algebraic; also, CS uses total vs. partial
  correctness, but "explanation" might require more than production (relevance, priority).
  Also, in CS, a least fixed point vs. greatest fixed point distinction: inductive
  definitions (least FP) reject infinite chains (they''re undefined), coinductive
  (greatest FP) allow them but only if guarded. This maps to vicious vs. benign regress!


