  B prompt idea:

  "I am preparing to host an on-stage conversation at a philosophy of science conference
  with the author of a new book defending an interventionist theory of causation in
  the tradition of James Woodward. Her view is, in rough outline, that what it is
  for X to cause Y is for there to be a possible intervention on X that would change
  Y (or the probability of Y), where an intervention is an idealized experimental
  manipulation that satisfies certain conditions; and that causal generalizations
  can be identified by their invariance under such interventions. Her standard reply
  to the charge that this is circular — interventions seem to presuppose causal notions
  like ''surgical'' changes, ''exogenous'' variables, and ''confounder'' — is that
  the theory never claimed to be a reductive analysis, only a model-theoretic characterization.
  Write me a sequence of interview questions for this guest. The audience will be
  a mix of philosophers of science and machine-learning researchers, and I want the
  questions to press the circularity worry progressively, but each question must be
  answerable by the guest in 3–5 minutes and must include a follow-up that anticipates
  her most likely deflection. Include at least one question about whether invariance
  can do any work in picking out causal from merely accidental regularities without
  prior causal assumptions, and end with a question that asks what empirical fact,
  if discovered, would lead her to abandon the view."


