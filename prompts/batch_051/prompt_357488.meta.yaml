  The object of analysis is a community committed to sola scriptura, understood as
  follows: the text of Scripture is the sole infallible rule of faith and practice,
  and all human interpreters, institutions, and traditions are fallible and stand
  under the text''s judgement. The community must nonetheless resolve contested readings
  — about, for example, who may hold an office, whether a practice is commanded or
  forbidden, or which texts count as Scripture in the first place — and it must be
  able to treat some resolutions as binding without denying the doctrine it began
  from.


  The difficulty is familiar enough. A judgement must itself be authorised. If the
  text authorises it, that claim rests on a reading of the text; if a church or council
  authorises it, the authorising body''s own authority is exactly what a contestant
  may deny; if sincerity, the inner witness of the Spirit, or the text''s clarity
  for the attentive reader is invoked, the criteria are themselves applied under contested
  conditions. The doctrine threatens to leave the community with no principled stopping
  point between an ungrounded magisterium and an ungoverned private judgement, each
  of which appears to make something other than the text functionally supreme.


