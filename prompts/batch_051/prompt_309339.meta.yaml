  Common responses to tragedy of commons / public goods:

  - Government regulation / command-and-control / coercion ("mutual coercion, mutually
  agreed upon" — Garrett Hardin''s phrase in "The Tragedy of the Commons" 1968). Hardin
  concluded with "mutual coercion, mutually agreed upon" for population etc.

  - Privatization / enclosure / property rights: Hardin suggested either private property
  or state control; also Demsetz argued property rights emerge when externalities
  become significant.

  - Elinor Ostrom: common-pool resource institutions can self-govern without privatization
  or state; she identified design principles (clearly defined boundaries, congruence
  between rules and local conditions, collective-choice arrangements, monitoring,
  graduated sanctions, conflict-resolution mechanisms, recognition of rights to organize,
  nested enterprises for larger systems). Communication is crucial; face-to-face communication
  dramatically increases cooperation (Ostrom et al. experiments).

  - Costly punishment: Fehr and Gächter showed that allowing participants to punish
  free-riders sustains cooperation in public goods games.

  - Reputation, repeated interaction, "the shadow of the future" (Axelrod), tit-for-tat.

  - Selective incentives: Mancur Olson, The Logic of Collective Action argued groups
  provide selective incentives to members to overcome free riding.

  - Assurance contracts: making contributions conditional on reaching a threshold;
  dominant assurance contract (Alex Tabarrok) adds a refund bonus and makes contributing
  a dominant strategy.

  - Pigouvian taxes/subsidies: tax negative externalities.

  - Coase: if property rights are well-defined and transaction costs low, parties
  will bargain to internalize externalities.

  - Cap-and-trade: marketable permits.

  - Moral suasion, appeals to conscience — Hardin actually criticized appeals to conscience
  ("if you always elicit conscientious behavior you will eventually eliminate conscience"
  maybe? He said appealing to conscience selects against conscientious people? Something
  like that). Actually Hardin argued that appeals to conscience are self-defeating
  and that conscience is self-eliminating.

  - Education / awareness.

  - Technological innovation (e.g., more efficient use reduces pressure).

  - Small group size / reducing group size increases cooperation.

  - Religious belief / ideology: Hardin''s "mutual coercion" possibly "agreed upon
  by the majority of the people affected". He said "mutual coercion, mutually agreed
  upon" is the answer, and "freedom in a commons brings ruin to all."

  - Ostracism / shaming as non-monetary sanctions.


