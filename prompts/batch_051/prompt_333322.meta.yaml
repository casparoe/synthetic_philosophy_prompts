  zero probability. The reasoning on the other side is plain: any nonzero probability,
  times an astronomically large payoff, yields an astronomically large expected value.
  I could invoke bounded utility or a probability threshold, but both seem to be introduced
  just to stop the mugger. At the same time, I already accept the same evidential
