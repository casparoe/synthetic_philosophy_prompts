  "I have, on theoretical grounds, become convinced that practical reasoning should
  maximize expected value: an outcome''s improbability matters only through being
  multiplied by its value, and any further discounting of small probabilities would
  require drawing an arbitrary line. The rule has real virtues — it is unified, it
  handles ordinary risk without ad hoc thresholds, and it explains why a tiny chance
  of a sufficiently large harm can justify serious precautions.


