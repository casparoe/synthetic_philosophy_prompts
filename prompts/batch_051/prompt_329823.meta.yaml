  A possible argument:


  (1) If "collapse" names something real, there must be a fact of the matter about
  whether a society collapsed as opposed to merely changed.

  (2) There is a fact of the matter only if there is a non-arbitrary boundary between
  a changed society and a different society.

  (3) But identity of a society over time is not determined by any non-arbitrary fact;
  populations, institutions, languages, and practices can each change by degrees while
  others persist.

  (4) So there is no non-arbitrary boundary between a changed society and a different
  society.

  (5) Therefore "collapse" does not name a real kind; it is only a rough, interest-relative
  label.


