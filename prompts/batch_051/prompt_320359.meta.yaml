  I am a retired entomologist. I spent roughly three decades working on integrated
  pest management in row-crop agriculture, and since retiring I have been reading
  moral philosophy, especially applied ethics about animals and the environment. I
  keep finding that essays on the ethics of insecticides and pest control argue from
  one vivid case—a locust campaign, a bedbug infestation, a mosquito-control program—without
  first stating what a complete account of the matter would have to get right. Before
  I read any further, I want the specification.


  Please adopt the role of a professional philosopher who works at the intersection
  of applied ethics and the philosophy of biology. I am not asking for a literature
  survey, a bibliography, or an evaluation of named positions. I want the desiderata
  themselves: the list of requirements any adequate theory of the ethics of pest control
  must meet, together with the case or consideration that makes each one a genuine
  requirement.


  Your list should at minimum address the following, though you should add anything
  else the theory must handle:


  1. The distinction between moral considerability and moral weight, and whether a
  theory must take insects seriously without simply assuming an answer to the question
  of insect sentience.

  2. The epistemics of pain: how a theory should handle current uncertainty about
  whether nociception, learning, and neural architecture in insects amount to felt
  pain, and what follows under the main plausible readings of that evidence.

  3. The biological constraints a theory cannot contradict—invertebrate nervous systems,
  r-selected life histories, population densities, ecosystem roles.

  4. The problem of scale: a single field treatment can affect millions of individuals,
  and an adequate theory must say how aggregation works without making insect welfare
  either negligible or paralyzing.

  5. The heterogeneity of contexts: protecting a crop, stored grain, a house from
  termites, a city from disease vectors, a habitat from an invasive species. Must
  one theory cover all of these, or do duties shift by context?

  6. The heterogeneity of agents: an individual homeowner, a farmer, a public-health
  authority, a conservation agency.

  7. The heterogeneity of methods: broad-spectrum neurotoxins, insect growth regulators,
  microbial entomopathogens, parasitoids and predators, sterile insect technique,
  pheromone-based mating disruption, physical and cultural control. Should how an
  insect dies matter, or only that it dies, and should non-lethal interventions be
  preferred even when less convenient?

  8. The relational character of pest status: the same species can be a pest in one
  context, beneficial in another, and neutral in a third, so the theory cannot sort
  species into fixed categories.

  9. The indirect effects: non-target mortality, harm to pollinators and natural enemies,
  resistance, secondary pest outbreaks, and effects on the broader food web.

  10. The trade-off structure: human food security and health, ecosystem integrity,
  and insect welfare can conflict, and a theory must say which conflicts admit of
  genuine dilemmas rather than easy lexical rules.


  For each requirement, say why it constrains a theory and flag whether it is non-negotiable
  or a preference of a particular camp. Then flag any pairs or subsets of requirements
  that you suspect cannot be jointly satisfied—that is where I expect the real result
  to be. Finally, tell me which single requirement does the most work in excluding
  popular positions, and why.


  Before writing, take time to brainstorm candidate requirements and then prune the
  list to what is genuinely necessary. Think carefully about the distinctions you
  rely on. Write in American English.


