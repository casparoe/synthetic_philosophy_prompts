  Actually Hume''s view: The standard of taste is the joint verdict of true judges.
  True judges are identified by qualities (delicacy, practice, comparison, freedom
  from prejudice, good sense). The circularity worry: to identify true judges we must
  already know what good taste consists in (delicacy, etc.), and we test these qualities
  using acknowledged masterpieces — but masterpieces are identified by the verdict
  of true judges. So there''s a circle. A subtle student mistake might be to claim
  that Hume avoids circularity because the criteria for true judges are entirely independent
  of aesthetic merit, when actually the test of delicacy relies on comparisons with
  works already accepted as masterpieces (or the story of the wine cask with the key
  at the bottom? That''s Sancho''s kinsmen... The wine story in "Of the Standard of
  Taste": two kinsmen of Sancho Panza taste a hogshead of wine; one detects leather,
  the other iron; the key with a leathern thong is found at the bottom. This illustrates
  delicacy of taste — discerning subtle qualities that ordinary judges miss). But
  is that circular? Delicacy is illustrated by detecting a non-aesthetic property
  of the wine, so that test itself is not aesthetic, but the application to art requires...


