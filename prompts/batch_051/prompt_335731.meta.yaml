  Draft:


  ---


  Write a proposal for a philosophy-of-biology term paper (about 6,000 words, one
  semester) on a question in the debate over biological individuality. The application
  is a course research-proposal assignment, not a grant; no citations are expected.


  The proposal should be developed from the following half-formed idea. The debate
  over whether holobionts are organisms treats "holobiont" as a host organism together
  with its persistent, coevolving microbial community (the gut microbiome of a mammal,
  the symbiotic algae and bacteria of a coral). A standard approach runs through candidate
  criteria for organismality — functional integration, metabolic interdependence,
  a reproductive bottleneck that transmits symbionts vertically, common evolutionary
  fate, being a unit of selection, or a unified immune system that distinguishes self
  from nonself — and then argues over whether holobionts satisfy them. The "yes" camp
  says that by integrationist or physiological criteria holobionts are organisms;
  the "no" camp says that by evolutionary and developmental criteria they are not,
  because the partners retain separate lineages, separate fitness interests, and not
  enough shared fate. A third camp says the answer merely varies with the criterion
  chosen, and that pluralism is the sober conclusion.


  I suspect the interesting unresolved question is not whether holobionts are organisms,
  but whether the dispute between these camps can be dissolved by making explicit
  which explanatory project — physiological, evolutionary, developmental, or immunological
  — is doing the work when a theorist calls something an organism. My half-formed
  thought is that a defensible conclusion will be a constrained pluralism: holobionts
  are organisms relative to some explanatory projects and not others, and this is
  not a semantic retreat but a substantive thesis about how different biological fields
  individuate their units. But I am not yet sure this is right; in particular, I worry
  that constrained pluralism collapses into triviality unless we can say when two
  explanatory projects may legitimately deliver different answers to the same-sounding
  question.


  Turn this into a two-page proposal. It should contain:

  1. A precise statement of the question, framed so that it has a determinate answer
  (or a determinate limited set of possible answers).

  2. Why the existing positions — strong holobiont individualism, host-centric individualism,
