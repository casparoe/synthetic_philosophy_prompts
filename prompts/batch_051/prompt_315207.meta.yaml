  Kalam argument:

  P1: Whatever begins to exist has a cause of its existence.

  P2: The universe began to exist.

  C: The universe has a cause of its existence.


  Contingency (Leibniz):

  P1: Every contingent fact/thing has an explanation/adequate reason (PSR) — either
  in another contingent thing or in a necessary being.

  P2: The universe (aggregate of contingent things) is contingent.

  C: There is a necessary being that explains the universe.


  Actually Leibniz''s PSR applies to all truths, but for the contingency argument:
  everything that exists has a reason for its existence, either in itself (necessary)
  or in another (contingent); the universe is a contingent aggregate; so its reason
  must be outside it, a necessary being.


