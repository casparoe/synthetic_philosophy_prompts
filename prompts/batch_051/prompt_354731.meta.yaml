  I spent four decades working on deterministic nonlinear systems before retiring,
  and I have only recently begun reading the philosophical literature on determinism
  in earnest. A younger colleague, knowing this, set me the following argument. He
  claims it establishes that either determinism is false or "chaos" is not an objective
  feature of the world. Since I am temperamentally a Laplacian and cannot accept either
  horn, I have been forced to look for the flaw, and I have not yet found it. I do
  not want a verdict; I want a diagnosis of the argument.


  (1) If the world is deterministic, then the exact state of the world at any time,
  together with the laws of nature, determines the exact state at every later time.


  (2) Many natural systems — the weather, turbulent fluids, planetary orbits over
  long spans — are chaotic: a difference δ in their initial state grows, on average
  and over some range, as δe^{λt}, with λ > 0.


  (3) Consequently, to keep a prediction within a fixed tolerance ε at time t, one
  must specify the initial state to within roughly εe^{-λt}.


  (4) But no finite observer can specify a real-valued state exactly; every measurement
  and every finite description is exact only to finitely many decimal places.


  (5) Therefore, for any chaotic system, every finite observer faces a horizon beyond
  which even ideal measurement would be too coarse, and prediction is impossible in
  principle — not merely difficult in practice.


  (6) Now, the state that determinism says fixes the future is an exact state, not
  a state-known-to-some-decimal-place.


  (7) So either the exact state can be grasped by a finite predictor, in which case
  (5) is false; or it cannot, in which case the deterministic thesis speaks of a state
  that no scientific inquirer could ever specify, and its claim that this state "determines"
  the future does no epistemic work.


  (8) Therefore determinism is either false or idle: chaos shows that the future is
  not contained in the present in any sense that could matter to a scientist.


  I should like to keep determinism, and I should also like to keep the conviction
  that there is a real, mind-independent difference between a chaotic but deterministic
  process and a genuinely stochastic one. Which step should be rejected, and what
  does rejecting it cost? In particular, if the answer is that a Laplacean intelligence
  with exact real-valued states could predict while finite inquirers cannot, I want
  to know whether that is an answer rather than a restatement of the problem.


