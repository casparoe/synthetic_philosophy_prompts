  principle. The claim is that a quantity of harm may enter into moral arithmetic
  only if some single subject—or at least a single continuous stream of experience—could
  be worse off by that quantity. Trillions of micro-harms distributed across trillions
  of people produce a large number, but no one is worse off by anything more than
  a speck, so the sum is a statistical artifact, not a moral fact. Within a single
  life, by contrast, harms can be summed across time (subject to ordinary discounting,
  memory decay, and so on), because there is a bearer whose life as a whole can be
  made better or worse by the total. I think this dissolves the original problem:
  the dust specks simply aren''t available as a mass that can outweigh one person''s
  agony, because there is no perspective from which that mass exists.


