  ---


  For an upcoming meetup I host — a dozen adults, mostly with technical backgrounds
  but almost no formal probability theory, two hours on a weekday evening — I want
  a hands-on exercise rather than a talk. The idea I want them to feel in their bones
  before it is named is the one behind Bertrand''s paradox: the principle of indifference
  is not a complete rule, because "equally likely" and even "a random X" have no meaning
  until a procedure or measure is specified, and equally intuitive specifications
  can disagree. By the end, I want participants to have moved from the cheap lesson
  ("the problem was underspecified") to the harder question: what does it take to
  specify it, and can any specification be called the right one?


  Design an activity along these lines. Split the participants into small teams, and
  give each team a different but comparably "obvious" mechanical rule for generating
  one random chord of a circle (for example: pick two endpoints uniformly on the circumference;
  pick a random point in the circle''s interior as the chord''s midpoint; pick a random
  point along a random radius and draw the chord perpendicular to that radius). Have
  each team generate enough chords — suggest a feasible number given the two-hour
  window — to get a stable frequency for the event "the chord is longer than the side
  of an inscribed equilateral triangle," and then have the teams compare numbers.
  The three procedures I listed should land near 1/3, 1/4, and 1/2 respectively, so
  the disagreement between teams should be unmistakable and should surface before
  anyone says "Bertrand" or "measure." Give me the concrete setup: what to supply
  (pre-printed circles? protractors? dice? random-number tables?), exact instructions
  per team so one team cannot cheat by quietly importing another team''s uniformity
  assumption, how trials are recorded, and how to sequence the reveal for maximum
  cognitive friction. Include a timed plan.


  Then give a debrief in bullet form that (1) has the participants themselves articulate
  where the teams diverged, tabooing the words "probability," "random," and "uniform"
  until they''ve first described what each team actually did; (2) maps each moment
  in the activity onto a part of the idea — different teams were indifferent over
  different quantities (angles, midpoints, points along a radius), and uniformity
  in one parameterization is not preserved under the transformations connecting them;
  (3) pushes past the standard rationalist dismissal I expect from this crowd — "it''s
  just underspecified" — by getting them to see that "underspecified" still leaves
  open which specification to use when a real problem arrives, and that resolving
  the paradox requires an argument for why some procedures are ruled out (invariance
  or symmetry constraints, say) rather than a shrug; and (4) leaves at least one version
  of the question unresolved out loud rather than pretending the paradox has a single
  accepted dissolution.


  Tell me what will predictably go wrong and how to recover: a team executing its
  procedure sloppily so its frequency drifts toward a neighbor''s answer; sample sizes
  small enough that the three answers blur together; a participant announcing early
  that the problem is ill-posed and deflating the exercise; a team believing its own
  procedure is the only natural one and treating the other teams as making a mistake.
