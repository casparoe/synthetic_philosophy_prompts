  Bertrand''s paradox: Consider an equilateral triangle inscribed in a circle. What
  is the probability that a "random chord" of the circle is longer than the side of
  the triangle? Three classical answers: 1/2, 1/3, 1/4 depending on how "random chord"
  is defined:

  - "Random endpoints": choose two random points on circumference; probability chord
  longer than side = 1/3.

  - "Random radius": choose a radius and a random point along it; chord perpendicular;
  longer than side if midpoint within r/2 of center; probability = 1/2.

  - "Random midpoint": choose a random point in the circle''s interior as midpoint;
  chord longer if midpoint within r/2 of center (inner circle area is 1/4 of whole);
  probability = 1/4.


