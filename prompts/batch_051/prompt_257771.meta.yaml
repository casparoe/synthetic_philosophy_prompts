  Simpler: run it as a simulation with dice/random numbers rather than physical dropping.
  Or use a "chord-generating machine" — each group gets a different algorithm:

  1. Endpoints method: pick two random angles θ1, θ2 uniform in [0,360); the chord
  between them. Longer than side iff |θ1-θ2| mod 360 > 120°? Let me compute: chord
  length = 2R sin(Δθ/2) where Δθ is the smaller central angle. Side of inscribed equilateral
  triangle = R√3. Chord longer than side iff 2 sin(Δθ/2) > √3 iff sin(Δθ/2) > √3/2
  iff Δθ/2 > 60° iff Δθ > 120°. Since endpoints are uniform, Δθ uniform in [0,180];
  P(Δθ > 120) = 60/180 = 1/3.

  2. Midpoint method: uniform point in circle; chord longer iff midpoint within r/2
  of center → P = area small circle / area big = π(r/2)²/πr² = 1/4.

  3. Radial method: choose random radius and random point along the radius; chord
  through that point perpendicular to radius; longer iff point within r/2 of center
  → P = 1/2.


