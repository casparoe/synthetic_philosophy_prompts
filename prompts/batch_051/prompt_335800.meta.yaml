  Draft Hume prompt:


  "I''ve been reading the popular versions of Hume''s argument about miracles, and
  I keep getting stuck. The usual rule people take from him is: dont believe a miracle
  report unless it would be more miraculous for the testimony to be false than for
  the miracle to actually happen. I want you to build two cases around that rule.
  First, a present-day, ordinary case where a miracle report passes that test (the
  witness is as reliable as a witness can be, the event is exactly as reported, etc.)
  but a reasonable person should still not believe a miracle occurred. Second, a case
  where the report fails Hume''s test — the testimony is weak on paper — but the person
  on the scene would be unreasonable not to believe a miracle happened. Constraints:
  no actual gods showing up, no hidden cameras that settle it, no making the witness
  obviously crazy or lying, and the second case can''t just be someone irrational.
  After you give the cases, walk through the numbers or reasoning for each and say
  what feature makes them work against the letter of Hume''s rule. Take that feature
  out and show the cases fall back in line with the rule. Then say how a Hume defender
  would wriggle out of each, and whether the wriggle is convincing."


