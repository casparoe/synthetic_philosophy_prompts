  would have to make it work: maybe a "miracle" which is a highly improbable but non-supernatural
  event (e.g., someone survives a fall), and the testimony weak but other evidence
  (physical traces on the scene) makes it reasonable to believe. But Hume''s rule
  for the on-scene person? Hmm.


