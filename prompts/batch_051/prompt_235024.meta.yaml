  rationalist/LessWrong end of things—and I keep running into a distinction I cannot
  make precise. I would like you to help me compare two different ways of characterising
  what is wrong with the Cartesian, cleanly-bounded picture of an agent.


  The first diagnosis is representational. A real agent is realised in the very world
  it is trying to model. Its map is part of the territory—drawn on a part of the territory,
  by a part of the territory—and it can never contain a complete, fully accurate model
  of itself or of its own future computations. Consequences include the failure of
  logical omniscience, the impossibility of a total prior over propositions that include
  the agent''s own code, and the fact that the agent cannot assign settled probabilities
  to outcomes of computations it is about to perform. On this diagnosis, the core
  problem is self-modelling and self-reference: the boundary between agent and environment
  is not given by the world but is something the agent itself draws, for reasons of
  computational convenience.


  The second diagnosis is decision-theoretic. Once the agent is an object among other
  objects, an "action" is not a clean intervention from outside the world. The agent''s
  decisions and its copies, successors, and predictions of them all live inside the
  same world. This means the usual separation between (a) the evidence a choice gives
  you about the world and (b) the causal consequences of the choice can break down;
  the agent must reason about its own algorithm and about others'' models of it; and
  notions like expected utility over a fixed set of consequences, or causal decision
  theory with a well-defined intervention, no longer have an obviously valid application.
  On this diagnosis, the core problem is that decision theory needs to be done from
  the inside, without a God''s-eye view of the space of possible acts and outcomes.


