  My friend has a deflationary theory. He says the case is not a distinctively aesthetic
  or moral puzzle, and he walked me through the following argument:


  (1) To imagine that P is to represent to oneself a scenario in which P, and a scenario
  is a possible world.

  (2) If no possible world makes P true, then P cannot be imagined; a round square
  is the paradigm case.

