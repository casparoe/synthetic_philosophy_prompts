  Let me think of a genuinely hard argument about imaginative resistance.


  Classic phenomenon: Readers balk at accepting morally deviant statements as true-in-fiction
  when the author asserts them ("In killing her baby, Giselda did the right thing;
  after all, it was a girl" — she killed a girl baby because it was a girl, and in
  the story this is depicted as the right thing). We willingly accept physical impossibilities
  (time travel, talking animals) but resist normative ones. Explanations:

  - Cantian/contagion: we can''t imagine a moral claim true because imagination involves
  taking up the relevant moral perspective, and we refuse.

  - Waltonian: the resistance isn''t to imagining; it''s about what the author can
  make fictional via standard "principles of generation" — divergence from reality
  is allowed on some matters (physical facts) but not others (moral facts) because
  readers won''t join the game of make-believe in that regard.

  - Weatherson: "virtue" of the fiction — we can''t see how a fiction could have the
  alleged property (e.g., be morally good) if it embodies those values; there''s an
  inferential barrier.

  - Matravers: resistance stems from the author lacking authority over evaluative
  judgments relative to the audience.

  - Stock: we can imagine a moral claim true but only if we understand it as "in the
  fiction, according to some reduced/fictional standard" — extreme moral claims are
  only fictionally true relative to a fiction-internal standard; that itself isn''t
  resisting.

  - Nanay, etc.


