  Thirder: 1/3. Reasoning: there are three possible waking episodes, one on heads
  (Mon) and two on tails (Mon, Tue). Because her epistemic situation is identical
  in all three, she should assign equal credence, so P(Heads) = 1/3. Or via betting:
  if she bets on heads each waking at even odds, she breaks even when offered 2:1.


