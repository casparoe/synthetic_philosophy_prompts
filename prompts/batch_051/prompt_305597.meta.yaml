  Question: When does Latin become Italian? It''s a Sorites-like problem about language
  identity across gradual change. We can treat languages as individuals with continuous
  change; there''s no sharp boundary. Criteria people might use to answer "when":


  1. Mutual intelligibility: Once a speaker of old Latin and contemporary Italian
  could not converse, we have a different language.

  2. Grammatical typology: e.g., loss of case system / emergence of Romance articles
  and prepositions.

  3. Self-identification/ethnolinguistic identity: when speakers stop calling their
  language Latin and call it volgare/italiano.

  4. Literary/codification: Dante''s De vulgari eloquentia, or the first texts written
  deliberately in vernacular.

  5. Phonological changes: e.g., collapse of vowel length distinctions, palatalization.

  6. Acquisition/transmission continuity: an unbroken chain of native speakers means
  it''s always the same language even though changed.

  7. The "ship of Theseus" conventionalist response: there is no fact of the matter;
  the question is misplaced.


