  after seeing three examples, says something like the left boxes all have shapes
  with curved outlines, and then sorts twenty new boxes correctly. It should clearly
  not count a lookup table that had the twelve training answers typed into it ahead
  of time.


  The hard cases I want the definition run through are these. Someone who sorts new
  boxes perfectly but can''t articulate the rule and says they just see it. Someone
  who can state the rule correctly but then fails on new cases that require applying
  it — say they say left boxes have circles, but miss a circle when it''s partly hidden
