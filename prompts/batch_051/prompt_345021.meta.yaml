  "Since retiring from a career in the natural sciences, I have been working through
  the classical pragmatists, and I have found myself both attracted to and unsettled
  by their accounts of truth. On the one hand, Peirce''s idea that truth is the opinion
  that an indefinitely extended community of competent inquirers would eventually
  converge upon, if inquiry were pushed as far as it could go, looks to me like a
  genuinely clarifying proposal: it ties the notion of truth to the methods that actually
  stabilise belief, avoids the picture of truth as a mysterious match between a proposition
  and a reality lying forever behind our backs, and explains why disputes that no
  possible evidence could settle are not really fact-stating. James''s more practical
  formulation, that truth is what proves itself in the long run and on the whole,
  likewise seems to capture something real about how we actually assess beliefs. Yet
  I cannot shake the intuition that there are determinate truths that no inquiry will
  ever settle. I take it as obvious, in a way that is continuous with my scientific
  training, that there was a definite number of insects in a particular patch of forest
  an hour before an unobserved downpour, that a silent stroke of lightning occurred
  at some precise moment and place, and that some claim about such an event is true
  or false now, even if every trace has vanished and no inquirer could ever be brought
  to converge upon an answer. It seems one thing to say that inquiry is our only route
  to knowledge; quite another to say that what inquiry would converge upon is what
  truth consists in. And James''s rendering seems vulnerable to the obvious objection
  that a belief could be useful without being true, or true but useless to someone."


