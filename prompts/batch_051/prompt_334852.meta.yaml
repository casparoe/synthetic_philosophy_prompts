  Buridan''s ass: a donkey equally hungry and thirsty placed exactly midway between
  a bale of hay and a pail of water, with no reason to prefer one over the other,
  starves because it cannot choose. It''s attributed to Buridan but actually earlier
  (Aristotle, al-Ghazali, Dante). It''s a puzzle about rational choice under indifference.
  Standard solutions: (a) arbitrary selection/tie-breaking is itself rational — once
  you see ties as permissible, the ass just picks one; rationality doesn''t require
  a decisive reason. (b) The ass has no preference between outcomes, but can prefer
  the act of choosing one over dithering, or can adopt a secondary tie-break. (c)
  There may be no complete preferences; agents might have incomplete preferences and
  be unable to choose, which is a form of rational irresolvability. (d) The problem
  reveals something about agency: reasons can run out, and agents need a causal mechanism
  (will, random tie-break) not reducible to preference. (e) Ruth Chang''s work: hard
  choices and parity; not exactly Buridan. In Buridan''s case the options are equal,
  not on a par. So avoid conflating parity with equality maybe.


  Disagreement moves possible:


  Person A (let''s say Marcus? or a novelist friend) says the ass is a fake problem:
  a rational agent can just pick arbitrarily when indifferent; there''s no rational
  requirement to have a decisive reason; "maximizing" doesn''t require a unique best.
  The ass starves only if we impose an absurd rule that action requires a reason stronger
  than the alternative.


  Person B replies: but choosing arbitrarily is an action too, and the ass has no
  more reason to choose-at-random than to choose hay or water — the tie recurs at
  the level of tie-breaking procedures. If reasons run out, the agent''s behavior
  would be governed by something non-rational (a coin flip), which concedes that practical
  reason alone can''t move it; so the puzzle shows rationality is insufficient to
  explain intentional action; you need something like will or habit.


