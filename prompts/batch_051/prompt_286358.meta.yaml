  (2) those signals get integrated somewhere into a single, negatively valenced state
  — there''s a ''something it''s like'' standpoint; (3) the animal will pay a real
  cost to escape or avoid the stimulus; and (4) the state feeds into flexible learning,
  not just a hardwired reflex. Now take a tobacco hornworm caterpillar that''s been
  parasitized by a braconid wasp. The wasp larvae are eating it from inside; the caterpillar
  thrashes, stops feeding, and can be trained to avoid an odour paired with a noxious
  poke. It does that last part across contexts, which suggests real learning. But
  if you decapitate the caterpillar, the body still does much of the ''escape'' thrashing,
  and its nervous system is a chain of ganglia with nothing you''d call a brain or
  cortex. So my question is: does this organism qualify as suffering under my four
  criteria? Go through them one by one, and be honest about where they underdetermine
  the answer. If it doesn''t qualify, is that because the caterpillar isn''t suffering,
  or because my criterion (2) is just vertebrate prejudice? And if it does qualify,
  what would that mean for how we think about the enormous number of wild insects
  that die slowly to parasitoids?"


