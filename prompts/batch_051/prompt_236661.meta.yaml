  to the view that we''re all selfish all the way down, we just tell ourselves prettier
  stories. She used a scene from my novel as the example: my character Ana sits with
  a dying man she barely knows, and Rita said the scene rang false, because Ana is
  getting something out of it—a sense of being good, a story to tell, relief from
  the guilt she''d feel if she stayed home. She said if you trace any apparently unselfish
  act far enough, you find the actor collecting some benefit, even if it''s only feeling
  like the kind of person who helps.


  Marcus said she was stretching "selfish" until it broke. If selfish just means "doing
  what you most want to do," then wanting a stranger not to drown is selfish in the
  same sense as wanting their wallet, and the word no longer does any work. He said
  the interesting thing is what the person wants, not that they want it.


