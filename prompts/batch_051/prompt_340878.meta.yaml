  realism propose to distinguish the structure I should take seriously from the structure
  that is merely a useful contrivance? If it cannot, is that a serious weakness of
  the view or of the way I have framed the question?


  I would be grateful if, in your reply, you would say how confident you are in the
  claims you make and single out the point you are least sure about. And please write
  your answer in British English.


