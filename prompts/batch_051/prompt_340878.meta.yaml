  ---


  Now that I am retired from a forty-year career in physical oceanography and have
  begun reading philosophy of science properly, structural realism is the position
  that has unsettled me the most. As I understand it, the view is that what persists
  across scientific revolutions is mathematical structure — equations, relations,
  symmetries — whereas the entities a theory posits are apt to be discarded; the realist
  impulse should therefore fasten onto the structure rather than the furniture. That
  description fits my professional life uncomfortably well. The numerical models I
  worked with for decades contained parameterisations of sub-grid-scale turbulence
  that nobody believed were literally correct, water masses that are convenient notional
  volumes rather than observed objects, and estimates of a deep overturning circulation
  put together from sparse measurements and model assumptions. The equations, and
  the relations between quantities, did genuine work; the entities often felt like
  scaffolding.


  Please describe the most important implications of structural realism for someone
  in my position. Specifically, three things puzzle me.


  First, how should I now think about the reality of the things I spent a career treating
  as though they existed? Does the structural realist license me to keep talking about,
  say, Antarctic Bottom Water or the meridional overturning circulation as real, or
  should I regard them as derivative, as shorthand for structures that are the proper
  objects of belief?


  Second, what is the practical difference between believing in the structure and
  believing in the entities? If I write about climate for a general audience, should
  I change how I introduce deep currents, eddies, or tipping points? Or is the difference
  one that matters only inside a metaphysics seminar?


  Third, and this is what bothers me most: my models also contained components we
  knew to be false but retained because they made the whole work. Structural realism
  seems to tell me to trust what persists, but in a climate model much that persists
