  I am a novelist, and my particular failure in worldbuilding concerns the relation
  between the fine grain of an invented world and the large story. I am drawn to projects
  in which I fix the deepest laws first — what a magical practice conserves, whether
  matter is granular, what a soul can transmit to a descendant, which quantities are
  exactly invariant — and then I attempt to derive the visible world from those laws.
  My recurring mistake is to let every micro-level rule echo through politics, economics,
  and private life, which flattens the world into a diagram, or to ignore the rules
  the moment they become inconvenient, which attentive readers catch. I want a reusable
  procedure, grounded in what physics actually says about how levels of description
  relate to one another — effective field theory, separation of scales, the renormalization
  group, decoupling, universality — that I can run for each new book.


  I understand the central lesson to be that higher levels have real autonomy: most
  fine-grained detail gets suppressed or screened as one moves to larger scales, and
  only a small number of surviving parameters constrain the macroscopic story. But
  I also gather that some features do propagate upward and cannot be ignored — conserved
  quantities, broken or unbroken symmetries, exact constraints, and the behavior at
  phase transitions or thresholds. I want that turned from a physicist''s slogan into
  a working writer''s checklist.


  The procedure should be usable by a novelist with no formal physics training in
  one afternoon, and it should be teachable to a co-author or a writers'' room. It
  should take as input a statement of a world''s low-level laws and yield a decision
  about which aspects can be left indeterminate, or even mildly inconsistent, at the
  scale of a body, a city, and a century without damaging the world''s coherence —
  and which must be held fixed because they would be felt at those scales. Include
  a set of questions to run in order; a plain-language way of distinguishing features
  that are irrelevant from features that are merely small but accumulating; explicit
  treatment of the dangerous middle cases, such as effects that are suppressed but
  not erased, decoupling that holds for typical conditions but fails at a threshold,
  and fine detail that becomes relevant at a phase transition; and two or three worked
  examples, at least one of which must be a case where the procedure tells me that
  a plot device I like cannot be made visible at the narrative scale and should be
  cut. Finally, say plainly where the analogy with physics breaks down and where authorial
  judgment — theme, character, mood, reader comprehension — has to take over, and
  mark the steps at which the procedure cannot eliminate judgment.


