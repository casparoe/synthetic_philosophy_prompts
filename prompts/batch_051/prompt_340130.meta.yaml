  I''m a retired geologist—spent my career thinking something''s real if you can put
  a probe in it—and recently I''ve gotten deep into philosophy of mathematics, specifically
  what makes a mathematical object a legitimate object in the first place. A friend
  who runs a community adult-ed program has roped me into teaching a ninety-minute
  evening session to a sharp but non-specialist group: their background is high-school
  algebra and geometry plus whatever popular science they''ve seen on YouTube. The
  arc I want them to feel in their gut is the move from the old constructibility standard—the
  Greeks'' idea that a curve was a real object of geometry only if you could in principle
  produce it with straightedge and compass—to the later standard where curves like
  the cycloid (the path of a point on a rolling wheel) or graphs of functions like
  the sine curve count as perfectly good objects because they''re pinned down by definitions
  and equations, even though no straightedge-and-compass construction can generate
  them. I don''t want to lecture the history at them; I want to design the session
  so the shift feels forced, like the old criterion snaps and something else has to
  take its place.


