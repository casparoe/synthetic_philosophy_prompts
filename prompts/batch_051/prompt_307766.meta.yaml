  if they value it; capability view also gives mobility as a capability. They may
  agree on the amount if the resource cost of the wheelchair van is covered and the
  person values mobility. To make them diverge, introduce a person who has the same
  disability but doesn''t value mobility (prefers staying home reading). Capability
  view might still want to ensure the capability (even if unused?) - actually Sen
  is concerned with capabilities, not functionings: having the option matters even
  if not chosen. Resource view would give the extra resources only if the person *would
