  Let''s design a clean argument for self-amendment paradox:


  Scenario: A statute S contains only one clause: "This statute may be repealed by
  a simple majority of the legislature." The legislature votes by simple majority
  to repeal S.


  Argument:

  (1) An act of repeal is valid only if the power to repeal the statute was conferred
  by a rule in force at the time of the act.

  (2) The only candidate conferring power is S itself.

  (3) S was in force at the time of the vote.

  (4) Therefore the repeal act is valid.

  (5) A valid repeal act eliminates S.

  (6) If S is eliminated at the moment of repeal, then at that moment there is no
  longer any rule conferring power to repeal S.

  (7) But a rule cannot confer power over a moment at which it no longer exists.

  (8) Therefore, if the repeal is valid, then it is invalid. Contradiction.


