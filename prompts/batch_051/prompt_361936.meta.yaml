  The debate: Does quantum randomness help free will?


  Standard view: libertarian free will requires indeterminism at the point of decision.
  But mere quantum randomness in the brain doesn''t confer free will because randomness
  is not agency/control. If choices are random events, they are no more "free" than
  if caused; the agent lacks control, and the self is not the source. Peter van Inwagen''s
  consequence argument targets determinism; libertarians need indeterminism but also
  need agent-causation or non-occurrent causation. So "indeterminism is true, therefore
  free will" is a mistake. Also some compatibilists note determinism at macro level
  is unaffected by quantum noise.


