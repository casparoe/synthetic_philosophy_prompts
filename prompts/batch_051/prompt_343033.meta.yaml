  Prompt draft:


  "I hold a version of the ''rational irrationality'' position that is usually introduced
  with Parfit''s hitchhiker. My version is this: take a hitchhiker and a driver, both
  rational, self-interested, and known to each other to be so. The driver will rescue
  the hitchhiker only if the hitchhiker can make a credible promise to pay upon arriving
  home; both know that, once home, the hitchhiker will have no self-interested reason
  to pay. No one will enforce the debt, there is no reputation at stake, the two will
  never meet again, and no binding contract or collateral is available. I nevertheless
  hold that it can be rational for the hitchhiker, before the encounter, to make himself
  into the kind of person who will keep the promise even though, at the moment of
  keeping it, the act costs him something and he would prefer to break it. The rationality
  attaches to the decision to have the disposition (and to the disposition itself,
  considered as a standing policy), not to the later act. I also hold that the disposition
  does not reduce to a bet on hidden future benefits, reputation, or repeat-play returns;
  it is rational even if the only benefit is making the promise credible to a driver
  who can observe the disposition.


  I want a map of what would count against this position. Give me the defeaters sorted
  from fatal to merely awkward, including the strongest internal objections a careful
  defender would concede have real force (not just what its enemies say). In particular,
  please address: whether shifting the locus of rationality from the act to the disposition
  merely relabels the problem rather than solving it; whether the view can be stated
  without equivocating between ex ante and ex post rationality; what a dynamic-consistency
  or expected-utility-at-each-choice-point framework says is wrong with it; whether
  there is any observation or experiment — psychological, economic, evolutionary,
  or otherwise — that would directly test the claim rather than merely illustrate
  it; and what the view predicts about cases that differ in one respect: the driver
  cannot observe the disposition, the hitcher''s disposition is imperfect or probabilistic,
  the promised act is genuinely harmful rather than merely costly, or the hitchhiker
  can choose a disposition but later undo it. Finally, tell me honestly whether the
  position as I''ve stated it has been qualified into unfalsifiability, and whether
  that is a problem for a claim of this kind."


