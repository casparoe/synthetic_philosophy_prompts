  Malcolm (Dreaming, 1959): The notion of a dream as an experience occurring during
  sleep is conceptually confused. He argues that when we say "I had a dream last night,"
  we are not reporting an occurrence; we are telling what we are now inclined to say,
  a disposition created by waking. There is no way to verify that a dream occurred
  during sleep, because the sleeper cannot report then, and later report is the sole
  criterion. The concept of dreaming is derived from waking reports; "asleep" and
  "having experiences" are logically incompatible because being sound asleep excludes
  judgment, reasoning, awareness. So dreams are not experiences; the "dream narrative"
  is not memory of an occurrence. Strong verificationist/Wittgensteinian.


