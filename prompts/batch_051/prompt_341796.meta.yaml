  The principle of identity of indiscernibles: if two things have all the same properties,
  they are identical (one thing). Quantum mechanics: two electrons in symmetric/antisymmetric
  states are indiscernible by intrinsic properties yet there are two. Does this falsify
  PII? There''s a subtlety: PII can be interpreted as "there cannot be two distinct
  objects that share all *qualitative* properties" — but in quantum mechanics, arguably
  there can be two distinct electrons each lacking distinguishing intrinsic properties;
  only the joint state has "there are two particles." However they are not *objects*
  proper; they are non-individuals, or the notion of cardinality is state-dependent
  ("there are two" but no fact which is which). Some philosophers (French and Krause,
  Teller) argue quantum particles violate PII and are non-individuals. Others (Saunders,
  Muller) propose weak discernibility: two fermions are weakly discernible by an irreflexive
  relation, e.g., "has opposite spin to" — but is that a real property? Weak discernibility
  suffices for PII in some versions. But the metaphysical interpretation is contested;
  some argue this restores PII only trivially.


