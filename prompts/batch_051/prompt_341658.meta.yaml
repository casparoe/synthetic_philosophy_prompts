  Let''s formulate prompt:


  "I have been rereading parts of Stephen Wolfram''s A New Kind of Science, and I
  am struck by an asymmetry in the way many scientists and philosophers of science
  treat different kinds of models. When a pattern in nature is produced by a compact
  set of differential equations, the equations are usually described as an explanation
  of the pattern; they are taken to reveal the mechanism. When the very same pattern
  is produced by an elementary cellular automaton with a simple local rule, the result
  is often dismissed as ''just a simulation'' or a computational curiosity. Yet Wolfram''s
  principle of computational equivalence suggests that above a rather low threshold
  these are not importantly different: the automaton is not an approximation to the
  system''s causal structure, but a candidate exact description of it, and its behaviour
  is computationally irreducible in the same way the real system''s behaviour is.
  If both the equation and the rule are compact symbolic objects that generate the
  same observable data, what, if anything, justifies treating the equation as science
  and the rule as merely a picture? I am not asking whether Wolfram''s empirical claims
  about the ubiquity of simple rules are true; I am asking whether the asymmetry in
  our explanatory attitudes would survive if they were. Point out the best candidate
  principle that could ground the asymmetry, test it against cases where the cellular
  automaton recovers a known physical law and the equation is a phenomenological fit,
  and tell me whether the asymmetry should be kept, reversed, or given up."


