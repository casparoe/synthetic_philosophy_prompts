  I''ll state criteria for the absurdity doctrine (as a judge might apply):

  1. The statutory language is clear, and the outcome follows straightforwardly without
  interpretation.

  2. The outcome is absurd—not just unwise, unjust, or unexpected, but something like
  internally contradictory or clearly at war with the statute''s evident purpose.

  3. The absurdity is objectively demonstrable from the statute''s text/context/purpose,
  not just from judicial discomfort.

  4. The proposed departure is narrow: refusing to apply the literal language to the
  odd case, rather than rewriting the provision.

  5. The legislature could not plausibly have wanted the literal result, even as a
