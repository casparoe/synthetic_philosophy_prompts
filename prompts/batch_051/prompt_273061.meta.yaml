  The question "Could a language lack pronouns or indexicals?" is a real topic in
  philosophy of language. There are debates about whether all languages have first
  and second person pronouns (some claim universality, though there may be exceptions),
  and about whether indexicality is essential to thought (Perry, Lewis on de se attitudes).
  A language without pronouns: e.g., a language where one refers to oneself by name
  or role, with no first-person pronoun. Could such a language exist? There are actual
  languages with restricted pronoun use (Japanese, Thai use names/titles), but generally
  all natural languages seem to have first/second person pronouns. The philosophical
  question is whether a language could systematically lack them and still express
  self-locating thought.


  Arguments for necessity:

  1. Communication argument: every speaker needs a way to signal "I, the current speaker,
  am the referent of this utterance" for turn-taking, self-reference, etc. Without
  indexicals, ambiguity arises: "Mary is hungry" when uttered by Mary and by someone
  else means different things; you need something whose referent shifts with context,
  and that''s an indexical. Actually you could use names, but the name isn''t indexical.
  Hmm, the question is what functions would be lost.


  2. The essential indexical argument (Perry/Lewis): there are beliefs/desires essentially
  self-locating — e.g., "I am making a mess" (Perry''s example: he follows the trail
  of sugar around the supermarket thinking "the shopper with the torn sack is making
  a mess" without realising it''s him). A language without indexicals may not allow
  a speaker to express self-locating thought that motivates action correctly. But
  that''s about thought, not language per se. Still relevant.


  3. The mirror/de se observation: to distinguish oneself from others in speech, one
  needs more than a proper name because many share names or one may not know one''s
  name; indexicals guarantee self-reference without prior knowledge. But maybe not
  decisive.


  4. Deictic grounding argument: indexicals anchor language to the world; without
  them sentences have only general content and cannot be applied to particular situated
  circumstances. "Rain" vs "It is raining here now."


  5. The argument from belief reports: to report de se attitudes adequately (John
  believes that he himself is in danger), you need distinct indexical modes; a language
  without them couldn''t distinguish "John believes John is in danger" from "John
  believes he himself is in danger."


  6. Reflexive/duplication argument: two people with identical descriptive beliefs
  could still have different self-locating beliefs; a language without indexicals
  cannot express the difference.


