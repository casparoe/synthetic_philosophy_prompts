  description fails. ''The person now speaking'' either smuggles indexicality back
  in through ''now'', or, if it is made fully explicit as ''the person speaking at
  location l at time t'', it carries factual content that a speaker could fail to
  know she satisfies; nothing in such a description captures the self-evident connection
