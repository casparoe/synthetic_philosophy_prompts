  List of objections to corporate blame:

  1. No phenomenality: companies have no conscious experience, so they can''t feel
  guilt, remorse, or suffer the way blame demands.

  2. No unified intentionality: corporate decisions are distributed across members,
  committees; "intent" of a firm is a legal fiction not a psychological state.

  3. Blame requires reactive attitudes (resentment, indignation) which are properly
  directed only at agents who can understand and answer for the wrong; a firm can''t
  "answer" in the accountability sense.

  4. The "personification objection": treating firms as agents leads to blaming abstract
  entities while individual members escape responsibility ("many hands" problem) —
  actually that''s more a problem of diffused responsibility.

  5. The impossibility of punishment: a corporation can be fined but not imprisoned,
  shamed, or made to suffer as an individual; fines are ultimately borne by shareholders,
  employees, consumers.

  6. Nominalism about group agents: groups are not agents over and above their members;
  only individuals act.


