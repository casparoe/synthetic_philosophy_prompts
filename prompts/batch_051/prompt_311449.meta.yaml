  Let''s draft:


  "Adam Smith, in An Inquiry into the Nature and Causes of the Wealth of Nations,
  Book IV, Chapter VII, offers a diagnosis of Britain''s colonial trade. He argues
  there that the monopoly of the colonial trade had artificially raised British profits
  and drawn a greater share of British capital into the colonial trade than would
  naturally have gone there; the result, he says, was not an increase in the annual
  produce of British land and labor, but merely a change in its direction, and a worse
  direction at that. I want to test the argument I take him to be making.


  Here is my reconstruction of Smith''s argument:


  (1) A monopoly that excludes foreign competition from a particular trade raises
  the ordinary rate of profit in that trade.

  (2) A higher ordinary rate of profit is not a sign of national prosperity; it indicates
  a nation whose industry is in a less thriving condition, and it raises the price
  of goods while lowering the annual produce of land and labor.

  (3) The British monopoly of the colonial trade diverted capital away from other
  employments and into colonial trade solely because the monopoly made profits there
  artificially high.

  (4) Whatever capital is diverted in this way, the total annual produce of British
  land and labor is not increased; it is only redirected, and the new direction is
  less productive than the old.

  (5) Therefore Britain derives no real advantage from the colonial monopoly, and
  the imperial relation, considered as a commercial project, cannot justify its costs.


