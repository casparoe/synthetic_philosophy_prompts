  Content ideas for desiderata of a theory of concepts:


  A theory of concepts should explain:

  1. Categorization: how we assign things to categories, including graded membership
  and unclear cases (e.g., is a penguin a bird? is a rug furniture?).

  2. Typicality effects: why some instances come to mind faster, why robin < chicken
  in response times, etc.

  3. Compositionality: how complex concepts are built from simpler ones (PET FISH
  problem — guppy is typical of pet fish but not of pet or fish; red hair).

  4. Concept acquisition / learning: how concepts are acquired from examples, including
  one-shot learning, and how children get natural kind concepts.

  5. Conceptual change and theory change: how concepts shift when background beliefs
  change (e.g., ATOM, SPECIES, PLANET).

  6. Intensions/extensions: how a concept determines its extension, empty concepts
  (unicorn, phlogiston), and inconsistent concepts (round square).

  7. Normative/epistemic roles: how concepts figure in inference, explanation, and
  justification; the distinction between knowing the concept and knowing the facts.

  8. Individual differences and context sensitivity: same word, different concepts
  across people/cultures; ad hoc categories (things to take from a burning house).

  9. The distinction between concepts and mere mental representations / lexical entries;
  the "concept of X" is shared vs idiosyncratic.

  10. Cognitive economy: quick, heuristic use vs. theoretical rigor.


