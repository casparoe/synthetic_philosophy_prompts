  in chapter two turns out to be load-bearing, and on reread the whole book seems
  as if it could only have ended this way. I know better than anyone that this is
  partly an artifact — pick a different cutoff, or write a sequel, and the so-called
  inevitable ending becomes just another scene among scenes. Fukuyama seems to me
  to do exactly this with history: he stops at the collapse of communism, takes that
