  Evo psych nuances I know:

  - Just-so story critique: adaptive hypotheses are hard to test because we can''t
  observe ancestral environments. But evo psych defenders say hypotheses are tested
  via cross-cultural studies, comparisons with non-human primates, a priori predictions,
  genetic data, and consilience; not all adaptationism is unfalsifiable.

  - Key distinction: "adaptation" vs "current adaptiveness." An adaptation evolved
  because it solved a recurrent problem in ancestral environments, not necessarily
  beneficial now (mismatch).

  - EEA: not a single place or period but a statistical aggregate of selection pressures;
  still debated.

  - "Evolved" doesn''t mean "genetically determined" or "unchangeable" or "natural
  = good."

  - "Modularity": claim of many specialized mechanisms vs. domain-general mind.

  - Criticisms: many studies rely on WEIRD samples, effect sizes small, reverse causation,
