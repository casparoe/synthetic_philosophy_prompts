  Prompt idea:


  "I''m putting together a unit for a philosophy of science course on thought experiments,
  and I want a case that separates two stories about what thought experiments actually
  do. Here''s the contrast I''ll give the students: on the ''argument'' story (broadly
  empiricist), a thought experiment is just a polished argument whose premises are
  old observations plus accepted principles, so any conclusion it reaches was already
  in the premises; it can at most expose an inconsistency or reorganize what we knew.
  On the ''intuition'' story (broadly rationalist), a good thought experiment can
  supply genuinely new knowledge of what is physically possible or impossible, and
  it does so by eliciting a modal intuition that isn''t just a summary of past experience.


  Build me a thought experiment in some area of physics (or another empirical science,
  say biology or economics) where these two stories deliver opposite verdicts about
  the epistemic payoff even though they agree on the outcome of the imagined scenario.
  Constraint: don''t use any of the canonical examples — no Galileo falling bodies,
  Einstein elevator, Newton bucket, or Maxwell''s demon — and keep the setup describable
  in a single paragraph with no maths beyond high school level. The scenario should
  be one that a group of first-year students could actually run through in their heads.
  After the scenario, show: (1) what each story says the experiment teaches and why,
  (2) exactly where the intuition story says the new knowledge is entering and exactly
  which premise the argument story says it''s smuggling in, (3) which feature of the
  case does the work, and whether removing it makes both stories collapse into agreement,
