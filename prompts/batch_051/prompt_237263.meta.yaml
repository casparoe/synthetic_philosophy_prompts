  Condorcet jury theorem: if each voter is better than chance (p > 1/2), independent,
  majority rule''s probability of correct decision increases with group size and tends
  to 1; if p < 1/2, tends to 0. Assumes binary choices, independent voters, sincere
  voting.


  Structural mapping:

  - Unreliable neuron / voter → individually noisy but conditionally better than chance.

  - Redundant copies / electorate → multiple units.

  - Majority gate / majority rule → aggregation threshold.

  - Output: reliable computation / correct verdict.

  Differences:

  - Neurons may have different error rates, not all identical p; von Neumann needs
  to know/design thresholds and fan-in/fan-out; Condorcet only assumes p>1/2.

  - The brain is not literally voting on propositions; neurons carry signals; "correctness"
  is a different notion (output equals what would be produced by reliable components
  vs. true proposition). There is an evaluative/evaluative fact in jury theorem (truth
  of proposition) that has no straightforward analogue in computing a function — unless
  you define correctness relative to a target function.

  - Independence assumptions break in both: correlated neural failures (neighboring
  neurons share blood supply, etc.) and correlated voters (shared information, common
  cause) undermine reliability.

  - Condorcet''s theorem''s result "as n→∞ probability→1" mirrors von Neumann''s multiplexing
  result "as redundancy increases, error probability decreases exponentially."

  - Key transfer question: does von Neumann''s idea that "the system must be organized
  so that errors don''t propagate" predict that juries should have independence procedures,
  and does it? Possibly.


