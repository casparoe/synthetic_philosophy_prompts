  During a break at a conference, two people I know got locked into a dispute about
  forgiveness and asked me to referee, but I found I couldn''t settle it cleanly.
  I''m hoping you can adjudicate it argument by argument.


  The first, Ruth, began with the claim that forgiveness can never be obligatory,
  because forgiving is essentially a gift: it is something the victim chooses to bestow,
  and a coerced "gift" is no gift at all. She added that a duty to forgive would amount
  to a duty to have certain emotions — to stop resenting — and emotions cannot be
  commanded in the way actions can.


  The second, Daniel, replied that this ignored everyday moral criticism. When someone
  has apologized sincerely, made full restitution, and shown genuine change, we don''t
  treat the victim''s continued resentment as merely suboptimal or "less generous
  than they could have been"; we treat it as a moral failing. So, he argued, at least
  forgiveness of the repentant is sometimes obligatory.


  Ruth answered that those cases only show that there is a duty to judge fairly —
  to acknowledge that the debt has been settled — not a duty to forgive. Forgiveness,
  she said, is precisely the extra step beyond what fairness requires, the renunciation
  of a claim one would be entitled to press.


  Daniel countered that this "extra step" is needed for the relationship itself: if
  the wrongdoer has done everything that could reasonably be demanded, and the victim
  still withholds forgiveness, the victim is blocking a repair that is owed, not gifting
  something supererogatory. He then extended the point: someone who says "I forgive
  only because you earned it" is arguably not forgiving at all, but merely settling
  accounts.


  At that point Ruth said Daniel had trapped himself: if forgiveness must be earned
  to be owed, then it cannot be given freely, and unconditional forgiveness — forgiving
  the unrepentant — becomes either incoherent or imprudent. Daniel replied that unconditional
  forgiveness may be coherent but often wrongs the victim: it can trivialize the wrong,
  pressure victims to "turn the other cheek" before anyone has acknowledged the injury,
  and hand abusers a clean slate they never asked for.


  Ruth pushed back that conditional forgiveness makes forgiveness transactional, turning
  repentance and amends into the price of release, which means the people least able
  to meet those conditions may be the ones most in need of forgiveness. Daniel responded
  that confusing forgiveness with trust is exactly the error: one can release resentment
  unconditionally while still refusing to restore the relationship.


  They looked to me, and I honestly could not sort out which claims stand. Please
  go through their exchange in order and say who is right about which specific point,
  where each argument overreaches, and what distinction or consideration both of them
  are missing. Then give an overall verdict on whether forgiveness can be obligatory,
  whether it can be unconditional, and whether those questions are even about one
  and the same thing.


