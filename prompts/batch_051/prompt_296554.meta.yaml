  Let''s think carefully about Nozick''s entitlement theory. Key elements:

  - Historical, not patterned. Entitlement theory: a distribution is just if it arose
  from just original acquisition and just transfers (and rectification of past injustices).

  - Patterned principles: allocate according to some natural dimension (merit, need,
  IQ, equality). Nozick argues no end-state or patterned principle can be realized
  without continuous interference in people''s lives, because people will freely transfer
  goods (e.g., pay Wilt Chamberlain 25 cents) and disturb pattern. Liberty upsets
  patterns.

  - Self-ownership: individuals own themselves; taxation on earnings is on a par with
  forced labor.

  - Just acquisition: Locke''s proviso? Nozick''s version: acquisition just if it
  doesn''t worsen others'' situation relative to baseline... "Lockean proviso." Important
  for role-play or consistency.


