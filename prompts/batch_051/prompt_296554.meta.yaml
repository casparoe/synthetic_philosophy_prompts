  are transfers voluntary? If someone pays for food because they''re starving due
  to past unjust theft of land, are their choices voluntary in the relevant sense?
  They''re forced by unjust circumstances. So the Wilt argument doesn''t justify inequalities
  built on unjust past. This is a standard critique.


