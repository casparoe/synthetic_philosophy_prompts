  Benatar''s asymmetry:

  - Scenario A: person exists. Has some pain (bad) and some pleasure (good).

  - Scenario B: person never exists. Has absence of pain (Benatar: good) and absence
  of pleasure (Benatar: not bad, because no one is deprived).


  The asymmetry in four quadrants:

  For "pain":

  1. Existence with pain: bad.

  3. Non-existence, absence of pain: good.

  For "pleasure":

  2. Existence with pleasure: good.

  4. Non-existence, absence of pleasure: not bad.


  The claim: since (3) is good and (4) is not bad, non-existence is at least as...
  actually better because while both existence and non-existence have something good,
  only existence has something bad. So existence is always worse than non-existence
  — coming into being is a harm.


  The decision-theoretic translation: define two acts: come into existence, don''t.
  Outcomes: life with pains and pleasures vs no life. Utility: U(exist) = sum of good
  minus bad; U(nonexist) = ? The asymmetry says U(nonexist) has a positive component
  from absent pain but no negative component from absent pleasure. But in standard
  expected utility, utilities must be assigned to outcomes for an agent; here there
  is no agent in nonexistence, so whose utility? Also, the comparison is between distinct
  persons (or between person and no person) rather than for one person in two worlds
  — this violates the Kripkean/Pareto assumption that the same individual exists in
  all states. Additionally, the "absence of pain is good" may be an impersonal value
  (good that there is no suffering), but then "absence of pleasure is not bad" must
  have an impersonal counterpart (not bad that the world contains no extra pleasure?
  or bad that it lacks it?) — and one could reject the asymmetry.


  Residue: the translation forces a choice about who the utility is for. If the utility
  is for the potential person, then nonexistence yields an undefined or zero utility;
  if impersonal, the load-bearing asymmetry must be imported as a preference over
  others'' existence, which doesn''t follow from EU theory. There''s also the dominance
  framing: Benatar can be read as claiming "nonexistence weakly dominates existence"
  because it is better on the pain dimension and not worse on the pleasure dimension.
  But dominance requires commensurable utilities across states and no state-dependent
  preferences; here existence/nonexistence change the very subject, so dominance is
  illegitimate. The residue tells us whether the argument is just a dominance argument
  with a loaded utility assignment.


