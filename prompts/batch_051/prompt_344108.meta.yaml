  Let me consider the content: Identity and indiscernibility of quantum particles.


  Classic philosophical issue: Leibniz''s Principle of Identity of Indiscernibles
  (PII): if x and y have all the same properties, x = y. Quantum mechanics seems to
  challenge: two electrons in an atom share all intrinsic properties, yet there are
  two of them, not one. But some respond that PII is about all properties including
  relational ones; the electrons differ relationally (opposite spins, positions in
  the config, etc.). Others (e.g., Saunders, Muller) use weak discernibility: fermions
  are weakly discernible via the relation "have opposite spin". Bosons? More complicated.


  Possible argument reconstruction:


  (1) According to quantum mechanics, two electrons in a helium atom are in an entangled
  singlet state in which no property distinguishes one electron from the other, and
  swapping their labels leaves the physical state unchanged.

  (2) If two things share exactly the same properties, they are the same thing (the
  identity of indiscernibles).

  (3) But quantum mechanics says there are two electrons there (the atom has two electrons,
  not one).

  (4) So quantum mechanics refutes the identity of indiscernibles: there are two things
  that are property-identical.

  (5) Hence individual objects at the quantum level have a primitive "thisness" or
  haecceity beyond their properties.


