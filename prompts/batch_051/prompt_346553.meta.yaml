  Let me flesh out mechanism design.


  Mechanism: A political discussion site introduces "good faith escrow." To post in
  a thread marked "cross-party," you stake, say, 50 reputation points. If the person
  you''re replying to challenges your good faith, a panel of five users — all pulled
  from the challenged poster''s own side of the aisle (same self-identified side as
  the person who felt wronged) — votes in secret on whether your reply "argued in
  bad faith" (mocked, strawmanned, sealioned, ignored the other''s strongest point,
  etc.). If three of five say bad faith, your stake goes to the challenger; if cleared,
  you keep it and the challenger pays a small reputational cost for a failed challenge.
  Challenges themselves are limited, maybe one per day, and public. The twist: the
  jury is drawn from the challenger''s in-group, so the standard of "good faith" is
  enforced by the very side you''re arguing with.


  What would this do? Incentives for users: (1) avoid outgroup engagement unless very
  confident; (2) perform niceness rituals; (3) write with plausible deniability; (4)
  exploit ambiguity in "good faith" — maybe phrase arguments so they can be read both
  ways; (5) farm: as a potential challenger, you might bait hostile replies to harvest
  their escrow, so provocation becomes profitable. For the platform: polarization
  content may become more polite but more insidious; challenge-able threads become
  taboo. For juries: serving on juries is costly, so who volunteers? The most partisan
  users. So "good faith" gets defined by the most aggrieved, not the median. Second-order:
  the site bifurcates into safe zones where nobody argues and murky zones where everyone
  plays chicken; cross-party engagement drops; the appearance of rational discourse
  improves while actual persuasion dies. Also: the mechanism assumes "good faith"
  is detectable and that partisans can detect it, which is exactly the contested premise.
  Could it instead measure something like ingroup loyalty or stylistic conformity?
  Does the challenger''s side ever judge an outgroup member as good faith, and if
  so when — when the person pre-emptively concedes points? That selects for people
  who arrive with concessions, not for truth-seekers.


  Failure modes to fix: adversarial baiting; jury selection bias; chilling of genuine
  disagreement; "good faith" as a style; reputational costs for failed challenges
  could be gamed by challenge-farming. Can any be fixed? E.g., mixed juries (half
  from each side) — then juror voting becomes predictable, and the contest becomes
  about appealing to the median of each side, perhaps more fair but more gameable
  via audience capture; or anonymous juries; or escrow paid to a common fund instead
  of the challenger (removes the harvest incentive but also the deterrence); or make
  the standard "would the best available counter-argument be acknowledged" rather
  than tone.


