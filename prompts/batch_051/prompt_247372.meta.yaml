  His response, as I read it, is not to deny all decline but to relocate its cause:
  he says that no one has a good memory in old age who did not have one earlier, and
  that mental powers decay much less in those who keep them in use. In his examples,
  the old men who remain intellectually active — Sophocles writing tragedy into his
  nineties and similar figures — are treated as evidence that the relevant powers
  are not taken away by age but lost through disuse. I am interested in whether this
  line of argument survives what is now known about normal cognitive aging: declines
  in processing speed, working memory, and episodic memory are well-documented and
  begin earlier than the very old age Cato is discussing, and they occur even in otherwise
  active people. Does Cicero''s argument collapse because it mistakes the absence
  of universal, catastrophic decline for the absence of intrinsic aging-related decline,
  or can it be repaired by distinguishing the kinds of cognition that are relatively
  preserved from those that are not? Be explicit about which premise the modern evidence
