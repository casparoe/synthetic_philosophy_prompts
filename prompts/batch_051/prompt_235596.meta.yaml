  You are a philosopher of language with experience designing experiential curricula
  for undergraduates. Think carefully before settling on a design, and brainstorm
  at least two candidate mechanics and say briefly why you reject one of them.


  I teach an upper-level philosophy of language seminar with a unit on prescriptivism
  and descriptivism. Sixteen students, 75 minutes. The central question for the session
  is: Is there such a thing as bad grammar, or only grammar that is socially marked
  in a given context? I want the students to stop treating descriptivism as the obviously
  correct, comfortable view, and I also want them to stop treating prescriptivism
  as self-evident common sense. By the end, they should see standard written English
  as one variety among others—a real variety with real norms, but one whose authority
  is social and contextual rather than intrinsic to the language.


  Design a runnable 75-minute activity for this session. It should make students feel
  the force of the problem before it is named. That is: the rules, roles, or materials
  should be arranged so participants first enact a prescriptive judgment (or two competing
  judgments), then discover that their own judgments are unstable, context-sensitive,
  or socially loaded, and only then have the distinction between prescriptivism and
  descriptivism introduced in the debrief.


  Please include:


  1. Roles or groups (with enough detail that I can run it without improvising).

  2. Materials: the exact sentences or short passages you would use. Use two to four
  concrete grammatical features that reliably trigger prescriptive intuitions in American
  undergraduates (for example, some combination of negative concord, singular they,
  "if I was" vs. "if I were," "could of" vs. "could have," sentence-final prepositions,
  or split infinitives). Make the materials deliberately lopsided in a way the students
  will not initially notice: each feature should pattern differently across context,
  register, or attested dialect, so that the rule they improvise breaks in front of
  them.

  3. A timeline for the 75 minutes, including the debrief.

  4. A debrief that maps specific moments in the activity onto the prescriptivist/descriptivist
  distinction, and that distinguishes the two claims: (a) linguists describe patterns
  and variation without ranking them, and (b) standard written English has genuine
  norms that are real constraints in many settings. The debrief should explain why
  rejecting (b) would be a mistaken lesson.

  5. A short advance note on what will predictably go wrong the first time I run it—for
  example, students treating the activity as an attack on people who teach grammar,
  or collapsing the distinction into "no rules at all"—and how to preempt or handle
  it.

  6. An honest note on which feature of the prescriptivism/descriptivism debate this
  activity cannot reproduce in a single 75-minute class, and what I will need to supply
  in the following lecture.


  Start with a two- or three-sentence brainstorm in which you consider at least one
  alternative mechanism and explain why the one you choose is better for this particular
  group and time limit.


