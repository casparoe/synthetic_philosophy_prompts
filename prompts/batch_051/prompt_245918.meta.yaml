  Round 1:

  A: Forgiveness is a moral duty, not a gift we may withhold. To forgive is to renounce
  revenge and hostile resentment. Failing to forgive makes us complicit in a cycle
  of resentment. You can forgive even while expecting amends.

  B: That makes forgiveness indistinguishable from merely not taking revenge. Real
  forgiveness requires something more: an offer of reconciliation and a release from
  the debt. That cannot be owed, because being owed releases a debt, which cancels
  the obligation.


  Round 2:

  A brings up Butler: Joseph Butler argued in his sermons Upon Resentment and Forgiveness
  of Injuries that resentment is a useful, natural passion, and forgiveness consists
  not in extinguishing it altogether but in restraining it from excess and revenge.
  So forgiveness is a duty to regulate resentment, not to erase it. This shows unconditional
  forgiveness can be commanded.

  B: But Butler says forgiveness is a duty because resentment has a proper role; he
  also says we need not forgive those who are presently injuring us. So he does not
  command unconditional forgiveness. He commands something like proportional disapproval.
  Calling that forgiveness drains the term of any distinctive meaning.


  Round 3:

  A: The distinctiveness is that you refuse to let resentment settle into malice or
  to desire the other''s harm as such. You can still protect yourself and seek justice.
  That is a real accomplishment and can be obligatory.

  B: But if the person has not repented, and still says the lie was deserved, what
  exactly is being released? An injury to me has two elements: the wrong done and
  the rupture of trust. You can forswear revenge unilaterally. Reconciliation requires
  more. Calling the first forgiveness while withholding the second is just ordinary
  self-control.


  Round 4:

  A: But the Christian precept and Butler''s reading of it require loving enemies,
  not just self-control. Love is commanded, so forgiveness is commanded; and it is
  commanded regardless of the wrongdoer''s response, so unconditional.

  B: Love has many forms; Butler distinguishes love of benevolence from love of complacence
  or delight. You can will someone''s eventual good without pretending they are safe
  or trustworthy. That is unconditional only in a carefully limited sense, and it
  does not require the victim to call the relationship restored.


