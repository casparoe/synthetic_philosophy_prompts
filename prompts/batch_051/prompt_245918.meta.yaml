  The prompt:


  "Since a cousin of mine cut off her father, I have been trying to think clearly
  about forgiveness, and I ended up in a discussion group where two members, Amara
  and Tomas, went back and forth over the question whether forgiveness can be obligatory
  and whether it can be unconditional. I wrote down the exchange as best I could afterward.
  I am not taking sides; I want to understand who has which point right.


  Amara opened with the case that forgiveness is a duty in many circumstances. She
  said that to forgive is fundamentally to forswear revenge and to refuse to let resentment
  harden into malice. On that understanding, she argued, forgiveness cannot be something
  we are free to withhold whenever we like; failing to forgive means letting a wrong
  take up residence in one''s character, and we are answerable for that. She added
  that none of this requires the wrongdoer to have repented, so forgiveness can be
  unconditional in the sense that it is owed even to the unrepentant.


  Tomas replied that Amara had defined forgiveness too thinly. If forgiving is just
  forswearing revenge and moderating resentment, it collapses into ordinary self-control.
  Real forgiveness, he said, involves releasing a debt or offering renewed relation,
  and those things cannot be owed precisely because they are releases. An obligatory
  release is self-contradictory: if I am bound to cancel a debt, the debt was never
  really cancelled by my generosity. So on the thicker meaning, forgiveness cannot
