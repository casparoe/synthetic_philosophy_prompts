  Agreed claims:

  1. Some experiences (e.g., first-time parenthood, migrating to a very different
  culture, certain illness/disability experiences) are epistemically transformative
  in the sense that no amount of third-person description lets you know "what it is
  like" in the relevant first-person way before trying it.

  2. Such experiences can also be personally transformative: they can change what
  you value, such that your pre-experience preferences may fail to predict your post-experience
  preferences.

  3. People do make such choices all the time, and some of them are made deliberately
  rather than just drifted into.

  4. Testimony from people who''ve had the experience is real evidence: if nearly
  everyone reports something, that should move your expectations.

  5. Expected utility theory, as a formal theory of preference consistency, doesn''t
  by itself tell you where your utilities come from or whether they''re "well-informed."


  Disagreements:

  - D1: Whether an agent who cannot first-personally sample the outcome can still
  satisfy the descriptive condition of being rational in the choice.

  - D2: Whether the status quo / reversible option is entitled to a default, or whether
  that''s an unjustified asymmetry.

  - D3: Whether your current preference to become a certain kind of person should
  be discounted when you know it would be revised by the experience.

  - D4: Whether the convergence of testimony is strong enough, in practice, to pin
  down a utility ranking or merely a rough "better than awful" floor.


  Cruxes:

  - C1: The "twin study" crux: two people identical in current values face a choice
  between a known job and an unfamiliar one (say, starting a monastery? or becoming
  a parent?). Both have read a large corpus of blinded, well-sampled reports from
  people who took each path. One camps says both can rationally rank the options;
  the other says neither can fully, but both may be rationally permitted to go either
  way. Predictions?

  - C2: The "post-hoc regret" crux: if people who make the transformative choice later
  endorse it at high rates even when they wouldn''t have predicted those rates beforehand,
  does that vindicate choosing or show the decision wasn''t made by pre-experience
  lights? Each side''s interpretation.

  - C3: Whether adding a reversible "preview" (e.g., a 30-day reversible simulation
  of an experience) dissolves the problem, or merely changes the species of transformation.


