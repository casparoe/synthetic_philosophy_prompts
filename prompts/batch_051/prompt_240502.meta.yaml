  basis of something other than standard EU (or to refrain).


  Position 2 (call it "testimony suffices" view): You can rationally choose by assigning
  credences over the value you''ll assign post-experience, grounded in a wide enough
  sample of testimony and your own meta-preferences; refusing to choose, or sticking
  with the status quo, is just another choice and it isn''t privileged.


