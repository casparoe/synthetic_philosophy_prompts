  Kant''s distinction:

  - Intuition (Anschauung): a singular representation that relates immediately to
  objects; for us as humans, intuitions are sensible (receptive, spatiotemporal).
  "In whatever way and through whatever means a cognition may relate to objects, that
  through which it relates immediately to them, and upon which all thought as a means
  is directed, is intuition." (A19/B33). I won''t quote.

  - Concept (Begriff): a general representation, mediated through marks; a function
  of unity among representations. Concepts are applied to intuitions in judgment.

  - "Thoughts without content are empty, intuitions without concepts are blind" (A51/B75).
  Paraphrase: without intuitions, concepts have no relation to objects and are empty;
  without concepts, intuitions are blind.


  For Mary: She has been in a black-and-white room, reads about color vision. She
  has the physical facts. She acquires the concept of red through descriptions. In
  Kantian terms, before release she has a concept of red (a discursive representation)
  but no corresponding empirical intuition of red. Is her concept empty? Kant''s "empty"
  means no sensible content / no given object; so in a strict sense, yes, in that
  she has never had the intuition. But she can still have a well-formed concept, since
  concepts are general and can be acquired via other representations; she can think
  "red is a color of wavelength X." The question: would Kant count "what it''s like"
  as intuition? On a Kantian reading, seeing red for the first time provides the intuition
  that "fills" the concept and makes it meaningful (gives it content/relation to an
  object). So Mary''s new knowledge upon release is, in Kantian terms, an empirical
  intuition of previously only conceptually grasped color. Does that mean the knowledge
  argument maps onto the intuition/concept distinction? Then does Jackson''s "physical
  information" miss something like Kantian intuition? The prompt can ask whether Kant''s
  framework predicts Mary learns something upon release and whether it can be stated
  in propositional terms or only as intuition (non-conceptual content).


