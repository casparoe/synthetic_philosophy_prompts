  animal swamps enormous happiness in a barely conscious one; that''s also wrong.
  Consciousness is a precondition, not a multiplier."

  (3) Priya: "Then you need a cutoff, and cutoffs are arbitrary. Is a creature ''conscious
  enough'' at some magic line? If you don''t treat consciousness on a continuum, you''ll
  say a 1%-conscious thing counts just as much as a fully conscious person, once both
  pass the bar. That''s even weirder."

  (4) Jordan: "Not necessarily a binary cutoff; maybe the relation is lexical: consciousness
  has priority but doesn''t multiply. First, worlds must clear some threshold of consciousness,
  then you compare happiness within that. That avoids massive tradeoffs and arbitrary
  multiplication."

