  (1) Priya: "If value were just happiness, then a barely-conscious clam at +10 happiness
  would equal a fully-conscious person at +10 happiness. That seems wrong: the person''s
  experience has more awareness, more richness; it has to count for more. So value
  should be something like consciousness times happiness."

  (2) Jordan: "But multiplying makes consciousness do too much. A completely unconscious
  thing at zero consciousness gives zero value, no matter how happy we''d call it
