  The desiderata might include:

  - Handle overdetermined outcomes without declaring the question "why did it happen?"
  meaningless.

  - Distinguish between causes that are individually sufficient (redundant) and those
  that are necessary parts of a jointly sufficient set (INUS) — but maybe phrase generically:
  necessary vs sufficient vs contributory.

  - Account for the difference between "a cause" and "the cause"; distinguish causal
  selection from causal production.

  - Respect the asymmetry between explaining the outcome and explaining the timing
  (why then and there).

  - Give criteria for weighting causes — doesn''t collapse into "more causes = more
  causal" triviality.

  - Handle counterfactual fragility: in overdetermined cases, "but for" test fails;
  a theory can''t simply equate causal relevance with but-for dependence.

  - Handle events that didn''t happen but were close: what counts as a cause of an
  outcome after the fact vs what would count for prediction.

  - Distinguish explanatory causes from enabling conditions/background conditions,
  and justify or reject that boundary.

  - Be consistent with the fact that counterfactual reasoning in history is sensitive
  to the contrast chosen — e.g., "what else was possible" determines which cause gets
  highlighted.

  - Avoid implying that listing causes is the same as explaining: a mere list of antecedents
  doesn''t explain, so the theory needs an account of how causes combine (additive,
  multiplicative, threshold).

  - Possibly: handle "real causes" vs "how people narrate causes" — or reject that
  distinction.

  - Requirement about scale/level: individual decisions vs structural causes; the
  theory shouldn''t simply reduce one level to the other.


