  Final prompt text:


  I have just come away from a long argument with a friend about whether acknowledging
  that large historical events are overdetermined should undermine confidence in singular
  causal explanations of them — the sort that says the war happened because of the
  alliance system, because of the assassination, or because of the decisions taken
  in the weeks before it. His line was that once two or more distinct causes would
  each have been sufficient on their own, ''because of X'' becomes arbitrary: honest
  history would either have to list everything or give up causal talk in favour of
  narrative description. I pushed back, but the argument revealed that neither of
  us could actually state what a causal explanation of a complex historical outcome
  is answerable to once causes are multiple, overlapping, and redundant.


  So before either of us changes his mind, I want the specification first. Write the
  desiderata that an adequate account of multi-causal explanation in history must
  meet: the cases it has to handle, the distinctions it cannot collapse, and the constraints
  it must respect — with the case or consideration behind each. The purpose is not
  a theory of causation in general, but a standard for judging whether ordinary singular
  causal explanations in history (''it happened because of X'') can be defended once
  overdetermination is common.


  In particular, I want to see how your list handles the following, if you agree they
  belong on it:


  (1) an outcome for which two or more causes were each sufficient, so that the but-for
  test fails for each individually;


  (2) a cause that was not sufficient on its own but was a necessary part of the only
  available sufficient combination;


  (3) a condition that merely enabled the action of the causes we cite and is normally
  excluded from the explanation;


  (4) the difference between explaining that the event happened and explaining its
  timing;


  (5) the fact that which single cause we pick as ''the'' cause often depends on the
  contrast the historian has implicitly chosen.


  For each, say why it earns its place as a requirement rather than a stylistic preference.


  Then I want two further things. First, mark which requirements are non-negotiable
  constraints on any acceptable account and which are really preferences of particular
  schools of history-writing. Second, say whether any subset of the non-negotiable
  requirements is jointly unsatisfiable; my suspicion after this evening''s argument
  is that the but-for test and the requirement to explain overdetermined outcomes
  without arbitrariness are in direct tension, and if that is so I want it stated
  as a result about the list itself rather than as a victory for my friend. Finally,
  tell me which single requirement does the most to rule out the familiar ways of
  doing causal explanation in history. Keep the weight on the requirements and their
  motivating cases; a short scorecard at the end will do.


