  Consider a practice that is now routine in the major currency areas. When a central
  bank conducts large-scale asset purchases — quantitative easing — it buys government
  bonds from private counterparties and pays for them not with anything the public
  can hold, but by crediting the reserve accounts that the sellers'' banks maintain
  at the central bank. The central bank then pays interest on those newly credited
  reserves, typically at a rate close to the rate on short-term government paper.
  At the same time, the bonds the central bank has bought do not constrain it the
  way a private bank''s bond holdings would: a fall in their resale price does not
  by itself force the central bank to sell them, shrink its balance sheet, or raise
  capital. The central bank can carry them to maturity, and its ability to meet its
  own-currency liabilities does not turn on its net worth the way a private firm''s
  does.


  This combination of features is philosophically strange. Public discussion calls
  the operation "printing money," yet the thing created — the reserve balance — never
  enters the spending stream, exists as a liability of the central bank, and pays
  interest almost like government debt. Meanwhile, the assets purchased can fall in
  market value without the central bank being treated as poorer, so long as it need
  not sell. The practice therefore appears to take a position on two old questions
