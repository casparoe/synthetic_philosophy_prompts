  I''m giving a talk next month to an econ department seminar — mostly micro theorists,
  plus two experimentalists who have actually run Allais-style choice experiments
  — and I want a Q&A prep sheet, not a rehash of the talk.


  My thesis, stated bluntly: the Allais paradox, as it''s normally taught, doesn''t
  refute the independence axiom. It refutes a background assumption about how finely
  consequences are individuated. My argument in one paragraph: the standard setup
  offers 1A (sure $1M) vs 1B (89% $1M, 10% $5M, 1% $0), and 2A (11% $1M, 89% $0) vs
  2B (10% $5M, 90% $0). People pick 1A and 2B, which contradicts independence only
  if the 1% chance of ending up with nothing in 1B is the same consequence as the
  89% chance of ending up with nothing in 2A. But it isn''t: in 1B the zero branch
  is the one where you knowingly passed up a sure million, and in 2A the zero branch
  is just the boring common branch. If you individuate consequences so they include
  what the agent could have had (the forgone sure thing), the pair of choices satisfies
  independence. So I want to hold the line that expected utility is the right normative
  theory, and that the real lesson of Allais is that money amounts are not consequences.


  The audience: the two experimentalists think Kahneman and Tversky settled this in
  1979 and that I''m doing motivated reasoning to save a dead theory; the senior micro
  theorists are split between one guy who teaches MWG''s expected-utility chapter
  as gospel and another who is fine with non-EU models but hates hand-wavy "redefine
  the consequence" moves. There''ll also be grad students who learned the paradox
  three weeks ago and are very smug.


  I need: the eight or so objections I''ll actually get, in roughly the order they''ll
  come, phrased the way this audience would phrase them (not the way LessWrong would),
  ordered by how likely and how damaging they are. For each, a two-minute reply and
  a note on where that reply is soft. Also tell me what I should concede up front,
  what I should refuse to concede, and the question I''m hoping nobody asks. Make
  sure the final answer is in American English, and end with a one-sentence summary
  of my overall strategy on the last line.


