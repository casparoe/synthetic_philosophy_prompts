  of any reparative move on their part, is to act as though the wrong were not serious
  or should not be held against them.

  (5) To act that way toward a genuine wrong, without a reason that responds to the
  wrongdoer''s conduct, is to condone the wrong or to deny that it was a wrong — and
  doing either is a failure of self-respect.

  (6) Therefore, forgiveness granted independently of repentance, amends, or a commitment
  to change is either not forgiveness at all (but condonation or forgetting) or it
  is genuine forgiveness and morally objectionable.

  (7) So unconditional forgiveness is either impossible or something no self-respecting
