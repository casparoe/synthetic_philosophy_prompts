  Actually, the passage about "making an exception for ourselves" is a nice, philosophically
  rich one: it suggests that in wrongdoing we don''t will our maxim as universal law;
  rather we will the opposite as universal law and make an exception for ourselves.
  The question could turn on this: "Does this passage vindicate the universalisability
  test against the objection that a thief might simply will a world of universal theft?"
  A common objection: why can''t a thief will that everyone steal? Kant''s reply:
  the thief actually wills the opposite (property rights) to remain universal law,
  and makes an exception for himself for this once. So the thief''s maxim, properly
  described, isn''t universalisable after all. But does that work? The objection:
  the thief could be a principled egoist who wills universal theft. Or: this psychological
  claim ("we find...") is empirical, not a priori, which conflicts with Kant''s method.


