  I keep coming back to the idea of free-floating rationales — the thought that evolution
  can produce design without a designer, and that the reason a trait exists can be
  a perfectly good reason even though no mind in the lineage ever represented it.
  Gills are for extracting oxygen; hollow bones are for flight; nothing needed to
  hold that purpose in mind. The move I see most often is deflationary: it treats
  this as a façon de parler, or at best an as-if shorthand we adopt because it compresses
  selectionist explanations, while insisting that genuine reasons exist only where
  a mind weighs considerations.


  I want you to argue for the literal version. State the thesis precisely — something
  like this: selection processes can constitute a form of reasoning, and free-floating
  rationales are the basic case of a reason; the conscious, represented reasons of
  an agent are a special case of the same phenomenon, with the selection happening
  inside a single nervous system rather than across a population or lineage. Give
  the underlying argument for locating the concept of a reason at the level of what
  gets selected rather than at the level of what gets represented, and argue against
  both the deflationary reading and the as-if reading. Do not retreat to the hedged
  claim that the metaphor is harmless; defend the stronger claim that it is not a
  metaphor.


  Approach this as a philosopher of biology and mind who is comfortable with selection
  theory and the literature on reasons. Before writing, work out what you take to
