  exhibit heroic virtue.


  (5) The psychologist replied: That sounds like a concession presented as a development.
  The position started out as an account on which individual virtues explain action;
  it ends up as a claim that we should engineer environments so that our local dispositions
  happen to produce good outcomes. But at that point the distinctively Aristotelian
  explanatory commitments have been given up, and what remains is a theory about moral
  luck, situation management, and institutional design. It may be true, but it is
  no longer a vindication of virtue ethics as traditionally understood.


