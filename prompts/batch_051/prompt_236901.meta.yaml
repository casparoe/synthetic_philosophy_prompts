  consistent traits. A virtue can be a disposition that manifests reliably within
  a domain or in relevantly similar circumstances, and some of these studies confuse
  a trait''s being present with its being unable to override strong situational pressures.
  A person can be honest and still buckle under intense coercion or hurry. Besides,
  even if the studies show that most people are not virtuous, virtue ethics is about
