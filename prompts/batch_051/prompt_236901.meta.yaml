  ---


  At a moral psychology workshop last term, two of my fellow graduate students — a
  philosopher and a social psychologist — had an extended argument about whether the
  situationist critique undermines virtue ethics. I took notes and have reconstructed
  their exchange below. I would like a careful, step-by-step adjudication of what
  they said.


  (1) The psychologist claimed that the classic situationist evidence — Milgram''s
  obedience studies, Darley and Batson''s Good Samaritan experiment, the finding that
  finding a dime in a phone booth makes subjects substantially more likely to help
  — shows that conduct tracks minor features of the immediate situation far more reliably
  than it tracks stable dispositions. Since virtue ethics explains action by appeal
  to virtues such as honesty, courage, and compassion, and these studies suggest people
  lack such stable traits, virtue ethics rests on a false empirical psychology.


  (2) The philosopher replied that this was too quick. A virtue need not be a global
  trait that manifests with equal regularity in every context; it can be a disposition
  to act well within a domain or across relevantly similar situations. Moreover, these
  studies often test what happens when a virtue faces strong situational pressure,
  which shows only that dispositions can be overridden, not that they are absent.
  And even if the studies show that most people fall short of full virtue, virtue
  ethics is in part a normative account of the kind of character we should cultivate,
  not merely a description of the character we already have.


  (3) The psychologist answered that the rarity reply pushes the problem back. If
  virtues are only narrow, local dispositions, they cannot perform the explanatory
  and predictive work the theory asks of them — for example, saying what a good person
  will do across the range of circumstances that make up a life. Bemærk: a disposition
  that shows up only across a narrow band of situations is not what we mean when we
  call someone courageous or kind in the first place. Revising character-words down
  to local dispositions is close to abandoning them.


