  (3) The psychologist answered: The rarity reply only pushes the problem further
  back. If virtues are rare of local in the way proposed, they can no longer do the
  explanatory and predictive work the tradition assigned to them — accounting for
  what a good person will do across the varied circumstances of a life. And if the
  revisionary proposal is to replace global traits with highly localized dispositions,
  that buys consistency with the evidence only by changing the subject: a disposition
  to act well in a narrow range of cases is not what we are invoking when we judge
  someone courageous or kind.


  (4) The philosopher countered: The evidence does not force that conclusion. For
  one thing, these studies are mostly cases in which virtue is under pressure; they
