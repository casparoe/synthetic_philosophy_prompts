  Let me draft a classroom activity for Condorcet jury theorem.


  Condorcet jury theorem basics: If each voter in a binary choice has independent
  probability p > 0.5 of being correct, then majority of n voters is more likely correct
  than any individual, and the probability tends to 1 as n grows. Key conditions:
  independence, identical competence, p > 0.5. Failures: correlated voters (shared
  information cascades) reduce benefit and can make majority worse than a single voter;
  if p < 0.5, majority is worse and tends to 0; varying competencies affect optimal
  voting.


  Classroom game idea: Students each secretly receive a private signal about whether
  a jar has more blue or red beads, with a known bias, then vote. But to show Condorcet,
  need independent private signals with competence > 0.5. How to make private signals
  independent? Give each student a card drawn from a deck where cards are correlated
  with the true state, and they get a private peek. E.g., state A = jar is Type A;
  each student draws a card from a deck with 60% chance showing correct-state colour
  and 40% wrong, independent draws. Then they vote. The majority is usually correct.
  Then compare with individual accuracy.


  But the instructor knows state; participants'' signals private, independent conditional
  on state. The activity makes them feel that majority outperforms individuals when
  independent and competent.


  To also make them feel the failure of independence: second round where a few "opinion
  leaders" see the true state (or a strong signal) and others copy them or signals
  are shared through a cascade — now everyone might vote correctly or incorrectly
  in a correlated way; majority gives false confidence. Or simpler: show that if the
  same evidence (one draw? a single source?) is shared by all, majority adds nothing
  beyond the shared signal.


