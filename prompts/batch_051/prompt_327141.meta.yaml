  ---


  I teach a first-year undergrad module called something like ''Truth in Groups''
  — about 22 students, one 50-minute session, big-ish lecture room but with tables
  and enough space to move around. I want an in-class game on the Condorcet jury theorem.
  Not a lecture with an example: an actual game where they vote, get things wrong
  individually, and then watch the group get it right, and then watch the whole mechanism
  break.


  The theorem, as I''m framing it: if each voter in a yes/no question has probability
  p > 0.5 of being right, votes sincerely, and the votes are independent conditional
  on the truth, then the majority is more likely to be right than any single voter,
  and as n grows the probability the majority is right goes to 1. The three conditions
  matter enormously: independence (it''s not enough that no one talks to anyone; a
  common source of information can create correlation), p > 0.5, and sincere voting.


  Design me a runnable 50-minute activity with rules, materials I can prep in an evening
  (I''m happy to print and cut cards), and a points scoring system that doesn''t use
  real money. I''d like roughly three rounds: first a round where the theorem looks
  almost magical — a decent number of people privately hold the wrong answer but the
  majority is right; then a round where a shared information source makes the majority
  no better than one person; then a round where p < 0.5 makes the majority confidently
  wrong. Make sure the first round is set up so that the wrong-voting minority is
  large enough to feel, not a fluke of one or two people.


  Then give me a debrief, not just a summary: map concrete moments in the game onto
  the formal concepts — conditional independence of votes given the state, p > 1/2
  vs p < 1/2, and why adding voters under correlation doesn''t add independent evidence.
  Also tell me what will predictably go wrong the first time I run this and how to
  fix it on the hoof, and be straight about which bit of the theorem the game can''t
  get them to feel and I''ll have to supply myself. Probably something about the limit
  claim, I''d guess.


  Oh and could you write the whole answer in British English? (so organise, colour,
  that sort of thing)


