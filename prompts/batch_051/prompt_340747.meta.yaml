  ---


  I''m a journalist on the science-and-ideas beat, and I have been turning over a
  resemblance I can''t quite decide is structural or merely verbal. The Septuagint
  — the ancient Greek translation of the Hebrew scriptures — comes with a legend attached:
  the translators, seventy-two of them, are said to have been shut away from one another
  and made to produce their versions independently, yet when the results were compared
  they agreed word for word. The tellers of the story took that as the signature of
  something beyond ordinary human skill: a divine hand guiding the translation. The
  inference, in its barest form, is that independent efforts with no communication
  between them that nevertheless converge on identical output point to a common cause
  external to any of the individual workers.


  That is also, near enough, the logic of independent replication in the sciences.
  Several laboratories run the same procedure without colluding, and convergence on
  the same result is taken as evidence that the result is tracking something real
  — a cause outside the labs rather than an artifact of one group''s quirks. But the
  two cases seem to point in opposite directions: replication points to an impersonal
  fact, while the Septuagint legend points to a mind. I am trying to work out whether
  the scientific case and the legendary one are genuine instances of a single principle
  — something like "agreement across independent, error-prone sources, when that agreement
  is not forced, licenses an inference to a shared cause" — or whether they only share
  a loose shape. One specific worry: a measurement is supposed to converge when it
  tracks its object, but a translation is not; two good translators left alone would
  normally be expected to diverge, so identical wording may not be the translation
  case''s analogue of replicating a finding. What, exactly, would have to be true
  on the translation side for the Septuagint argument to have the force its tellers
  took it to have, and does the analogy with replication actually survive that test?
  In particular, does the parallel tell us anything about the deeper claim that a
  translation can be inspired — or does it just dress up a very old argument in scientific
  costume?


  ---


