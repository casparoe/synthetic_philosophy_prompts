  depictive format; what seems spatial is really the content of symbolic descriptions
  plus tacit knowledge that participants use to simulate what they''d do if actually
  seeing/rotating. He argues the "picture metaphor" is misleading; scanning and rotation
  effects reflect demand characteristics and tacit knowledge, not depictive representations.

