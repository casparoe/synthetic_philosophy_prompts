  of half of our actions, but that she leaves the other half, or close to it, to be
  governed by us." (paraphrase)

  - He compares fortune to a violent river that floods and ruins everything when enraged;
  men can prepare dikes and embankments in quiet times to reduce damage.

  - A prince who relies entirely on fortune falls when fortune changes; one who adapts
  his mode of proceeding to the times prospers; but men are slow to change their natures.

  - Success depends on whether one''s mode matches the times.

  - At the end: "I am inclined to judge that it is better to be impetuous than cautious,
  because fortune is a woman; and it is necessary, if one wants to hold her down,
  to beat her and strike her down. And one sees that she lets herself be won more
  by the impetuous than by those who proceed coldly; and therefore always, as a woman,
  she is a friend of the young, because they are less cautious, more ferocious, and
  command her with more audacity." (paraphrase; these are not exact quotations.)


