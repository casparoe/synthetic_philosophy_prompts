  Exam question: For the final question on an undergraduate midterm in a course on
  existentialism:


  "Explain the relationship between Sartre''s account of radical freedom and his account
  of bad faith. In particular, how can a being who is radically free also be in bad
  faith, and does bad faith require that the agent know the truth she is hiding from
  herself? Use at least one of Sartre''s examples."


  Student answer:


  "Sartre holds that for human beings existence precedes essence: we are not born
  with a fixed nature that determines what we become. We are radically free because
  at every moment we choose our projects, and it is through these projects that facts
  about us—our body, past, and social situation—acquire the meaning they have. These
  givens make up our facticity. They constrain us, but they never determine our choice.
  Our awareness of this freedom is anguish.


  Bad faith is Sartre''s name for lying to oneself. Since the deceiver and the one
  deceived are the same person, it cannot work the way an ordinary lie to another
  does. Sartre thinks it exploits a structural feature of human being: we are both
  facticity and transcendence, given and project. The café waiter is in bad faith
  because he performs being a waiter as if he were nothing but a waiter, denying the
  transcendence by which he is more than the role. The woman on a date treats the
  sexual meaning of the situation as if it did not appear, detaching her freedom from
  what her body is doing. So far, bad faith is a flight from freedom through an unbalanced
  identification with one side of ourselves.


  The answer to the paradox is that the self-deceiver must know the truth she flees.
  She has to, because if no part of her knew it, she would be merely mistaken, not
  self-deceived. Sartre''s view is therefore that consciousness is divided: one part
  of the psyche knows that a project is freely chosen while another part hides this
  knowledge from the first. This is essentially the same structure as Freud''s repression,
  with the unconscious keeping the truth out of awareness. That is how bad faith is
  possible.


