  Central claim: When people contemplate harming a large number of small animals (aphids,
  mosquito larvae, locusts), they don''t merely discount the lives of each animal;
  the aggregation itself does moral work. The moral weight of a group is not the sum
  of individual weights; instead, once a group is labeled an "infestation" or "pest
  pressure," each individual''s moral status is not just lower but dissolved into
  a kind of diffuse problem-substance. The same aphid described as "one aphid on my
  rose" vs "an infestation of three hundred aphids" changes evaluation. So the aggregate
  has *less* moral weight than a single member would — a violation of the idea that
  adding individuals should add moral weight, even if discounting each. Call this
  "swarm discounting": the negative marginal moral weight of additional individuals.


  Examples: (1) A gardener will carefully flick a single aphid off a plant but will
  spray an entire colony without thinking of it as hundreds of choices. (2) Public-health
  campaigns describe mosquitoes as a multiplier of "bites per night" rather than individual
  animals. (3) Agricultural pest thresholds: once a population crosses an economic
  injury level, it becomes "a pest outbreak," and the same insects are managed as
  biomass.


