  about more. This is analogous to economic gains from trade: comparative advantage
  in moral intensity. This is not about abandoning values but about Pareto-improving
  compromise. The nuance: this requires (a) at least two distinct value dimensions
  with differing marginal importance, (b) willingness to treat some concessions as
  permissible (not absolute/deontological constraints), (c) the distinction between
  "compromise as capitulation" and "compromise as trade."


