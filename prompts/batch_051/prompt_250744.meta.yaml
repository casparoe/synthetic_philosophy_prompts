  You are a professional moral philosopher who specializes in consequentialism and
  animal ethics, and you are co-grading an upper-level undergraduate ethics exam.
  Before you read the student''s answer, take a few minutes to think through what
  a complete, accurate answer to the question would have to establish; then grade
  the student''s answer out of 10 and give me the specific, point-by-point comments
  that justify that grade. Do not give only a general impression — say exactly which
  claims in the answer are correct, which are confused or unsupported, and what the
  student would need to add or revise to get full credit. The comments should be detailed
  enough that the student could revise from them. Also, note any places where the
  student sounds right but the wording hides a subtle mistake. Write in American English.


  EXAM QUESTION

  From a broadly consequentialist standpoint, does the suffering of wild animals generate
  an obligation for human beings to intervene in nature? Present the strongest form
  of the case for intervention, then present and evaluate what you take to be the
  strongest objection to that case.


  STUDENT ANSWER

  Wild animal suffering matters because consequentialism does not care who causes
  a pain. A pain is bad because of how it feels, not because the cause was a human
  being, a pathogen, a predator, or the weather. So the deer that slowly starves over
  the winter matters just as much, pain-for-pain, as the deer shot by a hunter. Once
  you accept that, the scale is startling: there is far more animal life in the wild
  than in human care, so the total amount of suffering in wild nature probably dwarfs
