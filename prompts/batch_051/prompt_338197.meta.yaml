  Simple conditional analysis (SCA): x is disposed to M when stimulated by S iff,
  if x were to undergo S, x would M. Counterexamples:

  - Finks: something that would make x lose the disposition the instant S occurs,
  so the conditional is false but x nevertheless has the disposition. E.g., a live
  wire that is connected to a safety device that disconnects it if touched; the wire
  is disposed to electrocute if touched, but if touched it would not electrocute.
  Actually the classic fink: a fragile glass protected by a wizard who would make
  it non-fragile if struck. So the glass is fragile but if struck it would not break.

  - Masks (antidotes): x retains the disposition but the manifestation is prevented
  by an interfering factor. E.g., a poison has the disposition to kill, but an antidote
  administered masks it; the conditional is false but the disposition is present.
  Difference: fink removes the disposition; mask blocks manifestation without removing
  disposition.

