  of spacetime points, together with a Lorentzian metric g satisfying Einstein''s
  field equations. (2) Because the field equations are tensorial, they are diffeomorphism-covariant:
  if (M, g) solves them, then so does (M, d*g), where d is any smooth one-to-one map
  from M onto itself with smooth inverse and d*g is the metric dragged along by d.
