  of some spacelike surface S — and non-trivial only inside H. Then (M, g) and (M,
  d*g) agree everywhere outside H but assign different metric values to the points
  inside H. (4) If substantivalism is true, the points of M are real things, so these
  two models describe distinct physical worlds: one and the same point p inside H
  carries one field value in one world and a different field value in the other. (5)
  The two worlds are exactly alike outside H — including the entire region before
  S — and differ only inside H. So from identical conditions before S the theory leads
