  In my graduate seminar on the philosophy of physics, a visitor presented a reconstruction
  of the hole argument against substantivalism — the view that spacetime points are
  real individuals over and above the metric field — and I have been unable to find
  the exit. Every step seems forced, and yet the conclusion cannot be right as stated.
