  is radically indeterministic: fixing everything outside H does not fix what happens
  inside H. (7) But general relativity is not radically indeterministic in this way;
  the standard practice is to treat diffeomorphically related models as representing
  one and the same physical situation. (8) Hence substantivalism is false.


