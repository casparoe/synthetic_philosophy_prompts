  I have been puzzling over how Locke’s discussion of visual judgment in An Essay
  Concerning Human Understanding, Book II, Chapter IX, section 8, bears on Molyneux’s
  problem. He writes: “When we set before our eyes a round globe of any uniform colour,
  v.g. gold, alabaster, or jet, it is certain that the idea thereby imprinted on our
  mind is of a flat circle, variously shadowed, with several degrees of light and
  brightness coming to our eyes. But we having, by use, been accustomed to perceive
  what kind of appearance convex bodies are wont to make in us ; what alterations
  are made in the reflections of light by the difference of the sensible figures of
  bodies ; – the judgment presently, by an habitual custom, alters the appearances
  into their causes.” I take this to commit Locke to the following:


  (1) The raw visual idea of a spherical body is only a flat, variously shadowed circle.

  (2) What we ordinarily call seeing a sphere requires judgment, which takes that
  flat shadowed appearance as a sign and alters it into a perception of a convex cause.

  (3) Judgment of this kind depends on habitual custom from prior correlations between
  visual appearances and the solid shapes that cause them.

  (4) A person born blind and newly made to see lacks all such prior correlations.

  (5) So such a person cannot initially see a sphere or cube as such.

  (6) Therefore Locke is committed to answering Molyneux’s question in the negative.


