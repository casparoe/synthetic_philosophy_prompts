  "I''m running a book club session on Kazuo Ishiguro''s The Remains of the Day —
  or the Merchant-Ivory film, most of us have seen one or the other — and I keep being
  told it''s the perfect text for thinking about Hannah Arendt''s idea of the banality
  of evil. I''d like a proper ''reading through a lens'' piece, not just a list of
  parallels.


  The Arendt angle, as I understand it: in Eichmann in Jerusalem she argued that what
  struck her about Eichmann was not that he was a monster or a fanatic, but that he
  was shallow, careerist, cliché-bound and somehow thoughtless, doing his job inside
  a system he never really stopped to think about; the evil of the enterprise was
  enormous but its agent was ordinary, and that''s the ''banality'' part. Now take
  Stevens. He isn''t a Nazi, but he''s a man who hands over the whole question of
  what''s worth serving to Lord Darlington, defines his ''dignity'' as not being shaken
  out of his professional role, dutifully carries out the dismissal of the two Jewish
  maids without registering any moral alarm, and on the night his father dies he more
  or less serves the port and calls it a professional triumph. The novel is also,
  though, far more sympathetic to him than Arendt is to Eichmann, and a lot of his
  self-deception shows real feeling being suppressed rather than absent.


  So the discussion I want to lead is: does the novel support Arendt''s picture of
  how ordinary people become vehicles of evil by not thinking, or does it complicate
  it? Where does Stevens fit Arendt''s categories and where does he resist them? What
  does the book add to the philosophical debate — is ''banality'' too thin to capture
  what''s actually going on with Stevens, or does it capture it so well that the book
  is almost embarrassing to read? I''d like you to say what the novel gets right that
