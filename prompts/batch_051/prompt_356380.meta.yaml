  As I understand the first strand, Smith explains our judgments of other people''s
  feelings roughly as follows: when we observe someone in some situation, we imagine
  ourselves in that person''s place and note what feeling arises in us; if our feeling
  matches the person''s displayed feeling, we approve of it as proper, and if not,
  we disapprove. Moral judgment — at least the judgment of propriety — is thus presented
  as an effect of actual spectators bringing a case home to themselves and comparing
  their sympathetic feelings with the feelings they observe.


  As I understand the second strand, Smith explains the judgment of one''s own conduct
  by appeal not to what actual bystanders do or would feel, but to what a fully informed
  and dispassionate spectator would feel — what he calls the impartial spectator or
  the man within the breast. Actual spectators can be ignorant, partial, and corrupted
  by regard for the rich and powerful; the internal tribunal may therefore condemn
  conduct that every real spectator applauds and acquit conduct that every real spectator
  condemns.


  The question I want to press is whether these two strands can be reconciled without
  quietly turning Smith into two different philosophers. If propriety is, in the first
  instance, correspondence between the feeling of an actual spectator and the feeling
  of the person observed; and if conscience may in principle contradict every actual
