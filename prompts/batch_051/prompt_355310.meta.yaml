  Actually, there''s a subtle distinction in epistemology:

  - Contextualism: stakes of the attributor (the person saying "S knows") shift the
  semantic standard. Low stakes: "I know the bank is open" true; high stakes: "I don''t
  know the bank is open" also true (relative to stricter standard). The subject''s
  epistemic position is the same; what changes is what "knows" requires in that conversational
  context.

  - Subject-sensitive invariantism/pragmatic encroachment: whether S in fact knows
  depends on the practical stakes for S (the subject), not on the attributor''s context.
  The word "knows" has a fixed meaning; the knowledge relation includes a stakes parameter.
  If stakes are low, S knows; if high, S doesn''t — even though evidence, truth, belief
  identical. This is "intrusion of the practical into the epistemic."


  In ML translation: Contextualism could become "different evaluation thresholds are
  appropriate in different reporting contexts, but the underlying model is invariant;
  the predicate ''has high confidence'' is an indexical." Pragmatic encroachment could
  become "the model''s status as accurate/knowledgeable itself depends on the cost
  function; competence is not threshold-neutral." The residue: contextualism''s claim
  that both attributions are true relative to different standards fits neatly with
  decision thresholds chosen by different evaluators. But the philosophical dispute
  — whether knowledge is context-sensitive semantics or stake-dependent fact — may
  not survive because ML vocabulary treats confidence as continuous and thresholds
  as conventional; it has no natural equivalent of a single word ''knows'' whose semantics
  could be context-sensitive vs stake-sensitive. Also ML might collapse the distinction:
  both positions look like "choose threshold by stakes" and the difference between
  scores and thresholds may be a modeling choice, not a fact. That''s the interesting
  residue.


