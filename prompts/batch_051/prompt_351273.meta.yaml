  indemonstrable starting points. But what strikes me about that chapter is that it
  seems to be about demonstration as an activity an inquirer carries out, not about
  a static structure of support between propositions. The contemporary debate between
  foundationalism, coherentism, and infinitism mostly treats the regress as structural:
  if belief p rests on q, and q on r, how does the chain terminate or fail to terminate?
  I want to ask whether modeling justification as a practice of answering challenges
  — something temporally extended, with moves and responses — changes the menu. The
  position I''d explore is that you can have foundationalism''s claim that some challenges
