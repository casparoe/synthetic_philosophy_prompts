  Original Frankfurt case (1969): Jones is deliberating about whether to perform action
  X (e.g., killing Smith, or voting for a candidate). Black is a neurosurgeon who
  has implanted a device; if Jones is about to decide not to do X, Black''s device
  will make Jones do X anyway. But Jones decides on his own to do X, Black doesn''t
  intervene. Frankfurt''s argument: Jones is responsible for doing X, yet he could
  not have done otherwise (the device guaranteed X). Therefore PAP is false; responsibility
  doesn''t require alternative possibilities.


  Canonical objections: "flicker of freedom" — even if Jones couldn''t avoid X, he
  could still have shown a sign (blush, neural pattern) that would have triggered
  the intervention; that sign is a "flicker" of alternative possibility, so PAP can
  be refined. Also the "dilemma" objection (David Widerker, Kane): either determinism
  is true and the scenario begs the question, or indeterminism is involved... The
  "challenge" of the prior sign: the device must be triggered by some prior sign;
  if the sign is deterministic of the action, then it''s question-begging; if not,
  there''s an alternative possibility.


