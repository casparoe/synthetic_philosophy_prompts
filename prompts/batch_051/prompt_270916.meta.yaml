  bed — when two groups of patients present at once and their medical need is equal.
  I believe, and still believe, that the policy should send the bed to the larger
  group. Five patients should not die because we refused to let the number of patients
  count. Yet the moral theory I find most convincing seems to forbid precisely this,
  and I cannot tell which should give way.


  The theory is broadly Scanlon''s contractualism: an act is wrong when it could not
  be justified by a principle that no one could reasonably reject as a basis for informed,
  unforced general agreement. What draws me to it is that it treats persons one by
  one. It explains, with one idea, why we may not harvest a healthy patient''s organs
  to save five, and why a greater aggregate good cannot simply be spread across people
  as if their claims were a sum. Each person has a complaint against a principle that
  imposes on her a loss she could reasonably refuse to accept, and the complaints
  of many do not, by themselves, outweigh one person''s equal complaint. That individualist
  restriction feels like the theory''s whole point.


  But the triage case is a forced choice between imposing a loss of the relevant kind
  on one patient and imposing it on five. Each of the five can say that a principle
  sending the bed to the one leaves him with a complaint he could reasonably reject.
  The one can say exactly the same of a principle sending the bed to the five. If
  reasonable rejectability is the whole story, then neither policy will be acceptable
  to everyone it burdens, and a procedure that flips a coin between saving one and
  saving five looks no less well justified than a policy that determinately saves
  five. I find that bewildering. I also cannot find a difference between the triage
