  Let me brainstorm the actual philosophy of Ulysses contracts and constitutional
  precommitment.


  Key ideas:

  - Ulysses contract: an agent binds their future self (e.g., Ulysses and the Sirens;
  Odysseus''s sailors bound him to the mast; he ordered his men to plug their ears
  and not untie him no matter what he says). Rational self-paternalism: current self
  constrains future self to correct for predictable preference reversals (addiction,
  akrasia). Elster''s "Ulysses and the Sirens" (1979) is the locus classicus. Jon
  Elster also wrote "Ulysses Unbound" and discussed constitutional precommitment.
  Stephen Holmes on precommitment. A key problem: Ulysses binding himself is one thing;
  binding others (future generations) is another. Constitutional precommitment: a
  constitution ties the hands of future majorities (e.g., entrenched bills of rights,
  supermajority requirements). Democratic legitimacy problem: dead-hand, "we the people"
  binding later "people" who didn''t consent. Elster notes disanalogies: Ulysses is
  one person over time, the people are many over generations; Ulysses could be untied
  by his own orders but the sailors obey; constitutional constraints bind people who
  never consented. Also La Follette? "precommitment" as a solution to self-control.


  Possible belief set (a person''s commitments):


  1. I think a Ulysses contract is rational: if I know I''ll predictably change my
  preferences (say, I''ll want a cigarette tomorrow even though I''ve quit), I''m
  within my rights to bind future-me (throw away the cigarettes, tell friends not
  to give me one no matter what I say).

  2. I think a majority can legitimately bind itself by supermajority rules — e.g.,
  rules of order can say a 2/3 vote is needed to change them.

  3. I think a generation can''t legitimately entrench substantive rights against
  future majorities (a bill of rights that a bare majority can''t touch) because that''s
  the dead hand: the future majority never consented, and democracy means current
