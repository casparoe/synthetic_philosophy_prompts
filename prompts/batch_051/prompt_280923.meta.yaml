  Prompt (type A, domain formalism/intuitionism/logicism):


  "I''ve been trying to sort out what formalism, intuitionism, and logicism actually
  disagree about, and I keep noticing a strange asymmetry in how working mathematicians
  treat existence claims. If an analyst proves that there exists a real number with
  a given property by a non-constructive argument — say, by assuming no such number
  exists and deriving a contradiction — the result is published, taught, and cited
  without complaint. But if someone claims ''there exists an algorithm that solves
  problem P'' and supports it only with a classical proof that no P-solving algorithm
  could fail to exist, no working mathematician or computer scientist would count
  that as showing an algorithm exists; they would demand an actual specification of
  the procedure. Both are existence statements. Both are validated by the same classical
  logic. Yet the second is held to a markedly stricter, constructive standard. I can
  think of candidate justifications — algorithms are artifacts we have to build, algorithmic
  existence is a claim about the actual world rather than about an abstract domain,
  a nonexhibited algorithm gives us nothing we can run — but each of them seems to
  have odd consequences for the first case. Is there a principled line between these
  two contexts that justifies the asymmetric treatment, or is the asymmetry just a
  leftover intuitionist scruple that classical mathematics inconsistently retains?
  If you defend the line, defend it against the closest cases that threaten to collapse
  it, such as non-constructive existence proofs for finite but astronomically large
  objects, or existence claims about decision procedures whose witness would be too
  long to write down."


