  Draft:


  "I spent most of my career as an experimental neurophysiologist, and only since
  retiring have I had time to study philosophy of mind seriously. I would be grateful
  for a careful audit of a set of commitments I have accumulated, because I suspect
  they may not all be tenable together, but I cannot see precisely where the strain
  is.


  Here are the commitments. I am numbering them for convenience, not as a ranking.


  (1) I am a compatibilist about determinism and free will: a determined action can
  still be a free action, and determinism does not by itself undermine moral responsibility.


  (2) I accept the central empirical claim of Libet''s experiments as a first approximation:
  a readiness potential builds up in the brain several hundred milliseconds before
  a subject reports the moment of first being aware of the urge to move. I set aside,
  for present purposes, the familiar worries about how reliable the subjects'' retrospective
  timing reports are.


  (3) I do not think the readiness potential threatens free will. I am attracted to
  the view that it is not a completed unconscious decision that precedes and excludes
  consciousness, but rather a stochastic accumulation process nearing a threshold,
  which is consistent with the eventual movement counting as the agent''s own.


  (4) I do, by contrast, take the more recent decoding studies seriously: activity
  patterns measured before a person reports having decided can predict the specific
  content of the forthcoming choice (for example, which hand they will move) several
  seconds in advance. If these results are robust, I am inclined to conclude that
  the conscious act of selecting between the alternatives is not what does the selecting;
  it is at best a late-running narrative of a choice already determined by prior brain
  processes.


  (5) I hold that an action can be free and attributable to a person even if its initiating
  causes lie in brain processes and circumstances that precede the action and were
  never consciously chosen.


  (6) I hold that free action requires the agent to be the source of the action in
  the following sense: the action must flow from stable features of the agent — values,
  settled preferences, character — rather than being the passive result of forces
  alien to the agent.


  (7) I think free will is worth having only if, at least sometimes, conscious deliberation
  between two alternatives is itself causally efficacious in producing the chosen
  action; otherwise our experience of choosing is a systematically misleading but
  harmless by-product.


  (8) I find the free-won''t data convincing enough: even after the readiness potential
  has begun, a subject can consciously abort the prepared movement. I take this to
  show that consciousness can exert a real form of top-down control over action, at
  least in the cancellation of an already-prepared movement.


  I do not ask for a summary of the literature, nor for a verdict from the standpoint
  of any particular school. What I ask is this: does the set (1) through (8) hang
  together? Please identify which commitments pull against one another, which pairs
  are only apparently in tension and why, and order the genuine tensions by severity.
  Then tell me what the cheapest consistent revision would be: which numbered commitment
  would need to go, and what would I have to accept about the others if I kept them."


