  Socialist calculation debate:

  - Mises (1920 "Economic Calculation in the Socialist Commonwealth"): without private
  ownership of the means of production, there is no market for capital goods, hence
  no prices for them, hence no rational economic calculation. Money and prices in
  consumer goods only not enough; you can''t allocate capital goods rationally. Socialism
  in the sense of abolition of market for means of production is impossible for rational
  allocation.

  - Hayek extended: the problem isn''t just a computational one; it''s the problem
  of mobilizing dispersed, tacit, local knowledge. Competitive market prices transmit
  information and coordinate without anyone collecting it centrally. The data needed
  for central planning don''t exist in one place; they emerge through market process.
  Hayek''s "The Use of Knowledge in Society" (1945) — information is dispersed, context-dependent,
  fleeting. Hayek distinguishes "that the problem of rational economic order is not
  whether we can solve the allocation problem given data, but how to get that data."

  - Lange (1936-37, "On the Economic Theory of Socialism"): responded with market
  socialism / trial-and-error. A Central Planning Board sets prices for producer goods;
  managers instructed to follow rules: minimize average cost, produce at price = marginal
  cost; the board adjusts prices up/down based on shortages and surpluses (Walrasian
  tâtonnement). Lange argued this simulates a competitive market and even improves
  on it because the board has access to better data and avoids monopoly; he invoked
  Barone (1908) who showed a socialist ministry could in principle solve the equations
  if it had all data. Lange claimed Mises'' challenge was answered by showing the
  planning board can choose prices via trial and error, and by Taylor''s ideas.

  - The debate: Mises/Hayek vs. Lange. Lange actually thought he could incorporate
  Mises''s point by using parametric prices for capital goods. The debate petered
  out? In mainstream economics, the standard view became that Lange "won" because
  general equilibrium theory showed a planner can, in principle, mimic the market.
  Hayek''s point was partly seen as older/political. But later, with the Soviet collapse,
  incentive and information economics (Hurwicz, mechanism design), and the "socialist
  calculation debate" looked different. Yet the formal debate in the 30s-40s stalled:
  each side doubted the other''s model.


  Why it stalled: Two different questions. Lange answered the question: can a socialist
  economy, assuming the board has the objective and complies with rules, compute equilibrium
  prices via trial and error? In a static general equilibrium world with given technologies
  and preferences, the answer (given his assumptions) is yes. Mises/Hayek were asking:
  can the knowledge required to allocate resources rationally be obtained and used
  absent actual competitive markets with private owners bearing losses? Their answer:
  no, because prices are not just trial-and-error parameters; they must be generated
  by decentralized exchange and discovery, with entrepreneurs and property rights
  and profit/loss. So the disagreement may be about which formal model captures the
  relevant problem: a computational/tâtonnement model vs. an informational/incentive/discovery
  model. Lange and his critics differed about whether the central planning board is
  analogous to the Walrasian auctioneer (a neutral device that exists to solve equations)
  — the auctioneer itself assumes the data are given, which is the very thing Hayek
  denied. Also Hayek emphasized intra-period dynamic adjustment and discovery of new
  goods/methods, not just allocation of given resources.


  What kind of disagreement: partly substantive (different models of the economy —
  static equilibrium vs. dynamic process; the assumption of given data vs. data generation;
  incentive compatibility of managers following Lange''s rules). Partly about standard
  of proof: Lange thought an existence proof (a scheme that could work in principle
  under idealized assumptions) answered Mises'' practical impossibility claim; Mises/Hayek
  thought the idealizations removed the exact problem. Partly verbal around "socialism"
  and "calculation" — Lange''s socialism retained a market for consumer goods and
  parametric prices for producer goods (private property abolished, but market-like
  signals retained); Mises may have been criticizing full collectivization without
  markets at all. So part of the disagreement was over whether "market socialism with
  a planning board" counts as socialism or as a market economy. But the core substantive
  point about whether a planning board can generate and use the relevant data remains.


