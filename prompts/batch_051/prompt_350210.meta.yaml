  campaign and its postwar commemoration, I keep returning to Elizabeth Anscombe''s
  1956 pamphlet Mr. Truman''s Degree. In it, as I read her, she argues that Truman''s
  decision to drop atomic bombs on Hiroshima and Nagasaki was not morally rehabilitated
  by the distinction between intended and merely foreseen civilian deaths, because
  the civilian deaths were not a side effect of some independently legitimate military
  act; they were the very instrument by which surrender was to be produced. That,
  she thinks, makes the choice murder, and makes the conferral of an honorary Oxford
  degree on Truman an occasion for scandal rather than celebration.


  I''d like you to help me decide which of the argumentative lines radiating from
  that pamphlet deserve the limited space in a piece aimed at a general but serious
  readership. Rank the following unresolved questions by importance, where importance
  means both how much turns on the answer for contemporary judgments about war and
  leaders, and how underexamined the question is in public discussion:


  1. Whether the Allied firebombing of cities such as Dresden and Tokyo is vulnerable
  to the same analysis, and whether that should materially change the moral standing
  of leaders we otherwise remember more favorably than Truman.

  2. Whether Anscombe''s argument extends to the policy of nuclear deterrence, since
  it involves the conditional threat to kill the innocent, and whether that extension,
  if valid, should most trouble defenders of the postwar nuclear order.

  3. Whether her use of the intended/foreseen distinction can be made stable enough
  to survive modern cases of dual-use infrastructure and "mission kill" targeting,
  while still reaching her verdict about Hiroshima and Nagasaki.

  4. Whether her argument is best understood as primarily about a moral-psychological
  failure to treat certain acts as unconditionally excluded, rather than about Truman''s
  particular strategic decision, and whether this framing matters more for how we
  evaluate contemporary leaders facing atrocities.

  5. Whether the least outdated part of her case is not the moral argument at all
  but the institutional one: the propriety of universities and other bodies conferring
  honors on political leaders who have ordered mass killing.


