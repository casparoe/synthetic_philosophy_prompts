  Possible commitment set (as a student writing their views for a course on collective
  decision-making / democratic theory):


  1. I think the Condorcet jury theorem is mathematically right, but its independence
  assumption almost never holds in real electorates, so it can''t ground the epistemic
  authority of actual majority rule.

  2. I also think the miracle-of-aggregation idea is broadly right: large groups of
