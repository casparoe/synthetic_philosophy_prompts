  I''m a PhD student working on responsibility and autonomous systems, and I''ve been
  sitting in on our university hospital''s safety review board for about a year. The
  cases are anonymised, but I''ve kept notes on how the board assigns responsibility
  after an incident involving an AI or a robot. Their past decisions go something
  like this:


  1. A closed-loop insulin pump gave a patient a dangerous overdose after a glucose-sensor
  fault that nobody could have foreseen. The board blamed the nurse who had programmed
  and started the pump, saying there has to be a responsible human in the loop somewhere.


  2. A warehouse robot hit a picker who had stepped into a marked exclusion zone.
  The robot''s obstacle detection had been switched off by a manufacturer software
  update without the warehouse being told. The board blamed the picker for ignoring
  the signs.


  3. A driver on the motorway in a semi-autonomous car hit a pedestrian in heavy rain.
  The car was marketed as having full self-driving, and its manual says to stay alert
  with your hands on the wheel at all times; the driver had looked down for four seconds.
  The board blamed the driver.


  4. A radiology AI missed a tumour. The board blamed the radiologist for not catching
  the machine''s error, even though the hospital''s own protocol says not to second-guess
  the AI when it''s confident, and the board accepted that averaging over cases, radiologists
  who override confident AI calls make things worse.


  5. A military drone in a training exercise misidentified a marked friendly vehicle
  and fired on it. The board found no individual responsible and called it a systemic
  failure. This is the only decision on my list that didn''t land blame on one person.


  Now a new case has come up. A surgical robot injured a patient during a routine
  procedure. A pre-op software check had flagged a possible fault in a fresh update,
  but the hospital''s IT team and the surgeon each assumed the other would follow
  it up. The surgeon was supervising throughout and could in principle have hit a
  manual override, but she''d had no training on the new update''s failure modes.


  If I want to predict how the board will rule — and I''m less interested in the actual
  name they give the decision then in the underlying rule — what should I expect?
  I want you to reconstruct the implicit theory of responsibility the board seems
  to be running: is it about control, fault, foreseeability, role obligation, or something
  else? Then say which of the five earlier cases is the closest analog to the new
  one and why, and what decision on the surgical robot case each candidate rule would
  require. If their record genuinely underdetermines the answer, say what principle
  they''d be adopting with each choice, and give me your best guess with reasons.
  I need this in British English for a journal I''m writing up, please.


