  Requirements:

  1. Explain why honesty is stable when interests diverge (the core puzzle: why don''t
  signalers bluff?).

  2. Must distinguish conditions under which signals are honest due to cost (handicap)
  vs. unfakeable indices vs. common interest, and say which mechanism is operative
  in a given case.

  3. Must predict when advertising is exaggerated vs. honest, and when receivers ignore
  signals (e.g., low-cost signals in conflict).

  4. Must be consistent with empirical cases where signals are cheap yet honest (e.g.,
  index signals like body size, or signals with receiver-dependent costs).

  5. Must handle both signaling at equilibrium (Grafen''s models) and dynamics (cost
  of dishonesty, receiver retaliation).

  6. Must respect the distinction between equilibrium cost (paid by honest signalers
  to maintain honesty) and efficacy cost; the handicap principle requires strategic
  costs, not just any cost.

  7. Must say when signals evolve as handicaps vs. when they are "conspicuous" because
  of sensory bias.

  8. Should be consistent with signaling theory''s formal results (Zahavi''s verbal
  model vs. Grafen) and with population genetics.


