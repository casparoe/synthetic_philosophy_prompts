  Draft:


  "Daniel Dennett has argued, in his late writing on AI, that we should not think
  of deceptive human-mimicking AI systems as merely ''bots,'' ''agents,'' or even
  ''frauds,'' but as counterfeit people: artifacts deliberately designed to pass,
  in the contexts where we encounter them, for real human beings. The normative work
  in his argument is done by an analogy with counterfeit money. Counterfeit currency
  is not bad simply because the individual note is worthless to whoever is stuck holding
  it, nor because it deceives any single cashier; it is bad because every successful
  counterfeit that circulates erodes confidence in the currency itself, so that the
  existence of good counterfeits imposes a cost on every subsequent transaction, including
  transactions involving only genuine notes. Dennett holds that counterfeit people
  do the same thing to the currency of social trust: each AI that passes as human
  makes it rational for us to discount more heavily the presumption that we are interacting
  with a person, and thereby degrades the background of accountability, sincerity,
  and good faith on which real human interactions depend. From this he concludes that
  creating counterfeit people should be treated as a serious offense in the way counterfeiting
  currency is, rather than as an ordinary consumer-protection or fraud problem.


