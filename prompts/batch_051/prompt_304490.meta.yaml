  ---


  Two friends of mine, Leo and Nina, spent an evening arguing about a story our mutual
  friend Elena told at dinner. On a layover in a city she had never visited, in a
  country on the other side of the world, Elena had run into the woman who lived next
  door to her family twenty-five years ago. They recognized each other immediately.
  Elena told it as proof that the world is smaller than we think; Leo and Nina then
  fell into the following dispute.


  Leo: The birthday paradox shows this is exactly the kind of event people misjudge.
  In a room of twenty-three people the chance of some shared birthday is already about
  half, but only because every pair counts and no particular pair was singled out.
  Over a life, the number of "pairs" between the people you know and the places you
  might pass through is enormous. Some such encounter is therefore near-inevitable,
  and Elena has simply committed a probability error by treating "this particular
  person in this particular place" as the event she''d have predicted.


  Nina: But the birthday calculation gets its result from a fixed and pre-specified
  class: birthday, and any two matching dates count. Elena had no such class. She
  wasn''t scanning the airport for "anyone with whom I share any property"; she encountered
  one particular person with whom her history is entangled. The probability relevant
  to her experience isn''t the birthday-paradox probability, it''s the probability
  of meeting that woman there, and that is not made ordinary by the fact that some
  encounter or other would eventually happen. You cannot explain a particular coincidence
  by citing the probability of some coincidence.


  Leo: That sounds right and misses the point. The reason I cite the birthday paradox
  is not that the specific event is probable; it''s that our intuition treats the
  event as if its probability were the probability of that exact encounter, when the
  intuition was generated without any pre-specified boundary around what would have
  counted as weird. If she had met a different old neighbor, or a former teacher,
  or a cousin''s ex-wife, she would have told the same story. So the effective number
  of trials is huge, and the birthday paradox is a model for why post hoc stories
  mislead.


  Nina: But then your argument has shifted. You began with the birthday paradox, which
  is a genuine calculation showing that a specific kind of match is likely under a
  well-defined sampling model. Now you are saying the event''s exact probability cannot
  even be assessed because the class was not fixed in advance. Those are different
  claims: one says "this event is more probable than you think," the other says "you
  cannot say how improbable it is." The first debunks the story; the second only withholds
  judgment. You can''t have the confidence of the first while retreating to the safety
  of the second.


  Leo: The common core is all I need: Elena''s anecdote cannot serve as evidence for
  anything beyond "such meetings happen." For an event to support any substantive
  conclusion — about providence, hidden connections, or even an unusually small world
  — a model must have been specified before the observation that would have been less
  plausible on the null hypothesis. A story whose interesting features were selected
  after the fact by the very act of noticing them has no evidential weight. The birthday
  paradox is just the sharpest illustration of the general principle.


  Nina: You''ve now moved to a principle about evidence, and it''s an overstatement.
  We can and do reason about singular events without pre-registered predictions: a
  juror can tell that a defendant''s story strains credulity without having listed
  in advance every detail that would count as suspicious. The relevant question is
  whether the coincidence is better explained by some alternative to chance, and "chance"
  here would require believing that people cross paths with members of their narrow
  personal past as often as random pairs of faces pass each other. That assumption
  is the one you can''t just assert.


  Leo: Then we''re back where we started. The hypothesis you''re offering — "there
  is some non-chance structure making such meetings more likely" — is so unconstrained
  that it can absorb any observation whatever. A hypothesis with no sharp predictions
  cannot be actionably favored over chance, and being impressed by an anecdote is
  to favor it. So the only rational posture is to treat the story as uninformative.


  Nina: No. To say the story is uninformative is to say it should not change anyone''s
  mind about anything, but it should at least move us away from the picture of the
  world as a place of independent, exchangeable encounters. If the world contains
  hidden clustering — people from the same past travel in the same channels — then
  this kind of event is exactly the data that reveals it. We may not yet have the
  model that says how clustered, but rejecting the datum because the model isn''t
  pre-specified is letting a methodological scruple dictate the ontology.


  I didn''t take a side, and I still can''t. Please adjudicate the dispute move by
  move: for each of their substantive turns, say what is right, what is overstated,
  and how it bears on the others; then say whether Leo''s birthday-paradox use actually
  supports his conclusion, whether Nina''s resistance to it survives Leo''s selection-based
  replies, and who is more right overall, if either.


