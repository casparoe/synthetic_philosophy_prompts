  signal structure and observes a short public sequence of offers and refusals (not
  completed trades) can infer more about the asset''s value than could be inferred
  from any single signal alone. In the second variant, keep the signal structure,
  preferences, and endowments exactly as they are, but replace the common prior with
  priors that differ in a specified way; here at least one mutually agreeable trade
  occurs.


  After presenting the scenario, show for each variant the reasoning the traders and
