  Let me recall the metaphysics:


  Endurantism (three-dimensionalism): objects are wholly present at each moment they
  exist; persistence is identity across times; objects have no temporal parts. Perdurantism
  (four-dimensionalism): objects persist by having temporal parts at different times;
  objects are extended through time like space; "worms" (spacetime worms). Stage theory
  (exdurantism, Sider): objects are instantaneous stages; the banana on Monday is
  a different object from the banana on Tuesday, related by temporal counterpart relations
  — "the same banana" is loose talk across stages.


  Key thought experiments:

  - Temporary intrinsics: David Lewis''s problem of temporary intrinsics — if you
  are wholly present, how can you be bent on Monday and straight on Tuesday without
  contradiction? Endurantist responses: time-indexed properties, relations to times,
  presentism (only present exists so no contradiction), adverbialism. Perdurantist:
  you have different temporal parts with different intrinsic properties.

  - The statue and the lump of clay (Gibbard): a statue and the lump of clay it''s
  made from coincide on Monday, both exist. If you squash the clay on Tuesday, the
  lump persists but the statue does not. Endurantist might say two objects (statue
  and lump) coinciding in one place at one time (constitution view with coincident
  objects), or say one object with phase sortals; perdurantist says they share temporal
  parts during overlap then diverge — there is a statue part and lump part... Actually
  perdurantist says the statue is a proper temporal part of the lump''s career. Stage
  theory sounds appealing: at each instant there''s a single object (a stage), so
  no coincidence problem; the statue and lump are the same stage on Monday but different
  counterpart relations to future stages.

  - Dion and Theon (Burke, Wisniewski?): Dion is a person; Theon is the part of Dion
  that would survive losing a foot. If Dion loses a foot, Theon survives as what?
  Puzzle about material constitution and parthood.

  - The ship of Theseus: persistence with replacement of parts, more about identity
  criteria than endurantism/perdurantism per se, but can be used.

  - Time travel and being in two places at once: endurantist must say you''d be wholly
  present in two places at once (bilocation); perdurantist says two temporal parts
  overlap at the same time (both present at same external time?). Actually in time
  travel, a perdurantist who is an eternalist can say the two occurrences are distinct
  temporal parts of the same worm, at the same external time but different personal
  times. This distinguishes.

  - Planet/object "wholly present": an endurantist says at any instant the entire
  object is there; a perdurantist says only a stage/part is there. Diagnostic claim:
  "Strictly speaking, the me of yesterday was not identical with me now — though we
  are stages of the same person." That''s stage theory vs endurance identity.

  - Change: perdurantists think change is the having of different temporal parts with
  different properties; endurantists think one and the same thing has different properties
  at different times.

  - The question "Do objects have temporal parts?" — direct but the quiz should phrase
  via cases, not labels.


