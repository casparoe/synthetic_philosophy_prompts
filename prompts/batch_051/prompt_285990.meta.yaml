  I work on eighteenth-century moral philosophy, and I have been trying to organize
  the main readings of Adam Smith''s impartial spectator in The Theory of Moral Sentiments.
  Here are the interpretations I have collected so far:


  (1) The social-mirror reading: the spectator is a generalization or internalization
  of the actual judgments of the concrete people whose approval and disapproval we
  learn through sympathetic exchange.


  (2) The ideal-observer reading: the spectator is a deliberate idealization—impartial,
