  binding because they reflect the larger order Smith sometimes invokes.


  (4) The higher-order-self reading: Smith splits the agent into an acting self and
  a spectatorial self; the impartial spectator is best understood as a second-order
  evaluative perspective within a single mind, rather than a representation of society.


  (5) The cognitive-auditing reading: the impartial spectator functions as a procedure
  for checking whether the intensity of a passion is proportional to its cause, making
  it primarily a device for regulating emotional propriety rather than a distinct
  moral ontology.


