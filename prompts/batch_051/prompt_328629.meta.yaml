  I was reading a general-audience book on early modern political thought, and it
  gave a compressed account of Pascal on justice and force that I would like checked,
  because I can''t tell exactly where its simplification begins to slide into distortion.
  The book''s summary, as I understand it, runs as follows.


  First, Pascal observes that neither justice nor force is sufficient by itself. Justice
  is that to which we ought to submit, but on its own it is impotent: since it can
  be disputed, the wicked will refuse it, and it has no reliable grip on conduct.
  Force, by contrast, is that to which submission cannot be avoided, but on its own
  it is arbitrary and resented; attention is paid to it only because it compels. The
  solution of reason is to join the two, so that obedience is both unavoidable and
  legitimate.


  Second, the obstacle to that union is that force cannot simply be placed in the
  service of justice, because human beings cannot agree on what justice demands —
  it is endlessly contestable — whereas force is manifest and beyond argument. So,
  having failed to make what is just prevail, people settled for making what prevails
  pass as just. The book presents this as the core of Pascal''s position.


  Third, and here is where my suspicion begins, the book says this led Pascal to a
  starkly conventionalist conclusion: there is no natural standard of justice, and
  what any community calls justice just is the content of its established customs,
  which command obedience merely because they are accepted and enforced. The book
  supports this by noting that Pascal points to the variability of morals — theft,
  incest, and the killing of one''s parents have all been numbered among virtuous
  actions somewhere — so custom, underwritten by force, is the only fixed point.


  The account then concludes: for Pascal, justice is ultimately the mask that power
  wears; the strong determine what counts as right, and moral order is nothing over
  and above the command of the sovereign backed by the sword.


  I already think the last sentence goes beyond anything the text can bear, and I
  recall that Pascal says somewhere that natural laws exist but that our corrupt reasoning
  has made a mess of our access to them, which seems to sit uneasily with the claim
  that there is no natural standard at all. But I don''t know how much of the earlier,
  more careful-sounding part is accurate either. Please audit this summary. Work through
  its claims one by one, marking what is accurate, what is a subtle overstatement
  or conflation of claims Pascal keeps separate, and what Pascal explicitly holds
  that would complicate or block the book''s concluding inference. In particular,
  say whether the final reduction of justice to power is supported by anything true
  in the earlier claims once the subtleties are restored, and how a careful reading
  of Pascal should instead phrase the relation between justice, custom, and force.


