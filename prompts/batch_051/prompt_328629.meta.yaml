  Draft:


  I recently read a general-audience book on early modern political thought whose
  compressed account of Pascal on justice and force struck me as largely right but
  possibly overreaching, and I would like to know how much of it to trust. The book
  gives the following summary, which I will render in my own words.


  Pascal begins from the thought that neither of the two things that govern human
  conduct is adequate by itself. Justice deserves obedience, but by itself it is without
  power: it is subject to dispute, there will always be wicked people who defy it,
  and it cannot enforce itself. Force, by contrast, secures obedience, but by itself
  it is nothing more than domination, and submission to it is resented and precarious.
  Reason therefore requires the two to be joined.


  The obstacle, the book says, is that force cannot be assigned to justice, because
  human beings cannot agree on what justice requires — it is endlessly contestable
  — while force is something everyone recognizes and no one can argue with. And so,
  since people could not make what is just prevail, they made what prevails pass for
  just. The book calls this the heart of Pascal''s position.


  From here, the book moves quickly to a conventionalist conclusion. It says Pascal
  teaches that there is no natural standard of justice; what a society calls just
  is simply the content of the customs it happens to accept, and custom rules only
  because it is accepted and backed by force. Pascal''s evidence, on this telling,
  is the sheer variability of morals across cultures: theft, incest, and the killing
  of one''s parents have all been counted among virtuous actions somewhere, so custom
  underwritten by force is the only fixed point there is.


  The account then ends by saying that, for Pascal, justice is ultimately the mask
  that power wears: the strong determine what counts as right and wrong, and the moral
  order is nothing over and above the command of the sovereign backed by the sword.


  I suspect the final move is too strong, and I also have the impression that Pascal
  somewhere allows that there are natural laws, though our corrupted reason is unreliable
  at finding them — which would sit uneasily with the claim that there is no natural
  standard at all. But I am not sure where the accurate core ends and the distortion
  begins. Please audit this summary. Work through its claims one by one, marking what
  is accurate, what is a subtle overstatement or conflation of claims Pascal keeps
  separate, and what Pascal explicitly holds that would complicate or block the book''s
  concluding inference. In particular, say whether the final reduction of justice
  to the command of the sovereign is supported by anything true in the earlier claims
  once the subtleties are restored, and how a careful reading of Pascal should state
  the relation between justice, custom, and force.


