  "I follow a policy about my own beliefs that I think of as a personal Ulysses contract.
  Once a year, in a week when I am not under any unusual emotional, social, or professional
  pressure, I draw up a short list of questions I declare closed. The questions on
  the list are ones I have already examined, from both sides, over a long period;
  they are not matters I adopted casually, and in most cases I changed my mind at
  least once before settling. After a question goes on the list, I no longer treat
  new arguments or evidence about it as material to be weighed. I read or listen only
  to be able to state and defend the settled view, never to test it. If something
  genuinely new appears, I file it under distraction and move on."


