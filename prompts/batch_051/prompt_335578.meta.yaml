  of a set of probability functions — the "set as range of acceptable precisifications"
  versus the "set as a single indecomposable doxastic state"? I am not asking for
  a bibliography, but for the conceptual geography: what are the nearest named positions
  or criteria, how exactly do they draw the boundary, and which of the two readings,
