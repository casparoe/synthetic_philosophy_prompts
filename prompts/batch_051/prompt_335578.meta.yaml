  the agent''s evidence would permit if the agent chose to adopt a precise numerical
  probability; the agent has not done so, but any point in the interval would be an
  admissible precisification of their state. On the second, the interval is the state:
  the agent does not regard any point value as an admissible precisification, because
  their evidence itself does not single out a point value, and their doxastic commitment
  is exhausted by the interval.


  These interpretations lead to different criteria for action. Under the first, one
  might compare acts by the range of expected utilities they produce as the probability
  ranges over the permitted points, and one might prefer the act with the better worst-case
  expected utility, or the better best-case, or some trade-off between them. Under
