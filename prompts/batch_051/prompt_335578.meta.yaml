  Potential prompt:


  In A Treatise on Probability, Keynes argues that not every probability relation
  can be given a numerical value, and that some probabilities cannot be compared with
  one another even ordinally; in such cases, he says, the probability relation is
  not measurable. Suppose someone who accepts that point now represents their epistemic
  state about a proposition not by a single number but by a class of probability functions,
  each of which is compatible with their evidence. I have noticed that there seem
  to be two quite different ways of understanding what such a class represents. On
  the first, the class is a set of candidate precisifications: the person''s evidence
  is compatible with any one of these precise probability functions, and although
  they have not settled on one, each function would be an acceptable way of making
  their beliefs numerically definite. On this reading, decision rules tend to work
  by comparing the range of expected utilities generated by the different functions:
  for example, one act might have a higher minimum across the class, while another
  has a higher maximum. On the second reading, the class is itself the belief state,
  not a collection of possible precise belief states; the person does not regard any
  single function in the class as an admissible precisification, and the relevant
  comparisons are only those that hold for every function in the class. A dominance-like
  principle then says that one act is better only if it is better under every function
  in the class, which is stricter than comparing minima and maxima. These two readings
  can diverge in practice: two acts may receive the same interval of expected utilities,
  yet one dominates the other on all functions, or one act may have a better worst-case
  value while the other dominates it on all functions except a small set of edge functions.


