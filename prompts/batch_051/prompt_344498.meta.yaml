  Let me recall the actual philosophical positions on how music can express sadness
  (the "expressive" question). The problem: sounds are inanimate; sadness is a mental
  state. In what sense can a succession of sounds "be sad"?


  Standard accounts:


  1. Arousal theory / emotion theory: music is sad because it arouses sadness (or
  the corresponding feeling) in listeners. (This is the oldest folk view; criticized
  because we don''t usually feel sad when listening, and can enjoy sad music.)


  2. Resemblance / contour / "appearance emotionalism": music resembles human expressive
  behaviour — the way sad people move, speak, sigh, gesture. Sad music has slow tempo,
  low pitch, falling contours, quiet dynamics, and we hear the music as resembling
  the vocal and bodily expression of sadness. This is associated with Peter Kivy ("contour
  theory") and Stephen Davies. Kivy thinks music is expressive of emotion by resembling
  human expression, but we recognize it, not feel it. Sometimes called "cognitivism"
  or "appearance emotionalism".


  3. Persona theory (Jenefer Robinson, Jerrold Levinson): the music is heard as the
  expression of an indeterminate persona or agent — we imagine a person (composer?
  a musical persona?) expressing sadness through the music. Levinson''s version: we
  hear the music as someone''s emotional expression, and we respond empathetically.
  (Robinson argues emotional responses to music involve appraisals of a persona''s
  situation.)


  4. Convention/association theory: the link between certain musical features (minor
  keys, slow tempi) and sadness is a learned cultural convention or association. (Though
  this may be part of resemblance too.)


  5. Make-believe / fictional world account (Kendall Walton): sad music is "fictional"
  — in a game of make-believe, we imagine our own awareness of the music to be an
  experience of sadness; music makes fictional truths about our feelings. Actually
  Walton''s "hop/top" — he proposed that music is expressive because in a game of
  make-believe, the listener''s experience is imagined to be sadness. This is the
  "imagining ourselves sad" account. Hmm.


  6. Appraisal theory: Jenefer Robinson? Actually Robinson is persona. Appraisal theory
  is more about emotion in general.


  7. "Music embodies emotion" — Susanne Langer''s theory: music is a symbolic form
  that presents the "logical form" of feeling, isomorphically. Could be listed but
  it''s older and vaguer.


