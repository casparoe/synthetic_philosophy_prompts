  Prompt draft:


  "I have been reading Mill''s Considerations on Representative Government, and I
  keep coming back to a passage in the chapter on true and false democracy: [quote].
  I know the standard reading: Mill is worried that extending the vote lowers the
  average competence of the deciding body, and his remedy is plural voting for the
  better educated. But I have been trying to build a distinction that I want pressure-tested,
  and this passage is what set me off.


  I call it the difference between ''competence over means'' and ''competence over
  ends'' (maybe there are better names already). Competence over means is knowing
  which policy, given some set of aims, will actually bring those aims about — the
  economist, the epidemiologist, the engineer. Competence over ends is knowing which
  aims should be chosen in the first place, and how to weigh them against each other
  when they conflict. My claim is that nearly every epistocratic argument — Mill''s
  included, but also the modern IQ/voter-knowledge versions — only ever demonstrates
  competence over means, because that is the kind of thing tests and education actually
  measure. But voting is supposed to register ends, not to choose means: the legislature
  and the bureaucracy already supply the means-competence. So epistocracy either proves
  too much (it would at best justify expert agencies, which we already have) or too
  little (it gives no reason to hand the value-registering function to the better
  educated). Is this a real distinction, and is it as damaging to epistocracy as I
  think? Or does it quietly assume that ends and means can be separated in politics
  at all — that ''which aims'' is not itself an empirical question on which some people
  are better informed than others?"


