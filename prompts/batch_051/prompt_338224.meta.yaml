  The skeptics, many of them entomologists, say that no insect has the neural architecture—in
  particular, no structure analogous to a mammalian cortex—that we associate with
  felt experience, and that behaviors like grooming an injured leg or avoiding a shock
  are implemented by decentralized reflexes that need not involve anything it is like
  to be the insect. The welfare side, which tends to include biologists who work on
  honeybees, bumblebees, and flies, replies that insects show associative learning,
  flexible behavior, state-dependent choices, and some nociceptive responses, and
  that the absence of a cortex is a bad argument because birds and octopuses were
  once similarly dismissed on anatomical grounds. Then the argument escalates to the
  scale consideration. The welfare side says: even if the probability per insect is
  low—say, a few percent—there are something like 10^18 insects alive at any time,
  so the expected amount of unreduced suffering dwarfs anything else we worry about;
  acting on a small probability of that outcome is not fanatical. The other side says
  this is precisely the structure of a mugging: the probability is not measurable,
  the denominator is chosen to overwhelm, and the conclusion would commit us to costly
  interventions in agriculture, disease control, and construction, all on the strength
  of an ungrounded prior. What bothers me is that neither side seems able to say what
  would settle the question. New papers appear, both sides cite them, and nobody''s
  credence moves.


