  "I keep noticing a move in political argument that I don''t have a word for, and
  I''d rather not settle for the broad label ''populism.'' The move concerns the phrase
  ''the will of the people'' and its relatives — ''the people have spoken,'' ''the
  country has decided,'' ''the real people,'' ''the silent majority.'' A speaker will
  invoke the people as a single subject whose decision settles the matter, and the
  authority of the claim seems to depend on that unity. But when evidence arrives
  that the actual population is divided or opposed — a close vote, later polls, protests,
  an adverse court ruling — the speaker doesn''t withdraw the claim; the referent
  of ''the people'' shifts.


  I can give two examples of the kind of thing I mean. First: after a referendum passes
  52–48, the winning side says ''the people have decided'' and proceeds as though
  the result expressed a near-unanimous national verdict; six months later, when polls
  run against the measure, the same side says poll respondents aren''t ''the real
  people,'' or that the real people don''t answer pollsters. Second: a candidate who
  loses the popular vote but takes office claims to represent ''the real people''
  or a silent majority that isn''t captured by the official count, and treats a large
  rally as better evidence of the popular will than the election returns themselves.
  A third, slightly different case is the counterfactual one: after losing a vote,
  the loser insists the people were misled or intimidated, so the true will of the
  people is what they would have voted had they understood the facts.


