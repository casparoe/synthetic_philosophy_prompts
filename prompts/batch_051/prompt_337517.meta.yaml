  Let me draft the phenomenon carefully.


  Phenomenon: In political arguments, I keep seeing a move where a speaker invokes
  "the people" as a single entity that has decided something, and the authority of
  the claim seems to come from that unity. But when the same speaker is confronted
  with evidence that the actual population is divided — a close vote, contradictory
  polls, protests, institutions saying otherwise — the phrase doesn''t get retracted;
  the referent just moves. "The people" turns out to mean: a bare majority at one
  moment; then, when that majority is inconvenient, a deeper or more authentic people
  that isn''t captured by any particular vote or poll; then, when the speaker needs
  to explain away a defeat, a future people or the people as they would vote if they
  weren''t misled; and sometimes simply the speaker''s own supporters. The move ends
  with the same phrase carrying the same authority even though its content has shifted
  at least three times in the course of one argument.


  Examples:

  1. After a referendum passes with 52% and low-ish turnout, the winning side announces
  "the people have decided," and treats the result as if it were a near-unanimous
  national verdict; but when later polls show 55% against, the same side says polling
  doesn''t matter because "the real people don''t answer pollsters" or "the people
  who count didn''t march."

  2. A candidate loses the popular vote but wins office; they claim to represent "the
  real people" or "the silent majority," while dismissing the actual majority as coastal
  elites or a manufactured crowd. Then, when asked for evidence, they cite a single
  rally''s size as proof of the people''s will.

  3. After an election in another country goes badly for a party, a leader says "the
  people were deceived" and insists the true popular will is what they would want
  once informed — the "real" people are counterfactual.

  4. A court or legislature blocks a measure; supporters say "the people won''t stand
  for this" and, when the next election returns the same party that blocked it, say
  the people have been betrayed by the system, or that the voters were not the "real"
  voters but the "politically correct" ones.


  The core move: the expression "the will of the people" functions as a term of democratic
  authority, and the authority persists even as the denotation is swapped. It''s not
  just ordinary equivocation, because the speaker isn''t confused; they need the referent
  to be both something concrete enough to command obedience and elusive enough to
  survive falsification. It''s not exactly lying with statistics or cherry-picking
  either: the data aren''t misrepresented as much as the subject ("the people") is
  redefined.


