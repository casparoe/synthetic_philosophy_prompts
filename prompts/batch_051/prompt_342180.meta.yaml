  The core Ellsberg findings:

  - Prefer known over ambiguous.

  - Non-additive probabilities: P(red)+P(black) < P(red or black) in the ambiguous
  urn but additive in known.

  - Symmetry: P(red)=P(black).

  - Certainty: P(red or black)=1.

