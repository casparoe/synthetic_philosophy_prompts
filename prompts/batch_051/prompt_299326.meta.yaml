  ---

  I''m a philosophy professor working on moral psychology, and I''ve been chewing
  on an idea I''d like an honest read on. I''ve started calling it "integrity arbitrage."
  The thought is this: when two people or groups with very different value systems
  compromise, they usually do it badly — each gives ground on something they actually
  care about a lot in exchange for a concession the other side cares about only a
  little, so everybody walks away feeling sold out. But there''s no reason in principle
  compromise has to work that way. Values differ not just in content but in intensity;
  each side has issues it holds loosely and issues it holds as non-negotiable. So
  in principle, two parties could find a trade where each gives on a low-weight commitment
  and gets, in return, movement on a high-weight commitment. That would be the moral
  analogue of gains from trade: no one changes their mind, but the total realization
  of both value systems goes up, like two countries swapping goods they value differently.
  I think most ordinary "compromise is selling out" complaints are really complaints
  about a bad exchange rate, not about compromise as such.

  I want to know whether this is a real concept or just an economic metaphor stretched
  too far. Has someone worked it out under another name I should know about? And where
  does it break — sacred values, incommensurability across value systems, the expressive
  meaning of concessions, self-deception about what one actually holds loosely? Please
  be candid with me; if the idea is mostly false or unoriginal, say so, and rebuild
