  I am a third-year undergraduate currently enrolled in a seminar on the origins and
  historiography of the First World War, and I am scheduled to present a paper next
  week on the Fischer controversy. My thesis, put briefly, is that the long-running
  dispute between those who follow Fritz Fischer in assigning primary responsibility
  for the outbreak of the war to Imperial Germany and those who emphasize shared responsibility,
  miscalculation, and a slide brought on by the structure of the alliance system rather
  than a German bid for hegemony is not, at bottom, an empirical dispute about the
  documents. I argue that it is a conceptual dispute about what it means to hold a
  nation responsible, as distinct from holding a cabinet, a general staff, or a population
  responsible, and that participants in the controversy quietly shift among several
  senses of the word Germany — the state as a corporate actor, the small decision-making
  elite of July 1914, the nation as a broad cultural community, and ordinary Germans
  — depending on which stage of the argument they are at. My further claim is that
  each side''s reading of the archival record is largely downstream of unarticulated
  commitments about collective agency, about whether historical blame should function
  like a legal verdict or like a moral lesson, and about where causal contribution
  ends and culpability begins. I close by suggesting that making these commitments
  explicit would not settle the controversy, but would move it to a place where it
  can actually be argued.


