  Self-Sampling Assumption (SSA): reason as if you are a random sample from the set
  of all observers (or all observer-moments) in your reference class. Self-Indication
  Assumption (SIA): the probability of your existence is proportional to the number
  of observers the theory predicts; i.e., you should take your own existence as evidence
  for more observers.


