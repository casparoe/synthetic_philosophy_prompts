  "I am taking a seminar on collective decision-making under uncertainty, and the
  argument that now has the most grip on me is the unilateralist''s curse. As I understand
  it, the argument runs roughly as follows. Suppose some action is all-or-nothing,
  very hard to reverse, and will bind an entire group, and any one of many roughly
  equally informed members can take it unilaterally. If each person acts whenever
  her own evidence makes it more likely than not that the action would be good, then
  even if every person is unbiased and follows the evidence scrupulously, the probability
  that someone takes the action when the action is in fact bad grows toward certainty
  as the group gets large. The chance of being that unlucky person does not need to
  be high; it only needs to be greater than zero for each of many people. From this
  I am drawn to the conclusion that the decision rule should not be ''act at just
  over 50 percent confidence'' but something much more conservative — a much higher
  threshold, a requirement of consensus, or delegation to a single accountable body.


  Yet I have a firm intuition that refuses to go away when I consider a different
  sort of case: a field engineer who notices what she honestly estimates is a 35 percent
  chance that a dam will fail overnight and flood a town. Alerting the town would
  force a costly evacuation and, if she is wrong, would damage confidence in future
  warnings; she also knows that several other equally competent people are in a position
