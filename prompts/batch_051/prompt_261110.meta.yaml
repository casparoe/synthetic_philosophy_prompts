  I have been going back and forth between two ways of thinking about metaphor, and
  I would like help turning the disagreement into something that could in principle
  be settled by evidence, or at least into a precise statement of where evidence gives
  out.


  On one side is the view usually associated with Davidson: a sentence such as "his
  argument collapsed under the weight of the objections" is literally false or at
  best trivially true, and whatever it does to a hearer — the image, the noticing
  of a resemblance — is not part of the sentence''s meaning. The words mean only what
  they mean literally; metaphor is a use, and its effects are causal, not semantic.
  On the other side is the conceptual metaphor view (Lakoff and Johnson, and a good
  deal of later work): metaphors are not decorative; they are systematically organized
  mappings between domains, and they do real work in reasoning, so that saying an
  argument "collapsed" or "stands or falls" is not merely a vivid way of talking but
  reveals and stabilizes a way of thinking.


