  Need be careful about actual details of Kripkenstein. Let me recall:


  Kripke''s Wittgenstein on Rules and Private Language (1982). The rule-following
  paradox: There is no fact about me that constitutes my meaning addition by "+",
  because for any finite history of cases where I answered "125" to "68+57," there
  is a "quus" function that agrees with addition on all cases I''ve ever considered
  but diverges on future cases (e.g., 68+57 quus = 5). Kripke''s skeptic claims no
  fact of the matter, neither mental state, disposition, nor platonic interpretation.
  Dispositions fail because dispositions are finite, error-prone, and can''t account
  for normativity (justification vs description). The skeptical solution (attributed
  to Wittgenstein): we shouldn''t look for truth-conditions for meaning sentences;
  we should look at assertability conditions. We are licensed to assert "125" if our
  community''s usage agrees; meaning is use in a community. Private rule-following
  is impossible; a rule followed only by me cannot distinguish actually following
  vs merely thinking I follow. The community provides the standard of correction.
  This is Kripke''s interpretation, not necessarily Wittgenstein''s actual view; Kripke
  presents it as a skeptical problem and solution.


  For the ML translation:

  - Training distribution / observed examples.

  - Underdetermination / no free lunch: finite examples consistent with infinitely
  many functions (quus-like rules).

  - Generalization: the model extrapolates; but what licenses selecting one extension?
  Inductive bias, regularization, simplicity priors.

  - The ML engineer might say: the correct rule is the one that generalizes to the
  test distribution, or the one with minimal description length, or the one learned
  by the inductive bias. Kripkenstein would press: what fact makes one extension correct?
  "Generalizes well" is itself defined relative to a distribution/performance metric
  that is just another form of community standards or a stipulated-interest; for truly
  future novel cases there is no fact until the community decides.

  - Normativity: Kripke''s "ought" (what answer should I give) doesn''t map to "what
  a trained network outputs"; a network has dispositions, which Kripke already argues
  don''t fix meaning because they include errors and are finite. "Ground truth" in
  ML is a labeled dataset -> just more examples, doesn''t solve the philosophical
  problem.

  - Dispositions vs model outputs: Kripke''s argument against dispositional accounts
  applies directly to "the network''s weights plus forward pass" as a dispositional
  account.

  - Community agreement: in ML, labels are given by annotators/community; inter-annotator
  agreement; benchmarks as community standards. The skeptical solution might map to:
  correctness is operationalized as agreement with held-out labels supplied by a community;
  meaning is use in the relevant community. That actually maps interestingly.

