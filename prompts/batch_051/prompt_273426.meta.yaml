  Domain facts: The dogmatism paradox (also known as Kripke–Harman dogmatism paradox).
  It''s about knowledge and closure: If S knows p on the basis of evidence E, then
  S knows (or can know) that any evidence against p is misleading. Since S knows future
  counterevidence is misleading, S can rationally ignore it. Yet that seems wrong:
  we should sometimes revise. The structure involves closure under known implication:
  if S knows p, and knows that p entails q, then S is in a position to know q. If
  p is true, any evidence against p is misleading (i.e., if p then any evidence against
  p is misleading). So knowing p licenses rejecting counterevidence. This threatens
  the idea that rational belief is always open to counterevidence.


