  are largely illusions. The novel gives us Meursault: a man who has killed, who is
  tried at least as much for his refusal to perform conventional grief as for the
  crime itself, and who then spends his last days in prison waiting for the guillotine,
  ending with the confrontation with the chaplain and the novel''s closing acceptance
