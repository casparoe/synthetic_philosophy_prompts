  Concepts:

  - Decision under ignorance: no probabilities assigned to states.

  - Maximin (Wald): choose act whose worst outcome is best; focus on security level.

  - Minimax regret (Savage): choose act that minimizes the maximum regret (opportunity
  loss) relative to what could have been chosen under each state.

  - Rawls: original position, veil of ignorance, parties choose maximin in a fundamental
  choice of basic structure; not a general rule for everyday uncertainty.

  - Harsanyi: equiprobability assumption behind veil, expected utility; derives average
  utilitarianism; argues Rawls''s maximin is irrational.


  Misconceptions students might form:

  - Maximin and minimax regret always choose the same act; or one is just a different
  way of stating the other.

  - Maximin is "pessimism" as a general personality trait, not a principle for a specific,
  high-stakes choice; or Rawls endorses maximin for all choices under uncertainty.

  - You can apply minimax regret by comparing outcomes to the best possible in the
  same row/act, rather than the best outcome in the same state.

  - "Regret" is an emotion felt afterward; minimax regret is about minimizing actual
  future regret, not a decision criterion.

  - Treating ignorance as risk by assuming equal probabilities is harmless/neutral,
  when actually it smuggles in information (principle of insufficient reason) and
  changes the decision.

  - Rawls''s maximin ignores all but the worst outcome, so it would choose absurdly
  in ordinary decisions (e.g., never cross the street).

  - Minimax regret violates independence of irrelevant alternatives or can recommend
  mixed/different choices.

  - Confusing "original position" with actual deliberation among real people.


