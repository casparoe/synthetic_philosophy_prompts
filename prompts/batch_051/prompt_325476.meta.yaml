  Then set up the distinction precisely: an agent S has a reason to φ only if there
  is a sound deliberative route from S''s current motivational set — their desires,
  projects, commitments, but also dispositions of evaluation and patterns of emotional
  response — to a motive for φ-ing. Internal reasons are indexed to the agent''s subjectivity;
  external reasons would obtain regardless of the agent''s motivational set. Williams
  is sceptical of external reason statements.


  Then ask to read Crime and Punishment through this lens. Specific focus: the gap
  between Raskolnikov''s stated reasons (the "arithmetic", the utility of killing
  the pawnbroker, the Napoleon/extraordinary-man theory) and the motivations that
  actually move him (pride, destitution, repressed compassion, revulsion, fear). Ask:
  does the novel show that Raskolnikov''s "reasons" meet the internalist test? For
  each candidate reason (the utilitarian calculus, the Napoleon theory), is there
