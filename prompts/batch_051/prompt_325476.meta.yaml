  ---


  I am a retired physical chemist, and philosophy has become a serious late-life pastime
  rather than an expertise I can claim. I have been working through Bernard Williams''s
  distinction between internal and external reasons, and it has changed how I watch
  and read things; I would like a careful philosophical reading of Dostoevsky''s Crime
  and Punishment through that lens, not a summary of the book.


  Please take on the role of a professional philosopher of moral psychology who also
  reads fiction attentively. Before you write your final answer, brainstorm in a short
  opening paragraph: list the candidate reasons Raskolnikov gives for killing the
  pawnbroker, and list separately the motives the novel actually shows at work in
  him. Think carefully about which are which; the novel seems to me to insist on the
  difference.


  Williams''s position, as I understand it, is this: an agent has an internal reason
  to do something only if there is a sound deliberative route from that agent''s present
  subjective motivational set—desires, projects, attachments, dispositions of evaluation,
  emotional patterns—to a motive for doing it. Reasons that would apply to an agent
  regardless of that motivational set are external reasons, and Williams is sceptical
  about whether such reasons can be properly asserted. For the purposes of this exercise,
  use that as your working account.


  Now the reading I should like. Take each of Raskolnikov''s stated justifications—the
  utilitarian arithmetic about the pawnbroker''s money and the lives it could fund,
  and the Napoleon or extraordinary-man theory from the article Porfiry later probes—and
  judge them against Williams''s internalist test: is there a sound deliberative route
  from Raskolnikov''s actual motivational set to a motive to kill, or does Dostoevsky
  present these as rationalisations that do not pass through his real concerns? What
  elements of that set—destitution and cramped conditions, pride, shame, tenderness
  toward his mother and sister, a buried religious sensibility—does the novel treat
  as the actual springs of the act? Then treat the opposing pressure in the novel.
  Sonia and Porfiry seem to demand of Raskolnikov something he cannot yet reach by
  deliberation from his present motives: public confession, acceptance of suffering,
  and some form of moral regeneration. Are these best read, on Williams''s terms,
  as external reason claims? Or does the novel suggest they are internal reasons after
  all, because they are reachable from elements of Raskolnikov''s own set that he
  has lost contact with but not lost? Finally, say plainly where the novel resists
  the internalist reading. Does Crime and Punishment ultimately vindicate Williams''s
  scepticism about external reasons, or does it dramatise the cost of giving them
  up?


  The reading should be faithful in both directions: do not reduce the novel to an
  illustration of a theory, and do not distort the theory to fit the novel. I should
  like to know what the novel adds to the philosophical debate that Williams''s prose
  style, brilliant as it is, cannot deliver.


  ---


