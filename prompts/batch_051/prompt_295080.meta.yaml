  R. M. Hare (1919–2002): "universal prescriptivism." In The Language of Morals (1952)
  and Freedom and Reason (1963), moral judgments are universalizable prescriptions.
  Universalizability means: if I say "I ought to do A to B in circumstances C," I
  must be prepared to prescribe that anyone in relevantly similar circumstances (including
  me in B''s position) be treated the same. Hare is a prescriptivist and a preference
  utilitarian; he doesn''t derive utilitarianism from universalizability alone, but
  with empathy/imaginative identification. His test isn''t rule-utilitarian calculation;
  it''s about consistency of prescriptions. The "fanatic" problem: a fanatic might
  accept being treated that way.


  Marcus Singer (1926–2016), Generalization in Ethics (1961): presented the "generalization
  argument" with two principles:

  1. The generalization principle: If something is right (wrong) for one person in
  a given situation, then it is right (wrong) for any relevantly similar person in
  a relevantly similar situation.

  2. The principle of consequences: If the consequences of everyone doing X would
  be undesirable, then it would be wrong for anyone to do X. (Not exactly: "if the
  consequences of everyone''s doing X would be undesirable, while the consequences
  of no one''s doing X would not be, then no one ought to do X.") It has the "not
  everyone" / "no one" structure. It''s somewhat rule-consequentialist in spirit but
  Singer distinguished it from utilitarianism because it applies to practices and
  doesn''t aggregate.


  The summary saying Singer "turning it into a rule-utilitarian generalization test"
  is a misrepresentation — defensible as "mostly right" for a popularizer, since the
  generalization argument is often considered a form of rule-consequentialism; but
  it''s not strictly rule-utilitarian. Good subtle error.


