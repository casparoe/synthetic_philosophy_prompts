  Let me recall:


  Kant''s Formula of Universal Law (FUL): "Act only according to that maxim whereby
  you can at the same time will that it should become a universal law." The test:
  can you conceive/will your maxim as a universal law without contradiction? Two types
  of contradiction: contradiction in conception (e.g., false promise: if everyone
  made false promises, the institution of promising would collapse, so the maxim can''t
  be conceived as universal) and contradiction in willing (e.g., neglecting talents:
  possible to conceive but can''t rationally will — willing the end (flourishing)
  but not the means).


  "What if everyone did that?" is often framed as a consequentialist generalization:
  if everyone did X, bad consequences would follow. That''s not Kant''s test — Kant
  doesn''t primarily appeal to bad consequences but to contradictions in conception/willing.


  R. M. Hare''s universal prescriptivism: moral judgments are prescriptive and universalizable.
  Universalizability is a logical feature of moral language: if you judge "I ought
  to do X in circumstances C," you''re committed to "anyone in relevantly similar
  circumstances ought to do X." Hare distinguishes levels of moral thinking (intuitive
  and critical). Not rule-utilitarian exactly but often close; Hare was a type of
  preference utilitarian but universalizability is formal.


  Marcus Singer''s "generalization argument" (from Generalization in Ethics, 1961):
  If not everyone has the right to do X, then no one has the right to do X; the argument
  moves from what would happen if everyone did it. It''s a generalization principle.
  Singer''s version has two parts: the generalization principle (what''s right for
  one must be right for all in relevantly similar circumstances) and the principle
  of consequences (if the consequences of everyone doing X would be undesirable, then
  no one ought to do X). This is distinct from Kant (consequential, not about contradiction)
  and from Hare''s logical universalizability of prescriptions.


