  Kant''s CI: "Act only in accordance with that maxim through which you can at the
  same time will that it become a universal law." The test is about contradictions
  in conception/willing, not primarily consequences. Kant''s Groundwork examples:
  suicide (contradiction?), false promises (contradiction in conception — no one would
  trust/keeping promises impossible), neglecting talents (contradiction in willing),
  nonbeneficence (contradiction in willing). The "world would be worse" framing is
  the common misreading, though Kant does appeal to the purposiveness of nature in
  the Formula of the Law of Nature formulation. So the summary''s "real force comes
  from trust collapsing and things going badly" is a subtle misreading — partially
  right because Kant looks at whether the social practice could persist, but for Kant
  it''s a contradiction, not a welfare calculation.


