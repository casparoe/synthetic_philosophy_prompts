  started with Marcus claiming that mutation is the fundamental problem.


  (1) Marcus: With immutable code, I can replace any expression with another that
  computes the same value, reorder independent calls, factor out common subexpressions,
  and memoize results. Mutation destroys all of that: if two names are bound together
  and a function mutates through one, the other changes behind my back, so I can''t
  trust the local meaning of an expression. That''s the root difficulty.


  (2) Lena: You''re not talking about mutation; you''re talking about side effects
  that escape a scope, especially through shared references. Updating a local variable
  inside a loop doesn''t break substitutivity anywhere outside the loop. What actually
  breaks substitutivity is shared mutable state — aliasing plus mutation. Blaming
  mutation for that is like blaming value types for pointer bugs. Marcus? Not exactly.


  (3) Marcus: Local mutation still forces me into temporal reasoning. `x = x + 1`
  is not an equation. I can''t understand a loop from a simple equality; I need an
  invariant, a statement true at every iteration. Even order of statements matters:
  `x = 1; x = 2; f(x)` gives f a different argument if I swap the two assignments.
  Pure expressions have no order-dependence, so I can reason with algebra instead
  of keeping a sequence of states in my head.


