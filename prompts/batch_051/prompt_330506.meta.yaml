  behind in a vat and the body goes off on a mission, radio-linked, and the puzzle
  is where Dennett actually is — in the vat, in the body, or just wherever his point
  of view seems to be. The Prestige stages the same puzzle but makes it brutal and,
  I think, stages two rival solutions against each other. Borden solves the transported-man
  problem with a double: two flesh-and-blood people with different pasts who agree
