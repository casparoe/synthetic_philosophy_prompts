  ---


  I direct the spiritual-care training program at a large teaching hospital. We prepare
  volunteer chaplains who visit patients and families facing serious diagnoses, complex
  surgeries, and end-of-life decisions. A recurring situation in our debriefings is
  this: a patient or family member says something like "God already knows how this
  will end, so what I decide doesn''t matter," or "If it was already known before
  I was born, there''s no point in fighting." Our volunteers don''t know how to respond.
  They either fall back on generic reassurance ("keep hoping") or slip into amateur
  theology, and sometimes patients walk away more fatalistic than before.


  I''d like you to write a bedside decision procedure our volunteers can follow, grounded
  specifically in Boethius''s treatment of divine foreknowledge and eternity. The
  procedure should help a volunteer decide, in a ten-to-fifteen-minute conversation,
  which distinction to draw for this patient (roughly: foreknowledge is not causation;
  God''s knowing from an eternal, non-temporal standpoint is not the same as things
  being predetermined in time), which questions to ask before offering that distinction,
  and when the volunteer should not offer it. It should be usable by people with no
  training in philosophy or theology. For each step, specify what counts as a sufficient
  answer, where the procedure stops or escalates to a staff chaplain or the medical
  team, and which steps are judgment calls rather than principled rules. The procedure
  must respect that our patients come from many traditions, including some that affirm
  a strong doctrine of predestination; it is not our job to correct their theology.


  Then run the procedure on three cases, showing exactly how a volunteer would work
  through it: (a) a patient refusing adjuvant chemotherapy because "God already decided
  whether it will work," (b) a family member who is torturing himself over a treatment
  decision because every option was known in advance and he feels paralyzed rather
  than comforted, and (c) a patient from a tradition that teaches God''s exhaustive
  causal predestination, who says his timely appointment to the oncology clinic was
  "set in stone." In at least one case, show where the procedure yields an answer
  the asker (me, as the training director) will not like, and explain what the procedure
  cannot settle. ---


