  Superrationality: Hofstadter''s idea in Metamagical Themas / "Dilemmas" — in a symmetric
  one-shot Prisoner''s Dilemma, a superrational player realizes that the other superrational
  player will reason the same way and choose the same action, so the only stable choices
  are both-cooperate or both-defect; since both-cooperate yields better payoff, choose
  cooperate. It differs from standard game-theoretic rationality (defect dominates)
  and from assuming altruism. Used to explain cooperation without communication or
  enforcement among symmetric reasoners.


