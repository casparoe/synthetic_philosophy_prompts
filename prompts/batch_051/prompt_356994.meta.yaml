  I have since seen the phrase used in similar arguments to mean rather different
  things: sometimes only that we shouldn''t expect people to run elaborate calculations
  in urgent situations; sometimes that the man''s having the thought would itself
  reveal a defect in his character or in his relationship; sometimes something broader,
  about formal moral reasoning being out of place in personal relationships altogether.


