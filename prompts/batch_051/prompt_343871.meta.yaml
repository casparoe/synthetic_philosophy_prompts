  exists x such that P(x)" is stronger than "it''s not the case that no x satisfies
  P" (¬¬∃xP vs ∃xP).

  - Brouwer-Heyting-Kolmogorov interpretation: a proof of P→Q is a method converting
  proofs of P into proofs of Q; a proof of ¬P is a proof of P→⊥.

