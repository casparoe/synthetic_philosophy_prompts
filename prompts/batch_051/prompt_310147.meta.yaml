  \ retired natural scientist (maybe a chemist or physicist) recently reading moral\
  \ philosophy. Formal, asks for committed response: after supplying the new item,\
  \ tell honestly whether it is any good, take a definite position.\n\nLet me draft:\n\
  \nDomain: Universalizability beyond Kant: Hare, Singer, and the logic of \"what\
