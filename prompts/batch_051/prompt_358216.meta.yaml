  Could write:


  The long-running dispute about whether the atomic bombings of Hiroshima and Nagasaki
  were justified has a peculiar feature: the same facts now get recruited in support
  of opposite conclusions. One side treats the prospective casualty figures for Operation
  Downfall, the state of Japanese politics in July 1945, and the Soviet Union''s planned
  entry into the war as reasons for using the bombs; the other treats the same intelligence
  about Japanese peace feelers, the refusal to modify the demand for unconditional
  surrender, and the brevity of the interval between Hiroshima and Nagasaki as evidence
  of avoidable haste. Neither side denies the underlying facts, yet no amount of additional
  archival detail seems to move the judgments.


