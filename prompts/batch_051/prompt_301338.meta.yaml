  ---


  I have a standing epistemic rule: once I take myself to know something on the basis
  of solid evidence or proof, I do not lower my confidence when apparent counterevidence
  turns up unless the new evidence is itself so strong and specific that it would
  be irrational not to reopen the question. In ordinary cases — a conflicting anecdote,
  a study with a small sample, an objection I can already see a reply to — I classify
  the counterevidence as misleading and move on. I adopt this because otherwise I
  would be endlessly reopening settled questions and would never retain knowledge.


  A conclusion Saul Kripke draws in his paper Two Paradoxes of Knowledge seems to
  offer support: he points out that if one knows a proposition, then one should also
  believe that any evidence against that proposition is misleading; otherwise one
  would not count as knowing it after all. So it can look as though refusing to be
  moved by counterevidence is not a bias but part of what knowing requires. Yet the
  same paper worries me: the policy looks exactly like what a dogmatist would do.
  A person with a false belief and the same confidence could adopt the same rule,
  dismiss the decisive objection as "misleading," and never correct himself. So either
  my rule is rationally indefensible, or there must be a way to state it that privileges
  genuine knowledge over mere conviction — and I can''t see what that could be from
