  shame and dislike, modesty and complaisance, approving and disapproving — the four
  "sprouts" (端) of benevolence, righteousness, propriety, wisdom.

  - Seven Emotions (칠정): from the Book of Rites, "Li Yun" chapter: joy (喜), anger
  (怒), sorrow (哀), fear (懼), love (愛), hatred/dislike (惡), desire (欲).

  - The debate began with a question from Gi Dae-seung (Gobong) to Yi Hwang (Toegye)
  about a diagram. Toegye had written in his "Cheonmyeong Doshseol"? The issue: whether
  the Four Beginnings and Seven Emotions are both "issuances of li/ki" or distinct.
  Toegye''s mature position: the Four Beginnings are the issuance of li with ki following;
  the Seven Emotions are issuance of ki with li riding. Hence "四端理发而气随之, 七情气发而理乘之"
  — "Four Beginnings: li issues and ki follows; Seven Emotions: ki issues and li rides
  on it." This was a response to Gobong''s objections.

  - Gobong argued both Four and Seven are emotions, so how can one be purely li? Toegye
  adjusted to "li issues and ki follows" (not pure li).

  - Later, Yi I (Yulgok) in debate with Seong Hon (Ugye) argued: Four Beginnings are
  a subset of Seven Emotions (四端是七情中善一边也?) Actually Yulgok: "四端不能兼七情, 七情则兼四端" — the
  Four Beginnings cannot include the Seven Emotions, but the Seven Emotions include
