  "四端专言理, 七情兼言气"? Wait, need care: Yulgok''s "人心道心"? Different.

  - The debate is about metaphysics: li (principle) vs ki (material force/psychophysical
  energy), whether moral emotions (Four Beginnings) and ordinary emotions (Seven Emotions)
