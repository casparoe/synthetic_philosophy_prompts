  ---


  For a graduate seminar I teach on the political philosophy of secession, I want
  the adequacy conditions before any more theory. Too much of the literature starts
  from one of the standard cases—Scotland, Catalonia, Quebec—and treats it as decisive
  for a favored view. I want the full specification first: what any adequate normative
  theory of secession and self-determination must get right, with the case or consideration
  behind each requirement.


  Write me the desiderata, not the theory. In particular, an adequate theory must
  deliver a verdict, or explain why it is not required to, on at least these cases:
  decolonization and foreign military occupation; a historically distinct nation incorporated
  through conquest or dynastic accident; a minority suffering severe and systematic
  state repression; a prosperous and rights-respecting region whose stable majority
  nevertheless supports independence; a region whose intended separation would create
  a new, geographically concentrated minority, some of whom would on the region''s
  own logic have a parallel claim to self-determination; and a seceding unit that
  would likely be economically marginal, authoritarian, or drawn into a neighboring
  irredentist project. For each, say what the theory must say and why that counts
  as an adequacy condition rather than a discretionary application.


  Then give me the distinctions the theory may not collapse, with the reason each
  must be respected: (a) self-determination as a standing status of a people versus
  secession as a specific act of boundary change; (b) remedial versus primary or choice-based
  rights; (c) unilateral separation versus a negotiated or constitutionally provided
  route; (d) democratic ratification by a regional majority versus substantive grievance;
  (e) the claim of the existing state to territorial integrity versus the claim of
  the subunit to self-rule; and (f) the collective claim of the seceding region versus
  the claims of minorities within it. I especially want the iterated-secession problem
  handled at the level of requirements now, rather than as an afterthought: if a theory
  grants a primary right to any regional majority that chooses independence, on what
  principle does the right stop applying to a counter-minority inside the new state;
  if it denies the counter-minority the same right, what makes the asymmetry principled?
  State whether you think any adequate theory must answer this, or may set it aside
  as a puzzle.


  Mark each requirement as non-negotiable or as a preference particular to a camp
  (nationalist, plebiscitary, remedial-right, statist, liberal-institutionalist),
  and flag any subsets of requirements that cannot plausibly be jointly satisfied—for
  example, a robust primary right to secede, a meaningful territorial-integrity norm
  for consolidated democracies, and a principled stopping point against recursive
  secession. Tell me which single requirement, if accepted, would do the most to eliminate
  the leading candidate theories, and why. Assume the purpose is normative guidance
  for actual independence movements in functioning democracies and international institutions,
  not merely a reconstruction of current international law; but say where the theory''s
  requirements should depart from the legal baseline and what that departure costs.
  Keep the scorecard of existing views brief—the criteria themselves are the deliverable.


