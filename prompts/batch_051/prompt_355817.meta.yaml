  standard setup: Two exits, A and B. The driver is "absent-minded" in that he cannot
  distinguish them. At each exit the value of exiting increases with the exit number:
  exit at A gives 0, exit at B gives 4; continuing past B gives 1. At the start he
  plans: exit at A with probability p, at B with probability 1-p... The paradox: ex
  ante optimal plan vs. at-exit optimal action differ, and mixed strategies cause
  issues. There''s a debate about whether to maximize expected payoff from an ex ante
  or at-decision perspective and about self-locating beliefs.


