  Potential prompt:


  "I keep returning to the methodological problem behind the idea of ''Whig history,''
  and I would like a careful, negotiated treatment of it rather than a verdict handed
  down from one side.


  On one hand, I find the progress-oriented approach to the history of science and
  medicine almost unavoidable. It supplies a principle of selection: without some
  notion of what the present discipline became, there is no non-arbitrary way to decide
  that Harvey''s work belongs in the history of physiology while a thousand forgotten
  remedies do not. It also gives the narrative its shape and explanatory point, since
  it lets me say why these episodes mattered. Even historians who denounce presentism
  seem to rely on a suppressed version of this criterion when they decide what to
  study at all.


  On the other hand, I cannot shake the intuition that this way of writing history
  is a standing injustice to the past. The Galenic physician was not a failed cardiologist;
  the trial by ordeal was not a botched forensic-science program. Treating past actors
  as approximations to us flattens the standards internal to their practice and makes
  every dead end a mere delay. That feels false to the sources and quietly condescending,
  not just stylistically but epistemically: it seems to guarantee that we will misunderstand
  what those people were doing.


