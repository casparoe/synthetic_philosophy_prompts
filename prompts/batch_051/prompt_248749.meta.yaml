  I''m trying to reverse-engineer a hypothetical licensing board''s logic, and I figure
  you can help me do it without just pattern-matching to the obvious slogan. In this
  made-up country you need a license to raise a child. The board has these decisions
  on record:


  - It approved an unemployed couple living with relatives, on the condition that
  they complete a basic child-development course. They planned public school, routine
  medical care, and lots of contact with extended family, and there was no history
  of abuse or neglect.


  - It rejected a couple where one partner had a child removed eight years ago after
  repeated physical abuse, even though that partner has since finished a treatment
  program, a current psych report rates them low-risk, and their new partner is described
  as very stable. The board said the removal history alone was enough.


  - It rejected a couple with no abuse history who wanted to raise a child on a remote
  off-grid homestead with no formal schooling, no same-age friends, and no contact
  with outsiders until adulthood. Their plan said the child would be trained in subsistence
  farming and the family''s religious tradition, and that children should not be given
  choices before they know how to choose correctly. The majority opinion kept returning
  to the idea of an open future and said the child would reach adulthood with most
  life paths already closed.


  - It approved, with a two-year monitoring condition, a single woman with an old
  shoplifting conviction and a period of unstable housing. The board pointed out that
  she had held the same job for three years, finished counseling, and her plan included
  the standard school curriculum and explicit freedom for the child to join whatever
  activities the kid wants.


  - It rejected a couple whose older child had run away twice after reporting that
  they locked him in his room for missing prayers. A psychologist said the new household
  would probably be safe, but the board said it was not willing to take that chance.


  Now the new application. Two former professional tennis players want to raise their
  daughter to be a tennis prodigy. Their plan is detailed: from age three she is in
  a daily training program, by age eight it is around thirty hours a week, with a
  private tutor for reading, writing, and just enough math to keep her eligible for
  junior competition. No school teams, no non-tennis clubs, and they will strongly
  discourage friendships that interfere with training. They say she can quit at any
  time and they would fully support her switching to a normal school, but she will
  not have been prepared for much else by then. The family is warm, financially secure,
  no abuse or neglect in any ordinary sense, and a sports psychologist says the training
  plan is plausibly good for a pro career but will cost her most of a usual childhood.


  What should the board decide if it wants to be consistent with itself? Which of
  its prior cases is the closest analog? And if the precedents genuinely underdetermine
  it, what principle would the board be adopting with each ruling, and what later
  case would cleanly seperate the two principles? I''m less interested in the actual
  rule they''d have to write down than in seeing which two or three rules fit the
  record, where they disagree on the tennis case, and which one you''d bet on.


