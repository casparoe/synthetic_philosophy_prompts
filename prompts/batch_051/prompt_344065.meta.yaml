  Desiderata for a theory of ineffability / ineffable knowledge:


  - Distinguish different things one might mean by "cannot be said": (a) no sentence
  in a given language expresses it; (b) no possible human language could; (c) the
  state is non-propositional (acquaintance/experience) so "said" is category mistake;
  (d) it can be gestured at but not transmitted as knowledge-that; (e) it''s forbidden/improper
  to say (ritual silence) rather than impossible. A theory must track these separately;
  failing to distinguish leads to talking past.


  - Account for the paradox of assertion: anyone who says "X is ineffable" has just
  said something about X, so pure ineffability seems self-undermining. A theory must
  either block the paradox (by distinguishing "about" in a contentful way vs. pointing/negative
  predication) or accept that what is ineffable is relative to a method/frame. This
  is like the "complete ineffability is empty" argument.


  - Distinguish "inexpressible in principle" from "inexpressible by creatures like
  us with our kind of concepts/symbols." A theory should say which sense is intended
  in which tradition, because they have very different upshots.


  - Handle negative vs positive ways: apophatic and cataphatic. Or "knowing by unknowing":
  can you know something by successively denying predicates? If so, what''s left over?
  A theory must explain how "not finite, not temporal, not personal..." doesn''t end
  in zero information.


  - Handle practical/mystical training: traditions that say the unsayable is communicated
  by practice, pointing, koans, poetry, music. A theory should explain what a koan
  or a poem does — is it non-propositional transmission, causing the experience, or
  simply evocative? And whether that counts as knowledge.


  - Handle the "saying/showing" distinction (Wittgenstein''s Tractatus, but don''t
  quote or over-rely). Requirement: explain how a sentence can show what it cannot
  say, and whether that''s a form of knowledge.


