  Let me draft the principle accurately. Van Fraassen''s Reflection principle (1984,
  "Belief and the Will"): an agent''s current credence in a proposition A, conditional
  on the proposition that her future credence in A will be r, should be r. Formal:
  P_t(A | P_{t+n}(A) = r) = r, when defined. Related to conditionalization, but distinct.
  General Reflection: P_t(A | Q) where Q is... Actually the General Reflection: P_t(A)
  = ∫ P_t(A | P_{t+n}(A) = r) dP (mixing over future credences), so your current credence
  equals your expected future credence. Violations: someone who expects to be irrational
  (e.g., a wine-taster who knows that over time her phrasing... or the classic: you
  plan to take a pill that will make you certain that...). Also Dutch book arguments:
  violation makes you vulnerable to a diachronic Dutch book. Critiques: Christensen
  (1991), Weisberg (2007) "conditionalization and Reflection," Arntzenius (1995?)
  "Reflection and Forgetfulness": with memory loss, Reflection fails but arguably
  rationally.


  The prompt can ask for a credence that Reflection holds as a rational constraint.
  Decompose into: whether you have "expert" access to future evidence (future self
  is a well-calibrated expert), whether credences are subject to Dutch book constraints,
  scope restrictions (situations involving forgetting, belief changes as evidence),
  whether violations are irrational vs. each violation being reflectable... The sub-questions:

  1. Is a future self generally an expert relative to current self? (prob future self
  has more evidence and processes it at least as well)

  2. Under what conditions does Reflection conflict with Conditionalization or Bayesian
  updating?

  3. Is the principle meant to be a synchronization constraint on all rationally permissible
  credence functions? Does it apply to agents who will change their minds for non-evidential
  reasons (e.g., forgetting, emotional shifts)?

  4. Are arguments (Dutch book, self-doubt argument, "Reflection is just conditionalization")
  sound? Some say Reflection is a theorem of conditionalization under certain assumptions
  (van Fraassen''s diachronic Dutch book), others say conditionalization doesn''t
  imply Reflection (Weisberg shows Counterexamples).

  5. What''s the scope: does it apply to rational agents only, or all agents? Van
  Fraassen''s version applies to agents with "special" access.


