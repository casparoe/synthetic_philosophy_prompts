  Possible prompt:


  "Much of contemporary AI alignment assumes that the objective that best explains
  an artificially optimized system''s behavior is a recoverable guide to its future
  behavior. But there is a well-known underdetermination: for any behavior generated
  by a search process, many pairs (objective, search space) can rationalize the same
  trajectory; an agent that looks like a cost-minimizer over a rich space may be a
  different objective-minimizer over a restricted one, and vice versa. Please give
  the most important implications of this underdetermination for the practice of ascribing
  goals, values, or preferences to real systems, such as recommendation engines, trading
  algorithms, or language models—specifically, what follows for how much behavioral
  evidence should be able to license, for when we may legitimately claim a system
  is ''optimizing for X,'' and for the standard alignment strategy of first inferring
  the objective and then minimizing proxy divergence."


