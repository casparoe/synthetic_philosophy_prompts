  At a dinner some weeks ago I listened to two old colleagues, a retired physician
  and a retired statistician, argue about a hospital that had purchased an expensive
  prognostic test for a slowly progressive disorder, even though the result would
  not change what treatment was given. The physician held that the purchase was irrational:
  information that cannot alter a decision has no value, and one should not pay for
  it. The statistician replied that ''alter a decision'' is being drawn too narrowly;
  a result can change what patients plan, how they spend, and when they retire, even
  if the prescription is identical. The physician answered that if such consequences
  count, the claim that useless information should not be bought becomes unfalsifiable,
  because any report can be praised afterward for having touched somebody''s plans
  or peace of mind. The statistician said it is not unfalsifiability but proper accounting:
  a decision problem includes all its consequences, so if peace of mind is in the
  utility function, the information changes the decision after all. The physician
  then pressed a different point: the result the statistician was leaning on—what
  he called Good''s theorem—only says free information cannot have negative expected
  value; once a hospital pays real money, the right objection is to the price, not
  to the information. The statistician granted that, but said it cuts the other way:
  if the objection is always to the price, there must be some price, however low,
  at which the test would be worth buying, and calling it ''useless'' is confused.
  The physician''s last move was that the value of information is agent-relative:
  a report worthless to a treating clinician may be valuable to an underwriter or
  an anxious patient, so the hospital cannot simply inherit the statistician''s claim.
  The statistician replied that the hospital is itself an agent with a wider set of
  consequences, and that is exactly the agent whose decision problem one should evaluate.
  They went back and forth in this vein for some time. Could you adjudicate their
  exchange point by point, saying which specific claims survive and which fail, where
  the two are talking past one another, and what a sound account of the value of information
  would say about the hospital''s purchase?


