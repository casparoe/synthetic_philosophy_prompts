  but correct accounting: a decision is defined by its consequences, and if the consequences
  include peace of mind or family planning, then the information changes the decision
  problem even when the medical action is identical. The physician then pressed the
  point that the theorem only guarantees free information cannot lower expected utility;
  once the hospital pays real money, the theorem sets no upper bound on the price
