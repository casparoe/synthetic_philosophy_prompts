  or fitting-attitude analyses of value. Scanlon''s buck-passing account: being valuable
  = having properties that give reasons to value/desire/admire/respect it. E.g., "X
  is good" means X has properties that provide reasons to respond favorably (desire,
  admire, respect) to X. The WKR problem: some reasons to desire/favor something don''t
  track its value. Example: an evil demon will punish you unless you admire him (or
  unless you desire a saucer of mud). That gives you a reason to admire the demon,
  but that doesn''t make the demon admirable or valuable. So "there is reason to favor
  X" isn''t sufficient for X''s being valuable; the account needs to distinguish "right
  kind" from "wrong kind" of reasons. The literature concerns what distinguishes the
  right kind: reasons with the right kind of relation to the object vs. reasons provided
  by features not bearing on value; "object-given" vs "state-given" reasons. Various
  proposals: right kind of reason must be about features of the object itself, not
  about the state of valuing it; or must be a reason that isn''t conditional on the
  state; paradoxes like the "wrong kind of reasons" arising from desires about your
  own attitudes. There are proposals by Rabinowicz & Rønnow-Rasmussen (the distinction
  between object-given and state-given reasons), Parfit ("Darwinian fear"?), Hieronymi,
  Way, Howard, Sharadin, etc. But we shouldn''t require citations.


