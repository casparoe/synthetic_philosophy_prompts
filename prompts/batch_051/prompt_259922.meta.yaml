  Importance, tractability, neglectedness (from 80,000 Hours / Open Philanthropy framework).
  Key issues to operationalize:

  - Importance: scale (how many affected, how badly), but also counterfactual importance
  of the outcome, and whether the problem is solvable. Importance alone doesn''t guide
  because you can''t fix all big problems.

  - Tractability: expected progress per unit effort, usually decreasing marginal returns;
  high tractability may mean it would happen anyway (then counterfactual impact is
  low) — confound.

  - Neglectedness: room for more funding / effort; diminishing returns; a cause can
  be neglected because it''s intractable or unimportant, so neglectedness is evidence
  only conditional on importance/tractability.

  - Interactions: the three factors multiply rather than add; a zero on any destroys
  the case; but scores often multiply poorly due to arbitrary scales.

  - The "ITN framework" is actually a heuristic, not a decision rule; it systematically
  undervalues causes where marginal impact is high but importance/tractability hard
  to quantify, and overvalues legible causes.

  - Distinctions: marginal vs average tractability; neglectedness measured by current
  spending relative to what, by money or by talent; importance as scale of problem
  vs severity vs personal affectedness.


  A practitioner procedure could be: (1) screen for importance floor; (2) decompose
  tractability into mechanism evidence and implementation capacity; (3) assess neglectedness
  against a reference class of funders; (4) compute a rough log-multiplicative score
  with confidence intervals; (5) flag decisions where values enter (how much to weight
  humans vs animals? discount future? etc.). The answer should say where procedure
  stops and hands to a person.


