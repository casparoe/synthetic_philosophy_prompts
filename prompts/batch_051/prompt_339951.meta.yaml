  Prompt draft:

  "Rietdijk and Putnam argued that special relativity gives you a block universe (or
  at least a kind of determinism). The rough idea: pick some event e that to me is
  in the future. Because simultaneity is relative, there''s another inertial observer
  for whom e is simultaneous with, or already past. If e is real for them, it can''t
  also be open for me. So to avoid privileging my frame, the future must be as fixed
  as the past. The argument leans hard on the claim that no inertial frame is special.
  But in actual cosmology, we do have a frame that is, if not special, at least naturally
  picked out: the co-moving frame in which the cosmic microwave background looks isotropic,
  with its associated cosmic time. Suppose we take that frame as the ''real'' present,
  even if only as an approximate global synchronization. Does Rietdijk-Putnam survive?
  Which premise is under pressure, and is there a weaker version that still gives
  the block universe or determinism? Or does the mere existence of a preferred cosmological
  frame not touch the argument because local relativity of simultaneity remains? Write
  an essay; address the physics, and end with a verdict rather than hedging."


