  I take this passage to be doing two things: giving a causal explanation of why large-scale
  cooperation fails, and implicitly distinguishing the two-person case, where defection
  is visible and causally decisive, from the thousand-person case, where each person''s
  contribution is almost certain to be neither. What interests me is the normative
  question this distinction generates: is the wrong of free riding in the large-scale
  case the same wrong as in the small-scale case, or does the difference in causal
  structure change its character?


