  if the action is not the complete causal product of factors that preceded the agent''s
  existence. If determinism is true, then no one is ever ultimately responsible for
  anything.


  2. Frankfurt cases succeed. In cases where a counterfactual intervener would have
  prevented the agent from doing otherwise but did not actually intervene, the agent
  is still morally responsible, provided the action issued from her own evaluative
  outlook. Responsibility does not require the ability to do otherwise.


  3. The reactive attitudes are not held hostage to metaphysics. Resentment, gratitude,
  and indignation are justified attitudes in ordinary interpersonal life; their justification
  does not wait on a settled answer to the question whether determinism is true.


  4. Blame is desert-entailing. Blaming someone is not exhausted by deterrence, rehabilitation,
  or the expression of a demand; blame is fitting only if the person deserves it,
  where desert is non-forward-looking — a relation between the person and what she
  did, not merely the usefulness of the blame.


