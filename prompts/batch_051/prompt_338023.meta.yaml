  Let me design the two positions precisely:


  Position A ("novelty as a final good" / "variety is a constituent of well-being"):
  A human life can be better or worse not only because of how much pleasure, achievement,
  meaning, desire-satisfaction, etc., it contains, but because of the kind of variety/seeking
  of novelty itself. Novel experiences, new projects, unfamiliar environments have
  value that is not reducible to the experiences'' other properties (or to the avoidance
  of boredom). This camp rejects the idea that a life comprised of a small set of
  maximally good experiences repeated is as good as a varied one, even with equal
  aggregate prudential value.


  Position B ("novelty is purely instrumental"): Novelty matters only as it affects
  other goods: it prevents adaptation/hedonic decline, it opens access to new goods,
  it is a means to learning/achievement, etc. If those goods could somehow be delivered
  without novelty, novelty would have no further value. Well-being is determined by
  some underlying currency (e.g., positive experience, desire-satisfaction, realized
  capabilities), and variety enters only as an input.


