  Wrong kind of reasons problem: The distinction between "right kind of reasons" (RKR)
  and "wrong kind of reasons" (WKR). Standard example: an evil demon will punish you
  unless you admire him for his evil deeds. That''s a reason to admire him, but not
  the "right kind" — it doesn''t make admiration fitting or correct; it makes it expedient.
  The problem: many theories of reasons (buck-passing, fitting-attitude analysis of
  value) struggle to exclude WKR. It''s about reasons for attitudes (admiration, fear,
  hope, blame, desire, belief?). There''s a literature by Rabinowicz & Rønnow-Rasmussen,
  Danielsson & Olson, Hieronymi, Schroeder, Way, Sharadin, etc. But we shouldn''t
  cite.


