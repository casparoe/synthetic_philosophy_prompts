  Let me consider a Sellars type A prompt with a subtle argument. Sellars''s attack
  on the given involves the notion that "the given" conflates two roles: (1) something
  that is non-inferentially known, and (2) something whose very presence constitutes
  knowledge that is self-authenticating and prior to all conceptual capacities. Sellars
  argues you can''t have both: if a state is non-inferentially acquired, that''s a
  causal/explanatory fact, and it can be known without itself being knowledge (a sensation
  of red can cause a belief "this is red" without itself being a knowing); if it''s
  a knowing that something is thus-and-so, then it involves classification and is
  answerable to the space of reasons. So the myth is conflating "non-inferential causal
  trigger" with "epistemic foundation."


