  Morgan''s canon argument:


  (1) We should never attribute a higher cognitive capacity to an animal if a lower
  one suffices to explain its behavior.

  (2) For any behavior, a sufficiently gerrymandered associative/stimulus-response
  explanation can always be constructed ex post.

  (3) So, for any behavior, there is always a "lower" explanation available.

  (4) Therefore Morgan''s canon, applied strictly, forbids attributing every cognitive
  capacity to animals.

  (5) But the canon was intended as a methodological parsimony principle, not a substantive
  denial of animal cognition.

  (6) So either the canon is empty (if we accept gerrymandered explanations) or it
  is a substantive anti-cognition bias (if we require non-gerrymandered explanations).


