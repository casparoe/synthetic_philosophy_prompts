  The person: A philosophy professor of social philosophy/ethics of work and leisure.
  Commitments:


  (i) The Protestant work ethic''s core claim is broadly right: disciplined work in
  a calling has intrinsic, not merely instrumental, value.

  (ii) It is a serious moral failing of a society when it cannot secure meaningful
  work for those who want it (unemployment and bullshit jobs are harms, not just income
  problems).

  (iii) Karoshi is a symptom of a pathological work culture, not an extreme but healthy
  expression of the work ethic.

  (iv) The French 35-hour week (and similar legal limits) is, on balance, a good policy.

  (v) Leisure is not primarily instrumentally valuable; a life of pure recovery from
  work is deficient, and leisure practices (contemplation, play, friendship, aesthetic
  activity) are intrinsic goods.

  (vi) The state should be neutral between reasonable conceptions of the good; it
  should not legislate a particular work ethic or leisure ideal.


  Where are tensions?

  - (vi) vs (iii): adjudicating karoshi as "pathological" seems to presuppose a substantive
  ideal of good work, which is what a neutral state shouldn''t impose. But (iii) is
  a moral judgment by the person, not necessarily a policy; and preventing harm (overwork
  deaths) is neutral-ish. Apparent/pending tension: can you claim neutrality yet judge
  some work cultures pathological?

  - (i) vs (v): If work has intrinsic value and leisure has intrinsic value, is there
  a principled account of when work becomes excessive? The person holds both; they
  can be consistent (both intrinsic goods, balanced), but the usual motivation for
  (i) (Weber''s asceticism) tends to devalue idle leisure, while the motivation for
  (v) (Aristotle''s leisure as activity of virtue, or Lafargue) tends to subordinate
  work. Genuine tension of motivations, but not logical contradiction.

  - (i) vs (iv): a legal maximum working week might be in tension with the idea that
  one''s calling might reasonably demand more than 35 hours; the work ethic suggests
