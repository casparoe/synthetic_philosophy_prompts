  does not depend on other knowledge. Sellars attacks the framework of givenness.
  There''s a lot of nuance: the distinction between the scientific image and manifest
  image, the idea that sense-datum theories and classical empiricism commit the myth,
  the "this is red" example, the logical space of reasons. Epistemic givenness vs.
  conceptual givenness. The idea that observational knowledge is not self-authenticating.


