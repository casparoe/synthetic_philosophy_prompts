  Draft final:


  I am a retired physicist, and in the last year or so I have been reading the philosophy
  of physics for pleasure. A question I keep turning over concerns a parallel I may
  have imagined, and I would like a professional assessment of it.


  In the foundations of quantum mechanics, there is a division between what I have
  seen called psi-ontic and psi-epistemic views of the wavefunction. The psi-ontic
  view treats the wavefunction as a real feature of the world—something like a physical
  field, or at least part of the underlying furniture—so that distinct wavefunctions
  always correspond to distinct physical situations. The psi-epistemic view treats
  the wavefunction as a compact summary of an agent''s information or credences about
  a system: two agents with different evidence may assign different wavefunctions
  to one and the same underlying physical state, just as two people with different
  evidence assign different probabilities to the same coin, and on this view the collapse
  of the wavefunction is not a physical transition but an update of knowledge. I gather
  that the epistemic reading has been put under pressure by a number of no-go theorems
  in the last couple of decades, though I do not pretend to follow their assumptions
