  I spent my career in [field] and have recently been reading philosophy of physics,
  and I have hit a question I cannot adjudicate myself.


  In the foundations of quantum mechanics there is a familiar dispute about the status
  of the wavefunction. On one side, the wavefunction is taken to be a real feature
  of the world—something like a physical field or at least part of the ontology—so
  that two different wavefunctions always correspond to genuinely different physical
  situations. On the other side, the wavefunction is said to be merely a compendium
  of an agent''s information or credences about a system: just as two observers with
  different evidence may assign different probabilities to the same coin toss, two
  observers may assign different wavefunctions to one and the same underlying state,
  and collapse is then just Bayesian updating rather than a physical transition. I
  understand that this second family of views has been squeezed by recent no-go theorems,
  though I do not pretend to follow their assumptions in detail.


  Now, this debate reminds me strongly of an older debate in statistical mechanics,
  which I know at first hand. There, too, one finds two readings of the central formal
  object—the probability distribution over microstates, and the entropy built from
  it. On one reading, these are objective features of a thermodynamic system or ensemble;
  on the other, associated with Jaynes, they are measures of our ignorance, and statistical
  mechanics is a branch of inference. And here too the "merely in the head" reading
  had to face hard constraints: Landauer''s principle, Szilard''s engine, and the
  fluctuation theorems all suggest that information/entropy is not freely reglossable
