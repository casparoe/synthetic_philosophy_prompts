  Let me recall the doomsday argument. Core idea: applying the self-sampling assumption
  (SSA): you should reason as if you are a random sample from all observers that will
  ever exist (or from some reference class). If there will be many more humans in
  the future (long-lived species), then it''s surprising that you are among the first
  ~100 billion. If humanity goes extinct soon (small total), your position is typical.
  Hence the observation of your birth rank increases the posterior probability of
  "doom soon." There''s a Bayesian formulation with two hypotheses: Doom Soon (total
  200 billion) vs Doom Late (total 200 trillion). Your birth rank ~60 billion. Under
  SSA, likelihood of being rank 60b is 1/200b under Soon and 1/200t under Late; so
  Soon is favored by a factor of 1000. But this is controversial.


  Objections:

  - The Self-Indication Assumption (SIA) cancels the doomsday argument: you should
  take into account that you exist; hypotheses with more observers make your existence
  more likely, exactly cancelling the SSA effect. (Bostrom argues SIA has its own
  problems, like the presumptuous philosopher.)

  - Reference class problem: what counts as "observer" or "human"? You might not be
  a random sample from all humans ever; you are you specifically, with a specific
  position in history. The choice of reference class determines the result.

  - No self-locating probability: some philosophers (e.g., in the tradition of Lewis/Elga?)
  think self-locating probabilities are fine; others say the argument is invalid because
  you cannot treat "I" as a random sample from a class you don''t know.

  - "The doomsday argument only works if there will be no other intelligent species"
  or anthropic reference classes (all sentient beings vs humans) changes the result.

  - Temporal: maybe my existence is guaranteed to be at time when population is large;
  sampling times vs sampling people differs. The "sooner or later" sampling bias.

  - Leslie''s version: analogy with balls in an urn, numbered sequentially; drawing
  ball #7 favors small total. But critics: if you didn''t know your number before?
  Lottery of birth.

  - The "no doom soon" because the argument proves too much: it would apply to any
  historical person, and it would have "predicted" doom for people in the past, paradoxically.
  The argument generalizes to any time: if conditional on your rank, H soon favored.
  But can''t always be true.

  - The "Self-Sampling Assumption with a non-human reference class" or "anthropic
  shadow."


