  Position: "An alphabet is (or should be) a theory of the phonemic structure of a
  language." Argument that seems to prove too much:


  (1) The whole point of an alphabet is to represent the phonemes of a language: one
  symbol per phoneme, no more and no less. If a writing system marks subphonemic detail,
  it''s redundant; if it fails to mark a phonemic contrast, it''s ambiguous.

  (2) "Phoneme" is defined by contrast within a single variety: two sounds are distinct
  phonemes for a speaker iff swapping them can change meaning for that speaker.

  (3) So whether two sounds are "the same phoneme" is relative to a speaker''s variety.

  (4) Therefore, a spelling that is perfectly phonemic for one speaker is misrepresenting
  the language for another speaker whose phonemic contrasts differ (e.g., the cot–caught
  merger, the pin–pen merger).

  (5) It follows that there is no such thing as a spelling that is correct for English
  as a whole; any orthography is just a phonological theory of one idiolect, and all
  such theories are on a par.

  (6) But that conclusion is absurd: English spelling, which no living speaker can
  reliably pronounce from, is plainly worse as a theory of the language than a reformed
  spelling would be.

  (7) So premise (1) must be false: an alphabet is not simply an encoding of phonemes.


