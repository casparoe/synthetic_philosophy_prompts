  I keep getting pulled in two directions about how defamation law should handle ratings,
  predictions, and forecasts, and I want help arbitrating between the pull of a theory
  and the pull of an intuition.


  The theory is this. Defamation liability should track a single, principled line:
  a statement is actionable only if it is capable of being proven false, and it is
  protected if it is an evaluation, a matter of taste, or a conjecture about the future.
  That test has real systematic virtues. It is predictable for speakers before they
  publish, it keeps courts from acting as referees of quality, it explains a lot of
  settled cases, and it follows from the thought that the law should police falsehoods,
  not disagreements. Calling a psychiatrist''s practice "medieval" would be protected,
  while claiming she falsified patient records would not; a restaurant review''s "disappointing"
  is protected, while alleging "I saw roaches in the kitchen" is actionable, because
  the latter can be shown false. I find this picture genuinely compelling as a matter
  of principle, not just doctrine.


  But then I have an intuition I cannot shake. Consider an equity analyst at a bank
  who publishes a "buy" rating and a twelve-month price target, or a credit rating
  agency that assigns a municipality a near-default rating. Suppose the factual underpinnings
  are false — the model''s inputs were wrong, the diligence was never done, the analyst
  knew the assumptions were junk — and the publication destroys the subject''s reputation
  or standing. Maybe the target company''s shares collapse after a "sell" report whose
  quantitative support was fabricated. I find myself wanting to say that something
  false and damaging has been asserted, not merely opined. The word "forecast" or
  "rating" seems to operate as an immunizing label over statements that are rest on
  claims about the world. And yet the theory tells me exactly the opposite: a forecast
  is not true or false when uttered, and a rating is a judgment, so neither is a provably
  false assertion of fact.


