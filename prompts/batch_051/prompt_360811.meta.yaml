  The "competitiveness constraint" in AI alignment: the idea that even if a lab wants
  to invest in safety, competitive pressures force it to match rivals'' pace and capabilities;
  safety measures that slow development or raise costs are an "alignment tax" — an
  extra cost in time, compute, or capability that competitors may avoid paying, so
  safety underinvestment is incentivized. In a competitive market, the least safe
  actor can set the pace; safety is a public good with a race-to-the-bottom dynamic.


  Applying to Boeing 737 MAX: Boeing was racing to compete with Airbus''s A320neo,
  which offered fuel efficiency gains from the new LEAP-1A engines. To avoid losing
  market share, Boeing designed the 737 MAX with larger engines placed further forward/up
  on the wing, which created aerodynamic handling changes (pitch-up tendency), and
  MCAS (Maneuvering Characteristics Augmentation System) was added to compensate so
  the plane would handle like previous 737s and not require new pilot training (simulator
