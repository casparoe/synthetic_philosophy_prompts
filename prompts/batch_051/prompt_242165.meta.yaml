  I''m trying to sort out what I actually think about karma—not the metaphysics of
  rebirth, just the everyday idea that there''s something like a cosmic or natural
  law connecting the moral quality of what you do to the quality of what you later
  get. Lately I''ve been toying with a principle and I want it tested against my own
  gut reactions to cases, so I''d like you to either repair it or tell me which verdicts
  I have to abandon.


  The principle I keep coming back to: karma isn''t a scoreboard that pays out rewards
  and punishments to match your deeds. It''s more like this: each type of action nourishes
  or corrodes the specific capacities that made the action possible in the first place,
  and the "return" on an action is mainly the worsening or strengthening of those
  capacities. So a liar''s punishment is that they lose access to the world that truth-tellers
  live in; a generous person''s reward is that they stay able to see people as worth
  trusting. No one has to do the accounting; the feedback is built into the act.


  Here are my verdicts, and I''ll flag where things get shaky.


  1. A man lies constantly in his business dealings. Twenty years later he''s rich,
  but he can''t believe anyone''s sincerity; he treats his wife''s affection as a
  performance, he suspects every compliment of being a sales pitch. He''s miserable,
  not from guilt but from the impossibility of being surprised by anyone''s goodness.
  Verdict: this feels about as close to karma as real life gets. It''s less like he''s
  punished and more like he''s been slowly walled in. I like my principle here.


  2. A scammer defrauds elderly people out of their savings. He''s caught, sent to
  prison, and lives the rest of his life consumed by resentment at the people who
  put him there. Verdict: justice is done, but honestly it feels less karmic than
  case 1. There''s something too external about it—the punishment is the legal system,
  not the internal logic of the scam. If his own suspiciousness had unraveled the
  scam, it would feel more like karma. Does that make sense, or am I just biased against
  institutions?


  3. A woman routinely covers for a colleague''s mistakes at work; as a result she''s
  trusted by nearly everyone and her own errors get forgiven quickly. Verdict: the
  rewards feel earned, but I''m a little uncomfortable with the thought that generosity
  should pay in this coin—her being trusted is fine, but if the reward were just career
  success I''d think the principle had been adulterated into self-help. So: the "return"
  has to be connected to the capacity, not just any good outcome that happens to follow.


  4. A teen humiliates a shy kid at school. Decades later, the teen''s own son is
  humiliated at school, in an eerily similar way. Verdict: I emphatically don''t want
  to call this karma. It''s a matching shape with no mechanism; the son suffered,
  not the father, and the symmetry is just narrative. But it bothers me because it
  has the same structure I praised in case 1: bad act, later bad state, no human administrator.
  So I need the principle to explain why this one is off. I suspect the difference
  is that case 1 runs through the agent''s own capacities while case 4 runs through
  narrative coincidence, but I''m not sure that''s principled and not just my aesthetics.


  5. A whistleblower reports corruption at her firm, does the right thing, and is
  blackballed by the whole industry. Verdict: not karma; if anything the reverse.
  I don''t want this handled by saying "she gained inner clarity," because that feels
  cheap. What''s the principle''s actual verdict here? That the world''s feedback
  mechanisms are keyed to the quality of the act-type only under the right background
  institutions, and when institutions are corrupt the feedback breaks? Or that karma
  was never about external consequences at all, in which case maybe I should stop
  mourning the blackballing—and I can''t, so maybe my principle is too internalist?


  6. A man stole from his employer in his twenties, genuinely changed, and now lives
  a modest, honest, unpunctured life. He''s never caught and never confesses, but
  he''s not tormented. Verdict: fine. I don''t need him to suffer. If someone told
  me karma required the old debt to be paid before things were right, I''d reject
