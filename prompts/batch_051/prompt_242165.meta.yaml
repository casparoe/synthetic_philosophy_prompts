  sin are felt as pain on schedule. This is the one I most need a theory of.


  8. A man kills someone in a drunken bar fight, is never caught, and the guilt slowly
  destroys him—he can''t work, drinks more, dies early. Verdict: this feels deserved,
  even though I also think it''s tragedy. The punishment is internal but there''s
