  I am giving a colloquium talk next month to a PPE-style department... My paper,
  ''Acquisitiveness Is Not One Thing,'' defends the following claim: the familiar
  debate about whether greed is a vice or an engine of prosperity is misframed, because
  ''greed'' and ''acquisitiveness'' cover two separable dispositions — a bounded,
  institution-responsive concern for one''s material well-being and relative position,
  and an unbounded, comparative appetite to have more than others as an index of one''s
  worth. The first disposition, I argue, does most of the work in the standard prosperity
  story; the second is a vice in approximately the Aristotelian sense, and whatever
  prosperity it produces is contingent and self-undermining unless restrained by non-market
  norms. I conclude that the practical aim should not be to condemn or celebrate ''greed''
  wholesale but to design institutions and cultural signals that cultivate the first
  disposition without licensing the second.


