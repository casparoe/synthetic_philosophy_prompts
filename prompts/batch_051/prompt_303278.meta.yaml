  Frankfurt''s "On Bullshit": He begins with Max Black''s "Humbug". Black''s definition:
  humbug = deceptive misrepresentation, short of lying, especially by pretentious
  word or deed, of somebody''s own thoughts, feelings, or attitudes. Frankfurt thinks
  Black''s account fails because it focuses on representing one''s own state, but
  bullshit can be about facts. He discusses the difference between lying and bullshit:
  both involve misrepresentation, but the liar''s aim is to install a false belief;
  essential to lying is that the liar knows the truth and intends to lead away from
  it. The bullshitter''s relationship to truth is different: he does not care whether
  what he says is true or false; he picks out or makes up statements to suit his purpose.
  This doesn''t mean he necessarily produces false statements — he might be right
  by luck. The essence of bullshit is "lack of connection to a concern with truth"
  — indifference to how things really are. Frankfurt also discusses Wittgenstein anecdote,
  and the difference between bull session and bullshit: in a bull session people try
  out thoughts without commitment, which is fine if the situation is understood as
  exploring ideas. Bullshit is a "greater enemy of truth than lies" because the liar
  pays truth the compliment of recognizing its authority by trying to hide from it,
  while the bullshitter ignores it.


