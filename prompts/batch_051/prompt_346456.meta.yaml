  Potential prompt:


  "I have been thinking about an idea I came across, called sphexishness, and I worked
  out an argument that bothers me. As I understand it, a sphex wasp will drag a paralyzed
  cricket to the entrance of its burrow, leave it there, go inside to check the burrow,
  come back out, and then drag the cricket in. If a person moves the cricket a few
  inches while the wasp is inside, the wasp will drag the cricket back to the entrance
  and immediately go inside to check again -- as many times as the cricket is moved.
  It seems to be running a fixed routine rather than noticing that it has already
  checked. I''ve been trying to turn this into a general point about free will, and
  I can''t find the flaw myself. Here is the argument I''ve settled on.


  (1) We say the wasp is not free because the same cue in the same internal state
  reliably produces the same routine, no matter how many times it cycles.

  (2) But any sufficiently elaborate system of such fixed cues and routines, combined
  with memory and internal timing, could match an enormous range of observed behavior:
  if the sun is out and the nest is dark, do A; if the cricket is displaced and the
  last check was less than a minute ago, do B; and so on.

  (3) In principle, an arbitrarily long list of condition-action rules could reproduce
  the outward behavior of a human being over any finite period of observation -- including
  the behavior of pausing to weigh options, changing one''s mind, and explaining one''s
  choices.

  (4) A system driven by a long list of condition-action rules is no less sphexish
  than the wasp is; the length of the list is a difference in quantity, not in kind.

  (5) Therefore, for anything a human being says or does, there is a possible sphexish
  system that says or does the same thing over that period.

  (6) If two systems behave identically over a period, no observation made during
  that period can tell them apart.

  (7) So no observation could ever show that a human being is not sphexish; the alternative
  to sphexishness is an invisible extra.

  (8) Therefore, either human freedom is that invisible extra -- in which case it
  makes no detectable difference and is hard to see as freedom -- or the distinction
  between the wasp and us is only a matter of how large the rule book is, and there
  is no free will in any deep sense."


