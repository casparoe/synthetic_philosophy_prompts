  equipoise. Theoretical equipoise: individual clinician genuinely uncertain. Clinical
  equipoise: the expert community is divided/uncertain, so the trial is legitimate
  even if individual clinicians have hunches.

  - Key ethical tension: between doing what''s best for the patient in front of you
  (therapeutic obligation) and generating knowledge to help future patients. Randomized
  trials seem to sacrifice the former.

  - Arguments: some say randomization is only justified when the clinician is in a
  state of "equipoise" (personally indifferent between arms). Others (e.g., Freedman)
  say that''s too fragile — individual hunches, accumulating data quickly upset it
