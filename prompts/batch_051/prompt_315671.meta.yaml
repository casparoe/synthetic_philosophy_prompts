  - Clinical equipoise: a state of genuine uncertainty in the expert medical community
  about the comparative therapeutic merits of each arm in a trial. If equipoise exists,
  it''s ethically acceptable to randomize patients, because no patient is knowingly
  given inferior treatment; if it''s disturbed (one arm known better), trial should
