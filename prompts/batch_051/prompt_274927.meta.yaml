  A step-by-step argument could be:


  (1) For any two events A and B with no known mechanism linking them, the rational
  default is to treat them as probabilistically independent: P(A and B) = P(A)P(B).

  (2) If A and B are independent, then observing A raises the probability of B only
  if A and B have a known common cause or if you already knew not-independent, etc.
  Actually observing one event does not raise the probability of the other when independent.

  (3) Rationality requires updating on evidence: if you observe A happen and then
  B happen, and P(A&B) under independence is very low, you should conclude the events
  are probably not independent.

  (4) Therefore, from "no known mechanism" (the condition for the default) you rationally
  infer a mechanism as soon as a low-probability conjunction occurs.

  (5) So the presumption of independence is self-undermining: applying it in exactly
  the way it prescribes makes you abandon it whenever it would matter.


