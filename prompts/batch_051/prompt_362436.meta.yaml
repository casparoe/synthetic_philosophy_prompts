  Game idea: "The Unchanging Room" simulation. Participants work in pairs or small
  groups; one group plays a planner, another plays the world/environment, maybe a
  third plays a sceptical auditor. The planner receives a list of facts about a room
  (location and properties of objects) and a goal (e.g., get the cup from the table
  to the sink). They must write down, for each action, all facts they believe still
  hold afterwards. The world group, using hidden truth, reveals only the facts the
  planner actually listed; unlisted facts may "slip" — e.g., after "turn on tap,"
  if the planner didn''t list "the sponge remains on the counter," the sponge disappears/becomes
  undefined, and the planner must spend moves to re-observe. Payoffs: number of re-observations/moves
  before goal. Then debrief: the urge to say "obviously everything else stays the
  same" is exactly the frame problem; the formalism can represent the action''s effects
  but not everything the action doesn''t affect; the qualification problem (listing
  preconditions), ramification problem (knock-on effects). That''s runnable and feels
  the force.


