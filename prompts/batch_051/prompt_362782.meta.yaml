  I''m on the board of a regional community safety partnership, and we have to decide
  next week whether to commission a £40,000 "predictive history" tool from a consultancy.
  The pitch is built on something called cliodynamics. Their model says societies
  go through long waves: population pressure builds up, you get too many educated
  young people chasing too few elite jobs (they call this "elite overproduction"),
  inequality rises, and eventually the society enters a crisis phase — roughly every
  couple of generations, give or take. They aren''t claiming it predicts exact dates,
  but they do say it gives a probabilistic early-warning signal, and they want us
  to use it to time our spending on youth services and community mediation, so that
  we put more money in during the predicted run-up to a crisis phase.


  A couple of board members think this is just astrology with equations — history
  doesn''t repeat, and each crisis has its own causes. One member thinks it''s no
  different in principle from economic forecasting or flood-risk modelling, and that
  we''d be irresponsible to ignore an early-warning tool. I''ve been asked to draft
  the short decision memo for next weeks meeting. I left university at 19 and have
