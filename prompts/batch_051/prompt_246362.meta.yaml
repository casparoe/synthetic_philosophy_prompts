  The vendor''s pilot data from two other campuses and one municipality show no serious
  injuries in approximately four million miles, but the vendor''s own safety model
  gives a wide credible interval for the per-mile risk of a serious pedestrian injury;
  translated to our expected 40,000 robot-miles per year, the annual probability of
  at least one serious injury is somewhere between 1 in 200 and 1 in 20, depending
