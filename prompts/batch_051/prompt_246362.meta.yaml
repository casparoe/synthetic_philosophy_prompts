  I sit on the Campus Mobility and Safety Committee at a large urban university, and
  we must decide by Friday whether to permit a private vendor to operate forty small
  autonomous delivery robots on the university''s pedestrian paths. I regard this
  as a concrete instance of a question the committee rarely faces head-on: when, if
  ever, may an institution impose small risks of serious harm on people who have not
  consented and who may not benefit? I need a written decision memo from you that
  I can circulate before the vote.


  The proposal: the vendor would deploy up to forty six-wheeled robots, speed-limited
  to 4 mph and weighing about 45 pounds, to deliver meals and groceries from campus
  dining halls to students and staff who pay a delivery fee. The robots would share
  crowded walkways with roughly 35,000 people a day, most of them students and employees
  who have chosen to be on campus, but also visitors, children attending summer day
  camps, and neighbors who cut through campus. The vendor''s pilot data from two other
  campuses and one municipality show no serious injuries in about four million miles,
  but the vendor''s own safety model gives a wide range for the per-mile risk of serious
  pedestrian injury; scaled to our expected 40,000 robot-miles per year, the annual
  probability of at least one serious injury is estimated at somewhere between 1 in
  200 and 1 in 20, depending on modeling choices the vendor itself flags as uncertain.
  Minor collisions are more common and have produced skinned knees, bruised shins,
  and one sprained ankle. The vendor offers indemnification, a $5 million insurance
  policy, daylight-only operation, and remote human supervisors who can take over.


  The committee is split. One faction argues that the risks are tiny compared with
  ordinary background risks from bicycles, scooters, and delivery vans, that students
  and staff are choosing a convenience for themselves, and that rejecting the proposal
  on these numbers would commit us to a zero-risk standard we apply to nothing else.
  The other faction argues that the central issue is not the size of the risk alone
  but its imposition on people who never consented and who receive little or no benefit:
  the summer-camp child on a field trip, the wheelchair user whose curb cut is blocked,
  the neighbor using a shortcut. They also worry that approving this program normalizes
  trading small risks to third parties for the convenience of institutional members,
  and that many such small approvals could accumulate into a meaningfully less safe
  environment.


  Write the committee''s decision memo. It should recommend one of three courses of
  action — approve, reject, or approve with specific conditions — with reasons both
