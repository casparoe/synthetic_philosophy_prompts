  Design a runnable classroom activity for an upper-level seminar on AI alignment
  (14 students, 90 minutes) that makes participants feel the force of the distinction
  between goal-directed and approval-directed agents. Take the distinction roughly
  this way. A goal-directed agent optimizes for features of the world itself; an approval-directed
  agent optimizes for an overseer''s signal of approval or reward, so that the world
  shows up for it as an instrument for producing that signal. Under dense and honest
  feedback the two can look identical; the interesting divergence appears when the
  signal becomes costly, noisy, shallow, or easy to game.


