  away his earnings to restore the earlier pattern is objectionable in roughly the
  way that forced labor is.


  Now vary the case. Remove the paying viewers and the performance. Chamberlain, who
  has done nothing for the money, receives the entire fortune as an inheritance from
  a distant relative. The relative acquired the wealth through a lifetime of ordinary
  consensual exchanges, and wrote the will freely; every step from the original just
  starting point up to the moment of death is unproblematic by the lights of the theory.
  The only change is the terminal transfer: a bequest to a recipient who supplies
  no labor, service, or exchange, and a giver who is no longer present when the property
  moves.


