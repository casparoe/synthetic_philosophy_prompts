  Actually, let''s think about what positions exist to ensure the prompt is well-formed.


  Positions in truth in fiction / empty names:

  - Russellian: "Sherlock Holmes" is a disguised definite description; sentences like
  "Holmes is a detective" are false (if the description isn''t satisfied) or perhaps
  true relative to the stories? Russell: "The present King of France is bald" is false.
  So "Sherlock Holmes is a detective" is false simpliciter, but we can analyze "in
  the stories, Holmes is a detective" via an intensional operator that quantifies
  over propositions implicit in the text. So no fictional objects.

  - Pretence theory (Walton-style): statements about fiction are pretend, not truth-evaluable;
  "Holmes is a detective" is to be understood as part of a game of make-believe. Truth
  in fiction is generated by principles of generation from the text plus background.

  - Meinongianism: non-existent objects; "Holmes is a detective" is true of the non-existent
  object Holmes, but "Holmes exists" is false. Some properties (nuclear) vs extranuclear
  distinction.

  - Abstract object theory (Zalta): Holmes is an abstract object that encodes properties
  attributed in the stories but doesn''t exemplify them. "Holmes is a detective" true
  in the encoding sense; "Holmes exists" true (abstract object exists), which is surprising.

  - Artifactualism/Creationism (Thomasson, van Inwagen, Searle?): fictional characters
  are abstract artifacts created by authors, depending on texts; they exist (as abstract
  artifacts) but aren''t detectives; "Holmes is a detective" is only true in the fiction,
  not literally.

  - Possibilism: Holmes is a possible (non-actual) object; "Holmes is a detective"
  true of that possible object; "Holmes exists" true in the possible-worlds sense
  but false in actuality.


  Truth in fiction:

  - Fictional operator accounts: "In the fiction F, P" is true iff P is true in all
  worlds consistent with what the text says plus some intended extrapolation.

  - Textualism vs intentionalism: actual text vs authorial intent; common-sense/background
  knowledge (Lewis''s Analysis 1 and 2).


