  I''ve been trying to understand why mutation specifically, not just state, makes
  programs so much harder to reason about. I was reading the section "The Costs of
  Introducing Assignment" in Abelson and Sussman''s Structure and Interpretation of
  Computer Programs, and they start from the observation:


  "We ordinarily view the world as populated by independent objects, each of which
  has a state that changes over time. An object is said to ``have state'''' if its
  behavior is influenced by its history."


  Then a bit later they say that if we model state variables by ordinary names, the
  language must provide an assignment operator. So the claim I want to test is something
  like: the hard part of mutation isn''t the assignment operator itself, but the fact
  that it forces you to stop treating an expression as denoting a value and start
  treating it as denoting a place with a history. A friend says that''s too vague
  to be testable; he thinks "mental model" talk is just folk psychology about programmers.
  I''d like you to take my side for the moment but in the most rigorous way possible.
  Design the best concrete test or experiment you can for the claim that reasoners
  (human programmers, maybe even models trained on code) who work with mutable state
  are thinking in terms of "objects with histories" rather than "timeless values"
  — and be explicit about what a positive result would show and what it would still
  leave open. If the claim as I''ve stated it is too confused to test, say so and
  say what would need to be sharpened first.

  ```


