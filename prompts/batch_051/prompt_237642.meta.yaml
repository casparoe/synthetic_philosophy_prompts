  and a point uniformly along it, and draws the chord perpendicular to the radius
  there, the answer is 1/2. If one chooses the chord''s midpoint uniformly in the
  interior of the circle and draws the chord through it, the answer is 1/4. Each procedure
  looks like an application of the principle of indifference, but to a different parameterization,
  and the principle does not say which parameterization is privileged. A familiar
  proposal is that the difficulty disappears if one demands that the distribution
  over chords be invariant under the symmetries of the plane—rotation, translation,
  and change of scale—and that this requirement selects the second answer, 1/2. Others
  take the problem to be ill-posed until a generating process or measurement procedure
  has been specified, so that 1/3, 1/2, and 1/4 are answers to three different questions,
