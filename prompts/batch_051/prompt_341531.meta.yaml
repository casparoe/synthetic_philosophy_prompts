  For instance:


  (1) According to MWI, after a measurement with two possible outcomes, there is one
  world where A happens and one where B happens (or a continuum, but simplify).

  (2) The theory says both worlds exist, and both are equally real.

  (3) If both worlds exist and are equally real, there''s no fact of the matter about
  how many times each outcome happens; each happens once.

  (4) So the probability of each outcome can''t be read off from counts of worlds.

  (5) The only remaining fact that could ground probability is the amplitude/weight
  of each branch.

