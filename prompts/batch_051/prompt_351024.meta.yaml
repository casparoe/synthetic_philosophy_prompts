  triplets to amino acids that is (largely) arbitrary and decipherable; this is not
  merely a metaphor. DNA does store information in a Shannon/causal sense (correlation
  that makes the sequence informative about proteins).

  2. What is metaphorical: "instruction," "program," "blueprint," "read," "language"
  — these import semantic/intentional notions; genes are not instructions in the sense
  commands from an agent.

  3. Whether "mutation = typo/error" is fair: only relative to a norm (fitness or
  function), not intrinsic.

  4. The tricky point: whether the consensus in philosophy of biology treats "genetic
  information" as more than a metaphor (Maynard Smith''s teleosemantic account vs.
  Griffiths'' parity/really-not-information critique). Models likely know this debate.


