  be applied to any physical system; the semantic sense requires a sender/receiver
  interpretation. DNA''s codon mapping is arbitrary in the code sense (like a code),
  but "program" is not exactly right because there''s no separate processor executing
  instructions in an intentional sense; the "program" metaphor captures sequence-dependence
  but not the causal-computational equivalence.


