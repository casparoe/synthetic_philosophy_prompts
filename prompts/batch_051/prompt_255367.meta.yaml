  the article. One colleague says the outlet was irresponsible to host the clip; the
  other says the public needs to see the primary evidence to trust the debunk.


  Let me make the back-and-forth 3-4 rounds.


  Round 1:

  Nadia: The outlet should never have embedded the clip. It gave the falsehood a clean,
  high-quality copy and a platform; the debunk travels less far than the clip. The
  harm of the video is in the viewing, and they increased viewings.

  Owen: That''s the "amplification" objection, but a fact-check that only describes
  a video asks people to take the fact-checker''s word for it. Showing the artefact
  lets readers compare the claim with the debunk and recognise the manipulation themselves;
  that''s what makes it a check rather than a pronouncement.


  Round 2:

  Nadia: You can show the manipulation without showing the propaganda as propaganda.
  Crop to the manipulated frames, play it muted, overlay the analysis, or use a still
  with the tell-tale artefacts circled. A full, downloadable clip is the one format
  that can be cleanly severed from the critique and re-circulated.

  Owen: But a still or a cropped segment can be accused of taking things out of context;
  the outlet would be vulnerable to the charge that it doctored the evidence. And
  if people are going to meet this video anyway—and they are—then meeting it first
  inside a frame that says "this is false, and here is why" is better than meeting
  it cold.


  Round 3:

  Nadia: That assumes the frame sticks. In practice the clip is detached: it''s already
  circulating without the caption. The people who meet it secondhand get all the persuasion
  and none of the inoculation. So the question isn''t whether the ideal reader benefits;
  it''s what the actual distribution does.

  Owen: But if we refuse to reproduce such material, we make every fact-check depend
  on the audience trusting us, and we hand propagandists a simple rule: produce material
  too hot to republish, and it becomes unanswerable. That''s a recipe for letting
  the most manipulative content escape scrutiny.


