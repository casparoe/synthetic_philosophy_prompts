  I''m drafting a lecture for an interdisciplinary seminar on risk and decision, and
  I want to spend one session on Dostoevsky''s The Gambler, read not as pathology
  but as pressure-testing decision theory. The session''s organizing question is this:
  what does the novella show about agents whose attraction to risk cannot be cleanly
  located in a utility function over money? I want the reading to work with two formal
  anchors. First, expected utility theory, which must explain a gambler''s choices
  by the curvature of utility over outcomes — a risk-seeker simply has a convex utility
  for money or an unusual taste for some non-monetary consequence of gambling. Second,
  Lara Buchak''s risk-weighted expected utility, which leaves curvature alone but
  lets the agent weight probabilities through a risk function: an overweighting function
  (r(p) > p) makes an agent globally risk-seeking, valuing a gamble as if its favorable
  probabilities are larger than they are, without any claim that money has increasing
  marginal utility.


  I''d like a reading of the novel that takes both anchors seriously and neither reduces
  the fiction to an illustration nor reduces the theory to a rationalization. In particular:
  Is Alexei Ivanovich best read as an RWEU maximizer with an overweighting risk function,
  as an expected utility maximizer with a very odd utility function, or as someone
  who defeats both models by caring about the gamble itself — the moment of suspension
  at the table — in a way that enters the framework only as an outcome labeled "the
  thrill" and thereby makes the model formally true and substantively empty? Draw
  on the major scenes you can recall — his system at the roulette wheel, the grandmother''s
  ruinous streak, the fortune he wins for Polina and still cannot walk away from —
  and say where the RWEU machinery genuinely illuminates the psychology and where
  it distorts it. Don''t quote from the text; paraphrase remembered detail and flag
