  a valid contract (P) AND the defendant breached it (Q). Judge 1: P true, Q true
  → liable. Judge 2: P true, Q false → not liable. Judge 3: P false, Q true → not
  liable. Majority on P: 2 of 3 (Judges 1,2) say P. Majority on Q: 2 of 3 (Judges
  1,3) say Q. Majority on R (liable): 1 of 3 (Judge 1) say liable. So majority voting
  premise-by-premise yields P and Q (and hence R by the doctrine) while majority on
  R says not liable. That''s the doctrinal paradox/discursive dilemma. Yes, I have
  that right.


  Premise-based procedure (PBP): vote on each premise and let the conclusion be determined
  by the accepted premises (here: liable, since P and Q both pass). Conclusion-based
  procedure (CBP): vote only on the conclusion (not liable, by 2-1). The discursive
  dilemma is the tension between the two and the worry that PBP may yield a conclusion
  a majority rejects.


  Guest position: defends PBP. The interviewer wants questions that press:

  1. The "respect for reasons" motivation: PBP captures the group''s reasons, but
  critics (Pettit) worry the group can be "schizophrenic" — its conclusion conflicts
  with its collective judgment on the conclusion.

  2. Agenda-setting power: PBP''s outcome depends on how the agenda is framed (which
  premises). The intentional framing premise R↔(P∧Q)? Critics: the person who sets
  the agenda controls the outcome; does PBP have a non-arbitrary way to fix the agenda?

  3. The doctrinal paradox vs discursive dilemma distinction: is the dilemma a threat
  only under majority rule, or does it generalize to any aggregation function (List
  & Pettit''s impossibility theorem)?

  4. Deliberation: the guest might say deliberation before voting dissolves the dilemma
  because disagreement on premises gets resolved. Counter: empirical disagreement
  persists; and deliberation can even polarize; the dilemma recurs at the post-deliberation
  stage.

  5. Strategic voting: if judges care about the conclusion, they may vote insincerely
  on premises (CBP encourages? PBP encourages?).

  6. Epistemic vs procedural legitimacy: is the committee a truth-tracker or a fair
  procedure? PBP justified epistemically only if premises are reliably judged.

  7. Which is the "real" decision: the conclusion is what''s binding; why should the
  losing conclusory majority defer to a premise majority they don''t share?

  8. Connection standards / threshold: PBP requires setting a threshold for premise
  acceptance (majority? supermajority?), and thresholds interact.

  9. The group''s "mind" and group agency (List & Pettit): if a group is an agent,
  it should have rationally coherent judgments; PBP preserves coherence at cost of
  majoritarian responsiveness — is that trade worth it?

  10. Robustness: small changes in which premises are divided can flip PBP''s outcome.


