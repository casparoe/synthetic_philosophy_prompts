  End by saying what the novel contributes to the decision-theoretic debate that the
  formalism alone doesn''t, and then, honestly, mark where your reading is most likely
  to fail: which alternative interpretation of Alexei — or which stricter reading
  of RWEU — would most force you to revise the overall verdict.


