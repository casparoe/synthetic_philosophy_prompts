  - Mīmāṃsā: the Veda is apauruṣeya (authorless/not of human or divine origin). It
  is eternal and uncreated. Intrinsic validity (svataḥ prāmāṇya): knowledge is inherently
  valid; its truth does not require confirmation from outside; errors are due to defects
  in the source/cause, known by subsequent sublation.

  - Ordinary testimony: Mīmāṃsā does treat testimony (śabda) as a pramāṇa; human testimony
  can be trusted if the speaker is credible, but the speaker''s defects can defeat.
  Contrastive: Nyāya holds validity is extrinsic, requiring corroboration; Mīmāṃsā
  holds intrinsic.

  - Important nuance: Mīmāṃsā says the Veda is authoritative precisely because there
  is no author whose defects could contaminate; if there were an author (like God),
  there''d be possibility of error; for Mīmāṃsā, the Veda''s authority is not due
  to being true but being a source of dharma not available otherwise? Actually Mīmāṃsā
  holds Vedic sentences are the only means of knowing dharma; they are intrinsically
  valid and there''s no defeating cognition. But for empirical statements, ordinary
  testimony is also pramāṇa.

  - The point about transmission through human teachers not compromising: Mīmāṃsā
  handles this via beginningless transmission; the Veda is learned from teachers but
  not authored by them; the sounds are eternal, and teachers merely manifest the sounds.
  So the "has a maker somewhere in causal history" challenge is apt.

