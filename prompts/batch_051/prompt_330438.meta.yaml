  ---


  I work in legal philosophy, and I keep finding that the practice of oath-taking
  is philosophically stranger than it is usually credited with being. Consider the
  data as I see it. In Greek mythology, the gods bind themselves by swearing on the
  water of the River Styx; the distinctive feature is that the sanction is built into
  the oath itself — a god who perjures such an oath is struck down breathless for
  a year and shut out from the divine feasts and councils for nine, automatically
  and without any enforcement authority. The oath, there, is more than a promise:
  it is an institution with its own guaranteed penalty. Modern legal systems retain
  the ceremony while relocating the sanction. A witness may swear or affirm to tell
  the truth; the testimony is received either way, perjury is punished by the court,
  and the legal force of the proceeding does not turn on whether the witness was sincere
  in swearing. An official who breaks an oath of office has not thereby failed to
  hold office; the acts done under a broken oath remain valid, but the oath-breaker
  incurs a change in status — removal, contempt, loss of the right to appear before
  the court as a credible person, and so on. And yet the ceremony is not treated as
  a dead letter; jurisdictions argue over the form of oaths, litigants dispute whether
  an affirmation suffices, and people sometimes change their behavior at the moment
  of swearing.


  I want to reconstruct what theory of the binding force of oaths this patchwork of
  practices presupposes. Specifically: Does the practice treat the oath as adding
  normative force to the underlying promise, or merely as a costly signal, or as an
  instrument that harnesses reputational and legal sanctions? Does the Greek Styx
  case represent the pure paradigm the rest of the practice is a secularized descendant
  of, or a fundamentally different institution? What does the modern provision for
  secular affirmation rather than swearing commit the practice to about where the
  oath''s force comes from — does it concede that the invocation of a sacred witness
  was never doing the work, or does it show that the legal practice knows the sacred
  witness is dispensable while the speech-act itself is not? I am after what the practice
  strictly presupposes, as opposed to what it merely fits well or is compatible with,
  and I would like to know where the practice is genuinely underdetermined among rival
  accounts and what a practice built squarely on each candidate theory would have
  to look like.


  ---


