  "I''ve been working on the question of why oaths bind, and I keep coming back to
  the way actual practices of oath-taking treat the source of that bindingness. Consider
  the contrast. In the Greek mythological paradigm, the gods swear their most solemn
  oaths by the River Styx; the oath is said to differ from any ordinary promise because
  violation carries an automatic penalty — the perjured god lies breathless for a
  year and is banished from the divine assemblies for nine — a penalty no one enforces
  because it simply follows. In the modern courtroom, by contrast, a witness swears
  or affirms to tell the truth before giving testimony; the ceremony is public, the
  penalty for perjury is imposed by the court, and the testimony carries the same
  legal force whether the witness was sincere in the swearing or went through it cynically.
  Oaths of office and naturalization oaths sit somewhere between: the official act
  is valid even if the oath is later broken, but the violation changes the oath-taker''s
  status. I''m trying to articulate what theory of the binding force of oaths this
  whole practice presupposes — not which theory is correct, but which implicit theory
  the practice is answerable to. Does the practice treat the oath as adding something
  to the underlying promise, and if so, is that addition a supernatural sanction,
  a conventional status-change, a self-binding act, or a signal of sincerity? Does
  the modern possibility of secular affirmation rather than swearing show that the
  practice is actually committed to a deflationary account, on which the ceremony
