  of model checking (CTL, LTL), models are Kripke structures with initial states designated:
  a Kripke structure is (S, I, R, L) or (S, S0, R, L). CTL/LTL semantics often defined
  over paths starting in initial states. So in model checking, designated initial
  states exist, but the evaluation of a state formula is still local to a state; the
  model checker often checks "for all initial states" or "exists initial state." So
  there is a subtle disanalogy: modal logic validity vs model checking specification.
