  ---


  I''m a software engineer with no formal background in philosophy, and I keep coming
  back to an argument at work that seems to depend on how far one analogy can be pushed.
  I''d like an audit of that analogy rather than project-management advice.


  Here is the situation. Nine months ago our team began migrating a legacy payments
  service onto a maintained open-source framework. The original estimate was three
  months. Every month we hold a go/no-go review, and at every review, finishing the
  migration is estimated to take another four to six weeks, while rolling back to
  the legacy system is estimated to take eight to ten weeks, because we have already
  deleted compatibility layers, changed configuration, and rebuilt runbooks around
  the new system. So at each checkpoint, continuing looks cheaper than reverting,
  and we continue. But total spend has now passed any value we can credibly attach
  to the completed migration; the completion date keeps receding; and each milestone
  keeps surfacing new integration problems. I have defended each individual go decision
  as rational on the evidence available at that checkpoint.


  My colleague says the project is now a dollar auction. His model, as I understand
  it, runs as follows. An auctioneer offers a one-dollar bill to the highest bidder,
  with the rule that the second-highest bidder must also pay their final bid but receives
  nothing. Two bidders raise each other in small increments. Once both have sunk money,
  the underbidder faces a choice between losing that sunk amount for nothing, or bidding
  one more increment to keep alive a chance of winning while capping the loss. Each
  bid is therefore locally rational, but the process drives the bids well past the
  value of the prize. His conclusion is that our monthly go decisions are rational
  in the same narrow sense, and that this is exactly why we are in a position where
  every available continuation of the project is bad.


  Audit this analogy, not the facts of our project. Please give me (1) an explicit
  mapping between the auction''s elements and our situation—the auctioneer, the dollar
  bill, the two bidders, the fixed increments, the rule that the loser pays, and the
  moment bids pass the prize''s value; (2) where that mapping breaks, separating disanalogies
  that matter for the intended conclusion from ones that don''t; (3) which features
  the auction quietly imports—fixed prize value, certain costs, no new information,
  a rival bidder, inability to precommit, costs fully fungible—and whether each holds
  in an engineering setting; and (4) a judgment on whether the conclusion survives
  once those disanalogies are on the table, or whether the software case has features
  such as new information at each checkpoint, reusable components, genuine rollback
  costs, option value, and organizational incentives that make continued investment
  fully rational past the naive break-even point. If the dollar auction is the wrong
  model for our case, say what a better analogy would be, and also say where the dollar
  auction might actually be more apt than my colleague has argued.


  ---


