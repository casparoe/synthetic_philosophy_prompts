  Consider a game a fair coin is tossed until it comes up heads. If the first heads
  is on toss n, you receive... [payoff formula]. So if it lands heads immediately
  you win $2, if it''s on the second toss you lose $2, third toss win $8/3, fourth
  lose $4, and so on. The expected payoff, summed in the order of the tosses, is 1
  - 1/2 + 1/3 - 1/4 + ... which converges to ln 2. But the series converges only conditionally:
  the positive terms by themselves sum to infinity and the negative terms sum to minus
  infinity. By rearranging the same payoffs you can get any real number, or make it
