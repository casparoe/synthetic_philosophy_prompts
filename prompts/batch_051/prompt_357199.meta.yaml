  R relate a and b; posits a further relation; regress; concludes relations can''t
  do the unifying work; monist conclusion.

  - Subtle mistake 1: Confines Bradley''s regress to the unity of the proposition,
  or treats it as a problem solely about propositions. Actually Bradley''s argument
  is general about relations in reality, and the unity of the proposition is a special
  case considered by Russell/early analytic; Bradley''s own target is relations in
  any realm, including the proposition if propositions are relational complexes but
  he doesn''t frame it as a problem about truth-bearing.

  - Subtle mistake 2: Says the regress is vicious because it is infinite, so Bradley
  is forced to deny relations exist. That overstates: Bradley does deny relations
  have ultimate reality, but the mere infinity isn''t automatically vicious; and a
  common response is to stop the regress with a non-relational tie. The student might
