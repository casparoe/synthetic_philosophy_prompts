  Let me nail the philosophical content accurately.


  Bradley''s regress: In F.H. Bradley''s "Appearance and Reality" (1893), he argues
  that relations between terms lead to an infinite regress. If a relation R relates
  a and b, then for R to relate a and b, a must stand in some further relation to
  R, and R in some further relation to b, etc. More precisely: suppose R relates a
  and b. Then there must be something that makes it the case that R relates them —
  the relation of instantiation I1 holding between a, R, b. But then I1 must itself
  be related to a, R, b, requiring I2, ad infinitum. Bradley thinks this shows relation-based
  accounts fail to account for unity; his own conclusion is monistic (relations are
  appearances, reality is a seamless whole of internal relations).


  The problem of the unity of the proposition: For a proposition like "a is F", if
  a and F are just a list of constituents, what unifies them into a proposition (truth-evaluable)
  rather than a mere aggregate? Russell and Moore grappled; Frege''s function/argument
  (saturated/unsaturated) solution; Russell''s later multiple relation theory; etc.


  Common conflation: Bradley''s regress (about relations between objects, and the
  relation needing to relate) and the unity of the proposition (about combining senses/constituents
  into a truth-bearing whole) are distinct but analogous. Also the "instantiation
  regress" vs. "regress is benign" — Armstrong holds instantiation is a "non-relational
  tie" not a relation, stopping the regress; some (e.g., Vallicella) argue a regress
  can be benign/infinite without being vicious.


