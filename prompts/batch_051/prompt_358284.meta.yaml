  Potential prompt:


  I’ve been trying to get my household budget under control, and a friend keeps telling
  me I have a moral duty to be frugal, not just a personal preference. Another friend
  argues frugality is only instrumentally valuable insofar as it frees up resources
  to do more good, so one should promote frugality (or just efficient allocation)
  rather than practice it for its own sake. I realized I don’t have a clear statement
  of what a theory of frugality’s normative significance is supposed to explain. I
  came across a passage in Benjamin Franklin’s The Way to Wealth where Father Abraham
  tells a crowd that small daily expenses—things like a penny spent unnecessarily—can
  gradually sink a household, and that people who are apparently prosperous may still
  be ruined by such leaks. The passage seems to treat frugality as a kind of personal
  discipline, but it also appeals to consequences. Before I decide whether Franklin
  is right, I need the standard of evaluation.


  You are a professional moral philosopher. I’d like you to set out the desiderata
  that any adequate theory of the value or duty of frugality must meet. The core question
  I want the list to answer is: what would a theory have to get right—what cases must
  it handle, what distinctions can’t it collapse—before it can correctly say whether
  being frugal yourself is a duty, whether promoting frugality in others is the real
  requirement, or whether frugality is merely one strategy among others? Please include:

  - the boundary cases that distinguish frugality from nearby things like miserliness,
  asceticism, efficiency, self-denial, and sustainability;

  - the distinction between an agent’s own frugality and the social promotion of frugality,
  and whether a theory must preserve that distinction;

  - the empirical or economic facts a theory cannot contradict (for example, the paradox
  of thrift, if it is one);

  - the kind of cases that would expose whether a theory has collapsed a deontological
  reading into a consequentialist one or vice versa.

  For each requirement, give the motivating case or consideration and say whether
  it is negotiable and why. End by identifying the one requirement that does the most
  to separate the viable theories from the popular but inadequate ones. A table is
  fine.


