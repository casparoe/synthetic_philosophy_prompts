  Let me think about a strong set for introspection:

  - (a) We have privileged access to our current conscious states: I can know that
  I''m in pain, or that I seem to see red, without evidence.

  - (b) Our access to our own mental causes (why we did things) is unreliable: lots
  of psychology shows we confabulate plausible-sounding reasons.

  - (c) Introspection, when carefully done, is more like perception than like inference
  — it''s a direct, non-interpretive awareness of already conscious contents.

  - (d) Mental states are transparent to their objects: when I introspect whether
  I believe P, I usually just consider whether P is true (transparency of belief).

  - (e) There are no "unconscious" mental states that introspection can reveal; the
  idea that introspection reveals hidden motives is a myth.


