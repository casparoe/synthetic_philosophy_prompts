  What''s the accurate picture?


  - Timothy Williamson (Knowledge and Its Limits, 2000) argues against "luminosity":
  a condition C is luminous just in case, for every case α, if C obtains in α then
  one is in a position to know that C obtains in α.

  - His anti-luminosity argument is a sorites-ish argument. Example: feeling cold
  at dawn. Suppose one feels cold at dawn and gradually warms up, with a series of
  times t0...tn such that at t0 one is cold and at tn one is warm, and adjacent times
  are only marginally different. If feeling cold is luminous, then whenever one feels
  cold one is in a position to know one feels cold. But given reliability/margin considerations:
  if one is in a position to know one feels cold at ti, then one feels cold at ti+1
  (otherwise one couldn''t safely/reliably know at ti when it''s that close). Iterating
  would force that one feels cold at tn, contradiction. So feeling cold is not luminous.
  Generalizes: no non-trivial condition is luminous. Actually the argument purports
  to show no interesting/non-trivial condition is luminous; so luminosity fails for
  conditions that can obtain and then gradually change context.

  - Important: the argument shows one is not always in a position to know; it does
  not show you can never know you feel cold. At many times you can know; the point
  is there''s no condition such that whenever it obtains you''re in a position to
  know it obtains. Also "being in a position to know" is weaker than actually knowing:
  no interfering factors (distraction, failure to attend) block one''s ability.

  - Relation to KK principle: KK says if S knows p, then S is in a position to know
  that S knows p (or knows that she knows p). Some frame KK in terms of being in a
  position to know to avoid actual knowing issues. Anti-luminosity shows that the
