  identified. Two agents can have different priors over the unidentified part; forecasts
  merge because data only pin down identified part; their posterior distributions
  over the full parameter remain different (they just remain at their prior conditional
  on the same identified value). Thus step (2) overgeneralizes: identical/merged predictions
  do not imply identical posterior beliefs about all hypotheses, because some hypotheses
  are observationally equivalent.


