  ---


  I''m drafting a short position paper on the ethics and epistemology of collective
  memory, and I''d like a consistency check on the view I''ve assembled before I build
  an argument on it. My commitments are:


  1. When the question is what in fact happened, the documentary record has authority
  over living memory: it may correct the community''s memory, because belief about
  the past is ultimately answerable to evidence, and the record is the stronger evidence.

  2. Collective memory is not simply defective history. Its work — sustaining identity,
  mourning, political continuity — is legitimate, and it can do that work even when
  it is inaccurate.

  3. The two can and should be separated institutionally. In truth-governed settings
  (school curricula, museums, courts, official inquiries), the record should prevail
  over the memory where they conflict; in commemorative settings (memorial days, monuments,
  rites), the community''s memory may prevail. So a demonstrably partial monument
  may stand, while a textbook carrying the same narrative should be revised.

  4. To this I add an asymmetrical restraint: when the community in question is subordinated,
  and the demand for correction comes from authorities who have historically controlled
  or spoken for that community, outsiders and experts owe deference to the community''s
  own account and should not publicly press the correction against its self-understanding.

  5. The bare falsity of a collective memory does not settle what should be done with
  it. Whether to correct a memory is partly an ethical-political judgment about what
  the correction would do now — whose standing it would change, what it would reopen
  — not a deduction from the record.


