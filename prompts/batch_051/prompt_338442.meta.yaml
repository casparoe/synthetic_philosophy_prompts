  I should be careful not to over-specify the math incorrectly. Russell''s paradox:
  Let R = {x : x ∉ x}. Then R ∈ R iff R ∉ R. The culprit is unrestricted comprehension
  (the axiom schema of naive comprehension), which allows forming a set from any predicate.
  The standard fix: axiomatic set theory (ZFC''s separation axiom restricts comprehension
  to existing sets; the iterative hierarchy). Concepts: membership, extensionality,
  subsets, predicates vs sets, self-membership oddity. The barber version is a popular
  analogy but can mislead by suggesting the issue is self-reference and roles rather
  than membership.


