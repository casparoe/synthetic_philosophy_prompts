  ---


  I''m a programmer, not an academic, but I''ve been turning over an idea and I''d
  like someone to check whether it''s a real structural parallel or just a loose analogy.


  In the prisoner''s dilemma, two rational players each have an incentive to defect
  no matter what the other does, so mutual cooperation feels impossible without trust.
  But I read about a setup where, instead of just choosing a move, each player has
  to submit their strategy as a piece of computer program that can inspect the other
  player''s program before responding. You can then write a program that says, roughly,
  "I cooperate if and only if the other program, when run against mine, would cooperate;
  otherwise I defect." Defection no longer seems to be the only stable outcome, because
  defecting against a program like that just earns you the defection payoff of mutual
  defection, while cooperating earns you mutual cooperation. (I''m stating this informally;
  I don''t know the formal results.)


  Now, that structure looks to me a lot like a legal contract. A contract also makes
  each party''s performance conditional on the other''s: I deliver the goods only
  if you pay, you pay only if I deliver, and an outside enforcer (the court) backs
  the conditional up. The program-based solution seems to get the same result — conditional
  cooperation as a stable equilibrium — without any outside enforcer, just by making
  each player''s decision depend transparently on the other''s decision procedure.


  My question is whether this parallel is deep or superficial. In particular: Is the
  program-based solution genuinely the same structure as a contract with an external
  enforcer, or does it smuggle in some substitute for enforcement (the ability to
  read the other''s program, the inability to lie about one''s own program, perfect
  computation, something else)? What would have to be true of the two cases for the
  legal idea of a binding agreement to be nothing more than a special case of program
  equilibrium? And where does the analogy break — for instance, does the contract
  setup assume the court''s own incentives that the program setup simply sweeps aside?


