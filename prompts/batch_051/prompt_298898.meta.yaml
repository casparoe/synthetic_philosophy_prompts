  pressure and epistemic uncertainty; they can''t run new experiments; they settle
  on "not guilty" not because they''ve established the truth but because reasonable
  doubt remains. That''s more about the burden of proof than convergence to truth.
  Peirce''s method of science aims at true belief, not merely warranted doubt. So
  the film might illustrate something more like fallibilist epistemic norms (don''t
