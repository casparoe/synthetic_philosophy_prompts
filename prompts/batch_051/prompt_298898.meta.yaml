  Draft:


  "I''m putting together a unit on Peirce for a course on philosophical methods, and
  I want to use Sidney Lumet''s film 12 Angry Men as the central text rather than
  as a decorative example. I''d like a committed reading of the film through C. S.
  Peirce''s essay The Fixation of Belief: its four ways of settling opinion — tenacity,
  authority, the a priori method, and the method of science — together with Peirce''s
  view that inquiry is set off by the irritation of doubt and aims at belief constrained
  by something external to any one inquirer, and, where it illuminates things, the
  pragmatic maxim''s idea that a concept''s meaning is exhausted by the conceivable
  practical bearings of its object (here, what a juror would have to do differently
  to treat proof beyond a reasonable doubt as met).


  The tension I keep coming back to is this. The film looks, at first, like a textbook
  Peircean progression. Juror 8 turns a settled guilty verdict back into a live question,
  and much of the ensuing deliberation works the way Peirce''s method of science is
  supposed to: the jury re-enacts the old man''s walk, times the El train, checks
  whether the switchblade was actually as rare as claimed, and reconsiders the woman''s
  eyesight marks as public, testable evidence. At the same time, the deliberation
  is shot through with exactly the things Peirce sets the scientific method against.
  Jurors cling to their votes out of stubbornness, fold under majority pressure, defer
  to a plausible prosecution narrative because it hangs together rather than because
  it has been tested, and change their minds from fatigue, intimidation, or the wish
  to get out of the room. And the final verdict is not really a settled belief in
  innocence; it is a shared refusal to claim a settled belief in guilt. That seems
