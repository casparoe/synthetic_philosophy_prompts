  "A colleague and I have been arguing about how well Sidney Lumet''s film 12 Angry
  Men dramatizes C. S. Peirce''s account of inquiry. I want to use the film next term
  in a philosophy of inquiry course, but I don''t want to reduce it to a textbook
  illustration. I''d like a committed reading of the film through Peirce''s essay
  The Fixation of Belief and its distinction between the ways belief gets fixed: tenacity,
  authority, the a priori method, and the method of science. Here is the tension I
  see. On one hand, the deliberating jury looks like a working picture of the movement
  from the irritation of doubt to a settled belief: one holdout raises doubts, and
  what starts as sheer tenacity and deference to the majority gradually gives way
  to re-enactments and the testing of claims against public evidence, which is exactly
  the kind of external constraint Peirce says only the scientific method respects.
  On the other hand, the film is not an idealized inquiry: jurors change their minds
  for fatigue, intimidation, conformance, and social friction as much as for the force
  of the better test, and the verdict is reached not because the truth has been settled
  but because reasonable doubt has not been removed. I don''t want to wave that away.
  So: what does the film genuinely get right about Peirce''s picture of inquiry, and
  where does it resist or complicate it? Is it most faithful to Peirce if we read
  it as a vindication of the method of science, or as a picture of fallibilism that
  works even though the four methods collapse into each other under real social pressure?
  Or should we say the film shows something Peirce''s account misses about the role
