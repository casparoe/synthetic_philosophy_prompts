  Let''s draft:


  I was at a seminar on Spinoza''s Ethics, and two colleagues fell into a dispute
  about the definition of freedom in Part I, Definition VII. Spinoza writes: "That
  thing is called free, which exists solely by the necessity of its own nature, and
  of which the action is determined by itself alone." The debate went roughly as follows.


  One colleague, a philosopher of action, said the definition is a bait-and-switch:
  Spinoza concedes that human beings are not free in this sense, because our actions
  are determined by external causes, and then spends Part V telling us we can become
  free by understanding necessity. But if the definition is stipulative — if "free"
  just means "self-determined" — then Spinoza is not preserving the ordinary concept
  of freedom; he is replacing it with something else, namely causal independence.
  The real question, he said, is whether a person whose actions are fully caused could
  nonetheless have been able to do otherwise, and Spinoza simply refuses to answer
  that question.


  The other colleague, a Spinoza scholar, replied that this objection assumes exactly
  what Spinoza denies: that freedom requires the ability to do otherwise. On Spinoza''s
  view, an action is free when it follows from the agent''s own nature rather than
  from something external, even though that nature itself is necessitated. The contrast
  is not between determined and undetermined action, but between being the adequate
  cause of one''s own action and being a mere conduit for outside forces. She added
  that the ordinary concept of freedom is confused, and that Spinoza is not trying
  to preserve it but to correct it.


  The first replied that "being the adequate cause of one''s own action" is doing
  all the work, and it is not clear it can distinguish a free act from a compulsive
  one, because a compulsive behaviour can also follow from someone''s own nature —
  for example, an addiction rooted in temperament. The second answered that such a
  behaviour would not count as free in Spinoza''s sense if it arises from inadequate
  ideas, because adequate causation requires acting from reason, not from passion.
  The first retorted that this now imports a normative standard — acting from reason
  — into what looked like a purely causal definition, so the freedom Spinoza describes
  is not a neutral metaphysical property but an ideal one.


  Please adjudicate this exchange point by point. Who is right about each specific
  claim, and are there places where both are talking past each other? In particular,
  does Spinoza''s definition of freedom as self-determination escape the charge of
