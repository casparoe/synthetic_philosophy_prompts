  Let''s draft:


  I''ve been reading Origen''s On First Principles, and one passage has stuck with
  me. In Book IV, when he is laying out his method for interpreting Scripture, he
  argues that the divine Word deliberately planted in the text what he calls stumbling
  blocks and impossibilities—for example, the creation story running through days
  before the sun and moon existed, or a mountain high enough to see all the kingdoms
  of the world. His claim is that these are cues: where the literal sense breaks down
  or becomes absurd, the reader is supposed to look for a spiritual sense instead.
  He doesn''t say the literal sense is always false; he says the Spirit arranged the
  text so that the deeper meaning would not be missed by people too satisfied with
  the surface.


  I want to use that as the lens for analyzing the early-twentieth-century fundamentalist-modernist
  controversy, especially the Scopes trial and the way the fundamentalist side treated
  literal interpretation as a badge of orthodoxy. If Origen is right that Scripture
  itself contains those cues, then what exactly was the fundamentalist defense of
  literal reading doing? Was it defending the text, or overriding the text''s own
  instructions about how it wants to be read? And is Origen''s "literal sense" even
  the same thing as the fundamentalists'' "literal interpretation"? They might not
  be talking about the same level of reading at all.


  Then I''d like you to turn it around: what does the Scopes episode and the rise
  of inerrancy show about Origen''s model? Does fundamentalism''s worry—that allegory
  is just a license for the interpreter to make the text mean whatever they want—count
