  ---


  Below is a condensed set of notes for a short essay, provisionally titled "Interventionism
  without Certified Interventions." Please read it and then comment as requested at
  the end.


  The essay targets the familiar circularity worry for James Woodward''s interventionist
  account of causation. On that account, X is a cause of Y with respect to a set of
  variables when there is a possible intervention on X that changes Y (or changes
  its probability distribution), with other variables suitably held fixed. An intervention
  is specified partly in causal terms: the intervention variable must be a cause of
  X, must influence Y only through X rather than by a route that bypasses X, and must
  be independent of other causes of Y. The standard objection is that ''intervention''
  is defined by appeal to ''cause'', so the account is circular.


  The standard reply, which the essay partly endorses, is that the circularity is
  not vicious because Woodward is not offering a reductive definition of causation
  in non-causal terms. But the essay argues this reply is usually stated too defensively.
  The account''s content does not come from first pinning down ''intervention'' and
  then reading ''cause'' off it; it comes from jointly constraining a package of causal
  and intervention claims through invariance and modularity conditions. No element
  of the package needs to be certified in advance.


  The essay develops this point through an analogy with functionalism about mental
  states. A functionalist says that pain is whatever internal state occupies a certain
  causal role; the fact that the role is specified in causal terms does not make functionalism
  empty, because the theory''s content is the entire pattern of counterfactual dependencies,
  not a translation of ''pain'' into non-causal vocabulary. The essay suggests that
  interventionism is best read the same way: as a theory of a structure, not a dictionary
  entry for ''cause''.


  The second half of the essay presses a residual problem. Even if the conceptual
  circularity is harmless, a practical underdetermination problem remains: a causal
  model and a claim about which manipulations count as interventions are only confirmed
  as a package. The essay then floats a robustness-based criterion for certifying
  a manipulation M of X as an intervention with respect to Y, relative to a variable
  set containing other direct causes of Y: M makes X responsive, M''s influence on
  Y disappears when X is held fixed, and the pattern of dependence of Y on X under
  M remains invariant across independent variations in those other causes. The thought
  is that this lets interventionhood and causal structure be certified together, rather
  than requiring prior causal knowledge to certify the manipulation.


  The essay concludes that the circularity worry is fatal only if interventionism
  is expected to be a reductive analysis; on a package-dealing reading, the live question
  is how far robustness and screening-off conditions can substitute for an antecedently
