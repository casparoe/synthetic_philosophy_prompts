  war, then the puzzle is why rational actors don''t strike a bargain (e.g., a jointly
  funded lab, a share of returns, a treaty). The framework should predict races only
  where one of the three mechanisms holds. So we can use Fearon to diagnose the race,
  not abandon it.


  Person B (say, "Marcus"): objects that the analogy fails at the first step: Fearon
  needs war to be costly in a way that creates a bargaining range, but in an AI race
  the prize is plausibly winner-take-all — an AGI monopoly could be decisive, and
  there may be no division of the prize both sides would accept in place of winning.
  If the winner''s payoff dominates, then racing dominates bargaining for each, so
  there''s no puzzle. The framework''s applicability is exactly what''s at issue,
  not its application.


  A replies: winner-take-all is just indivisibility, which Fearon already counts as
  a rationalist explanation; and even if it is winner-take-all, that''s not enough:
  as Fearon noted, indivisible goods can usually be made divisible through side payments
  — share ownership in the leading lab, guaranteed access rights, transfer of compute,
  profit-sharing. If the prize is huge, there''s plenty of surplus to divide; so the
