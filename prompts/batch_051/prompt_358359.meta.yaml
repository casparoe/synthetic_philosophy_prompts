  Fearon''s rationalist explanations for war (from his 1995 article "Rationalist Explanations
  for War"): Because war is costly, there should exist bargains both sides prefer
  to fighting. Rational leaders should reach such bargains. The fact of war must be
  explained by either:

  1. Private information about capabilities/resolve coupled with incentives to misrepresent,
  leading to bargaining failure.

  2. Commitment problems: inability to credibly promise not to exploit shifts in power,
  especially due to changing military capabilities or first-strike advantages, leads
  to preventive war.

  3. Issue indivisibilities: some goods cannot be divided, though Fearon notes these
  are rare and can often be resolved with side payments.


  Also, a key premise: war is costly ex post. In AI race, what''s the analogue of
  "war"? A race: firms/nations pour resources into unsafe or duplicative development,
  cut corners on safety, leading to increased risk of catastrophic outcomes and wasted
  resources. The "bargain" would be a coordinated slowdown, moratorium, or cooperation/deal
  splitting benefits.


