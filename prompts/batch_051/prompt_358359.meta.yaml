  Let''s think formally. Fearon''s central claim: because war is costly ex post, there
  exists some negotiated settlement both sides prefer to fighting. Strictly, this
  requires risk-neutral or risk-averse preferences; if leaders are risk-acceptant,
  they may prefer the gamble of war to any settlement offering the expected value,
  but there may still be settlements offering enough to compensate. But if no settlement
  can match the utility of gambling due to risk preference, then war rational. Fearon
  addresses this: he mostly assumes states are risk-averse or risk-neutral; but actually
  even with risk neutrality, war can be rational if there''s disagreement about relative
