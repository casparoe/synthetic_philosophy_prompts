  I am a high school student writing my first extended essay on the nature of pain,
  and I have gotten myself tangled in an argument that seems to show something absurd.
  I would be grateful for a diagnosis.


  In a unit on the neuroscience of pain, we discussed pain asymbolia: after certain
  brain injuries, patients say they are feeling pain — they can locate it and rate
  its intensity — but they do not find it unpleasant, and they show none of the usual
  wincing or withdrawal. Some describe it as "it hurts, but I don''t mind." From this
  I formed the view that the badness of a pain is not in the pain itself but in the
  sufferer''s reaction to it. But when I wrote the view out as an argument, it seemed
  to prove far too much:


  (1) If the very same painful sensation can occur without being bad for the person
  who has it, then the badness of a pain is not part of the pain itself, but is added
  by the person''s response.

  (2) Pain asymbolia shows that the painful sensation can occur without being bad
  for the person who has it.

  (3) Therefore the badness of a pain is not in the pain itself.

  (4) But the reasoning of (1) is not specific to pain. For anything we might think
  is bad in itself, we can ask whether that thing could occur without the person being
  bothered by it. If we allow the asymbolia case to show that pain is bad only because
  of a response, then we must allow parallel cases to show the same of anything else.

  (5) Now consider the response itself — the dislike, aversion, or distress — that
  is supposed to make pain bad. That response is also a state the person is in. So
  by the very same reasoning, it can be bad only because of some further response,
  and that further response only because of a still further one, and so on.

  (6) So the badness never bottoms out: there is no state that is bad in itself, and
  "that hurts and it matters" reduces to a report about an arbitrary chain of reactions.

  (7) That cannot be right. For one thing, it would make the difference between ordinary
  pain and asymbolic pain a mere difference in the number of reactions, not a difference
  in whether the first pain itself mattered; and it would seem to say there is nothing
  in itself wrong with causing someone the most severe pain, provided we also arrange
  that they do not mind it.


  I want to reject (7), and I find (1) and (2) very hard to give up. But something
  must go. Where does this argument go wrong, and which step would you reject — and
  what does rejecting it cost?


