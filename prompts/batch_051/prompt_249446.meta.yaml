  Draft content:


  "I''m playing with an essay on self-deception and I''d like someone to poke holes
  in the argument before I write it up. Here''s the rough idea.


  The standard puzzle is that self-deception looks impossible: if I deceive myself
  into believing p, I have to both know not-p (to do the deceiving) and believe p
  (to be deceived), and that''s a contradiction in one head at one time. The usual
  moves are either (a) split the mind into parts that can keep secrets from each other,
  or (b) go deflationary and say there''s no intentional deception, just motivated
  bias in how I gather and weigh evidence. I think both leave something out.


  My idea is to reframe self-deception as a two-stage, across-time thing rather than
  a simultaneous state. Stage one: I act as the ''architect'' of my own evidence stream.
  I skip the doctor''s appointment, don''t open the bank statements, avoid the friend
  who would tell me the truth, maybe surround myself with people who confirm the comfortable
  story. Stage two: I form my belief from that now-rigged evidence stream as if it
  were a neutral sample. The deception, if it''s anywhere, is in the relation between
  those two stages.


  But here''s the part I want to push: the two-stage story isn''t enough by itself,
  because I could do both stages and still be aware the whole time that I built the
  stream. That would be more like self-imposed ignorance or wishful thinking, not
  self-deception. So I want to add a condition: the rigging has to be untagged in
  memory. The person has to not attend to, or not retain, the fact that the evidence
  stream is one they rigged. It''s a kind of motivated failure of source memory —
  I remember the evidence but lose the index that says ''this evidence was selected
  by me, for a reason.''


  Then the essay would argue that what''s distinctive about self-deception is not
  contradictory belief but a failure of coordination between a designing self and
  a believing self over time, and in particular a memory/tagging failure that keeps
  the believer from seeing the design as designed. I''d contrast it with Mele-style
  deflationism (which I think is right that there''s no single moment of knowing not-p
  while believing p, but too quiet about why it feels like something was done to you)
  and with Sartrean bad faith (which I think gets the self-aware, project-like quality
  right but makes it sound too voluntary).


  Comments I''d especially want: (1) Is my ''untagged rigging'' condition doing real
  work, or am I just pushing the contradiction from belief into memory? (2) Does the
  account handle the person who ''knew all along'' — the spouse who half-knew about
  the affair but still managed to be shocked? (3) Is the architect/occupant split
  just the homunculus problem again with better branding? (4) Am I actually disagreeing
  with the deflationary view, or just adding stage directions to it? Be blunt about
  which part a referee would reject first."


