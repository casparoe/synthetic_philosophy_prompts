  Self-deception paradox: standard puzzle. If S deceives S into believing p while
  knowing not-p, then S simultaneously believes p and not-p, which is hard to square
  with a unified mind. Accounts:

  - Intentionalist: self-deception is intentional, like other-deception directed at
  oneself (requires partitioning the mind: one subsystem deceives another). Problem:
  how can one intentionally get oneself to believe what one knows is false? Sartre''s
  "bad faith" as project.

  - Non-intentionalist / deflationary (Mele): self-deception arises from motivated
  bias in evidence handling (desire influences belief without an intention to deceive).
  No paradox: the person ends up believing p through biased evidence-gathering, not
  through knowingly believing not-p. The person''s desire that p biases their interpretation
  of evidence; they don''t hold a simultaneous contradictory belief.

  - Twisted self-deception: believing the worse (e.g., jealousy) not the better.

  - Tension: deflationary accounts may fail to capture the "self" in self-deception
  — it collapses into ordinary motivated reasoning.


