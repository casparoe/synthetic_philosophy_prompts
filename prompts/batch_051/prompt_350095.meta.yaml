  large-beak allele goes from 20% to 75%. Verdict: large-beaked finches were fitter;
  the selectionist explanation is empirical.


  Case 2. A point mutation in a plant''s noncoding DNA has no detectable effect; in
  three replicate populations its frequency changes only randomly. Verdict: no fitness
  difference.


