  In-the-weeds objections:


  1. Reverse causality / endogeneity: high trust may be the product of historically
  effective institutions, not a cause. Or trust and institutions coevolve; you can''t
  read off "rationality" from equilibrium. Phrased by a social capital person.


  2. Selection/measurement: survey questions about "most people can be trusted" measure
  generalized trust, not trust in government; Scandinavian trust in institutions might
  reflect satisfaction with service delivery rather than a considered attitude. Also
  cross-country survey responses may be colored by response styles (acquiescence).
  Maybe too niche but good.


  3. The homogeneity objection: Nordic trust is banked on small, ethnically homogeneous
  populations with shared norms; it''s not a transferable institutional achievement.
  As diversity rises, does the rationality claim collapse? This is sensitive — handle
  carefully. Phrase as "the mechanisms may depend on being able to identify with the
  beneficiaries."


  4. The accountability objection: suspicion is a public good; it''s what keeps governments
  honest. If everyone trusted, the equilibrium would unravel — trust is only rational
  because someone is watching. The rational attitude may be "trust but verify," and
  American suspicion is a costly but necessary monitoring device.


  5. The exploitation objection: trust in government as a "good bet" assumes the state
  can''t defect cheaply. But majoritarian institutions can redirect universal programs.
  The US is more heterogeneous and its political institutions are deliberately fragmented
  (veto points), so distrust is rational.


  6. The "low-cost of being wrong" objection? If a Swede is betrayed, the welfare
  state cushions; if an American is betrayed by e.g., the IRS or police, the costs
  are catastrophic. So suspicion in America is more rational because stakes are higher
  and protections thinner.


  7. The asymmetry / which direction to update objection: rational trust requires
  updating on evidence; American suspicion may be a learned response to actual scandals.
  But both sides could be in a self-fulfilling equilibrium: high-trust societies tolerate
  fewer... Actually.


