  about the future. They won''t give you evidence for it, and they won''t treat it
  as a hypothesis that could be wrong. Instead they''ll look at you like you''ve asked
  something outside the game: ''if you don''t grant that, then there''s no conversation
  to have.'' What''s odd is that the very same person can admit the background thing
  is occasionally false in particular cases — memories do fail, the future does surprise
  us — without that admission counting against their confidence in it at all. It''s
  as if the belief is doing a structural job rather than an evidential one: it''s
  load-bearing for the rest of their inquiry, and so it''s exempt from the standards
  that apply to the things built on top of it.


