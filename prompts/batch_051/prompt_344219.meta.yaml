  "I am preparing an essay for a political theory seminar on the old dispute about
  whether commercial society improves or degrades human character. The optimist case,
  often associated with Montesquieu, is that trade softens manners, teaches people
  to see their interests as bound up with others'', and discourages zero-sum cruelty.
  The pessimist case is harder for me to assess. I have been working through Book
  V of Adam Smith''s An Inquiry into the Nature and Causes of the Wealth of Nations,
  where he considers the effects of the division of labour on the labouring poor.
  His worry, as I understand it, is this: a person whose entire working life consists
  in one or two simple, repetitive operations has little occasion to exercise understanding,
  deliberation, or judgement; the result is not merely ignorance but a kind of active
  corruption of the character, a loss of the ability to take part in rational conversation
  or to form sober judgements about ordinary public and private duties. He contrasts
  this with the mental agility of the primitive generalist, who must constantly improvise.
  He concedes that commercial societies are materially better off and perhaps superior
  at producing some kinds of knowledge, but he seems to think that the mass of people
  pays a real moral and civic price. I would like the essay to use this Smith passage
  as a test case. Specifically: (1) Is Smith''s mechanism—repetitive work dulling
  the understanding and thereby damaging character—best read as a claim about human
  nature generally, or only about the particular conditions of early industrial labour?
  (2) Does the ''doux commerce'' tradition have the resources to answer Smith on his
  own terms, or does it merely change the subject to peace and prosperity? (3) Once
  we distinguish the kinds of character involved—patience, trustworthiness, prudence,
  curiosity, independence of judgement, public spirit—is there a defensible overall
  verdict on whether markets corrupt or civilise? Please do not resolve the question
  by saying ''both sides are partly right.'' I expect you to reach a definite, argued
  conclusion, with care to address the strongest form of the opposite view. Write
  in British English. End the essay with a final line beginning ''Verdict:'' followed
  by a short phrase summarising your conclusion."


