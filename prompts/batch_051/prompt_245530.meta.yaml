  The dogmatism paradox (originally from Saul Kripke, "Two Paradoxes of Knowledge"
  perhaps; also discussed by Gilbert Harman in "Thought"). The paradox: Suppose S
  knows that p. Let q be any proposition that would be evidence against p (or any
  evidence that if true would undermine p). Since S knows p, and knows that p entails
  not-q (if q is incompatible with p), then S knows not-q. So if S encounters what
  appears to be evidence q for not-p, S can reason: since I know p, and p entails
  not-q, I know that q is false; therefore any apparent evidence for q is misleading.
  Thus S can rationally dismiss the counterevidence without examining it, just on
  the basis of knowing p. But this seems wrong: you shouldn''t be able to ignore counterevidence
  dogmatically. That''s the paradox.


