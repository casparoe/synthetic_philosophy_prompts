  I have been calling the two ideals ''exhaustive'' and ''overriding'' sainthood.
  An exhaustive saint treats every choice—including what to eat, what to read, whom
  to invite—as a moral choice that falls under the same maximizing standard as the
  large choices. An overriding saint treats only some choices as genuinely moral,
  but holds that where a choice is moral, moral considerations defeat all others;
  the rest of the time, they simply live, and may cook, joke, paint, or pursue friendships
  without asking whether those activities are morally optimal.


  My central claim is that most objections to moral sainthood I know—that the saint
  would be boring, humorless, single-minded, unable to enjoy anything except the good,
  and so on—apply only to the exhaustive saint. The overriding saint could, in principle,
  be a wonderful dinner companion precisely because they regard the choice of what
  to cook as not a moral question at all. So I am inclined to conclude that the critics
  have been right about one ideal and wrong about the other: maximal moral goodness
  would be a bad ideal if it meant exhaustiveness, but is not shown undesirable if
  it means overridingness.


