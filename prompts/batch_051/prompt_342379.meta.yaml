  I teach political philosophy, and about three years ago I made the mistake of saying
  the phrase tragedy of the commons one too many times at a department party, and
  now I''m the token academic on our town''s Shellfish Advisory Committee. We manage
  a small municipal clam flat, maybe eight acres of bay bottom, and every spring we
