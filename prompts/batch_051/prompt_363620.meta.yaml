  Background I know:

  - In philosophy of biology, there''s a debate about whether "survival of the fittest"
  makes natural selection tautological. If fitness is defined as actual reproductive
  success (differential reproduction), then "the fittest survive/reproduce more" seems
  definitionally true and cannot explain why they do. The standard response (Brandon
  1978; Mills & Beatty 1979; Sober 1984) is the propensity interpretation: fitness
  isn''t actual success but an organism''s (or genotype''s) expected/probabilistic
  propensity to survive and reproduce in its environment — its expected number of
  offspring, or a probability distribution over possible reproductive outputs. Then
  natural selection claims are empirical because the expected success need not equal
  actual success; drift can make the fitter type go extinct.

  - The propensity interpretation treats fitness as a probabilistic disposition: the
  same genotype can have a distribution of possible numbers of offspring in different
  environments or due to chance. Fitness is a property of organisms/types relative
  to an environment.

