  — if fitness is defined as whatever makes actual differential reproduction likely
  in the actual environment, then how to measure it without collapsing into actual
  outcomes? Also, how do you handle the "expected value" over what reference class?
  Propensity interpretation faces the problem that propensities are hard to ground;
