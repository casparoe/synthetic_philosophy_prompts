  ¬K(p). So K(p) ∧ ¬K(p), contradiction. Therefore it''s impossible for this p, given
  no one ever knows it. More precisely, under the assumption that p is unknown, the
  conjunct p ∧ ¬K(p) is true but unknowable, contrary to the knowability principle.
  Therefore if all truths are knowable, there are no unknown truths; hence all truths
  are known (omniscience).


