  (a) There are genuine dirty hands cases: a political leader can sometimes be morally
  required to do something that is itself morally wrong — e.g., authorizing a deceptive
  operation or a targeted killing to avert a much greater harm.

  (b) Morality is not simply consequentialist: the wrongness of an act does not disappear
  merely because the act produces the best available outcome; something is lost/marred
  even when the act is all-things-considered right or required.

  (c) It is wrong for a leader to treat "dirty hands" as a standing excuse or to become
  calloused: a leader who repeatedly orders such acts without genuine reluctance and
  remorse is blameworthy, even if each act, taken alone, was the best available option.

  (d) The public cannot, and should not, be told the full truth about every justified
  dirty-handed act; some such acts must be concealed or misrepresented, sometimes
  for years, to preserve their effects or public confidence.

  (e) Democracy requires that citizens be able to hold leaders accountable for wrongdoing,
  not merely for ineffectiveness or bad outcomes; without the ability to identify
  and sanction wrongdoing, accountability is hollow.

  (f) Though dirty-handed acts are morally wrong, the leader who performs them should
  not, in a well-ordered system, suffer the same legal punishment as a private citizen
  who did the same thing, because the leader acted under the peculiar burdens of office
  and for public reasons rather than private gain.

  (g) A leader who has done wrong in the course of doing right ought eventually to
  acknowledge it and seek reconciliation, amends, or at least truth-telling — but
  (d) says can''t tell the truth. Tension between (d) and (g)/(e).


