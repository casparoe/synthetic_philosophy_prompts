  Domain: problem of dirty hands in politics. Key ideas:

  - Dirty hands: in politics, sometimes the right thing to do requires doing what
  is morally wrong (e.g., ordering torture to prevent a bombing, lying to the public,
  breaking promises). The agent gets "dirty hands": does wrong but is right to do
  it.

  - Michael Walzer''s "Political Action: The Problem of Dirty Hands" (1973) — politician
  must sometimes do wrong to govern well; the politician suffers guilt/remorse for
  doing wrong even though it was right. Machiavelli''s "learn how not to be good."

  - Contrast with utilitarianism (no genuine dirty hands if act maximizes good; any
  scruples are squeamishness) and deontology/absolutism (no dirty hands because wrong
  can''t be done).

  - Some think dirty hands are conceptually possible but require remorse/compensatory
  action; others think they''re incoherent or a rationalization.

  - "Moral remainders": even justified wrongdoing leaves a residue—guilt, apology,
  reparation (Williams, "Ethical Consistency" maybe).

  - Politics as a role with special permissions ("role morality"): politicians have
  permissions ordinary morality denies, but also obligations.


