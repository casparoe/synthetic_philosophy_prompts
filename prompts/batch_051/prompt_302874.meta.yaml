  Schelling''s core ideas:

  - Credible commitment: a threat is only effective if the target believes you will
  carry it out if challenged; because carrying it out may be costly or irrational
  ex post, credibility is a central problem.

  - Brinkmanship: not a sudden leap to war, but the competitive manipulation of shared
  risk of disaster, where each side raises the probability of catastrophe in a way
  it doesn''t fully control.

  - Threats that leave something to chance: a threat can be credible even if the threatened
  action is irrational, by making the action partly outside the threatener''s deliberate
  control — increasing the probability of it happening automatically (e.g., tripwires,
  delegation to local commanders, pre-authorization, ambiguous rules of engagement,
  automated response postures). This converts "I will surely punish" into "I may punish,
  and no one can be sure what will happen."

  - Difference between a threat and a warning: a threat says "if you do X, I will
  do Y against my own interest to hurt you," whereas a warning tells someone about
  consequences that would happen anyway (out of your own interest or nature).

  - Tacit bargaining and focal points: in limited conflict, coordination around salient
  thresholds ("no gas," "no cities") even without communication.

  - The role of communication and "cheap talk": talk alone can be meaningful if it
  changes what the speaker''s audience knows about future actions, or if costs attach
  to being seen bluffing.

  - The credibility of "irrational" behavior: having a reputation for madness/anger
  can be an asset.

  - Distinguishing signals: actions that are costly to take and hard to fake carry
  more information.


  The procedure for an analyst reviewing adversary signals could include:

  - Separate capability from intent, but Schelling would emphasize credibility = capabilities
  + interests + costs to the adversary of following through + the adversary''s audience
  costs.

  - Step 1: Classify the signal: is it a communication (declaratory threat) or an
  observable action? Is it costless talk or costly signal?

  - Step 2: For declaratory threats: identify the demanded change and the threatened
  response; ask whether the threatened response would serve the adversary''s interests
  ex post (if yes, likely a warning; if no, a threat requiring credibility).

  - Step 3: Assess credibility: Does the adversary have the capability to carry it
  out? Is the act contrary to its interest? If contrary, has the adversary pre-committed
  itself in a way that raises the cost of backing down (audience costs, public declarations,
  treaty changes, forces moved into a position that makes automatic engagement likely)?
  Is there evidence of "leaving something to chance" mechanisms (delegation, alert
  status, dispersed launch authority, tripwires, ambiguous rules of engagement)?

  - Step 4: Assess brinksmanship: is the adversary creating or increasing shared risk
  of escalation, and does it seem to retain control over the size and timing, or deliberately
  reduced control? Does the move shift the immediate decision away from the adversary''s
  top leadership (in which case it may be deliberately introducing autonomous risk)?

  - Step 5: Determine response posture: if credible and specific, escalate to leadership
  with a menu of options (concede, counter-commit, demonstrate capability, reveal
  own red lines); if not credible, monitor and possibly convey that it isn''t believed;
  if brinksmanship, do not simply mirror it — calibrate risk increments and communicate
  own points.

  - Stopping rules: stop with "no escalation response" if signal fails early tests;
  stop with "immediate escalation to leadership" if capability-plus-pre-commitment
  and the demand touches vital interests; hand to human/political decision when the
  question becomes "which risks are acceptable" (values).

  - Mark where judgment is irreducible: reading intentions, estimating the adversary''s
  own perception of its reputation, whether a small probability of nuclear catastrophe
  is acceptable.


