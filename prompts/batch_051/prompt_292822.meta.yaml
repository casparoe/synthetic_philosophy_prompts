  Core concepts in responsibility gap:

  - Moral responsibility requires: causal involvement, control (or reasonable foreseeability,
  authority), knowledge/awareness of risk, and possibly intent or negligence. Also
  "retribution gap": nobody deserves blame/punishment.

  - In autonomous systems: learning systems that are opaque; designers can''t predict
  specific behavior; operators can''t meaningfully control moment-to-moment decisions;
  the system itself is not a moral agent. Harm occurs but no human satisfies all conditions
  of culpability. Hence a "gap."

  - The case: Uber''s system design (disabling AEB, classification logic), Uber''s
  safety culture, safety driver''s inattention, maybe Volvo (manufacturer), regulators
  (AZ''s permissive approach), pedestrian herself (jaywalking) — candidates.

  - Where theory explains: safety driver was a "moral crumple zone" (Madeleine Elish''s
  concept) — a human given nominal responsibility to absorb blame though lacking meaningful
  control/information; automation bias and vigilance decrement make sustained monitoring
  unrealistic, so her "failure" feels less culpable than premeditated neglect; designers
  made choices (disable AEB, poor object classification) standardly distributed across
  teams so no single engineer had full control; corporation may be culpable at the
  organizational level but cannot be retributively punished in the same way.

  - Where theory strains: it assumes a binary "human vs machine" but the Uber car
  was a hybrid human-machine system with a designated fallback human; the causal chain
  includes concrete, identifiable negligent acts (a company chose to disable AEB;
  an operator chose to watch a show) — maybe the gap isn''t a gap in responsibility
  but a difficulty in allocating it across many hands; the theory may confuse "not
  yet assigned" with "not assignable." Also responsibility gap is often about *retributive*
  responsibility; civil/regulatory accountability was not gapped (NTSB, lawsuits,
  Uber sold unit, etc.). The theory is thin on organizational responsibility, on forward-looking
  responsibility (prevention, regulation), and on distributed culpability (proportionate
  shares). Also, the system wasn''t fully autonomous in the relevant sense — it had
  a human fallback, undermining premise.

  - What episode shows about theory: it may be a real-world confirming instance? Or
  shows that apparently clean "gaps" are often produced by deliberate human decisions
  (disabling safety systems) and institution-level choices, so the "gap" is partly
  manufactured; suggests the right framework isn''t a gap but a diffusion/reallocation
  problem. Also the "moral crumple zone" is empirically displayed: safety driver bears
  blame disproportionately.


