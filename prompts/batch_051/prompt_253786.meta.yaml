  "I am teaching Boethius''s Consolation of Philosophy this term and want to use Kurt
  Vonnegut''s Slaughterhouse-Five as a companion text. I am interested in the parallel
  between Boethius''s account of divine eternity and the Tralfamadorian view that
  all moments of time exist simultaneously. For Boethius, God does not foresee the
  future from within time; rather, everything that is past, present, or future to
  us stands before an eternal divine present all at once. Boethius''s Lady Philosophy
  insists that this does not make future events simply necessary or destroy free choice:
  God''s seeing something as present is compatible with its being something we freely
  do, and the necessity attaching to ''what is known to be so'' is only conditional,
  not absolute. Vonnegut''s aliens appear to teach something superficially similar
  — all moments exist, nothing can be changed — but they draw a posture of resignation
  from it, and Billy Pilgrim''s passivity, including in the face of his own death,
  seems to follow. I would like a careful reading of the novel through Boethius''s
  distinction. Where does the novel genuinely dramatize a Boethian standpoint — for
