  Refined draft:


  "I am teaching Boethius''s Consolation of Philosophy this term and plan to teach
  Kurt Vonnegut''s Slaughterhouse-Five alongside it, because the novel seems to run
  a kind of thought-experiment on the doctrine of divine eternity. In the closing
  sections of the Consolation, Lady Philosophy argues that God does not look forward
  through time at a not-yet-existing future; all times stand before the divine mind
  in an eternal present. She insists that this removes the threat to freedom. Whatever
  necessity attaches to a future event when it is known is merely conditional — the
  necessity that what is seen to be the case is the case — and not the simple necessity
  of a thing that is fated or forced. Vonnegut''s Tralfamadorians appear to hold a
  superficially similar metaphysics: all moments exist at once, and human talk of
  free will is, on their view, an Earthling illusion. But they draw from this a posture
  of pure resignation, and Billy Pilgrim seems to adopt it, down to his calm foreknowledge
  of his own death.


  I want a careful reading of the novel through Boethius''s distinction. Where does
  the novel genuinely dramatize a Boethian insight — perhaps the consolation of seeing
  one''s life as already whole rather than a strung-out future one must anxiously
  control — and where does it instead collapse eternity into fatalism or mere acceptance?
  Does Billy gain the consolation Lady Philosophy promises while quietly surrendering
  the freedom she insists is preserved, and does the novel notice the difference?
