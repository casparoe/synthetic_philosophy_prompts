  In Blackstone''s Introduction to his Commentaries, he allows that a judge may depart
  from a statute''s literal text when the literal reading would be absurd. Suppose
  someone formalizes Blackstone''s concession as follows: If the literal application
  of a legal text would be absurd, then the text is not binding as written; rather,
  its binding content is whatever non-absurd rule best fits the text and the law''s
  purposes. Then argument:


  (1) Any departure from literal text must be justified by some aim, e.g., avoiding
  absurdity.

  (2) But if a judge may depart from literal text to avoid absurdity, then what counts
  as absurd depends on the judge''s view of what is reasonable.

  (3) If it depends on the judge''s view of what is reasonable, then the judge may
  depart whenever she believes the literal result is unreasonable.

  (4) So the doctrine that allows departure only for absurd results collapses into
  a doctrine that allows departure for any result the judge regards as unreasonable.

  (5) But allowing departure for any result the judge regards as unreasonable is just
  equitable rewriting of statutes.

  (6) Therefore Blackstone''s absurdity principle, if accepted, licenses judges to
  rewrite statutes whenever they disagree with them.


