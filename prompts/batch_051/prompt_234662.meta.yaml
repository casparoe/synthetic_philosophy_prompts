  to look like reasoning; we have no evidence it corresponds to the causal process
  that produced the answer. A model can be trained (or prompted) to give a plausible-sounding
  justification for whatever answer it already settled on, so treating the self-report
  as an explanation is like trusting someone''s after-the-fact confabulation.


  Move 2 (B, say "Sam"): Replied that Dana''s argument overgeneralizes: we often have
  to rely on self-reports in humans, and we test them for internal consistency and
  predictive value. If the intermediate steps explicitly say things like "the policy
  requires X, this case satisfies Y, so refund," and those steps align with the policy,
  that''s evidence the model''s inference followed the policy, much as a human''s
  written work log is evidence about how they decided — not conclusive, but better
  than nothing.


