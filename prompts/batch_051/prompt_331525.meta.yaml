  Domain: Money pumps and diachronic rationality. The idea: Someone''s preferences
  change over time in a predictable way (e.g., present bias / hyperbolic discounting,
  or a cyclic preference set). Money pump arguments say if your preferences are intransitive,
  you can be exploited by a series of trades, each of which you accept, ending worse
  off with no change. Diachronic rationality: does being rational require you to have
  stable preferences over time? There''s debate: is a diachronic Dutch book/money
  pump a genuine sign of irrationality? Some philosophers (e.g., Skyrms, Christensen,
  Hedden?) argue; there''s the idea that at each time, each choice is rational given
  preferences at that time, but the sequence is problematic — maybe the rational agent
  should adopt resolute choice (McClennen?) or be sophisticated and avoid the pump.
  Money pumps also with intransitive preferences (synchronic money pump): prefer A>B,
  B>C, C>A. Then trader gives you B for A plus small fee, then C for B plus fee, then
  A for C plus fee; you''re back with A but paid three fees. Each trade is individually
  rational given your preferences. The question: are intransitive preferences irrational?


