  Let me think carefully about accuracy of the philosophical content.


  Dispositions: A disposition is like fragility, solubility, irascibility. A classic
  simple analysis: x is disposed to M in circumstances C iff if x were in C, x would
  M. Fink: something alters the disposition before the stimulus. E.g., a fragile glass
  with a protective guardian who would make it non-fragile if struck — or more standard:
  a "fink" is a disposition that is lost when the stimulus condition obtains. Lewis''s
  finkish dispositions: a sorcerer protects a fragile glass; if struck, he casts a
  spell to make it not fragile, so the glass doesn''t break, yet intuitively it''s
  fragile. Mask: the disposition is present but its manifestation is prevented by
  something else (masked). E.g., a fragile glass packed in styrofoam: dropped, doesn''t
  break, but still fragile. Bird''s antidote: a poison''s disposition to kill is masked
  by an antidote. Mimic: an object lacks a disposition but would display the manifestation
  due to external factors, e.g., a non-fragile object that would break because a demon
  smashes it, or a "finkish lack". These are the standard distinctions: finks (remove
  the disposition), antidotes (interfere with manifestation), mimicks (fake the manifestation).


