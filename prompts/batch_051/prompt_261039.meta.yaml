  "I am a novelist, and something about my craft has begun to look to me like the
  structure of play. When I build a fictional world, I lay down a set of constraints
  — genre expectations, facts already established, the internal logic of the narration
  — and within those constraints certain events count as good plotting, others as
  cheating, and others as impossible for the same story. A reader who enters the book
  does not ring the police when a character is murdered, and yet grieves the death
  as though it mattered. The ordinary practical stakes are suspended, but not abolished;
  the events have a second-order seriousness inside the frame. This is strikingly
  close to the account of play associated with Huizinga: a game establishes a temporary
  sphere with a disposition all its own, rule-governed but removed from ordinary consequences,
  and a move inside that sphere has a significance it would lack outside it. A chess
  capture is not a robbery; a footballer''s goal is not damage to property. If I move
  a piece while my opponent is not looking, I am a cheater, not a thief; if I knock
  over the board, I have ceased to play rather than played badly. The board is a frame,
  and the status of my actions is constituted by the rules rather than merely constrained
  by them."


