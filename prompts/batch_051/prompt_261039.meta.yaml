  Prompt text:


  "I work as a novelist, and over years of drafting I have come to suspect that what
  I do with a fictional world and what happens when a reader enters it are structurally
  the same thing that happens in play, in Huizinga''s sense. A game sets up a temporary
  sphere in which moves have meanings they would not have outside it: capturing a
  piece in chess is not theft, kicking a ball into a net is not damage, and a player
  who breaks the rules is a cheater rather than a criminal. The rules here do not
  simply prohibit; they constitute the very possibility of the move. Fictional conventions
  seem to have the same character. A detective novel does not merely forbid me to
  make the murderer levitate across the room at the end; it determines whether that
  line is a cheap ending, a joke, or a different novel altogether. While reading,
  a person does not call the police when a character is murdered, though the grief
  is real enough, and the events are taken seriously in a way that is suspended from
  ordinary practical consequences. In short, it looks as though a novel is a magic
  circle: fiction is a kind of rule-constituted play and reading is a way of entering
  it."


  Then: "But I am unsure whether the resemblance is genuine identity of structure,
  a loose analogy, or a confusion. For example, in a game the rules are shared and
  binding on all players, whereas the constitutive choices in a novel are made mostly
  by the writer alone and are revised across drafts; rereading, skipping ahead, or
  opening the last page are not treated as cheating the way moving an opponent''s
  pieces would be. If those are differences that matter, what does the magic-circle
  account actually commit me to about fiction? If the parallel is deep, what would
  have to be true on both sides for conclusions about play — for instance that it
  is valuable for itself and quarantined from ordinary consequences — to transfer
  to novels? And what is one thing the parallel would predict about the writing or
  reading of fiction that turns out false? I would like the mapping stated precisely
  and tested, not merely judged."


