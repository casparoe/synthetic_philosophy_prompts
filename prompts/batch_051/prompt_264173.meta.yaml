  A canonical anti-dilemma argument:

  (1) If an agent genuinely ought to do A and genuinely ought to do B, where A and
  B cannot both be done, then the agent faces a conflict of obligations.

  (2) Ought implies can: if an agent ought to do A, then the agent can do A; similarly
  for B.

  (3) "Ought" distributes over conjunction: if an agent ought to do A and ought to
  do B, then the agent ought to do (A and B). [Agglomeration]

  (4) By (2), if the agent ought to do (A and B), then the agent can do (A and B).

  (5) But by hypothesis, the agent cannot do (A and B); contradiction.

  (6) Therefore, there are no genuine moral dilemmas; apparent dilemmas are conflicts
  of prima facie obligations, one of which overrides.


  The flaw could be in (3) agglomeration: it fails in exactly the dilemma case, so
  the argument may beg the question, or agglomeration is independently plausible but
  rejects dilemmas by definition. Or (2) "ought implies can" might be more nuanced.
  Or (1) might equivocate between all-things-considered ought and pro tanto. This
  is the standard debate. The prompt could ask to identify which step fails and on
