  Let me recall actual philosophical content: "How values combine: additive, multiplicative,
  or lexical?" This is likely about the structure of value dimensions (like in existential
  risk / effective altruism discussions). Examples:

  - Additive: the value of an object/state is the sum of the contributions of its
  parts or dimensions. E.g., total welfare = sum of welfare levels.

  - Multiplicative: value is the product of dimensions. E.g., value = (number of beings)
  × (average well-being), so a world with zero beings has zero value, no matter how
  high average well-being would be; and increasing population while keeping average
  the same increases value (under total view additive too). The difference appears
  when one dimension is zero: multiplicative value is zero (or very low) if either
  factor is zero, whereas additive ignores the zero dimension. Also multiplicative
  can be used for expected value = probability × utility, or value = intensity × duration
  × certainty.

  - Lexical: one dimension has absolute priority over another: no amount of the lower-priority
  value can compensate for any loss of the higher-priority one (e.g., rights trump
  welfare; consciousness before happiness).


