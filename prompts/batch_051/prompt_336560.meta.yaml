  Let me write:


  "I''ve been reading up on Peirce for a piece on how scientific communities actually
  change their minds, and I want to test the framework against a messy modern episode.
  Take the 1989 cold fusion affair: Pons and Fleischmann announce at a University
  of Utah press conference that they''ve got nuclear fusion in a tabletop electrochemical
  cell, the claim is spectacular, labs rush to replicate, most can''t find the neutrons
  or the heat, a few see anomalous heat, and within a couple years the mainstream
  has mostly closed ranks and the field survives at the margins as ''low-energy nuclear
  reactions.'' Peirce''s account of how beliefs get fixed gives us four methods: tenacity
  (just holding on and averting your eyes from the anomalies), authority (institutions
  imposing the consensus), the a priori method (settling it by what feels elegant
  and reasonable), and the method of science (letting belief be determined by something
  external and durable, i.e., where the consequences don''t go away when you stop
  believing). Use that machinery to walk through the episode: which actors were using
  which method at which points; what the pragmatic maxim says the dispute was really
  about (what observable consequences would have to show up if the claim were true);
  and what replications, calorimetry, neutron counts, and the absence of expected
  products settled or didn''t settle. Then run it in the other direction: does the
  episode confirm Peirce''s story about inquiry, or does it expose places where the
  method of science is hard to distinguish from authority and group tenacity? I also
  want to know what Peirce''s framework is silent about here — e.g., how to allocate
  attention when a claim is low-probability but potentially huge, and how a community
  should treat a maverick who insists the anomalies are real. Don''t give me a reading
  list; I want the analysis itself."


