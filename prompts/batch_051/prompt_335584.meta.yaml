  Prompt draft:


  I have been working through my views on rational belief under uncertainty, and I
  want to know what principle, if any, captures the pattern of my verdicts. I take
  Keynes''s distinction in A Treatise on Probability between probability and what
  he calls the weight of argument as my starting point: probability is the degree
  of rational belief justified by the evidence, while the weight is something like
  the amount or completeness of the evidence on which the probability is based. But
  I am unsure whether my case judgments actually line up with that distinction. Consider
  these cases.


  1. I have read one small, well-conducted study of forty patients in which a drug
  reduced symptoms at p = .04. I assign the claim that the drug is effective a probability
  just above .95. In a second case, I have read ten large, pre-registered trials of
  a different drug with a pooled result significant at p = .04. I assign the claim
  that the second drug is effective roughly the same probability. Yet I am willing
  to prescribe the second drug much more readily, and I think this difference is rational,
  not merely a matter of nerve.


  2. I am deciding whether to take an umbrella based on a single barometric reading
  that I know is 70% reliable, so my probability of rain is .70. Alternatively, my
  probability is .70 after consulting years of local weather records, several models,
  and current satellite images. I feel more entitled to rely on the second .70, and
  I think a person who ignored that difference would be making an epistemic mistake.
  But I also hold that rational credence obeys the probability calculus and that any
  two people with the same probability have equally rational beliefs as far as truth-directed
  concerns go.


  3. I know that a fair coin is about to be tossed. My probability of heads is .50.
  If someone then gives me a detailed engineering account of the coin''s exact physical
  symmetry, my probability stays .50, and I do not feel that my belief has become
  better supported in any way that matters for action.


  4. A juror in a criminal trial has heard one piece of compelling but easily misinterpreted
  forensic evidence and on its basis assigns probability .90 to guilt. Another juror
  in a different trial has heard the same piece plus a large body of independent circumstantial
  evidence, and also assigns .90. I think the second juror would be less likely to
  be wrong, and would be more justified in convicting, even though the probabilities
  are equal.


  Is there a single principle—Keynesian, Bayesian, or something else—that delivers
  all four verdicts? If not, which of my verdicts should I overturn, and what is the
  cheapest revision? Please also state the resulting principle precisely and apply
  it to a fifth case I have not listed: a scientist who has a theory that predicts
  an event with probability .80, and then receives a very large amount of redundant
  evidence that all points the same way without changing the .80.


