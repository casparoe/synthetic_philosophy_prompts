  What is Dawid''s non-empirical theory confirmation? Roughly: In fundamental physics,
  theories like string theory lack empirical confirmation, but physicists still have
  confidence based on: (1) the no-alternatives argument (no viable competitor), (2)
  the argument of unexpected explanatory coherence (a theory developed for one purpose
  explains other things, suggesting it''s on the right track), (3) meta-inductive
  argument from past research (theories that had these features tended to be empirically
  confirmed later). Dawid argues these considerations can rationally support belief
  despite lack of direct empirical test; he connects to Bayesian reasoning, arguing
  that the absence of alternatives raises the probability. He is careful: non-empirical
  confirmation is not a replacement for empirical confirmation but plays a role; he
  doesn''t say it''s conclusive or that it justifies ignoring empirical tests. He
  has been criticized (e.g., by George Ellis, Sabine Hossenfelder, Peter Woit) for
  lowering standards, "post-empirical science."


