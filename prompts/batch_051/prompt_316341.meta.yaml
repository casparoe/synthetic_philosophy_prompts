  The errors I plant:

  1. "accepted as true" vs Dawid''s "provides increasing confidence/trust" — overstatement.

  2. "no experimental support" vs "no empirical confirmation yet, but not none ever"
  — Dawid''s argument applies where empirical confirmation is not available but doesn''t
  replace it wholesale.

  3. "mathematical uniqueness counts by itself as strong evidence" — the no-alternatives
  argument is not mere uniqueness; it''s about the absence of credible alternatives
  after extensive search, and it''s an argument under uncertainty, not a proof.

  4. "just like Bayesian confirmation: absence of evidence for alternatives raises
  probability of remaining theory" — Dawid does use Bayesian reasoning, so this part
  is roughly accurate, but "absence of evidence raises probability" is a simplification;
  the no-alternatives argument requires an assumption about the probability that a
  viable alternative would have been found.

  5. "entitled to accept string theory and multiverse even though they may never be
  tested" — overstatement of his conclusion; he says non-empirical confirmation can
  support, not that we can accept without test; he remains committed to empirical
  test as ultimate arbiter.


