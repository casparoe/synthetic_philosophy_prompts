  ---


  I serve on a public-health ethics advisory committee. We are being asked to rule
  on the following proposal. A treatment exists that would prevent one person each
  year from developing a condition that causes continuous, unremitting pain comparable
  to torture, for the rest of the person''s life; the condition is otherwise untreatable
  and fatal only after years, and the treatment itself is safe and fully effective.
  The proposal is to fund the treatment from a levy that would cost each of the 60
  million payers into the health system roughly 30 cents per year — a cost they will
  not notice and would not, individually, object to if asked. But the tax is mandatory,
  it will be imposed on everyone who pays in, and it will recur indefinitely. The
  committee must issue a written opinion, by our next meeting, recommending whether
  to adopt the levy, with a time frame for review if adopted. The analytical difficulty
  we''ve been wrestling with is this: no single individual is harmed in a way that
  matters to her, yet the aggregated sum of small costs is enormous, and none of the
  payers benefit. Some members say that he simply cannot take from each person something
  she will not miss in order to spare one person a horror, because you are not entitled
  to stack negligible claims to outweigh a single grave one. Others say that whoever
  refuses the levy is valuing their own clarity about principles over an imaginable
  person''s actual torture. I need a memo that will move the discussion forward: it
  should recommend a concrete decision, give the reasoning, and give an honest treatment
  of the strongest consideration on the losing side, without resting on slogans like
  "you can''t put a price on suffering." Please also say how confident you are in
  the reasoning and which specific point you are least sure of.


