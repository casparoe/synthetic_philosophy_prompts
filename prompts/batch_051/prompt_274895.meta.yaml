  Let me draft:


  ---


  I sit on a regional health-system priority-setting committee. We must decide at
  our next meeting which of two prevention programs to fund; a fixed annual amount
  is available and the programs cannot be funded together. Program A: a public-health
  intervention that would, with stipulatively known effectiveness, prevent exactly
  one case per year of a rare condition whose course involves continuous, severe,
  unrelieved pain of the kind usually described as torture-grade, lasting for the
  rest of the patient''s life. Program B: a population-wide intervention that would
  eliminate a very small but recurrent discomfort — about the intensity and duration
  of getting a dust speck in the eye, twice a day — for all 40 million people in the
  region. Both interventions are safe, fully effective, and administratively equivalent
  in cost. The philosophical question the committee is stuck on, and which the members
  have asked me to address in writing, is whether many tiny harms or benefits can
  be summed across persons so as to outweigh a single severe one, and what principle
  tells us when the sum ends. Some members hold that severe harm has lexical priority:
  no number of dust specks, however large, may be allowed to count against avoiding
  torture-grade pain. Others reply that refusing to aggregate is a refusal to be serious
  about numbers, and that the cost of saving one person from a lifetime of such pain
  is that millions go on enduring something small each day; they also point out this
  body aggregates harms continually in vaccination, screening, and drug-formulary
  decisions. Please draft the short written opinion I will circulate before the meeting.
  It should recommend a concrete course of action with a time frame (including any
  review), give the reasoning for the recommendation, and engage the strongest consideration
  on the losing side honestly rather than restating a slogan such as "you can''t put
  a price on suffering." As part of the opinion, please say how confident you are
  in the reasoning and single out the specific point you are least sure of.


