  by organ-dispositions; (2) animals'' performance is explained by organ-dispositions;
  (3) therefore animals lack general reason. That looks like affirming the consequent
  or something. But maybe there''s a different step that does the work.


  So two questions: is Descartes'' argument best reconstructed as a validity problem,
