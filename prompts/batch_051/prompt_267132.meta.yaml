  The unilateralist''s curse: Suppose a group of rational, well-intentioned people
  each have the power to unilaterally take an irreversible action (e.g., everyone
  can publish the dangerous paper, everyone can release the gene drive, everyone can
  send the message). Each person has their own estimate of whether the action is net
  good. Some are cautious (high threshold for acting), some are bold (low threshold).
  If everyone acts independently and the action is taken iff at least one person thinks
  it''s good enough to act, then the probability that the action is taken is determined
  by the most optimistic/least cautious member. As the group grows, even if the average
  member thinks the action is bad, the chance that someone thinks it''s good approaches
  certainty. So groups with many potential unilateralists will take actions that the
  majority (and maybe almost everyone) would oppose. The curse is an epistemic/aggregation
  bias: the group''s de facto decision is made by its most extreme member.


