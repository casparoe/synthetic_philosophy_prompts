  Actually there is a specific "dogmatism paradox" tied to knowledge closure:

  - If S knows p, S is in a position to know that any evidence against p is misleading.

  - If S knows any evidence against p is misleading, S can rationally disregard such
  evidence without examining it.

  - So knowing p rationalizes refusing to consider counterevidence.

  - But refusing to consider counterevidence is dogmatism (epistemically wrong).

  Hence closure + knowledge entails that knowledge rationalizes dogmatism, paradox.


