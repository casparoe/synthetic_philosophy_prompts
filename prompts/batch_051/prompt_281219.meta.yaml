  I am the executive director of a federation of tenant unions — about twenty staff,
  a few hundred active members, and we take public positions several times a month:
  endorsements in city elections, statements on rent control and eviction policy,
  calls for action by other organizations. We are not a political party and do not
  run candidates, but I have been rereading Simone Weil''s attack on political parties,
  and it has made me uncomfortable about how my organization forms its positions.
  As she describes them, the essential property of a party is not running for office
  but being a collectivity organized around shared opinions: the party manufactures
  a collective passion, treats its positions as property to be defended, disciplines
  its members into repeating the line rather than thinking, and in doing so turns
  public life into a struggle of pressures rather than a search for what is true,
  with totalitarianism as its embryonic tendency. She thought the contrast was with
  collectivities organized around a concrete shared interest or task rather than around
  an orthodoxy. I suspect a tenant union is exactly the sort of interest-based association
  she thought could stay healthy, but I am not sure our current habits — rapid position-taking,
  internal loyalty tests, message discipline, a culture where dissent reads as disloyalty
  — are distinguishable from the thing she warned about.


  Write me a standing procedure we can follow before taking any collective public
