  Background: Decision under ignorance (decision under complete uncertainty): a decision
  matrix where each act maps states to outcomes, but the agent has no probability
  distribution over states. Classic criteria:

  - Maximin (Wald): choose act with best worst-case outcome. Very conservative.

  - Minimax regret (Savage''s regret criterion): choose act minimizing maximum regret
  (forgone outcome relative to what could have been achieved in that state).

  - Principle of insufficient reason / Laplace: assign equal probabilities when no
  information; maximize expected utility.

  - Hurwicz criterion: weighted average of best and worst outcome, optimistic coefficient
  alpha; generalizes maximin/maximax.

  - Lexicographic maximin? (Rawls''s difference principle as lexicographic max.)


  Rawls vs Harsanyi:

  Rawls: original position, behind veil of ignorance, parties don''t know their place;
  uses maximin (difference principle) for basic structure. Argues that in original
  position, probabilities are not available / not allowed; maximin is rational given
  the stakes (the "grave risks"), or at least parties would choose principles guaranteeing
  an acceptable minimum.

  Harsanyi: impartial observer / veil of ignorance with equal probabilities to each
  position; then expected utility maximization -> average utilitarianism. Harsanyi
  thinks the right approach is to assign equal probabilities and maximize expected
  utility. Uses VNM axioms; argues Rawls''s nonprobabilistic maximin is irrational
  because it violates dominance etc.

  Rawls''s response: original position doesn''t have a basis for probability assignments;
  equal probability would be arbitrary and possibly presuppose utilitarianism; Harsanyi''s
  equiprobability smuggles in risk attitudes; the original position is not one where
  the parties know the size of the population? Hmm.


  Open questions in the area:

  - What exactly justifies the "no probabilities" stipulation in original position?

  - Is the difference principle derivable from more general decision rules given a
  certain informational setting (complete ignorance vs. risk)?

  - Does Harsanyi''s impartial observer theorem prove too much/misuse probabilities
  when positions aren''t equiprobable (e.g., ex ante vs ex post)?

  - Should decision under ignorance criteria respect dominance, independence of irrelevant
  alternatives, transitivity, etc.?

  - The role of ambiguity / Knightian uncertainty: maximin and minimax regret as special
  cases of multiple priors? Gilboa–Schmeidler maxmin expected utility.

  - When stakes are serious vs trivial.


