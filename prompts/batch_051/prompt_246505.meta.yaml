  Student answer:


  "Inference to the best explanation is the rule that, when we have a body of evidence
  and several competing hypotheses, we should accept the hypothesis that best explains
  that evidence. This is different from enumerative induction, which just projects
  observed regularities, because IBE brings in theoretical virtues like simplicity,
  scope, and consilience. For example, we believe the postman delivered the mail because
  that hypothesis explains the letters being in the box better than the alternatives
  (a neighbor put them there, someone broke in just to leave mail, etc.). The explanatory
  virtues are what make a hypothesis good: a simpler hypothesis is better, a hypothesis
  that explains more of the data is better, and a hypothesis that unifies previously
  unrelated phenomena is better. Since these virtues are the marks of a good explanation,
  the best explanation is the one that scores highest on them. Now, does IBE give
  us a reason to believe the best explanation is true? Yes, because the best explanation
  is by definition the hypothesis that is most probable given the evidence. Explanatory
  virtues are just the features that raise a hypothesis''s posterior probability,
  so ranking explanations by how good they are is the same as ranking them by how
  likely they are to be true. The only serious worry is that we might not have considered
  the true hypothesis. Van Fraassen''s ''bad lot'' argument says we could be picking
  the best of a bad lot, and if the true hypothesis isn''t in our set, IBE will lead
  us astray. But this just shows we need to include more hypotheses; it doesn''t undermine
  IBE itself."


