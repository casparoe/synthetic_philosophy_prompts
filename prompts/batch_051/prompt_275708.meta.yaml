  my own verdicts don''t respect that idea very cleanly, so I want to lay out what
  I actually think about a range of cases and see what principle, if any, captures
  it.


  Here are my verdicts. Pneumonia and type 1 diabetes are diseases, without hesitation.
  Severe depression is a disease. ADHD is a disease, or at least close enough that
  the difference doesn''t bother me; the attentional system keeps failing a person
  in ways that harm them. Alcoholism and gambling addiction are diseases too, even
  though they begin in choices. Mild shyness is not a disease, but social anxiety
  that keeps a person housebound is. Lactose intolerance in an adult is not a disease
  to me, just a normal variation with unpleasant consequences. Nearsightedness, by
