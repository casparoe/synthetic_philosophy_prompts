  Grice''s core ideas:

  - Distinction between natural and non-natural meaning ("meaningNN"): speaker meaning
  vs. natural meaning (smoke means fire).

  - Speaker meaning: A speaker S meant something by uttering x iff S intended (i)
  the utterance to produce a certain response in the audience, (ii) the audience to
  recognize that intention, and (iii) the recognition of the intention to be part
  of the reason for the response. (Grice 1957 "Meaning"; later refined.)

  - Implicature: distinction between what is said (closely tied to conventional meaning
  of the sentence) and what is implicated (conversational implicature arising from
  the assumption that the speaker is following the Cooperative Principle and maxims:
  Quantity, Quality, Relation, Manner). Conventional implicatures (e.g., "but", "therefore")
  are different: part of conventional meaning but not truth-conditional.

  - Cooperative Principle: "Make your contribution such as is required, at the stage
  at which it occurs, by the accepted purpose or direction of the talk exchange in
  which you are engaged." Maxims: Quantity (make contribution as informative as required,
  not more), Quality (try to make contribution true; don''t say what you believe false
  or lack adequate evidence), Relation (be relevant), Manner (be perspicuous: avoid
  obscurity, ambiguity; be brief; be orderly).

  - Implicature arises when the speaker flouts or exploits a maxim; the hearer assumes
  the speaker is still cooperating and infers the intended meaning.

  - Distinguish "saying" from "implicating." What is said is roughly the truth-conditional
  content, often tied to conventional meaning.


