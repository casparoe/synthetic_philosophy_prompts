  observer has background knowledge that the predicates ''raven'' and ''black'' are
  well-defined, that ravens exist, and that non-black things exist, but has no further
  information about base rates or about how the observed object was selected. She
  then sees a single object and learns only that it is neither black nor a raven —
  a white shoe, say. ''All ravens are black'' is logically equivalent to ''All non-black
  things are non-ravens'', so the white shoe is a positive instance of the latter.
  The proposition before you is: that observation provides at least some positive
  confirmation — a strictly greater posterior credence in ''all ravens are black''
  than her prior, however tiny the increment — rather than zero confirmation.


  Give your credence in that proposition. Then decompose it. Your answer should assign
  a numerical probability and a one- or two-sentence justification to each of the
  following, and should show how they combine into your final figure:


  (a) Nicod''s instance condition (or a suitably restricted version) is correct: in
  the absence of defeating background information, an observed F-and-G genuinely confirms
  ''All Fs are Gs''.

  (b) The equivalence condition: if evidence confirms a hypothesis, it equally confirms
  any logically equivalent formulation, so the shoe''s status with respect to the
  contrapositive transfers to ''all ravens are black''.

  (c) There is no zeroing feature in this setup — no sampling bias, base-rate fact,
