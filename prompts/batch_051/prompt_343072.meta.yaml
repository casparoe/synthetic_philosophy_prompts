  A) From the "weight of evidence" angle:

  "Your Treatise separates the probability of a conclusion on evidence from the weight
  of the argument, i.e., how much relevant evidence there is. But you never gave a
  definite account of what weight adds to rational action. Suppose two policies both
  have, on the available evidence, the same intermediate probability of success, but
  one rests on abundant evidence and the other on a thin set of analogies. What difference
  should the extra weight make to how I act? If you say I should be more willing to
  rely on the better-evidenced probability, then what is that except a correction
  to the probability itself? And if no behavioral difference follows, you''ve left
  us with a distinction without a practical difference. Answer that."


  That''s strong and precisely Keynesian. But the role setup says Keynes''s core concern:
  distinguishes weight from probability. This opening attacks exactly the weak point:
  actionability of weight. Keynes would answer (I think): he actually acknowledged
  that weight cannot be handled by the probability calculus; it affects the confidence
  and stability of an estimate under the arrival of new evidence. He might say a well-founded
  probability is one whose weight is high; but for action, a high probability with
  low weight is more liable to revision, so a rational agent may act with less confidence.
  But if two probabilities are equal, why act differently? He could reply that the
  degree of rational belief is not a single number but includes the evidential basis,
  and that evidential basis bears on how one updates and on the justification of reliance
  — not necessarily on choice in a one-off decision. He could also bite the bullet:
  in a one-shot choice between equal probabilities, weight may make no practical difference;
  its importance shows in diachronic contexts and in whether one should search for
  more evidence before acting. That''s a plausible Keynesian response and gives a
  genuine contest. The critic''s move is fair; the character has resources.


