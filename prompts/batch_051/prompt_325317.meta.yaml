  Write a deadpan parody of a dojo brochure for an academy that teaches epistemic
  rationality as a martial art. Aim for roughly 750 words, formatted as promotional
  material: a mission statement, a belt-rank ladder, an account of the school''s signature
  training method (which it calls "kata"), a description of what happens in "sparring,"
  and a five-item FAQ. Keep the voice earnest, disciplined, and quietly grandiose;
  the dojo believes it has solved the problem of human bias through repetition and
  ritual, and it must never wink.


  The humor should come from sustained, accurate exaggeration, not invention. Borrow
  from both vocabularies faithfully: belts, dojo etiquette, kihon, kata, kumite, uke
  and tori on one side; base-rate neglect, motivated reasoning, updating, calibration,
  near transfer, and far transfer on the other. Make one philosophical point through
  the joke: the students demonstrably improve at the dojo''s own drills, jargon, and
  rituals, while the evidence that any of this improves judgment outside the dojo
  is thin — and the dojo''s explanations for that gap are themselves a case study
  in motivated reasoning and ad hoc rescue. Every failure of transfer should be treated
