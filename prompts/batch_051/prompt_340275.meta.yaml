  Let me write:


  "I''ve been trying to get clear on whether wealth and abundance have any moral value
  over and above what they buy or enable. I was reading Keynes''s ''Economic Possibilities
  for our Grandchildren'' and this bit stuck with me: ''We are suffering, not from
  the rheumatics of old age, but from the growing-pains of over-rapid changes, from
  the painfulness of readjustment between one economic period and another.'' It made
  me wonder whether our ordinary moral judgments about wealth are part of that readjustment
  too — like we''re trying to value prosperity for its own sake even though we''re
  not sure why.


  So I wrote down my gut verdicts on a bunch of cases. A friend sold her company and
  now collects paintings she never plans to sell; I think that''s fine, even good.
  My uncle is wealthy and does nothing but take cruises; I find it empty, but I can''t
  honestly say it''s wrong. A country doubles its GDP per capita with no rise in measured
  happiness; I wouldn''t count the extra wealth as a moral improvement. A lottery
  winner gives almost everything away and lives modestly; I admire her, but I''m not
  sure the admiration is for her final wealth state rather than the giving. A town
  votes to block a mine that would make everyone richer but wreck a marsh; I side
  with the town, but I reach for non-economic values to explain why. And a guy I know
  works insanely hard to accumulate money he will never spend; I think something has
  gone wrong, but I can''t tell if the problem is the money, the compulsion, or both.


  My working principle is that prosperity is only instrumentally good: good because
  of the capabilities, security, and opportunities it buys, and otherwise morally
  inert. But that principle struggles with the art collector — it feels like her abundance
  is good in a way that isn''t fully captured by what it lets her do, since she could
  do the same things with less. And it also makes the lottery winner''s case look
  like she has simply moved the instrumental value from herself to others, which is
  fine but doesn''t explain why we praise her.


  Is there a principle that gets all of these, or close? What does it say about the
  case I keep going back and forth on — my own retirement account growing while I
  already have enough? And which judgments should I give up if the principle is simpler
  than my gut?"


