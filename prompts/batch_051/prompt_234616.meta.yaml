  ---


  I have been trying to make sense of program equilibrium, the idea that cooperation
  in a one-shot prisoner''s dilemma can be made stable if each player submits a program
  that may inspect the other''s source code before deciding whether to cooperate.
  The familiar example is a program that cooperates exactly when the other program
  matches its own code and defects otherwise.


  I keep coming back to a distinction I am provisionally calling shallow and deep
  program equilibrium. In a shallow equilibrium, each program checks only the other
  program''s literal source code — for example, whether it contains an unconditional
  instruction to cooperate against this program. In a deep equilibrium, each program
  checks what the other program would actually do under a range of conditions, including
  conditions the other''s code does not explicitly mention. My worry is that shallow
  equilibria are systematically exploitable: an agent could submit a program that
  passes whatever check the other program performs but that in fact defects at runtime,
  for instance because it consults a clock, a random number generator, or some external
  service, or because the defecting behavior is buried in a subroutine that the inspecting
  program does not evaluate. I can almost convince myself that any equilibrium that
  relies on reading source code rather than on proving something about the other program''s
  behavior is shallow in this sense, and therefore fragile.


  Would someone say this distinction already exists in the literature under a better
  name? More importantly, is the deep conception achievable at all, or does it run
  into the usual undecidability limits — and if it is ruled out in general, what is
  left of the claim that program equilibrium gives cooperation a rigorous foundation
  rather than merely a vivid formal story? I would like the strongest case for thinking
  shallow equilibria are stable enough in practice, and the strongest case for thinking
  the whole framework collapses once agents can hide their true decision procedure.


  ---


