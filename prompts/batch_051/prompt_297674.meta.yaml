  Let me recall the dogmatism paradox. It''s from Kripke''s "Two Paradoxes of Knowledge"
  (1970, unpublished but circulated), discussed by Harman. The paradox: If I know
  that P, and I know that if P then not-E (where E is some evidence against P), then
  I can ignore E. More precisely: If S knows p, and S knows that p entails not-φ (where
  φ is a misleading counter-evidence), then S can know not-φ. But if S knows p, then
  S is justified in disregarding any evidence that p is false, because S can infer
  that such evidence is misleading. But this seems wrong: we should not be dogmatic;
  we should take counter-evidence seriously. The paradox arises from closure of knowledge
  under known entailment plus the fact that if p is true, then evidence against p
  is misleading. Kripke''s example: If I know that the library is open on Saturdays,
  and I know that if it is open on Saturdays then any newspaper report saying it is
  closed is misleading, then I can know the report is misleading and ignore it. But
  that seems like dogmatism.


