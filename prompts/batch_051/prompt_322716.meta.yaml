  You are setting the take-home essay for the final assessment in a graduate seminar
  on idealized and bounded rationality. The question must be answerable in 90 minutes
  with an expected answer of about 800 words, and it must be self-contained: a student
  who has done no outside reading should be able to answer from the question alone.


  Write one essay question on whether HCH (Humans Consulting HCH) is a good idealization
  of human deliberation, and then provide a model answer and a marking scheme. Include
  the following working definitions in the question itself, in your own words:


  - Factored cognition: the claim that a cognitive task can be split into many small
  subtasks, each small enough for one unaided human to do reliably in a limited time
  and context, such that the subtasks can be combined into an answer to a problem
  no single human could solve.

  - HCH: the limiting procedure in which a human either answers directly when a question
  is small enough, or else decomposes the question into subquestions, delegates each
  subquestion to a fresh copy of the same human-with-delegation-powers, and aggregates
  the copies'' answers. The base case is an unaided human answering within a short
  budget; recursion adds no AI, only more human reasoning.

  - Distillation: training a fast model to imitate the slow amplified procedure, often
  with the aim of inserting the fast model into the next round of amplification.


  The question must not be answerable by reproducing these definitions. It should
  center on the following crux: HCH is presented as a way to extract capabilities
  that no individual human has, yet its definition quietly assumes that a human can
  factor an unfamiliar problem into safe subquestions, check the subanswers, and aggregate
  them without already possessing much of the competence the full answer requires.
