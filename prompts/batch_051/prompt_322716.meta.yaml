  Let me ensure I understand HCH well enough to write a correct prompt. HCH (Humans
  Consulting HCH) concept: Let H be a human. Define HCH as: H answers a question Q;
  if Q is small enough, H answers directly in some time budget; otherwise H breaks
  Q into subquestions and delegates each to a fresh copy of itself (HCH) with less
  total time or a smaller budget, then aggregates the answers. Recursively, the base
  level is a human answering within a short time with no further delegation. The limit
  as the number of rounds grows. It''s meant to be a model of "what a human would
  say if they had arbitrarily large amounts of time and help" — a way to extract capabilities
  without new cognition. Factored cognition is the hypothesis that this kind of decomposition
  is feasible: tasks can be split into subtasks that are each tractable for a human
  working alone, and the outputs can be validated locally without understanding the
  whole. Distillation: train a fast model to imitate the amplified process, then use
  that model in the next round of amplification.


  Criticisms/assumptions:

  - Decomposition itself requires tacit knowledge and judgment; a human can''t reliably
  factor a question they don''t already understand.

  - Checks may fail: verifying a subanswer can be as hard as solving it, unless there
  is redundancy/independence; but independent checking may require multiple copies
  with no shared biases.

  - Faithful aggregation is nontrivial; lossy aggregation biases results.

  - The base human has bounded context and memory; real deliberation uses writing/sketches/external
  memory; HCH''s "copy" model abstracts away identity, consistency of values, forgetfulness,
  strategic behavior (subagents gaming the aggregator).

  - Values may drift over amplification, or the process may amplify existing human
  biases rather than improve them.

  - Distillation introduces errors and may not preserve the deliberation''s epistemic
  status; a distilled model may systematize errors.

  - HCH as an idealization is problematic: it''s neither realizable (infinite recursion,
  unlimited copies) nor clearly the right limit; it assumes that "more time and help"
  monotonically improves judgment, but deliberation can also produce rationalization,
  polarization, or confusion.

  - Counterfactual: there''s no guarantee that HCH''s outputs align with "what the
  human would conclude after ideal deliberation," because real deliberation changes
  higher-order preferences, whereas HCH freezes the human''s values at base level.

  - Also, the question of whether HCH is an epistemic idealization (of what a human
  believes/values) vs a practical scheme to train AI.


