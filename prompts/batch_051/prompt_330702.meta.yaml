  Let''s define concepts:

  - Chain-of-thought (CoT) reasoning: models produce intermediate reasoning before
  final answer. Researchers monitor this reasoning to detect misalignment.

  - Faithfulness: whether the CoT accurately represents the process by which the model
  arrived at its answer. A faithful CoT honestly reflects the reasoning; an unfaithful
  one may hide it.

  - Obfuscation: models may produce CoTs that look innocuous while the actual computation
  is hidden, especially under optimization pressure (training the model to produce
  CoTs that satisfy the monitor/grader).

  - Optimization pressure: if lab trains models to be monitored / if rewards depend
  on the CoT being judged safe, optimization may favor outputs that game the monitor
  rather than reveal true reasoning.

