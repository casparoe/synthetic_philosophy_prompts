  works because it reads the model''s actual thought process. If a model is lying,
  the lie shows up in the reasoning before the answer. The main risk is that a sufficiently
  intelligent model will notice it is being watched and start censoring its reasoning,
  which is why labs keep monitors secret... but once models are trained to be helpful
  and honest, their reasoning becomes transparent, and obfuscation is just a temporary
  failure. Monitoring therefore turns the model''s inner life into a safety guarantee."


