  Causal Bayes nets: Directed acyclic graphs (DAGs) with the Causal Markov Condition:
  each variable is independent of its non-effects conditional on its direct causes
  (parents). Given a probability distribution over variables, many DAGs may be Markov
  equivalent. Causal discovery algorithms (PC, GES) assume faithfulness: the only
  conditional independencies in the distribution are those entailed by the Markov
  condition applied to the true graph. This rules out cancellations (e.g., two paths
  exactly canceling). The faithfulness assumption is often justified by the fact that
  violations (unfaithful distributions) have measure zero under some measures on parameter
  spaces — "almost all" distributions are faithful. But there are debates: measure-zero
  is not probability zero under a Bayesian prior with positive mass on lower-dimensional
  submodels; near-unfaithfulness causes finite-sample problems (Uhler et al.); and
  faithfulness is a "gratuitous" assumption maybe.


  Minimality: a graph is minimal if no edge can be removed without creating a conditional
  independence not in the distribution. Minimality is weaker than faithfulness. The
  question "why do minimal Bayes nets track causation?" Might be about whether the
  minimal Markov model recovers causal structure. There''s a theorem? Let me think.


