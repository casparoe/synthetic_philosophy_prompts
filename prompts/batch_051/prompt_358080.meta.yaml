  Now the content.


  What is the mental imagery debate? Roughly:

  - Depictive/analog/pictorial account (Kosslyn): mental images are represented in
  a spatial, depictive format; they exploit a functional spatial medium ("visual buffer")
  where distance corresponds to distance, size to size, etc. Behavioral evidence:
  mental rotation (time proportional to angle of rotation), image scanning (time increases
  with distance scanned), size/inspection effects (smaller images harder to inspect
  / "zoom" effects), and neuroimaging showing retinotopic activation of visual cortex
  (V1) during imagery, mental rotation activating motor areas.

  - Propositional/descriptive account (Pylyshyn): mental images are epiphenomenal;
  underlying representations are symbolic, propositional, language-like. Behavioral
  results can be explained by demand characteristics and tacit knowledge: subjects
  simulate what they know would happen (or what the experimenter expects), not by
  inspecting a depictive image. The format is distinct from the phenomenology; imagery
  is like "what it feels like to have certain thoughts," and the spatial regularities
  are facts about the world that are represented propositionally. The "tacit knowledge"
  objection: reaction-time data reflect participants'' beliefs/implicit knowledge
  rather than the format of representation.


  An adequate theory of mental imagery (or of imagistic representation) must:

  1. Explain behavioral regularities: mental rotation linear angle effect, scanning
  distance effects, size/accommodation effects, interference between visual perception
  and imagery (e.g., visual/perceptual load), selective interference (visual imagery
  interferes with visual perception; spatial imagery with... etc.).

  2. Respect neuropsychological dissociations: patients with imagery deficits but
  intact vision, or vice versa (e.g., various agnosias, unilateral neglect in imagery
  — Bisiach & Luzzatti — but avoid niche factual details; common knowledge).

  3. Account for the difference between format and content/phenomenology; an adequate
  theory must not conflate "it feels like seeing" with "it is encoded in a picture-like
  format." A good theory must give an account of why imagery has a distinctive phenomenology
  even if propositional.

  4. Account for the tacit knowledge/demand characteristics challenge: any behavioral
  evidence is consistent with subjects'' implicit knowledge; so an adequate theory
  must specify what would distinguish a truly depictive format from a propositional
  one using that knowledge. This is a desideratum that may be the hardest.

  5. Be consistent with computational/combinatorial properties: mental images can
  represent parts, spatial relations, be reinterpreted (e.g., ambiguous figures like
  duck/rabbit — can you reinterpret an image?), constructed from memory, etc.

  6. Handle visual vs. spatial imagery distinction (what/where; evidence: some patients
  have intact spatial imagery but impaired visual object imagery).

  7. Respect the neuroscience: activation of topographically organized visual cortex
  during imagery; TMS to visual areas disrupts imagery; but also imagery activates
  early visual cortex, etc.

  8. Developmental/congenital blindness cases (blind people can have imagery? perform
  mental rotation?) — maybe too niche but okay common knowledge that blind people
  can perform some spatial tasks.

  9. Relationship between imagery and perception: imagery vs. seeing; imagery in memory,
  reasoning, and problem-solving; is imagery a single format or a family?

  10. Generativity: images can be novel combinations (a pink elephant), counterfactual.


  Which desiderata are negotiable vs not? Perhaps:

  - Non-negotiable: explain distance/angle effects (the core behavioral data); distinguish
  format from content; account for neuropsychological dissociations and selective
  interference; provide a computational mechanism compatible with known neural architecture.

  - Negotiable/camp-prejudiced: demanding that imagery share early visual cortex,
  or that images be inspected by a "mind''s eye" homunculus; demanding introspective
  fidelity of conscious image vs. underlying code.


  The jointly unsatisfiable pair: maybe "depictive imagery reuses topographically
