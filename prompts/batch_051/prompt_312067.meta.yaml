  Before I read further proposals about whether computer-assisted mathematics yields
  genuine proofs, I want the standard of adequacy fixed first. Write the desiderata
  for an account of proof that distinguishes proofs from non-proofs in a regime where
  the reasoning exceeds any single mathematician''s ability to survey it: the computer-assisted
  proof of the four-colour theorem, the formal verification of the Kepler conjecture,
  and kindred results whose exhaustive case analyses run far beyond what one person
  could inspect.


  For each requirement, give the case or consideration that shows it is a genuine
  requirement rather than an inherited habit; where a familiar demand looks like a
  prejudice of one camp, say so and defend that judgment. Address at least the following:


  - correctness and gap-free checkability: an alleged proof must be sound relative
  to an antecedently specified system, with no unstated lemmas and no reliance on
  diagram, experiment, or authority in place of inference;

  - the gap between a published proof and the formal derivation it is taken to denote,
  and which of these the requirements of proofhood attach to;

  - surveyability: whether a proof must be such that one competent mathematician could
  read it through and be convinced, and what the four-colour theorem forces an adequate
  account to say here;

  - independence from unvouched testimony: whether reliance on the small checked core
  of a proof assistant, or on referees who report only that they are nearly certain,
  makes the result rest on authority beyond the proof itself;

  - reproducibility and portability: whether the result must be checkable by independently
  written checkers on different hardware, and what failure of this requirement would
  show;

  - explanatory force: whether establishing that a theorem is true suffices for proofhood,
  or a proof must also exhibit why it is true;

  - stability under revision and error: what remains when a bug is later found in
  the checker, the generated certificate, or a background lemma, and what the proof
  object is once the correction is made.


  Then mark each requirement as non-negotiable for any adequate account or as a demand
  peculiar to one constituency. Flag any subset that appears jointly unsatisfiable
  — for instance, an unqualified surveyability requirement together with an unqualified
  permission for exhaustive finite case analysis — and state what that tension shows.
  A brief note on how the main positions fare against the list is welcome only if
