  and more recent formally verified results).


  Requirements to include with motivations:

  - Soundness/correctness relative to some specified background system: a proof must
  be checkable step-by-step; no reliance on unstated lemmas.

  - The distinction between proof as formal derivation and proof as published argument:
  published "proofs" are compressed representations or certificates? What must an
  adequate account say about the gap?

  - Checkability vs. surveyability: any proof must be checkable in principle by a
  finite mechanical procedure; but traditionally we also demand a competent mathematician
  can survey it and thereby come to know the theorem. Are both requirements? The four-colour
  theorem forces a choice or refinement.

  - Non-accidental reliability: a proof must transmit warrant, not merely produce
  conviction; a machine that runs a search and prints "true" without giving access
  to intermediate lemmas doesn''t prove.

  - Independence from unvouched authority: Does reliance on a proof assistant''s trusted
  core constitute appeal to authority, or acceptable division of epistemic labor?
  Specify the requirement against testimonial dependence.

  - Reproducibility/portability: proof must be checkable by independent implementations,
  not tied to one piece of hardware.

  - Explanatory value: is it a requirement that a proof show why the theorem is true,
  or only that it is true? Is this negotiable — many mathematicians reject proofs
  that establish truth without explaining; but is that a criterion of proof or a preference?
  Distinguish criteria of proof vs. criteria of good proof.

  - Preservability through retraction/correction: what happens when a bug in the checker
  or the original code undermines the proof; a theory must say what qualifies as the
  proof object when the trusted base changes.

  - The deadline problem / acceptance: when is a proof accepted? In the Hales case,
  referees said they were 99% certain. Does a proof require actual survey by referees,
  or only fallibility? A desideratum about the social process perhaps.

  - New: distinction between "certificate" (a data object that a checker can verify)
