  Final draft:


  "I am a novelist, and I need a historical-intellectual prediction to finish a scene.
  The novel features Paul Dirac, who died in 1984, in a late-life encounter with a
  young theoretical physicist working on the mathematical structure of string theory.
  The scene turns on an argument Dirac never lived to have with the discipline in
  its present form: whether the striking mathematical beauty of a physical theory
  can rationally support belief in it, or continued collective investment in it, when
  direct experimental confirmation is not expected for decades. I want to write Dirac''s
  position as a genuinely internal point of view rather than a set of remembered slogans."


  Then ask.


  "Please reconstruct, as fairly as you can from what is known of his methods and
  temperament, what Dirac''s considered view would most likely have been. Specifically:

  - Would he have regarded the modern appeal to elegance in post-empirical physics
  as a legitimate extension of his own convictions about beauty in equations, or as
  a failure of nerve in which aesthetic preference is doing work that only experiment
  is allowed to do?

  - How much weight would he have given to the selection-effect objection: that the
  history of physics is full of beautiful theories that died quietly, and the successes
  are memorable partly because they succeeded?

  - Is the most faithful reading of Dirac one on which beauty is evidence of truth,
  or one on which beauty is merely a strong heuristic for finding equations that experiment
  will later test? Would he have cared about that distinction, or would he have found
  it academic?

  - Would he have been moved by the argument that, in the absence of experimental
  test, the lack of any comparably elegant candidate is itself a kind of evidence?
  Or would he have treated that as precisely the circularity to be resisted?

  - Would the particular aesthetic he favored — spare, economical, almost algebraically
  forced — even align with the aesthetic he would encounter in contemporary fundamental
  theory, or would he have found the latter baroque rather than beautiful?"


  Then: "Give me a definite prediction with the reasoning behind it, and mark clearly
