  Let me compose a polished version:


  ---


  A social theorist with whom you are friendly insists that when people speak of national
  character, they are not simply referring to the average behavioural effect of a
  country''s institutions, laws, incentives, and material circumstances. On his view,
  there is additionally a genuinely transmitted, relatively stable pattern of temperament,
  value, or habit of mind — something character-like — that would partly survive a
  change of institutions and would do some explanatory work of its own. You suspect
  that this claim is either trivially true, because any population will differ from
  any other in some measurable way if enough variables are measured, or untestable
  in exactly the respects in which it would be interesting.


  Your task is to design the strongest feasible empirical test of the non-trivial
  part of that claim: the assertion that there exists a transmitted, partly portable,
  character-like dispositional core over and above current circumstances. The test
  should be one a social scientist could in principle carry out, and it should not
  take self-reported stereotypes as its measure of the trait; ratings of national
  character may be used as data only about the stereotype, never as evidence for the
  trait. Specify the design, the populations compared, the outcome measure, and the
  pattern of results that would favour each reading. Then say what a decisive positive
  result would actually establish, what it would leave open, and whether the gap is
  a limitation of the available methods or a sign that part of the claim is non-empirical.


  Finally, isolate the normative question. Suppose the best version of the test returned
  a robustly positive result. Would that, on its own, make it acceptable to attribute
  national character traits to individuals in ordinary reasoning? If not, state the
  additional premise that would be needed and explain why no empirical test supplies
  it.


  Please write your answer in British English.


