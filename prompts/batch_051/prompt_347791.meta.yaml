  Bayes net basics:

  - A Bayes net = directed acyclic graph (DAG) + probability distribution satisfying
  the Markov condition: each variable is independent of its non-descendants given
  its parents.

  - Faithfulness: the distribution has all and only the conditional independence relations
  entailed by the graph (via d-separation); no extra independencies due to parameter
  cancellation.

  - Minimality: the graph is a minimal I-map of the distribution: no edge can be removed
  while still satisfying the Markov condition / remaining an I-map. There are different
  senses: "minimality" as no edge removable, versus "faithfulness" (which is stronger
  in some sense: faithful implies minimal, but not conversely).


  Why do minimal Bayes nets track causation? There''s a classic result that under
  causal Markov + faithfulness (or minimality), the causal graph is a minimal faithful
  structure, but observational data can only identify Markov equivalence classes,
  not full direction in some cases. Faithfulness/minimality are assumptions that connect
  statistical dependencies to causal structure: an edge present when variables are
  dependent conditional on any set; absent when there''s some conditional independence.
  The minimality principle says we shouldn''t include edges that don''t change the
  independence relations, so superfluous edges are excluded. Faithfulness says the
  population distribution doesn''t hide dependencies that the causal structure creates,
  nor create independencies not in the structure. Together they make the learned skeleton
  track causal connections, but directions can be underdetermined.


  A borderline case for "does this minimal Bayes net track causation": Consider two
  variables, X and Y, with a distribution P(X,Y) where X and Y are dependent, and
  no other variables. The class of minimal Bayes nets includes both X → Y and Y →
  X (and possibly X ← H → Y with hidden H, but that''s not a Bayes net over X,Y).
  Both are minimal and faithful to P. So the direction does not track causation; only
  the adjacencies/undirected skeleton track it. A criterion "minimal faithful Bayes
  net tracks causation" would be false for direction. Another borderline: a case where
  faithfulness fails due to path cancellation — e.g., X → Y with direct effect and
  indirect effect cancelling so X and Y independent; minimality alone would remove
  the edge, so the minimal graph would fail to include the true cause. This is a classic
  borderline: minimality tracks the "pattern of dependencies" but can miss actual
  causation when parameter values cancel. So criteria: an arrow in a minimal Bayes
  net counts as causal iff (1) the graph satisfies Markov; (2) distribution is faithful;
  (3) graph is minimal; (4) interventions change the child. Borderline cases test
  whether all criteria are necessary.


