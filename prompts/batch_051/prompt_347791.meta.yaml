  Now the borderline case: Markov equivalence. Two DAGs are Markov equivalent if they
  entail the same set of conditional independencies. For any DAG, its skeleton and
  v-structures (colliders) determine the equivalence class. A and B dependent: the
  class over two variables has two DAGs: A→B and B→A; they entail no CIs; both are
  faithful and minimal for any distribution with A and B dependent (and any such distribution
  is faithful to both). So minimal/faithful structure picks adjacency, not direction.
  The directed output is underdetermined by the data. If the algorithm must draw an
  arrowhead, it''s using tie-breaking (e.g., order of insertion), not evidence.


