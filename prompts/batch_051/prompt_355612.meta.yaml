  Structure of a good analogy-type prompt:

  1. Introduce the analogy and the context/work it''s made to do. E.g., "a colleague
  of mine in the free will literature keeps trotting out the sphex wasp to argue that
  our vaunted flexibility is mostly a trick of scale..."

  2. State the analogy: human decision-making is like the sphex wasp''s fixed action
  pattern — we respond to environmental triggers with subroutines that run to completion;
  we mistake the complexity of the subroutine for genuine flexibility.

  3. The conclusion it licenses: free will is illusory, or at least we have far less
  flexibility than we think; or maybe the opposite? Actually the sphex analogy is
  often used by both sides? Dennett uses it to say: organisms with more flexibility
  than sphex have what we call free will; but a skeptic uses it to say even our flexibility
  is sphex-like? The common use: free will skeptics (or people arguing "you''re less
  free than you think") use sphexishness as a deflationary comparison. The work: deflate
  the notion of flexible choice by showing it''s mechanical if-then upon closer inspection.

  4. Ask for audit: correspondence table, what maps (triggers, routines, behavior
  chaining), where it breaks (error correction, higher-order preferences, offline
  simulation, responsiveness to reasons, revision mid-action, scale of flexibility,
  consciousness?), what gets smuggled in (rigidity of source? that component rigidity
  means whole rigidity? that looking mechanical at one description level makes free
  will impossible?), whether the deflationary conclusion survives, and what a better
  analogy would be.


