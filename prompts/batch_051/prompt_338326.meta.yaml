  Draft:


  "Okay so I''ve been reading Fabre''s The Hunting Wasps, and the famous bit about
  the yellow-winged Sphex keeps bugging me. For background if you don''t know it:
  the wasp catches a cricket, stings it, drags it to the burrow, leaves it outside,
  goes down alone to check the burrow, comes back up, and only then drags the cricket
  inside. Fabre found that if you move the cricket a few inches away while she''s
  down below, she''ll come up, drag it back to the threshold, and go down to inspect
  all over again — as many times as you move it, and each time she repeats the whole
  entrance ritual. The usual reading is that she''s a rigid automaton, locked into
  a fixed stimulus-response chain; the absence of the cricket from the threshold doesn''t
  register as "already checked." Hofstadter called this sphexishness and used it as
  the opposite of flexible, free-ish behavior.


  I''ve been thinking this is actually backwards, or at least half-wrong. My theory:
  the wasp isn''t failing to notice anything. She''s operating with what I call a
  ''threshold-verification norm'' — the rule that the cricket must be on the threshold
  at the moment the burrow check is completed, where the check isn''t a fact about
  the burrow but a fact about the ritual''s completion conditions. If the cricket
  moves, the condition hasn''t been met, so she re-runs the check. That sounds like
  a dumb technicality, but I think it''s actually the same structure as human cases:
  people redoing a proof because they changed a variable''s name, re-reading a sentence
  after a single typo was fixed, a committee re-voting because the wording changed
  even though the substance didn''t. The rigidity isn''t the absence of a norm; it''s
  having a norm so precise that it treats irrelevant changes as relevant. And if that''s
  right, then sphexishness and free will aren''t opposites — free will might just
  be having enough norms, or high-enough-order norms, to decide which changes are
  irrelevant. A computer running a fixed program is sphexish, but so is a person who
  can''t stop checking whether they locked the door; the difference is what counts
  as a failed verification.


  Is this a real distinction or am I just re-describing something obvious? I know
  Dennett made sphexishness famous, and there''s stuff about compulsive checking in
  psychiatry, but I''m not aware of anyone claiming the wasp''s behavior is norm-governed
  rather than merely automatic. Give me the three strongest objections, and tell me
  which one is fatal. Also: would a simpler model — the wasp has a variable for ''cricket
  at threshold'' that resets to false whenever it moves, and it rechecks the burrow
  because that variable gates the entry procedure — explain the same thing without
  my norm talk? If so does my theory add anything?"


