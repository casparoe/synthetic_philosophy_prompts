  I know Nozick''s entitlement theory well enough:

  - Historical vs. pattern/end-result principles; patterned, unpatterned, current
  time-slice vs. end-state.

  - Three principles: acquisition, transfer, rectification.

  - Wilt Chamberlain: D1 just by whatever patterned principle (say D1 is a just distribution);
  Wilt signs contract: 25 cents from each home game ticket; one million attend; Wilt
  gets $250,000; D2. Each transfer was voluntary. If D1 was just, and transfers were
  just, D2 must be just. But D2 violates pattern. So patterned principles require
  forbidding "capitalist acts between consenting adults" or continuously interfering
  to restore pattern. Hence liberty upsets patterns.

  - The force: Nozick doesn''t need to claim D1 is actually just under real-world
  conditions; he says "whatever your favorite patterned principle, if it allows a
  distribution as just, then..." Actually he says D1 "is" the distribution that your
  favorite principle deems just. The moves people object: they can deny justice in
  transfer because Wilt''s monopoly/state etc.; or deny that D1 was just given actual
  history; or accept liberty upsets patterns but say justice requires some patterning
  and that''s fine. The key correction for type 1: Nozick doesn''t pretend the example
  alone refutes all patterned principles; it''s a challenge: pattern theorists must
  either deny the justice of the original distribution, or deny voluntariness of transfers,
  or admit their principle requires ongoing interference. Also the argument presumes
  entitlement theory''s transfer principle, so it doesn''t prove entitlement theory;
  it''s internal pressure.


