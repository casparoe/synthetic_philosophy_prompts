  Nozick''s entitlement theory: Wilt Chamberlain argument — there''s a classic subtle
  confusion: people think the argument shows any taxation is unjust or proves libertarianism;
  actually it''s a benchmark argument within a theory of justice in holdings: if the
  initial distribution is just and transfers are just, then the resulting pattern
  (e.g., equality) must be abandoned unless we continually interfere. The subtle confusion
  could be "Nozick''s Wilt Chamberlain example proves that redistributive taxation
  is on a par with forced labor, so why do people still defend it?" Hmm, that might
  be too standard.


  Alternatively the confusion: "The Wilt Chamberlain argument shows that liberty upsets
  patterns, so pattern-based theories of justice are internally inconsistent" — a
  good answer would notice that Nozick''s argument depends on the assumption that
  the starting distribution was just, and many egalitarians deny Wilt''s starting
  holdings track justice (e.g., unjust background, monopoly power, etc.). Also the
  argument deals with a specific voluntary transfer model; it doesn''t by itself establish
  that all taxation is unjust, since Nozick''s entitlement theory rules out taxation,
  but the Wilt example alone only shows patterns require interference with liberty,
  not that interference is never justified. Hmm, this is rich.


  There''s also subtle confusion around the "principle of justice in transfer" vs
  "rectification". The Wilt example relies on each step being just. If initial D1
  is just, and 1 million people pay 25 cents, then D2 is just even though it violates
  the pattern. The subtle confusion: many people think Nozick needs to show the starting
  distribution is just or that the transfers are uncoerced; but he treats the example
  as a hypothetical conditional to show conflict between patterned principles and
  liberty.


