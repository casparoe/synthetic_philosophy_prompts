  of which side each molecule went to, and Landauer''s principle says erasing a bit
  costs at least kT ln 2 of heat dumped to the cold bath — so the second law survives.
  Now suppose the demon doesn''t erase. It writes each measurement outcome to a long
  tape of bits that start all zero, and just keeps moving along the tape, so the demon
  itself is a reversible automaton with unlimited memory. Does the demon break the
  second law in that setup? If yes, where exactly did the old Landauer argument go
  wrong? If no, where is the entropy increase if no bit is ever erased? And is the
  ''second law'' the right law to be appealing to here, or does the whole thing only
  close if we treat the tape as a fuel with an entropy price? Try to answer without
  assuming the demon has to be cyclic in the way the old argument does."


