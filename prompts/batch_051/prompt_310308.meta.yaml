  ---


  In my philosophy seminar on social norms, we have been working through the difference
  between convention, etiquette, and moral obligation. Two students in my section
  have been arguing, since last week''s session, about the following case, and they
  have asked me to referee. I cannot settle it, and I would like an assessment of
  each move in their exchange.


  The case: an exchange student spending the full academic year in a U.S. city comes
  from a country where pedestrian signals tend to be treated as advisory and restaurant
  tipping is not customary. He stands in line when others have formed one, but he
  regularly crosses the street against the light when there is no traffic, and, though
  he now knows that servers'' tips function as part of their income, he leaves around
  eight percent rather than the local fifteen to twenty, saying he would happily pay
  higher menu prices but will not adopt a custom he never joined. He says his queuing
  is just what any reasonable person does anywhere.


  (1) Daniel takes the visitor''s side in most of this. Jaywalking and the size of
  a tip are matters of local convention, and conventions can obligate only those who
  have somehow joined them—through agreement, tacit acceptance, or long membership.
  A visitor is a beneficiary of the community''s hospitality, not a party to its compact.
  "When in Rome" is advice about avoiding friction, not a moral requirement. We would
  not require a local to tip twenty percent in a country where the service charge
  is included and tipping is pure gratuity, so we cannot require the visitor to tip
  here just because the numbers differ.


  (2) Rosa answers that some conventions are not contracts but ongoing schemes that
  work only if enough people honor them. A queue exists because everyone defers; cutting
  it harms nobody if we ignore the scheme, but the scheme itself is how strangers
  coordinate. Anyone present and taking advantage of that coordination has a duty
  of fair play not to exploit the compliance of others. What matters is the social
  situation the visitor actually occupies, not his cultural provenance.


  (3) Daniel grants the queue case but says it proves his point: the duty not to cut
  is derived from a general principle—do not exploit the cooperative efforts of those
  around you—and would bind a local in exactly the same way. It is not the local convention
  as such that binds; it is the interaction. Tipping is different. It is not a coordination
  device among equals but a wage subsidy by customers, an arrangement created because
  employers may pay servers a subminimum wage. The visitor''s eight percent does not
  unravel a public good; it pays one worker less. If anyone wrongs the server, it
  is the employer and the legal wage structure, not a guest who has declined to adopt
  a custom he finds arbitrary.


  (4) Rosa replies that this is too clean. The server accepted the job in a labor
  market in which tips are an understood part of compensation, and the menu price
  is set on that assumption. The visitor knows this and continues to order table service.
  A person may refuse a practice he regards as unjust, but after months of accepting
  service in a tipping establishment, quietly paying less than the customary rate
  looks less like principled refusal and more like taking a discount at the server''s
  expense. To say "I didn''t join" when he daily benefits from the arrangement is
  precisely to treat convention as a shield rather than a reason. She adds that long-term
  visitors are guests in a weak sense, and a guest owes the community some default
  respect for its easy, low-cost norms, even when no harm follows in the single case,
  because continual visible noncompliance erodes the norm for others.


