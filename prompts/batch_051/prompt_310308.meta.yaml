  ---


  In my philosophy seminar on social norms—this term we''ve been working through the
  difference between convention, etiquette, and moral obligation, and in particular
  the question of whether conventions can generate duties for people who never agreed
  to them—two students in my section have been locked in an argument about a visiting
  student''s conduct. They asked me to referee, and I honestly cannot. I would like
  a move-by-move adjudication.


  The case is this. An exchange student spending the full academic year in a U.S.
  city comes from a country where pedestrians treat red lights as advisory when the
  street is empty and where tipping in restaurants is not customary. He queues when
  a line has already formed, saying any sane person would. But he regularly crosses
  against the light when no traffic is coming, and although he now knows that tips
  function as part of servers'' income, he leaves about eight percent rather than
  the customary fifteen to twenty, saying he would gladly pay higher menu prices but
  will not adopt a custom he never joined.


  (1) Daniel largely defends the visitor. Jaywalking and the size of a tip, he says,
  are local conventions, and conventions create obligations only for people who have
  joined them—through explicit agreement, tacit acceptance, or long membership in
  the community. A visitor is a beneficiary of hospitality, not a party to the local
  compact. The familiar advice to follow local customs when abroad is prudential guidance
  for avoiding resentment, not a moral requirement. We would not demand that a local
  tip twenty percent in a country where the service charge is included in the bill
  and tipping is a pure gift, so we cannot demand that the visitor tip here merely
  because the local percentage is different.


  (2) Rosa answers that some conventions are not contracts but ongoing schemes that
  work only if enough people honor them. A queue exists because strangers are each
  willing to defer; if people jump it, the thing others were cooperating to produce
  begins to dissolve. Anyone who walks up to an existing queue and takes advantage
  of the order others are maintaining has a duty of fair play not to exploit their
  compliance. On her view, what matters is the situation the visitor actually enters,
  not the culture he was raised in.


  (3) Daniel grants the queue case but says it proves his point. The duty not to cut
  derives from a general principle—do not exploit the cooperative efforts of people
  around you—and it would bind a local in exactly the same way. What is binding is
  the interaction, not the local custom as such. Tipping, once again, is different.
  It is not a coordination device among equals; it is a wage subsidy by customers,
  made necessary because employers may legally pay servers a subminimum wage. Paying
  eight percent does not unravel a shared public good; it pays one worker less. If
  a wrong occurs there, it is committed by the employer and the legal wage structure,
  not by a visitor who declines to adopt a custom he finds arbitrary.


  (4) Rosa replies that this is too clean. The server accepted the job in a labor
  market in which tips are an understood part of compensation, and menu prices are
  set on that premise. The visitor has known this for months and continues to order
  table service. A principled refusal is one thing; quietly paying below the customary
  rate while accepting service is closer to taking a discount at the server''s expense.
  And to say "I never joined the practice" while eating repeatedly in establishments
  where the practice is part of the economic background, she says, is to use convention
  as a shield rather than to take it seriously as a reason. As for crossing against
  the light, she argues that long-term visitors are guests in a meaningful sense and
