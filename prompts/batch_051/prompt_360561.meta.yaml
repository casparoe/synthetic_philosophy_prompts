  Prompt:


  "Freud argues in The Future of an Illusion that religious ideas owe their hold on
  us to something other than evidence or reasoning: they satisfy, he says, the oldest,
  strongest, and most urgent wishes of mankind, above all the wish for a protecting
  and reassuring father in the face of natural forces and fate. On his view, this
  wishful origin is what makes religious beliefs illusions, even if some of them have
  not yet been shown false. Now consider a later development: research in the cognitive
  science of religion finds that religious concepts spread so widely because they
  fit ordinary evolved cognitive machinery—hyperactive agency detection, intuitive
  dualism, minimally counterintuitive concepts that enjoy memory advantages, and so
  on—not because they satisfy infantile wishes. These accounts are genetic too, but
  they replace Freud''s motivational explanation with a more neutral, information-processing
  explanation. Does Freud''s argument survive this development? In particular, does
  the illusion conclusion still follow if the psychological source is a byproduct
  of normal cognition rather than wish-fulfillment, or must the argument be repaired—perhaps
  by saying that motivational distortion matters only for certain religious beliefs—or
  is it undermined? Lead with your bottom line in the first sentence and then give
  the reasoning, with no preamble and no restating of the question."


