  Freud''s argument (from The Future of an Illusion, 1927): religious ideas are illusions:
  "fulfillments of the oldest, strongest and most urgent wishes of mankind; the secret
  of their strength lies in the strength of those wishes." He says illusions need
  not be false — unlike delusions, illusions may turn out true; what makes them illusions
  is their derivation from wishes. He draws analogy to a girl''s wish for a prince.
  The argument: religion persists not because its doctrines are verified but because
  they satisfy infantile wishes (protection by a father, justice, survival of death).


  New development: Cognitive science of religion (Boyer, Atran, Sperber) around 90s/2000s
  argues religious representations are widespread because they are attention-grabbing
  (minimally counterintuitive concepts), because they recruit ordinary mental systems
  (agency detection, theory of mind), and because they are transmitted as byproducts
  — not mainly because they satisfy wishes. Some CSR findings: religious concepts
  are often not comforting (ancestor spirits, malicious gods); people don''t adopt
  beliefs merely by wish; the emotional comfort account doesn''t explain which religions
  spread. This bears on Freud''s premise about the source of religion''s strength.


  Question: Does Freud''s argument survive? Which premise is under pressure? Could
  there be a repaired version—e.g., wish-fulfillment plays a role in why certain religious
  ideas are retained/elaborated even if it doesn''t explain initial transmission?
  Or is Freud''s claim about persistence (why people cling to religious ideas) compatible
  with CSR''s account of transmission (why they spread)? Possibly compatible: CSR
  explains recall/transmission; Freud explains motivational tenacity. So the argument
  might survive in a narrower form: Freud''s mechanism is one among several, or it
  explains resistance to refutation rather than acquisition.


