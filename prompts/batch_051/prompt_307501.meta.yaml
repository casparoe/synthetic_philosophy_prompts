  Draft:


  "I''m writing a position paper on information cascades and rational herding, and
  before I commit to a structure I want a consistency check. Here is roughly where
  I''ve landed:


  (1) In the standard sequential binary-choice setup with private signals, a rational
  agent may come to disregard her own signal and follow the behavior of predecessors,
  and this should not be described as conformity bias; it''s just update-as-usual.


  (2) The model''s central, well-known implication is that such cascades are fragile:
  once a cascade has started, later actions are uninformative, so a single sufficiently
  informative action or a small but credible public signal can shatter the herd.


  (3) I nonetheless want to use exactly this model to explain how groups become entrenched
  in false beliefs — a bad treatment, a wrong-headed policy, an overvalued asset —
  and I explicitly do not want to invoke sanctions, preference falsification, or groupthink
  to explain that persistence. The staying power is, in my view, a rational-herding
  phenomenon.


  (4) I also hold that reputation-based herding — managers and committee members sticking
  with a consensus because deviating from an ex post correct consensus is punished
  more than following an ex post wrong one — is not an alternative explanation but
  a complement: it makes real-world herds more robust than the pure informational
  model alone would suggest.


  (5) When a cascade goes wrong, I think no individual in it warrants epistemic criticism
  for having followed the herd: each did the right thing with the information available.
  But I do think the outcome is a collective epistemic failure, and that well-designed
  institutions could have prevented it.


  (6) Finally, in practice I treat the longevity and stability of a consensus as evidence
  that the consensus tracks the truth; the longer a market or profession has converged
  on something without public collapse, the more reluctant I am to second-guess it.


  My question: is this package jointly tenable? I don''t know where the strain is,
  if anywhere. Please rank any tensions you find by severity, say what must give and
  what it costs, and flag any apparent tensions that dissolve on inspection — I''d
  rather not give up commitments that only look incompatible."


