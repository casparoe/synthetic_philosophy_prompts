  The asker is maybe a researcher applying herding models. Commitments:


  (1) I accept the core rational-choice model: in sequential choice with private signals,
  there is a point after which a rational Bayesian agent''s action is determined entirely
  by the history of public actions, so that later agents rationally disregard their
  own private information; this is not a bias.


  (2) I also think this model shows that cascades are fragile: because actions stop
  conveying information once a cascade starts, the cascade persists only as long as
  no new, sufficiently strong piece of public evidence arrives; a single unusually
  informative action or credible disclosure can reverse it.


  (3) On the application side: I take the model to explain how groups can end up confidently
  wrong — e.g., how a product, treatment, or policy can become entrenched even though
  most people''s private evidence was negative — and I treat this as a consequence
  of the same model, not a separate conformity story.


  (4) But I also believe it is often rational for agents in a cascade, especially
  in reputation-sensitive settings (markets, committees), to stick with the herd even
  after they see moderately strong counter-evidence, because deviating risks looking
  bad if the herd was right; I see reputation-based herding and informational cascades
  as complementary, not competing.


  (5) Normatively, I''m inclined to think that when we see a cascade go wrong, no
  individual agent deserves epistemic criticism: each person updated correctly on
  the limited information available. Yet I also want to hold that the group''s having
  gone wrong is a failure of collective rationality that someone (perhaps an institution)
  should have prevented.


  (6) More strongly, I think the same observation that makes cascades fragile (actions
  after the cascade starts are uninformative) also implies that once an information-induced
  cascade is underway, almost none of the subsequent conformity is evidence of anything;
  from the outside, a long stable herd and a one-minute-old herd are epistemically
  on a par. And yet I think length and stability of a consensus do increase my (and
  others'') confidence that the consensus is right.


