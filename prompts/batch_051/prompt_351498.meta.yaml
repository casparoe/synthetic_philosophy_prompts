  I''m a third-year undergrad in a course on theories of wisdom, and we just read
  Aristotle''s Nicomachean Ethics Book VI about phronesis (practical wisdom) being
  a virtue that can''t be learned from rules alone, but is gained through experience
  in particular situations. Our professor mentioned that universities used to aim
  at something like wisdom but now almost everything is a credential or skill. Then
  a friend told me about a proposal: the philosophy department is thinking about replacing
  the standard intro ethics final paper with a "practical wisdom practicum." Students
  would keep a weekly decision journal about some non-trivial real-life choice they
  faced (whether to break up, transfer, confront a friend, report cheating, etc.).
  At the end of term, a panel of two faculty and one trained "community elder" (like
  a retired social worker or judge) conducts a 45-minute interview with each student.
  They assign a grade of "wise" or "not yet wise" based on whether the student shows
  what they call "integrative judgment": naming the relevant moral features, seeing
  the situation from multiple perspectives, acknowledging uncertainty, and taking
  responsibility for what they could have done. The journal is private; only the student
  and panel see it. There''s no rubric beyond a nine-point list of "signs of practical
  wisdom" written by the department. The department claims this is a real assessment
  of wisdom, not just ethical knowledge.


