  "John Stuart Mill, in the fifth chapter of On Liberty, defends a distinction between
  the state''s obligation to ensure that children are educated and the state''s power
  to direct how they are educated. He holds that the state may compel parents to see
  that their children receive a certain kind of education, but that it should not
  itself deliver or dictate that education, because doing so would be a step toward
  despotism over the mind. The relevant claim, in paraphrase, is that a general state
  education is a mere contrivance for moulding people to be exactly like one another,
  and that it is not legitimate for the state to use its power over the minds of the
  young in that way, except to establish a common minimum that all parents must meet
  through whatever schooling they choose.


  Treat that passage as the shared reference point. Suppose two thoughtful opponents
  are brought together for an adversarial collaboration about school choice, private
  schools, and homeschooling. One, call her the pluralist, reads Mill as supporting
  a system in which the state ensures a floor of knowledge through external exams
  but leaves the content and organization of schooling to parents and voluntary associations;
  she thinks public funding should follow the child to any school, including religious
  and homeschool collectives, so long as the common exam is passed. The other, call
  him the common-school egalitarian, reads Mill as still allowing the state to set
  a substantial common civic curriculum, and argues that if the state funds only pluralistic
  private providers it will fail to guarantee a shared background, so the state should
  run its own schools as a democratic default while allowing private alternatives
