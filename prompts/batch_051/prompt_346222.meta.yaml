  - Criminal guilt (kriminelle Schuld): crimes are acts capable of objective proof;
  jurisdiction/authority: the court.

  - Political guilt (politische Schuld): involves the deeds of statesmen and the citizenry
  of a state, by virtue of which everybody has to bear the consequences of the deeds
  of the state whose power governs him and under whose order he lives; jurisdiction:
  the power and will of the victor.

  - Moral guilt (moralische Schuld): for deeds I as an individual commit, including
  political and military actions; jurisdiction: my own conscience.

  - Metaphysical guilt (metaphysische Schuld): there is a solidarity among human beings
  as such that makes each co-responsible for every wrong and every injustice in the
  world, especially for crimes committed in his presence or with his knowledge; if
  I fail to do whatever I can to prevent them, I am guilty; jurisdiction: God alone.
  It''s about ignoring evil, not risking one''s life.


