  Revised draft:


  ---


  I have a settled epistemic policy for reading work on the origins of farming, and
  I want a verdict on whether the policy is defensible or is just a bias wearing a
  methodology.


  The policy concerns declension claims: the claim, associated with Jared Diamond
  and many others, that the adoption of agriculture was on balance a mistake — worse
  health, shorter lives, longer labor, and the first durable inequality, in exchange
  for more people living under harsher conditions. When I encounter such a claim,
  I do not begin from neutrality. I begin from the assumption that I am probably reading
  a projection of modern discontent onto prehistory, and I impose three demands before
  I will treat the claim as history.


  First, I require the comparison to be prospective and local. The claim should concern
  a particular population that actually made the transition, so that health can be
  compared before and after in the same place — teeth, stature, bones, workload —
  rather than by contrasting one region''s foragers with another region''s later farmers,
  since the two populations differ in too many other respects for the comparison to
  bear the weight.


  Second, I require a stated counterfactual. The author has to say which continuing
  option of foraging was realistically available to those people at that time, and
  why they nonetheless passed the point of no return if the new equilibrium was worse.
  A one-time mistake is not the same thing as an ongoing trap; the author has to show
  the ratchet, not just the fall.


  Third, I treat the moral timbre of the narrative as evidence about the author. To
  the extent that a text reads as an indictment of farming, sedentism, or civilization
  generally, I lower my credence in its empirical claims. I justify this to myself
  by noting that our own disaffections are precisely what would manufacture a lost
  golden age, and that the older story of farming as pure progress is now too naive
  for serious people to assert, so the romantic inversion meets almost no critical
  resistance.


  The effect of this policy is that I find most of the farming-as-trap literature
  unconvincing, and I am content to remain agnostic about the whole question on the
  grounds that the evidence that would settle it is mostly not the kind that survives
  burial.


  My question is whether this policy is tracking the evidence or merely guaranteeing
  a conclusion. Is it defensible as a standing habit? If parts of it are worth keeping,
