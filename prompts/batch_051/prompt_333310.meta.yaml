  ---


  I have a settled policy when I read work on the origins of farming, and I want to
  know whether it is defensible or just a bias with a methodology attached.


  The policy is this. When an author claims that the adoption of agriculture was a
  net loss — worse health, shorter lives, harder work, the invention of durable inequality,
  Diamond''s famous worst mistake and so on — I do not start from neutrality. I start
  from the assumption that I am reading a declension story, a fall from an original
  affluence, and I place on it three demands before I will treat it as a historical
  claim rather than a piece of modern discontent projected onto prehistory.


  First, I require the comparison to be prospective and local. The claim has to be
  about a particular population in a particular place who could have continued foraging
  but did not, and whose stature, teeth, bones, and burial goods can be compared before
  and after the transition. I discount any use of a comparison between one region''s
  foragers and another region''s later farmers as evidence about what the transition
  cost, because the two populations differ in too many other ways.


  Second, I require a stated counterfactual. The author must say what the realistic
  forager option was for those people at that time, not compare actual farming with
  an idealized composite of forager life. If the story is that farming locked people
  into worse lives, the author also has to say how the choice got made and then became
  hard to reverse, since a one-step mistake is not the same as an ongoing mistake.


  Third, I treat the emotional color of the narrative as relevant evidence, but only
  about the author. To the extent that a book or essay reads as an indictment of civilization
  or as an argument for the moral superiority of mobile, small-scale, low-growth societies,
  I lower my credence in its archaeological claims. I tell myself this is correct
  because our own political dissatisfactions are exactly what would produce a golden
  age in the deep past, and because the countervailing narrative — that farming was
  pure progress — is now too stupid for serious people to hold, so the romantic inverse
  meets little resistance.


  The concrete result is that I find myself unconvinced by most of the literature
  that says farming was a trap, and I am comfortable remaining agnostic on the whole
  issue because the evidence we would need to settle it is, in my view, mostly not
  the kind of thing that survives.


  The question is whether this policy is tracking the evidence or whether I have built
  a filter that guarantees a conclusion. Is it defensible as a standing epistemic
  habit, or should I abandon it? And if the benefits are worth keeping, what would
  a restated version of the policy look like — one that keeps me from being taken
  in by declension stories without making me ignore the cases where a genuinely worse
  equilibrium can win and lock in?


  Give me a committed answer. Say plainly whether the policy, taken as a policy, is
  defensible, indefensible, or defensible only in an amended form that you specify
  — and defend that verdict instead of laying out options for me to choose between.


