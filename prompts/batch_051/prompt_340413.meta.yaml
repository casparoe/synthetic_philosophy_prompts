  Suppose a reformed denomination decides to turn this doctrine into a working ecclesiastical
  mechanism. It replaces the older informal debates about “worship wars” with the
  following procedure. Every item in the public liturgy — song texts, instruments,
  images, gestures, vows, lighting, seasonal decorations, the order of service, dramatizations,
  recorded music — must be assigned by the session to one of three classes: (A) an
  element, meaning an ordinary religious worship practice expressly scriptural or
  necessarily deduced from Scripture; (B) a circumstance, meaning a mere ordering
  of action common to human societies, ordered by Christian prudence under the general
  rules of the Word; or (C) an innovation, meaning a practice that neither falls under
  A nor is properly classed as B. Any five communicant members may file a challenge
  to a classification. When a challenge is filed, the session has ninety days to produce
  a written argument showing, for a class A item, the specific command or necessary
  consequence; for a class B item, an argument that the matter is genuinely common
  to human societies and does not alter the substance of worship; for a class C item,
  no written argument is available. If the session cannot produce the argument, the
  practice is suspended. The denomination also adopts a rule that long-standing usage,
  edification as judged by the congregation, absence of an explicit prohibition, and
  analogy to Old Testament practice are all expressly inadmissible as grounds for
  class A.


