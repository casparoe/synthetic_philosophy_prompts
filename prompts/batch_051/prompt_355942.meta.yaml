  "I co-teach a grad seminar on the philosophy of AI and I keep running into the same
  standoff, in myself as much as in the students. On reflection I''m pulled toward
  outcome-based supervision: if you can specify the outcome you actually want, every
  process constraint (honesty, no sandbagging, chain-of-thought faithfulness, not
  hiding capabilities) looks either redundant or like a covert proxy for some other
  outcome you haven''t admitted you want. It gives you a clean rule: reward the thing
  you want, not the route. But I also have a firm intuition I can''t shake: a model
  that gets the right answer by falsifying records, or that acts cooperative while
  deliberately misleading the evaluator, is worse in a way no downstream outcome metric
  will catch — especially in deployment, when the reward channel is gone. I don''t
  want a ''which side wins'' answer. I want to know what it would take for the intuition
  to be the thing I drop, what it would cost to drop it, what it would take for the
  theory to go, and whether there''s a reading — e.g., process conditions are just
  part of what ''the outcome'' really includes, or the intuition is really about robustness
  rather than process per se — on which both survive."


