  as it develops from Kant through R. M. Hare and Marcus Singer, and being explicit
  about the differences among the following rather than collapsing them: (1) Kant''s
  contradiction-in-conception test, where a maxim cannot even be thought as a universal
  law because the practice it presupposes would be undermined if everyone followed
  it; (2) Kant''s contradiction-in-will test, where the maxim can be universalized
  coherently but an agent could not rationally will the resulting world; (3) Hare''s
  prescriptivist version, where a moral judgment is a prescription I must be prepared
  to accept for all relevantly similar cases, so the test is partly about whether
  I can sincerely prescribe the universalized judgment given my actual preferences
