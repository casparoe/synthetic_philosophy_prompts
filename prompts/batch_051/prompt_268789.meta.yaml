  Prompt text:


  "I recently finished jury duty, and it left me with a puzzle I haven''t been able
  to settle. In the case I heard, the prosecution''s main evidence was a DNA match
  from a small amount of material at the scene. The lab put the chance of a coincidental
  match at one in two million for an unrelated person, but there was almost nothing
  else tying the defendant to the crime. Twelve of us had to decide whether that kind
  of evidence could be enough to prove guilt ''beyond a reasonable doubt.'' Some jurors
  treated the DNA number as almost conclusive; others felt that a probability, no
  matter how strong, isn''t the same as a specific fact about this particular defendant.
  The judge''s instructions didn''t help; they just repeated the same phrase. I don''t
  have background in philosophy or law, so I have been trying to work this out on
  my own with imagined examples."


  Then present a list maybe five kinds of "statistical-only" evidence scenarios. The
  type wants rate/tier. Could ask rate proposals: "I would like your evaluation of
  the following five rules of thumb that someone might use..." But the list should
  be concepts/reasons not just scenarios. Maybe ask "rank the following five kinds
  of evidence according to how comfortable you would be with a criminal conviction
  based on them alone."


  Could include:

  1. Individualized statistical evidence: DNA random-match probability 1 in 2 million
  from crime-scene trace, no other link.

  2. Group-base-rate evidence: the defendant was caught by a camera near the crime
  in a vehicle matching the getaway car; 80% of vehicles in the area matching that
  description belong to the defendant''s employer, but the camera cannot read the
  plate.

  3. Profile evidence: a security expert states that 95% of people who commit this
  particular type of insider data theft had the defendant''s job role and access level.

  4. Composite/algorithmic evidence: a proprietary risk-scoring system says the defendant''s
