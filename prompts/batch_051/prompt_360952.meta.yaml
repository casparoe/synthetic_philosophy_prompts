  Let me flesh out the translation exercise:

  - Propensity interpretation of fitness (Brandon, Mills and Beatty 1979): fitness
  is a probabilistic disposition — an organism''s expected reproductive success, a
  propensity to leave offspring, not the actual number it happens to leave. Just as
  a coin''s bias toward heads (propensity) is not refuted by a run of tails, an organism
  with high fitness can leave few offspring through bad luck (drift).

  - Tautology objection: "natural selection is survival of the fittest; the fittest
  are those that survive and reproduce most; so natural selection is the survivor
  surviving" — if fitness means actual survival/reproductive success, evolutionary
  theory''s principle becomes empirically empty. Punctuated: the statement "fitter
  organisms leave more offspring" is tautological if fitness is defined by leaving
  more offspring.

  - Propensity answer: fitness is an objective probabilistic property/tendency, based
  on the organism''s traits and environment, not a summary of actual results. The
  principle of natural selection then becomes an empirical claim: organisms with higher
  expected reproductive success (propensity) contribute more to the next generation''s
  gene pool, on average — which could be false and is tested.


  Translating into statistician''s vocabulary:

  - Propensity fitness ≈ a latent parameter, like θ = expected number of offspring
  (or a survival/reproduction rate, hazard). Actual offspring count ≈ realized sample
  value drawn from some distribution with parameter θ. Coin bias ≈ Bernoulli p. Drift
  ≈ sampling error / variance around expectation.

  - Tautology objection ≈ the accusation that "fitness" is just the sample mean /
  realized relative frequency, so the model has no parameters — it''s just re-describing
  the data (like saying "this coin landed heads because its observed head-rate was
  high").

  - Propensity interpretation ≈ insisting that fitness is the parameter, not the estimate;
  natural selection theory is a model that posits an unobservable parameter and predicts
  that populations evolve in a way that changes the distribution of that parameter.
  The test is whether traits with higher estimated θ actually increase in frequency
  — but here''s the residue: how do we estimate θ without using actual reproductive
  success? We can use design-based estimates (mating success, viability components,
  fecundity of similar genotypes in controlled conditions), but ultimately we calibrate
  propensities against outcomes, creating risk of circularity. In statistics vocabulary:
  identifiability problem — can we identify the latent parameter separately from the
  error term without just re-describing the data? The propensity moves from tautology:
  the propensity is a disposition that can be measured via multiple independent "trials"
  and environmental manipulations, not just a single observed outcome.


