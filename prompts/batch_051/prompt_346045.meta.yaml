  From LessWrong/analysis: The unilateralist''s curse applies to "initiatives that
  carry some risk but that any individual can unilaterally undertake." It has two
  strands:


  1. The first (from Bostrom''s "In Praise of Conformity"?) is about "the unilateralist''s
  curse": If a group of agents can each unilaterally do X, and the agents hold different
  probabilities about whether X is good or bad, then the probability that at least
  one does X can be high even when the group as a whole (aggregating information)
  would assign low expected value. Example: 10 people each have a 5% chance of correctly
  thinking X is good? Actually if each individual has some probability of making a
  mistaken positive judgment, and any positive judgment triggers action, the chance
  of action by someone is 1 - (1-p)^n, much higher.


  The "everyone else defers" bit: Suppose each agent initially decides whether X is
  a good idea. If an agent thinks X is a bad idea, she doesn''t do it. But she may
  still reason that someone else with a different view may do it. Should she act to
  stop them? Not directly. So "rationally defers, since someone else probably will
  anyway" perhaps confuses the curse with "diffusion of responsibility"/the bystander
  effect or with "tragedy of the commons"? Actually, "everyone else rationally defers"
  could describe a different problem where each waits for another to take a good action.
  In the unilateralist''s curse, the problem isn''t deferral; it''s that the most
