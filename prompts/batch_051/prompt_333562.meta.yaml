  The "proves too much" argument could be:

  (1) Bad thought makes language bad, and bad language makes thought bad, each intensifying
  the other indefinitely.

  (2) Every natural language is carried by a community whose thought and language
  have already been shaped by this loop for generations; none of us starts fresh.

  (3) So for any speaker of an existing language, their thought is already partly
  corrupted by the language they inherit.

  (4) To detect and fix the corruption, they''d have to use their corrupted thought
  to decide which habits are bad — but the corruption distorts exactly the judgments
  needed to spot it.

  (5) But Orwell himself claims the process is reversible and that one can get rid
  of the bad habits "if one is willing to take the necessary trouble."

  (6) Given (1)–(4), the necessary trouble can''t be done from inside the loop; only
  someone already outside the corruption could do it, and no one is.

  (7) Therefore Orwell''s essay is self-defeating: if its own diagnosis is right,
  neither Orwell nor his readers are in a position to carry out the prescribed cure;
  if the cure is possible, the diagnosis can''t be as total as step (1) says.


