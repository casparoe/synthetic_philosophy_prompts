  My opening challenge: You argue in that chapter that a person who lets the world
  choose his plan of life has no need of any faculty except the apelike one of imitation.
  But that seems to trade on an unexamined contrast. Human imitation is not mere mimicry;
  it is selective, cumulative, and often intelligent—people copy what works, adjust
  it to their circumstances, and pass on improvements. A conformist can be an active
  discriminator among social models, not a passive ape. If that is right, why should
  I call conformity a failure of development rather than a sensible use of a distinctively
  human capacity? Defend the sentence."


