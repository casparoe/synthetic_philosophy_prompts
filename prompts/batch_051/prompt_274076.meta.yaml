  Prompt:


  "In arguments about existentialism I keep noticing a dialectical pattern I don''t
  have a word for, and I''d like to know whether it has an established name, and if
  not, to have it named and circumscribed.


  The pattern goes like this. A critic attacks ''existence precedes essence'' as self-defeating:
  if humans have no fixed nature, that very fact looks like a fixed fact about human
  nature, so the slogan seems to assert the essence it denies. The existentialist
  replies that the objection trades on two senses of ''essence'': the slogan denies
  only a built-in, definitional nature, not the kind of self-made nature that accrues
  through choice. The critic then points out that under this two-senses reading the
  slogan stops being radical — everyone can grant that you are not born with a complete
  blueprint, and the whole dispute was supposed to be about whether there is a deeper
  character — good faith, radical freedom, what-have-you — that conditions what you
  can make of yourself. At this point, rather than resolving, the conversation usually
  circles: the strong anti-essentialist claim reappears a few turns later, and the
  two-senses defense is redeployed whenever it is challenged.


  I have also seen the mirror image: the critic allows the weak reading for purposes
  of the argument, draws conclusions that only follow from the strong one, and when
  pressed, insists they never denied the weak reading. The two sides seem to share
  one slogan and two propositions of very different strength, and the phrase ''essence''
  is doing different work each time it is used.


  Is there an established name or literature for this particular standoff — an incoherence
  charge that is answered by a two-senses distinction, where the distinction either
  collapses the claim into triviality or is quietly abandoned later, so that the slogan
  survives without ever having been defended in a single fixed sense? If there is
  no standard name, I''d like you to propose one. Either way, I care less about the
  label than the carving: define the phenomenon precisely, distinguish it from ordinary
  equivocation and from the weaker-claim retreat often called motte-and-bailey, and
  say what test would tell whether a given use of a two-senses distinction is a legitimate
  clarification rather than an instance of this pattern.


  Please structure your answer in four sections:

  (1) Nearest established concepts (about 200 words): identify the closest named phenomena
  (e.g., motte-and-bailey, equivocation, persuasive definition, and any specific term
  from existentialism scholarship you know) and note what each captures and misses.

  (2) Precise definition (about 250 words): state whether the pattern has a standard
  name; if not, propose a name and define it, specifying the roles of the strong claim,
  the weak claim, the slogan, and the two-senses defense.

  (3) Discrimination rules (about 250 words): give criteria for distinguishing this
  pattern from plain equivocation, from a legitimate distinction of senses, and from
  motte-and-bailey; include a concrete test or diagnostic question for each.

  (4) Application to the existentialism case (about 200 words): apply your definition
  to the ''existence precedes essence'' dispute and say whether, by your own criteria,
  the two-senses defense in that debate is usually a clarification or an instance
  of the pattern."


