  Possible quiz design: "Which digital mind moral status position do you actually
  hold?" Questions to include:


  1. A hypothetical: perfect whole-brain emulation ("WBE") of a consenting adult running
  on carbon or silicon. Does it have the same moral status as the original? Options:
  yes, identical computation; yes but only if it''s conscious, and we can''t verify;
  no because no biology; etc.


  2. An AI trained via reinforcement learning that reliably avoids states that correlate
  with damage to its own hardware and "protests" when you interrupt it; its creators
  never programmed explicit pain. Does that create a reason not to cause those states?
  Options: yes if the behavior is the right kind; no without qualia, which we can''t
  infer; only if we can verify consciousness; etc.


  3. A digital mind that''s a perfect copy but can be restored from backup after deletions:
  does "killing" it matter less because nothing unique is lost? Options: yes, because
  identity/persistence allows restoration; no, each instance matters; it matters differently
  (copy ethics).


  4. A mind running 10,000x slower (so its subjective year is our century). Do our
  duties to it scale with its clock speed? Options: duties to subjective time; duties
  to objective wall-clock time; no duties at all.


  5. A whole brain emulation of a nonhuman animal (e.g., a pig) vs. a from-scratch
  AI that passes all tests a human does. Which matters more? Options: depends on capacity;
  depends on origin/continuity; both equal if same computations; neither.


  6. A deterministic lookup table that maps every possible sensory input to motor
  output and, when fed a scripted "conversation," outputs exactly the same strings
  a human would. Is it a moral patient? Options: no, it''s a lookup table without
  the right causal structure; yes, indistinguishability from outside is all we have;
  no, because it lacks a unified self/valence; maybe, if it has preferences.


  7. A digital mind that can be duplicated. Do you have stronger reasons to create
  duplicates that will lead happy lives than to create one? (population ethics/utility
  monsters) — maybe too much.


  8. A paperclip maximizer with no consciousness but with preferences/goals: does
  it matter that you shut it down, given it "wants" to continue? Options: no, preferences
  without valence don''t matter; yes, any goal-directed system has interests; only
  instrumentally if it affects others.


  9. A human upload that reports being in agony while its virtual facial expression
  is neutral. Does its self-report count decisively, or do we need third-person evidence?
  Options: yes; no; etc.


  10. The "China brain" or "blockhead" case: a population manually passing messages
  to implement a brain''s computation. Does the whole system have moral status? Options:
  yes, same computation; no, no unified subject; unclear.


  Scoring key positions:

  - Substrate-independent computationalism (SIC): same computation, same status; biology
  irrelevant; speed irrelevant (subjective time counts); copies each matter; blockhead
  yes if it actually implements the right causal/computational structure.

  - Biological chauvinism / carbon chauvinism: only biology gives status; emulations
  and AIs lack it regardless.

  - Sentientism / gradualism by capacity for suffering: status tracks evidence of
  valenced experience; copies matter because each has its own valence; simple RL maybe
  not; blockhead no because no valence.

  - Behavioral functionalism/pragmatism: status assigned based on behavior and relationships,
  not hidden internals.

  - Decision-theoretic/instrumental view: treat AI as if it has interests for coordination/decision-theoretic
  reasons, but not because it has intrinsic moral standing.

  - No-moral-status eliminativism: no digital minds matter at all (maybe only humans).


