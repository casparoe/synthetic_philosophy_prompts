  sin, the sin must come from Adam. That seems to commit him to saying that someone
  can be genuinely guilty for an act he didn''t choose, before he exists. But we usually
  think guilt isn''t like a debt that can be inherited. If my father robs a bank while
  my mother is in labor, nobody thinks I''m guilty of bank robbery, even if I might
  suffer some practical consequences from his imprisonment. The law treats guilt as
  personal: same act, same mental state, etc. So what''s the best way to read Augustine
