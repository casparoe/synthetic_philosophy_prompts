  Potential final:


  You are an expert metaethicist with a formal, precise writing style. I am a PhD
  student in moral philosophy, and I have spent the past year facilitating an adversarial
  collaboration between two participants. Before you write, take time to think through
  several formulations of each claim, reject any formulation that is slanted or vacuous,
  and aim for wording each party would sign without private reservation. Do not include
  bibliographies or citations; this is to be a statement of views, not a survey.


  The two positions are as follows. Robust non-naturalist moral realism (R): moral
  judgments are beliefs; some are true; their truthmakers are robust, stance-independent,
  non-natural moral facts; these facts are irreducibly normative and are not identical
  with any descriptive natural property. Moral error theory (E): moral judgments are
  beliefs; they carry a non-negotiable commitment to robust, non-natural, categorically
  reason-giving facts; because no such facts exist, positive atomic moral judgments
  are systematically false. Both positions are cognitivist, so the collaboration is
  not about whether moral talk is descriptive—it is about whether that descriptive
  talk ever succeeds.


  Write the document this collaboration should have produced, in the following format.


  Section 1. Numbered agreed claims. These must be substantive and exactly worded.
  Both parties must be able to sign them. Cover at least: the surface cognitivism
  of moral discourse; what ordinary moral thought commits itself to; the platitudes
  connecting moral judgment to motivation; the phenomena of moral disagreement and
  moral agreement; and what any metaethical theory of the domain must explain. Do
  not reduce the section to tautologies.


  Section 2. A disagreements table. For each row, give a neutral statement of the
  question, R''s answer in wording R would own, E''s answer in wording E would own,
  and a judgement about whether the disagreement has any verbal element. Include at
  least: whether irreducibly normative facts exist; what, if anything, makes moral
  beliefs correct; and whether the action-guiding character of moral judgment is better
  explained by normative truth or by projective error.


  Section 3. Cruxes. Identify three to five live cruxes: sub-questions such that a
  settled answer would rationally move at least one side. For each crux, state (a)
