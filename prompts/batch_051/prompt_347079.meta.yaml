  I''m a novelist, so I spend a lot of time deciding what characters believe and when
  they''re right. A few months ago I fell into a book about deflationary theories
  of truth, and since then I''ve been using a rule in daily life: I don''t let "is
  true" do any work. If someone says, "It''s true that the money was wired on Tuesday,"
  I translate it in my head to "the money was wired on Tuesday," and I respond to
  that. If someone says a whole story is true, I push them to tell me the sentences,
  and I check those one by one. My thesis is that "true" is just a handy way of endorsing
  a sentence without repeating it, and treating it like a real property makes people
  think there''s some deeper fact out there doing the representing. But I noticed
  the rule breaks in a few places. The other day my agent said, "Whatever the accountant
  said about the advance is true," and I couldn''t get past the word "true." I couldn''t
  replace it with the accountant''s sentence because I wasn''t there. So now I''m
  wondering: am I using a shortcut that only works when the sentence is already in
  front of me, and dressing that up as a philosophy? Is there a version of the deflationary
  habit that handles "whatever she said is true" and "the thing you''re about to say
  is true" without secretly admitting that truth is a property? And from the inside,
  how would I know whether I''ve adopted a sensible policy about a word or just a
  stylistic tic that flatters my skeptic impulses?


