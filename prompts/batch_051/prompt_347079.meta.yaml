  I''m a novelist. Lately I''ve been reading about deflationary theories of truth,
  and I''ve adopted a sort of working rule in my own thinking: I no longer treat "is
  true" as naming a real property. Whenever a claim matters to me, I just eliminate
  the truth predicate and deal with the underlying sentence. So if someone says "it''s
  true that the witness lied," I ask "did the witness lie?" and leave it there. I
  find this stops me from reifying "truth" as something over and above the facts.
  But my friend, who''s a philosopher, says I''m dodging a real question: we use "true"
  in cases where we can''t simply repeat the sentence—like "whatever the specialist
  said is true" or "the first sentence of my novel is true." In those cases, eliminating
  "true" isn''t possible. Is my habit defensible as an epistemic policy, or is it
  just a bias toward the easy cases? Can a deflationary habit be restated so it handles
  generalizations and blind ascriptions without reintroducing a full-blown property
  of truth? And how would I know whether I''ve actually adopted a theory of truth
  or just a stylistic preference?


