  ---

  I''ve spent a while in rationalist and EA circles, and I''ve been trying to make
  coherent extrapolated volition into something I can actually apply to ordinary decisions,
  not just to the long-run alignment problem. The usual gloss of CEV — roughly, what
  someone would want after knowing the relevant facts, thinking clearly, and becoming
  more like the person they would endorse being — papers over a lot of cases where
  different kinds of idealization point in different directions, or where the actual,
  present person seems to be the one whose word should be final. I''ve started writing
  down my own verdicts on concrete cases, and I''d like to know whether a single principle
  captures them, or whether some of my verdicts have to go.


  Here are the cases as I find myself judging them:


  1. A person in opioid withdrawal arrives at the emergency department and demands
  discharge so they can use again. During a prior sober period they wrote an advance
  instruction asking to be prevented from leaving during withdrawal, and their current
  demand is, by their own sober account, not what they would want if the craving were
  removed. My verdict: hold them, against their current stated wish. So here the idealized
  preference beats the actual one.


  2. A severely depressed patient with a good prognosis asks to refuse life-sustaining
  treatment. When not depressed, they have consistently said they want to live, and
  clinicians are confident that after treatment they will again want to live. My verdict:
  treat now, even over the patient''s current refusal, provided the refusal is clearly
  a symptom of the depression. Again the idealized preference wins.


  3. A competent adult refuses a safe, effective vaccine because they hold a false
  belief about it that they acquired from unreliable sources. They are not delusional;
  they are reasoning badly about evidence. If they accepted the evidence, they would
  consent, but they don''t. My verdict: do not vaccinate against their refusal; persuade,
  offer information, wait. The actual preference wins, even though it rests on false
  beliefs and would not survive better information.


  4. A woman raised in a conservative religious community that assigns women subordinate
  roles says she freely accepts that role, values the community, and wants to raise
  her daughters within it. Suppose that if she had been raised in a more liberal environment
  she likely would neither accept nor want that role. My verdict: treat her present
  acceptance as authoritative; we should not override or "rescue" her, though her
  daughters should have genuine exit options. This is to say, the preference that
  a different upbringing would have produced does not win over the one she actually
  has.


  5. A seven-year-old insists they want to eat only sweets and skip school. They are
  intelligent but have no stable conception of their later interests. My verdict:
  parents should overrule them. I don''t feel this one is hard — the child''s present
  preference simply doesn''t count for much — so I list it mainly to mark an edge.


  6. A friend is in a relationship with someone who isolates her and slowly erodes
  her confidence. She says she wants to stay, and I''m fairly confident that a year
  after leaving she would describe the staying-want as something she was pressured
  into. My verdict: I would not forcibly intervene or treat her current wish as invalid;
  I''d stay close, voice what I see, and make leaving easier, but the actual preference
  still controls. This feels different from case 1, but I have trouble saying exactly
  how.


  7. A person has been seriously wronged and wants to spend the next month destroying
  the wrongdoer''s reputation, including by publishing true but private details. They
  themselves say, in a calm moment, that they hope to become the kind of person who
  doesn''t retaliate, and they predict they will regret it. My verdict: I would discourage
  them and, if I had the means, refuse to help, but I would not use force or institutional
  power to stop them. Here I''m more unsure than in case 1.


  8. A majority of voters oppose a policy that, by the best available evidence, would
  materially help them and that they would support if they understood its effects
  — not as a matter of values, but as a matter of factual confusion. Suppose I administer
  the relevant program and the legal authority is genuinely ambiguous. My verdict:
  implement the policy only after more democratic process; the present, uninformed
  preference still outweighs the extrapolated one for purposes of governing others.
  This seems to pair awkwardly with case 2 or even case 1.


  The case I keep going back and forth on: I have been offered a job that I currently
  want because of the status and compensation, but I can predict from past experience
  that the kind of person I become in that job, and the preferences that person has,
  are ones I now regard as worse than the preferences I would have if I took a lower-paying
  job with less status. My present self wants the job; my best guess at my extrapolated
  self wants me not to take it. I don''t know which self''s verdict should be authoritative
  for a decision that is partly about which self I become.


  So, my question: is there a principle — perhaps a restricted version of extrapolated
  volition, perhaps something else — that gets all, or nearly all, of these verdicts?
  If some of my verdicts have to go, which ones should I give up first? And what does
  the principle say about my job decision? I''m less interested in a name for the
  principle than in a statement precise enough that I could run the next case through
  it.

