  ---

  I''ve spent some years reading rationalist and EA blogs, and I have been trying
  to turn coherent extrapolated volition (CEV) into something that settles ordinary,
  present-day decisions rather than only the far-future alignment problem. The standard
  gloss — roughly, the preferences a person would have after learning the relevant
  facts, reasoning more clearly, and becoming more the person they would endorse being
  — is much too coarse when I apply it to cases where actual and idealized preferences
  pull apart. I have been writing down my own verdicts on such cases, and I want to
  know whether a single principle captures them, or whether some verdicts should be
  abandoned.


  Here are the cases with the verdicts I actually find myself reaching.


  1. A person in opioid withdrawal demands to leave the emergency department to use
  again. During a prior sober period they wrote an advance instruction saying they
  want to be prevented from leaving under exactly these conditions, and their own
  sober account says the demand is not what they want once the craving is removed.
  Verdict: hold them against their current stated wish. The idealized preference wins.


  2. A severely depressed patient with a good prognosis refuses life-sustaining treatment.
  Between episodes they have consistently said they want to live, and clinicians expect
  that once treated they will again want to live. Verdict: treat them despite the
  current refusal, on the ground that the refusal is a symptom. Again the idealized
  preference wins.


  3. A competent adult refuses a safe, effective vaccine because they hold a false
  factual belief picked up from unreliable sources; they are reasoning badly, not
  delusional. If they accepted the evidence they would consent, but they do not. Verdict:
  do not vaccinate against their refusal; persuade, inform, and wait. The actual preference
  wins even though it rests on a false belief and would not survive better information.


  4. A woman raised in a conservative religious community that assigns women a subordinate
  role says she freely accepts that role, values the community, and wants to raise
  her daughters within it. Suppose that, had she been raised elsewhere, she would
  likely neither accept nor want that role. Verdict: treat her present acceptance
  as authoritative; we should not override or rescue her, though her daughters should
  have genuine exit options. The preference her extrapolated self might have had does
  not beat the one she actually has.


  5. A seven-year-old insists on an all-sweets diet and no school. They are bright
  but have no stable conception of their later interests. Verdict: the parents should
  overrule them. I do not find this hard; I include it only to flag an edge.


  6. A friend stays with a partner who isolates her and gradually undermines her confidence.
  She says she wants to stay, and I predict that a year after leaving she would describe
  the staying-want as something she was pressured into. Verdict: I would not forcibly
  intervene or treat her stated wish as invalid; I would stay close, say what I see,
  and make leaving easy, but the actual preference still controls. This feels different
  from case 1, and I cannot state the difference cleanly.


  7. A majority of voters oppose a policy that the best available evidence says would
  materially help them, where their opposition is factual confusion rather than a
  difference in values. Suppose I administer the relevant program and the governing
  law is genuinely ambiguous. Verdict: do not implement the policy until there has
  been more public deliberation; the present, uninformed preference outweighs the
