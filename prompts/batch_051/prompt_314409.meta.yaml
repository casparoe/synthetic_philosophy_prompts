  The benefit defence: A sweatshop offer is mutually beneficial because the worker''s
  next-best alternative is worse. Therefore, the exchange is not exploitative (or
  at least not wrong). Tempting because: Pareto improvement; worker consents; messing
  with it might make her worse off.


  Criticisms:

  1. Baseline problem: The worker''s actual alternative may be unjustly constrained.
  A Pareto improvement relative to an unjust status quo doesn''t make the transaction
  fair. If the structure of global trade or local poverty is itself the product of
  injustice, then "better than the alternative" inherits that injustice. Exploitation
  is standardly assessed against a fair or moralised baseline, not the worker''s actual
  alternatives.

  2. Unfair share of surplus: Exploitation is not about whether the victim gains,
  but about how the gains are divided and whether one party takes unfair advantage
  of the other''s vulnerability. A transaction can be Pareto-improving and still exploit:
  the employer may capture most of the surplus because the worker''s bargaining power
  is crushed. So mutual benefit doesn''t block the charge.

  3. The intervention problem: even if exploitative, banning sweatshops may harm the
  very people—makes the worker worse off relative to her current situation. So a verdict
  of exploitation doesn''t automatically license prohibition or consumer boycotts.
  One can hold sweatshops are exploitative and still oppose simple bans, favouring
  instead wage-enforcement, trade measures, or improving the worker''s alternatives.


  A first-class answer might also address the circularity worry: if "fair baseline"
  requires knowing what''s fair, and we use it to judge fairness, is it circular?
  A good answer will note that all exploitation judgements need some normative baseline,
  and the benefit defence smuggles in a non-moralised actual-alternative baseline
  rather than justifying it.


