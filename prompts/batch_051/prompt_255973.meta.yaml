  ---


  I''m a Year 12 student at a UK sixth form, and I run my school''s physics society.
  In a fortnight I have to give a twenty-five-minute session to Year 10 and 11 pupils
  (GCSE level: no calculus, and they have never met fields or Lagrangians) on how
  symmetry can explain conservation laws — the conceptual idea behind Noether''s theorem,
  rather than the mathematics. I''m not after the explanation itself; I want a plan
  for how to teach it. The audience currently thinks of symmetry as roughly "a shape
  has mirror lines," and they think of conservation of energy as a fact they memorised
  for a test. My goal is to get them to see that conservation laws can come out of
  symmetries of the world, and that saying "it is conserved because the laws don''t
  care where or when you do the experiment" explains something, rather than just re-describing
  what they already know. The room has a whiteboard and about fifteen pupils; most
  will be polite but some will be there only because their teacher recommended it.


  Please approach this as an experienced physics teacher who has taught this idea
  to non-specialists and knows where it goes wrong. Think carefully before committing;
  if you need to sketch two or three candidate examples in your head before settling
  on the one you''ll build the session around, do that, though only present the chosen
  one.


  In your answer, please use exactly these sections, in this order, with the rough
  lengths indicated:


  1. **Sequence and dependencies** (roughly 250 words): the order in which ideas must
  be introduced, and for each step, which previous step it depends on and why that
  order matters.

  2. **The carrying example** (roughly 200 words): the single concrete scenario or
  image that should carry the whole session; what it must have, what it must not have,
  and why this one rather than the more obvious alternatives.

  3. **Misconceptions and where to head them off** (roughly 250 words): the mistaken
  ideas pupils are likely to arrive with or form midway, and the exact point in the
  sequence where each should be addressed, rather than left to fester.

  4. **Checking it landed** (roughly 100 words): one question or task to put to them
  at the end that would show they have understood the explanatory point, not merely
  learned a slogan.

  5. **Deliberate omissions** (roughly 100 words): the things you would openly refuse
  to explain at this level, and how to say so without making the topic seem closed
  off.


  Finally, please add a short **bottom line** (two or three sentences) saying which
  feature of the session does the most work and what the biggest risk is.


  ---


