  Let me develop the satisficing/simulated annealing parallel.


  Simon''s satisficing:

  - Set aspiration level A.

  - Search sequentially through alternatives.

  - Accept first alternative whose value ≥ A.

  - If after some time/search effort no such alternative, lower A and resume.

  This is a heuristic for choice under bounded rationality/limited search.


  Simulated annealing:

  - Maintain current state x and temperature T.

  - Propose a neighbor y.

  - If f(y) ≥ f(x) (for maximization) accept; else accept with probability exp((f(y)-f(x))/T).

  - Lower T over time according to schedule.

  This is an optimization heuristic with convergence to global optimum under slow
  cooling (for certain schedules).


  Structural parallel: both are search procedures that avoid getting stuck by relaxing
  acceptance standards; aspiration threshold A is analogous to temperature T — higher
  A = more selective; lower A = more permissive. Annealing "lowers temperature" over
  time = satisficing lowers aspiration over time. Both trade off exploration/exploitation
  or aspiration/opportunity cost.


  But differences:

  - Simulated annealing has a well-defined objective function f and can evaluate all
  alternatives; satisficing has unknown utility distribution and costs of search.

  - Simulated annealing''s probabilistic acceptance of worse moves has a specific
  form (Metropolis) that ensures reversibility/stationary distribution and convergence
  properties; satisficing''s threshold lowering is not derived from a guarantee.

  - Satisficing is a stopping rule / choice rule, not a state-transition optimizer.
  It delivers a chosen alternative, not a sequence converging to optimum.

