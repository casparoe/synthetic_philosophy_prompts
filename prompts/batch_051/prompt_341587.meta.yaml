  I run a continuing-education reading group that is closing out the term with Moritz
  Schlick''s essay on the meaning of life. The view I want the poem to carry is his
  central one: that the question "what is it all for?" belongs only to work done as
  a means to an end, and that life''s meaning is not found by discovering some further
  purpose but by entering into activity done for its own sake — activity Schlick calls
  play, understood broadly enough to include absorbed, creative work that has become
  its own reward.


  Please write a poem for this session: a Petrarchan sonnet, in loose iambic pentameter,
  in the voice of a speaker who begins trapped in the "what is it for?" question and
  who, at the volta, stops searching for an external purpose and finds meaning in
  self-contained, absorbed activity.


