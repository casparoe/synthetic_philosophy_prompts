  I have been thinking about Molyneux’s problem, and I’ve arrived at a position I
  want pressure-tested. To keep the target fixed, here is the passage from Locke’s
  *An Essay Concerning Human Understanding* (1689), Book II, Chapter IX, where the
  problem enters the literature:


  [quote]


  I’ve been calling my view “amodal invariant access.” The claim is that tactile and
  visual shape are not two separate ideas of shape that get associated by experience;
  they are two partial, mode-relative presentations of a single spatial invariant.
  A person born blind who can distinguish a cube from a sphere by touch has, I submit,
  already got hold of the invariant itself, not merely a tactile cue. If that is right,
  then the negative answer to Molyneux’s question cannot be explained simply by the
  absence of an arbitrary cross-modal association. The question becomes why the invariant
  is not recognized when it appears in the visual mode.


  My proposal is that an invariant is only available through a sensory mode if it
  is encoded in a mode-appropriate format, and the blind man’s tactile invariant is
  bound up with the dynamics of active haptic exploration—pressure, contour, resistance,
  the way the object forces his hand. Visual shape, by contrast, requires an on-the-fly
  interpretation of a static two-dimensional projection, with lighting and occlusion
  resolved through priors he does not yet have. So he fails, but he fails because
  the invariant he possesses is format-locked to touch, not because the two senses
  have merely failed to be calibrated. I think this also predicts that a person who
  was born blind but somehow able to see a three-dimensional shape from all sides
  under perfectly informative viewing conditions would do better than Locke expects,
  because the visual system would be given enough to construct the same invariant
  without the usual learned priors.


  Assess this. Is the distinction between missing mappings and format-locked invariants
  coherent, or is it just redescription? Does it already exist under some named position?
  And where does it break—especially the prediction about ideal viewing conditions?
  Give me a committed verdict, not a survey of possibilities.


