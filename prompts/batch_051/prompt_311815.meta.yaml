  Let''s craft:


  "Locke reports Molyneux''s problem and endorses the negative answer. I have a theory
  about why the negative answer is less obvious than it looks. I call it ''cross-modal
  invariant access.'' The idea is: tactile and visual shape are not two separate ideas
  of shape; they are two partial accesses to a single shape-invariant. A born-blind
  person who can feel a cube has already grasped that invariant in the tactile mode.
  If that is right, then the first sight of the cube should make the same invariant
  available, not because the subject has learned an arbitrary mapping, but because
  the invariant itself is amodal. So the question becomes: what would have to be true
  for the subject to recognize an identical invariant through an unfamiliar mode on
  first exposure? My answer is: recognition would require that the invariant be encoded
  in a format that is not proprietary to touch, and that the visual system be able
  to compute that encoding directly from the retinal image. I suspect that this is
  false for 3D shape, because the tactile invariant is a dynamic, haptic-geometric
  object and the visual system does not output that object without learned priors.
  So I predict Molyneux''s man would fail, but not for Locke/Molyneux''s stated reason.
  Their reason is that he lacks experience of ''how a globe affects sight''; mine
  is that his tactile invariant is formatted for touch and the visual system would
  need to solve for it fresh."


