  Fitch theorem: If all truths are knowable: (1) ∀p (p → ◇Kp). Consider any proposition
  q that is unknown: q ∧ ¬Kq. This is a truth if q is true and unknown. By (1), ◇K(q
  ∧ ¬Kq). In some possible world, K(q ∧ ¬Kq) holds. Knowledge distributes: Kq ∧ K¬Kq.
  Since knowledge is factive, K¬Kq → ¬Kq. Contradiction Kq ∧ ¬Kq. So no world where
  K(q∧¬Kq); hence ¬◇K(q∧¬Kq). By (1), q∧¬Kq can''t be true, so if q true then ¬(q∧¬Kq),
  i.e., q → Kq. Thus all truths are known.


