  Domain choice: Fitch''s paradox of knowability. Let me ensure my content is correct.


  Fitch''s paradox: from the claim that all truths are knowable (∀p(p → ◇Kp)) to the
  claim that all truths are known (∀p(p → Kp)) — via the assumption that there is
  an unknown truth, p ∧ ¬Kp, which by the knowability principle is knowable: ◇K(p
  ∧ ¬Kp). But knowledge distributes over conjunction: K(p ∧ ¬Kp) implies Kp ∧ K¬Kp.
  K¬Kp implies ¬Kp (factivity of knowledge), so Kp ∧ ¬Kp, contradiction. Therefore
  no unknown truths; so if all truths are knowable, all truths are actually known.
  Or at least the anti-realist/verificationist principle collapses.


  Actually formal details: K(p∧¬Kp) → Kp ∧ K¬Kp. Factivity: K¬Kp → ¬Kp. But note:
  Kp and ¬Kp contradiction. Yes.


