  ---


  I''m a PhD student in moral philosophy, and I''m putting together a taxonomy of
  the arguments offered for the claim that partiality to particular others — one''s
  child, one''s partner, one''s friends — is not merely an inescapable bias that a
  correct moral theory should tolerate and then contain, but a legitimate or even
  obligatory feature of moral life. As I read the literature, the standard arguments
  are these:


  1. The integrity argument: a life stripped of the ground projects and commitments
  that make it a particular person''s life makes the impartial standpoint itself unintelligible;
  a morality that demands persons to view their deepest attachments as mere inputs
  to impartial calculation alienates them from the very self on whose behalf the morality
  is supposed to reason.


  2. The constitutive attitude argument: the partial concern one has for a child or
  a partner is not an external pressure on love or friendship; it partially constitutes
  those relationships. A parent who felt they had to determine, through impartial
  reasoning, whether saving their own child rather than a stranger was permitted would
  not be expressing a more correct moral motivation but a failure to have the relationship
  at all in the full sense.


  3. The special obligations argument: relationships like parenthood, friendship,
  and promising generate deontic reasons that do not have to be derived from impartial
  considerations; they are as basic as the obligations of beneficence, and a theory
  that refuses to register them has simply left out a category of moral fact.


  4. The care-ethics argument: impartial deliberation abstracts from the situated,
  responsive attention to a particular other that is a distinct form of moral thought.
  To treat impartial justice as the only fundamental moral orientation is therefore
  to demote care — and with it, partiality — without argument.


  5. The epistemic division-of-labor argument: agents are radically better informed
  about the wants and needs of those near them; a scheme in which each person directs
  most of their finite attention to a small circle serves even the impartial good
  better than a scheme in which each tries to act as a microcosm of the impartial
  standpoint.


  6. The prerogative argument: even strongly impartial theories standardly allow individuals
  a protected space in which their own projects may count for more than the impersonal
  good; once this much is granted, refusing an analogous protected space for concern
  for one''s intimates while retaining it for oneself looks arbitrary.


