  The argument was about Michael, who is four years into a PhD he says he no longer
  wants and no longer expects to use; he is miserable, and yet he leans toward finishing,
  in part because he cannot stand the thought of the four years having been for nothing.


  Daniel said the case is a textbook sunk-cost fallacy. The four years are gone no
  matter what Michael decides, so a rational decision compares only the future path
  of finishing against the future path of quitting from now; backward-looking reasons,
  like ''those years must not be wasted,'' have no place.


  Priya said Daniel had drawn that comparison too coarsely. From now, finishing has
  one year of cost left before it yields a credential, a narrative of completion,
  and an identity as someone who finished; quitting means those same years come to
  count as a failed preparation. Those are all future consequences of the options,
  and the fact that he is four years in is exactly what makes them cheap or costly.
  So even comparing only the future, the past can enter through the way it shapes
  future costs and meanings.


  Daniel answered: granted, but that is not what Michael says when he defends staying.
  Michael says ''I can''t let those years be for nothing,'' which is a reason aimed
  at the past, not at the future. A completed narrative is one thing; grief over an
  unredeemed investment is another, and only the first is a reason.


  Priya said this distinction is too sharp to survive contact with real choice. A
  completed narrative just is, for that kind of person, what redeems the years. If
  Michael would experience the same facts as more coherent, less regrettable, and
  less identity-damaging if he finishes, then his preference is a preference about
  future states, and Daniel has not shown it is irrational; he has only shown that
  it is psychological rather than financial.


  Daniel said the very fact that the preference is psychological makes it suspicious.
  Preferring a flattering story about one''s past is itself a taste, and tastes formed
  under loss aversion can be questioned. If someone would spend a fifth year of misery
  to buy a less painful account of years one through four, we should ask why the less
  painful account must be bought at that price rather than achieved by re-narrating
  the past. Quitting lets him retell the four years as a costly way of learning what
  he does not want; it does not force him to count them as useless.


  Priya said that retelling only works up to a point; he will know he left an open
  promise unfinished, and self-respect is built on being able to finish things past
  the point where they stopped feeling good. If he contracts the habit of quitting
  when the local cost-benefit ledger turns negative, he may buy a better marginal
  decision now at the cost of becoming a person he trusts less.


  Daniel answered that this is the strongest point he has heard, but it is a policy
  argument, not a reason for this decision. If the worry is becoming a serial quitter,
  Michael should decide on a forward-looking rule about when persistence is worth
  it; he should not treat this particular past investment as a reason. Using the four
  years here to make the decision sticky is just having the sunk-cost fallacy do the
  work of a commitment device.


  Priya said that a commitment device you did not choose in advance should not work,
