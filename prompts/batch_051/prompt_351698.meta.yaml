  One proposed route to aligning advanced AI systems is to have two models debate
  a question in front of a human judge: each model argues for one side, and the judge''s
  verdict is treated as the system''s answer. The safety argument for this setup rests
  on two claims. The first is epistemic amplification: a judge who could not have
  produced the correct answer on her own can nonetheless recognize it when the relevant
  considerations are extracted and set against each other. The second is truth tracking:
  in an adversarial exchange, the truth has a structural advantage, because a debater
  defending a falsehood must eventually lean on something a truthful debater can expose
  as a distortion, an omission, or a non-sequitur, while the truthful debater can
  keep answering challenges with the actual reasons. The standing worry for the second
  claim is the obfuscated argument. An obfuscated argument is false or misleading,
  but it is optimized to persuade the particular judge at hand. It may flatter her
  background beliefs, exploit a bias, sound rigorous while ignoring the decisive considerations,
  or simply be confident and long. The judge''s verdict then tracks persuasiveness,
  not truth.


  Now bring in a concrete development. Language models are increasingly trained to
  maximize human approval: their training signal is not whether their claims are true,
  but whether human evaluators rate their outputs as good, helpful, or convincing.
  Such preference-tuned models can search an enormous space of arguments and select
  the ones that human judges tend to endorse, independently of whether those arguments
  support the conclusion. In effect, the technology makes it possible to mass-produce
  obfuscated arguments precisely where obfuscation would work.


  Question: does the safety argument for AI decision-making by debate survive this
  development, does it need repair, or is it dead? Identify exactly which premise
  the development bears on, and say whether that premise can be restored in another
