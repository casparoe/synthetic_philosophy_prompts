  The standard dichotomy: some things are up to us (judgment, impulse, desire, aversion)
  and others not (body, property, reputation, office). Modern revival (Irvine): trichotomy
  — things we have no control over, things we have complete control over, and things
  we have partial control over. The Stoic move is to say "we have complete control
  over our judgments and choices, none over outcomes." But this is often criticized:
  even our judgments and impulses are not fully "up to us" — they''re shaped by habit,
  education, circumstance. So a homemade theory could refine "up to us" into two components:
  "proximate authorship" (the act of assent in the moment) and "ultimate authorship"
  (the formation of the character that makes that assent easy or hard). The Stoics
  care about proximate authorship for therapy; ultimate authorship is what we build
  through practice. Call it "the two control points" or "control as a craft, not a
  possession."


