  The professor''s homemade theory: "proximate control" vs. "formative control." Definition:
  An act is proximately up to me iff at the moment of acting I could have assented
  or withheld assent. It is formatively up to me iff my present proximately-up-to-me
  choices can, over time, alter the dispositions that make future assents easy or
  difficult. Central claim: The dichotomy of control is not one binary; it''s two
  overlapping domains, and most of the interesting work (self-cultivation, responsibility
  for character) is in the overlap: what is formatively but not yet proximately up
  to me. Example: A sudden resentment arises; whether I feed it or let it pass is
  proximately up to me. That I find it so easy to feed resentment, nearly automatic,
  is not proximately up to me now; but it is formatively up to me because this very
  choice, repeated, rebuilds the disposition. Another example: an insult damages my
  reputation — not up to me in either sense; but my interpretation of the insult is
  proximately up to me.


  Then ask: Is this a real distinction or does it collapse into the standard dichotomy?
  Does it already exist (e.g., in discussions of "indifferents" and "dispreferred
  indifferents"; in Aristotle''s habituation; in the Stoic doctrine of "progressing"
  towards virtue; in Frankfurt-style second-order desires?)? Where does it break?
  Specifically, the worry: if "formative control" over character only exists via a
  series of proximate choices, and proximate control is itself constrained by character,
  then the diachronic story is just the accretion of synchronous choices, not a distinct
  kind of control. Also the classic compatibilist objection: you don''t choose the
  reasons that present themselves.


