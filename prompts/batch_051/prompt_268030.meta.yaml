  ---


  I keep noticing a pattern and I do not have a word for it, though I suspect someone
  working on the boundary of philosophy of mind and cognitive science has already
  isolated it. Some years ago I read about a solitary wasp that stings and paralyzes
  a cricket, drags it to the mouth of its burrow, leaves it on the threshold while
  it goes inside to inspect the tunnel, then comes back out and drags the cricket
  in. If an experimenter moves the cricket a few centimeters while the wasp is inside,
  the wasp does not seem to register that the situation has changed: it drags the
  cricket back to the threshold, leaves it, goes inside to inspect, comes back out,
  and drags it in—and it will repeat this entire loop if the cricket is moved again.
  The striking thing is that the wasp is doing something elaborate, competent, and
  apparently goal-directed, but its competence is welded to a fixed order of operations.
  It cannot take the shortcut a marginally more flexible agent would take.


  I notice the same shape outside biology. In certain bureaucracies, when one field
  on a form changes, the whole case is sent back to the start of the procedure, even
  if none of the downstream steps depends on that field. And I find my own routines
  doing something like it: after a small interruption, I restart the sequence from
  step one instead of resuming where I was.


  What I want to know is whether this specific property—competent within a canonical
  environment, yet rigid in a way that prevents exploiting changed conditions or tolerating
  novelty—has an established name. I have heard of fixed action patterns, reflexes,
  habits, and compulsions, but each seems to miss the feature I am after. This is
  not mere automaticity, because the behavior can look quite intelligent; and it is
  not mere habit, because the striking failure is that already completed steps get
  repeated when the world changes, not that the steps themselves are unvarying. I
  also have a strong but unplaceable sense that this contrast between rigid routine
  and genuinely flexible responsiveness has been used to say something about free
  will—that a free action is not an uncaused action but one whose plan can be revised
  when its framing conditions shift. I may be conflating several debates.


  I am not satisfied with a bare label. I want the carving: what exactly the phenomenon
  is, how it differs from the neighboring ideas above, which of those neighbors it
  is closest to, and where its edges are. Can a generally flexible agent be rigid
  in just one corner of its activity, and would that corner still count as an instance
  of the same thing? If there is no established term, propose one and define it so
  that it does not collapse into habit, reflex, or fixed action pattern.


