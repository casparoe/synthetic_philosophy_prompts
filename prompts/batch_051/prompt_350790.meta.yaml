  Let me draft a probability prompt on Taurek.


  Taurek''s view: In "Should the Numbers Count?" (1977), Taurek argues that in a case
  where you can save one stranger or five strangers, it''s permissible to save the
  one; numbers don''t count because no one''s loss is worse than anyone else''s, and
  aggregating losses across persons is illegitimate. The separateness of persons.
  Each person''s loss matters to them, but there is no entity for which five losses
  is a greater loss. So you may flip a coin. The debate includes whether to give equal
  chances (coin flip) vs weighted chances (save the many with probability 5/6) vs
  just save the many.


  The prompt should ask for the model''s actual credence, decompose. Could ask: "What''s
  your credence that Taurek is right that numbers don''t count...?" Need precision:
  define the case carefully: you can save exactly one person, A, or exactly five people,
  B1–B5; all are strangers, equal in all relevant respects, no special obligations,
  no side effects, each would die otherwise, rescue is costless to you, no one consents
  to a procedure. The proposition: in such a case it is permissible to save the one
  rather than the five.


  But careful: "permissible" vs "required." Taurek''s claim is that it is permissible
  to save the one, and perhaps that you should give equal chances. The numbers debate
  often distinguishes: (a) permissibility of saving the one; (b) whether you''re required
  to save the five; (c) if you should give each an equal chance. The prompt could
  pin it down.


