  3. Popularity/content drift: the karma system selects for easily digestible, broadly
  appealing content over nuanced, niche, or long-form contributions; memes and hot
  takes outcompete careful answers.

  4. Bandwagon/cascade effects: early upvotes shape later votes; a comment''s score
  becomes a signal independent of content, and people vote with the crowd.

  5. Revenge downvoting and tactical voting: coordinated or reciprocal voting, downvote
