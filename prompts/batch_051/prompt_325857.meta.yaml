  Morgan''s canon, in its commonly repeated form (paraphrase): "Don''t explain an
  animal''s behavior in terms of a higher psychological process if a lower one can
  explain it." Or "higher => lower when both fit."


  Precisifications:


  1. **Parsimony / tie-breaker reading**: When two explanations are equally good on
  the evidence, choose the one that posits fewer or simpler psychological capacities.
  This is a weak, uncontroversial methodological principle. It doesn''t license *rejecting*
  the higher explanation; merely preferring the simpler one provisionally. Trivial-ish/very
  defensible.


  2. **Lower-is-default / burden of proof reading**: The higher explanation is not
  permitted until the lower one has been positively shown to fail. The proponent of
  higher cognition carries the burden; absent a "smoking gun," you must accept the
  lower explanation. This is stronger; it can make higher attributions impossible
  in practice because a clever experimenter can almost always construct *some* associative
  story.


  3. **Psychological-evolutionary scale reading**: There is a linear scale of "lower"
  to "higher" processes (reflex → learning → memory → reasoning → belief/desire →
  language → self-consciousness), and one should always pick the lowest rung that
  fits. This presupposes that the scale itself is real and hierarchical. Substantive
  but dubious — many putative "higher" processes may not be ordered (e.g., associative
  learning can do things that look "smart"; some "simple" animals have sophisticated
  navigation).


  4. **Denial / eliminativist reading**: The higher process is *not* what is going
  on if a lower explanation is possible; the "higher" attribution is false or meaningless
  for animals. This is a metaphysical reading, not just methodological; it inherits
  the claims of parsimony plus a verificationist step. Probably false/unwarranted:
  availability of a simpler account doesn''t show the complex account is false.


  5. **Anthropomorphism guardrail reading**: The canon is just a reminder to calibrate
  against over-attribution: a cognitive hygiene rule. It doesn''t dictate what the
  correct explanation is; it just warns us. Trivial, defensible.


  6. **"If it can be fairly interpreted" reading**: The actual canon has "fairly"
  — maybe the reading hinges on what counts as a *fair* lower interpretation. Does
  "can" mean "is logically possible," "is consistent with the data," or "was the best
  explanation"? Logical possibility is too weak (anything can be explained by an ad
  hoc learning rule — vacuous). Best-explanation reading is fine but collapses into
  1. The "fairly" is load-bearing.


  7. **Evolutionary parsimony / continuity reading**: Related to Darwinian continuity:
  don''t posit a faculty in animals that we wouldn''t posit in our own case given
  the same behavior, or don''t posit faculties that would be evolutionary saltations
  without need. Hmm, this might be getting too niche; maybe skip.


