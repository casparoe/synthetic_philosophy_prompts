  Causation by omission: In philosophy, causation by omission is debated: whether
  omissions (failures to act, absences) are causes. Counterfactual theories: the child
  would be saved if someone freed it; does the citizens'' not freeing cause the suffering?
  But there''s also the question of whether the child''s suffering is caused by the
  arrangement (the ones who locked the child there) or sustained by everyone''s ongoing
  omission. Some views hold omissions are causes only against a background of norms/expectations;
  others deny that absences can be causes because absences aren''t events; still others
  treat causal explanation as contrastive, so the omission is a cause relative to
  the contrast of freeing the child. Also the moral dimension: blame for omission
  may track responsibility/capacity rather than causation.


