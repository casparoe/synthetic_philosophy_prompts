  bear on whether the subject knows something, or only on what the knower is like?
  Finally, if the original thesis does not survive intact, state the strongest replacement
  you can construct — one that gives mystical experience whatever distinct epistemic
  status it can still claim, without asserting more than the science allows. I am
  interested in the conceptual architecture of the argument, not in a review of the
