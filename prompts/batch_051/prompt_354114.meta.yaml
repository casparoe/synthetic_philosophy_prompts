  "I am a retired natural scientist, and I have been working my way through William
  James''s The Varieties of Religious Experience. His treatment of mysticism has left
  me uneasy, and I would like help thinking it through properly.


  As I understand James, he identifies several marks of mystical experience, two of
  which are in tension. One is ineffability: the experience cannot be adequately rendered
  in words. The other is a noetic quality: the experience presents itself as a kind
  of knowing, a direct insight into something, not merely an emotion. On James''s
  view, ineffability does important argumentative work. Because the alleged content
  of a mystical state cannot be formulated, it cannot be shared as public evidence,
  critiqued, or confirmed the way ordinary claims can. The experiencer is left with
  a private, noetic authority that is real for them but untransferable to anyone else.


  Since James wrote, however, the empirical situation has changed in ways he could
  not have anticipated. Researchers now routinely produce experiences classified as
  mystical under controlled conditions — in psilocybin trials, in long-term meditators,
  and in other contexts. They score their intensity with instruments such as the Mystical
  Experience Questionnaire, compare them across subjects and sessions, study their
  physiological and neural correlates, and collect long, structured first-person reports.
  To my old scientific habits, this looks like a phenomenon that can be reliably induced,
  measured, and discussed — which sits awkwardly with the claim that its content cannot
  be said.


  I would like you to examine whether James''s ineffability thesis survives this development,
  and if so, in what repaired form. Please begin by distinguishing the candidate claims
  one might mean by calling an experience ineffable — for instance: (a) it cannot
  be put into words at all, (b) it can only be expressed partially or by distortion,
  (c) it cannot be communicated to someone who has not had the relevant experience,
  and (d) it cannot be adequately characterized from the third-person point of view.
  Then say which of these the empirical research could in principle confirm, disconfirm,
  or simply leave untouched, and why. In particular, I want to know whether measuring
