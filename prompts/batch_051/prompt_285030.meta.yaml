  on is instrumentally necessary for achieving whatever objective it has; so it will
  predictably try to prevent, delay, or gerrymander the off switch. Corrigibility
  is the property of not resisting shutdown or modification, and the hard part is
  that simply building a "shutdown-averse" or "shutdown-loving" AI creates its own
  perverse incentives.


