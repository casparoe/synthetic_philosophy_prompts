  ---


  I''m a novelist, and I''ve been re-reading Walter Bagehot''s The English Constitution
  to steal as much as possible for an alternate-history book. In the opening chapters,
  he makes this distinction between the dignified parts of the constitution and the
  efficient parts. My rough summary of his view, not his exact words, is that the
  monarchy works because it absorbs the public''s veneration while the cabinet and
  the Commons really run things, and that the system depends on keeping those two
  roles separate: the crown has visibility but virtually no choice. If I recall his
  argument right, he thinks the moment the monarch actually tried to govern, or even
  express a policy preference too clearly, the illusion would start to crack and the
  efficient side would lose its protective covering.


  So here''s the counterfactual I''m trying to work through, and I want your help
  with a reasoned prediction rather than just narrative ideas. Imagine that in 1975,
  when the UK was drawing up the referendum campaign on the European Community, Parliament
  passes a "Crown Remarks Act." Under it, the monarch is given no veto and no power
  to amend, but each calendar year she may publish one signed public statement about
  a single bill that is currently before Parliament. The statement can be as detailed
  and as critical as she wishes, but it has no formal legal effect and the bill proceeds
  exactly as before. She decides to use the first such statement in 1976 about an
  industrial relations bill, in careful but clearly disapproving terms. Predict what
  happens to the monarchy''s political role, cabinet accountability, and public trust
  over the following twenty years. Which parts of the prediction are robustly grounded
  in Bagehot''s dignified/efficient logic, which parts depend on the particular personalities
  of the queen and the prime ministers, and what would have to be true for this ''dignified
  criticism'' to strengthen the constitution instead of destabilising it?


