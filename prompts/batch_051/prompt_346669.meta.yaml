  Let me consider that option. Kalai–Smorodinsky bargaining solution is a cooperative
  game theory solution concept: given a set of feasible utility pairs (a convex compact
  set), a disagreement point d, the KS solution chooses the maximal point on the Pareto
  frontier such that the ratio of gains (u1-d1)/(u2-d2) equals the ratio of the maximum
