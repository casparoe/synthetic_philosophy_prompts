  I cover artificial intelligence and the ideas behind it for a magazine written for
  scientifically literate readers, and over the past year I have found myself defending
  a position I did not initially expect to hold: the step-by-step text a language
  model produces before answering — its chain of thought — should not be treated as
  a faithful report of how the model actually reached its answer. The model has no
