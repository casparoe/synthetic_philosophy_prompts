  generated in the same predictive pass as everything else, and their coherence with
  the final answer seems to me evidence about the kind of text the model was trained
  to imitate rather than about the causal route by which the answer was settled. Yet
  I see serious researchers treating this narrated reasoning as evidence for why a
  model answered as it did, what it "knows," or which intermediate operations it used,
  sometimes in the same conversation in which they concede that the narration can
