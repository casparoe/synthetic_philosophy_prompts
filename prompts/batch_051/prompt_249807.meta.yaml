  into a procedure my committee can actually run. The core of that logic is that sunk
  costs should not by themselves move a decision, and that only forward-looking costs
  and benefits count. But I do not want a slogan that says the past is always irrelevant.
  Past spending can be relevant when it has changed something about the future: it
  may have bought information, built a reusable capability, created obligations to
  customers or suppliers, or altered competitors'' behavior. The procedure must separate
  those legitimate uses of history from the bare argument that we have already spent
  too much to stop.


