  I direct the portfolio office at a mid-sized industrial manufacturer. Every quarter
  I chair a review in which a committee decides whether to continue, re-scope, or
  terminate each development project that is over budget or behind schedule — usually
  ten to fifteen projects at a time. The stakes are high: a wrong continuation ties
