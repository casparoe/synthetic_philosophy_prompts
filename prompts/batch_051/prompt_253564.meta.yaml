  GWT (Baars): conscious mental states are those that are globally broadcast in a
  "global workspace" — a working memory architecture that makes information available
  to many cognitive processes: attention, memory, language, motor, executive. Unconscious
  processes compete for access; winning coalitions broadcast. Dehaene''s global neuronal
  workspace adds neural details.


  Block''s access vs. phenomenal consciousness: A-consciousness = availability for
  reasoning, verbal report, rational control of action. P-consciousness = experiential
  properties, "what it''s like." Block argues P-consciousness can overflow A-consciousness,
  based on Sperling''s partial report (though Block actually used his own interpretation;
  Sperling: subjects report seeing more letters than they can recall under full report;
  partial report superiority). In the classic Sperling procedure: 3x4 array flashed
  50ms; full-report condition: subjects can report 4-5 letters but claim they saw
  all 12; partial-report condition: a tone cues a row immediately, they can report
  3-4 from that row, hence iconic memory holds ~9 items. Block uses this to say P-consciousness
  of the array exceeds A-consciousness (the availability for report). The full report
  shows they can only report ~4.5, yet they insist they consciously saw all 12. Actually,
  the disagreement: whether the unreported letters were "conscious." Lamme argues
  they are phenomenally conscious (recurrent processing in visual cortex) even if
  not accessed. GWT would say only the attended, reported items were conscious; the
  rest was preconscious or unavailable.


  So my challenge is legitimate. The role-player (GWT proponent) can respond: the
  subjects'' impression of seeing all 12 letters is a judgment/confabulation that
  itself is based on a broadcast summary (e.g., a generic "many letters" representation)
  rather than on all individual contents; or the unattended letters were only potentially
  conscious but never actually selected, so "mocks the subjects" is question-begging;
  or partial-report shows fragile access that fades faster than broadcast... But wait,
  partial-report shows more can be reported, suggesting more was accessible briefly.
  GWT proponent''s resources:

  - Distinguish "fame in the brain" from mere iconic persistence: a content isn''t
  broadcast merely by being briefly in a sensory buffer; broadcast is an all-or-none
  ignition event.

  - The cued-row report itself requires broadcasting; the row was in iconic memory
  in a "weakly activated" state. Once cued, attention selects it for broadcast. Pre-cue,
  it wasn''t globally available—the subject could not act on it or report it spontaneously.
  The feeling of seeing the whole array is carried by a coarse-grained broadcast (e.g.,
  "display" representation).

  - Deny that unreported letters were P-conscious while unreported: they were "microconscious"
  or transiently activated; P-consciousness without any access is not something we
  can subjectively report after the fact, so the argument relies on a reconstruction.


