  Let me think about the Hart-Fuller debate. The debate is from the 1950s, in the
  Harvard Law Review. Hart published "Positivism and the Separation of Law and Morals"
  (1958) and Fuller replied in "Positivism and Fidelity to Law: A Reply to Professor
  Hart" (1958). Hart defends a version of legal positivism: law and morality are conceptually
  separable, though there may be overlaps. Fuller argues for an "inner morality of
  law" — procedural principles like generality, publicity, non-retroactivity, clarity,
  non-contradiction, no impossible demands, stability, and congruence between official
  action and declared rules. Fuller claims these are necessary for law to exist; a
  total failure of these makes not law. Hart famously discusses the "grudge informer"
  problem in Nazi Germany, and the question of whether Nazi laws were law. Hart says
  they were law but too wicked to obey; Fuller says a legal system that uses retroactive
  statutes, secret laws, etc. is not law in the fullest sense, and moral considerations
  enter into the concept of law.


