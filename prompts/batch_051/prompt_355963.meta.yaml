  Now, what are the subtle errors? Let''s see:

  - "Hart says law is just a system of rules a society happens to enforce" — Hart
  distinguishes primary and secondary rules, and the rule of recognition is a social
  rule accepted by officials, not just enforced by society. It''s a simplification
  but not terrible.

  - "whether those rules are moral has nothing to do with whether they count as law
  — that''s the separation thesis" — Hart''s separation thesis is that there is no
  necessary connection between law and morals, not that there is no connection at
  all. He acknowledges that law may be influenced by morality and that laws often
  incorporate moral standards. The subtle overstatement: "nothing to do" is too strong.
  Hart says the existence of law is one thing; its merit is another, but he doesn''t
  deny overlap.

  - "So under Hart''s view, Nazi laws were full-fledged laws, and German citizens
  had a legal obligation to follow them" — This is a critical misrepresentation. Hart
  says Nazi laws were law, but he does NOT say citizens had a legal obligation to
  follow them? Actually, in Hart''s view, legal obligation exists if a rule is valid
  under the rule of recognition, so technically citizens may have had a legal obligation,
  but Hart''s whole point in the grudge informer case is that they had a moral obligation
  not to obey, and that this shows separation of law from morality. He didn''t say
  they should obey. The summary says "had a legal obligation to follow them, even
  if they also had a moral reason not to." Hart would accept the legal obligation
  part but would emphasize the moral reason not to. Is that a misrepresentation? Maybe
  slightly: Hart''s point is that saying "it was law" does not settle whether to obey.
  The summary doesn''t say they should obey; it says they had a legal obligation.
  That''s not exactly a misrepresentation, but it may imply a moral pull. The asker''s
  concern is whether the summary is fair. The real subtle error is "Fuller replied
  that this is absurd" — maybe not absurd, he argued differently. But subtle.

  - "Fuller showed that you can''t separate law and morality the way Hart claimed,
  because even the procedural requirements are moral requirements, and an evil legal
  system fails them." — This is a plausible interpretation but Hart would reply that
  the "inner morality" is not morality in the ordinary sense but rather conditions
  of efficacy, and that a system could satisfy them and still be evil. Also, Fuller''s
  "inner morality" is not that procedural requirements are moral in the sense of substantive
  justice; Fuller himself distinguishes "inner morality of law" from "external morality"
  — he calls it morality but it''s more like a morality of aspiration, and Hart says
  it''s really just efficiency. So the summary conflates procedural morality with
  substantive morality, implying that any evil system fails them. That''s a subtle
  conflation.

  - "Fuller proved that morality is built into the very concept of law" — Fuller argued
  this, but Hart did not concede; the debate is ongoing. The summary presents it as
  settled.


