  "Consider the problem behind the old question of when a legend becomes history.
  I want you to use a specific working test — call it the minimal historicity threshold
  — and run three famous cases through it: the Trojan War, King Arthur, and the Exodus.
  The goal is not a survey of scholarship but a committed case analysis that runs
  in both directions: the test should discipline the three cases, and the three cases
  should pressure-test the test.


  Here is the working test. A tradition may count as minimally historical — that is,
  as preserving a real historical event or person as one of its ingredients, however
  elaborated — when it can satisfy several conditions. (1) Anchorage: a datable source
  or artifact from roughly the claimed period, produced independently of the tradition
  that later tells the story, contains at least one of the names, places, or conflicts
  that the narrative centers on. (2) Fit: the material or documentary remains of the
  candidate place and time are broadly consistent with the narrative''s central non-supernatural
  elements, not merely compatible with some abstract ''war'' or ''migration.'' (3)
  Chain of transmission: there is a traceable route from the claimed events to the
  earliest surviving account, through oral tradition, scribal revision, or political
  appropriation, with identifiable compression, duplication, and amplification. (4)
  Invention pressure: if the narrative''s existence and shape are better explained
  by the needs of the people who transmitted it — legitimation, identity, entertainment
  — than by the persistence of a memory, it fails the bar.


