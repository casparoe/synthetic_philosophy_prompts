  Darwin''s inversion (per Dennett): Before Darwin, it seemed obvious that mind/design
  must precede order: a designed thing implies a designer. Darwin inverted this: design
  can arise from mindless processes (natural selection) with no understanding; comprehension
  (minds) is a late product. So competence without comprehension: nature is competent
  (produces well-designed organisms) without comprehending.


  Turing''s inversion: Turing proposed that a machine can be a "computing machine"
  that does arithmetic without understanding arithmetic; more generally, competence
  (e.g., playing chess) can be achieved without comprehension. Dennett calls it a
  second inversion because it inverts the traditional idea that comprehension is the
  source of competence: instead, competence can be built from mindless processes (algorithms),
  with comprehension either absent or layered on top.


