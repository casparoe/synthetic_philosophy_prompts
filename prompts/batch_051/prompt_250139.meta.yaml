  Darwin''s passage: Our impression of nature as bright and happy is undermined by
  the hidden constant destruction of life (birds eating insects, predators eating
  birds, seasonal food shortage). This is used by later thinkers (e.g., in wild animal
  suffering discussions) to argue that wild nature contains great amounts of suffering.
  But the question is whether habitat destruction reduces wild animal suffering. Some
  argue that destroying habitat prevents animals from being born into short, miserable
  lives, so may reduce total suffering; others argue ecosystems have net positive
  welfare or that destruction causes great suffering (dislocation, starvation, death)
  to existing animals, and that preventing future lives is not straightforwardly a
  benefit.


