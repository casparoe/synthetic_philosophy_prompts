  families have characteristic embarrassments. Appraisal views get asked the "trading
  up" question: if love is keyed to a set of valuable properties, why isn''t a rational
  lover obliged to move his love to whoever has more of the same properties, and how
  can love survive the loss of the properties that grounded it? Bestowal views get
  asked the arbitrariness question: if love confers value regardless of what the beloved
