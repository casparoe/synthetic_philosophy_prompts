  as a sufficient answer to each, where the procedure stops with a "do not use this
  category," and where it hands the decision to a person because the question is one
  of judgment. Build it out of what the grue problem and the induction literature
  actually establish about projection, entrenchment, and the role of background theories
  — but translated for actuaries. The procedure should explicitly mark each step as
  either a mechanical test or a judgment call, and it should be honest about where
