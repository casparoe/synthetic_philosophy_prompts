  is exactly Goodman''s new riddle of induction — the problem of distinguishing "projectible"
  predicates like green from gerrymandered ones like grue (green if first examined
  before some future time, blue after), which fit everything we have seen equally
  well. I don''t want a seminar; I want an operational checklist my team can run during
  a half-day model review, without any philosophy training, before our chief underwriting
  officer signs off.


