  Let''s draft:


  I''m a software engineer, not a lawyer, but I''ve been reading Oliver Wendell Holmes''s
  The Common Law because I kept seeing people cite it in arguments about mens rea
  and strict liability. I''m writing a short essay, and I''d like comments on whether
  the core move actually holds up.


  The passage I''m building around is from early in The Common Law (Lecture I, I think).
  Holmes writes:


  "Vengeance imports a feeling of blame, and an opinion, however distorted by passion,
  that a wrong has been done. It can hardly go very far beyond the case of a harm
  intentionally inflicted."


  My draft argues something like this: if Holmes is right that early law grew out
  of vengeance, and vengeance requires blame, then the primitive baseline probably
  wasn''t punishing people for purely accidental harms. That means modern strict liability—where
  you can be on the hook even without intent—isn''t some ancient instinct that survived;
  it''s a later construction. I want to say that this matters for how we think about
  mens rea requirements, because it makes fault look like the deeper principle and
  strict liability the exception that needs special justification.


  What I''d like comments on:

  - Am I reading Holmes correctly here, or is he making a narrower point about early
