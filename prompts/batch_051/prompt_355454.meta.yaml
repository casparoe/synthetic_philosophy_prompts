  which mathematical sentences are true and about how mathematics is used in the sciences.
  The platonist says that sentences like ''there are infinitely many primes'' are
  true because there really are abstract objects — primes — that exist mind-independently.
  The nominalist says the same sentence is either false when read literally, or true
  only under a paraphrase that avoids commitment to abstract objects; what really
  exists is the concrete world of notation, minds, and uses. So the disagreement survives
  complete agreement on the mathematical facts, the proofs, and the applications.
  What is left over?


  My own working hypothesis is that the debate is largely not about existence at all,
  but about a prior question neither side states: whether the existential quantifier
  should be treated as a reliable guide to ontology, and more generally whether semantics
  should be answerable to our best scientific practice or to our antecedent standards
  of parsimony. The platonist treats the literal truth of accepted mathematics as
  a datum that ontology must accommodate; the nominalist treats parsimony about basic
  kinds of entity as a datum that semantics must accommodate. If that is right, the
  debate would be a disagreement about what counts as a datum or a theoretical virtue,
  rather than an ordinary factual disagreement.


