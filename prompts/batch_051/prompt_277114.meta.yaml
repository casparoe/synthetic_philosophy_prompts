  The domain: Testimony: reductionism vs. anti-reductionism.


  Summary:

  "Here''s roughly what my epistemology professor said in a handout on the epistemology
  of testimony, or at least what I took away:

  - Hume held reductionism: trust in testimony is never a basic source of justification.
  We are justified in believing what people tell us only because we''ve each observed,
  in our own experience, a correlation between people''s reports and the facts. A
  report is credible to the degree that our past experience supports the reliability
  of the relevant kind of testimony and testifier.

  - Reid replied that this cannot be right even as a description of how our minds
  actually work: children confidently believe what they are told long before they
  possess any inductive track record, and all of us routinely trust strangers without
  first establishing their reliability. So testimony must be, like perception and
  memory, a basic or ''original'' source of evidence: justification is the default
  simply in virtue of being told, unless one has positive reason to doubt.

  - The professor then summed up: the two positions differ over whether trust always
  has to be earned through experience; the decisive objection to Hume is that the
  child has no experience to go on, so reductionism is psychologically impossible;
  and contemporary work on the ''truth-default'' (people are wired to believe by default)
  shows Reid was right about the mind. So modern epistemology has largely abandoned
  reductionism."


  The subtleties:

  1. "we''ve each observed, in our own experience, a correlation" — Hume''s reductionism
  (as in the quote) says our assurance is derived from our observation of the veracity
  of human testimony and conformity of facts to reports, but it needn''t be each person''s
  personal first-hand checking; can be learned through folk knowledge? Actually the
  reductionist claim at issue in Coady is "we possess a posteriori evidence that testimony
  is generally reliable" — could be collective/inductive. The entailment "each individual
  must have observed" is an overstatement of the modest thesis. That''s a subtle misrepresentation
  that the passage itself might not imply: Hume says derived from observation, but
  not necessarily each person''s private tabulation. Good.


  2. "children confidently believe... so reductionism is psychologically impossible"
  — classical objection (Coady''s "reductionism is false because we can''t establish
  testimony''s reliability without relying on testimony"). But the professor presents
  child psychology as a refutation and "truth-default shows Reid is right" — this
  conflates descriptive psychology (we do default-trust) with normative justification
  (we are justified by default). Anti-reductionism is a normative epistemic thesis;
  truth-default is a psychological finding and doesn''t by itself show the normative
  view. That''s a standard objection presented as refutation; technical term "justification"
  used in everyday sense? The conditional claim "unless one has positive reason to
  doubt" vs "believe anything you''re told unless you have reason to doubt" maybe.


  3. "So modern epistemology has largely abandoned reductionism" — overstatement.
  Many epistemologists still defend reductionist or local reductionist positions (e.g.,
  background evidence accounts); debate continues. Could be contested but fair as
