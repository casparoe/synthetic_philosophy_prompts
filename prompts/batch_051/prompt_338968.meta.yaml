  without it, or when the principle generates a contradiction with a wide class of
  cases; a case judgment can be revised when it is unstable, subject to framing effects,
  or predicted to be an artifact). 4 marks. Typical error: vague appeal to "reflective
  equilibrium" without specifying which side yields or when.

