  What are open conceptual questions in impact measures?


  Core problem: We want an agent that achieves its goal while minimizing side effects
  on everything else, without specifying value. How do you define side effects relative
  to baseline? Problems:


  - Defining the "inaction baseline"/counterfactual: what would happen if the agent
  did nothing? For continuing agents, over long time horizons, baseline explodes combinatorially;
  hard to define default trajectory.

  - The "scale of the effect vs. side effect" distinction: any action changes the
  world; how to distinguish intended effects from side effects without a value specification
  — possibly via direction/attainability/preserving options. Is side-effect avoidance
  expressible as "don''t reduce the attainability of other goals" (Armstrong''s attainability
  measure)? Is that too strong or too weak? Connected to option value and power.

  - Whether low-impact is even a coherent target independent of value: can we separate
  "impact" from "value"? Objections that impact measures smuggle in a norm; trivialization
  results? If measure is path-based or state-distance-based it depends on representation/ontology;
  what''s the right state space? Representational robustness.

  - Multi-agent and aggregation: side effects relative to whom? Multiple stakeholders
  with different values; measuring impact when agents interact and each tries to be
  low-impact.

  - Self-referential/robustness: agent that predicts impact measure and manipulates;
  Goodharting; how to make measure stable under the agent''s knowledge of it.

  - Infinite/continuous state spaces, formal computational tractability.

  - Relationship between low-impact and corrigibility: are they distinct desiderata
  or reducible? Is side-effect avoidance a special case of shutdown/corrigibility
  or orthogonal?

  - The problem of thresholds/permissibility: if any positive deviation counted, no
  action is permitted; if threshold too high, catastrophic side effects permitted.
  How to calibrate severity thresholds without value.


