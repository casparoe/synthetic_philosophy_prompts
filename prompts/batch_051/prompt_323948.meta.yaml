  be refused admission on the ground that its capacities are realized in silicon,
  carbon, or any other substrate."


  The clauses were drafted decades ago, when the Board feared that future machine
  intelligences might be denied a place merely for not being biological; the drafters''
  question was whether a thinking machine built from electronics deserved the same
  standing as a human.


  Now a consortium submits a device that passes the examination flawlessly and at
  superhuman speed. It is not, in any ordinary sense, a general reasoner: the consortium''s
  engineers spent years enumerating every input string the examination could possibly
  present, up to the examination''s maximum length of 100,000 characters, and paired
  each with a correct response computed by the consortium''s human mathematicians.
  The device is a finite-state lookup engine: it never represents the problems as
  problems, draws no inferences, and would fail any question reworded even slightly
  outside the enumerated set. The consortium argues that clause 3.2 was written to
  prevent exactly the Board''s intuitive rejection of unusual realizers, and that
  the device — like any other machine candidate — is nothing but a physical system
  whose input–output function matches the cognitive profile. A Board member replies
  that admission under 3.1 was never meant to cover the mere behavioural printout
  of a reasoning process that took place elsewhere, in the engineers.


  Does the device satisfy the eligibility clause? Answer by working through what the
  text requires, what the clauses were for, what the drafters would likely have said
  if asked about this case, and what a reasonable reader would take the constitution
  to mean. Is there a coherent reading that admits a genuinely reasoning silicon system
  while excluding this device, without smuggling in a bare prejudice about substrate?
  If the cleanest readings cannot do that, what does that show about the functionalist
  principle the clause appears to state?


