  ---


  Prompt:


  You are putting together an internal research agenda for a group working on "low-impact
  AI": the problem of designing agents that pursue assigned goals while avoiding side
  effects on everything else, without requiring the designers to specify, even approximately,
  what they value outside the goal. The group has enough engineering capacity to implement
  one or two formal impact measures in the next year, but only after the conceptual
  issues are sorted out enough to know what a measure is supposed to do.


  Your task is to produce a priority ordering among the unresolved conceptual problems
  in this area, with a defense of the ordering. You should engage with (among any
  others you identify) these candidate problems:


  1. The baseline problem: every deviation measure compares the agent''s actual trajectory
  to some "inaction" or "default" baseline; what fixes the baseline without smuggling
  in a theory of what matters, and does any principled baseline exist for long-horizon
  agents in evolving environments?


  2. The intended-versus-side-effect distinction: any effective action changes the
  world; can a measure distinguish "the effect I was asked to produce" from "collateral
  effect" using only structure (attainability, option preservation, state reachability)
  rather than value?


  3. Representational robustness: an impact measure must make the same verdicts regardless
  of how the environment is described (state space, units, irrelevant detail). Is
  there a non-arbitrary way to define comparative impact across ontologies, or does
  every measure implicitly choose a privileged description?


  4. Goodharting/self-prediction: once an agent can predict and reason about the measure,
  what keeps it from gaming the measure, and does the agent''s own knowledge of the
  measure already change the counterfactual baseline?


  5. Aggregation across stakeholders and timescales: side effects are side effects
  on someone or something; can impact be aggregated without a prior account of whose
  interests count, and is "total side effects" meaningless in multi-agent settings?


  6. The relationship to corrigibility and goal-directedness: is low impact really
  a distinct target, or is it a special case of corrigibility/option-value preservation,
  and what follows for what should be built?


  For each candidate, explain what makes it fundamental or downstream relative to
  the others, how much progress can be expected from philosophers/theorists rather
  than engineers, what kind of result would resolve or dissolve it, and what empirical
  feedback (from implemented toy agents, formal examples, etc.) would move it up or
  down the list. End with an ordered list. The aim is a defended agenda, not a survey
  of the literature; references are neither needed nor useful here.


