  it pious because it is loved by the gods?" (10a). Actually the dilemma in the dialogue
  is about the form/ousia of piety and what is god-loved. Socrates argues: if pious
  is what all the gods love, and they love it because it''s pious, then ''pious''
  and ''god-loved'' are not the same; the god-loved is a pathos of being loved, not
  the essence. This is subtle.

  - The dilemma as formulated in contemporary philosophy: God/gods command X. Is X
  right because God commands it, or does God command it because it''s right? Horn
  1 (right because God commands): morality is arbitrary; God could command cruelty
  and it''d be right; also "God is good" becomes trivial/empty. Horn 2 (God commands
  because it''s right): there''s an independent standard of goodness, so God isn''t
  the source of morality; divine command is dispensable.

