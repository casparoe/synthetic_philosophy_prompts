  Let me make sure the philosophical content is accurate:


  - Counterpart theory (Lewis): no object exists in more than one possible world.
  Ordinary individuals are world-bound. A sentence like "Humphrey might have won"
  is true iff there is a possible world in which a counterpart of Humphrey wins. Counterpart
  relation is based on similarity, context-dependent, not identity. "I might have
  been a plumber" is de re modal predication; counterpart theory treats de re modality
  as quantification over counterparts.


  - Transworld identity (standard Kripkean/Plantingan): the very same individual exists
  in different possible worlds and has different properties at different worlds. Modality
  de re is genuine: the object itself could have had the property. Property possession
  is world-relative; no contradiction.


  - Accidental intrinsics problem: Lewis argues transworld identity faces the problem
  of accidental intrinsics: if I am identical to someone in another world, then I
  have both my actual height and the other-world height; but these are intrinsic properties,
  so contradiction. The transworld identity theorist can respond by indexing property
  possession to worlds (having-at-a-world). Lewis finds this distorts the property:
  having a world-indexed property is a relational property, not intrinsic. So both
  sides have points.


  - Kripke''s Humphrey objection: "If counterpart theory is correct, then if someone
  says ''Humphrey might have won the election,'' it is not Humphrey himself who is
  said to have the property of possibly winning, but some counterpart of Humphrey
  in another possible world. But Humphrey couldn''t care less whether someone else,
  no matter how much resembling him, would have won." I''m paraphrasing, not quoting.


  - Lewis''s response: modal intuitions concern the satisfaction of modal predicates;
  our concern "I myself might have won" is itself a modal predication and gets counterpart-theoretic
  analysis too; the objector assumes the very notion of "I myself" transworld identity
  in describing what Humphrey cares about.


