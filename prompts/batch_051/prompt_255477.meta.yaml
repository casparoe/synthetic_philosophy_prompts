  Draft:


  "At a recent reading group on modal metaphysics, two members got into an extended
  argument about how to interpret ordinary possibility claims about particular individuals.
  I''d like you to adjudicate their exchange. I''ll reproduce it as faithfully as
  I can.


  One of them, Callie, defended counterpart theory. She began by saying that claims
  like ''I might have been a plumber'' are best handled without assuming that the
  very same object exists in more than one possible world. On her view, the sentence
  is true in virtue of a counterpart of me in another possible world — an object sufficiently
  similar to me in the relevant respects, who is a plumber — rather than in virtue
  of me myself bearing the property of being a plumber at another world. She said
  this dissolves the old puzzle of accidental intrinsics: one object does not have
  to possess both my actual profession and the alternative profession at the same
  time.


  Ravi objected that this changes the subject. When he says he might have been a plumber,
  he said, he means that there is a way things could have gone such that he — the
  very person now speaking — is a plumber. A similar but distinct person''s being
  a plumber in another world does not make his sentence true; it makes a different
  sentence, about a different person, true.


  Callie replied that Ravi''s ''very person'' requirement is what creates the problem
  of accidental intrinsics. If the same person exists in two worlds and is a professor
  in one but a plumber in the other, then that one person has incompatible intrinsic
  properties. Ravi answered that this is only a problem if you insist on attributing
  the properties without qualification. The standard view relativizes property possession
  to worlds: the person has being-a-plumber at world w and being-a-professor at the
  actual world. There is no contradiction in the same object having different properties
  at different worlds, any more than in being tired on Monday and rested on Tuesday.


  Callie shot back that relativizing property possession to worlds is ad hoc and quietly
  changes the property involved. Being-a-plumber-at-w is a relational property, not
  the intrinsic property of being a plumber, so the position is not really preserving
  the claim that I myself could have had the very property in question. Ravi then
  pressed what he called the decisive objection: if counterpart theory is right, then
  the truth of ''he might have won the election'' concerns someone else''s winning
  in another world, and the man himself — the actual candidate — is not the subject
  of the modal claim. The candidate could reasonably say he does not care whether
  some similar person won; he cares whether he himself might have won. A theory that
  cannot capture that, Ravi said, has lost the phenomenon it was meant to explain.


  Callie said this objection assumes the very notion it is trying to protect. What
  the candidate cares about is itself a modal state of affairs, and on her account
  ''he himself might have won'' is just as susceptible to counterpart-theoretic analysis
  as ''he might have won.'' To insist that he cares about himself, not a counterpart,
  is to assert transworld identity as a datum rather than argue for it. Finally, Ravi
  raised a more technical worry. Because the counterpart relation is a context-sensitive
  similarity relation, a world can contain more than one counterpart of the same actual
  person, and different counterpart relations can be in play at different points in
  a single piece of reasoning. That, he claimed, makes the logic of iterated and compound
  modal claims unstable: ''I might have been a plumber'' and ''I might have been a
  lawyer'' could both come out true while ''I might have been both a plumber and a
  lawyer'' comes out false, depending on how the context shifts. Callie accepted the
  result and said it is exactly what a context-sensitive account should predict; the
  two conjuncts can be evaluated under different resolutions, just as ''everyone is
  here'' can be true in one context and false in another. She said treating possibility
  as rigidly univocal is the mistake.


