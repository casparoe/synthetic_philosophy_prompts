  happen, and when it does happen it''s evidence that someone is either irrational,
  overconfident, or maintaining inconsistent priors. The position I''m attached to
  is the epistemological one: markets don''t so much pool dispersed information as
  punish the people who fail to update on the fact that the other side is willing
  to trade.


