  of pain that the person genuinely cannot tell apart from the previous setting. Each
  step also pays a fixed amount — maybe $10,000 — and he can stop at any time. At
  the end he''s in horrible unmanageable pain, but at every individual step it made
  sense to turn the dial one more notch, because the extra pain was imperceptible
  and the money was real.


  I''ve always used a rough two-part test for whether a choice is rational: (a) the
  person prefers the result at the moment of choosing, and (b) if you asked them right
  after, in isolation, they''d do it again. By that test, every single turn of the
  dial is rational — from 0 to 1, 1 to 2, all the way up. But the whole sequence lands
  him in a state he''d pay a huge amount to escape, and he''d probably say the overall
  plan was a mistake. So is he a case of a rational person making rational choices
  and ending up worse off, or does he fail my test somewhere? I''m less interested
  in the money/pain details than in the criteria themselves: is my two-part test missing
  something, and should I say the sequence as a whole is irrational even though no
