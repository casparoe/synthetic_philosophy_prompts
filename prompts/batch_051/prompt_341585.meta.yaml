  In the Meno, after the demonstration with the slave, Socrates concedes that true
  opinion is no less useful than knowledge for guiding action. He then compares true
  opinions to the statues of Daedalus: while they remain in place they are valuable,
  but they tend to run away unless fastened down. What turns them into knowledge,
  he says, is being tied down by reasoning out the cause, which he links to recollection.
  I noticed a parallel with modern machine learning. A model that has merely memorised
  correct input–output pairs can perform well on data similar to its training set,
  yet it is easily broken by distribution shift or adversarial examples; a model that
  has learned something closer to the underlying mechanism can generalise, recalibrate,
  and sometimes recognise when it is out of its depth. Both seem to say that having
  the right answer is not enough: what matters is having the right kind of tie to
  the world. My question is whether this is a genuine structural parallel or just
