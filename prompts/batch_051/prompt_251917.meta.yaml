  Let me think carefully about factual accuracy of Woodward''s circularity worry.
  Woodward''s account: X is a cause of Y iff there is a possible intervention on X
  such that if that intervention were to occur, the probability distribution of Y
  would change (or Y would change) in appropriate circumstances. Interventions are
  defined: I is an intervention on X with respect to Y iff (i) I causes X, (ii) I
  acts as a switch that controls X and renders X independent of its other causes,
  (iii) any effect of I on Y goes through X, and (iv) I is not correlated with other
  causes of Y except through X and causes of X. This definition uses causal notions
  (I causes X; effect of I on Y goes through X). Hence the circularity worry: you
  can''t reduce causation to interventions because interventions are characterized
  causally. Woodward responds: the account is non-reductive; it doesn''t claim to
  eliminate causal notions; invariance and modularity do the work; circularity is
  not vicious because it''s about how causal claims are connected to evidence/action.


