  Prompt draft:


  "I have been teaching a unit on divine command theory, and I keep returning to the
  Euthyphro dilemma because it exposes something about the structure of normative
  explanation that I cannot settle. On one side is the theory: moral facts are grounded
  in God''s commands, or more broadly in God''s will. This theory has real virtues—it
  explains moral obligations as commands with an authority behind them, it unifies
  the moral law under a single source, and it makes sense of the ''bindingness'' of
  morality in a way that naturalistic accounts often struggle to do. On the other
  side is a firm intuition I cannot shake: if God commanded something I regard as
  atrocity—say, the torture of a child for amusement—it would not become good just
  because He commanded it. But when I try to accept the alternative, that God commands
  it because it is antecedently good, I seem to give up the explanatory priority that
  made the theory attractive; God becomes a spokesman for a standard independent of
  Him. I am not asking for a history of the debate. I want a negotiated verdict. What
  would it take for the intuition to be the thing that goes—for me to accept that
  God''s command could make anything good, even the seemingly unthinkable? What would
  it take for the theory to be amended or abandoned—for divine command theory to avoid
  the second horn without becoming vacuous? And is there a reading of ''grounded''
  on which both survive: for example, by saying God''s nature, rather than God''s
  will, is the standard, so that the commands are not arbitrary and yet morality still
  depends on God? In answering, work the two horns as strongly as possible before
  trying to dissolve them."


