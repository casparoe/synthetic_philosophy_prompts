  scope shift, modal fallacy, suppression, illicit each-to-all. Could be valid too.


  Let''s devise an argument:


  "Argument that one can never rationally become confident in a theory from imprecise
  observations."


  Steps:

  1. All observation is uncertain: for any observation O and any proposition E it
  might support, the probability of E given O is strictly between 0 and 1.

  2. Jeffrey conditionalization says that learning O (where O is not a proposition
  of which you become certain) only allows you to shift probabilities over a partition
  {E1,...,En} of possible readings of the observation, while holding fixed the conditional
  probabilities P(H | Ei) from before.

  3. For each Ei, your prior conditional probability P(H | Ei) encodes how much Ei
  would support H, given your current beliefs.

  4. If you are genuinely uncertain which Ei occurred, the strongest attitude you
  can reach toward H is a mixture of the P(H | Ei), weighted by your new probabilities
  for the Ei.

  5. A mixture of numbers each strictly below 1 is below 1; a mixture of numbers each
  strictly above 0 is above 0.

  6. Therefore JC can never move your credence in H all the way to 0 or 1 from uncertain
  evidence.

  7. Rational certainty in a theory requires being able to move your credence to 1
  (or 0, for refutation).

  8. Therefore, no theory can ever be rationally accepted or refuted by observation.
  So scientific theories are never rationally certain.


