  Let''s craft a tricky argument about Jeffrey conditionalization.


  Background: Jeffrey conditionalization (JC) updates probabilities over a partition
  of observation propositions E_i to which one assigns new probabilities q_i, but
  where the likelihoods P(E_i | H) for the old probabilities are preserved. The formula:
  P_new(H) = Σ_i q_i * P_old(H | E_i), providing the rigidity condition holds (P_old(H
  | E_i) = P_new(H | E_i)). For uncertain evidence, one might naively try simple conditionalization
  on the proposition "my experience is as of E" (a certain proposition about experience).
  The debate: Jeffrey vs. "experience is certain evidence" approach. There''s also
  the problem of "old evidence" or whether JC can handle when evidence isn''t a proposition.


