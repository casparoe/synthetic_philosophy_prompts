  Work the analogy does: (1) self-legitimizing: safety nets are obviously good, so
  welfare is good. (2) Critique of conditionality: nets should be maximally reliable,
  so sanctions/conditions are like cutting holes. (3) Proponents of workfare invert
  it: a "safety net" only works if it isn''t a "hammock" — nets have holes/flex, and
  once you''re caught you should be bounced back up (trampoline). Also, catching people
  without a ladder out is a hammock—comfortable but traps. So the analogy is contested.


