  the safety standards = eligibility. Hmm.


  Disanalogies: In a real safety net, the risk is external and random (falling), not
  partly due to choices of the faller; a net doesn''t ask the falling person to prove
  they didn''t jump; the net''s purpose is to prevent catastrophic injury, not to
  sustain indefinitely; nets don''t create moral hazard because the user never wants
  to fall, whereas benefits may affect labor supply; a net''s holes are a design flaw,
  but eligibility rules are policy choices serving other values (fiscal, reciprocity);
  the net catches once and ends, welfare is ongoing income; net metaphors hide agency—there
  are people deciding who''s in; catching all bodies vs. allocating scarce funds (a
  net doesn''t run out of capacity, but welfare budgets do); conditionality isn''t
  holes but the shape of the net (trampoline) — etc.


