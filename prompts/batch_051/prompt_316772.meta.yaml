  The common use: "welfare is a safety net" — used to argue benefits should be universal/less
  conditional: a net that only catches people who deserve it is a net with holes;
  you wouldn''t add holes to a safety net. Or opponents of conditionality say the
  system deliberately has holes (sanctions, work requirements) that let people fall
