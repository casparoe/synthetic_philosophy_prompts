  Pasadena paradox: a gamble whose expected value is undefined because the series
  of probabilities times payoffs is conditionally convergent — sum depends on order.
  The original: toss a fair coin until it lands heads. If first heads on nth toss,
  payoff = (-1)^{n-1} * 2^n / n. Expected value formal series: sum_{n>=1} (1/2)^n
  * (-1)^{n-1} 2^n / n = sum (-1)^{n-1}/n = ln 2 if ordered one way; can be rearranged
  to diverge or any value. So expected value undefined. Actually the series converges
  conditionally to ln 2, but since terms can be reordered to anything, no well-defined
  expectation.


