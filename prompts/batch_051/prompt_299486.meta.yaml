  gap. Moore later made essentially the same point under the name ''the naturalistic
  fallacy'', arguing that any attempt to define ''good'' in terms of a natural property
  like pleasure or survival covertly smuggles in a moral premise. The lesson is that
  moral conclusions logically cannot follow from natural facts."


