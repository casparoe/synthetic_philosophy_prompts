  Key distinctions:

  - Hume''s is-ought gap (Hume''s Law, "no ought from an is"): in Treatise 3.1.1,
  Hume observes that moral systems move from "is" to "ought" without explanation;
  he asks that a reason be given for this new relation. The precise interpretation
  is contested: logical gap (no valid inference from purely descriptive premises to
  normative conclusion) vs. a more epistemic/pragmatic point about needing to explain
  the deduction. Modern defenders often treat it as: you need at least one normative
  premise.

  - Moore''s naturalistic fallacy (Principia Ethica §10-14): attempts to define "good"
  in terms of some natural property (pleasure, evolvedness, happiness) commit the
  naturalistic fallacy; good is simple and non-natural; he uses the open question
  argument. Moore''s target is defining the good, not deriving ought from is, though
  the two are related.

  - Common conflation: textbook gloss says "Hume showed you can''t derive an ought
  from an is, and Moore later called this the naturalistic fallacy." Actually Moore
  never used the term to refer to Hume''s law; he coined "naturalistic fallacy" for
  the mistake of identifying "good" with a natural property. There is a related but
  distinct point.

  - Another subtle error: saying "Hume claimed nothing normative can ever follow from
  descriptive facts" (overstatement) vs. "Hume asked for the missing premise to be
  supplied, noting that deducing an ought from an is seems ''altogether inconceivable''"
  — actually he said it "seems altogether inconceivable" how the deduction could be
  made; arguably he held that no ought follows from an is unless there''s a hidden
  premise. The "logic" reading is standard but some scholars dispute.

  - Also "Moore refuted naturalism with the open question argument" — standard but
  the OQA is contested.


