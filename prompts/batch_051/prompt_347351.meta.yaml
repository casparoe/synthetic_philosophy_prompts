  over a budget. Standard setup: £10 pot, each time a side passes the pot grows by
  £10 and the other side gets the turn; if a side takes, it gets 60% of the pot and
  the other 40%, and the game ends. Classical backward induction says the first mover
  takes on move one, so the growing pot is never realised. The finance director proposes
  a fix: before play, each side can buy a ''pass pledge'' from a central office. A
  pledge costs a small fee and is registered publicly; it commits the buyer to pass
  on a specified future round (say their second move) unless the other side has already
  taken. If the pledger reneges, they forfeit a deposit equal to 40% of the pot at
  that point, which goes to the other side; if the other side takes before the pledged
  round, the pledge is void and the deposit returned. The central office aims to make
  passing credible and let the pot grow.


