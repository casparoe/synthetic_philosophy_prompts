  — actually it assigns to programs/program lengths, and hypotheses are typically
  identified with programs generating infinite sequences; the prior over programs
  is 2^{-|p|}; not exactly all "explanations". Also programs must be prefix-free for
  the sum to be ≤1 (Kolmogorov''s prefix complexity). The "sum to ≤1" requires prefix-free
  encoding; plain Kolmogorov complexity doesn''t define a probability distribution
  directly because sum over all strings of 2^{-|p|} diverges. So a popularizer might
  miss the prefix-free nuance. That''s a subtle technical point I can mention maybe
  not; small LLMs may know it.


