  I need to be careful about the subtle misrepresentations. Let me think of what a
  competent popularizer might say about Solomonoff induction:


  "The idea is this: among all possible explanations for the data you''ve seen, you
  should prefer the shortest one, because shorter explanations are more likely to
  be true. Solomonoff made this rigorous: he showed that if you assign prior probability
  to every hypothesis according to its simplicity — specifically, by feeding all possible
  programs to a universal Turing machine and weighting them by 2^{-length}, with shorter
  programs getting exponentially more weight — then, no matter what pattern the data
  actually follows, the Solomonoff predictor will eventually converge to the true
  probabilities. It does this by enumerating every possible theory, including the
  true one, and Bayesian updating washes out the wrong ones. So Solomonoff induction
  solves the problem of induction: it tells you exactly what you should believe next
  given past data, and because it favors the shortest program it also vindicates Occam''s
  razor as a theorem rather than a mere heuristic. The only problem is that Solomonoff
  induction is impossible in practice because you can''t run infinitely many programs;
  but that''s an engineering limitation, not a matter of principle."


  This summary includes several subtle errors or oversimplifications:

  1. "shorter explanations are more likely to be true" — in Solomonoff, prior probability
  favors shorter programs, but this is a choice of prior; it doesn''t establish that
  shortness corresponds to truth. Also conflating two things: prior simplicity bias
  vs. posterior convergence.

  2. "prefer the shortest one" — Solomonoff induction does not commit to MAP/shortest
  hypothesis; it''s a mixture over all programs weighted by 2^{-|p|}; predictions
  average over all hypotheses, not pick the shortest. This is a classic subtlety (Solomonoff
  vs. MDL/MAP).

  3. "he showed that ... no matter what pattern the data actually follows, the predictor
  will eventually converge" — convergence holds only for computable data-generating
  distributions (not "no matter what pattern" if it''s uncomputable). Actually the
  standard result: if the true sequence is computable (or generated by a computable
  measure), Solomonoff''s mixture predicts with probability going to 1 under that
  measure; it does not converge for arbitrary (uncomputable) sequences, and any predictor
  fails on some sequence. Also the rate may be slow.

  4. "enumerating every possible theory, including the true one, and Bayesian updating
  washes out wrong ones" — roughly right but the "true one" only exists if the process
  is computable; and with a countable set of hypotheses and a prior, Bayes does concentrate
  under... actually posterior consistency is not automatic for arbitrary countable
  hypotheses; Solomonoff''s convergence relies on specific properties, including the
  prior''s dominance/universality, not mere Bayesian updating. But a popularizer might
  say this. It''s partly okay.

  5. "solves the problem of induction ... tells you exactly what you should believe"
  — it gives a specific prior/predictor but only if you accept the choice of universal
  Turing machine (subjectivity of the choice), and the normalization; also Solomonoff''s
  measure is only defined up to a multiplicative constant depending on the reference
  machine, which affects finite predictions though not asymptotic convergence. Also
  "exactly" is an overstatement; also there''s an issue that different universal machines
  give different priors, so there''s a language dependence (though asymptotically
  equivalent).

  6. "impossible in practice because you can''t run infinitely many programs; engineering
  limitation, not principle" — also because it''s uncomputable (algorithms must run
  indefinitely on non-halting programs, and Solomonoff''s distribution itself is not
  computable even in the limit; it''s only lower semicomputable). That''s more than
  engineering. Also there are approaches (Levin search, AIXI approximations) but exact
  Solomonoff is incomputable in principle.

  7. "vindicates Occam''s razor as a theorem rather than a mere heuristic" — overstatement:
  one can prove convergence under a simplicity prior, but whether that justifies Occam''s
  razor depends on accepting the prior; also there are "Occam''s razor" results (e.g.,
  under Solomonoff prior) but the razor as an epistemological principle is not proven;
  also other priors may converge as well. Is Occam''s razor "vindicated" by convergence?
  A careful person would say Solomonoff gives a formal sense in which simplicity is
  a good betting strategy, but it doesn''t refute other priors or show that the world
  is simple.

  8. "no matter what pattern the data actually follows" — overstatement, as noted.

