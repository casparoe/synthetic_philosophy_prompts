  ---


  I recently sat in on a criminal case in which a neurologist testified that a defendant''s
  brain was not the brain of a "normal" moral agent, and I have not been able to stop
  thinking about the deeper question underneath the testimony: whether anyone ever
  deserves punishment in the first place. The question has pulled me into the exchange
  between Daniel Dennett and Gregg Caruso about just deserts, and I want to think
  through a well-known real case with the tools that exchange supplies.


  The two positions, as I understand them, are these. Dennett defends a compatibilist
  position: the fact that human action is, in some broad sense, shaped by prior causes
  does not dissolve moral responsibility; our practices of holding one another accountable
  are not a mistake to be explained away but part of the machinery that makes us competent,
  answerable agents. On this view, punishment can be deserved — not as cosmic payback,
  but as something like a warranted response to wrongdoing by an agent whose capacities
  were in working order. Caruso, by contrast, is a free-will skeptic about basic desert:
  he argues that no one is ultimately deserving of praise or blame in the way retributive
  punishment requires, because our actions are ultimately the product of luck and
  causation we did not author. He does not say dangerous people must simply be let
  loose; he says the criminal justice system should be rebuilt on a public-health
  or quarantine model, which permits incapacitation and rehabilitation but forbids
  punishment inflicted for its own sake as desert.


  Now the case I want to analyze: Charles Whitman, the University of Texas tower shooter.
  On August 1, 1966, Whitman — a former Marine, an Eagle Scout, an engineering student,
  by all accounts intelligent and disciplined — killed his wife and his mother, then
  went to the observation deck of the University of Texas tower in Austin and shot
  at strangers for more than an hour, killing over a dozen people and wounding dozens
  more before police shot him dead. He had complained to a psychiatrist of violent
  impulses and severe headaches and, in his final notes, described himself as unable
  to understand the irrational, violent urges overtaking him and asked that his brain
  be examined. The autopsy found a glioblastoma that was pressing on his amygdala,
  a region involved in emotion and fear.


  I''d like an analysis, not a summary...


  The question: Analyze this episode through the Dennett–Caruso debate. What does
