  Let me recall:


  Libet''s experiments (1983): subjects watch a clock (oscilloscope dot rotating,
  ~2.56 seconds per revolution), flex wrist at will, note the time (W, "will" judgment)
  when they first became aware of the urge/intention to move. EEG records Readiness
  Potential (Bereitschaftspotential, discovered by Kornhuber & Deecke 1965) beginning
  ~550 ms before movement. Libet found RP onset about 350-400 ms before reported W
  time, which was about 200 ms before movement. So neural preparation precedes conscious
  intention by about a third to half second. But there''s the "veto" possibility —
  conscious will could veto an action in the final 100-200 ms before movement. Libet
  himself thought free will exists as "free won''t".


  Schurger et al. (2012) reinterpreted the readiness potential: in a model (neural
  accumulator / drift-diffusion), spontaneous self-initiated movements are like decisions
  crossing a threshold; the RP-like activity before movement could be the slow accumulation
  of stochastic fluctuations above baseline; the "when to move" might be determined
  by when the accumulator crosses threshold, but crucially the pre-W activity doesn''t
  necessarily reflect an unconscious decision that precedes awareness in the way Libet
  thought. Also, since the RP is only measured on trials where movement actually occurs,
  the pre-movement buildup is partly a selection artifact, an "averaging artifact"
  of waves preceding movements. Schurger: "the readiness potential is what the decision
  process looks like when a threshold crossing is preceded by a slow drift." The contrast
  is: no build-up → movement vs spontaneous. Also Aaron Schurger, Jacobo Sitt, Stanislas
  Dehaene, PNAS 2012, "An accumulator model for spontaneous neural activity prior
  to self-initiated movement." They found that in their model, the decision to move
  can occur around threshold crossing near 150 ms before movement, and the early RP
  is the tail of slow fluctuations.


  Also Libet''s W time measurement itself has problems: introspection timing, the
  "latency" issue, dual-task interference. Some argue the reported W is unreliable
