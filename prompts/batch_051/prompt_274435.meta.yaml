  crops cannot be grown reliably on their land. They drink the milk, occasionally
  slaughter a goat, and sell some animals to buy grain and pay school fees. My verdict:
  not wrong.


  3. A pregnant woman with chronic anemia in a low-income country relies on a diet
  of maize and beans. She cannot get or afford reliable iron supplements or fortified
  foods. She keeps a few hens, eats their eggs, and eats fish when she can get it.
  My verdict: not wrong.


