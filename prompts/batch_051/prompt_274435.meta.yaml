  I have been trying to work out what I actually believe about using and eating animal
  products in settings where plant-based alternatives are not reliably available,
  affordable, or nutritionally adequate. I have collected my gut reactions to a series
  of cases. I''m not asking you to tell me what the correct moral theory is in general;
  I want you to help me find the principle or small set of principles that best captures
