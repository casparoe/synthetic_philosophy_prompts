  Definitions: outcome Y in {0,1}, protected group A. Score R.

  - Calibration: P(Y=1 | R=r, A=a) = P(Y=1|R=r,A=b) for all r. Or E[Y|R].

  - Balance for positive class / equal opportunity: P(R>t | Y=1, A=a) = P(R>t | Y=1,
  A=b) (equal true positive rates) — equalized odds includes both positive and negative.

  - Balance for negative class: P(R>t | Y=0, A=a) = ... (equal false positive rates).

  - Predictive parity: P(Y=1 | R>t, A=a) = P(Y=1 | R>t,A=b) (equal positive predictive
  value).


