  I''m in a philosophy of probability seminar this term and we''ve spent the last
  two weeks circling around the Principal Principle (your credence should line up
  with objective chance once you''ve conditionalized on the right background info).
  Before I can even state it properly I feel like I need a working defintion of "objective
  chance" itself, and the readings keep using the term like its obvious.


  Could you give me a definition of objective chance (physical probability, not credence)
  that gets the following cases right? Some I''m pretty sure belong in, some I''m
  pretty sure belong out, and a bunch I keep flip-flopping on.


  Cases I''d call clearly objective:

  (a) Whether a particular radium atom decays in the next hour; the usual quantum
  probability.


  Cases I''d call clearly not objective:

  (b) Whether the quadrillionth digit of pi is a 7. There''s a fact of the matter,
  we just don''t know it.


  Borderline ones (I genuinely don''t know where these should land):

  (c) The top card of a well-shuffled deck sitting facedown on the table. It''s already
  fixed, but before we looked the shuffle gave it 1/52.

  (d) A deterministic-but-chaotic weather model that outputs "70% chance of rain tomorrow".
