  Let me recall Korean Four-Seven debate:


  - The Four Beginnings (四端) come from Mencius: 恻隐之心 (compassion), 羞恶之心 (shame/disdain),
  辞让之心 (modesty/yielding/deference), 是非之心 (approval/disapproval, right/wrong). These
  are the "sprouts" of the four virtues: benevolence, righteousness, propriety, wisdom.

  - The Seven Emotions (七情) come from the Book of Rites / Liji: 喜怒哀惧爱恶欲 (joy, anger,
  sorrow, fear, love, dislike/hatred, desire). "What man desires" etc.


  - The debate began with a passage in Zhu Xi: "The Four Beginnings are the issuance
  of principle (li); the Seven Emotions are the issuance of material force (qi)."
  This is ambiguous.


  - Yi Hwang (Toegye), older, 1501–1570, wrote to Gi Dae-seung (Gobong, 1527–1572)
  formulating: "The Four Beginnings issue from principle, and material force follows;
  the Seven Emotions issue from material force, and principle rides on it." ("사단은
  리가 발함에 기가 따르는 것이고, 칠정은 기가 발함에 리가 타는 것이다" — "Four Beginnings are the issuance of
  li, with qi following; Seven Emotions are the issuance of qi, with li mounting/riding.")
  This is called "mutual issuance" or "호발설" (mutual issuance), literally "the theory
  of mutual issuance" (是理發氣隨, 氣發理乘).


  - Gi Dae-seung objected: if both ultimately require both li and qi, how can one
  be said to issue from one or the other? The seven emotions include the four (compassion,
  shame etc. are also emotions—joy, anger). He argued that the distinction is not
  of origin but of normative quality; The Four Beginnings are the Seven Emotions in
  their good/pure manifestations. He said "the Four Beginnings are a subset of the
  Seven Emotions" — indeed all Four Beginnings can be categorized as certain of the
  Seven Emotions. He advocated "四端七情理氣共發" or "理氣共發": both are joint issuances of li
  and qi; the distinction is that Four Beginnings are purely good (not because they
  lack qi but because principle is properly expressed), while Seven Emotions can be
  good or bad.


  - Yi I (Yulgok, 1536–1584) took up after both, agreeing largely with Gobong, arguing
  "both the Four and the Seven issue from material force, and principle is the ground/criterion"
  — "기발리승일도설" (the single path: qi issues, li rides) — called "기발리승" for all emotions;
  the Four are good subsets of Seven that accord with principle, while Seven emotions
  are mutable. Yulgok held "both the Four Beginnings and Seven Emotions are the issuance
  of qi; principle is what makes them appropriate; the Four are good only because
  they follow principle." The key dispute: one source or two, and in what sense li
  (a normative, metaphysical principle) can "issue" at all versus being a condition/ground.


