  Potential prompt:


  Alright, I''m a retired geologist (35 years in the field, mostly writing reports
  for government agencies) and in the last couple years I''ve gotten into philosophy
  through a local reading group. Next month I''m leading our session on Orwell''s
  "Politics and the English Language." Most of the group are not academics, but they''re
  sharp people who like to argue.


  The passage I want to build the session around is this, from Orwell:


  "When there is a gap between one''s real and one''s declared aims, one turns as
  it were instinctively to long words and exhausted idioms, like a cuttlefish squirting
  out ink."


  I love the cuttlefish image—as a biologist I actually know something about cephalopods,
  and the ink cloud is a defensive concealment mechanism. But I don''t want to just
  explain it; I want the group to work through the logic. So I need a teaching plan,
  not an explanation of the quote. Specifically: what has to be in place before this
  sentence makes sense? If you had to pick one example to carry the whole thing—maybe
  from modern politics, science bureaucratese, or wherever—what should it have? What
  misconceptions should I expect? I can already hear someone saying "So Orwell thinks
