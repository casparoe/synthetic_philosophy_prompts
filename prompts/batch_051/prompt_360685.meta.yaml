  Potential prompt:


  I''ve been arguing with people in my reading group about actual infinities, and
  I''ve noticed an asymmetry in how many of us handle the same concept across domains.
  Most of the group is happy to do standard set theory: they agree that the natural
  numbers form a completed set, that Cantor''s diagonal argument shows there are more
  reals than naturals, and that Hilbert''s hotel is a valid thought experiment about
  denumerable infinity. But when the conversation turns to whether the physical universe
  could contain an actually infinite number of past events, or whether an actually
  infinite collection of concrete objects could exist, several of the same people
  suddenly become finitists. They say completed infinities are legitimate idealizations
  in mathematics but physically impossible, or at least deeply suspicious. The asymmetry
  is this: we are willing to treat an actually infinite collection as a well-defined
  object for mathematical purposes, but we refuse to accept that the same kind of
  collection could be instantiated outside mathematics, even though the mathematical
  theory is supposed to constrain what is possible in any domain where it applies.


  I want to know whether anything justifies that split, or whether it''s just sociological
  comfort with textbook objects. Some candidate justifications I''ve considered: (1)
  physical actual infinities would violate the principle that every physical event
  must be reachable by finite steps; (2) mathematics doesn''t assert existence in
  the same sense as physics, so no asymmetry needs defending; (3) the paradoxes of
  infinitary reasoning (Hilbert''s hotel, the shift by one) are tolerable in mathematics
  but reveal genuine incoherence in concrete actuality. The candidate I find hardest
  to dismiss is that our confidence in infinite mathematics is really about formal
  manipulation of symbols, whereas physical actual infinities would force us to make
  sense of completed totalities in nature. But I''m not sure that''s a principle rather
  than a restatement of the asymmetry.


