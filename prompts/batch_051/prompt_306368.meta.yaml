  ---


  I have been developing a refinement of the Stoic dichotomy of control and would
  like an honest assessment of it, including where it collapses or backfires.


  As I understand the standard position, Epictetus divides everything into what is
  up to us — judgment, impulse, desire, aversion, the activity of the will itself
  — and what is not up to us — the body, reputation, property, office, and everything
  else external to the will. The accompanying therapeutic instruction is to concern
  ourselves only with the first class and to regard the second as indifferent. I think
  the second class hides a distinction that matters in practice.


  My proposal is to split the not-up-to-us class in two. Some things are external
  to the will and also outside any causal purchase of my choices: the weather over
  another continent tomorrow, whether a passerby notices me, the fact that some historical
  event happened rather than another. Call these the mere externals. Other things
  are external in that their occurrence is not determined by my will, but my deliberate
  activity can shift their probability in a reasonably stable way: my health, which
  my habits influence but never guarantee; my chances at a position, which I can improve
  by preparing and applying widely; a friend''s forgiveness, which a sincere, undefended
  apology can make more likely but cannot secure. Call these the influenceable.


  The central claim is that the dichotomy''s practical instruction — withdraw concern
  from everything outside the will — needs a different form for each subclass. For
  mere externals, the standard instruction stands: they are indifferent simpliciter,
  and no rational striving can take them as its object. For influenceables, the correct
  discipline is not bare detachment but a two-part stance I call invested equanimity:
  pursue the preferred outcome through one''s own excellent activity, while having
  already accepted that the outcome itself will be what it is and is not one''s own.


  I recognize that this may just be the Stoic doctrine of preferred indifferents pursued
  with the reserve clause, or the modern trichotomy of control under a new name, and
  that the original partition may have been deliberately exhaustive in a way my refinement
  obscures. So I want to know: is the distinction coherent, and does it add anything
  to the standard view once one distinguishes the activity of choosing from what the
  choice achieves? Does treating influenceable externals as objects of rational striving
  quietly reintroduce the attachment the dichotomy is meant to dissolve, or does it
  correct an overly ascetic reading of Epictetus? Give me the strongest version of
  my proposal and then say exactly where it fails or stops being distinctive.


