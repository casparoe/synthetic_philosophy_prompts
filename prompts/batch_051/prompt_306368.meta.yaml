  "I have been working for some time on a refinement of the Stoic dichotomy of control,
  and I would like an honest assessment of it. The standard division, as I understand
  it, is a partition into two classes. In the first class are things that are up to
  us: our judgments, impulses, desires, and aversions — the activity of the will itself.
  In the second class are things not up to us: the body, property, reputation, office,
  and, in short, everything external to the will. The therapeutic instruction is to
  care only about the first class and to treat the second as indifferent. I think
  this second class conceals an important difference.


  My proposal is to split the ''not up to us'' class into two. Some things are external
  and also outside the reach of one''s choices altogether: the weather over another
  continent tomorrow, whether a stranger on the train happens to remember one''s face,
  the fact that a particular historical event did or did not occur. Call these the
  mere externals or the simply indifferent. Other things are external in the sense
  that their occurrence is not determined by the will, but my deliberate actions can
  shift their probability in a reasonably reliable way: my health, if I exercise and
  eat carefully; my chances of being hired, if I prepare well and apply widely; a
  friend''s forgiveness, if I make a considered and undefended apology. Call these
  the influenceable externals.


  The central claim of my refinement is that the practical instruction of the dichotomy
  — withdraw your concern from everything outside the will — should be understood
  differently for the two subclasses. For mere externals, the standard instruction
  stands: they are simply indifferent, and nothing about them can be an object of
  rational striving. But for influenceable externals, the right discipline is not
  bare detachment but a two-part stance: pursue the preferred outcome through one''s
  own excellent activity while accepting firmly in advance that the outcome itself
  remains outside one''s power. Call this the stance of invested equanimity.


