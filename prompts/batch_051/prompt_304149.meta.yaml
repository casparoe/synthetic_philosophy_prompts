  We want an asymmetry in ordinary judgments:

  A. People regard it as a serious defect of the world (an injustice) when the wicked
  flourish and the good suffer. They say "there''s no justice," "the universe is unfair."

  B. People regard the doctrine that the universe itself ensures moral desert (that
  wickedness brings suffering and virtue brings happiness, in this life or another)
  as superstitious, implausible, or even ethically suspect.


  Question: Can we justify holding both? Or is at least one a mistake?


  Candidate justifications:

  1. The "unjust" judgment is normative, not descriptive: we aren''t claiming the
  universe has a duty; we''re expressing the ideal that *if* suffering is to be imposed
  / goods distributed, *we* as agents should track desert, or that the state of affairs
  is bad and calls for correction by persons. We can lament without positing a cosmic
  enforcer. This squares with rejecting karma (a descriptive causal law).

  2. The rejection of karma might be epistemic (no evidence) rather than normative;
  one can desire/cosmic justice while denying that there is a mechanism. But is it
  rational to resent the world for not meeting a standard that one denies exists?
  Maybe yes if the standard is a moral ideal we apply to states of affairs.

  3. Karma may be rejected because it blames victims (the sufferer deserved it), which
  conflicts with our compassion; while the initial outcry is on behalf of victims.
  So both spring from the same root: sympathy with the innocent. But then the asymmetry
  is: we want to explain suffering as undeserved; when karma says the sufferer deserved
  it, we recoil. That may reconcile: the initial judgment is "the innocent suffer,"
  and karma would deny the innocence. However, for the *wicked prosper* case, karma
  promises they won''t ultimately; we might still reject it because of epistemic/naturalistic
  commitments, but our outrage at their prospering seems to wish for such a mechanism.

  4. Another distinction: first-person vs third-person? In our own moral practice,
  we hold agents responsible and punish; in nature we expect no agency. But then why
  call nature unjust?

  5. The two judgments might be inconsistent and the right result is to revise: either
  stop saying the world is unjust (call it tragic, not unjust) or take cosmic moral
  order more seriously as a genuine postulate/practical faith (Kant-like), or keep
  outrage but direct it toward human agency.


  The prompt could explicitly mention a nearby case to test: whether someone who is
  outraged that a cruel person prospers should, to be consistent, support karmic doctrines,
  and if they decline, whether their outrage is mere aesthetic preference. Or the
  inverse: if they reject karma, can they still reasonably describe the prosperity
  of the wicked as an injustice, or should they call it simply unpleasant/tragic?


  Also, the prompt should ask "whether anything justifies it" — yes.


