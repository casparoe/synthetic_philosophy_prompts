  Multiple realizability core: the same kind of mental state can be realized by different
  physical kinds, so type identity theory (mental state type = physical state type)
  is false; functionalism defines mental states by their causal/functional roles.
  The dependency order: (1) identity theory claim and reductive instinct (pain = C-fiber
  firing in humans); (2) multiple realization evidence/counterexamples (octopus, robots,
  aliens with different physiology plausibly feel pain); (3) the move to functional
  roles: what matters is what the state does, not what it''s made of; (4) functionalism
  as a positive view; (5) what multiple realizability does and doesn''t commit you
  to (doesn''t by itself show aliens actually have pain, just that it''s possible
  in principle; doesn''t mean substrate is irrelevant to any mental state; doesn''t
  claim mental states have no physical realization at all).


  Misconceptions:

  - "Functionalism says the mind is software and brain is hardware; so minds can run
  on anything" — overstatement; functionalism is compatible with constraints on implementation,
  and multiple realizability is an empirical claim about what''s actually possible,
  not a guarantee that any functional duplicate has the same mind. Also "software/hardware"
  metaphor smuggles dualism.

  - "Multiple realizability proves that robots/aliens really do feel pain" — it only
  shows identity theory is too strong; it doesn''t establish which other systems have
  minds.

  - "If pain is multiply realizable, then it''s not physical at all" — multiple realizability
  at the level of lower-level kinds doesn''t imply nonphysical; it''s still realized
  physically in each case.

  - "Functionalism is just behaviorism" — role vs. behavior; functional states are
  internal causes, not just dispositions.

  - "Different physical realizers mean different mental states" (type identity intuition);
  need to distinguish token identity from type identity.

  - "So psychology can ignore neuroscience" — functionalism doesn''t entail that;
  lower-level facts matter for what roles are possible and how they''re implemented.

  - "This is just ''what matters is what it does,'' so a chatbot that acts like it''s
  in pain is in pain" — conflates functional role with behavior; functional roles
  are defined by internal causal relations, and human-like pain involves a rich network
  of other states, not a single output behavior.


  Carrying example considerations: The standard example (pain in humans vs Martians
  vs silicon-based AI) can work but has pitfalls. Better carrying example might be
  "a valve" or "a mousetrap" analog? For teaching the role/occupant distinction: a
  mousetrap''s role (catch mice) can be realized by many materials; but the trap has
  a function, not a mental state. Could use "water/H2O vs...?" Actually the classic
  is "pain = C-fiber firing in humans but not in octopuses." Need an example that
  (a) has same functional role, (b) clearly different physical substrate, (c) plausibly
  same mental state, (d) doesn''t trigger "so only outcome matters." A pump, a carburetor
  vs fuel injection, a clock (role of keeping time realized by gears vs quartz vs
  sundial?) But for mental states need an intuition pump: octopus pain, robot pain.


