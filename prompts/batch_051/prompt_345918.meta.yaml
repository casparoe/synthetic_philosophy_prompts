  "I find myself pulled in two directions about what it is to infer a person''s preferences
  from what they do, and I want a principled way to settle it.


  On one side I am persuaded by the basic modeling stance of inverse reinforcement
  learning: a person''s preferences are whatever reward function makes their observed
  behavior rational—or near-rational once we allow for noise, ignorance, and the constraints
  the situation imposes. The stance has genuine systematic virtues. It anchors preference
  inference in something observable rather than in unverifiable inner states. It unifies
  explanation and prediction, since the reward function that rationalizes what someone
  did is also what forecasts what they will do next. It applies to any agent whose
  internals we cannot inspect, from nonhuman animals to artificial systems. It even
  has an answer to its own underdetermination problem—many reward functions rationalize
  the same behavior—namely, impose a preference for simpler or more entropic reward
  functions and treat the result as the inferred preference. And it absorbs the obvious
  counterexamples: the person who chooses among a restricted menu of options, or under
  threat, or while misinformed, is still maximizing some reward given constraints
  and beliefs; the apparent gap between behavior and preference is a misspecified
  environment or a wrong belief, not a fact about preference beyond behavior. On this
  view, if behavior and preference seem to come apart, the model is wrong, not the
  identification of the two.


  On the other side, I have an intuition I cannot shake: there are cases where behavior
  is precisely not authoritative about what a person really wants. The person in withdrawal
  who uses, the worker who signs under serious duress, the person who judges forges
  ahead and acts against her settled better judgment, the depressed patient whose
  choices are narrowed in ways that a healthier version of herself would disown. In
  these cases the point of saying ''that is not what they really prefer'' is to drive
  a wedge between what the behavior reveals and what the person wants. The wedge matters
  for how we treat them: we do not infer from the coerced signature that the person
  genuinely consented, or from the addict''s use that the addiction expresses a preference
  we should help them satisfy. Here preference looks like a real psychological state
  distinct from choice, with behavior as fallible evidence for it rather than what
  constitutes it. If that is right, a reward function fitted to behavior can be systematically
  wrong about what a person actually wants, however parsimoniously it rationalizes
  the behavior afterward."


