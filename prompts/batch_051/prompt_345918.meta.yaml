  Potential final text:


  "I find myself pulled in two directions about what it is to infer a person''s preferences
  from what they do. On one side, I am persuaded by the basic stance of inverse reinforcement
  learning: preferences are operationally whatever reward function makes the observed
  behavior rational, or approximately rational under noise and situated constraints.
  The stance has real virtues. It gives preference inference a concrete, objective
  anchor instead of an appeal to unobservable inner states; it unifies explanation
  and prediction, since the same inferred reward function that rationalizes what someone
  did also forecasts what they will do next; it applies across the board to agents
  whose internals we cannot access, from nonhuman animals to artificial systems. And
  it seems equipped to absorb hard cases: constraints such as poverty, threats, or
  menus from which one had to choose are properties of the environment rather than
  of the preference; apparent weakness of will becomes conflicting rewards at different
  time horizons or an agent''s mistaken beliefs. On this view, if behavior and ''preference''
  ever seem to come apart, that is a sign that the reward model is misspecified, not
  that there is a fact about preference floating free of behavior.


  But on the other side I have an intuition I cannot shake: there are cases where
  a person''s behavior is precisely not authoritative about what they genuinely want.
  The person in withdrawal who uses drugs, the worker who signs a contract under serious
  duress, the person who judges forges ahead and acts against their own settled better
  judgment, the depressed patient whose choices flatten into choices a healthier version
  of themselves would disown. In these cases the whole point of saying ''that is not
  what they really prefer'' is to drive a wedge between what the behavior reveals
  and what the person wants. The wedge matters for how we should treat them: we do
  not infer from the coerced signature that the person genuinely consented, or from
  the addict''s use that the addiction expresses a preference we should respectfully
  facilitate. Here preference looks like a real psychological state distinct from
  choice, with behavior as fallible evidence for it rather than what constitutes it.
  If that is right, a reward function fitted to behavior can be systematically wrong
  about what a person actually wants, however elegantly it rationalizes the behavior
  afterward."


