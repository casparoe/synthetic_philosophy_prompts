  Which is the right move: debunk the intuition as folk psychology the IRL stance
  should teach us to drop; amend the theory so that revealed preference and genuine
  preference are distinguished, even at the cost of simplicity and tractability; or
  show that the two are compatible because the theory never claimed to recover genuine
  preference in the first place? And if the last, is that a genuine reconciliation
  or just a retrenchment? Tell me what would justify each move and which of my convictions
  has to go."


