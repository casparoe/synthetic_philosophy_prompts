  Let''s explore James vs Clifford more. The two figures:

  - W.K. Clifford, "The Ethics of Belief" (1877): "It is wrong always, everywhere,
  and for anyone, to believe anything upon insufficient evidence." He gives ship-owner
  example.

  - William James, "The Will to Believe" (1896): argues that under certain conditions
  we may have a "right to believe" or right to adopt a belief without adequate evidence;
  specifically genuine options (living, forced, momentous) where the option cannot
  be settled on intellectual grounds and believing may be necessary to bring about
  the fact (self-fulfilling beliefs), e.g., social relations, religious hypotheses.
  James is not saying we may believe anything; he says when the option is genuine
  and intellect cannot decide, passional nature may lawfully decide.


  Subtle points a student might get wrong:

  1. Conflating Clifford''s principle as necessary vs sufficient conditions for belief.

  2. Misstating James as a general voluntarist about belief (doxastic voluntarism),
  when James actually... hmm, James thinks we can sometimes choose beliefs? He writes
  about "will to believe" but acknowledges that our passional nature decides. A student
