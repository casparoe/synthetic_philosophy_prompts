  The conceptual issue: "avoid side effects" / low impact. Impact measures attempt
  to formalize the idea that an AI should achieve a goal while minimizing side effects
  on the rest of the world, without needing a full specification of human values.
  Approaches: relative reachability (Krakovna et al.) — penalize the agent for making
  states unreachable relative to a baseline; attainable utility preservation (Turner
  et al.) — preserve the agent''s ability to achieve a range of possible goals; "whitelisting"
  effects; specifying what must not change (a "safety constraint set"). The deep problem:
  any low-impact measure needs some notion of which features of the world count as
  "side effects" vs intended effects, which requires a partial specification of value
  or a baseline. Defining side effects requires distinguishing the intended changes
  (cleaning the floor) from everything else (moving furniture, opening doors, using
  electricity). If you just minimize changes to the state, the agent does nothing
  (or does the task while undoing it to restore the state). If you let the human specify
  "only clean the floor," you''ve smuggled in a task specification that''s doing the
  value work, and the side effect constraint reduces to "don''t do anything outside
  the task," which is a full specification of allowed changes in the relevant region.


  So the procedure a practitioner could follow: an engineer or auditor reviews a proposed
  low-impact constraint for a deployed robot and checks whether it actually avoids
  needing a full value spec, or whether it smuggles one in. Checks:

  1. Ask: what counts as a side effect in this spec? Does the spec define it extensionally
  (a list of protected features/variables) or intensionally (deviation from a baseline
  / reduction in reachability)?

  2. If extensional list: is the list generated by a general principle, or hand-picked?
  If hand-picked, it''s just a partial value spec; fine as an engineering safety case
  but don''t call it value-free.

  3. If baseline deviation: baseline is doing nothing? If the robot is allowed to
  make the floor clean but penalized for all deviation from the "no robot" baseline,
  then cleaning itself is a deviation; how does the measure distinguish intended from
  side effects? If the answer is "the human marks cleaning as intended," then the
  measure needed a value judgment to carve out intended effects — the side-effect
  definition depends on value after all.

  4. Test: does the measure penalize the agent for effects the spec-writer would call
  good? e.g., shutting a window before mopping to keep dust out — if the spec flags
  it as side effect, it''s too coarse.

  5. Test: can the agent satisfy the letter while doing something awful? e.g., use
  a tiny amount of a toxin, or slightly damage something in a way that compounds —
  if low impact permits "small" harms, is smallness the right metric?

  6. Hard case: a side effect that is indistinguishable from the intended effect at
  the level of the sensor features (e.g., "mopping" spreads germs? no...). Hard case:
  irreversible changes to a small thing (breaking a vase) vs reversible large change
  (rearranging all furniture and putting it back). Which is lower impact? A measure
  of state deviation at the end says breaking the vase is lower impact than a mess
  that is later cleaned; a measure of path/deviation over time says the opposite.
  Which should the auditor require? Judgment.

  7. Where judgment cannot be eliminated: deciding the protected set / baseline, and
  the trade-off between "too weak to prevent side effects" and "so strong the agent
  does nothing."


