  In the concluding chapter of The Methods of Ethics, Henry Sidgwick confronts what
  he calls the dualism of practical reason: the rational method of egoism, which directs
  an agent to his own greatest good, and the rational method of utilitarianism, which
  directs him to the greatest good of all, appear equally authoritative, yet in some
  cases they issue incompatible instructions. Sidgwick says he can find no higher
  principle to adjudicate between them, and he concludes that the only way to avoid
  the contradiction would be to assume a divine order in which duty and self-interest
  coincide—an assumption he treats as falling outside ethics proper. This reminded
  me of a multi-agent reinforcement learning setup in which two agents, each with
  its own reward function, act in a shared environment: each policy is locally rational
  relative to its own reward, but there may be no joint objective that orders the
  resulting equilibria, and the same behavior can be consistent with several incompatible
  reward decompositions. Is this a deep structural parallel or a superficial analogy?
  If it is deep, does anything from multi-agent RL—for instance, the fact that adding
  a global objective constrains the policy space—transfer to the question whether
  Sidgwick''s dualism shows practical reason to be incoherent, or merely that the
  phrase practical reason covers two distinct optimization problems?


