  ---


  Construct a thought experiment for the rationalist theory of war, transposed to
  an AI race. Work with the Fearon-style framework, which holds that even when rational
  actors all prefer some peaceful bargain to a costly fight, bargaining can still
  fail for one of three reasons: private information with incentives to misrepresent,
  commitment problems, or issue indivisibilities. I want a case in which an AI race
  breaks out under the following specifications:


  - The race is between two actors — labs, states, or a lab and a state — and both
  parties would strictly prefer a verifiable, enforceable agreement to constrain the
  deployment of a specific AI capability to the race that actually occurs. Make the
  race costly enough that the preference is real, not cosmetic.

  - The cause is a commitment problem of the shifting-power kind, not a first-mover
  or offensive-advantage kind. That is, the binding failure is not that whoever defects
  first gains a decisive advantage, but that the balance of power is expected to shift
  against one party over time: the side that expects to decline knows that the rising
  side cannot credibly commit to honor the bargain once its lead has compounded, so
  it defects — races or refuses the deal — now, while it still has leverage.

  - Complete information: each side knows the other''s capabilities, timelines, and
  preferences. Private information about resolve, progress, or type must play no explanatory
  role.

  - No indivisibility: the subject of the bargain is in principle divisible or compensable.
  Nothing about the capability itself rules out side-payments, phased deployment,
