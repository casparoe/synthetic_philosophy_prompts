  Potential gaming channels:

  - Benchmark selection/gaming: Labs will lobby the benchmark maintainer to define
  "frontier" in ways that don''t trigger the levy (e.g., exclude their newest capabilities,
  include metrics they''re bad at), or to set δ large. Since the levy depends on a
  public benchmark, it becomes Goodharted: capabilities will be optimized only against
  untested dimensions; the benchmark loses validity.

  - Non-member arbitrage: A lab could spin out a non-member subsidiary to deploy the
  frontier model, then license it back, avoiding the levy. Or members could buy benchmark-leading
  models from non-members and deploy them, paying no levy since the non-member ate
  the jump? Wait, if membership is deployment-based, a member deploying a non-member''s
  model that beats the frontier would still trigger the levy. But licensing from non-members
  could circumvent if tax is on the training lab rather than deployer. The prompt
  should specify whether tax falls on trainer or deployer. Let''s say the tax falls
  on deployment by member labs, keyed to the deployed model''s benchmark score. Then
  non-members can train frontier models and license them to non-members directly;
  members lose market share. Or members can set up non-member "deployment shells."
  But the scheme could specify "members may not license taxed-capable models through
  non-member intermediaries if they retain control." The gaming then is about control
  definitions, shell companies, open-weight releases (Who''s the deployer when anyone
  can download weights?).

  - Open-weight effect: If weights are open, there''s no "deployment" to tax after
  download. The levy may push labs toward open-weighting to avoid the tax or toward
  complete closure. Actually if the tax is at deployment, a lab could release open
  weights and claim no deployment; then a thousand downstream deployers run it. This
  makes the levy toothless and arguably increases diffusion. Or if the tax is at training,
  open-sourcing still triggers. This is a nice second-order effect to mention. The
  prompt can leave some for the model, but should ask the right questions.

  - Dividend gaming/restraint theater: Labs may sit just below the threshold while
  covertly building capability internally, or deploy capability in suites not on the
  benchmark (e.g., agents, robots). The dividend rewards staying within δ of a measured
  frontier, not actual restraint; it selects for slowing public benchmark improvement,
  not for safety.

  - Collusion: Members could collude to keep the frontier advancing slowly (everyone
  stays below δ) or to ensure all dividends pay equally. There''s a cartel dynamic:
  the scheme is essentially a price-fixing agreement on capability, and like cartels
  it may cheat.

  - Evaluator capture: benchmark maintainers become powerful; they can be bribed or
  captured by the members they regulate; secret updates can leak; disputes over what
  counts as "prior frontier" become manipulated.

  - The alignment tax reproduction: The levy is partly passed to consumers and investors
  as higher prices/cost of capital; the "restraint dividend" creates a new revenue
  stream for underperforming labs, subsidizing exactly the firms the market would
  otherwise kill — but is that the point? The competitiveness constraint is relocated:
  now the race is over gaming the benchmark, not paying safety costs. The alignment
