  Let me draft:


  ---


  As a journalist who covers science and ideas, I have spent a lot of time noticing
  when I treat a claim as an ordinary factual matter to be checked and when I treat
  it as something that background work must simply take for granted. I want to know
  whether these gut verdicts add up to a single principled view — I keep hearing the
  phrase "hinge epistemology" in connection with Wittgenstein''s On Certainty, but
  I am not sure my actual commitments line up with the doctrine, and I want you to
  tell me what principle, if any, captures them.


  Here are the cases, as concretely as I can put them.


  1. The neutrino anomaly. When the OPERA experiment reported neutrinos arriving at
  Gran Sasso sixty nanoseconds early, apparently faster than light, I thought the
  team was right to publish, and I treated "maybe relativity is wrong" as a genuine
  scientific question. But my subjective confidence that the result was a systematic
  error was extremely high, and none of my reasons were, at that moment, specific.
  I felt the right stance was: doubt the cornerstone, look for the error, and be unsurprised
  when the error is found. I did not think that attitude was inconsistent.


  2. The five-minute universe. In a public debate, a philosopher offered the hypothesis
  that the universe, including all records and all apparent memories, came into existence
  five minutes ago. I found myself unable to say it was false. What I felt, rather,
  was that it was not something evidence could get any purchase on, and that refusing
  to take it seriously was not a failure of open-mindedness. I would not list it among
  "things science has not ruled out."


  3. The manipulated archive. When a whistleblower tells me that documents in a public
  registry are being silently altered, I treat that as a serious allegation to be
  investigated, and specific evidence can confirm or refute it. But when someone tells
  me that the entire documentary record — every archive, every registry, every database
  — is a coordinated fabrication, I do not treat that as a bolder version of the same
  claim; I treat it as an attack on the frame that makes fact-checking possible in
  the first place.


  4. The fallible memory. When a source claims to remember verbatim what was said
  at a meeting thirty years ago, I treat the memory as weak unless documents corroborate
  it; I am entirely willing to discover that the source is confidently wrong. But
  when I remember what my editor said to me this morning, I am more certain of that
  memory than I am of any document that might be brought in to contradict it. I would
  not even be sure how to check it, because any check would itself depend on memory
  or on records whose authority is less immediate.


  5. The creationist''s decay rates. When someone argues that the fossil record is
  young because radioactive decay rates may have been different in the past, I do
  not think the question is illegitimate; I think it is an empirical claim that happens
  to be false, and I can say roughly what evidence bears on it. It annoys me when
  colleagues dismiss it as "unscientific" rather than as wrong.


  6. The denier. When someone denies that the Holocaust happened, my first instinct
  is to treat them as making an empirical claim against which the evidence is overwhelming.
  But I have also noticed that when the denial persists after the evidence is shown,
  it stops looking like ordinary error and starts looking like the person''s standards
  of historical evidence themselves are failing. I am torn about whether this is an
  extreme empirical mistake or something more like case 3.


  Do these verdicts express a single principle? If so, state it as precisely as you
  can, and say which of the cases it handles naturally and which it has to strain
  for. If not, say which verdict or verdicts I should give up, and what the cheapest
  revision of my gut is. Then apply the principle you end up with to a case I have
  not listed — say, a scientist who suspects their lab assistant is massaging data
  without any specific evidence, or a doctor who refuses to consider that a patient''s
  delusion is true — and say what it predicts.


