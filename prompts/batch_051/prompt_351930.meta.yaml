  "In my math circle, two members — Daniel and Priya — got into an argument I have
  not been able to settle. We had just seen the topological definition of continuity
  (a function is continuous when the preimage of every open set is open) and someone
  asked why that counts as the right definition when the epsilon-delta definition
  already works in metric spaces. The argument went roughly like this."


  Daniel: "The right definition is the one that generalizes furthest while keeping
  the theorems we care about. The open-set definition wins because it lets us state
  and prove the same things—continuous images of compact sets are compact, connectedness
  is preserved, the intermediate value theorem—in spaces that don''t have a metric.
  It''s the same with groups: we deliberately leave out commutativity so the definition
  covers permutations, matrix groups, symmetries, all of it. The point is maximizing
  generality without losing the theory."


  Priya: "That gets it backwards. You don''t choose a definition to make a theorem
  keep working; that''s too easy—you could cook up an artificial condition to preserve
  any single theorem. The open-set definition is right because it removes what wasn''t
  doing the work in the epsilon-delta definition: the metric. Continuity is a property
  of how sets sit around points, not of distances. Generality is a side effect of
  isolating the actual idea. And with groups, we don''t omit commutativity out of
  a thirst for breadth; we omit it because the common structure of invertible operations
  just doesn''t require commutativity. Many of the central examples happen not to
  be commutative."


  Daniel: "I think ''isolating the actual idea'' is a story told after the fact. There
  are lots of ideas you could isolate from the epsilon-delta definition, and most
  of them wouldn''t generalize well. The reason mathematicians settled on open sets
  is that the resulting theory is productive: the same theorems come out cleanly in
  a much wider range of settings. That''s a test the definition passed; it''s not
  a free-floating essence."


