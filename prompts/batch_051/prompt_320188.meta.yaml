  Audit points:

  - Accurate: it is an old rule from Victorian comparative psychology; it does tell
  you to prefer lower/simpler psychological processes when they fairly account for
  the behaviour.

  - Subtly wrong/misrepresentation: "animals don''t have thoughts or feelings" is
  too strong — it''s a rule of evidence, not a claim about what animals actually have;
  Lloyd Morgan himself didn''t deny animal minds, he saw continuity.

  - "Always explain by the simplest process" drops the "fairly interpreted" clause:
  the canon doesn''t require a low explanation when that would distort the evidence;
  the test is adequacy.

  - "Never by human-like ones" — Lloyd Morgan actually allowed interpreting in terms
  of higher processes when behaviour provides sufficient evidence; and he used analogy
  from his own experience.

  - "Researchers ignoring the canon because inconvenient" — many explicitly engage
  with it; some argue the canon has been over-applied to prop up associative accounts;
  one can follow it and still attribute planning/theory of mind if simpler accounts
  fail.

