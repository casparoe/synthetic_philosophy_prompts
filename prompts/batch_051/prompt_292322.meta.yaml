  ---


  I am a novelist writing a novel about a rich, stable democracy that loses most of
  what made it democratic over roughly a decade, and I have built a small theory to
  give the decline a shape before I write the scenes. I would like it checked before
  I let it carry the architecture of the book.


  I have been calling the theory the ladder of dirty moves. The heart of it is that
  democratic health is less a matter of what the rules say than of a shared, usually
  tacit sense of which political moves are simply off the table: imprisoning a rival
  on a pretext, changing electoral rules mid-cycle to keep power, directing the state
  broadcaster against the opposition, encouraging violent supporters to appear at
  rallies. In a healthy democracy, I claim, even ruthless parties treat some of these
  as unthinkable, and what makes the democracy healthy is that shared unthinkability
  more than the written rules.


  Backsliding, on my account, is the process by which an unthinkable move is moved
  step by step into the normal: first it is floated, then tried as a one-off with
  a deniable pretext, then repeated, then defended as precedent, and finally taken
  for granted. Every step requires a coalition of ambitious politicians, compliant
  lawyers, and exhausted or distracted voters, but the real action is in the shared
  sense of what one can no longer be shamed for. The central, falsifiable-sounding
  claim is that the thing that backslides first is not the constitution or the party
  system but this shared grammar of illegitimate moves; the institutions follow, sometimes
  years later. The mechanism is deflationary: each tolerated breach becomes publicly
  visible evidence that one can do such things and survive, which changes the expected
  cost of the next breach for every actor at once. I think this explains the pattern
  in Hungary and Poland and increasingly the United States, and the Turkish case better
  than accounts built on formal rule-breaking, because in each case the operators
  have usually kept a legal or administrative pretext of some kind.


  I know the phrase democratic backsliding is already current. What I want to know
  is whether my theory is more than a dramatised restatement of that phrase. Is it
  coherent, or is the shared grammar just the rules in people''s heads, so the distinction
  between grammar and formal rules collapses? Has the underlying idea already been
  worked out in the scholarly discussion of backsliding, and if so is my version merely
  a literary metaphor for it? And where does the theory break? In particular, who
  decides which moves are illegitimate without begging the question in favour of one
  side — the accusation that the concept of backsliding is just a partisan label applied
  to policies one dislikes — and can my ladder explain why some breaches normalise
