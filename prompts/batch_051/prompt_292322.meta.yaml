  I am a novelist, not a teacher of critical thinking, but I keep coming across the
  view that rationality—the kind of judgement one exercises in weighing evidence,
  updating beliefs, and noticing motivated reasoning—can be trained the way a martial
  art is trained: not chiefly by reading about it or by trying to reason well in unstructured
  situations, but by repeating small, isolated drills, or katas, each designed to
  strengthen one narrow move, on the understanding that the skill will then transfer
  to real, messy cases. The claim has three parts, as I understand it: first, that
  there are identifiable moves; second, that practising a move on a simplified, artificial
  case does more for the underlying capacity than simply reflecting on complex real
  cases; third, that whatever is gained through the drills transfers, however partially,
  to contexts that look nothing like the drill.


  I want to adopt this in my working life as a novelist. I revise fiction for a living,
  and a recurring part of that work is judging whether the reasoning inside the book
  is good enough: whether a character''s inference from the evidence I have silently
  supplied is warranted or merely convenient, whether a change of mind I have written
  is earned or abrupt, whether the novel''s own argument—insofar as a novel has one—is
  genuinely supported by the scenes or simply asserted by the narrator at the end.
  These faults are hard to see in my own work, and I suspect that is because I am
  trying to catch them in the full complexity of a manuscript.


  Please design a reusable procedure for this: a set of katas for a novelist, each
  one a short, timed drill that isolates one rational move relevant to fiction and
  can be run in thirty minutes or less at my desk before I turn to the day''s revision.
  It should be something I can use repeatedly, on different problems, without formal
  training in probability or logic, and without needing to put numbers on anything—though
  I am willing to make comparisons such as more likely, less likely, expected given
  X but surprising given Y. For each kata give me the rule, the standard against which
