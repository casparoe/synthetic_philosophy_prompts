  Mill: The Subjection of Women (1869). He argues that the subordination of women
  to men rests not on reason but on custom, and that what is customary comes to seem
  natural. He denies that the existing differences between men and women are due to
  nature, because we can''t know women''s nature given their social condition (like
  a tree in a greenhouse). Appeals to nature are suspect because almost every repulsive
  practice has been claimed natural at some point. He doesn''t claim nature has no
  normative force in every sense; he argues the appeal to nature in this debate is
  empty/invalid. Also he uses a utilitarian framework — the rightness of arrangements
  is to be tested by utility, not by custom or "nature".


