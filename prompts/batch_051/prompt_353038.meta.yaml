  to advance assertions, to challenge any claim, and to speak free of coercion from
  within or outside the discussion; the only pressure permitted is the force of the
  better argument. Habermas holds that anyone who enters seriously into argumentation
  counterfactually presupposes something like these conditions, since otherwise one
