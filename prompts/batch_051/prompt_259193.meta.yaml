  but looks track only what we happen to find salient; any finite string has some
  short program relative to enough of a contrived universal machine, and under a fair
  coin every string of the same length has exactly the same probability. The apparatus
  that makes randomness precise — Martin-Löf randomness, and the related definitions
  — applies to infinite sequences, or to the process that produced an outcome, not
  to a single finite string in isolation. On this view, a sequence like HTTHTHHTT
  (where H and T are heads and tails) is no more and no less random than HHHHHHHHH;
  to call the first ''random'' and the second ''not random'' is a category mistake
  or a remark about my psychology.


