  Prompt draft:


  "I want an honest assessment of a view I''ve been developing about word embeddings.
  I call it the hypothesis of local convexity: for any monosemous word w, the set
  of contexts in which w can be literally and correctly used corresponds to a convex
  subset of the embedding space, and conversely, any sufficiently convex region is
  the trace of some permissible meaning. My central claim is that much of what looks
  like ''semantic structure'' in vector space models is really just convexity: polysemy
  should be analyzed as disconnected convex components; metaphor as a usable but non-convex
  deformation; semantic change as the drift of a convex region whose boundary is contested
  by high-temperature uses. Example: ''run'' has several components (running a race,
  running a meeting, a run in stockings, runny nose?); the literal uses of each component
  form a tight convex cluster, while the metaphorical uses fall between components
  or at the edges. I know about distributional semantics and conceptual spaces, but
  I haven''t seen anyone claim convexity is doing all the work rather than being an
  artifact. Is this coherent? Is there a name for it already? Give me the strongest
  three objections and tell me which, if any, is fatal, and which parts of the view
  might survive as a useful constraint rather than a theory of meaning."


