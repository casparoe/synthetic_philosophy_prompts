  ---


  So I''ve been turning over an argument from special relativity that seems to prove
  way too much — namely, that the future is already out there, fully real, and that
  the difference between "already settled" and "not yet decided" is just an artifact
  of which frame you''re in. I''ll number the steps.


  (1) Special relativity doesn''t privilege any inertial frame. So a slice of spacetime
  picked out as "now" by one frame is as legitimate a slice as any other.


  (2) Relativity of simultaneity says two frames will disagree about which distant
  events are simultaneous with a given here-and-now. The Andromeda example makes this
  concrete: Andromeda is about 2.5 million light-years off, so a person walking toward
  it and a person walking away from it disagree by on the order of a couple of days
  about what''s happening there "right now."


  (3) Take an event I''d naturally call future — say, a flare on a star in Andromeda
  that, in my rest frame, won''t happen until next Tuesday. Since Andromeda is 2.5
  million light-years away and next Tuesday is only a week from now, the flare and
  my typing this sentence are spacelike seperated. That means there''s an inertial
  frame in which the flare is simultaneous with my typing right now.


  (4) If I grant that no frame is privileged, then the slice of spacetime in which
  the flare is simultaneous with my typing is just as real as my slice. So the flare
  is, in that frame, happening now. And since it''s happening now in a perfectly legitimate
  frame, the only non-arbitrary thing to say seems to be that it''s real now — that
