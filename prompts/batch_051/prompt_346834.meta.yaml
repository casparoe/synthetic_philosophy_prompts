  two events A (here-now) and B (some event in the absolute future of A, i.e., timelike).
  There exists an event C such that C is spacelike separated from both A and B. Choose
  a frame where A and C are simultaneous, and another frame where B and C are simultaneous.
  Since A is real (it''s happening now), and A is simultaneous to C in one frame,
  C is real; since C is simultaneous to B in another frame, B is real. Thus B is real
  now. So the argument relies on the claim that being simultaneous with a real event
  in any frame makes the other event real (call it the "co-reality of frame-relative
  simultaneity" premise). Then any future event is already real. The flaw/debatable
  premise is that premise. I can present this cleanly.


