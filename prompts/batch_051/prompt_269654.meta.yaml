  Nozick''s entitlement theory: justice in holdings is historical, not patterned.
  Three principles: justice in acquisition (how unheld things come to be held), justice
  in transfer (voluntary exchange, gifts), and rectification of past injustices. If
  the world is just from acquisition and transfer, the resulting distribution is just,
  regardless of pattern. Wilt Chamberlain argument: suppose you start with any distribution
  D1 you consider just (e.g., according to your favorite patterned principle, like
  equality or Rawls''s difference principle). Then Wilt Chamberlain is a great basketball
  player; people freely pay an extra 25 cents per ticket to see him play; over a season
  a million people attend; he ends up with $250,000 more than anyone else. The new
  distribution D2 differs from D1 only in that Wilt has more, and each transaction
  was voluntary. Nozick asks: if D1 was just, and people voluntarily moved from D1
  to D2 via legitimate transfers, how can D2 be unjust? To maintain the pattern you''d
  have to forbid people from doing things they want with their own resources, or continuously
  interfere (redistribute) to restore the pattern; liberty upsets patterns. So patterned
  principles require ongoing interference with liberty.


