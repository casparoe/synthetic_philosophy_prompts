  Draft:


  "I am teaching an upper-division course on the metaphysics and ethics of virtual
  worlds, and next week we are screening the Black Mirror episode ''San Junipero''
  as an entry point into the question of whether virtual objects, relationships, and
  harms are ever properly real. The episode, as you know, follows two women who meet
  in a simulation of a 1980s California beach town that turns out to be a system in
  which the elderly can visit while alive and upload their minds to reside permanently
  after death; it closes on a shot of the server room where the uploaded minds are
  housed, visually reducing the bright coastal town to rows of blinking hardware.
  I want a philosophical reading of the episode on this question: does the episode
  treat the virtual town and what happens inside it as fully real goods, or does its
  closing shot quietly undercut that? More specifically, what metaphysical view of
  virtual objects does the episode''s own storytelling commit to — a kind of practice-based
  realism, on which the diner, the arcade, and the marriage are real because they
  enter into the characters'' perceptions, emotions, and choices; or a reductive view,
  on which the only things that ultimately exist are data, hardware, and mental states,
  and the apparent objects are merely useful fictions? Where does the episode most
  strongly support each reading, and where does it resist a clean reading? I would
  also like the reading to take the ethics seriously: if a virtual harm occurred in
  San Junipero — say, someone were deceived, manipulated, or made to suffer inside
  the simulation — would the episode''s metaphysics make that harm real, and in what
  sense? End by saying what you think the episode adds to the philosophical debate
  that argument alone does not, and where an honest critic should concede that the
  episode stacks the deck."


