  came up tails, paying loses \$100 for no benefit, but not paying entails that in
  the counterfactual heads you would have missed \$10,000. Expected utility with causal
  decision theory says don''t pay; with a decision theory that treats your decision
  in all branches (like evidential/functional/timeless decision theory), pay.


