  Counterfactual mugging (from Eliezer Yudkowsky / LessWrong): Omega says "I tossed
  a fair coin. If it came up heads, I would have given you \$10,000 if and only if
  you would have given me \$100 had it come up tails. It came up tails. Give me \$100."
