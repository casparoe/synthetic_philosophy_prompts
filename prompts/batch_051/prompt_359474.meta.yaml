  ---


  I''m a masters student in a computational social science program, and I keep having
  the same argument with my labmate after our causal discovery reading group. My rule
  of thumb is this: whenever several Bayesian network structures fit the same conditional-independence
  data, I pick a minimal one — fewest edges, and among those, the one that rests on
  the weakest extra assumptions. My reasoning is that minimal graphs track causation.
  If the world is faithful to some causal graph (meaning the only conditional independences
  that show up in the data are the ones implied by the actual causal structure) and
  I have enough data, then the true graph belongs to the Markov equivalence class
  determined by the data. Adding an extra edge would create paths that, if they were
  real, should generally produce dependencies I don''t observe. So minimality seems
  to be earning its keep, not just tidiness.


  My labmate says I''m dressing up Occam''s razor as a theorem. She thinks preferring
  minimal graphs is an aesthetic bias, not a reliable route to causation — especially
  with finite samples, hidden common causes, and near-violations of faithfulness,
  where the minimal graph in the chosen equivalence class can be flat-out wrong about
  edge directions. I cant tell whether I''ve found a principled shortcut or just a
  prettier way to go wrong. Treat me as someone who actually uses this rule, not as
  a hypothetical. You are a philosopher of science who works on causal discovery and
  the foundations of Bayesian networks. Before you give a verdict, steelman my labmate''s
  position, then lay out the case for my rule as charitably as you can. Is this epistemic
  habit defensible, and if so, under what conditions exactly? Where does the analogy
  with Occam''s razor genuinely hold and where does it break? And can the rule be
  revised so it keeps the good parts without the bad ones — for instance, always treat
  each omitted edge as a prediction to test, or add a penalty that grows with sample
  size, or prefer minimal graphs only when your faith in faithfulness is supported
  and not just assumed? I want to leave with a version of the policy I can defend,
  or a clear reason to drop it.


