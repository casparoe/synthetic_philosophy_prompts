  Mill''s "On Liberty": the harm principle. A person''s liberty can only be restricted
  to prevent harm to others. "The only purpose for which power can be rightfully exercised
  over any member of a civilized community, against his will, is to prevent harm to
  others." He distinguishes self-regarding vs other-regarding acts. Offense to others
  is not harm. But he does allow restrictions on incitement: "An opinion that corn-dealers
  are starvers of the poor... ought to be unmolested when simply circulated through
  the press, but may justly incur punishment when delivered orally to an excited mob
  assembled before the house of a corn-dealer." So speech that directly incites violence
  can be restricted. Also there are nuances: Mill doesn''t protect some speech in
  certain circumstances? He also says there are "many acts which injure the interests
  of others" but not all count. He allows restriction on "instigation to some mischievous
  act." So the common conflation: Mill''s harm principle doesn''t mean all speech
  is always protected; direct incitement causing harm is regulable.


