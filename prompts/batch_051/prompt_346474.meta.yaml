  The no-trade theorem: in a pure exchange economy with common priors, if agents are
  rational and it is common knowledge that a trade is acceptable to all, then there
  are no gains from trade; so no trade occurs that is based purely on asymmetric information.
  Equivalently, if I agree to sell you a stock and you agree to buy, and we have common
  priors, the fact that we disagree about its value can''t be due only to different
  information, because then each would wonder "what does the other know that I don''t"
  and would update (Aumann''s agreement theorem: common priors + common knowledge
  of posteriors -> no disagreement). Trade itself conveys information: if someone
  offers to sell, that''s a negative signal. So rational agents with common priors
  cannot "agree to disagree" and thus won''t speculate.


