  ---


  I am a PhD student in philosophy of science, and I am convening a departmental workshop
  on causal modeling. The working group has divided roughly into two camps over a
  single question about James Woodward''s interventionist account of causation: whether
  its central notion of an "intervention" can be characterized without already presupposing
  causal content, or whether the account is circular in a way that matters. Both sides
  accept the broad target thesis that causal relationships are, at least in part,
  relationships that are invariant under some appropriate range of interventions or
  manipulations. The invariance camp argues that an intervention on X with respect
  to Y can be specified in non-causal terms: a surgical setting of X''s value from
  outside the system of interest, one that leaves every other variable that influences
  Y untouched and that does not affect Y through any route other than X. The circularity
  camp argues that every term in that specification — "surgical," "influences," "route
  other than X," "outside the system" — is itself causal, and that the account therefore
  cannot license a causal conclusion from invariance patterns without prior causal
  knowledge; in underdetermined cases, it will simply select whichever model was built
  into the description of what counts as an intervention.


  Please draft the summary document of an adversarial collaboration between these
  two camps. The document should contain: (1) a numbered list of substantive claims
  about manipulation, invariance, and causal inference that both camps can sign, stated
  precisely enough that neither camp would disown them; (2) a disagreements table
  in which each live dispute is given as a pair of statements, each side''s statement
  framed so that side would accept it as a fair rendering of its view, with a note
  on whether the remaining dispute is substantive or partly verbal; and (3) a list
  of cruxes — the sub-questions such that settling one would move at least one camp
  — together with, where possible, the test, simulation, or argument both camps would
  accept as bearing on that crux, and each camp''s prediction about the result recorded
  in advance. Be especially careful to isolate any part of the dispute that comes
  down to different uses of "intervention," "cause," or "explanation," rather than
  treating every disagreement as verbal or every disagreement as substantive.


  ---


