  Smith''s Theory of Moral Sentiments:


  - Sympathy is the mechanism by which we enter into others'' situations and form
  an idea of their sentiments; it''s based on imagining ourselves in their situation
  ("by the imagination we place ourselves in his situation").

  - The impartial spectator: the standard is not the actual sentiments of the actual
  spectators, but the sentiments an impartial and well-informed spectator would feel.
  We judge our own conduct by imagining how such a spectator would view it; this internalized
  spectator is the "man within the breast."

  - Propriety/suitability: whether the agent''s sentiments are proportionate to their
  cause; the spectator approves when, upon entering the agent''s situation, the spectator''s
  own passion matches the agent''s.

  - Merit and demerit: involves direct sympathy with the person affected (gratitude/resenement);
  merit is when an action appears to deserve gratitude — compound sentiment: direct
  sympathy with agent''s motives + indirect sympathy with the gratitude of the person
  benefited. So my simplified distinction "between judging an act''s propriety and
