  large gain at what the deontologist regards as a small cost. Each party gets more
  of what it values, measured by its own standards; no one has to concede that the
  other is right about the moral facts. The theory is elegant because it promises
  pareto improvements across moral systems without needing a common moral currency,
  and it seems to give a systematic answer to a question that otherwise looks hopeless:
  when we cannot agree, how should we act?"


