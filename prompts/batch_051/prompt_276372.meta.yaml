  "Last night a friend and I argued at length about whether a crow that bends a wire
  to fish food out of a tube is reasoning about means and ends or just combining learned
  behaviours, and he repeatedly invoked a principle he attributed to the psychologist
  C. Lloyd Morgan. I looked the passage up afterwards, and I find it harder to interpret
  than he seemed to think. Here is the passage, as Morgan''s canon is usually stated:


  ''In no case is an animal activity to be interpreted in terms of higher psychological
  processes if it can be fairly interpreted in terms of processes which stand lower
  in the scale of psychological evolution and development.''


  What I would like help with is a careful reading of this sentence, because my friend
  was treating it as a proof that the ''lower'' explanation must be accepted. Specifically,
  I am confused about three things. First, what are ''higher'' and ''lower'' psychological
  processes here, and is the ''scale'' a claim about the order in which faculties
  evolved, about degrees of consciousness, about complexity, or about something else
  — and does the canon itself justify that ranking or take it for granted? Second,
  the word ''fairly'' seems to me to be doing enormous work: does ''if it can be fairly
  interpreted'' mean ''if any lower reading can be made to fit at all,'' or does it
  set a threshold of adequacy, and who bears the burden of showing a lower interpretation
  is fair? Third, I cannot tell whether this is meant as a methodological rule of
  caution for the scientist or a metaphysical claim about what is really going on
  in the animal; my friend moved between the two readings depending on the direction
  of the argument. Can you explain what the canon does and does not commit someone
  to, when it is read strictly, and how a defender of a ''higher'' interpretation
  ought to reply under its own terms?"


