  ---


  A friend and I recently spent an evening arguing about Karl Popper''s treatment
  of Darwinian natural selection, and neither of us could settle the question of whether
  Popper genuinely reversed himself or instead corrected a misunderstanding of his
  earlier view. In his lecture Darwinism as a Metaphysical Research Programme, Popper
  maintained that natural selection—for all its importance—was not a testable scientific
  theory. On that earlier view, the theory functioned as what he called a metaphysical
  research programme: a framework that generated and held together testable scientific
  hypotheses, but was not itself falsifiable and therefore did not have the status
  of an empirical theory. Two or three years later, in his Darwin Lecture Natural
  Selection and the Emergence of Mind, Popper announced that he had changed his mind
  about the testability and the logical status of the theory of natural selection,
  and presented this as a recantation.


  My friend''s position is that the later text is precisely what it looks like: a
  clean change of doctrine, and nothing is gained by trying to make the two cohere.
  My own sense is that the relation is messier, because Popper seems to have kept
  much of the earlier framework while changing his verdict about where the theory
  itself falls inside it. But I could not make that intuition precise.


  Lay out what Popper would have actually needed to withdraw in the 1977 lecture in
  order to be consistent with his own falsifiability-based picture of science, and
  what—if anything—he could retain from the earlier lecture without contradiction.
  Are the two passages best read as a contradiction, a genuine change of mind, a correction
