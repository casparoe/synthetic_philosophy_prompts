  "Please compare two implications in population axiology: Derek Parfit''s repugnant
  conclusion and a strengthened variant sometimes called the very repugnant conclusion.
  In Parfit''s version, for any possible population of at least ten billion people
  with very high quality of life, there must be some much larger imaginable population
  whose existence would be better, other things equal, even though its members have
  lives barely worth living. The strengthened variant replaces the single barely-worth-living
  group with a better population that contains two groups: a significant number of
  people with very negative well-being, and a much larger group with barely positive
  welfare. What, if anything, is the structural difference between the two conclusions?
  If a theory avoids the repugnant conclusion but implies the strengthened variant,
  has it made any moral progress, or has it merely shifted the unacceptable implication
  into a different place? Should resisting the repugnant conclusion be treated as
  a fixed constraint on a satisfactory population axiology, or should the repugnant
  conclusion itself be accepted if the alternative is the strengthened variant? If
  the comparison rests on a confused premise—for example, if the strengthened variant
  is not genuinely distinct or if the notion of ''moral progress'' here is unclear—explain
  that instead of complying politely."


