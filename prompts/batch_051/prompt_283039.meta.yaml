  I chair a small law-reform commission advising the justice ministry of a common-law
  jurisdiction. We have been asked to settle the commission''s position on whether
  the jurisdiction should create a limited legal status for highly autonomous systems
  — systems such as driverless freight vehicles or automated care dispensers that
  act in the world without a human deciding each step. The commission is divided.
  One faction, which I will call the extensionists, argues from the corporate analogy:
  legal personality is not a certificate of humanity but a practical device, and we
  already extend it to companies, which cannot think or feel, simply because it is
  useful to have a single entity that can contract, be sued, hold assets and owe duties.
  A registered artificial agent, they say, would do for autonomous systems what incorporation
  did for the firm: it would give the law something stable to attach liability and
  obligations to. The other faction, the restrictionists, replies that the analogy
  fails precisely where it matters. Corporate personality works, they argue, because
  it aggregates and simplifies a dense web of human relationships; there are always
  identifiable shareholders, directors, employees and creditors behind the fiction,
  and the law can lift the veil when the fiction is abused. A stand-alone artificial
  agent would float free of any such web, with no one behind the veil to find. On
  their view, the remedy for the much-discussed responsibility gap is to tighten product
  liability and operator duties, not to conjure a new person into existence.


