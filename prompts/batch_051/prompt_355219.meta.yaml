  ---


  I am a junior at a private Christian school and I sit on the student committee that
  applies our Student Life Covenant to requests from students who want to hold positions
  of "spiritual leadership" — leading chapel, joining the worship band, or running
  a ministry like the weekend food pantry. The relevant clause reads: "Any student
  seeking such a position must present credible evidence of a living faith in Jesus
  Christ. Faith alone, and never a record of good works, is what puts a person right
  with God; yet the faith that so justifies is never idle in the one who has it, and
  it will show itself in a settled pattern of love and service. No merely verbal profession
  of faith is sufficient if the student''s settled conduct runs against it." In our
  Bible class we have been reading Romans and James side by side, and several of us
  think this clause is trying to hold both of them together at once, which is part
  of why the present case has divided us.


  The case is this. A transfer student, Elena, has for two years run our weekend food
  pantry with a kind of energy we have rarely seen, visits a nursing home every Saturday
  to sing with residents, and tutors our junior-high Bible study without ever treating
  it as a chore. When the committee interviewed her, though, she said that she could
  not in good conscience say she believes the central Christian claims; she described
  herself as "living as if" they are true, hoping they are, and finding real joy in
  the practices, but she refused to claim any more than that. Some of us say the clause
  is satisfied or at least not clearly violated: the covenant itself demotes words
  by saying profession is insufficient when conduct contradicts it, so it seems inconsistent
  to let a missing profession defeat conduct when conduct is the very test the clause
  installs. Others say that is an inference the clause never licenses — conduct can
  be evidence of faith only if there is a faith there to be evidenced, and here the
  only direct testimony about Elena''s inner state is her own, which denies it; the
  drafters wrote the clause to catch people who talked piously and lived badly, not
  someone who lives well and talks honestly.


  I need to give the committee a short interpretive opinion. Please argue from the
  words of the clause, from its purpose, from what you think the people who wrote
  it would have said had they been asked about Elena''s case, and from what a reasonable
  student reading the covenant would take it to mean. Then tell me which of those
  approaches should decide the case and why, in continuous prose without headings,
  bullet points, bold text, or tables, the way you would write a letter to the committee.


