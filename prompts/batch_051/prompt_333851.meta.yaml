  ---


  I work as a software engineer on a small team at a foundation that funds animal
  welfare programs, building the internal tools the program staff use to rank candidate
  interventions. None of us have formal philosophy training. The current tool scores
  each candidate on four dimensions — the peak intensity of the suffering involved,
  how long the suffering lasts, how many individuals are affected, and how confident
  we are that the intervention will actually reduce the harm — and then combines the
  dimensions in a weighted sum. A recent review turned into an argument I''ve been
  asked to settle. One analyst insists that two of the dimensions should not simply
  be added, because value behaves more like a product: he keeps paraphrasing the idea
  that the value of a conscious life is consciousness times happiness, so if either
  factor is zero the whole is zero, and a weighted sum lets one dimension compensate
  for another too easily. Another analyst insists that at least one dimension is lexical:
  no amount of mild benefit, no matter how broadly distributed, may be allowed to
  outweigh a certain severity of harm, so the formula needs a hard veto rather than
  a weight. I don''t have the background to judge what would make additive, multiplicative,
  or lexical aggregation correct rather than merely convenient.


  Please write a reusable decision procedure our team can run whenever we have to
  decide how to combine value dimensions in one of these scoring tools. It should
  specify the questions to ask in order, what counts as a sufficient answer to each,
  simple tests for deciding whether a pair of dimensions should enter additively,
  multiplicatively, or as a lexical threshold, and where the procedure should stop
  and hand the question to a person because it is a value judgment rather than a modeling
  fact. It must be runnable by a competent software engineer in a single design meeting,
  and it must mark every step that needs sign-off from program staff rather than modelers.
  Then run the procedure on two worked cases: (1) deciding whether the badness of
  a pain episode should be computed as intensity plus duration or intensity times
  duration, and (2) deciding whether to add a hard veto so that interventions preventing
  certain very severe harms always outrank interventions producing a large number
  of mild benefits. Please ensure that at least one worked case reaches an answer
  the team will find uncomfortable, and please say explicitly which parts of the procedure
  cannot be reduced to a formula. End with a final line that is a one-sentence summary
  of the procedure.


  ---


