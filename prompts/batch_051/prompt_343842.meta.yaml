  Standard view: rational choice ignores sunk costs because only future costs/benefits
  matter. But there are exceptions/defenses:

  1. Honoring sunk costs as a commitment device: if you know you''ll feel bad about
  abandoning a project, precommitting to ignore those feelings might unravel; honoring
  sunk costs can make ex ante commitments credible (e.g., not abandoning after investments
  preserves a reputation for persistence, deterring future... actually).

  2. Sunk costs as evidence about future returns: past investment may be correlated
  with the project''s value, or with your own expected enjoyment; if you invested,
  it might reveal information about your preferences or forecasts. But careful: this
  is evidence, not causation.

  3. Sunk costs as a tool for managing future self: avoiding the habit of quitting;
  building identity as "someone who finishes."

  4. Regret/emotional sunk costs: the pain of waste may itself be a future consequence
  to consider; if you''ll suffer more from abandoning than continuing, that''s a forward-looking
  cost, not a sunk cost per se.

  5. Social/reputational considerations: others judge you for wasting resources; that''s
  also forward-looking.

  6. Normative vs instrumental: is honoring sunk costs rational in an epistemic sense?
  With bounded rationality, sunk cost heuristic may be a second-best rule.

  7. The concept of "sunk" is trickier than it looks: opportunity costs, whether costs
  can be partially recovered, whether continuing costs are truly avoidable; "sunk"
  relative to what decision node.


