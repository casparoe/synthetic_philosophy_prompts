  "In his 1912 essay On the Notion of Cause, Bertrand Russell argued that the concept
  of causation is not required for the most advanced sciences. His argument, in outline,
  was that physicists had already replaced causal laws with differential equations
  describing functional relations among variables; that the word cause carries anthropomorphic
  and prescientific associations of pushing, producing, or compelling; and that philosophy
  would do better to eliminate the notion entirely rather than try to clean it up.
  He famously compared the law of causality to a relic of an earlier age that survives
  only because people suppose it does no harm.


  Since the early 1990s, however, a substantial technical literature has developed
  around formal causal models: structural equation models, the do-calculus, and interventionist
  accounts of causation. These frameworks treat causal claims as precise enough to
  be encoded, manipulated, and tested. They are now used in epidemiology, econometrics,
  and machine learning. This looks like a genuine change in the situation Russell
  was describing: causal talk is no longer merely the loose idiom of pre-scientific
  common sense.


  Does Russell''s eliminativist argument survive this development? I want you to say,
  precisely, which premise in Russell''s argument is most under pressure, and whether
  the argument can be repaired in a weaker form. In particular: (1) Does the new formal
  work actually recover the notion of cause that Russell wanted to eliminate, or does
  it define a different notion and merely borrow the word? (2) Would Russell''s point
  about mature physics still hold for fundamental physics, even if special sciences
  find causal models indispensable? (3) Is there a version of his eliminativism that
  remains plausible today, perhaps restricted to fundamental physics or to a certain
  kind of metaphysical causation? Do not give a survey of the literature; give a verdict
  on the argument and mark the spot where it is weakest."


