  The design I want analyzed is a "Styx rule" for expert witnesses in civil litigation:


  1. Before submitting an expert report, an expert must sign a sworn statement that
  the report contains no assertion the expert knows to be false and no omission the
  expert knows would materially mislead the court, and must pay a bond escrow (say,
  a fixed multiple of the expert''s daily fee or a flat sum).

  2. If, after a hearing, the court finds by clear and convincing evidence that the
  expert violated the declaration, the forfeiture and exclusion are automatic: the
  bond is forfeited to a court access fund; the expert is barred from accepting any
  expert engagement for one year; and for nine further years the expert is barred
