  Hume on money and trade. The classic subtle confusion: people take Hume''s price-specie-flow
  mechanism to imply that money is neutral and trade balances are self-equilibrating,
  therefore mercantilism is pointless and money supply never matters. But Hume actually:
  in "Of Money" he argues that the quantity of money is irrelevant in the long run
  (money is not wealth) but in the short run, an increase in money stimulates industry
  (the "good policy of the magistrate to keep money increasing" maybe); in "Of the
  Balance of Trade" he argues that trade surpluses cannot accumulate indefinitely
  because price changes; but he doesn''t say trade is pointless or that countries
  shouldn''t care about their balance; he acknowledges transition effects and the
  danger of sudden loss. A mistaken question: "Hume showed the balance of trade is
  self-correcting and that money is just a neutral veil, so why do economists and
  governments still track trade deficits and worry about money supply?" That''s a
  false presupposition but actually modern economists do think money is neutral in
  long run and trade balances aren''t a scoreboard; the confusion is attributing to
  Hume the strong claim that policies don''t matter at all. A good answer would correct:
  Hume''s mechanism is a long-run tendency under a gold standard; short-run non-neutrality
  is central to his account; he cared about gradual vs sudden changes; and modern
  concern about money supply is about short-run stabilization, not mercantilist hoarding.
