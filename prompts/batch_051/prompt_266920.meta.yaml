  Draft:


  ---


  I have been trying to sort out my views about anachronism in the history of mathematics
  and science — about when it is legitimate to describe past work using concepts the
  historical figures did not have, and when that distorts them. I''ve collected my
  verdicts on a set of cases, and I want to know whether there is one principle behind
  them, or whether some of my verdicts have to go. Please commit to a definite account
  rather than laying out the options.


  Here are the cases as I find myself judging them.


  (1) Eudoxus on proportion. When a mathematician says that Book V of Euclid''s Elements,
  in its theory of ratios of magnitudes, essentially constructs something very like
  the real numbers, or anticipates the nineteenth-century treatment of irrationals,
  I think that is basically fair. It identifies the same dividing structure between
  the commensurable and incommensurable cases, and I would not want that observation
  banned from the history of mathematics. I would object only if the writer then called
  Eudoxus a nineteenth-century analyst.


  (2) Aristarchus and heliocentrism. When a textbook says Aristarchus of Samos anticipated
  Copernicus because he put the Sun at the center, I think that is wrong. A bare heliocentric
  proposal without a worked-out planetary theory, a dynamics, or a sustained research
  tradition is not the thing Copernicus did, and calling it an anticipation trades
  on a similarity that matters less than the differences.


  (3) Newton''s fluxions. When a modern presentation glosses Newton''s fluxions as
  just limits, or rewrites his proofs in epsilon-delta form and calls the result Newton''s
  proof, I find that misleading. It imports a later standard of rigor, and a later
  ontology of static quantities, into a theory about quantities generated continuously
  in time. But I have no problem with using modern calculus silently to check that
  Newton''s results are correct; that strikes me as good scholarly hygiene, not anachronism.


  (4) Archimedes'' Method. When historians say that Archimedes, in the Method, balances
  a plane figure against known figures by treating it as though it were made of weighted
  lines and summing them, and that he is thereby using something recognizably like
  integration, I am inclined to accept it. It is not Cauchy''s or Riemann''s integral,
  but it solves the two standard problems we now call integration, by a procedure
  that looks to me like a genuine ancestor rather than a chance resemblance.


  I am aware that (3) and (4) look inconsistent: I resist saying Newton''s fluxions
  are limits, but I do not resist saying Archimedes'' quadratures are integration.
  I cannot currently say why the two should come apart, and that is one of the things
  I want the principle to do — or to tell me that one of these verdicts must be revised.


  (5) Priestley and phlogiston. When a chemistry text says Priestley discovered oxygen
  but did not know it, I think that is false: one cannot discover a substance under
  a description one explicitly rejects. But I find the statement that phlogiston theory
  was, in effect, tracking the opposite of oxidation acceptable, and even explanatory
  — it captures why the theory was not simply a mistake. These two sub-verdicts feel
  hard to reconcile, since both speak about the same episode in later chemical vocabulary.


  (6) Medieval impetus and inertia. When a writer says the medieval impetus theory,
  which said a projectile carries an impressed force that keeps it moving, anticipated
  the principle of inertia, I think that is wrong. But I also think it is correct,
  and not anachronistic in a damaging way, to say the theory''s difficulties — especially
  what happens as the impetus is used up — helped make inertia thinkable. So retrospective
  description of a theory''s problem situation is fine for me, while retrospective
  attribution of a later concept is not.


  What I want from you: a precise principle, or a small set of candidate principles,
  that captures as many of these verdicts as possible. For each clause of the principle,
  say which case or cases motivate it. Then apply the principle to two or three cases
  I have not listed (for example, whether saying the Greeks lacked the concept of
  zero is anachronistic, or whether Darwin''s pangenesis anticipated genes), and state
  clearly what it predicts. Finally, and this is the part I most need, say which of
  my verdicts cannot be kept under the principle you endorse, and defend overturning
  exactly those rather than saving everything with a complicated patchwork. I would
  rather have a simpler principle that forces me to revise one or two verdicts.


  Please take a definite position: pick one principle and argue for it, rather than
  leaving me with a menu. End your answer with a final line beginning exactly "Verdict:"
  and then a single sentence stating the principle you recommend, as precisely as
  one sentence allows.


