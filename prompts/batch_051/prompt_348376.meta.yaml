  Argument idea: show that the multiplicative view ("value = consciousness × happiness")
  collapses into either additive or lexical depending on how "consciousness" is read,
  via equivocation.


  (1) Call the value of an experience V_i. The multiplicative view says V_i = c_i
  × h_i, where c_i is how conscious the subject is of the experience and h_i is how
  happy it makes them.

  (2) For an experience to be "barely conscious" is just for it to be present at very
  low intensity; but an intensity near zero and a valence near zero are two different
  ways for an experience to contribute near-zero value.

  (3) If c_i just is the intensity of the experience, then "happiness" h_i must be
