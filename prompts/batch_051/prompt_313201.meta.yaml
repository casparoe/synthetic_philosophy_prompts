  I need to be precise about Arrow''s theorem and its assumptions. Arrow''s conditions
  (for a social welfare function from ordinal individual preferences to a social ordering):

  - Unrestricted Domain (U): all possible profiles of individual preferences allowed.

  - Pareto / weak Pareto (P): if everyone prefers x to y, society prefers x to y.

  - Independence of Irrelevant Alternatives (IIA): social preference between x and
  y depends only on individual preferences between x and y.

  - Non-dictatorship (D): no individual whose strict preferences always prevail regardless
  of others.

  - Transitivity (social preference complete and transitive). Also individual preferences
  complete transitive.

  Arrow''s theorem: no SWF satisfies U, P, IIA, D with transitive social ordering
  (for at least 3 alternatives).


