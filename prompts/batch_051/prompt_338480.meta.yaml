  Lottery paradox (Kyburg 1961): Suppose a fair lottery with 1,000,000 tickets, exactly
  one winner. For each ticket i, the probability that ticket i loses is 0.999999,
  which is high enough to justify belief (if we accept a threshold/acceptance rule:
  it is rational to believe p if p is probable enough). So for each i, you rationally
  believe "ticket i will lose." But you also rationally believe "some ticket will
  win" (since exactly one wins). By conjunctive closure (if you rationally believe
  p and q, you rationally believe p∧q), you''d rationally believe "ticket 1 loses
  and ticket 2 loses and ... and ticket 1,000,000 loses," i.e., all tickets lose —
  which contradicts "some ticket wins." So the set of rational beliefs is inconsistent.
  So at least one of: (1) high probability is not sufficient for rational belief (deny
  the acceptance/threshold rule), (2) rational belief is not closed under conjunction
  (deny closure), (3) something else.


  Preface paradox (Makinson 1965): An author rationally believes each sentence in
  her book (after careful checking), but writes in the preface "I''m sure there are
  errors somewhere; no doubt some claims in this book are false." She seems rational
  to believe each individual claim and also rational to believe the conjunction of
  their negations? Actually she believes each sentence p1...pn, and believes there
  is at least one error, i.e. ¬(p1∧...∧pn). This set is inconsistent too, but seems
  manifestly rational — not a paradox that demands rejecting a principle, but shows
  that inconsistency in one''s total beliefs may be rational? Different diagnoses.


