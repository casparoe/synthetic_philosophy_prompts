  + closure; preface: fallibility about a conjunction of individually justified beliefs.
  The preface paradox is often used to show that consistency may not be a requirement
  of rationality, or to motivate probabilistic/degrees-of-belief approaches, or to
  illustrate that rational belief doesn''t require the probability of the conjunction
  to be high, etc.


  Relation: In the lottery, the belief in "some ticket wins" combined with each "ticket
  i loses" belief forms an inconsistent set; intuitively the "culprit" is closure
  or acceptance rule. In the preface, the inconsistency seems entirely rational; so
  one might think rejecting consistency as a norm is the right response. This contrast
  can be taught beautifully: both generate inconsistent belief sets, yet our intuitions
  about where to place blame differ; the difference illuminates what rationality requires
  (consistency? closure? probabilistic coherence?).


