  Prompt draft:


  "In my philosophy club we read a short excerpt from John Rawls''s A Theory of Justice
  in which he distinguishes envy from resentment. The way our teacher summarized it,
  Rawls thinks resentment is a moral feeling: when I resent someone, I am upset because
  they have benefited from a wrong or an injustice, and I want the wrong repaired.
  Envy, by contrast, is not a moral feeling: it is the desire to bring someone down
  simply because they have something I lack, even if their having it is perfectly
  legitimate. I have been trying to test that distinction against my own gut reactions,
  and I find I can''t get them to fit a single principle.


  Here are the cases as I honestly react to them. (1) A classmate won the science
  fair with a project I know he mostly copied from his older brother; I was angry,
  and I still think my anger was justified. (2) A different classmate won the same
  fair two years earlier with a project she built entirely herself, and I caught myself
  wishing she had lost; I think that wish was ugly and I don''t want to defend it.
  (3) A boy a year ahead of me got a summer internship at a research lab because his
  father is a board member there; I felt something that initially looked like envy,
  but I am inclined to say it was really an objection to how the opportunity was distributed,
  and that it was justified. (4) A friend inherited a house from a great-aunt and
  said she felt lucky; I felt a brief impulse to want her not to have it, and I immediately
  felt ashamed. (5) A girl in my class got the highest grade on a paper, but I know
  she paid a tutor to edit it heavily while the rest of us worked alone; my feeling
  felt different from the inherited-house case, and I''m not sure whether to call
  it envy or resentment, or whether it''s justified.


  My tentative principle is that a negative feeling about someone else''s good is
