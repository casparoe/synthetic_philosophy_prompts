  "Augustine opens Book XI of the Confessions with a puzzle: he knows what time is
  until he is asked to explain it. Reconstruct the puzzle about the being of time
  that he develops (why past, present, and future each seem not to exist). Then present
  his positive account: what does he mean by calling time a distentio animi, and what
