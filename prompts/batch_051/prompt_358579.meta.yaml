  Potential prompt:


  "In Descartes''s Second Meditation, in the course of asking what he knows more easily
  than bodies, he considers looking from his window and seeing hats and coats pass
  along the street. He remarks that he would say he sees men, but what is strictly
  available to sense are hats and coats, which might conceal automata; he judges that
  they are men through the faculty of judgment in the intellect. I keep coming back
  to this passage because it seems to lay out, with perfect clarity, the argument
  that has always attracted me: my own mind is given to me directly, but other minds
  are never presented directly; they are posited on the strength of inference from
  perceived bodies. Call this the inferentialist picture. It is elegant, economical,
  and makes no claim beyond what experience can support. Yet I also have an unwavering
  intuition that the person in front of me is not a hypothesis: when someone describes
  pain, or when a child cries, the presence of another mind feels as immediate as
  my own awareness. I don''t merely infer that there is an inner life behind the face;
