  says there is no single thing to be called the species because different operational
  criteria carve different groups. I heard the same dispute this term in foundations
  of mathematics about the real numbers and the continuum. The constructionist says
  the real numbers are defined, an artifact of our completions and cuts; the Platonist
  says the construction merely locates something already there; the set-theoretic
  pluralist says that once the continuum hypothesis is independent, there is no single
  continuum to describe, only different continua in different models.


  I want to know whether this parallel is deep or superficial. I am not asking for
  a survey of either debate; I want the exact correspondence. Which positions map
  to which, and where does the mapping start to lie? What would have to be true of
  both sides for an argument to transfer (for example, if species pluralism is right,
  what should that make me believe about the continuum, and what could stop that inference)?
  And where does the analogy break? Give me the strongest disanalogy and name at least
  one thing the parallel seems to predict that is false in one of the two domains.


