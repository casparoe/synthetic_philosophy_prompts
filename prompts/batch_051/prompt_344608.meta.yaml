  The new development: decoherence plus self-locating uncertainty.

  - Decoherence: branches rapidly become approximately non-interfering; each observer
  sees a definite quasi-classical outcome. This doesn''t by itself give the Born rule,
  but it sets up a set of branching observers.

  - Self-locating uncertainty: after measurement, before looking at the result, the
  observer knows the full wavefunction but is uncertain which branch they occupy.
  Probability can be interpreted as credence over self-location, not over which world
  becomes "the" world.

  - Rationality arguments (decision-theoretic: if you weight utility by amplitudes,
  rational agents should bet according to Born weights; symmetry arguments: envariance)
  claim the only coherent assignment of self-locating credences is the Born weights.


