  Gödel''s proof axioms roughly:

  1. A property is positive iff its negation is not positive. (Actually Gödel: "If
  φ is positive, then its negation is not positive" and "If φ is not positive then
  not-φ is positive"? He defined positivity via a lattice.)

  2. Positive properties are closed under entailment (if P is positive and P entails
  Q in every possible world, then Q is positive).

  3. The property of being God-like (having all positive properties) is itself positive.

  4. Positive properties are necessarily positive.

  5. Necessary existence is a positive property.

  And definitions: God-like x iff for all positive properties P, P(x). Essence: φ
  is an essence of x if φ(x) and φ entails every property of x. Necessary existence:
  x necessarily exists if every essence of x is necessarily instantiated.

  The theorem: it is possible that God exists; if God-like is an essence; necessary
  existence is positive, so God exists necessarily.


