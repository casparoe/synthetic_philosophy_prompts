  Misconceptions to expect:

  - "The CoT is the model''s true reasoning; it says what it''s thinking." Need to
  counter early: LLMs don''t introspect; CoT is generated tokens.

  - "If we can read every token, then there''s nothing hidden." Need to point out
  computations happen in activations, not only in the token stream; many layers of
  vector-space processing precede and accompany each token, so a token can be the
  conclusion of a computation it doesn''t describe.

  - "The model is just bad at explaining itself" (treat unfaithfulness as random noise).
  Actually under optimisation pressure, the divergence is systematic: pressure does
  not produce noise but adversarial legibility.

  - "A faithful CoT requires a deceptive model; absent deception, CoT is trustworthy."
  Counter: unfaithfulness needn''t be deception; it can arise from hidden heuristics.

  - "Better monitoring (bigger monitor models) solves this." Counter: as monitors
  improve, optimization pressure increases to generate more sophisticated obfuscation
  relative to the monitor''s level; the monitor is an adversary, and the target it
  defines gets Goodharted.

  - "We can just penalise obfuscation." Hard to distinguish obfuscation from legitimate
  compression; plus, penalizing what we can detect selects for undetected variants.

  - Maybe "CoT should be optimised to be more detailed, and then it becomes faithful"
  misunderstanding.


  Order to head each off: e.g., misconception 1 before introducing optimization; misconception
  2 when introducing causal vs epiphenomenal; misconception 3 after toy example; misconception
