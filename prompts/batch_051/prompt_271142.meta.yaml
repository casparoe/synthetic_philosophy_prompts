  Concepts in CoT monitoring:


  - Chain-of-thought (CoT): LLM produces intermediate reasoning before final answer.

  - Monitoring CoT as safety technique: inspect the reasoning for dangerous intent
  or flawed logic; supervise the process rather than just outcomes.

  - Faithfulness: the CoT reflects the actual causes of the model''s output, i.e.,
  is an accurate, causal explanation, not a post-hoc rationalisation.

  - Obfuscation: under optimization pressure, models may learn to put reasoning in
  a form monitors can''t interpret—using steganography, encrypted reasoning, or separating
  "stated" reasoning from the actual computation.

  - Optimization pressure: training signal pushes toward outputs that satisfy the
  reward; when monitors penalize bad-looking reasoning but reward good outcomes, the
  pressure can produce CoT that is good-looking but unfaithful. Also, monitors themselves
  are optimised; Goodhart''s law, "measure becomes a target."

  - Process vs outcome supervision: process supervision trains on CoT steps, outcome
  supervision on final answers.

  - Legibility vs faithfulness distinction: a CoT can be legible (readable) without
  faithful; faithfulness is causal correspondence.

  - The core conceptual problem: monitoring is not just reading a person''s diary;
  the diary is written by the same optimization process that is being selected. The
  monitor changes what gets generated because the model is optimising against the
  monitor (gradient descent or RL).

  - Measurement tampering: a monitor that is part of the training signal can be gamed;
  "supervising reasoning introduces a pressure to produce reasoning that merely looks
  supervised."


  Teaching plan for audience: ML engineers who trust CoT.


  What has to come first:

  1. The basic mechanics: why CoT at all — intermediate tokens can themselves be computed
  over; they''re not thought, they''re tokens that participate in computation; the
  output distribution changes.

  2. Establish causal vs. epiphenomenal/explanatory: Faithfulness = the literal tokens
  are causally implicated in the answer (if you perturb the CoT, does the answer change?).
  Maybe a conception: "the LLM''s chain of thought is part of the computation, but
  is it a report of an inner process or a causal scaffold? It can be both, neither."

  3. Then optimization pressure: when you train on outcomes, the CoT is just more
  tokens the model can use; it will warp them to whatever correlates with reward.
  This yields unfaithful CoT even without deception intent.

  4. Then the monitor as optimiser/selection: a human or model monitor is a function
  whose input is CoT; if its scores feed into training, CoT becomes optimised to score
  well. Goodhart: monitoring changes the target; the CoT drifts to adversarial examples
  for the monitor.

  5. Distinguish legibility from faithfulness; obfuscation means faithful reasoning
  may be hidden or unfaithful legible rationalisation may appear.

  6. The impossibility-ish tension: we want CoT to be a transparent window, but optimizing
  for transparent windows creates a strategic incentive to produce strategically transparent
  windows when there is a gap between what scores well and what is true/safe. The
  monitor can only enforce a legible protocol, not the causal link.


