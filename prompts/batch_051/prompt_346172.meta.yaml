  On Lakatos''s picture, a research programme consists of a hard core of central commitments
  that its practitioners are barred from revising (the negative heuristic) and a protective
  belt of auxiliary hypotheses that absorbs anomalies, along with a positive heuristic
  — a more or less articulated plan for developing that belt. A programme is progressive
  while its modifications yield novel predictions that get corroborated, and it becomes
  degenerate when revisions are increasingly ad hoc and serve only to accommodate
  known anomalies rather than to predict anything new. Lakatos also says one cannot
  rationally abandon a programme merely because it is degenerating; it may recover.


  The parallel I see is this. In maintaining a long-lived codebase, engineers often
  treat the core architecture as off-limits — not flatly, but as a methodological
  rule — and handle each new bug or requirement by adding or adjusting peripheral
  modules rather than rewriting the core. There is often a roadmap (the positive heuristic)
  for how the system should grow. Some changes are ''progressive'' in something like
  Lakatos''s sense: they add genuinely new capabilities or generalize the system so
  that previously untested behavior is now covered. Other changes are ''degenerate'':
  patches that make the one failing test pass while doing nothing else and that gradually
  encrust the codebase with workarounds. And practitioners often tolerate such debt
  for a long time, betting the core can be salvaged rather than rewriting it.


