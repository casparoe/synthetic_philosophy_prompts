  Key distinctions:

  - A signal is honest because of differential cost (handicap) when the net cost of
  displaying at a given intensity is lower for higher-quality individuals — so low-quality
  individuals won''t find it worth displaying at high intensity. The costliness does
  the sorting. E.g., Zahavi''s original "handicap": a peacock''s tail is a burden,
  but the burden is easier to bear for a high-quality bird, so only high-quality birds
  can afford the best tails (condition-dependent ornament).

  - An index is a signal whose intensity is causally or physically tied to the quality
  it advertises, so it can''t be faked regardless of cost considerations. E.g., a
  deep roar correlated with body size because of vocal tract length; a fast sprint
  during courtship that only fit males can perform. Here the signal is unfakeable,
  not because it''s costly to produce but because production is constrained by the
  trait.

  - The energetic cost alone doesn''t make a signal honest: if all males pay the same
  cost per unit signal regardless of quality, then the cost buys nothing about quality
  — it''s a "pure cost" that could be paid by anyone. The cost must be differential
  (viability cost), or the signal''s intensity must be constrained (index), or the
  receiver can impose differential costs (receiver retaliation).


