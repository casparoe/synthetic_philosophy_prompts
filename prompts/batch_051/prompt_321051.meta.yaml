  (1) I''m a compatibilist: being morally responsible is compatible with determinism,
  and requiring libertarian freedom or ultimate self-creation sets the bar too high.

  (2) I''m persuaded by Strawson''s picture: resentment, gratitude, guilt and so on
  are not positions we take up after weighing evidence; they are the participant stance,
  the framework within which ordinary interpersonal life goes on, and the practice
  of holding people responsible is not something that needs an external ''rational''
  justification if we step outside it.

  (3) Because of (2), I think a demand for a general justification of praise and blame
  misses the point—the practices are part of what gives our talk of responsibility
  its content in the first place.

  (4) But I also think that the point of blame, when we do blame, is largely communicative
  and forward-looking: it calls on the person to recognize the wrong and to repair
  or revise; otherwise it''s just useless retaliation.

  (5) I think excuses track quality of will: we excuse an action when it doesn''t
  reflect the agent''s settled evaluative stance—as with genuine ignorance, accident,
  or coercion—not when the agent merely failed to control a passing impulse.

  (6) At the same time, I think the objective stance—treating someone as an object
  of management, prediction, or treatment rather than as a participant—is sometimes
  the right stance to adopt, and for children or people with certain severe psychopathologies
  it is appropriate as a standing stance, not just a temporary retreat.

  (7) I also think that taking the objective stance toward someone is compatible with
  still treating them considerately, and that we aren''t thereby ''blaming'' them.


