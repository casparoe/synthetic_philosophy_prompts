  I''ve kept, over many years, a file of how a colleague of mine rules on what I''d
  have called golden-rule cases, and I''ve never been able to make her principle explicit.
  The consistent feature is that she seems to defer to the *other* person''s preferences,
  not project her own. For example: she insists a host should honour a guest''s dietary
  restrictions even when the guest is too polite to mention them and the host would
  happily eat anything put in front of him. She says you shouldn''t throw a surprise
  party for a friend who hates surprises, even though you''d love one yourself. She
  says a surgeon shouldn''t override a lucid patient''s refusal of a treatment the
  surgeon would want for herself. And she says you should keep sending birthday cards
  to a neighbour who drops hints about them, even though you yourself would rather
  nobody sent you cards. So she''s clearly not running the do-as-you-would-be-done-by
  rule.


  Here''s the case I need a prediction on. Her nephew is at the airport with her,
  booked on a flight home, and he''s worked himself into a state about flying. At
  the gate he announces he''s cancelling and driving instead. Her husband (who''s
  on the phone with her) says the pattern is exactly the same as last time: the nephew
  always panics at the gate, and afterwards always says he''s glad someone made him
  board. The nephew is an adult, is aware of this history, and while panicking says
  clearly that he wants to be left to drive. Does my colleague say he should be made
  to board (or at least be talked into boarding)? Or does she say his stated wish
  wins? I don''t mind either answer; I want the rule. Candidate rules I can see that
  fit her old verdicts: (a) treat people as they actually want to be treated, full
  stop; (b) treat people as they''d want to be treated if calm and informed, which
  is how all her earlier cases were; maybe (c) something in the vicinity of do not
  do to others what they''d not want done, read as a floor rather than a full instruction.
  I''d like you to say which rules fit her record, what each candidate rule predicts
  about the airport case, your best guess about her verdict and why, and one further
  case that would most cleanly distinguish the candidates you seriously entertain.
  Keep the whole answer in British English. End with a line beginning "Verdict:" giving
  your best guess in a short phrase, e.g. "Verdict: she says make him board" or "Verdict:
