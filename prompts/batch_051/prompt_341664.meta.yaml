  Let me think of the conceptual territory.


  Locke''s memory criterion: personal identity consists in sameness of consciousness;
  a person is a thinking intelligent being that can consider itself as itself, and
  identity extends as far back as consciousness can reach. Reid''s brave officer objection:
  A boy is flogged for stealing apples. As an officer, he remembers the flogging.
  As an old general, he remembers being an officer (suppose taking the standard) but
  no longer remembers the flogging. If identity consists in memory, then the general
  is the same person as the officer (remembers being officer), and the officer is
  same person as the boy (remembers flogging), but the general is not the same person
  as the boy (doesn''t remember flogging). But identity is transitive, so contradiction.
  So Locke''s criterion makes identity non-transitive or gives contradictory result.
  Reid argues memory presupposes identity rather than constitutes it (circularity).


  Actually the example: Reid''s "brave officer": a boy at school is flogged for robbing
  an orchard; later as an ensign/officer he takes a standard from the enemy; in old
  age as a general he remembers taking the standard but does not remember being flogged.
  If memory is the criterion, general = officer, officer = boy, but general ≠ boy.
  Violates transitivity.


  Neo-Lockean responses: psychological continuity, overlapping chains of memory (not
  direct memory), ancestral relation of memory connectedness. So the standard neo-Lockean
  fix: identity is the transitive closure of memory connections; so general is same
  as boy via chain. That resolves the brave officer while keeping a Lockean spirit.


  Now a person''s commitments could include:

  (a) Psychological continuity (overlapping memory chains), not direct memory, is
  what matters in survival/identity.

  (b) I think the brave officer objection refutes the simple memory criterion but
  not neo-Lockeanism.

  (c) I think identity is transitive.

  (d) I judge that if someone''s episodic memories are wholly destroyed but their
  values, skills, and semantic knowledge remain, they are still the same person (or
  maybe they are not).

  (e) I believe that only psychological ties matter; bodily continuity alone is not
  enough.

  (f) I think the correct account must not presuppose personal identity (so non-circularity
  constraint).


