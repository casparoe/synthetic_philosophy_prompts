  not ease of discovery; the "leap" is search, not compression. Wait, is that a valid
  objection? If K(x|C) is much smaller than K(x), C provides info that x is simple
  given C, but finding it may be intractable. So novelty includes the search effort,
  not the posterior simplicity. E.g., Fermat''s Last Theorem is a corollary of existing
  number theory plus a short (?) proof; K(theorem | prior math) may be small with
  Wiles'' proof as a description? Hmm, careful: K(x|C) is the length of the shortest
  program that outputs x given C. A proof is a program that produces the theorem statement
  from C. The proof might be long but maybe not huge. But the point: short conditional
  description doesn''t imply easy discovery; a needle in a haystack can have small
  conditional description ("the bit at position p") but finding p is hard. So novelty
  as difficulty of search, not compressibility.

  - The value/quality condition is essential, not a side issue: without it, random
  strings maximize novelty; with it, the definition of "useful" smuggles in human
  judgment and novelty isn''t doing the work.

