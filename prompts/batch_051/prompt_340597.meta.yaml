  "In evolutionary theory there is a familiar line of argument — call it the bottleneck
  argument — for deciding what counts as an individual organism in a Darwinian sense,
  as opposed to a mere group or community. The argument runs roughly as follows. If
  a collective is to be a unit of selection, its parts must share a reproductive fate;
  otherwise selection on the parts will tend to favor cheaters and dissolve the collective
