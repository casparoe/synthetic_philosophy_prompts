  the collective arises from a single cell (or small propagule), so the cells that
  compose it are clonally related and reproduce only through the collective''s germ
  line. A Portuguese man o'' war or an ant colony can be tested against this criterion.
  Now consider a holobiont: a multicellular host together with its persistent microbial
  symbionts, such as a coral with its zooxanthellae or an aphid with its Buchnera.
  The development that interests me is this: many holobionts are acutely functionally
  integrated — the host''s metabolism depends on symbionts it cannot make for itself
  — and yet the symbionts are often reacquired from the environment each generation
  rather than passed through a single host bottleneck. I''d like an essay that works
  through whether the bottleneck argument survives this development. Does the holobiont
  case show that a bottleneck is unnecessary for a Darwinian individual, or that functional
  integration and shared fate can be achieved by other means (such as partner fidelity
  or host control) and the argument needs repair? Which premise of the argument is
  actually under pressure, and is there a weaker, defensible version that handles
  obligate symbioses without collapsing into ''anything integrated counts as an organism''?
