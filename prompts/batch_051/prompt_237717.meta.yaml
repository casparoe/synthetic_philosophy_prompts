  UDT (updateless decision theory) is Wei Dai''s 2009-2010 idea: you choose an input/output
  mapping or policy for your entire "self" across all possible observations, rather
  than updating on observations and then choosing. It handles cases like Newcomb''s
  problem, Parfit''s hitchhiker, and counterfactual mugging by selecting the best
  policy ex ante. A classic compute: Newcomb''s predictor 70% accurate? Let''s do
  the math. In Newcomb: two boxes, A transparent with $1k, B opaque with $1M. Predictor
  predicted your choice: if predicted one-box, filled B; if predicted two-box, empty
  B. Predictor 70% accurate. Causal decision theory: your action doesn''t affect the
  box content; always two-box. Evidential: P(filled | one-box)=0.7, so EU(one-box)=0.7M;
  EU(two-box)=0.3M+$1k... Actually P(filled|two-box)=0.3, so EU(two-box)=300k+1k.
  One-box dominates evidential. Causal says two-box regardless. So theories diverge
  at any accuracy > 0.5005. But the example in the prompt described this exact thing
