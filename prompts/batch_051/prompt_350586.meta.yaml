  Teaching "Is death bad for you?" via the Epicurean argument:


  Core idea: The Epicurean says death cannot be bad for the person who dies because
  there is no time at which the dead person is around to be harmed. The teaching plan
  needs to establish several prior ideas:


  1. The distinction between an event''s being bad for you at a time vs. bad full
  stop. People naturally think "death is bad" but don''t distinguish "the process
  of dying" (painful, scary) from "being dead" (nonexistence). This distinction is
  a prerequisite: the question isn''t about dying, it''s about being dead.


  2. The concept of a "subject of harm": for something to be bad for you, does there
  need to be a subject who experiences it? This is the key premise. Before evaluating
  the argument, students need to see this premise explicitly, because their resistance
  will come from it.


  3. The deprivation view: something can be bad for you even if you never experience
  it, because it deprives you of goods you otherwise would have had. Example: someone
  spreads a false rumor behind your back that costs you a job you never knew about;
  it''s bad for you though you never felt it. That''s the carrying example I think
  — it isolates "bad without being experienced" so the class has to either accept
  or rebut the Epicurean premise.


  4. The symmetry objection (Lucretius): if being dead after your life is bad, then
  the time before you were born should be equally bad, but nobody thinks that — so
  the asymmetry needs explaining, which reveals what people actually think makes death
  bad (deprivation of a life you were already living? or something about the direction
  of time?).


  Misconceptions to expect and where to defuse:

  - Conflating dying with being dead. Defuse at the start.

  - "Death is bad because it''s scary/sad for others." That''s bad for the bereaved,
  not for the dead. Defuse after introducing subject-of-harm.

  - "But you might go to an afterlife" — the argument is usually framed independently
  of religious views; need to set aside. Defuse early.

  - "Death is the end of all experience, and experience is all that matters" — students
  may slide from "no subject to experience harm" to hedonism; that''s actually the
  deeper premise to flush out.

  - "If death isn''t bad then why do we avoid it / fear it?" — evolutionary or instinctual
  fear as separate from rational evaluation. Defuse late.

  - The symmetry objection may feel like a cheap point; but it forces the deprivation
  account to say why future non-existence differs from past non-existence.


