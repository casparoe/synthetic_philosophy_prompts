  Born rule problem in MWI: The issue is deriving or justifying the Born rule (probabilities
  proportional to amplitude squared) in a theory where all outcomes occur. Standard
  objections:

  1. Incoherence problem: if all branches are equally real, how can you assign unequal
  probabilities? Naive branch counting assigns equal weight to each branch, not |amplitude|^2.
  The measure of branches is arbitrary (depends on how you carve branches).

  2. Uncertainty problem: In branching, there''s no single future self to be uncertain
  about; both successors are "you". So what are probabilities probabilities of?

  3. Circularity/illicit assumption: Decision-theoretic arguments (Deutsch, Wallace)
  assume a rational agent''s preferences obey axioms (e.g., branch-indifference, diachronic
  consistency) which effectively encode the Born rule or assume that rational agents
  only care about amplitudes, not branch number. They may assume "measurement neutrality"
  or "equivalence" principles that beg the question.

  4. Self-locating uncertainty: Sebens and Carroll''s epistemic separability principle
  (ESP): an agent should assign credence proportional to squared amplitude times the
  number of observers in the branch? Actually ESP gives that when branching, the agent''s
  credence in each branch equals its squared amplitude. Fine.

  5. Fission analogy: Parfit-style — if you''re about to fission into two successors,
  should you be indifferent between them? That analogy may not fix weights.


  The debate stalls because the disagreement is about the nature/role of probability
  in a deterministic theory, not about empirical predictions. It''s partly normative:
