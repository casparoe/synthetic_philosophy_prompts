  He also allows that the corruption can run in the other direction, with debased
  language corrupting thought. The essay reads the bad language of his own day as
  something like a symptom, produced in large part by insincerity, ideology, and contempt
  for the reader. In 1984 the situation looks inverted: the Party is not a victim
  of linguistic decay but its deliberate engineer. Newspeak is designed, administered,
  and continually revised in order to shrink the range of thinkable thoughts. The
  Appendix describes the project in the neutral, systematic tone of a grammar book,
  as if the revolution has already succeeded. The novel thus offers a picture in which
  language is less an unwanted symptom and more an instrument of state power—a technology
  for making heresy literally unthinkable.


