  Let''s think of a distribution example: Consider three groups: poor, middle, rich.
  Utility is concave in income. Difference principle maximizes income of worst-off.
  A policy that makes the rich vastly richer but also raises the worst-off a little
  would be chosen by DP only if it maximizes worst-off''s position. Utilitarian might
  prefer a different policy where total utility is higher but worst-off isn''t maximized
  — e.g., worst-off slightly lower, but middle much higher. For DP, the policy with
  worst-off at 10 is better than one with worst-off at 9, regardless of inequality.
