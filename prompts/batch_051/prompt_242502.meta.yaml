  Let me craft moves:


  (1) A: "Computational irreducibility means there''s no shortcut: to know the state
  at step n you have to run the n steps. So for such systems, there is no explanation
  of why the state is what it is, beyond ''because the rule ran n times.'' That''s
  not an explanation; it''s a simulation. So irreducibility is the end of explanation
  for those systems."


  (2) B: "That conflates explanation with compression. An explanation can cite the
  rule and initial condition — that''s perfectly explanatory — even if it doesn''t
  let you jump ahead. Explaining is not the same as predicting cheaply."


  (3) A: "But a rule plus initial condition just is the simulation. If the only way
