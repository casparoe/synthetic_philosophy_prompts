  one send, no one gets anything. You can''t communicate with the others." Rational
  analysis: your chance of being the unique sender is tiny, so you shouldn''t bother;
  but if everyone reasons that way, no one sends; but if you think everyone else reasons
  that way, you should send (you''d be the unique one). But then everyone would send.
  It''s a paradox about symmetry and superrationality.


