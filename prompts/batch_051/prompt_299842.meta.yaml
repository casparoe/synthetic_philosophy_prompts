  anumāna (inference), upamāna (comparison/analogy), and śabda (testimony), and that
  they spent a lot of time arguing with Buddhists and Cārvākas about whether each
  one is really a separate, irreducible source of knowledge. The thing I can''t shake
  is that when I read summaries it all feels like it should flatten into ''evidence
  is evidence'': perception is just your sensory channels, inference is just probabilistic
  reasoning/induction, testimony is just another noisy channel you update on after
  calibrating the source, and upamāna is something about similarity between representations,
  which to me sounds like it''s doing work but I can''t say what kind. But I also
  suspect the flattening loses something, maybe about what kind of entitlement or
  epistemic status these sources are supposed to give, or about the structure of the
