  Arguments for acquaintance principle / against aesthetic testimony:

  1. Kantian: aesthetic judgments must be autonomous; relying on another''s judgment
  makes your judgment heteronomous, not a genuine judgment of taste. (Kant''s "autonomy
  of taste")

  2. The "conditional account": aesthetic properties are response-dependent; to know
  a work is elegant, you need to experience the response yourself, not just be told
  it elicits the response.

  3. The "phenomenal knowledge" argument: aesthetic knowledge is knowledge-what-it''s-like
  or involves acquaintance; like Mary the color scientist, testimony can''t give you
  the qualitative experience. (This is more general; used by some)

  4. The descriptive/critical distinction: testimony may convey that a work is good
  but not why or what it is like, so it cannot ground understanding-based aesthetic
  judgment.

  5. The argument from "aesthetic concepts" (Sibley): applying aesthetic concepts
  requires taste, which requires first-hand perceptual training; testimony can''t
  substitute. Note Sibley argued taste requires firsthand perception; one could not
  be told a thing is graceful to see it as graceful? Actually Sibley says aesthetic
  terms require taste and perception; you can''t rely on others'' tests.


  Arguments against the acquaintance principle / for aesthetic testimony:

  1. Expert testimony parity: we rely on testimony in science, history, etc.; aesthetics
  is no epistemically worse off; aesthetic experts exist and their testimony is often
  more reliable than our own judgments.

  2. The "inference from reliability" error: some defenders of the acquaintance principle
  conflate psychological inability to form genuine appreciation via testimony with
  epistemic inability. Just because hearing a review doesn''t give the same experience
  doesn''t mean it can''t justify belief.

  3. The ubiquity of testimonial aesthetic knowledge: we know many things aesthetically
  via testimony — e.g., that some music is complex, that a film is dull, that a novel
  is funny — and denying this is revisionary.

  4. The "aesthetic understanding" defense: testimony can contribute to understanding
  even without full acquaintance; e.g., someone can know enough from descriptions
  and testimony to judge.


