  Elias: You''re assuming the answer is already selected before the CoT begins. In
  many architectures the tokens are produced sequentially, so the CoT tokens constrain
  the answer tokens; later tokens can only be generated if earlier ones occur. That
  means the CoT is part of the causal chain that produces the answer. It is not a
  commentary after the fact but a causal precondition. If it were merely confabulation,
  changing or deleting it shouldn''t change the answer, but intervention studies show
