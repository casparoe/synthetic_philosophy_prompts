  Round 1:

  Rosa says: The CoT is itself generated token-by-token by the same model, optimized
  on the same next-token objective as the final answer. Nothing in that objective
  says "report the actual causes of the answer." So a model could compute the answer
  from one set of features and then produce a CoT that looks like the reasoning but
  isn''t. The CoT is at best an unverifiable self-report; we should treat it as a
  rationalization until proven otherwise.


  Elias replies: That proves too much. Human verbal reasoning also runs on the same
  mechanisms as human answers, and we often give post-hoc rationalizations; but silencing
  the only articulate channel we have amounts to saying we can never know why anyone
  — human or machine — thinks what they think. If you set the bar at "direct readout
  of the underlying computation," almost nothing passes. We use CoT because it''s
  the best evidence we have.


  Round 2:

  Rosa: No, asymmetry: with humans, the report and the process share a single cognitive
  system and the report is part of it; with a language model, we actually have access
  to the internal activations and can check whether the stated reasons track them.
  When people do check, the reasons given can be controlled by features the model
  never mentions, and CoT can be made to say one thing while a different feature drives
  the output. That sort of check isn''t possible for humans, which is why we give
  human testimony more provisional credit.


