  Prompt outline (Type A, conceptual engineering):

  - State the parallel noticed: conceptual engineering/ameliorative analysis (fixing
  concepts rather than analyzing them) resembles software refactoring: changing the
  internal implementation (or even the interface) while preserving/improving the function,
  with the goal of better serving the code''s purpose; conceptual engineers like Haslanger
  argue we should revise the concept WOMAN to serve egalitarian purposes, not describe
  current usage. In refactoring, you change code without changing the program''s observable
  behavior for relevant use cases, or you deliberately change behavior (if fixing
  bugs). The "what the concept is for" corresponds to a program''s specification;
  current usage corresponds to the existing implementation; ameliorative analysis
  corresponds to refactoring toward an improved implementation or revised spec.

  - Ask: Is this a deep structural identity or just pattern-matching? Where does the
  mapping hold and break? If real, does anything transfer from software engineering
  — e.g., legacy compatibility (keeping old call sites), deprecation, type migration,
  leaky abstractions — to philosophy?

  - Request committed answer: take a definite position on whether the analogy is deep
  or superficial; name something the parallel predicts that turns out false (as the
  type notes suggest).


