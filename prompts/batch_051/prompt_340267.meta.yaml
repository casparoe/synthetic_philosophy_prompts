  Prompt:


  "I am a high school student, and a view I keep encountering—in ethics, in politics,
  and in discussions of how to build artificial systems that act on our behalf—is
  that the standard of correctness for a person''s (or machine''s?) values is not
  what the person actually wants now, but what a suitably idealized version of them
  would want: a version with full information, perfect reasoning, no bias, and full
  coherence. Something is genuinely good for me, or right for me to do, roughly when
  that idealized advisor would endorse my doing it. The view attracts me because it
  explains why I should defer to my future self about some things (my future self
  is closer to that ideal); it lets me discount desires based on plain factual errors
  without having to decide case by case; and it offers a principled way to improve
  my priorities over time—I am not stuck with whatever I happen to want. It also gives
  a clean answer to the question of what we should aim at when we try to become better
  people: we should aim at the verdicts of the idealized version of ourselves."


  "At the same time, I have an intuition I cannot shake: that my actual commitments—say,
  my care for a particular person or a project I''ve poured myself into—have some
  authority just because they are mine and actual, not merely because an idealized
  descendent of me would ratify them. If the process of idealization would scrub away
  enough of my biases, emotional makeup, and history, then the resulting ''advisor''
  might be someone I do not recognize and whose verdicts I have no reason to obey.
  I want to be improved, not replaced; but the theory seems to make the authority
  of my present values entirely conditional on a hypothetical judge, and possibly
  dissolves them if the judge rules against them."


  "Both sides seem strong. The theory has the systematic virtue of one unified standard
  and a story about why fallible, selfish, short-sighted creatures like me should
  not make their unexamined impulses normative. The intuition has the virtue of taking
  seriously that value is lived first-person, not assigned by a computational simulation
  of me. I can''t tell whether the intuition is just the partiality the theory says
  we should correct for, or a genuine constraint on any acceptable account of normativity."


  "Please give me a committed answer: should the intuition be debunked and surrendered
  to the theory, should the theory be amended so that it preserves actual commitments,
  or are they compatible under some reading I am missing? Take a definite position
  and defend it, and say what would justify each of the moves rather than merely laying
  out the options."


