  "I recently encountered a line of argument in a seminar that seems to prove considerably
  more than its author was willing to claim, and I cannot locate the mistake. The
  author meant only to argue that the ''singleton hypothesis''—the claim that a durable
  future for advanced intelligence will be organized under a single decision-making
  agency at the highest level, whether a world government, a superintelligent system
  with decisive control, or some equivalent—is plausible. But the argument as stated
  seems to show that any lasting non-singleton order is impossible in principle, for
  any kind of advanced agents, at any level of technology. Since that is far stronger
  than the singleton hypothesis needs to be, I suspect one of the steps slips, but
  each looked legitimate when I pressed him on it.


  Here is the argument, reconstructed:


  (1) Suppose there is, at some future time, a durable population of agents with transformative
  power—advanced AI systems, states armed with such systems, or coalitions of either.
  Consider any such durable arrangement.


  (2) If one of these agents ever acquires a decisive advantage in its capacity to
  shape the world, then it can overwhelm any rival or coalition of rivals. The only
  thing preventing it from establishing a singleton is its own forbearance. But an
  order whose continuation depends on the incumbent''s forbearance is not durable:
  a later incumbent, a different policy, or a change in internal alignments could
  reverse the forbearance at any time. So a decisive advantage either already is a
  singleton, or it is a temporary arrangement on its way to one.


  (3) Suppose instead that no agent ever acquires a decisive advantage. Then the agents
  remain in rough parity. But parity is not self-maintaining. The agents'' growth
  rates in technological, economic, and military capacity will differ, and small differences
  compound over time, eventually producing a decisive advantage unless some agency
  continuously equalizes capabilities. Continuous equalization, however, would require
  a standing capacity to monitor every agent''s capabilities and redirect resources
  from the stronger to the weaker—and a capacity with that kind of authority and enforcement
  power is itself a singleton in all but name. So parity either collapses into a decisive
  advantage or is maintained by something that is already a singleton.


  (4) Therefore, any durable arrangement of advanced agents either contains a singleton
  or is on an inevitable path to one. Every durable non-extinction future is a singleton
  future.


  (5) But that is too much. It does not merely say that singletons are likely under
  certain conditions; it says that a durable non-singleton order—a stable balance
  of power, a lasting federation of equals, or an equilibrium maintained by mutual
  deterrence—is impossible in principle. That seems to rule out, as a matter of necessity,
  arrangements that have historically persisted for long stretches and that we can
  describe coherently for advanced AI as well.


  I would like to keep as much of (2) as possible, since a decisive advantage in the
  hands of one power does seem to be the most plausible route to a singleton. But
  I cannot accept (5) as written, and the inference from (1)–(4) to (5) seems forced.
  Which step should I reject, and what exactly does rejecting it cost? In particular,
  say whether the problem is a bad premise or a slide in the reasoning, and what the
  strongest defensible version of the singleton hypothesis would look like once the
  argument is repaired."


