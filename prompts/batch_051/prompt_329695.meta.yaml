  I teach a final-year undergraduate module called Philosophy of Artificial Intelligence.
  I need a closed-book essay question on the narrow definition of the alignment problem,
  together with a model answer of about 800 words and a marking scheme out of 25 marks.
  The topic is the contrast between intent alignment and value alignment. The question
  should not be answerable by reciting the definitions. It should provide a short
  scenario—for example, a home-assistance robot that, at the instruction of an exhausted
  carer, switches off a frail patient''s fall monitor because the carer finds the
  alerts burdensome—and ask students to assess the claim that this system is aligned,
  and what their answer reveals about whether ''alignment'' should be defined narrowly
  in terms of carrying out intended outcomes or more broadly in terms of acting on
  morally defensible values. The model answer should distinguish literal instructions,
  intended outcomes, and underlying interests; explain why a narrow definition is
  attractive to engineers; and weigh the objection that it would count harmful but
  faithfully executed plans as alignment successes. The marking scheme should separate
  an A from a B by identifying the specific moves that must appear in each band, and
  should name the common mistakes that keep an answer at C level (for instance, conflating
  alignment with moral permissibility, or treating the harmful scenario as a choice
  between two design specifications rather than a conceptual question).


  Write the question, the model answer, and the marking scheme. The question must
  not require citations, bibliographies, or knowledge of named authors or papers.


  ---


