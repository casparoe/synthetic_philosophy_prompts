  "I am a software engineer who has spent most of my career building and operating
  distributed storage systems. The other night I got into a long argument with a friend
  who works in a historical museum. She kept insisting that when a community''s collective
  memory conflicts with the archival record, the community''s memory often has its
  own kind of authority and cannot simply be corrected by ''the facts.'' I pushed
  back repeatedly that this sounded like preferring a dirty cache over the source
  of truth.


  In response she read me a passage from Ernest Renan''s 1882 lecture What Is a Nation?
  In the passage, Renan observes that national unity has required not only shared
  memories but also shared forgetting: no nation''s actual formative history is free
  of violence, seizure, and internal division, and if the full record of those events
  were kept vivid, the common life that depends on treating the nation as a single
  continuing subject would be harder to sustain. His claim is not merely that people
  happen to forget; it is that nationhood is in part constituted by a kind of organized
  forgetting or misremembering, and that the historian who insists on restoring the
  full record can in fact dissolve the very unity she studies.


