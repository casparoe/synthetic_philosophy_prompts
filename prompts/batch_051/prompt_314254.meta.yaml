  Perspective: PhD student in linguistics (or philosophy of language/cognitive science)
  who''s TAing or setting an exam. They say something like:


  "I''m a linguistics PhD student helping teach an undergrad intro to language and
  mind class. The professor gave the class a list of criteria for what makes something
  a natural human language, which I''ve condensed as: (1) a conventionalized vocabulary
  of symbols (arbitrary form-meaning pairs shared by a community), (2) duality of
  patterning (meaningless building blocks combine into meaningful units, which combine
  into larger expressions), (3) productivity/systematic composition (speakers can
  produce and understand novel expressions), (4) reflexivity/displacement (can talk
  about absent, hypothetical, or metalinguistic things), (5) acquired natively by
  children in the normal course of development. Now we''re looking at homesign: the
  gesture systems invented by deaf children who are not exposed to an existing signed
  or spoken language — e.g., a child born deaf into a hearing family, who is not taught
  sign but spontaneously creates a stable set of gestures. These systems have stable
  word-like gestures, can combine them into two- and three-gesture strings with consistent
  word order, and can express things like absent entities; but they don''t have a
  community of users, they don''t have duality of patterning in the full sense (no
  meaningless sublexical units like phonemes), the vocabulary isn''t shared (parents
  may use only some of it), and they don''t pass on as a full language. Question:
  Go criterion by criterion and say whether homesign qualifies as a language. Then:
  is this a case where homesign falls short of the criteria, or is this a case where
  the criteria are smuggling in a notion of ''language'' as a social/cultural object
  rather than testing the child''s linguistic system? I also want an honest ruling
  on whether the conventionality criterion is doing different work than the others."


