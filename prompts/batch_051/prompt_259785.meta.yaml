  ---


  Consider the following game. A fair coin is tossed until it comes up heads. If the
  first heads appears on the nth toss, the player receives £(−1)^{n−1} 2^n/n: that
  is, £2 if n=1, −£2 if n=2, +£8/3 if n=3, −£4 if n=4, and so on (negative amounts
  are losses).


  The following argument purports to show that this game has no well-defined expected
  value even though the natural-order sum converges.


  (1) The expected value of a gamble is, by definition, the sum over all possible
  outcomes of each outcome''s probability multiplied by its payoff.

  (2) Here the probability that the first heads occurs on the nth toss is 2^{−n},
  so the contribution of the nth outcome to the expected value is 2^{−n} × (−1)^{n−1}
  2^n/n = (−1)^{n−1}/n. The expected value, computed in the natural order n = 1,2,3,...,
  is therefore 1 − 1/2 + 1/3 − 1/4 + ..., which converges (in this ordering it converges
  to ln 2).

  (3) The series is only conditionally convergent, not absolutely convergent. By the
  rearrangement theorem for conditionally convergent series, its terms can be rearranged
  so that they sum to any chosen real number, or diverge to +∞ or −∞.

  (4) A quantity that can be made to take any numerical value, simply by reordering
  the terms of the sum used to compute it, is not a well-defined property of the game
  itself (unless some one ordering is privileged in a way the other orderings are
  not).

  (5) Therefore the game has no well-defined expected value: the appearance of convergence
