  reasoning. Possible criteria:

  1. The choice forecloses a significant range of future options that are themselves
  plausibly valuable (not merely a specific path).

  2. The foreclosed options cannot be recovered later at reasonable cost (irreversibility).

  3. The choice is made for the parents'' sake or for reasons extrinsic to the child''s
  likely interests, rather than to secure basic goods (health, safety, education,
  autonomy) for the child.

