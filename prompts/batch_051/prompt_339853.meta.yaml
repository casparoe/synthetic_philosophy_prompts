  Domain: petitionary prayer to an omniscient, immutable God.


  A plausible lay theological/philosophical profile:


  (1) God is omniscient, so he always already knows what I need and what I''m going
  to ask. Prayer adds no information.


  (2) God is immutable—his will and plan never change. So prayer cannot change God''s
  mind or get him to do something he wasn''t already going to do.


  (3) Petitionary prayer is still something we should do, because it''s commanded
  and it does something to us: it forms our desires, reminds us of dependence, aligns
  our will with God''s.


  (4) But I also think it''s legitimate to pray for specific outcomes—like a friend''s
  surgery going well, or a job—and to believe that God may answer such prayers, not
  just that praying makes me feel better.


  (5) In fact, I think there are cases where, if I hadn''t prayed, the outcome would
  have been different. Prayer can be a real cause in the world, the way a friend''s
  warning can be a real cause of me avoiding an accident, even though God foreknows
  it all.


  (6) I think it would be wrong to treat prayer as bargaining with God, or as a technique
  that reliably produces results; that''s magic, not prayer.


  Now analyze tensions:


  - (1)/(2) vs (5): If God''s will is fixed and he foreknows, how can "if I hadn''t
  prayed, the outcome would differ"? Standard move: God wills the whole package including
  the prayer as part of the causal story; counterfactual dependence on prayer is compatible
  with immutability if God''s eternal decree includes the prayer (secondary causation
  / conditional decrees). This is a real tension but resolvable; to an untutored eye
  it looks contradictory. Actually (2) "cannot get him to do something he wasn''t
  already going to do" and (5) "if I hadn''t prayed outcome would be different"—these
  might be compatible if "already going to do" is unpacked as "eternally willed to
