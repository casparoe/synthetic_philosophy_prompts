  Here is where I landed:


  (1) I hold a broadly externalist metasemantics. What a term or concept means in
  a public language is settled by historical and social patterns of use — and by the
  external environment those patterns are hooked to — not by what any individual speaker
  privately intends or explicitly stipulates.


  (2) I nevertheless think conceptual engineering is a real and distinctive method:
  when philosophers propose that we revise our concept of, say, consent or race, they
  are doing something more than announcing a stipulative redefinition for a local
  purpose.


  (3) I think the method''s legitimacy comes from being answerable to the existing
  concept''s actual social function. An engineering proposal that simply ignores what
  the current concept does — whom it harms, which distinctions it enables, which inferences
  it licenses — is not engineering the concept at all; it is merely replacing it with
  a new one that happens to share a word.


  (4) However, I do not think one needs anything like a complete analysis of the target
  concept before one may engineer it. A partial grip on central cases, core functions,
  and known defects is enough to begin, and sometimes it is enough to finish.


