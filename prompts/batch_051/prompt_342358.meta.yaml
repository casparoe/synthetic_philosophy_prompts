  Epicurean argument structure:

  1. Something is bad for P only if P exists at some time when it''s bad for P (the
  "existence requirement" / experience requirement).

  2. While P exists, death is not present (P isn''t dead).

  3. When death is present, P does not exist.

  4. Therefore, death is never bad for P. (Or: death is nothing to us.)


