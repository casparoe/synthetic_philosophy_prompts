  \ person or body judged a series of earlier cases and asks what they'd say about\
  \ a new case. Write earlier verdicts jointly consistent with more than one plausible\
  \ rule, new case where at least two rules diverge.\n\nDomains 3 and 4 are ethical;\
  \ good for case verdicts. Negative utilitarianism — someone's verdicts on cases\
  \ could reveal different versions of NU (lexical threshold, absolute vs weak, etc.).\
  \ The collective harms domain also works — someone's verdicts on whether to vote,\
  \ eat meat, etc.\n\nLet me think: \"Individual contributions to collective harms\
  \ and the inefficacy objection.\" A friend has verdicts on various cases: voting,\
  \ meat-eating, donating, boycotting, flying, etc. The asker wants to predict her\
  \ verdict on a new case (e.g., buying a gas car, smaller collective harm). The underlying\
  \ rules could be: expected utility threshold, act-omnipotence requiring actual difference,\
  \ participation in harmful practices is wrong regardless, or \"if many people acting\
  \ similarly would matter, you should act accordingly\" (Kantian universalization),\
  \ or moral purity/expressive. Actually the \"verdicts\" are on previous cases by\
  \ a friend. We can craft verdicts consistent with multiple rules and a new case\
  \ that differentiates.\n\nBut negative utilitarianism also lends itself: a friend's\
  \ verdicts on cases involving creating lives, eliminating suffering, replacing suffering\
  \ with happiness, etc. New case: replacing a small suffering population with a larger\
  \ happy one? Hmm.\n\nLet me consider Du Bois art as propaganda: a critic or friend\
  \ judges cases of artworks (novel, painting, film) — whether they are good art /\
  \ propaganda. New case. That's rich but less universally known; Du Bois's criteria\
  \ (truth, beauty, propaganda) might be niche. The instruction says don't refer to\
  \ super niche theories unless injected. Could inject: the friend has a view that\
  \ art should be propaganda for justice, but with nuances. But domain is \"W. E.\
  \ B. Du Bois's views\" — the prompt presumably should engage with Du Bois. Could\
  \ be \"my friend has been reconstructing Du Bois's criteria...\" The model needs\
  \ to know Du Bois's \"Criteria of Negro Art\". That's fairly known among educated\
  \ models. But small LLMs might not know \"Criteria of Negro Art\" specifics. We\
  \ could seed the ideas into the prompt itself, avoiding reliance on memorized specifics.\n\
  \nI think the inefficacy objection domain combines well with the case-verdicts type,\
  \ and it's broadly known. Let me develop that.\n\nThe prompt: someone just had a\
  \ long argument with a friend who is reflective about collective harm cases. The\
  \ friend has stated verdicts about: (a) voting in a safe-seat election — \"doesn't\
  \ matter, not obligated\"? (b) buying factory-farmed chicken for one meal — she\
  \ says wrong? (c) flying to a family wedding given climate — she says permissible?\
  \ (d) not donating to a charity that could avert one malaria death? etc. We need\
  \ these verdicts consistent with multiple rules, and a new case that splits them.\n\
  \nLet's design careful prior verdicts.\n\nFriend's verdicts (recorded, consistent\
  \ with more than one rule):\n1. She says it's not wrong to abstain from voting in\
  \ a national election where the margin is guaranteed to be large (your ballot won't\
  \ change outcome).\n2. She says it is wrong to buy a package of factory-farmed chicken\
  \ for one person's dinner.\n3. She says it is not wrong to take one short-haul flight\
  \ per year for a family visit, even though it contributes to climate harms.\n4.\
  \ She says it is wrong to join a crowd in which each person pushes a boulder? Hmm,\
  \ that could be overdetermination case.\n5. She says it is not wrong to use a few\
  \ sheets of paper / run the tap etc. Maybe too trivial.\n\nWe need a track record\
  \ that underdetermines the rule. Candidate rules:\n- Rule A (expected utility/expected\
  \ harm): act is wrong iff its expected marginal contribution to harm times magnitude\
  \ is above a threshold. Buying chicken: expected contribution measurable (one chicken\
  \ production is highly responsive — with factory farming, buying one chicken likely\
  \ increases production by ~1 chicken? Actually elasticity). Voting: expected chance\
  \ of decisiveness tiny, so not wrong. Flying: expected marginal contribution to\
  \ climate harm small but maybe aggregated... The new case could be choosing between\
  \ two.\n\n- Rule B (universalization/Kantian): act is wrong iff the maxim \"everyone\
  \ may do this\" would be disastrous. Not voting? If everyone abstained, democracy\
  \ dysfunctional — could be wrong. So that predicts the friend would say abstaining\
  \ is wrong, but she said not wrong. So not that. Unless she's consequentialist.\n\
  \n- Rule C (participation/complicity without making a difference): you should not\
  \ participate in a practice that is collectively harmful when it's easy to avoid\
  \ and the practice is wrong, regardless of whether your act makes a difference.\
  \ Buying chicken wrong because you participate in a wrongful practice; but abstaining\
  \ from voting? Voting is a beneficial collective practice, participation not required.\
  \ Flying: harmful practice but less obviously wrong? Actually flights contribute\
  \ to climate; participation rule would say it's wrong (or at least suspect), but\
