  \ victims (chicken) vs diffuse (climate).\n\n- Rule D: harm to identifiable victims\
  \ vs statistical victims? Buying chicken: identifiable victim (the particular chicken,\
  \ even if production is probabilistic, actually each chicken purchased is tied to\
  \ actual suffering). Flying: victims are statistical/diffuse. Voting: no victims.\
  \ New case could be buying a car with a known safety defect? Hmm.\n\nAlternatively\
  \ the friend's rules could be:\n- Expected-utility with threshold based on expected\
