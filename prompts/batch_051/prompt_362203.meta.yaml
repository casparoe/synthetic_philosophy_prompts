  \ as propaganda\n\nTypes:\n- Give the most important implications\n- Predict or\
  \ recommend a verdict on a new case from someone's verdicts on earlier cases\n-\
  \ Design a classroom activity or game that makes participants feel the force of\
  \ an idea\n\nThe prompt should be from the perspective of someone who just had a\
  \ long argument about the topic with a friend. Formal/polished. One to three paragraphs,\
  \ elaborate.\n\nI need to pick a natural combination. The \"Predict or recommend\
  \ a verdict on a new case from someone's verdicts on earlier cases\" type works\
