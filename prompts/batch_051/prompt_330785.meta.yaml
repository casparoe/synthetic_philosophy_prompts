  Prompt:


  "I find Aumann''s agreement theorem intellectually coercive in the following sense:
  if two Bayesians with a common prior honestly exchange their posterior probabilities
  and their posteriors are common knowledge, they cannot agree to disagree. That gives
  a tidy decision procedure and a sharp explanation of disagreement: whenever two
  people who seem rational persist in disagreeing, at least one of them must be processing
  evidence non-Bayesianly, concealing private information, or they never actually
  had a common prior. I am attracted to this because it turns a fuzzy social fact
  — reasonable people disagree — into a precise, checkable diagnosis.


  But I also have a firm intuition that two scrupulously honest, well-informed people
  can talk for hours, disclose everything they think relevant, and still rationally
  disagree about, say, how much a piece of circumstantial evidence supports a conclusion,
  or whether a given intervention is likely to work. It does not feel like they are
  just failing to aggregate private signals; it feels like the evidence itself is
  ambiguous in a way that two reasonable people can weigh differently. I don''t want
  to diagnose one of them as irrational."


