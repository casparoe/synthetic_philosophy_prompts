  The summary paragraph:


  "Words like ''I'', ''you'', ''here'', and ''now'' are called indexicals, but there
  is nothing philosophically deep about them. They are just shorthand for definite
  descriptions that pick out different things in different contexts: ''I'' means ''the
  person who is speaking this utterance'', ''here'' means ''the place where this utterance
  occurs'', and ''now'' means ''the time at which this utterance occurs''. Because
  any sentence containing an indexical can be paraphrased, without loss of meaning,
  into a sentence containing only names and descriptions, a language could in principle
  do without pronouns and indexicals altogether. The fact that every known language
  has them is merely a matter of convenience, not a constraint on what can be said.
  This also means that the present moment has no special status: the belief that ''now''
  picks out something metaphysically privileged is an illusion produced by the fact
  that we happen to use an indexical instead of a date."


