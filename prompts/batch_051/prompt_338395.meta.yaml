  character/linguistic meaning but not the content; if meanings are truth-conditional
  contents, then ''I'' does not mean ''the speaker'' (the content of an utterance
  of ''I am tired'' is about the speaker, but ''I'' is not synonymous with the description;
  the character/content distinction). A philosopher would accept that ''I'' is a direct
  referential term whose linguistic rule picks out the speaker, but not that it is
  shorthand for the description; substituting the description changes cognitive significance
