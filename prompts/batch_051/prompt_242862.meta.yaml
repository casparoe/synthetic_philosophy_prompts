  Fitch''s paradox: from the knowability principle (all truths are knowable) plus
  non-omniscience (there is an unknown truth), one can derive that all truths are
  known. The issue: p & ~Kp is unknown, and if all truths are knowable, then K(p &
  ~Kp) is possible, but this is impossible because knowledge distributes over conjunction
  and implies truth... The paradox is usually put as a problem for verificationism/anti-realism.


