  Let me refine the thesis and argument sketch:


  Thesis: For decision problems where the same stake is faced repeatedly and outcomes
  multiply (e.g., repeated betting of a fraction of wealth), expected value maximization
  as usually applied is flawed because it averages over parallel possible worlds at
  one time (ensemble average) rather than over what happens to a single agent across
  time. The correct criterion is maximizing the time-average growth rate; in the simplest
  i.i.d. multiplicative case this is maximizing expected log growth, so log utility
  / Kelly / geometric-mean reasoning are not psychological assumptions but consequences
  of asking the right averaging question. This generalizes to non-i.i.d. cases with
  time averages of growth rates.


  Audience: economics department seminar — mostly macro/finance types who know portfolio
  choice, expected utility, risk aversion; one decision theorist who knows Savage;
  maybe one econometrician. They care about internal consistency, not reinventing
  the wheel, connecting to canonical results (Merton, Samuelson), and not overclaiming.


  Objections likely:

  1. "After all this, your prescription is just what an expected-utility maximizer
  with log utility would do. Are you denying that, or merely relabeling it? If relabeling,
  what''s new?" Standard reply: log utility is derived, not assumed; the difference
  matters for people with other utility functions — in a repeated multiplicative setting
  they should act as if log utility even if their one-shot risk preferences differ.
  Weakness: the justifiability of acting "as if" may rely on long horizons.

  2. "You''re maximizing the wrong statistic: a decision maker may care about a fixed
  future date T across states of the world, not a single realized path. Expected utility
  with a concave utility function already handles risk; geometric mean is just one
  objective among many." Reply: for an agent whose wealth compounds, the almost-sure
  long-run path is what actually happens to them, not the ensemble average; but this
  requires T large and a single agent across time; weaknesses.

  3. "The results only hold under strong i.i.d./ergodic assumptions. Real returns
  are autocorrelated, margins change, there are drawdown constraints. Your ''time-average
  growth'' criterion is not well-defined outside those assumptions." Reply: ergodicity
  economics has extensions (I might mention the concept of "ergodicity-breaking" —
  but is that niche? Maybe okay to reference). Weakness: extensions are piecemeal
  and not a complete decision theory.

  4. Decision theorist: "Expected utility theory doesn''t say maximize expected value;
  it says maximize expected utility, and your argument at most identifies a particular
  utility shape justified for a particular dynamic. Which of the Savage/vNM axioms
  do you think fails, and if none fail you haven''t shown EU is wrong." Reply: no
  axiom fails as a representation theorem; the point is about which gamble to evaluate,
  or that the framework misapplies when we average over outcomes the agent will never
  experience jointly. Weakness: this is the softest part — showing the gap between
  vNM consistency and the ergodicity critique.

  5. Empiricist: "Your argument predicts that people who repeatedly take positive-EV
  bets without Kelly sizing go broke, but real gamblers with sub-Kelly bets survive
  with lower growth. That''s consistent with EU + risk aversion; what evidence would
  distinguish your explanation from garden-variety risk aversion?" Reply: it predicts
  choices that are inconsistent with any fixed utility in the short run? Actually
  maybe less strong.

  6. The one they hope nobody asks: "What exactly is the normative argument for maximizing
  long-run growth rate rather than any other functional of the wealth path? You''ve
  shown what happens if the agent does; you haven''t shown what they should do." Weakness:
  this is the deepest gap — bridging positive dynamics to normativity.


