  experiments that should move me, sorted by how decisive they would be. Which findings
  or considerations would show not merely that epiphenomenalism is unappealing, but
  that it is false or unstable—for example, because it cannot account for the reliability
  of introspective reports, because it collapses into physicalism or eliminativism
