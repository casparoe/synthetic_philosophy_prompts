  them; he sets an evidential bar ("unless the testimony be of such a kind that its
  falsehood would be more miraculous..."). So the maxim is not an outright impossibility
  proof; it''s a comparative weighing. Actually he says "no testimony is sufficient
  to establish a miracle, unless..." and then argues in fact no testimony in history
  meets the bar. But the structure allows that testimony could in principle meet it.

