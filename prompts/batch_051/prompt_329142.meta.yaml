  Is that true? Not trivially — even with finitely many neurons, the continuous dynamics
  might produce uncountably many states, though perhaps only finitely many are discriminable
  given finite resolution. But one could also argue the number of *types* of experience
  relevant to meaning is finite, hence exhaustible. The claim "experience is exhaustible"
  is contested.


