  I run a reading group on the epistemology of introspection and we''ve been stuck
  for months on the reliability question. One half of the room thinks introspection
  is basically confabulation all the way down: people make up reasons for their choices,
  miss things sitting right in front of them, rationalize split-brain decisions, and
  are systematically overconfident about the accuracy of their reports. The other
  half thinks those studies are just bad introspection — they mostly use retrospective
  or off-the-cuff reports from people who were never actually attending to their own
  experience in the first place, and that with better methods (concurrent reporting,
  descriptive experience sampling, think-aloud protocols) introspection turns out
  to be pretty serviceable. Same papers, same people, no movement in months.


  My working theory is that this is not really one disagreement. The two sides are
  using the word introspection for two different jobs. One side is asking whether
  people can report the causes of their own behavior; the answer to that is probably
  no, or at least "only by theorizing after the fact." The other side is asking whether
  people can report the contents and character of their ongoing conscious experience;
  the answer to that is a lot closer to yes. If that''s right, the debate is stuck
  because it''s been posed as a single question with a single reliability score, when
  it''s really two questions with different answers.


  I want a diagnosis rather than a verdict. Is my theory roughly right, or is there
  still a substantive disagreement left over — for instance, about how much inference
  and interpretation leak into even concurrent, first-person reports? What kind of
