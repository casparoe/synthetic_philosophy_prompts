  Let''s think through numbered argument precisely:


  (1) The change in her behavior is explained by the fact that human time preferences
  are hyperbolic, not exponential: the weight she gives to a future outcome falls
  much faster when delay is short than when it is long. In the morning, the show (hours
  away) is heavily discounted relative to the report''s future payoffs; in the evening,
  the show is immediate and its value is barely discounted at all.

  (2) Hyperbolic discounting is a general, structural feature of how temporally situated
  agents weigh outcomes, and at any time it yields a coherent ranking of alternatives
  from the agent''s then-current temporal position; it does not amount to a logical
  inconsistency in her reasoning.

  (3) There is no time-neutral standpoint from which the morning and evening rankings
  can be compared as more or less rational; each is just the same discount function
  applied from a different present. Therefore the evening ranking is neither an error
  nor a corruption of the morning ranking; it is what the ranking becomes when the
  agent is honestly located at a different point in time.

  (4) If the evening ranking is rationally permissible and not less authoritative
  than the morning one, then in acting on it she is not acting against what she has
  best reason to do at the time she acts; she is acting in line with the reasons her
  own time-indexed perspective makes salient.

  (5) Akrasia consists exactly in acting against what one judges best, or has most
  reason to do, at the time of action. If there is no such conflict in the evening,
  the action cannot be akratic.

  (6) Since the same analysis applies to the standard shape of temptation cases, the
