  I keep noticing a pattern in the way successful scientific theories get replaced,
  and I have not been able to find what it is called or whether it has a settled interpretation
  in the realism debate. Here is the pattern as I see it. When an older, extremely
  successful theory is superseded, the replacement rarely discards the older theory''s
  equations. It keeps them, usually as a limiting case or a special case, and working
  scientists go on using the old formalism for calculations because it remains accurate
  in its domain. But at the same time, the interpretation of the central terms changes:
  what the old theory treated as its basic objects gets demoted, reinterpreted, or
  dropped, while the mathematics carries over almost intact. The result is a two-track
  inheritance across theory change: the formal core is transmitted, and the ontology
  is not.


  The case that keeps coming to mind is light. The nineteenth-century wave theory
  of light treated light as a wave in a medium; its equations were strikingly successful;
  and when a later theory arrived, the equations survived while the medium did not.
  But I think I keep seeing a more general shape: the equations for motion surviving
  while what "mass" or "force" is gets re-described, and similar cases in thermodynamics
  or elsewhere. Let me be clear that I do not just mean ordinary approximate reduction,
  where a newer theory explains why the older one worked. I mean the specific combination
  of two facts: the old theory''s predictive and mathematical content is retained,
  while the things the old theory said existed are not.


  So my questions are the following. Does this specific two-track pattern have a name
  of its own, or is it just an instance of some larger idea? Whatever the nearest
  concept is, I want to know how the pattern should be described relative to it, and
  I will not be satisfied with a bare label. And what is the pattern usually taken
  to show? On the one hand, the survival of the equations looks like evidence that
  we are tracking something real; on the other, the repeated failure of the ontology
  looks like evidence that we should expect today''s entities to go the way of the
  light-bearing medium. How does this pattern bear on the argument that the history
  of past theory-changes gives us reason to expect our current successful theories
  to be replaced, and on the competing claim that the success of science would be
  a miracle if our theories were not somehow on the right track?


