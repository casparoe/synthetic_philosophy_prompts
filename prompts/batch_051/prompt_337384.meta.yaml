  Im in a seminar on the history of play and leisure, and we spent the term on Huizinga
  and Pieper. The last session is mine to close, and I wanted to do something less
  predictable than a summary. Could you write a sestina about play and leisure as
  ends in themselves? I dont want a poem that turns them into self-care or a productivity
  hack — the poem should be an instance of the idea, not an ad for it.


