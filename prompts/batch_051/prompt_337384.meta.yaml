  order: work, time, free, rule, end, play. Then rotate them the standard sestina
  way, with the envoi using all six the way a sestina envoi does. The form should
  do the philosophical work. The same six words coming back in a new order each stanza
  should feel like what Huizinga means about play being rule-bound and free at once,
  set apart from ordinary life (his magic-circle idea) and serious even while being
  just a game. Pieper should be there too: leisure as a kind of receptive stillness,
  not a pause that exists to get you back to work. And the envoi shouldn''t resolve
  into a takeaway; it should end the way a thing done for its own sake ends, still
  rather than useful. Make it a real poem first, not versified lecture notes. Someone
  who knows the two authors should be able to see where the poem is Huizinga, where
  it''s Pieper, and where it''s the speaker''s own turn, and someone who doesn''t
