  Let me detail sources of difficulty with mutation:


  1. Aliasing: two names/references point to the same mutable cell, so a change through
  one is visible through another; reasoning must track who shares state.

  2. Temporal coupling / order dependence: the meaning of an expression or the correctness
  of a step depends on what has been executed before and interleaving of operations.

  3. Non-local side effects: a function can alter state far from its call site, breaking
  modular/denotational reasoning.

  4. Loss of referential transparency: an expression can''t be replaced by its value
  without changing program behavior, so equational reasoning fails.

  5. Frame problem (programming sense): to know what a mutation changes, one must
  specify what does NOT change; default persistence of everything else.

  6. Identity vs. value confusion: == means different things (structural equality
  vs reference identity); objects with same value but distinct identity behave differently
  under mutation.

  7. Concurrency/race conditions: interleavings multiply state histories.


