  value, so equational and algebraic reasoning break down.

  (5) The frame problem: to know what a mutation changes you must know what it leaves
  unchanged, yet persistence by default is rarely made explicit.

  (6) Identity-vs-value ambiguity: equality becomes ambiguous between structural sameness
  and same-object identity, and the two come apart only in the presence of mutation.

  (7) Concurrency: interleavings multiply the histories of state, making the space
  of executions explode.


