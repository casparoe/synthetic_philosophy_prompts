  I run a small film-and-philosophy discussion group — none of us has any academic
  training in philosophy, though a few of us have been reading around on our own —
  and we have reached a disagreement we cannot settle. After watching Arrival, the
  2016 film based on Ted Chiang''s novella Story of Your Life, the group split over
  what the film is actually claiming about the relationship between language and thought.
  The film appears to assert that learning the heptapods'' written language — the
  circular logograms in which a whole statement is inscribed at once, with no beginning
  or end — changes Louise''s mind so profoundly that she begins to experience time
  as the heptapods do, not as a sequence but as a whole. That looks like a strong
  version of the claim that the language one learns reshapes one''s thinking.


  But several of us have, independently, been reading about the language of thought
  hypothesis: the view that thinking happens in an internal, pre-linguistic system
  of mental representations — sometimes called Mentalese — that is already in place
  before any natural language is learned; that learning a spoken language is really
  a matter of translating between this private code and a public one; and that a first
  language could not be learned at all if one had to think in that language in order
  to learn it, since the learner would already need the concepts the language is supposed
  to teach. On that view, Louise could acquire Heptapod B only if she already possessed
  the underlying concepts — for instance, a tenseless or simultaneous way of taking
  in events — and the alien script could at most give her a new notation, a new habit
  of attention, or a new public code for thoughts she was already capable of having.
  Yet the film treats the language as doing genuine cognitive work, not merely relabeling
  old thoughts.


