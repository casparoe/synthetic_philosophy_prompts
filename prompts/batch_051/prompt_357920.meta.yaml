  Hofstadter''s superrationality is meant to address the PD: a rational player should
  cooperate by recognizing that the other player will duplicate their reasoning. He
  argues that standard game theory''s assumption of independence between choices is
  wrong when players are symmetric: you should reason from the standpoint of "what
  is best for all people in my situation." Superrationality can be modeled as correlated
  equilibrium? Some argue it''s assuming the players'' actions are correlated without
  a mechanism, i.e., it conflates evidential and causal reasoning. It''s connected
  to Newcomb''s problem: one-boxers? Actually Hofstadter''s superrationality shares
  with evidential decision theory the idea of choosing as if your choice is evidence
  about the other''s choice. But it differs: EDT is about evidence, superrationality
  about identical reasoning and symmetry, "if I cooperate, she''ll cooperate" not
  because of causal influence but because of shared rational deliberation.


  Potential subtle misrepresentations for summary:

  - "Superrationality is the view that in a one-shot prisoner''s dilemma you should
  cooperate because your decision causes the other person to make the same decision."
  This is wrong: it doesn''t causally influence; it''s because the other''s decision
  is correlated via identical reasoning. Common misstatement: treating it as causal/telepathy.

  - "Superrationality just says you should always play the strategy that would be
  best if everyone played it (Kantian universalization)." That''s an overstatement;
  it applies to symmetric situations and identical reasoning, not every game with
  many players; universalizability (act only on maxims you can will as universal law)
  has differences. Also it''s not "always cooperate" in all games; it selects the
  symmetric outcome with highest payoff.

  - "Since superrationality assumes your choice is perfectly correlated with the other''s,
  it cannot handle asymmetries or mixed strategies." Maybe partially true.

  - "Superrationality refutes standard game theory by showing rational players never
  defect in the PD." Overstatement, controversial.


  A plausible summary from a blog: "Superrationality, due to Hofstadter, says the
  orthodox game-theoretic analysis of the Prisoner''s Dilemma is wrong. In a one-shot
  PD between two equally rational people, the ''rational'' solution isn''t mutual
  defection but mutual cooperation. The reasoning: since both players have exactly
  the same situation and exactly the same reasoning abilities, whatever one concludes
  the other will conclude too. So if you choose to cooperate, you can infer the other
  will cooperate as well; your choice doesn''t just reveal what she''ll do — it effectively
  selects a symmetric outcome for both of you. Defection''s dominance argument assumes
  your move and hers are independent, but that independence is an artifact. Thus a
  rational person should cooperate, and someone who defects is just failing to see
  that their action amounts to choosing mutual defection for everyone in their position.
  Some people object that this is magical thinking — that choices don''t cause other
  choices — but the superrationalist replies that correlation without causation is
  enough." This summary is mostly right but has subtle issues:

  1. "whatever one concludes the other will conclude too" overstates — assumes identical
  reasoning products, perfect symmetry, common knowledge; if they''re equally rational
  but have different information or one makes an error, correlation is not perfect.

  2. "your choice doesn''t just reveal what she''ll do—it effectively selects a symmetric
  outcome for both" conflates evidential and causal selection; might be okay but overstates.

  3. "someone who defects is failing to see that their action amounts to choosing
  mutual defection for everyone in their position" — this is roughly Hofstadter''s
  line, not wrong.

  4. "correlation without causation is enough" — may be subtly wrong: correlation
  without causation plus the right conditional probabilities might be enough for EDT,
  but superrationality typically needs something stronger, e.g., that you and she
  are in symmetric situations implementing the same rational procedure. Also the correlation
  has to be stipulated; "correlation without causation is enough" is not enough to
  ground the choice if the correlation isn''t the right kind. Maybe.


