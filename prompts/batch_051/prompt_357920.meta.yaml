  Let me reconstruct carefully. Milgrom and Stokey (1982), "Information, trade, and
  common knowledge," Journal of Economic Theory. Theorem: In an exchange economy with
  rational expectation, if the initial allocation is ex ante Pareto optimal, then
  there is no trade that is common knowledge to be ex post Pareto improving? More
  loosely: When all traders share a common prior and are rational, no trade occurs
  if the only motive is differential information; prices aggregate/reveal information
  so that rational traders can''t agree to speculate. The result is formalized as:
  If two agents share a common prior and their willingness to trade reveals their
  private information, then the union of their information sets would make them realize
  that one party is worse off. The conclusion: with common priors, speculative trade
  requires irrationality, different priors, or non-common knowledge.


  A popular summary might say: "The no-trade theorem says rational people with different
  information should never trade. Suppose Alice wants to sell a stock and Bob wants
