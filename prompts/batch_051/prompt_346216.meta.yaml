  Prompt domain: Collective guilt across generations: can a nation be guilty? (Jaspers).
  Type: Analyze real historical episode through lens of theory.


  Possible prompt:


  "You are a political philosopher specializing in theories of collective responsibility
  and transitional justice. I want you to work through a careful case analysis, not
  a survey.


  Karl Jaspers, writing in the immediate aftermath of the Second World War, distinguished
  several registers of guilt in connection with the crimes of the Nazi period. One
  crude but still common reconstruction goes something like this: criminal guilt attaches
  to individuals for acts that violate law and is for courts; political guilt attaches
  to citizens of a state for the deeds of that state and is for the victors or the
  international community; moral guilt attaches to individuals for wrongs they personally
  commit or fail to resist and is for conscience; and metaphysical guilt attaches
  to anyone who remained alive while others were murdered and is for no human tribunal.
  The last category in particular has always been controversial.


  Take as the historical episode the post-1945 treatment of ordinary German citizens
  by the Allied occupation authorities and the early West German state: the denazification
  questionnaires, the early war crimes trials, the widespread public attitude that
  Germans themselves were victims, and the slow emergence of the language of collective
  shame rather than collective guilt. Using Jaspers''s distinctions, give me a disciplined
  analysis of this episode in both directions. First, what would Jaspers''s framework
  predict or prescribe about who was entitled to judge whom, what verdicts different
  groups of Germans fell under, and why the distinction between political and moral
  guilt mattered for the legitimacy of denazification? Second, where does the episode
  fit the framework naturally, and where does it strain it—for example, in the position
  of Germans who were children, refugees, or beneficiaries of stolen property but
  not direct perpetrators, or in the way public discourse shifted from guilt to shame?
  Finally, what does this case show about the theory: does it reveal a missing category,
  an unstable boundary, or a practical advantage of keeping registers of guilt apart?


  I''d like you to think carefully and begin with a brief brainstorming sketch of
  possible mappings before writing the full analysis. Don''t treat the reconstruction
  of Jaspers above as authoritative if you know a more precise version, but keep the
  focus on the conceptual mapping rather than exegetical correctness. Also be explicit
  where you think the framework is silent rather than forcing it to answer."


