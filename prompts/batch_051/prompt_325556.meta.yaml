  Scanlon''s contractualism (from What We Owe to Each Other, 1998): An act is wrong
  if its performance under the circumstances would be disallowed by any set of principles
  for the general regulation of behavior that no one could reasonably reject as a
  basis for informed, unforced general agreement. The individualist restriction: in
  deciding whether a principle is reasonably rejectable, we compare the reasons of
  individuals; you cannot appeal to the sum of many individuals'' reasons. Thus, when
  one person would bear a huge burden and many people would each bear small burdens,
  the principle permitting the institution may not be justified by adding up the small
  burdens so they outweigh the one large burden. Scanlon''s example: a principle that
  allows taking a person''s body... he discusses a case: should we allow a person
