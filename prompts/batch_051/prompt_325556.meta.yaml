  number is permissible and required, because each person has an equal claim, and
  a principle that directs us to save the greater number is not one that any person
  could reasonably reject (it gives each equal chance ex ante).

  - But he denies that many small harms can aggregate to justify serious harm to one:
  e.g., a principle permitting us to impose severe pain on one person to prevent many
  people from having mild headaches is not justifiable because the person with severe
  pain could reasonably reject it, since we can''t sum the separate reasons of the
  many.

