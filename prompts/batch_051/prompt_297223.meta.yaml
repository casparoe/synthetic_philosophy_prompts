  ---


  I am taking a course in philosophy of criminal law, and my term paper defends a
  position about the void-for-vagueness doctrine. The doctrine is usually presented
  as having two separate requirements: a criminal statute must give potential offenders
  fair notice of what it prohibits, and it must not invite arbitrary or discriminatory
  enforcement by leaving too much discretion to police, prosecutors, and judges. I
  want to defend the view that these are not two independent requirements at all.
  My claim is that there is really a single requirement: a criminal statute must supply
  standards usable by the people it governs and by the officials who enforce it. Failures
  of fair notice and risks of arbitrary enforcement are, on my view, only two symptoms
  of that one underlying defect, so nothing is lost by collapsing the two prongs into
  one.


  I know this view stands against the way the doctrine is usually framed, and I worry
  that I may have made it unfalsifiable. So my question is not whether you agree,
  but what would count against it. What would have to be true for the standard two-pronged
  reading to be right and my one-requirement reading wrong? Which observations about
  the doctrine, hypothetical statutes, or empirical findings would be decisive rather
  than merely awkward, and where does my view risk nothing at all? I would find it
  most persuasive to be shown a case, real or constructed, in which the two prongs
  come apart: a statute that plainly satisfies fair notice but plainly invites arbitrary
  enforcement, or one that guides officials precisely but leaves citizens unable to
  tell what is forbidden. I would also want to know whether my notion of usable standards
  is doing so much work that no pattern of decisions could embarrass it, and whether
  that is a defect in my position or something one should expect of any account of
  vagueness.


