  "I cover the science of consciousness, and I have been trying to work out whether
  one of the classic arguments in the field has been quietly overtaken by a change
  in the way the field collects its evidence.


  The classic argument concerns the colour phi phenomenon: if a red spot is flashed
  and then, after a short interval, a green spot is flashed nearby, observers report
  a single spot that appears to move and change colour in between. Because the colour
  change is apparently represented before the second flash could be processed, two
  rival stories suggest themselves. In the Orwellian story, the subject first has
  a conscious experience of the red spot alone, and the arrival of the green spot
  causes the record of what was experienced to be revised after the fact — memory
  is rewritten, as it were. In the Stalinesque story, consciousness is held up until
  all the relevant information has arrived, and the subject is then presented with
  a single, already edited episode; there was never a conscious red-only state to
  be revised. The standard philosophical argument, made most forcefully by Daniel
  Dennett, is that no experiment could ever decide between these two stories, because
  both are constructed to produce exactly the same retrospective report. Any evidence
  that seems to favour one can be redescribed as evidence the other story would also
  produce, once one abandons the idea that consciousness occurs at a single, privileged
  time and place in the brain. The distinction, on this view, is not a real distinction
  that evidence could ever settle; it is an artefact of a bad model of the mind.


  Now the development. Over the past couple of decades, consciousness science has
  increasingly tried to measure whether and when a stimulus is seen without asking
  subjects to say anything after the fact — so-called no-report paradigms, which use
  behavioural proxies such as eye movements or pupil changes, or neural decoding,
  to track the unfolding representation of a stimulus on a single trial. The motivation
  is precisely that retrospective spoken report confuses perception with memory, decision,
  and motor output, and may give the brain room to revise what it records. These methods
  seem to promise something the Orwellian/Stalinesque debate was said to lack: a real-time,
  trial-by-trial trace of the representational trajectory of a stimulus, independent
  of the subject''s later story about it.


  My question is whether the Dennett-style argument survives this change in method.
  Which premise, exactly, is under pressure? Is there a version of the argument that
  remains intact if one grants that no-report measures do what their champions claim,
  and a version that must be abandoned? And does the development make the Orwellian
  and Stalinesque stories empirically separable after all, or does it merely relocate
  the philosophical difficulty from report to the interpretation of the no-report
  signal? I am trying to write a piece about this, and I want an analysis I can rely
  on: not a survey of the literature, but a judgement about what the argument becomes
  once report is no longer the only witness."


