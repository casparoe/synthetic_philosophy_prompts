  Two-envelope paradox setup: There are two envelopes; one contains twice as much
  money as the other. You''re offered one envelope at random. You open it? Or not.
  The switching argument: Suppose you find amount A in your envelope. The other contains
  either 2A or A/2. If you assume each possibility is equally likely, expected value
  of switching = (1/2)(2A) + (1/2)(A/2) = 1.25A. Since this is greater than A, you
  should switch. But the same reasoning applies to the other envelope before opening,
  so by symmetry neither can be better; and even after opening, the symmetry? Actually
  after opening A, the other is equally likely 2A or A/2? This depends on prior; with
  an infinite uniform prior the conditional probabilities are 1/2 each but no proper
  distribution. The paradox: switching seems always profitable, yet from the outside
  the envelopes are symmetric.


  Desiderata for a resolution:

  - It must locate the exact step where the standard switching argument goes wrong,
  not merely say "the reasoning is faulty."

  - It must explain why the argument is seductive, i.e., account for the apparent
  symmetry/equally-likely step.

  - It must respect the actual symmetry of the unopened-envelope choice: if both envelopes
  are symmetric and you have no information distinguishing them, switching cannot
  have positive expected gain unconditionally.

  - It must handle the variants: (a) does opening the envelope give you information
  that rationally justifies switching? In the finite case, some states making switching
  rationally based on amount? Actually under a proper prior with finite expectation,
  the expected gain of switching conditional on observed amount can be positive for
  some values and negative for others, but unconditional expected gain is zero. (b)
  variants with an infinite prior / no finite mean, where unconditional expected gain
  may be undefined or infinite and the "always switch" can be consistent.

  - It must say what is assumed about the distribution of amounts. There is no uniform
  distribution over positive reals; so any resolution must specify prior or explain
  why not needed.

