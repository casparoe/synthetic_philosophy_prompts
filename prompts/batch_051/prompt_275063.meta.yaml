  Treat presentism as a hypothesis I have adopted and ask what would count against
  it. For each serious challenge — physical, metaphysical, semantic, or phenomenological
  — I want to know:


  (a) exactly what would have to be true for the challenge to land, stated as a premise
  a presentist must accept or reject;

  (b) whether a careful presentist would in fact concede that premise, and in what
  form;

  (c) how severe the challenge is if the premise is granted — fatal, seriously damaging,
  merely awkward, or dismissible;

  (d) the strongest presentist reply available, and whether it defuses the challenge,
  merely relocates it, or leaves it standing.


  I know enough physics to expect that the relativity of simultaneity, and the argument
  associated with Rietdijk and Putnam, is where presentism is said to be in most trouble;
  give that its due, but do not let it crowd out other considerations, and rank everything
  by how much it should actually move me. I would also like to know which alleged
  problems a committed presentist should not lose sleep over, and why.


