  and that what exists is confined to an advancing "now." My reasons are partly experiential
  — time, as I live it, passes — and partly conceptual: I cannot yet see how a tenseless
  four-dimensional block can account for the difference between what is settled and
  what is still open, or for why deliberation feels the way it does.


