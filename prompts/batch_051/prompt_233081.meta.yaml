  Let me craft the Buddhist argument carefully so the diagnosis is subtle but real.


  Standard early Buddhist view: the self (atta) is not found in the five aggregates;
  the person is a conventional designation (paññatti) over the aggregates, which are
  causally continuous. Rebirth happens through causal continuity, not a persisting
  substance. So moral responsibility doesn''t require strict personal identity of
  the same substance; it requires causal-psychological continuity plus perhaps the
  conventions of identity. The argument fails at step 4: from "no self" to "no person
  persists." The term "self" in premise (1) and (3) means a permanent, unchanging
  substantial self. Step 4 uses "self" to mean the ordinary persisting person. So
  it''s an equivocation between the metaphysical self that Buddhism denies and the
  conventional person that Buddhism retains. Alternatively step 1 fails: it presupposes
  the only candidate for a person is a permanent self; it doesn''t follow that no
  permanent self = no person, because a person could be a causally continuous series.


  I can make the argument''s steps individually plausible by having step 4 seem to
  unpack "no self" to "no person/one persists." The failure is in moving from the
  denial of a permanent self to the denial of any persisting being, i.e., conflating
  self-as-substance with self-as-continuing-subject. That''s the key.


