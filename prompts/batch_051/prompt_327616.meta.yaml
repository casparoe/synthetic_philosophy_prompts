  For a long time I''ve followed the debate about whether quantum indeterminacy can
  do any work for free will, and it seems stuck in a pattern I can describe precisely.
  The libertarian side needs an open future: if determinism is true, there is no alternative
  possibility, and (they say) no ultimate sourcehood. Quantum mechanics looks like
  the natural ally, because it shows that the world is not deterministic at the microlevel;
  if decision-relevant neural events are sensitive to quantum events, then there are
  macroscopic forks in the agent''s own history. The other side — mostly compatibilists
  and hard incompatibilists — replies that this is precisely the wrong kind of openness.
  Quantum randomness, they say, is noise: a chancy event is no more within the agent''s
  control than a caused event, and it is certainly not something the agent can claim
  as their own doing. Making my choice probabilistic does not make it mine.


  The libertarian response has, as far as I can tell, two main forms. The event-causal
  form concedes that indeterminism entering arbitrarily into a decision would be a
  problem, but argues that indeterminism need only appear at special junctures — moments
  of inner conflict when an agent is genuinely torn between two incommensurable motives.
  There, an effort of will is indeterminate in outcome, and whichever outcome occurs
  is one the agent endorsed under conditions of inner tension, so the choice is not
  random with respect to the agent''s reasons, and the agent genuinely could have
  chosen otherwise. The agent-causal form says the agent as a substance, rather than
  any event, causes the decision; indeterminism is simply the condition under which
  the agent has more than one alternative to choose, not a cause that competes with
  the agent.


  The critics answer that the event-causal version merely relocates the luck problem.
  Suppose two worlds share the identical past, the identical laws, and the identical
  reasons, motives, and effort of will, but in one the agent chooses A and in the
  other B. Then the difference between those worlds is not attributable to anything
  about the agent — reasons, character, or effort — and there is no answer to the
  question of why A rather than B occurred. Calling the choice "indeterministic" seems
  to name the problem, not solve it. In some moods, the critics add that quantum mechanics
  makes things worse: the probabilities of quantum outcomes are law-governed and wholly
  insensitive to the agent''s reasons, so hitching free will to quantum events adds
  a patina of physics without adding control. The agent-causal version, they say,
  is either unintelligible or collapses back into event-causation once you ask how
