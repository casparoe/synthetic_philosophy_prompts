  The debate: Libertarians about free will need indeterminism to secure alternative
  possibilities (the ability to do otherwise) and/or ultimate sourcehood. Some libertarians
  point to quantum indeterminacy as the physical locus of this indeterminism: if the
  brain''s decision processes are sensitive to quantum events, then the future is
  not fixed by the past plus laws, so there''s room for genuine alternatives. Critics
  (compatibilists and hard incompatibilists) respond that quantum randomness is just
  noise — introducing a probabilistic or chancy element into deliberation can''t turn
  an event into a free action; at best it gives you luck, at worst it means the agent
  doesn''t fully determine their own choice, which undermines control, not grounds
  it. Libertarians reply in roughly two ways: (a) event-causal libertarians say indeterminism
  need only be present at the right junctures, e.g., in "efforts of will" when an
  agent is torn between competing motives, and the agent endorses whichever outcome
  occurs, so the choice is not random relative to the agent''s reasons; (b) agent-causal
  libertarians say the agent as a substance, not an event, causes the decision, and
  indeterminism is a condition of the agent''s having genuine alternatives without
  making the agent''s causing itself chancy. Critics then say (a) just relocates the
  luck problem — if the same past, laws, and reasons lead to either choice with a
  given probability, the difference between worlds where the agent chooses A and worlds
  where they choose B is not attributable to the agent''s reasons or character, and
  the agent could never explain why A rather than B; and (b) is either mysterious
  (a non-event cause standing outside the causal order) or collapses into event-causation
  once analyzed. Quantum mechanics, the critics add, inherits all the old problems:
  the probability of a quantum event is law-governed and not under the agent''s control,
  so appealing to it adds nothing to the freedom problem except a false gloss of scientific
  respectability. Libertarians respond that this criticism assumes a "determinist-friendly"
  standard of explanation (that a free choice must be intelligible as fully produced
  by reasons-plus-character) and that any indeterministic theory will fail by that
  standard; but that standard, they say, already presupposes that freedom must be
  a kind of determination, which is exactly what''s in question.


