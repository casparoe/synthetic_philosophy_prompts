  Draft:


  I am a PhD student working on formal approaches to animal welfare, and I keep coming
  back to the "scale argument" for taking insect suffering seriously. In its usual
  presentation, the argument runs as an expected-value calculation: even if the probability
  p that an individual insect is sentient is low — say, on the order of one percent
  or less — the number of insects is so vast (on the order of 10^18, possibly more)
  that the expected number of sentient individuals, n·p, is enormous, and therefore
  the expected moral stakes of practices like insect farming or pesticide use are
  enormous. The reasoning is normally stated as though the n individuals were n independent
  draws from a sentience lottery: each one gets its own small chance of mattering,
  and those chances add up.


  The variation I want to work through concerns exactly that independence assumption.
  Suppose the real structure of the uncertainty is this: there is a single, shared
  unknown C — roughly, the proposition that the kind of nervous-system architecture
  characteristic of insects (or some large taxon of insects) is the sort of process
  that can realize pain, or that some particular theory of consciousness on which
  they qualify is true. Conditional on C, sentience for all (or nearly all) members
  of the taxon is near-certain; conditional on not-C, none of them are sentient. Formally,
  instead of independent Bernoulli(p) draws for each individual, we have a mixture:
  with probability q the shared condition C holds and the per-individual probability
  jumps to something close to 1; with probability 1−q it fails and the probability
  is near 0. If we choose q so that the unconditional per-individual probability is
  still p (that is, so that q times the conditional probability equals p), then by
  linearity of expectation the expected number of sentient insects is exactly the
  same as in the independent model — n·p. So the headline number is unchanged.


  What I want to understand is whether the argument itself is unchanged. In the correlated
  model the uncertainty is not pooled across many independent risks; it is a single,
  all-or-nothing bet on C whose payoff merely gets multiplied by n. That looks structurally
  like a Pascal''s-mugging, or at least like a gamble with enormous variance rather
  than a near-certain aggregate. I would like a careful treatment of the following.
  First, spell out precisely where the two models diverge in their implications, given
  that they agree on expected sentient count (variance, higher moments, value of information,
  risk attitudes, diminishing marginal value, moral uncertainty about the badness
  of insect pain). Second, work through whether the scale argument''s practical conclusion
  — that insect welfare should be a major priority — survives under the correlated
  model, and under what decision rules it does or does not. Third, consider a partially
  correlated model, in which a common latent component explains only part of the per-individual
  uncertainty and there is residual independent noise: at what degree of residual
  independence does the original "pooling" intuition recover, and does the correlated
  version instead favor investing in resolving C (through neurobiological or behavioral
  work) before spending resources on directly reducing harms?


