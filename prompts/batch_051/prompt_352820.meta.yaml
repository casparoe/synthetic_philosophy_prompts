  I''m a PhD student working at the intersection of animal welfare science and formal
  epistemology, and I''ve been picking at the "scale argument" for insect welfare.
  As I understand it (and as it''s usually run), the argument is: grant that the probability
  that an individual insect is sentient is low — say, well under one percent. Even
  so, the number of insects is so large (on the order of 10^18, with several orders
  of magnitude of uncertainty either way) that the expected number of sentient organisms
  is enormous, so the expected moral stakes of, e.g., insect farming or pesticide
  use are enormous. So far so good as an expected-value calculation.


  The variation I want to work through is this: the standard version treats the probability
  as if it were an independent, per-individual lottery over and over — each insect
  has its own small chance of being the kind of thing that feels, so the expected
  number of sentient insects is just n·p. But that is not, I think, the actual structure
  of the uncertainty. If the question is whether insect nervous systems have whatever
  property makes states like pain possible, then the uncertainty is largely a single,
  shared, all-or-nothing unknown: either the common architecture shared by, say, a
  whole order of insects supports sentience, or it doesn''t; either the relevant theory
  of consciousness is true, or it isn''t. In that case the many individuals are not
  independent draws from a sentience lottery; they are all bets on the same underlying
  fact, and multiplying by n just inflates the stakes of one bet rather than pooling
  many independent risks.


  So my question is how the analysis changes when the independence assumption is removed.
  One can model the correlated case as a single Bernoulli ''sentience is possible
  in this architecture'' with probability q, and conditional on it, sentience is near-certain
  (or still per-individual but with a much higher probability). Work through the expected-value
  calculation under the correlated model: does the scale argument still go through,
  with the same practical upshot (that insect welfare should dominate, or at least
  be a major priority), or does it now start to look like a Pascal''s-mugging — a
  bet on one speculative fact whose enormous payoff rides on correlation rather than
  independent evidence? At what degree of residual per-individual independence does
  the argument recover? And does the correlated version engage different principles
  (risk aversion toward collective bets, moral uncertainty, the value of resolving
  the common unknown by neurobiological work) than the independent version?


