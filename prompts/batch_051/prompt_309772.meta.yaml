  Prompt: "In the preface to his first book, Ranke said that the task he set himself
  was not to judge the past or to instruct the present, but simply to show what actually
  happened. For Ranke this is the regulative ideal of historical objectivity: a historian
  who works from primary sources, suppresses his own preferences, and lets the documents
  speak can converge on the past as it really was. Later critics such as E. H. Carr
  and Hayden White claimed that this ideal rests on a confusion: the historian inevitably
  selects, arranges, and emplots the surviving traces; the resulting narrative is
  a construction, not a discovery. I want to know whether anything in this dispute
  can be brought under empirical discipline. Suppose one treats Ranke''s claim not
  as a metaphysical thesis about a ready-made past but as a comparative claim about
  historical method: that, given enough shared primary sources, independent historians
  from different backgrounds will converge on the same account of a bounded episode—not
  merely on the same dates and names, but on the same causal structure. Design the
  best possible test of that comparative claim. Specify the episode or class of episodes
  you would use, the historians or coders you would compare, the controls you would
  impose on source access and background commitments, and the measure of convergence
  you would use. Then say what a high degree of convergence would show, what it would
  leave untouched about White''s deeper claim that even a converged narrative is one
  possible emplotment among others, and whether a failure of convergence would refute
  Ranke''s ideal or only show that the method was not yet Rankean enough."


