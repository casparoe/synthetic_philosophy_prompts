  Jeffrey conditionalization: updating on uncertain evidence where the direct effect
  is a change in probabilities over a partition {E_i}; for any proposition A, P_new(A)
  = sum_i P_old(A | E_i) P_new(E_i). Rigidity: P_old(A | E_i) = P_new(A | E_i) for
  all A and partition elements. This captures learning that shifts probabilities of
  partition elements without making any element certain.


