  to cases where experience does not make any proposition certain but instead redistributes
  probability across the cells of a partition. I specify a partition, take my new
  probabilities for its cells as the input delivered by the evidence, and then reweight
  each cell of my prior by those new probabilities while holding fixed my prior probabilities
  conditional on each cell. The attraction is that this is the greatest generalization
  of ordinary conditioning that keeps the update fully mechanical: once the partition
  and its new weights are specified, every other credence is determined, with no further
  judgment required about how the evidence should propagate.


