  Let me formulate:


  "I''ve been working through the foundations of Bayesian epistemology, and I find
  myself pulled in two directions about how to update on uncertain evidence."


  Then present the theory: "The account I keep wanting to defend is Jeffrey conditionalization.
  It extends ordinary Bayesian conditioning to the case where you don''t learn any
  proposition with certainty; instead, an experience redistributes your credences
  over some partition of possibilities. The update rule says: fix a partition, take
  the new probabilities of its cells as given, and then reweight your prior conditional-on-each-cell
  probabilities by those new weights, holding the conditional probabilities rigid.
  Its appeal is that it''s the same operation as ordinary conditioning but generalized,
  and it gives a tidy, complete answer: once you have specified the partition and
  its new probabilities, there is nothing left to decide about how to update; all
  downstream changes are mechanical."


  Then the intuition: "But I also have a firm intuition that uncertain evidence carries
  more structure than this. Suppose two different experiences each raise my credence
  that a sample is toxic from 0.2 to 0.7—one because a noisy but well-understood chemical
  sensor flashed positive, the other because I caught a glimpse of a complicated readout
  that I barely understood. I want to say my posterior in the two cases should differ,
  not merely because my credences over the partition differ, but because the evidence
  bears on the proposition in different ways—the first licenses different changes
  to my beliefs about related chemicals and the sensor''s reliability than the second
  does, even when my probabilities over the partition cells come out the same. Jeffrey
  conditionalization, with its rigidity requirement, seems to insist it couldn''t
  matter how the shift arrived; only the new distribution over the partition and the
  old conditional probabilities matter. That strikes me as leaving something evidential
  out."


  Then the question: "I''m not sure which should yield. The theory has elegance; the
  intuition is persistent. Present the strongest case for each side and give me a
  negotiated verdict: are there conditions under which the intuition should be debunked
  as a confusion between the choice of partition and the update rule itself, conditions
  under which the theory should be amended (e.g., by allowing non-rigid updates or
  by insisting that the partition must be fine enough to encode the evidence''s provenance),
  and is there a reading of ''uncertain evidence'' on which Jeffrey conditionalization
  survives and the intuition is also respected? Explain what would justify each move
  rather than just declaring a winner."


