  Let''s think about the philosophical content to make the prompt in the weeds.


  The habit: the asker has a policy about when to count an existence claim as established.
  Two distinct epistemic states:

  - Full belief / grounded acceptance: there is an object; you could in principle
  name/approximate it.

  - Mere consistency acceptance: the claim is consistent with the axioms; the system
  continues to work; but one does not take it to describe an actual object.


  This is essentially Hilbert''s ideal elements / finitary consistency vs Brouwer''s
  constructivism. But the asker doesn''t demand a formal philosophy; just a policy.


  The puzzle: Is this policy defensible? On one hand, it tracks a real distinction:
  classical existence proofs can be utterly non-constructive (e.g., proof by contradiction
  from law of excluded middle; choice principles give non-measurable sets; Brouwer''s
  counterexamples? No). On the other hand, it may be a bias: refusing to update fully
  on valid mathematical proof because of a psychologically salient past failure. Also,
  even constructivist existence may not help if construction is computationally infeasible;
  and non-constructive existence can still license correct reasoning and predictions.
  The policy may conflate mathematical truth with possession of a method. It might
  be defensible locally (for computational/applied work) but not globally (as a view
  about mathematical reality).


  The three schools:

  - Intuitionism: mathematics is mental construction; existence = provable/constructible;
  law of excluded middle is not generally valid for infinite domains. The asker''s
  policy resembles intuitionism.

  - Logicism: mathematics is reducible to logic; mathematical existence is existence
  under logical definitions. A logicist might say your policy is fine pragmatically
  but it''s not about truth; if the theorem follows from logical laws plus definitions,
  the object exists in the logical sense, whether or not constructed.

  - Formalism: mathematics as manipulation of sign-systems according to rules; existence
  claims are meaningful only within the system; a formalist might say your policy
  is actually just choosing one formal system''s standard of proof over another, so
  defensible as a choice of which game to play.


