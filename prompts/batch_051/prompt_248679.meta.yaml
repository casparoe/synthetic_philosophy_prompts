  The tension: Popper sometimes presents falsifiability as the criterion that solves
  the demarcation problem (scientific vs. non-scientific), and his criticisms of Marxism
  and psychoanalysis imply these are objectively not science because they dodge falsification.
  That suggests the criterion tracks a fact about the world''s theories. But he also
  says the criterion is a proposal, a convention adopted freely, and that it cannot
  be logically or factually justified — demarcation is a matter of decision, not discovery.
  The tension: is "Einstein is science and astrology isn''t" a discovery or a stipulation?


  Actually, Popper does say the criterion''s adoption is a convention, but he also
  believes the convention can be evaluated by its fruits (e.g., whether it best captures
  what scientists do/growth of knowledge). He calls his demarcation criterion "a proposal
  for an agreement or convention" but then says it is "fertile" and that others are
  "barren." So the reconciliation: proposal ≠ arbitrary; a convention can be better
  suited to an aim (the aim of empirical science), and Popper thinks it''s the only
  adequate one given that aim. But that aim itself is chosen. Then the question: if
  the aim is chosen, can he still call pseudoscience objectively inferior? Perhaps
  yes: given the aim of learning from experience, a theory that can''t be refuted
  gives us no information. Falsifiability is the logical property, and calling it
  "science" is conventional, but the epistemic value is not.


  Candidate reconciliations to ask about: (a) different questions conflated — "what
  is science" (convention about the word) vs. "which theories can be refuted by experience"
  (logical fact); (b) Popper changed his mind; (c) he means "proposal" not "arbitrary
  preference" but a proposal assessable by its consequences; (d) he''s equivocating
  between demarcation (conventional) and the growth of knowledge (not conventional).
  Ask for verdict on which is honest vs. special pleading.


