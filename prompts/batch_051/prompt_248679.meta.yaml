  Facts I know (and could verify by search if needed):

  - The Anthropocene is a proposed epoch or event in Earth''s history marking significant
  human impact.

  - The Anthropocene Working Group (AWG) of the Subcommission on Quaternary Stratigraphy
  (SQS) spent ~15 years evaluating candidates for a GSSP ("golden spike"). In 2023
  they proposed Crawford Lake, Ontario, with a ~1950 boundary marked by plutonium
  fallout from nuclear weapons testing.

  - In March 2024, the International Union of Geological Sciences (IUGS) / the International
  Commission on Stratigraphy (ICS) rejected the proposal to formalize the Anthropocene
  as an epoch. Several objections: an epoch is usually millions of years; the Anthropocene
  signal is too thin, too diachronous, too human-defined; better to classify it as
  an "event" (like the Great Oxidation Event) or as a cultural term.

  - The AWG voted ~2016 to treat it as a chronostratigraphic unit with a mid-20th-century
  boundary.

  - Alternative start dates proposed: early agriculture (~8,000 BP, Ruddiman hypothesis),
  Industrial Revolution (~1800, Crutzen''s original proposal), Great Acceleration
  (~1950), nuclear tests / "bomb spike."

  - Crutzen and Stoermer (2000) popularized "Anthropocene" and suggested late 18th
  century (Watt''s steam engine, 1784).

  - The "Great Acceleration" graphs (Steffen et al. 2004/2015) show post-WWII surge.


