  Adam Smith (1723–1790), Scottish philosopher/economist. The Theory of Moral Sentiments
  (1759). Key ideas:

  - Sympathy: our fellow-feeling with any passion whatever; arises from imagining
  ourselves in the situation of the person, not just seeing their emotion. "By the
  imagination we place ourselves in his situation..." (I won''t quote from memory
  — I can paraphrase.)

  - We judge the propriety or impropriety of another''s sentiments by whether we can
  sympathize with them — whether our own feelings correspond to theirs given the situation.

  - Sympathy is not just feeling the same emotion; it involves an awareness of the
  other''s feelings and a correspondence. We don''t literally enter their body.

  - The impartial spectator: to judge our own conduct, we imagine how an impartial,
  well-informed spectator would view us. The "man within the breast" is the internalized
  impartial spectator; conscience.

  - We seek not just praise but praiseworthiness — the approval of the impartial spectator,
  even if no actual person praises us.

  - The impartial spectator corrects the partiality of self-love; it can correct the
  actual spectator too (e.g., the applause of an ignorant mob vs the ideal spectator).

  - Smith distinguishes between the actual spectator and the impartial spectator;
  the impartial spectator is the ideal standard, "the great judge and arbiter of our
  conduct."

  - Sympathy is contagious; we moderate our passions to the pitch that an impartial
  spectator can go along with. This is the origin of self-command and virtue.

  - Smith also discusses the "man of system" vs the "man of humanity" in TMS — but
  less relevant.

  - Smith didn''t think the impartial spectator perfectly tracks others'' actual feelings;
  it''s a normative/idealized construct, though built from actual sympathetic exchanges.


