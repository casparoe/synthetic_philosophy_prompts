  "During my career in the natural sciences, I was trained to hold that a model which
  saves the phenomena need not represent the underlying mechanism: an equation can
  predict with great accuracy while its terms remain computational conveniences. Now
  that I am reading philosophy, I keep noticing that the debate over whether large
  language models understand language — the ''stochastic parrots'' charge — appears
  to reproduce, almost point for point, the old instrumentalism-versus-realism dispute
  about scientific theories. On one side, fluent output plus success on novel prompts
  is taken as evidence that the model has acquired something beyond surface statistics;
  on the other, predictive success is dismissed as exactly what one expects from a
  high-capacity curve fit to a vast corpus, with no license to posit understanding.
  The instrumentalist about science says the same about theories: their empirical
  adequacy does not license belief in unobservable entities or mechanisms. But my
  career also taught me that instrumentalism, however hygienic, is hard to live: we
  routinely treated successful models as carving nature at its joints.


  My question is whether this parallel is deep or superficial. Is the dispute about
  LLM understanding a genuine special case of the realism/instrumentalism dispute
  — so that arguments for scientific realism (the no-miracles argument, novel prediction,
  unification) and against it (underdetermination, pessimistic induction) transfer
  more or less directly to claims about LLM understanding? Or does the analogy break
  at some specific point? For instance, a scientific theory is usually not itself
  the object whose internal states we are trying to read; an LLM is an artifact whose
  training objective and parameters are fully known, which might mean the question
  is not ''should we believe in unobservables'' but ''what does understanding consist
  in when we can see the whole mechanism.'' Are those two questions different enough
  that the parallel misleads? I would like to know where the mapping holds, where
  it comes apart, and what a transfer of the realist''s standard arguments would predict
  about LLMs that is in fact false."


