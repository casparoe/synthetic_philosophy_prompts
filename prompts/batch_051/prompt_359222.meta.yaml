  of an epicycle model is evidence for the reality of epicycles. The defenders reply
  that when a system repeatedly succeeds on novel tasks that require compositional
  generalization, it would be a miracle of overfitting if it had not latched onto
  something real—which sounds remarkably like the no-miracles argument for scientific
  realism. This has made me wonder whether the two debates are, at bottom, the same
  debate with different nouns.


  I would like to know whether this parallel is deep or superficial. Here are some
