  "I am a PhD student in moral philosophy, and I am trying to determine whether my
  pattern of judgments about reasons commits me to moral particularism. For each case
  I give my verdict on whether a candidate consideration is a genuine reason, and
  I want to know what account of reasons — if any — captures the pattern.


  1. That an action would give a child pleasure is a reason to do it when the action
  is surprising a niece with a trip to the zoo, but I do not think it is a reason
  at all when the action is letting a sadist torment an animal for his enjoyment.

  2. That an action would cause pain is a reason against it when the pain is the bruise
  from shoving someone, but not when it is the momentary sting of a vaccination that
  prevents serious illness.

  3. That I made a promise is a reason to keep it even when keeping it is inconvenient;
  but I cannot convince myself it would be a reason if the promise were to help someone
  dispose of evidence of a crime. I also think that reason can be outweighed by a
  strong enough competing consideration.

  4. That an action would reveal something true seems to me a reason to do it only
  if the relevant audience has a right to the information; I do not think it is a
  reason when the information would ruin a reputation and is offered as dinner-party
  gossip.

  5. That an action would prevent embarrassment is sometimes a reason (withholding
  a friend''s medical details from a stranger) and sometimes not (withholding a colleague''s
  plagiarized passage from a hiring committee to save him face).


