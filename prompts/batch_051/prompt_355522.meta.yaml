  to know what principle, if any, they add up to.


  1. A friend asks me to meet for coffee at three; on the way I see someone collapse
  and I stop to give first aid, missing the meeting. I think I act rightly and owe
  an apology but not guilt.

  2. A friend asks me to meet for coffee; I skip it because I felt like staying home
  and watching a movie. I think that''s wrong.

  3. Causing physical pain to a child during a necessary vaccination: permissible.
  Causing the same amount of pain to a child as a punishment for spilling juice: wrong.

  4. Telling a lie to a colleague that their proposal is promising when I think it''s
  unpromising, to spare embarrassment in front of a group: I waver, but I lean wrong.
  Telling a lie to an intrusive stranger about my address: fine.

  5. Revealing a friend''s secret to prevent an innocent person from being seriously
  harmed: right. Revealing the same sort of secret to make conversation interesting
  at a party: wrong.

  6. I think the fact that an action would cause someone pleasure is normally a reason
  to do it, but the fact that an action would cause a sadist pleasure in someone else''s
  suffering is not just no reason — it''s a reason against. And I can''t see what
  makes the difference except the surrounding character of the act.


  The question: is there a unified principle that captures all of these, or close?
  Or is this pattern better explained by something like moral particularism, on which
  something can be a reason in one case and not in another without any deeper explanation?
  If you give me a principle, tell me which of my verdicts it forces me to drop; if
