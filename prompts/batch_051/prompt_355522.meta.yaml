  ---


  I am a PhD student in moral philosophy trying to figure out whether my judgments
  about reasons are best explained by a general principle or by moral particularism.
  Below are my verdicts about whether a given consideration is a reason in a concrete
  case, and I would like you to tell me what account of reasons, if any, captures
  them.


  1. That an act would give someone pleasure counts to me as a reason across very
  different cases — a child''s birthday outing, a colleague''s enjoyment of a well-earned
  break, my own satisfaction on a long run. But I do not think it is a reason at all
  when the act is allowing a sadist to enjoy another person''s humiliation.

  2. That an act would cause pain counts against it when the pain is the bruise left
  by shoving someone, but not when it is the brief sting of a vaccination that prevents
  serious illness.

  3. That I promised counts as a reason to do what I promised even when doing it is
  inconvenient; I also think the reason can be outweighed. But I cannot convince myself
  it would be a reason at all if the promise was to help someone destroy evidence
  of a crime.

  4. That an act would reveal something true is a reason to do it when the audience
  has a right to the information; it does not seem to me to be a reason when the disclosure
  would ruin a reputation and is offered as dinner-party gossip.

  5. That an act would prevent embarrassment is sometimes a reason, as when I refrain
  from mentioning a friend''s medical condition to a stranger, and sometimes not,
  as when I omit a colleague''s plagiarized passage from a hiring committee to spare
  his feelings.


  Is there a single, non-gerrymandered principle — for instance one that invokes enabling
  and disabling conditions — that yields all or nearly all of these verdicts, and
  what does it say about a case I have not settled: I am asked to break a trivial
  promise in order to help a neighbor finish a routine chore when no one else is available?
  Or do these verdicts push me toward particularism? If you give me a principle, tell
  me precisely what it is and which of my verdicts it forces me to drop. If you opt
  for particularism, tell me what the view says beyond the bare denial that such a
  principle exists.


