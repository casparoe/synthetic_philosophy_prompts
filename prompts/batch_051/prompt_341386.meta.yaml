  Consider the following claim about the Knobe effect. In the classic vignette, a
  chief executive officer pursues a policy that he knows will have a certain side
  effect, explicitly says he does not care at all about the side effect, and acts
  anyway. When the side effect is that the environment is harmed, most ordinary subjects
  say he brought the side effect about intentionally; when the side effect is that
  the environment is helped, most say he did not bring it about intentionally. Many
  experimental philosophers read this asymmetry as showing something about the ordinary
  concept of acting intentionally itself: its application is shaped by moral evaluation,
  and perhaps the concept has an evaluative or normative component built in, rather
  than being a purely descriptive matter of beliefs, desires, foresight, and control.
  Call this the moral-constitution reading.


  Your task is to design the strongest empirical test you can of that reading, under
  the constraint that the test must be something a psychologist or experimental philosopher
  could actually run with ordinary participants, vignettes, and behavioral measures.
  In particular, design a set of conditions that separates the moral-constitution
  reading from at least the following rivals:


  (1) the effect tracks the violation of a salient norm generally, including non-moral
  norms such as professional, aesthetic, or etiquette norms;

  (2) the effect tracks the undesirability or badness of the outcome, independent
  of any moral dimension;

  (3) the effect tracks atypicality or statistical surprise rather than evaluation;

  (4) the effect reflects a prior motive to blame or censure the agent, with the word
  "intentional" being recruited to license that censure, rather than reflecting the
  concept itself;

  (5) the effect is driven by differences in what participants infer about the agent''s
  foresight, knowledge, or control in morally bad versus good cases.


