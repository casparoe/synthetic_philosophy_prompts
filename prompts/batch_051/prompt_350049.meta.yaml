  Death in Damascus (from Gibbard & Harper? Actually the example is from Gibbard and
  Harper 1978, "Death in Damascus"): A man is in Damascus. He learns that Death is
  coming for him and has decided to meet him in one of two cities: Damascus or Aleppo.
  The man must choose which city to be in at a certain time. Death, being omniscient,
  has already predicted the man''s choice and gone to the chosen city. If the man
  chooses Damascus, Death is in Damascus; if Aleppo, Death is in Aleppo. So no matter
  what, he meets Death. The puzzle is about decision rules: evidential decision theory
  recommends staying? Looking at it: the man''s choice is evidence about where Death
  is, so no matter what he chooses, each choice looks bad. Actually the man prefers
  being where Death is not. Because Death''s location correlates perfectly with his
  choice, conditional on choosing Damascus, Death is in Damascus with prob 1, so expected
  utility of choosing Damascus is low; conditional on choosing Aleppo, Death is in
  Aleppo, low too. EDT is stuck in a best-response cycle: if he chooses Aleppo, Death
  (predicted Aleppo) is in Aleppo, so Damascus would have been better; if he chooses
  Damascus, Death is in Damascus, so Aleppo better. No pure strategy equilibrium.
  Causal decision theory says his choice doesn''t cause Death''s location (already
  fixed), so CDT can''t use the correlation; but he has no evidence about Death''s
  location independent of his choice. The puzzle is deeper: he cannot deliberate himself
  into a better outcome because the predictor has already matched his choice. It''s
  about the interaction between deliberation and prediction, and it demonstrates that
  EDT has no stable option when the state is determined by the prediction of the act.
  There''s also "Rich and Famous" and the literature on "the Smoking Lesion" as a
  contrast.


  Parallels: The structure "your choice determines the state in a way that makes every
  choice self-defeating" appears elsewhere:

