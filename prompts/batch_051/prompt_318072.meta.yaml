  (c) whether Nomic actually avoids the paradox or merely relocates it."


  Student answer: something like:


  "Suber''s point is that legal systems contain rules about how rules are made, and
  those rules can sometimes be changed by the very procedures they govern. Nomic models
  this by making every rule subject to amendment through the game''s own procedures
  — even the rules that specify how amendments work. The mutable/immutable distinction
  is meant to model the difference between statutory and constitutional rules: immutable
  rules are harder to amend and take priority over mutable ones in conflicts, just
  as constitutional rules are harder to amend than statutes and override them. Since
