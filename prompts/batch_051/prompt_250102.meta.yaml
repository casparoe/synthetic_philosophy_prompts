  Desiderata for a theory of truth. What must it do?


  Potential desiderata:

  1. It must classify the central cases correctly: "snow is white" is true iff snow
  is white; "snow is green" is false. Any theory must recover Tarski''s T-sentences
  as data, at least in ordinary cases. But be careful: not just disquotation.


  2. It must explain the semantic paradoxes rather than merely ban them: the Liar
  ("This sentence is false"), the Strengthened Liar ("This sentence is not true"),
  Curry ("If this sentence is true, then P"), Yablo''s paradox (infinite sequence
  of sentences each saying all later ones are false). A theory that simply forbids
  self-reference fails because of the empirical/syntactic versions and Yablo; and
  it must explain where the intuitive reasoning goes wrong.


  3. It must respect the function of truth in generalizations: "Everything the Pope
  says is true" — the role of truth as a device of infinite conjunction/quantification,
  and its role in semantics (truth conditions). Deflationism handles generalization
  but must show how.


  4. It must handle the truth-teller ("This sentence is true") and the notion of ungroundedness:
  sentences that can be stably assigned either truth value without contradiction.
  A theory should explain why they aren''t true in the usual sense, or explain what
  it means to be neither true nor false / indeterminate.


  5. It must respect the normativity of truth: assertion, belief, inquiry aim at truth;
  truth is a standard of correctness. Should explain what "aiming at truth" amounts
  to and whether truth is a norm.


  6. It must be compositional? Truth for compounds depends on truth of components
  (T: "A and B" true iff A true and B true). And it must handle opacity/context-sensitivity?
  Perhaps.


  7. It must respect the distinction between truth and justification/warranted assertibility:
  a claim can be justified but false, true but unjustified. Any theory must preserve
  the objectivity/independence of truth.


  8. It must be consistent with truth-value gaps or gluts? Not a requirement but a
  constraint: it can''t just declare contradictions acceptable without losing something.


  9. It must handle future contingents? "There will be a sea battle tomorrow" — maybe
  not necessary.


  10. It must handle contingent liars / empirical paradoxes (Nixon-Dean example: Jones
  says "Most of Nixon''s claims about Watergate are false" — circular but contingent).
  And the liar can be grounded in empirical fact.


  11. It must handle revenge paradoxes: for any theory that introduces gaps, the strengthened
  liar "this sentence is not true" generates a new paradox; so a theory must say something
  principled about the expressive limits or about the notion of "true" in the object/meta
  language.


