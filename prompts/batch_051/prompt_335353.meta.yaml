  - Anthropic objection / selection effect: We can only find ourselves in a universe
  that permits observers. So the appropriate probability is P(life-permitting | we
  exist, ...) = 1. The fact that we observe life-permitting constants is not evidence
  against the chance hypothesis, because any observer in any universe would observe
  life-permitting constants (well, in the single-universe chance case, there might
  be no observers elsewhere; the selection effect is that if you''re observing at
  all, you''re in the life-permitting one). Hence the observation does not confirm
  design as strongly as the raw improbability suggests. This is sometimes framed as
  "the anthropic principle."


