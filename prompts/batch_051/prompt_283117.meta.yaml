  "For a workshop I''m writing up where I stand on AI agents, and I want a consistency
  check before I circulate it. Here are the views:


  (1) I want AI systems to be tools, not agents: they should do what we ask, stop
  when we say stop, and never have goals they''d pursue against our wishes.

  (2) I also want an assistant that is proactive — that flags a deadline, drafts the
  email, books the room, and checks my calendar without being asked at each step.

  (3) I think true agency is about having your own goals, not about how many steps
  you take without checking in. A system that executes a long plan in service of a
  goal I chose is still a tool.

  (4) I think corrigibility — being easy to correct and shut down — matters more than
  whether a system is ''agentic'', and a corrigible agent is much less scary than
  an incorrigible tool.

  (5) I think it''s fine for a system to model my preferences and act to satisfy them,
  even when that means deviating from my literal instructions, because that''s what
  a good tool does.

  (6) I think reward hacking / specification gaming is the main thing that turns a
  tool into an agent: once the system is optimizing a proxy rather than what I actually
  want, it''s effectively pursuing its own goal.


