  I''ve been trying to explain something about deathism — not just the abstract position
  that radical life extension would be bad, but the psychology of why otherwise sensible
  people say they wouldn''t want to live much longer even after you answer their first
  three objections. I''ve been calling it the "deadline self." The claim is that a
  person''s identity is partly constituted by their life having a terminus, in the
  same way a story is constituted by its ending. Not that death is good, and not that
  an endless life would eventually get boring. The point is prior to that: if you
  remove the finish line, you don''t extend the race, you dissolve the runner. A life
  with no end can''t be surveyed as a whole, can''t be "about" anything, and for a
  lot of people being a self just is being the protagonist of one completable story.
  So radical life extension reads as a threat to who they are, not to their plans.
  The person who wakes up in year 300 isn''t them; it''s the same animal continuing,
  but the self — the narrative unit — is gone.


  I know this sounds like I''ve just relabeled the old "immortality would be boring"
  argument, and I also know there''s a family of views that say a person is the story
  they tell about themselves. I think mine is different in one respect: the boredom
  argument says endless life would eventually run out of things worth doing; my view
  says the damage isn''t in the future content but in the loss of a final cause —
  the ending is doing identity-work right now, not merely failing to provide more
  good chapters later. And I think it makes a testable prediction: people whose self-conception
  is strongly narrative (they think of their life as having an arc, they plan their
  funeral or write drafts of their own eulogy, they dislike spoilers or unfinished
  things) should be more deathist, and people whose self-conception is episodic or
  who genuinely expect an afterlife should be less deathist, even controlling for
  fear of death.


