  As a journalist who covers science and ideas, I sometimes run workshops that introduce
  a philosophical problem through an exercise rather than a lecture. I am now preparing
  a 75-minute session for 24 graduate students and early-career journalists at a small
  ideas festival. I want them to feel the force of a puzzle first posed by Gregory
  Kavka in his 1983 Analysis article The Toxin Puzzle. The case, roughly, is this:
  a person is offered a very large sum of money if, at midnight tonight, she can genuinely
  intend to drink a mildly unpleasant but harmless toxin tomorrow afternoon. The money
  is delivered before she has to act, and the payout depends only on her having the
  intention at the specified time, not on actually drinking. Most people find that
  they cannot produce the required intention, because once the money is already secured,
  they know they will have no reason to drink the toxin. The intended lesson is that
  an agent can want to intend to do something, and can even believe it would be rational
  to have the intention, without being able to form the intention itself.


  Please design a runnable classroom activity that makes participants encounter this
  gap between wanting to intend, deciding to intend, and actually intending. The session
  has 24 people and 75 minutes. The exercise should not rely on real money, but should
  use tokens, points, or role-based incentives so that participants are rewarded for
  forming a certain intention or for being credibly disposed to do something while
  the action itself is optional, postponed, or made unattractive after the reward
  is secured. The idea should emerge from what the participants try and fail to do,
