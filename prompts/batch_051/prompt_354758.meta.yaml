  person who intends it. Kavka''s original case, from his 1983 Analysis article ''The
  Toxin Puzzle,'' goes roughly as follows: you are offered a large sum if, at midnight
  tonight, you can genuinely intend to drink a mildly unpleasant toxin tomorrow afternoon;
  the money is deposited before the deadline, and the payout depends only on your
  having the intention at that moment, not on actually drinking. Most people find
  that they cannot manufacture the intention, since they know the act will have no
  reason to occur once the money is already secured. I want the participants to run
