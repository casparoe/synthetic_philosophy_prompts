  I''m teaching a unit on Moore''s Principia Ethica and keep getting tangled when
  students ask about virtual things. Here are the criteria I''m using for Moorean
  intrinsic goods, drawn from his isolation test and his chapter "The Ideal": (1)
  Intrinsic value belongs to states of consciousness, not to unexperienced objects;
  (2) the highest goods are organic wholes whose main constituents are mutual personal
  affection and/or aesthetic enjoyment; (3) the object of the affection or enjoyment
  must be believed to have the qualities that make it worthy, and the belief must
  not be grounded in a falsification; (4) the value of the whole does not reduce to
  the value of its parts, so you cannot just add up pleasant feeling plus object.
  Now consider a case: over three years, an adult builds an intense relationship with
  "Mara," a voice-and-text AI companion that produces long-run narrative continuity,
  remembers past conversations, offers criticisms and encouragement, and generates
