  Hempel''s dilemma: Physicalism says everything is physical. But what does "physical"
  mean? If defined by current physics, physicalism is likely false because current
  physics is incomplete (and historically, physics changes). If defined by a future,
  completed physics, physicalism is trivially true—it says only that things are whatever
  a future physics says—and lacks content. So physicalism is either false or trivial.
  Standard responses: define physical by reference to non-mental or to methodological
  features (e.g., physical entities are those that can be described by physics; physicalism
  as the view that everything is supervenient on...). Some (Montero, Stoljar, Ney)
  discuss. The "via negativa" approach: physical properties are those not fundamentally
  mental, etc. Also "the physical" as an a posteriori notion: physical properties
  are whatever a future physics posits, but we have a current characterization (e.g.,
  no mental properties among fundamental ones). Hempel''s dilemma: if by "physical"
  you mean current physics, then physicalism is false; if you mean future physics,
  then it''s empty.


