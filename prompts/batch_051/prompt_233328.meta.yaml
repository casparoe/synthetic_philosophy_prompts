  The reference class problem: "the probability that a given individual will die by
  age 65" depends on the reference class (males, smokers, etc.). You can always find
  a narrower class that changes probability drastically (e.g., including exact DNA)
  until the class has one member and the probability is 0 or 1. So unique single-case
  probabilities seem underdetermined.


  Positions on this:

  - Some deny single-case probabilities entirely (frequentists like Reichenbach: probabilities
  are relative to a chosen reference class; the choice is a matter of "positing" /
  decision, not truth).

  - Subjective Bayesians: probabilities are degrees of belief, not facts; reference
  class choice is just a heuristic for forming priors, and what matters is updating
  via Bayes on all evidence. There''s no "right" reference class, only how you set
  priors and update.

  - Objective Bayesians: given a body of evidence there''s a unique rational prior
  (e.g., maximize entropy / symmetry constraints), so the reference class problem
  is solved by treating all available evidence as conditioning info rather than lumping
  into a class.

  - Propensity/explanatory accounts: single-case probabilities exist as physical propensities
