  Gongsun Long''s White Horse Dialogue (白馬論): The claim "white horse is not horse"
  (bai ma fei ma). Interpretations vary:

  - Some read it as about the distinction between "horse" (the kind named by shape/form)
  and "white horse" (a composite of color + shape): asking for a horse is different
  from asking for a white horse; "horse" doesn''t include the color, while "white
  horse" requires both.

  - The dialogue argues through several moves: (1) "horse" names the shape/form (形),
  "white" names the color; the name of the color is not the name of the shape, so
  "white horse" is not "horse" (i.e., these are different names with different criteria).
  (2) If someone seeks a horse, a yellow or black horse may be supplied; if someone
  seeks a white horse, a yellow or black horse may not. If "white horse" were "horse,"
  then what is sought in both cases would be the same; but it isn''t. (3) The "white"
  in "white horse" is not the same as a bare white thing, and the horse in "white
  horse" is not the same as a bare horse; "white horse" is a compound — maybe "horse"
  as such lacks a determinate color, so "white horse" adds something to "horse".

  - Later Mohist criticism (the "hard and white" debate) treats it as a paradox about
  how names pick out things.


  Standard modern view (Fraser, Hansen): Gongsun Long''s point is about names and
  the extension/criteria of names, not about rejecting that white horses exist in
  the world. The dialogue is often seen as a treatment of compound terms and reference:
  "white horse" denotes something different from "horse" because the criteria for
  applying "horse" don''t include color, whereas "white horse" picks out only some
  of the horses (white ones). It''s a philosophy of language point, not a denial of
  a biological fact. It is often connected to the School of Names'' concern with ming
  (names) and shi (stuff/actuality).


  A common popular misreading: "He''s saying the concept of a white horse is different
  from the concept of a horse, which is just obvious" or "He''s denying that white
  horses are horses in reality, which is absurd" or "He treats ''white'' as a substance
  rather than a property."


