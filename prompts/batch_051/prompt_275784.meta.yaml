  The wrong kind of reasons problem: In the literature, there''s a distinction between
  the "right kind of reasons" (RKRs) and "wrong kind of reasons" (WKRs) for attitudes.
  Standard examples:

  - A demon will punish you unless you admire him. Do you have a reason to admire
  him? Most say: you have a reason to want to admire him or to bring it about that
  you admire him, but not a reason to admire him. The reason is of the "wrong kind"
  to bear on the correctness/admirability of the object.

  - A demon threatens to punish you unless you believe that 2+2=5. You have a reason
  to believe? No — a pragmatic reason, not an epistemic reason.

  - Pascal''s wager: practical reasons for belief in God.

  - An evil tyrant offers money if you fear a puppy. You have a reason to get yourself
  to fear the puppy, not a reason to fear it.


  The problem: what distinguishes the right kind from the wrong kind? Various attempts:

  - Object-given vs. state-given reasons (Parfit, Piller): reasons that cite features
  of the object vs. features of the state/attitude. But the distinction is hard to
  draw; e.g., a feature of the object can be a reason for the state only if... hmm.

  - Reasons bearing on truth/correctness vs. other.

  - The "why" tests: right kind reasons are those that would be cited in favor of
  the attitude''s correctness; wrong kind are reasons to want/adopt the attitude.


