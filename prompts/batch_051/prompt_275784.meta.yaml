  don''t think I have a reason to admire him, but I do think I have a reason to want
  to admire him, and a reason to take steps to make myself admire him if I could.
  A demon says he will torture my family unless I fear a perfectly harmless house
  cat; again, I want to say there is a reason to bring it about that I fear the cat,
  but no reason to fear the cat. The same goes for belief: an eccentric billionaire
  offers me a fortune to believe that there is an even number of stars; there is a
  reason to acquire the belief, but no reason to believe it. By contrast, if a qualified
  doctor tells me a snake is venomous, that does seem to be a reason to fear it, and
  if a trusted friend points out that a politician has lied for years, that seems
