  At a barbecue a few weeks ago, two friends of mine spent an hour arguing about a
  startup that offers "graded uploading." The deal: a surgeon replaces one neuron
  at a time with a silicon chip that is certified to be input-output identical to
  the cell it replaces. The person is awake throughout, and the doctors pause after
  each swap to ask whether anything feels different. Nobody has ever reported feeling
  different. My friends were arguing about whether the person on the table at the
  end is still the original person or just a very good copy. I stayed out of it because
  I honestly couldn''t tell who had the better argument. Here''s how I remember it.


  (1) Dana said the procedure is the rational no-brainer. Since each chip does exactly
  what the neuron did, no single swap changes anything that matters; and if each individual
  swap leaves you the same person, then the chain of ten thousand swaps leaves you
  the same person—identity is transitive. She added that the system stays running
  the whole time, so there''s no gap during which "you" could be said to leave and
  a replacement arrive.


  (2) Tom said that''s a sorites wearing a lab coat. The fact that no step is the
  step where you die doesn''t imply you make it to the end; the Ship of Theseus is
  still the Ship of Theseus after plank one, and isn''t after plank ten thousand,
  even though no plank was the fateful one. And the "lights stay on" point can''t
  carry much weight, because the lights go out every night when Dana sleeps, and she
  doesn''t think she dies each evening. What''s doing the work, he said, is the quiet
