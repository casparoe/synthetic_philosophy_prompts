  tamping rod was driven through Gage''s skull in a blasting accident; he survived
  and lived another eleven years. The standard story is that the damage to his frontal
  lobes changed his personality sharply — from dependable and temperate to profane,
  erratic, and impulsive — so much so that the people who knew him said he was no
  longer the man they had known. I want to use that case to test the Buddhist doctrine
  of not-self, and also to use the doctrine to see what the case actually shows.


  Run the analysis in both directions. First, how would a proponent of anatta describe
  what happened to Gage? On the standard Buddhist picture there is no enduring, substantial
  self: there are only the five aggregates — form, feeling, perception, mental formations,
  and consciousness — in a causally continuous stream, with persons as conventional
  designations laid over that stream. Does Gage support that picture, by showing that
  what we call the same person is just a bundle of dispositions that can be altered
  wholesale while the body and the name continue? Or does it instead support the view
  that personal identity is more than a convention — and if so, precisely what persists:
  the continuity of memory, the living organism, the social recognition of the same
  man, something else? Second, what does Gage show about anatta? Is the case a confirmation,
  an anomaly, or something the doctrine never anticipated? Be disciplined about the
  mapping: say exactly which features of the stream did and did not change, which
