  - Critics (e.g., Manuel Velasquez): only individuals can act and intend; corporate
  "intentions" are metaphorical; corporate responsibility reduces to individual responsibility.

  - Philip Pettit and Christian List: group agents have "judgment aggregation" — group
  can hold attitudes that no member holds; irreducible group intentions under certain
  conditions.

  - Kenneth Goodpaster: corporations can be held responsible? Actually Goodpaster
  argues corporations are capable of moral reasoning? Hmm.

  - John Searle: collective intentionality (we-intentions) — individual''s we-intention.

  - Distinction: corporate moral agency vs. corporate moral responsibility vs. legal
  personhood (corporate personhood is a legal doctrine: Santa Clara County v. Southern
  Pacific; Citizens United).

  - Intention vs. negligence: a company can be blamed for negligent policies without
  intending harm — but blame for negligence doesn''t require agential intention in
  the full sense.

  - "Culture" argument: corporate culture as a cause.


