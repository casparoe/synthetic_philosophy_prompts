  Objections and problems:


  1. The specification problem / underdetermination: "thought faster, knew more, were
  more the people we wished we were" underdetermines the output; many different extrapolations
  are consistent, and there is no fact of the matter which is "you." Without a measure
  over counterfactual improvements, CEV is not a well-defined optimization target.


  2. The inevitability of value loading / circularity: any extrapolation procedure
  takes some decision about which changes count as improvements; those decisions just
  are values, so CEV cannot extract values from an allegedly value-neutral process.
  (Bostrom''s related point: "any normativity must be supplied by us"; the "loadedness"
  problem.)


  3. Aggregation: even if each individual had a unique CEV, there is no principled
  way to combine the CEVs of all present (and future?) people into one coherent "our"
  volition; different weightings yield different targets, some repugnant.


  4. Contradiction / incoherence in the source: people are internally inconsistent;
  CEV extrapolates until coherence, but any resolution of inconsistency encodes a
  normative choice (e.g., which of my conflicting ends is "more me"). So CEV either
  stalls at incoherence or arbitrates between my conflicting selves without being
  authorized to do so.


  5. The abhorrent-values problem: if someone would extrapolate into wanting something
  appalling, CEV seems to say the AI should optimize that. The built-in constraints
  (e.g., requiring that the outcome seem right / that it respect others) either beg
  the question or turn CEV into ordinary moral theorizing.


  6. The authority problem / present selves: why defer to a counterfactual, more-informed
  version of you? Your current preferences have authority for you now; the improved
  version isn''t you and never existed. This is related to ideal-advisor accounts
  in metaethics. (Could be listed.)


