  Judgment aggregation and discursive dilemma:

  - The discursive dilemma (Pettit 2001; List and Pettit 2002). Suppose a three-member
  court must decide whether a defendant is liable under a contract. Liability requires
  two premises: (P) there was a valid contract, (Q) the defendant breached it. Votes:
  A: P yes, Q no → not liable; B: P no, Q yes → not liable; C: P yes, Q yes → liable.
  Premise-wise: P gets majority yes (A, C); Q gets majority yes (B, C); so majority
  on premises supports liability. But conclusion-wise: majority votes not liable (A,
  B). Inconsistency: the collectivity accepts both premises but rejects the conclusion,
  though the conclusion follows. This is the doctrinal paradox. The discursive dilemma
  generalizes: premise-based voting produces consistent collective premises that may
  conflict with majority on conclusions; conclusion-based voting produces consistent
  conclusions but not a stable set of reasons.

  - Implications: group rationality, whether group agents exist, constitutional design
  (premise-based vs conclusion-based), the case for deliberative democracy or for
  giving a chair/authority the power to set the agenda, the "doctrine of judicial
  restraint" maybe.


  In-the-weeds angle: there are escape routes — if the issue is framed differently,
  if weights, if individuals have interdependent judgments. The "premise-based procedure"
  can ensure collective consistency but at the cost of possibly overriding the majority
  on the conclusion. Also the "discursive dilemma" is used to argue that deliberation
  can transform preferences/judgments and avoid cycles, but strategic voting can cause
  manipulation (Dietrich and List on judgment aggregation and strategic manipulation).


