  there''s something off in the details, and I don''t want to over- or under-credit
  it. Below is the question exactly as set, then the student''s answer.


  Question (as set):

  Explain, using the passage below from Augustine''s On Lying, how Augustine distinguishes
  lying from merely saying something false. Then apply the distinction to these two
  cases: (a) Jonah tells his sister that the capital of Australia is Sydney, which
  he firmly believes (it is in fact Canberra). (b) Marina tells her frightened patient
  that a drug will help her, even though she is convinced it won''t, and the drug
  in fact works. For each case, say whether Augustine would count the person as lying,
  and why.


  [passage]


