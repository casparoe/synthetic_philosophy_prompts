  Simulation hypothesis: our world is a computer simulation created by an advanced
  civilization or some "programmer." Usually the programmer is a finite being in a
  higher-level reality; the simulated world is contingent (could have different physics),
  and there is a purpose/design. This conflicts with Spinoza in interesting ways:
  (1) Spinoza denies a transcendent creating God with will; a programmer would be
  an impostor god, a finite mode. (2) If the universe is simulated, it''s contingent
  on the programmer''s choices; Spinoza denies contingency, so he''d reinterpret what
  appears as "program design" as necessary determination by causes. (3) "Base reality"
  vs simulation would be a distinction among modes within one substance, not a distinction
  between creator and creation; the simulated world would still be in God/Nature.
  (4) Would Spinoza even countenance "possible worlds" or running the universe otherwise?
  No, he would say there is no real plurality of possible worlds; talk of alternative
  simulations is imagination/abstraction. (5) The intellectual love of God would be
  unaffected: whatever is real, including the simulation and the simulator, is God/Nature;
  understanding it as necessary yields blessedness, not alarm. (6) Spinoza might see
  the simulation worry as another superstition (like final causes and anthropomorphic
  God) — a confusion of the imaginary with reality; the "matrix" is already the world
  of inadequate ideas; escaping it is not escaping the simulation but understanding
  necessity. Interesting: the simulation hypothesis as a new version of the "Cartesian
