  necessary; nothing is contingent; free will is an illusion born of ignorance of
  causes. God/Nature is the one infinite substance; finite things are modes of it.
  The intellectual love of God (amor Dei intellectualis) is the highest blessedness,
  arising from the third kind of knowledge: seeing things under the aspect of eternity
