  summary. Real claims:

  - E.T. Jaynes and others proposed that given partial information (constraints on
  expectations), the rational/least biased probability distribution is the one maximizing
  Shannon entropy subject to those constraints.

  - Jaynes claimed this was a method for assigning probabilities from incomplete information,
  and that it yields, e.g., the uniform distribution when only knowing the alternatives
  are exhaustive and mutually exclusive (principle of indifference as a consequence).

  - Shore and Johnson (1980) showed MaxEnt uniquely satisfies certain consistency
  axioms.

  - Criticisms: Seidenfeld (1979), Shimony, van Fraassen (1989 Laws and Symmetry)
  — MaxEnt can violate strict conditionalization; updating by MaxEnt is not generally
  equivalent to Bayesian conditionalization; "washing out" of prior information; the
  choice of constraints is subjective; MaxEnt distribution isn''t "objective" because
  it depends on the constraint set and variable partition; also, Jaynes conflated
  "ignorance" with uniformity and equated information with Shannon entropy — questionable.
  Also the Bertrand paradox problem for continuous spaces (MaxEnt not invariant under
  reparameterization). Also the "reference" but that''s Bernardo/Berger.

  - Objective Bayesianism vs subjective Bayesianism: subjective Bayesians hold probabilities
  are degrees of belief constrained only by coherence (probabilism); objective Bayesians
  add further constraints (e.g., symmetry, MaxEnt) to pin down unique priors.


