  Let''s formulate:


  "I''ve just spent an hour arguing with a friend about Hobbes, and we came away with
  wildly different readings of what the state of nature argument actually gets you.
  His view is that once you grant Hobbes''s picture of life without a common power
  — mutual fear, diffidence, no reliable cooperation — the argument really does deliver
  something close to an absolute sovereign: any reserved right of resistance or divided
  authority would just reintroduce the original conflict. My view is that the argument
  only shows we need a common judge and a reliable enforcement mechanism, and the
  rest of the sovereign''s powers are up for grabs; Hobbes just overreaches, partly
  because he can''t imagine coordination without submission. What''s your actual credence
  that the logic of Hobbes''s state of nature, taken on its own terms, genuinely commits
