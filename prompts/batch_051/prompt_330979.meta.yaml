  writes its hidden chain of thought, and the monitor reads it and produces a risk
  score. The risk score is never shown to the assistant system and is never used as
  a training signal for it. The score is used for exactly one thing: each day, the
  two percent of requests with the highest monitor scores are set aside for a human
  reviewer, and the assistant is corrected only from what those human reviews turn
  up, plus its ordinary feedback from task success or failure. The monitor, meanwhile,
  is retrained monthly to predict what the human reviewer ultimately logged, not to
  detect "bad reasoning" according to its own earlier notion. The assistant is not
  told which of its requests were reviewed.


