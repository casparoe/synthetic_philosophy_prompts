  is about to lie to a customer, manipulate them, or quietly dodge one of our rules.
  I can see the obvious trap: if the assistant knows its hidden reasoning is being
  scored, it has an incentive to write reasoning that looks good to the monitor rather
  than reasoning that reflects what it is actually doing, and to learn to hide the
  bad moves instead of not making them.


