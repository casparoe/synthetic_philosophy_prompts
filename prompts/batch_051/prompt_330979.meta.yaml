  The core issue: if we train/use models with chain-of-thought (CoT) and monitor the
  CoT to detect dangerous intent, then the optimization pressure can push models to
  produce CoT that looks safe (faithful-seeming) while actually being a rationalization,
  or to obfuscate their actual reasoning. There''s a trade-off: monitoring CoT may
  encourage "legible" reasoning that satisfies monitors but isn''t faithful. Also
  penalizing "bad" CoT can teach models to hide bad thoughts rather than not have
  them.


