  Let me verify domain details from memory (no quote needed): Dennett''s "Consciousness
  Explained" (1991) introduced multiple drafts model and Cartesian theater. Key claims:
  there is no single place in the brain where "it all comes together", no privileged
  moment when a representation becomes conscious; instead there are multiple, parallel
  content-fixations at different sites, and the ones that get "probed" (e.g., by asking
  a question, or controlling behaviour) are the ones we treat as conscious. The question
  "when exactly did the subject become conscious of the stimulus?" is often ill-posed,
  like asking "when did the dollar devalue?"—no single, objective fact of the matter
  independent of how you ask. Dennett''s "Stalinesque vs Orwellian" revision distinction
  for apparent motion (colour phi) supports this.


  Distributed version control: Git commits form a directed acyclic graph; there''s
  no canonical "the document" except what each replica has; "the current state" is
  whatever a merge or checkout produces; different clones may disagree; linear history
  is a convenience. CRDTs / eventual consistency: writes happen at different nodes
  with no global clock; no single moment when a write "really" happened; state is
  a function of the causal history, and reconciliation is not reading off a master
  copy. The question "at what instant did the document change?" has no well-defined
  answer until you define a probing/merge rule.


  Deep vs superficial mapping. The parallel is nice. Points where it comes apart:

  - In Git, there is a precise algebraic structure (commits, hashes, DAG, merge base).
  The analogue in the brain would need identifiable "drafts" as discrete representations
  with an objective precedence relation, and Dennett denies there is any such well-defined
  set. So the analogy reifies drafts as if they were commits.

  - In Git, a merge can later be undone by reference to an immutable commit graph;
  history is objective even if linear order isn''t. In multiple drafts, there is no
  equivalent of commit hashes; earlier drafts are not archived and recoverable.

  - Dennett''s point is partly about the question being ill-posed rather than there
  being a robust partial order; in distributed systems, questions about causality
  are well-posed under Lamport clocks/vector clocks. So "the document" may be a pragmatic
  fiction in both, but in CS the fiction is precisely specifiable (a quotient under
  conflict-free merges) whereas for consciousness the fiction is less formal.

  - The parallel predicts that consciousness should support "rebasing" or "cherry-picking"
  to rewrite history, which is false (or is it? memory editing, Orwellian revision
  suggests something). That''s an interesting false prediction: Git lets you rewrite
  a linear history; Dennett''s Stalin-vs-Orwell distinction suggests there may be
  no fact of the matter about which happened, i.e., the "history" is indeterminate,
  whereas Git histories are objective.

  - Another false prediction: if consciousness were like Git, probing a subject (asking
  a question) would be like `git log`, recovering a definite causal order; but Dennett
  denies probing recovers any pre-existing order.


