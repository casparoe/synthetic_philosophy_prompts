  Dutch book argument (DBA) for probabilism: If an agent''s degrees of belief violate
  the probability axioms, then there is a finite set of bets, each of which the agent
  regards as fair (or favorable) by their own degrees of belief, that together guarantee
  a net loss in all possible states. Therefore, if you''re rational, your credences
  should obey probability axioms. Standard issues:


  1. **Coherence vs. sure loss**: DBA shows a necessary and sufficient condition?
  de Finetti''s theorem: credences avoid Dutch book iff they''re probabilities. "No
  sure loss" depends on pricing bets according to expectations.


  2. **The "depragmatized" or "epistemic" Dutch book**: Some argue avoiding sure loss
  is a pragmatic norm, not epistemic; some respond that credences are by nature degrees
  of confidence governing action.


  3. **Fair odds and the bookie**: Why must the agent accept each bet? If the agent
  sees the combination and refuses, no book. The usual reply: each bet is acceptable
  individually; rationality of each implies rationality of the set (package principle)
  — but critics challenge aggregation/package.


  4. **Diachronic Dutch books (for conditionalization)**: There are Dutch strategies
  requiring the bookie to know agent''s future credences and decide bets over time;
  agent can avoid by refusing bets after update if they know bookie''s strategy. Lewis
  and Skyrms? There''s a debate: the "Diachronic Dutch Book argument" — the agent
  needs a strategy (Teller, Lewis). The usual defense: "the bookie''s knowledge is
  not an idealization too far; the agent is committed to a policy." But critics: Colin
  Howson, ? There''s "diachronic Dutch books" and "not strictly dynamic" etc.


  5. **Non-Archimedean utilities or lexicographic preferences**: Can resist because
  strict preferences don''t guarantee money pump/sure loss.


  6. **Imprecise credences**: agents with sets of probabilities; avoiding sure loss
  yields lower previsions not necessarily precise probability, and DBA''s force for
  probabilism is weaker; but generalized Dutch books.


  7. **Scope of the argument**: DBA gives necessary condition for credences not to
  be exploitable, but does it give rational requirement? The "bookie" is a dramatic
  device; the normativity of avoiding sure loss arises from preferences (you disprefer
  sure loss) — but if you''re just indifferent? Actually pre-take all bets you find
  fair; if you have non-probabilistic credences, you find a set of bets fair and union
  loses. If you don''t bet or don''t care, maybe coherentism doesn''t bind. This is
  a standard worry: "The Dutch book theorem shows only that non-probabilistic agents
  have incoherent evaluative commitments, not that they''re irrational unless betting
  norms matter."


  8. **The logical structure**: DBA assumes that the fair price for a bet that pays
  $1 if A is p(A)*$1. But having a degree of belief p does not force you to buy/sell
  at that price; risk aversion etc. The "bookie argument" needs the agent to have
  equal willingness to buy and sell at same price? Or at least accept certain bets
  favorable.


  9. **The "sure-loss = inconsistency" reading**: de Finetti saw probability as coherent
  betting odds. The DBA reveals a pragmatic inconsistency. Is the violation of additivity
  like a kind of logical inconsistency? Some push: no one thinks failing additivity
  is as bad as violating non-contradiction.


  10. **Dutch book vs accuracy arguments**: Some philosophers prefer accuracy-based
  (Joyce) arguments for probabilism because they give epistemic reasons.


  11. **The "book is made from the agent''s own fair prices"**: an agent with p(A)=p(not
  A)=0.6 is vulnerable. The follow-up could ask: what if the agent has non-additive
  degrees of belief but refuses to combine separate bets, citing the Ellsberg-like
  ambiguity? This leads to generalized Dutch book: if agent with imprecise credences
  accepts each bet based on lower prevision, can a bookie make a guaranteed loss?
  No, but perhaps a "coherence" requirement yields closed convex sets.


  12. **The normative interpretation problem**: "Dutch book arguments are often presented
  as if they show rational credences are probabilities. But all they show is that
  if you are not vulnerable, your credences are probabilistic. Does the guest think
  this is enough, or does the argument need an extra premise about the independent
  rationality of the betting dispositions?" Good question.


