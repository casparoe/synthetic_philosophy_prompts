  Draft:


  "I''m a PhD student working on Peirce''s epistemology, and over the past year I''ve
  been running a distinction through my seminar papers that I would like an honest
  assessment of before I build a dissertation chapter on it. I call it the specification
  requirement, or sometimes ''specified fallibilism.'' The idea is this. Peirce says
  genuine inquiry is driven by real doubt, and that the method of science is distinguished
  from tenacity, authority, and the a priori method by the fact that it alone bets
  on an external permanency that will eventually settle opinion. But in practice I
  find that many people — including excellent scientists and philosophers — pay that
  bet only in words. They will say that all their conclusions are provisional, yet
  they cannot say anything specific about what would reopen the question for them.
  So I''ve been claiming that fallibilism without a maintained specification is not
  a method of fixing belief at all; it is tenacity wearing the vocabulary of science.
  By ''maintained specification'' I mean a standing, revisable description — not necessarily
  a single crucial experiment, but a concrete family of observations, outcomes, or
  hard cases — that a thinker could recognize as counting against the belief and that
  they would treat as a reason to reopen inquiry. My central claim is that the real
  content of ''do not block the road of inquiry'' is the obligation to keep such specifications
  in good repair, and that a belief which lacks one is, whatever its truth, not held
  by the method Peirce admired."


