  Lakatos: A research programme has a hard core (central theoretical commitments,
  protected by the negative heuristic — "do not direct modus tollens at the hard core")
  and a protective belt of auxiliary hypotheses, initial conditions, etc., which absorbs
  anomalies and is adjusted by the positive heuristic. Programmes are evaluated as
  progressive if they make novel predictions that are corroborated; degenerating if
  they patch the belt with ad hoc adjustments merely to accommodate anomalies. A programme
  may be abandoned when a rival with a progressive problemshift supersedes it.


  Software: legacy code with a core (e.g., old mainframe, monolith, or a legacy module)
  that is poorly understood, fragile, or has hidden dependencies. The strangler fig
  pattern (Martin Fowler) gradually replaces a legacy system by building a new system
  around the edges and routing functionality to it, while the old core remains until
  no longer needed. Anti-corruption layer wraps a legacy subsystem with a translation
  layer so the new system can interact with it without being corrupted by its model.
  The core is not modified; adapters and facades absorb change.


  Parallel points:

  - Hard core ≈ legacy core: both are protected from direct modification.

  - Negative heuristic ≈ architectural rule "don''t touch the core; wrap it."

  - Protective belt ≈ adapter/facade/anti-corruption layer; absorbs anomalies/change
  requests.

  - Anomalies ≈ new requirements, integration needs, bug reports that must be handled
  without touching the core.

  - Ad hoc patches ≈ accumulating wrappers, special cases, translation exceptions.

  - Progressive vs degenerating ≈ healthy wrapping vs. adapter sprawl / technical
  debt; the point where replacing the core becomes cheaper.

  - Replacement of programme ≈ strangling the monolith until the old core is retired;
  scientific revolution analog.


  Where it breaks:

  - Lakatos''s hard core is protected as a methodological decision; software cores
  are protected for engineering/economic reasons (lack of understanding, risk, cost),
  not because they are definitional.

  - In science, the protective belt is adjusted with an eye to novel predictions and
  coherence with the programme; in software, wrappers just meet current requirements
  — no notion of novel corroboration.

  - The negative heuristic in Lakatos is about where to direct modus tollens; in software
  there is no logic of falsification, no "modus tollens."

  - Scientific programmes compete by predictive success; legacy systems are replaced
  for cost/risk/maintainability, not because a rival predicts better.

  - The hard core is partly definitional/constitutive (e.g., Newton''s laws as axioms
  of the programme); legacy core is contingent and could in principle be rewritten.


