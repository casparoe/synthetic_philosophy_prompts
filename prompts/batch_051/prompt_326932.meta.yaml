  Let me verify details about Lakatos to avoid misstating. The key ideas in Proofs
  and Refutations:

  - Euler''s polyhedron formula V - E + F = 2, originally for polyhedra.

  - The method of proofs and refutations: a proof is an argument that decomposes the
  conjecture into lemmas; counterexamples (global but not local, local but not global)
  force refinement.

  - Monster-barring: excluding counterexamples by redefining/refining definitions
  to bar the monster.

  - Exception-barring: listing exceptions.

  - Lemma-incorporation: incorporating the counterexample into the theorem by turning
  a lemma into a condition.

  - Concept-stretching: stretching the concept (e.g., polyhedron) to include new cases.

  - quasi-empirical: mathematics grows through conjectures and refutations, not just
  deduction.


