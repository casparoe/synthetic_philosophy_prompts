  Requirements for type 1:

  - Asker teaches/explains one idea to a specified audience.

  - Wants a plan for the explanation, not the explanation itself.

  - Include: the order in which components must be introduced and why (dependency
  structure); the one example/case that carries the idea and what it must have and
  lack; the misconceptions the audience predictably brings/forms and the point in
  the sequence where each should be headed off; the check for understanding showing
  the idea landed; what to leave out at this level and say so.

  - Do not ask for readings.

  - Relatively formal/polished.

  - No quotes around prompt; no preamble.


