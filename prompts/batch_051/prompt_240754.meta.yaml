  Here''s the thing. Two standard ways to train a language model to solve multi-step
  problems are outcome supervision and process supervision. In outcome supervision,
  the model gets a reward based only on whether the final answer is right — say, the
  code passes the tests or the math answer matches the key. In process supervision,
  a reward model scores each intermediate step as correct or incorrect, so the model
  gets feedback about the chain itself, not just the last line.


  On the surface these look like just two engineering tradeoffs: process supervision
  is more expensive to collect and annotate, but it supposedly reduces reward hacking
  and gives better sample efficiency. But I suspect the choice carries real epistemological
  commitments, and that''s what I want to understand. It seperates something that
  a naive setup would mush together: good reasoning and correct outputs.


  So: what theory of the relationship between reasoning and getting the right answer
  does each scheme presuppose? For instance, does outcome supervision presuppose that
  reasoning only matters as the cause of a correct output, i.e., a purely instrumental
  view, or is it also compatible with a view on which the path itself has epistemic
  value? Does process supervision actually presuppose that intermediate steps have
  truth values, or just that they''re useful proxies that make learning easier? I''d
  also like you to say where the practice is philosophically underdetermined — where
