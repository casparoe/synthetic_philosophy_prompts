  Here''s the setup. There are two common ways labs supervise language models on tasks
  that require multi-step reasoning. Outcome supervision gives the model feedback
  only on the final answer: the code passes the tests, the number matches the key,
  the yes/no is right. Process supervision instead scores each intermediate step as
  it goes, so the model gets a signal about whether the chain itself is good, not
  just whether the last line is right.


  People usually discuss this as an engineering tradeoff: process supervision costs
  more to annotate, but it tends to improve sample efficiency and makes it harder
  for the model to game the reward by producing the right answer through garbage reasoning.
  But I think there''s a deeper issue it forces apart. Normally we sort of assume
  that good reasoning and correct outputs go together. These two methods quietly split
  those notions, and I want to know what each side is actually committing to.


  So my question is this: what theory of the relationship between reasoning well and
  getting the right answer does each scheme presuppose? In particular, does outcome
  supervision presuppose that reasoning is only valuable as a cause of correct outputs
  — a purely instrumental view — or is it compatible with the thought that the path
  has its own epistemic value that just isn''t being measured? And does process supervision
  really presuppose that each step has a truth value, or could an engineer choose
  it for purely practical reasons while still believing that only the final answer
  matters? I''d also like to know where this choice is philosophically underdetermined
  — the places where one pick doesn''t actually commit a lab to an epistemology at
  all. Finally, imagine a lab that really did adopt the strict view that only the
  final output matters and reasoning is just whatever reliably leads there. What would
  have to change in how they evaluate models, what they reward, and what they report
  about the reasoning a model shows users? And is the fact that labs still care about
  whether the displayed chain of thought is faithful even when they only supervised
  the outcome best read as an inconsistency with that view, or just a pragmatic safeguard?"


