  Lewis''s account of convention (from Convention, 1969): A regularity R in behavior
  is a convention in a population P iff within P, (1) everyone conforms to R; (2)
  everyone expects everyone else to conform to R; (3) everyone prefers to conform
  on condition that others do (given that coordination problem); (4) there''s an alternative
  regularity R'' which everyone could have followed; (5) these expectations/preferences
  are common knowledge; (6) the regularity solves a coordination problem. Conventions
  are arbitrary in the sense that another solution would have been equally good, but
  maintained by precedent/expectations, not by agreement or explicit rule necessarily.
  Lewis uses game-theoretic coordination equilibria.


