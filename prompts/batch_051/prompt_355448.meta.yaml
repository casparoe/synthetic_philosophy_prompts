  p (sensitivity); (4) if p were true (in slightly different circumstances), S would
  believe that p (adherence). Nozick uses subjunctive conditionals. The theory rejects
  epistemic closure: knowledge is not closed under known entailment. Classic example:
  I know I have hands, but I don''t know I''m not a brain in a vat, because if I were
  a brain in a vat, I would still believe I have hands. So sensitivity fails for the
  negation of skeptical hypotheses. Nozick bites the bullet: you can know ordinary
  propositions while failing to know the entailments of them (not a BIV). This is
  a cost. Also lottery case: I don''t know I''ll lose the lottery because if I won,
  I''d still believe I''d lose (sensitivity fails); but I might know all sorts of
  ordinary things. Also there''s the issue of methods: belief must be formed via a
  method that tracks; can''t just switch methods.


