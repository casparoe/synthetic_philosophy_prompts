  Belief set draft:


  "Here''s where I''ve landed on the epistemic case for majority rule, and I''d like
  a consistency check before I write it up.


  (1) The Condorcet jury theorem gives a genuine (partial) epistemic argument for
  majority rule: if each voter is more likely right than wrong and votes are conditionally
  independent given the correct answer, the majority is more reliable than any single
  voter, and as the group grows the probability the majority is right goes to 1.

  (2) I think the independence assumption is the one that does most of the work, and
  correlated votes are the main way the epistemic case fails in real life.

  (3) I think real electorates are massively correlated—shared media, party cues,
  common schooling—but I also think that for a large enough electorate, majority rule
  is still usually more reliable than the average individual voter, because even after
  you discount for correlation there are enough effective independent signals left.

  (4) I think Condorcet''s competence condition doesn''t require anyone to be well
  informed: p = 0.501 is enough, and with a million voters that sliver of an edge
  gets amplified to near certainty.

  (5) I think a small panel of genuine experts can be epistemically better than a
  large majority of amateurs, and sometimes we should defer to it rather than to the
  vote.

  (6) I think vote correlation cannot make a majority worse than chance if each individual
  voter is more likely right than wrong—correlation can shrink the majority''s edge
  but not flip it below 50/50.

  (7) I think the theorem still supports majority rule even though voters'' competences
  are heterogeneous, because the group only needs to beat the average single voter,
  not the best member."


