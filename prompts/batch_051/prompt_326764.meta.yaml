  content can be denied, discussed, quoted, or reported at arm''s length, and the
  sting of S mostly cannot. For fiction this matters, he said, because the narrator
  is not endorsing S; she is depicting a man''s act of speaking, and the prohibition
  view leaves room to distinguish depicting the act from performing it.


