  ---


  I write about the behavioral and decision sciences for a general readership, and
  I am planning a hands-on evening workshop about the St. Petersburg paradox and the
  wider problem it exposes: expected-value reasoning with long-tailed or unbounded
  payoffs produces valuations that almost nobody will act on when the gamble is made
  concrete. The game itself is simple: a fair coin is flipped until it lands heads,
  and if the first heads comes on flip n, the payoff is 2^n units. The expected value
  is the sum of probability times payoff over every possible stopping point, and that
  sum does not converge; yet most people will pay only a small amount to enter.


  Design a runnable seventy-five-minute activity for twenty-four adults at a science
  festival, no prior exposure assumed and no real money. Use tokens or points, make
  the stakes concrete, and pick an incentive-compatible mechanism—a second-price auction,
  a posted-price market, sequential buying and selling of a bankrolled or truncated
  version, or something better. The activity should get participants to price one
  or more versions of the gamble themselves and to discover the gap between their
  own bids and the prices implied by their own explicit calculations before the facilitator
  names the paradox. Give me materials, roles or stations, a minute-by-minute timeline,
  the exact payoff schedule for each variant used, and a debrief that maps what happened
  in the room onto the formal structure of the game. The debrief should also separate
  resolutions that merely cap the expectation from resolutions that change the agent''s
  own valuation, and should connect the exercise to everyday heavy-tailed gambles
