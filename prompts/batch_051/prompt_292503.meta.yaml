  Fitch''s argument:

  1. Assume the knowability principle: all truths are knowable. Formally, if p is
  true then it is possible that p is known: p ⊢ ◇Kp (or p → ◇Kp).

  2. Now suppose, for reductio, there is an unknown truth: some p is true but not
  known by anyone. Call this q = p ∧ ¬Kp. Then q is true.

  3. By the knowability principle, q is knowable: ◇K(p ∧ ¬Kp).

  4. In some possible situation, someone knows p ∧ ¬Kp. But knowledge distributes
  over conjunction: if one knows A ∧ B, then one knows A and one knows B. So in that
  situation, Kp and K¬Kp.

  5. Knowledge is factive: if one knows ¬Kp, then ¬Kp is true (nobody knows p).

  6. But from Kp and factivity, p is true and someone knows p; and from step 5, nobody
  knows p. Contradiction.

  7. Therefore it is impossible to know p ∧ ¬Kp; no possible situation contains K(p
  ∧ ¬Kp).

  8. Steps 3 and 7 contradict each other. So the assumption of an unknown truth must
  be false.

  9. Hence, if p is true, it is known: all truths are known (omniscience). This is
  absurd, so the knowability principle must be rejected.


