  "I want a diagnosis of a dispute that has been running for decades without, as far
  as I can tell, any real movement: the dispute between Searle and Dennett, and their
  respective followers, over whether intentionality comes in an original and a derived
  form. Searle''s side holds that human and animal brains possess intrinsic intentionality:
  mental states that are about things in their own right, not merely about things
  relative to an outside interpreter, a designer, or a community of users. A computer
  program, on this view, can enjoy only derived intentionality: its symbols mean something
  because we assign meanings to them, not in virtue of what they do. The Chinese Room
  is meant to force exactly this point—running a formal program over syntax, however
  intricate, never by itself yields semantics. Dennett''s side rejects the original/derived
  split as a real distinction. It takes the intentional stance as basic: something
  has beliefs or desires when adopting that stance toward it produces real predictive
  leverage that cannot be had in other terms. On this account, all intentionality
  is in a sense derived or stance-relative, including our own, and the demand for
  an extra ingredient of intrinsic aboutness is a residual demand for a Cartesian
  res cogitans. The recurring dialectic is familiar: Searle says the stance leaves
  out the system''s own point of view; Dennett says the point of view is itself an
  artifact of the stance; Searle says Dennett''s third-person method misses the first-person
  facts; Dennett says the first-person is not ontologically special and is in any
  case captured by the stance we take toward ourselves.


