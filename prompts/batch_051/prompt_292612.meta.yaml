  "Here is a dispute that has been running for decades and that, as far as I can tell,
  has not moved: the dispute between Searle and Dennett (and their respective allies)
  over whether there is original, intrinsic intentionality or only derived, stance-relative
  intentionality. Searle''s side holds that human and animal brains have mental states
  that are about things in their own right—states whose aboutness does not depend
  on being interpreted, designed, or ascribed by any outside observer. On this view,
  a running computer program can at best have derived intentionality: its symbols
  mean something only relative to us. Searle supports this with the Chinese Room,
  arguing that formal symbol manipulation plus a program cannot by itself make semantics,
  no matter how clever the program. Dennett''s side denies that the original/derived
  line marks a real joint. It treats the intentional stance as the fundamental thing:
  a system has beliefs and desires when treating it as if it did buys you real, uneliminable
  predictive power. From that standpoint, the demand for a further inner glow or intrinsic
  aboutness is a leftover demand for a Cartesian res cogitans or a homuncular agent,
  and Searle''s first-person ontology is just one more stance we can adopt toward
  ourselves. The two sides have been trading the same replies for years: Searle says
  the stance cannot give you the system''s own point of view; Dennett says Searle''s
  intrinsic intentionality is an unexplained explainer; Searle says Dennett''s third-person
  account leaves out the first-person facts; Dennett says the first-person is not
  ontologically special.


