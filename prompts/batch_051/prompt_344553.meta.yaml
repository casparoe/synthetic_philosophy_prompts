  Content accuracy check on memes debate:

  - Richard Dawkins coined "meme" in The Selfish Gene (1976) as a unit of cultural
  transmission analogous to gene, subject to variation, selection, heredity. Dennett
  and Susan Blackmore developed it. Blackmore''s "The Meme Machine" (1999) argues
  memes are replicators and culture is meme evolution.

  - Dan Sperber criticized the meme approach: cultural transmission is not high-fidelity
  copying; most transmission is a process where people infer and reconstruct representations,
  which stabilizes around "cultural attractors" (Sperber 1996 "Explaining Culture";
  Sperber & Claidière; also Sperber & Hirschfeld). He argued an epidemiology of representations
  is better than meme-gene analogy.

  - Boyd and Richerson: dual-inheritance theory / cultural evolution, with culture
  as population-level evolution, but not necessarily discrete particulate units; they
  model cultural variants statistically, with guided variation and biased transmission.
  They don''t require meme "copying" with high fidelity.

  - There''s also a debate about whether Darwinian evolution requires particulate
  inheritance: it doesn''t necessarily; quantitative genetics works with continuous
  traits; but Dawkins'' replicator view emphasizes discrete units. So "Darwinian"
  is ambiguous between replicator dynamics and population thinking.

