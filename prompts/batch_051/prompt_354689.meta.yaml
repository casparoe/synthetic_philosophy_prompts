  Domain 4 species problem. The classic distinctions:

  - Are species real units in nature (realism) or pragmatic groupings (nominalism/conventionalism)?
  Actually the sorting on positions.

  - Biological species concept (BSC): groups of actually or potentially interbreeding
  natural populations reproductively isolated from other such groups. Problems: asexuals,
  fossils, ring species, gradual anagenesis, bacteria.

  - Phylogenetic species concept (PSC): smallest diagnosable cluster of organisms
  with a parent pattern of ancestry and descent; monophyletic groups; versions: diagnosability
  version, monophyly version. Problems: over-splitting, how much divergence counts,
  arbitrary thresholds.

  - Ecological species concept (ESC): a lineage occupying an adaptive zone distinct
  from others; natural selection maintains cohesion. Handles asexuals but not fossils
  perhaps; problems: ecological niches can be continuous.

  - Evolutionary species concept (EvSC): a single lineage of ancestor–descendant populations
  maintaining its identity from other lineages with its own evolutionary tendencies
  and historical fate. Handles time and fossils, but vague and hard to apply.

  - Morphospecies/phenetic: groups by overall similarity; operational but not theoretical.

  - Genotypic cluster concept (Mallet): clusters in multilocus genotype space with
  few intermediates — handles bacteria somewhat, asexuals.

  - Cohesion species concept (Templeton): the most inclusive population having potential
  for cohesion through genetic and/or demographic exchangeability.


