  "After a career in ecology and population genetics, I have been spending my retirement
  reading philosophy, and I keep coming back to a passage near the beginning of Edward
  Sapir''s Language (1921). Sapir contrasts walking, which he calls an inherent biological
  human function, with speech, which he says is not instinctive but acquired, a cultural
  function. He argues that languages vary without assignable limit from social group
  to social group because a language is a purely historical heritage of the group,
  the product of long-continued social usage, and that it varies as truly as do religions,
  beliefs, customs, and the arts. I would like you to restate this position in the
  vocabulary of conservation biology and evolutionary genetics, which I know well.
  That means making explicit what corresponds to species, population, gene pool, inherited
  trait, adaptive radiation, extinction, and ecosystem function in Sapir''s picture.
  Where the translation is clean, say so; where it forces Sapir''s claim into a shape
  it does not have, say what is distorted; and where his claim has no expression at
  all in that vocabulary, say what gets left out. Then assess the residue: does it
  show that Sapir''s account is missing something that a Darwinian framework would
  catch, or does it show that my biological vocabulary quietly assumes that the objects
  worth conserving are reproducing biological lineages and cannot, without amendment,
  express the value of a historical/cultural form? I am especially interested in what
  this implies for the idea that languages have value beyond the people who speak
  them."


