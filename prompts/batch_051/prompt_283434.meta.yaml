  As a retired natural scientist—I spent most of my career in physical chemistry—I
  have recently been reading philosophy of mind, and one argument keeps troubling
  me. It is built around the well-known Chase–Sanborn coffee-tasting example, though
  I want to reconstruct it in my own words to see whether it is sound. It seems to
  show that qualia, understood as intrinsic and directly knowable qualitative properties
  of experience, are an incoherent posit. That conclusion is too strong, but I cannot
  find the step that fails.


  Here is the argument:


  (1) If a quale is a real, intrinsic, private qualitative property of an experience,
  then a competent subject can, under cognitively favorable conditions, tell whether
  that property has changed or remained the same across two experiences.


  (2) In the Chase–Sanborn case, two expert coffee tasters both report a change in
  their assessment of the same coffee. One attributes the change to his standards
  having become more demanding, while insisting that the coffee tastes exactly the
  same to him as it always did. The other attributes the change to a shift in the
  taste itself, while insisting that his standards have not moved.


  (3) No further behavior, verbal report, or physiological measurement could settle
  which taster is right, because any additional evidence would itself need to be interpreted
  either as revealing a change in standards, a change in the experience itself, or
  a change in the subject''s access to or memory of the experience.


  (4) Therefore the distinction between "the taste itself changed" and "my standards
  changed" is not a distinction between two independently discoverable states of affairs.


  (5) If that distinction is not independently discoverable, then the supposed quale—the
  very taste property that was introduced to explain the difference—has no stable
  identity conditions and is doing no genuine explanatory work.


  (6) Therefore we should abandon qualia.


  (7) But this proves too much. The same style of reasoning would apply to a patient
  who says "the pain changed from sharp to dull" or a subject in a psychophysics experiment
  who says "the patch now looks more orange than red." In each case we could reinterpret
  the report as a change in the subject''s standards for applying words rather than
  a change in the experience itself. Yet we do not think such first-person reports
  are systematically meaningless or merely about word use.


  (8) Since that is unacceptable, something must have gone wrong in (1)–(6).


