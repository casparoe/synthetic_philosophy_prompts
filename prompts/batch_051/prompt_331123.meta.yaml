  Madhyamaka (Middle Way) of Nāgārjuna: Emptiness (śūnyatā) is the absence of inherent
  existence (svabhāva) in all phenomena. The tetralemma: for any proposition about
  ultimate reality, all four possibilities — it is, it is not, both, neither — are
  to be rejected. This is often applied to the world''s existence: the world is not
  existent, not nonexistent, not both, not neither. The point: our conceptual categories
  cannot capture ultimate truth. But Madhyamaka insists emptiness is not a view (dṛṣṭi);
  if you treat emptiness itself as an ultimate position or as a thing with essence,
  you''re caught. "Emptiness of emptiness": emptiness is itself empty. Also, conventionally,
  things exist and function: Nāgārjuna doesn''t deny everyday truth (saṃvṛti-satya);
  he denies that anything has ultimate, independent existence. So emptiness ≠ nonexistence;
  it''s about lacking intrinsic nature. Also the tetralemma rejection can look like
  rejecting the law of excluded middle? It''s not merely a truth-functional logic
  issue; it''s a rejection of the adequacy of any conceptual formulation. Some interpreters
  link to relevance logic or paraconsistent analysis. But I don''t need that.


