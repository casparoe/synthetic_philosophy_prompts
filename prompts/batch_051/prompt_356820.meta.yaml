  5. A used-car dealer tells the hearer that a car''s engine is in excellent condition.
  The hearer has no independent inspection, and is aware of the dealer''s incentives.
  The professor says not justified.

  6. A forensic accountant gives expert testimony about a company''s books. The juror
  cannot follow the analysis but knows the witness''s credentials have been examined
  and accepted by the court. The professor says justified.


  The scene I am currently drafting is this. My protagonist is at an airport bar in
