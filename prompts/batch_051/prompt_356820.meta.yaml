  2. A stranger in a café volunteers a one-sentence tip that a particular stock will
  double the next day. The hearer knows nothing about the stranger or the market.
  The professor says the hearer is not justified in believing it.

  3. A nine-year-old believes her father''s assurance that a certain museum is open
