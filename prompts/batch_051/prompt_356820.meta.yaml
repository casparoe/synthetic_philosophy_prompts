  I am a novelist, and for the past several months I have been sitting in on a university
  epistemology seminar in order to make the protagonist of my current novel — a defense
  attorney — think about testimony in a way that feels professionally earned rather
  than borrowed from courtroom clichés. The professor is a case-by-case thinker, and
  I have recorded the following of her verdicts about whether a hearer justifiably
  believes what she is told. In each case the assertion is true, and the hearer has
  no independent evidence about the proposition itself.


  1. A stranger at a bus stop says that the next bus arrives at 3:15; the hearer has
  no evidence at all about this stranger''s reliability. The professor: the hearer
  is justified in believing it.

  2. A stranger in a café passes on a one-sentence tip that a certain stock will double
  the next day; the hearer has no evidence about the stranger or the market. The professor:
  the hearer is not justified in believing it.

  3. A young child believes her father''s assurance that a particular museum is open
  on Sundays; she has had little prior experience with his reliability but trusts
  him. The professor: justified.

  4. A rumor reaches the hearer through a chain of six acquaintances, each of whom
  was told by the previous one; she has no way to check any link. The professor: not
  justified.

  5. A used-car dealer tells the hearer that a car''s engine is in excellent shape;
  the hearer knows only what salespeople generally have at stake. The professor: not
  justified.

  6. A forensic accountant gives expert testimony about a company''s books; the juror
  cannot follow the analysis but knows the witness''s credentials were vetted by the
  court. The professor: justified.


  Now the case I actually care about, for a scene I am drafting: a woman at an airport
  bar, a complete stranger who sounds calm and competent, warns my protagonist that
  the bridge she is about to drive across was closed this morning for structural reasons.
  The stranger has no motive to deceive, but my protagonist has never been to this
  city, has no evidence about this particular stranger, and has no background beliefs
  about how reliable offhand infrastructure warnings from strangers tend to be. The
  warning turns out to be true.


  If I want to write the protagonist as someone who reasons the way the professor
  does, should she treat the warning as justified? The verdicts seem to me to pull
  in different directions: a default entitlement to trust testimony would give a yes,
  a stakes-sensitive requirement of positive evidence would give a no, and a reductionism
  about specific speaker-types might say yes only if I slip in some background. Which
  of these, or what other rule, best unifies the six verdicts? And if the six verdicts
  underdetermine it, what addition to my scene — or what separate case — would most
  cleanly settle whether she is running a defeasible default, a stakes-sensitive rule,
  or a reductionist rule?


