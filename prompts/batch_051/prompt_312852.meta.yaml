  Let me reconsider accuracy of git details:

  - Git object model: commits form a DAG; each commit points to parent(s); merge commits
  have ≥2 parents; branches are refs (pointers) to commits; HEAD points to the current
  branch (or commit).

  - Checkout moves working tree and HEAD to a commit, letting you "go back" in time.

  - Rebase rewrites commits so they are replayed onto a new base, producing a linear
