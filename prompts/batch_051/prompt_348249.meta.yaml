  No Free Lunch theorem (for supervised learning): For any two learning algorithms
  A and B, if one averages over all possible target functions f (uniformly), the expected
  off-training-set error of A equals that of B. Thus, no algorithm is universally
  superior; for every problem where A beats B, there is another where B beats A. This
  assumes a uniform distribution over all functions, which is often considered unrealistic
  because real-world problems occupy a tiny, structured subset. More nuanced formulations:
  "there is no free lunch" theorem was proven by Wolpert and Macready (1997) for optimization
  and extended. I won''t cite it; I''ll say "the no-free-lunch theorems in machine
  learning" — acceptable. I can describe: they show that, averaged across all possible
  target functions/no prior restrictions, every candidate learning rule has the same
  generalization performance; good performance on one class of tasks is exactly offset
  by bad performance on another. To get better-than-chance induction, one must build
  in assumptions that match the environment. This is accurate enough and doesn''t
