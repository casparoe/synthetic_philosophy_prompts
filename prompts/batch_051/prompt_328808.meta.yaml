  line to totalitarianism." Berlin was careful: he argued that the positive conception
  supports a "sleight of hand" and historically helped justify despotism, but he did
  not say there''s a straight-line, inevitable progression; he says the freedom "I
  am my own master" can be perverted into "I am a slave to my ''real'' nature." So
  "straight line" is a subtle overstatement. Also "positive liberty is the dangerous
  one" — he warned about it but also acknowledged the positive sense as genuine and
  valuable, and he himself said he didn''t want to abandon either. So "the dangerous
  one" is a slight overstatement.


  Error C: "Republican liberty ... essentially negative liberty with one qualification:
  the state may not interfere arbitrarily." The subtlety: republicanism cares about
  non-domination, not merely non-arbitrary interference. Domination is the capacity
  for arbitrary interference, which can exist without actual interference. So republicanism
