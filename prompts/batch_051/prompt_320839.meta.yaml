  Let me recall the preface paradox carefully.


  Lottery paradox (Kyburg): If you accept any hypothesis with probability > threshold
  (e.g., 0.99), and accept conjunctions of accepted hypotheses, then for a fair lottery
  with n tickets where each ticket has 0.99 probability of losing (n large enough,
  P(lose)=1 - 1/n > 0.99), you accept each "ticket i will lose." By closure under
  conjunction, you accept "ticket 1 loses and ... and ticket n loses." But you also
  know/accept "some ticket wins." Contradiction. So the set of accepted beliefs is
  inconsistent: you accept each ticket loses and accept that one wins.


  Preface paradox (Makinson): An author writes a book, rationally believes each sentence
  in it (after careful checking), but also believes, based on general fallibility/induction,
  that the book probably contains at least one error. So she rationally believes (each
  sentence) and (not all sentences true). The set is inconsistent.


  Standard responses: deny closure/conjunction; reject probability threshold account
  of rational belief; reject that rational belief sets must be consistent (some accept
  inconsistency); re-describe beliefs as degrees of belief rather than full belief,
  etc.


  The subtle confusion could be that the preface paradox shows we should hold outright
  contradictions (it doesn''t straightforwardly license that; the author doesn''t
  believe any specific sentence is false, only the existential claim; many argue her
  beliefs aren''t inconsistent in a blameworthy way, or she''s rational because fallibility
  evidence is about the whole, etc.). Also the lottery and preface differ: in the
  lottery, the evidence for each ticket losing is statistical and equally good, and
  the evidence for "some ticket wins" is known with certainty; in the preface, the
  author''s evidence for each sentence is specific and varied, and the evidence for
  "at least one error" is inductive/historical. Also in the lottery the contradiction
  arises from a purely statistical acceptance rule; in the preface, the author isn''t
  necessarily following a threshold rule.


