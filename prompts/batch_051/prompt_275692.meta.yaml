  Draft:


  "I''m putting together a statement of my considered position on objectivity in history
  for a seminar I''m leading with colleagues in history and philosophy, and I want
  an audit of my commitments before I circulate it. I''d rather not present a set
  of views that falls apart on inspection.


  The positions I find myself committed to are these:

  (1) Ranke was right to treat the past as a self-standing reality that the historian''s
  claims answer to; historical statements about events, agents, and causes are true
  or false independently of the historian, and the discipline aims at recovering the
  past as it actually was.

  (2) Carr was nonetheless right that historical facts are not simply lying in the
  record waiting to be collected: facts are constituted partly by selection, and the
  questions historians bring partly determine what counts as a fact in the first place.

  (3) Accepting Carr''s point about selection does not, in my view, conflict with
  (1), because selection is a matter of how we come to know the past, not what makes
  historical claims true.

  (4) Hayden White is right that the same documentary record can support more than
  one emplotment (tragedy, comedy, romance, satire), and that emplotment is not forced
  by the evidence in the way a conclusion is forced by a proof; a narrative form is
  not the sort of thing that is true or false.

  (5) But White overstates his case when he collapses the history–fiction distinction
  at the level of narrative: documentary constraints are more than rhetorical, and
  a great many emplotments can be ruled out as incompatible with what the sources
  establish.

  (6) I also believe — and here I worry — that there is no neutral, theory-free description
  of ''the facts'' that does the constraining in (5). Every factual description comes
  under concepts that already carry interpretive or, at the limit, narrative charge.

  (7) Finally, I hold that counterfactual claims in history (for example, that without
  Lenin there would have been no October Revolution) are objectively assessable, even
  though they have no direct documentary truth-maker.


  I want an audit in the following form: first identify the genuine tensions among
  these commitments and rank them by severity; then identify any apparent tension
  that dissolves on closer inspection; and for each genuine tension say what would
  minimally have to give and what it would cost the overall position. Finish by telling
  me which single revision you would recommend and why — I''m asking for your committed
  judgment, not a menu of possibilities."


