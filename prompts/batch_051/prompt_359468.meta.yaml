  Let me draft the friend''s summary:


  A philosophy friend summarized expressivism and the Frege–Geach problem as follows:


  "Expressivists think moral sentences don''t state facts and aren''t true or false;
  saying ''lying is wrong'' is just a way of emoting, like saying ''boo to lying!''
  — it expresses an attitude of disapproval rather than a belief. The Frege–Geach
  problem is that this can''t be right, because the very same words ''lying is wrong''
  can appear inside a conditional like ''if lying is wrong, then getting your brother
  to lie is wrong'', where the speaker isn''t expressing disapproval of lying at all.
  Since the meaning of the whole sentence is built out of the meanings of its parts,
  the expressivist''s story about ''lying is wrong'' doesn''t carry over to the embedded
  occurrence, so the expressivist has no account of what the conditional means. Worse,
  expressivists can''t explain why arguments like ''if lying is wrong, then getting
  your brother to lie is wrong; lying is wrong; therefore getting your brother to
  lie is wrong'' are valid. Frege and Geach pointed all this out, and most people
  now agree it shows expressivism is refuted, since moral reasoning is just ordinary
  logical reasoning."


  Then the asker continues: I''m taking a metaethics seminar (or discussing with a
  friend at law school...). The friend is confident, but something seems suspicious.
  I''m inclined to believe the "not true or false" part must be right — isn''t that
  what expressivism says? But I''ve also heard that modern expressivists like Blackburn
  tried to earn back truth talk, and that no one thinks the problem outright refutes
  the view; so I don''t know where to push. Can you go through the summary claim by
  claim, separate what is accurate, simplified, overstated, or wrong, and tell me
  which of my friend''s conclusions actually follow. Also, are there commitments expressivists
  actually need but the summary omits? And if I''m wrong to be suspicious, say so.


