  the claim that moral sentences are not descriptive but express non-cognitive states;
  many expressivists deny moral judgments have truth conditions or are beliefs. However
  the summary''s "and aren''t true or false" is a common simplification/overstatement
  because quasi-realists/minimalists allow deflationary truth talk; but it''s not
  simply wrong—depending on stripe. The audit could mark it as contested/simplified.
