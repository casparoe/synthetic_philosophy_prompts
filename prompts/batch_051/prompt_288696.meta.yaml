  as the thesis is partly stipulative (functional taxonomy is a modeling choice) and
  the real payload is the normative claim that psychological explanations need not
  track physical disjunctions. Is that a problem? Perhaps not for a taxonomic choice;
  it is if one insists MR is an empirical discovery licensing anti-reduction.


