  Functionalism/MR exposure map:

  - What would decide it empirically? If we actually found that the same mental property
  correlates rigidly with a single neural property across every organism that has
  it — but functionalists would say the mental kind was mischaracterized or that "neural
  property" is itself gerrymandered.

  - The grain objection (Bechtel & Mundale): multiple realization is an artifact of
  comparing two different grains of description. Psychology individuates coarse, neuroscience
  fine; at the same grain, kinds converge. If the neuroscience of fear or memory maps
  one-to-one onto psychological categories across species, that undercuts the empirical
  premise.

  - Triviality / universal realizability (Polger and Shapiro): if every property is
  multiply realizable at some grain, MR doesn''t get you anything specifically about
  minds. The defender may restrict to "relevant" grains and "properly typed" realizers,
  but what fixes relevance? If relevance is fixed functionally, the claim is circular/definitional.

  - The collapse dilemma: either mental kinds are functional kinds (and MR is analytic)
  or they''re realized kinds tied to their physics (and MR is a contingent finding
  at best). If it''s analytic, the empirical evidence is irrelevant; if empirical,
  it''s a bet.

  - Autonomy of psychology doesn''t follow: MR of a kind doesn''t by itself threaten
  reduction; reduction could proceed via domain-specific, token-level identities or
  grounded on the disjunction of realizers (Kim''s point). To save non-reduction,
  the functionalist needs more than MR.

  - Cases where neural details enter the functional description: memory consolidation,
  pain''s distinct neural syndromes (nociceptive vs neuropathic) may require the kind
  "pain" to be split, suggesting that the right-level kinds are not substrate-neutral.

  - Alien and robot cases: our intuitions stem from conceivability, not actual evidence;
  if actual "non-carbon" cognitive systems never arise in the reachable universe,
  or if the only feasible realizers of cognition are metabolically constrained to
  be very similar, the practical significance of MR shrinks. But that''s not a defeater
  for the metaphysical thesis.

  - Defenders would concede that specific empirical claims (e.g., "the same algorithm
  discriminates in humans and octopuses") can be refuted; they''d dismiss grain mismatch
  as talking past the functional kind; they''d treat triviality as demanding a theory
  of implementation/relevance, which they may regard as work-in-progress rather than
  refutation.

