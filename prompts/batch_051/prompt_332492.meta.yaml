  argumentative pattern.


  The move goes like this. In an argument about, for example, whether a student has
  done something wrong by downloading a textbook, someone will begin by saying that
  the author is being robbed, or that the copy is stolen property; when I point out
  that copying does not remove the author''s possession, the person shifts, without
  acknowledging the shift, to saying that if nobody paid for textbooks authors would
  not write them. When I then point out that the evidence for that claim is contested,
  or that this is at most a reason for society to set up some limited reward, not
  a reason to treat the copy as stealing, the person shifts back to saying that the
  work belongs to the author and that taking its use without permission is a violation
  of a right, as if that had already been established. I have seen a structurally
  identical dance in arguments about drug patents, fan fiction, and music streaming.
  Each time, the defender moves between two different kinds of claim: a claim that
  ideas and expressions are property in some natural, pre-legal, ownership sense,
  and a claim that we grant exclusive rights only as an incentive because it is useful
  to do so. Each justification is a full-strength, substantive claim; the first is
  not a weaker or more defensible core, and the second is not a fallback that the
  speaker is retreating to under pressure so much as a second weapon.


