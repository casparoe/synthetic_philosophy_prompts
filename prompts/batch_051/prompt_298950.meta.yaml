  agents may pursue goals. A deontology that instructed agents to minimize murders
  would no longer be agent-centered; it would collapse into a form of consequentialism
  about murders. So the arithmetic "five vs. one" presupposes an agent-neutral lens.

  (ii) Agent-relativity: the reason I must not kill is not "killing is bad" (agent-neutral)
  but "I must not kill" (agent-relative), so another person''s killing is not something
  I violate a constraint by failing to prevent. This distinguishes my agency from
  mere state-of-affairs badness.

  (iii) Dirty hands / "wrong but required": maybe in some threshold cases the agent
