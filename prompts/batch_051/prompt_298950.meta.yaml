  The paradox of deontology: If it is always wrong to kill an innocent person, then
  in a case where a villain will kill five innocents unless our agent kills one, the
  agent is forbidden to kill the one and the five die. But then the constraint against
  killing seems to permit (or produce) more killing. How can that be if the constraint
  reflects the disvalue of killing? The paradox forces deontologists to explain why
  they are not committed to minimizing violations of the constraint.


