  Causal exclusion argument: Kim argues: If mental property M is distinct from physical
  property P, and both are sufficient for a behaviour B at time t? More precisely,
  the argument: (1) mental causation requires M to be a cause of physical effect B.
  (2) Physical causal closure: every physical event has a sufficient physical cause
  P (B''s physical cause). (3) Exclusion: if P is a sufficient cause of B, no distinct
  cause M is needed, unless there''s overdetermination. (4) ... conclusion: M is epiphenomenal,
  or M=P (reductive physicalism), or overdetermination (implausible). This is well-known.


