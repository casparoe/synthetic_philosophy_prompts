  Potential prompt text:


  "I spent last evening arguing with an old friend who works in philosophy of medicine.
  I work as a [machine learning scientist / clinical data scientist], and I kept wanting
  to translate everything he said into the vocabulary of classifiers: features, thresholds,
  decision boundaries, label noise, training distribution, precision/recall, calibration.
  He insisted something was being lost. I want someone to do that translation carefully
  for me and then tell me which of us was right to worry.


  Take the debate between naturalism and normativism about concepts of health and
  disease. On the naturalist side, roughly: disease is a statistical deviation from
  species-typical biological function within a reference class (age, sex), a value-free
  fact that medicine discovers. On the normativist side, roughly: classifying a condition
  as a disease always involves a judgment that the condition is bad/harmful/disvalued
  for the person (or that treatment is warranted), so the category is partly evaluative.
  My target vocabulary is the one I use daily in building diagnostic and risk models:
  features and labels, threshold choice on a risk score, base rates and reference
  populations, label noise, construct validation against multiple operational criteria,
  and the distinction between a model''s summary statistic and the decision rule built
  on top.


  Please restate each position, and the dialectic between them, in that vocabulary
  as faithfully as you can. In particular, where do the naturalism/normativism disputes
  show up as disputes over (a) whether the label ''disease'' corresponds to a natural
  class or a decision boundary we impose, (b) what the reference population should
  be and why, (c) whether ''harm'' is a property we can measure and whether excluding
  it is possible, and (d) whether there is such a thing as the true label independent
  of use? Then give me the residue report: what translated cleanly, what needed to
  be distorted, and what has no expression at all in my vocabulary. I especially want
  to know whether my friend was right that the evaluative ingredient is irreducible,
  or whether my vocabulary shows that the disagreement is partly about threshold-setting
  dressed up as ontology. Frame your conclusion as a verdict on which residue is real."


