  Pascal''s wager original (roughly): If God exists and you believe, infinite reward;
  if God exists and you don''t, infinite punishment; if God doesn''t exist, finite
  costs either way. Expected utility says believe because infinite × any positive
  probability = infinite. The standard objections: many gods, can''t just choose beliefs,
  etc. The variation: The wager usually treats "belief" or "faith" as the thing God
  rewards. But James (epistle) emphasizes works: faith without works is dead. Paul
  emphasizes faith/grace apart from works. So change the parameter: what if the payoff
  depends on works rather than professed belief, or on a combination? Then the decision
  becomes not "believe vs not believe" but "how much effort to put into works." And
  the expected utility changes: you can''t just flip a mental switch; works are costly,
  continuous, observable, maybe subject to diminishing returns. Also if salvation
  requires works, then the wager becomes about how to allocate finite effort among
  possible divine criteria (different gods, faith+works etc.). Also whether "works"
  done for self-interested wager reasons count? That''s like the objection that Pascal''s
  wager produces mercenary faith; James might say faith without works is dead, but
  works without genuine faith? The prompt could ask: Does the standard expected-utility
  argument survive? Does it now recommend a life of good works instead of mere belief?
  What does the James/Paul dispute imply for the wager?


