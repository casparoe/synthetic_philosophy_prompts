  As a novelist I keep returning to a structural comparison, and I want to know whether
  it is deep or merely decorative.


  Schopenhauer treats compassion as the sole genuine moral motive. It works, on his
  account, only when the principium individuationis is momentarily seen through and
  I grasp the other''s suffering as not ultimately distinct from my own; the boundary
  between the two subjects is dissolved. Nietzsche''s worry about pity is that this
  apparent dissolution is either a sham or a pathology. Sometimes he describes the
  pitier as secretly experiencing his own superiority over the sufferer, so that pity
  preserves or even sharpens the hierarchy it pretends to erase. Sometimes he describes
  pity as an infection in which the pitier suffers along with the sufferer, so that
  the world''s stock of suffering is multiplied rather than relieved. On both readings,
  what Schopenhauer calls a selfless fusion is not the moral achievement he takes
  it to be.


