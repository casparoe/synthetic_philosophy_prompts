  autonomous systems so finely across designers, operators, vendors, fleet supervisors,
  and corporate entities that no human and no entity is answerable: the responsibility
  gap that opens when a learning system does something no single person predicted
  or intended. The postmortem should show, rather than state, why this diffusion is
  philosophically suspicious. To do that:


  - Include a "contributing factors" section listing many individually reasonable
  handoffs that jointly erase accountability: a perception engineer who chose the
  loss function, a supplier''s pretrained model, a remote operator monitoring twelve
  vehicles at once, the municipal infrastructure, an edge-case reviewer, and a planning
  policy described as "emergent." Each involvement should be causally real but designed
  so that no one''s contribution is sufficient for blame.

  - Work in the ideas — without naming them — of a moral crumple zone (the human operator
  absorbing more legal and moral force than their actual control warrants), the many-hands
  problem (blame dissolving across many contributors), and the gap between causal
  contribution and answerability.

  - Include a safety statistic that compares aggregate fleet collision rates to the
  human-driver baseline while remaining silent about who, if anyone, would have been
  liable in this case.

  - And end with a metric or company line that turns the absence of a responsible
