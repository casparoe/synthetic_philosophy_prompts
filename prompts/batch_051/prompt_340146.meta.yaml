  Write a deadpan corporate incident postmortem (roughly 650 words) from Fretless,
  a fictional last-mile autonomous-delivery company, after one of its Level-4 vans
  struck a pedestrian in a crosswalk. The injuries are minor; the postmortem is the
  company''s public "Trust and Safety" writeup, written in the soothing idiom of a
  "blameless" engineering retrospective.


