  their real features rather than inventing cartoon villains: at every step, a reader
  should feel that the reported practice is only a slightly deformed version of how
  responsibility actually gets distributed around automated systems. Someone unfamiliar
  with the responsibility-gap debate should find the piece readable and disturbing;
