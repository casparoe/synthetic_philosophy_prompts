  ---


  I have been trying to pin down when it is permissible to impose a small risk on
  people without their consent, and I have provisionally adopted five conditions.
  On my view, an unconsented risk imposition is permissible only if each of the following
  holds:


  1. Proportionality: the expected harm to any individual is small in comparison with
  the expected benefits of the risky activity.

  2. Dispersion: the risk is spread over roughly the same population that receives
  the benefits, rather than concentrated on a subgroup that has little to gain.

  3. No reasonable alternative: there is no feasible way to avoid the risk, or to
  obtain the consent of those exposed, without excessive cost.

  4. Reciprocity: those imposing the risk would accept it if they did not know which
  position they would occupy, whether as a beneficiary or as a member of the exposed
  population.

  5. Redress: if the risk materializes, there is a workable mechanism for compensating
  or repairing the harm.


  Now consider the following case, described here in general terms. A consortium of
  public research institutions and governments proposes a one-year, small-scale field
  trial of stratospheric aerosol injection. Aircraft would release a modest quantity
  of reflective particles into the upper atmosphere over a remote ocean, in order
  to study how the particles spread, interact with atmospheric chemistry, and affect
  local temperature and cloud formation. The release would be tiny compared with what
  would be needed to alter global climate, but it would impose a very small, diffuse
  risk of altered precipitation, slightly increased surface ultraviolet exposure in
  some regions, and other effects that are difficult to predict in advance. The main
  benefits would consist of scientific knowledge about a technology that might later
  be used to slow warming; these benefits would be global, but they would be felt
  mainly by research institutions, governments, and future generations. Suppose, further,
  that the consortium''s own modeling suggests that the largest changes in precipitation
  would be concentrated in a band of the Southern Hemisphere, while most of the immediate
  benefits would accrue elsewhere. It is not feasible to obtain consent from the billions
  of people exposed, and modeling alone cannot answer the questions the trial is designed
  to answer. Finally, because any observed weather or health effect could have occurred
  without the release, it would be nearly impossible to prove in an individual case
  that the trial caused a particular harm, so a compensation scheme could not be reliably
  targeted at those actually harmed.


  Go through the five conditions in order, and say for each whether the trial satisfies
  it, plausibly satisfies it, or fails it, and why. Then answer two questions. First,
  does the trial qualify as a permissible unconsented risk imposition under the five
  conditions as stated? Second, does the case expose a defect in the conditions themselves
  — for instance, is one of them an attractive proxy that fails for risks that are
  extremely diffuse and causally untraceable, or is there a weighty consideration
  in the case, such as the effect of the trial on future decisions about deployment,
  that none of the five conditions captures? If so, say which condition should be
  revised or replaced, and with what.


