  Draft:


  I have been trying to pin down when it is permissible to impose a risk on people
  without their consent, and I have provisionally settled on five conditions. On my
  tentative view, an unconsented risk imposition is permissible only if:


  1. Proportionality: the expected harm to any individual is small when weighed against
  the expected benefits of the activity.

  2. Dispersion: the risk is spread over roughly the same population that receives
  the benefits, rather than concentrated on a subgroup with little to gain.

  3. No reasonable alternative: there is no feasible way to avoid the risk, or to
  obtain consent, without excessive cost.

  4. Reciprocity: those imposing the risk would accept it if they did not know which
  position they would occupy — for example, as a member of an exposed population or
  a beneficiary.

  5. Redress: if the risk materializes, there is a workable mechanism to compensate
  or repair the harm.


  Now consider the following case. A consortium of public research institutions and
  governments proposes a one-year, small-scale trial of stratospheric aerosol injection:
  aircraft would release a modest quantity of reflective particles into the upper
  atmosphere over a remote ocean to study how the particles spread, interact with
  atmospheric chemistry, and affect local temperature and cloud formation. The injections
  would be tiny compared with what would be needed to alter global climate, but they
  would impose a very small, diffuse risk of altered precipitation, slightly increased
  surface ultraviolet exposure in some regions, and other effects that are currently
  hard to predict. The benefits would consist mainly of scientific knowledge about
  a technology that might later be used to slow warming; they would be shared globally
  and unevenly. The risk cannot be localized with confidence, and it is not feasible
  to obtain consent from the billions of people who would be exposed. Modeling alone
  cannot answer the questions the trial is designed to answer. Because any observed
  weather or health effect could have happened without the injection, it would be
  nearly impossible to prove in an individual case that the trial caused a particular
  harm, so compensation could not easily be targeted to those actually harmed.


  Work through the five conditions in order and say, for each, whether the trial satisfies
  it, plausibly satisfies it, or fails it, and why. Then answer two questions. Does
  the trial qualify as a permissible unconsented risk imposition under my criteria?
  And does the case expose a defect in the criteria themselves — for instance, is
  one of the conditions merely an attractive proxy for something else, or is one of
  them unsuitable for risks that are extremely diffuse and causally untraceable? If
  so, state which condition should be revised or replaced and with what.


