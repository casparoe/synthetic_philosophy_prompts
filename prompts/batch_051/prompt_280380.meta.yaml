  Let''s craft prompt:


  "Charles Peirce opens ''How to Make Our Ideas Clear'' (Popular Science Monthly,
  1878) by examining the logicians'' first distinction: ''A clear idea is defined
  as one which is so apprehended that it will be recognized wherever it is met with,
  and so that no other will be mistaken for it. If it fails of this clearness, it
  is said to be obscure.'' He then treats this as insufficient and spends the essay
  developing a stronger pragmatic criterion. My question is about how much distance
  that later criterion really puts between Peirce''s view of truth and William James''s.
  Please rank the following three statements from most to least defensible, and give
  each a score out of 10: (1) James''s satisfaction/cash-value account of truth is
  a natural extension of Peirce''s clearness rule; (2) Peirce''s long-run-convergence
  account of truth and James''s account are rival theories that cannot both be right;
  (3) the opening passage already shows the fault line, because James would accept
  ''clear'' as sufficient in ordinary cases while Peirce would not. Tie your ranking
  to the passage and to what each thinker thinks a concept''s whole content amounts
  to."


