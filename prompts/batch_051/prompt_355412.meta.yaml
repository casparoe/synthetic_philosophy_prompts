  The debate: Is evolution a "stupid optimizer," and does the comparison with gradient
  descent cut for or against that? Or more precisely: what can gradient descent (GD)
  and natural selection (NS) learn from each other, and is the analogy illuminating
  or misleading?


  Possible positions:

  - One side (call her Maya): evolution is more like an optimizer than people give
  it credit for; it''s doing something akin to stochastic gradient descent over a
  rugged fitness landscape. The key difference is just the credit assignment mechanism:
  GD gets exact gradients via backprop through a differentiable compute graph; NS
  only gets noisy, local, implicit fitness gradients (or even just rank-order selection).
  But the core idea — iteratively improving a population of parameters by moving downhill
  in some loss/fitness space — is the same. So the analogy is deep, not superficial.
  "Evolution is a stupid optimizer" is wrong: it''s a clever optimizer with terrible
  hardware and no backprop.


  - Other side (call him Dan): No, the analogy breaks exactly at the points that matter.
  Natural selection doesn''t have gradients at all in the relevant sense: a genotype
  is a discrete string, mutations are one-off jumps, and fitness is not a differentiable
  function of the genotype. So "moving downhill" is a metaphor we impose, not a process
  that happens. Also NS optimizes against a non-stationary objective: the fitness
  landscape changes because other organisms evolve (coevolution) and environments
  shift. Most importantly, GD is optimizing a single fixed loss by design, whereas
  NS has no design and no target; the appearance of optimization is retrospective.


  Maya counters: discrete vs continuous is a red herring—there are discrete analogues,
  and even continuous GD is approximated in discrete steps; what matters is whether
  there''s a gradient-like signal, and selection coefficients are exactly that: local
  estimates of how fitness changes with a trait/value. Also coevolution is just an
  online/multi-agent setting; we have those in ML too (GANs, self-play), and nobody
  says a GAN isn''t optimizing. The "no target" point is about teleology, not optimization:
  an optimizer doesn''t need an intentional target, it needs a selection mechanism
  that correlates with some fitness measure. So the analogy survives.


  Dan: but the correlations are the problem. In GD, the gradient is the direction
  of steepest improvement of one fixed function evaluated at the current point; in
  NS, selection is a filtering step that is blind to why a variant did better, so
  it can''t disentangle direct from indirect causes, and it can''t exploit the smooth
  local structure because there isn''t any local structure to exploit—one mutation
  can completely change the phenotype. That''s not a hardware limitation, it''s an
  absence of the information GD requires. So evolution isn''t an optimizer at all
  in the same sense; it''s a generator-and-filter that drifts toward whatever currently
  persists. Calling it an optimizer smuggles in the exact assumptions that make GD
  work.


  Maya: but that''s too quick, because the whole point of the analogy is to identify
  the minimal conditions under which any process can do optimization, and separating
  "what GD does" into (a) a variation mechanism, (b) a selection/retention mechanism,
  and (c) some measure that correlates with improvement, then asking which of these
  are necessary, is literally how you learn something from the comparison. The lesson
  isn''t "evolution is gradient descent," it''s that GD is one point in a family of
  variation-selection algorithms, and NS is another; the interesting question is what
  properties of the landscape and the variation operator make selection-based search
  efficient, and that question is shared by both fields. So the people who say "stupid
  optimizer" are just pointing at the inefficiency of a particular selection operator;
  the people who say "not an optimizer" are confusing the map with the territory.


