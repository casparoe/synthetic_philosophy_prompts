  "I''m taking a course on philosophy of biology, and we''ve just finished the unit
  on the tautology objection to the principle of natural selection. I have a small
  assignment for our department''s informal ''jokes that teach'' night, and I want
  to produce something that actually respects the distinctions. As I understand the
  dispute: the tautology objection says that treating ''the fittest survive'' as a
  scientific claim is empty because fitness, on the naive view, just is whatever leads
  to actual survival and reproduction. The propensity interpretation replies that
  fitness is a real probabilistic disposition—an organism''s expected tendency to
  survive and reproduce in a specified environment—so ''fitter'' and ''survived''
  are not the same concept, and the claim is not tautological. The delicate part is
  that we can still only infer propensities from actual outcomes across a range of
  conditions, which is why the objection keeps returning in practice.


