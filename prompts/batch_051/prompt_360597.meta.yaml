  Gödelian self-reference have the same underlying structure, with a strand of DNA
  playing the role of a sentence that refers to its own provability. I''ve been reading
  rationalist forums long enough to have seen this analogy treated as profound and
  also to have seen it dismissed as a suggestive metaphor; I haven''t seen anyone
  actually pry apart the different things it might mean.


  My suspicion is that the analogy quietly bundles three separable claims: (a) that
  replication is an instance of self-reference; (b) that a self-replicating string
  is a fixed point of a copying function, the way a Gödel sentence is a fixed point
  of a provability predicate; and (c) that what matters in both cases is that the
  object is described rather than directly duplicated. I suspect the three readings
  come apart, and that the question of which one is load-bearing changes what the
  analogy licenses. In particular, I want to know whether the genuinely load-bearing
  reading is more permissive than the usual story suggests — for example, whether
  it predicts that error-prone replication and mutation are not a disanalogy but exactly
