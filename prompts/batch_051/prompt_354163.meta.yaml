  Full draft:


  "I am trying to discover what principle actually governs when it is legitimate to
  hold a belief on less than decisive evidence. The familiar contrast between thoroughgoing
  evidentialism and the more permissive attitude toward belief associated with William
  James does not, by itself, settle how I should judge particular cases, and I find
  that my reactions to concrete cases outrun any simple principle I try. By legitimate
  I mean that the person is not blameworthy for the belief and the belief does not
  violate an epistemic duty; I do not mean that it is true, or that it would meet
  an evidentialist''s standard. Here are the cases, with my own verdicts:


  1. A juror in a criminal trial with roughly balanced evidence concludes that the
  defendant is not guilty because the defendant''s manner reminds her of her own grandchild.
  I judge this not legitimate: the juror''s office requires her to be moved only by
  the evidence presented.


  2. A spouse discovers ambiguous messages that could indicate an affair, and the
  total evidence is close to balanced. The spouse believes the partner is faithful,
  partly because trust is constitutive of the relationship and partly from a sensed
  knowledge of the partner''s character. I judge this legitimate, and not merely excusable.


  3. A scientist believes her hypothesis is true before the decisive experiment even
  though her colleagues put the odds near one in five, and the belief is what keeps
  her working on a five-year study. I judge this legitimate, provided she updates
  honestly when the results arrive.


  4. A patient with a serious illness believes he will recover on evidence his doctor
  calls genuinely equivocal, because hope improves his chances. I judge this legitimate,
  but it feels different from the scientist''s case, and I cannot yet say how.


  5. A parent believes her daughter did not commit the crime of which she is accused,
  despite strong public evidence, on the ground that she knows the daughter''s character
  from a lifetime. I judge this legitimate, but I also think it looks worryingly close
  to the juror''s case, and I cannot yet state the difference.


  6. A person continues to hold a claim that has already been refuted by well-established
