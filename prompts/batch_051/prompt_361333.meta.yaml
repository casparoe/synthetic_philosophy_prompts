  Wrong kind of reasons: Standard problem for "buck-passing" or fitting-attitude accounts
  of value. The FA account: X is good/valuable iff there are reasons to have a pro-attitude
  toward X (desire, admire, respect). But there can be reasons to have pro-attitude
  that don''t indicate value — e.g., a demon says "admire this worthless saucer or
  I''ll kill your family." That''s a reason to admire the saucer, but it doesn''t
  make the saucer good. So the analysis overgenerates.


  The standard fix: restrict to "object-given" reasons (reasons that cite features
  of the object) rather than "state-given" reasons (reasons that cite features of
  the attitude state, e.g. that admiring is prudent). But the WKR literature (e.g.,
  Danielsson & Olson, Rabinowicz & Rønnow-Rasmussen) argues this distinction is hard
  to draw without invoking the value of the object. E.g., is "he will be pleased if
  you admire him" an object-given reason (it''s about him?) or state-given? Threatening
  demon creates reasons that concern the state of admiring (avoiding punishment),
