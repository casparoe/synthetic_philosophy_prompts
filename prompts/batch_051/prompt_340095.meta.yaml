  Domain: hole argument. Type: recount a disagreement and adjudicate.


  Setup: two grad students, Mina and Sam, in a reading group argued about whether
  the hole argument shows that spacetime substantivalism is untenable.


  The back-and-forth:

  - Mina: The hole argument shows that if you think spacetime points are real things
  and the metric field is a property of them, then any solution of GR can be pushed
  through a smooth transformation that''s the identity outside a region (the "hole")
  and differs inside. That gives two distinct states of affairs—different points carrying
  different metric values—that agree on all observations, past, present, future. Since
  GR''s laws don''t pick one, substantivalism entails radical indeterminism: the same
  observable history has countless physically distinct continuations. That''s absurd,
  so substantivalism as a view has to go.

  - Sam: The indeterminism only arises because you''ve smuggled in a non-physical
  notion of which point is which. The two mathematical models are descriptions of
  the same physical situation; the difference is merely representational. So a substantivalist
  can avoid indeterminism by denying that points have primitive identities—what matters
  is the pattern of metric relations, not which point carries them.

  - Mina: But that''s just relationism in substantivalist clothing. If you say nothing
  over and above the metric relations makes a spacetime point the point it is, then
  in what sense do points exist at all? You keep the word ''point'' but drop the thing
  it was supposed to name.

  - Sam: Not so. Points are the relata of the metric field—you need something to be
  curved, or to be at distance relations. Denying haecceities doesn''t mean denying
  the relata themselves; it means refusing to distinguish two relata that differ only
  by which bare point plays which role. That''s a different ontology, not a renaming
  of yours.

  - Mina: Fine—but then the view no longer does the work substantivalism was meant
  to do, namely explaining why the manifold is a real container rather than an abstraction
  from relations. If all that survives is the pattern, the hole argument''s original
  target is dead.


