  Vagueness and sorites: The standard paradox: one grain not a heap, adding one grain
  never turns non-heap to heap, but eventually a heap exists. The issue is about sharp
  cutoffs, bivalence, higher-order vagueness, etc. The parallel: In statistical mechanics,
  phase transitions (water freezing, magnetization) — at the microscopic level, all
  thermodynamic quantities are smooth functions of temperature for finite systems;
  no single molecule "freezes" at 0°C. The sharp phase transition exists only in the
  infinite-size limit (thermodynamic limit), via symmetry breaking. In finite systems,
  the transition is smeared but becomes arbitrarily sharp as N grows. So the distinction
  between solid and liquid is, in one sense, vague at the level of individual molecules
  but effectively sharp at the macro level.


  The parallel: heap is like a phase — it emerges from many grains; there''s no grain
  at which it appears; yet the predicate "heap" is still usable and perhaps even objectively
  applicable at the macro level. Is this a genuine structural identity — that vague
