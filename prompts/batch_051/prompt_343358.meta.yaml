  Argument: Let me refine to be subtle and genuinely discussable.


  1. A person may justly be punished for breaking a criminal law only if, at the time
  they acted, they had a fair opportunity to avoid the violation.

  2. Someone has a fair opportunity to avoid a violation of a law only if the content
  of that law was knowable to them with reasonable diligence.

  3. Large swathes of contemporary criminal regulation — environmental, financial,
  and administrative offences, whose rules sit partly in statutes, partly in agency
  guidance, and partly in unpublished enforcement practice — are not knowable to an
  ordinary person with reasonable diligence, because there is no single accessible
  place where the rule is stated, and the conduct is not wrong independently of the
  rule.

