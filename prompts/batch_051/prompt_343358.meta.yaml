  avoid the violation.

  5. Hence, punishing ordinary people for those violations is unjust.

  6. But courts do punish ordinary people for such violations, on the ground that
  ignorance of the law is no excuse.

  7. Therefore, in those cases, the maxim that ignorance of the law is no excuse is
  being used to justify unjust punishment.


