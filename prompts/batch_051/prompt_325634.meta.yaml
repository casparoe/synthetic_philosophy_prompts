  List commitments:

  1. I think a competent adult has the right to refuse medical treatment, even when
  it clearly shortens their life.

  2. I think an advance directive should be binding even if, by the time it applies,
  the patient would now refuse — even if they actively resist. (Maybe that''s what
  an "advance directive" means; make it stronger: the earlier self''s wishes are authoritative.)

  3. I think the justification for all this can''t be that the current patient is
  better off physically, since some refusals kill you. It has to be about the person''s
  own authority over their life, their autonomy.

  4. I think autonomous choices express a person''s settled values, not their passing
  desires, so not every free act counts as autonomous.

  5. But I also think if someone with dementia is genuinely content and comfortable
  now and wants to stay alive now, that matters just as much as what they once wrote
  down — it''s not fair to call the later self not a real person or whatever.


