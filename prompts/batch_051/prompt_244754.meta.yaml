  Jeffrey conditionalization: Richard Jeffrey''s probability kinematics. Standard
  Bayesian conditionalization: upon learning E with certainty, P_new(H) = P_old(H|E).
  But often evidence is uncertain: you don''t learn E with certainty; your probability
  for E shifts to some value q (between 0 and 1) due to an experience (e.g., the appearance
  of the cloth in dim light). Jeffrey conditionalization says: P_new(H) = q * P_old(H|E)
  + (1-q) * P_old(H|~E). More generally, for a partition {E_i} with new probabilities
  q_i, P_new(H) = sum_i q_i * P_old(H|E_i). It assumes rigidity: conditional probabilities
  given the elements of the partition remain unchanged.


