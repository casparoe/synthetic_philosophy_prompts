  Potential prompt text:


  "One of Bernard Williams''s best-known examples runs roughly like this: a man sees
  two people drowning, one of whom is his wife, and can save only one; he saves his
  wife. Williams''s worry is that if the man had to run through an impartial moral
  justification before acting — for example, reaching the thought that saving his
  wife is permissible here, or that in such cases it is morally acceptable to favour
  one''s own — that very thought would be one thought too many. The extra thought
  does not change the outward action, but it is supposed to reveal, and perhaps constitute,
  a kind of alienation or a failure of the relationship and of the agent''s integrity.
  The claim is a conceptual-moral one: a feature of the agent''s deliberative field
  (the presence of a certain justifying thought) infects the quality of the action
  or the relationship even when the act is identical.


  I want to know whether, and to what extent, that claim can be tested. Design the
  strongest concrete test you can: what would you measure or manipulate, what comparison
  or control would separate the hypothesis from nearby ones (for instance, that we
  simply dislike people who over-deliberate, or that we project coldness onto them),
  and what pattern of results would count as evidence for the claim rather than for
  those deflationary alternatives? Then be explicit about what even a favourable result
  would fail to settle — for example, whether the thought is itself corrupting or
  merely a symptom, whether a relationship in which it never arises is really better,
