  some defenders (e.g., Jaynes via symmetry/invariance groups) claim there''s a uniquely
  correct answer (1/2) by requiring invariance under rotations/translations/scaling.
  Or claim that all three methods are "equally valid" and therefore probability is
  subjective/anything goes. A subtle overstatement: "Bertrand proved that the principle
  of indifference is false" vs "showed it''s under-determined or needs a better formulation."

