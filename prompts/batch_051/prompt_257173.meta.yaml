  Let me think about Bertrand''s paradox content carefully. The classic: consider
  an equilateral triangle inscribed in a circle. Question: what''s the probability
  that a random chord of the circle is longer than the side of the inscribed equilateral
  triangle?


  Bertrand gives three methods:

  1. Random endpoints: choose two random points on the circumference; chord length
  > side iff the arc between endpoints is > 120° (or the minor arc > 2π/3). Probability
  1/3.

  2. Random radius: choose a random radius and a random point along the radius; chord
  perpendicular to the radius. Chord longer than side iff midpoint is within r/2 of
  center. Probability 1/2.

  3. Random midpoint: choose a random point inside the circle as midpoint of chord.
  Chord longer than side iff midpoint lies within circle of radius r/2. Area ratio
  = 1/4.


  So three answers: 1/3, 1/2, 1/4. The paradox: "random chord" is under-specified;
  different randomization procedures give different distributions. The principle of
  indifference (PoI) says, when we have no reason to favor one possibility, assign
  equal probabilities. But in geometric/continuous cases, PoI is not invariant under
  reparameterization — it gives different answers depending on how you carve up the
  possibility space. So the paradox is often used as a refutation or problem case
  for the principle of indifference.


