  and I''ve never found a name for it, though I suspect one exists. I''ll describe
  it as concretely as I can.


  First, there is what I''ll call the mechanical mode: you explain the system by tracing
  the physical interactions of its parts. You can predict my laptop''s next state
  in principle by the voltages and currents in its circuits. Second, there is a mode
  in which you assume the system was designed to do something, and you explain its
  parts by their functions: this button is there to be pressed; this thermostat''s
  bimetallic strip is there to break the circuit at a set temperature; this subroutine
  is for pruning unpromising moves. Third, there is a mode in which you treat the
  system as an agent with goals and beliefs: the chess engine ''wants'' to keep its
  pawn structure intact and ''believes'' my queenside is under-defended, and those
  attributions predict its next move better than anything else I can do quickly.


  My problem isn''t that any of these modes is useless. It''s that they seem to disagree
  about what is real. From the mechanical mode, the engine''s ''belief'' that my queenside
  is weak isn''t anywhere in the hardware — there are only transistor states. From
  the design mode, the weakness of a queenside is a real feature of the position and
  the move is a rational response to it. And the intentional mode finds a pattern
  in the engine''s play over hundreds of games — something like a consistent policy
  of punishing early flank attacks — that the other two modes never mention, and yet
  it predicts future moves.


