  Potential final:


  I am a high school student preparing an essay for a regional philosophy competition.
  My thesis is a version of evaluativism about pain: the view that a pain is not a
  neutral sensory experience to which an unpleasant reaction is later added, but that
  part of what it is to be in pain is to experience a bodily condition as bad, and
  that if this evaluative dimension were removed one would no longer be in pain at
  all rather than merely ceasing to mind it. The obstacle I keep facing is pain asymbolia,
  a clinical condition in which patients can still identify and accurately describe
  noxious stimulation as sharp, burning, and located in a body part, yet they deny
  that it bothers them and show none of the usual avoidance, grimacing, or distress.
  An opponent who accepts a representationalist view of pain — on which pain is the
  perception of bodily damage and its unpleasantness is a separate affective response
  — can say that such patients are still in pain, just pain that has stopped mattering
  to them. I want my essay to confront this hardest version of the objection rather
  than a weakened one.


  Please construct a thought experiment to these specifications.


  First, build a matched pair of two ordinary, clinically plausible episodes involving
  the same tissue damage in the same body part. In both episodes the person can localize
  the sensation and describe its quality — burning, stabbing, throbbing, and so on
  — with equal precision, and in both the person gives a complete verbal report. The
  episodes differ only in the evaluative dimension: the first person finds the sensation
  aversive and bad and urgently wants it gone; the second describes the very same
  quality and intensity but finds it entirely non-aversive, does not mind it in the
  least, and shows no motivational pull to remove it. The second person''s report
  should be credible and articulate, not the product of confusion or denial.


  Second, arrange the pair so that a representationalist and an evaluativist give
  opposite verdicts on whether the second person is in pain of the same intensity
  as the first. Do not stipulate the verdicts; they should fall out of each theory''s
  own criterion for what it is to be in pain. The only empirical assumption the case
  may lean on is the basic coherence of the dissociation between accurate qualitative
  report and absence of aversion, which is exactly the possibility the two theories
  divide over. No exotic technology, no science-fictional intervention, and no dependence
  on a particular brain pathway should be required.


  Then do the check. State each theory''s criterion of pain clearly, and show step
  by step why the representationalist must say the second person remains in pain of
  the same intensity while the evaluativist must say that what the second person has
  is not pain of the same intensity — and, in the strongest version of the view, not
  pain at all. Identify the single structural feature of the case that does the work,
  presumably the separation of preserved sensory-discriminative description from absent
