  Draft:


  "I am a high school student writing an essay for a regional philosophy competition.
  My thesis is a version of evaluativism about pain: the claim that pain is not a
  neutral sensory experience to which unpleasantness is added, but that part of what
  it is to be in pain is to experience a bodily condition as bad, and that losing
  that evaluative dimension would mean losing the pain itself rather than merely losing
  a reaction to it. The strongest apparent counterexample is pain asymbolia, a clinical
  condition in which people still identify noxious stimulation as intense, sharp,
  and located in a body part, yet report that it does not trouble them and show none
  of the usual avoidance or distress. An opponent who favors a representationalist
  view of pain — on which pain is a perception of bodily damage and its unpleasantness
  is a separate affective response — will treat these patients as being in pain, just
  pain that has stopped mattering to them. I want my essay to face this head-on rather
  than defensively."


  Then the request:


  "Please construct a thought experiment to the following specifications.


  (1) Build a matched pair of two ordinary, clinically plausible episodes. In both,
  the person has the same tissue damage, the same ability to localize and describe
  the quality of the resulting sensation (burning, stabbing, throbbing, etc.), and
  gives a full verbal report. They differ only in the evaluative dimension: the first
  person finds the sensation ugly, aversive, and bad, and wants it gone; the second
  finds it entirely non-aversive and does not mind it at all, though she can describe
  its intensity and quality exactly.


