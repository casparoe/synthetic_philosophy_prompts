  ---


  i''m a journalist who covers science and ideas, mostly cognitive science and computing,
  and i''ve been chewing on something I want an expert to push back on. You''re a
  philosopher of mind (someone who does cognitive science and knows the classic language-of-thought
  literature), and I''d like you to think carefully and be candid: steelman first,
  then tell me where it breaks.


  Here''s my homebrew thesis, which I''ve been calling "the compiler account of thought,"
  or sometimes "mentalese is a technology, not an organ." The starting point is Fodor''s
  language of thought: the idea that thinking has to run on an inner symbol system
  that''s productive and systematic and compositional, because thoughts have those
  features. My move is: that list of features basically is the spec for a programming
  language. Programming languages are the only things on earth that actually satisfy
  it. They have discrete combinable symbols, syntactic structure, compositional semantics,
  and they''re productive—you can build unboundedly many programs from a finite grammar.


  So I want to claim two things. Modest version: programming gives cognitive science
  the best model system we have for what a language of thought must look like, better
  than natural language, because code is unambiguous and executable. Bold version:
  in the kind of thinking where you literally write, debug, or refactor code, the
  program isn''t a translation of a prior thought—it''s the vehicle of the thought
  itself. The type checker or compiler can be doing part of your reasoning. When I
  realize my function signature is wrong and fix it, that warning feels like part
  of my thinking, not a report of thinking I did elsewhere. So Mentalese, if we ever
  find it, might not be a pre-wired neural code; it might be a cultural technology
  we built and then slowly moved into our heads.


  What I want from you:

