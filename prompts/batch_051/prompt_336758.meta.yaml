  I teach an undergrad environmental humanities course, about 18 students, and I''ve
  got a 75-minute session coming up on the Anthropocene. I want to run a structured
  activity where the students themselves feel why the question "when did the Anthropocene
  start?" is so hard to answer, and why so much of the answer depends on who''s asking
  and for what purpose. No lecture up front.


  My working design: split the class into four groups, each defending a candidate
  boundary between the Holocene and the Anthropocene. The candidates I have in mind
  are: around 1610 (the Orbis spike idea, a CO2 dip from the depopulation of the Americas),
  the late 1700s to early 1800s (coal and the industrial revolution), the mid-1940s
  (nuclear test fallout, especially plutonium), and the mid-20th century Great Acceleration
  (the sharp upturn in CO2, methane, plastics, concrete). Each group gets a card I''ll
  make, describing the physical signal, where it shows up, and the main objections.


  The twist: the class makes the decision twice under different rules. Round one is
  a geological commission — they can only weigh whether the signal is global, roughly
  synchronous, durable, and detectable far in the future. Round two is a negotiation
  with assigned roles: a representative of a low-lying island state, a historian of
  industrialization, a mining company person, an ecologist, an indigenous community
  representative whose territory is being dated, and a future geologist trying to
  read the rock record. Same candidates, same facts, but now any kind of reason is
  allowed. My hunch is the winning date will move between rounds, and that''s the
  whole point.


