  "Ever since encountering the Pasadena game, I have been stuck on what it shows about
  rational choice. In the standard game, the expected utility sum is conditionally
  convergent: rearranging the terms can make it converge to any real number or diverge
  to either infinity, so it has no well-defined expected value. I am inclined to reason
  as follows: expected utility theory supplies no verdict for the game, and if a theory
  supplies no verdict, then no price is ruled out. From there I conclude that paying
  £1,000, £1,000,000, or £0.01 to play the Pasadena game are all equally rationally
  permissible, and that there is no rational basis for choosing between the game and
  a certain £100. But I also feel that this conclusion cannot be right, because it
  makes the difference between accepting and rejecting the game arbitrary rather than
  merely uncertain.


  Where exactly does this reasoning go wrong? Does the absence of a defined expected
