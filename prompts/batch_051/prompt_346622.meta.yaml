  Let''s design prompt:


  "Ever since learning about the Pasadena game, I have been puzzled about what it
  implies for practical choice. The game has no finite expected value: the sum of
  utilities weighted by probabilities is conditionally convergent, so depending on
  the order of terms it can be made to diverge to +∞ or −∞. It seems to follow that
  expected utility theory simply falls silent, and if a theory falls silent, there
  is nothing it forbids; so any finite price to play, or any finite price to sell
  the game, is rationally permissible. But that conclusion strikes me as too permissive,
  and it would mean comparing the Pasadena game with a sure £100 is not just unresolved
  but rationally arbitrary. Is that really what the paradox shows? If not, what is
  the precise mistake, and what decision rule should replace expected utility for
  such cases?"


