  The theory is the common prior assumption (the Harsanyi doctrine, sharpened by Aumann):
  rational agents who share a common prior over a fixed state space, and whose posterior
  beliefs and rationality are common knowledge, cannot ''agree to disagree.'' Any
  persistent disagreement among ideally rational agents must therefore be traced to
