  prior they like.


  The intuition I cannot shake is that conscientious, fully rational people can begin
  from different prior plausibility weights over the very same space of hypotheses.
  Different theoretical temperaments can find different hypotheses simple, natural,
  or worthy of being taken seriously before the evidence arrives, and this need not
  reflect private information, irrationality, or a failure of common knowledge. Rational
  inquiry, I want to say, is not a mechanical updating from a unique privileged starting
