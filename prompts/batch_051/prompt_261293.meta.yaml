  Let me think carefully about the philosophical content to ensure accuracy.


  Molinism: Luis de Molina, 16th century, contemporary defenders like William Lane
  Craig, Thomas Flint. Key doctrine: middle knowledge (scientia media): God knows,
  for each possible creature and each possible circumstance, what that creature would
  freely choose (counterfactuals of creaturely freedom, CCFs). This knowledge is "middle"
  between natural knowledge (knowledge of necessary truths and possibilities) and
  free knowledge (knowledge of actual world''s contingents). Molinism aims to reconcile
  robust libertarian freedom with meticulous divine providence and foreknowledge.
  By actualizing a world from among feasible worlds (given true CCFs), God can sovereignly
  arrange circumstances so free creatures freely choose what fits God''s plan.


  Open theism: God''s omniscience includes all truths, but future contingents about
  free choices are not (yet) true; God has "dynamic omniscience" — knows past and
  present exhaustively, knows possibilities and probabilities about future, but not
  with certainty what free creatures will do. Open theists (e.g., Clark Pinnock, John
  Sanders, Gregory Boyd, William Hasker) deny exhaustive definite foreknowledge; they
  also deny that CCFs have truth values, because libertarian free choices are not
  determined by circumstances/character — there is no fact of the matter about what
  a person would freely do in a merely hypothetical situation. Hasker and others argue
  CCFs lack truth-makers ("truth-maker objection"; Adams and especially Robert Adams''s
  "Middle Knowledge and the Problem of Evil" argues CCFs would be true prior to God''s
  will without any ground, since they can''t be explained by character, circumstances,
  or God''s decision, and they don''t follow from anything; hence they are ungrounded,
  "incredible"). Molinists respond: counterfactuals of freedom can be true without
  being caused; truth needn''t have a truth-maker in the robust sense; or God''s knowledge
  is the ground? But Molinists generally say CCFs are contingently true brutely, known
  by God pre-volitionally.


  Molecular points of debate: grounding objection; whether middle knowledge implies
  determinism after all (if God actualizes a world knowing what you''d do, your choice
  is inevitable given the circumstances and CCFs — but Molinist says it''s still free
  because the choice is not causally determined, and the counterfactual is true because
  of what the creature would freely choose, not vice versa; though grounding issue
  bites); whether "counterfactuals of freedom" are coherent under libertarianism:
  libertarian freedom requires the agent, in identical circumstances, could choose
  otherwise. Then "would" doesn''t follow from anything; in the same world? If S in
  C would freely choose A, could S in C choose B? If yes, is there a possible world
  where same C, S chooses B? This threatens the counterfactual''s truth requiring
  something about S that makes A the choice, which looks like a disposition/tendency
  that open theists call determinism or at least undermines libertarian contingency.
  Molinists distinguish "would" not "would probably"; they accept there are worlds
  with same C and different choice but counterfactual true at actual world is a brute
  fact.


  The "grounding objection": truths have to be true in virtue of something. What makes
  CCFs true pre-volitionally? Neither God (else they''re not free/God decrees them),
  nor the creature''s actual choices (if the condition never occurs, no actual choice
  to ground it), nor the creature''s nature/circumstances (would make them determined,
  not free). So they''re "truths without truth-makers." Molinist responses: some truths
  are primitive; truth-maker principle not absolute; CCFs grounded in the would-be
  choices themselves/possibilities; or God''s knowledge of possibilities of free choice
  suffices.


