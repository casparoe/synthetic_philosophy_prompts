  Summary text:

  "The Church–Turing thesis says that any function that can be computed by any physical
  system can be computed by a Turing machine. Since the brain is a physical system,
  the thesis implies that whatever the brain does is Turing-computable, and so the
  mind is just a computer program—give or take implementation details. The thesis
  is effectively proven, because every serious model of computation anyone has proposed
  (the lambda calculus, register machines, cellular automata, even quantum computers)
  has been shown to compute exactly the same class of functions as Turing machines.
  Really the thesis is now just a definition: ''computable'' means Turing-computable.
  So anyone who doubts it is either confused or rejecting a mathematical fact."


  Errors/conflations:

  1. The actual Church-Turing thesis (CTT) is about effective methods/algorithms in
  the informal sense, not about all physical systems. The claim "any physical system"
  is the physical Church-Turing thesis (PCTT), a separate empirical thesis.

  2. "The mind is just a computer program" doesn''t follow from PCTT alone; needs
  extra premises (computational theory of mind, that all physically realized mental
  functions are the relevant functions, that there''s no hypercomputation in the brain,
  etc.). Also Turing-computability is about functions on strings/numbers; applying
  to the brain involves representation/churchland issues.

  3. "Effectively proven because every model is equivalent" — equivalence results
  among formalisms support CTT but don''t prove it, since CTT quantifies over the
  informal notion "effectively computable"; you can''t prove an identity between a
  formal and informal notion by more formal results. And the physical thesis is empirical
  and not proven by these equivalence results either.

  4. "It''s now just a definition" — conflates the definitional version ("Turing-computable"
  is used as a technical term) with the substantive claim. If it''s definition, it''s
  trivially true of the technical term, but the claim that the informal notion is
  captured remains.

  5. "anyone who doubts it is rejecting a mathematical fact" — overstates; one can
  coherently ask about hypercomputation, quantum computing (though standard QM is
  simulable; quantum computers are equivalent in terms of computable functions, not
  complexity), or unknown physics.


