  - Metacircular interpreter: an interpreter for a language L written in L itself.
  It interprets programs by recursively applying the language''s own evaluation rules,
  including the rule for evaluating the interpreter itself. The interpreter can modify
  or extend the language while running — reflection, eval.

  - Self-hosting compiler: a compiler for language L written in L, capable of compiling
  its own source; when you change the compiler''s source, you compile the new compiler
  with the old compiler. Bootstrap: the old compiler''s behavior legitimizes the new
  compiler, even though the new compiler may treat programs differently — including
  the old compiler''s own source code.

  - The parallel: In both Nomic and self-hosting compilers, the procedure that authorizes
  changes is one of the objects that can be changed, so there''s a bootstrapping/regress
  problem: every change is validated by a rule/procedure that is simultaneously the
  thing being changed. This creates a two-level structure: object-level (rules, programs)
  and meta-level (amendment procedure, compiler/evaluator), but the meta-level lives
  at the object level — no clean separation. Hence fixed points, self-application,
  and paradoxes: can the amendment procedure amend itself into something that declares
  its own amendment invalid? Can a compiler compile a new compiler that refuses to
  compile the old compiler?


