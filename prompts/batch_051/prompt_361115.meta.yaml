  ---


  Last night a friend and I argued for hours about Nomic — the game in which changing
  the rules is itself a legal move, governed by rules which are themselves changeable.
  My friend maintained that the familiar paradoxes (a rule that repeals the rule authorizing
  its own repeal; a procedure that amends the procedure by which amendments are validated)
  are no more than bookkeeping curiosities. I kept wanting to say they are symptoms
  of something structural, but I could not make the structure precise.


  This morning I saw what I think is the right parallel. The predicament of Nomic
  is close to the predicament of a metacircular evaluator or a self-hosting compiler.
  A metacircular evaluator is an interpreter for a programming language written in
  that same language: the machinery that assigns meanings to programs is itself a
  program whose meaning is assigned by that machinery. A self-hosting compiler is
  a compiler that compiles its own source, so each version of the compiler is produced
  and legitimized by an earlier version of itself. In both cases the meta-level sits
  at the object level: the thing that authorizes or effects change is among the things
  that can be changed by what it authorizes. Nomic has the same shape — the amendment
  procedure is one of the rules the procedure governs, and the rule that makes amendments
  valid is itself amendable.


  Is this a real identity of structure, or am I pattern-matching between a formal
  artifact and a social game? If the parallel is deep, which results should transfer?
  In particular: do the results about self-referential systems — fixed points, quines,
  the limits on a system''s ability to completely and consistently assess its own
  operations — place real constraints on Nomic-style legal self-amendment? Or does
