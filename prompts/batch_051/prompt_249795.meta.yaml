  This could be very good. The list should be accurate. Standard replies to leveling-down:


  The leveling-down objection: If equality has intrinsic value, then a change that
  reduces the better-off to the level of the worse-off without improving the worse-off
  would be in one respect better (more equal), which seems absurd. Egalitarians have
  responded:


  1. Pluralist egalitarianism: equality is one value among others; a leveling-down
  can be better in one respect (equality) while worse all-things-considered; there''s
  nothing absurd about saying it is in one respect better. (Temkin)

  2. The "levelling down objection assumes equality matters regardless of the absolute
  position" response: egalitarians can hold that equality matters only when it benefits
  people, e.g., a "non-instrumental egalitarianism constrained by a person-affecting
  principle" or "conditional egalitarianism."

  3. Prioritarianism itself: replace egalitarianism with priority to the worse off;
  then leveling down is never better because nobody benefits.

  4. Sufficientarianism: what matters is that people have enough; leveling down doesn''t
  help anyone reach the threshold.

  5. The objection only targets "pure" egalitarianism (equality for its own sake),
  not egalitarians who care about equal relations, respect, or status (relational
  egalitarianism / democratic equality) — Anderson''s relational egalitarianism.

  6. Larry Temkin''s response: our intuitive resistance to leveling down may not be
  decisive; the view that inequality is bad is compatible with holding that leveling
  down is not all-things-considered better, and the "slogan" that equality is non-instrumentally
  valuable doesn''t entail maximizing equality.

  7. The response that levelling down is not necessarily worse because it can reduce
  envy, positional competition, or status harms — equality can have instrumental benefits
  even if the worse-off''s absolute position doesn''t change. Actually that''s instrumental
  egalitarianism.

  8. Person-affecting restriction: equality matters only if it makes someone better
  off, which blocks leveling down (though this has issues in population ethics).


