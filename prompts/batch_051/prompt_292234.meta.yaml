  answer: If the cascade is on the wrong action (e.g., reject when state is G), disclosed
  signals continue to arrive, each carrying LLR with positive drift. Under the true
  state G, each disclosure has P(g|G)=p and P(b|G)=1-p, so the log-likelihood ratio
