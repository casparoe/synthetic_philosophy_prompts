  the modern internet basically is that ring. He said that throwaway accounts and
  anonymous boards give people the same cover Gyges had, and that the way people act
  there—doxxing, mobbing, scamming, playing nice only as long as their reputation
  is on the line—vindicates Glaucon. He argued that this shows we shouldn''t trust
  people''s moral character when they can''t be identified, and that if you want to
  know what someone is actually like, watch them under a pseudonym.


