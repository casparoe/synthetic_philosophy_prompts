  and last week someone brought up the passage where Glaucon tells the story of the
  shepherd Gyges, who finds a ring that makes him invisible, and uses it to seduce
  the queen, kill the king, and take over. Glaucon''s claim is that any so-called
  just person, given the same ring, would do the same, because we''re only just because
  we fear the consequences of being caught, not because we value justice for itself.


