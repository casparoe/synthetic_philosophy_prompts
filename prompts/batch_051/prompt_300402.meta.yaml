  Student answer draft: "Intuitionistic logic drops the law of excluded middle (P
  ∨ ¬P) because in intuitionism, to assert P ∨ ¬P you need either a proof of P or
  a proof of ¬P, and for many mathematical statements we have neither. Intuitionists
  reject proof by contradiction in all its forms: any argument that assumes a statement
  and derives a contradiction is not allowed, because it relies on the idea that false
  and true are the only options. Instead, a proof of an existential statement ∃x P(x)
  must explicitly construct an example x, not just show that supposing no x exists
  leads to absurdity. The classical proof that there are irrational a,b with a^b rational
  shows the difference: it considers √2^√2. Either it is rational or it is irrational,
  by excluded middle. If it''s rational, we''re done; if it''s irrational, take a=√2^√2
  and b=√2, then a^b = (√2^√2)^√2 = √2^2 = 2, rational. Since a concrete pair is identified
  in each case, and at least one case must hold, the proof is constructive; it just
  has two branches. The intuitionist objection is really epistemological: we don''t
  know which branch is the right one, so we don''t know which a and b work. But because
  each branch gives a finite pair, the proof is fine as a proof of existence; it merely
  fails to communicate the witness. Brouwer''s worry was that classical mathematics
  treats undecided sentences as if they were either true or false, but in intuitionistic
  logic undecided sentences get a third truth value until a proof settles them."


