  I have spent years reading the AI alignment literature, and I keep noticing that
  two ideas are invoked together so often that they start to feel like a single package:
  the orthogonality thesis and the instrumental convergence thesis. I want them pulled
  apart and compared on their own merits, because I suspect they are doing different
