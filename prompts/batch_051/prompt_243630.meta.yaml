  The orthogonality thesis, as I understand it, says that an agent''s level of intelligence
  or capability is independent of its final goals: in principle, any level of capability
  can be paired with any final goal. The instrumental convergence thesis says that
  a wide range of final goals, across a wide range of capable agents, will tend to
  produce similar instrumental subgoals, such as self-preservation, resource acquisition,
  and goal-content integrity. I want a comparison that is precise about the quantifiers
  and does not let the two theses borrow support from each other by mere association.


