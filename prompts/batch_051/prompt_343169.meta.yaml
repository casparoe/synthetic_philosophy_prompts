  Let me write:


  "In the philosophy of science reading group I run, the verisimilitude discussion
  has stalled in a way that feels different from ordinary unsolved problems. The motivation
  is shared by everyone: Popper''s picture of science needs a notion of one false
  theory being closer to the truth than another, since the history of science is a
  sequence of strictly false theories and we still want to call that sequence progressive.
  Everyone also grants that Popper''s own first attempt at defining this — comparing
  the true consequences and false consequences of a theory — collapsed, because on
  that definition no false theory could come out closer to the truth than another.
  But after that, the field split, and in our group the two camps talk past each other.
  One camp thinks truthlikeness is fundamentally a matter of likeness: how similar
  the possible worlds a theory permits are to the actual world, measured by something
  like distance in a space of worlds. The other camp thinks it is fundamentally a
  matter of content: how a theory''s truth-content and falsity-content trade off against
  each other, perhaps with restrictions on which consequences count. My working hypothesis
  is that the impasse is not really a technical problem about formal definitions;
  it is a disagreement about what the notion of closeness to the truth is supposed
  to explain — a semantic relation between a theory and the world, or a normative
  standard for choosing theories that will guide further inquiry. Is that diagnosis
  right, or is there a substantive formal disagreement underneath it? And on your
  diagnosis, what would actually count as progress, as opposed to one more proposed
  definition?"


