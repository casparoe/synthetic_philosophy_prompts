  Potential prompt text:


  "I spent my career in the natural sciences, mostly in visual psychophysics and retinal
  physiology, and have only recently begun working through the philosophy of mind.
  One topic I keep returning to is the idea of forbidden colours. The standard story,
  going back to Hering''s opponent-process theory, is that some hues are impossible:
  no surface or light can look at once reddish and greenish, or at once bluish and
  yellowish, because colour vision begins with opponent channels that signal red versus
  green and blue versus yellow, and a channel cannot be in both of its opponent states
  at once. Yet a celebrated experiment from the early 1980s reported that observers
  viewing stabilised red and green fields—so that ordinary eye movements could not
  refresh the boundaries—sometimes described a hue that was simultaneously reddish
  and greenish. The result has entered the textbooks, but its replication record seems
  to me less solid than the textbook treatment implies, and it is not obvious whether
  the impossibility is a fact about the earliest opponent channels or about the geometry
  of colour experience more generally. Meanwhile, the question has outgrown the psychophysics
  laboratory: with modern neural interfaces, one can ask whether an unnatural pattern
  of stimulation in retina or cortex could produce not merely an unusual colour within
  the familiar colour solid, but a genuinely novel quality of experience—a new dimension,
  as it were, rather than a new point.


  Suppose I wanted to devote a three-year project, with one talented postdoc and a
  modest psychophysics and computational budget, to this cluster of questions. I can
  see at least four lines of work. First, conceptual groundwork: what criterion would
