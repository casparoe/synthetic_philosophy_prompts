  Draft:


  I spent my working life in the natural sciences, chiefly retinal physiology and
  visual psychophysics, and have only recently begun to read philosophy of mind seriously.
  One topic I keep circling back to is the idea of forbidden colours. The textbook
  account, going back to Hering''s opponent-process theory, is that certain hues are
  impossible: nothing can look at once reddish and greenish, or at once bluish and
  yellowish, because early colour vision consists of opponent channels—red versus
  green, and blue versus yellow—and a single channel cannot be in both of its opponent
  states simultaneously. Yet a celebrated experiment from the early 1980s reported
  that observers viewing stabilized red and green fields, with an apparatus that prevented
  small eye movements from refreshing the boundary, sometimes described a hue that
  was simultaneously reddish and greenish. The claim has become part of the standard
  literature, but its replication record seems to me shakier than the textbook treatment
  suggests, and it remains unclear whether the impossibility belongs to the earliest
  opponent channels or to the larger geometry of colour experience. The question has
  also outgrown ordinary psychophysics: with current neural-interface methods it becomes
  natural to ask whether an unusual pattern of retinal or cortical stimulation could
  produce not merely an unfamiliar colour within the existing colour solid, but a
  genuinely novel quality—a new dimension of colour experience rather than a new point
  in the old one.


  Suppose I were able to direct a three-year project on this cluster of questions,
  staffed by one capable postdoc and equipped with a modest psychophysics and computational
  budget. I can see at least four lines of work. First, conceptual groundwork: what
  evidence or criterion would justify saying that some experience is a genuinely novel
  quale rather than an unfamiliar blend, a simultaneous presentation, or a relabelling
  of familiar qualities? Second, replication and systematization: with modern displays
  and eye trackers, can the stabilized-image reports of reddish green be reproduced,
  and under exactly which conditions? Third, theoretical modelling: what kind of opponent
  architecture actually forbids a reddish-green experience, and do the constraints
  operate at the peripheral channel level or in later cortical colour computations?
  Fourth, neural-interface exploration: what would a stimulation experiment in retina
  or cortex have to show before one could responsibly claim to have opened a new sensory
  dimension? I am not asking for a survey of the literature. I want a dependency-aware
  prioritization: which of these lines of work, or which combination of them, should
  come first for that three-year project, and why? Please defend the ordering by stating
