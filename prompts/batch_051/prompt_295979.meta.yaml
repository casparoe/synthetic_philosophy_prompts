  Belief set idea (student''s commitments after reading Athanasius and Chalcedon):

  1. Christ is one person (hypostasis) with two complete natures, divine and human,
  united without confusion or separation (Chalcedon).

  2. The divine nature is immutable and impassible, so the Logos cannot change or
  suffer in or through the divine nature.

  3. Things true of either nature can be said of the one person (communicatio idiomatum).
  So "the Son of God died" and "the infinite Word was in a human body" are both true.

  4. For the human nature to be truly human (and for it to be redeemed), it must include
  everything human, including a human rational soul and will; so Apollinarianism is
  out.

  5. Following Athanasius''s passage [quote], the Word was not circumscribed or contained
  by the body, but rather contained all things while being present in the body.

  6. The incarnate Christ had a single subjective consciousness / single center of
  agency? Or "the person acts through both natures, not as two agents" — single agency
  of the hypostasis.


  Tensions:

  - (2)+(3): communicatio idiomatum and impassibility: how can a person with an impassible
  divine nature be truly said to have died? Is the predication merely verbal? This
  is a classic severe tension (though the tradition says: he dies in the flesh, the
  divine nature doesn''t die; the person suffers qua human). But does that leave the
  person untouched? Severity: high.

  - (5)+(6)? The passage says the Word was not in the body only, but everywhere and
  containing all things. This seems to threaten the genuine humanity/consciousness:
  if the Word''s consciousness is the only center, and it is universal, then the human
  nature lacks a human subject, so is Christ a human being? Tension between anhypostasia
  (human nature has no human hypostasis, subsists in the Logos) and assertion that
  Christ is truly human with human mind/will. This is a real tension (the anhypostasia/enhypostasia
  puzzle). Also (4) says human nature includes a human will/mind, but (6)/(5) might
  collapse it into the divine Logos''s own mind. Is Christ''s human will a distinct
  center? Sixth Ecumenical Council says two wills, but one hypostasis. Not obviously
  incompatible, but tension about one vs two agencies.

