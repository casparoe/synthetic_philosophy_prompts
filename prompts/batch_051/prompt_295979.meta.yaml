  For the Incarnation, a student could hold:

  (1) The Council of Chalcedon''s two-natures doctrine (one person/hypostasis, two
  natures, divine and human, each complete).

  (2) The divine nature is impassible and immutable — God cannot change or suffer.

  (3) In Christ, God truly died and suffered for us — the Incarnation is real, not
  a mere appearance.

  (4) Whatever possesses a human nature must be a human person (or: a nature is the
  principle of action, so two natures would be two act-er?).

  (5) The communicatio idiomatum: properties of either nature can be predicated of
  the one hypostasis.

  (6) "What is assumed is healed" — the Logos assumed a complete human nature including
  a human will/mind (contra Apollinarianism), which is required for salvation.


  Tensions: (2) and (3): if the divine nature is impassible, how can God suffer/die?
  The apparent solution is communicatio idiomatum/appropriation: the person suffers
  in the human nature. But does it satisfy? There is a genuine tension about divine
  impassibility and the suffering of the Logos — the question of whether "God died"
  is true if only the human nature died. Also (4) vs (1): if a complete individual
  human nature includes a human hypostasis? The tension: can there be a human nature
  that is not a person (anhypostasia/enhypostasia)? That''s the standard move: Christ''s
  human nature is anhypostatic (no separate human person) but enhypostatic (subsists
  in the divine hypostasis). A naïve "whatever has a human nature is a human person"
  conflicts with Chalcedon. That''s a genuine tension.


  Apparent tension that dissolves: (2) and (5)? Communicatio idiomatum seems to transfer
  sufferings to the divine nature, but the traditional move distinguishes what is
  true of the hypostasis vs each nature: the hypostasis suffers in the flesh, the
  divine nature remains impassible. Or (1) and (6)? seems fine.


