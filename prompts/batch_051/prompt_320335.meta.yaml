  Respect and recognition: what do we owe each other in attitude, not just action?
  Key concepts:


  - Kantian respect (Achtung) as a feeling that arises from recognizing the moral
  law; respect for persons as treating humanity as end, never merely as means. But
  Kant''s respect is about how the moral law constrains inclinations; some read it
  as attitude.

  - Stephen Darwall''s distinction between "recognition respect" and "appraisal respect."
  Recognition respect: giving appropriate weight in deliberation to something; appraisal
  respect: positive assessment. For persons, recognition respect is owed to all equally;
  appraisal respect is earned.

  - Axel Honneth''s recognition theory: love, rights, esteem—misrecognition as harm.

  - Strawson''s "Freedom and Resentment" participant vs objective stance. Reactive
  attitudes (resentment, gratitude, forgiveness) are constitutive of interpersonal
  relations. Taking objective stance toward someone—treating them as object to be
  managed—suspends normal interpersonal attitudes. Question: can we owe someone the
  participant stance? What do we owe in attitude?

  - The "attitude-action distinction" in ethics: can we be blameworthy for beliefs
  or feelings? Moral responsibility for emotions. "Ethics of belief." Could argue
  that some wrongs are purely attitudinal, e.g., a racist who behaves impeccably but
  harbors contempt—does that wrong? The "attitude-only wrongs."

  - "What do we owe each other in attitude" could include: the benefit of the doubt,
  interpretive charity, taking seriously, acknowledgment, attention, empathy, respect
  for their self-understanding. Failure to recognize someone''s identity (gender,
  etc.) as a wrong irrespective of actions.

  - P.F. Strawson''s reactive attitudes; Scanlon''s contractualism about blame (blame
  as attitudinal: relationship impairment).

  - Thomas Nagel on "moral luck," or the role of intentions.

  - "Respect for persons" vs "esteem": modern pluralist accounts.

