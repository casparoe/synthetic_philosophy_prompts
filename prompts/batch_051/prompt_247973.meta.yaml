  Let me recall Dharmakīrti''s philosophy. Dharmakīrti (c. 7th century CE), Buddhist
  epistemologist. Key ideas:

  - Two means of valid cognition (pramāṇa): perception (pratyakṣa) and inference (anumāna).

  - Perception is non-conceptual (nirvikalpa) and free from conception; it grasps
  the particular (svalakṣaṇa) — the unique, momentary particular that is causally
  efficacious (arthakriyākārin).

  - Inference is conceptual and grasps universals (sāmānyalakṣaṇa), which are not
  ultimately real but are constructed (anyāpoha / apoha — exclusion theory). Dharmakīrti
  holds a nominalist/exclusionist theory of concepts: universals are mere exclusions
  of other things (apoha).

  - Momentariness: everything that exists is momentary (kṣaṇika). This is argued by
  the "vināśitvānumāna" — the inference of momentariness. The argument: existence
  is identical with causal efficacy; what exists must produce an effect; being causally
  efficacious means changing; anything that exists must perish immediately because
  its perishing is its very nature (or: because it exists, it is perishable; if destruction
  required a cause, then...). The classic argument: destruction is uncaused; if destruction
  needed a cause, then things would endure until the cause of destruction arrives,
  but then the cause of destruction would need to destroy the thing, and the thing
  would need to be different before/after... Actually the argument: a thing''s destruction
  cannot be caused by anything other than itself, because destruction is the cessation
  of the thing; if it were caused by an external cause, the thing would have to exist
  and not exist at the same time. Therefore destruction is intrinsic, occurring at
  the very moment of existence; hence whatever exists is momentary.


