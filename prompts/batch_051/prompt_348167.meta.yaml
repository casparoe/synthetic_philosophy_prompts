  Let''s draft a prompt:


  "For a public library philosophy discussion group, I have been asked to prepare
  a statement of my own views on when a right action deserves moral credit, so the
  group can look for inconsistencies in it. I want an audit of the following eight
  commitments, because I suspect some of them pull against others but I cannot clearly
  see which. Please don''t just say they can all be made consistent; go through the
  pairs, order the tensions by severity, and for each genuine tension say what I would
  have to abandon or weaken, and note any apparent tensions that aren''t real. Here
  are the commitments:

  1. The moral worth of an action depends solely on the agent''s motivating reasons
  and not on whether the action actually succeeds or produces good results.

  2. Acting from the belief that the action is one''s duty is sufficient for moral
  worth, even if the agent takes no satisfaction in the action.

  3. Acting from heartfelt sympathy or love for a particular person is also sufficient
  for moral worth, even if the agent is not thinking of the action as obligatory.

  4. An action has moral worth only if the agent''s motivating reason is the same
  as the reason that makes the action right.

  5. If someone does the right thing solely for reputation or reward, the action is
  right but not morally worthy.

  6. If someone does the right thing mainly for reputation but partly because the
  action is the right thing to do, the action has some, diminished moral worth.

  7. A person can deserve moral credit for an action that is objectively wrong if
  he acts from a motive that responds to the features that would have made the act
  right in ordinary circumstances.

  8. Acting to avoid guilt, by itself, is not a moral motive and does not give an
  action moral worth.

  I''d also like an overall verdict on which is the least costly way to make the set
  consistent, not just a list of possible fixes."


