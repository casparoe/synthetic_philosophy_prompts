  "I sit on the board of a small community foundation that funds after-school programs.
  Our governing document says the board must manage the endowment ''frugally'' and
  preserve its real value for future generations. We have always interpreted this
  as a rule: no more than four percent of the endowment may be drawn down in a year,
  every vendor contract must go to the lowest qualified bidder, and no project may
  be approved unless its per-child cost is below ours. Our executive director now
  asks us to waive all three rules for two years to spend from the corpus on (i) energy-efficiency
  retrofits for the building we lease to partners and (ii) hiring a development officer.
  Her projections show that the waiver would lower our per-child cost within five
  years and leave the endowment larger in real terms thirty years out than under the
  current policy. Some trustees say the proposal is exactly what a frugal board should
  do: spend now to become more efficient in the long run. Others say it would be unfaithful
  to the donor''s requirement, because it spends money today on things that are not
  necessary in a way the current practices would not allow. We need a written recommendation
  from a working group to the full board. I have been asked to draft it. Write the
  memo: include a clear recommendation, our best criteria for what ''frugal'' requires
  in decision-making, how the board should think about the conflict between the two
