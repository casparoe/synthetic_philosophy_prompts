  A law-school friend walked me through an argument he half-built for a criminal law
  seminar and now I suspect it proves too much. Here it is, numbered as he gave it.


  Suppose a man committed an armed robbery in 1984. He was never caught. In 1985 the
  state would happily have prosecuted him if it had found him then. He has been clean
  ever since. Last year someone found a videotaped confession he made in 1986, plus
  records that establish the crime about as well as a case from 1986 would have been.
  The statute of limitations has run.


  (1) If a serious wrong was committed in 1984, the passing of forty years does not
  make the act any less wrong. The robbery is not half as wrong now, or slightly wrong
  now; if it was wrong then, it is wrong now.


  (2) If the act is exactly as wrong now as it was in 1986, and the state''s evidence
  is at least as good now as it was in 1986, then the state''s backward-looking reason
  to punish — the reason that points at what he did — is no weaker now than it was
  in 1986.


  (3) If that reason is just as strong, then in a case like this, with excellent evidence,
  the bare passage of time should not make prosecution impermissible or pointless.


  (4) But a statute of limitations makes the bare passage of time decisive: once the
  clock runs out, even a taped confession and clean records cannot support a prosecution.


  (5) So either every limitation period that would bar this case is unjust, or the
  passage of time by itself weakens what is owed for a wrong.


  (6) The second horn sounds just as bad: if the passage of time weakens what is owed,
  then an unpunished wrong quietly shrinks, and after enough years an unpunished robber
  owes less than a fresh shoplifter owes for the shoplifting. That is close to saying
  wrongness decays, which (1) denied.


