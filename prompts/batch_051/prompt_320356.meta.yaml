  Topic: "Well-definedness and canonical choices: does it matter how you label the
  roots?"


  Core conceptual points:

  - For a quadratic like x^2 - 4x + 3 = 0, roots are 3 and 1; these are distinguished
  by which is larger, etc.

  - For x^2 - 2 = 0, roots are sqrt(2) and -sqrt(2); the real numbers have an order,
  so "the positive root" is a canonical choice. sqrt(2) means the positive one by
  convention.

  - For x^2 + 1 = 0 over the complex numbers, roots are i and -i. Here there is no
  order-compatible notion of positive/negative; the choice of which is "i" is a matter
  of convention. The field automorphism z -> conjugate z swaps i and -i and fixes
  the real numbers, so any statement in the language of fields true of one is true
  of the other. So there''s no fact of the matter that picks one out; but that doesn''t
  mean the number i is poorly defined — once you fix an embedding/convention, it''s
  well-defined within that structure. "Well-definedness" is about whether a definition
  picks out a unique object; "canonical" is about whether there''s a natural/default
  choice.

  - The subtle distinction: it''s not that i is not well-defined; it''s that there
  are two isomorphic choices connected by an automorphism, neither distinguished by
  structure. But we can still reason with i perfectly well because anything we prove
  holds equally for either, and we just pick one.

  - Also "the roots of x^2 + 1" as a set {i, -i} is well-defined, even if each individual
  root isn''t canonically singled out.

  - Another subtle point: "does it matter how you label the roots?" In algebra it
  often doesn''t matter, but in applications (e.g., complex analysis, where you orient
  the plane, or in number theory where you fix an embedding) it can matter, or you
  must track the choice.


