  At a reading group on Mill''s On Liberty last week, two members fell into a long
  argument about a mutual friend of ours, Lena, who has left a stable government job
  to spend two years at a rural art collective trying to paint, farm, and write a
  novel. We had been discussing the sections where Mill defends individuality and
  what he calls experiments in living, and the argument turned on whether his view
  licenses Lena''s choice.


