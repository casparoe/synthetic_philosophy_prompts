  life may have been comfortable, he argued, but its shape was largely set by other
  people''s expectations, whereas her new life is a genuine trial of a different way
  of living. Even if she fails, he said, the failure is not socially worthless: it
  adds a data point to the standing question of whether that kind of life can work,
  and Mill''s central point is that such experiments need protection from the tyranny
  of opinion and custom.


