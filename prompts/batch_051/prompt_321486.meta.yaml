  expressing latent knowledge; ability under some prompt doesn''t establish that the
  prompt specifically elicits the model''s actual internal beliefs. Moreover ELK is
  about situations where the correct answer can''t be recognized by the supervisor,
  to avoid "human simulator" responses. Good answer would correct: prompt engineering
  works for some questions, but the hard case is when you can''t check the answers—where
  it''s not about finding the right wording, but about training a model to report
