  they create vast numbers of ordinary or digital people, colonize space, etc. Fanaticism
  about far-future value doesn''t require ancestor simulations. So the student conflates
  "not running ancestor simulations" with "not producing astronomical value/population."
  That''s a subtle but real error. Good.

  - Horn (i): "the far future drops out with negligible probability" — if we go extinct
  before posthuman, indeed the far future from our actions has negligible probability
  of vast value; that''s mostly right, but maybe nuanced: the trilemma is about civilizations
