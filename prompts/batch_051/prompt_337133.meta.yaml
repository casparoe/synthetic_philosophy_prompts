  The principle: Van Fraassen''s Reflection principle says rational agents satisfy
  P_t(A | P_{t''}(A)=x) = x, i.e., one''s current opinion about A conditional on one''s
  future opinion being x should equal x. Or equivalently P_t(A) = Σ P_t(P_{t''}=x)·x.
  It says deference to future self. Counterexamples: forgetting/evidence loss, future
  irrationality (drugs, brain lesion), death before future, indexical/cognitive changes,
  "I''ll be sleep-deprived," "I''ll have been indoctrinated." Also cases where you
  know you''ll use a biased method. Also perhaps Ulysses/pill cases.


