  ---


  I''m running a 75-minute session for a rationalist-adjacent reading group (about
  18 people, mostly software- and policy- types, no military background) on autonomous
  weapons and the slogan "meaningful human control." I''ve seen the phrase used a
  lot, and I''ve internalized the standard worries--automation bias, moral crumple
  zones, the responsibility gap--but I don''t think the group has really felt why
  a human in the loop can be a compliance ritual rather than control. So: design a
  structured role-play or simulation that makes them run into that problem themselves,
  before it gets named.


  I want a runnable activity with roles, materials, and a debrief, not a discussion
  prompt. The learning objective: by the end, people should feel the pull of "a person
  has to own the decision" and simultaneously see that control might be a property
  of the whole system--who sets the constraints, what information the approver sees,
  what happens after a mistake--rather than of the final button-press. A nice outcome
  would be someone saying, half surprised, "I just approved a strike I don''t understand."
  (That doesn''t have to be a literal scripted line; I mean the structure should produce
  that state.)


  Concretely I''d like two rounds along these lines, though adjust if you have something
  better: (1) a round where one participant is the "human controller" who must approve
  or veto AI targeting recommendations under time pressure with information the system
  provides; (2) a contrasting round where control moves upstream--people set rules
  of engagement or constraints in advance and no one reviews individual shots. Build
  in small incentives (points, status, avoided blame, not real money) so rubber-stamping
  and blame-gaming happen on their own.


  The debrief should map what happened onto the actual conceptual joints: control-as-veto
  vs control-as-shaping-the-system, attribution vs influence, the responsibility gap,
  moral crumple zones, and the "levels of abstraction" point (is the human controlling
  a decision, a policy, a design, or a training distribution?). Also be frank about
  what the simulation can''t reproduce--the stakes of an actual strike, institutional
  pressures, the fact that real operators are trained and accountable--and say what
  the facilitator has to supply in words afterwards.


  Tell me what will predictably go wrong the first time I run it and how to handle
  it: I''m imagining someone who reflexively rejects every recommendation to prove
  a point, a table that treats it as a referendum on whether to ban autonomous weapons,
  or a group that concludes the human veto was good enough and the worry is overblown.
