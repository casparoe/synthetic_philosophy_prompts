  in the pattern of excluding from equal consideration based on an irrelevant trait,
  but not literally identical in social structure/history. Overstated.

  - "establishes that no morally relevant line can be drawn at the boundary of species"
  — overstates the modus ponens; it is conditional on rejecting excluding marginal
