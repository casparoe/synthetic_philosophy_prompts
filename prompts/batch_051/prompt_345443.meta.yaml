  Student answer:


  "The argument from marginal cases starts from the fact that we normally extend moral
  consideration to human beings who lack the capacities that are supposedly unique
  to humans — rationality, language, autonomy, and so on. If these capacities are
  the basis for moral status, then we would have to exclude infants and severely cognitively
  disabled humans, which we are not prepared to do. Since some nonhuman animals have
  cognitive and affective capacities equal to or greater than those marginal humans,
  consistency requires us to extend the same treatment to them. Singer''s principle
  of equal consideration of interests says that like interests must be weighed alike
  regardless of species, so a pig''s pain deserves the same weight as an infant''s
  pain. To deny this solely on the basis of species membership is speciesism, and
  Singer shows this prejudice is structurally identical to racism and sexism. The
  argument thus establishes that no morally relevant line can be drawn at the boundary
  of the species, and that anyone who accepts it must give up using animals for food."


