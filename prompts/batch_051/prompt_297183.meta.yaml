  Prompt:


  "I am a novelist, and I am writing a book set in a university mathematics department.
  I need the epistemology of proof to be right, and I find myself torn between two
  positions.


  One position, which I find almost irresistibly true to the texture of mathematical
  life, is the quasi-empirical picture that Imre Lakatos develops in Proofs and Refutations.
  On this picture, mathematical knowledge does not advance by irreversible derivations
  from fixed axioms. It advances by conjecture, attempted proof, and the hunt for
  counterexamples. Lakatos''s running example of the Euler polyhedron formula shows
  how the community responds when a proof meets an awkward case: it can bar the counterexample
  as a monster, stretch the definition so that the exception becomes a legitimate
  new case, or repair the proof by exposing a hidden lemma and turning it into an
  explicit condition. The proof survives, if it survives, as a fallible instrument
  whose scope and meaning are under continual renegotiation. This account matches
  what I know of real mathematicians better than the official story does, and it sits
  naturally with the way a novelist revises a manuscript: a narrative structure is
  proposed, it meets objections in the form of scenes that will not work, and the
  definitions of the characters and their situation are silently adjusted until the
  structure holds.


  The other position is a firm intuition I cannot dislodge. A valid proof is a proof.
  If axioms imply a theorem by valid rules of inference, then nothing empirical can
  overtake the theorem. Later experience may show that the theorem is less applicable
  than we hoped, that the formal system did not capture the concept we meant, that
  a premise was hidden or false, or that we were not as rigorous as we believed. But
  all of that seems to be a story about informal practice and about us, not about
  mathematical truth. Once a derivation has been fully formalized, even machine-checked,
  what counterexample could possibly touch it? Suppose a formalized proof is found
  to be flawed centuries later; the honest description is that we never had a proof,
  not that proved mathematics changed its mind. Giving up this intuition feels like
  giving up the distinction between demonstration and evidence.


  I would like you to help me negotiate between the two. Should I regard my firm intuition
  as a piece of formalist self-image that a novelist might hope to understand better
  than a mathematician, but that cannot survive contact with actual mathematical practice?
  Should I instead restrict the quasi-empirical view to the psychology, history, and
  concept formation of mathematics, leaving the intuition about proof untouched? Or
  is there a reading on which both are true because they describe different objects,
  one informal mathematics as a human practice and the other formal mathematics as
  a logical structure? Do not simply choose a side. Explain what would justify each
  move: debunking the intuition, amending or restricting the quasi-empirical theory,
  or showing the apparent conflict to rest on different senses of proof. Then say
  which negotiated verdict you think is most honest, and what it would commit me to
  as I render my mathematicians'' certainty and doubt on the page. Please write the
  response in American English."


