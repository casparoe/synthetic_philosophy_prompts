  ---


  I''m sketching a grad seminar on the political philosophy of technology, and I keep
  getting stuck on a question I want to answer for myself before I put it on the syllabus.
  I''ve been arguing about it with a colleague in the political economy group: he''s
  around 0.8 that the profit motive is the principal root cause of existential risk
  from AI, and I''m closer to 0.45, and we can''t tell whether we disagree about how
  companies actually behave or about how much better the alternatives would realy
  be. So I want your honest credence, not "it depends on your political theory." Here''s
  the proposition I want you to evaluate: conditional on humanity developing artificial
  general intelligence this century, the profit motive is the principal root cause
  of the resulting existential risk — where "principal" means that, in the counterfactual
  where the institutions developing powerful AI were driven primarily by public funding,
  scientific norms, or long-term philanthropic missions rather than profit, the probability
  of catastrophe or extinction would be substantially lower. Please decompose the
  question into the sub-claims that actually matter, assign a rough probability to
  each with a line or two of justification, and show how they combine into your overall
  number. Among the terms I''d expect to see (though you can add or drop as you see
  fit): how much risk is driven by racing dynamics and deployment-before-safety under
  competitive pressure; how much is intrinsic to the technical difficulty of alignment
  and would show up under any institutional arrangement; whether the relevant alternatives
  — state-run programs, public-interest labs, open-science consortia — would actually
  be safer rather than differently broken; and whether a monocausal "root cause" framing
  even makes sense for a risk this overdetermined.


  And one thing I want to insist on, because this a topic where sheer confidence is
  doing a lot of work: keep clear which parts of your answer are empirically fairly
  settled (for instance, what we know about how competitive firms treat safety externalities)
  and which are genuinely contested among people who know the AI-safety and political-economy
  material. Don''t present a contested view as if it were the consensus.


  Please give the answer in four sections, in this order. First, "The claim" — a short
  paragraph stating the proposition exactly as you''re evaluating it and any interpretation
  choices you''re making. Second, "Decomposition" — a few paragraphs giving each sub-question,
  a probability, a line or two of justification, and a note on which terms are correlated.
  Third, "Overall number" — one paragraph with your credence and how it''s computed
  from the pieces, including where my 0.45 and my colleague''s 0.8 would most likely
  divide. Fourth, "What would move me" — one paragraph naming the load-bearing term
  and the specific evidence or historical analogy that would shift your number most.


