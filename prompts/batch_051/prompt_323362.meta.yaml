  answer: cognition stores structured defaults about typical situations, and relevance
  falls out of which schema is active.

  4. But I also believe that how a system knows which schema to activate is itself
  a relevance problem, and adding more schemata just moves the problem up a level.

  5. I think embodied/situated cognition is an important part of the solution: in
  real environments, the world is its own best model, and agents can use perception/sensorimotor
  coupling instead of internal prediction.

  6. I''m drawn to the idea that satisficing and bounded rationality dissolve the
  frame problem: we don''t need the right action, just a good-enough one under time
  pressure, and "good enough" can be fixed without surveying all options.

  7. I also think the frame problem is, in its philosophical version, basically unsolvable
