  I''m a PhD student in philosophy of cognitive science, and I''ve been asked to write
  a short "where I stand" note on the frame problem for our research group, so the
  others can poke holes in it before I give a seminar. I work mostly on predictive
  processing and not directly on the frame problem, so their may be obvious tensions
  I''m missing; what I''d like from you is an audit of whether the following commitments
  actually fit together, rather than a lecture on the frame problem itself.


  My commitments are roughly these. (1) I take the philosophical frame problem seriously
  in Dennett''s sense: it''s the question of how an agent determines which of indefinitely
  many things it knows are relevant to what it should do or infer now, without explicitly
  checking each one. (2) I don''t think this is just an artefact of the situation
  calculus or logicist AI; I think even large language models and connectionist systems
  face a displaced version of the same problem whenever their behaviour has to stay
  coherent over time. (3) My positive leaning is that structured defaults—schemata,
  frames, scripts—are the right kind of answer: once the right schema is active, relevance
  mostly falls out of it. (4) But I also think selecting which schema to activate
  is itself a relevance problem, and adding more schemata mostly moves the problem
  up a level, so schemata seem at best a partial fix. (5) I''m fairly convinced embodiment
  matters here: a genuinely situated agent can use the world as its own model and
  let perception and the environment carry a lot of the relevance constraints, making
  the problem tractable in a way it isn''t for a disembodied reasoner. (6) I also
  like the idea that satisficing and bounded rationality dissolve much of the problem:
  an agent doesn''t need to determine relevance over all its beliefs, it just needs
  a good-enough action under time pressure, and local heuristics can deliver that.
  (7) And yet, at the level of principle, I want to say the frame problem has no algorithmic
  solution: there is no procedure that, for arbitrary stored beliefs and goals, computes
  what is relevant.


  Go through these and tell me which pairs are in genuine tension and which are only
  apparently in tension. For each genuine tension, order them by severity, tell me
  what would have to give, and what the cheapest fix would be. Then tell me which
  single revision would clean up the most across the whole set. Please lead with your
  bottom line in the first sentence and then give the reasoning, with no preamble
  and no restating of the question.


