  positions before you commit.


  Here''s my working definition of a scientific explanation, with four criteria:


  1. Derivation: the explanation lets you derive or predict the phenomenon it explains.

  2. Compression: the explanation is shorter than a full description of the phenomenon;
  it saves you from just listing the data.

  3. Mechanism/cause: it picks out an underlying mechanism or cause or structure,
  rather than just restating what happened.

  4. Why-answering: it answers a why-question, not just a what-will-happen-next-question.


  Now the borderline case. Consider a cellular automaton on a grid, specified by a
  one-line update rule (think Rule-30-ish, but the exact one doesn''t matter). Empirically
  it produces a complicated, seemingly random pattern. The kicker: the usual shortcut
  tools (closed forms, statistical summaries, coarse-graining) all fail; to know the
  state at step 10^9, the only method anyone knows is to run the rule for a billion
  steps. Wolfram''s term for this is computational irreducibility. On the face of
  it, the one-line rule nails criterion 1 (it generates the state), partially nails
  3 (the rule is the mechanism), but it utterly fails 2: there''s no compression,
  the simulation is just as long as the phenomenon.


