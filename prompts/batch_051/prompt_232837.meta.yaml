  Full prompt draft:


  "I''ve been going back and forth on this since I fell down a Wolfram rabbit hole,
  and I''d love a second brain on it. You''re a professional philosopher of science
  who writes for rationalist-adjacent blogs, so you''ve probably thought a lot about
  explanation, prediction, and compression. Think through this carefully, and brainstorm
  a few candidate positions before you commit.


  Here''s my working definition of a genuine scientific explanation, with four conditions:


  1. Derivation: the explanation lets you derive or predict the phenomenon it explains.

  2. Compression: the explanation is shorter than a full description of the phenomenon;
  it saves you from just listing the data.

  3. Mechanism/cause: it picks out an underlying mechanism, cause, or structure, rather
  than just restating what happened.

  4. Why-answering: it answers a why-question, not just a what-will-happen-next-question.


  Now the borderline case. Consider a cellular automaton on a grid, specified by a
  one-line update rule (think Rule-30-ish, but the exact rule doesn''t matter). Empirically
  it produces a complicated, seemingly random pattern. Here''s the kicker: all the
  usual shortcut tools (closed forms, statistical summarys, coarse-graining) fail,
  and to know the state at step 10^9 the only method anyone knows is to run the rule
  for a billion steps. The going term for this in the Wolfram-sphere is computational
  irreducibility. On the face of it, the one-line rule nails condition 1 (it generates
  the state) and maybe condition 3 (the rule is the mechanism), but it fails condition
  2 as badly as anything can: the simulation is exactly as long as the phenomenon,
  so there''s no compression.


  So here''s what I want to know. Is the one-line rule an explanation of the state
  at step 10^9? Go through my four conditions one by one and say exactly where the
  case lands. Then tell me whether this case shows that condition 2 is too strict,
  or that conditions 3 and 4 are the ones doing the real work. Is there a sensible
  distinction between explaining a system (the rule) and explaining a particular fact
  about that system (the state at step 10^9)? Or should I just bite the bullet and
  say some truths are generatable but not explainable, and that''s fine? If it helps,
  say whether you think the irreducibility here is a property of the map or the territory."


