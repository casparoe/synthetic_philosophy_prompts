  The presumptuous philosopher scenario: There are two theories about the universe.
  According to T1, there are 200 billion observers; according to T2, there are 200
  trillion observers. Both are otherwise equal in prior and fit evidence. The self-indication
  assumption (SIA) says you should update in favor of hypotheses with more observers,
  so T2 becomes overwhelmingly likely; SIA seems "presumptuous" because it lets us
  conclude the larger theory with high confidence based on no empirical evidence about
  it. The self-sampling assumption (SSA) doesn''t do this.


