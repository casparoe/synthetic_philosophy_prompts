  Rietdijk–Putnam argument: Take two observers, A at rest and B moving away. For A,
  event E on A''s future at t is simultaneous with event F in B''s present? The argument:
  According to B, E is already present/past. By special relativity, no observer is
  privileged. So if "real now" for B is real, then E is real. But if there is no privileged
  present, then "present for B" still denotes a hyperplane of simultaneity; the argument
  can be presented as: because simultaneity is relative, the set of events that are
  real cannot be limited to a single "now" hyperplane, or else which one? That is,
  (2) and (3) actually support each other: no privileged present motivates taking
  all frames'' presents as equally real, hence all events real.


  However, the Rietdijk–Putnam argument often presupposes the transitivity of reality:
  if E is real relative to B''s frame and B''s frame is as good as A''s, then E is
  real. Some critics say it assumes a "now" is what''s real for each frame; but the
  conclusion is block. So (2)+(3) are fine, though the wording "present or past for
  you" may be taken with (2) no privileged present to be consistent.


