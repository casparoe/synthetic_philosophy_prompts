  ---


  I am trying to work out what epistemic norm governs assertion: under what conditions
  is a speaker entitled to assert a proposition flat out. My working hypothesis is
  that one may assert that p only if one knows that p, but my verdicts on the cases
  below do not all point the same way. I would like you to find the principle — or
  the small set of candidate principles — that best captures my verdicts, run the
  candidates through the cases, and tell me where I must revise.


  Cases:


  1. She glances at a reliable wall clock, sees it reading 3:00, and tells a colleague,
  "It''s 3:00." The clock is accurate. Verdict: plainly fine.


  2. He has no idea what time it is, but on a whim says, "It''s 3:00." It happens
  to be 3:00. Verdict: not fine.


  3. She looks at a clock that stopped exactly twelve hours earlier; by coincidence
  it displays the correct time. Reasonably assuming it is working, she says, "It''s
  3:00." It is 3:00. Verdict: not fine — her claim is true and her belief is reasonable,
