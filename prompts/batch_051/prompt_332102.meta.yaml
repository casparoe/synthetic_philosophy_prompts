  My university''s study-abroad office runs a mandatory pre-departure orientation,
  and every year they hand out a one-page "Responsible Traveler" agreement that students
  have to sign. It tells them to learn the local norms around tipping, lining up,
  and crossing streets before they go, and it says that failing to follow those norms
  isn''t just a bad look or a risk; it says visitors owe it to the people whose city
  they''re in. But the same page admits the norms themselves are completely local.
  A student who doesn''t tip 20% in New York has done something wrong, but a student
  who insists on leaving 20% in Tokyo, where tipping isn''t practiced, has also done
  something wrong. A student who cuts a queue in London wrongs the people behind him.
  A student who jaywalks in Berlin at 2 a.m. with no cars anywhere has still failed
  a rule the Berliners themselves obey. Nobody claims the norms are universal, and
  nobody would say a student is bound by the tipping rules of a country he never visits.
  So the office seems committed to the idea that by merely entering a place you become
  bound by whichever arbitrary-seeming conventions happen to function there.


