  question turns on a Durkheim passage.


  Mechanism: The school board proposes a rule: a student group counts as "religious"
  only if (a) it has a set of beliefs about sacred/supernatural things, (b) regular
  collective rituals, and (c) a moral code its members are expected to follow. Or
  maybe simpler: To be recognized as religious, a club must demonstrate that its activities
  are "a unified system of beliefs and practices relative to sacred things" that bind
  members into a moral community, as the district''s lawyer put it, quoting Durkheim.
  Then the controversy: the Buddhist meditation club (Theravada-ish, no creator god,
  "sacred" is weird), the Confucian ethics club (ancestor veneration? no gods), and
  a "Sunday Assembly"-style secular humanist club that does rituals and community
  but no supernatural. Also a Christian club and a Pastafarian club (gaming). The
  asker wants the rule analyzed: who gets classified, how clubs game the definitions,
  what second-order effects (clubs inventing "sacred things" or rituals to qualify),
