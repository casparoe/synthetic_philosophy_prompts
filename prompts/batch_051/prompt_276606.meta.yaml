  my usage, when the event that settles the gamble also settles every uncertainty
  the gamble required its maker to take on. The bet on red is adjudicable: after the
  draw, you know whether you won, and the unresolved black–yellow composition turns
  out to have been irrelevant to your bet, so nothing the bet relied on remains unknown.
  The bet on black is not adjudicable: whatever ball is drawn, the size of the black
  set—the very quantity on which the bet turned—remains unknown. The gamble consumes
  some uncertainty while leaving its own epistemic basis unresolved, so that even
  after the fact you cannot determine whether your bet was favorable.


  My claim is that the Ellsberg pattern is driven largely by a preference for adjudicable
  gambles rather than by a blanket aversion to unknown probabilities. In the standard
