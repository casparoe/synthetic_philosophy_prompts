  Draft 1:


  "I have been developing a distinction in decision theory that I would like an honest
  assessment of. It concerns the Ellsberg three-color problem. An urn contains 90
  balls: 30 red, and 60 that are black or yellow in unknown proportion. A bet on red
  pays if a red ball is drawn; a bet on black pays if a black ball is drawn. Most
  people prefer the bet on red, even though, on a neutral estimate of the black/yellow
  mix, the two bets have the same expected value. The standard explanation is ambiguity
  aversion: a dislike of unknown probabilities as such.


  I suspect that this explanation is too coarse, and that the relevant property is
  not unknown probability but what I call adjudicability. A gamble is adjudicable,
  on my usage, when the observation that settles the gamble also settles every uncertainty
  that the gamble required its maker to accept. The bet on red is adjudicable: after
  the draw you know whether you won, and the unresolved black/yellow composition turns
  out to have been irrelevant to your bet, so nothing that your bet relied on remains
  unknown. The bet on black is not adjudicable: whichever ball is drawn, the size
  of the black set—the very quantity the bet''s success depended on—remains unknown.
  The gamble leaves its own epistemic basis unresolved; you can never say afterward
  whether you had a good hand.


  My claim is that the Ellsberg pattern is driven largely by a preference for adjudicable
  gambles rather than by a blanket aversion to unknown probabilities. The two properties
  are confounded in the standard design, because the known-probability bet is always
  adjudicable and the unknown-probability bet is not. To see that they can come apart,
  consider an urn with an unknown composition in which the experimenter commits to
  revealing the composition after the draw regardless of the outcome. The bet remains
  just as ambiguous ex ante, but it becomes adjudicable, because you will eventually
  learn the probability on which the bet turned. My account predicts substantially
  weaker aversion to such a bet than to an otherwise identical bet whose composition
  stays hidden; unqualified ambiguity aversion predicts no difference if the ambiguity
  is the same ex ante.


  I would like to know: is this distinction already present in the decision-theoretic
  literature under some name I have missed, and does it coincide with any standard
  model, such as maximin expected utility, smooth ambiguity, recursive utility, or
