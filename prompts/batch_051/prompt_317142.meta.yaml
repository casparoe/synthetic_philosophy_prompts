  A colleague of mine maintains that the common-kind assumption in the philosophy
  of perception has a testable core, and that the argument from illusion owes its
  force entirely to that core. As she formulates the testable claim: for any veridical
  perceptual experience, a subjectively indistinguishable hallucination of the same
  content could in principle be produced by replicating the very same internal neural
  state, and because the two states are indistinguishable to the subject and identical
  in the brain, they are tokens of a single fundamental kind of mental event. The
  external object, on this picture, is merely a trigger for the state. A disjunctivist
  denies the central step: veridical perception is constitutively a relation to the
  mind-independent object itself, so no hallucination, however similar, is the same
  fundamental kind of state.


  I am not asking whether the argument is valid or whether disjunctivism is true.
  I want to know whether this specific claim can be brought under experimental pressure.
  Design the strongest test you can. Give me the manipulation, the measurement, and
  the comparison, using only technology that current perceptual neuroscience actually
  has (for example, psychophysics, fMRI, invasive electrophysiology, or direct cortical
  stimulation). Then tell me which outcome would favor the common-kind view and which
  would favor disjunctivism, and be precise about what a clean result would fail to
  settle. In particular: would showing that the two conditions realize the same neural
  state in every measurable respect refute disjunctivism? Would showing a reliable
  neural difference refute the common-kind assumption? Or does the metaphysical residue
  of the disagreement survive either result?


