  Key distinctions:

  - Argument from illusion/hallucination: A subject can have an experience indistinguishable
  from a veridical perception but without the object. The "common kind" assumption:
  because the two experiences are subjectively indistinguishable and have the same
  immediate neural basis, veridical perception and hallucination are fundamentally
  the same kind of mental event (a sense-datum or representational state). Therefore,
  the objects of perception cannot be ordinary mind-independent objects and the experience
  cannot be essentially a relation to such an object.

  - Disjunctivism (e.g., Hinton, Snowdon, McDowell, Martin) denies the common kind
  assumption: the only common element is the disjunctive characterization "either
  veridically perceiving O or hallucinating." Veridical experience is a relation of
  acquaintance to mind-independent object; hallucination is a different kind. Subjective
  indistinguishability does not imply identity of fundamental kind. Naive/relational
  view.


  Testing a conceptual claim: We could test the *empirical* component of common-kind
  claim: that the same intrinsic neural state realizes both. But disjunctivists generally
  accept that the neural basis may be common; they deny that this settles the mental
  kind question. So the test can only bear on the empirical premise. But the prompt
  can ask: "Design the best test of the claim that there is a common intrinsic state
  token for veridical perception and matching hallucination, and say whether settling
  that would settle the philosophical dispute."


