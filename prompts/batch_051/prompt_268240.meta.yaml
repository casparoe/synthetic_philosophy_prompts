  As a retired physical chemist who has spent the past few years reading philosophy,
  I keep returning to a structural resemblance that I want help assessing.


  Frege''s puzzle, as I understand it, is this. If identity is a relation between
  an object and itself, then the statement that Hesperus is Hesperus and the statement
  that Hesperus is Phosphorus both assert the same relation between the same object,
  Venus. Yet the first is trivial and knowable a priori, while the second was an empirical
  astronomical discovery and could be informative to someone who knew Venus perfectly
  well under both names. Frege''s solution was to distinguish the reference of a name
  (the object) from its sense (the mode of presentation), so that the two identity
  statements differ in cognitive value because they connect different senses.


  In my own field and its neighbors, I see what looks to me like the same pattern,
  though scientists rarely discuss it as such. When a substance is characterized by
  two independent investigative routes—say, the metal identified as the source of
  the yellow spectral line and the element sitting at a particular place in the periodic
  table—the statement that these are one and the same thing is a substantive, informative
  identity claim, not a bit of a priori bookkeeping. The two descriptions are different
  modes of presentation of a single element; the identity statement says that the
  object reached by one route is the object reached by the other. The same thing happens
  in theory change and in multiple discoveries: one research tradition talks about
  the particle responsible for a certain anomaly, another about the particle posited
  for quite different reasons, and the eventual identity claim carries news.


  I cannot tell whether I have found a deep structural identity or merely a loose
  family resemblance, and I would like an analysis. Please lead with your bottom line
  in the first sentence, then give the reasoning, with no preamble and no restating
  of the question.


