  As a retired chemist now working through philosophy, I have been struck by a structural
  resemblance between Frege''s puzzle about informative identity statements and a
  situation that is almost routine in the natural sciences, and I would like help
  deciding whether the resemblance is deep or superficial.


  Frege''s puzzle, as I understand it, is this. If identity relates an object only
  to itself, then the claim that Hesperus is Hesperus and the claim that Hesperus
  is Phosphorus attribute the very same relation to the very same object. Yet the
  first is a trivial matter of logic while the second was a genuine astronomical discovery—someone
  could fully understand both names without knowing that they name one planet. Frege''s
  response was to distinguish the reference of a name, the object, from its sense,
  the way the object is presented; the identity statement is informative because the
  two names present the same object under different senses.


  The scientific situation I have in mind is the identification of a single entity
  through two independent investigative routes. A chemist may identify a metal as
  the source of a distinctive spectral line and, separately, identify the element
  occupying a particular position in the periodic table; the statement that these
  two are one and the same element is informative and was historically a discovery,
  not a piece of a priori bookkeeping. Likewise in theory change, two research programs
  sometimes converge on the same object from different theoretical directions—the
  particle introduced to explain one anomaly turns out to be the particle introduced
  to explain another—and the identity statement carries genuine news. What is asserted,
  in each case, looks like the same relation (a thing is itself), but the cognitive
  value of the statement exceeds that of a tautology because the thing is reached
  by two different routes.


