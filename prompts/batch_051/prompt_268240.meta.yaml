  or a respect in which the scientific cases and Frege''s cases come apart (for instance,
  in whether the informativeness is due to a difference in what is known about the
  object or to a difference in how the object is independently fastened onto). (4)
  Give a verdict on whether the resemblance is deep, superficial, or deep in one respect
  and superficial in another.


