  Let me design the argument carefully.


  Aristotle''s position (Politics Book I): He argues that some people are slaves by
  nature. Key ideas:

  - Rule and subordination are natural and beneficial when part of a whole: soul rules
  body (despotic rule), mind rules appetite (constitutional/royal rule). It''s natural
  and expedient for body to be ruled by soul.

  - There are people who differ from others as body from soul or beast from human:
  those who can do manual labor (use of body) and whose work is the use of the body,
  and this is the best they can do. These are natural slaves; they participate in
  reason only so far as to apprehend it but not to possess it.

  - Hence slavery for them is both expedient and just.

  - But there''s also conventional slavery (by law) — captives of war — which is not
  always just.


  A step-by-step reconstruction:

  (1) If a whole is composed of a rational part and a merely instrumental part, the
  rational part should rule and the instrumental part should be ruled, for the benefit
  of both.

  (2) In some humans, the body does most of the work and reason is present only enough
  to follow instructions, not to deliberate.

  (3) Such a person stands to a fully rational person as a body/animal stands to a
  soul/human.

  (4) Therefore, enslaving such a person is natural, just, and beneficial to the enslaved.

  (5) Hence, if such people exist, natural slavery is justified.


  Where''s the flaw? Potential flaws:

  - Step (1) contains a normative from a descriptive premise or has a hidden premise
  (the "soul" metaphor assumes the inferior benefits, which may not be true for humans).

  - Step (3) is an empirical claim; even if some humans differ in rational capacity,
  the analogy between human variation and soul/body difference is too strong; humans
  differ by degree, not kind.

  - Step (4) has a category error: even if someone is less rational, it doesn''t follow
  that it''s just to treat them as a tool/instrument; they remain moral patients with
  interests.

  - Step (5) assumes "natural" implies "just" — naturalistic fallacy / is-ought gap.

  - Equivocation: "rule" in soul-over-body (despotic) vs political rule among equals;
  Aristotle himself distinguishes forms of rule, so moving from "some forms of rule
  are natural" to "the specific relation of master-slave is natural" smuggles in the
  conclusion.


