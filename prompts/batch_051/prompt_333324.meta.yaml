  Let me record my cases and verdicts, with the understanding that these are my verdicts,
  not arguments.


  1. An able-bodied member of a volunteer trail crew''s club hikes the same paths
  every weekend, enjoys the maintained trail, and has never once joined a work party.
  I call him a free rider and think his conduct is wrong, though minor.

  2. A patient who has needed and received blood transfusions declines to donate blood
