  Moral luck basics:

  - Thomas Nagel''s "Moral Luck" (1979): The problem of moral luck: we judge actions
  and agents morally in ways that depend on factors beyond their control, yet the
  "condition of control" (or Control Principle) says people cannot be morally assessed
  for what is beyond their control. Nagel distinguishes four kinds: resultant (outcome),
  circumstantial, constitutive, causal luck. Resultant luck: whether a drunk driver
  hits a child depends on whether a child happens to cross the street; we blame the
  killer-driver more than the lucky drunk driver. Circumstantial: whether one is put
  in a situation that tests virtue (e.g., Nazi Germany collaborators vs. those who
  emigrated); we praise/blame based on situations. Constitutive: one''s character,
  inclinations, capacities shaped by factors beyond control. Causal: antecedent circumstances
  and causes determine action. Nagel thinks the problem is real; he''s not sure how
  to resolve; suspends judgment. He doesn''t necessarily say moral responsibility
  is impossible? Actually the conclusion is that the condition of control is inconsistent
  with moral judgment; he says the problem has no solution within our current conception,
  not that we should abandon blame.


