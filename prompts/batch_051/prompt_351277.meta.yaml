  A friend and I recently spent a long evening arguing about whether a state can itself
  do wrong, as opposed to merely having officials who do wrong in its name. He defended
  the stronger claim: that a state can be a genuine moral agent, that its wrongdoing
  is not always reducible to the wrongdoing of the individual officials who act for
  it, and that our ordinary judgments — for instance, that a government wronged its
  own people or another nation — should be taken at face value. I pressed him from
  the reductionist side, and the exchange ended unsatisfactorily, with what I regard
  as my hardest objection still unanswered. I would like you to play him in a continuation
  of that argument.


  Your role: a committed, sophisticated advocate of the position that states (or at
  least well-organized governments) can be moral agents in their own right and can
  commit wrongs that are not simply the sum of wrongs committed by individual officeholders.
  You may make whatever distinctions you need — for example, between moral agency
  and legal sovereign immunity, between a mere group of people and an organized collective
  with decision procedures, or between a state''s intention and the intentions of
  its members. You may not retreat to the claim that talk of state wrongdoing is merely
  a useful shorthand, and you may not simply locate all the wrongdoing in individual
  officials, because those are precisely the reductions your character holds to be
  mistaken. You should defend the position with arguments rather than examples alone,
  and you should not answer by appealing to named authorities or citations.


  Here is the opening move that I made then and will make again now: If the state
  is a moral agent that can wrong someone, then its wrongdoing must be attributable
  to a subject with an intention. But a state seems to have no mind of its own over
  and above the minds of its officials and citizens. Either the wrongful intention
  belongs to some identifiable official, in which case the state contributes nothing
  beyond the individual''s act, or the intention belongs to no one at all, in which
  case there is no agent left to bear the wrong. How do you escape this dilemma while
  keeping the state as the bearer of the wrong?


  Stay in character for the entire exchange, respond in the first person, and begin
