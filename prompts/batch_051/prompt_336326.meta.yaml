  Dennett''s view (from "The Self as a Center of Narrative Gravity" and Consciousness
  Explained): the self is an abstraction, a "center of narrative gravity," like a
  center of gravity in physics — a useful fiction, not a thing. It is constituted
  by the narratives we spin, and the narratives are spun by the brain/processes, not
  by the self (that would be circular). So Dennett actually accepts something like
  (5)-(6): the self is not the author; the "I" is a fiction posited by the narrative
  machinery. He might bite the bullet on (7) to some extent — first-person authority
  is not what we think.


  So an argument that "proves too much" could take Dennett''s own move and push to
  absurdity: if selves are centers of narrative gravity, then selves are fictions;
  if selves are fictions, then nobody believes anything, desires anything, writes
  novels, is responsible for anything; but that''s absurd. Where does it go wrong?
  The likely response: "fiction" here doesn''t mean "unreal" in the problematic sense;
  abstracta can be real patterns, and the fact that the self is an abstractum doesn''t
  stop there being true statements about it — just as a center of gravity is a fiction
  yet explains real motions. But the argument showing "no one authors their life"
  may rely on sliding between "the self is not a substance that pre-exists narration"
  and "the self does not really exist / has no causal powers."


  Alternatively, the argument could target the narrativist view more generally (not
  just Dennett). The conclusion: there are no selves, or selves are not real, or autobiography
  is impossible.


  Let me construct a crisp numbered argument:


  1. A self is what it is in virtue of the narrative that unifies a life (premise
  from the narrative self view; also Dennett''s gloss: the self is a center of narrative
  gravity).

  2. A narrative is an artifact of a telling: its unity and shape are imposed by a
  teller who selects, orders, and interprets events.

  3. Whatever is constituted by an artifact of a telling has no existence or nature
  independently of that telling.

  4. So a self has no existence or nature independently of the telling of its story.

  5. The telling of a life-story is something done, and if it is not done by the self
  (on pain of circularity, since the self is what the telling constitutes), it must
  be done by something else: the brain, or the surrounding culture''s conventions
  of personhood.

  6. Therefore the self is a character authored by something that is not the self.

  7. A character authored by something other than itself cannot be the author of anything
  — including its own life.

  8. But persons do author their lives, at least partly: they make decisions, take
  responsibility, and speak with first-person authority about themselves.

  9. So the narrative view entails something false; it must be mistaken somewhere.


