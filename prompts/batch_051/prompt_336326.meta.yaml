  The argument goes like this:


  (1) A self is a center of narrative gravity: what makes a person the single self
  they are is the story — part first-person, part told by others — that unifies their
  memories, actions, traits, and projects into one intelligible arc. This is roughly
  Daniel Dennett''s picture, but it''s also a natural consequence of how I work as
  a novelist: my characters are exactly such centers; there is no inner substance
  beyond the accumulating text.


  (2) A story, however, is a crafted thing. It is told by some teller from some perspective,
  and its unity is imposed by selection, ordering, retrospection, and genre — by the
  telling, not discovered as an independent fact.


  (3) If something is constituted by a crafted narrative — if there is, as Dennett
  says, nothing more to it than the narrative gravity — then it has no existence or
  nature apart from that narrative. What it is, and whether it persists, and what
  belongs to it, are all facts that hold only relative to the telling.


  (4) So a self has no existence or nature apart from the telling of its story.


  (5) Now, every story needs a teller (or at least a telling). But the self cannot
  be the teller of its own constitutive story, because the self is what the telling
  constitutes; that would be circular in the way a character in a novel cannot be
  the cause of the novel that creates her. So the telling must be done by something
  other than the self: the brain, the surrounding culture, the inherited genres of
  personhood, or all of these together.


  (6) If the constitutive story of a self is told by something other than that self,
  then the self is a character in a story authored elsewhere.


  (7) A character authored elsewhere is not the author of its own life: its apparent
  decisions, commitments, and self-descriptions are events within the story, not acts
  of authorship over it.


  (8) But that seems false. People do author their lives in a substantial sense: they
  revise their self-understanding, make commitments that reshape who they are, and
  exercise a certain first-person authority over what they think and feel. If we deny
  this, we deny something at the core of moral life — and something my own practice
  of writing in the first person depends on.


