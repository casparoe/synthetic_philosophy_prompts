  The core of Skolem''s paradox: By the Lowenheim-Skolem theorem, if first-order ZFC
  has a model at all, it has a countable model. Within that model, Cantor''s theorem
  holds: the model satisfies "there is an uncountable set" (e.g., the set of reals).
  But from outside, the model''s domain is countable, so the "reals" of the model
  are only countably many objects. The resolution: the model''s "bijection" that would
  enumerate the reals doesn''t exist inside the model; "countable" is a matter of
  what functions the model has; there''s no contradiction because "there exists a
  bijection" is satisfied only if some element of the model''s domain is a bijection
  between the model''s reals and ω, which can fail while externally there is a real-world
  bijection.


