  Let me recall the Frege–Geach problem. Expressivism: moral judgments express non-cognitive
  attitudes (approval/disapproval, acceptance of norms) rather than beliefs/truth-apt
  propositions. Problem: moral judgments embed in unasserted contexts—conditionals,
  disjunctions, negation—and participate in logically valid inferences. E.g.:

  (P1) If lying is wrong, then getting your little brother to lie is wrong.

  (P2) Lying is wrong.

  (C) Therefore, getting your little brother to lie is wrong.


  This is modus ponens: valid. But if "lying is wrong" expresses disapproval of lying,
  then in the antecedent of the conditional "if lying is wrong..." the speaker isn''t
  actually disapproving of lying—they can say "if lying is wrong, then..." without
  disapproving. So the meaning of "wrong" in embedded contexts can''t be explained
  by the attitude it expresses in asserted contexts. Expressivists must explain how
  the same term contributes both in asserted and unasserted contexts, and why the
  inference is valid. The old "emotivism" (Ayer) said "lying is wrong" = "Boo lying!"
  But "If boo lying, then boo getting brother to lie; boo lying; therefore boo getting
  brother to lie" is not valid—it''s not even well-formed, since "boo" isn''t a propositional
  operator. This is essentially the Frege-Geach challenge.


