  I have been working through the Frege–Geach problem in a metaethics seminar, and
  a classmate offered a reconstruction of it that seems to me to prove too much: it
  appears to show not merely that expressivism owes us an explanation, but that expressivism
  cannot even allow ordinary moral reasoning to be valid. I would like to know where
  the argument goes wrong, if it goes wrong.


  The argument runs as follows. (1) According to expressivism, the meaning of a moral
  sentence just is the attitude it conventionally expresses; for example, "Lying is
  wrong" expresses disapproval of lying. (2) A moral sentence makes the same semantic
  contribution whether it is asserted on its own or occurs embedded inside a larger
  sentence. (3) But the attitude associated with the atomic sentence is not expressed
  in embedded contexts: someone who utters "If lying is wrong, then persuading someone
  to lie is wrong" need not disapprove of lying, or of anything beyond the conditional
  demand itself. (4) If the attitude is all there is to the sentence''s meaning, then
  wherever that attitude is absent, the sentence contributes no meaning. (5) So expressivists
  cannot assign the sentence a stable compositional meaning across conditionals, negations,
  disjunctions, and questions. (6) Yet the validity of ordinary moral reasoning requires
  the moral sentences occurring in it to have just such a stable semantic contribution:
  the inference from "If lying is wrong, then persuading someone to lie is wrong"
  and "Lying is wrong" to "Persuading someone to lie is wrong" is valid purely in
  virtue of its form. (7) Therefore, if expressivism is true, this elementary instance
  of modus ponens is either invalid or has no explanation. (8) No acceptable account
  of moral thought can leave so basic an inference invalid or unexplained. (9) Therefore
