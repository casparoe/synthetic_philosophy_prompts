  Content: Epistemic contextualism vs pragmatic encroachment.


  Distinction:

  - Epistemic contextualism: the proposition expressed by "S knows that p" (or the
  semantic content of knowledge ascriptions) varies with the context of the ascriber.
  Two speakers can both be correct, one saying "S knows" and another "S does not know,"
  because "knows" picks out different epistemic standards in different contexts. The
  knowledge relation itself (the truth) is context-sensitive in virtue of the word
  "know(s)" — indexical.

  - Pragmatic encroachment: whether S knows depends on the practical stakes for S
  (not the ascriber), i.e., the knowledge relation itself is sensitive to practical
  factors for the subject. On one version, subject-sensitive invariantism (SSI), "knows"
  is not context-sensitive; the truth-conditions are fixed, but they include a stakes
  parameter for the subject. On the same evidence, in a low-stakes situation S may
  know while in a high-stakes situation the same S with the same evidence may not.
  This is not about the word "knows" shifting across contexts of attribution; it''s
  about the subject''s situation shifting what it takes to know.


  Bank cases: DeRose''s low-stakes/high-stakes cases are often used to motivate contextualism.
  DeRose argues intuitions vary by attributor context: the "high standards" context
  of the ascriber. Stanley''s SSI says it''s the subject''s stakes that matter. A
  common conflation: treating contextualism as about the subject''s stakes, or treating
  pragmatic encroachment as a semantic claim about the word "knows" shifting with
  the speaker''s interests.


