  (1) If prosperity has only instrumental value, then its value is fully accounted
  for by the goods it delivers—health, education, security, leisure, comfort, and
  similar ends.

  (2) So if those delivered goods are held exactly fixed, differences in prosperity
  between two societies could not make one better than the other.

  (3) Now compare two societies that are equal in every relevant good in (1), but
  one has a vastly larger stock of wealth: more surplus production, more accumulated
  goods, larger reserves. By (2), the two are morally equivalent.

  (4) If two states of affairs are morally equivalent, it can be morally permissible
  to move from one to the other. Thus it would be permissible to destroy the richer
  society''s surplus, provided the goods in (1) do not decline.

  (5) But that conclusion is hard to accept. A society with greater reserves and more
  material abundance is more resilient to shocks, has more options, and could meet
  needs that are not currently on anyone''s list. Destroying that surplus against
  the members'' will seems wrong.

  (6) Therefore (1) is false: prosperity has moral worth beyond what it currently
  buys, i.e. some intrinsic worth.


  I would like to keep something like (1), because I am wary of saying that piles
  of stuff matter independently of any difference they make to anyone. But I do not
  see how to answer (5) without either granting intrinsic worth or smuggling in additional
  instrumental goods that I did not initially list. Which step should I reject, and
  what does rejecting it cost? Is there a way to preserve the spirit of (1) while
  doing justice to what bothers me in (5), or must one of these go?"


