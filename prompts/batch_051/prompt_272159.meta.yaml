  poorer one—by destroying its surplus wealth while preserving the listed goods—would
  involve no moral loss.

  (5) But that is absurd: destroying the surplus would worsen the society''s resilience,
  optionality, and capacity to respond to unexpected needs. So there is something
  morally significant in that surplus.

  (6) Therefore property (1) is false, and prosperity has intrinsic moral worth, not
  just instrumental value.


