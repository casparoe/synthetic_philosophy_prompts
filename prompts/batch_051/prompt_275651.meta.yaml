  Let me refine the GEB argument to have a clean failure point.


  Consider these steps:


  (1) Meaning is not in the outer message alone: the same ink pattern (e.g., "on"
  shapes?) could be a word in English, a numeral in Russian, a noise; so meaning depends
  on how it''s interpreted.


  (2) The thing that determines how the outer message is to be interpreted is the
  frame message — the implicit signal that says, e.g., ''these marks are a sentence
  in English, meant to communicate, not just scribbles.''


  (3) But a frame message is itself a message: it conveys information and can be misread
  (you might fail to recognise the bottle as a message at all, taking it for driftwood
  with scratches).


  (4) If every message''s meaning is determined only by some further message''s being
  interpreted, then interpreting the frame message requires a further frame message,
  which requires a further one, and so on without end.


  (5) An infinite regress of this kind cannot be completed in any finite act of understanding.


  (6) Therefore no finite sequence of marks can have a determinate meaning; but notes
  in bottles do have determinate meanings; contradiction. So meaning must be located
  in something outside the whole message system — perhaps a soul''s act of understanding
  or some bit of intrinsic meaning in the ink after all.


  Where''s the error? Possible responses:

  - Step 4 rests on a false principle: not every aspect of interpretation is determined
  by another message''s *being interpreted*; the frame message can function by causing
  the interpreter to adopt a scheme, without itself needing to be decoded as content.
  The regress is stopped by the interpreter''s ability to respond to a frame message
  directly — "reading" the frame message is not required; executing it is enough.
  This mirrors the Tortoise: rule-following doesn''t require further rules all the
  way down.

  - Or step 3 equivocates on "message": a frame message is not a message in the same
  sense as the inner message; it''s a trigger/invariant. If so, step 4 doesn''t apply.

  - Or step 6 falsely assumes deterministic meaning; maybe meaning is probabilistic/schematic
  (good GEB-ish point).

  - Step 2 might be too strong: the frame message and the outer message and inner
  are not discrete items; meaning is the joint upshot of the whole triplet, so there''s
  no "determining" relation among them. This is closer to the GEB view: meaning is
  not located in any single level but spread over the interaction; the regress only
  arises if you insist on localizing meaning in one level.


