  Draft:


  "You are a professional philosopher working in the philosophy of mind and language,
  with a particular interest in Gilbert Ryle''s account of category mistakes. I want
  you to think slowly and carefully, and to lay out your reasoning step by step.


  In experimental psychology and especially in popular science journalism, brain-imaging
  studies are routinely described with psychological verbs whose grammatical subject
  is an organ rather than a person: the brain decides, the brain inhibits, the brain
  anticipates, the brain knows, the brain lies, the brain is surprised. Findings of
  Libet-type experiments are standardly summarized with some version of the claim
  that the brain makes the decision before the person is aware of it. Yet the same
  institutions that fund and circulate these descriptions — courts, schools, psychiatric
  clinics, ordinary moral practice — continue to attribute deciding, knowing, lying,
  and being surprised to whole people, and hold people answerable for what they decide
  or do.


  I''m puzzled by what this practice presupposes. Does it presuppose that mental terms
  really denote processes inside the skull, so that ordinary person-level attributions
  are just a loose way of talking? Or does it commit what Ryle called a category mistake,
  by taking predicates that belong to the whole person and attaching them to one part
  of the person? Is there an implicit category scheme here in which the brain is the
  true agent and the person is an appearance or a story — and is that scheme doing
  the same damage Ryle thought the ghost in the machine did? More generally: reconstruct
  the implicit philosophy of mind that this reporting practice presupposes, distinguish
  what the practice strictly presupposes from what it merely fits well with, and say
  where it is philosophically underdetermined, so that several theories of mind would
  license the same headlines. Then tell me what would have to change in scientific
  reporting, and in our picture of the agent, if we replaced the presupposed category
  scheme with a Rylean one in which mental predicates are primarily true of whole
  persons in virtue of their dispositions and not of their parts. Before offering
  your final analysis, brainstorm at least three candidate readings of the practice
  and weigh them against one another."


