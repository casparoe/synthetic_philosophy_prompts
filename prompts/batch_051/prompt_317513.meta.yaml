  Potential final:


  "You are a professional philosopher who works on the philosophy of mind and language,
  with particular expertise in Gilbert Ryle''s account of category mistakes. Please
  think slowly and carefully: before you give your final analysis, brainstorm at least
  three distinct ways of interpreting the practice below, weigh them against one another,
  and then state which interpretation seems most defensible and why.


  I have been puzzling over a practice in experimental psychology and its popular
  reporting. Brain-imaging studies are routinely described with psychological verbs
  whose grammatical subject is an organ rather than a person: a study will be summarized
  with claims like that the brain decides, the brain inhibits an impulse, the brain
  anticipates rewards, the brain lies, the brain is surprised. Findings of the Libet-style
  readiness-potential tradition are often rendered as the brain making a decision
  before the person becomes aware of having made it. Yet the very same institutions
  that fund and circulate these descriptions — courts, schools, psychiatric clinics,
  ordinary moral practice — go on attributing deciding, knowing, lying, and being
  surprised to whole people, and they hold people answerable for what they decide
  and do. A friend in neuroscience tells me I am overthinking this: person talk and
  brain talk, he says, are just two levels of description of the same events. I am
  not sure that response is philosophically innocent.


  What I want to know is what this reporting practice presupposes about the mind.
  Does it presuppose a particular theory of mental terms — for instance, that they
  ultimately denote processes inside the skull, so that person-level attributions
  are a loose convenience? Or does the practice commit something like Ryle''s category
  mistake, by taking predicates whose primary home is the whole person and applying
  them to a part of the person, and thereby conjuring a new hidden agent where the
  old ghost in the machine was supposed to be? Reconstruct the implicit philosophy
  of mind that the practice presupposes, but be careful to distinguish what the practice
  strictly presupposes from what it merely fits well with, and to identify where it
  is philosophically underdetermined — that is, where several different theories of
  mind would license exactly the same headlines. Then explain what would have to change
  in scientific reporting, and in our picture of the agent, if we replaced that implicit
  theory with a Rylean account on which mental predicates are true primarily of whole
  persons in virtue of their dispositions rather than true of their parts. In particular,
  would a consistent Rylean have to object to every sentence of the form the brain
  does such-and-such, or only to a certain way of understanding such sentences?"


