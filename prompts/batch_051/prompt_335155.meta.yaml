  ---


  I''m giving a talk at a workshop on the philosophy of emotion with a cross-cultural
  strand, and I need to be prepared for a serious question period. The talk is on
  the Korean Four–Seven debate: in the sixteenth century, Yi Hwang (Toegye) and Ki
  Dae-seung (Gobong) argued over how the Four Beginnings — the moral emotions Mencius
  identified, roughly compassion, shame and aversion, deference, and the sense of
  right and wrong — relate to the Seven Emotions, the ordinary list of joy, anger,
  sorrow, fear, love, hatred, and desire. Toegye initially held that the Four issue
  from principle (li) and the Seven from material force (gi). Under pressure from
  Gobong, who insisted that li and gi never operate apart, Toegye revised the formula:
  the Four Beginnings are the issuance of li with gi following them, while the Seven
  Emotions are the issuance of gi with li riding them. Yi I (Yulgok) later pressed
  the same line harder: strictly speaking, li never issues anything on its own; every
  emotion is an issuance of gi, with li only riding as its structuring norm. The dispute
  is usually read as a metaphysical argument about what causes or issues the emotions.


  My thesis is that Toegye''s revised formula is better read as a normative taxonomy
  than as a causal mechanism. On my reading, it marks the difference between emotions
  picked out by their moral content — the Four Beginnings, conceived as good and defined
  by their proper objects — and emotions picked out as natural kinds — the Seven Emotions,
  which are normatively mixed. The objections from Gobong and Yulgok land hard against
  the causal reading, but mostly pass over the normative one, and the debate looked
  interminable only because both sides kept sliding between the two questions.


  The audience is mostly empirically informed philosophers of emotion together with
  a few psychologists working on appraisal theory and basic emotions, all of whom
