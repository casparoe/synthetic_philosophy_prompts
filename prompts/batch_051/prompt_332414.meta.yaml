  Proposed institution: "A legislature enacts all statutes in a formal manner, but
  after enactment it must also publish, alongside each statute, an official Plain-Language
  Notice (PLN) that states, in everyday terms, what conduct the statute prohibits
  or requires. The PLN is expressly not a source of law and courts may not interpret
  the statute by reference to it. However, in any prosecution, it is a complete defense
  that the defendant actually relied on a PLN and that the PLN materially misdescribed
  the legal rule as applied to the defendant''s conduct; in such a case the defendant
  is acquitted, but the statute remains valid and the PLN is corrected for the future.
  If no PLN exists for a rule at the time of the conduct, that absence is also a complete
  defense for first-time offenders only. Officials who draft PLNs are rewarded for
  brevity (fewer words) rather than accuracy."


  That''s specific. Then ask: "Walk through how this plays out. What happens to the
  content of laws and the content of the notices? What do prosecutors do? What do
  defendants do? Where is it gamed first, and does the system genuinely solve the
  fairness problem for people who can''t know the law, or does it recreate it somewhere
  else?"


