  Now, where is it gamed first? Legislators: writer PLNs strategically — perhaps overly
  broad (to deter conduct the statute doesn''t actually prohibit) since PLN has no
  interpretive force but can only acquit, not convict. Wait if PLN overstates prohibition,
  people may comply unnecessarily (self-censorship), and defendant who complies with
  an overbroad PLN isn''t violating anyway. The PLN''s overbreadth cannot make conduct
  illegal (no legal force), so no conviction based on PLN. But an overbroad PLN could
  cause people not to do things they have a right to do — a chilling effect with no
  legal remedy because courts can''t interpret the statute by the PLN and there''s
  no crime. Could that be gamed by legislators to regulate by notice without law?
  Yes — "regulation by misleading notice": drafters write a PLN broader than the statute;
  private parties comply with the phantom rule; the state enjoys de facto regulation
  while disclaiming legal force. This is a fascinating second-order effect: because
  PLNs have no legal force but are the public''s main source, the state can govern
  through non-binding text, and mistakes that overstate the law go uncorrected by
  litigation (since no one is prosecuted for conduct the state is happy to have stopped;
  the overstatement only gets challenged if someone is prosecuted despite complying?).


  Actually if PLN overstates and someone violates the trust? Need concrete: statute
  prohibits X and Y? Let''s set: Statute prohibits "discharging a firearm within 500
  metres of a dwelling." PLN says "no shooting within 1 km of a dwelling." A person
  shoots at 700m. They comply with PLN but violate statute — prosecution. Defense:
  PLN materially misdescribed rule as applied to conduct — wait, PLN says it''s prohibited,
  so did PLN misdescribe? The person can''t claim reliance on PLN misdescription that
  made them think conduct was legal; they thought (per PLN) it was illegal, so they
  wouldn''t have done it. If they did it anyway, reliance likely not credible. So
  the overstatement creates overcompliance: most people won''t do it at 700m; the
  few who do can still be prosecuted (they didn''t rely on PLN to believe it was legal).
  Thus the state gets de facto 1km buffer without enacting it — and people who obey
  the phantom rule have no standing to challenge (no case or controversy, no injury
  recognized). That''s a strong analysis point.


  Understatement: statute prohibits within 500m; PLN says "within 300m." Shoot at
  400m relying on PLN — complete defense if reliance presumed. Statute remains valid,
  PLN corrected. So understatement transfers risk to the state until corrected.


  This creates asymmetric incentives: officials want overbroad PLNs (over-deterrence
  is privately beneficial to the state, understatement creates acquittals). So PLN
  drafters will systematically overstate. The fairness problem for the public flips:
  instead of being punished for unknowable rules, people are induced to obey rules
  that don''t exist — a different kind of unfairness/deprivation of liberty without
  accountability.


  The reward for brevity amplifies: brevity → vague/overbroad phrasing.


  The "no PLN at all → defense for first-time offenders only" creates gaming by repeat
  status: someone with one prior conviction loses the defense; prosecutors might charge
  a minor first offense precisely to strip the defendant of future no-PLN defenses;
