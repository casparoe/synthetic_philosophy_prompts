  criminalize; if PLN overstates the law, someone who complies with the PLN but violates
  the statute still gets the defense? Actually if PLN overstates (says something is
  prohibited that statute doesn''t prohibit), then no violation anyway if conduct
  is permitted by statute. If PLN understates (omits a prohibition), defendant relying
  on it gets defense. If PLN is accurate, normal rule: ignorance of the statute is
  no excuse; but if PLN exists and is accurate and defendant didn''t read it, no defense.
  So the PLN sets a ceiling on fair notice: reliance on official summary creates defense
  when misleading.


  We should include "reliance" requirement — courts must find actual reliance, subjective,
