  Draft:


  "A jurisdiction is considering the following institution, designed to address the
  problem that people are routinely bound by legal rules they have no realistic chance
  of knowing. All statutes mean exactly what they mean, irrespective of any summary;
  but the state must publish, for every statute, an official Plain-Language Notice
  stating, in non-specialist terms, what the statute prohibits, permits, or requires,
  including illustrative examples where the drafters consider them useful.


  The Notice has no legislative force: it cannot make conduct punishable that the
  statute does not reach, and courts may not consult it when interpreting the statute.
  Its only legal role is negative. In any prosecution or regulatory enforcement, it
  is a complete defence that the defendant actually relied on a then-current Notice
  and that the Notice materially misdescribed the statute as applied to the defendant''s
  conduct, for example by omitting a prohibition that reached that conduct or by making
  it appear lawful. Reliance is presumed if the Notice was current and the conduct
  fell within what the Notice appeared to permit; the prosecution may rebut the presumption
  by showing that the defendant in fact knew the true rule. If the defence succeeds,
  the defendant is acquitted or the citation dismissed, the Notice is corrected, and
  the correction applies only to conduct after the correction is published; the statute
  is untouched and stays in force for everyone else. But if no Notice exists for a
  rule at the time of the conduct, the absence of a Notice is a complete defence only
  for a first-time offender; a defendant with any prior conviction under any statute
  cannot raise the absence of a Notice.


  Finally, the office that writes the Notices has a budget and performance review
  tied to the average word count of its Notices and the speed with which they are
  issued. It is not penalized for a Notice that turns out to have overstated the law;
  it is penalized for any Notice that turns out to have understated the law."


