  Better to craft a question that separates understanding:


  "Consider the following argument:

  (1) Every declarative sentence is either true or false (Bivalence).

  (2) Therefore, ''There will be a sea battle tomorrow'' is true now, or it is false
  now.

  (3) Suppose it is true now. Then it has always been the case that it would be true;
  hence at every earlier time it was true that there would be a sea battle tomorrow.

  (4) If it was always true, then no one could ever have brought it about that there
  wouldn''t be a sea battle.

  (5) Hence, if it is true now, the sea battle is unavoidable; likewise, mutatis mutandis,
  if false.

  (6) Therefore, on Bivalence, all future events are unavoidable.


  Explain the strongest mistake in this argument, and evaluate whether rejecting Bivalence
  for future contingents (as some read Aristotle) actually solves the problem."


