  Let me think about what Berkeley actually argued. George Berkeley (1685–1753), in
  "The Querist" (1735-37), posed questions about Irish economy. He argued that money
  is not real wealth; it is just a ticket or counter for the exchange of goods; the
  real wealth of a nation is its labor/industry and goods. He advocated paper money/credit
  to stimulate demand. Key views: true riches consist in the produce of land and industry;
  money is a measure and means of exchange; gold and silver are valued only by convention;
  paper currency could serve equally well. Also "whether it is not the sounder policy
  to create a circulating medium"—he wanted a national bank issuing paper money. So
  his argument: money is a ticket/counter, not the actual wealth; the economy is not
  improved by hoarding metal but by employment and production. New development: modern
  fiat money and digital bank money; central banking; evidence that monetary policy
  has real short-run effects (not neutral); the idea that the institution of money
  enables transactions and division of labor, so it''s not merely a symptom.


