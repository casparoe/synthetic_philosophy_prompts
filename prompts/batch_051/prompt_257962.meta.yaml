  So I''m a software engineer, and I can''t stop thinking about laws as if they were
  API specs. There''s this legal idea that a criminal law can be thrown out for being
  too vague (I think it''s called void for vagueness). The way I understand it, a
  law is like a function signature: if the caller can''t tell what inputs are allowed,
  that''s on the author. But when I go through concrete cases, my reactions aren''t
  as consistent as I''d like, and I want someone to tell me what principle would actually
  capture them.


  Here are my verdicts:


  - A speed limit posted at 30 mph: fine. The fact that 31 is illegal and 30 is fine
  strikes me as an edge case, not a vagueness problem.

  - A law that says no vehicles are allowed in a park: fine. Skaterboards and electric
  scooters are edge cases, but all terms have edge cases.

  - A law against reckless driving: fine. "Reckless" is fuzzy, but juries seem to
  handle it with an ordinary-careful-person standard.

  - A law against driving faster than is sensible for the conditions: fine, but this
  one makes me pause because it''s almost pure judgment. Still, I''d keep it.

  - A city ordinance against loitering with intent to commit a crime: not fine. It
  feels like it lets police arrest whoever looks suspicious.

  - A law against annoying conduct on public transit: not fine. That''s basically
  criminalizing being irritating.

  - A law against unreasonable noise after 10 pm: fine, weirdly. I want to say "unreasonable"
  is doing the same kind of work as "reckless," and I''m okay with it.

  - A law against disturbing the peace: not fine. Which is weird because "unreasonable
  noise" and "disturbing the peace" feel like they''re almost the same law.


  My working rule is something like: vague laws about physical safety and noise are
  okay, vague laws about annoyance, suspicion, or taste aren''t. But that feels ad
  hoc, like I''m just sorting by what I happen to like.


  Is there a principle that gets all of these except maybe one or two? If not, which
  of my verdicts should I overturn? And what does your principle say about a law against
  disrupting a public meeting, which I keep going back and forth on?


