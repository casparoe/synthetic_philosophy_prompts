  Draft:


  ---


  I am a functional analysis PhD student who reads and referee-reports papers in which
  existence results are proved with Zorn''s lemma—bases for arbitrary vector spaces,
  maximal ideals, Hahn–Banach-type extensions, maximal orthonormal sets. I know the
  statement of the lemma, but I have mostly applied it by pattern-matching, and I
  want something more reliable.


  Please write me a decision procedure, runnable in about twenty minutes without a
  set theorist, for deciding whether a proposed application of Zorn''s lemma—in something
  I am reading or something I am trying to write—is valid, invalid, or incomplete.
  It should be a sequence of questions in a fixed order. For each question, say what
  counts as a sufficient answer, and which answers stop the procedure with ''invalid''
  or ''the argument is incomplete''. Make the procedure require at least the following:
  stating the set and the partial order explicitly; checking that the set is non-empty;
  checking that every chain—not merely every finite or countable chain—has an upper
  bound that lies in that same set; and checking that the element Zorn''s lemma supplies
  is a maximal element, not a maximum, and that its maximality is actually converted
  into the claimed property rather than assumed. Flag the steps that are genuine judgement
  and cannot be mechanised.


  Then run the procedure on these three proposed applications, reporting the verdict
  at each step:

  1. The standard proof that every vector space has a basis, using the set of linearly
  independent subsets of the space, ordered by inclusion.

  2. A fallacious proof that every vector space has a maximal finite linearly independent
  set, by applying Zorn''s lemma to the set of finite linearly independent subsets,
  ordered by inclusion.

  3. A proof that there is a maximal countable ordinal, by applying Zorn''s lemma
  to the set of countable ordinals, ordered by the usual membership ordering on ordinals.


  One of the three should force the procedure to give an answer the proof''s author
  would not like, and one should expose the difference between requiring every chain
  to have an upper bound and requiring only every countable chain to have one. Finally,
  tell me what the procedure cannot do: which failures it cannot catch, and which
  decisions it will still leave to mathematical judgement.


  Please lead with your bottom line in the first sentence and then give the procedure
  and the reasoning; no preamble and no restating of the question.


