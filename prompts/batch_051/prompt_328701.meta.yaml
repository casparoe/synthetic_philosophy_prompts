  Dennett''s "Quining Qualia" (in Consciousness Explained, also in The Nature of Consciousness?
  originally in A. Marcel & E. Bisiach (eds.), Consciousness in Contemporary Science,
  1988). He presents 15 "intuition pumps" aimed at dissolving the concept of qualia.
  The Chase and Sanborn cases: two coffee tasters. Mr. Chase says his taste has changed:
  the coffee tastes the same as it always did, but he no longer likes it (a change
  in his evaluative reaction/judgment). Mr. Sanborn says his taste has not changed:
  he still likes the coffee the same, but the way it tastes to him has changed over
  the years (a change in the qualitative experience). Dennett''s point: both men report
  a dissociation between the "qualitative" property and their judgment/reaction, but
  introspection cannot decide whether the change is in the qualia or in the judgment;
  indeed, the distinction between the "way it seems" and "the judgment about how it
  seems" collapses on analysis — there is no additional fact of the matter. The standard
  properties claimed for qualia: ineffable, intrinsic, private, directly or immediately
  apprehensible. Dennett argues nothing can have all four; the concept is incoherent;
  "there are no qualia."


  A popularizer''s summary might say: "Dennett showed, with his two coffee tasters,
  that people can''t tell whether their tastes or their taste-experiences have changed;
  since qualia are supposed to be directly known, this shows our direct knowledge
  of our own experience is unreliable; therefore qualia, if they exist, are unknowable,
  and probably they don''t exist — consciousness is just a set of behavioral dispositions."
  The subtle misrepresentations: (1) conflating "we can''t introspectively distinguish"
  with "qualia are unknowable" — Dennett is making a stronger claim that the distinction
  is not merely epistemically inaccessible but theoretically empty; (2) "therefore
  qualia don''t exist" — Dennett does conclude there are no qualia, but the summary
  may overstate it as "consciousness is an illusion" or conclude eliminativism from
  a purely epistemic premise; (3) "consciousness is just behavioral dispositions"
  — Dennett is not a crude behaviorist; his positive view is heterophenomenology/multiple
  drafts, and he doesn''t deny conscious experience, but denies qualia as conceived.
  A fair audit would distinguish: Dennett does use Chase/Sanborn; he does think the
  cases undermine the distinction; he does conclude there are no qualia; but he doesn''t
  rest the conclusion solely on "we can''t tell," and he doesn''t deny experience
  tout court nor end at behaviorism.


