  ---


  I serve on the collections governance board of the [Foundation name], a nonprofit
  digital archive. The board must issue a written decision about the Meridian Survivors''
  Forum collection, and I have volunteered to draft the decision memo. I am a senior
  software engineer by training; I have no formal philosophy background, so the memo
  should stand on the facts of the case and on clearly explained reasoning rather
  than on scholarly authority or citations.


  The collection consists of roughly 84,000 posts made between 1998 and 2007 to a
  private, pseudonymous bulletin board used by former members of a high-control religious
  community, the Church of the New Covenant. The forum served as a support network;
  its posts include first-person accounts of forced labor, psychological abuse, sexual
  assault, family separation, and the process of rebuilding a life after leaving.
  The forum''s organizers shut it down in 2007 and transferred a copy to a research
  foundation, which later merged into our archive. There was no terms-of-service provision
  at the time covering long-term archival use, and no one sought the consent of individual
  posters before the transfer.


  A group of former members has petitioned the board to delete the collection permanently.
  They argue: the forum was a closed, therapeutic space; posters reasonably expected
  it to remain private to the community; many accounts are identifiable to employers,
  neighbors, or family; continued preservation has already led journalists to contact
  members using details mined from the posts; and keeping the archive alive locks
  people into the worst period of their lives. For them, the ability to forget is
  a condition of dignity and recovery; the archive keeps the injury present.


  Another group — including other former members, two historians, and a transitional-justice
  organization — asks the board to retain the collection as a read-only, searchable
  record. They argue: these posts are some of the only contemporaneous documentation
  of how the church operated; the church now denies that the abuses occurred and has
  its own well-funded campaign to reshape the historical record; deletion would make
  the archive the church''s accomplice in that erasure; and there is an obligation
  to remember the harms done to people, some of whom have since died. They propose
  instead to de-index the posts from public web search, require users to apply for
  access, log use, and forbid bulk download, while leaving the full collection intact.


  Two further facts complicate the decision. First, a third-party web-crawling project
  already holds an incomplete mirror of the forum, including some of the most identifying
  posts, and has refused past requests to remove material. Second, the donor agreement
  under which the collection came to us states that the materials are deposited for
  long-term preservation and may be restricted for privacy reasons but may not be
  destroyed except for cause specified at the time of deposit, which this would not
  fall under. The board''s counsel has advised that the legal risk of deletion is
  modest but not zero, and that retention with access restrictions is the most defensible
  legal posture.


  The board must choose among three options: (1) delete the collection and all backups,
  and request that the mirror project and search engines remove it; (2) retain the
  collection as currently accessible; or (3) retain it under a restricted-access model
  with a review process, an initial 25-year embargo on the most identifying posts,
  and a process for individual posters to request redaction. I need the memo to recommend
  one option, with reasons that the losing parties could actually respond to, and
  it should honestly address the strongest argument on the losing side.


