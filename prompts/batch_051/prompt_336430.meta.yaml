  knowledge event E such that, at each state in E, a non-null trade is feasible and
  each agent''s conditional expected utility from the trade weakly exceeds his conditional
  expected utility from the status quo, with strict inequality for at least one agent.
  In other words, if agents are risk-averse and start from an ex ante Pareto-optimal
  allocation, they cannot common-knowledge agree to a Pareto-improving trade based
  on private information.


