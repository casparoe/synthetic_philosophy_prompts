  No-trade theorem (Milgrom & Stokey 1982): In an exchange economy with risk-averse
  expected-utility maximizers who share a common prior over the state of nature and
  who start from a Pareto-efficient allocation, it cannot be common knowledge that
  a new allocation Pareto-improves on the initial one if the only new information
  agents have received is private. Equivalently, if it is common knowledge that trade
  is mutually beneficial, there are no gains from trade based purely on private information.
  The classic comparative statics: the announcement of willingness to trade reveals
  information ("I am selling, so maybe I know something bad"), leading to no-trade.


  Key components to teach:

  - Common prior assumption (Aumann): agents may have different posterior beliefs,
  but if their beliefs are generated by Bayesian updating from a common prior, they
  can''t "agree to disagree" (once posteriors are common knowledge, they must be equal).
  Actually Aumann: if two agents have common priors and their posterior probabilities
  for an event are common knowledge, then those posteriors are equal. This is exactly
  the no-agree-to-disagree result.

  - The no-trade theorem builds on Aumann: if trade is common knowledge, the willingness
  to trade itself becomes public info. The event that both want to trade becomes common
  knowledge, which carries info about the state; after updating, the gains vanish.
  It''s like "if someone is willing to sell you an asset, that very fact makes you
  revise downward."

  - Common knowledge of rationality and common priors are strict assumptions; the
  theorem is a "no-speculative-trade" result.

  - Relation to epistemology of markets: markets aggregate information through prices,
  but the no-trade theorem highlights a tension: if prices reveal all information,
  then no one can profit from private info, so no one would acquire it (Grossman-Stiglitz).
  Also, markets can aggregate info without anyone explicitly agreeing. But the theorem
  suggests that with common priors, informational differences would not generate trade;
  observed trade may reflect heterogeneous priors/non-Bayesian behavior/risk-hedging/liquidity
  needs.

  - Misconceptions to expect: (1) treating the theorem as an empirical claim that
  speculative trade never happens, when it''s a theorem under idealized assumptions;
  (2) conflating no-trade with market efficiency or thinking it means prices already
  contain all info; (3) thinking common priors means everyone has the same beliefs
  at all times; (4) thinking the result requires both traders to be risk-neutral or
  assumes zero transaction costs; (5) thinking information asymmetries necessarily
  create profitable trading opportunities; (6) interpreting no-trade theorem as "rational
  markets don''t trade" ignoring hedging/liquidity trade, which is not purely informational.


