  unique subgame-perfect equilibrium path.

  3. Therefore, if human players were rational, they would immediately exit in every
  such game, never reaching later, mutually beneficial nodes.

  4. But in experimental centipede games, humans reach later nodes and out-earn the
  BI prediction; also, we would regard immediate exit as stupid and self-defeating.

  5. So the theory predicts that rational agents do worse than irrational ones — a
  rational choice theory that predicts rationality is bad for you refutes itself.

