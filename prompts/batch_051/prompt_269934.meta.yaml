  does Nina''s disintegration illustrate what happens when the body''s pre-reflective
  command of its own possibilities comes loose under a regime of mirrors, correction,
  and self-surveillance? I''d like the reading to be honest in both directions: where
  does Merleau-Ponty genuinely illuminate the film — say, Nina''s technically perfect
  but somehow uninhabited dancing, or her inability to occupy the Black Swan role
  as a bodily possibility rather than an image to imitate — and where does the film
  resist or complicate a Merleau-Ponty-style account? In particular, consider whether
  the horror of the film comes from the breakdown of the lived body or from something
