  choice fully verifiable and shared — a kind of publicly auditable voting-on-chain
  where your vote is a permanent public record, and people can see whether you voted
  and for whom. The standard model already has a D term for social duty and a cost
  C. Does a public, permanent, shareable ballot change the paradox itself, or just
  move things around inside the D term?"


