  The doomsday argument (DA) roughly: We should reason as if we are a random sample
  from the set of all humans who will ever live. If humanity is short-lived, then
  the total number N is small, and we''d expect to find ourselves at a fairly late
  birth rank (because in a small total, any given rank is proportionally large). Wait,
  the argument: Consider two hypotheses about total human population: Doom Soon (N
  = ~100 billion) and Doom Late (N = ~10 trillion+). If you find yourself as roughly
  the 60-billionth human, this observation is much more likely under Doom Soon (where
  60 billion is a large fraction of N) than under Doom Late (where 60 billion is an
  early, tiny fraction). So by Bayes, the observation of your low-ish birth rank/early
  position tilts toward "we are near the end" — it raises the posterior probability
  of Doom Soon. Actually careful: The argument uses the self-sampling assumption (SSA):
  reason as if you were a random sample from all observers in your reference class.
  If N is small, being at rank ~60 billion is typical; if N is huge, being at rank
  60 billion is extremely early (only a tiny fraction of all humans live this early).
  So your observed rank confirms small N. This pushes toward expecting extinction
  relatively soon (unless there''s a huge future population).


  This argument is disputed along many lines: the choice of reference class (humans?
  sentient beings? observers? civilizations?), whether you should reason as if randomly
  sampled (SSA vs SIA — self-indication assumption says your existence gives more
  weight to hypotheses with more observers), whether the argument applies at all since
  the future is not fixed, and the problem of "doomsday" requires there be no huge
  later population (e.g., we could go extinct soon but then be replaced by digital
  minds who also count).


