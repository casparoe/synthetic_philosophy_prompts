  Let me reason about the paradox of voting more concretely. The standard argument
  (Downs 1957; Riker and Ordeshook 1968): Expected utility of voting = p·B − C + D,
  where p is probability of being pivotal, B is differential benefit between preferred
  and less preferred candidate, C is cost of voting, D is intrinsic/civic duty. Since
  p is astronomically small in large electorates, p·B is essentially zero for any
  reasonable B, so unless D > C, voting is irrational. The paradox: high turnout persists
  despite this. Common fixes: D term (civic duty, expressive value), or people overestimate
  p, or ethics rules (rule-utilitarian "what if everyone stayed home?").


