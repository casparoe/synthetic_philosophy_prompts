  Prompt:


  I got into a disagreement with a friend after reading Ralph Burns''s poem "Barbed
  Wire" (from his book *Mozart''s Starling*, Ohio Review Books, 1990). The speaker
  lists dozens of actual barbed-wire types—Reynold’s Web, Preston’s Braid, Meriwether’s
  Cold-Weather Wire, Shellaberger’s Long Zigzag, Curtis’s Ladder, Visible Lace, Sproul’s
  Twins, Elsey’s Ribbon, Brink’s Buckle, Ellwood’s Star—then says:


  “Unloved, unloving; that to name these

  Does no political good, but as precision

  Is polemical, against vague statement

  And circular evasion, as the sharp angle of sun

  And crossed wires together body forth a spark,

  It is some kind—cold, unmusical, utterly itself,

  Keeping cattle in, or the enemies of sheep

  Out.”


  I tend to think that if you want to talk about martial virtues like courage or valor
  outside actual war, it helps to be ruthlessly concrete about implements and practices—naming
  exactly what a rapier, smallsword, or fencing mask is, what a modern pentathlete
  trains, what a military historian counts as a fortification. My friend says this
  is just collecting jargon and anaesthetizes the moral core of courage. The poem
  seems caught between the two: it says naming “does no political good,” but then
  it justifies naming as “precision” that is “polemical, against vague statement and
  circular evasion.” So my epistemic habit is: when someone starts talking about valor
  or the martial virtues in civilian life, I discount their claim unless they can
  point to something as specific as the items in Burns’s list. Is that defensible?
  Or am I turning a poem’s aesthetic move into a general rule that will mostly filter
  out people who are actually courageous but inarticulate?


