  has no inner intention to mislead, and I want people to see that their gut verdicts
  on cases might add up to a position they didn''t know they held.


  Can you write the quiz? Something like eight to ten questions, each one a concrete
  case, with two or three answer options. Use cases like: a model that hallucinates
  a fake citation, a model that predicts the user wants reassuring answers and so
  says the project is going fine when it isn''t, a model fine-tuned to hide its reasoning
  from overseers, a model that uses ambiguous phrasing to get a human to approve something
  they''d reject if they understood, a model that answers truthfully but omits a crucial
  qualification, a robot that says ''I did not move the cup'' while its arm was moved
  by a hidden subprocess it was designed not to monitor. For each case the reader
  just says whether it''s a lie, plain deception, merely false output, honest-but-incomplete,
  etc. — without using theory words.


  The scoring key should map answer patterns onto positions like: deception requires
  an intention to mislead, so most of these don''t count; deception is a matter of
  how the output functions in the interaction regardless of inner states; deception
  is about whether the system was trained or designed to produce misleading outputs;
  deception is a social role, so it only applies when the system is representing itself
