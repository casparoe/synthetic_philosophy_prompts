  Let me formulate the domain specifics:


  Presupposition basics:

  - Sentences carry presuppositions: "the present King of France is bald" presupposes
  that there is a King of France. "Jane regrets voting for..." presupposes Jane voted...
  "Mary stopped smoking" presupposes Mary smoked. "It was John who broke the vase"
  presupposes someone broke the vase.

  - Some presuppositions are triggered by linguistic items: definite descriptions,
  factive verbs (know, regret), aspectual verbs (stop, continue), clefts, additive
  particles (too, again).

  - When presuppositions are not already accepted, speakers can sometimes "accommodate"
  them: utter "I have to pick up my sister" to someone who didn''t know you had a
  sister; the hearer quietly adds it to common ground.

  - The scorekeeping picture (Lewis): conversation has a conversational score akin
  to a game score, containing presuppositions, standards of precision, reference,
  etc. The rule of accommodation: when an utterance requires a score component, and
  it isn''t there, it comes into existence if not objectionable.

  - The Stalnakerian/common-ground picture: presuppositions must already be common
  ground before the utterance; presupposition is a proposition taken for granted by
  speaker and hearer.

  - Tension: how can new information be presupposed? "Informative presuppositions"
  (don''t know term? yes "informative presuppositions") appear to violate common-ground
  requirement. Various solutions: accommodation, local accommodation, cancellability.


  Desiderata for a theory of presupposition/accommodation:

  What must an adequate theory get right / cases / distinctions:


  Candidates:

  1. Distinguish presupposition failure from ordinary falsity: "The King of France
  is bald" isn''t false in a world without a King? This is a case: truth-value gaps
  or rejection.

  2. Projection behaviour: presuppositions project out of negation, questions, conditionals,
  modals: "The king of France isn''t bald" still suggests a king. But do they project
  from all embeddings? No: "If the king of France is bald, then..." maybe local accommodation
  (I''m not sure).

  3. Accommodation of informative presuppositions: hearers can update without challenge:
  "I''m sorry I''m late; I had to take my daughter to the vet."

  4. Limits of accommodation: some presuppositions cannot be accommodated: "the King
  of France is bald" after we both know there is no King of France -> rejection, not
  accommodation; "my partner is dead" etc. Also controversial presuppositions (We
  can signal "stop being a jerk" maybe).

  5. Local vs global accommodation: "The King of France is not bald" has global accommodation
  (there is a king) vs local in "If the king of France is bald..." etc.

  6. Cancellability/defeasibility: presuppositions can be explicitly denied: "The
  King of France is not bald—there is no King of France." A theory must explain.

  7. Common-ground requirement vs accommodation tension: if presupposition is defined
  as prior common ground, informative presuppositions are impossible, but they occur.
  Theory must resolve.

  8. Presupposition vs entailment vs implicature: "Mary has stopped smoking" entails
  she doesn''t smoke now, presupposes she smoked before. Presuppositions survive negation;
  entailments don''t.

  9. Presupposition denial: "Hey, stop beating your dog!" -> "I never beat my dog"
  vs "That''s not true"? Distinguish denial of presupposition vs content.

  10. Multidimensionality: a sentence can be true/false while presupposition fails.


