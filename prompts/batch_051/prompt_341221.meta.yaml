  Let''s design the Condorcet variation carefully.


  Canonical Condorcet Jury Theorem: n voters, each votes independently, each has probability
  p > 0.5 of choosing the correct option; as n grows, probability that majority is
  correct tends to 1. If p < 0.5, majority tends to be wrong (grows). If p = 0.5,
  50%. The theorem assumes independence (conditional on the state) and homogeneous
  competence.


  Variation: In a referendum, suppose the electorate consists of two groups: informed
  voters (share q, competence p_H = 0.6) and misinformed/systematically biased voters
  (share 1-q, competence p_L = 0.45) — or perhaps their errors are correlated. Ask
  how majority rule''s epistemic performance changes as n grows; find the condition
  on group sizes/competences such that adding more voters helps or hurts; compare
  to the classic theorem. Could ask whether a "competence distribution" with average
  competence above 0.5 but some below 0.5 breaks the result; does independence or
  correlation matter more?


