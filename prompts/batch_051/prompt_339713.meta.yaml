  "Ok so in my formal epistemology class we''ve been doing objective Bayesianism and
  the maximum entropy principle, and I have this idea I want checked before I put
  it in a paper. MaxEnt says: when you have no discriminating evidence, your prior
  should be the distribution with maximum entropy subject to whatever constraints
  you have, because it adds the least information beyond the data. The usual problem
  is that its parameterization-dependent. Take a coin with unknown bias θ ∈ [0,1].
  With no constraints, MaxEnt gives a uniform prior over θ. Now write the exact same
  unknown bias as α = θ². With no constraints, MaxEnt gives uniform over α, which
  transforms back to a prior over θ proportional to 2θ, so it''s tilted toward θ near
  1. Same setup, same ignorance, two different ''rational priors,'' depending on how
  you labeled the unknowns. (Log-odds makes it even more dramatic.)


  Here''s the idea I''ve been calling answer-space indifference. There is no rational
  prior over the world; there is only a rational prior over the answer-space you actually
  asked about. A prior isn''t measuring ignorance about some parameter out there.
  Its measuring ignorance about the space of answers you set up before you looked.
  So the θ-vs-α mismatch isn''t a bug, its the view working: θ-space and α-space are
  two different questions, with different neighborhoods of nearness and different
  symmetries, so of course the maximally ignorant prior over each one is different.
  Same physical thing, two different questions, two different rational ignorances.


