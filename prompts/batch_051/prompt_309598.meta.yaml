  Working title: Is 2 an element of 4?


  My starting point is the familiar observation that the usual set-theoretic reductions
  of arithmetic disagree on this question. In the von Neumann reduction, where 0 =
  ∅ and n+1 = n ∪ {n}, the number 2 is the set {∅, {∅}} and 4 is the set {∅, {∅},
  {∅,{∅}}, ...}, so 2 ∈ 4. In the Zermelo reduction, where n+1 = {n}, the number 4
  is the singleton of 3, so 2 ∉ 4. Since both reductions model the natural numbers
  perfectly well, one cannot say, on purely arithmetic grounds, which answer is correct.


  The structuralist moral is that the question is spurious: numbers are not any particular
  objects privileged over the others; they are positions in the abstract structure
  shared by every ω-sequence, and the membership facts are artifacts of a coding.
  I want to push this moral a bit further by distinguishing two readings of the question.


  On the first reading, the question is intra-reductional. It asks: in a given admissible
  reduction, does the object occupying the 2-role stand in the reduction''s membership
  relation to the object occupying the 4-role? This question is perfectly well-defined,
  and its answer is reduction-relative. On the second reading, the question is cross-structural.
  It asks whether the number 2 itself, independently of any reduction, stands in a
  real membership relation to the number 4 itself. I claim structuralism should reject
  this reading as ill-posed: it presupposes an objectual view of numbers that the
  structuralist is already committed to denying, and it treats an intra-reductional
  relation as if it were a feature of the positions themselves.


  My worry is that this may be too quick. If the structuralist says that 2 and 4 are
  positions, then the second reading can be restated as: does the 2-position stand
  in the membership relation to the 4-position? Unless the structuralist can explain
  why membership is not a relation among positions in the way that, say, less-than
  is, the claim that the question is ill-posed looks like a stipulation rather than
  a result. What I would like to know is: (a) Is my distinction between intra-reductional
  and cross-structural readings doing real work, or is it just relabeling the familiar
  point that membership questions are relative to a reduction? (b) Is there a non-question-begging
