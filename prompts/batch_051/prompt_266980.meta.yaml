  I am a third-year undergraduate in a seminar on Rousseau and the moral critique
  of the arts. We have been reading his Letter to M. d''Alembert on the Theatre, and
  I keep noticing a parallel I cannot settle. Rousseau''s claim, as I understand it,
  is not merely that theater often depicts vice sympathetically, but that its generic
  structure makes it incapable of improving morals: the spectator is placed in a relation
  of compassionate identification without practical involvement. Emotion is consumed
  rather than turned outward. For example, in his treatment of Molière''s Le Misanthrope,
  Rousseau thinks the audience is encouraged to regard Alceste''s uncompromising virtue
  as ridiculous and to side with the sociable deceivers, because comic form rewards
  the characters who adapt to society''s corruption. What the stage produces, then,
  is not imitation of good examples but a self-satisfied emotional response that leaves
  the spectators'' practical character untouched. This looks to me structurally identical
  to something in contemporary digital life: on social media, posting outrage at a
  distant injustice, sharing a testimony, or updating one''s profile in solidarity
  is often called "activism," but much of it seems to function as emotional display
  to an audience while substituting for the more costly actions that would actually
  address the wrong. The platform, like the theater, frames ethical feeling as something
  to be performed and consumed; it rewards the most moving self-presentation rather
  than coherent practical commitment. And just as Rousseau thought the theater''s
  failure was intrinsic to spectatorship and mimesis rather than a matter of bad plays,
  I suspect social media''s moral failure is intrinsic to its structure of profile-based
