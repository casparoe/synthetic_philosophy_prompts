  ---

  I''m a PhD student working on Kant and post-Kantian philosophy, and I''ve noticed
  I''ve drifted into a screening rule for a certain kind of argument that I probably
  can''t state as cleanly as I''d like. A lot of my time is spent reading transcendental
  arguments — arguments that start from something supposedly undeniable (that we have
  experience, or that we can use language, or that there are norms) and then infer
  some condition that must already be in place for that thing to be possible. My rule
  is this: I rewrite any such argument as an ordinary conditional — "if there is experience
  at all, then X must be in place" — and then I ask whether that conditional is being
  treated as a conceptual truth or as a broadly empirical/psychological claim. If
  it looks empirical, I stop granting it any special "transcendental" force, and I
  demand the same kind of evidence I''d demand from a cognitive psychologist. If the
  proponent can''t give that evidence and still insists the claim has a priori necessity,
  I basically discount the argument to zero. My supervisor thinks this is a way of
  never being convinced by a transcendental argument: I''ve set the bar so that any
  interesting necessity gets reclassified as hidden psychology and then fails. That
  stings, because I do want to be moved by the good ones. Is my rule defensible as
  a screening policy, or is it a bias with a vocabulary? Is there a version of it
  that keeps the filtering benefit without ruling out the arguments that should convince
  me, and how would I tell from the inside which version I''m running?

  Bottom line first, then the reasoning; no preamble, don''t restate the question
