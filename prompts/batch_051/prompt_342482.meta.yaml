  "Deflationism is the view that truth is not a substantial property that sentences
  or propositions have, like corresponding to the facts. When I say that a sentence
  is true I am not describing an extra feature of it; the word ''true'' is just a
  device for endorsing sentences, generalising over sentences, and moving between
  sentences and the world.


  The two most important deflationist views are Ramsey''s redundancy theory and Tarski''s
  disquotationalism. Ramsey held that ''It is true that snow is white'' and ''Snow
  is white'' say exactly the same thing, so ''is true'' is redundant. Tarski''s disquotationalism
  says that all there is to the truth predicate is the T-schema: for every sentence
  P, ''P'' is true if and only if P. Tarski showed that these biconditionals are unproblematic
  if the truth predicate belongs to a metalanguage and is applied to sentences of
  an object language.


  Case (a) is straightforward: since ''p is true'' means the same as ''p'', asserting
  one and asserting the other have the same content, and the deflationist is happy
  to accept that.


  Case (b) is harder. In ''If what the witness said is true, then the defendant is
  guilty,'' the truth predicate cannot simply be deleted, because the antecedent is
  not a displayed sentence. The disquotationalist can handle this by reading the conditional
  as: for each sentence P, if the witness said that P and P, then the defendant is
  guilty. If the witness said only one thing this works, but otherwise it only gives
  a list of conditionals rather than the original general claim, so it is not a full
  solution. Belief reports are an even clearer difficulty for the redundancy theory:
  ''John believes that what the witness said is true'' and ''John believes that P''
  can come apart, because John may not know what the witness said or may have no view
  about the particular proposition. So redundancy theory is too strong in claiming
  strict synonymy.


  Case (c) is the classic problem. ''Everything the witness said is true'' cannot
  be replaced by a finite conjunction of the things she said, if she said many things,
  and the deflationist seems committed to treating it as an infinite conjunction of
  the corresponding T-schema instances. The pro-sentential theory is designed precisely
  for this: it says that the predicate ''is true'' is a prosentence, which picks up
  its content from an antecedent in the same way a pronoun picks up its reference.
  So ''Everything she said is true'' would inherit content from each thing she said.
  But this is really just the redundancy theory in new notation, and it still has
  the same problem with belief contexts, because prosentences inherit only references-to-contexts,
  not content. On the whole, deflationism handles simple assertions well but has unresolved
  problems with generalizations and non-extensional contexts."


