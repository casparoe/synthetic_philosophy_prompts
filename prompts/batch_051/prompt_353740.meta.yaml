  I''m a high school student, and I got into an argument in our AI club that I''d
  like help settling rigorously. One of the older members, explaining why fine-tuned
  models sometimes behave strangely, claimed that training a neural network by gradient
  descent is basically natural selection running on a computer: the loss function
  corresponds to a fitness landscape, gradient steps correspond to selection among
  fitter variants, and both processes are blind, local optimizers that climb whatever
  hill they start on without knowing whether it is the highest one. From this he drew
  the conclusion that we should not be surprised when trained models end up with awkward,
  just-good-enough solutions — he pointed to the blind spot in the vertebrate eye
  and the routing of the recurrent laryngeal nerve as evidence that evolution accepts
  such solutions, and said gradient descent is stupid in the same sense and fails
  in the same ways. His further claim was that the two are such close analogues that
  we can read lessons about machine learning directly off of evolutionary biology.


  I want to examine that analogy point by point before I accept it. Please lay out
  the intended correspondences explicitly, as in a table, and then go after the disanalogies.
  In particular, I''d like to know: (1) whether a population of organisms and a single
  set of model weights occupy their respective landscapes in comparable ways; (2)
  whether mutation and recombination actually supply anything like the gradient information
  that backpropagation computes; (3) whether fitness is even a differentiable scalar
  analogous to a loss; (4) whether selection changes a population the way a gradient
  update changes a network; and (5) which differences are merely cosmetic and which
  ones matter for the argument my classmate was trying to make.


  Then, considering the disanalogies that matter, give me your verdict: does his conclusion
  — that gradient descent inherits evolution''s failure modes as a stupid optimizer
  — survive? And what, if anything, can gradient descent genuinely learn from natural
  selection as an optimizer, or natural selection from gradient descent? I''d rather
  you leave it open if the analogy is genuinely partial, rather than saying flatly
  that it does or does not hold.


