  given your birth rank r ~ Uniform(1,N), observing small-ish r favors small N (or
  predicts high posterior for N not too much bigger than r). This is like estimating
  the total number of tanks N from the largest observed serial number m, where the
  likelihood is 1/N for each tank. If you capture an animal with tag number r, and
  tags run 1..N, your observation r gives likelihood 1/N for N >= r, favoring smaller
  N. In the tank problem, serials are sampled without replacement (or with?) and you
  usually observe max; in doomsday, you observe your own rank as a single draw, not
  max. But actually there is a closer analogy: you are one random sample (capture-recapture
  with a single recapture?) In capture-recapture (Lincoln-Petersen), you mark M individuals,
  then later capture n and see m marked; estimate total N ≈ n*M/m. In doomsday, hmm.


  The doomsday argument is closer to "the German tank problem" in that you observe
  a single serial number (your birth rank) drawn uniformly from 1..N and infer N.
  If you observe your rank r (e.g., 60 billion), the likelihood of N is 1/N for N≥r,
  cut off; this gives... With an improper prior 1/N, posterior ~1/N² for N≥r, so median
  about 2r. That matches the claim "there''s a 50% chance fewer than 2r total humans."
  Actually the doomsday argument often says: with self-sampling assumption, conditional
  on your rank r, N is within a factor of 2 of r with 50% probability. That''s exactly
