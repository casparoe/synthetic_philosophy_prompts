  Where it snaps:

  1. In tank problem, the set of tanks already exists at the time of observation (at
  least the produced ones); in doomsday, N includes future people not yet existing.
  Whether it''s meaningful to be a random sample from a not-yet-fixed set. However,
  anthropic reasoning does this anyway (SSA treats all observers as existing across
  time).

  2. The serial numbers are externally assigned and observable; birth rank is constructed
  by imposing an ordering on all humans (what ordering? chronological? your position
  depends on how you count humans — Homo sapiens only? all humans ever? observer-moments?).

  3. In the tank problem, the sampling mechanism is physical (capturing random tanks)
  with known selection; in doomsday, there is no mechanism that selects one human
  uniformly from all humans — you just are you, and SSA posits uniformity as a methodological
  assumption, not an observed randomization.

  4. Prior: in tank problem, priors over N can be grounded in industrial capacity,
  and results can be checked against records; in doomsday, the prior encodes guesses
  about the future and is untestable. Also with only one observation the posterior
  is heavily prior-sensitive: the likelihood 1/N is so flat that the posterior depends
  a lot on the prior, unlike the tank case with multiple observations where data dominates.

  5. In tank problem, the observed serial numbers are exchangeable; in doomsday, only
  one observer but more importantly, the probability of existing now may be affected
  by population dynamics (if many observers are in the future, the fact that you''re
  early might indicate doom; but if population grows and then collapses, your being
  in the early small fraction may be surprising... Actually SSA says you should be
  typical, but the shape of population over time matters).

  6. Doomsday argument''s conclusion has practical import and possibility of refutation?
