  ---


  You are a professor of philosophy of law setting the final essay question for an
  upper-level undergraduate seminar on free will, moral responsibility, and punishment.
  The seminar has covered the debate between Daniel Dennett and Gregg Caruso over
  whether punishment can be justified by just deserts. In brief: Dennett holds that
  the compatibilist capacities that ordinary adults actually have—self-control, responsiveness
  to reasons, the ability to do otherwise in the sense that matters—are enough to
  ground desert-based blame and punishment. Caruso holds that free will skepticism
  undermines basic-desert moral responsibility, and that we should therefore abandon
  retributive punishment in favor of a forward-looking public-health/quarantine model.


  Your task is to write one exam question on this debate that a student could answer
  well in about 1,500 words. The question must be impossible to answer well by merely
  summarizing the two positions. It should force students to confront whether Dennett''s
  compatibilist capacities actually secure the kind of responsibility that Caruso
  targets, and whether Caruso''s quarantine model can avoid covertly relying on desert
  judgments or treating offenders as mere threats to be managed. Think through what
  the true crux of the disagreement is before you write the question.


  Then provide:

