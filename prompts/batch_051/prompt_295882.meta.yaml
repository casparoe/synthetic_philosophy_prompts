  In my course on free will we have spent several weeks on the dispute between compatibilists
  and incompatibilists about determinism, and I am struck by how long it has remained
  unresolved. In Section VIII of his Enquiry concerning Human Understanding, Hume
  writes:


  "This has been the case in the long disputed question concerning liberty and necessity;
  and to so remarkable a degree, that, if I be not much mistaken, we shall find, that
  all mankind, both learned and ignorant, have always been of the same opinion with
  regard to this subject, and that a few intelligible definitions would immediately
  have put an end to the whole controversy."


  Yet the debate plainly did not end. The compatibilists I read in this course say
  that the freedom relevant to moral responsibility is a matter of acting from one''s
  own motives and character in the absence of coercion or manipulation, so determinism
  poses no threat to it. The incompatibilists reply that if determinism is true, our
  actions are fixed before we act, and that no amount of absence of coercion supplies
  the ability to do otherwise which they take responsibility to require. I am not
  asking for a survey of these positions. My working hypothesis is that Hume''s diagnosis
  is only half right: the disagreement is not purely verbal, since the two sides really
  do accept different claims, but it is also not a disagreement about a single fact;
  they are defending different conceptions of what freedom has to be and treating
  different cases as decisive. Is that the right diagnosis of why the debate has stalled?
  What kind of disagreement is this really, and what would count as progress given
  that diagnosis?


