  Strawson''s Basic Argument (from "The Impossibility of Moral Responsibility," 1994;
  and in Freedom and Belief). It aims to show that ultimate moral responsibility is
  impossible. Versions:


  (1) You do what you do, in any given situation, because of the way you are.

  (2) So to be truly responsible for what you do, you must be truly responsible for
  the way you are — at least in certain crucial mental respects.

  (3) But to be truly responsible for the way you are, you must have intentionally
  brought it about that you are that way.

  (4) And you cannot be truly responsible for the way you are, since this would require
  an infinite regress: to be responsible for the way you are, you''d have to have
  intentionally brought it about earlier, requiring you to have been responsible for
  that earlier self, and so on; ultimately you''d have to be causa sui, which is impossible.

  Conclusion: You cannot be truly or ultimately morally responsible for what you do.


  Strawson acknowledges you can be "responsible" in a shallower sense (answerable,
  liable to praise/blame for compatibilist reasons), but not ultimately responsible
  in the deep sense. Note: compatibilists think moral responsibility is compatible
  with determinism, but Strawson argues even without determinism, the regress applies
  to any agent, so the Basic Argument doesn''t depend on determinism. Important: the
  Basic Argument is not about determinism; it applies whether or not determinism is
  true. That''s a subtle point a student might miss.


