  Let me think about actual positions in the two-envelope literature. There are:


  1. Bounded support / finite money: the setup is unrealistic; with any bounded distribution,
  the paradox disappears. (Jackson, Menzies, Oppy?)

  2. No uniform distribution over the reals: even in principle, an improper uniform
  prior is not a probability distribution, so the 50/50 claim is unjustified. (Castell
  and Batens?)

  3. The correct switching policy: given a proper distribution, the probability that
  the other envelope contains more depends on n via conditional probabilities; you
  should switch only when the distribution makes a larger amount sufficiently likely.
  Often the optimum is to switch when n is below some threshold, or use your prior
  knowledge.

  4. The switch decision is symmetric, so no unconditional advantage to switching;
  the flaw is in treating the fixed amount n as independent of how the envelopes were
  filled. Expected-value reasoning is fine but conditionalization matters.

  5. Infinite expected values / St. Petersburg-style: if you allow unbounded distributions,
  both envelopes can have infinite expected values, and comparing 1.25 times infinity
  is meaningless; the decision-theoretic paradox is a version of the St. Petersburg
  paradox. (Chalmers'' later view)

  6. Dominance or "no reason" views: since the situation is symmetric, there''s no
  reason to prefer either envelope; expected-utility switching is irrational because
  it would have you switch back and forth forever. Maybe "causal decision theory"
  or "evidential decision theory" distinctions interesting.

  7. The "interesting switch" or randomization strategies: some discussions (McDonnell
  and Abbott) about randomized switching thresholds; maybe too niche.

  8. The view that the paradox reveals issues with expected utility maximization itself
  (because infinite expectations), leading to a modification of decision theory.


