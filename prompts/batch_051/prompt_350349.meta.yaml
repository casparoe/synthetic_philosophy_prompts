  "I''m applying for a one-year postdoctoral fellowship in the history of political
  thought and need a research proposal. The project I have in mind concerns Adam Smith''s
  critique of empire and colonies, and I want you to write the proposal for me. My
  half-formed idea is this: the standard readings split Smith''s objections to the
  British empire into two unconnected registers. In The Wealth of Nations he seems
  to condemn the colonial monopoly as an economic distortion—it diverts capital, raises
  prices, and benefits a narrow merchant interest at the expense of the public. In
  other places he condemns the imperial project as a moral and political corruption—a
  government captured by shopkeepers pursuing a project of empire for the sake of
  customers, a source of oligarchy, war, and domination abroad and at home. These
  two critiques are usually treated as parallel, and commentators tend to emphasize
  one and downplay the other. I suspect both registers have a common root in Smith''s
  moral psychology, in particular his account of the love of system: the tendency
  to be seduced by the beauty of an orderly arrangement and to prefer the imagined
  perfection of a system over the actual happiness and agency of the people caught
  up in it. On this reading, empire is the love of system operating at the scale of
  the globe—a beautiful, ordered mercantile machine whose visible symmetry hides the
  real suffering and distorted incentives it produces. The project would argue that
  Smith''s economic and political criticisms of empire are not two critiques but one,
  and would ask what follows for how we use Smith in debates about free trade, imperialism,
  and the moral limits of systemic reform."


