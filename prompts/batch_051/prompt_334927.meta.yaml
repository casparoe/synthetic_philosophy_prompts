  A friend in my department keeps pressing an argument that seems to me to prove far
  more than anyone should believe. It is about the special composition question: the
  question of when several things make up, or compose, a further thing. Some pluralities
  seem to compose: the bricks compose a house, the cells compose a body. Others seem
  not to: the Eiffel Tower and my left shoe, taken together, seem to compose nothing
  at all. The argument purports to show that no principled middle answer is available
  — that either every plurality composes something, no matter how scattered or gerrymandered,
  or no plurality ever composes anything, so that tables, houses, and bodies do not
  strictly exist. Here it is, as my friend gives it.


  1. Assume, as common sense does, that composition is restricted: some pluralities
  compose an object and some do not.

  2. If composition is restricted, then along a continuous series of rearrangements
  — think of a table being dismantled particle by particle, or a sandcastle losing
  grains one at a time — there are clear cases of composition at the start and clear
  cases of non-composition at the end.

  3. So there must be a precise boundary in that series: a last case in which the
