  Argument for the incoherence of "existence precedes essence":


  1. The existentialist slogan that existence precedes essence amounts to this: human
  beings have no fixed nature or built-in scheme of values prior to their choices;
  what a person is (their essence) is the product of their choices.


  2. Choices, in the sense the slogan requires, are acts done for reasons: the agent
  takes some consideration to count in favor of the action.


  3. If an agent has no fixed nature or built-in values prior to choosing, then there
  is no standard, before the choice, by which one option counts as preferable to another.


  4. But if there is no standard, before the choice, by which one option is preferable,
  then no consideration can count in favor of one option over another at the time
  of choosing.


  5. Therefore, on the existentialist view, no choice can be done for a reason at
  the time it is made.


  6. Therefore, the existentialist view makes choice arbitrary and hence cannot account
  for the idea that in choosing we create our essence (which requires that some choices
  be better/more authentic, etc.).


