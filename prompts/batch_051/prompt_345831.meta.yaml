  "So last night a friend and I argued for two hours about information cascades, and
  by the end I''d talked myself into a claim I want pressure-tested. I''ve taken to
  calling it *cascade compression*. Here''s the thought. In the standard cascade story,
  each new person sees the choices before them, and because those choices encode someone
  else''s private signal, it eventually becomes rational to follow the crowd and ignore
  your own signal. Fine. My claim is that there''s a second, overlooked thing the
  crowd encodes: the *length of deliberation*. The first few movers hesitate, the
  middle movers act noticeably faster, and by the late movers there''s no deliberation
  at all — the public history feels like it settled the question, so people don''t
  even bother to form a private read. So a cascade doesn''t just aggregate information;
  it compresses decision time down toward zero. And I want to say you can use that
  compression as a diagnostic: if you can''t observe people''s private signals (which
  you usually can''t), you can still spot a cascade forming because the time-to-decide
  collapses faster than the evidence itself improves. My friend thinks this is nonsense
  — he says decision time is just noise about caution, risk, stakes, identity, whether
  someone''s being filmed, whatever, and that I''m smuggling in the private signal
