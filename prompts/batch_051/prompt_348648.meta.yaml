  Putnam''s argument (as commonly reconstructed):

  1. All things simultaneous with my here-now are real.

  2. But simultaneity is relative to a frame; an event real-relative-to one observer
  may not be real-relative-to another.

  3. Consider any event E anywhere in spacetime. There is some possible observer O
  and some event F on O''s worldline such that E is simultaneous with F in O''s frame
  (roughly, for spacelike separations). Then E is real-for-O at F.

  4. If E is real for some observer, it''s simply real (real simpliciter).

  5. So every event is real; hence future and past events are equally real — the block
  universe.


  The controversial step: "real-for-O" → "real simpliciter." The argument "proves
  too much" because if "real" is frame-relative, the conclusion that everything is
  real conflates frame-relative reality with absolute reality. To reject: either reject
  premise 1''s application to reality (reality is not frame-relative; "now" is not
  a physically privileged notion), or reject the inference from "real in some frame"
  to "real simpliciter." This is the standard presentism/eternalism debate.


