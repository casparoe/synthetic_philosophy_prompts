  right to their property, only the child''s claim to get it without doing anything
  for it.


  But here''s the part I can''t get past. I have a very firm intuition that if I work,
  save, and live modestly in order to leave something to my children, that is one
  of the central ways a parent expresses care and responsibility. It doesn''t feel
  like ''the favour of others'' in the same sense as winning a lottery; it''s the
  result of a deliberate lifetime project that is already my own. If the state steps
  in and takes a huge chunk or sets a cap, it seems to be treating the family as a
  mere conduit or legal fiction, and treating my savings as if they belonged to the
  whole public once I die. I can accept taxing very large dynastic fortunes, like
  the child of a billionaire, but I don''t want to give up the idea that parents have
