  Wolfram, A New Kind of Science (2002). Key ideas:

  - Simple programs (cellular automata) can produce highly complex behavior, contrary
  to intuition that complexity requires complex underlying rules.

  - He studies CA systematically, Rule 30 as an example of a simple rule producing
  randomness/complexity.

  - Principle of Computational Equivalence (PCE): almost all processes that are not
  obviously simple can be viewed as computations of equivalent sophistication. More
  precisely, once a system exceeds a certain low threshold of computational capability,
  it is computationally equivalent to everything else at that threshold; nothing fundamentally
  more powerful except universal computation. It implies that sophisticated computation
  is ubiquitous in nature; and that there is a maximum computational sophistication,
  reached by many systems.

  - Computational irreducibility: for many systems, no shortcut to predict outcome;
  must simulate each step. This limits science: even with complete theory, cannot
  always predict.

  - He claims this is a new kind of science and uses simple programs as models for
  nature rather than equations.

  - Criticisms: NKS is not falsifiable, overgeneralizes, doesn''t cite prior work,
  claims priority from CA work by von Neumann, Burks, Conway, etc.; PCE is vague;
  computational irreducibility is similar to chaotic unpredictability; a lot of the
  book is Bell''s... hmm careful. Anyway.


