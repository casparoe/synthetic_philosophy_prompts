  You are a professional metaphysician and philosophical logician who works on quantified
  modal logic and the metaphysics of modality. I am preparing to read the debate between
  David Lewis''s counterpart theory and actualist theories of transworld identity,
  and before I read another page I want the job description in front of me.


  My question is not which view is true. I want a specification of what an adequate
  theory in this area has to accomplish. Think of the task this way: a theory of de
  re modal predication is being hired to do certain work, and I want the job description
  written out before I see any applications. So please write the desiderata that any
  adequate account of claims like the claim that Humphrey could have won the election,
  or that this very table could have been made of something else, needs to satisfy.


  Begin by brainstorming candidate requirements, then select and refine the list;
  think carefully about which demands reflect the data and which are parochial commitments
  of one side of the debate.


  For each desideratum, give the case, puzzle, distinction, or logical result that
  motivates it. Your list should at least engage the following territory, though you
  should add anything else you judge load-bearing:


  - the starting data of ordinary modal thought and talk, and the patterns of modal
  inference we routinely rely on;

  - Kripke''s Humphrey complaint, understood as a constraint about what the truth
  of a de re modal claim has to be about;

  - the problem of accidental intrinsics, or how one and the same object can be represented
  as satisfying incompatible properties across possibilities without contradiction
  or cheap trickery;

  - Chisholm-style swapping considerations, where a long series of apparently permissible
  small changes seems to collapse one object into another;

  - the necessity of identity and distinctness, and what a theory must say to avoid
  violating these results or must explain if it seems to violate them;

  - the de dicto/de re distinction and why a theory owes us a systematic account of
  the difference;

  - the essential/accidental distinction and the constraints a theory puts on what
  can vary while the object remains the same object;

  - anything needed for the semantics to be compositional rather than case-by-case
  hand-waving.


  Then do three further things with the list. First, flag any pair or subset of desiderata
  you suspect cannot be jointly satisfied, and say which member of the pair you would
  give up and why; if you think the list itself thereby constitutes a result rather
  than a mere wish list, say so. Second, sort the desiderata into non-negotiable and
  negotiable, and identify the single requirement that does the most to exclude candidates.
  Third, briefly score the following three views against your list, in a compact paragraph
  each: Lewisian counterpart theory; an actualist view on which worlds are abstract
  representations and the very same object occurs in many worlds; and a non-reductive
  view that treats de re modal predication as primitive and refuses to analyze it
  in terms of worlds, counterparts, or surrogates. Keep the criteria and their motivating
  cases the main deliverable; the scoring is only a checkpoint.


  Take your time and avoid turning this into a summary of the literature. I want the
  standards of adequacy themselves subjected to scrutiny, not a reading list.


