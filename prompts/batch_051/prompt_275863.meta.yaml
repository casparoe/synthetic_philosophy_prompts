  than facts they should be able to recite.

  - Materials, all cheap or free: coins, bidding slips, a visible "banker''s ledger,"
  whatever you need. No real money.

  - A timeline for the 75 minutes, with room for a debrief.

  - A payoff scheme implementable without real stakes, plus a sealed-bid auction or
  equivalent mechanism so students reveal their genuine maximum willingness to pay
  instead of performing for one another.

  - At least two variants beyond the first auction: (1) a finite-bankroll version
  in which the banker has a stated, visible, very large bankroll, so the expected
  value is finite and grows only logarithmically with the bankroll; and (2) a debrief
  step in which payoffs are re-imagined in units of utility rather than money, to
