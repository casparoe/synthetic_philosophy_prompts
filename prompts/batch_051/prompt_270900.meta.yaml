  Let me draft a teaching-plan prompt for mechanistic anomaly detection.


  Audience: engineers or data scientists who build anomaly-detection systems, or a
  reading group of ML researchers. They already have statistical anomaly detection.
  The conceptual question: given two anomalies detected by a system (e.g., production
  failures, fraud, equipment faults), what does it mean for them to be "the same mechanism,"
  and why does that matter? The teaching goal: get them from "anomaly = point far
  from the learned distribution" to "anomaly = departure from a recurring causal structure,
  and two anomalies share a mechanism iff they arise from interventions on or breakdowns
  of the same invariant components." But I must be careful not to claim a single correct
  account; the domain is open.


  Dependencies:

  1. Need to distinguish anomaly detection (statistical deviation) from anomaly explanation
  (mechanism). Define mechanism in interventionist terms: components and stable relations,
  what happens under interventions. Could use the notion of a causal graph where normal
  operation corresponds to a set of structural equations and anomalies correspond
  to local changes (a broken edge, a shifted parameter, an exogenous shock).

  2. Introduce identity of mechanism via invariance: a mechanism is that which remains
  invariant under a class of changes; same mechanism = same invariance structure /
  same part of the graph that is violated.

  3. Explain why it matters: if two anomalies share a mechanism, fixing one generalizes
  to the other; grouping anomalies by mechanism predicts future failures and guides
  intervention; if you group by feature similarity, you''ll lump different mechanisms
  that happen to produce similar observations (e.g., all server timeouts may be caused
  by disk failure vs misconfigured load balancer) and split the same mechanism that
  manifests variably.

  4. Case/examples: maybe two production line defects — one is a temperature drift,
  another is a loose fixture — both cause out-of-spec diameter readings. Feature-space
  anomaly detection sees "diameter out of range" as one anomaly type; mechanism-based
  grouping separates them because intervening on temperature doesn''t affect the loose-fixture
  cases. That''s a good carrying example. Or in fraud: same fraud ring uses varying
  transaction patterns; different mechanisms produce identical-looking anomalies.


  Misconceptions:

  - "Similar inputs or outputs = same mechanism." Head off with the case where the
  same observable anomaly has two different causes and different fixes.

  - "The model''s learned latent representation automatically captures mechanisms."
  Head off by noting representation learning optimizes for reconstruction/prediction,
  not invariance or modularity; latent similarity is not causal similarity.

  - "Same root cause = same mechanism" or "common cause = single mechanism." Need
  to distinguish the chain of causes and where to cut the mechanism; two anomalies
  may share a distal cause but differ in the proximal mechanism, and the relevant
  level depends on the intervention available.

  - "Normal behavior is a mechanism." Clarify mechanisms are causal structures that
  can also produce normal data; same mechanism can produce both normal and anomalous
  variation.

  - "Co-occurrence (anomalies happen together) implies a shared mechanism." Co-occurrence
  may reflect a common confounder or one mechanism triggering a different one.

  - Maybe "The notion of ''same mechanism'' has a fact of the matter independent of
  the intervention set." The grain of mechanism depends on what interventions are
  available/counterfactually considered — head off by making explicit that sameness
  is relative to a level of analysis and a class of interventions.


