  Imprecise probability (IP): Represent beliefs not by a single probability function
  but by a set of probability functions (credal set); or lower and upper previsions.
  Motivation: Ellsberg paradox, ambiguity aversion; incomplete preferences; robust
  Bayesian analysis; ignorance vs risk distinction (Knightian uncertainty). Key ideas:
  lower/upper probabilities, credal sets, avoidance of false precision; updating can
  lead to dilation; multiple decision rules: Γ-maximin, E-admissibility, maximality,
  interval dominance; Seidenfeld et al.''s rejection of dilation; Walley''s theory
  of imprecise probabilities; Levi''s indeterminate probabilities; Kyburg''s evidential
  probability.


  For a teaching plan, key dependencies:

  1. They must already have the representational framework: uncertainty as degrees
  of belief, and decisions as maximizing expected utility with respect to a unique
  probability.

  2. Introduce a concrete case where a unique probability feels forced: e.g., Ellsberg
  urn (known composition: 60 red, 40 black+green unknown). People prefer known-probability
  bets; representing that strict preference requires either non-expected utility or
  a set of probabilities.

  3. The formal object: a set of distributions over the same space; lower and upper
  probabilities as bounds (lower envelope); the difference between an interval-valued
  probability and being unsure which single number is your probability. The idea that
  the set itself is the state, not a report of uncertainty about your own probability.

  4. What you can do: combination, conditioning, decision-making. But each raises
  complications: updating each prior in the set (set of Bayes updates) vs generalized
  Bayes rule producing dilation; decisions need a rule (maximin expected utility,
  E-admissibility) because expected utility intervals/incomparability.

  5. Why it matters: robust Bayesian analysis as sensitivity analysis; imprecise probabilities
  as a bridge; when to refuse to use them.


  Misconceptions to expect:

  - "Imprecise probability means having a probability distribution over possible probabilities"
  (second-order uncertainty) — treat as one possible model (hierarchical Bayesian)
  but not the same because IP doesn''t require a single higher-order distribution
  and can represent true incomparability/indeterminacy. Need to head off when introducing
  the formal object.

  - "The midpoint or some single ''representative'' prior is enough" — head off with
  an example where the interval matters: decisions can differ across priors, and the
  spread is the point (sensitivity).

  - "Imprecise probabilities are just incomplete knowledge and more data always sharpens
  them" — dilation example shows more information can make imprecision worse, e.g.,
  knowing the coin is fair (precise) vs not knowing bias.

  - "IP models are just intervals, so arithmetic is interval arithmetic" — the lower/upper
  envelope relationship and non-additivity: lower probability is not additive (lower
  probabilities are superadditive). Actually if you have a set of probability measures,
  lower envelope is a lower probability (superadditive in general). So handling with
  interval arithmetic on events can overstate; the set representation matters.

  - "Being imprecise lets you avoid all prior commitment" — actually IP still requires
  specifying a set; too-wide sets are vacuous and useless; there are questions about
  where the boundaries come from (susceptible to the same arbitrariness).

  - "Imprecise probabilities are the same as confidence intervals" or "frequentist
  coverage probabilities" — different object: bounds on belief, not long-run coverage.
  Good to head off early with audience of statisticians.

  - "Expected utility maximization just needs replacing by one rule" — there are multiple
  incomparable rules; this is a feature of incomplete preferences, not a bug to cover
  up.


