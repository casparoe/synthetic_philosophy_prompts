  Draft:


  "The following two positions are to be treated as parties to an adversarial collaboration.
  Position A, the open-future position: an assertion, made now, of a contingent future-tense
  sentence such as ''There will be a sea battle tomorrow'' is neither true nor false
  at the time it is made; it acquires a truth value only when the relevant course
  of events has been settled — roughly, when the battle is underway or has occurred
  or the time in question has passed. On this view ''will'' is truth-apt only for
  what is already determined by the present state of the world plus the relevant laws,
  and genuinely open alternatives are described with ''might'' instead. Position B,
  the settled-truth position: such an assertion is already true or false at the moment
  it is made, true if and only if the battle in fact occurs; the sentence''s future
  tense no more makes its truth value unfit now than a past-tensed sentence''s truth
  value now. On this view, the fact that the assertion was already true does not,
  by itself, make the battle necessary or unfree, and inferring necessity commits
  a modal fallacy. But the two positions agree that the battle is causally open before
  it happens... etc.


