  writes down the truth value at t0 (if the settled camp is right, the oracle''s ledger
  determinate; if open camp, the ledger has a gap — but what does the gap look like
  in a world?). Careful: the open-future camp thinks the statement is neither true
  nor false, so an oracle that assigns values would be seen as making something up.
