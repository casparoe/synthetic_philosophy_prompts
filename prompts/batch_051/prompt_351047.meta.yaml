  Key philosophical content:

  - Sea battle: "There will be a sea battle tomorrow." If it is now true, then it
  seems settled/fated. If it''s neither true nor false, then bivalence fails and classical
  logic needs modification; also "it will be the case that p" semantics.

  - Open-future camp: future contingents are not true or false until the world is
  "settled" (Peircean: only what is causally/historically necessary is true; future
  tense "will" has a strong reading requiring settledness). They may accept a weak
  "might" futurity: "there might be a sea battle tomorrow" is true.

  - Settled-truth camp: future contingents have a determinate truth value now, given
  by what will actually happen; this is compatible with the event''s being contingent
  because the truth doesn''t cause the event, or because necessity is only "now-unpreventable"
  in a trivial sense. They may accept that "it was true that there would be a sea
  battle" is retrospectively necessary but deny this entails fatalism (the necessity
  of the past applies to the proposition''s having-been-true, not to the future event''s
  occurring apart from that).

  - Agreed claims: both reject fatalism (truth now doesn''t cause the battle); both
  agree present and past are determinate; both agree that at the time before the battle
  the event is not yet causally necessitated by the present state of the world in
  the way the past is; both agree Aristotle''s texts... hmm, careful. Keep agreed
  claims about the logic and the sea battle case itself.

  - Cruxes: (1) Does the future tense operator "will" require settledness or merely
  future actuality? (2) Can a truth value be assigned by a function from worlds+times
  to truth that depends on the whole history without thereby making the future "already
  fixed"? (3) Does ordinary retrospection ("it was true yesterday that I would decide
  as I did") commit ordinary speakers to fatalism? (4) Betting: is there a difference
  in the rationality of betting at t0 on "there will be a sea battle" under the two
  semantics?

