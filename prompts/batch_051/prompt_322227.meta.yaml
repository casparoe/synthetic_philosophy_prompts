  I sit on the residents'' welfare committee of a small hospice. Our medical director
  has asked us to consider a new standing option for patients with terminal diagnoses
  who have more than a few weeks to live: an "emotional quieting" protocol. Under
  the protocol, a patient who asks for it would receive a daily combination of low-dose
  medication and structured routines designed to keep their feelings in a narrow,
  calm range. It is not the same as our existing end-of-life sedation, which is used
  only at the very end and leaves the patient asleep; this protocol would leave the
  patient awake and able to talk, but muted—less panic and despair, but also less
  delight, less sharp grief at goodbyes, less of the urgency that family members sometimes
  describe as the most honest part of those last weeks.


  The committee is split. Some members see the protocol as an act of mercy: no one
  should spend their final weeks in terror, and if a calm, muted mind is what the
  patient wants, we should not refuse it out of some romantic idea about suffering.
  Others worry that we would not be relieving suffering so much as removing the person
  who suffers: that calm in the face of death is one thing when it comes from making
  peace, and another when it comes from having one''s feelings switched off, and that
  the second kind of calm may let a patient drift away from the very relationships
  that make their last days worth living. I have been reading, on my own, about the
  old debate between wanting freedom from disturbance and worrying about the cost
  of it, and this case seems to me to be exactly that debate with a person''s actual
  death in the middle of it.


  I have been asked to draft the committee''s decision memo for our meeting next Thursday.
