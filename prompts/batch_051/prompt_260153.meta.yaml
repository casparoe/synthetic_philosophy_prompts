  Harman''s dogmatism paradox (in "Thought" 1973, or in Kripke''s "On Two Paradoxes
  of Knowledge"? Actually Kripke''s "Two Paradoxes of Knowledge" 2011 discusses the
  dogmatism paradox). Classical formulation:


  "If one knows that p, then one knows that any evidence against p is misleading.
  So why should one be moved by evidence against p? One can simply note that, since
  p is true, the evidence must be misleading, and ignore it. Thus, knowledge seems
  to justify dogmatism."


  More carefully, the paradox derived from closure:

  1. S knows p.

  2. S knows p entails that E is misleading (if E is evidence against p).

  3. If S knows p and knows p entails Q, then S is in a position to know Q (closure).

  4. So S knows E is misleading.

  5. So S is justified in disregarding E.

  But it seems wrong that knowledge licenses dogmatically disregarding counterevidence.


