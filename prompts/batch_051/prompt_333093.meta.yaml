  ---


  I spent my working life as a field biologist, and I have only recently begun reading
  the philosophical literature on animal minds. There I keep meeting Lloyd Morgan''s
  canon, or what it has become: a standing instruction to explain animal conduct by
  the lowest psychological process that can account for it and to withhold higher
  attributions — belief, intention, planning, mental representation — until the lower
  ones have been made to fail. I want to say at once that I see what makes the canon
  compelling. It is not mere caution. It promises a single, non-arbitrary evidential
  standard across species: before we say "the raven knows it is being watched," we
  must first try the associative story, the reinforcement history, the fixed action
  pattern. That discipline has real virtues — it unifies comparative cognition, keeps
  our vocabulary from running ahead of our evidence, and protects us against the tendency
  to project our own mental life onto everything that behaves in ways we recognize.
  One can even formulate it as a tidy decision procedure: for any behavior, start
  at the lowest rung, and move up only under pressure.


  And yet. I also have an intuition that I cannot shake, and it is not one I half-disown.
  On several occasions in the field I watched an animal — a wild animal, not a trained
  subject — act in a way that seemed to require representing another animal''s visual
  perspective... [describe].


