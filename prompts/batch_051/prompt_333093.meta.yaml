  ---


  I spent four decades as a field biologist, most of it watching animals negotiate
  the ordinary business of staying alive, and only recently have I begun reading philosophy
  of mind in earnest. The position I keep encountering under the name of Morgan''s
  canon is, in the form that now circulates, something like this: never explain an
  animal''s behavior by appeal to a higher psychological process if a lower one can
  be made to cover the facts; begin with associative learning, fixed action patterns,
  and simple heuristics, and move up to representations, intentions, or inferences
  only when the lower accounts have demonstrably failed. I want to give this principle
  its full due, because I recognize its virtues from my own science. It supplies a
  single evidential standard across taxa and across laboratories. It keeps comparative
  cognition from turning into the writing of animal biographies. It is a bulwark against
  the observer''s tendency to project a human mental life onto any behavior that has
  a familiar look. And it can be stated as a decision procedure: locate the behavior
  on the lowest rung that predicts it, and decline to add structure above that rung.


  But I also have an intuition I cannot shake, and I do not regard it as a sentimental
  one. During a long season watching ravens, I repeatedly saw a bird cache food in
  view of a conspecific and then, after the other bird had gone, return and move the
  cache; birds that cached in private almost never did this, and when a watcher was
  present the cacher would sometimes carry the food behind a boulder or a rise where
