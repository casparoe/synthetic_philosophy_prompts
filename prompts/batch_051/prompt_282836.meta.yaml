  The nonidentity problem essentials:

  - A policy is "identity-affecting" if it changes which people come into existence
  (either the number or the identities of future people). A policy is "same-people"
  if the same set of people exist either way and only their welfare differs.

  - Person-affecting intuition: acts are wrong only if they wrong (or make worse off)
  a particular person.

  - If a future person''s life is worth living, and they would not have existed under
  the alternative, the policy doesn''t make them worse off compared to their alternative
  (there is no alternative for them).

  - Yet many identity-affecting policies seem bad (depletion vs conservation). We
  need either impersonal principles (total/average well-being, maximization), wide
  person-affecting principles, or nonstandard views.

  - Different-number cases (population policies, pronatalism) add complexity; same-number
  identity-changing cases (different pairs of individuals) are more central to Parfit''s
  problem.


  The procedure should ideally:

  1. Determine whether the policy creates, eliminates, or preserves the identity and
  number of future persons. A simple screening test: would the same individuals exist
  in the same numbers under the alternative? If a policy affects who conceives whom,
  or timing of conceptions, after a generation or so the populations diverge; practically,
  any wide-ranging policy likely is identity-affecting.

  2. If same-people: standard harm analysis applies (make worse off, compensate, etc.).

  3. If identity-affecting: check whether all affected future people have lives worth
  living. If yes, then "would be worse off" claims about those people are unsupported;
  but we can still ask whether the policy fails an impersonal standard, violates rights
  (of existing persons, or maybe future generations'' interests without identity-dependence),
  or fails to treat the future with adequate concern.

  4. Flag the division between person-affecting and impersonal justifications; mark
  as a judgment call which family of moral views the ministry is entitled to invoke.
  In a regulatory impact assessment unit, the basis must be one the public/decision-makers
  accept — this is a political/moral choice, not a mechanical step.

  5. Cases where the policy makes future lives barely worth living but not "wronging"
  them — threshold questions (Parfit''s "worth living vs. good enough"?). The procedure
  can''t resolve threshold-of-decent-life questions.

  6. Maybe distinguish "reasons of beneficence" from "reasons of justice/rights":
  even if not worse for anyone, a policy may be unjust for other reasons (e.g., intergenerational
  inequality as a structural wrong).


