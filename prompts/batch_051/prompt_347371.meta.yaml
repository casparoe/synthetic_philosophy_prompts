  Potential subtle errors in summary of Sidgwick''s dualism:

  - Common misrepresentation: Sidgwick''s dualism is often presented as a conflict
  between egoism and utilitarianism where he proves both are equally rational, thus
  morality is irrational or contradictory. Actually Sidgwick thinks both are rational
  methods, and the conflict is a fundamental contradiction within practical reason;
  but his own position is more nuanced: he doesn''t conclude morality is fake; he
  calls it a dualism that needs resolution, and he leaves it unresolved, suggesting
  a need for a fundamental intuition or theistic assumption maybe? He doesn''t claim
  utilitarianism refuted.

  - Some summaries say he "proved" egoism and utilitarianism incompatible and therefore
  rational action is impossible. He actually says there''s a contradiction between
  two methods, and this undermines the "Cosmos of Duty"; he doesn''t say rational
  action impossible.

  - Another common simplification: treating dualism as simply "morality may require
  self-sacrifice vs. self-interest," ignoring that Sidgwick''s egoism is a rational
  intuition, not mere desire; and that both are grounded in intuitions.

  - Another subtle: the dualism applies to practical reason generally, not just utilitarianism
  vs egoism; also that intuitionism is a third method but he absorbs common-sense
  morality into utilitarianism.

  - Also could confuse "egoism" with hedonistic psychological egoism vs rational egoism.

  - Or say Sidgwick''s conclusion was that we must choose arbitrarily, whereas he
  thought the conflict indicates a defect in our knowledge or a possible future synthesis.


