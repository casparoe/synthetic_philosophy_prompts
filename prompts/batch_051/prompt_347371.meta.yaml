  non-contradictory verdicts; (2) if two alleged first principles yield contrary prescriptions,
  at most one is a genuine principle; (3) egoism and utilitarianism can yield contrary
  prescriptions (the classic: a given sacrifice benefits others more than it costs
  you); (4) each is supported by an axiom we cannot deny (Sidgwick''s axioms); (5)
  Yet Sidgwick concludes we must accept both, which entails contradictory verdicts
