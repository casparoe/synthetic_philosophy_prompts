  "Here''s the textbook''s summary: Sidgwick''s The Methods of Ethics ends by showing
  that common-sense morality can be systematized into utilitarianism. But he then
  notices that utilitarianism demands sacrificing one''s own happiness whenever it
  maximizes total happiness. Yet he finds it equally self-evident that each person
  has reason to pursue their own happiness. Since both principles are intuitive, practical
  reason is torn: what is rational from the impartial point of view can be irrational
  from the personal point of view. Sidgwick concludes there is no rational way to
  settle the conflict. Hence the ''dualism of practical reason'': morality and self-interest
  are both rational but mutually inconsistent, so the idea that the universe is morally
  coherent collapses. The passage says the cosmos of duty becomes a chaos. Thus Sidgwick
  is best read as showing that ethics, if reasoned through, ends in contradiction,
  and that any preference for morality over egoism or vice versa is ultimately arbitrary."


  That''s plausible but contains errors:

  - It may overstate that Sidgwick concludes no rational way; he leaves it as an unresolved
  dualism, not a conclusion that any preference is arbitrary? Actually he does say
  the "Cosmos of Duty" becomes "Chaos" and that the "dualism of practical reason"
  is a fundamental contradiction; he says the conflict is "ultimate and fundamental"
  and "the moral system cannot be presented as a Cosmos"; he suggests that a reconciliation
  might require a "fundamental intuition" that is not yet found, or a theistic postulate.
  He does not say "any preference is arbitrary" necessarily; he may believe one could
  still act, but rationality is incomplete. Some interpreters say he sees the contradiction
  as a "anomaly" that might be resolved by a wider synthesis. So summary''s last sentence
  "any preference ... is ultimately arbitrary" is a subtle misrepresentation.

  - Another subtle: It says "common-sense morality can be systematized into utilitarianism"
  — that''s roughly true but Sidgwick thinks utilitarianism is the best method for
  impartial reasoning, and common-sense rules approximate it.

  - It says "both principles are self-evident" — Sidgwick thinks rational egoism and
  utilitarianism each rest on self-evident axioms, but he is cautious. The phrase
  "equally self-evident" is okay.

  - It says "there is no rational way to settle conflict" — Sidgwick doesn''t exactly
  conclude that; he says he hasn''t found a way, and the contradiction is a limitation
  in his investigation. So overstatement.

  - It says "Sidgwick is best read as showing that ethics, if reasoned through, ends
