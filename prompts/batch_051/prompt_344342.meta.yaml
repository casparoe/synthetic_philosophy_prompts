  I''m a PhD student in philosophy, though my own work is in ethics rather than the
  history of philosophy, and I am reading Nietzsche''s On the Genealogy of Morality
  for the first time in a reading group. After a session on the first essay, a colleague
  in political theory (who has clearly read the book carefully) summarized its argument
  for me roughly as follows. Nietzsche gives an origin story for our moral vocabulary:
  *good* was originally how aristocrats described themselves and their way of being
  — noble, strong, capable, life-affirming — while *bad* was their contrast term for
  whatever fell short of that, namely the common, the weak, and the unhealthy. Later,
  a priestly caste, full of ressentiment, carried out what Nietzsche calls the slave
  revolt in morality: unable to defeat the nobles in the world, they revalued their
  values in imagination, so that humility, poverty, and passive endurance became *good*,
  and the nobles'' strength and self-assertion were recast as *evil*. Christian morality,
  on this telling, is the institutionalized form of that revaluation. And the point
  of the genealogy, my colleague concluded, is that once we see that our most cherished
  moral ideals grew out of resentment and self-deception, we are no longer entitled
  to treat them as authoritative — at least not over the kinds of people who are strong
  enough to live by their own values.


