  Let me think carefully about species concepts and what a good thought experiment
  would be.


  Key species concepts:

  - Biological Species Concept (BSC, Mayr): species are groups of actually or potentially
  interbreeding natural populations that are reproductively isolated from other such
  groups.

  - Phylogenetic Species Concept (PSC, Cracraft): the smallest diagnosable cluster
  of individual organisms within which there is a parental pattern of ancestry and
  descent. Or species are the smallest monophyletic groups / diagnosable units.

  - Ecological Species Concept (ESC, Van Valen): a species is a lineage (or closely
  related set of lineages) which occupies an adaptive zone minimally different from
  that of any other lineage in its range and which evolves separately from all lineages
  outside its range.

  - Morphospecies concept: species are groups that are morphologically distinct.

  - Evolutionary species concept (Wiley/Simpson): a single lineage of ancestor-descendant
  populations that maintains its identity from other such lineages and has its own
  evolutionary tendencies and historical fate.

  - Genotypic cluster concept (Mallet).

  - Recognition species concept (Paterson): shared specific-mate recognition system.

  - Cohesion species concept (Templeton).


