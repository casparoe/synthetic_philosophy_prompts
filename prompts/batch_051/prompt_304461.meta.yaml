  I am preparing a talk for a constitutional theory workshop, and what I want from
  you is not a defense of my paper but a prep sheet for the question period.


  The thesis I will defend is a qualified one: constitutional precommitment — entrenched
  rights, supermajority amendment rules, an independent central bank, a constitutional
  budget rule — is best understood not as a surrender of democratic self-government
  but as one of its instruments, in roughly the way Ulysses'' order to be bound to
  the mast was an exercise of self-control rather than an injury to it. I grant the
  obvious disanalogies: a people is not a single agent with one will, the people bound
  are not the people who did the binding, and entrenchment can be a way for today''s
  majority to lock in its preferences. My claim is that these disanalogies can be
  answered if the binding is adopted through a genuinely popular process and remains
  revisable through a demanding but real amendment procedure.


  My compressed argument: (1) a democratic people can coherently prefer at one time
  that its later, more agitated self not be able to undo a commitment in a single
  moment of panic or short-term temptation; (2) precommitment does not remove an issue
  from democratic control but changes the democratic procedure governing it, making
  change slower and more demanding rather than impossible; (3) many institutions embedded
  in actual democracies — constitutional review, central bank independence, fiscal
  rules — are precommitments of this form, and rejecting them wholesale is a far more
  radical move than most of the audience wants to make; (4) the Ulysses comparison
  does not require believing the framers were wiser than everyone now, only that they
  could know something about the circumstances under which future decision-makers
  would predictably decide badly.


  The audience: mostly democratic theorists and constitutional lawyers with strong
  commitments to popular sovereignty. They worry about what they call the dead hand
  of the past, they think a constitution must in principle be remakable by the people
  who live under it, and they suspect that precommitment talk is often a polite name
  for entrenching current preferences against future majorities. Several work on constitutional
  amendment and emergency powers, so they know the technical issues.


  Give me the questions I will actually get, in something close to this audience''s
  own vocabulary. Order them by how likely and how damaging they are. For each, say
  whether the objection has real force or is mostly rhetorical, give a short reply,
  and note where that reply is weakest. Tell me what I should concede up front without
  giving away the thesis, and identify the one reply that has to land for the proposal
  to survive its ten minutes of questioning. Include the objection I should most hope
  nobody asks, and be blunt about it.


  Throughout, separate what is settled among people who work on this topic from what
  is genuinely contested, and do not present a contested view as though it were the
