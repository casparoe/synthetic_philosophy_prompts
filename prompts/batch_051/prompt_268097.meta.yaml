  Endurantism vs perdurantism: Let me recall. Endurantists say objects persist by
  being wholly present at each time they exist. Perdurantists say objects persist
  by having temporal parts at different times. Classic problem: temporary intrinsics
  (Lewis). If an object has incompatible intrinsic properties at different times (bent/straight),
  endurantism seems to require the object itself to be both bent and straight, violating
  Leibniz''s law. Perdurantism handles by different temporal parts. But endurantists
  may relativize properties to times (being bent-at-t1). There''s also the problem
  of change itself.


  An argument that proves too much: from the possibility of change in intrinsic properties
  to the conclusion that no object persists identically through any change — i.e.,
  mereological essentialism or the denial of persistence. Let''s build:


  (1) Suppose an enduring object O is wholly present at t1 and t2.

  (2) O changes from F at t1 to not-F at t2.

  (3) If O is wholly present at both times, then the very same subject has F (at t1)
  and not-F (at t2).

  (4) Leibniz''s Law: a single subject cannot have incompatible properties. To avoid
  contradiction, properties must be relativized to times: O has F-at-t1 and not-F-at-t2.

  (5) But if F-at-t1 and not-F-at-t2 are compatible properties, then "change" of this
  sort is not really change, but just possession of permanent time-indexed properties
  — like being bending on Monday; the object never changes in any intrinsic respect.

  (6) So endurantism cannot make sense of genuine change.

  (7) The perdurantist alternative concedes that nothing strictly persists: what exists
  at each time is a distinct temporal part.

  (8) Therefore, change is either unreal or nothing persists through change. But that''s
  absurd.


