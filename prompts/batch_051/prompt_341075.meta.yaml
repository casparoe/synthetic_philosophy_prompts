  Discursive dilemma (Pettit 2001, List & Pettit 2002): A group of three judges votes
  on whether a defendant is liable. Liability requires both (p) breach of contract
  and (q) valid contract. Judge A: p yes, q no -> not liable. Judge B: p no, q yes
  -> not liable. Judge C: p yes, q yes -> liable. Majority on p: yes (A, C). Majority
  on q: yes (B, C). Majority on conclusion: no (A, B). So majority on premises conflicts
  with majority on conclusion.


  Solutions/escape routes in literature:

  - Premise-based procedure (PBP): vote on premises, let conclusion follow. (List
  & Pettit; Dietrich)

  - Conclusion-based procedure (CBP): vote on conclusion only.

  - Give up on collective judgments: no group belief, only individuals.

  - Distance-based aggregation: select the collective judgment set that minimizes
  total distance to individual sets (Pigozzi 2006). Uses Hamming distance.

  - Deliberative account: deliberation can bring about single-peakedness or consensus,
  dissolving the dilemma (List; Dryzek & List).

  - Priority-based / weighting: give some premises priority? There''s the "sequential
  priority" agenda manipulation? Actually there''s "premise-based" as a special case
  of conclusion decoupled.

  - The "epistemic" approach: track truth rather than majoritarian.

