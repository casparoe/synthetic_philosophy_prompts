  Carroll''s Tortoise: In "What the Tortoise Said to Achilles" (Lewis Carroll, Mind,
  1895), Achilles gives the tortoise a Euclidean argument:

  (A) Things that are equal to the same are equal to each other.

  (B) The two sides of this triangle are things that are equal to the same.

  (Z) The two sides of this triangle are equal to each other.

  Tortoise accepts A and B but not Z; asks him to write in notebook: if A and B are
  true, Z must be true. Achilles adds it as premise C. Tortoise still won''t accept
  Z, so needs D: if A and B and C are true, Z must be true. And so on, infinite regress.
  The point: if you treat the rule of inference (modus ponens) as an additional premise,
  you never get to the conclusion; rules of inference are not premises. What does
  this show about the justification of deduction? Views differ: some say deduction
  cannot be justified without circularity (the rule used in justification), some say
  rules are not the kind of thing that needs justification as premises; some say the
  tortoise is just refusing to reason, not raising a skeptic problem.


  Common misrepresentations in the summary could be:

  - "The tortoise shows that you can''t prove the validity of modus ponens, so logic
  rests on faith." Overstatement: the dialogue shows a specific difficulty about treating
  rules as premises; it doesn''t by itself show logic is arbitrary or rests on faith.

  - "The tortoise is refusing to accept the conclusion, so the problem is about stubbornness
  or irrationality." The tortoise actually accepts premises; the regress arises from
  Achilles'' attempt.

  - "It shows deduction can''t be justified because any justification would use deduction."
  That''s a different argument (circularity).

  - Conflation: "rules of inference are just additional premises" — that''s what the
  summary may assert, but Carroll''s point is arguably that they are not premises;
  treating them as such leads to regress.


