  Lewis''s triviality: Assume Stalnaker''s Thesis (ST): P(A→C) = P(C|A) for any probability
  function P in a class closed under conditionalization. Then for any P, P(A→C|C)
  = P(C|A∧C) = 1 and P(A→C|¬C) = P(C|A∧¬C) = 0. By the law of total probability, P(A→C)
