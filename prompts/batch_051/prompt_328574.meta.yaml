  "My essay idea: Ryle''s target is the picture that a human being is a physical body
  plus a non-physical occupant, a ghost in the machine. On that picture, the mind
  is a second thing, made of a different stuff, that causes the body to act. Ryle''s
  central move is to say the problem with this picture is not that it reports a false
  fact, but that it commits a category mistake: it uses mental vocabulary as though
  it belonged to the same logical type as mechanical-cause vocabulary.


