  Software engineer notes:


  Title-less: "I''m drafting a short essay that tries to make Ryle''s category-mistake
  diagnosis intuitive to working programmers. My working thesis: the Cartesian picture
  Ryle attacks is best understood as a kind of type confusion, and several otherwise
  puzzling features of the debate can be diagnosed the way a type checker diagnoses
  category errors."


  Bullet points:

  1. The Cartesian picture: mental states and physical states are two substances,
  but Ryle says the problem isn''t that the mental substance is invisible; the problem
  is that the whole idiom misallocates concepts. It treats "the mind" as if it named
  another item in the world alongside bodies, like a second machine inside the machine,
  only made of non-matter. I want to say this is the philosophical analogue of a type
  error: it''s not a false runtime assertion about the world; it''s a misuse of a
  term''s type — e.g., using a function of type (Body -> State) where the language
  expects a different kind — so the resulting sentence/expression doesn''t so much
  say something false as fail to say anything articulate. Type errors are not bugs
  about values; they are bugs about what kind of thing can coherently be used where.


  2. The "ghost in the machine" picture persists because ordinary mental vocabulary
  (believing, intending, hoping) looks superficially like physical-process vocabulary:
  both take subjects and describe episodes. Just as a polymorphic function can be
  instantiated at the wrong concrete type, we instantiate mental-events grammar at
  the type of mechanical causation; the error is swallowed by the syntax and only
  shows up as a confused ontological picture. This is like a silently compiling type
  mismatch in a dynamically typed language: syntax is fine, semantics goes wrong,
  and you only notice when you try to reason about it.


  3. I want to make a further claim: Ryle''s positive view — that mental terms pick
  out dispositions, tendencies, or patterns rather than hidden inner episodes — resembles
  the move from modeling behavior as a hidden state machine to describing it as a
  set of observable behavioral dispositions over time. But I''m unsure whether that
  underplays Ryle''s more careful point that some mental goings-on are indeed episodes
  and not just dispositions.


