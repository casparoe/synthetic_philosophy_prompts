  Keynes in Treatise on Probability (1921): probability is degree of rational belief,
  a logical relation. He argues not all probabilities are measurable; many comparisons
  only (greater/less). He introduces "weight of arguments" — chapter VI "The Weight
  of Arguments". "The magnitude of the probability of an argument depends upon a balance
  between the favourable and unfavourable evidence. ... The weight of the argument,
  on the other hand, depends upon the absolute amount of relevant evidence, and its
  probability... " Weight increases with evidence, but probability may stay same or
  change. Example: an urn containing black and white balls in unknown proportions.
  First draw? If 100 balls, 50 black 50 white? Hmm.


  Keynes wrote about uncertainty later: In "The General Theory of Employment" and
  1937 QJE "The General Theory of Employment" he distinguishes about uncertainty vs
  risk: "By ''uncertain'' knowledge, let me explain, I do not mean merely to distinguish
  what is known for certain from what is only probable. The game of roulette is not
  subject, I suppose, to uncertainty in this sense; nor is the prospect of a Victory
  bond being drawn... The sense in which I am using the term is that in which the
  prospect of a European war is uncertain, or the price of copper and the rate of
  interest twenty years hence, or the obsolescence of a new invention, or the position
  of private wealth-owners in the social system in 1970. About these matters there
  is no scientific basis on which to form any calculable probability whatever. We
