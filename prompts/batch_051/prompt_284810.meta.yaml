  (1) I''m a compatibilist, but the free will I care about is the kind worth wanting
  in Dennett''s sense: self-control, reasons-responsiveness, the ability to revise
  my views under criticism, resistance to coercion — not the incompatibilist''s ''could
  have done otherwise with the same past and the same laws.'' (2) I think the Consequence
  Argument is sound: if determinism is true, nobody could have done otherwise in that
  exact sense. I just don''t think that sense of ''could have done otherwise'' is
  what makes us free or responsible. (3) I''m convinced by Frankfurt cases that responsibility
  doesn''t require alternative possibilities. (4) But I also have strong intuitions
  about manipulation cases, the Pereboom kind: if neuroscientists secretly implanted
  a person''s deepest desires and deliberative patterns, even a soft version where
  the person still weighs reasons and identifies with the resulting motives, that
  person isn''t responsible the way ordinary people are. (5) I don''t think this pushes
  me toward hard incompatibilism. The ordinary determined agent differs from the manipulated
  agent because her reasoning mechanisms weren''t intentionally designed by another
