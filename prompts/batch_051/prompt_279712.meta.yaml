  Let''s draft Domain 1 Type A prompt:


  "I''ve been trying to figure out what principle, if anything, lies behind my reactions
  to some welfare cases. They keep coming out inconsistent, and I want you to find
  the best principle or tell me which of my verdicts to drop. Here are my gut verdicts.


  - A single mother on an out-of-work benefit misses a work-search appointment because
  her daughter got sent home sick from school; the system suspends her payment for
  four weeks. I think that''s wrong.


  - A man on the same benefit turns up to his appointment drunk and tells the work
  coach to f*** off; he gets the same four-week suspension. I think that''s fine,
  maybe even lenient.


  - A woman claims as a lone parent but her boyfriend actually lives with her most
  nights and contributes; she lies about it on the form. I think she''s doing wrong—but
  I understand why.


  - A self-employed decorator sets up a company and pays himself dividends instead
  of salary so he qualifies for a benefit aimed at low-income families; this is all
  within the rules. I think he''s doing something worse than the woman who lies about
  her boyfriend, even though he hasn''t broken any rule.


  - A man whose disability benefit depends on him not being able to walk more than
  20 metres starts walking his dog for half an hour a day. He doesn''t tell the department
  because his condition fluctuates and he''s scared of losing the benefit and finding
  he''d worsened again. I think that''s wrong but I''d probably do the same.


  - A pensioner with £80,000 in savings claims a benefit she is fully entitled to,
  deposits it in a savings account, and never spends it. I don''t think she''s doing
  anything wrong at all.


  Is there a single principle—about deservingness, conditionality, rules, fraud, something
  else—that captures all six, or close? If not, which of my verdicts forces the most
  damage and which should I overturn? And what would your best principle say about
  the case I keep going back and forth on: a claimant takes a cash-in-hand cleaning
  job while still claiming, because she''s trying to save a deposit to move somewhere
  cheaper and stop claiming altogether—wrong, not wrong, or in between?"


