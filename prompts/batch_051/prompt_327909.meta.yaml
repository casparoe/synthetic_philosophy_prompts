  The general point: the more people who are able to act unilaterally, the more likely
  it is that at least one will have a high enough (but noisy) estimate of the action''s
  value to act, even when the "pooled" judgment would be negative. E.g., 50 people
  each draw an unbiased estimate around a true value of -1. Expected max of 50 independent
  estimates will be positive. So if each acts when their estimate is positive, someone
  will likely act even though every estimate is noise around a negative value. The
  solution: raise the individual threshold or adopt a "conformity principle" (act
  only if the group''s pooled judgment would support it). That''s the curse: individually
  rational but collectively harmful because the group''s max estimate is upward-biased.


