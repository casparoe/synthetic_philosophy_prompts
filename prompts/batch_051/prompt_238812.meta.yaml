  Domain: Malthus. The key conceptual issue: can a theory be ''right but early''?
  Falsification and rescue in long-run predictions. Desiderata for any theory making
  long-run population/resource predictions must include:

  - It must distinguish between a delayed mechanism and an absent mechanism (not just
  "right but early" ad hoc).

  - It must specify the conditions under which its predicted constraint operates (e.g.,
  arable land, non-substitutable resources, pollution sinks), so that innovation can
  be modeled inside vs outside the system.

  - It must handle the demographic transition (fertility declines with development)
  rather than wave it in as an unexplained deus ex machina.

  - It must give an account of technology endogeneity: whether scarcity induces innovation
  (Boserup) or innovation just postpones.

  - It must specify time horizon and trigger thresholds in advance, or at least state
  what would count as disconfirmation.

  - It must distinguish levels: individuals/subsistence crises vs global aggregate.

  - It must not allow arbitrary rescue: "it hasn''t happened yet" cannot be maintained
  indefinitely without new evidence.

  - It must say whether the prediction is conditional or unconditional.

  - It must respect ecological results (carrying capacity is dynamic not fixed) etc.


