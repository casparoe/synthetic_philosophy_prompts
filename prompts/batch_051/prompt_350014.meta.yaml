  Belief set:

  (1) Whig history — writing the past as an inevitable ascent to present freedoms
  — is a methodological vice: it anachronizes, flatters the present, and misdescribes
  losers as irrelevant.

  (2) To understand any present institution you need to trace the process by which
  it emerged; explaining how we got here is a central task of history.

  (3) Narrative history cannot proceed without principles of selection: some events,
  processes, and agents must count as more important than others.

  (4) Historical importance is retrospective: events are important in virtue of their
  consequences — specifically consequences for later developments, up to and including
  the present.

  (5) We can legitimately say some historical changes were improvements (the abolition
  of chattel slavery, the extension of the suffrage) without thereby writing Whig
  history.

  (6) We should not judge the people of the past as if they had our options and information,
  but we also shouldn''t pretend that moral evaluation is always inappropriate.


