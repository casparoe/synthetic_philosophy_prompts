  Possible argument:


  (1) To write a narrative history of any period, you must select some events and
  developments as more important than others, leaving out indefinitely many others.

  (2) Importance is always relative to an outcome: an event is more important than
  another only in virtue of making more of a difference to some later state of affairs.

  (3) The later state of affairs that fixes importance for a historian is just the
  state of affairs that interests her — for professional histories, that is normally
  some feature of the present (modern democracy, capitalism, science).

  (4) So to the extent a history is organized by importance at all, it is organized
  by difference-making to the present.

  (5) But organizing history by difference-making to the present is exactly what makes
  a history Whiggish: it reads the past as leading up to us, praises ancestors of
  present goods, and ignores losers and dead ends.

  (6) Whig history is systematically distorting and should be rejected.

  (7) Therefore, every narrative history either has no principle of selection (and
  is arbitrary) or is Whiggish (and distorting); hence no narrative history is both
  principled and non-distorting.


  This proves too much — it would rule out all respectable narrative history. Where
  does it go wrong?


  Potential flaws:

  - Premise (2) conflates causal importance (difference-making to an outcome) with
  historical significance. Significance can be fixed by the actors'' own categories,
  by representativeness, by the structure of institutions, not only later outcomes.

  - Premise (3) is false: the relevant later state need not be present to the historian;
  it can be some past outcome (e.g., the French Revolution, the fall of Rome), and
  histories are often organized around that.

  - Premise (5) equivocates: organizing by difference-making to the present is not
  sufficient for Whig history. Whig history requires more: a judgment of progress,
  an identification of past actors as forerunners, moral endorsement, inevitability.
  One can trace an outcome to the present without presupposing it was good or inevitable.
  History of the present can be genealogical, critical, contingent.

