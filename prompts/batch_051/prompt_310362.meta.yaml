  I''m a retired physical chemist and I''ve been reading philosophy of mind for the
  last couple years, mostly trying to get a handle on Ryle''s old distinction between
  knowing how and knowing that. Lately I keep seeing machine learning people talk
  about self-driving cars or LLMs that "know how" to drive, reason, translate, and
  so on, and it''s struck me that Ryle never got to see any of this—he died in 1976—but
  it seems like exactly the kind of thing he would have had opinions about, and I''d
  like you to work through what those opinions would most plausibly have been.


  I want you to act as a careful historian of philosophy and a Ryle scholar, and think
  hard before answering; start by brainstorming a few candidate readings of Ryle,
  then commit to the one you find most textually and philosophically defensible. Don''t
  worry about citations or a reading list—just reconstruct the view from the ideas.
  In particular, work through three cases: (1) a modern LLM that is prompted to reason
  "step by step" and generates an explicit chain of intermediate propositions before
  answering; (2) an end-to-end trained system like a self-driving car or a Go engine
  that behaves skillfully but whose competence is stored in connection weights rather
  than in anything propositional; and (3) the later neuroscience distinction between
  procedural and declarative memory. For each, give me your best guess about whether
  Ryle would classify the system as possessing knowing how, knowing that, neither,
  or some third thing, and explain why. Also address the obvious wrinkle: Ryle''s
  anti-intellectualist regress argument was aimed at the claim that every intelligent
  performance requires a prior bit of propositional knowledge. A chain-of-thought
  model looks, on the surface, like it does exactly that—it says its intermediate
  steps out loud. Would Ryle have treated that as a counterexample to his view, or
  as a completely different kind of thing (a category mistake, a performance rather
  than a competence, a parroting of justifications rather than a use of them, something
  else)? And would he be tempted to say a self-driving car has knowing how, or would
  he deny that because know-how for him is a many-way disposition of a whole agent—something
  that can adjust, explain itself, learn, correct mistakes—rather than a single-track
  mechanism?


  Make it substantive and true to the texture of Ryle''s actual position, not a generic
  "AI knows things?" essay. Think about the difference between a skill and its verbal
  accompaniment, and about what Ryle meant when he said the knowledge is not a separate
  inner event that causes the behavior.


