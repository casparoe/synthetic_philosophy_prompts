  The Colony Functionalist should defend the claim that the colony''s coordinated
  behavior — allocating foragers, choosing nest sites, regulating conditions, adjusting
  when circumstances change — displays enough information integration and goal-directedness
  to make mental ascription appropriate at the colony level, even though no individual
  ant represents the colony''s aims. She should press the Skeptic on why the absence
