  Write a dialogue between two philosophers of mind who genuinely disagree about whether
  an ant colony such as Aunt Hillary — the colony in Hofstadter''s "Ant Fugue," whose
  individual ants follow simple local rules while the colony as a whole does strikingly
  intelligent-looking things — can literally be said to have a mind. Give each character
  a working label, such as the Colony Functionalist and the Unitary-Perspective Skeptic,
  and make them equally competent: neither should be a strawman, and each should respond
