  The intent/effect/dog whistle debate: Key positions:

  - Some hold that a statement (or speech act) is racist in virtue of its meaning/content
  or its effect, not the speaker''s intent. E.g., an utterance can be racist regardless
  of what the speaker meant, because meaning is public and effects are real. A "dog
  whistle" is a statement that communicates a racist message to an in-group while
  appearing innocuous to outsiders, without explicit slur; the speaker''s intent matters
  for deniability, but the term is contested.

  - Others emphasize intent: whether a statement is racist depends on the speaker''s
  attitudes/aims; otherwise we lose the distinction between racist speech and clueless/awful
  speech, or we punish people for how words are taken.

  - A common view in philosophy of language: "racist" can predicate of different things
  — a person (character), a belief, an utterance, a policy, a structure. What makes
  a *statement* racist may differ from what makes a *person* racist. Intent may matter
  for one but not the other.


