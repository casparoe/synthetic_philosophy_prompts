  "I''ve been reading William James''s chapter on Habit in The Principles of Psychology,
  and one of his practical maxims has stuck with me. He says, roughly, that when you
  are trying to build a new habit you should make the start as decisive and as strong
  as possible, arrange your circumstances so the new way is reinforced, and then,
  crucially, not let yourself slip back even once until the habit is solidly rooted.
  His deeper claim is that habit is the flywheel of society and the great conservative
  force—it keeps things moving along without conscious effort, which frees the ''higher
  powers of mind'' for real work. But then I thought: the rationality stuff people
  talk about—red teaming your own views, checking base rates, noticing when you are
  rationalizing—seems exactly like the sort of thing that should become habit. If
  you could drill ''check the base rate'' the way a pianist drills scales, then in
  the moment you would just do it without spending mental energy. But martial arts
  training has katas, fixed forms you repeat thousands of times, and I''ve heard people
  argue that kata do not make you a better fighter because a real fight is not like
  the form. They say you need live sparring, not just repetitions of a pattern. So
  which model is right for rationality? Is James''s habit model closer to the martial
  arts kata view (drill it until automatic) or is rationality more like the ''live
  sparring'' view, where you need unpredictable conditions and transfer is not automatic?
  Compare James''s account of habit with the kata vs. sparring distinction as two
