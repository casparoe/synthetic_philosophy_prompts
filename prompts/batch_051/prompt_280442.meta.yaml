  Here are the claims as I would currently assert them:


  1. Forgiveness is the victim''s decision to forswear, or at least deliberately to
  set aside, resentment toward the wrongdoer. It is not excusing, condoning, or forgetting;
  and it does not by itself restore trust or require reconciliation.


  2. Resentment can be the fitting response to being wronged: it registers the wrong
  and asserts the victim''s standing. It is not merely an unhealthy emotion that the
  victim should let go for the sake of his own peace.


  3. Forgiveness is always elective. No victim is ever morally obligated to forgive
  a particular wrongdoer for a particular wrong.


  4. Nevertheless, the disposition to forgive is a virtue. A person who, even after
  full repair and sincere amends, never forgives anyone has a defect of character,
  not merely an unusual preference.


  5. Only the victim may forgive the wrong. A third party who was not wronged cannot
  properly extend forgiveness, unless the victim—or a wronged community through its
  authorized representatives—has delegated that standing.


  6. Genuine forgiveness requires the wrongdoer''s acknowledgment: he must recognize
