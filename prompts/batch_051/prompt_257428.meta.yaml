  not merely easier to evaluate; it is offering the donor something scarce, namely
  evidence that is cheap to trust. I call the share of funding that flows to an intervention
  purely because its results are easy to verify its ''legibility rent.'' My central
  claim is that a large part of the measurability bias in effective altruism is not
  an irrational failure to value hard-to-measure goods, but a rational price that
  donors pay for being able to trust their own choice. The measurable does not win
  because it is measurably better; it wins because measurability itself is a service
  to the donor, and the donor rationally pays a premium for it. I know this resembles
  Goodhart''s law and principal-agent problems, but I think it goes further: it predicts
  that even donors who fully understand the value of unmeasurable institutional change
  will still, rationally, underfund it. I''d like your honest assessment. Is this
  a real distinction or just a metaphor? Has it already been worked out under another
  name? Where does it break — can you give me the strongest case where a donor could
