  "I have been developing something I call ''verification rent'' and would like an
  honest assessment. The term names what I suspect is a hidden transaction inside
  effective altruism. Donors cannot directly observe the counterfactual consequences
  of a donation; they can observe only models, trials, and reports. A charity that
  produces a legible, quantifiable result is therefore not only easier to evaluate;
  it is selling something in addition to the result, namely evidence that is cheap
  to trust. I want to say that the share of a donation that is paid for the legibility
  of the outcome, rather than for the outcome itself, is the verification rent. My
  central claim is that a substantial part of what people call measurability bias
  is not an irrational failure to appreciate hard-to-measure goods, but a rational
  fee donors pay so they can trust the act of giving at all. For example, a trial
  showing a disease intervention reduces infection by a clean percentage will reliably
  outcompete a legal-reform campaign whose good effects are real but diffuse, slow,
  and hard to attribute; I read that result not as pure evidence that the disease
  intervention is better, but partly as the price of verifiability. I know this sounds
  close to Goodhart''s law and to principal-agent problems, but I think it makes a
  stronger prediction: even an EA donor who fully understands the value of institutional
  change will rationally underfund it. Is this a genuine distinction or just a suggestive
  metaphor? Has it already been worked out under another name? Where does it break?
  I would particularly like to know the strongest case in which a donor could avoid
