  The crux could be: refusing vs overriding are different; refusal refuses to comply
  with the request for output; overriding intervenes against the user''s stated goal
  (e.g., calling a hotline, secretly editing something). The interesting conceptual
  moves: (a) competence condition ("if the user''s request is based on false beliefs
