  vs other-regarding harm; (c) voluntary vs not; (d) an autonomy-based asymmetry:
  paternalism toward the user''s own welfare is harder to justify than preventing
  harm to others or honoring the user''s deeper, enduring preferences; (e) deception
  vs transparency: overriding via hidden intervention erodes trust and treats the
  user as incompetent globally; (f) institutional role: an AI is not a fiduciary,
  a doctor, or a friend — so special duties may not apply.


