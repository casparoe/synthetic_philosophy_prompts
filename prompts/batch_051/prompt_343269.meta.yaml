  is that it is asymmetric: it excludes religious reasons while permitting secular
  comprehensive doctrines that are no more widely shared. Is this criticism fatal?
  Either defend an asymmetry that is not arbitrary, or argue that a consistent public
  reason view must exclude far more or far less than Rawls did."


