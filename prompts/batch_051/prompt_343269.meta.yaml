  Public reason: The standard Rawlsian idea: citizens should be able to justify fundamental
  political decisions by reasons others can reasonably accept, so religious arguments
  are excluded from public justification unless they''re accompanied by public reasons.
  A crux: the asymmetry objection — why exclude religious reasons but allow secular
  comprehensive doctrines (e.g., utilitarianism, Kantianism) which are equally controversial?
  Also the "religious reasons as accessible" question: many religious arguments are
  intelligible and evaluable by non-believers; many secular arguments are not. Also
  the "what about a religious citizen''s integrity" question.


