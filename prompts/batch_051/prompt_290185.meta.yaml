  I am preparing a course unit on Augustine''s ethics of truthfulness and want to
  screen Ricky Gervais''s The Invention of Lying (2009) as the test case. I need a
  rigorous reading of the film through Augustine''s position that every lie is a sin.


  Here is the version of the position I want the reading to engage. For Augustine,
  a lie is not defined by its consequences but by the speaker''s will to state what
  is false in order to deceive. Its wrongness does not depend on how anyone is subsequently
  affected. No lie is permitted: even the ''helpful'' lie — told to console, to protect,
  or to save an innocent person from harm — remains a sin, because it corrupts the
  speaker''s rational nature, misuses the faculty of speech, and withholds from the
  neighbor the truth that truthfulness owes them. Augustine does not treat all lies
  as equally grave; he distinguishes (in De mendacio) eight kinds of lie, ordered
  by gravity, from lies in matters of religion down to everyday social and officious
  lies. But the ordering is a ranking of sins, not a list of exceptions: the least
  grave kind is still to be shunned.


  The film looks almost designed to embarrass this view. In a world where no one has
  ever lied, the protagonist discovers he can say what is not the case. One of his
  first and most moving lies is told to his dying mother, whom he comforts with an
  invented account of a blissful afterlife; the film presents this as humane, and
  the protagonist''s invention later grows into a public religion that makes him a
