  I am preparing a unit on Augustine''s ethics of truthfulness, and I plan to screen
  Ricky Gervais''s 2009 film The Invention of Lying. I want a rigorous philosophical
  reading of the film through Augustine''s position that all lying is sin.


  For background, take Augustine''s core claims to be roughly these. Lying is speech
  (or other signification) uttered with the will to state a falsehood, and its wrongness
  does not depend on how anyone is affected. It is proscribed for every kind of lie,
  even the ''helpful lie'' told to spare the innocent, because a lie corrupts the
  speaker''s rational nature, misuses the faculty of speech, and withdraws from one''s
  neighbor the truth they are owed. Augustine does distinguish kinds of lies by motive
  and gravity — lies in matters of religion being most damning, wanton lies and lies
  told to harm next, and social or officious lies comparatively least — but even the
  least is still sin and to be avoided, not merely excused.


  Here is the central interpretive question. The film seems purpose-built as a counterexample
  to Augustine''s absolutism: in a world where no one can lie, the protagonist discovers
  that he can say what is not the case, and among the first and most moving of his
  lies is telling his dying mother that there is a wonderful afterlife awaiting her.
  The film treats this as tender and necessary, and goes on to make the protagonist
  a sort of accidental prophet. Augustine, as I understand him, would regard that
  scene not as an exception that refutes his view but as a severe test case that his
