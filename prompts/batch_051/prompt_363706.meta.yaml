  The nonidentity problem: The classic issue: if a policy affects who will exist (different
  people), then those future people cannot be said to be harmed by the policy if their
  lives are worth living. So climate policy, for example: if we don''t mitigate, future
  people will exist who wouldn''t have existed otherwise; if their lives are still
  worth living, are they harmed? Parfit''s nonidentity problem. Commitments: (a) we
  can wrong future generations through environmental policy; (b) someone is harmed
  only if they are made worse off than they would otherwise have been; (c) the people
  who will exist under a bad policy wouldn''t have existed under a better policy;
  (d) a life can be worth living even if it''s worse than the alternative life they''d
  have had; (e) we have obligations of justice to future people. These create tensions.


  But the prompt should be from high school student. They might be in a debate or
  philosophy club. They should be "in the weeds" — not too standard. The commitments
  should be reasonable and recognizably held, with one or two genuine tensions not
  obvious, plus one apparent tension that dissolves.


