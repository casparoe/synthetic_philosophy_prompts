  ---


  "I coordinate the assessment committee for our department''s first-year honors mathematics
  sequence, which covers proof-based linear algebra and single-variable real analysis.
  The sequence ends not with a traditional written final but with a short oral ''proof
  defense'': each student is assigned one theorem whose proof was developed in the
  course, presents the proof, and then answers questions from the examiner. We run
  about 140 of these each term, the examiners are graduate students with uneven teaching
  experience and at most a half-day of calibration, and each defense is twenty minutes.
  The stakes are real: passing is required to continue in the honors track, and borderline
  cases get reviewed by one faculty member, but we would like to keep the fraction
  of cases that reach faculty review small.


  The committee has converged on a working principle we want the examiners to operationalize:
  a student genuinely understands a proof to the extent that they can (i) state the
  central idea of the proof in their own words, (ii) say why each hypothesis is there
  by identifying where the argument would fail without it, and (iii) adapt or modify
  the argument under a small change to the setup — as opposed to merely reproducing
  the proof correctly from memory. We''ve tried handing this principle to examiners
  as guidance, and it produces wildly inconsistent judgments, so I''d like it turned
  into a concrete procedure: an ordered list of questions or probes for the examiner
  to run, with a rubric for what counts as a sufficient answer to each, explicit stopping
  rules for ''not demonstrated'' and for ''clearly demonstrated'', and a defined notion
  of ''borderline'' that is the only thing sent to the faculty reviewer. Please also
  mark the points where the procedure cannot eliminate examiner judgment, and say
  what the procedure will reliably miss or get wrong.


  Finally, run the procedure on three students to show how it actually behaves: (a)
  a student who reproduces the assigned proof perfectly, notation and all, but cannot
  answer any question about why a hypothesis is needed or what would happen if it
  were weakened; (b) a student who stumbles badly over notation in the opening definitions,
  but when prompted describes the proof''s main idea plainly, explains the role of
