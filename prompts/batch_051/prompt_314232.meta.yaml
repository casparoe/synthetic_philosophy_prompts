  learns this, most accept it, and a few simply leave. Read one way, the arrangement
  looks like a group-level adaptation carried at an individual-level cost—the city
  flourishes as a unit precisely because one of its members is made to suffer, the
  citizens who stay look like cooperators stabilizing a group strategy, and the ones
  who walk away look like defectors who neither reap group benefits nor bring about
