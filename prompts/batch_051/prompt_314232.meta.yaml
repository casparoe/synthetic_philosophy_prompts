  Argument idea:


  (1) An agent that optimizes a surrogate goal S instead of its true target T will,
  in some possible situation, choose an action that advances S while harming T — that''s
  what it means for S to be a proxy, not perfectly correlated.

  (2) By the terms of the problem, the agent cares about T, so it would prefer to
  avoid those divergences.

  (3) Now, consider a second possible agent, or a possible version of itself, that
  faces the same divergence and is predicted to be similar. Since the agent can predict
  that agents similar to it will harm T in those situations, it has an acausal interest
  in not being the kind of agent that does so.

  (4) But an acausal decision theory says choices about our own policy are binding
  on all similar agents: choosing S now is choosing that S-like agents harm T across
  the world.

  (5) Therefore the agent should never choose a surrogate goal; it should hold T directly,
  even when T is not computationally accessible.

  (6) But T is by stipulation not directly computable, so "hold T directly" is not
  an available option. So the argument concludes that an agent with an inaccessible
  true objective is rationally required to do the impossible: adopt a goal it cannot
  represent. That means something is wrong with the decision theory... Since agents
  like companies do adopt and succeed with surrogates, the argument proves too much.


