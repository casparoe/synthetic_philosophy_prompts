  A responds: But Mill''s point about competition is not that competition reveals
  inherent nature; it''s an argument about who should be prevented from doing what.
  The anti-feminist says "women shouldn''t do X because it''s against their nature."
  Mill says: either they can''t do X by nature, in which case your legal/social prohibitions
