  Let me draft a possible prompt:


  ---

  I have been collecting my own settled judgments about what deserves to be called
  ''pleasure'', in preparation for a lecture on hedonism, and I find that my verdicts
  do not obviously fall under one definition. I would like you to help me find the
  principle, or small set of principles, behind them.


  Here are my verdicts, deliberately stated without theory:


  1. A warm bath after hard physical work: a paradigm pleasure, and the pleasure seems
  to be in the feel of the bath itself.

  2. The sudden relief when a feared medical result comes back negative: I am inclined
  to count this as a pleasure, but it feels as though it consists wholly in the disappearance
  of anxiety. If it is a pleasure, it is of a different kind from (1).

  3. The small pleasure of scratching an itch: I count it, but with hesitation. It,
  too, seems derivative from an unpleasant state; if (2) were denied, this would likely
  go too.

  4. Taking pleasure in a rival''s minor professional failure: I count it as pleasure,
  but it does not feel like anything in particular; it seems to be a way of regarding
  a fact, and only after the fact do I put words on it.

  5. Solving a difficult proof after hours of dead ends: a pleasure, possibly intense,
  but I cannot locate any distinctive bodily feeling. It is not like (1), and not
  simply relief like (2).

  6. The masochist''s enjoyment of the pain in his scene: I am committed to calling
  this a pleasure even though it is also pain. Whatever pleasure is, it cannot simply
  be the absence or opposite of pain.

  7. Anticipatory pleasure before a holiday: pleasurable, but the felt quality is
  diffuse and shifting, and there is no present object — the holiday does not yet
  exist.


  My tentative view, which I ask you to test and repair, is that ''pleasure'' covers
  at least two very different kinds: sensory pleasures, which are experiences with
  positive hedonic tone (case 1, maybe 3), and cognitive pleasures, which are attitudes
  of being pleased about some state of affairs (cases 4 and maybe 5). But this leaves
  (2), (3), and (7) imperfectly placed, and it licenses the worry that the two kinds
  have nothing in common except the word.


  Please state, as precisely as you can, the principle or candidate principles that
  best capture all seven verdicts. For each candidate, say which cases motivate each
  clause, what it implies about cases I have not listed — for example, the pleasure
  of falling asleep at the end of a day; the ''pleasure'' someone reports from a drug
  but would not seek again; the pleasure of being right after someone denied it; and
  the faint liking a depressed person reports for a song without wanting to listen
  — and which of my verdicts it cannot accommodate. If no single principle captures
  all seven without intolerable complexity, tell me which verdict or verdicts are
  the best candidates to revise, and why the resulting account is preferable.

  ---


