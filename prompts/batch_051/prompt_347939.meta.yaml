  Potential final prompt:


  "I spent my career as a research scientist, and late in life I have fallen into
  philosophy. The problem that has come to occupy me is the reference class problem
  for probability. I don''t mean the epistemology of statistics in general; I mean
  the specific difficulty that any token event belongs to indefinitely many classes,
  and the probability we assign to it depends on which class we take it as an instance
  of. A tumor in a particular patient belongs to the class of all tumors, of tumors
  of that histology, of tumors of that histology and stage and age-group, of tumors
  in patients with this patient''s exact genome, and so on; the 10-year survival figures
  differ across all of them. Salmon and Hájek have convinced me that this is not a
  small technical nuisance; it sits at the center of any account of what single-case
  probability means.


  Before I read another proposal, I want the specification. Write the desiderata:
  what must a theory of reference-class selection — a rule for taking an individual
  case and saying which class or classes fix its probability — do to count as adequate?
  My interest is not in the mathematics of ensembles but in working scientific inference:
  assigning defensible probabilities to individual events for decisions about diagnosis,
  hazard, litigation, and forecast. So adequacy is relative to that use.


  For each requirement, give the case or consideration that forces it. Among the things
  I suspect must be on the list (but use your judgment): a response to gerrymandered
  or disjunctive classes that are fixed after the fact; an answer to how fine-grained
  the class should be, given that the finest classes are singletons with no usable
  frequency; a way to respect the statistician''s practice of stratified analysis
  and the epidemiologist''s practice of choosing comparable groups that does not smuggle
  in a causal model under the table; a treatment of the demand to use the ''narrowest
  class for which reliable statistics exist'' and where its cutoff is supposed to
  come from; and something to say about events that look genuinely single-case, like
  the first launch of a new kind of rocket. Distinguish between requirements that
  are non-negotiable if the idea of single-case probability is to mean anything, requirements
  that are necessary for scientific use, and requirements that are merely the preferences
  of one school.


  Then tell me whether some subset of these desiderata cannot be jointly met — I suspect,
  for example, that the demand for maximal specificity and the demand for a class
  large enough to support stable frequencies pull in opposite directions, and that
  the demand that probabilities track causes and the demand that they be discoverable
  from outcome data alone may too. Is that right, and are the conflicts real or apparent?


  Finally, and briefly, score the standard answers — frequentism, propensities, subjective
  Bayesianism, and any natural-kind or causal account — against the list, just enough
  to show which requirement does the most to exclude each."


