  Draft:


  "After forty years in the natural sciences, I have taken up philosophy, and the
  problem I keep returning to is the reference class problem. As I understand it,
  the difficulty is this. A single event — a tumor in this patient, a flood in this
  basin, the failure of this turbine — belongs to many classes at once, and the probability
  assigned to the event shifts with the class: survival differs by tumor type, stage,
  comorbidity, and genome; flood risk differs by basin, season, antecedent soil moisture,
  and climate model; turbine failure differs by make, operating hours, maintenance
  history, and so on. Nothing in the mathematics tells us which class is the right
  one, yet a single-case probability has to be relative to some class or it is only
  a number. I now think this is not a peripheral worry about statistical estimation
  but the central obstacle for any account of what it means to say that this event
  has some probability."


  Then the ask: "Before I read another proposed solution, I want the specification
  of what a solution must do." Good.


  Then enumerate suspected requirements but ask them to judge. Include:


  1. Anti-gerrymandering: A rule must not permit classes to be constructed, after
  the fact, to yield whatever probability one wants (e.g., "events of kind K that
  occur on a Tuesday in a month containing the letter r and otherwise resemble this
  one"). This is a real phenomenon in actuarial/courtroom contexts.


  2. The grain problem: Must say how specific to be. Finest class for an individual
  is a singleton, which has no meaningful frequentist probability (0/1 in the limit
  of one trial). Must avoid both the vacuous one-member class and the too-inclusive
  class that washes out known risk factors.


  3. The projectibility/statistical adequacy distinction: Reference class must be
  homogeneous in the relevant sense — same casual or probabilistic structure, not
  just same outcome frequency in past data. Otherwise a class that happens to show
  a frequency by sampling noise would be on a par with a causally unified one. Must
  distinguish evidential from causal homogeneity.


  4. Handle covariables/stratification: Must rationalize why stratifying by a variable
  changes the answer (Simpson''s paradox), and thus must interface with causal modeling:
  which variables to condition on. Shouldn''t claim to be purely statistical while
  silently importing a causal graph or vice versa.


  5. The "narrowest class" rule and its cutoff: Reichenbach-style: choose the narrowest
  reference class for which we have reliable statistics. But must specify what counts
  as reliable (sample size? stability? independence?) and what to do below the threshold
  — merge upward? borrow strength? adopt a prior? The cutoff can''t be arbitrary without
  making the resulting probability arbitrary.


  6. Total evidence: The class must reflect all relevant evidence available to the
  assigner. But how to weigh an exact-match but nearly empty class vs. a broad, well-populated
  class? Does total evidence push toward the singleton and thereby conflict with stability?


  7. Single-case/unique events: Some events are singular enough that no useful class
  exists (first flight of a new launch vehicle, a particular individual''s chance
  under a novel treatment). Adequacy requires either a way to construct a class from
  similarity judgments or an admission that no objective single-case probability exists
  there — and what that means for decision.


  8. Circularity constraint: The class cannot be defined as "events with the same
  probability" or "same chance set-up" without an independent criterion of same set-up,
  or the account is circular.


  9. Maybe update/computability: A class-selection rule should be stable under new
  information? Or should be something a bounded agent can actually use.


  10. Distinguish type vs. token: Different senses (statistical frequency vs. propensity
  vs. credence) may pick different classes; must say which is primary and how they
  relate.


  Non-negotiable vs scientific vs school-specific: e.g., anti-gerrymandering and non-circularity
  are non-negotiable; stratification and projectibility are needed for scientific
  use; the demand that probabilities be physical propensities or that classes be natural
  kinds is parochial.


  Joint unsatisfiability: maximal specificity vs. stable frequency; causal homogeneity
  vs. observability (frequencies are all we observe); total evidence vs. tractability;
  uniqueness vs. objectivity of single-case chance.


  Then brief scorecard. We can ask for a table. But the main weight on criteria.


