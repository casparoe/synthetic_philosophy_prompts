  Dirty hands in politics: the idea that politicians sometimes must do wrong (e.g.,
  order torture to locate a bomb) and yet this leaves a moral remainder (guilt, remorse,
  need for atonement) even though the act was the right thing to do. Key tensions:
  if the act was all-things-considered right, why should the agent feel guilt? Can
  an act be both right and wrong? Is the "remainder" evidence that it wasn''t right,
  or a separate non-moral sense? The classic paradox: doing wrong for the right reasons.


  Set of commitments someone might hold:

  (1) In some extreme cases a political leader ought to do something that, in normal
  circumstances, would be gravely wrong (e.g., authorise a targeted killing to stop
  an imminent attack).

  (2) The fact that it was the right call doesn''t erase the wrongness — there''s
  a "moral remainder"; they should feel something like remorse and owe some form of
  acknowledgment or repair.

  (3) Morality gives a single all-things-considered verdict on any action — right,
  wrong, or permissible — and this verdict takes everything into account.

  (4) If someone has done what they ought to do, they have nothing to be guilty about.

  (5) Yet guilt is sometimes appropriate even in the cases in (1)-(2).


  Tension: (3) and (2/1) — if the act is all-things-considered right, how can it be
  wrong in any sense? The "wrongness" that remains must either be part of the all-things-considered
  verdict (making it not simply right) or not part of morality at all (making it aesthetic
  or psychological). Tension between (4) and (2): if they ought, no guilt appropriate.
  But some philosophers reconcile by distinguishing "ought" from "wrong-making features":
  act is right but does have wrong-making features, and agent should feel compunction/regret
  rather than guilt. Apparent tension that dissolves: maybe the sense of obligation
  vs. the sense of justification.


