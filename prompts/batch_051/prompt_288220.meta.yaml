  Prompt draft:


  "I''ve been going down a rabbit hole about how to update beliefs on conditional
  information, ever since my friend (who does forecasting stuff) asked me how I''d
  handle a piece of evidence that arrives in the form of ''if this goes wrong, it''ll
  go wrong in this specific way.'' I''ve settled on the following view, and now I''m
  worried I''ve just rationalized it. Take the Judy Benjamin setup: a soldier is airdropped
  into one of four regions—Red Second Company, Red Headquarters, Blue Second Company,
  Blue Headquarters—and starts with, say, equal credence in each. She gets a radio
  message she trusts: ''we can''t tell where you are; if you''re in Red territory,
  you''re in Headquarters Company.'' My view is that she should do the following:
  set her credence in Red-and-Second to zero, keep her credence that she''s in Red
  territory overall at .5, and split the remaining probability across the Blue regions
  in whatever ratio she had before. More generally: when you learn a conditional ''if
  A then B'' (or a precise probability for it), you should treat it as a constraint
  on a conditional probability, leave probabilities involving the antecedent alone
  as much as possible, and otherwise move the least you can—say, by minimizing KL
  divergence subject to the constraint. In particular, you should not conditionalize
  on the material conditional ''not-A or B,'' which in the Judy Benjamin case would
  weirdly make her less sure she''s in Red territory even though the message didn''t
  say anything about whether she''s in Red versus Blue.


