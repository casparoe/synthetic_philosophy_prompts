  Wrong kind of reasons problem background:

  - Fitting-attitude (FA) analysis of value: for x to be good/valuable is for x to
  have features that make it fitting to favor x (admire, prefer, etc.).

  - But sometimes there are reasons to favor x that have nothing to do with x''s value:
  e.g., an evil demon will reward/punish you for admiring it. You have reason to admire
  the demon, but the demon is not thereby good/valuable.

  - The FA analysis must distinguish the reasons whose presence makes the attitude
  fitting in the value-relevant sense ("right kind" reasons) from those that merely
  make the attitude useful/expedient ("wrong kind" reasons).

  - One prominent approach: object-given vs state-given reasons. Object-given reasons
  are provided by properties of the object of the attitude; state-given reasons are
  provided by properties of the state of having the attitude (e.g., that admiring
  the demon will save you). The FA analysis of value should use object-given reasons.

  - The problem with this: can we characterize object-givenness without circularity?
  Also some state-given reasons seem to bear on value in some evaluative attitudes?
  And some reasons can be described either way via redescription.


  I can anchor the two camps:

  - Party A (object-given/state-given solution): value facts are reducible to facts
  about fitting attitudes backed by object-given reasons; the distinction is drawn
  by whose properties do the reason-giving: properties of the object vs properties
  of the attitude. WKR cases are just reasons of state-given type, which the analysis
  excludes.

  - Party B (skeptic): the object/state distinction either (i) fails to capture all
  right-kind reasons (some right-kind reasons are state-given? hmm), or (ii) can only
  be drawn by smuggling in value, or (iii) is unstable under redescription. So WKR
