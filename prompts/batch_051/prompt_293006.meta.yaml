  The White Horse dialogue: Gongsun Long argues "white horse is not horse." Arguments:
  "horse" names a shape/kind, "white" names a color; the name of a color is not the
  name of a shape; so white horse is not horse. Another argument: when seeking a horse,
  any yellow/black horse will do; when seeking a white horse, only a white horse will
  do; so what satisfies "horse" differs from what satisfies "white horse." Another:
  "white horse" is "horse together with white" — horse and white horse are different.


  Two views:

  - Separator (Gongsun Long-style): terms with different intensions denote different
  referents / the composite "white horse" includes whiteness, horse doesn''t, therefore
  not identical; "is" is not univocal.

  - Unifier: "white horse is a horse" is true because the modifier restricts within
  the extension of the kind; "white horse" and "horse" differ in sense but not in
  generic kind membership; seeking a white horse is seeking a horse (plus a color),
  so the failure of substitutability is due to intensional contexts, not a distinction
  in the creature.


