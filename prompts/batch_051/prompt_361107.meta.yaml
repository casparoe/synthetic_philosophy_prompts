  1. You should perform an act if and only if it best serves your self-interest overall.
  (Act-egoism / rational egoism.)

  2. A promise must be credible to work: the driver must expect to be paid to give
  the ride.

  3. The rational egoist will, ex hypothesi, not pay when the time comes, because
  paying then costs money and gains her nothing (the ride is already had; no enforcement
  or reputation).

  4. The driver, knowing this, will not give the ride.

  5. So the rational egoist is left stranded. The only way to get the ride is to have
  a trustworthy disposition to pay even when it doesn''t serve self-interest — a disposition
  that makes the later act of paying irrational by (1).

  6. Foreseeing this, rational egoism instructs the hitchhiker to adopt that disposition
  if she can, since doing so is in her net self-interest.

  7. But a theory of rationality that, in foreseeable situations, instructs an agent
  to become systematically irrational must be rejected as self-effacing.

  8. Therefore rational egoism (act-egoism) is false, or at least cannot be the full
  account of practical rationality.


