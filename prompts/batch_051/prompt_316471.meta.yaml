  For an upper-level philosophy seminar on coordination problems and the governance
  of frontier artificial intelligence, with sixteen students of mixed philosophical
  and technical background, design a ninety-minute activity that makes the participants
  feel the force of a multipolar trap before it is named. The intended takeaway is
  not the vocabulary but the experience: that a set of individually rational choices
  can be collectively self-defeating, that this can happen even when everyone knows
  the structure, and that non-binding declarations of good intent do not by themselves
  change the incentives. The centerpiece should be a repeated, scored game in which
  each student or small team runs a frontier AI lab and must decide each round how
  to divide a fixed compute budget between safety and capability. Structure the payoffs
  so that capability spending is privately dominant in the single round—it raises
  the lab''s score while its individual contribution to shared catastrophe risk is
  too small to make unilateral safety worthwhile in expectation—yet the stochastic
  mechanism should be steep enough that, when most labs choose capability in most
  rounds, the probability that all scores are wiped out rises toward near certainty
