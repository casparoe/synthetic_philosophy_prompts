  Discursive dilemma (List & Pettit): A group of individuals each has consistent judgments
  on a set of logically connected propositions. Suppose three judges vote on two premises
  P and Q and conclusion R = P ∧ Q. Judge A: P yes, Q no, R no (consistent). Judge
  B: P no, Q yes, R no (consistent). Judge C: P yes, Q yes, R yes (consistent). Majority
  on P: yes (A,C). Majority on Q: yes (B,C). Majority on R: no (A,B). So majority
  on premises supports R, majority on conclusion rejects R. If the group aggregates
  premise-by-premise, it gets {P, Q, ¬R}, which is inconsistent; if it aggregates
  conclusion directly, it gets {P? no...} Actually conclusion-based: R no, without
  group positions on P,Q; that''s consistent but incomplete. The dilemma: proposition-wise
  majority voting can yield inconsistent collective judgments; alternatives (premise-based,
  conclusion-based) drop the "collective judgments on all propositions" requirement
  or violate other properties.


