  and after it ends, the person remembers it vividly but cannot prove to anyone else
  that it happened. Everyone knows the experience is coming for them, and everyone
  knows everyone else knows this, but no one knows when it will arrive. The experience
  conveys only the bare existence and goodness of the creator and the fact that the
  creator cares about human conduct. It conveys nothing about which religion, if any,
  is true, and it issues no specific commands.


