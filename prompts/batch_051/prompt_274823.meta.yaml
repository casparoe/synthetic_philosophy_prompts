  Arrow''s theorem: Suppose n ≥ 2 voters, k ≥ 3 alternatives. A social welfare function
  maps each profile of complete transitive individual preference orderings to a complete
  transitive social ordering. Conditions: (U) unrestricted domain; (P) weak Pareto
  — if everyone prefers x to y, society prefers x to y; (IIA) the social preference
  between x and y depends only on individual preferences between x and y; (D) non-dictatorship
  — no single voter whose strict preference always becomes the social strict preference
  regardless of others. Theorem: no SWF satisfies U, P, IIA, D. (Variants: with transitivity...)


  CAP theorem (Brewer''s conjecture, proved by Gilbert and Lynch): In a distributed
  data store, you cannot simultaneously guarantee Consistency (all nodes see the same
  data at the same time / linearizability), Availability (every request receives a
  response), and Partition tolerance (the system continues to operate despite network
  partitions). Actually the precise statement: a distributed system can satisfy at
  most two of the three; in practice, because partitions happen, you choose between
  C and A during a partition.


