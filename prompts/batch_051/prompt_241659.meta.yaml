  I''ve been chewing on Dennett''s four-creature tower (Darwinian, Skinnerian, Popperian,
  Gregorian) and I think there''s a missing rung between Skinnerian and Popperian.
  As I understand the ladder: Darwinian creatures have behaviors fixed by their genes
  and only the lineage learns; Skinnerian creatures try things in the world and keep
  what gets rewarded; Popperian creatures let hypotheses die in their head instead
  of in the world; Gregorian creatures add tools like language and culture so they
  can pre-test other people''s guesses. I want to wedge in what I''ve been calling
  ''affective simulators.'' The rough idea is that before you get full-blown Popperian
  simulation—a rich inner model where you run an action and get a detailed predicted
  outcome—there''s a level where a creature can try out a few actions internally but
  only gets back a valence signal: a felt good/bad, a gut lean, one option just feels
  right. My dog hesitating between jumping the fence and going around isn''t, I suspect,
  running a little movie of both outcomes; he''s getting an affective push or pull
  for each candidate. That''s still internal selection, hypotheses dying in the animal
  instead of out in the world, but the representational payload is valence, not a
  simulated world.


  I know this could just be Popperian lite, or a difference of degree rather than
  kind. But I have a hunch it''s actually a separate computational stage, and that
  lumping it in with Popperian creatures hides how much of animal cognition is built
  out of felt evaluations rather than rich prediction. So: is this a real distinction?
  Does it already exist under another name in Dennett or in people who think about
  model-free vs model-based learning? And where does it actually break—what would
  a creature have to do to land inbetween, and does my description of the dog smuggle
  in more than a valence readout?


  Also, honestly assess how confident you are in what you''ve said and single out
  the specific point you''re least sure of. And please write in American English.


