  Strawson''s Basic Argument: (1) To be truly morally responsible for what you do,
  you must be truly responsible for the way you are, at least in certain crucial mental
  respects. (2) But to be truly responsible for the way you are, you must have chosen
  to be that way. (3) But you can''t choose to be the way you are unless you already
  are a certain way (with certain desires, values, etc.), which in turn requires being
  responsible for being that way... infinite regress. Hence no one is truly morally
  responsible. Women''s important corollary: the practice of blaming and praising
  people, not just for acts but for their character, presupposes self-creation.


