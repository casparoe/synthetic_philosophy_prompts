  common knowledge that a trade is Pareto-improving, then no trade occurs when the
  only motive is differences in information — because a counterparty''s willingness
  to trade conveys information. This underpins efficient market logic: trades should
  not occur purely on information differences because each side should update on the
  other''s willingness. But real markets show heavy trading volume — a puzzle. Hayek
  says prices coordinate dispersed knowledge without anyone needing to know everything.
  The prompt can ask to analyze a real episode, e.g., the 2008 housing bubble/crisis,
  through no-trade and Hayek. This is "in the weeds" and meaningful.


