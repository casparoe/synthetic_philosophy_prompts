  Quantum suicide thought experiment: In the many-worlds interpretation of quantum
  mechanics, consider a machine (like Schrödinger''s cat apparatus) where a quantum
  event, e.g., the spin of a particle measured, determines whether a lethal mechanism
  fires. If the spin is up, the gun fires and kills the experimenter; if down, it
  doesn''t. The apparatus is arranged such that the trigger only fires on one outcome.
  After the measurement, the universe branches into one where the experimenter dies
  and one where he lives. The dead versions observe nothing. The surviving versions,
  looking back, see that they survived. If the experimenter repeats the experiment
  many times (or uses a series of triggers), the probability of surviving all runs
  by chance becomes arbitrarily small, yet in the many-worlds picture there will always
  be a branch in which the experimenter survives every single time. From the first-person
  perspective of the experimenter (who can only observe branches where he lives),
  it would appear that he is immortal / that he always observes the low-probability
  event of survival. This is used either to illustrate the Everett interpretation
  or as an argument: a believer in many-worlds should expect quantum immortality;
  some use it as evidence for/against many-worlds.


  There are subtleties: What about branches where the experimenter is injured but
  not killed, or where the probability of survival is zero? Actually if the event
  has zero amplitude, no branch. Quantum immortality requires a nonzero amplitude
  of survival each time; small but nonzero branches. Also the "measure" problem: Everettian
  probabilities are not simply counts of branches; branch weights set by amplitudes.
  The experimenter''s rational expectations should track the Born rule weights, not
  branch counting. So even in Everettian picture, a rational agent shouldn''t expect
  to find themselves in the rare branch as if chosen by first-person logic. Also the
  thought experiment presupposes that personal identity goes with physical survival
  in the branch; after branching there are multiple descendants. The "quantum suicide"
  is not a serious practical experiment ethically but a thought experiment. The term
  "quantum immortality" sometimes attributed to the idea that in some universe you
  are immortal.


