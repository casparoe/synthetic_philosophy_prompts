  workspace theories say a state becomes conscious when it is entered into a limited-capacity
  workspace and broadcast to many specialized consumer systems; an animal is conscious
  to the extent that its nervous system has something like that broadcast stage —
  an attention bottleneck through which selected representations are shared across
  otherwise independent modules. (2) Integrated information theories say consciousness
  is not a wiring diagram but a quantity: the integrated information (usually written
  Φ) a system generates, which is high when the whole has information that cannot
  be decomposed into its parts. On this view consciousness is graded and wide, because
  any system with nonzero Φ has at least a trace of experience, and line-drawing becomes
  threshold-setting. (3) Higher-order theories say a state is conscious only when
  the organism represents itself as being in that state — a second-order monitoring
  relation or self-model, not merely first-order processing.


