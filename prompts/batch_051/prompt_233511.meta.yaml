  Potential prompt:


  "For a philosophy of art seminar on creativity, write a decision tree that sorts
  views on whether there is a genuine difference between creative variation and merely
  derivative copying. Take as the anchoring idea Douglas Hofstadter''s knob-twiddling
  picture: that a great deal of what we call creativity can be described as turning
  the parameters—tempo, line, palette, plot structure, perspective, word order, and
  the like—of an existing style or pattern, and that the interesting question is whether
  creativity is anything over and above choosing which knobs to turn and how far.
  Do not treat the tree as an exercise in Hofstadter exegesis; use the picture only
  to frame the debate.


  Build the tree from the logical space of answers to the following four questions,
  each asked through the concrete cases below, rather than from a list of labels:

  1. Is the difference between a creative work and a routine genre piece one of kind
  or only of degree within a parameter space?

  2. Can a process with no intention to vary anything—a generative model, a happy
  accident, a child''s scribble—produce a creative work if the result is valued?

  3. Is the creative status of a work fixed by its internal features, or partly by
  facts about its making, such as which parameters the maker deliberately altered
  and why?

  4. Is uptake by an audience, field, or later tradition ever constitutive of creativity,
  or is it only evidence for it?


  Use these cases as the sorting material (you may add one or two of your own):

  (a) an improvising musician who varies a standard''s phrasing, harmony, and tempo
  in ways an expert recognises as distinctive;

  (b) a student who pastiches an author so perfectly that no parameter departs from
  the author''s range;

  (c) a generative model that samples a plausible sonnet from a corpus, selected from
