  or to keep what she has. Since the item offered is one she strictly prefers to the
  item she holds, accepting each offer is what her preferences require.


  (4) A rational agent''s preferences determine what she is required to choose in
  any pairwise choice: if she strictly prefers x to y, she is rationally required
  to choose x over y when facing just x vs y.


  (5) Therefore, at each of the three points, this agent is rationally required to
  accept the offered exchange.


  (6) But if she accepts all three, she ends with C minus 3ε, an outcome she strictly
  disprefers to simply keeping C; and she knew this from the start.


  (7) A rational agent cannot be rationally required to take a sequence of actions
