  I recently reread Flowers for Algernon, and it kept pulling me back to a distinction
  I have seen people draw between therapy and enhancement. The rough idea is that
  medicine is on solid ground when it repairs a defect or restores someone to normal
  functioning, but becomes morally uneasy when it pushes an already healthy person
