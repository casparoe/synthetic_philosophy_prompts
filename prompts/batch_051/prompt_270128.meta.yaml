  Key ideas in procreative beneficence (Savulescu):

  - Principle of Procreative Beneficence (PB): couples (or single reproducers) should
  select the child, of the possible children they could have, who is expected to have
  the best life, or at least as good a life as the others, based on relevant available
  information.

  - Savulescu argues from a parity/consistency argument: we accept obligations to
  treat and prevent disease in existing children, and to select embryos without genetic
  disorders when doing IVF/PGD; consistency extends to selecting for non-disease traits
  that affect well-being.

  - It''s about selection among possible children you could have, not about creating
  the best possible child or enhancing a specific child.

  - It''s impersonal/non-identity aware: "possible people" have no right to exist,
  but it''s a principle of reasons.

  - It''s not coercive eugenics; it''s about individual reproductive decisions, liberal
  framework, not state coercion. Savulescu is a liberal; he argues obligations are
  moral, not legal.

  - Liberal eugenics (Agar, etc.) is distinct: a broader defense of genetic enhancement
  within liberal constraints, state neutrality, reproductive freedom. Savulescu''s
  PB is one version but with a controversial "obligation" claim stronger than mere
  permission.


  Common misrepresentations:

  - Conflating PB with eugenics in the coercive, state-directed, old eugenics sense.

  - Overstating: "parents are morally required to select the smartest, healthiest
  embryo possible" — PB says best expected life, based on available info; not maximizing
  one trait; also not necessarily "the best possible child."

  - Presenting standard objection as refutation: e.g., "This leads to Nazi-style eugenics"
  (slippery slope). Or "But PB says disabled people''s lives are less worth living,
  so it''s refuted" — actually PB doesn''t imply that; it implies if a possible child
  would have a worse expected life, there''s a reason to select otherwise, but doesn''t
  judge existing disabled people or say their lives not worth living.

  - Conflating "should" as moral reason vs legal obligation: "Savulescu thinks the
  state should force IVF and embryo selection" — he doesn''t.

  - "Playing God" objection.

  - Definite conflation of PB with eugenics generally.


