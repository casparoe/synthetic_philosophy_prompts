  Knobe effect background:

  - Original vignette: chairman of a company decides whether to start a new program.
  In one condition, it will make a lot of money but also harm the environment; in
  the other, make money and help the environment. Chairman says: "I don''t care at
  all about harming/helping the environment. I just want to make as much money as
  I can. Let''s start the program." Then asked: Did he intentionally harm/help the
  environment?

  - Result: 82% say yes for harm; 77% say no for help.

  - So the (moral) badness of a foreseen side effect increases, and goodness decreases,
  intentionality ratings. People are more willing to say a side effect was brought
  about intentionally when it''s morally bad than when it''s morally good.


  Common glosses/errors:

  1. "Knobe showed that people believe the chairman did it on purpose in the harm
  case and by accident in the help case." "On purpose" is roughly intentional; "by
  accident" is wrong — the chairman foresaw both effects; nobody thinks the help was
  accidental. This is a subtle howler-ish conflation of "not intentional" with "accidental."

  2. "The only difference between the cases is the moral valence of the effect, since
  the chairman''s deliberation is word-for-word identical." But the effect descriptions
  differ (harm vs help), and some critics (Machery, Guglielmo & Malle) argue the cases
  differ in how much the agent''s attitude reveals (e.g., "not caring about harming"
  shows a bad attitude; "not caring about helping" is neutral), so intention ratings
  track that rather than morality per se.

  3. "Therefore people''s moral judgments warp their factual judgments about what
  happened." Overstatement; the effect is about intentionality, which has a normative
  component, not a purely factual category; Knobe''s claim is that moral considerations
  shape folk concepts.

  4. "Knobe concluded that blame makes people see actions as intentional." But Knobe
  doesn''t reduce it to blame; subsequent work suggests badness, not blame, drives
  it; also the asymmetry appears with "advocating" and other positive/negative attitudes;
  and there are cases (e.g., a CEO who is forced to choose between harming and harming
  worse) where blame attribution and intentionality dissociate.


