  ---


  Design a 90-minute classroom activity for an upper-level undergraduate seminar in
  bioethics and health policy (16 students) that makes participants feel, before it
  is named, why the choice of a maximizing rule in allocating scarce medical resources
  — expected lives saved, expected life-years saved, or expected quality-adjusted
  life-years saved — is a substantive moral choice rather than a technical one. The
  central idea should emerge from what the groups do: each group should be able to
  defend its allocation as the straightforward application of a reasonable rule, yet
  the groups'' selections should visibly clash, forcing the question of which rule
  was the right one to count as "saving the most."


  The activity should center on a scarce-resource decision with small teams as decision-making
  committees. Use a deck of 12–16 patient cards, each listing a patient ID, age, a
  one-line clinical situation, three actuarial values — expected additional life-years
  with the intervention, a health-related quality-of-life weight on a 0–1 scale, and
  probability of surviving to those additional years — and, on the back, three precomputed
  scores: survival probability alone (the "lives" score), probability times additional
  life-years (the "life-years" score), and probability times additional life-years
  times quality weight (the "QALYs" score). The deck should be constructed so the
  top-ranked patients genuinely diverge across the three scores. Include four anchor
  cards that guarantee one pivot: an older patient with the best survival probability
  but few remaining years, a young patient with a lower survival probability but many
  high-quality remaining years, another young patient whose survival or quality numbers
  differ slightly, and a middle-aged patient with more remaining years but a low quality
  weight. These anchors should ensure the lives rule favors the older patient, the
  life-years rule favors the young, and the QALY rule illustrates the distinctive
  effect of the quality weight. Adjust the remaining cards to sharpen or soften the
  contrasts as needed.


  Assign four committees of four students each. Committees 1–3 are each given one
  of the three maximands and may choose only by maximizing it; Committee 4 is told
  to decide by their own lights and to write down their reasoning. Each committee
  gets the same deck and must select the six patients who receive the single scarce
  intervention. In a second round, rotate the three maximands among Committees 1–3
  (and let Committee 4 revisit its choice after hearing the first-round reports),
  so that at least some groups see a rule different from their own reverse their earlier
  selection. Do not announce in advance that the rules will diverge; let the divergence
  arrive as a surprise during the side-by-side posting of selections.


  The deliverable should provide a timeline (roughly 90 minutes: setup, first-round
  deliberation, reporting, second round, and a debrief of at least 25 minutes). In
  the debrief, map specific posted choices to the structure of the idea: the lives
  rule treats each expected person as equal and tends to favor the highest survival
  probabilities; the life-years rule treats each expected year as equal and tends
  to favor the young with the longest remaining lifespan; the QALY rule treats each
  quality-adjusted expected year as equal and adds a further valuation that can deprioritize
  patients with disabilities. Then connect the observed divergence to the practical
  difference between a value-of-a-statistical-life logic (summing small survival chances)
  and a QALY-based cost-effectiveness logic (summing quality- and duration-weighted
  benefits), noting that both can be presented as "maximizing health" while selecting
  different patients or programs.


  Also specify what will predictably go wrong and how to handle it. In particular:
  some group will miscompute or misrank the scores, so pre-sort the deck and give
  the facilitator a master table; some group may refuse to use the QALY rule or may
  rebel against its implied ranking — the facilitator should not override the refusal
  but should keep it visible as evidence in the debrief, since that refusal is itself
  part of the phenomenon; and the divergence may fail to materialize unless the deck
  is test-run in advance with a small group. Finally, state candidly which feature
  of the underlying issue the activity cannot reproduce: it cannot recreate real mortality
  stakes, institutional pressure, legal liability, or grief; it treats probabilities,
  life expectancies, and quality weights as precise point values when in practice
  they are uncertain, time-discounted, and contested (including the disability critique
  of quality weights); and because the patients are identifiable cards rather than
  statistical lives, the activity cannot on its own reproduce the identified-versus-statistical-lives
  asymmetry, which the facilitator must supply explicitly.


