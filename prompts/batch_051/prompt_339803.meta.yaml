  Potential prompt:


  In A Treatise on Probability, Keynes distinguishes between probabilities that can
  be placed on a single cardinal scale and cases where our evidence permits only an
  ordinal ranking, or no comparison at all. He argues that it is sometimes rational
  to hold a non-numerical probability: one may know that one hypothesis is more probable
  than another on the evidence without there being any definite number that measures
  the difference, and rational decision-making can proceed in the absence of precise
  numerical credences.


  Consider the following development. Since the 1980s, philosophers and statisticians
  have built formal models of "imprecise probability": sets of probability functions,
  interval-valued probabilities, Dempster-Shafer belief functions, and related structures,
  which represent the doxastic state as a family of admissible precise probabilities
  rather than a single one. Some Bayesians have replied that rational agents need
  only have a single, exact credence function, even if they cannot introspect it;
  the imprecision, they say, is a fact about the agent''s lack of self-knowledge,
  not about the attitude itself.


  Does Keynes''s argument survive this formal development and the Bayesian reply?
  Identify exactly which premise of the Keynesian argument is challenged by the precise-credence
  norm, and whether it can be defended in the imprecise-probability framework. Then
  say whether the original point—that some uncertainty is genuinely non-numerical—survives,
  needs repair, or is dissolved.


