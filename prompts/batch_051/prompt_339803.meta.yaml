  Final text:


  In A Treatise on Probability (1921), J. M. Keynes argues that not all probabilities
  are numerical; some evidential relations are merely comparative or even non-comparable.
  He claims that a rational person may know that one proposition is more probable
  on the evidence than another without there being any definite number representing
  how much more probable it is, and that this does not convict the person of irrationality.


