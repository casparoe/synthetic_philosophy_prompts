  Let me test my knowledge on each.


  Frege changes: Aristotle''s syllogistic deals with categorical propositions (All
  S are P), single subject-predicate. Frege (Begriffsschrift, 1879) introduced quantification,
  variables, functions and arguments, multiple generality (nested quantifiers), relations
  rather than monadic predicates, identity, and a logic that can express "Every boy
  loves some girl" in a way syllogistic struggles with. The key change: subject-predicate
  to function-argument; proposition as function application; quantifiers bind variables;
  judgment stroke. Tarski, etc. Modern logic is polyadic predicate logic with quantifiers.


