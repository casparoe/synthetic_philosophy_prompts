  Draft:


  "Consider Hofstadter''s Platonia dilemma: twenty people are each invited to send
  a telegram to claim a billion dollars; exactly one reply wins, two or more replies
  mean no one wins, and zero replies mean no one wins. Hofstadter''s superrational
