  problem, will hit on the same strategy. In the original dilemma, the obvious symmetric
  pure strategies are ''all send'' or ''all refrain,'' so superrationality seems to
  leave everyone with nothing—but the argument changes if mixed strategies are allowed,
  since a common randomized policy could give some positive expected payoff. Now alter
  the setup: the offer is made not to twenty selected participants but to an arbitrary
  large number N, and each participant''s message is not guaranteed to arrive; there
  is a small independent probability p that a sent message is lost, and participants
  know this but do not observe which sent messages arrive. Does Hofstadter''s superrational
  argument survive this change? More specifically: what, if anything, does superrationality
  now prescribe as a function of N and p, does the new prescription avoid the ''nobody
  wins'' trap better than in the original, and is the underlying premise—that equally
  rational players will coordinate on the same answer—strengthened or weakened by
  the introduction of observable-independent breakdowns? Answer as if you were reconstructing
  the argument from first principles, not reporting a consensus."


