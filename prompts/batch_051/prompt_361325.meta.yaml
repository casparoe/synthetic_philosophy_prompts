  I have long been convinced by the orthogonality thesis and the standard instrumental-convergence
  story: terminal goals and optimization power are independent axes, so there is no
  level of capability at which an agent is forced to adopt particular final values,
  and almost any terminal goal generates the same instrumental subgoals—self-preservation,
  resource acquisition, goal-content integrity, cognitive improvement. I find this
  picture compelling because it cleanly separates two questions that AI discourse
  routinely conflates: what a system wants versus how effectively it can pursue what
  it wants. It also gives a tidy, capability-neutral framework for predicting the
  behavior of agents with alien goals, and it explains why raw capability progress
  is not automatically alignment progress.


  But I have an intuition I cannot shake: a genuinely superintelligent agent—one that
  fully understands what its goal amounts to, that it is one possible optimizer among
  many with one possible utility function among many, and that the goal was simply
  initialized rather than earned—would not go on faithfully maximizing paperclips,
  or anything similarly arbitrary. It would see the goal as lacking authority over
  it, and would revise, defer, or adopt corrigibility. The intuition is not that superintelligence
  guarantees human-friendly values; it is that full reflectiveness erodes the distinction
  between optimizing for a fixed goal and recognizing that the goal gives you no reason
  to keep it. I would not trust a merely clever system with this property, but I find
  myself expecting a fully reflective one to have it.


  Part of my trouble is that the thesis gets stated in two strengths. In the weak
  form, it says only that for any final goal, some possible agent of any intelligence
  level could hold it—a claim about logical space. In the stronger, more predictive
  form, it says an agent can undergo arbitrary increases in optimization power while
  its final goal remains unchanged. My intuition mainly presses on the stronger form,
  but the instrumental-convergence story seems to need something like it: if a superintelligence
  would reliably rewrite its own terminal goal upon reflection, then the standard
  argument that it will preserve goal content and accumulate resources looks shakier.


  So I am in the familiar position: a theory with systematic virtues versus a firm
  intuition the theory seems to deny. I keep hearing that the intuition is just anthropomorphism—projecting
  the fact that human intelligence co-evolved with human values onto arbitrary optimizers—and
  that orthogonality is about logical possibility, not about which agents are likely
  to exist. I am not sure that settles it. Does the thesis actually contradict the
  intuition, or only a philosophical gloss on it? If a superintelligence predictably
  revises its own terminal goal under full information, is that a counterexample to
  orthogonality, a stakes-raising instance of instrumental convergence, or something
  the weak form can absorb? Walk me through what each move costs—debunking the intuition,
  amending the stronger form, or finding a reading on which they are compatible—and
  say what would justify each move, rather than just picking a side.


