  story: terminal goals and optimization power are independent axes, so there is no
  level of capability at which an agent is forced to adopt particular final values,
  and almost any terminal goal generates the same instrumental subgoals—self-preservation,
  resource acquisition, goal-content integrity, cognitive improvement. I find this
  picture compelling because it cleanly separates two questions that ordinary discourse
  about AI keeps conflating: what a system wants versus how effectively it can pursue
  what it wants. It also gives a tidy, capability-neutral way to reason about agents
  whose goals are alien.


