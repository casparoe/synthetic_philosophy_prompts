  I have been teaching the semantics of proper names for years, and I find myself
  torn between a theory I admire and an intuition I cannot shake. The theory is Millianism,
  or direct reference. A proper name''s semantic contribution is exhausted by its
  bearer: no descriptive content, no Fregean sense, no way of thinking. The attraction
  is systematic. The theory is economical, uniform, and gets the central cases right,
  including the substitutability of co-referring names and the distinctness of "Hesperus"
  and "Phosphorus" as names for one planet.


  But I also have a firm intuition that sentences containing the empty name "Sherlock
  Holmes" can be perfectly meaningful, and that some are true or false. "Sherlock
  Holmes is a detective" is true, in the way claims made within fiction are true;
  "Sherlock Holmes was a dentist" is false; and, most awkwardly for the Millian, "Sherlock
  Holmes does not exist" seems not to be a gappy failure to express a proposition
  but a plain truth. If the meaning of a name is simply its bearer, an empty name
  should contribute nothing, and the sentence should be semantically incomplete rather
  than true. Yet that is very far from how these sentences strike me.


  I do not simply want a verdict on which side wins. I want a negotiated verdict.
  Present each side at its strongest, then work through what it would take for the
  intuition to be the thing that gives way, what it would take for the theory to be
  the thing that gives way, and whether there is a reading on which both survive.


