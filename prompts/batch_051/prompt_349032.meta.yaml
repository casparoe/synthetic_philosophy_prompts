  The Millian theory and empty names: The core tension has a few precise sub-problems:


  1. Negative existentials: "Holmes does not exist" appears true. On Millianism, if
  ''Holmes'' is empty, the proposition is incomplete/gappy; the sentence would be
  neither true nor false or untrue. If the sentence is true, then either ''Holmes''
  refers to something (contradiction: what does it refer to? An abstract object, maybe;
  but then "does not exist" says of that object it doesn''t exist — but it does exist
  as an abstract object? Need to disambiguate existence) or ''exists'' means something
  else.


  2. Truth in fiction: "In the stories, Holmes is a detective" is true. Millian could
  treat the sentential operator ''in the stories'' as intensional, not requiring the
  embedded name to refer? But embedded "Holmes is a detective" still lacks a proposition
  under Millianism, so operator has nothing to operate on. Unless the operator supplies
  a pretense or story-context.


  3. The simple intuition: Meaningful empty-name discourse is semantically significant;
  two empty names can differ in cognitive significance ("Holmes" vs. "Watson" vs.
  "Pegasus"). Millianism says all empty names are semantically equivalent (contribute
  nothing); but we can know "Holmes is a detective" is true and "Pegasus is a detective"
  is false (in fiction). So the theory lacks resources to explain these differences.
  This is a real cost.


  Strategies:


  - Debunk the intuition: The meaningfulness is pragmatic. Sentences with empty names
  do not literally express propositions; speakers use them to convey pretended propositions,
  metafictional propositions about the stories, or metalinguistic propositions about
  the name. The feeling of literal truth is a projection; "Holmes does not exist"
  is semantically untrue but pragmatically conveys a true proposition about the name
  lacking a referent (e.g., ''Holmes'' is empty). This preserves the simple theory
  but must explain why the illusion is so robust and why truth-in-fiction claims seem
  objective. Justification: the theory''s economy and semantic success outweighs;
  also there are independent cases where intuitive truth shifts with context/pragmatics.


  - Amend the theory: adopt abstract artefacts as referents (artifactualism). Then
  "Holmes" refers to an abstract entity created by Conan Doyle; "Holmes is a detective"
  can be true only in a special "story-predication" sense, because the abstract object
  isn''t a detective literally. Need a mode of predication. Or adopt sense-like descriptive
  content for empty names (neo-Fregean), so "Holmes" has a sense though no referent.
  Justification: intuitions are data too; preserving them at manageable cost is what
  theory construction requires, but the amendment must not lose the advantages in
  ordinary cases.


  - Reconcile/separate: Truth in fiction as a game of make-believe/pretence (Walton):
  "In the stories, Holmes is a detective" is not a claim about Holmes but about what
  the stories mandate us to imagine. Base-level Millian semantics can stay; the fiction
  operator shifts to a pretence. Then "both survive": the theory is correct for genuine
  reference-involving uses; the intuition is preserved but relocated — the intuitive
  truth is truth-in-fiction, not literal semantic truth. For negative existentials,
  though, we need a distinct story: "Holmes does not exist" is true in the actual
