  summary of what''s happening to people; it''s partly a summary of where people happen
  to live. That seems to me to undercut the idea that there''s a single ''state of
  the world'' being tracked.


  5. Time window. Starting the clock in 1945, 1500, or 10,000 BCE changes the sign
  of the trend. That choice is usually made by the question you care about, not by
