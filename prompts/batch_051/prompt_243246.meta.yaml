  The working thesis is: the question ''is the world becoming less violent?'' doesn''t
  have a determinate answer as usually asked, because it''s really a family of questions,
  and the choices that pick out one member of the family are partly normative or interest-relative.
  Here''s my notes.


  1. What counts as violence. The headline claims usually count direct physical violence—homicides,
  war deaths, maybe state killings. But there''s a whole literature (and ordinary
  usage) that also calls structural violence ''violence'': deaths from preventable
  poverty, environmental degradation, neglect. Whether that''s literally violence
  or a metaphor is a conceptual question, not an empirical one, so the answer to the
  trend question flips depending on how you come down on it.


  2. Weighting. Even within direct violence, you have to aggregate war deaths, homicides,
  genocide, domestic violence, etc. into one number or one graph. Each type has a
  different trend. There''s no empirical procedure that tells you how to weight a
  death by drone strike against a death by intimate partner. So the ''world trend''
  is partly an artifact of the weights.


  3. Per capita vs absolute. If population doubles and violent deaths go up 50%, the
  per-capita risk falls but the total number of violent deaths rises. Which is ''the
  world becoming less violent''? Both, in different senses. The per-capita number
  answers ''how likely is an arbitrary person to die violently?''; the absolute number
  answers ''how much violence is there, in total?'' I don''t see a fact of the matter
  about which question is the real one.


  4. Aggregation weirdness. Here''s the part I''d most like a check on. I think you
  can get something like Simpson''s paradox: global per-capita violence could fall
  even if every region''s per-capita rate rises, if population shifts toward lower-violence
