  But the tribunal held they were responsible because they had a "moral choice" in
  fact. The Frankfurt lens: even if we grant (counterfactually) that the state would
  have coerced them had they balked, that doesn''t by itself show they didn''t act
  on their own; the question is whether the actual sequence involved their own intentions
  and identification. A Frankfurt-style intervener (the state as standing ready to
  force compliance) may actually make the defense *worse* for them: in Frankfurt cases,
  the presence of a would-be intervener is precisely what makes it true that the agent
  "couldn''t have done otherwise," yet we still hold him responsible. So the superior-orders
  defense, far from being supported by "I had no choice," might be undermined if we
  model the regime as a Frankfurt-style intervener — because the defendant''s actual
  choice still matters. But there''s a disanalogy: in Frankfurt cases the agent isn''t
  aware of/doesn''t act because of the intervener; in totalitarian systems, the threat
  is the agent''s very reason for acting (they act *from* fear), which is closer to
  ordinary coercion/duress, not Frankfurt''s intervener. So the mapping breaks there:
  coercion by a threat is not the same as a counterfactual intervener; duress cancels
