  Final text:


  In The World as Will and Representation, Schopenhauer defends the claim that all
  pleasure and satisfaction are in themselves negative—nothing but the release or
  absence of pain—while pain alone is a positive datum of experience. Ordinary moral
  thinking seems committed to the opposite asymmetry. We treat pain and pleasure as
  commensurable magnitudes of opposite sign: a headache is a negative entry, a pleasant
  afternoon is a positive entry, and enough of the second can cancel the first. We
  also usually judge that causing a pain is worse than failing to produce an equally
  intense pleasure, even though the two acts would yield the same net balance on the
  ordinary ledger. Take Schopenhauer''s claim seriously. Is there a principled justification
  for the ordinary practice of treating pleasure as a positive benefit that can offset
  pain, or is that practice simply the refusal to believe his thesis? Give the strongest
  defense of the ordinary asymmetry you can, then say whether it survives, and whether
  a thinker who accepted Schopenhauer''s account could coherently compare lives of
  different pain-to-pleasure ratios at all.


