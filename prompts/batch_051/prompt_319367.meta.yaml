  Phenomenon: In moral debates, "What if everyone did that?" is used as a decisive
  test, but the phrase masks (at least) three distinct tests:

  1. Outcome test: If everyone (or many people) did it, bad consequences result (lawn
  destroyed, tax base eroded, streets blocked).

  2. Feasibility/success test: The act''s very success depends on most people not
  doing it (going alone to a quiet beach; using insider tips; dodging the draft).
  Universal performance makes the act impossible or worthless.

  3. Consistency/willing test: I couldn''t will a world where everyone acted on my
  maxim, even if the outcome were fine or the act were still feasible (lying: if everyone
  lied, trust collapses — but that''s outcome; perhaps breaking a promise: if everyone
  broke promises, promising would be meaningless, so contradiction).


