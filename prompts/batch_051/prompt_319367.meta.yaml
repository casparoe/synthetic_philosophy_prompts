  ---


  Last night I had a long, heated argument with a friend about whether it is wrong
  to stay home from voting in an election whose outcome is already settled. His central
  move was some version of the question, "What if everyone did that?" At first he
  seemed to mean something about consequences: if everyone stayed home on the same
  reasoning, participation would hollow out and democracy would erode. When I answered
  that my staying home does not cause everyone else to stay home, he switched to a
  different complaint — that I would be making myself an exception to a rule I need
  other people to follow. When I asked why I must want others to follow that rule,
  he answered by describing, again, the bad outcomes if they did not. The same four
  words seemed to be carrying both arguments, and he slid from one to the other whenever
  the first ran into trouble.


  I have since noticed the double life of this phrase elsewhere. A neighbor justifies
  watering his lawn during a restriction by saying one person''s sprinklers will not
  make a difference; another neighbor replies that if everyone judged their own contribution
  negligible, the reservoir would run dry. In that case, the appeal is to cumulative
  harm, and the act would still make sense even if everyone performed it. But take
  a different example: a colleague says it is wrong to pad the experience on a résumé,
  and when I object that a handful of padded résumés will not collapse the job market,
  she shifts to a different point — I would be relying on employers'' trust in résumés
  while quietly making my own untrustworthy, and if everyone in my position did the
  same, the practice of evaluating résumés would lose its point. That no longer sounds
  like cumulative harm; it sounds like the act would undercut its own preconditions.


  The phrase "what if everyone did that?" therefore seems to run together at least
  two distinct tests — one that asks what would happen if the act were performed across
  a population, and another that asks whether I can coherently make my act a rule
  for others like me while counting on the background practice my act undermines.
  I am trying to find the established vocabulary for this distinction and for the
  move of passing from one test to the other mid-argument. Does each test have a recognized
  name, where exactly is the boundary between them — are there cases where everyone''s
  doing the act leaves the act intact but is still ruled out, and cases where the
  act''s very intelligibility collapses — and is there a standard term for quietly
  substituting one for the other? If no standard term exists for the substitution,
  I would be glad to hear a proposal, so long as it is defined sharply enough to distinguish
  the move from ordinary equivocation, moving the goalposts, and shifting between
  act-level and rule-level reasoning.


