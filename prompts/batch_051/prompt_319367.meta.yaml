  "What if everyone did that?" logic:

  - Kant: act only on that maxim through which you can at the same time will that
  it become universal law. Two tests: contradiction in conception (lying promise,
  false promise: concept of promise impossible if everyone makes false promises);
  contradiction in willing (not developing talents, not helping others: you can conceive
  of a world but can''t will it because you''d be a being that needs help?).

