  Berkeley''s master argument: In Three Dialogues, Philonous asks Hylas to conceive
  any sensible object existing independent of all minds. He argues you can''t: in
  conceiving it, the object is in your mind. The argument charges that "the object
  of thought" is necessarily conceived, hence perception-dependent. Standard criticism:
  the argument confuses the content of a thought with what the thought is about; a
  thought can be about an object that is not itself a mental content. I.e., it commits
  a representational/act-object confusion, or Russell''s point: "I am acquainted with
  my sense-data" doesn''t show they aren''t objects. Could ask: Is the reduction valid?


  Borges''s "Tlön, Uqbar, Orbis Tertius": The story describes a fictional planet Tlön
  where classical idealism is the common sense: the world is not a concurrence of
  objects in space but a heterogeneous series of independent acts; one school denies
  time; another says "the visible universe was an illusion or a sophism"; objects
  are composed in terms of mental processes; the concept "moon" is "a round light
  that moves through the sky"; "things are duplicated" (hrönir) — lost objects are
  reduplicated by expectation/forgetting. Reality gives way. The narrator notes that
  "contact with Tlön, the habit of Tlön, has disintegrated this world" and that he
  doesn''t care; "the world will be Tlön." At the end, a postscript: the narrator,
