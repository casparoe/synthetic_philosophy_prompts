  vocabulary for this, but I have a very precise vocabulary for something nearby.
  My next book turns on a deathbed promise: a man promises his dying friend something,
  the friend dies, and thirty years later the promise comes due when there''s nobody
  left alive who knew about it. In thinking about why he should keep it, I''ve been
  reading around in the question of why promises bind, and I''ve half-understood a
  few positions: one about promises as a social convention or practice that it''s
  useful to uphold, one about how promising creates an obligation by giving someone
  else an assurance they rely on, one about how breaking a promise is a way of using
  or betraying another person''s trust, and one that makes it about integrity, about
  being the kind of person whose word means something. What I actually think with,
  though, is the craft vocabulary of fiction: setup and payoff, Chekhov''s gun, foreshadowing,
  narrative debt, closure, the unspoken contract with the reader, abandoned subplots,
  backstory, motivation, stakes. I''m fluent in that and I''d rather not pretend to
  be fluent in the other.


