  The background, quickly: one of the classic moves in arguing that some core of the
  Exodus tradition goes back to real events is what people call the criterion of embarrassment.
  The idea is that when a community preserves and transmits a story that makes itself
  look bad — here, Israel as slaves in Egypt, as rebels, as a people who keep messing
  up — that''s a reason to think the story wasn''t simply invented, because nobody
  fabricates traditions that undermine their own prestige or flatter their enemies.
  So the embarrassing material gets read as a trace of genuine memory rather than
  later ideological construction.


