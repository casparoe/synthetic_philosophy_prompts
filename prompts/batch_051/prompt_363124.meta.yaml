  Domain 4 + Type C: the false presupposition is natural. Let me develop that more.
  The paradox of deontology: deontological constraints forbid certain actions even
  when violating them would prevent more violations of the same kind. The standard
  framing (Nozick, Scheffler): if a right matters because of the underlying interest
  it protects, then why not minimize violations of that interest? This is the "paradox
  of deontology": constraints seem irrational by the consequentialist reasoning that
  motivates them, unless we accept agent-relativity as brute. A common misconception:
  the paradox shows deontologists are somehow selfish or care about their own purity;
  or that it shows deontology is internally inconsistent (which it isn''t — it shows
  a tension in a particular way of grounding constraints).


