  Let me write:


  "In my property/IP philosophy seminar we''ve been going in circles on orphan works
  and abandonware, and there''s an asymmetry I can''t stop thinking about. Suppose
  a person dies with no will and no reachable relatives; their house, their car, their
  bank account all get sorted out somehow — the state takes them, creditors get paid,
  the house gets sold, and after some years of open possession a stranger can even
  get title. Same if someone just walks away from a patch of land and never comes
  back: eventually it ends up in someone else''s hands because nobody likes assets
  sitting dead. But if the same person leaves behind a published novel, or a piece
  of software, or their letters, and the rights end up with heirs who can''t be found
  (or the company that made the app folded), the work isn''t ''escheated'' or reassigned
  to anyone. It just sits locked up: no one may republish the novel, translate it,
  patch the software, keep the server it runs on alive, or archive it, for decades
  after the author''s death, because there''s no one to ask for permission. We treat
  the house as a problem to be cleared and reallocated, but we treat the novel as
  a right that must be respected even when no human being is around to hold it.


  So here''s what I want to know: is there a defensible reason for this asymmetry?
  The justifications I can brainstorm (incentivizing authors, respecting the author''s
  intentions, moral rights, avoiding bad-faith squatters, avoiding courts guessing
  who''d deserve the copyright) all strike me as things that would equally justify
  doing *something* with the physical property too, or that protect no actual person
  in the orphaned-WORK case. Have I missed a principled difference, or is this just
  an inconsistency in how we feel about ideas vs. stuff? If it''s defensible, defend
  it against the close case: a self-published author dies and leaves a complete, edited
  manuscript plus version 3.0 of some freeware utility he maintained, and there are
  literally no traceable heirs or company successors. What should happen to them,
  and why does the reason not also apply to a house?


