  This contains misunderstanding. The Barcan formula (∀x□Fx → □∀xFx) doesn''t by itself
  entail everything exists necessarily; the converse Barcan formula (□∀xFx → ∀x□Fx)
  implies nothing new comes into existence. The formula that everything exists necessarily
  (□∀x□∃y(y=x)? or Necessitism) is a consequence of BF + something? Actually in constant
  domain semantics with BF, you get necessitism? Let''s recall. The Barcan formula:
  ∀x□φ → □∀xφ. In Kripke semantics with constant domains, BF is valid. BF is associated
  with anti-necessitism? Wait. Necessitism is the view that necessarily everything
  necessarily exists (or everything exists necessarily?). BF: if everything actual
  necessarily φ, then necessarily everything φ. Its converse CBF: □∀xφ → ∀x□φ. In
  increasing domains (new things can exist), BF fails; in decreasing domains (things
  can cease to exist), CBF fails. Neither directly says everything exists necessarily.
  The formula "Necessitism" is □∀x□∃y(y=x) or the claim that whatever there is necessarily
  exists. None of BF/CBF entail that plain; they are about the domains'' monotonicity.
  So the confusion: the Barcan formulas concern whether domains grow/shrink, not whether
  any particular object exists necessarily. And "everything exists necessarily" isn''t
  a theorem — rather BF is valid in constant-domain semantics; that''s a models/semantics
  choice, not a claim of logic simpliciter. A good answer would correct.


