  Robert began with the Makropulos case as Bernard Williams used it: a person who
  has lived for over three centuries, with her youth extended by an elixir, finds
  her life emptied of meaning and welcomes death. Robert took this to show that any
  life extended without limit, however pleasant, eventually succumbs to ennui, because
  human satisfactions depend on novelty, contrast, and striving. A heaven that removes
  all obstacles, he said, removes the conditions under which anything can matter.


  Elena answered that this inference slides from a finite creature''s exhaustion to
  a perfected one''s nonexhaustion. Boredom is a failure mode of finite attention
  and finite desires: it happens when a good is experienced too long by an organism
  built for scarcity. Eternal bliss, if it means anything, is not merely enormous
  duration; it is a different kind of relation to the good, perhaps not made of sequential
  episodes at all. An atemporal or self-present joy, she said, would have no ''too
  long.''


  Robert replied that this defense buys coherence by giving up continuity. If heaven
  is not experienced as a series of moments, then it is not obviously experienced
  as one''s own life continuing; and if the joy must be continuously self-renewing
  to escape satiation, then it is either incomprehensible or itself a kind of change
  that reintroduces time. Elana countered that composers—she noted a late Beethoven
  quartet—can be absorbed for durations that feel both full and outside clock time,
  and that this gives a faint model of joy that does not require scarcity.


  Robert retorted that even the most absorbing quartet ends, and its value depends
  partly on its being a bounded whole; a quartet extended forever would not be the
  same good, and a mind that never needed to come up for air would not be ours. Elena
  said this again takes our limits as normative. A perfected mind would not be exhausted
  by richness, and we are in no position to assert that no possible mind could find
  an unbounded good permanently absorbing without our specific finitude.


  At this point I confessed I could not referee. I ask you to go through the exchange
  and assess it move by move: identify which of Robert''s and Elena''s claims are
  strong or weak, state which of the two is more right overall, and say what assumptions
  about time, personal identity, and value the dispute is really turning on. I am
  especially interested in whether either debater is entitled to the partial concessions
  they seem to make."


