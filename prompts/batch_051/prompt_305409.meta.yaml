  Potential final text:


  "Here are the criteria I was taught for when an advance directive made by an earlier
  self should be honoured against the present wishes of the later self: (1) the earlier
  self made it voluntarily, with decision-making capacity, and with adequate information;
  (2) the intended conditions have arisen; (3) it has not been revoked, and the present
  wishes are not the expression of a stable and intelligible change of values that
  the later self would endorse over time; (4) following it does not require doing
  something that would be wrong for reasons independent of the directive. Now consider
  the following borderline case.


  Ankita, a 38-year-old who carries a mutation for early-onset Alzheimer''s disease,
  writes an advance directive. One part says she would refuse artificial nutrition
  if she were unable to recognise her family. Another part says she consents, in advance,
  to remain in a long-term observational study requiring quarterly lumbar punctures,
  even if she later objects, because the data may help her younger siblings make reproductive
  decisions. Seven years later she has moderate Alzheimer''s: she cannot follow an
  explanation of the study, no longer recognises her siblings, and is generally placid,
  but she becomes frightened and tries to push needles away. The feeding question
  has not arisen. The only live question is whether the researchers and her family
  must continue the lumbar punctures over her resistance, or withdraw her from the
  study.


