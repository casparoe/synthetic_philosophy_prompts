  Actually a classic tension in Hume: he denies that justice originates from a promise,
  yet he calls the rules of justice "laws of nature" but artificial. Another tension:
  he says conventions arise "insensibly" and "by degrees," without any promise or
  explicit agreement — so it''s a gradual, evolved norm, not a contract. Yet he also
  sometimes talks of the "convention" as if it were an agreement among the whole society
  to "bestow stability on the possession... by the consent of... society," e.g., "I
  observe, that it will be for my interest to leave another in the possession of his
  goods, provided he will act in the same manner with regard to me." There is a seeming
  tension between convention as a non-agreement emergent regularity and the simultaneous
  pursuit of self-interest.


