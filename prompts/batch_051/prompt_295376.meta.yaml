  Draft:


  "I''m writing a position paper for a philosophy elective on the ethics of loyalty
  and impartiality, and before I turn it in I want to check whether the view I''ve
  ended up with actually hangs together. I''ve assembled the following list of commitments
  from my notes, and I''d rather not discover in class that I''ve been defending a
  contradiction. Here is the package:


  (a) We have stronger obligations to our friends and family than to strangers. If
  I can use my evening either to help a friend in a genuine crisis or to volunteer
  somewhere that would help several people I don''t know, the friend''s claim on me
  is not cancelled by the greater number; there is a weight to the relationship itself.

  (b) The moral point of view is impartial. When I ask whether some arrangement, policy,
  or action is right, I should be able to justify it from a standpoint that counts
  everyone''s interests equally and that doesn''t smuggle in extra regard for me and
  mine just because they are mine.

  (c) I think (b) and (a) are not in conflict, because friendship itself demands partiality:
  a person who weighed my interests exactly equally with a stranger''s, with no special
  concern for me, would not be my friend, and I don''t think the ideal of friendship
  is a moral defect.

  (d) Loyalty to large-scale groups—nationality, race, a school clique, even a sports
  team—strikes me as bias rather than virtue. These are the kinds of loyalty people
  treat as duties, but the boundary that picks out the group is morally arbitrary
  in a way that a particular history of care is not.

  (e) Favoritism in institutional roles is wrong even when it comes from genuine love.
  A coach who gives their own child playing time over a better player, or a teacher
  who rounds up a friend''s child''s grade, isn''t being a good parent or friend;
  they''re corrupting the role.

  (f) I don''t want to just declare that there''s a difference between private life
  and institutional life and leave it there. I suspect that if I can''t give a principled
  story about why the same sort of favoring—letting who-you-love matter more than
  what''s fair—is a virtue in one setting and a vice in another, then one of these
  six commitments has to go.


