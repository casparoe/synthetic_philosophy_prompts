  ---


  Your task is to produce the joint statement that two rival theorists could both
  sign at the end of a good-faith adversarial collaboration on Moore''s paradox. One
  theorist holds that the absurdity of a sentence of the form *p, but I do not believe
  that p* is fundamentally a defect of assertion: the first conjunct expresses or
  commits the speaker to the belief reported absent by the second. The other holds
  that the absurdity is fundamentally a defect of the state of mind: a subject cannot
  rationally combine believing that p with believing that he or she does not believe
  that p, and the unassertability of the sentence is a symptom of this deeper doxastic
  incoherence.


  The collaboration''s point of departure is a passage in G. E. Moore''s essay A Reply
  to My Critics (1942) in which he asks us to consider a speaker who says of some
  past event—his own example concerns having gone to the pictures on a particular
  night—that the event happened while adding that he does not believe that it happened.
  Moore observes that something would be absurd in saying such a thing of oneself,
  although the two parts of the sentence could both be true. The passage is presented
  here in paraphrase; do not attribute any exact wording to Moore.


  The deliverable should have two parts. First, a numbered section of agreed claims,
  including at least: the logical status of the sentence and whether it is ever true;
  the asymmetry between the first-person present-tense case and third-person or past-tense
  versions; and whether a speaker uttering such a sentence is necessarily lying. Second,
  a disagreements table, with columns for the precise contested proposition (worded
  so that each side accepts the wording of its own view), the assertion-account position,
  the belief-account position, and the case or argument both sides agree would bear
  on the question.


  In the table, give particular attention to these cruxes: first, whether a fully
  competent speaker who makes a Moorean assertion exhibits a rational failing of belief
  management or merely violates a conversational norm; second, whether the absurdity
  survives in silent judgement as strongly as in speech, and what the asymmetry, if
  there is one, shows; third, whether the defect is best located in the speaker''s
