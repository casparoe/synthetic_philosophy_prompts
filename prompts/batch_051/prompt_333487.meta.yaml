  Moore''s paradox: sentences of form "P but I don''t believe P" are absurd to assert
  though they can be true. Explanations:


  - Assertion-based: asserting P expresses belief P; by asserting P speaker commits
  to believing P; adding "I don''t believe P" contradicts the commitment. Knowledge
  norm: assertion is proper only if speaker knows; knowing entails believing. So the
  assertion is pragmatically contradictory.


  - Belief-based: the absurdity arises because the second conjunct reports an absence
  of a mental state that is normally expressed by the first. On this view, the problem
  is about Moorean beliefs, not just assertions: thinking or judging "P but I don''t
  believe P" is also incoherent (Moore''s paradox applies to thought too).


  Camps:

  1. Assertion-based/commitment view: the paradox is fundamentally about the adequacy/commitment
  of assertion (Searle, Grice?). The sentence is absurd to assert but coherent to
  believe? Actually many hold it is also incoherent to believe in some cases.

  2. Belief self-knowledge / epistemic view: the absurdity is explained by constraints
  on self-knowledge or rationality of belief; one cannot rationally believe a conjunction
  P and I don''t believe P because believing P entails being in a position to know
  you believe P; or doxastic self-transparency.


