  The prompt:


  "Assume the role of a facilitator producing the joint statement that two theorists
  could both sign after an adversarial collaboration on Moore''s paradox. One theorist
  holds that the absurdity is fundamentally a defect of assertion: asserting that
  something is so expresses or commits the speaker to believing it, and the second
  conjunct then contradicts that commitment. The other holds that the absurdity is
  fundamentally a defect of the state of mind: a subject cannot rationally combine
  believing that something is so with believing that they do not believe it; the unassertability
  is a symptom of this deeper doxastic incoherence.


  Background text for the collaboration: G. E. Moore''s essay A Reply to My Critics
  (1942) contains a passage in which he invites the reader to consider a sentence
  of the form in which someone says of a past event—his example concerns having gone
  to the pictures on a particular night—that it happened while adding that he does
  not believe that it happened. Moore''s point is that there is something absurd in
  one''s saying such a thing of oneself, despite the fact that the two parts of the
  sentence could both be true. Do not rely on any formulation beyond this paraphrase.


  The deliverable should take the following form:


  1. Agreed claims, numbered, including: the logical status of the sentence (consistent,
  not contradictory); the asymmetry between first-person present-tense cases and other-person
  or past-tense cases; the fact that a speaker who utters the sentence is not necessarily
  lying; and any other claims both camps can sign without qualification.


  2. A disagreements table. For each row: the precise proposition over which they
  differ, phrased so that each side would accept the wording of its own view as stated
  in the cell; the assertion-account''s prediction or position; the belief-account''s
  prediction or position; and the type of case or argument both agree would bear on
  it.


  In drafting, separate verbal differences from genuine ones; do not allow either
  side to accept a formulation that is vacuous. Pay particular attention to these
  cruxes: first, whether a fully competent speaker who makes a Moorean assertion is
  exhibiting a rational failing of belief management or merely a pragmatic violation
  of conversational norms; second, whether the absurdity survives in silent judgement
  as strongly as in speech; third, whether the second person version (someone else
  saying of you, ''It is true, but you don''t believe it'') creates the same kind
  of defect for the speaker or a different one; fourth, whether the paradox commits
  us to any transparency or self-intimation thesis about belief."


