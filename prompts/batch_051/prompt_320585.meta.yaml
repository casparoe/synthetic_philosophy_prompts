  ---


  I''ve been in a long-running group-chat argument about whether we should support
  some kind of neural rights bill, and the whole thing keeps dissolving into people
  yelling past each other because no one has pinned down what "mental privacy" is
  protecting. Part of it is data (my EEG trace is personal data, full stop), part
  of it is about being read without consent, and part of it feels like it''s about
  the sanctity of my inner life even when I do consent to being read for a limited
  purpose. I want a working definition of mental privacy — the privacy prong of cognitive
  liberty, not the self-modification prong — that can actually classify cases. Here
  are the ones I keep coming back to:


  1. Police use a brain-based concealed-memory test on a suspect without a warrant,
  showing him crime-scene photos and looking for a recognition signal in his EEG.

  2. A hospital uses an EEG during surgery to track how deeply under anesthesia a
  patient is.

  3. A startup sells earbuds that infer your mood from your voice and microexpressions
  and serve ads on that basis.

  4. A neural-interface company streams raw neural data to the cloud and trains a
  model on it; users technically consented by checking a box in a long terms-of-service
