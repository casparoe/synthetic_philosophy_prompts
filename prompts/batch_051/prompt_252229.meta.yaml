  "I have been trying to articulate what makes reasoning about mutable state harder
  than reasoning about pure functions, and I want an assessment of the distinction
  I have ended up with.


  I call it the sameness split. In a purely functional setting there is, for most
  reasoning purposes, one notion of sameness: two expressions with the same value
  are interchangeable, and equational reasoning works by substituting equals for equals.
  Mutation splits this into two notions that can come apart. Token-sameness holds
  between two names when they designate the same object, so that an update through
  one name is visible through the other. Content-sameness holds between two objects
  when they currently have the same value. Mutation is the operation that characteristically
  preserves token-sameness while breaking content-sameness: if `x` and `y` name the
  same list, and one mutates the list by appending an element through `x`, then `x`
  and `y` still name the very same object, but the content now differs from the content
  that `y` had a moment ago. The classic difficulty of mutable state, I claim, is
  not fundamentally about time or concurrency or even aliasing as such; it is about
  this split. Our default style of reasoning presumes the two notions of sameness
  coincide, and mutation is the first circumstance that forces them apart.


