  sameness they try to restore. Value semantics and persistent data structures make
  token-sameness track content-sameness, so that equal values are interchangeable
  and the split collapses. Linear and uniqueness type systems do the opposite: they
  keep the split but restrict each object to at most one live name at a time, so that
  token-sameness can safely be treated as if it were content-sameness within a scope,
  because no other name can observe the divergence.


