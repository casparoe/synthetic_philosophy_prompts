  \ utility\" debate: ordinal vs cardinal, whether utility is just a representation\
  \ or has psychological content. LLMs know this.\n\nType 1: Ask whether a well-known\
  \ argument survives a specific new development/changed assumption. Could ask: \"\
  The revealed-preference argument that utility is nothing but a summary of choice\
