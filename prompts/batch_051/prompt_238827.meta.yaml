  \ survive [new development]?\" A \"new development\" could be: passive data / recommendation\
  \ systems / behavioral economics showing framing effects / default effects / the\
  \ existence of \"choiceless\" utility evidence (e.g., neuroscience measuring reward\
  \ signals when no choice is made, or stated preferences in surveys). Hmm, type 1\
  \ requires naming an argument and a development, asking whether argument still goes\
  \ through. The development should have \"real bite.\"\n\nPossible: The revealed-preference\
  \ argument for treating utility as a mere numerical summary of choice behavior (not\
  \ an inner quantity) was built on observing actual choices. Development: behavioral\
  \ economics shows choices are inconsistent/framing-dependent; or neuroeconomics\
  \ offers direct neural measures of reward/pain independent of choice; or algorithmic\
  \ choice (recommender systems making choices on our behalf) breaks the link between\
  \ preference and choice. \n\nActually the type 1 example: \"does the paperclip-maximizer\
  \ argument survive models trained on all of human text? does Mill's argument for\
  \ free speech survive recommender systems? does the tragedy of the commons survive\
  \ cheap monitoring?\" So development can be technological. For revealed preference:\
  \ \"Does the revealed-preference interpretation of utility survive a world where\
  \ many consequential 'choices' are made by recommender systems, autocomplete, defaults,\
  \ and auto-enrollment rather than by individuals deliberately selecting options?\"\
  \ That has bite: the theory ties utility to actual choice, but if the chooser is\
  \ replaced by a system or choice architecture, the revealed preference might reveal\
  \ the designer's preference/noise. Also behavioral economics: menu dependence, framing.\
  \ But the type wants a specific new development, not just the standard behavioral\
  \ critique (which is well known). Recommender systems is newer and has bite.\n\n\
  Alternatively, type: Revealed preference and the meaning of utility with type 1:\
  \ \"The revealed-preference argument says utility is not a hidden mental quantity\
