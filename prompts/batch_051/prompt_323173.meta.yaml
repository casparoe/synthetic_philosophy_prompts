  Let me think about what precise claims "Malthus was right, just early" could express:


  1. Literal ratios as empirical laws with wrong dating: population actually does
  grow exponentially and food linearly whenever institutional conditions allow, and
  the only reason it hasn''t is that the relevant "checks" have operated; the catastrophe
  is postponed, not cancelled. This is a substantive empirical claim, probably false
  as stated since agricultural productivity per capita and birth rates changed in
  ways not captured by fixed ratios.


  2. The tendency claim (soft Malthusianism): there is a genuine tendency for population
  to press against whatever resources are available at a given technology level; technology
  has repeatedly raised the ceiling, but the tendency is real and reasserts itself
  locally. This is fairly defensible, almost a near-truism of carrying capacity in
  other species, but contentious when applied to humans, given institutions and endogenous
  technology.


  3. The diminishing-returns/limits claim: indefinite exponential growth is impossible
  on a finite planet; eventually some resource or sink constraint binds. This is almost
  trivially true (there are finite physical limits) but the timing and mechanism are
  unspecified — it doesn''t rescue a specific theory, just a general finitude claim.


  4. The mechanism/equilibrium claim: Malthus was right about the mechanism — populations
  adjust to the level of subsistence through preventive and positive checks — but
  wrong about the parameters: the subsistence level is not fixed because technology
  is endogenous, and the checks in modern societies have been mainly preventive (fertility
  decline) rather than positive (mortality). This is a reinterpretation; it makes
  Malthus right only in a very general sense.


  5. The institutional/political claim: Malthus was right that poor relief that subsidizes
  population growth without increasing food production merely redistributes scarcity
  rather than ending it, and this remains true in some contexts — but as a general
  claim about all societies it fails.


  6. The falsification-rescue claim (meta): a long-run prediction cannot be declared
  false merely because it hasn''t come true yet if the theory itself specifies only
  eventual tendencies or ceteris paribus conditions; "right but early" is itself a
  claim about how to treat long-run predictions, equivalent to saying the theory is
  not yet tested, or has been rescued by auxiliary hypotheses (technology as an unrecognized
  variable). This reading is a methodological claim: either a legitimate postponement
  (if the theory has clear conditions) or an unfalsifiable retreat (if no evidence
  could ever count against it).


  7. The local/global claim: Malthus was right about pre-industrial economies but
  wrong about industrialized ones; he described a regime that holds when technology
  is stagnant, not a universal law. So "early" means he described a phase, not a false
  theory.


  8. The demographic-transition reading: Malthus''s preventive check took an unexpected
  form (deliberate fertility reduction with rising income, i.e., the demographic transition)
  rather than the forms he expected (moral restraint, vice, misery); so he was right
  that population growth is checked by human choices, but wrong about the mechanisms.


