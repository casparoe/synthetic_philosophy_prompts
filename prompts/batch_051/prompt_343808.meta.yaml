  will choose minimum capital and externalize tail risk onto victims; the cap functions
  as a liability ceiling.

  - Insurance: mandatory insurance may be unavailable or underpriced for tail risks;
  insurers may exclude autonomous behavior; insurance premium may itself be the real
  capital requirement and could lead to risk classification; or insurers become the
  de facto regulators.

