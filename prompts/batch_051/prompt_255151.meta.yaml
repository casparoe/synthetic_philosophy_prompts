  Final text:


  ---


  I run the weekly model-review meeting for a visual perception lab that compares
  computational models of how timing illusions arise, and I need a reusable procedure
  for classifying any model''s account of such an illusion as Orwellian, Stalinesque,
  or neither. The users are graduate students and postdocs who know the experimental
  paradigms well but have not read the philosophical literature on the timing of experience,
  so the procedure must be usable in about fifteen minutes from the model paper''s
  timing story and the stimulus/timing diagram alone, with no background reading.
  The stakes are moderate and recurring: each week we assign one model to a category
  in our shared model registry, these labels later make their way into literature
  reviews and grant narratives, and a misclassification that survives into a submitted
  manuscript is professionally embarrassing even though nothing safety-critical hangs
  on it. I make the final call, but I want the procedure to do the real sorting.


  Ground the procedure in the following distinction. An Orwellian account says the
  nervous system produces an initial conscious content that is then revised or overwritten
  before or as it is reported, so the subject never enjoys the uncorrected first version.
  A Stalinesque account says the content is held back and edited before it first enters
  consciousness, so the subject''s first conscious content is already the corrected
  version. A model that denies any single moment of entry into consciousness — for
  example, a Dennettian multiple-drafts model — should fall into a third bucket rather
  than being forced into one of the first two. The procedure should therefore test
