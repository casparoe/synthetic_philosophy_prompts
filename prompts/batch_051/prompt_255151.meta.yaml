  ---


  I run the weekly model-review meeting for a visual psychophysics lab that evaluates
  computational models of how illusions like apparent motion arise, and I need a reusable,
  runnable procedure for classifying any model''s account of a timing illusion as
  Orwellian, Stalinesque, or neither. The users are graduate students and postdocs
  who know the experimental paradigms cold but have never read the philosophical literature
  on the timing of experience, so the procedure must be usable in about fifteen minutes
  from the model paper''s timing story alone, without any background reading. The
  stakes are moderate and recurring: every week we assign one model to a category
  that goes into our shared model registry and later into literature reviews and grant
  narratives, and a misclassification that survives into a submitted manuscript is
  professionally embarrassing, though no one''s safety depends on the label. I make
  the final call, but I want the procedure to do the consistent work.


  Ground the procedure in the actual distinction as follows. An Orwellian account
  says the nervous system produces an initial conscious content that is then revised
  or overwritten before or as it is reported, so the subject never enjoys the uncorrected
  first version; a Stalinesque account says the content is held back and edited before
  it first enters consciousness, so the subject''s first conscious content is already
  the corrected version. A model that denies a single moment of entry into consciousness
  entirely should fall into a separate third bucket, not be forced into one of the
  first two. The procedure must therefore include, early on, a test for whether the
  model posits a discrete first presentation to awareness at all, before any test
  about when the revision happens.


  Write the procedure as an ordered checklist or decision flow that takes as input
  (a) a model''s account of one experimental paradigm and (b) the stimulus/timing
  diagram for that paradigm, and outputs exactly one of these labels with a one-line
  justification: Orwellian-revision, Stalinesque-delay, underdetermined-between-the-two,
  or no-single-entry. Include a short worksheet or set of questions the reviewer must
  answer about the model''s timing structure, phrased so someone who does not know
  the labels can answer them.


  Then apply the procedure to worked examples: the classic color phi display, a flash-lag
  display, and one further paradigm of your own choosing from backward masking, metacontrast
  masking, or a Libet-style timing judgment. For each, show which questions in the
  procedure do the classification, what the output is, and the exact point where a
  reasonable reviewer could get a different result depending on how the model treats
  the interval between stimulus and report. Include at least one worked case in which
  the procedure returns an answer the lab will not like — for instance, it classifies
  the lab''s own preferred model as Stalinesque, or it declares two models we treat
  as rivals indistinguishable under the procedure — and do not soften that result.


  End by saying plainly what the procedure cannot settle: the cases where Orwellian
  and Stalinesque stories are empirically equivalent given the data, the cases where
  a model''s "revision" can be redescribed as a delay without changing any prediction,
  and the points where the reviewer must still make a judgment by hand, such as when
  a model gives only response-bias or motor-side timing shifts rather than a claim
  about experience itself. State what the procedure deliberately ignores — for example,
  whether the relevant contents are representational, or whether the timing judgments
  are veridical — so that users do not lean on it for questions it was not built to
  answer.


