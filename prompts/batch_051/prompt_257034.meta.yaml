  Draft v2:


  "I have been trying to work out whether a comparison I noticed between moral psychology
  and medicine is a genuine structural parallel or only a loose analogy, and I would
  be grateful for an assessment. The philosophical side comes from John Rawls on envy.
  Rawls treats envy proper as a vice: it is the disposition to be pained or made worse
  off by another person''s good, simply because the good is theirs rather than because
  one has been wronged. But he also allows that some envy is excusable, and even tells
  us something true about a society, when it is a response to an inequality that is
  unjust in the first place — especially inequalities that injure people''s self-respect.
  So the very same unpleasant state of mind seems to count as a vice in one setting
  and as a reasonable, even instructive, response to wrongdoing in another, and the
  difference turns on whether the state accurately tracks a real injustice. The medical
  side is pain. Acute pain is normally a signal of actual or threatened bodily damage,
  and clinicians generally treat it as evidence of something wrong. Chronic and phantom-limb
  pain show that the same aversive sensation can carry on, or even arise, without
  a matching injury, so that the feeling itself becomes the problem rather than a
  guide to one.


  The structural parallel I think I see is this. In both cases there is an aversive
  state whose felt unpleasantness is not by itself enough to settle whether it should
  be respected as a report of harm or treated as something to be managed away. In
  both cases the state has a proper object — injustice for envy and resentment, bodily
  damage for pain — and its warrant depends on whether it is tracking that object
  correctly. And in both cases we therefore have to answer two separate questions:
  whether the feeling is genuinely felt, and whether it reveals a real harm in the
  world. Is that mapping accurate, or am I merely being taken in by the shared word
  ''signal''? If the parallel is deep rather than superficial, what would have to
  be true of both sides for anything to transfer between them — for instance, could
  the medical distinction between acute, informative pain and chronic, misleading
  pain cast light on Rawls''s thought that some social resentments are warranted while
  others are merely envious? And where exactly does the analogy break down, for example
  in the fact that injustice is itself a contestable normative property whereas tissue
  damage is not? Please write your answer in British English."


