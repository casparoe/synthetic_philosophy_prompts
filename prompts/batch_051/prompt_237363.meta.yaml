  The two camps:

  1. Ineffabilist / mystical camp: There is genuine knowledge (or at least cognitive
  contact with reality) that cannot be expressed in language — not just "hard to express"
  but in principle cannot be fully said. Yet it can be known, possessed, and it can
  guide action and improve understanding.

  2. Discursivist / expressivist camp: Knowledge requires content that can in principle
  be articulated, or at least truth that can be said. If something "cannot be said,"
  then we can''t evaluate it as true/false, can''t integrate it into inference, can''t
  tell whether two people agree or disagree about it; calling it "knowledge" is a
  category mistake or loose talk for a feeling.


