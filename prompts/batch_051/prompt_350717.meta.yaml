  This is a genuinely discussed issue. Peter French''s "CID" structure: corporations
  have internal decision structures that make decisions attributable to the corporation,
  whereas mobs lack such structures. List & Pettit give an account of group agents
  with judgment aggregation; a mob may not have a robust decision procedure that yields
  group attitudes. A market aggregates but is not an agent because it has no intentions
  or unified decision procedures (prices are not decisions). So P2/P3 is the weak
  point: the market lacks a decision procedure; a mob lacks stable roles and a group-level
  rational point of view. The critic could also reject P4: maybe we should treat some
  well-organized mobs as agents? Or P1: maybe corporate agency requires more than
  structure—phenomenal consciousness? But that would make blame harder. The argument''s
  subtle flaw might be a "degree vs kind" slide: the properties are not the same in
  kind; a corporation has a CID that licenses the group-level attribution, whereas
  a mob''s coordination isn''t a decision structure. But the friend says "differing
  only in degree," which is disputable.


