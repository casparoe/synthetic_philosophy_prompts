  What does "HCH and factored cognition as an idealization of deliberation" mean?
  HCH = Iterated Amplification (originally "HCH" by Paul Christiano). The idea: approximate
  the decisions of a powerful aligned agent by composing many copies of a human with
  access to smaller subproblems — a tree of humans delegating subquestions. "Factored
  cognition" = the claim that human reasoning can be broken into factors/pieces that
  are each small enough for a human to evaluate, and that composing these preserves
  quality. As an "idealization of deliberation": the picture that deliberation is
  just this — factored cognition.


  Type A prompt (engineer, no philosophy background): "In the AI alignment literature
