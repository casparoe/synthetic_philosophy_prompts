  and above a tree of small, individually checkable steps; if you could factor a hard
  question into subquestions each ordinary humans could answer reliably, a composed
  system could reason as well as a much more capable thinker. I''m drawn to this as
  an account of what deliberating well is. I want an honest map of what would count
  against it. Which results, thought experiments, or features of real reasoning should
  make me less confident... under what conditions does decomposition lose something
  in principle... where does the view stop being empirical and become a definition..."


