  Let me think about the content of Lewis triviality results. The idea: If you accept
  that the probability of the proposition "If A then C" equals P(C|A) (often called
  Adams''s Thesis / Stalnaker''s hypothesis / "the Equation"), and you allow standard
  probability facts plus some natural logic of conditionals, you get triviality: the
  conditional probability can only take extreme-ish values, or the class of conditions
  collapses. Lewis proved that under certain assumptions, a probability function P
  for which P(A→C) = P(C|A) for all A,C must be trivial (at most four values, or the
  conditional is essentially independent). The key steps involve P(A→C | C) and P(A→C
  | ¬C), using theorem that P(·|C) and P(·|¬C) are probability functions satisfying
  the equation, so:

  P(A→C) = P(A→C | C) P(C) + P(A→C | ¬C) P(¬C)

  = P(C | A∧C) P(C) + P(C | A∧¬C) P(¬C)

  = 1·P(C) + 0·P(¬C) = P(C).

  So then P(A→C) = P(C), which means the conditional requires P(A→C)=P(C), i.e., in
  particular equals P(C|A)=P(C), implying A and C are probabilistically independent.
  That''s bad: the Equation plus conditionalizing on C and ¬C forces independence
  of antecedent and consequent. More assumptions can force triviality.


