  "Walton''s transparency thesis is the claim that photographs are transparent in
  much the way windows and mirrors are: when you look at a photograph of your late
  grandmother, you literally see her, not merely a depiction of her. The argument
  is that photographs, unlike paintings, are produced mechanically by the scene itself:
  the light reflecting off the objects imprints itself on the film or sensor, with
  no human''s beliefs about how things look getting in the way. That mechanical, belief-independent
  causation is what makes photographs transparent, and it''s also why photographs
  can''t lie in the way paintings can: a painting of a smiling grandmother might be
  the painter''s flattering invention, but a photograph had to be caused by what was
  actually in front of the lens. So on this view photographs put us in genuine perceptual
  contact with the past — looking at a Civil War photograph is literally seeing the
  1860s — and that''s why we rightly admit photographs, but not sketches, as evidence
  in court and why seeing a photo is, in principle, no different from seeing the event
  through a window, just delayed. The standard objection is that you can''t see something
  that no longer exists, since vision requires a direct causal link to a present object,
  and anyway a blurry photo shows you less than a good painting does; both, I think,
  refute the view rather quickly."


