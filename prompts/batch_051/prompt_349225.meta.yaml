  Prompt draft (philosophy professor, casual, 2 paragraphs, maybe a typo):


  "I''ve been re-reading some stuff on the politics of technology and it started to
  line up, in my head, with a debate in ecological psychology, and I want a check
  on whether this is a real structural parallel or just a loose analogy. The politics-of-technology
  people say artifacts can embody political arrangements. The classic case: a low
  overpass built on a parkway that lets cars through but not buses, which means people
  who can only get there by public transit are kept out. No sign says ''excluding
  certain people,'' and you wouldn''t need a bigoted intention; the politics is in
  the poured concrete. Meanwhile the affordance people say, in a deliberately flat,
  non-political vocabulary, that a physical arrangement offers possibilities for action
  relative to an agent''s capacities: a bench affords sitting to a human, a low tunnel
  affords passage to a car but not to a bus. And I keep wanting to say: the overpass
  case just is an affordance description with a political gloss added. The concrete
  affords passage-to-cars and blocks passage-to-buses; if you add a premise about
  who has cars and who has buses and who wanted to go to the beach, you get an exclusion.
  Is that all the politics is?"


  "So my question: is ''artifacts have politics'' just ''artifacts have affordances''
  plus a distributional premise, or is there something in the political story that
  affordance talk is constitutively blind to? If the identity is real, then stuff
  from affordance theory should transfer. For instance, affordances are agent-relative:
  the same ledge is a step for an adult and an obstacle for a toddler. Does it follow
  that an artifact is never political full stop, only political relative to a population
  with certain capacities? And affordances are supposed to be value-neutral facts
  about the environment-animal fit; so where does the normativity — the sense that
  the overpass is unjust, not merely inconvenient — come from? My suspicion is that
  the analogy breaks because ''politics'' requires interests, standing, and a history
  of power that no affordance description mentions; the pure affordance reading would
  predict that once you replaced the overpass, the exclusion is gone, but in real
  cases the harm is in the surrounding distribution of cars, buses, and beaches. Tell
  me exactly where the mapping holds, where it comes apart, and whether anything from
  the tech-politics side should make a psychologist revise their notion of affordance."


