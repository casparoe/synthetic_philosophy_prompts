  Draft:


  "I have been working out a view I call graded modal realism, and I would like an
  honest, committed assessment of it. I will state it as plainly as I can.


  I accept the core of Lewisian modal realism: possible worlds are concrete, maximal,
  causally and spatiotemporally isolated from one another, and they are not merely
  descriptions or ersatz representations. What I reject is the thesis that all worlds
  are equally real. My central claim is that worlds differ in a primitive property
  I call ontological weight. The actual world has weight 1 and is the unique maximum.
  Every other world has some weight strictly between 0 and 1, and weight tracks, without
  being reducible to, how close a world is to actuality: the world in which I finish
  this paragraph one second earlier has a weight very close to 1, while a world with
  different fundamental constants has a weight near 0. I take ontological weight to
  be objective and non-epistemic; it is not a measure of how easily we can imagine
  a world, how often we discuss it, or how probable we take it to be.


  I then use weight to do two jobs. First, for the modal operators: a proposition
  is possible iff it is true at some world with positive weight, and necessary iff
  it is true at every world with positive weight; the high and low ends of the scale
  make no difference to the operators themselves. Second, for counterfactuals: rather
  than taking Lewis''s system of comparative similarity as unexplained, I say the
  closest antecedent-world is simply the world with the greatest ontological weight
  among the worlds where the antecedent is true. Lewis''s similarity ordering, on
  my view, is a shadow cast by ontology: our judgments of closeness are tracking differences
  in weight.


  I think this has two real advantages. It takes the sting out of the incredulous
  stare, because one is no longer buying a vast plenum of worlds all as real as this
  one; one pays full ontological commitment only for actuality and a sliding fee for
  the rest. And it explains the graded character of much modal thought: we speak as
  if some possibilities are nearer than others, and on this view that language is
  not merely metaphorical or psychological.


  I want you to assess this charitably but candidly. Is the idea of existing to a
  lesser degree a coherent primitive, or does it collapse into similarity under another
