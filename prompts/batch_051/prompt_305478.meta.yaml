  Prioritarianism: the view (Derek Parfit) that benefiting people matters more the
  worse off those people are. Prioritarianism gives extra weight to benefits to the
  worse off, but unlike egalitarianism it is not concerned with equality per se; it
  is a "telic" vs not? Actually Parfit distinguishes:

  - Telic egalitarianism: inequality itself is bad, even if not bad for anyone (non-instrumentally
  bad).

  - Deontic egalitarianism: we should aim for equality as a matter of justice/rightness,
  but inequality isn''t a state of affairs bad in itself.


  The leveling-down objection: If equality is non-instrumentally valuable, then a
  change that makes everyone worse off but equal (leveling down the better off to
  the level of the worse off, with no benefit to the worse off) would be in one respect
  better (more equal) even though no one benefits. Telic egalitarians must say there''s
  something good about leveling down. Parfit argued this is implausible: how can something
  be better if it''s better for no one? This objection is often used to motivate prioritarianism:
  prioritarianism captures the concern for the worse off (via weighted beneficence)
  without implying leveling down is good in any respect, because priority is a property
  of how benefits matter, not a separate value of equality.


  Egalitarians respond: the leveling-down objection is not decisive; some egalitarians
  (Temkin) bite the bullet: inequality is bad, so leveling down is in one respect
  good though all-things-considered bad. Others argue the objection relies on a person-affecting
  (or "narrow person-affecting") principle that is independently controversial: "one
  situation cannot be better in any respect unless it''s better for someone."


  Prioritarian response: the issue isn''t only that leveling-down is unintuitive;
  it''s that the egalitarian view postulates a value that floats free of anyone''s
