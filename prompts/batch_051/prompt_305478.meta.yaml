  ---


  In my political philosophy reading group, the argument between prioritarianism and
  telic egalitarianism has now stalled for several weeks, and I want a diagnosis of
  the disagreement rather than a winner. Everyone agrees on the facts of the cases.
  Everyone agrees that leveling down—making the better-off worse off while leaving
  the worse-off exactly as they are—is not all-things-considered better. And everyone
  shares the same pair of underlying concerns: a concern for the worse-off, and an
  unease about the idea that equality could be good when it benefits no one. Yet no
  one has moved.


  Here is the shape of the standoff. The prioritarian says: a change that is better
  for no one is not better in any respect; the fact that a levelled-down distribution
  is more equal cannot make it better, even pro tanto. Everything we rightly feel
  about the worse-off is captured by weighting benefits by how badly off the beneficiary
  is, with no separate value of equality doing any work. The telic egalitarian replies:
  inequality is non-instrumentally bad, so the levelled-down state really is better
  in one respect—more equal—while still being worse overall because someone has been
  made worse off. The objection is not a neutral datum; it has force only if one already
  accepts a person-affecting restriction on ''better,'' and that is exactly what is
  in dispute. When the prioritarian answers that a value which floats free of anyone''s
  interests is no value at all, the egalitarian replies that the extra weighting of
  the worse-off is itself an unexplained compromise unless it is grounded in the badness
  of inequality—and the loop closes.


  My working hypothesis is this: the two sides are largely answering different questions
  under the same heading—one asking what we owe to persons, the other asking what
  states of affairs are impersonally good—and the real load-bearing premise is a person-affecting
  restriction on goodness that is never made explicit. But I am not sure whether that
  diagnosis is right, or whether it is simply a polite way of saying the egalitarian
  is losing.


  Diagnose what kind of disagreement this actually is: a substantive dispute about
  impersonal goodness, a verbal dispute about the word ''better,'' a difference about
  which intuitions count as authoritative data, a difference about whether distributive
  questions should be framed impersonally at all, or something else. Engage with the
  specific moves each side makes rather than surveying the literature. Then say what,
  given that diagnosis, would count as progress—a sharper distinction, a new kind
  of case, a reformulation of the person-affecting restriction, a change of question—or
  whether we should expect a genuine but permanent impasse.


  Start with your bottom-line diagnosis in one or two sentences, then defend it. Keep
  the whole response under 900 words.


