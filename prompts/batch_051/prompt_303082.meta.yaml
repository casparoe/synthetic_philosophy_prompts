  is continuous with ours: any such being who lives endlessly under favorable conditions
  would eventually find continued life dominated by boredom or by the extinction of
  the strong desires that make life worth continuing, so that the purported benefit
  of immortality would be undermined; the problem is not merely an artifact of a particular
  character or insufficiencies of imagination.


