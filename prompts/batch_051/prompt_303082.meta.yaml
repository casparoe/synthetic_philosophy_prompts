  ---


  I am a novelist at work on a book whose central character has been alive, unaged,
  for several centuries. I need to settle a structural question before I can write
  the second half: whether her condition is best rendered as an in-principle tragedy,
  or as an ordinary human problem stretched across an unusual span. Bernard Williams''s
  Makropulos argument bears directly on this. As I understand it, his claim is roughly
  as follows. Consider a person whose life continues indefinitely under favorable
  material and social conditions, with a psychology continuous with ours. Either her
  character remains broadly the same, in which case the categorical desires that give
  her reasons to go on living will eventually be exhausted and she will be consumed
  by boredom; or her character changes enough to refresh those desires, in which case
  the later person is too discontinuous with the original for us to call the original''s
  death avoided, or for the life to count as the same person''s continuing survival.
  So immortality is either unlivably tedious or not really survival, and death may
  be preferable.


