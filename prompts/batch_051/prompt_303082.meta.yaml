  Draft in final form:


  ---


  I am a novelist preparing to write the second half of a novel about a woman who
  has been alive, unaged, for centuries. The structural decision I must make is whether
  her condition is an in-principle tragedy or a very long ordinary problem, and Bernard
  Williams''s Makropulos argument bears on that decision directly. Let me give my
  understanding of the argument so that we are both anchored to the same claim. Williams
  took the figure of the woman in Karel Čapek''s play, kept alive by an elixir for
  more than three centuries, to be tedious and ultimately glad to die; he generalized
  from this what I''ll call the Makropulos conclusion. A human being whose psychology
  is like ours has, among her desires, some whose objects give her reasons to go on
  living. In an endless life under favorable conditions, either her character remains
  recognizably the same, in which case those life-giving desires will eventually be
  exhausted and boredom will dominate; or her character changes enough to keep generating
  such desires, in which case the later person is so psychologically removed from
  the original that the original''s death has not really been avoided. So immortality
  would be either unlivably tedious or not the same person''s survival.


  Here is the proposition on which I want your credence:


  P: The Makropulos conclusion is broadly correct for beings whose psychology is continuous
  with ours. For any actual human being in an endless life with health and material
  security assured, there is some point after which the person either no longer has
  desires whose objects give her a reason to go on living, so that continued life
  is dominated by boredom or indifference, or the only way to sustain such desires
  is a degree of psychological change that breaks the relevant continuity between
  the earlier person and the later one. The phenomenon is therefore not merely an
  insufficiency of imagination or a particular character''s defect.


  I am not asking whether the outcome could vary with constitution or circumstance;
  your uncertainty about that should be folded into your number, not used to avoid
  giving one.


  Give your actual credence that P is true as a single decimal between 0 and 1. Then
  lay out the reasoning that produces it, decomposed into at least the following sub-questions,
  with a rough probability for each and an indication of how you combine them:


  1. Contingency: is the exhaustion of life-giving desires a necessary feature of
  human psychology, or a contingent feature of particular psychologies and cultures
  that could in principle be otherwise?


  2. The sameness horn: for a stable human character, how likely is it that indefinitely
