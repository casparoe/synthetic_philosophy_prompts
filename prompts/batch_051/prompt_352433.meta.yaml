  "promote F" often used to mark deontological vs consequentialist treatments of a
  value. For example, with the value of "charity," deontologists might claim a duty
  to be charitable oneself; consequentialists might claim a duty to promote charitable
  giving even if one doesn''t give (e.g., working to get others to give). Similarly,
  "be vegetarian" vs "promote vegetarianism." The domain: frugality.


  A sorting quiz could ask diagnostic questions that separate positions:


  1. Is frugality (the disposition to spend/consume carefully and avoid waste) valuable
  in itself or only as a means to some further good (reducing resource depletion,
  financial security, environmental benefit, etc.)?

  2. If someone reliably causes more frugality in others by conspicuously spending
  (e.g., a consultant traveling first-class to advise corporations on waste reduction),
  is that person''s spending permissible/required? This distinguishes "be frugal oneself"
  agent-relative constraints from "promote frugality" agent-neutral value maximization.

  3. Does the environment/resource use of frugality matter directly, or is frugality
  primarily about personal character?

  4. Do governments/companies have an obligation to be frugal with public resources,
  or is frugality only a private virtue? This might separate individual ethics from
  policy.


