  For my seminar on family ethics, we have been working with a four-condition reconstruction
  of Jane English''s friendship model of filial duty. On this reconstruction, a grown
  child has special, relationship-based duties toward a parent only when: (1) the
  relationship between them is, in the present, voluntary on both sides; (2) it is
  marked by mutual affection and trust, rather than by gratitude or a sense of debt;
  (3) what each gives and receives functions as part of an ongoing reciprocal exchange,
  not as repayment for past care; and (4) the duties owed are those internal to such
  a relationship — roughly, the duties one owes a close friend. When these conditions
  are absent, the model says that only general human duties (such as helping in an
  emergency) remain.


  Consider this case. A daughter and her mother had, for roughly two decades of the
  daughter''s adulthood, a warm and chosen friendship: they talked regularly, confided
  in each other, visited by choice, and helped each other through difficulties. The
  mother then developed late-stage Alzheimer''s. She no longer recognizes her daughter,
  cannot hold a conversation, and is no longer capable of affection or reciprocity
  in any recognizable sense. The daughter still visits weekly, manages her finances,
  and advocates with the care home. She says she does this for the person her mother
  was, not because she gets anything back.


  Does the friendship model classify the daughter''s conduct as a filial duty, as
  supererogatory beneficence, or as a merely general duty? Work through the four conditions
  honestly, and say where they underdetermine the verdict. Then say whether the case
  shows that the model''s emphasis on a present, mutual relationship needs to be amended
  — for instance, to allow that duties can survive a friend''s loss of the capacities
  that friendship requires — or whether calling these acts duties of friendship simply
  mistakes loyalty to a history for a present relationship.


  Please also say how confident you are in your interpretation of the model, and single
  out the point you are least sure about.


