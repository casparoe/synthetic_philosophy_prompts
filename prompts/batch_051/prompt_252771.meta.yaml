  very feeling the artist has lived through; the audience is ''infected'' with it.

  (2) Transmission requires that the audience comes to have the same feeling the artist
  had.

  (3) Feelings are individuated by their objects and histories: my grief for a particular
  person, in a particular situation, with a particular history, is a different feeling
  from your grief for a different person in a different situation.

  (4) An artist''s audience never shares the artist''s situation or history, and often
  does not even know the particular object of the feeling.

  (5) Therefore the audience never comes to have the same feeling the artist had.

  (6) Therefore, by Tolstoy''s criterion, no work is ever art — which Tolstoy himself
  would reject, since he plainly thinks some works succeed.


