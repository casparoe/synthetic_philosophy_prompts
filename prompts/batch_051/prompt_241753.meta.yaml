  Draft:


  "I have no training in economics, but I have been thinking on my own about a question
  that won''t leave me alone, and I would like you to help me find the principle behind
  my own judgments. The question is: when new money is created — printed, typed into
  an account, lent into existence — under what conditions does it create real wealth,
  and when does it merely create claims on wealth that already exists, or on wealth
  that never gets produced? I have a set of verdicts about particular cases, and I
  can''t tell whether one principle captures all of them or whether some of my verdicts
  have to go.


  Here are the cases as concretely as I can state them.


  1. A government in a deep slump, with many unemployed workers and idle factories,
  mails every adult a substantial check and pays for it by newly printed money. People
  spend the money at local businesses; businesses hire and produce more; warehouses
  go from empty to full. My verdict: real wealth was created. Not just pieces of paper;
  actual new goods and services that would not otherwise have existed.


  2. The same government, with the same mailing, but now the economy is running at
  full stretch, with almost no unemployed workers and no idle machines. My verdict:
  no real wealth is created. The same number of goods are being produced, only with
  higher prices; the new money just changed the numbers.


  3. A central bank creates new money and uses it to buy government bonds from banks.
  The banks end up holding reserves instead of bonds. My verdict: by itself, this
  creates no new wealth. It swaps one paper claim for another on the bank''s balance
  sheet. Whether wealth follows depends on what the banks do next, and on whether
  there is idle capacity for that spending to bring into use.


  4. A bank makes a loan to a builder to put up an apartment building on a vacant
  lot. The bank creates the loan not out of someone''s savings but as a new deposit,
  fresh money. The building goes up and is rented. My verdict: wealth was created.
  The new deposit is a claim, but the building is a real addition, and the loan called
  it into existence.


  5. A bank makes a similar-sized loan, again as a new deposit, but this time to a
  buyer purchasing an existing house in a hot market. No building occurs; the main
  effect is that house prices in the area rise, and people who already own houses
  feel richer. My verdict: no real wealth was created. The same housing stock now
  has larger numbers attached to it, and the new deposit is a claim on that unchanged
  stock.


  6. A skilled counterfeiter prints currency that is indistinguishable from the government''s
  and spends it over the course of a year. My verdict: no wealth is created. Whatever
  the counterfeiter gains, others lose through a general rise in prices. It is a kind
  of theft spread thinly across everyone who holds money.


  7. A government prints money and uses it to pay off maturing bonds held by the public.
  The bondholders receive cash instead of their old promise of future cash. My verdict:
  no new wealth is created. One claim is exchanged for another; the real goods and
  the government''s future taxing power are the same as before.


  8. The government prints money to fund an extra year of schooling and job training
  for a large number of adults, and afterward their productivity measurably rises.
  My verdict: real wealth is eventually created, because the economy can now produce
  more than it could have without the money.


  I can see the rough shape of a principle in these verdicts: money creation adds
  to real wealth only insofar as it brings idle resources into production or creates
  new productive capacity, while it adds nothing when it merely changes the form or
  the size of claims on an unchanged real economy. But I worry that this principle
  doesn''t survive its own logic. Case 6 looks mechanically like case 1: in both,
  new money appears and is spent on real goods and services, and in a slump the counterfeiter''s
  spending could likewise give work to the idle. If I follow my own principle, must
