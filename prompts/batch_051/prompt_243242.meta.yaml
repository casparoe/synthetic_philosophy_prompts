  Better: The classic issue: Can a rational agent hold a belief that she believes
  her evidence fails to support? The two group members argue:


  - Thomas (anti-akrasia): Once you believe your evidence doesn''t support p, that
  very belief is part of your total evidence and a reason not to believe p. So a person
  who both believes p and believes her evidence doesn''t support p is necessarily
  irrational — her total evidence fails to support p. Akrasia is like a contradiction:
  "I believe p, but my evidence doesn''t support p" is a state that undercuts itself.


  - Susan (pro-akrasia / higher-order evidence): But consider how you respond to higher-order
  evidence. Suppose I''ve worked through a proof and see that it''s valid. You then
  tell me, with excellent evidence, that a drug in the coffee I drank raises the chance
  of arithmetic errors. My rational response is to become less confident of the proof.
  But the drug didn''t touch the proof itself; my first-order evidence (the proof)
  still supports the theorem. If I fully complied with my higher-order evidence, I''d
  have to say my evidence doesn''t support the theorem as strongly as the proof indicates;
  yet I can''t see any flaw in the proof. So the rational state may be precisely one
  of tension: I remain more confident than I think my evidence would warrant, because
  the higher-order evidence doesn''t give me a first-order flaw to point to.


  - Thomas: But that just shows the higher-order evidence is also first-order evidence
  about the proof. If you rationally lower confidence, then by your own lights the
  evidence (including the drug evidence) supports the lower confidence. A rational
  agent who lowers to 0.6 must think 0.6 is what her total evidence supports. If she
  still thinks "the proof alone supports 0.9," that''s fine, but "my evidence" includes
  more than the proof. So there''s no akrasia.


  - Susan: That''s a nice move, but it misses the phenomenon. The drug evidence is
  not a reason to think the proof is invalid; it bears on my competence, not the content.
  If I treat it as first-order evidence against the theorem, I''m double-counting
  it or letting noise masquerade as signal. The reason I''m at 0.6 isn''t that the
  evidence for the theorem dipped from 0.9 to 0.6; it''s that I''m uncertain whether
  I''ve properly assessed evidence that may still, for all I can tell, support 0.9.
