  "I''m a second-year undergrad in an aesthetics class and we''re on philosophy of
  music. We''ve been on the problem of how purely instrumental music can be sad, and
  I feel like every explanation I meet is basically one of these four, with different
  window dressing:


  1. The resemblance view: the music shares acoustic features with sad human expressive
  behavior (slow, low, falling contours) and we read the emotion off it.

  2. The persona/imagination view: we imagine a musical agent or virtual person behind
  the unfolding structure, and that agent is expressing sadness.

  3. The contagion/infection view: we don''t hear the music as sad; we catch sadness
  from it the way we catch a mood from another person''s posture or voice.

  4. Hanslick''s dynamic analogy, which we read in his On the Musically Beautiful.
  He says roughly that music cannot depict the actual feeling of sadness, only its
  dynamic properties, such as motion, acceleration, hesitation, and intensity; our
  feeling follows that abstract pattern.


  I''m not asking for a fifth popular theory if it is just one of those four in disguise.
  I want a genuinely different account of how/how far instrumental music can be sad,
  one that is not on that list and not a special case or combination. Then give an
  honest assessment: is it actually a rival to these four, or does it just redescribe
  one of them? I''d also be happy if the right answer is that there is no fifth, and
  why the list is exhaustive, but only if you can say why it is exhaustive."


