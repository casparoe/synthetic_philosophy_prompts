  ---


  After I retired from a career in physical chemistry, I began tutoring first-year
  university students, and I have been struck by a pattern I do not have an adequate
  vocabulary for. Their wrong answers are seldom scattered. A student who insists
  that electric current is "used up" by a bulb will, in the next week, predict that
  two bulbs in series grow dimmer the further they are from the battery, and, when
  shown an ammeter reading the same current on both sides of the bulb, will not discard
  the idea but add an auxiliary assumption — that the meter is itself drawing current,
  that the wires must be special, that the battery "recovers" some current. The same
  student, in a different unit, explains why a ball keeps moving after being thrown
  by saying the throw deposited a quantity of "force" in it that gradually runs out,
  and treats frictionless motion as a limiting case that would eventually stop anyway.
  These errors look to me less like gaps in knowledge than like small, generative
  systems: each one licenses predictions about novel cases, organizes otherwise unrelated
  phenomena, and survives counterevidence by local amendment rather than by being
  abandoned. I am trying to understand whether this way of seeing students'' errors
  — as theory-like structures rather than as the absence of correct knowledge — is
  an established position, what it is called, and how it is defended and criticized.
  In particular, I would like to know where the boundary lies between a theory-like
  systematic error and an ordinary false belief or a one-off slip, and whether the
  ad hoc, self-protecting behavior I keep seeing is part of the established concept
  or an extra feature I am tacking on. If no single concept fits, I would be grateful
