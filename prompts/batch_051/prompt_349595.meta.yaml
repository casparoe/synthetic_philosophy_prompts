  were selected for pumping blood.


  Causal-role accounts (Cummins 1975): function is a disposition or capacity of a
  component within a containing system, relative to a capacity of the whole system.
  The heart''s function is to pump blood because in the circulatory system, the heart''s
  pumping contributes to circulation/delivery of oxygen. Causal-role is not tied to
  history/selection.


