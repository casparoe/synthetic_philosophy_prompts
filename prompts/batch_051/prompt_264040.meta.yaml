  it arranges things in a way that favors some people over others — think bridges
  too low for buses, time clocks, assembly lines — but it didn''t have to be built
  that way; the same function could''ve been served by a different design that favors
  different people. Second sense: an artifact is political because running it at all
  seems to require a certain kind of authority structure — the classic examples being
  nuclear power needs centralized hierarchy vs. solar panels being compatible with
  decentralised energy democracy. Most debates I read slide between these two.


  So the spec for the case:


  - It must be a piece of technology that clearly has politics in the first sense:
  some identifiable group is advantaged and another disadvantaged by the design itself,
  not just by how it happens to be used.

  - But it must not have politics in the second sense: there is no plausible argument
  that its normal operation requires a particular distribution of authority or that
  it can only exist under one political setup.

  - The design must be mundane/realistic (an app, a workplace system, a piece of municipal
  hardware — not a sci-fi machine). No nuclear weapons, no social credit scores, no
  all-powerful AI.

  - The politics must be genuinely in the artifact, not just a downstream effect that
  any tool with the same function would have. If the disadvantaging effect would survive
  any reasonable redesign of the tool, it''s cheating: that means the function is
  the problem, not the artifact.


