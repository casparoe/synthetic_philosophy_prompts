  Kelly prompt draft:


  "I am a doctoral student working on the foundations of decision theory, and I keep
  coming back to a tension in how I think about risk. I find geometric rationality
  compelling: the policy of choosing the fraction of one''s wealth to wager that maximises
  the expected logarithm of wealth—Kelly betting—has real systematic virtues. Over
  repeated bets it maximises the long-run growth rate of wealth, it is asymptotically
  dominant over any essentially different strategy, and it gives a unique, tidy answer
  to ''how much should I stake?'' without my having to introspect a utility function.
  But I also have a firm intuition that if I am offered a single favourable gamble,
  the appropriate stake should be set by my attitudes to terminal wealth, and that
  a person with a more concave utility function than log utility is not making a mistake
  by staking less than Kelly prescribes. I cannot shake the sense that something matters
  about the path and magnitude of possible losses that the growth-rate criterion simply
  does not see on a finite horizon."


