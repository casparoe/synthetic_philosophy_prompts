  (b) whether the residue class of x is a well-defined element of the resulting field;

  (c) whether there is a canonical, structurally distinguished square root of −1 in
  C, and whether complex conjugation supplies one;

  (d) what exactly is conventional about the notation i, and whether statements that
  use i, such as i² = −1, can be meaningful and true regardless of that convention.

