  Student answer. The quotient R[x]/(x²+1) is a field, since x²+1 is irreducible over
  R, and its element j = x + (x²+1) satisfies j² = −1; so the construction does produce
  a field containing a square root of −1. The difficulty is that this field contains
  two such roots, j and −j, and the automorphism j ↦ −j shows that no statement in
  the language of fields separates them. The choice between them is therefore arbitrary,
  and any definition that depends on an arbitrary choice is not well-defined. It follows
  that the i of the usual presentation of the complex numbers is not well-defined
  either: the phrase "the square root of −1" is a definite description with two equally
  good referents. One might think that complex conjugation helps, since it maps i
