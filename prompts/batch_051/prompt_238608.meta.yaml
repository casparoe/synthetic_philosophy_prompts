  Prompt draft:


  "I''ve been defending a position about mechanistic anomaly detection. Quick setup:
  suppose you have a mechanism-ish model of some system — a regulatory network, a
  supply chain, whatever — and you''re trying to flag when an observed behavior is
  ''anomalous'' in the sense that it comes from a different mechanism rather than
  just the same mechanism with different inputs. I hold the view that the same/different
  mechanism distinction should be drawn purely at the level of causal structure: same
  components, same causal arrows, same functional form. A change that only tweaks
  parameter values or background conditions doesn''t count as a change of mechanism;
  a change that adds/removes nodes or rewires edges does. So anomaly detection should
  look for structural differences — differences in the equations'' functional form
  or topology — and should ignore mere parameter shifts. What would count against
  this? I want you to stress-test it, not just with the first counterexample that
  occurs to you. Which cases force me to admit that a pure parameter shift can be
  a new mechanism (e.g., a rate constant crossing a bifurcation, a sign flip, a regime
  change, a component switching from one qualitative role to another)? Which formal
  results (say, about realization equivalence or degeneracy among model structures)
  show ''same causal structure'' might be underdetermined by data? Which of these
  would a defender of my view have to concede as real costs, and which can they dismiss
  as changing the subject? Rank the defeaters from fatal to merely awkward, and tell
  me if my position is so qualified by now that it''s unfalsifiable — and whether
  that matters for a claim about detection practice. If I''d personally be most moved
  by cases where two different mechanisms are behaviorally indistinguishable on all
  the data we can ever collect, weight those."


