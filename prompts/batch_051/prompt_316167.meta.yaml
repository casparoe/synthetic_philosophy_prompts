  Essay idea: "Envy as a diagnostic virtue: against the vice-first reading."


  I might propose: The standard philosophical treatment (with Rawls as a sophisticated
  instance) treats envy as a vice that well-ordered institutions need not address,
  and resentment as the proper moral response to injustice. The difference is standardly
  drawn in terms of the object: resentment responds to a wrong done to oneself; envy
  responds to another''s comparative advantage, whether or not that advantage is deserved.
  But this object-based distinction is unstable, because to classify an inequality
  as mere advantage rather than wrongful harm already requires a substantive theory
  of desert and entitlement. So calling a response envy rather than resentment can
  itself encode the very judgment in dispute. I want to argue that under conditions
  of severe inequality there is a form of attitudinal envy — what we might call diagnostic
  envy — that is best understood as a candidate moral perception: it tracks the thought
  that the advantage is not separable from a wrongful social arrangement. Rather than
  accepting the vice-first reading, we should ask what would make envy apt or inapt
  in the same way we ask about resentment: does it latch onto a real wrong? Rawls''s
  category of excusable envy comes close to this but then pulls back by treating excusable
  envy as a sign that the basic structure is unstable, not as evidence about the justice
  of that structure. I suspect the pull-back is unargued, and that it depends on importing
  a prior standard that settles which inequalities are legitimate.


