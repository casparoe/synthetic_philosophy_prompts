  Core debate: Herbert Simon''s satisficing vs optimizing. Simon argued that full
  rationality is computationally intractable; real agents have bounded rationality
  and hence "satisfice": choose an option that meets an aspiration level, rather than
  maximizing expected utility. Stigler (1961) argued that information is costly and
  that an optimizing model can incorporate search costs, making optimal stopping rules
  (e.g., sequential search with reservation prices) that look like satisficing but
  are actually optimal. Gigerenzer and ecological rationality: fast-and-frugal heuristics
  exploit environmental structure and can outperform optimizing models when uncertainty
  and computational costs matter; rationality is about match to environment, not internal
  optimization. Schwartz et al. on maximizing vs satisficing as personality dispositions:
  satisficers are happier. There''s also "melioration" (Herrnstein) where agents choose
  based on local average returns. And "aspiration adaptation theory" (Simon, Selten):
  aspirations adjust based on experience.


  Distinctions:

  1. Is search costs/internal computation included in the formal optimization? (Stigler
  says yes; Simon says the resulting optimization problem might be as hard as the
  original, so procedural rationality matters.)

  2. Does the agent have a complete and consistent preference ordering/utility function
  over all outcomes? (Optimizers yes; satisficers may have partial orderings.)

  3. Is the criterion of choice a threshold on an attribute (aspiration) rather than
  a maximization?

  4. Does the threshold adapt over time based on experience (aspiration adaptation)?

  5. Is the standard of evaluation of a heuristic ecological (performance in real
  environments) vs internal (coherence with axioms)?

  6. Is the set of alternatives given or generated by search? Is there a stopping
  rule?


  Concrete cases:

  - Apartment search: must decide when to stop viewing listings in a new city; you
  can always apply to one more listing at a cost of time.

  - Hiring/secretary problem: fixed number of candidates, must accept/reject on the
  spot.

  - Choosing a restaurant: known favorite vs trying a new place.

  - Stock selling / one-armed bandit.

  - A student deciding how many grad programs to apply to.


  Diagnostic claims:

  - "An agent who has no way to attach probabilities to unseen alternatives cannot
  be described as maximizing expected utility, but can still use an aspiration level."

  - "A stopping rule can be justified by its long-run performance across environments,
  not by optimizing within each environment."


  Positions as leaves:

  1. Neoclassical optimization under search costs (Stigler): satisficing is reducible
  to optimization once information costs are included; leaf commitment: the agent
  must be able to solve the more complex dynamic program including the cost of thought,
  which shifts rather than removes the computational burden.

  2. Simonian satisficing proper: procedural rationality, aspiration levels, no full
  utility maximization; commitment: needs to explain when an aspiration level is itself
  rational without secretly invoking optimization.

  3. Ecological rationality / fast-and-frugal heuristics: use simple lexicographic
  or one-reason heuristics selected by environment; commitment: may fail in unrepresentative
  or adversarial environments and is less naturally stated as a normative theory of
  individual cases.

  4. Maximizing vs satisficing as individual differences (Schwartz): some people maximize,
  others satisfice; commitment: treats strategy choice as a trait and has trouble
  saying which is rationally better.

  5. Radical bounded rationality / non-consequentialist? Perhaps not needed.

  6. Meliorating/local hill-climbing: choose based on local feedback; commitment:
  can become trapped in local optima.


