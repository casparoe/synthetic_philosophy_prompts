  you''re implementing a different, internally inconsistent policy. But is that bad?
  There''s a distinction between being exploitably irrational and being incoherent.

  - Another issue: Dutch book theorem shows that non-EU preferences can be exploited
  given assumptions; converse isn''t secure.

  - The sure-thing/independence axiom: Allais paradox shows people systematically
  violate independence — but do these people really get money-pumped in real life?
  The answer may be that bookie doesn''t know their preferences; plus willingness
  to accept bets.

