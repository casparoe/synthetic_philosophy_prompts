  Two-factor theory:

  - The standard two-factor account (Coltheart, Langdon, McKay): Factor 1 = neuropsychological
  anomaly producing the content (e.g., capgras: no autonomic response -> "impostor"
  idea). Factor 2 = a deficit in belief evaluation, often linked to right frontal
  lobe, explaining why the belief is adopted rather than rejected. There are variations:
  "explanationist" versions where factor 2 is a reasoning bias; "endorsement" accounts.
  The prompt sums it up reasonably.

