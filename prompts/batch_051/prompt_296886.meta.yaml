  Here is the argument for convicting/liability:


  (1) A fact-finder is justified in returning a verdict against a party just in case
  the fact-finder''s rational credence that the party did the alleged act meets or
  exceeds the applicable standard of proof (understood as a probability threshold:
  above 0.5 for preponderance, and some higher threshold below 0.995 for beyond a
  reasonable doubt).

  (2) Where the total evidence places the defendant in a reference class of which
