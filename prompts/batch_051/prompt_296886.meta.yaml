  one of the city''s bus companies; 80% of buses are blue; the Blue Bus Company owns
  all blue buses. So the posterior that a Blue Bus Company bus did it is 0.8.

  (4) 0.8 > 0.5, so preponderance is met.

  (5) Therefore the plaintiff should win.


