  own choices?" involves the issue that an agent''s own present/future choices aren''t
  events she can treat as exogenous; assigning a probability like "I''m 70% likely
  to do X" is weird because the choice is up to her, not a chance process. Also there''s
  the "deliberation crowds out prediction" idea: while deliberating, you can''t simultaneously
  view your choice as a prediction to be made. Also there''s the problem of "how do
  you act on a probability of your own action?" If you predict you''ll do X with 70%
