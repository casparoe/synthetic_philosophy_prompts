  Nozick''s tracking analysis (simplified): S knows p iff (1) p is true, (2) S believes
  p, (3) if p were false, S would not believe p (sensitivity via variation), (4) if
  p were true (under slightly different circumstances), S would believe p (adherence).
  Actually Nozick: condition 3: if p weren''t true, S wouldn''t believe p; condition
  4: if p were true, S would believe p. And methods: belief via method M, same method
  in close worlds.


  Closure under known entailment: If S knows p and knows p entails q, then S knows
  q. Nozick denies closure because sensitivity fails for q (e.g., not-BIV). Skeptical
  argument: You know you have hands (it''s sensitive: if you didn''t have hands you
  wouldn''t believe you do), and hands entails not-BIV, but you don''t know not-BIV
  (if you were a BIV you''d still believe not-BIV because the experiences are the
  same; so belief is insensitive). Therefore closure fails. This is the well-known
  cost.


