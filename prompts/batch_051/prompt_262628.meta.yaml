  ---


  I have been developing a definition of "avoiding side effects" that is meant to
  be usable without a full specification of value, and I want an honest assessment
  of the idea. I call it the Task-Relative Baseline Principle.


  Fix an artificial agent and a task specification, where the task is given only by
  success conditions or an objective function — e.g., "deliver the package to the
  top floor" or "remove the weeds from this plot." The task-relative baseline is the
  class of outcomes in which (a) the success conditions are met and (b) every variable
  not mentioned in the task specification is held as close as possible to its value
  in the no-intervention world, under a generic, value-free notion of closeness such
  as "fewest variables altered" or "least overall physical change." A side effect,
  relative to the task, is then a departure from this baseline in any unmentioned
  variable. To build a low-impact agent, one trains or constrains the agent to satisfy
  the success conditions while minimizing departures from the task-relative baseline,
  with no reference to whether those departures are good or bad.


  The principle is meant to capture ordinary judgments about side effects: if an agent
