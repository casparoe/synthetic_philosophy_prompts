  each analyst gets about half an hour, and the decision is high-ish stakes because
  a bad promoted rule gives us stockouts or dead inventory, and the demand planning
  manager signs off but mostly rubber-stamps whatever we send.


  the philosophical issue i''m gesturing at is Goodman''s new riddle: for any finite
  sales history, there are infinitely many regularities that fit, and most are insane.
  "grue" is the standard example. Goodman''s answer, as i understand it, is not to
  ban weird predicates by their syntax; it''s that some predicates have been used
  successfully in past projections and become entrenched, and induction licenses only
  projectible predicates. I want you to turn that into an actual procedure my team
  can use to sort proposed rules into promote / quarantine / kill, without them having
  to read philosophy.


  The tough cases i need the procedure to handle: a rule that uses a predicate no
