  Let''s formulate a precise argument with maybe a subtle flaw:


  Argument:

  (1) A statement is a lie iff the speaker asserts something they believe false.

  (2) An influence on someone else''s judgment via speech is a case of misleading
  iff the speaker intends that the hearer form a false belief, regardless of whether
  the false belief is part of what is strictly asserted.

  (3) The moral status of a verbal act depends on two features: the intention with
  which it is done and the reasonably expected effects on the hearer''s ability to
  act on true information.

  (4) For any lie, one can construct a case of misleading that has the same intention
  and same reasonably expected effects: say something strictly true but calculated
  to produce the same false belief.

  (5) The only additional feature of lying is the semantic relation between speaker,
  sentence, and world (the asserted proposition''s being false), which by itself has
  no moral bite.

  (6) Therefore, if there is a moral difference between lying and misleading, it must
  be in conventional norms (e.g., a rule against the speech act of lying), not in
  what the speaker does to the hearer.

  (7) Such a convention would be arbitrary unless it tracked something in (3), and
  by (4)-(5) it doesn''t track anything beyond what is shared with misleading.

  (8) So lying and misleading are morally equivalent when intention and expected effects
  are held fixed.


