  out, and which does it remain compatible with? Consider at least: a view on which
  liquidity is a property of an individual asset in a particular market rather than
  an aggregate condition that policy can create; a view on which the quantity of base
  money matters mainly through direct spending rather than through asset prices and
  portfolio effects; and a strict long-run monetary-neutrality view.


  4. Where is the practice philosophically underdetermined? Identify the places where
