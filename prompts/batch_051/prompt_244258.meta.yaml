  I work on financial regulation, and I keep being puzzled by a practice whose philosophical
  commitments I have never seen anyone spell out. Consider quantitative easing as
  it has been conducted by major central banks since the 2008 crisis. A central bank
  creates new reserve balances (liabilities of the central bank, held by commercial
  banks) and uses them to buy long-term government bonds — and sometimes other assets
  — from private holders. The private sector ends up holding a different financial
  claim, not more real goods; nothing is produced or consumed in the transaction itself.
  Central bankers often insist that monetary policy cannot create real resources or
  real wealth. Yet the same institutions describe the operation as easing financial
  conditions, supporting asset prices, and boosting household wealth, and they defend
  it partly through the wealth effect: households that feel richer because their assets
  have appreciated will spend more.


  Reconstruct the implicit theory of money, liquidity, and wealth that this practice
  presupposes. I want a careful reconstruction, not a description of the policy mechanics,
  so please address the following:


  1. What must the practice presuppose about the nature of wealth for its practitioners
  to regard it as both "not creating real wealth" and "supporting wealth"? Is that
  a coherent pair of commitments, or does the practice tacitly run two theories of
  wealth at once — one in which wealth is a claim on future real output, and one in
  which wealth is whatever a marked-to-market balance sheet says it is?


  2. What does the practice strictly presuppose, as opposed to merely fit well with?
  For instance, does it strictly presuppose that the liquidity and composition of
  private balance sheets matter for aggregate demand, or could the same operations
  be licensed by several different transmission stories?


