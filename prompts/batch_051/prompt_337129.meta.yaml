  I want help sorting out what principle, if any, captures my own verdicts on the
  following cases, because they feel inconsistent to me.


  1. A student tells me they didn''t get anything out of a very difficult modern poem
  on first reading, but after a week of rereading and background reading, they admit
  it''s great. I think that''s evidence of a defect in their initial response, not
  in the poem. It was corrected by effort.


  2. But when a friend tells me they had to force themselves through a novel, and
  after the effort they still didn''t like it, I don''t think the effort gives their
  dislike any less authority than my enjoyment. In fact I take their dislike as evidence
  that the novel maybe isn''t that good.


  3. I think a joke that makes me laugh immediately is better evidence of its quality
  than a joke I need to analyze to find funny — even if the latter is more "sophisticated."
  But I don''t think the same is true for music: music that takes a long time to appreciate
  can be better than music that grabs me instantly.


