  each criterion in turn, and say honestly where my criteria leave the verdict underdetermined.
  Then discuss whether this borderline case shows that the checklist itself needs
  changing — for example, whether it misses something about the beginning of the run,
  or about how a sequence can have no first or last member. Please answer in British
  English.


