  acts in a finite interval, provided each act is suitably brief; the acts in the
  Dichotomy shrink without bound, so the total time they take is finite. Zeno''s error
  was to assume that an infinite sequence of tasks can never be exhausted. The runner
  completes the entire infinite sequence, and then, having reached the end, stops.


