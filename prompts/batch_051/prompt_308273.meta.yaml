  1. It identifies the particular premise or inference in Zeno''s reasoning that it
  takes to be false or invalid, and gives a reason for rejecting that step rather
  than simply asserting that motion occurs.

  2. It does not beg the question by assuming at the outset that motion is possible.

  3. It explains, rather than merely denies, the appearance that an infinite sequence
  of tasks cannot be completed in a finite time, while still vindicating the commonsense
  claim that the runner reaches the end of the track.

  4. It remains faithful to the mathematics of infinite series and limits, without
  treating the convergence of an infinite series as a complete answer on its own.


