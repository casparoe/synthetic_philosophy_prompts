  Potential final:


  I direct the model-review section of a regional flood-management authority. We evaluate
  consultant hydrologic and hydraulic models used for regulatory floodplain maps,
  levee certification, and reservoir release decisions. We see cases where a 5-millimetre
  change in a design storm input, or a 2 percent change in a roughness coefficient,
  shifts the predicted 100-year flood extent across hundreds of properties. Consultants
  sometimes argue that because the model is calibrated to observed events, its deterministic
  output should be accepted; other times they say the system is chaotic so maps are
  meaningless. I need a reusable decision procedure my team of five engineers can
  apply in about two days per model submission, without needing a mathematician on
  call.


  Use this passage from Poincaré as a starting point. In Science and Method, in his
  essay on chance, Poincaré observes that for certain systems a very small difference
  in initial conditions produces a very great difference in final phenomena, and that
  prediction then becomes impossible; he illustrates this with the idea that meteorologists
  are uneasy because a tenth of a degree of error somewhere might be enough to prevent
  them from predicting a cyclone. Do not quote it back at me; translate it into questions
  and tests.


  Write the procedure as a checklist or flowchart in words. It should include:

  - the questions to ask in order about model sensitivity, ensemble spread, validation
  history, and decision thresholds;

  - what counts as an adequate answer to each question;

  - where the procedure stops and says no, with a specified alternative;

  - where it must hand the decision to someone because the matter is values, risk
  tolerance, or local priorities rather than model quality;

