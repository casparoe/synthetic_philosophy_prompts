  Role: "I am a flood-risk engineer at a state water agency. I review rainfall-runoff
  and hydraulic models submitted by consultants to support decisions about floodplain
  boundaries, levee heights, and emergency action thresholds. We get model runs that
  show slightly different precipitation inputs or roughness parameters producing sharply
  different inundation maps. Consultants often present a single deterministic run
  or insist their model is ''validated.'' I need a reusable procedure to decide when
  a model prediction is trustworthy for a particular decision, given that our systems
  may show sensitive dependence. Write a decision procedure my team can actually use:
  questions in order, what counts as an adequate answer, where the procedure stops
  with no, and where it hands off to an expert judgment. Include tests for whether
  sensitivity is structural chaos vs. ordinary uncertainty. Then run it on two or
  three cases: (1) a 100-year floodplain map based on a single calibrated model; (2)
  a real-time reservoir release decision during an incoming storm where ensemble forecasts
  diverge after 48 hours; (3) a proposed development in a coastal estuary where model
  runs with 1 cm sea-level-rise increments show threshold jumps in wetland loss. The
  procedure should say what cannot be done: when no model can answer the question
  in time."


