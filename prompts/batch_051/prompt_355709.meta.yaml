  I lead the policy team at a social platform with a large user base, and my job is
  to turn the platform''s prohibition on racist speech into rules that front-line
  moderators can apply at scale. The moderators are contract workers with a few weeks
  of training and high turnover; they handle hundreds of items a day and have at most
  a few minutes per decision. The stakes cut both ways. An overbroad rule chills legitimate
  discussion and punishes users for clumsy wording; an underinclusive rule lets coordinated
  bigotry travel under plausible deniability. Every removal must be defensible in
  an appeal, which means the rule needs to record which question was answered which
  way, not just a final verdict.


  I am a longtime reader of rationalist blogs and forums, and I have seen the standard
  arguments over whether a statement is racist because of the speaker''s intent, because
  of its effects on the audience, or because it functions as a covert signal—a dog
  whistle—that one audience hears as a call to action while another hears something
  innocuous. None of those positions, stated abstractly, tells my moderators what
  to do with the next post in the queue. I want you to write a reusable decision procedure—a
  checklist or a decision tree with the questions in a fixed order—for deciding whether
  a piece of text should be treated as racist speech under the platform''s rule. The
  procedure must be runnable by someone with no philosophy vocabulary; no "illocutionary
  act" or "hermeneutical injustice" survives contact with a queue of four hundred
  flags. But I also want you to be honest about what the simplification costs: which
  distinctions you are dropping, where the rule will over-trigger or under-trigger,
  and at which steps the procedure stops being mechanical and turns into a judgment
  call that has to be made by a human reviewer.


  Before giving the procedure, state in plain language the view of what makes a statement
  racist that the procedure encodes. Then run the procedure on four cases:

  1. a post that uses an unambiguous racial slur;

  2. a post that asserts, without slurs, a familiar racist thesis about a racial group''s
  criminality;

  3. a post that cites an officially race-neutral statistic on crime, framed in a
