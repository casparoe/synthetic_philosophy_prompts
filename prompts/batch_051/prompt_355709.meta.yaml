  For each case, show the rule''s path step by step, say what gets removed and what
  stays up, and mark any point where the rule''s answer conflicts with the intuition
  of someone raised on the intent-versus-impact debate. Finally, tell me what the
  procedure cannot settle in principle: which residual cases are genuinely underdetermined
  no matter how carefully the rule is written, and what a reviewer is doing—epistemically,
  not just administratively—when she decides one of them.


