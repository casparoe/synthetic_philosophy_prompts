  There''s a concept from the free will literature that''s stuck with me, "sphexishness."
  The canonical example is a digger wasp (a sphex, hence the name) that paralyzes
  a cricket, drags it to the entrance of its burrow, and then leaves it there while
  it goes inside for a quick check. Comes back out, grabs the cricket, drags it in.
  The thing is: if you nudge the cricket a couple inches away while the wasp is inside,
  the wasp comes out, drags the cricket back to the entrance, and then goes inside
  to check *again* — because that''s just the routine. You can do this over and over,
  and it will never occur to the wasp to skip the check and just finish the job. It
  looks like prudence but its actually a fixed action pattern, a loop with no one
  home behind it.


  I want you to write a short story, maybe 700–1,200 words, built around that idea.
  Here''s the constraint I''d enjoy: don''t do the obvious "guy realizes he''s been
  living in a sphex loop and it''s all hopeless" story. Instead, write from inside
  someone or something that is partly aware of its own loops and is trying, with limited
