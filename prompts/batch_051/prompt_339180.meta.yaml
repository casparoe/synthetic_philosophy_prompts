  record is messier then that, and I want to figure out what interpretive rule she''s
  actually running before I write her bench memo. You''re an expert on statutory interpretation
  and jurisprudence — take your time, maybe start by brainstorming the different rules
  that could fit her votes before you settle on one.


  Here are her prior votes, all from opinions she wrote or joined:


  - Tariff case: a statute taxed "vegetables" but not "fruit." She voted that a tomato
  is a vegetable, because that''s how ordinary people talk, even though botanically
  it''s a fruit.


  - Stolen airplane case: a federal statute made it a crime to transport a stolen
  "motor vehicle" across state lines. A guy flew a stolen plane across state lines.
  She joined an opinion saying a plane isn''t a "motor vehicle," because ordinary
  usage means land vehicles, even though the statute''s purpose of stopping interstate
  theft might be served by covering planes.


  - Church organist case: an old statute barred bringing foreigners into the country
  "to perform labor or service of any kind" under contract. A church hired an organist
  from England. She voted the statute doesn''t apply, saying Congress obviously meant
  manual labor, and reading "any kind" literally would give a result Congress never
  intended.


  - Attorney''s fees case: a civil-rights statute lets a "prevailing party" recover
  fees. A plaintiff won a preliminary injunction, and the defendant then changed the
  offending policy, so the case was dismissed as moot before any final judgment. She
  held the plaintiff wasn''t a "prevailing party," because that term in ordinary legal
  usage requires a final judgment on the merits, even though the suit achieved its
  goal.


  - Sex discrimination case: a statute makes it unlawful to fire someone "because
  of sex." She joined an opinion holding it covers firing a woman because she is attracted
  to women, on the ground that sex was a but-for cause of the firing. She didn''t
  look at legislative history; she said the text alone gets there.


  The new case: our state''s clean-water statute requires a permit before "discharging
  any pollutant into navigable waters." A factory discharges wastewater into a desert
  arroyo that''s dry most of the year. After heavy rain, the water in the arroyo flows
  into a navigable river about 40 miles away. The question is whether that arroyo
  counts as "navigable waters" for the permit requirement.


  Predict how she''ll vote. Which of her prior cases is the closest analog, and which
  interpretive rule (or small set of rules) best explains the whole track record?
  If her precedents genuinely underdetermine the new case, tell me what principle
  she''d be adopting with each possible vote, and give me your best guess with the
  reasons for it. Also name a future case, not on our docket, that would most cleanly
  tell the competing rules apart.


  At the very end, on its own line, put \answer{Yes} if you predict she votes that
  the arroyo counts as "navigable waters," or \answer{No} if you predict she votes
  it doesn''t.


