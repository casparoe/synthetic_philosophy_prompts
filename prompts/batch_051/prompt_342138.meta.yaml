  Williams''s argument restated:

  - Premise: A meaningful human life depends on categorical desires: projects, attachments,
  and concerns that are not conditional on already being alive, and these have finite
  horizons.

  - Premise: Immortality entails an unending future of the same person (identity over
  time).

  - Problem: Either the immortal person''s character remains recognisably the same,
  in which case categorical desires eventually run out / experiences become repetitive
  and tedious; or the person changes enough to avoid boredom, in which case the later
  person is sufficiently disconnected from the original that it is not clear we still
  have one person''s life continued, rather than a succession of persons.

  - Conclusion: Endless life would eventually be either boring or not a continuation
  of the same life; hence immortality is not a coherent object of desire for human
  persons.


