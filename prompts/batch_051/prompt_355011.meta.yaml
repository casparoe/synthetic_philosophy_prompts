  Here are the notes.


  Working title: The habitat problem for Darwinian theories of culture.


  Claim 1. The gene analogy quietly assumes culture comes in discrete, countable,
  faithfully copied units. In genetics the unit is anchored by a material substrate
  — DNA plus a copying machinery with a measureable error rate. In culture the unit
  is whatever the investigator decides to count: a word, a melody, a handshake, a
  recipe, a belief, a whole ritual. So the meme isn''t discovered; it''s scored.


  Claim 2. I don''t want to make the usual complaint that memes are vague. My point
  is different. Even if we grant countable units, the Darwinian triad (variation,
  replication, selection) only gets you change, not adaptation. Adaptation requires
  an environment that supplies a consistent selective gradient. Genes mostly face
  an environment that exists apart from them — drought, predators, temperature. Memes
  face an environment that is mostly other memes plus the bottlenecks of human cognition.
  The landscape is constantly re-landscaped by the very traits under selection.


  Claim 3. If the fitness landscape is endogenous like that, the usual payoff of Darwinism
  goes missing. In biology, selection explains apparent design by appealing to an
  environment that isn''t itself designed by the organism. For memes, saying a cultural
  item spread because it was fit risks circularity: fit means it spread, it spread
  because it was fit. Unless we can measure meme fitness independently of spread,
  we have a vocabulary, not an explanation.


  Claim 4. The constructive move. Keep the selection machinery but stop treating the
  gene as the template. Think of cultural evolution as more like ecosystem succession
  or host–parasite dynamics: the interesting question is not which unit wins but what
  makes a cultural trait invasive, endemic, or obligately symbiotic. A meme doesn''t
  need sharp boundaries; it needs a niche. That''s why some ideas survive only inside
  institutions (obligate symbionts), some are generalists, and some are weeds that
  bloom after a disturbance. I''d rather talk about niche-dependence and landscape
  engineering than about fads and traditions.


