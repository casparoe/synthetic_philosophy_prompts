  — do we actually get different predictions from the niche/ecology version than from
  the standard meme version? And does the critique apply to Dawkins''s original modest
  claim, or only to stronger ''science of memetics'' versions? I also worry I''m just
  reinventing Sperber''s ''epidemiology of representations'' with different labels
  — I don''t want to relabel old work, but I have read that program mainly secondhand."


