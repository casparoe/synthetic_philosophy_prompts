  "Essay notes (rough): Working title: The Habitat Problem for Darwinian Theories
  of Culture.


  Claim 1: The gene analogy smuggles in an assumption that culture consists of discrete,
  countable, faithfully copied units. In genetics, the unit is anchored by a material
  substrate — DNA with a copying machinery that has an error rate we can measure.
  In culture, the ''unit'' (the meme) is whatever the analyst decides to count: a
  word, a tune, a gesture, a recipe, a belief, a whole ritual. So the unit is not
  discovered but scored.


  Claim 2: But I don''t want to make the usual ''memes are too vague'' complaint.
  I want to make a different point. Even if we grant countable cultural units, the
  Darwinian triad (variation, replication, selection) only gives you change, not adaptation.
  Real Darwinian explanation needs an environment that supplies consistent selection
  pressures. Genes have an environment: predators, climate, scarcity. Memes have an
  environment too, but it''s mostly other memes plus the limitations of human cognition.
  So the ''environment'' is largely endogenous — it coevolves with the units. That
  makes it more like ecology than like physics: the selective landscape is constantly
  being rebuilt by the very things under selection.


  Claim 3: This endogenous fitness landscape undermines the usual explanatory payoff
  of Darwinism. In biology, selection can explain why organisms look designed (fit
  to an environment that exists independently). In culture, if the environment is
  other memes, saying a meme spread ''because it is fit'' risks circularity: fit =
  whatever spreads; spreads = whatever is fit. The theory needs an independent way
  to measure fitness or it becomes a vocabulary, not an explanation.


  Claim 4 (the positive bit): The way out is to keep the Darwinian machinery but drop
  the gene as the canonical template. Think of cultural evolution as more like ecosystem
  succession or host–parasite dynamics, where the interesting question is not ''which
  unit wins?'' but ''what conditions make a cultural trait invasive, endemic, or extinct?''
  A meme doesn''t need to be a unit with a fixed boundary; it needs a niche. That''s
  why some ideas survive only inside institutions (they''re like obligate symbionts,
  can''t live outside a host structure), some are generalists, and some are weeds
  that bloom after a disruption. I''d call these ''niche-dependence'' and ''landscape
  engineering'' instead of fads and traditions.


