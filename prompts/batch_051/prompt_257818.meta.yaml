  no additional moral reasons; they are at most epistemic guides to underlying moral
  reasons (fairness, harm, reliance). If the convention diverges from what underlying
  morality requires, one should follow the underlying morality, not the convention.
  Visitors should follow local conventions only when and because doing so is independently
  right.


