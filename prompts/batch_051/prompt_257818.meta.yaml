  Let me define the two camps:

  - Camp 1: "Convention-dependence" view / "practice moralists": participating in
  or entering a community with established conventions gives one pro tanto moral reasons
  to conform, over and above the underlying moral considerations, because others''
  reasonable expectations and reliance matter morally. Visitors who enter a practice
  acquire these reasons.

