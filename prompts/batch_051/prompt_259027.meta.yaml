  I cover science and ideas for a general-interest magazine, and I''ve come to suspect
  that we run a double standard in how we treat quantitative forecasts. Here is the
  asymmetry I keep seeing. A demographer projects a fiscal crisis from the age structure
  of a population and the trend in fertility; reporters write it up as a finding,
  complete with uncertainty ranges. An epidemiologist projects a disease wave from
  contact rates; no one says this is unscientific. But when a researcher builds a
  model from long-run historical data — real wages, the number of elites relative
  to the state''s fiscal capacity, the oversupply of credential holders competing
  for a fixed elite — and forecasts a wave of state breakdown or political instability,
  the same editors call it speculation, or say that history is simply not the kind
  of thing one predicts. The second researcher is working in the cliodynamic tradition,
  the structural-demographic approach associated with Peter Turchin''s work on secular
  cycles. The forecast is met with a different standard of evidence, even when its
  variables are no less quantitative than the demographer''s.


  The question is whether anything justifies that difference in reception. The distinctions
  people reach for are these: the older disciplines have a better out-of-sample track
  record; social and political systems are reflexive or open-ended in a way that demographic
  and epidemiological systems are not; outcomes like "instability" are badly defined
  and the historical record is selectively preserved; predictions of political disorder
  are self-fulfilling or self-undermining in ways projections of aging or warming
  are not; or the political subject matter leads readers to demand more. I''d like
  you to do three things. First, identify which of these distinctions, if any, genuinely
  separates the accepted forecasts from the dismissed ones — and whether there is
  a better justification I haven''t listed. Second, test the surviving candidate against
  nearby cases where the asymmetry wobbles: recession forecasting, which has a poor
  record yet retains authority; disease forecasts that change behavior and thereby
  the future; climate projections that aim to prevent the very outcome they predict;
  demographic projections that depend on individual choices. Third, deliver a verdict:
  should we keep the asymmetry, reverse it, or give it up? And as is my habit with
  sources, tell me what would change your mind — which argument or evidence would
  make you reverse a verdict in the other direction — and where in your reasoning
  you think failure is likeliest.


