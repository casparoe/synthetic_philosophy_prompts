  I''m an undergraduate taking a course on the ethics of lying, and we''ve spent several
  weeks on Augustine''s absolutism: his view that every lie is a sin, including the
  helpful lie told to save a life or protect an innocent person, and that in hard
  cases the right response is to keep silent or accept the harm rather than speak
  falsely. I''m writing a paper on what would actually happen if a society tried to
  live by that rule, and I''d like a careful, reasoned prediction rather than a survey
  of the literature.


  Answer as an expert in Augustine''s ethics and in institutional design and moral
  psychology. Before committing to a prediction, brainstorm the main domains of social
  life where truth-telling does real work, and identify the three or four where an
  absolute prohibition on lying would bite hardest.


  The scenario: imagine that, beginning in 2026, a modern liberal democracy succeeds
  in making Augustine''s prohibition on lying a genuinely internalized social norm.
  By this I mean the great majority of citizens come to regard lying as categorically
  wrong, teach this to children, and enforce it through guilt and social disapproval,
  not merely through the legal system. Nothing else about human nature, institutions,
  or the law changes.


  Give me your reasoned prediction of how this society looks after forty years, covering
  at least four of these domains: medicine, law enforcement and criminal justice,
  diplomacy and international relations, parenting, advertising and public relations,
  journalism, and ordinary social courtesies. For each domain, say which practices
  survive by shifting to silence, evasion, or literally true but misleading speech;
  which practices collapse or go underground; and what compensatory norms or institutions,
  if any, arise.


  Lead with your overall verdict in the first sentence, then give the reasoning, with
  no preamble and no restating of the question.


  As you reason, please separate what is settled from what is genuinely contested
  among people who know Augustine. For example, it is settled that he condemned even
  the lie told to save a life; it is contested how much room his definition of lying
  leaves for silence and for speech that is literally true but misleading, and how
  far his absolutism depends on theological premises rather than on considerations
  a secular society could share. Do not present a contested scholarly reading as the
  consensus; if one of your predictions depends on a particular reading of Augustine,
  flag it.


  Finally, tell me which single prediction you are least confident in, and what evidence
  about real-world communities that have tried to enforce strong truth-telling norms
  would do most to change your mind.


