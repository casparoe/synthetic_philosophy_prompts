  Wait, let''s make sure list is accurate. The inefficacy objection: "My individual
  action (not flying, not eating meat, voting) makes no perceptible difference; therefore
  I have no obligation / it''s morally pointless." Standard replies:

  1. Expected utility / threshold uncertainty: even if your chance of being the decisive/pivotal
  voter is tiny, the benefit so large that expected value can outweigh cost. (For
  voting, Parfit/Downs; for climate, Broome''s "small probabilities of large harms";
  Kagan''s "if a billion people suffer...").

  2. Moral purity / integrity / symbolism / expressive reasons: even if no difference,
  it''s about who you are, complicity, not participating in wrongdoing (e.g., Williams''s
  integrity; "I don''t want to be the kind of person who..."). Or "it''s wrong to
  benefit from/complicity in a bad practice."

  3. Universalizability / Kantian: act only on maxims you could will as universal
  law; asks what if everyone did it. (Though sometimes this is criticized as the "generalization"
  fallacy; but it''s a standard reply.)

  4. Rule/conventional regularity: if everyone follows a rule, consequences follow;
  moral rules aren''t about individual acts but about the code/practice that would
  be optimal.

  5. Complicity / participation in collective wrongdoing: you''re a member of a group
  that jointly causes harm; individual shares responsibility (Kutz''s "Complicity";
  "collective action problem").

  6. Threshold/tipping points: actual climate/meat systems have thresholds; if enough
  people switch, tipping points will trigger; you might be the one to tip it. But
  this is kind of expected value variant.

  7. Social change / norm cascade: your act influences others, creating social proof,
  so the causal impact is larger than the direct effect (snowball/information cascade;
  "moral entrepreneurs").

  8. The "no difference" premise is false because of market/campaign effects: boycotts
  show causal impact via market prices; one vegetarian reduces expected amount of
  meat by market elasticity (Norcross''s "puppies, pigs and profits" ~ one person''s
  vegetarianism spares roughly x animals because supply adjusts probabilistically).
  This is a standard one—the "causal inefficacy is empirically false" reply.


