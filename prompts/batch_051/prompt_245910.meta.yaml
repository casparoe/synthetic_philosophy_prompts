  and is immutable, neither condition is met. Therefore petitionary prayer is either
  (a) conceptually confused (we address a being who cannot be moved) or (b) instrumentally
  appropriate only by changing us (confession, gratitude, aligning affections) rather
  than actually petitioning. The theory gives a tidy test: ask "Would my prayer make
  a difference to God?" Since No, the petitionary component is idle.


