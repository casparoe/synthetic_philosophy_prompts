  Argument: "Why a rational agent should pay acausal blackmail."


  Setup definitions: an acausal blackmailer is a powerful agent that cannot causally
  interact with you but has publicly precommitted to run and punish a faithful simulation
  of you (or of whoever you are) if you don''t pay. Paying cannot causally stop the
  simulation; at best it is correlated via the blackmailer''s prediction.


  Numbered steps:


  1. A rational agent should choose acts that maximize expected utility over all outcomes
  it can influence or be correlated with, not just outcomes it causally controls.

  2. If you don''t pay, the blackmailer''s prediction (which is highly accurate) makes
  it very likely that a sufficiently faithful simulation of you will be run and punished.

  3. If you pay, the same prediction makes it very likely that the simulation is spared
  or not run.

  4. The utility difference between these two states of affairs — punished-simulation
  vs. spared-simulation — is as large as the disutility of your own physical punishment,
  because the simulation is, by construction, a perfect or near-perfect copy of you.

  5. Therefore paying maximizes expected utility relative to not paying.

  6. Therefore a rational agent should pay acausal blackmail.


