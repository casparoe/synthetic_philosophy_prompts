  would say your decision procedure''s payoffs across copies count. Step 1 smuggles
  in Evidential Decision Theory / functional decision theory ("can influence or be
  correlated with" — in EDT correlation matters; in CDT causal control matters). Step
  2''s probability statement is evidential, not causal. So the argument goes through
