  I convene a university reading seminar on linguistic relativity that has been meeting
  for over a year, and our central argument has hardened into a standoff. We read
  the same passages and still divide into two camps; the same exchange recurs every
  meeting. The founding text under dispute is Edward Sapir''s Language: An Introduction
  to the Study of Speech (1921), chapter one. The contested passage is:


  "Speech is a human activity that varies without assignable limit as we pass from
  social group to social group, because it is a purely historical heritage of the
  group, the product of long-continued social usage. It varies as all creative effort
  varies—not as consciously, perhaps, but none the less as truly as do the religions,
  the beliefs, the customs, and the arts of different peoples."


  One camp treats this as licensing the claim that different languages impose different
  cuts on experience: the "without assignable limit" and the parallel with religions
  and arts mean the conceptual schemes of communities genuinely diverge. The other
  camp says the passage only denies that speech is biological like walking; it says
  nothing yet about whether thought is affected by the patterns of a particular language,
  and the variation could be superficial. Our disagreement is no longer about the
  truth of linguistic relativity but about what this passage can even be used to establish.
  I do not need a verdict on who is right. I want a diagnosis of why the debate has
  stalled: are the camps disagreeing about the referent of "varies," about the logical
  implications of the passage, about what counts as relevant evidence, or about a
  prior question such as whether "thought" is the sort of thing that can be shaped
  by a purely historical inheritance? My own hypothesis, offered only as a hypothesis,
  is that one camp is thinking of language as a system of available distinctions and
  the other as a set of observable verbal practices, and the two senses of "language"
  are being traded on. Tell me whether that diagnosis is sound, and, given your diagnosis,
  what would actually count as progress: a distinction, an empirical finding, a reformulated
  question, or an acknowledgment that the argument is not resolvable because it is
  not a single argument.


