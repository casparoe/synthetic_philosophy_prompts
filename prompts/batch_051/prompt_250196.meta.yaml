  Let''s reason about lexical threshold negative utilitarianism (LTNU). The view:
  there is a threshold of suffering intensity (or perhaps duration?) such that no
  amount of mild pleasure can outweigh a single instance of suffering above the threshold;
  below the threshold, trade-offs are ordinary. Some versions say: one unit of extreme
  suffering cannot be compensated by any finite amount of mild pleasure; or extreme
  suffering has lexical priority over all mild pleasures and mild pains.


  Constructing a thought experiment where LTNU gives a counterintuitive verdict: The
  classic problem is the "one pinprick vs. one torture" — no, lexical threshold says
  torture is lexically worse, so avoid torture even at cost of many pinpricks. The
  counterintuitive direction: lexical threshold negative utilitarianism might be too
  demanding in avoiding tiny risks of extreme suffering; e.g., it would require a
  person to sacrifice all mild pleasure to avoid a tiny probability of a severe pain,
  because expected value with lexical priority... Actually lexical priority doesn''t
  straightforwardly combine with probabilities. Another issue: if the threshold is
  sharp, it says the difference between just below and just above threshold is infinite,
  which is implausible; constructing a case around threshold discontinuity: two pains
  differing by a tiny amount straddle the threshold, and the theory treats one as
  lexically worse than any amount of the other, leading to verdicts like preferring
  any number of just-below-threshold pains to one just-above-threshold pain, which
  seems arbitrary. That''s a known critique (the "arbitrariness of the threshold"
  / "threshold problem"). The prompt could ask to construct a case that isolates this
  discontinuity.


