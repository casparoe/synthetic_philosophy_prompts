  Potential draft:


  I''m trying to extract a consistent policy from my gut verdicts about gambles with
  unbounded or undefined expected values. Take these cases.


  1. Ordinary St. Petersburg: a fair coin is tossed until it lands heads. If the first
  heads is on toss n, I receive 2^n dollars. I would not pay more than about $25 to
  play, even though the expected monetary value is infinite. My reaction is that expected
  value is the wrong tool when the upper tail is unbounded.


  2. Truncated St. Petersburg: same game but the bank caps the number of tosses at
  k, so the maximum payout is 2^k. I would pay the expected value, and my willingness-to-pay
  rises as k rises, but only slowly. The infinite limit feels different in kind from
  any finite truncation.


  3. Pasadena game: same coin process, but if the first heads is on toss n, the payoff
  is (-1)^{n-1} times 2^n/n. The positive and negative contributions each diverge,
  so the expectation is undefined. Yet if you write the terms in their natural order,
  the series sums to ln 2. My gut says this game is worse than St. Petersburg as an
  object of choice: I wouldn''t pay to play it, and I wouldn''t sell it for any positive
  price either, because the "expected gain" can be made to look like any real number
  by reordering the possible outcomes.


  4. Pasadena with a finite cap at k: if the toss limit is k, the expected value exists
  and approaches ln 2 as k grows. I would pay that finite expectation when k is specified.
  I don''t see why the limiting procedure should stop at k.


