  The Pasadena paradox is a classic expected-utility puzzle: a game where the expected
  value is conditionally convergent / undefined (sum of alternating series). This
  is fairly well-known in rationalist circles (St. Petersburg paradox, Pasadena paradox).
  A rationalist blog reader voice fits well. Type "report verdicts on cases and ask
  what principle captures them" could work: give verdicts on various gambles with
  undefined or weird expected values.


  Actually the Pasadena paradox: a game where you flip a coin until tails, and payoff
  is (-1)^(n-1) * 2^n / n. The expected value is the alternating harmonic series,
  which converges conditionally to ln 2, but if you rearrange the terms you can get
  any value. The paradox is that there seems to be no well-defined expected value,
  yet intuitively one might compare it to other gambles. There''s also the Altadena
  game, etc.


  This lends itself nicely to a "verdicts on cases" type: the asker gives their gut
  verdicts on a series of gambles (Pasadena, Altadena, St. Petersburg, a shifted version,
  a dominated one, etc.) and asks what principle captures their pattern, what it says
  about further cases, and which verdicts must go. That''s a great reflective-equilibrium
  prompt: concrete, in-the-weeds, meaningful without search.


