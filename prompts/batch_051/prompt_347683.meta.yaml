  Potential prompt:


  ---


  I am trying to work out what I actually believe about when small causes matter in
  history — the "for want of a nail" problem — and I find that my gut verdicts on
  cases pull in different directions. I would like to know whether there is one principle,
  or a small set of principles, that captures the pattern, and if not, which of my
  verdicts I should revise or give up.


  Here are the cases and my verdicts.


  1. The thrown shoe. In the standard fictionalized example, a courier''s horse throws
  a shoe on the morning of a battle; the orders arrive an hour late; the attack goes
  off at the wrong time and uphill; the army is destroyed; the kingdom is annexed.
  I think the horseshoe was a genuine cause of the defeat and the annexation, but
  only because the plan had no slack. I would not take it to show that horseshoes
  decide dynastic outcomes in general; it shows that a trivial failure can be load-bearing
  when everything else in the chain is tightly coupled and nothing is redundant.


  2. The wrong turn. Take the familiar 1914 assassination scenario, and take the standard
  account at face value: an archduke survives a first attempt on his life, his driver
  makes a wrong turn, the car stops in front of the assassin, and the killing sets
  off a chain of ultimatums and mobilizations. I believe the wrong turn determined
  the date and the particular trigger of the war, but I do not believe it determined
  whether a European war would occur. The system had many live sparks; another crisis
  would probably have produced a similar war within a few years. The wrong turn changed
  when and how, not whether.


  3. The storm. An invasion fleet is scattered by an unseasonable storm. The invasion
  fails; the cause of the dynasty it was meant to restore collapses; thirty years
  later the rival regime falls to revolution. I think the storm was decisive for the
  failed landing and perhaps for the timing of the dynasty''s demise, but not for
  the regime''s fall, which was overdetermined by debt, military overreach, and domestic
  unrest. The storm matters at the level of the campaign, not at the level of the
  later revolution.


  4. The deciding vote. A grant panel splits four to four on a proposal; the chair,
  tired and wanting to end the meeting, casts a deciding vote to fund it. The project
  succeeds and opens a new field. I think the chair''s flip was a genuine cause of
  the discovery. No one else was doing the work, the proposal would otherwise have
  been dropped, and there was no redundant path to the result. A procedural micro-decision
  can be fully load-bearing.


  5. The false alarm. During a standoff, a faulty early-warning sensor registers an
  incoming attack. The duty officer, acting against protocol, waits for corroboration
  rather than passing the alert upward. No war follows. Years later we learn that
  the system produced many such false alarms. I find myself saying two things at once:
  the officer''s judgment mattered enormously that night, and the counterfactual of
  escalation is terrifying; but I resist saying the glitch, or the officer''s decision,
  caused the peace, because the system produced near-miss after near-miss and peace
  was supported by many redundant checks. A single glitch feels like the wrong unit
  of explanation, even though the night-by-night counterfactual seems dramatic.


  6. The garbled schedule (the case I keep going back and forth on). A scheduler misreads
  a voicemail and books a candidate''s flight two hours too late; the candidate, exhausted,
  gives a poor debate performance; the candidate loses the election by a margin smaller
  than the audience in the missed district; the new government then pursues a very
  different policy, with consequences that persist for decades. On the one hand this
  looks like the deciding vote: the change had no redundancy, and the counterfactual
  path is clear. On the other hand it looks like the false alarm: an election is a
  densely coupled process full of near-misses, and treating one scheduling error as
  the cause of the new policy feels like the kind of history I rejected in the storm
  case.


  Is there a coherent account of what it is for a small event to be load-bearing,
  or a cause at the appropriate level, that gets all or most of these verdicts? I
  would like the principle stated precisely, with each clause motivated by one of
  the cases. Please also say what the principle predicts about the garbled-schedule
  case, and which of my verdicts, if any, it forces me to drop or amend. If no single
  principle can get all of them, I would rather hear the candidate principles and
  the trade-off between saving every verdict with complexity and accepting a simpler
  principle that overturns one or two.


