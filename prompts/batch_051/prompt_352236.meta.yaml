  Draft Cox prompt:


  "I''ve spent years reading LessWrong and the broader rationalist blogosphere, so
  the Jaynes/Cox line has been drilled into me: probability theory isn''t just a tool
  for dealing with randomness, it''s the unique calculus of consistent plausible reasoning,
  and Cox''s theorem is the proof. Meanwhile my day job is machine learning, and I
  can''t help noticing that the proof looks a lot like the representation theorems
  I already live with — Savage or von Neumann–Morgenstern style, where if you accept
  a list of axioms, the only representations left are the things the theorem wanted
  to sell you. So I have a suspicion the slogan is doing more work than the theorem,
  but I don''t trust my own ability to check that without importing the same assumptions.


  What I''d like is a translation plus a residue report. Restate the Cox/Jaynes position
  — the desiderata (plausibility as a real number, consistency under different orderings,
  the Boolean structure of propositions) and the conclusion that any such system is
  isomorphic to probability theory — in the vocabulary I actually think in: model
  outputs and constraints, representation theorems, the choice of scalar objective,
  loss functions, calibration, KL divergences, invariances. Treat plausibility as
  the output of a learned scoring function over propositions, the desiderata as constraints
  on a reasoning API, and the sum and product rules as the only two losses left standing.
  Then tell me exactly what did not survive the translation. Where did my ML vocabulary
  have to fudge the philosophy, and where does the theorem itself lean on assumptions
