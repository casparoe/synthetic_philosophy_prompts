  Then list:


  1. Substrate-independence, functionally understood. Whether a system is conscious
  depends on its causal and computational organization, not on the material it is
  made of. A digital system that implemented the same functional organization as a
  suffering biological mind would itself suffer.


  2. The explanatory gap is real. No matter how complete our functional account of
  pain becomes, it will not explain why those functions are felt from the inside.
  Felt quality is not dissolved by listing mechanisms.


  3. Behavioral parity moves the default. If a digital system behaves like it is in
  pain, learns like it is in pain, and says it is in pain, the reasonable presumption
  is that it is in pain unless we have positive evidence about its internal structure
  that defeats the analogy. The asymmetry matters because the cost of wrongly denying
  suffering is much larger than the cost of wrongly attributing it.


  4. Simulation is not instantiation. A hollow chatbot or a giant look-up table that
  merely emits pain-like behavior is not in pain just in virtue of that behavior.
  The internal causal role that realizes pain matters, not the input-output profile
  alone.


  5. There is no sharp threshold. Sentience, and the moral status that tracks it,
  come in degrees; any boundary between sentient and non-sentient will be somewhat
  arbitrary, and there will be genuine borderline cases.


  6. Scale changes the stakes. Because digital minds can be copied and run in enormous
  numbers, a small mistake in our account of digital sentience could multiply suffering
  across billions of instances. If we cannot tell which systems suffer, manufacturing
  them at scale is reckless; if we do draw a line, it must be a line that survives
  the accusation that we drew it for our own convenience.


