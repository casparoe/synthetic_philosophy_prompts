  In-the-weeds aspects:

  - Host states are often the problem: they can''t commit not to expropriate (the
  "hold-up problem"). The treaty solves this by binding arbitration and 99-year leases.

  - Selection: who moves to a city with no income tax and flexible labor law? Could
  attract high-productivity people and firms, or could attract tax evaders and low-quality
  operators. Which direction dominates?

  - Competition: do ordinary states reform their own law/tax systems, or do they retaliate
  by restricting the cities'' access to infrastructure, refusing visas, blocking capital
  flows, denouncing the treaty?

  - Public goods: who pays for roads, policing, schools? Can the operator internalize
  enough via land-value capture?

  - Exit vs. voice: residents who can easily leave may make city governance more responsive,
  but operators may also prefer tenants who don''t demand much.

  - Regulatory arbitrage: the city might specialize in areas where legal rules are
  costly (land titling, business incorporation, contract enforcement, labor regulation),
  but that specialization might not be the ones that maximize broad development.

  - "Opting out" partial: even the city exists inside a host state''s territory, depends
  on host military, international banking, etc. So can you really opt out? The prediction
  should address whether it''s genuine opt-out or just layered sovereignty.

  - Negative externalities: money laundering, environmental dumping, labor abuses,
  "law-following" by firms that then compete unfairly.

  - Migration not infinite: people are anchored.


