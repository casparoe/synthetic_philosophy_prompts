  ---


  I am an undergraduate in a philosophy of biology course, and we have spent the last
  several weeks on mechanistic explanation. The position we keep returning to is that
  an explanation in biology is explanatory to the extent that it specifies the component
  parts and operations whose organization produces the phenomenon under study; the
  explanatory force is supposed to come from that productive organization, not from
  merely subsuming the phenomenon under a law or a statistical association.


  I find myself unable to tell, in any particular case, whether a proposed mechanism
  is actually doing that work or whether it is a causal-sounding redescription: the
  authors already know the phenomenon, they fill in a plausible parts-and-operations
  story, and they label the arrows and boxes with terms that match the phenomenon.
  My worry is that the difference between a real mechanism explanation and a redescription
  is one of after-the-fact presentation rather than of content, and I want to know
  whether evidence could bear on it.


  Concretely: take a familiar cellular process, such as a signal-transduction pathway
  or the way a cell maintains a concentration gradient, where a mechanism explanation
  is offered. Design the strongest test you can for the claim that the proposed mechanism
  is explanatory because its identified parts and operations are organized to produce
  the phenomenon, rather than being a post hoc reconceptualization that adds no content.
  Be precise about what observation or intervention would count as evidence for that
  claim and what would count against it. Then say what even a positive result would
  not settle. In particular, I want to know how much of the distinction is empirically
  testable and how much remains a philosophical decision about what makes something
  explanatory.


