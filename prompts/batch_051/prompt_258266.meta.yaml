  Key disanalogies of natural selection vs gradient descent:

  - In supervised training, there is a fixed loss function (e.g., distance to labels)
  specified in advance by an external designer. In evolution, "fitness" is not a fixed
  external target; it''s relative reproductive success in a coevolving, changing environment,
  which can shift, be frequency-dependent, be niche-constructed. There is no fixed
  gradient: the "landscape" changes as the population moves (Sewall Wright''s shifting
  balance; fitness landscapes are not static).

  - Gradient descent follows the local gradient of a smooth loss; evolution works
  by random mutation/recombination, includes drift, no direction, can move to lower
  fitness via drift or across valleys; non-monotonic.

  - In ML, the parameters are trained in parallel batches; in evolution, selection
  operates on whole organisms, pleiotropy, linkage, sexual reproduction.

  - Population/environment coupling: fitness is not an external scalar but an interaction;
  the environment partly is other evolving organisms (Red Queen).

  - Natural selection requires heritable variation; the source of variation (mutation)
  is random with respect to fitness; in gradient descent, perturbations are directed
  by the gradient after evaluation.

  - Optimization vs satisficing: evolution doesn''t guarantee global optima; organisms
  are "good enough", often with kludges.

  - Teleology: gradient descent literally aims at minimizing a loss defined by a designer;
  evolution has no aim. But the analogy''s purpose is to explain how design without
  a designer is possible.


  Where it maps:

  - population of variants ↔ parameters/weights in a model (or a population of models)

  - differential survival/reproduction ↔ selection/training signal (the loss evaluation)

  - heritable variation/mutation ↔ random perturbation / stochastic gradient noise

  - fitness ↔ negative loss (or loss as "mismatch")

  - adapted phenotype ↔ trained model

  - generation ↔ training epoch/iteration


