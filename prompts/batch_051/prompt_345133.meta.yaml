  even if much worse than the lives under the sustainable policy.

  4. So no individual is worse off than they would otherwise have been (had the alternative
  policy been chosen, they wouldn''t have existed).

  5. If no individual is worse off, no individual is wronged.

  6. If no individual is wronged, the choice isn''t wrong at all. (Or: nothing wrong
  has been done.)

  7. But the depletion policy is clearly morally wrong.

  8. Contradiction. Therefore the initial principle (1) or the inference is wrong.


