  The argument to "prove too much":

  1. You wrong someone only if you make them worse off than they would otherwise have
  been. (The person-affecting / comparative harm principle.)

  2. In a choice between two energy policies (e.g., a sustainable one and a one-time
  depletion-and-collapse one), the choice affects who will exist; after enough time,
  the entire population under one policy shares no individuals with the population
  under the other, because conception depends on when and whether particular people
  meet, etc.

