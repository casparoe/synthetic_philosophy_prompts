  The slogan "it''s not science unless it can be falsified" could mean:

  1. Minimal logical/definitional claim: a statement is empirical only if there''s
  at least one possible observation statement inconsistent with it — a criterion of
  empirical content, not of scientific status or of good science. Possibly plausible
  but weak.

  2. A decision criterion (naive falsificationism): scientists should reject a theory
  as soon as a conflicting observation is accepted — false and not Popper.

  3. A practical criterion of science vs pseudoscience: a field isn''t science if
  its practitioners never specify what would count against their core claims — perhaps
  a more defensible social/practice-level reading.

  4. A criterion of "scientific theory" as opposed to "metaphysics": unfalsifiable
  claims may be meaningful but not empirical science — plausible, but doesn''t get
  you to dismiss an entire program, since scientists can have unfalsifiable background
  assumptions/metaphysics.

  5. An axiological claim: unfalsifiable theories are worth less / not worth pursuing;
  or falsifiable theories should be preferred. Distinct.

  6. A criterion of testability-in-principle vs in-practice: e.g., string theory may
  be falsifiable in principle (some energy scale) but not testable now. "Can be falsified"
  ambiguous between logical possibility and current technology.

  7. A claim about demarcation of whole fields over time: some parts of a field may
  be unfalsifiable while others are testable; a field is science only if its central
  research program is falsifiable.

  8. Popper''s sophisticated version: we should adopt methodological rules forbidding
  ad hoc rescues, and appraise a program by whether it generates novel testable predictions;
  "falsifiable" as a regulative ideal.


