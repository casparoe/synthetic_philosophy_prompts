  "Two people in a reading group I''m in got into a long argument about Émilie du
  Châtelet''s Discours sur le bonheur (apparently the title is sometimes translated
  as Discourse on Happiness). I''m the only one there who isn''t in grad school for
  something; I''m a backend engineer and mostly lurk. The bit that set them off is
  near the end, where she says, roughly, that you need passions to be happy, and that
  you should not always go around stripping away the illusions that attach you to
  things, because those illusions are often what make life tolerable and interesting.
  One of them, Dana, said the passage is either banal or dangerous. If illusions just
  means ''engagement'' or ''selective focus,'' it''s banal; if it literally means
  false beliefs, then she''s telling us to be less accurate about our own lives for
  the sake of feeling good, which Dana thinks is self-deception and unstable anyway,
  because you can''t knowingly decide to believe what''s false. The other, Sam, said
  that''s too fast. Sam''s take is that du Châtelet is talking about a real phenomenon:
  there are things—love, long projects, political hopes—that you can only care about
  properly if you don''t keep them at arm''s length and audit every detail, and that
  ''illusion'' is her word for the forward-leaning part of attention, not for lying
  to yourself. Dana came back with: but she says the person who has no illusions is
  miserable, and that sounds like she''s saying happiness requires being wrong about
  something, at least sometimes. Sam replied: she says that because the person who
  insists on total accuracy about their own prospects and relationships ends up living
  in a kind of cold storage, and that''s an observation, not a recommendation to reason
