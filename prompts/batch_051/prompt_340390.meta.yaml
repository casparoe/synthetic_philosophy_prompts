  culture, holds that citizens are generally warranted in trusting public institutions
  unless there are specific grounds for suspicion; the alternative, often associated
  with American civic suspicion, treats institutional power as default illegitimate
  and demands continuous oversight. The Lives of Others seems, on its surface, to
  confirm the second: the East German state spies on innocent people, ruins lives,
  and treats art as a threat. But the film''s moral core is a single Stasi officer,
  Wiesler, who decides to falsify reports and protect the playwright he is watching.
  What does the film actually show about the rationality of trust? Does it show that
  institutions are inevitably corrupt and only individual defection saves us? Or does
  it show something subtler, that trustworthiness can exist even inside untrustworthy
