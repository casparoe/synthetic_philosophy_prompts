  Aristotle''s views on money and exchange:

  - In Nicomachean Ethics V.5, Aristotle explains reciprocal justice in exchange.
  He introduces need (chreia) as what holds the community together; money was introduced
  as a representative of need by convention (nomisma); money makes all goods commensurable,
  though strictly speaking they are not commensurable; it is a measure that allows
  exchange.

  - In Politics I.8-10, Aristotle says wealth-getting has a natural limit (to supply
  household needs) and unnatural chrematistics aims at unlimited accumulation for
  its own sake; the most unnatural is usury because it seeks profit from money itself
  rather than from its use in exchange. Money is sterile. He also says money can be
  changed by convention and becomes useless.


  A cross-field parallel: The distinction between natural economics (limited, use-oriented)
  and unnatural chrematistics (unlimited, accumulation-oriented) might parallel the
  distinction in ecology between sustainable yield and extractive overexploitation?
  Or between a healthy physiological appetite (regulated by need) and a pathological
  addiction (self-perpetuating). But those are not "fields" in the sense of theorem/legal/biological
  mechanisms. The type examples pair theorem with moral principle, programming idiom
  with metaphysical distinction, legal doctrine with decision-theoretic result, biological
  mechanism with epistemic norm. So a structural resemblance between things that don''t
  usually meet.


