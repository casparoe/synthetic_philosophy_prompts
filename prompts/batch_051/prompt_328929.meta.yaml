  Hempel''s account of confirmation (satisfaction criterion): a hypothesis "All F
  are G" is confirmed by any object that satisfies both F and G (a black raven), and
  disconfirmed by F & not-G (a non-black raven). For a non-F, non-G object (white
  shoe), does it confirm? Under Hempel''s criterion, "All F are G" is equivalent to
  "All non-G are non-F"; a white shoe (non-G, non-F) satisfies non-G and non-F, so
  confirms. Hempel''s "logic of confirmation" says Nicod''s condition applies to the
  hypothesis as a universal conditional: any object that satisfies both antecedent
  and consequent (black raven) confirms; any object that satisfies antecedent but
  not consequent (non-black raven) disconfirms; objects that do not satisfy antecedent
  are neutral—BUT via the contrapositive, non-black non-ravens confirm. Hempel''s
  conclusion: the white shoe does confirm. The paradox is psychological: we have background
  information that the class of ravens is small and the class of non-black things
  is huge, etc.


