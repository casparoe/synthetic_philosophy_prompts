  Quantum immortality thought experiment: In Everettian many-worlds, every quantum
  measurement branches. Consider a quantum suicide machine: a device that kills you
  based on a quantum event (e.g., a photon''s spin). The idea: from the first-person
  perspective, you will always find yourself in the branch where you survive, because
  in branches where you die, there is no "you" to observe anything. So you can never
  subjectively experience your own death; you''ll experience improbably long survival
  (quantum immortality). There are various critiques/interpretations: it ignores that
  most branches may contain a severely damaged or near-death version; the measure/amplitude
  matters; it confuses self-locating uncertainty with possible worlds; it implicitly
  assumes consciousness/survival is binary and that "you" continues across branches;
  probability/decision theory in branching (Wallace''s decision-theoretic approach?);
  "non-indexical" probabilities; also the "sleeping beauty"/anthropic considerations;
  whether the argument is empirically vacuous because an outside observer still sees
  you die in most branches.


  Debate positions:

  - Proponents/fascinated: under a straightforward reading, QI is a logical consequence
  of Everett plus the assumption that your subjective experience only samples branches
  where you exist.

  - Critics: it''s a confusion between "there exists a branch in which I survive"
  and "I should expect to find myself in that branch"; the probability of finding
  yourself in a branch depends on branch weights (amplitude), so the argument wrongly
  drops the Born rule/weights. Others say the argument only works if you assume you
  are a "soul" riding only the surviving branches, which is a form of dualism / not
  implied by Everett. Others: in most "survival" branches you suffer severe brain
  damage or are barely alive, so even if you never experience death, you experience
  increasing impairment; QI arguably predicts quantum dementia rather than immortality.
  Others: no empirical consequence because any test by outside observers would observe
  death with high probability; third-person evidence cannot confirm it, and first-person
  "evidence" is unshareable, so it''s not a scientific dispute.

  - The debate has stalled: everyone agrees on the formalism and branching; disagreement
  about self-locating probability, branch weight, the definition of personal identity
  over time across branches, and whether claims about what "you" should expect are
  even truth-apt. Is it verbal? Is there a hidden empirical question? Could a theorem
  (e.g., a no-go theorem for branch-counting probability) settle it? Could a decision-theoretic
