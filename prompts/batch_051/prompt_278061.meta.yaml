  Need to be careful about mathematical accuracy. Let me recall the theorem precisely.


  Gibbard–Satterthwaite theorem (1973/1975): Consider a social choice function f that
  maps every profile of strict linear orders over a set of at least three alternatives
  to a single winner. Suppose f is onto (for each alternative x there is some profile
  where x wins) and strategy-proof (truthful reporting is a dominant strategy for
  every voter: no voter can obtain a preferred outcome by misrepresenting their ranking).
  Then f is dictatorial: there is a voter whose top-ranked alternative always wins.


  Yes. Conditions: unrestricted domain of linear orders, |A| >= 3, onto (non-imposition/citizen
  sovereignty), strategy-proofness (non-manipulability), and the conclusion is dictatorship.
  So no non-dictatorial, onto, strategy-proof rule. Equivalently, any strategy-proof
  onto rule is dictatorial.


  So the activity should let participants discover that trying to satisfy "onto" and
  "strategy-proof" pushes toward a dictator.


