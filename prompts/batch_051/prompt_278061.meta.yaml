  no voter can, by misreporting, get a better outcome for themselves (strategy-proofness);
  (3) no voter is a dictator. Groups try for 20 minutes. Facilitator then runs their
  proposed rules against test profiles and "strategic" manipulations, showing each
  fails. Then the theorem is named and the debrief shows the inevitability.


