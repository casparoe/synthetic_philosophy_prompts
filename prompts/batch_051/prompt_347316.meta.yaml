  games, assuming second player has a winning strategy, first player can "steal" it:
  make an arbitrary first move, then pretend to be the second player. If the strategy
  ever tells first player to play where they''ve already played (the "extra" first
  move), they just make another arbitrary move. Because extra moves can''t hurt (monotonicity
