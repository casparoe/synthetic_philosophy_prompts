  ---


  I work as a software engineer on a trust and safety team, and I recently got pulled
  into a debate about verification badges, account age requirements, and expensive
  onboarding flows: the assumption on our team is that a signal can be trusted only
  when it''s expensive enough that a bad actor wouldn''t bother to fake it. That sent
  me down a rabbit hole about costly signaling and the handicap principle — roughly,
  the idea from animal communication that a signal can be honest only if it costs
  so much that a weaker or deceptive individual couldn''t afford it. With no philosophy
  training, I tried to turn the idea into a clean argument, and now I''m stuck because
  it seems to prove that virtually all cheap communication should be impossible, which
  can''t be right. Here is the argument I built:


  (1) A signal is honest only if a sender with the "wrong" hidden state (lower quality,
  bad intent, false information) would not do better by sending it than by staying
  quiet or sending something else.

  (2) The only thing that can make sending the signal unprofitable for dishonest senders
  is a cost attached to the act of sending itself — money, time, risk, energy, reputation
  — sufficient to wipe out the benefit of being believed.

  (3) So an honest signal must be costly for anyone who sends it; otherwise the dishonest
  sender can copy it just as cheaply as the honest one, profit from being believed,
  and eventually destroy the signal''s credibility.

  (4) Therefore every honest signal is a costly signal.

  (5) Cheap honest communication should then be impossible — yet I rely on cheap honest
  signals constantly: a stranger at the train station answering whether this is the
  right platform, an error message pointing to the exact failing test, a colleague
  telling me which service is down. None of these cost the sender anything meaningful,
  and if I applied our team''s rule strictly, I''d have to say none of them can really
  be honest.


  So my question is: name the exact step where this argument goes wrong, explain why
  that step looked correct (it obviously describes something real about verification
  badges and peacock tails), and tell me what I have to give up once I reject it.
  Does rejecting it force me to say that the handicap principle is false, or only
