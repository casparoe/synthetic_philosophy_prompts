  I am a high school student, and I have been trying to understand a view in the philosophy
  of economics that is sometimes called the F-twist: the claim, usually associated
  with Milton Friedman, that we should judge a scientific model by whether it predicts
  successfully and not by whether its assumptions are realistic. I would like you
  to reason through a counterfactual that tests this idea.


  Suppose that, starting in 2025, the main public science-funding agency of a large,
  scientifically advanced country (in all other respects similar to the United States
  today) adopts an assumption-accuracy rule. It will fund no model-based research
  unless every assumption of the model can be defended as literally true, or at least
  true of the particular system being studied, before any results or predictions are
  considered. Frictionless planes, point masses, perfectly rational consumers, infinite
  populations, representative agents, and ideal gases all become grounds for rejection,
  no matter how well a model containing them has predicted in the past. A defense
  of the form the model predicts well even though the assumption is false is treated
  as a methodological error.


  Predict, with a step-by-step chain of reasoning, what this country''s science and
  science-based policy look like fifty years later. In particular:

  1. Which disciplines are hit hardest, and which barely notice?

  2. Which idealizations quietly survive by being renamed, relocated, or absorbed
  into definitions, measurement procedures, or the mathematics rather than stated
