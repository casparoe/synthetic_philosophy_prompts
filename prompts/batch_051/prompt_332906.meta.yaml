  me as both fascinating and strangely immobile. The two-factor account, roughly,
  says monothematic delusions arise when two things go wrong together: a first neuropsychological
  factor supplies the bizarre content (in Capgras, the feeling that one''s spouse
  lacks the usual affective familiarity, which surfaces as the thought that the spouse
  has been replaced by an impostor), and a second factor, a failure of the belief-evaluation
  system, lets that thought be accepted instead of rejected. The doxasticists point
  out that delusions look a lot like beliefs: people assert them sincerely, defend
  them, draw inferences from them, and sometimes act on them. The anti-doxasticists
  point out that delusions also look unlike beliefs: the same patient who insists
  he is dead will eat, dress, and speak; someone with Capgras may denounce the ''impostor''
  while continuing to live with and depend on her; and the delusion is often encapsulated,
  failing to ramify through the rest of the person''s practical reasoning the way
  a genuine belief should."


