  Prompt draft:


  ---


  You are a TA in an undergraduate political philosophy course. Below is an exam question
  and one student''s answer. Grade the answer on a 10-point scale (whole or half points).
  Along with the grade, provide the point-by-point written comments that justify it:
  go through the answer claim by claim, indicate what is correct and what is not,
  and explain how those findings determine the grade. Do not give a global impression
  without itemizing; do not introduce new course material or a bibliography; and do
  not signal in advance what you take the answer to have right or wrong. Write your
  assessment in American English.


  Exam question:


  Explain the two principal restrictions Locke places on acquiring property by mixing
  one''s labor with unowned things, and state how they differ. Then apply the relevant
  restriction(s) to this case: in an arid region, a settler fences off the only spring,
  builds cisterns, and sells the water to other settlers who have no alternative supply.
  Does the settler''s title to the spring satisfy Locke''s restrictions on acquisition?
  Defend your answer.


  Student''s answer:


  Locke''s labor theory begins from self-ownership: each person owns their own body
  and therefore owns the labor their body performs. When someone mixes their labor
  with an unowned thing, the thing becomes theirs, because the labor was already theirs
  and is joined to the object. Two restrictions limit this. First, there is the spoilage
  restriction: a person may take only what they can use before it perishes; taking
  more than one can use is taking more than one''s share. Second, there is the proviso
  proper: appropriation is legitimate only if enough and as good is left in common
  for others. With the invention of money, the spoilage restriction largely drops
  out, because durable metal can be accumulated without perishing, and this is how
  Locke explains legitimate inequalities of wealth.


  In the spring case, the settler''s title is unjust. The relevant test, on Locke''s
  view, is whether enclosing the spring leaves the other settlers worse off than they
  would have been had the spring remained in common. Since they must now buy water
  from him and have no alternative source, they are worse off under that baseline,
  so the proviso is violated. His labor in building the cisterns improves the spring''s
  usefulness, but that at best entitles him to compensation for the value he added,
  not to the spring itself. If, however, there were other equally good springs left
  unenclosed, the appropriation would pass the enough-and-as-good test and the title
  would be legitimate.


  Grade this answer on a 10-point scale and provide the point-by-point comments that
  justify the grade.


