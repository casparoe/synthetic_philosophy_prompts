  Let me recall the standard Ellsberg single-urn version:

  Urn: 90 balls. 30 red. 60 are black or yellow in unknown proportion.

  Choose one of:

  Gamble A: win $100 if red is drawn (probability 1/3, known).

  Gamble B: win $100 if black is drawn (probability unknown between 0 and 2/3, ambiguity).

  People typically choose A.


  Then a second choice:

  Gamble C: win $100 if red or yellow is drawn (probability = 1/3 + y/90, unknown
  between 1/3 and 1).

  Gamble D: win $100 if black or yellow is drawn (probability = 2/3, known).

  People typically choose D.


  Now observe: A ≠ B implies p(red) > p(black), but C ≠ D implies p(red or yellow)
