  The Stoic position: emotions, as ordinary people experience them, are judgments
  — assent to the appearance that something outside one''s control is good or bad.
  Since only virtue is good and only vice is bad, the passions are systematically
  false judgments, disturbances of the soul. But a refined Stoic does not become unfeeling:
  they preserve "good feelings" (eupatheiai) — joy, wish, caution — which track what
  is genuinely within one''s control, and they feel proto-emotions (first movements)
  involuntarily but withhold assent. So the good life is a life of accurate evaluation,
  where emotional noise is minimized because it misrepresents value.


  The Romantic position: emotions are not just judgments; they are ways of apprehending
  value that no purely cognitive stance can replace. Grief, for instance, is not a
  false judgment that something bad happened; it is the proper acknowledgment of the
  irreplaceable — and to refuse it is to fail to love. Some goods (particular persons,
  works of art, forms of life) are known only by being felt; emotional disturbance
  is sometimes the price of epistemic contact with reality. Emotions can be fitting
  or unfitting without being "noise," and the standard of fittingness is not under
  the agent''s control.


