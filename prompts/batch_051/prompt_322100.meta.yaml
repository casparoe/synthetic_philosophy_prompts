  good or bad:

  - Its accuracy relative to the odds (epistemic): hope should track probability;
  false hope bad.

  - Its consequences/practical effects (pragmatic): hope justified if it sustains
  action, even if unrealistic.

  - Its expressiveness/fidelity (aretaic/expressive): hope expresses love/commitment/values
  regardless of outcome.

  - Its relationship to action: hope acceptable only if paired with action; hope as
  moral substitute is bad.

  - Whether hope is ever owed to others.


