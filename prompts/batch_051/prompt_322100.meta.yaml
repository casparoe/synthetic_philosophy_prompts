  1. Hard-nosed realism: hope''s value is only as good as its accuracy; false hope
  wrong/ harmful.

  2. Pragmatic realism: hope justified by motivational effects, even if belief is
  somewhat optimistic; we can choose useful hope.

  3. Tragic idealism: hope is right even against near-zero odds; maintaining hope
  is itself a good / a human triumph.

  4. Fidelity view: hope is called for because it expresses commitments and love;
  doesn''t necessarily involve believing success likely.

