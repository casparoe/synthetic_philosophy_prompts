  Let''s formulate:


  "I work as a software engineer and have been reading decision theory informally.
  I keep coming back to a 1967 article by I.J. Good, ''On the Principle of Total Evidence.''
  As I understand the argument there, an idealized expected-utility maximizer can
  never be made worse off in expectation by observing cost-free information that it
  updates on by conditionalization. The rough reason is that the expected value of
  choosing after seeing the evidence is at least the value of committing in advance
  to some fixed action, because taking an expectation over evidence of a maximum utility
  is never less than the maximum over actions of an expected utility; free information
  can therefore be ignored, but ignoring it is never forced. Please argue that this
  result, even if correct for its idealized agent, does not give a software system
  a general reason to ingest all free telemetry or extra data before acting. In particular,
  make the case that once the system is allowed to be computationally bounded, free
  information can have negative expected value; give at least one concrete kind of
  failure that would matter in production, and state exactly which idealization in
  Good''s setup it breaks."


