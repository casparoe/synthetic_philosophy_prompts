  Let me brainstorm substance.


  Conceivability as evidence for possibility: classic issues.


  A theory of the epistemic link from conceivability to possibility must:

  1. Distinguish positive vs negative conceivability and not conflate them (negative
  = no contradiction detected; positive = imagining a coherent scenario in detail).
  Any adequate theory must not reduce negative to positive, since negative conceivability
  is cheap and often tracks mere ignorance.

  2. Account for the Kripkean/Putnam cases: a posteriori necessities (water is H2O,
  Hesperus = Phosphorus, heat = molecular motion) are conceivably false but not possible.
  So the theory must explain either that conceivability is a guide only under ideal
  conditions and the idealization includes full empirical/a posteriori information,
  or restrict to primary/one-dimensional possibilities. This is a hard constraint
  from semantics/metaphysics.

  3. Explain the role of idealization: prima facie vs ideal conceivability (ideal
  rational reflection, unlimited reasoning). The theory must say what idealization
  adds and why it restores reliability; it can''t just hand-wave "sufficiently ideal"
  or it becomes unfalsifiable / trivial. Distinction between what can''t be ruled
  out a priori and what would survive arbitrary increases in reasoning.

  4. Handle the possibility that conceivability is merely a defeasible, practical
  heuristic rather than a constitutive or reliable guide: it might track our cognitive
  limitations. The theory must say whether the link is constitutive, evidential but
  fallible, or merely practical, and what independent evidence bears on it.

  5. Address counterexamples like Goldbach''s conjecture: a statement whose truth
  value is necessary, but where conceivability of both it and its negation is symmetric
  (we can''t rule out either). Also mathematical impossibilities: non-expert positive
  conceivability of false mathematical claims. This connects to logical omniscience
  issues.


  Other possible requirements:

  - The relationship between conceivability and imagination vs supposition: imaginability
  (sensory imagery) is narrower and worse guide than conceivability. Need to distinguish.

  - Impossible worlds / hyperintensionality: need a semantics that doesn''t collapse
  all necessarily equivalent claims.

  - The role of two-dimensional semantics in handling a posteriori necessities.

  - The "can conceive of not-Hesperus=Phosphorus" problem.

  - Styles of modal epistemology: rationalism (Bealer, Chalmers, Peacocke) vs modal
  skepticism (van Inwagen) vs empiricism (Yablo''s "conceivability is not the whole
  story").

  - The need to explain asymmetric reliability: why conceivability is a decent guide
  in some domains (metaphysics, e.g., zombies?) but bad in others (mathematics, a
  posteriori). Chalmers distinguishes.

  - It should not require infallible access; primitive inconceivability (McGinn).


