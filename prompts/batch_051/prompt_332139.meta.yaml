  Need to decide the procedure questions:

  1. Is the question one to which there is a determinate, knowable answer at all?
  If not, treat as preference, stop.

  2. Is the vote''s purpose epistemic or preference? The council must declare in advance;
  if mixed, split.

  3. Is there a benchmark to estimate competence? E.g., include calibration items
  with known answers. If average competence ≤ 0.5 on calibration, no epistemic weight.

  4. Are votes sufficiently independent? Check for common sources of shared error:
  same briefing material with a factual error, same expert, social proof, correlated
  group. If correlation comes from shared evidence, may be fine; if from shared bias,
  discount. The procedure should have questions to distinguish by asking whether participants
  would change votes if the shared source was corrected, or by subdividing by information
  diet.

  5. Check whether competence is homogenous across subgroups. If one subgroup has
  expertise, the simple majority may underperform a weighted/expert rule; but if you
  delegate, you lose independence and inclusion.

  6. Output: what kind of claim the organisers can put to the council: "strong truth
  signal," "weak," "preference only."

  7. Where the procedure stops with a no: if no calibration, if competence below threshold,
  if no way to distinguish common evidence from common bias — hand to council as a
  political decision.


