  Adam Smith''s "Theory of Moral Sentiments" (TMS, 1759). Key concepts:

  - Sympathy: not exactly compassion/pity; Smith defines it as our fellow-feeling
  with any passion whatever, produced by imagining ourselves in another''s situation.
  "By the imagination we place ourselves in his situation..." We can sympathize with
  joys and sorrows. Sympathy arises from changing places in fancy with the sufferer.

  - Mechanism: spectator imagines being the other person; the passion is weaker than
  original. We judge propriety of another''s sentiments by whether we can go along
  with them — whether our sympathetic passion corresponds to the other''s actual passion.
  If we can enter into it, we approve; if not, disapprove.

  - Mutual sympathy pleases both; the pleasure of mutual sympathy is a key point.
  We need the other to lower their pitch to a level we can enter into, and we in turn.

  - Propriety vs merit: propriety concerns the suitableness of the sentiment to its
  cause/object; merit/demerit concerns beneficial/hurtful consequences and involves
  gratitude/resentment. Smith treats propriety (Part I) and merit/demerit (Part II).

  - The impartial spectator: an imagined well-informed, disinterested spectator internalized.
  We judge our own conduct by imagining how an impartial spectator would view it.
  It''s not the actual spectator; actual spectators may be misinformed or biased.
  We appeal from the actual to the imaginary impartial spectator, and ultimately to
  "the man within the breast," conscience.

  - We learn to see ourselves as others see us; the impartial spectator develops through
  social interaction, the "looking glass." We divide ourselves into examiner and examined;
  the judge and the judged.

  - Virtue: propriety, prudence, benevolence (Part VI). Self-command.

  - The impartial spectator is not God; although Smith at times refers to the "all-seeing
  Judge of the world" and duties to God, the impartial spectator is human and corrigible.
  Also not the same as general rules of morality derived from experience of many approvals/disapprovals.

  - Distinction between Smith and Hume: Hume''s sympathy is more associative/contagion;
  Smith''s is projective imaginative. Hume grounds moral judgment in a general/steady
  point of view? Smith''s impartial spectator is similar to Hume''s "judicious spectator"
  but Smith emphasizes imagination and internalization. Could include subtle misattribution:
  student attributes "the impartial spectator" primarily to Hume, or says Smith''s
  spectator is a device of objective reason independent of sentiment.


