  ''Explain Adam Smith''s account of sympathy in A Theory of Moral Sentiments and
  the part the impartial spectator plays in judging our own conduct. Be precise about
  what sympathy involves for Smith and about the relation between the impartial spectator
  and actual spectators.''


  The student wrote:


  ''Smith''s basic idea is that moral judgment is grounded in sympathy, by which he
  means not pity in particular but our capacity to enter into the feelings of others.
  When we see someone''s passion, we put ourselves imaginatively in their situation,
  and the feeling that arises in us — a fellow-feeling — is our sympathy. This can
  even happen for people who are no longer alive or for feelings they aren''t currently
  having, since the spectator supplies the situation in imagination. We approve of
  another person''s passion when our own sympathetic feeling corresponds to theirs,
  and disapprove when it doesn''t; so approval is a matter of sentiment, not of reason.
  Reason can later turn these repeated experiences of approval into general moral
  rules, but for Smith the source of moral judgment is always sympathy itself.


  For judging ourselves, Smith thinks we need to become the spectators of our own
  conduct. Because we are partial to ourselves, we imagine how an impartial, well-informed
  spectator would view what we have done; if we can enter into our own motives as
  that spectator would, we approve of ourselves. This imagined spectator is what gets
  internalized as conscience, the voice by which we judge our own heart. Smith is
  careful that this is not God, but an ordinary human standpoint freed of bias. The
  pleasure of mutual sympathy does a lot of work here: we want others to enter into
  our feelings, and because spectators can only go along with passions that are lowered
  to a pitch they can share, we moderate ourselves, and the spectator in turn sympathizes
  with our effort.


  The main subtlety is the difference between the impartial spectator and the actual
  people around us. I''d put it this way: Smith''s view is that the actual spectators
  we meet are usually partial or poorly informed, so we learn to correct their responses
  into the imaginary impartial spectator; but the content of that spectator''s verdict
  is still just what a fully informed actual observer would feel, only idealized.
  The impartial spectator is in that sense a cleaned-up reflection of the social world
  rather than an independent standard.''


