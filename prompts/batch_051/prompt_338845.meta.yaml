  "I lead a small team that builds risk-scoring models used in hiring, and I have
  adopted the following rule. The standard fairness metrics — roughly, calibration
  and equal false-positive and false-negative rates across demographic groups, and
  the various ''parity'' conditions — are known to conflict with one another except
  in special cases. So whenever someone tells me a model is fair under some chosen
  metric, I refuse to act on that claim unless the person can state, in the same breath,
  which of the other standard metrics they are knowingly giving up and why that sacrifice
  is acceptable in this context. A colleague says this rule is just a dressed-up way
  of concluding that fairness is impossible and doing nothing, since no metric survives
  it. Is my rule defensible as a way of forcing trade-offs into the open, or does
  it smuggle in a bias against fairness work that can''t fully specify every trade-off
  in advance? If the rule has a defensible core, give the corrected version. In your
  reply, give exactly five numbered points, each one or two sentences, with no introduction
  or conclusion."


