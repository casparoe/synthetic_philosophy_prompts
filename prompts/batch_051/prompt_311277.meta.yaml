  Potential argument:

  1. A gamble''s expected change in wealth is the arithmetic mean of possible wealth
  outcomes over a large ensemble of independent trials.

  2. But an individual decision-maker realizes only one stochastic path through time,
  not an ensemble.

  3. If wealth evolves multiplicatively, the time-average growth rate is not the arithmetic
  mean of outcomes but the geometric mean (or log-expectation).

  4. The relevant quantity for an individual is what happens to wealth over time,
  i.e., time-average growth, not the ensemble mean.

  5. Therefore maximizing expected change in wealth will systematically overestimate
  the value of gambles with any volatility, and can recommend gambles that almost
  surely make the individual poorer over time.

  6. Hence rational choice for an individual should maximize time-average growth,
  not expected utility.


