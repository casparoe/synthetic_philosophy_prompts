  Prompt text:


  "I’ve been rereading the part of Descartes’ Discourse on Method where he argues
  that nonhuman animals lack reason, and I want help pinning down what the automaton
  comparison is actually supposed to prove. In Part Five he asks me to imagine two
  machines: one built to look like a monkey and one built to look like a human. He
  says an external observer could not tell the monkey-machine from a living monkey,
  but a human-shaped machine would always reveal itself, because it could not arrange
  words or other signs in the way human beings do to express thoughts. He then applies
  this to animals: even parrots and magpies can produce words, but they cannot produce
  language that shows they think, whereas people born deaf and mute can develop signs.
  I am trying to decide whether this is primarily an argument from observed behavioral
  incapacity, or whether Descartes is smuggling in a criterion of reason that only
  flexible linguistic response could satisfy. Please respond with exactly five numbered
  items, each a sentence or two, that lay out the main interpretive options or hidden
  premises one would need to decide this; no introduction or conclusion."


