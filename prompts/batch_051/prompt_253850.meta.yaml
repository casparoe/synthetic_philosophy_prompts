  Content of the two camps:


  Camp A: Expansionism. Moral progress consists primarily in the extension of moral
  status/consideration to ever wider classes of beings: kin → tribe → nation → all
  humans → (some) nonhuman animals → possibly future people, etc. Progress is driven
  by taking existing moral resources (sympathy, impartial justification) and applying
  them beyond previous boundaries. The "moral circle" expands; each step is cumulative
  and additive, extending an existing logic.


  Camp B: Transformation/revisionism (call it "reconceptualism" or "revisionism").
  Moral progress is often not an extension of an existing circle but a revision of
  the underlying moral concepts and the structure of the circle itself. For example,
  abolition didn''t simply add enslaved people to an existing circle of "persons";
  it changed the content of who counts as a person, property, etc. The shift from
  honor cultures to dignity cultures, or from caste to equal status, isn''t just adding
  more beings to a sphere of concern; it restructures relations, sometimes abolishing
  distinctions rather than moving the boundary. New moral concepts (human rights,
  exploitation, structural injustice) are introduced that don''t map onto "adding
  members."


  But I want both sides equally competent, not strawman. The adversarial collaboration
  should find formulations both can sign, residual disagreement, cruxes, and predictions
  for evidence bearing on cruxes.


