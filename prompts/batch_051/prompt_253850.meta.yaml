  are widely called progress (e.g., declining acceptance of chattel slavery, torture,
  etc.).

  - Moral progress involves changes both in whom/what agents regard as morally considerable
  and in the concepts/categories through which they do so.

  - At least some historical episodes display extension-like features: previously
  excluded groups come to be regarded as full moral subjects.

  - At least some historical episodes display conceptual transformation that cannot
