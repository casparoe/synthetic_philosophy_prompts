  "Imagine that two groups of moral philosophers have spent a year in an adversarial
  collaboration on the nature of moral progress. One group holds an expansionist view:
  moral progress is best understood as the progressive extension of moral status or
  consideration to ever wider classes of beings — for example, from kin to tribe to
  co-religionists to all humans, and in recent centuries to some nonhuman animals.
  On this view, the underlying moral machinery stays relatively constant; progress
  consists in applying it beyond old boundaries and recognizing that the boundary
  was drawn arbitrarily or self-servingly. The other group holds a revisionist view:
  the most important episodes of moral progress are transformations of the moral categories
  themselves rather than additions of new members to an old circle. On this view,
  changes such as the abolition of chattel slavery, the decline of honor-based norms,
  or the rise of concepts like structural injustice did not merely add beings to an
  existing sphere of concern; they changed what it is to be a moral subject, created
  or retired whole categories, and altered the currency of moral assessment.


