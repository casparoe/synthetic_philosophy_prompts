  who assented to them, association is voluntary, and your employment is otherwise
  at-will, meaning either side can walk for almost any reason. So a worker has maximum
  exit in every direction except this one: once 51% of your unit votes in a union,
  you''re in the union''s collective voice whether you like it or not.


  And then there''s the strike asymmetry. If you strike over wages, the employer can
  permanently replace you; if you strike because the employer committed an unfair
  labor practice, you can''t. The law talks about a ''right to strike,'' but the more
  fundamental the strike''s goal is (your own economic position), the more it''s treated
  like an ordinary market move you make at your own risk, while the more it''s about
  policing the legal rules, the more it''s treated as protected. That looks backward
