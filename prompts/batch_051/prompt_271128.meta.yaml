  ---


  I have no academic background in philosophy or statistics, but I have spent a fair
  amount of time thinking on my own about what it actually means to say that something
  has a certain probability. A friend who reads a lot of popular science and philosophy
  recently and speaks with considerable confidence offered me the following rundown
  of the main interpretations.


  Frequentism, he said, is the view that the probability of an event is the relative
  frequency with which events of that kind occur in a long run of repeated, similar
  trials. For claims that do not pick out a repeatable setup, such as the claim that
  it will rain tomorrow or that a particular suspect is guilty, he said a frequentist
  has to say either that the claim lacks a well-defined probability or that it is
  really shorthand for a frequency in some larger class of similar cases. Subjectivism,
  he continued, is the view that probability is just a measure of a person''s degree
  of belief. Because different people can rationally start with different degrees
  of confidence, he said, there are no real constraints on the probabilities anyone
  may assign; this permissiveness, he added, is exactly what subjectivists mean by
  coherence. Finally, he described the propensity interpretation as the claim that
  probability is an objective physical tendency of a chance setup, such as a coin
  or a die, to produce a certain outcome. But he dismissed this as frequentism in
  disguise: the only way to check a propensity claim is to collect frequencies over
  many trials, so, he concluded, the propensity view adds nothing beyond a metaphorical
  picture.


  This left me with three impressions: that frequentism makes ordinary single-case
  probability claims meaningless, that subjectivism holds any probability assignment
  to be as reasonable as any other, and that the propensity view has nothing distinctive
  going for it. I would like to know whether my friend''s summary is fair. Please
  go through it claim by claim and tell me which parts a defender of each interpretation
  would accept, which parts are subtle mischaracterizations, and whether the three
  impressions I drew actually follow from the accurate parts. Please write your answer
  in American English.


  ---


