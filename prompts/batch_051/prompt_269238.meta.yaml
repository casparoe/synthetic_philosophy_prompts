  Some content ideas for desiderata of a theory of moral difference:


  - Case coverage: plain lies; technically true but implied false; paltering (true
  statements chosen to mislead); half-truths; omissions when there''s a reasonable
  expectation of disclosure; equivocation with lexical ambiguity; non-linguistic misleading
  (e.g., an actor''s costume?) — maybe keep core.

  - Distinctions it can''t collapse: (a) between what was said and what was merely
  implicated (Gricean distinction) — a theory can deploy it, but it can''t just *assume*
  it does moral work; (b) between the speaker''s intent and the hearer''s uptake —
  some theories key wrongness to successful deception, others to attempt; a criterion
  must say which and why, since failed lies and successful misleading then trade places;
  (c) between misleading and honest-but-wrong or bullshit (Frankfurt-style indifference
  to truth) — needs to not collapse.

  - The Goodhart-style requirement: if a moral norm publicly optimises "don''t say
  false things" while the hidden target is "don''t cause false beliefs", people will
  move along the frontier detectable falsehoods -> implied falsehoods, and the norm
  stops protecting the target. A theory must therefore either give a principled reason
  the target is really narrower (literal assertion-policing is what matters, not belief)
  or explain why it isn''t just goodharting.

  - The "two ways to make it outraged in both directions" or "symmetry cases": for
  any successful lie, you can construct a misleading counterpart with similar intent
  and harm; for many paradigms of "acceptable" speech, you can construct cases where
  literal truth does the deception. So the theory needs to locate a difference that
  doesn''t disappear under clever rewording (this is a non-negotiable-ish criterion;
  it knocks out simple "it depends what was said" views).

  - The positive-law / social-coordination distinction: legal standard for perjury/fraud
  vs. moral blame may come apart; a theory should explain whether and why the legal
  line (literal falsity of a "material" statement) is a decent Schelling point even
  if morally incomplete.

  - The distinction between a norm for the speaker and a norm for the convention/act:
  whether wrongness is located in (i) the proposition, (ii) the assertion, (iii) the
  implicature, or (iv) the pattern over time (a policy of selective truth)? Some theories
  put it in the invalid inference the hearer is invited to make...

  - Empirical sentences: it must stay consistent with what we know about how implicatures
  are generated and cancelled (Gricean pragmatics) and the empirical finding that
  people judge misleading as less bad than lying even when consequences match — it''s
  a datum to explain or debunk, not ignore (maybe this is too specific; "people treat
  lies as worse even when the harm and intent are matched" is known; I could include
  as an intuition/data point that the theory may debunk rather than respect).


