  Prompt draft:


  "I''ve been working through some philosophy of mind/ethics writing on idealized
  preferences and keep getting stuck on coherent extrapolated volition — the proposal
  that you get at what a person (or humanity) ''really'' wants not by asking what
  they now prefer, but by extrapolating to what they would want if they knew much
  more, thought faster and more clearly, were more the person they wish they were,
  and had their conflicting desires brought into coherence. The trouble is that the
  procedure seems to curl back on itself: the ''more the person they wish they were''
  part, and the question of what counts as coherence, are themselves answered from
  within the person''s current, imperfect outlook — so the starting point leaks into
  the destination, and we can''t tell whether extrapolation is correcting the present
  self or just laundering it.


  Write a pantoum about this recursion problem. For someone who doesn''t know the
  form, a pantoum moves in four-line stanzas; the second and fourth lines of each
  stanza reappear as the first and third lines of the next, and the final stanza reaches
  back to reuse the first and third lines of the opening stanza (so the poem ends
  back where it began). I want the form to do the philosophical work: the recurring
  lines should enact the way each stage of the extrapolation reuses material from
  the previous stage — the supposedly ideal endpoint keeps being built out of the
  non-ideal point of departure. The final stanza''s return to the opening lines should
  pose, not resolve, the question whether the procedure can genuinely leave the starting
  point behind or is only circling within it. Avoid the easy outs: don''t conclude
  that CEV is therefore worthless and don''t conclude that the circularity is harmless;
  leave the tension open. The poem should be accurate enough that someone who knows
  the CEV literature recognizes the bootstrap worry, and good enough as verse that
  someone who doesn''t can still follow the problem. Please write it in American English."


