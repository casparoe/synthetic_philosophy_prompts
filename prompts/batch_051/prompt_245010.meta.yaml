  Potential prompt:


  "I am currently taking a philosophy of mathematics course, and I have found myself
  unable to decide between two positions about the continuum hypothesis, and I would
  like help working through what each side would cost. On one side is a pluralist,
  multiverse conception of set theory, which I am drawn to for systematic reasons.
  The familiar axioms of ZFC seem to capture the iterative conception of set well
  enough for virtually all mathematical practice, and they are consistent with both
  the continuum hypothesis and its negation. If those axioms are our best account
  of what sets are, then the continuum hypothesis looks underdetermined: there are
  equally legitimate models with different answers, and the question has no answer
  apart from a choice of model. This view has the virtues of explaining why the continuum
  hypothesis has resisted settlement without attributing to mathematicians a mysterious
  faculty for perceiving an intended universe, and of making sense of the way actual
  mathematics proceeds without needing the hypothesis decided.


  On the other side is a firm intuition I cannot shed: the power set operation is
  supposed to yield all subsets of a given set, not merely those available in some
  model, so there should be a fact of the matter about whether every infinite set
  of reals is countable or has the cardinality of the continuum. The continuum hypothesis
  is a statement about a definite completion of a definite operation, and saying that
  some models satisfy it while others do not sounds to me like changing the subject
  from the sets themselves to what our axioms can prove. The pluralist''s comparison
  of an undecided sentence to an underdetermined fact about a fictional character
  seems to beg the question, because sets are not stipulated artifacts and the phrase
  all subsets appears already to intend a maximal totality.


  I am not asking which side is right. I want a negotiated verdict. Present each side
  at its strongest, then tell me what it would take for the determinacy intuition
  to be the thing I should revise or debunk, what it would take for the pluralist
  theory to be the thing I should amend or abandon, and whether there is a reading
  on which both survive. In particular, I want to know whether a realist about a unique
  universe of sets can consistently accept that our present axioms leave the continuum
  hypothesis open, and whether the pluralist can grant that there is a fact of the
  matter within each universe while denying that any one universe is intended."


