  Let me think about Sidgwick''s dualism more precisely. Sidgwick''s Methods of Ethics
  culminates in the "dualism of practical reason": he shows that both egoism (pursuit
  of one''s own happiness) and utilitarianism (general happiness) seem to be rational
  ultimate principles, but they can conflict, so practical reason gives contradictory
  directives in cases of conflict. He searched for a reconciliation, found none, and
  concluded there''s a "fundamental contradiction" in morality/practical reason. So
  the position: there is an irreducible dualism — reason sanctions both egoism and
  universal benevolence, with no higher principle to adjudicate.


  What would count against it? Options: showing egoism isn''t actually a requirement
  of reason (e.g., the self/identity arguments from Parfit — that egoism depends on
  a separateness view; or Kantian arguments that prudence is only hypothetical); showing
  utilitarianism isn''t required; showing a third principle (e.g., impartial consequentialism
  plus a deflationary account of prudence; or rational egoism turns out to reduce
  to utilitarianism under open individualism or personal identity weirdness); showing
  that the conflict cases are impossible or that acting on one fails rational requirements;
  showing the notion of "rational requirement" at work is equivocal (practical "ought"
  vs. normative reasons); showing there''s a single maximizing principle under some
  theory of value; error-theoretic/constructivist deflation — both principles are
  merely optional standpoints with no authority, so no conflict; evolutionary debunking;
  Parfit''s "Kantian contractualism" as convergence of self-interest and impartiality;
