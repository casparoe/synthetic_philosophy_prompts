  I''m trying to get clear on what I actually think about guilt and whether it can
  be moved around, so I went through a bunch of cases and wrote down my gut reactions.
  Now I want to know if there''s one principle behind them, or a couple, and which
  of my intuitions have to go.


  The Leviticus scapegoat ritual: the high priest confesses the people''s sins over
  a goat and the goat is sent into the wilderness. My gut says the people are genuinely
  released from something — it''s not a sham — but I don''t think the goat is now
  morally guilty. Whatever landed on the goat, it isn''t guilt in the sense I mean
  when I say a murderer is guilty.


  Jesus dying for other people''s sins (penal substitution). My gut: I can make sense
  of someone voluntarily stepping in and taking the penalty, and I can even see why
  the wronged party might accept that. But if you described the same transaction outside
  a religious setting — an innocent volunteer executed so a guilty person walks —
  I''d call it monstrous. So I''m not sure the voluntariness is doing the work I think
  it is.


  A manager dumps his own mistake on a subordinate and fires her. Obviously wrong,
  obviously unjust. The subordinate isn''t guilty, the manager is still guilty, and
  firing her didn''t discharge anything. I want to say: no transfer happened.


  But then: a company pays a fine for damage caused by one of its employees. My gut
  says the company is genuinely liable, and paying the fine settles the matter, even
  though the employee is the one who actually did it and the company is not a person
  in the normal sense. Something moved there, or at least something got settled, without
  anyone thinking guilt moved.


  A town has a run of bad harvests and drives out an innocent outsider, blaming him.
  Despicable. But I also have the uncomfortable thought that scapegoating does relieve
  the group''s tension — it "works" psychologically. Not morally though. It works
  the way venting works, not the way paying a debt works.


  Wergild-type blood money: someone from clan A kills someone in clan B, and clan
  A pays a heavy sum formally to clan B. My gut: the killer''s guilt is untouched,
  but the payment isn''t a bribe, either — it really settles the clan''s claim and
  restores something. I''d call it compensation for a loss, owed to the victim''s
  side, not a transfer of the killer''s guilt onto the money.


  A friend takes the blame for something I did, to protect me from the consequences,
  and I let him. He gets punished. My gut afterward: I still feel guilty — maybe more
  guilty, because now two bad things happened. He is not guilty of the original act.
  Yet I''d also say he took responsibility for it, voluntarily, and I have a debt
  to him. So responsibility can be taken up, while guilt (for the act) stays with
  me.


  Now the one I keep going back and forth on. Suppose I''ve wronged someone and never
  made it right. Later I hear that a stranger suffered a similar injury, completely
  unrelated. I don''t believe my debt is paid or my guilt reduced — but there''s a
  part of me that almost feels a dark relief, like the moral books have somehow been
  evened out. Is that just a nasty cognitive bias, or am I tracking something real
  about guilt that wants balancing and doesn''t care by whom?


