  The theory: reasons for coining technical terms from Latin and Greek:

  - Precision / semantic control: using roots with stable meanings lets you build
  terms whose meaning can be decomposed (e.g., "tachycardia" = fast + heart).

  - International neutrality: Latin/Greek roots aren''t any living language''s property,
  so they don''t privilege English/French etc.; facilitates cross-linguistic adoption
  (though it privileges European classical languages globally — a critique).

  - Morphological productivity: Latin/Greek provide large inventories of prefixes,
  suffixes, combining forms, so you can generate coherent families.

  - Inertness / lack of unwanted connotations: dead languages have fewer living associations;
  words don''t drift as quickly.

  - Co-membership signaling / professional group identity and authority: using classical
  coinages marks a term as technical and part of a tradition.

  - Historical continuity: science and medicine have used these languages for centuries,
  so new coinages remain compatible with existing terminology (back-formation from
  established nomenclature).

  - Economy: one word encodes a phrase.


  Criticisms/failures:

  - Obscurity: impenetrable to laypeople and to learners; burdens patients / users.

  - False etymological precision: a Greek/Latin-looking word can combine roots incorrectly
  (mixed Greek/Latin hybrids are traditional in some fields), and other roots'' meanings
  are arbitrary, so the promised transparency can be illusory.

  - Backward-looking: freezes concepts when later science shows the original morphology
  is wrong (e.g., "atom" = indivisible, but atoms are divisible). Names outlive the
  theories that justified them.

  - Bias: privileges Western classical tradition; many languages'' speakers find them
  as foreign as English; not truly neutral.

  - Duplication: competing coinages for the same concept produce confusion; the classical
  form can crowd out more transparent or local terms.


