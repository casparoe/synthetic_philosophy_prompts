  Davidson''s view (from "What Metaphors Mean", 1978):

  - Metaphors mean literally what the words mean; there is no special "metaphorical
  meaning" encoded in the sentence.

  - "Metaphor does its work through the literal meaning of the sentence, but the effect
  is not to convey a message."

  - A metaphor like "Juliet is the sun" means, literally, that Juliet is the sun —
  false (or trivially true in other cases). The metaphor doesn''t say something true
  or false beyond that; it makes us attend to surprising likenesses, by nudging imagination.

  - Understanding a metaphor is open-ended; no single cognitive content is the meaning.

  - He denies that metaphor is a vehicle for conveying propositions or that there
  is a distinction between what words mean and what they are used to do.

  - He also says metaphor is not merely emotive, it does have a cognitive effect,
  but not a cognitive content of the sort propositions have. Actually he says metaphors
  can be profoundly illuminating — he compares them to pictures or bumps on the head.
  He thinks metaphors don''t have cognitive content but cause us to notice things.


  Conceptual metaphor theory (Lakoff & Johnson, "Metaphors We Live By", 1980; Lakoff
  "Contemporary Theory of Metaphor"):

  - Metaphor is not primarily a figure of speech but a matter of thought: we understand
  abstract domains (argument, time, love) in terms of more concrete/sensory domains
  (war, money, journey).

  - These conceptual mappings are systematic and structure reasoning: ARGUMENT IS
  WAR makes us talk about "attacking" positions, "defending" claims; TIME IS MONEY,
  etc.

  - Metaphorical expressions are surface realizations of deeper conceptual mappings.

  - The theory claims novel metaphors can create new ways of thinking, and that much
  of ordinary abstract thought is metaphorical.


