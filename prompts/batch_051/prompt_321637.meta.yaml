  ---


  Consider a letter-string analogy microdomain of the kind studied in the Copycat
  modeling tradition. A problem has the form "source-string -> target-string; probe-string
  -> ?" For example, "abc -> abd; ijk -> ?" is naturally solved as "ijl": the transformation
  replaces the rightmost letter by its alphabetic successor, and this same transformation
  applied to "ijk" replaces "k" by "l."


  Structural roles matter. The microdomain includes sameness groups (e.g., the doubled
  kk in iijjkk), positional roles (leftmost, middle, rightmost), and relational roles
  (successor, predecessor, first, last). The interesting cases are those where a literal
  transfer of the source transformation is blocked or pressured, so something must
  slip. Two stock examples:


  - "abc -> abd; iijjkk -> ?" admits at least "iijjll" (the rightmost group, kk, is
  replaced by its successor group, ll) and "iijjkl" (only the rightmost letter, k,
  is replaced by its successor, l).

  - "abc -> abd; xyz -> ?" admits at least "wyz" (when z has no successor, the roles
  "rightmost" and "successor" slip to "leftmost" and "predecessor") and "xya" (if
  the alphabet is treated cyclically).


  Suppose two researchers disagree about what this microdomain shows about concepts.
  The fluid-concepts researcher holds that the graded, context-sensitive competition
  among interpretations in this microdomain is the visible signature of conceptual
  slippage: concepts such as letter, successor, and group are not fixed atoms but
  dynamically constructed, partly overlapping structures, and a system that solves
  the domain fluently must represent concepts that way. The symbolic-structures researcher
  holds that the same behavior can in principle be produced by a classical architecture
  with explicit structural descriptions, a space of discrete transformation rules,
  and stochastic competition among hypotheses under evaluation heuristics; on this
  view "conceptual slippage" is at most a convenient abbreviation for a probability
  distribution over discrete interpretations, and positing irreducibly fluid concepts
  adds no explanatory or computational content.


  Draft the joint statement these two researchers could both sign after a good-faith
  adversarial collaboration. The deliverable is not a verdict but a constructive document:
  claims both sides accept, residual disagreements made exact, prejudiced neither
  way, and cruxes stated so that settling a crux would move at least one side. Use
  the following sections, in this order:


  1. Agreed claims (roughly 500–700 words). A numbered list of claims both researchers
  will sign. Cover: what the microdomain demands of any adequate model; what the ambiguity
  examples establish and do not establish; what counts as data versus interpretation;
