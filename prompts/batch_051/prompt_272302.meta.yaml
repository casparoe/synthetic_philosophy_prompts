  "I''ve been chewing on this for an assignment in my data-policy seminar and keep
  going in circles, so I''d like a careful analysis rather than a yes/no verdict.
  We read Warren and Brandeis''s The Right to Privacy (1890 Harvard Law Review), and
  this bit struck me:


  [indent] "This development of the law was inevitable. The intense intellectual and
  emotional life, and the heightening of sensations which came with the advance of
  civilization, made it clear to men that only a part of the pain, pleasure, and profit
  of life lay in physical things. Thoughts, emotions, and sensations demanded legal
  recognition, and the beautiful capacity for growth which characterizes the common
  law enabled the judges to afford the requisite protection, without the interposition
  of the legislature."


  The authors go on to argue for a right of privacy grounded in an ''inviolate personality,''
  not in property. But a friend of mine from a startup keeps pitching a property-style
  scheme, and I want to walk through how it would actually behave rather than just
  whether it''s a good idea in the abstract. The proposal: any company holding records
  ''about'' a natural person — identifiers, behavioral logs, inferred traits — must
  deposit a quarterly royalty, say five cents per person per quarter, into a public
  clearinghouse. Individuals can claim their pot by verifying identity; anything unclaimed
  after two years reverts to a privacy-enforcement fund. Companies may deduct the
  fair value of the free services actually used by that person in that quarter, as
  certified by an auditor the company chooses and pays. Small firms (under, say, 50k
  records) are exempt. So treat the thing as a mechanism: what does it incentivize
  for users, for companies, and for the data brokers and ad exchanges in between?
  Where does it get gamed first (I''m imagining disputes about what counts as a record
  ''about'' a person, derivative data, and inflated free-service valuations)? What
  second-order effects should I expect, like data becoming something companies hoard
  instead of share? And does the Warren and Brandeis passage suggest the whole property/royalty
  frame is off, or does it actually support treating personal data as a tradable asset?"


