  the relation between the Four Beginnings (四端, sadan) — the "four sprouts" from Mencius:
  commiseration (惻隱), shame/dislike (羞惡), modesty/yielding (辭讓), and right/wrong (是非)
  — and the Seven Emotions (七情, chiljeong) from the Book of Rites: joy, anger, sorrow,
  fear, love, hatred, desire (喜怒哀懼愛惡欲). The question: do the Four Beginnings and Seven
  Emotions issue from different sources (li/理 vs ki/氣), or are they ultimately the
  same? Toegye initially held that the Four Beginnings issue from li and the Seven
  Emotions from ki ("四端發於理，七情發於氣"). Gobong objected: the Four Beginnings are included
  within the Seven Emotions; and the Seven Emotions issue from both li and ki. The
  debate evolved; Toegye eventually formulated "四端理發而氣隨之，七情氣發而理乘之" — the Four Beginnings:
  li issues and ki follows; the Seven Emotions: ki issues and li rides on it. This
  was later systematized by Yi I (Yulgok) who held "氣發理乘一途" — a single path: ki issues
  and li rides. The debate is central to Korean Neo-Confucian metaphysics and influenced
  the development of distinct schools (Yeongnam vs Giho). It''s about moral psychology
  and metaphysics: whether moral emotions (Four Beginnings) are purely good and directly
  rooted in principle (li), while ordinary emotions involve ki and can be good or
  bad.


