  idealization where a human H answers a hard question by posing subquestions to copies
  of H, each of whom can pose further subquestions, until every leaf question is small
  enough to be answered in one short, unaided step. Factored cognition is the thesis
  that, with a good enough decomposition, such a tree of ordinary human-scale steps
  can answer questions that no single human could answer in a lifetime. That is not
  how I usually think about hard problems, and it struck me that the picture resembles
  a Bayesian network. There, a joint distribution over many variables is made tractable
  by factoring it into local conditional distributions — one per variable, each depending
  only on that variable''s parents — and exact inference on a tree proceeds by message
  passing, where each node does a small local computation and passes summaries to
  its neighbors, without ever constructing the full joint table.


