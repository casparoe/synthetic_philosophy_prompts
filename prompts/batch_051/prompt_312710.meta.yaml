  Kalai–Smorodinsky bargaining solution: Given a bargaining problem (feasible set
  S of utility pairs, disagreement point d), the KS solution is the maximal point
  on the Pareto frontier where the ratios of gains from disagreement to the ideal
  (max possible utility for each) are equal: (u1 - d1)/a1 = (u2 - d2)/a2, where a_i
  = max u_i on S subject to the other''s u_j ≥ d_j. It''s "maximal equal proportional
  sacrifice" or "equal relative concession." Monotonicity axiom distinguishes it from
  Nash.


