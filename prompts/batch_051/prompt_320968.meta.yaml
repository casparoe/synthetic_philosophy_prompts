  Let me recall Kant''s First Antinomy.


  Thesis: The world has a beginning in time, and is also limited in space. Proof:
  If no beginning in time, an infinite series of successive states has elapsed; but
  an infinite series can never be completed by successive synthesis; hence the world
  must have a beginning. For space: if world unlimited, it is an infinite given whole
  of coexistent things, which cannot be thought as a whole except through synthesis
  of parts, which would require infinite time; contradiction.


  Antithesis: The world has no beginning and no limits in space. Proof: If beginning,
  then time before the world existed (empty time), but in empty time no coming-to-be
  is possible because no part of empty time has distinguishing condition of existence
  rather than non-existence. Etc.


  Kant''s resolution: both are false because the world (the whole series of appearances)
  is not a thing in itself; it exists only as a representation, and the regressive
  synthesis is a rule for possible experience, never completed. The question whether
  world is finite or infinite in itself is a dialectical illusion. For appearances,
  world is neither finite nor infinite in itself; the regress is indeterminate (indefinite).


  Now the belief set. I want a realistic person: a philosopher with Kantian leanings
  but empirically informed, teaching modern philosophy. Let''s craft commitments:


  1. I think the thesis and antithesis arguments in the First Antinomy both go through
  on the assumption that the world-whole is a completed object; that''s exactly what
  I take Kant to reject. (Methodological commitment about the dialectic.)

  2. I reject the transcendental distinction between appearances and things in themselves.
  I''m a "one-world" Kantian: the world studied by cosmology just is the world, not
  a representation of it.

  3. I take Kant to be committed to "empirical realism": appearances exist in space
  and time and are empirically accessible; transcendental idealism only says they
  are not things in themselves.

  4. I think the Big Bang is the beginning of the empirical universe, including physical
  time, and cosmology is warranted in asserting that.

  5. I also think, with Kant, that any claim that the empirical series is either completed
  or infinite as a whole is an illegitimate transcendental use of the understanding,
  because the regress is only ever given as a rule, not as a completed totality.


