  "I keep going back and forth on Nozick''s experience machine. In Anarchy, State,
  and Utopia he writes, ''We can continue to imagine a sequence of machines each designed
  to fill lacks suggested for the earlier machines.'' Take that thought seriously.
  Suppose the machine on offer isn''t the classic pleasure-tank version but the final
  product of that iterative process: it gives you a life full of genuine challenge,
  novelty, risk of failure, even stretches of boredom and unhappiness — whatever,
  on reflection, people actually want their lives to contain — and it''s a shared
  machine, so your friends can be in there with you as real agents responding to you
  in real time. The one thing it can''t give you is causal contact with the world
  outside the simulation. Does Nozick''s argument still have any force against this
  machine, or have we just argued ourselves into accepting a full-time simulation?
  Which of his three reasons (wanting to do things, wanting to be a certain way, wanting
  contact with a deeper reality) survives the upgrades, and which ones get absorbed
  into the machine''s programming? If you had to defend a verdict on whether to plug
  in to this specific machine, what would it be and why?"


