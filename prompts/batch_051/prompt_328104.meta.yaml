  ---


  Ancient atomism left modern philosophy a sharp but now obsolete-looking criterion
  of what it is to be matter: what is, fundamentally, is atoms and the void. Atoms
  are solid, impenetrable, indivisible bodies with no void inside them; the void is
  empty space, and in some sense nothing at all. Material objects, on this view, are
  composites of atoms, and all their other features—color, liquidity, warmth—are,
  in the atomists'' phrase, matters of arrangement. I still find myself relying on
  that picture''s word for the material/non-material boundary, but modern physics
  seems to separate the properties that the picture fused together. A granite block
  is mostly empty space once you descend to its atoms; a magnetic field occupies a
  region of space and carries energy, yet two fields can be in the same region at
  once; a neutrino passes through the Earth almost as if it were not there; and the
  elementary particles of present-day physics are treated as point-like rather than
  as solid plena. I would like a working definition of "matter" (or "material object,"
  if you prefer) that gets these cases right:


  - a granite block

  - a Democritean atom, taken exactly as the atomists imagined it

  - a volume of void, with nothing at all in it

  - a magnetic field filling a region of space

  - a neutrino passing through the Earth

  - a photon in transit

