  The Rietdijk–Putnam argument: special relativity implies that for any two spatially
  separated events with spacelike separation, different frames assign different time
  orderings; so if "now" is defined relative to a frame, events in your future relative
  to your frame are in someone else''s past/now. Rietdijk (1966) and Putnam (1967)
  argued that relativity implies determinism/eternalism (block universe): if everything
  that is "now" in some frame is real, and for any future event there''s some frame
  in which it''s presently real, then all events are real. Notice the argument assumes
  "reality is frame-independent" and that "what is simultaneous with a real event
  is real" — the argument is contested.


  A concrete situation: Someone has a terminally ill parent or an impending bad event.
  A friend says physics shows the future already exists, so it''s already true/fated,
  nothing could have been different. Does that mean they shouldn''t feel grief or
  regret? Or someone argues "my future actions are already determined, so I shouldn''t
  bother." But the Rietdijk–Putnam argument is about the reality of future events,
  not necessarily determinism (block universe ≠ determinism exactly — eternalism is
  about all times being real, not about laws causing). Actually Putnam/Rietdijk saw
  it as determinism. This nuance could make the prompt rich: the person mistakes block
  universe for fatalism.


