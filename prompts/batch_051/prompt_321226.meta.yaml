  Accuracy-first epistemology (Pettigrew, Joyce, etc.): The core idea: we should evaluate
  epistemic states (credences) by their accuracy (closeness to truth), using strictly
  proper scoring rules. It gives a non-pragmatic, veritist justification for probabilism:
  by dominance — for any non-probabilistic credence function, there''s a probabilistic
  one that''s at least as accurate in every possible world and more accurate in some,
  relative to an additive strictly proper scoring rule (e.g., Brier score). Also supports
  Conditionalization via expected accuracy maximization (Greaves & Wallace). Also
  the Principal Principle? Maybe. Main objections: the Bronfman objection — that the
  dominance argument relies on a single scoring rule, but there are many; can''t dominate
  across all of them simultaneously. Responses: epistemic utility theorists pick the
  Brier score as the unique correct measure, or accept "accuracy-dominance" only relative
  to a legitimate measure but need to justify uniqueness; or appeal to symmetry/quantifiability.
  Another issue: veritism (only accuracy matters) vs pragmatic encroachment. Another:
  immodesty — any probabilistic credence function regards itself as uniquely maximizing
  expected accuracy relative to its own probabilities; this is desirable, but all
  probabilistic functions are immodest. Also the challenge from "accuracy for sets
  of propositions" or "doxastic states as coarse-grained"? Higher-order: the "self-undermining"
  issue with expected accuracy? Wait, accuracy-first and the principle of indifference?
