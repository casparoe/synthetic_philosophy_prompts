  an agent believes P and P→Q but hasn''t put them together; an agent believes that
  a particular program halts but doesn''t know a trivial consequence. Then ask: what
  theory of belief states (implicit vs explicit belief, awareness semantics, impossible
  worlds, fragmentation) captures these verdicts, which does it overturn, what does
  it predict about further cases.


