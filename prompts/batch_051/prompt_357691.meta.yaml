  Let me think deeply about Levinas.


  Levinas''s ethics: The face (visage) of the Other (Autrui) is a primordial address
  that forbids murder and commands "Thou shalt not kill"; the Other is not an object
  of cognition but is encountered as expression, vulnerability, height, destitution.
  Ethics is "first philosophy" because the encounter with the Other is prior to ontology,
  epistemology, etc. The "third party" (le tiers): in the face of the Other, all the
  others are present; the third party introduces the question of justice: I must compare
  incomparable others, thereby entering the realm of politics, reason, institutions,
  laws. Levinas says "The third is otherwise than neighbor, but also another neighbor,
  and also a neighbor of the Other, and not simply their fellow." The presence of
  the third means the relationship with the Other is not simply asymmetrical dyadic;
  it demands justice, which is "the comparison of incomparables." Levinas holds that
  justice requires the State, laws, etc., but these must be constantly checked by
  the ethical relation, lest they become totalizing. So the third party does not just
  ruin ethics; it founds the necessity of the political.


  Now craft an argument:


  Claim: Levinasian ethics faces a dilemma with the third party; either it cannot
  account for justice or it collapses into totalization.


  Steps:

  (1) My responsibility to each Other is infinite and asymmetrical: the face commands
  me before any calculation or comparison.

  (2) Whenever there is more than one Other — the third party — I am responsible to
  each in the same infinite, incomparable way.

  (3) Any response to more than one Other requires me to decide whose claim to answer
  first, how much, and by what rule; this is comparison.

  (4) But to compare the two Others is already to subsume them under a common measure
  and so to treat them as interchangeable instances of a kind — the very operation
  Levinas identifies with totalization.

  (5) Therefore, in any actual situation involving more than one person, Levinasian
  ethics either (a) gives no guidance, because it forbids the comparison needed for
  action, or (b) must resort to comparison and so abandons its founding contrast between
  ethical singularity and totalizing thought.


  Question: Is this argument valid? Does the dilemma go through? If not, exactly which
  step fails? Is there a reading of Levinas on the third party that avoids the dilemma,
  or does Levinas accept one horn?


