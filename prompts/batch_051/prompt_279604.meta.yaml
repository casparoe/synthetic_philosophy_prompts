  Lottery paradox (Kyburg 1961): In a fair lottery with one winning ticket among many
  (say 1000), the probability that ticket t1 loses is .999. If you accept any proposition
  with probability above a threshold (e.g., .99), you accept "t1 loses," and similarly
  for each ticket. If rational acceptance is closed under conjunction, you accept
  "t1 loses and ... and t1000 loses." But you know (and accept) that exactly one ticket
  wins; so you accept the contradictory conjunction "t1 loses and ... and t1000 loses"
  together with "some ticket wins." So the set of accepted propositions is inconsistent.
  Potential responses: reject high-probability acceptance (lockean thesis / acceptance
  threshold), reject closure under conjunction, deny that acceptance is a categorical
  notion, contextualism, etc.


  But careful: acceptance of "each ticket loses" is individually justified; closure
  under conjunction yields the conjunction of all losses; since the lottery has exactly
  one winner, that conjunction is inconsistent with the known truth "one wins." Actually
  if you accept each "ti loses," the conjunction of all "ti loses" is exactly "no
  ticket wins." And you know "one ticket wins." So contradiction.


