  He said I was refusing the only standpoint that matters. My reasoning for the rule
  is that nobody, me included, can run the idealized deliberation from where we actually
  are, so claims about what my perfect counterpart would think are cheap to make and
  impossible to check — everyone''s idealized interlocutor conveniently ends up agreeing
  with them. The rule has kept me safe from a lot of bad armchair psychology, but
  I realize it also puts me at odds with a whole family of views in metaethics and
  decision theory that cash out what I ought to do or believe in terms of what I''d
  endorse after full information or ideal reflection. And sometimes I suspect the
