  "I keep going back and forth on the old rule that ignorance of the law is no excuse.
  It''s a gorgeous principle from a system-design point of view: it''s simple, it
  doesn''t require courts to read minds, and it stops every defendant from turning
  ''well I didn''t know'' into a get-out-of-jail card. If the law''s bindingness depended
  on what each person happened to know, we''d have as many legal systems as defendants.
  But I have this intuition I can''t dislodge: punishing someone under a rule they
  could not possibly have known about feels like punishing them for a fact about the
  world they had no access to, not for a choice. Like a rule that''s published only
  as a PDF on some agency subpage, or a court decision that retroactively recharacterizes
  conduct everyone thought was legal—that just seems like state coercion, not law.
  So I don''t know which way to move. Walk me through the options honestly. If I keep
  the maxim, do I have to bite the bullet that secret or unfindable rules can bind,
  and is there a coherent version of ''law'' that includes them? If I amend the maxim
  with a carve-out for genuinely unknowable rules, how do I keep the carve-out from
  swallowing the rule (everyone will claim ignorance and we''re back to the enforcement
  problem)? And is there a reconciliation where the maxim was never a claim about
