  ---


  I am an undergraduate in a seminar on global justice, and I sit on my university''s
  Trademark Licensing and Labor Committee. The committee meets monthly to review garment
  factories in our licensed-apparel supply chain — usually ten to twenty per meeting
  — and decides whether to continue a license, continue it only with specified conditions
  and a timeline for remediation, or terminate it. I am one of three student members;
  the other members are administrators and one faculty member. None of us is a labor
  lawyer or an economist, each factory gets about thirty minutes of deliberation,
  and the committee''s vote becomes a recommendation to the university president,
  who has so far never rejected one. Whatever procedure you give me will therefore
  have consequences for the committee''s decisions and for workers who depend on these
  jobs.


  The seminar has been working through the dispute about whether an exchange can be
  exploitative even when both sides benefit relative to their next-best alternative.
  One camp argues that a transaction can still be wrongfully exploitative when the
  workers are better off taking the offer than refusing it, because what matters is
  the fairness of the terms, the share of value the workers receive, or the absence
  of a meaningful option to refuse. Another camp argues that if workers are made better
  off than under any realistic alternative and choose the work, the charge of exploitation
  is much harder to sustain, and that severing the relationship can harm precisely
  the people a critic wants to protect. I want a procedure that the committee can
  use without first having to settle this dispute.


  Please write a reusable decision procedure, not a one-off recommendation for a single
  factory. It should be a sequence of questions the committee asks in order, with
  the answer to each question determining the next step, where the procedure stops,
  and which action follows: continue, condition, terminate, or escalate. It must be
  runnable in thirty minutes per factory by non-specialists, it must keep factual
  findings separate from value judgments, and it must mark each step that is a judgment
  call rather than a question of fact. It should explicitly address the baseline problem:
  whether we compare a factory to what workers would otherwise have, to an independent
  standard such as a living-wage benchmark, or to both, and what the procedure should
  do when those two comparisons pull in opposite directions. Write the procedure as
  if the committee will vote to adopt it as standing policy.


  Then run the procedure on these three factories.


  - Factory A pays above both the legal minimum and the local agricultural wage but
  below our living-wage benchmark; hours are long but overtime is chosen by the workers;
  the workforce is mostly young women who intend to leave within two years; the university
  has very little leverage over the vendor.

  - Factory B employs migrant workers who paid large broker fees and signed contracts
  in a language they do not read; conditions formally meet the university''s code
  of conduct, but the committee cannot determine the workers'' realistic alternatives
  and has real doubts about whether their consent was informed. Terminating the relationship
