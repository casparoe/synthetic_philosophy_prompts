  My argument: The standard reading "looks flexible but is actually rigid" conflates
  two things:

  1. Being composed of fixed subroutines (rigidity at the component level).

  2. Lacking an exception-handling / monitoring layer that checks whether the current
  routine still satisfies the goal under changed circumstances (rigidity at the agent
  level).


  The wasp isn''t failing to be flexible; it''s failing at a specific control task:
  noticing that "cricket moved two inches" doesn''t imply "burrow needs re-inspection."
  If it had a loop that said "while cricket not inside: if cricket is near entrance,
  put it inside; else drag to entrance," it would be equally mechanical but wouldn''t
  loop. So the loop isn''t the signature of automatism; it''s a specific bug: the
  completion condition for the "drag to threshold" subroutine generates a new "inspect
  burrow" call regardless of history. We can make a robot that loops that way or doesn''t,
  both equally deterministic. So the example doesn''t reveal the wasp''s "true nature"
  as machine-like; rather its particular machine is badly wired. Hence sphexishness
  should be defined as "a control architecture that re-runs completed steps because
  its success conditions are too local/cue-dependent," not "doing things by routine."


  Then free will: The fear behind the sphex example is "look at how much apparent
  intelligence is just mechanical routine; maybe we''re all like that." But every
  skill—typing, driving, playing sport—is a hierarchy of routines; flexibility is
  achieved by a supervisor that monitors for violations of higher-order conditions.
  So "free" doesn''t mean "has no routines"; it means "can suspend, chain, and edit
  routines when monitor says things have changed." On this view, free will isn''t
