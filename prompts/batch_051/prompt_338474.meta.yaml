  Let me think deeply about the Basic Argument to write an accurate prompt.


  Galen Strawson''s Basic Argument (from "The Impossibility of Moral Responsibility,"
  1994) runs roughly:


  1. You do what you do, in any given situation, because of the way you are.

  2. To be truly morally responsible for what you do, you must be truly responsible
  for the way you are — at least in certain crucial mental respects.

  3. But to be truly responsible for the way you are, you must have chosen to become
  that way in some intentional, conscious, reason-responsive manner.

  4. And to have so chosen, you must have had reasons and principles P1 in light of
  which you chose, but then you must have been responsible for having those principles
  P1, which requires... an infinite regress.

  5. The regress can''t stop anywhere; so nobody can be truly or ultimately morally
  responsible for their actions.


  Key points:

  - It is an a priori argument, not an empirical claim about determinism; "the impossibility
  of free will / ultimate moral responsibility" holds whether determinism is true
  or false; it doesn''t premise determinism.

  - It is about "ultimate" moral responsibility, not the ordinary moral responsibility
  that is compatible with determinism; Strawson distinguishes "true/desert-entailing
  moral responsibility" from compatibilist notions. He thinks compatibilists change
  the subject.

  - Strawson himself holds that while we can''t be ultimately responsible, we still
  hold people responsible, punish, feel reactive attitudes — he''s not a nihilist
  recommending abolition of punishment out of hand; the illusion is inescapable. Actually
  there''s a distinction: he thinks "ordinary practices of punishment can be justified
  on consequentialist grounds" perhaps, and he wrote "Luck swallows everything" (a
  famous phrase by Thomas Nagel? Actually "There but for the grace of God" — Nagel''s
  "Moral Luck"). Strawson''s paper is a target of the Luck Argument too. He says the
  Basic Argument is unlike the Luck Argument.


  Common misrepresentations to incorporate:

  - "Strawson argues that because determinism is true, nobody can be morally responsible."
  Wrong: the Basic Argument is independent of determinism; it''s about self-creation
  regress. He says even if determinism is false, indeterminism doesn''t help because
  random events aren''t ''your'' doings.

  - "Strawson proves we should empty the prisons / abolish blame and punishment."
  Overstated: he distinguishes desert-entailing responsibility from ordinary holding
  responsible; he may think some punishment justified on consequentialist grounds;
  his target is the metaphysics of ultimate desert, not the practical policy.

  - "The argument shows that we shouldn''t blame people for anything, morally speaking."
  Misleading: he thinks the experience of being truly responsible is inescapable and
  the notion may be psychologically/evolutionarily indispensable; he''s not a simple
  "no one is responsible, so stop caring" guy.

  - "Strawson says you can''t be responsible for the way you are because you didn''t
  choose your genes or environment." That''s a sharpening: the Basic Argument goes
  further — even if you could choose your character, you''d need to have chosen the
  way you were when you chose, regressing. It''s not merely the "you didn''t choose
  your upbringing" point.

  - "Strawson is a hard determinist." No — he argues free will and moral responsibility
  are impossible whether or not determinism; he calls himself a... he''s non-compatibilist
  but not relying on determinism. "Hard incompatibilist"? Derk Pereboom uses that.
