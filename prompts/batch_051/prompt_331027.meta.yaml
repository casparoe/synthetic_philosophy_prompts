  for personal data." Define:


  A datum about a person P belongs to P in the property-relevant sense if and only
  if two conditions hold:

  (i) the datum would not exist, or would not have its content, without some activity
  of P (a production condition); and

  (ii) the datum is, or is readily usable as, a premise in practical inference about
  P — inference that bears on what P may do, will get, or deserves (an ascription
  condition).


  If both hold, P has a claim against others'' uses of that datum for those inferences.
