  ---


  I am a retired geochemist who has spent the past few years reading philosophy of
  science, and I have been drawn especially to the recent literature on causality.
  My old field dealt mostly with observational records—ice cores, sediment columns,
  long-term monitoring series—where controlled experiments were seldom possible, so
  Pearl''s distinction between seeing and doing struck me as obviously important.
  I recently came across a piece in a popular science magazine that summarized his
  framework roughly as follows:


  Pearl''s central achievement is the do-calculus, which at last lets one calculate
  the effect of an intervention from purely observational data whenever one has a
  causal diagram. The key tool is the do-operator, P(y|do(x)), which is essentially
  a rigorous way of conditioning on x while holding the confounders fixed. Pearl organizes
  causal knowledge into three rungs: association, prediction, and explanation. The
  headline result is that the do-calculus lets one climb from the lowest rung to the
  highest using data alone, provided the diagram is complete. The framework rests
  on structural causal models, which assume that causation is acyclic—cycles are ruled
  out—and that each variable is a deterministic function of its direct causes. Because
  the top rung concerns what would have happened, Pearl regards counterfactual claims
  as empirically untestable.


  The article then drew the further moral that machine-learning systems which merely
  fit conditional probabilities are in principle incapable of genuine causal reasoning,
  and that no amount of additional data can close that gap.


  I would like an accuracy audit of that summary, sentence by sentence. Tell me which
  parts a careful philosopher of science working on causation would accept, which
  parts they would wince at because they conflate or overstate, which parts are simply
  wrong, and how each mistaken part should be corrected. Then say whether the article''s
  further moral about machine learning follows from anything true in the summary,
  and, if not, what weaker claim is defensible. I ask because the summary flatters
  my old habit of thinking that "controlling for" the right variables was already
  causal analysis, and I suspect that is the very confusion I should unlearn. Please
  write the response in American English.


