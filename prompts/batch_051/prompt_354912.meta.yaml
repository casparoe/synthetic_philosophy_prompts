  Full prompt:


  Before I read another defense or condemnation of a particular biopic, I want the
  full specification first. Write the desiderata that an adequate theory of what we
  owe the real dead when we dramatize them—in historical fiction, film, and television—must
  meet. Fix the purpose as: evaluating whether a dramatization of a specific real
  person has discharged its obligations to that person and to the historical record,
  for a general audience that will absorb some of what it sees as history.


  For each requirement, give the case or consideration that forces it, and mark which
  requirements you take to be non-negotiable and which are really only the preferences
  of one camp (strict documentary fidelity, loyalty to the family, maximal artistic
  license, and so on). I especially want to see where the list is internally tense:
  which plausible pairs of requirements cannot be jointly satisfied, or can be satisfied
  only by qualifying one of them. Address the distinctions a theory cannot collapse,
  such as those between private individuals and public figures; between inventing
  events and filling gaps the record leaves open; between falsehood, omission, and
  misleading framing; and between harm to the living and wrong to the dead. Also locate
  the wrong itself: does the obligation run to the dead person, to survivors, to the
  integrity of public memory, or to the viewer, and can the theory say so without
  quietly collapsing that distinction into one of the others?


  Then test the list briefly against three problems, and say whether any of them shows
  that a requirement needs revision: (1) a fictional account that preserves every
  documented public fact about a historical statesman but inserts a wholly invented
  private act of cowardice to make a thematic point; (2) a film drawn from a writer''s
  private letters, published against her estate''s wishes, that dramatizes scenes
