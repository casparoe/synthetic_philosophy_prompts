  "Hey—can you tell me which step goes wrong in this argument, because the conclusion
  seems off. It''s about loss aversion. Adam Smith somewhere in The Theory of Moral
  Sentiments says the pain of falling from a better to a worse situation is greater
  than the pleasure of rising from a worse to a better one. So:


  (1) People tend to feel losses more sharply than equivalent gains.

  (2) If losses loom larger than gains, then a person will often demand more money
  to give up something they already have than they would have paid to get it in the
  first place.

  (3) That''s exactly what the endowment effect shows: owners demand more to sell
  a mug, say, than buyers are willing to pay.

  (4) But the standard explanation sees the endowment effect as a bias—the result
  of irrational loss aversion.

  (5) If it''s just loss aversion, then part of the effect is purely psychological:
  the object hasn''t changed, so the owner''s higher price doesn''t reflect any new
  information about the object''s value to them; it just reflects a quirk in how they
  weigh gains and losses.

