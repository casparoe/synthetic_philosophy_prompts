  Draft:


  "I''m a software engineer with no formal background in philosophy, and I keep coming
  back to a dispute in mathematics that looks, from the outside, as though it should
  have been settled by now but somehow hasn''t been. In the 1970s, Appel and Haken
  proved the four-colour theorem by reducing it to nearly two thousand cases and checking
  those cases on a computer. A large chunk of the mathematical community objected
  that this wasn''t really a proof, because no human being could survey it; the counter-argument
  was that the computer had produced exactly the kind of certainty a proof is supposed
  to produce. Hales''s proof of the Kepler conjecture ran into the same objection,
  and even the Flyspeck project, which later produced a formal, machine-checked verification
  of that proof, didn''t end the argument — it just moved it. So the debate has been
  running for roughly fifty years, with each side''s arguments well rehearsed, and
  I don''t see anyone changing their mind.


  From my vantage point, this is strange. I think constantly about what it means to
  trust software, what a test suite actually establishes, and how a machine-checked
  proof differs from a hand-written argument; none of that makes me want to deny that
  a verified exhaustive search settles the four-colour theorem. And yet I can also
  feel the pull of the other side: a certificate that no one can read doesn''t tell
  me why the theorem is true, and it seems to change what mathematics is for.


