  "One of the things that struck me when I moved from the natural sciences into philosophy
  is how rarely arguments about large historical change are made to state their causal
  assumptions in a form one could test, even in principle. I want a prediction, but
  I want the machinery of it exposed.


  Consider, then, a counterfactual. Let the Reformation in northwestern Europe proceed
  exactly as it did through the middle of the sixteenth century, with one change.
  The Reformed churches teach double predestination as before — God has chosen the
  saved and the damned, and nothing the creature does can alter that decree. But they
  explicitly and successfully teach that no earthly circumstance whatsoever constitutes
  evidence about one''s election: not prosperity, not moral improvement, not membership
  in the visible church, not an inner feeling of grace. In other words, the psychological
  pressure of uncertain election is kept fully intact, while every sanctioned outlet
  for reading one''s own condition off the shape of one''s life is closed down. Nothing
  else changes: the surrounding economy, the suspicion of consumption, the doctrine
  of the calling, and the social standing of merchants all remain as they historically
  were.


