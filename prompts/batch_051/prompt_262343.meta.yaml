  ---


  I''m a novelist, and I could use a hand keeping a fictional church committee''s
  theology consistent over the length of a book. The novel is set in a small evangelical
  denomination that''s been arguing for years about whether the miraculous gifts are
  still around — the usual cessationist-versus-continuationist split. There''s a Gifts
  Discernment Committee that reviews reports of healings, tongues, prophecy, words
  of knowledge, and decides whether to affirm them or not. I''ve already written a
  string of their rulings in earlier chapters, so I can''t retcon them now. The climax
  of the book is a new case they have to decide, and I want them to be as consistent
  with their own precedents as a real committee could be, or at least honest about
  which principle they''re adopting if the old cases don''t force a decision.


  Their precedents as I''ve written them:


  1. Martha, a farmer in her sixties, said her migraines disappeared during a prayer
  meeting. The committee thanked God and called it a genuine answer to prayer, but
  voted down wording that called it a sign-gift. Their reasoning was that God still
  works through prayer and ordinary providence, so there''s no need to say the apostolic
  gifts have returned.


  2. A delivery driver spoke in tongues during a Sunday service, and nobody could
  interpret. The committee didn''t call it fake. They said it didn''t edify the congregation,
  and they told him to keep it to his private devotions.


  3. An elderly woman dreamed that a missionary''s jeep would break down on a mountain
  road, and the next day it did. The committee gave public thanks but refused to call
  the dream prophecy. They said God can arrange a warning without someone holding
  a prophetic office.


  4. A businessman''s advanced pancreatic cancer went into full remission after the
  elders anointed him with oil and prayed. He had scans before and after. The committee
  declared it a genuine act of God, but the written ruling deliberately avoided saying
  the elders had a gift of healing.


  5. A college student gave a word of knowledge that a visitor was hiding a serious
  sin; the visitor denied it and left angry. The committee called the claim unverifiable
  and pastorally reckless, and they banned publicly naming strangers'' hidden sins.


  6. A woman with a local reputation as a healer prayed over a friend''s chronic back
  pain, and the pain stayed gone for a year. The committee said something good had
  happened, but refused to certify her as a healer because subjective pain relief
  has too many natural explanations and they didn''t want to create a healing celebrity.


  Now the new case. Ada is a retired nurse, quiet, well liked. She says the Spirit
  has given her an ongoing gift of healing, not just a few answered prayers. She''s
  not asking for money or status; she''s asking the committee to formally recognize
  the gift so the church can send people to her with honest expectations. She brings
  records. Over two years, after she laid hands on people and prayed, three people
  with independently diagnosed, documented conditions recovered in ways their doctors
  found hard to explain: a fractured wrist that had refused to knit for months and
  then bridged within ten days, a thyroid mass that was gone on the follow-up ultrasound,
  and a case of pneumonia that reversed overnight after the family had been told to
  prepare for the worst. There were witnesses to the diagnoses and recoveries, and
  Ada hasn''t promoted any of it.


  I can hear the two wings of the committee already reading the record differently.
  The old cessationists say the precedents all point the same way: God heals, prayer
  is answered, but you never certify an ongoing gift, so Ada gets thanksgiving and
  nothing else. The younger continuationists say the precedents point their way too:
  tongues were denied because there was no interpretation, the word of knowledge because
  it was unverifiable, the back-pain healer because the evidence was subjective, and
  the business man''s remission wasn''t a request to certify a gift. Ada, they say,
  is the first case with documented, objective, unhyped evidence for an ongoing gift.


  So, for my scene: what should the committee decide if it''s actually following its
  own precedents rather than just voting with its tribe? Which earlier ruling is the
  closest analog? And if the precedents genuinely underdetermine it, what principle
  is the committee adopting either way — and is there a third reading of the record
  that fits better than either side''s story?


