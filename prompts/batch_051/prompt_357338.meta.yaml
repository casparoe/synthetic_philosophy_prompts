  Potential final prompt:


  "You are an expert political philosopher with a special interest in the analysis
  of political slogans. I am a philosophy professor preparing for a graduate seminar
  on distributive justice. In last week''s seminar, a student repeatedly quoted the
  slogan ''From each according to his ability, to each according to his needs'' in
  order to dismiss, in one move, any proposal that ties income to contribution, makes
  benefits conditional on work, or excludes unpaid care work from the distributive
  system. I do not want the class to treat the slogan as a conversation-stopper, so
  I intend to devote part of the next session to working out what it could actually
  be claiming.


  Your task is to write a disambiguation of this slogan. Before drafting, think carefully
  about the fact that it contains two distinct clauses and that they might be read
  separately, jointly, or as one embedded in the other; brainstorm at least six candidate
  precisifications and then settle on the ones that are most distinct and philosophically
  interesting.


  For each precisification, provide:

  (1) a one-sentence plain-language statement of the precise claim;

  (2) a classification as trivial, substantive and defensible, substantive but doubtful
  or false, or radical (your best judgment);

  (3) an explicit verdict on whether that reading would actually support the student''s
  use of the slogan to dismiss contribution-tied or work-conditional proposals.


  Then close with a short paragraph answering the following: which reading, if any,
  comes closest to making the student''s argument work, and which reading must the
  student be assuming for the slogan to have any force in these debates?


  Aim for the menu to be the deliverable, not a single interpretation: distinct possible
  claims should be separated, and the ambiguities that let the slogan do more work
  than any one precise claim can bear should be made visible."


