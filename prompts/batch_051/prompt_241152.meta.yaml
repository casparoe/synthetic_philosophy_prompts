  and principle." The Four-Seven debate concerns the relation between the Four Beginnings
  (compassion, shame/dislike, modesty/deference, right/wrong) which are moral emotions,
  and the Seven Emotions (joy, anger, sorrow, fear, love, hate, desire) which are
  general human feelings. The key question: are the Four Beginnings really distinct
  in kind from the Seven Emotions? Yi Hwang (Toegye) held that the Four Beginnings
  are "li-issued" (i.e., issued by principle, li) while the Seven Emotions are "qi-issued"
  (material force); Ki Dae-seung (Gobong) argued that the Four Beginnings and Seven
  Emotions cannot be divided as li vs. qi because all actual feelings require both
  li and qi; the Four Beginnings are just the good subset of the Seven Emotions. The
  debate got refined: Yi Hwang eventually formulated "the Four Beginnings are the
  issuance of li, and qi follows; the Seven Emotions are the issuance of qi, and li
  rides on it" (sadan i bal, ch''iljong gi bal... actually "四端理發而氣隨之, 七情氣發而理乘之").
