  A good activity: the Ehrenfest dog-flea model / urn model. Materials: counters (e.g.,
  40 red tokens representing "gas particles"), two boxes labelled L and R, a coin
  or die for each pair, a tally sheet. Rule: at each tick, a token is chosen at random
  (or each pair flips a coin for each token) and moved to the other box. Start with
  all tokens in L (low-entropy, non-equilibrium). After each "round" of many ticks,
  record the number in L. Over time the distribution relaxes toward roughly half in
  each box, with small fluctuations. But the micro rule is symmetric: every move is
  reversible; the reverse sequence is also generated by the same rule. Then the "mirror
  round": take the recorded sequence, reverse it, and show that if you started at
  the end state you could, with the same dynamics, retrace the steps — but you don''t
  see that happen because the end state is overwhelmingly likely to be a "typical"
  high-entropy state whose past, under the same dynamics, looks like a typical high-entropy
  state, not a specially ordered one. The arrow emerges from the initial special state.


  The debrief maps: tokens → microstates; number in L → macrostate; the rule → time-reversal-symmetric
  microdynamics; the initial all-in-L → Past Hypothesis; the relaxation → the second
  law as probabilistic; the lack of a reverse arrow → the problem of the past hypothesis
  and why the past is special.


