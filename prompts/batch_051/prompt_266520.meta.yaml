  Possible moves:


  (1) Priya opens: "If people''s moral intuitions just track their political tribe,
  then our gut convictions can''t be trusted as evidence about what''s actually right.
  The fact that the ''other side'' feels equally strongly shows all of it is just
  rationalization." Might be a naive debunking move.


  (2) Marcus replies: "That cuts both ways — it would debunk your convictions too.
  Also, disagreement doesn''t show nobody is right; people disagree about the shape
  of the Earth in some small online forums and that doesn''t debunk geology. We need
  an argument, not a poll or a brain scan."


  (3) Priya: "But the psychology isn''t neutral: it shows foundations are recruited
  in the service of pre-existing group identity. So the intuition isn''t doing independent
  justificatory work. At least if I know my belief is caused by my politics, I should
  lower my confidence."


  (4) Marcus: "Lowering confidence across the board may be fine, but the study also
  found conservatives draw on more distinct foundations while liberals rely mostly
  on two. If you treat all foundations as legitimate data points about the moral domain,
  that could suggest conservative judgments are based on a richer, more complete set
  of moral inputs — so if anything, the psychology favors the conservative side."


  (5) Priya: "That''s a category error. ''More foundations'' is a description of what
  people feel, not a reason to think loyalty or purity are genuine moral values. A
  psychopath drawing on zero foundations wouldn''t be wrong just because his repertoire
  is small. What would count as ''legitimate moral input'' is exactly what''s in dispute."


  (6) Marcus: "Right, but the same goes for harm and fairness — the fact that you
  feel them doesn''t make them real moral inputs either. You can''t appeal to psychology
  to debunk my intuitions and then exempt yours. You need an independent criterion
  of which intuitions are moral data. And if such a criterion exists, then the whole
  debunking argument was doing no work; if it doesn''t, then we''re stuck with what
  we''re all working with."


