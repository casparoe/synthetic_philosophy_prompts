  Draft:


  I work as a software engineer, and last week two of my coworkers got into an argument
  at lunch over a popular book one of them had read about moral foundations research.
  I was the only bystander and mostly just listened; I''ve reconstructed the exchange
  below as faithfully as I can. I''d like a move-by-move adjudication. For each step,
  say who is on solid ground, who is overreaching, and why; then say what, if anything,
  both of them are missing. Specifically, does the descriptive psychology of left
  and right tell us anything about which side''s moral judgments are more likely to
  be correct, or is the honest conclusion that it tells us nothing?


  Maya opened with the book''s main finding as she saw it: across many countries,
  people on the political left lean heavily on two clusters of moral intuition — harm
  and fairness — while people on the right draw on those plus three more — loyalty,
  authority, and purity. Her first claim was that if your deepest moral convictions
  are just a function of which psychological channels your politics happens to activate,
  then they cannot be trusted as evidence about what is actually right. If someone
  on the other side has equally strong intuitions pointing in the opposite direction,
  then the intuition isn''t doing independent work.


  Dmitri replied that this proves too much. People disagree about factual matters
  too, and flat-earthers exist, but disagreement alone doesn''t debunk geology. The
  psychological finding, if it''s a reason to discount anyone''s convictions, is equally
  a reason to discount hers. Unless she has an independent argument for why only her
  two foundations count, she''s just declaring the other side''s intuitions to be
  noise.


  Maya answered that the asymmetry is in the content of the foundations. Harm and
  fairness are at least capable of being applied consistently to strangers and extended
  outward, while loyalty, authority, and purity inherently protect the local group,
  the hierarchy, and the in-group. So the psychology isn''t symmetric after all: it
  explains conservative judgments as the output of foundations that are partial and
  exclusionary by their very structure.


  Dmitri said "partial and exclusionary" is doing all the work, because it assumes
  impartiality toward strangers is the standard of moral correctness. Someone who
  values loyalty will simply deny that partiality to one''s own is a defect; they
  may think it is a requirement. And her test — "can it be generalized to strangers?"
  — looks like one of her own two foundations dressed up as a neutral criterion.


  Maya granted that this is a fair objection to her, but said he has the mirror problem.
  If the research shows that conservative-specific foundations track hierarchy and
  in-group boundaries, then the fact that millions of people have those intuitions
  is still just a fact about group psychology, not a justification of them. A claim
  that partiality to one''s own is a moral requirement needs its own argument, and
  he hasn''t supplied one anywhere in the exchange.


  Dmitri closed by saying that on that reasoning neither side gets to use its own
  psychology as justification, so maybe the honest conclusion is that moral foundations
  research is purely descriptive and has no bearing on who is right. But he added
  that many people who report the research still walk away saying it shows neither
  side is more moral — which would itself be a normative conclusion smuggled past
  the is-ought line.


