  sounds to me exactly like what happens when you have a partitioned dataset and you
  compute per-shard results, then combine them: each shard''s local aggregate can
  be correct, but the global answer you get by recombining can be inconsistent with
  any individual shard''s view, or even with the global constraints you know hold.
  In particular I''m thinking of something like: you have a table with a functional
  dependency, you split it across shards, you compute a view on each shard, and then
  you union the views—the union can violate the functional dependency even though
  no shard does. Or in streaming, two instances each maintain a correct local state,
  but the merged state violates a global invariant because the votes were taken at
  different times or over different partitions.


