  Draft:


  "My friend and I just spent a long evening arguing about what should count as rational
  betting once you take seriously the fact that wealth compounds multiplicatively
  over repeated bets — the family of ideas usually called Kelly betting or geometric
  rationality. We produced a four-part test, but then we got stuck on a case one of
  us insisted is a counterexample to our own test. I want your verdict, not a literature
  survey.


  Our four criteria for calling a betting policy geometrically rational:


  1. Log-growth optimality. Holding the other options fixed, the policy maximizes
  the expected logarithm of wealth per bet — equivalently, it maximizes the long-run
  compound growth rate of the bankroll.


  2. Bankroll preservation. The policy assigns zero probability to the bankroll ever
  reaching exactly zero, and it never stakes the entire bankroll on a single trial.


  3. Time consistency. After any history of wins and losses, an agent with unchanged
  preferences and unchanged information re-solving the problem from that point on
  would adopt the same policy; the policy is not something you can only endorse before
  the losses arrive.


  4. Repetition robustness. The policy''s advantage or disadvantage over alternatives
  is not a small-sample artifact: if the same opportunity were offered indefinitely
  many times, the policy''s ranking against alternatives would be preserved rather
  than reversed in the long run.


  The borderline case. A gambler faces a long sequence of independent, identically
  distributed binary bets. On each trial she may stake any fraction f of her current
  bankroll. If the bet wins, she receives a net profit of b times the stake; if it
  loses, she loses the stake. The win probability is p, with p and b positive and
  such that the full Kelly fraction f* = p − (1−p)/b lies strictly between 0 and 1,
  so the bet is genuinely favorable but not a sure thing. Now suppose the gambler
  adopts a fixed policy of staking exactly half of the full Kelly fraction on every
  trial: f = f*/2. This ''half-Kelly'' policy is standard advice among practitioners
  who fear parameter error and deep drawdowns, but by construction it fails criterion
  1 — its expected log growth is strictly lower than full Kelly''s, though it is still
  positive.


  Does half-Kelly count as geometrically rational by our four criteria? Work through
