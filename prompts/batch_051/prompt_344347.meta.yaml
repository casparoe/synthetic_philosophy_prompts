  Zorn''s lemma is interesting: it''s equivalent to the Axiom of Choice and the Well-Ordering
  Theorem over ZF; it''s a maximality principle; used to prove existence of bases
  for vector spaces, maximal ideals, etc. Misconceptions: the maximal element is not
  a maximum/unique; the "every chain has an upper bound" condition is often confused
  with "every totally ordered subset has a maximum" or with well-ordering; the lemma
  doesn''t construct the object; the partial order must be nonempty? Actually Zorn''s
  lemma: if every chain in a nonempty poset has an upper bound, then the poset has
  a maximal element. Some formulations don''t require nonempty but it''s implied by
  empty chain having upper bound. Misconceptions: the upper bound need not be in the
  chain; the maximal element need not be comparable to everything (only nothing is
  strictly above it); students confuse maximal with greatest; the proof via transfinite
  recursion / "build a tower" is nonconstructive; "choice" sneaks in when you pick
  upper bounds.


