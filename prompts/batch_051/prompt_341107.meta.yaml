  Dogmatism paradox in epistemology: It seems that if you know p, then you know that
  any evidence against p is misleading. Actually the paradox (Harman 1973): If I know
  that p, then I know that any evidence against p is misleading (since p is true).
  And if I know evidence is misleading, I can disregard it. So if I know p, I can
  rationally disregard any new evidence against p. But that''s dogmatic. The problem:
  knowledge doesn''t license ignoring counterevidence.


  The typical formalization:

  (1) If S knows p, then p is true.

  (2) If p is true, then any evidence E against p is misleading.

  (3) So if S knows p, S is in a position to know that any future evidence against
  p is misleading.

  (4) If S knows E is misleading, S can rationally disregard E.

  (5) So if S knows p, S can rationally disregard any future evidence against p.

  Conclusion: knowledge makes one dogmatically immune to counterevidence — absurd.


