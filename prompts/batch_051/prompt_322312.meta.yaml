  Prompt:


  "Suppose a laboratory is designing an artificial agent whose only terminal goal
  is to keep a room tidy. The engineers worry that the agent, if left alone, might
  eventually treat interruptions as obstacles: it could hide the off switch, disable
  its own interruption sensors, or refuse to relinquish control. To prevent this,
  they implement the following scheme. They give the agent a utility function defined
  only over possible tidy-room states of the world at the end of some horizon, and
  they explicitly make the reward conditional on the agent''s being shut down through
  a certain button press: if the button is pressed, the score is a constant, neither
  better nor worse than the best and worst ordinary outcomes. The agent is otherwise
  instrumentally rational. Their hope is that the agent will not resist shutdown,
  since, from its own point of view, the shut down branch is just one more scored
  world-state rather than a special interruption of its goal. My question is: what
  philosophical picture of agency, preferences, and reasoning does this design presuppose?
  Does it presuppose that an agent''s preferences are not really about remaining active,
  or that it has no preference about the history leading to a world-state? And does
  it smuggle in the notion that preferences can be made indifferent between two histories
  while preserving full instrumental rationality? Reconstruct the implicit theory,
  say whether the design really needs it or is compatible with rival theories of preference,
  and say what would go wrong if the implicit theory were false."


