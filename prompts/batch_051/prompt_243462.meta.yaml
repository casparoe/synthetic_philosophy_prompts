  I need to state mapping precisely. Let me get the technical details right.


  Imprecise probability basics:

  - A precise Bayesian agent has a single probability measure P over a state space.
  Credence in event A is P(A). Expected utility of act f: E_P[u(f)].

  - An imprecise agent has a (convex) set of probability measures, a credal set Π,
  and evaluates acts by lower expectation: inf_{P∈Π} E_P[u(f)], or chooses acts maximizing
  lower expected utility (maxmin expected utility, Gilboa–Schmeidler 1989). Upper
  and lower probabilities / previsions. The set Π represents ambiguity/ignorance;
  no single distribution can be justified.

  - Robust/distributionally robust optimization: We want to choose x minimizing cost
  c(x, ξ) where ξ is a random parameter with unknown distribution. Instead of assuming
  a known distribution P0, we minimize worst-case expected cost over an ambiguity
  set/uncertainty set of distributions D: min_x sup_{Q∈D} E_Q[c(x, ξ)]. Often D is
  a ball around an empirical distribution in Wasserstein distance, or moment-based
  set. There are tractable reformulations (robust counterparts) for many sets (Ben-Tal,
  El Ghaoui, Nemirovski; Bertsimas; Esfahani & Kuhn).

  - Parallel: replace set of probability measures Π with ambiguity set D; maxmin utility
  with min-sup expected cost; representation of ignorance with distributional uncertainty;
  both reject a single distribution.


  Where does the parallel break?

  - Imprecise probabilities are a theory of rational decision/degrees of belief; robust
  optimization is a computational/engineering methodology for hedging worst cases,
  often motivated by finite samples rather than ambiguity/ignorance.

  - In robust optimization, the ambiguity set often contains the true distribution
  with high confidence (data-driven, distributionally robust with Wasserstein) — its
  purpose is statistical safety/estimation error, not a representation of epistemic
  ambiguity in the Knightian sense.

  - Imprecise probability theory has an axiomatic foundation (avoiding sure loss,
  coherence, lower previsions), and it distinguishes "indeterminacy" from "sensitivity";
  robust optimization is primarily about computational tractability and worst-case
  guarantees.

  - Choice functions and maxmin in IP generally over states and acts; DRO often has
  adjustable/wait-and-see vs here-and-now decisions.

  - The parallel predicts results transfer: e.g., robust counterpart tractability
  should yield computational techniques for managing credal sets in IP; conversely,
  the coherence axioms of lower previsions might give criteria for well-formed ambiguity
  sets in DRO. Also the parallel predicts that any distinction in IP (e.g., dilation,
  updating on observations) should have a DRO counterpart — but updating an ambiguity
  set after observations is contested in DRO, and dilation has no obviously useful
  optimization counterpart. That''s a good "name something the parallel predicts that
