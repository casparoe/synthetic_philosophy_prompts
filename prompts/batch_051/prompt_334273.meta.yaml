    fields, or a table with specified columns, and spell out the schema (the field
    or column names and what goes in each). This suits rankings, ratings, comparisons,
    taxonomies, grading, and verdicts on cases; if your type of prompt asks for a
    piece of prose, ask instead for a brief structured summary in that form after
    the piece.'
