  Draft:


  "In a seminar on virtue and moral psychology, two of us have been going back and
  forth about the modern career of the idea of grit, and I have been left unsure what
  would actually resolve the argument. One side says that ''grit'' names a real and
  trainable character trait — roughly, the capacity to sustain effort and commitment
  toward long-term goals despite setbacks and boredom — and that if schools and employers
  want to predict and cultivate achievement, they should be measuring and trying to
  build it. The other side says this is ideology dressed up as measurement: that grit
  is, at best, conscientiousness or work ethic under a new brand name; that the apparent
  predictive power of the trait is inflated by differences in family resources, social
  capital, and the kinds of tasks people are allowed to pursue; and that the enthusiasm
  for grit quietly relocates structural problems (bad jobs, unequal schooling, impossible
  schedules) into the individual''s obligation to endure them. I''m less interested
  in taking sides than in understanding what evidence would make one side more plausible
  than the other.


  So: how would one test the conceptual claim that grit is a distinct and causally
  efficacious virtue or capacity, rather than a repackaging of traits we already measure
  or a confounded marker of advantage? Be concrete. Lay out the best study or sequence
  of studies you can design — what you would measure, over what time frame, in whom,
  and with what comparison conditions. Then say what pattern of results would favor
  the ''real trait'' reading and what pattern would favor the ''ideology/artifact''
  reading. Finally, be explicit about what even a well-designed positive finding would
  not settle — for example, whether grit is trainable in the relevant populations,
  whether it is the kind of thing we should morally admire, and whether promoting
  it makes institutions more just or merely more demanding. I want the operationalization
  and its limits, not a summary of the literature."


