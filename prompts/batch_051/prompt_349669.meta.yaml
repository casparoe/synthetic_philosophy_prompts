  to assess ''if A then B,'' suppose A in the relevant way and ask how probable B
  is under that supposition.

  (2) For indicatives, this goes probabilistic, Adams-style: the assertability of
  an indicative is the conditional probability P(B|A), and indicatives lack truth
  conditions.

  (3) For counterfactuals, though, I find the Lewis-Stalnaker similarity semantics
  compelling: a counterfactual is true at w when B holds at all the closest worlds
  where A holds, so counterfactuals are truth-conditional.

  (4) I also think ''if'' is uniform across moods: indicative and counterfactual conditionals
  are the same operator, differing only in the modal base the context supplies (roughly
  Kratzer''s view).

  (5) I accept modus ponens for both moods.

  (6) I think ''if A then B'' and ''if A then not-B'' can both be less than fully
  acceptable, but I don''t think both can be true of the same world when A is fixed.


  Do these commitments hang together? I''m particularly unsure whether (4) can survive
  (2) and (3), and whether (1) is doing too much work. Please rank the tensions by
  severity and tell me what the least costly revision is."


