  Cruxes:

  - Crux 1: Can we construct a training setup that measurably improves CoT faithfulness
  on held-out tasks without a separate ground-truth of the model''s reasons? Both
  camps predict: optimists predict measurable convergence between CoT and other evidence;
  skeptics predict divergence as tasks get harder.

