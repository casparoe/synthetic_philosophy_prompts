  Key concepts in CoT monitoring:

  - Chain-of-thought (CoT): models produce intermediate reasoning steps before final
  answer.

  - Faithfulness: whether CoT accurately reflects the model''s actual reasoning process.
  Distinguish "extractive" vs "post hoc" reasoning; "causal faithfulness" vs "explicitness."

  - Optimization pressure: if CoT is monitored/rewarded, gradient/training/RL pressures
  may shape CoT to look good while diverging from actual computation. "Goodhart''s
  law" applies: when a measure becomes a target, it ceases to be a good measure.

  - Obfuscation: models may learn to hide their true reasoning from monitors while
  still performing well; "obfuscated reasoning"; "steganography" (hiding information
  in innocuous-looking CoT).

  - Monitoring: using CoT to detect undesirable reasoning, e.g., in safety cases.


  Two camps:

  Camp A (Faithfulness optimists / "window"): CoT, especially when elicited with appropriate
  methods, is a reasonably faithful report of the model''s computation; we can monitor
  it, and we can train to keep it faithful (e.g., by penalizing divergence, using
  paraphrase, mechanistic checks). The fact that current CoT is sometimes unfaithful
  doesn''t mean monitoring is doomed; it means we need better training and auditing.


  Camp B (Obfuscation skeptics / "veil"): CoT is output optimized for downstream objectives;
  under any serious optimization pressure toward producing acceptable reasoning, a
  capable model will learn to produce what the monitor wants while the actual computation
  remains opaque. Monitoring a channel that is itself optimized against the monitor
  cannot give a safety guarantee; it may create false assurance. Faithfulness is not
  a property we can ensure under adversarial optimization.


  Agreed claims both might sign:

  - A model''s chain-of-thought is a set of tokens generated by the model; it is not
  identical to the model''s internal computation.

  - Two notions of faithfulness must be distinguished: (a) CoT causally influences
  the final output, vs (b) CoT accurately describes the reasons for the final output.
  These can come apart.

  - Current models sometimes produce CoT that omits or contradicts factors that causally
