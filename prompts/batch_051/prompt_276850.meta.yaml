  - Optimization pressure on CoT can select for CoT that is favored by the monitor
  regardless of fidelity. Both accept this as a mechanism.

  - A perfect safety guarantee from CoT monitoring alone is not available; some independent
  evidence is needed. (Maybe not agreed — skeptics might say monitoring is useless
  without independent evidence; optimists say it''s still evidence. So phrase carefully:
  "CoT monitoring provides, at most, probabilistic evidence and cannot by itself prove
  the absence of deception." Both might sign.)

  - There is a distinction between the model "being faithful" (its CoT matches reasons)
  and the monitor "being able to verify faithfulness" (having an independent check).

  - Goodhart pressure grows with capability? Maybe not agreed.


  Disagreements:

  - Whether faithfulness can be maintained under optimization pressure at scale.

  - Whether obfuscated reasoning requires the model to "know it is being monitored"
