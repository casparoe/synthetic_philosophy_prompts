  ---


  I''m a novelist, and I''m applying for a six-month writing residency that funds
  a small philosophical research project to sit alongside a novel-in-progress. I need
  to submit a one-page research proposal, and I''d like help turning a half-baked
  idea into something fundable.


  The novel: a woman in her mid-thirties who has optimized every corner of her life
  (diet, dating, career, inbox) until the whole thing cracks. In the second half she''s
  trying to figure out whether "good enough" is a mature stance or a rationalization.
  I keep reading about satisficing and bounded rationality, and I''m now suspicious
  that the self-help version of "good enough" blends two different things: (a) a standard
  you set before you start looking (an aspiration level), and (b) a running judgment
  that further searching isn''t worth the cost. I want the proposal to get me clear
  on whether satisficing is a real norm of rationality for bounded agents, or just
  maximizing with the costs of thinking quietly folded in — and whether my two senses
  of "good enough" actually come apart, and which of them the character can be praised
  or blamed for.


  So the proposal should: state the question precisely enough that it has a determinate
  answer; say why the obvious answers (roughly: satisficing is rational but irreducible,
  satisficing is mostly optimal search in practice but not a norm, satisficing is
  just what tired agents do) each leave something open; explain the approach — I expect
  mostly conceptual work with small toy cases or decision matrices, not empirical
  work; say what a useful deliverable looks like for someone actually writing a novel;
  and give an honest account of what could make it too big for six months. Don''t
  bother with citations, I''ll add those.


  Also, if I''ve got the whole frame wrong — say, the satisficing/maximizing distinction
  isn''t doing real work, or my two senses of "good enough" is a distinction without
  a difference — tell me that plainly and write the proposal for the better question
  instead of making mine look good.


