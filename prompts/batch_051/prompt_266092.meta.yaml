  I am not an academic; I read essays and older books in my spare time, and I recently
  came across W. E. B. Du Bois''s The Souls of Black Folk. A passage from the first
  chapter keeps coming back to me:


  [block quote]


  What puzzles me is that the remarks Du Bois describes — "I know an excellent colored
  man in my town," "Do not these Southern outrages make your blood boil?" — are not
  slurs. The speakers might even consider themselves sympathetic. Yet Du Bois experiences
  the conversation as being made into "a problem." That suggests to me that our ordinary
  idea of a racist statement may depend on something other than hostile intent or
  forbidden words.


  I would like you to give me a working definition of a racist statement — one that
  captures what makes a statement racist — and then run it through these cases:


  1. A white man shouts a racial slur at a Black teenager.

  2. A historian, in a documentary about the 1800s, reads aloud a law that classifies
  people by race.

  3. The Du Bois visitor who says, "I know an excellent colored man in my town."

  4. The unasked question Du Bois identifies: "How does it feel to be a problem?"
  Can a question that is never spoken count as a racist statement at all, and should
  your definition say anything about it?

  5. A politician opposing an integration plan who says, "This is about neighborhood
  schools and property values, not race."

  6. A person who says, without malice, "Black students at this school score lower
  on average than white students," and wants the gap fixed.

  7. "A Black person using the same slur toward another Black person, in a clearly
  in-group, joking way."


  Then tell me which of the definition''s verdicts you trust least, and whether Du
  Bois''s passage is better explained by a definition based on intent, on effects
  or experience, on some feature of the words, or on background social structures.


