  ---


  I''m leading a one-session reading group on self-referential rule systems, attended
  by law students and working programmers, none of whom have studied legal philosophy
  or formal logic. My running case is Nomic: a game in which the rules include rules
  for changing the rules, so that a move made under a rule can alter the very rule
  that authorized it. That single feature generates the puzzles I want the session
  to land on — the self-amendment paradox (a rule applied to itself), the abolition
  paradox (using the amendment procedure to delete the amendment procedure), the puzzle
  of a rule that declares itself unamendable, and the way a rule''s validity and its
  content can come apart.


  Don''t explain Nomic or these paradoxes to me; plan how I should explain them. You
  are a philosopher of law who has taught the logic of rule systems to mixed audiences
  of lawyers and programmers. Think carefully about what depends on what before you
  commit to an order of presentation.


  My session is seventy-five minutes, with a whiteboard, and the audience is sharp
  but impatient with formalism for its own sake. Plan the explanatory arc so that
  the paradoxes feel forced by the setup rather than imported from philosophy. Address
  each of the following:


  - What single idea has to be in place before any of the paradoxes can even be stated,
  and what would go wrong if I opened with the paradoxes directly.

  - The order in which the components must be introduced, with the dependency that
  justifies each transition.

  - The one concrete rule-change scenario I should build the whole session around:
  what it must have to do real work, and what features would quietly smuggle in a
  resolution and therefore must be excluded.

  - The misconceptions the audience will predictably bring or form — for example,
  conflating "the rule is valid" with "the rule is a good idea," or thinking a rule
  about changing rules must live at a higher level than the rules it changes. Give
  them in the order they will arise, and for each say the exact point in the sequence
  where I should head it off and how.

  - One end-of-session check that would show they understand the paradoxes as paradoxes
  rather than merely the mechanics of the game.

  - What I should openly refuse to cover at this level, and a sentence I can use to
  decline without making the omissions feel like failures.


  Structure your response in exactly these sections, in this order, with roughly these
  lengths:


  1. **Dependency map** — 130 words. The single load-bearing idea and a compact account
  of what presupposes what.

  2. **The explanatory sequence** — 300 words. The ordered steps, with the reason
  each step must precede the next.

  3. **The carrying example** — 170 words. The one scenario to build around; what
  it must have and must lack, and why.

  4. **Misconception map** — 230 words. Each misconception, when it arises, where
  and how to defuse it.

  5. **End-of-session check** — 90 words. The question or task, and what a correct
  response would reveal.

  6. **Deliberate omissions** — 80 words. What to leave out and how to say so.


