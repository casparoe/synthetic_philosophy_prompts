  In section VI of The Future of an Illusion, Sigmund Freud defines an illusion in
  a way that explicitly severs the question of a belief''s truth from the question
  of its psychological origin: an illusion, in his sense, need not be false, and may
  even turn out true. What matters for calling something an illusion is that its motivational
  support comes from a wish, above all from the child''s early helplessness and longing
  for a protective father, rather than from an impartial survey of evidence. Freud
  insists that his account of the origin and function of religious doctrines is not
  itself a refutation of those doctrines. Take the central conceptual claim to be
  this: religious belief is, in at least a significant class of cases, psychologically
  sustained by wish-fulfillment rather than by evidence-responsive belief formation.
  This looks like a claim about hidden psychological processes, but also like a conceptual
  claim about how to classify a belief as an illusion. Design the best empirical test
