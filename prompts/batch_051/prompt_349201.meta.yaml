  a government, the capacity to enter into relations with other states — and recognition
  is just others catching up with the facts. Others say recognition is what makes
  the facts amount to anything, that statehood is a status other states confer. I
  don''t have the background to adjudicate that, but I have to write sentences about
  these places roughly twice a month on a deadline of hours, and both sides read us
  closely and accuse us of bias whatever we print. The copy desk and the standards
