  Domain: No-free-lunch theorems and the problem of induction.


  NFL theorems: Wolpert & Macready show that averaged over all possible objective
  functions (or all possible datasets), any two search/optimization algorithms have
  equal performance. There''s also the NFL for supervised learning (averaged over
  all functions, all learning algorithms have equal off-training error). The philosophical
  upshot often claimed: no algorithm is universally better; good performance requires
  assumptions matching the structure of the problem. This relates to induction: Hume''s
  problem — why expect the future to resemble the past? NFL can be read as a formal
  version: without prior assumptions about which hypotheses/functions are likely,
  no inference method beats any other, so induction''s justification must come from
  the prior/assumptions, not from a guarantee of universal reliability.


  Possible responses/positions to rank on "how well they absorb/dodge/defuse the NFL
  worry for induction":


  1. Solomonoff induction / algorithmic probability: universal prior over computable
  hypotheses, relying on Occam. But NFL for all functions includes uncomputable functions;
  restricting to computable functions yields some guarantee? Solomonoff has strong
  optimality (dominance) results over computable measures. But the prior itself is
  not justified by data.

  2. Bayesian subjectivism: priors are subjective; induction is coherent given your
  prior; NFL just shows you must have a prior — there''s no "neutral" starting point.
  Defuses by biting the bullet.

  3. Popperian falsificationism: induction isn''t needed; science proceeds by conjectures
  and refutations, so NFL is irrelevant because we never justify by enumeration; but
  still need to pick which conjectures to test.

  4. PAC learning / VC theory: with a restricted hypothesis class, sample complexity
  bounds hold; NFL is the degenerate case of a maximally unrestricted class. So the
  response: restrict the hypothesis class via domain knowledge.

  5. Minimum description length / structural risk minimization: penalize complexity;
  works if the world is compressible; NFL doesn''t apply within a complexity-ordered
  class.

  6. The "weak NFL" response (e.g., Schaffer? or "real-world functions are a tiny
  non-uniform subset"): uniform average over all functions is a pathological prior
  that no one actually has; the relevant question is performance on realistic distributions,
  where some algorithms do dominate. Also Wolpert''s own response: NFL is about search
  algorithms across all problems, but real problems have exploitable structure.

  7. Meta-induction (Schurz): the meta-inductivist can do almost as well as the best
  available method in a class of predictive methods, even without knowing which is
  best — a kind of universality result that survives NFL in a restricted but non-trivial
  sense. This is niche-ish but LLMs may know "meta-induction" less. I can inject/explain
  it lightly in the prompt so the model doesn''t need to recall: "the idea that you
  can track the success rates of a pool of candidate methods and switch to whichever
  is currently doing best, and thereby do nearly as well as the best method in the
  pool without knowing in advance which one it is." That''s an injected niche idea
  — good per instructions.

  8. "Induction is a practical necessity, not a theorem" response: even if no formal
  guarantee, we can''t do otherwise; pragmatic vindication (Reichenbach''s pragmatic
  justification: if any method works, induction works).

  9. Evolutionary/embodied response: our inductive biases were selected in an environment
  with structure; the "no free lunch" setting abstracts away exactly the regularities
  that make induction work. (This overlaps with 6.)


