  I keep going back and forth on a version of the induction problem, and I''d like
  someone to just force-rank the standard replies so I can see which ones are doing
  real work. Here''s the setup I have in mind.


  The no-free-lunch theorem for supervised learning says, roughly, that if you average
  over all possible functions from inputs to outputs, any two learning algorithms
  have the same expected error on examples they haven''t been trained on. A philosopher
  friend of mine reads this as a formal version of Hume: unless you''ve already built
  in an assumption that the world is one way rather than another, no policy for extrapolating
  from past cases is better than any other, so induction can''t be justified from
  the data alone.


  Rank the following responses from best to worst at actually answering that challenge
  — not at being technically clever, but at either justifying induction, dissolving
  the worry, or honestly explaining why we should carry on anyway. One sentence each
  on what the move buys and what it quietly gives up. And if you think two of them
  are basically the same move wearing different clothes, merge them or say so.


  1. Solomonoff induction: put a universal prior over computable hypotheses that favors
  shorter programs, and predict with it; there are theorems that it converges fast
  on any computable data-generating process.

  2. Bayesian subjectivism: there''s no such thing as prior-free inference; all induction
  is induction-relative-to-a-prior. The theorem just shows you can''t get a guarantee
  for free, which nobody should have expected.

  3. PAC/VC-theory: assume the target function lives in a hypothesis class of limited
  complexity, and you get finite-sample guarantees; the no-free-lunch result is just
  what happens when the class is the set of all functions.

  4. Minimum description length / structural risk minimization: regularize toward
  simple hypotheses; if the world has a short description, simple rules generalize,
  and if it doesn''t, no method has a shot anyway.

  5. The "your average is over a pathological universe" reply: the uniform average
  over all functions is dominated by maximally random, unstructured functions that
  no real learner faces. What matters is performance on structured problems, where
  some algorithms do dominate.

  6. Reichenbach-style pragmatic vindication: induction can''t be shown to succeed,
  but if any method succeeds, the straight rule succeeds too, so induction is never
  worse than the best possible method and we lose nothing by using it.

  7. Meta-induction: keep a pool of candidate prediction methods, track their recent
  success, and imitate whichever is doing best; there''s a theorem that this does
  nearly as well as the best method in the pool without your knowing in advance which
  one it is.

  8. Popperian falsificationism: science never needed induction; it makes bold conjectures
  and tries to refute them, so a theorem about inductive extrapolation doesn''t touch
  the actual method of science.

  9. Evolutionary story: our inductive biases were selected in a world with stable
  regularities, which is why they generalize; the theorem only shows that no bias
  works in all possible worlds, and we don''t live in all possible worlds.


  Also, for each, mark it as one of: a theorem that earns induction a guarantee (under
  conditions), a story that explains why the challenge never gets off the ground,
  or a concession that induction isn''t justified but we should act like it is anyway.


