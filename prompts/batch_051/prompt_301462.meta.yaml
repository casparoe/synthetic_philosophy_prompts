  ---


  I''ve been trying to get straight about what it takes for a body of legend to count
  as history, rather than just being a story with a tenuous setting. My verdicts on
  the standard cases are probably inconsistent, and I want to know what principle,
  if any, captures them.


  Here are the cases and my verdicts. (1) The Trojan War. I treat it as historical
  in a thin sense: a real Late Bronze Age city at Hisarlik was destroyed around 1200
  BCE, and Hittite diplomatic texts refer to a polity in exactly the right place called
  Wilusa (and, on one reconstruction, a king called Alaksandu); but I am equally sure
  the Helen, the Wooden Horse, and the ten-year siege are legend. The label I want
  is "legend anchored to a real place and a real conflagration." (2) King Arthur.
  I treat Arthur as essentially legendary: the earliest stories come centuries after
  any plausible setting, there is no contemporary document naming him or an Arthurian
  court, and no excavated site that everyone agrees is his. I am willing to believe
  there may be some folkloric absorption of a sub-Roman war leader, but not that we
  can individuate a historical Arthur. (3) The Exodus. I do not accept the biblical
  narrative: nothing like six hundred thousand people leaving Egypt by miracle. But
  I also resist calling it pure invention. The Merneptah Stele (c. 1208 BCE) places
  a people called Israel in Canaan, Egyptian sources do attest Semitic-speaking sojourners
  in the Delta, and it would be strange if no group ever left Egypt for Canaan. So
  I keep a small kernel: some movement of Levantine people from Egypt, later remembered
  and scaled up, seems to me more likely than total fabrication. (4) The Dorian invasion.
  Here I think scholarship turned a legend into history and then back into legend:
  the Greek story of the return of the Heracleidae was once read as evidence of a
  single massive Dorian migration into the Peloponnese after the Mycenaean collapse,
  but I now treat the "invasion" as mostly a modern myth. The Doric dialect map is
  real, but it does not establish a single event, and I would not defend the invasion
  as history.


  I keep coming back to an anchor principle: a tradition earns the status of "history"
  only if some line of evidence independent of the tradition anchors the element we
  care about — a named place, a named people, or a named ruler — and the anchoring
  evidence is roughly contemporary. Applied to my cases, Troy gets its anchor from
  Hittite texts and archaeology; Exodus gets a thinner anchor from the Merneptah Stele
  for the people Israel, though not for the departure itself; Arthur gets none; the
  Dorian invasion gets none. But I can see that this principle doesn''t obviously
  license my Exodus kernel: the Stele tells us only that an Israel was in Canaan,
  not that any of its members had been in Egypt, and the Egyptian evidence for Semites
  in the Delta is generic. So either my Exodus verdict has to go, or I need an extra
  clause about how much work generic background plausibility may do. And I suspect
  the same problem arises for Troy: no Hittite text mentions an attack by Ahhiyawans
  on Wilusa, so what exactly does the anchor anchor?


  Please test my anchor principle against the four cases. State the best version of
  the principle (or a small set of candidate principles) you can construct, with each
  clause tied to the case that motivates it, apply it to at least two further cases
  I haven''t listed (for example, Robin Hood, the founding of Rome, or the Sea Peoples''
  migration), and say honestly which of my verdicts it cannot accommodate and which
  verdict I should overturn if I want the simplest defensible principle.


  Then give me the bottom line as a JSON object with the following fields:

  - "best_principle": an object with "name", "formulation", and "clauses" (an array
  of objects, each with "clause", "motivating_case", and "effect").

  - "alternative_principles": an array of up to three other candidate principles,
  each with "name", "formulation", and "why_rejected".

  - "verdicts_on_my_cases": an object mapping each case name to an object with "verdict"
