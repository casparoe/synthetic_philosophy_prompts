  - "further_cases": an array of objects, each with "case", "verdict", and "reasoning".

  - "overturned_verdicts": an array of objects, each with "case", "my_verdict", "recommended_verdict",
  and "reason".

  - "residual_tension": a string identifying the hardest unresolved tension in the
  resulting account.


