  Davidson''s project: radical interpretation — interpreting a speaker''s language
  from scratch based on observable behavior, without prior knowledge of meanings or
  beliefs. Theory of meaning via Tarski-style truth theory: finite axioms yielding
  T-sentences (s is true iff p). The interpreter assumes the speaker is largely rational,
  truthful, and has mostly true beliefs by the interpreter''s lights → principle of
  charity. Charity isn''t merely maximizing agreement; it''s constitutive of interpretation.
  Holism of meaning and belief. Triangulation: two creatures responding to a common
  object/world; the interpreter uses the shared cause (object) to anchor content.
  Radical interpretation vs radical translation (Quine): Davidson says interpretation
  requires understanding, charity is about rationality, while Quine''s radical translation
  with stimulus meaning and indeterminacy; Davidson extends indeterminacy but with
  charity. Also Davidson''s later view: "there is no such thing as a language" — the
  passing theory/prior theory; interpretation is always ongoing, no shared conventional
  language needed.


  Common misrepresentations:

  1. Conflating radical interpretation with radical translation (Quine) — but maybe
  fine as a simplification; Davidson sees it as distinct but the prompt summary might
  say "Davidson follows Quine in treating radical interpretation as radical translation."

  2. Saying the principle of charity instructs the interpreter to maximize agreement,
  to assume the speaker believes what the interpreter believes — Davidson''s mature
  view: charity optimizes agreement but also imposes shared standards of rationality;
  it doesn''t mean "assume they always agree with you." This is an overstatement of
  a modest thesis.

  3. Saying charity is an empirical/strategic rule ("a useful heuristic for guessing
  what people mean") rather than a constitutive condition on having a theory of mind/content.

  4. Saying T-sentences give meanings; actually T-sentences specify truth conditions;
  the theory uses the structure and constraints to interpret; meanings aren''t entities.
  Also can''t just translate "Snow is white" iff snow is white.

  5. Standard objection presented as refutation: "the principle of charity makes massive
  error impossible by definition, so interpretation can''t ever discover that people
  have false beliefs" — this is an objection; defenders respond that charity can allow
  local error against a background of massive agreement, and that the constitutive
  claim doesn''t preclude disagreement. Summaries often say "this makes disagreement
  impossible / turns all disagreement into misinterpretation."

