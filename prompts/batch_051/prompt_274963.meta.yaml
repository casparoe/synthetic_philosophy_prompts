  Davidson''s radical interpretation is an extension of Quine''s radical translation.
  A radical interpreter faces a speaker of an unknown language and must work out what
  her sentences mean using only what she says, when she says it, and what is publicly
  going on around her. Since belief and meaning cannot be fixed independently, Davidson''s
  answer is the principle of charity, which says the interpreter must assume the speaker''s
  beliefs are mostly true and mostly agree with the interpreter''s own. The procedure
  is to maximize agreement: when a speaker says something as snow is falling, translate
  it as ''snow is falling'' unless that attribution would conflict with too many others.
  On this basis the interpreter can construct, for any speaker, a Tarski-style truth
  theory whose T-sentences have the form ''S is true if and only if p''; because p
  gives the sentence''s truth conditions, it gives the sentence''s meaning. A familiar
  objection is that this writes real disagreement out of the picture: if beliefs can
  only be attributed on the assumption of agreement, the interpreter could never discover
  that the speaker has deeply false beliefs, and Davidson''s position collapses into
  saying that divergent outlooks are just different languages.


  How fair is this as an account of radical interpretation? I would like an accuracy
  audit that separates (a) what is accurate, (b) what is a common but potentially
  misleading simplification or overstatement, and (c) what Davidson or a careful defender
