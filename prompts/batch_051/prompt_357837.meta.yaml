  The tautology objection: If fitness is defined as differential reproductive success
  (actual survival and reproduction), then "natural selection favors the fittest"
  reduces to "those that reproduce more reproduce more" — tautological. The propensity
  interpretation (Beatty? Mills? Brandon? Sober) says fitness is a probabilistic disposition
  to produce offspring — a property an organism has before/independent of actual outcome,
  like a coin''s bias. That makes selection claims testable/empirical: we can measure
  fitness via expected reproductive output, predict outcomes, compare to actual.


  A test: e.g., measure components of expected reproductive success (viability, fecundity,
  mating success) independently, compute an expected fitness, then see whether actual
  reproductive success in a population matches the rank order predicted. Or compare
  two genotypes with measured propensities in controlled common-garden experiments;
  the propensity view predicts a particular distribution of outcomes, not a single
  outcome. A positive result: predicted propensities correlate with realized frequencies
  better than chance; negative: no correlation even when components are measured.
  But what would it settle? It would show fitness can be measured independently of
  actual success and does predictive work — thus evading tautology for that operationalized
  sense. It would not settle whether "fitness" as a theoretical property is really
  a propensity vs a statistical artifact; whether components we chose are the right
