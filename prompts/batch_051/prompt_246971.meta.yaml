  Actually, the domain is "Parfit''s hitchhiker and rational irrationality." The concept:
  Parfit''s hitchhiker (from Reasons and Persons chapter 1?) is about a person who,
  after a car crash, makes a promise to pay a rescuer, but later (after being rescued)
  has no reason to keep the promise; if he is rational and self-interested, he would
  not pay. The hitchhiker can only get rescued if the rescuer believes he will pay;
  but if the rescuer knows the hitchhiker is rational and self-interested, the rescuer
  won''t believe the promise. So rationality seems to make the hitchhiker worse off:
  a "rational" person can''t credibly promise; an "irrational" person who keeps promises
  would get rescued. This connects to rational irrationality: it can be rational to
  cause yourself to be irrational (e.g., to have dispositions to keep promises even
  when it''s not in your interest), or to believe something false. Parfit''s hitchhiker
  is often used to discuss the rationality of having non-maximizing dispositions,
  or of "threats and promises" and the paradox of rationality.


