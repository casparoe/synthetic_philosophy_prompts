  An essay could argue: Locke''s "enough and as good" clause is best read not as a
  standalone distributive condition but as an epistemic proxy — a condition whose
  violation would be evidence that appropriation harms others'' opportunities, which
  is what actually matters. Evidence: in Sec. 33 he says spoilage is the bound; "Nothing
  was made by God for man to spoil or destroy"; in Sec. 37 the improvement argument
  shows appropriator "does not lessen, but increase the common stock of mankind" —
  so even when the literal "enough and as good" fails (all land enclosed), appropriation
