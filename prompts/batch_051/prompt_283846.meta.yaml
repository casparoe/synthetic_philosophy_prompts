  Potential final:


  I teach an upper-level undergraduate seminar on property, and we spent last week
  on Locke''s labor theory of acquisition in the fifth chapter of the Second Treatise
  of Government. The class split into two camps: one side treated his proviso as a
  constraint that money and the growth of an economy simply make obsolete, and the
  other side treated it as the real normative core of the theory, with surprising
  distributive consequences if applied to contemporary holdings. I want to show them
  that the terrain is finer than that, and I''d like to give them a sorting quiz that
  returns something more informative than "propertarian" versus "radical."


  Act as a political philosopher who works on Locke''s theory of property and its
  modern descendants. Think carefully before writing, perhaps by first listing the
  distinct questions on which readers of Locke actually divide and then assembling
  combinations of answers into a logical space. Your deliverable should be a decision
  tree or short sorting quiz (roughly eight to twelve leaves) that takes someone from
  concrete judgments about cases to a named position. Use branch-node questions that
  students can answer without already knowing the labels, such as: Does labor generate
  a right only in small, pre-monetary conditions, or does the same principle operate
  now in attenuated form? Does the spoilage limit constrain only the waste of physical
  things, or also the indefinite accumulation of money or claims? Does the requirement
  to leave enough and as good mean same-quality raw resources, comparable opportunities,
  or merely no one left worse off? Is original acquisition a source of full title,
  or only a use-right that the commonwealth may revise? Build the tree from combinations
  of answers first, then locate positions in the resulting space. Include at least
  Locke''s own position, a Nozick-style historical entitlement view, a left-libertarian
  equal-share view, and a common-ownership view; add other leaves as needed. Flag
  any positions your tree cannot separate, and note combinations that no one occupies,
  with a brief diagnosis of whether the view is incoherent, unattractive, or merely
  unexplored.


  The final answer should be in American English. Throughout, separate what is settled
  from what is genuinely contested among specialists, and do not present a contested
  interpretation as the consensus. Also flag places where your reading of Locke leans
  on one side of a scholarly dispute.


