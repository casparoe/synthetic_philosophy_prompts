  Let''s think carefully about philosophy of free will to create a belief set with
  subtle tensions.


  Varieties of free will worth wanting (Dennett''s idea): Compatibilists argue that
  the kind of free will worth having is compatible with determinism — e.g., the capacity
  to deliberate, reflect, and act on one''s desires and values, not "could have done
  otherwise" in a contra-causal sense. Dennett suggests we want "elbow room" — freedom
  from coercion, manipulation, and perhaps the capacity to respond to reasons — not
  libertarian agent causation.


  A high school student could hold:

  1. Determinism (every event, including human actions, is fully fixed by prior causes
  plus laws) is true or at least very likely true.

  2. The kind of free will worth wanting is not "could have done otherwise" in the
  categorical/contra-causal sense, but the capacity to act on reasons one endorses,
  free from coercion and manipulation.

  3. Moral responsibility — praising/blaming, holding people answerable — is compatible
  with determinism, because it tracks whether someone''s action reflected their values/reasons
  rather than the existence of alternative possibilities.

  4. We can be genuinely responsible for our values/character in some sense even if
  they were shaped by genes and upbringing.

  5. Retributive punishment (punishing as deserved) might be suspect? Or the student
  holds that basic desert of blame is fine? Let''s include something that conflicts.

  6. Perhaps the student holds an epistemic principle: whether someone "could have
  done otherwise" matters to whether they deserve blame, because fairness requires
  alternatives. Actually that would be a tension with compatibilism.


