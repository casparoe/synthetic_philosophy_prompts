  Let''s include a set of six commitments:


  1. Determinism is true (or overwhelmingly likely) of human action.

  2. Consequence argument: if determinism is true, no one has ever been able to do
  otherwise than they actually did.

  3. The free will worth wanting doesn''t require the ability to do otherwise in the
  actual circumstances; it requires the capacity to step back from one''s impulses,
  reflect on competing reasons, and act on the considerations one judges best, without
  coercion, duress, or manipulation.

  4. Moral responsibility (praise, blame, resentment, gratitude) is appropriate whenever
  an action expresses the agent''s own evaluative stance—what the agent cares about
  or stands for—and it does not depend on the existence of libertarian alternative
  possibilities.

  5. A person can be responsible for actions that flow from values acquired through
  genes, upbringing, and luck, provided that the person does not feel alienated from
  those values and would reflectively endorse them.

  6. If a team of neuroscientists secretly implanted a desire in someone in a way
  that bypassed the person''s normal development, the person is not responsible for
  the resulting action, even if they reflectively endorse the desire when they act.


