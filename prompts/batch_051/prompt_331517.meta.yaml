  Possible commitments:


  1. Causal determinism is very likely true of human action: every choice is the outcome
  of prior causes (genes, brain states, environment) and natural laws.

  2. Free will, in the only sense worth wanting, does not require the ability to have
  done otherwise in exactly the same circumstances. What it requires is the capacity
  to reflect on one''s desires, identify with some of them, and act on the ones one
  endorses, without coercion or manipulation by others.

  3. We can hold people morally responsible—praise, blame, gratitude, resentment—even
  if determinism is true, because these attitudes respond to whether an action expressed
  the person''s settled values, not to whether the action was ultimately caused.

  4. A person can legitimately be held responsible for those settled values themselves,
  even though the values were formed by childhood, culture, and luck, provided the
  person has (or could have) reflected on them and does not disown them.

  5. Blaming someone is fair only if the person genuinely could have done otherwise—not
  in a merely "if things had been different" sense, so if determinism rules out the
  real ability to do otherwise, then no one is ever genuinely blameworthy.

