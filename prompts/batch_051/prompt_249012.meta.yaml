  Standard setup: Two envelopes, one contains twice the money of the other. You pick
  one but don''t open it. Let its amount be X. Then the other has either 2X or X/2,
  "with equal probability," so its expected value = (1/2)(2X) + (1/2)(X/2) = 1.25X.
  So you should switch. But the same reasoning holds if you had picked the other envelope
  first: whatever it contains, Y, switching has expected value 1.25Y. So it seems
  switching is always better, which is absurd since it''s symmetric; and after switching
  you can rerun it to switch back, forever.


  Variants: open the envelope before deciding; then for any observed amount you''d
  switch. The flaw: the probability model is inconsistent — there''s no single probability
  distribution over the pair such that, conditional on the amount in your envelope,
  the other is equally likely to be half or double for all values. The symmetry between
