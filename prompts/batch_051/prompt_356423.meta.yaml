  "I am a retired analytical chemist, and since leaving the laboratory I have been
  spending my time on epistemology. The habit I cannot shake is that of asking how
  reliable a measuring instrument is before trusting what it reports; that habit is
  what first drew me to the debate over luminosity and the KK principle.


  Please write a dialogue between two epistemologists who disagree about the KK principle:
  the claim that if a person knows that P, then the person is in a position to know
  that she knows that P. One character accepts the principle and takes it to be part
  of any adequate account of self-knowledge. The other character follows Timothy Williamson
  in rejecting it, on the grounds that no non-trivial condition is ''luminous'' —
  where a condition is luminous just in case, whenever it obtains, the person is in
  a position to know that it obtains.


  The Williamsonian should press the anti-luminosity argument rather than merely assert
  it: consider a subject warming very gradually from feeling cold to feeling warm
  across a series of moments, each imperceptibly different from the last. If feeling
  cold were luminous, the subject would be in a position to know, at the first moment,
  that she feels cold; but a reliable judgment about an inexact condition such as
  feeling cold requires a margin for error — one cannot know one feels cold when the
  very next, indistinguishably similar moment may be one in which one does not. The
  argument then seems to force the conclusion that the subject feels cold all the
  way through, which is false. So, the anti-luminosity argument concludes, the condition
  of feeling cold is not luminous, the condition of knowing is not luminous either,
  and the KK principle fails.


