  of relevant evidence. New evidence can increase the weight without changing the
  probability (if it''s balanced), or change both. He argued that weight matters for
  action: in some cases, probability being equal, we may rationally prefer the better-weighted
  option. This is often cited as an early precursor to ambiguity aversion (Ellsberg)
  and the distinction between risk and uncertainty; also related to "strength of evidence,"
  "precision," and "second-order probability." The prompt can describe exactly this:
  equal probability but different amounts of evidence.


