  ### Fitch''s paradox of knowability

  The paradox: knowledge principle KP (all truths are knowable: p → ◇Kp) with non-omniscience
  principle (there is an unknown truth: p ∧ ¬Kp). The proof (Fitch 1963): suppose
  p ∧ ¬Kp is known: K(p ∧ ¬Kp). Distributivity: Kp ∧ K¬Kp. Since knowledge is factive:
  Kp ∧ ¬Kp — contradiction. So it''s unknowable that p ∧ ¬Kp. But by KP, if p ∧ ¬Kp
  is true, it is knowable; contradiction. Hence if all truths are knowable, then there
  is no unknown truth — all truths are known. So KP collapses to omniscience-type
  claim: anti-realism about truth leads to the absurd conclusion that all truths are
  known.


  Responses: Tennant''s restriction (only Cartesian truths: p that can be known without
  contradiction; p ∧ ¬Kp is not Cartesian), Dummett''s restriction to basic truths,
  Edgington''s "actually" operator, Burgess, intuitionist logic rejection of classical
  steps, rejecting distributivity of knowledge over conjunction, rejecting the non-omniscience
  premise (haha), restricting KP to sentences not including K, etc.


