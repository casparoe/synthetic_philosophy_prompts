  ---


  I spent much of last night in a long and unresolved argument with a friend about
  whether a familiar-sounding debate is in fact merely verbal. I would like to settle,
  as honestly as I can, where the disagreement—his and mine, and also the one between
  the two imagined parties—actually lives.


  Consider two metaphysicians who agree on all the microphysical facts in some region:
  there are many simple particles arranged in the pattern one would ordinarily call
  "table-shaped." The first metaphysician holds that, in addition to the particles,
  a table exists: composition occurs, and a composite object is present. The second
  holds that no table exists over and above the particles; strictly speaking, there
  are only particles arranged table-wise, and ordinary statements about tables are
  at best convenient ways of speaking. The two make identical predictions about what
  anyone would observe and agree about the practical consequences of either form of
  words; what they seem to disagree about is only which sentence—"a table exists"
  or "no table exists"—to assert.


  Formally, let the proposition at issue be: the dispute between these two metaphysicians
  is merely verbal. I shall mean by "merely verbal" that the parties could in principle
  be brought to agree that they accept all the same non-linguistic facts, and that
  the residual disagreement concerns only the choice of expressions, with no difference
  in experience, expectation, prediction, or action following from that choice. My
  friend ended the evening with a credence of about 0.2 that the dispute is merely
  verbal; I ended at about 0.6. I suspect he and I disagree mostly about whether one
  of the two ways of speaking is more natural or more fundamental, but I do not trust
  my own diagnosis.


  Please give me your own credence in that proposition, and derive it rather than
  merely assert it. I ask for the full decomposition: identify the sub-questions your
  credence depends on—for example, whether the two positions really have identical
  implications for every possible observation; whether there is a fact of the matter
  about which of the two ways of speaking is more natural, more fundamental, or more
  apt; whether the two frameworks are exactly intertranslatable, and whether that
  intertranslatability is symmetric; and whether the apparent disagreement conceals
  some further commitment, such as a view about vagueness or about whether composition
  can be indeterminate. Assign a rough probability to each sub-question, show how
  they combine into the final number, and state which sub-question your judgement
  is most sensitive to. Then tell me which sub-question most plausibly explains the
  gap between a person at 0.2 and a person at 0.6. Finally, indicate what evidence,
  argument, or consideration would move your credence most.


  The response should be written in British English.


