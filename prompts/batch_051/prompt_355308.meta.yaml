  ---


  Many introductions to the paradox of fiction present it roughly as follows: it seems
  that (i) we are genuinely moved by the fates of fictional characters; (ii) to be
  genuinely moved by someone''s fate we must believe that they exist (or that the
  events are real); and (iii) we do not believe that fictional characters exist. The
  problem is to give up one of these while explaining the others. Standard treatments
  were designed for spectators and readers — audiences who witness the fiction but
  do nothing to bring its events about.


  Now consider a development those treatments did not anticipate: interactive, choice-driven
  fictions, such as narrative videogames or branching dramas, in which the audience''s
  own decisions causally determine which characters suffer, betray, survive, or die.
  In such cases the audience is not a spectator of a fixed story but an agent within
  the fiction, and often reports emotions such as guilt, regret, or grief directed
  at outcomes their choices produced.


  Does the paradox of fiction survive this development? In particular:

  - Does the interactivity alter any of the three claims, and if so which?

  - Are guilt and regret here emotions with objects that exist (the player''s own
  choices) while grief over a character''s death remains governed by the original
  paradox — or do all of them still face the original difficulty?

  - If the paradox survives, explain whether it is the same paradox or a new one;
  if it dissolves for some emotions, say what the remaining problem should be called.

  - Identify which premise the development bears on and whether it can be restored
  in another form.


  Finally, indicate where your verdict is least secure: which consideration or counterexample
  would lead you to reverse it, and which step of your reasoning is most likely to
  fail.


