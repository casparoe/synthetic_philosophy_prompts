  Possible draft:


  "After retiring from a long career in [maybe genetics? or physics?], I have taken
  up metaphysics, and I have been following the debate over whether there must be
  a fundamental level of reality. The disputants all seem to accept the same formal
  anatomy of the question: they speak of grounding as a non-causal, explanatory dependence
  relation; they agree it is irreflexive and transitive; and they agree that ordinary
  facts about, say, the mental or the chemical depend on facts lower down. The disagreement
  concerns whether the resulting chains of dependence must terminate. One side argues
  that a chain without an ultimate, ungrounded foundation would be vicious—nothing
  would ever be ''ultimately the case''—while the other side argues that there is
  no contradiction in a world where every fact is grounded in a further fact, just
  as there is no largest natural number. After years of reading, I have not seen either
  side move the other, and the arguments now look to me like restatements of the same
  competing pictures rather than new reasons.


