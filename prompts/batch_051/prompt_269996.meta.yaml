  the world is like, but a disagreement about what a satisfactory explanation requires:
  whether explanation must terminate in something that itself needs no explanation,
  or whether an infinite explanatory regress can be acceptable in the way certain
  limit structures are acceptable in mathematics. Is that diagnosis right, or is there
  a substantive metaphysical disagreement underneath—about the structure of dependence
  itself, about which formal principles (like transitivity or the non-existence of
  cycles) are correct, or about the very intelligibility of ''being grounded''? And
  if my diagnosis is right, what would count as progress: a formal result, a sharper
