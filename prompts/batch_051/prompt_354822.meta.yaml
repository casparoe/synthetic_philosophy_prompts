  Wang Yangming''s doctrine "知行合一" (knowledge and action as one) holds several things:

  - Knowledge and action are originally one; to know something truly is to already
  have the disposition/structure to act accordingly.

  - He denies that one can "know" filial piety but not be filial; such a person only
  has "word knowledge" not real knowledge.

  - The process: "Knowledge is the beginning of action; action is the completion of
  knowledge." Knowing the taste of bitterness and tasting it; knowing pain is already
  to be in pain. He says "A person who knows, but does not act, simply does not yet
  know."


  So a natural "prove too much" argument:


  (1) True knowledge and action are identical (Wang''s "知是行之始，行是知之成" and "未有知而不行者；知而不行，只是未知").

  (2) If knowing and acting are identical, then as soon as you know that φing is right,
  you φ.

  (3) So contemplated wrongdoing — where someone sees the better and approves it but
  follows the worse — is impossible: the akrates never knew.

  (4) But then moral blame becomes impossible too, because we blame people only for
  doing what they knew (or should have known) was wrong.

  (5) Yet we blame people all the time and they blame themselves.

  (6) So either we give up blame, or give up (1).


