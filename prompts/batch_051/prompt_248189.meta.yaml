  A colleague working on animal minds sent me an argument she attributes to a seminar
  on "the scale argument." She says the argument proves too much, but she cannot locate
  the mistake. The argument runs as follows:


  (1) For any insect, we should assign a small but non-negligible probability p that
  it is sentient, where sentience means the capacity for felt pain or pleasure; a
  value of p = 0.001 is conservative by many estimates, but the argument only needs
  p to be nonzero and not vanishingly small.


  (2) Ordinary human activity affects insects in enormous numbers. Agriculture, pesticide
  use, driving, mowing, and even turning on a lamp at night each kill or harm thousands
  to millions of insects per person per year. Call the number of insects an action
  affects N.


  (3) If the action will harm N insects, and each has probability p of being capable
  of suffering, then the expected number of sentient individuals harmed is N × p.
  With N in the millions and p at, say, 0.001, an ordinary action can have an expected
  cost of hundreds or thousands of lives with a capacity to suffer.


  (4) Expected-value reasoning over uncertainty about sentience is no different in
  form from expected-value reasoning elsewhere: a small probability of being morally
  relevant does not license treating the probability as zero. To treat insects as
  definitely insentient would be to set p = 0 without evidence.


  (5) Therefore, an ordinary convenience such as a short, unnecessary drive or a lawn
  mowing has an expected insect-suffering cost large enough to dominate the human
  benefit, once insect suffering is counted at anything above a negligible weight.


  (6) But if the argument is accepted, ordinary life turns into a moral catastrophe:
  one should avoid unnecessary movement, abandon pesticide-dependent agriculture at
  whatever human cost, and treat minute insect contacts as decisions of tremendous
  weight. Her intuition is that whatever the right account of insects is, morality
  cannot reasonably demand all of this.


