  A colleague in a philosophy of mind seminar sent me the following argument, which
  she called the scale argument about insects. She thinks it proves too much, but
  she cannot identify the mistake. Here is the argument as she laid it out.


  (1) For any given insect, there is some nonzero probability p that the insect is
  sentient, where sentience means the capacity for felt pain and pleasure. Reasonable
  people dispute the value of p, but even a very small value, such as one in a thousand,
  is enough for the argument.


