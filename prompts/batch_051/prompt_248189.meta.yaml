  suffering, the expected number of suffering-capable beings harmed by the action
  is N times p. With N in the millions and p around one in a thousand, a single ordinary
  action can carry an expected cost of hundreds or thousands of lives capable of feeling
  pain.


  (4) Uncertainty about whether a being is sentient does not justify treating it as
  certainly insentient. To set p to zero without evidence would be exactly the kind
  of dismissal that expected-value reasoning forbids; the small probability is a discount
