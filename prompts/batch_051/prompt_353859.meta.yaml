  Prompt draft:


  "I cover AI research, and I''ve been struck by how much of the field of interpretability
  operates as if a certain philosophical question has already been answered. Researchers
  routinely speak of a model as encoding concepts such as ''the Golden Gate Bridge''
  or as computing a feature for ''truth'', locate those features as directions in
  activation space, train probes to recover them, and intervene by clamping a direction
  to see whether model output changes in the predicted way. The practice seems to
  assume that there is a fact of the matter about which features a network has, that
  these features are causally relevant to behavior and not merely convenient summaries
  of it, and that interpretability can fail or succeed by whether it recovers them.
  I want to understand what theory of representation this practice presupposes. Could
  all the same experimental results be described with an instrumentalism on which
  probes and features are just predictive fictions with no representational status?
  What distinguishes a genuine feature from a merely learnable direction? And does
  the practice need a realism about representations, or is it underdetermined between
  several realist views, for example a view on which representations require a consumer
  or readout, and one on which they are intrinsic properties of the network? Reconstruct
  the implicit philosophy, distinguish what the practice strictly presupposes from
  what merely fits it, and say what would have to change in the day-to-day methods
  if the underlying view were abandoned."


