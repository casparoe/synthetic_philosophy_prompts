  ---


  I run a 90-minute reading group for twelve to sixteen adults who regularly read
  LessWrong-style material; most have hobbyist programming or some quantitative training,
  but I cannot assume formal computer science. I would like to use one session to
  make the group feel the force of Solomonoff induction — specifically, why a prior
  over programs that falls off with program length turns Occam''s razor from an aesthetic
  hunch into a betting strategy, and why the rational predictor is a mixture over
  many programs rather than one chosen hypothesis. I do not want this taught by lecture;
  I want it to emerge from an activity.


  Please design an induction game in which participants see the first n terms of a
  sequence (binary is fine) and must commit to a rule, or a portfolio of rules, predicting
  the next k terms. There should be a constrained rule-language so that each proposed
  rule has a definite length, and the scoring should make shorter rules progressively
  cheaper or higher-prior in a way the participants can feel as an economic trade,
  not as a stated preference. The scoring should also reward holding several rules
