  Let''s maybe do "Van Fraassen''s Reflection principle" with "Explain conceptual
  issue" — I know this literature decently. The reflection principle: Principle: for
  any proposition H, time t, later time t2, P_t(H | P_{t2}(H)=r) = r, where P_t is
  the agent''s credence function at t, conditional on the agent''s future credence
  being r. Van Fraassen (1984) claims rationality requires one to obey Reflection;
  it''s argued to be violated by agents who expect memory loss or cognitive impairment
  (Christensen 1991, "Clever Bookies"), and by agents who are "inconsistent" with
  their future selves, etc. The conceptual question: Does Reflection follow from conditionalization?
  Or is it an independent principle? The relationship: Under strict conditionalization
  with no information loss, Reflection follows automatically (the future credence
  equals current credence conditional on evidence, so identity holds; actually it
  follows when the only change is by conditionalization on the total evidence acquired).
  Van Fraassen''s argument is a Dutch book; but there are counterexamples. In the
  weeds: ask to explain a specific issue: whether the principle should be read as
  a diachronic constraint or as a requirement that the agent treat her future self
  as an expert; and whether it commits you to treating anticipated irrationality as
  impossible.


