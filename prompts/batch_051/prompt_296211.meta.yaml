  The issue "deliberation crowds out prediction": Agents cannot assign meaningful
  probabilities to their own choices while deliberating, because doing so would be
  like predicting one''s own action using evidence, while the action is in the agent''s
  power. Some views: (a) You can assign probabilities only after deliberation (once
  you''ve decided), but not during; (b) you can assign probabilities to what you will
  do under hypothetical scenarios or if you are predicted to encounter choice without
  full deliberation; (c) probabilities are entirely out of place for self-predictions
  of acts (Levi); (d) there is no conflict for evidential decision theorists? Actually
  in EDT, you might model your own act probabilities in the standard framework — EDT
  uses P(act | state) etc., which is a probability on acts; but deliberation seems
  to require treating acts as choices, not as data. The issue is well-known in decision
  theory.


