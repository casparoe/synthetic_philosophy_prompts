  Candidate prompt (Explain conceptual issue, deliberation crowds out prediction):


  "Consider a rational agent who is about to choose between two acts, A and B, after
  a period of ordinary deliberation. The agent is also an honest Bayesian reasoner.
  There is a familiar tension here. On the one hand, if the agent assigns a precise
  probability to the proposition ''I will choose A'' before she has finished deliberating,
  it looks as though the probability either reflects an intention she already has
  (in which case deliberation is insincere) or functions as a prediction of her own
  eventual choice, in which case it must be supported by evidence that could include,
  or be defeated by, evidence about her own future mental states. On the other hand,
  part of what an agent does in deliberation is weigh considerations that will determine
  the choice; if she already viewed the choice as the outcome of a chancy process,
  it is unclear what role deliberation could play. Explain the source of this tension.
  In particular, discuss whether assigning probabilities to one''s own choices during
  deliberation is best understood as (i) a rational requirement, (ii) rationally prohibited,
  or (iii) permitted only under certain conditions, such as when the choice will be
  made under time pressure or by a future self whose judgment one distrusts. What
  does your answer imply about the relation between the agent as chooser and the agent
  as predictor?"


