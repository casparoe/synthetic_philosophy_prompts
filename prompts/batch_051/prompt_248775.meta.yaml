  I am trying to write a short piece on what makes something a disease, and I keep
  tripping over the fact that the same word does different work in different settings.
  My biology textbook calls pneumococcal pneumonia a disease but describes stage 1
  hypertension as a "risk factor"; my pediatrician says my cousin''s ADHD is a "disorder,"
  not a disease; and I have seen obesity called a disease by some doctors and a "condition"
  by others. I would like a single working definition of disease that I can actually
  apply, not just a list of examples.


  Here are the cases I want the definition to handle.


  Cases where I am confident of the verdict: pneumococcal pneumonia is a disease;
  type 1 diabetes is a disease; a wrist broken in a fall is not a disease; an uncomplicated
  pregnancy is not a disease.


  Cases where I am less sure: (1) stage 1 hypertension with no symptoms and no organ
  damage; (2) obesity with no current complications; (3) ADHD in a twelve-year-old;
  (4) intense grief six weeks after a parent''s death, in a person who meets several
  criteria for depression but whose reaction seems proportionate to the loss; (5)
  the normal adult inability to digest lactose, which most of the world''s adults
  have and most of my classmates do not; (6) infertility in a couple where neither
  partner shows any identifiable biological abnormality.


  My own starting views, for whatever they are worth: hypertension is a risk factor
  rather than a disease; obesity probably is a disease; ADHD is not a disease; grief
  is not a disease; adult lactose intolerance is not a disease; and for the infertility
  case I genuinely do not know.


  Please propose a working definition of disease, run it through all ten cases, and
  tell me where it disagrees with my starting views. I would also like you to say
  which of your own verdicts is least secure, and to revise the definition or defend
  the surprising verdict where the two clash. I am less interested in what a doctor
  or professional body happens to call each case; I want to know what the word would
  have to mean for the definition to track these verdicts as closely as possible.


