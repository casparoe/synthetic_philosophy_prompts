  Model answer: should hit points:


  1. State objective Bayesianism: priors should be determined by symmetries/invariance
  in the absence of evidence; max ent chooses distribution maximizing entropy subject
  to constraints; entropy as a measure of uncertainty/generality.

  2. Constraints encode information: when constraints are objective/testable (e.g.,
  known expectation), they carry information about the world; when merely formal (e.g.,
  choice of parameterization), they shouldn''t affect posterior. Distinguish.

  3. Reparametrization objection: under a nonlinear change of variable, a uniform/maxent
  distribution in x transforms to a non-uniform distribution in y; maximizing entropy
  in x vs y gives different priors; thus the prior depends on the arbitrary choice
  of variable (Bertrand''s paradox / wine-water problem). Detailed walkthrough: H(x)
  not invariant under transformation; entropy of a density is not invariant; Jaynes''
  reply via transformation groups only works when a symmetry group picks a unique
  invariant measure (location/scale), but not generally.

  4. The status of entropy: maximizing entropy is not maximizing ignorance in an unproblematic
  sense; "information" is relative to a measure; Shannon entropy has a continuous
  version that''s coordinate-dependent. Alternative approaches: Jeffreys prior (invariant
  under reparametrization but often improper, and derived just from code?). Mention
  maybe reference priors.

