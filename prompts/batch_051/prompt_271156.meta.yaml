  pointing at a single case. One friend says that anyone coerced by the laws should
  get a vote, full stop. Another says that the franchise properly belongs to those
  who share the national identity, and that my remedy is naturalization or return.
  A third says that anyone whose interests are affected should be included, which
  seems to me to dissolve the boundary entirely, since everything is affected by everything
  eventually. I do not want to adjudicate these claims case by case. I want the standard
  of evaluation itself.


