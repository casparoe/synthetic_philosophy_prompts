  that an adequate theory of who belongs to the demos must meet: the cases it has
  to handle, the distinctions it cannot collapse, and the constraints it cannot violate,
  with the case or consideration behind each requirement. Among the cases I have in
  mind are the long-term non-citizen resident; the citizen living abroad on whom the
