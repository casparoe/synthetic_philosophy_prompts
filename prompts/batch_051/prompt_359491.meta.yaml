  I''m writing up my view of belief revision under uncertain evidence for a seminar
  and I''d like a consistency check before I present. Here''s the package I''ve ended
  up with:


  (1) The right rule for uncertain evidence is Jeffrey conditionalization: when an
  observation just changes my credences over some partition, I keep my probabilities
  conditional on each cell fixed and average by the new cell probabilities.

