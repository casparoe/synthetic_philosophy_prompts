  Let me think about strategy-stealing as an "argument that seems to prove too much."
  The classic strategy-stealing argument: In a finite impartial game with no draws
  where the first move can only help (like Hex or Chomp), the first player has a winning
  strategy: assume second has a winning strategy; first makes an arbitrary move, then
  pretends to be second, following the stolen strategy; if the strategy ever asks
  to play an already-occupied cell, play an arbitrary move instead; the extra move
  cannot hurt. Conclusion: first player wins. The subtle flaw if applied to chess
  or games with zugzwang: the extra move can hurt (e.g., in chess, being forced to
  move can be a disadvantage — zugzwang). Also in games where pieces belong to players,
  stealing the opponent''s strategy doesn''t translate directly; and in games with
  draws, strategy-stealing shows first player can at least draw. The "prove too much"
  version: (1) Assume second player has a winning strategy in a finite, no-draw, symmetric,
  two-player game where an extra move is never a disadvantage. (2) First player makes
  a harmless mulligan move, then follows second''s strategy. (3) If that strategy
  calls for playing where the mulligan already is, pick another harmless move, which
  can''t hurt. (4) So first player wins too. (5) By the same reasoning applied to
  chess — if second had a winning strategy, first could make a harmless extra move
  and then steal it. (6) Therefore chess is a first-player win. (7) But chess has
  zugzwang positions where moving is a disadvantage, so the "extra move can''t hurt"
  premise fails; but then why should I trust strategy-stealing even in Hex? The argument
  seems to overgeneralize and then collapse.


