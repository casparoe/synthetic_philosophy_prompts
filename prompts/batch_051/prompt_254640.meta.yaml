  The dogmatism paradox specifics: The paradox: Suppose S knows p. Then if S encounters
  evidence e against p, since S knows p, S knows e is misleading, so S can ignore
  e, and continue to know p. Harman: "knowledge is dogmatic." The practical translation:
  a guideline that has been "settled" (the committee knows p, e.g., that a treatment
  works). When a new negative trial arrives, the paradox would license dismissing
  it because the committee knows the treatment works, so any negative result is misleading.
  But that seems to immunize settled knowledge against all counterevidence. A good
  procedure needs to distinguish when new evidence should reopen and when it should
  be dismissed—without collapsing into either unlimited dogmatism or naive updating.
  This is a genuinely conceptual translation.


