  Draft:


  "I''m a PhD student in health policy and I sit on a small clinical guideline committee
  for our university hospital network. Every month or so we get a new trial or meta-analysis
  that seems to contradict a strong recommandation we already have — a drug we recommend
  for stroke prevention, a screening interval, something like that. The committee
  is smart about reading studies but nobody has any epistemology background, and we
  keep having the same argument. One side says the current recommendation is settled,
  so the new result is probably a fluke or a bad paper and we shouldn''t touch the
  guideline. The other side says we should update on anything new, every time. I know
  there''s a weird philosophical issue under this — if you genuinely know something,
  then any evidence against it is supposedly evidence you shouldn''t move on, which
  makes rational people look dogmatic — but taken literally that would mean we never
  revise anything. Can you build me a reusable decision procedure for the committee?
  Something we could run in about 45 minutes at a meeting, in plain steps: the questions
  to ask, in order, when a new result appears to challenge a recommendation we currently
  grade as strong; for each question, what would count as a sufficient answer; at
  which steps the procedure says leave the guideline unchanged, at which steps it
  says reopen or downgrade, and at which steps it has to hand the decision to a human
  because the step is a value call rather than a technical one. It would also help
  if you handle the difference between a study that directly says ''the treatment
  effect is smaller than we thought'' and a study or reanalysis that says ''the original
  evidence was unreliable'' — those feel like they should trigger different kinds
  of review but I can''t articulate why. Then run the procedure on two or three made-up
  cases: (1) a single small negative randomized trial against a large meta-analysis,
  (2) a big well-conducted trial that contradicts a strong recommendation that was
  mostly based on observational data, and (3) a reanalysis showing the original meta-analysis
  had a coding error in several included studies. Make sure at least one of the worked
  cases comes out ''don''t change the guideline even though the new result is statistically
  significant,'' since that''s the outcome our committee will hate. And tell me where
  the procedure can''t protect us — the failure modes where it would either let a
  false recommendation stand or make us chase noise."


