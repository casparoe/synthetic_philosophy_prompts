  The classic setup: an urn is either majority red (R) or majority blue (B), equally
  likely. Each agent draws a private ball (signal) with accuracy p > 0.5 (if urn is
  R, draws red with probability p). Agents sequentially announce their guess, observing
  earlier guesses but not earlier private balls. Rational agents Bayes-update. A cascade
  can start after two consecutive same guesses: the third agent ignores their private
  signal if it contradicts, and all subsequent agents rationally herd, so no more
  information aggregates.


