  Habermas''s theory: Communicative action vs strategic action. In communicative action,
  participants coordinate action through the exchange of validity claims (truth, rightness/normative
  correctness, truthfulness/sincerity, and comprehensibility/understandability) and
  are oriented toward reaching understanding (Verständigung), not just influencing
  each other. The "ideal speech situation" is a reconstruction of unavoidable counterfactual
  presuppositions of argumentation/discourse: that all participants have equal opportunity
  to speak, question, and that only the force of the better argument prevails (Herrschaftsfreiheit
  — freedom from domination/power). It''s not an empirical description of any actual
  conversation, nor a blueprint for institutions, nor a claim that actual consensus
  can always be reached; it''s a critical standard / regulative idea implicit in the
  practice of arguing. Also "discourse principle" (D) states that norms are valid
  only if all affected could consent in a rational discourse. The universalization
  principle (U). Also system/lifeworld: in lifeworld, communication oriented to mutual
  understanding; in systems (economy, state), media of money and power coordinate
  action. Colonization of lifeworld.


  Common misrepresentations to include plausibly:

  1. "Habermas argues that all real conversations are, or should be, governed by a
  set of rules that guarantee consensus" — overstatement/confusion: ideal speech situation
  is a counterfactual idealization, not description or direct prescription; consensus
  is the ideal, but agreement isn''t guaranteed in practice.

  2. Conflating truth with consensus: "a statement is true because everyone in an
  ideal speech situation would agree to it" — Habermas is a Kantian pragmatist; he
  holds a consensus theory of truth early on but later, in Truth and Justification,
