  Potential prompt draft:


  "I''m applying for a one-term dissertation fellowship and need a two-page proposal
  organized around a single paragraph from Henry Sidgwick''s The Methods of Ethics,
  Book II, Chapter III. I''m not quoting it exactly here, but the paragraph runs roughly
  as follows: the impulse toward pleasure, if it is too exclusively present, tends
  to defeat its own end, because pleasure is best achieved not by being made the direct
  object of pursuit but by arising as a felt accompaniment of some other, independently
  desired activity. My suspicion is that this familiar observation contains two separable
  claims — a psychological claim about how pleasure arises and a normative claim about
  how one ought to orient practical reasoning — and that most discussions of the paradox
  of hedonism run them together. I want the proposal to state that distinction precisely,
  then defend the claim that neither the psychological regularity nor the normative
  point is enough on its own to make prudential concern with one''s own happiness
  irrational. The approach would be to read the paradox against the structure of Sidgwick''s
  own method: if practical reason requires a single ultimate end, then a self-defeating
  method of pursuing one candidate ultimate end matters for normative theory; but
  if one can rationally adopt a plan of life without making happiness the explicit
  aim of every choice, the paradox loses its bite. I''ll need the proposal to explain
  why existing discussions of the paradox don''t settle this, to lay out a month-by-month
  plan for a six-month project, and to say what would count as the project failing
  — for instance, finding that the psychological and normative readings cannot be
  disentangled without begging the question."


