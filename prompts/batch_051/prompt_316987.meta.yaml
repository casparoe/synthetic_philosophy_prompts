  occupies, and say in one clause whether each is unattractive, incoherent in conjunction
  with neighboring commitments, or merely unexplored. The tree must include as leaves,
  under whatever names fit: a pre-institutional contribution view, a pre-institutional
  effort view, a self-ownership libertarian view that treats voluntary transfer as
  legitimate even without desert, a luck egalitarian view that replaces desert with
  responsibility for chosen effort, a forward-looking incentive view that assigns
  rewards only for future consequences, and an institutional conventionalist view.
  Use these probes at least once: (a) two employees produce identical measurable output
  but one found the work effortless and one found it agonizing; (b) a farmer works
