  statue in the desert: a traveler reports that the pedestal survives while the visage
  lies half-sunk, and that a boastful inscription asks onlookers to despair at the
  king''s works, but nothing of those works remains. That image seems to invite a
  deflationary conclusion—that all commemoration is vanity, since time erodes both
  the honored person and the honoring object. I suspect that is too quick, and I want
  you to work out what the poem actually contributes.


  Specifically: does the poem show that monuments are self-defeating, or does it instead
  shift attention to the social act of inscription—to what a community is trying to
  do when it fixes a name and a boast in stone? Is the poem best read as a critique
