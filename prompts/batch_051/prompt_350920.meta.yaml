  Let''s craft the paradox of deontology argument:


  Setup: an ordinary person interested in moral ideas: "Some people hold that certain
  acts are absolutely forbidden no matter how good the consequences — e.g., torturing
  an innocent witness is wrong even if it would save lives." etc. Then the asker presents
  their own argument that such a view is inconsistent:


  (1) The reason torture is wrong is that torture is an intrinsic wrong — torturing
  someone is the kind of thing that must be minimized.

  (2) If torturing someone is an intrinsic wrong, then, other things equal, fewer
  torturings is better than more torturings.

  (3) If fewer torturings is better, and you can prevent several torturings by committing
  one torturing, then refusing to commit the one torture leaves the world with more
  torturings.

  (4) A morality that leaves the world with more of what it says is intrinsically
  wrong is not faithful to its own values.

  (5) Therefore, someone who says torture is intrinsically wrong is committed to saying
  you should torture the one to prevent the several, which contradicts the initial
  absolute prohibition.


  Then: "I think the argument is valid, but the conclusion seems to gut the whole
  idea of an absolute prohibition, so maybe a step fails. Tell me which step, if any,
  fails, and whether the argument really shows the position is inconsistent."


  The subtlety: Step 2/3 equivocate between the wrongness of your own act of torture
  and the wrongness (or badness) of torture as a state; the premise "torture is intrinsically
  wrong" means "performances of torture are to be avoided by each agent," not that
  there is a single agent-neutral duty to minimize the number of torturings. The argument
  moves from "each act of torture is forbidden to its agent" to "torture-events are
  a bad to be minimized by anyone." Also step 4 assumes a maximizing/teleological
  framework for deontology; the deontologist can deny that fewer violations is always
  better in the sense that obligates a particular agent to bring it about, because
  responsibilities are agent-relative. Some deontologists also use the doing/allowing
  distinction or the distinction between bringing about a violation and allowing violations
  by others.


