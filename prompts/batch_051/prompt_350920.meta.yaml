  solution? The definition of supererogation denies that all supererogatory acts rank
  above omission on the same scale that grounds requirement; doing it may be better
  in the axiological sense but not required in the deontic sense. Or step 4 fails:
  a supererogatory act may not be better than omission in the sense relevant to duty;
  its goodness is "praiseworthy" but not entailing that omission is worse/faultworthy.
  Also step 3: permissible omission doesn''t mean omission is not worse; some acts
