  Supererogation argument type B:


  "Supererogatory acts are impossible under any morality that compares actions by
  goodness" — a formal argument.


  (1) An act is supererogatory only if it is morally good but not morally required.

  (2) If an act is not required, then doing it is optional, and one may permissibly
  omit it.

  (3) One may permissibly omit an act only if omitting it is not morally worse than
  doing it. [Or: if omitting it were worse, one would have a duty to do it.]

  (4) But an act is morally good only if doing it is morally better than omitting
  it. [For otherwise calling it "good" does no work.]

  (5) So for a supererogatory act, doing it is both better than omitting it (by 4)
  and not better than omitting it (by 2/3). Contradiction.


