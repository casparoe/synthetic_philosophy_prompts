  Draft:


  "I''ve been trying to write down my actual view of collective action after a term
  of shared-agency stuff, and I want someone to run a consistency check on it. Here''s
  the set. (1) Joint action is a real difference in the world, not just a way of summarizing
  individual movements: two people dancing a tango are doing something jointly, while
  two strangers who happen to sway in time next to each other are not, even if the
  movements are identical from outside. (2) What makes the difference has to be something
  in the participants'' minds — in how they each represent what they''re doing — since
  the bodily motions can be the same. (3) But I don''t think there''s any primitive
  we-mode or group consciousness: a shared intention is built entirely out of individual
  attitudes like ''I intend that we J,'' meshed together and out in the open, so that
  each knows the others have them. (4) Still, a group can be blameworthy for an outcome
  that was in no member''s head: a firm with a reckless culture causes a death that
  no manager or worker ever wanted or singly chose, and the organization—not just
  the individuals—is at fault. (5) I also insist that acting jointly doesn''t require
  occurrent, higher-order thoughts about the other person''s intentions most of the
  time; a parent and child can tidy up together as a joint activity without the child
  representing anyone''s intention as an intention. (6) And I think genuinely sharing
  an intention is compatible with the participants having different ulterior goals,
  so long as the joint activity itself is the same.


  Which of these are in tension and how badly? Order the tensions by severity, flag
  any pair that only looks tense but isn''t, and tell me the single cheapest revision
  that buys the most coherence."


