  Possible prompt:


  "Consider Douglas Hofstadter''s satirical piece A Person Paper on Purity in Language,
  written under the name William Satire. In it, he imagines a world where the supposedly
  generic word for people is ''white'' — where people say ''chairwhite'' rather than
  chairperson, ''whitekind'' rather than humankind, and so on — and a cranky columnist
  resists replacing it with ''person.'' I have been thinking about what the substitution
  actually shows. I want you to argue that the piece demonstrates that sexist language
  is not a separate surface issue that can be fixed by swapping words; rather, the
  default assumption that men are the unmarked case is the same mechanism that would
  make a race-based generic seem natural in the imagined world. More than that, argue
  that this means proposals to replace ''he'' and ''man'' with gender-neutral terms,
  while useful, cannot by themselves dislodge the default, because speakers will just
  smuggle the old default into the new word or resist the new word as ''artificial.''
  In other words, make the strongest case you can for the view that the Person Paper
  shows linguistic reform to be necessary but not sufficient. Be careful to treat
