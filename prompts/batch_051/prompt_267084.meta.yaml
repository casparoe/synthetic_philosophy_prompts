  step (does the reasoning/planning look sound at each step). The question: which
  should be used as the training signal, and what are the implications.


  Moves:

  1. Alice (outcome-based): We should score only the final result. What the model
  should do is produce correct output; any intermediate step is just implementation
  detail. If we reward steps, we''re baking in our guess about how to solve the problem,
  and the model might find better routes we didn''t anticipate. Also judging steps
  is expensive and subjective.

  2. Ben (process-based): Final result alone is a weak signal: most solutions are
  wrong in one step, and giving no gradient until the end makes training painfully
  slow; worse, a model can get the right answer via flawed reasoning that won''t generalize,
  so outcome-only rewards lucky wrong-process solutions. By checking each step we
  teach it to reason soundly, not just to pass tests.

  3. Alice: But step-level judgments are exactly the kind of prior you claimed to
  want to remove — who says the steps you like are the right ones? And outcome-based
  training already has internal mechanisms to deal with sparse rewards; also "reward
  hacking" is really about the reward not matching what we want, not about when you
  apply it. If we reward intermediate steps, the model will game those step labels
  just as easily, producing steps that look good to human reviewers but fail downstream.

  4. Ben: There''s a difference between gaming the process and gaming the outcome.
  Process labels constrain the path — a step that merely looks good but doesn''t advance
  the solution gets caught by the next step, because the sequence still has to end
