  ---


  I am a software engineer working on machine learning systems, with no formal background
  in philosophy. Last week two colleagues on my team got into a long argument during
  a design review, and I have not been able to settle who was right about what. I
  would like a point-by-point adjudication.


  The context: we are building a system that performs multi-step software engineering
  tasks — for example, given a repository and a ticket, it produces a plan, edits
  files, and iterates until the desired change is implemented. During training we
  need to give the model feedback, and the disagreement was about where that feedback
  should attach: to the final result only, or to the intermediate steps as well.


  Here is the exchange, as close to verbatim as I can reconstruct it.


  (1) Ana (for outcome-based feedback): We should score only the final result — does
  the implementation pass the test suite and satisfy the ticket? The end product is
  the only thing the user or customer cares about. If we start labeling intermediate
  steps as good or bad, we are smuggling in our own ideas about the "right" way to
  solve the problem, and we will penalize solutions that are unorthodox but correct.
  Step labels are also expensive and inconsistent across reviewers, which adds noise
  to the training signal.


  (2) Ben (for process-based feedback): Final-result feedback is too sparse and too
  permissive. Most long tasks fail at some later step; if we only say "the whole thing
  failed," the model gets no usable signal about which earlier step was the culprit
  — the first seven steps may have been good. And outcome-only feedback will reinforce
  any answer that happens to slip through the final checks, even when the intermediate
  reasoning is wrong, and would fail on the next case. Scoring each step gives a denser
  signal and teaches transferable procedure, not just test-passing.


  (3) Ana: "Transferable procedure" is just a flattering name for "a procedure we
  happen to like." A step is only as good as its downstream consequences; there is
  no independent standard for whether a step looks right except how often it leads
  to success. So outcome is not just a noisier alternative — it is the ground truth,
  and process labels are at best a lossy approximation. Worse, process labels are
  themselves gameable: the model will learn to produce steps that human raters approve
  of without actually advancing the task, which is the same reward hacking you''re
  accusing me of, just moved one level up.


  (4) Ben: A step label is not gameable in the same way once it is defined relationally
  — a step gets positive credit only if the plan it belongs to still has a feasible
  path to a successful result, which is something a rater can often judge earlier
  and more cheaply than by waiting for a full trajectory to end. And for the tasks
  we care about, there is no exhaustive final test you can write cheaply; the ticket
  and test suite are partial heuristics for "the change the user actually wanted."
  If we train only against a partial outcome check, the model will overfit to that
  check exactly where it is most wrong. Process feedback lets us correct a step that
  is on a path to the wrong result before the final check can.


  (5) Ana: That only shows the final check was bad, not that the process itself matters.
  The remedy for a bad final check is a better final check — more tests, held-out
  reviewers, user acceptance — not a stack of intermediate judgments, each of which
  is itself an unvalidated check and needs its own supervision. And notice what you
  just said: if a step is good exactly when it preserves some feasible path to a successful
  result, then "good step" is just an expected-value estimate of eventual success
  pushed backward. That is outcome-based supervision implemented by hand; process-based
  supervision only looks distinct because it uses a human as the value estimator.


  (6) Ben: You are treating "a better final check" as if it were always available,
  and that is precisely the case in which we wouldn''t need to train the model to
  reason at all — we could just search. The reason we scaffold with human feedback
  is that for open-ended engineering tasks, the evaluator is incomplete and we cannot
  yet specify success in advance. And there is a real asymmetry: with outcome-only
  feedback, a model that solves the training cases through a flawed path is fully
  reinforced and fails silently on new cases; with process feedback, the flawed step
  is marked before the trajectory completes, so the model cannot cash in the false
  positive. That asymmetry matters even if both signals are ultimately imperfect proxies.


