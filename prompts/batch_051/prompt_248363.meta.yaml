  Let''s write:


  I''m planning a 75-minute session for first-year undergraduates on Mill''s argument
  in On Liberty, Chapter III, that different ways of life should be treated as "experiments
  of living." Their prior association with Mill is usually the harm principle, so
  I want the session to make them see the underlying epistemic and social argument
  without defaulting to the harm principle as a black-box rule. I''ll ask them to
  look closely at this passage:


  "As it is useful that while mankind are imperfect there should be different opinions,
  so is it that there should be different experiments of living; that free scope should
  be given to varieties of character, short of injury to others; and that the worth
  of different modes of life should be proved practically, when any one thinks fit
  to try them. It is desirable, in short, that in things which do not primarily concern
  others, individuality should assert itself. Where, not the person’s own character,
  but the traditions or customs of other people are the rule of conduct, there is
  wanting one of the principal ingredients of human happiness, and quite the chief
  ingredient of individual and social progress."


  Now I need a teaching plan. What has to be in place before "experiments of living"
  can do its argumentative work? I suspect students think Mill''s point is simply
  "leave people alone to be themselves." I need one carrying example—preferably drawn
  from dress, vocation, friendship, or daily routine—that makes the analogy between
  experiments in science and experiments in living vivid without becoming a culture-war
  dispute in the first half of the session. What misconceptions should I expect, in
  what order, and at what point in the sequence should each be headed off? For instance,
  I expect them to think Mill is praising idiosyncrasy for its own sake, or treating
  any sincere choice as beyond criticism, or conflating noninterference with nonjudgment.
  By the end, what check would show me they understand why Mill ties experiments of
  living to social progress and not only to individual autonomy—and what should I
  explicitly leave out at this level?


