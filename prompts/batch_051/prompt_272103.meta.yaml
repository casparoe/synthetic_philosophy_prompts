  Option 2: Paradox of deontology + Type B


  Prompt:

  "I''ve been trying to make sense of a puzzle I''ve seen called the paradox of deontology,
  and a recent change in how decisions get made has made it feel less abstract. The
  puzzle, as I understand it, is this: if a certain kind of act is genuinely wrong—say,
  deliberately killing an innocent person—then in one sense the world is better (or
  at least less wrongful) the fewer such acts occur. But deontologists deny that you
  may commit one such act yourself even to prevent several other people from committing
  the same kind of act. The prohibition seems to forbid the very thing that would
  minimize violations of the prohibition.


  Now here is the development. Many important decisions are being shifted from individuals
  acting in the moment to institutions that design policies, often instantiated in
  software, ahead of time. An institution can decide, before any particular victim
  or perpetrator exists or is identified, on a rule or algorithm that will determine
  how many violations of a given constraint will occur across a whole class of future
  cases. It can even calculate, with probabilities and distributions, the expected
  number of violations under different rules. Does the paradox of deontology survive
  this shift from an individual facing a one-off choice to a designer choosing an
  ex ante policy that minimizes total violations? Does it get sharper (because the
  policy designer seems to be doing consciously and at scale what the individual is
  forbidden to do once), or does it dissolve (because the designer wrongs no identifiable
  person in the same way, or because the choice is about rule-selection rather than
  act-evaluation)? In other words, does the paradox rest on a premise about the situation
  of choice—a single agent, a single moment, an identifiable victim—and if so, what
  is left of it once that premise is removed?"


