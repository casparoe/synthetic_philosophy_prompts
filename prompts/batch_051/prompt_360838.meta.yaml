  looks random"; there is something about the sequence itself, namely its compressibility:
  111111... has a short description, while a typical string of length n has no description
  shorter than n (Kolmogorov complexity). So finite strings can be more or less random.

  - Objection: For any particular finite string s, there is a machine M (with s hardwired)
  that outputs s on a tiny program; so its Kolmogorov complexity under M is small.
  So "incompressible" is machine-relative, so it''s not an objective property of the
  string.

