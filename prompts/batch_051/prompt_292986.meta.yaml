  Positions on the definition of art:

  - Aesthetic/emotivism: art is expression/communication of emotion (Tolstoy, Collingwood).

  - Formalism: significant form (Bell); art defined by formal properties, aesthetic
  experience.

  - Representationalism/imitation: art as mimesis (Plato/Aristotle); depiction.

  - Conventionalist/procedural: art is artifact presented for appreciation by the
  artworld (Dickie''s institutional theory).

  - Historical: art is related in the right way to past artworks (Levinson''s historical
  definition).

  - Cluster accounts: art is a bundle of criteria, enough of which suffice (Gaut,
  Dutton).

  - Anti-essentialism: "art" is an open concept; no definition (Weitz).

  - Functionalist aesthetic definitions: art is made to be capable of producing aesthetic
  experiences (Beardsley).

  - Danto''s: artworks are about something and embody their meaning (embodied meaning);
  indiscernible counterparts. Maybe too niche for small LLMs.

  - Hybrid definitions.


