  Let''s think: Newcomb''s problem: a predictor (almost perfect) predicts whether
  you''ll one-box or two-box. If it predicts one-box, it puts $1M in box A; if two-box,
  nothing; box B always has $1k; you see both boxes and choose. Evidential decision
  theory says one-boxing (because your choice is evidence about what the predictor
  did); causal decision theory says two-boxing (your choice can''t cause the past
  deposit). Translating to software: a "predictor" is like a machine learning model
  that predicts user actions; the money is like reward/utility. The causal structure:
  your action doesn''t cause the prediction; but the prediction correlates. In software:
  "choosing an option after a perfectly predictive profiler already allocated resources
  based on its prediction of your choice." Could map to "branch predictor" in CPUs:
  the predictor pre-loads instructions based on prediction of branch taken/not taken;
  your actual branch resolution happens later; the performance (utility) is determined
  by the earlier prediction, not your actual choice, but the prediction is correlated
  with what you''ll actually choose. Causal decision theory says "choose the branch
  that''s best now regardless of prediction"; evidential says "choose the branch that
  would be evidence the predictor predicted well." The residue: Newcomb''s predictor
  is intentional/analyst with stakes vs. branch predictor is just hardware with no
  incentives; also the "chooser" in Newcomb is the same agent, whereas branch resolution
  is deterministic code. Interesting!


