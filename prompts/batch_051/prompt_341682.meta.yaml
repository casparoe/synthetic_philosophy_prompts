  Actually Davidson''s view: "metaphors mean what the words, in their most literal
  interpretation, mean, and nothing more." His model: metaphor works by making us
  notice likenesses; no cognitive content beyond literal meaning; what metaphor does
  is like a picture or a bump on the head; no propositional cognitive content communicated.
  Conceptual Metaphor Theory (Lakoff & Johnson): metaphor is pervasive in thought;
  conceptual mappings (e.g., ARGUMENT IS WAR) structure understanding; metaphorical
  meaning is real and systematic.


