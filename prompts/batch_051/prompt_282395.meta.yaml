  ---


  I have been wrestling with a question about the metaphysics of mind, and I would
  be grateful if you would reconstruct the principle my own judgements are tracking
  rather than simply certifying my verdicts. The question is this: under what conditions,
  if any, does a composite system count as having a mind when none of its parts individually
  does?


  Let me fix the target by setting out six cases with my settled—or at least firmly
  felt—verdicts. Please grant the stipulations in each case for the sake of argument.


  First, an ant colony of the sort Hofstadter imagines in the ''Ant Fugue'' dialogue:
  thousands of ants, each following local pheromone rules, none representing the colony''s
  overall state; yet the colony as a whole allocates labour, adjusts to food supply,
  defends itself, and can be interpreted as representing features of its environment
  over many generations. My verdict: the colony does not have a mind, and I am reluctant
  to say its behaviour is goal-directed except metaphorically.


  Second, a human brain: roughly eighty-six billion neurons, none of which represents
  a whole scene or a considered intention, no central controller, yet the system as
  a whole perceives, deliberates, and is conscious. My verdict: this is the clearest
  case of mindedness there is.


  Third, a slime mould of the kind that solves mazes, habituates to repeated stimuli,
  anticipates periodic changes, and produces efficient network structures. It is a
  single multinucleate cell with no neurons at all. My verdict: no mind, though I
  find this case embarrassingly close and suspect I may be protecting the word rather
  than applying a principle.


  Fourth, a thermostat: it senses temperature, computes an error signal against a
  set point, and acts to reduce the discrepancy. My verdict: no mind; the familiar
  teleological talk is merely useful shorthand.


  Fifth, a large multinational corporation: it owns property, enters contracts, maintains
  a corporate memory in files and procedures, forms aims that persist through complete
  turnover of personnel, and reaches decisions through committees in which no single
  person represents the whole. My verdict: it has beliefs, intentions, and perhaps
  responsibilities in a genuine, non-metaphorical sense, and it is rationally assessable;
  but I deny that it is conscious, and I doubt there is anything it is like to be
  it. I want to say it has a mind without a point of view.


  Sixth, a market or price system: buyers and sellers acting on local information
  cause prices that aggregate dispersed knowledge, adjust to shortages, and are routinely
  described as ''expecting'' inflation or ''learning'' from shocks, though no participant
  represents the whole. My verdict: no mind; it is a causal aggregate that we find
  it convenient to describe in mental terms.


  My rough guess at the principle behind these verdicts would be something like this:
  a composite has a mind to the extent that its parts implement a sufficiently integrated
  and self-modifying model of the system''s own states and its environment, which
  the system can use to flexibly revise its own priorities. The brain satisfies it
  fully; the corporation satisfies it in the domain of propositional attitudes but
  lacks the unity needed for consciousness; the ant colony, slime mould, thermostat,
  and market fail on integration or on self-modelling. But I worry that ''sufficiently
  integrated'' and ''self-modifying model'' are vague enough to be doing no work beyond
  restating my verdicts.


  What I would like from you is the principle, or a small set of candidate principles,
  that makes the best sense of most or all of these judgements. State each candidate
  precisely; identify the case that forces each of its clauses; test it against further
  cases I have deliberately left open—for instance, a honeybee swarm selecting a nest
  site through quorum sensing, a scientific community revising a consensus, and a
  distributed artificial system whose components are separate learning agents sharing
  a global objective; and then say candidly which of my verdicts it cannot accommodate
  and whether I should abandon a verdict rather than save it with epicycles. Please
  answer in British English.


