  ---


  I keep noticing a structural parallel between era-adjusted statistics in sports
  and the man-of-his-time defence in the moral appraisal of historical figures, and
  I cannot decide whether it is a real isomorphism or only a metaphor.


  Take the sports side first. A serious attempt to compare Babe Ruth and Mike Trout
  does not compare raw home-run totals, because the run-scoring environment, ballparks,
  and the distribution of talent changed across decades. The analyst instead adjusts
  raw numbers by some baseline—the league average, a park factor, or a replacement
  level—to isolate the player''s contribution from what the environment supplied.
  The adjusted number is meant to answer a counterfactual-sounding question: how would
  this player have performed under a common standard?


  The moral side has a similar surface. When someone says Thomas Jefferson''s slaveholding,
  or Churchill''s racial views, or Columbus''s treatment of the Taino should be judged
  by the standards of his time, they are trying to separate the person from the moral-intellectual
  environment he inhabited. The defence refuses to compare the figure against present
  norms in the abstract and insists instead on comparing him with what a reasonable
  or decent person in his social position could have been expected to see and do.
  That is also a kind of adjustment: subtract the era, expose the residue.


  The mappings look non-trivial. Raw performance corresponds to raw historical conduct.
  The league average corresponds to the prevailing norms of the reference group. Park
  factors correspond to institutional and material circumstances—slavery''s economic
  centrality, imperial ideology, limited information—that made some wrongs particularly
  available or visible. And in both cases a choice arises about which features of
  the setting are legitimate to condition on, because once you adjust for enough context,
  any conduct can be made to look ordinary, just as adjusting for enough factors can
  turn any hitter into a league-average one.


