  Clinical equipoise key idea: In randomized controlled trials, patients are assigned
  to arms by chance. Ethically, it''s argued that a trial is only acceptable when
  there is "equipoise"—genuine uncertainty about which treatment is better. Freedman''s
  "clinical equipoise": there must be honest, professional disagreement among expert
  clinicians about the preferred treatment, even if the individual enrolling physician
  has a personal leaning. The individual doctor may randomize despite preferring one
  arm, because the expert community is divided. This creates tension with the therapeutic
  obligation.


  Asymmetry framing: Outside a trial, a doctor who prescribes treatment she thinks
  is inferior would be negligent/unethical. Inside a trial, she can randomize patient
  to the arm she believes likely inferior, and this is considered ethical if the community
  is in equipoise. Is the distinction defensible? The strongest justification: trial
  participation isn''t ordinary treatment; the physician''s role includes advancing
  medical knowledge; the patient consents; the doctor''s personal hunch at 60/40 isn''t
  knowledge, and community disagreement is the social measure of uncertainty. But
  problem: community disagreement may just track fashion, conflicts, or lagging evidence;
  and a doctor''s own evidence-based belief might be better than community opinion.
  So the asymmetry may rest on a strange deference to a statistical community.


