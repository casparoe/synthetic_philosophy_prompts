  "My mother died in the spring, and since then my young daughter has been watching
  Pixar''s Coco over and over while I have been reading the Zhuangzi in the evenings.
  The two keep colliding. I would like you to read Coco through the Zhuangzi''s view
  of death, and to be honest about how far that lens goes.


  Here is how the collision presents itself to me. Coco''s universe runs on a moral
  economy of remembrance: the dead persist in the Land of the Dead only so long as
  someone among the living remembers them, and a second, permanent death comes with
  being forgotten. The film''s premise, in other words, is that what the dead most
  need is to be kept in being by the living — Héctor begins to dissolve as Coco''s
  memory of him fails, and the ending restores him by returning his photograph to
  the family ofrenda. The Zhuangzi, as I read it, moves in nearly the opposite direction:
  dying is not annihilation but one more transformation in the great turning of things;
  the sage does not cling to a separate self that must outlast its season. The stories
  I keep coming back to are the one where Zhuangzi drums on a tub after his wife dies
  and answers Hui Shi by describing her passage through successive transformations,
  and the dream dialogue with a skull, where the dead man will not trade the release
  of death back for the toils of life and asks whether his former clinging to life
  was not a delusion. And yet Coco, too, has its moments of release: Héctor''s near-dissolution
  is faced almost calmly, and the film''s real resolution is not that Héctor gets
  to go on existing but that the living and the dead finally see one another clearly
  and stop hiding.


  I would like a close reading that does both directions justice. Where does the film
  dramatize the very attachment — to a persisting self, to being remembered, to the
  fear of a final dispersal — that the Zhuangzi diagnoses as the source of our terror
  of death? Where does the film, perhaps against its own metaphysics, say something
  consonant with the Zhuangzi''s acceptance of transformation? And where does it resist
  the reading, such that an honest interpreter would have to conclude that Coco is
  not a Zhuangzian film? Please do not reduce the film to an allegory, and do not
  flatten the Zhuangzi into a single take-away; I want to know both where the lens
  illuminates and where it breaks.


  Because I am using this to think about my own grief rather than to win an argument,
  I would also like you to say what would change your reading. Which scene, interpreted
  differently, or which contested reading of the Zhuangzi''s view of death, would
  lead you to a different verdict — and where is your reading most likely to fail?"


