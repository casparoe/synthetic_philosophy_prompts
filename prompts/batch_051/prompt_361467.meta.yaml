  I''m in a philosophy of action course, and we''ve been working through the problem
  of "transformative experience": choices whose outcomes one cannot fully know from
  the inside before undergoing them, and which may change one''s own standards for
  evaluating those outcomes (becoming a parent is the standard example, but also things
  like entering a religious community, acquiring a new sensory capacity, or serious
  aesthetic education). A friend and I built an argument in our study group that we''re
  now stuck on, because it seems to prove far too much:


  (1) An agent can choose rationally between options only if she can assign each possible
  outcome a value that reflects how she would regard that outcome from the relevant,
  post-choice perspective.

  (2) For any outcome with phenomenology new to the agent, she cannot, before undergoing
  it, know what it is like from the inside.

  (3) If she cannot know what it is like from the inside, she cannot know how she
  would regard the outcome from the post-choice perspective, so she cannot satisfy
  the requirement in (1).

  (4) Therefore no choice whose outcomes include new phenomenology can be rational.


  So far this is just the familiar skeptical conclusion about major life choices.
  But our extension is what worries us:


  (5) Virtually every non-routine choice includes some outcome-feature one has not
  experienced before — an unfamiliar dish, a first trip to a new city, a new friendship,
  a new kind of work.

  (6) So, by (4), virtually no non-routine choice is ever rational.

  (7) But this is absurd: it would mean one can never rationally try anything for
  the first time, and learning, exploration, and even ordinary risk-taking would be
  systematically irrational.


  We would most like to keep (2) and (7). So it looks as though we must reject (1)
  or (3). But each seems expensive: rejecting (1) gives up the demand that rational
  choice track the agent''s own valuation of outcomes, and rejecting (3) means allowing
  that one can rationally choose an outcome whose value one admittedly cannot yet
  know. Which premise should we reject, and what exactly does rejecting it cost? We''d
  also like to know what would change your mind: which further argument or distinction
  would make you change your diagnosis, and where is your own reasoning about this
  most likely to fail?


