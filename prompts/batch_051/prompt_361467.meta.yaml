  I''m in a philosophy of action course, and we''ve been studying the problem of transformative
  experience: some choices — becoming a parent is the standard example, but also joining
  a religious community, acquiring a new sensory capacity, or undergoing a serious
  aesthetic education — seem to give you knowledge you can only have by having the
  experience, and they may also change the values by which you would later assess
  the choice. After lecture last week, a friend and I tried to build an argument about
  this, and now we''re stuck because it seems to prove too much.


  (1) An agent can rationally choose between options only if, at the time of choice,
  she can assign each possible outcome a value that reflects how she would regard
  that outcome from the relevant later perspective.

  (2) For any outcome whose phenomenology is new to the agent, she cannot know before
  undergoing it what it is like from the inside.

  (3) If she cannot know what an outcome is like from the inside, she cannot know
  how she would regard it from the later perspective, and so cannot satisfy the requirement
  in (1).

  (4) Therefore, no choice whose outcomes include new phenomenology can be rational.

  (5) Virtually every non-routine choice includes some outcome feature one has not
  experienced before — an unfamiliar dish, a first trip to a new city, a new friendship,
  a new kind of work.

  (6) So, by (4), virtually no non-routine choice is ever rational.

  (7) That cannot be right: it would make all exploration, learning, and ordinary
  risk-taking systematically irrational.


  We would most like to keep (2) and (7), but we can see that keeping both forces
  a cost somewhere. Which premise or step should we reject, and what exactly does
  rejecting it cost? Please also tell us which further argument or distinction would
  make you change your mind about the diagnosis, and where your own reasoning is most
  likely to fail.


