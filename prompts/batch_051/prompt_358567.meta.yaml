  Content of St. Petersburg paradox: A fair coin is flipped until it comes up heads.
  If heads first occurs on the nth flip, payoff is $2^n. Expected value = sum over
  n of (1/2)^n * 2^n = sum of 1 = infinite. But most people would pay only a small
  amount; the chance of large payoffs is tiny. The paradox: infinite expected value
  yet intuitively finite fair price.


  Known resolutions/moves I can list:

  1. Bernoulli''s logarithmic utility / diminishing marginal utility: money has decreasing
  marginal utility; utility of $2^n is ~ log(2^n) = n log 2, so expected utility is
  finite (sum (1/2^n) n log2 = 2 log2? Actually sum n/2^n = 2, so EU = 2 log 2). It
  resolves by replacing expected monetary value with expected utility. But note: this
  doesn''t fully resolve because you can create a super-St. Petersburg with exponential
  payoffs to make utility infinite if utility unbounded.

  2. Finite wealth / bankroll of the casino: no real house can actually pay unbounded
