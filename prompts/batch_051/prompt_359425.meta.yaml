  Core ideas:

  - In first-person deliberation, the question is "What shall I do?" not "What will
  I do?" When deliberating, I treat the options as open — things that I can bring
  about. Assigning a probability to my own action seems to step back from the deliberative
  stance to a theoretical/predictive stance. So there''s a tension: telling myself
  "I will probably choose A" can undermine my sense that choosing A is up to me.

  - But this can be overstated: People can and do make predictions about their own
  future behavior (e.g., about procrastination) without thereby losing agency; in
  fact, such predictions can be based on knowledge of their own character and can
  even inform planning.

