  Let''s draft:


  "In a course on the philosophy of law, we have been examining how the law treats
  causation by omission. Consider this proposal: a jurisdiction abolishes the traditional
  rule that a person is liable for failing to prevent a harm only where she had a
  specific duty to act. Under the new rule, a person is liable for any harm where
  (i) her failure to act was necessary for the harm to occur, (ii) the harm was reasonably
  foreseeable to her, and (iii) the expected cost to her of preventing it was lower
  than the expected harm she could have prevented. Liability falls on everyone who
  satisfies all three conditions, apportioned by a jury. I am less interested in whether
  this is just than in how it would actually behave. Walk through the incentives it
  creates for ordinary people, for professionals who encounter risks in the course
  of their work, and for those who might bring claims; identify where it would be
  gamed first and what the harshest failure modes are; and explain how the rule''s
  behavior bears on the philosophical question whether an omission can be a cause
  in the same sense as an action. In particular, what should we expect to happen in
  cases with many potential interveners, and can the rule''s apparent failure modes
  be repaired without re-introducing the old duty requirement through the back door?"


