  Criteria (plausible and reasonable):

  (i) Completeness: the totality is presented as given all at once, as an object that
  can be quantified over, rather than as a process that can always be extended.

  (ii) Determinateness: for any well-defined candidate, it is objectively settled
  whether it belongs to the totality, independent of anyone''s having generated it.

  (iii) Cardinality: the totality has a definite size in the sense that "how many?"
  has an answer comparable to the sizes of other totalities (even if the answer is
  an infinite cardinal).

  (iv) Closure: the totality is closed under an operation (like successor or concatenation
  with a digit) whose repeated application no finite domain could sustain.


