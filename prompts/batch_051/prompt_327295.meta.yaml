  I have been rereading Aristotle''s Nicomachean Ethics, Book III, chapter 6, and
  the following passage has unsettled what I thought I believed about courage:


  "Now the most terrible thing of all is death; ..."


  Then the asker says: Aristotle ties courage proper to facing a noble death, especially
  death in battle, and explicitly denies the name to facing death by drowning or disease.
  That makes sense for his world, but I live in a society where battle death is extremely
  rare and the military is a specialized profession. I''m trying to figure out what
  I actually think about courage as a virtue in a peaceful society, using my gut on
  cases. Here are my verdicts:


  1. A firefighter who enters a burning building to save a child, knowing there is
  a real chance of death: clearly courageous.

  2. A dissident who publishes criticism of an authoritarian regime, knowing imprisonment
  or execution is likely: clearly courageous.

  3. A cancer patient who endures brutal treatment without complaint and maintains
  hope for the sake of their family: not exactly courage — something like fortitude
  or endurance, but not the same.

  4. An alpinist who repeatedly takes fatal risks on difficult climbs for no social
  purpose: not courage; more like thrill-seeking, even though death is possible and
  skill is required.

  5. A whistleblower at a corporation who reports fraud and loses their career, home,
  and marriage, but never faces physical danger: I want to call this courage, though
  it doesn''t fit Aristotle''s death-in-battle paradigm at all.

  6. A soldier in a modern army who follows orders in a war and is killed: this seems
  closer to Aristotle''s paradigm, but I''m not sure I feel more admiration for it
  than for the whistleblower, and I''m not sure the soldier exercised the relevant
  sort of choice.

  7. Someone with severe social anxiety who gives a best man speech despite feeling
  terrified: I don''t call this courage; I call it overcoming fear, but it feels wrong
  to put it in the same category as the firefighter.

  8. A person who refuses to flee a city under bombardment but does nothing to help
  others and waits passively: not courage; something like stubbornness or resignation.

  9. A surgeon who takes a high-risk operation that could destroy their career, where
  the risk is professional death rather than physical death: I lean toward calling
  this courage, but I''m uneasy about whether it stretches the concept too far.


  These verdicts leave me with a puzzle. Aristotle identifies the paradigm case of
  courage as facing a noble death, particularly in battle, for the sake of the noble.
  Several of my verdicts involve no physical death at all, and some involve facing
  death but do not strike me as courageous. Yet dropping Aristotle''s paradigm and
