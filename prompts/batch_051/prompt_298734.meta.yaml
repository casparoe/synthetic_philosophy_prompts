  ---

  I am grading a question on a midterm in a course on mathematical concepts and definitions.
  The question and the student''s answer are below. Please assign a numerical grade
  out of 10 and provide the point-by-point comments that justify that grade. In particular,
  mark any technical errors or conflations, however small, and explain what should
  be corrected.


  Question: "The epsilon-delta definition of continuity applies only to functions
  between metric spaces. Topologists instead define a function f: X → Y between topological
  spaces to be continuous when the inverse image of every open set in Y is open in
  X. Explain why this open-set formulation is treated as the ''right'' generalization
  of continuity. What exactly does it generalize, and what, if anything, is lost?"


  Student''s answer: "The epsilon-delta definition is tied to distance: it says that
  points sufficiently close in X are mapped close in Y. The open-set definition says
  f is continuous iff f^{-1}(V) is open in X whenever V is open in Y. The point of
  the reformulation is that in a metric space the two conditions are equivalent, but
  the open-set condition mentions only open sets, not distances. This allows continuity
  to be defined on arbitrary topological spaces, where we have a qualitative substitute
  for closeness: a point is near a set if every open set containing it meets the set.
  The definition is the right one because it makes continuity depend only on the topology
  and not on the particular metric, so two metrics that produce the same open sets
  produce the same continuous functions. Another way to state the condition is that
