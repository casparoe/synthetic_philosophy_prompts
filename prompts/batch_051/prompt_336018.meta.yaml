  Moral luck (resultant): Two agents act with equal drunk-driving negligence; one
  kills, one doesn''t; the killer is blamed more and punished more, though the difference
  is luck. The agent''s quality of will seems identical. In epistemology, Gettier:
  S has justified true belief but by luck (e.g., stops clock showing correct time;
  or job offer with ten coins—truth coincides due to other factors). The agent''s
  internal justification doesn''t guarantee truth; the world cooperates by accident.
  Verdict: no knowledge. But there''s a subtle difference: in moral cases, the standard
  view says agent''s *blameworthiness* should not differ, but our practices do; the
  "quality of will" view says resultant luck should not affect moral blame for the
  agent, yet legal/punishment or responsibility for outcome might differ. In Gettier,
  the standard verdict is that knowledge is absent even though belief is justified
  and true; the luck undercuts knowledge. The parallel: both involve a gap between
  internal merit (justification/quality of will) and external outcome (truth/harm),
  and luck shaping the verdict.


  But are they deeply analogous? One disanalogy: in moral luck, the luck affects the
  outcome *caused by* the action, and the agent may reasonably be required to answer
  for the outcome (responsibility for consequences) even if character is equal. In
  Gettier, luck affects the *relation between the agent''s evidence and the truth*,
  not a consequence of the belief. Also, in the moral case one question is whether
  blame should track internal quality or outcome; in the Gettier case everyone agrees
  knowledge requires something beyond justified true belief (anti-luck condition).
  Another disanalogy: in moral resultant luck, the difference in verdict is often
  contested (maybe we shouldn''t blame the killer more); in Gettier, the verdict (no
  knowledge) is settled. So maybe the parallel fails on the second-order issue.


