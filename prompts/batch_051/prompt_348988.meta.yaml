  plus motivated reasoning, not deception strictly speaking." This misrepresents Mele:
  Mele explicitly separates self-deception from mere wishful thinking and argues the
  phenomenon is genuine (the "deflationary" label concerns the conditions, not the
  reality). Hasty grader might let "not deception strictly speaking" slide.

  2. "each account still leaves an explanatory gap: because neither requires the person
  to intend to deceive herself, neither can explain the sense in which the self-deceiver
  is responsible for the lie she lives." This is a step that doesn''t follow — responsibility
  doesn''t require intention to deceive oneself (negligence, self-management, prior
  choices). Also it treats "intending to deceive oneself" as the only possible source
  of responsibility. Subtle.

  3. "The paradox shows that self-deception is possible only if we''re willing to
  accept something like a divided mind; once we go deflationary, we''re no longer
  talking about self-deception at all." This is another conflation: deflationary account
  denies that self-deception requires divided mind or intention, but doesn''t thereby
  change the subject — it says the phenomenon is possible without them. But this may
  overlap with #1. Maybe fine.


