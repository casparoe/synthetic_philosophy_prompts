  Student answer draft:


  "Self-deception is standardly understood as a person''s coming to believe something
  false, against the evidence, because the belief is somehow motivated, e.g., a father
  who refuses to accept that his son is using drugs despite clear signs. The paradox
  is that deceiving someone normally requires the deceiver to know or at least believe
  the truth and intentionally keep it from the deceived person; but in self-deception
  the deceiver and the deceived are the same person, so the person would have to both
  know the truth and be ignorant of it at the same time. That looks impossible.


  One response is Davidson''s partition view. Davidson argues that the mind is not
  a single unified agent; it contains quasi-independent substructures, each with its
  own beliefs and desires, and one subsystem can keep the truth from another. On this
  view the person can both know and not know the incriminating facts because different
  parts of the mind hold the conflicting states. This solves the paradox by rejecting
  the assumption that there is a single self doing both jobs.


  The other response is Mele''s deflationary account. Mele denies that genuine self-deception
  requires either an intention to deceive oneself or contradictory beliefs. Instead,
  a desire that p biases the person''s treatment of evidence — she spends more time
  on evidence for p, finds it more convincing, and fails to consider alternatives
  — and in this way she arrives at the false belief that p without ever intending
  to form it. On Mele''s view, then, what we call self-deception is really just wishful
  thinking plus motivated reasoning, not deception strictly speaking.


  I think the deflationary account is right about the mechanism but it changes the
  subject. Each account still leaves an explanatory gap: because neither requires
  the person to intend to deceive herself, neither can explain the sense in which
  the self-deceiver is responsible for the lie she lives. What the paradox shows is
  that self-deception is possible only if we''re willing to accept something like
  a divided mind; once we go deflationary, we''re no longer talking about self-deception
  at all."


  Now identify the subtle mistakes:

