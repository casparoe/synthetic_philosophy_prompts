  ---


  I''m a reporter who covers philosophy and cognitive science, and I''m working on
  a piece about how Ibn Sīnā''s flying man thought experiment gets revived in modern
  debates about self-awareness. I built the following argument for the piece, and
  now I suspect it proves too much, because the conclusion is something almost nobody
  I interview wants to sign up for. Here it is.


  In the so-called flying man scenario, imagine a person created all at once, fully
  formed and healthy, but suspended in empty air with his eyes covered and his limbs
  arranged so they don''t touch each other or anything else. He has no sight, smell,
  hearing, taste, touch, no bodily pain or pressure, and no remembered sensations
  from before. Avicenna''s point, as I understand it, is that this person would still
  affirm that he exists, with certainty.


  1. The suspended person, with no sensory input and no memory of any sensory input,
  would still be directly aware of his own existence.

  2. So awareness of one''s own existence does not depend on the senses, on bodily
  contact, or on having had a history of experiences.

  3. If awareness of my own existence isn''t something I get from my body or senses,
  then it belongs to something non-bodily: a soul or intellect that apprehends itself
  directly.

  4. And if the soul can apprehend itself directly, independently of the body, then
  it can have that self-awareness even in the absence of any external world.

  5. But then my most basic and certain piece of knowledge, that I exist, is wholly
  self-contained and puts me in direct contact only with myself.

  6. If that is the most basic bit of knowledge, then awareness of things outside
  me—this laptop, your face, my own hands—can only be a further step: an inference
  or a construction from sensory material, never as direct as self-knowledge.

