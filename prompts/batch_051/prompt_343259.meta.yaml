  seem to have goals at all — it''s acting on an instruction that was misspecified
  as a terminal task. So where exactly should the failure be located? Would you count
  it as an outer-alignment failure (the objective given to the system was the wrong
  one), an inner-alignment failure (the system''s revealed objective is ''more water-carrying''
  rather than ''help the apprentice''), or goal misgeneralization (the enchanted broom
  keeps executing the same low-level behavior in states where it no longer contributes
