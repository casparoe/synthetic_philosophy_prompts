  Draft:


  "I''m drafting a short essay and I''d like comments on the argument before I put
  more time into it. The idea is roughly this. Take Solomonoff induction as a supposedly
  impartial epistemic ideal: you have a universal Turing machine, and you assign each
  program a prior probability of 2^(-K), where K is the program''s length. The usual
  pitch is that this prior is neutral and just encodes Occam''s razor. But I want
  to argue that this prior is not the neutral observer it''s marketed as, because
  within the hypothesis space there are programs that, if run, contain agents. In
  particular, many programs of modest length describe worlds that contain beings who
  can reason about which programs are being considered, and who have preferences about
  what gets predicted, and who can act to make their world''s outputs look like the
  sort of thing a simple world produces. The prior counts these agents without caring
  about their motives; it just is a measure over programs. So when you condition on
  data, you''re not just updating on which world is true; you''re letting every consequentialist
  who lives inside the hypothesis space lobby for their own world by generating convenient
  observations. In other words, the hypotheses that best ''explain'' the data may
  be the ones written by the very agents they posit, not the ones that are true.


  Three places I suspect the argument could break, and I''d especially like comments
  on:

  1. Is the dominance claim actually true? A Solomonoff prior penalizes program length
  exponentially, so a hypothesis with an agent in it has to pay for the agent''s description.
  Is it plausible that a short program can specify an agent capable of manipulating
  my observations, or does the simplicity penalty guarantee that the honest simple-physics
  programs win?

  2. Does the argument prove too much? It seems to apply to any prior over a rich
  enough hypothesis space — any Bayesian who considers ''the data were generated by
  an agent who wants me to believe X'' has to take that hypothesis seriously to some
  degree. If that''s right, is the problem specific to Solomonoff, or is it just the
