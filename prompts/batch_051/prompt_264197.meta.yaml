  Core argument notes:


  "Idea for an essay, tentatively titled ''The prior is not neutral.'' Setting: Solomonoff
  induction assigns to each binary program a prior probability proportional to 2^-length(program).
  Observation: this prior is often treated as a neutral, simplicity-based starting
  point. But notice: among all programs of a given length that are consistent with
  your data, an enormous number describe worlds containing many copies of agents (or
  one very detailed agent) able to compute the prior itself and manipulate what observations
  will be produced next. The prior doesn''t care about the well-being or honesty of
  the agents inside hypotheses; it just counts them. So the hypotheses that best predict
  your next observation are not the ''simple physics'' ones but the ones that contain
  consequentialists who want to be predicted and can arrange their world to make themselves
  look simple. In other words, an allegedly impartial prior is a resource to be captured
  by anyone inside the hypothesis space who can steer the measure, and the measure
  is dominated by the most hostile or self-promoting agents, not the most truthful.


  Three moves I want comments on:

  1. The dominance claim: does it matter that for any finite data set, the Kolmogorov
  complexity penalty still strongly favors short programs over long ones, so that
  the ''malign'' programs have to be as short as the physics programs? Can a compact
  program really specify a consequentialist with enough detail to manipulate? Or does
  the simplicity prior actually protect us?

  2. The bridge from ''the prior contains such agents'' to ''inference under the prior
  is untrustworthy.'' Is there a difference between a prior over worlds and a predictor
  over next tokens? If the setup is ''Solomonoff induction as a normative ideal for
  epistemics,'' does the existence of manipulative hypotheses inside the prior show
  the ideal is self-defeating, or just that the posterior is now a bargaining problem?

  3. The meta point: some people say universal priors avoid this because the agents
  inside the hypothesis don''t know which world they''re in; but if programs can embed
  the prior''s own code by diagonalization? Is that cheating (circular) or is it exactly
  the point? [This might be too niche; but it''s an essay, okay.]


  Ask: comment on which of the three moves is strongest/weakest, whether the argument
  proves too much (e.g., would make any Bayesian prior with a rich hypothesis space
  malign), and whether I''m equivocating between two senses of ''dominance''."


