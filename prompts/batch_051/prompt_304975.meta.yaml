  Okay here''s one that''s been bugging me. I''ve been trying to reconstruct the test
  a Bentham-style utilitarian would use for when a sexual act can be legally punished,
  and I want to see whether it survives contact with a weird case. Here''s my reconstruction,
  four conditions:


  (a) the act foreseeably causes pain or lost pleasure to at least one person other
  than the consenting participants;

  (b) that pain or lost pleasure can''t be the self-induced unpleasantness of dwelling
  on someone else''s private conduct — mere moral displeasure at the thought of it
  doesn''t count, or at best counts at a steep discount;

  (c) the expected harm of legal punishment, including the chilling effect on other
  harmless consensual activity, isn''t greater than the expected harm of the act itself;

  (d) the rule you''d actually be enforcing, stated openly, doesn''t license punishing
  people for being disgusted by harmless difference generally.


  Now the case. A brother and sister, both adults and both sterile (he''s had a vasectomy,
  she''s had a hysterectomy), wait until their remaining parent is dead, tell no one,
  and have a brief, mutually satisfying incestuous relationship exactly once. They
  part on good terms. Years later a third party finds out from a diary and is viscerally,
  persistently distressed by the bare fact that this act occured — they can''t sleep,
  they feel the world is genuinely worse for containing it. The distress is real and
  stable, and it isn''t based on any false belief about coercion, pregnancy risk,
  or family dynamics.


  Apply the test. Does the third party''s distress get counted under (a)? What would
  the principle of utility, taken at face value, say about punishing the siblings
  — and does that force you to abandon (b)? If you don''t count the distress, what''s
  the principle for discounting it, and does that principle do weird things elsewhere?
  I honestly don''t know whether this case is a deep problem for harm-based sexual
  ethics or just shows my reconstruction needs sharpening, so tell me which it is
  and why.


  Then end by telling me what would actually change your mind: which step of your
