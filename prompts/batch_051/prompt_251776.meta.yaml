  Classic philosophical points:

  - Akrasia: acting against one''s better judgment. The person judges that A is best
  all things considered, yet does B. Socrates denied it was possible (no one errs
  knowingly). Davidson restored possibility: weakness of the will is possible because
  of a gap between all-things-considered judgment and an unconditional judgment /
  intention; the akratic fails to form the corresponding unconditional judgment because
  of irrationality (mental partitioning, principle of continence).

  - Hyperbolic discounting (Ainslie, Laibson) says people discount future rewards
  hyperbolically: δ/(1 + k t). This generates preference reversals: at t0 you prefer
  LL (larger-later) over SS (smaller-sooner), but at t1 close to SS you prefer SS.
  You plan to save/diet, but when the moment arrives you cave.

  - Question: is the caving a case of akrasia? At the moment of choice, the person''s
  preference says the cake maximizes utility, so under a revealed-preference/behavioral
  reading, they act on their current judgment. But they earlier judged not to eat
  it. The puzzle: If we say the agent was akratic, we must identify a stable judgment
  they violated (their earlier plan). If we model with hyperbolic discounting as preference,
  the apparent akrasia dissolves into preference reversal — not weakness but consistent
  with a discount function. But if we model it as "true" long-run preference and the
  discounting is a bias, then the model explains how bias causes akrasia. The argument
  could equivocate between "what you most prefer at time of choice" and "what you
  judge best."


