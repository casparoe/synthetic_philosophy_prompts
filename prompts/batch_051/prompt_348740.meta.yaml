  Let me draft Type 1 money-pump prompt:


  ---


  "I''ve been re-reading some old LessWrong and OB threads about preference theory,
  and I keep running into a move I don''t have a clean term for, and I''m not sure
  whether the thing I''m noticing is one phenomenon or two. The canonical money-pump
  argument shows that if someone''s preferences go in a circle—A preferred to B, B
  to C, C to A—then a trader can move them around the cycle while charging a small
  fee each step, leaving them worse off. Fair enough. But the argument as usually
  stated treats the person as myopic: they evaluate each trade in isolation and never
  notice that the whole sequence returns them to where they started, minus fees. A
  person with ordinary foresight can apparently just decline the first trade and the
  pump never gets going. The slide that bothers me is this: people take a pump that
  only works against a myopic chooser, and then use it to conclude that the preference
  cycle itself is irrational — not just costly if you''re myopic, but incoherent or
  a mistake — without explaining why the burden falls on the preferences rather than
  on the myopia. Sometimes, when pressed, they''ll say the rational thing is to ''precommit''
  or ''be dynamically consistent,'' but that seems to smuggle in exactly the thing
  the pump was supposed to demonstrate. Other times they shift to a different pump
  that does seem to work even with foresight, and act as though the original argument
  established it. Is there a name for this slide — exploiting a myopia-dependent pump
  while drawing a myopia-independent conclusion — or for the gap between ''there exists
  a sequence of trades you''d naively accept'' and ''your preferences are irrational''?
  I know the nearby terrain has ''sophisticated choice,'' ''backward induction,''
  ''resolute choice,'' and Dutch-book arguments, and I want to know which of these
  the thing I''m noticing actually is, how it differs from the others, and whether
  the two moves (the slide, and the pump-switching) are the same phenomenon or different
  ones. A bare label won''t help; I''m after the boundaries."


