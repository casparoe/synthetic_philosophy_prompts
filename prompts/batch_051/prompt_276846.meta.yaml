  Simon''s satisficing:

  - Agent has an aspiration level (threshold) T.

  - Searches through options until one meets T.

  - Chooses it (stops).

  - Adjusts T over time: if options are easy to find, raise T; if hard, lower T (so
  the agent "satisfices" with what''s available).


