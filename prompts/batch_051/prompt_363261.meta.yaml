  Version:


  "Consider two regress arguments and use them to work out a general criterion for
  deciding when an infinite regress is vicious.


  The first is familiar from epistemology. Suppose a belief is justified only if it
  is supported by another justified belief, and that support must itself be justified.
  Then either the chain of justification stops at an unjustified belief, loops around,
  or continues without end. Many philosophers have thought that the endless chain
  does not really confer justification: each link merely passes on a debt that is
  never discharged.


  The second is less often discussed. Suppose a relation is a real entity over and
  above its terms. Then one can ask what makes it the case that this entity actually
  relates a and b, rather than merely standing alongside them. If one introduces a
  further relation to bind the first relation to its terms, the same question arises
  about that further relation, and so on. Yet many philosophers regard this regress
  as harmless, or as showing only that the original picture of relations was badly
  drawn, not that no relation ever holds.


  Compare the two regresses. Is there a single feature that explains why the first
  is widely regarded as vicious and the second as benign? Or do the two cases differ
  in less systematic ways? In your answer, propose and defend a general test for viciousness,
  and apply it to both cases."


