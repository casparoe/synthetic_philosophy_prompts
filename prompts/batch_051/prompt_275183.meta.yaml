  The asker writes:

  "For a seminar on diachronic rationality, I''ve been asked to articulate my position.
  Here is roughly where I''ve landed:

  (1) I think cyclic preferences (A≻B, B≻C, C≻A) are irrational, and the standard
  money-pump argument is basically sound.

  (2) I think the right way to think about sequential choice is sophisticated choice:
  at each moment, choose so as to maximize expected utility given predictions about
  one''s own future choices, rather than naively treating each decision in isolation.

  (3) I reject resolute choice: I don''t think an agent can, or rationally should,
  bind their later self to a plan just because the plan was optimal from the earlier
  perspective, unless the later self independently endorses it.

  (4) I think it can be rational to precommit (e.g., Ulysses tying himself to the
  mast) even when the later self would, at the time, prefer to undo the precommitment.

  (5) I think an agent''s preferences over temporally extended outcomes should satisfy
  dynamic consistency: the plan chosen as optimal at one time should remain optimal
  at later times, absent new information.

  (6) I think present bias / hyperbolic discounting is a real defect of rationality,
  but only when it leads to being exploitable or to preference reversals; mere differential
  weighting of near vs far future isn''t by itself irrational.


  Ask: Which of these are in tension, which only appear to be, rank tensions by severity,
  what''s the cheapest fix, what single revision cleans up the most."


