  Wait, need real tensions, not obvious ones. There are subtle tensions:

  - If you''re a sophisticated chooser and reject resolute choice, how do you justify
  precommitment? Sophisticated choice can lead to "self-binding" as a way to alter
  future options; but if you know you''ll later prefer to undo the binding, sophisticated
  choice says you should now choose the binding only if it leads to better outcomes
  given your future (sophisticated) choices. There''s a known issue: sophisticated
  choice can make you worse off than resolute choice in some cases (the "sophisticated
  choice" vs "resolute choice" debate). Also there''s the tension between endorsing
  money-pump arguments (which assume naive choice / sequential choice by an agent
  who doesn''t foresee) and endorsing sophisticated choice (which denies that the
  agent will be pumped). The money-pump argument''s force depends on assumptions about
  how choices are made over time.


  There''s a subtle point: the money pump argument against cyclic preferences assumes
  the agent, when offered a sequence of trades, takes each trade myopically (naively)
  or that preferences are choice-guiding in a static sense. If the agent is sophisticated
  and sees the whole sequence, they may refuse the first trade, so no pump. Some philosophers
  argue this undermines the money-pump argument as a demonstration of irrationality
  of cyclic preferences: the argument only shows that naive agents with cyclic preferences
  are exploitable, not that cyclic preferences are irrational per se. Others reply
  with "money pump with foresight" or argue that even sophisticated agents with cyclic
  preferences will be exploited in more complex setups (Rabinowicz, etc.). This is
  in the weeds.


