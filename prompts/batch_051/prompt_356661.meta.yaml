  Desiderata ideas for death:


  1. Make death a distinct concept from related states: coma, vegetative state, brain
  death, cardiac arrest, whole-body cell death. Because the definition must not declare
  living persons dead (false positives) nor keep corpses attached to machines (false
  negatives).


  2. Make death a biological fact, not a value judgment or social convention, but
  be usable for social/legal purposes (organ donation, burial, inheritance). Tension:
  if death is a biological event, why is it partly stipulated?


  3. Satisfy "decapitation"/"permanent loss of organismic functioning" intuitions:
  a decapitated body is dead even if cells survive.


  4. Handle ECMO: circulation can be maintained indefinitely while brain is destroyed.
  Whole-brain death covers this; circulatory criteria have trouble.


  5. Handle the distinction between "irreversible" (cannot be reversed by any means,
  now or in future) vs "permanent" (will not be reversed, because no one will attempt
  resuscitation). If death requires irreversibility, then underdetermined by future
  tech; if permanence suffices, DCD donors might not be "dead" in the traditional
  sense. This is a key philosophical issue: Bernat and others discuss irreversibility
  vs permanence. Injectable without citation: "the difference between irreversible
  and permanent."


  6. Be diagnosable at the bedside with acceptable error rate; tests must be reliable
  but cannot demand proof of total brain destruction (which is hard to verify) since
  autopsy vs bedside.


  7. Cohere with the criterion-test distinction: definition (what death is) vs criterion
