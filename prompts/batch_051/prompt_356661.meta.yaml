  conflate the metaphysics with the diagnostic.


  8. Respect the dead donor rule: organs should be procured only from dead donors,
  so the definition must classify organ donors as dead at time of procurement; but
  this requirement risks being self-serving. Tension: independent biological definition
  vs donor pragmatics.


  9. Cross-cultural/religious pluralism? Some definitions (brain death) conflict with
  cardiorespiratory views in some communities. Desideratum maybe: should the definition
  be publicly justifiable? Maybe not non-negotiable.


  10. Integratable with legal standards; a definition that changes death''s legal
