  A friend and I recently spent a long evening arguing about whether introspection
  is a trustworthy source of knowledge. He defended what he called the final-authority
  view, according to which a person''s sincere report of a current state of their
  own mind — what they are feeling, wanting, believing, or thinking — should be accepted
  as correct unless there is overwhelming external evidence against it. I found myself
  agreeing with him about some cases, resisting others, and noticing that my reactions
  were less consistent than I would have liked. The argument left me wanting to get
  clear about what I actually think.


  So I wrote down my undoctored verdicts about particular cases, followed by the principle
  my friend and I kept circling around in our argument. (1) If I report that I currently
  have a throbbing pain in my left shoulder, I treat that report as about as reliable
  as my report of the color of the wall in front of me. (2) If I say that the mental
  image I am now forming of my childhood home is vivid and that I can make out the
  red front door, I trust the report. (3) If I say I chose a job candidate because
  she was the best qualified, but my notes later show that I rated nearly every early
  interviewee more harshly regardless of credentials, I conclude that my introspected
  reason was confabulated. (4) If I insist that I am not feeling any resentment toward
