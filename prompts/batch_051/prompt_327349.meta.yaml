  is reliable for what is currently present to the mind and unreliable for causes,
  processes, and standing dispositions — doesn''t obviously fit all of these either,
  since cases (2) and (5) both concern what was recently present to consciousness,
  and case (4) feels closer to a standing disposition than to a current sensation.
  Is there one principle, or a small set of candidates, that best captures my verdicts?
  Please state each candidate precisely, say which clause handles which case, tell
  me how it rules on a further case I have not listed, and be explicit about which
  of my verdicts, if any, it cannot accommodate and would force me to revise. Also,
  please write your answer in American English.


