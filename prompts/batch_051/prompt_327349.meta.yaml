  A friend and I spent a long evening arguing about the epistemic status of introspection.
  He defended what he called the final-authority view: when someone sincerely reports
  a current state of their own mind — what they feel, want, believe, or are thinking
  — that report should be treated as correct unless there is overwhelming external
  evidence against it. I found myself agreeing about some examples, balking at others,
  and noticing that my reactions were not as consistent as I would like. The argument
  left me wanting to get clear on what I actually think.


  So I wrote down my untutored verdicts about particular cases, listed below, and
  I would like you to help me find the principle, if there is one, that captures them.


  Here are the cases. (1) If I report that I currently have a throbbing pain in my
  left shoulder, I treat that report as about as reliable as my report of the color
  of the wall in front of me. (2) If I say that the mental image I am now forming
  of my childhood home is vivid and that I can make out the red front door, I trust
  that report. (3) If I say I chose a job candidate because she was the best qualified,
  but my notes later show that I rated nearly every early interviewee more harshly
  regardless of credentials, I conclude that my introspected reason was confabulated.
  (4) If I insist I am not resentful toward my sister for missing my graduation, yet
  I keep finding excuses to mention her absence and make small digs about it, I do
  not trust the "no resentment" report. (5) If I am asked, moments after solving a
  puzzle, in what order three key ideas came to me, I may answer confidently, but
  I think my confidence is largely worthless. (6) If I report that I am currently
  deliberating about whether to have dinner before or after the gym, I trust that
  report completely.


