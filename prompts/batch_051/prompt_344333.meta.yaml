  At a medical ethics seminar I attended, two of my colleagues got stuck in a dispute
  about the doing/allowing distinction, and neither would concede. They were comparing
  two cases. In the first, a patient is stable on a ventilator whose battery is fully
  charged; a physician switches the machine off, and the patient dies within minutes.
  In the second, the same patient''s ventilator battery has only five minutes of charge
  left; the physician decides not to replace it, and the patient dies five minutes
  later.


  One colleague, Elena, insisted that the first is a killing and the second is a letting
  die, and that the distinction matters morally. The other, Marcus, replied that this
  is impossible to swallow: the only difference is whether support is withdrawn now
  or allowed to lapse five minutes from now, and no moral description should turn
  on where in the act sequence the doctor''s body happens to move.


  Elena answered: the counterfactual is not a detail. In the first case the patient
  would have gone on living, absent the physician''s intervention; in the second the
  patient would have died anyway within five minutes, absent intervention. That is
  exactly the difference between making someone worse off and failing to make them
  better off.


  Marcus came back: by that test, a do-not-resuscitate order would count as killing
  whenever the patient could have been revived, since absent the decision not to do
  CPR the patient would have lived longer. But you presumably want to say DNR is a
  letting die. And if DNR is letting die, so is switching off a ventilator: both are
  decisions not to continue an intervention at the moment the intervention would be
  needed.


  Elena said that DNR is different: the patient is already in cardiac arrest, with
  the body''s own lethal process underway, whereas the ventilated patient is physiologically
  stable until the switch is thrown. So in the ventilator case the physician inserts
  herself into a process that was otherwise not going to kill the patient; in DNR
  she merely refrains from interrupting a process that already has.


