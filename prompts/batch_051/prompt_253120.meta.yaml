  For a philosophy of mind seminar, I''ve been asked to circulate a short statement
  of where I stand on the Knobe effect in experimental philosophy, so that the rest
  of the group can interrogate it before I present. Here is the statement:


  1. About the cases. In the classic pair of chairman vignettes — the program will
  increase profits, and the chairman is told it will also damage the environment (in
  one version) or benefit it (in the other); in both he says the environmental effect
  doesn''t matter to him and approves the program on profit grounds alone — ordinary
  speakers are right in both versions: he harmed the environment intentionally, and
  he did not help the environment intentionally.


  2. About the principle I endorse for side effects. A foreseen side effect of an
  action is done intentionally when the agent foresees it and goes ahead with the
  action anyway. Foresight together with going ahead is enough for the side effect
  to count as intentional.


  3. About the chairman''s aims. In both versions, the chairman does not intend the
  environmental effect at all; his aim is profit. The environmental effect is known
  but not among his goals.


  4. About intending versus doing intentionally. Intending X and doing X intentionally
  can come apart: a side effect can be done intentionally even though it was never
  the agent''s intention to bring it about.


  5. About truth conditions. Whether a person did something intentionally is settled
  by what the person knew and was willing to do, not by whether the thing turned out
  to be good or bad.


