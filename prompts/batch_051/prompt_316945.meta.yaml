  At the pub on Thursday, two of my flatmates got properly stuck into an argument
  about moral language, and neither of them would let it go. I''m just going to recount
  it as faithfully as I can.


  Dan started it. He said he''d been reading something about how saying "bullfighting
  is wrong" isn''t a description of some spooky moral fact out there in the world;
  it''s more like a stance or a plan — "boo to bullfighting" — and that''s why moral
  judgments get their grip on you in a way ordinary facts don''t. It explains, he
  said, why two people can agree on every non-moral fact about bullfighting and still
  disagree.


  Kat wasn''t having it. She said: fine, but then what''s going on in "If bullfighting
  is wrong, then paying to watch it is wrong"? You''re not booing bullfighting when
  you say the antecedent, because you''re not asserting it at all. You might be a
  vegetarian from Barcelona who thinks bullfighting is perfectly fine but still accepts
  the conditional. And then there''s the argument:


  1. Bullfighting is wrong.

  2. If bullfighting is wrong, then paying to watch it is wrong.

  3. So, paying to watch it is wrong.


  She said that''s obviously valid; anyone who accepts the premises but rejects the
  conclusion is making a logical mistake. But if the first premise expresses a stance
  and the conditional expresses something else entirely, she can''t see how the pieces
  are supposed to fit together to force a mistake. She said this is the Frege-Geach
  problem, and that attitudes just don''t have the right shape to be premises.


  Dan came back with what he said was the standard fix. The conditional, he said,
  expresses a higher-order policy: a kind of disapproval of the combination of states
  (booing bullfighting while not booing paying to watch it). So if you accept the
  first premise and the conditional but refuse the conclusion, you''re not being formally
  inconsistent; you''re in a state that clashes with your own higher-order policy
  — more like intending to get to the library and intending to catch the only bus
  that gets you there, while refusing to get on the bus. "Logical validity" in this
  domain is really a constraint on coherent combinations of attitudes, not on truth-preservation.


  Kat said that''s clever but she has two problems with it. First, it''s got the direction
  backwards: we understand the conditional before we understand whatever exotic higher-order
  attitude supposedly goes with it, and it''s very hard to believe ordinary speakers
  are constantly forming attitudes about their own attitudes every time they think
  a conditional moral thought. Second, she said, he hasn''t said anything about all
  the other connectives, quantifiers, or tense operators. What''s the attitude expressed
  by "It''s not wrong", or "Most bullfights are wrong", or "If it had been wrong,
  I wouldn''t have gone"? Until he has a systematic story, he''s just patching one
  case.


  Dan said that''s a demand for a full compositional semantics, and it can be met
  — "wrong" expresses disapproval, sentence mood expresses acceptance, and the connectives
  are builders that take attitudes and output more complex attitudes; the fact that
  he can''t do it on a napkin doesn''t mean it can''t be done. The real constraint,
  he said, is that the meanings have to compose, and attitudes can compose.


  Kat granted that, but said the harder case is mixed sentences: "Either bullfighting
  is wrong or the trains are running late." There''s no natural attitude that''s the
  disjunction of a disapproval and a belief. You''d have to say the sentence expresses
  a sort of hybrid pair-state, and then you''re not doing pure expressivism anymore;
  you''re admitting that moral words do their work by expressing something belief-like
  after all.


  Dan paused and said maybe expressivism does have to be a bit hybrid — the view can
  say moral judgments express both a desire-like state and a factual belief, with
  the desire-like part doing the action-guiding work. That, he said, isn''t a retreat;
  it''s the sensible version of the view, and it can still say there are no robust
  moral facts.


  Kat said that hybrid views just move the bump in the carpet: if the belief part
