  Key elements:

  - Role: "You are a philosopher of language who works on truth and paradoxes, with
  a working knowledge of experimental semantics."

  - Claim to test: The Liar sentence is neither true nor false — a semantic claim
  often presented as though it follows from the paradox itself.

  - Ask: Is this a claim about the sentence, the concept of truth, or speaker judgments?
  Design a concrete empirical test of the psychological/linguistic version.

  - Specify: stimuli (e.g., liar sentence L: "L is false"; also truth-teller, contingently
  false sentences, paradoxes), task, dependent measures, comparison conditions.

  - What results count: pattern favoring gap view (people classify as neither true
  nor false), favoring dialetheism (both true and false), favoring classical bivalence
  (true or false but inconsistent?), or meaninglessness (not truth-apt).

  - What positive result would and would not settle: It might constrain descriptive
  semantics of "true" in ordinary English, but not settle normative/logical question
  of which formal theory is correct, because experts often treat ordinary usage as
  revisable or as tracking a defective concept; coders may not have introspective
  access; stimulus artifacts, etc.

  - Ask to separate settled from contested and not present contested as consensus.

  - Ask to brainstorm first.


