  historian of early modern political philosophy. Start by brainstorming the readings
  that make these two constraints compatible, then say whether the reconciliation
  is genuine or special pleading. Is the spoilage limit a clarification of the enough-and-as-good
  proviso, an independent non-waste principle, a temporary condition that money later
  dissolves, or something else? What should I have said to my friend? American English,
  please."


