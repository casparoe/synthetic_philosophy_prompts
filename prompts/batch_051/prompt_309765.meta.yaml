  Eliminative materialism (eliminativism): the view that "folk psychology" — our common-sense
  framework of propositional attitudes like beliefs and desires — is a theory, and
  it''s likely radically false; as neuroscience matures, these categories will be
  eliminated (not reduced) from our scientific ontology, like phlogiston, caloric,
  or witches (well, witches is tendentious). Key proponents: Paul Churchland, Patricia
  Churchland, sometimes Stephen Stich (earlier), Quine? Fodor is the opponent. The
  view contrasts with:

  - Reductive materialism: beliefs and desires are real and will be reduced to neural
  states.

  - Functionalism/realism about propositional attitudes: beliefs are real functional
  states.

  - Instrumentalism (Dennett''s "intentional stance"): beliefs are useful fictions/predictive
  heuristics, not literally true, but we keep them.

  - Dualism etc.


  The central claim: our everyday mental categories are theoretical posits of a "folk
  theory," and this theory may be false; if it fails to match neuroscience, the entities
  it posits might not exist. Also eliminativists argue folk psychology is stagnant,
  has explanatory failures (sleep, mental illness, learning, memory), and doesn''t
  fit the rest of science.


