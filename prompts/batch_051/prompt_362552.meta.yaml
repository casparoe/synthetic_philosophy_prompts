  The argument (Earman-Norton 1987): Consider a spacetime model (M, g). Let h: M →
  M be a nontrivial diffeomorphism that is the identity outside some open region H
  (the "hole") and smoothly moves points within H. Let g'' = h*g (pullback). Then
  (M, g) and (M, g'') are both models of the same laws (diffeomorphism-invariant field
  equations); they agree outside H but differ within H. A manifold substantivalist
  holds that the manifold points are real and the models differ in that g and g''
  assign different metric values to the same points — hence represent different distributions
  of geometry over the same set of points — so according to substantivalism they represent
  distinct possible worlds. But then take the hole H to lie in the future of a Cauchy
  surface Σ. The two models agree on the region up to and including Σ (since h is
  the identity there and outside H in an appropriate neighborhood) and diverge after;
  the laws are deterministic (GR is typically deterministic in this formulation),
  so the state on Σ should determine a unique future. Contradiction: GR under substantivalism
  becomes radically indeterministic. Conclusion: either reject manifold substantivalism
  (relationism: only the fields and their relations are real), or keep substantivalism
  but deny that models related by a diffeomorphism represent distinct physical states
  (Leibniz equivalence / "sophisticated substantivalism"). Earman and Norton take
  this as an argument against substantivalism.


