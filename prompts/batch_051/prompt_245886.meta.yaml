  Version:


  I am a high school student in a history course that just finished a unit on whether
  history moves in cycles or in a straight line, covering Polybius, Ibn Khaldun, Spengler,
  and Toynbee. Our final assignment is a creative piece, and I have chosen to submit
  a poem. I would like you to write a villanelle: nineteen lines, five tercets and
  a closing quatrain, with two refrains that alternate and then come together in the
  final two lines. The poem should stage the debate between cyclical and linear views
  of history, and the form should do real conceptual work rather than merely decorate
  the content.


  Please make the two refrains carry the two rival positions: one refrain should voice
  the cyclical thesis, that what rises falls and rises again; the other should voice
  the linear thesis, that history is going somewhere and does not simply return. Because
  the villanelle forces refrains to recur, the returning cyclical line should make
  the reader feel recurrence, while the tercets in between should themselves advance
  through the thinkers and examples, so that the reader experiences linear progression
  and circular return at the same time. In the final quatrain, bring the two refrains
  together without simply declaring a winner; I would prefer an image or reconciliation
  that lets the cycle and the arrow coexist, something like a wheel that turns while
  the cart moves forward.


  For content, the poem should pass through, without mere name-dropping, at least
  three of the following positions. Polybius: the cycle of constitutions running from
  monarchy through tyranny, aristocracy, oligarchy, democracy, and mob rule and back
  to monarchy, together with his admiration for the mixed constitution as a brake
  on that cycle. Ibn Khaldun: dynasties held together by asabiyyah, the group solidarity
  that is strong in harsh conditions and decays in luxury over a few generations,
  so that each dynasty is eventually replaced by a fresher one. Spengler: cultures
  as organisms that are born, ripen, decline, and die, with civilization as their
  petrified final phase. Toynbee: growth through creative responses to challenges
  and decline through the failure of a creative minority to keep responding, with
  the important nuance that Toynbee is not a simple cycle theorist, since he allows
  for genuine novelty and renewal rather than fixed recurrence. If possible, also
  touch the linear side through Enlightenment progress, providential or eschatological
  history, or the idea that later history is not merely more of the same. Do not use
  quotations; everything should be in your own words.


  Act as an expert poet with graduate-level knowledge of the philosophy of history.
  Before drafting, think carefully about how the villanelle''s rhyme scheme and refrain
  placement can carry the argument; brainstorm two or three possible refrain pairs,
  and choose the one that lets the form do the most philosophical work. Then write
