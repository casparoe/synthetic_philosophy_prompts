  The subtle misrepresentations:

  1. Montaigne doesn''t say no rational standard exists — he appeals to "the rules
  of reason" and nature; he judges European practices as worse by a standard.

  2. He doesn''t claim Tupinambá are morally superior across the board — the passage
  shows his praise is constrained: their wars are "noble and generous... as much excuse...
  as that human malady is capable of," treating war itself as a disease. He distinguishes
  their specific virtues (valor, absence of covetousness) from full-throated moral
  superiority.

  3. Cannibalism is not "just a different custom with no real moral significance"
  — Montaigne does condemn its "barbarous horror" but insists Europeans are worse
  (eating men alive, torturing). His point is comparative cruelty, not indifference.

  4. Colonialism wrong: Montaigne''s essay does imply criticism, but not "every culture''s
  practices are equally valid" — he''s not a relativist; some things (cruelty, covetousness,
  inequality) are genuinely worse.


