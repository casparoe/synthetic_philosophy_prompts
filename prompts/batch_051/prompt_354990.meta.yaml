  The hot hand topic is actually in the weeds and has a nice double movement: the
  theory illuminates the case, and the case tests the theories. The three interpretations
  of probability map nicely:

  - Frequentism: probability as limiting relative frequency in a reference class.
  In hot hand, the frequentist must specify the reference class: all shots by this
  player, shots after k hits, home vs away, vs similar players? The conditional frequency
  P(hit | k hits) is estimable from data. The 1985 study did that and found no increase;
  but the 2015 re-analysis found that the natural estimator is biased downward due
  to how streaks are sampled — so frequentism must be careful about measurement. This
  is a neat point: the debate was partly a frequentist methodology question, not a
  judgment question.

  - Subjectivism: probability as degree of belief. The original claim was that observers
  commit a fallacy — they over-infer a causal process from short runs. Subjectivism
  explains why people update: they treat runs as evidence for a higher hit probability;
  but Bayesian updating with a prior that permits a shifting parameter can make belief
  in hot hand rational. The question is whether the observer''s prior is warranted.
  The subjectivist view would also ask: what would it take to update? It doesn''t
  say the world has a true changing probability; it just models coherence of belief.

  - Propensity: the player''s objective chance of hitting, which may vary over time
  due to confidence, muscle memory, defense adjustments. Propensity gives the most
  natural home for the "hot hand is real" claim; the theory''s burden is to specify
  the disposition''s trigger and to distinguish it from mere selection effects. The
  episode shows that the existence of a propensity cannot be settled by frequency
  data alone, because the measurement artifact masquerades as a propensitarian claim.


