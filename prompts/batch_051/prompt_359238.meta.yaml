  Draft:


  "I have been trying to get clear about when an infinite regress is vicious, and
  I have settled on a distinction I would like checked before I lean on it. I call
  the two shapes of regress ''cascades'' and ''staircases.''


  A cascade is a regress in which each item yields the next: the later items are consequences
  of the earlier ones, and the chain grows downward from what is already secured.
  A staircase is a regress in which each item owes its standing to the next: the chain
  climbs upward, and each earlier item is only as good as the later one is.


  My thesis is that infinity is a red herring. What makes a regress vicious is never
  its failure to terminate but whether it is a staircase whose relation defers rather
  than delivers. Cascades are always benign, because the later items depend on the
  earlier ones and the earlier ones do not wait on them. Staircases are vicious only
  when the later item does not actually confer the standing in question but merely
  promises it, conditional on a further item conferring it first. Justification is
  the clean case: each later belief is supposed to make the earlier one justified,
  but it can do so only if it is itself justified, so the justification is always
  deferred and never arrives. An infinite chain of causes is also a staircase—each
  event''s occurrence is owed to an earlier cause—but it is not vicious, because each
  cause actually bestows occurrence on its effect; nothing is postponed. What I cannot
  yet state cleanly is what principled feature marks the difference between causation''s
  onward bestowal and justification''s onward deferral, and I suspect that gap is
  where the account stands or falls.


