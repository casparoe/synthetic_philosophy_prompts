  I''m a teaching assistant for an undergraduate course on judgment and decision-making,
  and I''m marking final exam essays. The material has become personally relevant
  to me this year: I spent the summer trying to renovate a house, and I consistently
  ignored reference-class estimates in favor of detailed plans that later proved optimistic.
  So I want to be scrupulously fair in grading this question rather than grading students
  by my own lingering irritation with the phenomenon. Below is the exam question and
  one student''s full answer, reproduced as submitted.


  [Question]

  Explain the distinction between the inside view and the outside view in forecasting.
  Using an example, discuss why outside-view forecasts are often more accurate than
  inside-view forecasts, and identify at least one condition under which relying on
  the outside view would be a mistake.


  [Student''s answer]

  The inside view is the approach to forecasting that focuses on the particular features
  of the case at hand: the steps in the plan, the people involved, the known obstacles,
  and how long each component will take if things go reasonably well. The outside
  view sets those details aside and asks what happened in a distribution of similar
  cases, such as projects of the same general kind, and forecasts the present case
  by reference to that distribution rather than by adding up task estimates.


  For example, suppose a team is estimating the release date for a software product.
  The inside view would have them decompose the remaining work into features and multiply
  developers by weeks, arriving at something like eight weeks. The outside view would
  have the team collect past software projects of comparable size and complexity and
  observe that projects with similarly optimistic early plans actually shipped in
  three to five times the original estimate. A team taking the outside view would
  therefore predict roughly twenty weeks or more.


  The outside view tends to be more accurate because it corrects for the planning
  fallacy and for optimistic biases that infect within-case reasoning. When people
  reason from plan details, they give too much weight to how they intend things to
  go and too little weight to the base rates of failure, delay, and cost overrun in
  comparable projects. The outside view substitutes an empirically observed distribution
  for the agent''s self-serving simulation of the case. Because the distribution is
  objective, the outside-view forecast is the correct one once an appropriate reference
  class has been selected. At that point, the analyst should probably resist bringing
  in further case-specific details, since reintroducing details is exactly how optimism
  creeps back into the estimate.


  The only circumstance in which the outside view would be a mistake is when no suitable
  reference class exists. If the project is genuinely novel, there will be no comparable
  cases to average over, so no outside-view forecast can be constructed and one must
  fall back on the inside view. In all other cases, the outside view is the most reliable
  predictor available.


  [end answer]


  Please give this answer a grade (e.g., letter or points out of a rubric of your
  choosing, as long as you specify the rubric) and a point-by-point assessment. Be
  explicit about which parts are correct and which, if any, are mistaken. I would
  also like you to state how confident you are in your overall grading, and to identify
  the single assessment point you are least sure about.


