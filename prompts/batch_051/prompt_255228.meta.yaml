  Draft:


  > I keep using a distinction in my moral epistemology seminar that I want someone
  to poke holes in before I build a paper around it. I call it the difference between
  a *signed* and a *seeded* moral belief. A signed belief is one whose justification,
  when you''re asked why you hold it, is ultimately someone else''s say-so: "I believe
  it because she said so." A seeded belief also began with someone else''s say-so—someone
  had to say "that''s not just awkward, it''s wrong" before you considered it—but
  by the time you hold it, the justification you''d actually give is your own: you
  can point to the features of the case, make comparisons, maybe even improve on the
  original speaker''s reasons.

  >

  > My claim, and I''m fairly convinced of it, is that the moral testimony literature
  keeps attacking signed beliefs while examples of moral testimony in real life are
  almost all seeded. If I''m right, then the usual anti-testimony line (you can''t
  just take someone else''s word on a moral matter, because then you''d lack understanding,
  or you''d be alienated from your own action, whatever the exact version is) proves
  too little: it might show that signed deference is bad, but it says nothing about
  the seeded case, and the seeded case is the norm. The optimists, meanwhile, defend
  the seeded case but don''t notice they''ve changed the subject.

  >

  > What I want from you is an honest assessment. Is the signed/seeded distinction
  a real one, or does it collapse under pressure—say, because seeded beliefs are just
  signed beliefs plus post hoc rationalization, which is worse, not better? Does this
