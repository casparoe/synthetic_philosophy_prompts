  only under distortion, and which have no counterpart in the Bayesian vocabulary
  at all. In particular I want to know whether the pessimist''s core move — that the
  crucial knowledge cannot be gotten from testimony — turns into something a Bayesian
  can state precisely (for example, a claim that the informant''s report is always
  screened off by something, or that the relevant evidence is necessarily private
  and incommunicable), and whether that Bayesian version is defensible. And I want
  your committed verdict on the residue: is the untranslatable remainder evidence
  that the Bayesian framework has a real blind spot about first-person experience
