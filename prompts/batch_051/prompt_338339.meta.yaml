  the moderate variant — in the vocabulary of Bayesian epistemology I described above,
  as systematically and faithfully as you can. I want a translation, not an analogy
  or a concession that aesthetics is just about ''taste'': formalize each side''s
  claim as a claim about evidence, information channels, or updating where that is
  possible, and edit ruthlessly against smuggling in assumptions that only make sense
  in the source framework.


