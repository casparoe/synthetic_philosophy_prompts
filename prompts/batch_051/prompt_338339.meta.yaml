  Draft:


  "I''ve spent years reading the rationalist blogs and forums, so the vocabulary I''m
  most comfortable in is Bayesian epistemology as it''s used there: priors and likelihood
  ratios, evidence and posteriors, common knowledge and Aumann''s agreement theorem,
  private information and what it gets screened off by, deference to experts'' opinions,
