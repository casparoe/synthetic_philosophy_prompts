  can''t. I''m fluent in this machinery — I can follow a proof of the agreement result,
  and I get the distinction between updating on a person''s report and updating on
  the fact that they believe something.


  There''s a debate in aesthetics about aesthetic testimony: roughly, can you legitimately
  acquire aesthetic knowledge from what other people tell you about a work? One side
  — call it the pessimist — says no. A critic''s description, a friend''s enthusiasm,
  a canonical reputation: these can transmit ordinary facts (the sonata is in C minor,
  the plot is predictable, it was made in 1963) but not the aesthetic knowledge that
  matters, like whether the work is good, beautiful, moving, or profound. That, the
  pessimist says, requires firsthand acquaintance with the object; without it you
  may end up with a borrowed belief or a socially useful false assurance, but not
  knowledge. The other side — call it the optimist — says this overstates. Testimony
  is a normal channel for knowledge in nearly every other domain, and there''s no
  obvious reason aesthetics should be different: critics and experienced friends track
  real features of works, their views are correlated with the truth, and deferring
  to them can put you in a better epistemic position than your own unformed first
  impression would. A moderate pessimist variant adds: maybe testimony can transmit
  the belief and even some justification, but not the understanding or appreciation
  that make aesthetic judgment valuable in the first place.


