  \ things, including absurd ones like all non-chalk things are ravens.\n\nLet's make\
  \ this an argument with numbered steps:\n\n(1) Positive instances confirm universal\
  \ generalizations. (Nicod's condition)\n(2) If evidence confirms a hypothesis H,\
  \ it confirms any logically equivalent H'. (Equivalence condition)\n(3) All ravens\
