  Let me lay out the Woodwardian concepts to inject:

  - Causation as invariance under interventions.

  - An intervention in Woodward''s sense: an exogenous causal process that changes
  X in a controlled, surgical way, not correlated with other causes of Y, i.e., it
  changes Y only through X. (Surgical).

  - Invariance: a generalization is invariant if it is stable under some range of
  interventions and changes in background conditions. Invariance under interventions
  on X is the mark of a causal relation, not the size of the effect or mere model
  fit.

  - Distinguish invariance from robustness under prediction conditions (fire engines:
  predictive but not invariant when you intervene).

  - Underdetermination/circularity worry: causes are characterized in terms of interventions,
  but interventions are themselves causal notions ("surgical" = the intervention must
  act only through X); so criteria of "surgical" can''t be assessed without already
  knowing the causal structure. The procedure must mark when it relies on background
  causal knowledge rather than resolving attribution.

  - Modularity: sets of invariant relationships that can be changed independently.


