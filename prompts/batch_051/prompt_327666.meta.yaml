  the evidence supports a causal claim, grounded in an interventionist account of
  causation: the claim that X causes Y is to be assessed as the claim that the relationship
  between X and Y would be invariant under a suitable intervention on X — that is,
  under a manipulation of X that changes X independently of other causes of Y and
  that affects Y only through X. Please operationalize this without requiring my team
  to read the philosophy: what counts as an intervention in an observational or quasi-experimental
  setting, how to recognize evidence of invariance (stability of the relationship
  across a relevant range of actual interventions or shocks to X, and across changes
  in background conditions), and how invariance differs from mere predictive robustness
  or from a large estimated effect.


