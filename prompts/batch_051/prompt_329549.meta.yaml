  "The theory side I find genuinely compelling: a preference should be a ranking of
  outcomes, not of descriptions. Whether I own the mug at t=0 shouldn''t matter; what
  matters is which end state I''m in. If losing $10 and failing to gain $10 leave
  me in the same final state relative to the alternative, they should be treated the
  same. The endowment effect — people demand roughly twice as much to sell a mug they
  were just given as they''d pay to buy one — looks like the reference point (ownership,
  default) changing the evaluation. That''s a framing effect; if a preference depends
  on a frame, which one is ''the real'' preference? It underdetermines what I actually
  value, so the whole idea of maximizing my own utility starts to look ill-defined.
  And prospect theory''s loss aversion just catalogues the bias, it doesn''t justify
  it."


