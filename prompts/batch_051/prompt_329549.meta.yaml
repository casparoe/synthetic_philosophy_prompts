  Full draft:


  "I spent nearly forty years as a physical chemist, and the habit I can''t drop is
  the conviction that a good theory shouldn''t depend on how you label the setup:
  coordinates, reference frames, which side of the equation you call ''baseline.''
  So when I started reading philosophy around retirement I got completely tangled
  in the debate about loss aversion and the endowment effect, because it feels like
  exactly that kind of frame-dependence, except now the frame is what you happen to
  own.


  The side I find theoretically compelling goes like this. A preference ought to be
  a ranking of outcomes, not of descriptions of outcomes. If I end up with a mug or
  I end up with five dollars, the ranking shouldn''t change because someone flipped
  whether the mug was described as mine at the start. So the fact that people who
  are just handed a mug will demand about twice as much to sell it as people who weren''t
  handed one will pay to buy it looks like a mistake: the reference point — owning,
  not owning, a default — is leaking into the evaluation. The standard cleanups don''t
  obviously rescue it, because the mugs were randomly assigned so owners aren''t a
  self-selected group of mug-lovers, the stakes are too small for wealth effects to
  matter, and the transaction costs in the experimental market are trivial and symmetric.
  Prospect theory''s answer — losses loom about twice as large as gains — seems to
  me like a description of the bug dressed up as a parameter. And if my preferences
  really do depend on the frame, then ''what I prefer'' is underdetermined in a way
  that should bother anyone who ever needed a unique solution to an equation.


  The feeling I can''t get rid of is this. I own my father''s old brass telescope.
  It doesn''t work well and it isn''t worth much, but if you asked me to name a selling
  price, the number I''d genuinely give is far above anything I''d pay for the identical
  telescope in someone else''s attic. That gap doesn''t feel like a miscalculation
  to me; it feels like what it is to have had the thing, to have it woven into what
  I take myself to be doing. When I think about losing something I already have, the
  fear isn''t just about the end state, it''s about the transition, the change in
  what my life has accumulated. But the mug experiments were built, as far as I can
  tell, precisely to rule out those special stories — attachments, inherited goods,
  biography — and yet the gap shows up even for strangers and mugs. So either my attachment
  is the thing that has to go, a misfiring heuristic no more trustworthy than a visual
  illusion, or the theory''s demand that only final outcomes count is too strong,
  or there''s a reading on which both survive.


  What I want to know is: in this clash, which side should yield, and what would justify
  yielding rather than just declaring a winner? If the endowment effect is a legitimate
  part of what I value, what exactly changes in the theory — reference-dependent utility,
  a broader conception of outcomes that includes history and ownership, something
  else — and how do I stop that from licensing every status-quo bias people have?
  If the attachment is the thing that should go, what''s the argument that it''s a
  misfire rather than a value, given that I can state the mug experiment results and
  still feel the telescope? Is there a reading on which description-invariance about
  final states and genuine loss aversion are compatible, maybe because my ownership
  now is a real difference in the outcome, not just the frame? I''m less interested
  in which camp you''re in than in what would actually settle it: what evidence or
  argument would move me in each direction, and what would only beg the question."


