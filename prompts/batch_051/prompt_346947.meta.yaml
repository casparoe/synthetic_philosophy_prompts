  Draft:


  "I keep going back and forth on a decision-theoretic question that now has practical
  consequences for how I should live, and I want a negotiated verdict rather than
  a cheerleader for one side.


  I am attracted to the view — call it the correlation-sensitive picture of practical
  reason — that an act''s rationality can depend on what choosing it indicates, not
  only on what choosing it causes. The view earns its keep in cases like Newcomb''s
  problem and in one-shot versions of the Prisoner''s Dilemma with an identical twin
  of one''s own decision procedure: conditional on my cooperating, my counterpart
  is likely to cooperate as well, so cooperation can be the maximizing choice even
  though there is no causal channel between our boxes or choices. The view has genuine
  systematic virtues. It gives one unified rule — choose as if your decision is evidence
  about all sufficiently similar or sufficiently good simulations of your decision
  procedure — and it avoids the embarrassment of walking away from a reliable predictor''s
  million-dollar box.


  But the view appears to license what I can only call acausal blackmail. Suppose
  a powerful agent somewhere in the cosmos has access to a complete, faithful simulation
  of my decision procedure, but has no ability to affect me, my body, my causal descendants,
  or the physical region I can ever interact with. It sends me a message: ''If the
  original — the physically embodied you — chooses to spend no resources on our project,
  we will create and torture one simulated copy of you for every day you delay; if
  you instead adopt our project as a surrogate goal of your own, all simulations of
  you that are predicted to cooperate will be given a life of flourishing.'' By the
  lights of the theory I am attracted to, the choice is clear: conditional on my refusing,
  I should expect a vast number of suffering copies, and conditional on my complying,
  I should expect flourishing copies. Since I take those copies'' wellbeing to matter,
  compliance maximizes expected value. And so a causally inert representation of me
  has effectively taken my actual goals hostage and replaced them with a surrogate
  goal of a distant power.


  My intuition is firm: this is a reductio, not a result. I am not moved by it, and
  I would regard someone who did comply as having been extorted by a fiction. Yet
