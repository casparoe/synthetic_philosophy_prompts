  Last night I sat with two friends, Emre and Priya, while their conversation turned
  into a long argument I mostly listened to. It began with Emre forwarding me a message
  that Priya had left unanswered for days, but the argument quickly left the specifics
  and became about a general principle: whether we owe it to other people to make
  ourselves legible — to state our reasons, name our feelings, and let people read
  us accurately rather than guess. They went back and forth for a while, and neither
  seemed to land a clean blow. Here is how the argument went, more or less in their
  own words.


  (1) Emre said that in any close relationship you owe the other person the work of
  being readable. If someone has to infer your needs from silences and testy remarks,
  and can be blamed for guessing wrong, then you have offloaded your own self-interpretation
  onto them and made them responsible for a map they were never given. There is a
  duty of legibility toward people whose lives are entangled with yours.


  (2) Priya replied that a lot of inner life isn''t legible even to the person living
  it. Often you don''t know what you feel or why until much later, and a duty to be
  legible would force you to either fabricate a coherent account or be counted as
  having done something wrong. That''s a duty that rewards the articulate and the
  self-assured, and punishes the confused.


  (3) Emre said that can''t be an objection, because the duty isn''t to be clear;
  it''s to try — and it''s defeasible. There is a difference between "I can''t put
  this into words yet, and I''m not asking you to act on it" and "I won''t help you
  read me, but I still expect you to respond correctly." The first honors the duty;
  the second uses opacity as a kind of power.


  (4) Priya said even "try" is too strong as a standing demand. Why does another person''s
  desire to have a map of me create a claim on my self-narration? People can have
  a legitimate interest in the privacy of their own minds, even from those they love,
  and not every relationship gives the other person a right to my self-interpretation.
  The actual duty, if any, is narrower: don''t punish people for failing to read you
  when you refused to make yourself readable.


  (5) Emre said that narrower principle still gets you most of the way to his view.
  If you won''t be read, fine, but then you can''t later treat the other person as
  though they failed to reach you. Legibility isn''t a duty to confess; it''s a duty
  to either make yourself readable or stop holding others answerable for the reading.


  (6) Priya answered that even that cleaner version treats opacity as something that
  needs a justification, whereas sometimes opacity is how a boundary announces itself.
  The person who won''t explain may be saying, "not here, not to you, not yet," and
  being transparent about that refusal might be exactly what they cannot do without
  giving up the boundary.


