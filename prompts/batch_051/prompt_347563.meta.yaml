  tosses, dice, repeatedly sampled populations), both agree that frequencies are relevant
  and that subjectivists should eventually conform (via de Finetti representation
  / calibration).

  - Both can agree that different agents with different information can rationally
  assign different probabilities to the same proposition.

  - Both can agree on some operational constraints: avoiding Dutch books, calibration,
  maybe scoring rules.


  Precise disagreement:

  - Frequentist: probability statements are meaningful only for (or refer to) long-run
  frequencies in reference classes; a single-event probability like "probability of
  rain tomorrow" or "probability the defendant is guilty" is either meaningless, elliptical,
  or must be cashed out as a frequency over a suitable class.

  - Subjectivist: probability is a degree of belief, a property of an agent''s information;
  single-event probabilities are fine; frequencies are evidence that should constrain
  degrees of belief but not the meaning.


  Cruxes:

  - Whether there is a non-arbitrary reference class for single events (the reference
  class problem). Both agree it''s a problem; frequentist predicts it''s solvable
  in principle or at least in scientific practice via objective classes; subjectivist
  predicts it''s ineliminable and that the choice reflects background information/pragmatics.

  - Whether calibration to frequencies is normatively required or merely an empirical
  fact about well-designed agents: subjectivist says you''re rationally required to
  use frequencies as data (via exchangeability and conditioning), but not to define
  probability that way; frequentist says probabilities are frequencies, so being "calibrated"
  isn''t a separate norm but the meaning.

  - Whether identical evidence forces identical probabilities (uniqueness). Frequentist
  might think objective probabilities are unique given the reference class; subjectivist
  denies uniqueness because priors can differ.

  - Do-nothing: rigid designation. Hmm.


