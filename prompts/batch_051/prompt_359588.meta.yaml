  I''m teaching a seminar on the meaning of life, and we''ve spent two weeks on Schlick''s
  essay On the Meaning of Life. I keep getting tripped up on the central move. He
  argues that when people ask what the meaning of life is, they imagine that a meaningful
  life must have a purpose outside itself—some goal it serves, some reward it earns.
  And then he says this is the mistake. The meaning of life isn''t a proposition or
  a goal; it''s found in moments when activity carries its own value, the way play
  does. He basically paraphrases that the meaning of life is youth: not a period of
  life but a way of being in it, where one is caught up in doing for its own sake.
  The question, as he frames it, dissolves because we only ask it when we''ve stepped
  back from living into a kind of instrumental, work-oriented stance.


  I find the view attractive, even beautiful, but I want to know what would actually
  count against it. Suppose someone says Schlick''s answer is too sunny, that it can''t
  handle lives marked by loss, duty, or suffering—or that it makes meaning too subjective,
