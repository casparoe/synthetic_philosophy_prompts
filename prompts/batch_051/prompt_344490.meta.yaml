  at will, then the union''s rules are not binding in the sense that matters: the
  state is never finally constrained, because it can simply quit; the union is a revocable
  conference, not an authority. (5) If it cannot withdraw at will (or the union''s
  rules override its own), then the state no longer has final authority over its own
  affairs and has ceased to be sovereign. (6) Therefore joining a customs union either
  does nothing or abolishes sovereignty.


