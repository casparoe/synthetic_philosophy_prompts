  The classic moral luck argument (Nagel):


  1. We tend to hold people morally responsible only for what they do, not what is
  beyond their control.

  2. But the actual outcomes of their actions are largely beyond their control. (Resultant
  luck)

  3. Therefore, if we accept the control principle, we cannot morally assess people
  differently based on outcomes. So we shouldn''t blame the successful murder more
  than the attempted one (attempt vs. completed).

  4. The same applies to one''s circumstances (circumstantial luck): whether one had
  the opportunity to act well or badly depends on factors beyond one''s control (e.g.,
  being a German in Nazi Germany vs. Argentina).

  5. And to one''s constitution (constitutive luck): one''s temperament, inclinations,
  strength of will, etc.

  6. One''s intentions and choices arise from one''s situation and constitution, which
  are themselves matters of luck.

  7. Therefore, ultimately nothing about anyone is within their control in the relevant
  sense, and no one can be morally assessed for anything.

  8. But we cannot give up the practice of moral judgment; some people are clearly
  blameworthy (e.g., those who voluntarily torture others).

  So the control principle leads to an unacceptable conclusion; where does the argument
  go wrong?


  This is essentially Nagel''s own presentation. The answer in the literature: one
  may deny (1) by arguing that agent responsibility doesn''t require total control
  over outcomes, only that the agent''s action be intentional; we can reject the "control
  principle" in favor of a "quality of will" view, blaming people for what their actions
  reveal about their will, not for outcomes as such. But wait, on the quality of will
  view, the two negligent drivers reveal the same will, so should be blamed equally—but
  we can make a distinction: punishment and legal consequences may track outcomes
  for deterrent reasons, while moral blameworthiness tracks quality of will. That''s
  a common move. The argument is valid if the control principle is interpreted broadly;
  the real question is which premise to reject. Actually Nagel''s argument shows the
  control principle (CP) conflicts with our reactive attitudes; we must either reject
  CP (and accept resultant moral luck) or reject the practice. Most people reject
  CP. The subtlety: the conclusion "no one can be morally assessed for anything" may
  not follow from individual instances of luck; there''s a scope shift from "for any
  assessment, there is some luck factor" to "there is some luck factor for all assessments"
  — but I think it does follow in the cumulative sense. The prompt asks where it goes
  wrong, if it does; if valid, which premise to give up.


