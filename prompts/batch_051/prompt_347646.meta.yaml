  Higher-order thought (HOT) theory: A mental state is conscious iff it is the object
  of a suitable higher-order thought — where the HOT is an assertoric, non-inferential,
  actual thought about the person being in that state. Rosenthal. Key questions:

  - What makes the HOT itself conscious? Rosenthal: it can be conscious if targeted
  by a third-order thought, but usually it''s not conscious, and that''s fine because
  consciousness of a state ≠ introspective awareness; the HOT is not itself conscious.

  - Misrepresentation: If a HOT represents a state that doesn''t exist (a "targetless"
  HOT), it should seem one is in that state? Rosenthal accepts: cases of confabulation;
  targetless HOTs produce subjective appearances with no object.

  - If the HOT misrepresents a sensory state as, say, red when it''s green, the person
  consciously sees red. That''s maybe a bullet he accepts.

  - The higher-order state needs to be assertoric and non-inferential; otherwise dispositions
  to think about pain wouldn''t make pain conscious (the ice pack on my leg case?).

  - The conceptual requirement: If HOTs require concepts and involve language-ish
  states, non-human animals and prelinguistic infants cannot have conscious states.
  HOT theorists usually accept that creatures without the relevant concepts lack phenomenal
  consciousness? Rosenthal says animals may have some concepts? Actually some HOT
  theorists accept that animals have consciousness if they have suitable concepts;
  Gennaro? Hm.

  - The "HOT is too intellectual" objection: consciousness should not require thoughts/concepts.
  Phenomenal consciousness seems primitive; many organisms and possibly infants have
  it.

  - The explanatory gap: even if my state is thought about, why does that produce
  "something it is like"? The higher-order representation may be a mere metacognitive
  configuration; the hard problem persists.

  - The "same-order" or "self-representational" views (Kriegel) argue consciousness
  is a state representing itself, avoiding the infinite regress.

  - First-order representationalists (Tye, Dretske) argue consciousness is just a
  state''s being poised for use by cognitive centers, no higher-order state needed.

  - The transparency of experience: we attend to the world, not our mental states
  — seems to conflict with HOT''s claim that the HOT makes us aware of ourselves.

  - Empirical evidence: some argue prefrontal metacognition is too slow/absent in
  cases, whereas consciousness persists in some patients without prefrontal cortex?
  Or blindsight? This is contested but mentionable.


