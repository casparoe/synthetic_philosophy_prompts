  decision theory (LessWrong) is used as a case where CDT fails and agents should
  use "updateless" or "functional" decision theories; an FDT/UDT agent pays because
  their decision procedure (policy) is what the driver''s prediction depends on, even
  though the decision occurs after the ride.


