  Argument:

  P1: To understand model M, need an interpretation I(M) that maps internals to human-evaluable
  claims.

  P2: If interpretation produced by interpreter model A, then A is itself opaque.

  P3: To trust I(M), you need to understand A.

  P4: Therefore you need an interpretation of A, and so on: infinite regress.

  P5: No finite chain terminates except in human judgment or trust.

  C: Automated interpretability can''t yield understanding.


  Flaws:

  - P3 is too strong: to trust the outputs of a tool, you usually don''t need to understand
  the tool''s internals; you need reliability evidence, calibration, validation on
  known cases, etc. You can trust a microscope without understanding its optics. The
  regress only bites if the only acceptable warrant is transparent understanding of
  whomever produces the interpretation, which is a demanding internalist premise.

  - Equivocation on "understanding": understanding a model''s behavior can mean (a)
  being able to predict/control/explain it to some standard, or (b) having another
  model of it that is itself transparent. The argument assumes understanding must
  be grounded in transparency all the way down; but ascriptions of understanding can
  be fallible, partial, purpose-relative and can be warranted by reliability.

  - The induction isn''t sound because each level doesn''t ask the same question;
  an interpreter for A (a language model with an interpreter producing natural language)
  may be more legible than M, or may be queried in a different modality. But if A
  is same type model, regress can be pushed.

  - The conclusion proves too much about human testimony because it also requires
  that to know P from a person''s testimony you must understand the person''s neural
  mechanisms. That suggests rejection of the hidden internalist premise.


  Alternatively, the argument might be valid and the costly premise to reject is (3):
  understanding/trust doesn''t require understanding your informant, it requires track
  record. Or reject (1): maybe understanding can be non-propositional or can bottom
  out in predictive control without interpretation.


  So the answer can be: premise (3) is the weak one; the argument looks plausible
  because we conflate "the interpreter is opaque" with "the interpreter is untrustworthy"
  — but reliability can be established without transparency. If you insist on transparency
  all the way down, you also rule out human testimony and much of science (I trust
  instruments, colleagues, black-box experiments). Price: if you reject (3) you need
  an account of when opaque-but-validated outputs count as understanding and when
  they''re just epistemically dangerous (e.g., when the validation set is easier than
  the real distribution). Or keep (3) and accept global skepticism about understanding
  by opaque systems, including humans. That''s costly.


