  Rawls distinguishes an exclusive and an inclusive view of public reason. On the
  exclusive view, citizens may never introduce their comprehensive doctrines into
  public political debate. On the inclusive view, they may introduce such doctrines
  as long as proper political reasons are presented at some point. Rawls himself favors
