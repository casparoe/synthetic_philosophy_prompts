  Rawls''s distinction: The "exclusive view" allows fundamental political arguments
  to be framed in terms of public reasons only; comprehensive doctrines are excluded.
  The "inclusive view" (also called the wide view) allows citizens, in certain situations,
  to present what they regard as the basis of political values rooted in their comprehensive
  doctrine, provided they do this in ways that strengthen the ideal of public reason
  itself. The proviso: reasonable comprehensive doctrines may be introduced into public
  political discussion at any time, provided that in due course proper political reasons—and
  not reasons given solely by comprehensive doctrines—are presented that are sufficient
  to support whatever the comprehensive doctrines introduced are said to support.
  This is from "The Idea of Public Reason Revisited" (1997). Rawls says public reason
  is not secular reason; it is a way of political reasoning shared among citizens,
  and the content is given by a family of reasonable liberal political conceptions.


