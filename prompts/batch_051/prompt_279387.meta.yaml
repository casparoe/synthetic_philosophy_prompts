  There is a concept in welfare economics "safe Pareto improvement": A feasible allocation
  y is a safe Pareto improvement over x if for every profile of utility functions
  in a set U (representing uncertainty about welfare), y is weakly better than x for
  all individuals, and strictly better for some — i.e., robust across plausible welfare
  measures. This is used to justify policies without needing to resolve normative
  uncertainty. I think this is from "Safe Pareto Improvements" by ... maybe Marc Fleurbaey?
  "Safe Pareto improvements" is indeed a criterion for robust welfare improvement
  under preference heterogeneity.


