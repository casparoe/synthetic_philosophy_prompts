  Prompt draft:


  I am a retired research physiologist who came late to philosophy, and I have been
  working through the literature on hedonism. I am stuck on what I am told is called
  the heterogeneity problem: the view that pleasure is the sole intrinsic good seems
  to assume that all the many experiences we call pleasures—solving a problem, eating
  a peach, hearing a child laugh, taking an opioid, resting a sore muscle—have some
  single felt quality in common, and that this common quality is what makes them good.
  The problem is that once I introspect, I cannot find any one common thread; the
  experiences seem good for quite different reasons, and some of them do not feel
  like instances of one thing at all.


  The text that has me wondering whether this problem is fatal is the early part of
  the second chapter of Mill''s Utilitarianism. Mill responds to the objection that
  hedonism is a doctrine fit for swine by denying that pleasures differ only in quantity.
  He claims, in effect, that some kinds of pleasure are higher than others, and that
  a competent judge acquainted with both kinds would always prefer the higher kind,
  even if it carries more unease, and would not give it up for any amount of the lower.
  He grounds the distinction in the actual preferences of those who have experienced
  both. The exact wording of the passage is less important to my question than the
  move it makes.


  I would like your actual credence that the move Mill makes in that passage, suitably
  cleaned up, solves the heterogeneity problem for hedonism: that is, that distinguishing
  qualities or kinds of pleasure is enough to explain what all prudentially good experiences
  have in common without collapsing qualitative hedonism into a disguised preferences-based
  or perfectionist theory.


  Please give me a number between zero and one. Then decompose your credence into
  at least four components, with a rough probability and a one- or two-sentence warrant
  for each. At least these should be included: (1) that the heterogeneity problem
  is a genuine problem for Benthamite quantitative hedonism in the first place; (2)
  that Mill''s competent-judge preference test tracks a real shared quality or real
  qualitative distinction rather than, say, status, identity, or aversion; (3) that
  the notion of higher versus lower pleasure can be made non-circular without already
  invoking an independent theory of value; and (4) that a residual common element
  of pleasantness can still do the unifying work hedonism needs. Add any further terms
  you think are necessary. Show how you combine them. Then tell me which term your
  final credence is most sensitive to and what evidence, argument, or introspective
  experiment would most move that term.


