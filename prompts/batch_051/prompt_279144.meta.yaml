  But individual incentive to deviate? If others play p=1/N, a given player maximizes
  own payoff by choosing p? Given others mix with p, player''s best response: if others
  use probability p, expected payoff of sending = (1-p)^{N-1}B; of not sending = 0.
  So send if (1-p)^{N-1}B > 0. That''s always positive unless p=1. So best response
  is always send, not mix. So the superrational mixed solution is not a Nash equilibrium;
  individuals would deviate to always sending? Wait if others play p=1/N, my expected
