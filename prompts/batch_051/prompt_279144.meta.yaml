  Let me think of five distinct senses of "solvable in principle":


  1. Existence/information-theoretic sense: there exists a function from world-models/objectives
  to policies that is arbitrarily capable and safe; i.e., the relevant information
  is in principle extractable from available data/specification.

  2. Computability/algorithmic sense: for any finite task set, there is an algorithm
  that, given enough time and compute, produces an aligned model; solvable in principle
  as in "there exists a Turing machine."

  3. Physical/engineering feasibility sense: there is a concrete training and oversight
  procedure that could be run with resources available in this universe (maybe requiring
  more compute than we have but not more than physics allows).

  4. Robustly specified objective sense: a finite, communicable specification of human
  values exists such that optimizing it would not produce catastrophic side-effects
  — solvable in principle because the value function exists.

  5. Conceptual/philosophical sense: there is no in-principle barrier (no impossibility
  theorem, no deep conceptual confusion about what ''aligned'' means) although we
  have no idea how to realize it.

  6. Scalable oversight sense: for any model capability, a slower overseer can in
  principle elicit honest and useful work from a faster model.


