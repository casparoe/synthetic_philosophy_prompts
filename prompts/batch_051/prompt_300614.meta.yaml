  Draft:


  "For a while I have been bothered by a claim in the methodology of science that
  I keep seeing used as a conversation-stopper. The claim is Friedman''s so-called
  F-twist: roughly, that the unrealisticness of a theory''s assumptions is no mark
  against it, and that a theory stands or falls solely by whether its predictions
  are accurate. I would like to treat this not as a slogan but as a hypothesis, and
  I want to know how one could actually bring evidence to bear on it.


  The problem is that the F-twist is phrased in a way that makes it hard to cash out:
  ''realism'' and ''predictive accuracy'' are not natural kinds. So I want a concrete
  test, specified tightly enough to be run, of the claim that the realism of a model''s
  assumptions and its predictive success are systematically independent. For example,
  one could take a class of target systems whose true data-generating process is known,
  generate a family of models with graded assumptions (some assumptions known false
  but simple, others closer to the truth but more complex), and compare their out-of-sample
  predictive performance when complexity is controlled for; or one could code historical
  cases in the natural and social sciences as a natural experiment. I want you to
  design the strongest version of this test you can, in enough detail that I could
  explain it to someone who does applied statistics but has never read the philosophy
  of economics.


  Then I want you to say what each possible result would show. If simpler, less realistic
  models do no worse once properly evaluated, what exactly would that establish about
  Friedman''s claim, and what would it leave open? If more realistic assumptions systematically
  improve prediction, would that refute the F-twist, or only show that he overstated
  a heuristic? Finally, I suspect a residue that no test can touch. Even if the test
  came out either way, there would still be the question of whether predictive accuracy
  is the right criterion at all, and whether it exhausts what we want from a model
  — explanation, control, transfer to regimes where the data have not been, and the
  honesty of knowing which of our beliefs are doing causal work. I would like the
  test design to be explicit about how it operationalises ''the F-twist,'' and where
  its operationalisation stops resembling the claim a philosopher would actually want
  to defend or attack."


