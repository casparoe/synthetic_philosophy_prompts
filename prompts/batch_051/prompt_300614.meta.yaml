  The F-twist, historically: Friedman (1953) argued that the realism of assumptions
  is irrelevant; only predictive power matters. He gave examples: the hypothesis that
  leaves seek to maximise sunlight (leaves position themselves as if they were rational
  maximisers) though leaves don''t consciously choose. Also billiard player as if
  solving equations. Also monopoly/competition. Some philosophers (Samuelson called
  it the F-twist; later Alan Musgrave''s "Unreal Assumptions in Economic Theory: The
  F-Twist Untwisted" 1981; Uskali Mäki; Daniel Hausman). The twist includes: tried
  to defend unrealistic assumptions by appealing to prediction; distinguished "assumptions
  as abstractions" vs "negligibility" etc.


  A test of the F-twist could be: construct a set of models of the same target system
  varying in realism, measure predictive accuracy and maybe policy/counterfactual
  performance; but what counts as realism? Need operationalization: e.g., degree to
  which assumptions match known microdata. Or use historical case study: models with
  more realistic assumptions vs less realistic that made better predictions (e.g.,
  Ptolemaic epicycles vs Copernicus; Phillips curve; CAPM). But a rigorous test: simulations/agent-based
  models where the "true" generative process is known, and one compares misspecified
  models with simplified assumptions against more realistic but overfit ones. Then
  say: positive result showing less realistic models equal or outperform on prediction
  would support the instrumental half; but it would not settle the normative "therefore
  it''s fine for science to be unrealistic" or "we should not care about mechanisms"
  because scientific goals include explanation, control, and counterfactual reasoning
  under policy change, which out-of-sample prediction may not capture (Lucas critique).
  Also it would not settle whether realism matters when the data-generating process
  shifts.


