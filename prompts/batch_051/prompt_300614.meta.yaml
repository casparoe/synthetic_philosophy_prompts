  Draft final:


  "For some time I have been frustrated by a claim in the methodology of science that
  gets used as a conversation-stopper in economics and, increasingly, in informal
  discussion of machine learning models. The claim is Friedman''s so-called F-twist:
  that the lack of realism in a theory''s assumptions is no mark against it, because
  a theory stands or falls solely by its predictive success. I would like to treat
  that claim not as a slogan but as a hypothesis, and I want to know how one could
  actually bring evidence to bear on it.


  The difficulty is that the F-twist is easy to state and hard to cash out: ''realism''
  is a graded property, ''predictive success'' can mean fit to old data, performance
  on new data, or success under intervention, and the claim itself slides between
  a descriptive generalisation about how science has worked, a normative rule about
  how scientists should choose models, and a semantic thesis about what the false
  assumptions in an accepted model are doing. I want the test to fix one of these
  readings ahead of time and say which one it is.


  Please design the strongest feasible test of the claim, on the reading you choose,
