  Let me recall the Four–Seven debate accurately:


  Context: In Korean Neo-Confucianism in the 16th century, the "Four–Seven" problem
  (사단칠정논쟁) was about the relationship between the Four Beginnings (사단, 四端) from Mencius
  — ceyin (惻隱, commiseration/compassion), xiuwu (羞惡, shame and dislike), cirang (辭讓,
  modesty/yielding), shifei (是非, right and wrong) — and the Seven Feelings (칠정, 七情)
  from the Book of Rites/Legend: joy (喜), anger (怒), sorrow (哀), fear (懼), love (愛),
  hatred (惡), desire (欲).


  The debate started when Gi Dae-seung (Gobong) wrote to Yi Hwang (Toegye) after reading
  the latter''s commentary on Jeong Ji-un''s diagram (Cheonmyeong do) — Toegye had
  written that "the Four Beginnings are issued by li; the Seven Feelings are issued
  by ki" (四端發於理, 七情發於氣). Gobong objected: this dualistic formulation is problematic
  because li is inactive and cannot issue anything by itself; all issuance requires
  ki. He argued the Four Beginnings are included within the Seven Feelings (the Four
  are the good portion/side of the Seven). Toegye responded, refined his view to the
  famous formula: "the Four Beginnings are issued by li and ki follows it; the Seven
  Feelings are issued by ki and li rides on it" (四端理發而氣隨之, 七情氣發而理乘之). Toegye insisted
  the Four have a distinct origin because their pure morality requires a source in
  li directly. Gobong continued to press that if the Four are issued by li, they''d
  lack material existence; he posited "the Four Beginnings and Seven Feelings issue
  together from ki, but..." Hmm, I recall Gobong''s final position: he essentially
  held that the Four Beginnings are the good Seven Feelings and that li and ki are
  not two separate things that each issue; li is the principle of ki. Actually I recall
  Gobong said "the Four Beginnings are also among the Seven Feelings" and argued that
  "one cannot say the Four issue from li and the Seven issue from ki as if they have
  different origins."


  The debate is famous, and later standardized by Yi I (Yulgok) into his own position
  ("the Four Beginnings are the good side of the Seven Feelings; there is only one
  issuance of ki, with li as its principle"). Yulgok''s slogan: "Four Beginnings cannot
  exist apart from Seven Feelings; they are the Seven Feelings'' good side" — and
  "ki issues, li rides" (氣發理乘). Yulgok''s monism vs. Toegye''s dualism became the
  two orthodox "schools."


