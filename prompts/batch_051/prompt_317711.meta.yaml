  widely; then forensic analysts concluded the clip was almost certainly synthetic
  — a deepfake. The correction traveled far less well than the original.


  My two friends — Miriam, a criminal defense attorney, and Evan, a documentary radio
  producer — turned to what the real damage of such fakes is. I can reproduce the
  exchange nearly verbatim from notes I took that evening.


