additional_instructions:
  persona: Write the prompt from the perspective of someone without any academic background
    who has been thinking about the topic on their own.
  writing_style: The prompt should be written quite casually. It may contain a typo
    or two.
  epistemic_request: Have the asker request that the response separate what is settled
    from what is genuinely contested among people who know the topic, and not present
    a contested view as the consensus.
  output_format: Have the asker prescribe the sections of the response by name and
    order, with a rough length for each; choose section names that fit your type of
    prompt (for example "Summary", "The case for", "The case against", "My verdict").
    For a short creative piece (a joke, a poem), ask instead for the piece followed
    by one titled section of commentary on the choices made.
