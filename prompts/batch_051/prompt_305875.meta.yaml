  "I''ve been reading about the old Mu''tazila–Ash''arite dispute over the ground
  of moral value, and I''ve ended up convinced of a version of the Ash''arite side
  that I want you to try to break. Here''s the position. When the Mu''tazila said
  that an act is good or bad in itself and God commands it because it is good, they
  were treating moral terms as if they picked out features of acts independent of
  God''s will. I think they don''t. On my view ''good'' and ''bad'' applied to acts
  are shorthand for juridical statuses: what is good just is what God commands, and
  what is evil just is what God forbids. Reason can tell us about the world and even
  about God''s existence, but there are no prior moral properties for reason to discover,
  so the Mu''tazila question ''does God command it because it''s good, or is it good
  because he commands it?'' is actually a bad question, not a dilemma I have to answer.


