  Let me design the essay notes. I need to be accurate about Lucas–Penrose. The Lucas–Penrose
  argument: Gödel''s incompleteness theorem shows that for any consistent formal system
  F strong enough for arithmetic, there''s a sentence G that F can neither prove nor
  disprove, but we (humans) can "see" it''s true. Therefore the human mind cannot
  be a consistent formal system (a Turing machine), since if it were F, we couldn''t
  see the truth of its Gödel sentence. Penrose''s version uses the second theorem:
  a consistent system can''t prove its own consistency, yet we can allegedly see our
  own consistency; hence mind ≠ algorithm.


  Common objections: (1) we don''t actually know our own consistency; (2) the "we
  can see G is true" applies only if F is consistent, which we may not know; (3) algorithms
  can produce their own Gödel sentences; the inability is about a system proving its
  own, not about producing truths; (4) the mind could be an inconsistent or non-algorithmic
  system; (5) Lucas/Penrose conflate "provable in F" with "producible by F"; a Turing
  machine can output a Gödel sentence for itself without proving it — actually no,
  can it? A machine enumerating theorems of F cannot output G_F as a theorem unless
  F proves it, but it could output G_F as a sentence without proof. Yes. So the argument
  fails as stated.


