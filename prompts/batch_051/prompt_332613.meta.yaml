  may pull in libraries, receive bytecode generated by another tool, communicate over
  a socket, or embed a copy of an interpreter. Which of these combinations makes the
  resulting system a modified version of the original, rather than two separate works
  standing in some looser relation?


  Copyleft licenses draw a practical line between derivative works and mere aggregation:
  putting two programs on the same disk or same server is aggregation, while modifying
  the program''s own code is derivation. But between those clear cases lies a continuum.
  Consider a plugin loaded into the same process; a program linked against a library
  at build time versus at run time; a service that sends queries to a back end over
  HTTP; a code generator that emits snippets of GPL-licensed code into an otherwise
  independent codebase; a container image that packages several programs together;
  a patch that is distributed separately but applies only to the original. Each candidate
  criterion—shared address space, symbol resolution, whether code from one file is
  copied into another, whether the two sides exchange data through a narrow interface,
  whether one is useless without the other—captures some intuitions but fails for
  others.


  I want to suggest, though without pretending to settle the legal question, that
  the underlying difficulty is not technical but ontological and social. Software
  boundaries are conventions made for coordination: they mark modules, teams, ownership,
  and licensing responsibilities. There is no fact of the matter, in the binary or
  the source tree, about where one program ends. The derivative/aggregation distinction
  is best understood as an attempt to port a legal concept designed for indivisible
  objects onto a medium whose parts are routinely split, recombined, and wrapped.
  On this view, calling something a derivative work is less like discovering a structural
