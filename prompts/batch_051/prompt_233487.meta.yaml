  AI safety via debate: two AI agents argue before human judge; truth-seeking emerges
  from competitive debate. Key papers: "AI Safety via Debate" (Irving, Christiano,
  Amodei 2018). Failure modes / limitations:

  1. The judge may be too weak: if the judge can''t verify/discriminate truth from
  falsehood even with good arguments, debate fails. Obfuscated arguments problem:
  a dishonest expert can produce arguments that sound convincing to a limited judge,
  while the honest expert can''t make the truth legible within the judge''s limitations.

  2. Symmetric vs asymmetric information: debate helps when truth is "checkable" but
  maybe not when information is one-sided / not decomposable.

  3. Self-play / equilibria: agents may collude or reach degenerate equilibria where
  they obfuscate, or one agent "filibusters" or debates about irrelevant issues, or
  attacks the judge.

  4. Resource asymmetry / stalling: deceptive debater can exploit more compute, length,
  or choose misleading framing; debate may require both debaters equal resources.

  5. Incentive/game theory: the optimal strategy may be to misrepresent uncertainty
  or exploit judge biases rather than reveal truth; no guarantee that winning arguments
  track truth.

  6. Factual knowledge: debate requires agents to know facts; if both lack knowledge,
  no mechanism yields truth.

  7. Ambiguous questions and no ground truth: many real questions are underspecified,
  values-laden; debate may converge to rhetoric.

  8. Channel/honesty constraints: the honest player must be allowed to point out obfuscation,
  but judge may not trust them; "information asymmetry about who is honest."

  9. "Halting problem"/recursive oversight: if debate on a hard question requires
  the judge to adjudicate subquestions of comparable difficulty, infinite regress.


