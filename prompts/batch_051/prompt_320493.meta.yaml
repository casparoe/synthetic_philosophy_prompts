  I am a journalist who covers economics and the philosophy of the social sciences,
  and I am planning a feature about what happens to the concept of utility when a
  government tries to purge it of introspection. I would like you to produce the analytical
  core of the piece, written in British English.


  The counterfactual. Suppose that in 2035 a medium-sized, high-income parliamentary
  democracy with a strong technocratic civil service and an established practice of
  regulatory cost–benefit analysis passes a Welfare Measurement Act. The Act creates
  a Commission for Choice-Based Welfare and instructs it that, in all official assessments
  of how policies affect citizens'' welfare, the only admissible evidence is choice
  behaviour: actual market transactions, time-use decisions, and choices made in incentive-compatible
  experiments in which participants face real consequences. Stated preferences, self-reports,
  life-satisfaction surveys, and any appeal to utility conceived as a felt state are
  inadmissible. The Commission may use the word utility only as a numerical index
  that represents a consistent choice ordering — the revealed-preference sense of
  the term.


  Predict, with visible reasoning, how this Commission and the surrounding discipline
  look in 2060. In particular, trace the mechanisms by which the constraint reshapes
  what gets measured, which policy areas acquire rigorous welfare numbers and which
  quietly fall out of the Commission''s remit, how researchers adapt through the design
  of choice-based elicitation methods, and where the subjectivity that the Act banishes
  re-enters — for example in decisions about which choices count, how choice sets
  are framed, and how inconsistent choosers are handled. Give a considered view of
  whether the Act succeeds in making welfare measurement more objective, and of what
  the episode shows about whether revealed preference can carry the meaning that talk
  of utility once did.


