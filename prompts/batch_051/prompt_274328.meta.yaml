  Prompt idea:


  "In the decision theory corner of the rationality community, there is a long-running
  standoff about cases like counterfactual mugging and XOR blackmail that never seems
  to move. Take the counterfactual mugging: a powerful predictor flips a fair coin;
  if it lands tails, it asks you for $100 and, if you pay, it gives you $10,000 after
  the fact; if it lands heads, it simply asks you for $100. The predictor tells you
  it''s now the heads case, so your payment has no causal influence on anything. Some
  people say you should pay, because you want to be the kind of agent who would have
  paid in the tails branch; others say paying in the heads branch is throwing money
  away, since nothing about the world changes if you pay. XOR blackmail has a similar
  shape: you are asked to pay to prevent a harm that, by stipulation, will befall
  a causally isolated copy or counterpart of you rather than current-you, so the usual
  consequence-based reasons seem to dissolve while a precommitment-based reason remains.
  The arguments on both sides are by now extremely familiar, and nobody''s mind changes.
  What kind of disagreement is this, really? Is it a verbal dispute about the word
  ''rational'', a substantive disagreement about which decision theory is best, a
  difference over whether rationality is about getting good actual outcomes or about
  being the sort of agent that gets good expected outcomes, or something else? I don''t
  want a survey of decision theories; I want a diagnosis of the impasse, and an honest
  statement of what would count as progress — or why none should be expected."


