  I am a software engineer with no formal background in philosophy, and I have been
  trying to make sense of the claim that Solomonoff induction justifies Occam''s razor.
  In algorithmic information theory, the standard move is to assign a hypothesis h
  a prior probability proportional to 2^{-K(h)}, where K(h) is the length of the shortest
  program that computes h, so that simpler hypotheses start out exponentially more
  probable. There is also a convergence result: if the data are generated by a computable
  measure, the Solomonoff predictor''s forecasts merge with the true measure''s forecasts
  in the limit, no matter which computable measure that is.


