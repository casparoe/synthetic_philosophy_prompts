  read in two opposed ways. On the first reading, it vindicates Occam''s razor: it
  shows that there is a principled, not arbitrary, simplicity bias, and that an agent
  using it will eventually learn the right regularities for any computable world.
  On the second reading, it does no normative work at all: the simplicity bias was
  baked in by the choice to weight hypotheses by 2^{-K(h)}, which is just one prior
  among infinitely many; the convergence result is a consistency property shared by
  a wide class of priors; and K is only defined up to the choice of a programming
  language or universal machine, with the invariance theorem promising only an additive
  constant that can in principle alter the simplicity ordering for any finite amount
  of evidence seen so far. So the theory might show only that if you adopt a simplicity-biased
  prior, you will learn; it does not show that you ought to adopt that prior, or that
  the razor is more than an engineering heuristic.


