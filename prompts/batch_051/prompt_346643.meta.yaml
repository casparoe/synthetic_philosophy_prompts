  Iterated Amplification and Distillation (IDA): proposed by Paul Christiano et al.
  (2018), "Supervising strong learners by amplifying weak experts." Setup: we have
  a human H who is a "weak" overseer, and we want to train an AI A to be aligned and
  capable. Amplification: define an amplified human H_amp that can decompose a task
  into subtasks, delegate copies of itself (or the model) to solve subtasks, and combine
