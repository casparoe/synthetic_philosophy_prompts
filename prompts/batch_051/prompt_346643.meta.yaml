  H_amp''s outputs as labels. Then iterate: the distilled A can serve as the expert
  used in further amplification, allowing decomposition depth to grow. The hope: alignment
  is preserved because each step is either directly done by a human or composed of
  human-checkable pieces, while competence grows by decomposition.


