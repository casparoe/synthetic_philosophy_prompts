  I recently spent a long evening arguing with a friend about language death, and
  we ended up holding three judgments that seem hard to reconcile. We both accepted
  that when an endangered language loses its last fluent speakers, something of real
  value is destroyed, not only for the community but for anyone who regards linguistic
