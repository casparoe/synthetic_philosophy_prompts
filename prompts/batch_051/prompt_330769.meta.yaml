  Camp B (skeptic): Yes, but the theorems have conditions. If your prior assigns zero
  probability to the true hypothesis (or to any region containing it), no amount of
  data can ever dig you out; priors that differ in where they put zero mass never
  wash out. And even when they do, "eventually" can be so slow — the convergence rate
  depends on the prior in high-dimensional or nonparametric settings — that in any
  finite human inquiry priors matter enormously. So "washing out" is a theorem about
  the limit, not an argument against prior sensitivity.


