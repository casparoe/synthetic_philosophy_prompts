  Prompt:


  In his essay The Self as a Center of Narrative Gravity, Daniel Dennett suggests
  that the self is not a substance or a point inside the brain but an abstraction—like
  a center of gravity, a theoretical fiction that does real explanatory work. A center
  of gravity is not an atom inside a chair, and yet it is not nothing: it explains
  exactly why the chair tips. Dennett invites us to regard a person’s self in the
  same way: the self is the spatiotemporal focus of a web of narratives the person
  and others tell, revise, and negotiate over a lifetime.


  I notice that we do not treat all such narrative centers alike. With an individual
  human being, we are willing to say that the narrative center is the real person—the
  thing that owns a life, makes promises, is answerable for acts done years ago under
  very different self-understandings, and deserves praise or blame. But consider a
  long-running literary character written by dozens of authors across generations,
  or an institution that maintains a continuous official voice, issues apologies,
  makes commitments, revises its story about itself, and is treated by law as a person.
  Many people will call those narrative centers useful fictions and locate the moral
  reality in the underlying authors or officeholders, even when there is no single
  underlying author and no single human who was there for the whole story. Is there
  a defensible principle that makes the individual center of narrative gravity morally
  deep while leaving the collaborative or institutional one merely metaphorical? Or
  should we either demote the individual self to a convenient fiction that cannot
  properly be the target of moral judgment, or promote some robust collective narrative
  centers to full selfhood? Tell me whether this asymmetry should be kept, reversed,
  or given up, and test your answer against a difficult nearby case: a person whose
  life story is profoundly fragmented or collectively narrated by family members and
  clinicians.


