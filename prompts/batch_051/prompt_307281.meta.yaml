  Let me brainstorm supererogation positions.


  Supererogation: acts that are good to do but not required; going beyond duty. Classic
  puzzles: Are there genuinely supererogatory acts (vs. the "all good acts are required"
  view)? The paradox of supererogation: if an act is morally good, and there''s no
  reason... Actually the paradox: if a supererogatory act is better than a permissible
  alternative, why isn''t the less good alternative wrong? Standard response: duty
  is not just a function of goodness rankings; there are options/agent-centered prerogatives.
  Another issue: can heroes be criticized for not doing the saintly act? Typically
  no, but maybe some criticism (aretaic but not deontic).


  Commitments a person might hold:

  (a) Supererogatory acts exist: some acts are good but not required (e.g., donating
  a kidney to a stranger, risking life to save).

  (b) We are never required to do the act with the best overall consequences; morality
  leaves us options.

  (c) Doing the supererogatory act is morally better than doing the merely permissible
  one.

  (d) If A is morally better than B, and both are open to you, there is at least a
  pro tanto moral reason to choose A over B.

  (e) Morality is fundamentally about requirements and prohibitions (duty-centric),
  not about what is admirable.

  (f) We can have reasons grounded in morality to do x without being required to do
  x.

  (g) The supererogatory agent acts on the same kind of reasons as the merely permissible
  agent, just with greater strength of will? Or: supererogation is a matter of cost
  to the agent, not of the action''s goodness.


