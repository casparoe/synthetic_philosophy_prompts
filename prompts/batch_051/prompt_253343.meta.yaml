  Then commitments:


  1. There is a determinate fact of the matter about whether the world as a whole
  is less violent today than before, say 1800 — it is not merely an artifact of which
  definitions or units we adopt. (Realism about the trend.)


  2. For the global trend, the right quantity is the rate: annual risk of violent
  death or serious violent injury for a randomly chosen person, not the raw count
  of victims. Absolute counts mislead because the population has grown. Therefore
  "less violent" should be read per capita.


  3. Nevertheless absolute numbers track something real that rates miss: the total
  amount of bereavement, disability, and destruction. When deciding how much resources
