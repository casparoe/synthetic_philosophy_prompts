  ---


  I’m a journalist working on a piece about the way early modern philosophers thought
  about conceivability as a guide to possibility, and I’ve been trying to work directly
  through a passage in Hume that keeps getting cited but rarely explained. I want
  to be sure I’m not projecting a later modal framework onto it.


  The passage is from A Treatise of Human Nature, Book I, Part I, Section VII, “Of
  abstract ideas”:


  [block quote]


  ’Tis a principle generally receiv’d in philosophy, that every thing in nature is
  individual, and that ’tis utterly absurd to suppose a triangle really existent,
  which has no precise proportion of sides and angles. If this therefore be absurd
  in fact and reality, it must also be absurd in idea; since nothing of which we can
  form a clear and distinct idea is absurd and impossible. But to form the idea of
  an object, and to form an idea simply is the same thing; the reference of the idea
  to an object being an extraneous denomination, of which in itself it bears no mark
  or character. Now as ’tis impossible to form an idea of an object, that is possest
  of quantity and quality, and yet is possest of no precise degree of either; it follows,
  that there is an equal impossibility of forming an idea, that is not limited and
  confin’d in both these particulars. Abstract ideas are therefore in themselves individual,
  however they may become general in their representation.


  I think I see how this supports Hume’s line that abstract ideas are particular images
  doing general work, but I’m puzzled about the modal principle packed into the middle
  of it. Is Hume here endorsing a general inference from clear and distinct conception
  to real possibility, or is he using a narrower claim about what counts as an idea
  at all? If the former, how does he deal with the obvious problem of ideas that are
  clear enough as images but impossible as objects—for example, a mountain without
  a valley, or two touching spheres? If the latter, does the broader conceivability
  thesis actually do any work in his argument about triangles? I’d like a reading
  that distinguishes the local argumentative role this principle plays from the more
  familiar Cartesian version. And since I may be reading Hume too charitably or too
  uncharitably, please indicate which step of your interpretation you are least confident
  in, and what alternative argument or textual consideration would most likely change
  your mind.


