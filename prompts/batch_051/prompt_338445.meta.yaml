  Prompt draft:


  "I''m putting together a unit for a course on rational choice and collective deliberation,
  and I want to teach 12 Angry Men as more than an illustration of social pressure.
  I''d like you to read Sidney Lumet''s film through the lens of information cascades
  and rational herding — the idea that when people decide sequentially and can observe
  earlier choices, a group can tip into a shared course of action even when most members''
  private information, taken on its own, would point the other way, because later
  decision-makers rationally discount their own signal in favor of the accumulated
  evidence they infer from the crowd. I''m interested in a criticism-style reading,
  not a plot summary. Specifically: where in the jury''s deliberations do we see an
  actual information cascade rather than mere conformity, and where do we see the
  cheap-talk, face-saving, or plain exhaustion that the cascade model doesn''t capture?
  Is the initial 11-to-1 guilty vote best understood as a cascade in which private
  scruples were suppressed, and is that a rational inference from the group or a failure
  of nerve? Does Juror 8''s dissent function the way the theory says a public informational
  shock or an early ''break in the herd'' does, and how much of the later movement
  from guilty to not guilty is itself a reverse cascade that rationalizes following
  the new majority?"


