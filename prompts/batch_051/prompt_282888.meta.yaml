  objection I can''t dismiss. Her view is that Truman ordered the bombing of Hiroshima
  and Nagasaki knowing the bombs would kill enormous numbers of civilians, and that
  no future benefit can turn the deliberate killing of noncombatants into something
  a community should honor on a school building. She says a school name functions
  as a standing moral recommendation to children, and that recommending Truman means
  teaching them that innocent people may be used as a means so that others might live.
  She also rejects the usual defense: she says if we would refuse to name a school
  after a general who ordered a city of civilians burned with ordinary bombs, the
  fact that Truman used a new and more terrible weapon should not change the analysis,
  and that the claim that the bombings saved more lives than they took treats a prohibited
  act as if it could be made clean by good results. Another member counters that the
  committee is not a war-crimes tribunal; that Truman faced a choice between the bomb
  and an invasion that might have cost far more lives on both sides; and that a person''s
  whole record, not his worst day, is what we honor. A third member wants to table
  the matter for a public hearing.


  Please draft the short written opinion I will circulate before the vote. It should
  recommend one concrete course of action (name the school after Truman; remove Truman
  from consideration and choose from the district''s backup list, which includes a
  local conservationist and a former teacher; or hold a public hearing before deciding)
