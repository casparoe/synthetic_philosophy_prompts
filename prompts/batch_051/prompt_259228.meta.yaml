  Prompt draft:


  "I am a high school student, and over the past few years I have spent long stretches
  with both my German and American relatives. I have been trying to articulate something
  I keep observing, and I would like an honest assessment of the distinction I have
  been using.


  I have been calling it the difference between ''standing-rule morality'' and ''conscience-review
  morality.'' By this I mean a difference not in first-order values but in the default
  status of a rule once the individual has a moral objection to applying it.


  Standing-rule morality treats the rule''s existence as itself a weighty moral reason.
  What matters is not only that the content of the rule is generally good, but also
  that it is the rule, here, now, for everyone. The fact that I can see a better exception
  in this particular case does not, by itself, authorize me to step outside it. Not
  following the rule has a cost even when the rule is trivial, because compliance
  is a practice that sustains order; and order is treated as a moral good rather than
  merely a convenience.


  Conscience-review morality treats rules as provisional generalizations. A rule has
  authority only insofar as it tracks what the individual, after genuine reflection,
  takes to be right in the case at hand. Under this morality, a person who follows
  a rule against their own considered judgment has failed twice: they have done the
  wrong thing, and they have also offloaded their moral responsibility onto a piece
  of procedure. The hero is the person who quietly says ''not in my case'' and accepts
  the consequences.


  Some examples that made the difference vivid to me: crossing a completely empty
  street against a red light at night; correcting a cashier who gave too much change;
  refusing a small registration fee that the office mistakenly waived; returning an
  abandoned shopping cart because the parking lot rules say to. I noticed that my
  German relatives tended to treat the rule-following in these cases as itself good
  or at least admirable, while my American relatives tended to treat the rule as something
  a thoughtful person should be willing to set aside when it obviously fails the specific
  situation.


  My question is whether this distinction holds up. Is it naming a real difference
  in moral orientation, or am I just dressing up a cultural stereotype? Does it already
  exist under another name that I have not encountered? And where does it break—can
  a standing-rule morality explain why some rules are wrong and should be broken,
  and can a conscience-review morality explain why anyone should follow a rule they
  personally disagree with when coordination with others depends on them following
  it?"


