  the contract is not out of selfishness per se; it''s out of rational fear and desire
  for self-preservation; and Hobbes doesn''t suppose selfishness; he actually denies
  that humans are necessarily evil, etc.

  4. "the sovereign is a party to it" — wrong; the sovereign is instituted by a covenant
  of every man with every man; the sovereign is not a party, so they cannot commit
  injustice to subjects.


