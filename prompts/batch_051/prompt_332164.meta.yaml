  psychological egoist. Some scholars interpret Hobbes as psychological egoist. But
  claiming everyone is driven entirely by self-interest might be debated. But he also
  says that the state of war arises from passions (competition, diffidence, glory),
  and some are "vainglorious" who would not necessarily be called self-interested
  in a narrow sense. A careful answer would say "self-interest" is too narrow/loaded;
  Hobbes''s official view is that people seek their own preservation and whatever
  they judge good; this doesn''t imply they''re incapable of benevolence, and the
  war is compatible with non-selfish people because the problem is structural (mutual
  suspicion, equality, scarcity, glory). We can include "driven entirely by self-interest"
  as overstatement but not wholly wrong. Good.

