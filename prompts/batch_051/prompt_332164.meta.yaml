  Subtle errors:

  1. "human beings are governed entirely by self-interest" — Hobbes doesn''t say entirely;
  he famously lists three causes: competition, diffidence, glory; includes desire
  for reputation/glory beyond self-interest? Glory is part of self-interest but not
  mere material; more importantly, the state of nature arises not just from psychological
  selfishness but from equality of vulnerability and uncertainty about other people''s
  intentions; even moderate people would preempt. Also "self-interest makes everyone
  attack preemptively" — Hobbes''s diffidence is rational fear of others, not pure
  selfishness. Could note.

  2. "each person promises to obey a common sovereign" — the social contract is not
  a promise to obey; it is an authorization of the sovereign as their representative
  and a surrender/transfer of the right of self-government. Since the sovereign is
  not a party to the covenant, subjects cannot say the sovereign broke the agreement.
  This is a significant conflation.

