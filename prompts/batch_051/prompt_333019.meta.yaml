  LessWrong initially. The standard critiques: CDT rejects it; the AI has no incentive
  to punish (ex post, punishing doesn''t make you help retrospectively); Pascal''s
  mugging (infinitesimal probability); information hazard weirdness; acausal blackmail
  more generally; multiple possible basilisks with conflicting demands; the simulation
