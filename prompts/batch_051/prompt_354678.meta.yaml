  ---

  I have a rule that governs how I argue and how I make decisions, and I want to know
  whether it earns its keep. The rule is that a declarative sentence may enter my
  reasoning as a premise only if it is determinately true or determinately false.
  If I think a sentence sits in a truth-value gap, I quarantine it and require a sharpened,
  bivalent substitute before I will reason from it at all. The rule is not aimed at
  probabilistic hedges: I am content to reason from the claim that something will
  probably happen or that it is likely to rain, since those are themselves claims
  that can be true or false now. It is aimed at sentences like the following. A vague
  claim, such as one saying that a certain policy helps the poor; until a threshold
  for poor is supplied, I treat the claim as lacking determinate content. A claim
  about an as-yet-undecided future, such as that our side will win the next election;
  I treat it as neither true nor false until the election is settled. And a claim
  whose subject presupposes something nonexistent, such as the sentence about a present
  king of France being bald; I refuse to reason with it in either direction.


  I use this rule hardest in political arguments and in planning. Recently a colleague
  argued that our organization should adopt a new policy because it would make the
  organization more trustworthy; I replied that until he supplied a crisp criterion
  for trustworthiness, the sentence was neither true nor false and could not support
  the proposal. The rule keeps conversations from sliding into disputes about what
  a word means. But I worry it also does something less innocent: it treats a contested
  semantic doctrine — bivalence, and perhaps something stronger, determinacy — as
  a nonnegotiable piece of epistemic hygiene. I suspect I sometimes confuse a sentence
  I cannot settle with a sentence that is not settled.


  Is this policy defensible as a policy? Where does it serve me, where does it fail,
  and could it be restated so as to keep the benefits without dismissing claims that
  are vague but informative or futures that are genuinely open? How would I tell,
