  knocks out the most popular theories? Maybe the requirement that individual clinician
  uncertainty is insufficient (the "theoretical equipoise" problem) — theoretical
  equipoise (each individual clinician must be exactly balanced) is too fragile and
  would make most trials unethical as soon as the clinician leans slightly; clinical
  equipoise (community uncertainty) is the standard fix. So a desideratum could be:
  the theory must not make a trial''s ethics hostage to one investigator''s hunches,
