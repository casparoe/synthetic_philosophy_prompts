  Clinical equipoise: the idea that a randomized controlled trial is ethical only
  if there is genuine uncertainty in the community of expert practitioners about which
  treatment is better. The "desiderata" would be: what must an adequate theory of
  the ethics of random assignment in clinical research get right? Requirements could
  include:


  - It must explain why randomizing patients between treatments is ever permissible,
  given the clinician''s duty of personal care (the therapeutic obligation). It can''t
  just wave this away.

  - It must distinguish permissible from impermissible randomisation without collapsing
  into either extreme: a blanket prohibition (which would rule out all trials) or
  a licence to randomise whenever a researcher is curious.

  - It must get the right verdicts on the classic problem cases: placebo-controlled
  trials when an effective treatment exists; trials in resource-poor settings; trials
  that continue after interim data shows a trend; surgical trials; n-of-1? Also cluster
  randomized trials.

  - It must explain whose uncertainty matters (the individual clinician''s? the community''s?
  the patient''s?) and why disagreement among experts should or shouldn''t license
  randomising a particular patient.

  - It must say what happens as evidence accumulates: when uncertainty disappears,
  when is it unethical to keep randomising (stopping rules).

  - It must account for the asymmetry between trial arms: in a trial, the patient''s
  treatment is determined by protocol/randomisation, not by their physician''s judgement
  — so any adequate theory must say what happens to the physician''s duty to act in
  the patient''s best interest.

  - It must respect informed consent: consent can''t by itself make an unethical trial
  ethical.

  - It should be consistent with how medical research actually works — e.g., multi-arm
  trials, adaptive designs, pragmatic trials, placebo controls, non-inferiority trials.


