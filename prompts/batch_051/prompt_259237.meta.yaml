  Draft:


  "I''m taking a seminar on Aristotle''s De Anima, and I''ve been trying to make sense
  of what phantasia actually is for him. The standard way the course presents it is
  as a kind of intermediary: it''s distinct from perception and from thought, it is
  a movement produced by actual perception, and it explains how appearances persist
  and go wrong. But every time Aristotle says something like ''the soul never thinks
  without a phantasma,'' I find myself reading it not as a claim about pictures in
  the mind but as a claim about thought needing some sensory-derived medium to work
  on. So I''ve started calling this the ''workspace'' reading: phantasia, on this
  view, is less a picture-show than a buffer or scratch space in which the residues
  of perception are held and manipulated off-line, so that the intellect has something
  to combine, divide, and inspect when the object is absent. Its defining feature
  wouldn''t be image-likeness; it would be availability — the fact that perceptual
  content can be retained and re-activated for cognition. That seems to me to handle
  the hard cases better: it explains why Aristotle insists thought needs phantasia
  even though thought is not a form of perception, and it explains how mathematical
  thought could ''use'' phantasms without literally picturing a triangle. But it might
  also make phantasia too neutral, or too modern. Three things worry me. First, Aristotle
  introduces phantasia partly by its connection to light and appearance, and he says
  it can be true or false — features that suggest something contentful and quasi-perceptual
  rather than a mere buffer. A workspace doesn''t, by itself, misrepresent; so where
  does the falsity come from? Second, abstract and self-reflexive thought: if every
  thought has a phantasma, and phantasmata are residues of perception, what is the
  phantasma when I think about a universal as such, or about thought itself? Third,
  maybe all I''ve done is rename a view that commentators already hold, since I gather
  some people already deny that phantasmata must be mental images. I don''t want to
  claim originality I don''t have. So my question is: is the workspace reading a coherent
  reading of Aristotle''s phantasia, or does it collapse into either of the views
  it''s trying to avoid (phantasia as images, or phantasia as an unexplained placeholder)?
  What does it get right, where exactly does it break, and what are the strongest
  objections — in particular, is any of them fatal rather than just uncomfortable?"


