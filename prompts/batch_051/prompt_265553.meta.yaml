  For years I''ve been trying to explain why some games stay with me long after they''re
  finished while others, however polished, vanish the moment I close them, and I''ve
  settled on a property I call counterfactual texture. I don''t mean replay value
  or the mere presence of branching. A game has high counterfactual texture when the
  options not taken remain alive during and after play -- not as an abstract list
  of "paths I could have picked," but as felt alternatives with their own weight and
  atmosphere, so that the run that actually happened is always ghosted by the run
  that nearly did. A deckbuilder in which the card you passed over keeps defining
  the deck you didn''t assemble; a tactics game in which the flank you refused keeps
  asserting itself as a shape in the negative space of the battle; a narrative game
  in which the conversation you avoided colors the one you had. Low counterfactual
  texture is the strange condition of a hundred-choice open world where each unchosen
  option is so interchangeable that choice never acquires any felt stakes at all,
  because nothing is lost when something is chosen.


  My working claim is that this texture, rather than story, graphics, or even "fun,"
  is a substantial part of what makes games artistically distinctive -- that games
  are unusually good at making counterfactuals themselves into objects of experience,
  and that much of their aesthetic achievement lies there. I know this overlaps with
  talk about agency as the medium of games and with the thought that interactivity
  itself can be expressive; I''m trying to get one step more specific.


