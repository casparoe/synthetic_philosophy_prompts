  The missing check is not among them. If causes have to be happenings — events, states,
  objects doing things — then a missing check cannot be a cause, because it is not
  a happening at all. It is an absence. But engineering practice treats absences as
  first-class causal factors. It is not a metaphor or a polite simplification when
  an incident report lists "no validation of the user ID at the gateway" as the root
  cause of a breach.


  I understand that philosophers call this family of issues causation by omission.
  The obvious first move is to say that causal claims track counterfactual dependence:
  the failure occurred because the code did not contain the check, and if the check
  had been present, the failure would not have occurred. This has the advantage of
  cleaning up the ontology. Causation lies in a certain kind of dependency between
  possibilities, not in physical contact. A missing check can be a cause because the
  world is one way and would have been another way if the check existed.


