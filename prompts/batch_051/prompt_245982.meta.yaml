  **Causation and the missing null check**


  I spend a large part of my working life in postmortems. When a service goes down,
  we reconstruct the sequence that led to the failure. Sometimes the culprit is an
  instruction that executed: a function dereferenced a variable that happened to be
  null. But often the moment we actually point to is an instruction that never executed
