  I cover science and ideas for a general-interest magazine, and I''m working through
  a piece about long-run forecasts that miss their dates but still seem to contain
  a live mechanism. I''ve been reading Malthus''s 1798 Essay on the Principle of Population,
  and this passage from chapter 1 has stayed with me:


  "The most important argument that I shall adduce is certainly not new. The principles
  on which it depends have been explained in part by Hume, and more at large by Dr
  Adam Smith. It has been advanced and applied to the present subject, though not
  with its proper weight, or in the most forcible point of view, by Mr Wallace, and
