  Let me verify moral-theory details from memory to write accurately:


  - The demandingness objection: Consequentialism (especially maximizing act consequentialism)
  requires agents always to perform the act that produces the most good (impartially
  considered). Because there is (almost) always more good one could do (e.g., donating
  to effective charities rather than buying luxuries), complying with consequentialism
  would require forgoing almost everything that isn''t optimal: expensive dinners,
  hobbies, time with family (if that time could do more good elsewhere), career choices,
  etc. Thus consequentialism is "excessively demanding": it leaves no room for partiality,
  personal projects, and ordinary human life. So it is at odds with widely held beliefs
  about permissible partiality.


  - Williams'' integrity/alienation objection: separate. Williams says utilitarianism
  alienates agents from their deep projects/commitments (called "ground projects"),
  the things that give life meaning and ground their integrity. "One thought too many":
  a man who must choose between saving his wife and saving two strangers and who had
  to think through impartial calculation betrays the relationship. The objection isn''t
  that the theory demands too much quantitatively; it''s that its impartial maximizing
  structure conflicts with integrity and proper personal motivation. Actually Williams
  has both themes, but integrity is specifically about alienation, not demandingness.
  Good subtle conflation target.


  - Singer''s drowning child / Famine, Affluence, Morality: shows that ordinary lives
  are far from what impartial beneficence demands. Singer himself embraces demandingness
  ("the conclusion is not too demanding... it''s the way we live that''s mistaken").
  Peter Singer argues moderate principle; he doesn''t think it refutes the theory.


  - Responses to demandingness: Scheffler''s agent-centered prerogative (allows partiality);
  satisficing consequentialism (Slote? Actually Michael Slote and others; satisficing
  consequentialism: enough vs. best); rule consequentialism (Brad Hooker) reduces
  demands but still may demand a code that, if internalized, is...; scalar consequentialism
