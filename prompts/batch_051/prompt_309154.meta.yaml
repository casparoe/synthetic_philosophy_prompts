  Possible prompt:


  "Hey—I''m a PhD student in phil mind, mostly working on introspection, and I''ve
  been trying to write down the set of commitments I actually have before I go presenting
  this stuff in our lab meeting. I keep feeling like the pieces fit together, but
  I want someone to audit the package rather than reassure me.


  Here''s where I''ve landed:


  1. First-person authority: if someone sincerely judges ''I''m in pain right now''
  or ''I believe the shop is closed'', that judgement has a strong default in favor
  of its truth, the way a third-person ascription doesn''t. Not that it''s infallible—just
  that there''s an asymmetry.

  2. I also buy something Evans-y about belief self-ascription: you answer ''Do you
  believe p?'' by looking out at whether p is the case, not by inspecting some inner
  box. Belief just isn''t the sort of thing you find by introspecting.

  3. But I also accept an anti-luminosity thesis along roughly Williamsonian lines:
  there is no conscious state such that, whenever you''re in it, you''re automatically
  in a position to know you''re in it. For any state, there are borderline or in-between
  cases where you''re in it but can''t reliably tell.

  4. For current bodily sensations, though, I have a hard time giving up the old idea
  that there''s no gap between appearance and reality. If it seems to me that I''m
  in pain, that seeming is the pain; and a pain couldn''t fail to present itself as
  pain. So for sensations, seeming and being coincide in both directions.

  5. I think introspection is basically a form of attention to one''s own ongoing
  experience. But attention changes what it attends to: attending to a pain ramps
  it up or changes its character, attending to an afterimage keeps it around, and
  so on. So introspection isn''t a neutral readout.

  6. Methodologically, I think careful introspective reports should serve as pre-theoretic
  data in psychology and cognitive science, even though they''re defeasible and corrigible.


  So: does this package hang together? Which commitments are actually pulling against
  each other, and which only look like they are? Rank the tensions by severity, and
  tell me the cheapest single revision that makes the whole thing coherent. Don''t
  just tell me they''re all compatible—if I''ve got a gremlin in there, I want to
  know."


