  Let me brainstorm a belief set for a philosophy of mind PhD student working on introspection.
  Domain: reliability of introspection.


  Possible commitments:

  1. First-person authority: for a range of our current conscious states, our sincere
  first-person present-tense avowals are strongly privileged — if I sincerely judge
  that I''m in pain, that''s strong (even if defeasible) evidence that I''m in pain.

  2. Anti-luminosity (Williamson): no conscious state is luminous in the strong sense:
  there are no mental conditions C such that whenever C obtains, one is in a position
  to know that C obtains. So there can be cases where one is in a state but cannot
  know it, because knowledge requires safety/margins for error.

  3. Introspection''s reliability is not a brute fact; it''s explained by the transparency
  of belief: when I''m asked whether I believe that p, I answer by considering whether
  p, not by looking inward (Evans). (This explains reliability for beliefs, less naturally
  for sensations.)

  4. Phenomenal states (like pain) are ones I can''t be wrong about in the same way
  — maybe I accept a strong infallibility intuition about current phenomenology: if
  it seems to me that I''m in pain, I am in pain (or at least, there''s no gap between
  appearance and reality for sensations).

  5. Introspection is a form of attention: attending to an experience can alter it
  (e.g., attending to pain makes it worse; introspection doesn''t just register but
  shapes). Yet I also want introspection to be our most direct source of evidence
  about experience.

  6. Methodological: I hold that introspective reports should be treated as data in
  cognitive science, but not as incorrigible data; and that our capacity for introspection
  was shaped by evolution, which gives a debunking worry about its reliability in
  revealing the nature of consciousness. Maybe too much.


  Let me think of tension: (1) first-person authority/present-tense avowals vs anti-luminosity.
  If anti-luminosity says no state is such that being in it puts you in a position
