  Let me write as a PhD student in philosophy of mind/cognitive science.


  Beliefs to list:

  (a) First-person authority: our sincere present-tense self-ascriptions of current
  conscious states (e.g., "I''m in pain", "I believe the meeting is at noon") have
  a presumption of truth that third-person ascriptions lack; if I sincerely judge
  that I''m in pain, that''s normally enough to know I''m in pain.

  (b) Anti-luminosity: no conscious condition is luminous — for any mental state S,
  there are borderline cases where one is in S but not in a position to know one is
  in S; knowledge requires that one couldn''t easily have been wrong.

  (c) Introspection as attention: introspecting an experience is a matter of attending
  to it, and attention alters what it attends to — e.g., attending to the pain makes
  it more intense or changes its character. Call it "interventionist introspection."

  (d) Phenomenal seemings are infallible: when it comes to one''s own current phenomenology,
  there''s no gap between appearance and reality: if it seems to me that I''m in pain,
  I am in pain (the seeming just is the state, at least for bodily sensations).

  (e) Introspective reports are data: scientific psychology should treat careful introspective
  reports as pre-theoretic data about conscious states, even though they aren''t incorrigible.

  (f) Transparency of belief: I can answer "Do you believe that p?" by considering
  whether p is true, not by inspecting an inner state; this is why self-ascription
  of belief is authoritative without an inner gaze.


