  of them. The case for the view is systematic. Given the causal closure of the physical
  domain, every physical event has a sufficient physical cause; if a felt quality
  were an additional, distinct cause of my wincing or my saying that it hurts, it
  would either overdetermine the physical outcome or violate closure. The exclusion-style
  argument leaves no work for the experience itself to do. The view honors both the
  reality of consciousness and the unbroken causal sufficiency of physics, and it
  does so without the conceptual strain of claiming that the experience is exhausted
  by its functional role.


  And yet. When I stub my toe and judge, immediately and with utter conviction, that
  I am in pain, it does not merely seem that the pain accompanies the judgment; it
  seems that the pain itself is what makes me judge it, that my access to my own experience
  is precisely a matter of the experience reaching into my cognitive life. If epiphenomenalism
  is true, that appearance is systematically false. The judgment is produced entirely
  by neural processes that would produce the same judgment even if the felt quality
  were absent or different. The flavor, on this picture, never gets to leave the tip
