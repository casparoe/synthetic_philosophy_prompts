  Thesis: I''m defending the claim that Hume''s argument against believing violation-of-nature
  testimony — often summarized as a uniformity-of-experience argument — is best reconstructed
  not as a bare induction from past experience but as an equilibrium condition on
  rational testimony-based belief: one should not accept testimony for an event if
  doing so would require a larger revision of one''s background beliefs than rejecting
  the testimony would. On this reading, Hume does not claim miracles are impossible
  or that testimony can never establish them; he claims that in the actual world the
  testimonial case for a miracle has never been strong enough, because a miracle report''s
  antecedents are always weaker than the uniform regularities it would overturn. My
