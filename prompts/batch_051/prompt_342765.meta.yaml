  Moore''s paradox: "p, but I don''t believe that p" (the omissive form) and "p, but
  I believe that not-p" (the commissive form). The paradox is that these are not contradictions
  (they could both be true), yet asserting them is absurd (Moore''s paradox). Wittgenstein
  emphasized that "p" and "I don''t believe that p" can both be true, but the assertion
  is "absurd" — the speaker in some sense contradicts herself in the act of asserting.
  There''s a large literature: knowledge version (p but I don''t know that p) is also
  defective; these are "Moorean absurdities." Third-person and past-tense versions
  are fine.


