  I''ve been down a rabbit hole of methodology-of-philosophy discourse lately — the
  one man''s modus ponens is another man''s modus tollens slapfights, the x-phi people
  saying the whole intuition database is WEIRD undergrad noise, the reflective equilibrium
  defenders saying that''s the best we can do and everyone else is just in denial.
  I''ve come away convinced that everyone involved is running a private, unstated
  policy about when an intuition about a case is evidence and when it''s just a confound
  you''re allowed to ignore. Before I read another word on this, I want the desiderata.
  What does any adequate account of how to weigh intuitions about principles against
  intuitions about particular cases have to do? Not the full theory — the checklist
  it has to pass, with the case or consideration behind each item.


  Here''s my current list of things I suspect have to be on it; tell me which are
  real requirements and which are me smuggling in my own taste:


  - It has to answer the modus ponens/modmodus tollens asymmetry without begging the
  question: when does a case refute a principle, and when do you keep the principle
  and bite the bullet on the case? It can''t just say "weigh them" — that''s the problem
  restated.

  - It has to respect transitivity (or explain why apparent failures of it don''t
  count) without ruling out every spectrum-style case by fiat. If your account can''t
  handle a chain of pairwise plausible judgments that jointly violate transitivity,
  it''s not an account of evidence, it''s a filter that only lets in cases you already
  like.

  - It has to say what simplicity actually does for you. How much worse coverage is
  a simpler principle allowed to buy, and why isn''t "simpler" just a knob you turn
  to keep whichever principle you walked in with?

  - It has to stop double-counting. If a principle earned its plausibility from a
  bunch of case intuitions, you don''t get to later cite the principle as independent
  evidence against those same cases. But it also can''t go so far that no principle
  ever gets to correct a case, or principles become epiphenomenal — so the account
  owes a story about how a principle becomes earned evidence rather than a summary
  of its instances.

  - It has to handle disagreement without laziness. Two people share the same case
  judgments but extract different principles, or share a principle but report different
  case judgments; the account has to say what''s going wrong and who (if anyone) is
  failing, without just asserting that one side''s intuitions are the reliable ones.

  - It has to be compatible with the boring fact that case intuitions are produced
  by heuristics and get pushed around by framing, order, affect, and demography. It
  can''t conclude from that that philosophy has no data, and it also can''t pretend
  all intuitions are equal.

  - It has to explain how progress is possible. If the account makes every standoff
  between principles and cases a matter of taste, it''s failed as an account of evidence.


