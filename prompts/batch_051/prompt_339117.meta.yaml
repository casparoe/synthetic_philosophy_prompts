  and how do you stop ''simpler'' from just meaning ''the one I''m used to''."

  4. Double-counting / provenance: if principle built from cases, can''t use it as
  independent evidence against those cases.

  5. Disagreement: must say what to do when people share cases but not principles
  or vice versa, without stipulating whose intuitions are correct.

  6. Cognitive origin constraint: must be compatible with intuitions being heuristic
  outputs (affect, framing, order effects, WEIRD demography), and must specify when
  those origins debunk vs don''t.

  7. Not collapse: must avoid both "no data" quietism and "everyone''s intuitions
  count equally" relativism; must explain how progress is possible.


