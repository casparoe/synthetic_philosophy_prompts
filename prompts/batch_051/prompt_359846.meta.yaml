  thing. It''s that when I disagree with someone on my own side, I see the full chain
  of reasoning, because I''m the intended audience. When I disagree with the other
  side, I only ever see whatever fragment gets screenshotted and passed around. So
  most of what reads as "bad faith" is really just a reconstruction gap. The prior
  should be heavily weighted toward good faith.


