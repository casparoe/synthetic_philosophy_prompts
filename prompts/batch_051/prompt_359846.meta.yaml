  you''re missing context. Do that enough and you can never update on bad behavior
  at all, no matter how much of it piles up. That''s not charity, it''s refusing to
  do inference.


  (3) T: Not immune to evidence, just conservative. And the reason for the conservatism
  is that the evidence on the other side is systematically one-sided in a predictable
