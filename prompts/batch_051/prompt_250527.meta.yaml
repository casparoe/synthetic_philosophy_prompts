  Actually, there''s a subtle argument in the centipede game: backward induction assumes
  common knowledge of rationality, but if you''re at a late node, you have evidence
  that the other player is not rational (otherwise you wouldn''t be there), so the
  premise "we have common knowledge of rationality" is false conditional on being
  at a late node. Therefore backward induction''s prediction only holds over the ex
  ante plan, but it can''t be used to decide at reached nodes: at a reached node,
  you know something inconsistent with CKR, so you won''t defect. This is the "BI
  paradox" with "knowledge of rationality" and the problem of updating on off-path
  nodes. Good.


