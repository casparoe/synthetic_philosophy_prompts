  ---


  I''m a linguistics grad student, and for the last few months our reading group has
  been going in circles on a debate in typology that I''m starting to suspect isn''t
  really about what it says it''s about. The question is whether grammatical categories—things
  like noun, verb, adjective, subject, case (dative, ergative, genitive), and even
  preposition—are natural kinds: real, language-independent categories that linguists
  discover, sort of like chemical elements, or whether they''re just useful labels
  we impose, with every language carving the space up a bit differently. The data-focused
  people keep pointing to languages where the usual categories get messy (languages
  without a clear adjective class, "case" markers that do discourse-structure work
  rather than marking argument roles, prepositions that behave like verbs). The theory-focused
  people respond that messiness at the surface doesn''t mean there''s no underlying
  category, any more than variation in what counts as a chair refutes the existence
  of furniture. And then we''re stuck, because nobody disputes the facts; they dispute
  what the facts are facts about.


  My working hypothesis is that the two sides are using "category" to mean different
  things, and the whole argument is being kept alive by a false choice between two
  ideas that are both true: there are language-particular descriptive categories,
  and there are cross-linguistic comparative concepts that the analyst picks partly
  for convenience, and the mistake is expecting the second to be a natural kind that
  explains the first. But I might be smug, so I''d like a honest diagnosis. Is this
  debate substantive, verbal, methodological, or a disagreement about what counts
  as an explanation in linguistics? And given the diagnosis, is there anything that
  would actually count as progress—a distinction that dissolves it, a formal criterion,
  a data set, or a reason to think it''s just not a well-posed question? I don''t
  want a survey; I want the structure of the impasse.


