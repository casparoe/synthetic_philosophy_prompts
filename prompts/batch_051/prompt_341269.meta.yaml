  "In my Philosophy of AI course we have been looking at the proposal that safety
  could be achieved through debate: two language-model debaters argue opposite sides
  of a question, and a human judge — who is less knowledgeable than either debater
  — decides who wins, the idea being that any flaw the judge misses would be exposed
  by the opposing debater. Our lecturer introduced ''obfuscated arguments'' as a limit
  case. The worry, as I understand it, is that for some questions the honest side''s
  strongest case depends on a long calculation, a fragile statistical argument, or
  a proof whose steps the judge cannot check, while the dishonest side can offer a
  shorter, intuitively compelling but unsound story. Since the judge cannot tell the
  unverifiable true argument from the plausible false one, and the honest debater
  may be unable to make the truth more transparent than it really is, cross-examination
  cannot settle the matter.


  Could you explain, as a philosopher working on AI alignment, exactly what conceptual
  work the debate proposal requires from its judge and why obfuscated arguments are
  thought to defeat it? Please start by brainstorming, as precisely as you can, the
  background assumptions that would have to hold for debate to track truth; then explain
  where obfuscation breaks those assumptions; and finally discuss whether the problem
  is best understood as a limitation of the judge''s cognitive capacities, a feature
  of certain questions, or an asymmetry between truth and falsehood. I would prefer
  the answer in British English, and please avoid vague appeals to ''human oversight''
  or ''alignment'' unless you can tie them to the specific mechanism of debate."


