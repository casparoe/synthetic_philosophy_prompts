  Draft:


  "I am a biology graduate student, and last month at a family dinner my brother-in-law
  dismissed evolutionary theory as unfalsifiable, citing Popper''s famous early verdict
  that Darwinism is less a testable scientific theory than a metaphysical research
  programme. I started trying to write a response for my own clarity, and the response
  has grown into an argument of my own that now worries me because it seems to prove
  too much. Here is the argument as I now have it:


  (1) A system of claims is scientific only if it forbids at least some observation
  statements, where an observation statement P is forbidden just in case the system
  entails not-P.


  (2) Darwinian explanations of particular traits have this form: a trait was retained
  (or spread) because, in the relevant ancestral circumstances, organisms with it
  left more descendants than organisms without it.


  (3) Whenever a particular Darwinian explanation of this form meets contrary evidence
  — say, the trait turns out not to be heritable, or the proposed selective advantage
  disappears when measured, or the presumed ancient environment looks wrong — a Darwinian
  can save the explanation by revising the auxiliary assumptions about past environments,
  population structure, pleiotropic costs, or what counts as the relevant trait.


  (4) A claim of the form in (2), protected by the revision strategy in (3), forbids
  no observation statement; there will always be an admissible adjustment that absorbs
  the apparent refutation.


  (5) Therefore Darwinian explanations of particular traits are unscientific by the
  criterion in (1).


  (6) The same description applies to central frameworks throughout the historical
  and physical sciences: plate tectonics absorbs an anomalous fossil distribution
  by adjusting assumptions about vanished land bridges or submerged continents; Newtonian
  mechanics absorbed an anomalous orbit by postulating a then-unseen planet; radiometric
  dating absorbs a discordant date by adjusting assumptions about contamination or
  closed-system behavior.


  (7) So the falsifiability criterion entails that plate tectonics, Newtonian mechanics,
  and radiometric dating are not science in exactly the same way that Darwinism is
  not.


  But I do not want to affirm (7), nor do I want to give up the conviction that Darwinian
  explanations are scientific. I also find (1) attractive, because it seems to capture
  why astrology or creationism, which can be made compatible with any evidence, are
  not science. I would rather reject (4) or (5) than give up (1), but I cannot see
  how to do it cleanly, since (4) appears to be doing all the work. Which step in
  the chain should I reject, and what exactly does rejecting it cost me?"


