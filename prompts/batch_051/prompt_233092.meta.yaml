  No-free-lunch theorem (Wolpert & Macready): For two algorithms, averaged over all
  possible functions (or under uniform distribution over objective functions), their
  performance is the same. Thus no algorithm is universally better than any other;
  any advantage on one class is balanced by disadvantage elsewhere. Standard responses:

  - Real-world objective functions are not uniformly distributed (we care about a
  restricted set).

  - Priors/inductive biases (simplicity, smoothness, locality, compositionality) are
  necessary and justified by the structure of the world or by evolution.

  - NFL is about average over all functions, so it doesn''t preclude ranking on specific
  problems; also finite sample / cross-validation issues maybe.

