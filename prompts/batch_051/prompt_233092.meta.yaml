  Draft:


  "I''m a software engineer with no training in philosophy, and I work enough with
  machine learning that the no-free-lunch theorem is part of my mental furniture.
  I understand it roughly as: averaged over all possible target functions, every learning
  algorithm has the same expected performance, so any advantage on one class of problems
  is paid for by disadvantages elsewhere. I see people connect this to the problem
  of induction, but I''d like to sort out the responses.


  I''ve collected five standard moves people make when they hear ''no-free-lunch means
  induction is baseless,'' and I don''t need any of them restated:

  (1) The premise is irrelevant: real-world functions are not drawn from a uniform
  distribution over all functions; the wild functions that dominate NFL averages essentially
  never occur.

  (2) The theorem says nothing about a fixed problem: averaged over all problems performance
  is equal, but on the particular problem class you actually care about, one algorithm
  can simply beat another.

  (3) Inductive bias is unavoidable: the right reading is not ''assumptions are illegitimate''
  but rather that you can''t generalize without assumptions at all; any induction
  presupposes some regularity, and the only question is which biases are well-matched
  to your world.

  (4) Our priors are not arbitrary because evolution has shaped our sensory and cognitive
  machinery to the structure of the world, so we don''t start from zero.

