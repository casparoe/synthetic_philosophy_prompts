  I am a retired evolutionary biologist, and I have come to hold a view that I would
  like you to test as rigorously as you can. The view is that cultural variants are
  literal replicators: that talk of memes is not a metaphor but a claim about a second
  substrate on which Darwinian evolution runs.


  By a replicator I mean an entity of which copies are made, where three conditions
  hold. First, copying is accurate enough that offspring resemble their parents more
  than they resemble randomly chosen members of the population. Second, copying errors
  are themselves copied, so variation is heritable. Third, differences among variants
  affect how many further copies get made. A gene satisfies all three. My claim is
  that many cultural items — a story, a recipe, a boat-building technique, a musical
  phrase, a turn-taking norm — satisfy them as well, and that cumulative cultural
  change is best explained as the differential copying of these variants. I do not
  claim that cultural copying has the fidelity of DNA replication; I claim only that
  its fidelity is sufficient, relative to the strength of selection, for selection
  to operate. I do not require cultural variants to be particulate in the strict Mendelian
  sense, and I concede that cultural items merge, blend, and recombine more readily
