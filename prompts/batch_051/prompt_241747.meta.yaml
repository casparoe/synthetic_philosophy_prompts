  ---

  I am a retired evolutionary biologist, and I have come to hold a view I would like
  you to pressure-test: cultural variants are literal replicators, and talk of memes
  is not a metaphor but a claim about a second substrate on which Darwinian evolution
  runs.


  Let me state the position as precisely as I can. By a replicator I mean an entity
  of which copies are made, where (i) copying is accurate enough that offspring resemble
  their parents more than they resemble randomly chosen members of the population,
  (ii) copying errors are themselves copied, and (iii) differences among variants
  affect how many further copies get made. A gene satisfies all three. My claim is
  that many cultural items — a story, a recipe, a boat-building technique, a musical
  phrase, a turn-taking norm — satisfy them too, and that cumulative cultural change
  is best explained as the differential copying of these variants. I do not claim
  cultural copying has the fidelity of DNA replication; I claim only that its fidelity
  is sufficient, relative to the strength of selection, for selection to work. I do
  not require cultural variants to be particulate in the strict Mendelian sense, and
  I concede that many cultural items merge, blend, and recombine more freely than
  alleles do. My claim is that these are differences of degree within a common replicator
  framework, not a difference in kind.


  The rival I keep meeting says that this is precisely where the analogy fails: that
  cultural transmission is not copying of a variant at all, but reconstruction by
  a learner from incomplete cues against a shared cognitive background — the way a
  child does not copy sentences but builds a grammar. On that view, what recurs is
  not a lineage of copied variants but a recurring attractor: a stable end-state produced
  independently on each occasion by similar minds in similar environments. Selection,
  to the extent the word applies, would act on these attractors only indirectly, and
  many standard results about cumulative adaptation would not carry over.


  I want an honest map of what would count against my view, sorted by how decisive
  it would be. In particular:


  First, which empirical findings about how people actually transmit techniques, conventions,
  or representations would be effectively incompatible with the replicator claim,
  and which would be merely awkward? I am thinking of things like evidence that imitation
  is systematically biased or transformative rather than faithful, that cultural items
  are routinely reinvented rather than inherited, or that transmission chains converge
  on a canonical form regardless of initial variant.


  Second, which of the three conditions I listed (resemblance, heritable error, fitness
  differences) is my view most exposed on, and what would the world have to look like
  for that condition to fail? I want failures that are live possibilities, not merely
  logically possible ones.


  Third, have I already insulated the view into unfalsifiability by making fidelity
  relative to selection, by allowing blending, and by retreating to the claim that
  selection can act on fuzzy lineages? I would like to know whether those qualifications
  are principled or whether they leave the position at risk of nothing.


  Fourth, what does the replicator view predict that the reconstruction view does
  not, and what observation or experiment would most cleanly separate them? If the
  answer is that no clean observation separates them, I want to hear that said directly,
  along with what follows for the claim that meme is more than a metaphor.

