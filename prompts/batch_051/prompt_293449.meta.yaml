  the starting point. The self is a strange loop in representational/subcognitive
  systems: symbols in the brain refer to each other and eventually to the whole system''s
  representing activities, creating an "I" symbol that plays a role in its own processing.

  - The self is real but as a pattern, like a tornado or a wave; it has causal purchase
  because the symbols participate in the system''s dynamics.

