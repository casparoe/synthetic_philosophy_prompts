  symbolic representation of its own states/processes; (2) the loop must be realized
  over time within a persistent, self-monitoring system; (3) the system needs to be
  embedded in a world and have a point of view / goals, maybe memory and continuous
  identity; (4) a certain causal integration between the "I" symbol and the processes
  it refers to.


