  Let me draft carefully:


  I have been working on a small theory I call mnemonic camouflage, and I would like
  an honest assessment of whether it is a real distinction or just a tempting metaphor.


  The core claim is this. An idea becomes hard to remember and hard to transmit, not
  necessarily because it is false, complex, prohibited, or uninteresting, but because
  the content of the idea directs attention to something that ordinary cognition is
  optimized to bypass: an absence, a slow background trend, a counterfactual, or some
  other state that has no event-shaped episode. Holding such an idea in mind requires
  repeatedly re-establishing an attentional frame that the mind has no standing incentive
  to maintain, so the idea loses the competition for rehearsal even when everyone
  involved would agree, if prompted, that it matters. My two standard examples: a
  team that rehearses drills for a specific disaster keeps failing to act on the fact
  that the real risk is the slow decay of the drills themselves, because the decay
  is a non-event spread across months rather than a scenario that can be imagined
  in a vignette. And after a near miss, the lesson that luck rather than design carried
  the day tends to vanish from institutional memory, because what needs to be remembered
  is the absence of a cause of failure, and absence does not furnish a retrievable
  image. I also have a tentative prediction: such ideas spread only when they can
  attach themselves to something vivid and positively valenced — a slogan, a mascot,
  a named hero — which acts as a carrier and pays the transmission cost the idea itself
  cannot pay.


  What I want to know is whether this is coherent enough to be more than a metaphor.
  Does it already exist in some more precise form under another name? And where does
  it break: what kinds of forgetting or ordinary poor communication does it wrongly
  count as camouflage, and what would need to be true for the mechanism I am describing
  to be distinguishable from the banal fact that non-events are harder to notice than
  events?


