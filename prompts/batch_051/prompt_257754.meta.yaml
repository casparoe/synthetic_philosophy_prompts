  But there''s a subtlety: the prompt itself contains a summary; the model must audit
  it. I need to make sure the summary is accurate about Plato''s argument. Let me
  recall Plato''s Republic Book II:


  Glaucon wants Socrates to praise justice for its own sake, not for its consequences.
  He distinguishes three kinds of goods: (1) things we value only for themselves (e.g.,
  joy), (2) things we value for themselves and their consequences (e.g., sight, health),
  (3) things we value only for their consequences (e.g., medicine, exercise). Glaucon
  places justice in the third class as commonly practiced — valued as a necessary
  evil, for its consequences (avoiding punishment, social contract). He challenges
  Socrates to show justice is in class (2). Then he gives the "origin and nature of
  justice": people agree not to harm each other because they can''t get away with
  injustice without suffering worse; justice is a compromise. Then the ring of Gyges
  thought experiment: a shepherd finds a ring that makes him invisible, uses it to
  seduce the queen, kill the king, and seize power. Glaucon''s point: if a just man
  and an unjust man both had the ring, they''d act the same; no one is just willingly,
  only under compulsion. Finally he contrasts the completely unjust man who has a
  reputation for justice with the completely just man who has a reputation for injustice,
  to argue the unjust life is better.


  So a fair summary would capture: Glaucon is not endorsing the view himself but is
  reviving a common view (Thrasymachus'' challenge) for Socrates to refute; he distinguishes
  the classes of goods and asks Socrates to show justice is valued for its own sake;
  justice is a compromise/contract among equals; the ring shows no one is just willingly;
  the thought experiment abstracts from reputation (the whole point of perfect reputation
  assignment).


  Subtle misrepresentations could include:

  - Saying Glaucon himself believes justice is only a compromise and that the unjust
  life is better (in fact he presents it as the view he wants refuted and says he''s
  perplexed).

  - Conflating the ring showing "people are only moral from fear of punishment" with
  "morality is entirely based on fear" — Glaucon''s claim is conditional: given the
  power to act unjustly with impunity, a person would behave like the unjust; justice
  is practiced unwillingly, for its consequences. The summary could overstate: "everyone
  is secretly a psychopath" or "no one has any regard for justice for its own sake."

  - Presenting the invisibility as removing consequences, but the summary could say
  the ring "tests whether we''d be moral if we could get away with it" — that''s fair.
  A subtle error: "Glaucon says the just man with the ring would do exactly the same
  things as the unjust man" — actually Glaucon says both would come to the same end;
  yes. Hmm.

  - Another subtle error: conflating justice with legality or morality in general.
  The Greek dikaiosynē is justice/righteousness. Fine.

  - Saying "Glaucon claims the ring of Gyges proves that justice is only instrumentally
  valuable" — Glaucon doesn''t claim proof; he offers it as evidence/presumption in
  favour of the view that no one is just willingly. The conclusion drawn from the
  summary might be "therefore justice has no intrinsic value and the immoralist is
  right" — which doesn''t follow even from the accurate parts (from "people, as a
  matter of fact, would not be just with the ring" it doesn''t follow that "justice
