  Here is an asymmetry in ordinary moral judgment that I would like you to examine
  closely. Consider two cases with the same basic structure. In the first, a private
  citizen deliberately breaks a promise, or tells a falsehood to someone who trusted
  her, because she judges that this is the only way to prevent a serious harm to a
