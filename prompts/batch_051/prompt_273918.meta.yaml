  the only way to prevent a serious harm to the public. The harm is prevented, and
  the breach later comes to light. In the private case, ordinary judgment is, on the
  whole, single: we say the citizen wronged the person she deceived, that the good
  outcome does not cancel the wrong, and that a third party who refused to take on
  the wrong in the first place would have been entitled to keep her hands clean. In
  the public case, ordinary judgment divides: we are inclined to say the official
  did what the office required and that an official who would not dirty her hands
  in this way was putting her own purity above those she was elected to protect, even
  though we may still want to say that something morally significant was lost. In
  the private case, the wrongdoing damns; in the public case, it earns a kind of admiration,
  and the refusal to do it earns contempt.


