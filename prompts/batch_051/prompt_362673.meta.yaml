  Classic Bertrand''s paradox:

  - "Consider an equilateral triangle inscribed in a circle. Suppose a chord of the
  circle is chosen at random. What is the probability that the chord is longer than
  a side of the triangle?"

  - Method 1 (random endpoints): choose two random points on circumference; chord
  length > side iff the arc between them is > 120°, probability 1/3.

  - Method 2 (random radius/radial direction): choose a random radius, choose random
  point along radius; chord perpendicular to radius at that point; chord longer than
  side iff point lies within half the radius of center, probability 1/2.

  - Method 3 (random midpoint): choose a random point in the interior; chord with
  that midpoint; longer than side iff midpoint lies within circle of radius r/2, area
  ratio 1/4.


  Activity idea: split into three or four teams; each team gets a different physical
  process that instantiates "random chord":

  - Team A: drop a long straight rod (or throw a tiny stick) onto a circle and call
  the intersection a chord? Hmm.

  - Team B: choose a random point and draw a chord perpendicular to the radius.

  - Team C: choose two random points on the circumference using a spinner.

  Each team bets (with fake money or small stakes) on whether the chord is longer
  than the inscribed equilateral triangle''s side, at fair odds they compute. Then
  teams meet and find they assigned different probabilities to the same event. Argument
  ensues. Debrief: "random chord" isn''t a single distribution; principle of indifference
  says equal probabilities over "possibilities", but possibilities are not given —
  parametrisation matters.


