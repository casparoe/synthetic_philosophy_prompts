  I''ve been poking at Nietzsche''s essay on the uses and disadvantages of history
  for life after a reading group made it through the second Untimely Meditation, and
  I keep wanting to add a category to the usual three. As I understand them: monumental
  history gives you models of greatness to emulate, antiquarian history preserves
  and cherishes the inherited past as something that''s yours, and critical history
  drags the past before a tribunal and condemns it so you''re free of it. They all
  serve life, but each serves a different kind of person/situation.


  I''ve been calling my addition "runbook history" (or sometimes "incident-response
  history"). It''s not about admiring great individuals, preserving a heritage, or
  condemning the past. It''s treating the past as a queryable database of roughly
  repeatable situations — like reading old cases the way an operator reads postmortems,
  not to imitate the people involved but to extract templates for how systems behave
  under pressure. So: a debt crisis, a movement that ate itself, an institution that
  survived a succession crisis, a technology that looked silly until it wasn''t. You
