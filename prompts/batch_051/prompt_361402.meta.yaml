  Let me think about combining "superrationality" with procedure. Superrationality
  is interesting: the idea that in symmetric games (like one-shot Prisoner''s Dilemma
  between two identical rational agents), the rational move is to choose the action
  that would be optimal if it were chosen by all symmetric players — because if you''re
  truly similar, the other will reason the same way. It''s a distinctive middle ground
  between self-interested rationality and altruism. A practitioner could use it as
  a tie-breaking principle for "what should I do when my action will be mirrored by
  others like me." E.g., an industry consortium? A regulator? A platform company deciding
  whether to adopt a costly safety measure when all competitors face the same choice?


