  an acquisition decision where competitors don''t face the same choice, or a marketing
  campaign where causal effects matter.


  But wait: superrationality is usually about cases where an agent''s action has no
  causal effect on counterparts but their decisions are correlated through similarity
  of reasoning. The anti-fraud adoption among competitors has actual causal/market
  effects (first-mover advantage, competitor reactions). For superrationality to apply,
  the payoffs should depend on others'' actions without direct communication/causal
  influence on their choice of the same action. Maybe a better setting: "standards
  adoption" or "public goods" where each firm''s contribution has negligible causal
  effect on others'' payoffs but if all reasoning is symmetric, each should contribute
  as if choosing for all.


  Classic superrational scenario: two prisoners separately asked to cooperate/defect,
  each identical rational. In the payments setting, maybe "whether to share data to
  a common fraud database" — each firm''s contribution helps the commons but costs;
  no firm can observe others until after. If all symmetric contribute, all benefit;
  if you defect, you save costs and slightly weaken the database. Superrationality
  says: choose the action that, if chosen by all symmetric firms, maximizes total
  individually-symmetric payoff — thus contribute. But an economist''s Nash reasoning
  says defect. The procedure would tell when superrationality outweighs the standard
  game-theoretic prediction.


