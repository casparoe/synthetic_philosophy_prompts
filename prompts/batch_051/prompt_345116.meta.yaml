  (1) Gödel''s second incompleteness theorem says no consistent formal system that
  contains enough arithmetic can prove its own consistency.


  (2) Whenever you trust a proof or a calculation, you''re implicitly trusting that
  the background system doing the work is consistent — because in an inconsistent
  system, anything follows, so a "proof" of 2+2=4 would be worth nothing.


