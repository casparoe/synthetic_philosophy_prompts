  A guy I sometimes interview for pieces about math and AI cornered me after a talk
  and walked me through something he says is underrated about Gödel: not that there
  are unprovable truths, but that nobody is actually justified in trusting arithmetic.
  His chain goes like this.


  (1) Gödel''s second incompleteness theorem: take any consistent formal system with
  an effectively specifiable set of rules that contains enough arithmetic (the kind
  you could actually program), and that system cannot prove its own consistency.


  (2) Every time you trust a proof or a calculation, you''re implicitly trusting that
  the background system is consistent. In an inconsistent system, anything follows,
  so a derivation of "2+2=4" would buy you nothing.


  (3) So being justified in trusting arithmetic requires a proof that arithmetic is
  consistent.


  (4) By (1), arithmetic can''t supply that proof itself. Any consistency proof for
  arithmetic has to live in some stronger system — maybe set theory, maybe something
  else.


  (5) But then by (2), trusting that stronger system requires a proof that it''s consistent,
  which by the same reasoning lives in a still stronger system — and you''re off on
  an infinite regress.


  (6) Taking the consistency of some system on faith isn''t justification, and an
  infinite regress isn''t justification either. So no one is justified in believing
  arithmetic is consistent.


  (7) And if you''re not justified in believing arithmetic is consistent, you''re
  not justified in believing 2+2=4 — or any mathematical claim you''ve ever leaned
  on to build a bridge or balance an account.


  When I pushed back saying mathematicians do prove consistency by building models,
  he said sure, but a model-theoretic proof just moves the game to set theory, which
