  draft before we commit to production. It should be grounded in whatever the best
  philosophical thinking says about these questions: whether the dead can be wronged
  or only harmed, and whether they can be harmed at all; what truthfulness, as distinct
  from factual accuracy, requires of a fiction that uses a real name and a real life;
