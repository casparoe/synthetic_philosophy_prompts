  Let me think about Strawson''s Basic Argument content. Galen Strawson''s Basic Argument:

  (1) You do what you do, in any given situation, because of the way you are.

  (2) To be truly responsible for what you do, you must be truly responsible for the
  way you are — at least in certain crucial mental respects.

  (3) But to be truly responsible for the way you are, you must have intentionally
  brought it about that you are that way.

  (4) But you can''t be truly responsible for the way you are if you must already
  have had a way of being in order to bring it about... Infinite regress.

  Conclusion: nothing can be truly morally responsible (although we can''t help holding
  people responsible; illusion).


  The classroom activity: "Responsibility hot potato" or "The Regress Game." Participants
  form a chain. One person is the ''agent'' who made a small choice. Others play prior
  selves, genes, upbringing, temperament, etc. The agent must answer "Why did you
  do it?" Each answer inevitably cites something about the way they are, which passes
  the question to the next node; then to that node "were you responsible for being
  that way?" — each handoff reveals the regress. Participants feel the burden of never
  being able to end the chain without either circularity, infinite regress, or brute
  luck.


