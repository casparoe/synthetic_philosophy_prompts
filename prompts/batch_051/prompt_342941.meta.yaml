  ---


  I have no academic training, but I have spent a long time trying to understand a
  puzzle I keep seeing: sometimes a crowd is clearly wiser than any single person
  in it, and sometimes a crowd walks off a cliff that no individual member would have
  chosen alone. Before I look at the more formal explanations people have offered,
  I want the full specification of what any adequate account of this would have to
  get right.


  Please write me the desiderata for a theory of when following the group''s lead
  is reasonable and when it is a mistake, where "adequate" means: good enough for
  an ordinary person making decisions in three kinds of settings — everyday choices
  (restaurants, products, reviews), high-stakes group decisions (jurors, committees,
  evacuation decisions), and financial decisions (markets, investments).


  For each requirement, give the concrete case or observation that makes it a requirement.
  Make sure the list does at least the following, though you should not limit yourself
  to this:

  - It must explain how many independently judging people can beat any one of them,
  and also how a group can converge on a bad answer even when most members would privately
  have gotten it right.

  - The cases it must handle should include things like: a long line outside an unfamiliar
  restaurant in a city full of tourists; a treatment spreading through a hospital
  without anyone pointing to a study; a market where prices rise mostly because others
  are buying; a jury whose early speakers lean heavily one way; a panic in a theater
  when several exits are available; and a product with thousands of five-star reviews
  written by people who bought it after reading other reviews.

  - It must respect the distinctions that ordinary experience forces on us, such as
  the difference between a crowd being informative and a crowd being merely influential,
  and between group accuracy and individual rationality.

  - It must not contradict the fact that these outcomes are all stable parts of life:
  some large groups consistently outpredict their members, while some equally large
  groups are systematically wrong for long stretches.


  Then, flag any pair or group of requirements that you suspect cannot be jointly
  satisfied; say for each whether the conflict is a real one a theory must live with
  or a sign that one requirement should be demoted. After that, name the single requirement
  that does the most work to eliminate the simple folk theories people carry around,
  and explain why.


  If it helps, you may close with a brief table scoring three rough views against
  your list: roughly, that following the crowd is usually reasonable because others
  know things I do not; that following the crowd is usually a failure of independent
  thinking; and that everything depends on the details of who knew what and when —
  but do not let the scoring take over; at least three quarters of the answer should
  be the requirements and their cases.


  Finally, since I am collecting these for a larger project, make the very last line
  of the answer a single one-sentence summary of your overall list, formatted exactly
  like this: Summary: <one sentence>.


