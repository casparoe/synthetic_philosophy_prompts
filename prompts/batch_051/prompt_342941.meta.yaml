  Core concept: We each have private information and observe others'' actions. Sometimes
  imitating the group is rational; sometimes it produces herds that are wrong (informational
  cascades). A theory of rational social learning should specify:

  - When does observing others'' choices add information vs. merely reflect the same
  information you already have? (redundancy)

  - When can imitation be justified without independent evaluation? (information cascades)

  - Why are cascades fragile to small public signals?

  - Does the order of decision-makers matter?

  - Does the theory distinguish rational herding from conformity, reputation effects,
  or common priors?

  - Does it get the basic setup right: binary choice, sequential decisions, private
  signals?

  - Does it explain when groups converge on wrong answer despite everyone individually
  being rational? (the "herd on the wrong restaurant" case)

  - Does it predict cascade can be overturned by a single "correct" action or small
  shock?

  - Does it respect asymmetry: cascades are more likely when signals are noisy/choices
  are coarse?

  - Applicability: markets, juries, online platforms, clinical practice.

