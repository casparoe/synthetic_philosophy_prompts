  Strategy stealing in Hex (combinatorial game theory):

  - Hex is a two-player connection game played on a rhombus/hexagonal board. Players
  alternate placing stones. One player wins by connecting two opposite sides.

  - Proof of no draws (Hex theorem) and proof that first player has a winning strategy
  via "strategy stealing": assume second player has a winning strategy. First player
  makes an arbitrary move (a "ghost move" / extra stone), then pretends to be the
  second player following the winning strategy, treating their extra stone as an asset.
  Since in Hex having an extra stone is never a disadvantage (it can only help), first
  player can follow the "virtual" second-player strategy and win, contradicting the
  assumption. This requires monotonicity — extra stones can''t hurt — which holds
  in Hex.

  - This argument is non-constructive: it proves existence of a winning strategy but
  doesn''t tell you what it is.


