  assessment relative to the AI''s (calibration data, validation studies).

  - Epistemic akrasia: believing/acting against what you judge your evidence supports.
  The classic question: if you judge that you''ve correctly evaluated the evidence
  and P is more likely, but you also have higher-order evidence that you''re unreliable
  in such evaluations, can it be rational to be akratic — i.e., to lower confidence
  or refuse to follow your own judgment?

