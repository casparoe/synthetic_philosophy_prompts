  principles (e.g., a rational agent should treat higher-order evidence as defeating
  first-order assessment); "independence" principles (when assessing a disagreement,
  screen off your own reasoning); "conciliationism" vs. "steadfastness." But the prompt
  doesn''t need to name these.


