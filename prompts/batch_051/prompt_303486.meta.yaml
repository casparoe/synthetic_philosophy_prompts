  are not theoretical conclusions; they''re built into how we engage with people as
  participants. Determinism, even if true, wouldn''t undermine them because they''re
  not based on a belief that the person had contracausal free will; they''re expressions
  of our nature and our commitments to interpersonal life. If determinism is true,
  we might sometimes adopt the "objective attitude" toward someone — treating them
  as something to be managed, like a machine or a child — but we cannot adopt it wholesale
  without abandoning relationships. Excuses vs exemptions: when someone acts accidentally
  or under compulsion, the act doesn''t manifest ill will (excuse); when someone is
  psychologically abnormal or immature, they''re not a participant at all (exemption).


