  ---


  I am putting together a short philosophical profile for a workshop on early modern
  accounts of happiness, and before I circulate it I would like a consistency check
  on the position I have ended up with. I have been working through the eighteenth-century
  philosopher Émilie du Châtelet''s essay on happiness, and here, in compressed form,
  is what I now think.


  i. Happiness is not tranquillity, the absence of pain, or the extirpation of the
  passions; it is the felt satisfaction of one''s passions, so that a life without
  strong desires and attachments cannot be a happy life however undisturbed it is.

  ii. The love of study is the most reliable route to durable happiness, because its
  objects are always available, its pleasures are renewable, and it depends far less
  than love or ambition on the unpredictable conduct of other people.

  iii. Happiness requires illusion: several of our most important passions—romantic
  love, ambition, hope for particular projects—depend on our not regarding their objects
  with complete dispassionate accuracy, and a fully disabused person would find the
  sources of happiness drained.

  iv. Yet happiness also requires lucidity: one must be able to recognize an illusion
  as an illusion when it begins to do harm, and to refuse to become its dupe.

  v. Happiness requires virtue, understood at least as being able to approve of one''s
  own conduct under self-scrutiny; a person whose passions are satisfied but who cannot
  bear their own examination is not happy in the relevant sense.

