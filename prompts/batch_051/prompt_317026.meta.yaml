  Draft Spinoza Type C prompt:


  "I keep coming back to Spinoza, and I''m stuck between two things I find compelling.
  On the one hand, the argument for necessitarianism seems to me basically sound:
  if God (or Nature) is the complete and sufficient cause of everything, and God''s
  nature is what it is with no external constraint, then every event — including every
  human action — follows from that nature with the same necessity as the truths of
  geometry; the appearance of contingency is just an epistemic defect, a product of
  our not grasping the full causal chain. This view has real virtues I don''t want
  to surrender: it removes any arbitrary gap between how things are and how they had
  to be; it dissolves resentment and moral luck, since no one could have done otherwise;
  and it makes room for the intellectual love of God — understanding oneself and other
  things sub specie aeternitatis, and feeling joy at that understanding rather than
  at the fulfilment of some transient appetite. On the other hand, I cannot shake
  the conviction that when I look back at a particular decision, say a cruel remark
  I made when tired, it is false to say I could not have avoided it; the regret I
  feel seems to track a real feature of the situation — that the action was up to
  me in a way that necessitarianism denies. I don''t want to reduce this to ''determinism
  just feels bad''; the intuition persists even when I accept the theory. I am not
  asking which position is correct. I want a negotiated verdict: should the intuition
  be debunked as an artefact of taking the deliberative stance, should the theory
  be amended (for example by distinguishing what is necessary from what is inevitable-for-me,
  or by reading ''could have done otherwise'' as compatibility with a different set
  of antecedents), or is there a reading on which necessitarianism and the legitimacy
  of self-regarding regret are compatible? Give the strongest version of each option
  and say what would justify each move."


