  For a seminar paper on whether emotions belong to the good life, I''ve been asked
  to state my position as a list of claims so the seminar can pressure-test it. I''d
  be grateful for a consistency audit before I present, because I suspect the weak
  points are not the points I find obviously controversial. My claims, as they currently
  stand, are these:


  (1) Emotions are not noise or mere disturbances that a rational life should filter
  out. A good human life is partly constituted by its emotional shape — by feeling
  joy, love, sorrow, fear, and the rest at the right times, toward the right objects,
  and in something like the right measure. The person who acts correctly but never
  feels is missing part of the good, not just missing a useful instrument.


  (2) Grief at the death of someone deeply loved is a fitting response to a real loss.
  I would not choose, on reflection, to be the sort of person who loves but does not
  grieve; the grief is not merely a regrettable tax on attachment but part of what
  it is to have the attachment go all the way down.


  (3) Anger, by contrast, is not something I can celebrate in the same way. The person
  I aspire to be would not be angry even toward someone who has genuinely wronged
  her. Anger''s characteristic impulse is retributive — to see the offender suffer
  or be diminished — and I do not think that impulse adds anything worth preserving
  to a clear-sighted response to wrong. The ideal is not moderated anger but its elimination.


  (4) I also hold a broadly cognitive view of when an emotion is appropriate: an emotion
  is appropriate when the world is as the emotion presents it to be. Fear is appropriate
  when there is real danger; grief when a good really has been lost; anger when a
  wrong really has been done. Appropriateness in this sense is independent of whether
  the emotion is pleasant or useful.


  (5) Finally, the right way to deal with an inappropriate emotion is not to suppress
  it by force but to revise the underlying evaluation. Once one genuinely sees the
  situation differently — sees that the danger is not real, or that the good was not
  lost — the emotion should relax on its own. And where an emotion is appropriate,
  the right response is to feel it rather than to medicate it away.


  Please audit this set. I want to know which pairs of claims are actually in tension
  and which only look as if they are, with the tensions ranked by severity. For each
  genuine tension, tell me what the cheapest repair is and what it costs; and then
  tell me which single revision would do the most to make the whole position coherent.


