  Now, let me make sure the technical details are correct.


  Kelly criterion: For a sequence of independent, favorable gambles, to maximize the
  expected logarithm of wealth (equivalently the geometric mean or the asymptotic
  growth rate of wealth per bet), bet the fraction f* = (bp - q)/b of bankroll each
  round, where b is the net odds received per unit staked (i.e., you get back your
  stake plus b times stake on a win), p is win probability, q = 1-p. For a simple
  even-money bet (b=1), f* = p - q = 2p - 1.


  Properties:

  - Full Kelly maximizes expected log wealth, i.e., asymptotic capital growth rate.

  - It does NOT maximize expected wealth; expected wealth is linear in stake for a
  favorable bet, so maximizing expected wealth would have you bet as much as possible
  (subject to constraints), which risks ruin. Indeed, if you bet everything every
  time, you eventually go to zero almost surely.

  - Kelly avoids total ruin if you can bet fractional amounts (wealth stays positive)
  but can have deep drawdowns; the "risk of ruin" as zero wealth is avoided, but the
  probability of losing any fixed fraction is not zero.

  - The optimality of Kelly depends on logarithmic utility / long-run growth objectives.
  For a decision theorist, an agent with a different utility function should not necessarily
  use full Kelly. Many people use fractional Kelly to manage risk.

