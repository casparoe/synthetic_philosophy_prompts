  If I can know the wall is red by looking without first knowing my perception is
  reliable, then I can use that knowledge to infer that my perception is reliable
  — easy knowledge. The problem arises for views that allow basic knowledge (knowledge
  without prior knowledge that one''s source is reliable) because it makes knowledge
  of reliability too easy, threatening closure or requiring a special account of why
  the inference is illegitimate.


