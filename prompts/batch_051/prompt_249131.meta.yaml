  The bootstrapping problem: Suppose I look at a gas gauge; its reading says F. Can
  I come to know the tank is full? If I trust the gauge, I know the tank is full.
  Then, by tracking readings over time and checking the tank, I start to know correlations:
  gauge says F, tank is full; gauge says half, tank is half; etc. From enough such
  observations, I infer the gauge is reliable. But this reasoning is illicitly circular:
  I used the gauge to gather the evidence that it is reliable. The problem: a reliabilist
  (or a view permitting basic/transmission of knowledge) seems to license this bootstrapping
  reasoning to know the gauge is reliable, even if the gauge is in fact unreliable
  (e.g., it''s stuck; each gas reading always says F and tank happens... wait, if
  it''s unreliable and you check tank independently? Hmm, need care). The classic
  bootstrap: you read the gauge to believe "tank is full"; then you infer "gauge says
  F and tank is full" (still using the gauge to know tank is full); after many, infer
  gauge is reliable. If the gauge is actually stuck, and the tank fills at the same
  time each time... Anyway, the problem is that you can bootstrap from a source''s
  deliverances to knowledge that the source is reliable, without independent check.


