  must itself be related to A, and to B, by further relations D and E. But then D
  and E will in turn require relations to their terms, and the process never ends.
  He takes this to show that no relation, conceived as an independent real thing,
  can account for the unity of its terms, and on that basis he concludes that relations,
  as ordinarily understood, are appearance rather than reality."


