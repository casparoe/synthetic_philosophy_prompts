  But the domain "Eurocentrism and global history: can the past be told from everywhere
  at once?" The underlying conceptual debate includes:

  - The narrative itself imposes a center/perspective; "view from everywhere" may
  be impossible.

  - Eurocentrism isn''t just about including more regions; it''s about categories/periodization
  (e.g., "early modern", "industrial revolution" as European benchmarks).

  - The dilemma: focus vs distortion. Choosing any focus excludes; global history''s
  "everywhere at once" may produce a disconnected list or a homogenized view.

  - Need distinctions: between a bounded focus (legitimate, if acknowledged) and a
  universalized European story pretending to be the world; between causal Eurocentrism
  (overstating Europe as sole driver) and interpretive Eurocentrism (judging others
  by European standards); between adding examples and changing the question/framing.


  A good procedure would ask questions in order:

  1. What question does the chapter/lesson claim to answer? (Check for implicit universalizing)

  2. Whose categories and periodization organize it? Are they local European categories
  presented as global benchmarks?

  3. Is Europe (or the West) the only active agent? Do other regions appear only as
  obstacles, resources, or recipients?

  4. Would the chapter fail its stated exam standard if it answered from the perspective
  of another center? (the silta test?)

  5. Can a change of center be made without making the organization incoherent? (the
  "everywhere at once" feasibility check)

  6. Is the Eurocentric framing doing explanatory work or just narrative convenience?
  If convenience, can it be flagged?

  Then a stop rule: if questions 2/3 fail, revise; if pass, keep but add a "this is
  a partial view" note. If the procedure can''t settle (values vs editorial judgment),
  hand to a person.


