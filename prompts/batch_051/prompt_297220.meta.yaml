  The position to translate: the Tortoise''s challenge to the justification of deduction.
  Carroll''s dialogue: Achilles writes down

  (A) Things that are equal to the same are equal to each other.

  (B) The two sides of this triangle are equal to the same.

  (Z) The two sides are equal to each other.

  Tortoise accepts A and B but refuses Z unless he accepts the hypothetical (C): If
  A and B are true, Z must be true. Achilles adds C as a new premise; tortoise still
  refuses to move; regress. The philosophical upshot: modus ponens / the inference
  rule cannot be treated as a further premise without regress; deduction rests on
  either a rule we accept, or a disposition, or is not a premise at all. Carroll''s
  piece is also about logic as game of acceptance.


  In proof-assistant vocabulary:

  - A and B are hypotheses (context entries) or axioms.

  - Z is the conclusion/goal.

  - Modus ponens is the elimination rule for implication (→E), or in ND, "from Γ ⊢
  A and Γ ⊢ A → B, infer Γ ⊢ B" — often written as an elimination rule in the metalanguage.

  - Tortoise''s move: insists on adding "if A and B then Z" as a premise C, i.e.,
  object-language conditional A → (B → Z) or (A ∧ B) → Z. But even with C in the context,
  deriving Z requires applying →E to C; Tortoise then demands a further premise justifying
  that application. So in type theory, C has type A → (B → Z) (or (A ∧ B) → Z); to
  get Z you apply C to p : A and q : B; the application is a meta-level operation
  (function application / modus ponens). The Tortoise is demanding that the application
  itself be incorporated into the term as an explicit argument, which leads to an
  infinite type: you need f : (A → (B → Z)) and then g : (A → B → (A → (B → Z)) →
  Z)? Hmm, regress.


  Actually there is a clean encoding: The Tortoise is like someone who wants modus
  ponens to be simulated by an axiom/polymorphic term, e.g., mp : Π X Y, X → (X →
  Y) → Y. To use mp, you still apply it, and the Tortoise then asks for mp2 : Π X
  Y, X → (X → Y) → ... infinite. This is like the Y combinator / recursive? In a typed
  lambda calculus, implication elimination is a typing rule:

  Γ ⊢ f : A → B    Γ ⊢ x : A

  ----------------------------- (→E)

  Γ ⊢ f x : B

  This is a rule in the metalanguage; it cannot be replaced by a finite set of object-language
  axioms without either (i) infinite regress, or (ii) moving to a meta-level that
  itself uses →E (relocation). In proof assistants the kernel implements these rules
  in code (pattern match on terms, check the application form); the kernel''s own
  evaluator is trusted.


  What translates cleanly:

  - Distinction between a rule (typing/inference rule) and an assumption (context
  entry/axiom) maps directly to Carroll''s distinction between modus ponens as rule
  vs premise.

  - The kernel/type checker as "the thing that compels inference": proof assistant
  doesn''t ask for permission to apply →E; it does it when you build the proof term.
  Acceptance is coded, not adopted as a premise.

  - The infinite regress is a type-theoretic regress: one can keep asking for a term
  of higher and higher order that internalizes the previous application, and the answer
  is that at some point an untyped/trusted meta-step is used.


  What gets distorted:

  - The proof assistant realizes logic in a metalogic; the rule →E is not justified
  but implemented. So the Tortoise''s question "why should I accept modus ponens"
  reappears as "why should I trust the kernel/type checker?" The translation doesn''t
  answer the epistemic question; it relocates it to the metalanguage / trust in computation.
  This is a residue.

  - Carroll''s piece has a normative/practical dimension — the Tortoise''s stance
  may be a pragmatic impossibility, a refusal to play the game — which doesn''t survive
  translation into a formal system, because a proof assistant can''t represent an
  agent who accepts all premises but refuses the rule; it can only represent a different
  logic with different rules.

  - Curry-Howard reading: modus ponens = function application. A premise-role for
  modus ponens would collapse under normalization, etc.


  What cannot be expressed at all:

  - The agent-relative notion of "acceptance" (the Tortoise accepts A and B but does
  not "accept" the rule) — proof assistants have no model of acceptance/warrant distinct
  from derivability.

  - The normative force of a rule of inference ("you ought to infer Z if you accept
  A and A→B") — type theory tells you what follows, not what you ought to do.

  - Perhaps Carroll''s irony/dialogue form; not relevant.


