  Two-dimensional semantics basics:

  - Primary intension: a function from centered worlds/epistemic possibilities to
  extensions, representing what a term picks out given how the actual world turns
  out (the a priori aspect).

  - Secondary intension: a function from worlds to extensions, holding the actual
  reference fixed (the a posteriori aspect).

  - Example: "water = H2O" is a posteriori necessary; primary intension is "the watery
  stuff" (differs between Earth H2O and Twin Earth XYZ); secondary intension is H2O
  in all worlds.

  - "Hesperus = Phosphorus" similarly.


