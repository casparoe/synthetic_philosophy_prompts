  Lucas''s "Minds, Machines and Gödel" (1961, Philosophy). The argument roughly: (1)
  Gödel''s first incompleteness theorem shows that for any consistent formal system
  F (sufficiently strong to do arithmetic), there is a sentence G_F that is true but
  unprovable in F. (2) Lucas claims that for any machine that instantiates a formal
  system, a human mind can see that G_F is true (because it sees F is consistent and
  G_F says "I am not provable in F"). (3) Therefore the human mind cannot be such
  a machine. Key premise: any machine is equivalent to a formal system, and for any
  such system the human can "out-Gödel" it. Standard objections:

  - Lucas''s argument assumes the human can know that F is consistent, but Gödel''s
  theorem only implies "if F is consistent then G_F is true." For an arbitrary machine
  F, we might not know F is consistent; and if F is inconsistent, the machine can
  prove anything, so the fact that the human can "see" G_F is irrelevant. Lucas''s
  reply: we can sometimes see consistency, but for the general argument, the human
  must be presented with a specification of F; for a very large or complex F (one
  whose consistency we don''t know), Lucas''s claim may fail. Putnam''s critique:
  for any given F that we can see is consistent, there is a machine F'' that also
  proves "if F is consistent then G_F" etc. So the human doesn''t have a specifiable
  ability that no machine could have. Actually Putnam''s point (1960? "Minds and Machines")
  is that the argument trades on a confusion between "for every machine, there is
  a truth it can''t prove" (which we can establish via Gödel) and "there is a truth
  such that for every machine, it can''t prove it" — the latter doesn''t follow, and
  a single machine might replicate the human''s ability to move from any given consistent
  system to its Gödel sentence, if it can prove consistency of the given systems,
  though it can''t prove its own consistency. More precisely, Lucas assumes his mind
  is consistent; but if the mind is a machine, to apply Gödel''s theorem Lucas needs
  a formal system that exactly captures his mind; the argument''s application is circular.

  - Another objection: the theorem requires the system to be consistent; if the human
  mind is an inconsistent machine (can hold contradictory beliefs), the Gödelian move
  fails. Lucas claims humans reject contradictions but maybe not with formal consistency.

  - Benacerraf? Actually Benacerraf''s "God, the Devil, and Gödel" (1967) is a famous
  critique: the Lucas argument depends on the machine being unable to prove its own
  consistency; the mechanist can present a machine M that proves the Gödel sentence
  of any machine presented to it? Let me recall. Benacerraf''s attack: Lucas must
  specify a formal system that captures his mind; if he succeeds, the mechanist can
  build a machine that simulates Lucas and thereby for any M produce G_M... The key
  is Lucas cannot prove his own consistency in the relevant sense; he may be an inconsistent
  system.


  Penrose''s two books: The Emperor''s New Mind (1989) and Shadows of the Mind (1994).
  Penrose argues from Gödel''s theorem that human mathematical insight (seeing the
  truth of an unprovable Gödel sentence) is not algorithmic; the human mind can''t
  be a computer. Difference from Lucas: Penrose carefully frames the argument to avoid
  some objections, using a variation: he argues that if human abilities are algorithmic,
  then the particular algorithm F that captures the mathematical competence of a human
  must be knowable; but then the human (or the community of mathematicians) can see
  the soundness of F and hence see G_F true, contradicting that F captures human ability.
  Standard critiques: in Shadows he calls it the "Gödelian insight" and responds to
  Benacerraf and others. Criticisms:

  - Feferman''s review: Penrose''s argument hinges on Hilbert-type soundness claims
  about the human mind, which are themselves open to doubt; also the step from "no
  single algorithm" to "non-computable physics" is unwarranted.

  - Putnam''s "Review of Shadows of the Mind": the argument "if I am a machine, I
  can''t know which machine" — but the conclusion only shows we can''t *know* we are
  a machine, not that we aren''t one. Penrose''s response invokes something like "I
  am a machine" being a determinate statement; but the limited version... Hmm.

  - Penrose''s leap to quantum gravity/microtubules (Hameroff-Penrose Orch OR) is
  a separate empirical proposal; critics note that even if minds aren''t Turing computable,
  quantum physics as known doesn''t supply the needed ingredient, and unavailable
  precise specification is not evidence.

  - Another classic: a group of mathematicians ("the Penrose–Lucas argument" discussions):
  the human ability to "see" consistency may be open-ended and not formalizable, but
  that just establishes non-formalizability, not non-computability (a non-monotonic
  or fallible process could be algorithmic). Also the problem of "what does it mean
  to know F is sound" — F could be a "ghost of a machine": an algorithm with no specifiable
  formal system.

  - Also the argument could apply to each member of a community separately but not
  to any single human? Penrose sometimes uses the "entire community of mathematicians"
  knowing soundness, shifting from individuals to the collectivity — a known weak
  point. Actually Lucas relied on "I" (the individual mind) seeing the truth; Penrose
  sometimes frames it for "we mathematicians."


