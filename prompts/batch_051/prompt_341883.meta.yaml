  Domain: "Orwellian vs. Stalinesque revisions: the color phi phenomenon and the timing
  of experience." So the area: theories of how and when conscious experience gets
  its content, particularly the timing. The desiderata a theory must meet.


  Content elements:


  1. It must accommodate the color phi data (red dot, green dot, apparent motion with
  color change before the second dot appears). The key datum: subjects report the
  moving dot changes color before the green dot would have appeared — but the green
  dot is what should trigger the color change. So the brain seems to reconstruct or
  retime the experience.


  2. It must distinguish two questions: when the subject *represents* an event as
  happening (time represented in experience) vs. when the experience itself happens
  (time of the representing/experience). A theory must not conflate these.


  3. It must account for backward masking/metacontrast: later stimuli alter or suppress
  perception of earlier stimuli, showing retroactive effects over windows (tens to
  hundreds of ms).


  4. It must respect the empirical equivalence (or near-equivalence) of Orwellian
  and Stalinesque accounts: both can fit the data, because the evidence is the subject''s
  report made after the fact; no direct introspective evidence distinguishes a revised
  memory from a delayed but unrevised experience. This is a key "jointly unsatisfiable"
  or "requirement with teeth": a theory that promises to settle Orwellian vs Stalinesque
  from first-person evidence may be demanding something no theory can deliver. Mark
  as negotiable or as a trap.


  5. It must not assume a "Cartesian theater" — a single place/time where everything
  comes together for a viewer. (From software: no single commit point / no privileged
  observer.)


  6. It should handle asynchronous/parallel processing: different features (color,
  motion, location) processed at different speeds in different streams, yet experience
  seems unified and coherent. Desideratum: explain binding and temporal coherence.


  7. It must give an account of why some events are available for revision and others
  aren''t, or at least the window over which retroactive effects occur; a theory that
  says "anything can be rewritten at any time" fails to respect that most perception
  isn''t grossly falsified.


  8. It may need to be consistent with neural data about timing (e.g., motor/prep
  data, latency measurements) — but as a software engineer, I should be careful: for
  models without web, don''t lean on specific experiments with exact numbers. Could
  mention "measured latency of discrimination vs. reported timing" generically.


  9. Distinguish "content" revision from "judgment" revision: whether the visual content
  itself changes or only the post-hoc judgment/interpretation of a past event. This
  is central to Orwellian vs Stalinesque: Orwellian = content experienced unrevised
  but memory/judgment rewritten; Stalinesque = content itself is delayed/edited before
  experience. Actually Dennett''s distinction: Orwellian revision = post-experiential
  memory revision; Stalinesque = pre-experiential delay/editing. A theory must have
  a principled account of where "experience" ends and "memory" begins, and must say
  whether that boundary is real or a modeling choice.


  10. Possibly: the theory must respect the "multiple drafts" insight: there is no
  final draft; content is continuously revised; questions about "the" exact time of
  an experience may be ill-posed. That''s closer to Dennett''s view.


  Marking non-negotiable vs negotiable:

  - Non-negotiable: accommodate color phi; distinguish represented time vs time of
  representing; handle backward masking; no Cartesian theater (probably).

  - Negotiable/camp-specific: the demand that there be a determinate fact about Orwellian
  vs Stalinesque; the demand that the theory honor a "rich" notion of qualia; the
  requirement that a theory specify a single temporal window.


  Jointly unsatisfiable subset: A theory cannot simultaneously (a) guarantee a definite,
  introspectively knowable onset time for every experience and (b) accommodate retroactive
  effects like color phi, and (c) forbid reliance on post-hoc reports as data. Or:
  you cannot demand both "the subject''s report is the data" and "the report tells
  us when the experience was" when reports are themselves produced after the edit
  window. Also the Orwellian/Stalinesque distinction may be empirically undecidable
  given the data constraints — so requiring a theory to settle it in the subject''s
  favor is unsatisfiable with requiring it to fit only report data.


