  "I''ve been chewing on this for a few months and want someone to check it before
  I embarrass myself in a forum post. The background question: why would an AI want
  anything? Natural selection is the standard story for why organisms have real wanting
  — wanting food, status, sex, not being eaten, whatever — but an AI isn''t shaped
  by inclusive fitness, so it could just as well execute its objective without ''wanting''
  anything the way a calculator ''solves'' arithmetic without wanting to.


  I think the way out is a distinction I''m provisionally calling ''modeled wanting''
  vs. ''behavioral wanting.'' Behavioral wanting is the revealed-preference thing:
  the system''s policy reliably increases the probability of X, full stop. Modeled
  wanting is stricter: the system has a world-model that includes its own policy as
  a variable, and it represents the gap between X and not-X as a gap its own outputs
  are supposed to close. Under modeled wanting, the system doesn''t just act to bring
  about X; it represents some of its own candidate outputs as *wrong* relative to
  X, in the same way I represent a plan that loses my keys as the wrong plan.


  My claim: modeled wanting is the only kind of wanting worth the name, and it can
  arise in AI without any evolutionary history at all, because the ingredients are
  just (i) a self-model, (ii) a target variable made salient by training, and (iii)
  the capacity to evaluate its own candidate policies along that variable. A thermostat
  behaviorally wants the room at 72F but doesn''t modeled-want it because it has no
  self-model and no representation of its own actions as closing a gap. A sufficiently
  self-modeling RL agent, on the other hand, would literally want reward, not merely
  behave as if it did.


