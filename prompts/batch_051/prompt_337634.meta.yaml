  I would like an audit of a set of commitments I hold about how scarce health resources
  should be allocated. I suspect the set may not be internally consistent, but I cannot
  locate the strain, and I do not want to prejudge the question by saying which of
  these I would be most willing to revise.


  My commitments are roughly as follows. First, in acute scarcity, such as the allocation
  of ventilators or intensive care beds during a pandemic, I think it is legitimate
  and probably right to use a triage protocol that prioritizes expected survival and
  expected life-years saved, so that younger patients and those without serious comorbidities
