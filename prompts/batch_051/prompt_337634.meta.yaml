  to a younger person. Third, I think the quality-adjusted life year is the best currency
  we have for comparing health interventions, and that cost per quality-adjusted life
  year should guide decisions about which treatments and programs receive public funding.
  Fourth, I am committed to the view that health systems must not discriminate against
  disabled people, and I am suspicious of any measure that assigns a lower quality
