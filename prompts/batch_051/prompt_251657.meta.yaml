  payoffs (the stakes can be trivial, such as course credit points or a modest prize).
  Use rules, roles, prices, or scoring incentives so that participants run into the
  problem through what they do — for example, by setting the prices at which they
  would buy or sell claims, by certifying claims for a reward, or by having to defend
  a jointly inconsistent set of commitments against a rival. Be concrete: give the
