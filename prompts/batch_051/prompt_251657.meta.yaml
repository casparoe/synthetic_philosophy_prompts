  at least one of my entries was mistaken; and when I tried to work out what I actually
  believed about the report as a whole, my commitments did not fit together. This
  has made the lottery paradox and the preface paradox vivid to me in a way they had
  not been before, and I want to design a session that produces something of that
  same discomfort in students — not by explaining the puzzles, but by putting them
  in a situation where their own decisions exhibit the tension.


  Please design a runnable classroom activity for an upper-level undergraduate epistemology
  seminar (14 students, 80 minutes) on the lottery and preface paradoxes. The activity
  should make participants feel the pull of the following apparent conflict before
  it is named in debrief: a threshold rule for rational acceptance (accept if the
  probability is sufficiently high) seems to license accepting, of each ticket in
  a fair lottery, that it will lose; yet it also seems to forbid accepting the conjunction
  that all tickets will lose, even though it is hard to see how one could accept each
  conjunct while refusing the conjunction. The preface case should then reverse the
  pressure: participants should find themselves wanting to assert both a long list
  of individually checked claims and the claim that the list contains at least one
  error, and should feel why abandoning any particular item feels arbitrary even though
  the whole set cannot be consistently accepted.


