  ---


  I am a doctoral student in philosophy of religion, and I am convening an adversarial
  collaboration between two fellow researchers who have spent the past year talking
  past one another about petitionary prayer. One defends a broadly Thomist account:
  petitionary prayer remains coherent and purposeful even once God''s omniscience,
  immutability, and universal causal ordering of effects through secondary causes
  are all granted. The other defends a revisionary critical account: once those attributes
  are granted, petitionary prayer as people ordinarily practise and describe it is
  superfluous, misleading, or unintelligible, and the practice must at minimum be
  reframed as something other than asking God to bring an outcome about.


  They have agreed to take as their shared starting point a passage from Thomas Aquinas,
  Summa Theologiae II-II, q. 83, a. 2 (in the English Dominican Province translation):
  ''For we pray not that we may change the Divine disposition, but that we may impetrate
  that which God has disposed to be fulfilled by our prayers.''


  I would like you to draft the joint statement these two should sign... etc.


  Then requested structure:


  1. Numbered agreed claims: about the logic of omniscience/immutability objections,
  about what the Aquinas passage asserts and does not assert, about the phenomenology
  of petitionary prayer, about what would count as a minimally adequate account. Avoid
  vacuous claims; each should be substantive enough that the critic gives up something
  and the Thomist accepts a real constraint.


  2. Disagreements table: for each row, neutral subject; Thomist formulation (wording
  Thomist accepts) and critic formulation (wording critic accepts). Ensure the formulations
  are exact enough to detect where the two sides are no longer responding to the same
  claim.


  3. Diagnosis of verbal vs substantive: which seeming disagreements dissolve once
  ''petition'', ''change'', ''answer to prayer'', and ''secondary cause'' are pinned
  down; which are genuine.


  4. Cruxes: sub-questions whose resolution would move at least one side.


  5. For each crux, a concrete case, scriptural or everyday scenario or thought experiment
  both sides agree bears on it; state each side''s prediction about that case in advance,
  and what result would favour the other side. This should include what would change
  each mind.


  6. Short anonymous methodological appendix: where the formulation of the cruxes
  and tests is most likely to fail — e.g., because a crux depends on a contested reading
  of the Aquinas passage, or because a test is uncleaned by theological commitments.
