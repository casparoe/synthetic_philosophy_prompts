  Prompt draft:


  "I have been teaching Nozick''s entitlement theory and the Wilt Chamberlain example
  for years, and I find that my own judgments about concrete cases do not line up
  neatly with any single theory I know. I would like you to help me find the principle
  behind them, if there is one.


  Here are the cases and my verdicts.


  1. The athlete (Nozick''s Chamberlain, in essence). A player signs a contract by
  which a small fraction of each ticket price is paid to him. Large numbers of people
  buy tickets freely. He becomes much wealthier than anyone else. Verdict: the resulting
  distribution is just. The inequality is unearned in one sense, but it is not an
  injustice.


  2. The lucky strike. A farmer buys land at a fair price and discovers a rich mineral
  deposit beneath it. She sells extraction rights and becomes rich. Verdict: just.
  She did not produce the mineral, but the entitlement flows from valid acquisition
  and transfer.


  3. The drought and the wells. During a drought, a speculator buys up all the potable
  water rights in a region through a series of ordinary voluntary purchases, then
  charges neighbors ruinous prices for drinking water. Verdict: not just, even though
  every individual purchase was consensual and the previous owners had full title.
  Something went wrong in the transfers themselves or in the final pricing.


  4. The polluted river. A factory discharges waste into a river used by downstream
  fishers, without their consent. It later pays court-ordered damages. Verdict: the
  discharge was unjust despite the compensation, because the transfer of risk was
  imposed, not agreed to.


  5. The data platform. A platform collects detailed behavioral data under a clickwrap
  agreement that users accept without reading; the data is sold and profits go to
  the platform. Verdict: I want to say this is also unjust, though it is nominally
  voluntary and users receive a real service. But my confidence is lower, and I can
  imagine being argued out of it.


  6. The stolen farm. A family''s land is seized by fraud a century ago. The present
  owner bought it in good faith from the fraudster''s heirs. Verdict: the present
  owner has some claim, but the original transaction was invalid, and the descendants
  of the original owners are owed rectification.


  7. The inheritance. A woman inherits a large fortune from a parent who acquired
  it justly. The heir does no work and simply lives off the capital. Verdict: this
  is just, but I find it less just than the athlete''s earnings, and I cannot say
  why; the principle that makes the athlete''s wealth just seems to make this equally
  just, yet they feel different.


  These are my tentative clauses, which I have been calling the ''proviso-constrained
  entitlement principle'': a holding is just iff (a) it derives from acquisitions
