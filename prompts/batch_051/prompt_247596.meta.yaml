  Kierkegaard/Fear and Trembling content (from knowledge):


  - Published 1843 under pseudonym Johannes de silentio; not necessarily Kierkegaard''s
  own position — it''s an aesthetic/poetic-dialectical thought experiment. This is
  important: many candidates wrongly identify silentio with Kierkegaard. The question
  can test awareness of the pseudonym''s significance.


  - Problema I asks: "Is there a teleological suspension of the ethical?" The ethical
  is the universal, which applies to all at every moment; the individual has their
  telos in the universal, and the task is to annul their particularity in the universal.
  If this is the highest, then Hegel is right. Faith''s paradox: the single individual
  is higher than the universal — the individual determines their relation to the universal
  through their relation to the absolute, not the other way around.


  - The tragic hero (Agamemnon sacrificing Iphigenia, Jephthah, Brutus): they suspend
  one ethical duty (parental love) for a higher expression of the ethical (the nation,
  the state, the common good). They remain within the ethical; the community can understand
  and weep for them; their act is mediated through the universal; the tragic hero
  renounces the particular for the universal, and is "greater" through that.


  - Abraham: his act cannot be mediated; no higher ethical purpose explains killing
  Isaac; ethically it is murder (or attempted murder); he acts purely for God and
  for himself (the trial/test); he cannot speak (no one can understand; hence "fear
  and trembling"); he is either a murderer or a believer, with no middle term; the
  difference is invisible from outside — interiority.


  - "The teleological suspension": the telos that justifies (God''s command / the
  test of faith) is higher than the universal, so the ethical is suspended — held
  in abeyance, not destroyed; Abraham still loves Isaac (infinite resignation), and
  the ethical remains but is relativized to a lower station in the hierarchy of ends.
  But silentio says this is a paradox that he cannot understand; it cannot be mediated
  or dialectically reconciled (contra Hegel). The ethical, from its own standpoint,
  condemns Abraham.


  - The knight of faith vs the knight of infinite resignation: the knight of infinite
  resignation gives up the finite (Isaac) and gets it not back; the knight of faith
  gives it up and receives it back by virtue of the absurd — double movement. Abraham
  believes he will get Isaac back, "by virtue of the absurd," even as he raises the
  knife. This matters for whether the suspension is a mere destruction: if Abraham
  simply lost Isaac, he''d be a tragic hero or resigned knight; the suspension of
  the ethical is tied to the double movement by which the finite is returned. Hmm,
  this is more Problema II/III and preliminary "Preliminary Expectoration."


