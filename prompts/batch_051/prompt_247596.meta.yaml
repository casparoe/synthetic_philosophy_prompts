  Model answer should argue: The tragic hero shows what a suspension within the ethical
  looks like — one duty yields to a higher duty, both located in the universal; the
  community can mediate and legitimate it. Abraham''s case is different because the
  justifying end (God''s command) is not a duty within the ethical and is not shareable;
  so from the ethical standpoint Abraham is a murderer. The "suspension" language
  matters: the ethical isn''t abolished but subordinated to a higher telos, yet because
  the ethical is defined as the universal, subordination cannot be said within the
  ethical — hence the paradox of faith. So the suspension is both real (from faith''s
  standpoint, the ethical remains valid but lower) and unavailable (from the ethical
  standpoint, there are no ethically sufficient reasons). Students must see that the
  text does not resolve this tension; silentio presents the question, not a solution
  — and the pseudonym distance suggests Kierkegaard may be showing the problem of
  an impossible position rather than endorsing an exception clause for religious violence.
  A strong answer might also note that in the ethical''s own terms, the distinction
  between Abraham and a deluded fanatic is undecidable — and that this undecidability
  is constitutive: faith requires the absurd and cannot be mediated. If someone tries
  to make the suspension a general ethical principle, it self-destructs, because a
  rule that the individual may be higher than the universal is not a universal rule.


  Marking scheme moves:

  1. Sets out the ethical as the universal and the individual''s telos within it (3
  marks). Common failure: skips this, so the "suspension" has nothing to suspend.

  2. Explains the tragic hero as an intra-ethical suspension and why the community
  can mediate it (Agamemnon/Brutus/Jephthah) (5 marks). Common failure: treats tragic
  hero as just an example of sacrifice rather than the control case.

  3. Explains that Abraham''s act has no higher ethical telos; from the ethical it
  is murder; the difference is interior and unmediatable — hence paradox (5 marks).
  Common failure: claims Abraham''s act is justified by the outcome or by the greater
  good.

  4. States whether the suspension preserves or abolishes the ethical, and uses the
  "teleological" notion: the ethical is not destroyed but subordinated; yet the subordination
  cannot be stated within the ethical — so the question of coherence is left as a
  paradox; suggests what would be needed to make it something other than murder (e.g.,
  a standpoint above the universal) and notes that silence/pseudonymity signal this
  is posed, not resolved (4 marks).

  5. Diagnostic/meta move (3 marks): distinguishes the order of explanation — that
  if Abraham is a murderer or a believer is a matter of faith''s inwardness, not public
  criteria; and the text''s rhetorical/pseudonymous frame warns against converting
  paradox into policy.


