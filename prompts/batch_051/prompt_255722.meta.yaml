  In my craft as a novelist, I keep relying on a test that I can now state as a philosophical
  proposal, and I would like it assessed honestly.


  The test concerns why some emotions in fiction feel earned and others feel manipulated.
  The familiar craft rule is that a feeling is earned only if the reason printed on
  the page for the feeling is a feature of the thing the feeling is about. The usual
  examples are conventional: admiration earned by the admired person''s conduct, grief
  earned by the loss itself, belief earned by evidence. I want to make something stronger
  and stranger of this rule.


  I call it the staging test. A consideration is a reason of the right kind for an
  attitude when it can be staged: written as a visible, in-scene cause of the attitude
  without the scene collapsing into satire, horror, or the depiction of the character
  as self-deceived or rationalizing. A consideration fails the test when the honest
  dramatization of it cannot remain in one of the ordinary serious modes — when the
  moment the reason is put on the page, the scene slides into comedy or menace. Take
  a character who admires a patron because the patron has agreed to pay her debts,
  and who says so openly, while everything visible about the patron is petty and cruel.
  I can write that scene, but I cannot write it as a scene of earned admiration; it
  comes out as satire, or as a study in self-deception, or as something sinister.
  Yet the money is a genuine reason to bring herself to admire — it recommends, very
  strongly, being in the state of admiring — and the test picks exactly that difference
  out.


  My proposal is that this is not merely an aesthetic convention. The reason a wrong-kind
  reason cannot be staged is that scenes can only show an agent responding to an object
  — to the person, the proposition, the state of affairs before her — while a wrong-kind
  reason is always a reason concerning her response itself, and the response is not
  yet there in the world to be shown. Staging forces the reason to confront the object
  it claims to be about, and at that point the mismatch becomes audible.


