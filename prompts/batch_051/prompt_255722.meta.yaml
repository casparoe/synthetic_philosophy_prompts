  want the candid assessment: is the staging test a real criterion, or just a tic
  of narrative convention dressed up as one? Does it already exist under a name I
  have not read? And where does it break — what attitude or reason does it classify
  wrongly, and does any of that amount to a fatal objection rather than an embarrassment?


