  In my craft as a novelist, I keep relying on a test that I now want to state as
  a philosophical proposal and have assessed honestly.


  The test concerns why some emotions in fiction feel earned and others feel manipulated.
  The familiar craft rule is that an emotion is earned only if the reason printed
  on the page for it is a feature of the thing the emotion is about: admiration earned
  by the admired person''s conduct, grief earned by the loss itself, belief earned
  by evidence. I want to turn this into something stronger.


