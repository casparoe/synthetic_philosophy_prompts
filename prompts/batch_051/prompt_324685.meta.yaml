  The problem, as I understand it, is roughly this: once material scarcity is solved
  and work is no longer required, the difficult question — how to live well — does
  not go away; it becomes the whole question. Scarcity had been doing hidden work:
  it gave shape to time, provided a metric for success, and made it easy to postpone
  the question of what is worth doing for its own sake. Remove it, and inherited habits
  do not simply vanish. People may rebuild, out of freedom, a new necessity: status,
  measurable output, busyness for its own sake. I want the group to feel that reversal,
  not hear about it.


  Design a runnable game or structured simulation for the session, with clear rules,
  materials, and a debrief. The setting is my group as described: about twenty undergraduates,
  one two-hour block, no prior preparation. The activity should include at least two
  phases: an initial phase in which the participants'' time is legitimately constrained
