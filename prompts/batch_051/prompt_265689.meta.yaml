  1. "Lange... two rules — set price equal to marginal cost and produce at minimum
  average cost — and adjust prices by trial and error" — Lange''s rules: managers
  should minimize average cost (i.e., produce at optimum scale) and set price equal
  to marginal cost; the Central Planning Board sets prices by trial and error (Walrasian
  tâtonnement). That''s roughly right, not an error exactly. Subtle mischaracterisation:
  "which he claimed reproduced everything a market does" — Lange didn''t claim to
  reproduce *everything* a market does (he acknowledged differences in distribution,
  incentives, etc.). Overstatement.

