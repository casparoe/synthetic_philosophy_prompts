  the practical... so it''s a draw." This is contestable/oversimplified; Austrians
  deny Lange answered Mises because trial-and-error prices set by a board aren''t
  genuine market prices and don''t reflect real discovery/entrepreneurship; also the
  standard view isn''t a settled draw.

