  Draft:


  "I spent my working life as a natural scientist, and much of my training was in
  operationalism: a concept earns its keep only if you can specify what you would
  measure. So when I started reading economics after retiring, the revealed-preference
  approach initially impressed me. The practice is this: an economist observes only
  what an agent chooses among affordable options and infers from those choices a preference
  ordering. A bundle chosen when another was available reveals preference; utility
  is then assigned as a number that represents that ordering, with no claim that the
  number measures some inner magnitude of satisfaction. Textbook theory insists the
  utility number is simply an index.


  But I''ve noticed that the discipline does not stay in that ascetic posture. When
  economists do welfare analysis or cost–benefit work, they treat the same inferred
  utilities as magnitudes of well-being: they add them across persons, compare gains
  to losses, and say a policy improves welfare when the winners could compensate the
  losers. And in behavioral economics, choices that violate the axioms are called
  ''irrational'', as if the axioms of choice consistency were norms of reasoning rather
  than just descriptions. That looks to me like a slide between two incompatible ideas
  of utility—a behaviorist one and a substantive one—inside a single practice.


