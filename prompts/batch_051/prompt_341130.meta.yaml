  The practice concretely: Economists routinely infer an individual''s preferences
  and "utility" from her choices: if she chooses A over B when both are affordable,
  she is said to reveal a preference for A and A is assigned weakly higher utility.
  Welfare economics aggregates these inferred utilities; cost-benefit analysis treats
