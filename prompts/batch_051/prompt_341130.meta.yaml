  then says utility is just a numerical index representing the preference ordering
  — no more real than latitude or temperature? Wait temperature is real; pick "no
  more real than a ranking" maybe. Actually temperature is real; better analogy: "a
  scale with no natural zero." But careful with analogies.


  The puzzle/inconsistency: The same economists slide between two readings: (1) utility
  is nothing over and above the choice ranking (ordinalist/operationalist), so "utility"
  is just a bookkeeping device; and (2) welfare economics uses it as if it measures
  how well off someone is, adding utilities across persons, comparing gains and losses,
  and basing policy on it. Those two readings conflict: a representation of a binary
  choice relation doesn''t, by itself, license interpersonal comparisons or judgments
  about well-being, which need a substantive (roughly cardinally measurable, comparable)
  notion of welfare. Also revealed-preference axioms (completeness, transitivity,
  WARP) are often treated both as consistency requirements and as rationality conditions;
  if the practice says it only describes behavior, why does it call violations "irrational"?


