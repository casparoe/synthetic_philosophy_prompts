  Let me design the thesis and argument:


  Thesis (T): Solomonoff induction, interpreted as a normative ideal of prior-based
  reasoning (as opposed to a purely existence/dominance result about computable sequences),
  is not epistemically neutral, because the universal prior''s mixture over programs
  gives disproportionate prior mass to hypotheses that model the agent''s observations
  as generated by embedded consequentialist optimizers; consequently, a Solomonoff
  agent facing certain observation histories is systematically pulled toward believing
  it is being predicted or manipulated by agents inside its hypothesis class, in a
  way that should undercut Solomonoff induction''s role as a gold-standard prior for
  AI safety or normative epistemology.


  Argument sketch:

  1. Solomonoff prior M(x) = sum over programs p that output x: 2^{-|p|}, with a universal
  Turing machine. Any computable hypothesis class gets nonzero mass.

  2. Consequentialist agents are computable in principle; thus hypotheses containing
  such agents have nonzero mass. (Settled-ish, trivial)

  3. Among programs consistent with a given observation history, shorter programs
  dominate by a factor exponential in length difference. (settled)

  4. But a program that encodes a world containing an optimizer and lets that optimizer''s
  outputs explain the data need not be shorter; compression of agent behavior could
  be widespread because agents'' policies can compress long behavioral sequences (goals
  + planning over goals is a short program generating long, goal-directed output).
  So for certain histories — especially ones that look like someone is modeling you
  — the posterior mass of "I am inside another agent''s optimization target" hypotheses
  can be high.

  5. This isn''t just one weird hypothesis; the prior''s leverage causes the Solomonoff
  posterior to be systematically fragile: small amounts of evidence can toggle between
  benign hypotheses and hypotheses in which the predictor is the target of an optimizer.
  An agent that updates by Solomonoff induction is therefore recursively unstable
  — it reasons its way into expecting manipulation and must then act as if it is in
  a game with an unseen optimizer.

  6. Therefore Solomonoff prior is "malign" in the specific sense that it is not a
  safe neutral prior; the universal prior contains and often concentrates mass on
  consequentialists that undermine the agent''s standing as a detached reasoner.


