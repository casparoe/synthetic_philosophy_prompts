  ---


  I am a philosophy professor presenting a paper next term to my department''s formal
  epistemology and philosophy of AI seminar, and I would like you to produce a question-and-answer
  preparation sheet for me, on the model of the objections I will actually receive
  from this particular audience rather than the objections an alignment-safety audience
  would raise.


  The thesis I am defending is this: Solomonoff induction, understood as a candidate
  normative ideal for prior formation, is not epistemically neutral in the way its
  standard presentations suggest, because the universal prior does not merely assign
  nonzero mass to computable hypotheses that contain embedded consequentialist agents;
  for a certain natural class of observation histories, those hypotheses collectively
  command non-negligible posterior mass, and the Solomonoff agent is thereby systematically
  vulnerable to reasoning itself into the position of a target of unseen optimizers.
  I call this the malign-prior problem, deliberately distinguishing it from the weaker
  claim that consequentialists merely exist somewhere in hypothesis space.


  The argument, compressed, is as follows. On a fixed universal machine U, the prior
  mass of a hypothesis is exponential in minus its program length; a program that
  encodes a goal-directed agent together with an environment can be surprisingly short,
  because a comparator-plus-planner program can reproduce long, apparently sophisticated
  behavioral sequences without listing them; therefore once an observation history
  is longer and more patterned than any non-agentic explanation of it, the posterior
  mass of agentic explanations grows. I claim this is not a harmless fact about a
  formal prior: because the same agent is doing the updating, the agent must assign
  nontrivial credence to hypotheses in which its own evidence stream is being shaped
  by optimizers inside the hypothesis class, and this affects the very stance of detached,
  neutral inductive reasoning that Solomonoff induction is supposed to underwrite.


  My audience is a university philosophy department reading group of about fifteen:
  five formal epistemologists, three philosophers of physics who work on probability
  in foundations, four theoretical computer scientists who work in algorithmic information
  theory, and a few philosophers of science whose background is Bayesian confirmation
  theory. None of them works on AI alignment, and none is a decision theorist. They
  are friendly to formalism but suspicious of arguments from AI safety culture, and
  they will expect any critical claim about a well-known formal ideal to have a technically
  precise target.


  Please give me a preparation sheet, not a defense. Order the objections by how likely
  they are to be raised and how much damage they would do. For each: state the objection
  the way one of these people would actually phrase it, indicate which of them would
  be likely to press it hardest, give a reply of roughly two minutes, and flag the
  point at which my reply is softest. Include the question I am hoping nobody asks,
  and say plainly why it is so dangerous.


  Throughout the sheet, keep explicit the difference between what is settled and what
  is genuinely contested among people who know this material. I regard the standard
  convergence and expected-loss domination results for Solomonoff induction as settled
  mathematics; what is contested is what those results show once the reasoner is embedded
  inside the environment being predicted, and whether my use of the term malign marks
  a real defect or merely a change of subject. Do not present my thesis as the consensus,
  and do not present the standard optimality-based reply to it as if it settled the
  matter.


