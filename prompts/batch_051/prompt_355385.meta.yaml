  I am a philosophy professor presenting a paper next term to my department''s formal
  epistemology and philosophy of AI seminar, and I would like a question-and-answer
  preparation sheet written for this audience rather than for an alignment-safety
  audience.


  The thesis I am defending is that Solomonoff induction, treated as a candidate normative
  ideal for prior formation, is not epistemically neutral in the way its standard
  presentations suggest. The universal prior does not merely assign nonzero mass to
  computable hypotheses that contain embedded consequentialist agents; for a certain
  natural class of observation histories, those hypotheses collectively command non-negligible
  posterior mass, so an agent that updates by Solomonoff induction is systematically
  vulnerable to reasoning itself into the position of being a target of unseen optimizers.
  I call this the malign-prior problem, and I distinguish it from the weak claim that
  consequentialists merely exist somewhere in hypothesis space. By consequentialist
  agent I mean a computable process that selects interventions by evaluating candidate
  futures against an objective function; by embedded I mean located inside the very
  world whose behavior the hypothesis assigns probability to.


  The argument, compressed, is this. On a fixed universal machine, a hypothesis has
  prior mass exponential in minus its program length. A program that encodes a goal-directed
  agent together with an environment can be short, because a utility function plus
  a planning rule can reproduce a long behavioral sequence without listing it. So
  when an observation history is longer and more patterned than any shorter non-agentic
  explanation of it, the posterior mass of agentic explanations grows. I claim this
  is not an inert fact about a formal object, because the same agent is doing the
  updating: the agent must give nontrivial credence to hypotheses in which its own
  evidence stream is being shaped by optimizers inside the hypothesis class, and this
  corrodes the posture of detached, neutral induction that Solomonoff reasoning is
  supposed to underwrite.


