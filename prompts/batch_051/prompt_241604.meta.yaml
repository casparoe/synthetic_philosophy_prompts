  conditional and its counterfactual counterpart have the same truth conditions —
  both are true just in case the consequent is true in the closest possible world
  in which the antecedent holds. The differences we feel between "If A, then B" and
  "If it had been the case that A, then it would have been the case that B" are, on
  my view, not differences in what the sentences say, but differences in which possibilities
  are available to the selection of the closest antecedent-world: in the indicative
  case the domain is restricted to possibilities compatible with the speaker''s evidence,
  while in the counterfactual case it is not so restricted. I do not think either
  kind of conditional expresses a special kind of probability or lack of truth conditions.


