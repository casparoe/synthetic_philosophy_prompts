  Aristotle on phantasia: In De Anima III.3 (427b14ff), phantasia is "that in virtue
  of which we say that an appearance (phantasma) occurs to us," distinct from perception,
  thought, and opinion. It is a movement arising from actual perception (428b30–429a2).
