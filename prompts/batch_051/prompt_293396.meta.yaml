  in thought: "the soul never thinks without a phantasm" (DA 431a16–17; 432a8–10).
  Animals have phantasia but not belief (428a20ff); humans have deliberative phantasia
  (434a5–10). Phantasia can be false while perception is always true (of special objects)
  — contrast.


