  I have spent the better part of a decade following, and occasionally participating
  in, a dispute in the philosophy of set theory that seems to me to have reached a
  complete standstill. Everyone in the room accepts the same formal facts: Cantor
  showed that the real numbers have cardinality strictly greater than that of the
  natural numbers; the claim that no set has a cardinality lying strictly between
  them is the Continuum Hypothesis; and Gödel and Cohen established that this claim
  can be neither proved nor refuted from the standard ZFC axioms. Yet from this single,
  uncontroversial independence result, the field splits into camps that no longer
  seem to be arguing with one another so much as past one another.


  One camp holds that CH nevertheless has a determinate truth value. On their view
  the cumulative hierarchy of sets is a definite, mind-independent structure, and
  the independence proof shows only that ZFC is too weak, not that the question is
  unanswerable; the task is therefore to find and justify new axioms, most plausibly
  strong axioms of infinity, that will settle CH the way ZFC settles more elementary
  questions. A second camp draws the opposite moral: if our best canonical axioms
  leave CH undecided, then there is no fact of the matter, or at least no fact we
  are entitled to claim; "the" universe of sets is not a unique object but a family
  of equally legitimate models, and CH is simply true in some and false in others.
  A third camp, toward which I find myself drifting, suspects the real dispute is
  not about the mathematics at all, but about what makes a statement of set theory
  true, or about what counts as evidence for a new axiom; the camps agree on every
  theorem and every independence proof, yet assign different weight to intrinsic plausibility,
  extrinsic fruitfulness, and the conviction that set-theoretic truth outruns our
