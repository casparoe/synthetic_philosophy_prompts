  Let me draft MEC Type 1:


  "I have been trying to think clearly about the moral equality of combatants in just
  war theory, and I find myself split in a way that isn''t resolving. On one side,
  the doctrine has real systematic appeal. It gives the ethics of conduct in war a
  stable foundation: if combatants on opposing sides are not morally on a par, then
  every ordinary soldier, conscript or volunteer, is expected to assess the justice
  of the war before deciding whether she may fight at all — and she must do this under
  propaganda, partial information, coercive pressure, and with the knowledge that
  refusal may mean prison or death. The moral equality of combatants avoids that demand
  by tying the soldier''s permissions to the rules of conduct, not to the justice
  of the cause. It also respects something egalitarian: we do not normally assign
  a person responsibility for the culpability of her state. On the other side, I have
  a firm intuition that there is a deep moral difference between the soldier serving
  an aggressive invader and the soldier defending against that invasion. It is not
  merely that their causes differ; I want to say the invader''s act of killing even
  a lawful target is wrong in a way the defender''s is not. The symmetry claim feels
  like it launders an unjust cause through rules of engagement. I am not asking which
  side the literature ultimately favors. I am asking how to think about what each
  side would cost. What would justify giving up the intuition — what exactly would
  I need to accept about moral responsibility, group action, or epistemic limitations
  for the apparent moral difference between invader and defender to be a mistake worth
  correcting? What would an amendment of the doctrine look like if the intuition is
  to be trusted instead? Is there a version that keeps the epistemic and institutional
  benefits — not requiring every soldier to be a private just-war theorist — while
  denying that the two combatants are moral equals? Could the disagreement turn on
  an ambiguity, for example between combatants as agents with full moral standing
  and combatants as occupants of a conventional role? Finally, I want your answer
  to flag where your own reasoning is most likely to fail and which consideration
