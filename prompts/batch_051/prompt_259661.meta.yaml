  ---


  After retiring from a research career in the physical sciences, I have been working
  through some epistemology on my own, and Fitch''s paradox has lodged itself in my
  mind. As I understand it, the paradox begins from an attractive verificationist
  thought: every truth is knowable, in the sense that if a proposition p is true,
  then it is possible that someone knows that p. Fitch''s argument then takes any
  unknown truth — a proposition of the form p and no one knows that p — and considers
  the possibility, licensed by the principle, that this conjunction itself be known.
  Because knowledge distributes over conjunction, knowing the conjunction would require
  knowing each conjunct: knowing that p, and knowing that no one knows that p. But
  knowledge is factive, so knowing that no one knows that p would imply that no one
  knows that p — contradicting the first conjunct. Thus an unknown truth cannot be
  knowable, and the principle collapses into the claim that every truth is actually
  known.


