  Now, craft a formal prompt. The asker could be someone teaching or writing. The
  prompt should ask the model to produce a critical reading, faithful in both directions.
  Include the philosophical tensions:


  - The "universal museum" position: museums hold objects in trust for humanity; acquisition
  may have been legal at the time; objects are best preserved/displayed where everyone
  can see them. (But is "universal" itself a product of empire?)

  - The restorative-justice position: wrongful taking gives a continuing duty of return;
  return as repair, not just property transfer.

  - The identity/heritage position: certain objects are constitutive of a people,
