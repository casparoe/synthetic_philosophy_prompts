  of fitness, on which an organism''s fitness is an objective probabilistic disposition
  of its genotype/phenotype in a specified environment to produce a certain expected
  number of offspring, a disposition that can fail to be realized in any particular
  case. On this view, fitness is causally prior to actual survival; an organism can
  be fitter than a competitor yet lose, just as a biased coin can land tails. Some
  of us think this dissolves the objection; others think it merely relocates it, because
  propensities of this kind are either inferred back from actual reproductive success
  (reintroducing vacuity) or too vague to yield testable predictions.


