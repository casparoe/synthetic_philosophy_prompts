  Popper (1963, Conjectures and Refutations) introduced verisimilitude: truthlikeness.
  He defined it in terms of truth content and falsity content: Vs(A) = CtT(A) - CtF(A)?
  Actually Popper''s definitions: the truth content of A is the set of true consequences
  of A; falsity content is set of false consequences (or relative measure). Verisimilitude
  compares theories by content: B has greater verisimilitude than A iff B''s truth
  content exceeds A''s and B''s falsity content does not exceed A''s (or some combination).
  Then Tichý (1974) and Miller (1974) independently showed that on Popper''s qualitative
  definition, for false theories A and B, if B''s truth content exceeds A''s truth
  content, then B''s falsity content also exceeds A''s falsity content — so no false
  theory can have greater verisimilitude than another. Thus Popper''s definition makes
  all false theories incomparable on the intended notion. There''s also the "Miller''s
  result": verisimilitude and the problem of false consequences. Popper responded...
  Tichý proposed an alternative based on distances between possible worlds; Graham
  Oddie (1986) *Likeness to Truth*; Niiniluoto''s truthlikeness measures. This is
  somewhat niche but LLMs with good philosophy knowledge do know. But small LLMs might
  not have memorized details. The prompt can inject: "Popper proposed that one false
  theory can be closer to the truth than another because it has more true consequences
