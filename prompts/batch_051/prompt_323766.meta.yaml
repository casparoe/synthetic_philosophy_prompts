  - "step_assessments": an array with one element per step, each an object with "step_number"
  (integer), "status" (one of "valid", "invalid", or "valid_but_misleading"), and
  "explanation" (a string saying what the step asserts and why it holds, fails, or
  only appears to hold);

  - "diagnosis": a string explaining the central error (or, if the argument is valid,
  what makes it valid), including what conditional convergence does and why it matters
  for the definition of expected value;

  - "corrected_claim": a string stating the most defensible thing that can be said
  about the game''s expected value and fair price once the error is fixed.


