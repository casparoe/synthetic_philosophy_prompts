  Let''s write final:


  I am a software engineer at a defense contractor. I work on target identification,
  sensor fusion, and engagement logic for systems with increasing autonomy, and I
  have no formal training in philosophy. Each quarter I review one new or modified
  subsystem against the requirement that the system preserve meaningful human control
  over the use of force. I have about two hours per subsystem. The engineering lead
  and a compliance officer both sign off on my review, and the outcome determines
  whether the feature can proceed to live-fire testing. The stakes are life and death,
  so the procedure must be consistent across reviews rather than a one-off argument.


  I need a reusable decision procedure — an ordered checklist or a flowchart in words
  — that turns the principle of meaningful human control into something an engineer
  can run. Start from what the principle actually demands: a human operator who understands
  what the system is doing at the relevant level of abstraction, who can deliberate
  about the specific attack with adequate and honest information, who has enough time
  to intervene or refuse, and who can be held responsible for the decision. Convert
  those demands into tests expressed in terms of what appears in a specification,
  an operator interface, or an operational concept: the information shown to the human,
  the timing of prompts, the reversibility of an action once initiated, the number
  of systems one operator supervises, the conditions under which the system may override
  or ignore a human, and the default behavior when the link drops or the data is degraded.


  For each test, state what would count as passing or failing evidence. Distinguish
  a human who can meaningfully control the system from one who merely confirms a decision
  that has already been made, and treat mere human-in-the-loop approval as insufficient.
  Mark explicitly every point where judgment cannot be eliminated, and say what a
  reviewer should do when the specification is silent or when the relevant operational
  parameters are classified, absent, or unknown.


  The procedure must handle at least these hard cases: time-critical defensive engagements,
  degraded or jammed communications, target lists prepared in advance by a human,
  one operator supervising multiple parallel systems, and automation that filters
  candidate options before any human sees them.


  Apply the procedure to three worked cases. First, a sensor-fusion module that presents
  a ranked list of candidate targets and will not release a weapon until a human confirms
  the selection. Second, a point-defense system that must intercept incoming rockets
  within seconds and cannot realisticly wait for per-engagement approval. Third, a
  loitering munition expected to select and engage targets while the datalink is jammed,
  with the operator able to abort only if the link returns. Make sure at least one
  of these cases produces an answer the engineering team will not like, and say why
  the procedure gives that result.


  End by stating plainly what the procedure cannot determine: which questions remain
  legal or policy decisions for commanders or treaty bodies, what the checklist can
  and cannot guarantee about responsibility, and where the procedure is likely to
  misfire.


