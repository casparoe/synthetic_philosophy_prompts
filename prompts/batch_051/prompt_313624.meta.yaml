  Let me draft a set of commitments on Hobbes:


  Perspective: university student in a political philosophy course, writing up their
  views before a paper/seminar, wants a consistency check.


  Commitments:

  (a) In the state of nature, conflict is inevitable enough that life is nasty, brutish,
  and short — not because people are evil but because of equality of vulnerability,
  scarcity, and mutual distrust (glory, competition, diffidence).

  (b) A covenant made under threat (coercion) is still binding, because what invalidates
  a covenant is not fear but the absence of a common power to enforce it — fear actually
  is part of contracts. (Actually Hobbes says covenants extorted by fear are valid.)

  (c) The sovereign is authorized by each subject, so that the sovereign''s acts are
  the subjects'' own acts; this solves the problem of who judges.

  (d) But subjects retain a right of self-preservation: no one is obligated to obey
  a command to kill, wound, or not resist those who assault them; the right of nature
  (to defend one''s life) cannot be transferred by covenant.

  (e) The sovereign has absolute, undivided power, and there is no right of rebellion
  against the sovereign for any grievance, since the sovereign can do no injury to
  subjects.

  (f) Yet the obligation to obey the sovereign lasts only so long as the sovereign
  can protect the subjects; when the sovereign fails to protect them (e.g., in civil
  war, or when the sovereign''s power is no longer effective), subjects may transfer
  allegiance to a new sovereign who can protect them.

  (g) The laws of nature (justice, gratitude, etc.) bind in conscience (in foro interno)
  always, but not always in action (in foro externo); in the state of nature, where
  there is no security, one may do whatever seems necessary for self-preservation.

  (h) The state of nature continues to exist between sovereign states, so international
  relations remain in a condition of war; this is consistent because "state of nature"
  is defined by absence of a common power, not by a historical stage.


