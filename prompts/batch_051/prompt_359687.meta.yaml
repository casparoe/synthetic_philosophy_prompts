  "The Trustees shall treat economy not merely as a convenience but as an end of this
  Foundation. They shall practise a strict frugality in their own administration,
  and shall lay out no part of the capital or income upon any scheme the like object
  of which could be secured at a smaller charge, it being the Founder''s settled conviction
  that a charity which lives plainly is itself a lesson in the virtue it exists to
  teach: the diffusion of provident habits among the young."


  The Board must now decide a contested matter. A digital agency proposes to place
  short videos on the subject of thrift, budgeting, and the avoidance of debt before
  young people through a network of paid social-media creators. The fee is substantial—roughly
  half of the Foundation''s annual income, and far more than the Foundation has ever
  paid for a single undertaking. The agency''s evidence, however, suggests that no
  other available method would expose so many young people to the message at so low
  a cost per person. The alternative, a lecture series and a printed syllabus in local
  schools, would cost a tenth as much but reach an audience perhaps two percent as
  large. Some trustees argue that the clause binds the Foundation to be frugal in
  what it does, and that commissioning a lavish campaign is therefore a breach even
  if it is instrumentally efficient. Others argue that the clause binds the Foundation
  to promote frugality as a state of the world, and that declining the cheap-per-person
  campaign would spend the Fund''s audience rather than its money, which is the greater
  extravagance.


