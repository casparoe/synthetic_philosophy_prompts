  Acausal blackmail (as discussed by, e.g., Yudkowsky / LessWrong): An agent P is
  a perfect/accurate predictor. P says: "I predict whether you will give me $100.
  If I predict you won''t, I''ll do something harmful to you. This prediction already
  happened; nothing you do now can change it." If P is a reliable predictor, then
  paying doesn''t cause P to not harm you (prediction fixed), but paying is good evidence
  that P predicted you''d pay, so P didn''t harm you. EDT says pay; CDT says don''t,
  because there''s no causal effect. But wait, this is just Newcomb''s problem with
  a blackmail framing: the $1M box already determined; your choices don''t affect
  it. In Newcomb, the predictor punishes you by not putting $1M if predicted two-boxing.
  In acausal blackmail, the predictor harms you if predicted non-payment. So it''s
  Newcomb with a threat. If the prompt says "the prediction already happened and my
