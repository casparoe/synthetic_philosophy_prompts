  Premises:

  (1) If there were laws of historical development, then in principle we could use
  them to predict future states of society.

  (2) Future states of society depend heavily on future knowledge (inventions, discoveries,
  ideas).

  (3) To predict a future discovery, you''d have to specify its content in advance.

