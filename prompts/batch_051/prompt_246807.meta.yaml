  Validity: From (1) and (6), by modus tollens, (7) follows. So the argument is valid
  if (1) and (6) hold. The question is whether (6) follows from (2)-(5). Step (6)
  from (2) and (5): if future states depend heavily on future knowledge, and future
  knowledge can''t be predicted, does it follow future states can''t be predicted?
  Not strictly — you might predict social states via other variables, or predict that
  knowledge will grow without specifying it. But "depend heavily" suggests at least
  some aspect can''t be predicted. The stronger flaw is (1): laws need not enable
  prediction. Many laws (e.g., in chaotic systems, or quantum mechanics?) don''t yield
  full predictability; or laws could exist even if we can''t use them. Also "in principle
  we could use them" — a law of history might be like the second law of thermodynamics,
  giving constraints not predictions. So step 1 is questionable.


