  The subtle confusion: presupposition accommodation means hearers automatically adjust
  the common ground to make utterances acceptable. If so, presupposing something seems
  like a way to get controversial content into the common ground without it being
  asserted or argued for. The theory seems to predict that you can''t challenge presuppositions
  (or shouldn''t), which is empirically false. The confusion: accommodation is not
  automatic acceptance; it''s a fallback, potentially temporary, and presuppositions
  can be denied; also the common ground is normative; the scoreboard is not a guarantee.
  Actually Lewis''s rule of accommodation: "If at time t something is said that requires
  presupposition P to be acceptable, and if P is not presupposed just before t, then
  — ceteris paribus and within certain limits — at t the conversation becomes one
  in which P is presupposed." So accommodation is a rule of scorekeeping, but score
  is revisable; ceteris paribus; within limits. Hearers can object ("Wait, I didn''t
  know you had a sister"). Also there''s Stalnaker''s distinction: presupposition
  as common ground vs speaker presupposition; accommodation is a repair strategy,
  not an epistemic commitment by hearers. And there''s von Fintel''s "limits of accommodation."
  Informative presuppositions like "As you know, ..." are a known puzzle.


