  Draft:


  "I keep using the word ''community'' as if it obviously names something, but I''ve
  realised I can''t actually say what makes a group a community, which is a bit awkward
  given how much weight people put on community dissolving being a loss. I''d like
  a working definition of community, not an encyclopedia entry, and I want you to
  test it against some cases I''ve collected.


  The definition should count these as communities: a close rural village where people
  look after each other''s kids, a synagogue or mosque congregation, a weekly pub
  quiz team that''s met for years. It should not count these: the people who happen
  to get the same 7:40 bus every morning, or everyone who has read the same bestselling
  book. And it should give a definite yes or no for each of these borderline ones,
  even if you have to defend a slightly surprising verdict: an online subreddit for
  people with a chronic illness where regulars know each other''s usernames and histories;
  a workplace where people are friendly during shifts but never meet outside and all
  leave within a year or two; a fanbase for a football club that sings together in
  the stands but has no other contact; neighbours who only interact through a WhatsApp
  group about parking and bin collections; a friendship group that drifted apart a
  decade ago but still call themselves ''the lads'' when they meet at weddings; and
  a whole country during a World Cup.


  Two constraints. First, the definition can''t just track warm feelings or shared
  values, because then a cult or a tight-knit criminal gang would fail it, and I think
  they are clearly communities even though I''d rather not defend them. Second, the
  definition should be usable for the debate about what is lost when communities dissolve:
  it shouldn''t build in from the start that communities are good or that belonging
  is the main thing they provide, because that''s exactly the question.


  Please write it as continuous prose, like an email or letter — no headings, bullet
  points, bold, or tables. Propose the definition, run it through all the cases in
  order, say which ones it gets wrong or where it surprises you, and then either fix
  it or defend the surprise. At the end have a go at saying what your definition implies
  is lost when a community dissolves, if anything."


