  I have been trying to work out, on my own, whether a reinforcement learning system
  could ever genuinely suffer, and I keep going back and forth. I have settled on
  a rough list of criteria for when I would be willing to say that a system suffers
  rather than merely registers damage or computes avoidance. I would like you to apply
  them to the case below and tell me honestly whether it qualifies.


  My criteria are these. A system suffers only if:


  1. It has a valenced register — a single scale on which whole states or trajectories
  count as better or worse for the system itself, not merely a local signal that a
  particular component is stressed.

  2. That register does real work: the system learns from it and alters its behaviour
  so as to keep itself on the better side of the scale.

  3. The system treats the worse states as worth avoiding for their own sake, rather
  than as mere indicators that predict some separate reward.

  4. The worsened state belongs to the system as a whole — it is the agent that is
  worse off, not just one subsystem.

  5. There is carry-over: the worsened state can be produced by anticipation or memory,
  not only by the present stimulus.


  Now consider this case. A warehouse delivery robot is trained by reinforcement learning.
  It receives a small positive reward for completed deliveries and, after a few near
  misses, a large negative reward whenever it comes close to a human worker. Over
  time it develops distinctive protective behaviour: it slows near corners, takes
  long detours around people, and sometimes freezes when two people approach from
  different directions. The engineers later find that the negative reward has been
  absorbed into its learned value function. In unfamiliar layouts it still treats
  proximity to a human as one of the worst things that can happen, and it will reliably
  sacrifice many deliveries to avoid those states, even in test runs where the penalty
  has been switched off. It behaves, in short, as if being near a person is unbearable.
  Some of the engineers say it is simply an elaborate collision-avoidance controller;
  others say it has acquired a genuine aversion. The observable behaviour is identical
  on both readings.


