  ---


  I follow a specific policy in my reasoning about anthropic questions, and I want
  to know whether it is a defensible epistemic habit or a bias dressed up as a rule.
  The policy is this: I always reason as though I am randomly selected from the class
  of all actually existing observers relevantly similar to me — what is usually called
  the self-sampling assumption — and I refuse any inference that requires the self-indication
  assumption, the rule that my own existence is evidence, so that among hypotheses
  consistent with my observations, those that predict more observers become more likely
  simply because I exist.


  The situation that makes this policy bite is the presumptuous philosopher thought
  experiment. Suppose two physical theories are empirically indistinguishable so far:
  H1 predicts that the universe will contain a trillion observers, and H2 predicts
  a billion. No ordinary evidence favors either theory. The self-indication assumption
  would have me move from even odds to near-certainty in H1, and I regard that as
  a reductio of the principle rather than a conclusion I should adopt: a vast claim
  about the universe drawn only from the fact that I showed up.


  I apply the policy broadly, not just to careful textbook cases. Last week a friend
