  I''ve been working through epistemic utility theory on my own—the program that tries
  to ground the norms on credences (degrees of belief) in the single demand that they
  maximize expected accuracy, where accuracy is just closeness to the truth. The more
  I play with it, the more I want to add a second score to the ledger, and I''ve started
