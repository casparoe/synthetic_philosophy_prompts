  Program equilibrium: In one-shot Prisoner''s Dilemma, two players can cooperate
  if each knows the other''s source code / strategy. Classic idea (Tennenholtz 2004,
  "Program equilibrium", and related to Löb''s theorem by Barasz et al., "Robust cooperation
  in the Prisoner''s Dilemma"). The mechanism: players submit source code/programs
  to a referee that can run them with knowledge of the other''s code; both programs
  decide cooperate/defect. If program A is "cooperate iff B cooperates iff A cooperates"
  — these "quining" programs can cooperate via mutual reference, and there''s a paradox
  with "defect iff the other cooperates" (like liar paradox). A well-known result:
  there are programs that cooperate with copies of themselves but defect against defectors,
  but paradoxes arise.


  A mechanism-type prompt could be: someone proposes a court/arbiter for business
  agreements: instead of signing contracts in natural language, each party submits
  the source code of a strategy to a neutral computer, and the computer runs both
