  Let me think about the actual philosophical content to make it substantive.


  The tautology objection: If "fitness" = "differential reproductive success" (actual
  survival and reproduction), then "natural selection favors the fit" or "the fittest
  survive" comes out as "those that survive and reproduce are those that survive and
  reproduce" — a tautology, not an empirical claim. The propensity interpretation
  (Mills and Beatty 1979, Brandon, Sober) says fitness is a probabilistic disposition—an
  organism''s expected number of offspring, or a probability distribution over possible
  numbers of offspring—which is tied to physical traits (running speed, disease resistance)
  and can be measured independently of actual reproductive success. This makes "the
  fitter tend to leave more offspring" an empirical claim: a propensity can fail to
  be realized (a very fit organism can be struck by lightning). So the propensity
  view blocks the tautology.


  Desiderata an adequate account of fitness should meet:

  1. Non-tautological / empirical distinctness: fitness must be characterizable independently
  of actual survival/reproductive outcomes, so that natural selection claims are falsifiable.
  Motivating case: the tautology objection itself. Non-negotiable.

  2. Explanatory/predictive: fitness should explain and predict differences in reproductive
  success, not merely redescribe them. The case: we want to say why the peppered moths
  or antibiotic-resistant bacteria spread; if fitness just is the spread, no explanation.

  3. Probabilistic rather than deterministic: a fitter type can lose out due to drift
  or bad luck; fitness must allow for chance. Case: sampling error in small populations;
  a rare beneficial allele can be lost to drift.

  4. Trait-based/grounded in organism-environment interaction: fitness should be supervenient
  on or realized by physical properties (leg length, enzyme efficiency), so it''s
  not a hidden vital force. Case: we want to know what makes one organism fitter;
  cite running speed in cheetahs.

  5. Distinguish "fit enough" vs "fitter": selection is comparative; adequacy doesn''t
  require absolute cardinal units. Possibly negotiable.

  6. Handle levels/timescales: fitness is assigned to alleles, genotypes, organisms,
  groups sometimes; an account should say the primary bearer or explain how levels
  relate. Case: heterozygote advantage (sickle-cell) shows organism-level and allele-level
  fitness come apart.

  7. Make sense of frequency-dependence and environmental relativity: fitness isn''t
  a fixed number for a type across all contexts; it can depend on the frequency of
  the type (rare-type advantage). Case: apostatic selection in prey color morphs,
  or Fisher''s sex ratio. An account that treats fitness as a context-free property
  will mispredict. This is a nice niche injection.

  8. Consistency with drift: distinguish selection from drift; not every difference
  in reproductive success is due to fitness differences. Case: two equally fit types
  can diverge by chance. So fitness must not be defined as actual reproductive success—else
  selection and drift collapse. Non-negotiable? I''d say yes.

