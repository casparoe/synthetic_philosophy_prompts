  ---


  I am a retired physicist who has lately been reading moral philosophy, and I keep
  finding simplicity invoked as if it carried the same weight in ethics that it carries
  in the physical sciences. I am planning an essay titled something like "Parsimony
  in Ethics: A Borrowed Virtue?" and would be grateful for comments on the following
  sketch.


  The central claims I want to defend are:


  1. In physics, parsimony is not an independent mark of truth. It is a practical
  bias toward theories that are easier to use, test, and falsify; we abandon it as
  soon as the data demand added structure (for example, the baroque but well-supported
  machinery of current cosmology). The data get the final say.


  2. In ethics, the closest analogue to "data" is the set of considered judgments
  or intuitions that a theory is meant to fit. But these data are unlike physical
  measurements: they are more theory-soaked, more variable across persons and cultures,
  harder to weight, and not generated by a process known to be sensitive to a common
  underlying structure. So we cannot assume that the simpler theory is more likely
  to track the "true" moral order, because the fit between theory and intuition is
  not an independent test of anything.


  3. What ethical parsimony really buys is cognitive manageability: a one-principle
  theory is easier to teach, apply, and criticize. That is a pragmatic virtue, not
  an epistemic one. The essay''s main thesis would be that simplicity in ethics should
  function only as a tiebreaker between theories that are otherwise equal in fit with
  reflective judgments, and that even then the simplicity should be credited to the
  theory as an instrument of understanding rather than as evidence of truth.


  4. A corollary: the fact that a moral theory needs epicycles—special exemptions,
  auxiliary duties, agent-relative permissions—is not by itself a strong objection
  to it. The strong objection must be that the added complications are unprincipled
  or fail to fit the considered judgments at issue, not merely that they are complications.


  I would particularly welcome comments on (a) whether my contrast between physics
  and ethics is too neat, (b) whether my use of "intuitions as data" misrepresents
  how contemporary moral philosophers think about theory choice, and (c) whether distinguishing
  epistemic from pragmatic parsimony in the way I do simply relocates the problem
  rather than solving it.


