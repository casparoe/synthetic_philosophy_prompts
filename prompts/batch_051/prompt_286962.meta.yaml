  Potential essay notes:


  Title: "Parsimony in Ethics: A Borrowed Virtue?"


  The author (retired natural scientist) would like comments on an essay idea. Notes:


  1. In physics, simplicity has been treated as a guide: general covariance, Occam''s
  razor, Einstein''s "as simple as possible"... But in physics simplicity is checked
  empirically; a simpler theory can be wrong (Ptolemy vs Kepler? Actually Copernicus
  wasn''t simpler maybe). Physicists accept complexity when data demand (e.g., Lambda-CDM
  with dark matter/energy, many parameters). Simplicity earns its keep by organizing
  predictions and error.


  2. In ethics, theories aim to account for "data" of considered judgments/intuitions.
  But unlike physical data, moral intuitions are not independent measurements: they
  are culturally variable, shaped by theory, sometimes contradictory, and there is
  no agreed procedure for weighting them. A theory with one principle and many auxiliary
  patches (e.g., a monistic consequentialism plus agent-relative prerogatives, deontic
  constraints, special duties, desert adjustments) may look less parsimonious, but
  parsimony here may just measure how many accommodations are pushed into unprincipled
  exception clauses.


  3. So there is less reason to think the simpler theory is more likely to be true
  (since "true" fit to moral data is not an independent test), but simplicity may
  still be a cognitive virtue: it aids understanding, teaching, consistency, public
  justification. Ethical parsimony is thus closer to elegance of a classification
  than to evidence of truth.


  4. Proposed thesis: Simplicity in ethics should be treated as a tiebreaker only
  after fit with pre-theoretic and reflective judgments is held equal, and even then
  its value is pragmatic, not alethic. It is not a standing argument against complex,
  disjunctive moral systems.


