  in bumblebees. The protocol involves tethering individual bees and using mild electric
  shocks as a punisher while they learn an odour discrimination task; the shocks are
  described as ''mild'' but the bees'' reactions include struggling and attempted
  escape. Our current policy protects vertebrates and cephalopods and simply does
  not classify insects as animals to which welfare provisions apply. The researchers
  argue that bees are useful models precisely because their behaviour can be explained
  without supposing any subjective experience, and that extending vertebrate-style
  protections to a bee would be a sentimental category mistake. Two other committee
  members disagree sharply: they point to the bees'' sophisticated navigation, social
  learning, and even apparently play-like behaviour, and argue that we should apply
  a precautionary principle. I have been asked to draft the short decision memo for
  next week''s meeting. It should recommend one of three courses: approve as filed,
  reject the proposal, or approve with conditions. It should give reasons the researchers
  and the other committee members could actually respond to, and it should engage
  seriously with the strongest consideration on the losing side rather than caricaturing
  it. I would also like the memo to address the underlying question honestly: what
  kind of evidence could ever settle whether a bee is conscious, and how should a
  committee act when that evidence is genuinely uncertain? Please say how confident
  you are in your recommendation and single out the point you are least sure of. The
  memo should be in American English."


