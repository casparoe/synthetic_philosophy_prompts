  Draft:


  "I can''t stop noticing a structural parallel between the grandfather paradox in
  time-travel discussions and the way computability theory handles self-referential
  definitions, and I want to know whether it goes deeper than a metaphor.


  On the time-travel side: the paradox is usually set up as someone traveling back
  and killing their grandfather before their parent is conceived, which removes the
  traveler''s existence and therefore removes the act of killing. The contradiction
  looks like an equation with no solution: the timeline at a moment has to satisfy
  a constraint that its own causal consequences rule out. The usual rescue is to require
  that the timeline be self-consistent — that the traveler''s actions, whatever they
  turn out to be, already belong to the one fixed history.


  On the computability side: you can specify a program in terms of its own behavior
  (''a program that does X if and only if it does not do X''), and some such specifications
  have no solution while others do. The general phenomenon is that self-referential
  definitions often boil down to solving x = F(x) for some transformation F, and we
  have precise tools for this: a fixed-point combinator turns a self-referential description
  into an actual program when a fixed point exists, and Kleene-style recursion theorems
  say that surprisingly many such equations have solutions; the ones that don''t are
  the analogues of the paradox.


