  Draft:


  "I''ve been thinking about a parallel between the way sign languages organize grammar
  and the distinction between sequential and concurrent computation, and I want to
  know whether it is illuminating or just a loose metaphor.


  Most theoretical linguistics — even when it doesn''t say so — treats the fundamental
  medium of language as a linear string ordered in time: morphemes concatenate, movement
  leaves gaps in a sequence, and structure building is read off an ordered terminal
  string. Spoken languages fit that medium naturally. But sign languages exploit the
  visual–gestural channel differently: a single sign can carry several morphemes at
  once (handshape plus movement plus location plus a non-manual marker), and the two
  hands can even run independent morphological processes in parallel. So the grammar
  is, in part, concurrent rather than serial: multiple derivations appear to be evaluated
  at the same time instead of one after another.


  My question is whether this is a real structural parallel to the difference between
  sequential and parallel computation. In computing, the switch from sequential to
  concurrent systems forces one to abandon a global notion of linear order: processes
  interleave, race conditions become possible, and well-formedness is not just a matter
  of each process being correct in isolation but of their combined execution. If the
  analogy is deep, one would expect sign language grammars to face analogous issues
  — e.g., constraints on what two simultaneous morphological processes may do together,
  and ways of resolving conflicts when they clash. If it''s only superficial, signed
  and spoken languages are just different encodings of the same sequential syntactic
  structure, and the simultaneity is phonetic packaging, not grammatical concurrency.


  Is there a real identity of structure here, or am I pattern-matching on the word
  ''parallel''? What would have to be true of grammatical description for results
  to transfer from concurrency theory to sign language — and what does the analogy
