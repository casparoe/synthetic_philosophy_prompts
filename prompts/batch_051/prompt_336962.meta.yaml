  Draft:


  "I write as a retired natural scientist now reading decision theory and formal epistemology,
  and I find myself puzzled by two results that are often quoted side by side and
  never cleanly separated. On the one hand, Good''s theorem says that a Bayesian expected-utility
  maximiser can never be made worse off in expectation by free information, so there
  is never a decision-theoretic reason to refuse to look. On the other, the Bayesian
  convergence results, from Doob''s martingale theorem to the Blackwell–Dubins merging-of-opinions
  result, are usually glossed as ''priors wash out'': given enough shared evidence,
  two agents'' posterior beliefs, or at least their predictions, will come to agree.
  I would like a careful comparison of the two ideas. Please set out exactly what
  each result assumes and licenses, without appeal to external sources, and then say
  whether they are two faces of a single principle or genuinely different claims that
  happen to sit together in the Bayesian package. In particular, consider a case where
  one agent would prefer not to receive a free piece of evidence although both agents
  would eventually converge if they did receive it: does Good''s theorem rule that
  preference out, and if so under which assumptions? Also consider whether convergence
  implies anything at all about the value of the information along the way, and whether
  the two results fail under different conditions, for instance with imprecise probabilities,
  non-stationary hypotheses, or utilities that depend on the agent''s beliefs themselves.
  End with your own judgement about which result deserves to carry the weight in arguments
  that Bayesian rationality is epistemically self-correcting."


