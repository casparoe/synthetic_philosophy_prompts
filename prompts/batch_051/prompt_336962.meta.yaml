  of information is nonnegative, and strictly positive if there''s a decision for
  which information might matter. The classic result: free information can''t hurt
  a rational decision-maker. But philosophical nuances: information can hurt if it
  changes preferences of others, or if agents are not decision-theoretic, or if the
  choice set changes, or if deterministic tie-breaking, or emotional cost, or non-Bayes
  updating (Kadane et al? There are famous counterexamples by Kadane, Schervish, Seidenfeld?
