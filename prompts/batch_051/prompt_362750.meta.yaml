  falsehood that reliably serves the hearer''s interests is not wrong as a lie, and
  is permissible.


  (4) The Santa and tooth-fairy practices are benevolent falsehoods told to children
  who lack the relevant agency, and they serve genuine interests: wonder, shared imaginative
  play, a gradual education in the difference between fiction and testimony, and an
