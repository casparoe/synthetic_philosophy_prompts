  A friend has shown me that the familiar defence of the Santa and tooth-fairy deceptions
  may prove far too much, and I cannot locate the bad step.


  (1) The wrong-making feature of lying is that it bypasses the hearer''s rational
  agency: the liar substitutes his own judgment about what the other shall believe
  instead of giving a fellow epistemic agent the truth to weigh. There is no further
  wrong-making feature over and above this.


