  Standard BHW binary model: Two states of the world, V=1 or V=0, equally likely.
  Each agent receives a private signal X_i ∈ {High, Low} with P(High | V=1) = p >
  0.5, P(High | V=0) = 1 - p. Agents choose in sequence; each observes all previous
  actions (not signals) and her own signal; each chooses action 1 or 0 to maximize
  probability of matching the state (or expected payoff). Tie-break rule: when indifferent?
  First agent follows signal (since posterior = p > 0.5). Second: if signals of first
  two match, the action sequence is two same; if different, posteriors? Second observes
  first''s action and own signal. If first chose 1, own signal Low. Likelihood: P(first=1,
  own Low | V=1) = p*(1-p). P(first=1, own Low | V=0) = (1-p)*p. So equal → posterior
  0.5. Tie. BHW assume tie-break e.g., by own signal or random. Many presentations
  assume the second follows her own signal when the first two signals conflict (with
  50/50 tie broken by signal). Then two matching actions iff first two signals match.
  Third observes two 1s. If own signal Low, posterior odds = [p^2 (1-p)] / [(1-p)^2
  p] = p/(1-p) > 1 → posterior of V=1 is p > 0.5, so choose 1 ignoring own signal.
  Cascade. If third''s own signal High, choose 1 anyway. So from third on, all choose
  1 regardless of signals; public actions become uninformative. A cascade can be wrong:
  with probability (1-p)^2? Actually two low signals in state 1? Let''s compute probability
  of wrong cascade. If V=1, probability first two signals both Low (leading to cascade
  on 0) is (1-p)^2. If V=0, probability first two signals High leading to wrong cascade
  on 1 is (1-p)^2. So unconditional? Fine, positive probability of wrong cascade.
  As p→1, wrong cascades vanish; as p just above .5, can be large. Good.


