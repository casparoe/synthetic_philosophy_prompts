  information poorly, and that complaining about it is like complaining about the
  weather. Stay in character until I say ''stop.'' Keep each reply to a single paragraph;
  be technically precise; concede only peripheral points (for example, that cascades
  are fragile to public information releases, or that real people also herd for non-rational
  reasons), never the main claim that the cascade behavior is what Bayesian rationality
  demands. Here is my opening move: in the standard setup, each person privately observes
  an independent draw from one of two urns, and then chooses in sequence after seeing
  all previous choices. If the first two people happen to choose the wrong urn, the
  third person''s private signal is swamped: a Bayesian should rationally ignore it
  and follow the crowd — and so should everyone after. Yet as soon as the fourth or
