  The asker''s opening move could be:


  "Consider the standard setup: each person receives a private binary signal of the
  same reliability p > 1/2 about which of two restaurants is better, and chooses in
  sequence after seeing all previous choices. If the first two people both choose
  A, the third person should choose A even if his own signal says B, since two matching
  public choices outweigh one private signal; thereafter everyone joins the line.
  Now suppose we are the hundredth person. I can see ninety-nine people in front of
  A. But I can also compute that, in equilibrium, ninety-seven of those choices are
  pure conformity: once the cascade began with the first two, each later person was
  rationally ignoring a signal that might have contradicted the line. So the hundred-person
  line, stripped of theater, contains two independent pieces of evidence and ninety-seven
  redundant votes. And here is the part that bothers me: I am about to become the
  ninety-eighth redundant vote. I know my choice will be uninformative to everyone
  after me, and I know the consensus I''m joining rests on two draws, yet you say
  the rational thing is to add my body to the line and call the result ''information
  aggregation.'' How is that not a kind of epistemic bad faith — a system of rational
  individuals collectively pretending to have a hundred pieces of evidence when they
  have two?"


