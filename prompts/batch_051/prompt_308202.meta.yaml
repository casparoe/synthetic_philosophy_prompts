  The separateness of persons objection: Classical utilitarianism treats aggregate
  utility as if it were a single person''s utility. It permits (requires) harming
  one person to benefit others when total utility increases. The objection says this
  ignores the distinctness and separateness of persons: there''s no single subject
  who experiences the sum of utilities, so the sort of intrapersonal tradeoff that
  justifies sacrificing present pleasure for future good has no interpersonal analogue.


