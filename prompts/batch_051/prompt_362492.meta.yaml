  Ergodicity economics (Ole Peters, Murray Gell-Mann, and others; also earlier work).
  Key idea: for multiplicative processes (wealth dynamics), the ensemble average can
  diverge from the time average. A gamble that is favorable in expectation (ensemble
  average increases) can nevertheless lead to almost certain decline over time for
  any single agent (time average decreases). Example: a gamble where you win 50% or
  lose 40% with equal probability: expectation = 0.5*1.5 + 0.5*0.6 = 0.75 + 0.3 =
  1.05, so 5% gain in expectation per round. But the time-average growth rate is geometric
  mean: sqrt(1.5*0.6) = sqrt(0.9) ≈ 0.949, so wealth decays at about 5.1% per round
  along a typical path. Repeatedly staking your entire bankroll on this favorable
  bet leads to near-certain ruin, even though the ensemble average explodes (because
  a vanishingly small fraction of paths become astronomically rich, and they dominate
  the mean).


  This is the basis for a nice clash: expected value maximization says take the bet
