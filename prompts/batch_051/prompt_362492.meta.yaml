  one is not a rule I can live by. The resolution in ergodicity economics: for a repeated
  multiplicative gamble, what matters to a single agent is the time-average (geometric)
  growth rate, maximized by log utility / Kelly criterion; the ensemble perspective
  is appropriate if you''re averaged over many parallel copies or if you can truly
