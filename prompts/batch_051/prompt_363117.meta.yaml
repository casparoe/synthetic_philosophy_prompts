  Argument:


  (1) A person is not blameworthy for Φ if Φ was countenanced by the prevailing moral
  norms of their society.

  (2) Jefferson (slavery), Churchill (racial hierarchy), Columbus (conquest) each
  acted within prevailing norms.

  (3) So they are not personally blameworthy.

  (4) If the participants in a practice are not blameworthy, then the practice itself
  cannot be judged wrong — or at least cannot be criticized in a way that licenses
  moral condemnation of its practitioners.

  (5) By parity, no practice that is widely accepted in any era can be wrong to practise
  in that era.

  (6) Hence moral criticism of a practice by outsiders or posterity is never justified
  when the practice was accepted by its practitioners'' own society.

  (7) But posterity''s criticism of slavery and colonial conquest is justified; these
  practices were wrong, not merely wrong-by-our-lights.

