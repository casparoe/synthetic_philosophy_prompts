  loses. (4) But I also rationally believe that exactly one ticket wins, since the
  lottery is fair and I know its setup. (5) Since ''every ticket loses'' is inconsistent
  with ''exactly one ticket wins'', (1)–(4) entail that I rationally believe a contradiction.
  (6) But rational belief cannot be inconsistent — a set of beliefs that is jointly
  inconsistent cannot all be rationally held. So at least one premise must go.


