  pressed by e.g., Bernard Williams in "A Critique of Utilitarianism" (but that''s
  integrity), and by Susan Wolf "Moral Saints" (demandingness of being morally perfect).
  Also Samuel Scheffler "The Rejection of Consequentialism".

  - Mistake: claiming that demandingness objection is decisive because it shows consequentialism
  is false, when in fact it only shows it conflicts with intuitions; a consequentialist
  can bite the bullet.

  - Mistake: conflating "demandingness" with "overriding project commitments" without
  noting the special obligations problem.

  - Mistake: saying rule consequentialism avoids demandingness — actually rule consequentialism
  might still demand a lot if the optimal rules demand heavy sacrifice.

  - Mistake: conflating act-utilitarianism with consequentialism generally.

  - Mistake: claiming "ought implies can" resolves demandingness — no, it''s not about
