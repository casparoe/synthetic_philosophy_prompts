  Domain: Demandingness objections to consequentialism. Key ideas:

  - Act consequentialism demands too much: we''d have to sacrifice most of our personal
  projects, relationships, rest, etc., because maximizing impartially would direct
  resources to where they do more good.

  - Peter Singer''s pond argument / famine affluence and morality: if we can prevent
  bad things without sacrificing anything of comparable moral importance, we ought
  to.

