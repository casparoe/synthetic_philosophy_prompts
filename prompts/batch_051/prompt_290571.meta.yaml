  1% of income? Actually Singer suggests giving.

  - Demandingness objection: utilitarianism/consequentialism is too demanding; requirement
  to maximize; alienates us from personal projects and special obligations; integrity
  objection (Williams) — but Williams'' integrity objection is related but distinct
  from demandingness. Conflation of demandingness and integrity objections.

  - Possible replies: (a) bite the bullet — morality is demanding; (b) rule consequentialism
  or satisficing consequentialism; (c) reject maximizing; (d) demandingness as a feature
  not a bug; (e) Scheffler''s agent-centered prerogative; (f) distinction between
  duty and supererogation; (g) Liam Murphy''s collective principle; (h) sliding from
  "ought" to "can"? Not exactly.


  Subtle mistakes a student might make:

  - Conflating demandingness objection with Williams''s integrity objection / alienation.

