  Signaling theory basics:

  - Zahavi''s handicap principle: signals must be costly to be honest; e.g., peacock''s
  tail is costly to grow/maintain, only high-quality males can bear it, so females
  can rely on it as an honest signal of genetic quality.

  - Grafen''s formalization: costlier for low-quality signalers; honest if marginal
  cost is higher for low-quality.

  - Spence: education as signal, cost differs by ability.

  - Stotting (gazelle jumping in front of predator): costly display, only fast gazelles
  can afford it.

  - Advertising as signal (Nelson 1974): wasteful advertising can signal quality because
  only high-quality firms expecting repeat purchase can profit from it. Actually the
  logic: advertising as information vs. persuasion. The "burning money" argument.


  The analogy mapping:

  - Peacock''s tail (signal) ↔ lavish advertising / flagship stores / expensive sponsorships

  - Peahen (receiver) ↔ consumer

  - Peacock (signaler) ↔ firm/brand

  - Genetic quality (underlying quality) ↔ product quality / long-term reliability

  - Cost of the tail ↔ ad spend / high prices / expensive store buildouts

  - Fitness payoff to peahen ↔ consumer utility from choosing a quality product

  - Reproductive success ↔ market share/loyalty


  Where it breaks:

  1. Receiver cost asymmetry: peahen''s choice cost is mainly opportunity/predation;
  consumer''s reliance on ads can be gamed because ad spend is not directly tied to
  quality — a high-price, high-ad low-quality product can exist, especially in experience/credence
  goods with one-shot purchases (tourist restaurants). Repeat purchases may differ.

  2. In biological signaling, the cost is paid by the signaler each time and is tied
  to the signaler''s genotype/phenotype; in advertising, firms can finance ad spend
  with capital, so cash-rich but low-quality entrants can signal falsely for some
  time; the market may not iterate like natural selection (receivers don''t always
  enforce).

  3. Natural selection optimizes over generations; consumers have bounded rationality,
  are susceptible to psychological persuasive effects (mere exposure, status), so
  ads don''t only inform — they change preferences. The analogy imports "receiver
  is well-adapted, not manipulated."

  4. Peacock''s tail is a signal of genetic quality to a choosy receiver; the costly
  ads are partly aimed at intermediaries/investors/employees, multiple receivers,
  and some spending is for search costs/information (making known), not purely handicap.

  5. The handicap principle requires differential cost: the signal must be costlier
  for low-quality signalers. In advertising, cost is often not systematically higher
  for low-quality producers — money is money; a well-funded startup can match spending.

  6. The conclusion "consumers are rational to prefer heavily advertised brands" may
  not follow because the signal can be disabled by the above; but also effect: ad
  spending could correlate with quality for repeat-purchase experience goods (Nelson),
  less for credence goods.

  7. Price itself: for luxury goods, high price is a signal but also a cost to the
  consumer; the analogy to sexual selection (cost to signaler only) breaks: Veblen
  goods make the receiver pay for the signal.


