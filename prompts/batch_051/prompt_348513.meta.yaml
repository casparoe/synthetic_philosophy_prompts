  their physiological responses, but never the property in question itself. With one
  positive example, no negative examples, and a target variable that is unobservable
  from the outside, the posterior over how common first-person experience is among
  human-like systems is almost entirely fixed by the prior. On this picture, the ordinary
  person who concludes that others are conscious is running a generous prior; the
  solipsist is running a miserly one. No future evidence can adjudicate, both because
  the disputed property is private by construction and because the single positive
  observation is guaranteed by the setup: there is no version of the dataset in which
  the collector lacks a first-person point of view. So the dispute seems, by my lights,
  to be a dispute about prior choice plus a norm about how priors may be chosen, and
  not about evidence at all.


