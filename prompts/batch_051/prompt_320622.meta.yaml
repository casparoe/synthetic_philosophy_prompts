  Harsanyi''s aggregation theorem: Suppose each individual i has a vNM utility function
  U_i over social alternatives (lotteries). Suppose the social planner has a vNM utility
  function W over lotteries that is a function W = F(U_1, ..., U_n) of individual
  utilities, and the social preference satisfies the Pareto condition (if all individuals
  are indifferent between two lotteries, society is indifferent; and if someone strictly
  prefers and no one strictly disprefers, society strictly prefers — the ex ante Pareto).
  Then W must be a weighted sum (affine combination) of individual utilities: W =
  Σ a_i U_i + c. Thus social welfare is utilitarian in the sense of being additive
  in vNM utilities, not egalitarian (no concave transformation applied to U_i, no
  leximin, etc.), assuming Pareto indifference over lotteries.


  The controversial part: the theorem only works if the individual utilities are vNM
  utilities (cardinal, unique up to positive affine transformations). But vNM utilities
  represent risk attitudes too. Egalitarians like John Broome argue Harsanyi''s theorem
  conflates utility levels with vNM utilities; the theorem requires that individual
  utility be measurable in a way that makes interpersonal comparisons meaningful,
  and vNM scaling doesn''t give that. Sen and Weymark criticize. Also, to construct
  the SWF from individual vNM utilities, the "utilities" must be co-cardinalized (a
  common scale), but vNM theory doesn''t fix interpersonally comparable scales. So
  the theorem shows that IF we already have interpersonally comparable cardinal individual
  utilities and accept ex ante Pareto and vNM rationality at the social level, then
  social welfare is additively separable (weighted sum). But the "utilitarian" conclusion
  is cheap if utilities are defined to make the functional form linear.


  There is also the ex ante/ex post issue: the Pareto condition in Harsanyi''s theorem
  is ex ante (over prospects), which is controversial. If we use ex post Pareto instead
  (over outcomes), we don''t get the same result; also under uncertainty, ex ante
  Pareto conflicts with ex post egalitarianism (e.g., Myerson''s example, Fleurbaey).


