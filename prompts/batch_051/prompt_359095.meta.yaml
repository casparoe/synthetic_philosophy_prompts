  Draft:


  "I keep coming back to a detail of research ethics that is rarely made explicit.
  Ethics committees in most jurisdictions will approve a randomized controlled trial
  only if the trial is in clinical equipoise, meaning that the relevant community
  of expert clinicians is genuinely divided about which of the two arms is better
  for the patient. Yet almost no committee requires that every physician who actually
  recruits patients into the trial be individually undecided. A cardiologist who is
  privately convinced that drug A is superior to drug B may, once the trial is approved,
  honestly explain the options to her patients and enroll them in a trial that randomizes
  them between A and B, so long as the community as a whole is in genuine disagreement
  and the patients consent. The institution therefore refuses to let a doctor randomize
  on the strength of her private uncertainty, but permits her to randomize on the
  strength of the community''s uncertainty while her own uncertainty is absent. I
  would like a careful reconstruction of what this practice presupposes. Does it presuppose
  a particular account of the physician''s duty to the individual patient, for instance
  that the duty is owed partly to a professional community''s epistemic state rather
  than to the patient as such? Does it presuppose that there is a morally relevant
  difference between a doctor''s private clinical judgment and the certified uncertainty
  of a field, and if so, what is that difference? Or can the whole practice be defended
  without any such presupposition, by treating both trial arms as accepted care and
  the individual doctor''s leaning as a mere preference that the patient may reasonably
  waive? I want you to distinguish what the practice strictly presupposes from what
  it merely fits with, and to say where it is philosophically underdetermined, so
  that several rival accounts of medical obligation could license it. Then tell me
  what would have to change in the regulation of trials if the presupposed picture
  were rejected and replaced with a rule that a physician may enrol a patient only
  when she herself is in equipoise. Please answer in continuous prose, as in a letter
  or an email, without headings, bullet points, bold text, or tables."


