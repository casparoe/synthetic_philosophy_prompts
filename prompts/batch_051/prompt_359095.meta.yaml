  Prompt idea:


  "Here is a fact about how randomized trials are governed that has always struck
  me as strange. In most jurisdictions an ethics committee will not approve a randomized
  controlled trial unless it is in what is called clinical equipoise: the expert clinical
  community, taken as a whole, must be genuinely divided about which of the study
  arms is better for the enrolled patient. But almost no one demands that each individual
  physician who recruits patients into the trial be personally undecided. A cardiologist
  who is privately convinced that drug A is better than drug B may still enroll her
  patients in a trial that randomizes them between A and B, provided the trial is
  approved and the patient consents. So the rule says: a trial may be conducted only
  when the community is uncertain, but it may be conducted with patients who are in
  the care of doctors who are not uncertain. The same ethics committee that would
  condemn a doctor for secretly assigning patients according to her own hunch will
  approve a trial in which that same doctor honestly tells patients that the question
  is unsettled and then lets a randomizer decide. I want a careful reconstruction
  of what this asymmetry presupposes about the physician''s obligation to the individual
  patient, about the authority of clinical communities over clinical judgments, and
  about the nature of the uncertainty that makes randomization permissible. Does the
  practice strictly presuppose that a physician''s duty to the patient is partly a
  duty to act on the community''s epistemic state rather than her own? Or is it better
  read as presupposing that a patient may consent to forgo the doctor''s personal
  opinion in exchange for contributing to a shared inquiry? Could the practice instead
  be explained without any distinctive presupposition about epistemic authority at
  all — say, by treating both arms as professionally accepted care and the physician''s
  private hunch as a mere non-evidential preference? And if the presupposition is
  tacit, what would have to change in the regulation of trials if we made it explicit,
  or if we replaced it with a principle that each physician may randomize only when
  she herself is in equipoise? Please write in continuous prose, as you would in a
  letter or an email: no headings, bullet points, bold text, or tables."


