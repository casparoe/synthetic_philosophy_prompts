  Detailed prompt draft:


  "I teach an upper-level undergraduate seminar called ''Concepts and Categories''
  (philosophy of mind/cognitive science), 16 students, one 90-minute session. I want
  a structured activity built around Bongard problems — the two-box puzzles where
  six simple drawings on the left obey a rule that all six on the right violate, and
  the task is to infer the rule. I want students to feel, not just be told, three
  things: (a) six positive and six negative examples radically underdetermine the
  intended concept; (b) the ''obvious'' solution is being selected by tacit preferences
  for simplicity, naturalness, or familiar vocabulary rather than by the examples
  alone; (c) even with the right to probe the designer with new test cases, a finite
  number of probes still leaves the concept underdetermined. Design the activity as
  a game with designers and solvers, rules, a scoring system that uses points rather
  than money, a concrete timeline, and a minimal set of materials (paper, pens, maybe
  a restricted shape vocabulary). The students should run into the underdetermination
  themselves — ideally by successfully defending alternative rules against a designer
  — before the debrief names it. In the debrief, map exact moments of the game onto
  the three ideas, say what will predictably go wrong the first time I run it and
  how to handle it, and be frank about which feature of real concept induction from
  few examples the activity cannot reproduce."


