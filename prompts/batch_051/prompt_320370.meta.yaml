  Core mechanic — "construction and counterexample":


  - Phase A: Pairs design a hidden concept as a rule over a restricted vocabulary
  (e.g., shapes with properties). They choose 6 left "instances" and 6 right "instances"
  that satisfy/ not satisfy the rule. They write the rule on a folded slip (sealed).

  - Phase B: Another pair (the solvers) must guess the rule. They may (a) inspect
  the 12 instances, and (b) propose up to N "new instances" — they draw or describe
  a new instance, and the designers must classify it left/right according to their
  hidden rule (this is active learning, membership queries).

  - Phase C: The solvers, after at most K queries, write their guessed rule and also
  write a "spite rule": a different rule that is consistent with all 12 original instances
  and all query answers, but which they think the designers were not using. Points:
