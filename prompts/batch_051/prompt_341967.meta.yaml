  Let me draft the prompt:


  ---


  A colleague in our department''s formal epistemology reading group gave me a rule
  he says he uses in practice: when you have no evidence that bears on whether two
  variables are linked, treat them as independent. I''ve been trying to write it down
  carefully and I keep getting an argument that seems to show the rule is either empty
  or self-defeating. Here it is, numbered like we do in the group:


  (1) If you have no evidence bearing on the relationship between X and Y, you should
  treat X and Y as probabilistically independent.

  (2) Treating X and Y as independent means assigning probability 1 to the hypothesis
  that they are independent (say, that their correlation is exactly 0).

  (3) If you assign probability 1 to a hypothesis, Bayesian updating can never move
  you off it: no pattern of observations can lower its probability.

  (4) So someone who follows (1) and (2) can never come to discover that X and Y are
  correlated, no matter how strong the observed association becomes.

  (5) But people who follow the presumption do in fact learn correlations from data
  all the time—smoking and lung cancer is the standard illustration—so the rule as
