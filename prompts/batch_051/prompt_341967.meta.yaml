  information). Also independence is fragile: an epsilon perturbation can break exact
  independence while leaving all your evidence unchanged. And the "presumption of
  independence" clashes with itself when multiple background facts are added: if you
  assume A and B independent, then condition on a common cause C, A and B become dependent;
  but by the same rule you could have assumed conditional independence given C or
  unconditional independence; applying "independence whenever you don''t know" at
  different levels gives inconsistent joints — Simpson''s-paradox-like.


