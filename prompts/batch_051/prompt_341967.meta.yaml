  Presumption of independence: In probabilistic modeling and Bayesian reasoning, there''s
  a heuristic: if you have no information linking A and B, treat them as independent:
  P(A∧B) = P(A)P(B). This can be justified by MaxEnt: the independent product is the
  maximum-entropy distribution subject to marginals. But it''s vulnerable: knowing
  only P(A) and P(B), the independent product is just one of infinitely many compatible
  joint distributions; choosing it is a substantive modeling assumption, not "absence
