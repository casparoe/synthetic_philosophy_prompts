  Slogan type: "deliberation crowds out prediction" — distinct precise claims:

  1. While deliberating, you cannot rationally assign a probability to your own choice,
  because any unconditional probability would itself reflect a disposition to choose
  and so collapse deliberation.

  2. Conditional probabilities of outcomes given acts are fine, but unconditional
  probabilities of acts are excluded during deliberation because deliberation would
  be over.

  3. From the first-person deliberative stance, self-prediction is not just difficult
  but pragmatically inconsistent: assigning high probability to doing X is to a large
  extent deciding to do X.

