  The type formula from the notes:

  The asker points at something that exists — a law or legal doctrine, an institutional
  policy, a professional norm — asks what it presupposes: what view of the relevant
  concept it only makes sense under, which rival views it quietly rules out, whether
  its parts presuppose consistent things, and what would have to change if the presupposed
  view were replaced. Write the practice concretely; the asker need not know philosophical
  vocabulary, and may be puzzled by apparent inconsistency. A good answer reconstructs
  implicit theory, distinguishes strict presupposition from mere fit, and says where
  underdetermined.


