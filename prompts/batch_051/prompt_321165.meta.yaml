  for the probability that a ''randomly chosen'' chord of the circle is longer than
  a side of the triangle. Depending on whether the chord is generated by (i) two endpoints
  chosen uniformly on the circumference, (ii) a point chosen uniformly along a radius
  and the chord perpendicular to the radius at that point, or (iii) a midpoint chosen
  uniformly inside the disc, the probability comes out 1/3, 1/2, or 1/4. All three
  procedures feel like legitimate readings of ''random chord,'' but they disagree."


  Then positions:


  "I see two positions that have been arguing past each other. The invariance-resolutionist
  position holds that the principle of indifference is saved by being constrained
  through the symmetries of the problem: in the circle case, invariance under translations,
  rotations, and scalings singles out the radial method, so the correct probability
  is 1/2, and the other methods are incorrect because they fail to be invariant in
  the right way. The underdeterminationist position holds that the original question
  is simply ill-posed: each procedure defines a different chance setup, the three
  answers are all correct relative to their setups, and no purely a priori symmetry
  argument can tell you which setup a bare phrase like ''a random chord'' picks out.
  On this view, the moral is that the principle of indifference never delivers probabilities
  until a background measure or chance mechanism has been specified, and symmetry
  talk just moves the ambiguity back one step."


