  Let me flesh out Bertrand''s paradox and the principle of indifference sufficiently.


  Bertrand''s paradox (1889): Consider an equilateral triangle inscribed in a circle.
  Choose a random chord of the circle. What is the probability that the chord is longer
  than a side of the triangle? Different methods of "choosing a random chord" yield
  different probabilities: 1/2, 1/3, 1/4.


  Three classic methods:

  1. "Random endpoints": choose two random points on the circumference; the chord
  is the line connecting them. Probability that chord > side = 1/3.

  2. "Random radial point": choose a random radius and a random point on that radius;
  the chord perpendicular to the radius through that point. If the point''s distance
  from center < r/2, chord longer. Probability = 1/2.

  3. "Random midpoint": choose a random point in the interior of the circle as midpoint
  of chord. Chord > side if midpoint lies within the inscribed circle of radius r/2.
  Probability = 1/4.


  The principle of indifference (PI): if there is no reason to assign different probabilities
  to a set of mutually exclusive and exhaustive possibilities, assign equal probabilities.
  The paradox shows PI gives different answers because "equally possible" can be applied
  to different parameterizations (endpoints, radial positions, midpoints) that are
  not linearly related. So the problem is that PI is not invariant under reparameterization.
  Jaynes argued that the correct answer is 1/2 because only the radial method is invariant
  under rotations, translations, and scale; he used invariance/group theory to constrain
  the prior (via maximum entropy / transformation groups). But this is controversial:
  there''s also a "empirical" aspect — random chord procedure must be specified; the
  problem as stated is underdetermined, so it''s not a paradox of probability but
  of an ill-posed problem. Also, the paradox shows PI needs an underlying measure
  or symmetry; "ignorance" alone doesn''t pick a sigma-algebra or reference measure.


  Adversarial collaboration camps:

  - Camp A (call them the "underdetermination camp" or "PI skeptics"): Bertrand''s
  paradox shows the principle of indifference is not well-defined; without a specified
  physical chance mechanism, "random chord" is ambiguous. The different probabilities
  are not contradictions but answers to different questions; PI as a purely epistemic
  principle fails because there''s no canonical parameterization.

  - Camp B (call them "symmetry/invariance camp" or "objective Bayesians" in the style
  of Jaynes): The paradox shows that indifference must be constrained by the symmetries
  of the problem, and when properly formulated with invariance requirements, a unique
  distribution emerges (1/2). PI is not incoherent; it was under-specified, and the
  well-posed version (using transformation groups) resolves the ambiguity.


  Both can agree on the math: the three methods generate different distributions;
  the problem as stated underdetermines a distribution; a "random chord" requires
  a specified procedure or invariant measure.


