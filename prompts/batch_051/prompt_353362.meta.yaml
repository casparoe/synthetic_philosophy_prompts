  Lakatos''s argument (in Proofs and Refutations): informal mathematical proof is
  a thought-experiment; when a proof is presented for a conjecture, counterexamples
  can be local (to a lemma) or global (to the conjecture). The method is: primitive
  conjecture, proof, counterexample, then either monster-barring (reject the counterexample
  by definition), exception-barring, or lemma-incorporation to repair the proof. Concepts
  stretch. Mathematics is fallible and grows quasi-empirically. "Quasi-empirical"
  — the key premise: mathematical propositions are not indubitable; proofs are informal
  and can be refuted; mathematics resembles empirical science in being fallible but
  differs... The argument rests on the informality of proof.


  New development: fully formal, machine-checkable proofs. A proof in Lean is a syntactic
  object verified by a small kernel. If a proof is machine-checked, no counterexample
  to a lemma can be "smuggled in" because the proof is executed. But: does this eliminate
  the quasi-empirical character? One response: no, because (a) formalization of a
  given informal proof is itself fallible and involves choices: which formalization
  corresponds to the intended theorem? The "formulation" can be wrong — you can prove
  a formal statement nobody intended. (b) The informal proof still must exist before
  formalization; formalization is a further step. (c) The choice of definitions and
  axioms can still be challenged by counterexamples to the formalized concept — a
  formal proof of a theorem about polyhedra in some formal definition might not capture
  all polyhedra. So concept-stretching moves to the definition level. (d) Lakatos''s
  picture is about discovery/heuristic, formal proofs are about justification; they
  don''t touch the growth of conjectures. (e) One could even argue formal proofs strengthen
  the quasi-empirical view: formalization attempts sometimes reveal gaps (e.g., gaps
  found in published proofs during formalization), making mathematics look more empirical,
  not less.


