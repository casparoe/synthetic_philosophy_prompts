  Actually the classic apparent counterexamples to Good''s theorem:

  - Non-Bayesian decision rules (maximin, minimax regret) can make information have
  negative expected value (Kadane & others).

  - If receiving information is observed by others (signalling: you can''t credibly
  claim ignorance after being told).

  - If the information changes your preferences/utility (e.g., learning about meat
  production makes you unable to enjoy meat; or "blissful ignorance" where the utility
  is in the state of not knowing, so the utility function itself depends on the information
  state).

  - Newcomb-like problems: information correlated with states can alter choices and
  thereby outcomes (the "you can''t refuse the information in the world where it matters"
  cases).

  - Intrapersonal commitment: an agent may want to bind themselves not to learn because
  they predict akrasia / they want to commit to an action that would be irrational
  after the info (like Ulysses and the sirens — though that''s commitment, actually
  Ulysses wants to bind against the future temptation; he chooses to receive info
  (the sirens'' song) but bind his hands. Hmm, the "value of ignorance" cases: A rational
  person might pay not to know, e.g., a plumber? Actually there''s the "deterrence"
  case: a country may not want early warning?).


  A good concrete case: Someone offered a free, perfectly reliable test for a genetic
  disease where there''s no treatment; they''d rather not know because the anxiety/despair
  would reduce their quality of life. In the standard theorem, utilities are defined
  over actions and states, and the state of knowing isn''t itself a state-relevant
  outcome; to model the case where knowing itself matters, you have to include "knowing"
  in the outcome, and then the theorem changes — the information is no longer cost-free
  in the relevant sense, because the act of receiving it changes the utility. That''s
  the crux: the theorem assumes utilities don''t depend on what you know (no "prizes
  for ignorance" built into outcomes in a way that...).


  Actually there''s a nice crisp distinction: Good''s theorem says expected value
  of free information ≥ 0 when you model the decision as: choose action after observing
  signal; before observing, agent shares the same utility function and will update
  by conditioning; no cost to observe. If a case where you prefer not to know, either
  (a) the agent is not an expected utility maximizer, or (b) the utility depends on
  the epistemic state itself (knowing vs not knowing is part of the outcome), so the
  formal setup misdescribes the decision, or (c) the information is not actually "free"
  because it''s strategically observed, etc. So the question asks students to use
  a concrete case to show which assumption fails.


