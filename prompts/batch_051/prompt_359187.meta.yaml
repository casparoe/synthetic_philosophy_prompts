  One nuance: Good''s theorem typically says: if you''re an expected utility maximizer,
  the expected value of obtaining additional information (free of cost) is always
  non-negative — you should never refuse cost-free information, because you can always
  ignore it (though ignoring by choosing the same action as you''d have chosen without
  info is allowed; with the same prior...). The theorem assumes you will condition
  on the information and then choose optimally. The expected utility ex ante of the
  decision made with info ≥ the expected utility of the decision made without info
  (since the decision without info is available after info too, so the max over actions
  after each signal weakly dominates choosing the prior-optimal action regardless
  of signal). That''s the core idea. Apparent failures arise when the information
  is not "cost-free" in the model (utility depends on knowing), or the agent''s decision
  rule isn''t EU maximization, or there are strategic observers, or the information
  affects feasibility of actions, or the agent''s future choices are chosen by someone
  else (e.g., had the info been provided publicly, a commitment to ignore could...).
  My prompt''s cases (genetic test, information seen by others) map to those. Good.


