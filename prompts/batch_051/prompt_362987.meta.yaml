  Dogmatism paradox (Harman? Kripke''s "Two Paradoxes of Knowledge" attributes to
  Harman): If S knows that p, then S knows that any evidence against p is misleading
  (since p is true). Given that any evidence against p is misleading, S can rationally
  disregard such evidence. So once you know something, you''re rationally entitled
  to ignore counterevidence. The paradox: this seems to license dogmatism.


  Formal version:

  (1) If I know p, then I know that any evidence against p is evidence against a truth,
  hence misleading. (Because if p is true, evidence suggesting not-p misleads.)

  (2) If I know that any evidence against p is misleading, then I can rationally set
  aside any further evidence against p without reducing my confidence.

  (3) So if I know p, I can rationally ignore / dismiss counterevidence to p.

  (4) But that''s absurd: I can''t make my beliefs immune to counterevidence just
  by knowing them; a reasonable epistemic agent has to remain open to revision.

  (5) So knowledge doesn''t work that way / or knowledge itself is impossible? Actually
  conclusion: something must go — either closure, or knowledge, or the norm that we
