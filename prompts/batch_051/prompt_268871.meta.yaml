  Let me think about the "argument that seems to prove too much" type with Fitch.
  Standard: Fitch''s proof: assume all truths are knowable (∀p(p → ◇Kp)). Take p =
  "q and no one knows q". If knowable, then in some possible world someone knows "q
  and no one knows q". But knowledge distributes over conjunction and is factive,
  so in that world the person knows q and knows that no one knows q; but if they know
  q then someone knows q, contradiction with factivity of "no one knows q". So "q
  and no one knows q" is not knowable; hence it''s false; hence if q is true then
  someone knows q. So all truths are known: q → Kq. This is the paradox: anti-realism
  (all truths knowable) entails omniscience (all truths known).


