  what it''s worth, I''ve taught this stuff for years, but I''ve never written the
  commitments down next to each other, and I have a nagging sense that the list might
  pull in a few directions. Here they are, roughly in the order they came to me:


  (1) When I sincerely report a current conscious experience — a pain, an afterimage,
  how bright that red patch looks, a sudden itch — the default is that I''m right.
  No amount of looking at my brain or my behaviour could put someone in a better position
  to say what that experience is like than I am. I treat this as about as close to
  axiomatic as anything in epistemology.


  (2) At the same time, I don''t think introspection is an inner eye scanning private
  objects. A lot of what I call "knowing my own mind" is interpretation: I work out
  what I believe, want, or feel from evidence — what I said, what I did, the situation
  I''m in, what I can readily defend — rather the way other people work me out. That
  interpretive process is fallible, theory-laden, and vulnerable to confabulation,
  framing, expectation effects, the lot.


  (3) I also accept that there are mental states that are genuinely mine but structurally
  closed to introspection: implicit attitudes, early perceptual processing, suppressed
  motives, maybe some dispositional states. They influence what I do, I can discover
  them via third parties or brute behavioural patterns, but I can''t find them by
  looking inward.


