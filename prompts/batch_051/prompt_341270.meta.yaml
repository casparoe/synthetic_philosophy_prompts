  Let me think about what a genuinely good answer would do. It might:


  1. Fix a working definition: a genuine dilemma (for a character) requires: (a) two
  or more tangible requirements, each with genuine normative force on the character;
  (b) the character cannot satisfy both in the circumstances; (c) neither requirement
  defeats or overrides the other within the value scheme the character actually holds;
  (d) the conflict cannot be dissolved by re-describing the situation, establishing
  a priority rule, or dividing responsibilities; (e) whatever remains undone leaves
  a legitimate "remainder": appropriate guilt/regret directed at the unmet requirement,
  and some reason to repair or acknowledge it, even if the act was justified.


  2. Procedure:

  - Step 1: Inventory the candidate obligations. Write each as an "ought" sentence
  from the character''s standpoint. Eliminate mere desires, temptations, professional
  norms that don''t morally bind, and obligations the character doesn''t actually
  endorse. If fewer than two, stop: not a dilemma.

  - Step 2: Test the conflict. Can the character fulfill both? If yes, stop: it''s
  a coordination or scheduling problem, not a dilemma.

  - Step 3: Test for an overlooked third option or re-description. Push hard: is there
  a way to satisfy the underlying interests of both obligations by altering the frame
  (timing, asking for help, renegotiating the commitment, creative compromise)? If
  yes, stop: not a genuine dilemma; it''s a failure of imagination.

  - Step 4: Test for override. Within the character''s deepest settled values, does
  one requirement clearly rank above the other? If so, stop: not a genuine dilemma;
  it''s a hard choice with one right answer (even if costly). Here define override
  vs. cost: the agent may still owe regret/repair to the overridden requirement.

  - Step 5: Apply competence constraints. If the character literally cannot perform
  one option (e.g., save the dead), there is no duty to do it; stop — pseudo-dilemma.
  (Ought implies can.) But be careful: inability to fulfill both together is what
  makes the conflict, not a reason to erase one requirement.

  - Step 6: Test whether the apparent conflict is between two "all-things-considered"
  verdicts or merely prima facie considerations that a single verdict subsumes. If
  only one all-things-considered verdict survives, then no dilemma; the character
  may still face a tragic cost. Hand off if the novelist cannot rank but neither can
  the character.

  - Step 7: The remainder test as a diagnostic, not a criterion. If, after choosing
  A, nothing would be appropriately owed to the other requirement (no guilt, no repair,
  no mourning), the "dilemma" was probably a temptation or a preference conflict mislabeled
  as moral. The presence of a remainder is evidence of a genuine conflict, but its
  absence is stronger evidence.

