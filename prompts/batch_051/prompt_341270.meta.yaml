  is a fact about values or a failure of the author''s construction. Hand to author:
  if, after all tests, two requirements still stand unranked and unsatisfiable together,
  and the author cannot honestly say one overrides within the character''s values,
  then the scene is at least a candidate for a genuine dilemma — but the author must
  decide whether to endorse the possibility of such a remainder or reveal that the
  character''s value scheme was incomplete.

