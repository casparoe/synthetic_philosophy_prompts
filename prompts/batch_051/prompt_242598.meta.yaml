  "In my medical ethics course we read the 1968 Harvard Medical School Ad Hoc Committee
  report, A Definition of Irreversible Coma, drafted under Henry Beecher. The report’s
  opening rationale says the committee’s primary purpose is to define irreversible
  coma as a new criterion for death, and it gives two kinds of reason: that respirators
  and other supportive measures now keep bodies going after the brain has irreversibly
  ceased to function, and that this creates burdens for families and hospitals and
  delays the use of organs for transplantation. The committee then specifies operational
  tests—unreceptivity and unresponsivity, no movements or spontaneous breathing, absent
  brainstem reflexes, and a flat EEG, repeated after 24 hours, after excluding hypothermia
  and drug intoxication. I want to know what this policy presupposes about what death
  itself is. Is it treating death as loss of personhood, loss of integrated organismic
  function, or something else? Does the same view underwrite declaring someone dead
  by circulatory criteria, or does the report quietly change the concept rather than
  merely adding a new test? And if we rejected that presupposition, what would the
  practice of declaring death have to change? Please separate what is historically
