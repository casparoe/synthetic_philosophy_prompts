  ---


  I teach a 75-minute intro philosophy/economics seminar for undergrads, about 18
  people. We''re reading John Stuart Mill''s Principles of Political Economy, specifically
  the chapter on money, and I want to build the whole session around his idea that
  money is more like a machine than like wealth: it spares time and labour in exchange,
  but printing more of it doesn''t create more wealth in the sense of real goods and
  services. The passage I have in mind is Book III, chapter VII, where he says money
  is a contrivance for sparing time and labour, not one of the ultimate sources of
  wealth, and that people mistake it for wealth because it''s the instrument for getting
  other things. I won''t quote it here. Design a classroom game that makes participants
  feel the force of that claim, not just hear it. I want them to first experience
  a phase where adding more mony feels like wealth creation, then have that intuition
  collapse when they try to spend it on actual goods. Think small scrip, goods, maybe
  a central bank role. Include rules, materials I''d need, a timeline with phases,
  exactly when I should introduce the Mill passage (probably after the shock, not
  before), a debrief mapping what happened to the passage and to the distinction between
  money, liquidity, and real wealth, a few sharp prompts for the debrief, and a note
  on what predictably goes wrong the first time. Also be upfront about which part
  of Mill''s idea the game can''t show: e.g., whether it can capture the difference
  between an increase in the money supply and an increase in the velocity of money,
  or the deflationary side. I''d like it to be low-prep, no real money needed, and
  maybe 20 minutes for game and 30 for debrief.


