  I teach a 75-minute undergraduate seminar called "Philosophy of Money and Markets,"
  about 18 students, mostly second-year, and we''re reading the chapter on money in
  Mill''s Principles of Political Economy. I want a 20-minute game with the remaining
  time for debrief. The idea I want them to actually feel, not hear me say, is Mill''s
  claim that money is more like a machine for making exchange less cumbersome than
  like wealth itself, and that printing more of it does not add to the real goods
  and services of a society. There''s a passage in Book III, chapter VII, where Mill
  makes roughly this point: money is a contrivance for sparing time and labour, not
  a genuine source of wealth, and people mistake it for wealth because it is the instrument
  by which they get command over other things. I won''t quote it exactly here; I''ll
  put the exact paragraph up after the game. Design a low-prep classroom game, no
  real money, with scrip and simple goods or tokens of real goods, that makes participants
  first confuse money with wealth and then discover the distinction through the rules
  themselves. Include a phase where the central bank prints extra notes. The central
  question I want them to hit is: when a bank or government prints money, what exactly
  gets created—wealth, liquidity, or simply someone''s ability to bid real goods away
  from someone else? Include exact rules and roles, a timeline, how to keep 18 people
  engaged, a debrief that maps each game moment onto the Mill passage and onto the
  money/liquidity/wealth distinction, plus a note on what predictably goes wrong the
  first time. Be honest about one feature of Mill''s idea the game can''t reproduce—I''m
  especially curious whether it can get at why more circulating medium might feel
  like more wealth even after prices adjust. Also I''d like one debrief question that
