  "In my philosophy club we have been working through Dennett''s paper ''Quining Qualia''
  and especially the Chase and Sanborn example. A classmate offered the following
  argument, which seems to show that qualia are not merely unverifiable but incoherent
  as a posit. I want to reject the conclusion, since I think there is a determinate
  fact about how my experience seems to me, but I cannot see where the argument goes
  wrong. Please diagnose which premise or step should be given up and explain what
  rejecting it costs for the main positions in the debate.


  The argument:


  (1) If qualia are real properties of conscious experience, then for any subject
  and any two episodes of tasting, there is a determinate fact about whether the qualitative
  character of the taste is the same or different.


  (2) In the Chase and Sanborn case, both tasters have changed in their overall response
  to the coffee, but they disagree about the taste itself: Chase says the taste is
  exactly the same and he just likes it less; Sanborn says the taste itself has changed
  and he likes the new taste just as much.


  (3) Every piece of observable evidence — their behavior, their sincere reports,
  any physiological measurement — is compatible with at least three different stories
  about what happened to their qualia: the qualia stayed fixed while the liking changed,
  the qualia changed while memory or judgment made them seem fixed, or the two reports
  are not even tracking the same property. There is no further test, even in principle,
  that would settle which story is true.


  (4) If no possible evidence could settle which story is true, then there is no fact
  of the matter about which story is true.


  (5) But if there is no fact of the matter about whether the qualitative character
  stayed the same or changed, then qualia do not have the determinate identity demanded
  by premise (1).


  (6) Therefore the standard concept of qualia is incoherent.


  I would most like to keep premise (1), since it seems built into the very idea of
  a subjective quality."


