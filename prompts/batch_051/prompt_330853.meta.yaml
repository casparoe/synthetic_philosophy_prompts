  Dennett''s "quining" argument could be reconstructed:


  (1) If qualia exist, then for any subject in a conscious experience, there is a
  determinate fact about what the qualitative character of that experience is.

  (2) Consider the case of two coffee tasters (from Dennett): one says the taste has
  remained exactly the same but he no longer likes it; the other says the taste itself
  has changed but he still likes it just as much. Both reports are sincere and behaviorally
  indistinguishable.

  (3) There is no possible test or introspective criterion that could tell whether
  the first taster''s qualia changed while his preferences changed, or whether his
  memory/judgment changed, or whether the qualia themselves changed.

  (4) If no possible evidence could distinguish between these hypotheses, then there
  is no fact of the matter about which hypothesis is true.

  (5) If there is no fact of the matter about whether a subject''s qualia changed
  in this case, then qualia do not have the determinate nature required by premise
  (1).

  (6) Therefore either qualia do not have that determinate nature, or they lack existence;
  either way the standard concept of qualia is incoherent.


