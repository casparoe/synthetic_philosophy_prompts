  Question: "In the Sleeping Beauty experiment, Beauty is put to sleep Sunday. A fair
  coin is tossed. If Heads, she is woken Monday only. If Tails, she is woken Monday
  and Tuesday, with a drug that erases memory of Monday before Tuesday. Each waking
  is indistinguishable. Upon waking during the experiment, what credence should Beauty
  assign to the coin having landed Heads? Explain."


  Student answer (to grade) could be a halfer answer with subtle errors. E.g.:


  "The answer is 1/2. Beauty knows the coin is fair, so P(Heads)=1/2 before the experiment.
  When she wakes, she gains no new information because she knew she was going to be
  woken at least once no matter what. Since no evidence can justify changing from
  1/2, the credence should stay 1/2. Some people think it''s 1/3 because there are
  three possible awakenings (Mon/Heads, Mon/Tails, Tue/Tails) and only one is Heads;
  but this treats awakenings as if Beauty could randomly sample among them, which
  she cannot — she isn''t equally likely to be in each because if the coin is Tails
  she is in two of them, and the experiment doesn''t select one of them for her to
  inhabit. The thirder position conflates the probability of the coin with the expected
  fraction of awakenings that are Heads; the latter is indeed 1/3, but that''s a different
  question."


