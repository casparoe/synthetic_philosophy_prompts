  posterior probability changes when several witnesses independently testify to it;
  he models each witness as having a small probability of falsehood and shows, in
  effect, that independent concordant testimony can compound rapidly, making even
  an initially improbable event very likely if enough witnesses agree. I want to reuse
  his framework for the birthday paradox rather than for legal or miracle testimony.
  My thought is that a birthday coincidence anecdote is structurally different from
  Laplace''s case: the event under testimony is not fixed in advance but is selected
  after the fact from hundreds of possible pairwise matches. A reporter who says ''I
  shared a birthday with the stranger next to me on the plane'' is, on my proposed
  analysis, not offering a single witness report of a pre-specified event; they are
  the survivor of a large scan over hundreds of comparison opportunities, and they
  typically know nothing reliable about the false-positive rate for having been struck
  by such matches. I think this means the Laplacean compounding of testimony does
  not get off the ground for birthday anecdotes, and the felt surprise is better explained
  by the combinatorial birthday effect plus attention bias, not by any hidden causal
  connection."


