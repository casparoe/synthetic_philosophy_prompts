  The idea: The classic fink/mask cases involve dispositions and their connection
  to counterfactual conditionals ("if struck, it would break"). A simple conditional
  analysis of dispositions: x is disposed to M when S iff if S occurred, x would M.
  Finks and masks are counterexamples to the simple conditional analysis. Fink: if
  S occurred, the disposition would be removed, so the conditional is false but the
  object still has the disposition. Mask: disposition present but manifestation blocked,
  so conditional false but disposition present. Antidote cases too.


  Software scenario possibilities:


  Option A: Fragility of a legacy service. A service has a memory leak that would
  crash it after 10 hours of continuous load. But there''s a nightly restart (or a
  load balancer that rotates instances every 8 hours). So it never crashes. Is it
  "prone to crash"? The colleague says it''s not fragile because it never actually
  fails; you feel it is fragile even though it never manifests. This resembles masking
  or antidoting. Hmm.


