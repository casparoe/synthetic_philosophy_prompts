  and who has a claim on what. Metal coins, paper notes, private keys, even gold bars
  — those are just the persistence layer. The system is the rows and the constraints.
  The token is not the data.


  My central claim is that most arguments about money go wrong by treating the persistence
  layer as if it were the ledger. Saying we need more money when the real problem
  is that the ledger isn''t moving is like saying the database is broken because the
  disk isn''t spinning. Inflation, trade deficits, central bank policy, crypto, and
  a lot of the goldbug stuff all seem to make this same error, just in different directions.
  One side thinks printing tokens changes the row count; the other side thinks making
  tokens scarce fixes the database. Both mistake the disk for the system.


