  "After a long argument with a friend about religion in politics, I keep coming back
  to a passage in John Rawls''s The Idea of Public Reason Revisited. He writes, in
  my paraphrase, that reasonable comprehensive doctrines—religious views included—may
  be introduced into public political discussion at any time, provided that in due
  course proper political reasons, and not reasons given solely by comprehensive doctrines,
  are presented sufficient to support whatever the comprehensive doctrines were introduced
  to support. What struck me is an asymmetry in how we apply this. A legislator may
  say in a hearing that he opposes a policy because his faith teaches something, and
  then later or even on the spot gives a secular justification—consequentialist, constitutional,
  whatever—and we treat the religious opening as perfectly acceptable, even as evidence
  of candor. But the reverse sequence does not seem to work. If a legislator first
  gives a fully secular argument and then adds that his faith also commands the same
  conclusion, the religious addition is inert; if anything, it makes people wonder
  whether the secular argument was sincere. And a judge who offered a legal argument
