  is a spectrum argument from mild to severe that forces me to draw a line I can''t
  justify, or a demonstration that the badness of suffering doesn''t have anything
  like the discontinuity I''m claiming.


  Finally, keep separate what''s actually settled — that extreme suffering matters
  a lot and can ground very strong reasons — from what''s genuinely contested among
  people who know this literature, and don''t present one contested reading (about
