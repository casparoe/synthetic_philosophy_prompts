  it? I don''t mean just the standard criticisms; I want the things a committed defender
  would themselves have to concede as counting against it — evidence, formal results,
  considered judgments, impossible-looking cases, or commitments the view turns out
  to be stuck with — ranked from fatal to merely awkward. Include what the view predicts
  or rules out that its rivals (plain negative utilitarianism, classical utilitarianism,
  prioritarianism, maybe rights-based views) don''t, and where you think the real
  logical space is. If you think I''ve qualified the view into unfalsifiability, or
  that the threshold is doing no real work and I''m just smuggling in an ordinary
