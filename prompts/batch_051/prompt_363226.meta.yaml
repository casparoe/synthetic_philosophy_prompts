  I''ve been defending a view lately — I guess you''d call it a threshold or two-tier
  negative utilitarianism — and I want to stress-test it rather than just collect
  allies. The view is roughly this: below some severity threshold, suffering trades
  off against happiness and other goods in the ordinary way, bad against good. But
  once suffering is bad enough — torture-level physical pain, extreme and prolonged
  mental anguish, the worst states we know about — it has lexical priority: no amount
  of happiness, preference-satisfaction, beauty, knowledge, or anything else compensates
  for even one extra instance of it. A world with slightly less severe suffering is
  better full stop, even if it means sacrificing an enormous amount of the good stuff.
  I also hold this in an impersonal, add-it-up-across-lives way, so it isn''t just
  a claim about how one person should treat their own pain; it''s a claim about which
  worlds we should prefer when aggregating across all sentient beings. I''ve found
  myself saying things like: a world with ten minutes of one person''s extreme agony
  is worse than a world with a million other people''s mild contentment and fifteen
  minutes of such agony — the extra five minutes can''t be bought off. People either
  find that obviously right or sort of repellent.


