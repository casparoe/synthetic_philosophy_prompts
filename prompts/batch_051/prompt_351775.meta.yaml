  Prompt:


  In Claude Lévi-Strauss''s 1955 essay *The Structural Study of Myth*, there is a
  passage early in the article where he treats the relation between a myth and its
  variants. I am working through it and need help understanding the argument. As I
  read it, he makes roughly the following claim, which I''ll paraphrase closely because
  I don''t have the English text in front of me. He says that a myth should not be
  identified with any one of its tellings; a myth is constituted by all its versions,
  so that even versions that look corrupt, incomplete, or derivative belong to the
  same myth. And he adds that there is no single true or original version of which
  the others are deviations; if a version claims to be the original, it is still only
  one version among the others.


  My difficulty is this. He wants to use these variants as data for a structural analysis,
  arranging repeated bundles of relations into tables. But if every version has equal
  standing and none is privileged, what exactly is being compared when two versions
  differ? In ordinary philology, one can say a later scribe dropped a motif, or a
  regional telling merged two characters, because one assumes an earlier text or a
  reconstructed archetype. Lévi-Strauss seems to be denying that kind of standard
  of correction. So when he says that every version belongs to the myth, is he offering
  a maxim about how to collect data, a metaphysical claim about what myths are, or
  a methodological ban on invoking origins? And if there is no canonical version,
  how does the analyst determine which elements are present or absent in any given
  version? I''m not asking for a summary of the essay, but for help unpacking this
  particular passage and its implications for his method.


