  Question draft: "In our unit on moral status, we considered many candidate properties
  for grounding moral status: being human, sentience, self-consciousness, having a
  concept of self over time, and so on. Evaluate the claim that brain size is morally
  relevant. Your answer should distinguish between regarding brain size as intrinsically
  valuable and regarding it as a mere indicator, and should take a clear position."


  Student answer draft:


  "Brain size is not a plausible candidate for grounding moral status in itself. If
  it were, then we would be committed to saying that the animals with the largest
  brains, such as sperm whales or elephants, have higher moral status than human beings,
  which almost everyone rejects. It also fails within our species: we do not think
  a person with a larger brain deserves more moral concern than a person with a smaller
  one. The capacities that actually matter are psychological ones—in particular sentience
  and self-awareness. Because these capacities are what justify moral consideration,
  and because brain size does not track them closely enough across species, brain
  size is morally irrelevant. That means that any policy or scientific practice that
  uses brain size as a guide to how much an animal can suffer or how much protection
  an embryo or fetus deserves is making a ''sizeist'' mistake comparable to racism
  or sexism. The only defensible view is to disregard brain size entirely when assigning
  moral status."


