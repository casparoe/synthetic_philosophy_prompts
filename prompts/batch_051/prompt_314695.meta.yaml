  Woodward''s interventionism (Making Things Happen, 2003): X causes Y iff there is
  a possible intervention on X with respect to Y that changes Y (or changes the probability
  distribution of Y), under background conditions; an intervention I on X with respect
  to Y must satisfy conditions including: I causes X; I does not cause Y through any
  route except through X; I is not correlated with other causes of Y except through
  X; I is exogenous. The circularity worry: defining intervention in terms of causation.
  Woodward responds that the notion of intervention only requires that I be a cause
  of X and not a cause of Y through other routes — which uses causal notions, but
  perhaps in a way that can be characterized without full-blown "X causes Y" relation?
  Actually Woodward claims the circularity is not vicious because the causal notions
  used to characterize interventions are not the same as the one being analyzed; he
  analyzes "X causes Y" by quantifying over interventions, where interventions are
  characterized in terms of causal relations between I and X and I and Y, but not
  in terms of X causing Y. Some argue it''s still circular or not reductive; Woodward
  says it''s non-reductive, not viciously circular. This is good material.


