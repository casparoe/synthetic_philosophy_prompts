  Let''s design the summary carefully with accurate parts and subtle errors.


  Accurate parts of 2D semantics:

  - Core idea: an expression gets two kinds of intension (function from possibilities
  to extensions) to capture two ways of thinking about possibility and meaning. Primary
  intension: a function from worlds considered as actual (epistemic possibilities)
  to extensions — what the expression would refer to if that world turned out to be
  actual, fixing reference by the way the world is. Secondary intension: a function
  from worlds considered as counterfactual, holding fixed the actual reference — standard
  possible-worlds intension.

  - Example: "water" — primary intension picks out the clear, drinkable, watery stuff
  in each world considered as actual; secondary intension picks out H2O in all worlds
  (given our world actually has H2O as the watery stuff). "Hesperus" and "Phosphorus":
  primary intensions differ (evening star vs morning star), secondary intensions coincide
  (Venus).

  - Application: separates necessity from a priori. A statement is necessary iff secondary
  intension true in all worlds; a priori iff primary intension true in all worlds
  considered as actual (roughly, for Chalmers). Thus "water is H2O" is necessary a
  posteriori: secondary necessary but primary contingent.

  - Chalmers'' conceivability argument: zombies conceivable -> primary possibility
  -> metaphysical possibility? Actually Chalmers: if conceivability entails primary
  possibility, and primary and secondary intension coincide for phenomenal concepts
  (or with appropriate constraints), then zombies are secondarily possible. Something
  like that. For prompt maybe not needed.


