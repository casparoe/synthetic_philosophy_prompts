  I''m in a reading group on conditionals and we got tangled in an argument that seems
  to show either indicative and counterfactual conditionals are the same after all
  or conditional claims have no truth conditions at all. The argument starts from
  the familiar Adams example: Oswald shot Kennedy, but if he didn''t, someone else
  did; but it''s not true that if he hadn''t, someone else would have. Wait, our friend
  uses Adams''s own example to argue something stronger. He says:

  (1) An indicative conditional "If Oswald didn''t shoot Kennedy, someone else did"
  is true in virtue of the shared background fact that Kennedy was assassinated.

  (2) The corresponding subjunctive "If Oswald hadn''t shot Kennedy, someone else
  would have" is false in virtue of the same background facts plus what we know about
  conspiracies.

  (3) Since both conditionals have the same antecedent and consequent, any difference
  in truth-value must come from something besides truth conditions of their components,
  i.e., from the indicative/subjunctive marker itself.

  (4) But if the marker itself contributes to truth conditions, then there should
  be possible worlds differing only in that one is governed by indicative and the
  other subjunctive; that''s absurd.

  (5) Thus conditionals don''t have truth conditions at all; their surface form misleads
  us into treating them as propositional.

