  That looks, formally, like the problem of identifiability in factor analysis and
  more generally in unsupervised learning. The same observed covariance matrix can
  be generated by indefinitely many combinations of latent factors and loadings; the
  standard solution is to impose a constraint—orthogonality, simple structure, a sign
  convention—that is not itself forced by the data. In archaeology the analogous constraints
  would be interpretive rules of thumb such as ''ceremonial objects are deposited
  deliberately, domestic objects are discarded casually'' or ''elite residences cluster
  around ceremonial centres.'' Those read, in the statistical language, as identifying
  restrictions that are already a theory of the culture under reconstruction.


