  I find myself pulled in two directions about when an infinite regress is vicious.


  On the one hand, I''m attracted to a clean, general principle: a regress is vicious
  when each step merely passes on the very burden it was introduced to discharge.
  If a debt is paid by borrowing money to repay ... etc. The theory unifies cases:
  the homunculus regress in explanations of perception (the inner viewer who needs
  another inner viewer), the regress of justification (why is that belief justified?
  because another belief justifies it, and so on), the regress of universals/forms
  (third man?), and causal regress (what caused the first? earlier cause). It gives
  a tidy decision procedure: locate whether the item at each stage is of the same
  dependent kind as the item it was brought in to explain; if the chain never changes
  kind, it never explains anything; the series must terminate in something that is
  not another instance of the same question.


  On the other hand, I can''t shake a very firm intuition about one case the theory
  seems to prohibit: an eternal universe. Suppose the past is infinite: each event
  is caused by an earlier event, and at every point in the chain the event in question
  has a complete cause — the one immediately before it. It seems to me that each event
  is fully explained; there is no event left dangling. The question "yes, but what
  caused the whole infinite chain?" feels like an illicit demand — to treat the series
  as another event inside the series; a category mistake. I don''t have the same feeling
  at all about the homunculus regress (which does look empty) or the justification
  regress (which seems to leave every belief conditionally justified only). But I
  can''t articulate what principled difference makes the causal case benign without
