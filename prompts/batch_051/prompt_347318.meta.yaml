  Question:


  "In Posterior Analytics I.3, Aristotle argues that if every item of knowledge rests
  on demonstration from prior premises, then either the premises go back forever,
  or the reasoning turns in a circle; in neither case, he thinks, do we genuinely
  know, so there must be non-demonstrated first principles. Reconstruct the regress
  argument for epistemic justification that this passage suggests. Then explain how
  foundationalism, coherentism, and infinitism each propose to stop or accept the
  regress. Finally, assess which proposal is strongest and why, paying attention to
  the difference between a belief''s being caused and its being justified."


  Student''s answer:


  "The regress problem: if a belief is justified only by inferring it from another
  belief, then that supporting belief must itself be justified, and so on. This yields
  three possibilities: the chain stops at an unjustified or non-inferentially justified
  belief, goes in a circle, or continues infinitely.


  Foundationalism takes the first option. Its basic beliefs are self-justifying: they
  are justified without receiving their justification from other beliefs. Because
  they are self-justifying, they must be infallible; otherwise, fallibility would
  introduce the possibility of error and then they would need further support, restarting
  the regress. Foundationalists therefore must restrict basic beliefs to a small set
  of self-evident truths, and infallibility is a necessary feature of any foundationalist
  position.


  Coherentism takes the second option and says circular chains are not vicious. Justification
  is holistic: a belief is justified by its coherence with the rest of one''s belief
  system, and this coherence is what ties the circle together. The main objection
  is that coherentism cannot distinguish a coherent false system from a coherent true
  one, because coherence is purely internal. That''s correct as far as it goes, but
  coherentists reply that truth is itself coherence, so the objection is question-begging.


  Infinitism takes the third option: the regress continues infinitely and each belief
  is justified by the next one in the chain. Peter Klein has defended this by saying
  that an infinite chain of reasons can support justification, provided the chain
  is non-repeating. The obvious objection is that finite minds cannot actually have
  an infinite number of beliefs, so infinitism is automatically false because it demands
  something psychologically impossible.


  On balance, foundationalism is strongest because it blocks the regress and grounds
  knowledge in self-evident truths. The problem with the other two is that they don''t
  actually provide a stopping point for justification: coherentism collapses into
  ''everything is justified'' and infinitism into ''nothing is ever finally justified.''"


