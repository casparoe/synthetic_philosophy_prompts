  Let me recall Hume causation scholarship:

  - Regularity (projectivist) reading: Hume reduces causation to constant conjunction
  + felt determination of mind; necessity is not in objects but in mind. Causation
  is nothing beyond regular succession; necessary connection is a projection. Simon
  Blackburn, David Pears? Projectivism.

  - New Hume / skeptical realist reading: Hume believes there really is a necessary
  connection in nature (objective causal powers), it''s just that we have no adequate
  idea of it; he''s a skeptic about our knowledge of it, not an anti-realist about
  it. Key text: references to "secret powers," "unknown qualities," "ultimate springs
  and principles are totally shut up from human curiosity," the two definitions of
  cause as imperfect. Galen Strawson, John Wright, Peter Kail (causal realism with
  "thick" vs "thin" content? Actually Kail is a sophisticated New Humean).

  - Key textual evidence for New Hume: Hume repeatedly speaks of "secret powers,"
  "unknown causes," "force and power" as existing in nature though we can''t perceive
  them; his distinction between definitions of cause and the "circumstances" he includes;
  his treatment of "power" like "real qualities." Also the "natural belief" in necessary
  connection? The vulgar believe causation is in objects.

  - The regularity reading''s evidence: Hume''s Copy Principle—if we have no impression
  of necessary connection beyond constant conjunction and felt determination, the
  claim that there is such a thing in the object is meaningless or at least unjustified;
  the definitions of cause imply nothing beyond regularity; his project of "limiting
  our enquiries to... life" might suggest agnosticism not realism.

  - Cruxes: What is the semantic content of the idea of necessary connection? Does
  the copy principle license a concept of "causal power" via relative ideas? Is "Hume
  is a realist about something he calls ''necessary connexion'' but takes it to be
  unknowable" coherent? Does attribution of realism to Hume project later metaphysics?
  What to do with the two definitions—do they define cause or only "our idea" of it?
  The "New Hume" debate often hinges on whether the "unknown causes" talk is merely
  vulgar/religious belief that Hume eschews, or Hume''s own professed realism; and
  on the distinction between "conceivability" and "referring." Also the "Thick/Thin"
  concepts.

  - Cases/tests: e.g., whether Hume''s own statements about "secret powers" should
  be read as his considered position or as describing what we naturally believe; whether
  he has resources to express a gap between "the world contains causal necessity"
  and "all we can observe is regularity" given Copy Principle; whether his talk of
  "powers" is ironic. Both sides could agree on test: a close reading of passages;
  corpus study of occurrences of "secret power" vs "constant conjunction"; whether
  Hume''s two definitions are ones he regards as complete.


