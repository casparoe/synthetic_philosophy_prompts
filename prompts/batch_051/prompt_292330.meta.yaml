  I''ll quote from it in the piece. Make the agreed claims substantive and non-vacuous:
  what the Treatise and the first Enquiry can be taken to say, what the copy principle
  does and doesn''t rule out, what Hume''s two definitions of cause actually define,
  and what each side is genuinely committed to rather than what it merely finds embarrassing.
  For the table, use columns something like: the issue; how the regularity camp would
