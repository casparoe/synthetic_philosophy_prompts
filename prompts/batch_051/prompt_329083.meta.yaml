  2. The disagreement problem: relativism says there''s no real disagreement between
  cultures because each is right relative to its own code; but when culture A says
  "female genital cutting is wrong" and culture B says it''s required, they seem to
  be disagreeing about the same thing, not talking past each other.

  3. The majority/subgroup problem or "who counts as the culture": a culture''s moral
  code isn''t well-defined; within any society there are dissenting subgroups (reformers,
  minorities). Relativism can''t say which subgroup defines the culture''s code.

  4. The self-defeat / relativism is self-refuting argument: if all moral truths are
  relative, then the claim "all moral truths are relative" is itself either relative
  (so not universally true) or an objective claim that contradicts the view.

  5. The tolerance argument inconsistency: people often defend relativism on grounds
  of tolerance, but tolerance is itself a moral value; if relativism is true, there''s
  no universal obligation to be tolerant, and a culture that is intolerant is just
  fine by its own code.

  6. The arbitrariness/foundations problem: relativism makes moral rightness depend
  on whatever a culture happens to accept, but the mere fact that a group accepts
  something doesn''t seem to make it right; there''s a gap between "accepted" and
  "right."


