  "meshing subplans" is naturally read as something like a jointly consistent commit
  across processes, or whether the common-knowledge conditions can be read as a distributed
  common-knowledge condition; (b) which claims can be forced into the vocabulary only
  with distortion and where the distortion lies; and (c) which claims have no distributed-systems
  expression at all. I want the translation to be honest: do not import distributed-systems
  assumptions and present them as if they were part of the philosophical account,
  and do not quietly replace normative or first-person-plural notions with causal
  or message-passing notions unless the account itself is really committed to that.


  Finally, report on the residue. For the elements that fail to translate — I am thinking
  especially of joint commitment, obligations to one''s co-participants, entitlement
