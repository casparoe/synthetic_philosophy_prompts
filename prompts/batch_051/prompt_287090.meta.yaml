  Hmm, I need to be careful to be accurate. Let me recall the standard moves:


  Hempel''s raven paradox ingredients:

  - Nicod criterion (instance confirmation): a hypothesis of the form "All F are G"
  is confirmed by an F that is G.

  - Equivalence condition: if a piece of evidence confirms H, it confirms any logically
  equivalent hypothesis.

  - Contraposition: "All ravens are black" is equivalent to "All non-black things
  are non-ravens."

  - Thus a green apple — a non-black, non-raven thing — satisfies the Nicod criterion
  for the contrapositive, so it confirms the raven hypothesis. Paradox: a green apple
  seems irrelevant.


  Resolutions:

  1. Hempel''s own: accept the conclusion; it''s not as odd as it seems because of
  background information. Given our background knowledge about relative numbers of
  ravens vs non-black things, the confirmation is minuscule. Also the "paradox" comes
  from implicit background assumptions. The observation of a green apple does confirm,
  just to a negligible degree.

  2. Bayesian resolution (I.J. Good, Horwich, etc.): confirmation is probability-raising;
  whether a green apple confirms "all ravens are black" depends on prior probabilities
  and background beliefs. Under plausible priors, a green apple may actually not confirm
  (or may confirm negligibly). The equivalence condition holds for probability (equivalent
  hypotheses have same probability), but Nicod''s criterion fails in general: an F-and-G
  instance doesn''t always raise probability of "all F are G" (e.g., known constraints).
  So the paradox is dissolved by replacing Nicod with probabilistic confirmation;
  the green apple can fail to confirm.

  3. Popper''s falsificationism: confirmation doesn''t exist; only failed refutation.
  Green apple is a non-refuting instance but not confirmation. Equivalent to a pseudo-confirmation
  due to survival? Not exactly.

  4. Goodman-style/theory of natural kinds?


