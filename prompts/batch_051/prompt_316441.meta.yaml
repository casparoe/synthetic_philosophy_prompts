  The false presupposition: that the Principal Principle issues a simple unconditional
  rule for setting credence upon learning chance, rather than a constraint on conditional
  credence relative to admissible evidence. The prompt could ask "isn''t the PP absurd
  if it says ignore 20 heads?" Actually the answer: the PP doesn''t say that.


  But wait, is the confusion exactly right? Suppose the chance is known to be 0.5
  (you *know* the coin is fair) and you observe 20 heads. Should you set next credence
  to 0.5? By Bayesian reasoning, yes, conditional on knowing the chance is 0.5 and
  independence, the streak doesn''t matter. So the PP wouldn''t be absurd here. The
  confusion would be if you *don''t* know the chance but treat the 0.5 as something
  to defer to despite evidence. The prompt needs to not accidentally assert that 20
  heads rationally shifts your credence even when you know the coin is fair. So the
  scenario of "watched it land heads 20 times" implies your knowledge of fairness
  is undermined. The asker might say: "I know the chance is 0.5 because the coin was
  certified by a perfect mechanism, but then I saw 20 heads..." Hmm, if you *really*
  know the chance with certainty, then 20 heads doesn''t undermine it (except by making
  the "knowledge" no longer knowledge if you retreat). But from a subjective Bayesian
  perspective, you''d never have logical certainty unless you assign the chance hypothesis
  probability 1, and then evidence can''t move it. Many people would still be surprised
  if they merely had strong evidence of fairness, but "having strong evidence" isn''t
  "knowing the chance." So the PP question is subtle and could confuse the asker.


  I think the cleaner scenario for the PP confusion: "A reliable oracle tells you
  the objective chance of rain tomorrow is 0.8; but then you look at satellite data
  that makes rain nearly certain. Does the PP forbid you from moving off 0.8?" Actually
  the satellite data may be about the same event; if it''s outcome-relevant, inadmissible;
  PP doesn''t require 0.8. Or better: "You know the chance of heads is 0.5, then the
  coin is flipped and you catch a blurry glimpse that it landed heads—are you rationally
  required to stay at 0.5 because the principal principle says defer to chance?" The
