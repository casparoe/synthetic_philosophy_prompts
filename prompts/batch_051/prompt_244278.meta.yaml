  ---


  I review grant proposals at a small foundation that funds "culture change" interventions
  in public health — programs that try to shift some set of values, norms, or meanings
  in a community and claim that shift will cause a health outcome. I see proposals
  that say things like "the problem is a culture that treats more treatment as better
  care" or "we will reduce vaccine hesitancy by rebuilding trust as a community value."
  I need a way to tell, before we spend money, whether the cultural explanation in
  a proposal is doing real causal work or just re-describing the outcome in fancier
  words. I''ve been told this is exactly the problem Max Weber ran into with the Protestant
  ethic and the rise of capitalism, and that there is a philosophical literature on
  what it even means for a value or a cultural pattern to be a cause.


  Please write a screening procedure my team could actually run on a proposal in under
  an hour. It should be grounded in whatever the philosophy and historical sociology
  of cultural explanation actually establish: for instance, the difference between
  culture as a cause, as an effect, as a background condition, and as a re-description
  of the behavior to be explained; the requirement that the mechanism be specifiable;
  and the danger of explaining the values by more values forever. The procedure should
  be a numbered checklist or decision tree in words: the questions in order, what
  counts as a sufficient answer to each, where the procedure stops with a no, and
  where it must hand the decision to a person because the question is one of values
  or evidence we cannot get. Flag the steps that are judgment calls dressed up as
  procedure.


  Then run the procedure on three proposals:

