  I coordinate a volunteer flood-rescue unit in a region where we get a handful of
  bad seasons a decade. When a call comes in, whoever is on scene has maybe ten minutes
  to decide which site we go to first, and the wrong call means people die. Our standing
  rule has always been: if you can only reach one group, go to the larger one. I have
  started to think that rule has never actually been justified to us. I can see why
  we save as many as possible when resources are expandable, but in a forced choice
  between one person and five people, I cannot see how the four extra lives make the
  five''s claim any stronger. Each of those people needs rescue exactly as much as
  the one does, and the one''s need does not shrink because there are five others
  elsewhere. So I am drawn to the view that the numbers do not by themselves count
  — but I am also uneasy, because I know a procedure built on that view would sometimes
  leave a child behind while I save one adult, and I would have to explain that to
  a family.


  I am asking for a reusable decision procedure for my team, built on the commitment
  that each imperiled person''s claim counts equally and that the bare number of claimants
  is never a reason. It has to be something a tired, non-philosophically-trained volunteer
  can run in ten minutes in the field, without me there. It should walk through the
  questions in order and say what counts as an adequate answer to each, where the
  procedure stops with a definite instruction (go to group A, go to group B, draw
  lots), and where it stops being a procedure and hands the decision to a person because
  a value judgment is unavoidable.


  The procedure must be honest about the hard cases, and I already know most of them:
  unequal chances of success (six people panicking in fast water versus one person
  on a stable roof), special relationships (a rescuer''s own family member is in the
  smaller group), partial information (a group may be larger than reported, or already
  dead), and cases where we cannot even identify individuals before choosing. But
  the hardest one for me is this: if I really think each person has an equal claim,
  I cannot tell whether that forces drawing lots between the groups (so the one is
  as likely to be saved as the five) or whether it forces giving each individual an
  equal chance (so the five, as a group, win five times out of six). Those look different,
  and one of them seems to sneak the numbers back in. The procedure has to settle
  that, and explain why the answer is not just a dressed-up way of counting heads.


