  Draft:


  "You are a professional philosopher working in social ontology and the philosophy
  of the social sciences, with a side interest in the metaphysics of classification.
  I am a philosophy professor putting together a graduate seminar on the question
  whether generational categories — Boomers, Millennials, Gen Z, and so on — pick
  out real kinds, or are merely convenient (or misleading) labels for statistical
  aggregates. I''d like you to produce the specification I will use in class: the
  list of desiderata that an adequate theory of social kinds must meet if it is to
  settle, for any proposed cohort category, whether that category counts as a real
  kind. Before you write the list, take some time to brainstorm the candidate criteria,
  the cases the theory would have to get right, and the different purposes for which
  people invoke generational labels; then give me the polished result.


  The purpose is fixed: the theory should be adequate for adjudicating whether a generational
  category is a real kind for the purposes of social explanation and ordinary social
  cognition — that is, for deciding whether talk of ''Gen Z'' or ''Boomers'' earns
  its place in serious explanation or is better treated as a reified stereotype. For
  each requirement on your list, give the consideration or case that motivates it.
  Then mark each requirement as either non-negotiable — any theory that failed it
  would be a non-starter — or as a preference of a particular camp (e.g., those who
  think real kinds require shared causal mechanisms versus those who think stable
  property clustering is enough).


  Make sure your list engages at least the following pressure points: (i) the age–period–cohort
  problem, and whether an adequate account must distinguish cohort effects from age
  effects and period effects before it can attribute anything to a generation; (ii)
  whether real-kind status requires a common generative mechanism (shared formative
  events, institutions, economic conditions), shared properties, or merely robust
  statistical clustering, and what the differences among these options would mean
  for generational kinds; (iii) how the account handles the fact that generational
  boundaries are fuzzy, contested, and sometimes drawn retrospectively, given that
  many uncontroversial kinds also have fuzzy boundaries; (iv) whether the account
  must respect the finding that within-cohort variation usually swamps between-cohort
  variation, and whether that fact by itself rules out kindhood; (v) whether the account
  can allow that a generation might be real in one respect — as a demographic cohort
  with shared exposure to events — while not real in another — as a cultural kind
  around which people organize their identities — and whether ''real kind'' should
  therefore be treated as multiple notions rather than one; and (vi) whether the desiderata,
  taken together, are jointly satisfiable, or whether some of them pull against each
  other (for example, requiring both a common mechanism and stable property clustering
