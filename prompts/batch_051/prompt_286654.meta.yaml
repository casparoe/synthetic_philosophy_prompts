  I have been trying to work out for myself how a person should act when they are
  not completely sure which moral view is correct. The question is not which moral
  view is true, but what to do now, given that I assign some confidence to more than
  one view and they point in different directions. Before I adopt any answer, I want
  the full list of requirements that an adequate rule for acting under moral uncertainty
  has to meet. I am not asking for the rule itself; I am asking for the specification
  that any proposed rule gets judged against.


  For each requirement, give the case or consideration that makes it a requirement,
  and say whether it is non-negotiable or only the preference of one camp. Then flag
  any subset of the requirements that probably cannot all be fully satisfied at once;
  that is the part I most want to see. Finally, say which single requirement does
  the most work in eliminating the rules people usually propose.


  In particular, the list should speak to each of the following:

  - The comparison problem. Two moral views may not share a common unit for measuring
  how much better or worse an option is, so a rule that says to maximize expected
  moral value may be doing arithmetic on scales that were never made comparable. What
  must a rule do about this instead of pretending the scales line up?

  - Permissibility and vetoes. If one view says an act is merely allowed and another
  says it is badly wrong, when, if ever, should the permissive view win? When should
  a low-probability view that treats an act as forbidden function as a veto, and when
  should a near-certain view that the act is fine let me ignore a far-fetched view
  that it is catastrophic?

  - Views with no numbers. Some defensible moral views only rank options as better
  or worse without saying by how much. The rule must not force such a view into an
  invented numerical scale merely to make the arithmetic easy.

  - Acts versus plans. The rule should say whether it applies to single acts or to
  whole policies, since a rule that chooses tolerable acts one at a time could produce
  a life that every view I actually hold considers worse than a plan chosen all at
  once.

  - Uncertainty about the framework itself. If I am uncertain about how to handle
  moral uncertainty, that looks like the same problem one level up. The rule should
  say whether it applies to itself or stops the regress somewhere, and where.

  - Factual versus moral uncertainty. Some of my uncertainty is about what the world
  is like and some is about what matters. The rule should state whether these are
  combined in one calculation or kept apart, and why.

  - Wagers and doomed bets. A tiny chance of a very large moral catastrophe, or of
  a view that demands extreme sacrifice now, can dominate a calculation if the numbers
  are allowed to run free. Under what conditions should a rule ignore a small probability
  rather than let it dictate the act?

  - Options that keep options open. Whether an adequate rule must sometimes prefer
  an act that is worse on every view I currently hold because it leaves future choices
  available if my moral views change.


  Then, briefly, score against the list the rule that follows the most likely view,
  the rule that maximizes expected moral value where the views can be made comparable,
  and the rule that only forbids acts that every non-negligible view condemns. Keep
