  Moore''s paradox prompt (type 1): The claim: "Saying ''p, but I don''t believe that
  p'' is somehow self-defeating — but is it a logical contradiction, or just a rule
  of conversation?" The asker wants: an experimental design to distinguish "can''t
  be true" (semantic) from "can''t be asserted without oddity" (pragmatic). Also embeddings
  the distinction: "Moore''s sentence" doesn''t embed like a contradiction (e.g.,
  "It''s raining but I don''t believe it" can be true of me — in fact it''s true whenever
  it rains and I''m out of the loop — whereas "It''s raining and it''s not raining"
  can''t). Wait, that''s the key conceptual point: p & ~B(p) is not a contradiction
  in the semantic sense because it can be true (the person just lacks the belief).
  It''s "Moore''s paradox" because it can''t be asserted truthfully/sincerely — but
  the sentence could be true. Actually versions differ: omissive (p but I don''t believe
  p) and commissive (p but I believe not-p). The omissive can be true but not assertable;
  the commissive if true involves failing to know? Hmm.


