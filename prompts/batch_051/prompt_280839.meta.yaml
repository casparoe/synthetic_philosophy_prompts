  I am writing the section of a longer project in democratic theory where I have to
  state my own position on referendums, and I want a consistency audit before I present
  it. My current commitments are:


  1. The legitimacy of a democratic decision rests on whether the procedure treated
  citizens as political equals, not on whether the decision-making was well-informed
  or whether the outcome is, on the merits, good policy.

  2. The Brexit referendum was a legitimate exercise of collective self-government.
  Although I would have voted Remain, simply overturning or ignoring the result after
  the fact would have been a kind of anti-democratic paternalism.

  3. California''s ballot-proposition system is, on balance, a failure as an instrument
  of government: it allows well-financed interests to draft confusing measures, and
  it asks voters to legislate without the information, deliberation, or capacity for
  amendment a legislature provides.

  4. Switzerland''s highly frequent use of referendums is broadly healthy and shows
  that direct democracy can be stable and competent under the right institutional
  conditions.

  5. Courts are right to strike down referendum outcomes that would violate entrenched
  individual rights, even when a clear majority supported the outcome.


  I suspect that some of these are in genuine tension and others only appear to be,
