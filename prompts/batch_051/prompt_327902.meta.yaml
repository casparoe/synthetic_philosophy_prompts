  Luck egalitarianism: Dworkin''s distinction: option luck is risk you choose to take
  (e.g., gambling); brute luck is risk not chosen (e.g., lightning). Translating to
  variance components: total phenotypic variance can be decomposed into genetic, shared
  environment, nonshared environment, plus interactions. Brute luck corresponds to
  environmental variance not chosen. But heritability itself is a population statistic;
  an individual''s trait is the sum of genetic and environmental components; choices
  are also traits. The notion of "option luck" has no clean counterpart because the
  deliberate risk-taking behavior is itself a phenotype with genetic/environmental
  causes. Gene-environment correlation: people choose environments based on genotype
  (active/evocative rGE). Reaction norm: genotype''s mapping from environment to phenotype;
  option luck might be like... hmm, the environmental side includes both luck and
  chosen environment, which are not statistically separable without further assumptions.
  The residue: the attribution of "responsibility" or "choice" doesn''t map; the framework
  is descriptive of sources of variation, not normative agency. Also, heritability
  decomposes variation in a population, not causes within an individual, so the luck
  egalitarian question "is this outcome due to this person''s choice?" is a within-individual
  causal-counterfactual question, which variance components can''t answer. That residue
  is meaningful.


