  aren''t predictions, and novel moral cases don''t "surprise" us the way data do.

  4. Theory-ladenness and reflective equilibrium: in science, we also revise intuitions
  (e.g., about space and time), but the revision is forced by measurements; in ethics,
  the pressure is dialectical rather than empirical, so the analogy may be closer
  to theory choice in mathematics or grammar/law than in empirical science.

  5. Simplicity may be aesthetically or heuristically valuable but not truth-conducive
  in ethics; parsimony might even be a vice (i.e., an "impartial" single principle
  may be too coarse to fit deeply held moral distinctions).

  6. Moral theories are partly action-guiding and deliberative, not just descriptive-explanatory;
  simplicity might have practical value for decision procedures (e.g., a simple rule
  is easier to follow), which is a different kind of virtue than epistemic simplicity.


