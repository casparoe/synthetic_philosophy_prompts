  The analogy components:

  Source domain: natural science (theory choice).

  - Theory (e.g., Newtonian mechanics vs. epicycles): simpler with fewer free parameters/ad
  hoc postulates.

  - Data: observations, experimental results, independent measurements.

  - Fit: theory must fit data; small misfits can be tolerated if theory is otherwise
  more powerful/simpler, or indicate measurement error/auxiliary assumptions.

  - Simplicity/parsimony: Ockham''s razor; a criterion for selecting among empirically
  equivalent or comparable theories; frills, ad hoc parameters count against.

  - Prediction/novel prediction as evidence.

  - Progress: theories converge toward truth.


  Target domain: ethical theory choice.

  - Moral theories (consequentialism, deontology, virtue ethics, contractualism, Rossian
  pluralism, particularism).

  - Data: "considered judgments" / intuitions about cases (trolley problems, etc.).

  - Fit: theory should systematize/explain intuitions; principled revision of intuitions
  possible (reflective equilibrium).

  - Simplicity: e.g., monistic consequentialism vs. Ross''s pluralism about prima
  facie duties; parsimony in basic principles; the charge that pluralism is "unparsimonious"
  or ad hoc.

  - The work the analogy does: some philosophers argue we should prefer a single-principle
  moral theory (e.g., utilitarianism) because it''s simpler, even if it conflicts
  with some intuitions; or reject particularism because it''s theoretically unsatisfying.
  Also in the other direction: pluralists say fit with intuitions matters more and
  simplicity isn''t a moral virtue.


  Disanalogies:

  1. The "data" in ethics are not independent observations of an external reality;
  they are the outputs of the same cognitive apparatus/inherited moral culture that
  the theory is supposed to explain/critique. Data in science are (mostly) causally
  downstream from the phenomena; intuitions may be error-prone, culturally variable,
  parti pris.

  2. In science, simplicity is a guide to truth only if the world is kind (nature
  is simple) and we have independent evidence; it''s a pragmatic/epistemic virtue
  with methodological warrant. In ethics, it''s unclear there''s a fact of the matter
  that simple theories are more likely to track. Whether moral reality (if it exists)
  is simple is an open question.

