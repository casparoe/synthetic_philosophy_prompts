  ---


  I''m a journalist who reads a lot of history in my spare time, and I keep tripping
  over a pattern I don''t have a word for. Take dueling. For a couple hundred years,
  moralists and clergy condemned it, and in plenty of places it was illegal, but men
  kept doing it because walking away from a challenge meant losing face in front of
  their peers. Then, in the space of a generation or two in the nineteenth century,
  it pretty much collapsed in Britain and the United States. But if I look at what
  actually changed, it wasn''t that somebody finally landed a new, devastating argument
  against it. The arguments were all old. What changed was more that the whole thing
  started to seem ridiculous—like theatrical aristocrats playing at being knights,
  something a serious middle-class man would be embarrassed to be mixed up in. And
  once that happened, the very same people who had shrugged off the moral case for
  years started repeating it as if it were the thing that had persuaded them.


  I''ve seen the same shape in the end of footbinding in China, at least as popular
  histories tell it. It lasted for centuries and there were always critics, but it
  unraveled with surprising speed around the turn of the twentieth century—not because
