  Draft:


  "I''m a PhD student in epistemology teaching a 16-person upper-level undergraduate
  epistemology seminar. We''re two sessions into a unit on Nozick''s tracking theory.
  The first session covered the sensitivity condition, the adherence condition, the
  grandmother case, and the role of methods. I want the second session — 90 minutes,
  in class, no assigned reading rerun — to be a structured activity rather than discussion
  of the readings, in which students actually experience why Nozick thinks closure
  fails, rather than just debating it. The core idea I want them to feel bodily: a
  belief-forming method can be beautifully reliable at tracking ordinary truths about
  one''s situation and structurally incapable of tracking the negations of skeptical
  hypotheses, because the method gives the same output in the skeptical world; denying
  closure then looks less like obstinacy and more like an honest description of what
  methods can do. I also want the activity to expose a lurking problem in the theory:
  everything turns on how the method is individuated, and there seems to be no principled
  way to type methods so that the ordinary verdicts and the skeptical verdicts both
  come out right."


  Then: "Please design the activity with these sections, in this order, totaling roughly
  2000 words:

  1. Learning aim (150 words). State exactly what students should be able to see,
  and which standard presentation of the theory this is meant to replace.

  2. Materials and setup (350 words). Give me concrete materials — a possible-world
  deck with the relevant hidden/observable features, a similarity ordering, group
  roles — and how to set up the room.

