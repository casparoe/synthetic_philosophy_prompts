  Background on void for vagueness doctrine (US): A criminal statute is unconstitutionally
  vague if it (1) fails to give ordinary people fair notice of what''s prohibited,
  or (2) encourages arbitrary and discriminatory enforcement (no clear standards for
  police/prosecutors/judges). Not everything needs mathematical precision; the law
  can use terms with core meanings. Courts consider whether terms have settled meaning,
  whether mens rea requirement narrows, whether conduct is already malum in se, etc.


