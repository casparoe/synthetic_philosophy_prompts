  The philosophical lens: three interpretations of probability:

  - Frequentism: probability is long-run relative frequency; a coin landing heads
  90+ times in a row is possible but astronomically improbable; the frequentist can
  only say the observed frequency is 100% heads, which paradoxically licenses the
  expectation that it will continue (or that the coin is biased). This dramatizes
  the reference class problem / the problem of the single case and the tension between
  a priori expectations and observed frequencies.

  - Subjectivism (Bayesian): probability is degrees of belief; Guildenstern''s subjective
  probability should update via Bayes: the prior that a fair coin would produce such
  a run is tiny vs. hypotheses like "the world is rigged," "we are in a play," "fate/death
  is behind it." Subjectivism captures how evidence rationally moves degrees of belief
  without needing objective chance — it licenses Guildenstern''s growing unease.

  - Propensity: probability is an objective tendency of the chance setup (the coin,
  the tossing procedure) to produce outcomes. The run suggests the setup''s propensity
  has changed or was never 1/2; but if the audience/characters believe it''s a fair
  coin, there''s no deterministic explanation; the play may posit hidden propensities
  ("something is going on").


  Where the metaphor holds: The run genuinely separates epistemic probability (Guildenstern''s
  belief states fluctuate) from physical chance (the coin just keeps coming up heads;
  the setup''s propensity seems altered). The play is a nice intuition pump for the
  single-case problem: a coin''s "fairness" is a property that a finite run can''t
  confirm or disconfirm decisively; frequentism''s long-run promise is useless to
  someone inside a finite sequence whose governing regularities may not be stable.


  Where it trades on confusion or stretches: In a stage play, probability is a narrative
  device; the run is scripted, not stochastic — the "hidden variable" is the author.
  So saying "the probability is 1 that it''s heads" (because the play is fixed) collapses
  the distinction. Also the existential point: Guildenstern is not really worried
  about the coin; it''s about being unable to infer the laws of his world from his
  observations — a problem of induction. So the play uses probability as a metaphor
  for epistemic opacity/fate, which is broader than the three interpretations.


  Where the play resists the reading: the interpretations of probability are about
  what "probability" means; the play asks whether the concept of probability can survive
  in a world where the standing regularities just fail — a more radical skeptical
  point. The philosophical debate assumes a stable setup; the play asks what happens
  when the setup itself is untrustworthy.


  Then the honest critic says: the play dramatizes the difference between "probability
  as a guide for a finite reasoner" and "probability as a fact about the world," which
  is exactly the fault line; but it doesn''t settle it — it shows the existential
  cost of not knowing which interpretation applies.


  Deliverable: a reading, scene-by-scene, where frequency/credence/propensity each
  illuminate a moment, and where the play gets something the papers don''t (the lived,
  finite temporality of probability judgments — no one gets to wait for the long run).


