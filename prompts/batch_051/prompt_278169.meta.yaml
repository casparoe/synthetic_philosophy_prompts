  I spent my career as a physicist before I got seriously into philosophy a few years
  back, and I''ve been reading Otto Neurath lately. Like everyone, I first met him
  through the boat metaphor (we are always rebuilding the ship at sea, no dry dock),
  but the thing that has grabbed me is his ISOTYPE project: he wanted to build a picture
  language with standardized symbols arranged by explicit rules, so that a chart about
  housing or public health could be read by anyone regardless of native language.
  The whole point was to keep the slipperiness of words out — each symbol fixed, unambiguous,
  reusable.


  Now I am typing this and the emoji keyboard is sitting at the bottom of my screen,
  and it looks like the world has grown itself a de facto picture language that Neurath
  never got to see. And it is the opposite of what he designed. Emoji are standardized
  in one sense — Unicode keeps the code points stable — but wildly unstandardized
  in another: the same symbol renders differently on different platforms, and the
  meanings drift faster than any committee can track. The sob face means laughter,
  not grief; the skull means "I''m dead" in the sense of "that''s too funny"; the
  eggplant means something else entirely. People drop these pictures into otherwise
  grammatical sentences and readers parse them fine, and nobody planned any of this.


  So here is the question I''ve been turning over: what would Neurath actually have
  made of emoji? Would he treat them as a vindication of his bet that people want
  to communicate with pictures across language barriers, or as a nightmare case of
  exactly the ambiguity he spent decades trying to design out of picture language?
  Take his actual commitments seriously — his socialism, his faith in planned standardization,
  his worry about words carrying unwanted connotations — and reconstruct his likely
  verdict, including where he might be torn. And then say whether his ISOTYPE rules,
  if someone imposed them on emoji today, would fix the system or destroy the thing
  that makes it work.


