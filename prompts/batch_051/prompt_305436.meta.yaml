  f* = 0.6 - 0.4 = 0.2, i.e., bet 20% of bankroll. Expected value per unit bet = 0.6*1
  - 0.4*1 = 0.2, +20% per unit.

  - Full Kelly maximizes expected log wealth, equivalently the long-run geometric
  growth rate, for a sequence of i.i.d. bets. It has the property that in the long
  run, with probability 1, it outperforms any essentially different strategy (Breiman''s
  theorem, roughly).

  - Fractional Kelly: betting c times the Kelly fraction for c in (0,1) reduces risk
  (variance) and drawdowns at the cost of lower growth rate; growth rate penalty is
  roughly ... Actually growth rate of half-Kelly is equal to 3/4 of full Kelly? Eh,
  no need.

  - The debate: Is log special? Samuelson''s critique: in a one-shot setting, Kelly
  is just a point on the CRRA/isoelastic utility curve; the "geometric" argument smuggles
  in a preference. Kelly answered Samuelson: maximize long-run growth; Samuelson:
  I asked about one period.

  - Ergodicity economics (Peters): For non-ergodic growth processes, the time-average
  growth rate differs from the ensemble average. A bettor maximizing expected wealth
  over the ensemble is optimizing something that doesn''t describe what happens over
  time to an individual. Under multiplicative dynamics, the time-average growth rate
  is log-based, which yields Kelly without assuming a utility function. Critics: the
  choice of time-average as the thing to maximize is itself a normative choice, and
  for one-shot or aggregate decisions ensemble average may be appropriate; also the
  "growth rate" itself is just a preference repackaged.

  - Model uncertainty / distributional uncertainty: even Kelly advocates often recommend
  fractional Kelly when you are unsure of the true probabilities (e.g., you disagree
  with the market, but your edge estimate is noisy, opportunities may have fat tails,
  or the model may be misspecified). Fractional Kelly as a response to parameter uncertainty
  vs. fractional Kelly as risk preference — these are different rationales that can
  coincide in behavior.

  - "Expected value vs. expected log" in the rationalist community: often the distinction
  is between naive "maximize expected value" (EV) and "maximize expected log wealth"
  for sequences of bets. The naive EV maximizer goes all-in (or bets as much as possible)
  whenever p > 0.5, and gets wiped out eventually (gambler''s ruin with probability
  approaching 1) under repeated even-money favorable bets if they bet too much. More
  generally, betting more than full Kelly reduces growth and eventually leads to ruin
  (for f > 2 * Kelly? Actually overbetting beyond 2x Kelly gives negative growth;
  but any f > Kelly gives lower growth and higher risk).

  - Multiple simultaneous bets: Kelly generalizes to a portfolio problem; correlations
  matter; no simple fraction.

  - If bets are not i.i.d. or you have a finite horizon (e.g., a tournament), growth-optimality
  is less obviously right.


