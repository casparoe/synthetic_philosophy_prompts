  Encyclopédie article "Geneva" proposing a theater in Geneva): His arguments include:

  - Theater does not improve morals; it merely makes the audience feel emotions they
  do not act on. The pity experienced at the theater is sterile, a fleeting sentiment
  that substitutes for real civic compassion.

  - Actors live inauthentically, by simulating passions not their own; this is morally
  corrupting and extends to the audience''s taste for artifice and self-display.

  - Theatrical catharsis is not real; after weeping over fictional suffering, spectators
  feel satisfied and exempt from real duties.

  - The theater is tied to luxury, idleness, and the corruption of a small republic''s
  civic virtue; it would undermine Geneva''s honest, simple, patriarchal/agrarian
  culture.

