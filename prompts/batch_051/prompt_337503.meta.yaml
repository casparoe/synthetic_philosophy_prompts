  So I cover the science-and-ideas beat, and lately I''ve been doing a bunch of pieces
  on fringe history — ancient mysteries, "the timeline is wrong," lost civilizations.
  I''ve noticed my gut verdicts on what counts as pseudohistory don''t line up with
  any definition I can state cleanly. Here are the cases I keep using, with my actual
  verdicts.


  Atlantis-as-literal-predecessor-civilization: pseudohistory. But I don''t think
  Plato was doing pseudohistory, because the Atlantis story is in a dialogue and is
  doing political-philosophy work; it becomes pseudohistory when people treat it as
  a research finding about the actual past.


  Ancient aliens, von Däniken style: pseudohistory. I don''t care that it''s popular
  or that some of the underlying artifacts are real; the moves are the problem.


  Fomenko''s New Chronology: pseudohistory, no hesitation.


  The "phantom time" claim that several centuries of the early middle ages are invented
  and Charlemagne didn''t exist: pseudohistory.


  Velikovsky-style catastrophism where the planets rearranged themselves in historical
  times: pseudohistory.


  The Donation of Constantine being a medieval forgery: not pseudohistory. That''s
  a claim that an important document was faked, and mainstream history accepts it.
  It feels different from Fomenko even though both say "lots of people were taken
  in by invented texts."


  Vikings in Newfoundland before Columbus: not pseudohistory — including in the decades
  before L''Anse aux Meadows, when it was mostly a saga-based guess and respectable
  historians thought it was romantic nonsense.


  Polynesian contact with South America before Columbus: not pseudohistory; I think
  it''s still underdetermined (sweet potato, maybe chickens), but it''s a ordinary
  empirical question, not a story that survives by being unfalsifiable.


  The one I can''t settle: Graham Hancock-type lost advanced civilization, wiped out
  by a Younger-Dryas comet, with Gobekli Tepe left behind as evidence. On one hand
  it uses real sites and a real climate event and makes predictions that could in
  principle be checked. On the other hand it feels like it starts from the conclusion
  and treats every counter-argument as academic gatekeeping.


  Is there a principle — or a small set of rules — behind my verdicts so far, and
  which of them does it force me to drop? Whats the principle say about the Hancock
  case: is it pseudohistory, heterodox-but-legitimate, or a genuinely different kind
  of thing? And I don''t want just the confident answer: tell me what would change
  your mind — which evidence, if it came in, would flip the Hancock call or break
  the principle — and where the line you draw is least secure.


