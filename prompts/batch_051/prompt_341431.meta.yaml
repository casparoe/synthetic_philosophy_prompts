  Let me formalize the argument:


  1. Suppose you have an imprecise credence in P, given by a set C of probability
  functions, or an interval [0.3, 0.7].

  2. If you''re rational, your interval reflects genuine uncertainty about the correct
  precise degree of belief: for each p in [0.3,0.7], you regard it as possible that
  p is the correct credence.

  3. So you must have a distribution over candidate precise credences (a second-order
  probability).

  4. By the law of total probability / averaging, that distribution pins down a single
  expected first-order credence, e.g. 0.5.

  5. Rational choice only ever requires a single probability (expected utility with
  that averaged credence), so the set is inert — it does no work.

  6. Therefore imprecise credences are either an incomplete specification of a precise
  credence or redundant; either way, they should collapse to a precise credence.

