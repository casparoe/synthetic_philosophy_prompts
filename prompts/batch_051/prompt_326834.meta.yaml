  The debate: We impose risks on others without their consent all the time (driving,
  industrial pollution, vaccinations policy, sending a child to school with a cold).
  Questions: When is it permissible to impose risk on someone without their consent?
  Views include:

  - Consent-based views: risk imposition wrong unless consented, but actual consent
  too demanding; hypothetical consent (what reasonable people would accept).

  - Compensation/ex ante views: risk may be imposed if the expected value includes
  compensation, or if it''s part of a fair system of ex ante benefits and burdens
  (e.g., driving benefits everyone).

  - Rights-based/threshold views: there''s a right against lethal risk imposition,
  but de minimis risks below a threshold don''t violate rights; the threshold might
  be set by social norms.

  - Contractualist views (Scanlon): a principle is right if no one could reasonably
  reject; risk imposition justified if it can be justified to each affected person;
  considers the reasons people have.

  - Welfarist/consequentialist: impose risk if expected welfare maximizes, possibly
  with distributive concern for the worst-off.

  - Precautionary principle: uncertainty itself demands caution, shifting burden of
  proof.


  Key distinctions:

  - Ex ante vs. ex post: justifying a risk by expected consequences before harm occurs
  vs. what actually happened.

  - Subjective vs. objective probability.

  - Individual vs. statistical lives: imposing a 1-in-a-million risk on a million
  people will likely kill one, but no identifiable victim yet.

  - Actual consent vs. hypothetical consent vs. implied consent.

  - Aggregation: small risks to many vs. large risk to one — can we aggregate? (This
