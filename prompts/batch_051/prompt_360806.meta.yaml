  I have found myself unable to settle a conflict between a principle I find theoretically
  compelling and an intuition I cannot shake, and I want a negotiated verdict rather
  than reassurance. The principle is a control condition on retrospective moral blame:
  a person can properly be blamed for an outcome only if they acted with adequate
  knowledge, understanding, and control over its production. This condition explains
  much of our practice in one stroke. It tells us why we excuse the unforeseeable
  consequences of ordinary actions, why coercion and delusion mitigate, and why we
  do not hold small children answerable in the full sense. It is also a principle
  I am reluctant to give up because it makes blame fair rather than merely useful.


  The trouble is a class of cases for which the principle seems to imply that nobody
  is blameworthy. Consider a system that learns its own decision policy from training
  data and from its own interactions, so that the lethal action it eventually takes
  in a road, triage, or battlefield setting is not one that any engineer selected,
  any manager foresaw, or any operator could have overridden. The engineers did not
  choose the policy; the managers did not know the policy could produce this; the
  system itself fails the control condition in the relevant sense, because it did
  not understand what it was doing. The principle''s conclusion is that a person has
  died and no one is retrospectively responsible.


  I find that conclusion morally intolerable, and the intuition is not merely that
  someone should pay for the harm or fix the software. It is that a social world in
  which a lethal outcome is, retrospectively, nobody''s fault counts as a kind of
  moral defeat rather than a clearing of the innocent. I have tried the standard reconciliations:
  treating the matter as future-looking accountability about compensation and redesigned
  safeguards, locating liability in whoever had some earlier oversight opportunity,
  or treating blame as something we may distribute to institutions even when no individual
  meets the control condition. None of them reaches the part of the intuition that
  insists something retrospective is still owed, and the intuition does not feel like
  a cognitive bias that reflection will dissolve.


  I want the strongest possible statement of both sides, and then a genuine answer
  to the question of which should yield. If the intuition should be debunked, show
  where its force comes from and why that source does not track moral responsibility,
  rather than merely pointing out that it is inconvenient for the principle. If the
  principle should be amended, say exactly where: is the control condition too strong,
  is the mistake the assumption that responsibility must attach to an individual,
  or should we recognise a category of institutional or vicarious answerability that
  does retrospective work? And if there is a reading on which the two are compatible,
  defend it against the obvious objection that the concept of blame has been quietly
  redefined to save the intuition. Please write the answer in British English.


