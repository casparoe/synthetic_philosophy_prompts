  Van Fraassen''s Reflection principle: a rational agent''s current credence about
  a proposition should equal her expectation of her future credence in that proposition,
  i.e., P_t(A | P_{t+1}(A) = x) = x, or more precisely P(A) = ∫ x dP(P_future(A)=x).
  Actually Reflection says your current credence should defer to your anticipated
  future credence. There''s a well-known critique: the diachronic Dutch book by van
  Fraassen, and also counterexamples like forgetting, drugs (you know you''ll be certain
  after taking a psychedelic that you can fly, but you shouldn''t now believe that).
  There''s a large literature on whether Reflection is a rational constraint.


