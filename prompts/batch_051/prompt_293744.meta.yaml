  Then list.


  "1. The central descriptive finding of moral foundations theory is basically right
  for the contemporary Western ideological spectrum: self-described liberals'' moral
  judgments are dominated by care/harm and fairness/cheating, while self-described
  conservatives'' judgments additionally draw heavily on loyalty/betrayal, authority/subversion,
  and sanctity/degradation, and this is a difference in which grounds get treated
  as morally relevant rather than merely a difference in factual beliefs or rhetoric.


  2. I don''t take that breadth to be a normative point in conservatism''s favor.
  Moralizing more domains is not by itself a kind of moral sensitivity; it can just
  as easily be overreach.


  3. I hold something like an impartiality constraint on moral and political justification:
  for a consideration to count in justifying a practice or policy, it must be acceptable
  from a standpoint that does not weight the interests or standing of the judge''s
  own group, rank, or way of life more heavily. Departures from impartiality are at
  best instrumentally justified.


  4. But I also think the extra foundations are not reducible to care and fairness
  in disguise. Loyalty, authority, and sanctity correspond to real normative phenomena
  — special obligations to particular persons and projects, the justifiability of
  some structured asymmetry, and a kind of respect for what a community marks off
  as inviolable — and a moral outlook built only from harm and fairness would flatten
  something genuine.


  5. The fact that a moral judgment is fast, affectively charged, and traceable to
  evolved intuitions is not itself a mark against it. Any moral judgment has to be
  produced by some psychological machinery, and correct judgments needn''t be slow,
  cool, or effortful.


  6. Nevertheless, I accept a debunking principle in outline: if the best explanation
  of why someone holds a moral judgment is a process that is insensitive to the features
  cited as making the act right or wrong, that is a defeasible reason to distrust
  the judgment.


