  Chain-of-thought faithfulness: the concern that a model''s stated reasoning may
  not be the actual computation. There is a mathematical/logical concept that captures
  when a derivation "really establishes" its conclusion vs. when it''s a mere "hermeneutic
  device": the distinction between a constructive proof that yields a witness and
  a non-constructive proof that only establishes existence. In a constructive proof,
  the derivation is the computation — the proof object is a program (Curry–Howard).
  In a non-constructive proof (e.g., via LEM or double negation), the conclusion is
  true but the proof may not produce the object. Similarly, a faithful chain-of-thought
  is like a constructive proof: the reasoning transcript is the actual computation
  that produces the answer. An unfaithful CoT is like a non-constructive proof: it
  establishes that some reasoning path exists (or supplies a plausible-looking one)
  without being the path by which the conclusion was reached.


