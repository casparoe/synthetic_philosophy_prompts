  Checklist: when is a retroactive/novel charge defensible? Steps:

  1. Identify the precise conduct and the law in force at the time.

  2. Determine whether the conduct was criminal under domestic law at the time (if
  yes, no retroactivity problem).

  3. If not, determine whether it violated a customary international law norm that
  was already binding (distinguish ex post facto punishment from applying pre-existing
  custom).

  4. Check whether the norm at the time had the status of "criminal" rather than merely
  a violation of international responsibility.

  5. Assess whether reliance interests are implicated: did the defendant have fair
  notice? Could a reasonable person have known?

  6. Weigh the gravity and systematicity of the conduct (mass atrocity exception?).

  7. Apply the "justice of the case" check: would acquittal produce a result repugnant
  to the tribunal''s function? But mark as judgment.

  8. Distinguish substantive retroactivity from retroactive jurisdiction (a new court
  applying old law is much less objectionable).

  9. Check selection bias / victors'' justice: is the charge applied only to the vanquished?
  Does the procedure handle "ex turpi" or "tu quoque" defenses?

  10. Write out how the reasoning will become precedent.


  Hard cases: prosecuting conduct that was criminal internationally but not domestically
  (e.g., crimes against humanity before they were codified); the "fair notice" objection
  for ex post facto; applying Nuremberg to the victor''s own forces (e.g., allied
  bombing). One case where the answer is unwelcome: the procedure might tell you not
  to charge heads of state for aggression if it can''t be shown it was a crime under
  international law at the time (or that the "crimes against peace" count was the
