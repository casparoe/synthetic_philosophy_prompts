  selves with different discount functions, and the morning self who plans to write
  and the evening self who scrolls are two parties in an intrapersonal bargaining
  game.


  That view is compelling to me because of its systematic virtues, not its comfort.
  A single beta parameter organizes an enormous amount of otherwise scattered data:
  procrastination, undersaving, workout avoidance, broken New Year''s resolutions,
  the specific shape of deadline-driven work, the reason precommitment works while
  mere resolve does not. It predicts preference reversal instead of treating it as
  noise, and it replaces a spooky piece of folk psychology — a "will" that mysteriously
  fails — with a precise model of how valuation shifts with temporal distance. I am
  attracted to a theory that unifies this much and explains it in terms I can actually
  compute with.


  But I have an intuition I cannot shake, and it sits directly in the path of the
  theory. When I fail to write and open the same notification loop instead, I do not
  experience myself as one player among several with no privileged position. I experience
  one agent — me, now — holding a settled judgment that the scrolling is the worse
  use of the next hour, and doing it anyway. The future self whose preferences the
  model says I am failing to coordinate with is not, in the moment, a separate person
  whose values have equal standing. I am the one who acts, and the failing feels local
  to me, not a coordination failure distributed across a sequence of selves. If the
  theory is taken at face value, "what I want" has no univocal answer across times,
  and neither the scrolling self nor the planning self is more rational — they simply
  have different discount functions. That seems to eliminate the very phenomenon it
  was meant to explain: the puzzling thing about akrasia is not that a later self
  wants something different, but that a single agent can judge an action worse and
  do it anyway within what feels like a single act of valuation.


  I do not want a shallow answer that tells me to make peace with the model because
  it is useful, nor one that tells me to trust the intuition because it is vivid.
  What I want to know is which should give, and in what direction, because I can see
