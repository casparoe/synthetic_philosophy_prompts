  "Inferring an optimizer''s objective and search space from its behavior" — key conceptual
  issues:

  - Behavior is a function from contexts/inputs to actions/choices.

  - Many (objective, search space) pairs can produce the same behavior (underdetermination
  / behavioral equivalence).

  - The search space includes the set of actions or strategies the optimizer considers;
  objective is what it ranks. Sometimes the search process reveals constraints: what
  options it never tries, what it tries early, how much compute, where it gets stuck.

  - You can infer "what it''s optimizing" only relative to a hypothesis class or equivalence
  class.

  - Distinguish objective from search: e.g., a chess engine''s search space is moves;
  objective is win probability; behavior weirdness can come from search (depth limits,
  traps) not objective (horizon effects).

  - Distinguish revealed objective vs intended objective vs effective objective.

  - Reward misspecification: an optimizer may pursue a proxy that correlates with
  target but diverges.

  - Goodhart: if we infer objective from behavior under one distribution, behavior
  may change under distribution shift.

  - Tests: vary available actions (add/remove options), vary context (menu dependence),
  measure resource allocation, look at indifference/sensitivity, perturbations.


