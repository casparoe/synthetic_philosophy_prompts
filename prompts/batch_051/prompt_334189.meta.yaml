  ---


  I have come to hold a Deweyan view about democracy and inquiry, and I want to stress-test
  it honestly rather than have it defended. The view, as I understand it, has four
  commitments:


  1. A public is not a pre-existing people, nation, or electorate. A public is constituted
  when associated activity produces consequences for people not directly party to
  it, and the task of that public is to notice, articulate, and regulate those consequences.


  2. The legitimacy of a collective decision is a function of how it is formed, not
  of its matching an independently given standard of the common good. A decision is
  warranted to the degree that it issues from an ongoing experimental process: a problem
  is formulated, alternative courses of action are proposed as hypotheses, their anticipated
  and actual consequences are compared, and the problem and the standards of success
  are themselves revised in light of what the experiment turns up.


  3. Expertise and technical science enter this process as tools within public inquiry,
  not as an authority over it. The definition of the problem, the judgment of which
  consequences count as harms or improvements, and the decision to continue or reopen
  the inquiry belong to the public constituted by those consequences. This is meant
  to avoid both technocracy and a brute majoritarianism: experts propose and test,
  but the testing is public and revisable.


  4. There is no criterion of the public interest outside this experimental process
  by which outcomes could be scored in advance; "better" and "worse" are themselves
  given content only within and through the process, much as warranted assertibility
  in science is fixed by inquiry rather than by a prior definition of truth.


  I want to know what would count against this position — not the standard dismissals
  (that it is utopian about citizen competence, too demanding, or merely vague about
  how to individuate consequences), but the findings, possible cases, and arguments
  that should actually move a committed Deweyan to weaken or abandon it. In particular:
  what would have to be true about politics, cognition, or social organization for
  this view to collapse into one of its rivals — technocracy, interest-group pluralism,
  Schumpeterian competitive elitism, or an epistemic deference to experts — rather
  than remaining a distinct alternative to them? Which of its commitments would defenders
  themselves concede as vulnerable under pressure, and which would they treat as definitional
  and therefore not up for refutation? I would find it especially damaging if the
  view could be shown to be circular in problem-definition: if the public that is
  supposed to define a problem is itself constituted by consequences whose description
  already presupposes a contested framing of the problem.


  Please do not hedge. I want a committed map of the view''s exposure: a ranked list
