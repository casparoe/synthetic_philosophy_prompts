  ---


  I''m a software engineer, not a philosopher, so I''ll ask this in my own terms.
  I''ve been reading about the idea that what you believe or expect can change what
  you literally see — I think it''s called cognitive penetration of perception. As
  I understand it, the claim is not just that your beliefs change how you interpret
  or report what you saw, but that they change the perceptual experience itself: the
  thing looks different, not just is judged differently afterward.


  The criteria I''ve picked up for whether something counts as cognitive penetration
  are roughly these:


  1. A cognitive state (a belief, expectation, desire, or something like that) has
  to be what does the causing.

  2. What gets changed has to be the perceptual experience itself, not the later judgment,
  memory, or report of the experience.

  3. The influence has to be direct — if the belief only works by making you look
  somewhere else, squint, move closer, or selectively attend to part of the scene,
  that''s supposed to be a different, uncontroversial mechanism and doesn''t count.

  4. The resulting experience has to be of the same basic kind as ordinary perception
  — for example, actually seeing something as red, rather than merely feeling sure
  that it is red.


  Now here''s the case I want to test against these criteria. During code review,
  a colleague leaves a comment on a pull request: "there''s a bug in the parse loop."
  I open the file, and before I have worked out what the bug is, the flagged region
  of code looks wrong to me. It''s hard to describe: the line seems visually heavier
  or somehow malformed, and the tokens read as broken, the way a misspelled word looks
  wrong before you can say which letter is off. The effect is stronger when I trust
  the reviewer and disappears when I think the reviewer is unreliable. If I scroll
  past the line without knowing where the comment points, nothing looks off. Once
  I find the bug and understand it, the line stops looking wrong and just looks like
  code.


  Is this cognitive penetration of perception, or does it only look like it? In particular,
  I can''t tell whether the reviewer''s comment is changing my visual experience of
  the code, or merely directing my attention to a region (which criterion 3 would
  rule out), or making me judge the line as buggy after the fact (which criterion
  2 would rule out). Does this case force me to revise the criteria themselves — for
  instance, is the line between attention and perception, or between seeing a word
  and reading it, less clean than my criteria assume? I''d rather you diagnose the
  case than just give me a verdict, and I''d like you to be explicit about which parts
  of this are settled and which are genuinely contested among people who work on perception,
  rather than presenting one side of a live dispute as the consensus.


