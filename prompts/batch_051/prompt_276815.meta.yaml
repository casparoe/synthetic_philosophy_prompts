  ---


  Had a long argument with an old friend last night about privacy, and hes convinced
  its value is entirely downstream: losing privacy matters only because the information
  can be used to embarrass, blackmail, discriminate, manipulate you, etc. He kept
  saying that if you''re the kind of person who wouldn''t be hurt by any of that,
  you lose nothing. I kept pushing the line that being watched matters even when the
  watcher never does anything with what they learn. I''m trying to write a short essay
  about this and would like comments on the idea.


  My working claim is that privacy is partly constitutive of having a self you can
  try things out and revise without an audience: being observed changes how you think
  and act, so the value isn''t just avoiding downstream harms, it''s being able to
  let your guard down. I''ve been leaning on this passage from Warren and Brandeis''s
  The Right to Privacy (1890):


  "The intensity and complexity of life, attendant upon advancing civilization, have
  rendered necessary some retreat from the world, and man, under the refining influence
  of culture, has become more sensitive to publicity, so that solitude and privacy
  have become more essential to the individual; but modern enterprise and invention
  have, through invasions upon his privacy, subjected him to mental pain and distress,
  far greater than could be inflicted by mere bodily injury."


