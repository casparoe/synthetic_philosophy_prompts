  Potential prompt:


  "I have been reading debates about whether DNA is literally a code or whether talk
  of genetic information is a useful but ultimately misleading metaphor. I want to
  apply that framework to a concrete scientific controversy, as a test of how much
  work the concept of a code is actually doing.


  The case is the ENCODE project''s 2012 claim of function for most of the human genome.
  The consortium used a deliberately broad operational definition: a base pair counted
  as functional if it exhibited a specified biochemical activity, such as being transcribed,
  bound by a protein, or associated with a particular chromatin state. On this definition,
  roughly 80 percent of the genome appeared functional, and the announcement was widely
  reported as the death of junk DNA. Many evolutionary geneticists objected that this
  criterion conflates activity with function. They argued that a sequence is functional
  in the relevant sense only if it is maintained by selection, that the conservation
  data could not accommodate 80 percent function, and that transcribed and bound sequence
  often reflects noise, parasitic repetitive elements, or transient molecular interactions
  rather than an evolved instruction set.


  Analyze this episode through the lens of philosophical work on genetic information
  and the claim that DNA is a code. In particular, draw at least the following distinctions
  and put them to work:


  1. DNA as a Shannon-style channel: sequence as a physical variable that reduces
  uncertainty at a downstream receiver (for instance, a splicing apparatus or a transcription
  factor) regardless of whether that receiver is an adaptation.

  2. DNA as causal/instructional information: a sequence is a code only insofar as
  it directs a specific biological outcome, with the mapping between sequence and
  product holding reliably and with the right kind of causal specificity.

  3. DNA as semantic or representational information: the stronger claim that a sequence
  means or is about a product or phenotype, with the possibility of misrepresentation,
  error correction, and a distinction between sender, message, and receiver.


  Then use those distinctions to answer: Which of ENCODE''s functional claims survive
  under each sense of information? Does widespread transcription and binding show
  that much of the genome is part of a code, or does it show that causal activity
  is cheap and that the code metaphor is failing to discriminate? Does the biochemical-activity
  definition beg the question by treating correlation as communication? And conversely,
  is the selection-based criterion too restrictive — can there be code-like biochemical
  activity that matters in development or regulation without being conserved enough
  to show up in comparisons? Finally, draw the two-way lesson: what does the framework
  explain about the ENCODE dispute, what does it miss, and does the episode suggest
  that the language of code and information is a precise tool, a vague analogy, or
  a term with several distinct meanings that the controversy was really about?"


