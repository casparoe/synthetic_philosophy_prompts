  I have been reading the philosophical dispute over whether DNA is literally a code,
  and whether talk of genetic information is a precise claim or a metaphor that papers
  over distinctions. I want to stress-test that framework against a concrete scientific
  controversy, done as a two-way case analysis.


  The case is the ENCODE consortium''s 2012 announcement that the large majority of
  the human genome — the headline figure was around 80 percent — is functional. The
  consortium used an operational definition of function as specified biochemical activity:
  transcription, protein binding, or a particular chromatin state. On that definition,
  most of the genome counts as functional, and the result was widely reported as overturning
  the idea of junk DNA. Many evolutionary geneticists objected that this conflates
  activity with function. They argued that function in the biologically relevant sense
  requires evidence of selection, that conservation data cannot accommodate 80 percent
  functional sequence, and that transcription or binding often reflects noise, repetitive
  elements, or transient interactions rather than an evolved instruction.


  Use the code/information literature to analyze the episode. Distinguish at least
  three senses in which DNA might be said to bear information: [1] Shannon-style correlation,
  where a sequence reduces uncertainty at a downstream receiver regardless of whether
  the receiver is an adaptation; [2] causal or instructional information, where the
  sequence reliably directs a specific outcome with the right kind of causal specificity;
  and [3] semantic or representational information, where the sequence is about a
  product or phenotype, with the possibility of misrepresentation and error correction.
  Then answer the following.


  Which of ENCODE''s functional claims survive under each sense? Does the biochemical-activity
  definition turn mere correlation into communication? Is the selection-based criticism
  too restrictive — can developmentally important but poorly conserved biochemical
  activity still be code-like? Finally, run the analysis in the other direction: which
  features of the ENCODE dispute does the code/information framework explain, which
  features does it distort or leave out, and does the episode show that the language
