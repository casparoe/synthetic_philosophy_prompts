  Let''s write:


  "I coordinate the grading for an undergraduate history of science course. Each term,
  sixty students write a short paper in which they reconstruct an argument from an
  older scientific or mathematical text in their own words, and three teaching assistants
  each grade about twenty of these papers in a weekend. The recurring group disagreement
  is not about mechanics but about anachronism: one TA lets a student say Aristotle
  ''had a theory of inertia'' or that Euclid ''used algebra'' as shorthand, treating
  them as harmless modern dress; another wants to flag any use of current notation
  or concepts as a distortion of what the historical author could have meant. We need
  a single reusable procedure, not a list of examples, that a graduate TA with no
  special expertise in the period can run in ten minutes on a paper before assigning
  a grade. It should say, in order, what to check; which substitutions and modernizations
  are safe and which are not; what the TA should do when the paper is in the grey
  area; and when the procedure must stop and send the case to me rather than pretending
  the checklist has settled it.


  Please ground the procedure in the actual distinctions the history and philosophy
  of science has developed around anachronism, presentism, and rational reconstruction,
  but translate them into questions a grader can answer without reading the primary
  text in the original language. Include the hard cases: rendering an old result in
  modern notation, attributing a modern concept or problem to a text that runs on
  different notions, evaluating an old claim against later experimental or mathematical
  standards, and reading the historical importance of a result back into the author''s
  stated aims. Then apply the finished procedure to three worked examples, at least
  one where it requires marking down a paper a TA found acceptable and one where it
  requires accepting a paper that initially looked suspiciously modern. End by saying
  what the procedure cannot determine: which judgments of anachronism rest on a historiographical
  or philosophical commitment that no checklist can settle, how the procedure should
  flag that for me, and how the grader should phrase it honestly to the student."


