  Strawson''s Basic Argument:

  (1) Nothing can be causa sui—nothing can cause itself.

  (2) To be truly morally responsible for one''s actions, one would have to be truly
  responsible for the way one is, at least in certain mental respects.

  (3) To be truly responsible for the way one is, one would have to have brought it
  about that one is that way.

  (4) Bringing about that one is that way requires that one already existed with certain
  principles of choice, preferences, and capacities.

  (5) So one would have to be responsible for those prior features, leading to an
  infinite regress.

  (6) Therefore, no one can be truly morally responsible for the way one is; hence
  no one can be morally responsible for one''s actions.


