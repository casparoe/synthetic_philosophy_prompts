  Prompt:

  "I teach an undergraduate survey in the history of science and mathematics. The
  main paper asks students to explain an argument from an older scientific or mathematical
  text in their own words. My TAs and I repeatedly disagree about when a student''s
  account crosses from legitimate translation into anachronism: one TA lets students
  say Aristotle held a ''theory of inertia'' or that Euclid ''used algebra,'' another
  flags any modern notation as a distortion. I need a reusable grading procedure,
  not just a list of examples, grounded in whatever the history and philosophy of
  science has actually argued about anachronism, presentism, and rational reconstruction.
  It must be something a grad TA with no special expertise in the period can run in
  ten minutes on a paper before marking it. The procedure should tell them, in order,
  what to check; which moves are safe and which are not; and where the procedure must
  stop and refer to me. It should include the hard cases: using modern notation to
  report an ancient result, attributing a modern concept when the texts uses a different
  one, judging the old work by modern standards, and reading later significance back
  into the old text. Please also apply the procedure to three worked examples, at
  least one where the procedure forces us to mark down a paper the TA thought was
  fine, and one where it forces us to accept a paper that read too modern at first
  glance. End by stating what the procedure cannot do: which judgments of anachronism
  rest on a historical or philosophical commitment that no checklist can settle, and
  how the procedure should report that uncertainty to the student rather than hiding
  it."


