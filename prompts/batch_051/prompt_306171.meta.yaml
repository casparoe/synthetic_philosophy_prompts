  Potential prompt:


  "I have been trying to reconstruct an argument I encountered secondhand, and I would
  like a diagnosis. It is presented as Galen Strawson''s Basic Argument against moral
  responsibility. I will lay it out as I understand it, then say why it troubles me.


  (1) A person acts as she does because of the way she is: her beliefs, desires, values,
  temperament, and capacities.

  (2) If a person is to be truly morally responsible for what she does, she must be
  truly responsible for the way she is that issues in the action.

  (3) To be truly responsible for the way she is, she must have intentionally brought
  it about that she is that way.

  (4) But she could not have intentionally brought it about that she is that way unless
  she already had some prior beliefs, desires, values, and capacities by which she
  chose to make herself that way.

  (5) Those prior features would then themselves be things for which she must be truly
  responsible, and the same demand applies to them; thus the required self-creation
  can never get started except with something for which one is not responsible.

  (6) Hence no one is truly morally responsible for the way she is.

  (7) Therefore no one is truly morally responsible for what she does, and the practices
  of blame, credit, punishment, and guilt are resting on a mistake.


  Each premise by itself looks plausible, and the inference from (6) to (7) follows
  from (2). Yet the conclusion seems to prove too much: it would make the careful
  embezzler no more blameworthy than someone who acts under duress or psychosis, and
  it would make deserved punishment impossible. I would like to keep ordinary moral
  responsibility, and I am inclined to think one of (2) or (3) is doing the work,
  but I cannot say exactly what is wrong with either, or what I would have to give
  up to reject it. Where does the argument go wrong, if it does? Please name the specific
  step or premise you reject, explain why it can look unassailable while still failing,
  and price the main alternatives: what must one say about ''responsibility for the
  way one is'' if the conclusion is to be avoided, and which of our ordinary practices
  survive or collapse on each alternative?"


