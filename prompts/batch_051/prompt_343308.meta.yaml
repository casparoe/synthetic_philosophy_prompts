  Draft:


  A friend and I have spent the past few weeks arguing about collective memory and
  history. We keep coming back to cases where a community''s shared memory of an event—what
  it meant, how it happened, whether it happened at all—conflicts with the documentary
  or archival record, and we cannot agree on which should give way. Our book club
  is reading Tim O''Brien''s The Things They Carried this month, and I want you to
  read it through that exact lens for us.


  The novel is full of moments where the narrator insists that the truth of a war
  story is a matter of what it felt like rather than what happened, and it openly
  blurs the line between the names-of-factual record and the group''s storytold past.
  For the purposes of the question, treat the platoon and the audience the narrator
  is trying to make believe as a memory community, and treat the historical or documentary
  version of the Vietnam War as the record. Your job as a critic is not to flatten
  the book into an allegory. Give a two-way reading: where does the novel seem to
  argue that the memory of a group can, and sometimes should, outweigh or override
