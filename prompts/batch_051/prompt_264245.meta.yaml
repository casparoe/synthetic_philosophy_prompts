  Kant''s distinction between intuitions and concepts: A notable tension: Kant defines
  intuition as singular representation (Logik, Jäsche) vs concept as general representation;
  but in the Transcendental Aesthetic he treats space/time as pure intuitions that
  are a priori; in the Schematism he says concepts must be brought to intuition via
  schemata. Hmm.


  Actually a well-known interpretive puzzle: Kant insists intuitions and concepts
  are distinct and neither can do the other''s work ("The understanding is not able
  to intuit, and the senses are not able to think"), but in the Transcendental Deduction
  and elsewhere, the pure concepts of understanding have a role in the very constitution
  of experience/intuition of objects, and the unity of intuition depends on the understanding.
  This seems to make intuition dependent on concepts, threatening the separation.
  Or the "blind intuitions" remark suggests intuitions without concepts are blind
  — but then there can be intuitions without concepts, even blind ones.


  Alternatively: Kant says concepts must be applicable to possible experience/intuition
  to have objective validity, but also that the categories are not derived from experience.
  Not a conflict.


