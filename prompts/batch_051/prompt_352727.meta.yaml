  The paradox of deontology (also called the "paradox of deontological constraints")
  is associated with Samuel Scheffler''s "The Rejection of Consequentialism" and discussions
  by Nozick. The core: deontological constraints (side constraints) against killing,
  etc., are agent-relative: I may not kill one innocent person even to prevent five
  other innocent people from being killed. But if killing one is the only way to prevent
  five killings, the constraint says I must not kill, even though by killing I would
  minimize the total number of violations of the very same constraint. Thus the constraint
  appears to forbid an action that would produce fewer instances of the kind of action
  it condemns — it is, in a sense, self-defeating from an agent-neutral perspective;
  it seems to care more about my not violating than about there being fewer violations.
  That''s the paradox.


  Open questions / sub-debates:

  - Whether the paradox dissolves if the constraint is "victim-focused" (the victim''s
  right against me forbids me from using them as a means) rather than "agent-focused"
  (avoid doing wrong oneself). If constraints are grounded in what I owe each person,
  then the agent-neutral counting of violations misunderstands the structure.

  - The aggregation question: whether it is ever permissible/obligatory to minimize
  violations of a constraint when the disproportion is large (threshold deontology),
  and how thresholds are defended.

  - The scope of constraints: do constraints apply to omissions and enablements as
  much as to actions? If I can prevent a harm only by doing harm, is that different
  from allowing harm? The doing/allowing distinction''s relevance to the paradox.

  - The relationship between constraints and prerogatives: Scheffler argues the agent-centered
  prerogative is more defensible than agent-centered restrictions; why are constraints
  needed if a prerogative already limits demands? Could deontology be defended with
  prerogative but no restrictions? This is known.

  - Whether the paradox is genuinely paradoxical or just reflects agent-relativity;
  whether it generalizes to any agent-relative consideration (e.g., intentions, special
  obligations). If the same "self-defeat" applies to special obligations, maybe the
  paradox isn''t uniquely deontological.

  - What the paradox implies for the architecture of moral theory: does it force us
  toward either consequentializing deontology or rejecting agent-relative constraints?
  Is there a stable middle?

  - The role of "sophisticated" consequentialism vs. deontology; whether a rule-consequentialist
  who blames vs. a deontologist.


