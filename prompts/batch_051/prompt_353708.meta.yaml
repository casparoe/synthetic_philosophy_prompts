  Potential final:


  I''m currently taking a course on the ethics of communication and trust, and we''ve
  been working through a debate I''d like to think about with a work of fiction in
  view. Some of the readings argue that we have a fairly strong duty to be legible
  to others: to make our reasons, intentions, and commitments sufficiently interpretable
  that other people can trust us, coordinate with us, and hold us appropriately responsible.
  Others push back, saying that the demand for legibility can be coercive — that it
  punishes ways of being that don''t fit a community''s available scripts and offloads
  the work of understanding onto the person who is already less powerful. A distinction
  that keeps coming up is between legibility as making one''s conduct intelligible
  in a shared practice and legibility as being answerable on demand, and I suspect
  a case study would help separate them.


  I''d like to use Herman Melville''s "Bartleby, the Scrivener" as that case study.
  The story turns on Bartleby''s famous, repeated refusal to comply with his employer''s
  requests, always delivered politely but without any justification; the lawyer-narrator
  responds by trying ever harder to understand, accommodate, and finally rescue him.
  Read the story through the lens of the duty-to-be-legible debate. What does it show
  about whether opacity is a wrong done to others, about the costs and coercions of
  demanding legibility, and about the difference between being intelligible and being
  answerable on demand? Where does the story resist both the pro-opacity and anti-opacity
  readings? Please answer as exactly five numbered points, each one or two sentences,
  with no introduction or conclusion.


