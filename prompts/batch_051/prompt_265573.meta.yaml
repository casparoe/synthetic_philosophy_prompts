  Let me think carefully about Good''s theorem to make sure the summary is mostly
  right with subtle errors. The theorem: For any expected-utility maximizer, the expected
  value of cost-free information is nonnegative. I.e., a Bayesian decision-maker should
  not pay to avoid costless information. It''s due to I.J. Good (1967). The idea:
  observe data E, choose action maximizing posterior expected utility; the expected
  value with information is at least value of choosing the prior best action regardless
  of E, because you can always ignore the information (choose best prior action in
  every branch), so the value is nonnegative. The theorem is "dynamic consistency"
  / value of information.


