  seek out information" or "information can''t hurt you." Actually, conditional on
  a particular outcome, you might be worse off knowing, but ex ante it''s nonnegative.
  Also information can hurt if it changes decisions in ways with costs, or if it''s
  used by others / strategic settings, or if the act of choosing/processing is costly,
  or if you''re not a Bayesian EU maximizer.

  - Overstating that Good''s theorem resolves the question or shows ignorance is not
  bliss.

  - Conflating value of information with value of clairvoyance or perfect information.

