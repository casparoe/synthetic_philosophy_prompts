  Draft:


  "I''ve been trying to pin down exactly what the ''problem of logical omniscience''
  does to one of the standard epistemic logic puzzles, and I want you to work it through
  with me. Take the muddy children puzzle: n children, some number k have muddy foreheads,
  each can see everyone else but not themselves, and the parent announces ''at least
  one of you is muddy.'' In the usual telling, if there are exactly k muddy children,
  they all put their hands up on the k-th round of ''do you know whether you''re muddy?'',
  and the proof tacitly assumes these kids are perfect reasoners — knowledge closed
  under everything they can churn through, arbitrarily nested ''she thinks that I
  think that she thinks...'' arguments.


  Here''s the variation. Suppose each child is a finite reasoner in one specific way:
  every child can nest beliefs only to depth d — meaning it can run thoughts of the
  form ''they know that I know that...'' with at most d levels; to go one level deeper,
  it bottoms out at ''I can''t represent what they''d conclude from that.'' Everyone
  knows this about everyone (so d is common knowledge), and the parent''s announcement
  still happens.


  Work out what actually happens as a function of d and k. My guess is the classic
  k-th-round result survives iff d ≥ k−1, because a muddy child seeing k−1 muddy foreheads
  needs a depth-(k−1) chain of ''if I were clean, then...'' to pull the trigger. But
  I want you to check whether the failure below that is total (nobody ever raises
  a hand), whether the clean children can ever wrongly conclude they''re muddy, and
  what the first round tells us about how much of the puzzle is doing the logical
  work and how much is just the public announcement. If you want a concrete case to
  run first, use n=5, k=3, d=1, then generalize."


