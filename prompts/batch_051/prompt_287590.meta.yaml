  We treat curiosity as a virtue and spend public money on knowledge for its own sake,
  yet in private life we often treat the same disposition as nosiness, prurience,
  or a harmless failure. A planetary scientist who reconstructs the geology of a world
  nobody will ever visit is admired and funded; a person who quietly learns everything
  about the lives of the people on her street is viewed with suspicion; a colleague
  who wants to know what everyone says about him behind his back is called morbid
