  is indulged but faintly pitied. Each is pursuing true beliefs with no obvious practical
  payoff. Is there a principled difference among them, or is calling curiosity a virtue
  mostly a way of honoring the curiosities we already find respectable? Give the strongest
  version of the candidate distinctions — significance of the object, structure (understanding
  versus isolated facts), method, motive — and test them against awkward cases: curiosity
  about serial killers with no theoretical interest, systematic and careful research
  into something flatly trivial, a field of pure mathematics whose own practitioners
  expect no application, a child''s insistent why-questions. If the distinctions collapse
  into "we simply value some objects more than others," say whether you would keep
  the asymmetry, drop the praise of curiosity, or give up the condemnation of the
  snoop — and whether a smaller, less self-congratulatory idea of curiosity as a virtue
