  toss between saving the one and saving the five — is at least as defensible as simply
  saving the larger group. My argument rests on a pairwise comparison of complaints:
  in each one-to-one comparison the complaint of death is of the same magnitude; the
  only question is whether several equal complaints collectively outweigh one equal
  complaint, and I deny that they do unless some further story about the separateness
  of persons is told. I am not denying all aggregation: I grant that when the harms
  differ in magnitude, or when there is an established practice whose justification
  does not depend on the disputed summing, numbers can matter. What I deny is that
  bare cardinality among equivalent life-or-death claims does the work.


