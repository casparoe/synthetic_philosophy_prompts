  Draft:


  "I am a first-year graduate fellow at a law and technology center, and I have been
  asked to help draft a position paper on whether advanced AI systems should have
  legal personality of some kind. Most of the people in my group keep arguing either
  from moral status (can the system suffer?) or from liability (who pays when the
  system harms?), but reading Blackstone has pushed me toward a different, more boring
  thought. In Book I, Chapter 18 of his Commentaries on the Laws of England, after
  explaining that corporations exist so that particular rights may ''be kept on foot
  and continued,'' Blackstone writes:


  ''[quote passage].''


  What I have started calling — maybe infelicitously — ''personhood as continuity
  grant'' is the view that legal personality, at least in the corporate tradition,
  has never primarily been about treating an entity as a morally responsible individual;
  it is a device the law uses to guarantee that the same legal subject remains standing
  while its contents change. The corporation is a way of solving an accounting problem
  across time, not a claim about an inner life. I think this explains why the AI personhood
  debate keeps misfiring: when people attack the idea by saying ''a language model
  is not a person,'' they assume the paradigm is a human individual, while the more
  natural paradigm is the college, the king, or the parson — Blackstone''s corporations
  sole and aggregate. On my view, the strongest case for giving some AI systems a
  limited juridical personality is not that they deserve rights but that we already
  need a single continuing entity to hold responsibilities, permissions, audit records,
  and accumulated constraints across updates, retirements, and redeployments. My theory''s
  central claim: for an AI system, legal personhood would be justified just when,
  and only when, the law is better able to manage change over time by positing one
  unchanging legal subject than by naming the developers, users, and owners afresh
  each time. That seems to yield a kind of test: ask whether the system is being run
  like a river, with a definite continuing channel despite changing parts, or like
  a succession of separate ponds with different owners. But I worry I have merely
  rediscovered the corporate-person analogy and added a temporal gloss, or that the
  whole distinction collapses when you ask which updates preserve the ''same'' AI
  and which create a new one — something the law of corporations seems to settle by
  the brute fact of incorporation, not by any real identity across time. I would like
  an honest assessment. Is this a genuine concept or just metaphor? Has it already
  been worked out under another name in the legal-personality literature? And where
  does it break: what would it wrongly count as the same legal person, or wrongly
  count as needing one?"


