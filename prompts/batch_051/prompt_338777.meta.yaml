  information has to be counted as part of the physical world, and that the bit''s
  value in the thermodynamic account comes entirely from what the bit lets the engine
  do.


  In decision theory there is a structurally similar piece of bookkeeping. The expected
  value of a signal is defined as the gain in expected utility from making a decision
  after observing the signal rather than before; it is never negative, because one
  can always ignore the signal. And Blackwell''s theorem states that a more informative
  signal yields weakly higher expected utility for every possible decision maker.
  Here, too, a bit of information is worth something only through the decisions it
  improves — utility is the currency, and the information is assigned no value in
