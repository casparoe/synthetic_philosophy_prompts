  Potential prompt:


  I''m a journalist covering science and ideas at a general-interest magazine, and
  I''m working on a long feature about the philosophical underpinnings of the modern
  "evidence-based wellness" movement—nutrigenomics, continuous glucose monitors, GLP-1
  appetite-suppressants, quantified self, biohacking, and the moralized diets that
  surround them. I keep returning to Nietzsche, not because he was a health scientist
  in a modern sense, but because he wrote with unusual intensity about diet, digestion,
  altitude, climate, alcohol, and the discipline of the body, and he explicitly connected
  these to the health of the spirit: to whether a person is capable of clear thought,
  independent judgment, and self-overcoming. Interpreters disagree about how literally
  to take his recommendations and how much of them was retrospective self-mythologizing.
  Still, the underlying commitments are contested but not obscure: his suspicion of
  "ascetic ideals" that negate the body, his insistence that a philosopher''s ideas
  are symptoms of his physiology, his hostility to moral systems built around pity
  and ressentiment, and his conviction that self-mastery must be achieved rather than
  outsourced.


  For the feature, my editor wants a section that projects Nietzsche forward: not
  what he literally said, but what his considered position would most plausibly be
  on several modern developments he never lived to see, such as (1) the rise of continuous
  self-monitoring and algorithmic diet personalization, (2) GLP-1 drugs that chemically
  suppress appetite and promise weight loss without the struggle of ascetic discipline,
  and (3) the moralized veganism/plant-based movement with its ethical claims about
  animal suffering. Draft the section as a single coherent essay, written for an educated
