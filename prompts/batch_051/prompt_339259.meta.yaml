  ---


  I am a student in an intellectual history course on classical Islamic theology,
  and we have spent the past few weeks on the Mu`tazila–Ash`arite dispute over the
  source of moral normativity. As our professor has framed it, the debate is an Islamic
  version of the Euthyphro dilemma: do rightness and obligation come from God''s command,
  or does God command certain acts because those acts are antecedently right? On the
  Mu`tazila side, as I understand it, acts have moral qualities such as good, bad,
  and obligatory in virtue of features that reason can at least partly discern, and
  God commands what is good because it is good — the command does not exhaust the
  reason the act is right. On the Ash`arite side, moral status just is God''s command
  and prohibition: an act is obligatory because God commands it, and had God commanded
  the opposite, the opposite would have been obligatory. The two camps also seem to
  use terms like reason, good, and ought differently.


  I would like you to draft the document that a good-faith adversarial collaboration
  between a Mu`tazili and an Ash`ari should have produced after a year of sustained
  discussion. Please include the following. First, a numbered list of substantive
  claims both sides could sign — more than truisms, ideally claims that locate exactly
  what is common ground about God, moral language, and the dispute itself. Second,
  a disagreements table in which each side''s position is stated in wording that its
  own proponents would accept. Third, the cruxes: the sub-questions on which the disagreement
  genuinely turns. I suspect one crux is whether a human judgment that an act is good
  is a real deliverance of reason or only a felt attitude that gets dressed up in
  moral language; there may be others, and I would like you to state them precisely.
  Fourth, for each crux, describe a case or argument both sides would agree bears
  on it, and record each side''s prediction in advance. Finally, tell me which parts
  of the dispute are likely verbal rather than substantive — for example, whether
  they are using reason or good in different senses.


  Please also say how confident you are in the substantive claims you make, and single
  out the point you are least sure of.


