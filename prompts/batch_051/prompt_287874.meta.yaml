  ---


  I''ve been trying to reverse-engineer the principle behind my own judgments about
  complicity: when does someone share in a wrong they participate in but do not cause?
  I keep a running list of cases and my verdicts, and my first-pass rule — that complicity
  tracks how much difference one''s contribution makes — fits some but not all of
  them. Here they are.


  1. A getaway driver waits while his associates rob a bank; the job would have been
  called off without him. I judge him complicit in the robbery, and substantially
  so.


  2. A second lookout is hired for the same job, but watches a back entrance the first
  lookout already covered. His presence changes nothing and the robbery proceeds exactly
  as it would have. I still judge him complicit in the robbery, though less than the
  driver.


  3. A woman in an angry crowd chants for the prisoner to be hanged. The killing would
  have happened without her voice; no one who acted can be shown to have heard her.
  I judge her complicit in the killing, but much less than those who handled the rope.


  4. A hardware dealer sells bolt cutters to a man who says he will use them that
  night to break into a warehouse. The dealer doesn''t approve, but sells at full
  price. The buyer could have bought identical cutters a block away, so the sale changed
  nothing about the crime. I judge the dealer at most barely complicit — callous,
  maybe, but not party to the burglary.


  5. An electric utility connects power to a warehouse it knows houses a counterfeiting
  operation, at the standard tariff. If refused, the operation would shift to another
  address or generator at low cost. I do not count the utility''s decision-makers
