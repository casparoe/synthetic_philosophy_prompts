  Parallel sides:

  Side A: The Pasadena game. Define game: toss a fair coin until first heads; n =
  toss number; payout +2^n/n if n even, −2^n/n if n odd (or vice versa). The naive
  expected-value series is Σ (prob_n × payoff_n) = −1 + 1/2 − 1/3 + 1/4 − ⋯, which
