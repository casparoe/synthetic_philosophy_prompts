  integrability; here it''s not absolutely summable, so the expected value is undefined
  — there is no well-defined "fair price." The finite "−ln 2" is an artifact of one
  particular enumeration.


  Side B: Software phenomenon. Two real possibilities:

  1. Floating-point summation: adding the same set of floats in different orders gives
  different results because rounding errors accumulate order-dependently; worse, the
  result isn''t just "slightly off" but if terms vary over huge magnitudes, adding
  small terms first can make the sum differ significantly, and some rearrangements
  can look like a defined finite total while another order fails. But here order matters
  due to finite precision, not the mathematics of the real numbers.

  2. Distributed stream aggregation: a data pipeline computes a running sum/count
  over events whose order depends on scheduling; the reported aggregate at any checkpoint
  isn''t unique; or with eventually-consistent systems, merging logs in different
  orders yields different states. Some aggregates are commutative/associative, so
  order doesn''t matter; others (e.g., approximate distinct counts? maybe too niche)
  yield different results.


