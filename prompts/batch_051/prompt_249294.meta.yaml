  "Write a dialogue between a substantivalist and a relationist about a specific argument
  in Newton''s Principia, in the Scholium to the Definitions. Newton first considers
  a bucket of water rotating in otherwise empty space, observing that the water''s
  surface becomes concave; he then imagines two globes joined by a cord, revolving
  about their common centre of gravity in a vast void. He says the tension in the
  cord reveals the true rotational motion of the globes, because the globes would
  strive to recede from the axis of rotation even if no other bodies existed. The
  substantivalist regards this as evidence that space itself is a real entity with
  causal powers, distinct from all matter. The relationist responds that motion is
  only intelligible as change of relative position, so any talk of rotation in a perfect
  void is a disguised appeal to the distant fixed stars or to some preferred frame;
  the void case is not physically meaningful. In their dialogue, each should engage
  the other''s strongest formulations: the substantivalist must answer the claim that
  unobservable absolute motion is empirically idle once cosmology is written in relational
  terms, and the relationist must answer the claim that the tension in the cord is
  an observable difference that the relational account can only explain by covertly
  reintroducing absolute space. Do not let either side be a strawman; both should
  be equally competent, and each should make at least one concession while maintaining
  the disagreement."


