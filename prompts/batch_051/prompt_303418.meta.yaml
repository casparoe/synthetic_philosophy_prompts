  range, over whether a word such as ''run'' or ''sharp'' really has a meaning, several
  discrete meanings, or only a pattern of uses that shifts with context. I would like
  you to do something fairly demanding.


  Restate that debate in my native vocabulary, as precisely as you can. Take at least
  the following positions: one on which a word has a small inventory of discrete senses
  and context selects among them; one on which a word has a single highly general
  meaning that is then pragmatically sharpened or enriched on each occasion of use;
  and one on which words have no stable meanings at all, only occasion-specific constructions
