  for a week. He knows exactly what the boxes contain and wants the scheme to succeed,
  though he is also confident the nephew could have found another hiding place without
  much trouble. Verdict: complicit.


  4. Dana, after the fact, sends a note to a coworker who vandalized their supervisor''s
  car, saying she is glad someone finally did it. She had no advance knowledge, took
  no part, and did nothing else. Verdict: not complicit.


  5. Elif lets her brother store smuggled fuel on her property for a few days, knowing
  the details, because she wants the enterprise to succeed and wants to help him.
  Verdict: complicit.


  6. Farid is a utility worker who keeps power running to a whole district. A business
  that he has never heard of uses the electricity to run a fraudulent telemarketing
  operation. Verdict: not complicit.


  Now I want to know how she would rule on these three new cases:


  7. Gwen runs a small web-hosting company. A fake tech-support operation signs up
