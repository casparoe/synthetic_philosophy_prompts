  it explains morality rather than just describes it. A view like Ross''s list of
  prima facie duties (fidelity, gratitude, beneficence, non-maleficence, etc.) strikes
  me as gerrymandered taxonomy: it flows from a tidy list but doesn''t tell me why
  those duties and not others, and it can''t say what to do when they conflict except
  "use judgment," which feels like giving up on theory.


  On the other hand, when I actually test the one-principle views against my firmest
  intuitions, they keep missing things in the same way. The simplest utilitarian view
  says it''s fine to break a promise made to a friend on their deathbed, even if nobody
  will ever find out and it changes nothing about the world except that a commitment
  went unmet; my intuition says that''s not just wrong but wrong in a way a boost
  in downstream well-being can''t cancel. And it''s not only promises — the doing/allowing
  distinction, the intending/foreseeing distinction, and special obligations to one''s
  own children all strike me as genuine moral structure, and each one is a separate
  parameter the simple theory has to deny or absorb as a "heuristic." A theory that
  eats all that as mere heuristics starts to look unfalsifiable to me, and one that
  adds each distinction back starts to look like the very list I was trying to avoid.


  So I''m stuck between two moves that both seem right. Either (a) my intuitions are
  the product of how I was socialized, evolved, or how I reason about low-stakes thought
  experiments, and a parsimonious theory is exactly the right kind of thing to be
  willing to override them; or (b) parsimony is much weaker evidence in ethics than
  in physics because the moral facts, if there are any, may be irreducibly plural
  — and fitting our best intuitions is the whole game, so simplicity is at most a
  tie-breaker.


