  I''ve been trying to settle something in epistemology and I keep going around in
  circles. Here''s the tension.


  The theory I find myself attracted to is a pretty simple reliabilism about justification:
  roughly, a belief is justified just in case it''s formed by a reliable process.
  I like it because it unifies perception, memory, testimony, and reasoning under
  one mechanism, and because it doesn''t require you to know that you''re reliable
  in order to have justified beliefs — a dog or a small child can know stuff without
  having a theory of their own reliability. It also gives clean verdicts in a huge
  range of cases, which is more than I can say for most views.


  But here''s the intuition that won''t leave me alone. Take my color vision. I look
  at a wall, it looks red, I believe it''s red, and the process that produces that
  belief is (let''s grant) reliable. Now I reason: "The wall is red. My color vision
  says the wall is red. So on this occasion my color vision got it right." Repeat
  on many occasions with many surfaces. It seems like, on the reliabilist picture,
  I''ve just acquired a justified inductive argument for the conclusion that my color
  vision is reliable — a conclusion I reached entirely by relying on the very faculty
  whose reliability is at issue. And that feels like cheating. It''s too easy: I get
  an epistemic free lunch, vindicating my eyes using my eyes. The belief "my color
  vision is reliable" just doesn''t feel justified when it''s produced that way, even
  though every step looks licensed by the theory.


