  "I am preparing a teaching unit on the ethics of migration—open borders, integration,
  and the welfare state—and I want to use Neill Blomkamp''s film District 9 (2009)
  as the central case, not as a topical illustration. The film strands a population
  of insect-like aliens in Johannesburg, confines them for two decades to a militarized
  slum, and then attempts a forced relocation, while the surrounding society responds
  with revulsion, exploitation, and fears about crime, disease, and resource strain.
  Against this, set the philosophical debate: the cosmopolitan case that persons should
  be free to move and settle and that coercively excluding them demands justification;
  the communitarian or membership-based reply that a polity may control admission
  because shared identity and trust underwrite redistribution; and the narrower welfare-state
  objection that open movement would strain public services and the solidarity that
  funds them.


  Read the film through these positions, in both directions. Where does the film give
  the welfare-state objection genuine dramatic force—for instance, in how the authorities
  justify relocation on public-health and public-order grounds—and where does it expose
  such justifications as rationalizations for cruelty or rent-seeking? What does the
  arc of the protagonist Wikus van de Merwe, from bureaucrat enforcing eviction to
  a fugitive who is himself becoming alien, show about whether integration and equal
  concern require becoming one of the excluded, and is that the film''s strength or
  a moral-psychological mistake? Does the film portray the aliens'' failure to integrate
  as a cause or a consequence of their exclusion, and what follows for the view that
