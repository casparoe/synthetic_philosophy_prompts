  I''m on the animal care and use committee at my university, and were stuck on a
  protocol that has to be voted on Thursday. It''s from a neuro lab that wants to
  run roughly two hundred crayfish through a study where they ablate parts of the
  tail and record from the nerve cord afterward — without any anesthesia or analgesia.
  Their write-up says decapod crustaceans are invertebrates with no cortex, so the
  "behavioral responses are nociceptive reflexes, not pain." Some of us started asking
  whether that distinction can actually bear the weight they''re putting on it, and
  now the committee is split three ways. One faction wants to reject the protocol
  outright as cruel. Another says this isn''t even in our remit, since our charge
  covers vertebrates and the lab came to us voluntarily; they also point out that
  anesthetic dosing for a crayfish is poorly worked out and might kill more animals
  than it helps. A third faction wants to approve it with conditions like local analgesics
  and limits on how many animals get the worst procedures, but honestly nobody can
  say whether the analgesics do anything for them.


  The philosophical question under all of this is where the line actually falls for
  consciousness in animals and what we''re supposed to do when we don''t know. I keep
  coming back to the idea that we don''t require proof of human-level self-awareness
  before we take mammalian pain seriously — we treat a rat as capable of suffering
  even though we can''t get inside its head. So why is the default for a crayfish
  the opposite? But the other side has a real point too: if we call every nociceptive
  organism sentient, we''ll be an animal care committee for sea anemones and fruit
  flies before long, and "better safe than sorry" isn''t obviously coherent when the
  animals are not even certain to have experiences. I''ve ben going back and forth
  all week.


  A few members keep bringing up that the UK''s Animal Welfare (Sentience) Act of
  2022 lists decapod crustaceans and cephalopods alongside vertebrates as sentient,
  which makes our "invertebrates don''t count" boilerplate look outdated. But I also
  know our committee can''t just import another country''s legal line.


  Please draft the short decision memo I''ll circulate before the Thursday meeting.
  It should make a concrete recommendation — approve, reject, or approve with conditions
  — with a defensible rationale and an honest treatment of the strongest argument
  on the losing side, because whichever way we go, someone''s going to be furious.


