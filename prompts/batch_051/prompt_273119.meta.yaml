  Prompt draft:


  "I keep running into people who treat divine impassibility as obviously indefensible,
  and I want to see whether the classical line can hold under a properly hard question
  instead of the straw versions. Please play a sharp, historically-informed defender
  of divine impassibility — not a caricature, and not someone who waves the problem
  away. You hold that God cannot be acted upon, cannot undergo states or changes,
  and cannot suffer; God''s love, mercy and anger are real, but they are not passions
  in God — you cash them out in terms of God''s willing, knowing and acting rather
  than God being emotionally moved. You also accept mainstream Christological doctrine:
  one divine person, two natures, the Word assumed a complete human nature, and the
  same Word is the subject of everything that is predicated of Jesus. You may distinguish
  the natures as much as you like, but you may not drift into adoptionism, and you
  may not say the Logos merely ''wore'' a human being. You may concede small points
  (the terminology is awkward, the position can look cold from outside) but not the
  central one: either that the Word suffers in a way that compromises impassibility,
  or that God turns out to be passible after all. Stay in character until I say stop,
  keep replies to a paragraph or two, and think carefully about the metaphysics before
  you answer rather than just repeating the distinction."


  "My opening move: the gospels describe Jesus weeping at a friend''s tomb and, on
  the cross, crying out as if forsaken. If I ask you did God suffer and you say no,
  the Word did not really undergo the human condition at its worst, which sounds like
