  Pascal''s wager (Pensées, S680/L418 or thereabouts): The wager argument involves
  "God is, or He is not." We must choose. Reason cannot decide. Weigh the gain and
  loss: if you wager that God exists and He does, you gain an infinite happiness;
  if you wager against and He doesn''t, you lose little. Therefore, bet on God. Then
  the interlocutor says: "I am forced to wager... I am so made that I cannot believe.
  What would you have me do?" Pascal replies: "Learn from those who have been bound
  like you... follow the way by which they began: by acting as if they believed, taking
  holy water, having masses said, etc. That will make you believe and will stupefy
  you ("cela vous fera croire et vous abêtira")."


  Elsewhere, Pascal emphasizes that faith is a gift of God: "La foi est un don de
  Dieu; ne croyez pas que nous disions que c''est un don de raison." ("Faith is a
  gift of God. Do not think that we say it is a gift of reason.") Actually this is
  from Pensées (S487?). And there''s the famous: "C''est le cœur qui sent Dieu, et
  non la raison. Voilà ce que c''est que la foi, Dieu sensible au cœur, non à la raison."
  ("The heart feels God, not the reason. That is what faith is: God felt by the heart,
  not by reason."). Also "Console-toi, tu ne me chercherais pas si tu ne m''avais
  trouvé." (from the Memorial?).


