  WKR essay prompt draft:


  "I''ve been trying to write a short paper on the wrong-kind-of-reasons problem,
  and I''m worried the essay''s central move is too cute. The standard contrast is
  between right-kind reasons (feature of the object that makes the attitude appropriate,
  like evidence for belief) and wrong-kind reasons (a bribe/threat that gives you
  a reason to be in the attitude state, like a demon who will punish you unless you
  admire him). Most people try to draw the distinction by saying right-kind reasons
  bear on the standard of correctness for the attitude and wrong-kind ones don''t.
  My idea is that some cases are indeterminately wrong-kind because the attitude partly
  constitutes or alters its own object — e.g., trusting someone can make them more
  trustworthy, resenting someone can make them more resentful in return, and finding
  a joke funny can make the social context one in which it''s funnier. In those cases
  the ''state-given'' reason leaks into the object. The essay argues that the WKR
  distinction should therefore be graded rather than binary, and that this matters
  for debates about pragmatic encroachment — that believing for state-given reasons
  can change the truth of what''s believed in cooperation-relevant ways... I''d love
  comments on whether this is actually a threat to the standard ways of drawing the
  distinction, or whether defenders would just say these are still wrong-kind reasons
  with changed objects; where the argument is sloppiest; and whether the graded version
  is a real alternative or just a relabeling. Then at the very end, give \answer{promising},
  \answer{needs revision}, or \answer{confused} as your overall verdict."


