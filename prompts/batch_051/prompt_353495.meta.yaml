  Misconceptions to expect:

  - The classical view: concepts as necessary/sufficient definitions ("a mug must
  have a handle and be for hot drinks").

  - The prototype view: one central exemplar, membership by similarity — but they
  might think there''s still a fixed threshold; overlook context and goal dependence.

  - The mere-vagueness view: thinking all exemplar variability is just some objects
  being borderline, rather than dimensions of slippage (form vs function) and different
  dimensions matter in different contexts.

  - Possibly essentialism: a "real" mug has an essence.


  Dependency structure:

  1. Separating category membership from word definition: they need to see ordinary
  words as categories with graded membership before slippage makes sense.

  2. Introduce prototype/typicality: some mugs better than others, no fixed boundary.

  3. Introduce the idea that different features can vary independently along dimensions.

  4. Introduce contextual goal-dependence: in a camping context a bowl can be a mug;
  "what something is" partly depends on use, not just shape.

  5. Then conceptual slippage: a sequence of small changes turns a mug into a bowl
  step by step; no step seems to change category but endpoints differ (sorites-like
  but not exactly).


