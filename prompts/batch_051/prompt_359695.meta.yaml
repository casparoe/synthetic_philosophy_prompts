  The subtle confusion for the prompt: A reader reads Mill''s attack on appeals to
  "the nature of women" and concludes Mill denies any role for nature, or that Mill
  thinks nature-talk is always ideological. That''s a false presupposition. The good
  answer would say: Mill''s argument is more specific — he''s arguing we can''t justify
  women''s subordination by an appeal to their nature, because that "nature" has been
  formed under subordination and has never been observed under conditions of freedom;
  he allows that there may be real differences but says we can''t know them yet, and
  his primary target is the inference from observed differences to just subordination/incapacity.


  Alternatively the confusion could be the opposite: a reader thinks Mill''s point
  is that women and men are by nature identical (he actually says we can''t know;
  the artificiality thesis is about what''s been made of women, not a claim that no
  natural differences exist). That''s a classic misunderstanding.


