  Let me recall the key issues for Scanlon''s contractualism and aggregation:


  Scanlon''s contractualism: an act is wrong if its performance under the circumstances
  would be disallowed by any set of principles for the general regulation of behaviour
  that no one could reasonably reject as a basis for informed, unforced, general agreement.


  The aggregation problem: Scanlon''s contractualism has difficulty explaining why
  we should save a greater number of people when each person has an equal, individual
  claim to be saved. In What We Owe to Each Other, Scanlon discusses cases like: a
  person in a burning building vs. five people in another burning building, or a case
  where a rescue party can save either one person or five. Intuitively, we should
  save the five. But contractualism seems committed to focusing on individual complaints:
  the one person''s complaint against being left to die seems just as strong as each
  of the five people''s complaints. So why should the numbers matter?


  Scanlon''s answer (or one of his answers): We can appeal to a principle that would
  be reasonable to reject by the one person, but it''s also true that each of the
  five could reasonably reject a principle that would require the rescuer to save
  the one rather than the five. However, the key issue is whether the one''s complaint
  is "balanced" or "outweighed" by the complaint of the five. Scanlon denies that
  we can simply aggregate the complaints of the five into a larger sum that outweighs
  the one''s complaint. That''s the "individualist restriction": the reasons for rejecting
  a principle must be attributable to individuals, and you can''t aggregate them across
  persons in a way that produces a greater total complaint. So the question is how
  Scanlon can justify saving the greater number without aggregating complaints.


  Scanlon''s actual solution (as I recall): He argues that a principle allowing one
  to save the greater number is one that the single person could reasonably reject,
  but when faced with a choice, a principle that directs saving the greater number
  could be justified because the one person''s reason to reject is not that strong
  relative to the principle that could be reasonably rejected by those in the larger
  group. Wait — I need to be careful.


  Actually Scanlon''s approach in What We Owe to Each Other: He considers a "Principle
  of Rescue" that says we must save the greater number in such cases. He argues that
  this principle could be reasonably rejected by the one person because it doesn''t
  give sufficient weight to their claim. But he also says that a principle that required
  saving the smaller number could be reasonably rejected by each of the five. The
  resolution involves comparing the reasons for rejection. Scanlon says: the complaint
  of the one person is not outweighed by the complaints of the five in an aggregative
  way, but when we assess which principle is reasonably rejectable, we need to consider
  the reasons that individuals have to reject each candidate principle. The principle
  that saves the greater number: the one person has a reason to reject it; the five
  each have a reason to reject the alternative. The question is whether the one person''s
  reason is sufficient to make the greater-number principle rejectable. Scanlon seems
  to think it is not, because the one''s reason to reject the greater-number principle
