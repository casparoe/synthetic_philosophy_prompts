  Peirce''s "The Fixation of Belief" describes four methods: tenacity, authority,
  a priori, science. Science is distinguished by the hypothesis that there are real
  things whose characters are independent of what anyone thinks, and by the method
  of experience/public inquiry. Fallibilism: no belief is so certain that it is beyond
  revision; inquiry is self-correcting. The pragmatic maxim: consider what effects
  that might conceivably have practical bearings we conceive the object of our conception
  to have; our conception of these effects is the whole of our conception of the object.
  The maxim ties meaning to conceivable practical consequences, i.e., to habits of
  action.


