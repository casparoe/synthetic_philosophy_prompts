  "I recently listened to two friends argue about an old attempt to reconcile God''s
  compassion with the doctrine that God cannot suffer. The passage they kept coming
  back to is from Anselm of Canterbury, Proslogion, chapter 8. Here is the passage
  in the English translation they were using:


  [quote]


  The dispute went roughly as follows.


  Maya said the passage shows the problem is only apparent. Anselm is saying that
  God''s compassion is real, but not in the mode of human feeling. When Anselm writes
  that God is compassionate ''in terms of our experience'' and not ''in terms of thy
  being,'' he means the same divine beneficence is experienced by us as compassion,
  while in God it is not felt as pain. So God really saves the wretched, and that
  is what compassion is at bottom. Thus God can be compassionate without suffering;
  nothing important is lost.


  Daniel replied that Anselm''ssaving the word depends on changing the subject. If
  compassion includes being moved by another''s distress, then a God who is ''affected
  by no sympathy for wretchedness'' lacks the thing we mean by compassion, not just
  a felt component. To say God is compassionate only from our side is like saying
  a heater is compassionate because we experience warmth from it. The word has been
  drained of its interpersonal meaning.


  Maya answered that Daniel is treating the emotional tremor as the essence of compassion,
  but in many cases the most compassionate person is the one who acts effectively
  while not falling apart. The early Church called God apatheia not to say he is indifferent,
  but to deny he is acted upon involuntarily. What Anselm preserves is that the comfort
  the wretched receive comes from God''s own active goodness, not from a divine emotional
  reaction.


  Daniel said that still leaves an asymmetry. If God''s own inner life has no counterpart
  to what we call compassion, then ''God is compassionate'' is true in the same way
  ''the sunrise is sad'' might be true: because of an effect on us, not because of
  what God is. But Anselm wants to say God is compassionate ''in terms of thy being''
  — his phrase? No, he denies it. So the next move, Daniel insisted, is to admit that
  at least one central strand of compassion cannot be applied to God, which is fine
  if we revise our concept of divine love, but that is a bigger concession than Anselm
  acknowledges.


  Maya responded that Daniel is assuming God''s inner life must be a private feeling.
  But for Anselm, God''s being is identical with his act; there is no hidden affective
  state behind the act. So there is no counterpart to feel. The reason God does not
  experience compassion as an affect is that his goodness is not a reaction to need
  but its source.


  Daniel then said: but that is exactly the problem. The word ''compassion'' becomes
  so identified with bare beneficence that it no longer marks the difference between
  love as helping and love as entering into someone''s pain. If the doctrine of impassibility
  requires us to collapse that distinction, then it has cost us something real.


  They did not reach a conclusion.


