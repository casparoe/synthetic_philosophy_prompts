  Ayn Rand held that altruism (which she defined roughly as the ethical doctrine that
  man must live for others, that self-sacrifice is the highest moral duty) is evil
  and incompatible with life, reason, self-esteem. She defended "rational egoism":
  each person''s own life/happiness is the standard of value. Relevant pressure points
  from literature/debates:

  - The definitional issue: she uses "altruism" in Auguste Comte''s sense (others
  are the only proper end) rather than ordinary benevolence; many argue she attacked
  a strawman. A defender might say ordinary "kindness to others who matter to you
  for your own reasons" isn''t what Rand meant by altruism and is compatible with
  egoism; the follow-up: but then why call the book *The Virtue of Selfishness* rather
  than, say, a defense of enlightened self-interest; is the provocative language doing
  work?

  - The "is-ought"/deriving values from life: she says life is the ultimate standard,
  something''s being conducive to the organism''s life makes it good. Critics: she
  never justifies why you ought to choose life; it''s a non-moral choice or circular.
  Follow-up: if someone judges their own life not worth continuing, does the system
  have anything to say to them?

  - The emergency scenario ("lifeboat"): she says emergency ethics is not normal ethics;
  you can''t derive a code for living from rare cases. Critics press: don''t emergencies
  reveal the bedrock of values? What would she do in the lifeboat where self-interest
  conflicts with a stranger''s life?

  - The trader principle: she says love and friendship should be based on "trading
  value for value," not sacrifice. Critics: does this make love conditional and market-like;
  can we love flawed, unproductive people (children, the disabled, the old)?

  - The "sanction of the victim": evil needs the sanction of the victim; don''t sacrifice
  to evil. Critics: this lets people rationalize apathy toward the oppressed.

  - The relationship between psychological egoism and ethical egoism: Rand says man
  *should* be selfish; is she claiming everyone always acts selfishly? Objectivists
  reject psychological egoism. Press: if no one can choose to act against their perceived
  interest, then moralizing about altruism is pointless; if they can, then what''s
  the difference between the altruist''s deepest satisfactions and egoism?

  - Altruism and capitalism/economics: she claims altruism underlies collectivism
  and statism; is there a historical claim here that needs evidence.

  - Whether her view leaves room for any duty to strangers or future generations.


