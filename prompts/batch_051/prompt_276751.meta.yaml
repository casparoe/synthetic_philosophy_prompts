  Two-person bargaining problem: a pair (S,d), where S is feasible utility set, compact
  convex, d disagreement point. Nash solution maximizes (u1-d1)(u2-d2). KS solution:
  first find ideal point b_i = max {u_i : (u1,u2) in S, u_j >= d_j}. Then KS is the
  maximal point in S on the line segment from d to b. That is, each player gets d_i
  + λ(b_i - d_i), where λ is maximal such that point is in S. It satisfies Pareto
  optimality, symmetry, scale invariance (invariance to positive affine transformations),
  and individual monotonicity (if the ideal point of one player increases while the
  other''s ideal point unchanged and feasible set expands, that player''s solution
  payoff should not decrease). Nash satisfies IIA instead of individual monotonicity.


