  Against the Solved Future


  Discussions of fun theory often begin from a worry about specification: if an optimizer
  targets pleasure, or preference satisfaction, or reward, it may produce a future
  that satisfies the proxy while missing whatever actually makes a life good to live
  in. I think this framing already concedes too much. It treats the future as a product
  delivered to its inhabitants and treats the problem as one of writing down the right
  consumer preference. But for a large class of the lives we would actually want,
  the value does not reside in the delivered state; it resides in the relationship
  between an agent and an obstacle course. What matters is that the outcome is not
  yet settled, that the difficulty is genuine, that the constraints are ones the agent
  can own, and that the striving changes the agent in ways not fully predictable in
  advance.


