  Williams''s integrity objection, summarized: Utilitarianism demands that the agent
  regard his own projects and commitments as merely one set of satisfactions among
  others, to be sacrificed whenever the impartial sum favors it. This alienates him
  from his projects, undermines the conditions of a meaningful life, and threatens
  his integrity—the idea that some projects are his and identify him. "One thought
  too many": in the case of the rescuer choosing between his wife and a stranger,
  the thought "it''s my wife" seems enough; a justification that requires he think
  "and after all, it''s permissible to prefer my wife because in general it maximizes
  welfare for people to look after their spouses" is one thought too many. Williams''s
  point: the impartial justification is unnecessary and even objectionable; it misrepresents
  the place of that commitment.


  Beliefs set:

  A. The wife/stranger example shows that a certain kind of impartial deliberation
  is inappropriate, but it does not by itself refute act utilitarianism—at most it
  refutes a requirement to deliberate act-utilitarianly on every occasion.

  B. The deeper force of Williams''s objection is about the conditions under which
  a person can have "projects" that ground his reasons for going on at all; utilitarianism
  demands that all such projects be treated as disposable, which alienates him from
  them and threatens integrity.

  C. But indirect utilitarianism (motive/consequentialism distinction) is not a sufficient
  reply: a consequentialist who recommends having partial motives only as useful devices
  has not restored integrity, because the agent still has to regard those motives
  as instruments.

  D. This is why the objection survives the move to "sophisticated" consequentialism.

  E. In the Jim case, an agent who shoots one to save the others acts wrongly (it
  violates a constraint against killing), but the act is excused and the agent is
