  even just people passing cards around under simple rules. It should get them to
  the point where they can see why two runs with nearly identical setups diverge,
  why no individual run is foreseeable in detail even though the underlying rule is
  fully deterministic, and why that kind of unpredictability might still be statistically
  regular. They shouldn''t confuse this with true randomness. Materials, step-by-step
