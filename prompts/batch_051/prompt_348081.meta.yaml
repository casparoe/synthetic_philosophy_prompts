  My staff are two lawyers and a historian; none of us is a philosopher, and our minister
  will sign an apology only if the file has been run through a written decision procedure
  that we can defend afterwards. We have about three weeks per file.


  Please write me a reusable decision procedure for screening and deciding these petitions.
  It should be a sequence of questions with pass/fail gates, in order, with enough
  precision that two analysts working the same file would ask the same questions and
  mostly land in the same gate. For each gate, specify what counts as a sufficient
  answer, what kind of evidence would satisfy it, and whether failure means a flat
  "no" or a route to a weaker form of response (a statement of regret, a commemoration,
  a memorial, educational material) rather than a full apology.


  The procedure should be grounded in the actual structure of the problem: when is
  a present government the right entity to apologize for an earlier government''s
  acts; whether collective agents persist across regime changes; whether contrition
  is coherent when no individual decision-maker is alive or culpable; what an apology
  must do beyond expressing sorrow; whether apology without reparations is ever more
  than cheap speech; and whether a body can apologize to people who no longer exist
  while claiming to act on their behalf. Tell me which of these distinctions survive
  in the procedure, which you are deliberately dropping, and why.


  Run the procedure on three cases:


  1. A nineteenth-century colonial administration removed an Indigenous people from
  its territory under laws that the present state inherited and only repealed in the
  1950s. Petitioners demand an apology and the return of specific lands now publicly
  owned.

  2. A religious minority was subjected to legal discrimination for a century; the
