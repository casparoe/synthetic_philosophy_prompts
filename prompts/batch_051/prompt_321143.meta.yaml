  isomorphic neural substrate over several years, each small patch replaced after
  it is carefully scanned and simulated, with the person awake and conversing throughout;
  every replacement is calibrated to preserve local input-output dispositions, and
  the rest of the brain slowly reorganizes around it, as it would around any slowly
  growing lesion or learned change. I have compiled five candidate markers that might
  be doing the work when we say the original survives, or does not survive, this kind
  of procedure:


  1. Causal continuity of a self-maintaining process (no point at which the whole
  system is shut down or rebuilt from scratch).

  2. Preservation of the fine-grained global dynamical state (attractor geometry,
  phase relations, noise sensitivities).

  3. Developmental lineage of the new parts (each synthetic unit is installed as a
  repair of, and remains causally downstream from, the biological unit it replaces).

  4. Robust counterfactual dependence (the later states would have been relevantly
  different if earlier states had been different).

  5. Phenomenal seamlessness (from the subject''s point of view there is no rupture,
  only memory and ongoing experience).


  I would like you to rank these according to how likely each is to be the true carrier
  of identity through gradual replacement, not how easy it is to verify. Treat them
  as rival philosophical posits, not as clinical criteria. Within each tier, say in
  one or two sentences what the candidate gets right and where it collapses under
  pressure. Provide a brief brainstorm before committing. Then explicitly assign each
  to top/middle/bottom tier."


