  "I spent my career in cell biology and control theory, and I have only recently
  begun reading academic philosophy. The problem I keep circling is gradual replacement
  in the context of mind uploading. The usual thought experiments are too polarized:
  one-step destructive scan or ordinary biological change. I am interested in the
