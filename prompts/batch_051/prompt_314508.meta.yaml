  The symbol grounding problem, stated in contemporary terms, is the problem of how
  symbols in a computational system acquire meaning rather than merely standing in
  syntactic or statistical relations to other symbols. The classical worry is that
  a system can manipulate symbols impeccably while the symbols remain empty unless
  they are anchored in something outside the symbol system—perception, action, reference,
  or affect. The current version of this worry targets large language models: trained
  only on text, they may produce fluent, true, and useful sentences while the tokens
  in those sentences (on the skeptical view) mean nothing, because the model has never
  seen, acted on, or referred to the world. The opposing view is that no such extra-symbolic
  anchor is needed, or that rich distributional structure over a sufficiently large
  corpus is already a kind of grounding.


  Nāgārjuna, as I understand him, holds that all phenomena are empty of intrinsic
  nature (svabhāva) and exist only through dependent arising. His tetralemma (catuṣkoṭi)
  examines a candidate claim through four alternatives—affirmation, negation, both,
  and neither—and often rejects all four as ways of fixing how an independently existing
  thing is. I include this gloss so the question is self-contained; correct me if
  it is misleading.


