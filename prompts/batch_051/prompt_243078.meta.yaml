  I have been working as a writing tutor, and I keep tripping over the same argument
  with a colleague. She says our job is to teach students to avoid bad grammar, full
  stop. I used to accept that until a student asked me why we correct some things
  but not others. I ended up with three criteria for what I mean by bad grammar: a
  construction is bad grammar if (a) it would not occur in the unscripted speech of
  any native dialect, so it cannot be defended as a dialect difference; (b) it genuinely
  reduces clarity or processing ease for the intended reader; and (c) it is not established
  in the standard written register, however much it appears in speech. But then I
  tested these on something that actually came up: a bright student wrote "between
  him and I" in an essay. My colleague would correct it without thinking. Yet the
  phrase is common enough in the speech of educated speakers that it may be a prestige
  construction; it does not reduce clarity—anyone knows what it means; and it is generally
  condemned in style manuals. Does "between him and I" count as bad grammar under
  my three criteria? Work through each criterion. Where my criteria under-determine
  the answer, say whether the problem is in the criteria, in my sense of "bad grammar,"
  or in the idea that such hypercorrections are just errors. And if this case forces
  a revision, what should the revised criteria be?


