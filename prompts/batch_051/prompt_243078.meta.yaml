  I''ve been tutoring first-year writing this term, and a disagreement with the course
  director has forced me to think more carefully about what we mean when we say something
  is bad grammar. She wants me to mark constructions as errors whenever a good style
  manual would, but I have started to suspect that the manuals are doing several different
  jobs at once. So I made myself three criteria. A construction counts as bad grammar
  if (1) it would not appear in the unplanned speech of any native dialect, so it
  is not a legitimate regional or social variety; (2) it actually gets in the way
  of understanding, not merely fails to match a school rule; and (3) it is not established
  in edited standard prose, whatever happens in ordinary speech. These criteria felt
  clear until I met the phrase "between him and I" in a student essay. My colleague
  would correct it reflexively. But the construction is used in speech by many educated
  native speakers, often when they are trying to sound careful; it does not impede
  comprehension in the least; and it is nonetheless rejected by most style manuals
  as a hypercorrection. Does "between him and I" count as bad grammar under my criteria?
  Go through each criterion and say where the phrase falls. Where the criteria leave
  the answer underdetermined, tell me whether that means the criteria need changing,
  or whether my idea of bad grammar was doing something else all along—register, not
  grammar. If the case forces a revision, state the revised criteria and test them
  once more on this example.


