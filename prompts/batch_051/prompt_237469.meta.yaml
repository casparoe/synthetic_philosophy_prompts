  / Gigerenzer). The asker might not want names though. It''s fine to mention without
  citations.


  Now draft for algorithmic randomness quiz:


  ---


  A friend of mine runs a small stats-and-philosophy seminar and after last week''s
  argument about whether a shuffled playlist is ''really random'' she asked me to
  put together a sorting quiz. I said yes, and now I actually need to produce it.


  The question the quiz should sort people on is: can a finite sequence be random?
  The point is to sort readers by what they say about concrete sequences, not by which
  label they like. So no question may ask ''do you think randomness is really unpredictability?''
  directly.


  The quiz must be eight questions. Each question should present a concrete case —
  I care about these in particular:

  - a 0/1 string that is just 0101010101 repeated twenty times

  - the first, say, forty digits of pi after the decimal point (3.14159...)

  - a person who shuffles a deck and gets the exact ordering a brand-new deck comes
  in

  - twenty flips of a coin that came up heads every time

  - a series of lottery numbers that are 1 2 3 4 5 6

  - a string that is incompressible in the Kolmogorov sense but was produced by a
  heavily biased but known setup


  For each, give us two or three options phrased in plain words, and a scoring key
  mapping answer patterns onto positions. Build the tree from the logical space, not
  from a list of names: first the questions and combinations of answers they allow,
  then the positions located in that space. But the following positions must show
  up as leaves: (a) randomness as a property of the generating process/chance setup,
  not the sequence; (b) randomness as algorithmic incompressibility; (c) randomness
  as a statistical property relative to a null model or test-suite; (d) subjective/epistemic
  randomness, where randomness lives in the information of the observer; (e) the view
  that no finite sequence is random. Tell me which combinations of answers have no
  occupant and say briefly whether it''s because the position is incoherent, unattractive,
  or just unexplored. Also flag any pair of leaves the tree can''t fully separate
  and say what exactly the leftover disagreement is.


  Sections by name and order:

  - Introduction (100 words)

  - Diagnostic questions and options (500)

  - Scoring key (200)

  - The positions as leaves (300)

  - Empty cells in the tree (150)

  - Pairs the tree can''t separate (150)


  British English please.


