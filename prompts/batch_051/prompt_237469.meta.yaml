  Draft for satisficing memo:


  ---


  I''ve ended up on a hiring committee in my department for the first time, and we''re
  about to open a search for a lecturer. Last time we spent three full meetings reading
  over two hundred applications and the panel nearly mutinied. I''ve just read some
  stuff on satisficing and bounded rationality and I keep thinking the committee itself
  is the clearest example of the problem. I want to circulate a memo before Thursday''s
  committee meeting proposing a shortlisting rule: we fix an explicit threshold for
  what we want before we open files (''as soon as you''ve found eight candidates who
  clear the bar, stop reading''), rather than reading every single file to make sure
  we''ve found the single best applicant.


  Draft the memo for me. Please make it a document we could actually vote on: lead
  with a recommendation, then the reasoning. I want an honest treatment of the strongest
  consideration on the losing side, which I take to be something like: any stopping
  rule creates a risk a better applicant stays in the unread pile, and a rule that
  says ''stop once you''ve found N'' means candidates are evaluated against a bar
  set by committee members who happen to read early files. But I''m open to being
  dissuaded.


  Sections by name and order, roughly:

  - Recommendation (150 words)

  - How the rule would work (150)

  - The case for the rule (300)

  - The case against (300)

  - My verdict, with conditions or a time limit (250)


  Also write in British English. And one more thing: I keep wondering whether the
  secretary problem''s 37% rule is a better or worse way to frame this. If you think
  it should not be used as a justification, say why in a sentence or two.


