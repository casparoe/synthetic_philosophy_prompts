  Which one would make the best dataset item? I want strong diagnostic depth. Let
  me weigh:


  - The quiz type on algorithmic randomness is excellent for a dataset of classification
  instruments. The logical space is rich: the question "can a finite sequence be random?"
  has multiple positions: (1) randomness belongs to generating processes/mechanisms,
  not to sequence outcomes; (2) randomness is a computational property (no shorter
  description) — algorithmic complexity; (3) randomness is a statistical property
  relative to a model/test-suite; (4) randomness is epistemic/subjective (absence
  of information); (5) no finite sequence can be random; (6) even a sequence like
  000000000 can be random if produced by a fair coin. The decision tree branches:
  "Is randomness a property of the sequence itself or of its source?", "If a fair
  coin throws 20 heads in a row, is that outcome random?", "Is the digits-of-π sequence
  random?", "Can a short string be random?", "Does the same sequence be random relative
  to one description and non-random relative to another?" Leaves with names: "objective
  chance process view", "place selection/kolmogorov", "sophisticated frequentism/von
  Mises collectives" (maybe too niche?), "subjectivist", "eliminativist/noneism".
  Unoccupied combos: no one thinks a purely computational property attaches to a single
  string without reference to a choice of universal machine (the invariance theorem
  up to constant; should note it). This is genuinely in the weeds.


  The asker can specify angle: a quiz for a seminar handout, sort by cases, 8 questions,
