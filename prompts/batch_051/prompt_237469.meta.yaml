  - Request British English.


  Constraints on content:

  - In the weeds, not regurgitated

  - Meaningful for a model without web access: no bibliographies, citations, no niche
  facts that small LLMs won''t know

  - Can inject new/niche ideas into the prompt

  - Never quote from memory; if using verbatim quotes, must fetch. Otherwise paraphrase.
  I likely won''t need to search at all.


  Let me think about which domain/type combination would produce the best prompt.


  The memo type is nice: institutional body, concrete case, actionable recommendation,
  honest treatment of losing side. Domain options that fit a concrete decision:

  - Satisficing and bounded rationality: could be a decision about whether a hiring
  committee should adopt a satisficing rule rather than exhaustive search. This is
  personally relevant to someone on a committee. Good, accessible, not overdone.

  - Algorithmic randomness: could be a funding committee asked to fund a project that
  claims to detect "true randomness" or a decision about whether a courts/audit committee
  should use a particular random sequence generator. Hmm.

  - Western values: a board deciding whether to adopt or rename a "Western values"
  component in a curriculum.

  - Nations rich: funding committee deciding about a development economics project.


  The sorting quiz/taxonomy type:

  - Satisficing: a decision tree or quiz sorting someone into satisficer vs maximizer
  vs bounded rationality position. Could work but might be too familiar (Schwartz''s
  maximizer scale is well-known). Could do a taxonomy of positions on when satisficing
  is rational.

  - Algorithmic randomness: decision tree taking people from intuitions about random
  sequences to positions on what randomness is (frequentist, algorithmic/Kolmogorov,
  subjective, best-system?). This is rich and in the weeds but the concepts are accessible.
  A quiz "which theory of randomness do you actually hold?" with concrete sequences.
  Good.

  - Nāgārjuna: decision tree on tetralemma positions — but niche names could be hard
  for small LLMs; still the concepts are memorable. Could be risky on names.

  - Western values: taxonomy of meanings of "Western values" — could be good and in
  the weeds.

  - Nations rich: decision tree separating institutions/geography/culture.


  Role-play type:

  - Satisficing: play a committed proponent of, say, bounded rationality/satisficing
  arguing against an optimizer/expected-utility maximizer. Or play a maximizer defending
  themselves.

  - Algorithmic randomness: play a Kolmogorov-complexity proponent who thinks a specific
  finite sequence is not random? Or a frequentist who denies finite sequences can
  be random.

  - Nāgārjuna: play a Mādhyamika who only asks questions? Could be interesting but
  niche names.

  - Western values: play someone defending the coherence or defending a particular
  use of "Western values."

  - Nations rich: play an advocate of the geography view against an institutionalist.


  The role-play requires the asker''s opening move. That''s fun but I should craft
  a good in-character setup.


  Now consider the "personally relevant" angle. The prompt should be written from
  someone''s perspective where the topic recently became personally relevant. For
  memo type: someone sits on a body. For quiz type: someone teaching a class or writing
  a handout. For role-play: someone practicing for a debate/argument.


  I think the strongest combination is probably:


  Option A: Algorithmic randomness + decision tree/taxonomy type. A philosophy of
  probability or computer science seminar handout: decision tree from intuitions about
  whether specific finite sequences (101010..., the digits of π, etc.) are random
  to a named position, with leaves like "finite sequences are only random as types/sequences
  generated by a process," "Kolmogorov complexity," "statistical view — randomness
  is a property of sequences under a null model," "subjectivist — randomness is in
  the observer''s information," etc. The asker could specify that the quiz must sort
  by what people say about cases, not labels; include certain cases (the digits of
