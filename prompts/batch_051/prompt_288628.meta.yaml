  claims to be translated, so nothing gets silently dropped."


  Let me write:


  "I am a philosopher of physics and a competent hobbyist programmer, so I think fluently
  in the distinction between value semantics and reference semantics, object identity
  versus structural equality, keys and multisets, and how a collection distinguishes
  two elements. I want you to translate a philosophical debate into that programming
  vocabulary, with a residue report.


  The source debate concerns the identity and indiscernibility of quantum particles.
  Its main elements: Leibniz''s principle that no two distinct things can share all
  properties; the apparent fact that two electrons in an atom share every intrinsic
  property and yet are two; the permutation symmetry that says swapping two particles
  of the same kind yields no new physical state; the contrast between fermions (excluded
  from the same one-particle state) and bosons (which ''bunch'' rather than exclude);
  the haecceitist view that particles have a primitive thisness over and above their
  properties; the bundle/structuralist view that there is nothing more to a particle
  than its place in a web of relations, so ''identity'' should be analyzed in terms
  of discernibility; and the fallback position that particles are at least weakly
  discernible by relations such as ''is in a different state from.''


  The target vocabulary: references versus values, object identity versus structural
  equality, how many ''objects'' a collection contains when two references point to
  equal-but-distinct values versus to the same value, multisets, keys, and what it
