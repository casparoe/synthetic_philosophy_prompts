  I convene a small reading group on historical explanation, and a month ago one of
  its members — a retired geophysicist who now writes counterfactual novels — sent
  round a numbered argument which I have been turning over ever since, because it
  seems to show that the very idea of historical contingency cannot be stated. We
  had been discussing the old proverb about the missing nail that loses the shoe,
  the horse, the rider, the message, the battle, and finally the kingdom, together
  with the usual gloss that one tiny antecedent can be the difference-maker for an
  enormous historical outcome. His argument runs as follows.


  (1) A battle is the sort of tightly coupled system in which small local differences
  are amplified into large downstream differences, so that the actual course of events
  is one member of a vast space of nearby courses.

  (2) In any such system, the difference between the actual course and any alternative
  is never a single difference; it is an entire bundle of mutually aggravating small
  differences, which means that singling out the nail as the cause is always a convenience
  that ignores indefinitely many other small factors no less necessary to the outcome.

  (3) To be warranted in saying that the nail was the difference-maker — that, had
  it held, the battle and the kingdom would have been otherwise — one would need to
  know what would have happened with the nail varied while everything else relevant
  stayed as it actually was.

  (4) But in a tightly coupled system that is exactly what one can never know, because
  the other relevant small factors would also have differed, and almost all of them
  went unrecorded.

  (5) Since the unrecorded factors are unavailable by definition, no one is ever warranted
  in asserting a historical counterfactual of the small-cause kind.

  (6) Yet the lesson normally drawn from the proverb is itself a historical counterfactual
  of precisely that kind: had the nail held, history would have been importantly different.

  (7) Therefore the lesson of the proverb — and with it every claim about the fragility
  of a historical outcome — is unwarranted; the more seriously one takes the story
  as evidence of how sensitive history is to tiny causes, the less one is entitled
  to draw any particular lesson from it.

  (8) But this is absurd: historians and laypeople alike clearly discriminate between
  better- and worse-supported claims about what would have happened, and the proverb
  is supposed to be a paradigm of the better kind.


