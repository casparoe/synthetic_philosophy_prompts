  that we can say, confidently, that had the nail held, the outcome would have been
  different.


  Now take that picture seriously in a chaotic world.


  (1) A battle is a system in the mathematician''s sense: a large number of tightly
  coupled parts, in which differences at one point are amplified into very different
  sequences downstream.


  (2) In such systems, the difference between the actual sequence and any alternative
  one is, practically always, not a single difference but a vast bundle of small differences
  that compound. So singling out the nail as ''the'' cause always means ignoring indefinitely
  many other small differences that were no less necessary for the actual outcome.


