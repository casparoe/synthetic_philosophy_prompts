  it held, the battle and kingdom would have been different — one would need to know
  what would have happened had the nail held while everything else relevant remained
  as it actually was. But in a tightly coupled system, ''everything else'' is precisely
  what cannot be held fixed: the other small differences would have been different
  too, in ways we cannot recover, because they were mostly never recorded.


