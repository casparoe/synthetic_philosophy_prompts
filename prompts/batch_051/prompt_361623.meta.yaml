  You are a moral philosopher specialising in the structure of value and aggregation.
  Think carefully before committing to a position, and begin by brainstorming candidate
  principles even if you ultimately reject most of them. Please write in British English.


  Consider the following asymmetry in ordinary judgement. At low intensities, people
  treat pain and pleasure as largely commensurable: they accept a tedious afternoon
  of chores in exchange for an enjoyable evening, or a moment of discomfort for a
  small pleasure, and they think of such choices as a matter of how much of the one
  must be offered to offset the other. But when the pain becomes sufficiently intense—a
  kidney stone, a cluster headache, a severe burn—the same people seem to switch to
  a different scale. They judge that no amount of mild, pleasant experience could
  possibly make it worthwhile to undergo the pain, whether the choice is made for
  oneself or by someone who must decide for another. The pattern is sometimes described
  as a lexical threshold: below a threshold of intensity, pains and pleasures trade
  off roughly continuously; above it, no quantity of moderate positive goods counts
  against even a brief episode of the severe bad.


  Is there a defensible principle that generates both halves of this pattern, or is
  the pattern simply an inconsistency we live with? Your task is to find the strongest
  principle you can, test it honestly against nearby cases, and deliver a verdict
  on whether the asymmetry should be kept, revised, or abandoned.


  Please structure your answer under the following headings and approximate lengths:


  1. The asymmetry stated (about 250 words). Restate the asymmetry precisely and strip
  away confounds. In particular, distinguish the claim at issue from a general deontological
  prohibition on harming or on using a person as a means; focus the question on the
  way pain and pleasure are compared, including within a single person''s life. Say
  exactly what must be justified.


  2. Strongest candidate justifications (about 600 words). Set out the two or three
  most promising principles that could underwrite the asymmetry, making each as plausible
  as you can. Consider at least: (a) a discontinuity in the structure or phenomenology
  of severe pain, (b) a lexical ordering in value itself, and (c) a break in the conditions
  under which a person can meaningfully endorse or consent to a trade-off. For each,
  explain how it would yield the asymmetry rather than merely redescribe it.


  3. Stress tests (about 500 words). Test the candidate principles against at least
  five nearby cases, including: a severe pain of vanishingly short duration; moderately
  intense chronic pain that is never extreme at any moment; an intense, ecstatic pleasure
  rather than a mild one; a small risk of severe pain weighed against a certain moderate
  pleasure; and trade-offs in which mild pains are aggregated across many people rather
  than felt by one. State which principle fares best and where it strains against
  confident judgement.


  4. Verdict (about 350 words). Say which principle, if any, survives the stress tests,
  whether the asymmetry should be kept, revised, or given up, and what your conclusion
  does and does not extend to. Be explicit about what remains empirically unsettled
  and what is a conceptual or normative commitment rather than a discovery about the
  world.


  Do not supply a bibliography or reading list; answer from within the concepts themselves.


