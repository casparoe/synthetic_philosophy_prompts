  Let me think about the Persson & Savulescu position to ground it accurately without
  quoting.


  Persson & Savulescu, in "Unfit for the Future: The Need for Moral Enhancement" (2012),
  argue: human moral psychology is adapted to small-scale, face-to-face life, while
  our technological power is now global; this mismatch creates a high probability
  of catastrophic harm (e.g., weapons of mass destruction, environmental destruction).
  Liberal democracies can''t safely rely on traditional moral education or political
  institutions alone. We need moral bioenhancement — biomedical means to enhance moral
  motivation and dispositions like altruism, empathy, sense of justice — as a complement
  or urgent supplement. They think it should be pursued urgently, perhaps even made
  mandatory/universal (though they waver), and that cognitive enhancement without
  moral enhancement is dangerous. Counterarguments focus on autonomy, freedom, moral
  diversity, who decides which morality, the "means-end" problem and the risk of making
  people more compliant rather than more moral, and the empirical weakness of current
  interventions.


  A procedure for an IRB reviewing proposals. But a small point: IRBs evaluate safety,
  consent, risk-benefit, not usually substantive urgency from a philosophical theory.
  The prompt could say the PhD student is helping their ethics committee develop an
  internal screening tool specifically for protocols that claim to enhance moral capacities,
  because the committee keeps getting such proposals and the federal regulations don''t
  directly address them. The theory provides the why and the "go/no go" logic.


  I need to embed enough of the theory in the prompt so the model knows what to operationalize,
  but not overdo it. The prompt should state the asker''s understanding: P&S argue
  cognitive enhancement is racing ahead of moral capacities; moral enhancement isn''t
  just permissible but urgent; interventions should target the underlying moral dispositions
  (altruism, empathy, sense of fairness) rather than just suppressing behavior; traditional
  means (education, policy) are too slow/unreliable.


  Then the procedure: questions in order — e.g.,

  1. Does the protocol actually aim at a moral disposition or capacity central to
  P&S''s list (altruism/empathy/sense of fairness), as opposed to mere behavioral
  compliance, mood, or cognitive performance? If no → reject as not moral enhancement
  (or refer for reclassification).

  2. Does it produce a lasting change in the disposition, or only transient symptom
  suppression? If merely transient and narrow, does it plausibly contribute to the
  kind of broad moral motivation the theory demands? If no → reject.

  3. Is there evidence that the enhancement is "morally neutral" between rival moralities,
  or does it risk installing a particular contested moral view? If it biases one comprehensive
  view → hand to full committee as a value question.

  4. Does it respect/avoid the "means-end" problem: are the means compatible with
  the end (e.g., using coercion/deception to increase empathy undermines autonomy
  in a way that matters)?

  5. Would approving it make the "cognitive-without-moral" gap worse, e.g., is it
  actually a cognitive/mood enhancer relabeled? Reject if it''s really cognitive enhancement
  that increases capacity to act without moral motivation.

  6. Does the risk-benefit calculus reflect urgency? P&S would say the stakes of moral
  failure are catastrophic, so some arm of the committee should be permitted to tolerate
  risks it wouldn''t for mere convenience enhancements; but this doesn''t override
  basic safety — set stopping conditions.

  7. Where does it hand off to the full committee? Any "which morality" question;
  mandatory/covert administration to others; pediatric or non-consenting populations;
  existential risk claims too speculative to verify.


