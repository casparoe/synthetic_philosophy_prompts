  Accuracy-first epistemology (Pettigrew, Joyce, Leitgeb) holds that epistemic norms
  can be justified by showing they promote accuracy (closeness to truth). Credences
  are graded; accuracy measured by scoring rules. An important result: if you use
  the Brier score, the expected accuracy of a credence in a proposition equals something;
  the norm of probabilism follows from dominance + propriety. But norms like the Principal
  Principle or Conditionalization require additional assumptions. The choice of scoring
  rule matters for some proposed norms — e.g., there are cases where two credence
  functions are both probabilities and neither dominates, but they differ in expected
  accuracy under different proper scoring rules. Also the debate about whether there''s
  a privileged scoring rule ("alethic accuracy" arguments can''t pin down a unique
  scoring rule; some argue strict propriety plus other axioms (truth-directedness,
  separability, etc.) justify Brier uniquely (Joyce? Or "the quadratic scoring rule"
  uniqueness under certain axioms by some authors like Selten? Actually there''s a
  theorem: the Brier score is the only additive, strictly proper, truth-directed,
  continuous scoring rule? Hmm. I should be careful.


  Known facts:

  - A scoring rule is proper if expected score is maximized by reporting one''s true
  credence. Strictly proper if uniquely.

  - Brier/quadratic score: (1 - p)^2? Various forms. Log score: ln(p) for true proposition.

  - Both are strictly proper.

  - Accuracy-first epistemology uses dominance arguments to justify Probabilism (Joyce
  1998, "A Nonpragmatic Vindication of Probabilism"), later generalized by Predd et
  al. (2009) using any strictly proper scoring rule.

  - Pettigrew''s "Accuracy and the Laws of Credence" (2016 book) argues for various
  norms. He uses Brier score specifically with axioms to argue for the Indifference
