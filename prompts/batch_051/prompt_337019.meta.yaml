  The asymmetry: Consider two pieces of news about humanity''s temporal extent, both
  consistent with your own life going exactly as well as it otherwise would:

  (1) You learn that, one day after your death, all human life will permanently and
  painlessly die out (a sterilizing agent? "painlessly extinguish itself"); no one
  suffers, but thereafter there will be no human beings, no human projects, no one
  to remember or carry on anything human.

  (2) You learn that human life began much later than you thought: in fact, for an
  extra two hundred thousand years before the first humans, nothing human existed
  (or: the universe spent billions of years without humanity — which you already knew
  — but now you learn that a long stretch of time before your birth that you believed
  contained thriving human generations actually contained none). Both are cases where
  humanity''s history is shorter than it might have been; in both, no actually existing
  person dies or is harmed; in both, the world contains less human life and fewer
  human projects than the alternative.


  Yet ordinary reactions are starkly asymmetric: the first is experienced as a catastrophe;
  the second is not experienced as a loss at all — we don''t grieve the missing ancestral
  generations, and we don''t regard the late arrival of Homo sapiens as itself a tragedy.
  Is this asymmetry defensible?


