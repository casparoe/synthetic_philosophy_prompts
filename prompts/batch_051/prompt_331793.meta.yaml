  Main philosophical positions:

  - Traditional paradox: intentional self-deception seems impossible because to deceive
  yourself intentionally you must know the truth and get yourself to believe contrary,
  but if you know the truth, you don''t believe the contrary. So self-deception requires
  contradictory mental states.

  - Deflationists (Mele): self-deception is just motivated false belief via biased
  treatment of evidence; no intention to deceive required, so no paradox.

  - Intentionalists / Sartreans: self-deception ("bad faith") is real and is a kind
  of project; contradiction is not between two beliefs but between reflective awareness
  and what one avows.

  - Tension: If deflationism is right, is self-deception actually a distinct phenomenon,
  or just wishful thinking/confirmation bias?

  - Another twist: Some argue that helping self-deception requires partitioning the
  mind (Davidson''s divided mind, quasi-independent structures).

  - Party epistemics: "other-deception" analogies — deceiving your future self (you
  take a pill now to forget, planning to lie to your future self) is possible; is
  self-deception of simultaneous self analogous?


  A disagreement between two people could be about whether the deflationary account
  captures what''s really going on, or whether self-deception requires taking something
  to be true at some level.


