  Let me design a hard argument:


  Claim: The Golden Rule, in both its familiar forms, is either vacuous or false.


  (1) Take the positive form: treat others as you would have them treat you.

  (2) Interpreted literally, "as you would have them treat you" reports your actual
  desires, whatever they are.

  (3) Your actual desires need not track what others are owed: someone may want to
  be lied to, flattered, or dominated.

  (4) So the rule would sometimes require treating people in ways we know are wrong,
  and it fails to forbid those treatments.

  (5) Defenders then switch to the negative form: don''t treat others as you would
  not have them treat you.

  (6) But the negative form is only a constraint, not a guide: it forbids acts you''d
  reject for yourself but says nothing about what positively to do.

  (7) Worse, under the literal reading the negative form inherits the same problem,
  since a person who doesn''t mind being deceived has, by the rule, no reason not
  to deceive.

  (8) The only way to save either form is to idealize the agent''s preferences (what
  you''d want if you were fully informed, or rational, or in the other''s exact shoes).

  (9) But once idealization is introduced, the rule is no longer doing the work: the
  content comes from the idealization procedure, not from the golden rule itself.

  (10) So the Golden Rule either dictates the wrong things or says nothing beyond
  whatever idealizing theory we silently inserted.


