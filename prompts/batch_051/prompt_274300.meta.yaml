  Let me develop Candidate D in detail.


  Asymmetry statement: We are untroubled by inferences of the form:

  - I know that a ball was drawn at random from an urn containing either 10 or 1000
  balls, and the ball is numbered 7. This is evidence (via Bayes) that the urn had
  10, or if drawn without replacement? Actually if all labels 1..N equally likely,
  seeing 7 rules out N<7, and likelihoods 1/10 vs 1/1000, so strongly favors N=10.
  We accept this as ordinary reasoning.

  - But convert to "I discover that I am roughly the 60 billionth human born. If humanity
  will end at 100 billion total, my rank is at the 60th percentile; if it will last
  to 10 trillion, my rank is at 0.6th percentile and I am remarkably early. So by
  the same likelihood reasoning, lower total numbers are favored." Many people who
  accept the urn inference say this doomsday-style reasoning cannot be correct or
  is just a trick, because you were guaranteed to observe some rank and can say nothing.
  Yet in the urn case too you were guaranteed to observe some number, but the number
  you actually observe is still informative.

  - Likewise, self-indication: if a theory says there will be vastly more observers,
  your existence is more likely under that theory (if you are randomly sampled among
  actual observers). This licenses "presumptuous" conclusions about the universe based
  merely on the fact that you exist. Almost everyone rejects that, though it follows
  from the same sampling assumption used in ordinary survey inference.


  The asymmetry: we accept observer-independent random sampling as evidence about
  multiplexed hypotheses, but we resist treating our own existence and indexical properties
  as random draws from the set of actual observers. Ask whether there is any principled
  distinction, or whether consistency forces us to accept either both or neither;
  and which of the two (doomsday, presumptuous) is more defensible.


