  I want a thought experiment built to order. Specifications:

  1. Ordinary-life scenario — no drugs, hypnosis, brain lesions, malfunctioning instruments,
  or Cartesian demons.

  2. The agent finishes some first-order reasoning and comes to believe P. Her first-order
  reasoning is, in fact, reliable and her evidence in fact supports P.

  3. She then receives genuine higher-order evidence that her first-order reasoning
  on this occasion was unreliable. The higher-order evidence must come from a base
  rate or track record rather than from someone simply telling her she erred...

  4. The higher-order evidence is ultimately misleading: it points away from P even
  though P is true and supported by her first-order evidence.

  5. Most important: it must also be the case that the rational response to receiving
  this higher-order evidence is not to moderate her first-order belief in the direction
  it indicates, because the higher-order evidence and her first-order evidence share
  a common source such that the higher-order evidence does not retain its normal evidential
  force once the first-order reasoning is already on the table...

  Then check: state P, the first-order reasoning, the higher-order evidence, why it
  is misleading, what the strict anti-akrasia principle would instruct, and what rationality
  in fact instructs, locating the structural feature that makes them diverge. Then
  tell me what a defender of the strict view would say to stop the case from counting,
  and whether removing that structural feature would collapse it."


