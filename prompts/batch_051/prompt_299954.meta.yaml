  Augustinian-Anselmian view of the fall of the angels. Her line is: angels are created
  good, with no bodies, no passions, no inherited corruption, and yet one of them
  falls. Since the first angelic sin can''t be explained by anything prior in the
  angel''s nature, by temptation, or by God (that would make God the author of evil),
  she says it is a self-originating, reasonless disordering of a created will — she
  insists this is not a cop-out because a first sin by definition can''t have a prior
  explanatory ground, and asking for one is a category mistake. Draft me eight to
  ten interview questions that push on the joints of this view instead of letting
  her re-explain it. I want the sequence to escalate. Specifically:


  - open by forcing her to distinguish a reasonless self-originating act of will from
