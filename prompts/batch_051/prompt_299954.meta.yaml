  Satan''s fall deep dive:

  - Core problem: If angels were created good (indeed, perfectly good in their nature,
  with clear intellectual vision, no inherited sin, no bodily passions), how could
  any choose to sin? For humans, original sin and passions can explain; angels lack
  these. So a first sin in a good rational creature seems to require an antecedent
  defect (which would make God the author of the defect, or regress).

  - Positions: (a) privatio boni / Augustine: evil has no efficient cause, it''s a
  defective movement of the will, a turning away from God due to pride; but Augustine
  also struggles with how a good will first defects — he says the will itself is the
  cause, but if the will is good, how? He speaks of a "deficient cause." Some argue
  this is incoherent or amounts to an ungrounded / brute act. (b) Anselm: in De casu
  diaboli, argues the angel willed happiness as the good angels do, but willed it
  inordinately, wanting to keep it by its own power; he discusses whether the first
  evil will could be caused by God or the will, treats the will as self-determining,
  and says the devil abandoned justice for happiness — but puzzles over how the will
  could first abandon justice without already lacking it. (c) Aquinas: angelic sin
  was pride — seeking beatitude through its own natural power rather than grace; angels
  have non-discursive intellect, so their choice is irrevocable; the first angelic
  sin couldn''t be from a prior habit; the cause is the free will. (d) Contemporary:
  perhaps the first sin is a brute fact of libertarian freedom — a "contrastive explanation"
  only in terms of agent causation, not a reason-explanation; but this may make the
  fall unintelligible or arbitrary, undermining the idea that the punishment is just
  (can you be culpable for an arbitrary, reasonless choice?). (e) Others: the possibility
  of "inadvertent" or "akratic" sin requires the will to be conflicted, but angels
  have no passions so no conflict; so perhaps the fall is a mystery, or rationalism
  about sin fails, or the privation account must be accepted as a brute explanatory
  primitive.


