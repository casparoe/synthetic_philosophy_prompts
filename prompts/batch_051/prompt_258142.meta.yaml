  Moore''s paradox: sentences of the form "p, but I don''t believe that p" are odd/absurd
  to assert, though not logically inconsistent — both conjuncts can be true simultaneously
  (p can be true while I fail to believe p). The paradox concerns assertion and belief:
  it''s possible for it to be true, impossible (or absurd/pragmatically contradictory)
  to assert sincerely. Variants: the omissive form "p, but I don''t believe p" and
  the commissive form "p, but I believe not-p." Wittgenstein emphasized "Moore''s
  paradox" about "I believe it''s raining but it isn''t raining." The key point: the
  first conjunct asserts p; by saying "I don''t believe p," the speaker disavows the
  state that normally warrants asserting p. There''s debate: is it a contradiction
  in the "avowal" logic? The standard analysis: assertion expresses belief, so asserting
  p expresses/implies "I believe p," which contradicts the second conjunct — a pragmatic
  or expressive contradiction, not semantic.


