  "Write the desiderata for a theory of how contractualist moral reasoning may aggregate
  complaints or claims. In Scanlon''s contractualism, an act is wrong if it is prohibited
  by any principle that no one could reasonably reject; aggregation is constrained
  by something like an individualist restriction: roughly, when a principle is to
  be rejected by considering one person''s grounds, we may not add together the smaller
  complaints of many other people to outweigh one person''s serious complaint. But
  Scanlon himself complicates this by allowing aggregation in cases where a person
  would be exposed to serious harm under each of different scenarios, and by drawing
  distinctions between different ''sources'' of complaints. I want the criteria that
  any adequate treatment of aggregation within this framework must satisfy. For each
  criterion, give the specific case or conceptual pressure that forces it, and say
  whether it is a fixed point of the contractualist idea or a more optional theoretical
  choice. In particular, address: the difference between aggregating within a single
  person''s life and across lives; how to handle many small benefits that together
  prevent a great loss without toting up the benefits in an unrestricted way; whether
  there is a principled distinction between harms that are certain and harms that
  are probabilistic; and whether a satisfactory view must itself be rejectable or
  not. End by identifying which pair of desiderata is likely to be in tension, and
  which one does the most to separate a genuinely contractualist view from a utilitarian
  one."


