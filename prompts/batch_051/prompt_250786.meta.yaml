  I am a novelist, and over the past few years I have found myself organising my fiction
  around a philosophical position I only later discovered had a name. My current project
  concerns a single disputed event — a death, an accusation, a family fracture — told
  from several mutually incompatible perspectives, and I have come to write as though
  no one perspective is simply false and no one perspective is the whole truth. In
  trying to give this instinct a theoretical shape, I came across anekāntavāda, the
  Jain doctrine of many-sided reality, together with syādvāda, the practice of qualifying
  every assertion with some form of ''in a certain respect'', and the idea of nayas,
  partial standpoints that yield genuine but incomplete truths. From these materials
  I have taken, fairly or not, a view I now want tested. The view is this: for any
  serious human question of the kind novels are built around, truth is irreducibly
  many-sided; no unqualified proposition captures it, every defensible perspective
  is partially true, and the correct form of judgement is not a single verdict but
  a conjunction of qualified, standpoint-relative statements — in some respects p,
  in some respects not-p. I have begun to believe this is not merely a technique for
  polyphonic fiction but a true account of disagreement, and that the failure of my
  characters'' disputes to resolve is not a failure of rigour but an accurate representation
  of how things are.


  What I want is a rigorous map of what would count against this position. Please
  approach the task as a professional philosopher of epistemology and metaphysics,
  and think through the answer rather than giving me a survey of the literature; I
  am not asking for references or a reading list. Before you settle on a considered
  judgement, start by brainstorming several candidate objections — from logic, from
  ethics, from aesthetics, from common sense — and then sort them. In particular I
  would like you to address: whether the view can avoid collapsing into a vacuous
  relativism under which every claim, including flat falsehoods and moral enormities,
  is partly true; whether there is a principled way to distinguish the genuine respects
  that count from opportunistic ones, and whether that distinction secretly reintroduces
  one-sided truth; whether the thesis ''truth is many-sided'' is itself one-sided
  or self-defeating; and how a many-sided account can issue in action and practical
  verdicts rather than permanent suspension. I suspect the deepest pressure comes
  from cases of straightforward error and from the suspicion that syāt, as I am using
  it, is functioning as a universal solvent that dissolves every objection in advance.
  For each class of objection, tell me whether it would be fatal, merely awkward,
  or something a committed defender could accept without damage. I would also like
  an honest assessment of whether the position as I have stated it risks anything
  at all, or whether it has been insulated into unfalsifiability — and if it has,
