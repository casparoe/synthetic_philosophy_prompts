  Let me recall actual standard objections to superrationality more precisely. From
  the literature:


  - The basic objection: rational choice theory in the Prisoner''s Dilemma uses dominance;
  superrationality requires abandoning the assumption that players'' choices are causally
  independent. (This is the standard causal decision theory objection.)

  - Superrationality assumes perfect symmetry; if there is any difference in the players''
  situations, the argument that "if I cooperate, the other will too" doesn''t hold.
  (Symmetry objection.)

  - Superrationality requires the players to have common knowledge of each other''s
  superrationality; without it, each may rationally defect. (Common knowledge objection.)

  - Superrationality is anthropomorphic / assumes the other agent is a "reasoning
  mirror" rather than a strategic opponent; in real societies, people don''t play
  superrationally, and evolution punishes such players. (Empirical/evolutionary objection.)

  - In games with multiple equilibria or multiple superrational strategies, superrationality
  doesn''t select among the symmetric ones — e.g., a symmetric game where both playing
  A and both playing B are superrational equilibria, and there''s no rule to pick.
  (Selection problem / "assurance game" problem.) This is actually a real issue: in
  an assurance game (Stag Hunt), both Stag and both Hare are symmetric profiles; superrationality
  would pick Stag because it''s payoff-dominant, but there''s debate. In PD, both
  defect is not superrational because C payoff is higher. But the general point: superrationality''s
  comparison of symmetric outcomes doesn''t help in games where the payoff-dominant
  symmetric profile is risky (like Stag Hunt); it would just assume coordination on
  the better one. Actually in Stag Hunt, superrationality does pick Stag (the Pareto-dominant
  symmetric equilibrium), which is its recommendation; the objection is that this
  ignores risk. Hmm.


  Maybe a cleaner fourth: "superrationality treats the other player as part of a joint
  decision-making unit, but the PD''s whole point is that the two players have separate
  interests; if you''re allowed to act as a unit, the problem has been changed from
  a game to a single-agent optimization." This is the "changes the problem / dissolves
  it" objection. That might be distinct.


