  Therefore interval-valued degrees of belief, ranking-based approaches, belief functions,
  and the like are not merely nonstandard; they violate constraints so basic that
  any rational agent should endorse them. I find this enormously attractive: it would
  replace a messy design choice with a theorem, give every dispute about uncertainty
  a definite answer, and explain why all sensible systems end up looking like probability
  theory anyway.


