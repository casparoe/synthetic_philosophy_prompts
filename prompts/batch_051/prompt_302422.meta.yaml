  those practices involved clear harm to persons (often women with little real choice).

  4) More generally, a colonial power can be justified in prohibiting harmful practices
  in a subject society even without the consent of the governed, when the practices
  are serious and the prohibition is effective.

  5) The value of liberty is universal: it does not track race, culture, or "level
  of civilization," and any account of liberty that makes whole populations "not ready"
  for it is presumptively an alibi for domination.

  6) Paternalism toward adults is wrong even when adults choose badly, because coercing
  someone for their own good treats them as a means to an outcome rather than respecting
  them as an agent.


