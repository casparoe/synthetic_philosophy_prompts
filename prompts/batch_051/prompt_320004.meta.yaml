  Actually, let me think about why deliberation might crowd out prediction. Reasons:

  (a) Predicting your own choice is a kind of commitment; if you assign high probability
  to A, that itself might cause you to do A (self-fulfilling), so the prediction isn''t
  neutral — the act of predicting changes the thing predicted, so there''s no stable
  well-defined target.

  (b) Deliberation requires treating options as open (the "deliberative stance"),
  and forming a determinate prediction undercuts that stance, treating your future
  action as a fact about the world rather than as something to be decided.

  (c) If EDT is correct, act-credences are inputs to expected utility; but using your
  own prediction as evidence ("I''d probably do X") is double-counting or circular,
  because doing X isn''t a state of the world independent of your choice.

  (d) There''s a fixed-point issue: you could predict at a fixed point where the prediction
  matches the choice given the expected utilities computed using the prediction, but
  that''s not a genuine prediction, it''s a decision.


