  Let''s draft final prompt:


  I work as a policy analyst in a nonpartisan legislative research office. My team
  reviews the factual claims embedded in proposed bills, regulatory impact statements,
  and committee preambles, and we have to classify each claim as established, contestable,
  or unsupported before the bill goes to committee. We make these calls repeatedly,
  under deadline, and a wrong call can leave lawmakers voting on a false empirical
  premise. I want a reusable decision procedure for evaluating such claims that is
  grounded in pragmatist theories of truth, especially the difference between C. S.
  Peirce and William James. The procedure should be one an analyst with no philosophy
  training can follow in three hours per claim, and it should make clear when it is
  being Peircean and when it is being Jamesian.


  Here is the passage from Peirce''s 1878 essay "How to Make Our Ideas Clear" that
  I want the procedure to take seriously:


  "A clear idea is defined as one which is so apprehended that it will be recognized
  wherever it is met with, and so that no other will be mistaken for it."


  Peirce immediately says this amounts only to a subjective feeling of mastery. So
  I don''t want a procedure that just tells an analyst whether a claim feels clear.
  Please write the procedure: the questions to ask in order, what counts as a sufficient
  answer to each, where the procedure stops with a "no" and labels the claim unsupported,
  where it hands the decision to a person because the claim turns on values or policy
  rather than fact, and where judgment cannot be eliminated no matter how good the
  checklist. Then apply the procedure to two hypothetical claims: (1) a bill states
  that exposure to a specified pesticide in drinking water at a specified level causes
  neurological damage, and (2) a bill''s preamble states that a traditional child-rearing
  practice is "safe and beneficial for development." I suspect the second will return
  an answer my office will not like, and I want the procedure to say why. Also state
  explicitly what the procedure cannot do.


