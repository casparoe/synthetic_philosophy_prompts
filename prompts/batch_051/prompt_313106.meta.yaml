  Prompt draft:


  "You are an expert in intergenerational ethics and the economics of climate change.
  Think carefully, and don''t hide behind ''it depends'': I want an actual number.


  Let P be the following proposition:


  There exists a feasible policy package, deployable by mid-century in a world with
  institutions roughly as they are today (no global benevolent dictator, but normal
  states, markets, and debt markets), that is a ''safe Pareto improvement'' relative
  to a business-as-usual baseline. By ''safe,'' I mean it keeps peak global warming
  below 2°C above pre-industrial with at least a two-thirds probability. By ''Pareto
  improvement,'' I mean that, with each generation idealized as a representative agent,
  no generation from now through, say, 2200 is worse off in welfare terms than it
  would have been under business as usual, and at least one generation is strictly
  better off.


  Two specific things I want flagged rather than assumed away. First, the only morally
  relevant compensation channels from future to present run through mechanisms like
  bequests, government debt, innovation rents, and the capitalization of future climate
  benefits into present asset prices — so whether a ''safe Pareto improvement'' is
  possible hinges on whether those channels actually transmit enough value backward
  in time. Second, welfare comparisons across generations may require saying that
  losses of non-substitutable goods (species, glaciers, cultural landscapes, habitable
  places) can be offset by increments of standard consumption; that may be false.


  Give me your actual credence in P. Then decompose it: (1) the central sub-claims
  — about the magnitude of climate damages and tail risk, about future generations
  being richer under business as usual, about the existence and capacity of future-to-present
  transfer mechanisms, about the substitutability assumption behind welfare comparisons,
  and anything else that matters; (2) a rough probability for each; (3) how you combined
  them; and (4) the sub-question you were least comfortable assigning a probability
  to. Finally, I am at 0.45 and a colleague is at 0.85. Where does the disagreement
  most likely live, and what evidence would move your number the most?"


