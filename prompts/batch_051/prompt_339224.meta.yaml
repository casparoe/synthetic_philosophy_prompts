  ---


  I am a novelist, and I am developing a speculative novel whose central premise is
  that, on a particular Tuesday in the near present, every person of ordinary cognitive
  capacity acquires a narrow but real form of logical omniscience. Specifically, from
  that day forward, whenever a proposition follows classically from propositions they
  currently believe, they automatically and effortlessly come to know that proposition.
  They do not gain any new perceptual evidence; they do not gain access to the contents
  of anyone else''s beliefs; they do not gain any supernatural ability to discover
  empirical facts; and the faculty applies only to classical logical consequence,
  not to probability, causal reasoning, interpretation, or the meanings of natural-language
  utterances in context. To avoid a trivial result, the faculty announces contradictions
  when it finds them and then suspends inference from inconsistent sets rather than
  deriving every proposition from an inconsistency.


  I want the novel to obey its own internal logic. Before writing, I am asking for
  a reasoned prediction, not a plot outline. Starting in an otherwise ordinary society,
  imagine the change occurs tomorrow and persists for fifteen years.


  Trace what happens to (choose at least three): personal self-deception and compartmentalisation;
  political argument and ideology; legal reasoning and testimony; mathematics, science,
  and philosophy; advertising and propaganda; and ordinary conversation and humour.


  For each, analyse mechanisms rather than merely asserting outcomes. Which practices
  collapse quickly because they depend on people failing to see the consequences of
  their own beliefs? Which adapt because they depend on false premises, ambiguity,
  probability, or suppressed information rather than invalid inference? In which domains
  does the change matter surprisingly little? Conclude by stating which of your predictions
  you regard as robust, which are fragile, and what assumptions one would have to
  reject for the fragile ones to fail.


  Please write the answer in British English.


