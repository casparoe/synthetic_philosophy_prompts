  other people from getting the same headache, the principle happily permits it. But
  if causing one person a severe headache would produce enormous pleasure for five
  other people, the principle says you may not treat the pleasure as making up for
  the headache; the headache remains a wrong that has to be justified by pain avoided,
  not by joy gained.


