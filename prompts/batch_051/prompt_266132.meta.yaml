  I am a high-school student and have been trying to work out an ethical principle
  that I have not been able to find stated anywhere exactly as I mean it. I have been
  calling it the Non-Cancellation Principle. It says this: pleasure and pain should
  not be entered into the same moral ledger. In ordinary moral arithmetic, a pain
  counts as a negative number and a pleasure as a positive number, and you may add
  them, so that enough pleasure could "cancel" a pain and make the whole state of
  affairs good. I think that arithmetic is mistaken. A pain is not cancelled by any
  amount of pleasure located in other lives or other moments; it can be outweighed
  only by the prevention or reduction of some worse or equal pain. Happiness matters,
  but it answers a different question — whether a life or a moment is worth having
  — and it never enters the subtraction.


