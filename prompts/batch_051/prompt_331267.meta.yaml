  In my seminar on the philosophy of medicine we have been working on the authority
  of the earlier self: how far can a person, while competent, bind her later, incapacitated
  self by an advance refusal of life-sustaining treatment? A student presented the
  argument below, contending that the standard justification for honouring such refusals
  does not survive the case of advanced dementia. Each step seems individually plausible
  to me, and yet I half-suspect that the term ''interests'' is made to carry a different
  load at the end than it carries at the beginning. I would value a careful audit
  of the argument''s validity and of each premise, taken on its strongest reading.


  (1) A competent adult''s refusal of life-sustaining treatment is honoured because
  the question at issue is whether treatment would make her life go better or worse,
  and that is a matter of her own interests, judged from her standpoint within the
  life that is at stake.


  (2) The respect owed to such a refusal therefore has its ground in the way the decision
  expresses the person''s settled concerns about how her life is to go — the concerns
  in virtue of which treatment counts as benefit or burden for her.


  (3) An advance refusal is made while those concerns are intact but acted upon only
  later, when they may be gone. A patient with advanced dementia may take pleasure
  in continued care and human contact, and may find the earlier self''s fear of a
  dependent, lingering death meaningless or alien.


