  person now being treated: they are not experienced as goods by her, and the only
  interests that remain in play are the later self''s present, experienced well-being.


  (5) Therefore the earlier self''s authority over the later self''s care cannot be
  founded on the same principle that justifies honouring a competent refusal; if such
  authority exists, it must rest on some further, independent basis.


