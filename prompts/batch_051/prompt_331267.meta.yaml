  One classic question: Why should a person''s earlier competent self have authority
  over their later demented self? Dworkin: integrity and critical interests. Dresser:
  the later self''s current experiential interests trump.


  Candidate argument:


  (1) A competent adult has the right to refuse medical treatment, even life-saving
  treatment.

  (2) An advance directive is a competent adult''s exercise of this right, recorded
  for a future time of incapacity.

  (3) The right to refuse treatment is grounded in the value of self-determination:
  a person''s life should be shaped by choices that reflect what she cares about,
  not merely by what happens to her.

  (4) If the right to refuse treatment is grounded in that way, then it extends to
  choices that take effect only later, because a temporally extended choice still
  shapes the life as a whole.

  (5) Therefore, when a formerly competent person, now demented, resists treatment
  that her earlier self refused in advance, respecting the advance directive is not
  merely permissible; it is required by the same principle that underwrites any competent
  refusal.


