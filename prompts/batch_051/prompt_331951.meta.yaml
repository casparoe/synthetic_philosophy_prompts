  ECL: Caspar Oesterheld''s "Evidential Cooperation in Large Worlds" (ECL) argues
  that in a large world (many agents, impossible to coordinate), evidential decision
  theory (EDT) implies that agents should cooperate in generalizations of PD, because
  your action is evidence about similar agents'' actions. The argument shows EDT agents
  can achieve mutual cooperation without causal interaction. A "proves too much" argument:
  by the same evidential reasoning, you should also act as if you control the actions
  of similar agents in all sorts of cases, arguably making absurd demands (e.g., you
  are evidence about billions of past/future similar agents, so any sacrifice is outweighed;
  or it implies you should follow through on threats to similar agents, etc.). Or
  the argument that EDT treats your action as choosing for all similar agents, which
  seems to prove too much—deliberation becomes a referendum over an army of doppelgängers.


