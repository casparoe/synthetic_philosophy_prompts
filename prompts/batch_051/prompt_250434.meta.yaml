  Prompt:


  In a seminar on Hayek''s epistemology of markets, we read this passage from "The
  Use of Knowledge in Society":


  [verbatim passage]


  I''ve been turning it into an argument with a friend, and it now seems to prove
  that informed markets shouldn''t trade at all, which can''t be right. Here''s the
  argument:


  (1) If prices are to coordinate agents who each possess only dispersed, local knowledge,
  then prices must somehow transmit that dispersed knowledge to other agents. (This
  is the Hayekian picture.)


  (2) If prices transmit agents'' dispersed knowledge, then an agent who observes
  a price at which another agent is willing to trade can infer something about the
  other''s private information from that willingness, and update on it.


  (3) In purely informational trade—where agents have the same preferences and endowments
  except for differing private information—when one agent offers to trade at a price,
  that offer reveals the agent''s private information; a rational counterparty will
  infer the information and revise her own valuation.


  (4) Thus any initial difference in willingness to trade caused only by different
  information will be eliminated by the very offer to trade, before the trade occurs.
  So no mutually agreed trade should take place.


  (5) Therefore, under the Hayekian picture, markets whose participants have only
  dispersed information and no differing tastes or risk-bearing needs should be silent;
  indeed, informational efficiency undermines the very trading that is supposed to
  produce it.


  But real markets — financial markets, commodity markets — are full of trades driven
  by differential information. Where does this argument go wrong? If I have to keep
  something, I''d like to keep the Hayekian premise that prices transmit dispersed
  knowledge, but I worry that once I accept it, the no-trade conclusion follows. Which
  step is the weak one, and what does rejecting it cost?


