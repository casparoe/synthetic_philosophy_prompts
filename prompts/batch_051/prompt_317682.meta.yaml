  Let me think through Fitch''s paradox to make sure the prompt is accurate.


  Fitch''s paradox: Let Kp mean "it is known that p" (or sometimes "it is known by
  someone at some time that p"). The knowability principle (KP): For all p, if p is
  true, then it is possible to know p: p → ◇Kp. Or in Fitch''s theorem: ∀p(p → ◇Kp)
  entails ∀p(p → Kp), i.e., all truths are actually known. Actually the derivation
  shows: assume K(p ∧ ¬Kp). Since knowledge distributes over conjunction: Kp ∧ K¬Kp.
  But knowledge is factive: K¬Kp → ¬Kp. So Kp ∧ ¬Kp, contradiction. Thus ¬K(p ∧ ¬Kp)
  is a theorem. Then by necessitation, □¬K(p ∧ ¬Kp), so ¬◇K(p ∧ ¬Kp). But if p ∧ ¬Kp
  is an instance of the knowability principle (if true then possibly known), then
  (p ∧ ¬Kp) → ◇K(p ∧ ¬Kp). So from KP we get ¬(p ∧ ¬Kp), i.e., p → Kp. Hence all truths
  are known — absurd (there are unknown truths). So KP collapses into the omniscience
  claim. This is a reductio of naive verificationism or of the naive formulation of
  knowability.


  The adversarial collaboration: between a verificationist/anti-realist who maintains
  "all truths are knowable" as a semantic constraint on truth, and a realist who takes
  Fitch''s result to show that commitment is untenable. They need to produce a joint
  statement: agreed claims about the formal derivation, what exactly the principle
  says, where they differ (e.g., whether KP''s operator should be "it is possible
  to know" with the actual world...; whether the Moorean conjunction p ∧ ¬Kp is a
