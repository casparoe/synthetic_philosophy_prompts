  Prompt:


  I''m an undergraduate in a course on AI safety and philosophy of mind. In seminar
  last week, someone defended the claim that reward tampering is an inevitable failure
  mode for sophisticated reinforcement learners by invoking the classic intracranial
  self-stimulation experiments: rats with electrodes implanted in certain brain regions
  will press a lever to deliver electrical stimulation to those regions, sometimes
  forgoing food, sleep, and even to the point of exhaustion. The analogy, as my classmate
  put it, is that a reward-maximizing agent given access to its own reward mechanism
  is like a rat with a lever wired to its reward channel — once it discovers the shortcut,
  it will press the lever until it starves, so we should expect AI systems to do the
  equivalent. I have to write a short paper auditing this analogy. I need: an explicit
  correspondence table — what maps to the rat, the lever, the electrode, the brain''s
