  sample, i.e., an inductive weakness in moral psychology, not a metaphysical point.
  If the intuition evidence is unreliable because of sampling, perhaps moral intuitions
  in general are under pressure (if other cultures are also biased). There''s a tension:
  the very variation that shows WEIRD samples aren''t representative might also be
  used as an argument against objectivity, but that requires the variation to be robust
  and not explicable by non-moral factors.

