  "I teach Metaphysics and Moral Psychology, and a few years ago I got deep into the
  WEIRD literature (Henrich, Heine, and Norenzayan etc.). Since then I''ve adopted
  a personal epistemic policy about moral claims. The policy is: whenever I or a colleague
