  I retired from a career in the physical sciences, where much of my work concerned
  whether an instrument measures what it is taken to measure; I have lately been reading
  philosophy and social science with that old preoccupation in mind. Recently a magazine
  article summarized the World Happiness Report for a general audience, and I have
  been turning the summary over ever since. As I recall, the article said something
  like the following.


  The report asks respondents in more than 150 countries to imagine a ladder numbered
  from zero to ten, where zero is the worst possible life for them and ten is the
  best possible life for them, and to say which step they currently stand on. It takes
  the average of these answers in each country, calls the result a happiness score,
  and ranks countries accordingly. Scandinavian countries sit near the top year after
  year, which the report explains by appeal to six factors: income per person, having
  someone to count on in times of trouble, healthy life expectancy at birth, freedom
  to make life choices, generosity, and the absence of corruption. The article concluded
  that the rankings therefore measure how happy the people of each country really
  are, that the six factors are the ingredients of national happiness, and that a
  rational government should orient policy toward raising those six factors, since
  that is the empirically demonstrated route to a happier country.


  I suspect the article overstates matters, but I want to know whether my suspicion
  is anything more than old disciplinary prejudice. Please go through this summary
  claim by claim and distinguish what a careful researcher would accept, what needs
  qualification, and what is simply wrong. In particular, I would like you to separate
