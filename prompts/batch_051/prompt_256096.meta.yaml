  say how far it is legitimate to describe the six factors as causes or ingredients
  of national happiness. Then assess the policy conclusion: if a government set out
  to raise its country''s rank, what would a corrected understanding of the findings
  lead one to predict — and would a rise in the ranking be good evidence that the
  population had become happier?


