  profound lifelong disability; the treatment is expensive per child and has not been
  followed long enough to know whether the gains persist beyond early childhood. The
  second, Program B, would fund an early-access physiotherapy and pain-education pathway
  for chronic low-back pain across the system, serving perhaps sixty thousand adults
  a year with a well-evidenced but modest average improvement in pain, function, and
  return to work. The two programs cost about the same annually, and we cannot fund
  both from this year''s surplus.


