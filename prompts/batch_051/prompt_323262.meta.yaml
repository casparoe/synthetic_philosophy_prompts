  people made meaningfully better off, even if each a little, plainly outweighs a
  dozen or so children whose outcome is uncertain. The other group says that is exactly
  the wrong way to think — that a decision is only defensible if we could justify
  it to an affected person one at a time, and that no parent could reasonably be asked
  to accept a child''s death or severe disability so that tens of thousands of others
  can each have somewhat less back pain; on this view we are not permitted to pour
  many small complaints into one big bucket and call it a bigger claim than the children''s.
  Our charter requires that allocation decisions give priority to the most urgent
  individual need while also maximizing health benefit across the population we serve,
  which is part of why we are stuck — both sides can point to language that supports
  them.


