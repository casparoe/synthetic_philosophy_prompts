  Possible desiderata for a theory of punishment:

  1. It must justify the hard treatment the state visits on offenders.

  2. It must explain proportionality — why a longer sentence for worse crimes.

  3. It must handle marginal cases: attempts and impossible attempts (does liability
  require completed harm?), reckless vs negligent vs strict liability, accomplices,
  corporate persons, juveniles, mentally ill offenders.

  4. It must explain the difference between punishment and other hard treatment (quarantine,
  civil commitment, tax, occupational licensing) — the "definitional question" and
  whether it matters.

  5. It must address whether punishing the innocent can ever be justified (the classic
  objection to consequentialism; scapegoating).

  6. It must handle mercy and pardons: if a punishment is deserved, can mercy be justified
  without being unjust?

  7. It must account for the expressive/communicative dimension of punishment (denunciation,
  censure) — is that a requirement or a camp preference?

  8. It must be consistent with the fact of moral luck in the criminal law: attempted
  murder and completed murder differ in outcome but not in what the offender chose.

  9. It must say something about collateral consequences (felon disenfranchisement,
  deportation, employment bans) and whether these count as part of punishment.

  10. It must respond to abolitionist challenge: does the state''s right to punish
  require an account of the state''s authority?

  11. It must not collapse into revenge; distinguish retribution from vengeance.

  12. Empirical constraints: deterrence research (marginal deterrence uncertain, celerity
  vs severity), incapacitation effects — which empirical findings can''t it contradict?
