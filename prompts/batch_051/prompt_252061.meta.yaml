  Let''s draft:


  "In a seminar on obedience and authority, I noticed that when Milgram''s participants
  or soldiers in hindsight are discussed, someone eventually falls back on the sentence
  ''orders are orders,'' and it seems to end the conversation. It is being made to
  do real argumentative work—it is meant to explain or excuse compliance with orders
  the person would otherwise call wrong—but I cannot tell what exact claim is doing
  the work. I would like you to treat that sentence as an object of analysis and lay
  out the distinct precise claims it could be making. Some candidate readings I can
  see: (a) a legal or institutional claim that lawful orders remove the subordinate''s
  legal liability; (b) an organizational responsibility claim that the superior, not
  the subordinate, is the proper target of blame; (c) an epistemic claim that subordinates
  in a chain of command are not in a position to evaluate the orders they receive;
  (d) a moral role-obligation claim that deference to authority is itself a virtue,
  or is the price of valuable institutions; (e) a psychological claim describing why
  people comply rather than a justification. Are these readings distinct in the right
  way, and are there important ones I have missed? For each, indicate whether it is
  trivial, substantive but plausible, or implausible, and whether it actually supports
  the explanatory/exculpatory work the slogan is being made to do in the seminar.
  I also want an honest verdict on which reading the person who says ''orders are
  orders'' probably needs, and which readings are doing illicit work. Finally, tell
  me what would change your mind about that verdict—which empirical finding about
  how far ordinary soldiers can assess orders, which argument about responsibility,
  or which counterexample would most threaten your diagnosis, and where your reasoning
  is most likely to fail."


