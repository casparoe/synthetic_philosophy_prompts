  the facticity/transcendence machinery rather than parrot the waiter. Quick reminder
  of the machinery: for Sartre a human being is always both facticity (the brute givens
  you find yourself with — your body, your past, your situation) and transcendence
  (your freedom to take that given and give it meaning by projecting beyond it). Bad
  faith is trying to collapse that ambiguous double structure and pass as only one
  of the two sides. The standard examples mostly run in the direction of collapsing
  into facticity — the person makes themselves into a fixed thing, a role, a label.
  I want the other direction.


  Construct a scene in which someone is in bad faith by fleeing their facticity into
  pure transcendence: they treat their own past, habits, and commitments as if those
  are not really theirs, or place no weight on what they choose to do next. The character
  should be sympathetic and ordinary — a real human, not a caricature — and the scene
  should be a paragraph, set somewhere mundane like a friendship, a workplace, or
  a family conversation. No one in the scene talks philosophy or has read Sartre,
  and the character knows the facts perfectly well; the self-deception is not about
  what happened but about what it means for who they now are. The bad faith should
  not require the person saying "I''m radically free, so I can''t make promises" unless
  you can make that not sound like a cartoon.


