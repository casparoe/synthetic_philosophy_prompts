  inspects the other''s code and cooperates iff the other program would cooperate
  with it. (The mutual-cooperation fixed point, instead of the defect one.)


  2. FairBot-style: each program cooperates iff it can prove the other program cooperates
  with it; two FairBots prove each other cooperative and cooperate, while a FairBot
  defects against a program it cant prove cooperative.


