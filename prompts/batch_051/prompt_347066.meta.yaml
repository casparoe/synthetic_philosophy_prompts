  The asker''s position set (call them "my commitments"):


  The set-up: I''m writing up a position in metaethics/philosophy of religion on the
  Euthyphro. Here''s the package.


  Commitments:


  (1) Voluntarism about obligation, not about value: an act''s being morally obligatory
  is constituted by its being commanded by God; I don''t claim the goodness of God
  or the value of persons is constituted by divine fiat.


  (2) Anti-arbitrariness: God could not have made cruelty obligatory; the content
  of morality is not up to God''s arbitrary choice but is fixed by God''s perfectly
  good nature.


  (3) The "nature" horn is not a cop-out: the goodness of God''s nature is not to
  be explained by God''s nature''s instantiating some independent property or moral
  standard; rather, God''s nature just is the paradigm of goodness, and created things
  are good insofar as they resemble it.


  (4) Explanatory direction matters: the Euthyphro question is not dissolved by saying
  "God and the good are identical and identity is symmetric"; we still need to say
  whether God''s being God explains what goodness is, and the answer should preserve
  the priority of God over the good.


  (5) The point of a command account is answerability: obligations are norms owed
  to a person; impersonal standards (e.g., Platonic Forms) can explain what is good
  to do but not what is owed, so only a personal God explains obligation.


