  (1) Obligation: an act is morally obligatory iff (and because) God commands it.

  (2) Anti-arbitrariness: it is not possible for God to command just anything; God''s
  commands are constrained by his essentially good nature, so he could not command
  gratuitous torture.

  (3) Asymmetry (anti-idolatry of properties): God is not good because he has certain
  properties; rather, the properties are good because God has them (goodness is ontologically
  grounded in God''s nature, not in a property-standard God happens to satisfy).

  (4) Explanatory realism about the dilemma: the Euthyphro question "is it good because
  God commands it, or commanded because it is good?" must have a single, non-arbitrary
  answer — explanatory priority matters and isn''t a word game.

  (5) Answerability: moral obligations are the sort of thing that are owed to someone,
  which is why command/sovereignty models capture obligation better than impersonal
  property models.


