  is matter-free and d identity outside). But d*g differs from g inside H (g and d*g
  agree outside H, differ inside). Both models satisfy Einstein''s equations (diffeomorphism
  covariance). So we have two distinct models agreeing on all points outside H but
  differing inside H — a failure of determinism if the models are regarded as representing
  distinct physical possibilities.


