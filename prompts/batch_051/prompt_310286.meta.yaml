  harm of size n decays as n^{-α}" the right formalization? Let''s make it precise.
  Suppose the mugger names a harm H (utility -H). The prior probability that a randomly
  encountered mugger is a "real" mugger of capacity at least H is proportional to
  H^{-α}. The expected harm of paying vs not paying: if you don''t pay, expected disutility
  = P(real) * H. If P(real) ∝ H^{-α}, then expected disutility ∝ H^{1-α}. So:

  - α > 1: expected harm decreases with H (for α>1, H^{1-α} → 0 as H→∞). Larger threats
  are less expected-harm; EV says don''t pay (for sufficiently large H).

  - α = 1: expected harm constant in H (∝ H^0).

  - α < 1: expected harm grows with H (∝ H^{1-α}); EV says pay for large enough H.


