  "Got into a long, circular argument with a friend last night about whether you can
  compare historical atrocities, and I keep coming back to a pattern in the back-and-forth
  that I don''t have a word for. I''d made an offhand remark that the Armenian genocide
  and the Holocaust weren''t the same in scale, and she got angry—not at the factual
  claim, she said, but at the entire act of putting them on a scale. Her line was
  that ranking mass death is already obscene because it converts suffering into a
  ledger and always ends with someone''s dead mattering less. Fair enough, but then
  I noticed she was doing the same thing with the sign reversed: she said the Soviet
  famines were ''uniquely'' cynical because the state could have fed people and chose
  not to, which is a comparison to every other way people have died in famines. And
  I was no better: when I objected that intentional extermination is different in
  kind from callous neglect, I was drawing a line that put one class of atrocity above
  another, even though I''d just been arguing that you can''t rank them.


  Since then I''ve spotted the same thing in how people talk about all of this. Saying
  something was ''unprecedented'' or ''the worst thing a government can do'' is a
  comparative claim, but it passes as non-ranking because it isn''t presented as a
  list. People who insist that comparisons are obscene will reach for comparative
  numbers or uniqueness claims the moment they need them, and the prohibition mostly
  seems to bite when the other side''s comparison is going somewhere we don''t like.
  I don''t think the lesson is just that everybody is a hypocrite, though maybe it
  is.


