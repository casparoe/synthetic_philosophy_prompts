  Heidegger''s readiness-to-hand (Zuhandenheit) in Being and Time §15-18: equipment
  (Zeug) is encountered in use, in a context of assignments (Verweisungszusammenhang);
  the equipmental totality (Zeugganzheit). When equipment works, it is "ready-to-hand"
  and withdraws. Breakdown of equipment: three modes of disturbance:

  - **Auffälligkeit (conspicuousness)**: the tool becomes conspicuous when unusable
  — e.g., the hammer is too heavy. It stands out as unusable.

  - **Aufdringlichkeit (obtrusiveness)**: the tool obtrudes when something is missing
  that the tool needs — e.g., no nails. The missing item is conspicuous by its absence,
  and the present tool becomes obtrusive as not fully usable.

  - **Aufsässigkeit (obstinacy)**: the tool is obstinate when it stands in the way
  / is in the wrong place, "lies around" unusably — something in the way that must
  be worked around before the task can continue.


  Heidegger: "In these modes, the ready-to-hand shows itself as still ready-to-hand,
  but in its unusability... the structure of the being of the ready-to-hand as in-work..."
  Actually the key passage: unusability brings out the referential totality. The breakdown
  "lights up" the referential context, and the world (Welt) announces itself. Present-at-hand
