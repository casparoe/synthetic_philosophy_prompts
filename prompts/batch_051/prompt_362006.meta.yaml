  Dennett, Consciousness Explained (1991): "multiple drafts" model. Key claims: all
  varieties of perception and thought are accomplished by parallel, multitrack processes
  of interpretation and elaboration of sensory inputs; information entering the nervous
  system is under continuous "editorial revision"; at any point in time there are
  multiple "drafts" of narrative fragments at various stages of editing in various
  places; probing this stream at different points yields different accounts; there
  is no single, definitive "stream of consciousness," only a parallel stream of conflicting
  and continuously revised contents; asking "but when did the subject become conscious
  of X?" has no good answer — the "first time in consciousness" is a myth.


  Arguments against Cartesian theater that Dennett gives:


  1. **No central place/time**: The brain doesn''t have a functional place where "it
  all comes together"; if you draw the line (e.g., at the pineal gland), you face
  the problem that the events "presented" to the homunculus need another place to
  be presented to the next homunculus.


  2. **Orwellian vs Stalinesque**: Dennett''s thought experiment of a memory-based
  illusion: Suppose a subject briefly sees a stimulus and reports it one way; two
  explanations: (a) "Stalinesque": the show trial — the conscious experience itself
  was staged/falsified (the stimulus was altered before consciousness, analogous to
  Stalin''s show trials with false testimony given "first-hand"); (b) "Orwellian":
  memory was tampered with after consciousness (Orwell''s Ministry of Truth rewriting
  history). Dennett argues no possible experiment can distinguish them because both
  predict identical reports, so the distinction between "conscious experience" and
  "later memory" is not a real difference in the brain — this is an argument against
  the theater model''s assumption that there''s a fact of the matter about what "really"
  appeared on stage.


  3. **Color phi phenomenon**: Two spots flash in succession, one red, one green;
  subjects report a single spot that moves and changes color in the middle. The subject''s
  report requires the second flash to have influenced the experience of the color
  change after the first spot''s trajectory — the brain "fills in" the trajectory
  and color change retroactively. Wait actually the standard color phi: a red spot
  lights briefly, then a green spot lights nearby; subjects report seeing one spot
  move from first location to second, changing color abruptly halfway. If the subject
  reports the color changed mid-trajectory, they must have known the second color
  before the "midpoint" was experienced. This suggests the experience of the midpoint
  was constructed after the second flash, violating the idea of a fixed chronological
  "final draft" presented in the theater.


  4. **Cutaneous rabbit**: taps on wrist then elbow then shoulder produce a feeling
  of taps hopping up the arm, with a phantom tap in between. The second and third
  taps modify the localization of the first. Again a "temporally backward" editorial
  effect.


  5. **The homunculus regress**: The theater needs a spectator; the spectator''s seeing
  needs an internal screen and another spectator, ad infinitum. The only way out is
  a special inner "soul-pearl" with unexplained powers, which is not an explanation.


  6. **The "probe" argument / multiple drafts content depends on probes**: In experiments,
  when you ask "what did you see?" at different times, you get different answers;
  there is no single privileged answer. The model is called "multiple drafts" because
  "probing" the process precipitates a narrative like a draft, and the answer one
  gets depends on when and how one probes. I could include this as "there is no fact
  about the final draft: the content you get depends on when and how you probe."


  7. **Stalinesque/Orwellian again** overlaps with 6.


