  Draft list of arguments against Cartesian Theater (as "replies to the friend"):


  (1) The inner-observer regress. A theater needs an audience. If seeing/experiencing
  is presentation to an inner observer, that observer''s appreciation of the show
  is itself a presentation that needs another observer; the regress stops only with
  a miraculous homunculus, which is no explanation at all.


  (2) The "no fact of the matter when" argument. In a parallel, multitrack brain,
  questions like "exactly when did he become conscious of it?" may have no determinate
  answer; there need not be a single moment at which an item "enters" consciousness.
  This is the temporal version of the theater''s central-moment assumption.


  (3) The Orwellian/Stalinesque equivalence. Dennett''s thought experiment: an illusion
  could be produced either by tampering with the "show" before it reaches the stage
  (Stalinesque) or by tampering with memory after the show (Orwellian). No experiment
  can distinguish the two because they predict the same reports. Hence the theater
  model''s distinction between "what really appeared in consciousness" and "what I
  remember of it afterwards" lacks empirical purchase.


  (4) The color phi phenomenon. A red spot flashes, then a green spot flashes at a
  nearby location; subjects report a single spot moving across and changing color
  partway along the trajectory. The report about the midpoint depends on the later
  green flash: the "experience" of the midpoint seems to be constructed retrospectively.
  This "filling-in" across time is hard to square with a fixed chronological presentation.


  (5) The cutaneous rabbit (and similar "temporal smearing" illusions). Successive
  taps at the wrist, elbow, and shoulder produce phantom taps hopping up the arm,
  with intermediate taps "felt" before the later taps could have been presented. The
  felt spatiotemporal order is an editorial product, not a faithful real-time sequence
  "projected" in a theater.


  (6) The probe-dependence of content. Under multiple drafts, what a subject reports
  depends on when and how the system is probed; different probings precipitate different
  "drafts." There is no single privileged joining of the stream that we can identify
  with "the" conscious content — instead there is a multiplicity of partially edited
  drafts at any moment.


