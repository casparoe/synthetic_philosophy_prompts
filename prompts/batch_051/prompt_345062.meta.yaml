  — hmm wait, amplitudes squared: I need values whose squares are e.g. 0.99 and 0.01.
  Amplitude sqrt(0.99) ≈ 0.994987, sqrt(0.01)=0.1; state = sqrt(0.99)|up> + 0.1|down>.
  Then Born rule says up with 0.99, down with 0.01.


  (4) But quantum mechanics'' empirical success — the statistical predictions tested
  in every laboratory — requires probabilities that track squared amplitudes, not
  branch counts: outcome "up" predicted with 0.99, not 0.5.


  (5) Therefore the Everettian agent''s credences contradict the Born rule, and since
  the Born rule is what quantum mechanics is for, MWI cannot be an adequate interpretation
  — or at least can say nothing about probability.


