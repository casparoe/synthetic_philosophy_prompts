  Born rule problem argument that seems to prove too much:


  (1) In Everettian quantum mechanics, measurement is just unitary evolution producing
  branching: every outcome with nonzero amplitude occurs in some branch.

  (2) Before observation, the observer''s future is spread across all branches; there
  is a future self in every branch.

  (3) If you know you will have successors in every branch, and you have no way to
  single out any successor in advance, then you should assign equal credence to ending
  up each successor — the principle of indifference over branches.

  (4) Equal credence over branches gives probabilities independent of the amplitudes;
  in particular, for an experiment with two branches of amplitudes sqrt(0.99) and
  sqrt(0.01), you should be 50–50 about which outcome you will see.

  (5) But quantum theory''s empirical success consists in the Born rule: outcomes
  are observed with frequencies matching their squared amplitudes. A 50–50 credence
  flatly contradicts this.

  (6) Therefore Everettian quantum mechanics cannot recover the Born rule and should
  be rejected (or: probability in MWI is incoherent).


