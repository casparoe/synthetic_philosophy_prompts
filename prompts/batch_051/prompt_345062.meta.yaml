  The argument:


  (1) In Everettian quantum mechanics there is no collapse: both terms of the superposition
  are equally real, and after the measurement there is a post-measurement observer
  in the up-branch and one in the down-branch. Each is a genuine future self of the
  pre-measurement observer.


