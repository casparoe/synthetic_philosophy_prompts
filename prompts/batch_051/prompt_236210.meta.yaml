  they didn''t, or the practice stops being arbitrary because it''s yoked to fairness
  or disrespect. We ended up wanting a definition that splits these things cleanly,
  or at least explains why they don''t split.


  I''d like you to act as an expert on Lewis convention and the evolution of norms.
  Start by brainstorming what you think the plausible ingredients of a convention
  are (arbitrariness among alternatives, coordination equilibrium, common knowledge,
  preference for conformity, social pressure, felt obligation, sanctions, etc.), then
  propose a working definition of "convention" in the Lewis-inspired sense. Run it
  through these test cases and tell me where it lands, where it surprises you, and
  whether you''d revise it:


  1. A law says drive on the right, with fines for driving left; almost everyone drives
  right because they expect others to, not just because of the fine.

  2. Two friends who always meet at the same bench every Sunday, without ever agreeing,
