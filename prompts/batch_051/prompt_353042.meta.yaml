  Rights as trumps (Dworkin): individual rights trump collective goals/utilitarian
  calculations. Side constraints (Nozick): constraints on action that may not be violated
  even to prevent other violations; they''re agent-relative. Instruments: rights are
  just shorthand for utility-maximizing rules (Bentham: "nonsense upon stilts"). The
  debate: if rights are only instruments or weighted interests, then a sufficiently
  large benefit can override them, and the protection becomes contingent. Constitutionally,
  many systems use proportionality/balancing, while absolute rights resist balancing
  (e.g., torture, slavery).


