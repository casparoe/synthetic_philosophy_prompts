  Kalai–Smorodinsky solution: Given a bargaining problem (S, d) where S is feasible
  set, d is disagreement point, with ideal point a_i = max {x_i : (x_i, x_{-i}) in
  S, x ≥ d}. The KS solution is the maximal point in S on the segment connecting d
  to a. Equivalently, it equalizes the proportional gains relative to the ideal point:
  the point x in S such that (x_i - d_i)/(a_i - d_i) is equal across i and x is Pareto
  optimal (on the Pareto frontier). Yes.


