  system that recursively calls copies of the same human — essentially a huge tree
  of humans each handling small subproblems with restricted context. It''s an idealized
  model of what could be done with amplification (iterated amplification). The idea:
  HCH might achieve superintelligence-like capabilities if recursion is deep enough,
  despite each node being just a human with limited context.


