  or just unexplored. And if two of these leaves can''t be separated by any concrete
  question — I suspect the Durkheimian and the catharsis view might collapse into
  each other — say so rather than inventing a question that only tests whether someone
  knows the vocabulary.


  The audience is a mixed group of theology nerds and anthropology nerds, so the answer
  options should be plain language and shouldn''t tip which answer feeds which theory.
  One diagnostic split I care about especially and haven''t seen handled well elsewhere:
  whether the victim''s innocence matters to the mechanism. Try to build the tree
