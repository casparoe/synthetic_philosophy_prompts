  I''m part of a reading group that''s spent the past few months on sacrifice and
  scapegoating, and the group keeps talking past each other because half of us mean
  by "guilt" an objective stain that can actually be handed off, and the other half
  mean a felt pollution that just gets expressed. I want to settle some of this by
  making a "which theory of the scapegoat do you actually hold?" sorting quiz for
  the group — one of those quizzes where people answer concrete case questions and
  get sorted into a position without ever seeing the labels. The point is to sort
  people by what they say about cases, not by which thinker they vibe with, so no
  question should mention Girard, Durkheim, substitutionary atonement, catharsis,
  or any other label. Each question should be a concrete scenario — a village loading
  its sins onto a goat and driving it out, a company firing one manager after a decision
  everyone had a hand in, a priest telling a woman her guilt has been transferred
  to a slaughtered lamb, a frat hazing one pledge so the rest of them bond, a crowd
  that turns on a single scapegoat and visibly relaxes afterwards — with two or three
  answer options that differ along the axes that actually matter: whether something
  real is transferred or only expressed, whether the victim has to actually be guilty
  or only believed guilty, whether the mechanism happens in the community, in the
  victim, or in each person''s feelings, and whether the ritual''s working and its
  rightness are separate questions.


