  show up as leaves are: a Girardian view that scapegoating actually works by discharging
  mimetic violence, whether or not we should keep doing it; a Durkheimian functionalist
  view that the real work of the ritual is producing solidarity and the language of
  transfer is just the idiom for it; a theological substitution view that guilt really
  is borne by the victim and that''s what makes the ritual effective; a psychological
  catharsis view that the only thing transferred is the participants'' felt relief;
  and an eliminativist view that talk of transferred guilt is confused and nothing
