  irrational, by (3). In the second case, the person avoids that particular violation
  only by having no precise degrees of belief about the proposition, but then their
  degrees of belief are incomplete; and a person cannot tell which propositions they
  need to withhold judgment about, since they cannot tell which of the propositions
  before them are the tautologies they fail to recognize.


  (7) So every actual person either violates the probability calculus or cannot be
  fully precise in the way the Dutch book framework assumes. Either way, no actual
