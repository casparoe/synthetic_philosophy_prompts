  A Dutch book is a set of bets such that each individual bet is fair, or better than
  fair, by the person''s own degrees of belief, but the bets jointly guarantee a net
  loss no matter how the world turns out.


  (2) It is a theorem that any set of degrees of belief that violates the probability
  calculus is open to a Dutch book.


  (3) Therefore, a set of degrees of belief is rational only if it satisfies the probability
  calculus.


  (4) The probability calculus requires that every logical truth receive probability
  1. So a person who assigns anything less than 1 to a tautology violates the calculus,
  even if the tautology is too complicated for that person to recognize as a tautology.


  (5) No human being is logically omniscient. For every actual person, there are tautologies
  too complex for that person to see as tautologies, and when such a person considers
  one of them, they will either assign it a degree of belief below 1 or assign it
  no precise degree of belief at all.


