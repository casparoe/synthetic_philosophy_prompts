  I am an undergraduate art history student currently taking a philosophy of art course
  whose final unit is on cultural property and appropriation, and I also work part-time
  as the student member of my city''s arts council, which awards public-art grants.
  The council meets monthly and reviews roughly a dozen proposals in an evening, about
  fifteen minutes each; the panelists are artists, community representatives, and
  one councilor, none of whom have any philosophical training, and every award is
  public money that can draw press attention and community complaints. We repeatedly
  stall on the same kind of case: a proposal that draws on forms, stories, styles,
  imagery, or music from a culture the artist does not belong to. The panel splits
  between "this is cultural appropriation, reject it" and "art has always borrowed,
  approve it," and the discussion goes nowhere because we have no shared procedure.


  Our course has been careful not to treat cultural appropriation as a single thing:
  it distinguishes at least three alleged wrongs — (1) misrepresentation that damages
  a group''s standing or credibility, (2) violation of a group''s legitimate authority
  over sacred, secret, or economically important heritage, and (3) a transfer of benefits
  in which the outsider captures the rewards (money, prestige, career advancement)
  while the community bears the costs or risks. My supervisor has asked me to turn
  this into a reusable, one-page decision procedure the panel can actually run on
  a proposal before the fifteen-minute discussion begins. I would like the procedure
  to be a checklist of questions to ask in order, with criteria for what counts as
  a sufficient answer to each, explicit instructions about where the procedure stops
  with a "no," and clear flags for the places where the question is one of values
  rather than facts and the full panel has to decide. The procedure should keep the
  distinctions in the theory while being usable by people who will never read the
  theory, and it should be honest about the cases it cannot settle.


  Then apply the procedure to three examples, showing exactly how the panel would
  work through them and what the procedure returns: (a) a non-Indigenous composer
  who incorporates a melody identified as sacred by an Indigenous community, with
  no consultation and no plans to share royalties; (b) a white American novelist who
  writes in the voice of a Mexican-American character, but who has worked with community
  readers and will list them in the acknowledgments; and (c) a proposed public mural
  by an artist from outside a neighborhood that uses the neighborhood''s own historical
  imagery, with the stated aim of honoring it, but without any local consultation.
  Please make at least one of the three a case where the procedure returns an answer
  the panel will not like, and end by saying explicitly what the procedure cannot
  do — what kinds of dispute it will not resolve and where the panel is simply on
  its own.


