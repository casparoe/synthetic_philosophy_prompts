  Bongard problems (Bongard, 1967/1970) are visual concept-learning puzzles: each
  consists of six left panels and six right panels; the task is to find the rule that
  separates all lefts from all rights. The left panels are positive examples of the
  rule, right are negative (or sometimes the rule "lefts are X, rights are not-X").
  They come from The Soviet psychologist Mikhail Bongard''s book "Pattern Recognition"
  (1967). These were used by Hofstadter in GEB (1979) as a microcosm of intelligence
  and concept formation. Hofstadter and collaborators discussed them a lot (e.g.,
  "Bongard problems" in Fluid Concepts and Creative Analogies). Key ideas:

  - There can be many rules consistent with any finite set of panels. Yet people usually
  latch on to a "natural" answer.

  - The rule can be simple or complex: "the lefts contain triangles" vs "the lefts
  contain exactly three distinct objects" etc.

  - Some Bongard problems are perceptually spurious vs conceptual.

  - "Bongard problems" have been used in AI/ML as few-shot concept learning benchmarks;
  some recent datasets contain generated Bongard-like tasks (e.g., Bongard-LOGO, Bongard-HOI,
  Bongard-OpenWorld). I should be careful about citing datasets—maybe avoid naming
  them, or describe without names.


