  "Two members of a reading group I sit in on spent most of the evening disputing
  what exactly Beauvoir is claiming in The Second Sex when she says, in effect, that
  one is not born but becomes a woman. Neither conceded anything, and I am now unsure
  which of them was right about what, so I would like the exchange reconstructed and
  judged.


  The first insisted that the claim is a proto-distinction between sex and gender:
  a child is born a female member of the species, and only later is made into a woman
  by upbringing, custom, and social expectation. From this she concluded that womanhood
  is a social product rather than a biological destiny, so no fact about anatomy can
  tell us what a woman is or must be. The second objected that this reading exaggerates
  the distance between the body and its meaning. Beauvoir, she said, does not treat
  the sexed body as inert material on which culture writes; she treats the body as
  a situation, so that being a woman is not a free-floating identity but the way a
  particular body is lived under meanings it has already been given. She added that
  the book is full of women''s bodily history — puberty, menstruation, pregnancy —
  precisely because the biological is always encountered through those meanings, never
