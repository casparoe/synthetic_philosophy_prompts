  to support a fairly specific set of claims. On his rendering, willing is essentially
  a condition of felt lack, and all lack is painful; so long as the will has an object
  it does not yet possess, we suffer. Satisfaction, by contrast, is merely the cessation
  of that lack — a negative or neutral state, not a positive good. And once a desire
  is satisfied, only two things can happen: either the will fastens on a new object,
  which means the return of pain, or it finds no new object, which is boredom. Hence
  life alternates between two forms of deprivation, with happiness reduced to the
  vanishingly brief moment of transition between a want and the next want. From this
  my friend drew the conclusion that a life organized around the pursuit of positive
  happiness is chasing an illusion, and that the only sensible aims are to quiet desire
  and, as far as possible, step off the pendulum altogether.


