  only on certain inputs (not just "can do" but "restricted to").

  3. Innateness/encapsulation: the blades are present at birth or develop on a fixed
  schedule, not built from general learning.

  4. Encapsulation/mandatoriness: modules run automatically and their internal operations
  are informationally encapsulated, like Fodor''s modules.

  5. Evolutionary argument: the collection was assembled by natural selection, each
  blade an adaptation to a recurring problem in the environment of evolutionary adaptedness.

  6. No domain-general reasoning: there is no central general-purpose processor/executive;
  the whole mind is just a bundle of modules.


