  Let me design the case carefully.


  The discursive dilemma (also called doctrinal paradox): A group of three judges
  must decide whether a defendant is liable. Liability requires two conditions (e.g.,
  breached contract AND contract was valid, or negligence and causation). Each judge
  votes on each premise and the conclusion, but majority on each premise can yield
  a conclusion that the majority individually rejects. Example:

  - Judge A: P true, Q true -> liable

  - Judge B: P true, Q false -> not liable

  - Judge C: P false, Q true -> not liable

  Majority: P true (A, B), Q true (A, C), so liable by premise-majority; but majority
  (B, C) votes not liable. This is the classic doctrinal paradox.


