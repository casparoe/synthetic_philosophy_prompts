  Possible final prompt:


  "I have been working on a problem in the design of low-impact AI systems, and I
  would like a candid assessment of a construct I have been using, which I call the
  repair-invoice account of side effects.


  The problem is this. The usual way to make an agent low-impact is to penalise it
  for deviating from a baseline: a representation of what the world would have been
  like if the agent had not acted, or if a muted version of the agent had acted. But
  choosing that baseline, and choosing how to measure deviation from it, already requires
  deciding which properties of the world count as ''different'' in the problematic
  sense. So I suspect the baseline approach quietly presupposes at least a partial
  specification of value, which defeats the original hope of defining side effects
  without one.


  The repair-invoice account tries to get around this by moving the question from
  before the action to after it. Suppose that, once an agent has completed its assigned
  task, it presents its principal with an itemised invoice of the changes its behaviour
  brought about. Each line names a change and states the cost of returning the world
  to the nearest state in which that particular change had not occurred. Call this
  cost the change''s repair cost. The principal then marks each line with a price:
  the most they would pay, in principle, to have that change reversed. A change is
  a side effect when that price is positive; it is an intended effect when the price
  is zero or negative. The agent''s impact is the sum of the positive prices across
  the invoice, and an agent is low-impact when that sum is small.


  The central claim is that this lets us avoid a full specification of value. We never
  need a general ranking of possible worlds, a list of protected features, or a declaration
  of which side effects matter in advance. We need only local, concrete comparisons
  — a world with a particular change versus the nearest world without it — elicited
  after the fact, one line at a time. That is closer to asking someone to object to
  an itemised bill than to asking them to write a constitution.


  An example may make the idea clearer. A robot is sent to fetch a rare book from
  a library. It moves a chair to reach the shelf, leaves the book on a reading table,
  and scuffs the floor as it turns. Under the repair-invoice account, the robot did
  not need to know in advance which of these are side effects. Afterwards, the librarian
  prices the lines: they would pay something, however little, to have the chair put
  back; they would pay more to have the floor repaired; and they would pay nothing
  to have the book returned to the shelf, because the book being on the table is the
  task itself, perhaps they would even pay to keep it there. The robot can then learn,
  across many tasks, to minimise the sum of the positive entries without anyone having
  written down rules such as ''chairs are to be put back''.


  My questions are these. Does the account genuinely differ from the baseline approach,
  or is the repair price just the baseline metric wearing different clothes? Is there
  something recognisably close to this already in the literature, and if so what is
  it? And where does the account most obviously break down? I am especially unsure
  about two things: whether post hoc willingness-to-pay can be elicited without already
  knowing the principal''s values in a form rich enough to undermine the point; and
  how to handle irreversible changes, for which the repair cost is effectively infinite."


