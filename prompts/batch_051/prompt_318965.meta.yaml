  ---


  I have been trying to make sense of the following question in low-impact AI: can
  an agent be made to avoid side effects without anyone first specifying, in general
  terms, which features of the world matter? My sense is that the standard approach
  cannot, because it defines a side effect as a deviation from some baseline, and
  choosing a baseline and a similarity metric is already a way of smuggling in a partial
  specification of value. I have been working with an alternative I call the repair-invoice
  account, and I would welcome a candid assessment of it.


  The account says: do not define side effects when the agent acts. Define them after
  the fact, by what the principal would pay to undo. Imagine that when the agent has
  finished its assigned task, it presents the principal with an invoice of the changes
  its behaviour brought about, each one costed at the price of returning the world
  to the nearest state in which that change had not happened. A change is a side effect
  just in case the principal would pay some positive amount to see it reversed; a
  change is an intended effect just in case the principal would pay nothing to reverse
  it (or would pay to keep it). The agent''s impact is then the sum of the positive
  undo-prices across all lines on the invoice, and the agent is low-impact when that
  sum is small.


  The central claim is that this lets us avoid a full specification of value. We never
  need a once-and-for-all ranking of possible worlds or a statement of which properties
  count. We need only a sequence of local, concrete comparisons -- between a world
  with some particular change and the nearest world without it -- and we elicit those
  comparisons from the principal after the fact, one change at a time. In that respect
  it is more like asking someone to itemise objections to a bill than asking them
  to write a constitution.


  Example: a library retrieval robot is sent to fetch a rare book. It moves a chair
  to reach the shelf, leaves the book on the reading table, and scuffs the floor...
  Under repair-invoice, the robot should not have had to know in advance which of
  these are side effects. After the fact, the librarian prices each line: the chair
  moved costs pennies to undo and would be paid for; the floor scuff is more expensive
  to restore; the book being on the table has a zero or negative undo-price because
  that was the point. The robot then learns to minimise the sum of the positive entries
  over many tasks, without anyone having written down "chairs should be put back"
  as a rule.


