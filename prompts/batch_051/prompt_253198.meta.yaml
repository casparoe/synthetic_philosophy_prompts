  Luminosity: Timothy Williamson, Knowledge and Its Limits (2000), chapter 4. A condition
  C is luminous iff for every case α, if C obtains in α then one is in a position
  to know that C obtains in α. Luminous conditions would be ones whose obtaining guarantees
  that one is in a position to know it obtains. Williamson argues no non-trivial condition
  is luminous; for any interesting condition, there''s a sorites-like sequence from
  a case where C clearly obtains to a case where it clearly doesn''t, and by a margin-for-error
  principle, if one is in a position to know C obtains, then C obtains in close cases.
  So if C were luminous throughout the sequence, it would spread to the end, contradiction.
  This doesn''t mean we can never know that C obtains; it means C''s obtaining doesn''t
  always put one in a position to know.


