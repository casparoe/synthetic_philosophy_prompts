  Domain: Unions, strikes, and the right to organize.


  Prompt: Describe that in contemporary debate the analogy "a union is a cartel" is
  commonly invoked by opponents of labor-law protections. The argument: a cartel is
  an agreement among sellers to fix the price of a commodity above competitive level
  by restricting supply; a union is an agreement among sellers of labor to fix the
  price of labor above competitive level by restricting the supply of work (strikes,
  closed shops); antitrust law condemns cartels, so the special legal immunities granted
  to labor organizations are anomalous — either cartel prohibition should extend to
  unions or the rationale for right to organize collapses.


  Then ask: audit this analogy. Give explicit mapping: what corresponds to the firms,
  the product, the price, the output restriction, the cartel agreement, the consumers,
  the deadweight loss. Then identify disanalogies: which features of a commercial
  cartel does the analogy quietly import that labor markets lack? Candidate issues:
  labor is embodied in persons and can''t be separated from the seller; workers face
  exit costs and are tied to the transaction beyond price; employer side frequently
  has market power (monopsony); cartel aims at profit for sellers, union is a democratic
  membership organization with internal voice and insurance functions; the buyer of
  labor is an organization with authority over the seller, whereas consumers of goods
  are not employers; unemployment is not the same as inventory; strikes impose standing
  costs on workers themselves (they forgo wages) unlike a cartel that cuts output
  to raise revenue; the goal isn''t merely price but conditions, dignity, voice, non-commodified
  dimensions. Also, the "right to organize" is understood as a rights claim by the
  sellers themselves, whereas cartel law governs firms.


  Then ask whether these disanalogies matter for the intended conclusion, and which
  ones don''t. Ask: does the analogy carry the conclusion that union protections are
  an anomaly, or does it presuppose that labor is a commodity and that competition
  is the baseline — and if that''s where the work is done, what does the analogy add?
  Could a better analogy exist (e.g., a cartel of consumers / a countervailing power,
  a professional association setting standards, a democratic bargaining coalition)?
  Finally: what would the employer''s advocate need to add to make the conclusion
  follow even if the disanalogies are granted?


