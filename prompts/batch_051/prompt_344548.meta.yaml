  Draft:


  I recently got promoted to manage a team of people I used to be peers with, and
  I''ve been leaning on Adam Smith''s Theory of Moral Sentiments to think through
  whether I''m being fair when I have to discipline someone or decide who gets a bad
  performance review. I''m in a reading group on Smith, and I wrote up my current
  "operating view" so the group can poke holes in it. But honestly I want a sharper
  audit than the group will give me.


  Here''s what I think I think:


  1. Sympathy is the whole engine of moral judgment on Smith''s view. I judge someone''s
  resentment (say) as appropriate when, imagining myself in their circumstances and
  history, I find I can enter into it — I''d feel a matching or fitting version of
  it. And I judge my own conduct by imagining how an impartial spectator would react
  to my motives and my situation.


  2. That impartial spectator is not some freestanding source of moral truth. It gets
  built from the outside in: I internalize the actual praise and blame of the people
  around me, then try to strip out their ignorance, partiality, and distance from
  the facts. What''s left is the "man within," but it''s made of social material.


  3. Even so, I want to be praiseworthy, not merely praised. When I hold back from
  padding someone''s review because I know my actual coworkers would approve, the
  thing I care about is that my conduct would be approved by the impartial spectator
  in light of the full facts — not just that my friends happen to cheer.


  4. Self-deception is deep and it''s chronic. I''m really good at rigging my own
  internal courtroom — finding the one spectator who shares my grievance, dressing
  up resentment as fairness. So in the moment I shouldn''t trust first-person verdicts;
  I should lean on general rules of conduct, the accumulated approvals and disapprovals
  of many spectators across many cases.


  5. A person who didn''t care at all about actual others'' actual opinions would
  be missing something human. I''m not willing to say actual praise and blame are
  just noise, even though they''re not the final standard.


  6. Outcome luck is inescapable and Smith concedes it. If I discipline someone and
  they fall apart afterward, my reaction is harsher than if the same decision had
  led them to bounce back and land a better job — even though the decision and my
  motives were the same in both cases. Smith famously says this irregularity is useful
  for society, but the impartial spectator corrects it only imperfectly.


  Go through these pairwise (or however you think best) and tell me which are in genuine
  tension and which only look that way. For each real tension, rank it by severity,
  say what specifically has to give, and what the cheapest fix is and what it costs
  downstream in the view. Don''t protect the view and don''t lecture me on Smith —
  I''m trying to figure out whether my operating picture is coherent or whether I''m
  smuggling in something Smith can''t give me.


  When you respond, start your first sentence with the bottom line — the overall verdict
  and the top tension — and then give the reasoning after, with no preamble and no
  restating of my list.


