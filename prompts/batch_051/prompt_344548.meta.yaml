  Smith''s commitments in Theory of Moral Sentiments:

  - Sympathy as mechanism: we judge others'' sentiments by imagining ourselves in
  their situation; when our sympathetic passion matches the other''s, we approve.

  - The impartial spectator: a person judges their own conduct by imagining how an
  impartial spectator would view it; conscience is the "man within the breast."

  - The actual spectator vs the impartial spectator: people care about actual praise
  and blame, but also praiseworthiness and blameworthiness; the impartial spectator
  corrects for actual spectators'' biases.

  - Self-deception: we tend to deceive ourselves about our own motives and the propriety
  of our own conduct, hence the need for general rules of morality derived from experience
  of what is approved/disapproved.

  - The desire to be loved and to be lovely (praiseworthy): love of praise and love
  of praiseworthiness.

  - Moral luck? Smith has discussion of remorse, and the "man of perfect virtue"?

  - The role of fortune: Smith discusses influence of fortune on moral sentiments
  — we judge actions partly by outcomes, and the impartial spectator corrects for
  this.


