  Fitch''s paradox: Knowability principle: for all truths p, possibly Kp (all truths
  are knowable). Fitch shows: assume p is an unknown truth: p & ¬Kp. If all truths
  are knowable, then this conjunction is knowable: possibly K(p & ¬Kp). But knowing
  a conjunction entails knowing each conjunct, so Kp & K¬Kp. And knowledge entails
  truth, so ¬Kp (from K¬Kp) while Kp. Contradiction. So there is no unknown truth;
  all truths are known. Thus knowability collapses to actual knowledge.


