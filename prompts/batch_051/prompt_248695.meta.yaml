  Write:


  "In a seminar on epistemic logic we have been working through Fitch''s paradox of
  knowability. The anti-realist begins from the modest-looking principle that every
  truth is knowable: for any proposition φ, if φ is true then it is possible that
  φ is known. Fitch''s derivation purports to show that this principle, together with
  the facts that knowledge distributes over conjunction and is factive, collapses
  the principle into the extravagant thesis that every truth is actually known. The
  proof runs as follows. Suppose there is a truth p that nobody knows; then the conjunction
  p and nobody knows that p is also true, so by the knowability principle it must
  be possible to know it. But knowledge of that conjunction would require knowledge
  of each conjunct. Knowledge of the first conjunct gives that somebody knows p, while
  knowledge of the second conjunct gives, by factivity, that nobody knows p — a contradiction.
  Hence there can be no unknown truth."


  "Please make a sustained argument for the following position. The anti-realist should
  restrict the knowability principle to Cartesian truths — propositions whose being
  known is not logically self-undermining. The Fitch conjunction is not Cartesian,
  because supposing it known leads immediately to contradiction; the restricted principle
  therefore never demands that it be knowable, and the paradox is blocked. Your task
  is not merely to state this restriction but to defend it. Show that the restriction
  is motivated by the anti-realist''s own understanding of truth as cognitively accessible
  rather than by an ad hoc desire to sidestep the proof, and explain how the restricted
  principle can still do the philosophical work — licensing the claim that no truth
  lies permanently beyond our cognitive reach — that the unrestricted principle was
  meant to do. Also address the strongest objection: that the restriction gerrymanders
  the principle by excluding exactly the truths that cause trouble, and quietly surrenders
  the universality that made the principle interesting. Assume classical logic throughout;
  do not evade the paradox by retreating to intuitionistic logic or by weakening knowledge
  to something non-factive."


