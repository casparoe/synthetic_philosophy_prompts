  Let me define two notions precisely, then find an interesting split.


  Definitions:

  - **Shutdown incentive (SI)**: the agent assigns high utility to the state of being
  shut down, so it might manipulate/force the operator to press the off button, or
  achieve the shutdown state via any means, not necessarily the button.

  - **Utility indifference / corrigibility (C)**: the agent treats the off switch
  as an instrument of the principal; it is indifferent between the button being pressed
  and not, in a way that it won''t act to cause or prevent it, and it won''t manipulate
  the button or the principal.


