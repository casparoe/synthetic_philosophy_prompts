  Key conceptual content of readiness-to-hand:

  - Being-in-the-world: Dasein''s everyday absorption in coping; equipment (Zeug)
  is encountered in use, not as object of observation.

  - Ready-to-hand (Zuhandenheit): the mode of being of equipment while it functions;
  it withdraws from explicit awareness; "the better the hammer works, the less you
  notice it."

  - Practical holism: a piece of equipment is what it is only within a nexus/workshop
  of references (materials, tasks, other tools, roles, purposes). The hammer refers
  to nails, wood, the project, the workshop.

  - Breakdown (conspicuousness, obtrusiveness, obstinacy): when equipment fails, it
  becomes present-at-hand (Vorhandenheit) as a mere object with properties; the world
  lights up, and the references become explicit. This is the moment where theoretical
  inspection arises; presence-at-hand is derivative from readiness-to-hand, not vice
  versa.

  - The tendency to read everything as present-at-hand is a bad philosophical habit;
  reification.


