  "Philosopher John Stuart Mill died in 1873, long before the two arguments that now
  structure academic debate about abortion were formulated. Judith Jarvis Thomson''s
  violinist argument defends the permissibility of abortion even if the fetus is granted
  full personhood and a right to life: a right to life, she argues, is not a right
  to use another person''s body, just as a kidnapped person would be entitled to disconnect
  from a violinist whose survival depends on their kidneys. The future-like-ours argument,
  associated with Don Marquis, runs the other way: killing is seriously wrong because
  it deprives a being of the future it would otherwise have, and a fetus has a future
  like ours, so abortion is prima facie seriously wrong even before any question of
  personhood is settled. Mill brings commitments that cut across this debate: the
  harm principle, a utilitarian account of value and of women''s subordination, and
  a suspicion of arguments that protect existing social arrangements by appeal to
  nature or intuition.


  Predict, as precisely as you can, where Mill would have landed had he encountered
  Thomson''s and Marquis''s arguments. Present your answer as a numbered list of exactly
  five items. Each item should be one or two sentences. Do not include an introduction,
  a conclusion, or any text outside the numbered list. Weight the list toward the
  places where Mill''s outlook would have made him resist both camps or reframe the
  dispute rather than simply pick a side."


