  "I am a journalist who writes about the conceptual foundations of machine learning,
  and while preparing a piece on how far modern systems actually embody Occam''s razor,
  I keep returning to a specific puzzle about the classic formal argument for it.


  The classic argument, as I understand it, is roughly this. Kolmogorov complexity
  measures the length of the shortest program that produces a given object. Solomonoff
  induction assigns each computable hypothesis a prior probability that decays exponentially
  in its Kolmogorov complexity, and then predicts by mixing over all computable hypotheses.
  Simplest hypotheses therefore dominate the prior, and the resulting predictor is
  universal in a striking sense: for any computable data-generating process, its expected
  cumulative prediction error is bounded by a constant that depends only on that process''s
  own complexity. On this picture, Occam''s razor is not a mere heuristic; it is close
  to an optimal inductive strategy whose only unavoidable cost is the complexity of
  the true explanation itself.


  The development that unsettles me is the now well-documented behaviour of heavily
  overparameterised neural networks. A network with far more parameters than training
  examples can be driven to fit the training set essentially perfectly, even when
  the labels have been randomised, yet on real data it frequently generalises well;
  in the ''double descent'' phenomenon, test error often improves again precisely
  after the model has crossed the interpolation threshold, in the regime where it
  has enough capacity to memorise. Read naively, the Solomonoff picture would treat
  such a model as enormously complex, and a fitted model that memorises noise would
  be exactly the kind of hypothesis the simplicity prior should punish most severely.
  But the generalising network seems not to be punished; its training procedure appears
  to be recovering genuine structure in data that, by any count of parameters, it
  should have been too complex to capture. I would like to know whether the Solomonoff/Occam
  argument survives this development, and which specific premise is under real pressure.
