  assumption that a model''s complexity, once it has fitted the data, is a reliable
  guide to generalisation; the assumption that the effective hypothesis is the fitted
  network rather than the whole training pipeline; or something else? Is there a repaired
  version — perhaps one that relocates simplicity to the algorithm or the training
