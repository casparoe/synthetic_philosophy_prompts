  not the entities or their intrinsic natures. So structural realism recommends that
  we be realists about structure and skeptical about the nature of the things that
  instantiate it.


  The epistemic form of structural realism, as defended by Worrall, says that the
  structure of the unobservable world is all we can know, with the nature of the relata
  remaining beyond our epistemic reach. The ontic form goes further and says that
  structure is all there is: the relata are eliminated altogether, leaving relations
  without relata. This is the natural endpoint of applying the pessimistic meta-induction,
  since once entity natures and even entities themselves have proved dispensable across
  theory change, we should drop them from our ontology and retain only structure.


  Ramsey sentences support structural realism by showing how a theory can be expressed
  purely in terms of the relations among its observations, quantifying over whatever
  it is that realizes those relations, without needing to name or describe the theoretical
  entities directly. The Ramsey sentence of a theory preserves its empirical content
  while remaining neutral about the nature of the unobservables. Since Ramseyfication
  shows that theoretical terms contribute only structure, and the pessimistic meta-induction
  shows that structure is what survives theory change, the ontic conclusion follows:
  there is no coherent role left for more than structure.


