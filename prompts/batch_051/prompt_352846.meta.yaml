  Stigler''s law: "No scientific discovery is named after its original discoverer."
  Popular understanding often treats this as a cynical claim about credit-stealing:
  the credit goes to famous people, or to the last person, or to whoever publicizes
  it. But the original paper is actually a self-referential joke/observation about
  eponymy, with the deeper point being about the sociology of science and the retrospective
  reconstruction of discovery. A common misrepresentation: treating it as a reliable
  empirical law that implies original discoverers are always wronged, or as a claim
  about deliberate misattribution, or that eponymy in science is systematically fraudulent.
  The actual Stigler passage frames it as a Mertonian self-confirming hypothesis,
  and he attributes it to Merton, making his own "law" an instance. Also the law is
  often misread as "no idea is ever named after anyone who merits it" or "credit always
  goes to the wrong person." The fairer reading: named eponyms are normally attached
  to someone other than the person who first articulated the discovery, because the
  act of first articulation is not a well-defined historical event and because recognition
  depends on many social factors; it''s about the gap between "first statement" and
  "recognition as a discovery."


