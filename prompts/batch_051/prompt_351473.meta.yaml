  The puzzle is the neo-Malthusian episode and specifically the Simon–Ehrlich wager.
  Here''s the episode as I understand it: in 1980 Julian Simon, who thought rising
  populations and resource use would drive substitution and falling scarcity, publicly
  challenged doomsayers to bet on it. Paul Ehrlich (author of The Population Bomb)
  and two colleagues took the bet. They chose five industrial metals—copper, chromium,
  nickel, tin, and tungsten—and wagered that their inflation-adjusted prices would
  rise over the next decade, on the neo-Malthusian view that growing population and
  demand would outrun a finite resource base. The decade ran, the prices of all five
  fell in real terms, and Simon won the wager. Some people treat this as a clean empirical
  refutation of neo-Malthusian scarcity predictions. Others say it only shows that
  the time horizon was wrong, or that the Malthusian claim was protected by auxiliary
  assumptions about technology, substitution, and markets, and that the underlying
  mechanism may still assert itself later. That is the ''right but early'' problem.


  I want you to analyze the Simon–Ehrlich wager as a case study in falsification and
  rescue. Please don''t write a debate speech for one side. Instead, I''d like a disciplined
  case analysis that runs in both directions, using the episode to test the theory
  and the theory to illuminate the episode. In particular:


  1. Reconstruct what exactly is being tested. Distinguish the narrow bet (five metals,
  ten years, real prices) from the broader neo-Malthusian claim. A wager of this form
  tests a conjunction, not a single hypothesis; what has to be true about substitution,
  extraction costs, demand, and the price mechanism for the bet to track the Malthusian
  mechanism at all?

  2. Using the distinction between core claim and auxiliary hypotheses (in a Lakatosian
  or Duhemian spirit), lay out the rescues available. Which moves by a neo-Malthusian
