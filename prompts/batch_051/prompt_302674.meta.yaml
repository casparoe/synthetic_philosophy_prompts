  between being a heap and not being one—is overwhelmingly compelling when considered
  case by case. Both sides also end up rejecting the tolerance principle in its universal
  form, but for different reasons.


  Epistemicists hold that the semantics of vague predicates is classical. There really
  is a sharp cutoff for "heap," but we cannot know where it is: knowledge requires
  a margin for error, and any belief about the exact cutoff would be too close to
  cases that would falsify it under slight variation. Borderline claims are therefore
  either true or false, and our inability to say which is a purely epistemic limitation.
  The cost is a commitment to semantic facts that are in principle beyond our reach
