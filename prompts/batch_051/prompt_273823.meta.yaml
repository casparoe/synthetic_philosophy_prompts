  Accuracy check: In Bayesian networks, the causal Markov condition says variables
  are independent of non-effects given direct causes (parents). Faithfulness says
  the only conditional independences in the distribution are those entailed by the
  Markov condition applied to the true graph. Minimality: the true graph is a minimal
  graph satisfying the Markov condition w.r.t. the distribution—no edge can be removed
  while preserving Markov property. Faithfulness implies minimality (for DAGs?) but
  not conversely. The philosophical question "why do minimal Bayes nets track causation?"
