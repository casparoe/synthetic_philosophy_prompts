  Arrow''s impossibility theorem: for three or more alternatives, no social welfare
  function can simultaneously satisfy: unrestricted domain (all preference profiles
  allowed), non-dictatorship, Pareto (unanimity), independence of irrelevant alternatives
  (IIA), and transitivity (rational/ordering). A voting rule/aggregation function
  fails at least one.


  Classroom activity idea:

  - Setting: intro seminar on social choice / econ-philosophy crossover, ~20 students,
  50-70 minutes.

  - Game: "Constitution Fair" — groups of 4-5 each run a mini-society that must choose
  among three alternatives (e.g., what to do with a shared budget: build a library,
  a gym, or a garden; or which of three room configurations for a dorm commons). Each
  group writes a rule for aggregating any preferences into a single ranking. Then
  the facilitator acts as a "preference troll" or "citizenry" that feeds the group
  preference profiles, one citizen at a time, that attempt to break the rule. If the
  rule, applied to 3-5 citizens'' rankings, violates one of the conditions, the group
  must either patch the rule or declare which fairness condition they''re willing
  to give up. Round structure: groups propose rules; facilitator runs a fixed "attack
  deck" of profiles; groups discover each patch costs them something (e.g., to avoid
  a cycle they add a dictator; to avoid a dictator they declare some preference profiles
  inadmissible "we won''t allow people who rank X last"; to preserve IIA they violate
  Pareto, etc.). At the end, no group has a rule satisfying all four/five; the facilitator
  names Arrow''s theorem.

  - Materials: index cards for preference rankings, a "constitution sheet" for each
  group, maybe a chart of the conditions in plain language (but not the theorem).

  - Payoffs: no real money; group with the longest-surviving rule gets a small prize
  (e.g., choice of debrief snack) — or just bragging rights; maybe "votes" as tokens.

  - Debrief: map each failure to a condition; note the activity can''t reproduce the
  full formal theorem (infinite domain, all profiles) but reproduces the trade-off''s
  feel; note that real voting systems choose which condition to relax (plurality violates
  IIA, ranked-choice/instant runoff can have non-transitivity/monotonicity issues,
  etc.).

  - Predictable failures: groups write rules that are vague ("choose the option most
  people like") and can''t be applied to weak orderings; groups try majority rule
  and get a Condorcet cycle quickly; one group sneaks in a dictator ("in case of tie,
  the oldest member decides") and doesn''t see it as a dictatorship; groups try to
  restrict domain by saying "we''ll throw out preferences that are single-peaked"
  without realizing it; the facilitator''s attack deck produces objections ("that
  would never happen with real voters") — handle by pointing out the profile is possible
  and the rule is supposed to handle all possible citizens.


