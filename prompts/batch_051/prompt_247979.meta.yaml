  Thomson''s lamp argument: A lamp is switched on at t=0, off at t=1/2, on at t=3/4,
  etc. At t=1, is the lamp on or off? It can''t be on (because every on switch is
  followed by an off switch), and can''t be off (because every off switch is followed
  by an on switch). Therefore the lamp is neither on nor off, contradiction, so the
  supertask is impossible. Actually Thomson concluded that the notion of a supertask
  is logically impossible/contradictory. But many philosophers replied: the description
  simply fails to specify the state at t=1; there''s no contradiction, just an incomplete
  specification. You can define other supertasks with well-defined terminal states
  (e.g., a ball moving continuously). Benacerraf''s reply: the premises determine
  the state at every time before t=1 but not at t=1; no contradiction.


  So a subtle-confusion prompt could be: "Thomson''s lamp shows that supertasks are
