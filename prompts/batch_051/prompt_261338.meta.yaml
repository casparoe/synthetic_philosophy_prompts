  and we''re physical beings with causal access only to physical things, then how
  can we know mathematical truths? The horns: (a) keep platonism and accounts of truth
  (Tarskian semantics: "2+2=4" is true iff the number 2 bears + to...), but then knowledge
  becomes mysterious because no causal connection; (b) adopt a causal theory of knowledge
  (knowledge requires causal contact), but then mathematical knowledge seems impossible
  / platonism must go. The teaching plan: order — first students need to see platonism''s
  semantic appeal (uniform truth conditions), then the causal constraint on knowledge,
  then the incompatibility. Misconceptions: (1) thinking Benacerraf is arguing that
  we can''t know math / skepticism; (2) thinking the dilemma refutes platonism rather
  than shows a tension with a certain epistemology; (3) confusing the identification
  problem (Benacerraf''s earlier "What Numbers Could Not Be") with the access problem;
  (4) thinking the causal theory of knowledge is defensible and so the dilemma is
