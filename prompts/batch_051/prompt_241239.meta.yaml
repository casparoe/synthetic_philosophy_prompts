  Frankfurt''s original: Black wants Jones to perform action X. Black waits until
  Jones is about to decide, and if Jones shows signs he will do otherwise, Black intervenes
  (with a chip/coercion/threat) to ensure X. If Jones does X on his own, Black doesn''t
  intervene. Jones couldn''t have done otherwise because Black would have forced him.
