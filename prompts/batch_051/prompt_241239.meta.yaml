  threats leave the agent able to do otherwise (refuse and suffer). So PAP says alternative
  exists, just costly. Unless Black physically and unavoidably prevents non-X. To
  physically prevent on the basis of public behavior, there must be an observable
  sign before Jones does the non-X, and Jones could "do otherwise" by not exhibiting
  the sign or by thwarting the mechanism. Since no perfect prediction, the mechanism
  can fail. Thus no guarantee of no alternative.


