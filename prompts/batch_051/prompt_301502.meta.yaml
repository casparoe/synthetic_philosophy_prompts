  when they diverge. In human contexts, people can state reasons and preferences that
  are authoritative in some sense; a pure behaviorist account would ignore them. Is
  respect for self-report non-negotiable or optional? This is a big camp issue: behaviorists/revealed-preference
  tradition vs. mentalist/self-report-respecting views.


  9. The "values vs. tastes" or "preferences about preferences" issue: second-order
  preferences, meta-preferences (e.g., someone wants to want to exercise). An adequate
  theory must say whether it infers first-order preferences only, or also higher-order
  attitudes, and how it handles conflicts between them (a person''s all-things-considered
  preference may differ from their first-order impulse). Non-negotiable maybe: it
  must not conflate an urge with an endorsed preference.


  10. Privacy/strategic behavior: if people know their preferences are being inferred,
  they may behave strategically to manipulate the inference. A theory must be robust
  to strategic distortion or specify conditions under which behavior is non-strategic.


