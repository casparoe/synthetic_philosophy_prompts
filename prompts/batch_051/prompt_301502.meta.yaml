  Key issues in inferring preferences from behavior:


  1. The underdetermination problem: behavior is consistent with many reward functions.
  A theory of preference inference must handle this — say what it does when multiple
  preferences explain the same behavior. Non-negotiable: it must acknowledge and cope
  with underdetermination rather than pretend to recover the unique true reward.


  2. The distinction between preferences, beliefs, and constraints/abilities. Observed
  behavior is a joint product of what the agent wants, what it believes about the
  world/options, and what it is able to do. A theory must not attribute to preference
  what is better explained by false belief or limited capability. Classic case: a
  person avoids a food not because of preference but because they (falsely) believe
  it contains an allergen; a person fails to pursue an option because of cost/constraint.
  Requirement: the inference procedure must have some way to model beliefs and feasibility
  constraints separately, or at least state the conditions under which preference
  can be read off behavior.


  3. The rationality assumption: standard revealed preference assumes the agent chooses
  what maximizes preference given beliefs/constraints. But actual human behavior is
  noisy, habitual, time-inconsistent, framing-dependent. A theory must say how it
  handles deviations from perfect instrumental rationality — whether it treats noise
  as part of the choice model, whether it can infer stable preferences from inconsistent
  choices, and what it does when choices and stated preferences conflict.


  4. Temporal structure: preferences over sequences vs. instantaneous; discounting;
  changing preferences; the "agent''s current self" vs. "future selves" — should a
  theory infer a single preference ordering or a time-indexed family? Non-negotiable:
  it must not silently assume stationarity.


  5. Constructed vs. discovered preferences: in the Kantian/behavioral econ sense,
  preferences may not pre-exist the choice context; they may be constructed in response
  to framing, defaults, anchors. A theory must distinguish stable underlying preferences
  from constructed ones, or explain how inference works when preferences are context-sensitive.
  This is a real desideratum; some camps would say it''s negotiable/controversial
  (some would insist preferences are stable and revealed; others would say context-dependence
  is pervasive).


  6. Normative vs. descriptive: Is it inferring what the person actually wants (descriptive)
  or what they would want under idealized conditions (normative) — e.g., informed
  desires vs. actual desires. A theory must specify which target it''s inferring,
  because behavior under false beliefs and temptation may reveal actual wants but
  not ideal wants. The evaluative target matters for an AI assistant acting on inferred
  preferences: whose preferences, when?


  7. Human reward vs. policy: In inverse RL, one can infer a reward function or just
  imitate the policy. For a theory of preference inference, does it need to recover
  preferences (which support generalization to new situations) or merely predict behavior?
  Non-negotiable maybe: it must recover preferences that transfer/generalize to novel
  choice sets, not merely mimic observed choices. This is the "reward identification
  vs. imitation" distinction. That''s a strong requirement: an adequate theory must
  produce something that supports counterfactual choice — how the person would choose
  among options they''ve never faced — rather than just reproducing past choices.


  8. Handling of expressed/communicated preferences: combining behavioral evidence
