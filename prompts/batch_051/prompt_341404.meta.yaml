  we cannot infer women''s nature from their observed behavior under conditions of
  oppression because they''ve never been allowed to develop freely. He famously says
  (paraphrase): what is now called the nature of women is an eminently artificial
  thing—the result of forced repression in some directions, unnatural stimulation
  in others. Also the general point: "Of all difficulties that obstruct the progress
  of thought... the greatest is this: habit... custom." He also says the subjection
  of women is an isolated relic of the law of the strongest. Key argument: anyone
  who appeals to the "nature" of women claims to know from observation, but the environment
  has never been natural; before we can know women''s nature, we must let them try
  all pursuits. He also anticipates: men say women are made for domesticity by nature;
  but the same was said of slaves? Maybe.


