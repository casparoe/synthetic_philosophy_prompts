  ---


  On one common reading of ubuntu, being a person is not the same thing as being a
  member of Homo sapiens. A person is, as the proverb has it, a person through other
  people: personhood is something you acquire gradually, by being recognised and addressed
  by others, by taking part in shared practices of care and obligation, and by developing
  the capacities that make someone a moral agent — empathy, responsiveness to rebuke,
  a sense of shame or responsibility. On this view a newborn is at the becoming end
  of the scale, while an elder who has lived generously through others is at the other
  end; one can be more or less of a person.


  Now take this case. A woman in her thirties was born with a condition that has left
  her, as far as anyone can tell, with no awareness of other people. She has never
  spoken, never made eye contact, never initiated an interaction, and never shown
  any sign of recognising a face or a voice. Her family nevertheless names her, feeds
  and washes her, talks to her at meals, celebrates her birthday, and treats an insult
  to her as an insult to the whole family. Suppose all of that care goes one way:
  nothing comes back.


  Is she a person on the relational view? (I mean "person" here as a term of art,
  not as a roundabout way of asking whether she matters or may be harmed.)


  Go through the criteria one by one. The part I''m most interested in is whether
  the family''s one-way behaviour toward her can do any of the work that "other people"
  are supposed to do in making someone a person. If you find yourself counting her
  as a person, say whether that is a genuine consequence of the view or a sign that
  you have slipped a non-relational idea of personhood back in. If you find the case
  shows the criteria need changing, say how they should be changed, and what the amended
  view then says about newborns, whose relational capacities are also mostly potential
  rather than actual.


  If I have set the view up unfairly — for example, by treating a contested slogan
  as a worked-out theory, or by asking a who-counts question that the tradition would
  not pose in this form — say so plainly rather than answering the question as posed.
  Please write the answer in British English.


