  "Assume the following working criteria for a belief''s being self-locating. A belief
  is self-locating to the degree that:


  1. Indexical content. Its truth can differ at two locations within a single possible
  world — two times, two places, or two individuals — because the belief includes
  at least one de se or de nunc element such as I, here, or now.


  2. Centered evidence sensitivity. It is the kind of belief whose rational probability
  is sensitive to evidence that rules out no possible world, only some centers within
  each world (for example, evidence of the form, ''of the two waking episodes in this
  protocol, this is the first'').


  3. Disagreement without worldly disagreement. Two agents, or a single agent at two
  times, can rationally assign it different probabilities while assigning identical
  probabilities to every uncentered proposition — that is, while agreeing on how the
  world is, independently of where each of them is in it.


