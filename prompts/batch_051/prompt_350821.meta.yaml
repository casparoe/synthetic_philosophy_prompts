  The conceptual structure: The Principle of the Identity of Indiscernibles (PII):
  no two distinct things are exactly alike in all qualitative respects; if a and b
  share all their properties, then a = b. Black''s thought experiment: a universe
  containing nothing but two iron spheres of exactly the same size, shape, composition,
  etc., two miles apart. Intuitively there are two distinct objects, yet they share
  all qualitative properties (each is iron, spherical, one mile from an identical
  sphere, etc.). So PII fails as a necessary truth, or at least is challenged.


  The pedagogical dependencies: distinguishing "qualitative properties" vs "relational
  properties" vs "individual essence/thisness" (haecceity); distinguish numerical
  identity from qualitative identity; distinguish PII as necessary vs contingent truth;
  distinguish reduplication arguments (every property of a is a property of b, so
  they''re one thing?) Actually Black''s argument: if the universe is symmetrical
  and each sphere has exactly the same description, what could make them two? The
  description of the universe doesn''t pick out one sphere vs the other ("there is
  a sphere left of another" or introduce coordinate names?). Misconceptions: students
  may think the spheres differ by their spatial positions (that''s a relational property,
  and "being two miles from the other" is shared by both; "being at position p1" vs
  "p2" may not be qualitative if positions are named by pure place in absolute space,
  but in a symmetrical universe no non-qualitative way to label them). They may think
  "there are two spheres" is itself a property they don''t share? Actually "being
  one of the two spheres" is shared. They may think difference is primitive, i.e.,
  haecceities, or that "this/that" indexical reference distinguishes them. Misconception:
  conflating the spheres being qualitatively indiscernible with their being numerically
  identical; or thinking identity of indiscernibles is about our inability to tell
  them apart (epistemic) rather than a metaphysical claim. Another: thinking the spheres
  differ because they are composed of different parcels of matter — but is "being
  composed of this parcel" a qualitative property? This leads to substance/matter
  and the bundle theory. Also the "one sphere is to the left of the other" — many
  students think this is a property only one has (being left). But in the symmetric
  universe, left/right requires orientation; each sphere bears the relation "two miles
  from the other" to the other, and both instantiate the relational property "being
  two miles from an iron sphere." The relation is symmetric, not distinguishing. So
  there''s no irreflexive relation holding in only one direction... Actually Black
  sets them two miles apart in an otherwise empty space; without an observer or an
