  Key Smith views on empire/colonies that I''m confident about:

  - In Wealth of Nations Book IV, ch. 7 ("Of Colonies"), Smith criticizes the mercantile
  system''s monopoly of colonial trade; argues that the prosperity of the colonies
  comes from free land and liberty, not from the mother country''s management; that
  the monopoly raises merchants'' profits at the expense of the public; that Britain
  bears the cost of defending the colonies; and that the empire is more a project
  than a reality.

  - He famously proposed that either the colonies should be fully integrated into
  the British state with representation proportional to their contribution, or Britain
  should voluntarily part with them in friendship.

  - He was skeptical of the benefits of monopoly and thought free trade with colonies
  would be more beneficial.

  - He also discussed the East India Company, arguing that merchant companies are
  unsuited to be sovereigns because their interests (profit) conflict with the interests
  of the governed; their government in Bengal was corrupt and ruinous (Book V, and
  Book IV ch. 7''s discussion of India).


