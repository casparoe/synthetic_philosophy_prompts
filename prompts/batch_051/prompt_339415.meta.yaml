  Draft:


  "For a workshop on collective epistemology, I''m writing up my position on unilateral
  decision-making in groups, and I would like a consistency check before I circulate
  it. My target is the situation where any member of a group can, on her own, bring
  about some outcome for everyone (imagine several labs independently able to publish
  a dangerous method, or several countries able to attempt first contact), and where
  there is no binding group decision procedure. I accept (1)-(6) below, each stated
  as precisely as I can make it.


  (1) The unilateralist''s curse is real: when each member acts iff her own expected-value
  estimate for the shared action is positive, a group can end up performing an action
  that the majority—indeed, the median member—would reject, simply because the most
  optimistic members move first.


  (2) The moving agents are not, or not typically, failing by their own lights. The
  defect is one of aggregation across the group''s scattered judgments, not of individual
  instrumental rationality.


  (3) The right individual rule in such settings is conformity: one should act only
  if one judges that the group''s considered view, if its members were polled under
  good deliberative conditions, would endorse the action. One''s own positive expected
  value is not by itself a license to act.


  (4) I am otherwise an epistemic individualist. My credences are answerable to evidence,
  not to head counts; the bare fact that others disagree gives me no direct reason
  to move my credence, though it may prompt me to look for evidence I have missed.


  (5) The act/omission distinction cannot do the needed work here. Declining to act
  can itself be a unilateral intervention with irreversible, widely distributed effects,
  so "when in doubt, don''t act" is not a defensible default; the conformity test
  must cut symmetrically against both acting and refraining.


  (6) In moral uncertainty, the correct decision rule is to maximize expected choice-worthiness:
  always choose the option with the highest expected value across the moral theories
