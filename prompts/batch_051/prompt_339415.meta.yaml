  epistemology, risk-taking, and moral uncertainty, with views that interact with
  the unilateralist''s curse.


  Possible commitments:


  1. Re the unilateralist''s curse itself: I think the unilateralist''s curse is best
  understood as a voting/aggregation failure, not as an irrationality on the part
  of any individual actor. (i.e., each actor is individually rational given their
  evidence, but the collective outcome is bad).


  2. I hold that the right response is a principle of conformity: in unilateralist
  scenarios, an agent should act only if they think a majority (or perhaps the median)
  of the group''s deliberators would favor acting. Deference to group judgment.


  3. I also believe in epistemic modesty / the "equal weight view" in peer disagreement:
  when you discover an equally informed peer disagrees, you should move substantially
  toward their view. (This seems to support conformity.)


  4. But I take a hard line against "groupthink" / consensus requirements in high-stakes
  science and innovation. I think there are cases where an individual scientist or
  entrepreneur should proceed even when most of her peers think it''s a bad idea,
  as long as she honestly believes the expected value is positive — that''s how paradigm
  shifts happen. (This seems in tension with 2.)


  5. I accept the standard expected-value framework for decisions under risk: an agent
  should choose the act with the highest expected value relative to her own credences
  and values. And I think no one has an obligation to defer to others'' credences
  just because they are others''. (This may conflict with 2, but maybe 2 is a special
  norm for unilateralist cases — an apparent tension that dissolves if you distinguish
