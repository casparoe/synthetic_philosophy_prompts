  a pathogen, start a risky project). If each uses their own judgment with a simple
  rule "act if expected value > 0 (or above my personal threshold)", then even when
  the average judgment is that the action is bad, the most optimistic member acts,
  and perhaps many act, producing outcomes the group as a whole would reject. Proposed
  solution: principle of conformity—act only if you believe the group consensus would
