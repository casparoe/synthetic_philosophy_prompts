  6. I think the curse is symmetric with respect to act and omission: deciding not
  to act unilaterally can also be a unilateral decision with irreversible effects,
  so a "default to non-action" bias is not principled. (This is a nice point: the
  curse is often framed as action bias, but omission can be just as bad, e.g., not
