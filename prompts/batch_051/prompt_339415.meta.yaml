  The unilateralist''s curse: a concept from Bostrom et al. about situations where
  multiple actors can each take some unilateral action, and if they act on their own
  judgment, they might all act because each thinks it''s fine, but the group would
  prefer not all to act. The curse is that if each person''s probability that the
  action is good is above the threshold for acting individually, they''ll all act,
  even though collectively they''d only want some to act. This is about group epistemology
  and coordination. Could create a set of commitments around this.


  Commitment races: e.g., racing to commit to a course of action before others, strategic
  commitment, burning bridges, first-mover commitment. Related to Schelling, commitment
  tactics, precommitment in games. Prompt type "state set of commitments and ask whether
  they hang together" could be about someone''s views on commitment races, rational
  choice, etc.


