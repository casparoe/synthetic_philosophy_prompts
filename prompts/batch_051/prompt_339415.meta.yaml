  (a) The so-called unilateralist''s curse is a real phenomenon: when each member
  of a group acts iff her own estimate of the expected value of the shared action
  is positive, the group can reliably take actions the median member would reject,
  because the most optimistic members act unilaterally.


  (b) The curse is best characterized as a failure of aggregation across the group''s
  distributed judgments, not as a failure of individual rationality; each member who
  acts is, by her own lights, doing exactly what expected-value reasoning recommends.


  (c) The correct remedy is a principle of conformity: in unilateralist cases, one
  should act only if one believes the group''s judgment, if polled under good conditions,
  would endorse the action. One is not entitled to act merely because one''s own expected
  value is positive.


  (d) In ordinary individual choice, the right decision rule is maximize expected
  value relative to your own credences and values. No general principle requires you
  to defer to the views of others merely because they disagree with you.


  (e) In high-stakes science and entrepreneurship, I reject consensus requirements.
  A competent agent with a considered minority view may permissibly proceed even when
  most peers think she should not; deference to majority opinion would institutionalize
  conservatism and filter out exactly the minority views that drive paradigm shifts.


