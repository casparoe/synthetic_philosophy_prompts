  Question: Explain Nozick''s tracking analysis of knowledge, making clear how its
  two subjunctive conditions are relativized to methods. Then use a concrete example
  to show how the tracking theorist argues that knowledge is not closed under known
  entailment. Finally, state the strongest objection a defender of epistemic closure
  could press, and sketch how the tracking theorist might begin to answer it.


  Student answer: Nozick''s idea is that knowledge requires not just true belief but
  belief that tracks the truth. Tracking is spelled out by two conditions. Sensitivity
  says: if p had been false, the subject would not have believed p. Adherence says:
  if p had been true, the subject would have believed p. Both conditions must be evaluated
  relative to the method the subject actually used, not some other method, because
  otherwise the account punishes subjects for using a generally reliable method in
  an unusual world. The standard illustration is the brain-in-a-vat. I know I have
  hands, and I know that having hands entails that I am not a brain in a vat. Yet
  I do not know that I am not a brain in a vat, because my belief in that conclusion
  fails adherence: in the nearest worlds where I am not a brain in a vat, my hand-like
  experiences are still caused by the vat, so I still believe I have hands. Since
  the conclusion fails to track, knowledge is not closed under known entailment. This
  shows that knowledge is not closed under multi-premise entailment, though the tracking
  theorist can leave single-premise closure intact. The strongest objection to this
  is that rejecting closure makes it mysterious how deduction from known premises
  could ever yield new knowledge: if I know the premises and know that they entail
  Q, how could I fail to know Q merely by deducing it? The tracking theorist''s reply
  is to stress that deduction changes the method in play, and that the deduced conclusion
  must track the truth under the deductive method, which skeptical conclusions will
  not.


