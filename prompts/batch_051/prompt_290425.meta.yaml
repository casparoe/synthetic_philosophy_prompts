  Draft:


  ---


  I am a student in a philosophy of social science course, and we have been discussing
  whether talk of "national character" is coherent and whether it is ever acceptable
  to generalize about peoples. I have been collecting my own reactions to a series
  of cases, and I would like to know what principle, or small family of principles,
  best captures them — and whether some of my verdicts have to go.


  Here are the cases and my verdicts.


  (1) My lecturer reports a large cross-national survey showing that, on average,
  respondents from Country A score somewhat higher on a well-validated measure of
  conscientiousness than respondents from Country B, while the within-country variation
  is much larger than the between-country difference and the distributions overlap
  heavily. I take this to be a respectable empirical claim about a real but modest
  aggregate difference, useful for comparative social science but nearly useless for
  predicting any particular person.


  (2) A friend says, in casual conversation, "Swedes are reserved." I accept this
  as roughly true and do not feel it needs the machinery of a survey to be legitimate.
  At the same time, I would object if she used it to decide how a particular Swedish
  job applicant would behave in an interview.


  (3) A politician says of a southern European people that they are naturally warm
  and expressive, that it is "in their blood." I regard this as both false and objectionable:
  it treats a loose pattern of behavior as an inherited essence.


  (4) An anthropologist I read refuses to make any cross-cultural generalizations
