  give you knowledge about this individual, only about the reference class they happen
  to fall into.

  (2) The sensitivity account: evidence is only good enough if your verdict would
  have been different had the defendant been innocent; market-share evidence is held
  fixed whether or not the defendant caused the accident, so it isn''t sensitive to
  the facts of the case.

  (3) The normic-support account: legal proof needs evidence that makes the defendant''s
  innocence a special, abnormal occurrence in need of explanation; a statistic makes
  innocence one of the cases the statistic itself predicted, which is perfectly normal.

  (4) The explanationist account: factfinders settle cases by selecting the best explanation
  of the evidence, and a naked statistic doesn''t explain anything about how this
  deed happened—it''s not a story about the defendant''s conduct at all.


  I have a feeling I''m missing at least one account that''s genuinely different from
  these, not a rewording or a mix of them—maybe something about the state''s duty
