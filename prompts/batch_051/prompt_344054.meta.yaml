  which patients can identify noxious stimuli as painful, distinguish sharp from dull,
  locate them, but show no pain affect: no withdrawal, no distress, no motivation
  to stop the stimulus. They may even laugh. Grahek''s "Feeling Pain and Being in
  Pain" discusses this. Key philosophical issue: does pain asymbolia show that the
  unpleasantness/badness of pain is separable from the sensory-discriminative component?
