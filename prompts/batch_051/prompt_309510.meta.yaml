  a million dollars tomorrow morning if, at midnight tonight, you genuinely intend
  to drink a nasty but harmless toxin tomorrow afternoon. Crucially, you don''t have
  to actually drink it to collect — the machine just scans your brain at midnight.
  You know that tomorrow afternoon, once the money''s in your account, you''ll have
  zero reason to drink the stuff, and you won''t. So at midnight it seems impossible
  to form the intention honestly: you can''t intend to do what you know you won''t
  do. And yet if you can''t manage it, you walk away a million dollars poorer for
  want of a mere mental state.


  Here''s my conflict. I''m very attracted to the clean consequentialist picture:
  a rational agent at each moment does whatever has the best expected consequences,
  and intentions are just an internal summary of what you expect to do; they inherit
  their rationality from the actions they point toward. On that picture, intending
  to drink the toxin tomorrow would be irrational, because drinking it would be irrational,
  and the fact that you''d miss out on the money is just tragic, not a flaw in the
  theory. But I also can''t shake the intuition that this is exactly backwards: that
  the rational person gets rich! There seems to be something important about commitment,
  or about mental acts being directly useful, that the clean picture erases. It feels
  like a real fact about agency — not a heuristic glitch — that you should be able
  to sell a future intention, or at least that a decision theory that says you''re
  stuck losing the money is missing something.


  So my question isn''t ''who wins.'' I want to know what a negotiated settlement
  looks like. If the consequentialist picture is right, what exactly is the intuition
  doing — is it a scope error, a confusion between being unable to intend and being
  unwilling to change your own incentives, a sloppy reading of ''intend''? What would
  I have to give up to bite that bullet, and is it worth it? If the intuition is right
  and commitment has independent rational force, what does the theory have to look
  like — do we allow rational intentions that point at irrational actions, do we need
  a richer account of self-binding and resolute choice, and do we open the door to
  rational self-deception? Or is there a reading on which both survive: maybe the
