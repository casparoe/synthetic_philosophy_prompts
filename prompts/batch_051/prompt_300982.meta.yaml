  ---


  I am a self-taught software engineer, with no academic background in philosophy
  or in the theory of machine learning; I work mostly on systems that have to keep
  running: modules, contracts, tests, refactors, build pipelines, on-call runbooks,
  and the slow accumulation of technical debt. Over the past year I have been reading
  about AI alignment on my own, and one debate keeps surfacing that I want to think
  through in the vocabulary I already have.


  As I understand it, the proposal called iterated amplification and distillation
  runs as follows. Take a large, hard task. Split it into subtasks small enough that
  a human overseer can reliably tell whether each was done well. Do the task by solving
  and checking those subtasks, composing their outputs into the whole. Having done
  that, train (distill) a smaller model to imitate the composed system, so it can
  do similar tasks without the expensive human-assisted process. The claim is that
  this preserves both competence and alignment: since every subtask was either produced
  under human-checkable constraints or selected by a process the overseer approved,
  the final system cannot drift from what the overseer wants. The opposing side says
  the two properties come apart: the subtasks that are cheapest to check are not the
  ones that carry the values; distillation preserves the surface outputs while discarding
  the reasoning and caution that kept those outputs honest; so competence can survive
  while alignment leaks away, or both can erode in ways the overseer never noticed.


  I want you to restate that whole debate in the vocabulary I use at work: modules
  and their contracts, unit tests versus integration tests versus end-to-end tests,
  code review, refactoring, regression, build and deployment pipelines, technical
  debt, and especially the difference between documented behavior and the tacit judgment
  of the engineer who wrote the code. I am fluent in this vocabulary; be as precise
  with it as you can.


  Give me the translation first: which side of the debate maps onto which claim about
  software, and what each term becomes. Be honest about the places where you have
  to stretch a software concept to make it fit, and flag them explicitly. Then give
  me the residue report. Which parts of the alignment debate have no counterpart in
  my vocabulary at all — for example, in software, decomposition preserves correctness
  only relative to a specification, and the specification is itself written, reviewed,
  and maintained; the alignment debate seems to have no specification, only an overseer''s
  in-the-moment judgment. Is that a fair thing to say in my vocabulary, or is it a
  distortion? Likewise, is distillation just lossy compression of an expert system
  into a smaller implementation, or is the loss involved here different in kind from
  the loss when a complicated service gets rewritten as a simpler one? Finally, tell
  me whether the things that don''t survive translation are a sign that my vocabulary
  is missing something real, or that the alignment debate is less precise than its
  participants claim.


  ---


