  Iterated amplification (IDA): Proposed by Paul Christiano et al. Idea: To train
  a model to do tasks that are hard to evaluate directly, start with a human who can
  evaluate small pieces; repeatedly break tasks into subtasks, use the model (or human
  + model) to solve subtasks, then use oversight to combine; then distill the amplified
  system back into a model. The hope is that competence and alignment are preserved
  through decomposition and distillation. Critiques/questions:

  - Distillation may lose the alignment-relevant reasoning while retaining surface
  competence (Goodhart, Eliciting latent knowledge concerns).

  - Decomposition may fail to preserve the human''s values when subtasks are chosen
  or evaluated by the model; alignment properties may not survive composition.

  - Amplification might preserve competence but not alignment; or preserve alignment
  only if the decomposition respects the overseer''s values.

  - Does decomposition preserve alignment? In software, module-level correctness under
  specs does guarantee system correctness if specs compose and each module implements
  its spec; but the specs themselves must encode the normative criteria — in AI, the
  overseer can recognize good subtask answers but can''t write the full spec (else
  alignment would already be solved). That''s a neat mapping: software specs are comparable
  to the overseer''s judgment; where software has a formal spec, AI alignment lacks
  one. Distillation is like compiling/compressing a senior engineer''s knowledge into
  a junior/linter rules; but compression loses the tacit ability to recognize when
  rules don''t apply.


  Actually the debate "does decomposition preserve alignment and competence?" maps
  to software: decomposition preserves functional correctness if contracts are complete
  and compositional; but it does not preserve unstated commitments (tacit knowledge,
  intent). A senior engineer decomposing a task for juniors may produce a system that
  works but cuts corners in ways the senior wouldn''t approve if they could see the
  whole. Distillation is like writing a runbook or automating a senior''s decision
  process: it preserves the cases in the runbook but not the judgment that generates
  new decisions.


