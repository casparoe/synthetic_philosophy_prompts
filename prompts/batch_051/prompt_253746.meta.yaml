  Let me think about which case best surfaces the philosophical dimensions:


  Desuetude core questions:

  1. Legitimacy: Can officials revive a law that has been dormant so long that citizens
  reasonably believe it is no longer in force?

  2. Fairness / reliance: People have ordered their affairs assuming the law won''t
  be enforced; sudden enforcement is unfair surprise, like retroactive law.

  3. Rule of law: Rule of law requires congruence between rules on books and rules
  in action; a legal system with many dead letters invites arbitrary enforcement (the
  law becomes a toolbox for targeting disfavored people). Selective revival undermines
  generality and equality.

  4. Separation of powers / democracy: If the legislature enacted the law and never
  repealed it, isn''t refusing to enforce a usurpation of the legislature''s power?
  Desuetude lets the executive nullify laws; conversely, the legislature''s long silence
  and the public''s settled expectations may have effectively amended it.

  5. The "law is the law" position: Non-enforcement doesn''t repeal; the council can''t
  erase a law by ignoring it; if the law is bad or obsolete, repeal it prospectively.

  6. But the enforcement decision is the council''s (or the executive''s) discretion;
  if they decline, they should formally repeal or adopt a policy of non-enforcement,
  with reasons.


