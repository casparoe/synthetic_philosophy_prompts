  enforced. Selective enforcement undermines predictability and equality. But there''s
  also the argument that the law is the law; failure to enforce in the past doesn''t
  create a right to violate it; and desuetude gives officials a way to nullify laws
  without legislation, undermining democratic legitimacy. Also, the law might be unenforced
  because it''s obsolete or unconstitutional.


