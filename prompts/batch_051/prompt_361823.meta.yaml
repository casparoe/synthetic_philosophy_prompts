  Thomas Metzinger, Being No One (2003), The Ego Tunnel (2009). Self-model theory
  of subjectivity (SMT): there is no such thing as a substantial self; what we experience
  as self is a phenomenal self-model (PSM) constructed by the brain. It is transparent:
  during ordinary experience we do not see it as a model; we look through it, as if
  directly in contact with ourselves/world. Transparency means the representational
  vehicle is introspectively unavailable; only the content is available. This creates
  the phenomenology of "directness" and the feeling of being immediately present.
  If transparency were lost (e.g., in depersonalization, or lucidity), one would experience
  one''s own mental states as representations. He argues the self is a useful fiction/representation;
  no "self" as substance. The theory also has "phenomenal first-person perspective,"
  "minimal phenomenal selfhood," "transparency" of the world model too.


