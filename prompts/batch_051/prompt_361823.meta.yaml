  Metzinger''s self-model theory (SMT) key claims (from my knowledge, paraphrased):

  - The "self" we experience is not a thing/substance but a process: the phenomenal
  self-model (PSM).

  - Transparency: a representation is transparent if the system cannot introspectively
  recognize it as a representation — it can only access its content, not the fact
  that it is a model. So the self-model is experienced as if we are directly in contact
  with a self, not as a constructed model.

  - Opacity: a representation is opaque when it is experienced as a representation
  (e.g., conscious thought about a thought, or a dream recognized as dream).

  - The phenomenal self-model is active, constantly updated, embedded in a world-model;
  it yields a first-person perspective.

  - Loss of transparency: depersonalization/derealization, certain drug states, or
  philosophical/lucid insight; one might experience parts of the self-model as constructs.
  Metzinger would say these are cases of opaque self-model episodes.

  - He denies an "essential, unchanging self" but does not deny that the experience
  of being a self exists; the Ego Tunnel metaphor: conscious experience is like a
  tunnel — we see only a narrow window of reality and mistake it for all there is,
  including the self.


  Potential student answer content:

  Exam question: "Explain Metzinger''s claim that the phenomenal self is transparent,
