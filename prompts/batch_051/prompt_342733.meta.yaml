  "The four beginnings from Mencius are commiseration, shame and dislike, modesty
  and yielding, and the sense of right and wrong; the seven emotions from the Book
  of Rites are joy, anger, sorrow, fear, love, hate, and desire. Both camps agree
  the four are always morally good while the seven can be good or bad. The dispute
  is over their sources. Toegye, pressed by Ki Dae-seung (Gobong), settled on the
  formulation that the four beginnings issue from principle (li) with material force
  (ki) following, whereas the seven emotions issue from material force with principle
  riding on it. That preserves a pure moral source for the paradigmatic moral emotions.
  Gobong and later Yulgok replied that only material force can actually issue, because
  principle is without activity or temporal motion, so all emotions alike must be
  the issuance of material force with principle as the norm internal to them; on their
  view the four beginnings are not a separate species of emotion but simply the good
  cases of the seven."


