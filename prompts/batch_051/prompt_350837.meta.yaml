  ---


  I work as a software engineer and run a small reading group whose members have no
  formal philosophical training. We have been trying to work out whether the human
  mind is modular, and we keep talking past one another because "module" seems to
  mean several different things: sometimes an informationally encapsulated subsystem
  with a narrow interface, sometimes merely a specialised component, sometimes something
  fast, automatic and unavailable to conscious inspection. In my own work, a module
  is an encapsulated unit that communicates only through a defined interface, and
  I do not want to carry that software meaning over into cognitive science unthinkingly,
  but I also do not want to treat every use of "module" as if it were the same claim.
  I would like a decision tree that sorts a reader into a position on the modularity
  of mind on the basis of what they believe about concrete cases, not on the basis
  of which label they like.


  Please write this decision tree for a technically literate audience with no philosophy
  background. Aim for 10 to 14 branch nodes and at least five leaves: Fodor-style
  modest modularity (only peripheral input and output systems are modular, while central
  belief fixation and reasoning are not); massive modularity (central cognition is
  itself decomposable into many specialised modules); a general-purpose or no-modularity
  position; a dual-process hybrid (fast, automatic processes are modular but higher
  reasoning is a distinct non-modular system); and a developmental position (modular
  structure is built during learning and is not pre-specified innately). If your tree
  cannot find a leaf for any of these, say which one and why.


  Build the tree from the logical space first, not from the list of names. Work out
  the core commitments and the combinations of answers they permit, then place the
  actual positions in that space. Where a combination of answers has no occupant,
  mark it and say in one sentence whether it is empty because it is incoherent, unattractive,
  or simply unexplored. Keep the architectural sense of "module" (informationally
  encapsulated, mandatory, implemented in fixed neural hardware) separate from the
  functional sense (specialised for a task or a domain), so a reader can agree that
  some process is specialised while disagreeing that it is encapsulated without the
  tree silently conflating the two.


  Phrase every branch as a concrete question or forced choice that an intelligent
  non-specialist can answer without already knowing which position it leads to. Questions
  of this sort would be appropriate: whether a well-informed adult can choose to see
  a visual illusion as it really is; whether an expert solving a problem can draw
  on anything they know from any domain of life; whether a fast, automatic response
  that uses arbitrary background information should still count as modular; whether
  natural selection could have produced a single general-purpose reasoning mechanism
  or would have had to produce many special-purpose ones; and whether an acquired,
  practice-built skill can count as a module or only an innate system can. You may
  replace these examples, but every node should be answerable from experience or ordinary
