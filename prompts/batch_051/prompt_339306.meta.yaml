  ---


  Last night a friend and I argued for hours about whether moral thought requires
  general principles. He defended the view that there are no true moral principles:
  he produced cases in which the same feature counted in favor of an action in one
  context and against it in another, and every rule I offered could be pushed into
  a counterexample by adding detail. I could not refute the examples, but I also could
  not accept that moral judgment is just a matter of seeing what each case requires,
  one case at a time. The position I ended up defending is something I will call procedural
  generalism.


  Procedural generalism concedes that first-order principles — generalizations about
  lying, promising, harming, and the like — are never true without exception, and
  that adding an other-things-being-equal clause renders them empty. But it denies
  that morality is free of structure all the way down. My proposal is that the real
  generalities are second-order: they do not say which features count as reasons,
  but they say how reasons behave — how they combine, cancel, and reverse their valence
  across contexts. For example, the fact that a medical procedure is painful can count
  for or against performing it; I want to say the switch is governed by a second-order
  regularity about authority and consent, not merely by the particular features of
  each case, and that a regularity of that kind is exactly what lets us learn, teach,
  and criticize moral judgment. If no such regularities exist, I argued, the particularist
  is stuck with the mysterious claim that competent judges simply see what each case
  requires, without being able to say what they are seeing.


  Is procedural generalism a stable position between particularism and full generalism,
  or does it just collapse into one of them? Is the distinction between first-order
  and second-order moral principles doing real work, and what are the three strongest
  objections — is any of them fatal rather than merely uncomfortable?


