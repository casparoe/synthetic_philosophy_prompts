  ---


  My friend and I just spent the evening arguing about forbidden colors, and I came
  away convinced that the question is better than either of us was treating it. I
  want to lay it out for you and have you work through it carefully.


  The classic argument, as my friend defended it, runs roughly like this. Human color
  vision is organized around opponent channels: a red-green channel, a blue-yellow
  channel, and a light-dark channel. Within the red-green channel, one direction of
  activity codes red while the other codes green, and the two modes cancel each other;
  that is why hue-cancellation procedures always bottom out in a state that is neither
  reddish nor greenish, and why no surface or light has ever produced an experience
  that is simultaneously reddish and greenish the way purple is simultaneously bluish
  and reddish. From this the classic position concludes that reddish-green and bluish-yellow
  are impossible experiences, hard limits on what a human visual system can produce
  — not just colors no one has happened to see.


  Now suppose a mature brain interface can drive color-coded neurons directly rather
  than through the eye. It can activate the neural population whose activity normally
  accompanies seeing red at the same time, and in the same cortical region, as the
  population whose activity normally accompanies seeing green, and it can clamp that
  pattern stable for minutes at a time. Suppose the subject, fluent with normal color
  language and allowed to compare the state to familiar reds, greens, browns, and
  olives, robustly reports something new: not red alternating with green, not a muddy
  mixture of the two, and not a new hue sitting between them, but a single color that
  appears to present both red and green at once, the way purple presents both blue
  and red.


  I want to know what this does to the classic argument. Specifically: does the opponent-process
  argument survive the interface, or does the interface only show something about
  the normal route to color experience? Which premise, exactly, is under pressure
  — the claim that opponent channels constitute color experience, the claim that a
  single opponent channel cannot be driven in both directions at once, or some background
  assumption about what can drive the channels? Is the classic argument best read
  as a thesis about the structure of possible experience, or as a thesis about what
  the retina can extract from light? And if it can be repaired, what is the strongest
  version that remains true and still does the original explanatory work?


  Treat this as a problem in philosophy of perception, not as a request for a literature
  review. Think carefully, and start by brainstorming the distinct readings of the
  classic argument before you settle on which one to assess. In your answer, distinguish
  impossibility for a normal visual system under ordinary stimulation from impossibility
  for any system, say what would count as evidence that the subject really is having
  a reddish-green experience rather than misdescribing a novel or ambiguous one, and
  finish by stating precisely what survives of the classic argument on your preferred
  reading.


