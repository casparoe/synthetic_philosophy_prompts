  tails is on the nth flip, you receive 2^n dollars (or 2^{n-1}). Expected value is
  infinite: sum (1/2^n) * 2^n = sum 1 = infinity. But people would only pay a small
  amount to play. Bernoulli''s solution: expected utility, not expected money; logarithmic
  utility makes expected payoff finite (for log utility, EV = sum (1/2^n) log(2^n)
  = log 2 * sum n/2^n = 2 log 2). Others: bounded utility (Menger), finite bankroll,
  etc.


