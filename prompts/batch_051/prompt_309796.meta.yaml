  ---


  Consider the standard St. Petersburg game: a fair coin is tossed until it first
  lands tails, and if the first tails is on toss n, you are paid 2^n dollars. The
  usual puzzle is that the expected monetary value is infinite even though sensible
  people would pay only a little for the ticket, and the usual resolutions appeal
  to diminishing marginal utility, bounded utility, or the finiteness of the bank
  paying out. I want to think through a version where the coin itself is not known
  to be fair. Suppose the coin''s tails probability is some fixed but unknown value
  p, and before you decide how much to pay you have a prior that is uniform over (0,1).
  You may observe finitely many preliminary tosses of that same coin — tosses that
  do not enter your payoff — and then you must name a price. For a known p, the expected
  payoff is Σ (1-p)^{n-1} p 2^n, which equals 2p/(2p−1) when p > 1/2 and diverges
  (is infinite) when p ≤ 1/2.


  My suspicion is that no finite number of preliminary tosses can settle the matter:
  after any finite sample, the posterior will still assign positive probability to
  p ≤ 1/2, and since the expected payoff is infinite on that entire region, the posterior-weighted
  expected payoff remains infinite no matter how reassuring the data look. If that
  is right, the "learn more about the game before you pay" strategy fails entirely,
  and the paradox is not really a problem about missing information about the coin.
  Work through whether the risk-neutral expected-value maximizer can ever assign this
  game a finite fair price after some finite sample, and explain exactly what happens
  to the standard resolutions if the coin''s bias is treated as unknown rather than
  known to be fair: which resolutions still dissolve the paradox under the uncertainty,
  which do not, and does the contrast show that an epistemic response (observe the
  coin) and the classical utility-based responses are answers to different questions
  rather than rival answers to the same one?


