  the vending machine "thinks" I''ve inserted a quarter, everyone treats this as a
  loose manner of speaking. The machine''s states are said to have only derived intentionality:
  their aboutness is borrowed from us, the designers and users. But when I say my
  colleague believes the tank is full because she misread the gauge, we treat that
  belief as the genuine article, original intentionality, not a mere façon de parler.
  In both cases I am explaining and predicting behavior by attributing content-bearing
  internal states to a system, and in both cases the attribution earns its keep in
  exactly the same way: it lets me predict what the system will do next. Yet we insist
  there is a deep difference in kind.


