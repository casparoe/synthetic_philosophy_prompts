  ---


  I''m designing a thought experiment about epistemic institutions for a course on
  social epistemology. Consider the following criterion, which is motivated by David
  Christensen''s argument in his 2007 paper "Epistemology of Disagreement: The Good
  News." Christensen gives the example of you and a friend, both competent, both looking
  at the same restaurant bill and agreeing on the tip, who independently arrive at
  different figures for one person''s share. He argues that you should become less
  confident in your answer as soon as you learn that your friend disagrees, even before
  you find the arithmetic mistake. For present purposes, accept a rough conciliationist
  criterion: when you learn that an epistemic peer disagrees with you about a proposition,
  and you have both considered the same evidence with comparable care, you should
  move your credence toward theirs, absent special reason to discount them.


  Now suppose a research funder proposes the following mechanism. A "conciliation
  panel" is formed for each disputed empirical question in a field. The panel identifies
  any two researchers who (i) are certified as epistemic peers by the panel''s own
  calibration data, (ii) have independently reviewed the same evidence, and (iii)
  report credences about the same proposition that differ by more than 10 percentage
  points. Each researcher then privately submits a pre-disclosure credence, after
  which the two are told only that they disagree. Each then submits a post-disclosure
  credence. If their post-disclosure credences still differ by more than 10 points,
  the panel publishes, as the community''s official credence, the simple average of
  the two original pre-disclosure credences. The original pre-disclosure reports are
  destroyed, and the panel will not say whose credence moved. The panel''s official
  credence is then used by the funder as the prior for all subsequent meta-analyses,
  and researchers who publicly defend a credence more than 10 points from the official
  one lose their peer certification for one year.


  Walk through this mechanism carefully. What does it incentivize among researchers
