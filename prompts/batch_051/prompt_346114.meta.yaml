  Domain: Algorithmic randomness. Core ideas:

  - A sequence is random iff it passes all effective statistical tests (Martin-Löf).

  - Kolmogorov: a finite string is random if its shortest description (program) is
  about as long as the string itself; otherwise compressible.

  - The paradox: every finite string has a short-ish description relative to itself?
  Actually the shortest program for a string of length n is at most n + O(1) (just
  "print x"). So no finite string is absolutely random in a pure "incompressible"
  sense relative to n? Wait: Kolmogorov complexity C(x) < n + c. So a string is "random"
  if C(x) ≥ n (incompressible, cannot be shortened). Any string can be described by
  print x. So the notion of incompressibility is relative — the string is random if
  no description significantly shorter exists. Many strings are incompressible (most,
  by counting argument: fewer short programs than strings), but we can''t prove specific
  ones. The finite case question: there''s a debate (e.g., how to define randomness
  for finite sequences; Kolmogorov randomness vs Martin-Löf randomness; von Mises
  collectives).

  - The philosophical point: randomness is effectively incompressibility / passing
  tests, not "having no cause."


