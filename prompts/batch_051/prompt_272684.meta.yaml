  Prompt:


  I am a PhD student in philosophy working on formal decision theory, and I have been
  asked to lead a session for a mixed undergraduate philosophy and economics reading
  group (roughly 20 participants, one hour and forty minutes, no prior exposure to
  game theory assumed, though most have met the Prisoner''s Dilemma informally). I
  want to design a classroom activity that makes participants feel the force of the
  idea of superrationality—roughly, the idea that in a perfectly symmetric interactive
  situation, a player may reason about the other player''s choice not by treating
  it as an independent variable to be predicted, but as the output of the same reasoning
  process they themselves are running, so that choosing the cooperative act in a one-shot
  Prisoner''s Dilemma can be justified against a symmetric counterpart rather than
  merely altruistic or irrational.


  Please act as an experienced philosopher of rationality with a track record of designing
  interactive teaching exercises. Think carefully before you write the final design,
  and begin by brainstorming multiple possible formats; compare them, then settle
  on one and develop it fully.


  The activity should satisfy the following constraints. First, it must stage the
  conflict between standard dominance reasoning and superrational reasoning rather
  than lecture about it: in the rules, payoffs, or structure, participants should
  be brought to the point where the standard defection argument feels compelling,
  and then a variant of the setup—ideally one they discover or run into themselves—should
  undermine it without the facilitator announcing the view. Second, any payoffs should
  be real enough (e.g., small denominations, chocolate, or points that can be converted
  into a prize at the end) to make choices genuinely felt. Third, the activity should
  be runnable by one facilitator in a single room with minimal materials. Fourth,
  it should not presuppose any mathematics beyond numeracy, and it must not require
  reading game theory beforehand.


  Then give a detailed debrief plan. The debrief should map specific moments in the
  activity onto the components of superrationality (the symmetry assumption, the common-knowledge
  assumption, the contrast with treating the other player as an independent process,
  and the sense in which superrationality is about policy selection rather than act-by-act
  optimisation), show where each step could be resisted and what it costs to resist
  it, and set out plausible objections from participants who have just experienced
  the standard dominance argument and will be reluctant to relinquish it. Be clear
  about which feature of superrationality the activity cannot reproduce—likely the
  strong identical-reasoning assumption itself, since real participants have different
  histories and could always decide to be unpredictable—and what the facilitator should
  say to supply that missing feature honestly. Finally, tell me what will predictably
  go wrong when the activity is run, and how the facilitator should handle it without
  giving away the point too early.


  I would most like participants to leave with two things: a precise statement of
  why the ordinary dominance argument in a one-shot Prisoner''s Dilemma is not the
  final word when the players are sufficiently symmetric, and a sense of how much
  theoretical weight that symmetry has to bear before the conclusion follows.


