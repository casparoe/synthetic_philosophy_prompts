  ---


  I am a PhD student in philosophy working on formal decision theory and the foundations
  of rationality, and I have been asked to lead a session of a mixed undergraduate
  philosophy and economics reading group. There will be around twenty participants,
  none of whom has formal training in game theory, though several know the Prisoner’s
  Dilemma informally. The session will run for one hour and forty minutes, and I want
  it built around a classroom activity that makes participants feel the force of superrationality
  rather than merely hearing about it.


  Please take on the role of an experienced philosopher of rationality with a track
  record of designing interactive teaching exercises. Before committing to a final
  design, brainstorm at least three distinct formats (for example, variations of a
  one-shot social dilemma, paired protocols, iterated or team-based mechanisms) and
  compare them; then develop the strongest one in full, with exact rules, payoffs,
  timing, materials, and a script a single facilitator could read aloud. Think carefully
  about the order in which participants encounter variants of the game.


  The point the activity should deliver is roughly this. In a one-shot Prisoner’s
  Dilemma, ordinary dominance reasoning says each player is better off defecting whatever
  the other player does. But if the two players are sufficiently symmetric—same payoffs,
  same information, same reasoning capacities, and each knows the other will run the
  same reasoning—then each can regard the other player’s choice not as an independent
  variable to be predicted, but as the output of the very reasoning process they themselves
  are running; the feasible outcomes collapse to joint cooperation or joint defection,
  and joint cooperation is strictly better. The activity should let participants first
  feel the pull of the ordinary defection argument, and then run into the symmetry-based
  reversal themselves, before the facilitator supplies the theoretical account. Participants
  should not hear the term ''superrationality'' until the debrief.


  The design should satisfy these constraints. It must be runnable by one facilitator
  in an ordinary seminar room with minimal materials. Payoffs should be real in a
  small way—points convertible into something at the end, or small sweets or coins—so
  that choices are genuinely felt. It should assume no mathematics beyond basic numeracy
  and no prior reading. And it must not become a lecture: the conflict between dominance
  reasoning and symmetry reasoning should emerge from the rules and from the participants''
  own decisions.


  After the design, provide a detailed debrief plan. The debrief should map specific
  moments in the activity onto the components of superrationality: the symmetry assumption,
  the common-knowledge assumption, the contrast between treating the other player
  as an independent process and treating their move as an instance of one''s own reasoning,
  and the idea that superrationality selects a policy rather than optimising act by
  act against a fixed choice. Show where each step could be resisted and what it costs
  to resist it, and anticipate objections from participants who have just experienced
  the dominance argument and will not want to give it up. Be explicit about which
  feature of the idea the activity cannot reproduce—presumably the strong identical-reasoning
  assumption itself, since real participants differ and could always choose to be
  unpredictable—and say exactly what the facilitator should tell them to supply the
  missing feature honestly rather than papering over the gap. Finally, say what will
  predictably go wrong when the activity is run and how to handle those failures without
  giving away the conclusion early.


  I would like participants to leave able to state precisely why the ordinary dominance
  argument in a one-shot Prisoner’s Dilemma is not the last word when the players
  are sufficiently symmetric, and with a clear sense of how much weight the symmetry
  assumption has to bear before the superrational conclusion follows.


