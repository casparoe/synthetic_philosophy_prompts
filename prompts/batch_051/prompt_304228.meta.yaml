  In my seminar on business ethics and social ontology, we spent the last session
  on whether a corporation can itself be blameworthy, as opposed to merely the individual
  employees and executives who act for it. Afterward, two classmates continued the
  argument, and I''d like a careful adjudication of what was actually said.


  (1) Daniel opened by arguing that only individual persons can be blameworthy. Blame,
  he said, requires the capacity to form intentions, to understand a moral wrong as
  wrong, and to feel remorse; a corporation is a legal fiction with no mind of its
  own. When we say a company is to blame, we''re using shorthand for "some individuals
  inside it are to blame," and if we pretend otherwise we let culpable managers hide
  behind the org chart while punishing shareholders and entry-level workers who had
  no relevant choice.


  (2) Mara replied that this misses what a corporation actually is. A firm is more
  than a set of people: it has decision procedures, lines of authority, incentive
  structures, and compliance systems that persist even as individuals come and go.
  Through those structures a company can act on an intention that no single person
  had — for instance, a defect can be kept quiet by distributed routines in which
  each person''s small action is individually unremarkable but the organization''s
  pattern of behavior is deliberate. If blame can only attach to individuals, she
  said, the most serious corporate wrongs become unblameable, because no one person
  ever formed the intention to do them.


  (3) Daniel answered that all of that can be paraphrased away. The procedures were
  designed and operated by people, and they merely aggregate individual actions; saying
  that the corporation intended the outcome is like saying "the market panicked."
  That''s a useful metaphor, not a claim about a mind. Blame, unlike prediction or
  explanation, requires reactive attitudes like resentment and indignation, and those
  can only be held toward a subject capable of feeling them. You can be angry at a
  person, but being angry at Pfizer or Exxon is a figure of speech.


  (4) Mara responded that this standard proves too much, because it would also rule
  out blaming a nation, a government, a committee, or a university — all of which
  we routinely hold responsible in ways that are not aimed at any single member. And
  the reactive-attitude point is overstated: when the public resents a company for
  its safety record, that resentment is not secretly directed at some particular employee;
  it is directed at the organization, as something that can recognize criticism, change
  policy, and offer redress. If a corporate decision structure can act intentionally
  and respond to reasons, she argued, it has the features that matter for blame; requiring
  a biological mind imports a prejudice rather than making an argument.


