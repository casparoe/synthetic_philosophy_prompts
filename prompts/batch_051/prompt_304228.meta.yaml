  story, corporate "agency" is epiphenomenal. The company''s choices are just an equilibrium
  produced by profit incentives; put a different group of people in the same market
  and structure, and they''d do much the same. So praising or blaming the corporation
  adds nothing over praising or blaming the external incentives — and where we do
  decide to blame, we should trace back to whoever set the incentives or made the
  choices.


