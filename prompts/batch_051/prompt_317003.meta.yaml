  Prompt draft:


  "Thoralf Skolem is best known for the paradox that now bears his name: because any
  consistent first-order formulation of set theory has a countable model, the theory
  can be satisfied by a model whose domain is only countably infinite even though
  the theory itself proves a theorem to the effect that an uncountable set exists.
  Skolem did not treat this as a mere formal curiosity. He took it to show that the
  distinction between countable and uncountable is, in some sense, relative to the
  axiom system or the model in which one works: there is, on his view, no absolute
  standpoint from which the ''real'' set-theoretic universe is pinned down by first-order
  axioms.


  Much later, Hilary Putnam turned the same theorem to a more radical philosophical
  use. On his reading, the Löwenheim–Skolem theorem, together with permutation arguments,
  shows that the totality of our constraints on the interpretation of a term—even
  ideal theory—cannot single out a unique intended interpretation. He concluded that
  the correspondence picture of reference, on which the world fixes what our words
  denote, is untenable; reference is, in a phrase, ''internal'' to a theory or conceptual
  scheme.


  The question: Would Skolem have welcomed Putnam''s use of his theorem as a natural
  extension of his own doubts about absolute mathematical notions, or would he have
  resisted it as an overreach—perhaps because Skolem''s target was mathematical ontology
  while Putnam''s target was reference and truth in general, or because Skolem remained
  more of a formalist about set theory than Putnam''s argument requires? Construct
