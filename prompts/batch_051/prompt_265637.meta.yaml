  I''m on my university''s student wellness advisory committee, and we''re stuck on
  a fairly mundane but philosophically loaded decision: whether to make a brief mental-health
  screening questionnaire opt-out rather than opt-in during orientation. The public-health
  folks point out opt-out gets higher completion rates and catches students who''d
  never proactively seek help; the civil-liberties side says this is a form of paternalism
  dressed up as choice architecture. The chair wants a decision memo by Thursday,
  with a concrete recommendation and conditions. I keep coming back to On Liberty,
  John Stuart Mill, specifically the chapter where he says in his own words that the
  only purpose for which power can be rightfully exercised over any member of a civilized
  community, against his will, is to prevent harm to others, and that his own good
  is not sufficient warrant. That feels like it should settle things against opt-out,
