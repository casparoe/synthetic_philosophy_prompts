  the debate — roughly, the instrumentalist who thinks sadness and grief are useful
  signals or spurs but carry no value beyond what they produce; the pluralist who
  thinks some negative emotions can be fitting responses to what matters and are valuable
  as such, so that a griefless life would not merely be different but in one respect
  worse; and the classic puzzle of why we value tragic art that makes us suffer —
  and render each one in terms of what a novelist would say about a character, an
  arc, or a reading experience. For each position, tell me which parts translate cleanly,
  which parts you had to bend to make them fit the craft vocabulary, and which parts
  have no counterpart at all.


