  Possible prompt draft:


  "I have a policy I apply when weighing corroborating evidence: unless I can identify
  a concrete mechanism that would make two pieces of evidence dependent—a shared source,
  coordination between the sources, or a common cause—I treat them as approximately
  independent and combine their force multiplicatively. For example, if two acquaintances
  independently tell me something surprising about a mutual friend, and I can''t construct
  a story about how one told the other or both heard it from the same gossip, I update
  roughly as if two independent witnesses had spoken. I know that''s stronger than
  the logic allows: unknown common causes are always possible, and my inability to
  name one is a fact about my ignorance, not about the world. I also know the failure
  mode matters—corroboration by two witnesses who both read the same mistaken source
  behaves like one witness, not two. Still, the alternative seems to be either treating
  all corroboration as worthless (which is too skeptical) or assigning an arbitrary
  discount factor with no basis. Is the presumption of independence defensible when
  restated carefully, or is it just a bias toward overconfidence dressed up as Bayesian
  scrupulousness? If it is defensible, what would a principled version look like—is
  there a non-arbitrary default degree of doubt for hidden common causes, or a condition
  under which the presumption is guaranteed to be safe? And how should an ordinary
  reasoner with limited time and no way to run a causal search decide when the rule
  is doing more harm than good?"


