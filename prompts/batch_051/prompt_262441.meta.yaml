  "I have a standing rule in my epistemic life that I''ve been calling the presumption
  of independence, and I want to know whether it is defensible or a bias dressed up
  as Bayesian hygiene. The rule is this: when two pieces of evidence independently
  point toward the same conclusion—two witnesses, two studies, two expert judgments—I
