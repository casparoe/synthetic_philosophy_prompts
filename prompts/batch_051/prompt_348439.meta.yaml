  ---


  I''ve been chewing on procreative beneficence (PB) and wound up with an argument
  that seems airtight but ends somewhere I refuse to go, and I can''t find the exit.


  (1) PB: if prospective parents have already decided to have a child and could select
  between two possible future children, they have a significant moral reason, other
  things equal, to select the one whose life can be expected to go better.


  (2) But expected welfare is overwhelmingly a social fact. Holding a given child
  fixed, the child has higher expected welfare in our world if they''re straight rather
  than gay, cis rather than trans, or a member of the ethnic majority rather than
  a stigmatized minority—not because those traits are intrinsically better, but because
  the local status hierarchy hands out less violence, more job calls, easier intimacies,
  etc.


  (3) So PB gives parents a pro tanto reason to select, where selection is possible
  (donor choice, adoption, eventually other tech), for exactly those socially dominant
  traits. The reason isn''t rooted in the parents'' own bigotry; it tracks expected
  welfare.


  (4) This reason doesn''t politely stay pro tanto. In a world with few strong countervailing
  duties in individual cases, a significant pro tanto reason will often just be the
  decision, and PB offers no internal filter that would tell a parent when to stop
  following it.


  (5) Now aggregate. If lots of parents act on (3)–(4), they produce a world even
  more committed to the status asymmetries that made the choice rational in the first
  place—fewer minority kids, more isolation for the ones who exist, norms reinforced,
  etc. The expected-welfare surplus the parents bought for their children comes from
  making the positional landscape worse for everyone down the line.


  (6) So the principle that says "maximize the child''s expected welfare" seems to
  recommend, at scale, degrading the very quantity it told you to maximize. That''s
  either a reductio of PB or a sign some earlier step was doing subtle work.


  I''d most like to keep (1) and (2) — they feel almost definitional. But I can''t
  tell whether the fix is to restrict the welfare inputs PB is allowed to count (and
  where do you get that restriction without it being ad hoc?), or whether step (5)
