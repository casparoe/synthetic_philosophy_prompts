  I keep meeting the claim, usually attributed to Bernard Williams through his discussion
  of the Makropulos case, that an indefinitely extended life would eventually become
  tedious and meaningless, so that immortality is not something a reflective person
  should want. As I understand it, the argument runs roughly as follows: a finite
  human character supports only finitely many categorical desires, where a categorical
  desire is one that can give a person a reason to go on living rather than being
  operative only on the condition that one is going to live anyway; but in an endless
  life the stock of such desires would eventually be exhausted, and what remained
  would be repetition, boredom, and indifference; hence the value of continued life
  is not a simple function of quantity of time; at the limit, more life is not better,
  and is perhaps worse.


  Please restate this argument rigorously in the vocabulary of decision theory and
  behavioural economics. In particular:


  1. Translate each central move — categorical versus conditional desires, the finitude
  of a character''s motivating concerns, the alleged inevitability of repetition and
  boredom, and the conclusion that endless life is not preferable — into the apparatus
  of utility, preferences, discounting, satiation, habits, and infinite horizons.
  Distinguish clearly between a version of the argument that is about experienced
