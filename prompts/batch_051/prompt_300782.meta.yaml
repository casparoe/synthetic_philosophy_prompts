  - Its purity, or the chance it has of not being followed by sensations of the opposite
  kind: that is, pains, if it be a pleasure: pleasures, if it be a pain.

  These two last, however, are in strictness scarcely to be deemed properties of the
  pleasure or the pain itself; they are not, therefore, in strictness to be taken
