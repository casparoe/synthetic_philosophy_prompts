  The Language of Thought Hypothesis (LOTH): Fodor''s claim that thought is computation
  over syntactically structured mental representations with compositional semantics
  — akin to a language. Classical cognitive architectures: rules, production systems,
  propositional attitudes.


  The connectionist challenge: PDP networks using distributed representations; no
  explicit discrete symbols or rules; representations are patterns of activation across
  units; cognition emerges from numerical dynamics. Advocates: Rumelhart, McClelland,
  Hinton, Smolensky; models like past-tense acquisition, word recognition.


  Fodor & Pylyshyn''s critique (1988): systematicity (any mind that can think "John
  loves Mary" can think "Mary loves John") and compositionality need structured representations;
  connectionist networks either don''t exhibit systematicity or they secretly implement
  a classical architecture (the "implementationist" reading) — if so, connectionism
  isn''t a new theory of cognition, or it fails to explain central features. Smolensky''s
  reply: connectionism as "subsymbolic" paradigm — it can approximate the classical
  level without instantiating it; the right level is between neural and conceptual;
  "subsymbolic computation"; also the Proper Treatment of Connectionism (1988 Behavioral
  and Brain Sciences). The debate continued through the 90s with hybrid architectures,
  deep learning''s later revival.


