  specific details of the project (inside view), you place the case in a reference
  class of similar past cases and start with the distribution of outcomes in that
  class, then adjust. In forecasting, base rates are the statistical distribution
  of outcomes in the reference class. For empires: the reference class could be "land-based
  contiguous empires," "multi-ethnic authoritarian superpowers," "one-party states
