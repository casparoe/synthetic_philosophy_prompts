  I have no formal training in biology or philosophy, but I have spent a long time
  trying to think through a question on my own, and I would like an expert to pressure-test
  my reasoning. Please take on the role of a philosopher of biology who works on the
  concept of biological information. Before writing your final answer, take some time
  to brainstorm: distinguish the different things someone might mean by "code" and
  "information," list the strongest considerations on each side, and flag any places
  where everyday language might be doing hidden work. Think carefully, and do not
  settle for the usual "it is partly a metaphor" compromise unless you can defend
  it in detail.


  The question I would like you to answer in the form of an essay is: is DNA literally
  a code, or is the language of "code" and "information" just a convenient metaphor
  that has hardened into a habit?


  One thing that bothers me is the following. In an ordinary code, such as Morse code
  or a cipher, there is a mapping or convention that assigns each symbol to something
  else, and there is something—a sender, a receiver, an interpreter—that uses the
  mapping. DNA seems different. The genetic code is, as I understand it, a set of
  mappings between nucleotide triplets and amino acids, but the cell only "uses" that
  mapping because it contains molecules such as transfer RNAs, aminoacyl-tRNA synthetases,
  and ribosomes, which are themselves specified by DNA. So the code seems to specify
  the very machinery that reads the code. Is that a real problem for the literal-code
  view, or just a fact about how coding works in biology? Does a code need to be invented
  or agreed upon by an external mind to count as a code, or can a mapping count as
  a code if it is simply physically instantiated and causally maintained?


  I have also wondered about the difference between a code and a template. A key or
  a die stamps out a shape by direct physical correspondence, whereas a code works
  through a rule that could in principle have been different. DNA replication and
  transcription look a lot like template copying, since each base pairs with its complement.
  Translation, though, looks more rule-like, because the triplet-to-amino-acid assignments
  seem largely arbitrary. Does the arbitrariness of the genetic code make it a genuine
  code even if no one consciously chose the assignments?


  Finally, consider a stretch of DNA that causes a harmful protein. If DNA literally
  carries semantic information, can that information be false or mistaken, the way
  a sentence can be false? Or is a harmful mutation just a different but perfectly
  valid message—unfortunate, but not "wrong" in any semantic sense?


  In your essay, please weigh the strongest arguments on both sides. Then reach a
  definite conclusion and justify it. A verdict such as "DNA is a code in the following
  restricted sense but not in the following richer sense" is acceptable, but do not
  end on a vague "both sides have a point."


