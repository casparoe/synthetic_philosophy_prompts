  Draft:


  As a journalist who covers science and ideas, I have spent the last few years reading
  the debates about animal welfare, the comparative harms of beef and chicken, the
  animal deaths involved in crop farming, and the emerging discussion of wild animal
  suffering. I have ended up strongly attracted to an impartialist principle about
  suffering: if an animal can suffer, that suffering counts, and it does not count
  differently because of the animal''s species, whether a human intended the harm,
  whether the harm occurs in a barn or a wheat field, or whether the animal is wild
  or domesticated. The principle appeals to me because it supplies a single currency
  and a non-arbitrary reason to extend concern outward rather than stopping at the
  boundary of the human, or at the boundary of the farm.


  But the same principle seems to push me toward conclusions I cannot bring myself
  to accept, and I need help deciding which should give way: the theory or the intuition.


  The tension shows up in three places.


  First, beef versus chicken. I understand the argument that chicken inflicts many
  more individual lives of suffering per unit of food because chickens are small and
  short-lived, whereas beef kills far fewer animals but animals with longer, possibly
  richer, mental lives. I also see that the calculation is genuinely hard: poultry
  welfare, feedlot conditions, breed growth rates, slaughter methods, and the quality
  of a cow''s life all move the numbers around. My intellect says the right answer
  must be a careful estimate of expected suffering per unit of food. My firm intuition
  says that something is being flattened in that calculation, and that deliberately
  raising and slaughtering animals in a system built for repeated killing is not equivalent
  to eating fewer, larger, longer-lived animals. Is that intuition tracking a morally
  real difference, or am I failing to track aggregate suffering?


  Second, crop cultivation. The impartialist pressure says the mouse, vole, or insect
