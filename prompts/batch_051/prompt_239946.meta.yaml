  you are. If you are in the Red zone, then it is twice as likely... " Hmm, actually
  the original: she''s in one of two areas, Red and Blue; each divided into Headquarters
  (HQ) and Second Company (SC). She gets the conditional: "If you are in Red, then
  the probability you are in HQ is 3/4." The problem: how should she update given
  only this conditional information? Standard Bayesian conditionalization can''t handle
  non-propositional... Actually it can via probability kinematics (Jeffrey conditioning)
  or minimize relative entropy subject to the constraint. The "Judy Benjamin problem"
  is that the natural update imposes the constraint on the conditional probability
  P(HQ | Red) = 3/4 but doesn''t tell us the new P(Red). Van Fraassen''s solution
  via relative entropy (minimum discrimination information) yields a particular answer
  where P(Red) changes in a specific way. There''s debate.


