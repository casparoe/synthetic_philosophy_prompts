  ---


  Most democratic states treat the secret ballot as a settled condition of free elections,
  and relatively few political philosophers now trouble to state exactly what it presupposes.
  The practice is this: in elections to public office, citizens mark their ballots
  in private, and the state undertakes that no employer, neighbour, party agent, or
  candidate may discover how a given citizen voted. I want you to ask what theory
  of the vote this practice presupposes, and to test that theory against a passage
  from John Stuart Mill''s Considerations on Representative Government (1861). In
  Chapter X, ''Of the Mode of Voting,'' Mill argues that the use of the ballot in
  clubs and private societies cannot be carried over to parliamentary elections:


  "This is the decisive reason why the argument does not hold, from the use of the
  ballot in clubs and private societies, to its adoption in parliamentary elections.
  A member of a club is really, what the elector falsely believes himself to be, under
  no obligation to consider the wishes or interests of any one else. He declares nothing
  by his vote but that he is or is not willing to associate, in a manner more or less
  close, with a particular person. This is a matter on which, by universal admission,
  his own pleasure or inclination is entitled to decide: and that he should be able
  so to decide it without risking a quarrel is best for everybody, the rejected person
  included."


  Reconstruct the conception of the vote that Mill takes the secret ballot to express
  when it is extended from the club to the polling station, and set it against the
  conception that defenders of the modern secret ballot usually rely upon. Then address
  this: does the widespread practice of the secret ballot in public elections strictly
  presuppose that a vote is a private preference the voter may settle as they please,
