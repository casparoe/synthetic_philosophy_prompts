  Candidate belief set final:


  1. Artifacts can have politics in their design, not just in their use. I think it''s
  obviously true that some systems make certain outcomes hard or impossible, and that''s
  political: e.g., a content moderation system that only allows certain report categories,
  or a payments API that won''t process certain legal transactions. So I reject the
  "technology is just a tool" line.


  2. But I''m not a determinist. I think almost any given *technical capability* can
  be wrapped in different institutions, regulations, ownership structures, and then
  the politics changes. So when someone says "technology X is [authoritarian/democratic/capitalist]
  by nature," I usually think they''ve mistaken the current implementation for the
  inevitable one.


  3. I want there to be a stable distinction between designs that *forbid* and designs
  that merely *discourage* — between something like DRM that cryptographically prevents
  copying, and something like a dark pattern that makes copying slightly harder. And
  I think the first kind is where the designer''s political responsibility really
  kicks in, because you''re not nudging, you''re foreclosing.


  4. But I also think designers can''t be expected to control what users do with a
  general-purpose system after it ships. I''ve seen enough tools get repurposed in
  bizarre ways to think that "foreseeable misuse" is often a much weaker standard
  than people pretend. If the design didn''t actually prevent alternatives, then the
  downstream use is on the users and their context, not the builder.


  5. I think the thing I actually care about is concentratable control: a technology
  becomes political in the bad sense when it creates a chokepoint that a small number
  of actors can operate, regardless of whether the designer intended it. So maybe
  the question isn''t "was it built in" vs "is it social" but "does the design make
  some point of control cheap to monopolize."


