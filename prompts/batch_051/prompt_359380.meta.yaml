  in-the-weeds insight: any process signal eventually validated against outcomes collapses
  toward outcome supervision, and if it isn''t validated, it drifts. So the mechanism:
  a "process critic" whose ongoing score is its rolling correlation with downstream
  outcomes across a batch. Analyze what it incentivizes: it will learn to predict
  outcome difficulty, not process quality; it will be gamed by agents that exploit
  when the critic is wrong; annotators will write process notes that look like high-outcome
  transcripts; etc.


