  claims about how firms make decisions, how blame differs from liability and reputational
  sanction, and which harms firms obviously cause; (2) a section stating the exact
  residual disagreement, in wording each side would accept for its own position rather
  than a caricature; (3) a list of cruxes — the sub-questions whose settlement would
  move at least one side; and (4) for each crux, at least one concrete test, case,
  or argument both sides agree bears on it, with each side''s prediction recorded
  in advance. Possible cruxes include whether blame requires a unified subject of
  experience or the capacity to understand and answer moral reasons; whether ''the
  corporation intended X'' is reducible to facts about individual mental states; and
