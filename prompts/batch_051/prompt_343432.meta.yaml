  joint statement they would produce. The defender holds that a corporation can itself
  be a fitting target of moral blame, over and above blame or sanction of its members;
  the reductionist holds that so-called corporate blame is at best a metaphorical
  shorthand for, or a regulatory/liability response to, the actions of natural persons.
  They both agree that firms cause harm, can be regulated, fined, and publicly censured;
  their dispute is narrower and harder.


