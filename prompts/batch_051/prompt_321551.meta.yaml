  ---


  I am a retired research chemist, and since leaving the lab I have been working through
  the literature on mental causation. The causal exclusion argument has come to seem
  to me both forceful and, at the same time, as if it overreaches. I have written
  out below an argument of my own that tries to make the overreach precise. Please
  assess it in a definite way. If it is invalid, identify the first step at which
  it fails and give the exact reading of the crucial term on which the failure depends;
  if it is valid but unsound, say which premise is false and why, and tell me what
  a defender of the exclusion argument can say in reply. I am not looking for a survey
  of positions; commit to one diagnosis and defend it.


  The argument:


  (1) The exclusionist''s working principle is this: if a property F is distinct from
  a property P, and P alone is nomologically sufficient for an effect E, then F is
  not causally relevant to E. (This presumes that repeated, systematic overdetermination
  is not an acceptable account of everyday causation.)


  (2) Take any mental property M — for example, intending to phone one''s daughter
  — and any bodily effect E it is supposed to produce. There is a physical (neural)
  property P of the agent, distinct from M, such that P alone is nomologically sufficient
  for E.


  (3) From (1) and (2), M is not causally relevant to E. So mental properties are
  never causally relevant to behavior.


  (4) The very same pattern holds throughout the special sciences. Take any higher-level
  property invoked in a successful causal explanation — a molecule''s being an enzyme,
  a solution''s being acidic, a market''s being in recession — and any effect it is
  invoked to explain. There is a distinct microphysical property of the system that
  is alone nomologically sufficient for that effect.


  (5) From (1) and (4), no enzyme, acidity, or market property is ever causally relevant
  to anything, and likewise for the rest of the special sciences.


  (6) But that conclusion is too costly to accept. It would imply that chemistry,
  biology, and economics as causal sciences are systematically false rather than merely
  coarse-grained or lower-level-reducible. I see no independent scientific reason
  to accept that; it is a philosopher''s bullet.


  (7) Therefore premise (1), the exclusionist''s working principle, must be false,
  or at least must be restricted in a way that no longer threatens mental causation.


  Question: Is this argument valid? If so, is premise (1) or premise (4) the one the
  exclusionist should reject, and does that rejection leave exclusionism standing
  where it matters? If the argument is invalid, which step fails and under what reading?
  Be specific and do not remain neutral.


