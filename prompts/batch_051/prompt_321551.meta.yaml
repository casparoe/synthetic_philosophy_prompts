  I am a retired research chemist, and I have spent the past few years reading the
  philosophy of mental causation. The causal exclusion argument strikes me as the
  sharpest challenge to the idea that our intentions and beliefs genuinely make things
  happen, but I suspect it proves too much. Below is an argument I have constructed
  to make that suspicion exact. I would like a committed assessment. If the argument
  is invalid, tell me the first step at which it fails and the precise reading of
  the term on which the failure turns. If it is valid but unsound, tell me which premise
  is false, what the defender of the exclusion argument should say in reply, and whether
  that reply is special pleading. Do not lay out menus of possible options; pick one
  diagnosis and argue for it.


  (1) The exclusionist accepts a principle along these lines: if a property F is distinct
  from property P, and an instance of P is by itself nomologically sufficient for
  an effect E, then F is not causally relevant to E. Systematic overdetermination
  is being set aside as an unacceptable general account of ordinary causation.


  (2) For any mental property M that is supposed to produce a bodily effect E, there
  is a neural or other physical property P of the agent, distinct from M, whose instantiation
  is by itself nomologically sufficient for E.


  (3) So, from (1) and (2), no mental property is ever causally relevant to a bodily
  effect.


  (4) The same pattern holds everywhere in the special sciences. For any higher-level
  property invoked in a successful causal explanation — an enzyme''s catalytic property,
  a solution''s acidity, a market''s being in recession — and any effect it is invoked
  to explain, there is a distinct microphysical property of the system whose instantiation
