  Draft:


  "I''m circulating a one-paragraph summary of my metaphysical position on mind to
  a reading group and would like a consistency check before I present it. The position,
  more or less:


  1. To be in pain is to be in a state that occupies a certain causal role: it is
  typically caused by tissue damage or similar bodily disturbances, and it typically
  causes withdrawal, distress, beliefs about one''s body, and the like.

  2. Mental states are multiply realizable. Any physical substrate that implements
  the pain role is in pain; it does not matter whether the implementing substrate
  is carbon-based, hydraulic, or silicon. The substrate is irrelevant to whether the
  state is pain.

  3. However, I am not a vulgar functionalist. A lookup table that stored the right
  input-output mapping, or an entire nation wired together to mimic the role, would
  not be in pain. To count as a realizer, the implementation has to be integrated
  in the right way, not merely produce the right input-output profile.

  4. Mental causation is real. My pain causes me to withdraw; the mental state itself
  does causal work, and is not epiphenomenal relative to the neural firings.

  5. Psychology is an autonomous special science. Psychological generalizations hold
  at the functional level, and a mature psychology should not be expected to reduce
  to or be replaced by neuroscience.

  6. This applies across species: I take an octopus to feel genuine pain and not merely
  to act as if it does, even though its nervous system is organized in a very different
  way from ours. If it implements the pain role, it feels pain.

  7. I am not an eliminativist or an illusionist. There is something it is like to
  be in pain, and any acceptable account must preserve that.


  Please go through this set and tell me which commitments are actually in tension
  with which, which pairs only seem to be in tension and why the appearance is misleading,
  and how severe each genuine tension is. For each tension, say what would have to
  give and what the cheapest repair would be. Then tell me whether a single revision
  would clean up the most problems, and what it would cost. I don''t want a list that
  treats every pair as equally problematic; I want the tensions ranked by severity."


