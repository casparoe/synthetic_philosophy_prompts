  Draft:


  "I''m putting together a one-paragraph ''position statement'' on the metaphysics
  of mind for a reading group, and I''d like a consistency check before I circulate
  it. My current view is:


  (1) Mental states are functional states: for a system to be in pain is for it to
  be in some state that occupies a particular causal role (roughly, the state is typically
  caused by tissue damage and typically causes withdrawal, grimacing, formation of
  beliefs about one''s body, and so on).

  (2) Mental states are multiply realizable: any physical substrate that implements
  the pain role is in pain, whether it''s carbon-based neurons, hydraulic tubes, or
  silicon circuits. The substrate itself is irrelevant.

  (3) But I also reject overly liberal functionalism: I don''t think a lookup table,
  or a population of China wired together to implement the same input-output function,
  would actually feel pain. Implementation has to be integrated in the right way,
  not just any realization of the input-output mapping.

  (4) Mental causation is real: the reason I pull my hand off the stove is that I
  feel pain; the pain, not just the underlying neural firing, does causal work.

  (5) Psychology is an autonomous science: psychological generalizations hold at the
  functional level, and we shouldn''t expect a mature psychology to reduce to or be
  replaced by neuroscience.

  (6) I take an octopus to feel genuine pain, not merely to act as if it does, even
  though its nervous system is organized very differently from ours. If it implements
  the pain role, it has pain.

  (7) I am not an eliminativist or illusionist about phenomenal feel: there is something
  it is like to be in pain, and any acceptable theory must keep that.


  Which of these are actually in tension, which only appear to be, and what is the
  least costly revision? Rank the tensions by severity and say what would have to
  give in each case. Then tell me whether there''s a single revision that would do
  the most cleanup, and what it would cost."


