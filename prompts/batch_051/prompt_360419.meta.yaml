  The Rietdijk–Putnam argument: In special relativity, simultaneity is relative to
  inertial frame. To show determinism/eternalism: Consider two observers, Alice and
  Bob, at same location, moving relative to each other. A distant event E (Andromeda
  launch) that is future for Alice (not yet in her "now" hyperplane) may be present/past
  for Bob (in Bob''s now hyperplane). If both observers are equally real and their
  "now" slices are equally valid, then events that are future for one are already
  real/present for the other. Assuming all events are real for any observer... Putnam:
  if Bob is moving away from Andromeda, invasion may be simultaneous with his "now"
  and hence already determined. Since no frame is privileged, the future is as real
  as the present — block universe. That''s roughly right.


