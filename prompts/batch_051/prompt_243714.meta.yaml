  Key distinctions in particularism/generalism:

  - Generalism: the possibility of moral thought and judgment depends on the existence
  of suitable moral principles; principles are codifiable.

  - Particularism: the possibility of moral thought and judgment does not depend on
  the existence of principles; moral reasons are context-sensitive (holism of reasons);
  moral judgment is a matter of discerning the salient features of particular cases.

  - Absolutism: some principles hold without exception ("do not kill the innocent").

  - Pro tanto / contributory: Ross''s prima facie duties are principles that state
  features counting in favor/against, but can be outweighed.

  - Pragmatic generalism: principles as rules of thumb, useful but not explanatory/truth-makers.

  - Maybe "generalism as regulative ideal" (McKeever & Ridge): principles may be uncodifiable
  but we should strive to articulate them.


  Cases for quiz:

