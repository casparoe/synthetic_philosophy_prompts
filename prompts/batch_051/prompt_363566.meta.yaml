  The unilateralist''s curse: Where a number of agents can each act, and each defers
  to "the group," no one acts; or where acting is bad, each optimist acts. More precisely:
  the curse arises when each actor decides whether to act based on their private estimate
  of the value of the action, but they don''t account for selection effects: those
  who act are those with the most extreme estimates. Essentially, in a group with
  a mix of estimates, the action gets taken when any individual''s estimate passes
  her threshold, so the group''s action reflects the maximum optimism, not the average.
  The "curse" is that with many independent unilateral actors, you''re almost guaranteed
  to get the action if anyone in the tail is optimistic enough, even if the median
  view is against it.


