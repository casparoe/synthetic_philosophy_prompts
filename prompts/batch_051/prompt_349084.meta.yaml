  Recently my work has forced me to think carefully about what we mean when we say
  one thing caused another. I work on models that estimate the probability that a
  particular action contributed to an adverse event, such as whether a driver''s behavior
  caused a collision. The modelling itself is tractable, but the word cause keeps
  reappearing in the requirements and in how the results are interpreted, and I have
  been reading Bertrand Russell''s essay On the Notion of Cause to understand why
  the term feels so difficult to pin down. In that essay, Russell argues that the
  notion of cause is a survival from an earlier, pre-scientific way of thinking, modelled
  on one thing pushing or willing another; that it has no functional place in the
  physical sciences; and that the law of causation survives only because it is mistakenly
  thought to do no harm. He presses the point by discussing gravitational astronomy
  and the law of gravitation, which he says states a functional relation between configurations
  at different times rather than a relation of cause to effect.


  I would like you to test that argument against the later development of formal causal
  inference in statistics and computer science — structural causal models, do-calculus,
  and counterfactual reasoning. Does this body of work refute Russell''s charge by
  giving cause a mathematically precise meaning that does genuine scientific work?
  Or does it vindicate his charge, because what these formalisms actually model is
  something else — invariance under intervention, probabilistic dependence, or information
