  Recently my work has forced me to think carefully about what we mean when we say
  one thing caused another. I work on models that estimate, for a given adverse event,
  the probability that a particular action contributed to it — for instance, whether
  a driver''s behavior caused a collision. The models are technically tractable, but
  the word "cause" keeps returning in the requirements, and I''ve been reading Bertrand
  Russell''s essay On the Notion of Cause to understand why the term feels so slippery.
  In that essay, Russell argues roughly that the notion of cause is a holdover from
  the idea of one thing pushing or willing another, that it has no place in advanced
  physical theory, and that the law of causation is a relic of a bygone age that survives
  only because it is thought to do no harm. (There is a passage in that essay where
  Russell says the law of gravitation, for example, states a functional relation between
  configurations at different times rather than a cause-effect relation.)


  I''d like you to test that argument against the later development of formal causal
  inference in statistics and computer science — structural causal models, do-calculus,
  counterfactual reasoning. Does this work refute Russell''s charge, by giving "cause"
  a mathematically precise meaning that does real work? Or does it vindicate his charge,
  by showing that what the new formalisms actually model is something else — invariance
  under intervention, probabilistic dependence, information flow — and not the old
  anthropomorphic cause at all? Or is the truth somewhere between: the formalisms
  let us ask well-defined causal questions precisely because they replace the notion
  with something Russell would have found unobjectionable? I want to know whether
  his eliminativist conclusion survives, needs repair, or is dead, and which specific
  premise the development bears on.


