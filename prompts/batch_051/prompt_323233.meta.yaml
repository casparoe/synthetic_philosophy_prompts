  The natural Type 2 argument:


  (1) A random sequence is one that is generated by a chance process (or, better:
  one that no deterministic rule much shorter than it can produce).

  (2) Any finite sequence, no matter how it was actually produced, is exactly the
  output of some deterministic rule no longer than itself (just list the digits).

  (3) So every finite sequence is consistent with being produced deterministically.

  (4) And any finite sequence is also consistent with having been produced by a fair
  coin.

  (5) So the question "was this finite sequence produced by a chance process?" is
  underdetermined by the sequence itself; randomness belongs to the generating process
  or to infinite sequences, not to finite strings.


