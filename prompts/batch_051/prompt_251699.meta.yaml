  Key conceptual points:


  1. A writing system is selective: it must choose which levels of linguistic structure
  to represent — phonetic detail, phonemes, morphemes, words, syntactic boundaries.
  No script encodes everything. So a script is a theory in the sense that it partitions
  the continuous speech signal and picks some features as linguistically significant
  and others as irrelevant. This is like a phonological analysis.


  2. "Phonemic" ideal: the alphabetic principle holds that graphemes should map onto
  phonemes, one-to-one, biuniquely. This is a regulative ideal (associated with phonemic
  theory, Prague school?). But real orthographies deviate. The deviations are not
  necessarily failures: they may encode morphology (English "sign/signature" keeps
  the same stem spelling; "past tense -ed" represents a morpheme with three surface
  allophones), etymology, or disambiguation (homophones). So a deeper orthography
  is not simply a worse phonemic theory; it may be a theory at a different level.


  3. What would make a script "wrong": if it encodes distinctions that are not linguistically
  real (e.g., spelling pronunciations based on false etymologies) or if its classifications
  are inconsistent — but even inconsistency can be functional (e.g., marking loanwords
  differently). The better criterion is not phonemic transparency but whether the
  script captures a coherent analysis of the language and supports the community''s
  literacy practices.


  4. Phonemic alphabet ideal has theoretical problems: phoneme is itself an abstraction;
  there is no context-free inventory of phonemes (allophony, neutralization, morphophonemic
  alternations, suprasegmentals). A perfectly biunique system would either have to
  choose one allophone as canonical (arbitrary) or would multiply symbols, losing
  generality. Also spoken languages change; orthographies fossilize, becoming theories
  of an earlier stage (English spelling partly reflects Middle English/Great Vowel
  Shift) — so a script can be a theory of a no-longer-spoken variety, and synchronic
  opacity may actually preserve historical information.


  5. The evaluative shift: rather than asking "how phonemic is it?" we should ask
  "what does it choose to encode, and is that choice well-motivated for this language
  and its users?" A tone language with inconsistent tone marking might be making a
  reasoned choice (tone is redundant given context, or marking tones only where ambiguous)
  or it might be an accident of history; we need evidence of function.


  6. Limits of the "theory" metaphor: a theory can be false; a script isn''t asserted
  as true/false the way a scientific theory is. But it can embody false beliefs (e.g.,
  some scripts'' etymological spellings based on mistaken history). The metaphor captures
  the selective, analytic character but shouldn''t be over-literalized into "scripts
  make claims."


