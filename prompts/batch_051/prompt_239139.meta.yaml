  "As part of a dissertation chapter on Morgan''s canon and the debate over how much
  cognition we may attribute to nonhuman animals, I''m compiling a taxonomy of objections
  to the canon''s use as a methodological rule. By Morgan''s canon I mean the principle
  that we should interpret an animal activity in terms of the lowest psychological
  process that can fairly account for the observed behavior, rather than in terms
  of a higher one. So far I have six objections, which I take to be the standard ones:


  1. The scale objection. The canon''s instruction to prefer the ''lower'' process
  presupposes a ranked scale of psychological evolution or development. But that scale
  does no independent work and inherits a pre-Darwinian, anthropocentric picture of
  mental life; the principle is therefore circular when the legitimacy of the ranking
  is precisely what is contested.


  2. The export objection. The canon is a rule for interpreting a particular performance,
  but it is routinely exported to questions about which capacities a species has at
  all. A capacity can exist without being expressed in a given task, so the fact that
  a behavior can be ''fairly'' accounted for by a lower process does not license the
  conclusion that the higher capacity is absent.


  3. The stopping-rule objection. Designed as a guard against over-attribution, the
  canon in practice functions as a license to stop inquiring once a low-level account
  fits the data. It thereby shelters deflationary hypotheses from further tests rather
  than protecting animals from projection.


  4. The asymmetry objection. The canon treats over-attribution of mind as the standing
  risk and under-attribution as the sober default. That built-in asymmetry is not
  epistemically neutral; it is a bias in the opposite direction, toward denying cognitive
  phenomena that the evidence may support.


  5. The underdetermination objection. Because the same behavioral pattern can be
  produced by mechanisms at many different levels, the canon cannot by itself tell
  us which of the competing interpretations is the fair one. It relocates rather than
  resolves the problem of selecting a psychological explanation from behavior.


  6. The false-parsimony objection. The canon assumes that ''lower'' along the scale
  means simpler, better understood, or more economical. But many lower processes,
  such as associative learning in ecologically realistic settings, are computationally
  complex and theoretically contested, so the promised parsimony is often illusory.


