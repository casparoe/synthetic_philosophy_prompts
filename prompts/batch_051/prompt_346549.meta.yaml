  Actually the paper''s core point: With many agents who can each unilaterally act,
  the group''s ability to act collectively is determined by the most optimistic agent,
  not the median. Even if most people think the action is bad, the most optimistic
  actor will do it. If each actor''s estimate is unbiased but noisy, then as N grows,
  the maximum estimate will be increasingly optimistic; the actor with the highest
  estimate crosses the threshold and acts. So the action will be taken even when objective
  expected value is negative. This is a "winner''s curse" / selection of the maximum
  of noisy estimates.


