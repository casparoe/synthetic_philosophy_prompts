  Prompt (final draft):


  "I''ve been trying to understand a failure mode that shows up in distributed software
  organizations, and I''d like a clean, constructed example to reason with. The pattern
  is this: several engineers each independently have the authority to take a risky
  action, and if any one of them takes it, the consequences fall on the whole company
  or project. The action is not obviously reckless; on each person''s own evidence
  it can look like the right call. But if the decision were made once, by the whole
  organization looking at all the evidence, the organization would not do it. I want
  the example to isolate that structural problem from ordinary bad explanations like
  misaligned incentives, poor communication, or incompetence.


  Construct a realistic scenario set inside a software company or an open-source project.
  Pick a concrete risky action an engineer could take unilaterally—such as disabling
  a safety check, bypassing a review gate, merging an experimental dependency into
  a shared codebase, or rolling back a rate limit before a launch—and make the benefit
  and the low-probability harm specific and quantified enough to do rough expected-value
  math with. Build the case so that all of the following hold.


  There are at least five people who each have the authority to take the same action
  on their own, and one person''s action is sufficient to trigger both the benefit
  and the harm for everyone. On the full information available across the company,
  the expected value of the action is negative, so a single joint decision-maker with
  all the evidence would not act. But for each individual, acting is defensible on
  their own partial information: each has a subjective expected value that is positive,
  and none of them is negligent, overconfident in a way their evidence cannot justify,
  or acting out of fear, ambition, or politics. Finally, the probability that at least
  one person takes the action should rise substantially as you add more such people,
  even though each added person is competent and well-intentioned and uses the same
  decision rule.


  After the scenario, do the following. First, show the rough calculation for one
