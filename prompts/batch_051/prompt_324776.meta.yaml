  I believe each ticket loses and (by the same rule) believe the conjunction that
  all lose, which is false." Or habit: "I refuse to believe conjunctive claims unless
  I believe each conjunct, yet I also allow for a general error rate in my own corpus
  of beliefs." Hmm.


