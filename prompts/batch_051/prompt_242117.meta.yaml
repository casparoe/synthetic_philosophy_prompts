  Quinn''s self-torturer: a device with settings 0 to 1000. At each setting n, the
  person receives a payment and can advance to n+1, whose pain is only imperceptibly
  greater than n. Each individual step seems rational: the slight increase in pain
  is not noticeable / negligible, and you get money. But after many steps you''re
  at 1000, in agony, and would not choose to jump from 0 to 1000 directly even for
  all the money. So pairwise preferences: for each n, state n+1 is preferred to n
  (or at least not dispreferred), but state 1000 is not preferred to state 0. If preferences
  are transitive, then by repeated application state 1000 is preferred/indifferent
  to 0, contradiction. So either preferences are intransitive, or each step is not
  actually rational, or there''s a vagueness problem.


  A "prove too much" argument could be:


  (1) For any two adjacent settings n and n+1, the difference in pain is below the
  threshold of discrimination; the only relevant difference is the extra money, so
  a rational agent should prefer n+1 to n (or be indifferent?).

  (2) Rational preference is transitive: if you rationally prefer A to B and B to
  C, you rationally prefer A to C.

  (3) By repeated application, the agent should prefer the highest setting to the
  lowest.

  (4) But no rational agent would prefer the highest setting to the lowest if choosing
  once.

  (5) So either transitivity fails for rational preference, or the sorites premise
  (1) is false.


  Where does it go wrong? Options: reject transitivity (some do); reject premise (1)
  because "imperceptible difference" doesn''t license indifference/preference — vague
  predicates and the failure of transitivity of "not noticeably different"; or deny
  that money at each step is decisive; or distinguish between preference over states
  and choices over actions in a dynamic choice problem (rationality of a sequence
  of choices vs a single choice). There''s a subtlety: the argument equivocates between
  "prefers n+1 to n given the option of one step" and "all-things-considered preference
  over states". Or the dynamic consistency point: a sophisticated chooser might refuse
  the whole sequence but accept each step; that''s a violation of dynamic consistency,
  not necessarily transitivity of preferences.


