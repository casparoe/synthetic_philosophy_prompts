  Dennett. Dennett holds that consciousness does not really exist: talk of qualia
  and an inner theater is a leftover from Cartesian dualism, and once we have a complete
  functional account of the brain there is no leftover experience to explain. On this
  view, the hard problem should be dissolved rather than solved, because the thing
  it asks about was never there in the first place.


