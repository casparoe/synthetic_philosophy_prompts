  Key in-the-weeds distinction cluster:

  - Musical works as types vs. as indicated structures vs. as action-types.

  - Performances as tokens/instances of the type.

  - Recordings: (i) documentations of performances, (ii) instantiations of works in
  a different medium, (iii) works in their own right (phonographic works), (iv) "enveloping"
  or "fabricated" performances that no human could generate whole.

  - The "studio as instrument" idea — rock records are constructed rather than performed.

  - The question of whether a token relation requires the property-bearing item to
  be generated through the specified normative relations (score compliance, interpretive
  intentions) or merely to stand in the right sonic/logical relation.


  Specific question with determinate answer: "Does a recording produced by selecting,
  splicing, overdubbing, and digitally altering many takes of a scored work instantiate
  that work in the same way a live performance does, or does it instantiate something
  else (a distinct phonographic work), or nothing at all?"


  Possible conclusions:

  1. Continuity: it''s a performance of the work, because compliance with score +
  originating in performances of the score + intended to present the work suffices.

  2. Distinctness: it''s not a performance — it''s either a distinct work or a representation
  — because a token of a performed work must be the causal product of a single performance-event
  (or at least of unbroken acts of music-making), and editing destroys the event structure.

  3. Split/revisionary: the type/token framework needs a third relatum — e.g., "work-versions"
  or "media of instantiation" — and the recording is a token of the work''s studio-medium
  version rather than its scored version.


  Considerations that decide: (a) whether identity of the token tracks the score-compliance
  relation or the causal-generative history; (b) what best explains the intuitive
  difference between editing a bad note out of a live take (small repair) and constructing
  a whole from fragments (no originating performance); (c) whether the composer''s
  declaration that the record is "the piece" can confer work-status on an artifact
  that could not voluntarily be performed; (d) whether our verdicts from classical
  splice records generalize to studio-assembled popular music or require different
  ontologies for different traditions.


  Approach: not empirical; conceptual. The fellowship essay would proceed by (i) fixing
  the explanatory target through paired constructed cases varying one parameter at
  a time (live-to-tape, splice-repair, multi-take assembly, fully synthesized realization),
  (ii) showing that existing type/token and "recording-as-work" views give stable
  but conflicting verdicts in the middle cases, (iii) arguing that the conflict comes
  from conflating two relations — instantiation and evidential access — and testing
  whether separating them dissolves the middle cases.


  Deliverable: an essay of c. 8,000 words defending one of the three conclusions.


  Failure: if the middle cases can''t be stabilized (judgments intractably vary for
  aesthetic rather than ontological reasons) or if the three positions turn out to
  be terminological variants. Also too big if it requires settling the entire type/token
  framework.


