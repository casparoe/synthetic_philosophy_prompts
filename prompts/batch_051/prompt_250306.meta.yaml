  uses life evaluation measured by the Cantril ladder: "Please imagine a ladder, with
  steps numbered from 0 at the bottom to 10 at the top. The top of the ladder represents
  the best possible life for you and the bottom of the ladder represents the worst
  possible life for you. On which step of the ladder would you say you personally
