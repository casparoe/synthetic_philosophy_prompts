  healthy life expectancy at birth, freedom to make life choices, generosity, perceptions
  of corruption. These explain much of the variation. Finland tops repeatedly.


  Criticisms: (1) it doesn''t measure emotional well-being/affect; (2) the Cantril
  ladder is culturally relative—"best possible life" depends on local reference points;
  (3) it''s essentially a mix of GDP, health, social support—so it''s closer to a
  quality-of-life index than "happiness"; (4) trying to maximize it might encourage
  policies that raise reported life satisfaction without raising felt well-being (Goodhart);
  (5) adaptation and comparison effects: people''s reports shift with expectations;
  (6) some argue countries shouldn''t try to "top" it because happiness isn''t a metric
  to maximize—it''s a byproduct (the "paradox of hedonism").


  Should a country try to top it? Arguments for: it tracks things that are plausibly
  good (income, health, social support, freedom, trust), and it''s a better target
  than GDP alone; if the ranking is noisy or partially off, it''s still a useful dashboard.
