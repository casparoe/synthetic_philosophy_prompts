  "In the bank cases, Hannah has visited the bank two Saturdays earlier and seen that
  it is open on Saturday mornings. In the low-stakes version she and her companion
  are not in any hurry, and competent speakers are happy to say that Hannah knows
  the bank will be open. In the high-stakes version the same evidence is present,
  but an error would now have serious financial consequences, and the same speakers
  tend to retract or deny the ascription. The cases are therefore standardly taken
  to show that knowledge is not settled by evidence alone.


  Epistemic contextualism handles this by treating ''knows'' as context-dependent.
  On this view the semantic value of ''knows'' shifts with the practical interests
  of the person making the knowledge ascription, so the same sentence ''Hannah knows
  the bank will be open'' can express a truth in the low-stakes context and a falsehood
  in the high-stakes context. Pragmatic encroachment agrees that knowledge is context-dependent
  in this way but locates the difference in the knowledge relation rather than in
  the word: it says that whether a subject knows depends in part on how much is practically
  at stake for the subject. Since Hannah''s stakes are higher in the second case,
  she fails to know in the second case even though her evidence is exactly the same.


  The two positions would come apart in a case in which an observer with low stakes
  is asked whether a subject facing high stakes knows something. According to contextualism,
  the ascription made by the low-stakes observer is true, because it is the observer''s
  context that sets the standard. According to pragmatic encroachment, the same ascription
  is false, because it is the subject''s stakes that determine whether she knows.
  I would therefore describe both views as holding that knowledge is interest-relative;
  they differ only over whether the interests that matter belong to the speaker or
  to the subject."


