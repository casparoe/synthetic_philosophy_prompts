  You are a professional speechwriter with a background in moral philosophy, but the
  speech itself must read as if it were written by the speaker: Maura''s closest friend
  and fellow volunteer, who helped her patch the boat each winter.


  Maura has just retired, at seventy-eight, from forty-two years as the unpaid keeper
  of the village foot-ferry — a small rowing boat she plied across a tidal river,
  without which the village would have been cut off from the station and the shops.
  She never charged, because she wanted it to belong to everyone. A handful of villagers
  quietly helped with money and repairs over the years, but most people crossed freely
  and never contributed anything; many simply assumed the ferry was provided by the
  council, or did not think about it at all.


  At her retirement gathering in the village hall, Maura has asked the speaker to
  say something she can live with: no comforting fiction about how the whole community
  kept the ferry going, because it didn''t; but also no scolding, because she does
  not regret the work and does not want to end as the village''s accuser. Above all,
  she wants the speech to make people understand, gently, what it means that the service
  they used all those years was not a feature of the landscape — a second nature —
  but something that existed only because a particular person kept deciding, day after
  day, to sustain it.


  Write the speech. The audience is the whole village: the regulars who helped, the
  many who never lifted a finger, the parish councillor who never found a budget line,
  and Maura herself. It should honour her honestly, say something true about free
  riding without using that term or lecturing, and leave the room understanding why
  taking a shared good without contributing is not a victimless thing — while still
  being a speech, not a sermon or an essay. Think carefully about what the speaker
  can and cannot say, and begin by briefly drafting two or three possible openings
  before choosing the strongest.


