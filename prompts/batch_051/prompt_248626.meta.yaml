  ---


  I''m part of a philosophy reading group that has spent the better part of a term
  stuck on the standing-to-blame debate, and I want a diagnosis of the impasse rather
  than a verdict on who is right. The two positions are entrenched. One side treats
  blame as, at bottom, an evaluation of another person''s conduct: a claim to the
  effect that the target acted wrongly and is blameworthy for it. On this view the
  evaluation is correct or incorrect purely in virtue of facts about the target and
  the act — whether it was wrong, whether the target was responsible, whether there
  were excuses. The blamer''s own record is therefore irrelevant to whether the blame
  is apt; a hypocrite may be morally compromised in a way that deserves separate criticism,
  but the blame they direct at someone who really did wrong is still true, apt, warranted.
  The other side treats blame as a social act with agent-relative conditions, closer
  to forgiving, inviting, or holding someone to account than to asserting a proposition.
  On this view the hypocrite has lost their standing: they can make a true evaluative
  statement, but they cannot perform the act of blame, just as someone can utter true
  words about an offense yet lack the authority to forgive it. Both camps accept the
  same surface facts — the target has done wrong, and the blamer is a hypocrite —
  so no one is confused about the case. What they dispute is whether the defect of
  hypocritical blame is an external moral flaw in the blamer or an internal failure
  of the blame itself.


  My working hypothesis is that the stalemate is partly a dispute about how much of
  the phenomenon "blame" is supposed to cover: one side is answering a question about
  the evaluation, the other about the act of holding someone to account, and each
