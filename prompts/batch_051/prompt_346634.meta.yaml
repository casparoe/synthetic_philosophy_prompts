  Domain: heterogeneity problem for hedonism.


  Argument idea:

  (1) Hedonism is the view that a life goes well for a person to the extent it contains
  pleasure and avoids pain.

  (2) Pleasure is a kind of experience: a mental state with a distinctive positive
  felt quality ("pleasantness").

  (3) But the things we count as pleasures — eating when hungry, solving a puzzle,
  hearing a child laugh, relief from fear — are too heterogeneous to share a distinctive
  felt quality.

  (4) If hedonism is true and pleasure is what (i) says it is, all these pleasures
  must share the distinctive felt quality mentioned in (2).

  (5) Therefore, either hedonism is false or these are not all pleasures; since they
  plainly are all pleasures, hedonism is false.


  Fault options: (2) assumption that pleasure is a sensation with felt quality (the
  hedonist could deny; pleasure could be a determinable, or a functional/attitudinal
  property like "liking" or "being pleased by"). Or the move in (4)/(5) — the heterogeneity
  of the objects of pleasure vs states of pleasure: the states might share a homogeneous
  "pleasure" element while differing in content. Actually the classic response: the
  pleasantness feeling is one thing; the experiences differ because of their non-hedonic
  components (content, sensory modality, etc.). Step (3) conflates the experience
  as a whole with its hedonic component. The argument treats "eating when hungry"
  and "solving a puzzle" as wholes, and says they have no common felt quality — but
  the hedonist says the common felt quality is the pleasantness, which each contains
  alongside other elements. So step (3) fails: heterogeneity of total experiences
  doesn''t imply heterogeneity of their hedonic aspects. This is an equivocation between
  "pleasure" (the hedonic state/quality) and "pleasurable experience" (the total experience).
  That''s a nice, subtle fault.


