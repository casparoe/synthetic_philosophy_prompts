  - V1: A robot may lie to a frightened patient that a minor test will hurt, because\
  \ the lie prevents needless distress.\n- V2: A robot may not lie to a patient that\
  \ their cancer is terminal, even though the truth causes severe distress.\n- V3:\
  \ A robot may push an aggressor out of the way to reach a child in danger, even\
  \ if the aggressor falls and breaks an arm.\n- V4: A robot may not kill a bystander\
  \ to harvest organs to save five patients.\n\nPossible rules:\nR1 (Kantian/person-as-end):\
  \ Don't use a person merely as a means; don't harm the innocent. Lying violates\
  \ truth-telling (dignity) but little lies are okay? Hmm V1 and V2 inconsistent if\
  \ rule is \"never lie.\" Actually V1 permits lying, V2 forbids. Need rule: may lie\
  \ for trivial beneficence but not about serious matters? \n\nR2 (Asimov-style harm-avoidance\
  \ with autonomy): may do X if it prevents immediate physical harm and doesn't override\
  \ an agent's own higher-order interests. V2: lying about diagnosis prevents psychological\
  \ harm but undermines autonomy, forbidden. V1: minor test, the patient's autonomy\
  \ not seriously implicated? Hmm.\n\nThis may be too messy.\n\nAlternatively, use\
  \ Asimov's Three Laws directly with traditional examples and constructed edge cases:\n\
  A person (friend) believes: (1) A robot must not harm a human being, but \"harm\"\
  \ includes psychological harm. (2) A robot must obey a human's command, but only\
  \ if obeying doesn't cause harm. (3) A robot must preserve itself, but only if that\
  \ doesn't conflict. Then ask predict verdicts on cases: a robot ordered by its owner\
  \ to steal; a robot that must lie to prevent a person's hurt feelings; a robot that\
  \ must choose between disobeying and failing to save. Hmm.\n\nType A might be more\
  \ novel but harder to make clean. Type C and B are safer.\n\nLet me re-read the\
