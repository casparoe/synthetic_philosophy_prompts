  \ be good.\n\nLet me consider domain 1 + type C more.\n\nPrompt:\n\"The Three Laws\
  \ of Robotics were put forward as a proposal for making autonomous machines safe:\
  \ build the rules in as fundamental, prioritized constraints, with harm-avoidance\
