  \ you. On which step of the ladder would you say you personally feel you stand at\
  \ this time?\" That's a real text, so I should not quote it verbatim. I can paraphrase.\
  \ The six factors are: GDP per capita, social support, healthy life expectancy,\
  \ freedom to make life choices, generosity, perceptions of corruption. These are\
  \ factual details but widely known and not a \"specific work\"? Actually they are\
