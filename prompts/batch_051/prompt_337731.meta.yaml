reasoning_summary: "Let me think about which domain and type to combine. The domains:\n\
  \n1. Asimov's Three Laws of Robotics as an alignment proposal: why they fail and\
  \ what they get right\n2. Maimonides' views on animal sacrifice\n3. World happiness\
  \ rankings: do they measure happiness, and should a country try to top them?\n4.\
  \ Do LLMs understand? (the stochastic parrots debate)\n5. Eliciting latent knowledge\
  \ from AI systems\n\nTypes:\nA. Predict/recommend a verdict on a new case from earlier\
  \ verdicts (track record type)\nB. Ask what philosophical commitments a practice/policy/institution\
  \ presupposes\nC. Ask whether a well-known argument survives a specific new development\
  \ or changed assumption\n\nNeed to write a prompt from a non-academic perspective,\
  \ formal/polished, short, American English, no citations needed, in the weeds but\
  \ meaningful for non-search model. Don't quote from memory. Inject new/niche ideas.\n\
  \nLet me consider combinations.\n\nDomain 1: Asimov's Three Laws as alignment proposal.\
  \ Could fit type C: \"Asimov's Three Laws were argued as... does the argument survive\
  \ LLMs/modern AI systems that don't have explicit rules?\" That's actually similar\
  \ to example domain 2 with orthogonality thesis. But the domain instructs \"why\
  \ they fail and what they get right\" — could be type C: \"Asimov proposed three\
  \ laws as a safety mechanism for robots with hardwired rules and human-like reasoning.\
  \ Today's AI systems are trained on human text and don't have explicit rules or\
  \ common sense like Asimov's robots. Does the Three Laws argument survive?\" Hmm.\n\
  \nCould fit type B: What philosophical commitments does a practice presuppose? E.g.,\
  \ the practice of encoding the Three Laws in robotics/AI safety discussions — but\
  \ that's less concrete practice.\n\nDomain 3: World happiness rankings. Could fit\
  \ type B nicely: \"The World Happiness Report ranks countries by self-reported life\
  \ satisfaction. Does the practice presuppose that happiness is a single measurable\
  \ thing, that it can be compared across countries/cultures, and that governments\
  \ should maximize it?\" This is a practice/institution (happiness rankings) presuppose.\
  \ But the domain asks \"do they measure happiness, and should a country try to top\
  \ them?\" This fits type B pretty well: practice = world happiness rankings; ask\
  \ what it presupposes. Need inject niche ideas: e.g., the rankings use six factors\
  \ (GDP, social support, healthy life expectancy, freedom, generosity, corruption)\
  \ as predictors, but the actual ranking is by Cantril ladder responses. The practice\
  \ presupposes felicific calculus? Maybe ask about whether the rankings presuppose\
  \ that self-reports are interpersonally comparable or that national average matters.\n\
  \nDomain 5: Eliciting latent knowledge. Could fit type B: practice = ELK (training\
  \ an AI to report what it knows even under pressure). But ELK is a research problem,\
  \ not an existing practice really. Could fit type C: an argument that... Does the\
  \ ELK argument survive... hmm.\n\nDomain 4: Do LLMs understand (stochastic parrots\
  \ debate). Could fit type B: practice = training models to predict next token; what\
  \ does that presuppose about meaning/understanding? Or type C: \"The stochastic\
  \ parrots argument claimed LLMs merely stitch together surface statistics. Does\
  \ that argument survive models with reasoning traces/in-context learning...?\" Nicely\
  \ fits type C: The stochastic parrots argument was made about 2019-era models; today's\
  \ models are trained with RLHF, chain of thought, more? But need be careful not\
  \ to be too current/newsy. Could be good.\n\nDomain 2: Maimonides on animal sacrifice.\
  \ Could fit type B (practice/institution: biblical animal sacrifice in the Temple).\
  \ Ask what philosophical commitments the institution of animal sacrifice presupposes?\
  \ But the domain is Maimonides' views. Type A: Maimonides' verdicts on specific\
  \ commandments/cases? Hmm. He rules on which animals are sacrificed, when, why.\
  \ Could ask predict his verdict on a new case: e.g., Maimonides holds that sacrifices\
  \ were a concession to idolatrous habits, but also that prayer is the \"service\
  \ of the heart.\" Predict what he'd say about a proposal to reinstate animal sacrifice?\
  \ Too speculative and niche; small LLMs may not have memorized details. Risky.\n\
  \nLet me weigh.\n\nThe user wants prompts that are \"in the weeds\" but accessible.\
  \ The prompt should be self-contained and not rely on obscure facts. So we can describe\
  \ the practice/argument in the prompt itself.\n\nI think the strongest combinations:\n\
  \nOption B + Domain 3 (World happiness rankings). Concrete practice: ranking countries\
  \ by average self-reported life satisfaction (Cantril ladder). Ask what theory of\
  \ happiness/wellbeing it presupposes, whether it presupposes interpersonal comparability,\
  \ whether it assumes happiness is one thing, and whether the practice can be justified\
  \ without those assumptions. This is good but perhaps a bit standard — could still\
  \ be in the weeds by asking about the discrepancy between how rankings are compiled\
  \ and how they're used.\n\nOption C + Domain 1 (Asimov's Three Laws). Well-known\
  \ argument (Three Laws as a safety design) and new development (modern AI systems\
  \ trained rather than programmed, don't reason like Asimov's robots). Ask whether\
  \ the argument survives. But the domain prompt asks about \"why they fail and what\
  \ they get right\" — type C is \"does argument survive specific new development.\"\
  \ Could write: \"Asimov proposed the Three Laws as axioms built into robot brains;\
  \ the argument is that safe AI comes from explicit, inviolable rules ranked by priority.\
  \ Today's systems acquire behavior from training rather than explicit rules. Does\
  \ that development undercut the argument, or does it just change how the rules would\
  \ need to be implemented? And does the underlying insight survive in weaker form?\"\
  \ This is decent.\n\nOption C + Domain 4 (stochastic parrots). The argument \"LLMs\
  \ don't understand, they just manipulate form\" made under assumptions about next-word-prediction\
  \ training and lack of grounding. New development: models that are trained with\
  \ reinforcement from human feedback for chat, instruction following, and may use\
  \ chain-of-thought reasoning? Or the development of multimodal models. Ask whether\
  \ the stochastic parrots argument survives. This is compelling and in the weeds.\n\
  \nOption A + Domain 1? Predict how someone who endorsed the Three Laws would rule\
  \ on new cases. Interesting: Asimov himself actually had a track record across his\
  \ stories, where he tested edge cases. But asking about Asimov's own stories edge\
  \ cases would require memorization. Could instead construct our own person: \"My\
  \ colleague defends the Three Laws as the right blueprint... she thinks a robot\
  \ may not harm a human, even to save ten, and that a robot must obey a command to\
  \ reveal private data unless it causes harm... Would she say a robot should lie\
  \ to a human to prevent them from being hurt? Can obey and protect conflict...\"\
  \ Hmm.\n\nActually type A could combine with domain 1: asker reports someone's verdicts\
  \ on robot law cases (the person's stance on Three Laws refined into specific judgments)\
  \ and asks predict on new case. This is neat: we can craft new cases that force\
  \ rule identification. But the domain says \"Asimov's Three Laws as an alignment\
  \ proposal: why they fail and what they get right\" — type A can work but the prompt\
  \ asks to predict a person's verdicts, not necessarily evaluate the laws. Could\
  \ still incorporate.\n\nLet me think about which yields the best prompt per instructions:\
  \ \"Pick whichever type you can combine best with one of the domains.\"\n\nI think\
  \ I should write one strong prompt. Let's explore a few candidates in detail.\n\n\
  Candidate 1: Type C + Domain 4 (stochastic parrots debate).\n\nPrompt draft:\n\"\
  The original stochastic parrots argument claimed that a language model trained only\
  \ to predict the next token, with no connection to the world outside its training\
  \ text, cannot be said to understand language; it is rearranging statistical regularities\
  \ of form. Suppose the premise changes: a model is trained the same way but then\
  \ fine-tuned by trial and error to follow instructions, to say when it doesn't know,\
  \ and to check its own reasoning out loud before answering. Does the argument survive\
  \ this development? Which premise does it put pressure on—the claim that next-token\
  \ prediction can't yield understanding, or the claim that grounding is unnecessary—and\
  \ is there a repaired version of the argument that still says something important?\"\
  \n\nThis is decent but might be a bit off: \"fine-tuned by trial and error to follow\
  \ instructions, to say when it doesn't know, and to check its own reasoning out\
  \ loud\" is a specific development. Does it genuinely change assumptions? The stochastic\
  \ parrots argument says no understanding regardless of downstream tuning? Actually\
  \ original Bender & Koller say that a model trained only on form cannot learn meaning,\
  \ because meaning is connection between form and communicative intent, external\
  \ referents. RLHF adds a reward signal from humans, which is a bit of grounding\
  \ (human preferences). Chain-of-thought is still text. This gives bite. The prompt\
  \ can ask whether the argument survives.\n\nHowever, \"Do LLMs understand?\" is\
  \ a highly discussed topic; but we can make it in the weeds by focusing on the specific\
  \ argumentative structure.\n\nCandidate 2: Type B + Domain 3 (world happiness rankings).\n\
  \nPrompt draft:\n\"The World Happiness Report ranks countries by their residents'\
  \ average answer to a question about life satisfaction, yet the report also emphasizes\
  \ six factors: income, social support, healthy life expectancy, freedom, generosity,\
  \ and absence of corruption. The ranking itself, though, is based purely on self-reports.\
  \ What theory of happiness does this practice presuppose? Does it presuppose that\
  \ happiness is one thing that can be reported on a 0-to-10 scale and meaningfully\
  \ averaged across people and countries? Or is the practice compatible with the view\
  \ that happiness is not a single measurable quantity? And what would a country have\
  \ to believe to be rational in trying to rise in the rankings?\"\n\nThis fits type\
  \ B: practice = ranking countries by life satisfaction while advertising predictors.\
  \ Deliverable: implicit theory of happiness/wellbeing. Could also ask \"should a\
  \ country try to top them?\" The domain asks that. The prompt could ask whether\
  \ the practice presupposes a utilitarian/felicific view, whether it licenses governments\
  \ to maximize.\n\nThis is self-contained, accessible, no citations needed. It's\
  \ somewhat in the weeds: the distinction between the ranking's basis and its six\
  \ factors is a nice detail. The asker doesn't need philosophical vocabulary. This\
  \ may be the strongest for type B.\n\nCandidate 3: Type C + Domain 1 (Asimov's Three\
  \ Laws).\n\nPrompt draft:\n\"Asimov's Three Laws were designed for robots whose\
  \ behavior comes from explicit, prioritized rules that the robot can reason about.\
  \ The argument was that safety can be guaranteed by putting the right rules directly\
  \ into the machine, with self-preservation last. But today's AI systems are not\
  \ given a list of rules; they acquire behavior by training on human data and then\
  \ being steered by feedback. Does the Three Laws argument survive this change? Pinpoint\
  \ which premise is actually under pressure, and say whether some modified version—perhaps\
  \ scoring behavior instead of hardwiring rules—preserves what was right about the\
  \ original.\"\n\nThis is good and directly addresses \"why they fail and what they\
  \ get right.\" But it may overlap heavily with the example given for type C (orthogonality\
  \ thesis and modern AI) in structure. But the user said examples only illustrate\
  \ type; don't reuse opening/wording/structure. Our wording differs.\n\nCandidate\
  \ 4: Type A + Domain 1.\n\nPrompt:\n\"A friend of mine thinks safety in AI should\
  \ look like Asimov's scheme, and she's made a series of rulings. She says a carebot\
  \ may lie to a patient to prevent immediate panic, because the lie prevents psychological\
  \ harm. She says a carebot may not lie to a patient about their terminal diagnosis\
  \ even if that lie would reduce suffering, because it substitutes the robot's judgment\
  \ for the patient's. She says a military robot may kill one attacker if that is\
  \ the only way to save five hostages, because letting five die would be harm by\
  \ inaction, but it may not kill a hostage to save the five. Do you think she'll\
  \ say a self-driving car may swerve to hit one pedestrian to avoid five? What about\
  \ a chatbot that disobeys a clear instruction to write a harmful script? I'm less\
  \ interested in her answers than in the rule she's running, the other rules that\
  \ fit her verdicts just as well, and which further case would best tell them apart.\"\
  \n\nHmm, this is type A: report earlier verdicts, predict new case, identify rules.\
  \ Nice. But the domain \"why they fail and what they get right\" fits less directly.\
  \ The prompt asks about a friend's Three-Laws-ish scheme rather than the Three Laws\
  \ themselves. It could be very much in the weeds for alignment but doesn't ask why\
  \ they fail. Could work well though. The user's example is exactly about consciousness\
  \ verdicts; this mirrors with safety cases.\n\nBut one risk: the \"earlier verdicts\"\
  \ need to be jointly consistent with more than one plausible rule and the new case\
  \ must split rules. That's the key work. Crafting genuinely ambiguous cases is hard.\
  \ Let's see.\n\nFriend's verdicts:\n1. Carebot may lie to prevent immediate panic\
  \ (prevent psychological harm).\n2. Carebot may not lie about terminal diagnosis\
  \ even to reduce suffering (no substituting judgment? no paternalism).\n3. Military\
  \ robot may kill attacker to save five hostages (prevent harm to five, but killing\
  \ is harm? Actually killing attacker harms attacker; allowed).\n4. May not kill\
  \ a hostage to save five (no using innocent as means).\n\nPotential rules:\n- Deontological:\
  \ don't kill innocents / don't use people as mere means; may allow killing an aggressor.\n\
  - Utilitarian-ish: minimize harm, but terminal diagnosis lie is about autonomy/truth-telling\
  \ overriding welfare.\n- Rule: the robot may act to prevent immediate physical harm\
