  \ hitting one to save five is trolley-like: redirect threat? If car swerves, the\
  \ one is innocent bystander; likely she'd say no, aligning with no killing innocents).\
  \ But the prompt asks \"do you think she'll say X? What about Y?\" We can ask multiple\
  \ new cases to distinguish rules.\n\nMaybe better: ask about \"a car may swerve\
  \ to hit one pedestrian to avoid five\" (utilitarian harms one to save five, no\
  \ aggressor). Predictions diverge: if rule is \"may harm to prevent greater harm\"\
  \ (verdict 3), then yes; if rule is \"never kill innocents\" (verdict 4), then no.\
  \ Verdict 3's reasoning \"letting five die would be harm by inaction\" suggests\
  \ doing harm vs allowing harm distinction. The swerve case is doing harm to one\
  \ vs allowing five (or redirecting). The friend may distinguish based on whether\
  \ the one person is \"involved.\" This splits.\n\nAnother new case: \"chatbot disobeys\
  \ a clear instruction to write a harmful script\" — obey vs protect conflict: The\
  \ Second Law says obey unless conflicts with First. If the script harms others,\
  \ she'd say it may refuse. That's less splitty.\n\nMaybe a better type A: \"A judge/board\
  \ has been applying the Three Laws to driverless cars... their past decisions...\"\
  \ Hmm.\n\nActually the type A instructions: \"Write the earlier verdicts so that\
  \ they are jointly consistent with more than one plausible rule, and choose the\
  \ new case so that at least two of those rules diverge on it.\" The prompt should\
