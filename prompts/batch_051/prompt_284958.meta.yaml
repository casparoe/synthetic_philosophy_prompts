  Last month, two of my colleagues at the logistics firm where I work spent most of
  a planning meeting arguing about how we should set the deadline and budget for a
  rewrite of our order-fulfillment system, and I have been turning the argument over
  ever since because each of them kept escaping the other''s traps without either
  clearly winning. The engineering lead has produced a granular plan: 147 tasks, each
  with an owner and a dependency map, leading to a go-live date eleven weeks out.
  Everyone in the room also knew the industry record for internal platform migrations
  of this scope: on average those projects run about twice as long as initially planned,
  and only about a third land within 25 percent of the original date. Our team, however,
  has shipped its last three projects on time.


  Jonas defended the granular plan. "The industry base rate is a blunt instrument,"
  he said. "It bundles in companies that changed scope midstream, teams that lost
  their one indispensable developer, systems that turned out to be built on spaghetti
  code. We know this system; we studied the dependencies. Our plan is detailed precisely
  because the details matter. If I double the timeline just because the industry average
  doubles, I''m throwing away information we actually have. Granularity is not decoration;
  it is how you surface the couplings that cause slips, and we surfaced them." Maya
  pushed back. "Everyone who is about to run late has a granular plan. That is why
  the base rate exists: detailed simulations keep failing in the same systematic way.
  A detailed plan simulates the project going the way you currently understand it.
  It cannot contain the event you have not imagined — the API that does not do what
  the documentation says, the reorg that takes away your database specialist, the
  compliance rule that changes in month two. The outside view does not say our specific
  knowledge is worthless. It says our knowledge should adjust a distribution, not
  replace it with a story."


  Jonas would not concede. "Adjust how? Which bucket do I use? Projects our size?
  All firms? The last five migrations at this company? The choice of reference class
  does more work than the base rate does, and I can make the answer come out almost
  anywhere by choosing differently. And for the new tax-calculation module there is
  no comparable project in our history at all. At that point the outside view is just
  a guess wearing a lab coat." Maya answered, "That is why you fix the reference class
  in advance, write down the adjustments before you know what answer you want, and
  use the class of projects that looked novel at the time for the novel parts. Novel-looking
  projects still, on average, ran late. And I am not saying kill the project. I am
  saying do not let the inside plan masquerade as the median outcome."


  Then Jonas made what I thought was his strongest move. "A plan is not only a forecast.
  The team that is told the realistic date is twice as far out will staff differently,
  protect less aggressively, and work will expand into the space allowed for it. The
  inside plan may be optimistic, but optimism is part of the production process. Plan
  for the pessimistic base rate and you make the base rate worse." Maya would not
  grant it. "Keep the inside plan as an internal pacing target. But the date you give
  the board and the budget you sign should be the outside-view date. If you genuinely
  believe eleven weeks, you will understaff and under-procure, and then the miss becomes
  a self-fulfillment of its own." At that point Jonas played the card everyone expected.
  "Three on-time launches in a row. The relevant outside view for this project is
  this team, not the whole industry. Three for three is not nothing." Maya replied,
  "Three for three is exactly the sort of small sample that lets a team become the
