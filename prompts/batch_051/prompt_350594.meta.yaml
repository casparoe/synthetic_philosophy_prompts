  "I''ve been trying to reconcile two parts of the literature on autonomous systems,
  and I''d like help working through the argumentative structure rather than the policy.
  The standard argument for the so-called responsibility gap runs as follows. For
  someone to be properly held responsible for a harm, they must have been able to
  foresee and control the relevant actions. With a sufficiently autonomous learning
  system, the designers cannot predict how the system will behave in new circumstances,
  the operator cannot intervene in every decision, and the system itself is not a
  candidate for blame or punishment in the ordinary sense. So for at least some harms,
  no one satisfies the conditions; responsibility is gappy. This argument was developed
  mostly with systems that were built around a specific design specification, a reward
  function, or a control architecture.


  Now consider the systems that have become common in the last few years: large language
  model agents pretrained on huge amounts of human text, given goals and guardrails
  in natural language, and capable of producing after-the-fact explanations of what
  they did and why. They are still unpredictable, and their explanations can be wrong
  or self-serving. But the operator has new kinds of control—instruction, veto, interrogation,
  stated policies—and the system has at least the outer form of a reason-giver. Does
  the responsibility-gap argument survive this development? Which premise is under
  pressure, and is there a repaired version that still does the work the original
  argument was meant to do? I''m interested in whether the gap disappears, moves,
  or simply changes its shape."


