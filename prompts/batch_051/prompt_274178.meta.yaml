  connected to it; both agree some form of transfer/reform is required; both agree
  that the identity of the duty-bearer and the metric matters. Disagreements: whether
  the wrong itself (not just its present effects) grounds the duty; whether the duty
  depends on showing present beneficiaries are identifiable; whether symbolic measures
