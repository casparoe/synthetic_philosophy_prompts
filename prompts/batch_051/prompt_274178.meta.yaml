  harm suffered or to advantage retained; whether reparations should be individual-to-individual
  or collective. Cruxes: e.g., whether a "right to rectification" persists across
  generations; whether present beneficiaries can incur liability without wrongdoing;
  whether the passage of time or intervening events can dissolve or weaken claims.


