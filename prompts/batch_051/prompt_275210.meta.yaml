  Desiderata for a theory of material constitution. Let me brainstorm the actual criteria:


  Phenomena/cases:

  1. The statue and the lump: A lump of clay is shaped into a statue. The lump existed
  before the shaping; the statue came into being at the shaping. Are they one object
  or two? If two, they coincide (occupy the same place, made of the same matter) but
  differ in persistence conditions and sortal properties (the lump can survive squashing;
  the statue cannot).

  2. Tibbles/tail (or a cat losing its tail): Tibbles is a cat; Tib (the cat-minus-tail)
  is a proper part. If Tibbles loses his tail, does Tib survive? Does Tibbles become
  Tib? Did Tibbles and Tib coincide before? This tests the problem of the many / undetached
  parts.

  3. The ship of Theseus: gradual replacement of planks; identity over time under
  complete material replacement. Tests persistence conditions and the need for sortals.

  4. The grounding problem: if the statue and lump share all their parts and matter,
  what makes them different in kind/properties? If nothing, then the difference is
  ungrounded — a problem for coincidence views.

  5. The problem of the many: a cloud and its many possible boundaries; many aggregates
  of water droplets differing by one droplet. Tests whether constitution yields too
  many objects.

  6. Dion and Theon: a person and their body-minus-foot proper part; if the foot is
  amputated, who survives? Tests whether there is one person or two coincident persons,
  and the "thinking parts" problem (too many thinkers).

  7. The "one or two" counting question: if you put a statue and a lump on a scale,
  is there one thing or two? Common-sense counting is sortal-relative (count by statue
  vs by lump), a theory should explain why.

  8. Leibniz''s Law / indiscernibility of identicals: if the statue and lump have
  different properties (the lump can survive squashing, the statue cannot), they cannot
  be identical. A theory must either deny the differing properties, deny the principle,
  relativize properties to times/sortals, or accept two coincident objects.

  9. Material plenitude/uniqueness of composition: whether every matter-filled region
  hosts one object or many. Tests whether the view overgenerates.


  Distinctions not to collapse:

  - Constitution vs identity (being made of the same matter vs being the same object).

  - Numerical identity vs spatiotemporal coincidence.

  - Object vs matter/stuff.

  - Sortal vs non-sortal counting.

  - Persistence conditions vs momentary properties.

  - De dicto vs de re modal properties (the lump is possibly squashed; the statue
  is not — but maybe the statue could be made of different clay?).

  - Essential vs accidental properties.


  Results/logic to respect:

  - Leibniz''s Law.

  - The necessity of identity (if a=b then necessarily a=b) — Kripke. Maybe.

  - Common sense counting intuitions.

  - The principle that no two objects of the same kind can coincide (Locke? "two things
  of the same kind cannot be in the same place at the same time" — could mention but
  avoid quote).

  - Supervenience: objects'' kind/properties shouldn''t float free of microstructure
  — grounding problem.


  Jointly unsatisfiable subsets:

  - (a) Leibniz''s Law, (b) the statue and lump differ modally, (c) the statue and
  lump are identical. Can''t have all three. Or (a) the lump exists before shaping,
  (b) the statue does not exist before shaping, (c) the lump and statue are identical
  — inconsistent.

  - (a) There is exactly one object in the region, (b) the statue survives only if
  shape retained, (c) the lump survives squashing — inconsistent.

  - (a) No two material objects coincide, (b) the statue and lump are both material
  objects, (c) they are distinct — inconsistent.

  - The "thinking parts" problem: endurantism + unrestricted composition + personhood
  leads to too many thinkers; so these jointly force something to give.


