  "I am a novelist, and I hope this is not too far from my field. A screenwriter friend
  and I have been discussing whether a character can genuinely intend to do something
  painful tomorrow as a condition of being paid today, with the full intention of
  backing out later. He summarized the philosophical thought experiment he called
  the toxin puzzle as follows. An eccentric billionaire offers you one million dollars
  if, at midnight tonight, you genuinely intend to drink a vial of toxin tomorrow
  afternoon. The toxin will make you painfully ill for a day but has no lasting effects.
  The money will be in your bank account before the time for drinking arrives, and
  you are free not to drink once you have been paid. My friend''s gloss was that the
  puzzle demonstrates two things: first, that you cannot rationally form the intention,
  because you know you will not drink when the time comes; second, that this shows
  intentions are not the sort of mental state that can be commanded for a reward,
  since rationality prevents the mind from intending an act it has no reason to perform.
  He added that the puzzle also shows that an intention can be rational only if the
  intended action is rational at the moment of execution, so self-binding promises
  backed by future self-harm are always irrational. I want to know whether his interpretation
  is faithful. Please go through his claims one by one, distinguish the parts that
  a careful philosopher would accept from the parts that overstate or conflate distinct
  issues, and tell me what Kavka''s puzzle actually commits one to, if anything, about
  intention and rationality. I am not looking for a reading list; I want the conceptual
  audit I can use when writing a character who tries to make a costly resolve credible."


