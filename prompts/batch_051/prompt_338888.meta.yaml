  Kripke''s dogmatism paradox (from "On Two Paradoxes of Knowledge," 1972? Actually
  Gilbert Harman? Let me recall). The paradox: Suppose S knows p. Suppose S knows
  that p entails q. Then by closure, S can come to know q by deduction from p. Now
  take q to be "any evidence against p is misleading (false/doesn''t refute p)." Since
  p entails that any evidence against p is misleading, S can know this a priori/deductively.
  Then S can ignore any future counterevidence, because S knows it''s misleading without
  examining it. This conflicts with our sense that rational inquirers should examine
  counterevidence.


  There''s debate about whether closure is the culprit, or the paradox shows something
  about evidence. Some say the right response is to reject single-premise closure
  under known entailment, or reject the KK-style move, or reject the idea that knowing
  p gives "evidential immunity."


