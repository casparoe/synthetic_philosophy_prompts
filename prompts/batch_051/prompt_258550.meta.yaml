  Over the past decade or so, the debate about griefbots — interactive simulations
  of a deceased person, trained on their texts, emails, voice recordings, or social
  media — has settled into an impasse that I find more interesting than the usual
  policy back-and-forth. One side argues that, at least when freely chosen by the
  bereaved and clearly disclosed as a simulation, griefbots can be a legitimate and
  even valuable tool of mourning: they give the bereaved continued access to the deceased''s
  characteristic ways of speaking and responding, they fit a well-supported picture
  of grief in which bonds with the dead are not simply severed but renegotiated, and
  they extend practices that are already widely accepted, such as reading old letters,
  watching home videos, or talking at a grave. The other side argues that something
  importantly different happens when the "other side" of the interaction is procedurally
  generated and responsive: it manufactures the appearance of a relation with someone
  who cannot consent, cannot correct, and cannot be changed by the exchange; it risks
  turning mourning into an open-ended loop rather than a process with a direction;
  and it licenses companies to monetize the bereaved by promising continued contact
  with the dead, even where the result is a flattened, sycophantic, or fabricated
  version of the person.


