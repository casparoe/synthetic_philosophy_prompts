  I am a retired natural scientist — I spent my career in geology — and I have only
  recently begun reading political philosophy in a serious way. I find that my training
  keeps steering me toward concrete comparisons, and one comparison has been troubling
  me. I hope you can help me think it through systematically.


  Consider three established practices for addressing the underrepresentation of groups.


  The first is American university admissions. For roughly half a century, admissions
  officers were permitted to weigh an applicant''s race as one "plus" factor among
  many in a holistic, individualised review, while it remained unconstitutional to
  set aside a fixed number of places for any racial group. In 2023 the Supreme Court
  ended the use of the "plus" factor as well, while indicating that an applicant''s
  own discussion of how race shaped them may still be considered as evidence of individual
  qualities, and that universities may still pursue diversity through race-neutral
  means of selection. What strikes me is the consistency at the centre: the fixed
  numerical quota, the one device that would guarantee a specified racial composition,
  was the one device forbidden throughout.


  The second is India''s reservation system. The Constitution of India reserves a
  fixed percentage of places in public higher-education institutions and in government
  employment for members of the Scheduled Castes, Scheduled Tribes, and Other Backward
  Classes — altogether on the order of half of all such places. Here the quota is
  not only lawful; it is the constitutionally mandated remedy. The instrument American
  courts treated as the paradigmatic constitutional wrong is, in India, the centrepiece
  of the constitution''s response to caste inequality.


  The third is Norway''s quotas for corporate boards. Norwegian law requires public
  limited companies to ensure that each sex holds at least 40 percent of board seats,
  enforced by escalating sanctions up to dissolution. Again a fixed share is the chosen
  instrument, this time for sex rather than caste or race, and this time applied to
  private corporate governance rather than education or public employment.


  The three systems thus disagree not merely about policy but, it seems to me, about
  what kind of wrong underrepresentation is, and what kind of good proportional presence
  achieves. A quota seems to assume that the group''s share itself matters: that a
  numerical shortfall is itself the injury and its correction itself the remedy. A
  holistic "plus" seems to assume that the injury lies in how individuals are treated,
  so the remedy must remain individual in form, and a group-level guarantee would
  be a fresh wrong. The post-2023 American position seems to assume something further:
  that race may count only when it passes through an applicant''s own account of their
