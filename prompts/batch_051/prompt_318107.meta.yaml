  "Lately I have been bothered by a double standard in how people — including me —
  settle disputes between a theory and an intuition. I will describe two cases and
  then ask whether there is any principle that saves them from being inconsistent.


  In physics, when a theory conflicts with intuition, the intuition is expected to
  give way. Special relativity says that whether two events are simultaneous depends
  on the observer''s motion, and that moving clocks run slow. These claims are wildly
  counterintuitive; almost nobody would arrive at them by trusting their gut. Yet
  nobody says, ''this theory must be false because it violates our sense of how time
  is.'' What carries weight is that the theory is mathematically precise and has survived
  precise experimental tests.


  In ethics, the rule seems reversed. Consider a principle that says the right action
  is always the one that maximizes total welfare. When someone points out that this
  principle would, in a carefully described case, require killing one healthy person
  to save five dying patients, the standard move is to regard that implication as
  a refutation of the principle. The intuition is allowed to veto the principle, even
  when the principle is simple, general, and does well at explaining a wide range
  of everyday moral judgments.


  So: a theory with wide explanatory power conflicts with an intuition; in physics
  we call the intuition unreliable, in ethics we call the theory false. Is there a
  principled difference between the cases, or is this just a habit? If you think there
