  ''a'' and a double-storey ''a'' share almost no features, yet we classify them together
  effortlessly; meanwhile two cuts can differ by a tiny amount in stroke weight and
  one stays an ''a'' while the other becomes a ''d'' in the right context. I''d like
  a decision tree that sorts the main positions on what constitutes letter-identity
  in a script..."


  Hmm. Let me think about the logical space of positions:

  - Platonist/essentialist: each letter has an ideal form; instances are instances
  by resembling it.

  - Prototype/category view: ''a'' is a radial category around exemplars; Rosch.

  - Feature/structural view: abstract strokes, topology (one bowl + one stem?).

  - Functional/contrastive view: a letter is ''a'' because it plays the role of /a/
  in a writing system, distinct from other glyphs; identity is by commutation (minimal
  pairs).

  - Historical/lineage view: a glyph is an ''a'' because of descent from a historical
  form.

  - Deflationary/nominalist: there is nothing in common; labels are conventions/training.

  - Usage/contextual: identity fixed by reader habits and context (a mark is an ''a''
  if the community reads it as one).


  The decision tree branches:

  1. Is there any mind-independent fact about a mark''s being an ''a'', or is it fixed
  by convention/use?

  2. If yes: does identity reside in visual form (shape), or in role within a system
  (function)?

  3. If visual: is there a single specified shape (ideal/features), or graded resemblance
  to exemplars?

  4. If functional: is it function for reading (contrast with other letters, mapping
  to sound/word) or historical continuity?


