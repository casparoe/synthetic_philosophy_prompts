  Let me recall the philosophical landscape of generics:


  - Generics are statements like "dogs bark," "ducks lay eggs," "mosquitoes carry
  malaria," "birds fly," "sharks attack people," "a tiger has stripes."


  Key phenomena:

  1. Generics can be true with low prevalence: "mosquitoes carry malaria" true though
  <1% carry it; "sharks attack bathers" maybe true with tiny prevalence; "ducks lay
  eggs" true though only mature females do.

  2. Generics can be false with high prevalence but "not characteristic": "chickens
  are female" false though ~half, because being female isn''t characteristic; "humans
  are right-handed" — hmm.

  3. Quantificational analyses fail: "Ducks lay eggs" can''t mean "most ducks lay
  eggs" (most don''t); "mosquitoes carry malaria" can''t mean "some" (some would make
  too many true).

  4. Leslie''s view: a generic "Ks are F" is true if F is a "characteristic" property
  of Ks, or Ks are disposed to F... Actually Leslie: "The generic ''Ks are F'' is
  true iff Ks are as a kind disposed to F" or F is characteristic of the kind. Generics
  express generalizations about kinds, not quantified statements over individuals.

  5. Psychological accounts: generics are accepted based on prevalence and content;
  "striking" properties (dangerous, harmful) need very low prevalence to be accepted
  whereas neutral properties need higher prevalence. Cimpian/Leslie/Gelman.

  6. Generics and stereotyping/prejudice: generics like "boys are good at math" or
  "Muslims are terrorists" may be true under characteristic semantics but morally/problematically
  license essentialist inferences. Some argue generics encode essentialism; generic
  statements about social groups propagate stereotypes.

  7. Semantics vs pragmatics: Is the difference between "ducks lay eggs" and "ducks
  are female" semantic (truth conditions) or pragmatic? "Ducks are female" is false,
  not just misleading. So prevalence alone doesn''t determine truth; characteristicness
  matters.

