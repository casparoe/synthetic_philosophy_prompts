  Let me think about a Lakatos research programmes game.


  Lakatos''s methodology of scientific research programmes: a research programme has
  a "hard core" (central claims, protected by methodological decision — not falsifiable
  within the programme) and a "protective belt" of auxiliary hypotheses that can be
  modified to handle anomalies. Programmes are progressive or degenerating: progressive
  if they make novel predictions that are corroborated; degenerating if they just
  patch up anomalies post hoc. Rationality of sticking with a programme even when
  anomalies accumulate.


  Classroom game: students in small teams (research programmes) each with a hard core
  claim (e.g., "all swans are white" or something more abstract). A facilitator supplies
  "observations" (data cards) one at a time, some anomalies. Teams must respond by
  modifying auxiliary hypotheses (protective belt) but cannot change their hard core.
  They score points for explaining observations, more points for predicting the next
  observation before seeing it, and lose points for ad hoc patches. The twist: a rival
  programme has a different hard core, and teams see how long to stick with theirs.


  But we need the game to make participants feel the force of the idea: the pull to
  defend the core by adding epicycles, and the point where a programme degenerates.
  Also the idea that you can''t just falsify the core because it''s protected.


