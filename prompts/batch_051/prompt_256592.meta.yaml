  The hole argument (John Earman and John Norton, 1987, "What Price Spacetime Substantivalism?").
  Standard setup: In general relativity, spacetime is modeled by a manifold plus a
  metric field satisfying Einstein''s field equations. The hole argument says: consider
  a region (a "hole") of spacetime where the matter fields vanish. Take a diffeomorphism
  that is the identity outside the hole but acts non-trivially inside the hole. Apply
  it to the model (M, g, T). If spacetime points are real (substantivalism), then
  the two models (M, g, T) and (M, d*g, d*T) represent distinct physical possibilities
  — different points have different properties. But they are empirically indistinguishable:
  all observations are invariant under diffeomorphisms, and the two models agree on
  all invariant observable quantities. So substantivalism is committed to an uncountably
  infinite set of distinct but empirically indistinguishable worlds — a radical form
  of indeterminism and, for Earman & Norton, a serious cost (failure of Leibniz equivalence,
  violation of determinism in a garden-variety theory). Standard conclusion: one should
  reject manifold substantivalism (or at least a naive version) and adopt something
  like "sophisticated substantivalism" (identify isometric models) or relationism,
  or gauge-theoretic view treating diffeomorphic models as the same physical situation
  (Leibniz equivalence).


  Premises that could fail:

  1. Determinism is worth preserving / the indeterminism is genuinely objectionable
  rather than a gauge redundancy. Sophisticated substantivalist says the two models
  are the same possibility; the "indeterminism" is an artifact of treating gauge-equivalent
  descriptions as distinct. So a premise is that diffeomorphic models represent distinct
  worlds (denial of Leibniz equivalence). Count against the standard conclusion: if
  one holds that representational equivalence and worldly difference can come apart,
  or that we shouldn''t demand a one-one correspondence between models and possibilities.

  2. The conclusion depends on a certain definition of determinism (state on a Cauchy
  surface + field equations fixes the future up to diffeomorphism). If determinism
  is defined "up to diffeomorphism," substantivalism isn''t indeterministic — but
  then the debate shifts to whether determinism "up to isomorphism" is still determinism.

  3. The hole argument assumes diffeomorphism invariance/background independence;
  but what would count against? Not really.

  4. The argument assumes that points have primitive identity/trans-world identity
  (haecceities). If you deny primitive identity of spacetime points, the argument''s
  modal conclusion fails. This is a live escape route.

  5. The argument assumes all observations/invariant scalars exhaust empirical content.
  Could be questioned if there were observables that break diffeomorphism invariance
