  ---


  I keep noticing I''m confused about what "punishment" actually means, and I think
  its not just a semantic rabbit hole. I got into this while reading about the contrast
  between American mass incarceration and places like Halden in Norway — locked facility,
  but private-ish rooms, a kitchen, job training, guards in normal clothes who don''t
  carry weapons, and the stated aim is rehabilitation. On the American side, we call
  almost everything the state does to you after conviction "punishment"; on the Norwegian
  side, the same word gets used but a lot of the retributive sting has been taken
  out. That makes me think people are using one word for two different things.


  I''d like a working definition of punishment that gets the following cases right.
  Some are obvious, some aren''t:


  (a) A $200 speeding fine.

  (b) A ten-year prison sentence for robbery.

  (c) Quarantining someone with drug-resistant TB in a locked hospital room against
  their will.

  (d) A six-month drug-treatment program ordered as a condition of probation, with
  weekly drug tests and a curfew.

  (e) Halden-style confinement: you can''t leave for years, but you have a private-ish
  room, kitchen access, job training, and the guards are unarmed.

  (f) Restorative justice: a teenager who broke someone''s jaw meets the victim, apologizes,
  and works to repair the damage instead of getting a custodial sentence.

  (g) Solitary confinement for a prisoner who attacked a guard.

  (h) Civil asset forfeiture: the police seize someone''s car because they suspect
  it was used for drug dealing, but the owner is never charged.

  (i) A parent grounding a teenager for sneaking out.

  (j) A wrongfully convicted man serving five years for a murder he didn''t commit.


  My prior is that the word does two jobs: one legal/institutional (a burdensome state
  response to an offense) and one expressive (deliberately making someone suffer to
  communicate blame). On that theory, (e) is still punishment in the first sense but
  weird in the second, and (d) is either punishment or treatment depending on which
  job you mean. But maybe a single definition can cover all of it, or maybe the split
  is elsewhere.


