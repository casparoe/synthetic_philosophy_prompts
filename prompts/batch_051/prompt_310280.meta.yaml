  I''m writing a term paper for a course on logical empiricism and personal identity,
  and I''ve realised that my own position may be a patchwork of things I''ve accepted
  at different points in the semester. I want an audit of whether the package hangs
  together before I turn it into a thesis. I accept a softened verificationist criterion
  of meaning: a factual statement has cognitive content only if it is logically or
  mathematically decidable, or else experience in principle could count for or against
  it. I also accept an Ayer-style bundle view of the self: the self is not an inner
  substance but a logical construction out of experiences, tied together by memory
  and similarity. In Language, Truth and Logic, Ayer argues that the sentence "a person
  survives after death" has no literal meaning if it refers to a wholly disembodied
  self, because no possible sense-experience could settle the question; by contrast,
  if survival means something like the continuation of my memories and character in
  a new body or publicly observable form, then the claim is empirically meaningful.
  I endorse both halves of that move.


  But I also hold three further commitments. First, I''m a functionalist: mental states,
  including the ones that make up "me", are constituted by causal roles, so in principle
  an artificial system with the right causal organisation could have a mind. Second,
  I think gradual uploading would be survival: if my neurons were replaced one by
  one with functionally equivalent artificial components, preserving psychological
  continuity throughout, the resulting person would still be me, even if my original
  body was discarded. Third, I keep finding myself committed to an irreducibly first-person
  fact: there is something it is like to be me that no third-person functional description
  seems to capture. My seminar instructor says this last point is just a qualia intuition
  and I should either formalise it or drop it.


