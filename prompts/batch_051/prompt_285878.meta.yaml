  says that most passions are destructive because they attach us to things we cannot
  control, and they depend on illusions about ourselves or the future. Then she seems
  to treat the love of study as a kind of exception: a passion that gives you desire
  and self-forgetfulness while not depending on luck or other people''s good opinion.
  What I want is not a summary of her text. I want your actual credence that the underlying
  empirical-psychological thesis is true: namely, that a lasting human happiness requires
  at least one strong passion, and that this passion must either be of the kind that
  does not depend on external, uncontrollable outcomes (like study or inquiry), or
  be accompanied by enough illusion that you falsely believe you control or deserve
  those outcomes. Decompose it. Give me a number for each of these and the combination:
  (a) that apathy/tranquility is insufficient for happiness for most people; (b) that
  passions directed at external goods generally bring more unhappiness than happiness;
  (c) that the love of study/inquiry is distinctive in being able to supply passion
  without the typical dependence on external outcomes; (d) that her view is just a
  rationalization of her own priviledged position and won''t generalize. Then tell
  me which of these I should worry about most, and what evidence would change your
  final number.


