  hallucinates?", together with a scoring key. Each question should describe a concrete
  case in ordinary evaluative terms, with two or three possible responses, and no
  question should use the words ''lying'', ''bullshit'', ''error'', or name any of
  the positions. The cases should include at least the following: an invented case
  citation in a legal brief; a confident, fluent false answer to a factual question;
  a true answer produced for reasons unconnected to the facts; a model fine-tuned
  on sources its developers know to be unreliable; and a model deployed behind an
  interface that labels its outputs as checked and authoritative.


  Construct the questions from the logical space first: identify the distinctions
  on which the positions genuinely come apart, for example whether an orientation
  towards truth can be attributed to the system at all, where in the human-machine
  arrangement the relevant intention is located, and whether the decisive wrong is
