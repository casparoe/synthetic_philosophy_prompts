  on his account, the liar deliberately misrepresents what he takes to be true and
  must therefore be tracking the truth, whereas the bullshitter is distinguished by
  indifference to how things stand, which is why bullshit can be either true or false.
  The students are now asking whether the fluent falsehoods produced by large language
