  positions in that space: (1) mechanical error or malfunction, on which hallucination
  is a failure of fit between a next-token predictor and the facts; (2) Frankfurtian
  bullshit, on which the system is constitutively indifferent to truth and aim at
  plausibility, so hallucination is normal operation rather than breakdown; (3) lying
