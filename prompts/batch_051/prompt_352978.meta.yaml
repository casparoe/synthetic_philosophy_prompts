  Draft:


  For the last two years I have been trying to keep a small family firm alive while
  our whole sector is being reorganized by forces none of us could have foreseen —
  new regulation, a supply-chain collapse, a larger competitor entering our niche.
  I spent the first year proceeding the way I always had: carefully, with long planning
  horizons and incremental adjustments. For a while that worked. Then the ground shifted,
  the careful plan became irrelevant, and a rival whom I had dismissed as reckless
  moved faster and won. A friend handed me Machiavelli''s The Prince, and this passage
  from chapter 25 stopped me cold:


  [block quote]


  "I believe also that he will be successful who directs his actions according to
  the spirit of the times, and that he whose actions do not accord with the times
  will not be successful. Because men are seen, in affairs that lead to the end which
  every man has before him, namely, glory and riches, to get there by various methods;
  one with caution, another with haste; one by force, another by skill; one by patience,
  another by its opposite; and each one succeeds in reaching the goal by a different
  method. One can also see of two cautious men the one attain his end, the other fail;
  and similarly, two men by different observances are equally successful, the one
  being cautious, the other impetuous; all this arises from nothing else than whether
  or not they conform in their methods to the spirit of the times."


  I find this view increasingly persuasive, and not only as a description of my own
  trade: it seems to explain why the same temperament succeeds in one market and fails
  in another, why careful institutions collapse when circumstances change, and why
  boldness looks like wisdom in retrospect only when the times happened to favor it.
  But I am aware that a view which explains both success and failure, after the fact,
  by an unobservable "spirit of the times" may be explaining too much.


  Before I reorganize my own conduct around it — abandon my caution, act before I
  am ready, press advantages instead of consolidating — I want to know what would
  count against it. Please treat me as someone who is looking for genuine reasons
  to withhold assent, not as someone who needs the view explained back. I want the
  evidence, arguments, historical or experimental cases, and conceptual objections
  that should move me, sorted from fatal to merely awkward. Among other things: what
  would have to be true for this passage''s claim to be false rather than just unhelpful?
  Could the view be defended against every apparent counterexample by relocating the
  error into a misreading of the times? Are there cases in which patience or caution
  seems to succeed because the times changed, or in which "conforming to the times"
  is just a redescription of whatever worked? And is the inevitable hole in the view
  — that fitting yourself to the times is precisely what a fixed temperament cannot
  reliably do, and that recognizing the times in advance may be impossible — a defect
  in the theory, or a candid limit that counts in its favor? I would also like to
  know where a defender of Machiavelli would honestly concede ground, as opposed to
  where a critic would merely score points; and whether the position, once qualified,
  leaves me with any testable guidance at all, or only a warning.


