  Draft final:


  Before I retired I spent my career in population genetics, working mostly on small,
  inbred populations, and I have recently been reading the cultural evolution literature
  and the older debate about memes. An old reflex from that career keeps firing, and
  I cannot decide whether it has caught something real or is just an occupational
  tic. In genetics, non-random association between alleles at different loci—linkage
  disequilibrium—has at least two quite different sources. One is physical linkage:
  loci that sit close together on a chromosome are inherited together because recombination
  rarely cuts between them. The other is epistasis: when the fitness of an allele
  at one locus depends on which allele sits at another locus, selection itself can
  build associations between unlinked loci. Both produce the same snapshot statistic,
  but they differ in their dynamics and in what dissolves the association. Cultural
  traits exhibit the snapshot statistic constantly: a dietary rule travels with a
  cosmology, a metrical form with a theology, a political identification with a package
  of aesthetic defaults, often with no obvious functional link among them. The memeticist''s
  gloss is that these are memes riding on the same cultural chromosome. But culture
  has no chromosome, and no physical strand ties the taboo to the myth. I genuinely
  cannot tell whether I have found a structural identity—one that would let the machinery
  of replicators, recombination, and epistasis do real explanatory work on culture—or
  whether two very different systems can produce statistical association for unrelated
  reasons, in which case the population-genetic vocabulary would be a metaphor with
  misleading joints.


  My question is therefore whether this parallel is deep or superficial, and I would
  like the reasoning made explicit rather than settled by fiat. In particular: under
  what conditions does treating co-occurring cultural variants as being in linkage
  disequilibrium require particulate, faithfully copied replicators and a genuine
  cultural analogue of a chromosome, and under what conditions could the same clustering
  instead be produced by selection on whole persons for psychological coherence, by
  selection on entire packages of variants, or by differences in transmission fidelity
  alone? Where exactly does the analogy break, and what in-principle evidence from
  the cultural record—transmission chains, recombination across communities, the fate
  of hybrid packages when communities mix—would distinguish true cultural linkage
  from mere associative clustering among ideas? Finally, if cultural variants turn
  out to replicate only loosely, partially, and with heavy blending, does the word
  "meme" survive as anything more than a metaphor, or does the population-genetic
