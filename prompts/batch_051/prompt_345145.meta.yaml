  Setup: At an alignment workshop, two researchers argue about whether debate is robust
  to obfuscated arguments. I, the asker, sat nearby and took notes; I reproduce the
  exchange and ask for adjudication.


  Define debate: "The proposal that a truthful expert and a dishonest expert argue
  before a human judge; the honest expert can point out flaws in the liar''s case,
  so as long as checking a step is easier than producing it, the judge converges on
  the truth. The worry is obfuscated arguments: true positions that require such long,
  subtle, or computationally expensive justifications that the judge cannot reliably
  distinguish them from superficially similar false ones, and false positions whose
  flaws are similarly buried."


  Both sides:

  - Skeptic (calls debate limited): In domains where the honest position''s force
  is hard to compress into human-checkable chunks, debate fails. A superhuman liar
  with small advantage in concealment can present a coherent false case; the honest
  expert''s rebuttal may be just as hard for the human to verify. Obfuscated arguments
  are the norm near the frontier of any domain that matters; so debate can''t be the
  whole answer.

  - Defender: The whole point of debate is to exploit an asymmetry between finding
  contradictions and constructing consistent lies. An obfuscated argument is only
  a problem if it''s equally hard to attack as to construct. Empirical work (e.g.,
  "checkability") suggests many arguments are easier to check than generate. With
  enough rounds, cross-examination can surface the hidden step. If this fails only
  in adversarial cases where the judge is far below the experts, no alignment method
  avoids that — human oversight fails too; debate is strictly better than non-adversarial
  oversight.

  - Skeptic: "strictly better than non-adversarial" may be true but not enough; we
  need the judge to end up correct, not just relatively better. Also, the judge''s
