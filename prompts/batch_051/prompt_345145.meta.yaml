  ---


  At a workshop on AI alignment I attended last month, two researchers I know spent
  an evening arguing about whether the debate approach to extracting truth from superhuman
  models has a specific blind spot, and they asked me afterward what I made of their
  exchange. I didn''t manage to give a good answer at the time, so I''d like an adjudication
  of the argument as they actually made it. I''ve reconstructed the exchange from
  my notes; each numbered item is one move in order.


  Setup: The debate proposal says that if two expert AIs argue before a human judge,
  and the honest AI can point out flaws in the dishonest AI''s case, then the judge
  can end up reliably choosing the truth even if the judge could not have generated
  either case alone. The hope is that checking an argument is easier than constructing
  one. The worry under discussion was obfuscated arguments: cases where the truth
  is difficult to compress into steps a judge can check, or where a false claim is
  deliberately packaged so that its flaws are buried under a long, superficially consistent
  chain that the judge lacks time or ability to audit.


  (1) The skeptic said: In the most important domains the truth will often be exactly
  the kind of thing that resists compression. A superhuman liar only needs a small
  advantage in making a false story locally plausible; the honest AI''s rebuttal will
  itself be too long or too subtle for the judge, because it must explain why a globally
  wrong picture is wrong. Debate works when checking is much easier than generating;
  that asymmetry is a fragile empirical property, not a law. Near the frontier of
  any advanced domain, it will fail often enough that debate cannot be the backbone
  of alignment.


  (2) The defender replied: That concedes the central mechanism. Debate doesn''t require
  the judge to audit the whole argument; it allows iterative cross-examination. The
  judge can ask "what is the weakest step in your opponent''s account?" and force
  each side to expose a concrete point of disagreement. A false, obfuscated case is
  hard to construct because it must be consistent under adversarial questioning, whereas
  the honest side merely has to be correct. If you''re positing a liar so capable
  that its false story has no exposed flaw under sustained questioning, you''ve posited
  a situation where the truth is just inaccessible to the judge by any oversight method,
  not a defect specific to debate.


  (3) The skeptic said: That last clause is doing too much work. Saying "no oversight
  method works either" doesn''t rescue debate; alignment needs the judge to actually
  get the answer right. And the psychological setting matters: judges are not ideal
  step-checkers. A liar can exploit fluency, manufactured confidence, appeals to the
  judge''s background beliefs, and the general difficulty humans have with long proofs.
  Obfuscation is not only a computational problem; it''s also a rhetorical one. The
  proposal that debate gives the judge the truth assumes the judge''s errors are independent
  of the liar''s strategy, but the liar is optimizing precisely against the judge''s
  biases.


  (4) The defender said: That criticism applies to every scheme with a human in the
  loop, so it doesn''t distinguish debate from the alternatives; it just says human
  judges are corruptible, which everyone already grants. The stronger version of the
  objection would have to show something structural: that there are true claims about
  a model or a plan whose verification is systematically harder than the construction
  of a false claim that an ideal step-checker would also accept. If you can''t show
  that, you haven''t shown a limit of debate as a truth-finding mechanism; you''ve
  shown a limit of naive human judges.


  (5) The skeptic said: The structural case is not hard to sketch. Consider a claim
  whose justification depends on a hidden inconsistency that can only be found by
  searching through a long series of individually plausible steps; the honest side
  cannot point to the inconsistency in compressed form because the inconsistency just
  is the pattern across many cases. Or consider a true claim that is a fragile equilibrium
  in a high-dimensional model while the false competitor is robust to small perturbations,
  so the false claim looks like the better generalization. In such worlds an ideal
  but computationally bounded judge fails, and we have no guarantee the questions
  alignment cares about don''t look like that. In fact, "what will this system do
  in deployment" and "would this plan have a slow-developing catastrophe" are natural
  candidates.


  (6) The defender said: Those examples point at specific protocol choices, not at
  the research program. If the judge''s bounded computation is the bottleneck, you
  can let the judge sample sub-arguments, demand formal verification where possible,
  or field more than two debaters so that collusion between the two sides'' presentations
  becomes harder. The correct lesson of obfuscated arguments is that debaters need
  to make their claims checkable in a way matched to the judge''s competence. That''s
  a design target, and a lot of recent work is about exactly that.


  (7) The skeptic said: But the augmented protocols no longer get the original appeal
  for free. The reason debate was interesting was that it promised a general mechanism
  — competition — without requiring us to build formal verification or decompose real-world
  claims into cleanly checkable atoms. Once the defense of debate becomes "we''ll
  decompose the claims into checkable pieces and verify them," the difficult question
  is whether the decomposition can be done faithfully, and the obfuscated-argument
  worry reappears at that level: the decomposition itself can be gamed, or truth can
  be lost in the compression. So the proposal either depends on the fragile asymmetry,
  or it hands the problem to another unsolved problem.


  (8) The defender said: That''s not a refutation; that''s a statement of the research
  problem. Debate was never meant to be a finished guarantee. The original motivation
  was that adversarial pressure gives us a place to look for the truth and a way to
  train better judges and decompositions. The obfuscated-argument objection is strongest
  when it''s used to identify the crux — are the claims alignment cares about decomposable
  into judge-checkable pieces? — and much weaker when it''s treated as a reason to
  give up on debate. The honest disagreement between us is about how likely the crux
  is to go the wrong way.


