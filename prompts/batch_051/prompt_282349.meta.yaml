  Two members of my reading group came to blows over this. Marisol argued as follows.
  The conditional is not one of Judy''s possible locations, so she cannot update by
  ordinary Bayesian conditionalization on an event. But the message is still a definite
  constraint on her posterior distribution: the posterior conditional P(Red Headquarters
  | Red territory) must be 3/4. Since infinitely many distributions satisfy that constraint,
  she should adopt the one that changes her present distribution as little as possible
  — the distribution of maximum relative entropy, or minimal information gain, with
  respect to her joint prior — and that procedure gives a unique answer. She added
  that refusing to have an answer here would commit you to skepticism about updating
  on partial information generally, since everyday evidence arrives without a full
  account of how it was generated.


  Tomas replied that Marisol had smuggled in the least-change rule, and that ''change
  as little as possible'' is relative to which divergence measure one chooses; alternative
  measures give different posterior distributions, and no argument has been given
  for privileging one. He said the message is, by its content, information about the
  two Red sectors — how they should be re-weighted relative to one another — and so
  the right update should redistribute probability within Red territory while leaving
  the probabilities of the two Blue sectors, and the total probability of Blue territory,
  untouched. He added that Marisol''s rule is not neutral between the Red and Blue
  partitions, because it makes a message explicitly about Red territory move probability
  into Blue territory, which is exactly what a ''minimal'' update should not do.


  Marisol answered that keeping the Blue probabilities fixed is itself a choice —
  one that insists on a kind of independence between the message and the Blue sector
  that the problem never asserted. She also argued that if you condition on the operator''s
  actual report as an event rather than as a summary constraint, you need a model
  of the operator''s reporting policy, and none was given; the relative-entropy update
  is precisely what lets you do something coherent with the information you have rather
  than demanding information you lack."


