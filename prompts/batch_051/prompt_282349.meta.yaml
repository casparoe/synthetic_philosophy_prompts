  "Judy Benjamin, a soldier, is dropped at an unknown location in territory divided
  into four sectors of equal area: Red Headquarters, Red Outskirts, Blue Headquarters,
  and Blue Outskirts. She initially regards her location as equiprobable across the
  four sectors. Her radio operator then tells her: we cannot determine where you are,
