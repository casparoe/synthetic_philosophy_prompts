  The problem of logical omniscience: In standard epistemic logic (Hintikka 1962),
  knowledge is modeled with possible worlds: agent knows φ iff φ is true in all worlds
  epistemically accessible. This makes knowledge closed under known entailment and
  makes all logical truths known, all equivalent sentences known equally, and knowledge
  of tautologies automatic. That''s the problem.


  Positions in the literature:


  1. **Classical/idealizing**: Keep the idealization; epistemic logic is about idealized
  knowledge, not actual human agents. Maybe defend normatively: knowledge/justification
  as what an agent is committed to. Doesn''t "solve" but legitimizes.


  2. **Impossible worlds semantics** (Rantala 1982, Hintikka, Jago): Add worlds where
  logic is different / non-normal worlds where logical truths can fail and entailment
  doesn''t hold. Distinct from awareness.


  3. **Awareness semantics** (Fagin & Halpern 1988; Levesque 1984''s explicit/implicit
  knowledge): Add an awareness function; agent knows φ explicitly iff φ is true in
  all accessible worlds AND agent is aware of φ. Implicit knowledge remains closed;
  explicit knowledge isn''t.


  4. **Algorithmic/bounded reasoning approaches** (e.g., Duc? Active logic; Artemov''s
  justification logic?): Justification logic (Artemov) replaces "knows φ" with "φ
  is justified by evidence t"; closure fails because justifications don''t combine
  automatically.


  5. **Syntactic/sentential approaches** (Eberle? Konolige''s deduction model): Knowledge
  as formulas in a database plus an inference mechanism, no closure unless deduction
  actually performed.


  6. **Relevant logic / paraconsistent base**: Put a relevant or non-classical logic
  in the worlds so the background logic isn''t classical; entailments that fail relevance
  don''t propagate. (e.g., if the logic is relevant, you don''t know all classical
  consequences.)


