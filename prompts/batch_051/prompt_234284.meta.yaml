  The paradox: A teacher announces on Friday: "Next week there will be an exam on
  one of the five weekdays, but you won''t know (in advance) which day it will be."
  Students reason: it can''t be Friday (if no exam by Thursday night, we''d know Friday),
  so eliminate Friday; given that, it can''t be Thursday (if no exam by Wednesday
  night... wait, by Wednesday night, after eliminating Friday, if no exam Mon-Wed,
  we''d know Thursday, since Friday eliminated). Etc. They conclude no exam, and the
  exam on Wednesday surprises.


  The "criteria" I could give for a successfully surprising announcement (as the asker
  understands the paradox''s stakes):

  - (a) The announcement is true.

  - (b) At no point before the exam day do the students come to have justified true
  belief/knowledge of the day.

  - (c) The students'' reasoning from the announcement is valid, yet the announcement
  remains true.

  - (d) Surprise means they cannot derive the day from the announcement plus their
  observations.


