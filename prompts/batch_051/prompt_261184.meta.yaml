  Let''s write thoroughly:


  "I''ve spent most of my life in geology and then came late to philosophy, so I may
  be misreading him badly. I''m writing a short essay on Keynes''s Treatise on Probability,
  specifically his idea that probability isn''t always a single number and that there''s
  another dimension he calls the weight of arguments. The chapter I keep coming back
  to is Chapter Six, The Weight of Arguments. As I understand it, Keynes says there
  that new evidence can increase the weight of an argument even if it doesn''t move
  the probability up or down toward certainty, and that in ordinary practical reasoning
  we often care about how much evidence a probability is based on, not just how high
  the probability is. He also seems to say that in many important cases the evidence
  does not give us a measurable probability at all, but it still gives us a kind of
  rational confidence. My essay draft argues that this distinction gets at something
  scientists know tacitly: a conclusion from a few high-quality studies can be more
  robust than one from dozens of weak studies, and the difference is not captured
  by any likelihood ratio or p-value, because it is about the completeness and relevance
  of the evidence rather than the posterior probability. But then I worry I am collapsing
  Keynes''s epistemological point into a practical point about evidence quality. Maybe
  he wanted to say something stronger, namely that weight is itself a logical feature
  of the relation between evidence and proposition, not a psychological or practical
  judgment. Could you comment on my reading? Specifically: is it accurate to say Keynes
  treats weight as a dimension of rational belief separate from probability, or is
  he just noticing a phenomenal distinction while maintaining that all rational preference
  should ultimately be numerical? And is my use of his idea to illuminate robustness
  in science a fair extension, or does it make the Treatise do work it wasn''t built
  for? If you see problems in the essay''s central claim, I''d rather hear them now
  than keep polishing the prose."


