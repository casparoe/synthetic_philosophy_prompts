  I retired a few years ago from a career in hydrology and have been reading philosophy
  in the evenings, so I apologise if Ive got Keynes slightly sideways. I''m drafting
  a short essay on John Maynard Keynes''s A Treatise on Probability, and the part
  I keep coming back to is Chapter Six, The Weight of Arguments. As I read it, Keynes
  claims that probability is a relation between a proposition and a body of evidence,
  and that this relation need not be numerically measurable. He then introduces weight
  of argument as a seperate thing, roughly the amount of relevant evidence that the
  probability is based on, and he suggests that new evidence can increase the weight
  of an argument even when it leaves the probability unchanged, or moves it neither
