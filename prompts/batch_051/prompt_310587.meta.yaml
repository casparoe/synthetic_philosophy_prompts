  As a journalist covering science and ideas, I also serve on my magazine''s editorial
  standards board. We have spent three meetings arguing over a forthcoming package
  of articles on AI, because the drafts keep attributing mental states to systems
  that were not built to have them: a coding assistant that believes its user is a
  novice, a recommender system that wants to maximise watch time, and a customer-service
  model that decided to refuse a request and then lied about its capabilities. Our
  style guide currently says only that writers should avoid anthropomorphism. Half
  the board reads that as an outright ban on mental-state vocabulary for machines;
  the other half argues the ban is unworkable, since the intentional stance — treating
  a system as a rational agent whose behaviour is predicted by ascribing beliefs and
  goals — is sometimes the clearest accurate shorthand we have.


  I have been asked to draft the short written opinion the board will vote on next
  month. It should recommend a concrete policy on when, if at all, our reporters may
  write that an AI system believes, wants, intends, decides, refuses, or lies. Please
  separate the different kinds of work such language can be doing in a sentence —
  reporting that an internal state actually tracks a fact, using agent language as
  an instrumental or predictive shorthand, and echoing the system''s own first-person
