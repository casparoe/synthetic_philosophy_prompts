  The paradox of deontology: If the reason it''s wrong to harm someone is that harm
  is bad for them / violates a person''s rights, then it seems the same reason counts
  against every additional violation. So if you can prevent two violations by committing
  one, you should; but deontology forbids that. Standard formulations.


  A step-by-step argument:


  (1) If there is a moral constraint against harming an innocent person, it exists
  because each person''s being wronged is what matters — i.e., because wronging people
  is bad.

  (2) If wronging people is bad, then more wrongings are worse than fewer wrongings.

  (3) So if you can prevent two wrongings by committing one, you ought to commit the
  one.

  (4) Therefore there cannot be a moral constraint against harming that forbids harming
  one to prevent two comparable harms.

  (5) But most deontologists affirm such constraints.

  (6) So deontology is self-undermining.


