  (1) I am an ontological individualist about the social world: social facts are nothing
  over and above facts about individuals — their properties, actions, beliefs, and
  especially their relations to one another. If two worlds match individual-by-individual
  in all of those respects, they match socially.


  (2) I am also an explanatory holist in at least one important sense: I think many
  of our best social-scientific explanations are irreducibly macro. An account of
  why a norm persists, or what an institution does to a distribution of life chances,
  can be a perfectly good explanation without being translatable into a story about
  named individuals and their choices.


  (3) I nevertheless think the microfoundations demand is usually a sound demand.
  An aggregate-level regularity or mechanism that cannot be connected to any intelligible
  individual-level process is a black box, and I distrust black boxes as explanations.


  (4) But I am deeply skeptical of rational-choice reconstructions. When someone explains
  a norm or an institution as the equilibrium of maximizing individuals, I usually
  find the story false or beside the point; I would rather appeal to structural mechanisms
  such as network position, lock-in, or legibility to a bureaucracy.


