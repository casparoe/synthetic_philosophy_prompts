  Key ideas:

  - Methodological individualism (MI): explanations of social phenomena should be
  in terms of individuals, their actions, beliefs, desires, and interactions. Associated
  with Weber, Popper, Hayek, Elster (though Elster qualifies), Watkins.

  - Methodological holism: social wholes (institutions, structures, cultures) have
  explanatory autonomy; can''t be reduced to individuals.

  - Microfoundations in economics: macroeconomic relations should be grounded in individual
  choice.

  - Supervenience: social properties supervene on individual properties — any change
  at social level requires change at individual level. This is consistent with non-reducibility
  (multiple realizability).

  - Emergence: weak vs strong.

  - Explanatory individualism vs ontological individualism.

  - Structural/relational explanations: network position, segregation (Schelling),
  institutions as equilibria.

  - "No individual-level story" vs "in-principle reducible."


