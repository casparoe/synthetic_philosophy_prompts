  The view: A disposition ascription such as "this sample is soluble" is a counterfactual
  claim made under an explicitly controlled idealization. The sample is soluble just
  in case, were it to be placed in a suitable solvent with the background conditions
  specified, it would dissolve. I take the familiar counterexamples — finks, which
  remove a disposition when its stimulus occurs, and masks (or antidotes), which block
  the characteristic manifestation while the disposition persists — not to refute
  the conditional approach but to show that the antecedent must be enriched. A fink
  is excluded by stipulating that the causal basis of the disposition persist through
  the stimulus; a mask is excluded by stipulating that the causal pathway from stimulus
  to manifestation be unobstructed. And I mean these exclusions to be cashable in
  non-dispositional, physical terms: not a hand-waving "other things being equal,"
  but the sort of specification one would write into an experimental protocol. Where
  such a specification cannot be given, I am prepared to conclude that the original
  disposition ascription was indeterminate rather than a counterexample to the analysis.


