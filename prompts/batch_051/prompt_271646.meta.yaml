  For most of my working life I was an experimental scientist, and only in retirement
  have I turned to philosophy. The question that keeps pulling me back is how to understand
  dispositions—fragility, solubility, toxicity, and the like—because the laboratory
  encourages one answer and the philosophical literature seems to think that answer
  has died a quiet death. I would like you to tell me how exposed my answer actually
  is.


  The position I hold, provisionally, is this. A disposition ascription such as "this
  sample is soluble" is a counterfactual claim under an explicitly controlled idealization:
  were the sample placed in a suitable solvent under specified background conditions,
  it would dissolve. I grant that the standard counterexamples are real. A fink is
  an arrangement that removes the disposition when the stimulus arrives, so that the
  naive conditional ("if placed in water, it would dissolve") comes out false even
  though the ascription is true. A mask, or antidote, is an arrangement that leaves
  the disposition intact but blocks the manifestation, so that the naive conditional
  again fails. My view is that these do not refute the conditional approach; they
  tell us the antecedent was underspecified. One controls for a fink by stipulating
  that the causal basis of the disposition persist through the stimulus; one controls
  for a mask by stipulating that the causal pathway from stimulus to manifestation
  be unobstructed. The crucial commitment is that these stipulations can, in each
  well-posed case, be cashed out in non-dispositional, physical vocabulary, and that
  they can be given in advance rather than improvised after the counterexample arrives.
  If they cannot be given for a particular ascription, I am prepared to say that the
  ascription was not determinate, rather than that the conditional analysis is false.


  What I want is not a survey of the literature but a map of what would count against
  this view. Which observations, cases, arguments, or formal results should move me
  away from it? Please separate what would be decisive from what would be merely awkward,
  and be clear about which items a defender of a conditional analysis would themselves
  concede as damaging. I would also like an honest verdict on whether the position,
  as stated, has been insulated against refutation: whether the move of enriching
