  ---


  For most of my career I worked as an experimental [something] and only lately have
  I begun reading philosophy seriously. The problem I keep returning to is the analysis
  of dispositions — fragility, solubility, conductivity — because it is where my laboratory
  habits and the philosophical literature tug in different directions. I have provisionally
