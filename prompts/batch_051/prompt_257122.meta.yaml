  mould it into a statue of a horse and set it on a shelf. I am inclined to say there
  is exactly one thing on the shelf. But the lump was around on Monday while the statue
  was not, and if I now squash the thing, the statue is destroyed while the lump remains.
  So the lump and the statue do not have the same history or the same prospects. If
