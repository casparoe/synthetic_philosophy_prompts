  and the shaped object seem, in one sense, to be exactly the same thing: they share
  a location, a weight, a history from the moment of shaping onward, and I cannot
  point to any extra bit that belongs to one and not the other. But in another sense
  they differ. The stuff existed before the object came into being and will survive
  the object''s destruction; the object did not and will not.


