  (1) A pre-AGI bargain should still bind the parties after the transition. I don''t
  just mean we''d like it to; I mean if the deal says ''we share compute/control/profits
  on such-and-such terms,'' then later not performing it is a real wrong, not just
  bad PR.


  (2) But I also think that for a bargain to bind in the normal way, both sides need
  a genuine alternative to signing. If one party can''t walk away without catastrophe,
  the thing is closer to a settlement forced on them, and our duty to honor it is
  weaker.


  (3) I''m skeptical that pre-AGI paper actually controls very much after the transition.
  A post-AGI actor that can outthink the people who wrote the treaty will keep it
  only if it suits them anyway, so the idea that we can ''lock in'' terms against
  the interests of a stronger later party strikes me as mostly fantasy.


  (4) At the same time I think it''s legitimate, even now, to bind your own later
  self under uncertainty. If you agree to give away half the shares before you know
  what the company''s worth, you don''t get to re-litigate it the moment the valuation
  clears.


