  Let''s identify candidate readings of "programming is a language of thought" that
  are plausible and known:


  1. Literal computationalism / programming instantiates the Language of Thought (LOT)
  — the brain already computes in a language-like code; learning to program just exposes/reflects,
  or creates, a new symbol system that meets some criteria.

  2. Programming as internalized cognitive technology / tool-for-thought (after Vygotsky
  / cultural tools / inner speech): natural language and notations restructure cognition;
  programming is a powerful notation that scaffolds deliberative reasoning but isn''t
  the native LOT.

  3. Weak analogy / "language" in loose sense: programming is a formal notation with
  syntax and semantics; treating it as thought is just a metaphor for structured reasoning.

  4. Programming-language-specific Whorfianism (linguistic determinism): if you think
  in Python vs Haskell vs APL, the available abstractions shape what thoughts are
  thinkable; but this is at the level of natural language effects, not LOT.

  5. Anti-LOT position (embedded/embodied/connectionist): thought isn''t language-like
  at all, so "programming as a language of thought" is false/ parasitic on a mistaken
  picture; the phenomenon is just problem-solving plus retrospection.

  6. Normative/epistemic reading: programming is a language of thought in the sense
  that formal semantics and type theory give us the best normative model of good reasoning,
  not a descriptive one (logic as "calculus of thought" ideal).

  7. Social/performative reading: saying the character thinks in code is about identity,
  not cognition.


