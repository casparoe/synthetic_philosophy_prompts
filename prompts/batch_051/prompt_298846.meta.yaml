  Brandom''s inferentialism: To grasp the meaning of an expression is to grasp its
  inferential role. The content of a claim is determined by the inferences it licenses
  and is liable to: what follows from it and what it follows from, including material
  (non-logical) inferences. Understanding is practical mastery of inferential proprieties
  in a social practice of giving and asking for reasons (scorekeeping).


  Criteria for meaningfulness of an expression (per inferentialist):

  1. Introduction-rule style: the expression has conditions under which one is entitled
  to use it / assert sentences containing it (circumstances of appropriate use).

  2. Elimination-rule style: there are consequences of asserting sentences containing
  it — what one is committed to upon using it.

