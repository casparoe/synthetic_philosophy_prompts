  Draft:


  "In the philosophy of language course I''m taking, we''ve been working through the
  idea that the meaning of an expression is its inferential role — roughly, the network
  of inferences involving it. To pin that down, let me adopt the following criteria
  for an expression''s being meaningful (call them the inferentialist criteria):

  1. Introduction conditions: there are specified circumstances in which one is entitled
  to introduce the expression into a claim — that is, conditions under which one may
  assert sentences containing it.

  2. Elimination conditions: there are specified consequences of asserting sentences
  containing it — what one thereby commits oneself to.

  3. Difference-making: its presence in a sentence changes the inferential potential
  of that sentence; it demonstrably interacts with the roles of at least some other
  expressions.

  4. Public mastery: a competent speaker can display practical mastery of the expression
  by tracking the commitments and entitlements it creates, and by doing this in a
  way other speakers can hold them to.


  Now consider a borderline case. A community introduces a new sentence-forming connective,
  written ''⊗'' and pronounced ''tonk'' — I''ll call it ''blip'' — and fixes its entire
  inferential role with exactly two rules:

  - (Blip-in) From any sentence P, one is entitled to infer P blip Q, for any Q.

  - (Blip-out) From P blip Q, one is entitled to infer Q.

  It is easy to check that, with these two rules in place, any sentence is derivable
  from any other: to get from P to Q, first infer P blip Q by Blip-in, then infer
  Q by Blip-out. The result is that every sentence entails every other, and the distinctions
  among claims collapse.


  On the four criteria above, does ''blip'' have a meaning? Work through the criteria
  one by one, and take a definite verdict: either it qualifies, or it doesn''t. Where
  a criterion doesn''t settle the matter, say whether that is a gap in the criteria
  or a defect in the case. Finally, address the methodological question: if ''blip''
  does or doesn''t qualify, does the case show that the inferentialist criteria need
  an added constraint — something like harmony, conservativeness, or the preservation
  of a space of material incompatibilities — and is that constraint something inferentialism
  already has the resources to state, or is it imported from outside?"


