  Let''s think about what the view actually says so the summary contains targeted
  inaccuracies.


  Central distinction: In a one-shot PD against a perfect copy of yourself, EDT cooperates
  (because your choice is perfectly correlated with the copy). In a one-shot PD against
  a random human, vanilla EDT doesn''t necessarily cooperate because your choice may
  not be evidence about a random person''s choice. ECL says: in a large world, even
  in a "one-shot" PD with a stranger, the fact that you are selected from a large
  population of similar decision-makers (e.g., all humans, or all agents running similar
  reasoning) makes your action evidence about the other''s action, because the matching
  process may be correlated (you were both selected from a class where cooperation
  rates vary across subpopulations? Hmm, more precisely: you don''t know which algorithm
  you''re running; deciding to cooperate is evidence you''re in a world where agents
  like you cooperate, including this specific partner if they''re drawn from a correlated
  distribution). It''s like the "absolutist" reasoning? Actually there''s a simpler
  version: If you are one of many similar agents, and your decisions are correlated
  with theirs (through common causes like shared reasoning dispositions), then in
  a large population, the expected benefit of being the kind of agent that cooperates
  can outweigh the cost in the unilateral case, because conditional on you cooperating,
  the probability the other cooperates is higher. This is "evidential cooperation":
  you care about the correlation between your action and others'' actions, not just
  causation.


  So the summary''s statement "your cooperating is evidence that other people who
  reason like you cooperate too — including, probably, the very person you''re paired
  with" is mostly right if the pairing ensures correlation. But "any agent that''s
  sufficiently similar to you" overstates: similarity alone doesn''t guarantee the
  evidential link; the decision problem must be structured so your similarity is diagnostic
  (e.g., you know you were matched with someone from the same population, you share
  causal ancestors, or there''s a prediction mechanism). The paper likely emphasizes
  "in large worlds" because wide reference classes and population-scale correlations
  make the evidence stronger; it doesn''t claim universal cooperation with all similar
  agents regardless of setup.


  Also, "your forced to cooperate" (typo intended) — maybe the view says rational
  requirement under evidential decision theory, not "forced"; but the subtle issue:
  even under EDT, you cooperate only if the evidential expected utility favors it;
  ECL identifies conditions. Fine.


  Also, "therefore causal decision theory is just wrong about rational choice in realistic
  situations." Overstatement: ECL is usually presented as a challenge or as a reason
  to prefer a family of evidential/functional decision theories; but the result depends
  on accepting evidential reasoning as normative. A defender would say it shows CDT
  gives up gains in large worlds, but CDT advocates can respond (e.g., via "ratifiability"
  or one-shot vs repeated distinctions). The summary''s conclusion doesn''t follow
  from the accurate parts.


  I should also possibly include the conflation "this is basically just Hofstadter''s
  superrationality plus Newcomb." This is a common simplification: superrationality
  assumes a symmetric counterpart and identical reasoning, arriving at cooperation
  through proof-like symmetry; ECL doesn''t require you to assume your specific counterpart
  is rational and symmetric, it aggregates over a large world and relies on evidential
  correlations. Also Newcomb''s problem involves a predictor who already acted; in
  ECL you and the counterpart act simultaneously; the common thread is evidential
  relevance between your act and an earlier/concurrent correlated state. But many
  popular explanations do say ECL generalizes Newcomb. That''s mostly fair as a simplification.


