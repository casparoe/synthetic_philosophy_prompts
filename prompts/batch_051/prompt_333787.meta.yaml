  Domain: advance directives and the authority of the earlier self. The core philosophical
  issue: should the competent earlier self''s advance directive bind the later incapacitated/demented
  self? Different positions:


  - Precedent autonomy / integrity view (Dworkin): we should respect the earlier self''s
  critical interests; the later self''s experiential interests don''t override. So
  prior wishes govern.

  - Then-self / present interests view (Dresser): the now-incapacitated person''s
  current interests and experiences matter; if they seem content, we should prioritise
  their current well-being over a directive made by a "different" person.

  - A moderate view: directives bind when the later self retains enough psychological
  continuity / when the directive is specific and informed; override when current
  preferences conflict strongly and the person seems to have become a different person.

  - Ulysses contract: binding against future resistance (like Odysseus bound to the
  mast) — for mental illness, addiction.

  - Some people distinguish between "negative" (refusal of treatment) and "positive"
  (request treatment) directives.

  - Sliding scale: the more severe the current condition and the more the directive
  concerns what would be wanted if..., the less authority.


