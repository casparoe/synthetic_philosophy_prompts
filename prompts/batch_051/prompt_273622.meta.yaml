  Potential final:


  "I teach a small upper-year seminar called Markets, Prices, and Justice, and we
  spent the last two weeks on price controls. The midterm had a short essay question
  that a lot of students found slippery, and I want a second set of eyes on one answer
  before I commit to a grade. I''ll paste the question and the answer below.


  Question (asked for about 400 words):

  ''Rent control and minimum wage laws are both price controls, but one is a ceiling
  and the other a floor, and they operate in very different markets. Explain the standard
  static efficiency analysis of each, and say who each policy is supposed to protect
  versus who actually tends to gain and lose. Then make and defend a judgement: do
  the standard objections to rent control transfer to the minimum wage, or do the
  two cases differ in kind rather than just degree?''


  Student answer:

  A binding rent ceiling of the classic ''hard'' sort is predicted to produce a persistent
  shortage: at the controlled price, the quantity of housing demanded exceeds the
  quantity landlords are willing to supply. Landlords respond by letting units decay,
  converting them to condos, exiting the rental market, or charging side payments
  like key money. Existing tenants hang onto apartments that no longer fit them, while
  newcomers cannot find anything. The transfer from landlords to sitting tenants is
  not itself the efficiency problem, since that money is not lost, just moved. The
  real efficiency problem is the misallocation of a fixed stock of housing — a couple
  staying in a three-bedroom while a family of five doubles up — plus the mutually
  beneficial deals that are blocked by the ceiling.


  The minimum wage is a price floor. In the competitive textbook model it prices some
  low-productivity workers out of the market: employers cut hours, substitute capital,
  or automate, and the least skilled workers cannot get a first job. The gainers are
  the workers who keep their jobs and earn more; the losers are the unemployed and
  first-time entrants. Again, the transfer from employers to retained workers is not
  what the textbook efficiency argument complains about. The deadweight loss consists
  in the jobs that stop being worth creating.


  The interesting question is whether the two policies differ in kind. I think they
  do not. At a first pass, rent control looked more damning because the shortage is
  visible while minimum-wage unemployment is hidden. But the empirical literature
  on the minimum wage has found that modest increases often have no detectable effect
  on employment, which is why most economists now treat the competitive model as wrong
  rather than merely small in its effects. Since rent control is just the mirror image
  of a minimum wage, the same skepticism should carry over: if we accept that labor
  markets are frequently monopsonistic, we should expect rental housing markets to
  be frequently monopolistic, and under monopoly a rent ceiling can actually expand
  the quantity of housing supplied. So the standard hostility to rent control probably
  reflects the same overconfidence as the old hostility to the minimum wage. Both
  policies are more defensible than the textbook picture lets on."


