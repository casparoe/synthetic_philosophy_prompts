  it would crowd out the non-moral excellences (wit, art, erotic love, play, the merely
  interesting) that make a person worth being around. Dostoevsky seems to have attempted
  the opposite experiment: Prince Myshkin is presented as an authentically good man
  — holy, selfless, compassionate to a fault — and the novel doesn''t seem to make
  him boring or small; he is, if anything, magnetic and strange. But the plot also
  keeps making his goodness the engine of disaster: his indiscriminate pity for Nastasya
  Filippovna, his inability to choose between her and Aglaya, and the final catastrophe
