  of disciplinary power more generally: power that works less by overt force than
  by making people monitor and normalize themselves. Nowadays, people use the same
  analogy loosely: social media is a panopticon; workplace analytics is a panopticon;
  the modern ''surveillance state'' is a panopticon. The conclusion usually being
  drawn is that these systems produce the same self-disciplining subject that Foucault
  described.


  I''d like you to audit the analogy rather than just affirm or reject it. What in
  Bentham''s design (as Foucault reads it) does [some system] correspond to, and what
