  of losing), but the conjunction of these beliefs is that no ticket wins, which you
  know is false; alternatively, closure of rational belief under conjunction plus
  high-probability threshold for belief yields inconsistency. Preface paradox (David
  Makinson): an author rationally believes each sentence in their book, but also rationally
  believes (writes in the preface) that at least one sentence is false. Both challenge
  the idea that rational belief is closed under conjunction or that rational belief
  sets must be consistent. They''re similar but differ: lottery involves statistical
  evidence and a known winner; preface involves fallibility about one''s own work,
  no statistical basis.


