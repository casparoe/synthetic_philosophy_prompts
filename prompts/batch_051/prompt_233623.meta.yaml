  a system can want without maximizing (satisficing, akratic-ish).

  - Handle the thermostat: cheap goal-attribution, but no one thinks a thermostat
  wants the room at 21°C in a thick sense. So the theory must sort bimetallic-strip
  "goals" from real ones.

  - Handle the evolutionary parallel: humans want things because of evolutionary history
  (ultimate cause) but that history doesn''t appear in the wanting itself (proximate).
  A theory of AI wanting must not make "was produced by selection" a necessary condition,
  or it rules out human goals'' proximate machinery being implementable in silicon
  — unless it wants to bite that bullet (substrate/etiology chauvinism). This is a
  sharp point.

  - Handle the possibility of goals acquired in training vs specified in code vs emergent
  during RL: e.g., a chess engine "wants" to win in some sense; a utility-maximizer
  with a reward function literally has an objective; an LLM predicting next tokens
  has... a training objective, but does it have a goal at runtime?

  - Handle instrumental convergence: if we grant any terminal goal, wanting is structurally
  upstream of most of the scary stuff (self-preservation, resource acquisition). So
  the theory must say whether instrumental "wants" are wants.

  - Handle the "no goals, just optimization" view (e.g., a system can be a powerful
  optimizer without any representational goal state — like evolution itself). Requirement:
  don''t assume every optimizer has a goal; explain the difference between search/optimization
  and having a representation of a target.

  - Handle mesa-optimizers/goal misgeneralization: the trained policy is itself an
  optimizer with a goal that may diverge from the training objective. The theory must
  explain how a base objective can give rise to a different objective in the trained
  system.

  - Handle the distinction between reward, utility, and desire. RL reward is observed;
  utility is posited; desire is mental. These can come apart (wireheading: reward
  without getting what you want; being satisfied without reward).

  - Handle coherence/constraints: humans have conflicting wants; AIs might too. A
  theory of wanting shouldn''t require a single consistent utility function (that''s
  a modeling ideal, not a discovery).

  - Handle self-models/reflective endorsement: does wanting require the system to
  represent itself as wanting? Probably not for dogs... Actually dogs want things.
  So the theory must handle non-linguistic wanting without collapsing into behaviorism.


