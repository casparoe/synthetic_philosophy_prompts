  Jeffrey conditionalization (JC): when evidence is uncertain, you update by "probability
  kinematics": P_new(H) = sum_i P_old(H | E_i) * P_new(E_i), where {E_i} is a partition
  and your new probabilities over the partition are not necessarily 0/1. Key features:
  rigidity (P_old(H | E_i) = P_new(H | E_i)), commutativity/order-independence (Jeffrey
  updates commute: updating on two successive uncertain observations gives same result
  regardless of order if they''re on the same partition... actually Jeffrey updates
  on different partitions can fail to commute). Uncertain evidence, Pearl''s virtual
  evidence, van Fraassen''s reflection, the "sleeping evidence" problem? There''s
  also the issue of incommensurable partitions, and the Judy Benjamin problem (van
  Fraassen 1981) where you can''t apply JC because the information is conditional
  in form.


  A thought experiment to specifications could be: "Construct a case where an agent
  receives two pieces of uncertain evidence such that Jeffrey conditionalization is
  non-commutative, with the constraint that... no exotic etc." Or "where Jeffrey conditionalization
  disagrees with what looks like the rational update, because the evidence is about
  a conditional rather than a partition" (Judy Benjamin problem). Or "where Jeffrey
  conditionalization gives a verdict that violates Reflection" — but the asker should
  specify.


