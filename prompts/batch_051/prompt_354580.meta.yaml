  ---


  I teach an upper-level undergraduate seminar in the philosophy of social science
  and I''m writing the take-home final. I want one essay question on whether the world
  is becoming less violent, in the vein of Steven Pinker''s The Better Angels of Our
  Nature. The question should be unanswerable by merely reciting Pinker''s charts
  or the standard objections to them. It must force students to say what would have
  to be settled before the claim has a determinate truth value: (i) the difference
  between per capita rates and absolute numbers, including at least one constructed
  case where the two pull in opposite directions as a population grows; (ii) how the
  phrase violence gets operationalized — combat deaths, all conflict-related deaths,
  homicide, state repression, structural harm — and how each choice can reverse the
  verdict; and (iii) the choice of time window and the problem of cherry-picking endpoints.
  The question should include a small invented dataset or scenario (not a historical
  citation) that students must interpret under two competing definitions of violence.


  Please write the question, a model answer of about 700 words, and a marking scheme
  out of 20 built around five must-hit points, with the marks each is worth and a
  one-line note on how candidates typically get each wrong. Every deduction should
  be tied to an identifiable misunderstanding — for example, treating violence as
  a natural kind with a single obvious measure, or sliding from a falling rate to
  a falling absolute count. The crux should be whether, once the measure is fixed,
  there is a fact of the matter about the trend, or whether the choice of measure
  imports a value-laden framing that no amount of data can settle.


