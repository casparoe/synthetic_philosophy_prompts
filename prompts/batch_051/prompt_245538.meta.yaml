  I''m chairing the ethics subcommittee of our state''s crisis-standards-of-care advisory
  group, and we''ve been asked to send the full group a decision memo on one provision
  we can''t agree on. Under our draft pandemic triage protocol, when ventilators run
  short, everyone is scored on a validated physiology index that predicts survival
  to about six months; the ones with almost no chance even with ventilation get comfort
  care, and everyone above that threshold is put in the queue. The fight is over the
  tie-breaker. Right now the text says that if two patients score similarly on predicted
  survival, the vent goes by lottery. A block of intensivists wants to replace that
  with a life-years rule: among patients with similar short-term odds, give the vent
  to whoever is expected to live longer after discharge, adjusted for quality of life
  — in effect maximizing QALYs from the machine. Their case is that this lets a 30-year-old
  with excellent recovery prospects beat a 75-year-old with the same odds of surviving
  the illness, which is exactly what a scarce-resource allocation should do, and that
  refusing to compare future life-years is just squeamishness. The other side says
  the life-years rule smuggles age and disability discrimination back into a protocol
  that otherwise avoids them, and that a lottery is the only tie-breaker that visibly
  doesn''t rank some lives above others. I need a memo for the full task force that
  takes a definite position: adopt the QALY tie-breaker, keep the lottery, or adopt
  some modified version (a life-cycle rule that gives priority by years already lived,
  say, or a lottery weighted by life-years but bounded so no one gets zero weight),
  with the reasoning stated so a hospital lawyer or administrator could act on it.
