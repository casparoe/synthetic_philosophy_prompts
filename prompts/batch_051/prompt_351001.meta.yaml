  Objective Bayesianism (MaxEnt): choose prior that maximizes entropy subject to constraints;
  this is Jaynes style. Entropy is often described as "missing information," not "information
  contained." The summary says "entropy measures how much information a probability
  distribution contains" — that''s backwards (or at least contested; higher entropy
  = more uncertainty = less information about the outcome). That''s a subtle misrepresentation.
  Good.


  Uniqueness: maximize entropy subject to constraints gives a unique distribution,
  but the constraints themselves (which features of a problem to encode) are not dictated
  by the principle; and the principle requires that the constraints be known. Also
  different choices of sufficient statistics/coordinate systems can change the result
  (Bertrand-style problems, parameterization invariance). So "everyone facing the
  same evidence must agree" overstates because what counts as the constraints/evidence
  can vary, and the result depends on the coarse-graining/partition. And "fully objective
  answer to the problem of priors" is contentious. Good.


