  should come from the vocabulary of epistemic logic—knows, follows, true, all, if,
  consequence, world, whatever you choose—and their recurrence has to do the philosophical
  work. A sestina is a closed system: the same six words permuted through a fixed
  pattern for six stanzas and then crowded into a three-line envoy. I want the poem
  to use that so the reader feels the gap between consequence being "in" the closure
  and somebody actually having the thought before their mind. Each stanza is just
  a new arrangement of the same stock, the way closure under entailment gives you
  nothing beyond what was already implicit in the premises; the envoy is where I''d
  like the strain to show, the point where having all the consequences available and
  knowing them occurrently come apart. It doesn''t need to name-drop or teach the
  formalism—but a logician should be able to recognize the problem in the bones of
  the poem, and a general reader should still find it a good poem. I''m less interested
  in it resolving the tension than in it leaving the tension open, since that''s honestly
  where my essay ends up.


