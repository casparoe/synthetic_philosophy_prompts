  I''m a journalist who covers science and ideas, and I''m working on an essay about
  why it''s so strange to say that a person—or a proof assistant—"knows" everything
  that follows from what it knows. The setup I want to write about is the problem
  of logical omniscience: standard epistemic logic often treats knowledge as closed
  under consequence, so that if you know P and P entails Q, you count as knowing Q,
  at least in some ideal or implicit sense. But obviously none of us knows all of
  arithmetic just because we accept a handful of axioms, and a theorem prover doesn''t
  "know" every theorem it would except if you gave it enough time. I want to open
  the essay with a sestina that makes this tension felt rather than explained. Could
  you write one?


