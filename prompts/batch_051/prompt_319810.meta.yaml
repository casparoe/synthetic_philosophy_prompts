  The birthday paradox: in a room of 23 people, chance of at least one shared birthday
  exceeds 50%. But people often think you need 183 people (253 pairs). The key is
  the number of pairs (23 choose 2 = 253) and that events are not independent but
  still. Common subtle errors: "The birthday paradox shows that coincidences are actually
  common, so we should never be surprised by any coincidence" (overstatement). Or
  "Given there are 7 billion people, some amazing coincidence is bound to happen to
  someone every day; therefore any particular anecdote (e.g., my sister dreaming about
  a plane crash the night before one) is not evidence of anything" vs. "it happens
  by chance alone" — conflating "some coincidence will happen somewhere" with "this
  particular coincidence is due to chance". Also the "law of truly large numbers"
  (Diaconis and Mosteller: with a large enough sample, any outrageous event is likely
  to happen). There''s the issue of multiple comparisons: if you count all possible
  surprising pairings after the fact, almost anything can be made to look improbable.
  Also anecdote selection bias: we hear the hits and not the misses (the dreams that
  didn''t come true).


