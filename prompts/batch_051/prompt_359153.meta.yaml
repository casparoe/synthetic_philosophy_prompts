  I am a high school student, and we just finished reading George Bernard Shaw''s
  Pygmalion in class. My teacher has asked us to write about whether the play has
  a "philosophy of language" of its own, and I keep getting stuck on the question
  of whether the play is more prescriptivist or descriptivist about grammar. I am
  especially interested in the moment early in the play where Higgins, after showing
  off his ability to identify people''s exact neighborhoods from their speech, tells
  Pickering that he could take a woman like Eliza Doolittle and pass her off as a
  duchess at an embassy ball simply by teaching her to speak differently. It is hard
  for me to tell if Shaw is presenting Higgins''s view as a reductio of class pretensions,
  or as a truth about language that the rest of the play actually depends on.


  I would like a careful reading of Pygmalion through the prescriptivism/descriptivism
  debate. Does Higgins treat Eliza''s original way of speaking as genuinely defective
  grammar, or merely as a social code unlearned? How does the play treat the line
  between "standard English" and "bad grammar"—does it show that the line is real
  because language has internal standards, or that it is a class invention because
  everything Eliza says is perfectly intelligible? I would like you to work scene
  by scene: the first meeting, the lessons, the embassy ball, and especially the ending,
  where Eliza has mastered the accent but not become a duchess inside. Where does
  the play seem to endorse Higgins''s view, and where does it resist it? And what
  does Shaw''s dramatization add to the philosophical dispute that a prescriptivist
  or descriptivist essay might miss? I want to write an essay that is faithful to
  both the play and the linguistic debate, not just use the play as decoration for
  a slogan.


