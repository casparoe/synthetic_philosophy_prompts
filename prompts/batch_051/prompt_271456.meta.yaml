  ---


  I write about institutions and ideas for a general-interest magazine, and I am working
  on a piece about a puzzle that recurs across several federal systems that all claim
  to respect something called subsidiarity. The European Union describes the principle
  as the idea that decisions should be taken as close to the citizen as possible,
  with Brussels acting only where the member states cannot sufficiently achieve an
  objective and common action would do better. Yet this same principle is routinely
  invoked to justify centralizing harmonization of product standards, data protection,
  and environmental rules, because the internal market makes almost any divergence
  look inefficient. Germany, by contrast, pursues a federal balance partly through
  the Bundesrat, a chamber composed of delegates sent by the governments of the Länder,
  who vote in blocks on instructions from their state cabinets, rather than through
  directly elected representatives of the citizens. Switzerland operates similarly
  in spirit, with strongly autonomous cantons and a constitutional rule that the Confederation
  may take on a task only if the cantons cannot handle it. And the United States combines
  a doctrine under which Congress may not conscript state legislatures or executives
  into administering federal policy with a rule that federal statutes can nevertheless
  preempt state law outright.


  What I want the piece to bring out is not how these mechanisms function but what
  they presuppose about democratic legitimacy. Political theorists sometimes distinguish
  between subsidiarity as an instrumental device for solving problems at the most
  efficient level, and subsidiarity as a protection for the self-government of smaller
  communities that exist before the larger polity. I suspect these four arrangements
  quietly rely on different halves of that distinction, and I would like you to reconstruct
  the implicit theory in each case: who is the relevant demos, whether the smaller
  units have an intrinsic standing to govern themselves or only an instrumental value
  in producing better outcomes, and whether the parts of a single arrangement presuppose
  the same thing. Please separate what each mechanism strictly presupposes from what
