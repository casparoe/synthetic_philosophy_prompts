  better, and telling myself that''s all any of us do — the ''real'' backstory is
  whichever one makes the best model, and there''s no fact of the matter beyond that.
  That''s the theory I''m attracted to: when two ontologies are empirically equivalent
  — same predictions for all accessible evidence — there''s no way, even in principle,
  to identify which one is true, and if the disambiguating evidence is permanently
  inaccessible there''s nothing for the truth to consist in. It''s tidy, it dissolves
  a lot of pointless disputes, and it gives me a rule for writing: choose the simpler,
  more fruitful model and move on.


