  I have been trying to get clear on something that struck me while teaching a course
  on the ethics of technology, and I keep going back and forth about whether it is
  a real insight or just a pattern I am overfitting to.


  The idea is this. In software engineering, there is a principle called information
  hiding or encapsulation: a well-designed module exposes a narrow interface and buries
  its internal representation, so that other parts of a program can interact with
  it only through operations that the module itself sanctions. The rationale is not
  that the internal state is secret in any absolute sense—the code is often open to
  inspection, and anyone with access to the source can read it—but rather that uncontrolled
  access corrupts the integrity of the system over time. What counts as a legitimate
  access to an object, on this view, depends on the role the caller occupies and the
  purpose of the access, not simply on whether the caller can technically get at the
  data.


  I see a close parallel with the idea in privacy theory that privacy is not fundamentally
  about secrecy or about an individual''s control over information, but about whether
  information flows in a way that respects context-relative norms—what Helen Nissenbaum
  calls contextual integrity. In both cases the moral or engineering problem is not
  that some bit of information is hidden from everyone, but that it is disclosed to
  someone outside the appropriate context, or through an interface that was not meant
  for that use. The question I want to press is whether this is a deep identity of
  structure—in which case maybe work in privacy theory can be translated into modules
  and interfaces, or vice versa—or only a loose analogy. If it is deep, what exactly
  is the thing on the software side that corresponds to a privacy norm? And if it
  is superficial, where does the analogy break? Specifically, does the idea of preventing
  "uncontrolled access" to preserve system integrity really track the normative weight
  of privacy, or does it leave out the distinctive wrong involved when a person, rather
  than a program, is the one whose information is shared?


