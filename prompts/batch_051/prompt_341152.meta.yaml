  Let me recall the unilateralist''s curse details. It arises in groups where:

  - There are many agents who can each take an action that imposes consequences on
  all.

  - The action is taken if at least one agent acts.

  - Each agent acts based on their own estimate of whether the action is net positive.

  - If the group would act only if a majority thought it net good (or after pooling
  evidence), but instead any single individual can trigger, then the probability of
  action is much higher. The curse: with many sincere, moderately pro-action individuals,
  the outcome is that the action is very likely to be taken even when group deliberation
  would reject it.


  Mitigations often: designated authority, quorum, requiring consensus, increasing
  threshold. But those cause the reverse problem: diffidence / unilateralist''s curse
  reversed (no one acts even when all think good, because each waits for others?).
