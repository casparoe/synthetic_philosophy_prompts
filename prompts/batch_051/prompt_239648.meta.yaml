  Let me consider whether the asymmetry is actually justified by a known principle.
  In pragmatics, accommodation is governed by Lewis''s "rule of accommodation": at
  a time t in a conversation, if something is said that requires a component of conversational
  score to be a certain way, then, ceteris paribus, that component becomes that way.
  But "ceteris paribus" includes constraints: the accommodated presupposition must
  not be controversial, must be consistent with common ground, must be "bridgeable"
  (von Fintel says accommodation is possible only if the new information is not "known
  to be false" by any participant? Actually "The king of France is bald" is odd because
  everyone knows there is no king of France, so the presupposition conflicts with
  common knowledge; "my sister" doesn''t conflict, so it''s accommodatable). There
  are also informative presuppositions: people can accommodate new information if
  it''s presented as uncontroversial; but in formal bodies, rules require explicit
  decision; the meeting''s "score" has provisions about what can be added without
  a motion. Hmm, the committee context gives a normative register: minutes should
  not silently acquire contested claims. But ordinary conversation doesn''t have explicit
  rules; yet we still challenge. The asymmetry between private factual background
  (niece) and contested collective plans (the council will fund) may be explained
  by relevance and contestedness: presuppositions that would decide an agenda item
