  Then: These passages come from two successive frames of government for the same
  union, ratified barely a decade apart by roughly overlapping sets of states and
  often by the same leading figures. But they appear to assert opposite accounts of
  where sovereignty lies after "joining": the first says the states keep everything
  not expressly delegated, while the second makes the union''s law supreme over state
  law and binds state judges to it regardless of state law.


