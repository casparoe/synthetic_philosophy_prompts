  "I have been developing an account I call ''instinctual denomination.'' I take as
  my starting point Darwin''s claim in The Descent of Man that the moral sense arises
  from social instincts, and that these instincts originally bound members of the
  same tribe rather than the whole species. My proposal is that every moral norm has
  an implicit ''denomination'' inherited from the social group in which it first became
  adaptive, analogous to the denomination of a currency. The denomination does not
  set the content of the norm but sets the boundary of who falls within its domain.
  A norm denominated for a band of fifty will misfire when applied to a nation of
  millions: it will feel authoritative while tracking nothing about the actual social
  ecology. This, I think, explains why people report strong moral conviction about
  distant policy outcomes but act beneficently only toward nearby others; why religious
  communities can more easily sustain costly cooperation; and why moral language so
  often takes an impersonal, universal form even though the underlying emotions remain
  group-bound. I realize this resembles the moral circle expansion literature, evolutionary
  accounts of parochial altruism, and perhaps something in Durkheim. But I want to
  know whether the term ''denomination'' marks a real distinction or just re-describes
  familiar ideas. Give me the three strongest objections to this account, and say
