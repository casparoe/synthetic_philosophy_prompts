  and no replacement procedure... or a provision refers to an office that no longer
  exists because of some contingency. Participants must decide what to do. They might
  discover that any procedure they follow to resolve the gap is itself not authorized,
  and any meta-rule they invoke needs authorization, leading to infinite regress —
  or they might decide by acclamation and thereby create new authority.


