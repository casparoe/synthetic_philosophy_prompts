  The idea: constitutional gaps and interregna — when the rules run out, who governs?
  In a constituted order, the ultimate rule (rule of recognition?) or succession rules.
  But when no rule covers the current situation, you get a gap. The interesting conceptual
  issues:


  - The distinction between a legal gap (the rules don''t specify) and a political
  crisis (the rules specify but people refuse to follow).

  - "Interregnum" historically meant the period between the death of one sovereign
  and the designation of a successor; the sovereign''s authority is in abeyance or
  held in commission.

  - Who can authoritatively decide that a gap exists? If the rules define who decides,
  it''s not a gap; if they don''t, any decision is extra-legal.

  - Self-appointment vs. constitutional continuity: when a body steps in, is it exercising
  a preexisting residual power (Kelsen''s idea that law authorizes the judge to decide
  when rules are silent?) or creating new authority?

  - The difference between a rule''s running out and there being no procedure to amend
  it.

  - Legitimacy vs legality.

  - Who gets to say what the rules are: the paradox of self-interpretation.

  - Optical/performative aspect: acting "as if" governed.


