  with n hairs is bald and a person with n+1 hairs is not bald,'' bivalence forces
  this to be true: if each instance ''n is bald'' is true or false, then there must
  be a last true one before the first false one. So there''s a sharp cutoff. Denying
  it means denying bivalence, which costs us classical logic and is worse than the
  oddity of an unknowable cutoff."


  2. Marco (supervaluationist): "You can keep bivalence as a logical principle — excluded
  middle is supertrue — while denying that each borderline instance is determinately
  true or determinately false. ''There is a cutoff'' is not supertrue because there''s
  no single cutoff common to all admissible precisifications; it''s true on each precisification
