  Perspective: university student taking a course on formal epistemology / probabilistic
  reasoning. Formal/polished.


  Draft:


  "I''m taking a course on formal epistemology, and we''ve been working through the
  problem of how a rational agent should revise her probabilities when the new information
  comes in the form of a conditional probability rather than an unconditional one.
  The standard example: a soldier is dropped into one of four sectors — Red Headquarters,
  Red Second Company, Blue Headquarters, Blue Second Company — and initially assigns
  each sector probability 1/4. She then receives a radio message she takes as certain:
  if she is in Red territory, the probability she is in the Headquarters sector is
  3/4. The question is how to revise her probabilities, and in particular whether
  the probability that she is in Red territory should change at all.


  I want to analyze a concrete rule that a forecasting group could adopt. The group
  maintains a single shared probability distribution over some set of propositions.
  Any member may submit a report of the form P(B|A) = q. The group then updates the
  shared distribution by choosing the distribution that is closest to the current
  one in Kullback-Leibler divergence while satisfying the new constraint (and, if
  several reports have been submitted, all currently accepted constraints). The rule
  is meant to be conservative: make the smallest information-theoretic change needed
  to absorb the conditional claim.


  Please analyze how this rule would actually behave, not whether it is good in the
  abstract. In the soldier case, what does the rule do to the probability of Red territory,
  and does that make sense given that the message was only about a conditional? More
  generally, what does the rule implicitly decide about whether a pure conditional
  report should move the probability of the antecedent? Then consider the incentives:
  what kinds of conditional reports would a self-interested or overconfident member
  want to submit, in what order, to push the shared distribution in a chosen direction?
  Does the rule have predictable failure modes — for example, path-dependence, cycles,
  or sensitivity to the order in which reports arrive — and could any of these be
  fixed without abandoning the KL-minimization principle?"


