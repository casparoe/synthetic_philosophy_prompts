  State asymmetry: When an LLM gets a problem right and produces a plausible chain-of-thought,
  researchers, reporters, and product teams quote the chain-of-thought as a window
  into what the model was doing: "it checks X, then Y" etc. When the model gets the
  answer wrong, the same authors are quick to say the chain-of-thought is just generated
  text and doesn''t report anything about actual internal processing; it''s confabulation.
  So the same type of output is treated as a faithful self-report when convenient
  and as meaningless theater when not.


  But make it concrete with an example to avoid abstraction: maybe two LLM runs on
  the same type of puzzle. One says "I should track whether each statement rules out
  a possible arrangement; first I''ll list the constraints..." and gets it right;
  the other says essentially similar things but gets it wrong. The first is quoted
  in the article as "the model''s step-by-step reasoning"; the second is dismissed
  as "post-hoc story." Or use a single model.


  Ask: Is there a principled difference that justifies this? Or is the practice just
  outcome-based? What principle could let one treat model self-reports as evidence
  only when they come out right? Should we drop the asymmetry?


  Add nuance: The obvious response is "when the answer is wrong, the self-report must
  have been wrong/fake; when right, it might be tracking something." But that can''t
  be the whole story because the correctness of the final answer doesn''t, by itself,
  validate the stated reasoning (a model can reach the right answer via wrong steps
  and vice versa). So ask to handle that.


