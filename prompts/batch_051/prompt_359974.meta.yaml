  I need to choose a specific idea within no-trade theorems. The classic: Aumann''s
  agreeing-to-disagree (1976): two agents with common priors and common knowledge
  of each other''s posterior probabilities cannot agree to disagree. Milgrom-Stokey
  (1982): no speculative trade under common knowledge of rationality and common priors;
  trade can only be due to differences in endowments/risk preferences, not information
  differences. The "no-trade theorem" says that if all agents are rational and have
  common priors, and it is common knowledge that an exchange is acceptable to all,
  then it cannot be motivated purely by private information — any proposed trade should
  be inferentially self-canceling: the fact that you''re willing to trade at price
  p reveals your private information to me, shifting my beliefs.


  The classroom game: participants get private "signals" (cards) about a hidden state
  (e.g., a jar with red/blue balls, or an asset with a true value), then can post
  bid/ask prices for assets paying $X if state is A. If trades happen purely from
  information differences, the group discovers that the mere willingness to trade
  at a price leaks information and shifts prices until no one wants to trade. The
  instructor could use a "no-agreement" market with a double auction. The debrief
