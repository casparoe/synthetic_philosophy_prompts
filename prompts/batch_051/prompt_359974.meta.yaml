  I am a retired physical scientist — my working life was spent in a laboratory where
  a disagreement was an occasion for better measurement rather than rhetoric — and
  I have recently begun reading the epistemology of markets. I now convene a workshop
  of fourteen people (graduate students, postdocs, and a few philosophers) for a single
  ninety-minute session. I want to run something hands-on, not a lecture.


  The idea I want the participants to feel before anyone names it is the no-trade
  theorem: when rational expected-utility maximizers share a common prior and this
  is common knowledge, pure differences in private information should not generate
  mutually agreed speculative trade. If you are willing to sell me a claim at a price,
  your very willingness is a signal about what you know; I should update on it, and
  the price should shift until the trade no longer looks good to one of us. The silence
  of a market can be a sign of successful information aggregation rather than failure.


  Please design a game that gets this into the room. The game should be runnable in
  the ninety minutes with paper, cards, and a board, and should use points rather
  than real money. I suggest the following constraints, but improve them if you see
  a better version: there should be a simple hidden state selected by a public chance
