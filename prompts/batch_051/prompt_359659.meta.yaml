  (1) Complexity is objective: a ribosome is more complex than a quartz crystal or
  a pile of sand, and that''s true independent of what anyone knows or what language
  they describe it in. (2) Shannon entropy is not complexity; a gas at equilibrium
  has high Shannon entropy but is in an obvious sense simple and boring. (3) Kolmogorov
  complexity also gets the target wrong, because it treats a random string as maximally
  complex, whereas I want to say randomness is the absence of structure, not the height
  of it. (4) The measure that actually looks right to me is assembly index -- roughly,
  the length of the shortest sequence of joining operations that builds the object
  from some set of elementary building blocks, where you''re allowed to reuse previously
  assembled pieces; it gives low scores to crystals and random aggregates and high
  scores to things like proteins or a watch. (5) But I also hold that the complexity
  of an object should be intrinsic to the object itself; it shouldn''t depend on which
  building blocks we choose to start from, or on what other objects exist. (6) And
