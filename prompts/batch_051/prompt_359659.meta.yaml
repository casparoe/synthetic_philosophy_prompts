  I''m a retired polymer chemist, and after a career of worrying about chain lengths
  and reaction pathways I''ve got it into my head to figure out wether "complexity"
  is a real property of things or just a word for what surprises us. I''ve drifted
  toward a set of convictions and I''d like a consistency check before I inflict them
  on my reading group. Here they are, roughly as I''d defend them over a beer:


  (1) Complexity is objective: a ribosome is more complex than a quartz crystal or
  a pile of sand, and that''s so independently of what anyone happens to know or what
  language they use to describe it. (2) Shannon entropy is not a measure of complexity;
  a gas at equilibrium has high Shannon entropy but is in every interesting sense
  simple. (3) Kolmogorov complexity also gets the target wrong, since it makes a random
  sequence maximally complex, and I want to say randomness is the absence of structure
  rather than the height of it. (4) The measure that looks right to me is assembly
  index: the length of the shortest sequence of joining operations needed to build
  an object from some set of elementary building blocks, where previously assembled
  pieces can be reused as units. It gives low scores to regular crystals and to random
  aggregates, and high scores to things like a folded protein, a watch, or a genome.
  (5) But I also hold that complexity should be intrinsic to the object itself — it
  shouldn''t shift when we change our choice of elementary building blocks, the library
  of parts we count as reusable, or what else happens to be in the environment. (6)
  And I hold that complexity is not a historical or etiological property: if a clever
  chemist makes exactly the same molecule in a three-step laboratory shortcut that
  a bacterium needs thirty enzymatic steps to assemble, the molecule is exactly as
  complex either way, because what matters is the object that got made, not the route
  by which it happened to get made.


  To my eye this is a tidy little package, but I''ve learned not to trust my eye in
  philosophy. Could you go through the set and tell me which of these commitments
  are genuinely in tension and which only seem to be, rank the real tensions by how
  severe they are, and say what the cheapest repair would be and what it would cost
