  an effect in audience, (ii) audience to recognize that intention, (iii) the recognition
  to be at least part of the reason for the effect. A classic subtlety: the third
  clause (reflexive-communicative intention).

  - Scalar implicatures: "some" implicates "not all." Debate about whether these are
  really conversational (Gricean) or conventional/default (neo-Gricean accounts differ).

  - Difference between implicature and entailment.


