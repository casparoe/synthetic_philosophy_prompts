  Let me write:


  "Last night I had a long argument with a friend about whether falsifiability can
  carry the burden of separating science from non-science. I left with two positions
  much sharper than the ones we started with, and I would like to see them written
  down in their strongest forms, set against each other in dialogue.


  The first position is a practical, procedural falsificationism. It does not claim
  that unfalsifiable statements are meaningless or that science proceeds by naive
  refutations. It claims that what makes an inquiry scientific is a standing policy:
  its central claims are held so that some possible observation would count against
  them, and when a prediction fails, the failure is treated as information rather
  than reinterpreted away. The decisive difference between science and pseudoscience,
  on this view, is not whether a claim is falsifiable in isolation but whether the
  practice arranges matters so that its core commitments could lose.


  The second position rejects any single criterion. It holds that falsifiability is
  simultaneously too weak and too strong: too weak because demonstrably pseudoscientific
  enterprises make falsifiable claims and then raise a thousand qualifications; too
  strong because real science keeps a theory alive through anomalies by adjusting
  auxiliary assumptions, deciding the anomaly is an instrument problem, or waiting
  for better theoretical understanding. On this view demarcation is a graded, interest-relative
  judgment about the whole style of a community: how it distributes blame between
  core claims and auxiliary assumptions, whether failed predictions tighten or loosen
  constraints, and where it sets the threshold of ''anomaly'' vs ''refutation.''


  Write the dialogue so that both speakers are equally competent and neither is a
