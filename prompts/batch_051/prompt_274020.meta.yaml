  on what Lewis''s triviality results for indicative conditionals actually show. It''s
  gotten kind of frustrating: we all accept the same formal facts, but nobody budges.


  Quick summary of the shared ground. Assume indicative conditionals like ''if A then
  B'' express ordinary propositions, with truth conditions, so that they slot into
  a Boolean algebra in the normal way. Now take the principle that the probability
  of such a conditional equals the conditional probability P(B|A). Lewis''s theorem
  (and the later refinements) show that if both of those hold—for any reasonable probability
  function over a language closed under the conditional—then the probability functions
  are trivial in a sense that can''t be right: they either collapse to at most a handful
  of values or the language can''t contain the kinds of nested conditionals and Boolean
  combinations we use all the time. So something in the package has to go.


  The fight is about which thing. One camp says: obviously the conditional doesn''t
  express a proposition; triviality is a proof that the propositionalists were wrong.
  They treat the probability principle as a non-negotiable datum: it just is how speakers
  assign probabilities to conditionals, e.g., ''probably if it rains the game will
  be cancelled'' goes with a high conditional probability, not with the probability
  of a material conditional. A second camp says: no, conditionals do have truth conditions
  (a possible-worlds/closest-world story, or something else), and the probability
  principle only holds approximately or in special cases; triviality shows the unrestricted
  principle is false, full stop. A third camp says Lewis''s setup is rigged: it assumes
  ''the probability of a conditional'' picks out the same proposition under different
  probability functions, when really the conditional may shift its content with context,
  or with the background probability function, or only has a proposition relative
  to a probability space; on that diagnosis the theorem dissolves.


  My working hypothesis is that this is not really a disagreement about the logic
  at all. It''s a disagreement about what counts as a datum. The no-truth-conditions
  side treats our brute judgments about the probability of a conditional as hard data
  that any semantic theory has to respect exactly; the truth-conditions side treats
  those judgments as loose, or as really being about assertability, or about a related
  but different proposition. Each side has already decided, before the theorem is
  even mentioned, which facts their theory is answerable to. So of course the theorem
  doesn''t move them: it''s just a proof that you can''t have both parts of a package,
  and the two sides were never trying to have both parts.


  Is my diagnosis right? Or is there a genuine formal or empirical question underneath
  this that I''m missing—something like a new triviality-style result with weaker
  premises, or a class of ordinary examples where the two camps make different predictions
  about what speakers judge, or a distinction (semantic content vs. assertability,
