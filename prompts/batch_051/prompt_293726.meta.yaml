  Malthus argued roughly as follows. Any human population, when unchecked, multiplies
  by biological increase, while the means of subsistence can at best be increased
  by much slower increments because land is fixed and cultivation is subject to diminishing
  returns. Since population always tends to press against the food supply, some check
  must bring the two into line. The check may raise mortality (famine, epidemic, war)
  or lower fertility (later marriage, self-restraint). The long-run prediction was
  that the living standards of the mass of humanity stay near subsistence: any improvement
  in real wages or public relief is only temporary because it triggers earlier marriage
  and more births until wages are bid back down.


  Two developments since then are usually taken to have broken this argument.


  First, the demographic transition. As societies industrialize, mortality declines,
  and eventually fertility declines as well — not merely through suffering or self-denial,
  but through deliberate family limitation as rising incomes, education, urbanization,
  and the changed economic value of children alter reproductive choices. Population
  growth slows or reverses while living standards rise.


  Second, the food supply stopped behaving like a fixed, land-limited quantity. Industrial
  nitrogen fixation, the Green Revolution, mechanization, and other agricultural technologies
  made output per hectare grow rapidly, so food production rose faster than population
  over a sustained period.


  Now consider the claim that Malthus was right but early: the underlying mechanism
  — that population and resources tend toward equilibrium, and that this can happen
