  by whether they produce/exhibit the standard verdicts. (Standard objection: Kivy,
  etc. But no citations needed.) This is a known objection.

  2. Conditioning/enculturation: delicacy and practice are acquired by exposure to
  a tradition''s canon, so the purported "standard" is just the entrenched preferences
  of a particular culture/class. Good.

  3. Residual divergence/disagreement among qualified judges: even ideal critics with
  all five qualities can disagree (about ranking, about particular works), so there''s
  no single standard unless you aggregate somehow. Good.

  4. Conservatism about the new: true judges trained by comparison within an existing
  canon will be systematically biased against novelty, since revolutionary works violate
  the very patterns the judges learned from. Good.


