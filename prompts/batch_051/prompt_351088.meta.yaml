  Hume''s essay "Of the Standard of Taste" (1757). Key ideas: the "paradox"/antinomy:
  taste is subjective; yet the judgment "Homer is better than Ogilby" is so obviously
  correct that anyone who disputes it is absurd. Hume''s solution: rules of art derived
  from experience and observation of what pleases across ages/nations; the "true judge"
  has strong sense, delicate sentiment, practice, comparison, and freedom from prejudice;
  and the joint verdict of such judges is the standard.


