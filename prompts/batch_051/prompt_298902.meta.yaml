  Nozick''s tracking theory:

  S knows that p iff:

  1. p is true.

  2. S believes that p.

  3. If p weren''t true, S wouldn''t believe that p (variation: S''s method M wouldn''t
  lead S to believe p).

  4. If p were true, S would believe that p (adherence, under the same method).


  Closure principle: If S knows p, and S knows p entails q, then S knows (or at least
  is in a position to know) q. Nozick''s theory denies closure under known entailment
  because sensitivity fails to transmit across entailment: knowing p via a sensitive
  belief doesn''t make q sensitive because in the closest not-q world, p might still
  hold... wait, the standard example: I know I have hands (sensitive: if I had no
  hands I wouldn''t believe I had them). I know "I have hands" entails "I am not a
  handless brain in a vat (BIV)." But do I know I''m not a BIV? Nozick says no: if
  I were a BIV, I''d still believe I''m not (the belief "I''m not a BIV" is insensitive).
  So I can know p and know p entails q, yet fail to know q — closure fails.


  Control-systems translation:

  - The world/environment is the "plant" with true states.

  - A belief is an observer''s estimate of a plant state variable.

  - Knowledge is an estimate that "tracks" the true state in a counterfactually robust
  way: it''s not just currently correct (open-loop), but the estimator is responsive
  — if the state were different, the estimate would be different (sensitivity: disturbance
  rejection / observability under perturbation); and if the state stays the same across
  nearby conditions, the estimate stays latched (adherence: no false alarms, steady-state
  tracking).

  - Sensitivity = the estimator rejects a setpoint change/plant perturbation (wouldn''t
  report the old value if the plant changed). Adherence = no drift/overshoot in the
  opposite direction; noise rejection without losing the signal (the estimator doesn''t
  oscillate away from the true value in nearby worlds).

  - Method indexing = the estimator''s gain/algorithm/sensor suite.

  - Epistemic closure = composition of proven tracking loops: if estimator A tracks
  x, and x implies y (a supervisory logic derives y from x), does the cascaded system
  A→logic→y track y? Nozick''s answer: not necessarily, because the disturbance that
  makes y false need not be the one that makes x false; y can be false through channels
  that leave x intact, and in those worlds the inner loop still reports x, and the
  logic still outputs y. So the cascade is not robust to the y-falsifying perturbations.
  This is exactly a control-theoretic failure of disturbance rejection in the outer
  loop: the controller was tuned to track x, not to detect the specific off-nominal
  modes that threaten the derived variable y.

  - Translation clean pieces: truth = plant state; belief = estimate; tracking = closed-loop
  robustness to counterfactual perturbations; method = controller/sensor tuning; sensitivity
  = error-signal responsiveness to state changes (disturbance response); adherence
  = holding the estimate under irrelevant noise.

  - Distortions: counterfactual sensitivity is about a single discrete "what if the
  state were otherwise" whereas controllers are evaluated over a family of disturbances/noise
  spectra — the translation forces you to specify a perturbation class, which Nozick
  never does. The "closest possible world" becomes choosing a disturbance model, which
  imports a metric/prior that Nozick''s semantics leaves implicit. So the translation
  does work but only by adding structure Nozick didn''t have — that''s a distortion
  that''s revealing.

  - Untranslatable residue: the normative element — knowledge as a success term, something
  to which agents are entitled, not merely an engineering performance criterion. Also
  first-person/phenomenological aspect? Also the notion of "justification" or "warrant"
  beyond tracking? The control vocabulary can say "the loop is robust" but not "the
  agent is entitled to act" — though maybe that''s expressible as a performance guarantee
  or a safety certification. Another residue: p-by-p tracking recovers a state-variable
  estimate, but human knowledge seems closed under certain inferences in a way controllers
  are not required to be; the residual is whether "knowledge" is a relationship to
  individual propositions or to a model. Hmm.

  - Verdict: residue is partly a defect of control vocabulary (it''s descriptive/normative
  gap) and partly a sign Nozick''s view was under-specifying the perturbation class
  — i.e., the original was less clear than it looked; the "tracking" metaphor hides
  the need to say which counterfactuals count, and abstracting away from a similarity
  metric is doing real work.


