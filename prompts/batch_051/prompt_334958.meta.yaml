  ---


  I''ve been arguing with a friend about which new pieces of recorded music count
  as "the same song" as some earlier piece, and I''ve realized I lean on a concept
  I can''t articulate. The disagreements get especially sharp with production-style
  cases: covers, remixes, samples, and replicas. I''d like you to give me a working
  definition of being the same song, where the definition is about the ordinary listener''s
  concept rather than copyright law''s answer. (The two are different; I don''t want
  the legal tests.)


  Run the definition through the following cases. (1) A singer records a new performance
  of a well-known tune, keeping melody, chords, and lyrics unchanged. (2) A producer
  takes only the isolated vocal stem from a hit record, re-pitches it, and places
  it over an entirely new instrumental; fans call it a remix of the original. (3)
  A hip-hop producer loops a two-bar drum break from an old soul record and builds
  an original rap song around it; the new track shares no melody, harmony, or vocals
  with the old one, only the looped audio. (4) A band writes an original song that
  copies a hit''s chord progression, tempo, and guitar tone but not its melody or
  lyrics; listeners say it "feels like" the hit but can''t name a quotation. (5) An
  AI model trained on one singer''s catalog generates a wholly new song with a new
  melody and lyrics but the singer''s exact timbre, so that listeners instantly ask
  who the singer is. (6) A mashup artist layers the complete vocal of one song over
  the complete instrumental of another, producing something everyone identifies as
