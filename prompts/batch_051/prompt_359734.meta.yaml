  Key facts about info cascades (from my knowledge):

  - Setup: people make decisions sequentially, each has private info plus observes
  the actions (not signals) of predecessors. It can be rational to follow the crowd
  and ignore your own private signal because the crowd''s actions aggregate their
  signals.

  - A cascade forms when someone finds that the accumulated public evidence (via actions)
  outweighs their private signal. Once it starts, subsequent people with private signals
  can''t add information because they act identically; the cascade "blocks" information
  aggregation.

  - Crucial points: cascades are informationally fragile — a small amount of public
  information (e.g., a credible announcement) can overturn a cascade. Cascades can
  be wrong (everyone converges on the wrong action even though collectively they''d
  know better if they pooled signals) with non-trivial probability. But individuals
  are not being irrational: given the pattern of actions, each move is Bayesian rational.

  - Distinction: informational cascade (social learning from actions) vs. herding
  due to payoff externalities, reputation, conformity. In pure cascade models, you
  follow because of information, not pressure.

  - Cascades are ex ante inefficient? They can produce incorrect aggregate outcomes,
  but the probability that a cascade is wrong depends on signal precision. Also note
  cascades are "fragile" because a little public info or observability of signals
  could break them.

  - Important subtlety: A cascade isn''t "everyone follows blindly"; it''s that a
  rational Bayesian would do so given the public history; the action reveals no new
  info once cascading.

  - Another subtle point: cascades require certain conditions — discrete action space,
  sequential choices, observation of actions not signals. If people could observe
  private signals or if action space were rich, information would eventually aggregate.


  Potential subtle misrepresentations to build into the summary:

  1. Overstatement: "this proves that crowds are systematically dumb / markets always
  bubble." Actually cascades are possible but not inevitable; fragile; not every herd
  is a cascade.

  2. Conflation of rational herding with conformity or social pressure: "people pile
  on because they don''t want to look out of step." Actually in the model it''s purely
  informational.

  3. "Once a cascade starts it can never reverse" — actually cascades are fragile
  and can be overturned by public information; and negative cascades can switch.

  4. "A rational person should always follow the crowd when there''s a cascade" —
  well, within the model given observed history yes, but with richer actions or signals
  not necessarily.

  5. Overstatement about "everyone ignores their own judgment" vs. on average some
  people''s signals matter; the first few act on their signals, and those who are
  pivotal reveal info.

  6. "Because cascades are rational, following a cascade is always the best thing
  to do in the real world" — but model assumptions rarely hold; in reality, payoffs
