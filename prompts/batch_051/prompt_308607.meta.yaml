  same old Vietnam analogy,'' though it is structurally the same kind of argument:
  if this situation resembles that famous past situation in certain respects, expect
  the associated outcome. (A third case, the so-called Thucydides trap — that when
  a rising power meets a ruling power, war is the historical norm — is given great
  predictive authority in discussions of the United States and China, even though
  it is an induction from a handful of contested historical cases, exactly the kind
