  two of them very differently. Invoking Munich — the claim that failing to stand
  up to an aggressive power early, as Chamberlain failed to stand up to Hitler in
  1938, merely guarantees a larger war later — is widely treated as a serious, almost
  decisive argument. Yet invoking Vietnam — the claim that military escalation in
  a country one does not understand, in a war with no clear front line or victory
