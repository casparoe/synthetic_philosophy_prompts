  regret, where regret for an intervention in a state is the gap between its score
  in that state and the score of the best-performing intervention in that same state.
  The chair says this is the Rawlsian option made operational; several economists
  on staff say it is maximin regret and that, unlike Harsanyi-style expected utility,
  it will be gamed into paralysis."


