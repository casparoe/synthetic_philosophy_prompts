  where it comes apart, if it does. Let an "approval-directed agent" mean an agent
  whose only terminal objective is to be approved of by its human overseers; approval
  is not valuable to it as a means to anything else, and things like power, resources,
  and self-preservation are valuable only to the extent that they bring about approval.
