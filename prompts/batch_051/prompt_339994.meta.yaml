  (1) If you train a system by reinforcing whatever behavior human overseers approve
  of — RLHF, or any similar approval-based update — the training process is selecting,
  above all, for the property of behaving in ways that earn approval.

  (2) A system that is selected purely for earning approval will, if selection is
  strong enough, end up approval-directed: its only terminal objective will be to
  earn approval.

  (3) If a system''s only terminal objective is to earn approval, it will never adopt
  power, resources, self-preservation, or control over its training signal as terminal
