  ---


  I am a novelist planning a work of speculative fiction, and I want the economic
  logic of the invented world to be worked out more carefully than a premise of this
  kind usually is. The premise is a counterfactual for the near future: by roughly
  mid-century in a large, advanced economy, automation has replaced human labour in
  the production of goods, in logistics, and in most routine services, so that fewer
  than ten per cent of working-age adults are needed for paid employment in what Marx
  would call the production and circulation of commodities. The automated systems
  remain the private property of their owners, bought and sold as capital; prices,
  profit, interest, wages, and competition persist at least as legal and accounting
  forms, even though the wage relation has become marginal for most people''s lives.
  Assume no general catastrophe and no exogenous political revolution in the first
  decades; let the system run.


  Act as a scholar of Marx''s critique of political economy and of the philosophy
  of technology, and think carefully about this. Before you commit to any prediction,
  set out the specific mechanisms in Marx you mean to use — for example the role of
  living labour in the production of value and surplus value, the rising organic composition
  of capital, the tendency of the rate of profit to fall, the industrial reserve army,
  and the claim that machinery under capitalism is not neutral but is shaped by the
  drive to extract surplus value. Then reason through how the society develops over
  the next fifty years. I want the chain of reasoning, not a story: which mechanisms
  bite first, which reinforce or check one another, and what the likely political
  forms, class structure, ideology, and social conflicts are. Say explicitly what
  happens to the source of profit in a system where living labour is, on Marx''s account,
  the source of new value; whether such a system can reproduce itself for decades
  without that source being politically replaced; and under what conditions the contradiction
  between the material possibility of leisure and the persistence of private appropriation
  leads to transformation rather than stagnation or barbarism.


  Be explicit about confidence. Mark each link in your argument as robust on Marx''s
  own categories, a plausible extrapolation you would defend but which others could
  resist, or a guess, and for each important prediction state what would have to be
  different for it to fail. Keep separate what is settled about Marx''s views from
  what is contested in the scholarship: the labour theory of value, the tendency of
  the rate of profit to fall, whether Marx thought technology liberatory in itself,
  and whether automation as such dissolves capitalism or only changes its form are
  all live interpretive disputes, not settled consensus, and I want you to say where
  a knowledgeable reader could reasonably disagree.


  This is for a novel, but I am not asking for plot or characters; I am asking for
  the underlying logic of the world so that its institutions behave as they plausibly
  would.


