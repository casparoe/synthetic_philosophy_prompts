  frame''s quality is measured by the quality of the actions it invites." Hmm.


  2. "The aesthetics of optionality": The beauty of a game is the beauty of the possible
  actions that weren''t taken. Hmm.


  3. "Agency as prosody": Agency in a game is not a property of choices but of the
  modulation of tension between choice points. Like prosody in poetry: what matters
  is not what the player does but the rhythm of decision and consequence.


