  Standard ways of interpreting/resolving the paradox:

  1. The "aim at other things" solution (Mill): pursue other ends (virtue, knowledge,
  love of others), get pleasure as a by-product. This is not so much solution as practical
  advice; it''s a paradox for direct hedonism.

  2. The paradox only applies to direct pursuit in the moment; a hedonist can adopt
  a policy/rule of pursuing other things (indirect hedonism).

  3. The paradox is a quirk of attention/affect: happiness is a state that can''t
  be directly targeted because pleasure is not a separate object but a quality of
  activity; targeted attention interferes.

  4. The paradox depends on observation: the best predictor of well-being is not consciously
  valuing pleasure but valued engagement (flow), etc. Maybe too psych.

  5. Some reject that it undermines hedonism: it''s a practical constraint, not a
  refutation—hedonism as a criterion of rightness doesn''t require consciously aiming
  at pleasure at every moment.

  6. Some read it as self-effacing: a theory whose successful implementation requires
  not believing it.


