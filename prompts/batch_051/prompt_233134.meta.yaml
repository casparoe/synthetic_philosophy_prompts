  Structural features:

  1. Threshold effect with unknown threshold: expected harm equals (stakes) × P(agent''s
  unit is pivotal). If many others are far from threshold, probability tiny, expected
  harm small → inefficacy succeeds.

  2. Incremental/dose-response harm: each unit adds a fixed small amount of harm with
  probability 1, so expected harm equals that small amount; it might be small but
  nonzero. Whether it justifies the cost depends on magnitudes.

  3. Overdetermination: if enough others act, harm occurs regardless; your unit adds
  nothing either way → truly zero efficacy.

  4. But in Case B, to make the same unit efficacious without changing stakes/information/number
  of contributors, we could change the aggregation from "fixed threshold far away"
  to "your unit completes a threshold" — but to keep the information identical and
  tie it to a genuinely optimal rule, perhaps use a "tie-breaking" or "quota" structure:
  e.g., if contributors are sorted and exactly N units trigger a fine, the agent''s
  unit is decisive if it''s the Nth. But to have tiny probability of pivot yet large
  expected effect, need large stakes. Hmm, voting-like: one unit consuming the last
  remaining allowance.


