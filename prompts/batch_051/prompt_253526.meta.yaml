  Prompt draft:


  "A friend and I spent most of Sunday arguing about when one should let an elegant,
  well-supported theory override a stubborn intuition, and when the intuition should
  be allowed to overturn or amend the theory. We emerged with several cases on which
  we agreed, but no principle that covers all of them. I would like to know what principle,
  if any, captures the pattern, and what it says about cases neither of us had considered.


  Here are the cases and my settled verdicts.


  1. Special relativity and absolute simultaneity. I have a strong inclination to
  think that whether two distant events happen at the same time has a determinate,
  frame-independent answer. Relativity says it does not. I take relativity to be right,
  and I treat my inclination as an artifact of having evolved and been educated at
  low relative velocities.


  2. Design intuition and natural selection. I find the vertebrate eye intuitively
  purpose-like, and before understanding the relevant biology I would have called
  that intuition strong evidence for design. But I take evolutionary theory to be
  correct, and I regard the design intuition as a predictable misfiring of a cognitive
  habit rather than as a defeater.


  3. The Monty Hall problem. When a host who knows where the prize is opens a goat
  door and offers the switch, my untutored impulse is that switching and staying are
  equally good. The probability calculation says switching doubles my chance. I accept
  the calculation and regard the impulse as demonstrably wrong; in this case the theory
  is arithmetic enough that I am not tempted to save the intuition.


  4. The flagpole and the covering-law model. According to the covering-law model,
  an event is explained when its description can be deduced from laws plus antecedent
  conditions. The length of a flagpole''s shadow is deducible from the flagpole''s
  height, the sun''s angle, and optical laws; but we would not say the shadow''s length
  explains the flagpole''s height. Here I let the intuition about explanatory asymmetry
  overturn the model, or at least force a substantial amendment to it; I do not set
  the intuition aside.


  5. Transplant and act-utilitarianism. A theory that says we may carve up one healthy
  patient to save five is, I think, on this point rejected: my unwillingness to do
  it is not a disposable data point. The intuition stands and the theory is to be
  constrained by it, not because I have an independent proof of the intuition but
  because a moral theory that cannot accommodate it of treating someone as a mere
  means has failed in its own terms.


  6. Mary and the knowledge argument. A committed physicalist says every fact is a
  physical fact. Mary knows every physical fact about color vision while confined
  to a black-and-white room; on first seeing red she seems to learn something new.
  My verdict here is less clean than in the others: I find the intuition that she
  acquires something genuinely new hard to abandon, but I do not think it obviously
  refutes physicalism. I would put it in the intuition-wins column for the purposes
  of this exercise, but with a note that the intuition''s target may be a limitation
  of a certain representational story rather than a new nonphysical entity.


  The pair that troubles me most is case 4 against cases 1, 2, and 3. In case 4 I
