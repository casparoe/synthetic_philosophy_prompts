  ---


  I teach a second-year undergraduate seminar on the moral force of everyday rules,
  with about sixteen students, and I have seventy-five minutes to spend on one question:
  when locals treat a convention—tipping, queueing, walking on a particular side of
  the pavement, jaywalking at an empty crossing—as something a person ought to follow,
  is there really a moral obligation in play, or only a social rule with social costs
  for breaking it? And what, if anything, should change when a visitor follows a different
  local rule or simply finds the convention pointless?


  Design a single runnable activity for this session. It should not be a lecture or
  a discussion of prepared cases. The participants should first converge on an arbitrary
  but useful convention through a game with actual small stakes, then find themselves
  enforcing it against someone who has not been party to it—first a fellow insider,
  then a newcomer who could not have known the rule or who follows a different rule
  from elsewhere. The arrangement should be such that they feel the pull of both claims:
  "this is now a real obligation and we may blame those who flout it" and "this is
  still just an arbitrary solution we happened to settle on." I want at least one
  moment where a rule that started as merely practical comes to be treated as though
  violation were morally wrong, and at least one moment where the group must decide
  whether the visitor''s ignorance or foreign convention makes any difference to that
  judgment.


  Give me the full design: rules, materials that need no money and no technology beyond
  the room, a payoff scheme using points or course credit or some other cheaply realized
  currency, a timeline for the seventy-five minutes, and a debrief. The debrief should
  map concrete moments in the activity to the philosophical distinctions—convention
  versus moral requirement, the difference between blaming someone for the harm caused
  and blaming them for the violation itself, the asymmetry between locals and visitors,
  and the difference between coordination conventions like queueing and normatively
  loaded conventions like tipping. Tell me what will predictably go wrong the first
  time I run it and how to handle each failure. And be candid about what the activity
  cannot reproduce: for example, the historical embeddedness of real conventions,
  or the stakes of genuinely needing a stranger''s cooperation, will likely have to
  be supplied by me in the debrief rather than manufactured in the room.


