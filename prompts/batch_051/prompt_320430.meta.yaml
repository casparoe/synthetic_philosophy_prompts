  Prompt text draft:


  I have been trying to shake the sunk-cost habit out of my own reasoning, and I have
  collected a set of verdicts about escalation of commitment that I cannot yet get
  to sit under one rule. I want to know whether there is a clean principle behind
  them, or whether I am just applying a label—escalation of commitment—to cases that
  have nothing important in common.


  Here are the cases as I see them.


  (1) The nearly-finished system. An enterprise software project has absorbed $8 million
  and is not done. Completing it costs $1 million more, and the finished system would
  be worth $2 million to the business. Verdict: finish it. The $8 million is gone
  either way; $1 million buys $2 million.


  (2) The same system, worse numbers. As above, but the final $1 million buys something
  worth only $500,000 in the best case, and the alternatives for the team are at least
  as good. Verdict: kill it without regret, even if it means publicly admitting the
  $8 million was lost. I don''t think the size of the already-spent sum should move
  me at all between (1) and (2).


  (3) The PhD. A student has spent five years in a PhD they no longer enjoy; one more
  year gets the degree, and the degree genuinely opens non-academic paths they want.
  Verdict: finish—but only because the final year buys the credential. If we hold
  the unhappiness fixed and remove the career benefit, I say quit despite the five
  years. The five years themselves count for nothing.


  (4) The classic dollar auction. Two bidders, a one-dollar prize, both top bidders
  pay, open ascending bids. Once the auction has gone past a dollar, each bidder is
  choosing between losing a smaller amount for nothing and losing a larger amount
  while getting the dollar; each raise looks locally better than folding. Verdict:
  the mistake is entering without a binding precommitment to stop, not the final overbid
  considered in isolation. Winning at $1.50 never looks like a coup to me.


  (5) The undervalued asset variant. Same auction mechanics, but the object is known
  to be resaleable for $1.50 (a domain name with a waiting buyer, say). Bids can go
  past $1.00 and I feel no fallacy at all—until they pass the point where continuing
  no longer has positive expected value for the bidders, at which point the pathology
  returns in full. Here the difference from (4) seems to lie only in the value of
  the prize, not in anything about the psychology.


  (6) The costly retaliation. A government has publicly and deliberately committed
  to punishing defectors, and the threat has kept order. A defection happens; punishing
  is now expensive and the immediate damage is already done, but everyone is watching
  whether the commitment is kept. Verdict: follow through. I don''t think this is
  throwing good money after bad; the cost buys credibility in later rounds, and the
  original commitment was rational because the threat deterred.


  (7) The founder''s public vow. A founder has told employees and investors, repeatedly,
  that the company will not abandon a certain product line. The line is failing; continuing
  costs real money, and the product probably will not recover. Abandoning it saves
  money but wrecks the founder''s credibility for future announcements. Verdict: this
  can be rational, but it is much less clearly rational than (6), and I suspect many
  real versions of it are just self-deception wearing the costume of (6). I cannot
  state, in general, where (6) and (7) come apart.


  (8) The counterinsurgency. A long campaign has cost two thousand lives. Staying
  costs more lives and has only a small chance of leaving things better than a withdrawal.
  Withdrawing will be publicly read as making the dead "die for nothing," and it will
  damage the state''s reputation. Verdict: withdraw anyway. The dead are sunk, and
  dying more to rescue the meaning of the dead is the fallacy at scale. But I admit
  this case strains my confidence: (8) looks like (6) in every structural particular
  except scale, and I am not sure scale is supposed to matter to a principle.


