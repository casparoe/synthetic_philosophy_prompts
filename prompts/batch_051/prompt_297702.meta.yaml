  The philosophical puzzle: sadness as an emotion requires an object (intentionality)
  and cognition (beliefs about loss). Sounds can''t have beliefs. So how can pure
  instrumental music be sad? This is the "problem of expressive properties."


  Step-by-step argument idea:


  (1) For a state to be an emotion of sadness, it must involve a felt bodily profile
  plus a cognitive appraisal of loss.

  (2) Pure instrumental music has no cognitive states, so it cannot have the appraisal
  component; at most it can present the felt bodily profile.

  (3) Yet when we call a piece sad, we are attributing sadness to the music, not merely
  to ourselves.

  (4) So either our ordinary talk is systematically false, or the sadness we attribute
  to music is not the emotion of sadness but something else.

  (5) But ordinary talk is not systematically false; we can tell the difference between
  sad and cheerful music reliably.

  (6) Therefore, ''sad'' in music refers to a different property: the perceived aural
  appearance of sadness, not the emotion itself.


