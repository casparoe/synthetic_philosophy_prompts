  Domain: Music and emotion: how can sounds be sad?


  Classic positions:

  - Resemblance: music is sad because it resembles sad expression (Davies).

  - Persona: we imagine a persona expressing emotion.

  - Arousal: music is sad because it makes us feel sad.

  - Cognitivism: music is expressive of sadness in virtue of sounding the way sadness
