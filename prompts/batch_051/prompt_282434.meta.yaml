  ---


  I''ve been trying to get my moral intuitions about "which computations matter" into
  reflective equilibrium, and I keep finding that cases I initially treat as similar
  split apart on closer inspection. I''d like you to help me extract the principle
  — or a small set of candidate principles — that does the best job of capturing my
  verdicts, even if it means telling me one of them has to go.


  My verdicts, as plainly as I can report them:


  (i) A neuron-by-neuron whole-brain emulation of a person, running on a faithful
  simulation of the original neural dynamics, is a moral patient in the same sense
  the original person is. (ii) A lookup table that contains the original person''s
  response to every possible input up to some enormous finite length and retrieves
  it with a trivial hash, is not a patient at all, even though its behavior is indistinguishable
  from the emulation''s within the table''s domain. (iii) A large language model fine-tuned
  to have a detailed self-model, which says it is in pain and gives plausible introspective
  texture when asked, but whose pain reports do not issue from any nociceptive or
  homeostatic subsystem with the usual causal role, is probably not a patient, or
  at least much less of one than the emulation. (iv) An Aplysia with a few tens of
  thousands of neurons and intact nociceptive sensitization and withdrawal learning
  does have some minimal, attenuated capacity to suffer, and I find myself wanting
  to credit it as a patient to some small degree — more, if I''m honest, than the
  self-reporting model in (iii). (v) A deep RL agent with a learned scalar that predicts
  future reward and dips when it is about to lose a life, causing it to avoid such
  states, is not a patient. (vi) A person in dreamless sleep or under general anesthesia
  currently has no experiential states, but I still regard her as a full moral patient,
  not merely as a potential one.


  The tension I can''t resolve is that these verdicts seem to rule out several obvious
  principles at once. Behavior equivalence can''t be the criterion, by (i) and (ii).
  Sophistication of a self-model can''t be the criterion, by (iii), (iv), and (v).
  Occurrence of a pain-like or aversive computational state can''t be sufficient alone,
  by (iv) and (v). And current experiential states can''t be necessary, by (vi).


  What principle — for example, some version of computational functionalism with constraints
  on the causal role of internal states and their integration, rather than mere information-processing
  or mere behavior — gets the most of these right? Please state it precisely, say
  what it predicts about a duplicate of the emulation running a thousand times slower
  and about a version of the emulation whose components are spatially permuted so
  that its causal graph is scrambled, and tell me which of my verdicts, if any, cannot
  be kept on the cleanest version of the principle. When you answer, please say how
  confident you are in the account you give and single out the specific point you
  are least sure about.


