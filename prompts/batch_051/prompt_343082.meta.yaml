  The cases are these. (1) You are offered £20 or £10 with no further consequences;
  I take it the £20 is clearly better. (2) An agent chooses a dominated option purely
  out of habit, say buying a more expensive train ticket because it is the one they
  have always bought; I take it that they have not thereby shown the dearer ticket
  to be rationally preferable. (3) A person faces a dial with 1,001 settings. Setting
  0 delivers no money and no electric shock. Turning the dial up by one step adds
  £10,000 a year and increases a mild electric current by an amount too small to be
  felt; at setting 1,000 the income is enormous but the shock is searing and constant.
  For every adjacent pair, the person is confident that the higher setting is better
  than the one below, because the money is salient and the difference in shock is
  imperceptible; yet the same person confidently prefers setting 0 to setting 1,000.
  (4) A smoker judges that the next cigarette is, right now, preferable to not smoking
  it, while also judging that a smoke-free year is preferable to a year of smoking;
  this is another case of preferences running in opposite directions at different
  times. (5) A cautious person prefers a certain £500 to a 50% chance of £1,100, even
  though the gamble has the higher expected value; I am unsure whether that is a case
  of ''better than'' at all, or simply a taste for safety.


  Please propose a definition, run it through these cases, and say where it gives
  a verdict you did not expect or leaves one of the cases unsettled. In particular,
  I want to know whether the definition requires ''better than'' to be transitive,
  and whether the dial case should be described as a failure of rationality, a failure
  of the definition, or a perfectly coherent set of preferences. If the definition
  does not handle a case, revise it or defend the surprising result. Please answer
  in British English."


