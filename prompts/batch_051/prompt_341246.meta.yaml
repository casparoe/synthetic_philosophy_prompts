  Let me think about the philosophical crux of desuetude and rule of law:


  - If a law is never enforced, does it lose its status as law? Desuetude doctrine
  (from civil law, canon law) says statutes can lapse through long non-use or contrary
  custom. Common law traditionally has no desuetude for statutes (or actually some
  US state courts have applied it; some federal courts considered for obsolete statutes).
  But the prompt shouldn''t lean on that niche doctrine; instead it can be explored
  intuitively.


  - Rule-of-law considerations: laws should be general, public, prospective, clear,
  non-contradictory, not impossible, stable, and congruence between rules as declared
  and as enforced (Fuller/Lon Fuller''s principles of legality). Desuetude interacts
  with "congruence" — if the law on the books diverges from what officials actually
  do, we get a gap between announced rule and actual rule. That''s a real rule-of-law
  problem: secret or unpredictable enforcement is arbitrary. But also "selective enforcement"
  concerns.


  - Fair notice: if a law is never enforced, people reasonably assume it''s dead;
  surprised enforcement means people couldn''t guide conduct by the law as actually
  applied.


  - Consistency and generality: if the state enforces only occasionally against one
  person, that''s arbitrary and unequal — treating that person as a scapegoat, not
  under general law.


  - On the other side: non-enforcement doesn''t repeal a law; the legislature passed
  it and only the legislature can repeal. Officials'' failure to do their duty shouldn''t
  change what the law requires. Citizens can''t unilaterally nullify a law by widespread
  violation (otherwise the most violated laws would vanish). If enforcement is resumed
  (or begun), the law was always there.


  - The "rule of recognition" angle maybe too technical. But we can keep it intuitive.


