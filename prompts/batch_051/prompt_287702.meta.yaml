  flood barrier when three climate models assign materially different probabilities
  to the flood it is meant to prevent, and whether to suspend a widely used drug when
  two large studies reach opposite conclusions about a rare but serious side effect.
  Continuous prose only throughout — no headings, bullet points, bold text, or tables
  — written as a letter to me."


