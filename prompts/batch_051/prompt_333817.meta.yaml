  I am a philosopher of mind, and for some years I have found myself drawn to a particular
  version of panpsychism — constitutive micropsychism — according to which the consciousness
  of a human being is not an emergent novelty but is literally constituted by, or
  grounded in, the experiential states of the organism''s most fundamental physical
  parts. The theory''s appeal, as I see it, is systematic: it refuses to permit consciousness
  to pop into existence at some arbitrary threshold of complexity; it avoids both
  a nonphysical soul and a brute psychophysical bridge law; and it keeps the ontology
  lean, since the only stuff there is experiential stuff, merely organized at different
  scales. When I try to take the view literally, however, I collide with an intuition
  I cannot shake. My experience is had by exactly one subject. However many micro-subjects
  one packs into a brain, their experiences co-occurring looks to me like at most
  a chorus of tiny minds — never the single, unified thing it is like to be me. The
  difficulty is not merely that my sensations might combine in some surprising way;
  it is that subjects seem to be the wrong sort of entity to be summed at all. That,
  in my view, is the combination problem in its sharpest subject-summing form, and
  it makes me suspect that my attraction to the theory may be little more than a taste
  for parsimony and gradualism dressed up as metaphysics.


  [Second paragraph:] I want you to help me decide what should yield here: the theory''s
  promise of a lean, non-emergent ontology of consciousness, or the firm intuition
  that a composite of many subjects cannot be one subject. Please respond in exactly
