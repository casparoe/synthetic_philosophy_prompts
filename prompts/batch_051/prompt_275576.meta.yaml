  Detailed design:


  Setting: undergrad political philosophy or intro ethics seminar, 16-20 people, one
  50-minute session.


  Materials: index cards (green "village tokens" and red "exit tickets"?), a deck
  of cards for uncertainty, whiteboard for ledgers. Payoffs: points redeemable for
  e.g. extra credit or candy? But no real money needed; points could determine who
  gets a small prize, or just points count and they want to maximize. Need incentives;
  no real money but points convert to "one extra credit point for top village" maybe.
  But asker note says payoffs that don''t need real money. We can use grade points
  or a "premium" like deciding the discussion topic? For students, maybe "the two
  highest-scoring villages choose the focus for next week''s reading" or "points convert
  to a small number of participation points for the top group." But maybe make stakes
  small but real: "top-scoring group gets to choose next session''s case study." That''s
  fine.


  Game phases:

  1. "Founding" phase: participants sorted into villages of 4. They spend 3 minutes
  writing a one-line "village code" and choose a name; each player gets 3 coins. Then
  repeated rounds (5): each round, each player can put 0, 1, or 2 coins into the village
  pot; pot doubles and is split evenly. This is a public goods game. Keep a visible
  ledger of contributions by name. Predictably, contributions settle at about 1, and
  maybe a local norm emerges (everyone gives 1). But pure public goods game can have
  free-riding; debrief.


  2. "Cooperation with reputation" phase: add "social insurance" — each round, one
  randomly selected player faces a "shock" (loses 3 coins) and others can voluntarily
  transfer coins. Ledger records transfers. Communities build reciprocal norms. This
  creates shared history and accounts.


  3. "Dissolution" phase: announce that half of each village is moving; in a mock
  lottery, members are reassigned into new villages of the same size composed of strangers
  from mixed old villages. The old ledgers are taken away (or not visible to new villagers).
  Crucially, the same public goods/insurance rounds continue for several rounds. Observe
  whether contributions and transfers reproduce or collapse. Typically, trust collapses:
  no one knows whom to reciprocate with; contributions drop; transfers fall; new "defensive"
  norms emerge.


  4. Optional "reunion" twist: a subset of original villages gets reformed (the community
  can be reassembled) with old ledgers restored, to see whether old trust persists
  (it often does partly). This isolates informed trust/history.


  Debrief: map collapse to goods:

  - Reputation/being accountable to people who know you: the old ledger was a crude
  substitute for shared history; without it, reputation cannot work.

  - Informal insurance: transfers were viable because someone could expect reciprocation
  later; new strangers can''t.

  - Local norms: "everyone gives 1" was a shared norm whose contents and enforcement
  depended on who was in the group.

  - Being known/particularity: you didn''t just trust "a person"; you trusted Raj
  because you saw Raj''s transfer pattern last round.

  - Shared memory: the community held its own history; when dissolved, memory was
  no longer common.


  Also map what cannot be reproduced:

  - Real belonging/layered identity: loss in classroom is mild because real-world
  communities involve love, identity, place, years, rituals; the game only shows a
  thin functional trust, not grief, not multi-stranded relationships (you interact
  for economic and civic and private reasons, not one artificial game).

  - Exit/voice: in real dissolution, people have choices/loyalties; game compels movement.


  What could go wrong:

  - Free-riding early makes baseline too low; fix by allowing village to vote a one-time
  "norm contribution" or a quick chat between rounds (Mafia-style) to build norms.

  - Students being game-theory-savvy will try to defect in last round; fix by announcing
  that no one knows which round is last (random termination) or make top-score bonus
  across all rounds.

  - Some players may be risk-averse and never transfer any coins regardless of phase,
  so the shock phase won''t generate rich data; fix by giving each player an initial
  "goodwill token" that must be given away once per community-account phase.

  - The dissolution may not produce a measurable drop if groups are too nice; handle
  by normalizing numbers: if drop is small, debrief can focus on why these particular
  strangers rebuilt trust fast (proximity, signals, someone taking first risk) and
  what real-world counterparts could replace lost trust.


