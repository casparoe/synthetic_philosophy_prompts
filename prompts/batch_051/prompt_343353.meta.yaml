  for spirits, esse is percipere (or velle, agere). So a "thing" persists because
  some mind perceives it — ultimately God, who perceives all at all times ("the Author
  of nature").

  - The master argument: when you try to conceive of an object existing unperceived,
  you are yourself conceiving/perceiving it in thought; you cannot frame the supposition
  without contradiction. So the very attempt to think the unperceived object fails.
  This is often considered an argument that "unperceived existence" is inconceivable,
