  I am a PhD student in moral philosophy, and next month I am presenting a department
  colloquium defending the following thesis: moral principles are best understood
  as lossy compressions of the space of particular reasons — practically indispensable
  summaries that do not state the truth-conditions of rightness. My argument runs
  as follows. Holism about reasons is true: a feature that counts in favour of an
  act in one context can count against it in another, so no finite set of exceptionless
  principles can codify right-making. But the particularist conclusion that principles
  drop out of moral thought is too fast, because agents evidently use principles to
  carry verdicts to novel cases. I argue the best explanation is that principles function
  like predictive models: they trade fidelity for tractability, and their value is
  epistemic and pedagogical rather than metaphysical. The payoff is that particularism
  and generalism, properly located, are not rivals — the particularist wins the metaphysics,
  the generalist wins the practice.


  The audience is a mixed department, and I know the room well enough to expect different
  objections from different quarters. One senior figure is a committed particularist
  in the Dancy tradition who will treat any continuing role for principles as backsliding.
  A second is a Rossian pluralist who holds that pro tanto principles state real recurring
  right-making relations and will think I have conceded too much. A Kantian constructivist
  on the faculty takes principles to be constitutive of practical reason, not summaries
  of it. An empirically minded moral psychologist will be sympathetic but will press
  on whether the compression story is testable. And several applied ethicists want
  principles that can be taught and used in clinical and policy settings and will
  not be reassured by an account on which a principle''s exception conditions cannot
  be stated in advance.


  Prepare me for the question period. I want the objections in roughly the order they
