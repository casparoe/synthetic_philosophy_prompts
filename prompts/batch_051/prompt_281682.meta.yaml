  Potential prompt:


  "Consider a counterfactual world in which Good''s theorem fails for a well-defined
  class of choice problems. Let the failure be this. In our world, for any Bayesian
  expected-utility maximizer, a cost-free and perfectly reliable signal cannot lower
  expected utility, because the agent can always ignore it; the expected value of
  information is the difference between the expected payoff under the posterior-optimal
  strategy and under the prior-optimal strategy, and the maximum conditional on each
  signal is at least as high as the fixed action. Now suppose that in the counterfactual
  world there is a class of propositions—call them decision-reflexive propositions—with
  the following property: when an agent conditionalizes on such a proposition, the
  act that would have maximized expected utility under the prior is no longer in the
  choice set, but no other act is added. The proposition tells the agent, correctly,
  which option he would have taken had he not received the information, and the act
  of entertaining that proposition removes that option from the feasible set. For
  these propositions, free information can lower expected utility, exactly as an informative
  signal in our world can never do. Assume that the population consists of otherwise
  idealized Bayesian decision-makers, that decision-reflexive propositions arise constantly
  in commercial, legal, and scientific contexts, and that their occurrence is a lawlike
  feature of the world. Predict, in detail, how such a society would differ from ours.
