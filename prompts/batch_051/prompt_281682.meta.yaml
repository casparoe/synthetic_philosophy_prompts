  I.J. Good, "On the Principle of Total Evidence" (1967?) — theorem: The expected
  value of free information is never negative; a rational decision-maker should always
  accept cost-free information before acting. Proof: the best you can do with information
  is at least as good as best you can do without, because you can always ignore it.
  More formally, expected posterior expected utility ≥ prior expected utility. This
  holds if you update by conditionalization and your utility function doesn''t change.
  Exceptions: cost (though free information has cost of delay/attention), selection
  effects (someone tells you they have info that will change your mind in a specific
  direction), non-Bayesian updating, changing utility/preferences, binding/commitment,
  temptation, information affecting future choices (Ulysses).


