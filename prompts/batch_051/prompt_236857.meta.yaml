  Reflection Principle (van Fraassen 1984): A rational agent''s current subjective
  probability for a proposition A, conditional on the supposition that her future
  subjective probability for A will be r, should equal r. Equivalently, P_t(A) = E[P_{t+1}(A)].


  Subtle confusion: People often read Reflection as an epistemic deference principle:
  "trust your future self because future self knows more." But Reflection is a coherence/synchronic
  constraint; it''s conditional on your own future credence, regardless of whether
  future-you is better informed. It doesn''t say future-you is more expert. If you
  expect to be less informed later (e.g., forgetting, intoxication), Reflection can
  fail rationally. So the confusion: treating the "future self has more evidence"
  assumption as what grounds Reflection, when actually Reflection is supposed to hold
  even without that, and its normative pull comes from avoiding predictable self-disagreement
  / Dutch books. Also the stronger claim "set current credence to whatever I expect
  to believe later" only follows if you''re certain of your future credence; otherwise
  current credence is the expectation (a mixture), not the specific value.


