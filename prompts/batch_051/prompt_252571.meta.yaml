  Draft:


  ---


  Construct a thought experiment that satisfies the following specification, on the
  subject of sweatshops and mutually beneficial exploitation.


  The case should be a realistic workplace scenario in a contemporary supply chain
  (for example garment assembly, electronics, or agricultural packing). It must not
  be a trolley-style dilemma, and it must not involve violence, debt bondage, deception,
  or any threat beyond the ordinary economic pressures of a poor labour market.


  Two accounts of exploitation must come apart in this case. Define them as follows:


  (a) The betterment-plus-consent account: an employer exploits a worker only if the
  exchange makes the worker worse off than she would have been under her best available
  alternative, or if the employer obtains her consent by force or fraud. On this account
  a voluntary exchange that leaves both parties better off than their no-exchange
  alternatives is not exploitative, however small the worker''s share of the gains.


  (b) The surplus-share account: a worker is exploited when an employer, taking advantage
  of unequal bargaining power, captures an unfairly large share of the surplus created
  by their cooperation, even if the worker still gains from the exchange. On this
  account a transaction can be both mutually beneficial and exploitative.


  Construct the scenario so that the betterment-plus-consent account yields the verdict
  "not exploitative" and the surplus-share account yields the verdict "exploitative."


  Additional constraints:


  - The worker''s best available alternative must be genuinely bad in an ordinary,
  survivable way — for instance, a smallholding that feeds a family but leaves no
  margin for school fees or medical care — not a life-threatening emergency. The benefit
  of the job should be real but modest.

  - The employer must not be a literal monopsonist: there should be at least two other
  employers in the region, none of whom colludes illegally. The bargaining asymmetry
  should instead arise from a thinner, less dramatic feature, such as the worker''s
  skills being specific to one product, the costs of moving being too high, or the
  surrounding labour market being slack.

  - No person in the case may have unrealistic knowledge; all information should be
  what a competent adult in that situation could plausibly have.


  After presenting the scenario, do all of the following:


  1. Show, step by step, that the case satisfies the definitional tests of both accounts
  and yields the two specified verdicts.

  2. Identify the single feature of the case that is doing the real work in separating
  the verdicts, and explain how removing or altering it would collapse the case into
  a more standard disagreement about wretched poverty rather than an interesting disagreement
  about the nature of exploitation.

  3. Give the strongest response a defender of the betterment-plus-consent account
  could offer — that the case describes a regrettable but non-exploitative bargain
  — and assess whether it succeeds.

  4. Finally, distinguish two questions that the case might be thought to settle but
  does not: whether the worker is wronged by the transaction, and whether outside
  parties (a state, a buyer, or a boycott campaign) would be justified in interfering
  with it. Explain briefly how the two accounts are likely to diverge on the second
  question even when they agree on the first.


