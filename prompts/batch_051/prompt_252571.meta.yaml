  Domain: Sweatshops and mutually beneficial exploitation.

  Type: Construct a thought experiment to specifications.


  Specs:

  1. A single, realistic, named scenario in an actual supply-chain setting (garment,
  electronics assembly, fruit packing, etc.) — no trolleys, no extreme violence, no
  perfect predictors.

  2. The job must be strictly Pareto-improving: the worker is better off taking it
  than under her best available alternative, and the employer is better off too. The
  worker consents with full information about pay, hours and risks, and may leave
  without penalty.

  3. No deception, no state coercion, no debt bondage.

  4. The exchange must nonetheless count as exploitative on a "surplus-share" account
  (exploitation = unfair division of the cooperative surplus created by the exchange,
  given unequal bargaining power), and not exploitative on a "betterment-plus-consent"
  account (exploitation = making someone worse off than without the exchange, or using
  fraud/force).

  5. Constraint designed to force work: the worker''s fallback option may be poor
  but must not be desperate or life-threatening — e.g., a farming plot that feeds
  the family but leaves no margin — so that the "mutual benefit" is genuine yet the
  betterment account has a real, non-strawman road to its verdict.

