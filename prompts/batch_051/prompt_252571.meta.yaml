  Let me think about the actual philosophy.


  Exploitation and sweatshops: Zwolinski argues that taking a sweatshop job is a Pareto-improvement
  and that interference (e.g., boycott or minimum standards) can harm workers; but
  he also thinks "mutually beneficial exploitation" is possible. The standard puzzle:
  exploitation is usually associated with harm, but sweatshop workers choose jobs
  that improve their situations relative to realistic alternatives, so the exchange
  is mutually beneficial (economic). Yet critics call it exploitation. So we need
  a theory of exploitation that doesn''t reduce to harm.


  Theories of exploitation:

  - Marxian: extraction of surplus value, unpaid labour — but Marxist says exploitation
  is about the structure, not the individual transaction; the fact that the worker
  benefits doesn''t negate exploitation, because exploitation of labour occurs even
  when wages improve. Actually, Marxist exploitation involves capitalists appropriating
  surplus value; mutually beneficial in the sense that worker gets a wage and capitalist
  gets profit.

  - Non-Marxian fairness/benefit standard: exploitation as taking wrongful advantage
  of another''s vulnerability; a fair transaction requires a fair division of the
  benefits of exchange. The exploited party gains something but receives less than
  a fair share of the transaction''s surplus; so mutually beneficial but unfair.

  - Consent-based / mutual advantage views: if both parties consent and gain, the
  exchange is not exploitative but simply a mutually beneficial (if perhaps unfortunate)
  market interaction; there''s nothing wrongful (maybe "exploitation" in a non-moral
  sense).

  - "Specific egalitarian baseline" (Mayer?): exploitation is failing to benefit the
  disadvantaged party as much as fairness requires given the actual alternatives.


  For a thought experiment: We could specify two theories of exploitation — say, the
  "benefit standard" (fair share of surplus) and the "consent-and-betterment account"
  (no exploitation if both parties voluntarily agree and both are better off than
  their no-exchange baseline) — and design a case where they come apart in a specified
  direction: the case is mutually beneficial but still counts as exploitation on the
  benefit standard, and not on the consent standard. But that''s the standard direction,
  not especially in-the-weeds. The prompt type wants specified verdicts and constraints.


  Constraints could make it interesting: no state coercion, no deception, no threat
