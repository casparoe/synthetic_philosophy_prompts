  Keynes''s "A Treatise on Probability" (1921) is a logical interpretation of probability.
  Key ideas:

  - Probability is logical relation between propositions (premises and conclusion),
  not frequency.

  - Probabilities are objective logical relations but often not numerically measurable;
  many probabilities are non-numerical and not all comparable.

  - "Weight of argument": distinct from probability; the amount of evidence. A high
  probability based on little evidence vs moderate probability based on much evidence.
  Confidence differs.

  - The principle of indifference restricted/limited; he used "principle of non-sufficient
  reason" criticized.

  - Induction: analogical inference; probability of generalization increases with
  number of instances but depends on analogy (variety, negative analogy). He had a
  theorem about "inductive correlation" and pure induction.

  - Uncertainty vs risk distinction developed later in General Theory, influenced
  by Treatise. In GT Ch 12: "By ''uncertain'' knowledge, let me explain, I do not
  mean merely to distinguish what is known for certain from what is only probable.
  The game of roulette is not subject, in this sense, to uncertainty... The sense
  in which I am using the term is that in which the prospect of a European war is
  uncertain, or the price of copper and the rate of interest twenty years hence...
  About these matters there is no scientific basis on which to form any calculable
  probability whatever. We simply do not know."


