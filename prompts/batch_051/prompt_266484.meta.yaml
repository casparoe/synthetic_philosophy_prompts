  compatible.


  The theory, as I hold it, is this. Everything a trained model outputs is a function
  of (a) the training data and (b) the inductive biases of the architecture and training
  procedure. "Novelty" is a folk gloss on sampling from a learned conditional distribution.
  When an output looks like a creative leap, what has usually happened is that the
  model moved through a high-dimensional region that looks far from any training example
  in our low-dimensional intuitions about distance but is actually close to many examples
  once the representation is taken into account. On this view, a machine cannot make
  an intuitive leap in any deep sense; it can only interpolate, recombine, and occasionally
  extrapolate a short distance along directions already present in the data manifold.
  Everything else is the human observer doing selection and narrative: we see the
  one striking success and not the thousands of near-misses, and we cannot actually
  inspect the entire training corpus to verify that the ingredients were absent.


  The intuition, on the other hand, is firm for me because I''ve built and run systems
  where the model''s output did something I would not have believed was in the training
  data. I do not just mean a surprising continuation or a clever adaptation. I mean
  cases where the output seems to require abstracting a structure that no training
  example states or, as far as I can tell, implies: for instance, a model producing
  a dynamic-programming formulation for a problem class whose training solutions are
  all brute force, or generating a refactoring that uses an abstraction the codebase
  and the surrounding corpus never name. My intuition says these are not merely high-dimensional
  interpolation. There is a difference in kind between recombining existing forms
  and forming a new abstraction that makes the solution shorter, more general, or
  conceptually leaner than the inputs it was trained on. If that difference is real,
  then the theory is missing something: the model is not just a sampler over a fixed
  manifold; it is a machine that can construct new compression schemes or new levels
  of representation under the pressure of the task.


  So here is what I want worked through. Which should yield, and why? Should I treat
  the intuition as a selection artifact — a case of noticing the rare hit and back-filling
  an explanation after the fact — and drop it? Or should I amend the theory so that
  it can count some operations as genuine leaps without going mystical, for example
  by distinguishing extrapolation from interpolation, or by defining novelty in terms
  of finding a representation that compresses the problem better than any recombination
  of training material? Or is the apparent conflict dissolved once I stop equating
