  Williams (1981) "Internal and External Reasons." Internal reasons: A has a reason
  to φ only if φing would serve some element of A''s "subjective motivational set"
  S, where S includes desires, projects, commitments, etc. He argues external reasons
  statements are false or incoherent; there are no reasons that apply to an agent
  independently of her motivations. Important nuance: not just any desire but reachable
  via a "sound deliberative route" from current S. So the popular gloss "you only
  have a reason to do X if you already want to do X" is too crude; Williams allows
  reasons derived by good deliberation from existing motivation. Also it''s not necessarily
  "serves a desire" as egoistic; the motivational set includes dispositions of evaluation,
  patterns of emotional reaction, loyalties, commitments. And "there is a reason"
  vs "he has a reason"—Williams''s claim about deliberation: if a rational deliberator
  would arrive at a motivation, then the agent has a reason even if she isn''t motivated
  now, because of a possible deliberative route from S.


  Common misrepresentation: "Williams thinks you only have a reason to do something
  if you already desire to do it" — actually the reason must be related to S via deliberation,
  not necessarily present desire. Second: "so if someone genuinely wants no health
  for themselves, facts about smoking give them no reason to quit" — Williams might
  accept there''s no internal reason, but the reasoning is more careful: maybe sound
  deliberation from their other motivations (wanting to live for their kids, avoid
  pain) reaches it. Third conflation: "therefore reasons are subjective / whatever
  you want, so morality has no grip on agents who don''t care." Actually Williams
  doesn''t say reasons are subjective per se; internal reasons are objective relative
  to S plus sound deliberation. And he distinguishes normative reasons being "internal"
  from psychological egoism. The conclusion "morality can''t criticize a selfish person"
  may not follow: most people''s S includes commitments to others; but for someone
  with no such motivation, Williams does hold there''s no internal reason to be moral;
  that is a real implication he accepts.


