  emissions — steel, cement, chemicals, long-haul shipping, the grid itself — decarbonization
  doesn''t look much like that picture. It looks like a small number of lumpy, bet-the-company
  decisions: retire this blast furnace now or run it another fifteen years, build
  a green-hydrogen plant or not, site a new transmission line or not. Those decisions
  have huge fixed costs, long asset lives, and they only pay off if a bunch of other
  actors (suppliers, buyers, the government, a new pipeline or grid connection) make
  compatible choices around the same time. The "marginal ton" is kind of an abstraction
  when the real choice is between 0 and 2 million tons depending on whether a single
  plant gets built or scrapped.


