  1. The quality-of-will view: Retain the control principle by insisting that blame
  and punishment track only what was within the agent''s control — intention, negligence,
  quality of will — and treat the harsher judgment of the unlucky agent as a useful
  epistemic heuristic or a justified social convention serving deterrence, but not
