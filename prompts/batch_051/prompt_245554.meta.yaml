  The classic paradox: Teacher announces on Friday afternoon: "There will be an exam
  on exactly one school day next week, and students will not be able to know, before
  the day of the exam arrives, that the exam will be on that day." The student argues:
  it can''t be Friday, because after Thursday passes without exam, they''d know it''s
  Friday; then it can''t be Thursday because after Wednesday passes they''d know Thursday;
  ... so no exam can satisfy the announcement. Wednesday they''re surprised by an
  exam.


  Possible candidate diagnoses to rank:


  1. The "epistemic instability" / knowledge-changing solution: The student''s backward
  induction illicitly assumes that his state of knowledge on Thursday night is the
  same as it is now (Friday afternoon). But the announcement''s truth-value depends
  on his evidence at each time; by the time Thursday night arrives, he may have lost
  knowledge that the announcement is true (e.g., because if the exam were on Friday,
  he would know it, but he doesn''t — wait, careful). Actually the standard Quine/Kripke-style
  solution: the student cannot retain knowledge of the announcement on Thursday night
  because if he knew the announcement was true and no exam had occurred, he could
  deduce the exam is Friday and not be surprised; so the announcement can''t be known
  to be true. The student is justified in believing it ex ante but not at the penultimate
  stage. The surprise condition is satisfiable because on Thursday night he does not
  know there will be an exam.


  2. The "two senses of surprise" solution: Distinguish (a) being able to deduce the
  day in advance from the announcement alone, vs. (b) being unable to know the day
