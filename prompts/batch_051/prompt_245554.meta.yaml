  Actually let me align to standard positions:


  Standard responses to moral luck:

  - Denial: there is no resultant moral luck; our differential treatment is epistemic/emotional
  but not justified as different desert. Quality of will is the only locus of moral
  assessment. (E.g., Thomson? "Morality is not about luck" though she discusses)

  - Acceptance: resultant luck affects moral assessment; the control principle must
  be revised — responsibility is not purely a function of control; outcomes enter
  into what the agent has done and thus into what she is accountable for (Williams,
  Nagel somewhat).

  - Skepticism: the problem generalizes (constitutive and circumstantial luck) and
  undermines the idea of being ultimately responsible for anything; we should either
  give up the control principle or abandon blame-based desert (e.g., free will skepticism).

  - Separation of act and agent: distinguish evaluation of the act (outcome-involving)
  from evaluation of the agent (quality-of-will-only); ordinary practice can be partly
  vindicated because the two evaluations have different objects.

  - Revisionism / role-based view: "Responsibility" is not a metaphysical tracking
  concept but a social practice answerable to forward-looking norms; apparent luck-sensitivity
  is acceptable if it serves the functions of the practice (deterrence, coordination),
  and seeking a single deep principle is misguided.


