  Question: ''Some nations are rich and others are not. Set out the main families
  of explanation for cross-country income differences — institutional, geographic,
  and cultural — and assess the strength of the historical evidence for the institutional
  hypothesis, paying particular attention to the limits of causal inference from historical
  data. Your answer should discuss at least one historical natural experiment.''


  Student answer:


  ''There are three broad families of explanation. The geographic view appeals to
  fixed features such as climate, soil, disease environment, and access to the sea;
  Sachs is the standard representative. The cultural view appeals to values and norms
  — the work ethic, trust, attitudes towards saving and education — that supposedly
  make some societies more productive. The institutional view says the decisive factor
  is the rules of the game: secure property rights, low risk of expropriation, constraints
  on rulers, and impartial contract enforcement.


  The strongest evidence for the institutional view comes from Acemoglu, Johnson and
  Robinson''s work on former European colonies. In their settler-mortality argument,
  would-be settlers faced very different disease environments across colonies. Where
  Europeans could safely settle, as in North America and Australia, they created institutions
  that protected property and limited the executive; where they could not, as in much
  of Africa, they built extractive institutions designed to transfer resources to
  the coloniser. Because settler mortality influenced only the institutions settlers
  built, it can serve as an instrument for present-day institutional quality. The
  resulting estimates are large: differences in institutions explain a substantial
  share of the income gap among former colonies.


  Acemoglu, Johnson and Robinson also document a reversal of fortune among former
  colonies: the parts of the Americas that were relatively prosperous in 1500, measured
  by urbanisation and population density, are relatively poor today, while the then-poor
  periphery became rich. This is difficult for naive geographic explanations to accommodate,
  since geography is largely constant. It is also awkward for cultural explanations,
  unless one is prepared to claim that colonial rule simply overwrote pre-colonial
  cultures.


  The natural experiment therefore shows that nations are rich because they have good
  institutions. The instrumental-variables design removes confounding, since the exclusion
  restriction — that historical settler mortality affects present income only through
  present institutions — is widely accepted. The conclusion is confirmed by the fact
  that nearly all rich countries are democracies, which shows that inclusive institutions
  just are free elections and parliamentary government.''"


