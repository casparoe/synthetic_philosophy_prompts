  ---


  As a longtime reader of rationalist writing, I keep seeing discussions of authority
  and deference that settle a large question by pointing at a single case: someone
  cites Milgram to show that ordinary people obey too much, or someone cites an expert
  consensus to show that laypeople simply should defer. Those cases pull in opposite
  directions, and I have become convinced that what is missing is an explicit specification
  of what an adequate account of justified deference would have to get right. I want
  that specification before reading any further defenses or criticisms of particular
  views.


  Write the desiderata for a theory of when a person is justified in deferring to
  authority, where authority is understood broadly enough to cover institutional command,
  expert guidance, and role-based rights to decide. The intended use is to guide a
  reflective adult deciding whether to go along with a directive or a consensus in
  an organization, a profession, a courtroom, a laboratory, or a state.


  For each desideratum, give the case or consideration that forces it and state explicitly
  whether it is non-negotiable, a preference of a particular camp, or a contested
  choice that different serious theories could make differently. Cover at least the
  following, adding anything else that falls naturally out of it:


  - The distinctions an account may not collapse: believing someone versus obeying
  someone; obeying an instruction versus accepting someone''s standing to settle a
  question without fully explaining it; legitimacy versus the weight of the reasons
  one has to comply in a particular case; and the fact that compliance was achieved
  versus the claim that compliance was warranted.

  - The ordinary cases: traffic rules and safety codes, a physician''s or engineer''s
  recommendation, a manager''s decision binding a team, a jury or court settling a
  dispute, a military order under time pressure, and a regulator or review board deciding
  what may proceed.

  - The hard cases: the Milgram volunteer who continues to administer shocks at the
  experimenter''s prodding; the functionary who processes one small step in a bureaucracy
  aimed at atrocity, of the sort Arendt''s report on Eichmann tried to understand;
  the soldier ordered to do something lawful but arguably wrong; the whistleblower
  who breaks with the institution; the conscientious objector; and the layperson facing
  a credentialed consensus that later turns out to have been corrupted by capture,
  bias, or groupthink.

  - The explanatory constraints: whether and how a directive can give a reason in
  virtue of its source rather than its content, why an authority''s standing and its
  reliability can come apart, and how an autonomous agent can bind herself to a decision
  procedure without thereby losing responsibility for what the procedure does.

  - The psychological constraints: whatever the theory says must be compatible with
  what the obedience experiments and the study of conformity, motivated reasoning,
  and the diffusion of responsibility show about actual agents. It should not presuppose
  that people deliberate from first principles at every step.

  - The moral boundary constraints: the account must not treat clearly wrongful directives
  as merely competing considerations, must explain why criminal orders do not become
  permissible by transmission through a chain of command, and must explain in what
  sense a subordinate inside a hierarchy remains a moral agent for whose actions it
  still makes sense to ask who was responsible.


  Then give the structural result. Identify any subset of these desiderata that appears
  jointly unsatisfiable, or satisfiable only by quietly abandoning one of them. I
  am most interested in whether the demand that laypeople defer to well-supported
  expert consensus and the demand that individuals remain answerable for what they
  do can be fully met by a single rule, and whether a Raz-style service conception
  or a consent view can earn content-independent authority without reducing the subordinate
  to an instrument of the authority''s will.


  Finally, provide a compressed assessment of the main existing families of views
  — voluntarist or command views, consent or contract views, service-based views of
  the sort associated with Raz, purely epistemic-deference accounts, and role-obligation
  or practice-based views — against the list. Keep this last part short and let the
  criteria carry the argument; if one requirement does the most to eliminate candidates,
  identify it.


