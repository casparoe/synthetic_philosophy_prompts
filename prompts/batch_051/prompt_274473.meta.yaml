  MDC criteria (from "Thinking about Mechanisms"): A mechanism is a set of entities
  and activities organized such that they produce regular changes from start/set-up
  conditions to termination conditions. Mechanistic explanation: identifies entities
  and activities and how they are organized, showing how the phenomenon is produced.
  Key features:

  - Entities and activities are distinct but interdependent; activities are what entities
  do; entities are what engage in activities.

  - Productive continuity: each stage from setup to termination gives rise to the
  next, no gaps; activities connected via entities.

  - Organization: spatial, temporal, and hierarchical organization matter; not just
  aggregation.

  - Explanation may be at multiple levels; bottoming out is pragmatic.


  A borderline case could be an explanation that cites a negative feedback loop or
  a topological/geometric constraint.


