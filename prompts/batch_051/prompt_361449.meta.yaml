  Full draft:


  ---

  I serve on a parole review board, deciding roughly forty cases a month, often in
  long afternoon sessions. Several years ago our unit''s internal audit found something
  that should not have surprised me: decisions formed in the last hour of a session
  were later overturned, or sent for further assessment, at a markedly higher rate
  than decisions formed earlier in the day, even after the case files had been matched
  for seriousness and prior record. The audit did not identify any particular mistake
  in any particular decision; it was a purely statistical finding about the process
  that produced the decisions.


  I have since adopted a policy. Whenever I form a judgement in those known-bad conditions
  — the final hour, or when I am unusually tired, hungry, or angry — I later discount
  my confidence in that judgement. The next working day I review the file afresh.
  If the fresh review turns up a specific flaw, well and good: I revise normally.
  But the crucial rule is this: when the fresh review finds no flaw and the reasoning
  still looks sound to me, I keep a discount anyway. I do not return to my original
  confidence, and I act on that discounted view — voting for a further assessment
  that my own re-reading of the file suggests is unnecessary, or choosing the more
  cautious of two defensible decisions.


  A colleague insists this is epistemic akrasia. After my fresh review, he says, I
  in effect believe the file supports a certain judgement, yet I refuse to act on
  it, or I lower my stated confidence, on evidence that concerns only the reliability
  of the process by which I formed the judgement and says nothing about this case.
  And I treat the very fact that the reasoning "looks sound to me" as carrying little
  weight, because an unreliable process would leave exactly that impression behind.
  To which I reply: that is precisely the point of having higher-order evidence —
  evidence about my own reliability — and a purely statistical audit is still evidence.
  My inability to see an error does not rebut the audit; it is predicted by it.


  Is this policy defensible, or is it a bias dressed up as a rule? I would like a
  careful assessment that treats the policy as a policy: when it is reliable, when
  it is likely to fail, whether it can be restated so as to keep the benefit without
  the self-mistrust, and whether the charge of epistemic akrasia is in this case a
  fatal objection or a cost that a rational person should sometimes pay. If the policy
  is defensible, is there any principled way to set the size of the discount, and
  to decide which conditions count as "known-bad", beyond trusting whatever the audit
  happened to measure? And under what evidence would you tell me to abandon the policy
  altogether? Please give your answer in British English.

