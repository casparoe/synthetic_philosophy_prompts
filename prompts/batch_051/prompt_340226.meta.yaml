  Position: Weakness of will (akrasia) is not a separate mystery. It''s what you get
  when a person hyperbolicallly discounts future rewards: at a cool distance they
  prefer the larger, later good; as the smaller, sooner good becomes imminent, its
  present value spikes above the larger later good, so they choose it; afterwards,
  when the temptation recedes, the original preference returns and they regret it.
  So the phenomenon of "knowing the better and doing the worse" is just intrapersonal
  time inconsistency, a series of sincere preference reversals by successive "selves."
  There''s no moment where the agent simultaneously judges A better and does B, except
  under a description that conflates the long-run and present self.


  What would count against it:

  - Evidence that some akratic actions happen without proximity/timing effects: e.g.,
  choosing the worse option when both outcomes are equally distant, or in one-shot
  choices with no temporal structure, implying misvaluation not discounting.

  - Cases of "last-dollar" or "clear-eyed" akrasia where the person judges all-in
  at the moment of action that A is better, yet does B — no preference reversal, just
  failure to translate judgment into action.

  - The phenomenology of trying, effort, and being overcome; hyperbolic discounting
  models it as a preference, but akrasia often feels like a conflict between judgment
  and desire, not between two preferences at different times.

  - Evidence that discount functions are not hyperbolic in many people; some are exponential
  or "present-biased" in a stepwise way: if behavior persists in exponential discounters,
  the theory lacks its mechanism.

  - Cases where the action is against one''s better judgment not because of immediacy
  but because of exhaustion, intoxication, or cognitive load: that suggests executive/resource
  failures, not discounting.

  - Resolution and precommitment: the theory explains them, but it also predicts that
  precommitment should be fully effective when available; cases where people defeat
  their own precommitments (turn off the app, unlock the safe) challenge that.

  - Regret and self-prediction: people can often predict the akratic choice even while
  making it; that''s prediction, not judgment. But some report making the choice "with
  their eyes open" and still judging otherwise.

  - Philosophical arguments: if a single agent, not a sequence of selves, is responsible,
  the "different selves" story misdescribes who is akratic. Akrasia is a vice of one
  agent, not a coordination failure of a population of time-slices.

  - Moral cases: painful self-sacrifice, keeping promises, where the better option
  is never more pleasant sooner or later; hyperbolic discounting doesn''t naturally
