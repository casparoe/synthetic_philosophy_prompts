  Topic: Can you assign probabilities to your own choices?


  Let me think about the actual philosophical positions.


  The debate: In decision theory, people often assign probabilities and utilities
  to outcomes of their own actions. But some philosophers (Spohn, Levi) argue deliberation
  crowds out prediction: if you are genuinely deliberating about whether to do A or
  B, you can''t simultaneously have a settled subjective probability for whether you''ll
  do A or B. Some argue assigning probabilities to your own choices is incoherent
  or undermines deliberation; others argue you can assign credences to your own choices,
  e.g., to plan around your own akrasia or predict your future behavior based on past
  track record (e.g., "I''m 70% likely to hit snooze tomorrow"). There''s also the
  idea that when you choose, you "pick" rather than predict; if you assign probabilities,
  you''re treating yourself as an outside observer, which may conflict with the stance
  of an agent.


  A good back-and-forth:

