  currently deliberating over, because deliberation requires treating options as open,
  and a probability that you''ll do A is a prediction that closes options or turns
  you into a third-person predictor of yourself.

  - B (say, Jonas) replies that we do this all the time: he knows from experience
  he''s 80% likely to take the elevator rather than the stairs tomorrow; that''s useful
