  Domain: Scientific realism and the pessimistic meta-induction.


  PMI: The argument that since many past theories that were empirically successful
  turned out to be radically false (phlogiston, caloric, ether, humors), we should
  expect our current successful theories to also be radically false, so we shouldn''t
  believe their unobservable claims.


  Positions to include as leaves:

  - Standard scientific realism: successful theories are approximately true, their
  central terms refer.

  - Structural realism (epistemic): we can believe the mathematical structure of theories
  but not the nature of the entities.

  - Entity realism (Hacking/Cartwright): we can be realist about entities we manipulate
  but not theories.

  - Selective realism/semirealism: only the working/idle parts of theories that were
  essential to their success are preserved; real about those.

  - Constructive empiricism (van Fraassen): theories aim at empirical adequacy, not
  truth; we believe observable claims only.

  - Instrumentalism: theories are tools for prediction; talk of truth is misplaced
  or merely useful fiction.

  Maybe also "pessimistic antirealism" / "scientific antirealism" and "optimistic
  induction". But six leaves is enough.


  Tree questions that separate positions:

  1. "When a theory is empirically successful, is that any reason at all to believe
  its claims about unobservables?" Yes → some realism; No → instrumentalism/constructive
  empiricism.

  2. "Do you take talk of unobservables to be literally truth-apt (capable of being
  true/false) or just a useful organizing device?" This separates constructive empiricism
  (literal but agnostic) from instrumentalism (non-literal or irrelevant).

  3. For realists: "Do you think what gets preserved across theory change is the structure/equations
  rather than the nature of the things?" → structural vs entity/standard/selective.

  4. "Do you think we can be confident in particular kinds of entities when we can
  manipulate them, even if the encompassing theory is wrong?" → entity realism.

  5. "Do you think the parts of past theories that were false were mostly idle and
  not needed for their successful predictions?" → selective realism vs standard realism.


