  ---


  I run a research organization that commissions adversarial collaborations between
  defenders of opposed positions in philosophy and theology. The current project pairs
  a cessationist and a continuationist on the question of the miraculous spiritual
  gifts. The cessationist holds that the distinctive gifts of the apostolic period
  — prophecy, tongues and their interpretation, words of knowledge, and apostolic-type
  healing — were bound to the founding era of the church and have ceased as a standing
  feature of its common life. The continuationist holds that these gifts did not cease
  with the apostolic generation and may rightly be expected, sought, and exercised
  in the church today. Both sides affirm that God is free to act miraculously, and
  both agree that the dispute is not about divine power but about the normative standing
  and expected distribution of the gifts in the post-apostolic church.


  Write the document this collaboration should have produced after a year of good-faith
  argument. It must be a statement both could sign, in three parts.


  1. Agreed claims. A numbered list of substantive claims both can affirm without
  reservation. These should not be truisms; they should fix the object of the dispute.
  Include what each side counts as falling under the category of spiritual gifts,
  what both affirm about God''s power and faithfulness, what both take the New Testament
  evidence to show at least prima facie, and what practical difference the disagreement
  makes for the church. Where a would-be agreed claim turns out not to be acceptable
  to one side, do not force it.


  2. The precise disagreement. State where the two positions part ways, in wording
  each side would accept for its own view and the other recognizes as fair. Be explicit
  about which part of the disagreement is substantive and which part is verbal — for
  example, distinguish a one-off extraordinary act of healing from a recognized standing
  ministry of healing, and distinguish the claim that the gifts should be expected
  from the claim that they are possible. If part of the dispute dissolves once terms
  are sharpened, say which part and which part survives.


  3. A disagreements table. For each crux — a sub-question such that a settled answer
  to it would move at least one side — state the crux; the kind of consideration both
  sides agree bears on it (a textual argument, a pattern in church history, a conceptual
