  Prompt text:


  I teach an upper-level seminar in decision theory for philosophy majors, about 18
  students, in an 80-minute session. Last week we covered the Saint Petersburg paradox
  and the standard move of appealing to expected utility rather than naive expected
  monetary value. This week I want to flip the problem around: I want students to
  encounter a game where the mathematical expectation is not infinite, but worse —
  it is undefined because the sum of probability-weighted payoffs is conditionally
  convergent. You may know this as the Pasadena game or Pasadena paradox. I want an
  in-class activity, not a lecture, in which half the students run a "bank" offering
  a series of bets with payoffs that alternate in sign and are proportional to powers
  of two divided by the number of trials, and the other half roll or flip to determine
  outcomes. They should set prices, record cumulative winnings, and try to determine
  fair value at different points, and they should feel the values refusing to settle
  before the paradox is named. The materials should be simple: coins, dice, tokens
  or chips, ledgers, maybe an optional spreadsheet. There is no real money; tokens
  stand in for dollars but ideally large stakes should still be concretely felt. Give
  me exact rules, a timeline, a payoff scheme, a procedure for pricing rounds, and
  a debrief. In the debrief, connect the students'' observations to the distinction
  between an infinite sum that diverges, an infinite sum that converges absolutely,
  and a conditionally convergent sum that can be rearranged to different limits. Also
  tell me what will predictably go wrong: I suspect students will explain away their
  discomfort as ordinary risk aversion, or think the issue is just that the numbers
  are getting large, or assume any bounded small fee solves it. How should I handle
  that without deflating the activity? And be honest about what the classroom simulation
  cannot reproduce about the ideal infinite game — presumably students experience
  only finite truncations. What exactly must I supply to bridge that gap?


