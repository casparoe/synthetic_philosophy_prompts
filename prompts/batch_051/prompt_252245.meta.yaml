  and I''ve arrived at a distinction I want pressure-tested.


  The familiar cases. Blue Bus: a pedestrian is hit by a bus that leaves the scene;
  the Blue Bus Company operates 80% of the buses on that route, so the probability
  that a Blue bus caused the injury is 0.8. Gatecrasher: 1,000 people attend an event
  for which only 499 tickets were sold; an attendee is selected at random, and the
  only evidence against him is that 501 attendees gate-crashed, so the probability
  he gate-crashed is 0.501. In both cases the evidence makes the defendant''s liability
  more likely than not — and in Blue Bus, quite likely — yet most people, and most
  courts, would not find liability on that evidence alone. (The same reluctance, magnified,
  appears when we imagine a criminal standard.)


  My proposal is this. A finding of liability requires evidence to be trace-indexed:
  the probative force of the evidence must depend on a causal trace left by the defendant''s
  own conduct. More precisely, evidence E is trace-indexed just in case, had the defendant
  not done the alleged act, E would have been different in a way that tracks that
  difference. Naked statistical evidence is trace-free: the fleet proportion would
  have been exactly the same whether or not this Blue bus struck the pedestrian; the
  gate-crasher rate would have been exactly the same whether or not this attendee
  paid. So my claim is that trace-indexing, not probability, is the ingredient missing
  from naked statistical evidence, and that proof standards implicitly require it.


