  The Bayesian one: The "merging of opinions" theorem (Blackwell and Dubins 1962)
  shows that under certain conditions, two agents with different priors but common
  likelihoods will have posterior distributions that converge in total variation distance,
  almost surely, provided one prior is absolutely continuous w.r.t. the other. Also
  convergence to truth: with i.i.d. data and correctly specified model, posterior
  concentrates on true parameter. The philosophical issue: do these results vindicate
  the "washing out of priors" thesis? Objections: (1) the results only show pairwise
  convergence between observers who agree on the likelihood and model class; they
  don''t show convergence to truth unless the true distribution is in the support;
  (2) measure-zero prior differences; (3) finite data and no rate guarantees — washing
  out may take arbitrarily long; (4) the problem isn''t convergence over time but
  disagreement now; (5) priors over model classes / hypotheses can prevent merging
  (e.g., non-absolutely continuous priors); (6) subjective Bayesians vs objectivists:
  the theorem doesn''t justify any particular prior, but it might show priors are
