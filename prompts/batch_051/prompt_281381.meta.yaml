  Core theorem types:


  1. Posterior consistency / Bayesian consistency: If X_1, X_2, ... i.i.d. from true
  distribution P_θ* (or P*) in a parametric model with prior over Θ, under regularity
  conditions, posterior concentrates on neighborhoods of θ* (or on KL-neighborhoods
  of P*) almost surely as n → ∞. This says a Bayesian with a good prior (positive
  mass on truth neighborhoods) will converge to truth. Doob''s theorem: for any prior,
  the posterior is consistent for all θ* except perhaps a prior-null set. So from
  the prior''s own perspective, it''s consistent almost surely, but the exceptional
  set can be large in terms of the true parameter, and the prior determines which
  worlds are "ignored."


  2. Merging of opinions (Blackwell–Dubins): If two Bayesian agents'' priors P and
  Q are mutually absolutely continuous (agree on which events have zero probability),
  then for any event A, the difference between their posterior probabilities |P(A
  | X_1..X_n) - Q(A | X_1..X_n)| → 0 almost surely (under both measures). This shows
  agreement among agents who share the same model class and don''t deem each other
  "impossible." But if one prior is not absolutely continuous with respect to the
  other (e.g., one agent rules out a parameter value the other doesn''t), their posteriors
  need not merge.


  3. Finite-time dependence: Although posteriors merge in the limit, the shrinkage
  rate depends on the priors; no uniform convergence; for any N and ε, one can construct
  priors/truth such that disagreement persists past time N. So "washing out" in practice
  is not guaranteed; asymptotics can be arbitrarily slow. Also convergence theorems
  assume the correct likelihood/model; model misspecification means posterior converges
  to the KL-closest distribution in the model, not necessarily the truth.


