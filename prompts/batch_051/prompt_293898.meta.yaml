  Meta-problem of consciousness (Chalmers 2018): "the problem of explaining why we
  make phenomenal judgments, and why we are so confident that there is a hard problem."
  Solutions divide into deflationary (explain the intuitions away, showing they''re
  illusions) vs non-deflationary (explain them by some account that is compatible
  with a real, non-physical or hard problem).


