  (1) The thing the meta-problem asks us to explain is our firm conviction that no
  physical–functional description of the brain could explain what it''s like to see
  red.

  (2) To explain that conviction is to give a physical–functional story about why
  creatures like us form it.

  (3) But if the physical–functional story explains the conviction, it thereby shows
  the conviction to be the product of processes that are blind to whether the conviction
  is true.

  (4) The only reason to accept that a conviction is true when we know it is produced
  by blind processes is if the conviction''s content follows from those processes''
  reliability; and a physical–functional story about the conviction would not establish
  that — it would merely record our arm.

  (5) So we could never be justified in retaining the conviction once a solution to
  the meta-problem is in hand.

  (6) Therefore, a completed meta-problem solution would undermine the hard problem
  (turn our problem intuitions into illusions), not just explain them.


