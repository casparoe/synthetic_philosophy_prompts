  just be ignored; but Bayes can still strongly update if likelihood ratio huge? Actually
  the likelihood ratio could overcome moderate priors. The real flaw in doomsday argument
  often argued: you cannot sample a random human from all humans; you are not sampled
  uniformly because your existence depends on choices, and the reference class is
  arbitrary. Also there is an issue of "you could not have found yourself at any time
  before your birth" — no.


