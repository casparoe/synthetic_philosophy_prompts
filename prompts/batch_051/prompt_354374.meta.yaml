  Let''s try to formulate a doomsday argument with a clear identifiable flaw beyond
  global SSA skepticism. For instance:


  (1) If humanity survives for millions more years, the total number of humans who
  ever live will be several trillion, and almost all of them will live later than
  now.

  (2) If humanity goes extinct within a few centuries, the total number will be around
  two hundred billion, and roughly as many will live before me as after me.

  (3) According to the principle of indifference, I should treat my position in the
  temporal sequence of all humans as random: I am as likely to be any one of the humans
  who ever live.

  (4) So, given my observed position (roughly the 100-billionth human), the probability
  of my observed position is much higher under the second hypothesis than the first.

  (5) By Bayes'' theorem, the doomsday-soon hypothesis is therefore strongly confirmed,
  whatever the empirical evidence about asteroids, pandemics, etc.

  (6) So we should be nearly certain that I am roughly halfway through the human sequence.

  Which step fails?


  This is the standard argument. The controversy is step (3) (self-sampling assumption)
  and step (5) (ignoring priors/empirical evidence). The conclusion step (6) has an
  issue: even if you''re roughly halfway, the population growth means half of humans
  already lived doesn''t imply halfway in time; also "nearly certain" overclaims.
  Could be a decent exercise but familiar.


