  Immanuel Kant, "Zum ewigen Frieden" (1795). Structure: Preliminary Articles (six)
  and Definitive Articles (three), plus supplements.


  Preliminary articles:

  1. No treaty of peace shall be held valid in which there is tacitly reserved matter
  for a future war.

  2. No independent states, large or small, shall come under the dominion of another
  state by inheritance, exchange, purchase, or donation.

  3. Standing armies (miles perpetuus) shall in time be totally abolished.

  4. National debts shall not be contracted with a view to the external friction of
  states.

  5. No state shall by force interfere with the constitution or government of another
  state.

  6. No state shall, during war, permit such acts of hostility which would make mutual
  confidence in the subsequent peace impossible: e.g., poisoning, assassination, breach
  of capitulation, incitement to treason in the opposing state.


  Definitive articles:

  1. The civil constitution of every state should be republican.

  2. The law of nations shall be founded on a federation of free states (foedus pacificum),
  not a single world state (world republic may be ideal but states don''t want it;
  federation as negative substitute).

  3. The law of world citizenship shall be limited to conditions of universal hospitality
  (Besuchsrecht): right of a foreigner not to be treated as an enemy when arriving
  on another''s soil; can be refused, but not treated with hostility if it does not
  cause his own ruin.


  Also: Kant argues republics are less prone to war because those who consent (citizens)
  bear the costs. Not democracies exactly — republican constitution with separation
  of powers and representative government. He didn''t think democracy (as direct rule)
  fit; he preferred representative republic.


