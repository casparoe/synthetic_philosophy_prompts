  Final prompt text:


  "I spent my working life in a lab, so when I started reading philosophy I kept wanting
  to turn the abstract questions into something closer to a controlled experiment.
  Here''s one I can''t shake. Norway has a prison, Halden, that''s usually described
  in ways that sound almost like a campus: staff are unarmed and trained more like
  social workers than guards, prisoners get private rooms with their own fridges and
  bathrooms, people cook and eat together, and the official idea is that the loss
  of liberty is itself the punishment, so the rest should look like ordinary life.
  In the United States we mostly run prisons on the opposite theory — conditions are
  harsh because, on some level, that harshness is supposed to be part of the point.
  I want to know what would actually happen if you changed the conditions and held
  everything else fixed.


  So here''s the counterfactual. Starting in 2026, the entire American prison system
  — federal and state — is rebuilt over ten years to something like Halden: no bars
  on the windows, unarmed staff, private cells, shared kitchens, real jobs and school,
  freedom to move around during the day. Nothing else changes. Courts still send the
  same number and kind of people to prison; sentences and parole rules stay exactly
  as they are; the drug laws, the outside labor market, and the surrounding neighborhoods
  stay as they are. This is the natural experiment: change only the inside of the
  institution, not who goes in or for how long.


  Now walk me through your best prediction for 2036, 2046, and 2056. Be concrete about
  violence inside the institutions, reoffending after release, cost per prisoner,
  staffing, contraband, and public support for the system. For each prediction, give
  me a confidence level, and tell me which fact about human behavior — not about Norway,
  and not about American politics — is doing the real work underneath it. And tell
  me where you''re most uncertain: what would have to be true for the Halden approach
  to make things worse rather than better?


  I don''t want a balanced survey of possibilities. Commit. Tell me the future you''d
  actually bet on, and then show me the reasoning that could change your mind."


