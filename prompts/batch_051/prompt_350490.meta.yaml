  observations: the agent should select a complete policy, a mapping from every observation
  it might make to an action, and should evaluate that policy across all the worlds
  in which the policy is instantiated, without first conditioning on the particular
  observations the actual world happens to have handed it. The force of the idea shows
  up in Newcomb-style cases, where conditioning on what one sees makes the policy
  with the better expected value look locally wrong.


  Here is the mechanism I want you to take apart. Suppose several AI labs establish
  a policy-escrow arrangement. Before certain private information arrives — say, before
  each lab learns the result of an internal capability audit — each lab must deposit
  a large sum and file a complete, machine-checkable policy mapping the observations
  a lab might receive (audit results, rivals'' announced progress, regulatory signals)
  to actions such as pause, share, or race. A neutral supervisor with a stated model
  of the situation then works out, for each lab, what its filed policy would do in
  every branch the model treats as reachable. If the policy would choose a dangerous
  action in some branch, the lab is penalized for that branch even if, in the actual
  branch, it never received the triggering observation and never did anything dangerous.
  For example, a lab whose policy says to race only after receiving a high audit score
