  years back I keep running into the objection that value has to be value for somebody,
  or that talk of "intrinsic value" does no real work in conservation disputes. I
  want to know what would properly count against my position, not just what critics
  say when they''re being lazy.


  Here''s the position as I would defend it now. Wild, non-human nature has value
  that is not reducible to its usefulness for human purposes, and not merely relational
  either: even if every human interest vanished, the destruction of the last remaining
  wild places would still be a loss to something other than us. I don''t mean the
  strong metaphysical claim that value is a weird non-natural property floating around
  out there; I mean the more modest claim that nature is worth protecting for its
  own sake, not only for what it does for people.


