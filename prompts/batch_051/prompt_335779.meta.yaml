  Politics: Reflections on the Pentagon Papers" from Crises of the Republic. They''re
  struck by her distinction between traditional lies (covering up a particular fact,
  e.g., a secret bombing) and a newer form of political lying in which officials do
  not so much hide individual facts as construct an entire coherent account detached
