  more frequent/brazen lies? Design a concrete empirical investigation: e.g., compare
  Pentagon Papers-era deceptions with contemporary PR-driven information operations,
  looking at whether contradictions or corrections alter behavior, or whether the
  lies are presented as a substitute reality. What result would support Arendt''s
  diagnosis; what result would just show scale; what remains untestable in her concept
  of "factual texture" or "common world"? Also ask whether the test would settle difference
  between lying to conceal and lying to create reality.


