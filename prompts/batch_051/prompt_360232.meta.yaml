  constructed case, which you may refine: researchers maintain a synthetic vesicle
  in a flow reactor. It encloses a minimal catalytic system, imports nucleotide and
  amino acid precursors and an energy source, and continually synthesises its own
  membrane components and catalysts, keeping itself far from equilibrium. When a vesicle
  is mechanically extruded it gives rise to daughter vesicles that repeat the process,
  so the system reproduces. But the genome-like template is not copied from parent
  to daughter: each generation''s template is synthesised afresh by the research team
  and inserted, so replication is effectively error-free and no variation is inherited.
  There is self-maintenance and reproduction, but there is no population-level evolution.
  The question should present the case (with whatever additional detail is needed)
