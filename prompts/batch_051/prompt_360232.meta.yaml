  "I teach a third-year undergraduate seminar in the philosophy of biology, and I
  am drafting the final examination. I would like one essay question, to be answered
  in 45 minutes, marked out of 25, on the problem of defining life and the status
  of borderline cases. The question must not be answerable by reciting the standard
  definitions; it should force students to show that they understand why the main
  rival accounts of life — roughly, organisational accounts that treat life as self-maintenance
  within a boundary, metabolic accounts, and evolutionary accounts that tie life to
  natural selection — pick out different things as alive, and why a borderline case
  that splits them is a problem for the whole definitional project, not merely a puzzle
  about one odd entity."


