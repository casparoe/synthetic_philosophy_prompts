  A friend and I recently spent a long evening arguing about whether a person can
  lack standing to blame, and we ended up with a list of conditions but no agreement
  about how to apply them. Our question was not whether the wrongdoer in each case
  deserves blame, nor whether the blame was true; it was about whether the blamer
  is in a position to deliver it. The list we produced has four conditions:


  1. The performance condition: the blamer must not currently be engaged in wrongdoing
  of the same kind, for the same sort of reasons, as the conduct she is blaming.

  2. The clean-hands condition: the blamer must not have helped produce the wrong,
  encouraged it, or knowingly and voluntarily profited from it without taking whatever
  remedial steps were open to her.

  3. The commitment condition: the blamer must in fact hold herself to the standard
  she invokes; she must be disposed to accept criticism of her own comparable failures
  rather than to exempt herself.

  4. The relationship condition: the blamer must have a legitimate stake or role with
  respect to the wrong, its victim, or the practice involved, so that her blame is
  not the intrusion of a complete stranger into others'' business.


  With those conditions on the table, consider the case we kept circling back to.


  Dana is a mid-career biologist who runs a lab with unusually strict data-integrity
  protocols. She learns that Kumar, a junior researcher in another lab, changed two
  values in a dataset before filing a progress report to a funder, making a result
  look slightly cleaner than it was. Dana reports the incident through the proper
  channel and writes a department-wide email in which she says Kumar has betrayed
  the basic standards of their field.


  What the department does not know is this. Twenty years ago, when Dana was a graduate
  student, she once excluded three inconvenient data points from the analysis in a
  small paper without disclosing the exclusions. Her advisor had not ordered her to
  do it, but the practice was implicit in how the lab worked, and she was afraid of
  falling behind. The paper was never corrected. It helped her get her first postdoc.
  Since then she has not done anything like that again, and she has built her reputation
  partly on transparency and reproducibility. She has drafted a correction to the
  old paper more than once but has never submitted it; doing so would reveal the practice
  to her field and would also expose her former advisor''s lab. She privately regards
  the old exclusion as the worst thing she has done.


  My friend argued that Dana lacks standing: the wrongs are the same in kind, and
  her own wrong remains unremedied because the record still stands uncorrected. I
  argued that Dana has standing: her blame is coming from genuine commitment to the
  norm now, and her delay in correcting a decades-old minor paper is a failure of
