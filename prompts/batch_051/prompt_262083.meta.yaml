  Potential draft final:


  "I am a graduate student in moral philosophy working on Bernard Williams''s integrity
  objection to impartialist moral theory, and I have been stuck on an asymmetry in
  ordinary moral judgment that I would like you to help me think through.


  Consider two agents. The first is an emergency physician deciding which of two patients
  should receive the last ventilator. She consults the hospital''s outcome-based triage
  criteria, sees that one patient''s expected outcome is moderately better, and gives
  that patient the ventilator. If she had passed over the better-prognosis patient
  because the other reminded her of her sister, we would regard her as having acted
  unprofessionally; the personal consideration seems not merely outweighed but out
  of place. The second agent is a man who wakes to find his house on fire and can
  carry to safety either his daughter or his neighbours'' two children. He stops,
  deliberately adopts the impartial standpoint, weighs two lives against one, concludes
  that the two count for more, and carries out the neighbours'' children. Most people
  judge that he has done something wrong, and their unease is not only about the outcome:
  they locate the failure in the weighing itself, in the fact that he had one thought
  too many before responding to his daughter''s being there. The same kind of observation
  appears in Williams''s discussion of the husband who stops to ask whether he is
  justified in saving his wife.


  Here is the asymmetry. In the physician''s case we demand that the agent step back
  from her attachments and let an impartial calculation govern; in the father''s case
  we condemn the agent for performing that very operation, even when the calculation
  is correct. Both agents stand in roles partly constituted by commitments — the physician
  to her professional standard of care, the father to his child — and both face a
  choice between acting from those commitments and subjecting them to impartial review.
  Yet our reactions diverge.


  I would like to know whether any single principle can justify this divergence, or
  whether it is an inconsistency we live with. The strongest candidates I can formulate
  — special obligations attach to persons rather than institutional roles, roles legitimately
  require the bracketing of attachments, love is partly constituted by not treating
  the beloved as merely one person among others — all seem strained by a hybrid case:
  the emergency physician''s own child is wheeled into the bay during her shift, and
  the triage protocol requires her to treat the child as one patient among others,
  subject to the same outcome calculation. Is there a version of the principle that
  handles the original cases without collapsing in the hybrid, and does it leave the
  integrity objection in Williams''s sense intact? I am less interested in which verdict
  you finally reach than in seeing what the asymmetry commits us to if we try to keep
  it."


