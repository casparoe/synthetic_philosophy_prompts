  one is less surprising, but you exist regardless. For SSA, existence isn''t evidence
  for many observers because you condition on being an observer at all? Actually SSA:
  P(I am observer k | N observers) = 1/N. But if you don''t know which one you are,
  the probability that you exist as "some observer" is 1 given that there''s at least
  one. So SSA doesn''t give the many-observer likelihood boost. SIA adds a factor
  of N.


