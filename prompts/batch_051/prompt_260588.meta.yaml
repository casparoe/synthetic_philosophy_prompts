  Self-Indication Assumption (SIA): Given the fact that you exist, you should (other
  things equal) favour hypotheses according to which many observers exist over hypotheses
  on which few observers exist. More formally, your existence is evidence that the
  world contains more observers; the likelihood of your existence given a hypothesis
  is proportional to the number of observers in that hypothesis (roughly).


  Self-Sampling Assumption (SSA): You should reason as if you are a random sample
  from the set of all observers (or all observer-moments) that actually exist. SSA
  avoids the presumptuous philosopher because it does not favour more observers; it
  makes "your" existence more surprising if there are fewer? Let me recall. SSA says:
