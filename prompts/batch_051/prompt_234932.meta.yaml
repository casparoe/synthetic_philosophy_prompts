  The Fitch result, as I understand it: suppose you hold the verificationist-sounding
  principle that every true proposition is knowable — for any truth p, it''s possible
  for someone to know p. Then take a truth of the form "p and no one knows p" (true
  whenever p is true but unknown). If someone came to know that conjunction, knowledge
  distributes over the conjuncts, so they''d know p and know that no one knows p;
  but factivity of knowledge gives that nobody knows p, so they don''t know p — contradiction.
  So the conjunction is a true proposition that cannot possibly be known. Hence from
  the existence of any unknown truth, you get an unknowable one, and the knowability
  principle collapses into the omniscience claim that every truth is actually known.
  That is, the very act of making that high-order fact known would destroy part of
  what it says.


  Now, Goodhart''s law says, roughly, that the act of publicizing a measure as a target
  changes the behavior of the people it measures, so the measurement no longer reflects
  the underlying quantity it was meant to track. In both cases, the instrument of
  knowledge — the knower in Fitch, the published metric in Goodhart — is part of the
  system it depicts, so trying to accurately represent the system changes the system.
  But in Fitch the failure is a proof from factivity and distribution; in Goodhart
  it''s an empirical regularity about incentives and adaptation. Am I looking at the
  same underlying structure — a fixed-point constraint on systems that contain their
  own representation — or is this just a superficial verbal echo, a pun on "knowing
  changes what''s known"? Does anything from Goodhart''s world of gaming and feedback
  loops transfer to the philosophy of verificationism, or vice versa? Is Fitch''s
  paradox perhaps what Goodhart''s law would be if people optimized the truth itself
  rather than just their behavior?"


