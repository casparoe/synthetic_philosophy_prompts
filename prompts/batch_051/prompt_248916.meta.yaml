  Theory: hyperbolic discounting / present bias accounts for akrasia. The idea: agents
  have a discount function that sharply devalues future rewards relative to near ones,
  and this discounting is inconsistent across time: from Monday I prefer studying
  over partying on Friday; on Friday I prefer partying. The "weakness" isn''t acting
  against a standing preference; it''s that preferences shift as the smaller-sooner
  reward becomes imminent. The β-δ model formalizes this: a present bias term β means
  that when both rewards are in the future, the later larger one wins, but when the
  sooner-smaller one is immediate, it wins. So akrasia = time inconsistency, no need
  for a mysterious "will."


  Intuition: that''s not what my akrasia feels like. When I scroll on my phone instead
