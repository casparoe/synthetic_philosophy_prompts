  then mutual cooperation can be an equilibrium: a program that says ''cooperate iff
  the other program''s code matches this one, otherwise defect'' does fine against
  itself, and a mutant program that always defects gets read as a defector and is
  defected against, so it ends up with the mutual-defection payoff instead of the
  tempting unilateral-defection payoff. So you get self-enforcing cooperation with
  no iteration, no reputation, no enforcement. That''s astonishing, and I find myself
  wanting it to be a deep result about rationality.


  But then I look at the plain one-shot PD—two strangers, moves sealed in envelopes,
  no chance to condition on anything about the other''s code—and my intuition says:
  defect, obviously. There''s no causal path from my choice to the other''s, so my
  defection is strictly preferable no matter what they do, full stop. When the game
  is re-described with programs that read each other, I can''t shake the feeling that
  we''ve just changed the game. The strategy space is different, the information is
  different, the ''one-shot'' is doing different work. Is program equilibrium a solution
  to the original PD, or is it a distinct game where the old intuition doesn''t apply?
  And if the intuition only applies to the original game, is it still a firm intuition
  about rationality, or just an artifact of a particular and maybe unrealistic formalization?


