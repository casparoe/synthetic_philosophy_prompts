  Potential prompt:


  I''ve been working through Adam Smith''s account of the impartial spectator and
  keep running into the same snag. In The Theory of Moral Sentiments, the place where
  he describes self-examination (Part III, Chapter 1), Smith says something like:
  to scrutinize my own conduct, I split into two roles, and the part of me that judges
  attempts to inhabit the perspective of a fair and impartial spectator—trying to
  feel what such a spectator would feel about my motives and actions. I find the explanatory
  elegance here genuinely hard to resist: it unifies the way we blame others and the
  way we blame ourselves, it makes moral judgment a single mechanism of entering into
  other people''s sentiments, and it gives conscience a social origin without needing
  to posit a special moral faculty. But I also have a very firm intuition that my
  own self-assessment does not, in fact, proceed that way. When I''ve done something
  that others would approve of but I don''t, or when I regret a choice that every
  actual spectator in my life thought was fine, I don''t experience myself as summoning
  an imagined observer whose sentiments I then borrow. I experience myself as possessing
  direct, private knowledge of my own motives—and as rejecting, from the inside, how
  any observer, actual or imagined, would see them. This feels less like adopting
  a more neutral spectator and more like the reverse: a first-person authority that
  corrects spectators.


  So here''s my question. Smith''s theory says self-judgment is just the impartial
  spectator''s voice, internalized. My intuition says there''s a residual first-person
  standpoint—call it a private evaluator—that is not merely the spectator in fictionalized
  form, and that can stand against the spectator''s verdict. I want to know which
  one should give way, or whether there''s a reading on which both can be retained.
  If I keep Smith''s mechanism, I''d need an argument that the "private evaluator"
  is either the impartial spectator already, differently described, or that it''s
  an artefact of introspection that should be debunked. If I keep the intuition, I''d
  need to know what piece of Smith''s account has to go—maybe the claim that all self-judgment
  works through imagined spectators, or the claim that the spectator is acquired by
  internalizing actual social judgments. Give me the strongest version of each option
  and tell me which one you would give up, and whether there''s a way to read "spectator"
  broadly enough that my intuition isn''t actually contradicting Smith.


