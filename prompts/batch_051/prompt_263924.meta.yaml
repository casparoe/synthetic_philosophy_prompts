  inspire present action, but it risks turning the past into a distorted gallery of
  heroes and making the living feel small by comparison. Antiquarian history preserves
  the small, local, inherited stuff that gives a community its identity, but it risks
  mummifying the past and refusing to let anything go. Critical history hauls the
  past before a tribunal and condemns it, which is necessary if a people is ever to
  free itself, but it risks pretending we can slice ourselves off from the very inheritance
  that made us. The book then says Nietzsche''s takeaway is that a healthy culture
  needs a mix of all three, tailored to whatever the present needs, and that Nietzsche
  has no problem at all with a history that bends the record if the lie is life-enhancing,
  because for him truth about the past matters only as a means to vitality. Something
  in the last part bothers me: I thought Nietzsche was also obsessive about honesty,
  and I can''t tell whether the book has actually said something false or just collapsed
