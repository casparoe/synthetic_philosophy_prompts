  II). Three modes: monumental, antiquarian, critical (monumentalische, antiquarische,
  kritische Historie). Monumental history: focuses on great achievements of the past
  as models, provides inspiration, belief that greatness is possible; drawback: can
  be used to mythicize, distort, "the dead bury the living," can create an inflated
  sense of one''s own era, can discourage by comparison. Antiquarian: preserves and
  venerates the past, what is small, limited, decayed; gives a sense of rootedness,
  identity; drawback: mummifies, blinds to novelty, everything equally valued, can
  stifle action. Critical: drags the past before the tribunal, condemns it, breaks
  it up to serve life; needed to free from inherited burdens; but always dangerous
  because we are products of the past, can''t fully escape; it''s an attempt to give
  oneself a past a posteriori, involves force, can have disastrous "life-furthering"
  but destructive. The key normative concept: history should serve "life" (Leben)
  — the unhistorical (das Unhistorische) and the suprahistorical (das Überhistorische)
  are powers for life; too much history is a "consuming fever" (historische Krankheit),
  the modern man suffers from hypertrophy of historical sense, "malady of history."
  Nietzsche distinguishes three types of history, all can be unhealthy in excess;
  the goal is harmony of the three, each needing a certain soil. He criticizes modern
  "scientific" history (Wissenschaft) as an end in itself, five (?) aspects: history
  as neutral fact-collecting, monumentalizes etc.


