  Scenario: The asker is reading a popular book or heard a professor summarize Nietzsche''s
  essay. They want to know if the summary is fair.


  Write the third-party summary in the voice of a competent popularizer, mostly right
  with one or two subtle misrepresentations.


  Possible summary paragraph:


  "Here''s how a book summarized it: Nietzsche thought the modern age was sick from
  too much history. He said history only has value insofar as it serves life, and
  he distinguished three healthy ways it can do that. Monumental history takes great
  achievements from the past as models to inspire present striving; its danger is
  that it distorts the past into a gallery of heroes and can discourage the person
  it was meant to inspire. Antiquarian history lovingly preserves the small, local,
  and inherited, which gives a community its identity; its danger is that it mummifies
  everything and refuses to let anything die. Critical history brings the past before
  a court and condemns it, which is necessary for genuine freedom; its danger is that
  we can''t actually sever ourselves from what we are criticizing, since we are products
  of it. Nietzsche''s conclusion is that a healthy culture needs all three in balance,
  but above all needs whatever version of the past is most serviceable for its present
  purposes — if a useful fiction strengthens a people, Nietzsche has no objection,
  because for him the truth of the historical record is only valuable as a means to
  vitality."


  The subtle misrepresentations:

  1. "its danger is that it distorts the past into a gallery of heroes and can discourage
  the person it was meant to inspire" — actually monumental history''s danger includes
  that it can be used to justify the status quo, it can channel energy away from great
  new creation by making present greatness seem already achieved, it underestimates
  the difference between past and present, evokes "effects in themselves" etc. But
  "can discourage the person it was meant to inspire" is plausibly one of Nietzsche''s
  concerns (comparison can be paralyzing). Fine.


  2. "Nietzsche has no objection to a useful fiction... truth only valuable as a means
  to vitality." This is the overstatement: Nietzsche privileges life over truth and
  criticizes "objective" history detached from life; he says history must serve life,
  but he does not straightforwardly endorse "useful fictions" indiscriminately. He
  leaves room for truthfulness; he''s critical of the demand that history be pure
  science, and sees the "historical sense" as both a virtue and a disease. The summary
  overstates the anti-truth stance. Also the final clause renders his position as
  pure pragmatism, ignoring that he thinks the hypertrophy of the historical sense
  undermines the "plastic power" and that some truthfulness (critical history) is
  painful but needed. Also there might be a subtle issue with "all three in balance"
  — Nietzsche says each kind of history is appropriate for different persons/peoples/goals,
  not necessarily a "balance" in one culture; his claim: "History, so far as it serves
  life, serves an unhistorical power" and the three species each need their own ground.
