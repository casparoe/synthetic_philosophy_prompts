  "I have been trying to work out whether the rationalist explanations of war familiar
  from international relations carry over to AI development races, and I want an assessment
  of the argument I have assembled. I will state the reasoning as a sequence so that
  any defects can be located precisely.


  (1) On the rationalist account associated with Fearon, war is a puzzle because it
  is costly ex post: whatever the outcome of a war, both sides could have been at
  least as well off had the same distribution of the contested stakes been achieved
  by negotiation without the destruction. Since both sides know this, some bargain
  must have been preferable to fighting, and the fact that fighting occurred anyway
  must be traced to one of three mechanisms: private information with incentives to
  misrepresent, a commitment problem, or indivisible stakes.


  (2) An AI race has the same structural profile. It is a costly contest: participants
  spend enormous resources and take risks with safety partly because they are trying
  to get ahead, and the ''bargain'' that would avert it — an agreement to slow down,
  coordinate, or share the fruits of transformative AI — looks, on its face, as though
  it would leave both sides better off than the race does. Each would avoid the wasted
  resources and the tail risks while still obtaining some access to the eventual capabilities.


  (3) The three mechanisms are all present in an AI race. Private information: each
  side has better information about its own progress, safety practices, and resolve
  than its rivals do, and each has obvious incentives to misrepresent all three. Commitment
  problem: any promise of restraint or sharing is hard to make credible because defection
  can secure a decisive first-mover advantage, and there is no external enforcer with
  the capacity and standing to verify compliance. Indivisibility: the thing being
  contested — being first, or possessing the decisive capability before anyone else
  — is hard to divide as a matter of degree.


  (4) Therefore, if rational actors fight wars for these reasons, rational actors
  should also be expected to race for transformative AI for the same reasons, and
  the race should persist even among fully rational actors who fully understand the
  risks.


