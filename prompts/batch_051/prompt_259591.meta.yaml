  Dennett''s "Quining Qualia" strategy: he argues that "qualia" as standardly defined
  form an incoherent conjunction of properties: ineffable, intrinsic, private, and
  directly or immediately apprehensible in consciousness. He uses a series of "intuition
  pumps" (the inverted spectrum cases, the "cerebroscope", the Chase and Sanborn coffee
  tasters, etc.) to show that no actual state can satisfy all four properties; when
  we try to make the properties precise, the notion falls apart. Chase and Sanborn:
  two coffee tasters at Maxwell House. Both say their tasting has changed. Chase says
  the coffee tastes the same as ever, but his standards have risen—so the same qualia
  now fail to satisfy. Sanborn says his standards are unchanged, but the taste now
  seems different—so he''s experiencing different qualia. Dennett uses this to argue
  that the distinction between "same quality but different reactive disposition/standard"
  and "different quality" is underdetermined or pragmatic: there''s no fact of the
  matter about qualia identity independent of the tasters'' judgments and dispositions.
  This undermines the idea of qualia as intrinsic, directly apprehensible properties.
