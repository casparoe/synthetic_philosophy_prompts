  Let me craft the confusion precisely.


  Harsanyi''s aggregation theorem (1955): If individuals have preferences satisfying
  vNM axioms over lotteries, and social preferences satisfy vNM axioms, and Pareto
  indifference (if everyone is indifferent between two alternatives, society is indifferent),
  then social utility function is a weighted sum of individual utilities (affine transform).
  Actually two versions: aggregation theorem and impartial observer theorem. The theorem
  shows that any social welfare function satisfying some axioms has a utilitarian
  (weighted) form. But doesn''t "prove utilitarianism" ethically because:

  1. It assumes that social preferences must satisfy the vNM axioms — i.e., society
  is treated as a rational agent with its own expected-utility preferences over lotteries.
  That''s a substantive assumption; welfarism? Actually the theorem assumes a social
  welfare function W defined on individual utilities that is linear in probabilities.
  But it doesn''t rule out non-welfarist concerns (e.g., fairness, rights) unless
  the space of prospects includes?

  2. The "social preference" is the preference of a single evaluator (planner), and
  applying vNM to it assumes the evaluator''s risk attitude can be represented; that''s
  not ethically neutral.

  3. Pareto indifference only requires respect for unanimous indifference, but the
  crucial assumption maybe that both individual and social preferences obey vNM and
  that social utility depends on individual utilities? The theorem''s mathematical
  result is representation, not normative content. The weights can be unequal, so
  it''s "utilitarian" in form (weighted sum) but doesn''t specify equal weights; equality
  requires further impartiality assumption.

  4. Interpersonal comparisons of utility are not implied; cardinal utility from vNM
  is defined up to affine transformations for each individual, and choosing scaling/zero
  points for each is itself a value judgment (the weights).

  5. It rests on describing outcomes as lotteries over "positions" of individuals
  (identity switching) in the impartial observer version; that involves thought experiments.


  The common misconception: "Harsanyi proved utilitarianism from Pareto + rationality."
  A good answer would say: the theorem shows that under those axioms the social evaluation
  takes an additively separable, weighted-sum form. But calling that "utilitarianism"
  is interpretive; the axioms pack in more normative content than they look; in particular,
  applying expected-utility axioms to the social evaluator is the move that does much
  of the work, and the requirement that social preferences satisfy vNM over lotteries
  containing social states is not a bare commitment to consistency. Also it doesn''t
  prove interpersonal comparisons or equal weights.


