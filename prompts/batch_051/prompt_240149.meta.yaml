  Draft student answer:


  "The debate over the currency of egalitarian justice concerns what it is that an
  egalitarian society should equalise. Welfarists hold that the relevant currency
  is welfare, understood as preference-satisfaction or happiness. Sen and Nussbaum
  raise two objections to this view. First, welfarism is vulnerable to the phenomenon
  of adaptive preferences: people in deprived circumstances often scale down their
  aspirations and report high satisfaction with very little, so a welfarist metric
  may judge an unjust distribution to be just. Second, welfarism is concerned only
  with the end state of how a person feels, and ignores the question of what a person
  is actually able to do and be, which is arguably more important than satisfaction.


  Resourcism, associated with Dworkin, avoids the problem of adaptive preferences
  by equalising impersonal resources rather than inner states. Nevertheless, Sen and
  Nussbaum argue that it is still inadequate, because people differ in their ability
  to convert resources into valued doings and beings. A disabled person and an able-bodied
  person with identical resource bundles are not equally placed, because the disabled
  person requires more resources or different kinds of resources to achieve the same
  functionings. Similarly, social norms can make it harder for women to convert the
  same income into effective agency. The capability approach therefore proposes the
  capability as the relevant currency, where a capability is a person''s real freedom
  to achieve a functioning. Functionings are what a person is or does, such as being
  adequately nourished, while capabilities are the genuine opportunities to achieve
  such states.


  The distinction between capabilities and functionings is essential to the approach,
  since an egalitarian should be concerned with the freedom people have, not with
  forcing anyone to make use of it. This is why Sen proposes ten central capabilities
  as the metric of a minimally just society: a list that includes life, bodily health,
  bodily integrity, senses, imagination and thought, emotions, practical reason, affiliation,
  other species, play, and control over one''s environment. By enumerating the capabilities
  in this way, the approach supplies a determinate and internationally applicable
  standard.


  However, the capability approach faces difficulties of its own. The first is that
  it remains vulnerable to the adaptive-preference objection, because people may come
  to value only what they believe they can achieve, so their capability sets will
  reflect their diminished aspirations. The second is that, once one tries to measure
  capabilities in practice, one inevitably falls back on achieved functionings as
  a proxy; the capability metric is therefore, at the level of application, just a
  measure of the functionings people actually attain, which reintroduces the very
  focus on outcomes that the approach was meant to overcome.


  In conclusion, although the capability approach improves on welfarism by rejecting
  subjective welfare and on resourcism by attending to conversion factors, it does
  not fully resolve their difficulties. Its residual indeterminacy about the list
  and its collapse into a functioning metric at the point of application mean that
  it relocates, rather than overcomes, the problems faced by its rivals."


