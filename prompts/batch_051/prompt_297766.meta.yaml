  Prompt (British English, formal):


  "I am a curator at a museum of mathematics preparing a new permanent gallery on
  the deep history of mathematics. We need a written decision procedure that curators
  and curatorial assistants can apply when deciding whether an artefact or a past
  practice should be described in labels and catalogues as ''mathematics'', as opposed
  to ''counting'', ''measuring'', ''record-keeping'', or ''arithmetic in the service
  of administration''. The distinction matters for our public claims: we do not want
  to inflate tally marks into mathematics, nor to strip the mathematical content from
  objects merely because they predate modern notation.


  Please write the procedure as a sequence of questions, with, for each question,
  an explanation of what it is designed to detect, what counts as a sufficient answer,
  where the procedure stops with a ''no'', and where it must hand the decision to
  a person because the question is one of scholarly judgement rather than fact. Ground
  the questions in whatever philosophy and history of mathematics can actually support,
  and be honest about which steps are judgement calls dressed up as procedure.


  Then run the procedure on three objects:

  - a bone or stick carved with successive notches, of the kind often interpreted
  as a tally;

  - Plimpton 322, the cuneiform tablet whose rows are widely read as a table of Pythagorean
  triples;

  - an Inca khipu (quipu), a set of knotted cords generally agreed to encode administrative
  quantities.


  For each, say what the procedure determines, what it leaves open, and whether the
  procedure gives an answer the curators will not like. Conclude by naming the case
  the procedure is most likely to misfire on, and the question the procedure cannot
  answer because it is a question about what we value in calling something mathematics."


