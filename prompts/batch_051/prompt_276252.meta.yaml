  In a course on judgment and decision-making, we played Martin Shubik''s dollar auction,
  and the post-game argument still hasn''t been resolved. The rules, for context:
  an auctioneer sells a one-dollar bill to the highest bidder; the winner pays their
  final bid and takes the dollar; but the second-highest bidder must also pay their
  final bid and receives nothing. (We played with minimum raises of ten cents, and,
  as usual, two people ran the price well past a dollar.)


  Afterward, one of the bidders, Callum, argued that anything beyond the first dollar
  reflected pure sunk-cost thinking. At $1.50, he said, the previous bids are unrecoverable;
  the only question going forward is whether the next increment plus the risk of losing
  outweighs the dollar you might win, and by any ordinary calculation the answer is
  no. So continuing is irrational, and the auction is a laboratory version of the
  escalation of commitment we see in failing projects.


  The other bidder, Priya, pushed back. She said the sunk-cost diagnosis mislocates
  the decision. At $1.50, quitting means losing $1.50 for certain; bidding $1.60 means
  that if the opponent quits you lose only sixty cents net, and if the opponent continues
  you may lose more, so the relevant comparison is between two bad options, not between
  recovering the past and going forward. That, she insisted, is forward-looking expected-loss
  reasoning, not throwing good money after bad. Callum replied that this is exactly
  the trap: each step looks locally better than quitting, but the reasoning guarantees
  a globally terrible outcome, so a rational person would adopt a hard stopping rule
  before entering rather than vindicate escalation after it happens. Priya answered
  that precommitment may be wise, but it does not settle what it is rational to do
  at a node; refusing to bid at $1.60 for the sake of consistency with an earlier
  plan is itself a kind of sunk-cost thinking. She added that real-world escalation
  of commitment is often driven by reputational and group pressures, which were absent
  here.


  They asked me to referee, and I could not. Please adjudicate the disagreement point
  by point: who is right about which specific claims, whether anything in the framing
  both of them are agreeing to is mistaken, and who is more right overall.


