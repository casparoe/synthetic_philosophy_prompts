  from getting bored: I design season passes, rotating modifiers, procedurally shuffled
  environments, chase items. The studio''s shared assumption is that novelty is good
  — that a content loop which keeps surprising players is better than one that doesn''t,
  and that a player who gets bored has been failed by the design. But I''ve started
  to wonder whether that assumption is actually true outside the product, and whether
  we even mean the same thing by ''good'' when we say it.


