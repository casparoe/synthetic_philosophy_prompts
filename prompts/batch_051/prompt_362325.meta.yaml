  ---


  For the past few months I have been turning over a question I first hit while designing
  content systems for a live-service game. My job, more or less, is to keep players
  from getting bored: season passes, rotating modifiers, procedurally shuffled environments,
  chase items, limited-time modes. The studio''s working assumption is that novelty
  is good — a content loop that keeps surprising players is better than one that does
  not, and a player who grows bored has been failed by the design. Lately I have started
  to doubt whether that assumption holds outside the product, and whether the word
  good is doing the same work in both places.


  I would like you to take the main serious positions one could hold about whether
  variety, novelty, or adventure is a component of a good life. At minimum, cover:
  the view that only pleasant states matter, and novelty matters only insofar as it
  reliably produces them; the view that a good life consists in getting what one actually
  wants, with novelty mattering only when it is wanted; the view that some activities
  or states, possibly including ongoing exploration or exposure to the unfamiliar,
  are good for a person whether or not they are wanted or enjoyed; the view that a
  life can be good while remaining completely familiar and predictable, with novelty
  at best an instrumental good that gets mistaken for a final one; and the view that
  the fear of a boring life is itself what needs explaining, rather than a signal
  that a good life must contain variety.


  Restate each position in the vocabulary I actually use as a game systems designer:
  content loops and their lifespan, retention and churn, novelty sinks and how quickly
  content is exhausted, mastery and flow, intrinsic versus extrinsic rewards, player
  motivation models, cosmetic versus systemic novelty, procedural variation versus
  authored set pieces, and metrics such as time-to-boredom. This should be a translation,
  not an analogy or an explainer in my direction: for each position, say what it asserts
  when written in systems-design terms.


  Then give me a residue report. Tell me which claims survive the translation cleanly,
  which can be expressed only with distortion, and which have no counterpart in my
  vocabulary at all. In particular, I want to know whether my working instinct — that
  novelty just is engagement carried over a longer horizon — is the same claim as
