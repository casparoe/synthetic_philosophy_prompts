  Domain: Hume on causation. Type 3 is highly natural:

  - Theory: regularity theory of causation (causation is nothing but constant conjunction;
  necessity is projected by the mind). It has systematic virtues: avoids mysterious
  powers, parsimonious, fits empiricism.

  - Intuition: when a brick hits a window, the breaking is produced by the impact;
  there is a necessary connection; the regularities could all hold by pre-established
  harmony and there''d be no causation.

  - New Hume: some interpreters say Hume believed in real necessary connections but
  they''re unknowable. The asker might be convinced by the regularity reading but
  can''t shake the intuition. Ask which should yield, with strongest versions.


