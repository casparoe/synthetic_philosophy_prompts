  A friend and I recently argued late into the night about whether "exit" can do for
  state authority what voice cannot. He held that projects like charter cities, private
  cities, and seasteading—even taken at their best—do not let anyone actually opt
  out of the state; they only move a person from one jurisdiction to another, and
  every jurisdiction ultimately rests on coercion. I held that this underrates exit:
  if a person has a genuinely available alternative (a rival jurisdiction with a tolerable
  legal order and low costs of relocation), their staying in a state looks much more
  like consent than the staying of someone who has no alternative, and that difference
  should matter for political obligation.


  I would like your own number, not just a discussion. Please give your credence for
  the following claim: For a typical citizen of a reasonably just liberal democracy,
  the existence of a genuinely available exit option—a realistically accessible rival
  jurisdiction, whether a well-run charter city, private city, or equivalent, where
  one could expect tolerably good governance and basic rights protection—would, if
  the citizen nonetheless remains, make their political obligation to their state
  better justified than it would be in the absence of any such exit option.


  Then decompose the question. In particular, I suspect the answer depends on at least
  these moving parts:

  1. Whether political obligation is in any significant part consent-based at all,
  rather than resting entirely on fair play, associative duties, or a natural duty
  of justice. (Your probability that consent carries at least some independent justificatory
  weight for political obligation.)

  2. Whether remaining in a jurisdiction while having feasible exit can constitute
  tacit consent, given factors like inertia, attachment to place, family, language,
  or risk—i.e., whether "not leaving" reliably signals acceptance.

  3. Whether the rival jurisdiction must itself be reasonably just, or merely available,
  for exit to confer legitimating force.

  4. Whether the state''s claim is actually strengthened by exit, or whether exit
  simply removes some grounds for complaint without adding any positive justification.


  For each, assign a rough probability, explain how they combine into your overall
  number, and tell me which of these is doing most of the work. My friend and I both
  came out around 0.2 and 0.8 respectively, and we could never isolate exactly where
  we diverged; I want you to say which sub-question most likely houses the disagreement.
  Finally, tell me what evidence or argument would move your overall number the most,
  and in which direction.


