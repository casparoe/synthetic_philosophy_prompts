  Objections to anti-reductionism (default trust):

  1. The "blind trust" / gullibility objection: if testimony were justified absent
  evidence, any arbitrary assertion would be believed, licensing belief in false or
  absurd reports.

  2. The "generality" objection: a blanket entitlement to belief on testimony must
  either be universal (implausible, because some speakers are unreliable) or restricted
  (requires prior identification of reliable sources, which smuggles in reductionist
  evidence).

  3. The "infant/child trust" problem: anti-reductionists often cite children''s reliance
  on testimony, but children may simply be developmentally credulous; otherwise adults
  would be epistemically entitled to trust conspiracy theories on testimony.

  4. The "perceptual analogy" objection: testimony differs from perception because
  speakers have intentions and can lie; perception''s reliability is non-agential,
  so the analogy fails.

  5. The "base-rate" objection: countless utterances are false, misleading, or uninformed
  each day; default acceptance would swamp the epistemic system with error.

  6. Maybe Lackey''s "reliability of speaker" cases, Fricker''s "trust without monitoring
  is epistemic irresponsibility."


