  I''m a high school policy debater. Several times each tournament—during the 10–15
  minutes of prep time before a round—I have to decide whether a piece of evidence
  is strong enough to read in front of a judge. More and more, the decisive issue
  is that the study or model behind a card rests on assumptions that don''t describe
  the real world: consumers are perfectly rational, markets are frictionless, the
  labor market is perfectly competitive, the climate responds linearly, and so on.
  Teams on both sides now attack evidence by saying "the assumptions are unrealistic,"
  but that can''t be the end of the matter, because every model worth using in economics
  or climate science has simplifying assumptions.


  I want you to write me a reusable decision procedure I can actually run during prep,
  grounded in what the philosophy of science has established about idealization and
  unrealistic assumptions—in particular the debate around what''s usually called Friedman''s
  F-twist, the claim that the realism of assumptions doesn''t matter as long as the
  model predicts well. I need the procedure to steer between two errors: throwing
  out a useful model merely because its assumptions are false, and admitting a model
  whose predictions are only right for the wrong reasons. It has to tell me which
  distinctions survive when you translate the theory into a fast checklist and which
  distinctions can be dropped.


  Please make it a set of questions to ask in order, with what counts as a sufficient
  answer to each, where the procedure stops with "do not read this evidence," and
  where it explicitly hands the decision to a person because the question is a judgment
  call rather than something a checklist can settle. Also include two or three worked
  examples from policy debate, at least one of which produces an answer I will not
  like—for instance, a popular piece of evidence that your procedure would tell me
  not to read. Finally, say what the procedure cannot do: where it will misfire, and
  what kinds of model weaknesses it is blind to.


  Constraints to keep in mind: I have roughly twelve minutes; I am comfortable with
