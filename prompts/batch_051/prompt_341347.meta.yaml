  "I have been working through the Kosslyn–Pylyshyn debate about mental imagery after
  seeing it cited repeatedly in the rationalist-adjacent forums I read, usually as
  an example of two highly capable researchers looking at the same data for decades
  and never converging. Let me set out my understanding before I ask my question.
  Kosslyn''s side holds that imagery is carried by a depictive representational format:
  a spatial, picture-like medium in which distances and orientations are encoded by
  corresponding spatial relations in the representation itself, so that the time it
  takes people to scan across an imagined map or rotate an imagined figure increases
  roughly linearly with the distance or angle. Pylyshyn''s side denies that the format
  is picture-like. On his view, imagery is carried by the same sort of structured
  symbolic representations that carry other thought, and the scanning and rotation
  data do not reveal an underlying depictive code; subjects may simply be exploiting
  their tacit knowledge of what it would be like to look at a picture or watch an
  object rotate, and their response times track the demands of that imagined task
  rather than the metric of a depictive buffer. Later, neuroimaging entered the argument:
  Kosslyn and collaborators took retinotopic activity in early visual cortex during
  imagery to support the depictive account, while Pylyshyn''s side replied that finding
  activity somewhere in the visual system does not establish the format of the representation
  doing the work—it could be downstream of, or incidental to, the relevant computation.


