  "I have been reading my way through the old Kosslyn–Pylyshyn mental imagery debate,
  after seeing it cited on rationalist forums as a cautionary example of two sides
  never converging on the same data. My best understanding of the two positions is
  as follows. Kosslyn''s side holds that mental imagery is carried by a depictive
  format: a spatial, picture-like medium in which distance and orientation are represented
  by actual distance and orientation in the representation itself, which is why the
  time to scan between two points on an imagined map or to rotate an imagined shape
  rises roughly linearly with distance or angle. Pylyshyn''s side holds that imagery
  is carried by the same sort of structured, symbolic representations that carry other
  thought, and that the scanning and rotation results do not show the format of an
  underlying code; they could instead reflect what subjects tacitly know or expect
  about what it would be like to look at a picture or a rotating object, and they
  shape their response times accordingly. Later work brought in neuroimaging: Kosslyn
  and collaborators have taken retinotopic patterns in visual cortex during imagery
  as evidence for a depictive buffer, while Pylyshyn and others have replied that
  localising activity downstream of a representation does not settle the format of
  the representation itself.


  What strikes me is that after several decades this still does not look like either
  of the ordinary cases: it is not a case where one side is ignoring the data, and
  it is not a case where the two sides merely use words differently. So I want a diagnosis,
  not a verdict. My working hypothesis is that the two sides are, in effect, arguing
  about different success conditions for a theory of imagery: Kosslyn is primarily
  asking how imagery is implemented as a process in the brain (roughly Marr''s algorithmic/implementational
  levels), while Pylyshyn is primarily asking what is represented and why, and he
  rejects the picture account because it does not answer that computational question
  without smuggling in a homunculus who reads the picture. If that hypothesis is right,
  the debate is less a factual standoff than cross-talk between levels, and the unresolved
  dispute would be about whether a theory of format at Kosslyn''s level constitutes
  an explanation of imagery at all.


  I would like you to evaluate that diagnostic hypothesis and, where it fails, tell
  me what the better diagnosis is. Specifically: (a) Is the disagreement primarily
  verbal, about standards of evidence, about the status of introspective reports,
  about which cases count as data, about hidden empirical predictions, or about the
  question being asked? (b) Are there empirical results or conceptual distinctions
  that could have settled or dissolved the dispute, or is one side simply setting
  an unfalsifiable or over-demanding standard? (c) Given your diagnosis, what would
  real progress look like now — a specific experiment, a formal characterisation of
  representational format, a sharper question, or agreement that the original question
  was ill-posed? I am less interested in a summary of the literature than in the structure
  of the impasse, and please answer in British English."


