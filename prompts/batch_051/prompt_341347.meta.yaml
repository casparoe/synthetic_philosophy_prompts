  as one side ignoring the data or as a merely verbal dispute. My working hypothesis
  is that the impasse comes from differing success conditions for a theory of imagery.
  Specifically, I suspect Kosslyn is mainly answering an implementational or algorithmic
  question—how imagery is carried out in the brain—whereas Pylyshyn is mainly demanding
