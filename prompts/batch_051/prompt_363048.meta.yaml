  Popper''s The Poverty of Historicism arguments:

  1. Historicism (belief that history has laws and can predict long-term social future)
  is untenable.

  2. The course of human history is strongly influenced by the growth of knowledge.
  We cannot, by rational or scientific methods, predict the future growth of our scientific
  knowledge. Therefore we cannot predict the future course of human history. (I recall
  this from the Preface, and it''s a core argument.)

  3. Laws of nature are universal and invariant; history is a unique process, no general
  laws about it. The "laws of evolution" or "laws of history" are not universal laws
  but statements about a particular historical process.

  4. Holism: wholes cannot be studied; you can''t grasp a whole society, only select
  aspects. Utopian planning requires total reconstruction and is impossible due to
  complexity.

  5. The Oedipus effect: predictions influence events predicted (self-fulfilling or
  self-defeating), so exact/complete prediction of a social event by social science
  is impossible because the social scientist is part of the social world; publication
  of prediction changes outcome. But Popper says this effect, though interesting,
  is not the central argument; he says the main argument is the growth of knowledge
  argument.

  6. Trends are not laws: a trend depends on initial conditions and can change; no
  "law of progression."


