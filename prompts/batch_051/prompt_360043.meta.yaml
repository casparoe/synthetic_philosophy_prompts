  Let''s draft:


  "I work on ancient epistemology. Below is a passage from Plato''s Phaedo (74a):


  [quote]


  I keep finding that discussions of the theory of Forms slide between at least three
  distinct jobs: explaining what it is for two sticks to be equal, explaining how
  we can recognize them as equal when they are visibly imperfect, and explaining why
  the Form itself is a better object of knowledge. I want you to write the desiderata
  a theory of Forms must meet if it is to discharge the explanatory role this passage
  assigns to the Form of Equality — and, more generally, the roles assigned to Forms
  in the Phaedo and the central books of the Republic. Please treat the passage as
  a primary datum rather than as one illustration among others.


  For each desideratum, give the consideration or case in the text behind it. Then
  mark which are non-negotiable for any theory that remains recognizably Platonic,
  and which are optional commitments of particular camps (e.g. paradigmatism, self-predication,
  the causal reading of participation, the recollection story). I especially want
  you to sort out which requirements are genuine constraints and which are artifacts
  of a particular translation or a particular mid-century way of reading Plato.


  Finally, say which single desideratum most sharply separates the standard ''ordinary
  universals'' reading of Forms from a reading on which a Form is a standard or measure
  to which sensible things aspire but cannot be. Also flag any pair of desiderata
  that you suspect cannot be jointly satisfied without making the Form of Equality
  into a perfect particular, and say whether that is a bug or a feature.


  Max 900 words."


