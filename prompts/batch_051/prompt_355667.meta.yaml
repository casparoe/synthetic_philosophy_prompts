  prokaryote to complex cell; intelligence; technology; durable civilization) assign
  not a probability of eventual success but a distribution of waiting times under
  realistic planetary conditions. Then define the filter as the step that maximizes
  Q, where Q = ratio of the median waiting time to the window during which the next
  later steps remain possible. The step with largest Q, not the step with smallest
  per-year probability, is the one that should be called the filter. Because: a very
  unlikely-per-trial step may be crossed early if there are huge numbers of parallel
  trials or a long window, while a modest step can be the effective filter if it typically
  arrives near the deadline and leaves too little time.


