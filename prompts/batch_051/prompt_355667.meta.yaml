  "I have spent my career in [maybe no field specified] and only recently begun reading
  philosophy; accordingly, I have no professional stake in the relevant technical
  literature. I want a candid assessment of a concept I have been calling the deadline
  quotient.


  The standard Great Filter discussion, as I understand it, treats the road from abiotic
  chemistry to a galaxy-visible technological civilization as a sequence of independent
  gates—abiogenesis, the rise of complex cells, intelligence, technology, and so forth—and
  asks which single gate is nearly closed, i.e., which transition has the lowest probability.
  I believe this is the wrong quantity. A transition can have a very low probability
  per year per lineage and still be crossed quickly if the number of parallel trials
  is astronomical; conversely, a chemically modest transition can be the effective
  bottleneck if it typically does not happen before the window for everything downstream
  has closed. I therefore propose to rank transitions not by their success probability
  but by a ratio: the expected waiting time for the transition, given that all prior
  stages have occurred, divided by the time remaining before the planet or biosphere
  can no longer support the remaining stages. Call this quotient its deadline pressure,
  or DQ. The Great Filter, on this view, should be located at the transition with
  the highest DQ, and if every DQ is comfortably below one, there is no single filter
  at all—the emptiness of the galaxy is the accumulated product of many individually
  unremarkable delays.


  The reason I think this is more than a notational change is that it changes which
  transitions are the live candidates. Chemical difficulty and waiting time can diverge
  dramatically. On Earth, the appearance of life from non-life looks, from the record,
  to have been geologically fast, whereas some later biological transitions seem to
  have consumed an enormous fraction of the available clock, even if they were individually
  less astonishing for chemistry. I suspect the effective filter may sit in the long
  biological middle—eukaryogenesis, oxygenic photosynthesis, or the shift to cumulative
  culture—and need not be either abiogenesis or a future die-off.


