  criterion of non-egoistic action: no audience, no self-congratulation. If yes, continue.
  If no or uncertain, no as compassionate action; may still act as ordinary practical
  help but not call it moral.

  3. Test the effect on the other''s agency: Ask "Does this intervention present the
  other as someone to be helped, or as someone who can act?" If it increases dependency
  or invites performance of helplessness, no; redirect to capacity-building, practical
  assistance.

  4. Check the suffering''s demands: Is this a situation where immediate practical
  aid removes suffering (e.g., lost schoolwork, bereavement, panic) or where the suffering
  is existential/depressive and may be increased by being mirrored? If existential/depressive,
  do not attempt deep compassion alone; refer.

