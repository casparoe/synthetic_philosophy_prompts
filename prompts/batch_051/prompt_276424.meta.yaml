  Draft prompt:


  "You are a historical linguist and philosopher of language, and I want your candid
  assessment of a thesis I have been developing. Think carefully; start by restating
  my thesis in its strongest form, then say what is right about it and where it breaks.


  I call the thesis the Lexical Mortmain view. My starting observation is that technical
  vocabularies keep coining new words from Latin and Greek even though almost nobody
  speaks those languages, and I suspect the deadness of the source is not incidental
  — it is the point. A word assembled from living vernacular elements (say, ''guilty
  mind'' or ''fast heart rate'') remains connected to ordinary usage and drifts as
  ordinary speech drifts. A word assembled from classical roots (''mens rea'', ''tachycardia'')
  has no native speech community to give it new connotations, so it arrives already
  ''finished'': its meaning is whatever the coining community stipulated, and it looks
  authoritatively settled before it has earned any settled use.


  I think this explains several things at once. First, why law and medicine coin so
  heavily: they need terms that behave like permanent fixtures rather than living
  descriptions. Second, why classical coinage feels more precise than a plain-language
  equivalent even when the definition is just as vague — the closed roots create an
  aura of fixity independent of the concept''s actual sharpness. Third, why such terms
  often prove strangely durable: they get revised by committee, not by the gradual
  push and pull of usage.


