  Domain: why coin technical terms from Latin and Greek dead languages?


  Possible theories:

  - Prestige/authority: borrowing the authority of classical learning.

  - Precision and univocity: dead roots have fixed, stable meanings; living words
  carry unwanted connotations.

  - International neutrality: Latin/Greek are no one''s national language, so terms
  are culturally neutral and travel across languages.

  - Systematicity/productivity: classical roots combine productively to form families
  of terms (e.g., -ology, -itis, hyper-, hypo-).

  - Tradition/continuity: science and philosophy are continuous with Latin/Greek tradition.

  - Concealment/euphemism or gatekeeping: technical jargon excludes outsiders.

  - "Tombstone effect": because the language is dead, the root can''t generate new
  associations, so the coinage has a controlled, frozen semantic range — a promise
  of stability.


  My homemade concept could be one of these refined, or a novel synthesis.


  Candidate: "Lexical cryonics / terminological embalming." The theory: coining from
  Latin/Greek functions as a semantic commitment device. A living-language term continues
  to absorb connotations from everyday use, so its meaning drifts; a dead-language
  compound draws its parts from a closed corpus, which creates the impression (and
  partially the reality) that the concept is fixed and can be applied uniformly across
  time and contexts. This is why institutions, law, medicine, and science reach for
  classical roots when they want terms that don''t argue: they are trying to embalm
  a concept at the moment of naming, before a living community can deepen, narrow,
  or contest its application. The concept claims that Latin/Greek coinage is used
  less for precision per se than for terminological stability and authority; and the
  "deadness" of the source is the whole point, because a dead language can''t talk
  back.


