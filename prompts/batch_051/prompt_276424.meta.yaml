  obvious counterexamples: Latin/Greek derived terms do drift ("atom," "person," "hysteria,"
  "virtue"), so "embalming" may only work at the level of surface form and professional
  ideology, not actual diachronic semantics. Also prefixes/suffixes are living through
  new coinages; and the stability may come from institutional regulation (nomenclatures,
  legal definitions) rather than the source language. So the concept''s causal claim
  is contestable.


