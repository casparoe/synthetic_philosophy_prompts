  Concept: "lexical mortmain" (from legal "mortmain," dead hand — but I shouldn''t
  quote; I can mention the term). The thesis: When a discipline coins a term from
  Latin or Greek, it''s not merely borrowing prestige; it''s imposing a dead hand
  on the concept. A term built from a living language remains open to renegotiation
  by speakers: its roots carry on acquiring new uses, so the term inherits a living
  community''s drift. A term built from dead roots has no native community to push
  back, so its denotation appears to be whatever the coiner said it was, frozen at
  the moment of coinage. Thus classical neologisms function as semantic monuments:
  they convert a definition into a thing that looks discovered rather than negotiated.


  Central claims:

  1. Dead-language coinage is a strategy for stabilizing reference across time and
  space (a live-language coinage would mutate with the vernacular).

  2. The "deadness" is doing causal work, not just ornamental: Latin/Greek roots are
  a closed corpus, so their meanings are curated by specialists rather than by ambient
  usage.

  3. The apparent "precision" of classical coinage is often just this stability aesthetic
  — the term feels exact because it has no messy usage yet, not because its definitional
  criteria are crisp.


