  that others will also act. Even if they account for it and still think "the expected
  value of *whoever acts* is positive, and if I act the probability that at least
  one acts goes up," the subtle issue is the consequence of multiple acts. The fix:
  collectively agree on a threshold or appoint a single decision-maker.


