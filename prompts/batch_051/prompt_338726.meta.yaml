  I started keeping two rescue hens last spring, and I have been eating their eggs
  without much reflection. A friend recently pressed me on whether I can do that consistently,
  and the argument I wrote out to defend myself now seems to prove far too much. I
  would like a precise account of where it breaks.


  Here is the argument.


  (1) If I may eat the eggs my rescue hens lay, what makes that permissible is not
  that the hens intended the eggs for me, and not that I feed or house them in exchange.
  It can only be that the eggs are produced without my harming or exploiting the hens,
  and that if I do not take them they are simply wasted — the hens do not eat them
  and they rot.


  (2) If those two features — no harm or exploitation in the making of the thing,
  and the thing''s otherwise going to waste — are what make it permissible to use
  something, then they make it permissible to use anything that has those two features,
  regardless of its species, my relationship to its source, or the kind of thing it
  is.


  (3) The body of a sheep who dies of old age at the sanctuary where I volunteer has
  those two features relative to me: I had no part in her death, no one would be harmed
  by my using her body, and if I do not use it she will be buried or cremated rather
  than put to any use.


  (4) So the same reasoning permits me to use the body of a sheep who died naturally
  — to shear her for wool, tan her hide, or eat her flesh.


  (5) It likewise permits using a deer killed by a car near my house. The car, not
  I, killed her; taking the hide or some meat harms no one; and the body will otherwise
  rot by the roadside.


  (6) And I cannot see how the reasoning stops short of the body of the dog I loved
  and buried last year, or of a human body in a case made parallel by supposing the
  person died in an accident and the family consents to the body''s being used instead
  of cremated.


  (7) I am not willing to accept the conclusion in (6), but I want to keep (1): I
  think eating the eggs is fine, and I do not want to give it up. So something must
  go wrong somewhere between (1) and (6).


  I would also like to keep (2) if I can, because a view that simply inserts "except
  for our own species" or "except for animals I loved" seems like special pleading.
  Please give me a committed diagnosis rather than a survey of options. Identify the
  exact premise or step you reject, explain why that step looked secure enough to
  get me to (6), and tell me what accepting your diagnosis costs — above all, whether
  it still lets me keep (1), and if it does not, what the least costly revision of
  my view is.


