  expected utility theory is rationally mandatory, but as diagnostics: they reveal
  that certain combinations of commitments are jointly untenable — for example, cyclic
  preferences together with myopic pairwise evaluation, or cyclic preferences together
  with menu-independent choice. The conclusion that one particular member of the inconsistent
  set should be abandoned requires a further argument that the other members are non-negotiable.


