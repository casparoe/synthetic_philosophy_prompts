  different normative force. A representation theorem is an existence result; it does
  not by itself say that preferences ought to satisfy the axioms. To get a normative
  conclusion one needs a bridge premise such as ''a rational agent''s preferences
  must be representable in the relevant way,'' and that premise is seldom stated,
  let alone defended.


