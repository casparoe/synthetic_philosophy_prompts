  that an agent is vulnerable to being made worse off by her own lights; it does not
  by itself show that her preferences are irrational. Closing that gap requires something
  like a principle that a rational agent must be immune to foreseeable self-exploitation,
  together with an agglomeration principle to the effect that if each trade in a sequence
  is acceptable, then the package is acceptable. The agglomeration principle is not
  trivial; there are familiar cases in which a sequence of individually permissible
  acts yields an impermissible or unacceptable outcome. I want to press on whether
  this agglomeration step can be defended in the decision-theoretic setting without
  already assuming the coherence notion that is at issue.


