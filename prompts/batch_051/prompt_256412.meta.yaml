  two different enterprises. Representation theorems of the von Neumann–Morgenstern
  or Savage sort show that if an agent''s preferences satisfy certain axioms, then
  there exists a probability function and a utility function such that the agent''s
  choices maximize expected utility. Exploitability arguments — Dutch book arguments
  and money-pump arguments — show that if an agent violates certain axioms, there
  is a sequence of trades or bets, each acceptable to the agent by her own lights,
  whose combined effect is a sure loss or leaves her worse off by her own lights.


