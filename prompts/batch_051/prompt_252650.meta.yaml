  ---


  I write about science and religion for a general-interest outlet, and for the past
  several months I have been reporting a feature on the theological implications of
  evolutionary history. The provisional position I have settled on after my interviews
  is this: the doctrine that the natural world is the good creation of a good God
  is in serious, perhaps fatal, trouble because the machinery that produced every
  living species — predation, parasitism, disease, and mass extinction — operated
  for hundreds of millions of years before any human being, and therefore before any
  human fall, existed. I am not asking about the problem of evil in general or about
  human suffering; my claim is specifically about the chronology of the record. The
  goodness of creation is traditionally supposed to explain why the world is not merely
  a fortunate accident, yet the evolutionary record looks less like a good order that
  later went wrong than like a process in which pain and death were part of the design
  from the start.


  What I want from you is a map of what would have to be true for that position to
  be wrong. Candidate escape routes I have already encountered include: that nonhuman
  animal suffering is not conscious enough to count morally; that animal pain is instrumentally
  necessary for goods of such magnitude that a good God could will them; that the
  Fall was a cosmic or angelic event whose consequences somehow reached backward in
  time; that the doctrine of a good creation was never a claim about the historical
