  Copycat/legal analogy mapping:

  - Microdomain: letter strings; concepts as fluid, context-sensitive; slippage: changing
  the boundary of a concept under pressure from the target domain (e.g., "successor"
  becomes "previous" if the puzzle demands; "leftmost" becomes "rightmost"). The program''s
  "temperature" controls how far to slip.

  - Legal analogy: rules expressed in terms of categories ("vehicle," "dwelling,"
  "reasonable") applied to novel facts; courts extend/contract category boundaries
  under pressure of policy and analogy; stare decisis but also distinguishing.

  - Parallel: both are mechanisms for extending an old schema to a new case by locally
  distorting concepts rather than applying a fixed rule; both trade fidelity to the
  letter against fit to the whole pattern; both risk "slippery slope" / runaway slippage.

  - Where they might break: Copycat''s slippage is unsupervised and evaluated only
  by analogy quality; law''s slippage is constrained by normative sources (text, precedent,
  intent), by authoritative hierarchy, and by values like predictability/legitimacy;
  legal concepts don''t have a single "correct" answer in the way Copycat puzzles
  do; Copycat has no adversarial constraint like legislative intent or constitutional
  structure. Also Copycat''s temperature is a free parameter, law has more principled
  stopping rules. Perhaps the analogy predicts that legal reasoning could be modeled
  as annealing search, and that "distinguishing" is like pressure-based slippage;
  but it predicts courts would sometimes make letter-perfect but semantically wrong
  analogies when "temperature" is high, which legal norms deliberately block.


