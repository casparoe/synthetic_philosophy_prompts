  "I keep noticing what looks like the same mechanism in two places that never get
  discussed together, and I can''t tell whether the resemblance is structural or just
  vivid.


  On one side: Douglas Hofstadter''s Copycat program solves letter-string analogy
  puzzles by treating concepts not as fixed definitions but as fluid ones that can
  ''slip'' under pressure—for example, in ''abc : abd :: kji : ?'', the concept of
  ''successor'' can slip to ''predecessor,'' and the category ''leftmost letter''
  can slip to ''rightmost letter,'' because the overall analogy between the two pairs
  demands it. The program runs at a kind of temperature: it considers only mild, local
  distortions until a strong analogy pushes it toward more drastic ones.


  On the other side: common-law judges extend rules to new facts by doing something
  that looks similar. A rule like ''no vehicles in the park'' gets applied to an ambulance,
  a bicycle, or a war memorial on a trailer, and the concept ''vehicle'' quietly changes
  its boundaries—not by arbitrary fiat but under pressure from the whole pattern:
  the purpose of the rule, the consequences, the analogy to prior cases, the need
  to keep the legal category coherent. Judges call this ''distinguishing'' or ''following
  the spirit rather than the letter,'' but the operation looks like concept-slippage:
  a category deforms locally while the system tries to preserve the best overall fit
  between rule and case.


