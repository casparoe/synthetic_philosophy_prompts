  Montaigne/reversal test mapping:

  - Reversal test: to detect status quo bias in evaluating a change, imagine the change
  were already the norm and the status quo were proposed as the intervention; if your
  reasons for rejecting the change would also lead you to reject the status quo, your
  objection is bias, not a real objection.

  - Montaigne in "Of Cannibals": the French see Brazilian Tupi cannibalism as barbarous;
  Montaigne reverses the frame: the Brazilians, if they saw French practices (torturing
  live heretics, inequality, miserliness?), would call those barbarous. So the pejorative
  "barbarous" is applied by each side to the other''s contrasting customs.

  - Parallel: both are debiasing operations that run the evaluative predicate in reverse
  to reveal that the objection tracks position, not the property. Both proceed by
  hold the standard fixed, swap the position of the evaluator. Both attempt to produce
  symmetry in judgment.

  - Where break: the reversal test is designed for diachronic status quo bias under
  uncertainty about future states; Montaigne''s is synchronic cross-cultural asymmetry.
  The reversal test requires holding the individual''s values fixed and comparing
  two possible states; Montaigne compares two actual communities with different values,
  so the symmetry doesn''t establish relativism—at most a standoff between rival judge-standards,
  or that "barbarous" is applied inconsistently within the French judge''s own lights?
  Actually Montaigne wants a substantive claim: the cannibals are closer to nature;
  he doesn''t settle for standoff—he ranks European cruelty as worse (burning alive
  > eating dead). So Montaigne isn''t just doing a bias check; he''s making a positive
  normative claim based on a comparison he selects. The reversal test is topic-neutral
  and symmetric; Montaigne''s inversion is not—it imports a standard (natural vs.
  artificial, cruelty to the living vs. the dead), and the choice of which cross-cultural
  comparison to draw is itself normative, not a neutral debiasing. So the analogy
  is partially good but breaks because Montaigne doesn''t merely reverse; he substitutes
  a new standard. Also the reversal test assumes stability of preferences; Montaigne
  is questioning the preference for one''s own customs entirely.


