  ---


  I''m a statistician by training — I build hierarchical models, think in terms of
  DAGs, d-separation, exchangeability, posterior shrinkage, that kind of thing. I
  keep hearing philosophers and some scientists defend what they call a presumption
  of independence: when you''re doing a back-of-the-envelope estimate and you multiply
  together a bunch of separately estimated factors (fraction of stars with planets,
  times fraction of those where life emerges, times...), you''re entitled to treat
  the factors as independent unless you have specific evidence they''re coupled. The
  idea being that independence is the neutral, no-information default.


  I gather some people push back hard on this and say independence isn''t the absence
  of an assumption at all — its an extremely strong, almost-never-exactly-true structural
  claim, and being ignorant of a coupling between factors doesn''t license setting
  that coupling to zero. And maybe there''s a subtler back-and-forth under that: if
  you fix the marginals, multiplying them is the maximum-entropy joint, which sounds
  like a principled "least additional information" choice, but you don''t actually
  know the marginals, and max-entropy can still make sharp, weird predictions about
  functions of the factors.


  I''d like you to restate this whole dispute — the pro-presumption position, the
  anti position, and where the real disagreement is — in the vocabulary I actually
  think in: factorizations, missing edges, exchangeability, priors over dependence
  structure, entropy, all of it. Please be faithful; don''t just translate the thing
  into "the pro side leaves edges out of the graph" and declare victory. Then give
  me a residue report: which parts map cleanly, which parts had to be fudged to fit,
  and which parts have no expression at all in my vocabulary. For the residue, tell
  me whether you think it''s my vocabulary that''s missing something, or whether the
  original dispute was just less precise than it looks. I want to know if my instinct
  — that "no information about dependence" isn''t a thing you can represent with a
  distribution — is actually right, or if I''m the one smuggling in a modeling stance
  and calling it neutrality.


