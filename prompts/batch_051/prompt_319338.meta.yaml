  Paragraph 1: I’ve been returning to the old question of how sounds can be sad, not
  because I expect aesthetics to become a high-status rationalist topic, but because
  it seems like a clean example of a debate where both sides have stopped moving.
  I was rereading Eduard Hanslick’s On the Musically Beautiful (1854), specifically
  the passage near the beginning of Chapter II where he grants that music can reproduce
  the motion of a psychic process—its quickening, slowing, rising, falling, intensifying—but
  denies that music can represent the specific content or object of any feeling. If
  I remember the argument correctly, he allows that music has a dynamic that resembles
  the dynamic of an emotional life, and he takes that resemblance to explain why listeners
  describe music with emotion words, while insisting that the feeling itself is not
  a property of the sounds or their musical content. That passage strikes me as much
  stronger than either side in modern debates usually gives it credit for, and also
  oddly less decisive than his followers think.


  Paragraph 2: My question is diagnostic, not adjudicatory. Radiating outward from
  this passage, we have at least these positions: (a) musical sadness is a property
  of the musical surface, perhaps because the music literally possesses the contour,
  tempo, and dynamics of sad behavior; (b) musical sadness is a projected/personified
  sadness that listeners experience through mimicry or contagion; and (c) "sad" is
  just a misleading name for a non-evaluative sonic property that has no more to do
  with human sadness than a drooping willow does. These positions have been around
  in recognizable form since at least Hanslick’s time, and yet the debate seems to
  have settled almost nothing. I’d like a diagnosis of what kind of disagreement this
  really is. Is it partly verbal, turning on senses of "express" or "sad"? Is it a
  dispute about which cases are treated as data—e.g., whether the sadness of a minor-key
  piece should be treated as a perception or an emotional contagion? Is there a hidden
  empirical question (say, about cross-cultural recognition or congenital amusia)
  that could move one side? Or are the sides answering different questions under one
  heading: one about music-theoretic properties, one about listener psychology, one
  about aesthetic normativity? If there is a path to progress, what would a concrete
  experiment, formal result, or conceptual distinction have to show, and which side
  would have to update on what result? I’d also like to know whether Hanslick’s motion-content
  distinction is itself part of the problem—that is, whether it is a crux that has
  survived for the wrong reasons.


