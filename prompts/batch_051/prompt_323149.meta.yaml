  The debate is about whether scientific discoveries are, in some important sense,
  inevitable. The usual evidence is that major breakthroughs often happen more than
  once, independently and around the same time: Newton and Leibniz both invented calculus
  in the late 17th century, and Darwin and Wallace both arrived at natural selection
  in the mid-19th century. From this, some people conclude that the individual discoverer
  matters less than we like to think: by the time a problem is "ripe," the surrounding
  state of a field — prior results, available tools, shared assumptions, outstanding
  questions — makes the next step close to determined, and if one person hadn''t taken
  it, someone else shortly would have. Others resist this: they say the fact that
  two people both got there doesn''t erase what each particular person contributed,
  and that priority — who actually got there first and how — still matters, both intellectually
  and for credit.


  I want you to act as a professional philosopher of science who also genuinely understands
  version control. Please restate this debate in the vocabulary of git: map researchers
  to developers, discoveries to commits, simultaneous independent discovery to two
  branches committing equivalent work, and the "ripeness" or inevitability argument
  to something about the state of the repository making certain commits natural or
  nearly forced. Be systematic and keep the translation honest; don''t stretch terms
  until they mean whatever you need them to mean.


  Then give a residue report. Specifically: which claims in the inevitability debate
  translate cleanly into git''s model of concurrent work and authorship, which translate
  only with distortion, and which have no counterpart at all in version control? Is
  there anything philosophically important on either side that the git vocabulary
  cannot express — and if so, is that because the git vocabulary is too thin, or because
  those parts of the debate were actually built on something other than the facts
  about who commits what when? I''d like you to begin by brainstorming the translations
  before settling on the one you use, and to think carefully about the difference
  between a metaphor that illuminates and a metaphor that quietly decides the question.


