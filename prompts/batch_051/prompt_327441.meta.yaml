  Let me inventory objections to Basic Argument.


  Strawson''s Basic Argument:

  1. Nothing can be causa sui.

  2. To be truly morally responsible for one''s actions, one must be truly responsible
  for the way one is, at least in certain crucial mental respects.

  3. To be truly responsible for the way one is, one must have brought it about that
  one is the way one is.

  4. Bringing something about requires an intention or mental action, which itself
  requires having a nature... So to be responsible for way one is, one must have chosen
  it, but choosing requires already being a certain way. Infinite regress.

  Conclusion: ultimate moral responsibility impossible.


  Objections in literature:

  - Compatibilist rejection of "true/ultimate" responsibility requirement: responsibility
  doesn''t require being the cause of oneself; it''s about responsiveness to reasons,
  reactive attitudes, etc. (Frankfurt, Watson, Fischer). Strawson says compatibilists
  redefine responsibility. This is a major response.

  - Libertarian/agent-causal response: we can be ultimate originators through agent-causal
  power; not caused by character. Strawson replies that an undetermined act is random/chancy
  and cannot ground responsibility; also agent-causal regress: did you choose to have
  agent-causal power? etc. So agent-causal libertarianism as an objection.

  - "Self-creation through actions" / character planning: you make yourself over time
