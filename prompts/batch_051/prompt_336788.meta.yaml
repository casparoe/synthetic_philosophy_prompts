  what Hempel calls the equivalence condition: if two statements are logically equivalent,
  any evidence that confirms one confirms the other. Hempel then constructs a line
  of reasoning that I find troubling because it seems to prove too much. Reconstructed
  in my own terms, it runs as follows.


  (1) By Nicod’s criterion, the generalization All non-black things are non-ravens
  is confirmed by the observation of a non-black thing that is also a non-raven, such
  as a white shoe.

  (2) The generalization All ravens are black is logically equivalent to All non-black
  things are non-ravens.

  (3) By the equivalence condition, whatever confirms All non-black things are non-ravens
  confirms All ravens are black.

  (4) Therefore, a white shoe confirms All ravens are black.

