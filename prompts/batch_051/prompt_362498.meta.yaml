  Draft:


  "I''m working on a paper for my jurisprudence seminar and I''ve been trying to turn
  Devlin''s argument in The Enforcement of Morals into a set of workable criteria
  for when a society may use the criminal law to enforce morality. My professor gave
  us the lecture and Hart''s reply, and I keep getting stuck on a case. The part of
  Devlin I keep circling is where he argues that a society is held together by a shared
  moral code, and that the criminal law can be used to defend that shared code in
  much the same way it defends the state against treason — because both are attacks
  on what makes the society a society. So here are the criteria I distilled:


  1. The conduct would provoke intolerance, indignation, or disgust in the ordinary
  reasonable person, not just in moralists with a theory.

  2. The moral norm being violated is one whose erosion would threaten the society''s
  cohesion.

  3. Criminalizing the conduct would actually help shore up that shared norm.

  4. The conduct isn''t something society has already implicitly agreed to leave to
  private judgment.


  Now the borderline case. Suppose there''s an organization, call it ''Exit Morality,''
  that recruits consenting adults to sign a mutual compact saying that, among themselves,
  they will treat promises, truth-telling, gratitude, and other moral obligations
  as optional conventions they can abandon whenever it suits them. They run public
  forums arguing that moral obligation is an illusion, and they publish a newsletter
  defending the view that no one owes anyone anything. They don''t defraud outsiders,
  they pay their bills, and their members hold jobs including a few public-school
  teachers. A solid majority of the public, if polled, reports deep disgust at the
  group, and many say it shouldn''t be allowed to exist. The group''s defenders say
  it''s just speech plus private association.


  My question: under the four criteria, does this qualify as the kind of ''attack
  on shared morality'' that Devlin thinks the law may suppress? Or does the case show
  that criterion 2 collapses into criterion 1 — that we can''t tell whether a moral
  norm''s erosion threatens cohesion except by consulting the very disgust that''s
  already doing the work? I don''t want an essay defending Hart or Devlin — I want
  a close application of the criteria, criterion by criterion, and then a verdict
  on whether the criteria themselves need to be revised."


