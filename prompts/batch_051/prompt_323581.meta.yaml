  the sorrow is not a price I pay for some separate pleasure, and it is not a mistake
  or an illusion. If the sorrow were surgically removed from the experience — if the
  work made me feel everything else but not that — the experience would be worse,
  not better, and I would not count the loss as a saving of a cost. The pain seems
  to be part of what I value, and I choose the work at least partly because it will
  hurt.


