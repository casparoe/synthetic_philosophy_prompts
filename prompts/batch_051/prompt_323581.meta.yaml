  ---

  I want you to assess a borderline case against an explicit set of criteria, criterion
  by criterion.


  Suppose we say that something counts as a body only if it satisfies all four of
  the following: (a) it has a determinate spatial location and bounded extension;
  (b) it has a characteristic set of sensible qualities—colour, texture, temperature,
  mass—by which competent observers can identify it as the same body over time; (c)
  its parts are arranged in a characteristic three-dimensional structure; and (d)
  it changes and persists in the continuous way characteristic of ordinary material
  objects, so that it cannot be wholly generated or wholly corrupted in an instant.
  These criteria are meant to capture our ordinary dealings with corpses, statues,
  bread, and human beings.


  Now consider the consecrated host as described by a certain theology. According
  to this description, after a particular act of consecration the whole substance
  of what was bread is converted into the substance of a particular human body; what
  was bread ceases to be bread, but every sensible quality and measurable property
  of the object remains exactly as it was, down to its texture, taste, and mass. What
  is present is this body whole and entire, not a cut-off part, and it is said to
  be present not after the manner of an extended body in a place but after the manner
  of a substance—whole in the whole object and whole in each of its parts. The body
  is not there only as a meaning or a memory, and the claim is meant literally.


  Does the consecrated host, so described, qualify as a body under the four criteria?
  Take each criterion in turn, and distinguish carefully between (i) ''no or unclear
  according to the criteria as written'', (ii) ''yes or no as a matter of the actual
  character of the case'', and (iii) any point at which the criteria simply have nothing
  more to say. Where the criteria return a negative or an indeterminate result, say
  whether that is a defect in the criteria, a tension in the case, or both. Finally,
  tell me whether the case shows that the criteria need to be revised—and if so, how,
  without simply gerrymandering them to include the host.


