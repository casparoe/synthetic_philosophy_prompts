  utility is answering a question I didn''t ask — it''s averaging over parallel universes
  instead of giving me a policy for one life?"


  The character is a committed expected utility theorist (unnamed). They might respond:
  "You ran a simulation of a single strategy repeated many times; you''ve discovered
  that the arithmetic mean isn''t the median. But expected-utility theory never told
  you to maximize expected wealth across repeated gambles without regard to risk.
  If you''re risk-averse, that has to be in the utility function. A concave utility
  function already makes you not take the strategy, or take less. So the ergodicity
  critique targets expected-value maximization, not expected utility — choosing to
  maximize average log wealth *is* maximizing expected utility with log utility. The
  time-average argument is a way of deriving which utility function you implicitly
  have, not a replacement for expected utility."


