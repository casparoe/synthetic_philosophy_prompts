  Epistemic utility theory basics:

  - An inaccuracy measure (scoring rule) 𝔍 assigns to a credence function c and a
  world w a non-negative real number measuring the inaccuracy of c at w.

  - For a credence function c over a partition, the expected inaccuracy of c'' by
  the lights of c: Exp_𝔍(c'' | c) = Σ_w c(w) 𝔍(c'', w).

  - A scoring rule is proper if for all c, c minimizes expected inaccuracy by its
  own lights: Exp(c | c) ≤ Exp(c'' | c) for all c''. Strictly proper if c is the unique
  minimizer.

  - Brier score: 𝔅(c,w) = Σ_X (c(X) - v_w(X))² where v_w(X)=1 if X true in w, else
  0. Strictly proper.

  - The dominance argument for Probabilism (from Joyce, Predd et al., Pettigrew):
  If an inaccuracy measure satisfies certain conditions (e.g., additive, continuous,
  strictly proper), then for any non-probabilistic credence function, there is some
  probabilistic credence function that is closer to truth in every world — i.e., dominates
  it. Since a rational credence should not be accuracy-dominated, credences should
  be probabilities. Key: not every accuracy measure works; the measure must be strictly
  proper and truth-directed (the dominance premise).

  - The expected-accuracy argument for Conditionalization (Greaves & Wallace): If
  your prior is p and you update by some rule R, conditionalization minimizes expected
  inaccuracy by the lights of p among rules... Actually: updating by conditionalization
  maximizes expected accuracy; more precisely, conditionalization uniquely maximizes
  expected accuracy relative to a strictly proper scoring rule among update plans,
  so it''s rational. Hmm, the argument is that the conditionalization plan is the
  only plan that is... Let me recall: Greaves and Wallace show that conditionalization
  is the update rule that maximizes expected accuracy, measured by a strictly proper
  scoring rule, relative to the prior. The plan that uses Bayes rule has higher expected
  accuracy than any other plan.


