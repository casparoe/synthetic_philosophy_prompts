  Prompt:


  "I keep getting asked to design short courses for our company''s internal learning
  platform, mostly for working engineers who need to pick up a skill fast (like reading
  a schema, or the basics of a regulatory domain). I''ve been rereading Whitehead''s
  The Aims of Education, and the bit in ''The Rhythm of Education'' where he describes
  the cycle of romance, precision, and generalisation keeps feeling like it should
  cash out into an actual design procedure, not just a vibe. So what I want is something
  like a checklist or flow I can run when I sit down with a proposed course: what
  questions do I ask about the material and the learners, in what order, to decide
  whether the romance stage is even possible? What counts as a real romance stage
  vs ''teacher does a fun demo''? How do I know when the precision stage is too early
  or too late, and what does the generalization stage look like for a 4-week professional
  course? You don''t need to argue for Whitehead''s view; take it as given and operationalize
  it. Then run it on two proposals: a 4-week course called ''Intro to SQL for people
  who have never coded'' and a 4-week course called ''Negotiation for engineers.''
  I''d honestly like to see a case where the procedure tells me not to run the course
  or to restructure it in a way the SME will hate. Be concrete about the indicators
  I''d look for."


