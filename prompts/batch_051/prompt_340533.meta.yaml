  Fitch''s paradox: Assume all truths are knowable: p → ◇Kp (knowability). Suppose
  some truth is unknown: q ∧ ¬Kq. By knowability, ◇K(q ∧ ¬Kq). In modal logic, K(p
  ∧ q) → (Kp ∧ Kq) (distribution). So K(q ∧ ¬Kq) implies Kq ∧ K¬Kq. Distributivity
  gives Kq ∧ K¬Kq. Factivity of K: K¬Kq → ¬Kq. So Kq ∧ ¬Kq, contradiction. Thus, if
  knowability holds, there is no unknown truth: q → Kq (all truths are known). This
  is correct.


