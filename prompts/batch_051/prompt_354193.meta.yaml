  assertion itself strikes me as acceptable. The contrast with the lottery case disturbs
  me, because both speakers were going well beyond what they could be certain of.
  Why does rampaging probability let my friend off in the weather case and not the
  lottery case? Maybe because the weather evidence is genuinely diagnostic of tomorrow''s
  outcome while the lottery odds are not diagnostic of one''s own ticket, but I cannot
  state that distinction in a way that does not feel like hand-waving.


