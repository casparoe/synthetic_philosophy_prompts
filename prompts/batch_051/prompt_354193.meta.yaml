  flat out, "It''s the alternator." My verdict: this is fine. Now imagine an oncologist
  with structurally identical evidence — tests that jointly indicate a serious disease
  with 99.7 percent probability, with a definitive biopsy scheduled for the next day.
  She tells the patient flat out, "You have the disease." My verdict: this is not
  fine; she should say the tests strongly indicate the disease until the diagnosis
  is settled. I end up with two judgments that differ only because the stakes differ,
  and I am not sure I can defend a formulation of the underlying principle that gives
  the stakes that much power.


