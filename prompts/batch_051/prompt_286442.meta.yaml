  ---


  I am trying to get clear about what I actually believe about the Daoist notion of
  wu-wei — roughly, effortless or non-forced action — and I have found that I hold
  five separate claims that I am not sure are jointly tenable. I would like an audit
  of the set rather than a lecture on the topic. The five, as best I can state them:


  (1) The phenomenon is real. Skilled performers — an improvising jazz musician, a
  driver merging into heavy traffic, an experienced lecturer in full flight — often
  describe their finest moments as ones in which the action "does itself," and I take
  this to be more than a flattering way of saying the effort happened to be low.


  (2) Wu-wei is best understood not as literal inaction but as cultivated spontaneity:
  a responsiveness that has become second nature through training, so that proper
