  ---


  I spent most of the past two months at my mother''s bedside during her third round
  of treatment, and last week two of my closest friends, Marta and Daniel, got into
  a long argument in the waiting room about what a situation like hers actually calls
  for from the people around her. Eventually they asked me to referee. I could not,
  and I have been turning it over ever since. Here is the exchange as faithfully as
  I can reconstruct it.


  Marta: "When someone is suffering the way your mother is, the only response with
  real moral worth is pity — the direct, uncalculated participation in her pain that
  moves a person to remove it. Principles, duties, the desire to act rightly: all
  of that points back at the agent. She is not served by our moral self-examination."


  Daniel: "But pity is not a pure perception of another person''s pain. It is a state
  of the pitier, and what it most immediately motivates is relief of the pitier''s
  own distress at the sight of suffering. That is why pity can be strangely intrusive:
  the help is shaped by what calms the helper down, not by what the suffering person
  needs."


  Marta: "You are describing pity gone wrong — the wallowing or the performance of
  compassion. The fact that an emotion can be corrupted does not discredit it; bad
  doctors do not discredit medicine. Genuine pity leaves no trace of the self in the
  act. It simply goes to work."


  Daniel: "But the distinction between genuine and corrupt pity is precisely what
  cannot be drawn. Everyone who pities is sure their pity is the genuine kind, and
  the alleged purity of the motive is invisible from the outside and self-serving
  from the inside. Even in the genuine case, pity freezes two people into an ugly
  hierarchy: one is the spectator and benefactor, the other is reduced to a bundle
  of need. Pity also multiplies the very thing it claims to relieve: it adds the pitier''s
  sorrow to the sufferer''s without removing the sufferer''s."


  Marta: "That arithmetic is clever and cold. The real choice in a hospital is not
  between pity and some spotless respect; it is between being moved and not being
  moved. If you teach people to distrust pity, what remains is rarely respect. It
  is discomfort, then avoidance, and then the person suffers alone. So if you want
  to reject pity, you owe an account of what still gets anyone to the bedside at all."


  Daniel: "What remains is an older, more disciplined sympathy: understanding another
  person''s situation accurately without being flooded by it, and acting out of respect
  for who she is apart from the illness. That treats her as an agent whose dignity
  survives her suffering, which pity cannot do because it sees nothing but the suffering."


