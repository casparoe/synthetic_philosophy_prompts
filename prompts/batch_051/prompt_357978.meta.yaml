  I have no formal background in philosophy of science, but I have spent a lot of
  time thinking about how whole fields change their minds, and I keep being pulled
  between two pictures. On one picture, science stays rational through a revolution
  because a theory can always be asked in advance what observations would count against
  it, and the revolution just consists in facing those observations. On the other
  picture, the old framework and the challenger do not share enough common ground
  for that in-advance test to settle things; what counts as evidence, what counts
  as an anomaly, and even what an instrument is measuring can be described differently
  from inside each framework, so a switch of allegiance often looks more like a conversion
  than an inference. (These are roughly the positions of Popper and Kuhn as I understand
  them, but you need not stick to their actual writings.)


  Suppose we run a trial over thirty years in a mature empirical field roughly the
  size and organization of geology in the mid-twentieth century. The field''s dominant
  framework has been productive but is now accumulating anomalies, and a rival framework
  is beginning to form. At the moment the anomalies start, a new rule is imposed:
  every published empirical study must include a dated "disconfirmation clause" in
