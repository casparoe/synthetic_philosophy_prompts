  The dogmatism paradox (Kripke 2011 "On Two Paradoxes of Knowledge", Harman 1973).
  The core: if S knows p, then S is justified in believing any evidence against p
  is misleading, so S may ignore it. But ignoring evidence seems epistemically irresponsible.
  Tension with closure.


  Possible commitments:


  (a) If I know a proposition, then I''m in a position to know that any evidence against
  it is misleading. (Knowledge entails being able to rule out counterevidence, via
  closure under known entailment.)


  (b) If I''m in a position to know that any evidence against p is misleading, then
  it can be rational for me to disregard such evidence (at least apparently).


  (c) We often know ordinary things (e.g., that I have hands, that my friend is in
  town) on the basis of perception/memory without first ruling out all error possibilities.


  (d) It is epistemically wrong/dogmatic to disregard relevant evidence against what
  you believe, especially when you cannot identify a flaw in it.


  (e) Knowledge is closed under known entailment.


  (f) Knowledge requires no stronger justification than the kind of justification
  ordinary perceptual/memorial beliefs enjoy.


  (g) There''s no deep inconsistency: dogmatism in epistemology and reasonable belief
  can coexist? Hmm.


