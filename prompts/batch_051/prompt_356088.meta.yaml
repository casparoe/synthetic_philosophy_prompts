  ---


  I have been asked to write a one-page "epistemic self-portrait" for a seminar on
  the dogmatism paradox, and before I circulate it I want an audit of whether the
  package I have ended up with actually hangs together. Here are the commitments I
  find myself endorsing, listed plainly and deliberately without any indication of
  how central or negotiable I take each to be:


  1. Ordinary knowledge. I know a great many mundane contingent truths on the basis
  of perception, memory, and testimony — for example, that I have hands, that today
  is Tuesday, and that a particular colleague is in her office because I saw her enter
  a few minutes ago. I treat these as genuine items of knowledge, and I do not think
  my having them depends on my first having ruled out skeptical alternatives, or on
  my being able to specify, for each way my grounds might mislead me, why it does
  not.


  2. Closure. Knowledge is closed under known entailment: if I know p, and I know
  that p entails q, then I am in a position to know q.


  3. Knowledge-based asymmetry. If I know p, then I stand in an importantly different
  relation to p than to its contraries: I am in a position to know, without examining
  the details, that any evidence against p would be misleading — because the truth
  of p entails that evidence against p points away from the truth. I am also drawn
  to the further claim that this can make it rationally permissible, at least in many
  cases, to set such counterevidence aside rather than investigate it.


  4. Anti-dogmatism. At the same time I endorse a norm of non-dogmatic inquiry: when
  I am actually presented with specific, apparently credible evidence against a belief,
  I should not dismiss it out of hand. I should either lower my confidence in the
  belief or identify a specific defect in the evidence, where the defect cannot simply
  consist in the evidence''s conflicting with what I believe.


  5. Parity of rational permission. Rational permissions should depend only on the
  subject''s perspective, not on the truth of the proposition believed. If two subjects
  are the same in everything that is accessible to them — their evidence, experiences,
  capacities, and background beliefs — then the same rational permissions apply to
  them in the face of the same new evidence, even if one of the beliefs is true and
  the other false.


  6. Higher-order evidence. Evidence against p is always also evidence that I do not
  know p. Encountering evidence against p therefore gives me a reason to reconsider
  not only p itself but also whether I ever knew it.


  I would like you to treat this list as the object of study and give me an audit
  rather than a lecture. Please (i) identify which pairs of these commitments are
  genuinely in tension and which merely appear to be, explaining briefly why the apparent
  tensions dissolve; (ii) rank the genuine tensions by severity, specifying for each
  what would have to be given up or qualified to resolve it and what that revision
  would cost; and (iii) identify the single revision that would yield the most coherent
  overall package at the lowest cost, saying exactly what that revision sacrifices.
  Do not flag every pair as equally problematic — the point is to discriminate.


