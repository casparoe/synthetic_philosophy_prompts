  Standard presentation (Kripke/Harman):

  - If I know p, and I know that q is evidence against p (or that if q then not-p?),
  then by closure I know not-q? Actually suppose I know p. And I know p entails ¬q
  (where q is some proposition that would undermine p). By closure, I know ¬q. So
  I know that q is false. Therefore, if someone presents q as evidence against p,
  I can know in advance that it is misleading/must be false — so I don''t need to
  examine it.


  Kripke''s example: I know that I have hands. If I know I have hands, then I''m in
  a position to know that anything showing I don''t have hands is misleading (e.g.,
  if presented with evidence that I don''t have hands, I know it''s misleading). Thus
  dogmatism: I can rationally refuse to consider the evidence.


  The paradox challenges evidential norms: it seems irrational to decide in advance
  not to examine evidence because you "know" it must be misleading.


