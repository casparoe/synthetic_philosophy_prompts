  ---


  I''m a journalist who covers linguistics and cognitive science, and I''ve been turning
  over a strange double standard in how we talk about writing systems. English spelling
  gets treated as a national joke: we point out that tough, through, though, and thought
  look like they should rhyme and don''t, we roll out ghoti as fish, and reformers
  have been calling the orthography broken for centuries. But nobody would say Chinese
  writing is defective, even though you cannot reliably read a Chinese character aloud
  from its shape either, and homophones like... (Chinese has many homophones) and
  thousands of characters have to be memorized. We call one system a mess and the
  other a sophisticated, even artistic system. So my question is: is there a principled
  difference that justifies this asymmetry, or is it just familiarity and a kind of
  cultural snobbery about how far a script should be allowed to drift from pronunciation?


  The tempting answer is that English uses an alphabet, so its entire job is to encode
  sounds, while Chinese characters encode meanings, so sound is beside the point.
  But I''m not sure that holds up. English spelling is full of what linguists call
  morphophonemic spellings, where letters track morphemes rather than sounds: the
  past tense marker -ed is pronounced three different ways depending on context, and
  sign keeps its silent g because of signature. Chinese characters, meanwhile, are
  mostly not pure little pictures of meanings; the vast majority have a phonetic component
  that hints at the sound and a semantic component that hints at the category. Neither
  script is a clean transcription of speech, and neither is a clean map of meaning.
  They are different theories of what a writing system should make visible.


  So here''s the prompt I''d like you to take on. Please write a careful answer to
  whether the asymmetry is defensible. What is the strongest case you can make that
  English spelling deserves more criticism than Chinese characters do, and where does
  that case break down? If you think the double standard is indefensible, say what
  a fairer view would be: should we judge every script by how well it does what it
  sets out to do, by how well it handles some language-specific tradeoff, or something
  else? And give me a hard test case: if English spelling encoded tone the way it
  encodes morphology, or if Chinese introduced a fully regular phonetic script alongside
  characters, would that change your verdict on either system?


  ---


