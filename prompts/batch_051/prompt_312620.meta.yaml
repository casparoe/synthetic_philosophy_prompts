  ---


  I''m a science journalist working on a piece about why some writing systems get
  a pass while others get mocked, and I want to think through an asymmetry that''s
  been bugging me. English spelling is treated as a national joke: people point out
  that tough, through, though, and thought look like they share a sound and don''t,
  they roll out ghoti as a joke spelling of fish, and spelling reform has been a minor
  crusade for centuries. But hardly anyone calls Chinese writing defective, even though
  you can''t reliably read a character aloud from its shape either, a single syllable
  can correspond to dozens of different characters, and literate adults have to memorize
  thousands of them. One system gets called a broken mess; the other gets called sophisticated,
  even beautiful. What I want to know is whether there''s a principled difference
  that justifies that double standard, or whether it''s mostly familiarity plus a
  bit of cultural snobbery about a script''s job.


  The obvious answer is that English uses an alphabet, so its whole job is to encode
  sounds, while Chinese characters encode meanings, so unpredictability of sound is
  just not a failure. But I''m not sure that survives contact with the facts. English
  spelling is full of cases where letters track morphemes instead of sounds: the plural
  s is read three different ways without being written differently, and sign keeps
  its silent g partly because of signature. And most Chinese characters aren''t little
  pictures of meanings anyway; the majority combine a semantic component that hints
  at the category with a phonetic component that hints at the sound. Neither script
  is a clean record of speech, and neither is a clean record of meaning. They''re
  rival theories about what a writing system should make visible, and we just happen
  to judge one by a standard we don''t apply to the other.


