  Draft:


  "A standing question in the study of language is how natural languages manage to
  remain workable despite being saturated with lexical ambiguity: the same form can
  serve for a financial institution and a river''s edge, and a word like ''pitch''
  stretches across sound, sports, tar, and a sales talk. Much of the time context,
  intonation, and shared background resolve these senses before they surface as problems;
  the interesting question is what the residual ambiguity is doing, since language
  retains it rather than engineering it away.


  Consider the following thought experiment, set today, in all languages at once.
  Every person past the age of linguistic maturity — say, sixteen — acquires a stable,
  involuntary comprehension ability with this exact scope: whenever they hear or read
  an expression with more than one established lexical sense, they reliably register
  which established sense or senses the speaker intended. If a speaker intends one
  sense of ''sanction'' or ''cleave'' (an auto-antonym), the hearer is not even momentarily
  pulled toward the unmeant sense; if a speaker deliberately aims for two senses at
  once, as in a pun, the hearer registers exactly those two. The ability is silent
  otherwise: it does not reveal speaker meaning beyond the chosen words, so irony,
  insinuation, and implicature are unaffected; it does not apply to child learners,
  who remain as before; it does not extend to structural ambiguity, indexicals, or
  one-off metaphorical extensions; and it has no effect on production. A speaker still
  has to decide, word by word, whether to choose an ambiguous form, and a recording
  or transcript remains exactly as ambiguous to anyone not present at the original
  exchange.


  My interest is in prediction, with the mechanisms made explicit. Over the next thirty
  years, what should we expect to happen to each of the following: (1) the inventory
  of ambiguous words and phrases in languages — will it shrink, grow, or stay broadly
  stable, and through which processes of language change and lexical innovation would
  whatever you predict come about; (2) the way speakers and writers exploit, avoid,
  or engineer ambiguity during the act of communication itself, given that the listener''s
  comprehension burden has dropped to zero but the third party''s and the record''s
  have not; and (3) social practices that presently trade on lexical ambiguity — stand-up
  and written humor, diplomatic and corporate evasion, advertising and political speech,
  and the face-saving indirection common in flirtation and between acquaintances.
  Throughout, separate the predictions that follow nearly unavoidably from the stated
  change from those that depend on contestable assumptions about speakers'' and hearers''
  competing incentives; and where your prediction would fail if one of those assumptions
  were false, say so explicitly."


