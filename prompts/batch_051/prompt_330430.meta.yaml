  Prompt:


  I have been seeing a particular example do a lot of work in discussions of institutional
  reform, and I would like a careful audit of whether it can bear the weight people
  put on it.


  The example is the so-called Chesterton''s fence. As I have seen it presented in
  rationalist circles, it runs roughly like this: a reformer comes across a fence
  or gate standing across a road on an estate and, seeing no use for it, proposes
  to clear it away. The conservative reply is that he should not be permitted to remove
  the fence until he can say why it was put there in the first place; the fact that
  he personally cannot see a reason is not evidence that no reason exists, and the
  fence may reflect the accumulated trial-and-error wisdom of people who are not present
  to explain themselves. In the broader form I encounter, this becomes a general principle:
  when an existing institution, practice, or rule strikes you as pointless or burdensome,
  your failure to reconstruct its original rationale is not an argument for removing
  it, and the burden of proof falls on the would-be reformer.


  People I read deploy this example to support several claims at once: (1) a weak
  methodological precept, that one should investigate before removing; (2) a stronger
  epistemic claim, that the very survival of an arrangement is some evidence that
  it was useful to someone and perhaps to the whole; and (3) sometimes a still stronger,
  nearly Burkean conclusion, that there should be a default against redesigning long-standing
  social institutions and that the inability of ordinary participants to state the
  rationale for a practice is no significant objection to it.


