  I spend a fair amount of time in rationalist and adjacent circles, and I have noticed
  the same example doing a large amount of work in arguments about whether to reform
  or remove existing institutions, rules, and practices. I would like a careful audit
  of whether it can carry the weight people put on it.


  The example is usually called Chesterton''s fence. As it is presented there, it
  runs roughly like this. A reformer comes across a fence or gate standing across
  a road and, seeing no use for it, proposes to clear it away. A more conservative
  interlocutor replies that the reformer should not remove it until he can say why
  it was put there in the first place; his inability to see a reason is not evidence
  that no reason exists, and the fence may encode some purpose or accumulated practical
  knowledge that is not currently legible to him. In its generalized form, the example
  becomes a principle: when an existing institution, rule, or practice looks pointless
  or burdensome to you, the fact that you cannot reconstruct its original rationale
  is no argument for removing it; investigate first, and leave the burden of proof
  on the would-be reformer.


  In the places I read, this example is made to support several different conclusions
  at once: (1) a weak methodological precept, that one should learn what a thing was
  for before destroying it; (2) a stronger epistemic claim, that the bare survival
  of an arrangement is some evidence that it has been useful, at least to someone,
  and perhaps that it still serves people as a whole; and (3) a still stronger, Burkean
  conclusion, that there should be a standing default against redesigning long-lasting
  social institutions, and that ordinary participants'' inability to state a rationale
  for a practice is no significant objection to it.


  I want to know how far the analogy actually holds. Please give me an explicit mapping:
  what corresponds to what? What are the social-world analogues of the fence, the
  road, the reformer, the person who originally erected the fence, the original reason
  for it, the cost of leaving it in place, the act of removing it, and the knowledge
  available to the reformer? Then separate the disanalogies that matter for the three
  conclusions above from the ones that are merely superficial. I suspect some differences
  may matter, but I am unsure how much each can bear. A fence is a discrete functional
  artifact, built by identifiable agents for an identifiable purpose; institutions
  often arise gradually without any designer, can be captured by interested actors,
  can persist through coordination problems or inertia rather than through serving
  the people subject to them, and can silently change their function while retaining
  the same outward form. The reformer in the story is a single uninformed passerby,
  whereas real reformers are sometimes accountable, have large amounts of evidence,
  and may already know the relevant history. And removing a fence is local and cheaply
  reversible, while many actual institutional changes are not. The example may also
  quietly import assumptions about who has standing to remove the fence and whose
  knowledge counts, which already presumes part of what the Burkean conclusion is
