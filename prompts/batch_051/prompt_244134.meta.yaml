  ---


  I have been turning over the problem of angelic evil in something like its medieval
  form, and I''ve landed on a position I want taken seriously but also stress-tested.
  Suppose we assume the standard setup: a wholly good creator brings into existence
  finite rational agents who are initially good, endowed with intellect and free will,
  but who lack bodies, appetites, developmental histories, and any external tempter.
  Given that, one of them falls: it prefers itself to the good it knows. My position
  is that the first evil must be understood as a bare free choice — a choice not caused
  by any prior defect, ignorance, appetite, or temptation, since ex hypothesi there
  was none — and that the possibility of such a choice is simply the cost of a created
  freedom that can love the good voluntarily rather than by necessity or automation.


  I want you to tell me what would count against this position. I don''t want a recycled
  list of standard objections; I want a map of the position''s actual exposure. What
  intuitions, possible cases, and results in neighboring areas (action theory, responsibility,
  the metaphysics of evil, divine freedom, moral psychology) does it stand or fall
  with? Specifically, I can see these pressure points but I''m unsure how damaging
  each is:


  1. Intelligibility. An absolutely first evil act, with no prior defect or attractive
  misapprehension to explain it, looks suspiciously like an unintelligible or random
  event. If it is random, the angel looks less responsible, not more. Can the defender
  give an account of a free choice that is neither caused by prior defects nor random,
  and how much does the position depend on succeeding here?


  2. The apparent-good requirement. It is usually held that the will can choose only
  under the aspect of good. But in a wholly good creation, every aspect under which
  the angel could have chosen was itself good. If the first sin consisted in choosing
  a genuine good in a disordered way, what supplied the disorder? If it consisted
  in choosing an apparent good that was entirely an illusion, where did the illusion
  come from in an unflawed intellect?


  3. What freedom costs. If free will is compatible with being so constituted that
  one always chooses the good — as with the blessed in heaven, or with God — then
  the possibility of sin is not the price of freedom; an infallibly good free will
  would have been available. If the defender instead says that created freedom necessarily
  includes the ability to fail, I want to know why a fallible but free will is more
  worth creating than an infallibly good one, and what this does to the claim that
  the first sin is compatible with the creator''s goodness.


  4. The extension from the human case. The usual free-will account of human wrongdoing
  leans on bodily appetite, habit, akrasia, ignorance, or social influence. Angelic
  evil, by stipulation, has none of these. I want to know whether the angelic case
  is really the same kind of explanation or just the same word, "freedom," pressed
  into a job it has not earned.


  For each, and for any others you think bear more weight, distinguish evidence or
  arguments that would be decisive from those that would be merely awkward. Say which
  of these a committed defender would themselves concede as counting against the position,
  and which they would dismiss as demanding something incoherent from a story about
  first causes. And be willing to conclude that the position is well insulated — but
  then say whether that insulation is a feature or a symptom of having stopped making
  contact with the hard version of the problem.


  Let me be clear about one thing: I am not asking for a bibliography, a history of
  the question, or anyone''s exegesis. What I want is the strongest honest map of
  what would undermine the position, from fatal to merely awkward.


