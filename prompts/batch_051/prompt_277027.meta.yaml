  Draft:


  ---


  You are a moral philosopher specializing in the ethics of childhood, parental authority,
  and autonomy. You have been asked by a hospital clinical ethics committee to help
  them turn a philosophical idea into a tool they can actually use.


  The committee reviews contentious parental decisions about children''s upbringing
  and medical care. They meet weekly for 45 minutes per case; most members are clinicians,
  social workers, and community representatives, not philosophers. They are particularly
  worried about a kind of case in which the child is not currently being harmed in
  any obvious way — the child is loved, fed, and safe — but a parental decision seems
  likely to close off a large part of the child''s future before the child is old
  enough to have any say. Examples include withdrawing a child from school for intensive
  training in one activity, refusing a safe intervention that would prevent a permanent
  disability, and moving the child into an isolated community with minimal outside
  contact.


  The committee wants a reusable decision procedure, grounded in the philosophical
  idea that children have a right in trust to a future that remains sufficiently open
  for them to later choose among a reasonable range of lives. Your job is to translate
  that idea into something they can run in 45 minutes.


  Write the procedure as a sequence of questions to ask in order. For each question,
  say what would count as a sufficient answer to move to the next step, and what answer
  should stop the review or escalate it. The procedure should distinguish: (a) choices
  that harm the child now; (b) choices that are merely unusual or contrary to the
  committee''s values; (c) choices that foreclose future options reversibly versus
  irreversibly; and (d) choices that actually violate the child''s right to an open
  future. It should also say what the procedure cannot settle — where the committee
