  I''m an undergraduate currently taking a course on epistemic logic, and I keep noticing
  a resemblance I can''t stop thinking about. We covered the problem of logical omniscience:
  in standard possible-worlds semantics, an agent counts as knowing every logical
  truth, and she knows all the logical consequences of what she knows. We also covered
  the usual fix attempts (awareness structures, impossible worlds, algorithmic or
  resource-bounded knowledge), which try to make the agent''s knowledge respect what
  a finite reasoner could actually derive.


  At the same time, I''m taking a jurisprudence elective, and the legal rule that
  ignorance of the law does not excuse — the law treats citizens as if they know the
  whole body of valid legal norms once it is promulgated — struck me as the same shape
  of idealization. Both set up a normative or theoretical fiction under which a subject
  is "charged" with knowing a whole class of consequences that no actual subject has
  run through. And both have the same function, it seems to me: the system remains
  tractable by imputing knowledge rather than modeling genuine ignorance.


  Now I''m trying to decide whether this is a deep structural parallel or a loose
  analogy. On one hand, the legal fiction is overtly normative: it doesn''t assert
  that citizens actually know the law, only that they are answerable as if they did.
  Logical omniscience, by contrast, is usually introduced as a descriptive idealization
  of a perfect reasoner, though some authors say it, too, is really a commitment story:
  if you know the premises, you are committed to the conclusion. On the other hand,
  maybe the legal case is exactly a resource-boundedness fix in disguise...


  Please respond as an expert in epistemic logic and legal philosophy... structure
