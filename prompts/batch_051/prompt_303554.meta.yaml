  using a potentialist/attainable utility (AU) measure? Actually "attainable utility
  preservation" is from Turner et al. (2021) "Conservative Agency via Attainable Utility
  Preservation". Armstrong & Levinstein proposed using utility functions from a set,
  penalizing deviations from expected value under a corrective term. Turner''s AUP
  penalizes reduction in the agent''s ability to achieve a range of objectives.

  - Key conceptual difficulty: any impact measure either depends on some specification
  of what matters (a set of value functions) or on a prior about the default/no-agent
  outcome, so "avoid side effects without a full specification of value" remains only
  partially solved. The measure can be gamed (Goodhart), and the "baseline" question:
  what the world would have been like without the agent.


