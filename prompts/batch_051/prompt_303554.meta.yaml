  Key ideas to include accurately:

  - Low-impact AI (LIA) aims to build agents with limited side effects: accomplish
  intended task while avoiding unnecessary changes to the rest of the world.

  - Defining "side effect" requires a baseline or notion of what the world would otherwise
  contain/value. One approach: use an impact measure or penalty on state change.

