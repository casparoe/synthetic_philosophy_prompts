  Student answer:

  "Untranslatability and indeterminacy are often run together, but they are different.
  A word like Portuguese saudade is called untranslatable because no English expression
  carries exactly the same combination of longing, melancholy, and tenderness; you
  can give a paragraph explaining it, but the compact semantic and affective content
  is lost. This is untranslatability relative to a standard of exact equivalence.


  Quine''s indeterminacy thesis is stronger. It says that the totality of behavioral
  evidence available to a radical translator — who is learning a language from scratch
  by observing speakers'' responses to environments—is compatible with many different
  translation manuals that are not mere stylistic variants. For example, an expression
  might be rendered as ''rabbit'' or as ''undetached rabbit part,'' and the behavioral
  evidence cannot decide between them. Because of this, Quine concludes there is no
  fact of the matter about which manual is correct; translation is not just lossy
  but fundamentally indeterminate. Since there is no fact of the matter about what
  an expression means, no translation of it can be said to be correct. In that sense
  every sentence is untranslatable: for any sentence, there is always a rival rendering
  the evidence equally supports, so no single rendering is the right one.


  The ethical upshot follows from both points. Because translation always involves
  loss — whether it is the affective content of saudade or the underdetermination
  of every sentence by the evidence — every act of translation imposes the translator''s
  own interpretive choices on the reader. There is no neutral way to render a text.
  Every choice therefore does violence to the source, replacing what the author wrote
  with something else. The translator''s ethical obligation is accordingly to minimize
  interpretation: to keep the original''s foreign constructions and terms visible
  rather than naturalizing them into the target language, since only foreignizing
  translation can avoid adding the translator''s own interpretation. Paraphrase is
  a betrayal; preserving foreignness is the only faithful option."


