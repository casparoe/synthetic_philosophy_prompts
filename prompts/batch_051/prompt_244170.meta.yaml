  on similarity in relevant respects, not just superficial resemblance.

  - Context and association matter more than object type in isolation: a projectile
  point in a burial vs. in a midden supports different claims.

  - Equifinality: very different past behaviors can leave very similar archaeological
  traces; conversely same behavior can leave different traces depending on conditions.

  - "Ritual" is often a residual category, applied when an object has no obvious utilitarian
  function; this is contested and can be a cop-out.

  - Direct historical approach: where there''s cultural continuity to descendent groups,
  their accounts can constrain inference, but must be used carefully (continuity isn''t
  identity, and colonial-era records are biased).

  - Middle-range theory: linking static remains to dynamic behavior via actualistic
  studies.

  - Institutions (e.g., hierarchy, communal vs household production) are harder to
  infer than subsistence; often require redundancy: multiple independent lines of
  evidence pointing the same way.

  - Negative evidence is weak: absence of evidence isn''t evidence of absence, especially
  with preservation biases (organics rot).

  - The safest claims are about behavior and formation, not beliefs; beliefs require
  an extra inferential step.


