  dreamed; there''s no occurrence in sleep to which the later report refers. He concluded
  that dreams are not experiences during sleep; the concept of dreaming derives from
  waking reports. He argued against the received view that dreaming is a mental activity/experience
  occurring during sleep.

  - Dennett in "Are dreams experiences?" (1976) proposed the cassette theory: dreams
  are memory-inserts, not experiences; the dream narrative is "loaded" into memory
  at the moment of waking (or just before), like a cassette inserted, so there''s
  nothing experienced during sleep. He later discusses that the question may be undecidable
  because the cassette theory and the "fool-around" theory (dreams are experiences)
  are empirically equivalent given memory-based reports. He also mentions "dream-work"
  or "presentation" moments.

