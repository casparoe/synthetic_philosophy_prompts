  The main positions are familiar. One side holds that all and only those whose interests
  are affected by a decision ought to have a say in it: the all-affected-interests
  criterion. A second side rejects this as unworkable, because after the fact nearly
  everyone is affected by nearly everything in some way, and before the fact we cannot
  know who will be affected; it therefore proposes instead that the demos be constituted
  by those who are subject to the binding laws and coercion of the relevant decision
  — the all-subjected or coercion criterion. A third side, resistant to both, holds
  that the boundaries of a demos are not something a theory can settle from outside;
  the demos must already exist as a historical, cultural, or national community with
  a prior claim of self-determination, so that the attempt to derive its boundaries
  from a universal principle misunderstands what a people is.


