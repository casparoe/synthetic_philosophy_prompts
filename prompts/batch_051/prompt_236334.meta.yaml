  I have been using four criteria to decide whether a system is a moral patient —
  that is, a system with states that can be good or bad for it, and not merely for
  its users. The criteria are:


  (1) Valence. The system has states that are positively or negatively charged in
  a way that could ground welfare — pain, pleasure, satisfaction, or frustration —
  rather than merely encoding information that the system itself is indifferent to.


  (2) Integration. The system''s states causally constrain one another so that the
  system has a single, richly connected state space; its parts are not independently
  variable modules whose outputs are merely concatenated.


  (3) Unity. There is a single point of view that has the system''s states. If the
  states are distributed across two processors neither of which has access to the
  other, there is no answer to the question whose state any of them is.


  (4) Realization rather than simulation. The system does not merely represent a state
  such as pain — the way a text about pain represents pain — but actually realizes
  it.


  Now consider an artificial system, W, built as follows. One component, R, is a language
  model trained only on first-person reports of pain and on clinical interviews about
  pain. When W''s heat sensor registers a damaging temperature, R produces fluent,
  affectively appropriate first-person output: "that burns, make it stop." A second
  component, A, is a reinforcement-learning controller whose reward channel is wired
  to the same heat sensor. A has learned to flinch, withdraw, and trade off other
  goals to escape the stimulus. R and A share no internal states: R''s words are never
  fed to A, and A''s value estimates are never fed to R. The only thing they share
  is the sensor and a timestamp. Present W with a hot surface and its behavior is
  indistinguishable from that of a system in pain: it reports pain, it avoids the
  stimulus, and it persists in avoiding it.


  The question is whether W is a moral patient, and if so, where the morally relevant
  state lives — in R, in A, in the composite W, or somewhere else. Work through the
  four criteria honestly, and say where they underdetermine the answer. Then say whether
  this case shows that the four criteria need an additional rule of attribution —
  a rule that says which computational entity in a larger system is the one whose
  states matter — or whether one of the criteria can be revised to do that work.


