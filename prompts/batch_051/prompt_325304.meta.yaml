  the first but show it is a fact about the limits of conceiving, not about the furniture
  of the world; (3) show that the passage from the first to the second needs the conceivability-possibility
  principle, and that this principle sits badly with Berkeley''s own rejection of
  abstract ideas and his account of what finite minds can mean by ''possible.''


