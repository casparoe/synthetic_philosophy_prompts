  Ian Hacking, "The Looping Effects of Human Kinds" (1995), "Making Up People" (1986).
  His distinction: "indifferent kinds" vs "interactive kinds." Natural kinds like
  quarks are indifferent: classifying a quark as a quark doesn''t change quarks. Human
  kinds are interactive: people classified as X may become aware of the classification
  and change their behavior, self-conception, etc., thereby changing the kind itself.
  This looping effect: classification affects the people classified; then the classification
  may need to be revised; "making up people." He uses the example of "multiple personality
  disorder" among others. Also "dynamic nominalism."


