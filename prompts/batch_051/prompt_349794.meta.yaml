  ---


  You are advising an organization that receives a large volume of unsolicited first-person
  reports of striking coincidences: two strangers who share an uncanny number of biographical
  details, a dream that appears to match the next day''s disaster, a lost object recovered
  immediately after an improbable mental request, and the like. The organization must
  allocate scarce investigative effort across reports before any corroboration has
  been done, and it wants an explicit procedure for assigning each report a prior
  evidential weight.


  A useful benchmark is the birthday paradox. In a room of only 23 people, the probability
  that some pair shares a birthday is already above one half, even though the probability
  that a particular pair shares a birthday is roughly 1 in 365. The paradox turns
  on the difference between the probability that a specified event happens to a specified
  observer and the probability that something of that general kind happens to someone
  within a large field of people, days, comparisons, and pairings.


  Here are six proposed rules for weighting a coincidence report. Rank them from most
  defensible to least defensible as guides for allocating investigative effort. For
  each rule, also give a score from 0 to 10 indicating how much weight it deserves
  in a combined allocation formula, and explain in a sentence or two why it lands
  where it does. Group rules that you consider tied, and say what additional information
  would break the tie. If some rule deserves to be discarded entirely, put it in a
  never-use tier with a brief justification.


  Rule 1. An event whose unconditional probability is below 1 in 10,000 should automatically
  receive high priority, because an event that improbable is unlikely to occur by
  chance in an ordinary lifetime.


  Rule 2. A report should be discounted in proportion to the size of the reporter''s
  opportunity field: how many people, days, comparisons, or pairings could have produced
  a match of comparable emotional force and been noticed.


  Rule 3. A report should be discounted whenever the matching pattern was settled
  after the fact, because a flexible pattern can be fitted to many past events, and
  the relevant probability is not the probability of the final match but the probability
  of some match that would have felt equally significant.


