  ---


  You are advising an organization that receives a large volume of unsolicited reports
  of striking coincidences: two strangers who share an uncanny number of biographical
  details, a dream that seems to match a next-day disaster, a lost possession recovered
  just after being prayed over, and so on. The organization must allocate scarce investigative
  effort across reports, and it wants an explicit way to assign each report a prior
  evidential weight before any interviewing or corroboration begins.


  The birthday paradox is the organizing benchmark. In a group of just 23 people the
  probability that some pair shares a birthday is already above one half, though the
  probability that a particular pair shares a birthday is roughly 1 in 365. The paradox
  rests on the distinction between the probability of a specified event happening
  to a specified observer and the probability that some event of that general kind
  happens to someone within a large field of opportunities, pairings, and dates.


  Here are six proposed rules for assigning prior evidential weight to a secondhand
  coincidence report. Rank them from most defensible to least defensible as guides
  for allocating the organization''s investigative effort, and say in a sentence or
  two why each lands where it does. Where you think two rules are close to tied, group
  them and explain what would break the tie. If any rule belongs in a worst tier,
  say so.


  1. A report whose described event has an unconditional probability below 1 in 10,000
  should automatically receive high priority, because an event that improbable is
  unlikely to occur by chance in an ordinary lifetime.


  2. A report should be discounted in proportion to the size of the reporter''s opportunity
  field: how many people, days, comparisons, or pairings could have produced a match
  of comparable emotional force and been noticed.


  3. A report should be discounted when the pattern was fixed after the fact, since
  a flexible pattern can be made to fit many past events and the effective probability
  is not the probability of the finally chosen match.


  4. A report should receive significant weight when it comes from a sober, motivated,
  and apparently honest witness whose testimony you have no independent reason to
  distrust, almost regardless of the event''s base rate.


  5. A report should be converted into a population-level probability: how likely
  is it that something at least this striking would have been noticed and reported
  by anyone in the relevant population within the relevant time window? Only if that
  probability remains low should the report advance.


  6. A report should start from a near-even prior over the main explanatory templates
  — chance, hidden common cause, selective memory and reporting, fabrication — and
  be moved only as much as the specificity of the report and the independence of the
  witness justify.


  Finally, state in one sentence what you take to be the single largest error an analyst
  who studies such reports can make when moving from an anecdote to a conclusion.


  ---


