  it compiles — the same optimizer serves arbitrary programs; and optimizers share
  the same transformations (constant folding, dead code elimination) regardless of
  the program''s semantics. Instrumental convergence ≈ optimizations that are "always
  safe" / benefit most programs. The asker''s question: is this a deep structural
  identity (intelligence is to goals as an optimizer is to source programs) or superficial?
