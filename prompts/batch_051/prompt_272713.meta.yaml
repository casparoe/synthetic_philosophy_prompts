  Unilateralist''s curse: a situation where a group of agents face a choice where
  any single member can unilaterally bring about some action, and they each have private
  information about whether the action is a good idea. If there''s disagreement, someone
  might act, and the group can''t pool information. The curse: if someone wrongly
  believes it''s a good idea, they''ll act; the action happens even though the majority
  would oppose it. It''s about conformity and information aggregation; proposed remedy:
  principle of conformity — don''t act unilaterally unless it would be acceptable
  if everyone with same info did it, etc.


