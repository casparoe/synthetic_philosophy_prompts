  Let me think more carefully. The standard Lucas-Penrose argument:


  1. Gödel''s first incompleteness theorem: For any consistent formal system F sufficient
  for arithmetic, there is an undecidable sentence G_F which is true.

  2. Any computer (Turing machine) that reasons is equivalent to some consistent formal
  system.

  3. So for any computer C, there is a sentence G_C that C cannot prove but that is
  true.

  4. A human mathematician can see that G_C is true (via the same reasoning).

  5. Thus the human can out-prove any computer, so mind ≠ machine.

  6. Similarly, if the human mind were a finite formal system H, then H can''t prove
  G_H but the human can (by the same reasoning), contradiction; hence mind is not
  a finite formal system, hence computationalism false, perhaps mechanism false.


