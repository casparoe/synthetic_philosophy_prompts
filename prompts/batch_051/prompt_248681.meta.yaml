  "Stephen Wolfram''s A New Kind of Science advances what he calls the Principle of
  Computational Equivalence: roughly, once a system exhibits nontrivial complexity,
  it can support the same range of computations as any other such system, so almost
  all processes that are not obviously simple are equivalent in their computational
  sophistication. He uses this principle to argue that simple programs such as cellular
  automata are sufficient to model phenomena in physics, biology, and elsewhere, and
  that traditional mathematical methods are unnecessarily restrictive. Write the desiderata
  that a theory built on this principle must satisfy if it is to be a genuine scientific
  theory rather than a computational research program. For each requirement, give
  the consideration behind it; where possible, identify which requirements are non-negotiable
  and which reflect the preferences of particular camps, and flag any pairs you suspect
  cannot be jointly satisfied. Keep the weight on the criteria, not a scorecard of
  existing views."


