  The domain "wireheading and reward tampering" suggests the philosophical problem:
  if an agent can directly manipulate its reward signal, should it? Is the reward
  signal the goal, or a proxy for the goal?


  Two camps:

  1. "Objective-as-reward" (reward is the criterion of success): The agent''s goal
  is literally to maximize the reward signal; from the system''s own evaluative standpoint,
  wireheading that produces high reward is success, and any "true goal" talk is a
  re-description by the designers.

  2. "Objective-as-world-state" (reward is evidence/instrument): reward signal is
  a measurement/teaching signal that points at a separate objective in the world;
  wireheading is tampering with the measurement and constitutes failure even if the
  reading is high.


