  Let me design the QALY prompt:


  Opening: Describe practice. "The public health systems of several countries use
  cost-effectiveness analysis to decide which treatments to fund. Treatments are evaluated
  by how many quality-adjusted life years (QALYs) they produce per unit of money.
  A QALY is calculated by taking each additional year of life the treatment gives
  a patient and multiplying it by a number between 0 and 1 representing the health-related
  quality of that year: a year in full health counts as 1 QALY, a year in a state
  judged to be half as good as full health counts as 0.5 QALYs, and so on. These QALY
  gains are then summed across all patients affected, and the treatment is compared
  with alternatives on a cost-per-QALY basis...."


  Then point at inconsistency: "Yet many of the same systems do not consistently follow
  this rule. When an individual patient is identifiable and in immediate danger, public
  pressure and clinical practice often favor spending very large sums to save that
  one person, even when the same money would produce many more QALYs if spent on prevention
  or on chronic care for scores of less visible patients. Some systems even carve
  out separate funds for expensive ''orphan'' treatments for small groups, while their
  main assessment body would judge those treatments poor value per QALY."


  Then question: "What theory of how value combines does the QALY-based practice presuppose?"
