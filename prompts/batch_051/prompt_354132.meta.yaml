  theories that pain content includes badness, because asymbolics have pain without
  evaluative content? But there are interpretations. We don''t want inaccurate. If
  we write prompt from no academic background, we can present a common interpretation:
  "Some take it to show that the pain sensation and the dislike/desire to stop are
  separate; the badness must be in the latter. Others say the condition shows only
