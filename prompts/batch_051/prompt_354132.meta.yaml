  have been (because they wouldn''t have existed). Impersonal view: outcomes can be
  worse even if no particular person is worse off; we should choose the policy with
  higher quality of life for whichever people exist, or maximize total/ average. There
  are complications: "same number quality" vs "different number". The crux could be
  whether "better for" requires a comparison to a possible alternative life for the
  same individual. Other crux: whether a future person born with a difficult but worthwhile
