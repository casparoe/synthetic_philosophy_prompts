  Setting: a friend''s house, someone defends the axiom "your preferences should be
  transitive" by a money-pump: if you prefer A to B, B to C, and C to A, someone can
  sell you... Actually the classic pump: start with C, charge small amounts to trade
  C->B, B->A, A->C, ending with C minus fees. Then argue cyclical preferences are
  exploitable, hence irrational.


  Objections:

  - "But each trade is an improvement according to your preference; the argument assumes
  you also prefer having more money, so why would you perform the whole cycle knowing
  you''ll lose money? A sophisticated chooser will see the trap and refuse the first
  trade. So intransitive preferences aren''t automatically pumpable — only myopic
  ones are."

  - Reply: "The sophisticated chooser still has a cycle: she is choosing not to take
  a trade from C to B even though she prefers B to C — the very reason you refused
  is your awareness of your own intransitive preferences, so you end up being exploited
  by yourself: you can''t take what you prefer when it''s offered."

  - Rebuttal: "That''s because preferences over objects aren''t the whole story; I
  also care about the sequence/history. Once you allow history-dependence, the preferences
  aren''t intransitive over full outcomes — they''re transitive over detailed alternatives,
  so the axiom is saved."

  - Reply: "Then you''ve changed the subject: the money-pump argument was supposed
  to show that preferences over first-order options must be transitive; your defense
  uses transitive preferences over an enriched set of options, which is fine, but
  most real people don''t frame choices that way."


