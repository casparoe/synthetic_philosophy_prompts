  Back-and-forth ideas:

  - Dana: The hitchhiker can''t rationally get the ride, because once he''s in town,
  he''d have no reason to pay, and he knows it; so he can''t honestly promise, and
  a rational driver won''t believe him. Any attempt to "make himself" pay would mean
  acting against his own preferences at that later moment, which is precisely irrational.

  - Marcus: But he can rationally adopt a policy now — "always pay your rescuers"
  — because having that policy gets him the ride. If he later pays out of policy,
  the act is irrational, but the policy that produces it is rational.

  - Dana: That''s a contradiction: rational acts can''t be produced by rational deliberation.
  If the act itself is irrational, then a rational deliberator at the later time won''t
  do it; you can''t just "adopt a policy" that you know you''ll abandon when the time
  comes.

  - Marcus: People do this: Ulysses binds himself to the mast; you can rationally
  choose to be the kind of person who keeps promises, even specific promises that
  cost more than their benefit, because being a promise-keeper is valuable.

  - Dana: Ulysses'' binding is different — it''s removing an option (constraint).
  The hitchhiker isn''t removing an option; he still could refuse to pay once in town.
