  ---


  I am a third-year undergraduate taking an ethics course on lying, bullshit, and
  the responsibility of speakers. Our university''s Honor Code, drafted in 2003 and
  unchanged since, contains the following clause:


  "Academic integrity forbids a student from knowingly misrepresenting the sources,
  data, or evidence for the claims made in submitted work. A student is culpable not
  only for falsehoods the student invents, but also for falsehoods the student passes
  on when the student should have known better."


  A classmate of mine used a large-language-model assistant to draft a term paper
  for a course that allowed drafting aids but required the final submission to be
  the student''s own work. The model produced a plausible supporting paragraph reporting
  the results of a study by a real psychologist, complete with a journal-looking reference.
  The study does not exist; the assistant fabricated it. My classmate did not know
  the reference was false and did not check it, because the surrounding claims were
  consistent with the course readings and the same assistant had been reliable on
  earlier, shorter assignments. The convenor is now treating this as a violation under
  the clause above.


  I want you to work through how a clause written more than twenty years ago, before
  anyone imagined generative assistants, applies to this case. Please structure your
  answer in these sections, in this order, with approximately the word counts indicated
  after each heading:


  Plain reading of the clause (roughly 120 words): identify which phrases do the decisive
  work and what they require on their face.


  Application by the words (roughly 180 words): apply those phrases to my classmate''s
  conduct as if you were a literal-minded reader of the text.


  Application by purpose (roughly 150 words): reconstruct what the clause exists to
  protect and whether that purpose reaches the case.


  What the drafters would likely have said (roughly 120 words): reason about how the
  committee in 2003, asked to decide this case, would have answered, and why.


  Reasonable reader today (roughly 120 words): what a competent student reading the
  clause now would understand it to promise, and whether that differs from 2003.


  My verdict and which approach should control (roughly 150 words): say what the clause
