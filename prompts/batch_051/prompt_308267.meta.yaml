  associated with better outcomes within each stratum. The physicians'' association
  argues the overall figure is a statistical artifact caused by the intervention''s
  being preferentially given to severe patients; a reviewer argues the overall figure
  is the only honest summary for the actual population; a third side says both tables
  should be published and no one should claim to know whether the treatment helps.


  Please rank the following general resolutions of Simpson''s paradox by how much
  you would trust them to guide such a decision, and say in one sentence why each
  receives its rank:


  (a) Never condition on post-assignment covariates; always use the total-effect estimate
  for the whole population.

  (b) Always condition on the most finely grained covariates available, even if some
  were measured after treatment began.

