  ---


  For the past year I have been reading my way through the virtue ethics literature,
  and I keep returning to one thing that puzzles me. The dispute between Aristotelians
  and situationist critics—associated above all with John Doris and Gilbert Harman—appears
  to have reached a standstill. Both sides accept the same body of experimental results:
  Milgram''s obedience findings, Darley and Batson''s Good Samaritan study, the low
  cross-situational consistency of behavior in personality research (the famous correlation
  of roughly 0.2). Both sides also appear to accept the same Aristotelian account
  of what a virtue is. Aristotle writes in Book II, chapter 4 of the Nicomachean Ethics
  that [passage]. So far as I can see, the two camps then part company over how to
  read that sentence and over what follows if it is descriptively false. The situationists
  take the sentence as a psychological claim and argue the evidence refutes it: behavior
  is best predicted by situational features, so there are no fixed and permanent dispositions
  of the relevant kind, and virtue ethics is built on a false moral psychology. The
  Aristotelians reply that this attacks a strawman: Aristotle never claimed most people
  possess such dispositions; virtue is an ideal that may be rare, and the studies
  use "ordinary" subjects, not the virtuous. Others add that the situationists have
  misdescribed the trait construct, and that local, narrow traits suffice for virtue
  ethics anyway.


  From where I sit, after decades in the natural sciences, this looks less like a
  dispute about facts and more like two disciplines facing different questions under
  the same words: one side seems to be doing descriptive moral psychology, the other
  ideal ethical theory. But I am not confident, because there may also be a genuine
  factual disagreement buried inside it about how strong the trait literature actually
  is, or about what sort of psychology a normative theory must be answerable to.


  My question is not who is right. I want a diagnosis of the structure of the disagreement.
  Is it substantive or verbal? Do the sides differ about facts, about standards of
  evidence, about which cases count as data, or about starting intuitions neither
  can argue for? And, given that diagnosis, what would actually count as progress—a
  conceptual distinction, a differently designed experiment, a formal result, a change
  of question—or should we expect the standoff to continue?


