  "Holocaust survivors" might be real. But generations, I think, rarely qualify as
  property kinds, because the supposed shared traits are weak, and the formative-event
  story is usually reverse-engineered after the label already exists. Instead, I suspect
  generations are real as what I''ll call *contrast kinds*. A contrast kind is constituted
  by the practice of comparing successive cohorts with one another. Once a label like
  "Millennial" is in circulation, people use it to interpret their own behavior and
  their elders'' and juniors'' behavior; they begin to experience their cohort as
