  Version:


  "I''m not a student of philosophy or anything, but I''ve been trying to pin down
  what I think about frugality after a few arguments with my family, and my gut verdicts
  on specific situations are more consistent than my ability to explain them. I want
  to know what principle, if any, is actually doing the work underneath them. Here
  are the cases as I honestly feel them:


  (1) My phone screen is cracked and the battery is weak, but it still works. I can
  afford a new one easily. I''ve been carrying a power bank and plan to keep the phone
  another year. I think this is what I should do, even though I know my one phone
  is a drop in the bucket for e-waste either way.


  (2) My coworker Sam buys a $9 lunch out every workday; it''s his one treat, his
  budget is tight but he''s not in debt. Another coworker told him to pack a sandwich
  and called him wasteful. I thought that was preachy and wrong, and I didn''t defend
  the coworker — even though Sam''s takeout does make a lot of packaging trash. I
  don''t think I should push Sam to be frugal.


  (3) My city added a fee on plastic bags and put up posters about mending clothes
  instead of replacing them. I support both. The city is nudging thousands of strangers,
  but it doesn''t feel preachy to me the way the coworker did, even though each individual''s
  behavior only changes a little.


  (4) My cousin has a good salary and replaces his whole wardrobe every fall and spring,
  donating the old stuff. I judge him for it. When I try to say what''s actually wrong,
  I can''t point to a harm; the clothes get donated and reused. It feels like the
  thoughtless replacing is itself the wrong thing, not its effects. But if the act
  itself is what matters, why was it wrong for our coworker to push an act of frugality
  on Sam?


  (5) There''s an old man in my building who lives on plain oatmeal, keeps the heat
  at 58 in the winter, and washes and reuses plastic wrap. He can afford better. I
  don''t admire him; he seems a little sick. But I can''t explain why his frugality
  looks excessive while my cracked phone feels like something a decent person would
  just do.


  The nearest thing I have to a principle is this: it''s good for *me* to be frugal,
  and it''s okay for institutions to nudge everyone toward frugality, but it''s not
  okay for one person to push it on another face-to-face. That sounds incoherent —
