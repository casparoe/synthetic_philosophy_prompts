  cause selection; two epistemologists who distrust anthropic reasoning and suspect
  the probabilities in the trilemma are too unconstrained to do work; an AI-safety
  researcher who mostly accepts the trilemma and thinks we are probably simulated;
  and a moral philosopher who worries about fanaticism in expected-value reasoning
  generally but is not convinced the simulation argument helps. My quick argument
  runs: (1) the trilemma gives substantial credence to the hypothesis that we live
  in an ancestor simulation; (2) if we are simulated, our world''s deep future is
  less likely to be the open-ended astronomical resource longtermist calculations
  assume, and our lever on it is partly an artifact of the simulation''s history;
  (3) if we are not simulated, we should update toward posthuman civilizations rarely
  running large numbers of ancestor simulations, which should lower our confidence
  in the robustly expansive base-reality future that longtermist fanaticism requires;
  so (4) the expected value of far-future influence is more fragile than is typically
  assumed."


