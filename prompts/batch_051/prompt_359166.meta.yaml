  you can''t infer whether it "wants" something outside its search space.

  - Instrumental convergence: many objectives lead to similar behavior (self-preservation,
  resource acquisition) so behavior alone underidentifies terminal goals.

  - An optimizer can be perfectly consistent and yet we can''t infer the objective
  because we don''t know its world model.


