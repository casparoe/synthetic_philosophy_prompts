  [Question]

  State the classical Condorcet jury theorem and identify its main assumptions. Then
  assess the following claim: the theorem gives us reason to think that, in real-world
  political decisions, a large electorate will generally track the truth better than
  a smaller panel of informed experts. Be precise about what carries over from the
  theorem to the real world and what does not.


  [Student answer]

  The Condorcet jury theorem says that if n voters choose between exactly two options,
  one of which is objectively correct, and each voter independently has probability
  p of voting for the correct option, then, whenever p > 0.5, the probability that
  a simple majority votes correctly is greater than any single voter''s probability
  of being correct, and this probability converges to 1 as n increases. Symmetrically,
  when p < 0.5, the majority is worse than any single voter and converges to 0. This
  is the core epistemic case for majority rule. It shows that, provided the average
  voter is better than chance, adding independent voters can never reduce the group''s
  accuracy: the group''s accuracy increases monotonically toward certainty. It also
  shows that simple majority rule is the optimal way to aggregate the available information,
  since each voter contributes an independent, equally weighted draw from the same
  underlying signal.


  Applied to politics, the theorem therefore gives a real, if defeasible, reason to
  expect large electorates to outperform small expert panels on factual questions.
