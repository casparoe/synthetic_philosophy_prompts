  After four decades in the physical sciences, I retired and began reading philosophy
  of science in earnest, and the experience has made me suspicious of one of my own
  long-standing habits. The habit is this: I assign essentially zero evidential weight
  to internal theoretical virtues—mathematical elegance, uniqueness, explanatory unification,
  coherence with neighboring theories—unless the theory in question also makes novel
  predictions that are testable at least in principle and that would distinguish it
  from live rivals. I treat "testable in principle" as a gate, and I treat arguments
  of the form "this framework is the most mathematically natural or constrained way
  to unify what we know, so it is probably true" as rhetorical rather than evidential.
  The case that has forced the habit into the open is the current discussion of string
  theory and the multiverse: when I read sophisticated defenses of what philosophers
  now call non-empirical theory confirmation, I find myself dismissing them almost
  out of hand, and I recently told a neighbor that even if string theory were the
  only known mathematically consistent route to unify gravity with quantum mechanics,
  that fact should not by itself move my confidence in its truth at all.


