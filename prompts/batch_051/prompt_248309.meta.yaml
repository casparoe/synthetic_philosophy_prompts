  Let me construct the argument carefully.


  Particularism (Dancy): the view that moral thought and judgement do not depend on
  the provision of a suitable supply of moral principles; whether a feature is a reason,
  and what force it has, varies with context. Holism of reasons: a feature that is
  a reason for an action in one case may be no reason or a reason against in another.
  So there are no true exceptionless moral principles of the form "features F1...Fn
  always make action A right/required".


  The "proves too much" argument:

  1. Particularism holds that no finite set of non-moral features is ever sufficient,
  in every context, to settle what one ought to do; that''s why there are no true
  moral principles.

  2. But consider any particular case where you ought to φ. The case has some (perhaps
  enormous, complete) set of non-moral features F.

  3. If holism is true, then the reason-giving force of features depends on context,
  but context is itself just more features. So if we include all the features of the
  situation — including relational, historical, and "enabling" features — then the
  complete set F fixes the situation.

  4. So the universal claim "for any situation exactly like this one in all respects
  F, one ought to φ" is true.

  5. That universal claim looks exactly like a moral principle.

  6. Therefore particularism implies at least one true moral principle, and by parity
  it implies a massive set of them — one per case. So particularism either refutes
  itself or the word "principle" has been stretched to the point where the debate
  was never about principles at all.

  7. But the particularist presumably doesn''t want to say they believe in infinitely
  many case-indexed principles; that''s just generalism with extra steps.


  Where does it go wrong? Options:

  - Reject 4/5: the universal claim is not a principle because a principle must be
  statable/usable in advance, must guide action, must explain; the case-indexed universal
  can''t guide because it can''t be applied to a new case (no new case shares all
  features), and it doesn''t explain — it just restates the verdict.

  - Reject 2/3: the complete set of features is not finitely specifiable; "the situation
  exactly like this one" is not a usable antecedent. The particularist can accept
  the universal as a true generalisation but deny it''s a moral principle in the relevant
  sense.

