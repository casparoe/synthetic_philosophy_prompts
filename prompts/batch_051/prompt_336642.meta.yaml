  Let''s write:


  I''m trying to write a short essay about Popper''s The Poverty of Historicism, and
  I''d like comments on the draft before I commit to it. The thing I''m stuck on is
  his distinction between laws and trends. As I remember it, he says a law is universal
  and unconditional in the relevant respect, whereas a trend is just a singular historical
  direction that holds only because of a particular set of contingent conditions.
  My draft argues that this distinction is doing less work than it seems. I use three
  cases: the demographic transition, the long-run increase in energy use per person
  in industrial societies, and the spread of bureaucratic states. For each, Popper
  would presumably say it is a trend, not a law. But the phrase "contingent conditions"
  does too much: whether two episodes belong to "the same system" so that a trend
  can continue is itself a theoretical judgement, and the theory you need often looks
  like a modest law of history. So my conclusion is that Popper excludes strong laws
  of history but leaves a lot of room for weak, conditional regularities that deserve
  to be called laws in some broader sense. I''m worried this is either obvious, or
  a straw man, or that my examples don''t actually have the right shape.


  Could you comment on the essay as I''ve described it? I specifically want to know:
