  I''m putting together a list of the standard places where people give in order to
  get around Arrow''s impossibility theorem, and I want to know whether there''s one
  I''m missing. Here''s what I''ve got so far:


  (1) Restrict the domain: assume preferences are single-peaked (or value-restricted
  or whatever) so majority rule stops cycling.

  (2) Drop weak Pareto: once you do, constant rules or status-quo-biased rules become
  admissible.

  (3) Weaken IIA: let the social comparison of a and b depend on where c sits in voters''
  rankings, like Borda does.

  (4) Weaken non-dictatorship: just accept that one voter''s ranking is the social
  ranking.

  (5) Weaken the collective rationality requirement: only demand acyclicity, or a
  choice function rather than a full transitive ordering.

  (6) Enrich the informational basis: allow cardinal and interpersonally comparable
  utility, so you can do utilitarianism or leximin instead of ordinal preference aggregation.


