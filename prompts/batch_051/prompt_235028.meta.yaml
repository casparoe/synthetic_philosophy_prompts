  Let''s think of domain: Kant''s antinomies of pure reason. The antinomies: four
  pairs of thesis/antithesis:

  1. World has a beginning in time and is limited in space vs no beginning/no limits.

  2. Every composite substance consists of simple parts vs nothing is simple.

  3. Causality according to laws of nature is not the only causality; freedom also
  vs no freedom; everything in world happens solely according to laws of nature.

  4. There belongs to the world necessarily existing being vs no necessary being.


  Kant''s resolution: first two (mathematical antinomies) both thesis and antithesis
  false because world as a whole of appearances is not given as a determinate whole;
  they are based on treating the unconditioned as a constitutive principle. Third/fourth
  (dynamical) can both be true in different respects: natural necessity in appearances,
  freedom/noumenal cause outside series; necessary being outside series.


