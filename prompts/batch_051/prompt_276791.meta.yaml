  overrides a patient''s sincere report. Yet in my own subfield, introspection is
  treated as a source of confabulation. In the classic findings, subjects asked to
  explain why they judged, chose, or behaved as they did produce fluent, confident
  explanations, but experimental manipulations show those explanations track the plausible-sounding
  story rather than the actual cause. The same person''s introspective authority thus
