  Prompt draft:


  "I am a PhD student in bioethics, and I have been embedded with a university-affiliated
  fertility clinic to help revise its genetic counseling protocols. The clinic already
  offers preimplantation genetic testing for aneuploidy and for serious monogenic
  conditions such as cystic fibrosis. It is now deciding whether, and how, to extend
  its counseling to polygenic risk scores for conditions like type 2 diabetes or major
  depression, and to other predicted traits such as height or educational attainment.
  The medical director wants the new protocol organized around the principle of procreative
  beneficence: when prospective parents are already selecting among possible future
  children, they have a moral reason, other things being equal, to select the child
  who can be expected to have the best life—or at least not to select one expected
  to have a worse life. At the same time, the clinic is committed to a liberal framework:
  no coercion, no single substantive conception of the good, genuine respect for parental
  autonomy, and an explicit acknowledgment of the eugenic history of reproductive
  genetics.


  Please translate procreative beneficence into a reusable, step-by-step procedure
  that a genetic counselor can actually run. The counselor has roughly 25 minutes
  per pre-test consultation, has no formal philosophical training, and must be able
  to defend the procedure to the clinic''s ethics board as well as to patients who
  push back. The procedure should specify, in order: which questions the counselor
  asks; which information rises to the level of a recommendation, a neutral mention,
  or something the counselor should deliberately not offer; when the principle applies
  and when its conditions are not met; and which steps are genuine judgment calls
  that cannot be eliminated by the procedure.


  I want the procedure to be honest about a specific tension: procreative beneficence
  seems to require a shared, at least partial, standard of a better or worse life,
  while liberal eugenics is supposed to remain neutral among rival conceptions of
  the good. A workable procedure must say whether it can rank embryos by expected
  welfare without thereby importing a substantive view of what makes a life worthwhile.
  It should also address the difference between selecting against a serious disease
  and selecting for a probabilistic enhancement, since the clinic''s lawyers are worried
  about treating polygenic scores as if they were diagnostic tests.


  Work the procedure through three cases: (1) a couple using PGT for cystic fibrosis
  carrier status asks whether they should also use polygenic scores to choose the
