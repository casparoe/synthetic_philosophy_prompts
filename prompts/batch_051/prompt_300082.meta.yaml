  (1) Moral judgment is grounded in sympathy, where sympathy is imaginative perspective-taking
  into the situation of the person judged, not mere emotional contagion.

  (2) The impartial spectator is formed by internalizing the responses of actual bystanders:
  we learn to see ourselves as others see us.

  (3) The impartial spectator can, and sometimes should, condemn the unanimous moral
  judgments of the society we actually live in.

  (4) Sympathy is not automatic mirroring; it is a judgment-like response that needs
  information about the agent''s circumstances and aims, and the impartial spectator
  judges from a standpoint of full relevant information and disinterest.

  (5) The impartial spectator is an idealized social standpoint, not a transcendent
  or theological moral standard.

  (6) When I have reason to distrust my own impartial spectator, the natural and sufficient
  corrective is to go back to how actual spectators around me respond.


  Which pairs among these six are in genuine tension, and which only look as though
  they are? Please rank any tensions you find by severity, and for each say what would
  have to be revised to resolve it. Then tell me which single revision of one commitment
  does the most to make the set coherent, and what it would cost me. I want your committed
