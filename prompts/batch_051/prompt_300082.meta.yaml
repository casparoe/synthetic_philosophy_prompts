  nevertheless supplies a standard of propriety that can condemn the unanimous judgments
  of one''s own society; (4) sympathy is not just emotional contagion but a mechanism
  of perspective-taking subject to correction by full information about the agent''s
  situation; (5) the impartial spectator is more like an idealized social consensus
  than a transcendent or God-given moral law; and (6) we can sometimes be mistaken
