  One concern: "no one can make a true proposition false" — some might object that
  step (3) says if S were to do otherwise, a true proposition would have to be false,
  and that''s just what doing otherwise amounts to, not something S "makes" happen
  before. The subtle point: the ability to do otherwise is compatible with the truth
  of "S will do A" because the latter is not a hard fact about the past. For counterfactuals
  of freedom, though, the truth is "before" S exists — does that make it a hard fact?
  The Molinist can say it''s a soft fact about S''s disposition. This is a nice "price"
  question: Molinists must say counterfactuals of freedom are not temporally rigid
