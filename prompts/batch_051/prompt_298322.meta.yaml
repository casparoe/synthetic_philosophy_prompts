  "Next thursday I''m presenting to my philosophy of language reading group and I
  want a Q&A prep sheet, not a restatement of my argument. My view is deflationary:
  slurs have no special semantic content — not a presupposition, not a conventional
  meaning-level signal, not an expressive property. A slur tells you the same thing
  its neutral counterpart tells you; what it adds is all in the social machinery —
  who''s allowed to say it, what choosing the forbidden word signals about the speaker''s
  allegiances, how the taboo got built by historical domination, and what the act
  does to the addressee. Nothing nasty is stored in the word itself."


