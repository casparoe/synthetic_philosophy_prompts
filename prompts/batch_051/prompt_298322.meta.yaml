  slurs carry a conventional derogatory component at the level of meaning: one thinks
  it''s a presupposition that projects, the other thinks it''s a non-truth-conditional
  signal attached to the word. There''s an expressivist who thinks using a slur just
  is the expression of contempt, not a conversational inference, and that taboo-talk
  can''t explain why the contempt comes through even when the speaker flat-out says
  they don''t endorse it. There''s a sociolinguist who works on reclamation; she agrees
