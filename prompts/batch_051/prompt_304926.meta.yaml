  (2) A program P could implement: cooperate if the opponent''s program is exactly
  P (or if opponent''s program cooperates against P), otherwise defect.

  (3) If both players use such a program, both cooperate.

  (4) A player cannot profitably deviate to a different program, because any deviating
  program D that defects against P will be defected against by P, yielding a worse
