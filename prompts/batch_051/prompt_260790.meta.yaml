  At a decision-theory reading group I''ve attended for years, two regulars spent
  most of an evening arguing about the Ellsberg paradox, and neither would concede.
  For context, here is the standard setup. Urn A holds 100 balls, 50 red and 50 black.
  Urn B holds 100 balls, each either red or black, but the proportion is unknown.
  You must name a color; a ball is drawn from the urn you select, and you win if it
  matches. Most people prefer to bet on urn A whether they name red or black. Expected-utility
  theory holds that this pair of preferences cannot be rationalized by any single
  probability assignment, because preferring A-red over B-red implies you assign red
  in urn B less than 0.5, and preferring A-black over B-black implies you assign black
  in urn B less than 0.5, which cannot both be true. I have read enough of the surrounding
  debates on the rationalist blogs to track the moves, but I could not referee the
  exchange, so I am writing it up from memory.


  Sam opened with the expected-utility argument above and called the pair of preferences
  a plain inconsistency. (1) Rhea answered that expected utility requires the agent
  to have a single subjective probability, and the lesson of the paradox is that a
  rational agent facing urn B need not have one; she can hold a set of possible proportions,
  and choosing urn A for both colors is not an incoherent point-valued probability
  but a refusal to gamble with unquantified odds, since symmetry does not force a
  50/50 prior. (2) Sam replied that a set by itself is not a decision rule; once you
  adopt a rule for choosing with a set of distributions, such as maximin expected
  utility, you reproduce the Ellsberg preferences, but the rule has serious pathologies
  — it is driven entirely by the single worst-case distribution, it can assign negative
  value to information, and it can be dynamically inconsistent across a sequence of
  choices. (3) Rhea countered that those pathologies are artifacts of importing the
  one-shot rule into sequential settings: there are coherent ways to update a set
  of priors (roughly, updating each member of the set on the observations), and the
  alleged money pumps require the agent to walk into a foreseeable bundle of trades.
  She added that because precise probabilities are the exception in real decisions,
  a norm requiring a unique prior hides a point guess inside the formalism. (4) Sam
  replied that the Ellsberg urn is the artificial case: the composition is already
  fixed, and the only thing missing is the description of it, so being averse to the
  unknown is not robustness to a real feature of the environment. In real problems
  with base rates and data, refusing to quantify is not caution but a sophisticated-sounding
  license for status quo bias. (5) Rhea said that in practice most problems look more
  like urn B than urn A, and choosing robustly across the models one cannot rule out
  is standard engineering rather than a pathology; the alternative, completing one''s
  preferences arbitrarily whenever probabilities are not given, is what actually smuggles
  guesswork into decisions. (6)


