  Domain: echo chambers and epistemic bubbles. The activity should make participants
  feel the difference. The key conceptual distinction:

  - Epistemic bubble: a social-epistemic structure in which relevant information is
  missing (you don''t hear contrary voices). It''s about informational access. It
  can be popped by exposure to new information.

  - Echo chamber: a social-epistemic structure in which people within the chamber
  actively discredit outside voices; it''s about trust, not just information. You
  could have full exposure to outside views, but you''ve been trained/pre-emptively
  conditioned to distrust them. Echo chambers resist correction by "membership, trust,
  and identity," not just missing info.


  A game to feel this: We need two conditions. Could split the group into two rooms
  or two networks. In one condition (bubble), participants form a network where they
  only receive a subset of evidence about some issue — e.g., a mystery/medical diagnosis/town
  planning problem. They''re missing a key fact. When outsiders offer it, bubble members
  update quickly ("Oh! We just hadn''t heard that"). In the echo chamber condition,
  participants receive the same one-sided evidence, but also they are given social
  roles: two planted "elders" repeatedly warn them that the outsiders are known liars
  trying to sabotage the group; when outsiders share the missing fact, members distrust
  it because of earlier priming. They don''t update.


  But we need to design a runnable 60-minute activity with materials and debrief.
  The idea should show up in what happens, not what facilitator says afterward.


