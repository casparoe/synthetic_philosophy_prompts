  Domain: Lakatos''s Proofs and Refutations: is mathematics quasi-empirical?

  Type: Report a parallel the asker noticed between ideas from different fields and
  ask whether it is deep or superficial.


  The parallel: Lakatos''s rational reconstruction of how a theorem grows through
  proof and refutation (using Euler''s formula V - E + F = 2 as the running case)
  looks like the way modern software is developed with a test suite: you write a "proof"
  (program) against a spec, tests play the role of counterexamples, and when a test
  fails you either fix the program or narrow the precondition (monster-barring?).
  The asker wants to know whether this is deep — i.e., whether Popperian/fallibilist
  epistemology of math and software verification share a structure — or superficial
  because mathematical counterexamples are decisively refuting while tests are only
  sample-based.


  I need to be precise enough: "stated precisely enough that the response can check
  where the structures match and where they come apart." So mention the specific Lakatos
  moves:


  - Lakatos''s proof generates definitions: the proof of Euler''s formula forces the
  concept of a "simple polyhedron" (simply connected, faces simply connected, etc.).
  In software, a failing test forces you to sharpen the precondition/spec.

  - Monster-barring: refusing to count a "urchin" or "picture frame" as a polyhedron
  to save the conjecture. In software: "that input isn''t supported" / narrowing the
  domain.

  - Exception-barring: admitting the counterexample but excluding the class. In software:
  special-casing.

  - Lemma-incorporation: building the counterexample into the theorem as a condition.
  In software: adding a regression test for the previously failing case.

  - Concept-stretching: changing the meaning of polyhedron so the counterexample becomes
  an instance. In software: changing the spec the whole time? Hmm, maybe spec drift.


  The asker''s parallel: "Does the logic of local counterexamples and hidden lemmas
  in Lakatos''s classroom map onto the way test-driven development grows a program,
  or does this capture only the trivial fact that both involve a claim and a refutation?"


