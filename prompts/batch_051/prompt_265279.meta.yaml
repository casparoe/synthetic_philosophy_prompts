  been doing this by vibes — basically we pick whichever explanation sounds coolest
  — and our faculty advisor says he''ll only keep signing off if we get a real procedure.
  He took a philosophy of science class once and told us to "use inference to the
  best explanation," but we don''t have the theory, and I can''t tell which parts
  of it can survive being turned into a checklist.


  So: write me a decision procedure my editors can actually run before we publish
  a piece. It should be a list of questions in order, like a flowchart in words, with
  what counts as a good-enough answer to each question, where the procedure stops
  with a no, and where it should say "this is a judgment call, ask the advisor" instead
  of pretending the checklist decided it. The editors are mostly sophomores with no
  philosophy or science-methods background, and we have about 20 minutes per submission.
  Keep it usable without them having to know what IBE is.


  Two things I already know you should worry about, so don''t leave them out: (1)
  I''ve heard that "best" has to mean best among the explanations actually submitted,
  not best in some absolute sense — like a "best of a bad lot" problem — so the procedure
