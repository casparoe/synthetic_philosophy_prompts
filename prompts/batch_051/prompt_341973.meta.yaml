  problem of explaining why we think there''s a hard problem. But any explanation
  of our ''phenomenal intuitions'' will itself have to mention either (a) the actual
  presence of phenomenal consciousness, in which case it does not supply a deflationary
  account, or (b) only physical/cognitive processes, in which case it is just changing
  the subject and doesn''t answer the hard problem.'' A deflationist replies that
  if we can explain the intuitions without invoking phenomenal consciousness, the
  rational pressure to posit phenomenal consciousness disappears. Is the deflationist
  entitled to this reply? Why or why not? Discuss with reference to at least one candidate
  solution to the meta-problem and the distinction between explaining judgments and
  debunking them."


