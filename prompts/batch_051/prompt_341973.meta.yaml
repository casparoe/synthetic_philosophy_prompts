  Meta-problem of consciousness (Chalmers 2018-ish "The Meta-Problem of Consciousness"):
  The hard problem is explaining phenomenal consciousness (why there is subjective
  experience at all). The meta-problem is explaining why we think there is a hard
  problem — why we have the problem intuitions/judgments: that consciousness is non-physical,
  hard to explain, has explanatory gap, zombies conceivable, Mary, etc. The meta-problem
  is an ordinary empirical/scientific problem about explaining behavior, reports,
  judgments, intuitions. Chalmers distinguishes the meta-problem (easy-ish, about
  dispositions to make claims) from the hard problem. He canvases possible solutions:
  introspective mechanisms, etiological, etc. Key move: a solution to the meta-problem
  might or might not help with the hard problem. Deflationism says solving the meta-problem
  dissolves or debunks the hard problem (if we can explain why we think there''s a
  hard problem without phenomenal consciousness, maybe the hard problem is an illusion).
  Realism says even a complete solution to the meta-problem leaves the hard problem
  untouched because the hard problem concerns the existence of consciousness itself,
  not our beliefs about it. There''s also the "interpretive" issue: the meta-problem
  requires explaining why people make these judgments, and one strand claims some
  solutions to the meta-problem already presuppose consciousness.


  A good exam question could be:


