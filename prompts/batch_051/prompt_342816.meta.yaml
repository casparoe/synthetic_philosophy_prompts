  and presentations," he wrote: "I have presented my research at a national conference."
  That sentence is literally true. Last year he presented a poster at the annual meeting
  of a large professional association, and the meeting is by any reasonable measure
  national. However, the poster session in question is open to all registered attendees,
  with no review, no selection, and no competition; the student paid a fee and hung
  a poster summarizing a term paper. In our hearing, he acknowledged that he included
  the sentence because he knew the selection committee would take "presented at a
  national conference" to indicate a peer-reviewed or competitive presentation, and
  that he believed an accurate description of the session would have weakened his
  application.


  The fellowship rules state: "Any applicant who knowingly supplies false information
  in connection with an application shall be disqualified and referred to the Academic
  Integrity Board." They do not mention misleading information, inaccurate impressions,
  or omissions.


  The Board splits three ways. Some members argue the student did not violate any
  rule: every word he wrote is true, and the rule targets false information, not information
  that a reader might over-interpret. Others argue that this is precisely the sort
  of dishonesty the rule exists to punish, and that we would be endorsing a loophole
  if we distinguished here between a false statement and a deliberately misleading
  true statement. A third group is uncertain.


  Write the Board''s decision memo. It should do three things:

  1. Recommend a specific disposition (whether the student should be found responsible,
  and what follows).

  2. Give reasons, and in doing so, take a position on whether misleading through
  a literally true statement is the same wrong as lying, a lesser wrong, or a different
  kind of wrong, and why that answer should govern our interpretation of the rule.

  3. State and honestly answer the strongest argument for the disposition you are
  not recommending, including how you would redraft the fellowship rules to handle
  this case in the future.


