  Prompt draft:


  "Population axiology has been stuck for roughly forty years, and I want a diagnosis
  of the impasse rather than another theory. Here is the situation as I understand
  it. The field tries to answer a single question: given two possible worlds that
  differ in how many people exist and how well off they are, which world is better,
  and why? Totalists answer by summing welfare, and they thereby accept the repugnant
  conclusion: for any world of, say, ten billion people living extremely good lives,
  there is some much larger world of people with lives barely worth living that the
  totalist must judge better, because the aggregate is larger. Averagists escape that
  conclusion by rank-ordering worlds by mean welfare, but then they must say that
  adding a person whose life is worth living but below the current average makes the
  world worse, and they must prefer a solitary life of extremely high welfare to a
  vast population only very slightly less well off. Person-affecting theorists deny
  that merely adding a happy person is an improvement at all, which lets them avoid
  the repugnant conclusion, but they are left unable to compare many different-number
  cases and they inherit the non-identity problem. Critical-level theorists introduce
  a positive threshold a life must exceed before it counts for anything, and thereby
  dodge the repugnant conclusion, but they end up committed to other unpalatable verdicts
  about adding lives just below the threshold. What fascinates me is that everyone
  in the debate seems to grant the same fixed stock of case judgments — the repugnant
  conclusion, the mere-addition case, the sadistic conclusion, and so on — and every
  theory on offer violates at least one of them; there is even a formal impossibility
  theorem showing that a certain familiar list of adequacy conditions cannot all be
  satisfied together. Yet practitioners continue to talk as if the task is to find
  the one theory that honors all of them. So my question is about the structure of
  the disagreement, not its merits. Is this a substantive moral disagreement about
  which verdicts to abandon, a verbal or methodological disagreement about what it
  is to rank populations by ''betterness,'' a disagreement about where to set the
  zero point of a life worth living, or simply the predictable result of imposing
  inconsistent constraints on a single ranking? And given that diagnosis, what would
  count as progress: a different formal pressure to reveal which condition is doing
  the work, an empirical or conceptual account of the zero level of welfare, a switch
  to comparing policies rather than whole worlds, or an argument that the question
  as posed has no well-formed answer and the field should stop expecting one?"


