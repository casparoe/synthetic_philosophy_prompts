  method is reliable. Actually, is it rule-circular in the classic sense? Rule-circularity
  usually concerns arguments for the reliability of an inference rule that use that
  very rule (like an inductive argument for the reliability of induction). Here, Roxanne
  uses the gauge to come to believe the tank states, and then inductively concludes
  the gauge is reliable. The induction step itself is standard; the circularity is
  that to obtain the premises about the tank states, she relies on the gauge''s accuracy.
  So the argument "assumes the reliability of the gauge" not as a premise but as a
  reliance. Some characterize bootstrapping as having premises known only if the gauge
  is reliable, but the premise "the tank is full" is known by a reliable process,
