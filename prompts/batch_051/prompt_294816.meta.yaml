  - Therefore, the gauge is reliable. (By induction from the track record.)


  Roxanne has thereby come to know/believe justifiedly that the gauge is reliable.
  The problem: her evidence for the track record depends on using the gauge, whose
  reliability is at issue. The inference is not premise-circular (the conclusion "the
  gauge is reliable" never appears among the premises; the premises are particular
  readings and particular tank states). But it might be "rule-circular" or "epistemically
