  My friend and I spent most of yesterday evening arguing about Le Guin''s The Ones
  Who Walk Away from Omelas. He kept treating the story as a classic utilitarian thought
  experiment: one child kept in wretched conditions, whose suffering secures the genuine
  flourishing of an entire city, and he wanted to know what level of aggregate happiness
  would finally make such a bargain defensible. I pushed back from a suffering-focused
  direction: the child''s misery, I kept saying, is not just another entry in the
  ledger, and no amount of others'' joy can license deliberately inflicting it. By
  the end we had wandered into negative utilitarianism — roughly, the view that preventing
  suffering takes priority over producing happiness — and I realized I wanted a careful
  reading of the story through exactly that lens rather than another abstract argument
  about trade-offs.


  I am preparing the story for a discussion group, and I would like you to give me
  a critical reading of it through the lens of suffering-focused ethics. Does Le Guin''s
  parable actually endorse something like a negative-utilitarian verdict — that the
  city''s bargain is wrong no matter how the sums come out — or is it making a narrower
  point about self-deception, scapegoating, and the way a community manages its knowledge
  of what it does? The story is striking partly because it refuses to describe the
  child''s suffering in much detail; that refusal seems to treat some suffering as
  unassimilable to any calculation. But the tale also ends with people merely walking
  away, which does not help the child; a philosopher of a strict suffering-focused
  view might object that a principled exit is just moral self-cleansing, and that
  if the city cannot exist without the child''s misery, the consistent verdict is
  not to walk away but to do whatever actually ends the misery. Does the story notice
  that difficulty, and does it have an answer to it? Take a definite position on what
  the story is doing philosophically and whether its implied ethic holds up; do not
  just lay out possible readings, but defend the one you think is correct, and flag
  where your reading leans on a specific version of negative utilitarianism.


