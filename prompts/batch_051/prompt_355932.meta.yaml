  interfered with—gets no credit. (3) Acting against your own conscience is always
  a sin, even if your conscience is mistaken about what the right thing is. (4) Acting
  in accord with a mistaken conscience can be entirely innocent, even if what you
  in fact do would otherwise be wrong. (5) But I''m also enough of an externalist
  to think that whether you were diligent in forming your conscience matters: you
  can sin by being careless about what you ought to know. (6) And I want to say the
  act itself isn''t morally neutral; a wrong done in the world is an objective harm
  even when the agent is blameless, and that should matter to us if we care about
  morality. Do these six really form a coherent picture? Which pairs pull against
  each other hardest, and which only look like they do?"


