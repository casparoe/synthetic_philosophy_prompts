  Type B Ellsberg prompt draft:


  "I''m a PhD student in economics, working on decision theory. The dispute over the
  Ellsberg paradox and ambiguity aversion has been running since Ellsberg''s 1961
  thought experiment and shows no sign of closing. One side holds that the Ellsberg
  choices violate Savage''s sure-thing principle and therefore reveal an incoherence:
  any agent who prefers betting on the known urn for either color cannot be maximizing
  expected utility with respect to any single subjective probability. The other side
  holds that the choices are reasonable and that the rational model should be generalized
  — maxmin expected utility, Choquet expected utility, smooth ambiguity preferences,
  and robust control all start from the thought that probabilities may not be uniquely
  specified. Both sides can represent the same choice data; both have axiom systems;
  the empirical literature finds the effect in some elicitation formats and not others,
  and sometimes reverses for losses. My working hypothesis is that the impasse persists
  because three different questions are being run together: (1) a formal question
  about representability (can the choices be represented as expected utility over
  some state space?), (2) an empirical question about how robust and coherent the
  choice pattern actually is, and (3) a normative question about what rationality
  demands when probabilities are not given. But I''m not confident in that partition,
  and I''m not sure which question is doing the real work. I want a diagnosis of the
  disagreement, not a survey. Specifically: what kind of disagreement is this — verbal,
  empirical, formal, or normative — where exactly do the two sides talk past each
  other, and what would count as progress given your diagnosis? Is there a result
  or experiment that could settle the live part of it, or is the appearance of a single
  debate an illusion created by a shared example?"


  This is very good. It''s in the weeds, self-contained (describes the paradox), no
