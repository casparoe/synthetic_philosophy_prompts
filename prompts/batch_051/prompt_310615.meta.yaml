  Prompt idea:


  "I''m a PhD student in economics working on decision theory. A question that keeps
  coming up in our reading group is why the debate over the Ellsberg paradox and ambiguity
  aversion has remained unresolved for sixty-plus years. On one side, expected-utility
  orthodoxy treats the Ellsberg choices as a violation of the sure-thing principle
  and hence as irrational, or at least as inconsistent with a coherent subjective
  probability. On the other side, a large literature — starting with Schmeidler''s
  Choquet expected utility and Gilboa and Schmeidler''s maxmin expected utility, through
  Klibanoff, Marinacci, and Mukerji''s smooth ambiguity model — treats ambiguity aversion
  as a legitimate, modelable preference that a rational agent can have. Both sides
  can account for the same choice patterns; both sides have axioms; and the empirical
  literature keeps finding that the effect survives in some settings and disappears
  or reverses in others. My working hypothesis is that this isn''t one debate but
  several running under one name: (a) an empirical question about how robust the choice
  patterns are, (b) a formal question about whether Ellsberg-type choices can be represented
  as maximizing expected utility with respect to some probability, and (c) a normative
  question about what rationality requires when probabilities are not given. But I''m
  not sure that''s right, and I''m not sure which of these, if any, is the real bottleneck.
  I''d like a diagnosis of the structure of the disagreement rather than a survey
  of the models. Specifically: what kind of disagreement is this — verbal, empirical,
  formal, or normative — and is there any result, experiment, or distinction that
  could actually settle the relevant part of it, or should we expect the debate to
  remain permanently unresolved because the two sides are answering different questions?"


