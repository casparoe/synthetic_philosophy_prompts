  Classroom activity on source criticism:


  Setting: undergraduate intro to historiography or high school history class, ~24
  students, 75 minutes. Personal angle: teacher recently got burned — their class
  debated what happened in an incident and kids just believed the loudest account;
  or the teacher themselves realized they''d repeated an account and only later learned
  it traced to a single biased source.


  Activity: Stage a disputed event. Ideas:

  - Have a 90-second event happen in the hallway outside the room (a confederate spills/breaks
  something / an argument). Students inside can''t see it; a few are positioned as
  "witnesses." Or show a brief video to only some.

  - Then the "sources" are generated: each witness writes an account; accounts get
  retold through 2-3 intermediaries (telephone); one source writes 30 minutes later
  after being prompted by a friend; one "official" source writes a polished summary
  that quietly edits.

  - Students in small groups receive different bundles of sources (some have only
  the polished official account, some have a fragment, some have an eyewitness + hearsay).
  They reconstruct what happened. Groups compare. The "true" event is then revealed
  by the facilitator (video or the confederates'' pre-written ground truth), and everyone
  sees which source features predicted accuracy.


  Debrief maps to source criticism: distance in time, chain of transmission, motive/interest,
  genre/audience (public inscription vs private letter), consistency vs independence
  (two witnesses who talked to each other aren''t independent), and "the best source
  isn''t always the most vivid one." Also an honest note: the activity can''t reproduce
  the scale of temporal distance or the survival problem — in real history, the ground
  truth is unrecoverable, whereas here we reveal it, which may misleadingly teach
