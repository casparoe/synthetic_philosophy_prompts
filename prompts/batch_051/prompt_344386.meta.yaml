  Let me restate Wolf''s actual claims:

  - The moral saint is a person whose every action is as morally good as possible.

  - Wolf distinguishes two kinds: the Loving Saint (acts from love; her own happiness
  lies in the happiness of others) and the Rational Saint (acts from duty; sacrifices
  non-moral interests).

  - Her claim: neither is an attractive ideal of personal well-being. The Loving Saint
  is dull/bland because her interests are all moral; the Rational Saint is grim/self-denying.

  - But she does NOT conclude that we have no reason to be moral, that moral considerations
  aren''t overriding, or that the saint''s acts are not admirable. She concludes that
  the point of view of individual perfection is distinct from the moral point of view,
  and that moral sainthood is not what we should aim for in trying to live well.


  So in the summary, the popularizer overstates: "trying to be morally perfect is
  not just unappealing but something we have no reason to do, and we should be suspicious
  of the idea that morality deserves to dominate our lives." That conflates personal
  ideal with all-things-considered reasons/morality''s authority. That''s subtle and
  good.


  Also, maybe the summary says "such a person would have to be constantly pleasant,
  selfless, and devoted to others" — This is not exactly: Wolf''s Loving Saint might
  be pleasant; the Rational Saint is not. Not major.


  Another subtle error: "boring, humorless, and incapable of taking real joy in art,
  music, or relationships." Wolf''s claim is about lack of non-moral interests and
  non-moral virtues, and she often puts it conditionally: the saint''s life would
  be "strangely barren" because of what it excludes; but she doesn''t assert sainthood
  makes one incapable of joy in relationships, nor that a saint must be humorless
