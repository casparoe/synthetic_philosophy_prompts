  ---


  Consider two people, one of whom is about to receive a mug and the other of whom
  is about to lose one, where the assignment of who gets which position is made by
  a coin flip. If you ask the receiver how much she would pay to keep the mug and
  the loser how much he would accept to give it up, the answers diverge sharply: the
  price to give it up is reliably higher than the price to obtain it, even though
  the mug is the same object and the ownership that separates the two positions was
  assigned minutes ago by chance. The same person, moved from the buyer''s position
  to the seller''s position, gives both answers. This is the asymmetry I want to examine:
  a loss counts for more than an equal gain, and the reference point — what one happens
  to have at the moment — seems to do the counting.


  The same asymmetry appears in judgments we take much more seriously. A $100 fine
  feels worse than a $100 bonus that never arrives. A person who would never pay $20,000
  to secure a view from her window may nonetheless refuse $20,000 to give that view
  up. We grieve the loss of an object far more than we would celebrate acquiring an
  identical one. And legal systems often encode the distinction: the state must generally
  compensate a person when it takes away a right or asset, but not when it declines
  to confer a benefit of equal value.


