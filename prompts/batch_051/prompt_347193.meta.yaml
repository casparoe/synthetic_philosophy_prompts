  Draft:


  "I''ve been reading informally about a philosophical position called inferentialism,
  which holds roughly that the meaning of an expression is not a thing it stands for
  but its inferential role: the pattern of what it commits you to and what follows
  from it. This made me wonder how one would test it against a real system. Imagine
  two implementations of the same natural-language interface. Externally, the two
  systems produce byte-for-byte identical responses to every input in the test suite,
  and they will continue to do so for every input we can generate. Internally, however,
  System A derives its answers by applying explicit inference rules — modus ponens,
  conditional proof, contradiction rules — while System B gets the same answers by
  consulting an enormous lookup table that was built to match System A''s outputs,
  with no mechanism corresponding to inference. According to inferentialism, there
  is a genuine semantic difference between these systems: A''s states mean something
  in virtue of the inferences they participate in, while B''s do not, or at least
  do not mean the same thing. Is that difference detectable in principle by any empirical
  test, given that the two systems are output-identical? Design the strongest test
  you can of the claim that A''s outputs are meaningful while B''s are not (or that
  A and B differ in meaning). Say what result would count for the claim, what result
  would count against it, and what even a decisive result would fail to settle about
  the relationship between meaning and inferential role."


