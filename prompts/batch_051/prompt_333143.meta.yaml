  "what if everyone did that?" logic — the general question. The domain says "Hare,
  Singer, and the logic of ''what if everyone did that?''" This includes the simple
  universalization test. A classic objection: "what if everyone did that?" is fallacious
  when applied to actions whose rightness doesn''t depend on everyone doing them (e.g.,
  "I''ll be a farmer" — if everyone were a farmer that''d be bad, but it doesn''t
  make being a farmer wrong). Or "I won''t have children" — if everyone did that,
  extinction, but not wrong. This is the sort of case that separates sloppy universalizability
  from Kant/Hare/Singer. Kant''s response: act from a maxim, and the relevant maxim
  is not "be a farmer" but something like "pursue a livelihood I''m suited to when
  there''s social demand" — universalizable. Hare: universalize the exact choice,
  and if everyone chose to be a farmer... hmm, Hare''s universal prescriptivism handles
  this via roles: "what if everyone in exactly my situation did that" — if everyone
  in my situation became a farmer, the situation wouldn''t sustain that, but the logic
  isn''t outcome-based alone.


