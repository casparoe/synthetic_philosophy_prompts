  "I''m a software engineer with no formal training in philosophy, and I''ve been
  reading Newton''s Principia for a personal study project. In the Definitions, I
  ran into this passage:


  [quote]


  This pushed me into the absolutism/relationism debate: Newton argues (I gather)
  that there is a distinction between true and apparent motion, and that to make sense
  of rotation and acceleration you need absolute space, not just relative positions.
  Leibniz and Mach seem to deny that; Einstein''s general relativity seems to complicate
  it further.


  I''d like your actual credence in the proposition that absolute space (or spacetime,
