  Possible final text:


  "Next month I am presenting a paper at a workshop whose audience is roughly half
  formal epistemologists and half applied statisticians; nearly all of them are sympathetic
  to Bayesianism, and several are actively hostile to inference to the best explanation
  as anything more than a heuristic. My thesis is a deliberately narrow one. I defend
  a restricted version of IBE: when two models fit the available data exactly equally
  well and have been assigned equal likelihoods, a model may still receive a modest
  evidential boost from being the best explanation in a pre-specified sense — the
  sense given by a fixed list of explanatory virtues (simplicity, unity, and precision
  of mechanism) that is announced before the data are examined. I argue that this
  boost is not merely pragmatic and cannot be absorbed without remainder into subjective
  priors, because the virtues function as objective constraints on the class of rational
  priors; but I explicitly deny that the best explanation is therefore likely to be
  true in any strong sense, and I avoid any claim about scientific realism.


  My talk will briefly sketch the argument: (1) there are real, recurring cases in
  model selection where likelihoods are equal and the only discriminator is explanatory
  virtue; (2) a Bayesian who claims the virtue was already in the prior must either
  exhibit the prior by a method that does not merely re-describe the conclusion, or
  admit that the prior was set by explanatory considerations; (3) if explanatory considerations
  set the prior, then IBE has evidential force downstream, which is all I need.


  Prepare me for the question period with a prep sheet rather than a polished defense.
  I want the six to eight objections I will actually get from this audience — phrased
  the way a formal epistemologist or statistician would actually put them, each with
  a two-minute spoken reply, each with a note on where the reply is weakest, and ordered
  by how likely and how damaging they are. Some of them will push on double-counting,
  some on the underdetermination of which virtues count, some on a case where the
  simpler model is the worse predictor, and at least one on the slide from ''good
  enough for this workshop''s standards'' to ''truth-conducive.'' Include the question
