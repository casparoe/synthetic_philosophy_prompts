  ---


  I am a novelist. In my current book, a character gives a long monologue arguing
  that natural selection is, in the end, only gradient descent on fitness, and that
  this explains why living things look like improvisations rather than well-engineered
  machines. I want the argument he gives to be as strong as possible, but I also want
  the reader to be able to see where a knowledgeable opponent would push back. Could
  you assess the argument step by step?


  The character''s argument, as drafted:


  (1) Natural selection changes allele frequencies by differential reproduction: an
  allele spreads when carriers leave more viable offspring than the population average,
  and retreats when they leave fewer.


  (2) In the idealized textbook population — random mating, no mutation, no migration,
  no drift, constant genotypic fitnesses, no frequency-dependent effects — the change
  in mean population fitness from one generation to the next equals the additive genetic
  variance in fitness divided by mean fitness. Since that variance is nonnegative,
  mean fitness never decreases under selection alone.


  (3) Gradient ascent is the algorithm of moving a point in small steps in the direction
  of locally steepest increase of an objective function. Its basic limitation is local
  greed: it cannot look over a valley to a higher peak, and it can be trapped by any
  local maximum.


  (4) It follows from (2) that natural selection, in this idealized model, moves the
  population uphill in mean fitness and only uphill.


  (5) So, in this model, natural selection just is gradient ascent on mean population
  fitness.


  (6) So, in this model, natural selection cannot cross a fitness valley to reach
  a higher peak, and can only reach whichever local peak is reachable by uphill steps.


  (7) The real process differs from the model chiefly by adding mutation, drift, migration,
  recombination, and frequency-dependent selection. Mutation and drift are small corrections;
  recombination only reshuffles existing alleles; frequency-dependent effects change
  the landscape but do not make a non-gradational process gradational.


  (8) Therefore real natural selection has the same valley-crossing limitation as
  gradient descent: it is a stupid optimizer, and real organisms should be read as
  local peaks of fitness, not as solutions designed from the global top down.


  I drafted the character''s conclusion as (8) because it suits his personality, but
  I suspect the argument either fails at a specific step or succeeds only under a
  much narrower reading than the monologue gives it. Please tell me, by numbered step,
  which claims are solid, which are false, and which are true only under an unstated
  condition. In particular, is the move from (2) to (5) legitimate, and is the move
  from (6) to (8) legitimate? If the argument can be repaired by adding a premise,
  give me the weakest premise that makes it valid, and say whether that premise is
  true. Where people who work on this genuinely disagree, please say so rather than
  presenting one side as settled.


