  Let me craft a step-by-step argument about evolution as a stupid optimizer. Something
  like:


  Background: Natural selection increases frequency of variants with higher relative
  fitness. Gradient descent moves parameters in direction of negative gradient of
  a loss function. Claim: natural selection is a kind of gradient descent on a population''s
  mean fitness, and therefore inherits its limitations: it is local, greedy, and can
  get stuck in local optima; so we should not expect organisms to be globally well-designed.


  Possible argument steps:

  1. In each generation, allele frequencies change proportionally to the relative
  fitness of the alleles (the "replicator dynamics" / Price equation).

  2. The direction of that frequency change is the direction in which mean population
  fitness increases most steeply under certain conditions (Fisher''s fundamental theorem:
  the change in mean fitness is proportional to additive genetic variance).

  3. Gradient descent follows the local steepest descent direction in parameter space
  and can stall at local optima, saddle points, and plateaus.

  4. Therefore natural selection is a gradient-ascent process on mean fitness.

  5. Therefore natural selection moves populations only "uphill" in small steps, can
  only reach the nearest local fitness optimum, and cannot jump fitness valleys to
  find higher peaks.

  6. Therefore evolution is a stupid optimizer, and we should expect organisms to
  be satisficing local optima rather than well-designed.


