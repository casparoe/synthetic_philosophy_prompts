  Student answer (mixed):


  "Friedman''s claim, often called the F-twist, is that a model should be judged solely
  by its predictive success for the class of phenomena it is designed to explain,
  and not by how realistic its assumptions are. He supports this by noting that a
  good theory abstracts from many details; indeed, the more phenomena a theory covers,
  the more it must leave out, so significant theories will tend to have highly unrealistic
  assumptions. For example, a billiard player need not know the laws of physics in
  order for us to predict her shots as if she solved the relevant equations. When
  a model''s assumptions are descriptively false but its predictions are accurate,
  criticizing the assumptions for being unrealistic is like refusing to use a map
  because it is not the terrain. The main objection is that if the assumptions misdescribe
  the causal mechanisms, then the model''s success may be accidental or confined to
  the observed data, and it will lack the kind of understanding that science should
  provide. Against this, Friedman''s view has a decisive reply: because the model
  predicts well, its assumptions must be at least approximately true in the respects
  that matter for the modeled phenomena; hence the success is not accidental. Therefore
  the objection fails."


