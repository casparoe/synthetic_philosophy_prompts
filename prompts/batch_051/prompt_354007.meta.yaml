  Let me recall Friedman''s "The Methodology of Positive Economics" (1953). Key ideas:

  - Positive economics is (or should be) an objective science, in principle independent
  of normative judgments, about "what is," not "what ought to be."

  - A theory''s purpose is to generate valid and meaningful (not truistic) predictions
  about phenomena not yet observed.

  - A theory is to be judged by its predictive power for the class of phenomena it
  intends to explain.

  - The realism of assumptions: Friedman argues that "truly important and significant
  hypotheses" have "assumptions" that are "wildly inaccurate descriptive representations
  of reality"; in general, the more significant the theory, the more unrealistic the
  assumptions (F-twist). The reason: a hypothesis is important if it explains much
  by little—abstracts from many details.

  - Testing the "realism" of assumptions separately is misguided because assumptions
  are themselves often about ideal types; a theory can''t be tested by comparing its
  "assumptions" directly with reality. What matters is whether the model works "as
  if" agents behaved as the assumptions say; e.g., leaves as if maximizing sunlight,
  expert billiards players as if computing optimal trajectories.

  - But there''s ambiguity: "assumptions" variously mean (i) the abstract model''s
  postulates (e.g., perfect competition), (ii) the conditions under which the theory
  is held to apply, and (iii) the assumptions used as a short-hand for testable implications.
  Musgrave''s critique distinguishes "negligibility assumptions" (assuming some factor
  is negligible), "domain assumptions" (specifying applicability), and "heuristic
  assumptions" (false but simplifying steps). This is in the weeds and would be excellent
  for a student answer mistake. But small LLMs might not know Musgrave. I can still
  use the distinction without naming it.


