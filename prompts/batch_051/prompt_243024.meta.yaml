  mock: a formal rule laid down in advance about how you''re allowed to collect and
  analyze data, with the implication that doing it any other way is epistemically
  suspect. He thought method-talk was usually a rhetoric of legitimation and that
  major science advances precisely by breaking the accepted rules. On the other hand,
  the open science people aren''t defending a single monolithic scientific method;
  they see preregistration as a fix for a specific, documented failure mode (p-hacking,
  HARKing, file-drawer effects), not as a philosophy of how discovery works. And you
  could even read Feyerabend as predicting the replication crisis, in a loose sense:
  if methodology is mostly post-hoc storytelling and scientists do whatever works,
  then what gets published will track incentives and fads more than any shared rational
  procedure. So what''s the best Feyerabend-style verdict? Would he have said preregistration
  is a harmless bureaucratic fix for a narrow problem, a new form of authoritarianism
  in science that mostly props up a false picture of how science actually works, or
  something weirder? Give me your best reconstruction of what he''d say and where
