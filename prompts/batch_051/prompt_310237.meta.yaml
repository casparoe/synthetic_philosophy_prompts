  Potential prompt:


  "I have spent enough time in the rationalist-and-adjacent econ-adjacent blogosphere
  to feel like I should be an expected-utility fundamentalist. The axioms of von Neumann–Morgenstern,
  and in particular the independence or ''sure-thing'' principle, seem to me to be
  the only thing standing between decision theory and a pile of ad hoc patches. If
  you violate independence, I can usually build a money pump or dynamic inconsistency
  out of you, and I want to know how your non-EU preferences specify what stays constant
  across contexts. So far so good.


  Then I reread the passage in Maurice Allais’s 1953 Econometrica article where he
  introduces his two-pair choice problem. (I’m thinking of the version where the first
  choice is between a sure 100 million old francs and a lottery giving 500 million
  with 0.10, 100 million with 0.89, and nothing with 0.01; the second is between a
  lottery giving 500 million with 0.10 and nothing with 0.90, and another giving 100
  million with 0.11 and nothing with 0.89.) I find the predicted violation in myself,
  not as a social-science observation but as a first-person normative pull: I want
  the sure thing in the first pair and the slightly higher chance of the large prize
  in the second pair. The independence axiom says that if I prefer the sure 100 million
  to the 0.10/0.89/0.01 lottery, then I should prefer the 0.11/0.89 lottery to the
  0.10/0.90 lottery; but I don''t. The stated ''common consequence'' canceling 0.89
  chance of 100 million feels like a sleight-of-hand because the 0.89 sits in different
  branches.


  This is the classic clash. But I want a negotiated verdict, not a side. Which should
  yield: the axiom or the intuition? Present the strongest case for treating my Allais
  preference as a cognitive illusion to be debunked (certainty effect, regret, scope
  insensitivity, framing, insurance/status quo biases) and the strongest case for
  treating it as tracking something real about risk that expected utility misses (the
  special value of certainty, the separateness of the branches, the failure of linearity
  in probabilities). Walk me through what each concession costs. If I keep the axiom,
  what do I have to believe about my own mind, about money pumps, and about why the
  intuitive difference is not a reason? If I amend the theory to fit the intuition,
  what is the most conservative non-EU model that does so, and what does it give up
  in aggregation, dynamic consistency, and decision-theoretic clarity? I would especially
  like an assessment of the standard rationalist move that says the intuition is a
  scope-insensitivity or certainty-effect artefact and should not be listened to:
  is that a real debunking argument or just a refusal to take the content of the intuition
  seriously? Conclude with either a reading on which the axiom and the intuition can
  both survive, or a clear statement of which one you would give up and what would
  have to be true for you to reverse that."


