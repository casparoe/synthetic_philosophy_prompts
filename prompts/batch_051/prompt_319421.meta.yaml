  contradictions" and is asked "Is it true that there are true contradictions?" then
  by the dialetheist''s own lights it might be both true and false; does accepting
  dialetheism undermine the assertion itself? The dialetheist can say some contradictions
  are true but not all; they don''t accept every contradiction; they distinguish between
  dialetheias and trivialism.


