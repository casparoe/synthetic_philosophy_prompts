  The debate: "Genetic information." Maynard Smith (2000) distinguished two concepts
  of information: (a) information in the Shannon/causal sense — correlation; (b) semantic/intentional
  information — requires meaning, aboutness. He argued genes carry both: DNA sequence
  correlates with protein sequence (causal), and has intentional/semantic information
  because of natural selection (teleosemantic: the function of the gene is to specify
  the protein). Critics (Griffiths 2001, Sarkar 1996) argue that "genetic information"
  is only a metaphor or that genes contain information only in the causal sense, not
  semantic; the semantic reading is misleading. There''s also the parity objection:
  many things in development carry information (maternal cytoplasm, environment),
  so genes aren''t special. Godfrey-Smith has nuanced views.


