  Pressed points in the literature against BSC:

  1. Bacteria/archaea, HGT: no true populations with gene flow boundaries; species
  as ecotypes; genomic coherence.

  2. Obligately asexual organisms (bdelloid rotifers, many fungi, parthenogenetic
  plants/animals): no interbreeding, BSC says no species or can''t apply.

  3. Ring species (Ensatina salamanders, greenish warblers): adjacent populations
  interbreed but ends don''t; transitivity of "potentially interbreeding" fails when
  ends co-occur.

  4. "Potentially" interbreeding: modal overreach — what does potential mean? Zoo
  matings? If populations are spatially separated but would interbreed if in contact,
  are they same species?

  5. Reproductive isolation as a criterion vs lineage divergence: BSC defines species
  by isolation, but isolation can be a byproduct of divergence (or lineage identity)
  rather than the thing that makes a species.

  6. Temporal species / chronospecies in paleontology: BSC is inapplicable to fossils;
  species in time as arbitrary segments.

  7. Species as individuals (Ghiselin/Hull) vs classes: Mayr''s BSC fits the "species
  are individuals" view, but the interbreeding criterion might not pick out individuals.

  8. Hybridization in nature (many plants, some animals): if taxa hybridize but maintain
  distinctness (e.g., coyotes/wolves? or Heliconius? oaks), does BSC collapse them
  into one species?

  9. Allopatric populations: BSC asks about potential interbreeding, untestable.


  The standard replies of a BSC defender (not necessarily Mayr''s exact):

  - Hard cases are exceptions; no concept handles everything, BSC handles the majority
  of sexually reproducing eukaryotes.

  - Asexuals: a species category still applies; can borrow morphological/ecological
  criteria, or asexuals don''t form species in the same sense.

  - Ring species: rare, and the ends that co-occur and don''t interbreed are separate
  species; intermediate forms are matters of degree — it''s a boundary problem not
  a refutation.

  - Potential interbreeding: it''s a dispositional claim about barriers; in principle
  testable via experiments or genetic data.

  - HGT: bacteria may not have species in the same sense, or gene exchange networks
  are analogous to gene flow.

  - Temporal: species concepts apply to contemporary slice; paleospecies are a different
  problem.


