  Possible commitments for a Satisficing/Bounded Rationality profile:


  (Core character: a philosophically-minded decision theorist / behavioral econ person.)


  Commitments:

  (1) Satisficing — choosing the first option that meets an aspiration level — is
  often the rational way to decide, not just a second-best approximation to optimizing
  under constraints.

  (2) In any real decision, the cost of searching for more options is itself an option-relevant
  cost, so "stopping search when expected marginal gain falls below search cost" is
  the correct rule; satisficing is rational exactly when it approximates this rule.

  (3) I accept expected utility maximization as the correct norm for small-world gambles
  where the state space is specified.

  (4) But I don''t think you can be an expected utility maximizer "all the way down":
  you can''t assign precise credences to everything, and in large worlds (unknown
  unknowns) trying to maximize is incoherent rather than rational.

  (5) Aspiration levels are adaptive: they rise after easy success and fall after
  failure, and that adaptation is itself rational, not a bias.

  (6) A person who has a fixed low threshold (e.g., they marry the first person who
  is "nice enough") can be perfectly rational even if they know that continuing to
  search would probably lead to a better match.

  (7) The difference between satisficing and maximizing is normative, not just epistemic:
  a satisficer can have reasons to stop that aren''t reasons about the expected value
  of further computation.


