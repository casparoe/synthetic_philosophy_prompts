  Draft:


  "I''m heading to a workshop on bounded rationality and the organizers asked me to
  send ahead a short ''where I stand'' blurb so they can sort us into panels. I put
  this together on the train and I want a consistency check before I send it over.
  My commitments, roughly:


  (1) Satisficing is often the rational way to decide, not just a second-best fallback
  for when optimizing is too hard. Choosing the first option that clears your aspiration
  level can be fully rational.

  (2) In any concrete choice, the cost of searching for further options is a real
  cost, so the right stopping rule is roughly: keep searching as long as the expected
  improvement from another candidate outweighs what that search costs you. Satisficing
  earns its keep exactly when it tracks that rule.

  (3) For small-world decisions where the possible states, payoffs, and probabilities
  are all specified, expected utility maximization is the right norm and I don''t
  have any beef with it.

  (4) But I also think there is no such thing as being an expected utility maximizer
  all the way down. In large-world decisions, where you can''t enumerate the states,
  trying to assign precise probabilities to everything is a kind of false precision,
  and ''maximize expected utility'' stops being a coherent instruction.

  (5) Aspiration levels should adapt: after a run of easy successes you should raise
  your threshold, and after repeated failures you should lower it. That adaptation
  is rational, not just a mood thing or a bias.

  (6) A friend of mine set herself a rule for apartment hunting: take the first place
  that meets seven explicit criteria, no matter how early it appears. I think she''s
  reasoning perfectly well even though she knows a longer search would probably turn
  up something better on the margin.

  (7) I want the difference between satisficing and maximizing to be a genuinely normative
  difference: a satisficer can have reasons to stop searching that aren''t themselves
  reasons about the expected value of more computation.


