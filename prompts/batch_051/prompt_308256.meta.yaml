  ---


  I have been thinking about the dispute between Mozi''s impartial care and the Confucian
  doctrine that love is properly graded. I am drawn to Mozi''s view for its systematic
  virtues: it is a simple principle, it applies the same standard to everyone, and
  it yields a tidy decision procedure for cases where my attachments pull one way
  and need pulls another. More important, it seems to expose the arbitrariness in
  the Confucian position. Once I grant that a stranger''s welfare matters at all,
  why should the fact that someone is my mother, my friend, or my countryman give
  me a reason to favor her that is not just a description of my psychology? The Confucian
  claim that care naturally begins in the family and extends outward seems to me to
  beg the question, because that natural order of extension is precisely what needs
  moral justification rather than what supplies it.


  And yet I cannot rid myself of the conviction that I owe my mother something different
  in kind, not merely in felt intensity or convenience, from what I owe a stranger.
  If I have to choose between a substantial benefit to her and an equal benefit to
  someone I have never met, it seems to me not just permissible but required to choose
  her, and a theory that treats this requiredness as an error feels less like an account
  of morality than a failure to notice one of its central features. The Confucian
  picture also has a systematic depth I keep underestimating: it does not present
  graded love as mere favoritism but as a claim about how moral agency is cultivated
  — that the dispositions which eventually extend to strangers are formed and sustained
  through the particular, disproportionate attachments of family life, and that an
  impartial care demanded without this developmental structure would be abstract and
  ineffectual.


  I do not want to be told which side wins. I want to know what it would take for
  the intuition to be the thing that goes, what it would take for the theory to be
  the thing that goes, and whether there is a reading of care on which both survive
  — for example, one that distinguishes equal consideration at the level of justification
  from differential duties at the level of action. Is the Confucian doctrine of graded
  love a genuine moral structure that impartiality must accommodate, or is it a sophisticated
  rationalization of partiality? Tell me which move you would make first, what would
  justify each move, and what consideration would make you change your mind.


