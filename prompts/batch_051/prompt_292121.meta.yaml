  Two-envelope paradox details: You''re offered two envelopes, one contains twice
  as much money as the other. You pick one, see its amount X. The other contains either
  2X or X/2 with equal probability, so expected value of switching is (1/2)(2X) +
  (1/2)(X/2) = 1.25X > X, so you should switch. But by symmetry, the same reasoning
  would apply to the other envelope, so after switching you''d want to switch back.
  Contradiction.


  The subtle errors in a common popular summary could be: "with equal probability"
  without justification (the equal-probability assumption is not justified for all
  amounts; once you see X, the conditional probability that the other is 2X vs X/2
  is not necessarily 1/2, depending on the prior). Also conflating the "always switch
  before opening" symmetry. Another subtle point: expected value calculation assumes...
  infinite expected value issues when using improper priors. Also the paradox is sometimes
  confused with Monty Hall. A common bad summary might say "The paradox shows expected
  value theory is broken" or "the paradox shows you should always switch, but that''s
  absurd, so probability theory is inconsistent" or "the right answer is that you
  should switch because 1.25X > X."


  I could write a friend''s summary: "The two envelope paradox goes like this: there
  are two envelopes, one has twice as much as the other, but you don''t know which.
  You pick one and open it, finding $X. The other envelope is equally likely to contain
  $2X or $X/2, so its expected value is $1.25X, which is more than the $X in your
  hand. So you should always switch. But the reasoning works just the same before
  you open your envelope, which means you should just switch back and forth forever.
  The standard resolution is that your initial hunch was wrong and probability theory
