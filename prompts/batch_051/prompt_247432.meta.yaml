  Draft:


  "I retired a few years ago from a research career in the natural sciences and have
  lately been working through political philosophy. I find that my convictions about
  particular cases are much firmer than my grasp of the principle behind them. I would
  like you to help me find that principle, or tell me which of my convictions I should
  revise.


  Here are the cases and my verdicts.


  1. A researcher who uses a wheelchair after a spinal cord injury needs an adjusted
  bench, voice-controlled instruments, and a part-time assistant to continue the same
  experimental work she did before the injury. The institution would spend considerably
  more on her than on an able-bodied colleague doing the same work. I think the institution
  should pay these costs.


  2. A colleague insists that he can only do his best work if the department buys
  him a particular imported espresso machine and gives him a quiet office with a view
  of the hills. Without them he is merely competent; with them he is excellent. He
  says his case is structurally identical to (1). I do not think equal concern requires
  the department to buy the espresso machine or the view, even though they would raise
  his performance.


  3. A postdoc with a chronic pain condition has adapted so completely that she sincerely
  reports being just as satisfied with her life as anyone else. But she has quietly
  given up fieldwork, conference travel, and evening work; her days are shorter and
  her options are narrower than they were. I think she is still owed something—schedule
  flexibility, a lighter teaching load, or extra support—despite her satisfaction.


  4. Two incoming graduate students have the same measured talent. One arrives from
  a well-resourced background and is already fluent in the methods; the other arrives
  from a background with far fewer opportunities and must spend the first year catching
  up. I think equal concern requires giving the second student extra tutoring and
  an extended timeline, rather than treating the two identically from the first day.


  5. A senior scientist has a rare combination of skills and is close to a result
  of great public importance, but he has developed a condition that is expensive to
  treat. A junior technician has the same condition and the same prognosis, but her
  work is competent and easily replaced. My instinct is that the senior''s treatment
  may properly be prioritized, though I am uneasy about this and cannot tell whether
  it follows from any principle of equality or is an entirely separate consideration.


  6. A colleague is persistently discontented by temperament. He is healthy, secure,
  and respected, but he reports low satisfaction and argues that equal concern requires
  spending whatever is needed—therapy, sabbaticals, a different role—until his satisfaction
  matches the average. I do not think equal concern requires this, but I cannot articulate
  the difference between his case and (3).


  My working hypothesis is that what we should equalize is not how satisfied people
  feel, and not how much money or assistance they receive, but the range of genuine
  options open to them—what they are actually able to do and be. But I am not sure
  this hypothesis survives cases (2) and (5), and perhaps it mishandles (6).


  Please state the principle or small set of principles that best captures these verdicts,
  precisely enough to be applied. Tell me which of my verdicts it cannot accommodate,
  and which you would overturn and why. Then apply the principle you settle on to
  a case I have not listed: a researcher whose productivity is limited not by any
  medical condition but by the need to care for an aging parent, and who asks for
  the same accommodations as the researcher in (1)."


