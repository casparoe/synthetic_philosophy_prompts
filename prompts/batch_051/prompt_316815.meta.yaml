  ---


  Two friends of mine got into an argument over dinner about eating animal products
  that would otherwise go to waste; I mostly listened. They''ve both been vegan for
  years, and neither one disputes the case against buying meat, dairy, or eggs from
  factory farms. Here is roughly how it went.


  (1) The first said it is obviously fine — maybe even better than wasteful — to eat
  animal products when doing so creates no additional demand: dumpstered meat and
  dairy that a store has already discarded, a deer hit by a car, eggs laid by rescued
  hens who are already being cared for as companions. In each case the animal (or
  product) is already there; the question is only whether it rots or gets used, and
  using it doesn''t hurt or exploit anyone. To let edible nutrition rot for the sake
  of a principle with no victim is just fetishizing purity.


  (2) The second replied that this treats animal bodies and secretions as "free resources"
  once the damage is done, and that is precisely the attitude veganism has to combat.
  Even if this particular act doesn''t change the market, it trains the appetite to
  keep seeing animals'' bodies as food, it blurs the line one needs to stay vegan
  ("I don''t eat animal products... except when it''s free, or already dead, or would
  be wasted"), and visible exceptions make other people think there''s no coherent
  position here. The vegan rule isn''t only about marginal harm; it''s also about
  refusing the practice of using animals as things.


  (3) The first answered that this replaces a clear line — don''t cause death and
  suffering, don''t create demand — with a much vaguer one about what "counts as using
  as a thing," and it does so at a real cost: the rescue hen''s egg is not a victim,
  the road-killed deer is not a victim, the dumpstered yogurt is not a victim. If
  a rule prohibits all three, then it has stopped being about the animals and started
  being about the purity of the human''s self-image. And the "visible exception" worry
  is an argument for discretion (don''t eat dumpstered steak in public), not for a
  ban.


  (4) The second replied that the insistence on finding a victim in each particular
  case is exactly the mistake: some reasons are about the kind of life you''re building
  and the kind of relationships you have with animals. We don''t usually think it''s
  fine to eat a dog who died of old age, even though the dog isn''t a victim and nothing
  is wasted by burying it — because how we treat the bodies of creatures says something
  about how we regard them. If the first person would flinch at eating the family
  dog but not at eating a road-killed deer, the difference isn''t a principle about
  harm; it''s just comfort and species habit, which is the very double standard veganism
  was supposed to get rid of.


