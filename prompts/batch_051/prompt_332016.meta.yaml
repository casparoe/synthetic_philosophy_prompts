  Prompt:


  I am reading Plato''s Laws in an ancient philosophy course, and we have been working
  through the section in Book 1 where the Athenian Stranger argues that the institution
  of the symposium, with wine drunk under prescribed rules, should be treated not
  as ordinary indulgence but as a way of eliciting what is ordinarily hidden in a
  person''s character. As my instructor summarized the argument: drunkenness lowers
  the inhibitions that normally protect a person''s self-presentation, and so the
  drinking party becomes a controlled means of exposing the soul to its own weaknesses;
  a good legislator can use this to train citizens toward modesty and self-command.
  I understand the general idea, but I want to test how far it goes.


  Now vary the setup: Suppose the same symposium is held, with the same wine, the
  same rulers of the party, and the same aim of training the soul, but the participants
  are told that the purpose is simply relaxation and hospitality — they are never
  informed that they are being observed for signs of shamelessness or incontinence.
  Does the argument for the wine-test still go through, or does its whole force depend
  on the participants knowing that they are being tested? Could it be, on Plato''s
  own assumptions, an even better test when the subjects do not know, or would the
  deception introduce a defect in the educational function of the practice? Work through
  what the Athenian would have to say.


