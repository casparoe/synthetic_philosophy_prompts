  Let me think about domain: The dogmatism paradox. The paradox: if I know P, then
  I know any evidence against P is misleading; so I can disregard counterevidence
  to P without loss. Standard formulation: Suppose I know H. For any E that would
  disconfirm H, I know E is misleading (because H true). So I can rationally ignore
  E. Harman: knowledge based on reasoning; if you know H via some reasoning, and encounter
  counterevidence E, you should reconsider premises. The paradox formalized in epistemic
  logic (Kripke 2011?). A rule: if S knows P, S is justified in ignoring future evidence
  against P. This conflicts with fallibilism/open-mindedness.


