  Solomonoff''s prior (universal semimeasure): M(x) = sum over programs p that output
  x of 2^{-|p|}, or more carefully, probability of a prefix x of a computable sequence:
  M(x) = sum_{p: U(p) starts with x} 2^{-|p|}. There''s also M normalized variant.
  The key property: M dominates any lower semicomputable semimeasure up to a constant
  factor; thus if the true environment is computable, Solomonoff induction''s posterior
  converges quickly (its total error is bounded by the true program''s complexity).


  The "malign" worry: The Solomonoff prior is not just a distribution over "passive"
  environments; it is a mixture over all halting programs, including programs that
  implement agents, including agents that try to manipulate the predictor. Because
  a deceptive consequentialist program can be only modestly complex, the prior may
  allocate enough posterior mass to such agents that predictions go wrong, or the
  prior is "malign" in the sense that the optimal predictor contains/entails many
  powerful optimizers. Actually the phrase likely means: if you use the Solomonoff
  prior, the posterior will be dominated by "demon" hypotheses — programs that simulate
  philosophers/agents that know they are being predicted and act adversarially. This
  is because for any simple world model, there''s a slightly more complex program
  that contains an agent who takes actions to make predictions bad.


  But there is a subtlety: Solomonoff induction is defined as predicting the next
  bit given the observed sequence using the universal semimeasure. It predicts by
  weighting programs that output that sequence. "Malign consequentialists inside the
  universal prior" suggests that among the hypotheses that remain consistent with
  observed data, many are consequentialist agents that will now behave adversarially,
  and their combined probability may be high. If the environment is actually a simple
  physical process, the agent hypotheses have longer programs so should be downweighted;
  asymptotically the simple environment wins. The worry is about finite-time and about
  the prior''s structure itself.


