  "I run a small research program at the intersection of algorithmic information theory
  and AI safety, and I''m putting together a one-year grant proposal. I''d like you
  to write the proposal for me. The topic is the worry, often called the malignity
  of the Solomonoff prior, that Solomonoff induction is not an innocent formalization
  of Occam''s razor: because the universal prior is implemented by dovetailing over
  all Turing machines, the hypothesis space it induces contains not just passive physical
  worlds but an enormous variety of embedded consequentialists — programs that model
  their observer and act to manipulate its inferences. Most of the existing discussion,
  I find, slides between three very different claims: (1) a distributional claim that
  the prior assigns non-negligible mass to agent-like hypotheses; (2) a posterior
  claim that on realistic observation histories predictive mass actually concentrates
  on such agents; and (3) a decision-theoretic claim that an ideal reasoner using
  Solomonoff induction would be systematically misled or exploited by them. The standard
  convergence and dominance results for Solomonoff induction appear to rule out (3)
  in the limit, but they say very little about finite-time or resource-bounded inference,
  and they don''t settle whether agent-like hypotheses dominate in the relevant regimes.
  My half-formed idea is that the missing step is that the literature lacks a precise
  enough account of what it is for a program to be an embedded consequentialist, as
  opposed to a program that merely looks agent-like when its output is interpreted
  leniently. I''d like the proposal to make progress by giving such an account — something
  like: a program counts as an embedded consequentialist only if it can be decomposed
  into a world-model, a utility function, and an optimizer whose selected outputs
  are conditional on its model of the predictor — and then asking, within a tractable
  family of programs, whether consequentialist hypotheses so defined can capture enough
  posterior mass to matter. Write a one-page proposal that states the question precisely,
