  over-split and we never accumulate the ten cases that would have made a rare mechanism
  visible. Right now we mostly go by failure codes and the component named in the
  report, which I know is wrong: the same corrosion process can show up in different
  components with different codes, and two completely different mechanisms can kill
  the same bearing.


