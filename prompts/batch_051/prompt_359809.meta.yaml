  The target is the epistemological debate around what is called the bootstrapping
  problem and easy knowledge, as it arises for process reliabilism. As I understand
  it, reliabilism says a belief is justified just in case it is produced by a process
  that is in fact generally reliable. The bootstrapping worry is then: a subject with
  reliable color vision can look at a wall, believe it is red, and reason that since
  the wall is red and it looked red, her color vision got this case right; after enough
