  Candidate criteria:

  1. Reconstruction: The ability to produce the proof from memory, filling in routine
  steps, without external prompts.

  2. Key-move identification: The ability to state in a sentence or two the central
  idea or the one or two non-routine moves on which the proof turns.

  3. Transfer: The ability to recognize when the same technique or proof strategy
  applies to a novel theorem, and to adapt it successfully.

  4. Flaw detection: The ability to detect an error in a subtly modified version of
  the proof and locate the step that fails.

  5. Hypothesis necessity: The ability to show, for each hypothesis, that the theorem
  can fail without it, by supplying or sketching a counterexample (or explaining why
  the step in the proof that uses it would break).

  6. Modification and generalization: The ability to vary the theorem — strengthen
  the conclusion, weaken the premises, extend to a new setting — and to adjust the
  proof accordingly.


