  Salient facts about Nixon shock:

  - Under Bretton Woods (1944), currencies pegged to USD; USD convertible to gold
  at $35/ounce for central banks.

  - By late 1960s, US inflation, trade deficits, foreign dollar holdings exceeded
  gold reserves; runs on gold.

  - Aug 15, 1971, Nixon announced suspension of dollar convertibility to gold, wage-price
  freeze, 10% import surcharge. This ended gold''s official monetary role; currencies
  floated over next years.

  - Expectations: dollar crisis, loss of reserve status? Actually the system moved
  to fiat; dollar remained dominant reserve currency; no collapse in trade; inflation
  in 1970s partly blamed on lack of discipline.


  Berkeley''s view (paraphrase):

  - Money is not wealth itself but a "ticket or counter" — a circulating claim by
  which wealth (real goods, labor) is transferred.

  - The notion that gold/silver are intrinsically the measure of wealth is a kind
  of superstition; the key is that tokens be accepted, circulate, and call forth industry.

  - He proposed paper money for Ireland (a national bank) to overcome scarcity of
  coin. Money is a social mechanism; its value derives from agreed use and the productivity
  it mobilizes.


  Now the analysis:

  - Berkeley predicts: dropping the gold link need not destroy money; if people accept
  paper as ticket, trade continues; the doom predictions mistake the counter for the
  thing counted.

  - Episode confirms: fiat dollar continued to function, international payments didn''t
  collapse, dollar stayed central. So gold was never what made the system work; it
  was the circulation/confidence.

  - What it misses: the period under Bretton Woods wasn''t purely a fetish; gold served
  as an external discipline on inflation and as a coordination device among sovereign
  states with no common authority. After 1971, the system didn''t simply become "rational
  tickets"; it became a managed fiat system where credibility had to be manufactured
  institutionally (Fed, Treasury market, central banks). Berkeley''s account underestimates
  the problem of trust: why should a counter be accepted at par when a state can create
  more? Gold''s "prejudice" did real work as a commitment technology. So episode is
  neither pure confirmation nor refutation: it vindicates the idea that money is a
  socially sustained claim on goods, but shows that the social part needs institutions,
  not just agreement that tokens are counters.

  - Also Berkeley might underweight distributional effects: the value of a counter
  depends on who controls issuance; gold''s impersonal constraint limited sovereign
  discretion — which can be seen as an actual feature, not just superstition.

  - Where the model breaks: Berkeley can''t explain why a "mere ticket" couldn''t
  simply be redesigned painlessly: the 1970s inflation and Volcker shock show that
  credibility is a slow-built asset and that the counter''s value depends on expected
  future issuance; his "ticket" metaphor treats money as static label rather than
  a dynamic equilibrium of expectations. Also the dollar''s continued dominance suggests
  hierarchy/network effects (invoicing, debt denomination), not just circulation of
  an agreed counter.


  The asker can ask: "What would Berkeley have predicted about the Nixon shock? Which
  parts of the episode does the ticket/counter picture explain and which does it misdescribe?
  And what does the episode teach us about where that picture leans too hard on the
  ''it''s just a convention'' idea?"


