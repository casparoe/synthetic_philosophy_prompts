  ---


  I retired a few years back from geochemisty and have been reading philosophy to
  fill the gaps, which is how I wound up reading Bishop Berkeley on money — the idealist
  bishop, not the town. The way I understand him, he thought money is not really wealth
  at all; it is more like a ticket or a counter, a purely social device for moving
  claims on real goods and labour around. Gold and silver get treated as if they were
  wealth itself, but for Berkeley that is something close to a prejudice: what matters
  is that the tokens are accepted, circulate, and set people to work. He even thought
  Ireland would be better off with a national bank issuing paper than with everyone
  hoarding coin.


  I''d like you to act as a philosopher of economics and use that Berkeley picture
  to analyse the Nixon shock. In August 1971 the US ended the dollar''s convertibility
  into gold, and the Bretton Woods system of fixed exchange rates unravelled into
