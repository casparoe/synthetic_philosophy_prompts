  Idea for Kelly step-by-step:


  Title-ish: "An argument that expected-value maximization is incoherent for repeated
  bets."


  (1) For any bet, expected value is a linear average over possible outcomes. (2)
  But your wealth after a sequence of bets is multiplicative, not additive: losing
  50% requires a 100% gain to recover, so gains and losses are asymmetric in what
  they do to your future wealth. (3) Since outcomes multiply rather than add, the
  correct way to evaluate a bet is by its effect on the logarithm of wealth, not wealth
  itself. (4) Maximizing expected log wealth is equivalent to maximizing the long-run
  growth rate of wealth. (5) A rational policy must maximize the long-run growth rate
  of wealth, since long-run outcomes are what matter. (6) Therefore, even for a single
  favorable bet that can be scaled, you should choose the Kelly fraction — the fraction
  maximizing expected log wealth — not stake everything on positive expected value.
  Conclusion: expected-value maximization is a fallacy for any bet that is part of
  a sequence. Which step fails?


  Critique: Step 3 is an inference from "wealth is multiplicative" to "correct evaluation
  is log" — that only drops out if you already adopt a logarithmic utility or an explicitly
  asymptotic objective. Step 5 is the truly sneaky premise: maximizing the asymptotic
  growth rate is not obviously what a rational agent with a finite horizon or a different
  risk preference should do; it suppresses the premise that the agent''s utility is
  logarithmic in wealth, or that she cares only about asymptotic dominance. Also,
  even granting it, Step 6 may overreach for a single bet: the long-run result licenses
  a fraction in a repeated setup but not necessarily a one-shot choice with the same
  risk unless we import the same preferences. This is a good "which step fails" candidate
  with an equivocation between "long-run growth is a mathematical property" and "long-run
  growth is what the agent must value."


