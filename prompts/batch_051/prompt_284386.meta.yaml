  ---


  I retired from a research career in the natural sciences a few years ago and have
  since been reading philosophy, especially work on humility, modesty, and the intellectual
  virtues. The reading has made me want to reassess a policy I followed for most of
  my scientific life and largely took credit for as humility.


  The policy was this. Whenever a collaborator, trainee, or reviewer asked how confident
  I was, I would report one step below my private degree of belief: "suggestive" when
  I took something to be probable, "probable" when I took it to be very likely, and
  so on. And whenever I was introduced as an expert, or asked directly whether I was
  one, I would decline the term and describe myself as just someone who looked carefully
  at a narrow set of data. I thought of this as intellectual humility. It seemed to
  guard against overconfidence, make junior colleagues readier to correct me, and
  keep my title from doing work that my evidence should do.


  Recently I have become less sure that the policy deserved the name. Understating
  my confidence may have let me be wrong in public without paying the full reputational
  cost. Refusing the expert label, while others used it of me anyway, may have lowered
  the standard my claims had to meet without actually surrendering any of their authority.
  And the modesty itself was often socially rewarded, which suggests it may have been
  a performance that cost little and quietly managed how others received my errors.


  Is this policy defensible, or is it a kind of strategic self-deprecation dressed
  up as an epistemic virtue? Under what conditions does systematically understating
  one''s confidence cultivate genuine humility rather than merely protect the self
  from challenge? And can the policy be restated so as to keep whatever was good in
  it while giving up whatever was self-deceptive? I would prefer an answer that treats
  the policy on its own terms and does not simply praise humility in general.


  ---


