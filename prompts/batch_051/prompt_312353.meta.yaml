  Let me think about accuracy-first epistemology content.


  Accuracy-first epistemology (Pettigrew, Joyce, Leitgeb, etc.): the view that epistemic
  norms can be derived from the sole epistemic value of accuracy. We assign credences
  (degrees of belief), measure accuracy with a scoring rule (e.g., Brier score), and
  then show that probabilism follows from dominance: any non-probabilistic credence
  function is accuracy-dominated by some probabilistic one, so irrational. A key concept:
  a scoring rule is proper if a credence function expects itself to be at least as
  accurate as any alternative (so rational agents are "immodest" in a specific sense).
  Strictly proper for uniqueness. Brier score is strictly proper.


  Objections and subtleties: The dominance argument assumes that scoring rules are
  "propriety" and "truth-directed" (or "additive, continuous, strictly proper" etc.).
  Non-probabilistic credence is dominated relative to every legitimate scoring rule.
  Subtle mistakes students make:

  - Conflating calibration with accuracy, or thinking propriety means one''s credences
  are guaranteed accurate rather than expected-by-oneself most accurate.

  - Saying the Brier score''s negative is the only legitimate measure; or that any
  scoring rule works; or misstating strict propriety direction.

  - Thinking that dominance argument shows degrees must match objective chances or
  frequencies rather than merely obey probability axioms.

  - Confusing "accuracy" with "truth" — accuracy as closeness to truth (gradational)
  vs all-or-nothing truth.

  - Misapplying: affirming that maximizing expected accuracy under one''s own credences
  gives no reason to change one''s credences; but then struggle with evidence? Actually
  accuracy-first argument for conditionalization uses expected accuracy; a student
  might conflate updating by conditionalization with the propriety argument.


