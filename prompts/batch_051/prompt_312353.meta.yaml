  Exam question (I write):


  "In accuracy-first epistemology, credence functions are evaluated by their accuracy
  at a possible world, often measured by the Brier score: for a credence function
  c over a partition {X, ¬X}, the Brier penalty at a world where X is true is (1 -
  c(X))^2 + (0 - c(¬X))^2. A scoring rule is strictly proper if every probability
  function p expects itself, by its own lights, to have strictly lower expected penalty
  (higher expected accuracy) than any distinct probability function q. Accuracy-first
  epistemologists argue that a rational agent''s credences should be probabilities
  because any non-probabilistic credence function is accuracy-dominated: for every
  legitimate strictly proper scoring rule, there is a probabilistically coherent credence
  function that gets a lower penalty in every possible world. Consider the following
  objection: ''Propriety and dominance show only that an agent with coherent credences
  has no accuracy-based reason to voluntarily shift to any other single credence function,
  because she expects any alternative to be less accurate. But this is a static constraint.
  It cannot explain why she should change her credences when she receives new evidence,
  which is a dynamic matter, and it cannot distinguish her coherent credences from
  many other coherent credence functions, even ones that ignore her evidence. Therefore
  accuracy-first epistemology either has nothing to say about rational updating, or
  must invoke an evidential principle that is not itself derived from accuracy alone.''
  First, reconstruct the objection in your own words (what exactly is the challenge
  to accuracy-first epistemology?). Second, explain how an accuracy-first epistemologist
  would respond, using the idea that the relevant comparison is between forward-looking
  expected accuracy of candidate posterior credence functions relative to a prior,
  not between one''s current credences and an arbitrary rival. Third, identify one
  residual problem for the accuracy-first response: either the response secretly relies
  on a non-accuracy norm, or it merely relocates the problem."


