  Draft:


  "You are a moral philosopher who works on the ethics of historical memory and comparative
  judgments about mass atrocity. I am compiling a list of arguments for the view that
  ranking historical atrocities — e.g., saying that one genocide was worse than another,
  or constructing a comparative scale of mass suffering — is in principle impossible
  or morally objectionable (obscene). The arguments I have collected so far are these:


  (1) There is no common measure. Atrocities destroy heterogeneous goods — lives,
  bodily integrity, cultural continuity, political institutions, trust, the possibility
  of future flourishing — and there is no privileged way of weighing these losses
  against one another, so any ranking must import an arbitrary metric.


  (2) The historical record is uneven. Evidence of scale and suffering is systematically
  skewed by who could leave testimony, whose archives were preserved, and whose destruction
  was documented, so rankings tend to track the documentary trace of an atrocity rather
  than the atrocity itself.


  (3) Ranking instrumentalizes the dead. Treating the victims'' suffering as data
  in a comparative exercise fails to honor them as singular moral claimants and can
  itself be a further wrong — a second indignity added to the first.


  (4) Rankings are politically corrosive. They invite competitive victimhood, in which
  groups compete to have their suffering certified as the worst in order to strengthen
  present-day claims or status, distorting both memory and politics.


  (5) There is no neutral standpoint from which to rank. Every ranker stands inside
  a particular historical position — with particular ancestors, beneficiaries, injuries,
  and identities — and the comparative judgment will inevitably express that position
  rather than a view from nowhere.


  (6) The fitting response to atrocity is mourning and memorial, not comparison. Ranking
  substitutes a detached, comparative stance for the moral-emotional response the
  events call for, and that substitution is itself a kind of failure — this is why
  the enterprise can feel obscene.


