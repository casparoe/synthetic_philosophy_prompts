  Nyāya criteria/borderline prompt draft:


  "Nyāya epistemology recognizes four pramāṇas — instruments of knowledge: perception,
  inference, comparison, and testimony. The standard test for testimony (śabda) is
  that the speaker is trustworthy (āpta): they know the truth of what they say and
  aren''t trying to mislead you. So my working criteria for counting a source as testimony
  are: (1) there''s a speaker, (2) the speaker asserts some proposition, (3) what''s
  asserted is true, (4) the speaker knows it''s true and intends to communicate it,
  not deceive. Now consider a language model that tells you ''the capital of Kyrgyzstan
  is Bishkek.'' The output is true, confidently asserted, and in practice as reliable
  as a knowledgeable person. But condition 4 seems to fail: the model doesn''t know
  anything and has no intentions at all; it''s doing next-token prediction. Does the
  model''s output count as śabda, hence as a source of knowledge in the Nyāya sense?
  Work through the criteria honestly. Where the answer is no, say whether that shows
  the criteria are too parochial, or whether it correctly identifies a real difference
  between knowledge-transmission and text generation. Also say whether we need a fifth
  pramāṇa for machine-generated truths, or whether they''re always reducible to the
  four because someone trained the model."


