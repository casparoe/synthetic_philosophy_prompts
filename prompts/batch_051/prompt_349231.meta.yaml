  Intuitionistic logic basics (BHK):

  - A proof of ¬P is a construction that turns any proof of P into a proof of ⊥ (contradiction).

  - A proof of ∃x P(x) is an object a plus a proof of P(a).

  - A proof of ∀x P(x) is a method that yields a proof of P(a) for any a.

  - A proof of P ∨ Q is either a proof of P or a proof of Q (plus indicator).

  - A proof of P → Q is a method converting proofs of P into proofs of Q.


