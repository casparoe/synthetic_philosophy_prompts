  For the past several years I have been following the published decisions of a small
  regulatory tribunal that hears appeals against penalties imposed for breaches of
  rules at the boundary between national and local law. The tribunal is not bound
  by the courts, but it treats its own previous rulings as matters it should try to
  remain consistent with, and its record seems to me to be working out an unstated
  view of when people may fairly be held to a rule they did not know. In one of its
  first rulings it fined an importer who had never registered under a newly created
  chemicals-safety scheme, even though the scheme had been announced only in the official
  gazette and in trade circulars: a commercial operator in a hazardous sector, the
  tribunal said, is expected to keep itself informed of regulatory change. In a second
  ruling it set aside a penalty against a foreign lorry driver who had parked in a
  controlled zone marked only by a sign in the local language and no pictogram, on
  the ground that a rule enforced against strangers must be made legible to them before
  it binds them. In a third, it set aside a penalty for a woman who had missed a new
  digital-only filing deadline while caring for her dying husband without any broadband
  connection, emphasising that an officer of the relevant agency had told her on the
  telephone that the old paper route remained open. In a fourth, it upheld a penalty
  against a landlord who had broken a fire-safety requirement buried in an unindexed
  technical schedule, but reduced the penalty sharply, calling the rule discoverable
  by a diligent professional yet published in a manner that fell short of what fairness
  requires. In a fifth, it upheld a penalty against a restaurateur who had relied
  on her solicitor''s mistaken assurance that a new licensing provision did not apply
  to her, on the ground that the provision itself was public and unambiguous and that
