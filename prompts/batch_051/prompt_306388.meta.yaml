  precision, impossible), could predict arbitrarily far. "Unpredictable in principle"
  is more nuanced: due to finite precision and exponential divergence, exact long-term
  prediction is impossible in practice; but "in principle" if equations and exact
  state known, trajectories determined. Some might argue "computational irreducibility"?
  But keep simple.

