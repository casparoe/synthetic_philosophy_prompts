  Key concepts:

  - Deterministic chaos: deterministic systems (no randomness in the equations) can
  produce irregular, aperiodic behavior due to sensitive dependence on initial conditions
  (SDIC).

  - Sensitive dependence: nearby initial states diverge exponentially in time (positive
  Lyapunov exponent). For a chaotic system, a small error δ grows as δ e^{λt}. Prediction
  horizon t ~ (1/λ) ln(a/δ), where a is tolerance. So more precision extends horizon
  logarithmically, not indefinitely. Thus "no amount of precision will let you predict"
  is wrong; any finite precision gives a finite horizon, but more precision gives
  (slowly) longer horizon; perfect precision is impossible in practice.

