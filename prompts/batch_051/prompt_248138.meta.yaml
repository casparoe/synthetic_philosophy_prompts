  Version:


  "I''ve been trying to make my views about the aggregation of very small harms precise,
  and I''ve arrived at the following five commitments. I would like you to audit them
  for consistency.


  (1) A speck of dust in the eye is a genuine harm. If two possible outcomes are exactly
  alike except that, in one of them, a single additional person briefly gets a speck
  of dust in the eye, that outcome is worse.


  (2) The relation ''worse than'' is transitive: if outcome A is worse than B and
  B is worse than C, then A is worse than C.


  (3) There is no number of people, each getting one speck of dust in the eye, such
  that this outcome is worse than one person being tortured for a year. I mean this
  for every finite number, however astronomically large.


  (4) Within a single life, however, tiny harms do aggregate: there is some number
  of dust specks delivered to the same person over time such that undergoing that
  series is worse for that person than being tortured for a year. I don''t take this
  to be a special fact about dust; I''d say the same about enough pinpricks or enough
  minutes of mild nausea.


  (5) The badness of an outcome is exhausted by how it goes for the individuals in
  it, together with how many such individuals there are; there is no further impersonal
  or ''cosmic'' badness over and above individual harms.


  Are these five jointly tenable? Please go through them and identify which pairs
