  The void-for-vagueness doctrine: In US constitutional law, a criminal statute violates
  due process if it fails to give a person of ordinary intelligence fair notice of
  what is prohibited, or if it invites arbitrary enforcement. Courts have struck down
  laws for vagueness (e.g., anti-loitering ordinances in Papachristou; "gang loitering"
  in City of Chicago v. Morales). But courts also routinely uphold statutes with vague-ish
  terms: "reasonable person," "obscene," "fraudulent," "income derived from illegal
  activity," "in the public interest," "dishonesty." Some statutes use "reasonable
  belief" defenses, etc.


