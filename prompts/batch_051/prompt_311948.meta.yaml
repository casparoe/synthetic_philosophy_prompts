  measured against an ideal of determinate meaning, but also that a shared "common
  sense" or "community understanding" can discipline open-textured terms. Does it
  presuppose a policy of fair notice: law''s function is to guide conduct ex ante;
  vagueness defeats guidance. And a separation-of-powers concern: if the law is vague,
  police/prosecutors/juries effectively legislate.


