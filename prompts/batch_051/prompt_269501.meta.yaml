  - Causal Markov condition (CMC): a variable is independent of its non-effects given
  its direct causes (parents). Or: in a system represented by a DAG with a probability
  distribution, the distribution satisfies the Markov condition relative to the DAG
  if each variable is independent of its non-descendants conditional on its parents.
  When the DAG is causal (arrows = direct causation relative to variable set) and
  the CMC holds, the graph encodes conditional independence facts.


  - The Markov condition allows inferences from independence to causal structure only
  so far: many DAGs can encode the same independences (Markov equivalence class).
  E.g., X→Y and X←Y encode same independence (none); X→Y→Z and X←Y←Z and X←Y→Z (common
  effect? Wait X→Y→Z chain: X independent of Z given Y. X←Y→Z common cause: X independent
  of Z given Y. So chain and common cause are Markov equivalent if only that one independence.
  Common effect X→Z←Y is different because X and Y are independent unconditionally
  but dependent conditional on Z.)


  - Faithfulness: a distribution is faithful to a DAG if the only conditional independences
  in the distribution are those entailed by the Markov condition relative to that
  DAG. I.e., no extra independences/coincidences cancellations. So P is faithful to
