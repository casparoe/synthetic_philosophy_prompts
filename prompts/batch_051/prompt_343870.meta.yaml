  The mistakes:

  1. "cannot be true" is wrong: the sentence can be true (it''s raining and I don''t
  believe it). The paradox concerns assertion/belief, not truth. This is a subtle
  but real error; hasty grader might let it slide since many say it "can''t be right
  to say."

  2. "asserting p conversationally implies that you believe p" — this is a pragmatic
  implication (Gricean) but then "so asserting the conjunctive sentence contradicts..."
  The step from "conversationally implies" to "contradicts" doesn''t quite follow;
  the second conjunct is explicitly denying what the first conjunct implicates, not
  a logical contradiction. Might be acceptable as "pragmatic contradiction" but the
  student didn''t distinguish.

  3. "belief is a necessary condition for assertion: you can only assert what you
  believe" — this is too strong; Moore''s paradox doesn''t show that belief is necessary
  for assertion; it shows that one cannot assert with sincerity/coherence, or that
  assertion expresses belief in a way that makes the conjunction unassertable, but
  you can assert things you don''t believe (you''d be lying or insincere). The paradox
  is about not being able to sincerely assert while the content is true of you, not
  about inability to assert at all. Actually "Moore''s paradox" is often phrased:
  the sentence is "inexpressible" in assertion even though it''s possibly true; you
  can''t assert it without absurdity. But saying "you can only assert what you believe"
  is false — you can assert falsehoods or things you don''t believe (lying). So student
  overgeneralizes.

  4. "assertion is governed by a knowledge norm, since ''p, but I don''t know p''
  is Moore-paradoxical too" — The knowledge version is Moore-paradoxical (or at least
  unassertable), but the argument is too quick: many who accept the knowledge norm
  use it to explain why "p, but I don''t know p" is unassertable; but the inference
  from Moore-paradoxicality to the knowledge norm is contested, since the belief version
  can be explained by a belief norm or sincerity conditions without endorsing the
  knowledge norm. So the student conflates the belief version with the knowledge version
  and asserts the knowledge norm too strongly.


