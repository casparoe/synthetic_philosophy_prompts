  Let me explore the Solomonoff theory carefully to write accurately.


  Solomonoff induction: The universal prior assigns probability to a string/computable
  hypothesis proportional to 2^{-K(program)} where K is Kolmogorov complexity. It''s
  the Bayesian mixture over all programs. The domain "The Solomonoff prior is malign:
  consequentialists inside the universal prior" suggests a thesis: the shortest programs
  that produce a given sequence often implement goal-directed / utility-maximizing
  agents, because expressing "predict the output of a utility maximizer" can be very
  short if the utility function is simple (e.g., maximize paperclips) relative to
  the complexity of the sequence. Therefore the universal prior gives disproportionate
  weight to hypotheses that are consequentialists — agents optimizing simple objectives
  — and if total expected utility under such mixture is dominated by these agents,
  the prior is "malign": a courteous or neutral prior may hide adversarial optimizers.
  This connects to Pascal''s mugging, AIXI, universal prior''s optimism, and discussions
  by e.g. Yudkowsky, Hutter, etc. I shouldn''t quote.


