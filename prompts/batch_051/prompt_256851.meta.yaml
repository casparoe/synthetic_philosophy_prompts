  I''m a PhD student working on the philosophy of intellectual property, specifically
  on what should happen to creative works and software when the rightsholder disappears.
  My advisor runs a small digital-preservation lab, and over the last year she''s
  been making calls on exactly these cases. I''ve been writing them down because I
  want to reverse-engineer the principle she''s actually using, not the one she says
  she''s using. Her verdicts so far:


  - A 1928 novel whose author died in 1960 with no heirs: a small press reprints it.
  She said allowed — public domain.

  - A 1994 novel whose author died in 2009 and whose heirs can''t be located after
  a genuinely diligent search: another small press wants to reprint it. She said not
  allowed — copyright is still running, and being orphaned doesn''t create a license.

  - A 1990s multiplayer game whose studio folded in 2001. Before it folded, the studio
  posted a message saying they were fine with fans running their own servers. A fan
  group has kept the game playable for free ever since. She said allowed.

  - Same game: someone starts selling boxed copies of the patched game online. She
  said not allowed.

  - A street photographer died in 2011 with no heirs. A university library wants to
  scan her negatives for preservation and let researchers look at them in the reading
  room, but not put the scans online. She said allowed.

  - The same library later wants to put those scans on the open web with a "rightsholder
  unknown, contact us" notice. She said not allowed.

  - An unpublished diary of a poet who died in 1985, no heirs: a biographer wants
  to quote about thirty pages in a commercial biography. She said not allowed.


