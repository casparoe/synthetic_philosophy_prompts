  Prompt:


  "In chapter 21 of The Prince, Machiavelli argues that a prince caught between two
  more powerful neighbors should not remain neutral: if one side wins, the winner
  will regard the neutral as prey; if the other wins, that side will neither help
  nor shelter him; and the choice of neutrality is typically made by irresolute rulers
  to escape present dangers. He thinks it is better to declare for one side openly,
  even at some risk, because a committed ally has a claim on the victor and shares
  the fate of the war.


  Machiavelli wrote this for a Renaissance principality in a world of limited wars
  and shifting alliances. Now consider Switzerland, Sweden, and Finland: three modern
  states that have built their security around variants of armed neutrality or non-alignment,
  backed by strong militia systems or conscription and, in some cases, by encroaching
  but still limited alliance commitments. Their neutrality is not passive; it is armed
  and intended to make conquest costly.


  Does Machiavelli''s argument survive the change from his world to this one? Which
  premise is actually under pressure: the assumption that a neutral can be cheaply
  punished after the war, the assumption that alliances are flexible and personal,
