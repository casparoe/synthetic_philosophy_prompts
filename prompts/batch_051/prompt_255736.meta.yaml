  and inverses, and that the abstract axioms of associativity, identity, and inverses
  define something drained of the concrete content that gave group theory its point.
  I argued that stripping the definition down to those axioms was exactly what allowed
  the theory to apply to cases far removed from literal symmetries, and that the theory
  retains its content because the axioms themselves encode the algebra of invertible
  transformations. I''d like to be clearer about the general question underneath both
  arguments: when mathematicians generalize a concept and settle on one definition
