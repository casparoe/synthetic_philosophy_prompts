  if the preimage of every open set is open—as a gratuitous abstraction that buys
  generalization at the cost of meaning. I replied that the open-set definition does
  not discard that intuition but rather identifies its essential structure: it says
  a continuous map is one that pulls back open sets to open sets, which is precisely
  what preserves the topology one has chosen, and that epsilon-delta continuity is
  simply the special case where the topology comes from a metric. We also fought about
  the definition of a group. He argued that groups should be defined as collections
