  I have been trying to make my working definition of methodological individualism
  precise enough to settle some disagreements with colleagues, and I have arrived
  at three conditions I want to test. I will count an explanation of a social phenomenon
  as individualistic just in case: (1) the only causal agents it invokes are individual
  people acting on beliefs, desires, and intentions; (2) any social or structural
  vocabulary it uses — "norm," "institution," "custom," "network," "the group" — can
  be paraphrased away, without loss of explanatory content, into claims about individuals
  and their interactions; and (3) no irreducible causal powers are assigned to social
  wholes, so no "downward" influence from the group to the individual is required.


  The case I have in mind is a fishing town I will call Paxton. In Paxton, boats leave
  only after a pennant is lowered at first light. No ordinance requires this; the
  pennant once signaled a good tide but lost that function long ago. Privately, every
  fisherman now says the custom serves no purpose and that he stays in the harbor
  only because he expects the others to stay, and expects that leaving early would
  bring a few days of cold treatment. The cold treatment is not coordinated: each
  fisherman independently judges early departures as impatience and avoids trading
  with the early boat. None of them can say how the practice arose, and it has drifted
  over the decades — once the pennant was lowered at sunrise, now at first light —
  without anyone having intended the changes. The natural explanation is a self-enforcing
  equilibrium: each man''s expectation of what others will do is sustained by yesterday''s
  behavior, and rare deviations are punished, so the pattern reproduces itself. But
  two further facts complicate this. First, the custom has persisted through a complete
  turnover of the fishing population, so the pattern''s carrier seems to be the town
  rather than any fisherman. Second, the fishermen''s preferences do not by themselves
  select first light as the departure time: if the pattern had settled at midday,
  the same preferences and the same sanctioning dispositions would presumably have
  reproduced midday. What pins down first light is the accumulated history of the
  practice, which no current fisherman knows.


  Does the explanation of the Paxton harbor custom qualify as methodologically individualistic
  on my three conditions? Please go through the conditions one by one, flag where
  the case pushes against them, and say explicitly whether the borderline is due to
  the case or to a defect in the criteria. I especially want to know whether condition
  (2) can absorb the persistence-through-replacement and the role of the unremembered
  history, and whether condition (3) settles anything or merely restates the point
  at issue.


