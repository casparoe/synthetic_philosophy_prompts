  ---


  I run the anomaly-detection side of a condition-monitoring system at a wastewater
  treatment plant. I came up through operations, not school, but Ive been reading
  about root cause analysis on my own and this one question has really got under my
  skin: when are two anomalies "the same mechanism"?


  Here''s the situation. Every week we log anomalies — pressure dips, turbidity spikes,
  chlorine residual drifting, vibration alarms. Whenever two happen near each other
  in time, on the same system, or on the same sensor, I have to decide whether to
  write them up as one underlying problem or two different ones. That call drives
  whether maintenance treats it as a single open issue or duplicates, whether we escalate
  to engineering, and whether something gets called "recurring." If I get it wrong
  one way we waste a crew on a duplicate; if I get it wrong the other way we miss
  that one bad component is failing in two places and that the fix didn''t take.


  The hangup is that "looks the same" and "same sensor" both fail. Two different problems
  can produce the same-looking anomaly: a chlorine residual dip from a bad dosing
  pump and one from a valve left partway open trace almost identical. And one problem
  can produce a bunch of different-looking anomalies: a failing pump seal will throw
  a vibration alarm, a pressure drop, and a turbidity blip downstream. So Ive been
  going around on what "same mechanism" should even mean. Same root cause? Same chain
  of physical parts? Same fix makes both stop? Same "if we''d fixed the first one,
  the second would never have happened" test? These come apart and I cant keep them
  straight.


  Please write me a decision procedure my team could actually run, written for operators
  and junior techs, not philosophers. The questions to ask in order, what counts as
  a sufficient answer to each, where the procedure stops and says "not the same mechanism,"
  and where it hands the decision to a person because it''s a judgement call rather
  than a checkable fact. Also say, honestly, where the procedure will misfire and
  what it cannot settle. We usually have about half an hour per call, the person running
  it might not have seen the equipment, and whatever we conclude has to be written
  up so a plant engineer and a compliance officer will sign off on it.


  Then run the procedure on two cases:

  (a) Two chlorine residual dips on the same sensor two days apart. First one we traced
  to a faulty dosing pump and fixed it. Second one had the same shape and size, but
  the pump checked out fine; after a while we found a valve left partway closed by
  a contractor. So: same signature, different mechanism (or is it?).

  (b) A pressure drop at the intake and a turbidity spike at the filters, an hour
