  codes). But independently constructed models need not have statistically independent
  errors; they can share structural choices, common parameterizations, be tuned to
  the same observations, or simply make the same systematic mistakes (e.g., cloud
  feedbacks). So (2)''s evidence doesn''t establish statistical independence. Step
  (3) invokes the conclusion of (1), but (1)''s antecedent isn''t established by (2)
  because of the equivocation. Step (4) additionally assumes model agreement as strong
  evidence; but if errors are correlated, agreement may reflect common bias.


