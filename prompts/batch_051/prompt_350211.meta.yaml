  Draft:


  "I''m a programmer — self-taught, no philosophy background — and I''ve spent a lot
  of time thinking about why code that mutates state is so much harder to reason about
  than code that treats data as immutable. I think fluently in terms of values and
  references, equality versus identity, aliasing, shallow and deep copies, snapshots
  and commits, and the difference between rebinding a name and changing what an object
  points to. Lately I''ve been reading around a philosophical debate about how ordinary
  things persist through change. One side says an object is wholly present at each
  moment of its existence, and change is the very same object having different properties
  at different times. The other side says an object is more like a four-dimensional
  whole made of time-slices, and what we encounter at any moment is only a slice of
  it; the object over time is the whole sequence, the way a commit history is the
  whole story of a repository.


  I want you to restate that debate in my vocabulary, as faithfully as you can: mutable
  objects, references, identity versus equality, aliasing, copies, snapshots, versions.
  Then give me the residue report: which claims translate cleanly, which translate
  only with distortion, and which have no counterpart in my vocabulary at all. For
  the residue, I want your honest view on whether it''s there because my programming
  vocabulary is missing something real, or because the philosophical debate is less
  substantive than it looks once you strip away the unfamiliar words. And if the translation
  is a good one, I''d also like to know whether it explains why mutation is hard to
  think about, or whether that''s a separate problem that the philosophical debate
  doesn''t touch.


  One more thing: if the task as I''ve set it up rests on a confused premise — for
