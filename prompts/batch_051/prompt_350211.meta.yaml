  Source debate: The philosophical debate about persistence through time and change
  — specifically, two rival accounts: (a) the "object is wholly present at each moment"
  view (endurantism) where identity is strict and an object can change its properties
  while remaining the same object; and (b) the "object is a four-dimensional whole
  with temporal parts" view (perdurantism), where what exists at each moment is a
  time-slice and the whole is a sum of slices. But wait, the asker is a programmer
  who wants it restated in programming vocabulary: mutable objects vs immutable data
  structures, references vs values, equality vs identity, aliasing, snapshots, commits,
  persistent data structures.


  Actually there''s a nice mapping:

  - Endurantism ≈ a mutable object with identity: a single object at a memory address
  that persists while its fields change (the object "endures" through mutation).

  - Perdurantism ≈ immutable values and snapshots: each state is a distinct value,
  and the "history" is a sequence/list of states; the object over time is a collection
  of snapshots (temporal parts).

  - The ship of Theseus ≈ mutating an object in place while replacing all its fields
  over time; is the resulting object "the same object"? Identity vs equality: two
  references can point to the same object (identity) or to distinct objects with equal
  state (equality). If you replace every plank and then reassemble the old planks
  into a second ship, which reference points to the "original"? In programming terms,
  this is like copying an object, mutating the copy, and then mutating the original
  back — or rebinding references.

  - The puzzle of "same object after total mutation" maps to the question of whether
  identity is a further fact beyond the succession of states.


