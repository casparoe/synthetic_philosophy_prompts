  balanced (individual equipoise).

  - Why individual equipoise is too fragile: clinicians'' hunches, idiosyncratic readings
  of data; Freedman''s move to community equipoise.

  - How RAR complicates this: RAR operationalises a running comparative judgment —
  the community (via the trial''s DSMB/algorithm) is being asked to act on interim
  evidence. If the algorithm''s tilt is justified, does the community still possess
  the requisite uncertainty? If the tilt is not justified, is it ethical to use it
  to allocate participants?

  - The distinction between "acting as if A is probably better" (allocation) and "concluding
  A is better" (stopping) — is this a principled distinction or a bit of motivated
  reasoning? Bayesian decision-theoretic angle: allocation is a decision, and decisions
  under uncertainty can rationally differ from beliefs; you can assign more patients
  to the arm with higher posterior probability of superiority without having crossed
  a threshold for stopping.

  - The individual participant''s perspective: in fixed randomisation, each participant
  has 50/50 chance regardless of interim data; in RAR, a participant has a higher
  chance of getting the currently favoured arm — seems better for participants, but
  wait: the currently favoured arm might later turn out worse; also a participant
  assigned to the disfavoured arm is now more "unlucky" in a morally salient way?
  Actually the key tension: RAR looks patient-friendly but may be ethically worse
  if it prematurely shifts allocation on noisy interim data, or if it undermines the
  epistemic integrity of the trial.

  - The duty of personal care: is it satisfied by a higher probability of receiving
  the currently better-looking treatment, or does it require something else — e.g.,
  that the clinician not knowingly allocate someone to a treatment they believe inferior?
  Under community equipoise, the individual clinician defers to community uncertainty;
  RAR makes the community''s evolving judgment explicit and operational.

