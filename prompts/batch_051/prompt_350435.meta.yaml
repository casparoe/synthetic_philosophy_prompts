  600–700 words at most for the model answer.


  The topic is clinical equipoise, but I want the question built around a crux that
  the standard summaries do not resolve for the student: response-adaptive randomisation.
  That is, a design in which the allocation ratio is deliberately shifted mid-trial
  so that more participants are assigned to whichever arm the accumulating outcome
  data currently favour. This is not a question about whether randomisation in general
  is ethical; it is about whether a trial can remain consistent with clinical equipoise
  once the trial''s own machinery starts acting on interim evidence.


  In particular, a strong answer should have to do the following, and the question
  should be written so that these moves are necessary rather than optional:

  - distinguish individual equipoise from community equipoise, and explain why the
  individual version was thought to be too fragile to do the ethical work;

  - confront the apparent dilemma that response-adaptive randomisation either acts
  on interim evidence that is reliable enough to disturb equipoise, or acts on evidence
  that is not reliable enough to justify tilting allocation;

  - separate the decision to allocate participants from the decision to stop the trial,
  and say whether this separation is principled or merely a comfortable piece of motivated
  reasoning;

  - consider the position of an individual participant assigned to the currently disfavoured
  arm, and whether the duty of personal care is better served by a higher probability
  of receiving the better-looking treatment or by something else;

  - reach a reasoned verdict about the conditions, if any, under which response-adaptive
  randomisation is compatible with clinical equipoise, including the role of pre-specified
  rules, stopping boundaries, and oversight.


  Please then provide:

  (1) the exam question itself, worded as students would see it;

