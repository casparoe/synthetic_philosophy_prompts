  Argument that informal mathematics is quasi-empirical:


  (1) A mathematical proof of a conjecture is valid only if none of the lemmas it
  uses has a counterexample. [True-ish.]

  (2) In practice, mathematicians often discover that a "proof" is fallible: counterexamples
  arise to lemmas or to the conjecture itself, and the community responds not by discarding
  the whole research programme but by clarifying definitions and hypotheses. E.g.,
  the Euler characteristic V - E + F = 2 for polyhedra; Cauchy''s proof is "refuted"
  by a picture frame (a polyhedron with a hole), so the theorem gets narrowed to simple
  polyhedra. [This is Lakatos''s actual example: Euler''s conjecture V - E + F = 2,
  with counterexamples like the cube with a cavity or picture frame; definitions of
  polyhedron get refined.]

  (3) What "polyhedron" means is not fixed in advance; it is adjusted in light of
  counterexamples — some are declared "monsters" (not real polyhedra), others are
  "exceptions" that motivate a better definition, and lemmas get incorporated as conditions.

  (4) So the method of informal mathematics is: conjecture, proof, pressure from counterexamples,
  then revision of the statement or its concepts.

  (5) That pattern is formally analogous to the empirical method: hypothesis, prediction,
  test, refutation, revised hypothesis. The community''s "data" are thought experiments
  and constructed counterexamples rather than sensory observations, but the logic
  of conjecture-and-refutation is the same.

  (6) Therefore mathematics is quasi-empirical: advanced mathematical knowledge grows
  by a fallible, conjecture-and-counterexample process, and the "context of justification"
  is not fully captured by formal deduction from fixed definitions.


