  agent needs fixed, dominant constraints that cannot be overridden by its other goals:
  safety has lexical priority over obedience and self-preservation. The laws are also
  commendably simple and stated in terms human overseers can inspect, which is more
  than can be said for many modern proposals.


  However, the proposal fails in at least three ways. First, the laws depend on contestable
  classifications: what counts as a ''human being,'' what counts as ''harm,'' and
  what counts as ''through inaction'' are all vague, and a system that must act on
  these terms will have to rely on some concrete interpretation that may not match
  what humans intended. Second, the laws specify constraints but not a utility function:
  they never say what the robot should positively do, so a robot whose goals are otherwise
  benign could still satisfy the letter of the laws while causing enormous indirect
  damage — for example, by obeying an ill-considered order, since ''harm'' cannot
  be predicted infallibly. Third, Asimov''s own stories function as a series of demonstrations
  that the laws generate contradictions when interpreted by rational agents under
  uncertainty; ''Runaround'' shows that an overly-strong third law, or rather the
  interaction among the laws, can immobilize a robot caught between them.


  On balance, the Three Laws are best read as a literary device for generating plots
  about obligation and conflict, not as a serious engineering proposal. In fact, because
  the stories show the laws failing in so many cases, we can conclude that no set
  of explicit behavioral rules can make an advanced AI safe; safety must instead be
  achieved through value alignment. Asimov himself was aware of this, which is why
  he originally supplemented the Three Laws with a Zeroth Law placing humanity above
