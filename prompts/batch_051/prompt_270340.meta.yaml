  "The Three Laws are a hierarchy of behavioral constraints: a robot may not injure
  a human being or, through inaction, allow a human being to come to harm; it must
  obey orders given by humans except where those orders conflict with the first law;
  and it must protect its own existence except where that conflicts with the first
