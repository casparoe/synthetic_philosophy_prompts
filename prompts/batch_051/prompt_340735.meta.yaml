  where the crash-test data and scoring method were published alongside; that a worst-run
  councils ranking was not protected where the ranking was presented as fact but no
  criteria or evidence were supplied; and that a most overrated actors list was protected
  because it was openly a matter of taste. Taken together, these rulings gesture towards
  a principle about whether a rating imports an undisclosed factual assertion, but
  the tribunal has never ruled on a forward-looking forecast as such."


