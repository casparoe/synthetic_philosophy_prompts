  Allais paradox background:

  - Allais''s example challenges expected utility theory (EUT), specifically the independence
  axiom (sure-thing principle in Savage).

  - The independence axiom: if L1 is preferred to L2, then any mixture pL1 + (1-p)L3
  is preferred to pL2 + (1-p)L3. In Allais pairs, the common consequence (89% of $1M,
  or 89% of $0) should be irrelevant, so A>B implies C>D. People often prefer A>B
  and D>C — violation.

  - Key terms: common consequence effect, common ratio effect (second type of violation).

  - Certainty effect (Kahneman & Tversky): people overweight outcomes that are certain
  relative to merely probable.

  - Explanations/alternatives: regret theory (Loomes & Sugden), rank-dependent utility
  (Quiggin), prospect theory''s editing/weighting function, disappointment aversion
  (Gul), fanning-out hypothesis (Machina''s generalized expected utility allowing
  Allais without violating stochastic dominance).

  - Defenses of Allais preferences: Allais himself argued certainty has psychological
  value and EUT is descriptively false and normatively questionable; the "Allais Paradox"
  isn''t a paradox but a refutation of the independence axiom. Buchak''s risk-weighted
  expected utility theory can accommodate Allais? Let me check: REU theory (Lara Buchak)
  uses a risk function r(p) that weights probabilities, with r(p) < p typically; does
  REU accommodate Allais? REU can accommodate the certainty effect? I think REU may
  not fully accommodate common consequence? Actually risk-weighted expected utility
