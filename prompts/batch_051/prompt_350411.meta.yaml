  preferences need not be dynamically inconsistent if you''re careful about which
  preferences are relevant? Actually there''s a classic argument that violating independence
  leads to a Dutch book/money pump or dynamic inconsistency. There are responses:
  the preferences can be non-consequentialist in the decision tree; "resolute choice"
