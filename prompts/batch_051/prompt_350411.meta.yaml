  Questions could cover:

  1. Why should we treat certainty as having special value over and above the utility
  of the outcome times probability? Isn''t this just double-counting the probabilities?
  Likely reply: certainty eliminates two distinct kinds of uncertainty-involving attitudes
  (regret, anxiety, planning) and these are legitimate outcomes. Follow-up: if they''re
  legitimate outcomes, shouldn''t they be included in the description of outcomes,
  which would make the preference consistent with independence rather than a violation?

  2. Savage''s sure-thing principle: he''d say the 89% common outcome is irrelevant
  because the states where it occurs are identical between options; how do you respond?
  Likely reply: the common branch isn''t irrelevant when it changes whether one faces
  risk at all. Follow-up: doesn''t that make the value of an outcome depend on what
  else is in the lottery in a way that blocks any separable representation?

  3. Money pump/dynamic consistency: if you prefer A>B and D>C, can''t you be led
  in a two-stage choice to pay to swap and end up worse? Likely reply: the dynamic
  argument assumes the agent treats the plan as a static lottery and ignores the evolution
  of beliefs/commitment. Follow-up: what principle of dynamic choice do you accept,
  and can it be stated without collapsing back into independence?

  4. The common ratio version: do you also defend the common ratio effect, e.g., preferring
  a sure $3000 over 80% chance of $4000 but preferring 20% chance of $4000 over 25%
  chance of $3000? If your view licenses both, what''s the unified explanation? If
  not, why treat common consequence and common ratio differently?

  5. Redescription/regret: a critic could say your preference pattern is really a
  preference over differently described prospects because the certain million brings
  peace of mind while the gamble brings possible regret. Doesn''t that concede that
  the apparent violation is an artifact of under-described outcomes? Likely reply:
  these attitudes (regret, anxiety) are not independent outcomes to be added; they
  are global properties of the act. Follow-up: but then can they be represented consistently
  at all?

  6. What about invariance/extensionality? Different presentations of the same probability
  distribution should be evaluated the same; your view seems to reject that. Is that
  a cost? Likely reply: yes, presentation can matter because a decision is a psychological
  event, not just a mapping to distributions. Follow-up: then what separates legitimate
  framing effects from illegitimate ones?

  7. Evidence: What behavioral or experimental finding would make you abandon the
  view? If Allais preferences disappeared with incentives/experience/expertise, would
  that show them to be mistakes rather than permissible? Likely reply: if they proved
  unstable under any reflection, I''d treat them as errors; but some persist. Follow-up:
  is persistence under reflection sufficient for rationality?

  8. Normative scope: would you defend the same pattern for small stakes? If the certainty
  effect is rational, why shouldn''t someone pay a large premium to avoid tiny risks?
  Likely reply: the size depends on a personal risk function; if consistent, it''s
  permissible. Follow-up: does your view permit risk preferences that look like extreme
  self-harm, and if so, where''s the line? Hmm.


