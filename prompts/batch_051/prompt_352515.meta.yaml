  Fitch''s paradox of knowability: The paradox: assume all truths are knowable (K∀p(p
  → ◇Kp)). This, with modest modal/epistemic logic, implies all truths are known (∀p(p
  → Kp)), i.e., omniscience. The proof: take p ∧ ¬Kp (a truth nobody knows — Fitch
  sentence). By knowability, ◇K(p ∧ ¬Kp). But K(p ∧ ¬Kp) entails Kp ∧ K¬Kp, which
  entails Kp ∧ ¬Kp (since knowledge is factive), contradiction. So no one can know
  the Fitch sentence, yet it might be true. If it is true, then there''s an unknowable
  truth. Hence if all truths are knowable, no truth is unknown — all truths are actually
  known. This is a nice topic for an exam that separates label-reciters from thinkers.
  Questions: Does the paradox refute anti-realism/verificationism? Is the knowability
  principle properly formalized? Edgington''s proposal to use actuality operator:
  ◇K(p @ actually p)? Hmm. There''s a literature on "restrictions" — e.g., Dummett''s
  restriction to "basic" statements, Tennant''s restriction to cartesian formulas.
  Could be an exam question: present a proposed restriction and ask students to evaluate
