  out whether novelty is actually part of a good life, or just a tool for keeping
  pleasure from decaying and attention from flatlining, I don''t trust my own instincts.
  Here are my gut verdicts on some cases, and I want to know what principle they add
  up to, if they add up to anything.


  1. My uncle has read the same fifteen or so novels in rotation for thirty years
  and says every pass shows him something new in them. I don''t think he''s missing
  out.


  2. A couple I know have spent the same fortnight every year in the same damp cottage,
  same walk to the same pub, same drive home, for forty years. They''re the happiest
  people I can name. I don''t think something is absent from the middle of their life.


  3. A friend of a friend cannot bear an hour with nothing in it. New podcasts, new
  people, new plans, new city. He says he''s terrified of being bored. I think he''s
  badly off, and I don''t think the newness is helping him — he''s living on stimulants.


  4. The case that pulls the other way. An artist I know painted the same corner of
  her kitchen for three years and I don''t think that was a mistake. But when she
  switched to a new subject each month, the work got more alive in a way I can''t
  explain by skill or pleasure or output. I want to say the newness itself was doing
