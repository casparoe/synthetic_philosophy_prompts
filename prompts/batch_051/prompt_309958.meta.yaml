  Prompt draft:


  "I spent most of yesterday evening arguing with a friend about the precautionary
  principle, and we kept circling back to the same problem. In its familiar form,
  the principle says that when an activity carries a threat of serious or irreversible
  harm, uncertainty about whether the harm will actually occur should not be treated
  as a reason to delay protective measures; the burden is placed on the proponent
  of the activity to show it is safe rather than on the public to show it is dangerous.
  My friend''s view is that this made sense when the paradigm cases were things like
  a novel industrial chemical or a pesticide, where the activity is optional, the
  benefits are modest and replaceable, and the main danger is a false negative — failing
  to regulate something that turns out to be harmful. But he thinks the principle
  is now being applied to a very different kind of case: general-purpose technologies
  and large research programs (he kept using examples like artificial intelligence,
  geoengineering, and certain kinds of biological research) where the same uncertainty
  runs in both directions. If the technology is necessary to prevent a catastrophe,
  or if banning the research forecloses knowledge needed for later safeguards, then
  the precautionary principle can be invoked both for and against the very same action,
  and it seems to stop giving any guidance. I found this intuitively plausible but
  I don''t trust the exact structure of the objection, and I don''t know whether it
  kills the principle or just shows it needs a repair. Please reconstruct the classic
  precautionary argument as precisely as you can — its premises and what the conclusion
  actually is — then say exactly how the changed conditions my friend describes bear
  on it, which premise is under pressure, and whether the argument survives, needs
  a weakened or modified formulation, or simply becomes inapplicable in two-sided
  cases. If you think a repaired version is possible, state it and explain what work
  it still does."


