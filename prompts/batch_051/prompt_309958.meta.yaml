  then (3) we should err toward restriction because the cost of being wrong about
  safety is worse than cost of being wrong about harm. The new development: when the
  activity under scrutiny is not a consumer product but a research program or general
  technology, the same uncertainty applies to forgoing it — the very harms it might
  cause are matched by harms its absence might cause (e.g., not building safe AI might
  allow unsafe AI; not researching climate engineering leaves climate harms unaddressed).
  Then the principle''s asymmetry collapses: both sides can invoke it, and the principle
  doesn''t tell you which uncertainty to prefer. Does it survive? It may survive as
  an argument for shifting burden of proof toward whichever error is less reversible,
  but not as a blanket rule.


