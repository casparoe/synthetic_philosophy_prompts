  The core idea: There''s a tension between the practical/deliberative standpoint
  and the theoretical/predictive standpoint regarding one''s own future actions. When
  you are deciding what to do, you typically suspend or refuse to assign probabilities
  to your own options; the question "What will I do?" is answered by deciding, not
  by predicting. Some philosophers argue you can''t rationally assign a credence to
  your own choice while still genuinely deliberating — the act of assigning a probability
  (e.g., "I''ll probably take the boring job") treats your choice as already determined/evidence,
  which crowds out the open, first-personal stance of deciding. There are also puzzles
  about whether such self-credences are self-fulfilling or self-defeating, and whether
  an outside observer (who knows your past, preferences, etc.) can predict you better
  than you can predict yourself — yet their prediction doesn''t conflict with their
  own agency because they''re not the one choosing. Related: Newcomb''s problem, where
  your prediction about your own choice affects a predictor''s earlier prediction;
  the "ratifiability" idea; and the asymmetry between predicting others and predicting
  oneself.


