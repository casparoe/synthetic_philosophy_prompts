  Now think of hard cases and desiderata for a theory of denoting phrases / definite
  descriptions:


  1. Productivity/systematicity: language generates infinitely many denoting phrases;
  theory must assign truth conditions compositionally, not phrase by phrase. Case:
  "the center of mass of the solar system at the first instant of the twentieth century"
  is understood on first hearing.


  2. Empty descriptions: phrases with no referent can occur in significant, false
  or true propositions. Case: "The present King of France is bald" — meaningful but
  neither clearly true? For Russell false (with scope). A theory must not require
  a denotation for meaningfulness. It should accommodate LEM? The king of France paradox:
  if no such object, is the sentence false or truth-valueless; Russell says false.


  3. Uniqueness: "the" conveys uniqueness. "The father of Charles II was executed"
  — but also "the son of So-and-so" in ordinary speech. A theory must explain uniqueness
  as part of the proposition or as presupposition vs assertion.


  4. Negative existentials: true denials of existence. "The present King of France
  does not exist" is true (or has to be explained). If "the present King of France"
  refers to a nonexistent object, problem; if it doesn''t refer, how is the statement
  true? Distinction between grammatical form and logical form.


  5. Denotation without acquaintance: Russell''s passage — the theory must explain
  cognitive contact with objects known only by description, e.g., center of mass.


  6. Substitution failures / opacity: "George IV wished to know whether Scott was
  the author of Waverley" (Russell''s own later example). A theory must explain why
  substituting co-referential names/descriptions changes truth value in propositional
  attitude contexts, or handle them separately with scope. This is in On Denoting.
  Is "Scott was the author of Waverley" too? It''s in the paper and well-known. We
  can mention as a case without quoting. Good.


  7. Distinction between names and descriptions; aboutness.


  8. Truth values for sentences with non-referring terms; either false or truth-valueless
  — theory must decide and justify. Distinction between assertion and presupposition
  (Strawson).


  Tensions: (a) compositional truth conditions vs empty descriptions not requiring
  referent; (b) uniqueness as asserted (Russell) vs presupposed (Strawson); (c) treating
  descriptions as incomplete symbols/quantifiers vs as referring terms with referents;
  (d) handling opacity vs clean substitutivity.


