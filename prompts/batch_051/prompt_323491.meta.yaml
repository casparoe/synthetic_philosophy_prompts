  Domain background: In Greek myth, the gods themselves bind themselves by oaths sworn
  on the river Styx; a false Styx oath is punished harshly. Why is an oath by the
  Styx binding for a god, including Zeus? Two camps:

  - "Instrumental/sanctionist": An oath binds when the oath-taker stakes something
  they cannot afford to lose and a credible enforcer exists. The Styx works because
  the penalty (e.g., a year of breathlessness, banishment from nectar and ambrosia
  / the gods'' assembly) is automatically imposed by Styx, who was granted this honor.
  Binding force = expected cost + credibility of enforcement, perhaps backed by the
  cosmological order that administers oaths. Break it and you pay; being rational,
  you don''t.

  - "Constitutive/speech-act": The Styx oath is binding because it is the most solemn
  speech act in the divine order; swearing by Styx changes the normative situation
