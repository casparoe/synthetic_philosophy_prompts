  "Here''s my opening. You get in the car to drive a few hundred miles to a dinner
  you''d describe as pleasant but ordinary. Actuarially, that trip exposes you to
  something like one micromort — a one-in-a-million chance of death — a risk you accept
  without a second thought. Now suppose I offer you, instead, a button: press it,
  and with probability one in a million you die instantly and painlessly; otherwise,
