  behind the wheel, the familiarity of the risk, the temporal structure, the framing
  — and why should any of those factors count as reasons rather than biases? If you
  can''t give a reason that survives your own expected-value standard, isn''t your
  everyday acceptance of driving risk just a failure to be the person your theory
  says you should be?"


