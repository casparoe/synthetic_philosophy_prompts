  Prompt text:


  ---


  A friend and I just spent a long evening arguing about whether dreams are experiences,
  and I came away convinced that she is applying a consistent principle to cases,
  though she would never state it outright. Before I continue the argument I want
  to reconstruct that principle. Please act as a professional philosopher of mind
  whose specialty is the metaphysics of sleep, dreaming, and consciousness. Think
  carefully, brainstorm candidate rules first, and only then commit to a prediction.


  Her track record so far:


  1. A person woken directly out of an unmistakable REM episode immediately gives
  a long, detailed, coherent report of a dream. Her verdict: the person did have an
  experience during sleep.


  2. A person talks in his sleep in full, grammatical sentences but has no memory
  of it afterward, and nothing indicates he was aware of what he was saying. Her verdict:
  he did not have an experience.


  3. A lucid dreamer has prearranged to signal from inside the dream with a distinctive
  pattern of eye movements; while still asleep she produces the pattern, and later
  she gives a detailed report of a lucid dream. Her verdict: she did have an experience.


  4. A person has a night terror: he screams and thrashes, shows intense fear, but
  is unresponsive and afterward has no recall of any mental content. Her verdict:
  he did not have an experience.


  Now the new case. A sleeper has been in deep, quiet sleep with no REM and no behavioral
  sign of mentation. Monitoring shows that the rich dream narrative she reports upon
  waking was assembled in her brain only during the first moments after the alarm
  sounded, not during sleep. She nevertheless wakes with a subjectively compelling,
  detailed memory of a dream that seemed to last many minutes. Assume the physiological
  facts are exactly as stipulated and are not in dispute.


  What would my friend say about this new case if she is to remain consistent with
  her track record? In answering, identify the two or three most plausible principles
  that fit her earlier verdicts, say what each principle predicts for the new case,
  give your best guess as to which principle she is actually running and why, and
  specify one further case whose verdict would settle the matter between the remaining
  candidates.


  ---


