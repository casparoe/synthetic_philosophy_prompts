  ---


  I have been covering a series of small workshops on self-knowledge, and at one of
  them I listened to two researchers argue, over lunch and then again in the afternoon
  session, about whether knowledge can be "self-intimating." I reconstructed the exchange
  from my notes. I want to know exactly who carried which point.


  The first researcher opened with a version of what he called the KK principle: if
  you know that P, then you are at least in a position to know that you know that
  P. He stressed the "at least in a position" qualifier, because he was not claiming
  that anyone actually possesses the higher-order belief at every moment; only that
  the epistemic resources are already there, so a suitably reflective person could
  come to know that she knows, without new evidence. His positive motivation was that
  a state which counted as knowledge but could not support the second-order awareness
  of itself would be a strange sort of achievement: you would be entitled to use P
  as a premise, but you could not, even on reflection, see yourself as knowing it.
  That, he said, makes knowledge epistemically inert when it matters.


  The second researcher answered with what she called the anti-luminosity argument.
  She asked us to imagine a long series of cases running from one in which a person
  is clearly cold to one in which she is clearly not cold, with each adjacent pair
  differing by an amount too small to discriminate. There must, she said, be a last
  case in the series where the person is cold. If the condition being cold were luminous
  — in the sense that whenever it obtains, the person is in a position to know it
  obtains — then at that last cold case, she would be in a position to know she was
  cold. But knowledge requires a margin for error: if your basis puts you in a position
  to know that a condition obtains in a given case, the condition had better also
  obtain in the immediately adjacent case, otherwise your basis would be reliable
  only by luck. So the person would have to be cold in the next case, contradicting
  the premise that the earlier case was the last cold one. She then said: run the
  same argument on the condition knows that P. A series goes from cases where a person
  clearly knows P to cases where she clearly does not. If knowing that P were luminous,
  the KK principle would hold; but the margin-for-error reasoning blocks it. So the
  condition knows that P is no more luminous than being cold, and the KK principle
  fails.


  The first researcher replied that she had slipped between two claims. Luminosity,
  as he accepted it, requires only that you be in a position to know, not that you
  actually know; and the margin-for-error premise, he said, is far too strong once
  it is applied to mere positions rather than to actual judgments. To be in a position
  to know is to have a capacity or an available basis; capacities can be present even
  where the corresponding performance would fail in a single borderline case. He also
  suggested that safety-style premises of the kind she was using are rejected by fallibilist
  and internalist accounts of knowledge, on which evidence can justify knowledge even
  if the same evidence would have been held in a just-barely-different case where
  the belief was false. Her argument, he said, simply stipulates a safety conception
  of knowledge and then derives its consequences.


  She shot back that the margin premise did not apply only to actual judgments, because
  a "position to know" that regularly yields true belief only by luck is not a position
