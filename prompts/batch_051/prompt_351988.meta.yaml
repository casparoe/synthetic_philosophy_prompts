  I''m in a high school philosophy club and we''re reading the bit in Hume''s Treatise
  (Book 3, Part 1, Section 1) where he says that when you look at an action generally
  agreed to be vicious, like deliberate murder, you can examine it from every angle
  and you''ll only find certain passions, motives, volitions, and thoughts; there''s
  no further matter of fact in the object that you could call vice. As long as you
  keep looking at the object, the vice totally slips away. It only shows up when you
  turn your attention inward and catch a feeling of disapproval rising in yourself.
  So he concludes that moral distinctions aren''t derived from reason alone; they
  depend on sentiment.


  Then I found a list of different ways people read this passage in relation to the
  whole "is-ought gap" thing. Could you rank these readings from most to least compelling
  as an actual argument for the claim that you can''t derive an ought from an is?
  Maybe give each a quick reason for its spot.


  List:

  (a) The passage shows that moral properties aren''t part of the empirical facts
  of the world, so any attempt to infer what we ought to do from what is the case
  will leave the normative element unexplained.

  (b) The passage only shows that moral judgments have a motivational or emotional
  component; it says nothing about whether there are normative facts that reason can
  track.

  (c) The passage is best read as psychological claim about how we come to make moral
  distinctions, and psychology can''t settle a logical question about entailment.

  (d) The passage gives a foundational role to sentiment, but sentiment itself can
  be a legitimate source of practical conclusions, so it doesn''t actually create
  a gap.

  (e) The passage is mostly a rhetorical move against rationalist opponents, and treating
  it as a careful argument about the is-ought gap over-reads it.


