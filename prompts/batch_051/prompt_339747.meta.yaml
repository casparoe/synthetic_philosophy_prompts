  The Knobe effect: judgments of intentionality are influenced by the moral valence
  of side effects. Standard explanation (Knobe): people''s concept of intentional
  action is itself sensitive to normative considerations (the "more blameworthy =
  more intentional" reading); or people''s judgments reflect a deeper competence in
  which violations of norms are seen as intentional, whereas conforming actions are
  not: "normative reasons" account. Alternative accounts:

  - The "chairman didn''t care about the environment" information is processed differently:
  in the harm case, his stated indifference conflicts with a salient norm, so participants
  infer he deliberately decided to harm; in the help case, no conflict, so they don''t.

  - Pragmatic/conversational: the question "Did he intentionally X?" invites participants
  to read "intentionally" as "was he blameworthy?" — the contrast: in harm condition,
  saying "not intentional" would sound like an excuse; in help condition, "intentional"
  would sound like praising undeservedly.

