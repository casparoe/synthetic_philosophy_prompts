  - Ex ante Pareto: everyone''s expected welfare is at least as high as status quo,
  some strictly higher.

  - Ex post safety: for no scenario in the uncertainty set does anyone end up strictly
  worse off by more than a de minimis epsilon (or "no one ever ends up worse off").

  - Robustness: the set of scenarios considered includes all the ones the decision
  procedure''s own models assign non-negligible probability, plus adversarial perturbations.

  - No non-consensual risk transfer: the gains to the beneficiaries can''t flow from
  imposing tail risk on a group not compensated/consulted.


