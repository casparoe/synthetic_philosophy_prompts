  I spent my working life as a research scientist, and I only began reading philosophy
  seriously after retiring. The habit I keep coming back to is one I acquired in the
  laboratory: we routinely reasoned with objects and properties we knew to be strictly
  false. We treated a gas as a collection of noninteracting point particles, a crystal
  as a perfect periodic lattice with defects added afterward, and a semiconductor
  as containing positively charged holes, knowing that these were names for collective
  excitations or absences in an underlying many-body system rather than fundamental
  constituents. We did not believe in these objects the way we believed in the apparatus,
  but neither did we take ourselves to be asserting falsehoods. The falsity was doing
  work, and we kept it inside carefully marked boundary conditions.


  Since retiring I have been reading the philosophy of law, and I keep encountering
  the same pattern under another name. A corporation is not a person, yet the law
  treats it as one for standing, liability, contract, and constitutional speech. The
  reasonable person is not any person. A person who records a deed is treated as having
  given notice to the whole world. An adopted child is treated as if she had been
  born into the adoptive line. Lawyers call these legal fictions, and the standard
  observation is that no one is deceived: the proposition is known to be false if
  read literally, but it is maintained deliberately because it organizes legal reasoning,
