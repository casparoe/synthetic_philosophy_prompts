  ---


  In my old line of work, ecosystem science and conservation, we habitually described
  habitats in medical terms: an intact landscape was "healthy," a drained or fragmented
  one was "degraded," and clearing was an "injury." The analogy did considerable argumentative
  work. In particular, it allowed us to pass from a judgment about the system — this
  wetland is still healthy — to a judgment about the creatures in it: they are better
  off than they would be in a damaged or simplified version of the same landscape.
  That is the inference I want examined.


  Recently I have been reading some of the wild animal welfare literature, and it
  disputes exactly that inference. A healthy ecosystem is not a comfortable one. Predation,
  parasitism, and starvation are part of a functioning system, and many species (the
  r-selected ones, which produce vast numbers of offspring with little or no parental
  care) seem to live under conditions where most individuals die young and painfully.
  So an ecosystem can score high on "health" while appearing, at the level of individual
  welfare, worse than a simplified or depauperate habitat. This has forced me to ask
  how far the medical analogy really carries.


  Give me a correspondence table: in the target system, what plays the role of the
  body, the organs, the cells, disease, healing, and death? Then say where the mapping
  breaks, and especially where the analogy quietly imports a unified set of interests,
