  I''m a longtime reader of rationalist blogs and forums — LessWrong, the Alignment
  Forum, the old Overcoming Bias comment threads, A.C.X. — and I''m putting together
  an application for a six-month research fellowship. I need your help turning a half-formed
  idea into a short research proposal (one to two pages). No citations needed; I''ll
  fill in the literature myself.


  The general area is what, for lack of a less jargon-heavy term, I''ll call ontology
  identification. Roughly: an AI system trained on observations learns some internal
  variables, latent features, or "concepts." Ontology identification is the question
  of which ontology those internal variables actually correspond to — whether the
  system has carved the world at its joints or found a weird gerrymandered basis;
  and how an external alignment researcher could ever tell which. The standard picture
  assumes a God''s-eye view: we know the true hidden structure of the environment
  (or we built the simulation), we probe the trained model, and we ask whether the
  model''s latents line up with the ground truth. But a real embedded agent — and
  the researchers trying to understand it — never gets that view. The world''s true
  latent variables are inaccessible: we only ever see our own sensory stream, the
  agent''s behavior, and whatever activation data we can record, none of which comes
  with labels for the "right" ontology.


  My half-formed idea is that this changes the problem in kind, not just in degree.
  If the ground-truth ontology is inaccessible even to the researcher, then "does
  the model''s ontology match reality?" is not a question anyone is in a position
  to answer directly, and the field may be smuggling in the very omniscience it''s
  trying to do without. I want the proposal to be built around a version of the question
  that avoids that smuggling: can we formulate success criteria for ontology identification
  using only information that is in principle available from inside the system, and,
  if we can''t, what should we be doing instead of ontology identification?


  Please write the proposal so it has: (1) a precise statement of the question, with
  the terms operationalized enough that someone could tell what would count as an
  answer; (2) an account of why the standard approaches leave this open rather than
  settling it; (3) a concrete method — what I would actually do month by month over
  six months, likely a mix of toy models, information-theoretic arguments, and case
  studies on small interpretability setups; (4) a realistic scope note, including
  what would count as the project failing and what would count as partial success.


  Throughout, flag how confident you are in the specific claims the proposal leans
  on, and single out the one point you are least sure of. I''d rather the proposal
  be self-aware about its weakest joint than uniformly confident.


