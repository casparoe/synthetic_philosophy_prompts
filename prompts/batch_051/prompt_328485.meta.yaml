  he asks. Suppose he says he will predict n flips of a fair coin; he writes his predictions
  down where I can see them, and he is correct on all n. Then he makes his demand.
  I model the demonstration this way: under the hypothesis that he has the specific
  power he claims over the fate of 10^40 person-years, the probability of a correct
  prediction is 0.99 on each flip; under the null hypothesis that he is an ordinary
  person, it is 0.5. I set a prior of 10^-60 on the power hypothesis before seeing
  the coin flips, and I intentionally use a prior far smaller than the reciprocal
  of the harm to be generous to the skeptical reply. For simplicity, count disutility
