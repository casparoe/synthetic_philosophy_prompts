  Take the usual Pascal''s mugging setup: a stranger asks for $20 and says that if
  I refuse he will inflict an astronomically large amount of suffering — say, 10^20
  years of torture on 10^20 people. The standard expected-value treatment says I should
  pay, provided the probability the threat is genuine is even slightly above 10^-40
  divided by the value of $20 (or whatever); the familiar responses are that utilities
  must be bounded, or that the prior probability of such a specific claim must be
  far smaller than its reciprocal harm, or that tiny probabilities shouldn''t be taken
  literally.


