  Luck egalitarianism: inequalities are just if and only if they result from choices
  for which agents are responsible, and unjust if they result from brute luck. Dworkin
  distinguishes option luck (risks people choose to take, like gambling) from brute
  luck (risks that befall them independently of choice, like being born with a disability
  or hit by a meteor). Luck egalitarians generally don''t compensate bad option luck;
  if you play the lottery and lose, you''re not entitled to compensation, because
  you chose the gamble. But the outcome of a chosen gamble is partly a matter of brute
  luck, and someone with bad option luck ends up worse off through no fault of their
  own in the sense that they didn''t control the outcome. The argument: (1) Luck egalitarianism
  says inequalities are unjust iff due to brute luck. (2) When you voluntarily buy
  a lottery ticket and lose, your resulting poverty is due to an event (the draw)
  that is brute luck relative to your choice—you didn''t control it. (3) So the resulting
  inequality is due to brute luck. (4) Therefore luck egalitarianism must compensate
  the losing gambler. But that seems to gut the view, since compensating chosen gambles
  would be absurd. So either premise 1 needs a more fine-grained reading (choice vs
  brute luck as levels of expectation? ex ante versus ex post?) or premise 2 equivocates.


