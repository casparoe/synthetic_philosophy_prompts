  Draft:


  "I am a retired natural scientist—I spent most of my career in the life sciences—and
  have come to philosophy only recently. I have been reading chiefly on respect, recognition,
  and the moral psychology of holding people responsible, and I have assembled a set
  of positions that I am inclined to endorse. I have been asked to present a short
  statement of my views at a reading group. Before I do, I would like a rigorous consistency
  check.


  The positions I find myself holding are these:


  (1) Morality requires not only that we act rightly, but that we hold certain attitudes
  toward persons. To recognize another person''s moral standing is, in part, to regard
  her in a certain way; a person who extends perfectly correct outward behaviour while
  privately regarding someone as lesser is defective in a way that goes beyond anything
  that appears in his actions.


  (2) An "ought" that is wholly outside an agent''s control is no ought at all. I
  am also persuaded that our beliefs, feelings, and attitudes cannot be adopted by
  simple decision or willpower. Consequently, no defensible account of our duty to
  recognize others can require an agent to produce the appropriate attitude on command;
  it must be an account of how such attitudes are cultivated, maintained, and repaired
  through things that are within our control — attention, exposure, habit, and the
  like.


  (3) The reactive attitudes — resentment, indignation, gratitude, and the rest —
  are not optional extras in our dealings with one another. To stand in these attitudes
  toward someone, and to be answerable to hers, is part of treating her as a responsible
  agent. A stance of purely diagnostic or managerial treatment toward a wrongdoer
  would withhold from him something to which he is entitled if he is entitled to be
  treated as one of us.


  (4) It is normally inappropriate to blame a person in the full sense for an attitude
  he acquired without choosing it, does not endorse, and is actively working to counteract
  — the familiar case of implicit or culturally inculcated bias. Such an attitude
  does not express his will or his evaluative commitments in the way that would make
  blame apt; it is, at most, a cause for regret and a reason for self-management.


  (5) Law and public policy are blunt instruments whose proper jurisdiction is outward
  conduct. A liberal state may require equal treatment and prohibit discrimination,
  but it should not attempt to police inner attitudes or punish citizens for failures
  of recognition as such.


