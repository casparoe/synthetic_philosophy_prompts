  "Among political philosophers, John Stuart Mill is often remembered as the author
  of On Liberty, which appears to set a single, universal standard for when society
  may coerce an individual: roughly, that coercion is permissible only to prevent
  harm to other people. Yet when one turns to his parliamentary testimony, East India
  Company dispatches, and writings on non-European societies, a different principle
  seems to be operating. There, Mill repeatedly accepts that a ''civilized'' government
  may rule a people it considers ''barbarous'' without their consent, so long as the
  rule aims at improving them. I want to know whether these two positions are best
  understood as the same theory applied to different stages of social development,
  or as two competing theories that Mill never fully brought into contact. Compare
  the universalist structure of the harm principle with the developmental and paternalistic
  argument for colonial rule. In particular: does the harm principle contain an implicit
  test of ''civilizational maturity'' that licenses the colonial exception, or does
  the colonial argument require importing assumptions that the harm principle cannot
  supply? And if the latter, is there a reading of Mill on which he held both positions
  sincerely without noticing the tension? The challenge is to avoid both the apologetic
  move—treating the colonial argument as merely a product of its time—and the debunking
  move—treating the harm principle as mere window dressing for empire."


