  But then he sets up the Platonia dilemma: twenty people get an offer, if exactly
  one sends a telegram they get a billion dollars, if two or more send nobody gets
  anything, and if nobody sends nobody gets anything. About it he writes: ''Clearly,
  everyone will want that billion. Clearly, everyone will realize that if their name
