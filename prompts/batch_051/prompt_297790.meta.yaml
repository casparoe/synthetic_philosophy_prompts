  "Suppose we accept the principle that for any truth p, it is possible for someone
  to know that p. Call this the Knowability Principle. I came across a proof that
  this principle collapses into the much stronger claim that every truth is actually
  known. The proof goes like this. Let p be any true proposition and suppose, for
  reductio, that p is not actually known by anyone. Then the conjunction ''p, and
  no one knows that p'' is true. By the Knowability Principle, it is possible for
  someone to know that very conjunction. But knowing a conjunction requires knowing
  each conjunct. So in that possible situation, someone knows that p, and someone
  also knows that no one knows that p. Now, knowledge is factive: if you know that
  no one knows that p, then it is true that no one knows that p. But then the same
  possible situation contains both someone who knows that p and the fact that no one
  knows that p — a contradiction. Since assuming p is true but unknown leads to contradiction,
  it cannot be the case that p is true but unknown. Therefore every truth is actually
  known."


