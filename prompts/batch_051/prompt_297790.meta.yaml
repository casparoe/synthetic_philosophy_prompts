  Draft:


  "I came to philosophy late, after a career in experimental physics, where a derivation
  either goes through or it doesn''t and one wants to know exactly which line to blame.
  Recently I''ve been reading about the knowability principle — roughly, the claim
  that every truth can in principle be known. It has an astonishing consequence that
  I am told follows from it: every truth is actually known. The proof I was given
  runs as follows.


  (1) Suppose the knowability principle holds: for every true proposition, it is possible
  that someone knows it. (2) Let p be a true proposition and suppose for reductio
  that p is not actually known by anyone. (3) Then the conjunction ''p, and no one
  knows that p'' is a true proposition. (4) By the knowability principle, it is therefore
  possible that someone knows that conjunction. (5) Whoever knows the conjunction
  knows each conjunct; so in that possible situation, a person knows that p and also
  knows that no one knows that p. (6) Since knowledge is factive, if that person knows
  that no one knows that p, then in that situation no one knows that p. (7) But that
  person also knows that p, so someone in that situation knows that p. (8) Contradiction.
  Hence the supposition that p is true but unknown is impossible; since p was arbitrary,
  every true proposition is actually known.


  I am told the standard move is to accept the proof and restrict or weaken premise
  (1). I dislike that move — it smells like saving a theory by carving off the troublesome
  cases after the fact. More importantly, when I rerun the same derivation with ''justifiably
  believed'' or ''supported by adequate evidence'' in place of ''known'', the conclusion
  is obviously false, so something structural must be going wrong, not merely a missing
  restriction. Please give me a committed diagnosis. Is the original proof valid?
  If not, state exactly which step fails and under what reading. If it is valid, say
  precisely which premise or assumption must be rejected or restricted, give the strongest
  formulation of that restriction that is not merely a device to avoid the counterexample,
  and then explain whether or how the belief/evidence variant fails at a different
  step — or whether its failure tells us only that factivity was doing the real work."


