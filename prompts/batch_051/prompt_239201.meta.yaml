  I am putting together a short adult-education series on how to think about apparent
  conflicts between Scripture and natural science, and I want to test the coherence
  of the position I''m planning to present. I would rather be corrected now than teach
  a muddle. The position is broadly Galilean, drawing on the Letter to the Grand Duchess
  Christina, and I hold all of the following:


  1. Scripture has a primary purpose: to teach what is necessary for salvation and
  how to live a holy life, not to provide an astronomical or physical account of the
  cosmos.

  2. The sacred writers accommodated their language to the ordinary capacities and
  beliefs of their audiences, so passages may speak of the sun rising or the earth
  standing firm without making a physical assertion.

  3. When a physical claim has been established by reliable sense experience and necessary
  demonstration, one is not free to ignore it simply because a literal reading of
  Scripture appears to conflict with it; instead, the literal sense should be reconsidered.

  4. Genesis 1 should not be read as a science textbook, but it remains true in whatever
  sense the Holy Spirit intended through the human author.

  5. The Church''s teaching authority may give a definitive reading of contested biblical
  passages, and I should not privately set that reading aside merely because a current
  scientific theory points elsewhere.

  6. No empirical theory is ever demonstrated in the strictest sense; scientific knowledge
  is always revisable, and what counts as a necessary demonstration can shift as instruments
  and arguments improve.

  7. The debate over Copernicanism was a case in which the newly available telescopic
  evidence and mathematical astronomy should have led interpreters to revisit the
  geocentric passages, even though there was not yet a full mechanics of a moving
  earth.


