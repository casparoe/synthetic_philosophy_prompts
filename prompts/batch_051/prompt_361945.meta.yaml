  that are auto-silenced. The company wants to know whether these dormant rules still
  bind.


  The prompt should introduce desuetude accurately but without requiring prior knowledge.
  In law, desuetude is a doctrine by which a statute may lapse if it has been unenforced
  for a long time and is contrary to current practice, especially in some civil law
  traditions (and sometimes in common law, though rare). The competing idea: under
  rule of law, a valid law remains binding until repealed; selective non-enforcement
  creates arbitrariness. The prompt writer can state: "I''ve come across the legal
  doctrine of desuetude — the idea that a law can lose force through long non-enforcement
  coupled with contrary practice — and the standard rule-of-law objection that letting
  disuse repeal a rule makes enforcement arbitrary and denies people notice of what
  is in force." That injects the niche content.


  The ask: a reusable decision procedure for the team to follow, runnable by an engineer
  without legal training, that decides for each dormant rule whether to (a) re-enforce,
  (b) formally sunset/remove, or (c) escalate to a human/legal owner. Include:

  - questions in order,

  - what counts as sufficient evidence at each step (e.g., how long, how many violations
