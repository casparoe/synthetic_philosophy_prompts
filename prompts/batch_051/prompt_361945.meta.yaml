  Consider the setting: A software engineer at a company that maintains a large codebase
  and internal policy system. Many rules exist in CI checks, code review checklists,
  incident response playbooks, and a governance handbook. Some have gone unenforced
  for years — e.g., a lint rule that''s disabled and nobody re-enables; a policy requiring
