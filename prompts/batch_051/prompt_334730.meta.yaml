  "As a novelist, I have spent several years trying to write first-person scenes in
  which a character''s later judgement is made to feel inevitable to the reader. The
  workshop advice is familiar: first give the reader the bare perception, uncoloured
  by the character''s interpretation, and let the judgement follow from it. I have
  come to believe this advice is not merely difficult but impossible, and that the
  impossibility is not a fact about prose but about justification. Any sentence of
  narration selects one detail rather than another, picks a lexical register, and
  thereby classifies what it reports. There is no sentence that simply hands over
  the given. I have started calling this view the narrative given, and I apply it
  in drafting: whenever a passage is written as if it could justify a character''s
  belief by setting down an uninterpreted experience, I mark it as the fallacy of
  the innocent detail and rewrite it so that the character''s conceptual commitments
  are already visible in the description itself. I am not a professional philosopher,
  but the view seems to me to be close to what Sellars attacks under the name of the
  myth of the given, transposed from perception and justification into narrative craft.
  My question is whether the transposition is sound. Is the narrative given genuinely
  the same mistake Sellars identified, or have I merely pressed an analogy until it
  looked like an argument? If the analogy is illuminating, what would count as the
  space of reasons for narrative prose? And where does the view fail — are there honest
  roles in narration for something that functions as a non-inferential anchor, and
  does my drafting rule eliminate something a good novel needs? Give me the three
