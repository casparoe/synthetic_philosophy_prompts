  Ravi opened: "The current global year number is not a neutral piece of bookkeeping.
  It takes the presumed birth of Jesus as the pivot of history, and it does so without
  a year zero, so the sequence literally goes 1 BCE, 1 CE. We could keep the same
  months and lengths but renumber from the start of the Holocene, roughly when agriculture
  and the first settled societies emerged, so that this year would be about 12,025
  HE. A date like that makes the calendar a genuinely common human project rather
  than a parochial inheritance, and a reform would also let us insert a year zero
  and remove a standing arithmetical incoherence."


  Lena answered: "That gets the point of a civil calendar backwards. A calendar is
  a coordination device, not a historical essay. Nobody who writes the date is asserting
  anything about Jesus; they are using a token we all recognize. The present epoch
  is justified by the enormous network that already uses it. The Holocene proposal
  just replaces one arbitrary pivot with another: agriculture did not begin in a single
  year, and ''the Holocene'' is a geological interval, not a datable event. Paying
  large transition costs for a different arbitrary pivot is not an improvement."


