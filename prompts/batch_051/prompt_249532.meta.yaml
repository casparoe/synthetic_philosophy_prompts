  there is no single canonical "draft" that is consciousness; probing (e.g., asking
  a question) can create a narrative. "There is no single stream of consciousness"
  is a Dennett claim. "There is no central meaner" is more about the self; Dennett''s
  later work. The self as "center of narrative gravity" — an abstraction, not a thing
  in the brain. Good.


