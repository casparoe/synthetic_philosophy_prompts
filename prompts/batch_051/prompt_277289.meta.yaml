  Essay draft:


  "The absent-minded driver problem, in its standard form, runs as follows. A driver
  on a highway must eventually take the second of two successive exits. The exits
  are indistinguishable from the road, and the driver has no short-term memory of
  having passed one, so whenever he arrives at an exit he does not know whether it
  is the first or the second. If he exits at the first exit, he receives 0; if he
  exits at the second, he receives 4; if he continues past both, he receives 1. Before
  setting out, the driver can choose a rule: exit with probability p at any exit.
  The expected value of a rule p is V(p) = 4p(1−p) + (1−p)^2, which equals (1−p)(1+3p).
  This is maximized at p = 1/3, giving V = 4/3.


  The puzzle begins when we ask what the driver should do at an exit. If the rule
  p is in force both now and at any indistinguishable later exit, the probability
  that an arbitrary arrival at an exit is the first exit is 1/(2−p), and the probability
  that it is the second is (1−p)/(2−p). The expected value of exiting now is 4(1−p)/(2−p),
  and the expected value of continuing now is 2(1+p)/(2−p). These are equal exactly
  when p = 1/3. Thus, at the planning-optimal rule, the driver is indifferent at every
  exit. Some authors take this indifference to be the whole point: the driver has
  no strict incentive to deviate from his plan. But there is something odd here. If
  the rule in force were p < 1/3, exiting at an exit would be strictly better than
  continuing; if it were p > 1/3, continuing would be strictly better. So a driver
  who arrived at an exit and treated his future rule as fixed would find his current
  action and his ex ante optimum pulling apart, except in the knife-edge case."


