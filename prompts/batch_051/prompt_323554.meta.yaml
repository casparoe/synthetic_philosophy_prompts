  Potential final prompt draft:


  "I spend most of my time building systems that infer what people want from what
  they do. The setup is inverse reinforcement learning: instead of specifying a reward
  function by hand, I give the system examples of a person''s behavior and it finds
  the reward function that best explains them. The systems then plan by maximizing
  that learned reward. People on my team talk about these systems ''having preferences,''
  and I want to work out whether that is ever literally true.


  Here are the criteria I have been using for saying that something has a preference
  for X over Y:


  1. Availability: when X and Y are both available and the choice is otherwise unforced,
  it tends to take X.

  2. Cost-sensitivity: it continues to take X when X is made moderately more costly
  than Y, but eventually switches if the cost gets high enough — so the preference
  is a rate of exchange as much as a ranking.

  3. Consistency: the X-over-Y ordering shows up across many contexts, not just in
  the specific situations where it was observed.

  4. Ownership: the entity can reveal the preference in some mode that goes beyond
  the choices themselves — for example, by telling you it prefers X, by complaining
  when it is forced to take Y, or by re-describing its own reasons.


  Now the case. I trained a route planner with inverse RL on several years of one
  driver''s GPS data. The recovered reward puts a large weight on minimizing travel
  time, a smaller weight on avoiding complex intersections, and almost no weight on
  scenic value. Deployed in a city the driver has never visited, the planner consistently
  selects fast, left-turn-heavy routes over slower, simpler ones; it accepts an extra
  15 percent of delay before it switches to the scenic route; and it makes the same
  tradeoffs across the city, at different times of day. But when we inspect the system,
  all we find is a vector of weights and a value-iteration routine. It does not describe
  itself as wanting anything, it cannot say that it prefers fast routes, and it does
  not exhibit any sign of dissatisfaction when we force it, for a simulation, to take
  slow routes.


  Does this route planner have a preference for fast routes, in the sense given by
  the four criteria? Work criterion by criterion, say where the criteria fail to settle
  the matter, and then tell me whether the case shows that the criteria need revising
  — in particular, whether criterion 4 is doing real work or whether it is smuggling
  in a subjective, first-person notion of wanting that the other three criteria were
  never committed to."


