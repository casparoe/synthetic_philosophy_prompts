  The pattern: You''re analyzing a system with levels — a higher level and a lower
  level, or a "controlling" level and a "controlled" level. You try to explain the
  higher level in terms of the lower one. But when you go down, you find that the
  lower level only functions as it does because it already presupposes the higher
  level; the bottom level turns out to contain, or be constituted by, the very thing
  you were trying to explain. And when someone keeps asking "but what explains that
  level?" and you keep descending, there''s a floor you shouldn''t try to eliminate
  because eliminating it doesn''t explain the system — it just makes it stop being
  the system. The explanation bottoms out not in a rock-bottom element but in a loop.


