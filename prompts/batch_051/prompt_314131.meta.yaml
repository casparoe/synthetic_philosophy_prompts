  I work on a policy research team that advises governments on the governance of frontier
  AI systems. Our team operates under an informal but firmly enforced norm: no written
  analysis goes out unless it is anchored in at least one historical analogy, drawn
  in practice from a fixed stock of three — nuclear weapons, the printing press, and
  the Industrial Revolution. We treat these analogies as carrying real causal structure
  rather than merely rhetorical color. The nuclear-weapons analogy imports state secrecy,
  arms-race dynamics, deterrence logic, export controls, and a picture of a small
  number of decisive actors. The printing-press analogy imports a nearly opposite
  apparatus: decentralized diffusion, cheap copying, the slow democratization of knowledge,
  the futility of information suppression, and benefits that arrive only after prolonged
  disruption. The Industrial Revolution tends to serve as a middle case, capturing
  economy-wide transformation, labor displacement, and long time horizons.


