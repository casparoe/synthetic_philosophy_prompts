  I keep returning to a problem while covering consciousness science and adjacent
  welfare debates, and I want the underlying principle worked out rather than another
  survey.


  For several years I have been using a rough working formula for comparing experiences
  across different kinds of minds: the weight of an experience is the product of two
  quantities — how conscious it is, on a scale from zero to one, and how good or bad
  it feels on that one scale. (Something like one "unit" of pleasure in a half-conscious
  state counts half as much as the same unit in full consciousness.) The formula has
  sharp consequences: zero consciousness means zero weight no matter how intense the
  displayed state; a sufficiently large difference in felt intensity can compensate
  for a difference in consciousness; and halving both dimensions quarters the value.


  My verdicts on actual cases have stopped fitting the formula, and I want to know
  what principle does fit.


  1. The asleep reward system. Suppose an intervention could keep a patient with no
  consciousness whatever in a state of maximal neural reward for a year. (Stipulate
  that we can be certain there is no experience; I know the science is contested.)
  I judge that no duration of such "reward" is worth sacrificing a single pleasant
  afternoon of a conscious person; it counts for nothing. This is the formula''s best
  case.


  2. The writhing mouse and the human headache. Assume for argument that a mouse is
  less richly conscious than a human but not drastically so. I judge that a mouse
  in severe pain should be helped before a human with a mild tension headache — the
  pain difference outweighs the consciousness difference. If someone proposes that
  human-level consciousness has lexical priority over all animal suffering, I would
  reject it.


  3. The many fish. Now suppose a very large number of fish, each experiencing something
  mildly unpleasant but not intense. Stipulate that a fish is a little conscious,
  much less than a mouse. I find that no finite number of these mildly unpleasant
  fish states outweighs one alert human''s substantial but bearable anxiety, even
  though the product formula says that once the fish count is large enough the summed
  discounted suffering must win. And if I try to avoid this by giving human-level
  consciousness lexical priority, I contradict my verdict on the mouse.


  4. The double discount. A person in a drowsy, half-present state experiences a pleasant,
  moderate sensation, and an alert person experiences the same kind and intensity
  of sensation. The product formula says the first is one quarter as valuable if the
  drowsy state is half as conscious and half as intense. My verdict: the first is
  only somewhat less valuable, not a quarter; the formula discounts the same thing
  twice.


  5. The threshold at zero. The product formula respects a discontinuity at zero —
  any sliver of consciousness, multiplied by enormous suffering, can still matter.
  I hold that even the dimmest consciousness with sufficiently extreme suffering matters,
  but I also hold that a state with exactly no consciousness does not matter even
  if its behavior is identical. I don''t know whether this discontinuity should be
  built into whatever replaces the formula.


  Is there a single principle that captures all five verdicts, or at least captures
  four while cleanly overturning the one it cannot accommodate? I can see candidate
  repairs: maybe consciousness enters lexically at zero but is otherwise just a weight;
  maybe intensity is discounted in a way that stops small harms from aggregating across
  many low-consciousness minds; maybe the right structure is additive rather than
