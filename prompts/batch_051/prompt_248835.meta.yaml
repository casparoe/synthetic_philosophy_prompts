  Libet-style experiments show the brain has already "decided" before the subject
  becomes consciously aware of intending to act, so the conscious intention is a post
  hoc confabulation and free will, at least as a causal force, is in trouble. I want
  you to play it straight and tell me what would have to be true for that conclusion
  to be wrong.


  Walk me through the load-bearing assumptions and what the world would have to look
  like for each to fail: (a) that the readiness potential is a decision signal rather
  than, say, the ramping of a stochastic accumulator toward a threshold (the Schurger-style
  story), so that the early RP is just what a decision process looks like before it
  crosses threshold; (b) that the W-time judgment actually timestamps the moment of
  conscious intention rather than being itself a retrospective construction; (c) that
  a spontaneous wrist flexion is a good stand-in for the kinds of choices people care
  about, rather than a proximal "when to move now" task with no deliberative content;
  (d) that the conscious veto doesn''t matter — either because it''s rare, or because
  it would itself need a readiness potential; (e) that temporal order (brain activity
  before awareness) is enough to establish epiphenomenalism, rather than just being
  compatible with various compatibilist or non-causal accounts.


