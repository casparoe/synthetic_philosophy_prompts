  Verisimilitude:

  - Popper (1963) introduced verisimilitude to reconcile: science aims at truth, yet
  all/best theories are false (Newton superseded). We can say one false theory is
  better than another if closer to truth.

  - Popper: content of a theory = class of its logical consequences. True content
  = intersection with true statements; false content = with false statements. Verisimilitude
  = true content minus false content; comparative: A has more verisimilitude than
  B iff A entails all B''s true consequences (or true content greater) and does not
  entail more false consequences...

  - Problem: Tichý, Miller. Also content comparisons require comparing sets of consequences
  — for false theories, the true consequences of an interesting theory may not be
  a superset; and the false consequences proliferate.

  - Alternative: define distance between theories as sets of possible worlds (Tichý''s
  own? Niiniluoto''s likeness; Oddie''s average distance). Truth = one distinguished
  world or complete state; truthlikeness of a theory = function of distances from
  its worlds to actual world. Problems: how to weight worlds (all logically possible,
  infinite), which similarity metric, language-dependence, "translation invariance"
  puzzle (Miller''s argument that any two false theories can be made equidistant by
  suitable redescriptions?).


  Mapping to statistics:

  - Theory → statistical model (set of probability measures) or a point estimator.
  For verisimilitude, theory is a proposition; in stats, claims are typically about
  a parameter or predictive distribution.

  - Truth → true data-generating process (DGP) or true parameter value.

  - Closeness to truth → divergence (KL, Hellinger, total variation) between the model''s
  closest element and the DGP; or risk of an estimator. For deterministic theories
  with crisp predictions: compare to a point prediction; but DGP is stochastic, so
  "distance to the true DGP" not literal point.

  - Content → the model''s support or the sharpness/concentration of its predictive
  distribution; deductive closure is like the set of distributional consequences?
  But a logical consequence of a theory is not just a prediction — it''s any statement
  entailed, including theoretical statements (e.g., "there are unobservable entities").

  - True content → set-membership of correct entailments; in probability, correct
  predictions are scored by proper scoring rules on realized outcomes. However, content
  contributes to verisimilitude not to accuracy: two models can have same divergence
  but different sharpness? Actually a sharper forecast that''s wrong is penalized
  more; a perfectly calibrated forecaster... Content resembles variance/entropy; more
  content = more specific. The philosophical notion wants a trade-off: all else equal,
  more truth-content is good, more falsity-content is bad. In forecasting, sharpness
  is not good per se; only sharpness subject to calibration. Proper scoring rules
  resolve the trade-off via penalties. That''s an interesting translation: "the proper-scoring-rule
  solution to the content trade-off" — but it differs because scoring rules don''t
  reward true content per se; there is no separate reward for saying true specific
  things beyond predictive accuracy, whereas Popper thought accumulating true consequences
  is intrinsically good.

  - The comparative failure → non-nested models: Popper''s subset condition corresponds
  to nesting of supports/cone? Actually for models as sets of distributions, model
  nesting (one model contains another) is the analog of content inclusion, and general
  model comparison between non-nested models is handled by divergence; but divergence
  defines a specific distance expected by the analyst, not a language-independent
  order. Two theories with different outcome spaces can''t even be compared by total
  variation — corresponds to incommensurability.


  Residue:

  - What doesn''t survive: the distinction between a theory''s content and its predictive
  distribution. Scientific theories (Newtonian mechanics) aren''t statistical models:
  they carry commitments about entities, laws, counterfactuals, explanatory structure,
  which may have no observational signature in a scoring rule. In a DGP framework,
  any two theories with the same predictive distribution are statistically indistinguishable
  and would be equivalent — but philosophers think they can differ in verisimilitude
  (e.g., one posits the right micro-structure and one doesn''t). That''s an important
  residue favoring the philosophical problem being real; or a challenge: if two theories
  have identical prediction, can one be closer to truth? Many philosophers say yes
  (truth transcends empirical equivalence), so scoring rules can''t capture verisimilitude
  fully.

  - Also: scoring rules reward probabilistic hedging; theories are usually not probabilistic
  (they''re false, but philosophers want a notion of distance to truth for false,
  categorical theories).

  - Also language-dependence: no natural parameterization. Statisticians know divergence
  values depend on parameterization? Actually KL and Hellinger are invariant under
