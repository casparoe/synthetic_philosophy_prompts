  KL is invariant under bijective transformations. But if two scientists coarsen outcome
  space differently, divergence changes. The philosophical debate about language-dependence
  maps to coarsening/aggregation.

  - Verdict: part of the residue is a defect of statistical vocabulary (it can''t
  represent non-predictive content), and part is a defect in the philosophical problem
  (it never specified a measure, and without a measure the comparisons are underdetermined
  — statisticians learned to supply explicit losses).


