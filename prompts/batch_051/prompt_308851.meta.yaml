  doesn''t like. Before I go further into the literature, I want the standard set
  first: what does a theory — or even just a usable working definition — of democratic
  backsliding have to deliver before it earns the right to be used across Hungary,
  Poland, Turkey, and the United States?


  A passage I want woven through your answer comes from James Madison, The Federalist
  No. 10 (1787):


  [quote]


  Madison identifies the mortal diseases of popular government as instability, injustice,
  and confusion in the public councils themselves — not as armies or coups. That sits
  awkwardly against the modern discussion, which tends to focus on elected executives
  using formally legal means to disable courts, the press, and election administration.
  So your criteria have to take a position on this: is Madison describing democratic
  backsliding, or something else? If it is backsliding, an adequate account must be
  broad enough to catch gradual faction-generated rot; if it is not, the account owes
  a principled boundary between backsliding and these older diseases.


  Please write the desiderata: the full list of requirements any adequate account
  must meet, each with the case or consideration behind it. Mark which are nonnegotiable
  and which are preferences of a particular camp. Make sure the list says how the
  account (a) avoids classifying every loss by one''s own side as backsliding, (b)
  handles incremental lawful erosion as well as sudden illegal seizures of power,
  (c) specifies — or deliberately refuses to specify — a threshold or a matter of
  degree, (d) says who gets to judge that a country is backsliding, and (e) treats
  the passage above as a test case it must classify. Flag any pairs of requirements
  you suspect cannot be jointly satisfied. End by telling me how confident you are
  in the overall list and singling out the single point you are least sure of."


