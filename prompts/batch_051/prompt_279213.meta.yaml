  each case in order, and flag any case where it gives a verdict that seems wrong,
  or gives no verdict at all; then revise the definition or defend the surprising
  verdict.


  The cases:


  1. A nurse who works for decades under harsh conditions and saves many lives, but
  who hates the work, takes no satisfaction or pride in it, and would leave if she
  could.

  2. A retired person who spends 30 years comfortably watching television, with no
  projects, no close relationships, and almost no memory of the hours passing. I''m
  confident this life is not meaningful.

  3. Sisyphus, condemned forever to roll a boulder up a hill only to see it roll back
  down, who has come to embrace the task itself and no longer wishes to be doing anything
  else.

  4. A mathematician who devotes his career to proving a beautiful conjecture. After
  his death the proof is shown to rest on a fatal error and his manuscripts are discarded.

  5. A woman who spends three decades building and tending a garden on her own land,
  mostly for her own satisfaction; it is genuinely beautiful, but almost no one else
  will ever see it. I lean toward calling this meaningful, but I can''t defend the
  lean.

  6. A man who dedicates his life to counting and recounting the fibers in a single
  carpet, keeping meticulous ledgers, and who feels deeply absorbed and purposeful
  doing it. I''m confident this is not meaningful.

  7. An activist who spends his life in a cause that fails while he is alive and that
  he thinks has failed; years after his death the cause succeeds partly because of
  groundwork he laid, though no one remembers him. I''m confident this is meaningful.

