  Let me refine the philosophical substance.


  The extended mind thesis (EMT): Clark and Chalmers 1998 "The Extended Mind". Parity
  principle: If, as we confront some task, a part of the world functions as a process
  which, were it done in the head, we would have no hesitation in recognizing as part
  of the cognitive process, then that part of the world is part of the cognitive process.
  Otto''s notebook: Otto has Alzheimer''s, writes addresses in notebook, consults
  it; Inga recalls from biological memory. They argue Otto''s notebook plays the same
  role as Inga''s memory, so it''s part of his cognitive process. Critics: Adams and
  Aizawa argue cognitive processes must involve non-derived content / original intentionality;
  the notebook has derived content. Others argue "cognitive bloat": if any external
  resource that meets parity counts, the mind extends to everything (calculator, phone,
  Google), which is counterintuitive. Clark responds with "trust and glue" conditions:
  resource must be reliably available, automatically endorsed, accessible when needed,
  etc. But Clark and Chalmers also mention the notebook is "constantly available"
  and "automatically endorsed."


  The niche angle: what about resources that fail, are shared, are maintained by others,
  or are only partially available? The "trust and glue" conditions are designed to
  avoid bloat, but they seem to exclude many real scaffolds (e.g., my mother''s notebook
  which she sometimes forgets, or which I update, or which is shared). If the conditions
  are loosened, bloat returns; if tightened, the thesis doesn''t cover the cases that
  motivated it (actual dementia scaffolding). So the proposal question: what exactly
  is the modality of "availability" in the extended mind thesis, and does any non-ad-hoc
  version of the thesis cover real-world cognitive scaffolding without licensing cognitive
  bloat?


  Alternatively: The proposal could be about whether EMT is a claim about constitution
  vs. causation. Clark later distinguishes "hypothesis of extended cognition" (HEC)
  from "hypothesis of embedded cognition" (HEMC). HEC is the strong claim (external
  states are literally cognitive), HEMC is weaker (external resources scaffold cognition
  but are not constitutive). The question: whether the evidence that is normally cited
  for EMT (parity cases) supports only HEMC, and whether there is any argument that
  would force the move from HEMC to HEC. This is a known debate (Clark 2008, Rupert).
  The novel angle: test this against distributed, shared, failing scaffolds; argue
  the parity argument, even when repaired with trust-and-glue, supports at most an
  explanatory claim about coupled systems, not a constitutive claim, and that attempts
  to bridge the gap either beg the question or trivialize.


