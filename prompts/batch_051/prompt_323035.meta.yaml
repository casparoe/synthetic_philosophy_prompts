  ---


  For the past year or so I have been following a rule in my own conversations, and
  I am no longer sure it is a good one. The rule is this: when I am deciding what
  a person has actually communicated to me, I restrict myself to what their words,
  taken in their ordinary sense, say. If they say "the meeting is at three," I accept
  that the meeting is at three. But if they say "it''s cold in here" and the room
  is cold, I accept only that they find it cold — I refuse to infer that they want
  the window shut, that they are hinting at someone''s stinginess with the heating,
  or anything else. I treat the literal content as the whole of what they have claimed,
  and I refuse to count hints, tone, omissions, facial expressions, or what a reasonable
  person would take them to be implying as evidence about what they mean.


  I adopted this because I kept being burned by "reading between the lines": several
  times I acted on what a person had merely implied, and it turned out they meant
  nothing of the sort, or meant something I overreached. Now I keep running the opposite
  direction. A friend recently told me, about an applicant for a job, "she is punctual,
  and her desk is very tidy." I took that as a positive reference. A colleague later
  told me I had missed what the friend was plainly signaling — that the applicant
  was otherwise unremarkable — and I made the wrong hire. A partner said "I''m fine"
  in a flat voice, and I took it at face value; the argument that followed made it
  clear the words were a protest, not a report. And a doctor told me "some people
  find this procedure uncomfortable," and only later did I realize she probably meant
  that I would find it very uncomfortable.


  So now I am asking whether my literal-only policy is defensible, or whether it is
  just a bias I have dressed up as a principle to avoid the hard work of judging people
  — and if it is somewhere in between, how it should be amended. I am not asking about
  contexts like contracts or courtroom testimony, where interpretive rules are imposed;
  I mean ordinary talk, among friends and colleagues.


  Please organize your answer in these sections, in this order:


  1. The policy, restated precisely (roughly one paragraph).

  2. Where it works (roughly two paragraphs): the situations in which a literal-only
  rule is actually reliable, or at least protects me from real errors.

  3. Where it fails (roughly three paragraphs): the situations in which the words
  do not exhaust what was communicated, and what is lost by ignoring those signals
  — use my four examples, or improve on them.

  4. A repaired version (roughly two paragraphs): restate the rule so that it keeps
  the protections I care about without the costs you identified.

  5. Your verdict (roughly one paragraph): whether my original policy is defensible,
  indefensible, or mostly one of those with qualifications.

  6. What would change your mind (roughly one paragraph): the consideration, example,
  or counterexample that would most shake your verdict, and the step in your reasoning
  you think is most likely to fail.


