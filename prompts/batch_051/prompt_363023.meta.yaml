  Let me refine the philosophical content.


  Core idea: The extension of welfare science to aquatic animals has happened by borrowing
  concepts and metrics from terrestrial livestock; but these concepts are now doing
  hidden work. Three candidate definitions:

  1. Feelings-based (welfare consists in subjective affective states).

  2. Function-based (welfare consists in health, growth, reproduction, physiological
  coping).

  3. Nature-based (welfare consists in living according to species-typical behavior/natural
  life).


  For fish and decapods:

  - Feelings-based: controversial; if we haven''t settled whether they have subjective
  states, defining welfare as subjective states makes the central question circular,
  and assessments that use it quietly presume the answer.

  - Function-based: applicable even without sentience, but would suggest we can measure
  welfare with growth rates and stress hormones; that fails to distinguish an animal
  that is healthy but miserable from one that is sick but content (if those distinctions
  make sense), and it can''t motivate the stronger conclusions advocates want—indeed
  it would allow "welfare" to be an attribute of plants or machines.

  - Nature-based: less applicable in tanks/ponds where "natural" is ambiguous; teleost/crustacean
  "natural" behavior may have no determinate equivalent in captivity, and preserving
  wild behavior may conflict with stocking density economics.


  The unexamined hybrid: scientists and certifiers move among these definitions depending
  on which metric is at hand; this lets them certify improvements without committing
  on sentience. The project would treat stunning and slaughter protocols, stocking
  density, and enrichment as case studies to surface the definitional commitments.


  Question: "Can a coherent concept of welfare underwrite welfare assessment for teleost
  fish and decapod crustaceans in aquaculture without first settling the sentience
  question, and if so, which concept?" Or "What exactly is being assessed when a welfare
  audit certifies...?"


