  Jeffrey conditionalization: standard Bayesian conditioning says you learn a proposition
  E with certainty, and update P_new(H) = P_old(H|E). But often evidence is not certain;
  e.g., you glimpse something in poor light, or a sensor returns a fuzzy reading;
  your degree of belief in E goes from 0.7 to 0.9, not to 1. Richard Jeffrey proposed:
  P_new(H) = Σ_i P_old(H | E_i) * P_new(E_i) where {E_i} is a partition whose probabilities
  shift directly on the experience (the "direct effect" of the experience changes
  probabilities over the partition), and conditional probabilities on those partition
  cells stay fixed (rigidity). The claim to test: is Jeffrey conditionalization a
  normatively correct rule—or an empirical description of how minds actually update—or
  are those different questions?


  For a software engineer: they might have a robot that updates a belief over states
  given a noisy sensor reading; they treat the sensor model as likelihoods and use
  Bayes. But Jeffrey conditionalization is a generalization. The conceptual difficulty:
  when evidence is uncertain, you can always re-describe the evidence as a certain
  proposition ("my sensory experience is thus-and-so") and use strict conditionalization
  on that—this is the "certainty of experience" move (Lewis, maybe). The question:
  is the difference substantive or just about bookkeeping? Testing could involve:
  building agents, or surveying human probability updates, or asking whether the rule
  is self-consistent via Dutch book arguments.


