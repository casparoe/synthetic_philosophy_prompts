  Draft:


  I follow a small online discussion group for people who like hard theological puzzles,
  and I don''t have any formal background in philosophy or theology, so I mostly just
  listen and re-read the threads. A while back, two members I''ll call Daniel and
  Ruth got into a long argument about the fall of the angels, and I have never been
  able to sort out which of them was right. It went, roughly, like this.


  (Dan) We start with an angel created good — no body, no passions, no bad company,
  nothing outside his will that could pull him toward evil. So the first bad act had
  to come entirely from inside him, as a free act. Where else could it come from?
  But that''s the puzzle: how does a good will, on its very first bad move, produce
  evil out of itself?


  (Ruth) I think the puzzle is worse than you''re making it. You can only choose what
  appears good to you. A good will sees the good accurately and loves it. So before
  the first sin there was nothing in the angel that could prefer a worse thing to
  a better one. If he chose badly, either he knew it was bad — and nobody chooses
  a known evil as evil — or he didn''t know, and then he just made a mistake, and
  an honest mistake isn''t a sin. Both ways, the first sin looks impossible.


  (Dan) He didn''t choose evil as evil. He chose something genuinely good — his own
  excellence — but ranked it above a greater good. The sin is in the ranking, in putting
  a lesser good first, not in wanting something bad. And he wasn''t ignorant of the
  greater good in the way you mean. He let his attention settle on himself instead
  of holding the higher good in view. The failure is in what he attended to, not in
  what he knew.


  (Ruth) But "letting his attention settle" is already the wrong ranking. You''ve
  moved the sin from the choice to the attending, which doesn''t solve anything —
  it just relocates it. An angel doesn''t have wandering attention the way we do,
  with distractions and fatigue. Either attending to self over God looked good to
  him or it didn''t. If it looked good, that''s a false appearance, an intellectual
  defect, not a sin. If it didn''t look good, he chose it as not-good, which you and
  I both said nobody does.


  (Dan) I don''t think they''re two separate events, the attending and the preferring.
  The attending is the preferring — it''s one act. There''s no earlier moment where
  the ranking was already bad, and no earlier cause in his character, because there
  was no earlier bad character to cite. A free act can be its own origin. If you demand
  an earlier bad state to explain the first bad act, you''ve made "first bad act"
  contradictory by definition, which shows something is wrong with your demand, not
  with the idea.


  (Ruth) Then here''s my problem. If the first bad act is its own origin with no determinant
  in the angel''s nature, then a good nature spontaneously produced evil — and that''s
  exactly the kind of thing we wanted explained. If the first act simply springs up
  undetermined, then whether it is good or bad is arbitrary, and "free choice" becomes
  a label for a brute fact rather than an account of how evil could arise. I can accept
  that the origin might be a mystery. I can''t accept your answer as an explanation
  of the mystery.


  (Dan) I''d accept that, if I thought any full explanation were possible. But notice
  what any explanation would have to do: it would cite a reason for the first bad
  act, and if that reason justified the act, the act would be good, not evil; if it
