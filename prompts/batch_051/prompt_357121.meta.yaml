  all false; the second says the third, fourth, fifth, and so on are all false; and
  so on down the line. No sentence says anything about itself, and you can''t trace
  any sentence back to itself through later references either — the reference only
  ever runs forward and out. Yet if you try to assign true or false to all of them,
  you get a contradiction: if any one of them is true, everything after it is false,
  but then the next one after it would be saying something true, so it can''t be false;
  and if all of them are false, then the later sentences really are all false, which
  makes each sentence true after all. My friend kept insisting there had to be a hidden
  self-reference or circularity somewhere, and I kept failing to find one, which is
  exactly the point."


