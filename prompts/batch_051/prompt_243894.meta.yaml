  Something like:


  "Jeffrey conditionalization is the standard rule for updating a rational agent''s
  credences when evidence is uncertain. Instead of learning a proposition E with certainty
  and moving to P(· | E), the agent receives evidence that merely redistributes probability
  over a fixed partition {E_1, ..., E_n}, and updates by holding the conditional probabilities
  P(· | E_i) fixed and replacing the old weights P(E_i) with the new weights. The
  rule rests on three assumptions: the evidence can be represented as a new distribution
  over a partition; the partition is antecedently available to the agent; and the
  conditional probabilities given the partition are rigid under the evidence.


  Now consider a development that was not salient when the rule was introduced: a
  large and growing share of the evidence on which real agents update arrives as opaque
  calibrated probability reports. A forecasting platform returns a number for an event;
  a machine-learning model emits a confidence score; an expert says she has moved
  to 70% on some claim. The agent receives the number without receiving the partition
  over which the reporter redistributed probability, without receiving the reporter''s
  likelihoods, and often without a guarantee that the number is consistent with the
  agent''s own partition. In some cases the report is an interval or inequality rather
  than a point value, or several reports arrive that jointly conflict.


  Does the Jeffrey framework survive this development, or does it rest on an idealization
  about transparent, partition-based evidence that the new setting breaks? If it survives,
  explain how the agent is supposed to find the partition and the rigidity condition
  when only a bare number is given. If it needs repair, identify which premise is
  under pressure — the representation of evidence as a distribution over a fixed partition,
  the availability of the partition, or rigidity — and state the repaired rule (for
  example, the information-theoretic generalization that updates by minimizing divergence
  subject to the reported constraints) and what it gives up. If the argument for Jeffrey
  conditioning is dead, say what should replace it and why. I am interested in the
  fate of the rule itself, not in any applied question about how platforms should
  report probabilities."


