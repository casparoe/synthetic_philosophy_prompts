  For Jeffrey conditionalization, the "classic argument" is the justification of Jeffrey
  conditioning: when your evidence is uncertain and merely redistributes probability
  over a partition of possibilities, you should update by holding your conditional
  probabilities fixed (rigidity) and replacing the old marginal distribution over
  the partition with the new one. This is the standard rule for uncertain evidence.
  Its premises:

  1. Evidence arrives as a new probability distribution over a fixed partition.

  2. Rigidity: the change affects only the probabilities of partition elements, not
  conditional probabilities given them.

  3. The partition is known/articulable by the agent.


  New development: modern agents increasingly receive evidence in the form of an opaque,
  calibrated probability report — e.g., a machine-learning model outputs "0.73" for
  some event, or an expert/forecaster reports a credence — without specifying the
  evidence base, the partition, or the likelihoods that produced the shift. Also,
  evidence often arrives as multiple such reports that are not jointly consistent,
  or as interval/inequality constraints ("at least 0.6") rather than point values.


