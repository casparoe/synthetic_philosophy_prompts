  I chair a pre-referral review board in the service judiciary and must decide whether
  charges against a legal officer (a "lawyer") should be referred to court-martial
  or dismissed. Let me describe the case.


  Captain A, a judge advocate with eight years'' service, was assigned as legal advisor
  to a brigade commander preparing for an operation in a contested region. The commander
  ordered her to draft an operational-law annex certifying that the planned operation
  complied with the law of armed conflict and to countersign it as the brigade''s
  legal review. Captain A drafted the annex but then refused to countersign, stating
  that the annex''s treatment of "military advantage" aggregated expected advantages
  across the whole campaign without weighing expected civilian harm at the point of
  each strike, and that this likely misstated proportionality. The commander responded
  with a revised, oral order to sign a narrowed version; she declined. She then sent
  a memo through legal channels outside the brigade flagging the disagreement, which
  caused delay. Two full colonels in the legal branch later reviewed the annex and
  split: one agreed with her, one regarded it as defensible.


  The charges are disobedience of a lawful order and conduct prejudicial to good order
  and discipline. Her defense is that her professional obligation of independent legal
  judgment meant deference to the commander stopped where it would have required her
  to certify as lawful something she believed was not; she could have signed with
  a dissent noted, but argues that would still have laundered the decision. She also
  argues that the "I was only following orders" impulse to defer is what makes military
  hierarchies dangerous and that the institution should reward, not punish, a subordinate
  who uses the channel for legal dissent rather than defying in public. The prosecution
  argues the order was not manifestly unlawful; the commander was entitled to rely
  on his own legal advisor''s advice, but once he made a command decision within the
  zone of arguable legality, she had no right to veto it. Allowing a captain to refuse
  to countersign on her own reading of a debatable legal standard would convert legal
  advice into a veto and invite every staff officer to substitute private conviction
  for the chain of command; her remedy was to advise, record dissent if allowed, and
  obey.


  The board must decide whether the charges should be referred, or dismissed, or disposed
  of by administrative action, and must give reasons the convening authority can act
  on.


  Write the decision memorandum I will circulate before our hearing. It should state
  a clear recommended disposition, justify it, and engage fairly with the strongest
  consideration counting against it. The board is also being asked to articulate a
  standard for future cases: under what conditions, if any, a subordinate may refuse
  to sign a document that would record his or her professional or moral endorsement
  of a superior''s decision. Keep it tight—this is a working document, not a law review
  note.


