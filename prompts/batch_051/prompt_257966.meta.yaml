  I chair a pre-referral review board in our service judiciary, and I need to circulate
  a decision memorandum before we meet about charges against a judge advocate who
  refused a commander''s order to sign a legal review. The broader question behind
  the charges is the one that will matter to the convening authority: when is deference
  to a superior a virtue, and when does it become an abdication of the independent
  judgment that a hierarchy needs from its experts?


  Captain A, a judge advocate with eight years of service, was brigade legal advisor
  to a commander preparing an operation. The commander ordered her to produce the
  operational-law annex for the operation and to countersign it as the brigade legal
  review. She produced the annex but refused to countersign. Her objection was to
  the annex''s definition of proportionality: it aggregated the expected military
  advantage of the operation as a whole while instructing targeteers that civilian
  harm at individual strike points was not to be weighed separately unless it was
  likely to be extreme. She judged this a misstatement of the law of armed conflict,
  but she conceded the interpretation was at least arguable. The commander, after
  a heated meeting, ordered her again to sign a slightly narrowed version; she declined
  again, then sent a dissent memorandum through the legal branch rather than remaining
  silent. The dissent delayed deployment, and two reviewing colonels later split on
  whether her legal analysis was correct.


  The charges are disobeying a lawful order and conduct prejudicial to good order
  and discipline. Her defense is that her office carries a professional duty of independent
  legal judgment, and that deference stops where it would force her to certify as
