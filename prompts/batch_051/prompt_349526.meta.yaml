  three answer options, plus a scoring key that maps answer patterns onto at least
  these positions: the simple conditional/counterfactual account (something is fragile
  iff it would break if dropped), a Lewis-style reformed account that adds an intrinsic
  causal basis and a ''in normal conditions'' clause, a categoricalism that says disposition
  talk reduces to the non-dispositional microstructural basis, a robust dispositionalism
  where powers are fundamental and finks/masks are real manifestations of the power''s
  place in a network, and a deflationary or eliminativist option that treats dispositions
  as a useful façon de parler. If you think there''s another position the logical
  space forces you to include, add it, but name it only if you''re confident it exists.


  The questions should be built mostly from the finks and masks cases, introduced
  in plain terms: a glass with a guardian who would intervene if it were struck; a
  poison that causes death but not when accompanied by an antidote; a match with a
  coating that keeps it from lighting; a fragile thing that would lose its fragility
  as a result of being struck; an object that never manifests a disposition and whose
  basis also never does anything. I care especially that the quiz can pull apart the
  simple conditional account and the Lewis-style account (not every ''would'' is the
