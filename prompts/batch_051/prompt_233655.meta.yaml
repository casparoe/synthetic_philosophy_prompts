  Domain: "The is-ought gap and the naturalistic fallacy."


  The naturalistic fallacy (Moore): it''s a fallacy to identify ''good'' with a natural
  property (e.g., pleasure, evolved, survival-enhancing) or define ''good'' in naturalistic
  terms; an open-question argument: for any natural property N, one can still meaningfully
  ask "but is N good?" So ''good'' is non-natural or indefinable.


  Hume''s is-ought gap: normative conclusions don''t follow deductively from purely
  descriptive premises; an ''ought'' conclusion needs an ''ought'' among the premises.


  A common confusion: "science can''t determine values" is often defended by is-ought
  gap. But the gap is about deduction, not about non-deductive support or metaphysics.
  There are positions: facts about well-being and harm may ground norms even if you
  can''t derive them formally without a bridging premise; the bridging premise might
  be analytic or a conceptual truth; or one might reject strict fact/value dichotomy
  (thick ethical concepts like ''cruel'', ''honest'' are both descriptive and evaluative;
  Putnam''s entanglement of fact and value).


  An argument that seems to prove too much might go:


  (1) An ''ought'' cannot be validly inferred from premises that are all ''is''.

  (2) Therefore, no amount of information about how the world is (including how humans
  evolved, what causes suffering, what people need to flourish) can ever force a moral
  conclusion.

  (3) If no factual information can force a moral conclusion, then no factual information
  can count as evidence for a moral claim; otherwise, with enough of it, the conclusion
  would follow.

  (4) So no moral belief is confirmed or justified by the facts about the world.

  (5) But the only things that could confirm a belief are facts about the world (or
  at least, whatever confirms is itself a fact).

  (6) So no moral belief is justified at all.

  (7) But that''s absurd — e.g., we''re justified in believing that deliberately tormenting
  a small child is wrong, and that conclusion seems to be supported precisely by facts
  about pain and cruelty.

  (8) Therefore the original is-ought gap must be false or misstated.


