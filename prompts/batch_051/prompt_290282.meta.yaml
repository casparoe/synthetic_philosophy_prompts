  The argument runs as follows. (1) Darwin accounts for the human moral sense as an
  outgrowth of social instincts, which natural selection favored because they made
  groups more cohesive and cooperative. (2) Those instincts dispose us to approve
  of loyalty, sympathy, honesty, and so on, and to feel dissatisfaction when we act
  against them. (3) If a mental disposition was shaped by natural selection because
  of its survival value, then the content of the judgments that disposition produces
  is explained by fitness effects, not by its tracking a moral truth. (4) Therefore,
  the fact that we judge loyalty and sympathy to be good gives us no reason to think
  that loyalty and sympathy really are good. (5) The same evolutionary explanation
  covers all of our moral judgments, including the ones Darwin himself makes when
  he calls slavery a "monstrous wrong" or when he treats compassion toward the weak
  as a sign of moral progress. (6) So if Darwin''s account is right, Darwin''s own
  moral judgments are just as undermined as everyone else''s. (7) But that is self-defeating:
  Darwin''s whole project of explaining morality presumes that we can rationally distinguish
  better from worse moral attitudes, which is exactly what the theory seems to take
  away.


