  Compute governance ideas: training runs require large amounts of specialised compute
  (GPUs/TPUs), which is concentrated in supply chains (TSMC, ASML, NVIDIA), quantifiable
  (FLOPs), and hard to hide (data centres with power/cooling). So compute is a promising
  regulatory chokepoint. The case for pausing frontier AI: advocates argue we should
  pause development of systems above some compute/ capability threshold, because of
  risks from loss of control, misuse, etc., and that compute thresholds plus hardware
  controls can implement a pause; critics note compute is not a perfect proxy for
  capability, algorithmic efficiency improves, inference/compute in deployment matters,
  open weights diffuse, chips already in circulation ("hardware overhang"), enforcement
  and verification challenges, and geopolitical race dynamics.


  Standard objections and replies:

  - Compute as proxy: a fixed FLOP threshold misses algorithmic improvements (e.g.,
  Chinchilla, distillation, architecture improvements) that yield more capability
  per FLOP. Reply: thresholds can be updated, and even crude proxy is better than
  none; also "frontier" training runs are the visible, rate-limiting chokepoint.

  - Open weights / diffusion: once weights are released, compute control can''t retrieve
  them; open models can be fine-tuned for dangerous uses with modest compute. Reply:
  governance should also restrict the release of frontier weights above a threshold;
  smaller open models might still be safe; or compute controls can''t be the whole
  solution but are necessary.

  - International: unilateral controls (US export controls) create incentives for
  other nations to build independent supply chains; a pause needs cooperative international
  regime, which is politically hard. Reply: one can start with coalitions of like-minded
  states; compute supply chain is concentrated so a small group can exert leverage.

  - Fissile material analogy: nuclear non-proliferation succeeded partly because enrichment
  is hard to hide and dual-use materials are controlled. But AI chips are mass commodities;
  the analogy may mislead. Reply: the relevant feature is chokepoint measurability,
  not identical physical properties; the analogy can be treated as a model rather
  than a claim of identity.

  - What would change her mind: e.g., evidence that capability thresholds can be accurately
  predicted from other developments, or that risks are overestimated, or that alternatives
  (evals, post-deployment monitoring) can work — ask for abandonment conditions, not
  just modifications.


