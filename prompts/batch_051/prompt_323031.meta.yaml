  This is from metaethics — the idea that there can be normative reasons (or requirements/rationales)
  that are not reasons for any particular agent; sometimes discussed as "free-floating
  reasons" in debates about reasons-first vs. value-first, or about "agent-neutral
  reasons" vs "agent-relative." E.g., the consideration that a state of affairs is
  bad is a reason for anyone to prevent it, even if no one''s in a position to act?
  Or "the reason has no owner." There''s also "free-floating oughts" — oughts that
  bind no one (e.g., "it ought to be that..."). The concept: a rationale can be valid/weighty
  even if no reasoner entertains it; reasons as abstract entities, like propositions,
  can exist without being had.


  Now translate into novelist''s vocabulary: what is the analogue in fiction? In a
