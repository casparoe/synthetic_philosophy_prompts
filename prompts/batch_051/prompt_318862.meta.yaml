  Let''s think deeply about Davidson vs CMT to design the best step-by-step argument.


  Davidson''s "What Metaphors Mean" (1978):

  - Metaphor belongs to the domain of use, not meaning.

  - A metaphor''s sentence has only its literal meaning(s).

  - What metaphor does is "intimate" or "make us notice" likenesses; this is a causal/psychological
  effect, not a content with truth conditions.

  - Paraphrase necessarily loses something because what metaphor does cannot be captured
  as propositional content; there is no "metaphorical meaning" to paraphrase.

  - Davidson: "metaphors mean what the words, in their most literal interpretation,
  mean, and nothing more." (I won''t quote from memory; paraphrase.)


  Conceptual Metaphor Theory (CMT) (Lakoff & Johnson):

  - Metaphor is fundamentally conceptual, not merely linguistic.

  - We understand abstract domains in terms of concrete domains via systematic mappings
  (e.g., ARGUMENT IS WAR, LOVE IS A JOURNEY).

  - These mappings are part of our conceptual system; they structure reasoning.

  - CMT often says metaphor has cognitive content that can involve entailments and
  inferences.


