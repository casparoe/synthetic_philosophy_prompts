  "In The Theory of Moral Sentiments, Smith seems to make two claims about how we
  come to judge our own conduct. On the one hand, in Part III he says that we cannot
  form any reliable judgment of our own sentiments and motives until we step outside
  our own natural station and try to see them from the standpoint of other people;
