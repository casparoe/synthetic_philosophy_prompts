  is a piece of contrastive or explanatory shorthand, useful for assigning blame but
  not a description of any causal relation. The other faction replies that this is
  philosophy gone fastidious: in law, in medicine, and in ordinary life we say, and
  seem to mean, that the failure to act caused the harm, and any theory of causation
  that cannot say this has abandoned the data rather than explained it.


