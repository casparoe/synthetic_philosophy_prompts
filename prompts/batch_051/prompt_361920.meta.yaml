  life outweighs the murderer''s entitlement to the truth; refusing to lie would make
  you complicit in the murder.


  Marcus: That''s too quick. You aren''t balancing values; Kant''s point is that the
  maxim of lying to the murderer can''t be a universal law — a world in which anyone
  may lie whenever it''s useful collapses trust, and the murderer could simply not
  believe you anyway, so the lie doesn''t have the intended effect.


  Round 2:

  Elena: But the categorical imperative doesn''t require that I act on a maxim that
  everyone else also acts on; it requires that my maxim be consistently conceivable/willable
  as universal law. It''s perfectly conceivable that everyone lies only to prevent
  a murder — no contradiction.


  Marcus: That''s a consequentialist test in disguise: you''re using the specific
  outcome to specify the maxim. Fine; but then the maxim "tell the truth to everyone
  who asks, even a murderer" is also universalizable, so nothing has been shown about
  which is required.


  Round 3:

  Elena: The real problem is that the murderer''s question is a threat, not a request
  for information. Lying in response to a threat is self-defense; it doesn''t contradict
  the principle of truthfulness because the murderer has forfeited the standing to
  demand the truth.


  Marcus: But a duty of truthfulness isn''t a duty to a particular inquirer''s standing;
  it''s a duty not to make false assertions. Once you make a false statement to a
  murderer, you''ve made an exception for yourself based on emergency, which is exactly
  what Kant forbids.


