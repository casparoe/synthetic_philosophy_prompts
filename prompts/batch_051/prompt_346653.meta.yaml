  Physicalism prompt draft:


  "I have been going back and forth about an argument I was taught in a philosophy
  of mind course, and I would like to know whether it still works when one presses
  a familiar objection to its key term.


  The argument runs: mental events such as decisions and pains make a causal difference
  to bodily behaviour; the physical sciences describe a causally closed world, in
  the sense that every physical effect has a sufficient physical cause; so if mental
  events are to be causes of physical events and not be systematically overdetermined,
  they must themselves be physical. That conclusion is usually taken to support physicalism.


  But physicalism requires saying what counts as physical. If ''physical'' means whatever
  current physics posits, the premise that physics is closed seems hostage to the
  next scientific revolution, and the conclusion may be false because current physics
  is incomplete. If ''physical'' means whatever an ideal future physics will posit,
  then the doctrine seems to expand to include whatever is needed to explain the mind,
  and the argument proves something close to a tautology. This is, I gather, Hempel''s
  dilemma.


  My question is not whether Hempel''s dilemma is a problem for physicalism in general.
  It is whether the causal argument above can survive it: can the argument be reformulated
  so that its premises have a fixed content, and its conclusion still rules something
  out? Or does the dilemma change the target — perhaps showing that the argument proves
  only the causal closure of some future physics, which is compatible with panpsychism
  and other non-standard views? I would like a careful answer about which premise
  is doing the work and what, if anything, has to be given up."


