  Sovereign immunity type B draft:


  "One of the oldest justifications for sovereign immunity is the idea that the sovereign
  cannot be judge in its own court, or more strongly that the sovereign is the source
  of the law and the courts, so it cannot commit a legal wrong against a subject:
  wrongs are deviations from the sovereign''s own commands, and the sovereign cannot
  deviate from itself. The doctrine survives today in the rule that the state cannot
  be sued in its own courts without its consent, with parallel rules for officials.


  That justification presupposes a unified sovereign — a single lawgiver whose will
  is the law. The modern administrative state seems to have dissolved that unity.
  The ''state'' now acts through legislatures, ministries, regulators, local authorities,
  private contractors exercising public powers, and individual officials who each
  have partial authority. There is no single will whose command is the law, and a
  wrong done by an agency can readily be described as a deviation by one part of the
  state from the rules laid down by another part.


  I would like to know whether the old justification for sovereign immunity survives
  this change. Does it still work, perhaps because sovereignty now rests in the whole
  constitutional order rather than a single person? Or has the doctrine become a historical
  remainder whose rationale no longer applies, even if practical and fiscal reasons
  are brought in to shore it up? Which premise of the original argument is actually
  under pressure, and can the conclusion be restored in another form, or is it simply
  dead as a principled matter?"


