  Now Habitat draft:


  "The standard argument for protecting wild habitats is broadly welfarist: destroying
  a forest or a wetland harms the creatures that live there by destroying their homes,
  dispersing or killing them, and depriving them of the conditions of a decent life.
  Conservationists and animal advocates often use this kind of language, and it presupposes
  something about the baseline — that, but for human interference, the animals in
  those habitats are living lives that are on balance worth living.


  A newer strand of thinking in welfare biology unsettles that baseline. If most wild
  animals die young, often by predation, starvation, parasitism or disease, and if
  the pleasures of a typical wild life are outweighed by its pains, then the ordinary
  life of a wild animal may be a net negative. On that view, destroying habitat might
  do the opposite of what the argument says: it might, on balance, prevent suffering
  rather than cause it, much as one might prevent the suffering of future generations
  of livestock by preventing them from being bred.


  My question is what happens to the original conservationist argument under that
  assumption. Does the argument survive but change its moral basis, so that the case
  for preservation must rest on species or ecosystem value, on future human interests,
  or on uncertainty about the net-welfare claim? Or does the net-welfare challenge
  put pressure on a premise the argument never had to state, and if so, which one?
  I am not asking for a policy conclusion, but for whether the argument itself goes
  through, needs repair, or is dead once its hidden baseline is made explicit."


