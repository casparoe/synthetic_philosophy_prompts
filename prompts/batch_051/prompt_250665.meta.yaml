  "Here is a version of Pascal''s mugging. A mugger asks you for $5. In exchange,
  he says, he will with probability p = 10^{-100} cause you to receive a reward worth
  10^{200} utils; otherwise nothing. The expected value is 10^{100} utils, so a naive
  expected-utility maximizer with an unbounded utility function pays. The standard
  replies are (a) bound the utility function, so the reward contributes at most some
  finite U; (b) discount the claimed probability, e.g., via a complexity prior or
  by refusing to act on arbitrarily small probabilities; or (c) reject expected-value
  reasoning for tiny probabilities of huge payoffs (e.g., some form of fanaticism
  rejection). Now vary the case: the mugger offers not one deal but a menu. For each
  integer n ≥ 1, you may pay $1 now, and with probability 10^{-n} the mugger will
  deliver 10^{2n} utils. You can accept any finite subset of the menu, but you must
  decide the whole subset now, before any uncertainty resolves. Each individual deal
  has expected value 10^n utils, so an unbounded expected-value maximizer seems committed
  to accepting arbitrarily many deals. Work through what happens to each of the standard
  replies in this menu version: does a bounded utility function rule out all, some,
  or none of the deals? Does a complexity prior that assigns probability roughly 10^{-n}
  to hypotheses with description length n eliminate the deals, and at what point?
  Is there a coherent policy that accepts some deals but not others without being
  exploitable by a slightly larger menu? Lead with your bottom line in the first sentence
  and then give the reasoning."


