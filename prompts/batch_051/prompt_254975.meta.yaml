  Over the past year my aesthetics reading group has been working through the literature
  on imaginative resistance, and we keep ending at the same impasse: everyone agrees
  there is a phenomenon, but nobody agrees about what would explain it. The standard
  starting point is a story that asks readers to imagine, say, a commander who orders
  the massacre of a village and is presented by the narration as having done the right
  thing. Readers who effortlessly imagine dragons, faster-than-light travel, and narrators
  who contradict the story''s own facts find themselves balking here. The two familiar
  camps are the can''t view, on which some feature of evaluative concepts or of the
  architecture of imagination blocks readers from imagining the deviant proposition
  as true, and the won''t view, on which readers could do it but refuse to, much as
  they might refuse a loaded premise in a thought experiment. Around these poles sit
  a tangle of refinements: accounts on which the author, not the reader, has gone
  wrong; accounts on which the real issue is what it takes for a fiction to make something
  true in fiction; accounts on which the phenomenon splits into several; and accounts
  on which the whole problem is an artifact of asking readers to do two incompatible
  things at once. The group has also kept tripping over adjacent cases: fictions that
  treat a nothing-special object as ravishingly beautiful, or a tired pun as hilarious,
  produce something like the same balking, but only sometimes and with a different
  feel.


  My working hypothesis is that the debate has stalled because the parties disagree
  about which cases count as the phenomenon rather than about how to explain a shared
  set of cases. Some have in mind explicit local stipulations, such as a narrator
  announcing that a particular atrocity was right; others have in mind the wholesale
  uptake of a work''s evaluative outlook, such as a novel that makes a murderer''s
  perspective seductive; still others have in mind the felt inability to shift one''s
  evaluative concepts for the duration of a fiction. If that is right, the can''t/won''t
