  Let me draft:


  "I have been trying to reverse-engineer the theory of value implicit in the way
  health systems allocate resources, and I keep finding the same pattern. Institutions
  that normally compare everything through a single measure of health gain — quality-adjusted
  life years, for example, which fold survival time and symptom relief into one number
  and then rank interventions by cost per unit of that number — simultaneously act
  as if certain comparisons cannot be made. They approve drugs for rare or terminal
  diseases at far higher cost per QALY than they would accept for common, chronic
  conditions; they give special weight to end-of-life treatments; they treat acute
  life-saving care as if it belonged to a different stream from preventive care or
  mental health care, often funded through separate budgets; and their public documents
  sometimes say that putting a price on a year of healthy life, in general, is just
  a tool, while treating a particular patient''s suffering as not commensurable with
  someone else''s extra year.


  My question is what this practice presupposes about the nature of value, and whether
  it presupposes anything consistent at all. Does the general use of QALYs presuppose
  that health benefits are commensurable on a single ratio scale, and do the carve-outs
  presuppose that at least some values are not? Reconstruct the implicit theory as
  precisely as you can. In particular: (1) distinguish what the practice strictly
  presupposes from what it merely makes sense in light of or is compatible with; (2)
  say whether the carve-outs really need genuine value incommensurability, or whether
  they can be explained as rough proxies for distributional and fairness judgments
  within a fully commensurable picture; and (3) tell me what the system''s behavior
  would have to change if we replaced the implicit view with, on the one hand, a uniform
  commitment to QALY-maximizing cost-effectiveness, and, on the other, a thoroughgoing
  view on which some health outcomes genuinely stand on separate scales. Where the
  two replacements agree is the real content of the presupposition; where they diverge,
  the practice itself may be underdetermined."


