  Let me think carefully about Simpson''s paradox to write an accurate prompt.


  Simpson''s paradox: a trend appears in several groups of data but disappears or
  reverses when the groups are combined. Classic example: UC Berkeley graduate admissions
  1973 — women had lower admission rate overall, but within most departments women''s
  admission rates were similar or higher; the paradox arises because women applied
  more to departments with lower admission rates. The key conceptual lesson: association
  can reverse upon aggregation; this matters for causal inference, confounding.


  Common misinterpretations:

  - That Simpson''s paradox shows you can''t trust any statistics / that it''s just
  about arithmetic illusions with no solution.

  - That the correct answer is always to prefer the disaggregated data (the "department-level"
  rates).

  - That Simpson''s paradox requires causation; the arithmetic is just algebra; causal
  considerations determine which stratification is appropriate.

  - The paradox is about confounding: the aggregating variable (e.g., department)
  is a confounder... Actually in the Berkeley case, department is a mediator? Hmm.
  Let''s get the causal structure right.


  In the Berkeley example, gender → choice of department (application), department
  → admission. If we are interested in whether there is gender bias in admissions,
  the direct effect of gender within departments might be relevant, and department
  is a mediator (on the causal path) rather than a confounder; conditioning on a mediator
  doesn''t adjust for bias correctly if the mediator itself is affected by discrimination?
  Actually Bickel et al. analyzed within departments to test for bias at the admission
  stage. There''s a subtle point about whether "department" is a confounder or mediator.
  Let me recall the Pearl interpretation: The paradox is about whether the aggregated
  data (total rates) or stratified data (per department) answers the causal question
  "does gender affect admission?" If department is a confounder (e.g., men and women
  differ in qualifications distributed by department), stratifying by department is
  the right thing, and the overall association is an artifact. But if department is
  a mediator, then... In the Berkeley case, if women were discouraged from applying
  to certain departments due to bias, department is partially an outcome of bias,
  and adjusting for it could mask total bias. This is a subtle conceptual lesson:
  Simpson''s paradox can''t be resolved by math alone; you need a causal story to
  decide whether to aggregate or stratify.


