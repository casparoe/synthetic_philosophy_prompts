  "An adversarial collaboration has been convened between two positions on the question
  of whether elegance or beauty in a mathematical or scientific theory — and, secondarily,
  in a proof — is evidence for its truth or correctness. Position A, the elegance-as-evidence
  view, holds that perceived elegance is a defeasible but genuine reason to raise
  one''s subjective probability that a theory is true or that a line of inquiry is
  on the right track, because elegance is a fallible signal of virtues such as simplicity,
  unification, compression, and structural match. Position B, the elegance-as-bias
  view, holds that judgments of elegance are aesthetic, culturally and psychologically
  conditioned, often applied retrospectively to theories that already won, and that
  elegance provides no independent evidential weight; it may be useful as a heuristic
  for allocating attention, but using it as evidence systematically overconfidently
  inflates belief. Draft the joint statement these two sides should produce.


  The statement should open with a short preamble delimiting the question and disavowing
  readings neither side intends. It should then give a numbered list of claims both
  sides can sign. The agreed claims should cover at least: the phenomenology of beauty
  in mathematics and science; the instability[perhaps variability] of beauty judgments
  across time and fields; the uncontroversial historical record that some admired
  elegant proposals failed and some initially unlovely proposals succeeded; the distinction
  between elegance of a theory and elegance of a proof; and the permissibility of
  elegance as a nondemonstrative heuristic for generating and prioritizing hypotheses.
  These agreed claims should be substantive rather than vacuous, and should not smuggle
  in either side''s conclusion.


  Next, the statement should include a disagreements table. For each residual disagreement,
  state the issue in neutral terms, then give each side''s position in wording that
  side would accept as its own, without caricature. The table should separate the
