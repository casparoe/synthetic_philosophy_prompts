  Key points (from my training):

  - On Certainty (Über Gewissheit), written 1949-51, responds to Moore''s "Proof of
  an External World" and "A Defence of Common Sense."

  - Wittgenstein doesn''t think "here is a hand" is a statement of knowledge; he says
  Moore''s mistake is to treat these as empirical knowledge claims. "I know" is not
  applicable here.

  - Hinge propositions (a term from later commentators, not used by Wittgenstein?
  Actually OC 341-343 talks about hinges: "the questions that we raise and our doubts
  depend on the fact that some propositions are exempt from doubt, are as it were
  like hinges on which those turn."). So "hinge" is his metaphor, yes.

  - Hinges are not foundations known with greater certainty; they''re not known at
  all; they are the scaffolding/framework against which doubt and justification operate.
  They''re held fast by everything around them, or form the "substratum" of all enquiry
  (OC 162).

  - They are not justified by evidence; they''re neither true nor false in the usual
  empirical sense? They function as rules of description / norms. They are world-picture
  propositions (Weltbild).

  - Wittgenstein is not offering a foundation for knowledge causing traditional epistemology;
  hinges can''t provide justification because they themselves are groundless: "If
  the true is what is grounded, then the ground is not true, not yet false" (OC 205).
  I must not quote from memory. I can paraphrase without quoting.

  - He also doesn''t think communication requires agreement in opinions but in form
  of life.


