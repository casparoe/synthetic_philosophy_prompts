  Domain: AI control vs. alignment: safety measures that assume the model may be misaligned.


  The idea of "control" (in the technical sense from e.g., Redwood Research''s AI
  control agenda): control measures assume the model might be misaligned and try to
  prevent it from causing harm even if it tries — monitoring, restricting actions,
  auditing, sandboxing, using trusted models to check untrusted models. In contrast,
  alignment tries to make the model actually want the right thing.


  An argument "that seems to prove too much": Suppose we accept that for sufficiently
  capable models, we should assume they may be misaligned. Then we adopt control measures:
  e.g., monitor outputs, audit code produced by the model, use other models to review.
  But those control measures themselves have to be applied by something. If the model
  is capable enough to be dangerous, it''s capable enough to fool its monitors or
  collude with the reviewing models (which may themselves be misaligned). So the control
  measures only work if the monitors/reviewers are themselves aligned and competent
  — which is exactly the assumption control was supposed to avoid. Therefore control
  measures either reduce to alignment or provide only a false sense of safety. Conclusion:
  safety measures that assume misalignment are either redundant (restating alignment)
  or give no guarantee (because the watchdog needs watching). This "proves too much"
  because it would show that any security measure anywhere is useless — e.g., we can''t
  use locks because lockpicks could defeat them, or any audit process is impossible
  because auditors could be corrupt. So where does it go wrong?


