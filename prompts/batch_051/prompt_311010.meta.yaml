  Question: Explain Nozick''s tracking theory of knowledge, how it responds to the
  brain-in-a-vat skeptic, and whether it has to give up closure under known entailment.
  If it does, is that a cost?


  Student answer: Nozick says S knows that p iff p is true, S believes that p, and
  two counterfactual conditions hold: if p were false, S would not believe p, and
  if p were true, S would believe p. The first condition is sensitivity and the second
  is adherence. Sensitivity is not closed under known entailment. For example, I can
  know that I have hands, because in the nearest worlds where I don''t have hands
  (roughly, I lose them in an accident) I wouldn''t still believe I have them. But
  I cannot know that I am not a brain in a vat being fed hand-experiences, because
  if I were such a brain in a vat I would still believe I was not one. So tracking
  theory denies closure under known entailment, and that is exactly how it answers
  the skeptic: the skeptic''s argument assumes closure, and Nozick says closure fails.
  The weird result is that I can know I have hands while not knowing that I am not
  a BIV, even though I know the first entails the second. Nozick just bites this bullet.
  Some people call that abominable. I think the cost is real but maybe worth paying
  for an externalist theory of knowledge. The reason tracking theory gets called a
  safety theory is that it demands that in all nearby worlds where S believes that
  p, p is true. So the question is whether that safety requirement plus the denial
  of closure gives us a coherent picture of knowledge."


