  I''m taking a course on rational choice and formal epistemology this term. In a
  recent seminar we proved Good''s theorem: for an agent who maximizes expected utility
  and updates by conditionalization, the expected value of any costless information
  is never negative—the agent can always choose to ignore the information, so free
  information cannot make them worse off in expectation. We''ve been debating how
  much that theorem should govern our judgments about real agents, and my view (which
  I''d put around 0.85) is that a fully rational agent should always want costless,
  decision-relevant information, because the theorem is the right way to think about
  rationality, even though real people often pay to remain ignorant. A friend in the
  course holds something closer to 0.3: he thinks some forms of ignorance—e.g., not
  knowing a test result in order to preserve motivation, or staying uninformed to
  keep a credible commitment with no choice to credibly ignore it—are not just understandable
  but rationally permissible, and that the theorem''s value only shows something about
  the Bayesian ideal, not about what rationality requires of an actual agent.


