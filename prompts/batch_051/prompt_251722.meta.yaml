  Let me construct the disagreement about what phantasia is and its role in thought.
  Two positions:


  Position A (the "imagist" reading): Aristotle''s phantasia is a capacity for forming
  and having mental images — quasi-perceptual presentations that persist after perception
  and can be recombined. Phantasma is literally an "image"; when he says the soul
  never thinks without a phantasma, he means thought always operates on pictorial
  imagery. So Aristotle is committed to imagistic thought. Evidence: he calls phantasia
  a movement from actual perception; images are copies of percepts; memory and dreams
  involve images.


  Position B (the "representational/appearance" reading): Phantasia for Aristotle
  is broader — the capacity for having something appear to one, for representing something
  as being a certain way even in the absence of the object, not only pictorially.
  The thinking-with-phantasmata claim does not imply pictures; human cognition in
  an embodied soul needs particular, sensible representations because universals are
  only in particulars. The phantasma is a vehicle, not a picture. Evidence: Aristotle
  says imagination is not belief because when we imagine something terrifying we aren''t
  necessarily afraid — so phantasia is representational with content, not merely picturing.
  Also deliberative phantasia for animals that can compare alternatives suggests something
  more than an image gallery.


