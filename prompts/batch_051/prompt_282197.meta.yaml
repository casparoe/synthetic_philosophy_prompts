  that these simple programs are not just curiosities, that the principle of computational
  equivalence says almost any process that isn''t obviously simple is computationally
  equivalent, and that this reframes science itself. I can''t tell how much of this
  is a substantive empirical claim and how much is rhetoric or a definition in disguise.


  Write a dialogue between two equally sophisticated people:


  - One defends the view that NKS and the principle of computational equivalence are
  a genuine (or at least promising) scientific framework: that PCE makes empirical
  predictions, that computational irreducibility explains why some systems can''t
  be shortcut, and that the Rule 110 universality result shows how much is packed
  into simple rules.

