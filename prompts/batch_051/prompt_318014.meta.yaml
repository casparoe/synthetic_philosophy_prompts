  - §13: "As the individual concept of each person includes once for all what shall
  ever happen to him, there are seen in it the proofs a priori or the reasons for
  the truth of each event..." Also relevant. The idea that each individual''s concept
  includes its entire history — this is the root of the transworld identity problem:
  if an individual''s concept includes all its predicates, then any change (including
  being otherwise in another world) would be a different individual concept, so "Caesar
  in another possible world" maybe differs numerically. This is a rich passage for
  counterpart theory debate. It anticipates Lewis''s problem with transworld identity:
  if Caesar''s concept includes crossing the Rubicon, then there''s no world where
  Caesar doesn''t cross; so the "Caesar" of the non-crossing world would be a different
  individual concept. But Leibniz might use "notions" for God''s view. Could ask how
  this bears on transworld identity.


