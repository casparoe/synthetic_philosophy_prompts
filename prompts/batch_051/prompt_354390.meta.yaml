  The technical question: given a prior over a partition {R∩H, R∩¬H, ¬R∩H, ¬R∩¬H}?
  and learning "P(H | R) = 3/4" (or "if R then H has probability 3/4"), how to revise
  the whole distribution? Standard conditionalization can''t handle this. Various
  proposals: minimum relative entropy (MRE) says update by minimizing KL divergence
  subject to constraint P(H|R)=3/4. This has the consequence of changing the probability
  of R relative to ¬R? Some say counterintuitive: learning something conditional about
  R shouldn''t make you more likely to be in R. The "Judy Benjamin problem" is the
  problem that MRE or other rules yield posterior probabilities for the antecedent.
  There''s a literature by Douven and Romeijn, Hartmann, etc.


