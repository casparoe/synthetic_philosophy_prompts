  Toegye: Four Beginnings are the expression of li (principle) and Seven Emotions
  are the expression of ki (material force/qi); but later he amends: "Four Beginnings
  are li''s issuance and ki follows; Seven Emotions are ki''s issuance and li rides
  it" (사단은 리발이수지, 칠정은 기발이승지). So he posits two distinct sources: Four Beginnings issue
  from li (primarily), Seven from ki (primarily), making them heterogeneous.


  Gobong challenged the dualism; their exchange resulted in Toegye''s "mutual issuance"
