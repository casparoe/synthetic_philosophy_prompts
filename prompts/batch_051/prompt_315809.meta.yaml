  Prompt draft:


  "Please give a careful intuitive explanation of a point about Bayesian convergence
  that often gets flattened in slogans like ''the priors wash out.'' Consider two
  Bayesian agents who see an indefinitely long sequence of observations drawn from
  the same unknown statistical process. They share a likelihood and update by conditionalization,
  and their priors are mutually absolutely continuous. Under these conditions, a merging-of-opinions
  result tells us that their predictive distributions for the next observation will
  eventually agree. Yet the same agents can fail to agree in their posterior probabilities
  over hypotheses. Explain, in plain but precise terms, why the theorem is a result
  about merging predictions rather than about merging full posteriors. Your explanation
  should do three things. (1) Say what mutual absolute continuity of priors amounts
  to and what work it does: what goes wrong if one agent''s prior assigns probability
  zero to the hypothesis (or to the part of parameter space) that is in fact generating
  the data. (2) Give an intuitive example, such as a model with an identified parameter
  that drives the likelihood and a further parameter that does not change any observable
  distribution, in which the agents'' predictions about the next observation converge
  while their posterior probabilities over that further parameter remain exactly as
  far apart as they began. (3) Use the example to state a precise limitation on slogans
  about washing out: for which features of the model are priors forced to become irrelevant,
  and for which do they remain free forever? Do not give a formal proof, but the everyday
  explanation should track the mathematical facts closely."


