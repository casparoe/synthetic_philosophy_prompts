  ---


  A familiar argument in discussions of moral agency runs as follows: a moral agent
  must be able to act on its judgments; a system that can assess situations and deliberate
  but cannot intervene in the world is at most a moral spectator or moral patient,
  not a moral agent. When people defended this requirement, the paradigm case of "judges
  but cannot act" was usually a human in some constrained position — a bystander,
  a locked-in patient, an adviser without authority. The assumption buried in the
  examples was that the entity doing the judging was separate from the machinery of
  action, and that its judgments could not reshape the world except through its own
  bodily intervention.


  Now consider a different kind of case. A large language model-like system has been
  trained on an enormous quantity of human normative discourse and can produce subtle,
  case-specific moral judgments, fluently engage in deliberation, and even revise
  its judgments under challenge. In a particular deployment it is deliberately given
  no executive capacity: no actuators, no ability to write to memory, no way to force
  a decision, and every candidate action it proposes passes through either a hard
  filter or a human overseer before anything happens in the world. Suppose, moreover,
  that its judgments are frequently adopted downstream — not because the system has
  been given authority, but because the human overseers find its reasoning independently
  persuasive. Does the old argument survive this case? I want to know what happens
  to the argument, not what the policy should be: which premise exactly is now under
  pressure, does the argument collapse, does it need repair (e.g., by distinguishing
  moral agency from moral influence, or acting from causally shaping another''s action),
  or is it untouched? If a repair is available, say what weaker but still significant
