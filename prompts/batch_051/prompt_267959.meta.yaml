  regularities in terms of grue are equally supported by the evidence, and the time-indexed
  definition seems gerrymandered, but "green" can itself be defined in terms of grue/bleen
  symmetrically. Goodman''s response: projectible predicates are those with a history
  of successful projection, "entrenchment."


