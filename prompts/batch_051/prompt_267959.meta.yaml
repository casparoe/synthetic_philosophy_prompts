  emeralds are green" confirmed by green emeralds observed before time t, but "all
  emeralds are grue" not confirmed by grue emeralds, where grue = green before t or
  blue after t (or green if examined before t and blue if not examined before t, depending
  on version). Standard statement: grue applies to things examined before t just in
