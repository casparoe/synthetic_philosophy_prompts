  grows is whether it has secure property rights, contract enforcement, and a government
  constrained enough that it can''t expropriate everything. She said the natural experiments
  are the cleanest evidence: Korea split into two countries with the same geography
  and basically same culture, and the South got rich while the North didn''t. Same
  with the two halves of the same city on the US–Mexico border. She said geography
  and culture can''t explain divergence within a shared geography, so institutions
  must be doing the work.


  Jonas said that''s only one case at a time, and institutions don''t fall from the
  sky. South Korea got its institutions from a specific history — American occupation,
  an export-led developmental state, whatever — and the border town got its institutions
  from which side of a political line it landed on. So ''institutions'' is a proximate
  cause. The deeper question is why those institutions emerged where they did, and
  that could be geography, disease environment, colonial history. If institutions
  are themselves caused by the things they''re supposed to beat, you can''t point
  to them as the deep explanation.


  Mina said the literature has an answer to that endogeneity: in the former colonies,
  settler mortality rates are the instrument. Where European settlers couldn''t survive
  disease, they built extractive institutions; where they could settle, they built
  more inclusive ones; and that historical variation predicts present-day income.
  So the direction runs institutions → income, and geography only matters through
  institutions.


  Jonas said that''s exactly where the argument is shakiest: the instrument only works
  if settler mortality affects income today only through institutions, and that''s
  implausible — disease environments affect health and productivity directly, settlers
  also brought legal systems, human capital, and cultural attitudes. And this is all
  from a weird subpopulation of colonies, so even if internally valid, it''s a local
  effect that doesn''t license the sweeping claim about ''nations'' generally.


  Mina came back that he was holding the argument to an impossible standard. You can''t
  run a randomized trial assigning countries to good institutions, so if the instrument
  design is imperfect it''s still better than the alternatives. She said the people
  pushing geography or culture owe us a story for why same-geography places diverge
  so much, and they mostly can''t give one, whereas the institutional story predicts
  those splits.


  Jonas said the more basic problem is that the question itself assumes there''s a
  single cause, when there''s probably lots of path dependence and interaction. Institutions
  might matter a lot in some places and not much in others; institutions and culture
  might co-evolve. Also, a lot of the institutional literature is selected on the
  outcome — it looks at rich countries, finds institutions, and calls that the cause,
  which doesn''t show what would happen if you changed institutions somewhere without
