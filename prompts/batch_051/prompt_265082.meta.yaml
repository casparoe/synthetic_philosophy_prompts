  is chosen. Here is the argument I have arrived at.


  (1) The natural numbers are whatever plays the role of the sequence 0, 1, 2, 3,
  ... with the right successor relation; a number is its place in that pattern, not
  the material filling the place.

  (2) There is more than one way to fill the pattern with sets, and both ways do the
  arithmetic. In one way, each number is the set of all earlier numbers: 0 is the
  empty set, 1 is {0}, 2 is {0,1}, 3 is {0,1,2}, and 4 is {0,1,2,3}. In the other
  way, each number is the set whose only member is the previous number: 0 is the empty
  set, 1 is {0}, 2 is {1}, 3 is {2}, and 4 is {3}.

  (3) These two ways agree on everything a number has to do — order, addition, multiplication,
  and the rest — and differ only in what the items at the positions look like internally.

  (4) In the first way, 2 is a member of 4, because 4 = {0, 1, 2, 3}. In the second
  way, 2 is not a member of 4, because 4 = {3}, and 2 is not 3.

  (5) If there were a fact of the matter, prior to any choice of filling, about whether
  2 is a member of 4, then two equally correct fillings could not give opposite answers.

  (6) So the question "is 2 a member of 4?" has no answer about the numbers themselves;
