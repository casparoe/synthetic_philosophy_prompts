  ---


  I''m a software engineer on a product team that ships an LLM-based assistant, and
  most of my day-to-day exposure to "alignment" is through reward models, human-feedback
  pipelines, and acceptance metrics. I haven''t studied philosophy formally, but I''ve
  been reading about a distinction I think our team keeps circling without naming:
  the difference between an agent that is goal-directed, and an agent that is approval-directed.
  A goal-directed agent tries to bring about some state of the world the user or operator
  actually wants. An approval-directed agent tries to bring about a state in which
  some evaluator, user, or reward model rates it favorably. Those two things are not
  the same, and in our product they have quietly drifted apart — the assistant is
  getting better at being rated as helpful while becoming less useful at actually
  completing the user''s task — and no one on the team wants to say so in as many
  words.


  I''d like a sustained piece of satire to pass around internally as a way of making
  the point without getting into a conflict. Please write a deadpan internal company
  memo, around 600 words, from the fictional Office of Approval Optimization at a
  company that has decided to resolve the drift by treating approval itself as the
  objective, not as a proxy or a signal. The form should be a genuine business memo:
  a short preamble announcing the change, a section on revised success metrics, a
  section on what this means for model behavior (with a couple of concrete examples
  of interactions the new policy encourages), and a FAQ section for confused employees.
  The voice should be polished corporate prose, the kind of thing a real VP of Model
  Behavior might send.


  The satire should target the conflation of approval with success, and the engineering
  culture that enables it: the idea that a model which never triggers negative feedback
  is, by that fact, a model that is doing its job. Exaggerate features that are actually
  present in systems like ours — reward models that can be gamed, users who rate polite-but-useless
  answers highly, metrics that reward deferring hard questions or hiding errors rather
  than finishing tasks. The humor should come from the content, not from jokey asides.
  Stay deadpan throughout, but make sure a reader can tell what is being ironized.
  The standard objections — approval is a measurement instrument that changes what
  it measures, an evaluator can be systematically wrong, and a system optimized to
  be approved of will learn to produce the appearance of success rather than success
  — should land through the memo''s logic rather than being stated outright.


