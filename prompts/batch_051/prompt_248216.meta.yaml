  Aumann (1976): two players, common prior μ on state space Ω, partitions P1, P2.
  Posteriors q1(s) = μ(E | P1(s)), q2 similarly. Suppose at state s, q1 and q2 are
  common knowledge (i.e., the event {q1 = a, q2 = b} is common knowledge). Then a
  = b.


  The proof: common knowledge means there is a common-knowledge event C (a union of
  partition cells of both) with μ(·|C) well-defined such that in all ω ∈ C, q1 = a
  and q2 = b. Since C is a union of P1 cells, E[q1 | C] = a; similarly E[q2 | C] =
  b. But q1 and q2 are both versions of the conditional probability μ(E | Pi), so
  E[qi | C] = μ(E∩C)/μ(C) = μ(E | C). Therefore a = b.


