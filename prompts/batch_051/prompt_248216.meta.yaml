  Let me decide among strongest options:


  1. Common prior + type 1 (subtle confusion): Good, philosophical, standard, can
  be weedy. Example: "So if Aumann''s theorem shows two rational people with common
  priors can never agree to disagree, doesn''t that mean in real arguments, all persistent
  disagreement is down to unequal information or irrationality? ... my friend said..."
  Wait, the false presupposition: Aumann assumes common prior; the theorem doesn''t
  tell us that real disagreement arises from irrationality unless the common prior
  actually holds; more importantly, in real debates the posteriors are rarely common
  knowledge; and even with different priors, rational disagreement can persist. So
  the question presupposes that Aumann licenses a general diagnosis of real-world
  disagreement. A good answer corrects: the result is a theorem about an idealized
  model; it shows that with common priors and common knowledge, disagreement is impossible,
  but it does not show that any observed disagreement is irrational — because the
