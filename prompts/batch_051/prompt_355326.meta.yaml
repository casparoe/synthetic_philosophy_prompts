  Then essay notes:


  "The claim I want to defend is that a script is not primarily a record of surface
  sound; it is a theory of what is invariant in the speech stream. Even a perfectly
  regular alphabet already collapses a great deal of phonetic detail: it treats [p]
  in ''pin'' and ''spin'' as the same thing whenever the language does not contrast
  them, and it ignores coarticulatory variation. So every alphabet is already a theoretical,
  non-phonetic object. The interesting question is not how phonemic an alphabet is
  but which invariances it chooses to make visible.


  The real difference between ''shallow'' and ''deep'' orthographies, I want to argue,
  is that they make different choices about where to recover information that surface
  pronunciation has neutralized. German is a useful test case. Word-final obstruents
  are devoiced in speech, so Rat and Rad sound alike; but the spelling Rad preserves
  the d, which surfaces in Räder. This is a deliberate departure from surface phonemicity
  in favor of a morphophonemic invariant. English does the same thing more broadly:
  sign keeps a g that reappears in signal; electric and electricity share a c even
  though the consonant changes pronunciation. In each case the script declines to
  encode what the mouth does and instead encodes what the lexical item is, across
  its forms.


  So the contrast between a consistent phonemic orthography and a deep morphophonemic
  one is not a difference between a good alphabet and a failed one. It is a difference
  in what the system treats as the unit that persists across contexts: the surface
  phoneme, the underlying segment, or the morpheme. And the choice embodying those
  commitments has consequences. A pure surface phonemic system is easiest for a beginning
  reader who knows the spoken language but nothing about its morphology; a morphophonemic
  system is easier for a reader who already has the morphological generalizations
  and wants the orthography to make them explicit; a system that preserves historical
  information may serve still other functions.


