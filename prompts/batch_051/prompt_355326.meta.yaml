  "Last night I had a long argument with a friend about whether English orthography
  is best described as a defective phonemic alphabet or as something else entirely.
  My friend defended the popular view that an alphabet''s job is to map letters to
  sounds, that a script is better to the extent that the mapping is regular, and that
