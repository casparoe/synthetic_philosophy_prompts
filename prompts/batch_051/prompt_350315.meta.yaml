  Draft:


  "I am a novelist, and next month I am giving a talk to the ethics and political
  philosophy workshop of a philosophy department about the moral psychology that animates
  my recent novel. The novel follows a protagonist whose envy and resentment of a
  more fortunate rival slowly become, in the narrative''s own terms, accurate perceptions
  of a social arrangement rather than defects of character; the book implicitly defends
  the thought that such emotions can be signals of injustice and not only vices to
  be overcome. I plan to defend a version of that thought in philosophical terms:
  that envy and resentment, at least under conditions of serious inequality or subordination,
  can function as warranted indicators that something about the social order is unjust,
  and that Rawls''s admission of excusable envy in A Theory of Justice is the point
  where the standard vice-theoretic reading begins to crack.


  The audience will be roughly fifteen people: two senior political philosophers who
  work on Rawls and will know the envy discussion and the stability arguments in detail;
  a Kantian moral psychologist who is suspicious of treating any passion as a source
  of moral knowledge; a philosopher of emotion who works on the fittingness conditions
  of emotions and is sympathetic to resentment but dubious that envy can ever be fitting,
  because its content seems to be wanting the other''s advantage not to be theirs;
  and several graduate students who know the primary texts but not the secondary literature.
  They will care above all about keeping distinct the questions whether an emotion
  is psychologically understandable, whether it is morally excusable, and whether
  it reliably indicates injustice.


  My argument, in outline, is this. Rawls classifies envy proper as a vice, yet allows
  that some envy is excusable when the gap between the more and less favored is so
  great that the less favored cannot reasonably be expected not to feel it; he treats
  the absence of conditions that arouse excusable envy as one of the things a well-ordered
  society is supposed to achieve. I want to press on what ''excusable'' can mean here.
  If it meant merely ''psychologically inevitable,'' it would be a fact about stability
  to be managed, not something a conception of justice should aim to avoid; the moment
  it functions as a criterion for evaluating arrangements, it concedes that the envy
  is a comprehensible response to something objectively wrong in the arrangement,
  and that concession opens the door to treating envy and resentment as fallible but
  informative signals of injustice. The novel, I will say, is a narrative exploration
  of exactly that possibility.


