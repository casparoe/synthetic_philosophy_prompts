  Candidate 1: Manipulation vs legitimate persuasion.


  Exam question:

  "In a 750-word essay, define and distinguish manipulation from legitimate persuasion.
  Consider this case: an oncologist presents a treatment''s 5-year survival rate as
  ''95% of patients are alive at 5 years'' rather than ''5% die within 5 years'' because
  she believes this framing will encourage the patient to accept an aggressive course
  of treatment she judges best. Is the oncologist''s framing manipulative? Why or
  why not?"


  Student answer (mixed):

  "Manipulation is influence that bypasses a person''s rational capacities; persuasion
  engages them. So the difference lies in the mechanism: persuasion works by giving
  reasons the persuadee can endorse, while manipulation works by exploiting non-rational
  processes such as emotions, cognitive biases, and framing effects. Since the oncologist
  deliberately uses a framing effect, and framing effects are a well-documented cognitive
  bias, she is bypassing the patient''s rationality. Therefore the oncologist is manipulating
  the patient even if she has the patient''s best interests at heart and even if the
  statistic she gives is true. A further sign of manipulation is that the influence
  would be less effective if its mechanism were fully disclosed; the framing would
  change or lose its effect if the patient knew the doctor was choosing it, which
  marks it as non-autonomous. The same holds for all uses of framing in persuasion
  — they are manipulative by definition because they get their grip below the level
  of explicit deliberation."


  This student answer is right about: manipulation as bypassing rational capacities
  (one prominent view), framing effects being biases, the disclosure test. Subtle
  mistakes: (1) claiming any use of framing/emotion is manipulative — too broad: all
  communication involves framing; person-perspective frames can be legitimate; genuine
  persuasion often includes framing, and "bypassing" is not per se manipulation (e.g.,
  presenting information in multiple frames, defaults might respect autonomy if transparent).
  (2) The disclosure test isn''t a sufficient condition; many legitimate influences
  change under disclosure (rhetorical devices), and many manipulative ones don''t.
  (3) Maybe the claim that true statistics can''t be manipulative? The answer actually
  says true but still manipulative — that''s right. (4) The essay asserts "by definition"
  — conflating one theoretical account with definitional truth. That''s a subtle philosophical
  mistake: the mechanism view (bypassing rationality) is contested; other views say
  manipulation is hidden influence, or influence that undermines autonomy, or that
  manipulation involves directing someone''s will. Also, "framing effects are a cognitive
  bias" — true but not every instance of framing is an exploited bias; it can aid
  comprehension (e.g., absolute vs relative risk, natural frequencies). It also conflates
  "bypasses rational capacities" with "non-rational mechanism": using non-rational
  channels like emotion/affect is not automatically bypassing rationality; humans
