  Actually the classic reductionist/anti-reductionist debate: Humean reductionism
  (justify testimony by induction from past correlations) vs Reid''s anti-reductionism
  (testimony is a first principle; we''re wired to trust). A "prove too much" argument:
  (1) Anti-reductionism: I''m prima facie justified in believing what someone tells
  me just because they tell me, without needing positive evidence of reliability.
  (2) If so, then I''m prima facie justified in believing a stranger''s claim that
  he''s from the future, or that the moon has been replaced by a hologram, just because
  he says so. (3) But that''s mad; we need at least some evidence. (4) So anti-reductionism
  is false. (5) But now consider reductionism: justification requires a track record,
  but to establish anyone''s track record you have to rely on their reports or others''
  reports. (6) So the reductionist''s evidence base is itself testimonial. (7) Therefore
  neither view can get off the ground... The conclusion "testimony can never justify
  belief" is absurd because we all rely on testimony. Where does the argument go wrong?
  That''s quite standard — it''s basically the circularity objection and the gullibility
  objection combined. Not too original.


