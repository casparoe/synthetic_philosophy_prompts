  The domain: "The unilateralist''s curse" — the known idea: even when each member
  of a group acts with good intentions and generally good judgment, if any one member
  can unilaterally take a consequential action on the group''s behalf, the group is
  likely to take actions that most members would judge net-negative, because the member
  with the most extreme positive estimate acts first. (Bostrom, Sandberg, Douglas
  et al., "The Unilateralist''s Curse," 2016.) It applies to e.g., publishing dangerous
  research, unilateral geoengineering, uploading AI, etc. Known responses: majority
  vote, consensus, conformity principle, "do not go first" among epistemic peers...


