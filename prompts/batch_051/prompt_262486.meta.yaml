  - Etiological account of function (Wright 1973): A function of X is F iff X exists
  because it does F — i.e., the reason X is there is that F contributed to its selection/retention.
  Often cashed out as selected effects: proper function is what the trait was selected
  for (Millikan, Neander). Functions are normative: an item can have a function even
  if it can''t perform it (broken heart still has the function to pump blood); malfunction
  defined as failure to perform proper function.


  - Causal-role account (Cummins 1975): A function of X is its contribution to a capacity
  of a containing system, given an analytical strategy. Functions are dispositions/causal
  contributions; no normativity, no malformed function; "function" is relative to
  an explanatory interest and a decomposition of the system. Criticisms: too permissive
  (anything that has a causal role in some system has a function), can''t distinguish
  functions from mere side effects, no malfunction.


