  Let me draft:


  "Over the past year I have been on my university''s strategic-funding committee,
  and I have found my own intuitive verdicts about ''useless'' knowledge harder to
  systematize than I expected. I want you to find the principle behind them, or tell
  me which verdicts to abandon. Here are the cases as I actually feel them:


  1. A proposal for a next-generation telescope to map the cosmic microwave background
  in finer detail, aimed at constraining inflation. It has no foreseeable application.
  I would fund it, and not merely as a jobs program.

  2. A proposal to compute the last digit of the trillionth prime number. I would
  not fund it, even though it too is knowledge without application and the line between
  it and (1) feels important.

  3. A proposal in pure mathematics on a conjecture that connects two mature areas
  but has no payoff in engineering. I would fund it at some level.

  4. A historical study of medieval grain accounting practices in a small region.
  I would fund it, though I cannot name a use for it, and I feel roughly as positively
  about it as about (3).

  5. A cosmology proposal that is, by its own admission, not currently testable but
  might sharpen a mathematical theory. I find myself resisting it even though I funded
  (1).

  6. A proposal for battery research that is explicitly expected to lower storage
  costs within a decade. I would fund it without hesitation, yet if pressed I cannot
  say whether this is the same principle as in (1) or a different one, and that bothers
  me.


