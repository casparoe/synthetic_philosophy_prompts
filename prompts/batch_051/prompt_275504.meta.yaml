  disagree; therefore, they reason, avoidable disagreement must always be traceable
  either to unequal evidence or to unequal priors. They decide to design the law around
  this idea, eliminating as much avoidable disagreement as possible.


  The institution is called the Register. Each citizen, upon reaching twenty, must
  file a single personal prior: a probability distribution over a standard space of
  case-types defined by statute, where each case-type is a complete, mutually exclusive
  list of ways a dispute of that kind could be decided. Citizens may revise their
  filed prior only once every ten years and only after a public, notarized hearing
  at which they must state what new financial or familial position they hold. When
  two citizens fall into dispute, the tribunal does not hear them separately. It orders
  both parties to deposit all evidence they possess regarding the dispute, under penalty
  of aggravated fraud for withholding or fabrication. It then takes the two filed
  priors of the parties, constructs a synthetic common prior by averaging them according
  to a fixed public formula — one-half the prior of the citizen who filed earlier,
  one-third the prior of the citizen who filed later, and one-sixth the prior of a
  randomly drawn third citizen — and conditions that average on the pooled evidence.
  The ruling is the decision borne by the resulting posterior under each party''s
  own legal theory, and costs are assessed against the party whose filed prior was
  farther from the final posterior."


