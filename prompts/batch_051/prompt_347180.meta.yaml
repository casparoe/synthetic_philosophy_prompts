  Jeffrey conditionalization: Suppose a rational agent''s evidence shifts over a partition
  {E_i} of possibilities, with the new probabilities P_new(E_i) = q_i, and the conditional
  probabilities on each E_i remain unchanged: for any proposition A, P_new(A) = Σ_i
  q_i P_old(A | E_i). This is "probability kinematics" or "Jeffrey conditioning."
  The "rigidity" condition holds: P_new(A | E_i) = P_old(A | E_i) for each E_i. Jeffrey''s
  rule generalizes standard conditioning, which is the special case where one E_i
  receives probability 1. Strict conditionalizers hold that all evidence is, at bottom,
  a proposition learned with certainty—often the proposition about one''s sensory
  experience—and so update via Bayes'' rule on that certain proposition. Jeffrey conditionalizers
  hold that evidence can be "uncertain" and directly redistribute probabilities over
  a partition without any proposition being assigned probability 1.


