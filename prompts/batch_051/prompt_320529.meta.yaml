  grounding property" to "same treatment" ignores that relationships, special obligations,
  or role-ethics can themselves be part of the grounds; or the equivocation between
  "the feature that makes someone minimally worthy of care" and "the feature that
  fully determines how much care is owed"; or the move from "justified by property"
  to "only by property." A defender of graded love can accept 1 but deny that care-grounding
  properties are the only determinants: "being my parent" is also morally relevant
  and is a relational property not shared equally by strangers. So premise (3)''s
  "share the same care-grounding property" overlooks relational properties. Also step
  2 might be denied: what justifies caring is partly the relationship, not a non-relational
  property.


