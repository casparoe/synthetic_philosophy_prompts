  Background: Mozi (Mo Tzu) advocated jian''ai, impartial care/concern, against Confucian
  graded/differentiated love (care strongest for family, diminishing outward). The
  Confucian view: one ought to care for one''s father more than a stranger; that''s
  not moral failure but morally required gradation rooted in roles/rites. Mozi argued
  partiality causes conflict; if people were impartial, the world would be ordered;
  also impartial care is to be practiced because Heaven cares for all impartially
  (in some texts). But the step-by-step argument might be a modern reconstruction:


  (1) If an act is right because it produces the best outcome for everyone, then concern
  must be distributed so as to produce the best outcome for everyone.

  Hmm.


  Let''s build a clear argument with a modal/scope/equivocation issue.


  Argument for the conclusion that Confucian graded love is self-defeating or unjustified:


  (1) Love/concern for a person is justified only if that person has some property
  in virtue of which they are worth caring for.

  (2) The property in virtue of which humans are worth caring for is the same in every
  human (e.g., their humanity, or capacity for pain/flourishing).

  (3) If two people share the same care-grounding property to the same degree, then
  rational concern should treat them the same.

  (4) Family and strangers share that property to the same degree.

  (5) Therefore there can be no rational justification for caring more about our family
  than about strangers, and Confucian graded love is irrational.


