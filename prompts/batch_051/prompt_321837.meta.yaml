  leads to (1) infinite regress, (2) logical circle, or (3) dogmatic suspension of
  the principle of sufficient justification. Albert saw it as supporting critical
  rationalism: since ultimate justification is impossible, there is no Archimedean
  point; we can only subject claims to fallible testing. The role could be a proponent
