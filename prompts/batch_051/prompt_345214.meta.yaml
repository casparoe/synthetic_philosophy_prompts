  Let me draft full prompt:


  "I''m in a philosophy of law seminar on evidence, and I''ve been trying to write
  down my views on naked statistical evidence in one place so I can defend them when
  we get to the blue bus week. The problem is I can''t tell whether the set of things
  I believe actually coheres, or whether I''m just carrying around a bunch of independent
  intuitions that pull in different directions. I''d like a consistency check before
  I present.


  Here''s roughly where I''m at:


  (1) In the blue bus case — a plaintiff is hit by a bus, she can prove only that
  Blue Bus Company ran 80% of the buses on the road at that time, and there''s no
  other identifying evidence — I think she should lose.

  (2) I think the rodeo should also lose in the gatecrasher case, where 1000 people
  attended but only 499 paid, and the organizer picks one attendee at random to sue.
  He''s 50.1% likely to have jumped the gate, and I still think that''s not enough
  to find him liable.

  (3) I think preponderance of the evidence just means more likely than not: if, after
  considering the admitted evidence, the fact finder takes the claim to be more probable
  than not, the plaintiff wins. I don''t think there''s some further ''individualized
  evidence'' rule hiding inside the preponderance standard.

  (4) But I support market-share liability in the DES cases: if a plaintiff can''t
  identify which manufacturer made the drug that injured her, each manufacturer in
  the relevant market can be held liable for a share of damages proportional to its
  market share.

  (5) I also think a DNA match with a random-match probability of one in a billion
  should be able to convict, even if the case against the defendant is basically just
  the match. I go back and forth on whether that''s the same kind of thing as the
  bus case.

  (6) And in criminal cases, I don''t think bare statistics should ever be enough
  for proof beyond a reasonable doubt: if 99 out of 100 prisoners in a yard beat a
  guard to death and video shows one of them doing it but can''t show which one, I
  wouldn''t convict any particular prisoner on that evidence alone. I don''t see this
  as conflicting with what I said about civil cases.


  So: go through these the way you''d audit a friend''s web of beliefs. Which pairs
  are actually in tension, and which only look like they''re in tension? Rank the
  real tensions by severity, say what would have to give for each, and then tell me
  the cheapest single revision that would make the whole set cohere. Please don''t
