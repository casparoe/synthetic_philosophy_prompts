  Potential prompt:


  I have recently taken on the role of treasurer for a family-owned manufacturing
  company, which has forced me to think seriously about trade balances, exchange rates,
  and the flow of money across borders — matters I had previously left to economists.
  In trying to educate myself, I turned to David Hume''s essay "Of the Balance of
  Trade" (in his Political Discourses, 1752). There is a passage that has unsettled
  me. Hume asks his reader to suppose that four-fifths of all the money in Great Britain
  were destroyed in a single night, or alternatively that it were multiplied fivefold.
  In the first case, he argues, all prices would fall; foreign markets would then
  buy British goods so eagerly that money would flow back in until the nation recovered
  its former level. In the second, prices would rise; British subjects would buy more
  from abroad than they sold; and the surplus money would drain away. His conclusion
  is that no government need worry about a trade deficit or a shortage of money: the
  self-correcting movement of prices and coin will keep a nation''s share of the world''s
  money in proportion to its industry and commerce.


  I have read economists who call this the price-specie-flow mechanism, and many say
  it is a landmark argument. But I have also read critics who claim it only applied
  to a world of metallic money and fixed exchange rates, and that in a modern economy
  of fiat currency, central banks, and persistent trade imbalances, Hume''s mechanism
  is no longer a reliable governor. I find myself pulled in both directions. On the
  one hand, the logic of the argument seems almost too neat to be entirely false.
  On the other, my own company''s export orders have been hurt by a strong currency
  for a decade, and no automatic correction has rescued us.


  Write an essay on the controversy over whether Hume''s reasoning in that passage
  retains any real force for a modern open economy — not necessarily as a literal
  description of the gold standard, but as a deeper account of the relationship between
  money, prices, and trade. Weigh the main arguments on both sides. In particular,
  address what must change in the argument once money is no longer convertible into
  gold, once central banks can expand the money supply, and once exchange rates float.
  But do not end on a non-committal note. Defend a conclusion: either Hume''s insight
  survives in some important form, or it is largely a historical curiosity. Say precisely
  what the surviving form is, or precisely why it fails.


