  Potential final:


  I have recently become treasurer of a family-owned manufacturing firm that depends
  heavily on export orders, and this has forced me to think seriously about trade
  balances, exchange rates, and the movement of money across borders. In trying to
  understand why our own trade deficit seems to persist without any self-correcting
  adjustment, I read David Hume''s essay Of the Balance of Trade, first published
  in his Political Discourses of 1752. One passage in particular has stayed with me.
  Hume asks the reader to suppose that four-fifths of all the money in Great Britain
  were suddenly destroyed, and then to suppose instead that it were multiplied fivefold.
  In the first case, he argues, all prices would fall, foreign buyers would purchase
  British goods so eagerly that money would flow back into the country, and the lost
  stock would be restored. In the second case, prices would rise, the nation would
  import more than it exported, and the surplus money would drain away. His conclusion
  is that the quantity of money in a trading nation tends to regulate itself through
  prices and trade flows, so that the state need not guard its metallic money with
  prohibitions as long as it preserves the industry and skill of its people.


  I have since read economists who present this as the classic price-specie-flow mechanism,
