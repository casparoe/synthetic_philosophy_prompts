  associations, reinforcement history, and related lower mechanisms, and forbids goals,
  expectations, representations, choices, knowledge, or anything like a cognitive
  map. The satire should consist in what this commitment does to the explanation:
  each time one lower-level story fails to handle a detail of the result (the novel
  shortcut, the absence of prior reinforcement during the car rides, the rat''s pause
  at a choice point), the author adds another patch, and the patches grow increasingly
  elaborate. By the end, the supposedly parsimonious explanation should be plainly
  more complicated than the one that the canon forbade. Keep the author''s voice straight-faced
  and scientific; never have him state the criticism outright. The target is the practice
  of treating Morgan''s canon as a demand to prefer any sub-cognitive story over a
  simpler cognitive one, so that a principle intended to protect parsimony ends up
