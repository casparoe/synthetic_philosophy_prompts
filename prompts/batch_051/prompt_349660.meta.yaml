  Draft:


  "I just got put in charge of adding a ''minimize side effects'' penalty to the reward
  function for a delivery robot we''re piloting in a hospital, and the more I read
  about low-impact AI the more I''m stuck between two things I can''t both keep.


  On one hand, the elegant approach really appeals to me: you don''t tell the robot
  what''s valuable; you just penalize it for making the world different from what
  would''ve happened if it had done nothing. Or, a bit stronger, you keep it from
  destroying its ability to achieve a wide range of possible goals. That feels like
  the only way to say what a side effect is without writing down a full specification
  of value, which nobody on my team can do anyway. It''s simple, it''s quantitative,
  and it gives us a decision procedure: do the task, but keep the world close to the
  no-intervention baseline.


  On the other hand, I can''t shake the intuition that ''close'' or ''different''
  is doing unacknowledged value work. A robot that bumps a patient''s IV stand while
  delivering a package and a robot that repositions a chair are both ''changing the
  world,'' but only one of them is a side effect in the sense we actually care about.
  Every similarity metric I can imagine either smuggles in a judgment about which
  features matter (is a vase on the floor a feature of the world?) or is so physics-based
  that it misses exactly the differences we''d call harmful. So it looks like ''avoid
  side effects'' is only well-defined relative to some specification of what matters,
  and the whole low-impact project is either contradictory or just pushes the value
  specification into the choice of baseline and metric.


  I don''t want to be told which side wins. I want to know what it would cost to give
  up each, and whether there''s a reading on which both survive—maybe the theory is
  right as a practical engineering tool and my intuition is about something stronger,
  or maybe the intuition is the thing that should go because it''s exactly the kind
  of ''side effect'' notion we''re trying to formalize. Walk me through the strongest
