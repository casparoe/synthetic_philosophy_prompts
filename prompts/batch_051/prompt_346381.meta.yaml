  about the nature of voting. Interesting: the secret ballot protects voters from
  coercion and social pressure, thereby treating voting as a private act of conscience/interest
  rather than a public expression to which one is accountable. It presupposes that
  the relevant unit is the individual private preference, not public expression. But
  some political philosophers (Mill, for instance) thought voting is a public trust
  and should be public. The secret ballot presupposes that the voter''s expression
  is not a public act that others may evaluate — or at least that non-coercion outweighs
