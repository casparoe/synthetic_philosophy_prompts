  Content about imprecise probabilities: The view: when evidence is incomplete/ambiguous,
  a rational agent shouldn''t have a single precise credence; they should have a set
  of permissible probability functions (a credal set), and use them to make decisions
  via some decision rule (e.g., Γ-maximin, maximality, E-admissibility). Standard
  motivations: Ellsberg paradox shows people (and arguably rational agents) can''t
  reduce ambiguity to single subjective probabilities; precise Bayesianism requires
  arbitrary sharpening; imprecise credences better reflect the quality of evidence;
  they can represent ignorance and suspend judgment.


  Common subtle misrepresentations:

  1. Conflating "precise credences are often arbitrary" with "precise Bayesianism
  is irrational/falsely requires a unique number." In fact, many imprecise probabilists
  hold that precision can be a special case (when evidence warrants it) and that the
  view is a generalization of, not a rival to, Bayesianism; the charge of arbitrariness
  is that a single precise prior isn''t *mandated* by evidence, not that any precise
  choice is incoherent.

  2. Overstating: "incomplete evidence forces you to use intervals" — actually the
  claim is more modest: imprecise probabilities are permissible/rationally better,
  not strictly required; a precise Bayesian may still be rational, just more opinionated
  than the evidence warrants.

  3. The decision rule claim: "decisions are straightforward: choose the option with
  the best worst-case expected value" — that''s Γ-maximin, only one of several rules,
  and it''s highly controversial; imprecise decision theory has notorious problems
  (dilation, incomparability, sequential choice, value of information being negative).
  The summary presenting Γ-maximin as *the* answer is an overstatement/simplification
  a defender would object to.

  4. "Imprecise probabilities are just intervals" — conflating credal sets with intervals
  (intervals over single events don''t determine a set of joint distributions).

  5. The Ellsberg claim: "Ellsberg proved people are irrational to have precise beliefs"
  — actually Ellsberg gave an empirical/behavioral challenge and a normative argument;
  it''s contested.


