  Ive been trying to get a handle on what self-control actually is, mostly because
  I quit a few things over the years and noticed the times it worked felt really different
  from the times it didn''t, even when the outer behavior was identical. So I want
  to know if theres a single principle behind my gut calls, or if some of my calls
  just have to go. Heres what I think about a bunch of cases.


  1. My buddy keeps a candy jar on his desk and never touches it. He says he just
  doesn''t want candy and never did. I don''t think he''s showing self-control. Nothings
  being controlled; he just has different wiring.


  2. My aunt quit smoking by renting a cabin in the woods for a month with no cigarettes
  and no car to go buy any. She quit for good. I admire it, but it doesn''t feel like
  she exercised self-control—she just made the thing impossible. It feels like a trick,
  not a virtue.


  3 . A guy is on a diet and white-knuckles it all day. He''s miserable, he thinks
  about cake constantly, but he never eats it. I think that''s self-control if anything
  is. The fact that it hurts makes it more clearly self-control. Though a friend told
  me that''s not self-control, it''s repression, because the craving is still running
  his life. I don''t buy it, but it nags me.


  4. A woman signs up to run with a friend every morning because she knows she''ll
  be too embarrassed to skip. In the moment she never fights the urge to stay in bed;
  the friend does that work. I want to call this self-control, or something just as
  good, but it''s different from the white-knuckler.


  5. A guy gives his best friend the password to the account he uses to order junk
  food, and tells the friend not to give it back for a month no matter what. When
  he''s craving pizza at 2 a.m. there''s nothing left for him to do. That seems like
  self-control to me, maybe the smartest kind, because he controls himself at the
  one time he actually has leverage.


  6. A woman stays faithful to her husband only because she''s terrified of getting
  caught. I don''t fault the behavior, but I don''t call it temperance. She''d cheat
  tomorrow if she knew she''d get away with it. That''s just fear, or caution.


  7. A woman keeps to a strict diet by having turned herself into "a healthy eater."
  When someone orders a family-size pizza she doesn''t wrestle with it; she just feels
  that''s not the kind of person she is. I lean toward saying this is better than
  self-control, not just self-control. But she''s not struggling either, just like
  the candy jar guy, so maybe I''ve got a problem.


  8. A man quit drinking after a doctor told him one more binge could kill him. He
  still desperately wants a drink every day but doesn''t take one. I count that as
  real self-control, but it''s self-control from fear, and that sits differently with
  me than someone who quit because he didn''t want to be a drinker anymore.


  The two cases I can''t reconcile are the aunt in the cabin and the guy with the
  password: both offload the struggle to something outside themselves, but I''m convinced
  the password guy showed self-control and the aunt somehow didn''t. The only difference
  I can find is that the password guy set up a rule aimed at his future self, while
  the aunt just removed herself from a situation. But I worry I''m rationalizing to
  keep a verdict I like.


  So my question: is there one principle that captures all these, or close? If no,
