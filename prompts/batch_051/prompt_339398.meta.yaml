  Possible position set (7 commitments):

  1. In ordinary statutory cases, the judge''s duty is to apply what the text would
  have meant to a reasonable, informed reader at the time it was enacted.

  2. Talk of "legislative intent" or "the purpose of Parliament" is mostly a fiction.
  There''s no coherent mental state shared by hundreds of legislators, and it isn''t
  law anyway.

  3. Nonetheless, when a statute is genuinely ambiguous, courts should be allowed
  to look at Hansard and committee reports to help settle what it was meant to do,
  because deciding in an evidentiary vacuum is worse.

  4. I think the absurdity doctrine is legitimate: if the plain meaning leads to a
  result that is manifestly irrational or self-defeating, the court should depart
  from the text rather than enforce nonsense.

  5. Canons like the rule of lenity or expressio unius are fine, but only as tie-breakers
  once ambiguity is established; they''re not evidence of what the legislature actually
  thought.

  6. For constitutional or human-rights documents, though, I''m a living-instrument
  person: they should be read in light of present-day conditions and values, not frozen
  at the time of drafting. (I''m not American — the local one is fine, but I won''t
  name it.)

  7. If a court got a statute''s meaning wrong years ago and people have arranged
  their affairs on that reading, I''d usually leave the settled interpretation alone
  rather than "correct" it.


