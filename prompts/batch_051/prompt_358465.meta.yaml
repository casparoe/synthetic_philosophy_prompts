  Draft:


  I am a journalist who covers science and ideas for a general-interest magazine,
  and I am working on a feature about a long-running exchange between two philosophers
  who have been arguing about the Principle of the Identity of Indiscernibles for
  years, largely past each other. The principle, in its strong form, says that no
  two distinct things can share all their properties; the point at issue between them
  is what we should make of Max Black''s thought experiment, a universe that contains
  nothing but two exactly similar iron spheres some fixed distance apart.


  One of the two, call her the Leibnizian, holds that Black''s description is either
  covertly contradictory or incomplete: if the two spheres are genuinely distinct,
  there must be some property — if only a relational or positional one — that tells
  them apart, and if the description really leaves nothing that distinguishes them,
  then the principle stands and the purported two are not two. The other, call him
  the Blackian, holds that the universe is a genuine possibility and that the spheres
  are numerically distinct without any qualitative difference; on his view, distinctness
  can be brute, or can rest on primitive thisness, so the strong form of the principle
  is false as a piece of modal metaphysics.


  After a year of adversarial collaboration, the two have agreed to let me draft the
  joint statement they would both sign. It should be rigorous enough that neither
  side would regard its own position as distorted, but written for the serious non-specialist
  reader of a science-and-ideas section. Do not include a bibliography or footnotes;
  the point is the precision of the formulations. The document should contain:


  1. A numbered section of claims both parties can jointly sign. These should be non-vacuous
  and should include: what Black''s scenario does and does not stipulate; the distinction
  between qualitative and numerical identity; the difference between strong, weak,
  and trivial formulations of the principle, with a note on which formulation is actually
  disputed; and the agreed implication that if the strong formulation is a necessary
  truth, Black''s universe is impossible. Avoid formulations that only one side would
  control.


  2. A disagreements table with columns for (a) the sub-question, (b) the Leibnizian''s
  position in wording she would endorse, (c) the Blackian''s position in wording he
  would endorse, and (d) a verdict on whether the row is a substantive disagreement
  or a merely verbal one.


  3. A cruxes section. For the two or three sub-questions that, if settled, would
  force at least one side to revise, specify in advance what each side regards as
  the deciding consideration or the most diagnostic modification of the two-sphere
  case, and record each side''s prediction. But draw particular attention to these
  pressure points if the collaboration has reached them: whether spatial position
  and distance are qualitative properties or already presuppose distinct locations;
  whether the fact that each sphere is two miles from the other but not from itself
  amounts to a kind of discernibility, and whether that kind would save or trivialize
  the principle; and whether the best case for brute distinctness comes from Black''s
  world itself or from elsewhere, such as the indistinguishability of particles under
  permutation in quantum theory.


