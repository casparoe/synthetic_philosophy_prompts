  Consider the argument at the center of costly signaling theory. According to the
  handicap principle, when a signaler benefits from exaggerating a quality and the
  receiver cannot directly inspect that quality, the signal can remain reliable only
  if it is differentially costly: its cost must weigh more heavily on low-quality
  signalers than on high-quality ones, so that low-quality signalers are deterred
  from mimicking the display. On this line of reasoning, the peacock''s tail does
  not reliably indicate condition because it is verifiable or because peacocks are
  honest; it indicates condition because growing and carrying it is a handicap that
  a low-condition bird could less afford. Now consider a change in the signaling environment:
  many human (and increasingly machine-mediated) signals now pass through cheap verification
  infrastructure—cryptographic authentication, standardized certification, tamper-evident
  records, reputation systems that aggregate third-party reports, and publicly inspectable
  work products. In these settings, a signal can be informative because it is hard
  to counterfeit, not because sending it is costly to the sender; the cost is shifted
  toward the would-be faker and toward the verification mechanism itself, while honest
  senders may pay very little at the margin. A developer can signal ability by publishing
  a codebase that is free to inspect but expensive to fake; a seller can signal reliability
  through a review history it did not buy. Does the argument behind the handicap principle
  survive this changed assumption, does it need to be revised, or does it simply stop
  applying once verification is available? I am asking what happens to the argument,
  not to any particular display: identify which premise the cheap-verification development
  bears on, and say whether the principle can be restated in a form that still does
  the same explanatory work.


