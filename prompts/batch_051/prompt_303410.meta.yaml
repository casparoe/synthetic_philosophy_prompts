  Panpsychism: the view that consciousness/mentality is fundamental and ubiquitous;
  the minimal claim is that the fundamental constituents of reality have some form
  of experience/proto-consciousness. The combination problem: how do micro-experiences
  combine into the unified, bounded consciousness of a human being (macro-experience)?
  William James called it the "combination problem" and argued that "even if we suppose
  elementary units of mind, they cannot sum into a composite mind." Variants: the
  subject-combination problem (how do many subjects become one subject?), the palette/binding
  problem, the grain problem, the structural mismatch problem.


  A plausible popularizer''s summary might say:

  "Panpsychism is the view that everything has a mind — electrons, rocks, thermostats,
  and maybe the universe. It promises to solve the hard problem of consciousness by
  saying consciousness isn''t something that suddenly switches on when matter gets
  complicated; instead, every particle already has a tiny bit of experience, and complicated
  experience is just lots of little experiences added together, the way many small
  drops of water add up to a puddle. The obvious problem is the combination problem:
  no matter how many tiny minds you pile up, they never fuse into one new mind, any
  more than a crowd of people becomes a single person. So the view fails to explain
  how you and I get our unified consciousness."


  This summary contains subtle misrepresentations:

  1. "everything has a mind — electrons, rocks, thermostats" — panpsychism generally
  does not say rocks or thermostats have minds; it says that fundamental constituents
  (or perhaps certain entities) have experience/proto-phenomenal properties, and "mind"
  is ambiguous between full cognition and micro-experience. Conflating having experience
  with having a mind (in the everyday sense) is a technical term used in everyday
  sense.

  2. "complicated experience is just lots of little experiences added together" —
  panpsychists do not typically claim experience simply sums or aggregates by addition;
  many deny that micro-experiences literally combine and instead defend alternative
  options (constitutive vs emergent, cosmopsychism, etc.). The metaphor "the way drops
  of water add up to a puddle" misrepresents the constitutive panpsychist claim, which
  is that macro-experience is grounded in micro-experiences arranged in certain ways,
  not merely added.

  3. "no matter how many tiny minds you pile up, they never fuse" and "any more than
  a crowd of people becomes a single person" — this states the combination problem
  as an obvious refutation; but panpsychists have responses (phenomenal bonding, emergent
  combination, constitutive grounding being non-transparent, etc.). A standard objection
  presented as a refutation.

  4. "So the view fails to explain how you and I get our unified consciousness." —
  conclusion drawn that may not survive correction.


