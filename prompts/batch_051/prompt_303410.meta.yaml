  it is built entirely out of conscious parts. The article then argued that the view
  collapses under the combination problem: no matter how many little minds you pile
  up, they remain separate, just as a crowd of people never becomes a single person.
  So, it concluded, panpsychism cannot explain how you and I end up with one unified
  consciousness, and we are left where we started.


