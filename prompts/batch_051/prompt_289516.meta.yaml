  with a hand-picked prior, and close with the man insisting that his total inaction
  is still optimal up to an additive constant, so there is nothing wrong. The satirical
  target should be the practice of treating Solomonoff induction as a usable universal
  epistemology when it is really an elegant but uncomputable ideal."


