  "I am giving a talk next month to a mixed philosophy/economics audience, and I need
  an objection prep sheet. My thesis is that Aumann''s agreement theorem is routinely
  misused in the epistemology of disagreement: it is presented as showing that rational
  agents who know each other''s opinions cannot disagree, when in fact the theorem
  is a fixed-point result whose normative anti-disagreement conclusion is bought entirely
  by the common-prior assumption. That assumption, I will argue, is not an idealization
  of rationality; it is a substantive empirical claim about two people''s pre-existing
  beliefs, and it is exactly the claim that is false or unavailable in most actual
  cases of persistent peer disagreement. Therefore the theorem neither supports anti-conciliationism
  nor licenses a general norm of convergence; it functions at best as a diagnostic
  tool that tells us, when mutually known disagreement persists, that one of the structural
  conditions has failed and that the common-prior condition is usually the best candidate.
  Mainstream appeals to the theorem thus do what I call prior laundering: they smuggle
  a shared prior into the description of ''two rational agents'' and then present
  the resulting agreement as a discovery about rationality.


  My argument for the talk, in brief: (1) state the theorem precisely as a claim about
  measurable partitions, posteriors for a common event, and common knowledge; (2)
  show by contraposition that it says only that if two agents have a common prior
  and their divergent posteriors are common knowledge, then at least one assumption
  must have failed; (3) argue that in real disagreements the common-prior assumption
  is typically the least plausible assumption, not a harmless idealization; and (4)
  conclude that disagreement remains compatible with everyone being individually rational,
  so long as their priors differ in ways common knowledge cannot paper over.


