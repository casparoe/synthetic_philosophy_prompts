  Punishment theory distinctions:

  - Retributivism: punishment justified because deserved; proportionality; censure.

  - Consequentialism: deterrence, incapacitation, rehabilitation; punishment as forward-looking.

  - Hybrid / two-level: Hart: general justifying aim is consequentialist, but distribution
  of punishment constrained by retributive principles (only punish the guilty, proportional).

  - Expressivism: punishment communicates condemnation (von Hirsch, Duff). This is
  a niche-ish idea but LLMs know "expressivism."

  - Side constraints: can''t punish innocent even if good consequences.

  - "Limiting retributivism" (Norval Morris): desert sets upper/lower limits, consequentialist
  aims within.

  - Problem: "punishment" of consensual or self-imposed penance? If someone genuinely
  wants to be punished to make amends, is it punishment in the legal sense? Hmm.

  - "The paradox of punishment" — to justify punishment as communication/censure you
  must address the offender as responsible, but hard treatment seems to conflict.

  - Specific vs general deterrence.

  - "Moral education" theory of punishment (Hampton): punishment teaches the wrongdoer
  and society the wrongness of the act.

  - "Fair play" / unfair advantage theory (Morris, Murphy): crime upsets fair distribution
  of benefits/burdens; punishment restores balance.

  - Restorative justice: focus on repairing harm, offender accountability, victim/community.

  - Abolitionism.


