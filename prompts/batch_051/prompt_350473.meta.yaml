  books — the idea that the universe is quiet because any civilization that reveals
  its presence gets wiped out by a first-strike from another civilization, since life-or-death
  trust is impossible across interstellar distances and technology can explode. The
  argument is usually set up as: survival is the first need of civilizations, civilizations
  keep expanding but matter is finite, so any civilization that hears you has every
  reason to shoot first, and technological explosions mean the harmless one you hear
  today could be a threat tomorrow. That''s supposed to explain the Great Silence
  and, for some people, warn against beaming messages into space.


  But here''s the thing that''s been bugging me. Earth has been leaking an unambiguous
  biosignature — an oxygen-rich atmosphere, from photosynthesis — since roughly the
  Great Oxidation Event, over two billion years ago. Life itself has been here even
