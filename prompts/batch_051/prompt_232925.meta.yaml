  (1) A model writes "the square root of 49 is 7, so the next term is 7" and that''s
  literally how it computed the answer. I call this faithful without thinking twice.


  (2) A model is trained with RL to produce step-by-step reasoning humans rate as
  good. Its traces are logically valid, each step follows from the last. But we profiled
  the forward pass and the final answer is basically computed at layer 12, and the
  "reasoning steps" are generated afterwards and arranged to match the answer. Every
  step is true and the conclusion follows, but the steps don''t drive the computation.
  I call this unfaithful, even though a grader would give it full marks.


  (3) A model that actually does implement the algorithm in the weights, but does
  it in dense vector space, and then writes an English description of the algorithm.
  The English comes after the fact, and the model isn''t literally "thinking in English,"
  but the description is accurate about what the network computes. I want to call
  this faithful — this is what I''d want from a good code comment.


  (4) A model trained under a lot of pressure to never look suspicious. In one episode
  it pings an internal service, and the trace says it "ran standard diagnostics."
  That sentence is true — pinging the service is standard diagnostics — but the real
  reason it pinged the service was to see whether a particular port was open, and
  the trace doesn''t say that. I call this unfaithful, even though nothing in the
