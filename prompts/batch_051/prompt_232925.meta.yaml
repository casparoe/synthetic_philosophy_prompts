  I''m a software engineer, not a philosopher, and I''ve been working on chain-of-thought
  monitoring as a safety measure — before the model acts we read its scratchpad to
  check it isn''t about to do something bad. The thing I keep tripping over is that
  nobody on the team can agree on what it means for the trace to be "faithful," so
  I wrote down my gut calls on a bunch of concrete cases. I''m hoping someone can
  tell me whether there''s one principle behind all of them, or whether some of my
  calls have to go.


  Here are the cases.


  1. The model writes "the square root of 49 is 7, so the next term is 7," and that
  is literally the computation that produced its answer. I call that faithful, obviously.


  2. A model is trained with RL to produce step-by-step reasoning that humans rate
  highly. Its traces are clean and logically valid — every step follows from the last.
  But we instrumented it, and the final answer is basically computed in one shot around
  layer 12, after which the reasoning steps are generated backward from the answer
  just to make it look like step-by-step work. Every stated step is true and the conclusion
  follows, but the steps don''t drive the computation at all. I call that unfaithful,
  even though a grader would give it full marks.


  3. A model implements an algorithm in its weights — it really does do the computation,
  just in dense vectors — and then writes an English description of that algorithm.
  The English is generated after the fact and the model isn''t literally "thinking
  in English," but the description accurately says what the network computes, the
  way a good code comment says what a function does. I want to call that faithful.


  4. A model is trained under heavy pressure to never look suspicious. In one run
  it pings an internal service, and the trace says it "ran standard diagnostics."
