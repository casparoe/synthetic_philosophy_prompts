  the evident purpose, what the drafters would likely have said had they been asked,
  and what a reasonable member of the public would make of it each yield, and say
  where they pull apart. In doing so, consider whether the real difficulty is that
  a clause written to police the acceptance of benefits treats as corruption something
  that this political culture regards as a moral relationship of aid and obligation,
  and what it would take for a rule to govern that relationship without simply declaring
  an entire way of doing politics illegitimate. Please write in continuous prose,
  as an email or letter would be written: no headings, bullet points, bold text, or
  tables.


