  I was recently elected to a district council in a city where politics has long been
  conducted through personal favours rather than through policy platforms, and I now
  sit on the committee that must apply the council''s new code of conduct. The code
  was rewritten with advice from an international anti-corruption programme, and it
  contains the following clause: "A councillor shall not accept any gift, hospitality
  or other benefit, whether given to the councillor or to a third party at the councillor''s
  request, if a reasonable member of the public could conclude that the benefit is
  intended to influence the councillor''s conduct in office or to create a sense of
  obligation."


