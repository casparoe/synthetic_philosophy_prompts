  for councillors to secure discretionary benefits for individual households: a transfer
  to a particular housing estate, a place on a municipal training scheme, the expediting
  of a licence that is technically governed by a queue. The councillor telephones
  the relevant department, and the thing is done. There is no formal entitlement and
  no written agreement, but the practice is governed by a clear norm of reciprocity.
  The households helped are expected, at the next election, to attend the councillor''s
  rallies, to allow the party''s flag to be displayed on their houses, and to vote
  for the councillor. A household that fails to reciprocate is treated as ungrateful,
  and its subsequent requests are not answered.


  A complaint has been filed against a colleague, not for securing the benefits, but
  for accepting a benefit in return: namely, the organised electoral support of the
  households she has helped. Her defence is that she accepted no gift; votes are not
  property, she solicited nothing explicitly, and support freely given after good
  service is ordinary democratic gratitude, not corruption. The drafters of the clause
  plainly had lunches, tickets, envelopes of cash and holidays in mind, not the quiet
  architecture of clientelist exchange. Yet the exchange is what holds her political
  career together.


  I am less interested in a practical recommendation than in whether the clause, honestly
