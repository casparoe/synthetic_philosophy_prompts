  A year ago I was elected to the district council of a city where politics has long
  been conducted through something between public service and clientelism, and I now
  face a complaint under the council''s new code of conduct. The code, rewritten with
  advice from an international anti-corruption programme, provides: "A councillor
  shall not accept any gift, hospitality or other benefit, whether for themselves
  or for another, if a reasonable member of the public could conclude that the benefit
  was given to influence the councillor''s conduct in office or to create a sense
