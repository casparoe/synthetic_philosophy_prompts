  Goal: A scenario where an autonomous weapons system satisfies all the commonly cited
  formal requirements for meaningful human control, yet a substantive account denies
  meaningful human control. Constraints: near-future but not science-fictional; the
  human operator is competent, sober, well-intentioned, with adequate time and full
  information; no deception, coercion, or negligence; the failure must be structural,
  not individual. Then demonstrate: state how each formal requirement is met; why
  the substantive account says control is not meaningful; which feature of the case
  does the work; what happens if that feature is removed; and how a defender of the
  formal checklist would push back.


