  So the checklist is met.


  Substantive account: meaningful human control requires positive control — the human
  must be an author of the plan, able to shape or select among live options for what
  to strike and how, not a mere auditor of a single default. The human can only veto
  one algorithmically settled option; the actual targeting decisions (who, when, with
  what aim point, under what risk threshold) are made by the system. The "control"
  is therefore negative and reactive, and fails to preserve a human agent''s responsibility
  for the morally loaded particulars. The human has no opportunity to bring independent
  judgment to bear on the selection among feasible alternatives, only to ratify or
  cancel a preselected target.


  Feature doing the work: the design enforces negative-only control by collapsing
  all alternatives into a single precomputed option, so the human approval is binary
  rather than deliberative. If we removed that—adding a tool to adjust or select among
  targets—the case would collapse into an ordinary consent-to-targeting case and the
  substantive objection would lose its bite.


  Defender of formal checklist would say: meaningful control is about accountability
  and preventing an autonomous system from acting without human authorization; the
  operator can always abort, and approving a fully specified target after reviewing
  its expected effects is a genuine exercise of control. The veto is powerful because
  each nomination must clear it; no strike occurs unless a human judged it acceptable.
  Positive generation of alternatives is not required; otherwise, human approval of
  any pre-planned operation (e.g., artillery fire missions) would count as loss of
  control.


