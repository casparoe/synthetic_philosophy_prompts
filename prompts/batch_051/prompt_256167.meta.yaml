  ---


  In Freedom and Resentment, P. F. Strawson argues that the old debate about whether
  determinism would undermine moral responsibility rests on a mistake: our practices
  of holding one another responsible are not conclusions from a metaphysical theory
  that could be repealed by one. They are built out of the reactive attitudes — resentment,
  gratitude, indignation, hurt feelings — through which we register the quality of
  other people''s wills toward us. On his telling, we take an objective attitude toward
  someone only as a partial, temporary exception (as with children or the severely
  mentally ill); we cannot adopt the objective attitude toward everyone at once, because
  a social life run entirely on objective, non-reactive terms is not something beings
  like us could actually live.


  Now suppose a technology changes that assumption. Imagine a safe, cheap, and precisely
  targetable intervention — a reactive-attitude editor — that lets a person voluntarily
  suspend a chosen reactive attitude while keeping the rest of their moral psychology
