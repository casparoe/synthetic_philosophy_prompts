  Draft:


  I''m putting together a session for an undergraduate philosophy of information course
  in which we read C. Thi Nguyen''s distinction between epistemic bubbles and echo
  chambers alongside Peter Weir''s film The Truman Show, and I''d like help building
  the interpretation I''ll teach. My working sense of the distinction is this: an
  epistemic bubble is a structural lack of exposure to relevant outside voices, so
  that contrary information never arrives, while an echo chamber is a social-epistemic
  structure that actively cultivates distrust of outside sources, so that a person
  is trained to dismiss what they do encounter as untrustworthy. The film is usually
  slotted into bubble territory since Truman''s world omits any evidence of the reality
  outside the dome, but I want to argue that this is too tidy: much of the film''s
  machinery is about managing trust once anomalies leak through—the stage light, the
  radio frequency, the scripted reassurances from Meryl and Marlon, and especially
  the removal and discrediting of Sylvia after she tries to tell Truman the truth.
  So I''d like a reading that treats the film not merely as an illustration of one
  concept but as a test of how sharp Nguyen''s distinction really is.


  Specifically, I''d like your account of what the film shows about how bubbles are
  maintained and how they interact with trust-management: is Truman''s world best
  described as an epistemic bubble that is insulated by echo-chamber tactics, as an
  echo chamber proper, or as something distinct that the distinction was never designed
  to capture? Where does the lens genuinely illuminate a scene—for example, what makes
  the Marlon scene different from simple misinformation, and why Sylvia''s testimony
  gets special treatment? And where does the film resist the reading, so that an honest
  critic has to admit the concepts stop doing useful work? Then I''d like a conclusion
  about what the film adds to the philosophical debate that the distinction alone
  doesn''t: in particular, I suspect it dramatizes something about the role of sensory
  anomalies and firsthand evidence in breaking trust-management, since Truman ultimately
  cannot be argued back into the fold. I''ll be teaching this to students who know
  the film well but not the epistemology, so the argument should stay close to commonly
  remembered scenes and the two concepts without invoking scholarly debates about
  either.


