  I''m putting together a unit for an undergraduate course on social epistemology,
  and I want to build a session around Peter Weir''s The Truman Show and the distinction
  between epistemic bubbles and echo chambers that C. Thi Nguyen has made influential.
  As I understand the distinction, an epistemic bubble is a structural lack of exposure
  to relevant outside voices: contrary information never reaches you, so the problem
  is an absence. An echo chamber is something more active and harder to escape: it
  shapes whom you trust, so that when contrary voices do reach you, you have already
  been trained to dismiss them as unreliable. My working hypothesis is that the film
  is usually misread as a pure bubble narrative. Truman''s world does omit nearly
  all evidence of an outside, but what interests me is the machinery that switches
  on once anomalies begin leaking in—the falling studio light, the intercepted radio
  transmission, the scripted reassurances from his wife Meryl and his best friend
  Marlon, and the way Sylvia, who tried to tell him the truth, is hurried away and
  treated as delusional. I want to argue that the film shows a bubble being reinforced,
  once it springs leaks, by echo-chamber tactics aimed at managing trust rather than
  merely filtering information.


  I would like a close reading that tests this hypothesis rather than simply illustrating
