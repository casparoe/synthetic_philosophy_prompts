  Adams'' Thesis (Thesis of Adams): For indicative conditionals, the assertability
  (or probability) goes by conditional probability: P(A→B) = P(B|A), when P(A)>0.
  Adams himself thought conditionals don''t have truth conditions and the probability
  isn''t probability of truth but probability of assertion-as-yet? Actually Adams
  (1975) proposed that the probability of an indicative conditional is the conditional
  probability, and argued that conditionals don''t express propositions. Edgington
  developed a non-propositional account.


  Lewis (1976) proved triviality: If the probability of a proposition "If A then B"
  equals P(B|A) for all probability functions, then only trivial probability functions
  exist (a few atoms). Several proofs. The standard reply: deny propositionality /
  deny that conditionals have truth conditions, so they don''t express propositions
  with probabilities of truth; but then embedding and truth talk become hard. Lewis''s
  proof assumes conditionals have truth values/propositions and that the equation
  holds across conditionalization. There are versions by Hájek that weaken assumptions.
