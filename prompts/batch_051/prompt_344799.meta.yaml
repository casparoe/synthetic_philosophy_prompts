  Potential prompt:


  I''m a PhD student working on AI alignment and the philosophy of computation, and
  I need to submit a two-page workshop proposal for a philosophy of AI conference.
  The theme is "solvability in principle" applied to alignment. My problem is I keep
  going in circles. I want the proposal to ask: when people say the alignment problem
  is "solvable in principle," what do they actually mean by "in principle" — and does
  the most plausible interpretation support the kinds of technical research programs
  that people actually pursue?


  Some people mean something like: there exists a finite set of reward functions or
  constraints such that, if an agent optimized them exactly, the agent wouldn''t do
  anything catastrophic. Others mean: for any specification of human values, there
  is some computational procedure that would align an agent to it given unlimited
  compute and a perfect world model. Others seem to mean something much weaker, like:
  there''s no theorem showing that alignment is impossible, so it''s rational to keep
  trying. These are very different claims, and they license different research bets.
  I want the proposal to argue that the field hasn''t been careful about distinguishing
  them, and that arguments over "solvability" are often people talking past each other
  because one side has an epistemic reading (we can eventually find the right objective)
  and the other has a metaphysical or computational reading (there exists an objective-independent
  solution procedure).


  The angle I''d like to pitch: instead of asking whether alignment is solvable in
  principle, ask what kind of "in principle" claim could actually bear the weight
  people put on it in research agendas. I have a half-formed idea that the most defensible
  reading is something like "solvable in principle relative to a fixed value specification,
  but not necessarily in practice relative to the messy process of finding and agreeing
  on that specification." But I don''t know if that''s too deflationary, and I also
  don''t want to just relabel the alignment problem as a moral philosophy problem
  and call it a day.


