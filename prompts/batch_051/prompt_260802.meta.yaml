  Key subtle points about Pascal''s wager:


  1. Pascal''s actual text: "Infini–rien" is not simply a decision table with infinite
  payoff; he argues more subtly (the "all your life" wager; "you must wager; it is
  not voluntary; you are embarked"). Some reconstructions as dominance argument. But
  we shouldn''t quote from memory. We can avoid quoting. If quoting, must fetch. Better
  to avoid verbatim quotes. I can paraphrase: Pascal holds that the expected value
  of wagering for God is infinite because the payoff is infinite and the probability
  of God''s existence, however small, is strictly positive.


  2. Reconstruction 1 (Dominance): If God exists, wagering wins; if not, wager loses
  little. So wagering dominates (weakly). Problem: the "if God exists" row assumes
  the wager''s payoff structure, but with many possible gods, wagering for the Christian
  God might lose under other deity hypotheses, so dominance fails. Also dominance
  requires the act be better in every state; but there are states (e.g., a jealous
  other god) where wagering for the wrong god is worse than not wagering. So dominance
  reconstruction fails under partition by deities.


  3. Reconstruction 2 (Expected utility): EU(wager) = p∞ + (1−p)(finite) = ∞; EU(not
  wager) = finite; so wager maximizes expected utility. Problems: (a) infinite utility
  leads to problems: if p is infinitesimal or zero, p∞ is undefined/0×∞; (b) if both
  acts have infinite expected utility for any act with nonzero probability of God
  existing, then any act can be rationalized; (c) the mixed-strategy point: if I assign
  any positive probability to wagering... wait.


  Actually the mixed-strategy point: If I randomize with probability q of wagering
  and (1−q) of not, then as long as q > 0, EU = q∞ + finite = ∞, same as wagering
  with certainty. So expected utility theory cannot distinguish between wagering with
  certainty and nearly-never wagering; the many-gods objection and mixed strategies
  show that infinite payoffs swamp all probabilities, making the framework unable
  to guide action. This is a deep, in-the-weeds point.


  4. Many-gods objection: the wager''s decision matrix has "God exists" vs "God does
  not exist." But the space can be partitioned differently: the Muslim God exists,
  a god exists who punishes wagering belief, a god who rewards only atheists, etc.
  The argument''s validity depends on the partition; the act "wager for the Christian
  God" is not the same act as "believe in some god with infinite reward." The objection
  is not merely "another row" but shows the problem is partition-dependent: by re-partitioning
  the state space, you can make any act dominant or maximize expected utility. A properly
  constructed wager must justify the partition (e.g., via independent evidence that
  the relevant alternatives are only the Christian God vs none), but then it''s no
  longer independent of evidence — it''s an argument that only works given evidential
  premises.


  5. The "infinite expected utility leads to absurdity" / mixed strategies / St. Petersburg:
  If infinite utility is allowed, expected utility is ill-defined for many gambles;
  e.g., a gamble that offers infinite payoff with any nonzero probability has infinite
  EU. This parallels the St. Petersburg paradox, where if utility is unbounded, one
  can construct infinite-utility gambles and the framework fails. Pascal''s wager
  needs utility bounded or needs a finitized version with large finite utilities,
  in which case empirical probabilities and evidence re-enter.


  6. Can the wager be rescued? Three moves: (a) bounded finitized wager becomes a
  normal expected-utility argument that depends on evidence (probabilities) and is
  no longer a pure "wager" independent of evidence; (b) restrict partition by citing
  theological/epistemic arguments, which imports evidence; (c) drop expected utility
  and use some non-Archimedean or dominance-flavored principle, which has other costs.
  So the wager "either fails as a pure practical argument or succeeds only as an evidence-dependent
  expected-utility argument, in which case it is not doing the unique work Pascal
  assigned to it."


