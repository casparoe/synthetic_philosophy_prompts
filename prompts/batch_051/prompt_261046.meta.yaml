  Then take up the visitors question: how do out-of-towners behave differently from
  locals under these rules, and when—if ever—should a visitor treat a local convention
  as a moral obligation rather than a mere courtesy? Keep the descriptive prediction
  and the normative claim clearly separated, and where you give a should, tell me
  whether it rests on a view that people who study this actually contest.


