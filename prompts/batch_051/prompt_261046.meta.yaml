  Imagine a mid-sized American city—call it Riverside—where at midnight tonight three
  things change, all at once, and nothing else does:


  1. Voluntary tipping stops being possible. Every restaurant, bar, and cafe goes
  cashless overnight and their payment systems lose the tip field permanently, so
  there is literally no way to leave a gratuity. Instead, every sit-down food and
  drink place automatically adds a flat 18% service charge that goes straight to the
  workers.


  2. The city launches a genuinely competent Queue Authority that polices line-forming
  everywhere people queue—buses, clinics, grocery stores, food trucks. Cutting, holding
  a spot for more than one person, and drifting in from the side are fined like parking
  tickets.


  3. The city decriminalizes jaywalking and rips out most marked crosswalks from the
  downtown grid. People cross wherever they like, and if a car hits a pedestrian the
  driver is liable by default.


  Same population, same incomes, same police, same tourist numbers, no public-information
  campaign.


  Over the next ten years, predict how restaurants and bars, queue behavior, and downtown
  driving and walking change. I want the mechanisms laid out, not a story: for each
  of the three changes, separate the effects that run through incentives (prices,
  fines, liability) from the effects that run through social emotions (gratitude,
  shame, resentment, insult) and the effects that run through people''s background
