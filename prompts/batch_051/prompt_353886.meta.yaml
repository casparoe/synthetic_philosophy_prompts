  Here''s the argument I''ve been toying with, put as formal steps:


  (1) Spinoza''s necessitarianism says every idea, every affect, and every state of
  a finite mind follows from the necessity of the divine nature in exactly the same
  way as everything else.

  (2) The intellectual love of God is one such state of a finite mind: a joy accompanied
  by the idea of God as its cause, arising from intuitive knowledge.

  (3) From (1), whether I reach the intellectual love of God, or remain stuck in passive
  affects, is itself necessary; there is no real open possibility of both outcomes
  from which I could choose.

  (4) But Spinoza''s whole ethical trajectory in Parts IV and V seems to be about
  striving, increasing one''s power of acting, and moving from bondage to the intellectual
  love of God; it''s full of what reads as guidance about how to live.

  (5) If (3) is true, that guidance can''t be doing what it looks like doing: it can''t
  be giving me a genuine task whose outcome depends on my effort.

