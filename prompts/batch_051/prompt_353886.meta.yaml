  and not as something that merely happens to some people by luck.

  (7) So either Spinoza''s necessitarianism undermines his account of the intellectual
  love of God as an ethical achievement, or the ethical language is not really normative,
  which then makes nonsense of "blessedness" as something worth orienting a life toward.


