  Petitionary prayer to an omniscient and immutable God: Classic problem. If God is
  immutable, God''s will cannot change; if omniscient, God already knows what''s needed
  and what will happen. So asking God for something seems to presuppose either that
  God might change a decision, or that God''s action is contingent on the prayer in
  a way already built into His eternal plan (the prayer itself is a means he has willed,
  not a cause of change). Key distinction: petitionary prayer may be a practice that
  presupposes requests can be among the causal antecedents of outcomes without implying
  God changes. It strictly presupposes... Hmm, what does it strictly presuppose? It
  presupposes very little: a God to whom requests are addressed and who is responsive
  (in some sense) to them. It doesn''t strictly presuppose mutability unless God''s
  responsiveness is construed as temporal change. It doesn''t strictly presuppose
  that God lacks omniscience. So the good answer says the practice is underdetermined;
  it fits a mutable-God theology and also an immutable-God theology where prayer is
  a divinely ordained means of bringing about good and of aligning the pray-er''s
  will, and where God''s foreknowledge includes the prayer. The apparent inconsistency
  arises only if you add a hidden premise: that asking for X makes sense only if the
  one asked can change their mind in light of the request. That premise is questionable.


  Also "immutable" can mean not changing in being/character/will, but still eternally
  willing that certain things happen through prayer. Omniscience means God knows what
  will be requested; this doesn''t make the request otiose if the request is part
  of the causal story. Depending on the account, petitionary prayer can be like a
  child asking a parent for something—the parent may already know and have decided,
  yet the asking matters for the relationship and perhaps the parent wills the good
  partly through the asking. But the classic worry: if God is perfectly good and already
  wills the best, asking can''t make the outcome better; God would bring about the
  good anyway. Yet perhaps some goods are logically available only through free requests
  (e.g., a relationship, or a good that includes the praying as an exercise of trust),
  so God wills them conditionally upon prayer.


