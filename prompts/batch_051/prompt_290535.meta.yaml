  Heterophenomenology''s core: In studying consciousness, the scientist should treat
  the subject''s reports (spoken or written) as data — as a text — and interpret the
  text using the intentional stance: attribute to the subject a set of beliefs, desires,
  and experiences that would make sense of the reports, while remaining neutral about
  whether those experiences actually exist as the subject (or anyone) thinks. The
  reports are "the subject''s heterophenomenological world" — a world of items the
  subject believes in. Objectivity comes from the fact that the text can be fixed
  and shared; interpretation proceeds by standard methods. The method is supposed
  to be neutral about the existence and nature of the experiences, neither granting
  infallible first-person authority nor eliminating the experiences.


  The argument for it: (1) Consciousness is studied through reports because only the
  subject has "access" to the qualitative states; but first-person authority is suspect
  (subjects can be wrong, confabulate, etc.). (2) Treating reports as a text to interpret,
  not as incorrigible testimony, gives a common object for science. (3) This remains
  agnostic about the underlying nature, so it doesn''t beg questions against physicalism
  or dualism.


