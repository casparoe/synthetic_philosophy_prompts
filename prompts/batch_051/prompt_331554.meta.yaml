  (1) Maya said yes: if B posits a thousand times more observers, then there are a
  thousand times more ''slots'' in which your particular stream of experience could
  have been instantiated, so your existence is a thousand times more likely under
  B. That''s just standard self-indication reasoning, she said — existence is evidence
  for more observers.


  (2) Tom pushed back: both theories entail that someone with your exact evidence
  exists, so the observation ''someone with this evidence exists'' has probability
  one under both. Adding a trillion identical copies of your evidence doesn''t make
  your evidence more likely; it just multiplies duplicates after the fact. He said
  this is why SSA, not SIA, is the right principle: reason as if you''re randomly
  sampled from the observers in your reference class, in which case neither theory
  gets favored.


