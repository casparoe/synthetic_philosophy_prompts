  but in the cosmological case there is no prior moment where you might have failed
  to be included; under both theories you were never a possible ticket in the losing
  pool. The right analogy is two sealed rooms, one with one person and one with a
  thousand, and you wake up as one person in one room: the room with more people doesn''t
  make the fact that you woke up as someone more likely.


