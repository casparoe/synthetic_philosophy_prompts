  particular historical sequence can lock in an outcome that was not uniquely favoured
  by the current environment, so that a rerun of history under identical selection
  pressures could have settled into a different and equally stable arrangement. The
  weak version says only that history matters in explaining how a system got where
  it is, which seems uncontroversial and, frankly, close to the sort of ordinary historical
  causation I knew as a scientist.


