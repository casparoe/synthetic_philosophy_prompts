  A consumer-welfare regulator is designing a decision support system for households
  choosing among subscription contracts (insurance plans, energy tariffs, mobile phone
  plans). The regulator''s stated goal is to maximize each household''s welfare as
  the household itself would define it: it wants to help people get what they would
  choose if they were fully informed and free from momentary distortions, not what
  a paternalist thinks is good for them.


  Here is the proposed mechanism.


  Each year the regulator collects a household''s complete choice history in the relevant
  market: every plan selected, every switch, every default accepted without action,
  and every active comparison made on choice screens. From this history it infers
  a utility function using the Generalized Axiom of Revealed Preference. If the choice
  history is consistent with GARP, the regulator constructs a utility function that
  rationalizes the choices, scores every available contract against it, and automatically
  enrolls the household in the highest-scoring contract. If the history violates GARP
  beyond a critical level, as measured by Afriat''s efficiency index falling below
  a set threshold, the household is classified as noisy; noisy households receive
  no personalized scoring and are assigned a population-average default contract instead.


  Once per year a household may submit a sworn self-statement of preferences, for
  instance a full ranking of every available contract. The self-statement is used
  instead of the choice-inferred utility function for scoring, but only if the household''s
  choice history is not classified as noisy. The regulator''s rationale is that a
  household whose choices are consistent has shown that stated preferences and choices
  can at least be made to cohere, whereas a household whose choices are systematically
  inconsistent cannot be expected to know or state a stable welfare criterion; treating
  its self-report as authoritative would just replace one unreliable signal with another.


  Walk through how this system would behave in practice. What does it incentivize
  for sophisticated and unsophisticated households? How will firms design menus, defaults,
  and comparison screens in response? What will happen to households whose preferences
  are context-dependent, constructed during choice, or changing over time? Where is
  the system gamed first, and which failure modes are fixable without abandoning the
  whole scheme?


  Throughout your analysis, separate what is technically settled — for example, what
  GARP and the Afriat index can and cannot guarantee about the rationalizability of
  choice data — from what is genuinely contested in behavioral welfare economics,
  such as whether violations of GARP constitute welfare-relevant mistakes, whether
  self-reports have standing as evidence of welfare, and whether a utility function
  legitimately reconstructed from choices deserves authority over the chooser. Do
  not present a contested view as the consensus among experts."


