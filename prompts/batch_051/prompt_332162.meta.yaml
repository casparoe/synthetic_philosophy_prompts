  Prompt draft:


  "You are a microeconomic theorist who works on revealed preference and behavioral
  welfare economics. Think carefully before answering, and begin by brainstorming
  the relevant incentives and failure modes before committing to an evaluation.


  A proposal is being considered for a consumer-welfare regulator in a market for
  subscription services (insurance, phone plans, energy tariffs). The regulator''s
  stated aim is to maximize each consumer''s welfare as the consumer themselves would
  define it, rather than paternalistically imposing an external conception of welfare.


  The mechanism is as follows:


  1. Each year, the regulator collects the consumer''s full history of choices among
  offers in the relevant market — plans selected, switches, defaults accepted, and
  any active choices made on comparison screens.

  2. It runs an algorithm based on the Generalized Axiom of Revealed Preference (GARP)
  to infer a utility function from those choices. Where the choices satisfy GARP,
  the regulator constructs a utility function that rationalizes them and uses it to
  score every available plan, then defaults the consumer into the highest-scoring
  plan.

  3. If the choices violate GARP by more than a fixed critical level (Afriat''s efficiency
  index below a threshold), the consumer is classified as ''noisy.'' Noisy consumers
  are not given a personalized recommendation; they are assigned a population-average
  default plan.

  4. Once per year, a consumer may file a sworn self-statement of preferences (''my
  true ranking of plans is...''). A self-statement overrides the choice-based inference
  for scoring purposes only if the consumer''s choice history does not violate GARP
  beyond the threshold. The rationale for this asymmetry: an inconsistent chooser''s
  self-statement is presumed less trustworthy than a consistent chooser''s, because
  the stated preferences might not predict their actual choices, while a consistent
  chooser''s self-statement is treated as a more accurate expression of their welfare
  than the choices they happen to face.


  Walk through how this system would actually behave. What does it incentivize for
  consumers with different levels of sophistication, for firms that design the menus
  and comparison screens, and for the regulator itself? Where is it gamed first, and
  how? What happens to consumers whose preferences are changing, constructed, or context-dependent?
  In answering, separate what is technically settled (e.g., what GARP can guarantee
  about rationalizability) from what is genuinely contested in behavioral welfare
  economics (e.g., whether choice inconsistency shows welfare-relevant noise, whether
  stated preferences have standing). Do not present a contested position as the consensus
  among experts."


