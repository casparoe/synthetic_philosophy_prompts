  I have been tasked with building a Bayesian model for a project on [something concrete],
  and for the first time I have had to actually commit to specifying priors rather
  than treating them as placeholders. Reading E.T. Jaynes''s paper "Prior Probabilities"
  has convinced me that the usual practice of taking flat or vague priors is hopeless,
  but I have found myself wanting more from his positive proposal than I think the
  paper actually provides. Jaynes argues, if I understand him correctly, that a prior
  should be fixed by the symmetries of the problem: if the problem is invariant under
  a transformation group, the prior should be the one left invariant by that group,
  and he treats the resulting assignments as uniquely rational. But I keep noticing
  a problem I have not seen him address directly. Suppose a problem has a natural
