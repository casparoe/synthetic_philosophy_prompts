  I’ve been reading the Chuan Xi Lu, the collection of Wang Yangming’s conversations
  and letters, and I’ve found myself adopting something from his doctrine of the unity
  of knowledge and action as a rule for evaluating other people, and maybe for myself.
  There is a passage where an interlocutor objects that plenty of people know they
  should treat their parents with care but fail to do it. Wang’s reply, as the translation
  I’ve been reading renders it, is roughly that this is not knowledge at all: it is
  something the person has heard and can repeat, but if the behavior does not follow,
  the knowledge itself is incomplete or unreal. I don’t have the exact wording in
  front of me, but that is the shape of the claim. Since reading that, I have been
  using a version of it as a shortcut. When someone claims a moral or political commitment—say
  that they believe they should reduce their consumption, or that they regard some
  group as equals—and their behavior over time seems persistently and avoidably out
  of line with it, I don’t just think they are weak-willed; I discount the claim that
  they really hold the belief in any truth-tracking sense. When it is me, I take the
  same stance: I don’t let myself claim to really know something is wrong unless I
  can point to something the knowledge is doing in my choices.


  The question is whether this heuristic is defensible, or whether it is a way of
  smuggling perfectionism and uncharitable mind-reading into my everyday judgment.
  I can see that failure to act might come from akrasia, competing values, fear, lack
  of opportunity, or structural constraints, none of which necessarily mean the person
  lacks the relevant belief. But Wang’s point seems to be that all of those are themselves
  signs that the person has not fully united the knowledge with their actual pattern
  of tending toward action. Under what conditions is lack of action good evidence
  that a person does not genuinely know or believe? Is there a defensible version
  of the rule that keeps the insight without turning every lapse into a verdict about
  insincerity? And is it more defensible as a first-person practice than as a third-person
  attribution? I would like the answer to lay out the possible versions of the rule,
  where each version fails or succeeds, and whether the passage I am drawing it from
  actually supports my heuristic rather than a much narrower claim about moral education.


