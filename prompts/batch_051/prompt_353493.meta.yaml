  Let me formulate the commitments:


  1. Everyday conventions (queueing, tipping, sidewalk rules) are morally binding
  only when they function as implicit agreements — people rely on them and you''ve
  participated in the local practice.

  2. Because of that, visitors who don''t know or haven''t taken part in a local convention
  shouldn''t be blamed; you can''t be bound by an agreement you never made. (Maybe
  "blaming tourists for not tipping in countries with included service is misplaced")

  3. But I also think everyone has a duty to learn the major money-related conventions
  of a place before traveling (e.g. tipping in the US), because the stakes are high
  for workers, and ignorance isn''t an excuse when you could easily find out.

  4. Tipping in US sit-down restaurants is obligatory: servers are paid a subminimum
  wage on the legal assumption that tips make up the difference; not tipping doesn''t
  just break a convention, it leaves someone underpaid.

  5. Jaywalking against a light on an empty street is fine: traffic rules are for
  safety, and when the risk they guard against is absent, following them is fetishism.

  6. Queue-jumping is wrong even if the line is short and no one objects, because
  queues are fragile cooperative practices: they only work because people follow them
  without recalculating case by case.


  Also maybe:

  7. I don''t think all conventions deserve this treatment — some are harmful or pointless,
  and people should be free to flout them (e.g., dress codes or handshake norms) as
