  apply to traffic too? If everyone jaywalked at empty streets, maybe no harm? Actually
  if everyone jaywalks only when empty, no collisions. But jaywalking at night with
  unseen cars is risk; if truly empty, no harm. The distinction: jaywalking rule is
  a coordination/safety rule with a threshold trigger; queueing is constitutive of
  fair distribution. But is queue-jumping at a tiny line with no one caring harmful?
  It might not delay anyone if line has only one person and you jump... wait if there''s
  a queue and you jump to front, everyone behind is delayed. If line tiny and nobody
  cares, still each is delayed. Could be negligible harm, but not zero. The tension:
  the asker uses case-by-case reasoning for jaywalking but not for queueing. A plausible
  answer: the pair is in moderate tension unless you can show queue-jumping always
  imposes a nonzero distributional harm whereas empty-street jaywalking imposes none;
  the practice-fragility rationale might be doing more work than needed and overgeneralizes
