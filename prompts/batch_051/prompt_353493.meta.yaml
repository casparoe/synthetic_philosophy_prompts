  ---


  I moved to the US last year from a country where service is included and queueing
  is basically a religion, and I''m writing up my views on everyday conventions for
  a social philosophy class. Could you act as the philosopher and check my set of
  commitments for consistency before I present? I want to know which pairs really
  pull against each other, which only seem to, and what the cheapest fix would be
  if I had to give something up. Please rank the tensions, don''t just list everything
  as equally problematic.


  Here''s what I think I hold:


  1. Conventions like queueing, tipping, walking on the right, etc. bind me only insofar
  as I''ve actually participated in them and others rely on my participation — an
  implicit-agreement picture.


  2. So newcomers and tourists are off the hook for local conventions they haven''t
  joined; you can''t be bound by an agreement you never made.


  3. But I also think anyone traveling somewhere has a real duty to learn the financial
  conventions ahead of time (tipping culture especially), because getting those wrong
  harms workers, and "I didn''t know" doesn''t excuse avoidable harm when the info
  is a two-minute search away.


  4. Tipping 15-20% at a US sit-down restaurant is strictly obligatory, and it''s
  not mainly about politeness: servers are legally paid a subminimum wage on the assumption
  that tips make up the difference, so stiffing them leaves them underpaid.


  5. Jaywalking against the light on an empty street at 2am is completely fine. Traffic
  rules are there to prevent collisions; when the risk is absent, treating the rule
  as sacred is rule-fetishism.


  6. Queue-jumping is wrong even when the line is tiny and nobody seems to care, because
  queues are fragile cooperative practices: they only keep working because people
  follow them without recalculating the costs and benefits each time.


  7. Not every convention deserves that respect — if a convention is pointless or
  harmful (weird dress codes, standing for no reason, whatever), people are free to
  flout it as long as they don''t hurt anyone.


  Start with a quick brainstorm on how these fit together, then give me the audit.
  Oh and if some of these are ambiguous between a moral rule and a social-norm rule,
  point that out because I think I''m blurring exactly that.


