  given a criterion that is non-transitive; but within the BSC, "same species" is
  an equivalence relation... Actually under BSC, species are defined by reproductive
  isolation; in a ring, A and E are reproductively isolated, so they''re different
  species; but B is connected to both... that''s the paradox. The standard resolution:
  the populations around the ring are not all one species because the criterion isn''t
