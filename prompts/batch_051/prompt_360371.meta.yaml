  Species argument draft:


  (1) A species is a lineage of populations that actually or potentially interbreed
  and are reproductively isolated from other such lineages (the biological species
  concept).

  (2) In a ring species, populations A and B interbreed, B and C interbreed, ...,
  but the end populations A and E do not interbreed when they meet.

  (3) If interbreeding is the criterion, then A and B are one species, B and C are
  one species, and so on, but A and E are different species.

  (4) Being "the same species" must be transitive: if X and Y are the same species
  and Y and Z are the same species, then X and Z are the same species.

  (5) So the biological species concept gives a contradiction in ring species: A is
  the same species as E (by the chain) and not the same species as E (by interbreeding
  failure).

  (6) Therefore the biological species concept is false as a general account of species.


