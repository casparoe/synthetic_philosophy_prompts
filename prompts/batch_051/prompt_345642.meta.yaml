  "I''m a PhD student in political science working on electoral system design, and
  I keep returning to a structural parallel I can''t decide about. Plurality/FPTP
  takes a distribution of first-preference votes and reports a single winner: the
  entire shape of the preference distribution is collapsed into one occupant of one
  seat, and the losing mass is simply dropped from any descriptive summary. Proportional
  representation, by contrast — especially list systems with low thresholds — tries
  to represent the distribution itself, preserving the proportions of support as seat
  shares. This looks to me formally like the difference between reporting a point
  estimate (maximum likelihood or posterior mode) and reporting the full distribution
  (the posterior, or at least its credible intervals): one summarizes location while
  discarding spread, multimodality, and tail mass; the other carries most of that
  information forward into the decision. Are these the same trade-off — between compactness
  and information loss, between decision and description — or is my analogy doing
  too much? In particular, I''d like to know: (a) what, exactly, corresponds to wasted
  votes, strategic voting, Duvergerian pressure toward two parties, and threshold
  effects on the PR side; and (b) what, if anything, breaks the analogy, e.g., the
  fact that a distribution is a probability measure while a vote share distribution
  is a vector of revealed preferences, or the fact that the point estimate usually
  doesn''t reframe which region of parameter space the ''losing'' probability mass
  ultimately supports. Is this a real structural identity, a loose but useful analogy,
  or a pattern-match I should drop?"


