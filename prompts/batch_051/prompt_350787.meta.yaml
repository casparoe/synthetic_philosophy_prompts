  As a philosopher working on the history and philosophy of science, I want to explore
  a counterfactual about how teleological explanation might have fared. Aristotle
  taught that a complete explanation of a change or a thing requires four causes:
  the material, the formal, the efficient, and the final. By the middle of the seventeenth
  century, leading figures in the new science were largely expelling final causes
  from natural philosophy, in part because appeal to purposes in nature seemed to
  invite appeals to God''s inscrutable plans and to block mechanical, force-based
  explanations. Suppose, however, that around 1660 the main scientific societies of
  Europe had adopted an explicit two-track explanatory norm: for inanimate bodies,
  only material and efficient causes may be invoked; for living things, final causes
  may be invoked, but only of a restricted kind — a final cause is admissible if it
  identifies a stable, observable tendency of an organism or part of an organism toward
  its own survival, maintenance, or reproduction, and not if it invokes the purposes
  of God, the cosmos, or some designing intelligence. Assume the norm is enforced
  through the societies'' journals and disputes for at least a century.


