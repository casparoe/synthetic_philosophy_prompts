  better than chance at answering the question, then as the group gets large the majority
  is essentially certain to be right. So if you believe the average person has at
  least a 51 percent chance on this, the big poll beats the experts. Andre said the
  theorem is doing no work here, because its assumptions are false. First, voters
  aren''t equally competent: most are guessing, some are below chance on a technical
  question like this, and a few are genuinely informed. The theorem he remembers assumes
  every voter has the same independent probability above one half. Caleb pushed back
  that unequal competence isn''t actually fatal: by the law of large numbers, the
  share of the crowd voting correctly converges to the average competence, so if the
  average voter is above one half the majority still becomes nearly certain as the
  group grows. You''d need to claim the mean voter is worse than a coin flip, which
  he didn''t think Andre believed.


