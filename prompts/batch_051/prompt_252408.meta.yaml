  Important distinctions in the literature:

  - Integrity as a virtue vs. integrity as a structural/instrumental value. Bernard
  Williams on integrity and consequentialism (the "George the chemist" cases). Integrity:
  sticking to one''s deepest projects; can conflict with impartial morality. There''s
  also the "integrity objection" to utilitarianism. Incorruptibility often close to
  integrity.


  - "Corruption" as institutional concept (corruption of office, fiduciary betrayal)
  vs. personal moral corruption. Dennis Thompson on institutional corruption perhaps.
  But no need to cite.


  - The Socratic/Stoic idea of the just person who cannot be harmed/corrupted; the
  "incorruptible" as a classic ideal. Cato, etc.


  - "Incorruptible" as unbribable. "A person of incorruptible integrity."


  - Is being incorruptible always good? Argument: incorruptibility in service of a
  bad cause is bad; rigid adherence can be obstinacy; someone could be incorruptibly
  committed to an evil ideology. Conversely, virtue ethicists might say genuine incorruptibility
  is a virtue and cannot be wholly bad because it involves phronesis, but that''s
  contested: could have the virtue of "constancy" yet misdirected? Actually an Aristotelian
  virtue is inextricable from goods.


  - Susan Wolf''s "moral saints" — but that''s moral saint, not incorruptibility.


  - The distinction between being incorruptible and being untempted/insensible; Kant''s
  "worthiness to be happy" no.


