  ---


  I just came from a long argument with a friend about whether being "incorruptible"
  is always something to admire, and much of the dispute turned out to be cross-talk:
  we each meant something different by the word, and we each reached for a different
  paradigm case. I would like to turn that mess into a handout for an applied ethics
  discussion section. Please write a decision tree that takes someone from an initial,
  untheoretical view on this topic to one of several named positions on the question:
  what is it to be uncorruptible, and is being uncorruptible always good?


  Build the tree from the logical space of possible answers rather than from a list
  of labels. Use the following branch nodes, in roughly this order, and phrase each
  node as a concrete question or a short case-based claim that a student can answer
  without already knowing which position it leads to:


  1. Whether someone counts as incorruptible in virtue of what actually happens (she
  never takes the bribe, never sells out) or in virtue of what explains that outcome.
  Anchor this with two cases: a person who has never taken a bribe because she has
  never been offered one, and a person who refuses bribes only because she is terrified
  of being caught.


  2. Whether the value of a person''s incorruptibility comes from the object or cause
  to which she is faithful, or from the sheer fact of unswerving adherence. Anchor
  this with two cases: the punctilious mid-level official in a repressive regime whose
  refusal to take bribes makes the apparatus run more reliably, and the judge who
  cannot be bought but treats the vulnerable with contempt.


  3. Whether incorruptibility is compatible with bad judgment and ordinary vices —
  in particular, whether an unbribable legislator whose refusal to compromise amounts
  to self-righteous obstruction is still admirable in at least one respect.


  4. Whether the primary bearer of the property is the individual''s character or
  the institutional setting (auditing, rotating offices, adequate salaries, separation
  of powers) that would produce the same behavior from most people placed in it.


  Each leaf should carry a name for the position, given in ordinary descriptive terms
  rather than by appeal to particular authors, and one sentence stating the most awkward
  commitment the position must accept about at least one of the anchor cases. At least
  the following positions should appear as leaves, or be explicitly noted where the
  tree cannot cleanly separate them: (a) the virtue-theoretic view that genuine incorruptibility
  is a stable excellence of character and is good whenever it is genuine; (b) the
  value-neutral structural view that incorruptibility is a formal property of the
  will and its goodness depends entirely on what it is attached to; (c) the consequentialist
  view that the trait is good only insofar as it reliably produces good outcomes;
  (d) the institutionalist view that what we call an individual''s incorruptibility
  is largely a misattribution of the features of well-designed institutions; (e) the
  skeptic''s view that most alleged incorruptibility is merely lack of exposure or
  fear of consequences.


  First set out the questions and the combinations of answers they allow, then locate
  these positions in that space. Any combination of answers that is logically consistent
  but hard to inhabit should be marked and briefly diagnosed: is it empty because
  the resulting view is incoherent, unattractive, or simply unexplored? Flag any pair
  of leaves that the tree cannot really distinguish, rather than papering over their
  overlap. Keep the instrument to three or four branch questions and no more than
  eight leaves, so it fits on a single page. Do not include bibliographies, citations,
  or appeals to named books and articles; the students should be sorted by what they
  believe, not by what they have read.


