  Draft prompt (type 2, objectivity in history):


  "I have been thinking about a problem in the theory of history and I have come up
  with a notion I call ''narrative torque.'' Here is the idea. Suppose two scrupulous
  historians are given the same finite stock of established, source-certified individual
  facts about some event—say, the fall of a government—none of which either disputes.
  One writes a tragedy, the other writes a farce or a story of blind institutional
  drift; they select, weight, and sequence the same facts differently. My claim is
  that the resulting narratives differ not only stylistically but in their rational
  force: they make a competent reader licensed to draw different further inferences,
  for example about responsibility, inevitability, or what would have happened under
  small perturbations. I want to say that those inferential differences are the ''torque''
  of the narrative arrangement, and that torque can be spoken of as something measurable
  in principle—the set of counterfactual judgments and responsibility attributions
  a narrative deflects a reader toward, even while every atomic fact in it stays true.
  Is this a real distinction, or just a metaphor for what historians like Hayden White
  call emplotment? Has someone already worked it out more carefully under another
  name, and if so, how does my version differ? And where does it break—for instance,
  does the idea of a neutral, pre-narrative stock of facts smuggle in the very objectivism
  that White and Carr warned against? I would appreciate a charitable but candid assessment:
  what does the concept get right, and where does it stop being coherent or distinctive?"


  That''s solid. It includes aspects: same facts, emplotment, counterfactuals, responsibility
