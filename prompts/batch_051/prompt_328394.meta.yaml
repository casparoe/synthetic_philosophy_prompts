  The move is this: people say a climate model is just a weather forecast run further
  out, and since your local forecast is no good after ten days or so, the twenty-first-century
  projections from the big climate models can''t be treated as decision-relevant either.
  So I want an audit of that analogy, as careful as you can make it.


