  what you''re using the output for). Then go through the disanalogies. I especially
  want to know: is the difference between weather and climate a difference in the
  target itself or just in how we use the models? What does an ensemble of climate
  models actually tell you, given that the models share a lot of code and assumptions
  and aren''t independent samples of anything? And what would ''robustness'' mean
  for a projection if the models aren''t independent? Finally, say which disanalogies
  matter for the skeptical conclusion and which are beside the point, and whether
