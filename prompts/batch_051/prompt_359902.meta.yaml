  pointed rather than just magic.


  Idea: "Imagine a reliable, widely available ''experience preview'' service. It does
  not simulate an outcome — it temporarily and reversibly installs the core experience
  and the associated evaluative changes, with two features: (1) the effects are guaranteed
  to fully reverse, returning you to your prior preference structure; (2) you retain
  vivid declarative memories of what it was like and of what you wanted during the
  preview, but those memories are ''cool'' — they do not carry their old motivational
  force." This injects the "you can remember what you wanted without wanting it now"
  structure, which is the crux: the pre-preview self still can''t use the post-preview
  self''s utilities, but now it has more information.


