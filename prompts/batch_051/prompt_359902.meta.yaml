  The domain: Transformative experience (L.A. Paul). Key ideas:

  - Epistemically transformative: you cannot know what it will be like until you have
  it.

  - Personally transformative: it changes what you care about / your values, so the
  pre-experience self can''t evaluate the outcome by its current standards.

  - Rational decision theory struggles: standard expected value requires knowing outcomes
  and utilities, but both are inaccessible.

  - Paul''s conclusion: decision to have a child can''t be made wholly rationally
  on the basis of first-personal knowledge; it''s a leap.

  - The "authenticity" problem: even if you could have the experience hypothetically
  and then decide, the person deciding after the experience has different values.


