  I understand a request, it really seems that the content of the request — a symbolic
  matter — is what does the work. If the claim is that the meaning of a message never
  exerts pressure on the substrate, then my own reasoning seems to be epiphenomenal
  in a way that undermines itself: the very fact that I am giving reasons would be
  a story the substrate tells without the reasons having anything to do with it. So
  I am torn between a theory that makes excellent sense and an intuition that appears
  to be the condition of taking my own reasoning seriously.


  Present both sides at their strongest and give me a negotiated verdict. What would
  it take for the intuition to be the thing that goes — that is, what kind of debunking
  explanation would show that the apparent downward push of symbols is an artifact
  of how I model high levels? What would it take for the theory to be the thing that
  goes or gets amended — for example, is there a respectable notion of downward causation,
  or of different levels of explanation being incommensurable, that would let symbols
  genuinely push without violating ball-level closure? Or is there a reading on which
  both survive, and if so, what exactly does ''push'' mean on that reading? I don''t
  want a party line; I want to know which move is least costly and why.


