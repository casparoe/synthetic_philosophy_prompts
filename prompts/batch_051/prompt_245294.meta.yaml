  I keep returning to a thought experiment that feels like it exposes a fault line
  in how I think about mind and mechanism. Imagine a frictionless pool table the size
  of a room, covered with thousands of small magnetic balls — call them simmballs
  — that slide and collide. Because of their magnetism, some of them stick together
  into clusters, and the clusters themselves slide, collide, and sometimes merge or
  split. Now suppose the table is large enough and the simmballs numerous enough that
  these clusters form stable higher-level structures. Some of those structures behave
  like symbols: one cluster''s shape reliably tends to produce another cluster, the
  way one token in a computation produces another. Eventually there is a structure
  that behaves like a self — it has a model of its table-world, states of wanting,
  deciding, acting. At the low level, everything that happens is ball-by-ball physics:
  each simmball''s motion is fixed by local forces, and there is no extra push from
  the cluster as a whole. At the high level, though, it is impossible not to describe
  the clusters as doing things: the symbol for danger causes the self to swerve, a
  remembered plan sends the clusters in a new direction.


  The theory I find compelling is bottom-up physical causal closure: the high-level
  patterns are real but not additional causes; talk of symbols pushing balls is just
  a useful compression of ball-level dynamics. This theory has the virtues of simplicity,
  unification with physics, and a clear answer to every causal question: the substrate
  always runs the show.


