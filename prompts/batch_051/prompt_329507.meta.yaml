  mechanics assigns each outcome a probability equal to the squared amplitude of its
  branch. What is that probability a probability of, and why those numbers rather
  than equal weights across branches? There are by now well-developed families of
  answers. Some treatments try to derive the Born weights from decision theory, arguing
  that a rational agent who knows she will branch should assign credences to her successors
  in proportion to squared amplitude, on pain of being exploitable. Others locate
  the probability in self-locating uncertainty: before a measurement you are uncertain
  about which future branch contains the successor you will find yourself in, and
  the squared amplitude gives the right epistemic weight. Others treat the weights
  as a primitive measure over branches and deny that they are chances at all; still
  others conclude that probability talk is an illusion or a practical artifact. Each
  family of answers has well-known objections: the decision-theoretic derivations
  are accused of smuggling the Born rule into their rationality axioms; the self-locating
  accounts are accused of presupposing a fact about which branch is "you" that the
