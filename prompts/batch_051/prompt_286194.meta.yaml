  Potential prompt text:


  "I have adopted a standing rule about how I form and defend beliefs concerning the
  self, and I would like an assessment of whether it is defensible rather than a bias
  dressed up as a rule. The rule is this: whenever a line of thought would depend
  on the premise that I am directly acquainted with a substantial, continuing, non-representational
  self behind my thoughts and choices, I set that premise aside. Instead, I retranslate
  the apparent datum as a fact about the surface of a self-model: I treat it as evidence
  of how my self-representation presents things, and not as evidence of what there
  is. My reasons come from the self-model theory of subjectivity associated with Thomas
  Metzinger: the conscious self is best understood as a phenomenal self-model, and
  that model is transparent, meaning that the modelling process itself cannot be introspectively
  recognised as modelling. The theory predicts that the self will seem to be immediately
  given rather than constructed, which I take to undermine the evidential value of
  that seeming. I use this rule most often when I read arguments from the alleged
  direct evidence for a Cartesian ego, and when I catch myself treating the felt authorship
  of a decision as evidence for free will or for a substantial mental agent. Last
  week, for instance, a friend argued that we must be more than our brains because
  each of us directly knows herself as a single persisting subject; under my policy
  I dismissed this as a report about the transparency of the self-model rather than
