  "Over the last few months I''ve been trying to get clear on what the rationalist-sphere
  actually inherited from Herbert Simon, and I keep running into a muddle I''d love
  a careful take on. On the one hand there''s the usual bounded rationality idea:
  real agents don''t have the cognitive capacity to maximize over all options, so
  in practice they run a search process, evaluate options sequentially, and stop once
  they hit an option that clears some aspiration threshold — this is satisficing.
  On the other hand there''s the move economists and some AI folks make, where you
  keep the optimization framework but fold the costs of search, information, or attention
  into the objective function, so the agent is still maximizing expected utility,
  just over an expanded choice set that includes computational actions. I used to
  think these were basically the same idea plus different marketing. But now I think
  they''re not: satisficing seems to treat the stopping rule as psychologically real
  but not itself chosen by a higher-order optimization, while the bounded-optimizer
  story treats every rule, including stopping rules, as the solution to a larger maximization
  problem. Is that distinction as sharp as I think? Which one gives the better account
  of things like default effects, or the fact that people seem to use lexicographic
  heuristics like take-the-best instead of weighing cues, or just the general feeling
  that agents ''satisfice'' rather than optimize? I''m less interested in who has
  the better label and more in which picture actually does more explanatory work when
  you push on real cases."


