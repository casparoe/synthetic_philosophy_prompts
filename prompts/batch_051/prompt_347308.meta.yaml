  "Thomson''s lamp switches at t = 1 - 1/2^n for each n >= 1, starting on at t = 0.
  The lamp''s state is therefore on at t=0, off at 1/2, on at 3/4, off at 7/8, and
  in general alternates. The switching times tend to 1, so all infinitely many toggles
  take place by t = 1. Which state is the lamp in at t = 1? Its state at t = 1 must
  be the limit of its states as t approaches 1 from below, since the lamp is a discrete
  physical system whose later state is determined by its earlier states. But the sequence
  of states just before t = 1 does not converge: it alternates between on and off
  forever. Therefore the state at t = 1 is undefined. Since a real lamp cannot have
  an undefined state, but the description requires that it does, Thomson''s lamp is
  physically impossible. The paradox thus shows that an infinite sequence of toggles
  cannot be completed in a finite time."


