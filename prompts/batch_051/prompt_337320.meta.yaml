  observable unit in the speech stream; it is an abstraction justified by minimal
  pairs, complementary distribution, and morphophonemic alternation. Thus you cannot
  read a phonemic analysis off the script. When we describe a letter as standing for
  a phoneme, we are comparing one abstraction (the script''s units) with another abstraction
