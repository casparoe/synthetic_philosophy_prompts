  a tool sorted patients ahead of him. The design committee I joined has been split
  for nearly a year between two camps, and I need to understand the structure of the
  standoff before I vote.


  One camp argues the system should be an expected-value maximizer: it should assign
  each candidate a predicted survival probability and a quality-adjusted benefit,
  then allocate to maximize aggregate expected benefit, with transparency about the
  trade-offs. They say every alternative is just this same calculus performed in the
  dark—when a deontologist grants a scarce bed to a patient with a better prognosis,
  they are already weighing lives, only less consistently. The other camp argues that
  the system should be built around inviolable constraints: it must not sacrifice
  one patient as a means to a better aggregate, must not override individual consent
  or established triage rules, and may optimize only within limits that respect each
  person''s rights. They reply that the first camp has trained a machine to do what
  no clinician may do—choose to let one person die because the arithmetic says two
  will live.


