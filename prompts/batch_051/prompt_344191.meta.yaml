  You are a legal philosopher with particular expertise in the rule of law and in
  statutory or contractual interpretation. Think carefully before writing, and begin
  by mapping the competing considerations.


  The following clause appears in the disciplinary regulations of a university:


  "Section 9. A student shall not be subjected to any academic penalty except in accordance
  with a published regulation in force at the time of the conduct complained of, and
  that regulation shall set out with reasonable specificity both the conduct that
  is prohibited and the penalty that may be imposed."


  The regulations were drafted long before automated decision tools existed. Last
