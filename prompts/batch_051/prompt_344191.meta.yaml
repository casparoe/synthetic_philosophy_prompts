  The existing published regulation prohibits "submitting work produced wholly or
  partly by another person as one''s own." The tool analyses months of a student''s
  keystroke timing, cursor movements, editing pauses, and login times from the university''s
  learning-management system. It returns a score; when the score passes a threshold,
  the Academic Integrity Office charges the student with contract cheating. The vendor
  treats the model and the threshold as trade secrets, and the model is updated frequently
  without notice. A student was penalised on this basis. She wrote her own essay but
  was flagged because she worked in short bursts at unusual hours; she cannot discover
  exactly which features triggered the score, and the university''s only explanation
  is that the tool "operationalises" the published contract-cheating regulation.


  Write an essay on whether the use of the tool in her case violates Section 9. Argue
  the question from each of the following approaches: (a) the plain words of the clause;
  (b) the purpose of the clause; (c) what the drafters of the clause would most plausibly
  have said if asked; and (d) what a reasonable student reading the clause would believe
  they were promised. Then say which approach should be decisive here and why, and
  reach a clear verdict. If no single approach is fully coherent, say so and explain
  what that reveals about the clause and its ideal.


  Please also state how confident you are in your overall verdict and identify the
  single point in your argument you are least sure of.


