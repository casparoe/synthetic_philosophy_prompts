  Now the content.


  Dennett''s counterfeit people idea (from his 2023 Atlantic essay, but I won''t cite):
  He argues that the most serious danger of AI is not superintelligent takeover or
  even job loss, but the creation of "counterfeit people"—digital agents that pass
  as real human beings, such as deepfakes, LLM chatbots, and computational replicas
  of deceased or absent people. His concern: they are parasitic on real people (they
  exploit our evolved social responses, our tendency to treat a voice/face as a person),
  and they corrode trust, because once convincing fakes circulate, we can no longer
  treat communications as evidence of a real person with a real reputation, accountability,
  and ability to suffer. Key nuance: he is not primarily worried about whether these
  systems are conscious; he explicitly puts consciousness aside (or thinks that''s
  a distraction) and says even a non-conscious counterfeit can cause enormous harm.
  Also, he thinks the problem is not that AI is too smart but that it can exploit
  human gullibility. Another nuance: he might say we should mark AI outputs, make
  deepfakes illegal, etc. But that''s policy, not the focus.


  Black Mirror "Be Right Back": Martha loses her boyfriend Ash in a car accident.
  At the funeral, a friend signs her up for a service that scrapes Ash''s social media
  and messages to create a digital simulation. She first interacts via chat, then
  calls with a voice clone, then receives an android-like physical replica that looks
  and acts (mostly) like Ash. Martha knows it is not him, but she grows attached,
  then frustrated by its gaps: the replica is "too agreeable," "too available," lacks
  the rough edges, contradictions, and demands of the real person; it is a flattened,
  idealized projection from the curated trace. She ultimately can''t treat it as Ash
  and does not destroy it; in the ending, she keeps the android in the attic, letting
  her daughter visit it, while she has moved on (or not fully). The episode explores
  grief, authenticity, and whether a copy built from data can substitute for a person.


  A reading through Dennett: the Ash replica is a perfect example of a counterfeit
  person: it passes as the deceased boyfriend because it captures his verbal style
  and likeness, it exploits Martha''s grief and her evolved/learned responses to Ash''s
  face/voice/chat. The harm is not that the replica is conscious or malicious; it
  is that it creates a counterfeit intimacy and corrodes Martha''s ability to relate
  to the real loss; the existence of a near-convincing fake warps her grief, substitutes
  an echo for a person with a real point of view. Dennett''s argument would predict
  that once she cannot trust the messages as coming from Ash, the relationship becomes
  hollow and even harmful. The episode dramatizes the asymmetry: the replica is parasitic
  on Ash''s actual digital footprint and on Martha''s projection. It complicates Dennett:
  Martha is a willing consumer, not a dupe; she knows it isn''t Ash, yet still uses
  it; the counterfeit''s power survives the belief in its genuineness. That is an
  important complication: Dennett worries about deception and false belief, but "Be
  Right Back" suggests that counterfeit people can exert a hold even when the user
  is not deceived—the social-emotional machinery still runs. Also, the episode pushes
  the question beyond passing as a person: Ash''s "counterfeit" falls short in ways
  that reveal what a real person is—someone with needs, unpredictability, resistance
  to the other''s wishes. Dennett might say that''s exactly what makes the counterfeit
  dangerous: it is not a person, but it is good enough to occupy the social slot.
  The work might add to Dennett''s debate: it shows the grief-work/attachment dimension,
  the danger of "counterfeit people" to the bereaved themselves, not just public trust;
  and it shows that deception isn''t necessary for harm—voluntary, half-believed use
  is enough.


