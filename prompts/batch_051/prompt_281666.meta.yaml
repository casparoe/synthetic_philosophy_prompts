  I am a high school student in a semester-long elective on philosophy and the mind,
  and my class has been going in circles on Molyneux''s problem for weeks now. The
  question, as it was first presented to us, is deceptively simple: if a person born
  blind could distinguish a cube from a sphere by touch alone, and then gained sight,
  would they be able to tell which was which by vision before touching them? We read
  that the question was first put to Locke in the late seventeenth century, and that
  early reports of patients after cataract surgery suggested newly sighted people
  could not immediately identify shapes they had previously known only by touch. We
  also read about a modern study that followed children in India who were born with
  dense congenital cataracts and received surgery years later; right after surgery
  they could not reliably match the shapes they saw to the shapes they had felt, though
  some improved after practice. Despite all of us agreeing on what these reports say,
  the class has split into three camps that have not moved. One camp treats the experimental
  results as proof that Molyneux''s answer is simply no. A second camp argues that
  the experiments cannot answer the question as originally posed, because a newly
