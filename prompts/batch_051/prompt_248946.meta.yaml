  Domain: Responsibility gaps for autonomous systems.


  Commitments (I''ll write as a professor):


  1. I''m a compatibilist about moral responsibility in general: an agent is morally
  responsible for an outcome if it had the capacity to recognize the relevant reasons
  and a fair opportunity to act on them, regardless of whether determinism is true.

  2. No current or near-term AI system meets that bar, so no such system is a morally
  responsible agent.

  3. When a self-driving car or autonomous weapons system causes a serious harm, and
  the designers, operators, and users all behaved reasonably (nobody was negligent
  or reckless), we face a genuine responsibility gap: the harm is attributable to
  the system''s operation, but there is no human to whom full moral blame attaches.

  4. Yet I think the legal system can and should respond to such harms through strict
  liability and organizational penalties, and that doing so is not merely pragmatic;
  it can express a genuine moral judgment about the organization''s failure to ensure
  safety.

  5. I also think that the notion of a responsibility gap is overblown as a moral
  problem: tort law''s main functions are compensation and deterrence, not tracking
  moral desert, so the absence of a culpable individual doesn''t threaten the justifiability
  of liability.

  6. At the same time, I believe we should refuse to deploy systems whose behavior
  cannot be explained by anyone, and that manufacturers have a moral duty to build
  systems that keep a human "in the loop" for high-stakes decisions.

  7. And I think it is wrong to punish or resent an organization in the way we punish
  persons; corporations are not the kind of thing that can suffer the reactive attitudes.


