  Student answer:


  "Nozick''s tracking theory is an externalist account: whether you know p doesn''t
  depend on whether you can cite good reasons, but on whether your belief tracks the
  truth. The four conditions are: (1) p is true; (2) S believes that p; (3) if p were
  false, then S would not believe that p — this is the safety condition; and (4) if
  p were true, then S would believe that p — the adherence condition. Under these
  conditions, knowledge is true belief whose formation is counterfactually responsive
  to p''s truth-value.


  Nozick relativizes the conditions to a method because the same belief could be formed
  in different ways, and our verdicts about knowledge can depend on how the belief
  was produced. The method belongs to the justification condition of the analysis:
  S counts as knowing only if S''s method of belief formation is part of what S is
  justified in using. In method-relative form, the counterfactual conditions become:
  (3*) if p were false and S used M to arrive at a belief about p, then S would not
  believe via M that p, and (4*) if p were true and S used M, then S would believe
  via M that p.


  A good example is the stopped clock. Smith looks at a clock that stopped exactly
  twenty-four hours ago, so it happens to read the correct time, and he forms the
  true belief that it''s 12:00. Intuitively he doesn''t know it''s 12:00. The tracking
  account explains this. In the nearby worlds where the time is different — say 12:05
  — the clock still reads 12:00, so Smith would go on believing it''s 12:00. Thus
  condition (3) is not satisfied, and he fails to know. Condition (4) does not help
  him here because, although he would believe truly in some worlds, those nearby worlds
  with the stuck clock reading a different time are the ones that matter. This nicely
  shows that knowledge requires that your belief wouldn''t just happen to be right.


  On closure: Nozick''s account implies that knowledge is not closed under known entailment,
  and that is a feature he bit the bullet on. Suppose Smith sees a zebra in the zoo
  and comes to know there''s a zebra in the pen. He can then deduce that the animal
  is not a cleverly painted mule. But on the tracking theory, he does not know this
  entailed proposition. If the animal were a cleverly painted mule, he would still
  believe it was not a cleverly painted mule, because he would believe it was a zebra.
  So the sensitivity condition fails for the entailed belief, even though it is satisfied
  for the belief that there''s a zebra. Hence knowledge fails to transmit along a
  known entailment, and Nozick accepts that."


