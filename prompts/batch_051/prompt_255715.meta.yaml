  ---


  I am drafting a short philosophical self-portrait about parenting and children''s
  rights, and before I show it to anyone I want to know how well the pieces actually
  fit together. Here are the commitments I would sign:


  1. Parenting should be licensed, for adoptive and biological parents alike: the
  state may screen prospective parents, and a child should not be placed with, or
  left with, adults who could not pass the screening.


  2. The principal justification for licensing is not merely the prevention of abuse.
  It is the child''s right to an open future—the interest children have in reaching
  adulthood with a broad enough range of life options that they, rather than their
  upbringing, can settle what kind of life to lead.


  3. The right to an open future is not violated whenever a child''s options are narrowed.
  It is violated only when options are narrowed in a way that damages the child''s
  eventual capacity to reflect on, revise, and choose among ways of life. A child
  raised with particular values has fewer options but may still have the right fully
  honored.


  4. Parents may raise children in demanding and value-laden forms of life—strict
  religious practice, intensive training in one art or sport, maintenance of a small
  language—provided the child remains able, in time, to step back from that form of
  life and leave it.


  5. But the state may and should intervene when a parental decision will predictably
  lock a child out of whole domains of adult life, such as refusing all schooling,
  socially isolating the child, or refusing clearly needed medical care.


  6. Licensing should enforce only a good-enough floor: no abuse or serious neglect,
  adequate material and emotional provision, and a demonstrated disposition to treat
  the child as a separate person. Licensing should not scrutinize the parents'' values,
  and it need not certify that a home will maximize the child''s future range of options.


  7. For an adult, the bare fact that a choice forecloses future options never counts
  against it: vows, lifelong marriages, irreversible medical choices, and similar
  self-binding commitments can be perfectly reasonable.


