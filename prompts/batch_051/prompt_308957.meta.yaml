  Let''s form prompt:


  Writer: I''m a PhD student in philosophy of law, teaching an upper-level undergraduate
  seminar on evidence and proof. I have 16 students, one 75-minute session. I want
  an activity that makes them feel the pull of the "blue bus" problem: that a high
  statistical probability can fail to justify a verdict, especially in tort law, but
  that the same probability feels different in betting contexts. The activity should
  be built around Thomson''s article, "Liability and Individualized Evidence." Rather
  than quote it (I am paraphrasing), one passage argues roughly this: if the only
  evidence linking the defendant to a particular plaintiff''s injury is a base rate
  — e.g., that the defendant''s buses made up 80 percent of the vehicles that could
  have caused the harm — then the evidence is not "individualized" and cannot ground
  the verdict, no matter how high the probability. But Thomson''s use of the word
  individualization remains difficult to pin down: is it about causal specificity,
  ruled-out alternatives, sensitivity to the particular defendant''s conduct, or something
  else? The activity should make students inhabit the distinction before it is named:
  they should first encounter the 80-percent statistic in a setting where they are
  comfortable acting on it, then be brought to a case where the same number is all
  the plaintiff has, and find themselves unable to act. I want the activity to force
  them to choose, not just express attitudes. Include a warm-up, a structured small-group
  exercise with roles, a decision procedure, and a debrief.


