  because they live under that state; judged by the victor''s power and will; "we
  all are responsible for how we are governed."

  3. Moral guilt: for deeds I as an individual commit, including political and military
  actions; judged by one''s own conscience; absolute, not merely political.

  4. Metaphysical guilt: solidarity between human beings as human beings; for being
  alive when others are murdered; "if I do not risk my life to prevent the murder
  of others... I feel guilty in a way not adequately conceivable legally, politically,
  or morally"; jurisdiction solely before God (before God?).


