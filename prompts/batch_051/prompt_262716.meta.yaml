  A colleague in my epistemology seminar defends conciliationism about peer disagreement,
  and after a while I built an argument against it that now worries me because it
  seems to prove too much. I''ll write it out.


  (1) Conciliationism: when you learn that an epistemic peer — someone about as smart,
  as well-informed, and as reliable as you on the question at hand — disagrees with
  you, you should significantly reduce confidence in your answer, typically by "splitting
  the difference" between your view and theirs.


  (2) Take the higher-order question: how should one respond to peer disagreement?
  Conciliationism is one answer; another is steadfastness, the view that one may rationally
  retain one''s confidence even in the face of a peer''s disagreement (because one''s
  first-order reasons can legitimately outweigh the fact of disagreement).


