  A person who is no more confident in conciliationism than in its negation cannot
  rationally guide her responses to further disagreements by it; she would be following
  a rule she believes is probably false.


  (7) So a conciliationist, by her own lights, either should not be a conciliationist,
  or should stop applying the rule in real cases.


  (8) Yet conciliationism was introduced precisely as a live, usable answer to real
  disagreement. If it can be a rational position at all, it should survive being applied
