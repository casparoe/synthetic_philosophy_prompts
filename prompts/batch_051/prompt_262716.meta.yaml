  However, there may be an internal tension: conciliationism says "on learning of
  peer disagreement, each should significantly reduce confidence." If the higher-order
  peer is steadfast, then by conciliationism you reduce confidence in conciliationism.
  But would the steadfast peer also be required to reduce? No, she''s steadfast; the
  conciliationist can apply her own rule unilaterally. So after split, conciliationist
