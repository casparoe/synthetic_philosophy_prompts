  then after a proper split the conciliationist should now have roughly 0.5 confidence
  in conciliationism, and no more than 0.5 confidence in steadfastness? Actually split
  difference could yield 0.5 each. So steps:


  (5) The result is that the conciliationist now assigns roughly equal-or-less-than-even
  credence to conciliationism — in any case, they do not believe it.


