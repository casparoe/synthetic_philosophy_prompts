  too anodyne, and say briefly why you rejected them; then write the polished document.


  The two positions need to be characterized carefully, not as caricatures. The adaptationist
  maintains that for a heritable trait that is complex, costly, or statistically improbable,
  natural selection is the best default explanation, and that a plausible reverse-engineering
  account of how the trait could have promoted fitness, together with evidence about
  its current function, justifies at least a provisional adaptive conclusion. The
  critic, in the spirit of the spandrels paper, maintains that organisms are integrated
  systems under multiple constraints—body plan conservatism, allometric growth, pleiotropic
  side effects, drift and historical accident—so many traits will be nonadaptive byproducts
  or fixed without selection, and an adaptive explanation must clear a positive evidentiary
  burden rather than win by default. The two sides agree on common ancestry, on the
  importance of natural selection as a real cause, and on the existence of genuine
  adaptations; they disagree about burden of proof, about whether current utility
  is evidence of historical origin, about how to individuate traits, and about when
  a functional narrative counts as an explanation. I want the finished document to
  be one both camps could sign without embarrassment—not a list of platitudes.


