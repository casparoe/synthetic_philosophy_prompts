  I am an undergraduate in a philosophy of biology seminar on adaptation and constraint.
  We have spent the past few weeks on the adaptationist program and the spandrels
  challenge, and my term project asks me to stage an adversarial collaboration between
  a committed adaptationist and a committed defender of the Gould–Lewontin critique,
