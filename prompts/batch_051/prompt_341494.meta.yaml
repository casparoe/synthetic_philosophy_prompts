  to leave a "gap" — the story may need to mark that the final step isn''t fully explainable
  without ceasing to be free; over-explaining makes it mechanical.

  6. The creator''s knowledge/foreknowledge: if the creator knew and still created,
  the series must decide how to handle the creator''s responsibility; a fall narrative
  often implies self-limitation or risk-taking in creation (God voluntarily makes
  beings that can fail). The procedure should force the writers to state what the
  creator knew and accepted, not leave it implicit.

  7. Consequences: does the fall produce genuine evil, or just error/difference? To
  be a fall, not a misunderstanding, it has to involve willing something the angel
  knows (or ought to know) is contrary to the good. But "knows it''s evil and does
  it anyway" violates the guise of the good. This is the core paradox.


