  The problem: an angel is created wholly good by an omniscient, omnipotent, wholly
  good creator. The angel has free will (libertarian). There is no prior evil, no
  temptation, no ignorance, no inherited corruption, no scarcity. How could such a
  being choose to rebel? Candidate conditions:

  1. The angel must have a genuine range of alternatives (could have refrained), else
  it''s not a fall.

  2. The choice must be intelligible through some perceived good — agents always act
  under the guise of the good, so pure "choosing evil for its own sake" is incoherent
  (or at least needs explanation). The angel must represent the rebellion as achieving
  something good (autonomy, equality, refusal of subordination, love misdirected,
  envy as perceived injustice).

  3. There must be something that makes the good seem greater than it is — the angel
  must have limited knowledge or at least not full appreciation of consequences; but
  classic angel intellects are often depicted as knowing—this tension must be handled.
  A procedure could ask whether the draft gives the character a misleading appearance
  of good at the moment of choice, and whether it smuggles in decay.

  4. The choice can''t be caused by an external evil (a "demon seed," a corrupting
  artifact, another already-fallen tempter) unless that''s the series'' chosen story;
  if the first fall is the first evil, there''s no tempter. The procedure should flag
  whether the draft sneaks in a prior evil to do the work.

