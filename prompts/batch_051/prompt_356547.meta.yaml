  ---


  "So next week I''m presenting at my local rationalist meetup, and I want to go in
  prepared for the Q&A. The talk is my attempt to split the difference on voting ethics.
  My thesis, roughly: there are two incompatible frames people use, and most of the
  fighting comes from pretending only one is real. Frame 1: your vote is a tiny intervention
  with an expected value that is technically positive but absurdly small—dominated
  by the chance of being the deciding vote, which is basically zero in any electorate
  over a few hundred thousand. Frame 2: your vote is a cheap expressive act that says
  something about what you value, and the act can be good or bad for reasons that
  have nothing to do with the margin of victory. I''m defending the claim that both
  frames are legitimate but apply at different scales: in a race that''s plausibly
  close, the intervention frame is the honest one and you should take lesser-evil
  reasoning seriously; in a race that''s a blowout, the expressive frame is doing
  all the work and ''lesser evil'' is mostly a way to launder a purity preference
  into consequentialist language. The messy part I want to defend is the boundary:
  there''s no threshold where the frames switch, and most real elections fall in a
  zone where you''re partly rational and partly rationalizing.


  The audience: it''s a rationalist-adjacent group, maybe twelve people. Three or
  four are committed consequentialists/EA types who''ve said before that voting is
  a rounding error and if you enjoy it fine but don''t pretend it''s a duty. Two are
  something like Kantians or at least deontologists who think ''vote your conscience''
  survives all this and that universalizability matters more than marginal impact.
  One person is basically a Brennan-style epistocrat who thinks most people shouldn''t
  vote at all because they''re ignorant. And there''s a rotating cast of agnostics
  who will pounce on anything that smells like a motte-and-bailey.


  I want the objections in roughly the order they''ll actually come, phrased the way
  those different people would phrase them (the EA types will talk expected value
  and opportunity costs, the Kantians will talk about willing the maxim, the epistocrat
  will talk about information). For each: what I should concede, what I should hold,
  and where the reply is weakest. And please include the objection I''m most hoping
  nobody asks—the one that actually damages the two-frames view rather than just one
  side of it."


