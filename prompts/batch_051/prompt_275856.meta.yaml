  Standard NU reading of Omelas: The original is a direct challenge to utilitarianism;
  a NU says the arrangement is impermissible because no amount of positive happiness
  can justify the child''s suffering. But what if the child''s suffering is necessary
  to prevent even greater suffering (not just to produce happiness)? For a NU, preventing
  greater suffering is the only thing that could potentially justify inflicting suffering.
  This is a genuinely contested issue: does NU permit trade-offs between different
  instances of suffering (e.g., inflicting small suffering on one to prevent huge
  suffering for many)? Some say yes (a "threshold" or "lexical but still sensitive"
  view), others say no (absolute deontological constraint against inflicting suffering,
  or "negative utilitarianism is not consequentialism across persons"). This is in
  the weeds and meaningful.


