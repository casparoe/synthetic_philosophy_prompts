  You are an expert on inverse reinforcement learning (IRL), on the formal pitfalls
  of inferring preferences from behavior, and on philosophical debates about value
  alignment. Think carefully before writing: first brainstorm at least two candidate
  game mechanics for the session, and only then commit to the one whose rules best
  force the insight to arise from what participants do.


  I teach a graduate seminar in the philosophy of AI and value alignment. Fourteen
  students, one 90-minute session. Design a classroom game called (working title)
  "What Did She Want?" that makes participants feel the force of a central IRL dilemma:
  observed behavior underdetermines the preferences we attribute to a person, so inferring
  human values from behavior is never a neutral read-off — it always smuggles in assumptions
  about the agent''s rationality, risk attitude, discounting, planning horizon, or
  the space of possible rewards. I want them to discover this in play, not have it
  announced.


  The activity should be runnable as follows. In a first phase, a few participants
  act as humans making choices in small, concrete decision scenarios — a short route
  through a simple grid, selecting tasks in a lab, choosing snacks at a counter, allocating
  an hour among activities. The rest of the class works in teams as "reward engineers"
  who observe only the choices and must infer the chooser''s underlying preferences.
  Make the first scenario feel mechanical and solvable, then let it break down: two
  or more genuinely different preference profiles should fit the same observed choices
  equally well, and the teams should be forced to defend rival inferences in front
  of each other. In a second phase, change exactly one modeling assumption without
  changing the observed behavior — for example, the assumed choice rule (a maximum-entropy
  soft-optimality rule with a temperature parameter versus risk-sensitive or worst-case
  reasoning), the agent''s discount rate, or the allowed hypothesis space for rewards
  — and structure the phase so the teams experience their earlier inference flipping
  or becoming unrecoverable. Use invented scenarios rather than real datasets; paraphrase
  rather than quoting anything from the literature; include no citations, bibliographies,
  or readings.


  Specify the full design: group sizes and roles, the exact instructions you would
  give participants aloud, all materials needed, a minute-by-minute timeline filling
  90 minutes, and a scoring rule that produces real engagement without using real
  money. Then provide a debrief that maps specific moments in the activity onto specific
  IRL concepts — soft-optimality / maximum-entropy inference, the temperature or rationality
  parameter, discounting, reward degeneracy or unidentifiability, and the choice of
  reward hypothesis space. The debrief should be explicit about which of these claims
  are settled (for example, that a single observed policy is compatible with many
  reward functions, or that the inferred reward changes when the assumed rationality
  model changes) and which are genuinely contested among researchers (for example,
  whether we should infer the person''s actual preferences, expressed values, or idealized
  preferences; whether the soft-optimality assumption is a good default for human
  behavior). Do not present contested positions as consensus.


  Also tell me what will predictably go wrong the first time I run it — at least three
  failure modes with concrete recovery moves (for instance, teams refusing to commit
  to an inference, too much slack in the scenarios making everything fit, or one team
  trying to copy another team''s answer) — and end with an honest note about what
  the game cannot reproduce about real-world preference inference. I suspect it will
  have to do with the tidiness of small discrete scenarios versus the high-dimensional,
  temporally extended, partly non-consequentialist character of actual human behavior,
  but tell me whatever the real limitation is and what I should supply in framing
  to compensate.


  After the main design and debrief, give me a structured summary as a JSON object
  with exactly these fields and nothing else appended after it:


  - "materials": list of strings.

  - "roles": list of strings naming each role and whom it is assigned to.

  - "phases": array of objects, each with "name" (string), "duration_min" (number),
  "what_participants_do" (string), "facilitator_watch_for" (string), and "mapping_to_idea"
