  I am a novelist. I work on roughly one literary novel every two to three years,
  and my method has always depended on a single originating image or situation arriving
  more or less whole; I then spend months assembling a book around it. I want to replace
  that dependence on waiting with a deliberate procedure, and I think Douglas Hofstadter''s
  knob-twiddling account of creativity is the right place to start. As I understand
  the account, a creative act is rarely the production of something from nothing:
  one takes an existing theme, plot-shape, scene, image, or conceptual skeleton, identifies
  the dimensions along which it could vary — its "knobs" — and turns some of those
  knobs, one or several at a time, to generate variations that remain recognisably
  related to the source while becoming something worth writing. The crux of the skill
  lies in choosing which knobs are load-bearing and how far each can be turned before
  the result becomes either a reproduction or an unrelated new idea.


  I want you to turn that account into a reusable procedure I can run as a working
  novelist. Fix the following constraints: I have about a week between drafts; I cannot
  do external research during that week; I have no assistant; and before I draft anything
  my editor must approve a one-page outline, so the procedure must produce something
  that can be shown to a sceptical editor, not just private inspiration.


  Give me a procedure in the form of a checklist or decision tree in words. For each
  step, tell me the question to ask, what counts as a sufficient answer before moving
  on, and where the step should stop me or send me back. The conceptual work is in
  the translation: keep what the knob-twiddling account actually claims, make it usable
  by a novelist who has no interest in the underlying theory, and mark explicitly
  the points where the procedure is really a judgement call dressed up as a method
  — for example, deciding whether two variations are still variations of the same
  theme, or whether a knob has been turned too far.


