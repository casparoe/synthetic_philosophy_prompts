  Let me design the argument carefully.


  Futarchy: in a futarchy, citizens vote on a welfare metric (e.g., GDP, life satisfaction),
  and prediction markets tell us which policies maximize that metric. Decision markets
  are conditional markets that predict the value of the metric given that a policy
  is or isn''t enacted. Policies are selected by the market''s conditional expectation.


  The argument that proves too much could be:


  1. If prediction markets are the best institutional tool for identifying which policies
  maximize a chosen metric M, then they should be used to choose all policies, including
  the rules that govern prediction markets themselves.

  2. If market participants can trade on the outcomes of decisions about market governance,
  then the market will also be predicting the results of its own rules — allowing
  manipulation: a wealthy trader can move prices in favor of a rule that enriches
  the trader, and the price move is both a prediction and a bidding outcome. Self-fulfilling
  prophecy / reflexive manipulation.

  3. So applying futarchy to its own institutions creates a regress: each market''s
  rules would need to be chosen by a higher-order market, whose rules need another
  market, and so on.

  4. Therefore futarchy either unjustifiably exempts its own institutional rules from
  market selection or collapses into infinite regress; either way it''s self-undermining.


