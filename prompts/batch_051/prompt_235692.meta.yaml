  on a metric, not prediction markets on any decentralized outcome; applying it to
  market governance might not require prediction of its own prices but of the metric
  under alternative rule-sets, which avoids direct self-reference/reflexivity. The
  regress could be blocked because the metric is voted on by citizens at a constitutional
  level and is not itself chosen by markets; the selection of governance rules is
  itself a policy, and can be handled by a conditional market on the metric under
  various governance rules — no infinite regress because the betting rule doesn''t
  need to be chosen by a market, it can be enacted by normal legal process with the
