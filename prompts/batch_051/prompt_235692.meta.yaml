  I like the idea of a self-undermining/regress argument: it''s naturally "proves
  too much" and in the weeds of futarchy. Let me formalize:


  Premises:

  1. Futarchy''s core principle: if there is a class of policy decisions D and a metric
  M, then D should be decided by a conditional prediction market on M under each candidate
  policy, because this aggregates dispersed information better than deliberation or
  voting.

  2. The choice of the metric M and the design of the market (the trading rules, subsidization,
  enforcement) are themselves policy decisions that affect M.

  3. By (1), those meta-decisions should themselves be decided by conditional prediction
  markets on M under candidate meta-policies.

  4. But one cannot design a market for choosing market design without already settling
  the trading rules under which that market will operate; and the market design partly
  determines what that market predicts.

  5. Thus the market for market design would have to determine its own rules, which
  either (a) reintroduces the original choice at a higher level, yielding an infinite
  hierarchy of markets, or (b) allows self-dealing: traders can trade in a way that
  changes the rules to profit them, while the price change is treated as evidence
  for the rule.

  6. Every proposed stopping point — a constitutional vote on M and market rules —
  violates (1), because it reserves an important policy decision for non-market procedures.

  7. Therefore futarchy is either incomplete (it cannot specify its own foundation
  by its own principle) or incoherent (the foundation would be self-referential).
  So its principle proves too much and should be rejected.


  This is a classic bootstrapping/reflexivity objection. The obvious replies: premise
  1 is too broad — futarchy need not claim markets should choose their own institutional
  design, because the market mechanism is constitutionally fixed like other institutions
  (courts don''t preside over their own founding); the metric is set by voters, not
  by markets, and that''s not an arbitrary exception but the democratic input to the
  system; infinite hierarchy may actually be finite if you just make meta-level conditional
  markets under a standing constitution. There may be a subtle flaw: step 4 equivocates
  between the market as a prediction device and the market as a governance institution;
  the rules of a market are not themselves predicted by that market, they are enforced
  by outside institutions, so there''s no circularity in having a market conditional
  on two candidate designs, run under third rules that are already fixed — no need
  for it to choose its own rules. The argument treats "rules need to be chosen by
  the same method" as required, but futarchy can have non-market foundations without
  violating its principle if the principle is stated as "for policy choices within
  a constitutional framework," not "for every decision whatsoever." That''s a scope
  restriction, and premise 1''s "all policy decisions" overgeneralizes futarchy''s
  actual claim.


