  Draft:


  A friend and I spent a long evening arguing about futarchy — the proposal that citizens
  vote democratically on a measure of national welfare, and that conditional prediction
  markets then tell us which policies maximize that measure. My friend defends the
  usual version: markets for ordinary policy choices (tax rates, building programs,
  health interventions) are fine, but the choice of the metric itself and the rules
  of the markets remain constitutional matters settled by voters. I came away suspicious
  that this is a special exception that the view cannot afford, and I wrote up the
  following argument to make the point. It seems to show that futarchy either never
  really replaces deliberation or collapses into an infinite regress. That feels too
  strong, but I cannot see where the argument breaks down.


  (1) The core claim of futarchy is that any policy question should be settled by
  a conditional prediction market on the chosen metric, because the market aggregates
  dispersed information better than committees, legislatures, or expert panels do.
  (2) The design of those markets — how contracts are written, who may trade, how
  thin markets are subsidized, how long before resolution trading closes, how manipulation
  is policed — is itself a policy decision that changes the distribution of the chosen
  metric. (3) By (1), market-design questions should therefore be settled by conditional
  prediction markets on the metric under the candidate designs. (4) But a market that
  is asked to choose among candidate market designs must already be running under
  some design; its trading rules fix the information that can be reflected in its
  prices, and the outcome of the choice alters the rules under which its own contracts
  will be interpreted and settled. (5) Either the meta-market runs under rules that
  the futarchy simply takes as given — in which case a major class of policy decisions
  has been removed from market control, and (1) is false — or the meta-market is asked
  to determine its own rules, in which case its prices are partly an artifact of the
  rules being bet on and can be manipulated by traders who profit from the rule change
  itself. (6) Moving to a higher-order market does not help, since the same dilemma
  recurs at each level. (7) Therefore futarchy cannot give a market-based account
  of its own institutional foundations: the thesis either has an ad hoc exemption
  or generates a regress, and in the regress its prices lose the epistemic authority
  that the whole proposal relies on.


