  you try to become the kind of person who doesn''t try?


  Step-by-step argument that either wu-wei is impossible to cultivate or not a real
  state:


  P1. Wu-wei is a way of acting in which one does not try.

  P2. To cultivate a trait, one must intentionally act in ways that aim at producing
  it.

  P3. If one intentionally aims at producing wu-wei, one''s acting is itself a form
  of trying (trying to produce wu-wei).

  P4. But if one''s acting is a form of trying, then that acting is not wu-wei (by
  P1).

  P5. So any action aimed at producing wu-wei is not wu-wei.

  C1. Thus wu-wei cannot be produced by any intentional action.

  P6. If wu-wei cannot be produced by intentional action, then it cannot be cultivated.

  C2. Therefore wu-wei cannot be cultivated; it can only happen when one is not trying
  to produce it.

  P7. But if wu-wei can only happen when one is not trying to produce it, then any
  advice to "cultivate wu-wei" is self-defeating.

  C3. Therefore the Daoist project of cultivating wu-wei is self-defeating.


