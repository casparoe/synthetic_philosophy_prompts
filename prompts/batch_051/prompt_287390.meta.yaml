  but every premise feels true when I read it one at a time.


  (1) A famine is an event where large numbers of people starve.

  (2) People starve when they cannot command enough food — through wages, land, markets,
  rations, gifts, whatever.

  (3) What food a person can command is set by entitlements: property rights, prices,
  wages, government provision, and the rules about who may buy, sell, grow, or receive
  food.

  (4) Entitlements are human arrangements: they are made and enforced by laws, policies,
  courts, and officials.

  (5) So in any famine, who starves is determined by human arrangements.

  (6) If whether thousands of people starve is determined by human arrangements, the
  famine cannot be shrugged off as a natural disaster — it is something humans did.

  (7) And if it is something humans did, on a massive scale, then it is not merely
  a misfortune; it is a political crime.


