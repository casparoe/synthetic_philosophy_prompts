  Draft:


  "After a long argument with a friend about why promises bind, I came away convinced
  that neither of the familiar answers was quite right. He held that promises bind
  because they create expectations and reliance: once I have let you arrange your
  life around my word, I owe it to you not to upset that arrangement, and the wrongness
  of breaking the promise is essentially the wrongness of letting someone down. I
  found this insufficient, because it makes the obligation depend on how much the
  promisee happens to rely, and it has nothing to say about promises to the dead,
  or to someone who forgets, or to promises where forbearance would leave everyone
  better off. But I also don''t think promises bind merely because of their consequences,
  or merely because breaking them would undermine the practice."


  "I have been trying to work out a third view, which I have been calling the lien
  view of promising. On this view, a promise is an exercise of a normative power that
  encumbers a future act of the promisor, rather like the way a lien gives a creditor
  a legal interest in an asset I still own. When I promise you something, I transfer
  to you a claim-right over a specified performance while retaining the practical
  power to perform or not. I have not given you the act itself; I have given you a
  right in the act. That is why you, and you alone, can release me. That is why the
  obligation survives your forgetting, your non-reliance, and even your death: the
  right does not live in your psychology. And that is why breaking a promise is a
  distinct kind of wrong, closer to a normative trespass against you than to a failure
  of benevolence or a harmful lie..."


