  Draft:


  "Here is the working account I use in my philosophy of interpretation seminar, and
  I want to stress-test it against a case I have never found discussed cleanly. I
  treat a text''s meaning as authorially determined only when four conditions are
  met: (i) the author actually formed a determinate prior intention that the work
  communicate a specific content p; (ii) that intention was causally responsible for
  the relevant features of the finished text, rather than merely being a post hoc
  description of what the author hoped readers would find; (iii) the language of the
  text can bear p without semantic or syntactic distortion; and (iv) p is at least
  as natural a reading of the finished text as any rival. Now consider a case.


  A poet wrote the first half of a long poem in her twenties and published it as a
  standalone work; she intended it, and it was received as, sincere devotional verse.
  Forty years later, after a documented change in her religious commitments, she returned
  to the poem, wrote a second half that is unmistakably ironic about that same devotional
  posture, lightly revised some connective passages, and issued the two halves as
  a single continuous poem. In interviews she now says the unified poem is ironic
  through and through: the early sections are to be read as quoted material, enclosed
  by the later sections'' perspective, and the work''s meaning is the exposure of
  the devotional voice rather than the voice itself. Her notebooks after the later
  composition say the same. But the first half, as incorporated, remains almost word-for-word
  the sincere text of forty years ago; the combined work contains several passages
  that read naturally as sincere devotion, several that read naturally as parody,
  and no uncontroversial editorial signal (a preface, typographic marking, or otherwise)
  that tells the reader which register governs which stretch.


