  "I''m a software engineer, and I''ve been reading about the epistemology of disagreement
  on my own. I''d like a consistency check on the following package of views I seem
  to have ended up with:


  1. When I find out that someone who is roughly my equal in intelligence, honesty,
  and familiarity with the relevant evidence disagrees with me about a question, I
  should lower my confidence substantially — often to around 50/50 or suspend judgment.
  (I was led to this partly by Aumann''s agreement theorem, roughly: rational agents
  with common priors and common information can''t agree to disagree.)


  2. However, if I''ve actually gone through the reasoning myself and can identify
  the specific step where the other person''s argument goes wrong, then I don''t have
  to conciliate; I''m entitled to keep my original confidence.


  3. This is especially clear to me in my own work: when a respected colleague disagrees
  with me about a technical design decision and I can articulate exactly why my proposal
  handles the failure cases better, I think it would be spineless — not just practically
  unwise but epistemically wrong — to pretend I should now be 50/50.


  4. For factual and engineering questions, I believe uniqueness: given a fixed body
  of evidence and a proposition, there is exactly one maximally rational degree of
  confidence. So if two people disagree on a factual question, at most one of them
  is being maximally rational.


  5. But I also think two equally smart, equally informed engineers can rationally
  disagree about, say, whether a particular codebase is well-architected, or whether
  one framework is "better" than another for a project. I don''t see how to be a relativist
  about that.


  6. I think the standards of rationality should be domain-neutral: I don''t want
  a special "engineers get to be steadfast" rule that I wouldn''t accept for, say,
  two doctors disagreeing about a diagnosis.


  7. Finally, I believe strong conciliationism has an unacceptable consequence: since
  expert disagreement is pervasive, taking it at full strength would force us to suspend
  judgment on nearly everything, and that can''t be right."


