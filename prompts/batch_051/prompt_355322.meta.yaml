  "pleasures" I take myself to be picking out something real in the world, not just
  applying a family-resemblance label. (5) I also think some qualitative differences
  among pleasures matter for well-being beyond their effect on intensity and duration—for
  example, that the pleasure of cruelty is less choiceworthy than a child''s innocent
  delight, even if both were equally intense and long. (Need be careful: This is a
  value judgment that may conflict with hedonism? Maybe this is genuine tension: if
