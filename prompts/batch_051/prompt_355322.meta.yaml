  Precise prompt:


  I''m trying to nail down a coherent hedonist position and need an audit of the following
  set of commitments. Let me lay them out as I would defend them to a colleague.


  (1) Well-being consists in the balance of pleasant over unpleasant states, and pleasantness
  is the only intrinsic good-making qualitative feature of experience.

  (2) Bentham''s framework is substantially right: the value of a pleasant episode
  is a function of its intensity, duration, certainty, and propinquity, and these
  can be combined in an overall estimate; no further qualitative property of the pleasure
  needs to be added.

  (3) Yet I don''t think there is a phenomenally specific "hedonic tone" shared by
  all pleasures: the pleasure of cool water when thirsty, a well-timed joke, recognizing
  a proof, and Schadenfreude do not feel the same in the way blue things look the
  same. I hold that tastes and pleasures come in radically different experiential
  kinds, and the unity of pleasure is functional/attitudinal (a state counts as pleasure
  in virtue of being liked, desired, or playing a certain role) rather than a common
  felt quality.

