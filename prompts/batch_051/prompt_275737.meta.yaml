  ---


  I''m a PhD student in political theory, and I''ve been going around in circles about
  something that came up while arguing with friends about COVID border controls and
  lockdowns. In the first months of the pandemic, democratic governments closed borders
  almost overnight, told people to stay home, shut down restaurants and gyms, and
  imposed curfews, often with minimal public debate and on the basis of epidemiological
  models that everyone admitted were uncertain. Most people I know, including me,
  treated these as not just legal but legitimate: the state was right to do them,
  and we owed the measures a certain degree of cooperation and acceptance. Now imagine
  the same government, in a normal year, proposing to close restaurants and gyms for
  three months, require a permit to leave home, and keep out travelers from countries
  with high road-traffic death rates, all to save a comparable number of lives. We
  would call that authoritarian—legal only in a thin procedural sense, but obviously
  illegitimate, something we would resist even if the numbers worked out. The only
  clear difference is that one case is declared an emergency, with its attendant urgency
  and uncertainty. So my question is whether "it''s an emergency" can carry that much
  normative weight, or whether the difference between the two cases is mostly a psychological
  fact about how fear changes what we tolerate.


  It gets messier when I look at how we evaluate these measures afterwards. A lockdown
  that plausibly saved many lives tends to be treated as having been the right call
  even when the government skipped normal procedures or leaned on models that later
  turned out to be questionable, while a lockdown that was too broad or poorly targeted
  is treated as a scandal. Ordinary state action doesn''t work that way: we don''t
  say an illegal police search was a legitimate act because it happened to find the
  criminal, and we don''t call a wrong verdict right in hindsight because it worked
  out well. So the deeper asymmetry is between our usual ex ante, procedure-focused
  standard of legitimacy and the retrospective, outcome-focused standard we seem to
  reach for with emergency measures. Is that shift ever justified, or is it a rationalization?


