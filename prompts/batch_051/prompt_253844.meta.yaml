  Let me think of genuine in-the-weeds requirements for a theory of moral uncertainty:


  1. It must be able to guide action even when the rival first-order theories are
  not commensurable — e.g., a deontological theory that ranks actions ordinally (this
  act is forbidden, that is permissible) and a consequentialist theory that assigns
  cardinal values. A theory can''t just require a common unit; it must specify how
  to compare across them or explain why comparison is impossible. (The intertheoretic
  comparison problem.)


  2. It must handle the representation/cardinalization problem: choice-worthiness
  functions are only unique up to positive affine transformations; different normalizations
  (e.g., normalizing by variance, or range) change the verdicts. So the theory must
  either pick a normalization on principle or show that the choice doesn''t depend
  on it.


  3. It must handle incomparability: if two theories use different value scales and
  the theory of moral uncertainty says they''re incomparable, it should still sometimes
  give guidance (dominance reasoning).


  4. It must not collapse into a first-order theory wearing a probabilistic costume.
  E.g., a theory that says "maximize expected choice-worthiness" with the normalization
  done in a way that always favors consequentialism.


  5. It must handle the "right reasons" problem: some care morally about whether you
  made the right choice for the right reasons, not just which act; a deontologist
  might think that acting with a "close enough" expected-value mindset is itself wrong.
  So the theory must say what the object of assessment is: acts, or credences-over-theories
  plus acts, or something else.


  6. It must handle higher-order uncertainty (uncertainty about the correct theory
  of moral uncertainty) without infinite regress: it should either give a fixed-point
  or show that first-order verdicts are robust.


  7. It must avoid being "fanatical" in the wrong way: if one credible theory says
  an act is infinitely wrong (or wrong with astronomical severity) and others say
  it''s fine, the theory must say how small probabilities of enormous wrongs trade
  off against near-certain moderate wrongs.


  8. It must reduce to expected utility theory when all the rival theories happen
  to converge on a shared cardinal scale (e.g., the decision is just factual uncertainty
  about consequences). The requirement that it generalize, not contradict, ordinary
  decision theory.


  9. It must handle the case where the agent''s moral uncertainty is partly about
  the value of information — act''s expected choice-worthiness should account for
  the probability that the decision rule itself might change as they learn more (moral
  deference?).


  10. It should say something about the "no neutral ground" issue: the theorist herself
  has moral commitments, so the theory of moral uncertainty is built from within a
  moral view; requirement to be non-question-begging.


