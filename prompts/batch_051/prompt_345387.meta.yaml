  For "Motivation without evolution: why would an AI want anything?", possible two
  theories:

  1. Selectionism (teleosemantics-lite): a state counts as a genuine want only if
  it was produced by a history of selection for producing certain effects — roughly,
  wants are functions, and functions come from selection. Without an evolutionary
  or training-selection history, a machine merely has representations labelled "goals",
  not wants.

  2. Functionalism/computationalism: a state counts as a want in virtue of its current
  causal/functional role in the system''s decision-making, regardless of genealogy.
  If it reliably directs action selection toward an outcome, that''s wanting.


  Specification: Construct a case where (a) selectionism says the system genuinely
  wants X, and (b) functionalism says the system does not want X — the reverse of
  the usual direction. The usual direction: selectionist denies AI wants; functionalist
  affirms. Reverse: selectionist wants to affirm and functionalist denies, so the
  case needs a selection history but a broken functional role.


  Can this be jointly satisfiable? Yes:

  - Selection history: the goal-representation was bred/selected for through many
  iterations (e.g., evolutionary algorithm or iterated designer selection across lineages)
  because tokens with that representation caused certain behaviour in the ancestral
  environment.

  - Functional role now broken: after installation, the representation no longer actually
  influences action selection; it is causally inert or only updates a self-description
  that the system reports but never acts on. The system''s actual behaviour is controlled
  by a separate hand-coded policy.

  Selectionist: the state has the right genealogy/function (selected to play that
  role), so it is a genuine want even if currently disconnected (function can be normal,
  not necessarily always realised).

  Functionalist: the state now lacks the functional role (doesn''t guide action),
  so it isn''t a want; at best a fossil or label.


