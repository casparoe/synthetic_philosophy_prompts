  ---


  I have been collecting my own reactions to political situations in which someone
  says that the people have willed something, and I find that I have firm verdicts
  about the cases but no principle that yields all of them. I would like you to work
  out whether there is a single principle behind my verdicts, and if there is not,
  to tell me which of my verdicts it would be most rational for me to abandon. My
  tentative view is something like this: the will of the people is not a polling fact
  or a sum of individual preferences; it is the output of a recognized, binding procedure—an
  election or a referendum—in which a question is settled after open contestation
  and after the losers have had a real chance to win. But I also think no procedure
  can constitute a rights-destroying majority as the people''s will, because a measure
  that strips a group of equal standing no longer treats them as part of the people
  whose will is being expressed.


  Here are my reactions.


  1. A country held a binding referendum, with 72% turnout, on leaving a regional
  trade-and-movement bloc. The leave side won 52–48, in a campaign in which both sides
  said in advance that the result would settle the question. Within two years, as
  the costs became visible, public opinion moved to roughly 54% for staying. I believe
  the government was right to treat the 2016 result as decisive rather than pausing
  or re-running the vote in light of the later polls.


  2. A country held a referendum, honestly administered and with a similar turnout,
  on whether members of a long-established religious minority may hold national public
  office. It passed 52–48. I believe the result should not be implemented, and indeed
  I think I would hold that line even if it had passed with 70%.


  3. Reliable polling has shown 65–70% support for a decade for decriminalizing minor
  drug possession, but the two dominant parties both oppose the policy and have kept
  it off every ballot. I think the public has a legitimate grievance, and the parties
  are wrong not to enact it; but I do not think the unmet polling majority is itself
  "the will of the people," because the question has never been put through an election
  or referendum in which the policy was actually at stake.


  4. A party fought an election on a fully specified manifesto whose centerpiece was
  a sharp increase in a broad-based tax, and won a landslide. Polls taken after the
  election show a majority opposed to the tax. I believe the government has a mandate
  to pass the tax anyway, because the tax was the advertised question and the electorate
  answered it.


  5. A president, elected on a platform that never mentioned the idea, signs an executive
  order expanding a border wall program at great expense and says he is doing "what
  the people demand." Post-signing polls show 55% opposed and 38% in favor. I believe
  this is not the will of the people; it is a claim about the people with no procedure
  behind it.


  6. A constitutional court invalidates a counterterrorism law, passed by a large
  parliamentary majority and supported by 70% of respondents in polls, on the ground
  that it permits indefinite detention without charge. I do not think the court is
  thwarting the people''s will. I think the majority may be large, but it cannot will
  the elimination of the condition under which it counts as a majority of a self-governing
  people.


  7. A well-disciplined movement with support consistently around 30% stages prolonged
  highway and port blockades for an emergency climate measure, saying it represents
  "the people" against corrupt elites. I think this is false: the blockades may be
  a legitimate protest tactic, and the cause may be right, but the movement does not
  thereby express the people''s will.


  8. The case I cannot settle is this. A randomly selected citizens'' assembly of
  150 people, chosen by lot, spends six weeks hearing evidence and deliberating, and
  votes 62–38 to adopt a system of proportional representation. Public support in
  polls is only about 45%, with a large bloc undecided, and the issue was never central
  in any election. Sometimes I think the assembly''s considered vote is a better expression
  of what the people would will under decent conditions than any poll or election
  would be; sometimes I think the assembly was never authorized to decide, and so
  its vote is not the people''s will at all.


