  a cause or explanation. This is stronger, not observational.


  3. Conservation principle: the total stuff of the universe can''t be increased from
  zero. Physical conservation law.


  4. A claim about the universe as a whole: the entire universe can''t come from nothing,
  so it had a cause outside itself. This is a step beyond observation — not obviously
  licensed by generalization from within the universe.


  5. A refusal to accept brute facts: nothing (no thing) exists without an explanation
  of why it exists rather than not. This is the contingency version''s load-bearing
  reading.


