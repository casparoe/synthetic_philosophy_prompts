  the positivist affirms and the natural lawyer denies (and, where useful, the converse),
  phrased so that each side would accept the wording of its own position. Include
  at least: (i) whether a norm''s failure to meet a threshold of moral decency can
  prevent it from counting as law; (ii) whether so-called wicked legal systems are
  best understood as law-like, as failed law, or as law in a degenerate sense; (iii)
  whether the positivist''s "no necessary connection" thesis is best read as a conceptual
  claim, an interpretive recommendation, or a political stance; and (iv) what judges
  should say when a plainly evil rule has a clear social source.


  Then give the cruxes: the sub-questions whose answers would move at least one side.
  For each crux, specify a concrete test, case, or body of evidence both parties would
