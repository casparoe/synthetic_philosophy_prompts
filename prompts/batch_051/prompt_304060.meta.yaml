  than vacuous, and they should include: a shared description of the grudge-informer
  cases in which post-war German courts faced denunciations made under the Nazi regime;
  the concessions each side makes to the other''s strongest arguments; and what they
  jointly affirm about law in ordinary, well-functioning legal systems. Where an agreed
  claim might be accepted in one sense by the positivist and another by the natural
  lawyer, restate it so the two senses come apart.


  Then give a disagreements table. For each disagreement, state the exact proposition
  the positivist affirms and the natural lawyer denies, or the converse, in wording
  each side would accept for its own position. Cover at least these four disputes:
