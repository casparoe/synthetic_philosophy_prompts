  ---


  Write the joint statement that a Hart-style legal positivist and a Fuller-style
  natural lawyer could both sign after a good-faith adversarial collaboration. By
  a Hart-style legal positivist I mean someone who holds that law''s existence and
  content are settled by social facts such as enactment and official practice, not
  by moral merit. By a Fuller-style natural lawyer I mean someone who holds that law
  is a purposive enterprise with an internal standard of legality, and that a sufficiently
  lawless exercise of power fails to be law in the fullest sense.


