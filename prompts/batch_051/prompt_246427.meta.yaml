  (1) In the fire-and-cotton argument, Al-Ghazālī reasons as follows: whenever we
  have observed fire touch cotton, burning follows; but observation shows only that
  the two events occur together in succession; it never shows that the fire brings
  about the burning or that the burning could not occur without it. Therefore, since
  all we ever observe is constant conjunction, we are never entitled to assert that
  one created thing necessitates another.


  (2) Apply this very standard to the conclusion just drawn. The claim that no created
  thing ever necessitates another is itself a universal claim about what holds always
  and everywhere, including unobserved cases. But observation has only ever shown
  us, at most, particular conjunctions; it has never shown us a case of no necessary
  connection at all, let alone all cases.


  (3) By the standard stated in (1), an observation of particular conjunctions cannot
  license a universal claim about every case. Therefore the move from "I have only
  ever observed conjunctions" to "there is no necessary connection anywhere among
  created things" is invalid — it is exactly the sort of inference the first premise
  forbids.


