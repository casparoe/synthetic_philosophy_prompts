  Draft:


  I want to work through a tension I''ve never been able to resolve. On one side,
  I''m drawn to a view I first met in Edmund Burke''s Reflections on the Revolution
  in France — not as a political program, but as an account of how much knowledge
  can be stored outside individual heads. The passage that stuck with me runs something
  like this: Burke says we should be wary of allowing each person to act on his own
  private stock of reason, because that stock is small; he suggests instead that individuals
  draw on a general bank and capital accumulated by nations and ages. That idea has
  a lot of pull for me as a software engineer. I''ve watched a service survive a novel
  failure mode because of an old check nobody on the team could explain; the original
  author was gone, the docs were stale, but the check encoded a real incident. It
  was Chesterton''s fence as a deploy gate: don''t tear out a safeguard until you
  know what it was guarding. Generalizing from this, it seems like inherited rules
  and institutions might be a kind of compressed, distributed memory — a capital of
  stored justifications that no single maintainer can reconstruct from first principles.
  That''s the compelling theory.


  What clashes with it is a firm intuition I also can''t shake: an explanation is
  not the same thing as an ex post rationalization, and a rule''s usefulness to someone
  at some point is not enough to keep it. In software, requirement drift is real.
  A module can encode a decision that was correct for one user population, one scaling
  assumption, one failure profile, and be wrong now. I have a visceral sense that
  if nobody can state why a rule exists, the right move is to treat it as suspect
  — to demand a reason or remove it — not to bow to it. Otherwise "the past is a bank"
  becomes unfalsifiable: every arbitrary rule, every piece of cargo-cult ceremony,
  every embarrassing legacy constraint gets defense by default. And that seems to
  switch the burden of proof in a way I find morally and practically dangerous.


  So the question is which side should give way. Is my engineering intuition just
  a product of working in a domain where environments change fast and feedback is
  measurable, and does it therefore fail to apply to social institutions? Or is Burke''s
  "general bank" rhetoric a way of laundering path dependency and raw inheritance
  into a false halo of wisdom? Give me the strongest version of each position, then
  give me a negotiated verdict — what each side would have to concede, and whether
  there is a reading on which they are compatible. I''m less interested in which side
  you''d pick than in what would justify each move.


