  Verisimilitude/truthlikeness: Popper (1963, Conjectures and Refutations) argued
  that science pursues truth, but since we can''t claim to have the truth, we need
  a notion of being closer to the truth than a false competitor. He proposed a comparative
  definition: theory A is more truthlike than B if A''s true consequences include
  B''s true consequences and B''s false consequences include A''s false consequences
  (with proper inclusion somewhere). Problem: for false theories (which all real theories
  are on Popper''s view), this fails — Tichý (1974) and Miller (1974) showed that
  on Popper''s account no false theory is closer to truth than another (if A and B
  are both false and comparable, then they''re so trivial?). Actually the result:
  Popper''s definitions imply that one false theory can be closer to truth than another
  only if... the true content of A includes B''s true content and A''s false content
  is included in B''s false content. Tichý/Miller proved that for false theories,
  if A is closer to B''s truth? Let me recall: The result is that no false theory
  can be closer to the truth than another on Popper''s definition — more precisely,
  if B is closer to the truth than A (both false), then B must be logically stronger?
  Hmm. Miller''s and Tichý''s independent proofs showed that Popper''s qualitative
  definitions yield the result that a false theory cannot have more true content and
  less false content than another false theory — i.e., the definitions are vacuous
  for false theories. This was a major blow.


  Subsequent work: the "similarity approach" (Hilpinen, Niiniluoto, Oddie, Tichý himself)
  defines distance from truth over possible worlds using a similarity metric between
  states of affairs or constituents. The "consequence approach" was revived by Schurz
  and Weingartner with "relevant consequences" rather than all consequences. Kuipers
  has a "nomic truthlikeness" approach. The debate has become highly technical, and
  there''s disagreement about whether the notion should be a semantic one (closeness
  to a target) or an epistemic one (expected verisimilitude for theory choice).


  Why has the program stalled? Possibly because truthlikeness conflates at least three
  jobs: (1) a metaphysical/semantic measure of closeness between propositions; (2)
  an epistemic guide for preferring one theory over another given evidence; (3) a
  norm of scientific progress/realism. Different formalizations satisfy different
  desiderata. The debate might be partly about which job matters, and there may be
  an impossibility: no single measure can satisfy all plausible postulates (there
