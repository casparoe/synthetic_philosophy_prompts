  expected value as close to zero rather than as some tiny probability times a huge
  number.

  (f) Yet I think it''s fine to donate to existential-risk reduction based on exactly
  that kind of chain, because the stakes are so large.


  Where does this set come apart? Which of these are in genuine tension, which only
  seem to be, and what''s the cheapest revision?"


