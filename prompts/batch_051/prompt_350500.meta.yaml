  at least for large-stakes choices.

  (b) I reject Pascal''s mugging: a tiny probability of an arbitrarily huge payoff
  shouldn''t be allowed to swamp everything else.

  (c) I also reject Pascal''s wager as a serious argument for religious belief.

  (d) But I''m fairly sympathetic to longtermism: if there''s even a small chance
  of influencing an astronomically large number of future lives, that can dominate
  present-day altruistic priorities.

