  next-best option, that''s a strong reason to think it''s permissible, and it can''t
  be morally worse than not transacting at all.

  (b) Sweatshop labor is very often wrong even when the workers choose it and are
  better off than they would be outside the factory.

  (c) Exploitation isn''t about paying below some objective just price; it''s about
  taking unfair advantage of someone''s vulnerability.

  (d) A choice isn''t coerced just because the available alternatives are terrible,
  so the fact that a worker''s fallback is extreme poverty doesn''t by itself make
  their consent invalid.

  (e) I also think it''s wrong for a company to deliberately site factories in places
  with weak labour laws specifically because workers there are desperate enough to
  accept very low pay.

  (f) But I don''t think an individual consumer does anything wrong by buying a sweatshirt
  made in such a factory, since one purchase makes no difference and anyway the worker
  would be worse off without the order.


  Where am I actually inconsistent, where do I only look inconsistent, and what''s
  the least costly fix? Please rank the tensions rather than telling me everything
  is equally bad."


