  still could have, say, begun to reconsider, or shown a different brain signal —
  the very thing that would have triggered Black. That''s an alternative possibility,
  even if not an alternative action. So PAP can be preserved by pointing to the flicker.


  Rana: that rescue is desperate. A flicker of brain activity that Jones doesn''t
  control and that wouldn''t amount to doing anything differently can''t be the "ability
  to do otherwise" that PAP wanted. If your alternatives shrink to sub-personal events,
  you''ve given up the thing that made the principle plausible.


