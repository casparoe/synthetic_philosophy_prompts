  the Frankfurt case can''t simultaneously say "Jones has no alternatives" and "Black
  only intervenes on a signal that would reveal an alternative." If you close off
  the flicker, you have to build a deterministic mechanism into Jones, and then you''re
  no longer doing intuitive testing — you''re assuming that a determined agent is
  responsible, which is exactly what''s at issue.


