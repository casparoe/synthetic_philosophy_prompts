  The Frankfurt case in plain terms: Jones is deciding whether to shoot an official.
  Black is a neuroscientist who can detect whether Jones will decide to shoot; if
  Jones is about to decide not to shoot, Black will flip a switch and make Jones decide
  to shoot (or to want to shoot / to do it). Jones decides to shoot on his own; Black
  never intervenes. Jones is responsible; but he couldn''t have done otherwise. So
  PAP is false.


  The debate:


  Person 1 (call them Rana): The case shows that alternatives aren''t needed. Jones
  is fully responsible even though he couldn''t have avoided deciding to shoot. So
  PAP is false: responsibility doesn''t require the ability to do otherwise.


  Person 2 (call them Dev): But the case only works because you''ve built in that
  Black can detect the decision in advance, and that detection needs a prior sign
  or cause of Jones''s decision. If Jones''s decision is undetermined, the only way
  Black can guarantee the result is by intervening in every case or by tracking something
  that makes the decision inevitable. So the case just stipulates that Jones''s decision
  was causally determined, and then blames the lack of alternatives on the setup.


  Rana: even if that''s right, so what? The point is that what grounds responsibility
  is present in the actual sequence — Jones deciding from his own beliefs and desires
  — and the missing alternative is only the possibility of revealing some other inclination
  to Black. You''d be hard-pressed to say that''s what blame depends on.


