  W = Σ a_i u_i + b, with a_i not all zero, and given normalization maybe a_i positive
  if Pareto-strong. Actually the theorem requires both individual and social preferences
  satisfy vNM axioms and the Pareto condition; then the social utility function is
  a positive linear combination (affine combination) of individual utilities. If you
  use a normalization where zero point is fixed, it''s a weighted sum.


