  In GEB, Hofstadter distinguishes three levels of message:

  - Frame message: the implicit message "I am a message; decode me if you can." It''s
  carried by the very fact that there''s a structure recognized as a message (e.g.,
  a record, a string in a bottle). It''s information saying "this is a message."

  - Outer message: information that tells you how to decode the inner message; the
  implicit "I am a message in a known language/code; here''s how to interpret me."
  It''s about the decoder''s task — e.g., recognizing that the grooves on a record
  are to be decoded as sounds, or that a text is in Japanese, or the jukebox''s mechanism.

  - Inner message: the actual intended content, the message itself once decoded.


  Also in GEB there''s the "triggering" idea: the message is not fully contained in
  the object; the receiver''s interpretation brings meaning; meaning is partly in
  the decoder''s "hardware/software." The distinction: inner message is the semantic
  content; outer message is about the code/language needed to extract it; frame message
  is the meta-level message that there is a message at all.


  McLuhan''s "the medium is the message": the medium shapes and controls the scale
  and form of human association and action; content of any medium is always another
  medium; effects of media on society are about the medium itself, not the content.
  So readings:

  1. Trivial vehicle-dependence: you can''t convey an inner message without some physical/formal
  carrier, so changing the carrier changes what''s physically present. Platitude.

  2. Interpretive framing: the medium functions as part of the outer message — it
  tells you how to decode the inner message (a telephone ring vs a letter). The medium
  helps set the decoding context. This maps to Hofstadter''s outer message. Substantive
  and true if moderate.

  3. The medium carries a frame message: by being a recognizable communication technology,
  it signals "a message is here" and influences whether the message is noticed at
  all. Compatible with frame message.

  4. Strong content-independence: the social/psychological effects come from the medium,
  not from the inner content. Substantive, maybe false if taken as "content never
  matters." McLuhan''s actual claim.

  5. Strong eliminativist: there is no inner message distinct from the medium; all
  we ever have is the medium. False, or at least conflates levels.

  6. Extravagant: "what you say doesn''t matter, only how/where you say it" — false
  as universal claim.


