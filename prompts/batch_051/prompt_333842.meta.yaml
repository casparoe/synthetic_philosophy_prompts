  identifies medium with outer message — that actually presupposes a distinction between
  the outer message (how to decode) and the inner message (what is decoded), so it
  supports rather than refutes the tripartite distinction. Reading 5 would refute
  it, but is false/unmotivated. So the student''s use likely conflates readings.


