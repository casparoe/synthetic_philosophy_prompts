  Locke''s Second Treatise, Chapter V:

  - "Though the earth, and all inferior creatures, be common to all men, yet every
  man has a property in his own person: this no body has any right to but himself.
  The labour of his body, and the work of his hands, we may say, are properly his."
  — very famous.

  - "Whatsoever then he removes out of the state that nature hath provided, and left
  it in, he hath mixed his labour with, and joined to it something that is his own,
  and thereby makes it his property." — very famous (the "mixing labour" passage).

  - "He that is nourished by the acorns he picked up under an oak, or the apples he
  gathered from the trees in the wood, has certainly appropriated them to himself.
  No body can deny but the nourishment is his. I ask then, when did they begin to
  be his? when he digested? or when he ate? or when he boiled? or when he brought
  them home? or when he picked them up? And it is plain, if the first gathering made
  them not his, nothing else could. That labour put a distinction between them and
  common..." — this "acorns" passage is a bit less quoted but still known.

  - "The same law of nature, that does by this means give us property, does also bound
  that property too. ''God has given us all things richly'' (1 Tim. vi. 12) is the
  voice of reason confirmed by inspiration. But how far has he given it us? To enjoy.
  As much as any one can make use of to any advantage of life before it spoils, so
  much he may by his labour fix a property in: whatever is beyond this, is more than
  his share, and belongs to others." — spoilage proviso, fairly quoted.

  - The passage on money: "This I dare boldly affirm, That the same rule of propriety,
  (viz.) that every man should have as much as he could make use of, would hold still
  in the world, without straitening any body; since there is land enough in the world
