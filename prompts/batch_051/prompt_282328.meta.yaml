  possible children can reasonably be expected to have a better life than the others,
  then there is at least a reason -- perhaps even an obligation -- to select that
  child. This is sometimes called procreative beneficence. Alongside it there is a
  ''liberal'' version of eugenics, which says genetic selection and enhancement are
  acceptable when the state stays neutral and the choices are left to parents, rather
  than imposed in the name of improving the population.


