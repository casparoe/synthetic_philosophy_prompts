  - The retroactivity problem: nullum crimen, nulla poena sine lege; ex post facto
  law. But note: the postwar tribunals partly avoided the harshest version of this
  by grounding crimes in prior treaty/custom; the real debate is whether those sources
  were sufficient and foreseeable enough.

  - The selectivity/tu quoque problem: the court''s standing; "clean hands" objection;
  that even a perfectly legal charge is tainted if one-sided. This is not the same
  as retroactivity: a fully prospective, evenhanded code could still be applied selectively;
  a fully evenhanded application of a retroactive code would still violate legality.

  - The legitimacy/constitution problem: composition of the court by victors, no neutral
  judge.

  - The relation between them: both are facets of the rule of law, but retroactivity
  offends against generality over time (law''s temporality), selectivity offends against
  generality over persons (law''s impartiality). The two are jointly necessary for
  the "victors'' justice" charge but each is independently objectionable.


