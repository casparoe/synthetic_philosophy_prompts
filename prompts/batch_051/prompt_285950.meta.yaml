  ---


  I''m a software engineer by training, so I keep trying to refactor my moral intuitions
  into one rule instead of a pile of special cases. The place where this keeps failing
  is reparations for historical injustice. I''ve written down my verdicts on seven
  cases, and they feel almost right but not quite consistent. I want to know whether
  there is a single principle — or at most a small set — that captures them, and if
  there isn''t, which verdict I should overturn.


  Here are the cases.


  1. The forged deed. In 1921 a county bank used a forged deed to foreclose on a Black
  family''s farm. Through mergers that bank still exists, and the same parcel is now
  the site of one of its branch offices. The family''s great-grandchildren are identifiable.
  I think restitution is owed to them, and I feel no real hesitation.


  2. The innocent buyer. As in case 1, except that in 1970 the bank sold the land,
  no question raised, to a farming family that knew nothing about the forgery and
  has worked the land since. I still think the land, or its present value, should
  go to the original family''s great-grandchildren. But I don''t think the current
  family has done anything wrong; the obligation tracks the asset, while the blame
  doesn''t. I''d probably want the innocent buyers to be made whole separately.


  3. The survivors. In the 1950s a state-run children''s home forced the children
  in its care to work without pay. About a hundred of those children are still alive,
  and the state that ran the home still exists. I think they are owed compensation;
  this feels like the easiest case on the list.


