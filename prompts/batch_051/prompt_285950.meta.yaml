  ---


  I work as a software engineer, so I tend to think about things like this in terms
  of edge cases and whether a single rule can be specified without constant patching.
  I''ve been trying to figure out what I think about reparations for historical injustice,
  and I''ve collected my own verdicts on a set of cases. They feel inconsistent to
  me, but I can''t tell whether they''re backed by one principle I haven''t articulated,
  or whether some of them have to go.


  Here are the cases.


  1. The forged-deed farm. In 1921 a county bank used a forged deed to foreclose on
  a Black family''s farm. Through mergers the bank still exists, and the same parcel
  of land is now a branch office of that bank. The great-grandchildren of the family
  are identifiable. I think restitution is owed to them, and I don''t feel any real
  hesitation about it.


  2. The innocent purchaser. Same as 1, but in 1970 the bank sold the land to a farming
  family who had no idea about the forgery and have worked the land since. I still
  think the current family must transfer the property (or its present value) to the
  great-grandchildren. But I also think the current family is not to blame, and should
  perhaps be compensated for their lost use, or at least not treated as wrongdoers.
  So the debt travels with the asset, but the blame doesn''t.


  3. The survivors'' orphanage. In the 1950s, a state-run children''s home forced
  the children in its care to work without pay; about a hundred of those children
  are still alive as elderly adults, and the state that ran the home still exists.
  I think they are owed compensation, and this is the strongest case on my list.


  4. The long-dead wage earner. A man was paid about half the going rate for thirty
  years because he belonged to a group that was legally excluded from better-paying
  work, ending when he died in 1960. No specific asset is traceable to the underpayment.
  His grandchildren are identifiable and are doing roughly average by present-day
  standards. I lean toward saying something is owed to them, but I''m much less certain
  than in case 3, and I can''t say by whom.


  5. The painting without heirs. A museum holds a painting that was seized from a
  Jewish family in 1938. The family was later murdered, and there are no identifiable
  heirs. I don''t think the museum should simply keep the painting as if nothing happened,
  but I can''t say to whom the painting or its value is owed, and "society at large"
  doesn''t feel right either. I''d probably say the proceeds should go to a fund serving
  the community the family belonged to, but I can''t justify that very well.


  6. The aggregate case. From the 1930s through the 1960s, the U.S. federal government
  systematically denied a racial minority access to mortgage insurance and other housing
  programs. Today that group has lower median wealth than the rest of the population,
  but no one can trace a specific dollar from a specific government office to a specific
  family. When I ask myself whether the government owes something to the group, my
  gut says yes; when I ask how much, to whom exactly, and through what mechanism,
  my gut goes quiet.


  7. The prosperous descendants. In 1900, a mob, with local officials looking on,
  destroyed a family''s successful business. The family rebuilt within a generation
  and today is wealthier than the national median. I feel the descendants'' claim
  is weaker than it would be if the family had stayed poor, but I don''t think it
  simply disappears: the destruction still happened, and the original owners are the
  ones who bore it. But I''m not sure what''s left to compensate if the present-day
  descendants are not, in any ordinary sense, worse off.


  Now, the puzzle: case 1 is a clear yes, case 6 is the one I can''t settle, and case
  6 involves vastly greater wrongs than case 1. I need to know whether there''s a
  single principle — or a small set of principles — that captures my verdicts, including
  the asymmetry between case 1 and case 6. If not, which of my verdicts does the best
  principled account force me to drop?


  Please state the principle precisely, spell out which clause in it does the work
  in each case, tell me how it handles two further cases I haven''t listed:

  - A corporation that never directly stole anything but knowingly banked and profited
  from a stolen-asset transaction in 1950, with no living victims and no identifiable
  asset left.

  - A country that wronged an immigrant group 150 years ago and now wants to settle
  with the group''s descendants, some of whom are poor and some of whom are wealthy.


  And be honest about which of my seven verdicts your principle cannot save without
  becoming ad hoc.


