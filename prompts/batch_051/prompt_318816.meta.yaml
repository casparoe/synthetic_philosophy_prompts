  Exam question:

  "Maxwell''s demon appears to lower the entropy of a gas without expending work,
  seemingly violating the second law. In the modern treatment originating with Landauer
  and Bennett, does the demon in fact violate the second law? Explain the role of
  information acquisition, storage, and erasure in your answer."


  Student answer:

  "Taken at face value, the demon violates the second law: it can separate fast from
  slow molecules, producing a usable temperature difference from an initially uniform
  gas with no compensating increase in entropy elsewhere. The modern conclusion, however,
  is that the second law survives once the demon''s own information processing is
  included in the accounting. The demon must record the molecules'' velocities in
  a memory; since the memory is finite, old records eventually have to be erased to
  make room for new ones. Erasure is a logically irreversible operation, and Landauer''s
  principle sets a lower bound on its thermodynamic cost: erasing one bit dissipates
  at least kT ln 2 of energy as heat into the environment, increasing environmental
  entropy by at least k ln 2. Summed over the full cycle of measuring, sorting, and
  erasing, this entropy increase compensates for the entropy reduction in the gas,
  so the total entropy does not decrease. The critical step is measurement: as Landauer
  showed, to determine a molecule''s velocity the demon must disturb the molecule,
  and this acquisition of information is what actually costs at least kT ln 2 per
  bit. Sorting can then be done without further thermodynamic cost. So information
  is physical, and the second law is safe because acquiring information inevitably
  dissipates heat."


