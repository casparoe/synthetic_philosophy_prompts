  Let me draft:


  "I''m writing an essay for a course on value theory and the future, and I keep going
  back to a tension I''d like help working through. Samuel Scheffler argues that many
  of our present activities and projects depend on an unstated assumption he calls
  the ''collective afterlife'': the background belief that humanity will continue
  roughly as we know it after we ourselves are gone. His striking claim is that this
  matters even for people who care nothing about the well-being of future individuals
  — not because the future gives us the means to become better off, but because it
  supplies the implicit context within which our values make sense. In one of his
  central thought experiments, people discover that they are the last generation:
  no one will die prematurely, but after them no new humans will be born. Alonso Cuarón''s
  film Children of Men, adapted from P. D. James''s novel, seems to be that experiment
  made vivid: a world suddenly unable to reproduce, in which civilization sinks into
  apathy, militarism, and despair, and in which the survival of a single pregnant
  woman is treated as a kind of secular messianic event."


  Then second paragraph:


  "What I want to know is whether the film illustrates Scheffler''s conjecture or
  actually trades on a different mechanism. In Scheffler''s scenario the population
  simply tapers off; the film shows almost immediate social breakdown — suicide kits,
  internment camps, the abandonment of schools and public spaces. Is the breakdown
  best understood, as Scheffler would predict, as people losing the background conditions
  that gave their projects meaning, or is it better explained by ordinary self-interest
  (a collective ''last-period'' problem: if no one will ever enjoy the fruit of your
  labor, why maintain anything?) and by acute grief and reproductive panic, which
  have nothing to do with a philosophical point about value? Where in the film, if
  anywhere, do we see characters whose loss is the specifically Schefflerian one —
  not fear of extinction, and not altruistic concern for not-yet-born people, but
  a discovered inability to go on valuing what they already value? And where does
  the film push beyond Scheffler: for example, by pinning everything on one miraculous
  birth rather than on the ordinary continuation of a human future, or by implying
  that hope is something biological rather than conceptual? I''d like the reading
  to stay faithful in both directions — not reducing the film to a case study, and
  not bending Scheffler''s argument to fit the film."


