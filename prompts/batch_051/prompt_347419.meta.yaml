  Question: "Several writers have described the shift from hunting and gathering to
  farming as a disaster or mistake for the people who lived through it? Explain what
  evidence about health, workload, and social inequality is usually appealed to here,
  how the idea of the ''original affluent society'' is supposed to bear on the issue,
  and then say whether ''mistake'' is the right word. Defend your view."


  Maybe "the shift from hunting and gathering to farming" — domain.


  Student answer:


  "I think the idea that farming was a mistake is basically right. The evidence is
  pretty consistent: early farmers were shorter, had more signs of nutritional stress,
  and had much higher rates of infectious disease than the foragers they replaced.
  Their diets narrowed to a few starchy crops, and dental decay shot up. Workload
  also went up: at places like Abu Hureyra, people developed joint and spinal wear
  patterns consistent with hours of grinding grain, and estimates put the farming
  workweek at more hours than the foraging workweek. On inequality, hunter-gatherers
  had no stored surplus, so there was nothing for ambitious people to control; farming
  created storable grain, which allowed some households or lineages to accumulate
  wealth and eventually produce chiefs and states. Sahlins called hunter-gatherers
  the ''original affluent society'' because they enjoyed material abundance without
  much labor, which undercuts the idea that farming was an improvement in living standards.
  So even if farming produced more food per acre, the average person wound up worse
  off. The only real caveat is that once populations grew, going back to foraging
  wasn''t possible, but that doesn''t change the judgement for the early adopters:
  they made themselves worse off, and since the harms were foreseeable at least in
  the sense that they could have stopped, ''mistake'' seems fair."


