  What explanations of Ellsberg''s ambiguity aversion are standard?


  1. Maxmin expected utility / worst-case: a decision maker maximizes the minimum
  expected utility over a set of priors. This produces Ellsberg preferences. (Gilboa
  and Schmeidler.)

  2. Choquet expected utility: non-additive beliefs/capacities; ambiguity-averse Choquet
  has convex capacities, overweighting "lower" outcomes. (Schmeidler.)

  3. Second-order uncertainty aversion: the decision maker treats ambiguous bets as
  a two-stage lottery with an unknown distribution over possible urn compositions
  and is averse to the spread in probabilities (Ergin and Gul?) — but this produces
  ambiguity aversion only in some Ellsberg problems? Actually second-order expected
  utility with smooth preferences (Klibanoff, Marinacci, Mukerji) models ambiguity
  by averaging over priors with a concave function.

  4. Source preference / competence hypothesis: people prefer to bet on events in
  domains where they feel more knowledgeable; ambiguity aversion as relative comparison
  between sources (Heath and Tversky "competence hypothesis"; source-dependent risk
  attitudes).

  5. Maybe "regret/anticipated disappointment" explanation: in Ellsberg, choosing
  the ambiguous bet exposes you to the ex post thought that another choice would have
  paid more when the unknown composition is unfavorable. Hmm, that''s more a psychological
  account.

  6. Fear of negative evaluation / accountability: people expect their choice to be
