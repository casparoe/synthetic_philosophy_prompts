  Question: Explain the ''levelling-down objection'' to egalitarianism, and discuss
  the extent to which prioritarianism succeeds in avoiding it.


  Student answer:


  Egalitarianism, in the form relevant to the objection, is the view that inequality
  is intrinsically bad. More precisely, it holds that people''s being worse off than
  others through no fault of their own is bad in itself, independently of its further
  effects. The levelling-down objection points out that if this is right, then a transfer
  that lowers the better-off to the level of the worse-off without improving anyone''s
  position would still be an improvement in one respect, because it removes inequality.
  The objection says this cannot be correct: a change that benefits no one and harms
  at least one person cannot make an outcome better in any respect. Hence equality
  cannot be intrinsically valuable.


  Prioritarianism, by contrast, holds that the value of a benefit to a person is greater
  the worse off the person is. It tells us to give priority to the interests of the
  worse-off, but not because equality itself matters. Since prioritarianism assigns
  no intrinsic value to equality, it avoids the implication that levelling down is
  good. This is why Parfit regarded the priority view as preferable to egalitarianism.


  There is nevertheless a residual problem for prioritarianism. It may justify making
  a better-off person worse off in order to benefit a worse-off person even when the
  better-off person loses more well-being than the worse-off person gains. In such
  a case, total well-being declines, and the only justification for preferring the
