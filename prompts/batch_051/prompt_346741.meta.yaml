  I want the argument to have a subtle flaw. The classic regress-of-justification
  argument has this structure:


  (P1) S is justified in believing p only if S is justified in believing q1, q2, ...
  (the reasons for p). [reasons requirement]

  (P2) S is justified in believing q only if S is justified in believing r1, r2, ...
  (reasons for q), and so on ad infinitum.

  (P3) S is a finite being and cannot have an infinite chain of justified beliefs.

  (C) So S is not justified in believing p. (Generalizing: no belief is justified.)


  Flaws: (a) Foundationalism denies P1 for basic beliefs; (b) Coherentism denies the
  linear structure — justification can be mutual/holistic rather than one-way; (c)
  Infinitism denies P3 — infinite chains are fine in principle; (d) the subtle equivocation:
  "justified in believing q" in P1 is doxastic justification (having reasons), but
  maybe we only need propositional justification (there exist reasons, whether or
  not S has them). Or the slide from "the support relationship is iterative" to "the
  agent must possess each element." That''s a good subtle flaw: the argument confuses
  a chain existing in the support relation with the agent explicitly completing the
  chain.


