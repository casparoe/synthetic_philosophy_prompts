  Draft:


  "You are a philosopher of medicine/bioethics who has really gotten into the weeds
  on the definition of death. I have a bunch of case judgements that I can''t quite
  systematize, and I want you to do the reflective-equilibrium work for me. Before
  you settle on an answer, brainstorm at least three candidate principles (whole-brain,
  higher-brain, circulatory, social-decision, capacities, whatever), then test them
  against my cases one by one. Then give me: (a) the principle or small set of principles
  that fits my verdicts best, stated precisely; (b) what it implies about some cases
  I haven''t considered; and (c) an honest list of which of my verdicts it can''t
  accommodate and which one I''d be least rational to hold onto. It is totally fine
  if the outcome is that I have to drop a verdict.


  Here are my cases and verdicts.


  1. Classic brain death. A man is in an ICU after a motorcycle crash, on a ventilator.
  The neurologists run the apnea test and confirm there is no function anywhere in
  the brain, brainstem included. His heart is still beating, he''s warm to the touch,
  and the ventilator is breathing for him. I say: dead. Not dying, not ''as good as
  dead''—dead.


  2. Persistent vegetative state. A woman has been in a PVS for two years after a
  cardiac arrest. Her cortex is gone, but her brainstem works. She breathes on her
  own, has sleep-wake cycles, opens her eyes, but there is no awareness and there
  never will be. I say: alive. A terrible state, but alive.


  3. Locked-in syndrome. A woman is fully concious, can''t move anything but her eyes.
  Obviously alive. If someone called her dead I would be furious.


  4. An infant born with almost no brain above the brainstem. He breathes, has reflexes,
  sucks, but will never be conscious. I say: alive, though I''m unsure he''s a person.
  But it feels like killing to take his organs.


  5. A man has his entire native heart cut out and a total artificial heart put in
  while waiting for a transplant. His brain is fine. Clearly alive. So "no heart"
  isn''t death.


  6. A hospice patient with a DNR has a cardiac arrest in bed. The nurse waits five
  minutes, confirms no pulse, and calls the time of death exactly then. I say: dead.
  But it bugs me that if the DNR didn''t exist and someone started CPR within a minute,
  he''d very likely be alive today. Death seems to depend on a decision not to reverse
  it.


  7. A controlled DCD donor in the OR. Life support is withdrawn, his heart stops,
  and after five minutes of no touch the transplant team pronounces him dead and starts
  taking organs. I say: dead, I think. But I''m not sure I can square it with my brain-death
  slant, because at five minutes his brain cells aren''t all irreversibly destroyed.
  Honestly, I might just be scared of answering this one.


  8. A brain-dead pregnant woman is kept on a ventilator for two months to let the
  fetus develop. I call her dead. But then I notice that her body is healing a bedsore,
  fighting off a urinary tract infection, and growing a baby. That forces me to say
  ''her body is alive but she is dead.'' And I do not know whether that sentence makes
  sense.


  My working principle, roughly, is this: you die when your brain irreversibly loses
  the capacity to integrate the body as a whole. Loss of circulation only kills you
  when it has destroyed that capacity; loss of consciousness alone (PVS, the anencephalic
  infant, maybe deep dementia) doesn''t kill you. But I can already see that cases
  6, 7, and 8 strain this, and maybe case 4 does too.


  So: is there one priniciple that makes all of these cohere, or do I have to give
  something up? If I have to give something up, tell me which verdict is the weakest
  and exactly which version of a death definition I''d be left with."


