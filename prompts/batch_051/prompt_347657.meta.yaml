  seminar called "The Neuroscience of Volition." For a short in-class response, I
  set this question:


  "Benjamin Libet''s clock-timing experiment (1983) is widely taken to have shown
  that the conscious intention to move arises too late to cause the movement. Does
  the experiment in fact show that conscious intentions are epiphenomenal — that they
  play no causal role in producing voluntary action? Answer with close attention to
