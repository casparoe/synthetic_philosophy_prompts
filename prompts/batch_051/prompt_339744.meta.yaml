  Potential prompt:


  "I keep coming back to the opening of Mill''s On Liberty, where he says: ''The subject
  of this Essay is not ... but Civil, or Social Liberty: the nature and limits of
  the power which can be legitimately exercised by society over the individual.''
  I want to apply that to the way people talk about moral rules. A person who calls
  something immoral often seems to be saying that society has legitimate authority
  over that part of a person''s conduct. But when I look at how moral rules are actually
  formed, they look like the preferences, aversions, and biases of the groups that
  happen to have enough social power to enforce them. Here is the claim I want tested:
  the distinction between ''a moral rule'' and ''a group''s preference backed by social
  power'' is not something we observe; we only assert it afterward. Design the strongest
  test you can for whether that distinction does real work. What observations or experiments
  could show that a society''s moral rules are something beyond enforced preferences—convergence
  under the pressure of facts, changes when biases are corrected, or the behavior
  of people who lose their enforcement power? Say what result would convince you either
  way, and be explicit about what even a positive result would leave unresolved."


