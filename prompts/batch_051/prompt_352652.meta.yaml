  I''ve been turning over an old puzzle I first heard about on a podcast, and I''d
  like to work through it systematically. The puzzle is usually introduced with two
  people who both know the way to a town: one has walked the route and knows it, the
  other only has a true belief about the route, picked up secondhand. If both can
  guide you to the same place, why do we rate the first person''s state of mind so
  much higher? The traditional answer, as I remember it being put, is that a true
  belief is like an untethered statue that can wander off, while knowledge is tied
  down with reasons and therefore stays put. That is supposed to explain why knowledge
  is more valuable than, and not merely more reliable than, a true belief that happens
  to be true.


  The part I can''t stop thinking about is whether that answer still works given how
  much of our believing now happens outside our heads. I don''t just mean that we
  can look things up. I mean that for a great many facts, a person''s "true belief"
  is actually a standing capacity to retrieve the right answer from a device in a
  few seconds, with the same answer available again tomorrow, and the day after, and
  to whoever asks. If the main defect of a true belief was that it was unstable —
  that it could slip away, be forgotten, or be swapped for a falsehood — then a person
  with a phone and a search box seems to have true beliefs that are just as securely
  held as much of our knowledge, maybe more securely than my own unaided memory. So
  my question is: does the old argument that knowledge is more valuable than mere
  true belief because it is "tied down" survive this development? Which premise does
  the development actually put pressure on, and is there a repaired version of the
  argument that still explains why we value knowledge over reliably retrievable true
  belief? I''m less interested in the practical question of whether we should allow
  phones in exams, and more interested in whether the old account of the difference
  between knowing and merely believing truly has lost its foundation.


