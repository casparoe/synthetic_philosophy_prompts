  I''m not a trained philosopher — I work in software, and I mostly pick these things
  up from podcasts and conversations with one unusually patient friend. Lately I have
  been stuck on a puzzle from an ancient dialogue, the one about why knowing the way
  to somewhere is more valuable than merely having a correct belief about the way.
  As I understand it, the dialogue raises a real challenge: if a person with a true
  belief about the road can guide a traveler to the destination just as successfully
  as a person who has actually walked the road and knows it, then true belief seems
  to do the same work as knowledge. The traditional response is that true belief is
  unstable — it can wander off, be forgotten, or get replaced — whereas knowledge
  is held in place by the person''s reasons, so it stays. That, the story goes, is
  why we value knowledge over merely being right by luck.


  I have been trying to see whether that response still works now that so much of
  our believing is done for us by devices. I do not just mean that we can search for
  facts. I mean that for a large part of what I claim to know in daily life, my belief
  is really a standing ability to produce the right answer from a phone in a few seconds,
  every time, reliably, for myself or anyone else who asks. If the chief defect of
  true belief was that it is unstable, then a person with a phone seems to have true
  beliefs that are as securely held as much of the knowledge in my own head — arguably
  more securely, since the phone does not forget under stress or after a bad night.
  So here is my question: does the old argument that knowledge is better than mere
  true belief because it is secured by reasons survive this change in where our beliefs
  live? Exactly which step of the argument does the change put pressure on, and is
  there a repaired version that still tells us why knowledge is worth more than a
  reliably retrievable true belief? I am not really asking about exam policy or whether
  we should be allowed to use phones; I am asking whether the ancient account of the
  difference between knowing and merely being right has lost something it cannot get
  back.


