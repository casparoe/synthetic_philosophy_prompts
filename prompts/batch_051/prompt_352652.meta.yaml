  this up from podcasts and from arguing with a friend who studied the subject years
  ago. Lately I have been stuck on a puzzle I first met in Plato''s Meno: why is knowing
  something worth more than merely having a correct belief about it? The dialogue
  makes the puzzle sharp by imagining two people who can both lead you to a town you
  want to reach. One actually knows the way; the other only has a true belief about
  it, perhaps picked up secondhand. If both get you to the same place just as reliably,
  what does the knower have that the believer lacks? The traditional answer, as I
  understand it, is that a true belief is unmoored — it can slip away, be forgotten,
  or be swapped for a falsehood — whereas knowledge is secured by the person''s own
  reasons, so it stays put. That stability is supposed to explain why we prize knowledge
  even when a lucky true belief would have produced the same action.


  I have been wondering whether that answer still works now that so much of our believing
  is done outside our heads. I do not just mean that we can look things up. I mean
  that for a large share of the facts I rely on daily, what I have is best described
  as a standing capacity to produce the correct answer from a device within seconds,
  with the same answer available again tomorrow and to anyone who asks. If the chief
  defect of mere true belief was its instability, then a person with a phone appears
  to hold true beliefs that are just as firmly secured as much of the knowledge in
  my own memory — perhaps more firmly, since the device does not forget under stress
  or after a bad night. So my question is not about exam policy or whether we should
  let students use phones. It is about the argument itself. Does the old argument
