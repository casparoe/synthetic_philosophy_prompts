  Yablo''s paradox: infinite sequence of sentences S_i, each saying "for all j > i,
  S_j is untrue." The proof of contradiction: suppose S_i true; then all later are
  untrue; but S_{i+1} would be untrue and also... leads to contradiction; suppose
  S_i untrue; then some j > i is true; then leads to contradiction again. The standard
  argument is that no sentence refers to itself — each refers only to later sentences.
  But there''s debate: Priest argues the construction involves circularity because
  the predicate "untrue" has a fixed-point/quantificational range including the whole
  sequence; or that the sequence is defined by a self-referential formula. Beall,
  Sorensen respond.


  Curry''s paradox: sentence C = "If this sentence is true, then P" (or "If C is true
  then P"). Using absorption/contraction, derive P (arbitrary). Doesn''t use negation
  or falsity. Shows trouble for contraction, modus ponens, or the T-schema. The upshot:
  solutions to the liar via giving up bivalence/excluded middle don''t touch Curry;
  need substructural logic (drop contraction) or reject naive truth.


  A good exam question: "Construct a Curry analogue of Yablo''s paradox — an infinite
  sequence each of whose sentences is a conditional saying that if all later sentences
  are true then P — and assess the common claim that this shows paradox can arise
  without self-reference. In your answer, state the diagonal/non-well-founded structure,
  prove the contradiction (or show where the proof needs contraction), and evaluate
  whether the sequence is genuinely non-self-referential or merely non-adjacent/ω-inconsistent."


