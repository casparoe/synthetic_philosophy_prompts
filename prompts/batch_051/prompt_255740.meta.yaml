  disadvantage, if the alternative was not existing at all. A game where participants
  choose which of several possible children to create, with different welfare levels,
  and must justify. The debrief reveals that their choices sometimes can''t be justified
  in terms of harming the child (the child they didn''t choose doesn''t exist to complain),
  yet they still preferred the higher-welfare child — making them feel the tension
  between "wrongful" and "harm to a particular child."


  2. Procreative beneficence (Savulescu): if you''re choosing among possible children,
  you should choose the one with the best expected life, other things equal. A forced-choice
  activity: pairs of embryos with trait profiles (e.g., one has predisposition to
  asthma, one to perfect pitch, one with slightly lower predicted life satisfaction).
  Participants rank; then rules are introduced: budget constraints, polygenic scores,
  "no selection for non-disease traits" rule, etc. The debrief maps onto the moral
  difference between selecting against disease and selecting for enhancement.


