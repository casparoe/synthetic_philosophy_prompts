  ---


  I am taking an upper-level seminar on the philosophy and science of deep learning,
  and last week we discussed the debate over whether neural networks have genuine
  internal representations. A visiting lecturer, who works on machine learning but
  not directly in interpretability, gave what she called a "deflationary" summary
  of the field. As I wrote it down, she argued roughly this: asking whether a network''s
  hidden layers contain representations is like asking whether a cloud has a shape,
  because the structure we report is something we project onto the model rather than
  something the model uses. The activations of a hidden layer, she said, are just
  points in a high-dimensional vector space, and any direction we label as encoding
  a property—gender in a language model, say, or the presence of parentheses in a
  code model—is a convenient simplification of that vector arithmetic, not evidence
  that the network itself represents the property. She added that superposition, the
  phenomenon in which a network seems to store more features than it has neurons by
  spreading them across overlapping vector directions, further undermines claims about
  individual neurons having stable meanings; but she slid from this to the conclusion
  that the network represents no features at all. She also claimed that because different
  research groups can train different probes to recover different, even contradictory,
  features from the same network, there is no fact of the matter about which concepts
  the network uses. Her final conclusion was that interpretability is best treated
  as "model folklore": a useful source of hypotheses about what a network might be
  doing, but not evidence about its internal representations.


