  \ because rationalists love anthropics and multiverse, and I can craft an original\
  \ argument about non-empirical confirmation that isn't a standard one.\n\nLet me\
  \ think of a really good step-by-step argument for domain 4:\n\n\"Here's an argument\
  \ I've been toying with, that the multiverse hypothesis cannot explain fine-tuning\
  \ because it fails to make the observation more probable:\n\n(1) An observation\
  \ E confirms a hypothesis H over a rival R only if P(E|H) is higher than P(E|R).\n\
