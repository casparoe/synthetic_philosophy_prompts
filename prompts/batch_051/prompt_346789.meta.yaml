  \ it's more interesting if the argument is invalid due to an equivocation. Let me\
  \ make a subtle equivocation.\n\nLet's design an argument with an equivocation on\
  \ \"consciousness\" between \"phenomenal consciousness\" and \"access consciousness\"\
