  \ the question ill-posed.\n(4) Therefore the question \"which animals are conscious?\"\
  \ has no determinate answer.\nWhich step fails?\n\nThis is interesting. The failure:\
  \ (3) is a slide from epistemic vagueness/borderline cases to semantic indeterminacy;\
  \ also borderline cases don't imply no sharp cutoff in nature — only that our concept\
  \ is vague; there could be a sharp neurobiological threshold we haven't located,\
  \ or consciousness could be graded. Hmm, but saying \"there is no fact of the matter\"\
