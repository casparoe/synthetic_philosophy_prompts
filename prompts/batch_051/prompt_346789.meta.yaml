  \ in history: is 'why Britain and not China?' well posed? (Great Divergence, Needham\
  \ question)\n3. The possibility of extraterrestrial life\n4. The multiverse, string\
  \ theory, and non-empirical theory confirmation\n5. The distribution of consciousness\
  \ across animals\n\nTypes:\n- Make an argument for some position\n- Write a short\
  \ story related to a concept\n- Lay out a step-by-step argument and ask whether\
  \ it is valid and, if not, which step fails\n\nI think the step-by-step argument\
