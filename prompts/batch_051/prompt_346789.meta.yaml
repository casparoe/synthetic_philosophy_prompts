  \ argument and ask whether it is valid and, if not, which step fails.\" This format\
  \ can incorporate novel ideas and is meaningful offline.\n\nLet me decide which\
  \ domain and type produce the most interesting, in-the-weeds prompt that a model\
  \ can handle without search.\n\nI think domain 4 (non-empirical theory confirmation)\
  \ is very rationalist. The prompt could be a step-by-step argument about whether\
