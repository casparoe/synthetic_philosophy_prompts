  \ across animals.\n\nNovel idea injection: We can introduce a specific argument\
  \ involving \"behavioral equivalence\" and \"private facts.\"\n\nLet me write:\n\
  \n\"I've been trying to steelman the position that the question of which animals\
  \ are conscious is not just hard but in principle scientifically undecidable. Here's\
  \ the argument as I understand it:\n\n(1) A question has a scientific answer only\
