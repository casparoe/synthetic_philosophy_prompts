  of eternal life. It starts from Bernard Williams''s Makropulos case—the character
  who, after centuries of prolonged life, has exhausted the desires that gave her
  reason to go on, so continuing strikes her as dull and pointless and she chooses
  death. Williams drew the lesson that endless life would inevitably go that way,
  because the categorical desires that make life worth living would eventually all
  be satisfied or outworn, leaving only conditional desires that presuppose life rather
  than justify it. I think this conclusion is too strong, and mislocates the problem.
  On my view, tedium is an artifact of an exhaustible desire system. Call a person
  ''finitely generated'' if the sources of value, kinds of engagement, and standing
  projects that can motivate her form a finite or repeating set; for such a person,
  enough time guarantees repetition, and repetition eventually flattens into boredom.
  But if a person is ''open-ended''—if living longer keeps generating categorical
  desires that are new to her, not merely new occasions for old ones—then the time
  alone no longer entails tedium. So the Replenishment Account says: an endless life
  is worth living just in case the agent''s desire system can indefinitely replenish
  its categorical desires; the coherence of eternal bliss depends not on removing
  time but on transforming the structure of desire. I know ''open-ended'' may be doing
  suspicious work, and I worry that I have simply renamed Williams''s problem and
