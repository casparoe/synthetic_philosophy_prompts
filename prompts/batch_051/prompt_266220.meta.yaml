  I am preparing a guest session in a political-theory graduate seminar on the origins
  of social norms. The students work on promising, property, and honor codes, but
  they have not read David Lewis''s Convention, and most of them assume that a norm
  must trace back either to something like a tacit collective agreement or to selection
  at the level of the group. I want the session to give them a third possibility:
  a convention as Lewis analyzes it — a self-perpetuating regularity in a recurrent
  coordination problem, one equilibrium among several, sustained by precedent and
  common knowledge rather than by anyone''s decision or by sanctions. The session''s
  payoff is the thought that the selection of a pattern of behavior and the normativity
  of that pattern are two distinct problems and need not have the same solution.


  Do not explain the theory to me; plan how I should explain it. The session runs
  seventy-five minutes. I need the following.


  First, the order in which the components must be introduced and why each depends
  on the previous one — coordination games with multiple equilibria, the idea of a
  regularity, salience, expectations about others'' expectations, common knowledge,
  arbitrariness, and the gap between a convention and a norm — up to the point where
  the students can see a convention as a distinct source of social order that is neither
  an agreement nor a sanction-backed rule.


  Second, the one example that should carry the session. Argue for it, and say what
  an example must include and must lack in order to do this work, addressing explicitly
  whether the familiar case of driving on the right or the left is adequate at the
  start.


  Third, the misconceptions the students will bring or form and the exact point in
  the sequence where each should be headed off. I already expect these: that convention
  just means tacit agreement; that a convention is a norm with mild sanctions; that
  common knowledge requires literally infinite iterations of information in anyone''s
  mind; and that arbitrariness means pure accident, so nothing explains why one alternative
  rather than another took hold. Add any others that matter.


  Fourth, where to stop with respect to the evolution of norms: what Lewis''s account
  does and does not explain about how a mere convention acquires normative force,
  what I should openly leave as a further problem, and how the session''s ending should
  set that problem up without pretending to solve it.


  Finally, one question I can pose at the end that would distinguish students who
  now see a convention as a third kind of thing from those who still fold it back
  into agreement or sanctions.


  ---


