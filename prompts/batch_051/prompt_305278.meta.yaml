  "I''m a PhD student in political philosophy working on Kant''s political thought
  and postwar nuclear ethics. I''m planning a paper that uses Stanley Kubrick''s Dr.
  Strangelove as a kind of dramatic test of Kant''s Toward Perpetual Peace, and I''d
  like comments on the reading before I commit to it.


  My proposal is this. The sixth preliminary article of Perpetual Peace says that
  even in war a state may not adopt methods of hostility that would make mutual trust
  impossible in a future peace — Kant mentions assassins, poisoners, breach of capitulation,
  and incitement to treason. I want to read the film''s Doomsday Machine as the limiting
  case of exactly this prohibition: a device whose automatic, omnicidal retaliation
  is designed precisely so that no after-the-fact intention, restraint, or trust is
  possible. But the film is more interesting than a simple illustration, because the
  Doomsday Machine operates in peacetime as a deterrent, not as an act of war; one
  of its absurdities is that it was kept secret until after the crisis begins, so
  it cannot even deter. So I want to ask whether Kant''s article, which seems written
  for the conduct of an ongoing war, can be extended to peacetime deterrence postures
  — and whether the film shows that the modern bureaucratic state undoes the background
  conditions (publicity, republican accountability, human control) on which Kant''s
  argument for a lawful peace depends.


