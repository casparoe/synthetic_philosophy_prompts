  Neurath''s project: ISOTYPE (International System of Typographic Picture Education;
  originally Wiener Methode der Bildstatistik, Vienna Method of Pictorial Statistics).
  Developed with Marie Reidemeister/Neurath, Gerd Arntz, and others, from the mid-1920s
  onward, at the Gesellschafts- und Wirtschaftsmuseum in Vienna. Aim: represent social
  and economic facts through standardized pictorial symbols so that complex statistical
  relationships are visible at a glance to ordinary people, across language barriers.
  Principles: one picture per quantity (larger quantities shown by repetition of the
  same icon rather than enlargement), simplified flat icons, consistent visual grammar,
  use in exhibitions/books/posters for public education. Neurath saw it as a contribution
  to international communication, socialist planning, and unified science. He insisted
  pictures must be part of a larger "visual education" and not self-explanatory; they
  require conventions learned like any language. He also thought about "isotypes"
  with adjectives? There''s the concept of "the transformer" — the design role that
  translates data into visual form. The museum moved to The Hague and then to the
  UK after the Anschluss; eventually became the Isotype Institute. This is all generally
  known. I should verify if needed, but I don''t need to put exact dates.


