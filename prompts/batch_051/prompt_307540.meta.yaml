  Let me recall the two-envelope paradox details.


  The standard setup: You are shown two envelopes, one has twice the money of the
  other. You pick one (or are given one), call it A with amount $x$. The other, B,
  is equally likely to have $2x or $x/2, so its expected value is (1/2)(2x) + (1/2)(x/2)
  = 5x/4 > x. So it''s always better to swap. But if you''d picked B, the same reasoning
  says swapping to A is better — symmetry contradiction.


  Famous diagnosis: The argument assumes that for any fixed x, the two possibilities
  (other = 2x, other = x/2) are equally likely; but "your envelope has amount x" does
  not give a well-defined conditional distribution unless you have a prior over the
  pair. With a finite prior, the conditional probabilities depend on x, and the expected
  gain from switching is positive for some x but negative for others, averaging to
  zero. No paradox without an improper uniform prior over amounts.


