  The argument: Suppose presentism. For an observer O, only events simultaneous with
  O in O''s frame are real. But another observer O'' moving relative to O will have
  a different simultaneity slice; events real for O are not real for O''. So "real"
  becomes relative to observer, which is absurd (reality is not observer-dependent).
  Therefore presentism is false, and all events in the manifold are equally real.


  Subtle misrepresentations commonly made:

  1. Confusing "relativity of simultaneity" with "there is no fact about temporal
  order at all" — overstates; for timelike separated events, order is invariant.

  2. The argument presupposes that presentism must pick out a single global "now"
  via standard simultaneity, but presentists can adopt a privileged foliation (Lorentzian/neo-Lorentzian
  presentism) — the argument doesn''t refute that, only the combination of presentism
  with the standard interpretation of SR as lacking a privileged frame.

  3. "Future events are already real" and "the future is fixed/determined" conflates
  eternalism (all times equally real) with determinism (no alternative possibilities).
  Relativity does not by itself show determinism; eternalism is compatible with indeterministic
  laws.

