  The "ethical voter" model: voting can maximize EV if you care about others: your
  chance of being the pivotal voter P times the total benefit to everyone B = expected
  value. If P is 1e-7 and B is maybe trillions of dollars in policy differences for
  300M people, then EV could be on the order of hundreds or thousands of dollars,
  which dwarfs the cost of voting. So the "Parfit-style / Edlin, Gelman, Kaplan" resolution:
  the self-interested model makes turnout irrational, but the altruistic model makes
  it rational if the candidate difference matters to many people. A rationalist would
  recognize this: "the expected value of voting is high if you''re not purely selfish."


  But there are wrinkles: if you''re an altruistic EV maximizer, you should probably
  vote, but also, the expected value depends on the probability your vote changes
  the outcome, which depends on the state of the race; if the election is not close,
  P is vanishingly smaller; in a safe state, the EV might still be tiny. Also, if
  everyone reasons this way, or if a candidate''s platform is uncertain, etc.


