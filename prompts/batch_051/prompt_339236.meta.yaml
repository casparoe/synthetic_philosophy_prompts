  Potential genuine tensions in Locke''s "Some Thoughts":

  - Locke insists on forming habits/virtue by custom early (children not reasoned
  with), but also repeatedly insists reason should govern adults and that children
  are to be treated as rational creatures as they grow; the transition problem: how
  does a child formed purely by habituation and habituation''s love of esteem develop
  the autonomy Locke says adulthood requires? Habituation to "reputation" might actually
  undermine the development of acting from reason, because the child learns to be
  motivated by the eyes of others. Locke himself distinguishes the principle of virtue
  as the "love of credit" — but he also says the true foundation of virtue is the
  notion of God and the child''s own reason. Tension.

  - Locke is against physical punishment and against rewards that create desires (sweets,
  money), but he''s for esteem and shame as motives — yet shame/esteem depends on
  the contingent opinions of others, which can be corrupt; Locke knows this and says
  the child should be taught to care for the esteem of the wise and good only. There''s
  a tension between using reputation as an internal motive and trying to anchor it
  to what reason approves.

  - Locke says a child''s crying should not be indulged, to harden the body; but also
  children''s fears should be soothed, not mocked.

  - "The sooner you treat him as a man..." vs. early habitual discipline.


