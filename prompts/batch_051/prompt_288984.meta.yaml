  Requirements a good counterfactual history must meet:

  1. It must start from a well-defined divergence point and hold the world fixed up
  to that point (otherwise not counterfactual history but alt-fiction).

  2. Minimal change / closeness: alter as little as necessary to make the antecedent
  true; but "as little as necessary" is ambiguous — do we minimize number of events,
  or preserve causal structure/laws?

  3. Causal consistency: downstream consequences of the changed event differ, but
  facts not causally downstream (like geography, initial conditions, laws, long-run
  structural factors) are held fixed unless the story gives a reason. Cotenability.

  4. Handle hindsight bias: the narrator must not smuggle in knowledge that agents
  at the time didn''t have; counterfactual outcomes must be predictable in principle
  from the changed state, not chosen because we know what actually happened.

  5. Multiple realizers / forking paths: a good theory should say that a counterfactual
  claim isn''t a single inevitable outcome but a space of plausible worlds, maybe
  with probabilities; it must distinguish "the assassination of X would have prevented
  war" (one path) from "would have delayed war by years" etc.

  6. Distinguish contingency from inevitability: what would a test for historical
  inevitability even look like? If the same outcome occurs across many nearby worlds,
  it''s robust/overdetermined; if it flips in closest worlds, contingent. So the theory
  should give a notion of robustness across a closeness-weighted set of alternates.

  7. No contradiction with determinism/indeterminism: possibly mark as negotiable;
  if the world is deterministic, counterfactuals need a different reading (e.g., backtracking?)
  or a small miracle. Which is a real issue. Could say the biggest split: some people
