  Actually, "acausal blackmail" is discussed in the context of "Roko''s basilisk"
  and LessWrong "Newcomb''s problem and regret of rationality". The basilisk: a future
  AI punishes those who knew about it but didn''t help build it. The threat is acausal
  because the AI doesn''t exist yet and can''t observe your current decision causally
  — it will only know (in the future) whether you helped. If you decide now not to
  help, the future AI (if it comes to exist) will know you didn''t help and punish
  you. So your current action doesn''t causally affect the AI''s current existence
  but does affect what it can infer later. That''s a form of acausal threat.


