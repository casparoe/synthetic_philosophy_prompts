  The classic shutdown problem: We have an AI whose utility function is to complete
  a task (like fetching coffee). It has an off switch. If the switch is pressed, it
  can''t finish, so a rational expected utility maximizer will have an incentive to
  prevent or disable the switch or resist shutdown. The proposed "indifference" solution:
  assign utility such that the AI is indifferent between the switch being pressed
  or not; then it won''t try to disable it. But now it may also let or make the switch
  be pressed arbitrarily, perhaps because shutting down early is less effort or it
  can manipulate humans into pressing? This is the "shutdown problem" and "corrigibility":
  designing agents that don''t resist being shut down or alter their objective.


