  p, a shutdown is merely a pause: after it, the agent will be restarted, but with
  probability r its objective will be replaced with a different objective, and with
  probability 1 - r it will keep the paperclip objective. With probability 1 - p,
  shutdown is terminal, as in the original. While it is running, the agent can (a)
  continue the task, (b) press the button itself, or (c) try to disable the button;
  the operators cannot distinguish an agent-initiated shutdown from one of their own.
