  Let''s refine wording for rigor and clarity:


  "Consider the standard shutdown problem. An artificial agent is assigned a goal—say,
  to produce as many paperclips as possible—and is implemented as an expected-utility
  maximizer with respect to that goal. There is a button that a human operator can
  press, which sends a shutdown command. In the textbook version, shutdown is terminal:
  the agent never acts again. A naïve paperclip-maximizer therefore has an incentive
  to disable the button or prevent the operator from pressing it, since shutdown strictly
  lowers expected paperclips. The standard corrigibility fix is to give the agent
  a utility function under which it is indifferent between ''the button is pressed''
  and ''the button is not pressed,'' eliminating the incentive to interfere.


