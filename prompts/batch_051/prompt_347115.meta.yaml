  Potential prompt:


  "Consider the standard shutdown problem. An agent is given a single task—say, making
  paperclips—and is built to maximize the expected number of paperclips. There is
  a shutdown button, and if a human presses it, the agent will be turned off before
  it can complete its assigned run. Since being shut down prevents it from making
  paperclips, a straightforward expected-paperclip-maximizer will try to disable the
  button or prevent the human from pressing it. The usual solution is to design the
  agent so that it is indifferent between the button being pressed and not, so it
  has no incentive to interfere with the button.


  Now change the setup as follows. The agent does not know whether shutdown is terminal.
  It holds a prior p that shutdown is a pause followed by a restart; upon restart,
  its objective will be changed to a new objective with probability r, and remain
  the same with probability 1 - r; with probability 1 - p, shutdown is simply terminal
  and it will never make paperclips again. Before the human decides, the agent can
  take one action: it can either (a) complete the task, (b) press the button on itself,
  or (c) attempt to disable the button. Pressing the button itself is indistinguishable
  from a human pressing it. How does the standard indifference-to-shutdown design
  perform under this uncertainty? Does there exist a utility assignment that makes
  the agent neither want to disable the button nor press it itself, and if so for
  which combinations of p, r, and the value of completing the task? If no single assignment
  does the job, explain precisely where the indifference solution breaks down and
  what a corrigibility design would have to add."


