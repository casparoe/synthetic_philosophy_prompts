  I''ve been going back and forth with a friend about Goodman''s new riddle of induction,
  and I hit a wall I can''t get past. The setup is the usual one: pick some future
  time—say 2100—and define a so-called predicate "grue" that applies to an object
  just in case it is examined before then and is green, or it is not examined before
  then and is blue (or some near variant of that; the details don''t matter for what''s
  bugging me). Before 2100, every grue-looking emerald is also a green-looking emerald,
  so the same observations that seem to confirm "all emeralds are green" seem to confirm
  "all emeralds are grue," and those two generalizations diverge after 2100. My friend''s
  view is that there''s something genuinely better about "green" here—that "green"
  is a projectible predicate and "grue" is a broken one—and that this is a real fact
  about which sorts of concepts fit the world (or at least fit rational inductive
  practice), not just a boring fact about which ones our language happens to have
  a short word for. We''ve gone round and round on this, and I can''t tell whether
  he''s saying something testable or just dressing up a convention in the word "genuinely."


