  The false presupposition: that independence from ZFC means the CH question has no
  determinate answer, or that it''s just a matter of choosing axioms. The prompt could
  say:


  "I''ve been reading about the continuum hypothesis and the independence results
  — Cohen''s forcing showed CH can''t be proved or refuted from the standard ZFC axioms.
  I keep hearing people describe CH as ''independent,'' and from that I''d have thought
  the question is settled in the negative sense: there is no fact of the matter about
  whether there''s a set of reals of size between the integers and the continuum,
  and the only remaining question is which axioms you happen to find convenient for
  your purposes. But then I also hear set theorists and philosophers talking as if
  the continuum problem is still a live question, as if there''s a real answer we
  haven''t found yet, and as if some new axioms could be better or worse evidence
  for the truth about the size of the continuum. That sounds to me like continuing
  to debate whether there''s a largest prime after you''ve proved there isn''t one.
  Where exactly am I going wrong? Could you unpack the step that takes you from ''independent
  of ZFC'' to ''still metaphysically unsettled and worth arguing about,'' or, alternatively,
  tell me why I shouldn''t accept that step? Please be detailed and start by laying
  out the assumptions you think I''m making."


