  In my free will seminar we''ve been going back and forth about Frankfurt cases,
  and I ended up building an argument that now makes me kind of queasy: each step
  looked fine when I wrote it out, but the conclusion feels way to strong for me to
  actually accept. I''d like you to tell me exactly where it goes wrong — or, if it
  doesn''t, which premise I have to eat and what it costs.


  For background: Frankfurt cases are meant to show that the principle of alternative
  possibilities (PAP) is false — that someone can be morally responsible for what
  they did even if they couldn''t have done otherwise. In the standard setup, Jones
  decides on his own to do something bad, while Black is standing by to make Jones
  decide that way if Jones had been about to decide otherwise; Black never has to
  intervene, and most people still judge Jones responsible. The usual diagnosis is
  that responsibility depends on the actual sequence: Jones''s actual deliberation
  and decision were his own, so the missing alternatives don''t matter.


  So here''s the argument I built.


  (1) If responsibility is grounded in the actual sequence, then once an agent''s
  actual sequence is his own, the absence of alternative possibilities is irrelevant.

  (2) If the absence of alternatives is irrelevant, then the way the alternatives
  were blocked should also be irrelevant — only the actual sequence matters.

  (3) So take a case where a neuroscientist directly causes Smith''s decision to donate
  to a charity by stimulating his brain, and also has a backup device: if Smith had
  been about to decide not to donate, the implant would have made him donate anyway.
  Smith couldn''t have done otherwise.

  (4) From (1) and (2), Smith is responsible just in case his actual sequence is his
  own.

  (5) In the direct-implant case, his actual sequence isn''t his own — it''s the neuroscientist''s
  doing — so Smith isn''t responsible. That''s fine.

  (6) But now soften the manipulation. The neuroscientist doesn''t touch Smith''s
  brain directly. Instead, he plants a moving article about famine relief in Smith''s
  news feed, knowing from a well-validated predictive model that Smith will read it,
  weigh the reasons it gives, and decide to donate. He would have intervened only
  if Smith had shown signs of not being persuaded. Smith reads the article, deliberates
  about the reasons, and decides to donate.

  (7) In this softer case, Smith''s actual sequence — reading, deliberating, deciding
  on the basis of reasons he takes to be good — looks exactly like Jones''s in the
  Frankfurt case. The only difference is that a manipulator arranged the inputs and
  stood ready to intervene.

  (8) If the actual-sequence view is right, then Smith is responsible in the softer
  case, because his actual sequence is his own in just the way Jones''s is.

  (9) But if Smith is responsible in the softer case, it''s hard to see why he''s
  not responsible in the direct-implant case too. The line between "arranging the
  inputs someone deliberates over" and "directly causing their decision" is a difference
  in how the actual sequence was made available, not a difference in the actual sequence
  itself. And step (2) says only the actual sequence matters.

  (10) So the actual-sequence reading of Frankfurt cases either collapses into saying
  Smith is responsible in the direct-implant case — which seems crazy — or it has
  to slip in a requirement about how the alternatives were blocked, which sounds like
  alternative possibilities sneaking back in.

  (11) Therefore, either Frankfurt cases don''t give a stable way to reject PAP, or
