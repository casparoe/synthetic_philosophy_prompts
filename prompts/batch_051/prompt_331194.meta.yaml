  The background: Frankfurt cases are supposed to show that the principle of alternative
  possibilities (PAP) is false — roughly, that someone can be morally responsible
  for what they did even if they couldn''t have done otherwise. In the standard setup,
  Jones decides on his own to do something bad, while Black stands ready to make Jones
  decide that way if Jones had been about to decide otherwise; Black never has to
  act, and the intuition is that Jones is still responsible. What''s supposed to be
  doing the work is the actual sequence: Jones''s actual deliberation and decision
  are his own, so the fact that alternatives are missing doesn''t matter.


  Here''s the argument I built:


  (1) If the actual sequence is what grounds responsibility in Frankfurt cases, then
  the absence of alternative possibilities is irrelevant once the actual sequence
  is the agent''s own.

  (2) If the absence of alternatives is irrelevant, then other features of how the
  alternatives were blocked should also be irrelevant — what matters is only the actual
  sequence.

  (3) So take a case where a neuroscientist directly causes Smith''s decision to donate
  to a charity by stimulating his brain, and also has a backup: if Smith had been
  about to decide not to donate, the implant would have made him donate anyway. Smith
  could not have done otherwise.

  (4) By (1) and (2), Smith is responsible just in case his actual sequence is his
  own.

  (5) But "his own" has to be read carefully. In the Frankfurt case, Jones''s decision
  arises from his own deliberation. In the implant case, Smith''s decision doesn''t
  — it''s caused by the neuroscientist. So we say Smith isn''t responsible, and the
  actual-sequence view can explain that.

  (6) But now make the manipulation softer. The neuroscientist doesn''t stimulate
  the brain directly. He plants a vivid article about the charity in Smith''s feed,
  knowing from a well-verified predictive model that Smith will read it and form the
  decision on the basis of reasons he takes to be good ones. He would have intervened
  only if Smith had shown signs of not being moved. Smith deliberates, weighs the
  reasons in the article, and decides to donate.

  (7) In this softer case, Smith''s actual sequence — reading, deliberating, deciding
  on the basis of reasons — looks just like Jones''s in the Frankfurt case. The only
  difference is that a manipulator arranged the inputs and stood ready to intervene.

  (8) If the actual-sequence view is right, Smith seems responsible in the softer
  case too, because his actual sequence is his own in exactly the sense Jones''s is.

  (9) But if Smith is responsible in the softer case, then it''s hard to see why he
  isn''t responsible in the direct-implant case as well — the line between "arranging
  the inputs someone deliberates over" and "directly causing a decision" is a difference
