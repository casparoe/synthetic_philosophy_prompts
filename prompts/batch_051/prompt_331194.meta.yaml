  into saying Smith is responsible in the direct-implant case (which seems crazy),
  or it has to smuggle in a requirement about how the alternatives were blocked —
  which is just the relevance of alternative possibilities sneaking back in.

  (11) Therefore, either Frankfurt cases don''t actually give us a stable way to reject
  PAP, or we have to accept that directly manipulated agents are responsible in a
  way most of us would deny.


