  second is a harm-reduction consequentialist: punishment is justified when and because
  its expected effects reduce the future frequency or seriousness of wrongdoing through
  deterrence, incapacitation, or reform. This consequentialist accepts two side constraints
  he regards as consistent with his view: he will not punish a person known to be
  innocent, and he will not impose a sentence more severe than the wrong committed,
  though he grounds this proportionality limit in the long-run consequences of maintaining
  a system that respects it, not in desert.


