  Let me ensure the conceptual content: Scanlon''s contractualism rejects aggregating
  moral claims (each person''s reasonable rejection matters). The rationale often
  draws on the separateness of persons (Rawls criticized utilitarianism for not taking
  seriously the distinction between persons). Scanlon''s individualist restriction:
  an action is justifiable to each; we compare individual complaints not sums. But
  this presupposes we can identify "an individual" whose complaint we compare. Parfit''s
  reductionism: personal identity is not deep; persons are constituted by psychological
  connectedness and continuity. If the boundaries between persons are fuzzy, the unit
  of complaint is fuzzy. A contractualist might then have to either (a) allow aggregation
  among connected-but-not-identical person-stages (which looks like intrapersonal
  aggregation across a life), or (b) explain why the separateness relevant for morality
  isn''t the deep metaphysical kind Parfit attacked. The proposal question: "Is Scanlon''s
  individualist restriction stable under a Parfitian account of personal identity?
  Specifically, if persons are merely connected bundles of experiences, can contractualism
  still motivate the ban on interpersonal aggregation without relying on a deep separateness
  between persons; if it can, then for cases with reduced connectedness (e.g., a person
  with severe discontinuity) should we count their successive ''stages'' as separate
  complainants, allowing aggregation within what we ordinarily call one person?"


