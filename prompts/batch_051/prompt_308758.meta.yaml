  Model answer:


  (a) The original Tortoise accepts both premises but refuses the conclusion until
  the move from premises to conclusion is itself represented as a premise. This shows
  that the inferential connection between premises and conclusion is not the same
  as a further premise asserting that connection. If it were, then asserting the conditional
  premise would be one more premise from which the conclusion follows only by another
  inference, requiring another conditional, ad infinitum. The regress arises because
  the Tortoise treats modus ponens, the rule, as if it were an object-language proposition
  to be believed. The lesson is a category distinction: rules of inference license
  or constitute moves between propositions; they are not additional propositions in
  the same game.


  (b) The New Tortoise seems to have blocked the original regress because she accepts
  every conditional premise, including the general statement. But she has not thereby
  accepted the rule. A subject can believe a universal generalisation without being
  disposed to apply it to a particular case; the belief that "all Fs are G" doesn''t
  by itself move her from "a is F" to "a is G" unless she performs the inference.
  Her slogan expresses the premise/rule gap: assent is a relation to a truth; inferring
  is an act or practice governed by a rule. The error, if any, is that she treats
  accepting a universal rule as a belief among beliefs while still withholding the
  inferential disposition that the rule encodes. Alternatively, one can defend her
  coherence: belief and inference are different kinds of states/acts; there is no
  contradiction in having the belief without the disposition, though her behavior
  may be rationally criticizable rather than logically inconsistent. A strong answer
  notes the distinction between formal implication and inference as a psychological
  or normative act.


  Actually, nuanced: if she accepts the general statement "For any A, B: if A and
  (if A then B), then B", and she also accepts P and if P then Q, then her beliefs
  jointly entail Q. But entailment doesn''t force her to form the belief that Q; human
  reasoners are not logically omniscient. So her position is coherent at the descriptive
  level: one may fail to draw conclusions from one''s beliefs. At the normative level,
  she fails to conform to a rule of rationality; she may be accused of inconsistency
  in the sense used by rational normativity? But is it incoherent? The question likely
  expects students to distinguish "logical incoherence" from "rational failing". She
  escapes the purely logical regress but relocates the problem to rule application
  and epistemic normativity.


  (c) The New Tortoise shows that the justificatory problem cannot be solved by supplying
  more truths, no matter how comprehensive. Deduction, if it needs justification,
  needs a justification of the rule itself or of the practice of inferring, not another
  premise. This opens three main options: (i) rules of inference are constitutive
  of or analytic of rational thought, so that the request for justification is misguided
  or can be answered by showing they are constitutive; (ii) justification is pragmatic/naturalistic
  — deduction is vindicated by its reliability or indispensability, but this itself
  uses deduction and is circular in a potentially benign way; (iii) scepticism — no
  non-question-begging justification exists. The New Tortoise also shows that the
  original puzzle was never really about missing premises; it was about what it is
  to be governed by a rule.


  Marking scheme (20 marks):


  - 4 marks: Accurate reconstruction of the original regress and the premise/rule
  distinction; does not claim Carroll showed modus ponens is invalid. Common errors:
  saying the premises "don''t entail" the conclusion; confusing validity with acceptance;
  treating the conditional as a missing premise that Achilles could simply add.

  - 4 marks: Identifies why the New Tortoise is not identical to the original: accepting
  every conditional as a truth is not the same as inferring by modus ponens; the regress
  is side-stepped but a new gap appears between belief and rule-governed act. Common
  errors: asserting she has exactly the same problem, or asserting the problem disappears
  entirely.

  - 4 marks: Coherence assessment: distinguishes logical consistency from rational/intellectual
  criticism; considers logical omniscience; may argue either way but must show the
  distinction. Common errors: claiming she is "logically inconsistent" simpliciter,
  or claiming her position is fully rational with no cost.

  - 4 marks: Discussion of the rule-application/rule-following problem: what it is
  for a general statement or rule to apply to a case; the regress now concerns applying
