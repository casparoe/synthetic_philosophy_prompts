  Hempel: hypothesis H: All ravens are black. Equivalent to H'': All non-black things
  are non-ravens. Nicod criterion: a universal generalization is confirmed by its
  positive instances. A white shoe is a positive instance of H'' (non-black, non-raven),
  so it confirms H''. But intuitively it doesn''t confirm H. Hempel accepted this
  and argued the intuition is a psychological illusion (or shifting background information).
  Bayesian accounts (e.g., I.J. Good, Hosiasson-Lindenbaum) show that a white shoe
  can confirm H but very slightly, depending on priors. Some analyses: the raven paradox
  is resolved by pointing out that the class of non-black things is vastly larger
  than the class of ravens, so each non-black non-raven provides negligible support.
  Some also note that background info can make the observation confirm not at all
  or disconfirm depending. The prompt''s details are accurate enough.


