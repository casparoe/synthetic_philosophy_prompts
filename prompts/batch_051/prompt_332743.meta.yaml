  ---


  I keep reading proposed solutions to the problem of eliciting latent knowledge —
  the problem of getting a trained model to report, truthfully, things it has learned
  that no one labeled — and each proposal seems to be evaluated against a different
  implicit standard. Before I read another one, I want the full specification of what
  a method would actually have to get right.


  Here is the setting I care about, to fix what "adequate" means. An overseer has
  a model that was trained mostly on raw data — say, a next-frame predictor on dashcam
  footage — with only sparse, task-specific labels. The model has plainly learned
  regularities that never appear in the labels: it can tell that a driver was distracted
  in the seconds before a crash, or that a particular road layout produces near-misses,
  though no frame is tagged with those facts. The overseer now needs to act on such
  reports in high-stakes decisions, but at the time the report matters the overseer
  cannot verify its truth; if they could, the problem would reduce to ordinary supervised
