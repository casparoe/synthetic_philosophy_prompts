  each exit, exit with probability p. The ex ante best rule is p = 1/3, with expected
  payoff 4/3. But the puzzle is that, once he is actually at an exit, if he gives
  each exit an equal probability of being the first, he finds that exiting has expected
  payoff 2 while continuing has expected payoff 1.5 under his own p = 1/3 plan, so
  he wants to deviate from the rule he committed to. The standard reply is that the
  uniform belief is wrong: he should condition on the fact that his own plan has p,
  which makes him more likely to be at the first intersection than the second, and
  under that belief he is indifferent between continuing and exiting at p = 1/3."


