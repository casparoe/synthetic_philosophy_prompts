  Sobel and others reconstruct Gödel''s proof from his notebooks (1970). The premises:


  Definition 1: x is God-like iff x has as essential properties those and only those
  properties which are positive.


  Definition 2: φ is an essence of x iff φ(x) and for every ψ, ψ(x) → □∀y(φ(y) → ψ(y)).


  Definition 3: x necessarily exists iff for every essence φ of x, □∃y φ(y).


  Axiom 1: A property is positive iff its negation is not positive. (Sometimes: if
  φ is positive, then ¬φ is not positive.)

  Axiom 2: Positive properties are closed under entailment: (φ positive ∧ □∀x(φx →
  ψx)) → ψ positive.

  Axiom 3: God-likeness is positive. (Or: the conjunction of positive properties is
  positive.)

  Axiom 4: If φ is positive, then □(φ is positive). (Positiveness is necessary.)

  Axiom 5: Necessary existence is positive.


