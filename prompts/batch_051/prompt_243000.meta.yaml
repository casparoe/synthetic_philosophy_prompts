  The dogmatism paradox (Kripke): Suppose S knows p. Let q be any evidence against
  p. Since S knows p, p is true. So q is misleading evidence (evidence for a falsehood).
  If S knows p, does S know that any evidence against p is misleading? Kripke''s puzzle:
  Knowledge is closed under known entailment: if S knows p and knows that p entails
  q, then S knows q (or is in a position to know). If S knows p, then S knows that
  any evidence against p is misleading. But then S can rationally ignore any evidence
  against p. Yet it seems irrational to ignore evidence. The paradox arises for a
  subject who knows p and is presented with evidence against p: if she knows p, she
  can reason "p is true, so this evidence is misleading, so I can disregard it." But
  doing so seems dogmatic.


