  The parallel: Teleosemantics (Millikan, Papineau, Dretske-ish) naturalizes content
  by appeal to biological functions: a state''s content is what it is the state''s
  function to indicate/correlate with; functions are selected effects or what the
  state was designed to do. A heart''s function is to pump blood because hearts were
  selected for pumping blood. For a mental representation, its content is the condition
  it is its proper function to track. Malfunction: a magnetosome in an oxygen-poor
  environment (Millikan''s example) still has the function to indicate magnetic north
  / anaerobic water? Actually magnetotactic bacteria use magnetosomes to orient toward
  oxygen-poor (anaerobic) water by detecting magnetic north; in the northern hemisphere
  they swim toward geomagnetic north to reach deep anaerobic water. Millikan''s example:
  the magnetosome''s function is to indicate the direction of low oxygen, not magnetic
  north, because that''s what it was selected for. If placed in the southern hemisphere,
  it malfunctions and would still "indicate" north but not achieve the selected end.


  ML parallel: A classifier trained to detect pneumonia from chest X-rays learns hidden
  representations. What gives those hidden-unit activations their "content" — the
  loss function/training objective (predict pneumonia from X-rays), or the actual
  causal correlations in the training data? There''s a well-known case: a model trained
