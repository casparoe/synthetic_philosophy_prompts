  - Evolution by natural selection ↔ training by gradient descent on a loss function.

  - Proper function (what selected for) ↔ task the network is trained to perform (or
  what the loss rewards).

  - Malfunction / swampman-like cases ↔ distribution shift / adversarial examples
  / a network deployed out of distribution.

  - The content of a hidden unit ↔ semantics read off from what it predicts under
  normal conditions.

  - Consumers of representations (Millikan) ↔ downstream heads/decoders or human interpretation.


