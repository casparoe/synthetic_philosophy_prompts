  - Teleosemantics assigns functions historically (selected effects), but ML training
  is not selection among replicators over generations — the network''s parameters
  aren''t replicating; gradient descent is a single trajectory of optimization. Etiological
  function (selected effects) vs. propensity/Cummins function. A trained network''s
  "function" might be better understood as a Cummins function (contribution to a capacity)
  or a goal-directed optimizing system (which Millikan''s proper functions didn''t
  require? Actually goal-directedness is separate).

  - Teleosemantics usually aims at determinate content for states even without an
  external "consumer" reading them off; ML representations notoriously have no intrinsic
