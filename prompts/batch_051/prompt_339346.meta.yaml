  we would find inconvenient — for instance, that an effective intervention should
  be rejected or sent up for political sign-off. Finally, say what the procedure cannot
  do: the residual cases where the team will have to deliberate rather than follow
  steps.


  Please write the answer in British English, and make the procedure self-contained
