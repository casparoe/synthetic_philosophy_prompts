  distinctions — about paternalism, manipulation, autonomy, welfare, and what it means
  to preserve people''s freedom to choose — into a checklist or ordered sequence of
  tests, written for people without the theory. Say which distinctions must survive
  the simplification and which can be dropped, and mark every step that is really
  a judgement call dressed up as a procedure. In particular, the procedure should
  handle these questions: when does a nudge engage a person''s own ends, and when
  does it substitute the authority''s ends for the person''s? Why is ''they can opt
  out'' not sufficient to make an intervention a nudge rather than manipulation? Why
  is ''we are only giving people information'' not sufficient either? And when, if
  ever, does transparency make an intervention permissible that would otherwise be
