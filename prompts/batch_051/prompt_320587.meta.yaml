  Draft:


  ---


  I am a software engineer with no formal philosophy background, and I would appreciate
  plain language throughout.


  In an argument about whether a person''s identity survives radical memory loss,
  a colleague said something along these lines: the self is a centre of narrative
  gravity. His analogy ran as follows. The centre of gravity of a physical object
  is not a material part of the object; it is an abstract point, computed from the
  distribution of mass, that lets us predict and describe how the object behaves.
  In the same way, the self is not a thing located anywhere inside a brain or body;
  it is an abstraction over the stream of stories that a person and others tell about
  that person''s actions and history. From this he concluded that selves are useful
  fictions rather than real entities, and that praising or blaming a self is a category
  mistake, much like praising or blaming a centre of gravity when a beam tips over.


  I can feel the analogy doing real work, but I suspect it quietly imports features
  of physical systems into talk about persons, and I want the mapping tested rather
  than left implicit. Please audit the analogy in detail. In particular:


  1. Lay out the mapping explicitly: what in the source corresponds to what in the
  target (the object, its mass distribution, the centre of gravity, the gravitational
  field, the object''s behaviour, and so on).

  2. Identify the disanalogies: the respects in which a narrative self is unlike a
  centre of gravity. Be specific about which properties of a centre of gravity fail
  to carry over.

  3. Distinguish the disanalogies that matter for the colleague''s conclusion from
  those that are merely superficial. For example, a centre of gravity can lie outside
  a physical object; is that a harmless point of difference or one that undermines
  something?

  4. Say whether the conclusion survives: does the analogy support the claim that
  selves are fictions, and that praise and blame are category mistakes, or does it
  smuggle in an assumption about fictionality and responsibility that the source domain
  cannot license? If only a weakened version survives, state it.

  5. If a better analogy exists, propose one and say exactly what it captures that
  this one misses.


  Structure: after the prose, include a table summarising your audit. Use these columns:

  - Element of the source (centre of gravity)

  - Claimed element of the target (narrative self)

  - Carries over? (yes / partly / no)

  - Disanalogy

  - Whether it matters for the conclusion, and why


  Please write the response in British English (centre, behaviour, licence, and so
  on).


