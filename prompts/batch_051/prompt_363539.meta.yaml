  The key philosophical issue: In possible-worlds semantics, knowledge is a propositional
  attitude closed under entailment because the accessible worlds are all worlds compatible
  with what the agent knows; if P entails Q, any world in which P is true has Q true;
  so all accessible worlds have Q; so the agent knows Q. Thus agents know all consequences.
  Real agents fail. The defensive move: "closure holds for the content of knowledge,
  not for the act of retrieval" — the agent''s knowledge state includes Q implicitly;
  failures are merely computational. But can this be tested?


  An experiment: Train subjects on a small artificial rule system with axioms and
  inference rules (say, a made-up algebra). Give them a set of premises; ask yes/no
  whether a statement follows. Vary proof depth and whether the proof requires combining
  multiple rules vs. a single rule. Measure accuracy, latency, confidence. Then the
  crucial manipulation: after subjects answer "no" (fail to draw a valid consequence),
  show them the consequence and ask "Did this have to be true all along, given what
  you were told?" If they immediately endorse it as entailed with high confidence,
  does that show they knew it implicitly? Or does it show only that they can verify
  once the target is presented (a difference between inference generation and inference
  verification)? To test implicit vs. derivable, one could present the target sentence
  Q with a distractor task that requires only recognising entailment, not generating
  it; but recognition is still derivation.


