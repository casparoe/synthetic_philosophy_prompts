  ---


  I''m a software engineer with no formal philosophy background, and I keep getting
  pulled into a puzzle from a game my friends and I run. The game is in the style
  of Nomic: the rulebook is itself part of the game, and the rules can be changed
  from within, by procedures the rules themselves define. Our constitution is deliberately
  short. Rule 1.2 reads: "A rule change is adopted if it receives the votes of at
  least two-thirds of the members present at a regular meeting." Rule 1.3 reads: "A
  rule change takes effect immediately once the votes are counted and the result is
  announced." When we drafted these two sentences, we were picturing ordinary amendments
  — adding a scoring rule, renaming a role, changing the usual meeting time — and
  it never occurred to us that someone would try to amend the amendment rule itself
  during a vote on that very amendment.


  At last week''s meeting, with ten members present, Proposal 21 was introduced in
  this exact wording: "Rule 1.2 is amended to read: A rule change is adopted only
  if it receives the votes of every member present, and this new unanimity threshold
  also applies to the very vote by which Proposal 21 is adopted." Seven members voted
  in favor and three against. So the proposal passed under the old two-thirds threshold
  but could not have passed under the unanimity threshold it purports to install for
  its own adoption. We are now deadlocked. One camp says it was conclusively adopted,
  because the only rule in force when votes were counted was the two-thirds rule.
  A second camp says it defeated itself, because the text it enacts, applied to its
  own adoption, declares that adoption invalid. A third camp says the retroactive
  clause should simply be severed and the unanimity threshold kept for all future
  votes only. To me, as someone who works with systems that patch their own configuration,
  it all feels like a patch that rewrites its own deployment condition while the deployment
  is still being evaluated.


  Please take the role of a philosopher of legal rules or formal systems and work
  through the problem carefully. In particular: what did the rulebook actually require
  at the moment the votes were counted, and how should an interpreter treat a clause
