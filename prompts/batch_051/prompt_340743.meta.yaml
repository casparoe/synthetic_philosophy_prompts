  - The philosophical debate over whether complicity requires some causal contribution
  (however small) vs merely an expressive/attitudinal element might not map cleanly:
  in fiction, everything a character does *is* on the page and thus seems causal in
  the story. But actually fiction has "negative space"—what''s left out.

  - "Omission" might map to scenes that don''t happen: the unwritten confrontation,
  the withheld confession. Fiction can represent omissions only obliquely.

  - The normative question (how much blame attaches to complicity) might translate
