  Maybe: a character present in a scene but not in the causal chain—an enabler whose
  actions are scene-setting not plot-turning. In scene-craft terms, you distinguish
  "beats" that turn the plot from "color" or "texture." Complicity might map to texture
  that nonetheless carries moral weight—the crowd, the chorus, the enabler. Causation
  maps cleanly to plot mechanics: who does the act that turns the scene. But complicity
  is often about point of view: the reader shares the complicit character''s rationalizations.


