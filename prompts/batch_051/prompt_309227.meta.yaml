  - ''leaves'': a list of objects with ''name'', ''one_sentence_summary'', and ''diagnostic_commitments''
  (the pattern of answers that lands a student there).

  - ''scoring_key'': for a quiz, the rule mapping total points to leaves; for a tree,
  an empty object (or, if the tree terminates at leaves, a note of leaf ids).

  - ''unoccupied_combinations'': a list of objects with ''answer_pattern'' and ''why_nobody_holds_it''.

  - ''flagged_inseparables'': a list of objects with ''position_a'', ''position_b'',
  and ''why_this_instrument_cannot_split_them''.

  - ''reflection'': one short paragraph on which leaf you expect undergraduates to
  land on most often and why.


  No bibliography, reading list, or citations: the instrument should stand entirely
  on the cases and distinctions, not on references.


