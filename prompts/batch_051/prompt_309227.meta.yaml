  ---


  I''m helping teach an undergraduate seminar in philosophy of mind, and last week
  I found myself fixated on the color phi phenomenon after a student asked why philosophers
  make such a fuss about it. In the standard demonstration, a dot flashes in one place
  with one color (say, red), and then a second dot flashes nearby with a different
  color (say, green). Subjects honestly report seeing a single dot travel smoothly
  from the first position to the second and change color roughly mid-way. The puzzle
  is that the early part of the experienced trajectory and the mid-path color change
  are reported as if they had already been "seen" before the second dot appeared —
  yet only the second dot carries the information that specifies the second half of
  the trajectory and the color it should change to. The brain has somehow used later
  information to fill in what the earlier part of the experience was like.


  The usual way philosophers mark out the space of explanations is with two hypotheses,
  plus a skeptic''s option. On the Orwellian story, you really did first experience
  the red dot as red, and the later green information then revised or overwrote your
  memory of that first experience, so the final report is a moving, color-changing
  dot. On the Stalinesque story, the green information was woven in before anything
  reached consciousness at all: you never had a standalone "red dot" experience, and
  the moving, color-changing dot is the only conscious content there ever was. A third
  family of views denies the question has a determinate answer, because it presumes
  there is a definite moment at which a content "becomes conscious" — and that moment,
  on this view, is an artifact of a bad picture of the mind rather than something
  to be found. I want a teaching instrument that sorts students by which of these
  structural pictures their own answers commit them to, without ever asking them to
  choose a theory by name.


  That''s the background; here''s the task. Act as a philosopher of mind who is also
  an unusually clear designer of teaching materials. Begin by brainstorming the concrete
  cases and candidate distinctions you might use, then think carefully about which
  combinations of answers are actually coherent before attaching names to them. Then
  produce the deliverable: either a decision tree or a "which view do you actually
  hold?" quiz with a scoring key, whichever you think better separates the positions
  for first-time students. Include at least these leaves: Orwellian memory revision;
  Stalinesque pre-conscious integration; no-fact-of-the-matter (multiple-drafts-style);
  and a fourth substantive position of your choosing that earns its place (it should
  be a real position a student could be sorted into, not a residual "other"). Keep
  it to between six and nine diagnostic questions, landing in four to six leaves.
  The questions should be concrete cases — the color phi itself, flash-lag or apparent
  motion demonstrations, backward masking, or similar — phrased so students can answer
  from their own judgments about what "seems right" without knowing any of the labels.
  Do not ask any question of the form "which of these theories do you accept?" Build
  from the logical space rather than from the list of names: first the questions and
  the combinations of answers they allow, then locate the named positions in that
  space, and explicitly note any combinations of answers that are logically open but
  that you believe nobody actually occupies, with a one-sentence diagnosis of why
  (incoherent, unattractive, or merely unexplored). Also flag any pair of leaves your
  instrument cannot genuinely separate, rather than pretending a question splits them.


  Please return the instrument as a JSON object with this schema:


  - ''format'': either "tree" or "quiz".

  - ''instructions'': a short preamble a student would read before answering.

  - ''questions'': a list of objects, each with ''id'', ''text'', and ''options'';
  each option has ''label'', ''response'' (the wording the student would assent to),
  and either ''leads_to'' (the id of the next question, for a tree) or ''points''
