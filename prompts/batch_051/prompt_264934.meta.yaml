  Desiderata for a theory of death''s badness:

  1. It must make sense of the deprivation account''s core idea that death is bad
  because it deprives you of goods you would otherwise have had — and explain why
  that doesn''t collapse into "more life is always better" (which would make any death,
  even at 105, equally tragic).

  2. It must handle the timing problem: when is death bad for the deceased? Before
  death (anticipation)? After death (nonexistent no subject)? At the moment? A theory
  has to say where the harm lives, or explain why the question is ill-posed.

  3. It must say whether death is bad for the person, in a way that doesn''t require
  an existing subject to be harmed — because after death there is no subject on standard
  accounts. This is the subject problem.

  4. It must address Lucretius''s symmetry: if prenatal nonexistence is not bad, why
  is posthumous nonexistence bad? A theory can''t just dodge; it must either find
  an asymmetry or bite the bullet that prenatal nonexistence also matters (or that
  posthumous doesn''t).

  5. It must distinguish depression of being dead from the process of dying (pain,
  fear, grief to others), and not let the badness of dying do all the work.

  6. It must be consistent with what we know about the mind/body: if death is annihilation,
  there''s no lingering subject. If the theory requires a subject, say how.

  7. It should explain why we treat killing as a special wrong — not just because
  of the victim''s relationships to survivors, but the victim''s own loss — or else
  bite that bullet.

  8. It should explain the variable badness: death of a 4-year-old worse than an 90-year-old;
  death in a happy life worse than in a miserable one. And whether death can be good
  for some (Mercy-killing).

  9. It should handle the "more life of low quality vs less life of high quality"
  comparison (quality-adjusted).

  10. It might need to respect that birth (coming into existence) isn''t bad even
  though it starts a life that will end; asymmetry again.


