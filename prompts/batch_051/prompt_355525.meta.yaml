  "In the philosophy of consciousness a dispute has run for decades without anyone
  visibly changing position, and I want a diagnosis of the disagreement itself, not
  a verdict on it. The material case is the color phi phenomenon: a subject is shown
  two brief flashes of different colors at two separated locations in rapid succession,
  and reports a single dot moving across the gap and changing color somewhere in the
  middle of its path — before the second flash could physically occur. One camp, the
  Stalinesque one, says conscious experience is delayed: the brain waits for the second
  flash, constructs a single moving-and-color-changing percept, and only then does
  the subject become conscious of it, so there is no earlier, unrevised experience
  to be edited. The other camp, the Orwellian one, says the subject is conscious of
  something before the second flash arrives, but the later information causes a retrospective
  rewriting of the conscious record, so any earlier experience becomes inaccessible
  and is replaced by the revised one. As far as the subject can tell, and within broad
  limits as far as the neural data are concerned, the two accounts fit everything.
  My working theory is that the argument is stuck because the two sides are answering
  different questions under one heading: one is making a claim about the content of
  an experience — what the experience represents as happening and when — while the
  other is making a claim about the vehicle of experience — the process that realizes
  it and the time that process takes. If that is right, the debate is not, in the
  first instance, an empirical debate about where in the brain things happen. But
  I am not sure that diagnosis is right, and I want it tested. Diagnose this disagreement:
  is it verbal, substantive, or ill-posed; what exactly would have to be true for
  one side to be factually wrong; and what, if anything, would count as progress —
  a distinction, an experiment, a formal result about temporal representation, or
  a change of question? If you think no progress should be expected, say why that
  conclusion is more than just an admission of defeat."


