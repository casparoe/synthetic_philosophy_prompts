  "There is a dispute in the philosophy and science of consciousness that has persisted
  for decades without any sign of resolution, and I want a diagnosis of the disagreement
  rather than a verdict on it. The case at the center is the color phi phenomenon:
  a viewer is shown two briefly flashed, spatially separated dots of different colors
  in rapid succession, and reports seeing a single dot move across the gap and change
  color around the midpoint of its path, before the second dot is actually presented.
  One family of explanations, which Daniel Dennett called Stalinesque, holds that
  consciousness is delayed: the second flash is already registered before the unified
  percept is constructed, so the viewer never actually experiences the earlier, unrevised
  version. The rival family, which he called Orwellian, holds that the viewer does
  consciously experience something before the second flash arrives, but that the later
  arrival causes a retrospective rewriting of the record, so the earlier experience
  is lost to memory and replaced by the revised one. The two stories are told, within
  limits, to accommodate the same introspective reports and the same physiological
  timing data. The debate has not moved, and I am no longer sure it is an empirical
  debate at all. My working hypothesis is that the disagreement is not really about
  what happens in the brain, but about what one is committing to when one says an
  experience occurs at a time: the Orwellian and the Stalinesque accounts divide on
  whether experiencing is a process with a determinate start and finish that can be
  edited or delayed, and neither side has said what a decisive experiment would have
  to measure. Is that diagnosis right, or is there a hidden factual question that
  actually separates them? Diagnose the disagreement, being explicit about which moves
  would show it to be verbal, which would show it to be substantive, and which would
  show the original question to be ill-posed. Then say what, if anything, could count
  as progress: a new experimental paradigm, a formal result about temporal representation,
  a conceptual distinction, a change of question, or a reason to expect no progress
  at all."


