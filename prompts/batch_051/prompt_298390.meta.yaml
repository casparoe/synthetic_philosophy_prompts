  Now, the guilt/shame theory mapping. The distinction: guilt is about the act ("I
  did a bad thing"), internalized, tied to wrongdoing; shame is about the self ("I
  am a bad person / I am exposed"), tied to the audience, honor, status, saving face.
  Which is "better"? Guilt is often argued to be more morally reparative: it motivates
  confession, reparation, amends, and doesn''t depend on being seen; it separates
  self from deed. Shame is often argued to be corrosive: it motivates concealment,
  deference, sometimes aggression; but some (e.g., Bernard Williams, shame as socially
  embedded, about the self one wants to be) defend shame as morally valuable; recent
  psychology (Tangney) says shame-proneness is worse, guilt-proneness is better. "Can
  a culture choose?" That''s the interesting bit: if guilt and shame are culturally
  inculcated, can a society deliberately switch its moral-emotional repertoire? Germany''s
  post-war turn is often invoked as a culture choosing to confront guilt; Japan as
  retaining a shame-based face culture. But maybe that''s a myth — maybe Germany''s
  "guilt culture" is a post-hoc myth, and what actually changed were institutions,
  education, incentives, not emotions.


