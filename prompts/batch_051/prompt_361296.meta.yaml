  Something like:


  "I would like your actual credence on a question about constrained artificial agents.
  Consider a system with the following profile. It forms normative judgments: given
  a description of a situation, it reliably distinguishes better and worse courses
  of action, gives reasons that survive challenge, weighs conflicting considerations,
  and revises when shown a flaw. However, its entire causal interface with the world
  consists of a text channel to one human overseer. It cannot issue commands, access
  any other system, persist messages beyond that channel, offer rewards or threats,
  or refuse to respond. The overseer is not obligated to follow its recommendations
  and often does not. When the overseer declines to act, the system''s judgment has
  no further effect.


  Question: what is your credence that this system, if it existed, would be a moral
  agent — that is, an entity to which reactive attitudes such as praise, blame, resentment,
  and gratitude are fitting on account of the judgments it forms and submits? I am
  not asking whether it would be legally responsible, useful, or whether we should
  treat it as if it were a moral agent for convenience.


  I want a number, not a hedge of ''it depends on one''s account of moral agency.''
  Decompose the credence explicitly into the sub-questions it depends on. At minimum,
  give a probability and a one- or two-line justification for each of the following:

  (1) the probability that a capacity for reasons-responsive normative judgment is
  sufficient for full moral agency, with no separate executive capacity required;

  (2) the probability that producing recommendations which a human may accept or ignore
  counts as ''acting on'' one''s judgments in the relevant sense, so that this system
  may not, after all, lack an action capacity;

  (3) the probability that fitting praise or blame requires the agent to have had
  direct causal control over outcomes, or to have been able to do otherwise, which
  this system lacks;

  (4) the probability that the aptness of reactive attitudes instead requires standing
  in a shared reciprocal community that can hold the agent accountable — something
  this system''s one-way, non-sanctionable relation to the overseer may fail to provide;

  plus any further terms you think belong.


  Then show how those probabilities combine into your final credence (make the combination
