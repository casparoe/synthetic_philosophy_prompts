  Bertrand Russell writes in "On Denoting": "All thinking has to start from acquaintance;
  but it succeeds in thinking about many things with which we have no acquaintance."
  I am a novelist, and I have been puzzling over what this claim means for fictional
  names. When I write that a character did something, I seem to be thinking about
  that character, and my readers certainly take themselves to be thinking about the
  character as well; but neither of us is acquainted with any such entity. I want
  an essay that uses Russell''s claim, and his broader theory of denoting phrases,
  to settle the following controversy: does a name like "Sherlock Holmes" refer, and
  what exactly is true in the stories? Some people say sentences like "Sherlock Holmes
  lived in Baker Street" are true in the fiction but false outside it; others say
  they aren''t really true at all, only prefixed by an implicit "in the fiction" operator;
  others say the name refers to an abstract object created by Conan Doyle. Weigh the
  main positions, including the Russellian one that the name is not a genuine referring
  expression but a disguised description or an existentially quantified phrase, and
  reach a definite verdict about what the best account of truth in fiction is. I would
  rather you defend one view than end in a draw, though a qualified conclusion is
  fine. Also, if my framing of the problem already presupposes something wrong—for
  example about acquaintance, reference, or truth—say so directly and correct the
  premise instead of writing around it. Please write this as a continuous piece of
  prose, in the register of an essay; do not use headings, bullet points, bold text,
  or tables.


