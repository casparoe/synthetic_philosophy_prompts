  Bertrand Russell writes in his 1905 article "On Denoting": "All thinking has to
  start from acquaintance; but it succeeds in thinking about many things with which
  we have no acquaintance." I am a novelist, and this sentence has unsettled the way
  I think about my own work. When I write that a fictional character did something,
  I seem to be thinking about that character, and my readers take themselves to be
  thinking about her too; yet neither of us is acquainted with any such entity. I
  want an essay that makes this passage do real work in settling a controversy about
  fiction. The controversy is this: does a name like "Sherlock Holmes" refer, and
  what is true in the stories? Some hold that sentences like "Sherlock Holmes lived
  in Baker Street" are straightforwardly true within the fiction but false without;
  some hold that they are not really true at all, but shorthand for an implicit "in
  the fiction" prefix; some hold that the name refers to an abstract object, an artifact
  of Conan Doyle''s writing. Weigh these positions together with the Russellian view
  that the name does not function as a genuine referring expression but as something
  like a disguised description or a quantified phrase. I would like you to reach and
  defend a definite verdict rather than ending in a draw, though a carefully qualified
  conclusion is acceptable. And if the way I have framed the problem already confuses
  something—whether about acquaintance, reference, or the notion of truth in fiction—please
  say so plainly and correct the premise instead of writing around it. Do not use
  headings, bullet points, bold text, or tables; write in continuous prose, like an
  essay in a letter.


