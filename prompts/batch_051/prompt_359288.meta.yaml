  since there are simulated utopias too. And Bostrom''s trilemma itself is derived
  from probability of civilizations running many sims — which presupposes exactly
  the kind of long future of technological civilizations the fanatic is worried about.
  If anything, accepting the simulation argument means accepting that some civilizations
  do get far enough to run ancestor simulations, i.e., the far future is not a fairy
