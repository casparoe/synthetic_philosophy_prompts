  Then Friend 1 replies: The whole argument for longtermism rests on a small probability
  of affecting a vast number of actual future people. The simulation argument adds
  an additional layer of model uncertainty about whether that vast future even exists
  in the way our extrapolations assume: a future where our decisions propagate to
  descendants colonizing galaxies. In a simulation, the simulators may stop, rewind,
  branch, or filter. So the probability density over futures becomes even more diffuse,
  and the fanatic''s key bet looks worse. It''s not that the future is unreal, it''s
  that the tail seems even less knowable.


  Friend 2 replies: But the same move applies to any future: uncertainty about simulation
  doesn''t make the expected value smaller; it just redistributes it. If you thought
