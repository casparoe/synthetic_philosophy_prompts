  I chair the clinical ethics advisory group at a teaching hospital. The group meets
  weekly for ninety minutes and reviews four or five consults, most of them from intensivists,
  obstetricians, and palliative care. Its recommendation goes to the attending physician
  and, when the group cannot agree, to the hospital legal and risk office. The other
  members are an intensivist, two bedside nurses, a palliative care physician, a social
  worker, and a chaplain. None of them has formal training in moral philosophy, and
  they do not need another restatement of the trolley cases; they need a working instrument.


  Write a decision procedure the group can use, week after week, to decide when a
  proposed intervention with a serious and foreseen harmful effect may be endorsed
  on the strength of the doctrine of double effect, and when the consultation should
  refuse to offer that rationale.


  The procedure should be a sequence of tests to be applied in order, in table form.
  The table columns are:


  Step, Question to ask, Passes if, Fails if, Judgment required.


  For each row, the question must be phrased in plain language a nurse or chaplain
  could put to a physician without a degree in philosophy. The passes if and fails
  if entries should name the kind of evidence that would count, with examples from
  clinical practice, not merely restate the four traditional conditions. The judgment
  required entry should be left empty where the principle really does the work, and
  should otherwise state exactly which point cannot be settled by the doctrine and
  what the group has to decide for itself.


  The procedure must keep three distinctions separate from the beginning and must
  not assume that they track one another: intending a harm versus foreseeing it and
  accepting it; doing a harm versus allowing it; and causing an outcome versus failing
  to prevent it.


  The procedure must also face what is usually called the closeness problem. Consider
  the familiar contrast. A surgeon proposes, for a woman with aggressive uterine cancer
  at twenty weeks of pregnancy, to remove the gravid uterus; the mother is expected
  to survive and the fetus is expected to die. Another surgeon proposes, in a case
  of obstructed labor, to perform a craniotomy and reduce the fetal skull to deliver
  the mother; the mother is expected to survive and the fetus is expected to die.
  The received doctrine treats the hysterectomy as compatible with double effect and
  the craniotomy as not, even though the death of the fetus is certain in both cases
  and sits somewhere on the causal route to the good effect. Write the procedure so
  that a non-philosopher can actually draw that distinction, or can discover when
  it cannot be drawn and explain why the case falls outside the doctrine''s jurisdiction.


  Then apply the procedure to three cases, in a second table. The table columns are:


  Case, Step at which the procedure stops, Verdict, Decisive judgment call.


  Use these cases: first, escalation of opioids for refractory dyspnea in a patient
  with end-stage chronic obstructive pulmonary disease, with respiratory depression
  and possible earlier death anticipated, and the prescribing physician stating that
  the intention is relief of air hunger; second, hysterectomy for uterine cancer at
  twenty weeks of pregnancy; third, a craniotomy in obstructed labor to save the mother
  when the fetus is expected to die. For each case, if the recorded information is
  insufficient, state the assumption you are adding and mark it as an assumption.
  Make sure that at least one worked case returns a verdict that a typical clinical
  ethics committee would resist, and say plainly why the procedure returns it.


  After the tables, add a short epistemic status note of no more than three paragraphs.
  Distinguish what is settled about the doctrine of double effect from what is genuinely
  contested among philosophers who work on it, including at least the following: whether
  the distinction between intended and merely foreseen consequences can be drawn without
  the closeness problem collapsing it, whether the doctrine adds anything over a doing
  and allowing distinction, and whether agents are reliable enough at introspecting
  their own intentions for the procedure to rest on such testimony. Do not present
  a contested reading as the consensus. Where the procedure adopts one defensible
  position among several, say so explicitly.


