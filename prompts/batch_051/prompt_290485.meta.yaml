  Let me think about DDE conditions:

  1. The act itself must be morally good or at least indifferent (not intrinsically
  wrong).

  2. The agent may not positively will the bad effect but may permit it. If he could
  attain the good effect without the bad effect, he should do so. (The bad effect
  must not be intended as an end or as a means.)

  3. The good effect must flow from the action at least as immediately (in the order
  of causality, though not necessarily in time) as the bad effect. In other words
  the bad effect must not be the means by which the good effect is produced.

  4. The good effect must be sufficiently desirable to compensate for the allowing
  of the bad effect (proportionality).


