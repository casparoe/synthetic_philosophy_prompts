  Let''s design a debate that is genuinely about meta-level: how to act under moral
  uncertainty. The two sides:


  - Ana: When unsure which moral theory is right, you should do the action with the
  highest expected moral value, weighing theories by how likely you think they are.
  If there''s a nontrivial chance that eating meat is seriously wrong, that risk should
  dominate, so you ought to stop.

  - Ben: But expected value across theories assumes you can compare "how wrong" actions
  are on different theories, and different theories don''t share a common unit. Also,
  a small chance of a very large wrongness could then demand absurd sacrifices. It''s
  more sensible to act on the theory you actually believe most, and let further reflection
  sort it out. If you''re 90% confident that eating meat is fine, you shouldn''t be
  vegetarian based on a 10% chance of an incommensurable wrongness.

  - Ana: But you wouldn''t take a 10% risk of killing a person unknowingly; you would
  refuse even if 90% likely it''s fine. So if you think there''s a 10% chance animals
  have moral standing comparable to humans, consistency demands you stop eating them.
  Probability-of-wrongness matters, not just probability-of-theory.

  - Ben: The person case is different because all parties agree about the badness
  of killing persons; the uncertainty is factual (is there a person?), not moral.
  With animals, the disagreement is about what makes something wrong at all, so you
  can''t transfer the "precautionary principle" straightforwardly — different theories
