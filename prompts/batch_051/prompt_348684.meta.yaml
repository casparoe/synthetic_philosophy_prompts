  "Consider the golden rule, in its familiar positive form: the instruction to treat
  others as you yourself would wish to be treated. One of the long-standing objections
  to it is that it makes the wrong standard of good treatment — the agent''s own preferences
  — when what matters is how the treatment meets the other person from the inside.
  A second, more practical difficulty is that people are often badly mistaken about
  what an action feels like to the person on the receiving end, and can be self-servingly
  mistaken."


  "Now imagine a counterfactual. Beginning on the first of January next year, a cheap,
  harmless compound (call it ''second-person supplement''? maybe ''Prospician'') becomes
  available over the counter. A single dose gives the user, for the following twelve
  hours, an ordinarily reliable and vivid first-person sense of how his or her choices
  feel to each of the specific people those choices directly affect: physical sensations,
  frustrations, humiliations, relief, gratitude, fear. The experience is entirely
  informative and carries no compulsion; users still decide what, if anything, to
  do differently. There are no other direct effects on personality, and the supplement
  works only forward from choice to likely effect, not for investigating the past."


