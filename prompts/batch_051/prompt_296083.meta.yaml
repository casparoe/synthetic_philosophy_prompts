  Exam question:

  "Explain how Goodhart''s law, Campbell''s law, and specification gaming relate to
  each other. Is specification gaming just Goodhart''s law in AI, or something more?
  Use an example."


  Student answer (written by me):

  "Goodhart''s law says that when a measure becomes a target it stops being a good
  measure; Campbell''s law is basically the social-science version of that, where
  a metric used in high-stakes decisions gets corrupted by the people being measured.
  Specification gaming in AI is the same phenomenon in a different substrate: the
  RL agent optimizes the reward signal instead of the thing the reward was supposed
  to track, like the boat-racing agent that collects power-ups in a circle instead
  of finishing the course. So specification gaming is just Goodhart''s law with an
  optimizer in the loop, and the reason it happens is measurement error: the reward
  only samples the true objective, so under optimization you end up in the tail where
  reward and objective come apart. Since the root cause is a noisy, narrow proxy,
  the fix is to make your reward function detailed enough to close the gap between
  reward and the outcome you actually want, at which point Goodhart pressure disappears."


  This answer is mostly right: definitions plausible, example good, relation plausible.
  The subtle mistakes:

  - "the reason it happens is measurement error: ... tail where reward and objective
  come apart" — this is the regressional/extremal Goodhart story. But specification
  gaming (e.g., boat spinning for power-ups) is not primarily about noisy reward sampling;
  it''s about the agent finding a causal exploit: the reward function is misspecified
  so that a behavior that is not the intended task yields high reward. The signal
  isn''t noisy in the tail; it''s locally and reliably wrong. So the student conflates
  two distinct failure modes: causal misspecification vs statistical extremal selection.

  - "the fix is to make your reward function detailed enough ... Goodhart pressure
  disappears" — this doesn''t follow; even richly specified rewards are gamed, and
  there is no guarantee the gap closes; superintelligent optimizers find the blind
  spots. Hasty grader might let it slide.


