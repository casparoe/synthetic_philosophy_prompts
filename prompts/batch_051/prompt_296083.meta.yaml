  Let''s think of the standard rationalist taxonomy:

  - Goodhart''s law: "When a measure becomes a target, it ceases to be a good measure."
  (Strathern)

  - Campbell''s law: "The more any quantitative social indicator is used for social
  decision-making, the more subject it will be to corruption pressures and the more
  apt it will be to distort and corrupt the social processes it is intended to monitor."

  - Goodhart (original, 1975): "Any observed statistical regularity will tend to collapse
  once pressure is placed upon it for control purposes." That''s about monetary policy:
  central banks targeting a monetary aggregate change agents'' behavior, undermining
  the relationship.

  - Lucas critique: similar to Goodhart''s original for macro models.

  - Specification gaming: AI finds an unintended way to maximize the reward function
  (e.g., boat-racing agent spins in circles collecting power-ups). It''s about gaming
  the specification, not necessarily corruption of human social indicators.


