  ---


  I run a once-a-month reading group of about fifteen people, mostly engineers and
  data analysts who have spent years on LessWrong and adjacent blogs. They are comfortable
  with simple formal notation and short proofs, but none of them has worked through
  social choice theory beyond a rough memory of Arrow''s theorem. In two weeks I''m
  leading one forty-five-minute session on Sen''s liberal paradox, and I want you
  to design the teaching plan, not the explanation itself.


  I want the session to make the impossibility feel forced rather than clever or ideological.
  I''ve seen this topic go wrong in two predictable ways: people come away thinking
  Sen showed that liberalism is self-contradictory, or they think the example is rigged
  by letting people care about what others read.


  Please structure your response in the following named sections, in this order, with
  the rough lengths given:


  1. Prerequisites and notation (about 120 words): what the audience must already
  have in view before the paradox is stated, and the minimal notation to put on the
  board first. Say explicitly which pieces of Arrow''s framework I can skip because
  they are not load-bearing for Sen''s result.


  2. Order of ideas (about 300 words): the sequence in which the components must be
  introduced — individual preference orderings, a social decision function, Pareto
  efficiency, minimal liberalism as local decisiveness over a protected pair, and
  the resulting cycle — and what depends on what. I want the dependency structure,
  not a prose summary of the theorem.


  3. The carrying example (about 250 words): the one worked case that carries the
  session. Tell me what structural features it must have and must avoid. In particular,
  tell me whether to use the standard Lady Chatterley''s Lover example or a desexualized
  substitute with identical logical features, and lay out the two preference orderings
  and the two protected pairs so that the cycle can be read directly off the blackboard.


  4. Misconception map (about 300 words): the predictable confusions this crowd will
  form and the exact point in the sequence where each should be headed off before
  it solidifies. At minimum, address: treating rights as especially intense preferences;
  confusing the result with Arrow''s theorem; thinking the example is rigged by the
  nosy-preferences assumption; and thinking the problem disappears if one weakens
  transitivity to acyclicity or drops only one person''s protected pair.


  5. Check for understanding (about 100 words): one question or one-minute exercise
  I can run at the end that would distinguish someone who has understood the impossibility
  from someone who has merely memorized the conclusion.


  6. What to leave out (about 100 words): the material I should explicitly decline
  to cover at this level — for example, the literature on whether rights should be
  modeled as game forms rather than decisiveness — and one sentence I can use when
  someone tries to pull the discussion there.


  Do not include a reading list or ask me to fetch any source; the plan should be
  runnable entirely from the page.


