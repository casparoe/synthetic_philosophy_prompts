  Scanlon''s contractualism (from What We Owe to Each Other, 1998, and earlier papers):
  An act is wrong if its performance under the circumstances would be disallowed by
  any set of principles for the general regulation of behaviour that no one could
  reasonably reject as a basis for informed, unforced general agreement. Two key features:
  (1) individualist constraint — justifiability to each person individually, considering
  each person''s reasons/objections, not the aggregate of claims; (2) the role of
  reasonableness.


  The aggregation problem: Scanlon says contractualism doesn''t allow aggregation
  of claims across individuals. In a case where we can save either one person or five
  people (Taurek''s case), Taurek argues numbers don''t count — you should flip a
  coin; each person has equal claim. Scanlon, in "What We Owe to Each Other," discusses
  the "World Cup" case (Jones in the transmitter room): if Jones is in a World Cup
  broadcast room and he''s being electrocuted, we can either save him by interrupting
  the broadcast (disappointing millions of viewers) or save the broadcast and let
  Jones die. Scanlon argues that the pleasure/interests of millions of fans don''t
  outweigh Jones''s claim to be rescued, because their mild interests don''t aggregate
  to outweigh a serious harm to one. This shows the individualist restriction: we
  compare Jones''s strong claim against each viewer''s weak claim individually, not
  the sum.


