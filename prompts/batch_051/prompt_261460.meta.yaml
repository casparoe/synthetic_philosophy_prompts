  principle for the general regulation of behavior that no one could reasonably reject.
  The key constraint is that each person''s reasons must be considered individually.
  In the transmitter room case, a technician is stuck in pain, and a huge number of
  people would miss part of a broadcast if we rescue him immediately. The utilitarian
  says: his serious pain is outweighed by the small annoyance of millions. Scanlon
  says no: the principle allowing his serious pain to be outweighed by many tiny inconveniences
  could be reasonably rejected by the technician. Each viewer only has a trivial complaint,
  and you can''t add trivial complaints together to defeat a single weighty complaint.
  That''s his rejection of aggregation. Because of this, Scanlon''s view implies that
  numbers never count: if we must choose between saving one and saving five, the number
