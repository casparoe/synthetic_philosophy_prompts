  They feel consistent to me in a broad way, but I can''t state the rule behind them,
  and one pair of them may not be coherent. I''d like you to help me find the principle,
  or set of principles, that best captures my verdicts and to tell me honestly which
  of my verdicts it forces me to revise."


  Then list cases with verdicts.


  Case 1: Two patients, one intensive-care bed. Patient A is 19, will recover and
  live ~60 years in full health. Patient B is 81, will recover and live ~7 years in
  full health. Neither more responsible for condition etc. Verdict: give bed to the
  19-year-old.


