  ---


  Two coworkers of mine got into a sustained argument over lunch about a request our
  company was handling. I work as a software engineer on a discussion platform with
  users all over the world. A government in one country had sent us a formal demand:
  remove a post written by a user in a second country, because the post is illegal
  under the first country''s laws, even though it is entirely lawful where the user
  lives and where our company is headquartered. I mostly listened and stayed out of
  it; I have no formal training in law or philosophy, and I could not tell which of
  them was getting the better of the argument.


  Dana''s position was that the only workable rule is to treat speech as governed
  by the law of the place where the speaker published it — in practice, the user''s
  country, or at most the platform''s home country. Speech, she said, is an act done
  somewhere, and letting every country that can reach a page prosecute or suppress
  it would turn each of the world''s speech codes into a global speech code. She was
  willing to geoblock the post inside the requesting country, since that country plainly
  has jurisdiction over its own residents, but she insisted we should not remove it
  globally. Amal disagreed. He said Dana was thinking of the internet as though it
  had a single location, when what actually matters is that the post is delivered
  to readers in the requesting country and the harm the law aims at occurs there.
  A platform that deliberately serves users in a country, collects their data, and
  takes their money, he argued, is operating there and cannot claim to be beyond its
  laws. Dana replied that Amal''s principle would make the strictest speech law on
  earth the law for everyone, because a platform reachable from nearly all countries
  would have to satisfy all of them at once. Amal said her principle has the same
  flaw in reverse: platforms would cluster in the most permissive jurisdictions, hosts
  would race to the bottom, and every country''s local speech protections would be
  undercut from outside. By the end they were disputing whether "the place where speech
  happens" even means anything on a distributed network, and whether the internet
  can be governed one country at a time at all.


  Could you go through this exchange and sort out who is right about which specific
  point, and what both of them are missing?


