  intentionally brought it about that you are the way you are. (4) But you can''t
  be truly responsible for the way you are, for that would require an infinite regress
  of choices; ultimately you''d have to be causa sui, the cause of yourself. (5) So
  you can''t be truly or ultimately responsible for what you do."


