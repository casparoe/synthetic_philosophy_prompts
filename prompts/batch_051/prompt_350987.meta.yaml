  handle this with pre-registration, masking, correction for multiple comparisons,
  hold-out sets, etc. The evidential value of a dataset is diminished when the hypothesis
  is "fitted" to it. Bayesian contingent sometimes says this isn''t a problem if you
  report posterior odds, but there are issues with "prior selection after seeing data"
  / "Bayesian data snooping" (the prior is supposed to be formulated before seeing
