  Since I retired from a career in the natural sciences, I have been reading my way
  through Bayesian confirmation theory, and a comparison keeps presenting itself that
  I am not competent to settle on my own.


  The first side is what the literature calls the problem of old evidence. Suppose
  a fact E was already firmly accepted before a hypothesis H was proposed, and H would
  explain or entail E. If E is old news, its probability for the scientific community
  is 1, and if H entails E, the probability of E given H is also 1. The likelihood
  ratio P(E|H)/P(E) is then 1, so by the usual Bayesian criterion E cannot confirm
  H. Yet the history of science treats exactly such facts as strong support for newly
  proposed theories; the way Newtonian mechanics absorbed known planetary regularities,
  or the way general relativity retrospectively explained the long-observed anomaly
  in Mercury''s perihelion, are the stock illustrations. The proposed remedies largely
  proceed counterfactually: subtract E from the background information and ask how
  much E would have raised the probability of H against that revised background.


  The other side comes from my old professional life. In experimental statistics one
  is taught that if the data are inspected first, and the hypothesis or the analysis
  is then chosen because the same data suggest it, those data cannot also count as
  the independent confirmation of the hypothesis. That is the rationale behind pre-registration,
  corrections for multiple comparisons, and holding out a validation sample. The diagnosis
  there is also chronological: evidence gathered before the hypothesis was fixed has
  a different standing from evidence gathered after.


