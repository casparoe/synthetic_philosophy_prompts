  The problem of old evidence as formulated by Glymour: Suppose hypothesis H entails
  (or strongly predicts) evidence E, which was known before H was proposed. According
  to Bayesian confirmation theory, E confirms H iff P(H|E) > P(H). Equivalent: P(E|H)
  > P(E). But since E is already known, P(E) = 1 (agent''s current probability for
  E is 1). Also P(E|H) = 1 if H entails E. So no confirmation. Yet intuitively E does
  support H (the classic example: Mercury''s perihelion advance was known before Einstein''s
  GTR and was taken to confirm GTR). Similarly, Newtonian mechanics confirmed by old
  observations; Darwin''s theory by known facts of biogeography. Solutions involve
  computing confirmation using P_new, a probability function that subtracts out E
  ("prior probability of E given background sans E"). One classic solution: Howson''s
  counterfactual approach: evaluate E''s support for H against a background that removes
  E. Another: assign non-extreme probability by pretending we don''t know E. Another
  (Earman): old evidence can confirm if we distinguish the hypothesis''s discovery
  from its assessment. Also Christensen, Chihara etc.


