  to know what it would take for it to be false.


  Here''s the kind of thing that worries me. Imagine a spectrum of experiences. At
  one end: two years of excruciating pain. At the other: a very, very long period
  of pain so mild it''s barely noticeable — say a dull ache for many decades. In between,
  each step drops the intensity just a little while the duration increases. The standard
  spectrum argument says: for each adjacent pair, the slightly less intense but much
  longer pain seems worse than the one before it (or at least not better); so if transitivity
  holds, the endpoint must be worse than the starting point. But intuitively the two
  years of excruciating pain is worse than the decades of dull ache. So something
  has to give: either transitivity, or one of the adjacent comparisons, or the endpoint
  intuition.


