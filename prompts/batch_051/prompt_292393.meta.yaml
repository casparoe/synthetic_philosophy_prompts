  Let me brainstorm ECL prompt in detail.


  Concept: Evidential decision theory (EDT) says choose the act whose performance
  would be best news about the world. In Newcomb''s problem, one-boxing is good news:
  if you one-box, the predictor probably predicted you''d one-box and put $1M; so
  EDT one-boxes. Causal decision theory (CDT) says only the causal consequences matter:
  the money is already in the box, so take both boxes. EDT then faces issues when
  the correlation is spurious/rigged.


  Evidential cooperation in large worlds (ECL) is a defense/recognition: EDT-like
  reasoning ("what does my action say about similar agents with whom I''m correlated?")
  becomes more plausible when there''s no perfect predictor but a huge world with
  many agents facing structurally identical choices. Your choice doesn''t cause their
  choices, but it''s evidence about them (e.g., if you''re all running similar reasoning
  or share a common policy). In a large world, the expected number of "copies"/similar
  agents who one-box vs two-box correlates with your decision; so one-boxing might
  maximize expected value across the ensemble even though each individual causal effect
  is zero. This yields a kind of "acausal" cooperation/coordination: act as a representative
  of a policy, because your decision predicts what similar agents will do.


  Kant''s categorical imperative: "Act only according to that maxim whereby you can
  at the same time will that it should become a universal law." One interpretation:
  when deciding, consider what would happen if everyone acted on the same maxim. Another:
  act such that your maxim could be a universal law of nature. This has a structural
  similarity: you evaluate your action not just by its individual consequences but
  by the world where your maxim is universalized. ECL replaces the "will that it become
  universal law" with "your action is evidence that similar agents will act likewise."
  So both say: in deciding, treat your choice as if it determines/selects the policy
  of all similar rational beings. ECL provides an instrumentalist mathematical foundation
  for something like Kant''s universalization test: in a large world, an agent who
  maximizes expected utility and takes into account the correlations will act roughly
  as if following universalizable maxims, even without deontology.


