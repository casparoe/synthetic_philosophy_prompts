  isn''t one you''d estimate payoffs in; it''s a test of whether the maxim could coherently
  be willed.

  - ECL is still consequentialist/decision-theoretic: the reason to one-box or cooperate
  is your own expected utility across the ensemble. Kant would reject that grounding
  of duty in payoff.

  - Kant''s universality is about all rational agents as potential lawgivers, not
  merely statistically similar agents in a large cosmology. ECL depends on contingent
  correlation/duplicate structure; if your decision isn''t actually evidence of others'',
  the reason collapses, whereas Kant''s requirement wouldn''t.

