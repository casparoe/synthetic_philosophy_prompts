  The appraisal vs bestowal distinction: appraisal theories say love is a positive
  appraisal of the beloved''s valuable properties (beauty, character, wit), and love
  is justified by those properties. Bestowal theories (often credited to Irving Singer)
  say love creates value: the lover bestows value upon the beloved, so that the beloved
  becomes valuable to the lover—and perhaps in the world—through being loved. Frankfurt''s
  view: love is not rational in the sense of being justified by qualities; instead
  it''s a fact about the lover''s will, what he cares about, and it gives reasons
  rather than responds to them. Velleman (Kantian): love is not a response to particular
  qualities but to the person''s rational nature, their incomparable value as an end;
  so it''s appraisal but of personhood not properties. Kolodny: love is a response
  to the value of the relationship and its history, not intrinsic qualities. The prompt
  could gesture at these.


