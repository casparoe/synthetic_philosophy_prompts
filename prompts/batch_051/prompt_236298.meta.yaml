  Standard objections/moves:

  1. The supererogation objection: consequentialism leaves no room for supererogatory
  acts (acts beyond duty) because it makes maximizing acts obligatory; thus it cannot
  account for the distinction between duty and saintliness.

  2. The integrity objection (Bernard Williams): constantly being required to abandon
  one''s deepest commitments/projects dissolves one''s integrity; consequentialism
  alienates us from our own lives and ground projects.

  3. The negative responsibility / one thought too many (Williams): a person saving
  his wife and being asked to justify by one thought too many; or that the consequentialist
  is responsible for what others do (Jim and the Indians).

  4. The psychological impossibility / motivational objection: it''s psychologically
  impossible for humans to be motivated by impartial maximizing all the time; a theory
  demanding this is not actionable, and "ought implies can."

  5. The partiality / personal relationships objection: we have special obligations
  to family and friends; impartial consequentialism either denies them or treats them
  as merely instrumental, but a life without deep partiality is impoverished.

  6. The consumption / poverty objection (Peter Singer''s pond scaled up): if the
  duty to relieve suffering is that strong, then every purchase of a luxury is wrong
  while people starve — this seems to demand giving away nearly all income.

  7. The moral sainthood objection (Susan Wolf): a morally perfect life would be unattractive
  and dominated by morality at the expense of personal interests, hobbies, tastes;
  morality should not be that dominant.

