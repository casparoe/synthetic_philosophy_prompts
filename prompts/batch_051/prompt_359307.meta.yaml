  Let me draft commitments.


  Domain: Music and emotion: how can sounds be sad?


  The asker''s commitments (casual):

  1. I think it''s literally true that a piece of music can be sad — not just metaphorically,
  not just that it makes me sad.

  2. I don''t think the sadness is someone''s (composer/performer/listener''s) actual
  emotional state; the sadness is "in" the music.

  3. I think emotions are at least partly cognitive/intentional: being sad is about
  something (intentionality), grief is about a loss, etc.

  4. But music, being just sounds, isn''t about anything in that way — a sad piece
  isn''t sad about anything.

  5. I find "contour" / resemblance views attractive: sad music has features (slow
  tempo, descending lines, low register, quiet dynamics) that resemble sad human behavior
  and vocal expression, and that''s why it sounds sad.

  6. I don''t need to feel sad to correctly call the music sad, and a listener who
  feels nothing can still perceive the sadness.

  7. I also think a performer can express sadness without feeling it, just as an actor
  can.


  Tensions:

  - (3) + (4): If emotions are essentially intentional and music''s sadness is not
  about anything, can music literally be sad? This is the famous problem (e.g., Kivy''s
  cognitivism vs contour; Levinson says it''s a persona; Davies). This is a real tension:
  commitment 1 (literal sadness) and 3 (emotions are intentional) plus 4 (music isn''t
  about anything) threaten inconsistency. But maybe one could say music presents the
  "appearance" of sadness (an emotion characteristic look), not the full emotion —
  that would make it not literally sad, tension with 1.

  - (2) + (5): If sadness is in the music via resemblance to human expression, then
  the music''s sadness depends on resemblance to something human — is it in the music
  or in our perception? Not necessarily a tension; could be resolved. Actually (2)
  and (5) can hang: the features are in the music; our recognition via resemblance.
  Maybe apparent tension that dissolves.

  - (1) + (6): no tension.

  - (1)+(2)+(5): if music is literally sad but the sadness in the music grounded in
  resemblance to sad behavior, then "sad" applied to music is secondary/analogical?
  Kivy says music is expressive but not literally. Hmm.


