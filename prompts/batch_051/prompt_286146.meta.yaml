  Key pedagogical content:

  - Dependency order: students must first see what the term "qualia" is supposed to
  pick out: the felt, subjective character of experience — "what it''s like." Then
  the four canonical properties (ineffable, intrinsic, private, directly apprehended).
  Then the "quining" move: Dennett''s project isn''t to deny that experiences seem
  a certain way but to show that the concept smuggles together properties that come
