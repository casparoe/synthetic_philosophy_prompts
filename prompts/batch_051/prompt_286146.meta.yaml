  Mary?) rely on premises that don''t all hold at once. Then Chase and Sanborn as
  the carrying example: two coffee tasters whose relation to "the same taste" changes
  over years; one says the taste itself changed, the other says their judgment/reaction
  changed while the taste stayed the same. This forces the question: what fact of
  the matter, accessible to the subject''s first-person authority, settles which is
  right? Dennett argues neither can be shown to be wrong without abandoning one of
  the four properties; the "qualia" posit can''t do the work.

