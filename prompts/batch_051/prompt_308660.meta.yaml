  Let me think about clinical equipoise.


  Clinical equipoise (Freedman 1987): The ethics of RCTs require "a state of genuine
  uncertainty on the part of the clinical investigator regarding the comparative therapeutic
  merits of each arm" — no wait, that''s individual equipoise (Fried 1974). Freedman
  argued individual equipoise is too fragile; instead, "clinical equipoise" — the
  requirement is that there be no consensus within the expert clinical community about
  the comparative merits; a state of honest, professional disagreement among expert
  clinicians. Under clinical equipoise, a trial is ethical even if the individual
  physician has a leaning/preference, as long as the community is genuinely divided.
  Also "the null hypothesis" — the trial is designed to disturb the equipoise. But
  also "therapeutic obligation" to provide best care; clinical equipoise reconciles
  by saying the best care is unsettled at community level.


  Subtle misrepresentations to plant:

  - Conflating individual and community equipoise: "the doctor running the trial must
  have no opinion at all about which arm is better" — this is actually individual
  equipoise, whereas clinical equipoise allows individual hunches as long as the expert
  community is divided.

  - Overstating: "as long as one expert somewhere isn''t sure, you can randomize"
  — confuses requirement with sufficiency and the community vs. individual.

  - Treating a standard objection as refutation: "but physicians always have guesses,
  so clinical equipoise is impossible" — presents the objection as if it refutes,
  but defenders have replies (hunches vs. evidence, equipoise is about the evidential
  state of the community not gut feeling).

