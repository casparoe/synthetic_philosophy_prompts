  A hospital AI safety committee is arguing about whether to say that its deployed
  early-warning system "believes" a patient is deteriorating. To discipline the argument,
  the committee adopts a provisional four-part criterion. On this criterion, an artificial
  system S genuinely believes that P only if all four conditions are met:


  1. Representational tracking. S has a persistent internal state that is about P:
  the state''s content, and its updating, are systematically keyed to whether P obtains,
  rather than to incidental features of the input.


  2. Normative sensitivity. When evidence relevant to P arrives, S updates its state
  roughly as a rational reasoner should — strengthening or weakening confidence in
  P in the direction and to approximately the degree the evidence warrants.


  3. Functional integration. The state plays the role beliefs are supposed to play:
  it combines with S''s other stored information and its decision procedures to produce
  a range of P-appropriate outputs, including in cases the designers did not explicitly
  enumerate.


  4. Robust consistency. S''s overall behavior across contexts fits the attribution;
  the system does not elsewhere act in ways that treat not-P as settled, and the attribution
  does not collapse into a merely local, as-if description of one submodule.


  Now here is the case. The committee has been reviewing CASPER, a clinical early-warning
  module in a large teaching hospital. CASPER ingests labs, vital signs, medications,
  and nursing notes, and maintains a continuously updated causal-probabilistic model
  of each patient''s likely trajectory over the next 48 hours. When it assesses a
  patient, it posts a risk score and writes a short natural-language justification,
  e.g., "This patient is deteriorating because her lactate is rising and her urine
  output has fallen." It revises those outputs when new data arrive, it can answer
  counterfactual questions from clinicians about what would happen if a drug were
  held, and its predictions consistently outperform the residents and attending physicians
  on retrospective chart review. Importantly, CASPER has no preferences or goals of
  its own; it cannot order a test or page a nurse; its only external effects are the
  dashboard entry and the answers it gives to queries. Its engineers refer to its
  internal variables as beliefs, but the manufacturer''s manual insists this is "just
  a metaphor."


  Does CASPER, on the committee''s four-part criterion, genuinely believe that a particular
  patient is deteriorating? Go through each condition in turn and say whether the
  evidence points toward satisfaction, violation, or genuine underdetermination. Then
  say whether you think the criterion itself is well designed, or whether the case
  shows the criterion needs to be amended — for example, whether the absence of the
  system''s own goals should matter more than the criterion allows, or whether the
  committee is really asking a question about its own explanatory vocabulary rather
  than about CASPER. Before settling on a final verdict, briefly brainstorm the strongest
  considerations on each side. Write in American English.


