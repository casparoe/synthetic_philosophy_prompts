  I am a high school student writing a paper on the ethics of aquaculture, and I keep
  running into a pattern I cannot make consistent. In many wealthy countries, the
  law or the mainstream industry standard requires mammals and birds raised for food
  to be stunned before slaughter; a producer who killed pigs or chickens by slow asphyxiation
  would be treated as violating a basic welfare norm. Yet the same food system treats
  it as normal to kill farmed fish by asphyxiating them in air or in ice slurry, and
  to kill crustaceans such as lobsters, crabs, and farmed shrimp by boiling them alive.
  The asymmetry goes deeper than the killing methods themselves: where there is scientific
  uncertainty about whether fish and crustaceans can suffer, industry and many regulators
  treat that uncertainty as a reason to continue current practices, whereas comparable
  uncertainty about mammals and birds is usually treated as a reason for caution.


  I want to understand what theory of moral status, and what theory of how we should
  handle uncertainty about moral status, this pattern of practice presupposes. Please
  reconstruct the implicit view as precisely as you can, and in doing so address the
  following.


  [1] What claim about the moral status of fish and crustaceans would have to be true
  for this differential treatment to be justified? Is the operative idea best stated
  as (a) they are probably not sentient, (b) they are sentient but their suffering
  matters less because they are cognitively simpler or more distantly related to humans,
  or (c) something else? Distinguish the claims about sentience, about moral weight,
  and about replaceability.


  [2] Distinguish what the practice strictly presupposes from what it merely fits
  well with. Does the actual behavior—especially the way uncertainty about sentience
  is handled—force one of these views, or is it equally compatible with several theories
  (for example, a view on which fish and crustaceans matter equally but the costs
  of changing slaughter methods are accepted as an excuse)? Where is the practice
  philosophically underdetermined?


  [3] If the governing view were replaced with the principle that all sentient animals
  deserve equal consideration of comparable interests, together with a precautionary
  presumption in favor of protecting animals when the evidence of their sentience
  is uncertain, what specific features of current aquaculture slaughter and handling
