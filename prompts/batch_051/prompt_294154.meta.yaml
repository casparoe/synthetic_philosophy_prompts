  Draft:


  A friend and I recently spent a long evening arguing about whether a criminal statute
  that is never, or almost never, enforced is still law in any interesting sense;
  my friend kept insisting that a dead-letter statute is harmless, while I found myself
  worrying that a dormant statute is a standing invitation to arbitrary enforcement.
  I want to think about this properly through the lens of desuetude and the rule of
  law, using the American treatment of consensual sodomy laws as the test case.


  In 1986, in Bowers v. Hardwick, the U.S. Supreme Court upheld a state statute criminalizing
  consensual oral or anal sex — a kind of law that was already rarely enforced against
  private conduct between adults. By the time of Lawrence v. Texas in 2003, the question
  returned in an even starker form: Texas had a statute making "deviate sexual intercourse"
  criminal only when committed by persons of the same sex, Houston police had arrested
  two men in a private apartment after a reported disturbance, and the Court struck
  the law down as a violation of liberty and overruled Bowers. At no point did the
  Court rest its holding on the fact that such laws were unevenly or infrequently
  enforced.


  Analyze this episode through the lens of desuetude and the rule of law. Specifically:
  (1) What would a desuetude-based analysis say about the legal status of the Texas
  statute while it was on the books but mostly unenforced, and what should it say
  about the propriety of prosecuting Lawrence and Garner under it? (2) Which features
  of the episode does this lens illuminate — for example, the pattern of sporadic
  and selective enforcement, the political difficulty of formal repeal, and the gap
  between the statute''s text and the community''s settled expectations — and which
  features does it miss or misdescribe? (3) Does Lawrence show that desuetude is not
  enough: that a formally valid but unenforced criminal prohibition can still inflict
  a constitutionally cognizable injury through the status it creates and the official
  stigma it licenses, even when enforcement is rare? (4) Conversely, does the episode
  show that the rule-of-law critique of unenforced laws is overstated, since the eventual
  judicial invalidation rendered the desuetude problem moot? Be disciplined about
  where the theory genuinely applies and where it merely gestures.


