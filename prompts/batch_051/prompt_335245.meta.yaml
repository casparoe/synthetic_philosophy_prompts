  Ideas for the strict side (no-excuse, but not a strawman):


  - Coordination/rule-of-law: if liability depends on actual knowledge, the law can''t
  serve as a stable public standard; enforcement becomes unpredictable; everyone has
  an incentive to cultivate ignorance.

  - Practicability: courts can''t reliably distinguish honest from feigned ignorance;
  a subjective standard invites perjury and selective enforcement.

  - Normative: citizens have a duty to find out the law; legal ignorance is often
  culpable (willful blindness, deliberate avoidance).

  - The "not fair" question is the wrong level: law aims at general order, not at
  individual desert in each case; fairness enters at the level of the system (publication,
  clarity, prospectivity), not at the level of adjudication.

  - Excusing ignorance in harsh cases can be achieved by prosecutorial discretion
  or a general "it would be unjust to punish hopeless ignorance" without a full excuse.


  Ideas for the knowability side:


  - Secret law: a rule that exists but is truly unavailable can''t guide behavior;
  punishing under it is arbitrary. This isn''t about subjective ignorance; it''s about
  objective unavailability. The strict side usually concedes secret law is wrong —
  but then the line is knowability, not publication alone.

  - Publication alone is insufficient: a rule can be "published" yet practically unknowable
  (published in an unindexed gazette in a distant archive; in a language no one reads;
  buried in an interlocking web of cross-references that no diligent layperson—or
  even lawyer—can reconstruct; machine-dependent rules; changing interpretive glosses).

  - Retroactivity as the limiting case: a rule created after the act is unknowable
  at the time by definition; the strict side might still defend this for Nuremberg-style
