  ===

  I am a PhD student in formal epistemology, and I would like your help refereeing
  a disagreement I witnessed after a recent seminar on Bayesian inference. The two
  participants are both graduate students in my program: one works on statistical
  learning theory, the other on philosophy of science. The debate concerns what, exactly,
  the standard Bayesian convergence and merging-of-opinions results show about the
  problem of prior choice. I have reconstructed the exchange below as faithfully as
  I can, with the moves numbered. Please adjudicate it: rate each numbered move from
  clearly mistaken to clearly right with a brief justification, identify who is right
  about which specific point, state what both parties are missing, and give an overall
  verdict on who is more right. Lead with your bottom line in the first sentence and
  then give the reasoning, with no preamble and no restating of the question.


  [1] A: The convergence results should make us much calmer about priors. In an identifiable
  model with a reasonably regular likelihood, the posterior concentrates on the true
  parameter no matter what prior one starts from, provided the prior puts positive
  mass in a neighborhood of the truth. The merging-of-opinions results strengthen
  the point: two agents with mutually absolutely continuous distributions over the
  data will eventually make nearly the same predictions. So the charge that priors
  are arbitrary is at worst a short-run complaint. The principled problem is solved;
  what remains is a technical one.


  [2] B: That assurance is internal to a prior. "Almost surely" in such theorems is
  almost surely with respect to the measure one starts from. If the true hypothesis
  lies outside the support of one''s prior, the theorem simply does not speak to one''s
  situation. The original worry was precisely that we have no external license for
  thinking our prior support contains the truth. So the theorem reassures us only
  on our own prior''s authority, which is the circularity the skeptic was pointing
  at all along.


  [3] A: That proves only that the theorem is not an unconditional oracle, which nobody
  claimed. The relevant question for prior choice is whether reasonable agents can
  rationally disagree forever. The merging results answer that question: under mutual
  absolute continuity, sustained predictive disagreement between reasonable agents
  is transient. The condition is not "know the truth" but "do not treat as impossible
  what your interlocutor treats as possible." Most live scientific disagreements satisfy
  that condition... The theorem is a real constraint on how disagreement can persist.


  [4] B: Two difficulties. First, agreeing on null sets is agreeing on exactly the
  thing that is hardest to justify outside a settled parametric model — namely, what
  is possible. That is substantive, not cosmetic. Second, even granting the condition,
  the theorem is an existence claim about the infinite-data limit and supplies no
  finite-sample bound. A statement of the form "you will agree eventually, but possibly
  after more data than any finite practice will see" is compatible with priors diverging
  everywhere we can observe. That is cold comfort for actual inquiry.


  [5] A: The absence of a universal bound does not mean there are no bounds where
  they matter. In the standard models we actually deploy — exponential families and
  their conjugate priors, mixture models with clear identifiability — the prior''s
  influence can be expressed explicitly and can be seen to be diluted at a rate one
  can compute. The general theorem is a guarantee of eventual agreement under modest
  conditions; the practical models give us the concrete rates.


  [6] B: But those models are chosen, and parameterized, partly on substantive grounds;
  the reassuring rates arise only for the models we already trust. So the argument
  has shifted from "the priors wash out" to "the priors wash out quickly in a model
  class we selected." The arbitrary prior has not been dissolved; it has been relocated
  into the likelihood, the support, and the parameterization. The theorem ends up
  vindicating only that disciplines which standardize their models can converge within
  them.


  Please work through [1] through [6] in sequence, rating each move, then deliver
  the overall verdict and the diagnosis of what the exchange misses.

