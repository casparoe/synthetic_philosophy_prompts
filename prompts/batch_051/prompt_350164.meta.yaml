  "Recently an online argument about whether the left or the right has a better grasp
  of fairness ended with someone posting: ''Morality binds and blinds.'' The idea,
  as the poster explained, is that moral foundations theory shows that people on the
  left and the right are each animated by their own moral intuitions — roughly, care
  and fairness versus loyalty, authority, and sanctity as well — and that each side
  is therefore constitutionally unable to see the other side''s moral truths. The
  poster concluded that asking which side is actually right is a category mistake,
  or at least unanswerable in principle.


  I''m a software engineer with no formal background in philosophy, so I don''t want
  to lean on distinctions I only half-remember. Can you take that one sentence — ''morality
  binds and blinds'' — and lay out the distinct precise claims it could be making?
  For each candidate reading, tell me:


  1. Whether it''s close to trivial, an empirical claim that moral foundations theory
  is actually in a position to support, or a much stronger philosophical claim that
  doesn''t follow from the psychology;

  2. Whether it has any direct bearing on the question ''does the psychology of left
  and right tell us anything about who is right?'';

  3. Whether it would actually license the poster''s move from ''both sides are in
  the grip of their own moral psychology'' to ''the question of which side is right
  is unanswerable or incoherent.''


  I''m particularly interested in whether the slogan distinguishes two things that
  might come apart: the ''binding'' function (held together by shared moral commitments)
  and the ''blinding'' effect (unable to fairly assess rival commitments). Are those
  logically separate? Could you have one without the other, or one to a greater degree
  than the other? And if blindness comes in degrees, what would it even mean to say
  one side is more blinded than the other? A menu-style breakdown would help most
  — I''d rather see the space of readings with verdicts than a single interpretive
  argument."


