  the species end — then the badness is just the grief, the collapse of hope, the
  pointlessness they feel, plus whatever losses their own projects undergo. But those
  are ordinary harms to survivors, and once we''ve counted them we''ve counted the
  deaths plus downstream harms, with nothing left over.

