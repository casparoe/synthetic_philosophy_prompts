  ---


  For a long-form article on the contemporary debate over divine foreknowledge and
  human freedom, I need a rigorous, self-contained argument that I can adapt for a
  general readership. Please present the argument with numbered premises, and then
  defend its two most vulnerable premises against the strongest objections.


  The position I want you to defend is this: the grounding objection to Molinism is
  not a special problem for Molinism. By "Molinism" I mean the view that God has three
  logical moments of knowledge: natural knowledge (of all necessary truths), middle
  knowledge (of what every possible free creature would freely choose in any set of
  circumstances), and free knowledge (of what this actual world will contain given
