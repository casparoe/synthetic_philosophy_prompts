  ***


  I was recently told that several of my test results put me just over the current
  line for a chronic condition — results that under the guidelines in use until fairly
  recently would have been called normal or "high normal." My body did not change;
  the boundary did. Since then I''ve been reading around the old debate in the philosophy
  of medicine about whether disease concepts are natural or normative, and I keep
  noticing what looks like the same structure in a debate from my own trade, software
  engineering. I''d like help deciding whether the parallel is deep or just a case
  of pattern-matching.


  On the medical side, naturalism says (roughly) that health and disease are value-free
  facts about an organism''s functioning: a part is diseased when it fails to make
  its species-typical contribution to survival and reproduction, or when its state
  is a statistical outlier relative to an appropriate reference class. Normativism
  says that judgments of disease inevitably import values: which departures from typicality
  count as disease, and which states count as bad for a person, cannot be settled
  by biology alone. On the engineering side, there is a parallel disagreement about
  whether buggy behavior is an objective property of a program. You can take an objectivist
  line: given a specification, a program either matches it or does not, and "bug"
  names the mismatch. Or you can take a pragmatic line: the specification is itself
  a choice made by someone for some users, and the interesting part of labeling behavior
  a bug—rather than an unsupported edge case, a tolerated quirk, or a feature—is exactly
  the value-laden part.


  The mapping seems suspiciously neat. Test results correspond to observed program
  behavior; the reference class or "normal functioning" corresponds to the specification;
  a diagnosis corresponds to a bug report; treatment corresponds to a patch; and the
  guideline change that made me a patient corresponds to revising a spec and thereby
  changing the truth-value of "this behavior is correct" while leaving the behavior
  itself untouched. If the parallel is real, then the naturalism/normativism dispute
  and the objectivist/pragmatist dispute about bugs should rise and fall together:
  whatever settles one should, suitably translated, settle the other.


  But I can also see reasons to suspect it is superficial. Organisms have no author,
  and their "proper functioning" is read off from evolutionary history or statistical
  typicality rather than from a written spec; software has an intentional designer,
  and the spec can be checked against something outside the system. And the fact that
  a spec was written by someone may make bug attributions relative to an authored
  standard, whereas biological norms, if they exist, would have to be authorless.
  I suspect that''s either the hinge of the analogy or the crack in it, but I cannot
  tell which.


  Is this a genuine identity of structure, a loose analogy, or a confusion? Be specific
  about where the mapping holds and where it comes apart: what would have to be true
  of biological functions on one side and specifications on the other for results
  to transfer between the two disputes, and what prediction made by the parallel actually
  fails?


