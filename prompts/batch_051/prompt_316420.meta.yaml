  Prompt draft:


  "I''ve spent a decade writing novels with multiple viewpoint characters, and that
  practice led me to a position in philosophy of mind that I''d like your candid assessment
  of. I call it narrative-binding panpsychism, and it is meant to solve the combination
  problem.


  The combination problem, as I understand it, is this: if the fundamental bits of
  the world each have some small amount of consciousness worth taking seriously, then
  explaining how those many micro-consciousnesses become the single, unified consciousness
  I enjoy seems impossible. Adding many small subjects gives me many small subjects,
  not one big one; and a committee of tiny perspectives is not the same as one perspective.


  My proposal is that a unified subject is not something that gets physically composed
  out of smaller subjects at all. It is something that gets narrated into existence.
  A macro-subject exists when a single narrative frame — something like an internal
  narrator — treats a collection of micro-events as episodes within one and the same
  story: one protagonist, one timeline, one point of view. The binding relation is
  not a physical relation between parts; it is a plot relation. In my novels, the
  third-person narrator gives unity to scattered scenes by making them scenes of one
  life; that, I claim, is not merely an analogy but the literal structure of conscious
  experience. The micro-subjects do not disappear: they remain as the raw point-of-view
  material, the way the characters'' small experiences remain inside the novel even
  though they are not themselves the narrator.


  I suspect this is just higher-order thought theory with literary window-dressing,
  or maybe Dennett''s idea of the self as a center of narrative gravity. But I also
  think those positions don''t take the narrator seriously enough as something real,
  whereas I do: the narrating frame is as real as the scenes it binds, and it causally
  organizes them. Is narrative-binding panpsychism coherent as stated? Is it a new
  solution to the combination problem, or merely a restatement of an existing one?
  Name what you take to be its two strongest objections, and say whether either amounts
  to a fatal problem rather than an inconvenience. Finally, say how confident you
  are in each part of your assessment and single out the point you are least sure
  of."


