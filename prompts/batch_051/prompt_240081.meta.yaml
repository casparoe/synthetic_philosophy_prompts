  you should be filial but not being filial" — Wang says this just isn''t genuine
  knowledge; it''s "knowledge" only in the degenerate sense. There''s a distinction
  between "knowledge of the thing" and "realized knowledge" or between mere verbal
  knowledge (wenjian zhi zhi? knowledge from seeing and hearing) and true knowing
  (liangzhi? innate knowing).


