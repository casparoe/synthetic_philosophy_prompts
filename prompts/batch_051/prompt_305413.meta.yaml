  Let me think about the color phi phenomenon carefully.


  Classic color phi: two spots of light, separated by a small distance, flash in quick
  succession — first red at location A, then green at location B. Subjects report
  seeing a single spot move from A to B, and that it changes color roughly midway
  along the path. The puzzle: the second (green) flash has occurred before the spot
  appears to change color; how could the experience of the green be "filled in" before
  the green flash happened (if it''s a stream of consciousness)? Dennett discusses
  whether the brain "edits" the record after the fact (Orwellian — memory revision,
  like rewriting history) or stages a delayed broadcast (Stalinesque — experience
  itself is delayed so the green is inserted before the subject becomes conscious).
  Orwellian: the initial experience was red moving, then after receiving green flash
  info, the memory is falsified to say the dot changed color before the green flash.
  Stalinesque: consciousness is delayed long enough that the green flash enters the
  representation before it reaches consciousness, so the experience itself has the
  dot turn green midway, but the subject can''t access the actual order. The two accounts
  are empirically equivalent in Dennett''s argument — behaviorally indistinguishable;
  the question of which happened is a misplaced question akin to asking whether it''s
  genuinely real editing or delayed broadcast.


