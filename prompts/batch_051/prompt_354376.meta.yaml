  Potential final version:


  "Ursula K. Le Guin''s story The Ones Who Walk Away from Omelas is usually assigned
  as a parable about utilitarianism: the enduring happiness of a whole city is purchased
  by the deliberate, permanent misery of one child. I would like a reading of the
  story through a less frequently paired lens, Jeremy Bentham''s attack on natural
  rights. In his critique of the French Declaration of the Rights of Man, Bentham
  argued that rights are not things people possess prior to law and society; they
  are created by legal arrangements and justified only insofar as they serve utility.
  Talk of natural and imprescriptible rights, on his view, is emotionally potent but,
  in the last analysis, empty rhetoric that licenses anarchy whenever a claimant dislikes
  a law. On that view, the child in the cellar has no natural right not to be there;
  the only serious question is whether the institution of Omelas makes for more happiness,
  all things considered, than the feasible alternatives.


  Write an essay that reads Le Guin''s story through Bentham''s position and uses
  the story to probe its strengths and weaknesses. Weigh the following: (1) How would
  a Benthamite assess Omelas, given that the story seems designed to rule out the
  usual empirical objections—the bargain is stable, the child cannot be helped, and
  walking away is the only available form of refusal? (2) Does the story''s moral
  force depend on precisely the kind of pre-legal right Bentham denies, or can a Benthamite
  account for the sense that something is wrong even when the city''s bargain pays
