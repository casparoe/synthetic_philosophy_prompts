  Bentham''s critique of natural rights:

  - In "Anarchical Fallacies," Bentham critiques the French Declaration of the Rights
  of Man and the Citizen. He argues that real rights are creatures of law; "natural
  rights" are imaginary, and the idea of imprescriptible natural rights is contradictory—if
  rights are natural and imprescriptible, there can be no conflict among them, yet
  there obviously is; rights in a society limit each other, so they can''t all be
  absolute.

  - His key moves: (1) Rights are not prior to government; they are created by law.
  (2) Natural rights talk is anarchical because it implies a right to resist any law
  the claimant doesn''t like. (3) The utilitarian standard is what justifies legal
  rights.


  Omelas:

  - Omelas is a city of happiness, whose continued prosperity depends on keeping one
  child in abject misery. The citizens learn about this. Most accept it; a few walk
  away. The story is often read as a criticism of utilitarianism because the happiness
  of the many seems insufficient to justify the child''s suffering; or as a challenge:
  would you walk away? The ones who walk away don''t fix anything; their walking away
  doesn''t help the child; they just refuse to be part of the bargain. The story''s
  narrator explicitly connects the child''s suffering to the city''s happiness, and
  presents walking away as a gesture.


  Reading through Bentham:

  - A Benthamite would say: The child has no natural right to better treatment. But
  that doesn''t mean anything goes; the institution must be justified by its utility.
  Is Omelas an exchange that maximizes utility? If it does, Bentham would endorse
  it (subject to his felicific calculus). If not, he''d oppose the institution. The
  story''s power comes from the intuition that even if the calculus favors Omelas,
  there is something wrong that the calculus misses—namely, the child''s claim considered
  as a side-constraint or a right. This intuition challenges Bentham. But Bentham
  might rejoin: the intuition isn''t evidence of a pre-legal right; it''s evidence
  of a deep utility, e.g., the long-term psychological corruption of citizens, the
  instability of a society founded on deceit or cruelty, the manufacture of a class
  of victims, etc. The story deliberately excludes those costs, insisting the bargain
  is clean and reliable, which may be a rigged thought experiment. That''s the "where
  work resists the reading" part: Omelas explicitly rules out the realist utilitarian
  objections (the child can''t be helped, the city would be destroyed, etc.) and in
  doing so may be arguing against a caricature of utilitarianism.


  The ones who walk away: What does their act express? They don''t claim the child
  has a right; they don''t try to reform Omelas. Their departure looks like a rejection
  of the society''s terms rather than a rights-claim. Yet if the story makes us think
  they are right to leave, it may be expressing that a life bought at that price is
  morally tainted—an idea that sounds like a deontological prohibition, but might
  be recast in utilitarian terms as an implicit preference or a refusal to be the
  kind of person whose happiness depends on cruelty. Bentham might say this is just
  an assertion of a personal preference, not an argument. The essay could conclude
  either way.


