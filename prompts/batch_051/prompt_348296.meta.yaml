  Proposed premises:

  1. In a Gödel universe, there are closed timelike curves: a rocket can complete
  a round trip and arrive back at its starting event in its own past.

  2. If there is a closed timelike curve, then the same event is both earlier and
  later than itself under the manifold''s causal structure.

