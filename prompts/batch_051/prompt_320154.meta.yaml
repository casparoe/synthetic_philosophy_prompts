  The discursive dilemma (Pettit 2001; List and Pettit). Three judges:

  - P, Q are premises, R is conclusion (R iff P and Q, or P→Q).

  Actually canonical: the doctrinal paradox emerges in legal judgment. Suppose a case
  depends on two premises: whether the defendant was negligent (P) and whether there
  is a valid contract (Q), with liability (R) iff P ∧ Q. Three judges:

  - A: P true, Q false, R false

  - B: P false, Q true, R false

  - C: P true, Q true, R true

  Majority on P: A and C → yes. Majority on Q: B and C → yes. Majority on R: A and
  B → no. So group accepts P and Q but rejects R, even though each judge is consistent
  (R iff P∧Q). This is the doctrinal paradox; the discursive dilemma is the general
  version for any logically connected propositions.


  The alternative example with P, P→Q, Q (modus ponens) gives:

  - A: P true, P→Q true, Q true

  - B: P true, P→Q false, Q false

  - C: P false, P→Q true, Q false

