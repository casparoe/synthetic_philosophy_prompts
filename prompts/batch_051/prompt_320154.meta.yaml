  Student answer draft:


  "The discursive dilemma (also called Condorcet''s paradox) is when a group whose
  members have individually consistent views nevertheless ends up with an inconsistent
  collective view. Say a three-judge panel has to decide whether a defendant is liable
  (R), which requires both negligence (P) and a valid contract (Q). Judge 1 accepts
  P but rejects Q, and so rejects R. Judge 2 rejects P but accepts Q, and so rejects
  R. Judge 3 accepts both, so accepts R. Majority vote on each proposition gives:
  P is accepted (judges 1 and 3), Q is accepted (judges 2 and 3), but R is rejected
  (judges 1 and 2). Each judge is consistent with R iff P and Q, yet the panel as
  a whole is committed to P, Q, and not-R, which is contradictory. This shows that
  you cannot treat the group as if it were a single rational agent.


  The standard conclusion-based procedure has the panel vote only on R and ignore
  the premises. This removes the problem because only one proposition is voted on,
  so collective consistency is automatic. But it comes at a price: the committee''s
  vote on R no longer tracks its members'' reasons, and the majority''s support for
  the premises can be contradicted by its own conclusion. In the example above, the
  majority accepted both P and Q, which entail R, yet under conclusion-based voting
  the panel would reject R. So conclusion-based voting reproduces the very inconsistency
  it was meant to solve. The better response is premise-based voting: aggregate the
  premises by majority vote and then derive R by logic. That way the group respects
  its own reasoning and the outcome is always consistent."


  Now identify errors:

