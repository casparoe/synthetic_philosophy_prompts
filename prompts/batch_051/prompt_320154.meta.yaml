  Question: Imagine a three-person panel that decides each proposition by majority
  vote. The conclusion R holds just in case both premises P and Q hold. Explain the
  discursive dilemma, showing how the panel can accept P, accept Q, and reject R even
  though every member is individually consistent. Then evaluate the usual escape route,
  conclusion-based voting, where the panel only votes on R. What does it fix, what
  does it give up, and is it enough?


  Student answer: The discursive dilemma, also called Condorcet''s paradox, is when
  a group of individually consistent judges produces a collectively inconsistent set
  of judgments. Take three judges deciding liability R, which requires both negligence
  P and a valid contract Q. Judge 1 accepts P and rejects Q, so rejects R. Judge 2
  rejects P and accepts Q, so rejects R. Judge 3 accepts both, so accepts R. Under
  majority rule the panel accepts P (judges 1 and 3), accepts Q (judges 2 and 3),
  but rejects R (judges 1 and 2). Since each judge is consistent with R iff P and
  Q, the inconsistency has to come from the aggregation procedure itself, which shows
  the group cannot be treated as a single rational agent.


  The standard fix is conclusion-based voting: have the panel vote only on R and ignore
  the premises. This removes the problem because only one proposition is put to a
  vote, so the collective view is automatically consistent. The cost is that the panel
  no longer tracks its members'' reasons, and in the example the majority accepted
  both P and Q, which entail R, yet conclusion-based voting would reject R. So conclusion-based
  voting just reproduces the same inconsistency it was meant to solve. The better
  response is premise-based voting: aggregate the premises by majority vote and then
  derive R by logic. That way the group respects its own reasoning and the outcome
  is always consistent."


