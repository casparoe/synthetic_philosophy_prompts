  Let me think about the paradox of deontology. It''s the idea (associated with Scheffler?
  Noe the literature) that deontological constraints seem paradoxical: if it''s wrong
  to kill one to save five, why should the number matter? Actually the paradox is:
  deontological constraints forbid certain types of actions even to prevent more of
  the same type. If you think it''s impermissible to kill one innocent person, why
  would it be permissible to kill fewer? The classic "paradox of deontology": If murder
  is wrong because it''s bad to kill people, then we should minimize killings, so
  killing one to save five is permissible or required; but deontology forbids it.
  So the constraint seems to treat harm as bad but also refuse to minimize harm —
  it''s paradoxical unless we reject an agent-neutral conception of reasons. Scheffler''s
  "The Rejection of Consequentialism" discusses this. There''s also the agent-relative/agent-neutral
  distinction.


  For a high school audience, teaching this requires first introducing the distinction
  between "making the best state of affairs" and "respecting constraints," the doing/allowing
  or intending/foreseeing distinctions, etc.


