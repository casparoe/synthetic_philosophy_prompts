  I keep running into a claim in debates about language models and language acquisition,
  and I can''t tell how much of it is an empirical claim versus a framing claim. The
  claim is roughly: children converge on a grammar from input that is too sparse and
  too noisy to determine that grammar, so the learner must bring some language-specific
  bias, constraint, or hypothesis space to the task. People often call this the poverty
  of the stimulus, and they use it both to argue that human children have something
  LLMs lack and, sometimes, to argue the opposite.


  I''d like you to treat this as a design problem rather than a survey problem. Help
  me design the strongest feasible test — using tools I''d actually have as an ML-oriented
  software engineer: synthetic languages, controlled training corpora, ablated data,
  comparisons of model classes with different inductive biases, and maybe evaluation
  probes — that would separate the following readings:


  (a) the environmental-impoverishment reading: the child''s actual input, quantified
  in the right way, lacks the cues a domain-general learner would need;

  (b) the learner-insufficiency reading: on the relevant input distribution, no domain-general
  learning procedure of the kind we know about succeeds, while humans / constrained
  learners do;

  (c) the conceptual reading: the debate is really about what should count as evidence
  for a rule, and no amount of training data settles it.


