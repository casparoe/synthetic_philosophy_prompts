  Key legal background to get right:

  - First Amendment does not provide a free-standing "opinion privilege." In Milkovich
  v. Lorain Journal Co. (1990), the Supreme Court rejected the idea that all "opinions"
  are automatically protected. However, statements that cannot "reasonably be interpreted
  as stating actual facts" about a person are protected (from Greenbelt and Hustler?
  Actually from Milkovich quoting "rhetorical hyperbole" and "imaginative expression"
  and "loose, figurative language"). Also Gertz v. Welch (1974): "Under the First
  Amendment there is no such thing as a false idea. However pernicious an opinion
  may seem, we depend for its correction not on the conscience of judges and juries
  but on the competition of other ideas." This is the famous dictum. Milkovich clarifies:
  a statement of opinion may be actionable if it implies an assertion of objective
  fact.

  - So the friend''s summary might say: "Defamation law has an opinion privilege:
  as long as you phrase something as an opinion — a rating, a forecast, a review —
  it can''t be defamatory. That''s why a one-star review or a prediction that a business
  is a scam is safe even if false." The subtle error: no blanket opinion privilege;
  the test is whether the statement can reasonably be understood as asserting a verifiable
  fact, and an opinion that implies undisclosed false facts is actionable. Gertz''s
  "no such thing as a false idea" is a dictum about ideas, not immunity for assertions
  of fact couched as opinions.

  - The summary might also conflate "rhetorical hyperbole" (protected because it can''t
  be believed as fact) with "opinions" (which may imply facts). For example, "predicting
  a company is a scam" can imply actual facts (e.g., that it engages in specified
  conduct), and rating "one star" may or may not be defamatory — a bare star rating
  with no factual assertion is probably protected as pure opinion/hyperbole? Actually
  courts have treated ratings: if a restaurant review says "the food was terrible,"
