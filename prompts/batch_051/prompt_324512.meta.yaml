  with restricted choice sets, many rationalizations.

  - IRL with feature matching, maximum entropy IRL, etc.

  - The behavior of an optimizing process may underdetermine both objective and search
  space; constraints/priors needed.

  - Wireheading: an agent that modifies its own reward channel; from outside, distinguishing
  "pursues reward" vs "pursues whatever reward is designed to track" etc.

  - The same objective with different search spaces yields different behavior; same
