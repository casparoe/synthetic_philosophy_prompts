  This is about the problem: given observed behavior of a system, infer what it''s
  optimizing and over what options. Key ideas:

  - Objective vs search space entanglement: identical behavior can be produced by
  many (objective, search space) pairs. E.g., an agent that chooses only among options
  A and B might appear to maximize X when actually it has a different objective but
  cannot produce other actions.

