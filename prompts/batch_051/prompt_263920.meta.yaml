  "I have been trying to settle a conflict between a principle I find compelling and
  an intuition I cannot get rid of, and I would like a negotiated verdict rather than
  a side taken too quickly. The principle, which I''ll call the Source Principle,
  says that a person is morally responsible for an action only if they are the ultimate
  source of that action. Being the ultimate source would mean being responsible for
  the character and mental states from which the action flowed; but those traits seem
  to come from heredity, upbringing, and circumstances no one chose. Therefore, by
  the Source Principle, no one is ever ultimately morally responsible for anything,
  and all attributions of blame and credit are, strictly speaking, false. I find the
  argument hard to resist because it is so economical: one plausible-sounding requirement
  explains why blame and credit fail together. At the same time, I cannot shake the
  intuition that when someone deliberately betrays a friend for a small advantage,
  that person is blameworthy — not merely in the sense that punishing them would be
  useful, but in a deeper sense. I feel indignant, and I cannot believe the indignation
  is just a useful illusion. I have also read Strawson''s idea that our reactive attitudes,
  such as resentment and gratitude, are natural and unavoidable, and that the real
  debate should be about the conditions under which we suspend them, not about whether
  the whole practice rests on a metaphysical mistake. But I am not sure whether that
  solves the problem or just changes the subject. Here is what I want to know: should
  the Source Principle, being a natural and economical theory, lead me to debunk the
  intuition that the betrayer is truly blameworthy? Or should the firmness of that
  intuition lead me to amend or abandon the principle? Is there a reading on which
  both survive — for example, one where blame is justified as a reactive attitude
  even if the Source Principle is true — and does that reading actually preserve the
  deep kind of blame, or merely a deflated substitute? Present the strongest case
  for each move and then tell me which you would make."


