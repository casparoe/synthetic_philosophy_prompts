  Sen''s liberal paradox: The impossibility of a Paretian liberal. Sen showed that
  if you accept (1) minimal liberalism (each individual is decisive over at least
  one pair of social alternatives) and (2) Pareto principle (weak Pareto), and (3)
  social choice transitivity/acyclicity, you can get a cycle. The classic example:
  Lady Chatterley''s Lover — Prude and Lewd. Prude: prefers nobody reads it (n) over
  Prude reads it (p) over Lewd reads it (l). Lewd: prefers Prude reads it over Lewd
  reads it over nobody reads. Minimal liberalism: Prude is decisive over whether Prude
  reads it (n vs p); Lewd is decisive over whether Lewd reads it (l vs n). So society
  prefers n over p (Prude''s decisiveness), and l over n (Lewd''s decisiveness). But
  Pareto says p over l (both prefer p to l). Hence cycle: p > l > n > p. This is a
  classic paradox.


  For "argument that seems to prove too much" type: I could present an argument that
  seems to show liberalism itself, or the Pareto principle, is self-defeating, and
  ask where it goes wrong. The argument: Pareto + minimal liberty + transitivity yields
  impossibility. The "prove too much" conclusion might be that any notion of individual
  rights is incompatible with unanimous preference, or that social preference must
  be cyclical, or that one must give up either rights or Pareto. Where does it go
  wrong? The subtle issue: Sen''s formulation treats rights as ordinary preferences
  in social choice — the "social preference" incorporates other people''s nosey preferences
  about what you read, and the impossibility depends on allowing preferences about
  others'' private actions. If you restrict the domain to exclude meddlesome preferences,
  or if you game-formulate rights (rights as constraints, not preferences), the paradox
  dissolves or shifts. The subtle flaw could be in step where "minimal liberalism"
  is encoded as a condition on social preference ordering rather than as a game form
  / feasibility constraint. There are also responses (e.g., Gibbard''s game-theoretic
  reformulation — rights as protected spheres). This is nicely "in the weeds" but
  not requiring citations.


