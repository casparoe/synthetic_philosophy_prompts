  Final-ish draft:


  "Two philosophers in our working group have spent a year defending rival answers
  to the ''equality of what?'' question. One is a resourcist of the Dworkin school:
  she holds that egalitarian justice requires making people equal in their shares
  of impersonal and personal resources, where the metric is fixed by an idealized
  auction-plus-insurance device and people are held responsible for their ambitions,
  not their endowments. The other is a capability theorist of the Sen school: he holds
  that the measure of inequality is the set of functionings a person can effectively
  reach—capabilities—and that resources are merely means whose worth depends on personal,
  social, and environmental conversion factors.


  They have concluded that they converge substantially, especially in rejecting equality
  of welfare (they both regard expensive tastes, cheap tastes, and adaptive preferences
  as decisive problems for welfarism), but that a real disagreement remains about
  the currency and about responsibility. Draft the joint statement they should publish
  at the end of a good-faith adversarial collaboration.


  The statement should contain:

  (1) A numbered section of agreed claims they can both sign, neither vacuous nor
  slanted: their shared anti-welfarism and its rationale, their shared view that raw
  income or primary goods are the wrong metric, and their shared view about what an
  adequate metric must do.

  (2) A disagreements table giving, in neutral wording, each remaining disagreement,
  followed by the formulation each side would accept for its own position. Cover at
  least: (a) whether the equalisandum is resources or capabilities; (b) whether the
  ambition/endowment distinction is stable enough to ground a responsibility cut,
  given that preferences and insurance valuations can themselves be formed by unjust
  background conditions; (c) whether disability and other conversion disadvantages
  are adequately handled by ex ante compensation in resources or require the metric
  itself to change; (d) whether the capability approach can be operationalized without
  a canonical list of central capabilities, and what it loses if it has to adopt one.

  (3) A section identifying the cruxes—the sub-questions such that settling them would
  move at least one side—and, for each crux, a concrete case both accept bears on
