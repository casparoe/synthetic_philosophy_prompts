  ---


  You are a professional philosopher who works on the theory of interpretation and
  the semantics of written texts. Please think carefully about the structure of the
  disagreement before you answer, and begin by reconstructing, as charitably as you
  can, what each side must minimally commit to.


  A debate over authorial intention and textual meaning has run for decades without
  much movement. One camp — call them intentionalists — holds that the meaning of
  a written text is fixed by what its author intended it to mean: interpretation is
  fundamentally the recovery of an author''s communicative intention, and a text means
  what its writer meant by it. The other camp — anti-intentionalists — holds that
  once a text is made public, its meaning is fixed by what the text itself licenses
  a competent reader to attribute, given the relevant linguistic conventions and publicly
  available context; the author''s private, unexpressed, or unsuccessfully realized
  intentions are at most clues, not constituents, of the text''s meaning. Each side
  has stable replies to the obvious counterexamples. Intentionalists say an anonymous
  pamphlet has a determinate meaning because some actual person made it with some
  intention, which we may recover only imperfectly; anti-intentionalists say that
  a poet''s hidden pun, which no competent reader using only the public text and its
  context could recover, is not part of the poem''s meaning, however plainly it was
  part of the poet''s mental life.


  The puzzle is not merely that the two sides disagree about cases. It is that the
  disagreement returns even after every fact about a case has been stipulated. Each
  side treats the other as making a conceptual mistake rather than an empirical one,
  and each accuses the other of changing the subject.


  My working hypothesis is that the two camps are using the word meaning to pick out
  two different things, and that the real dispute is over which thing should own the
  word. On this picture, intentionalists want meaning to name what a writer communicates
  by an act of writing, so that interpretation is a form of purpose-recovery; anti-intentionalists
  want it to name what a publicly available text licenses any suitably placed reader
  to understand, so that interpretation is a form of rule-following applied to an
  artifact. But I am not confident, because the two notions can genuinely conflict
  rather than pass each other by, and I want that conflict examined rather than papered
  over.


  Consider a constructed case the standard examples do not settle. A writer drafts
  a paragraph arguing that a certain policy is legitimate. A second person, who never
  sees the draft, deletes every third sentence and replaces it with a sentence produced
  by a fixed mechanical rule that takes no account of content. By chance, the resulting
  text is grammatical; a competent reader cannot tell it has been altered, and the
  text now appears to argue that the policy is illegitimate. The original writer later
  reads the altered text without knowing about the alteration and says, "That is exactly
  what I meant to say." Is the meaning of the resulting text the author''s now-avowed
  intention, the compound causal process that produced the marks, or what a competent
  reader would recover from the public text? Different answers seem to track different
  prior choices about what meaning is, which is precisely what makes me suspect we
  are watching a disguised dispute about the role of a concept rather than a dispute
  about any fact.


  I would like a diagnosis, not a verdict on the case or a survey of the literature.
  Is this a verbal disagreement, a substantive one, or two different questions running
  under a single word? Do the sides differ about the data, about standards of evidence,
  about which cases count as constraints on a theory of meaning, or about a starting
  intuition neither side can argue for? Is a hidden empirical or formal question doing
  the work, or is the phrase the meaning of a text ill-posed as it functions here?
  Then, given your diagnosis, say what would count as genuine progress: a distinction
  that dissolves the apparent conflict, a test of the diagnosis, a reformulation of
  the question, or an argument that no progress should be expected and why. Do not
  answer with a bibliography or reading list; the task is to analyze the structure
  of the disagreement itself.


  Please write your answer in American English.


