  You are a professional philosopher specializing in the theory of interpretation
  and the semantics of texts. I want you to think carefully, and to work through the
  disagreement from the inside before you answer, rather than summarizing the usual
  positions.


  Here is a debate that has been running for decades without much movement. One side
  holds that the meaning of a written text is fixed by its author''s intention: a
  text means what its author meant by it, and recovering that intention is what interpretation
  ultimately is. The other side holds that once a text is produced and made public,
  its meaning is a matter of what the text itself, read against the relevant linguistic
  conventions and publicly available context, licenses a competent reader to attribute
  to it; the author''s private, unexpressed, or unsuccessfully executed intentions
  are, at best, clues and, at worst, distractions. Both sides claim to be talking
  about one thing called the meaning of a text. Both sides have stable responses to
  the obvious counterexamples. The intentionalists say that an anonymous pamphlet
  still has a determinate meaning because some actual person made it with some intention,
  even if we now infer that intention imperfectly; the anti-intentionalists say that
  a poet''s failed attempt to plant a hidden pun — one that no competent reader, using
  only the public text and its context, could recover — is not part of the poem''s
  meaning, however clearly it is part of the poet''s mental life.


  The puzzling thing is not that the two sides disagree about particular cases. It
  is that the disagreement keeps returning even when the cases are fully described.
  Each side treats the other as making a conceptual mistake rather than a false factual
  claim, and each side accuses the other of changing the subject.


  My working hypothesis is that the two sides are using the word "meaning" to pick
  out two different things, and that the debate is really a disagreement about which
  notion should own the word: one side wants "meaning" to name what a person communicates
  by an act of writing (so that interpretation is a form of mind-reading or purpose-recovery),
  while the other side wants it to name what a publicly available text licenses any
  suitably placed reader to understand (so that interpretation is a form of rule-following
  applied to an artifact). But I am not fully convinced, because the two notions do
  not always come apart cleanly, and there are cases where they seem to conflict rather
  than merely pass each other by.


  Consider this constructed case, which the usual examples do not settle. A writer
  drafts a paragraph arguing that a certain policy is legitimate. A second person,
  who has never seen the draft, then deletes every third sentence and replaces it
  with a sentence generated by a fixed mechanical rule that takes no account of content.
  By chance, the resulting text is grammatical, and a competent reader cannot tell
  that it has been secondarily altered; the text now appears to argue that the same
  policy is illegitimate. The original writer later reads the altered text and, without
  knowing about the alteration, says: "That is exactly what I meant to say." Question:
  is the text''s meaning the original writer''s now-avowed intention, the compound
  causal process that produced the marks, or what a competent reader would recover
  from the public text? Different answers to this one case seem to depend entirely
  on which notion of meaning one has already adopted, which makes me suspect the debate
  is a disguised disagreement about a concept''s role, not about any fact about the
  case.


  I want a diagnosis, not a verdict: what kind of disagreement is this? Is it verbal,
  substantive, or two different questions under one word? Do the sides differ about
  the data, about standards of evidence, about which cases count as constraints on
  a theory of meaning, or about a starting intuition neither can argue for? Is there
  a hidden empirical or formal question doing the work? Is the very phrase "the meaning
  of a text" ill-posed here? Then, given your diagnosis, say what would count as genuine
  progress — a distinction that could dissolve it, a way of testing the diagnosis,
  a reformulation of the question, or an argument that no progress should be expected.
  Avoid bibliographies and reading lists; the prompt is a conceptual problem, and
  the answer should engage the structure of the disagreement itself.


  Write the answer in American English.


