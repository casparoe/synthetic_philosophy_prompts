  Let''s write final:


  "At a reading group last month we were working through the chapter on taxation in
  Mill’s Principles of Political Economy, and two people got into it about one passage.
  Mill says, almost in passing, that inheritances and legacies over a certain amount
  are highly proper objects of taxation; that the revenue from them should be as large
  as it can be made without prompting evasion through gifts made during life or concealment
  of property; and that graduation—taxing larger amounts at higher rates—is just and
  expedient for inheritance duties, even though he thinks graduation in general taxation
  is objectionable.


  Diane said this shows Mill is actually more radical than people give him credit
  for. His real target is unearned advantage: someone who works and saves may deserve
  their wealth, but the heir didn''t do anything. So a heavy inheritance tax isn''t
  punishment, it''s a way of making the next generation start more nearly equal. The
  proviso about evasion is just him being a practical legislator, not a utopian.


  Marcus said that''s a face-saving reading. Mill explicitly says the tax should stop
  at the point where it would create evasion through gifts inter vivos. But a gift
  to your kid at 25 equalizes starting points exactly as much—or as little—as a bequest
  at 45. If the principle is equal opportunity, then the tax should follow the transfer,
  not the event of death. Leaving lifetime gifts untouched is a giant loophole, and
  Mill names it himself.


  Diane came back that Marcus was treating a limit of administration as a moral limit.
  There''s a continuum from ordinary parental support—paying for piano lessons, a
  car, help with a first apartment—to disguised estate planning. Any system has to
  draw a line somewhere based on what''s feasible to observe and enforce. Death is
  public and verifiable, so an inheritance tax is much harder to evade than a general
  gift tax. Mill is saying: given that line, get as much revenue as you can before
  evasion actually becomes widespread.


  Marcus said that just moves the goalposts. If ordinary parental support is fine,
  then the original problem was never inheritance as such, but the size of the advantage.
  And if a parent can transfer a fortune during life, the recipient''s starting point
  is already fixed before any death tax arrives. So Mill''s proviso doesn''t just
  qualify his principle—it reveals that the principle can''t really be equality of
  opportunity, because he''s willing to tolerate massive unequal starting points whenever
  equality would be inconvenient to enforce.


  Diane replied that this is demanding a purity no actual policy can have. Mill''s
