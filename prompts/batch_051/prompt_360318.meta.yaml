  Communication intent: A theory of conversational inference must explain how a hearer
  can recover content that is not encoded in the sentence. Requirements with cases:


  1. Scalar example: "The system captured some of the error logs" — hearer typically
  infers "not all." Must predict that inference and explain why it disappears in "If
  the system captured some of the error logs, rerun the failed jobs" (here "some"
  need not exclude all — downward-entailing environment). So a theory must be compositional/capture
  embedding environments.


  2. Cancellability: the inference can be explicitly cancelled without contradiction:
  "Some — in fact, all — of the logs were captured." But entailments and presuppositions
  don''t cancel the same way. Distinction between content types must respect cancelability
  tests. But note: some "default" views treat the scalar inference as almost automatic;
  pull between cancelability and defaultness.


  3. Calculability: the inference must be reconstructible from the assumption that
  the speaker is being cooperative/relevant, not just an association. Case: letter
  of recommendation saying a candidate''s punctuality is excellent and nothing else
  -> conveys "not a strong researcher." Requires background reasoning, not dictionary
  knowledge.


  4. Nondetachability: for conversational implicatures (not conventional), the same
  content inferred from different phrasings that truth-conditionally encode the same
  thing ("It''s warm" vs "Not exactly cold" vs...?) — but this is more Grice''s claim;
  for a theory to respect. But relevance theory challenges nondetachability. Good
  to mention as camp preference vs non-negotiable.


  5. Conventional vs. conversational: "but" vs. "and" — "but" contributes a contrast
  without affecting truth conditions. A theory must decide whether these are semantic
  or pragmatic; conventional implicatures muddy the Gricean line. Distinction between
  arising from word meaning vs. from rational inference must be maintained.


  6. Speaker meaning vs. sentence meaning: literal falsehood can still communicate
  truth ("Nice weather" said in a storm, sarcastically) — a theory must handle nonliteral
  routes and explain when hearers do not derive literal content.


  7. Overgeneration problem: if every flouting of a maxim generates an implicature,
  the theory predicts too much; need constraints to distinguish irony, metaphor, lying,
  and plain irrelevance from implicature. Requirements: not derive implicatures from
  every violation; handle conflicting maxims.


  8. Experimental/processing constraints: scalar implicature rates vary across expressions
  ("some" vs "or" vs numerals; "warm" vs "some" scalar diversity), children compute
  them late and in some environments, and optionality in reading times. A proposed
  theory can''t contradict those results; but the operationalization of "default"
  vs "context-driven" by reaction time is debated — flag as contested, not a fixed
  requirement.


  9. Distinction from presupposition and entailment: "The backup job stopped" entails
  there was a backup job? No: presupposition "stopped" presupposes it used to run;
  "It didn''t stop" preserves it (projection). Implicatures don''t project under negation
  the same way. A theory must provide principled diagnostics and account for projection.


  10. Systematicity/predictability: a theory should not explain each case ad hoc;
  needs fine-grained axioms/scales (Horn scales, orderings) with a derivation procedure.
  But Grice insisted general rationality, not a code. Tension: single system vs. ad
  hoc scales.


  11. Goal-dependence: what counts as cooperative depends on the task and the asker''s
  stakes (adversarial vs. aligned). Requirement: the theory must parameterize the
  speaker''s goals without assuming total alignment.


