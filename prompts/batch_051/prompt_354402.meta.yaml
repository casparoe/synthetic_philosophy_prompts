  I''ve been reading alignment debates for years, and I have a policy I''ve been applying
  to my own takes, not just other people''s. I dont let myself endorse any procedure
  for picking whose values an aligned AI should serve unless I can name a concrete
  value I actually hold that the procedure would, in some realistic case, override
  — not a value I performatively hold, one where I''d feel the loss and still say
  the procedure was right. If I can''t produce one, I treat my support for the procedure
  as my own values wearing a neutral mask, and I stop arguing for it.


  The thing is, this test has started biting me. Last week I was defending a version
  of aggregation — something like "take everyone''s suitably-informed preferences
  and maximize their satisfaction" — and when I ran my own test, I couldn''t confidently
  point to one of my own preferences that I would let it sacrifice. So I went quiet
  mid-thread, and a couple of people said I was being overly performative, or that
  a neutral procedure doesn''t need to hurt me personally to be neutral. I think that''s
  probably true in principle, but I also don''t know how else to catch myself when
  I''ve just dressed up my own values as the obvious aggregate.


  Is the policy defensible, or is it a bias with a nice-sounding name? Is there a
