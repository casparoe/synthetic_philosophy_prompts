  up for Thursday''s committee meeting. I want the memo to be fair to both sides of
  that argument rather than quietly assuming mine.


  Mrs. H., 81, has had advanced dementia for several years and lives in our memory
  unit. Eight years before her decline she executed an advance directive stating that
  she did not want artificially provided food and fluids if she ever reached an end-stage
  condition with no realistic prospect of recovering meaningful awareness. She is
  now bed-bound, no longer recognizes her family, rarely speaks, and requires total
  care, but she does track faces, quiet at a familiar voice, and sometimes swallows
  spoon-fed purée. Her physician reports that she has only minimal, fluctuating awareness,
  that her swallowing is becoming unsafe and insufficient, and that without a feeding
  tube she will most likely die of malnutrition or dehydration within two to four
  weeks; with a PEG tube she could live six to twelve months, with no prospect of
  recovering cognition. Her son, who is her healthcare proxy, argues that the directive
  should govern and that placing a tube in a woman who cannot comprehend it would
  be an assault on the person his mother was. Her daughter argues that the directive''s
  awareness condition is not clearly met, that her mother still has some awareness,
  and that allowing her to starve or die of thirst would be an affront to human dignity.
  One of the unit''s senior nurses has also asked the committee to consider the position
  of staff, who do not want to be put in the role of witnessing a slow death by dehydration
  when a routine tube could prevent it; she says the unit exists to protect resident
  dignity, not to facilitate dying.


  The committee must decide: authorize placement of the feeding tube, or adopt a care
  plan of careful hand-feeding, mouth care, and comfort measures only. Please draft
  the decision memo I will circulate. It should state a clear, actionable recommendation;
  give reasons that engage the losing side''s strongest dignity-based argument rather
