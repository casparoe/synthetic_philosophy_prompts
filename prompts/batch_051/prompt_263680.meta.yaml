  I serve on the ethics committee of a geriatric care hospital. Last night I spent
  an hour arguing with a friend who teaches philosophy; his position was that "human
  dignity" is a vacuous concept that never adds anything to autonomy and ordinary
  beneficence, while I kept insisting it must mark something more — a constraint on
  how a person may be treated regardless of what she now understands or controls.
