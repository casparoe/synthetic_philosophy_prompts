  Type 1: "State a set of one''s own commitments and ask whether they hang together."
  The asker lists several beliefs within Berkeley''s idealism domain, asks whether
  the set is jointly tenable, which pairs pull against each other, which apparent
  tensions dissolve, what cheapest fix is, what it costs. The asker shouldn''t know
  where the problem is or signal what they''d give up. Deliverable: audit, tensions
  ordered by severity.


  Belief set should be largely reasonable, recognizably held by a real kind of person
  (a Berkeleyan idealist with phenomenalist/counterfactual leanings), with one or
  two genuine tensions that are not obvious, plus one apparent tension that dissolves.


  Let me craft commitments:


  1. Everything I ever perceive is an idea in my own mind (or "all immediate objects
  of perception are mind-dependent ideas"). Standard Berkeley.

  2. The master argument succeeds: I cannot even conceive of an object existing unconceived,
  so the very idea of a mind-independent object is incoherent. (Passage supports.)

  3. Ordinary claims about unperceived objects (the tree in the quad when no one''s
  there) are still true, and they''re made true by facts about what a perceiver would
  perceive if they were suitably placed — the tree is a standing possibility of sensation.
  (This is the counterfactual/phenomenalist gloss Berkeley himself flirts with, "the
  tree should exist" in terms of God''s perception.)

  4. God''s constant perception is what makes unperceived things real when no finite
  mind perceives them. (Berkeley''s official view.)

  5. Physics/science is just the discovery of regularities in the succession of ideas
  — laws are patterns in my (and others'') experience, not about hidden material mechanisms.

  6. My own mind (and other finite spirits) are not ideas; I have a notion of myself
  as a perceiving substance even though I have no idea of it.


  Where are the tensions?


  - Tension between 3 (counterfactual/phenomenalist account of unperceived objects)
  and 4 (God''s perception account). If unperceived objects are guaranteed by God''s
  perception, the counterfactual analysis is redundant; but worse, the two accounts
  can come apart: a thing could exist unperceived by finite minds yet there be no
  true counterfactual about what a finite mind would perceive (e.g., a fern in an
  unobserved forest—actually counterfactual holds; hmm). Or conversely the counterfactual
  could hold but God not perceive? Not under Berkeley''s theism. The genuine tension:
  3''s phenomenalist analysis makes existence consist in possible finite perceptions,
  which makes God''s perceptual activity irrelevant to the existence of unperceived
  objects; 4 makes existence consist in actual divine perception. These are competing
  metaphysical accounts of the same facts, not a neat division of labour. Also if
  unperceived existence is analysed counterfactually, then God''s perception isn''t
  needed, and if God perceives all ideas, then counterfactual analysis is false or
  at least not the truth-maker. That''s a real tension.


  - Tension between 2 (cannot conceive of unconceived objects / master argument) and
  3/4? Actually 2 is about inconceivability of mind-independent existence; 3 and 4
  are about unperceived-but-mind-perceived (God) existence, so they''re consistent.
  But there''s a subtler tension: the master argument''s conclusion is that existence
  "without the mind" is inconceivable; yet in 4 the tree exists when no finite mind
  perceives it because God perceives it. But then "unperceived by us" is fine, "unperceived
  by all minds" is not. No tension with 2. However, there is a tension between 2 and
  5? Not obviously.


  - Tension between 1 (all I perceive are ideas in my own mind) and 6 (I have a notion
  of myself as substance): Berkeley''s own view handles this by distinguishing ideas
  and notions. But there''s a famous problem: if all I ever perceive are fleeting
  ideas, how do I have a "notion" of my own mind as a persisting substance? Berkeley
  says I know myself by inward feeling/reflection. Is that a genuine tension? It''s
  a standard objection but maybe dissolves if we accept Berkeley''s distinction. Could
