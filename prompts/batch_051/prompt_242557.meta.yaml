  - Another apparent tension: 3 (tree exists as possibility of sensation) vs 1 (everything
  perceived is idea in mind): seems to make the tree a mere possibility, which sounds
  like it doesn''t exist when unperceived — but actually on the counterfactual view,
  a real tree is a stable pattern/potential, so no tension. Or 4 vs 5: physics as
  regularities vs God''s perception — no tension, God''s ideas are the relata of laws.


  - Another genuine tension: 2 (master argument shows mind-independent objects are
  inconceivable, so there''s no coherent alternative to idealism) and 6 (I have a
  notion of myself as a perceiving substance) combined with 1? There''s the famous
  problem that if all ideas are in my mind, and I only know my mind as that which
  perceives ideas, then the self is in danger of being either an idea (contradicting
  6) or unknowable. But Berkeley''s "notion" is his solution. Might be an apparent
  tension that dissolves, or a residual genuine tension.


