  says the eliminativist must deny any mental life at all, which conflates eliminating
  propositional attitudes with eliminating all mental phenomena/consciousness. Actually
  Churchland (Paul) is also eliminativist about qualia, but standard eliminative materialism
  about beliefs/desires doesn''t require denying consciousness or qualitative states.
  The student''s objection sets up a strawman ("deny any mental life at all") then
  knocks it down. Hmm, but some eliminativists do deny qualia as folk concepts; but
