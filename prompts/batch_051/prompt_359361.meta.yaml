  I have spent my working life in the natural sciences, and only recently have I begun
  to read legal and political philosophy in any systematic way. A term that keeps
  surfacing — in court opinions, in moral philosophy, and in public debate — is the
  notion of a "suspect" ground of discrimination: a basis for treating people differently
  that we single out for special scrutiny, as opposed to the ordinary distinctions
  (in hiring, grading, pricing, social judgment) that we make all the time without
  a second thought.


