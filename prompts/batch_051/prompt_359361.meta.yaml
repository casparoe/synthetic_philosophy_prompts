  following cases, which I deliberately chose to embarrass simple answers:


  1. Race (clearly suspect, if anything is).

  2. Religion (also protected, yet in an important sense chosen, and bound up with
  belief).

  3. Sex (protected in most modern systems).

  4. Height (immutable, morally arbitrary, and a genuine source of disadvantage in
  some areas, but generally not treated as suspect).

  5. Left-handedness (historically stigmatized, immutable, morally irrelevant, but
  no longer a live axis of subordination).

  6. Age (protected in some employment contexts, yet plainly relevant to many decisions
  and not usually treated as "suspect").

  7. Body weight (increasingly stigmatized, partly behavioral, partly constitutional,
  with contested health relevance).

  8. A genetic predisposition to a serious disease (immutable, unchosen, and genuinely
  relevant to insurance and some employment decisions).

  9. A criminal record (heavily consequential, often a proxy for race, but grounded
  in past conduct).

  10. Political affiliation or opinion (voluntary, tied to expression, protected in
  some contexts but not treated as a classically suspect category).


  For each case, I want more than a bare verdict. I want the proposed definition to
  be run through the case: on the definition, why does the case fall where it does
  — or, if the definition gives no answer or the wrong answer, say so explicitly,
  and either revise the definition or defend the surprising verdict. At the end, tell
  me which of your verdicts you regard as least secure, and whether the concept of
  a suspect ground is best understood as one thing or as a loose family of grounds
  held together by different rationales.


  If it helps, my own hunch is that three considerations do much of the work — immutability,
  moral irrelevance to the decision in question, and a history of group subordination
  — but that no one of them is sufficient and no workable definition keeps all three.
  I want you to stress-test that hunch, not vindicate it.


