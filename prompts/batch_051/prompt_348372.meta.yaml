  I need to craft precedents. Let me think about the death determination landscape.


  Death criteria:

  - Neurologic criteria (whole brain death): irreversible cessation of all functions
  of the entire brain, including the brainstem.

  - Circulatory criteria: irreversible cessation of circulatory and respiratory functions.

  - The Uniform Determination of Death Act (UDDA) in the US: "an individual who has
  sustained either (1) irreversible cessation of circulatory and respiratory functions,
  or (2) irreversible cessation of all functions of the entire brain, including the
  brain stem, is dead."


  Key complications:

  - In DCD (donation after circulatory determination of death), after asystole, there''s
  a "no-touch" period (usually 5 minutes) then death declared. But "irreversible"
  is tricky: autoresuscitation (heart restarting on its own) is rare; but medical
  intervention could restart it. The standard is that circulation won''t restart spontaneously
  (permanence) rather than irreversibility in the strict sense (couldn''t be restarted
  even with CPR).

  - NRP (normothermic regional perfusion): after circulatory death is declared per
  DCD protocol, ECMO or pump restores circulation to abdominal organs (or chest) to
  perfuse them ex vivo-ish, sometimes with a clamp to exclude cerebral circulation
  (A-NRP / TA-NRP). Question: if circulation is restored, was the cessation "irreversible"?
  Some argue NRP violates the dead donor rule; others say death was already determined
  and restoring regional perfusion doesn''t resurrect the patient because brain circulation
  remains excluded.


