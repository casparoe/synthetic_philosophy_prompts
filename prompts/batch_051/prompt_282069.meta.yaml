  Peirce''s pragmatic maxim: "Consider what effects, that might conceivably have practical
  bearings, we conceive the object of our conception to have. Then, our conception
  of these effects is the whole of our conception of the object." There are various
  formulations. The core: meaning of a concept = totality of conceivable practical
  consequences/bearings.


  The fixation of belief (1877): methods of settling opinion: tenacity, authority,
  a priori, science. The scientific method is distinguished by being responsive to
  an external permanency, by producing belief that would converge in the long run,
  and by fallibilism + the community of inquiry. The "end of inquiry" is settlement
  of opinion/belief; truth is what would be believed at the limit of inquiry.


  Fallibilism: any belief could in principle be overthrown; inquiry is self-correcting;
  the community, not the individual, is the subject of knowledge.


