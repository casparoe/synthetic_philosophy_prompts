  Hold on. Let''s map:


  Contextualism: the truth of "S knows that p" depends on the standards in the context
  of the person making/assessing the claim (attributor), not the subject''s stakes.

  SSI (pragmatic encroachment): whether S knows depends on how much is at stake for
  S. But the truth of a knowledge ascription? On SSI, "S knows that p" is true iff
  S knows (relative to S''s stakes). So attributor''s stakes irrelevant.


  So:

  - Case H2S (subject high stakes, attributor low standards): Contextualism: attributor
  low standards, "S knows" true if evidence meets low bar. SSI: subject high stakes,
  so S doesn''t know; "S knows" false. They diverge here.

  - Case L2H (subject low, attributor high): Contextualism: false (high standards).
  SSI: true (subject low stakes). Diverge.


  So earlier verdicts should pin professor to neither, or perhaps with cases that
  both theories handle the same.


