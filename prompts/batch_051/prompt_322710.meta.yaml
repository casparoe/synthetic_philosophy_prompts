  Prompt components:

  - First sentence sets the scene: software engineer, no philosophy background, thinking
  about curiosity/info.

  - State the theory: I''ve absorbed from decision theory/engineering that information
  is never bad in expectation — expected value of information is nonnegative, because
  worst case you ignore it. So curiosity is a pure virtue: more true beliefs never
  hurt, and knowledge is worth having for its own sake. Helps in debugging, etc.

  - The firm intuition that clashes: some examples where knowing seems bad or at least
  not worth it: knowing exactly what your friends really think of you (the raw unfiltered
  truth), knowing the date of your death, morbid curiosity about painful details,
  wanting to read your partner''s phone. Also maybe "curiosity about things that can''t
  be acted on" — e.g., if I''m told a fact but promised I can''t use it, is it still
  valuable? But the clash is better: the theory says all info weakly improves decisions;
  but the intuition says some knowing makes life worse and curiosity can be a vice
  (prurience, nosiness, doomscrolling).

  - Ask: which should yield? Present both sides at strongest, then tell me whether
  to debunk the intuition (scope insensitivity? imagination failure?), amend the theory
  (value of information has holes when the agent changes, when knowing changes preferences,
  when you can''t commit to ignoring, when facts are learned by others?), or find
  a reading where both survive (curiosity as a virtue but not unbounded; knowledge
  for its own sake as about understanding rather than raw facts).

  - Maybe mention: I don''t want a policy answer or reading list; want the argumentative
  structure.

  - Prompt engineering: assign role "You''re a professional philosopher who also knows
  some decision theory", ask "think carefully", "start by brainstorming the strongest
  case for each side before deciding", include a typo or two.


