  ---


  You are grading a take-home exam for an upper-level undergraduate seminar in philosophy
  of criminal law. Your task is to read the exam question and the student''s submitted
  answer, then grade it with a numerical score out of 10 and a point-by-point set
  of comments. Before assigning the grade, take a moment to think through what an
  excellent answer would need to establish, what it would need to disentangle, and
  which steps in the student''s reasoning are load-bearing. Do not grade on style
  alone, and do not let the answer''s general fluency substitute for checking each
  move against the texts and doctrines invoked.


  Exam question:


  In chapter 5 of On Crimes and Punishments (1764), Cesare Beccaria offers a critique
  of obscure criminal laws. Paraphrase his central argument in that chapter — being
  careful to state the connection he draws between legal obscurity, interpretation,
  and political power. Then answer the following two questions. (a) Would the rule
  of lenity, as it operates in American criminal law, be sufficient to meet Beccaria''s
  objection? Why or why not? (b) Consider a modern ordinance making it a misdemeanor
  to "annoy, abuse, or threaten" another person in public. Does this ordinance exhibit
  the defect Beccaria identifies? Apply his reasoning directly to the statutory language,
  and state what your application reveals about the difference between his complaint
  and a modern void-for-vagueness challenge.


  Student''s answer:


  Beccaria''s chapter on the obscurity of laws argues that when a penal code is written
  in a language that ordinary citizens cannot understand, the law no longer guides
  conduct. Citizens become dependent on a small group of legal interpreters, because
  they cannot read the rule for themselves. This transfers effective legislative power
  from the sovereign or the public text to judges and jurists, who announce what the
  law "really" means. Beccaria thinks this is a serious political harm: the public
  loses the ability to foresee the legal consequences of its actions, and punishment
  becomes a function of private opinion rather than public law. A clear, widely comprehensible
  criminal code is therefore not merely a convenience but a safeguard of liberty and
  deterrence.


  On (a), the rule of lenity is the principle that ambiguous criminal statutes should
  be construed in favor of the defendant. This seems responsive to Beccaria''s worry,
  and in fact Beccaria himself endorses something like it when he says that judges
  should resolve doubts in favor of the accused. But lenity is not sufficient. Lenity
  operates only after a court has already determined that the statute is ambiguous,
  and judges can disagree about whether the language is ambiguous at all. Moreover,
  lenity is a constitutional mandate in American law, grounded in the due-process
  requirement of fair warning, so it protects the defendant at the point of adjudication
  but does not make the law ex ante knowable to the person deciding whether to act.
  A citizen who cannot tell whether her conduct falls within the statute has already
  been failed by the law, even if a court later rules that the statute was ambiguous
  and resolves that ambiguity in her favor.


  On (b), the ordinance making it a misdemeanor to "annoy, abuse, or threaten" another
  person in public does not exhibit Beccaria''s defect. The terms are drawn from ordinary
  language, so they are at least comprehensible to the ordinary citizen; the problem
  Beccaria identifies is specifically about legal Latin and technical jargon that
  excludes the public. Moreover, courts have upheld similar language against constitutional
  challenge, which shows that such language does not hand judges an unconstrained
