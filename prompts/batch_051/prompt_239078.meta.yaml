  Desiderata for a species concept:


  Cases it must get right / handle:

  - Ring species (e.g., Ensatina salamanders or greenish warbler): a chain of interbreeding
  populations where the ends meet but don''t interbreed. Any criterion based purely
  on pairwise interbreeding gives non-transitive results. So the concept must either
  accept transitivity violations or explain why the ring is one species or two or
  many.

  - Asexual lineages (bdelloid rotifers, many plants, parthenogenetic lizards): no
  interbreeding at all. BSC says species status undefined or just "no"; but systematists
  still name species. A concept must say what a species is when there''s no sex.

  - Bacteria and archaea with horizontal gene transfer: genomes are leaky; the "tree
  of life" at the base is a net. Any concept built on a single common gene tree must
  say why species remains useful when gene trees conflict.

  - Chronospecies in paleontology: anagenetic change over time splits a continuous
  lineage into species at arbitrary points. A concept must handle time: are species
  in a single evolving lineage arbitrary slices or real?

  - Hybrid zones and introgression (e.g., plants and animals where hybrids are fertile;
  coyotes/wolves/dogs, mallards and other ducks): if reproductive isolation is the
  criterion, how much gene flow is "too much" — a species concept must specify a threshold
  or explain why the threshold is a convention. (This ties to desideratum: not collapsing
  "species" into "more or less gene flow".)

  - Speciation in progress (incipient species, e.g., cichlids, host races of fruit
  flies). A concept must handle partial isolation, not just completed speciation.

  - Dobzhansky-Muller incompatibilities? Might be too niche but okay as a passing
  mention.


  Distinctions it must respect:

  - species category vs. species taxa (the rank vs. particular species) — maybe phrase
  in plain language.

  - what a species concept is for: communication among biologists vs. tracking real
  units of evolution. A concept might be good for one and bad for another; the desiderata
  should separate the jobs.

  - discovery vs. stipulation/convention: which parts of species delimitation are
  empirical and which are decisions about criteria.

  - The difference between criteria for recognizing species and what species are (operational
  criteria vs. ontology). E.g., "reproductive isolation" is an operational criterion
  but not an identity claim.

  - Explanatory target: species as units of evolution/biodiversity/classification.
  A concept can be good for one job (e.g., counting biodiversity) and poor for another.


  Results from biology it can''t contradict:

  - gene flow is common even between "good" species (adaptive introgression); estimates
  of gene trees conflict with species trees due to incomplete lineage sorting.

  - Monophyly is a property of gene trees/clades, not of individual species; using
  monophyly as a criterion runs into trouble for recent species (a newly split species
  may not be monophyletic). Actually "reciprocal monophyly" is a thing. Could mention:
  any concept that requires species to be clades must say what to do about a species
  that becomes monophyletic only after time; newly arisen species are not monophyletic
  relative to the species they budded from. Models might handle this; it''s standard
  in Speciation lit. Fine.

  - The population-genetic fact that speciation is often gradual and polygenic (speciation
  continuum).

  - Maybe the fact that "isolating mechanisms" can evolve after divergence (they''re
  not necessarily the cause of splitting) — a theory can''t assume reproductive isolation
  is the cause of speciation.


  Which requirement knocks out the most popular theories: The BSC fails on asexuals,
