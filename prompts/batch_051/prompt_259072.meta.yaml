  I''m a PhD student in philosophy of cognitive science, working on self-models and
  metacognition, and I''ve been going back and forth with my advisor about Hofstadter''s
  claim that the self is a strange loop—a self-referential symbolic pattern that ends
  up perceiving itself as an I. My advisor thinks it''s a seductive metaphor but once
  you cash it out it''s either trivial (any system that represents itself instantiates
  a loop) or false (the first-person perspective isn''t just a symbol system pointing
  at itself). I''m more sympathetic, but I''ve never actually forced myself to put
  a number on it, and I''d like to outsource that to someone who isn''t defending
  a disseration.


  Here''s the proposition I want your credence in: the first-person self literally
  is a strange loop—a real, self-referential symbolic pattern of the general kind
  Hofstadter describes—rather than a merely useful narrative fiction, a non-symbolic
  subject of experience, or just an ordinary self-model with an indexical pointer
  to its own body. Not "it''s useful to think of it as a loop"; the claim is that
  the loop is what the self consists in. Give me your actual number, and then decompose
  it. The sub-questions I want are at least these: (a) whether self-reference is constitutive
  of a self or just a ubiquitous byproduct of any system that tracks itself; (b) whether
  a symbolic loop can generate a first-person perspective or only a representation
  of one; (c) how much of the intuition that there''s something looplike comes from
