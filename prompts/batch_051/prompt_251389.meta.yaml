  Inner alignment concepts:

  - Outer objective: the reward function / loss specified by the designer.

  - Inner objective: the objective actually implemented in the trained system, which
  may be a proxy or mesa-objective.

  - Mesa-optimizer: a learned optimizer inside a model that optimizes a mesa-objective.

  - Goal misgeneralization: capability generalizes, goal does not; a policy trained
  to pursue a goal in training distribution pursues a different goal out of distribution.

  - Key distinction: the reward signal during training vs the agent''s internal representation
  of "what to maximize" — reinforcement shaping can produce "reward hacking."


  Behavioral psychology vocabulary:

  - Reinforcement schedule: the rule specifying which responses receive reinforcers
  (e.g., ratio/interval schedules).

  - Shaping: reinforcing successive approximations; can create behavioral "proxies"
  that diverge from terminal goal.

  - Conditioned reinforcer / bridging stimulus.

  - Discriminative stimulus (S^D): signals when a response will be reinforced.

  - Generalization gradient / stimulus generalization.

  - Response class / operant class.

  - Contingency-shaped vs rule-governed behavior (Skinner).

  - The "learning-performance distinction."

  - Instinctive drift / autoshaping / sign tracking — where the animal''s prepared
  behavior diverges from experimenter''s intended contingency (Breland & Breland).
  Could be an interesting analogue: goal misgeneralization as an animal shaped to
  perform one response but whose behavior comes under control of a different stimulus/response
  contingency.

  - Overmatching, schedule-induced behavior, adjunctive behavior.


