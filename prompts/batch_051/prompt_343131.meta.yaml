  ---


  I''m a journalist who covers science and ideas, and next month I''m giving a talk
  at a conference on addiction, criminal responsibility, and the brain. The piece
  I''m presenting is basically the Dennett move: ask which varieties of free will
  are worth wanting, not whether free will exists. My thesis is that the version of
  free will the "neuroscience disproves it" crowd attacks — a break in the causal
  chain, an uncaused cause — isn''t worth wanting and isn''t what blame or the law
  actually tracks. What''s worth wanting is a messy bundle of trainable, scalar capacities:
  impulse control, foresight and stable temporal discounting, the ability to do what
  you''d endorse on reflection, the ability to revise your values over time. And I''ll
  argue that the neuroscience of addiction doesn''t show these are illusions; it shows
  how they''re built, how they vary across people and situations, and how they get
  damaged or repaired.


  The audience is mostly forensic psychiatrists and legal scholars who work on criminal
  responsibility, with a few computational neuroscientists who do intertemporal choice
  and delay discounting. They''re not hard determinists; they think hard determinism
  is unhelpful for anything a court does. But they''re also suspicious of compatibilism
  because it sounds like it just changes the subject. So they''ll be primed to press
  me on whether my account has any actual work to do.


  My argument, quickly, is: (1) the free will people worry about losing is a strawman;
  (2) what we actually hold people responsible for is the exercise or failure of capacities
  that are empirically real and often improvable; (3) the legal system already presupposes
  thresholds on those capacities — insanity, duress, immaturity — so the real argument
  is about where lines go and whether they should be scalar rather than binary; (4)
