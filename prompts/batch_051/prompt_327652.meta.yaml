  I sit on a small statutory advisory panel that signs off on welfare conditions for
  fish and shellfish farms in our county; we work case by case, and our decisions
  function as precedents. Over the past four years we have: approved with conditions
  a salmon producer''s request to raise cage stocking density from 14 to 20 kg per
  cubic metre, on condition of monthly fin-scoring and sea-lice counts; rejected a
  proposal to hold edible crabs out of water at 4°C for up to 48 hours before sale,
  requiring instead submerged, chilled holding with a maximum of 12 hours; approved
  with conditions a plan to pump rainbow trout from tanks to the stun table without
  anaesthesia, provided total crowding time stayed under 15 minutes and oxygen was
  monitored; rejected a proposal to introduce eyestalk ablation in Pacific whiteleg
  shrimp broodstock, even though the applicant''s intact females were projected to
  spawn a third less; and, after a site inspection, we required a salmon harvest station
  to replace CO2 stunning with percussive or electrical stunning within 18 months,
  with daily insensibility checks during the transition.


  Now we have a new application. A sea-bass producer wants to harvest by plunging
  fish into an ice slurry to immobilise them before bleeding out, with no prior electrical
  stun. Percussive stunning is not practical for sea bass at the firm''s throughput,
  and an electrical stunner for sea bass exists on the market but has not been validated
  on this farm''s line speeds, and fitting and trialling it would push processing
  costs up by perhaps 15 per cent. The producer asks for a five-year licence to harvest
  by ice slurry while they run validation trials in parallel; they point to our trout-pumping
  precedent as showing that we allow handling without anaesthesia when conditions
  are bounded, and to the salmon stunning precedent as a one-species response to a
  specific carbon dioxide problem. I am less interested in what we happen to feel
  than in what our own track record commits us to. What should we decide if we want
  to be consistent with ourselves? Which earlier decision is the closest analogue,
  which candidate rules fit our precedents equally well, and what further case would
  best force them apart?


