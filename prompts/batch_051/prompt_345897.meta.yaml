  able to help; my ability is an enabler, not itself a reason. The fact that someone
  asked me to do something only favours if... etc. This is accurate. Particularism
  is also a view about moral principles: there are none (or no codifiable morality).
  Dancy connects holism of reasons to particularism. The prompt''s focus on reasons
  is defensible.


