  Title-less, starting directly.


  "Hey, I''m a history PhD student (early modern stuff, with one foot in philosophy
  of history) and I need help dismantling a slogan. You know Ranke''s old line, *wie
  es eigentlich gewesen* — ''how it actually was''? In my department it gets used
  as the end of the conversation whenever anyone proposes a project that''s interpretive
  or theory-heavy. Most recently an older faculty member shut down my proposal to
  read a set of sixteenth-century chronicles through a framework from social memory
  studies by saying, and I quote, ''Man hat der Historie das Amt, die Vergangenheit
  zu richten, die Mitwelt zum Nutzen zukünftiger Jahre zu belehren, beigemessen; so
  hoher Ämter unterwindet sich der gegenwärtige Versuch nicht. Er will bloß zeigen,
  wie es wirklich gewesen ist.'' The implication being that my whole chapter is, I
  don''t know, doing the judging-and-teaching thing Ranke disowned."


  Then: "But the sentence seems to me to be doing several different jobs at once,
  and I want to know which one actually licenses the dismissal. Could be claims like
  (i) historians should not moralise about the past; (ii) there is a single determinate
  past independent of the historian''s perspective; (iii) the past can be described
  without imposing narrative form; (iv) the only legitimate historical question is
  descriptive, not explanatory or evaluative; (v) the sources, read critically, transparently
  yield the past; or something even stronger. I''m sure there are more."


  Then ask: "What I want is a menu, not a single interpretation: take the line and
  lay out the distinct precise theses it could be expressing, from the platitudinous
  to the radical. For each, say whether it''s trivial, defensible, or false (and why
  briefly), and then tell me which of those readings would actually support using
  the line to shut down a memory-studies reading of early modern chronicles. If some
  readings only support a weaker dismissal (''your theory adds nothing'' vs ''your
  theory is impossible''), separate those. Also: people in my field mix up ''sagen''
  and ''zeigen'' and ''eigentlich'' and ''wirklich'' across editions, and I''d like
  to know if any of the precisifications hang on that word choice."


