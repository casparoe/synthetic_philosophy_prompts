  Actually, I think Type 2 with "the experience machine" plus negative utilitarianism
  raises the question: would a negative utilitarian plug in to avoid suffering? The
  classic experience machine tests hedonistic utilitarianism (maximize pleasure).
  Nozick says we wouldn''t plug in because we value reality. Negative utilitarians
  care about reducing suffering; if the machine removes suffering, a pure negative
  utilitarian might say plug in (if it minimizes expected suffering) — even if it
  is illusory. But wait, classical hedonistic utilitarians also count pleasure and
  pain; negative utilitarian only cares about suffering, so the experience machine''s
  "pleasure" becomes irrelevant, but the removal of suffering is decisive. So the
  variation: Nozick''s experience machine normally assumes life outside is fine and
  the machine delivers continuous positive pleasure; the standard Nozickian verdict
  is we wouldn''t plug in because of authenticity. From a negative utilitarian lens,
  the case as stated doesn''t even engage their theory because the machine only promises
  pleasure, and negative utilitarians don''t count pleasure. So the interesting move:
  change the parameter — the machine also permanently removes all pain (including
  future pain, grief, boredom), not just adds pleasure. Does the negative utilitarian
  now have to plug in? If the machine guarantees zero suffering and the real world
  contains a nonzero probability of serious suffering, a commitment to minimizing
  expected suffering seems to mandate plugging in — unless there are indirect costs
  or the view has a lexical threshold that only forbids intense suffering, or unless
  one adopts an "other things equal" principle. Press: does this become a reductio
  of pure negative utilitarianism? What would a threshold/lexical negative utilitarian
  say if the machine eliminated all suffering below the threshold but left a small
  chance of above-threshold suffering?


