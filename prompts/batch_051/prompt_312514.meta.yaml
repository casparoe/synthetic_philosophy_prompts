  Prompt draft:


  "Take Nozick''s experience machine, and suppose the machine has been redesigned
  so that, in addition to delivering whatever pleasant experiences the subject chooses,
  it also guarantees a complete absence of pain — physical and emotional — for the
  duration of the connection, including the removal of all anxious anticipation and
  all memory-taint from past suffering. Life outside the machine, by contrast, is
  known (from good actuarial evidence) to involve, for a typical person, a small but
  real lifetime risk of a period of severe, unmanageable pain — say, a two percent
  chance of a month of extreme suffering from an illness or injury. Nozick''s original
  argument appeals to values like authenticity and contact with reality; a classical
  hedonistic utilitarian can coherently decline to plug in only if those values are
  themselves converted into pleasure or preference terms. Now run the negative utilitarian
  analysis. Does a pure (unthresholded) negative utilitarian have to plug in, assuming
  the machine genuinely minimizes expected suffering? If so, is that a reductio of
  the view, or a feature it can accept? What does a threshold or ''lexical'' negative
  utilitarian — for whom eliminating the risk of extreme suffering has priority over
  all positive well-being — say about this case? Where exactly do the two versions
  part ways, and what change to the parameters of the case (for example, raising or
  lowering the probability or intensity of the possible pain, or introducing a small
  chance that the machine itself malfunction and cause a brief, severe pain) is needed
  to expose the difference?"


