  Let me refine the presupposition argument to be rigorous and avoid questionable
  premises. I want the argument to truly "prove too much": that conversational score
  is radically unconstrained. Let''s formulate:


  1. In a scorekeeping model of conversation, an utterance is appropriate only if
  its presuppositions are true according to the conversational score (the common ground).

  2. When an utterance''s presupposition is not yet in the score but the shared conversation
  could take it for granted without objection, hearers accommodate: they quietly add
  the needed proposition to the score, making the utterance appropriate after the
  fact.

  3. Accommodation does not require the proposition to have been asserted, justified,
  or accepted as a topic of conversation; it happens automatically as part of updating
  the score.

  4. Therefore, by embedding any proposition P we want into the presupposition of
  a sentence and uttering that sentence, we can get P into the common ground, as long
  as P is consistent with the score and not so controversial that the hearers object.

  5. That means a slip of the tongue or a crafty speaker can insert almost anything
  into what is supposed to be the public record of shared commitments, without ever
  vouching for it.

  6. But a common ground that can be changed by unnoticed presupposition is no longer
  common: it is just a record of unchallenged moves. So the scorekeeping model implies
  the common ground is not genuinely common — a conclusion that seems to undercut
  the model''s own explanatory ambitions.


  Where does this go wrong? The likely diagnosis: premise 3/4 overstates accommodation;
  accommodation is not automatic and has constraints (not just consistency; bridge
  relations, plausibility, "non-controversiality"); premise 6 may be too quick (shared
