  Draft:


  "Ok I''m a PhD student in political theory writing on AI alignment, and I have a
  concept I''ve been using in my dissertation that I need someone to kick the tires
  on. I call it ''axiological displacement.'' The idea is roughly this: whenever an
  AI system aggregates values across persons into a single objective function, it
  doesn''t actually serve any individual''s values. It serves the values of the aggregate.
  The individual''s value function only enters as data; the thing being optimized
  is a summary that no actual person holds. And I want to say the choice of summary
  — which weights, whose preferences count, how much idealization you do before you
  aggregate — is itself a substantive conception of the good, even if nobody calls
  it that. So a preference-aggregating AI is quietly doing what liberal neutrality
  always told the state not to do: adjudicating between rival conceptions of the good.


  Concrete example: a group assistant that optimizes over everyone''s stated preferences
  will sometimes produce an output that is nobody''s first choice and that each person,
  considered individually, would not have chosen. I think that''s fine for picking
  a restaurant. The problem is when the system does this at scale with life-shaping
  outputs — say, deciding what information to show a person based on a model of what
  people like them value. At that point the individual is being steered by a value
  function they never endorsed.


  So the strong version of my claim is: every aggregation procedure displaces individual
  values, because even the choice of procedure expresses some values rather than others.
  The weaker version is just that most existing alignment approaches do this, and
  we should at least be honest that ''aligned with human values'' means ''aligned
  with a particular, contestable model of human values.''


  I''m aware this sounds like I''ve reinvented the social choice critique of utilitarianism,
  or maybe Sen''s liberal paradox, or something about perfectionism. Tell me if it
  already exists under a better name. Also tell me where it breaks: is the strong
  version actually defensible, or does it collapse into the claim that any decision
  affects someone on someone''s terms? And is there a way to design an AI that doesn''t
  displace — like some kind of neutral arbitration that only enforces side-constraints
  and otherwise refuses to aggregate — or is that just displacement with extra steps?"


