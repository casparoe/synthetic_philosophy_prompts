  "Take the standard game-theoretic reconstruction of Hobbes''s state of nature as
  a one-shot prisoner''s dilemma. In it, each of many roughly equal agents can either
  keep a covenant (cooperate) or renege on it (defect). Payoffs are such that reneging
  on a covenant while the other party keeps it is best for the reneger, mutual keeping
  is better than mutual reneging, and being the victim of a reneger while keeping
  is worst. Since reneging is strictly dominant, no one rationally makes a covenant
  in the absence of enforcement, and this is taken to motivate the need for a sovereign
  who changes the payoffs by punishing renegers.


  Now change one thing. Keep the population homogeneous, roughly equal, and self-interested,
  but suppose the state of nature is not a one-shot encounter. Agents are matched
  in pairs at random in an indefinite sequence of rounds; after each round, each pair
