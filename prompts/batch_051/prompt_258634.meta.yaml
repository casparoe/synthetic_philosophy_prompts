  Let me refine. Dennett''s discussion: The color phi creates a puzzle about when
  the color change is experienced. The first spot is red, second green. Subject reports
  the moving spot changed from red to green before the second spot appeared. How can
  the subject have seen the green change before the green spot was shown? Two classic
  interpretations:

  - Orwellian: The subject first saw a red moving spot (after both flashes, the brain
  could have constructed something), then saw green, but immediately forgot the red-only
  phase and believed it changed earlier. (Post-experience revision of memory)

  - Stalinesque: The brain waited until the second flash arrived, then constructed
  a single, already-edited narrative (red→green moving dot) and put it into consciousness,
  with the color change occurring before the second flash. (Pre-experience editing)


  Dennett: nobody has ever found a difference that matters, because any proposed experiment
  can be explained by either picture. Both are artifacts of assuming consciousness
  is a "Cartesian Theater" where entries have definite timing. The real lesson is
  to reject the demand for a determinate point in time at which content "enters consciousness."
  But also libet etc.


