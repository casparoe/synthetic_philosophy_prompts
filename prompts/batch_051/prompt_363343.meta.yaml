  Draft:


  "I''m a PhD student working on the history of programming languages, and I keep
  coming back to a passage in Dijkstra''s 1988 talk ''On the Cruelty of Really Teaching
  Computing Science.'' He''s arguing that computers are a radical novelty and that
  the usual way of coping with novelty — stretching old words and analogies to cover
  a new thing — breaks down. Then he says: [quote]. The way I''ve always read this
  is that formal notations (programming languages, in particular) aren''t just neutral
  implements for telling a machine what to do; they''re a new conceptual language
  you have to acquire, and that acquisition reshapes what you''re able to think —
  roughly the strong version of the claim that programming languages matter. But lately
  I''ve been watching our lab''s LLM-based coding agents, and the developers now mostly
  write English prompts and read English summaries of diffs; some never open the actual
  source files at all. If that becomes the norm, does Dijkstra''s argument survive?
  I can see a few options: (a) it still applies, but the ''new foreign language''
  now lives in the model''s internal representations and the formal languages are
  hidden one layer down, so it''s the machine that gets the cognitive benefit, not
  the human; (b) it becomes an argument for forcing humans to stay in the loop at
  the level of the code; or (c) natural-language specification has become a new formal
  language in its own right, with its own untranslatable idioms, and ''mother tongue''
  was less about formality than about refusing the familiar. I''m less interested
  in predictions about whether coding jobs disappear than in whether Dijkstra''s premise
  — that some formal language you can learn and think in is indispensable for coping
  with the novelty — still has teeth. Please say how confident you are in the analysis
  and flag the single point you''re least sure about."


