  Draft:


  "I''m putting together a handout for an undergraduate course on distributive justice,
  and the unit compares three answers to the question of what egalitarians should
  equalize: welfare, resources, and capabilities. The standard examples in the readings
  all turn on an expensive taste or a disability, and my students now think the distinctions
  between the views are just those two quirks. I want a thought experiment built to
  a stricter specification. Construct a case in which a resourcist egalitarian and
  a welfarist egalitarian diverge in this particular direction: the resourcist says
  the state should make a straightforward recurring cash transfer from one character
  to the other, while the welfarist opposes exactly that transfer on the grounds that
  it would not bring the two characters closer to equal welfare and might widen the
  welfare gap. A capability theorist should then reject both verdicts: she should
  say that neither the transfer nor the absence of the transfer addresses the real
  capability shortfall, and should recommend a third intervention, ideally one that
  changes an environmental or social conversion factor rather than moving money around.
  The characters should be two working-age adults in an ordinary setting, with no
  physical or cognitive differences, no adaptive preferences, no expensive tastes,
  and no extreme poverty or wealth; the divergence has to come from the structure
  of the situation, not from a gerrymandered taste or a medical need. Keep the scenario
  to one paragraph, and use the rest for analysis."


  Then: "The exercise is for teaching, so the case cannot simply stipulate the verdicts:
