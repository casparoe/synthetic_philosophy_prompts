  Prompt text:


  "I teach an undergraduate course on distributive justice, and next week''s unit
  uses the old ''equality of what?'' debate — roughly, whether egalitarians should
  equalize welfare, resources, or capabilities. I want a handout with a thought experiment
  that does real work, not the standard textbook cases where someone has an expensive
  taste or a disability. Specifically, construct a case in which a resourcist egalitarian
  and a welfarist egalitarian come apart in a particular direction: the resourcist
  says the state should make a straightforward month-to-month cash transfer from one
  character to the other, while the welfarist opposes exactly that transfer because
  it would not move the two characters closer to equal welfare and may even widen
  the gap. A capability theorist should then dissent from both: she should diagnose
  that neither cash nor its absence addresses the actual capability shortfall, and
  she should recommend a third intervention (for example — but you may do better —
  changing some environmental or social conversion factor rather than transferring
  money). The two characters should be two working-age adults in an ordinary setting
  with no cognitive or physical disabilities, no adaptive preferences, no expensive
  tastes, and no one living in poverty or wealth extreme enough to make the case trivial.
  One paragraph for the scenario is enough; the rest should be the analysis."


  Then add: "The case is for a teaching handout, so it must not stipulate the verdicts;
  the verdicts should fall out of the theories as the students know them, and you
  should be explicit about the structural feature of the story that produces the three-way
  split — for instance whether it is the gap between a person''s holdings and her
  ''conversion factors,'' or something else. Then do the checks: walk through what
  each theory says and why, in enough detail that a student could reconstruct it;
  state what happens if you remove the feature doing the work (does the case collapse
  into a standard resourcist/welfarist disagreement, or vanish entirely?); and say
  how a defender of the view that ends up looking least attractive in your case would
  try to resist the verdict."


  Then epistemic request: "Throughout, indicate how confident you are in each verdict
  and which part of the analysis you are least sure about."


  Then structured data: "After the prose, give a JSON object summarizing the piece,
  with exactly these fields: scenario (a one-sentence compressed description), resource_egalitarian_verdict
  (what the resourcist would do and why, in brief), welfarist_verdict (whether the
