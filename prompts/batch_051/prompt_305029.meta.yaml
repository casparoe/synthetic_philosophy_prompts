  and erasing the bits that drive it. The philosopher''s component argues that a successful
  demonstration won''t just be an engineering result; it would bear on the question
  whether information is ''physical'' in the sense required to save the second law,
  or whether the demon was never really exorcised by theory alone. One panelist, a
  condensed-matter theorist, argues we should reject the proposal: the demon was exorcised
  decades ago when Szilard, Landauer, and Bennett showed that the demon must pay a
  thermodynamic price somewhere, and the experiment only confirms a settled matter.
  Another panelist, a philosopher, replies that the theoretical resolutions remain
  hostage to disputed assumptions about erasure and reversible computation, and that
  only a concrete demonstration can sharpen what the principle claims. I need to circulate
  a short written opinion before our meeting on Thursday. Draft the board''s decision
  memo: it should recommend one definite action — fund as proposed, fund with conditions,
  or reject — and it should state the conditions or the reasons for rejection concretely
  enough that the applicants could respond. Engage seriously with the strongest consideration
  on the losing side, and don''t end by simply saying both sides have a point. I ask
  for a committed recommendation: give it clearly, with the reasons that justify it,
  and indicate how confident the board should be."


