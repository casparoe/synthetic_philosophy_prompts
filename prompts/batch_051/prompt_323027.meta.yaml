  Ryle''s "ghost in the machine": The Cartesian view treats mind and body as two different
  kinds of substance, with the mind ("ghost") somehow inhabiting and controlling the
  body ("machine"). Ryle calls this a category mistake: representing mental conduct
  as belonging to a category (a non-physical substance or "occult" entity) when it
  actually belongs to another (dispositions to behave, ways of behaving, abilities,
  tendencies). "The dogma of the Ghost in the Machine" — the idea that there is a
  mental substance over and above the body and its doings.


  The slogan has come loose. In modern use, people say "the ghost in the machine"
  to mean:

  1. (Literal/Cartesian) A non-physical soul or mental substance that inhabits the
  body and causes it to act. This is a substantive metaphysical dualism, and likely
  false/question-begging.

  2. (Category-mistake reading) The mistake of positing an "inner explainer" that
  adds nothing explanatory: "virtus dormitiva" style — the ghost is a placeholder
  for whatever needs explaining (the mental counterpart that duplicates the behaviour).
  Ryle''s actual target: mental conduct verbs don''t name ghostly causes but dispositions
  and ways of doing things.

  3. (Homunculus/regress reading) In cognitive science and AI, invoking an inner agent
  or little person inside the system to explain intelligent behaviour is a "ghost
  in the machine" — a homunculus fallacy; if the homunculus has the abilities you''re
  trying to explain, you have a regress; if not, it explains nothing.

  4. (Eliminativist/deflationary reading) The phrase is used to suggest mental terms
  are empty or that consciousness doesn''t exist / is an illusion; that there are
  no facts about experience, only talk, or the mental is just dispositions (behaviourism)?

  5. (Anti-explanatory or merely rhetorical) "Ghost in the machine" as a vague pejorative:
  any appeal to unobservable internal states, representations, or conscious processes
  is suspect, mysterious, spooky, and should be rejected as unscientific. This could
  be conflated with anti-representationalism, or just a dismissive slur.

  6. (Functionalist/deflationary but not eliminativist) There can be real internal
  states, but they are functional/computational states, not a "ghost" — i.e., rejecting
  the "Cartesian theatre" but keeping internal representations.

