  "Consider Denis Villeneuve''s film Arrival, adapted from Ted Chiang''s ''Story of
  Your Life'', as a thought experiment about indexicals. A standing question in philosophy
  of language is whether expressions like ''I'', ''here'', and ''now'' are essential
  — whether what they contribute can be paraphrased without loss into context-free,
  objective descriptions, or whether some thoughts are irreducibly self-locating;
  the usual landmarks are Perry''s essential-indexical cases, Kaplan''s character/content
  distinction, and Lewis''s centered worlds. The film sets up a striking case: Heptapod
  B is a written language with no linear order, in which a logogram conveys a whole
  utterance at once, and as Louise Banks learns it she begins to experience time non-linearly,
  with future events available to her as memories. Read the film through the indexicality
  debate. Does the heptapod language actually lack indexicals, or does it merely change
  what its indexicals pick out — a different ''now'', a speaker no longer located
  at a moving point of time? Where does the film run together grammatical tense, the
  linearity of a writing system, and the semantics of indexicals, and where does it
  dramatize something the philosophical debate misses? I want an honest, two-way reading:
  one that neither reduces the film to a textbook illustration nor distorts the philosophy
  to fit the plot, and that ends by saying what the film adds to the Perry–Kaplan–Lewis
  discussion that argument alone does not. If the film''s lesson resists the philosophical
  framing, say so plainly."


