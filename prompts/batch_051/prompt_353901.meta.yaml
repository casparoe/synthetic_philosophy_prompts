  effect on creation; that Darwin is importing sentimental moral categories into biology;
  or that Genesis should not be read as natural history at all. Which of these (or
  which combination) does the least special pleading, and which ones are just apologetic
  sleight of hand? If you had to rank the reconciliation attempts by intellectual
