  Let''s formulate a classic argument:


  In On Interpretation ch.9, Aristotle says if every assertion is true or false, then,
  e.g., it was always true that there would be a sea battle tomorrow or always true
  that there wouldn''t. He uses this to challenge the principle of bivalence for future
  contingents. Then there is an argument to fatalism:


  (1) For a proposition p about tomorrow''s sea battle, either p is now true or p''s
  negation is now true. (Law of excluded middle/bivalence)

  (2) If p is now true, then no one can now do anything to prevent p''s truth.

  (3) If no one can now do anything to prevent p''s truth, then p''s happening tomorrow
  is necessary.

  (4) Likewise for the negation.

  (5) Therefore, whichever way it goes, tomorrow''s outcome is necessary, so there
  is no contingency about the future.


  Where does it fail? Step (2) maybe ambiguous: "no one can now do anything to prevent
  p''s truth" vs "p''s truth necessitates the event." Need exact. Better argue:


  (1) Either it is true now that a sea battle will occur tomorrow, or it is true now
  that none will occur.

  (2) Suppose it is true now that a sea battle will occur tomorrow. Then, because
  a true assertion cannot fail to be true, the sea battle cannot fail to occur tomorrow.

  (3) What cannot fail to occur occurs necessarily.

  (4) Therefore the sea battle occurs necessarily.

  (5) The same follows if no battle will occur.

  (6) So the future is not contingent.


  The fault: Step (2) conflates "cannot fail to be true (given what will happen)"
  with "cannot fail to occur." The truth of the assertion is a consequence of the
  event, not a cause/necessitating condition. Or step (2) uses "cannot fail to be
  true" as logical necessity of the proposition, then step (3) transfers to necessity
  of the event. This is a modal shift/fallacy of transferring necessity of the consequence
  (if true, then event happens) to necessity of the consequent. So ask exactly which
  step fails.


