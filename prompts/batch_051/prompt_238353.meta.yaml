  Let''s compose final prompt:


  "I''m a journalist who covers philosophy and the science of uncertainty. I''m trying
  to pin down why a certain old argument about the future goes wrong. In On Interpretation,
  chapter 9, Aristotle considers a future sea battle. He observes that if every assertion
  is already true or false, then it was already true yesterday that a sea battle would
  happen tomorrow, or already true yesterday that it would not. But if it was already
  true yesterday, then, as he puts it, there seems no room left for the battle either
  to happen or not to happen; it would already be settled. Here is a reconstruction:
  (1) If every assertion is true or false, then ''there will be a sea battle tomorrow''
  is now either true or false. (2) If it is now true that there will be a sea battle
  tomorrow, then it cannot fail to happen. (3) What cannot fail to happen happens
  necessarily. (4) So if it is now true, the sea battle happens necessarily. (5) If
  it is now false, then by the same reasoning the sea battle cannot fail not to happen,
  so it necessarily does not happen. (6) Therefore the future is not contingent; the
  only open question is ours, not the world''s. I suspect (2) slides between two senses
  of ''cannot fail to happen,'' but I want a committed verdict. Is the reconstruction
  valid? If not, which step or steps fail, and what is the most precise statement
  of the error? Also, would you defend Aristotle''s own conclusion against this reconstruction,
