  There''s a simple argument for necessitism:

  1. Necessarily, everything is identical with itself.

  2. Therefore, for each thing x, necessarily x = x.

  3. If x is identical with itself at a world, x exists at that world.

  4. Therefore each thing exists at every world.

  This trade on free logic semantics where you can''t truly predicate self-identity
  of nonexisting object. But in Kripke semantics with varying domains, □(x=x) at a
  world for an object in that world''s domain, and at accessible worlds x might not
  be in domain; how evaluate x=x? There are semantics. This is a real characterization
  of necessitism/being.


