  Draft prompt:


  ---


  You are preparing a handout for an advanced undergraduate seminar on nineteenth-century
  philosophy in which the students have just read the second of Nietzsche''s Untimely
  Meditations, on the uses and disadvantages of history for life. I would like you
  to write a diagnostic quiz, of the kind one might find in a philosophy magazine,
  titled something like "Which of Nietzsche''s three kinds of history do you actually
  practise?", that sorts respondents into monumental, antiquarian, and critical history
  on the basis of their judgements about concrete cases rather than by asking them
  which label they prefer.


  The quiz should consist of eight to ten questions. Each question should present
  a short, concrete scenario—for example: a proposal to pull down a Victorian statue
  of a philanthropist whose family profited from the slave trade; a local historical
  society''s campaign to preserve an ordinary eighteenth-century terrace; a national
  curriculum commission deciding how much weight to give to the founders'' achievements
  as against their documented wrongs; an individual''s relation to a family archive;
  a revolutionary movement''s attitude to the monuments of the old regime—and offer
  two or three response options that correspond to the ways the three modes of history
  would pull on a person. No question may use the words ''monumental'', ''antiquarian'',
  or ''critical'', nor their cognates such as ''monument''; the options must be given
  in ordinary language. The point is to sort people by what they find compelling in
  the cases, not by which Nietzschean term they think describes them.


  After the questions, provide a scoring key that maps each response option to one
  or more of the three modes, with fractional scores where an option plausibly expresses
  more than one mode. Then give three brief interpretive paragraphs (roughly 120-180
  words each) describing what a respondent predominantly of each type values and is
  in danger of: for monumental history, the past as a source of exemplary peaks that
  inspire present striving, together with its tendency to distort the past into a
  series of selectable models; for antiquarian history, the past as an inheritance
  whose details are to be preserved and honoured, together with its tendency toward
  a mummifying piety that resents any genuine novelty; for critical history, the past
  as something from which one must earn one''s freedom by judging and breaking with
  it, together with its danger of cutting the roots that sustain one''s own capacity
  to judge. (These paragraphs should be in your own words, not paraphrases of any
  translation.)


  Finally, add a short section, "Where the quiz cannot separate the positions", in
  which you identify two or three places where the three modes empirically converge
  or diverge in ways the scoring key cannot cleanly represent—for instance, the fact
  that a monumental and an antiquarian respondent may both vote to keep a controversial
  monument but for different reasons, or the fact that someone may be critical about
  one communal past and antiquarian about another. The overall tone should be serious
  but not solemn; the audience is academically able undergraduates who have read the
  essay and would appreciate being caught out by their own answers.


  Please ensure the quiz, the scoring key, and all explanatory prose are written in
  British English, using British spelling and punctuation throughout.


