  You are preparing a handout for an advanced undergraduate seminar on nineteenth-century
  philosophy, and the students have just read the second of Nietzsche''s Untimely
  Meditations, on the uses and disadvantages of history for life. Write a diagnostic
  quiz, of the sort one might find in a serious philosophy magazine, entitled "Which
  of Nietzsche''s three kinds of history do you actually practise?" The quiz should
  sort respondents into monumental, antiquarian, or critical history on the basis
  of their judgements about concrete cases, not on the basis of which label they would
  claim for themselves.


  The quiz should consist of eight to ten questions. Each question should present
  a short, concrete scenario — for example, a proposal to remove a Victorian statue
  of a philanthropist whose family profited from the slave trade; a local historical
  society''s campaign to preserve an unremarkable eighteenth-century terrace; a national
  curriculum commission deciding how to balance the achievements of a country''s founders
  against their documented wrongs; a person deciding what to do with a family archive;
  a revolutionary movement deciding what to do with the monuments of the old regime
  — and should offer two or three response options corresponding to the different
  pulls the three modes of history would exert. No question may use the words "monumental",
  "antiquarian", or "critical", nor cognates such as "monument"; the options must
  be phrased in ordinary language. Your purpose is to sort people by what they actually
  find compelling in the cases, not by which Nietzschean term they think describes
  them.


