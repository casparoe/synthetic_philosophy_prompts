  gets the obvious cases right, forces a decision on the borderline ones, and explains
  why so many of the cases feel like matters of degree.


  Here are my test cases.


  A factory-farm owner who cuts animal-welfare measures purely to save money: clearly
  complicit.

  A person who buys and eats factory-farmed meat every day, knowing what the industry
  does: I lean yes, but their individual purchases are not what keeps the system going.

  A person who takes one vacation flight a year; the plane would fly without them,
  and their seat is a negligible part of the flight''s emissions: I am torn.

  A voter who votes for a candidate in a landslide victory, where the candidate goes
  on to cause serious harm: the vote changed nothing, yet it feels like signing on.

  A non-voter in a safe district who stays home and watches the same candidate win:
  are they complicit by omission?

