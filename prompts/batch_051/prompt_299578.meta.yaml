  ---


  I have been trying to get clear about what it means for an individual to be complicit
  in a collective harm. People use the word without hesitation — someone who eats
  factory-farmed meat is complicit in animal suffering, a person who flies frequently
  is complicit in climate change, a citizen who votes for a destructive policy is
