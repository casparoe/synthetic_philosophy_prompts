  Let me think about Popper''s actual views to ensure accuracy. Popper, "The Poverty
  of Historicism" (written 1936, published 1944-45 in Economica, book 1957). Key ideas:

  - Historicism: approach to social sciences that assumes historical prediction is
  their principal aim, and that this is attainable by discovering the "rhythms," "patterns,"
  "laws," "trends" of historical evolution.

  - Anti-naturalistic and pro-naturalistic historicism; Popper criticizes both.

  - He gives a formal argument: the course of human history is strongly influenced
  by the growth of human knowledge; we cannot predict, by rational or scientific methods,
  the future growth of scientific knowledge; therefore we cannot predict the future
  course of human history. (The argument is often reconstructed with contradictions
  about a predictor predicting its own predictions; but he mainly says to predict
  today what we''ll know tomorrow is impossible.)

  - He distinguishes laws from trends: trends exist but depend on conditions; a trend,
  unlike a law, doesn''t allow predictions; the "law of evolution" is not a universal
  law.

  - He mentions the "Oedipus effect": a prediction can influence the predicted event
  (self-fulfilling or self-defeating), which complicates large-scale social prediction.

  - He links historicism to holistic planning, utopian engineering, and totalitarianism
  in "The Open Society and Its Enemies" — he criticized Marx and Hegel, and argued
  for "piecemeal social engineering."


  His view of historical prediction: not that history has no direction, but there
