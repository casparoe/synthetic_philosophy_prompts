  ---


  I write about probabilistic reasoning and legal institutions for a general-interest
  magazine, and I have been trying to work out what I actually believe about statistical
  evidence in court. I find that my verdicts on individual cases are much more coherent
  to me than the principle behind them, and I would like you to supply the principle—or
  tell me which of my verdicts cannot be saved.


  Here are the cases.


  1. The bus, market-share version. A pedestrian is struck by a bus that leaves the
  scene. The only evidence linking any company to the accident is that 80 percent
  of the buses that run on that route at that hour belong to the Blue Bus Company,
  with the remainder belonging to Red. With no identifying witness, paint fleck, or
  route log, I find I would not find Blue Bus liable, even though the probability
  that one of its buses caused the injury is 0.8 and the civil standard of proof is
  only the balance of probabilities.


  2. The bus, eyewitness version. Same accident, but now a single bystander testifies
  that the bus was blue. The bystander is known to identify bus colors correctly under
  those lighting conditions 70 percent of the time. Here I find I would find Blue
  Bus liable. This bothers me: the evidence is, on its face, weaker than the market-share
  evidence in probability terms, and I cannot immediately say why one suffices but
  not the other.


  3. The gatecrasher. A rodeo admits 1,000 people to the stands. The promoter''s records
  show 499 paid and 501 did not, but the entry stubs were lost, so there is no way
  to sort the payers from the gatecrashers. The promoter sues one attendee, selected
  at random from a photograph of the crowd, for the price of admission. The probability
  that this person failed to pay is 0.501. I would not find for the promoter.


  4. The prison yard. One hundred prisoners are in an exercise yard when ninety-nine
  of them carry out a fatal assault on a guard. The cameras fail, and no one will
  testify. The state prosecutes one prisoner, selected at random, for murder. The
  probability of guilt is 0.99, far above the criminal standard. I would not convict.


  5. The recall. A regulator considers recalling a widely used drug after reviewing
  adverse-event reports from a national database. Eighty percent of the reported serious
  events in the relevant period are associated with the formulation sold by one manufacturer,
  and the manufacturer''s version is chemically indistinguishable from a generic competitor
  in the reports, so the reports cannot be tied to a specific batch. The regulator
  would be acting purely on the distribution of outcomes across a class. I find that
  I would support the recall, even though I would not award damages on the same evidence
  in a civil suit. I am not sure whether this is inconsistent with case 1.


  Is there one account of when statistical evidence may ground a finding, or a small
  set of candidate accounts, that captures these verdicts? Please state it precisely,
  say which of my verdicts it forces me to revise or abandon, and apply the account
  to a further case I have been unable to settle: a stylometric system identifies
  an individual as the likely author of a series of threatening letters with 96 percent
  accuracy, as measured on a validation set, but offers no humanly articulable feature
  as the basis for its classification. Should that be treated more like the eyewitness,
  more like the market-share evidence, or like something else, and why?


