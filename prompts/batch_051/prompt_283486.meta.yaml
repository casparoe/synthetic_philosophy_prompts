  Here is how I understand the puzzle. A driver must take the second of two indistinguishable
  exits to reach his destination; failing to do so leaves him worse off but not catastrophically
  so. Because he is absent-minded, his information at the first exit and at the second
  exit is identical, so he cannot make his choice of whether to exit depend on which
  exit he has actually reached. He must select, in advance, a single behavioral rule
  — say, a probability of exiting that he will apply every time he finds himself at
  an exit. The controversy is that what the driver would choose before the trip as
  his plan can come apart from what seems best once he is at an exit and tries to
  take into account, as best he can, that he does not know which exit this is. Some
  read the problem as showing that a rational agent should bind himself to an ex ante
  optimal plan and then simply execute it; others read it as exposing an inconsistency
  in the idea that re-deliberation at an information set should always be rational.


  Memento seems to literalize exactly this structure. Leonard cannot form new memories,
  so he writes instructions to himself — notes, Polaroids, tattoos. At each moment
  he is, in effect, at an information set he cannot distinguish from earlier ones:
  he does not know whether he has already found the man he is hunting, which of the
  people around him his own past self already decided to trust, or which instructions
  were written by a lucid self as opposed to a deceived or impulsive one. His only
