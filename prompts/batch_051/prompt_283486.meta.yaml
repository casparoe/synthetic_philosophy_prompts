  "I''m planning a unit on sequential decision-making and regret, and I want to pair
  Christopher Nolan''s Memento with the absent-minded driver problem. My thought is
  that the film is not just an illustration of the puzzle but a kind of nightmare
  version of it, and I''d like a careful reading that says where the analogy is genuinely
