  ---


  You are a philosopher of institutional design with a special interest in epistemic
  systems and incentive structures. I would like you to think slowly and carefully
  about the following proposal, beginning by brainstorming the relevant incentives
  and failure modes before settling on your analysis.


  I have recently been appointed to the founding committee of a new competitive reasoning
  league at my university, and we have been given licence to design the format from
  scratch. The league is meant to make argumentation a spectator sport while, we hope,
  improving rather than corrupting the quality of reasoning of its participants and
  its audience. The provisional design is as follows.


  Each fortnight, two two-person teams are assigned — not chosen — a disputed proposition
  on a current intellectual or policy question, one side affirming and one denying.
  Teams receive the proposition a week in advance and may consult anything they like.
  During the match, each side presents its case and must answer, in writing, the three
  objections supplied in advance by the opposing team; these objections are read out
  only on the night. Judges are not rhetoricians or debaters but working academics,
  journalists, or practitioners with expertise in the proposition''s subject matter.


  So far, so conventional. The novel part is the scoring. Judges award marks on three
  criteria: (i) accuracy — how true, relevant, and well-supported are the claims actually
  made; (ii) responsiveness — how fully each side answers the strongest version of
  the other side''s case, rather than a caricature; and (iii) calibration — how accurately
  each side flags the confidence with which it holds its claims and acknowledges the
  points it is least sure about. A team can be penalised for refusing to concede a
  point that the judges regard as having been established by the other side. The winning
  team receives prize money, and teams are promoted or relegated between divisions
  on the basis of a long-run rating.


  Additionally, the same judge panel re-assesses each side''s case one year later,
  after the proposition''s actual developments have had time to unfold, and the accuracy
  marks are adjusted accordingly; a team''s historical rating is recomputed each season
  with this retrospective correction, so that a team that argued forcefully for a
  forecast that turned out false suffers a delayed penalty, even if it won on the
  night. We hope this rewards teams that are right rather than merely persuasive,
  and gives spectators a reason to care about who was actually correct.


  Analyse this mechanism as an institution. What incentives does it create for the
  debaters, the judges, the founding committee, and the audience respectively? How
  would a clever but unscrupulous team game each scoring criterion, and what second-order
  effects would the retrospective correction produce? Would the league, on balance,
  select for good reasoning or for a different skill? Which failure modes could be
  fixed by changing a single rule, and which seem intrinsic to making argument a spectator
  sport?


