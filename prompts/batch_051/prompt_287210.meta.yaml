  one''s true probability of being correct; so if the system knowingly says something
  false, it must either assign a very low p to its own answer, which visibly signals
  that it does not trust what it is saying, or take a large hit when caught. My question
  is not whether the scheme is a good idea in the abstract but how it would actually
