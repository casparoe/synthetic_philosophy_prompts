  Here is the variant we kept going back and forth on. An agent''s preferences are
  perfectly transitive at every moment, but they rotate through a fixed three-phase
  cycle. In phase 1 the agent ranks A ≻ B ≻ C. In phase 2 the ranking is B ≻ C ≻ A.
  In phase 3 it is C ≻ A ≻ B. Then it returns. At every trade the agent pays a small
  transaction cost ε, and the agent knows the schedule. Now imagine the agent enters
  phase 1 holding C. A trader offers A in exchange for C plus ε, which the agent,
