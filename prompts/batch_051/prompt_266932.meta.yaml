  I am a high school senior in an independent research program in the history and
  philosophy of science, and over the past few months I have been keeping notes on
  a claim I encounter constantly among the mathematicians and scientists I''ve interviewed:
  that elegance, simplicity, or beauty in a theory or proof is not just aesthetically
  pleasing but is some reason to think the theory or proof is more likely to be true.
