  distinguish elegance being a genuine guide to truth from elegance merely correlating
  with truth through some third factor (like the fact that both elegance and truth
  track depth or explanatory power), and whether any empirical result could bear on
  the stronger claim that scientists and mathematicians ought to prefer elegant proposals
  when allocating their attention, or whether that normative part must remain a philosophical
  judgment no experiment can reach.


