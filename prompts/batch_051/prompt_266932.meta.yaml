  aesthetic preference and that the field only remembers the elegant ideas that happened
  to work out. I would like to turn this from a disagreement about taste into a testable
  question rather than simply taking a side.


  Please help me design the best test you can of the claim that elegance is evidence
  for truth in mathematics, in science, or both, and tell me whether the two cases
  call for different tests. The test should be concrete enough that I could describe
  it in a formal project proposal even if I could not run it myself in one semester:
  what exactly would be measured, drawn from what corpus or set of cases, rated by
  whom, compared against what outcome, and what pattern in the results would count
  as support and what pattern would count against the claim. Where the design has
  to operationalize ''elegance'' in a simplified way, say what is being left out and
  whether that simplification biases the test in one direction.


