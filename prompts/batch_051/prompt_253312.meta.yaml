  I''m a journalist who covers science and ideas, and I''m deep into reporting a feature
  on a puzzle I can''t shake: how can a sound—something with no beliefs, desires,
  or history—be sad? I keep noticing that people use the phrase "sad music" with total
  confidence, yet the researchers I''ve interviewed mean very different things by
  it. Some locate the sadness in acoustic features such as slow tempo, minor mode,
  falling pitch contours, and low energy. Others locate it in the listener''s emotional
  response, or in a kind of imaginary persona we hear "behind" the music. I need a
  working definition that I can actually use to sort examples as I write, not a survey
  of the field.


  Here are eight cases I''ve been using to test people''s intuitions:


  1. A slow, legato cello line in a minor key, descending in pitch, played softly;
  practically everyone I ask calls it mournful.

  2. An upbeat major-key jingle for a breakfast cereal, bouncing rhythm, no lyrics.

  3. A field recording of a person sobbing, presented as an audio track in a sound-art
  installation.

  4. An uptempo pop song in a major key whose lyrics describe the end of a relationship
  in flat, hopeless detail.

  5. An electronic piece built from the standard "sad" recipe—minor mode, slow tempo,
  descending contours, soft dynamics—whose synthetic timbres make many listeners call
  it cold or eerie instead.

  6. A bird''s dawn song, which ornithologists describe as a territorial display but
  which some people find mournful.

  7. A completely static sine tone, no melody or harmony, displayed in a gallery under
  the title "Grief."

  8. An improvised instrumental passage in a mode that is heard as sorrowful in one
  musical culture and celebratory in another.


