  that has been in force for at least thirty years. Before such a rule can be repealed
  or substantially amended, the committee pushing the change must have a function
  report comissioned. The report has to reconstruct, from the legislative record or
  plausible inference, what problem the rule originally solved and what ongoing function
  it might still be serving. If the report finds no identifiable function, repeal
  proceeds normally. If it finds at least one plausible function, repeal can still
  happen, but only through a two-year pilot: the rule is suspended in a randomly drawn
  set of counties matched against comparison counties, with outcome measures pre-registered
