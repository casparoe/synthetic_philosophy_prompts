  Student answer (write it, maybe 250–350 words to be substantial but not enormous):


  "In The Varieties of Religious Experience, William James identifies four marks of
  mystical states: ineffability, noetic quality, transiency, and passivity. Ineffability
  means that the person who has the experience finds it impossible to put its content
  into words. Noetic quality means that although the experience resembles a feeling,
  it presents itself to the subject as a state of knowledge — as an insight into something.
  So already in James we get the apparent tension: the experience claims to be a kind
  of knowing, yet its content cannot be said.


  It is important to distinguish this from unknowability. There is no contradiction
  in saying that someone knows something they cannot express: we often recognise a
  face without being able to describe it, and a musician may know how to phrase a
  passage without being able to state the rule. So ineffability does not by itself
  imply that nothing is known.


  However, this only gets us as far as showing that ineffable knowledge is not outright
  impossible. The harder question is whether a mystical experience can actually be
  a source of knowledge, and here I think the answer is no. A genuine piece of knowledge
  must be able to figure in reasoning: it must be usable as a premise, and it must
  be assessable by others. But an ineffable content, by definition, cannot be put
  into propositional form, and therefore cannot enter into inference or be evaluated
  for truth. The mystic may feel certain that she has grasped something, but a felt
  certainty that one knows is not the same as knowing. At most the experience yields
  a non-propositional acquaintance with something, and acquaintance falls short of
  knowledge. So while we can grant that there are ineffable states, and that they
  are felt as noetic, they cannot transmit knowledge either to the mystic or to anyone
  else."


  Now, where are the subtle mistakes?

  1. "A genuine piece of knowledge must be able to figure in reasoning... must be
  assessable by others." This is a strong assumption; it rules out non-propositional
  knowledge by stipulation. The step "ineffable ⇒ cannot enter into inference ⇒ not
  knowledge" is questionable because (a) ineffability is a matter of degree and many
  ineffable contents are partially expressible (via analogy, negation); (b) something
