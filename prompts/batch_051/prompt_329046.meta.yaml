  - Instance 1: A community forum introduced upvotes as a quality signal. Initially,
  users said up/downvoting meant "this was/was not worth your time." After the platform
  tied totals to ranking and gave top contributors a badge, the same users began explaining
  their votes differently: an upvote was "to encourage someone", "to say thanks",
  "to keep a relationship warm", while a downvote was "too aggressive" except for
  serious misconduct. The official meaning didn''t change, but the practice had.

  - Instance 2: In a peer-to-peer service platform, mutual public ratings converged
  to near maximum over 18 months. Interviews: raters did not report lying; one said
  "when I give five stars, I am not saying the service was perfect; I am making sure
  the transaction can end well." Buyers reading a 4.7 vs 5.0 did not infer quality
  difference; they inferred "the seller is easy to work with." The system''s designers
  still treated reports as evaluations of quality.

