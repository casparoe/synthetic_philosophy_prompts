  Wait the structure of Curry''s proof is:

  Assume S is true. S = "if S is true then P." From S and "S is true" we get P by
  modus ponens. Then having derived P under the assumption S is true, we can discharge
  the assumption and conclude "if S is true then P," i.e., S, by conditional proof.
  Then from S and "S is true" (we''ve proved S, so S is true), get P.


  Simplified in everyday terms:

  - Suppose the sentence is true.

  - Then, since the sentence says that if it is true then you owe me twenty dollars,
  and it is true, you owe me twenty dollars. (modus ponens)

  - So from the supposition "the sentence is true" we derived "you owe me twenty dollars."

  - Therefore, without any supposition, we may conclude: if the sentence is true,
  then you owe me twenty dollars. (conditional proof)

  - But that conclusion is exactly the sentence itself. So the sentence is true.

  - So, since the sentence is true, and the sentence says that if it is true then
  you owe me twenty dollars, you owe me twenty dollars.


