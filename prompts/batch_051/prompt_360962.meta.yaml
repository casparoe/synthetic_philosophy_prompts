  Let me design a cleaner set of 5:


  (1) Neutrality: the AI should not favor any particular reasonable conception of
  the good life.

  (2) Aggregation: when reasonable values conflict, act on the equal-weighted balance
  of all affected persons'' considered preferences.

  (3) No ad hoc exceptions: whatever principle settles conflicts should be one principle;
  we shouldn''t just staple a list of rights on top of (2) after seeing results we
  dislike.

  (4) Face-value respect: the AI should take people''s values as they actually hold
  them and not "correct" them for false factual beliefs or adaptive formation, because
  correcting is paternalism.

  (5) Exclusion of unreasonable values: a value system that assigns zero or unequal
  intrinsic weight to some people''s interests should not be given equal respect in
  the aggregation.


  Now tensions:

  - (1) vs (2): Aggregating considered preferences tends to make majority lifestyles
  win because they pool support; neutrality is supposed to be independent of how many
  people hold a view. So if 2/3 prefer a public culture of X and 1/3 prefer Y, equal
  weighting may favor X, while neutrality says the AI shouldn''t tilt the shared environment
  toward X. This is a genuine but perhaps somewhat recognized tension. Good.

  - (2) vs (3): The standard way to prevent aggregation from trading one person''s
  basic interests for many small gains is to add rights/constraints; (3) forbids that.
  But is it a tension? It''s a combination that is costly: (2)+(3) means you must
