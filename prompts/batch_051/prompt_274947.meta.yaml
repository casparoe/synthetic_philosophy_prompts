  Final draft:


  "This prompt concerns the paradox of blackmail. The puzzle is usually set up as
  follows. A has come to possess a true, reputation-damaging piece of information
  about B. A would be legally and morally free to publish it, and A would also be
  legally and morally free merely to ask B for money, which B could refuse. But if
  A links the two acts into a conditional proposal — payment in exchange for silence
  — the law treats A as a blackmailer. Two separately permissible acts combine into
  what appears to be an impermissible transaction. Your task is to assign a credence
  to a specific claim about the best resolution of this puzzle.


  The claim: the most satisfactory resolution of the paradox of blackmail is coercion-based.
  By that I mean the following: the wrong of blackmail consists in the deliberate
  imposition of a forced choice between two harms — exposure and payment — and the
  fact that each component act would be permissible if performed on its own does nothing
  to render the imposed choice permissible.


  I do not want a survey of the literature or the answer that it depends on one''s
  theory. I want a number — your actual credence in the claim — together with a decomposition
  of the reasoning that produces it. Assign rough probabilities to at least the following
  sub-questions, with a sentence or two of justification for each:


  1. That the paradox arises from a false aggregation principle: the permissibility
  of the parts does not transmit to the conditional package. If this is false, the
  natural conclusion is the dissolution view, namely that the package should be lawful
  because its components are lawful.

  2. Conditional on the aggregation principle failing, that the operative wrong-making
  feature is the coercive choice itself, rather than either of its main rivals: an
  exploitation view (A licitly holds the information but wrongfully prices B''s escape
  from its release, turning someone else''s secrets into a commodity) or a privacy-based
  view (the wrong lies in making the disposition of B''s personal information the
  object of a transaction without B''s consent, independent of whatever pressure B
  feels).

  3. That a single, unified account of blackmail''s wrongfulness exists at all, rather
  than the law of blackmail marking a disjunctive patchwork of quite different wrongs.

  4. That the coercion-based account can handle the harder variants without ad hoc
  amendments — for example, threats to perform a permissible act other than disclosure,
  or demands for non-monetary benefits in exchange for silence.


  Then show how these terms combine to produce your final credence, and identify which
  sub-question the final number is most sensitive to. Finally, state what would move
  that sub-question most: describe a case, an argument, or a piece of evidence that
  would substantially raise or lower the relevant probability, and say in which direction
  and by roughly how much. If you think no observation could settle it one way or
  the other, say what that indicates about the status of the original question."


