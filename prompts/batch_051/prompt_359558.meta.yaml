  Bayesian epistemology and the problem of old evidence:

  - The problem of old evidence is associated with Clark Glymour (1980), "Theory and
  Evidence". The problem: Bayesian confirmation theory says evidence e confirms hypothesis
  h iff P(h|e) > P(h). But if e is known (old evidence), P(e)=1. Then P(h|e) = P(h)
  (since conditioning on an event of probability 1 doesn''t change probabilities).
  So known evidence can never confirm any hypothesis, which contradicts scientific
  practice: e.g., the perihelion advance of Mercury was known long before Einstein''s
  general relativity and was taken as strong evidence for it.

  - Solutions: e.g., use counterfactual probabilities (Howson & Urbach), assign a
  less-than-1 probability to e by considering what one''s credence would be in e without
  the theory, or use "logical learning" (Garber), or use hypothetico-deductive confirmation,
  or I.J. Good''s treatment of "old evidence" with priors over the reliability of
  data.

  - So the subtle confusion in my prompt: the problem doesn''t say old evidence is
  actually worthless; it exposes a limitation of the simple Bayesian formalism. A
  good answer would say: Bayesians don''t think Mercury shouldn''t count; they think
  their formalism needs fixing, and they have proposals.


