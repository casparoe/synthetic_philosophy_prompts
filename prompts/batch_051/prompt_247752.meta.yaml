  a system that represents itself within its own symbol system, producing a loop that
  appears to give rise to an "I."

  - It is multiply realizable in any sufficiently rich self-representational substrate,
  including perhaps sufficiently organized AI; it is a real pattern, not an illusion
  simpliciter, but it is pattern, not substance.

  - Consciousness/subjective feel is either constituted by or correlated with the
  loop''s dynamics at the right level of description.

