  Prompt idea:


  "I''ve come to accept, at least provisionally, Hofstadter''s account of the self:
  that the ''I'' is not a thing or a soul or a Cartesian theater occupant, but a kind
  of abstract pattern — a strange loop — that arises when a sufficiently rich representational
  system turns its own symbols on itself, and that this self-referential loop is what
  a self is, not a generator of a self. I want to stress-test this, not have it explained
  back to me. Tell me what would count against it."


