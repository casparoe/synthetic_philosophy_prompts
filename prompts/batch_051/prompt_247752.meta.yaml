  1. A literal forecast: what would the world be like if everyone performed the act?
  Is the appeal to consequences? This turns "what if everyone did that" into threshold/cumulative
  effects: each individual act is harmless but aggregate is disastrous. That''s a
  consequentialist generalization argument. Plausible in cases with thresholds (one
  more car trip vs. climate; one more person not voting vs. democracy). But flawed
  when the act''s reasons are conditional on rarity (everyone becoming doctors).

  2. Kantian contradiction-in-conception test: could I coherently will the maxim as
  universal law? This is not about consequences but about whether the act''s success
  depends on the maxim not being universal (false promise depends on trust, which
  depends on most people keeping promises). Then the wrong isn''t a bad outcome but
  an incoherent/exploitative exception.

  3. Kantian contradiction-in-willing: could I rationally will the universalization
  even if conceivable (not developing talents) — perhaps because I would be willing
  it to frustrate my own ends. This reading is stricter and debatable.

  4. Hare-style universal prescriptivism: to call an act right is to prescribe that
  it be done in all relevantly similar situations; so I must either accept "everyone
  in my exact situation ought to do X" or withdraw the judgment. This is a point about
  the logic of moral terms, not about consequences. It supports "what if everyone
  did that" only when the situations are genuinely similar, and it doesn''t by itself
  forbid much — it pushes the dispute to what counts as a relevant difference.

  5. Fairness/free-riding: you are making an exception of yourself; you benefit from
  general compliance while violating. The question then means "why should you be exempt?"
  This is strongest where the practice requires near-universal compliance, and it''s
  about fairness/reciprocity rather than consequences.

  6. Rule-utilitarian/rule-consequentialist: the test is whether the rule that everyone
  do X would have better consequences than alternatives. "What if everyone did that"
  is a heuristic for evaluating the rule, not the act.

