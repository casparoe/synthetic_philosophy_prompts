  Maybe the prompt is from the perspective of a PhD student in philosophy or a research
  group leader deciding where to put effort. Let me think of good open questions within
  Lewis-on-convention / evolution of norms:


  Lewis''s core account: a convention is a regularity R in behavior within a population
  such that everyone conforms to R, everyone expects everyone else to conform, and
  everyone prefers to conform given the others conform (a coordination equilibrium),
  and it''s common knowledge. Key features: arbitrary alternatives, no binding agreement,
  coordination rather than conflict, common knowledge.


  Open questions / pressure points:


  1. Lewis''s definition is individualistic and reason-based: preferences, expectations,
  common knowledge. Real social norms often work via internalized dispositions, emotions
  (shame, guilt), and punishment by third parties. Can Lewis''s framework of coordination
  plus common knowledge explain the emergence and stability of norms, or does it need
  to be supplemented with something like Bicchieri''s normative expectations and sanctions?


  2. The equilibrium-selection/salience problem: given multiple equally good equilibria
  (drive left vs right), how does a particular one get selected? Lewis appeals to
  salience and precedence. But salience is hard to formalize; is it doing illicit
  explanatory work? Is there a precise account of salience?


  3. How do conventions arise in the first place without any precedent? Lewis says
  agreement or salient options, but many conventions (language, money) emerge without
  anyone agreeing. Evolutionary game theory / replicator dynamics models can show
  convergence, but those models change the nature of explanation—do they align with
  Lewis''s rational-choice account or replace it?


  4. The tension between conventions as arbitrary (equilibria with alternatives) and
  norms as appearing obligatory / non-arbitrary to participants. When does a mere
  convention acquire normative force—"should" language, resentment against defectors?
  This is the evolution of norms where moralization kicks in.


  5. Lewis requires common interests (coordination). But norms often regulate conflict,
  bargaining, and mixed-motive situations. Maybe conventions solve pure coordination
  and something else (bargaining, power, ideology) explains the rest. Which extension
  is most promising?


  6. The role of common knowledge: Is the infinitely iterated "everyone knows that
  everyone knows..." literally true or just an idealization? Focal points and convention
  may persist with much less.


  7. Relation to modern work: injected niche idea could be "correlated equilibrium"
  as an extension, or "conventions as self-confirming equilibria with limited feedback,"
  or "the role of cheap talk and pre-play communication in selecting conventions."
