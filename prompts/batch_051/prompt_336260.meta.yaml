  The two positions:

  - Intentionalist: Self-deception is an intentional activity; the person gets themselves
  to believe p, intends to acquire the false/motivated belief. To handle the paradox,
  intentionalists invoke divided minds (one subsystem deceives another), temporally
  extended strategies (e.g., drink to forget, avoid evidence), or self-deception as
  intentionally manipulating one''s evidence. Davidson''s view: self-deception requires
  mental partitioning; the person believes p and also, in a partitioned part, believes
  not-p, with weak boundaries.

  - Deflationist/anti-intentionalist: Self-deception has no self-deceiving intention;
  it''s a motivationally biased but ordinary process of belief formation (e.g., Mele:
  desire that p biases evidence-gathering and inference, producing a false belief
  p without an intention to deceive). The paradox dissolves because the deceiver and
  deceived need not be the same intending agent at the same time; motivated reasoning
  suffices.


  Agreed claims could include: (1) Self-deception is a real phenomenon and not merely
  ordinary false belief; (2) In paradigm cases, the subject ends up believing p, p
  is false, the subject''s evidence (at some point) supports not-p, and the subject
  has motivation favoring p; (3) These conditions generate an apparent paradox under
  a simple model of belief and deception — if deception requires an intention to induce
  a false belief, then a self-deceiver would need to intend to get herself to believe
  what she currently disbelieves, which looks self-defeating; (4) Any adequate account
  must either show how the paradox is real but manageable (e.g., via division or temporality)
  or show which assumption the simple model gets wrong; (5) Garden-variety self-deception
  doesn''t require full-blown deliberate calculation; both sides can accept that in
  many cases the person simply slides into the belief.


  Where they differ: whether self-deception essentially involves an intention (or
  intention-like action) to cause oneself to believe not-p; whether the mental state
  is unified or partitioned; whether the paradox is genuine or an artifact of the
  "deception" analogy.


  Cruxes:

  1. Are there clear cases of self-deception in which the subject performs no self-manipulative
  action and forms the belief solely through biased cognition? Intentionalist predicts
  closer inspection reveals avoidance behavior or partition; deflationist predicts
  cases remain.

  2. Does the "divided mind" hypothesis earn its keep, or is it an ad hoc rescue?
  Both agree which evidence bears: cases of self-deception with no independent evidence
  of mental partitions; psychology of confabulation, hemispatial neglect maybe too
  clinical.

  3. Whether the desire for p can exert its entire influence through ordinary motivated
  reasoning (attention, memory retrieval, hypothesis-testing bias), without any executive
  intention. Both could agree that experimental work on desirability bias in belief
  formation bears on this; intentionalists predict such biases underdetermine full
  belief change; deflationists predict they suffice.

  4. Is there a residual normative difference: if self-deception is non-intentional,
  is the subject less responsible? Both sides might converge.


  Maybe not include the normative crux unless it helps.


