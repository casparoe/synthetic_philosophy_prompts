  the claim that my single flight, burger, or vote is very unlikely to make any difference
  to the outcome, and the question of whether that fact undermines my reason to refrain
  or participate. The students grasp the standard free-rider analysis quickly, but
  I find they treat the inefficacy objection as a curiosity rather than as a live
  problem: they say "well, if everyone did it, it would be terrible" and move on.
  I want something that stops that move in its tracks.


  Please design a 75-minute classroom activity for about 16 students that makes participants
  feel the force of the inefficacy objection before it is named. I''d like the activity
  to have real structure: rules, materials, a scoring or payoff scheme that does not
  require actual money, roles or asymmetries where useful, and a debrief that maps
  what happened onto the conceptual terrain. The conceptual target is the distinction
  between (a) cases where an individual act is genuinely inert because the harm is
  overdetermined or the threshold has either already been crossed or is out of reach,
  and (b) cases where an individual act has a small positive expected difference,
  perhaps by changing the probability of a threshold being reached. I would also like
  participants to feel the pull of the "if I don''t, someone else will" thought, and
  the difference between asking what I should do and asking what we should do. Please
  do not make the activity a lecture with discussion questions appended; the students
  should run into the problem through the choices and incentives, and only then have
  it named.


  As you plan, take on the role of an expert in experimental philosophy and game-theoretic
  pedagogy: think through the likely behaviour of the students, the incentives you
  are creating, and the points where the activity might accidentally teach the wrong
  lesson. Begin with a brief internal brainstorm about possible game structures before
  settling on one, but in the final response present only the settled design. Then
  write the response in the following sections: "Design brief" (one short paragraph:
  learning aims and the one-sentence rationale for the mechanism chosen); "The activity"
