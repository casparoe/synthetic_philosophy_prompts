  Perspective: PhD student in nineteenth-century German philosophy, teaching assistant
  for an undergraduate course. The course covered Schopenhauer''s "The World as Will
  and Representation." The exam question: something like:


  "Schopenhauer claims both that the world is will and that life is suffering. Explain
  the connection he draws between the metaphysics of the will and his pessimistic
  evaluation of existence, and then address the following: does Schopenhauer think
  that recognizing this connection intellectually is enough to escape suffering? If
  not, what more does he think is required, and why?"


  Student''s answer (draft):


  "Schopenhauer holds that the world has two aspects: as representation, it is the
  world of objects in space and time, governed by the principle of sufficient reason;
  as will, it is the thing-in-itself, a single blind striving that lies outside space,
  time, and causality. Because the will is a striving, it is always directed at something
  it lacks, and so willing is always accompanied by a felt deficiency. For Schopenhauer,
  suffering is simply this condition of willing: pain is the positive state, while
  pleasure is only the temporary relief from pain. It follows that a life of satisfied
  desires would be a life of contentment, but since desires are rarely satisfied,
  life is mostly suffering. From this Schopenhauer concludes that non-existence is
  preferable to existence and that the only escape is to understand, intellectually,
  that the will is the thing-in-itself; once we grasp that all individuals are manifestations
  of the one will, the distinction between self and other dissolves and suffering
  ends. This is why he regards aesthetic contemplation of great art as the highest
  form of liberation."


  Now, what are the errors?


  1. "It follows that a life of satisfied desires would be a life of contentment,
  but since desires are rarely satisfied, life is mostly suffering." — This treats
  pleasure and pain symmetrically and makes pessimism an empirical claim about how
  often desires are satisfied. Schopenhauer''s view: even satisfied desires yield
  only momentary negative satisfaction; then boredom sets in, which is itself suffering.
  So pessimism is not an empirical tally; a life of satisfied desires would not be
  contentment — it would oscillate between pain (wanting) and boredom (having). This
  is a subtle mistake. The student earlier says "pain is the positive state, pleasure
  only temporary relief" — but then contradicts it with "a life of satisfied desires
  would be contentment." A hasty grader might miss the tension. Good.


  2. "the only escape is to understand, intellectually, that the will is the thing-in-itself...
  suffering ends" and "aesthetic contemplation of great art as the highest form of
  liberation." — Schopenhauer: aesthetic contemplation gives temporary, not permanent,
  release from willing; and intellectual insight alone is not the denial of the will.
  The genuine "highest" liberation is the denial of the will through asceticism, resignation,
  mortification, chastity, fasting — the will turning against itself, leading to the
  "nothing" of nirvana-like quiet. Also, aesthetic contemplation is a temporary "will-less"
  state. So saying intellectual understanding ends suffering and aesthetic contemplation
  is the highest liberation is a subtle error/conflation: the student conflates the
  temporary respite of aesthetic contemplation with the lasting denial of the will,
