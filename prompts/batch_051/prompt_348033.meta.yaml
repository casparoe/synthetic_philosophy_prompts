  Let me construct the Maxwell''s demon summary paragraph. I need a plausible popular
  summary with subtle errors.


  The real story (from my knowledge): Maxwell''s demon is a thought experiment by
  James Clerk Maxwell (1867, in a letter / later in Theory of Heat). A being sorts
  fast and slow molecules through a trapdoor in a partition of a gas-filled box, creating
  a hot/cold imbalance without work, seemingly decreasing entropy. Resolution: the
  demon must acquire information about molecules (measurements), and by Landauer''s
  principle, erasing that information to reset its memory costs at least kT ln 2 per
  bit, dissipated as heat, increasing entropy by at least the amount the demon decreases
  it. Bennett (1982) argued the crucial step is erasure, not measurement per se (measurement
  itself can be done reversibly in principle). Szilard (1929) had a one-molecule engine
  and connected information to entropy. The demon doesn''t violate the second law
  because total entropy (gas + demon) increases/does not decrease accounting for information
  processing.


  Common popular misrepresentations:

  1. "Information is a form of energy" — wrong; information is not energy, but processing/erasing
  information has thermodynamic costs.

  2. "The demon can''t know about molecules without using energy" — subtle: measurement
  can in principle be done with arbitrarily little energy (reversible), but erasure
  costs.

  3. "The demon violates the second law unless you account for the energy of thinking"
  — conflation of computation/consciousness/energy.

  4. "Every bit of information has an entropy of k ln 2" — this is actually roughly
  true for physical entropy associated with information? Szilard: one bit of information
  about which side a molecule is in can be used to extract kT ln 2 of work. But careful:
  information is physical; entropy of a memory is not simply the information content.

  5. Overstatement: "Landauer proved Maxwell''s demon cannot function" vs. "Bennett
  showed the second law survives only if erasure costs entropy."

  6. "The demon''s observations are free" — inaccurate.


