  Draft the joint statement that would emerge from an adversarial collaboration between
  two camps on the legal-epistemological problem of naked statistical evidence. The
  first camp, the bare-statistics sufficiency view, holds that a verdict may legitimately
  rest on purely statistical evidence whenever that evidence places the probability
  of liability (or guilt) above the operative threshold; the second camp, the individualized-evidence
  view, holds that a legal finding of fact requires evidence that is in some appropriate
  way tied to the particular event, and that bare statistics, however high the resulting
  probability, cannot by themselves satisfy the standard of proof.


  Work with these stipulated cases. Blue Bus: a plaintiff is injured by an unidentified
  bus; it is stipulated that 80% of buses on the route were operated by Blue Bus Company,
  that this is the only evidence about which company''s bus caused the injury, and
  that the plaintiff sues Blue Bus Company under a civil preponderance standard. Gatecrasher:
  exactly 1,000 people sat in a ticketed section of a rodeo, each person either having
  bought a ticket or entered without one; 499 tickets were sold; the organizer sues
  one randomly selected attendee under a preponderance standard, and the only evidence
  against that attendee is the base rate. Yard Riot: 100 prisoners were in a yard
  during an attack; it is stipulated that 99 of them participated and 1 did not; the
  prosecution charges one randomly selected prisoner with participation under a beyond-reasonable-doubt
  standard, and the only evidence is the base rate.


  The deliverable should have two parts. First, a numbered agreed-claims section:
  claims both camps can sign about what the probabilities are in each stipulated case,
  what a threshold-on-credence rule alone would license in each case, what the two
  camps are not disagreeing about, and any limitations both accept about the superiority
  claimed for individualized evidence. Second, a disagreements table with at least
  four rows. For each row, state the residual disagreement in formulations each side
  would accept as wording for its own position; indicate whether the disagreement
  is substantive or partly verbal; and list the cruxes whose resolution would move
  at least one side. For each crux, specify a case or argument both sides would accept
  as bearing on it, and record each side''s prediction of how that crux would come
  out. At least one crux must concern the aggregate-error argument that arises if
  the organizer sues all 1,000 attendees in Gatecrasher under a bare-statistics rule;
  at least one must concern the difference between a probabilistic and a relational
  reading of the standard of proof in Yard Riot. End with a short paragraph stating
  which residual disagreement survives after verbal confusions are removed, if any.


