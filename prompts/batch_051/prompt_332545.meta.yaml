  Prompt:


  "Mathematicians routinely reason probabilistically about deterministic structures:
  to estimate how many twin primes there are up to x, one treats the events ''n is
  prime'' and ''n+2 is prime'' as though they were independent, each with probability
  about 1/log n, even though primality is a determinate fact about each integer and
  the joint distribution is fixed by arithmetic. The same presumption of independence
  underlies heuristics for Goldbach''s problem, counts of prime k-tuples, and many
  other conjectures, and it often produces predictions of astonishing accuracy, including
  the right constants. But the presumption is sometimes plainly false: n and n+1 cannot
  both be prime (except for 2 and 3), so naive independence overcounts by an infinite
  factor in the analogous count; and congruence conditions among the numbers in a
  tuple create systematic dependencies that require correction factors. A theory of
  how and when this presumption of independence is justified—what it says, what it
  is allowed to ignore, and why it works when it works—is exactly what I want to pin
  down.


  Write the desiderata that any adequate theory of the presumption of independence
  in mathematical heuristics must meet. For each requirement, give the case or consideration
  that forces it. In particular:


  - Distinguish the requirements that are non-negotiable from those that are preferences
  of a particular approach (e.g., demanding a literal probability space versus a more
  informal ''independence of explanatory factors'').

  - Flag any pairs of desiderata you suspect cannot be jointly satisfied, and say
  which one you would relax and why.

  - Indicate which single requirement does the most to exclude naive or overfit accounts.


  Cover, at a minimum, the following phenomena, but feel free to add others if they
  force stronger requirements: the near-miraculous accuracy of simple independence
  heuristics in some settings; the catastrophic failures in settings with local congruences;
  the role of correction constants (such as the one appearing in twin-prime heuristics);
  the difference between independence as a falsifiable approximation and independence
  as a claim about the real distribution; and the obligation to stay consistent with
  theorems already proven unconditionally. Do not pad the list with generic virtues
  like ''precision'' or ''simplicity'' unless you can tie them to a concrete failure
  mode in this area.


  Begin with the piece itself, not with a preface or commentary, and do not restate
  the question. Write in American English."


