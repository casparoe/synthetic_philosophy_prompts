  Popper''s "The Poverty of Historicism" argues against the possibility of discovering
  laws of history and predicting large-scale social/historical development. Key ideas:

  - Historicism = view that history follows a discoverable law-like course, enabling
  long-range prediction (he critiques Marx, Hegel, Comte, etc.).

  - Popper distinguishes pro-naturalistic historicism (favoring physics-like laws
  of history) and anti-naturalistic (history qualitative, holistic).

  - His actual arguments: trends vs. laws; holistic experiment impossible; Oedipus
  effect reflexivity; unpredictability of growth of knowledge; piecemeal engineering
  vs utopian engineering.

  - Common misunderstandings: (1) Popper thinks every historical event is unique and
  that''s why no laws — actually he rejects that premise: uniqueness per se doesn''t
  preclude laws, because all concrete events including physical ones are unique in
  aspects; laws relate abstract properties. (2) He thinks science of history impossible
  — he says historical explanation is fine using both general and particular (logic
  of the situation), but prediction of the future course of history impossible. (3)
  The "Oedipus effect" is the main or only argument — actually growth-of-knowledge
  argument is central; Oedipus effect is one argument among several.

  - Another common misrepresentation: Popper is against all large-scale social action
  / all planning. He''s not; he favors piecemeal social engineering with falsifiable
  policies; he opposes holistic or utopian planning because un-testable and dangerous.

  - Another: "Popper proved historicism false" — he argues it''s a poor method, predictions
  impossible in principle; he does not claim to have refuted historical laws by empirical
  examples alone.


