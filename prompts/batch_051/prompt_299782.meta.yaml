  "Imagine a vast, frictionless surface tiled with dominoes. Each domino is a two-state
  unit: it stands until a neighbor topples into it, and when it falls it sends a wave
  of toppling through its neighbors; a reset mechanism then rights the fallen dominoes,
  leaving them ready to fall again. The tiles have been arranged — as a cellular automaton
  might be — so that the successive waves implement an arbitrary deterministic computation.
  At one level of description, then, nothing happens except dominoes being pushed
  over by adjacent dominoes; the only causes are local collisions, and the only laws
  are the local rules of toppling and resetting. At a coarser level, however, stable,
  self-preserving patterns emerge in the cascades — recurring assemblies of falling
  and standing tiles. Some of these assemblies behave as if they detect one another,
  weigh options, and pursue goals; call them simmballs. The standard puzzle about
  this setup is the question whether symbols actually push the substrate around: when
  we explain a simmball''s movement by saying what it wants or believes, are those
  semantic properties genuine causes of individual domino-falls, or are they just
  shorthand summaries of a process whose only real causes are domino-to-domino pushes?


  Now modify the setup in one respect. Each domino has a small, fixed, independent
  probability epsilon that its next state is the opposite of the one its local transition
  rule specifies: occasionally the wrong domino falls, or the right domino fails to
  fall. Everyone observing the careenium knows this. The coarse-grained simmball patterns
  remain identifiable up to some level of noise, but their trajectories are no longer
  strictly determined by the symbolic stories told about them.


