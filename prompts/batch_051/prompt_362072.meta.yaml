  ---


  I''m an undergraduate currently taking a philosophy of biology course, and I''m
  trying to sort out what "fitness" could mean once you try to make it do real work.
  In the course we''ve gone over the tautology objection — roughly, that "the fittest
  survive" threatens to become empty if fitness is defined as actual survival and
  reproduction — and the standard reply that fitness should be understood as a probabilistic
  propensity rather than an actual outcome. I''m trying to turn that reply into a
  proper working definition, and I keep finding cases where the easy definitions come
  apart.


  Here are the cases I''m using to test candidate definitions. For each I''ve written
  my tentative intuitive verdict, though I don''t think all of my verdicts can be
  right together.


  1. Two genetically identical aphids on the same plant. A ladybug eats one before
  it lays any eggs; the other lays forty eggs. I lean toward saying they have the
  same fitness, because they have the same intrinsic dispositions, even though their
  actual reproductive output differs.


  2. A sterile worker ant that rears many of its queen''s offspring, several of which
  go on to found new colonies. I want to say the worker has fitness, but only through
  the reproduction of relatives, so direct and indirect fitness have to be distinguished.


  3. A plant genotype that produces ten thousand tiny seeds. In dry years most survive
  and in wet years most drown. A second genotype produces ten large drought-resistant
  seeds every year. I have no idea how to rank them without specifying an environment
  or a run of years; maybe neither is simply fitter.


  4. A mutation that speeds up development in a prey species. Right now it is advantageous
  because slow developers are eaten by a newly arrived predator, but it makes adult
  wings fragile, and the advantage may disappear as the predator shifts its search
  image. I think fitness has to be relativized to a selective environment over a specified
  period, but I''m not sure that''s a definition rather than an evasion.


  5. A trait in a small population that has increased in frequency entirely by drift
  and confers no average reproductive advantage on its bearers. I lean toward saying
  its bearers are not fitter, and that a definition must avoid counting every actual
  increase in frequency as fitness.


  6. A bird with a mutation that improves a certain display but is linked to a gene
  that halves fertility. The mutation spreads anyway because the display doubles mating
  success. I think this may still count as fitness at the level of the gene or the
  trait, but I''m not sure.


  7. A genotype that gives, every generation, a 0.5 chance of leaving no offspring
  and a 0.5 chance of leaving twenty, set against a genotype that reliably leaves
  six. The first has the higher expected output; I''m genuinely unsure whether that
  makes it the fitter type, because something feels wrong about calling a type that
  often leaves zero fitter.


  8. A woman who has ten children, none of whom survive to reproduce, set against
  a woman who has two, both of whom have many children. I''m sure the second has higher
  Darwinian fitness, which makes me think a definition built only on counting offspring
  is too crude.


  I''d like you to act as a professional philosopher of biology. Please think carefully
  before answering, and start by brainstorming the constraints a definition would
  need to satisfy. Then propose what you think is the best working definition of fitness
  (or, if you think no single definition can do all this work, propose a small set
  of related definitions and say how they fit together). Run that definition through
  all eight cases above, say where it gives a surprising or ambiguous result, and
  either revise the definition or defend the surprising verdict. Please make a clear
  separation between what is settled or close to settled in the philosophy of biology
  and what is genuinely contested among people working on this material, and do not
  present a contested position as though it were the consensus. Please write the answer
  in American English.


