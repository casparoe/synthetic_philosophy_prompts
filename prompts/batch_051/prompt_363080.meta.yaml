  Prompt draft: "In Berkeley''s Three Dialogues between Hylas and Philonous, there
  seem to be two incompatible claims about the existence of physical objects. In the
  First Dialogue, Philonous argues that one cannot so much as conceive of a sensible
  object''s existing unconceived, and concludes that it is impossible for such objects
  to exist independently of or outside a mind. In the Third Dialogue, however, answering
  the objection that his view makes the world depend on each observer''s own private
  perceptions, Philonous insists that sensible things have a real existence distinct
  from being perceived by any finite mind, and that they continue to exist when no
  human perceives them because they are perceived by an infinite mind, namely God.
  The first passage appears to say that the existence of a physical object cannot
  outrun its being perceived; the second appears to say that objects can exist unperceived
  by us, since God perceives them. Can these two be reconciled, or is Berkeley simply
  equivocating on ''perceived''? Set out the strongest readings of each passage, the
  candidate reconciliations, and say which you think is honest rather than special
  pleading."


  Wait, there is no actual contradiction: Berkeley''s thesis is "esse est percipi"
  where percipi means "being perceived (by some mind, finite or infinite)." The first
  says cannot exist outside *a* mind; the second says exists in God''s mind when not
  in finite minds. So reconcilable by distinguishing "perceived by some finite mind"
  from "perceived by some mind or other." But there''s a deeper issue: what does "distinct
  from being perceived by me" mean? Berkeley says ideas in God''s mind are not the
  same as my ideas? Is God''s idea of the tree the tree itself? Then the tree is one
  thing perceived by God and by me, but perceived differently? This is a known puzzle:
  If all sensible things are ideas, and God perceives them, are there two different
  ideas (God''s idea and my idea) or one idea in two minds? Berkeley sometimes says
  the same things are perceived by God and by us, but ideas are mind-dependent, so
  an idea in God''s mind cannot be in my mind; thus two distinct things. Hylas raises
