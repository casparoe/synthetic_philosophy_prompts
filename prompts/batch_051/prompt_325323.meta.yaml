  Problem of universals key positions:

  - Realism: universals exist. Two main kinds: Platonic/Anti-realist realism = ante
  rem, universals exist independently of particulars (transcendent); Aristotelian/realist
  realism = in rebus, universals exist only in particulars (immanent).

  - Nominalism: no universals; only particulars exist. Varieties: predicate nominalism
  (a term applies in virtue of...), class/resemblance nominalism (particulars resemble
  each other; no shared entity), trope theory sometimes considered moderate nominalism
  — tropes are particularized properties: each red thing has its own redness trope;
  two red things'' tropes exactly resemble but are not identical.

  - Conceptualism: universals exist only as concepts in minds.


  Arguments:

  - One over many: when several things are all F, there is some one thing they share
  — a universal F-ness — by virtue of which they are F; otherwise "being F" would
  be unexplained or we''d need a separate fact per object. In type terms: when multiple
  terms share a type, is there a type entity over and above them? Could be seen as
  "a type is what makes many terms alike" or "the type is the explanation of shared
  behavior."

  - The "third man" / infinite regress objection to Platonism (a universal of F-ness
  and F-ness itself...). Maybe not needed.

  - The problem of instantiation for Platonism: how does a particular instantiate
  a universal if participation requires a third thing? In type terms: the relation
  between a term and its type — is it primitive?

  - The "problem of universals" as applied to relations, not just monadic properties.

  - Identity conditions of types/properties.


