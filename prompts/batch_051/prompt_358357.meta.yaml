  I''m a journalist who covers political philosophy, and last week I sat in on a panel
  during which two scholars, Miriam and Daniel, spent twenty minutes locked in an
  argument about a passage in section 80 of Rawls''s A Theory of Justice. The passage
  is the one where Rawls distinguishes envy proper—hostility toward another''s greater
  good even when it costs you nothing—from resentment, which he counts as a moral
  feeling because it is tied to principles of justice. He then adds a complication:
  some envy is excusable when inequalities are so extreme that they damage the self-respect
  of the less advantaged, even if the envied advantages do not strictly subtract from
  them.


  Miriam argued that this "excusable envy" is unstable. If Rawls says envy proper
  is a vice because it is not a moral feeling, then calling some envy excusable must
  either be a confused concession or an oblique admission that such envy is tracking
  a real injustice. Daniel disagreed. He said Rawls is not licensing envy; he is diagnosing
  it. The excusable envy is still not a moral feeling, but it is a symptom of a badly
  ordered society, rather as a cough is not a virtue even when it is a symptom of
  a disease. Miriam replied that a cough carries no intentional content about justice,
  whereas excusable envy is directed at the comparative advantage itself. If we examine
  only cases where the envious person has no desire to harm the envied person but
  feels that the gap is wrong, it looks less like a vice and more like an inchoate
  form of resentment—just one that lacks a worked-out theory of justice. Daniel answered
  that this conflates two questions: what the emotion says about the person who feels
  it, and what it indicates about the social order. A useful diagnostic signal can
  still be a personal vice; Rawls can consistently say both that a well-ordered society
  should not provoke much excusable envy and that the envious person''s attitude remains
  a moral defect.


