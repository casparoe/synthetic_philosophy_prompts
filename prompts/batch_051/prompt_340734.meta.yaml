  1. Counterexamples where accuracy maximization recommends intuitively irrational
  credences — e.g., "evidence of one''s own future irrationality" cases? Actually
  there''s a literature: "accuracy and the laws of credence" — an agent knows they''ll
  be epistemically irrational later; maximizing current expected accuracy may license
  not following conditionalization. Also "epistemic consequentialism and epistemic
  utility theory" — separation of good and right; side constraints. Cases of "epistemic
  bribes" maybe.

  2. The problem of alternative epistemic values: understanding, explanation, justification,
  evidential fit; if accuracy monism can''t derive a norm it should (e.g., requirements
  of total evidence? independence?), that counts against.

  3. The measure sensitivity problem: some results depend on the choice of scoring
  rule; if key arguments only work for separable, additive, continuous, strictly proper
  scores, the program narrows. A result that accuracy arguments overgenerate under
  various measures would be embarrassing.

  4. The directionality/verisimilitude problem: accuracy-first treats truth as all-or-nothing
  at worlds, but some falsehoods are closer to truth than others. If that matters,
  the formalism misses something.

  5. The "epistemic value of evidence gathering" or the value of having evidence for
  its own sake — accuracy-first makes it purely instrumental.

  6. Objections from epistemic deontology: process requirements (open-mindedness,
  responding to reasons) that accuracy-first cannot recover.

  7. The problem of scoring entire belief states, including binary beliefs: gradational
  accuracy may not capture all-or-nothing belief norms (Lockean thesis problems).

  8. Insulation worry: the program may be driven by the choice of formalism and can
  handle any counterexample by adding constraints.


