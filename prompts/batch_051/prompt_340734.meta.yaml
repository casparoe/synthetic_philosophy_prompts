  Core: Accuracy-first epistemology (AFE) holds that the sole fundamental epistemic
  value is accuracy (gradational, closeness to truth), and the fundamental epistemic
  norm is to maximize expected accuracy. Credences are graded; accuracy measured by
  scoring rules; strict propriety -> probabilism; dominance -> probabilism; expected
  accuracy maximizes conditionalization. Key moving parts:

  - The epistemic value is accuracy and only accuracy (alethic monism).

  - Accuracy measured by a strictly proper scoring rule (Brier score, log score).

  - Additivity/separability: total accuracy of an entire credence function is sum
  of local scores at worlds.

  - Global vs local accuracy.

  - The "immodesty" of probability functions: a probabilistically coherent credence
  function uniquely maximizes expected accuracy by its own lights iff the score is
  strictly proper.

  - Dominance argument for probabilism: if credences violate probability axioms, there''s
  another credence function that is more accurate in every possible world.

  - Accuracy arguments for conditionalization (Greaves & Wallace 2006) and the Principal
  Principle (Pettigrew?).


