  Let me construct the professor''s homemade theory:


  "My seminar has been circling the idea that moral compromise is really two things
  people conflate. I''ve started calling them ''intrapersonal trade'' and ''interpersonal
  trade.'' An intrapersonal trade happens inside one person''s value system: I give
  up something I value (a Sunday afternoon) to get something I value more (finishing
  a paper), and there''s no moral problem because I''m just reallocating within my
  own utilities. An interpersonal trade happens between two value systems: each of
  us makes a concession that costs less by our own lights than the concession we gain
  from the other by our own lights. Both sides can walk away with a ''profit''—each
  has more of what they want—because they price the concessions differently. The puzzle
  is that in moral cases the profits are often joint and the exchange itself can be
  wrong: two politicians logrolling on abortion and tax breaks can each be acting
  wrongly, yet afterwards each has more of what they genuinely value. So the gains
  from trade are real but they don''t seem to make the deal right, and in some cases
  they seem to make it worse (it lets each of us do wrong more efficiently). I want
  an honest assessment: is the intrapersonal/interpersonal distinction sound, does
  it exist under another name, and above all, when there really are joint gains in
  a compromise between two moral views, what, if anything, do those gains contribute
  to the permissibility of the deal? My suspicion is that the economic picture seduces
