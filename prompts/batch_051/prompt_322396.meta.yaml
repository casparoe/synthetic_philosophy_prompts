  a unified treatment is problematic — 5 marks.

  E. Draw the right synthetic conclusion: what the evidence licenses (e.g., institutions
  matter in specific historical contexts) vs. what it doesn''t (a universal "institutions
  cause wealth" law, or policy prescription without caveats) — 4 marks.


