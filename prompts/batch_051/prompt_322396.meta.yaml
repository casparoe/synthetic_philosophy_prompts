  Key conceptual moves:

  1. Observational equivalence / fundamental problem: any historical object of study
  is a single draw; cannot rerun history with different institutions holding all else
  fixed.

  2. Endogeneity/reverse causation: wealth → institutions (richer societies demand
  better institutions), not only institutions → wealth.

  3. Omitted variables: geography and culture plausibly shape both institutions and
  outcomes; selection of settlers, legal origins, disease, crops.

  4. Natural experiments/instruments: settler mortality instrument, colonial boundaries
  (partition), legal-origin instruments. Identification assumptions: relevance (instrument
  predicts institutions), exclusion (settler mortality affects current wealth only
  through institutions), monotonicity/no defiers perhaps, and validity of the exclusion
  restriction (disease environment may affect current outcomes through geography/health/human
  capital, or settler mortality might proxy for early human capital and capital flows).

  5. Heterogeneity and treatment definition: "institutions" is a bundle; which specific
  institution does the work? Property rights vs. state capacity vs. democracy vs.
  legal codes. The causal claim is not a single treatment.

  6. Persistence and path dependence: institutions persist; persistence mechanisms
  need to be specified, otherwise it''s just an equilibrium, not a cause.

  7. Policy implication: historical narratives may not travel; transplantation may
  fail if local conditions differ.

  8. Culture and geography as channels: geography can work through disease, trade
  routes, agricultural productivity; culture through norms of trust/cooperation; these
  may be mechanisms through which institutions operate or competing causes.

  9. Selection into colonization: colonies sorted non-randomly.

  10. Importance of counterfactual: what would the nation have looked like under different
  institutions — the fundamental missing data.


