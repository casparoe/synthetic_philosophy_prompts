  Steps:

  1. An oath is either a promise plus something extra (a solemn ceremony, a sanction)
  or identical to a promise.

  2. A promise creates an obligation (if it does at all) in virtue of the promissory
  commitment itself, not in virtue of the consequences for breaking it.

  3. The extra element in an oath can only be one of two things: a cost imposed on
  breach (like the Styx punishment) or an expression of greater seriousness.

  4. A cost imposed on breach doesn''t create an obligation; it merely changes the
  incentives. (Sticks don''t bind, they coerce.)

  5. An expression of seriousness doesn''t create a new obligation; it only signals
  that the underlying promissory obligation is weightier or that the person is more
  resolved.

  6. Therefore an oath adds no obligation that wasn''t already in the promise; it
  is either redundant or coercive.

  7. So oaths have no distinct binding force.


