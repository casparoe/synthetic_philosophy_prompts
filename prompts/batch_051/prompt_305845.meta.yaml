  I''m a PhD student working on personal identity, and I''ve been trying to sharpen
  Reid''s brave-officer objection to Locke so that it applies to the standard neo-Lockean
  repair as well. The reconstruction I keep arriving at forces a conclusion I don''t
  want to accept, and I can''t tell whether it contains a mistake I''m missing or
  is valid and just prices admission to the neo-Lockean view. I''d rather keep the
  transitivity of identity than anything else in the neighborhood, and I also want
  to keep the claim that it is a determinate fact that the old general is the boy;
  beyond that I''m open. Here is the argument.


  1. Locke''s criterion (L): a later person-stage P is the same person as an earlier
  person-stage Q just in case P has a direct, first-personal memory of at least one
  experience of Q.


  2. Identity is transitive: if P = Q and Q = R, then P = R.


  3. Brave-officer case. At t1, a boy is flogged for stealing apples. At t2, the same
  living body is a young officer who remembers the flogging from the inside. At t3,
  the same living body is an old general who remembers, from the inside, some of the
  officer''s experiences but has entirely lost the flogging.


  4. By (L), the officer is the boy, and the general is the officer. By transitivity,
  the general is the boy. But by (L), the general is not the boy, since he has no
  direct memory of the flogging. Contradiction; so (L) is false.


  5. The neo-Lockean repair replaces direct memory with psychological connectedness:
  a relation that holds in degrees between adjacent person-stages when they share
  particular memories, intentions, beliefs, and similar states. Personal identity
  is then psychological continuity, defined as the ancestral of connectedness — that
  is, the relation that links stages when there is a chain of overlapping connected
  steps between them. This makes identity transitive by construction.


  6. But connectedness is graded, and within a single life psychological overlap thins
  out gradually over time. So the neo-Lockean must either (a) allow any nonzero overlap
  to count as a link, or (b) set some threshold for how much overlap is "enough" to
  make adjacent stages connected.


  7. Option (a) makes the chain relation extremely cheap: the general and the boy
  are linked even if, at each step along the chain, almost nothing was preserved,
  so long as no link dropped to zero. Option (b) makes whether the general is the
  boy depend on where a threshold falls, and memory decay, fading intentions, and
  gradual changes of character give no natural place for such a threshold.


  8. But the neo-Lockean cannot escape by endorsing a vague threshold, because identity
  is supposed to be an all-or-nothing relation with the formal properties in (2).
  Vague threshold merely relocates the problem: verdicts of sameness over time now
  flip on arbitrary stipulations about where overlap counts as sufficient, while the
  underlying facts of memory-loss stay continuous.


  9. So the neo-Lockean repair either trivializes personal identity over time or makes
  it arbitrary in exactly the cases it was meant to explain.


  10. But that conclusion is unacceptable: it is a determinate, non-arbitrary fact
  that the old general is the boy, and no interesting theory of personal identity
  can make that fact depend on a free choice of cutoff.


  So the repair fails. Where does this argument go wrong, if it does? If it doesn''t
  go wrong, which premise should I reject, and what does rejecting it cost — in particular,
  for transitivity and for the claim that identity over time is determinate?


