  Let me get the philosophy right.


  Skolem''s paradox: The Löwenheim-Skolem theorem states that any countable first-order
  theory with an infinite model has a model of every infinite cardinality, in particular
  a countable model. In ZF or ZFC (first-order set theory), there is a theorem "there
  exists an uncountable set" (Cantor''s theorem: the powerset of the natural numbers
  is uncountable). If ZFC is consistent, it has a countable model M by Löwenheim-Skolem.
  Within M, there is a set m that M satisfies "m is the powerset of the natural numbers"
  and M satisfies "m is uncountable" (i.e., there is no function in M from the natural
  numbers onto m). But since M is countable, the set m (as seen from outside) has
  only countably many elements. So there is a model of set theory in which a set is
  "uncountable inside the model" but countable from the outside. The paradox dissolves
  by noting that countability is not absolute: a bijection between m and the natural
  numbers exists in the universe outside M but need not be an element of M. "Uncountable"
  means "no bijection in the model." This is the standard resolution.


  Pedagogical challenge: teaching this to students without formal set theory. What
  order of ideas?

  1. Distinguish between a theory (syntactic) and a model (semantic).

  2. Cardinality and Cantor''s theorem: there are "more" subsets of N than elements
  of N; a set is countable if there is a one-to-one correspondence with N.

  3. First-order languages and the key fact that first-order formulas cannot say everything
  about models? Actually the key: Löwenheim-Skolem says if a first-order theory has
  any infinite model, it has models of every infinite size; first-order logic cannot
  pin down the size of an infinite structure.

  4. The paradox: apply the theorem to ZFC.

  5. Resolution: the internal/external distinction; functions are objects in the model;
  "countable" is relative to what functions exist in the model.


