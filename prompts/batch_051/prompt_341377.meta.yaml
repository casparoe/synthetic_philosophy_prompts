  Let me think carefully about heritability content. Heritability in the broad sense
  (H^2) vs narrow (h^2). Key facts:


  - Heritability is proportion of phenotypic variance in a population attributable
  to genetic variance, given a particular population and environment range.

  - It''s population-level, not individual-level. Saying "heritability of height is
  80%" does NOT mean 80% of your height is caused by genes.

  - High heritability doesn''t mean environment doesn''t matter; e.g., height is highly
  heritable but average height increased with nutrition (Flynn effect analog for height?
  secular increase). Actually height heritability is high within populations but environment
  changes mean.

  - Heritability says nothing about between-group differences. High within-group heritability
  does not imply between-group differences are genetic. (Lewontin''s seed example:
  two batches of corn same genetics but different soil; within each batch heritability
  high, between-group difference entirely environmental.)

  - Heritability does not imply immutability or that environmental interventions won''t
  work; PKU is genetic but treatable by diet. Also educational interventions.

  - Heritability can change if environment changes; it''s not a fixed property of
  a trait.

  - Falconer''s formula? Not necessary.

  - Heritability of intelligence: within-group heritability estimates maybe 0.5-0.8
  in adults; but variance decomposition includes gene-environment correlation and
  interaction complications; assumptions of additivity often violated. Twin studies
  rely on equal environments assumption; adoption studies assumptions.

  - SNP-based heritability is lower ("missing heritability"), narrow-sense additive
  captured by measured SNPs.


