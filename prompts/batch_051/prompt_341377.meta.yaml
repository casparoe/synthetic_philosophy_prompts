  observe any necessary connection between cause and effect; all we ever see is events
  following each other in a regular way, plus maybe spatial contiguity. From regular
  succession we build up a habit of expecting the effect when we see the cause, and
  we project that necessity onto the world. So causation in the world is just constant
  conjunction; necessary connection is in our heads.


  But here''s the thing: modern causal discovery algorithms seem to get more out of
  purely observational data than regular succession. Given a joint probability distribution
  over variables, the PC algorithm (with assumptions like acyclicity, faithfulness,
  and no confounders) can sometimes orient arrows from correlations alone — e.g. an
  unshielded collider pattern tells you two causes point into a shared effect even
  without time order. So the data contains an asymmetry that isn''t just ''X came
  before Y''. Does this break Hume''s argument? His premise was basically that experience
  gives you nothing but successions and correlations, so any idea of a real causal
  connection is projection. But if a probability distribution can license an arrow
  in a direction, experience is giving you something more than succession. Does Hume''s
  argument survive by absorbing this into the regularity view (the asymmetry is just
  another pattern of conjunction), or does it put pressure on the regularity reading
  and make the New Hume-style view (there are real hidden powers we can''t directly
  observe) more attractive? Or does causal discovery just not touch the philosophical
  question because it still doesn''t show necessary connection, only structural dependence
  under assumptions?"


