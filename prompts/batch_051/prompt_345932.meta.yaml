  Let me lay out the distinction as I currently understand it, so that you can correct
  me if my grasp of it is off. A causal Bayes net is a directed acyclic graph whose
  arrows represent direct causal influence, together with a probability distribution;
  the graph entails a set of conditional independence relations, roughly that each
  variable is independent of its non-descendants given its parents. The faithfulness
  condition says that the independencies present in the data are exactly the ones
  entailed by the graph — in particular, that a measured independence is not an artifact
  of two causal pathways canceling each other''s influence. The minimality condition,
  as I understand it, is weaker: it says only that the graph contains no arrow whose
  removal would destroy its ability to reproduce the observed pattern of dependence
  and independence. A minimal graph can be unfaithful to the true causal structure,
