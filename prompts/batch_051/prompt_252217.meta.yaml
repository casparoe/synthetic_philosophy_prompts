  Verdicts:


  1. We have a function `increment(x)` that has only ever been run on inputs 0 through
  999. It returns x+1 on all of those inputs. I have no hesitation saying this function
  implements the rule increment, full stop. I do not think it implements the rule
  "add 1 up to 999, and return 14 for anything larger," even though every observation
  we have is consistent with both descriptions.


  2. Suppose instead that the source code literally contains a branch: return x+1
  if x < 1000, otherwise return 14. The function has the same observed history as
  the one in (1), because no input ≥ 1000 has ever occurred. Now I say it implements
  the gappy rule, not increment, even though its observed behavior is identical to
  (1). Reading the source matters.


  3. A junior engineer writes a function they believe computes the mean of a list,
  but the code actually computes the sum. In review, I say the code implements summing,
  not averaging; their stated intention doesn''t override what the branch conditions
  and operations actually do. Yet when the code itself is ambiguous between two semantics
  — e.g., a parameter named `count` that could be parsed as either an integer or a
  float — I do use the author''s written intent and the surrounding codebase conventions
  to settle which rule it expresses.


  4. A model is trained on inputs like (3, 4) → 7 and (10, 20) → 30, all with operands
  under 100. It then answers (25, 30) → 55 correctly. I''m unwilling to say the model
  has learned the rule of addition. I''ll say it has learned a function that generalizes
  well over the tested range; calling it "the rule of addition" feels like a useful
  summary, not a fact about something in the model.


  5. A new hire has only ever solved addition problems with operands under 57. I''m
  comfortable saying they''ve learned addition, not some "bounded addition" that agrees
  with addition below 57 and returns 5 above. But then I notice: if I look only at
  their past behavior, their test scores, and even everything they''ve ever consciously
  thought about arithmetic, all that evidence is equally consistent with both descriptions.
  I can''t point to the fact that makes it addition rather than bounded addition,
  yet I still believe there is such a fact.


  Working principle: a system implements a rule when its explicit structure — the
  source code, or the person''s understanding — selects one of the many rules consistent
  with its behavior. Behavior alone never settles it. But that principle feels strained
  by (4) and (5): in (4) there''s no explicit structure, so my principle says the
