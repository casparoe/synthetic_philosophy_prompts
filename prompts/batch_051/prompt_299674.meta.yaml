  (a) The move from honor to dignity culture is a real moral improvement, mostly because
  in a dignity culture you don''t have to prove you''re not a doormat by retaliating;
  being able to shrug off an insult is an actual virtue, not servility.


  (b) But honor culture has something we lost: it makes defending your family and
  repaying betrayal into obligations that third parties enforce through esteem and
  shame, rather than private choices you can opt out of when it''s costly.


  (c) Victimhood culture also gets something right; when institutions are stacked
  against you, publicly naming the harm and appealing to outsiders is often the only
  way to make the strong take you seriously. "Just grow a thicker skin" can be a demand
  that powerless people absorb abuse on the powerful''s terms.


  (d) Still, I find the core of victimhood culture morally corrupting: it gives status
  to people in virtue of being injured, which rewards fragility and invites people
  to frame themselves as victims strategically.


  (e) I think self-respect should not be hostage to what other people think, and a
  culture that makes people''s standing depend on public recognition of their injuries
  is making sentience of a sort of moral mistake.


  (f) But I also think a person who is completely indifferent to his reputation, in
  the sense that he doesn''t care what his community thinks about him, is usually
  not enlightened but antisocial or dangerous.


  (g) On violence: I''m fairly absolute that interpersonal insults almost never justify
  violence; shaming, exclusion, and reputational costs can be appropriate and sometimes
  better than legal punishment.


  (h) And a meta-ish one: I suspect that asking which culture is morally superior
  in the abstract is less useful than asking under what material conditions each is
  stable and least cruel - so maybe honor norms are rational where the state is weak,
  dignity norms where the state is strong, and victimhood norms where institutions
