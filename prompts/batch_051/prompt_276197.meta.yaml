  Potential cases:

  1. A meiotic drive allele (e.g., t-haplotype in mice?) that biases its own transmission
  to >50% but reduces sperm function or homozygote fitness. Verdict: the element is
  selected for; this is gene''s-eye selection par excellence (though sometimes called
  "selfish genetic element").

  2. An allele that causes its bearer to help kin at cost: spreads via inclusive fitness
  / gene''s-eye with r b > c. Verdict: gene selected, but explaining at gene level
  is optional; organism-level kin selection is coherent.

  3. A chromosome rearrangement (inversion) that protects locally adapted combination?
  maybe too niche.

  4. A plasmid that confers antibiotic resistance and can transfer horizontally: gene''s
  eye should count it as replicator even though not "for" the organism.

  5. A cultural trait (meme) that spreads because catchy: Dawkins would call it replicator;
  but asker could say no, it''s not a "gene" but a cultural analog; need boundary.

  6. An epigenetic methylation state transmitted to offspring for a few generations:
  does it count? Maybe no; because not stable/segregating like alleles? But gene''s
  eye should focus on "active germ-line replicators"; methylation dutifully? Hmm.

  7. A cancer somatic mutation that makes a cell lineage proliferate within body:
  it spreads within body but not across generations. Verdict: not a replicator in
  the evolutionary sense because no germ-line transmission; it dies with the body.

  8. An organelle genome (mitochondrial DNA) with cytoplasmic inheritance and conflict
  with nuclear genes (cytoplasmic male sterility in plants). Verdict: yes, replicator;
  different transmission rules (uniparental).

  9. A group-level trait (e.g., a pop where altruists cooperate: group selection)?
  Verdict: group selection possible but asker skeptical; the gene''s-eye view explains
  without group as replicator; groups are vehicles at best.

  10. A "greenbeard allele" that causes a visible tag and altruism toward other bearers.
  Verdict: gene-level selection; the single allele both recognizes and directs altruism.
  It is a gene''s-eye success (though Dawkins notes such genes rare).


