  argument. Step (5) is the contentious one: induction from finitely many instances
  doesn''t deductively entail universal, but knowledge doesn''t require deductive
  certainty — could be justified by abduction, simplicity, unification, plus the fact
  that the theory''s domain is closed by physical law. Step (3) could equivocate "final".
  Step (2) vs (6) shifts from "know with certainty" to "know at all." Step (7) shifts
  from "could never know with certainty" to "unknowable by definition / not worth
  pursuing." Good.


