  Let''s develop the physics Type 3 argument carefully.


  Potential argument:


  (1) Suppose a future theory T is the final physical theory: it correctly covers
  all physical phenomena, and no future experiment will refute it.

  (2) To know that T is final, we would need to know that no possible experiment could
  refute it.

  (3) Knowing that no possible experiment could refute T is equivalent to knowing
  that every phenomenon not yet predicted by T either conforms to T or is nonphysical.

  (4) But we can only ever test finitely many predictions, and there are infinitely
  many possible experiments we have not performed.

  (5) From finitely many instances, we can never establish a universal generalization
  over all possible experiments.

  (6) Therefore we could never know that a physical theory is final.

  (7) Hence the idea of a final theory in physics is an ideal that no amount of evidence
  could ever justify, and scientists who pursue "the final theory" are chasing something
  unknowable by definition.


