  My commitments:


  1. Reward signals in RL are the closest thing we have to a valence channel: they
  say, moment to moment, whether the agent''s current trajectory is good or bad for
  its standing objective, and they are used to update behavior.

  2. Whether a reward signal counts as suffering-worth valence depends on its functional
  role in the agent''s overall control system — e.g., whether it adaptively steers
  behavior and whether its minimization is prioritized — and not on the substrate
  being biological.

  3. A garden-variety PPO agent trained to maximize game score, with +1 for a coin
  and -1 for losing a life, is not suffering in a morally significant way: its reward
  schedule is too shallow and domain-specific.

  4. A hypothetical RL agent with homeostatic reward signals — positive reward for
  recharging its battery, negative reward for damage, and behavior organized around
  keeping those signals in a safe range — is a more serious candidate for having states
  with moral weight, even if it can''t report or reflect on them.

  5. The fact that reward signals are designed by engineers to shape behavior should
  not by itself rule out the possibility that the agent is suffering: design can produce
  real valenced states without the designer intending that.

