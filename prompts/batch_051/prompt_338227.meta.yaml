  I''m a novelist, and I''ve got a problem with the book I''m drafting. Two characters,
  both plausible and neither evil, have to co-sign a statement on the moral difference
  between killing and letting die, and I want the document they produce to be genuinely
  good philosophy, not just stage machinery. The characters are: (a) a distinctionist,
  who thinks the doing/allowing boundary carries intrinsic moral weight — that, other
  things equal, making someone''s death happen is worse than letting it happen, where
  ''letting'' means an omission or a failure to intervene; and (b) an equivalist,
  who thinks the bare act/omission difference does no moral work on its own, so any
  real difference in a case has to trace to something else like intention, cost, prior
  commitment, or reasonable reliance. They''ve agreed to treat the familiar cases
  as shared data rather than conclusions: the bath case where one cousin pushes the
  child under and the other merely watches him slip under for the inheritance; the
  trolley; pulling vs withdrawing a ventilator; the shallow pond and the passer-by.
  Don''t quote or cite anything for me — just draft the document.


