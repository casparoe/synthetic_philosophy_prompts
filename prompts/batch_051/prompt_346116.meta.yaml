  Two people in my reading group got into a long argument over Charles Spearman''s
  1904 American Journal of Psychology paper, General Intelligence, Objectively Determined
  and Measured. They weren''t fighting about the usual "g factor" stuff so much as
  the apparent tension between two parts of his argument: the section headed ''Universal
  Unity of the Intellective Function'' and the next one, ''The Hierarchy of the Intelligences.''
  I didn''t record their exact words, but the back-and-forth went roughly like this:


  (1) She said Spearman wants it both ways. The first section seems to say all intellectual
  tasks reflect a single common function, but the second talks about a hierarchy,
  which sure sounds like several distinct capacities arranged in levels.

  (2) He said no, the hierarchy section is compatible with the unity claim. The hierarchy
  is just about how strongly different tests are saturated with the one common factor;
  some tests are more g-loaded than others, so they cluster together, but that doesn''t
  mean there are separate intelligences.

  (3) She replied that if "saturation with g" can be adjusted to fit whatever correlation
  pattern shows up, then the theory doesn''t actually risk much, and calling it a
  single function is doing no explanatory work.

  (4) He said it isn''t adjusted freely. A single general factor implies that the
  correlations among tests should have a particular structure—not just "positive and
  hierarchical," but a pattern that would be very unlikely if each ability had its
  own independent cause. So the theory does take a statistical risk.


  Can you adjudicate their disagreement move by move: for each numbered claim, say
  whether it''s roughly right, partially right, or mistaken, and briefly justify it.
  Then say what, if anything, both of them are missing about what Spearman could and
