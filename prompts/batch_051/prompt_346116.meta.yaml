  "Two members of my reading group got into a long argument about Spearman''s 1904
  paper ''General Intelligence, Objectively Determined and Measured.'' They weren''t
  really fighting over the usual g-factor stuff; they were stuck on the tension between
  the section called ''Universal Unity of the Intellective Function'' and the following
