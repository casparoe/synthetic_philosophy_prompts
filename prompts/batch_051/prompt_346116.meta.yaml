  but the back-and-forth went roughly like this:


  (1) She said Spearman wants it both ways. The first section claims all intellectual
  tasks reflect a single common function, but the second says abilities form a hierarchy,
  which sounds like several distinct capacities arranged in levels.

  (2) He said no, the hierarchy section is just about how strongly different tests
  load on the one common function; some tests are more saturated with g than others,
  so they cluster, but that doesn''t multiply functions.

  (3) She replied that if ''saturation with g'' is free to vary however the data demand,
  then the theory can absorb any pattern of correlations, so it''s no longer explaining
  anything.

  (4) He said it isn''t free: the correlations should satisfy certain tetrad constraints,
  or at least approximate them, so the theory makes a risky numerical prediction.
  If those constraints failed badly, g-only would be in trouble.


