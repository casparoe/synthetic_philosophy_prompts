  Let''s draft:


  "Question from a philosophy professor: I teach a course with a unit on counterfactual
  theories of causation, and a snag about omissions has started to bug me in a way
  I can''t name. Take a nurse who fails to give a patient a needed drug, and the patient
  dies. The standard counterfactual test says: if the nurse hadn''t omitted the administration,
  the patient wouldn''t have died. But ''hadn''t omitted'' doesn''t pick out a single
  possible action. Should we imagine she gives the drug correctly, on time? Or gives
  the wrong dose? Or gives it too late, after the point where it would have worked?
  There are many ways for her not to omit, and the truth of the counterfactual flips
  depending on which one we hold fixed—give it correctly and the patient lives; give
  the wrong dose and the patient dies anyway. So whether the omission comes out as
  a cause depends on a choice of alternative that the world alone doesn''t determine.
  I know this is adjacent to familiar claims that causal selection is interest-relative
  and that omissions need a background norm or expectation to get selected at all;
  but those are about which absences we bother to cite. This is a further problem:
  even once a specific omission is salient, we still haven''t fixed the positive act
  we''re comparing it to. Is there an established name for this underdetermination
