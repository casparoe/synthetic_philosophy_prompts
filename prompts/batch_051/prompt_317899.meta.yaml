  over envelope amounts matters. If you see $10 and know the two amounts are $5 and
  $10 (not $5/$20?), hmm. Actually the standard resolution: the expectation calculation
  uses a conditional probability p(envelope has half | I see x) = p(envelope has double
  | i see x) = 1/2, which has no consistent prior over the unbounded set of possible
  pairs. For any proper prior, the belief that the other is double can''t be 1/2 for
  all x. In finite-bounded cases, it''s not uniform. So the paradox dissolves.


