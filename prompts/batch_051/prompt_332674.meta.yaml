  Let me explore the surprise exam + type 2 combo. A high school student writing their
  "commitments" about the surprise exam paradox:


  "Last week my epistemology study group tried to formalize why we found the surprise
  exam announcement so threatening, and I wrote down the following commitments...
  I want to know whether they hang together and, if not, which one goes."


  Commitments:

  1. Knowledge is factive and distributes over known entailment (if S knows P, and
  S knows P entails Q, then S is in a position to know Q). Actually the relevant principle:
  if on Thursday you know there will be an exam and know it can''t be Monday–Thursday
  (because those days passed without an exam), you can infer it''s Friday; and if
  you know it''s Friday, you know it won''t be a surprise. Therefore the announcement
  that it will be a surprise is false.

  2. Backward induction: by the same reasoning repeated, the surprise can be ruled
  out for every day; so the announcement is not merely sometimes false but self-defeating.

  3. But in practice the exam happened on Wednesday and was surprising.

  4. The teacher''s announcement seemed meaningful — not a trick, not contradicting
  itself in the way "there is and isn''t an exam" does.

  5. Maybe: knowledge is closed under known entailment is non-negotiable; a surprise
  is just an event you don''t know in advance will happen that day.


  The tension: 1+5 yields that Thursday night you''d know it''s Friday, so no surprise
  — but that''s fine; the paradox is the induction. The genuine tension: closure +
  the idea the announcement is knowable + "Wednesday was a surprise" cannot all hold.
  Also there''s a subtle tension between "surprise = not knowing the day in advance"
  and "backward induction" — the induction seems valid step by step, yet the exam
  surprises anyway, suggesting either the induction has a hidden flaw (closure fails,
  or knowledge isn''t closed over multi-step reasoning, or "surprise" is about belief
  not knowledge, or the announcement isn''t knowable because it''s not true) or one
  of the other commitments gives.


