  ---


  I''m a high school student writing my term paper for an independent study on how
  long-run predictions age, and I keep using a phrase I cannot actually defend: that
  Malthus was "right but early." By that I mean the familiar claim that his core mechanism
  — that population tends to outrun the food supply, kept in check by famine, disease,
  war, and deliberate restraint — was never actually refuted by the industrial and
  agricultural revolutions; those developments only postponed a mechanism that still
  shows up wherever the postponing conditions are absent. My advisor said this sounds
  like the kind of claim that survives anything: every failure gets absorbed as a
  delay, and no observation could ever count against it. She asked me what evidence
  would tell a genuinely early theory apart from a theory that keeps being rescued
  until it is empty, and I do not know how to answer.


  What I want to do is design the strongest defensible test of the claim. I am imagining
  something like: compare populations or periods that differ only in the factors that
  allegedly delay the mechanism — sustained technological improvement, institutions,
  the demographic transition — and see whether Malthusian checks reappear when those
  factors are absent; a positive result would be some regular reappearance in stripped-down
  conditions, and a negative result would be no such reappearance even when the delays
  are removed. But I suspect this is too simple, because the boundary between "part
  of the theory" and "an outside rescue" is exactly what is in dispute. So I am asking
  for a concrete test built from observations a high schooler could gather from ordinary
  economic and demographic history, with the result pattern that would favor each
  reading, and an honest account of what the test would leave unsettled — in particular,
  whether "right but early" is really one claim about a mechanism or a flexible label
  for a research program that changes its auxiliary assumptions each time a prediction
  fails.


  ---


