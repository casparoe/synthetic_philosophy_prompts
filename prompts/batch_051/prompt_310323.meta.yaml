  I''m preparing to teach Robert Bolt''s A Man for All Seasons, alongside the 1966
  film, in a course on the moral psychology of integrity, and I want to use the play
  to work through a specific question: what is it to be uncorruptible, and is that
  always a good thing? The stock reading treats Thomas More as the saint of conscience—the
  man who will not take the Oath of Supremacy, will not sell his convictions for office,
  safety, or even his family''s peace, and therefore goes to the block rather than
  bend. I''m suspicious of that reading, or at least I suspect it needs to be earned
  rather than assumed. The More the play actually gives us is also legalistic, guarded,
  silent in ways that can look like evasiveness, and protective of his own self in
  a manner that can look like pride; his unbendingness costs Alice and Margaret terribly,
  and the play openly raises the question of whether his refusal to find a place for
  Richard Rich helps send Rich down the road to perjury.


  I''d like a philosophical reading of the play through the lens of integrity and
  incorruptibility, one that does not decide too early whether More''s constancy is
  a virtue or a case of what philosophers have sometimes suspected—that an unbreakable
  person can also be a self-enclosed, relationally destructive one. The concept should
  be allowed to do real work: it can explain why Rich functions as More''s dark double,
  why the King''s need for universal compliance exerts its particular pressure, and
  why the various compromises of Wolsey, Cromwell, and the other courtiers look like
  failures of a different kind rather than mere differences of interest. But the work
  should also be allowed to talk back: attend to the scenes in which incorruptibility
  starts to look like obstinacy, like a refusal to take responsibility for the damage
  one''s purity causes, or like pride wearing a better name. Be faithful in both directions—do
  not reduce the play to an illustration of a philosophical theorem, and do not let
  its dramatic force settle the question of whether More''s way of being uncorruptible
  is, on the whole, good.


