  Let me design.


  Domain: Judgment aggregation and the discursive dilemma.


  Type: Turn a principle or theory into a procedure a practitioner can follow.


  We need: fix the role, frequency and stakes of the decisions, and the constraints
  (time, expertise, who signs off). Deliverable: reusable procedure. Worked applications
  to two or three cases, including one where the procedure gives an answer the asker
  will not like, and says what the procedure cannot do. And British English.


  Let''s think of a practical setting. A grant-awarding panel? A university academic
  board deciding whether a candidate should be hired/promoted based on multiple criteria?
  A hospital clinical ethics committee? The discursive dilemma applies when a group''s
  majority judgments on premises conflict with the majority judgment on the conclusion.


  For a procedure, the asker wants a decision procedure for aggregating committee
  votes across multiple premises without falling into inconsistency, grounded in judgment
  aggregation. Need constraints: non-experts, time limits, etc.


  Maybe an accreditation body: a degree classification board? A parole board? An academic
  hiring committee that must decide on three criteria (research, teaching, service)
  with majority for each but a majority against hiring (classic example!). Actually
  the classic example: a panel decides whether to hire based on three criteria; three
  judges: A accepts all three premises; B accepts first two, rejects third; C rejects
  first two, accepts third? Let me recall the doctrine paradox: three judges on a
  legal case must decide whether defendant liable based on two premises: (1) contract
  was valid, (2) defendant breached. Judge A: yes, yes -> liable. Judge B: yes, no
  -> not liable. Judge C: no, yes -> not liable. Majority: premise1 yes (A,B), premise2
  yes (A,C), but conclusion liable only A -> not liable (B,C). Thus majority view
  is inconsistent with majority conclusions: majority accept each premise but majority
  reject conclusion.


  Hiring version: three committee members, three criteria; each member votes yes to
  candidate if all three criteria met; member 1 supports all three; member 2 supports
  criteria 1&2 but not 3; member 3 supports criterion 3 but not 1&2. Majority on each
  criterion (2 of 3) but majority against hire (2 of 3). This is classic and likely
  in pretraining. But applying to a novel committee (e.g., ethical approval board,
  disease eradication policy) with a procedure is more in-the-weeds.


  We could make a plausibly novel setting: a public health advisory committee deciding
