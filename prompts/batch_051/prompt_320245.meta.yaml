  I''m a PhD student in cognitive psychology working on categorization, and I''ve
  been collecting my own judgments to see which theory of concepts they add up to.
  They refuse to add up to one, and I''d welcome a reconstruction.


  Here are my verdicts:


  (1) In speeded tasks I accept "a robin is a bird" faster than "a penguin is a bird,"
  and if I list birds off the top of my head, robin comes early and penguin late.
  But I don''t think a penguin is a borderline bird; each is fully a bird, and the
  difference is only in how good an example it is.


  (2) If an animal born to raccoon parents is surgically altered to look like a skunk
  — stripes, scented, the works — I call it a raccoon, not a skunk, and I expect it
  to have raccoon offspring. What something is, for a natural kind, seems to be settled
  by its history and insides, not by how it presents.


  (3) I rate 4 a better example of an even number than 806, even though I know "even
  number" admits of a crisp definition — integer divisible by 2 — and 806 meets it
  exactly as much as 4 does. The gradedness doesn''t make me doubt the definition.


  (4) For "things to take out of a burning house," I list the children, the passports,
  and the laptop before the television, although the television resembles the laptop
  (same room, similar price, both electrical) far more than the passports do. The
  category seems built around my goals, not around family resemblance among the members.


