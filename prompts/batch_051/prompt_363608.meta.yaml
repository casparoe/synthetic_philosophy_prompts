  ignore it; choosing to condition one''s actions on more information weakly increases
  expected utility. There are caveats: value of information can be negative ex post
  (with regret) even though ex ante nonnegative; the theorem assumes you can correctly
  update (no issues of self-deception, ability to ignore info), no effects of information
  on payoffs independent of action ("bad news" with commitment?), no cognitive costs,
  no info affecting the utility function or wellbeing directly (e.g., knowing about
