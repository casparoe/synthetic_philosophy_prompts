  Definitions:

  - Calibration: P(Y=1 | S=s, score = t) = t for all groups. (well, within score bins.)

  - Equalized odds: predictor independent of protected attribute conditional on outcome:
  P(score | S=0, Y=y) = P(score | S=1, Y=y). Equivalently equal FPR and TPR across
  groups.

  - Predictive parity/equality: P(Y=1 | S=0, score above threshold) = P(Y=1 | S=1,
  score above threshold), i.e., equal PPV/ NPV.

  - Demographic parity: P(score above threshold | S=0) = P(score above threshold |
  S=1).


