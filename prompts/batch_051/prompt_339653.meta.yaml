  For just as children tremble and fear all

  In the viewless dark, so even we at times

  Dread in the light so many things that be

  No whit more fearsome than what children feign,

  Shuddering, will be upon them in the dark.

  This terror, then, this darkness of the mind,

  Not sunrise with its flaring spokes of light,

  Nor glittering arrows of morning sun disperse,

  But only nature''s aspect and her law.


  I''d like you to act as an expert on Epicurean philosophy and literary criticism.
  Take a few minutes to think this through carefully, and maybe start by brainstorming
  some scenes or moments from the novella that could support or resist Lucretius''s
  diagnosis. Then read the novella through this passage. My specific question: does
  Ivan Ilyich''s dying show that Lucretius is right that fear of death is a childish
  mental terror that nature''s laws can dissolve, or does the story show something
  that the Epicurean argument can''t reach? I also know the Epicureans use the symmetry
