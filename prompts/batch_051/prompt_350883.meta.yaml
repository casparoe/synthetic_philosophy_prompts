  Then steps:

  1. Hume''s copy principle says every simple idea is derived from a corresponding
  impression.

  2. We have no impression of necessary connection between objects; the only relevant
  impression, on Hume''s own analysis, is the felt determination of the mind after
  observing constant conjunction.

  3. Therefore, on Hume''s principles, we have no idea of necessary connection in
  objects, only an idea of a feeling of expectation in ourselves.

  4. But the New Hume reading says Hume allows that there may be objective necessary
  connections in objects, and that his skeptical conclusions concern only what we
  can know or observe.

  5. If we have no idea of X, then sentences apparently about X cannot express a coherent
  possibility; at best they use words without assignable content.

  6. So if the New Hume reading were right, Hume would be using the phrase necessary
  connection in objects to express a possibility that, by his own principles, he cannot
  so much as think.

  7. Therefore the New Hume reading saddles Hume with an incoherent position and should
  be rejected.


