  Draft v2:


  "I am a student in a course on game theory and the philosophy of rationality, and
  the unit on the centipede game has left me puzzled about why the surrounding debate
  feels so frozen. Backward induction appears to settle the game: at the last node
  a player would take the larger payoff, so the player before would take, and so on
  back to the very first move, where the first player should end the game immediately.
  In the laboratory, however, subjects routinely pass well beyond the first move,
  and many theorists are reluctant to call them irrational for it. The usual reply
  is that experimental subjects lack common knowledge of rationality, or that their
  choices are driven by fairness, trust, or reputational concerns that the listed
  payoffs do not capture. The critics respond that this concedes the important point:
  add any uncertainty about the other player''s reasoning, any other-regarding preference,
  or any relationship between the players, and one is no longer analyzing the game
  that backward induction was supposed to solve. They also press a sharper objection,
  namely that after a player actually deviates from the backward-induction path, common
  knowledge of rationality has already been destroyed, so the chain of reasoning can
  no longer tell the remaining player what to do. This exchange has gone around for
