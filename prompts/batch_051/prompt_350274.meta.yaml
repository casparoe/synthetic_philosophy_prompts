  "I''m a student in a course on the philosophy of rational choice, and we have been
  working through the centipede game. I find the surrounding debate strangely frozen.
  Backward induction gives a clean answer: at the final node the player would take
  the larger payoff, so at the previous node the other player should take, and by
  this chain the first player should take on the first move. Yet when the game is
  actually played, participants regularly pass for several rounds and often reach
  the end, and many theorists are unwilling to call them irrational. The defenders
  of backward induction reply that the players in experiments lack common knowledge
  of rationality, or care about fairness and trust in ways not represented in the
  payoffs, or have simply failed to reason the tree through. The critics answer that
  this is exactly the point: once you add uncertainty about the other player''s reasoning,
  other-regarding preferences, or a story about the players'' relationship, you are
  no longer analyzing the same game, and the backward induction conclusion stops being
  compulsory. The back-and-forth has been going on for decades, and I cannot tell
  whether the two sides are disagreeing about something substantive or talking past
  each other. I would like you to diagnose the structure of this disagreement rather
  than adjudicate it. Is it a factual dispute about how people actually reason, a
  normative dispute about what rationality requires in the presence of common knowledge,
  a dispute about which features belong in the model of the game, or a case of two
  projects—one formal and normative, one descriptive and behavioral—being conducted
  under the single heading of ''the solution to the centipede game''? My own hunch
