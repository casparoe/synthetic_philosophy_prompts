  Domain: JOOTSing and the MU-puzzle. JOOTSing means "jumping out of the system" —
  a term coined by Hofstadter in GEB. The MU-puzzle: start with MI, rules:

  1. If you have a string ending in I, you can add a U: Mx -> MxU.

  2. If you have Mx, you can double the x: Mx -> Mxx.

  3. If III occurs, replace with U: xIIIy -> xUy.

  4. If UU occurs, drop it: xUUy -> xy.

  Question: can you derive MU? Answer: no, because the number of I''s is never divisible
  by 3; MU has zero I''s, and 0 is divisible by 3? Wait standard answer: can''t get
  MU because the count of I''s is never a multiple of 3? Let me recall. Start with
  MI (one I). Rule 1 adds U, no effect on I count. Rule 2 doubles I count (x -> xx
  copies I''s: if x has k I''s, doubled has 2k). Rule 3 replaces III with U, reducing
  I count by 3. Rule 4 drops UU, no effect. So I-count modulo 3: starting at 1; doubling:
  1 -> 2 -> 1 -> 2..., I-count mod 3 can be 1 or 2, never 0. MU would have 0 I''s
  i.e. 0 mod 3. Hence impossible. Yes.


  JOOTSing in GEB: the insight that to see why MU is underivable within the system,
  you step outside the rules and use number theory (the I-count invariant). That''s
  "jumping out of the system." Interesting concept: a system has internal rules; to
  prove limitations of the system, you sometimes need to step outside to a richer
  meta-level. Related to Gödel''s incompleteness. The concept generalizes: JOOTSing
  = finding an invariant/interpretation from outside that explains what the system
  can and can''t do.


