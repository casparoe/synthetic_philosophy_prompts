  Let me draft the KS mechanism prompt.


  Key ideas of KS solution:

  - Two players, a set S of feasible payoff pairs, disagreement point d = (d1, d2)
  in S.

  - Utopia point u = (u1, u2) where u_i = max payoff player i can get in S subject
  to the other player getting at least d_j (i.e., the maximum individually rational
  payoff).

  - KS solution is the maximal point on the ray from d through u that lies in S: the
  point (d + α(u − d)) with α maximal such that point ∈ S.

  - It equalizes the ratio of gains: (x1 − d1)/(u1 − d1) = (x2 − d2)/(u2 − d2) (when
  both denominators positive).


