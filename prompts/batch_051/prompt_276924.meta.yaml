  arranges matters so that a later version of themselves will be unable, or at least
  severely impeded, from acting on a desire the clear-headed version foresees. A mild
  instance: a writer who knows she will check her messages instead of finishing a
  chapter places her phone in a timed lockbox to which neither she nor her family
  has the key until evening. A sharper instance: a man with a history of gambling
  signs himself onto a casino exclusion list, so that even on the nights when he most
  wants to enter, the house is bound to turn him away. In fiction I tend to press
  the structure further, toward a character who, convinced that his grief will later
  make him do something ruinous, signs an instrument granting a trusted person durable
  authority to refuse his instructions.


