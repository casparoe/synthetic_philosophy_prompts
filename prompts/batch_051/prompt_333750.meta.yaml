  Draft:


  "I teach moral philosophy, and I have been turning over a problem about the familiar
  ''what if everyone did that?'' test. The canonical formulations — Kant''s formula
  of universal law, Hare''s universal prescriptivism, and the popularized version
  that runs through Singer''s work — all ask us to test an individual act by imagining
  its universal performance. But the examples used to motivate the test tend to be
  additive or linear: if everyone stole, property would dissolve; if everyone broke
  promises, promising would be impossible; if everyone ignored drowning children,
  none would be saved. In each case the universalized world is the individual act
  writ large.


  I have begun to suspect that many contemporary cases break this picture. Consider
  a person who uses a navigation app to take a street whose real advantage depends
  on most other drivers not using it; if everyone took that shortcut, the shortcut
  would be slower than the road it avoids. Or someone who buys an asset because it
  is undervalued: if everyone followed the same rule, the mispricing would vanish
  and the act would no longer produce its intended benefit. Here the universalized
  world is not the act scaled up; it post-excludes the very feature the individual
  act relies on. The same structure appears with congestion, network effects, and
  tipping points.


