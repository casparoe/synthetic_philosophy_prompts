  is closed, where the bowl sits, what the terminals look like), to the cloud of shapes
  that fluent readers have learned to lump together. That view has real virtues: it
  explains why some glyphs look more ''a-ish'' than others, why a child can recognize
  near-illegible handwriting, why a single-storey ''a'' and a double-storey ''a''
  and an italic ''a'' don''t share any obvious image-level part, and why the boundary
  between ''a'' and other letters can smear (a heavy blackletter ''a'' can look like
  a ''u'', a loose script ''a'' can drift toward ''o''). It also unifies letter recognition
  with how we recognize faces, birds, every other category: no magic essences, just
  a similarity metric tuned by exposure.


  But I also have a firm intuition that won''t go away: that a type designer, when
  she makes a new ''a'', is not merely producing a new point near the ''a''-cloud—she''s
  solving for the same invariant, the same ''a-ness'', that every ''a'' expresses.
  The styles and weights are parameters on top of something constant. If the similarity
