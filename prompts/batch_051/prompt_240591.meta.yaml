  The core fact (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017): Suppose
  you have a risk score for some binary event (e.g., default, recidivism) across two
  groups with different base rates (prevalence). If the score is well-calibrated for
  each group — i.e., among people with score p, the event happens with probability
  p for both groups — then equalized false positive and false negative rates can''t
  both hold unless the model is perfect (or base rates equal). Actually the precise
  statement: calibration and equalized odds are compatible only if either the predictor
  is perfect (all predictions are 0 or 1 and always correct) or base rates are equal.
  More precisely, if a predictor is calibrated for both groups and satisfies equalized
  odds, then either base rates are equal or the predictor is "perfect" (achieves zero
  error). Let me recall.


  Chouldechova''s result: calibration and predictive parity (equal PPV) can coexist;
  but calibration and error-rate balance (equal FPR, FNR) cannot, unless the predictor
  is perfect or base rates equal. So an argument built on this:


  (1) A good risk score should be calibrated: for everyone who gets a score of, say,
  7, the rate of the predicted outcome is the same regardless of group. Otherwise
  the same number means different things for different people, which is misleading.


  (2) A fair risk score should be balanced: the false positive rate and false negative
  rate should be about the same across groups. Otherwise one group is being subjected
  to more mistaken predictions than another.


  (3) If groups differ in base rates — e.g., the outcome is genuinely more common
  in one group — then no imperfect score can satisfy both (1) and (2). The math forces
  a trade-off.


  (4) Base rates differ for almost every outcome people use scores for (loan repayment,
  rearrest, etc.).


  (5) So the fairness criteria can''t be jointly satisfied for almost every real application.
  But that seems to prove too much: it would mean either that nearly every real risk
  score is unfair, or that some standard fairness condition is quietly wrong. Where
  does the argument go wrong — or if it doesn''t, which premise do I give up and what
  does giving it up cost?


