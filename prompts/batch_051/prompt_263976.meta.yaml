  equivalence of games, etc. Wallace''s "The Emergent Multiverse" and "Decoherence
  and Ontology". Savage-style decision theory where acts are unitary operations and
  branches are consequences.

  - Sebens & Carroll: self-locating uncertainty + epistemic separability (ESP) → they
  argue an agent should be uncertain about which branch they''re in (despite knowing
  all branches exist) and assign probability |ψ|² via "self-locating uncertainty";
  the "Epistemic Separability Principle" says the probability one assigns to a branch
  shouldn''t depend on branches where the agent''s counterpart has a different...
