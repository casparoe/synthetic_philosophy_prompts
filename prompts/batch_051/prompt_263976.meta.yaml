  is given by the Born rule: probability = |amplitude|². But in many-worlds, all outcomes
  occur (in different branches); there''s no single outcome selected at random. So
  what do these probabilities mean? Why should an agent about to branch care more
  about (act as if more probable regarding) high-amplitude branches? The Born rule
  problem: derive or justify the Born rule / squared-amplitude measure from within
  the theory, without postulating it.


  Approaches:

  - Decision theory (Deutsch 1999, Wallace 2003, 2007, 2012): rationality axioms (non-problematic
  ones) force an Everettian agent to assign subjective probabilities/probabilistic
