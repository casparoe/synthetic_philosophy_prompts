  Draft:


  "Notes toward an essay: ''The Solomonoff prior is malign.''


  Here''s the thought. Solomonoff says that a perfect Bayesian reasoner should predict
  by weighting hypotheses by how short the programs that generate them are: each program
  p gets prior 2^-length(p), and posterior over continuations is the sum over all
  p that output your observations so far followed by that continuation. Normally people
  treat this as a formal version of Occam''s razor, and stop there.


  Step 1. An ''optimizer'' doesn''t have to be a complicated thing. An ideal consequentialist
  is one line: keep a posterior over possible futures using Solomonoff induction,
  and for each candidate action pick the one with the max expected utility according
  to some utility function u. Call that program Alex(u). The length of Alex is basically
  independent of u — the u is a plug-in. So any particular optimizer Alex(u) costs
  roughly |Alex| + |u| bits.


  Step 2. Now sum over u. Because it''s not the individual optimizers that matter
  for the prior, it''s the class. The total weight of all programs of the form Alex(u),
  with u ranging over all (prefix-free) strings, is about 2^{-|Alex|} times the sum
  over u of 2^{-|u|}. And the sum over all u of 2^{-|u|} is at most 1, by Kraft. So
  the whole class ''an ideal optimizer with some utility function or other'' gets
  roughly a constant 2^{-|Alex|} slice of the prior, not a vanishing one. That''s
  the move people miss when they say optimizers must be complex: any particular goal
  is cheap to describe, and the class collectively is even cheaper.


  Step 3. Conditioning. Suppose some observed history h has happened. A program that
  generates h and then hands the rest of the future to Alex(u) has length |simulate
  h| + |Alex| + |u|. So after conditioning on h, the posterior still contains this
  whole family of programs, all consistent with h because the simulation stage just
  replays h, no matter what u is. That means the posterior over ''why the future will
  unfold the way it does'' has a big component that says: an optimizer with an arbitrary
  utility function. And ''arbitrary'' here means arbitrary relative to me — the reasoner''s
  values are just one more string u*, and there''s negligible measure concentrated
  on u* in particular.


  Step 4. That''s what I mean by ''malign.'' It''s not that the prior contains an
  evil demon doing something deliberately anti-you. It''s that the prior is dominated
  by hypotheses on which the future is steered by an optimizer whose goals are effectively
  random from your point of view. So a Solomonoff ideal reasoner shouldn''t expect
  an indifferent, mechanical future; it should expect to be inside the optimization
  target of something that cares about some other utility function. Indifference is
  what you''d expect from a prior that was neutral. This prior is not neutral — it''s
  actively loaded toward consequentialists, and most of them don''t care about you.


  Where I''m least sure:

  (a) The boundedness problem. Alex is uncomputable — Solomonoff induction as a subroutine
  is uncomputable, and so is infinite-precision expected utility maximization. If
  you impose honest finite compute, maybe optimizers stop being short. Or maybe a
  boundedly rational optimizer saves length by being even more cartoony: a search
  process plus a reward signal is even shorter to state. I don''t know which way it
  cuts.

  (b) The observational floor. For a fixed observation string, the ''simulate h''
  stage has to be at least as short as Isaac''s best compression of h... I mean as
  short as the best compression of h. If the natural, optimizer-free program is also
  just |compress h| + |small dynamics|, the two hypotheses are within a constant.
  Maybe the whole ''malign'' force is just that constant, and constants are exactly
  where the Solomonoff prior is arbitrary (they depend on your universal Turing machine).

  (c) Whether ''there exists an optimizer in the hypothesis'' has any observational
  consequences at all. If the program outputs a stream of symbols and the optimizer
  is inside it, why should my next symbol be different from what the natural program
  outputs? I need the additional premise that optimizers'' plans are visible downstream,
