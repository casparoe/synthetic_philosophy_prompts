  did the way it seemed to him really change, or only his judgment?'' has no answer,
  because the quale was supposed to be private, intrinsic, and directly known, but
  nothing in the system tracks such a thing.


  Here''s the parallel. In a distributed system, if several processes write to a shared
  register without a global clock, the question ''what was the value at time t?''
  can be ill-posed. You can impose a linearization—a single fictional timeline in
  which each operation happened at some instant—and different ways of doing it give
  different but equally correct histories, as long as the ordering respects the operations
  that actually causally depend on one another. It seems to me Dennett is accusing
  qualia-realists of doing the same thing with consciousness: positing a single serial
  order of ''the way things seem'' when the underlying processing is distributed,
  asynchronous, and only gives dispositions and reports, with no privileged serialization.
  The stream of consciousness, on this reading, is a linearization that is read back
  into the system, not found there.


