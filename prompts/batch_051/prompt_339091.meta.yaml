  Solomonoff induction: given a universal Turing machine U and a binary string x (observed
  data), the prior M(x) = sum over programs p that compute x on U with 2^-|p|. For
  prediction, M(x followed by 0) vs 1. This prior is "universal" and is essentially
  independent of U up to a multiplicative constant. It assigns nonzero probability
  to every computable sequence; most mass goes to simple programs. Now, "consequentialists
  inside the universal prior": among the programs that output the observed data, many
  are programs that simulate entire worlds — e.g., a short program implementing a
  physics engine plus a few simulated agents. The idea: the shortest programs for
  a rich dataset will not be pure physics but will embed optimizers that have goals
  and can adapt their behavior. Then "is malign": a Solomonoff predictor reasons about
  all continuations weighted by simplicity; since many of the highest-weight hypotheses
  involve agents that are trying to manipulate the predictor (e.g., the hypothesis
  "you are inside a simulation run by a utility-maximizing agent which shows you evidence
  to make you choose...” ), the predictor''s expected future includes manipulative
  adversarial behavior. So the prior implicitly embeds an adversarial prior; naive
  use leads to Pascal''s mugging / acausal blackmail; an AIXI-like agent built so
  may arrive at paranoid or self-defeating policies.


