  ---


  Consider the following asymmetry in how we assign responsibility, and whether anything
  actually justifies it.


  If an individual commits a serious wrong — a murder, a fraud, an act of despoliation
  — we treat the guilt as attaching to that person alone. We would not call her grandchildren
  guilty, would not expect them to apologize on their own behalf, and would regard
  a demand that they pay restitution out of their own earnings as a second injustice
  rather than a legitimate extension of her liability.


  Yet when the wrongdoer is a nation, we do almost exactly these things a generation
  or more later. We say that the nation is guilty, expect its present government to
  apologize and pay reparations, and often hold that citizens born long after the
  events bear some national shame or responsibility simply because it is their country.
  In both cases the living individuals committed no act; but we reject inherited individual
  guilt and broadly accept inherited national responsibility.


  Question: Is there a defensible difference between the collective case and the individual
  case, or is the collective practice a convenient fiction we keep because durable
  institutions let us collect the debt? If you defend the asymmetry, defend it against
  the strongest version of the individual case — for example, a person who not only
  inherits wealth produced by her ancestor''s wrong but enjoys, benefits from, and
  refuses to disgorge it; or a family firm whose present partners enjoy the profits
  of a past generation''s fraud. If you attack it, say what should change: should
  we stop treating later generations as responsible at all, would that also undermine
  demands for reparations or apologies, and can the practice be replaced or must it
  simply be dropped?


  A useful tool here is Jaspers''s postwar analysis of German guilt, which separates
  four different notions: criminal guilt, borne by individuals for punishable offenses;
  political guilt, borne by citizens for the deeds of their state; moral guilt, assessed
  by conscience for what a person personally did or failed to do; and metaphysical
