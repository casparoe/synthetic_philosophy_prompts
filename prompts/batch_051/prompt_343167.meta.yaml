  discount rate but the jurisdiction. The present self contracts the boundary of who
  counts as me so that the future self bearing the consequences is now treated more
  like another person: its costs figure as claims to be weighed, not as losses of
  my own. The agent eats the dessert, not because health is valued less, but because
  the future self who would value it has been temporarily disenfranchised.


