  Let''s maybe streamline:


  "For some time I have been following a recurring dispute about how to judge Jefferson,
  Churchill, and Columbus, and I have begun to think that the two sides are no longer
  answering each other. The defenders argue that the only fair standard is whether
  a person saw and took the best moral options actually available within their own
  culture: Jefferson gets some credit for articulating universal rights while living
  amid slavery; Churchill''s wartime achievement need not be cancelled by an imperial
  mental world he inherited; Columbus should not be judged as if he had post-Enlightenment
  ideas about colonialism. The critics answer that this is circular, because the phrase
  man of his time hides a choice about which contemporaries get to define the time.
  There were contemporaries, they point out, who condemned slavery, forced conversion,
  and massacre; slavery and colonial expropriation were contested even as they were
  practiced. And they add that Jefferson is not helped but made worse by his own stated
  principles, because he had the relevant standard in hand and still violated it.
  What strikes me, though, is that neither side keeps the same standard across all
  three figures. The same defender who asks us to relativize Churchill''s views on
  race and empire will often cheer the critics'' point that Jefferson is accountable
  precisely because he wrote universalist principles while owning human beings, which
  is just the critics'' argument in another register. The same critic who condemns
  Columbus outright will often treat Churchill''s war leadership as a separate achievement
  rather than as one more item to be weighed on the same scale. My suspicion is that
  the participants are not having one disagreement but several, under a single name:
  a disagreement about what the agent could have known and chosen, a disagreement
  about whether moral judgment is blame or decision about admiration/commemoration,
  and a disagreement about how to handle mixed lives. My question is not who is right
  about Jefferson or Churchill. I want a diagnosis of the structure of the disagreement
  itself. Is it substantive, partly verbal, or several well-formed questions? If the
