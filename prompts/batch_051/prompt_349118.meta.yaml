  I am a retired natural scientist... During my career I was trained to think of time
  rather as physics does—as a coordinate in a four-dimensional structure, with the
  "now" having no privileged status. I have recently been reading the philosophical
  literature on presentism and eternalism, and I keep returning to J. M. E. McTaggart''s
  1908 paper "The Unreality of Time." In it he distinguishes what he calls the A series
  (positions running from far past through present to far future) from the B series
  (positions ordered only by earlier and later), and he argues—counterintuitively,
  from my training—that the A series is essential to time and that a view that keeps
  only the B series cannot give us genuine change. The passage that struck me is this:


  [quote]


  I want to use this passage as a lens for reading Kurt Vonnegut''s Slaughterhouse-Five.
  The Tralfamadorians, as I understand them, see all moments as permanently coexisting—something
  like the B series without a moving present—and Billy Pilgrim becomes "unstuck in
  time," experiencing his life in an order that has nothing to do with the sequence
  past-present-future. On the surface the novel seems to offer a kind of consolatory
  eternalism: death is only a bad moment among other moments, and "so it goes." But
  McTaggart''s paragraph above suggests a test: if a novel asks us to inhabit a B-series
  world without an A series, can it still show us real change, or does it only show
  a static arrangement of events being surveyed?


  I would like a careful reading of the novel through McTaggart''s argument. Where
  does Vonnegut''s narrative technique actually instantiate the lack of an A series,
  and where might it secretly depend on one (Billy''s passivity, the reader''s own
  sense of before and after, the historical sequence of Dresden)? Does the novel succeed
  in depicting a world of merely earlier/later relations, or does it show, perhaps
  against its own metaphysics, that something like passage or presentness keeps reasserting
  itself? And does this make Slaughterhouse-Five an argument for presentism, for eternalism,
  or—given McTaggart''s conclusion that both the A series and therefore time are unreal—for
  something stranger? I am less interested in biography or Vonnegut''s intentions
  than in what the text, read closely, does to the metaphysics and what the metaphysics
  does to the text. Please be willing to say where the reading breaks down.


  ---


