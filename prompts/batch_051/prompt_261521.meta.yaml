  Prompt draft:


  "I keep coming back to the claim in Nietzsche''s early essay on history — the one
  that distinguishes monumental, antiquarian, and critical history — that a certain
  kind of obsessive historical consciousness actually makes a person or a culture
  worse at acting: you start to feel like a latecomer, everything worth doing has
  already been done, and you get ironic and paralysed instead of spontaneous. The
  three modes are each supposed to be life-serving in one dosage and life-inhibiting
  in another: monumental history gives you models and the confidence to attempt great
  things, until it turns into delusion or makes present achievements look shabby;
  antiquarian history preserves and reveres a continuity, until it mummifies the present
  and hates anything new; critical history drags the past to a tribunal and frees
  you from it, until it leaves you rootless and unable to be anyone. I can steelman
  the distinction, but I want to know whether any of this is testable rather than
  just a pretty set of metaphors.


