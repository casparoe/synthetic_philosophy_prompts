  deal about Frege''s logic. Key points:

  - Aristotelian syllogistic analyzes propositions as subject-predicate: "S is P";
  all categorical propositions have a subject term and predicate term; quantifiers
  are tied to subject ("All S are P", "Some S are P", "No S are P", "Some S are not
  P").

  - Frege (Begriffsschrift 1879) replaced subject-predicate analysis with function-argument
  analysis. A predicate is a function from objects to truth-values (concept), and
  names/objects are arguments. "Caesar conquered Gaul" is analyzed as a function with
  two arguments, not subject-copula-predicate.

  - Frege introduced a quantifier that binds variables: "All men are mortal" becomes
  ∀x(Mx → Gx)? Actually "All men are mortal": ∀x(Mx ⊃ Fx) where Mx = x is a man, Fx
  = x is mortal. The quantifier isn''t attached to a subject term; it binds a variable
  ranging over objects, and the sentence decomposes into quantifier + open formula
  (function).

  - Relational/multiple generality: syllogistic can''t handle relations like "everyone
  loves someone" and the ambiguity ∀x∃y Lxy vs ∃y∀x Lxy. Frege''s nested quantifiers
  and function-argument can.

  - Identity, logical constants, truth-functional connectives (conditionality, negation)
  — Frege''s Begriffsschrift gave a full propositional logic with material conditional/negation.

  - Variables and quantifiers over functions too (second-order logic) in Begriffsschrift/Basic
  Laws.

