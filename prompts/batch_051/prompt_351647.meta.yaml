  Let''s draft prompt text:


  "Consider the following reconstruction of an argument for the mandatory moral bioenhancement
  of citizens, of the sort proposed by Ingmar Persson and Julian Savulescu. The argument
  runs as follows.


  (1) If there is a collective duty to prevent a foreseeable moral catastrophe, and
  safe, effective moral bioenhancement is the only feasible means of preventing it,
  then there is a duty to implement moral bioenhancement.

  (2) There is a collective duty of humanity to prevent foreseeable moral catastrophe,
  such as nuclear war or environmental collapse resulting from moral failures.

  (3) Safe, effective moral bioenhancement is the only feasible means of preventing
  such catastrophe.

  (4) Therefore, there is a duty to implement moral bioenhancement.

