  incorruptible person isn''t a saint; they''d be a monster, someone whose child can
  be threatened and whose health is crumbling and who doesn''t bend by an inch. Integrity,
  then, wouldn''t be having no corruption surface at all. It would be having the right
  pattern of corruptible and incorruptible currencies, plus knowing you''re own surface
  well enough to stay out of situations that press on it.


