  I''m a phil professor (mostly ethics and moral psychology) and I''ve been kicking
  around a view I call selective incorruptibility. The claim is that incorruptibility
  is never a property of a whole person; it''s always a property of a person-plus-currency
  pair. By a currency I mean a kind of pressure that can buy a bad act: cash, flattery,
  threats, fatigue, time pressure, hope of status, whatever. The judge who throws
  the bribe back in your face may still lean toward whichever lawyer makes her feel
  brilliant. The journalist who wouldn''t take a cent softens the piece to keep access
  to a source. The accountant who would never embezzle will sign off when his boss
  threatens his daughter. My positive view is that so-called incorruptible people
  aren''t uncorruptible; they''re just corruptible in currencies we don''t happen
  to probe, and we round that up to a character trait because we''ve only watched
  them in one kind of weather. I''ve even started telling my students: everyone is
  above being bought, for the right price, where ''price'' isn''t always money.


  There''s a normative corollary that''s maybe the part I find most attractive. If
  I''m right, the fully incorruptible person isn''t a saint; they''d be a monster,
  someone whose child can be threatened and whose health can crumble and who doesn''t
  bend an inch. The virtue, then, isn''t having no corruption surface at all, but
  having the right pattern of corruptible-vs-incorruptible currencies, and secondarily
  knowing your own surface well enough to stay out of situations that push on it.


