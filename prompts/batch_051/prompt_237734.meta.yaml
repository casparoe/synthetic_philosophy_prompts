  ---


  I teach a small epistemology seminar — about 16 undergrads, one 75-minute session
  — and next week we''re doing Williamson''s anti-luminosity argument and the KK principle.
  I want to run a game that makes them feel the force of the anti-luminosity argument
  before we name it: the idea that there are no sharp boundaries for how things seem
  to you, and that "if you know p then you know that you know p" runs into trouble
  when p is something like "that still looks blue to me."


  Design a classroom activity around a projected gradient — say 25 color patches going
  from obviously blue to obviously green, where each adjacent pair is almost impossible
  to tell apart. The core mechanic I''d like: everyone commits to a private cutoff
  ("the last patch that still looks blue"), and then a challenge phase where a challenger
  picks the pair straddling your cutoff, shuffles the two patches, and you have to
  sort them above chance for points. Make the incentives so that wagers are small,
  no real money, and players quickly learn that any sharp cutoff is a losing bet.


  Then I want a second-order version: after the challenges, have everyone place a
  second cutoff for "the last patch where I *know* it''s blue" (or the last patch
  where I''d say I know that I know), and run the same challenge. The payoff scheme
  should make the tension between their first-order and second-order cutoffs visible
  — e.g. points for consistency, but consistency combined with the challenge phase
  should land them in something like the anti-luminosity induction, where their cutoff
  gets pushed patch by patch to the end of the series.


  Please give me: full rules and materials (something a tired grad student can set
  up in ten minutes), a point scheme that doesn''t need money, a script for the debrief
  that maps exactly what happened in the game onto (i) luminosity, (ii) the reliability
  premise in the anti-luminosity argument, and (iii) the KK principle, plus a list
  of what will predictably go wrong the first time I run it and how to handle it.
  Be frank about which part of Williamson''s actual argument the color-patch game
  can''t reproduce and what I''ll have to supply by talk at the end — I want the game
  to do as much of the teaching as possible and the talking to do as little as possible.


