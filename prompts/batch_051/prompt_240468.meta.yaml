  Ergodicity economics: associated with Ole Peters (and Murray Gell-Mann earlier?).
  The core idea: in classical economics, expected value (ensemble average) is used
  to evaluate gambles, assuming ergodicity—that time averages and ensemble averages
  coincide. But many real processes are non-ergodic; for an individual repeatedly
  exposed to a multiplicative gamble, what matters is the time-average growth rate,
  not the ensemble mean. For multiplicative dynamics, the relevant quantity is the
  geometric mean / log-growth rate, not arithmetic mean. This explains why people
  rationally reject favorable-in-expectation gambles like betting a fraction of wealth
  on a coin flip with positive expected value—because repeated bets can lead ruin
  despite positive ensemble average. It reframes the St. Petersburg paradox, the equity
  premium puzzle, insurance, cooperation, etc. But careful: it doesn''t "refute expected
  utility theory" wholesale; it challenges the blanket use of ensemble averages and
  expected values for decision-making in non-ergodic contexts. It''s compatible with
  or a reinterpretation of expected utility for ergodic cases—Peters and Gell-Mann
  argue that in ergodic settings maximizing expected utility = maximizing time-average
  growth; in non-ergodic settings maximizing expected wealth can be wrong. Some economists
  argue it''s essentially a special case or a repackaging of known ideas (log utility/Kelly
  criterion, audit of dynamic inconsistency).


