  theory is simply false." Overstatement: it shows ensemble averages should not be
  applied uncritically to non-ergodic processes; expected utility itself isn''t refuted,
  but its domain/interpretation is qualified.

  2. "Because the processes are non-ergodic, the time average and the ensemble average
  must be different." Actually non-ergodicity means they can diverge, and extreme
  cases diverge, but not every non-ergodic process has them different for every observable
  / sample path; non-ergodicity is a property where time averages may differ or not
  exist. Slight conflation.

