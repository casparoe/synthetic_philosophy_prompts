  Let''s think about what would make for a deep answer. The prompt should demand:

  - What retributivism implies: proportional desert for 77 murders — likely multiple
  life sentences or death; 21 years seems grossly disproportionate; but retributivism
  has multiple forms (lex talionis; desert based on culpability; upper limit / state
  restraint). Some retributivists also argue that lengthy incapacitation via preventive
  detention based on future dangerousness is a separate instrumental question that
  doesn''t answer desert. A retributivist could say the punitive component is 21 years
  (insufficient) and the preventive component is not punishment but risk-management;
  the question is whether it''s justified as state coercion.

  - What consequentialism implies: deterrence, incapacitation, rehabilitation, cost.
  21 years + indefinite extension may be sufficient for incapacitation of a terrorist
  high-risk; deterrence? Maybe general deterrence doesn''t matter given he''s an ideologue;
  specific deterrence moot; rehabilitation unlikely but conditions could reduce grievance?
  Consequentialism might actually support the cushy conditions (reduce recidivism
  risk, maintain social norms, avoid martyrdom) but would demand careful empirical
  data on extension; the indefinite preventive detention is very consequentialist
  in structure (because it keys to dangerousness not desert).

