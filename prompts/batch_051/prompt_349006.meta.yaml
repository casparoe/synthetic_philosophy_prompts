  Here''s the setup. In the second epilogue of War and Peace, Tolstoy spends a lot
  of time attacking the idea that history is driven by great men and that historians
  can isolate the causes of big events. His view, roughly, is that what happens in
  history is the sum of an enormous number of tiny individual impulses, none of them
  individually decisive, and that attributing events to Napoleon''s ''orders'' is
  a retrospective illusion. He even presses a calculus analogy: just as you can''t
  get the integral from a single infinitesimal, you can''t explain 1812 from a few
  famous decisions. He''s also famously torn about free will and necessity—he wants
  to say history is determined by a vast web of causes, but he also wants to preserve
  something like human freedom, or at least our experience of it.


  Now the anachronistic part. Decades after Tolstoy died, chaos theory came along
  and gave a mathematically precise version of the old for-want-of-a-nail intuition:
  deterministic systems can be so sensitive to initial conditions that two nearly
  identical starting points diverge wildly, and long-term prediction becomes impossible
  in practice even though the system is fully law-governed. So the question I want
  you to answer is this: how would Tolstoy most likely have responded to chaos theory
  if he could have read it? Would he have treated it as a vindication of his critique
  of great-man history and his claim that tiny causes matter? Or would he have been
  suspicious of the whole project of modeling history as a deterministic dynamical
  system, even a chaotic one? Where exactly would the affinities be, and where would
  he push back? Try to be careful not to flatten him: the interesting answer will
  probably say he''d take some of it and resist some of it, for reasons internal to
  his actual views about science, law, and freedom.


