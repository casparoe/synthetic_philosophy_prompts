  prices. The argument presupposes that your credence in p is tied to the price you''d
  accept for a bet that pays $1 if p. This is the betting interpretation; a critic
  might say credences needn''t be reducible to betting dispositions.

  2. It assumes you''d take each bet individually because each is fair/good by your
  lights. It doesn''t assume you''d take them all as a package; in fact, one standard
  objection is that you might refuse the package if you saw it.

  3. Utility: The argument with money assumes linear value of money / risk neutrality
  in small stakes, or uses small stakes to sidestep decreasing marginal utility.

  4. The Dutch book theorem guarantees that incoherence → sure loss. The converse
  Dutch book theorem (de Finetti, proved more rigorously by Lehman, Kemeny, Shimony
  etc.) says coherence → no Dutch book, under suitable assumptions. So "once they''re
  coherent, no Dutch book can be made against you" is roughly established for static
  books, though the details matter (e.g., the bookie must not be able to exploit you
  in other ways, and there are limitations with infinite partitions).

  5. Dutch book arguments establish a coherence/synchronic requirement; they don''t
  establish diachronic constraints like conditionalization unless extended. But they
  don''t define rationality; avoiding sure loss is a minimal consistency condition,
  not sufficient for rationality (you can be coherent but have crazy credences, e.g.,
  certain of false things? Actually being certain of a false proposition isn''t probabilistically
  incoherent but may be epistemically irrational).

  6. The argument is often characterized as "pragmatic" because it concerns preferences/betting
  rather than accuracy; there are non-pragmatic alternatives (accuracy arguments,
  Joyce).


