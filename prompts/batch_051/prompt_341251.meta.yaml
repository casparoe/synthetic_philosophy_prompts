  Possible argument:


  (1) Under the doctrine of double effect, an act with a foreseen bad effect is permissible
  only if the bad effect is not intended, is not a means to the good effect, and is
  proportionate.

  (2) In any case where you knowingly bring about a person''s death, you can be described
  either as intending their death or as merely foreseeing it, depending on how you
  characterize your plan.

  (3) There is no fact of the matter about which characterization is correct, because
  intention is private and the agent can always sincerely adopt the characterization
  that makes the act permissible.

  (4) So DDE cannot distinguish permissible from impermissible killings: any killing
  can be licensed by describing the death as a merely foreseen side effect.

  (5) Therefore DDE either collapses into permissiveness (almost any killing can be
  justified) or into arbitrariness (the distinction does no work).

  (6) But DDE is meant to explain why diverting a trolley to kill one rather than
  five is permissible while pushing a large man off a bridge to stop the trolley is
  not.

  (7) So DDE cannot do the explanatory work it is supposed to do.


