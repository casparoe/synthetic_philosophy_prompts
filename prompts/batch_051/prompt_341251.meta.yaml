  Detailed content:


  - The doctrine of double effect (DDE) distinguishes intending harm from foreseeing
  harm; if you intend harm as a means or an end, act is wrong; if harm is only foreseen
  side effect and proportionate, permissible.

  - Common use: turning the trolley away from five onto one is permissible because
  the one''s death is foreseen but not intended; pushing the large man is not because
  his body is used as a means, so his injury/death is intended.

  - Friend''s argument: In the standard trolley case, if you decide to turn the trolley,
  the actual plan you adopt is: turn the trolley onto the side track. But you know
  that the side track contains a person. A plan is not merely a bare physical motion;
  it includes the foreseeable states of affairs that execute it. When you execute
  a plan, you intend not only the final goal but the means you have chosen, and a
  "means" includes whatever you knowingly bring about as part of the causal process
  that leads to the goal. You cannot intend to divert the trolley without intending
  the trolley to travel down the side track; and the trolley''s traveling down the
  side track just is, in this situation, the trolley''s running over the one person.
  So the one''s death is internal to the means, not a side effect. Therefore DDE forbids
  standard trolley.

  - Then extend: By the same reasoning, any case where the good outcome is achieved
  through a causal route that includes a known death involves intending that death
  as part of the means. So DDE would forbid not just pushing the man and the loop
  case but also standard trolley, and perhaps many ordinary risky actions where a
  known death is part of the causal story. This seems to prove too much because DDE
  was supposed to permit standard trolley and similar acts; if it cannot, then either
  DDE is false or it collapses into a very restrictive absolutism that few defenders
  accept.

  - Ask: Which step do you reject, and what does rejecting it cost? The asker wants
  to keep the distinction between standard trolley and transplant because it seems
  morally real, but cannot see how to block the argument without an ad hoc theory
  of "what is inside the plan."


