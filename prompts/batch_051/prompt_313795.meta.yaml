  Draft:


  "I would be grateful for a consistency audit of a set of commitments I find myself
  repeatedly drawn to in decision theory, specifically concerning ambiguity. I am
  inclined to hold all of the following:


  (a) I accept the Sure-Thing Principle and the broader Savage framework: rational
  preferences among acts can be represented as expected utility maximization relative
  to a single, finitely additive subjective probability and a cardinal utility function.

  (b) I accept a statewise dominance principle: if one act yields an outcome at least
  as good as another in every state and strictly better in at least one state, the
  first act should be preferred.

  (c) In Ellsberg''s single-urn problem—30 red balls and 60 black-or-yellow balls
  in unknown proportion—I strictly prefer a bet on red to a bet on black, and strictly
  prefer a bet on black-or-yellow to a bet on red-or-yellow; I am the person Ellsberg
  describes.

  (d) I do not think these Ellsberg preferences are a mistake to be trained away;
  I take ambiguity aversion to be a rational response to unknown proportions, and
  I would like a theory that vindicates it.

  (e) I also hold that in any well-posed decision problem every payoff-relevant event
  has a sharp, real-valued subjective probability, and that these probabilities are
  revealed in betting preferences.

  (f) Finally, I hold that information is never disvaluable: being offered costless
  information about a payoff-relevant event before acting cannot rationally make one
  worse off.


