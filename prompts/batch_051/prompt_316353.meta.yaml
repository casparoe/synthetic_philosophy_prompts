  Prompt:


  I find myself genuinely torn between a theory about testimony that has the shape
  of a sound epistemology and an intuition that refuses to disappear.


  The theory is reductionism about testimonial justification. It says that my justification
  for believing what someone tells me is never a sui generis social epistemic relation;
  it is always reducible to other, more basic sources: perception, memory, and inductive
  inference. When a stranger tells me the train leaves from platform four, I treat
  their utterance as evidence. I know from experience that people generally say things
  they take to be true, that utterances in this context are less likely to be lies,
  that my senses delivered certain noises, and so on. On this view, testimony is a
  kind of extension of ordinary empirical evidence. The theory is attractive because
  it keeps the inventory of fundamental epistemic sources small, gives a unified account
  of why testimony is defeasible, and explains how we can detect unreliable testifiers:
  by checking particular and general track records.


  But I also cannot shake the intuition that we do and should accept testimony in
  ways that outrun any such track record. Consider the child who believes what her
  parents tell her about the names of things before she has anything like a large
  sample of their reliability. Or the fact that if a complete stranger, with no apparent
  motive to deceive, tells me there has been an accident on the road ahead, I do not
  first assemble a frequency table of stranger-reports-about-accidents. Thomas Reid
  pressed something like this point against the reductionism of his day: he argued
  that we have a natural and original propensity to rely upon human testimony, implanted
  by God, and that it operates before we can give any reason for it. Even setting
  aside the theological framing, the intuitive core remains powerful: there seems
  to be a default entitlement to take another''s word, not merely a license to use
  their utterance as one more piece of data in an induction.


  I want a negotiated verdict, not a winner. What would it take for the reductionist
  theory to be amended so that it accommodates this default? Is there a reading of
  "reduction" on which the reduction holds at the level of ultimate justification
  but not at the level of our actual epistemic practice? What would it take for the
  intuition to be the thing that goes—for example, a demonstration that the child''s
  trust is an innate doxastic reflex without justificatory force, or that adult cases
  are explained entirely by rich background evidence we do not consciously notice?
  And if neither pure option survives, what is the most precise hybrid available?'
