  Where does it go wrong? The asker might say they want to reject the conclusion but
  can''t see which step. The subtle issues:

  - Premise (1) is empirical and may be false; some argue most wild lives are net
  positive or we can''t know.

  - Step (2)-(3) conflates destroying existing habitat (which kills currently living
  animals, often painfully, and destroys their future) with preventing future animals
  from coming into existence. Habitat destruction usually involves both; the argument
  counts only future lives and ignores the actual deaths it causes.

  - Step (3) uses an asymmetry between existence and non-existence; even if preventing
  a miserable life is good, it doesn''t follow that killing/starving existing animals
  is good.

  - Generalizing from one tract to all habitats ignores the possibility that some
  wild lives are worth living and that destroying a habitat might create worse conditions
  (survivors suffer more).

  - Also "best" from local case ignoring other harms (e.g., loss of biodiversity,
  ecosystem services) but those are result-consequentialist considerations.


