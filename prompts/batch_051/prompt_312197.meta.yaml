  is like using a stronger telescope to read a sign that was already there: the lens
  does not write the sign, it only lets you read it more accurately. So the method
  merely reveals preferences that are already ours; it makes no normative choices
  of its own, and that is what makes it legitimate. Audit this analogy the way you
  would audit the use of a scientific instrument. What plays the role of the sign,
  the telescope, the observer, the atmospheric distortion, and the improved instrument?
  Where does the mapping break down? Which features of reading a distant sign does
  the analogy quietly import into preference idealization that may not be there —
  for instance, that there is a single determinate sign, that it is independent of
  the instrument, that better instruments converge? Does her conclusion — that idealization
  is normatively neutral and merely revelatory — survive the disanalogies, and if
