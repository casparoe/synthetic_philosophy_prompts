  Assembly theory (AT) — developed by Leroy Cronin, Sara Walker, and colleagues. Key
  concepts:

  - Objects are built from elementary building blocks through recursive assembly steps.

  - Assembly index (AI): the minimal number of joining operations needed to construct
  an object from a set of basic units, allowing reuse of previously assembled sub-structures
  along the shortest path.

  - Copy number: abundance of an object. High assembly index + low copy number =>
  unlikely to arise by chance; high assembly index + high copy number => likely produced
  by selection/directed process (life). So combination (assembly index, copy number)
  is used as a biosignature.

  - Assembly = the total amount of selection necessary to produce an ensemble of objects,
  measuring casualty? (Actually "Assembly" is the joint quantity of copy number and
  assembly index?)

  - The theory is distinct from Kolmogorov complexity and Shannon entropy because
  assembly index is based on construction/being causally generated over time, not
  on description length or probability; also includes the object''s history / causal
  building process. Kolmogorov complexity measures shortest program, Shannon entropy
  measures randomness; neither directly tracks "complexity as a product of evolution/selection."
  Assembly theory posits time and memory as fundamental.

  - Application: molecules in the universe; molecules with high assembly index are
  likely from living processes; used in origins-of-life detection.


