  Consider two artificial agents that play a one-shot Prisoner''s Dilemma with each
  other. Before either chooses, each is given a formal description of the other''s
  source code, and each may condition its choice on that description. It is a familiar
  result that mutual cooperation can be an equilibrium here, not through repeated
