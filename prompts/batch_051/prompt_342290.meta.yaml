  Consider a one-shot Prisoner''s Dilemma between two artificial agents. Each agent''s
  choice is determined by a program. Before either agent chooses, each program is
  given a formal description of the other program, and each is allowed to condition
  its output on that description. Under these conditions, mutual cooperation can be
  a stable equilibrium without repetition, reputation, or external enforcement: a
  program can be written that cooperates exactly when it detects that the other program
  is the sort that will cooperate. Each side''s cooperation is conditional on the
  other''s, and the condition is satisfied. Call this the program-equilibrium explanation
  of cooperation.


  Two rival readings of this phenomenon are possible. On the first, the interaction
  is in an attenuated sense social: each agent can see that the other will cooperate,
  and they reach cooperation through something like mutual responsiveness or proto-agreement.
  On the second, the social vocabulary is a metaphor laid on top of a purely computational
  fact: each program is a function of the other''s code, and words like "see", "trust",
  and "agree" add nothing. I am inclined toward the second reading, but I do not want
  to decide the matter by temperament.


