  "In my philosophy elective this semester, we have been studying whether seeing an
  object is importantly different from seeing a picture of it. Our teacher gave us
  four criteria for when a person S literally sees an object O, rather than merely
  seeing a representation of O. (1) O must be part of the causal chain producing S''s
  current visual experience. (2) S''s visual experience must counterfactually track
  O''s visible properties: if O''s color, shape, or position changed, S''s experience
  would change correspondingly. (3) S''s experience must encode spatial information
  about O as seen from a standpoint — angle, distance, occlusion — rather than merely
  describing or symbolizing O. (4) The process connecting O to S''s experience must
  be ''belief-free'': no person''s interpretation, memory, or imagination may do the
  tracking, the way an artist''s mind does when making a sketch. The teacher used
  these criteria to distinguish seeing a deer in the yard from seeing a pencil sketch
  of that same deer: the sketch fails mainly on criterion 4. But then she said something
  several of us are still arguing about: that photographs, unlike paintings, satisfy
  the criteria well enough that when you look at one, you literally see the thing
  photographed, even if that thing no longer exists. I have been turning this over
  with the case of a photograph of my grandmother, who died when I was little. The
  photograph seems to pass criterion 1 (her reflected light caused the exposure),
  criterion 4 (the process was optical and chemical, not guided by anyone''s beliefs),
  and arguably criterion 3 (it preserves how she looked from a particular angle and
  distance). But criterion 2 seems to fail: nothing about her can change now, so my
  current experience cannot track her. If she were still alive and changed her hair
  today, the photograph would not change. And that failure captures, better than anything
  else, why looking at the photograph feels like seeing a record of her rather than
  seeing her.


  Please take the role of a professional philosopher of perception and work through
  this carefully. Go criterion by criterion for each of four cases: (a) seeing someone
  in a mirror; (b) seeing the hallway through a live video feed; (c) the old photograph
  of my grandmother; and (d) a hyperrealist painting made from life. For each case,
  commit to a verdict: do I literally see the object, or only a representation of
  it? Then address the main question head-on: does the photograph show that the four
  criteria need to be revised or supplemented — for instance, by adding a real-time
  condition, or by allowing the counterfactual condition to be satisfied at the moment
  the image was made rather than now? State which revision you actually endorse and
  why, and test it against all four cases so it does not merely rig the result. Please
  give your answer in American English."


