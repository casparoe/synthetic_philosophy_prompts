  Let me formulate: An argument that life-permitting constants cannot confirm design:


  (1) We can only observe a universe in which the constants permit life, regardless
  of which hypothesis is true.

  (2) An observation that is guaranteed under every live hypothesis cannot discriminate
  between those hypotheses.

  (3) Our observation that the constants permit life is guaranteed under every live
  hypothesis (by (1)).

  (4) So our observation cannot discriminate between design and the alternatives.

  (5) Therefore the fine-tuning of the constants is not evidence for design.


