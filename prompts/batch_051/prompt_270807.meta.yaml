  that we need the concept of rights as a fundamental moral category." This is a standard
  move but the conclusion only follows from the accurate parts if the instrumental
  view is the only alternative; there are other anti-consequentialist positions or
  non-fundamental rights. The prompt asks to assess whether conclusion follows.


