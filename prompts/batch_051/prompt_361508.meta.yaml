  But wait, there''s a subtle issue: The Church-Turing thesis states every effectively
  calculable function is Turing-computable. It doesn''t say any effective procedure
  can be implemented on a physical digital computer — that''s the physical CT thesis,
  and also digital computers may not exhaust "effectively computable" (yes they do,
  by equivalence, but only if implemented correctly; in practice resource limits).
  My prompt should accurately state distinction. I should be careful not to attribute
  a false claim to the asker as obviously correct. The asker''s colleague points out
  the confusion; the asker reports their own policy. The prompt can contain inaccuracies
  as part of the person''s habit, but the answer should assess. I want the prompt
  to be coherent: the asker uses CT to settle that any effective procedure can be
  implemented on a digital computer. Actually CT says every effectively computable
  function is computable by a Turing machine. In practice, "ordinary digital computer"
  approximates a Turing machine only modulo finite memory. But for unbounded algorithms,
  the Church-Turing thesis licenses the standard equivalence. It''s fine.


