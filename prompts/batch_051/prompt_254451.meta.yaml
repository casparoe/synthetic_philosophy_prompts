  the dollar. The second-highest bidder also pays their final bid but receives nothing.
  So if you''re the second-highest bidder and you drop out, you still pay your last
  bid and get nothing. That''s the trap: you''re already committed to pay; but you
  could become the highest bidder by bidding a bit more, thereby getting the dollar
  and turning a guaranteed loss into possibly a smaller loss or gain.


