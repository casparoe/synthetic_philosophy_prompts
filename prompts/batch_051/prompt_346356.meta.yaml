  Let me design a coherent logical space.


  Question dimensions in ethics of belief:

  1. Is it ever permissible to believe p on evidence insufficient for p? (Clifford:
  no; James: yes under certain conditions (genuine option); pragmatists: yes more
  broadly; fideists: yes, faith.)

  2. Do we have direct voluntary control over belief? (doxastic voluntarism vs involuntarism.)
  This affects whether "ought implies can" critique applies to Clifford''s "thou shalt
  not believe without sufficient evidence". If involuntarism true, direct duty to
  believe may be odd; instead duties concern evidence-gathering.

  3. Does belief''s justification depend only on evidence or also on practical/moral
  consequences? (Evidentialism vs pragmatism.)

  4. Are there two cognitive attitudes — belief and acceptance (or assumption) — such
  that one can accept for practical reasons while believing only on evidence? (This
  is a refinement: pragmatic reasons justify acceptance, not belief.)

  5. Could "sufficient evidence" threshold vary with stakes? (contextualism/stakes-sensitive
  evidentialism?)

  6. Is there a special category of "faith" that is not ordinary belief? (fideism
  vs James? James sometimes thought faith as a passional commitment.)


  A decision tree might ask:

  - Start: May a person ever hold a belief on evidence they know is insufficient?
  If no → strict evidentialist cluster → but ask: can evidence-gathering be influenced
  by practical factors? If yes → indirect evidentialism; if no → pure Cliffordian.
  If yes to first question → ask under what conditions.

  - If yes: Is permissibility limited to forced, live, momentous options? If yes →
  Jamesian permissivism. If no, permissibility broader.

  - If broader: Is it because practical benefits can directly justify belief, not
  just acceptance? If direct → pragmatism. If only acceptance can be pragmatically
  justified, belief stays evidence-governed → "acceptance-based pragmatism"/two-attitude
  view. If it''s because faith is its own source of reasons → fideism.

  - If maybe doxastic involuntarism: "Do we even have control over belief?" If involuntarist,
  then norms target inquiry/intellectual character rather than individual beliefs
  → "doxastic involuntarist ethics" or "intellectual character view" (virtue epistemology?).
  This can be a cross-cutting position; tree must flag that it can''t separate from
  others cleanly.


