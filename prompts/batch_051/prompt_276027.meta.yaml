  Let me write the dialogue with rounds:


  Round 1:

  Jonah: When two people are both partly in the wrong? No wait — when two people have
  conflicting value systems, a compromise can be perfectly justified as a trade: each
  gives ground where their values are less intensely held, and gets ground where their
  values are more intensely held. Both are better off by their own lights. Refusing
  such a trade isn''t principled, it''s just costly.


  Priya: That treats value systems like tastes. A value system isn''t a bundle of
  appetites you can trade at the margin; it tells you what you owe, what''s wrong,
  what''s non-negotiable. If I believe X is wrong, I don''t have an "intensity" of
  belief that I can swap for your not doing Y. The whole point of a moral commitment
  is to remove some things from barter.


  Jonah: That''s too fast. Even people with non-negotiable commitments trade at the
  edges all the time. A pacifist may still cooperate on a bill that funds both a violence-prevention
  program she cares about and the military, because the package is better than the
  alternative. She''s not treating violence as negotiable; she''s trading on separate
  dimensions.


  Priya: But that''s just because politics forces tragic choices. Describing it as
  "gain from trade" makes it sound like everyone gets richer morally. In reality,
  someone who votes for the military budget she thinks is murder has done something
  wrong on her own view. The package may be better than losing, but that doesn''t
  make the compromise right — it makes it the lesser evil. Trading hasn''t laundered
  the wrong.


  That''s round 1. Good.


  Round 2 (Jonah responds):

  Jonah: Lesser evil is just a name you give to the trade when you''re unhappy about
  it, but it''s still a trade. And in the stronger case — where each side genuinely
  considers the other''s concern weighty at some level, just less weighty than its
  own — the compromise can be strictly better than no agreement, not just less bad.
  You don''t need a shared moral scale across people; each person evaluates the compromise
  from inside her own system. If Lena and Ravi both prefer the compromise to the status
  quo by their own rankings, why isn''t it legitimate?


  Priya: Because "each prefers it" is not the standard of legitimacy. Suppose the
  status quo is a stalemate where nothing gets done, and both sides are frustrated.
  Each side might "prefer" to let the other do a wrong on a small scale in exchange
  for a small good, while the net effect for third parties is worse. Or worse, the
  trade might just redistribute complicity: you get to feel clean because the rule
  is plant-based, while I get my meat once a month, and we''ve both purchased peace
  of mind at the expense of consistency. A Pareto improvement in two people''s moral
  satisfaction doesn''t track what''s actually right.


  Jonah: But if you reject the inside-evaluation standard, what do you propose? A
  neutral, third-person moral standard that decides which value system is right? Either
  there is such a standard, in which case you don''t need compromise — just adopt
  the correct view — or there isn''t, and then the only thing two people with different
  systems can do is bargain for an outcome each can live with. Gains-from-trade reasoning
  is just noticing that bargaining can be set up so both do better.


  Priya: There''s a third option: maintain the disagreement and don''t jointly adopt
  a common plan — sometimes the right response is not to bargain. Splitting the difference
  isn''t virtuous just because it''s available.


  Round 3:

  Jonah: But "don''t adopt a common plan" is often not available, or it''s a plan
  itself — keep the status quo or let someone else decide. And when a common plan
  is unavoidable, you should prefer the plan that each side''s own values rank higher.
  Otherwise, you''re preferring a world that is worse for everyone by the standards
  they actually hold, in the service of... what exactly?


  Priya: You could be serving the distinction between what a person does and what
  a policy does. In the co-op case, Lena can consistently remain a vegan while the
  house has a rule she voted against; she isn''t complicit in the meat meal if she''s
  on record opposing it and doesn''t pay into it. But in the kind of compromise you''re
  praising, each side actively co-owns the mixed policy, and therefore co-owns the
  part it thinks is wrong. That changes what she is responsible for. What the gains-from-trade
  model misses is that joint commitment has an expressive and agential cost above
  and beyond the outcomes.


  Jonah: That''s precisely the point. The compromise is a joint commitment, so no
  one is morally laundering anything. By agreeing to the rule, Lena does come to own
  the one exception, and Ravi comes to own the plant-based default. Each is accountable
  for the whole package. But they each judge the whole package better, given the alternative,
  than no agreement. Accountability isn''t altered any more than it is when any parliamentarian
  votes for an omnibus bill with bad clauses to get good ones. If that''s "selling
  out," then all coalition politics is selling out.


