  some clauses are load-bearing for a moral identity. A compromise over those can''t
  be redeemed by gains on another clause, because the system doesn''t aggregate across
  those kinds of goods. The gains-from-trade picture is only available when the parties
  already share enough structure to rank outcomes along the relevant dimensions. Between
  deep value systems, that commensurability is exactly what''s in question, not something
  you can assume.


