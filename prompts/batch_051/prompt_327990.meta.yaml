  Potential prompt:


  "In Anarchical Fallacies, his word-by-word examination of the French Declaration
  of the Rights of Man, Jeremy Bentham advances the view that a right can be made
  intelligible only by showing which legal obligation creates it and which enforcing
  power stands behind that obligation. He summarises the position in the passage where
  he contrasts real rights, which come from real laws, with imaginary rights, which
  come from imaginary laws, and then pronounces natural rights to be nonsense, with
  imprescriptible natural rights something still worse.


  Now suppose a common-law jurisdiction decided to put that passage into institutional
  practice. A new parliamentary standing order provides that no bill may use the word
  ''right'' unless the accompanying explanatory memorandum identifies, for every such
  use: (a) the specific duty-bearer or class of duty-bearers, (b) the conduct that
  would constitute a breach, (c) the body that would hear a complaint, and (d) the
  remedy available. Rights language in statutes is no longer given interpretive weight
  unless these four items are present; and courts may not cite a treaty or human-rights
  instrument as the source of a right unless the same test is met.


  Analyse this mechanism as a mechanism, not as a moral stance. What would it incentivise
  among legislators, judges, executive agencies, and litigants? How could the system
  be gamed while preserving the official form of the four-part test? Which rights
  claims—economic, procedural, privacy-related, environmental, cultural—would become
  easier or harder to enact and enforce, and why? Where would the first-order effects
  be difficult to distinguish from the second-order effects? Finally, what would a
  jurisdiction learn about Bentham''s passage from operating this rule for twenty
  years, and which empirical outcomes would most undermine the underlying principle?"


