  hangul, which encodes sub-phonemic articulatory features but arranges them into
  syllable blocks; (4) English spelling, which is notoriously morphophonemic, preserving
  constant spelling of roots like sign/signal even when pronunciation shifts; (5)
  Arabic abjad, which encodes consonants primarily and leaves most vowels to context;
  (6) Devanagari abugida, where each consonant letter carries an inherent vowel and
  diacritics mark vowel changes; (7) Cherokee syllabary, which encodes syllables (mostly
  CV) rather than phonemes. I want one more that is genuinely different in the kind
