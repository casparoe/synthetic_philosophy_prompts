  (3) Korean hangul, which encodes sub-phonemic articulatory features but arranges
  them into syllable blocks.

  (4) English spelling, which is morphophonemic: sign/signal keep the same root spelling
  even though pronunciation shifts.

  (5) Arabic abjad, which encodes consonants primarily and leaves vowels mostly to
  context.

  (6) Devanagari abugida, where consonant letters carry an inherent vowel and vowel
