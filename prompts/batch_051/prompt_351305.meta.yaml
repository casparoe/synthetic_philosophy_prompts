  - Substrate independence / multiple realizability: if mental states are computational,
  any physical system running the same computation has the same mind. So what matters
  is the computation, not the biological implementation.

  - The "attribution problem": to which computations does moral status attach? Consider
  a simulation of a brain; if you run it multiple times, instantiate copies, pause/resume,
  branch, or optimize? Which instances are experience-bearing? Are two identical runs
  one mind instantiated twice (type of experience) or two distinct patients?

  - The boundary problem: computations are nested and overlapping; if a big computation
  is conscious, is a small part of it conscious? If a computation implements a mind,
  everything above (the OS, the data center) might trivially implement it too (pancomputationalism
  / implementation problem).

  - The "counting problem": how many subjects of experience are there when computations
  overlap or are duplicated?

  - "Computational sentience" and "digital suffering": the view that training large
  models could create suffering if they implement the right causal structure; hence
  "AI welfare."

  - There''s a live debate about "moral patienthood of simulations", e.g., when we
  simulate neurons or virtual agents, is that creating pain? Ethical concerns about
  running simulations of suffering.


