  I''m a PhD student in philosophy of science, and I''ve been trying to get clear
  about which predicates are projectible: which of the regularities we''ve observed
  so far can rationally be extended to unobserved cases. I do not mean the global
  skeptical question whether induction can be justified at all; take it as settled
  for present purposes that some inductive projections are rationally permissible
  and others are not. What I want is the principle that sorts them.


  Here are four cases with my verdicts, all framed with the present before 2050.


  1. Every emerald that has ever been examined has been green. I infer that emeralds
  examined in future will be green. I accept this.


  2. Define "grue" as: green if first examined before 2050, and blue if first examined
  after 2050. Every emerald examined so far has been grue, because all examined emeralds
  were examined before 2050 and were green. I infer that emeralds first examined after
  2050 will be grue, hence blue. I reject this, even though the evidence for it is
  extensionally identical to the evidence in (1).


  3. A laboratory manufactures test crystals containing a compound that irreversibly
  degrades in 2049; when tested before 2050 the crystals yield a green reading, and
  when tested after 2050 the same test yields a blue reading. Define "chromic" as:
