  The aggregation problem: In ethics, especially after Scanlon''s *What We Owe to
  Each Other* (1998), the question is whether we can justify harming one person by
  aggregating small benefits to many others. Scanlon''s contractualism holds that
  an act is wrong if any principle permitting it could be reasonably rejected by someone;
  principles must be justifiable to each individual. This seems to rule out aggregation:
  a person can reasonably reject a principle that lets others'' small gains outweigh
  their serious loss. Classic counterexamples: the world-cup final case? The "tiny
  risk" cases — e.g., Scanlon discusses a case where a principle would allow imposing
  a tiny risk of harm on each person for a great benefit; he argues individuals can
  reasonably reject some principles... Actually Scanlon has a complex discussion (I
  should be careful not to misstate details).


  The practice angle: rescue and identified vs. statistical lives. Society is willing
  to spend much more to save an identified, named person in immediate peril (miner
  trapped, child fallen down a well) than on measures that save "statistical lives"
  (e.g., highway safety improvements, air pollution regulation). This creates an apparent
  inconsistency: we value lives wildly differently depending on identifiability. The
  practice presupposes something like: a life is not a fungible quantity; our reasons
  are agent-relative and responsive to particular individuals in concrete relationships;
  or it presupposes that value attaches to the sustained individual, not to the aggregate;
  or it presupposes a deontic constraint against abandoning identifiable persons while
  permitting risk imposition on the unidentifiable. It fits a non-aggregative, person-centered
  view. But it might also be explained by cognitive biases (identifiability effect),
  reputation, etc.


  What does the practice strictly presuppose? The Rule of Rescue operates as if the
  relevant unit of moral concern is the particular person, not a quality-adjusted
  life-year sum. It matters whether a harm can be assigned to a nameable victim. It
  tacitly treats benefiting an identified person as lexically more weighty, which
  is hard to justify if lives are commensurable units of welfare. Under Scanlon''s
  individualist constraint (justifiability to each), spending on identified rescue
  might be okay, but ignoring statistical deaths might fail justifiability to those
  anonymous individuals — Scanlon would say we can''t ignore them just because they''re
  statistical; each future victim could reasonably reject. So the practice is in tension
  with both utilitarianism and Scanlon''s contractualism, in different ways. Under
  a straightforwardly aggregative utilitarian view, we''d spend on the cheapest deaths
  prevented, including statistical ones, and largely stop the dramatic rescues; under
  a strict person-centered anti-aggregation view, we''d have to explain why the anonymous
  future person''s claim is weaker than the identified one''s — which looks like a
  bias, not a principle. The practice might be philosophically underdetermined: several
  views could license parts of it (virtue ethics, care ethics, deontology, rule-utilitarianism
  with robust rules), but the overall pattern is hard to render coherent.


