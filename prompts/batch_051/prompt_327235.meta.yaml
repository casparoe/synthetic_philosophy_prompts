  by N and would occur whether or not Q were present, so the judgment''s truth cannot
  be credited to the subject''s epistemic competence. Your job is to build the case
  so that this objection fails on its own terms, without denying the epiphenomenalism.
  Do not do this by stipulating that the judgment is reliably caused, by introducing
  a second causal pathway from Q, or by smuggling in a perfect correlation that has
  no basis in the story.


  After presenting the scenario, please provide the following:

  1. State the judgment, the putative quale Q, the underlying state N, and the full
  causal chain leading from N to the judgment.

  2. Give the exact psychophysical relation between N and Q in the case, and explain
