  a reliabilist account, even though Q is causally inert.

  4. Identify the structural feature of the case that does the work — precisely what
  stops the truth of the judgment from being a coincidence.

  5. Say what happens if that feature is removed: does the case collapse back into
  the standard paradox, and why?

  6. Finally, give the strongest reply available to a defender of the paradox, and
  say whether the case can survive it.


