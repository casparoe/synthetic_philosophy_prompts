  legislators accumulate is mostly skill at fundraising, working a room of donors,
  and getting re-elected. A randomly selected body at least wouldn''t have to spend
  half its time begging for money, and it would actually look like the population
  instead of a convention of lawyers and small-business owners.


  (3) M: But elections create accountability. If I don''t like what my representative
  did, I can vote them out. A sortitioned citizen serves for a year or two and then
  goes back to their job; they never face the voters, so there''s no check on laziness
  or corruption. Take away re-election and you take away the only discipline politicians
  have.


  (4) R: The accountability is mostly theoretical. Voters choose on party label, name
  recognition, and two or three issues; they rarely punish someone for a bad committee
  vote they''ve never heard of. Meanwhile a career politician is permanently accountable
  to donors and only intermittently to the public. A citizens'' assembly is accountable
  differently — to its other members, and to the public through published reasons
  for its decisions.


  (5) M: But term limits show what happens when you rotate amateurs through. After
  term limits, power just flows to the permanent staff, the lobbyists, and the governor''s
  office, because they''re the only ones who know how the place works. At least a
  career politician has institutional memory and can be investigated by journalists.


  (6) R: That''s an objection to term limits, not to sortition. Sortition doesn''t
  just drop amateurs into the existing machine and leave the machine unchanged; it
  changes who writes the rules. And where it''s been tried — the Irish Citizens''
  Assembly and the convention that preceded it — ordinary citizens handled genuinely
