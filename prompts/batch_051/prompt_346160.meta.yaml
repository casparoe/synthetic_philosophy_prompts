  Argument idea around unilateral deploy:


  Context: any one of N engineers can merge to main and push to prod unilaterally.
  A change is either good (fix, feature) or bad (breaks prod). Each engineer has their
  own judgment with some error rate. The group as a whole would be better off if a
  change ships only when the pooled evidence would support it. But each engineer,
  acting alone, may merge based on their own threshold.


  The "too much" conclusion: from a seemingly sensible rule about individual action,
  we get that no one should ever take any risky unilateral action unless they''re
  certain — or that we must give one person veto power, or that all independent judgment
  should be suppressed in favor of the group''s most conservative member.


  Let me write the argument in numbered premises:


  1. If you''re part of a group where anyone can act alone, and you have good reason
  to think the group as a whole would not want the action taken, then you shouldn''t
  take it. [Seems plausible: you shouldn''t do what the group would collectively reject.]

  2. For any member of the group, you can almost always find some member (or some
  possible pooled judgment) that would be more cautious than you. Actually not always.

  3. In a risky unilateral action, the fact that the group''s aggregate behavior is
  triggered by the most optimistic member''s estimate means the group acts whenever
  the maximum of the individual estimates crosses the threshold, while the group''s
  true expected value maybe based on average; by extreme value theory, the maximum
  is systematically biased upward. Therefore for any individual, if you act, you''re
  probably acting because you''re just the tail of the distribution — i.e., the lucky
  optimist. So your own judgment shouldn''t be trusted.

  4. Therefore whenever you think a unilateral action is net-positive, that very thought
  is evidence that you''re just the person with an overoptimistic estimate; so you
  should defer to the group and not act unless everyone (or a supermajority) agrees.

  5. Therefore no one should ever use unilateral authority in any risky collective
  context.

  Conclusion: that would mean no engineer should ever merge without unanimous review,
  no one should blow the whistle unilaterally, etc., which is crazy. Where does it
  go wrong?


