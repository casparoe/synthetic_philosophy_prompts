  I''m a neuro PhD student working on a short essay about epiphenomenalism and the
  paradox of phenomenal judgment, and I''d appreciate comments on the idea before
  I send it anywhere. The essay is built around a passage in T. H. Huxley''s "On the
  Hypothesis that Animals are Automata" where he says consciousness bears the same
  relation to brain activity as a steam-whistle to a locomotive engine: the whistle
  accompanies the engine''s workings but does not drive them. I''m not going to put
  that in quotes because I''m working from memory and don''t want to misquote, but
  that''s the image.


  My argument in compressed form: The usual objection to epiphenomenalism is that
  if phenomenal states have no causal powers, then my judgments about phenomenal states
  can''t be caused by them, and so my saying "I''m in pain" is not really about pain.
  I think that objection conflates two senses of aboutness. A judgment can be causally
  about a state by being produced by the neural correlate of that state, even if the
  phenomenal property itself does no causal work. Huxley''s steam-whistle is the right
  picture: the whistle doesn''t move the train, but it reliably correlates with boiler
  pressure, so a mechanism that says "the whistle is blowing" is about the pressure
  in the information-carrying sense even though the pressure isn''t a cause of the
  mechanism''s output. Maybe the same goes for phenomenal judgment. The physical process
  does the causing; the phenomenal state does the "being signified" via the correlate.


  My worry is that this might just move the bump under the rug. If someone asks why
  the judgment picks out the phenomenal property rather than, say, the physical correlate
  or some external stimulus, I think I can say: it picks out the state whose relevant
  causal powers are instantiated in the physical correlate, and that includes the
  phenomenal state''s neural basis. But I''m not sure whether "picks out" is doing
  too much work. Also I worry that the steam-whistle analogy is the wrong one for
  cases where the judgment seems to be about the feeling''s presented quality, not
  its functional role, and aboutness is supposed to explain that.


  Could you give me comments on the essay, especially: (1) is the move from correlation
  to aboutness as clean as I''m hoping, or does it smuggle in a representational mind
  that epiphenomenalism hasn''t earned; (2) where in the reasoning am I most likely
  to be fooling myself, and what specific argument or consideration would make me
  abandon the whole idea; and (3) does the piece read as interesting to people who
  know the epiphenomenalism literature, or is it just reheating a standard identity-theory
  response. American English please. Apologies for any typos.


