  But actually philosophers distinguish:

  - Incommensurability: values cannot be measured on a single cardinal scale. But
  ordinal comparison may still be possible. You can judge one better without quantifying
  by how much.

  - Incomparability: no positive comparative relation holds (neither better, nor worse,
  nor equal).

  - Parity (Ruth Chang): a fourth relation, "on a par", where items are comparable
  though not trichotomously rankable; you can be rationally required to choose but
  not required to choose one over the other.

  - Hard choices: often the options are on a par, and rational resolution may involve
  committing (placing value through choice), not discovering a pre-existing balance.


