  ---


  You are advising a private foundation that has committed roughly six researcher-years
  — say, two postdoctoral researchers for three years — to foundational work on indirect
  normativity. By indirect normativity I mean the family of views on which at least
  part of what we ought to value, want, or do is fixed not by our actual judgments
  but by what we would value, want, or endorse after some specified idealization:
  full information, vivid appreciation of consequences, freedom from bias and time
  pressure, coherence of preferences, becoming "the people we wish we were," or a
  long-run process of open-ended reflection. The foundation funds philosophy and formal
  theory, not surveys, experiments, or policy implementation.


  The program officer wants a defensible research agenda rather than a survey of the
  area. She is deciding among the following candidate lines of work (add one or two
  of your own if you think something more important is missing):


  1. The underdetermination problem. Counterfactuals about what an idealized version
  of us would endorse are radically underdetermined: which information is added, in
  what order, represented in what way, starting from which actual attitudes — each
  choice can change the endpoint. Is this underdetermination fatal? Or can it be absorbed
  by treating the idealization procedure itself as part of the normative standard,
  so that different procedures simply define different standards?


  2. The authority problem. An idealized counterpart is in important respects a different
  agent. Why should its verdicts bind us? Deference to the ideal can look like alienation,
  or like allowing a hypothetical being to vote in our place. The problem sharpens
  when we move from one person to many: whose idealization — each individual''s, a
  collective''s, future generations'', all sentient beings'' — and how do those verdicts
  aggregate without re-importing an unidealized decision procedure?


  3. The path-dependence problem. Idealization is a process, and the route matters.
  If starting points or order of revisions change the endpoint, there may be no well-defined
  limit of ideal deliberation at all — only an attractor landscape with basins, cycles,
  or non-convergence. When does the process have a unique fixed point, and what should
  the theory say when it does not?


  4. The reflexivity problem. The choice of idealization procedure is itself a normative
  choice. Would we choose this procedure under ideal conditions? What idealizes the
  idealizer? Any answer seems to invite a regress, and the natural way to stop it
  — finding a fixed point of the procedure applied to itself — may be non-unique,
  empty, or unreasonably self-endorsing.


  5. The residue problem. Even a fully specified procedure carries substantive commitments
  in its design: which cognitive defects count as biases, whether impartiality is
  demanded, whether the currency is preferences or values. Can a procedural standard
  be specified without smuggling in the conclusions it is meant to generate — and
  if not, is the residue a bug or the honest price of doing normative theory?


  The program officer does not want a reading list or an annotated bibliography. She
  wants your defended judgment about which of these (or other) problems should be
  worked on first, and why. For each line of work you prioritize, state: (i) why it
  is upstream of the others — which further questions depend on settling it, and which
  downstream proposals for specifying values indirectly would change most if it were
  settled one way rather than another; (ii) how tractable it is with the tools people
  in this field actually have — decision theory, formal epistemology, philosophy of
  action, moral psychology — as opposed to requiring unavailable formal machinery;
  and (iii) what concrete result or development over the next two years would move
  it up or down in your ranking. Finally, give the portfolio: how you would allocate
  the six researcher-years, what you hope each funded project would establish, and
  what budget or deadline change would make you reallocate first. Defend the trade-offs
  among importance, tractability, and neglectedness explicitly.


