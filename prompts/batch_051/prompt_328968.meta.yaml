  system ''is intelligent'' — a yes/no or single-score question — we should ask how
  quickly it converts relevant experience into reusable competence on problems it
  has not been directly prepared for. Intelligence, on this view, is a property of
  a learning trajectory, not of a current state. A chess position the machine evaluates
  perfectly, or a list of answers a student has memorized, is competence; the intelligent
  thing is the change between ''could not handle this kind of problem'' and ''can
  reliably handle new instances of it.'' Call this the trajectory view.


  The essay would develop four claims:

  (1) A competence/intelligence distinction dissolves the problem of tests that can
  be passed by memorization. The memorizer starts competent, so a single score cannot
  show intelligence; only improvement on tasks whose format could not have been pre-stored
  counts.

  (2) The view gives a unified way to handle very different cases. A pocket calculator
  and a lookup table are extremely competent but do not improve with exposure, so
  the view denies them intelligence. A novice who starts behind but improves steeply
  on novel problems is intelligent even if, at the end, a rote performer still outscores
  them. (I plan to use a two-students-in-calculus example: one begins ahead but gains
  little on genuinely new problem types; the other begins behind but improves steeply.
  By the final test the first still has the higher score.)

