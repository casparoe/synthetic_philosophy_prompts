  score measure intelligence?'' but whether the score is mostly a state measurement
  or a change measurement, and whether the instrument ever includes a phase controlled
  enough to separate the two.

  (4) The view makes some fixed capacities, like working memory or reaction speed,
  count only indirectly: they are resources that may or may not enable steeper learning,
  but on their own they are not intelligence.


