  Actually the key tradeoffs of subsidiarity/theory of fiscal federalism:

  - Local knowledge/heterogeneity favors decentralization.

  - Economies of scale favor centralization.

  - Externalities favor centralization.

  - Exit/mobility (Tiebout), yardstick competition favor decentralization.

  - Risk of capture: local elites may capture local government.


  A game can make participants feel these by having them decide which powers to assign
  to which level under different information conditions. One nice design: "assignment
  game" where groups play both levels in sequence.


  Alternative activity: a structured deliberation with real choices: The class is
  divided into "cantons" (4 groups). Each canton gets a card with private info about
  local preferences (e.g., which of two public goods their residents value). They
  must choose whether to keep authority at canton level or transfer it to a federal
  body (the whole class) by a vote. Then a round where the class, acting as a federation,
  must choose a uniform policy. Points are awarded to individual cantons based on
  how well the final policy matches their private profile, with different structures:

  - Round A (autonomy): each canton picks its own policy; score = match to local profile.

  - Round B (mandatory federal uniformity on an issue with scale economies and spillovers):
  they vote on one uniform standard; scale bonus plus externality interactions.

  - Round C (optional subsidiarity): they can negotiate to pool only certain decisions
  upward and reserve others locally.


