  Analogy idea: Introspection as a program''s own diagnostic output vs. actual internal
  state.


  Mental side:

  - Folk view: introspection gives privileged, direct access; introspective reports
  are authoritative.

  - Skeptical view: introspective reports are generated by ordinary cognitive mechanisms
  that can be wrong: they are the mind''s own self-model, not a transparent readout.


  Computing side:

  - A running program may emit logs, status codes, error messages, debug info. These
  are data produced by executing code, not a memory dump or a debugger''s read of
  the machine state.

  - A program''s error message can mislocate the cause: a failure in one module can
  surface as an error in another (cascading errors). The program is not just reporting;
  writing the report changes behavior (log statements affect timing, memory, inlining;
  observation changes concurrency bugs).

  - The program''s report is authoritative only in the weak sense that it reflects
  what the program''s own self-report routines computed, not in the strong sense that
  it reveals the actual causal path.


