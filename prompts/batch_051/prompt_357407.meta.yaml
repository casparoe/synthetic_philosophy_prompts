  nature of language: speech acts address audiences, and the meaning of an utterance
  can come apart from the speaker''s private intention; a dog whistle, for instance,
  is defined partly by the fact that one audience hears a racialized message while
  another hears something innocuous, and this divergence can obtain even without conscious
  design. Or maybe the asymmetry is really about power and vulnerability: in cases
  of racialized harm, patterns of denial have been used so often that we have adopted
  a practice of discounting appeals to intent. But then I worry we are making an ad
  hoc exception to a principle we otherwise take seriously: if intent matters for
  blame in one domain, why not the other?


