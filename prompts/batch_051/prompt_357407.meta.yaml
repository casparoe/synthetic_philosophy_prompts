  Possible prompt:


  "I am a PhD student in philosophy of law, and I have been teaching a section on
  the moral limits of the criminal law. I keep tripping over an asymmetry in our judgments
  about threats that I would like your help thinking through. Suppose I am in a position
  to disclose some embarrassing but truthful information about you — say, an affair,
  a history of addiction, or a professional failure that you have kept private. Disclosing
  that information would (let us stipulate) be callous and harmful, but it would not
  itself be illegal; in many cases I might even be free to publish it. And asking
  you for money is likewise, by itself, perfectly legal. Yet if I link the two — offering
  to stay silent in exchange for payment, or threatening to disclose unless you pay
  — I have committed blackmail, a serious crime almost everywhere, and the act is
  treated as wrong well beyond what the two component acts would be. Two acts that
  are each permissible on their own become seriously wrong simply in virtue of being
  combined in a conditional structure. That strikes many people as paradoxical, but
  we have not found a satisfying account.


  "The more I look, the more precise the difficulty becomes. In the ordinary case
  of a threat — ''do X or I will do Y'' — the wrongfulness of the threat seems to
  depend on the wrongfulness of the threatened act: threatening to assault you is
  wrong because assaulting you is wrong, and threatening to run to the police is not
  wrong if the police would be the appropriate place to report a crime. Blackmail
  seems to violate that principle precisely where the threatened act (truthful disclosure)
  is one I am entitled to perform. So our practice appears asymmetric: we generally
  let the moral status of the threat inherit from the moral status of the threatened
  act, except in the case of blackmail, where we condemn the threat even though the
  act threatened is permissible. I can see candidate explanations — the disclosure
  is not being done for its own sake but used as a lever; the victim''s consent is
  manufactured; secrecy is being commodified; the arrangement exploits a vulnerability
  rather than offering a genuine exchange; the threat, if carried out, would be permitted
  but my announcing it changes what your silence is worth. None of them has seemed
  to me to survive contact with nearby cases, such as bluffing, threatening to reveal
  a secret one has a duty to disclose, revealing information to a third party while
  asking for money separately but transparently, threatening to disclose something
  false, or threatening to disclose something about oneself.


