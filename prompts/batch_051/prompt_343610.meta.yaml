  - A theory that adds an epicycle to save an intuition: e.g., hedonistic utilitarianism
  plus a constraint "except when it would involve using someone as a mere means" —
  I feel this is less simple, and it loses the elegance, but the constraint may be
  justified if it captures a strong intuition. Verdict: justified epicycle if it earns
  its keep.

