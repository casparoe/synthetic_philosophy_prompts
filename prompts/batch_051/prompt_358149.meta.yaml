  Let''s draft:


  "People often use Montaigne''s Of Cannibals as a sort of analogy or parable for
  cultural relativism. The work it is made to do is roughly this: just as Montaigne''s
  Tupinambá seemed barbarous to European observers only because they were foreign,
  so any culture''s practices look wrong to us only because we judge them by the standard
  of our own culture; therefore we should suspend judgement. The passage I have in
  mind is the one in which Montaigne reports that the Tupinambá do not eat their prisoners
  for nourishment, as the ancient Scythians supposedly did, but as an expression of
  extreme revenge, and that they keep their captives for a long time, treating them
  well, before the final ritual. If I am remembering the essay correctly, he then
  says we may call these people barbarous by the rules of reason, but not in comparison
  with ourselves, because we surpass them in every kind of barbarism. I want an audit
  of this analogy. Give me the correspondences: what plays the role of the Tupinambá,
  the European observer, the local standard, and the alleged barbarism in modern disputes
