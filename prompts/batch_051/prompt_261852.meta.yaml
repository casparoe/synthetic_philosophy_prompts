  Objective Bayesianism: view that there are rational constraints on priors beyond
  coherence; candidates: equivocation/indifference principle, maximum entropy principle
  (MaxEnt), transformation invariance (Jeffreys), reference priors. The maximum entropy
  principle: given background constraints (e.g., specified expectation values), choose
  the probability distribution that maximizes entropy subject to those constraints.
  This gives the most "uninformative" distribution in some sense, or the one that
  makes minimal additional assumptions. It generalizes the principle of indifference.


  Conceptual issues:

  - Why maximize entropy rather than some other concave function? MaxEnt is justified
  by appealing to Shannon entropy''s properties (uniqueness axioms), or by concentration
  theorem (most distributions consistent with constraints have entropy near maximum
  for large N?), or by maximum entropy as maximizing uncertainty.

  - Circularity worry: The maximum entropy distribution depends on the parameterization
  / choice of variables. If you use a different coordinate system (e.g., log of a
  parameter), the MaxEnt prior changes. So "uninformative" is not invariant. Jaynes''s
  reply involves the issue of continuous variables and limiting processes; but there''s
  a well-known critique by Seidenfeld, or van Fraassen''s "problem of the best-justified
  alternative"? Actually van Fraassen criticizes "I have no reason to think coin biased"
  -> can''t infer uniform via MaxEnt? Hmm.


  - Another issue: maximum entropy only makes sense relative to specified constraints;
  different constraints lead to different priors. Which constraints should be treated
  as "background knowledge"? The choice of constraints is itself a prior-like commitment,
  potentially smuggling in information.


  - Also the entropy is only defined relative to a partition / class of possibilities.
  Coarse-graining changes MaxEnt distributions. For continuous variables, entropy
  is not invariant under reparametrization.


  - Objective Bayesianism may also run into the "problem of linguistic variance":
  the principle of indifference gives different answers depending on how possibilities
  are described (e.g., color of balls: red/blue/green vs red/not-red). MaxEnt is sometimes
  seen as a fix if you have constraints, but still partition-dependent.


