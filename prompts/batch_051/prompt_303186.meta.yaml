  Let''s craft a better student answer:


  "The regulator is trying to infer a latent objective from an observed sequence of
  choices, so the problem is underdetermined: many different objective functions can
  generate the same sequence. Part of the difficulty is that an objective function
  and a search space make different claims about why a price was chosen. The objective
  ranks candidate prices by desirability; the search space specifies which candidates
  the procedure actually evaluated. An observer who confuses the two will mistake
  an unexplored region for a rejected region. For example, if the algorithm never
  discounts below a floor, the floor might be encoded as a term in the objective penalising
  low prices, or it might be imposed as a hard constraint that the search never crosses.
  One standard solution is to collect a long enough series of choices: with sufficient
  data the observer can identify which omitted options were never considered and which
  were considered and rejected, which then identifies the objective up to an affine
  transformation."


  Subtle mistakes:

  - "with sufficient data... identify omitted options were never considered vs considered
  and rejected" — but from passive observation, you can''t see what was considered.
  More data doesn''t let you observe the internal search when it''s not externally
  recorded. Need auxiliary information about search (e.g., instrument changes, A/B
  tests asymmetries, known search algorithm). This conflation is subtle.

  - "identifies the objective up to an affine transformation" — affine equivalence
  applies to expected utility / VNM preferences under rational-choice theory, not
  to arbitrary optimizer objective from constrained behaviour; in many inverse reinforcement
  learning settings, objectives are only identifiable up to a set of reward functions
  consistent with observed optimality (e.g., subgradient, linear?), depending on the
  behavioural model. But "up to affine transformation" is a known claim for reward
  shaping (Ng et al.). Could be a subtle mis-step because affine equivalence is for
  VNM, not this inference. But maybe it''s contested. Could note in grading comments?
  We don''t need to be perfect.


