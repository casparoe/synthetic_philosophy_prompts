  Then exam question:


  "Question (short-answer). A regulator observes the day-to-day pricing moves of a
  retailer''s algorithm and knows only the prices it could have chosen. Explain why
  the regulator cannot straightforwardly read off the algorithm''s objective from
  this behaviour, making specific reference to the difference between an objective
  function and a search space. Under what additional assumption would the inference
  become well-posed?"


  Student''s answer:


  "Behaviour alone leaves the objective underdetermined. If the algorithm always converges
  on the same prices, the regulator may be seeing a goal-directed optimum; but price
  moves could just as well be a sequence of constrained local searches. The objective
  is the quantity the algorithm is trying to maximise (e.g., margin, revenue, retention),
  while the search space is the set of candidate prices it is actually able or allowed
  to consider. The two are easy to conflate because a narrow search space can mimic
  a strong preference: if a firm never undercuts a rival, this may reflect a high
  weight on price stability in the objective or simply that below-cost prices were
  never in the search space. The inference becomes well-posed when the observer has
  enough data, because with a long enough price history the observer can separate
  choices that reflect the objective from choices that reflect search constraints
  and recover both."


