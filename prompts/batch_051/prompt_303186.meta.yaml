  More data alone doesn''t identify objective vs search constraints; you need identifying
  assumptions (e.g., known parametric family, known search algorithm, exogenous variation
  in constraints). It conflates statistical identification with sample size. A hasty
  grader might be tempted to say yes more data helps, but the step doesn''t follow.

