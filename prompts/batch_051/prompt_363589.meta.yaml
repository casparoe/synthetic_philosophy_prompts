  Draft:


  "I am a novelist, and I have spent a good deal of time thinking about what it is
  for something to be true in a fiction. Lately I have found myself turning to an
  analogy I was offered at a dinner party, and I would like it tested. I had voiced
  an old difficulty about mathematics: it seems to be about objects — numbers, sets,
  functions — that are not in space or time and do not enter into causal relations;
  yet human beings, who are causal creatures, somehow end up with reliable and often
  non-accidentally correct beliefs about them. How can our minds reach what is, by
  stipulation, causally inert? A mathematician present replied that I was treating
  numbers as if they were stars or stones, and that a better model is a novel. Numbers,
  he said, are like characters in fiction: they do not exist physically, but within
  the framework of the story certain statements about them are determinately true,
  others false, and still others indeterminate, and a careful reader can come to know
  these truths by following the rules the author has laid down. Mathematical knowledge,
  on this view, is less like perception and more like literary interpretation. The
  analogy was clearly doing real work for him: it was meant to show that my difficulty
  dissolves, because the demand for causal access was simply the wrong demand."


  Then ask: "Audit this analogy. Set out what corresponds to what... Where it breaks...
  What the fiction model quietly imports... Which features of mathematics the analogy
  fails to capture... Whether the original difficulty really does dissolve, or whether
  it reappears inside the fiction—e.g., in the reliability and stability of mathematical
  truth compared to the contingency of what an author happens to have written. If
  the analogy fails, say whether a better analogy would do the work."


