  Domain 5: Etiological vs causal-role accounts of biological function.


  Briefly:

  - Etiological (Wright): a trait''s function is what it was selected for / why it
  exists — the effect that explains its presence via a history of selection.

  - Causal-role (Cummins): a trait''s function is its causal contribution to some
  capacity of the containing system, analyzed relative to our explanatory interests,
  regardless of history.


  Specifications: a single biological case in which the two accounts assign a function
  to the same trait differently — or one assigns a function where the other doesn''t.
  The classic divergence: a trait that currently does something useful in the organism''s
  physiology (causal-role) but exists for a different historical reason or by drift
  (etiological: not a function, or a different function). Or a trait selected for
  one thing but now co-opted for another (exaptation) — etiological says its function
  is the original selected effect until selection reshapes it; causal-role says its
  current contribution is the function.


  Actually the cleanest divergence: a trait with no selection history for a current
  beneficial effect. Etiological account: no function (or not that function); causal-role:
  function. E.g., a novel mutation that happens to... but an individual doesn''t have
  selection history. Better: a trait that arose as a byproduct or via drift and now
  contributes causally to fitness-relevant capacity.


  Or the reverse: a trait with a selection history (function X) but which no longer
  causally contributes to any current capacity (vestigial) — etiological says function
  X (or used to), causal-role says no function (or disfunction). But causal-role could
  still assign it a role if we choose a system relative to which it contributes. Hmm.


