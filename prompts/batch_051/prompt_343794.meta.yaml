  and a lot of the worry isn''t the physics but that even researching it creates a
  moral hazard because policymakers will treat it as a backup plan and slow down emissions
  cuts. Where we split: she thinks any serious research program, including modeling
  and small field experiments, is irresponsible because it makes deployment more likely
  and deployment means a handful of rich countries deciding the planet''s thermostat.
  I think the moral hazard argument cuts the other way — if we refuse to study it,
  we''re betting the entire future on emissions cuts that aren''t happening, and we
  give up the chance to learn whether the thing even works, so the real irresponsibility
  is willful ignorance. We literally agree on every empirical fact and every value
  phrase we can articulate (she says she also wants to reduce suffering, I say I also
  worry about one country unilaterally flipping the switch). But the argument kept
  circling. My hunch is the disagreement is really about what each of us is allowed
  to assume about how institutions will behave under stress: she''s assuming the mere
  existence of an option makes its worst-case use near-inevitable, and I''m assuming
  it stays a research program unless something much worse happens. So my question:
