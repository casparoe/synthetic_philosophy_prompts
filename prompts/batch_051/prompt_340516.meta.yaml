  I am a longtime reader of rationalist blogs and forums, and I have absorbed a certain
  style of thinking about bivalence and fatalism. I keep finding myself stuck on a
  version of the sea-battle problem that feels more serious than the usual "Aristotle
  thought there were truth-value gaps" summary suggests. Here is the clash as I experience
  it.


  The theory I find compelling is classical bivalence: every well-formed declarative
  sentence is either true or false, and the law of excluded middle holds. This gives
  a clean, non-arbitrary semantics. If I say "there will be a sea battle tomorrow,"
  it is either true or false; if it is true, then the world is the way it is, and
  the future is just the later part of the way the world is. The theory is simple,
  it avoids ad hoc exceptions, and it keeps logic and truth pristinely straightforward.


  But I also have a firm intuition that the future is open in a sense that bivalence
  seems to close off. Aristotle puts the difficulty in De Interpretatione 9 roughly
  like this: if every affirmation or negation is already true or false, then it was
  already true yesterday that there will be a sea battle tomorrow, and then it seems
  the sea battle must happen, and nothing anyone does can prevent it. But that cannot
  be right: whether there is a sea battle tomorrow is not already settled, and the
  ordinary practice of deliberation presupposes that both options are genuinely possible.


  I am not asking for a history of interpretations of Aristotle. I am asking a systematic
  question. Present the strongest case for each side. Then walk me through what it
  would take for the bivalence/past-truth side to yield, what it would take for the
  open-future side to yield, and whether there is a reading of "true" or "settled"
  on which both survive without cheating. Which do you give up, and what exactly does
  the loser lose?


  If I am framing the problem badly, or if the apparent clash rests on an equivocation,
  say that plainly instead of pretending there is a clean answer. I would rather have
  the question repaired than answered politely.


