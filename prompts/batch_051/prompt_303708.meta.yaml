  Draft:


  "For a graduate seminar on scientific realism, I would like you to write a sorting
  decision tree that takes a student from a single starting acknowledgment to one
  of six named positions by asking only questions the student can answer without already
  knowing which label an answer leads to. The starting acknowledgment is this: the
  student grants the pessimistic meta-induction its historical premise, namely that
  many past theories that made successful novel predictions were later discarded,
  and that some of their central unobservable posits (caloric, the ether) turned out
  not to refer, while conceding that the mathematical and predictive content often
  survived the abandonment. The tree should therefore begin from the fact of theory
  change, not from any prior realist or antirealist commitment.


  The leaves must be: standard scientific realism, selective realism (sometimes called
  divide et impera realism), epistemic structural realism, entity realism, constructive
  empiricism, and instrumentalism. Use each of these exactly once, and define each
  leaf in a sentence. Your diagnostic questions must force the positions apart through
  concrete cases rather than through self-description. At minimum, include: a question
  using the caloric theory of heat and the survival of Fourier''s heat equations,
  where the central entity was eliminated but the mathematics carried over; a question
  using the ether and the survival of Fresnel''s equations in Maxwellian electromagnetism;
  a question using electron manipulation in the laboratory (operating on or deflecting
  electrons, say) as a test of whether experimental interactivity licenses existence
  claims that passive inference does not; and a question about whether parts of a
  successful theory that played no role in any of its novel predictions are equally
  licensed. You may add one or two further questions if the six leaves require them,
  but keep the tree to no more than eight questions. For each branch question, say
  explicitly which leaves it separates and which combinations of answers the tree
  treats as empty; where a combination is empty, say briefly whether you take it to
  be incoherent, merely unattractive, or simply unexplored in the literature.


  Finally, explicitly flag any pair of leaves your questions cannot cleanly separate,
  and say why not. I suspect, for example, that selective realism and epistemic structural
  realism will be hard to pull apart on historical cases because they agree that only
  part of a discarded theory earned belief; my own hypothesis is that they differ
  only on whether the earners are entities-and-mechanisms or structures-and-equations,
  and your tree should test whether a concrete question can force that difference
  to the surface. Also say whether entity realism can be separated from constructive
  empiricism on the electron case, since both can agree about observables while differing
  only over whether manipulation crosses the observable/unobservable line.


  Please write the whole thing as continuous prose, the way one would write an email
  or a letter: no headings, no bullet points, no bold text, and no tables. When you
  describe the tree, narrate the branches in sentences so the reader can follow a
  path without a diagram."


