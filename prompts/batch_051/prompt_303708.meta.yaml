  Let me think about what makes a great decision-tree prompt for scientific realism.
  The core question: under what conditions should one believe in unobservable entities
  and/or structural claims of successful scientific theories, given the pessimistic
  meta-induction (PMI)? Positions:


  - Standard/scientific realism (or "convergent realism"): successful novel prediction
  warrants belief in both entities and approximate truth of theoretical structure/laws.

  - Entity realism (Hacking''s experimental realism, Cartwright''s entity realism):
  warranted belief in entities we can manipulate/intervene with, but not in theories/models.
  Hacking: "if you can spray them, they''re real."

  - Structural realism (epistemic version, Worrall): we should believe in the mathematical/structural
  content preserved across theory change, not in the nature of the entities.

  - Selective/divide-et-impera realism: deployed/working parts of theories are retained;
  idle parts get dropped. (Psillos, Kitcher''s working posits vs presuppositional
  posits; "deployment realism".)

  - Constructive empiricism (van Fraassen): we should aim for empirical adequacy,
  not truth of unobservables; agnostic about unobservables.

  - Instrumentalism: theories are instruments for prediction; questions of truth about
  unobservables are misplaced or not meaningfully true.

  - Maybe "preservative realism" or "retention realism" — not needed.

  - PMI itself is an argument, not a position; maybe the tree includes an antirealist
  branch.


