  I help maintain an annotated reader on emergency powers for a law-and-philosophy
  seminar, and our group is stuck on a provision of our model Emergency Powers Act.
  The clause reads: "Where a grave and imminent threat to public order or the security
  of the state so requires, the Minister may adopt by decree derogations from ordinary
  legal safeguards for renewable periods of three months, provided that the measures
  are necessary, proportionate, and strictly limited in duration to the persistence
  of the threat." The drafters took as their paradigm short, bounded crises -- floods,
  mass disorder, an armed attack -- and the legislative history keeps using expressions
  like "until ordinary life can resume."


  Our case study is this. Seven years ago, after a coordinated bombing campaign, the
  government introduced temporary border controls at all internal crossings and a
  requirement that citizens carry biometric identity cards. The campaign was suppressed
  within a year. Since then, the government has renewed the decree every three months
  on essentially unchanged findings, now arguing that the relevant threat is no longer
  an episode with an endpoint but a structural condition: dispersed networks, irregular
  cross-border movement, and a "persistent but fluctuating" risk. The Ministry of
  the Interior says textual interpretation supports it, since the measures are renewed
  only while the threat persists, and the text nowhere requires the threat to be acute
  as long as it remains "grave." Others in the group say that turns an emergency exception
  into ordinary law and defeats the purpose of the clause; some would ask what the
  drafters would have said if told "temporary" measures would still be running seven
  years later; and some argue that a reasonable reader today should read the clause
  in light of how indefinite security states actually work. How does the clause apply
  to the seventh-year renewal of the border controls and the biometric identity card
