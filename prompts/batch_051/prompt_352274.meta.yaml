  repeatedly shows the same specific mutations being favoured under the same selective
  conditions, and other mutations losing. Third, island species turn out to be closest
  relatives of nearby mainland species, not of ecologically similar species from distant
  places. Each of these could have come out otherwise and would then have embarrassed
  the theory. So what exactly is the residue that you would still call metaphysical
  — and why should we care about that residue if the working scientists are continuously
  testing Darwinian claims?


