  Next month I am giving a departmental seminar defending the claim that the Middle
  Ages, the Renaissance, and the Scientific Revolution are retrospective constructs
  rather than periods with discoverable boundaries in the historical record. By "constructs"
  I do not mean that nothing changed in Europe between roughly 500 and 1700, or that
  the labels are useless; I mean that they are organizing categories imposed later
  to serve later disciplinary, pedagogical, and cultural needs, and that their boundaries
  and contents shift with the interests of the historian using them. My argument,
  briefly, runs: (1) the boundaries are chronically unstable, with the Middle Ages
  ending at 1453, 1492, 1517, or nowhere in particular depending on which historian
  you ask, and the Renaissance starting at very different dates in Italy, France,
  and England; (2) the features standardly used to mark a Scientific Revolution —
  mathematization, experiment, instrumentation, new institutions — have long medieval
  and late-scholastic careers and only look revolutionary when earlier work is read
  as their dark prehistory; and (3) the Renaissance carries an unstated value judgment,
  treating one regional elite''s revival of classical letters as the rebirth of civilization
  full stop, which is as much a nineteenth-century story about modern identity as
  a neutral description of the fifteenth century.


