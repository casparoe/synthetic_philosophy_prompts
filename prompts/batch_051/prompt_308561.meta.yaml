  ---


  I''m running an upper-level seminar next week on whether a finite mind would eventually
  be exhausted by immortality, and I want a handout that sorts through the replies.
  Here''s the worry I''ll put on the board: take a normal human mind and don''t change
  its capacities, just keep it alive indefinitely. At some point it''s plausible that
  it has run through every experience its kind of mind can have, and after that every
  moment is a repeat of some earlier moment in every way that matters. The students
  tend to find that decisive, so I''ve jotted down six replies:


  (a) Forgetting: since memory is imperfect, old pleasures really can arrive as new,
  so an infinite life with finite memory keeps re-encountering its own past.

  (b) Recombination: a finite stock of basic experience types can combine into indefinitely
  many higher-order experiences, much as a finite alphabet supports indefinitely many
  sentences, so the "stock" is finite only at the wrong grain.

  (c) Drifting standards: what a person counts as a valuable experience changes over
  time, so the relevant inventory is not fixed and can keep rewriting itself.

  (d) Deepening: repeated things are never encountered under the same description,
  because attention can go finer or the background knowledge one brings changes.

  (e) Open-ended projects: someone who is never finished—exploring an always-larger
  world, or pushing a skill with no known ceiling—can generate new experiences indefinitely
  as a byproduct, rather than needing to consume experiences one by one.

  (f) Global background: even if the foreground content recurred, the felt meaning
  of it against the rest of a life can change, so maybe the relevant unit of novelty
  is not the episode.


  Rank these from the one you''d go to the mat for to the one you''d only mention
  as a class-strawman. Give each a score out of ten for how much of the original worry
  it actually dissolves, and one sentence saying why it lands where it lands. Then
  add one reply of your own that isn''t just a restatement of (a)-(f) and say where
