  Jon: But you only get the second "can''t" by holding fixed the whole later history,
  and then you''ve given up on a local explanation of what happens at the moment he
  pulls the trigger. In the consistent world you describe, Tim has to fail. Why does
  he fail? The gun slips, he gets a cramp, the bullet''s a dud. Each of those is a
