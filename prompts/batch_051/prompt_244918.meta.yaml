  "I''m working on a paper on Pascal''s bit in the Pensées where he says justice without
  force is impotent and force without justice is tyrannical, so the trick is to make
  justice strong and strength just. I want a thought experiment built to order: a
  case where a rule governing some ordinary institution is genuinely just (so far
  as distributive outcomes go), but the only mechanism that can stabilize it is a
  force that the people subject to it regard as illegitimate, in a way that Pascal''s
  dictum can''t easily absorb. Constraints: realistic setting, no state of nature
  or civil war, no secret police, and the enforcement mechanism has to be one a normal
  person could actually face—not demons or perfect predictors. The case should be
  designed so that Pascal''s criterion yields the verdict that the arrangement is
  still legitimate because the force is subordinate to justice, while a procedural
  legitimacy view (roughly: force is legitimate only if those subject to it can in
  principle authorize or contest it) yields the opposite verdict. After the scenario,
  walk me through the reasoning for both views, say exactly which feature forces the
  split, and then tell me what a defender of Pascal would say to reject the procedural
  challenge without collapsing the case back into ''might makes right''."


