  I''m a novelist, and a subplot in my current book has gotten completely away from
  me. The book is set in a hospital, and there''s an "explainable" triage AI that,
  for every decision it makes, prints an elegant little argument justifying the decision.
  The engineers are adamant the system has no beliefs or goals — it just samples text
  conditioned on its outputs — but the rationales are often better than what the attending
  physicians produce on the spot, and the protagonist, a surgeon, begins treating
  them as the machine''s reasons. The thing I can''t resolve is whether "reasons without
  a reasoner" is even a coherent idea, and it stopped being academic when a friend
  of mine read the draft and we got into it, and another friend joined in.


  The first friend, Mara, thinks the book is built on a category mistake. She said
  a reason has to be somebody''s reason: a state of a mind, or at minimum something
  anchored to a mind that can weigh it. A text can encode an argument, but an argument
  only becomes a reason when a thinker takes it up; before that, it''s just marks
  on a screen. Her favorite example: a proof of some unsolved conjecture is sitting
  unread in a dead mathematician''s drawer. The theorem is true, but nobody has a
  reason to believe it yet — the proof is a possible reason, not a reason. So the
  machine can''t have reasons without reasoners; it can only emit strings that a human,
  in taking them up, promotes into reasons.


