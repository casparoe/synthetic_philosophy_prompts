  Bostrom''s simulation argument (2003, "Are You Living in a Computer Simulation?").
  The core: at least one of the following is true:

  (1) The human species is very likely to go extinct before reaching a "posthuman"
  stage capable of running ancestor-simulations.

  (2) Any posthuman civilization is extremely unlikely to run a significant number
  of simulations of their evolutionary history (or variations thereof).

  (3) We are almost certainly living in a computer simulation.


  The argument: If (1) is false (we reach posthuman stage) and (2) is false (posthumans
  run many ancestor-simulations), then there would be vastly more simulated observers
  than original ones. Assuming we are typical observers (no special place), we should
  think we are probably among the simulated. Therefore at least one of the three is
  true. He gives a "bland principle of indifference" and thinks the probability of
  (3) may be high given acceptance of substrate-independence and technological feasibility.


  So a plausible popular summary could say: "Bostrom proved that we are probably living
  in a computer simulation. His argument is that future civilizations will eventually
  have enough computing power to simulate billions of conscious ancestors, so if any
  of them actually do this, simulated people will vastly outnumber real ones. Since
  you don''t know whether you''re real or simulated, and most people would be simulated,
  you should conclude you''re probably in a simulation. The only way to avoid this
  is to believe humans will go extinct before reaching that technology." — This has
  subtle errors: Bostrom doesn''t prove we''re probably simulated; he presents a trilemma
  and conditional probabilities; "the only way to avoid" sets aside possibility (2)
  that posthumans choose not to run simulations; also "simulate billions of conscious
  ancestors" assumes substrate-independence/consciousness; "most people would be simulated
  makes it probable you are simulated" needs the assumption that we are typical observers
  / no self-sampling bias; also the argument is about ancestor-simulations specifically,
  not arbitrary simulations. The summary in the voice of a confident popularizer is
  mostly right but overstates and omits the choice-not-to-run branch, treats it as
