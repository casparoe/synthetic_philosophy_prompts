  Draft:


  ---

  I am trying to work out what, if anything, the passage of time should change about
  the justice of prosecution and punishment. I have a set of verdicts about particular
  cases, but I have not yet found a principle that captures them, and I would like
  you to help me extract or construct one.


  Preliminary stipulation. I want to set aside the most familiar reason for statutes
  of limitations: that with time, evidence decays, witnesses die, memories distort,
  and a fair trial may become impossible. In each case below, assume that a fair trial
  is still possible and that the evidence is adequate to establish guilt beyond reasonable
  doubt. I am asking whether time matters for some reason other than the erosion of
  evidence.


  My verdicts.


  (1) Baseline. A thirty-year-old defrauds investors of their retirement savings in
  a single sustained scheme. The fraud is uncovered after one year, and the state
  prosecutes promptly. Verdict: prosecution and a substantial sentence are plainly
  appropriate.


  (2) Delayed fraud, reformed. The same fraud is committed, but it goes undetected
  for twenty-five years. At fifty-five the offender is identified. In the interim
  he has committed no further offense, has run an honest business, and has—so far
  as anyone can tell—become a different sort of person. Verdict: I would not prosecute.
  I am not saying he deserves no blame for the past; I am saying that by now the state''s
  pursuing him seems largely beside the point.


  (3) Delayed fraud, unreformed. Same delay, but the offender has spent the twenty-five
  years much as he spent the years before: litigious, predatory in small ways, repeatedly
  skating along the edge of the law without conviction. Verdict: I lean toward prosecution,
  and I am less moved by the delay than I was in (2). The difference must be something
  about whether he is, in the relevant sense, the same person who committed the fraud.


  (4) Delayed murder, unreformed. A twenty-four-year-old murders his business partner
  and conceals the crime. Forty years later he is identified. He has not reoffended,
  but there is no sign of transformation; he has simply kept his head down. Verdict:
  I am confident he should still be prosecuted and, if convicted, punished. Time alone
  does not seem to touch the case for accountability here.


  (5) Delayed murder, profoundly reformed. Same murder, same forty-year delay; but
  in the interval the man has lived a genuinely admirable life, made serious restitution
  to the community in other ways, and by all appearances has changed at the level
  of character. Verdict: I still lean toward prosecution, though with more unease
  than in (4). The fact is that the transformation which moved me greatly in the fraud
  case moves me much less here. I do not know whether that difference is principled
  or mere squeamishness about murder.


