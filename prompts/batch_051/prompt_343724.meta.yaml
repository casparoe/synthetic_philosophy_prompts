  Question: "Explain the causal exclusion argument against non-reductive physicalism.
  Does it succeed in showing that mental causation is an illusion? Discuss with reference
  to at least one attempted reply."


  Student answer (draft):

  "Kim''s exclusion argument starts from three principles: (1) mental causation: mental
  events cause physical events; (2) causal closure of the physical: every physical
  event has a sufficient physical cause; (3) non-reductive physicalism: mental properties
  are distinct from and supervene on physical properties. Suppose my desire for coffee
  causes my arm to move. By closure, the arm movement also has a sufficient physical
  cause in my brain. If mental and physical causes are both sufficient and distinct,
  the movement is overdetermined. To avoid systematic overdetermination, Kim says
  we should accept the physical cause as the real cause and regard the mental cause
  as epiphenomenal — a mere byproduct of the physical. This result generalizes: mental
  causation is excluded anywhere physical causation is complete. Some philosophers
  reply that mental and physical properties are identical, but Kim argues that functional
  reduction cannot preserve qualia, so non-reductive physicalism fails. Therefore
  the exclusion argument shows that mental causation is an illusion unless we accept
  reductive physicalism."


