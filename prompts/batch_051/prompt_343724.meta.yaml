  First, accurately reconstruct Kim''s causal exclusion argument.


  Kim''s argument (simplified):

  - Closure (or causal closure of the physical domain): If a physical event has a
  cause at t, it has a sufficient physical cause at t. (Or every physical event has
  a sufficient physical cause.)

  - Exclusion: No event can have more than one sufficient cause at any given time,
  unless it is a genuine case of causal overdetermination.

  - Mental causation premise: Mental events cause physical events (or mental properties
  are causally efficacious).

