  The Principal Principle (David Lewis, 1980, "A Subjectivist''s Guide to Objective
  Chance"): Let C be a reasonable initial credence function. Let t be a time. Let
  H_t be the complete history of the world up to t. Let T_w be the complete theory
  of chance for world w (the entire pattern of chances). Then if X is a proposition
  about the future (or any proposition), C(X | H_t T_w) = ch_t(X) = x, where ch_t(X)
  is the chance of X at t in world w. Roughly: your credence, conditional on the full
  history and the true chance theory, should equal the chance. The "new principle"
  is a later amendment by Lewis (1994) and Hall: PP should be modified because of
  "inadmissible information" — information about the future or about the outcome itself
  can trump the chance (undermining: evidence that a chance hypothesis is false can
  come from the fact that the outcome occurred, etc.). Actually Lewis''s original
  PP had an admissibility clause: C(A | H_t T_w E) = x only for admissible E. The
  New Principle (Lewis 1994): C(A | H_t T_w) = ch(A | T_w), i.e., conditionalize on
  the chance theory as well to avoid undermining. Hall''s version: the chance of A
  conditional on the chance theory itself.


