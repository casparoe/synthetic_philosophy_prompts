  Dennett''s multiple drafts model (from Consciousness Explained, 1991):

  - Cartesian materialism/theater: the view that there is a place in the brain where
  "it all comes together" and consciousness happens — a stage where contents enter
  consciousness, watched by a homunculus/audience. Dennett argues it''s a trap: any
  proposed theater just pushes the homunculus problem back.

  - Alternative: multiple drafts — parallel, distributed, continuous processes of
  interpretation/editing ("drafts" or "narratives") in the brain. There is no single
  canonical version of an experience; there are many "drafts" at various stages of
  processing. What we report is influenced by when and how we''re probed ("probe"
  questions). Consciousness is not a place/time of arrival but "fame in the brain"
  / "cerebral celebrity" — the winning draft at a moment.

  - Key claims: no "stream of consciousness" unified; no central meaner; narrative
  is constructed; the "Orwellian vs Stalinesque" revisions show there''s no fact of
  the matter about when something was conscious; first-person reports are not authoritative.


  Software parallel: The Cartesian theater is like a single-threaded GUI/monolith
  with a central render loop and one authoritative in-memory state; all updates go
  through one place; "what''s on screen at time t" is well-defined. Multiple drafts
  is like distributed, event-driven, eventually consistent systems (or event sourcing/CQRS):
  many nodes process events concurrently; there is no single authoritative "current
  state"; when you issue a query you get a projection constructed at query time; different
  projections may disagree; the "source of truth" is the event log / the projection,
  but there''s no privileged view.


  Where the analogy matches:

  - No central place where everything converges; replacing a "theater" with many parallel
  processes.

  - The "view" (report) is constructed in response to a "probe" (query), and the timing/content
  of the probe shapes what you get.

  - There is no fact of the matter about the system''s "current state" independent
  of a query — like Dennett denying a fact of the matter about when/how a stimulus
  became conscious apart from probes.


  Where it breaks:

  - In event sourcing, there is an authoritative append-only event log (single source
  of truth), whereas multiple drafts has no single canonical "raw" sequence; drafts
  aren''t reliably timestamped and can be overwritten. Dennett denies privileged "raw
  input" that gets processed.

  - Software systems have an external spec of correctness (the intended behavior);
  multiple drafts has no designer-specified semantics.

  - Eventually consistent systems are designed to *converge* to one state over time
  if updates stop; the brain''s drafts don''t necessarily converge, and "convergence"
  is not the goal — the brain is always doing something.

  - Querying in software (usually) doesn''t alter the event log, whereas probing a
  person can alter which draft is "famous."

  - Undoability: in software you can replay events deterministically; brain processes
  are not deterministic/replayable.


