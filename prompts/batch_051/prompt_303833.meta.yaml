  I''m working through Spinoza''s political stuff for a class and I keep getting stuck
  on how he actually thinks about democracy, because two places seem to pull against
  each other. In the Theological-Political Treatise, around chapter 16, he basically
  says democracy is the most natural kind of state, because when everyone hands over
  their natural right they hand it over to the collectivity rather than to some single
  person, and so people remain as free and equal as they were in the state of nature.
  That sounds pretty inclusive. But then in the unfinished Political Treatise, chapter
  11, he goes out of his way to say women shouldn''t have any share in ruling, and
  from what I remember he doesn''t just say it''s a bad idea under the circumstances;
  he says it''s a matter of natural inferiority or that women are by nature subject
  to men, and that''s why they''re excluded from the assembly. So my question is:
  are these two views actually in tension with each other? On one reading he''s contradicting
  himself, or just being blind about who counts as "everyone." On another, his definition
  of democracy is purely formal, about where sovereignty is placed, and it doesn''t
  promise that every human being will be counted as a citizen. Or maybe he changed
  his mind, or maybe he thinks equality in natural right is compatible with some people
  being excluded from participating in actual government. What I''d like is a careful
  account of how these two passages can or can''t be reconciled, what it forces you
  to give up about the usual picture of Spinoza as a democrat, and whether the reconciliations
  that make him consistent do so only by making his earlier democracy pretty thin.
  Also, if you think there is a real tension, say which of the two positions better
  represents his considered view and why.


