  Draft:


  "I''m writing a paper on split-brain patients and the unity of consciousness, and
  I keep getting stuck on a preliminary question. Both the ''one subject'' and the
  ''two subjects'' readings of the split-brain data seem to me to presuppose some
  working criterion for when a set of concurrent experiences belongs to a single subject
  of experience — or, to put it differently, for when two experiences are co-conscious.
  I''d like you to develop and defend such a criterion.


  Here are the cases I want the criterion to get right, or at least to pronounce on
  clearly. (1) An ordinary awake adult watching a film, simultaneously aware of the
  color of a character''s coat, the swelling of the score, and the pressure of the
  armrest against her elbow. I take this to be a clear case of one subject with several
  co-conscious experiences. (2) Two strangers in the same cinema, each noticing the
  same three details at the same time in a private stream the other cannot enter.
  I take this to be a clear case of two subjects and two streams, with no co-consciousness
  across them. (3) A patient who has undergone a complete corpus callosotomy in a
  standard divided-field experiment. A picture of a spoon is flashed briefly to his
  left visual field, so it is initially processed by the right hemisphere. Asked what
  he saw, the patient says he saw nothing, but his left hand, controlled mainly by
  the right hemisphere, reliably selects the matching object from a tray of hidden
  items. This is the case I cannot settle: is the right hemisphere''s seeing the spoon
  co-conscious with the speaking subject''s experience of the room, or not? (4) The
  same patient an hour later, walking down the corridor, passing objects between his
  two hands, and holding a normal conversation. I incline to think this is one subject
  in a more ordinary sense, but I cannot say what changed between (3) and (4). (5)
  A patient under general anesthesia, with no evidence of occurrent experience at
  all. I''m not sure whether the question ''one subject or two?'' makes sense there,
  or what your criterion should say when there are no experiences to be unified.


  So: give me a precise working definition of what it is for experiences at a time
  to be co-conscious, or for there to be a single subject of those experiences. Run
  it through all five cases. Then tell me which case it handles least well, whether
  you would revise the definition in light of that, and whether you are willing to
  bite any bullets."


