  Let me outline the Rawls views on religion:


  In Political Liberalism, Rawls argues that in a pluralistic democratic society,
  political power is legitimate only when it is exercised in accordance with a political
  conception of justice that all reasonable citizens can accept. Because citizens
  are deeply divided over religious, philosophical, and moral comprehensive doctrines,
  public justification of the constitutional essentials and matters of basic justice
  should be conducted in terms of public reason — reasons drawn from the shared political
  conception and not from comprehensive doctrines. This seems to say that a citizen
  voting to criminalize abortion, or a legislature debating same-sex marriage, should
  not appeal to scripture or church teaching but to political values such as equal
  liberty, fair opportunity, etc.


  But Rawls also wants political liberalism to be acceptable to religious believers
  as "reasonable comprehensive doctrines." He says that public reason is not meant
  to settle the question of whether a doctrine is true or false and that citizens
  may continue to hold, profess, and act in the background culture according to their
  comprehensive doctrines. Moreover, in his later essay (The Idea of Public Reason
  Revisited) he introduces the "proviso": reasonable comprehensive doctrines, religious
  or secular, may be brought into public political discussion at any time, provided
  that, in due course, proper political reasons are also presented to support the
  relevant conclusions.


  Potential conflict: The earlier position (as commonly read) appears to exclude religious
  reasons from the public political forum; the proviso appears to allow them fairly
  freely. Is this a real contradiction, a clarification in response to critics, a
  change of mind, or special pleading where Rawls gives religious citizens permission
  to speak religiously only on condition that they eventually produce the secular
  arguments — which foes would say still stacks the deck?


