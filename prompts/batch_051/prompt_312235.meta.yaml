  Molinism key ideas:

  - Middle knowledge: God knows, prior to his creative decree, what every possible
  free creature would freely do in any possible circumstance (counterfactuals of creaturely
  freedom, CCFs).

  - This lets God actualize a world where his will is accomplished while creatures
  remain free (libertarian freedom).

  - Three logical moments: natural knowledge (necessary truths), middle knowledge
  (CCFs), free knowledge (contingent truths after decree).


  Key philosophical commitments one might hold:

  1. Libertarian free will (incompatibilism): free actions are not causally determined
  by prior conditions.

  2. Counterfactuals of creaturely freedom have truth-values (CCFs are true or false)
  — sometimes called "grounding" issue: what makes them true? Molinists often say
  CCFs are brute contingent truths not grounded in the creature''s actual will or
  circumstances.

  3. God''s middle knowledge: God knows CCFs prevolitionally, without determining
  them.

  4. God actualizes a world by placing creatures in circumstances in which he knows
  they will freely choose certain things.

  5. Perhaps the novelist holds that God has sovereign control/foreordination over
  history (strong providence).

  6. Maybe a verdict: in the novel, a character freely betrays someone; the novelist
  wants God to have known this "middle knowledge" but not determined it; and God "used"
  it.


