  - Tension between (a) libertarian freedom and (b) God''s strong providential control
  / that God is the "first cause" or grounds all contingent truths. If CCFs are true
  independently of God''s will, then God is not the source of all truth; some truths
  are brutely true apart from God''s creative will. This is the "grounding objection"
  — Adams, Hasker, etc.

  - Tension between CCFs having truth-values and libertarian freedom: some (open theists)
  argue that if it''s true in advance that Peter would deny Christ in circumstances
