  Draft:


  "I''m currently taking an upper-level philosophy of mind course, and one thing has
  been bothering me about the debate over physicalism. Physicalists and their critics
  have been arguing for decades about whether consciousness (or the mental generally)
  is ''physical,'' and yet the dispute seems no closer to resolution than it was in
  the twentieth century. My working hypothesis is that the debate has stalled because
  the two sides never fix what ''physical'' means, and that the stand-off is less
  an empirical disagreement about the world than a disagreement about how the term
  should be used and about what counts as explanatory progress. The structural problem
  is the dilemma usually called Hempel''s dilemma. If ''physical'' means the kinds
  and properties countenanced by current physics, then physicalism is very likely
  false, or at least hostage to every future revolution in physics. But if ''physical''
  means whatever an ideal, completed physics would countenance, then physicalism risks
  collapsing into the empty claim that everything is whatever the true final science
  says it is. Each side seems to occupy whichever horn is convenient: anti-physicalists
  point to the first horn to say physicalism is refuted by phenomena current physics
  cannot capture; physicalists retreat to the second horn to say those phenomena will
  eventually be captured by expanded physics. The result is that neither side can
  pin the other down; the disagreement has become a disagreement about the meaning
  of a term. I want a diagnosis, not a survey. Is this debate a merely verbal dispute
  about the word ''physical''? Or is there a real empirical and metaphysical question
  hiding inside it—e.g., whether the successor of current physics will be continuous
  with it in the relevant respects, or whether the mental is fundamental? And if you
  accept the diagnosis, what would count as progress: a disambiguation of ''physical''
  into several sub-questions, a formal characterization of physical vocabulary, or
  just abandoning the label? Be specific about what each side actually says and why
  the dilemma keeps them talking past each other."


