  Nozick''s tracking theory (from Philosophical Explanations, 1981):

  S knows that p iff:

  (1) p is true

  (2) S believes that p

  (3) If p weren''t true, S wouldn''t believe that p (variation/sensitivity)

  (4) If p were true in slightly different circumstances, S would believe that p (adherence)


  Actually Nozick''s fourth condition: (4) If p were the case, S would believe it.
  (Adherence/variation). Some formulations: S''s belief tracks truth under variation
  in both directions.


