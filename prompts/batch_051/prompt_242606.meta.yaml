  ---

  I would like your credence in the following claim, with the reasoning decomposed
  into explicit components.


  Claim. Jeffrey conditionalization (JC) is the correct general rule for revising
  one''s degrees of belief when the net effect of an experience is uncertain evidence:
  the experience does not make any proposition certain, but it does make the agent
  adopt new unconditional probabilities q₁,…,qₙ over the cells E₁,…,Eₙ of some evidential
  partition. Under JC, the agent''s new credence in any proposition A is P_new(A)
  = Σᵢ qᵢ · P(A | Eᵢ): the new probabilities are distributed across the partition
  by the input qᵢ, while all credences conditional on a given cell Eᵢ are left exactly
  as they were. To fix the target: JC counts as correct only if, for every case in
  which rationality supplies a determinate input distribution over an evidential partition,
  JC''s output is the uniquely rational posterior belief state; it need not solve
  the problem of where the input distribution or the partition comes from.


  Please do not give me a bare number or say "it depends." I want a number between
  0 and 1 for the claim, together with the decomposition that produces it. At minimum,
  give me your credence in each of the following sub-claims and one or two sentences
  of justification per sub-claim:


  1. Irreducibility. At least some rational updates are genuinely cases of uncertain
  evidence: the rational response to the experience cannot be represented, for every
  reasonable prior, as strict conditionalization on some proposition learned with
  certainty about the experience or the world.


  2. Determinacy of input. In the ordinary cases where uncertain evidence is genuine,
  the experience itself supplies, or rationally justifies, a determinate new distribution
  over a privileged evidential partition — as opposed to something weaker such as
  an inequality, a conditional-probability constraint, or a set of permissible distributions,
  which would leave JC without a definite input.


  3. Rigidity. When a rational agent does receive a determinate input distribution
  q over an evidential partition E, the agent should hold all probabilities conditional
  on each Eᵢ fixed. The entire change in every proposition''s probability should be
  due solely to re-weighting the cells.


  4. Partition-boundedness. The update should change probabilities only by re-weighting
  the cells of the partition the evidence directly bears on. In cases where JC''s
  posterior seems to move credence in the wrong place — e.g., when an experience intuitively
  bears only on the relative likelihoods of a coarse partition but wisdom seems to
  require adjusting finer structure one did not condition on — the fault lies with
  an incorrectly specified input or an independent ancillary assumption, not with
  JC itself.


  5. Rivals absent or equivalent. No general alternative to JC — strict conditionalization
  on a learned experience-proposition, minimising some information-theoretic divergence
  (e.g., minimum cross-entropy updating), treating the evidence as a notional experiment
  with a fixed likelihood (virtual evidence), or a non-probabilistic revision rule
  — is extensionally correct in the cases where it disagrees with JC.


  Then explain how you combine these components into your overall number (they need
  not be independent; if you think they are, you may multiply, but tell me what you
  did). Finally, identify the component you are least confident about and describe
  a concrete finding, argument, or case that would most change your credence in it.

