  Draft:


  ---


  I manage grants at the Voss Foundation, a private trust whose articles of incorporation
  confine us to a single, hedonistic criterion: a project may be funded only if, on
  the best evidence we can reasonably obtain, it increases the net pleasure of the
  people it serves, and every form of pleasure is to weigh equally — sensory, intellectual,
  social, aesthetic, or otherwise. The founder was explicit that no pleasure is to
  be preferred merely because it is refined, improving, or productive.


  The practical difficulty is the heterogeneity of the pleasures we are asked to compare.
  The comfort of a warm, dry room for an elderly person in a damp flat shares no obvious
  felt quality with the absorbed concentration of a teenager solving a chess problem;
  the hilarity of a street festival shares little with the quiet satisfaction of being
  free of debt after years of dread. If "pleasure" is not one thing but a loose family
  of different experiences, then the foundation''s criterion may be asking us to add
  incommensurable quantities, and our trustees are increasingly stuck in debates that
  look like disputes about taste.


  I would like you to write a decision procedure my two grant officers — neither with
  philosophical training — can run on each proposal before it reaches the trustees.
  The procedure should take the form of a checklist of questions asked in order, with,
  for each question, a statement of what counts as an adequate answer. It should say
  explicitly where the procedure returns a no and the application is rejected on the
  evidence, where it must stop and hand the decision to a person because the remaining
  question is one of values rather than fact, and where judgment cannot be eliminated
  no matter how carefully the procedure is followed. The procedure must remain faithful
  to the founder''s equal-consideration clause rather than quietly smuggling in a
  preference for refined or productive pleasures, but it must also be usable from
  start to finish within about 45 minutes per proposal, by someone who cannot give
  an account of what pleasure is.


  Then run the procedure on the three typical proposals below, one for each of the
  examples you think matters, and include at least one where it returns an answer
  my trustees will not like — say plainly when that happens. End by stating what the
  procedure cannot do: in particular, whether it resolves the worry that heterogeneous
  pleasures are incommensurable, or only makes that worry manageable at decision time.


  The proposals:

  1. Warm Rooms: a programme of heating subsidies and supervised common rooms for
  elderly residents in poorly insulated flats, expected to produce modest, steady
  sensory comfort and reduced daily aches, with little novelty or development.

  2. Chess in Schools: an after-school chess and problem-solving club for secondary-school
  pupils, expected to produce intellectual absorption and the pleasure of mastery
  for many participants, but with a real risk of frustration and discouragement for
  weaker students.

  3. Street Festival: a monthly open-air festival expected to produce intense but
  short-lived collective joy for a large number of residents, with no credible evidence
  of any lasting effect on mood or satisfaction.


