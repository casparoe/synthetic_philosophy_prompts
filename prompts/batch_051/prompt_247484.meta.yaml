  Here are my verdicts.


  - A master chef who can produce a perfect sauce but cannot write down or explain
  what she does: she knows how to make the sauce.

  - A food scientist who has never cooked but can state, step by step, exactly how
  the sauce is made, including what each ingredient does: I''m inclined to say he
  knows how to make the sauce, or at least something close to it.

  - A novice who memorized the recipe yesterday and recites it correctly: she knows
  the recipe, but I don''t think she knows how to make the sauce.

  - A pianist who can play a piece beautifully but cannot read music or name the chords:
  she knows how to play it.

  - A pianist who, after a hand injury, can describe every movement needed but cannot
  execute it: I still want to say she knows how to play, though I''m less sure.

  - Someone who can answer every question on a written driving test but repeatedly
  fails the road test: I don''t think he knows how to drive.

  - Someone who can drive competently but cannot pass the written test because he
  cannot articulate the rules: I do think he knows how to drive.


  Is there a single principle that gets all or most of these, and what does it say
  about the case I keep going back and forth on: a chess engine that evaluates positions
  perfectly but cannot explain any of its moves — does it know how to play chess?
  If some of my verdicts have to go, which ones, and why?"


