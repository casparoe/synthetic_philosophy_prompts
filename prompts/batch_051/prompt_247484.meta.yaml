  Let me draft:


  "You are a professional philosopher working on the epistemology of collective and
  decomposed reasoning. Think carefully, and begin by stating candidate principles
  before testing them against my cases.


  I''ve been considering an idealized method of deliberation: a single human answers
  a question, but for any subquestion they may consult another copy of the same setup
  — a human with the same question-answering policy — and combine those subanswers
  into their final answer. I''ll call this recursive consultation. I want a principle
  that captures my verdicts about when such a process is trustworthy.


  - If the top-level question is ''Should we fund this project?'' and the subquestions
  are assigned to people who each answer only their narrow piece without knowing the
  top-level context, the result is often worse than one competent person''s holistic
  judgment.

  - If the question is a hard math problem and it is decomposed into lemmas that are
  then checked independently before being combined, the result can be more reliable
  than any single mathematician.

  - If every subquestion is answered by the same person at different times — same
  knowledge, same biases — I don''t see how combining their answers adds anything
  over that person just thinking longer.

  - If the decomposition is done well, I feel the process can be more trustworthy
  than the best individual, even though no step does anything but straightforward
  human reasoning.

  - If the subanswers are combined by majority vote without a model of how they depend
  on each other, I distrust the result even when each subanswer looks fine.

  - I also worry that the whole thing is just laundering one person''s judgment through
  many copies, unless the decomposition introduces genuine checks.


  Is there a principle that captures all or most of these? What does it say about
  a case I haven''t listed: a legal question decomposed into factual and normative
  subquestions, each answered by a different expert, then combined by a single judge?
  And which of my verdicts, if any, should I drop?"


