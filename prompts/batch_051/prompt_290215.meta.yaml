  number.

  5. If you have evidence about model misfit/calibration failure, don''t defer.

  6. Check for undermining: if the chance itself is unstable, treat chance as a random
  variable and use expected chance (the "Principal Principle with uncertain chances").

  7. Judgment calls: determining calibration, admissibility, relevant reference class;
  no procedure eliminates judgment.


