  For Kant''s universalizability tests, a known "proves too much" argument: the "maxim
  description problem" / "rigorism" / "false positives and false negatives." We could
  present an argument that the universalizability test is vacuous because any maxim
  can be redescription to pass. Let me construct a tight chain:


  (1) The categorical imperative''s Formula of Universal Law (FUL) says: act only
  on a maxim that you can at the same time will as a universal law.

  (2) Whether a maxim passes the test depends on how the maxim is specified — what
  counts as the "action" and which circumstances are included.

  (3) Anything can be made to pass by building in the particular circumstances that
  distinguish your case: e.g., "When I am person P at time T in situation S, I do
  X" is a maxim whose universalized version applies only in S, which yields no contradiction.

  (4) So for any act whatsoever, there is a description of its maxim under which the
  agent can will it as universal law.

  (5) And for many acts, there is another description under which it fails (describe
  the same act as "breaking a promise whenever it benefits me").

  (6) Therefore FUL delivers no determinate verdicts: the same act is both permitted
  and forbidden depending on wording.

  (7) But Kant intends FUL to be a decision procedure that rules out e.g. lying promises.

  (8) So FUL is either empty (if we allow maxims to be as specific as we like) or
  a vehicle for unargued moral content (if we don''t).

  Conclusion: FUL cannot do what Kant claims.


  Where does it go wrong? The subtle flaw could be in (3)/(4): Kant''s conception
  of a maxim is not arbitrary; a maxim is a subjective principle the agent genuinely
  acts on, and the agent''s own description constrains the test; you can''t gerrymander
  descriptions at will because a maxim must be that on which you actually act. Also
  step (5) misstates the contradiction: FUL asks whether you can will the maxim as
  universal law, and the contradiction is in conception or in the will. The answer
  costs: give up decision-procedure reading; FUL is a test of form, not a mechanical
  procedure; Korsgaard''s "practical contradiction" reading, O''Neill''s "consistency,"
  Herman''s "rules of moral salience," etc. This is rich and known. The example "everyone
  falsely promises to repay a loan" yields a contradiction in conception because the
