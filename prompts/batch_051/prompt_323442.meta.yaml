  Prompt:


  In its 2003 report Beyond Therapy: Biotechnology and the Pursuit of Happiness, the
  President''s Council on Bioethics writes:


  "Like any other technology, the goals it serves are supplied neither by the techniques
  themselves nor by the powers they make available, but by their human users."


  Consider the following asymmetry in ordinary biomedical judgment. Growth hormone
  given to a child with growth hormone deficiency is classified as therapy: it is
  reimbursed, taught in pediatric endocrinology as standard care, and its use attracts
  little moral controversy. Growth hormone given to an otherwise healthy but very
  short child to make him taller is classified as enhancement: it is often excluded
  from insurance, treated as discretionary, and subjected to extra ethical scrutiny.
  Similar asymmetries recur for methylphenidate used to treat ADHD versus to improve
  normal concentration, for erythropoietin used to treat anemia versus to raise an
  athlete''s hematocrit, and for antidepressants used to treat major depression versus
  to blunt ordinary grief. In each case, the same intervention acts through the same
  biological pathway, but the therapeutic use is considered morally unproblematic
  and socially subsidized while the enhancing use is considered optional or suspect.


