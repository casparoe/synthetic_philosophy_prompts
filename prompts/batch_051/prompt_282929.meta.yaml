  Potential prompt:


  "You are a philosopher of science with a specialization in confirmation theory and
  the epistemology of high-energy physics. I''m preparing a position paper on non-empirical
  theory assessment in string theory and the multiverse, and I''d like you to audit
  my stated commitments for mutual consistency before I defend them in public.


  Here is the package of views I currently hold:


  1. Bayesianism about confirmation. All rational changes in confidence in a scientific
  theory go through the updating of priors on evidence; there is no distinct form
  of ''non-empirical'' confirmation that bypasses the Bayesian machinery.


  2. The No Alternatives Argument is legitimate. The fact that a research community
  has searched hard for a viable rival to string theory and found none is itself rational
  evidence for string theory, even if string theory has so far made no successful
  novel empirical predictions. I take this to be a sound inference, in the spirit
  of Richard Dawid''s non-empirical theory assessment.


  3. Novel predictive success is epistemically privileged. I think a theory''s making
  a surprising novel prediction that is later confirmed (as general relativity did
  with light bending or the perihelion shift) gives stronger confirmation than merely
  accommodating the data it was built to fit. I am inclined to say that no theory
  deserves high confidence without at least one such success.


  4. The multiverse is not confirmable, even in principle. Because any possible observation
  is made from within one universe, it cannot discriminate between a multiverse and
  a single-universe theory that simply has the observed constants as brute initial
  conditions.


  5. Qualitative underdetermination is true: for any theory consistent with current
  evidence, there is at least one empirically equivalent rival. Empirical success
  can therefore rule out many theories but can never single out one unique theory.


  6. Two of Dawid''s other non-empirical considerations also carry weight: string
  theory''s apparently unforced ability to account for phenomena like black hole entropy,
  and its network of dualities, count in its favor as a kind of internal explanatory
  coherence.


