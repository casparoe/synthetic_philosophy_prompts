  Non-empirical theory confirmation: Richard Dawid''s book "String Theory and the
  Scientific Method" (2013) argues string theory can be evaluated by non-empirical
  evidence: (i) the No Alternatives Argument (NAA) — the fact that no viable alternative
  to string theory has been found after extensive search raises confidence in it;
  (ii) the Unexpected Explanatory Coherence Argument (UEEA) — string theory''s unforeseen
  explanatory connections (e.g., black hole entropy, holography, dualities) count
  in its favor; (iii) Meta-Inductive Argument (MIA) from past theories'' success (theories
  that had these features turned out to be empirically successful).


  There are criticisms: Peter Woit and Lee Smolin criticize (Woit "Not Even Wrong";
  Smolin "The Trouble with Physics"). Dawid''s arguments are somewhat Bayesian-controversial:
  in standard Bayesianism, if a theory has no empirical data, only priors can differ;
  NAA tries to objectify priors. Also, "absence of alternatives" can be explained
  by sociological factors (Smolin) or by our lack of imagination; it''s a "survivorship"/selection
  effect. UEEA is puzzling: explanatory coherence without novel empirical predictions—how
  can it confirm unless it''s tied to likelihoods? Yet under Bayesianism, explanatory
  coherence can only confirm via providing a more unified account of existing evidence
  (raising P(E|T) relative to competitors) or via priors.


