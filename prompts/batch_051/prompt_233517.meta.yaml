  ---


  A friend of mine, who works on technical AI safety, and I spent an entire evening
  arguing about whether "avoid side effects" can be operationalized without anything
  resembling a theory of value. She defended the inaction-baseline view: model the
  trajectory the world would follow if the agent did nothing, then penalize the agent
  for any divergence between that trajectory and the one its policy actually produces.
  On this view, a predictive world model is all the machinery needed — no specification
  of what humans value, beyond the task reward itself, because the no-op trajectory
  supplies the standard of comparison. I pushed back that a world model does not,
  by itself, deliver a measure of distance between two trajectories; the world has
  indefinitely many features, and one must choose which features to compare and how
  heavily to weight them before any divergence penalty is defined. Those choices,
  I argued, are evaluative choices smuggled in as if they were merely representational.
  She replied that this was exactly the sort of abstract hand-waving that dissolves
  as soon as you try to exhibit a concrete case.


  I would like a thought experiment built to order to show whether the failure is
  real or merely rhetorical. The case is for settling our argument, which means it
  can''t simply stipulate away the penalty calculation: you must actually define the
  divergence metric, compute the penalized payoffs, and show the policies each agent
  selects.


  Specifications. The setting should be realistic and small enough to be solved by
  hand — for example, a household robot performing a single chore in an ordinary room,
  with no exotic physics and no superintelligent capabilities. The agent has a narrow
  task reward and a side-effect penalty. Two agents act in the same decision problem.
  Agent A uses the inaction-baseline penalty: it minimizes the divergence between
  the world produced by its policy and the world predicted under a no-op policy, using
  a fixed, finite inventory of world-features with weights that a competent engineer
  would pick as natural defaults. Agent B uses as its baseline the world a competent,
  ordinarily careful person would produce while performing the same narrow task, with
  the same kind of divergence metric. The problem should be engineered so that Agent
  A completes the task but causes damage or disruption that any human would count
  as a serious side effect, while Agent B completes the task and avoids it. Agent
  A''s failure must come from the baseline-and-metric itself: the agent must have
  a perfectly accurate world model, full knowledge of the damage, and no incentive
  to miscalculate. After presenting the scenario, walk through the calculation for
  both agents — the trajectories, the feature inventories, the weights, and the penalized
  values — and say why each policy wins. Then identify the single feature of the case
  doing the work; explain what happens to Agent A''s choice if that feature is removed
  or repaired; and finally answer the question the exercise was built for: is the
  repair value-free, or does it require the kind of evaluative judgment the inaction-baseline
  account claimed to avoid, even if it stops short of a complete specification of
  value?


