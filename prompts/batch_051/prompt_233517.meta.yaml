  under an agent''s policy and the trajectory it would have taken if the agent had
  done nothing; to keep an agent low-impact, you add a penalty proportional to the
  size of that divergence, computed inside a predictive world model. On this view,
  no specification of what humans care about is needed beyond the narrow task reward
  itself, because the no-op trajectory supplies the entire standard of comparison.
  I objected that a world model does not by itself define a distance between two trajectories:
  the world has far more features than any finite metric can register, and someone
  has to choose which features enter the comparison and with what weights before any
  divergence penalty exists. Those choices, I argued, are evaluative choices that
  the account smuggles in as if they were merely representational, and that is precisely
  the value specification the account claims to avoid — perhaps not a complete one,
  but an irreducible remainder of one. She replied that this was hand-waving and that
  a concrete case would change her mind.


