  Let me recall ergodicity economics concepts to ensure correctness:

  - Ergodicity: in physics, a system is ergodic if time averages equal ensemble averages;
  for multiplicative stochastic processes (wealth dynamics), the expectation value
  across ensemble and the time-average growth of a single path diverge when fluctuations
  are large.

  - Ole Peters and Murray Gell-Mann (physicists) critique expected utility / expected
  value reasoning in economics; they argue individual decision-makers should maximize
  the time-average growth rate of wealth, not the ensemble average (expected value),
  because a single agent lives one path, not the ensemble. Example: a gamble where
  you flip a coin, heads: wealth +50%, tails: wealth -40%. Expected value per round
  is +5%, so repeated it seems great; but over time the typical trajectory decays:
  time-average growth per round is sqrt(1.5*0.6) ≈ sqrt(0.9) ≈ 0.9487, so wealth shrinks
  about 5.1% per round on average. This is the classic example; average across parallel
  universes increases, but median individual''s wealth decays. The optimal leverage
  / Kelly criterion ties to maximizing log growth, the time-average growth rate.


