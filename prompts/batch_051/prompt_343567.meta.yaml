  slogan makes the deeper point that pictures are a unified symbol system and words
  are the things that fragment us. I''ve also seen the slogan used on design blogs
  to justify everything from emoji to signage to data visualisations. But when I tried
  to pin him down on what exact claim he''s making, he sorted it into different things:
