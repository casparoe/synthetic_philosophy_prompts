  grain counts, and after training the model has an actual, fully determinate decision
  function. The weights give a crisp yes/no cutoff for every possible input, even
  if we never probe most of them and couldn''t say by hand where the boundary ended
  up. That strikes me as epistemicism: there''s a fact of the matter about whether
  11,247 grains is a heap, we just can''t know it.


  Supervaluationism, as I understand it, says instead that the concept is a family
  of admissible sharpenings. A sentence is true if it comes out true on all of them,
  false if false on all of them, and otherwise it''s neither true nor false. So "10,000
  grains is a heap" gets no truth value because some sharpenings put the cutoff above
  10,000 and some below.


  My essay would push the analogy that epistemicism treats one trained model as the
  hidden truth, while supervaluationism treats the concept as an ensemble of acceptable
  models and only counts a classification when the whole ensemble agrees. But I''ve
  got a nagging worry that this setup is rigged: it assumes from the start that there''s
  a space of candidate models sitting around, and the only question is whether one
  or many of them matter. An epistemicist would say no, there''s just the one real
  boundary, full stop. And a supervaluationist might say that a penumbral case is
  not like two ensembles disagreeing—it''s more like a gap in the language itself.


  So: (1) is the classifier-vs-ensemble analogy fair to at least one of these views,
  and which one? (2) Where does it start to leak? (3) If you were editing this for
  software engineers, would you keep the analogy, or would something like fuzzy logic
  or type systems get the idea across better? Mostly I want to know if I''m smuggling
  in an assumption that begs the question against one side.

