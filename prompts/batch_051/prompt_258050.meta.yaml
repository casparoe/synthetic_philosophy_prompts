  I keep going back and forth on how to think about vague predicates, and I want to
  sketch a short essay but I''m not sure the analogy I''m reaching for actually holds
  up. So I''m hoping for comments on the idea itself, not a reading list.


  Here''s the thing. As a software engineer I think of a classifier: if you train
  a model to classify "heap" vs "not heap" from number of grains, the model ends up
  with some actual decision function. The weights and biases give a deterministic
  yes/no cutoff for every possible input, even if you never check most of them by
  hand. That sounds a lot like epistemicism: "11,247 grains is a heap" has a definite
  truth value, we just can''t know it because we can''t introspect the trained boundary.


  Supervaluationism sounds more like: there isn''t one cutoff; the concept is a set
  of admissible sharpenings, and a sentence is true if it comes out true on all of
  them, false if false on all of them, and otherwise it lacks a truth value. So "10,000
  grains is a heap" is neither true nor false because some candidate cutoffs put it
  on one side and some on the other.


  My rough essay idea is that epistemicism looks like treating one trained model as
  the hidden truth, while supervaluationism looks like treating the concept as an
  ensemble of acceptable models and only counting a classification when the whole
  ensemble agrees. But I worry this is a dishonest analogy because it pictures both
  views as if there''s some external set of models hanging around, whereas the epistemics
  would say there''s just one real boundary, full stop, and the supervaluationist
  might say the penumbral cases arent just between-model disagreement at all—they''re
  holes in the language.


  So my questions: (1) is the classifier/ensemble analogy fair to at least one of
  these views, and which one; (2) where exactly does it break; (3) if you were editing
  an essay aimed at other software engineers, would you keep the analogy or replace
  it with something like fuzzy logic or type systems, and why? I mostly want to know
