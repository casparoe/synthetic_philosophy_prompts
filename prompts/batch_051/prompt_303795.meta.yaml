  Hmm wait. Let me recall Jeffrey conditionalization precisely.


  Bayesian conditionalization: upon learning E with certainty, P_new(H) = P_old(H
  | E).


  Jeffrey conditionalization: when evidence is uncertain and your probabilities over
  a partition {E_i} change to new values Q(E_i) for each element of the partition,
  but conditional probabilities given each E_i stay fixed, then P_new(H) = Σ_i Q(E_i)
  P_old(H | E_i). The partition is about the evidence/observation, e.g., {the cloth
  looks blue, looks green, looks ...}. Key assumptions: rigidity (conditional probabilities
  on partition elements unchanged) and that the change is only in the partition''s
  probabilities. Jeffrey''s example: observing a cloth in candlelight, you don''t
  become certain of its color but your probabilities shift.


  So a procedure for a practitioner: how to update when your evidence is partial —
  e.g., a doctor gets a radiology report described with "possible infiltrate, cannot
  rule out pneumonia"; you don''t learn "X-ray shows infiltrate" with certainty, you
  shift probabilities across a set of possible findings. The procedure: (1) fix the
  relevant partition of possible observations, (2) elicit new probabilities over the
  partition, (3) check rigidity (conditional probabilities given each observation
  are stable), (4) apply the formula, (5) flag when rigidity fails (the observation
  process itself changes the conditional story), (6) flag when the evidence bears
  directly on the hypothesis not just through the partition, (7) hand off when values
  enter (treatment thresholds). Worked examples: mammography result? chest X-ray?
  A juror hearing an eyewitness with 80% reliability. One example where procedure
  gives an answer the practitioner won''t like: e.g., a dramatic but unreliable symptom
