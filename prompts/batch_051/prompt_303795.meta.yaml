  ---


  I am a physician in a busy outpatient clinic, and I sit on our hospital''s clinical-decision-support
  committee. We are currently redesigning how clinicians are expected to revise a
  working diagnosis when new information arrives that is itself less than certain:
  a rapid antigen test with a known false-negative rate, a radiology report that says
  "infiltrate cannot be excluded," a consulting colleague''s impression conveyed over
  the phone, a patient''s vague but pointed description of symptoms. The informal
  practice now is either to ignore the uncertainty in the evidence or to throw a gestalt
  number at the problem, and clinicians reach different diagnoses from the same inputs.
  I would like a written procedure, short enough to use during a ten-minute visit,
  that tells the clinician what to do in order. I understand the theory here is Jeffrey
  conditionalization, in the sense that one does not learn a proposition with certainty;
  one redistributes probability over a partition of possible observations while holding
  the conditional probabilities of outcomes given those observations fixed, and then
  recomputes the probabilities of interest. But I do not want to hand my colleagues
  a formula. I want the formula translated into a sequence of concrete steps: how
  to choose the partition, how to elicit the new probabilities over the partition,
  how to detect that the holding-fixed assumption has failed, how to combine two uncertain
  pieces of evidence that arrive at different times, and where the procedure should
  stop and hand the decision to a human being because the step is a value judgment
  or the uncertainty cannot be quantified at all.


  Please write me that procedure, with the following worked applications after it:
  (1) a 45-year-old with a cough and fever whose rapid flu test is positive but the
  test''s false-positive rate is nontrivial and the baseline prevalence this week
  is low; (2) the same patient, whose chest X-ray then comes back with language that
  makes pneumonia more plausible but not certain; and (3) a case where your own procedure
