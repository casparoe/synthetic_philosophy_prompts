  Let me write out:


  "hi! so I''m doing an essay for school on whether evolution ruins the idea that
  creation was good. The exact question is something like ''God saw everything and
  it was good — but if that''s true, why is the fossil record full of animals eating
  each other millions of years before humans existed?'' I''ve got a rough draft of
  my argument and I''d really like some comments before I write it up, because my
  teacher keeps telling me I''ve missed the obvious objection. It''s for an RE competition
  so I want it to be more actually philosophical than just ''the Bible says x''.


  My argument so far is basically this. Loads of Christians (and my granny) think
  that before the Fall there was no death at all, and that''s what ''very good'' means:
  no suffering, no death, vegetarian lions maybe. But if evolution is right that can''t
  be literally true, since the fossil record is full of predation and disease and
  whatnot long before humans showed up. So either creation was never actually ''good''
  in that sense, or we''re using the wrong sense of ''good''.


  I then go for the second option. I make a distinction between a world being good
  as a whole and a world being pleasant for every creature in it at every moment.
  A forest can be an organised, flourishing system even though the individual deer
  gets eaten by a wolf. The wolf eating the deer isn''t a defect in the system; it''s
  the system working. So ''good'' in Genesis might mean ''ordered, complete, fit for
  purpose'' rather than ''morally perfect with no pain''. I''m aware that sounds a
  bit cold, which is one of the things I want comments on.


  My second move is about what the Fall actually does. I say maybe the Fall doesn''t
  introduce death full stop; it introduces death as something that separates humans
  from God, because we''re the kind of creatures who can know we''re going to die
  and can make an identity out of that. Animals don''t, so their dying before the
  Fall is sad but not theologically the same problem. The Fall changed our relationship
  to death rather than flipping a switch that made all death start. Then the verse
  people always bring up about death entering through one man''s sin can be read as
  being about human death-as-separation, not animal death as such.


  Third, I say Genesis isn''t doing paleontology. Its point is that the world is God''s
  ordered project, not a chaotic mess, and the project included a long run-up with
  animals living and dying before humans. That lets me keep evolution and still say
  creation was good. But I keep worrying this makes God look like he sees animal suffering
  as just scaffolding for us, which feels vulgar, and it also makes it hard to explain
  why Paul talks about creation being frustrated and waiting for redemption as if
  something cosmic has gone wrong.


  So the bits I specifically want comments on:


  1. Is the distinction between ''animal death as part of the natural order'' and
  ''human death as separation from God'' actually stable, or does it fall apart when
  you poke at it?

  2. Is my reading of the verse about death entering through sin just wiggling out
  of the plain sense? If so is there a less weak version?

  3. The biggest one: does my whole argument collapse once you consider that animals
  pretty clearly do suffer and fear death? If a fawn dies slowly, that''s not ''ordering'',
  that''s just bad. Is there a way to keep my line without having to say animals can''t
  feel pain, which I think is false and would lose me marks in biology?

  4. Are there any standard objections I haven''t thought of that an examiner would
  expect me to address? (Not references — I can''t use a reading list anyway — just
  arguments.)


  Feel free to be brutal, its only a draft. and sorry if this is a bit rambly."


