  yellow)=.667), and with α-maxmin as long as α small enough? Let''s compute α-maxmin
  for these bets.


  Let r=1/3 known. b∈[0,2/3], y=2/3-b. Events:

  - R: prob 1/3 (interval [1/3,1/3]).

  - B: prob b ∈ [0,2/3].

  - R∨Y: prob 1/3 + y = 1/3 + (2/3 - b) = 1 - b ∈ [1/3,1]; wait b∈[0,2/3] so R∨Y ∈
  [1/3,1].

  - B∨Y: prob 2/3 (known).


  α-maxmin value for gain of 100:

  V(R)=100*(1/3) (since interval degenerate)

  V(B)=100*(α*(2/3) + (1-α)*0) = 100*(2α/3)

  V(R∨Y)=100*(α*1 + (1-α)*(1/3)) = 100*(α + (1-α)/3) = 100*((1+2α)/3)

  V(B∨Y)=100*(2/3)


