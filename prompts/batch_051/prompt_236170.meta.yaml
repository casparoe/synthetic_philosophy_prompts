  Let me think about Parfit''s hitchhiker carefully to ensure accuracy. The classic:
  You''re in the desert, dying of thirst. A driver stops and offers to rescue you,
  but only if you promise to pay him a large sum when you reach town. He can''t enforce
  the promise. To get him to accept, you must genuinely intend to pay, not just say
  you will (because the driver can read your mind / you''re a rational Bayesian and
  the driver knows whether you actually intend). Rationality paradox: you can''t just
  decide to intend to pay because you''ll have no reason to pay once safe; but if
  you can adopt a policy or disposition of following through on promises (or use precommitment),
  you can make it rational now to form the intention, because the expected benefit
  of rescue outweighs the later cost. The "rational irrationality" bit: it''s rational
  to be the kind of person who irrationally follows through (or to be a rule-utilitarian
  / honor your commitments), i.e., adopting commitments that make you act "irrationally"
  later is rational now.


