  Let me craft the content precisely, avoiding quotes. The dilemma has two constraints:

  1. The standard semantics of mathematical language takes mathematical statements
  at face value: they quantify over abstract objects (numbers, sets, functions). So
  a sentence like "there are infinitely many primes" is true only if there are numbers.

  2. A plausible epistemology requires causal connection between knowers and the things
  known.

  These two together make mathematical knowledge impossible (since abstract objects
  are causally inert and outside space-time). The dilemma: reject the semantics, reject
  the epistemology, or accept that mathematical knowledge is mysterious/not knowledge.


  For a CS target vocabulary:

  - Denotational semantics: a program/term is given meaning by mapping it to a mathematical
  denotation (a value in some domain). This is analogous to the face-value semantics:
  the meaning of a term is an abstract object.

  - Operational semantics: meaning is given by reduction rules / execution steps —
  what a machine does, the causal process.

  - Type systems/Curry-Howard: propositions as types, proofs as terms; a proposition
  is "true" if its type is inhabited by a term. This yields an epistemic story: a
  proof term is a constructive object available in computation.


  The translation:

  - "Mathematical truth conditions require abstract objects" → "The denotational semantics
  of a mathematical language maps terms to mathematical values; this is like semantic
  values being abstract objects."

  - "Causal constraint on knowledge" → "Operational semantics/type checking provides
  knowledge via computation; but if meaning is denotational, computation only gives
  us operational behavior, not access to the denotation itself."

  - The dilemma as stated may translate to the tension between denotational semantics
  (external, referential) and operational/proof-theoretic semantics (internal, causal/computational)
  in programming language theory; or the tension between classical model theory and
  constructive type theory.


  Residue report possibilities:

  - Claims about reference and truth-values may translate cleanly (denotations, semantic
  domains).

  - The causal constraint on knowledge may translate only distortedly: operational
  semantics is not an epistemology; computations are causal but don''t put us in touch
  with abstract denotations, just with syntactic representations/computable properties.
  Or it either dissolves or remains.

  - Benacerraf''s concern with "how do we know which abstract objects our terms refer
  to" may map to the problem of canonical forms or adequacy of denotational semantics,
  but not exactly.

  - The residue may indicate the original dilemma carries an assumption (e.g., a causal
  theory of knowledge that CS doesn''t share) or that some of the philosophical issue
  is about the metaphysics of reference, which PL semantics simply stipulates away.


