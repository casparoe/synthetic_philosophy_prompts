  I understand the dilemma roughly as follows. (1) The standard semantics for mathematical
  language takes mathematical statements at face value: a sentence such as ''there
  are infinitely many primes'' has truth conditions that involve numbers as existing
  objects, and numbers, sets, and functions are abstract, causally inert, and outside
  space and time. (2) A plausible causal constraint on knowledge says that in order
  to know about some objects, a knower must stand in some appropriate causal relation
  to them — or at least that abstract, causally isolated objects are epistemically
  inaccessible. (3) Together these seem to imply that mathematical knowledge is impossible.
  The usual options are to reject the face-value semantics, to weaken the causal constraint,
  or to accept some form of mathematical skepticism.


