  Let me craft the theory:


  "I have come to think that dormant statutes split into two kinds, and that the line
  between them is reliance."


  Definitions:

  - A **sleeping law**: one whose triggering conditions are rare or absent; no one
  has had the opportunity to rely on its non-enforcement because there''s been nothing
  to violate. Enforceable when conditions arise, because no legitimate expectation
  is broken.

  - A **dead law**: one that has been openly and repeatedly violated with official
  knowledge without enforcement for long enough that reasonable people have arranged
  their lives on the assumption that the conduct is permitted. Enforcing it retroactively
  is unjust, so it should be treated as repealed until re-enacted with fair notice.


  Central claim / principle: "The normative status of an unenforced statute is determined
  neither by age nor by legislative intent, but by whether enforcement after the dormant
  period would disappoint legitimate reliance. Only that reliance converts a sleeping
  law into a dead one."


  Examples:

  - 1954 emergency curfew never triggered: sleeping.

  - 1968 sign code never enforced though violated all over town; residents spent money
  on signs: dead.


