  if it (1) fails to give ordinary people fair notice of what is prohibited, or (2)
  is so standardless that it authorizes or encourages arbitrary and discriminatory
  enforcement. The "how precise must a criminal law be" question is about the tradeoff
  between using specific rules vs. flexible standards.


