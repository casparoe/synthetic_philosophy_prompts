  Two-dimensional semantics basics:

  - The idea: a sentence/expression has two associated intensions. The primary intension
  is a function from worlds considered as actual to extensions (what the expression
  would refer to if that world is the actual world). The secondary intension is a
  function from worlds considered as counterfactual to extensions, given that the
  actual world is fixed.

  - Motivation: Kripke showed "water is H2O" is necessary a posteriori. A standard
  possible-worlds intension (secondary) alone can''t explain how it''s both necessary
  and informative. Two-dimensionalists add a primary intension: in a world considered
  actual where the watery stuff is XYZ, "water" (primary) refers to XYZ, so "water
  is H2O" is false there considered as actual, though true in all worlds considered
  as counterfactual. Thus necessity + a posterioricity can be represented.

  - Primary intension associated with a priority; "water is H2O" has a contingent
  primary intension (false in some worlds-as-actual), so it''s a posteriori. "Hesperus
  is Phosphorus" similar.

  - Some conflate with Kaplan''s character vs content. Kaplan''s "character" is a
  function from context to content, which is context-dependence; two-dimensionalism
  generalizes world-as-actual vs world-as-counterfactual. Chalmers distinguishes epistemic
  two-dimensionalism (primary intension = epistemic intension, a priori connected)
  vs contextual two-dimensionalism (Kaplan). There are debates about which interpretation
  is right (Chalmers'' epistemic, Jackson''s descriptivism-ish, Stalnaker''s metasemantic).

  - Secondary intension for proper names is rigid: same individual in all counterfactual
  worlds. Primary intension of a name might be something like "the object that actually
  is the source of this token" or a descriptive condition.

  - Common mistake: "primary intension is the meaning / sense / description the speaker
  has in mind." The primary intension is not a psychological description; it''s a
  function defined in terms of how reference depends on how the actual world turns
  out. It can be vague or non-descriptive. Chalmers denies it''s a Fregean sense held
  by the speaker.

  - Another common mistake: "2D semantics says water means ''the watery stuff,'' so
  it''s descriptivism." Not exactly; primary intension isn''t a synonym description
  but a structured epistemic possibility space; still Chalmers sees a link to a priori
  scrutability, but not to speakers'' explicit knowledge.

  - Another mistake: "2D semantics shows that conceivability entails possibility,
  or that minds access primary intensions infallibly." It''s a framework with controversial
  assumptions; idealization of rational reflection.

  - "1-intension" vs "2-intension" mapping: primary to worlds-as-actual, secondary
  to worlds-as-counterfactual.


