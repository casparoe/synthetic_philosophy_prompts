  The knowledge argument: Mary is a brilliant scientist who has lived in a black-and-white
  room and never seen color. She knows all physical facts about color vision. Upon
  leaving and seeing red, she learns something new ("what it''s like to see red").
  Therefore not all facts are physical facts; physicalism is false.


  Standard objections:

  1. Ability hypothesis (Nemirow, Lewis): Mary gains abilities (imagination, recognition,
  memory) rather than factual knowledge / propositional knowledge. Knowing-how vs
  knowing-that.

  2. Acquaintance hypothesis (Conee): Mary gains acquaintance with red experiences,
  not factual knowledge of new facts; knowledge by acquaintance isn''t propositional.

  3. The phenomenal concept strategy / new mode of presentation (Horgan, Loar, Tye,
  Papineau maybe): Mary gains a new phenomenal concept for a physical property she
  already knew under a physical concept; the fact is old, the mode of presentation
  is new. This handles the cognitive significance.

  4. The "Mary learns nothing" / Dennett''s denial: Dennett denies intuition; Mary
  doesn''t learn anything new; the thought experiment begs question. (Dennett says
  she can deduce what it''s like? Or at least it''s not obvious.)

  5. The dual-content/Reductive representationalists etc.


  There are also objections: The knowledge argument assumes that if you know all physical
