  Draft prompt:


  "I am setting the final examination for an upper-level undergraduate course in ethics,
  and I need one essay question on inherited guilt and original sin, treated as a
  problem in moral philosophy rather than as a matter of scriptural exegesis. Please
  produce three things: the essay question, a model answer, and a marking scheme.


  The question should be answerable in 90 minutes and marked out of 20. It should
  be designed so that a candidate cannot pass by reciting familiar material—for instance,
  by summarising the Augustinian contrast between original sin as an inherited condition
  and as imputed guilt, or by rehearsing standard arguments about collective responsibility
  and reparations. Instead, the question should require candidates to construct and
  test a distinction or principle of their own.


  To that end, I would like the question to turn on a specific conceptual crux: the
  difference between guilt, on the one hand—a status properly assigned to an agent
  for that agent''s own voluntary wrongdoing—and, on the other, a transmitted normative
  stain or taint that a person may bear in virtue of descent. A good question might
  ask whether the doctrine of original sin is best reconstructed as a thesis about
  guilt, about taint, about liability, or about benefiting from others'' wrongdoing,
  and whether any version of the thesis is defensible once these are distinguished.
  You may use this structure or improve on it, but the question must force candidates
  to mark and defend distinctions among these notions, and it must not be answerable
  by a summary of any named position or text.


  The model answer should display what a first-class answer does: it should identify
  the relevant notions (at least guilt, taint, liability, and benefit-based responsibility),
  set out the conditions under which a property or status can be transmitted across
  persons, and defend a determinate verdict on whether inherited guilt is coherent
  and, if not, what the best secular reconstruction of original sin is. It should
  not cite texts or seek support from authority.


  The marking scheme should name five must-hit points, the marks each is worth (total
  20), and a one-line note on how candidates typically get each one wrong. For each
  point, the note should diagnose a specific mistake—for example, treating ''guilt''
  and ''taint'' as interchangeable, or assuming that because a doctrine is theologically
  respectable it thereby earns a place in moral philosophy.


  Style and constraints:

  - Write the whole deliverable—question, model answer, and marking scheme—in American
  English.

  - Do not include a bibliography, reading list, or any request for citations; the
  question should not depend on recall of particular texts.

  - Aim for the question to be clear enough to be answered by someone who has studied
  ethics but has not taken a specialist course in the philosophy of religion."


