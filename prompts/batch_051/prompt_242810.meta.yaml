  a real-valued utility function u and a probability measure p such that, for every
  pair of options, the agent weakly prefers one to the other exactly when its expected
  u is at least as high. But this definition seems to me to get several cases wrong,
  or at least to sort them too crudely, and I want it repaired or replaced.


  Here are the cases as I see them.


  1. A person who pays a small fee to trade an apple for a banana, then pays again
  to trade the banana for a cherry, then pays again to trade the cherry back for the
  apple. I take this person to be the clearest possible non-maximizer: their preferences
  cycle, and no u and p of the sort above can represent them.


  2. A person who, in every choice, maximizes expected monetary value and nothing
  else. I take this person to be a maximizer, if a boring one.


  3. A person with the usual Allais pattern. In one choice they take a certain one
