  Since I retired from the natural sciences and took up philosophy, I have been struck
  by how often a debate that looks empirical turns on what, in my old field, would
  have been settled by an operational definition. The dispute over psychological egoism
  seems to me the purest case, and it is a dispute that has visibly stalled. One side
  holds that every human action is ultimately motivated by self-interest; the other
  side points to soldiers falling on grenades, anonymous donors, and parents who ruin
  their health for a child. The egoist replies that these are disguised self-interest
  — the soldier avoided a life of shame, the donor purchased self-approval, the parent
  could not bear the guilt. The critic then objects that the thesis has been made
  unfalsifiable, since any action can be redescribed as serving some interest of the
  agent. The egoist answers that the theory is not ad hoc: it is a substantive claim
  about the hidden springs of action, supported by introspection and by the selective
  pressure to seek one''s own survival and reproduction. Each side treats the same
  behavior as evidence for its own view, and that is where the exchange usually stops.


  My hypothesis is that this is really several disagreements held together under one
  heading, and that the descriptive dispute keeps borrowing heat from a different,
  normative one — namely ethical egoism, the view that one ought to pursue one''s
  own interest. People often resist psychological egoism because they fear it licenses
  selfishness, while its defenders sometimes write as though showing altruism to be
  an illusion would settle what we owe one another. I would like a diagnosis of the
  structure of the disagreement rather than a verdict on who is right. Is the core
  disagreement verbal, a difference about what would count as evidence for a claim
  about ultimate motives, a clash of bedrock intuitions that neither side can argue
  for, or a hidden factual question that has never been stated in testable form? And
  given your diagnosis, what would count as progress — a distinction, a reframing,
  a concrete experimental prediction — or is there reason to expect that none is available?


