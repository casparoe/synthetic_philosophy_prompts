  "Since retiring from a career in the physical sciences, I have been reading moral
  psychology, and I keep returning to a dispute that has an odd, familiar shape: it
  has run for a very long time without any side moving, and yet it seems to be about
  a question of fact. The dispute is over psychological egoism — the thesis that every
  human action is ultimately motivated by self-interest, whatever its surface appearance.
  The critics bring cases that look like genuine altruism: a soldier who throws himself
  on a grenade, an anonymous donation that no one will learn about, a parent who ruins
  her health caring for a child. The egoist replies that these cases are not what
  they seem: the soldier could not live with the shame of doing nothing, the donor
  buys a feeling of worth, the parent would be unable to bear the guilt of neglect.
  The critic then objects that this strategy makes the theory unfalsifiable, because
  any behavior can be redescribed as serving some interest of the agent. The egoist
  answers that this is not ad hockery but a substantive theory about hidden motives:
  behavior alone is poor evidence, but introspection, and the evolutionary pressure
  for self-preservation, point the same way.


  I have a working hypothesis, and I would like it examined rather than affirmed:
  the impasse persists because the two sides disagree about what would count as evidence
