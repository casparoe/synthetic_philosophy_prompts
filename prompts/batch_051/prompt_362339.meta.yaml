  Domain: Bayesian convergence theorems and washing out of priors. The known subtleties:


  - Merging of opinions theorem (Blackwell-Dubins): If two agents'' priors are mutually
  absolutely continuous (agree on which events have probability zero), then their
  posterior distributions merge in the sense that total variation between their predictive
  distributions goes to zero almost surely under the true probability, as data accumulate.
  If priors are not mutually absolutely continuous, even with infinite data they may
  not merge; one can be certain of a false hypothesis? Actually consistency requires
  the true parameter be in the support; if a prior assigns zero probability to the
  true model, never learns.


  - Finite vs infinite: "wash out" happens in the limit, but for any finite n, priors
  can be far apart if initial weights are extreme; no finite-time guarantee. So appealing
  to convergence to defuse actual disagreement is invalid for any actual future.


  - Convergence theorems are about predictive distributions, not about posterior probabilities
  of arbitrary hypotheses; also they require known likelihoods/model; in philosophy,
  we don''t have agreed likelihoods.


  - "Washing out of priors" can fail with nonparametric/high-dimensional models (posterior
  inconsistency).


  - Another subtlety: Objective Bayesianism claims priors can be chosen by symmetry
  or maximum entropy; washing-out is then less central. Subjective Bayesianism relies
  heavily on convergence to argue priors are harmless. Tension: if you think priors
  reflect subjective opinion and are arbitrary, convergence gives a reason; but convergence
  requires absolute continuity/disjoint support—if two subjective priors put probability
  one on different model classes (e.g., one includes sparsity, another doesn''t),
  they won''t wash out. So the same subjectivism that makes convergence needed undermines
  its conditions.


