  Full draft:


  ---


  I spent my career in the physical sciences and have only recently turned to philosophy.
  The question I keep returning to is what deterministic chaos does to the Laplacian
  picture, in which a sufficiently powerful intelligence could compute the entire
  future from a complete description of the present state. I would like to work through
  a variation on the familiar thought experiment.


  Recall the standard version, free of any technical apparatus: a demon is given,
  at one moment, the exact positions and momenta of all particles and the governing
  laws, and is powerful enough to derive from them the whole future and the whole
  past. Now amend it as follows. The universe is deterministic in the strict sense—a
  state at one time fixes exactly one successor state—but it is chaotic: a small error
  in specifying a state grows roughly exponentially, with a Lyapunov doubling time
  of one hour. The demon really is given the exact microstate, so there is no initial
  measurement error. But the demon is finite. To convert the exact state into an actual
  forecast of later events, it must run some finite computational procedure—a numerical
  integration with a nonzero time step, a truncated series expansion, a finite-cell
  phase-space simulation, or the like. Any such procedure carries a local error δ
  at each stage. Beneath that resolution the computation cannot track the true trajectory,
  and the unresolved discrepancy is amplified by the same exponential growth that
  defines the chaos. It follows that for any fixed δ there is a finite horizon beyond
  which the demon''s forecast is no more correlated with the true state of the system
  than a point drawn at random from the same attractor; making δ smaller pushes the
  horizon back only logarithmically.


  Work through what this variation does to the original argument. Does the Laplacian
  picture tacitly require, in addition to determinism, a completed infinite computation—an
  idealization that is doing more work than is usually acknowledged? Is the resulting
  gap between determinism and predictability purely epistemic, a matter of our limited
