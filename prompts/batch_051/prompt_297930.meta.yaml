  ¬Kp impossible — thus no unknown truths, i.e., all truths known. Actually the conclusion
  is that if knowability holds, all truths are known (or at least there''s no unknown
  truth in the relevant sense). The paradox is that the seemingly weak "every truth
  can be known" entails "every truth is known."


