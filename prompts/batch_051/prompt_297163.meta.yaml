  - Early Wittgenstein (Tractatus): meaning of a word is object it refers to; meaningful
  language pictures possible facts; propositions true/false by agreement/disagreement
  with reality; what cannot be said (ethics, aesthetics, religion, the mystical) must
  be passed over in silence.

