  The causal exclusion argument in brief: Suppose the physical domain is causally
  closed: every physical event has a sufficient physical cause. Mental states are
  realised by physical states but are not identical to them (non-reductive physicalism).
  If a mental event M causes a physical event P (a behaviour), and M is realised by
  physical event P*, then P* is also a sufficient cause of P. So P is overdetermined
  by both M and P*, unless M is reducible to P*. To avoid the unacceptable overdetermination,
  M is excluded as a cause — mental causation is an illusion (epiphenomenalism) or
  we must reduce M to P* (reductionism). That''s the trilemma: eliminativism, reductionism,
  or accept mental causes are excluded.


  The software/hardware analogy: The mind is like a program running on the neural
  hardware. The exclusion argument seems to trade on treating "higher-level" causes
  as if they must compete with their physical realisers. But no one says a program
  is causally inert because the hardware does all the work. The program''s execution
  consists in hardware activity; the distinction between levels is one of description,
  not competition. Hence mental causation is no more mysterious than software causation.
  That conclusion: to license the view that non-reductive physicalism is unproblematic.


  But does the analogy hold? Mapping: software ↔ mental states/processes; hardware
  ↔ brain/neural states; execution/trace ↔ the physical realisation; inputs ↔ sensory
  inputs; outputs ↔ behaviour; program instructions ↔ what, beliefs/desires?; source
  code ↔ innate/learned structure; memory ↔ stored data. The causal powers of software
  are nothing over and above the hardware''s causal powers; if you say "the program
  caused the output," you''re giving a functional description of hardware events.
  So the analogy may actually serve the reductionist/functionalist, not the non-reductive
  dualist. Crucially, for exclusion the question is whether M is identical to P* or
  distinct. In software, the "program level" is not a separate thing over and above
  the physical state of the machine in the sense of producing extra force/energy;
  its causal efficacy is the hardware''s. Thus the analogy dissolves "exclusion" by
  making levels not compete, but that may be because it quietly assumes the program
  is just an abstract description of hardware states (a form of reduction/identity),
  so it can''t support the non-reductive conclusion that the mental is distinct but
