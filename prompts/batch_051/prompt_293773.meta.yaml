  I write about science and ideas for a general audience, and I have been reporting
  on a museum conservation lab that restores ancient terracotta figures. What unsettles
  me is the way the institution uses the notion of sameness. A clay figurine arrives
  in fragments, is reassembled with modern adhesives, the gaps are filled with synthetic
  material, a missing arm is modeled from new clay and fired, and at the end the accession
  record continues to describe one object with one inventory number, now displayed
  as a single fifth-century BCE figurine that has been restored. The same museum,
  however, will describe a modern cast made from the original molds as a copy rather
  than the original, and will catalogue a Roman marble version of a lost Greek bronze
  as a separate work rather than the same work in a different material. So the institution
  lets an object survive the loss and replacement of much of its original matter,
  while refusing to let identity survive the reproduction of its form in new matter,
  however faithful.


