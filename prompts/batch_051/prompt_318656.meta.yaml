  Let me draft:


  ---


  I teach philosophy of mind and for the last few weeks my research group has been
  stuck on a single argument about whether the "symbolic" level ever does any real
  causal work or whether all the pushing happens down in the substrate. We keep trying
  to pin the question down with two toy cases, and I''d like a diagnosis rather than
  another rundown of who said what.


  Here are the toys. By a careenium I mean a huge machine whose parts are just mindless
  physical bits—levers, balls, latches, whatever—that collide and exchange momentum
  in completely boring ways. But the machine is laid out so cleverly that whole populations
  of bits move around in patterns that can be read as symbols, rules, and sequences:
  at the high level the careenium can be described as trying things, remembering a
  previous attempt, even making a mistake and correcting it. You can predict what
  it will do either by tracing the micro-collisions, or by reading the symbols. By
  simmballs I mean the same idea in software: little simulated balls on a lattice
  whose local bounce-and-stick rules implement a simple logic task, say turning a
  string of black and white cells into a judgment about which color is in the majority.
  The camp I''ll call substrate-first says that in both cases the symbol-level story
  is a useful compression and nothing more; every "symbol push" can be replaced without
  remainder by ball-level pushes, so the symbols are real patterns maybe, but epiphenominal
  bookkeeping. The pattern-realist camp says that the symbol-level states pass every
  difference-making test there is: changing the symbol changes downstream motion,
  the symbol-level generalization supports counterfactuals and interventions more
  robustly than the micro story does, and excluding symbol-causes would either blow
  up to the claim that nothing above particle physics ever causes anything, or reveal
  a special animus against minds. Everyone agrees on all the micro facts and on the
  high-level regularities; we''ve simulated and re-simulated the thing; nobody moves.
  We''ve sort of concluded the talk passed each other for years.


  My working theory is that the fight is not about the careenium at all but about
  what "cause" is. Some of us seem to require a push in the sense of a transferred
