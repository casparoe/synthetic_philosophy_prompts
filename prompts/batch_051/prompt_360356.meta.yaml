  I am a journalist who covers science and ideas, and I am writing an essay about
  Daniel Dennett''s ladder of Darwinian, Skinnerian, Popperian, and Gregorian creatures.
  My working question is whether this is best read as a taxonomy of four genuinely
  distinct kinds of mind, or as a continuum with only one or two principled breakpoints;
  I would like your help arriving at an appraisal I can defend in print.


  Here is the version of the ladder I am working with. The shared engine is generate-and-test,
  and each rung moves the testing of candidates into a faster or cheaper arena. Darwinian
  creatures can test only via natural selection, which discards whole lineages across
  generations. Skinnerian creatures add a within-lifetime loop in which individual
