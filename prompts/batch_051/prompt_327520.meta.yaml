  ---


  The Sphex wasp exhibits a familiar form of mechanical rigidity: it drags a paralyzed
  cricket to the edge of its burrow, leaves it, inspects the burrow''s interior, then
  returns to haul the cricket inside; if an experimenter moves the cricket a few inches
  while the wasp is inspecting, the wasp will drag the cricket back to the edge, leave
  it, and re-inspect the burrow, repeating this cycle indefinitely rather than simply
  carrying the cricket in on the same visit. The wasp appears to follow a fixed "check,
  then deliver" routine, unable to integrate the novel fact that it has just inspected
  the burrow and that the cricket''s displacement was caused by outside interference.


  Philosophers sometimes use this example to mark a difference between mechanical
  rigidity and genuinely flexible agency: the wasp is moved by a triggering condition,
  not by a reason, whereas a flexible agent can notice that its routine has been interrupted
  and adjust its plan in light of how things actually are. Hidden in that contrast
  is a conceptual claim: that there is a difference in kind between a system whose
  behavior is generated by fixed, environment-triggered routines and a system whose
  behavior is guided by representational uptake of the situation, and that this difference
  matters for free will.


  Your task: propose an empirical research program that could test whether this difference
  is a difference in kind or only one of degree, and specify exactly what such a test
  would and would not settle.


  Concretely: design an experiment (behavioral, cognitive, and/or comparative) that
  could distinguish a sophisticated agent that only runs richer and more numerous
  sphex-like routines from an agent that represents the interruption as a reason to
  revise its plan. Use either nonhuman animals, human participants, or artificial
  agents as you see fit. State what result would count as evidence of each kind of
  underlying architecture. Then say what residue remains untestable: what part—if
  any—of the folk distinction between "blind routine" and "acting for a reason" would
  survive a positive result on either side, and whether any behavioral test could
  ever show that the agent''s flexibility is incompatible with a fully mechanistic
  account of it.


