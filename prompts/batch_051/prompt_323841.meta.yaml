  "Next week I present, at a joint statistics–philosophy seminar, my thesis that the
  standard three-way taxonomy of interpretations of probability—frequentism, subjectivism,
  propensity—is not a partition of coherent positions but a pair of distinct concepts
  with an error theory attached. My two claims are: (1) there are two distinct probability
  concepts, an epistemic one (graded rational belief relative to an information base)
  and an ontic one (a single-case disposition of a setup to produce outcomes), and
  they answer different questions; (2) frequentism is best reconstructed as a failed
  attempt to define the ontic concept purely extensionally, while subjectivism errs
  by treating the epistemic concept as the whole of probability and dismissing the
  ontic concept as a reification. My argument sketch: I start from cases where a rational
  person assigns a probability to a one-off event (e.g., a particular patient''s response
  to an untested drug) that cannot be parsed as either a relative frequency in an
  actual sequence or a mere feeling; I argue that both frequentist and subjectivist
  attempts to paraphrase such assignments away either change the subject or leave
  the scientific practice unexplained; I then argue that the two concepts are not
  rivals because they have different satisfaction conditions, and that resistance
  to this dualism comes from a tacit ambition to find one formal semantics for all
  probability talk.


