  ---


  I''ve been arguing with a friend about whether the standard resolution of Maxwell''s
  demon still does the work people think it does. The canonical story, as I understand
  it, is roughly this: the demon could in principle measure and act without dissipating
  heat (the measurement can be made reversible), but the demon''s memory has to be
  reset at the end of each cycle so it can start fresh, and erasing one bit of information
  in an environment at temperature T costs at least kT ln 2. That erasure cost is
  what keeps the second law intact: the demon never violates it; it just borrows and
  pays back with interest. The story depends, however, on a fairly clean architecture:
  a gas in a box, a partition, a demon that measures which side a molecule is on,
  extracts work, and then resets a well-defined memory register.


  The development that has been nagging at me: over the last couple of decades people
  have built and studied autonomous Maxwell demons and information engines — microscopic
  machines where measurement, feedback, and the dissipation associated with memory
  reset are not separated into distinct phases, or even cleanly assigned to different
  parts of the system. The demon is a thermalized ratchet rather than an agent with
  a memory that gets erased at a specific time; work is extracted continuously, and
  the "erasure" is smeared through the same dynamics that does the measuring. In that
  setting I can''t point to a step in the cycle and say "there, the demon pays the
  entropy bill."


