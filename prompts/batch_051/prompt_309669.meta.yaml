  "In reading Joseph Bertrand''s Calcul des probabilités, I keep getting stuck on
  his treatment of what has come to be called Bertrand''s paradox. As he presents
  it, the question is simple: a chord is drawn at random in a circle; what is the
  probability that it is longer than the side of the inscribed equilateral triangle?
  Bertrand lays out three equally natural ways of making ''drawn at random'' precise
  — choose the two endpoints uniformly on the circumference, choose the chord''s distance
  from the centre uniformly along a radius, or choose the chord''s midpoint uniformly
  inside the circle — and they yield 1/2, 1/3, and 1/4 respectively. He takes the
  example to show that an unspecified random choice in a continuous space has no well-defined
  mathematical meaning.


  I accept the principle of indifference, or at least its spirit: when a set of possibilities
  is truly symmetric and exhaustively specified, equal probabilities are the only
  non-arbitrary assignment. And I share Bertrand''s more deflationary conclusion that
  ''at random'' without a generating procedure is incomplete. But I also cannot shake
  the feeling that if someone actually performed a physical procedure one of those
  three descriptions singled out — for instance, dropping a long needle onto a circle
  and accepting the chord it lands as — the question would have a unique answer, and
  any competing answer would simply be answering a different question. What I want
  to know is how to locate the clash. Is the firm intuition simply the harmless claim
