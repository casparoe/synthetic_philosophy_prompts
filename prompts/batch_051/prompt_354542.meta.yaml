  the intuition to be the part that goes, what it would take for the theory to be
  the part that goes, and whether there''s a coherent reading on which both survive
  (for instance, some sense in which I can stand behind the policy but still regard
  the actual hand-over of the $100 as causally inert and not "doing good"). Is my
  reluctance to pay tracking something real about causation, or is it just branch-chauvinism
  dressed up as scientific hygiene?"


