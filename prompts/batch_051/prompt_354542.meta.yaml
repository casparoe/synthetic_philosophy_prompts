  this: it flips a fair coin. If heads, it asks you for $100. If tails, it pays you
  $10,000 — but only on the condition that you would have paid in the heads case.
  It now says the coin came up heads and asks for the $100.


  The argument for paying seems, on paper, unassailable. Before the coin was flipped,
  I''d have chosen the policy "pay if asked" over "pay nothing if asked," because
  the first policy expects 0.5($10,000) − 0.5($100) = $4,950 and the second expects
  $0. The predictor isn''t responding to this particular act after the fact; it''s
  keyed to the whole decision procedure — to what I''m the kind of agent who does.
  That, I gather, is the point of updateless decision theory: you evaluate the strategy,
  not the update.


  And yet. Here and now, the coin has landed. My actual $100 buys nothing in this
  world; the tails reward is in a branch I am not in, and the predictor has already
  settled the account. Paying feels like the purest kind of mugging — I''d be the
  guy in the lab who pays a vendor for a confounder that was fixed last week. My old
  instict says: only actual consequences of actual acts count, and by that measure
  the answer is obviously don''t pay.


