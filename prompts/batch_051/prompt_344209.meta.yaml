  Option: Van Fraassen''s Reflection principle. This is decision-theoretic/epistemological:
  the principle says your current credence should match your expectation of your future
  credence (if you know you''ll update in a certain way, you should update now). There''s
  a classic violation: the "Muddy faces"? Actually the famous counterexamples: forgetting
  (self-doubt), cognitive impairment, deliberately not updating... The Reflection
  principle says P now(A | P later(A)=r) = r. Violations: if you''re going to have
  a posterior that''s conditioned on more info, but the info isn''t yet available,
  reflection seems reasonable; violations arise in cases of expected irrationality,
  memory loss, or evidence destruction.


