  public reports and budget decisions, so getting the basic architecture wrong early
  is expensive and hard to correct later. I have heard that social scientists have
  a long-running debate called methodological individualism versus holism: roughly,
  whether explanations of social outcomes need to bottom out in the choices and interactions
  of individual people, or whether social-structural facts — institutions, norms,
  group identities, inequality, segregation — can be legitimate explanatory units
  of their own. I do not know the details of the debate, and I am not asking for a
  survey of it. I want its usable content turned into a decision procedure I can actually
  run at the start of a project.


  Please write me a reusable procedure for deciding, for a given simulation project,
  how the model should represent the social world: at the level of individual agents
  (with heterogeneous attributes, local interactions, and emergent aggregate outcomes),
  at the level of structural or aggregate variables (with relationships among group-level
  or system-level quantities), or as some explicit combination of the two. My team
  can rarely build both versions and compare, so the procedure must let us commit
  early and give my non-modeling director a written rationale she can sign off on.


  Please give me the procedure in plain language, as questions to ask in order, with
  the following: what counts as a sufficient answer to each question; where the procedure
  stops and says "individual-level model" or "structural-level model"; where it says
  "mixed or multilevel, with a specified interface between the two"; and where it
  stops and hands the decision to a person because the choice depends on a theoretical
  commitment, a value judgment, or a guess about the target system rather than on
