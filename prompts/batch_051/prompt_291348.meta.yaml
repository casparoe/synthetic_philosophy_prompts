  (like who is segregated, what the law is, or what people believe others expect)
  but those structural facts are themselves produced by individuals, and systems where
  a structural pattern is compatible with many different individual-level mechanisms.
  I also need you to be honest about where the procedure will misfire.


  Then run the procedure on these three proposals, and show the path it takes in each
