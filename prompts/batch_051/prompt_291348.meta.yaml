  1. A model of how a rent-subsidy lottery affects which neighborhoods recipient families
  move into, and through that whether school segregation changes over five years.


  2. A model of how a county''s public-health campaign about vaccine clinic locations
  changes no-show rates in different communities, given that the campaign reaches
  some communities through trusted local organizations and not others.


  3. A model of how a change to a social platform''s harassment-reporting flow changes
  the rate at which users report harassment, given that reporting norms differ sharply
