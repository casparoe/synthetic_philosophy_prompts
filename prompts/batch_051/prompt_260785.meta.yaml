  B: The two sides of this triangle are things that are equal to the same.

  Z: The two sides of this triangle are equal to each other.

  The Tortoise accepts A and B but refuses to accept Z unless there is a rule C: "If
  A and B are true, Z must be true." Achilles writes C in the notebook; Tortoise accepts
  C but still refuses to accept Z unless there''s rule D: "If A and B and C are true,
  Z must be true." Infinite regress. The moral: you can''t turn an inference into
  a premise; rules of inference are not premises; acceptance of a rule (modus ponens)
  is something you do, not a further premise. The problem for justification of deduction:
  can deduction be justified without circularity or regress? It connects to the question
  of whether logic is normative, whether there''s a skeptical problem about deduction.


