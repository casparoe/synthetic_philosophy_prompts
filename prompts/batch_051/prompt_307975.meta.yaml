  I was reading Sellars''s EPM and got stuck on a reconstruction that seems to prove
  too much. He argues (roughly, i''m not quoting) that the "given" is a myth because
  if you treat something as a pre-conceptual sense-datum that imposes itself on the
  mind, then it can''t be a reason for a belief—it''s just a cause; but if you treat
  it as a cognitive item that can justify, it already involves conceptual capacities
  and so isn''t merely given. My seminar came up with this argument:

  (1) All justified empirical beliefs are justified either inferentially or non-inferentially.

  (2) Non-inferential justification must come from something that is not itself a
  belief or a propositionally structured thought.

  (3) If that thing is not belief-like or conceptual, it can stand in causal but not
  rational relations to a belief.

  (4) If it is belief-like or conceptual, it already needs justification and so cannot
  confer non-inferential justification.

  (5) So no empirical belief is non-inferentially justified.

  (6) But most empirical beliefs are not inferentially justified; so almost no empirical
  beliefs are justified.

  (7) That''s absurd; so the myth-of-the-given argument must be flawed.

  I don''t want to reject (6) because that looks like ordinary scientific and perceptual
  knowledge. But (3) and (4) look airtight once you accept Sellars''s dichotomy. Which
  step should go, and what do I pay for rejecting it? Give me exactly five points,
  each a sentence or two, no intro or conclusion.


