  The paradox of blackmail: If A threatens to reveal embarrassing information about
  B unless B pays A, A commits blackmail (illegal). Yet it would be legal for A to
  reveal the information (unless defamation? if true, not defamation), and legal for
  A to ask B for money (or sell silence?) Actually there are nuances: it''s legal
  to reveal the truth; legal to ask for money; but illegal to combine them: "Pay me
  or I''ll reveal." Why? Two legal acts (or permissible acts) combine into an illegal
  act. The paradox is about the moral/legal puzzle.


  Classic form:

  1. It''s lawful to gossip/reveal embarrassing truth.

  2. It''s lawful to ask someone for money.

  3. It''s unlawful to threaten to reveal embarrassing truth unless paid.

  Why is the whole illegal when each part is legal?


  Also moral version: is blackmail morally wrong, and if so, why? The theory of "two
  rights make a wrong" / incompatibility of entitlements: maybe the information belongs
  to the blackmailer''s free speech but the victim has privacy; etc.


