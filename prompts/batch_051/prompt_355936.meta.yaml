  Potential prompt text:


  ---

  I have recently joined a local citizens'' assembly on a contested housing measure,
  and I keep hearing both sides claim that their position is "what the people actually
  want." That led me back to Rousseau, and to this passage from The Social Contract,
  Book II, Chapter 2, "That Sovereignty is Indivisible":


  "Sovereignty, for the same reason as makes it inalienable, is indivisible; for will
  either is, or is not, general; it is the will either of the body of the people,
  or only of a part of it. In the first case, the will, when declared, is an act of
  Sovereignty and constitutes law: in the second, it is merely a particular will,
  or act of magistracy — at the most a decree."


  But when I try to apply it, I fall into an argument that ends somewhere plainly
  false. I cannot find the exit.


  (1) By the quoted principle, a will is general only if it is the will of the body
  of the people as a whole; if it is the will of only a part, it is not general and
  cannot constitute law.

  (2) For the body of the people to will something as a body, the people must actually
  do the willing: the decision must issue from the collective itself, not from a part
