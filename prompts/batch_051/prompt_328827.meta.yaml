  "Please write a dialogue of about 1,200–1,500 words between two engineers who model
  Daniel Dennett''s ''careenium'' thought experiment. Set the scene briefly: a shallow,
  nearly frictionless dish sealed under a transparent dome contains thousands of identical
  steel microspheres — the simmballs — which glide and collide by simple, fully deterministic
  rules, each trajectory fixed by initial conditions and the geometry of the bowl.
  From above, the aggregate displays coarse, shifting regularities — transitory clusters,
  circulation, a bulge that leans toward one wall — and the two engineers have built
  a coarse-grained program that tracks these aggregates and labels some of them as
  symbols: a compact triangular cluster that functions as an ''exit'' flag, a ring-shaped
  flow that encodes a count, and so on. The labeled symbols are visible in the aggregate
  but are not a separate stuff: they just are arrangements of simmballs. The question
  between the two characters is whether these symbols — and the coarse regularities
  they track — genuinely push the substrate around, or whether all the pushing happens
  among simmballs, with the symbolic level riding on top.


  Character A (the ''pattern driver''): defends the view that the symbolic level has
  real causal work to do... Character A should argue that (1) the symbolic configurations
  make a difference to which microstates are available, (2) the same pattern is realizable
  by countless micro-arrangements, and regularities at the pattern level support robust
  counterfactuals, (3) interventions phrased at the symbol level (e.g., ''move the
  exit flag to the left'') are the only feasible way to control the system, and (4)
  denying that the symbols push reduces causal explanations to an unusable catalogue
  of collisions.


  Character B (the ''substrate-only''): defends the view that every swerve of every
  simmball is fully settled by local mechanical causes, so the symbolic level cannot
  be a further source of push; it is a compressed description... B should argue that
  (1) the symbol labels pick out nothing over and above the simmballs, (2) the apparent
  top-down causation is really bottom-up bookkeeping once the boundary conditions
