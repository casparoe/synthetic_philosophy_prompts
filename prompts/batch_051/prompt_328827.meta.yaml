  ---


  Please write a dialogue between two engineers arguing about a careenium — a thought
  experiment of the sort Daniel Dennett has described, which we can specify like this.
  A shallow, nearly frictionless dish, sealed under a transparent dome, contains a
  few thousand identical metal microspheres, the simmballs, which glide and collide
  according to simple, fully deterministic rules; each trajectory is settled entirely
  by the initial positions and momenta plus the collisions and the geometry of the
  bowl. Seen from above, the aggregate shows transient large-scale regularities: a
  cluster that slowly circulates, a bulge that leans to one side, a jittering front
  that advances and retreats. The two engineers write a coarse-grained program that
  tracks these regularities and labels some of them as symbols — a tight triangular
  cluster functioning as an "exit" flag, a ring-shaped flow encoding a count, and
  so on. The symbols are not a separate material: they just are arrangements of simmballs,
  identified by their functional roles in the aggregate.


  The disagreement: does the symbolic level — the labeled patterns and the coarse
  regularities — genuinely push the substrate around, or is all the pushing done by
  the simmballs, with the symbolic level riding on top as a compressed description?


  The first engineer, the pattern-driver, should defend these commitments intelligently:
  the microphysics is respected, and yet the symbolic level has real causal work to
  do, because the same pattern is realizable by indefinitely many micro-arrangements;
  robust regularities and counterfactuals live at the level of the symbols; interventions
  phrased at the symbolic level (remove the exit flag, reverse the count) are the
  only feasible way to manipulate the system; and a catalogue of collisions, while
  complete, is not the causal explanation we need.


  The second engineer, the substrate-only engineer, should defend the contrary commitments
  with equal intelligence: every swerve of every simmball is fully settled by local
  mechanical causes, so the symbolic level adds no further push; the symbols are real
  enough as descriptions but have their causal powers only through the simmballs that
  realize them; the apparent top-down control disappears once boundary conditions
  are written out; and an intervention like "remove the exit flag" is itself a physical
  disturbance of the dish, not proof of downward causation.


  The dialogue should contain genuine back-and-forth: each character should reply
  to the other''s actual arguments, each should be able to score points and make concessions,
  and neither should be a strawman. At some point, have one character propose a concrete
  intervention — tilting the dish, magnetizing a subset of the simmballs, adding a
  ridge, or altering the symbol-reading program — and have the other explain why that
  experiment would or would not decide the matter. End with the two characters stating,
  as precisely as possible, what observation would change their minds, even if they
  continue to disagree.


