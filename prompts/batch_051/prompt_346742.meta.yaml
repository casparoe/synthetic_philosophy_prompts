  I''m a journalist writing a piece on why pundits keep reaching for the "empires
  have lifecycles" thing whenever a big power looks shaky. The version I keep seeing
  traces back to John Bagot Glubb''s little essay The Fate of Empires, where he basically
  says a nation behaves like a living organism: it goes through infancy, youth, maturity,
  old age, and decline, and the whole lifespan is around two hundred and fifty years.
  He wrote it as a retired British officer looking at history, and read it now its
  tempting to use it as a forecasting tool: find the reference class of empires, compute
  the median age, compare the US or China to it, etc. I want to know if that analogy
  can actually carry weight or if it''s doing something else. Please audit the organism
  analogy itself: what maps onto what (youth =?, senescence =?, species-typical lifespan
  =?), where the mapping is doing real work, where it quietly imports biology that
  empires don''t have (like a genome, development program, death by internal clock
  rather than external shocks), and what the base-rate version of the argument needs
  to be if it''s going to survive minus the organism framing. One specific worry:
  Glubb''s stages don''t seem to be an observable clock so much as story told backward
  after the fall, and that changes what "base rate" means. Is there a principled reference
  class for "empires like the current US" that doesn''t just get selected after the
  fact? Give me a table with columns: element of the organism analogy; what it corresponds
