  Actually Skolem''s paradox: The theorem (Löwenheim–Skolem) says every first-order
  theory with an infinite model has a countable model. ZFC is first-order and (if
  consistent) has a model. So there is a countable model M of ZFC. But ZFC proves
  "there is an uncountable set" (e.g., the set of real numbers exists and Cantor''s
  theorem says it''s uncountable). So there''s a set x in M such that M satisfies
  "x is uncountable." How can x be uncountable if M is countable? Resolution: x is
  countable "from outside" (there''s a bijection between x and N in the metatheory)
  but no such bijection is in M. "Uncountability" is not absolute; the existence of
  a bijection is a first-order statement that M fails to see. Countability of the
  model M means the domain of M is countable, not that M itself "sees" itself as countable.
  So no contradiction.


