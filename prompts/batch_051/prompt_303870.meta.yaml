  it changes decision theory or just identifies when additive objective functions
  mislead. A good answer would correct: expected utility theory can accommodate non-ergodic
  dynamics if utility is specified over final wealth with proper risk aversion; the
  real issue is with expected value, not expected utility; also time-average growth
  isn''t a universal decision rule; ergodicity transformations etc. The question as
