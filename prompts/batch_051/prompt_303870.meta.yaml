  and the time average diverge, and the time average tells you what actually happens.
  Maximising expectation can therefore lead a single individual to ruin even when
  the bet looks favourable. Does this mean that when I make decisions in my own life
  — whether to take out insurance, accept a job with variable pay, or buy a risky
