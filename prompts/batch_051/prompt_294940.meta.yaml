  Draft:


  "I''m a teaching assistant for an undergraduate course in nineteenth-century social
  and political philosophy, and I''m in the middle of marking midterm essays. The
  course has spent several weeks on Marx, with students reading selections from the
  Economic and Philosophic Manuscripts of 1844 and Capital, Volume I. I set the following
  question, and one student submitted the answer below. I''d like a careful second
  opinion on how to grade it, because the response engages with the right concepts
  but I want to make sure I''m assigning credit and deductions on the right grounds.


  Question: Marx distinguishes between the worker''s exploitation under capitalism
  and the worker''s alienation. Drawing on the 1844 manuscripts and the first volume
  of Capital, explain each concept, and then assess whether, for Marx, exploitation
  is sufficient for alienation. Be precise about the mechanisms by which each condition
  arises.


  Student''s answer: Marx''s concept of exploitation is developed in Capital. The
  worker sells his labor power to the capitalist for a wage corresponding to its value,
  which is the cost of reproducing the worker''s subsistence. But labor power is a
  peculiar commodity: it can produce more value than it costs. Over the working day
  the worker creates new value beyond the value of labor power, and this surplus value
  is appropriated by the capitalist without an equivalent. Exploitation, for Marx,
  is this extraction of surplus value; the rate of exploitation is the ratio of surplus
  value to the value paid for labor power (surplus labor time over necessary labor
  time).


  Alienation, by contrast, is worked out chiefly in the 1844 manuscripts. There Marx
  treats alienated labor as having four dimensions: the worker is alienated from the
  product of his labor, which confronts him as an alien object; from the activity
  of labor itself, which is coerced rather than free self-activity; from his species-being,
  his capacity for free conscious production; and from other human beings. Under capitalism,
  labor belongs not to the worker but to the capitalist, and the worker''s own activity
  and product stand over against him as alien powers.


  On the relation between the two, exploitation is sufficient for alienation. The
  mechanism is the wage. Because the worker is paid less than the value he produces,
  he lacks the means to appropriate the product of his own labor and cannot engage
  in self-directed productive activity; his capacities are exercised for the capitalist''s
  purposes and under the capitalist''s control. The gap between what the worker creates
  and what he receives back thus explains all four dimensions of alienation: the product
  becomes alien because it is produced for another, the activity becomes alien because
  it is not self-directed, and estrangement from species-being and from others follows
  from the same deprivation. If wages were raised substantially, this gap would narrow,
  and alienation would correspondingly diminish.


  [Then grading instruction.]


  Please assign a grade out of 20 and provide the point-by-point comments that justify
  it. In particular, your comments should specify which parts of the student''s account
  deserve full credit, which parts deserve partial credit, and which parts should
  lose credit, with reasons tied to the texts and to Marx''s claims. Please do not
  just give an overall impression; I need the detailed comments."


  Then epistemic: "Finally, please indicate how confident you are in this assessment
  overall, and single out the specific point in your comments that you are least sure
  about."


