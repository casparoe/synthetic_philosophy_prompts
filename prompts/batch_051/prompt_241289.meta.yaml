  Here is the counterfactual. Consider a pseudonymous, text-only discussion site roughly
  the size and culture of a large early-2010s subreddit. On January 1 of next year
  the platform abolishes its familiar one-dimensional karma — an unlimited, costless
  up-or-down vote attached to each post and comment — and replaces it with a closed
  karma economy. Each account begins with 10 units. An upvote now costs the voter
  0.2 units and transfers 1 unit to the author; a downvote costs the voter 0.2 units
  and burns 0.5 units from the author''s balance. Votes are no longer anonymous: every
  vote is logged with the voter''s name. Karma decays at 2% per week, and the only
  way new karma enters the system is that new accounts receive 10 units at registration;
  there is no mining, purchase, or accumulation without receiving transfers. Accounts
  whose balance reaches zero cannot post, comment, or vote for 30 days, after which
  they are restored with 5 units.


