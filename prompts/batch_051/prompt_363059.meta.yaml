  system/Turing machine). Common commitments someone might hold:

  1. I accept that the mathematical operations of the human mind can in principle
  be simulated by a Turing machine (mechanism about the mind).

  2. I''m a physicalist/computationalist.

  3. I think Gödel''s theorems show that for any consistent formal system F containing
  arithmetic, there is a true sentence (its Gödel sentence or consistency statement)
  that F cannot prove but a human can see to be true.

  4. I think the human mind can see the consistency of any consistent formal system
  it can construct (or at least PA).

  5. I accept Lucas''s argument that because the human mind can out-Gödel any formal
  system, it cannot be a Turing machine.

  6. I think there is a determinate fact of the matter about arithmetic truth (or
  about "the standard model").

  7. I think the mind has limited reliability / makes mistakes, and that machines
  can also be unreliably wrong.

  8. I believe in second-order logic or indefinite extensibility? Maybe too niche.


