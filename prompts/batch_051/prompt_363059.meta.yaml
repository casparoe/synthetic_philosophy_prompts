  The Lucas–Penrose argument''s force depends on:

  1. Human can see Con(F) for any F we can specify.

  2. If mind = some F*, then we should be able to see Con(F*), but Gödel''s theorem
  says F* can''t prove Con(F*). Contradiction.

  3. Therefore mind ≠ any F*.


  A subtle issue: The argument assumes we can specify the system that supposedly captures
