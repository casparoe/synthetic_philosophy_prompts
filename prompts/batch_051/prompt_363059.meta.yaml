  to specify/grasp, so we couldn''t see Con(F*). Related to "we can''t introspect
  our own program." So the tension: holding mechanism + "for any system I can specify,
  I can see its consistency" doesn''t yet imply mind isn''t a machine, because the
  machine that is my mind may be unspecifiable by me. This is a genuine nuance. It
  could be an "apparent tension dissolves" or a "genuine tension".


