  Let''s write:


  I''m a novelist, and I''m stuck on a scene where an economist and a physicist are
  arguing about whether their model of a housing market is any good. The physicist
  keeps complaining that the assumptions are absurd—people have perfect information,
  there are no transaction costs, the whole thing is frictionless—and the economist
  fires back with what I''m told is Friedman''s F-twist from his essay "The Methodology
  of Positive Economics": roughly, that it don''t matter whether a theory''s assumptions
  are descriptively realistic, only whether its predictions are accurate. I want the
  physicist to respond not by sneering but by actually designing a test. So here''s
  what I need: if you had to test the claim that the realism of a theory''s assumptions
  is irrelevant to its value once predictive accuracy is taken into account, what''s
  the strongest concrete test you could build? Pick two models or theories, real or
  made-up, where one has obviously false assumptions and the other has more realistic
  ones, and say exactly what you''d measure, what result would count in favor of Friedman''s
  position, what would count against it, and what the test would still leave undecided.
  In particular, I''m interested in the residue: even if the test comes out one way,
  what would a person on the other side still be able to say without being irrational?
  Lead with your bottom line in the first sentence and then lay out your reasoning,
  no preamble and no restating the question.


