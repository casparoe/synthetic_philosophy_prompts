  Husserl''s phenomenology (from Ideas I, 1913):

  - The epoché (Greek for suspension) is the method of "bracketing" the "natural attitude"
  — the everyday, unreflective positing of a mind-independent, spatiotemporally existing
  world (the "general thesis of the natural attitude").

  - In the epoché, one neither denies nor doubts the world''s existence; rather, one
  abstains from using or affirming that positing, putting it out of action. The world
  remains there as a phenomenon — the world as experienced and meant — but its transcendent
  existence is no longer being asserted.

  - The phenomenological reduction leads from the natural attitude to the "transcendental"
  sphere of consciousness and its intentional correlates (noesis/noema), the bracketed
  world considered as meant object.

  - Husserl is explicit that the epoché is not Cartesian doubt: doubt is a mode of
  the natural attitude that posits the world as possibly not existing; epoché is a
  reflective abstention. (Husserl says in Ideas I §32: "We do not give up the thesis
  we have posited... we set it, as it were, ''out of action'', we disconnect it, we
  bracket it." More or less — but I can''t quote from memory. So paraphrase.)

  - After reduction, what remains is pure consciousness as a field of transcendental
  experience, not private introspective content in a psychological sense. The "transcendental"
  is not solipsistic private mind; intersubjectivity becomes central in later works
  (Cartesian Meditations, Fifth Meditation). The noema is an irreal/ideal meaning,
  not a mental picture or private sense-datum.


