  I teach a graduate seminar on the philosophy of religion, and every time I teach
  the relation between Paul and James I have the uncomfortable sense that I am watching
  a debate that has not moved in centuries but merely re-performs itself in new vocabulary.
  The apparent conflict is familiar enough. In Romans and Galatians, Paul insists
  that justification comes through faith and not through observing the prescriptions
  of the law. The Epistle of James, in its second chapter, insists with equal directness
  that a faith that produces no actions is dead, and that a person is justified by
  what they do and not by belief alone. The standard harmonizations have all been
  on the table since antiquity and are, by now, utterly predictable: the two authors
  use faith in different senses; they use works in different senses; they use justified
  in different senses; they address different audiences and different pastoral situations;
  one speaks of the root of the Christian life and the other of the fruit. The striking
  fact is not that these harmonizations exist but that they have failed to produce
  convergence. Each side can restate its own reading without being dislodged by the
  other, and the dispute simply restarts at the next argumentative level.


  I am not asking you to adjudicate who read the texts correctly, and not to produce
  another harmonization. I want a diagnosis of the disagreement itself. Is this a
  substantive disagreement, a verbal one, or several different investigations running
  under a single heading — an exegetical one about what each author meant, a doctrinal
  one about what the canon as a whole commits one to, and a historical one about what
  social conflict the early movement was negotiating? Is there a hidden empirical
  or historical question doing the work, for example about what set of observances
  Paul means by the phrase works of the law in his polemical contexts, or about the
  situation of the community to which James is addressed? Or is the impasse produced
  by antecedent commitments — for instance, about whether a received corpus must be
  assumed to speak with one voice, or about whether apparent tension is itself evidence
  of a text''s authenticity — commitments that no amount of lexical detail could overturn?


  State your diagnosis with reasons, engaging the positions I have described rather
  than surveying them. Then tell me what would change your mind about that diagnosis:
  which argument, historical finding, or conceptual distinction would lead you to
  a different account of why the debate stalls, and where in your own reasoning you
  think the failure is most likely to occur. Keep the response to no more than 500
  words.


