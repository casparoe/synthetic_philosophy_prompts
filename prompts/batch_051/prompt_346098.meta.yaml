  Precise readings of "chance is not choice":

  1. Trivial: Randomness is not identical to free choice (no one thinks randomness
  alone = choice). A choice is an act of an agent; a chance event is a physical occurrence.
  Almost tautologically true.

  2. Moderate/defensible: Adding a random or indeterministic component to a decision
  process does not by itself make the outcome an exercise of agency or control; unpredictability
  is not the same as authorship. If a decision could have been otherwise merely because
  a quantum event might have fired, the "could have been otherwise" is not the kind
  of freedom worth wanting (agency, reason-responsiveness).

  3. Defensible but stronger: Any indeterministic element in the causal chain leading
  to an action diminishes control rather than enabling it; if my choice is in part
  the product of chance, then it isn''t fully mine — luck undermines responsibility.
  This supports the conclusion that incompatibilist libertarianism can''t be salvaged
  by quantum indeterminacy alone.

  4. Very strong/false: Because quantum events are random in the sense of "for no
  reason and no cause," a world with quantum indeterminacy is a world where all events
  involving them are arbitrary, so free will is impossible. This is false/overstated:
  quantum randomness in microphysical components doesn''t make macro-level decisions
  random in the relevant sense; also epistemic vs ontic randomness; also compatibilists
  can accept indeterminism without effecting free will.

  5. Trivial/false nuance: Any event that is not determined is random in the everyday
  sense of "without cause"; but "random" in quantum mechanics (probabilistic, law-governed)
  is not "uncaused" or "arbitrary" in the colloquial sense. The slogan equivocates
  between "random" as uncaused/arbitrary and "random" as merely not uniquely determined
  by prior conditions.

  6. Another reading: The slogan could be asserting a conceptual point about the definition
  of free action: an act''s being chosen requires it to be determined by the agent''s
  reasons/character, not by chance; if determinism is false, no act can be so determined.
  That''s the "mind argument" / luck objection. This is substantive and actually does
  the argumentative work against event-causal libertarianism. Possibly defensible
  but not obviously true; it depends on whether agent-causal libertarianism can avoid
  it.

  7. Does it support the friend''s conclusion? Only the reading where chance introduces
  luck that undermines control, and only if the proponent''s version of free will
  requires the action to be determined by reason/character to the exclusion of lucky
  breaks. If the proponent is an agent-causal libertarian, the slogan''s moderate
  reading may not be enough.


