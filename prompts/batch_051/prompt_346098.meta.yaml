  Potential draft:


  "I''m taking a course on free will this term, and last week''s discussion turned
  into a standoff between two friends. One argued that quantum mechanics rescues libertarian
  free will: since the collapse of the wave function is indeterministic, not every
  event is fixed by the prior state of the universe, so our actions are genuinely
  open at the moment of choice. The other shut the argument down with a one-liner
  he says he picked up in a philosophy of science class: ''chance is not choice.''
  His point was that quantum indeterminacy is the wrong kind of openness — a decision
  that comes out different because some particle happened to decay this way rather
  than that is random, not free, so indeterminism gives you noise, not agency. I can
  feel that his slogan is doing real work, but I''m not sure what exactly he''s asserting,
  and I suspect it slides between several claims of very different strengths. I''d
  like to bring a careful breakdown to our next meeting.


