  Let me think carefully about Schopenhauer''s actual positions to make diagnostic
  questions accurate.


  Schopenhauer''s system (The World as Will and Representation):

  - World as representation: for the subject, the world is object of perception, structured
  by space, time, causality (Principle of Sufficient Reason in its forms). The world
  as representation is not "illusion" in the sense of nonexistent; rather it is appearance
  (Erscheinung), like Kant''s phenomena. He sometimes calls it "Maya" (veil). Actually
  he says the world is my representation; it has empirical reality but transcendental
  ideality. The "veil of Maya" hides the will.

  - The body is known in two ways: as representation (an object among objects) and
  in inner experience as will—immediate awareness of volitions; the body is the objectification
  of the will.

  - The will as thing-in-itself: blind, endless striving, objectifies itself in Platonic
  Ideas at grades: forces of nature, plants, animals, humans. The will is one, not
  in space-time; individuation belongs to representation.

  - Pessimism: life is suffering because willing is desire born of lack; satisfaction
  is fleeting, leads to boredom; happiness is negative (absence of pain), suffering
  positive. The world cannot be justified; no theodicy.

  - Redemption: aesthetic contemplation delivers will-less, timeless knowledge of
  Ideas, quieting the will temporarily; compassion (Mitleid) arises from seeing through
  individuation—morality rests on the insight that all beings are manifestations of
  the one will. Ultimately, denial of the will (asceticism, chastity, voluntary poverty,
  fasting, not suicide) leads to the cessation of willing, the "nothing" for us; the
  saint quiets the will. Suicide is not escape because it is an act of strong will,
  affirming the will-to-live rather than denying it; it destroys the appearance, not
  the thing-in-itself, and the will manifests in other individuals anyway.

  - Schopenhauer doesn''t command suicide not be done morally; he just says it''s
  futile, a mistake, not a genuine escape.


