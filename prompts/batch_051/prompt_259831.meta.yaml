  Q2: Is the fundamental character of reality a blind, non-rational striving? (Yes
  → Schopenhauerian; No → merely local/empirical pessimism.)

  Q3: Can aesthetic experience suspend or quiet willing? (Yes → further; No → different
  leaf.)

  Q4: Does compassion reveal the unity of all beings such that one''s own and others''
  suffering are not ultimately separate? (Yes → morality as denial path.)

  Q5: Can the will itself be denied/quieted, leading to a state beyond individual
  willing? (Yes → ascetic denial leaf: Schopenhauer; No → resignation without metaphysics,
  or Camus/Schopenhauer-without-escape.)

  Q6: Is suicide a genuine way out? (No/futile → Schopenhauer; Yes but impermissible
