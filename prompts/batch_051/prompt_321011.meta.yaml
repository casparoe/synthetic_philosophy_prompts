  to deliberate about whether saving her is justified.

  (4) A person who has to deliberate, in that moment, about whether saving his wife
  is justified has already had one thought too many; the act has ceased to be a proper
  act of love.

  (5) So any theory that makes the husband''s act right only if it satisfies an impartial
  test demands something that undermines the very good the act realizes.

  (6) Act-utilitarianism makes rightness depend on an impartial test of expected aggregate
  welfare.

  (7) Therefore act-utilitarianism is self-defeating in personal emergencies: it requires
