  external reason statements are false, or at best optimistic claims that an agent
  would come to have the reason if he deliberated correctly? Actually he says external
  reasons statements are false, or confused — not merely that they would become internal
  after a process of rational deliberation because "if he were rational he would..."
  is not an external reason; it''s either a bluff or an internal reason claim once
  he acquires the motivation through deliberation.

  - The "deliberative route" includes practical reasoning, exercising imagination,
  etc. It starts from S.

  - Key premise: reasons must be able to enter deliberation and motivate; a consideration
  that cannot so engage is not a reason for that agent.


