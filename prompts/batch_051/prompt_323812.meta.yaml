  - "Internal and External Reasons" (1979, in Rational Action; reprinted in Moral
  Luck 1981).

  - Thesis: reasons for action are internal: "A has a reason to φ" is true only if
  there is a sound deliberative route from A''s subjective motivational set (S) to
  the motivation to φ.

