  yields incompatible numbers.


  On the science side, a well-functioning theory is often required to be invariant
  under changes in representation or coordinate system: the same physical situation
  described in different coordinate charts should not yield different predictions.
  Quantities that change under reparameterization while the underlying state does
  not are usually treated as artifacts of the description, not features of the world.


