  On the probability side, Bertrand''s paradox asks for the probability that a random
  chord of a circle is longer than the side of an inscribed equilateral triangle.
  Depending on how one parameterizes the space of chords—by the angular position of
  the endpoints on the circumference, by the radius of the chord''s midpoint, by the
  angle between the chord and a radius, and so on—the principle of indifference gives
