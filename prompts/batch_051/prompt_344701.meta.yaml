  Maybe incorporate the principle: mental privacy protects "the inner sphere" — not
  just the confidentiality of brain data but the right not to have private mental
  states accessed, inferred, or manipulated without meaningful consent. Cognitive
  liberty protects the freedom to control one''s own mental life and the right not
  to be manipulated or coerced at the neural level.


  Key distinctions to preserve in procedure:

  - Raw signal vs. inferred mental content (amplitude of alpha vs "user is anxious").

  - Data about brain vs. data about mind; many EEG features are physiological/attentional,
  not semantic/mental content.

  - User vs. bystander (third party).

  - Opt-in vs. passive/unavoidable.

  - Purpose (self-insight vs. third-party manipulation vs. recommendation).

  - Consent quality: is it meaningful for real-time continuous inference? Can user
  withdraw? Does the system nudge?

  - Validation: does the inference actually work (accuracy), and does overclaiming
  matter (if it says it reads emotions but doesn''t, that''s its own harm).

  - The "slippery slope" or function creep: feature sold as wellness could become
  productivity surveillance or lie detection.


  Procedure steps possible:

  1. Classify what the system actually extracts: (a) raw signal, (b) physiological
  state (attention, drowsiness), (c) psychological state (mood, preference), (d) semantic
  mental content (thoughts, opinions, memories). Stop/no if (d) without strong safeguards?
  Actually mental privacy concerns increase as you move from a to d.

  2. Whose mental state: the user only, or others? If others, require affirmative
  consent and onsite/off mode; else escalate.

  3. Inference target and purpose: self-regulation vs. third-party feedback vs. influencing
  the user. If purpose is to change user''s mental state rather than inform them,
  cognitive liberty triggers. Possibly stop or human sign-off.

  4. Consent mechanics: is consent specific, revocable, and meaningful for continuous
  use? If only a buried toggle at onboarding, fail.

  5. Accuracy and transparency: can we tell users what we infer, error rates, allow
  correction? If we can''t characterize false positives, no.

  6. Data retention/sharing/derived data: do inferred emotions become a permanent
  profile sold/shared? If yes, human decision.

  7. If no stop, then product team and external ethicist decide.


