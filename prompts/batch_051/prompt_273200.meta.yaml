  Aristotle Nicomachean Ethics Book V, chapter 3 (1131a-1131b). Ross translation:
  "The just, then, is a species of the proportionate (proportion being not a property
  only of the kind of number which consists of abstract units, but of number in general).
  For proportion is equality of ratios, and involves four terms at least. That discrete
  proportion involves four terms is plain, but so does continuous proportion, since
  it treats one term as two, and mentions it twice; e.g. ''as the line A is to the
  line B, so is the line B to the line C''; the line B, then, has been mentioned twice,
  so that if the line B be assumed twice, the proportional terms will be four. And
  the just, too, involves at least four terms, and the ratio between one pair is the
  same as that between the other pair; for there is a similar distinction between
  the persons and between the things. As the term A, then, is to B, so will C be to
  D, and therefore, alternando, as A is to C, B will be to D. Therefore also the whole
  is in the same ratio to the whole; and this coupling the just effects, and, if the
  terms are so constituted, the resulting distribution is just. The conjunction, then,
  of the term A with C and of B with D is what is just in distribution, and this species
  of the just is intermediate, and the unjust is what violates the proportion; for
  the proportional is intermediate, and the just is the proportional."


