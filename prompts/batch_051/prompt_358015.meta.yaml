  Key distinctions:

  - Genetic code: the mapping between nucleotide triplets (codons) and amino acids
  during translation. This mapping is arbitrary in the sense that alternative mappings
  are chemically possible and some exist in nature (variations); this arbitrariness
  resembles a code. But does arbitrariness suffice for semantic information?

  - Semantic information requires a sender and receiver, and usually intentionality/convention;
  DNA has no such.

  - Causal information: correlation/covariation (Shannon) or Gricean natural meaning
  ("smoke means fire"). Many biologists use "information" in a causal sense (Griffiths
  2001: genes carry causal information about phenotypes).

  - Instructional information: Maynard Smith and Szathmáry: a gene contains information
  about a trait if the gene''s role in development is such that the sequence exerts
  control over the phenotype; information is like a blueprint/recipe/program.

  - Teleosemantic accounts: DNA has semantic content because of evolutionary function
  (selected to produce trait)?

  - The parity thesis: all developmental causes (genes and environment) carry information
  symmetrically; no privileged genetic information. Against code/program views.

  - The "code" metaphor may be legitimate heuristically.


  Positions on DNA as code/information:

  1. Literal semantic code: DNA genuinely carries encoded messages/instructions (some
  molecular biologists; maybe "genetic code" as actual code).

  2. Causal information only: DNA carries information but only in the sense of causation/correlation;
  no semantic content. (Griffiths)

  3. Instructional/program view: DNA is not semantic, but it is informational/instructional
  in a special control sense (Maynard Smith, though he uses teleosemantic-ish definition).

  4. Metaphor/Fictionalist: "genetic information" and "code" are useful metaphors
  or fictions; at base causal talk suffices. (Some philosophers)

  5. Parity/multi-causal view: no privileged genetic information; developmental information
  is distributed across genes, cellular machinery, environment. (Oyama''s developmental
  systems theory)

  6. Teleosemantic view: genes have semantic content in virtue of evolutionary selected
  function.


