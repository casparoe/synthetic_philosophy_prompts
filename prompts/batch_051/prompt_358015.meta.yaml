  Potential prompt text:


  "I''m putting together a handout for a seminar in the philosophy of biology, populated
  mostly by biology majors who have not read the philosophical literature. The session
  concerns the question: in what sense, if any, does DNA carry information, and is
  ''the genetic code'' literally a code? I''d like you to write a sorting instrument
  — a decision tree or taxonomy — that takes students from their answers about concrete
  cases to one of the main philosophical positions. Please build it from the logical
  space rather than from a list of names: first articulate the branching questions
  and the combinations of answers they permit, then locate the actual positions in
  that space, and note any unoccupied or underpopulated combinations, saying briefly
  whether each is empty because the view is incoherent, unattractive, or merely unexplored."


  Then list positions:

  "The leaves should include at least these views, characterized roughly as follows
  (you may refine the names):

  - Literal-code view: the genome really does contain encoded instructions whose semantic
  content the cell''s translational machinery reads.

  - Causal-information view: genes carry information only in the covariation/correlation
  sense (as barometer readings carry information about storms), and ''code'' is loose
  talk for chemical causation.

  - Instructional/program view: genes carry information in a stronger than merely
  causal but less than fully semantic sense: DNA functions as a program, recipe, or
  set of instructions in development.

  - Parity/developmental-systems view: there is no principled justification for privileging
  DNA as the carrier of information: genes, cellular machinery, and environment all
  carry information symmetrically, and code talk smuggles in a false privilege for
  the gene.

  - Teleosemantic view: a sequence has content in virtue of its evolutionary function
  — what it was selected to do — even if no one ''sent'' it and no intentional reader
  decodes it.

  - Metaphorical/fictionalist view: ''the genetic code'' and ''genetic information''
  are useful heuristics or fictions, but literal truth belongs only to causal descriptions."


