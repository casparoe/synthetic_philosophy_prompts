  ---


  So I had this long argument with a friend last night about whether religion as a
  natural phenomenon is mainly a byproduct of hyperactive agency detection, or costly
  signaling, or group-level adaptation, or what. He kept saying "its not one thing,
  it''s a family of things" and I kept saying a naturalistic theory still has to explain
