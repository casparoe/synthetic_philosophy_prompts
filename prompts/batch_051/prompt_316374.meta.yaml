  Then we got stuck on what "explaining religion" even means. I don''t want to read
  more theories until I know what I''m asking of one.


  Hume in the Dialogues Concerning Natural Religion says: "Any question of philosophy,
  on the other hand, which is so OBSCURE and UNCERTAIN, that human reason can reach
  no fixed determination with regard to it; if it should be treated at all, seems
  to lead us naturally into the style of dialogue and conversation. Reasonable men
  may be allowed to differ, where no one can reasonably be positive." I think that
  applies to explaining religion too: a theory has to respect that it''s obscure and
  variable, not pretend one mechanism obviously wins.


