  Domain: Coherence arguments for expected utility maximization. The asker lists several
  commitments within decision theory:


  1) I accept Dutch book arguments as showing that credences should be probabilities.

  2) I accept representation theorems like Savage''s as showing that preferences satisfying
  certain axioms can be represented as maximizing expected utility.

  3) But I don''t think representation theorems are normative by themselves; they
  only show what a coherent agent looks like, not why coherence is required.

  4) I think the "money pump" arguments for transitivity are more compelling than
  Dutch books because they involve actual exploitation over time.

  5) I think the axiom of independence is the most questionable rationality requirement,
  but I still accept it because dropping it leads to violations of stochastic dominance
  in some cases.

  6) I think a rational agent can knowingly have intransitive preferences if they
  are willing to pay a small amount to avoid a money pump, because the pump only works
  if they keep making the same choice.

  7) I also think that if you accept expected utility maximization, you should accept
  that there is no rational requirement to update by Bayesian conditionalization because
  it''s just a special case of static coherence on a larger state space.


