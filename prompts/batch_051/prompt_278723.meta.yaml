  "Ok so I''m writing a section of my dissertation on coherence arguments in decision
  theory and I want a consistency check on the positions I''ve slowly converged on.
  I''ll just list them:


  (1) I buy representation theorems as representation theorems: if someone''s preferences
  satisfy the Savage axioms, there''s a utility function and probability function
  that represent them, but that by itself doesn''t give that person a reason to satisfy
  the axioms.


  (2) I think the real normative force of expected utility maximization comes from
  dynamic arguments, especially money-pump arguments: someone whose preferences violate
  transitivity or independence can be exploited across time by a sequence of trades,
  each of which looks good at the time.


  (3) But I also think the money-pump argument is weaker than people admit, because
  it assumes the agent keeps making the same pairwise choice even after seeing the
  whole cycle. A sophisticated agent can refuse the third trade and then the pump
  doesn''t go through. So the argument really imposes a requirement to not be a myopic
  trader, not a requirement to have acyclic preferences.


  (4) I accept the independence axiom as a requirement of rationality.


  (5) I think the Allais paradox is a genuine counterexample to the normative force
  of independence: I have Allais preferences, I don''t think they''re irrational,
  and I don''t think I could be money-pumped into giving up money because I''d stop
  trading once I noticed the pattern.


  (6) I also think there''s no separate diachronic requirement of Bayesian conditionalization:
  it''s just static coherence applied to a larger event space.


  So: does this set of commitments hang together? Which pairs are in real tension,
  which only look like they are, and what''s the cheapest revision that would fix
