  I teach an upper-level graduate seminar in the philosophy of history, and we have
  been working through the problem of causal multiplicity. Last week we discussed
  Mill''s A System of Logic, Book III, Chapter X, on what he calls the plurality of
  causes. His example, from what I recall, is that a person''s death may be produced
  by any of several independent antecedents—a fall, poison, starvation, disease—so
  that when several such conditions are present, the investigator may find it difficult
  to say which was actually responsible. What struck my students is how close that
  is to the historian''s notion of overdetermination, and yet how different in practice.
  A historian may claim, for instance, that the outbreak of the First World War was
  overdetermined: even if the assassination at Sarajevo had not occurred, some other
  crisis would have produced a general European war within a few years, given the
  alliance commitments, mobilization timetables, and imperial competition. I want
  to know whether that claim can be tested at all, and if so how.


  Here is the assignment I am drafting. I want you to suppose you have to design the
  strongest possible empirical test of a specific overdetermination claim in history.
  Choose a manageable historical example—not necessarily World War I—where scholars
  assert that an outcome was overdetermined by two or more independent causal factors.
  State the claim precisely enough that it is clear what would count as a failure.
  Then design a test: what bodies of evidence, comparative cases, or historical micro-analyses
  could bear on whether the outcome really was robust across changes in one of the
  cited causes? Say what result would support the overdetermination claim, what result
  would undermine it, and what intermediate results would be ambiguous. Finally, identify
  what the test could not settle even in principle—for example, whether the counterfactual
  dependence can be established for a singular event, whether the nominated alternative
  causes are genuinely independent, or whether the explanatory language of overdetermination
  is doing more than retrospective narrative work.


