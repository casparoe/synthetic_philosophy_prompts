  I have become convinced that heterophenomenology is the only viable starting point
  for a science of consciousness, and I want to know how confident I should be in
  that conviction. The version I hold has three commitments: that first-person reports
  should be treated as the raw data, but only as reports — as representations to be
  interpreted with the intentional stance — rather than as transparent windows onto
  consciousness; that the method must remain neutral about the ultimate ontology of
  what the reports seem to say exists; and that this neutrality is what makes the
  resulting science able to proceed without settling the hard problem in advance.
  My worry is that the position may have been so heavily qualified over the years
  that it no longer risks anything: it may be compatible with every conceivable pattern
  of verbal behavior, and therefore with no particular empirical result at all. I
  would like you to take the position at its strongest, play it straight, and tell
  me what would count against it.


