  Imprecise probabilities / imprecise credence: The debate is between precise Bayesianism
  (a rational agent''s beliefs are represented by a single probability measure over
  a σ-algebra, updated by conditionalization) and imprecise probabilism (beliefs represented
  by a set of probability measures, roughly your representor). Cases: Ellsberg''s
  two urns: one has 50 red, 50 black; the other has 100 balls with unknown proportion
  red/black (say any composition possible, you''re told it could be anywhere from
  0 to 100 red). A bet on red from the ambiguous urn is one thing; betting on red
  from the known urn is precise. Most people prefer known-urn red over ambiguous-urn
  red — ambiguity aversion. Precise Bayesians must represent that as a single probability
  over the ambiguous urn''s composition (or outcome), so they will have some point
  probability of red, but the observed preferences (choosing known urn red and known
  urn black) are inconsistent with any single probability — that''s the construct/model.
  Imprecise Bayesians represent the ambiguous urn with the whole interval [0,1] for
  red (or set of measures), and use decision rules (maximin expected utility, maximality,
  E-admissibility, interval dominance) to make choices. Arguments for imprecision:
  it does justice to ambiguity, inertia, non-dogmatism. Arguments against: White (2009)
  "Evidential symmetry and mushy credence" — argues imprecise confidence is incoherent
  or ill-motivated; Elga (2010) "Subjective probabilities should be sharp" — argues
  from sequential choice / bets; also various arguments that imprecise beliefs violate
  reflection or are bad in decision-making because of dilation, incompleteness, value
  of information; the "imprecise probabilities are not decision-theoretically useful
  without an arbitrary rule" criticism. Also Longpapers: Joyce (2010) "A defense of
  imprecise credences in inference and decision" — notable defender. Hájek and Smithson?
