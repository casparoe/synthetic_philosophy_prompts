  Prompt:


  "I teach a graduate seminar in science studies, and for the first time I''ve been
  reading Wittgenstein''s On Certainty alongside some work in hinge epistemology.
  I''m struck by the passage where Wittgenstein says that ordinary doubt and inquiry
  operate against a background of commitments that themselves are not raised as questions
  in that inquiry, like hinges that a door turns on but that do not turn themselves.
  For my next session I want to test how far this idea travels. My working list of
  criteria for a hinge commitment is this: (1) it is not adopted on the basis of evidence,
  but is what makes the gathering and weighing of evidence possible within a domain;
  (2) its truth is not normally treated as an open question by competent practitioners,
  even though they can state it; (3) if a practitioner does raise it as an open question,
  the practice''s ordinary methods of testing and adjudication do not tell for or
  against it; (4) it does not function as a hypothesis whose failure would revise
  one local claim, but rather its withdrawal would leave an entire body of practice
  without its usual sense of warrant; and (5) it is held fast in practice, not merely
  asserted in theory.


  The borderline case I want to use is the principle that no two human fingerprints
  are exactly alike—the uniqueness assumption that forensic friction-ridge examiners
  rely on when they present an identification as identifying a single source. This
  has sometimes been defended by pointing to empirical studies, but examiners routinely
  treat it as a settled background condition of their practice, one that individual
  casework does not test; and when lawyers or statisticians ask for an error-rate
  for uniqueness itself, the field tends to say that question is outside its methods.
  Does the fingerprint uniqueness assumption qualify as a hinge commitment on these
  criteria? Please go through the criteria honestly and say where the case strains
  the criteria; if it fails some, say whether that shows that the criteria need refining
  or that the case is better understood as an ordinary empirical generalization that
  the field has wrongly shielded from testing. And where your verdict is strongest,
  tell me what argument or consideration would most likely change your mind about
  it."


