  List of standard reasons why "priors wash out" does not license prior-insensitivity:

  1. In finite samples, the influence of the prior never fully disappears; agreement
  is only a limiting result, and convergence can be arbitrarily slow depending on
  prior and truth.

  2. The standard theorems require the true data-generating process to be in the support
  of the prior; priors that assign zero mass to the truth (or a wrongly restricted
  model) converge to a false posterior, not the truth.

  3. Convergence of beliefs to agreement with one another does not by itself imply
  convergence to the truth unless the model is well-specified; two agents can merge
  on a false consensus.

  4. Merging results typically assume the agents'' posteriors are computed from the
  same likelihood / same model class and that the partition or sigma-algebra is fixed;
  if agents have different models or grow their model space as data arrive, merging
  can fail.

  5. With non-stationary data or regime changes, the assumptions behind the Blackwell-Dubins-style
  results fail and priors can reassert themselves.

  6. The choice of prior also affects Bayesian model comparison / marginal likelihoods,
  so it never fully washes out at the level of model choice even asymptotically (maybe).

  7. Computational/complexity: merely saying convergence occurs at the limit is cold
  comfort because we always live at finite n, and rates can be prior-dependent (e.g.,
  in nonparametric models).

