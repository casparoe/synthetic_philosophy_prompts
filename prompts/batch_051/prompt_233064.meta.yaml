  The heterogeneity problem: Hedonism says well-being consists in pleasure. But "pleasure"
  covers wildly heterogeneous states: the bodily pleasure of a warm bath, intellectual
  pleasure of insight, aesthetic pleasure, schadenfreude, the gratification of a desire,
  relief from pain, the pleasure of play. What do these have in common in virtue of
  which they all count as "pleasure" and all count as the single currency of well-being?
  If nothing, the category is gerrymandered and hedonism may be vacuous or disjunctive.


  Candidates for commonality: felt quality (phenomenological), being liked/desired
  (attitudinal), being "good-feeling" — but what unites them? Some hedonists (Feldman)
  propose attitudinal pleasure = enjoyment, a propositional attitude of taking pleasure
  in something; others say sensory pleasure is a distinct type; Bentham quantitative
  differences. The heterogeneity objection says no single phenomenal tone unites the
  pleasure of orgasm and the pleasure of solving a proof. A defender can say: all
  are states we are disposed to prolong and would call enjoyable (functional account).
  Meanwhile the slogan "there''s no such thing as pleasure, only pleasures" could
  be making claims:


  1. Semantic/phenomenological: The word doesn''t denote a single phenomenally homogeneous
  kind; "pleasure" is a family-resemblance term.

  2. Metaphysical: No natural kind P shared by all tokens; the only commonality is
  our using the same word.

  3. Normative: There is no single quantity of "pleasure" to maximize; hedonic calculus
  is incoherent because it sums incommensurables.

  4. Epistemic/measurement: No single scale or unit (utils) maps onto anything real.

  5. Motivational/attitudinal: We don''t in fact aggregate across heterogeneous pleasures;
  choice reflects incommensurable categories.

  6. Deflationary: the phrase "pleasure" is a façon de parler; only individual pleasurable
  activities exist.

  7. Possibly a claim about neural realization: no common neural currency.


  Which readings would actually support dismissing hedonism? The normative/measurement
  ones would; the merely semantic/phenomenological ones would not, because hedonism
  can be rephrased disjunctively or attitudinally. A defender could accept that pleasures
  share only a thin functional property (being wanted, being enjoyed) and that''s
  enough for the axiological role.


