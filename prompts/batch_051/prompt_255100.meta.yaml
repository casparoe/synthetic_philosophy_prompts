  Bradley''s regress in the unity of the proposition: Suppose a proposition is composed
  of terms united by a relation. The relation itself must be related to its terms.
  But then that relating relation must be related to the relation and the terms, ad
  infinitum. So the unity is never accounted for.


  My reconstruction:

  (1) A proposition is a complex whose constituents are united by a relation (the
  assumption to be tested).

  (2) A relation unites two constituents only by standing in a further relation of
  "instantiation" or "linking" to each constituent.

  (3) That further relation is itself a constituent of the complex (or another entity),
  so it must be united to what it relates by yet another relation.

  (4) This generates an infinite chain of linking relations.

  (5) An explanation of unity that generates an infinite chain of linking relations
  is vicious, because it never reaches a point where the unity is achieved.

  (6) Therefore, no relation can explain the unity of a proposition.


