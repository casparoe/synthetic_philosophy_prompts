  ---


  I''m taking a seminar on the metaphysics of propositions, and I''ve gotten stuck
  on the classic problem sometimes called Bradley''s regress. The problem starts from
  the observation that a proposition is not a mere list of its constituents: in the
  proposition that Socrates is wise, Socrates and wisdom are somehow combined into
  a single truth-evaluable whole. The natural explanation is that a relation—perhaps
  instantiation, or predication—combines them. But the relation then seems to become
  just one more constituent, and something must combine it with Socrates and wisdom,
  and so on. I tried to make the regress precise as follows:


  (1) A proposition is a complex whole whose constituents are united by a relation.

  (2) A relation unites two constituents only by standing in a further relation to
  each of them.

  (3) Each such further relation is itself an additional constituent of the complex,
  so by (2) it too must stand in yet further relations to what it relates.

  (4) Therefore, the unity of any proposition requires an infinite chain of further
  uniting relations.

  (5) An explanation of unity that requires an infinite chain of uniting relations
  is vicious, since at no stage is the unity ever actually achieved.

  (6) Therefore, no relation can explain the unity of a proposition.


