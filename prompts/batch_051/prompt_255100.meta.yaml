  Could write:


  "I''ve been reading about how a proposition manages to be a unified whole rather
  than a mere list of its constituents. A tempting answer is that the proposition
  is unified by a relation between its constituents. But a classic worry is that this
  just pushes the problem back. Here''s my reconstruction:


  (1) For any complex to be unified, there must be something that relates its constituents.

  (2) A relation can relate two constituents only if the relation is itself related
  to each of them.

  (3) So the unity of a proposition requires, besides its original constituents and
  the relating relation, further relations between the relating relation and each
  constituent.

  (4) The same reasoning applies to each of those further relations, and so on without
  end.

  (5) If the unity of a proposition requires an infinite chain of further relating
  relations, then the original relation never actually unites anything (the unity
  is never achieved).

  (6) Therefore, no relation can explain the unity of a proposition.


  Is this argument valid? If it is, which premise should a defender of the relational
  account reject, and what alternative account of unity does that leave them with?
  If it is not valid, which step is invalid and why?"


