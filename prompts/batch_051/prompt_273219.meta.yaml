  Prompt:


  You are an expert in political philosophy and the economics of taxation who has
  been hired to facilitate an adversarial collaboration between two camps in a long-running
  debate over inheritance taxation. Think carefully before writing; begin by brainstorming
  the overlapping and conflicting commitments of each camp, then draft the document.


  The two camps are:


  - The equal-opportunity camp: holds that large untaxed inheritances are one of the
  main mechanisms by which arbitrary family advantage becomes entrenched across generations,
  and that a robust inheritance tax is a necessary part of any serious commitment
  to equality of opportunity. They favor high effective rates on large inheritances,
  with perhaps a generous exemption, and they treat inherited wealth as closer to
  unearned windfall than to deserved property.


  - The family-autonomy camp: holds that people are entitled to transfer the fruits
  of their labor to their children, that the family rather than the state is the primary
  institution through which people save and care across generations, and that high
  inheritance taxes punish successful lifetime savers, encourage wasteful avoidance,
  and can destroy family farms and closely held businesses. They favor low or zero
  inheritance taxation, or only a backstop rate on very large estates.


  Produce the document these two camps could both sign after a good-faith adversarial
  collaboration. It must contain:


  1. A numbered "Agreed claims" section. These claims should be substantively non-vacuous,
  not merely verbal, and should cover the shared empirical background, the shared
  normative starting points, and the points on which one side has moved.


  2. A "Disagreements" table with three columns: the question; the equal-opportunity
  camp''s formulation of its position; the family-autonomy camp''s formulation of
  its position. Each formulation must be written so that a sophisticated member of
  that camp would accept the wording as their own, not a caricature.


  3. A "Cruxes and tests" section. For each crux — a sub-question such that resolving
  it would move at least one camp — state the crux in neutral terms, describe a concrete
  case, natural experiment, or piece of evidence both camps agree would bear on it,
  and record in advance what each camp predicts that evidence would show. Include
  at least four cruxes, spanning both empirical and normative issues. Make sure at
  least one normative crux is handled with the same discipline as the empirical ones.


  In particular, address the following potential cruxes (and add any others the two
  camps would identify): (i) how much of observed intergenerational persistence in
  income and wealth is transmitted through financial inheritances themselves rather
  than through parenting, schooling, assortative mating, genes, and culture; (ii)
  how much tax avoidance and capital migration a high inheritance tax produces; (iii)
  whether the relevant benchmark is equality of opportunity among children, equal
  dignity of families, or the freedom to dispose of what one has lawfully acquired;
  (iv) whether the family is best modeled as a unit of shared consumption and care
  whose internal transfers should be invisible to the state. For each, state what
  sort of evidence or argument both camps would count as bearing on it, and record
  each side''s prediction.


  End with a short paragraph, signed by both camps, that states in neutral language
  what residual disagreement remains and what future findings would most likely narrow
  it.


