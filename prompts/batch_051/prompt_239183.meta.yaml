  Back-and-forth:

  (1) Tom/one: Petitionary prayer to a God who is omniscient and immutable is unintelligible.
  If God is omniscient, He already knows what you need before you ask. If He is immutable,
  your prayer cannot move Him to do anything He wasn''t already going to do. So asking
  God to do something is either trying to inform Him (impossible) or trying to change
  His mind (impossible). What job is the petition doing?

  (2) Nadia/two: That''s too quick. Classical theists have always held that God ordains
  not only the outcome but also the means, including the prayer itself. A God who
  is outside time can will from eternity that the healing occur in response to the
  mother''s asking. The immutability of the decree doesn''t make the request idle;
  it makes the request part of the total package willed.

  (3) One: But then prayer is epiphenomenal with respect to the outcome. If the decree
  is fixed from eternity, the healing happens with the prayer and "because" of it
  only in a Pickwickian sense. From inside time it looks like asking triggers God''s
  act, but there is no possible world where the prayer doesn''t happen and the healing
  doesn''t follow, since both are in the same eternal decree. So prayer no more changes
  the outcome than the rooster''s crow changes the sunrise, even if the rooster always
  crows before sunrise.

  (4) Two: That''s the wrong standard of "change." When I ask my friend for help,
  I don''t think there''s a possible world in which my asking is removed and everything
  else held fixed — my asking is part of the causal network that produces the help.
  Similarly, God''s eternal will includes the dependence of the granting on the asking.
  The question isn''t whether God would have done it without the prayer, but whether
  the prayer is a real element of the order through which God does it. Besides, the
  point of petition isn''t only to secure outcomes; it''s to acknowledge dependence
  on God and align one''s will with His.

  (5) One: But the accommodationist move about dependence-giving has a different problem:
  it can''t explain why the content of the petition should be expected to matter.
  If the real point is alignment and dependence, why would it make sense to ask for
  a specific medical result rather than simply to pray "Thy will be done"? The specific
  content only makes sense if you think the asking could make a difference to whether
  the result occurs — which is exactly what the eternal-decree view denies. So you''re
  smuggling back an outcome-difference you''ve disowned.

  (6) Two: Not necessarily. Specific content can be part of the relationship rather
  than a lever on the outcome: a child asks a parent for specific things not because
  the parent is uninformed or because the child can force a result, but because a
  shared life includes particular hopes and requests, and the parent can incorporate
  those requests into a stable plan in ways the child can''t foresee. That preserves
  both God''s immutability and the meaningfulness of asking for particular things
  — the immutability is at the level of God''s nature and ultimate will, not at the
  level of refusing to be in genuine interaction with creatures.


  Then maybe one final move (7) one: But this makes any answer to petition impossible
  to verify or interpret. If the healing comes, you say God granted it; if it doesn''t,
  you say God incorporated the request into a better plan. A "response" that is indistinguishable
  from no response is idle, and calling it relation solves nothing.


