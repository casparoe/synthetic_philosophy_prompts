  Domain: Petitionary prayer to an omniscient and immutable God. The classic problem:
  if God is omniscient (knows what you need), immutable (cannot change), and perfectly
  good, then petitionary prayer seems pointless or incoherent: you can''t change God''s
  mind, inform God, or improve God''s plan. Yet theists pray and traditions endorse
  it. Defenses: prayer changes the petitioner (not God), prayer is a commanded act
  whose value lies in obedience/relationship, God foreordained both the prayer and
  the answer (so prayer is a means, not a change), prayer is a way of participating
  in God''s action, etc. Opponent replies: if God''s plan already included your prayer,
  then prayer is epiphenomenal with respect to outcome; "prayer changes you" doesn''t
  explain why the content of petition (asking for specific things) matters rather
  than just meditation; immutability seems to rule out responding to prayer as a trigger.
  Friends could argue.


