  Two friends of mine, one a philosophy graduate student and the other a former seminarian,
  recently spent an evening arguing about petitionary prayer, and I''ve been trying
  to sort out who was right. The seminarian opened the substantive part of the argument
  by saying that petitionary prayer to a God who is omniscient and immutable seems
  unintelligible: an omniscient God already knows what you need before you ask, and
  an immutable God cannot be moved by your asking to do anything other than what He
  was already going to do, so the petition appears to be trying either to inform God
  or to change His mind, both of which are impossible given those attributes. The
  philosophy graduate student replied that this is too quick, because classical theism
  has always allowed that God can will the prayer and its answer together from eternity:
  God does not change when a prayer is "answered," because the granting was always
  part of the eternal decree, with the prayer willed as its means rather than as an
  afterthought. The seminarian answered that this makes prayer epiphenomenal with
  respect to the outcome—if the decree fixes both the asking and the granting, there
  is no sense in which the asking makes an outcome-difference; it no more changes
  the result than a rooster''s crow changes the sunrise, and the familiar fallback
  that prayer changes the person praying cannot explain why the content of the request
  should matter if its point is simply to align the petitioner''s will with God''s.
  The graduate student countered that this employs the wrong standard of difference-making:
  ordinary requests are also embedded in a causal network such that there is no possible
  world where the request is removed and everything else held fixed, yet we do not
  call them idle; and a petition can be an element of a genuine relationship with
  an unchanging God in the way a child''s particular requests to a parent are part
  of a shared life, not levers that compel a change in the parent. At that point someone''s
  phone rang and the argument ended.


