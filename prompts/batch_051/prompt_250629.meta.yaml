  Here''s the draft:


  "Everyone invokes Aumann''s theorem as if it says that two rational people with
  the same prior can''t disagree. That''s not what the theorem says. Aumann''s 1976
  result — the ''agreeing to disagree'' theorem — says something narrower: if two
  agents have a common prior, and their posterior beliefs about a given event are
  common knowledge, then their posterior beliefs must be equal. The word ''common
  knowledge'' is doing a lot of work. In the theorem, it means the two agents'' posterior
  probabilities are public information: each knows the other''s posterior, knows the
  other knows it, and so on.


  In practice, almost no real-world disagreement satisfies that condition. When I
  think the probability of AI catastrophe this century is 0.3 and you think it''s
  0.1, my posterior isn''t common knowledge to you in the exact sense, and vice versa.
  You can observe my conclusion, but not the full information partition that generated
  it, and you can''t distinguish my conclusion from the conclusion I would have drawn
  if I''d reasoned from a different model. So the theorem doesn''t say we''re both
  rational and must converge; it says that once our actual posterior probabilities
  become common knowledge in the formal sense, one of us would have to update, on
  pain of violating the common-prior assumption or Bayesian coherence.


  This matters because rationalist discourse sometimes uses Aumann as a cudgel: ''if
  we had the same priors and were both rational, we''d already agree, so your disagreement
  is evidence you''re being irrational.'' That move is a category error. The theorem
  is an equilibrium condition, not a conversational norm. It doesn''t tell us what
  a rational agent should do upon hearing that someone disagrees; it tells us what
  the state of the world must be like if disagreement is common knowledge. In real
  life, the polite epistemic move is to treat the other person''s opinion as evidence
  about your own reasoning, but the theorem itself doesn''t say how much weight to
  put on it. You need a model of why you expect the other person''s posterior to be
  informative."


