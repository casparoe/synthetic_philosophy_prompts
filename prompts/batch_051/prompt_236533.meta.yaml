  make the attitude fitting). E.g., evidence that p is a reason to believe p; a person''s
  kindness is a reason to admire them.

  - "Wrong kind" reasons (WKRs): reasons that bear on the attitude through the desirability/utility
  of having the attitude itself (state-given, or "attitude-given"?), e.g., an evil
  demon will punish you unless you admire him; that''s a reason to admire him, but
  it doesn''t make admiration *correct* or *fitting*; it''s a reason of the wrong
  kind. Also "pragmatic reasons for belief": believing you''ll recover improves recovery
  odds; that''s a reason to believe but not evidence.


  Criteria people use:

  1. Object-given vs. state-given: RKR are provided by features of the object of the
  attitude; WKR are provided by features of the state of having the attitude.

  2. Right-kind reasons determine fittingness/correctness: an attitude is fitting
  iff there are sufficient RKRs; WKRs don''t affect fittingness.

  3. WKRs are reasons for *bringing it about* that one has the attitude, or for wanting/trying
  to have it, rather than reasons for the attitude itself.

  4. "Wrong kind of reasons" are not really reasons for the attitude but for desiring
  the attitude / for acting to cause it. (This is a substantive view: some say WKRs
  reduce to reasons to want/have attitudes.)

  5. Parity or "object-given vs. state-given" with a normative asymmetry.


