  her telling, the mind is to the brain as a program is to the computer: the symbol-level
  description — beliefs, desires, decisions — is a real causal level, but it doesn''t
  violate the underlying physics any more than a word processor''s ''delete paragraph''
  command reaches down and pushes individual transistors around. She then ties this
  to Dennett''s careenium thought experiment, which she summarizes roughly as follows.
  Imagine a two-dimensional world containing many tiny balls that roll, collide, and
  stick according to simple local rules. Configurations of balls can be interpreted
  as symbols, and over time these configurations get caught up in self-perpetuating
  cycles. Dennett''s question, as she puts it, is whether the symbols push the balls
  around; her answer is that they don''t — the balls push the balls around — but the
  symbol patterns are nonetheless the level at which the interesting causal regularities
  live. She uses this to argue that worries about ''mental states being epiphenomenal''
  rest on a confusion, and that folk psychology is safe.


