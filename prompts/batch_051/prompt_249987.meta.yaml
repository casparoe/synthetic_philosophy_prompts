  Arguments for rigor early:

  1. Cognitive: rigor is the actual subject; teaching intuitive shortcuts can implant
  misconceptions that must be unlearned later (e.g., treating functions as formulas,
  limits as "approaching but never reaching" which later conflicts with epsilon-delta).

  2. Epistemic honesty: without proof, students are being asked to accept claims on
  authority, which is contrary to the aims of mathematical education; rigor gives
  reasons rather than authority.

  3. Transfer: habits of careful definition and inference are what transfer to new
  problems; students who only have intuitive heuristics can''t extend them to novel
  cases.

  4. Motivational (counterintuitive): some students find the structure and certainty
  of proof more satisfying than hand-wavy applications; rigor can be the hook for
  exactly the students who dislike fuzzy "real-world" framing.

  5. Preparation/sequencing: later courses (analysis, abstract algebra) presuppose
  proof fluency; delaying rigor creates a bottleneck and inequity, since only students
  who learn it outside class succeed.

  6. Distinguishing genuine understanding: students can often parrot intuitive explanations
  without being able to use them; proof forces demonstration of understanding. (This
  overlaps with epistemic honesty maybe.)


  Arguments for motivation first:

  1. Psychological readiness: formal proof requires formal operational thinking and
  tolerance for abstraction; most students aren''t developmentally ready early, so
  rigor early causes failure and dropout. (Piagetian, maybe outdated but still an
  argument.)

  2. Meaning precedes form: definitions and proofs make sense only after you have
  examples and intuitions; rigor without intuition is empty formalism — students can
  verify steps without understanding what they''re doing.

  3. Motivation: students need to see why the mathematics is worth doing (applications,
  beautiful patterns) before they''ll invest in hard proof; otherwise you filter out
  everyone except the already-committed.

  4. Historical: mathematics historically developed informally first and was rigorized
  later (calculus used for centuries before epsilon-delta); teaching in the historical
  order respects how understanding develops.

  5. Inclusivity/equity: motivation-first approaches broaden the pipeline by not requiring
  a taste for abstraction as an entry ticket.

  6. Retention: intuitive understanding is more durable and easier to reconstruct
  than memorized proof techniques.


