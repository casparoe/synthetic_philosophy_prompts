  Let''s formulate:


  "Hey, so you''re a professional philosopher who knows Nietzsche''s early essays
  pretty well. I''ve recently gotten pulled into a local project about preserving
  our town''s old immigrant neighborhood, and it''s made me realize I''m torn between
  wanting to learn all the history and feeling like it''s making me less able to just
  live in the present. I''ve been trying to work through a line of thought based on
  Nietzsche''s distinction between monumental, antiquarian, and critical history,
  and I need someone to check it."


  Then steps:


  (1) Life and action require both remembering and forgetting: too much historical
  awareness makes a person unable to act, because every possible action looks like
  just another repetition or ironical commentary.

  (2) Monumental history is healthy only insofar as it gives present actors inspiring
  models from the past; antiquarian history is healthy only insofar as it preserves
  and cherishes a given inherited form of life; critical history is healthy only insofar
  as it breaks the spell of an inherited form of life enough to allow new action.

  (3) These three modes don''t fit together in one life at the same time: monumental
  history needs simplified, possibly distorted examples from the past, but critical
  history would undermine those simplifications; antiquarian history needs loyalty
  and reverence, but critical history trains suspicion and rupture.

  (4) So a person must choose, in any given period, which mode to let dominate.

  (5) Critical history is the most dangerous of the three, because while monumental
  and antiquarian history can go wrong only by becoming one-sided, critical history
  can go wrong by cutting the roots of any identity at all.

  (6) Therefore, if my main goal is to live well rather than to be a historian, I
  should mostly avoid critical history, and if I use it, it should only be as a rare
  instrument when a particular inherited practice is demonstrably blocking life.

  Is this argument valid? If not, which step fails, and what is the best repaired
  version?


  I suspect step (3) overstates the incompatibility; can''t a person use critical
  history on some parts of the past while still being loyal to others? Or is Nietzsche
  actually committed to something like (3) because he thinks these are not just methods
  but different attitudes toward time? Please start by brainstorming the strongest
  reading of each step before deciding where it breaks."


