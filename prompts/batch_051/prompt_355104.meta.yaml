  the entire functional organization of a human brain in a different substrate — say,
  millions of people exchanging signals so as to reproduce exactly the same pattern
  of causes and effects among states — I cannot bring myself to believe there would
  be anything it is like to be that system. Even if it winced and protested, I would
  think it was not hurting. And yet, under functionalism, it ought to have exactly
  the same pains, fears, and intentions as the brain it reproduced.


