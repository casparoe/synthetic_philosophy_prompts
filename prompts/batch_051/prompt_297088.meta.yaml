  The boundary problem: who is entitled to participate in which collective decision?
  In democratic theory, two broad criteria:

  1. All affected interests principle: everyone whose interests are affected by a
  decision should have a say in it, proportional to how affected? Robert Dahl articulated;
  Goodin radicalized: because everyone''s interests may be affected (externalities
  are pervasive), "the demos" expands to all of humanity—there is no principled boundary;
