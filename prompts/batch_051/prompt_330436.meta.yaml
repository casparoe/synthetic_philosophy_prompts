  The position that has come to seem most compelling to me in the philosophy of biology
  is the gene''s-eye view of evolution, roughly as articulated by George C. Williams
  and Richard Dawkins. On this view the gene — or, more carefully, the replicator
  — is the fundamental unit of selection; organisms are best treated as vehicles,
  survival machines, or temporary coalitions whose apparent design exists because
  it promoted the differential survival of the replicators that built them; and phenomena
  such as altruism, cooperation, and group-level adaptation are to be explained through
  inclusive fitness and kin selection rather than through selection for the good of
  the group or the species. I find the view hard to resist because one spare accounting
  scheme handles such a wide range of phenomena: sterile workers in social insects,
  meiotic drive and other selfish genetic elements, parent–offspring conflict, and
  the peculiar logic of genes that spread while harming the organisms that carry them.
  But I want to know what this position actually risks — what observations, formal
  results, or theoretical developments would count against it, and where its defenders
  themselves would feel the pressure.


