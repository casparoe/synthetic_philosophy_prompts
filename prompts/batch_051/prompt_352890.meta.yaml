  vs. which are particular to reductionist or holistic camps; (c) identify any pair
  that cannot be jointly satisfied — e.g., strict explanatory reduction + multiple
  realizability; or microfoundations requirement + explanatory adequacy given limited
  info; (d) say which single requirement knocks out the most versions.


