  Desiderata for methodological individualism (MI):

  - Nontriviality: MI must not be the tautology that only individuals exist / only
  individuals can act; it must be a substantive claim about explanatory priority or
  reduction.

  - Empirical adequacy: must be consistent with robust macro-level regularities (e.g.,
  Durkheim-style suicide rates, price-level phenomena, segregation dynamics).

  - Handling of social properties/kinds: it must specify how social predicates (being
  a citizen, inflation) relate to individual-level facts: definitional reducibility?
  supervenience? multiple realizability?

  - Microfoundations requirement: if it demands microfoundations for every macro claim,
  it must say what counts as a microfoundation (mechanism? possible individual story?
  actual individuals?).

  - Structural constraints/downward causation: must accommodate or explain away cases
  where social structure constrains individuals — norms, institutions, roles — without
  reifying social entities.

  - Emergent/composition effects: must account for aggregation paradoxes (Condorcet,
  Arrow), counterintuitive composition (Schelling segregation), and unintended consequences.

  - Explanation of individual action itself: if it privileges individual intentions,
  it must handle the fact that beliefs, desires, and options are socially constituted
  (language, culture).

  - Predictive/explanatory power: must not forbid legitimate explanatory macro claims
  that outperform any available individual-level account.

  - Causal/explanatory relevance: it has to explain why individual-level descriptions
  gain relevance and when they don''t.


