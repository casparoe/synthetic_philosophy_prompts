  from? Jeffrey conditionalization treats them as given; it doesn''t tell you how
  to extract them from the experience. (That''s a common critique: it''s incomplete
  as a model of uncertain evidence.)

  - It doesn''t always commute: updating first on one partition then another can give
  different results than the reverse, if the partitions aren''t compatible; but with
  proper "sufficiency" conditions it can be fine. There are results about when Jeffrey
  updates commute (e.g., if the second likelihood is measurable wrt...).

  - Problems with "old evidence" and "unknown evidence" etc.

  - The "rigidity" condition can fail when the experience is informative about the
  conditional relations.

  - There''s a known concern that uncertain evidence should be handled by the "Bayes''
  theorem for uncertain evidence" / "probability kinematics." Pearl''s "virtual evidence"
  method: treat the uncertain observation as a virtual variable with a likelihood
