  Jeffrey conditionalization: If you undergo an experience that changes your probabilities
  over a partition {E_i} (where E_i are propositions, e.g., "the cloth is blue," "the
  cloth is green"), then for any proposition A, P_new(A) = Σ_i P_old(A | E_i) * P_new(E_i),
  assuming the "rigidity" condition: P_new(A | E_i) = P_old(A | E_i) for each cell
  of the partition. This generalizes Bayesian conditionalization (where a cell gets
  probability 1).


