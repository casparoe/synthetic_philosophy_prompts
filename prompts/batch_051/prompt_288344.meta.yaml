  Let me flesh out heterophenomenology accurately to write a good prompt.


  Dennett introduced "heterophenomenology" in "Quining Qualia" (1988) and expanded
  in Consciousness Explained (1991). It''s a method for studying consciousness scientifically.
  Heterophenomenology: the researcher''s task is to collect subjects'' first-person
  reports about their conscious experience and treat them as "raw data" in the form
  of texts, to be interpreted using the intentional stance. The reports are not assumed
  to be "true" reports of an inner realm; rather, the world they describe (the "heterophenomenological
  world" of the subject) is a theorist''s fiction, constructed like a literary critic
  constructs the world of a novel. The subjects may believe what they say; the method
  simply treats the reports as the subject''s expressed beliefs about what seems to
  them. Then one tries to explain why the subject says those things, correlating with
  neuroscience. It contrasts with "lone ranger phenomenology" (first-person introspection
  as a method) and with "Cartesian materialism" (assuming there''s a theatre where
  conscious experiences are displayed).


  Key elements:

  - Third-person, objective method.

  - Takes subjects'' utterances as data; reports as expressions of beliefs about experience.

  - Suspends judgement about the truth of the reports about what is "really going
  on" inside; but the reports themselves are data and must be accounted for.

  - Uses the intentional stance: describe subjects as agents with beliefs/desires,
  predict and explain their reports.

  - Constructs the subject''s "heterophenomenological world" — the world according
  to the subject — as an interpretation of the text of their reports.

  - Goal: a neutral account of the data (what people say about their experience) that
  science can then explain, without smuggling in assumptions about qualia etc.


  The journalist translation:

  - Interviewing: record exactly what the source says; transcribe faithfully. Don''t
  put words in their mouth. Could correspond to "taking reports as data."

  - Quoting: reporting "X said Y" rather than "Y is the case." Corresponds to bracketing
  truth.

  - The "heterophenomenological world" ≈ the world as described in the source''s account;
  a profile or reconstruction: "the world according to the minister." A feature piece.

  - The intentional stance ≈ the standard journalistic practice of interpreting statements
  as intentional actions: they spoke because they wanted to convey something, influence
  coverage, etc.

  - Off the record / on background: maybe not mapping.

  - Fact-checking: journalist normally tries to verify the content of claims; heterophenomenology
  explicitly does NOT (and cannot) verify the content of first-person reports; it
  only needs to accurately record that the claim was made. This is a residue/difference.

  - Journalism ultimately aims at truth about events "out there"; heterophenomenology
  says there is no independent "inner event" to check the report against — no direct
  access. So the suspension in journalism is provisional and motivated by fairness/accuracy;
  in heterophenomenology it''s principled/epistemic.

  - Objectivity: both value neutrality and fair representation; but journalism''s
  neutrality is often both-sides/fairness, heterophenomenology''s is method.


