  on the strength of the steps, not on exegesis.

  (1) For anything that appears as an object — a thought, a body, a world — I can
  ask whether it is the ātman, and the answer is no: the self is what witnesses the
  object, never the object witnessed.

  (2) Therefore the self is not any of the things that appear; it is the condition
  of their appearing.

  (3) What the world appears to be, then — a collection of separate, persisting things
  standing over against the self — is not what is ultimately real.

  (4) Call this ''appearance'' reading of māyā: the world as an object is māyā.

  (5) But the Upanishadic teaching itself appears as an object of my awareness — a
  text, a proposition, a mental state — and so, by (1) and (3), it too is māyā.

  (6) If the teaching is māyā, then the teaching has no more claim to truth than the
  ignorance it is meant to remove.

  (7) No practice, study, or transmission can then be rationally preferred over any
  other, since all is equally māyā.

  (8) Yet Advaita is advanced precisely as the teaching whose study and practice removes
  ignorance. Contradiction.

  Where does this go wrong? If I had to keep something, I would keep (1)–(3); I suspect
  the trouble is somewhere in (5)–(7), but I want to know exactly what I would be
  committing myself to if I revised the argument instead of rejecting it."


