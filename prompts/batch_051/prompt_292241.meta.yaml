  "Right, I''m trying to get my position on machine consciousness and which computations
  matter into something I can defend at a seminar. Here''s where I''ve ended up:


  1. Sentience is a matter of functional organisation, not materials. If you work
  out what the neurons in someone''s brain do, and reproduce that pattern of causal
  work in something else, the duplicate is sentient in just the way the original is.


