  Draft:


  "Consider a proposal, explicitly framed as an attempt to put Aristotle''s account
  of money into institutional practice. Aristotle held that money is a conventional
  device for making different goods commensurable in exchange and for meeting the
  needs of a household; he distinguished this natural, bounded use of money from the
  unnatural, unbounded art of acquiring money for its own sake, and he treated making
  money breed money as a deformation of money''s function. A small municipality, animated
  by this distinction, adopts the following rules. First, it issues a local currency
  whose notes expire sixty days after issue, after which they are no longer redeemable
  or accepted by the municipal exchange office. Second, the municipality sets a household
  holding cap, estimated as what a household needs for two weeks of ordinary purchases,
  and any balance above the cap at the twice-monthly declaration is forfeited. Third,
  the municipality voids all contracts that charge interest or give a lender anything
  beyond the return of the principal, including compensation in goods, in foreign
  currency, or in labor. Fourth, a resident may not buy a good with local currency
  in order to resell it at a higher local-currency price; the exchange office keeps
  a registry of transaction prices and invalidates the resale if the mark-up is found
  to be systematic.


  Treat the proposal as a mechanism rather than a moral position. Work through how
  it would actually behave: what each rule incentivizes among residents, merchants,
  and the officials who run the exchange office; how participants would game the rules
  or route around them while remaining formally compliant (for instance, arrangements
