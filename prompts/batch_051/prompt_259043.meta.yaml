  "OK, here''s a challenge. I keep finding myself stuck on the same set of objections
  to the extended mind thesis, and I''d like to break out of it. The thesis, roughly:
  when a resource in the environment is reliably there, automatically accessed, and
  trusted as much as biological memory, it can be part of the cognitive process, so
  a person''s mind can extend into artifacts. The usual flavor of case is the guy
  who relies on a notebook as his memory and the person who stores the same address
  in her head; the idea is that the notebook entry is functionally a belief."


  List objections:


  1. The coupling-constitution objection: functional coupling is not the same as constitution;
  just because the external item is used at the right time doesn''t mean it becomes
  part of the cognitive apparatus.


  2. The portability/durability objection: when the notebook is lost or out of reach,
  the "belief" disappears in a way real beliefs don''t; you can''t attribute the standing
  belief to him the way you can to someone with ordinary memory.


  3. The derived-content objection: the marks in the notebook mean what they do only
  because someone interprets them; genuine mental states have, so to speak, their
  content intrinsically, not by stipulation.


  4. The bloat objection: if the notebook counts, then all sorts of external informational
  scaffolding counts, and the mind leaks into dictionaries, speed-dial, and timers
  until the distinction between using a tool and thinking with a tool collapses.


  5. The embedded-cognition alternative: we can grant everything interesting about
  scaffolding and context without saying the mind itself extends; say cognition is
  deeply embedded in the environment but the machinery stays in the head. Extension
  is overkill.


