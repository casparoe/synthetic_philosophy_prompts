  Prompt draft:


  "You are an expert on the philosophy and law of online speech, who is also fluent
  in distributed-systems engineering. I am an upper-level undergraduate taking a seminar
  on extraterritorial jurisdiction over online speech, and before university I worked
  as a network/backend engineer; I still think most naturally in the vocabulary of
  distributed systems. I want you to do a translation exercise for me, and I care
  as much about what does not survive the translation as about what does.


  The debate I am studying is this. When a state regulates online speech, it may claim
  to govern not only conduct within its territory but also speech hosted, read, or
  produced elsewhere: a court in one country orders a platform to remove content globally;
  a state requires platforms to delist search results for users everywhere; a data-protection
  regime reaches foreign companies because its residents'' data is processed abroad.
  Legal scholars distinguish jurisdiction to prescribe, jurisdiction to adjudicate,
  and jurisdiction to enforce, and they argue over whether online speech should be
  governed by the country of origin, the country of destination, or some targeting
  principle. Please restate this debate in my native vocabulary -- treating states
  like autonomous systems or name authorities, courts and regulators like policy engines
  or authoritative name servers, speech rules like routing or filtering policies,
  geoblocking like access control at a CDN edge, and global removal orders like a
  route leak or a poisoned cache entry propagated beyond its legitimate scope. Translate,
  as faithfully as you can, the disagreements between origin, destination, and targeting
  approaches into disagreements about where policy should be applied on the path from
  origin to reader, and say which moves in the legal debate become trivial, which
  become sharper, and which become nonsense in that frame.


  Then give me the residue report. I want it in three columns, roughly: (1) claims
  that translate cleanly, because they are really claims about coordination, authority,
  scope, and enforcement; (2) claims that translate only with distortion, where you
  had to stretch the networking concepts to make them fit; (3) claims that have no
  counterpart at all in the distributed-systems vocabulary -- for example, democratic
  legitimacy, the rights of speakers, remedies for individuals, or the normative difference
  between coercion by a state and filtering by a private platform. Finally, tell me
  your honest verdict: are the untranslatable parts doing the real work in the legal
  debate, and if so, is my engineering vocabulary just missing the relevant concepts,
  or is it helpfully exposing that parts of the legal debate are less clear than they
  look? Please begin by brainstorming the mapping before you write anything final,
  and be as precise as you can about which layer of the stack each legal concept maps
  to."


