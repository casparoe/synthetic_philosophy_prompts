  Sherlock Holmes looks structurally identical: outside the fiction ''Sherlock Holmes''
  has no bearer, the bare claim ''Holmes lives on Baker Street'' is not a report of
  fact, and the repair is the same, an operator—''in the Holmes stories''—that makes
  the statement true. So far the two cases seem to be one phenomenon: a term that
  fails to refer can still support truths inside a relativization to a body of discourse."


