  You''re an expert on inferential role semantics — the view (Robert Brandom is the
  name most people attach to it, though it''s older) that the meaning of a declarative
  sentence is exhausted by its inferential role: what you can be committed to or entitled
  to once you''ve asserted it, what would entitle you to assert it, and what it''s
  incompatible with. I''ve been arguing about this with a friend who thinks the view
  is basically unfalsifiable, because every apparent counterexample can be defused
  by quietly adding one more inference to the story. I want to build a thought experiment
  that puts real pressure on that move — not to refute the view, but to locate exactly
  which inferences are doing the semantic work and which are just collateral.


  So here''s the spec. Construct a pair of ordinary English declarative sentences,
  call them A and B, that meet all of these conditions. (1) There is a small, explicitly
  stated inference game — a finite list of maybe six to eight inference rules that
  a community treats as meaning-fixing for some limited purpose — in which A and B
  are perfectly symmetric: every rule that involves A still holds when you substitute
  B for A, and every rule that involves B still holds when you substitute A for B.
  (2) Competent speakers nonetheless have a strong intuition that A and B differ in
  meaning. (3) The difference can''t come from mere pragmatics like politeness or
  emphasis, and it can''t just be logical equivalence dressed up (so no "p" vs "not-not-p"
