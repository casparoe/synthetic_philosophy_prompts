  Brandom''s inferentialism (from Making It Explicit, Articulating Reasons): conceptual
  content is a matter of inferential role; to grasp a concept is to master its use
  in inference; meaning is determined by the inferences a sentence is involved in,
  including material inferences (e.g., "Pittsburgh is to the west of Philadelphia"
  -> "Philadelphia is to the east of Pittsburgh"). Also incompatibility relations
  matter: the content of "the ball is red" is partly that it''s incompatible with
  "the ball is green all over." Brandom distinguishes "commitment-preserving" and
  "entitlement-preserving" inferences. He has the idea of "material incompatibility"
  and "modally robust" relations.


