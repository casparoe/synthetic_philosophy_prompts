  The corporate-person analogy: corporations are legal persons — they can own property,
  sue and be sued, enter contracts, and are treated as persons for certain legal purposes,
  but not for others (no voting, no Fifth Amendment right against self-incrimination
  in the same way... actually corporations have some constitutional rights but not
  all). The analogy suggests AI systems might be granted legal personhood piecemeal,
  issue by issue, rather than as an all-or-nothing status. Key philosophical insight:
  "person" in law is not a natural-kind predicate but a cluster of role-specific capacities
  and fictions; legal personhood is an assignment of the capacity to bear rights and
  duties within particular legal relations. So a procedure would be: for each proposed
  legal capacity, ask what function the capacity serves, who the real parties/beneficiaries
  are, whether the entity is the right "address" for the norm, etc.


  A robust procedure might include steps:

  1. Identify the specific legal capacity (incident) proposed — e.g., standing to
  sue, capacity to hold property, capacity to enter a contract, criminal liability,
  tort liability, regulatory obligations, etc.

  2. Ask: what is the underlying function of granting this capacity to any person?
  (e.g., ownership solves coordination/alienation problems; liability creates incentives/compensation;
  contracting enables commitment.)

  3. For the entity in question (AI system or AI-operated entity), can it serve as
  the concrete addressee of the relevant rights/duties, or is it really a conduit
  for identifiable humans? Distinguish two corporate-personality rationales: the "concession/fiction"
  and the "real entity" theory — but keep it usable.

  4. Does the entity have (or can it be given through legally recognized representatives)
  whatever capacities the function presupposes — e.g., the ability to form legally
  relevant intentions, to be deterred/incapacitated, to hold assets separately from
  others, to have standing in adjudication?

  5. Would granting the capacity create a mismatch between the entity that bears the
  right/duty and the humans who decide/benefit? E.g., an "ownership" right for an
  AI with no independent needs might be a way to hide asset owners.

  6. Is there an existing functionally equivalent legal instrument (trust, agency,
  principal-agent, corporate subsidiary, insurance, product liability on the manufacturer/operator)?
  If yes, what gap is the new grant meant to fill? The corporate analogy suggests
  we should prefer treating the AI as property/instrument until a specific gap is
  shown.

  7. What precedent does the corporate analogy set for this specific incident — did
  corporations get this capacity, why, and does that rationale transfer?

  8. Judgment calls: values about who counts as a moral patient, risk allocation,
  and policy goals (innovation vs. precaution) cannot be proceduralized; the procedure
  must hand those to a person.


