  stream of thought to start up again?


  The functionalist says yes, at least in principle, because what matters for consciousness
  is the causal/functional organization, not the material it''s implemented in. If
  the book plus the reader plus the rule realize the same functional organization,
  then it has the same mental life. But I want to resist this, not on the usual grounds
  that the book is just a representation, but because the book has no dynamics of
  its own.


  Here''s the distinction I want to defend. A brain doesn''t merely go through a sequence
  of states; the transitions between states are produced by the system itself, in
  real time, in response to its own prior states and inputs. The book doesn''t do
  that. The page-to-page transitions are supplied entirely by the reader: the reader
  turns pages, the reader interprets the rule, the reader supplies the tempo. The
  book is a set of states waiting to be animated. So the thing that would be conscious,
  if anything, is the whole hybrid system of reader-plus-book, or maybe the reading
  process — not the book.


