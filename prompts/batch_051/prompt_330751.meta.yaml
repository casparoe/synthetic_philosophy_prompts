  Skolem''s paradox details: Löwenheim–Skolem theorem says a countable first-order
  theory with an infinite model has models of every infinite cardinality. In particular
  ZFC (first-order) has a countable model if it has any model. Within that model,
  the formula that says "the set of real numbers is uncountable" holds — the model
  satisfies "there is no bijection between N and P(N)". But from outside, the model''s
  entire domain is countable; the "P(N)" of the model is countable too. Resolution:
  "uncountable" inside means no bijection exists in the model; the model is skolemized,
  missing functions, etc.


