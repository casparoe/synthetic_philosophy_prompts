  revision:


  1. A US college student sells her eggs for $8,000 to pay tuition; she is fully informed
  about the short-term risks and has other borrowed-financing options, though at high
  interest.

  2. A 30-year-old woman in a lower-income country serves as a gestational carrier
  for foreign intended parents for a fee equal to roughly two years'' local wages;
  the agency''s fee is several times larger than hers, and she cannot read the contract''s
  legal language.

