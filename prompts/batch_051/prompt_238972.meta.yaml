  You are a moral philosopher working on exploitation and reproductive ethics. I want
  a working definition of **exploitation** precise enough to do real classificatory
  work in debates about paid surrogacy and egg donation, and to distinguish exploitation
  from the distinct charge of **commodification**. Treat the European bans versus
  the American market as a rough idealization: many European jurisdictions regard
  paying for eggs or gestation itself as the wrong-making feature, while much of the
  US framework treats such payment as permissible provided the arrangement is voluntary,
  informed, and adequately compensated. I don''t need the legal details; I need the
  moral concept.


