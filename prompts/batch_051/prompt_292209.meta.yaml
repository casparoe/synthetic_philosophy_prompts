  "I''m a high school student, and I''ve ended up with a foot in two worlds that almost
  never talk to each other: I''m in my school''s philosophy club, where we''ve been
  reading about transcendental arguments, and at home I''ve been writing a small compiler
  for a toy language I designed, which led me into the literature on compiler bootstrapping
  (so far mostly blog posts and the Dragon Book). Lately I can''t shake the feeling
  that these two things have the same skeleton, and I want to know whether that feeling
  is right or whether I''m just pattern-matching on the word ''presupposition.''"


  Then state transcendental argument:


  "A transcendental argument, as I understand the strategy, replies to a skeptical
  claim not by producing evidence against that claim, but by showing that the very
  performance of making that claim depends on the thing the claim denies. For example,
  a skeptic who argues that there is no objective order...? or ''no enduring subject
  of thought'' still has to present the argument as a single thought with a subject,
  over time, governed by rules; the act of arguing already requires what the conclusion
  denies. So the denial is self-undermining — not because ... but because the presupposition
  is a condition of the act of denying. (I''m deliberately using a loose, generic
  version; I know Kant, Strawson, and others run this in different directions.)"


  Then compiler bootstrapping:


  "The compiler case seems to have the same shape. If I want to build a compiler for
  my language L, and I write that compiler in L itself, then to build the compiler
  I need a working compiler for L already. I can''t test my new compiler except by
  running it on itself; and if I want to replace a compiler with a better one, I have
  to assume the old one is good enough to build the replacement with. The very act
  of trying to get outside L to check L keeps using L."


  Then the mapping/question:


  "The mapping I have in mind is: the skeptic''s claim ~ the proposed new compiler;
  the act of asserting/arguing ~ the bootstrapping process; ''the denial presupposes
  what it denies'' ~ ''building L''s compiler presupposes an existing implementation
  of L''; and the transcendental conclusion ''X is a condition of possibility of the
  practice'' ~ ''a trusted compiler is a condition of possibility of building/checking
  any compiler.''"


  Then question:


  "Is there a real identity of structure here — two instances of a single kind of
  bootstrapping argument, one epistemic and one computational — or is this a loose
  analogy that breaks under pressure? I suspect the difference is that in computing
