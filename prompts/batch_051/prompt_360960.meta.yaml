  ---


  Many employers maintain strong norms, and sometimes policies, of pay secrecy: individual
  employees are discouraged or forbidden from disclosing their own salary or asking
  about a coworker''s, and managers treat compensation as confidential data. At the
  same time, such employers often publish salary bands, declare a commitment to pay
  equity, and run internal pay-equity audits whose results are released only at a
  high level of aggregation.


  Consider a firm that combines all three elements. Its handbook tells employees that
  individual compensation is strictly confidential and that discussing it is unprofessional;
  its intranet publishes a band structure in which the highest band is eleven times
  the lowest; and its annual pay-equity audit reports only that "no systemic unexplained
  gaps were found," while individual unexplained gaps are corrected quietly without
  informing affected employees.


  The question is what this practice presupposes about envy and resentment — specifically,
  about whether an employee''s unease at learning that a peer earns more is a defect
  to be suppressed or a signal to be read.


  For the purposes of the assignment, work with the following Rawlsian distinction.
  Treat envy proper as the disposition to experience another person''s advantage as
  itself a wrong or a humiliation, independent of any judgment that the advantage
