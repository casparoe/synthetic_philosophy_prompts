  ---


  Many private-sector employers, particularly in the United States, maintain a norm
  or policy that individual pay is confidential: employees are discouraged — and sometimes
  contractually forbidden, within the limits the law allows — from disclosing or asking
  about one another''s salaries, while managers and HR treat compensation as sensitive
  information to be kept from staff. At the same time, these same organizations often
  state that they are committed to pay equity, publish salary ranges or bands for
  roles, and sometimes run audits to detect unexplained pay gaps along lines of gender
  or race.


  The puzzle is this. A policy of pay secrecy seems designed to prevent employees
  from learning about pay differences and reacting to them. What does that design
  presuppose about the envy and resentment that such knowledge would provoke? Reconstruct
  the implicit theory of these emotions as carefully as you can. For instance: does
  the practice presuppose that resentment at a pay differential is, as such, something
  to be managed in the employee rather than an informational signal about the justice
  of the differential? Does it treat envy as a standing threat to cooperation that
  must be kept from being triggered? Or is the practice merely compatible with several
  views?


  To make this tractable, use the following distinction from Rawls. Rawls separates
  envy proper from resentment. Envy proper, as he uses the term, is the tendency to
  regard others'' advantages as themselves a loss to us, even when the advantages
  do not take anything from us: the envious person would, if they could, reduce others''
  advantages even at no gain to themselves. Resentment, by contrast, is a moral sentiment:
  it is the reaction to an inequality one perceives as unjust, and it is aimed at
  restoring a fair share rather than at levelling others down. Rawls also holds that
  envy can be excusable when the inequalities in a society are large enough, and conspicuous
  enough, to wound the self-respect of the worse-off, given that the parties cannot
  reasonably be expected not to feel it — though he still distinguishes excusable
  envy from a sense of justice.


  Now take a mid-size company that: (a) forbids employees from discussing individual
  salaries with one another; (b) publishes in its internal portal a set of pay bands
  showing that the highest band is, say, twelve times the lowest band; and (c) runs
  an annual pay-equity audit but keeps the results confidential at an aggregate level
  of "no unexplained gaps found" while correcting individual cases quietly. What theory
  of envy and resentment does this combination of practices presuppose? Answer all
  of the following:


  1. Reconstruct the implicit view of envy and resentment. Be explicit about whether
  the practice presupposes that pay comparisons would produce envy proper rather than
  warranted resentment, and about what the choice to manage the emotion through secrecy
  rather than through changing the pay structure implies.


  2. Distinguish what the practice strictly presupposes from what it merely fits well
  with. Is pay secrecy strictly incompatible with a view on which resentment can be
  a signal of injustice? Could an organization that believed resentment to be epistemically
  useful still choose secrecy on grounds of privacy, negotiation costs, or the difficulties
  of interpersonal comparison? Which theory or theories does the practice quietly
  rule out, and which does it merely fail to implement?


  3. Say whether the three features (a)–(c) presuppose a consistent view. If not,
  describe the inconsistency precisely.


  4. Finally, take the position you find best supported and commit to it: What would
  this company''s policies have to change if it adopted the Rawlsian view that envy
  is excusable when, and only to the extent that, inequalities undermine self-respect,
  while resentment is a potentially reasonable response to perceived injustice rather
  than a defect to be hidden from? Would salary openness follow? Or could a Rawlsian
  still defend some secrecy, and on what grounds?


  Take a definite position throughout. Do not merely list available interpretations:
  say which interpretation the practice, taken as a whole, best supports, and defend
  that verdict.


