  "I''ve been turning over Susan Wolf''s old argument in ''Moral Saints'' and wondering
  whether the rise of effective altruism has quietly dissolved it or made it sharper.
  Wolf''s case, roughly, is that a life organized single-mindedly around moral goodness
  would be an impoverished rather than an ideal human life. She distinguishes two
  ways of being a saint. The loving saint''s happiness is entirely taken up in doing
  good, so they have no room for non-moral excellences or the rough edges of a full
  personality. The rational saint acts from duty against inclination and constantly
  curbs the non-moral interests that make life vivid. Wolf concludes that moral sainthood
  is not an ideal anyone should want, either for themselves or as a society-wide aim."


  "Effective altruism looks like a new development that changes one of the argument''s
  background assumptions: it disaggregates moral agency. The effective altruist needn''t
  be personally saintly in either sense. She can earn to give in a morally indifferent
  job, cap private consumption at a level she has decided is enough, and spend the
  rest of her budget on interventions chosen for expected cost-effectiveness rather
  than direct personal virtue. Morality gets implemented as portfolio management:
  some parts of the self are treated as engines for generating impartial value, while
  other parts are deliberately kept apart as recreation. Tithing, moral divisions
  of labor, offsetting, and quantified impact estimates let someone produce more impartial
  good than many ''saints'' ever would, without exhibiting a unified all-consuming
  moral character."


  "Does Wolf''s argument survive this change? One possibility is that she wasn''t
  arguing against producing a lot of impartial good, but against treating morality
  as the single dominant standpoint from which a whole life is evaluated—in which
  case the EA optimizer may be the rational saint in a new costume, with added self-alienation.
