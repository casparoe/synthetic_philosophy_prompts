  out during the presentation. Here is the set, more or less verbatim from my notes:


  1. I accept Morgan''s canon, at least in the corrected form it takes in contemporary
  debate: if two accounts of a piece of animal behavior both cover the evidence, one
  attributing a more sophisticated psychological capacity and one attributing a less
  sophisticated one, the burden of proof rests on the more sophisticated attribution,
  and we are entitled to proceed with the less sophisticated one until it fails.

  2. I think the distinction between lower and higher psychological faculties is scientifically
  workable as a rough ordering: reflexes and fixed action patterns at the bottom,
  then associative learning and simple forms of representation, then belief-like or
  concept-like cognition, then the capacity to attribute mental states, and so on.

  3. I also think we should be symmetric in our caution: just as we should not infer
  human-like cognition from a single clever behavior, we should not infer that a nonhuman
  animal lacks a capacity merely because its evolutionary history is unlike ours;
  under-attribution is as much an error as over-attribution.

  4. I accept some version of evolutionary continuity: capacities that look distinctive
  in humans — affect, working memory, perhaps conscious awareness — are likely present
  in gradations across at least some other lineages, not as all-or-nothing gifts.

