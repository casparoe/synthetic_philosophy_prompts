  I am a novelist, and I want a working definition of the sunk-cost fallacy. Not the
  slogan — I know the slogan — but a definition precise enough to decide which of
  the following count as cases of it. I am confident that the first is a clear case
  and the second is clearly not; on the others I have no settled view, though I keep
  returning to them.


  1. I keep writing a novel I have known since around page 300 to be unsalvageable,
  solely because I have already written three hundred pages.

  2. I set aside a manuscript after forty pages because a better project arrives;
  I do not regard the forty pages as a reason to continue.

  3. A novelist continues a series she has come to dislike because readers are invested
  in the characters — though she has no interest left and no financial need to continue.

  4. A writer continues submitting a much-rejected manuscript because each revision
  has taught him something and each rejection has made him a better editor of his
  own work. I lean toward saying this is not the fallacy, but I cannot say exactly
  why the past is doing legitimate work here and not in (1).

  5. A general refuses to withdraw troops from a failed campaign, saying the soldiers
  who have died must not have died for nothing. I cannot tell whether this is the
  fallacy wearing a uniform or a different kind of reason altogether.

  6. I finish a novel I no longer believe in because I want to be the sort of person
  who finishes what she begins, and because I know my next book will go better if
  I trust that I can finish.

