  We want to define "treating a sunk cost as a reason" / "honoring sunk costs" / "the
  sunk cost fallacy" such that it counts certain cases as the fallacy and certain
  cases as not.


  The underlying conceptual issue: when is persistence due to past investment rational
  vs irrational? Factors that can make past investment relevant:

  1. The investment has changed the actual payoffs going forward (e.g., you''ve learned
  skills, built infrastructure, developed a reputation). These are not pure sunk costs;
  they''re assets.

  2. The investment provides information: a failed project can tell you the next attempt
  might succeed; abandoning after 90% can indicate something.

  3. Commitment devices and identity: wanting to be someone who finishes things has
  future benefits (reputation, self-trust).

  4. The cost of deciding to quit / regret: but is avoiding regret rational? Some
  argue regret aversion is a form of sunk cost.

  5. Contractual/social obligations: having promised to finish.

  6. Enjoyment/value of process.


  Hard cases:

  - Finishing a novel you''ve written 400 pages of, even though you now see it''s
  bad, because you''ve put in 400 pages. Classic sunk cost? Clear fallacy perhaps.

  - Continuing to submit a novel to publishers after many rejections: could be rational
  if rejections are informative? Each rejection could be evidence but after many maybe
  not.

  - Finishing a book in order to learn how to finish a book / to be able to say you
  finished: is that honoring sunk cost or pursuing a new benefit (learning, identity)?
  Borderline.

  - A novelist continuing a series because readers have invested, not because the
  author has: that''s not the author''s sunk cost but obligation.

  - Staying in a career because of the years of training, when switching would forfeit
  earnings: some of that is opportunity cost, but if the past training has no bearing
  on future, it''s sunk.

  - Continuing a meal you paid for (clear fallacy).

  - Continuing a bad relationship because of shared history (sunk cost? maybe commitment/identity).

  - A general refusing to withdraw troops because soldiers already died ("we owe it
  to the fallen") — sunk cost or honoring a value (the deaths must mean something).
  This is a classic case where the fallacy label is contested. Could include.

  - Finishing a jigsaw puzzle or a long novel because not finishing feels like the
  previous hours were wasted — emotional sunk cost.

  - Abandoning a nearly finished manuscript because the ending doesn''t work: rational,
  not honoring sunk cost.

  - Switching to a new career at 50, despite 25 years invested in the old one: rational
  if forward-looking (past not relevant) — clearly not fallacy.

  - Writing a second draft: you don''t count the first draft as sunk because the work
  is revised, not discarded — past investment yields a product (asset).

  - A writer continuing a bad series because each book''s sunk costs are high and
  the next might succeed due to accumulated audience/experience — assets.


