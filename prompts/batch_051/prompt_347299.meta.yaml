  Draft:


  I keep coming back to Locke''s Second Treatise because it gives such a clean criterion:
  government exists to preserve property, and therefore it can''t take any part of
  a man''s property without his consent. I''m not quoting exactly, but in section
  140 he ties these together—the supreme power can''t take property without consent,
  he says, and even though governments need support, that support still has to come
  by the owner''s own consent, which he glosses as the consent of the majority or
  their representatives. On paper this seems rigorous: taxes are just forced transfers,
  and if they''re not consented to they''re theft—maybe not by a highwayman, but by
  an institution that has outgrown its warrant. And the theory gives me a real tool,
  not just vibes: when someone says "the state needs the money," I can ask when and
  how I consented, and the theory says if I didn''t, the taking is illegitimate.


  But I also can''t get rid of the intuition that a progressive income tax used to
  fund schools, or a health service, or courts, is not theft. If my neighbour inherits
  ten million and is taxed forty percent, and that money goes to keep a child from
  starving, I do not feel like I''m watching a robbery. The intuition is firmer than
  a lot of things I actually believe: I don''t just think the tax is tolerable all-things-considered;
  I think the moral description "theft" is wrong. So I''m stuck between a theory whose
  premises seem right and an intuition I can''t disown.


  I don''t want you to tell me "taxation isn''t theft, here''s why Locke was wrong"
  or "bite the bullet, it is theft." I want to know what a negotiated verdict looks
  like. What would it cost to amend or abandon the Lockean view—does the whole consent
  story collapse, or can it be kept by changing what counts as consent? What would
  it cost to debunk my intuition—is it just made of feelings about outcomes, or a
  failure to track where the initial property rights came from? Is there a reading
  where both survive: for example, that the theory correctly says the state may not
  take property without consent, but my intuition is correct that most actual taxation
  isn''t theft because most actual taxpayers have consented in some thicker procedural
  sense? And what would justify each move, rather than just picking one? Please keep
  it continuous prose, no headings, bullet points, bold, or tables—just write it like
  an email.


