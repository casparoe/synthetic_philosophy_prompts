  Correct answer for the problem of old evidence:


  - Bayesian confirmation as positive relevance: E confirms H iff Pr(H|E) > Pr(H).

  - If E is old evidence (already known by the community or by the agent when H is
  proposed), then Pr(E) = 1. Since conditionalization on evidence already certain
  leaves the distribution unchanged, Pr(H|E)=Pr(H), so E cannot confirm H on the standard
  account.

  - But historically, old evidence does confirm: the precession of Mercury''s perihelion,
  known long before 1915 (observed anomaly), was explained/entailed by GR and is standardly
  taken to strongly confirm GR.

  - Core tension: Bayesian conditionalization is a theory of learning from new evidence;
  it seems silent on the role of evidence known before the hypothesis. The problem
  can be generated either from Pr(E)=1 or from the Bayes factor Pr(E|H)/Pr(E)=1 when
  E is certain.

  - Proposed solution (counterfactual): evaluate confirmation relative to a background
  K* that excludes E; ask how much Pr(E|H & K*) exceeds Pr(E|K*), or how much conditionalizing
  on E would raise H. Howson (1991) defends this.

  - Objection/limitation: the counterfactual Pr is not unique—there''s no principled
  rule for how much to "forget"; different subtractions give different degrees of
  confirmation, so the solution doesn''t yield a determinate measure. Also it risks
  being ad hoc.

  - Alternative solutions: Garber''s approach (ascribing probabilities to logical/learning
  propositions), distinguishing theories of acceptance vs. degree of support, etc.

  - Distinguishing from logical omniscience: the old evidence problem concerns evidence
  whose truth is already known with certainty; it arises even for logically omniscient
  ideal agents. Logical omniscience is a different idealization (being certain of
  all logical truths, closing under entailment). Garber argued that relaxing logical
  omniscience can help with certain cases (learning that H entails E), but the problems
  are not identical.


