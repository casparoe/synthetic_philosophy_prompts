  I serve on the methods advisory group of a state agency''s program evaluation office,
  and the director has asked me for a decision aid I think is better built with your
  help. The office decides, several times a month, whether to commission an evaluation
  study before it recommends continuing, expanding, redesigning, or terminating a
  program. The analysts who write those recommendations have no formal training in
  decision theory; the director signs off and is suspicious of spending money on studies
  when ''we could just decide''; and the legislature expects every such expense to
  be justified by its effect on a decision, not by curiosity. Studies cost between
  roughly $30,000 and $500,000 and take two to twelve months, and the funding calendar
  is fixed, so a study almost always imposes a delay cost as well.


  The office has been told that information is never harmful in expectation — the
  result usually called Good''s theorem — and has begun treating that slogan as a
  license to commission studies whenever they are not obviously useless. My impression
  is that the theorem licenses far less than that: the result is that a cost-free
  signal cannot reduce the expected utility of a rational Bayesian chooser, because
  the chooser can always ignore the signal and, with luck, use it to better match
  action to state. It says nothing, by itself, about costly information, about delay,
  about information that could not change the action under any outcome, or about decision
  makers who do not satisfy the theorem''s idealization.


