  Original Putnam BrA-in-a-vat argument (as commonly taught): Suppose an evil scientist
  has envatted my brain, and a supercomputer feeds it the experiences of a normal
  world. If I were such a brain in a vat, could I say or think that I am a brain in
  a vat? Putnam argues no: my word "brain" and "vat" would refer to whatever causes
  my "brain"-ish and "vat"-ish experiences — images in the simulation, not real brains
  or vats — because of semantic externalism. So "I am a brain in a vat" would be false
  (or at least not a statement of the real possibility); hence the skeptical hypothesis
  can''t be truly formulated by its supposed victim, and global skepticism is self-refuting.
  The argument assumes the brain was always envatted (so its language was learned
  entirely inside the simulation) and that no causal link exists between internal
  words and external objects.


