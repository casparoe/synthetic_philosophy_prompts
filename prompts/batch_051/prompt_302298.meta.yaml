  Student answer:

  "Every finite string can be produced by some program — just write PRINT followed
  by the string — so in that sense every finite string is computable and no finite
  string can be random if random means noncomputable. But that''s the wrong sense.
  A fair coin can output 0000000000, and we shouldn''t say that outcome isn''t random
  just because the string looks simple. The right question is about incompressibility.
  A string''s Kolmogorov complexity C(x) is the length of the shortest program (in
  some fixed programming language) that outputs x and halts. A string is random if
  the shortest such program has about the same length as x, i.e., C(x) ≈ |x|. That''s
  why 010010001000010000010000001 has a short description and is not random, while
  something like 0110101110011010 is probably random because no pattern jumps out.
  Martin-Löf randomness makes the same idea precise for infinite sequences: a sequence
  is random iff it is not in any effective measure-zero set, or equivalently fails
  no effective sequential test. For finite strings we can use the same idea by taking
  the sequence''s critical value: a finite string is random to the degree that it
  fails no test at a given significance level. We can also define its randomness deficiency
  as d(x) = |x| - C(x). Since C(x) is defined without reference to any particular
  purpose or background class, d(x) gives an absolute, machine-independent measure
  of how random a finite string is. So yes, finite sequences can be random; they''re
  random exactly when they''re incompressible."


