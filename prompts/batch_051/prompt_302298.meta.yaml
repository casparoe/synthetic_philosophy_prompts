  Question (from the exam):

  "Can a finite binary sequence be random? If the question is ill-posed, explain what
  it might be getting at and whether any precise sense can be given to it. Your answer
  should (i) explain why ''every finite sequence is computable, so none is random''
  is too quick; (ii) define Kolmogorov complexity and say what it means for a finite
  string to be incompressible; (iii) explain Martin-Löf randomness and why it is defined
