  "I direct a small nonprofit that helps people in their late sixties and seventies
  plan transitions: retiring from a career, selling a house, giving up driving, accepting
  help at home. In a typical week I sit with four to six clients for about fifty minutes
  each, and at the end of each meeting I have to leave the client with a written next
  step that my board will sometimes review when a family member questions my advice.
  A year ago I happened on a used paperback of Cicero''s short book On Old Age, in
  which the elderly Cato answers the stock complaints about aging: that it pulls a
  person out of active affairs, that it weakens the body, that it takes away pleasures,
  and that it brings us close to death. Cato''s position, as I understand it, is that
  most of the misery blamed on old age is really a failure of judgment or character:
  the person keeps measuring strength or enjoyment by a standard that no longer fits,
  and therefore mistakes a change in kind of activity for the end of activity altogether.
  What struck me is that my clients say almost exactly the four things Cato answers,
  and he refuses to console them by agreeing that old age is bad."


