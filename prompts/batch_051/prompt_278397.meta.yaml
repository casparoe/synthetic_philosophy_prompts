  a fifty-minute session, without ever mentioning Cicero to a client or requiring
  any philosophical background. Give me a one-page decision procedure — questions
  to ask in order, what counts as a sufficient answer to each, where the procedure
  stops with a no, and where it hands the decision to a human being because the question
  is about safety or values rather than facts. The procedure should help me decide,
  for a given complaint or proposed change, whether the client''s unhappiness is the
  kind of thing Cato would say is an error of judgment that should be resisted, or
