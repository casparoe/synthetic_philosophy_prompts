  Need to ground in Cicero''s views on old age. Actual content: In De Senectute, Cato
  argues old age is not wretched. He answers four standard complaints: (1) it withdraws
  us from active pursuits; (2) it weakens the body; (3) it deprives us of almost all
  pleasures; (4) it is not far from death. His responses: suitable activity for old
  age is mental, not bodily; old men can advise and govern through counsel; memory
  and mind remain if kept active; the appropriate measure of strength is what one
  has, use it; loss of sensual pleasures is a benefit because pleasures are the bait
  of evil; death is not to be feared — either consciousness ends or we go to a better
  place; a good old age depends on a good character cultivated earlier; "old age is
  the final act in the play of life" etc. Also the "best armor of old age" is the
  study and practice of the virtues.


  So a practitioner procedure grounded in these: when a client faces a decision about
  giving up an activity or capability, the counselor should distinguish (a) what the
  client can no longer do (factual loss) from (b) the judgment that this loss makes
  life wretched (attitude). Then ask whether the loss is a loss of physical capacity
  while mental/social/counsel capacities remain; whether the client is treating removal
  of a pleasure/asset as ruin rather than simplification; whether the regret is really
  about the client''s character/virtues not cultivated earlier; whether the fear of
  death/decline is coloring decisions; whether the client has a "suitable activity"
  to substitute. Where the procedure stops with no: when loss is genuinely of all
  activity or when there''s a real values question about reasonable safety to others
