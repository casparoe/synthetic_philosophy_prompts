  while still, at each moment, the posterior is immodest. The prior''s current view
  says the posterior (by conditionalization) is the best *updated credence function*
  in expectation. So changing mind is expected to be accuracy-improving in the relevant
  sense (the posterior is chosen to maximize expected accuracy conditional on the
  evidence).


