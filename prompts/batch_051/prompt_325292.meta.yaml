  Detailed considerations for the analogy''s work: In acausal trade, the standard
  move is that two agents who cannot communicate or causally interact can still cooperate
  if each can predict the other''s behavior via shared decision theory / mutual modeling.
  The open-source spec analogy: two projects implement the same protocol from a public
  spec without communicating; they interoperate. The argument: acausal trade is just
  conforming to a shared decision-theoretic spec; if the expected exchange value is
  positive, both sides implement it.


  What maps to what:

  - Spec ↔ shared decision procedure / decision theory (the "protocol" of cooperation)

  - Two teams ↔ two agents/civilizations/AIs

  - Protocol messages ↔ the "trades" (each side''s conditional commitment: I''ll allocate
  resources to your values if you allocate to mine)

  - Interoperability ↔ mutual prediction and beneficial coordination

  - Public repository/docs ↔ common knowledge? Careful: the spec is a public causal
  artifact; acausal decision procedures aren''t caused by a common external document
  unless there''s a common causal past. This is a key disanalogy.

  - Both teams benefit from compatibility ↔ both agents benefit from trade.


  Where it breaks:

  - The spec has an author/version history; both teams are causally downstream of
  the same document, so conformance to the spec is caused by a common historical event.
  Acausal trade without any common causal past lacks this common cause. Unless the
  agents have common ancestry (e.g., both copied from the same source code), they
  don''t share causal history — in different universes they don''t.

  - In open source, conforming to the spec is verifiable at integration/test time;
  there''s a causal channel to discover mismatches and fix them. Acausal trade has
  no testing phase or feedback loop; mismatches in predicted decision procedure aren''t
  observed and can''t be corrected.

  - Defection in protocol implementation maybe doesn''t directly hurt the defector?
  Actually if you implement a protocol incorrectly, your own system fails to interoperate,
  so you have an incentive to implement correctly because you want the benefit. In
  acausal trade, if you deviate (take the benefit of the other''s cooperation without
  reciprocating), you still get the benefit in worlds where the other predicted cooperation;
  your own algorithm''s consistency is the only thing enforcing it. Is the defection
  symmetry broken? In protocol conformance, defectors are punished by tangible non-interoperability;
  in acausal trade, mutual prediction may have no enforcement beyond logical consistency/self-fulfillment.
  Actually in acausal trade, if the other''s decision procedure predicts your defection,
  they don''t cooperate; the "punishment" is built into prediction, but it flows through
  the other''s model of you, which may be mistaken. So there''s a further issue: the
  other agent must have an accurate model of you without any causal channel.

  - Specs are shared because of a common cause and communication — historically they
  involve communication (mailing lists, RFCs) even if the final implementers don''t
  talk directly. Acausal trade assumes no communication at all; the analogy smuggles
  in all the communication that produced the spec.

  - The open-source case assumes de facto common interests or at least a community
