  Let me consider possible defeaters for Harsanyi''s theorem as foundation for utilitarianism:

  1. The representation-dependence objection (Sen/Weymark): vNM utilities are unique
  up to positive affine transforms; weights depend on arbitrary scaling. Unless one
  assumes interpersonal comparisons or fixes zero/unit for each person''s utility
  (which is exactly the controversial assumption), the weighted sum is not uniquely
  defined. So the theorem doesn''t deliver utilitarianism without presupposing interpersonal
  comparability. Decisive against the "no interpersonal comparison needed" claim.

  2. The Pareto condition itself: Pareto over subjective preferences may be morally
  unattractive if preferences are antisocial, adaptive, or misinformed. Utilitarianism
  usually wants to aggregate welfare, not preferences; Harsanyi''s theorem takes preferences
  as given and may inherit problems of expensive/nasty tastes. This counts against
  the normative significance, but maybe not against the theorem''s formal result —
  awkward rather than fatal, because one can reinterpret utilities as welfare.

  3. The vNM axioms for social preference, especially independence: social rationality
  may not satisfy independence (e.g., fairness concerns, ex ante vs ex post egalitarianism,
  Diamond''s objection to sure-thing at social level). The social ex ante approach
  can conflict with ex post egalitarian considerations; prohibiting that is a substantive
  moral assumption. Defenders concede the theorem is conditional on social rationality
  axioms; they''d say it just makes those assumptions explicit.

  4. The theorem is about attitude aggregation under risk, not about interpersonal
  comparison of well-being; it doesn''t tell you who counts or how to measure welfare.
  The "extended preferences" would require each person to compare states involving
  others'' positions, which might be dubious.

  5. Is the position falsifiable? It''s a mathematical theorem plus an interpretation.
  The formal core is unfalsifiable in a sense (a theorem), but the interpretive claim
  — that it provides a foundation for utilitarianism — can be defeated by showing
  the assumptions do the normative work (the representation objection) or that the
  theorem is too weak/strong. So the position might be "insulated" only by being reinterpreted
  from a foundation claim to a representation theorem. Whether that''s a problem:
  yes, because if it gives a foundation, it must be doing more than restating.


