  Harsanyi''s aggregation theorem (1955): Suppose there are n individuals. Each individual
  i has a preference relation over lotteries satisfying vNM axioms, hence represented
  by a vNM utility function U_i. Social preference also satisfies vNM axioms, represented
  by a social utility W. A Pareto condition: if all individuals are indifferent between
  two lotteries, then society is indifferent; if at least one individual prefers x
  to y and none prefers y to x, then society prefers x to y. Then W is an affine (positive
  linear) combination of individual utilities: W = Σ a_i U_i + b, with a_i ≥ 0 (strictly
  positive if Pareto is strong). The key interpretive dispute: whether this yields
  utilitarianism without prior interpersonal comparisons. Harsanyi interpreted it
  as supporting utilitarianism. Critics (Sen, Weymark, Roemer) argue that vNM utilities
  are only unique up to positive affine transformations, so the weights a_i are not
  meaningful unless interpersonal comparisons of utility levels/units are assumed;
  the theorem turns out to assume cardinal interpersonal comparability or normalized
  utilities. Also the choice of utility representation for each individual affects
  weights. There''s also the issue of whether social preference axioms are controversial,
  e.g., independence for social lotteries. Also the theorem assumes people have "rational"
  preferences and that their extended preferences over social states satisfy vNM —
  or in Harsanyi''s impartial observer version, etc.


