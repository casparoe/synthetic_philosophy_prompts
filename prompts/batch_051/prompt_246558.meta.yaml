  I''ve been going down a rabbit hole on the philosophy of consciousness lately, mostly
  because a friend keeps telling me the "hard problem" is overblown. I read a longform
  essay about illusionism — the view usually associated with Keith Frankish — and
  I''ve re-read the summary paragraph enough times that I''ve half-memorized it. It
  goes something like this:


  "Illusionism is the view that consciousness is an illusion. Philosophers like Keith
  Frankish argue that the subjective, felt side of experience — the ''what-it''s-likeness''
  of seeing red or feeling pain — doesn''t exist. You''re not wrong that you see red;
  what you''re wrong about is that there''s a private, non-physical show playing in
  your head. Introspection misrepresents the brain''s information processing as having
  special qualitative properties, the way a dashboard icon misrepresents what''s happening
  in the engine. The hard problem of consciousness is therefore a kind of cognitive
  illusion too — we only think there''s an explanatory gap because introspection keeps
  telling us there''s something extra to explain. But here''s the problem: an illusion
  is something that appears to someone, so if consciousness is an illusion, somebody
  has to be conscious in order to be taken in by it. Illusionists try to dodge this
