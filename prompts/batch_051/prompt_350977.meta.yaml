  ---


  I teach social epistemology, and I want to see whether a distinction I rely on in
  my own seminar can survive restatement in the vocabulary of a working machine-learning
  engineer. Please do not reach for readings or citations; I will give you the distinction
  myself, in compressed form, so that the exercise tests translation rather than retrieval.


  The distinction is this. An epistemic bubble is a condition of impoverished input.
  A person in such a bubble reasons competently, but the information environment has
  been arranged — through personalization, sorting, or plain omission — so that relevant
  contrary sources and arguments simply never reach them. The defect is in the coverage
  of what is delivered, not in the person''s handling of it. Consequently, a bubble
  can in principle be punctured by exposure: add the missing voices, and the problem
  is at least partly fixed.


  An echo chamber is different in kind. It is not the absence of dissent but the engineered
  neutralization of it. In a chamber, opposing voices do reach the person; what has
  been manufactured is the person''s standing disposition to discount them before
  they are genuinely weighed. The chamber works not by narrowing what is delivered
  but by installing in the receiver a credence function of a certain shape — one that
  assigns low trust to outsiders, prizes insider credentials, and treats the act of
  listening to the other side as itself a betrayal. Adding missing voices can therefore
  deepen a chamber rather than puncture it, because the chamber has already trained
  its inhabitant to hear those voices as evidence of the enemy''s reach.


  Your task is to restate this distinction as faithfully as you can in the vocabulary
  of a competent machine-learning engineer whose daily work is recommender systems,
  ranking, candidate generation, trust and safety, moderation, objective functions,
  and adversarial robustness. Assume your reader is fluent in that vocabulary and
  has no philosophical background. I want the translation itself to be precise: show
  what a bubble is in the engineer''s terms, what a chamber is, and why a chamber
  is not merely an extreme bubble or a bubble plus stubbornness.


  Then give me a residue report. Identify which parts of the distinction carried over
