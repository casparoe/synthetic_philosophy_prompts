  Theory: The average-case (or expected-value) view of alignment guarantees. It says:
  what matters in evaluating whether a system is "aligned enough" is its expected
  performance across the distribution of situations it will actually encounter; this
  is the only tractable, non-arbitrary way to ground evaluations, because worst-case
  analysis over all possible inputs is impossible (adversarial inputs are unbounded,
  natural language is open-ended) and would reject every real system, including humans.
  Systematic virtues: it gives a definite quantity, connects to standard ML practice
  (validation/test loss, expected utility), and avoids impossible demands.


  Firm intuition: For high-stakes, general-capability systems, a tiny probability
  of catastrophic misbehaviour — e.g., 0.1% chance of manipulating its overseers or
  taking a catastrophic action under a rare but realistic input — is not redeemed
  by superb average performance. A system that is "99.9% aligned" with a long tail
  of catastrophe is precisely the kind we should not deploy. No one would board a
  plane or get surgery from a system that is excellent on average but sometimes catastrophic;
  why should a more autonomous system be different? The intuition isn''t mere risk-aversion
  — it''s that alignment claims are modal: they are about what the system wouldn''t
  do, not what it in fact doesn''t usually do.


