  are rational once we look carefully at what the original expenditure actually did.


  A sunk cost is not merely an amount subtracted from some mental account. Expenditures
  have causal consequences. Time spent learning a technique is a cost that cannot
  be recovered, but it produces skills that remain. Money spent on a project may produce
  partially completed components, institutional knowledge, or bright lines that make
  future phases cheaper. In all these cases, citing the past cost is perfectly consistent
  with ignoring sunk costs strictly speaking: the agent is responding to the current
  assets that the past cost created, not to the cost itself.


  More interesting are cases where the past cost did not create any asset but still
  seems rationally relevant. Consider three such channels. First, the cost may be
  evidence. Having spent heavily on a project, I have information about how strongly
  I once believed in it; if I now feel like abandoning it, I should ask whether my
  current mood is a noisy signal compared to the more considered conclusion that led
