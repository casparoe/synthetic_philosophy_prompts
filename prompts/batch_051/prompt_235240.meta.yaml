  The classic points: A rule set with a rule for changing rules; the amendment rule
  must either apply to itself or be changed by another process. If a rule changes
  itself, there''s a paradox: the rule is both operator and operand. Suber distinguishes
  between "amendment" (changing a mutable rule using the current rules) and "mutation"
  (changing an immutable rule or violating the current rules). In Nomic the game,
  you can win by getting points, but you can also change rules to manipulate. The
  paradox of self-amendment: the rule of recognition (Hart) can''t validate its own
  change? Hart''s rule of recognition: the ultimate criterion, its existence is a
  matter of social fact not legal validity; can it be changed by the legal procedures
  it validates? There''s a puzzle about constitutional entrenchment and self-amendment.


  Modern development: smart contracts and DAOs. In a DAO, the rules are encoded in
  executable code; a governance proposal approved through the contract''s own procedure
  then executes an upgrade that changes the procedure. The code that counts the votes
  is itself what gets replaced; the act of amendment and the act of application are
  performed by the same autonomous system, with no gap between reading the old rule
  and enacting the new one. Also upgradeability: proxy contracts, "logic contracts"
  point to implementation; can change behavior with a token vote, even though users
  thought they interacted with an immutable contract. This raises the question: does
  self-amendment become less paradoxical (because the code plainly does amend itself,
  it''s just software) or more (because the validating procedure is collapsed into
  the amended artifact)? And does the old solution — a distinction between rule and
  meta-rule, or between amendment and social practice — survive when the meta-rule
  is also code?


