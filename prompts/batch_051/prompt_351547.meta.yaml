  ---


  I''ve been thinking about the St. Petersburg paradox on my own, and I''d like you
  to check a modification that occurred to me. Please take the role of an expert in
  decision theory and the philosophy of probability, think through the standard case
  before the variant, and be precise about where the standard analysis changes.


  The usual game is this: a fair coin is tossed until it comes up heads; if the first
  heads is on toss n, the player gets 2^n dollars, paid right away. The expected payout
  is infinite, and yet most people would pay only a few dollars to play. The standard
  replies point to the fact that extra dollars mean less as you get richer, or to
  the fact that no real bank can pay arbitrarily large sums.


  Now here is the variant I have been stuck on. Keep the coin fair and keep the payout
  of 2^n dollars, but change the timing. Suppose the tosses happen one per day, and
  when the first heads lands on day n, the money is placed in an account that releases
  it n days later. The player values future money less than money now: for them, a
  dollar received t days from now is worth δ^t dollars today, where 0 < δ < 1. So
  the present value of a win on toss n is δ^n · 2^n.


  How does this change the analysis? Specifically:

  (a) What is the expected present value of a single play, as a function of δ?

  (b) Does this modified game just attach a clock to the original paradox, or does
  discounting actually dissolve the puzzle? That is, in the modified game, is a player
  who maximizes expected present value still unable to name a finite fair price, or
