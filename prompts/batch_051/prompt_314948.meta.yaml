  Question:


  "Module 2 short-answer question (10 points):


  ''Dennett uses the phrase intuition pump to pick out a way some thought experiments
  work. (a) Briefly explain what an intuition pump is and what supposedly distinguishes
  it from a more neutral thought experiment. (b) Pick one example discussed in class
  and explain, with reference to the details of the example, how it pumps an intuition.
  (c) Say how a careful reasoner should respond when they suspect a scenario is functioning
  as an intuition pump, and justify your answer.''"


  Student answer:


  "An intuition pump is a thought experiment that uses a lot of concrete, vivid detail
  to trigger an intuitive reaction in the reader, instead of letting the premises
  of an argument do the work. A neutral thought experiment would state the case in
  the barest terms, so any intuition you get comes from the principles and not from
  the decoration. So really the difference boils down to how much color is added:
  the richer the scenario, the more it counts as an intuition pump. Searle''s Chinese
  Room is the classic example. Searle has a monolingual English speaker in a room
  with a rulebook and some Chinese symbols; the guy matches symbols and passes out
  Chinese responses without understanding a word. The image of a person mechanically
  shuffling symbols is chosen to make it feel obvious that there''s no understanding
  in the room, which is exactly the kind of move Dennett has in mind—he treats the
  Chinese Room as a paradigmatic intuition pump, with the vivid setup doing the work
  his argument against strong AI has to do. So the upshot is that once you have identified
  a scenario as an intuition pump, the intuition it pumps should be discounted as
  basically rhetorical rather than evidence. A careful reasoner, on Dennett''s view,
  should therefore avoid vivid cases when they really want to settle something, and
  should only trust stripped-down, formal versions of an example."


