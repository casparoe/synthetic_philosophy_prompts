  The domain "Deliberation crowds out prediction" involves the idea: when you are
  deliberating about what to do, you cannot simultaneously regard yourself as having
  a definite probability distribution over your possible choices, because your very
  act of assigning probabilities (and seeing them) alters/destroys them. There''s
  a close link to causal decision theory, Newcomb''s problem, and the principle that
  your act and your prediction of your act shouldn''t be treated as independent evidence.
  Some argue deliberation requires uncertainty about what you''ll do, but a small
  uncertainty. Or the idea that predicting your own choice is self-undermining.


