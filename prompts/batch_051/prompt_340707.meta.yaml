  Student answer draft with fallibilism:


  "Peirce''s four methods are tenacity, authority, the a priori method, and the scientific
  method. Tenacity refuses to consider evidence; authority outsources belief to a
  church or state; the a priori method settles belief by what is agreeable to reason,
  which just means taste. Science is different because it holds belief answerable
  to an external reality: something whose behavior doesn''t depend on what anyone
  happens to think about it, and will eventually force agreement. Peirce thinks the
  first three methods are unstable — they work only while a person or community avoids
  alternatives — and also that they can''t correct themselves, because nothing outside
  the method itself gets a vote. Science can in principle find and fix its own errors.


  The pragmatic maxim says the whole meaning of a concept is the sum of the conceivable
  practical consequences of its object; a distinction with no possible practical upshot
  is empty. This is a principle for clarifying ideas, not by itself a definition of
  truth, so the claim in the question is too quick if it pretends Peirce simply defines
  truth as usefulness.


  Peirce''s fallibilism says inquiry never gives us certainty: any belief, including
  scientific results, is open to revision. This seems to cut against science''s special
  status, since if no method arrives at certainty, then the scientific method is in
  the same boat as the others — it''s just one more preference. Peirce tries to avoid
  that by saying science is the only method that would lead to what anyone would eventually
  agree on, but once you''re a fallibilist, ''eventual agreement'' is unfalsifiable,
  so this is closer to faith than argument.


  Still, I think the maxim pushes him into verificationism, and that pushes him into
  the truth-as-usefulness view at the end. If the entire meaning of a statement consists
  in what practical difference it would make, then any claim for which no observation
  or action would make a difference is empty — which is basically the positivist criterion,
