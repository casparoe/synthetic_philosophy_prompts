  Question (about 800 words expected): Explain Peirce''s pragmatic maxim and his account
  of the four methods of fixing belief. Then evaluate the following claim: since the
  pragmatic maxim equates the meaning of a thought with its conceivable practical
  consequences, Peirce is committed to the view that a true belief is just one that
  is useful to hold.


  Answer:


  Peirce describes four ways belief can get fixed. The method of tenacity is just
  refusing to consider counterevidence and repeating the belief to yourself. The method
  of authority is letting an institution or state enforce the correct belief and censor
  the rest. The a priori method lets belief be fixed by whatever seems most agreeable
  to reason, which Peirce thinks is really just taste because it makes inquiry a matter
  of fashon. The scientific method is different because it lets an external reality
  constrain belief: its results are forced on everyone in the long run by something
  that doesn''t care what we happen to think about it. Peirce thinks the first three
  fail because they''re unstable — each one can preserve a belief only while the person
  or community stays isolated from alternatives or coercion, and non of them can correct
  itself.


  The pragmatic maxim, from How to Make Our Ideas Clear, says that the whole meaning
  of a concept is the sum of its conceivable practical consequences, so a distinction
  with no practical difference is no distinction at all. Peirce presents this as a
  method of clarifying ideas, not directly as a theory of truth, so we should be carefull
  not to read James''s later view back into him. In fact the claim in the question
  is false: Peirce doesn''t say truth is usefulness.


  But here''s the part where I think the claim has a point. Even if Peirce says the
  maxim is only about meaning, it slides into verificationism once applied generally.
  If the whole meaning of a statement about, say, the charge of an electron is a set
  of conceivable experimental outcomes, then a claim for which no possible observation
  or practical test would make any difference is empty. That''s basically the later
  positivist criterion of cognitive meaning, and it''s also why Peirce is rightly
  treated as a forerunner of the positivists. And once meaning is tied to practical
  consequences in this way, the scientific method''s superiority is easy to explain:
  science is simply the most useful method for settling our disputes, since it tells
  us what to expect and lets us coordinate. So while Peirce officially refuses the
  "true equals useful" equation, his own maxim plus his defense of science leaves
  him with no real alternative to it. The essay should have said the claim is true,
  not false.


