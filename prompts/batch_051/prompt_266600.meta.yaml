  ---


  We have been discussing the paradox of hedonism in my ethics seminar, and I keep
  coming back to a distinction that our professor made but did not develop. In The
  Methods of Ethics, Henry Sidgwick remarks that the conscious pursuit of pleasure
  seems to be self-defeating: the more one deliberately tries to make pleasure one''s
  direct aim, the less likely one is to secure it, because pleasure arises most reliably
  as a byproduct of engaging with objects and activities for their own sake. The standard
  response is that hedonism should therefore be an indirect strategy—one should aim
  at other goods and let pleasure supervene. But I wonder whether this response blurs
  two quite different claims. One claim is about attention: concentrating on the quality
  of one''s own experience interferes with the absorption that actually produces pleasure.
  Another claim is about motivation: holding pleasure as one''s overriding end makes
  one less attached to the particular people, projects, and norms that normally generate
  pleasure. These might come apart. Someone could be an indirect hedonist about attention—practically,
  don''t monitor your feelings—while remaining an unapologetic direct hedonist about
  justification—pleasure is still the only thing that ultimately matters. Or the motivation
  claim might fail: perhaps one can care wholeheartedly about a project and still
  be motivated by the expectation of pleasure, just not by constantly checking on
  that expectation.


  Please make an argument for the following position: the paradox of hedonism is often
  presented as a single empirical obstacle to hedonism, but it is better understood
  as a composite of at least three distinct mechanisms—attentional, motivational,
