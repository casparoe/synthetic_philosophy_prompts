  Question: Donald Davidson denies that metaphors have a special metaphorical meaning;
  George Lakoff and Mark Johnson claim that metaphor is fundamentally conceptual rather
  than linguistic. Present the strongest version of each view, then argue either that
  they can be reconciled in a precise way or that one view is better supported. Use
  one sustained example to test the difference, and answer the strongest objection
  to your own position.


  Student answer: Davidson''s central claim is negative: a metaphorical sentence means
  only what its words mean literally, and its specifically metaphorical power comes
  from use, not from meaning. It nudges us to notice likenesses, but no proposition
  about those likenesses is encoded or expressed. Lakoff and Johnson reverse the order
  of explanation: systematic cross-domain mappings in thought, such as reasoning conceived
  through combat, are what generate the many ways we speak of arguments as attacked,
  defended, or demolished. The same underlying mapping supports inference, not just
  vocabulary.


  The two views look incompatible, but they are easy to reconcile. Davidson''s target
  is only lexical semantics: he is saying that the word demolish does not carry a
  second dictionary meaning, something like refute, when applied to arguments. Lakoff
  and Johnson are not doing lexicography at all; they are describing conceptual structure.
  So we can keep both claims. The only addition Davidson needs is a standard Gricean
  notion of speaker meaning: the speaker intends the hearer to retrieve the relevant
  conceptual mapping and the intended features of the source domain. Since Davidson
  does not oppose ordinary pragmatic enrichment, this is a clarification rather than
  a revision. The resulting half-way position gives each side its due: conceptual
  metaphor theory describes the background competence that makes Davidson-style noticing
  possible, while Davidson explains why that competence is not part of word meaning."


