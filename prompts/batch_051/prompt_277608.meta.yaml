  idolatry in this broad sense: (1) the thing becomes the centre of gravity for all
  your other evaluations; (2) you protect it from criticism in ways you don''t protect
  other beliefs; (3) you turn to it for something it structurally cannot provide (forgiveness,
  security, meaning, something like that); (4) your relation to it involves a kind
  of submissive dependence; and (5) you start to see its failures as your failings
  rather than its. Now the borderline case: a person who has been through a few rounds
  of burnout and now runs their life by a recovery/self-optimisation framework—they
  track sleep, heart rate variability, mood scores, and treat their ''readiness score''
