  as wasted, on high scores as blessed; they coach friends to do the same, and when
  the framework makes an obviously wrong call (like scoring a joyful wedding a ''bad
  recovery day''), they say the metric must be misread rather than mistaken. Is this
  idolatry in the broad sense? Work through the criteria one by one, honestly, and
  say where the case is genuinely borderline. Also say whether the criteria themselves
  are doing the work, or whether ''idolatry'' only gets its real bite when there is
  an actual object of worship with an altar, a cult, etc. Also whether the person
