  Positions in the debate about special obligations to compatriots:


  - Cosmopolitanism (impartial): everyone''s interests count equally; no special claims
  to compatriots; any partiality is morally arbitrary or at most a permissible personal
  liberty but not a duty; governments should be impartial between citizens and foreigners.
  Awkward commitment: seems to imply a government should, in principle, weigh a foreigner''s
  urgent need equally against a compatriot''s, and potentially neglect its own citizens
  if utility demands; undermines the basis of democratic legitimacy and special state
  duties.


  - Moderate/instrumental cosmopolitanism / "partiality as a useful heuristic": special
  claims don''t exist as fundamental moral facts, but local action is often more effective,
  epistemically accessible, and division of moral labor justifies state-bounded institutions.
  Leaves: compatriot partiality is justified instrumentally as an efficient division
  of labor but defeasible by global efficacy. Awkward commitment: if the heuristic
  fails (e.g., cash transfers abroad are far more cost-effective), the view loses
  its rationale for local preference.


  - Institutionalist/statist partiality (coercion-based): special obligations arise
  among those who jointly author and are subject to coercive institutions (the state).
  Compatriots have special claims because they share a legal/political system that
  imposes decisions collectively. This is Nagel-ish (though I won''t attribute). Awkward
  commitment: it grounds special claims in coercion, so it may deny partiality toward
  compatriots in the absence of shared institutions (diaspora?) and extend claims
  to all co-citizens regardless of shared culture; it may struggle to explain why
  the state has duties to noncitizens beyond humanitarian minimum.


  - Identity/nationality partiality (nationalism): shared national identity, culture,
  language, and the ongoing project of collective self-government create special claims.
  Awkward commitment: it must say what counts as identity and who is in the "nation,"
  risking exclusion or mysticism about nationhood; it may treat accidents of history
  as morally fundamental.


  - Associative/relationship partiality generalized: special claims arise from actual
  valuable relationships (friendship, family, community) and perhaps national community
  is one such relationship. Awkward: doesn''t explain why the nation-state specifically,
  as opposed to smaller or larger associations, is the relevant unit.


  - Localist/communitarian/cooperative-practice view: special claims attach to concrete
  cooperative communities (neighbors, coworkers, municipalities) rather than to imagined
  nations; "compatriots" may be too large an abstraction. Awkward: it might deny substantial
  duties to distant co-citizens while accepting duties to nearby foreigners.


  - Libertarian/no-positive-duties view: the state may not harm or coerce foreigners,
  but citizens also have no enforceable positive duties to compatriots; special claims
  are limited to non-aggression and perhaps contract. This may not fit neatly but
  could be an unoccupied branch.


  - Justic vs beneficence view: compatriots may have priority in matters of justice
  (state-enforced distribution) but not in personal beneficence; or vice versa.


  The splitting questions:

  1. Are there any special claims at all? (impartialism vs partialisms)

  2. If yes, are these claims duties or merely permissions?

  3. If duties, what grounds them: coercion/institutions, identity/relationships,
  or mere efficacy?

  4. Are they defeasible by urgent global need (and on what principle)?

  5. At what scale do they attach: nation-state, subnational communities, family?

  6. Do they apply to personal aid, state policy, or both?


