  Imprecise probabilities / credal sets: represent beliefs by a set of probability
  functions rather than one. Objections:


  - Dilation: Seidenfeld and Wasserman; adding evidence can make the set of probabilities
  for an event wider (more imprecise). E.g., before seeing a card, you''re 1/2 it''s
  red; after learning the card is either... Actually the classic example: a fair coin
  toss determines whether a card is drawn from a deck that is all red or all black
  with unknown composition? Hmm. Let me recall precisely. Dilation: if P is a set
  of priors, conditioning on a partition can make the interval for event E strictly
  larger than before. Example: E = "a card drawn is red"; coin with unknown bias p;
  if heads, draw from a deck with proportion p of red cards... The standard example
  (Seidenfeld & Wasserman 1993): A fair coin is flipped; if heads, draw from deck
  made up of p red and (1-p) black cards; if tails, draw from deck with (1-p) red
  and p black, where p is unknown. Before the coin flip you know P(red) = 1/2 (precise).
  But conditional on heads, P(red) = p, which is imprecise [0,1] say, so conditioning
  dilates from {1/2} to [0,1]. Something like that. I''d describe simply: "dilation:
  getting evidence that''s relevant can leave you with a strictly wider interval than
  you started with."


  - Decision inertia / incompleteness: A set of priors plus a decision rule (like
  Γ-maximin) can lead to not choosing between acts that intuition says are clearly
  OK; you can be "indecisive" in sequential decisions, refusing bets that together
  are favorable (Ellsberg-type).


