  Expected value fanaticism (EV fanaticism): the view that, for any two actions, one
  should choose the one with higher expected value, no matter how small the probability
  of the higher payoff, as long as the payoff is large enough. In moral/altruistic
  contexts: expected-value reasoning suggests that a tiny probability of an enormous
