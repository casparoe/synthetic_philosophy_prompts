  Potential prompt:


  "You are an expert philosopher of cognitive science with a good working knowledge
  of the history of artificial intelligence. I''m a postgraduate student in philosophy,
  and I''ve been reading about the frame problem. As I understand it, the frame problem
  was originally posed for logic-based AI: an agent that represents the world as a
  large set of explicit sentences and acts by deductively deriving the consequences
  of its actions seems to need ''frame axioms'' stating, for every action and every
  fact, that the action does not change that fact, and this explodes combinatorially.
  Philosophers then widened the point: Dennett-style thought experiments turn it into
  a problem about relevance — how any agent knows which of its indefinitely many beliefs
  bear on the current task without searching through all of them. The argument, in
  broad strokes, is that a computationally bounded system cannot get relevance for
  free, so any architecture that relies on explicit symbolic representation plus inference
  is in deep trouble.


  Here is the development I want to test the argument against. The most capable AI
  systems today are not built that way at all. A large language model trained to predict
  the next token over internet-scale text ends up with a kind of distributed, implicit
  world model. If you describe an ordinary situation and an action, it will reliably
  produce the sensible consequences — the glass is still on the table after you read
  the letter, the dog remains in the room after you answer the phone — without any
  explicit frame axioms, without a store of discrete beliefs, and without enumerating
  non-changes. On the face of it, the system gets relevance (or something that looks
  like it) for free, as a by-product of gradient descent over statistical regularities.


  My question is what this does to the frame problem as a philosophical claim about
  cognition. Which precise premise of the frame-problem argument is under pressure:
  that knowledge must be explicitly represented, that relevance must be computed by
  a search over representations, that an agent needs a principled account of relevance,
  or something else? Does the argument survive and show that these systems have merely
  hidden the problem rather than solved it, does it need to be repaired into a weaker
  claim, or should we conclude that the original problem was an artefact of a particular
  architecture and is now largely dissolved? I am asking about the fate of the argument,
  not about whether language models are intelligent or conscious.


