  The frame problem: originally in AI in 1969 by McCarthy and Hayes: how to represent
  the effects of actions without explicitly representing all the non-effects (frame
  axioms). In philosophy (Dennett, Fodor) it became a broader problem about relevance,
  the "robot" thought experiment: how does a cognitive system know which of its beliefs
  are relevant to current action without searching through everything. The classic
  argument: any computationally realistic agent needs to determine relevance cheaply;
  logic-based systems with explicit representations seem to require brute force; therefore
  symbolic/logical cognitive architecture faces probably insoluble frame problem.


  New development: modern large language models / deep learning systems are trained
  on huge corpora to predict next tokens and acquire something like intuitive world
  knowledge; when asked, they answer questions about what happens next in everyday
  situations without explicit frame axioms and without combinatorial search over a
  gigantic belief store. Does the frame problem disappear because these systems don''t
  manipulate discrete beliefs and don''t explicitly infer non-changes? Or does the
  problem relocate (the system might answer well but without an account of how it
  tracks relevance; the problem is still there for any system that must update representations
