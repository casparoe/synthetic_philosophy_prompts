  Exam question: "Explain what Brandom means by saying that the content of a concept
  is its inferential role, and critically discuss the claim that his account cannot
  handle compositionality."


  Student answer:


  "Brandom''s inferentialism is a form of semantic pragmatism that reverses the usual
  explanatory order between representation and inference. On the traditional representationalist
  picture, the meanings of expressions are fixed first by their reference or truth
  conditions, and inference is then defined as truth preservation over those meanings.
  Brandom, following the later Wittgenstein and Sellars, inverts this: the meaning
  or conceptual content of an expression is constituted by the role it plays in inference.
  To grasp a concept is not to have a mental image or a definition; it is to have
  practical mastery of what commitments one would undertake and what entitlements
  one would acquire by using the expression, and of what follows from a claim in which
  it figures. He models this with the idea of deontic scorekeeping: interlocutors
  keep track of each other''s commitments and entitlements, and a speaker''s assertion
  changes the score in normatively governed ways. Importantly, this is a normative
  rather than a causal account of content: what matters is not what utterances actually
  cause, but what a community is disposed to treat as a correct or incorrect inferential
  move.


  For Brandom, then, the content of a sentence is given by the set of inferences it
  licenses, where the relevant inferences are those underwritten by the rules of logic.
  ''It is raining and the streets are dry'' entails ''It is raining'' purely in virtue
  of the logical form of conjunction, and it is this kind of formally valid transition
  that constitutes the content of the sentence on Brandom''s view. Whatever additional
  associations a sentence happens to trigger in speakers are merely psychological
  and do not belong to its meaning.


  The main objection is that inferentialism cannot explain compositionality. Fodor
  and Lepore have argued that if the meaning of a sentence is its inferential role,
  and inferential roles are holistic, then meanings cannot be combined: the role of
  a word would shift with every new belief one acquires, so there would be no stable
  item associated with a word to serve as the input to a compositional function, and
  no finite theory could generate the meanings of complex expressions. In my view
  Brandom can set this worry aside, because it presupposes exactly the representationalist
  picture he rejects. Once content is thought of pragmatically, as a matter of what
  speakers do, there is no reason to require that the ''content'' of a whole be a
  function of the contents of its parts. Compositionality is a constraint on truth-conditional
  semantics, not on inferentialist semantics, and Brandom never takes on the burden
  of satisfying it."


