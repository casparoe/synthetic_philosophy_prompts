  We should think about actual US defamation law to make tensions real and allow good
  answer.


  US defamation: A statement is defamatory if it''s a false statement of fact, published
  to third party, causing harm, with requisite fault. Opinions are generally protected
  because they can''t be proven false. But "opinion" that implies an assertion of
  objective fact can be actionable (Milkovich v. Lorain Journal: "there is no separate
  constitutional privilege for opinion," but statements that cannot reasonably be
  interpreted as stating actual facts are protected). So the line is not expression
  vs fact, but whether the statement implies false facts.


  Ratings: credit ratings (Moody''s, S&P) — can they be defamatory? Courts have generally
  protected bond ratings as opinions/predictive statements? Actually rating agencies
  have faced claims; ratings are opinions about creditworthiness, protected unless
  actual malice? There''s New York Times v. Sullivan for public figures; ratings agencies
  are not defendants in defamation usually. Analyst forecasts / price targets are
  opinions. Restaurant reviews are protected opinion but factual statements within
  review actionable.


