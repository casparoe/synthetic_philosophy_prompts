  The philosophical material is the following debate. One side holds that at least
  some knowledge or understanding has final value: it is worth having independently
  of what it enables us to do, and curiosity is a standing virtue of the inquirer
  rather than an appetite for novelty. The other side holds that the value of knowledge
  is always instrumental, and that curiosity is at best a useful trait whose worth
  is exhausted by the practical or social outcomes it tends to produce.


  Translate each side into the vocabulary of behavioral ecology and life-history theory.
  I am fully fluent in that vocabulary and only partially fluent in the philosophical
