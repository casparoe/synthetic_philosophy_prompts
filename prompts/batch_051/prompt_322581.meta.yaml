  ---


  For a reading group on Darwin and cultural evolution, I want you to build a decision
  tree (or sorting quiz with a scoring key, whichever works better) that takes people
  from a starting commitment to a named position on the Darwinian theory of culture.
  Use Darwin''s bit in The Descent of Man as the anchor — you know the passage, where
  he says (I''m paraphrasing) that the struggle for existence is constantly going
  on among words and grammatical forms, and the better, shorter, easier forms gain
  the upper hand, and languages can be classed like organic beings. I want the tree
  to be built around whether that analogy can be cashed out literally or not.


  The leaves I want to end up with are at least these five: the meme''s-eye view where
  cultural items are the real replicators and humans are their vehicles; the dual-inheritance
  view where culture is a second inheritance system that coevolves with genes but
  can''t be reduced to them; the cultural-attraction view where cultural stability
  comes from shared psychological biases rather than high-fidelity copying; the loose-analogy
  view where cultural selection is only a metaphor and the real selection operates
  on biological hosts; and a deflationary view that says the whole Darwinian vocabulary
  is just re-description with no predictive added value. If your question space generates
  other coherent positions, include them too.


  Build the tree from the logical space, not from the list of names. That is, first
  lay out the diagnostic questions and the combinations of answers they allow, then
  locate the actual positions in that space, and flag unoccupied combinations with
  a short note on why nobody is there — incoherent, unattractive, or just unexplored.
  Also flag any pair of leaves your tree can''t really separate, rather than pretending
  they''re cleanly distinct.


  The diagnostic questions should each be a concrete case or claim that the positions
  genuinely come apart on, phrased so someone can answer without knowing the labels.
  Dont ask things like "do you think memes exist?" Use cases: a song hook spreading
  through a population, a chain letter that mutates as it''s forwarded, a pronunciation
  change sweeping through a dialect, a scientific concept that shifts mean as it gets
  taught, a religious taboo that persists despite costly compliance, a fad diet that
  burns out while a cooking technique survives. Score people by what they say about
  the cases, not by which label they like.


  Audience is a mixed reading group — some evolutionary biologists, some cultural
  theorists — so the questions should not presuppose insider knowledge of memetics
  or dual-inheritance theory. Eight to ten questions is about right. After the tree
  or quiz, give the scoring key and then walk through how you''ve placed each of the
  five named leaves in your logical space, and which feature of each diagnostic question
  is doing the separating work.


  ---


