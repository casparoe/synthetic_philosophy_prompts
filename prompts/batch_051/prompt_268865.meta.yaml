  Let me think carefully about Sen''s liberal paradox.


  Amartya Sen, "The Impossibility of a Paretian Liberal" (1970, JPE). The paradox:
  Given a social choice framework, conditions:

  - Unrestricted domain (all individual preference profiles allowed)

  - Pareto principle: if everyone prefers x to y, society prefers x to y

  - Minimal liberalism (Sen''s "condition L"): each of at least two individuals is
  decisive over some pair of alternatives (e.g., person i decides whether x socially
  beats y regardless of others'' preferences)

  - Social preferences are acyclic/transitive (collective choice exists)


  Then no social decision function can satisfy all.


  Standard escapes/reconciliations:

  1. Weaken or amend the Pareto principle (e.g., allow rights to trump Pareto — Gibbard''s
  libertarian claim; rights as constraints on social choice).

  2. Weaken liberalism: not requiring decisiveness over pairs in the social preference
  but rights as game form/constraints (Nozick, Sugden), rights as non-interference;
  libertarian rights can''t be represented as social choice conditions.

  3. Restrict domain: require preferences to be "liberal" or tolerant/nosy preferences
  excluded; if people prefer not to meddle, paradox disappears (Blau?). Actually if
  individuals are meddlesome/nosy, paradox arises.

  4. Allow cyclic social preferences or use different aggregation (partial order,
  quasi-transitivity).

  5. Reinterpret alternatives more richly (include choice of who reads the book as
  separate features), i.e., refine the description of outcomes, removing the conflict
  (Sen himself and Gibbard suggest this: the Lady Chatterley case dissolves if alternatives
  describe actions over one''s own life).

  6. Give individuals rights over their own actions but not over outcomes; distinguish
  rights from preferences.

  7. Use social choice with rights as decisive over features of the state, not pairwise
  outcomes.


