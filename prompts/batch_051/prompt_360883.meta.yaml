  Kripke''s Wittgenstein:

  - Rule-following paradox: No course of action could be determined by a rule because
  any course can be made to accord with the rule (that''s from PI §201, actually "This
  was our paradox: no course of action could be determined by a rule, because every
  course of action can be made out to accord with the rule."). I can''t quote. I can
  paraphrase.

  - Kripke''s sceptical paradox: All my past uses of ''plus'' are compatible with
  my having meant ''quus'' (defined as x+y if x,y < 57, otherwise 5). No fact about
  my mental states, past behaviour, or dispositions settles whether I meant plus or
  quus. For any finite set of past examples, infinitely many functions fit them.

  - Sceptical solution: Accept that there is no truth-making fact that I meant plus;
  meaning isn''t a matter of facts about me alone. Instead, meaning is constituted
  by my use within a community: I am entitled to answer ''125'' to ''68+57'' because
  my response matches what the community would do, and the community can correct me.
  The normativity of meaning comes from social agreement.

  - Important: Kripke''s solution relies on communal agreement, "assertability conditions";
  not truth conditions.


  Now the LLM development: LLMs are trained on vast human text and can continue arithmetic
  sequences correctly, summarise, translate, etc. They are not members of a human
  community in the relevant sense: no shared form of life, no participation in correction,
  no standing to be corrected, no intentionality (depending on one''s view). Yet they
  often produce responses we treat as correct. Does this threaten Kripke''s solution?
  A few angles:


  1. If the community-agreement view is right, the LLM doesn''t mean anything by its
  outputs; it just happens to mimic the community''s responses. So far no threat:
  the LLM is like a parrot or a thermometer. But the development might put pressure
  on the idea that agreement is distinctive of a human form of life: if a statistical
  model trained on our own text can replicate our shared responses without sharing
  our lives, then what did the community add? If the community replies were merely
  statistical patterns all along, does that reduce normativity to frequency? Or is
  the LLM parasitic on the community (trained on human use) and therefore no counterexample
  — it borrows rule-following from the community without being a rule-follower itself.


  2. But the new development might bite on the premise that only community membership
  can supply correctness conditions. Suppose we begin to rely on LLMs as judges of
  correct continuation in a community (e.g., students check their answers with an
  AI). If the community treats the LLM''s outputs as authoritative, is the LLM now
  part of the community? Or does the community''s deference to a non-member undermine
  the community as the source of correctness, because it can no longer directly sustain
  the agreement?


  3. Another angle: Kripke''s view requires that for an individual''s symbols to have
  meaning, they must be part of a community that shares a form of life: "agreement
  in judgments" (PI 242: "If language is to be a means of communication there must
  be agreement not only in definitions but also... in judgments"). I can paraphrase.
  An LLM trained on our text captures regularities but has no judgments. If we treat
