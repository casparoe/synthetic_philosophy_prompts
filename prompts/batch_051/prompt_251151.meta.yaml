  then uses it to rewrite the electoral law in its own favor, forcibly retire judges
  and replace them with loyalists, and turn the public broadcaster into a party organ.
  Elections continue, but observers begin rating them free but not fair.


  Case B. An incumbent narrowly loses an election, falsely claims it was rigged, pressures
  election officials to "find" missing votes, and his supporters storm the legislature
  to stop certification. Certification is delayed but eventually completed, and the
  incumbent leaves office under legal compulsion.


  Case C. A party wins office promising strict migration controls and steep tax cuts,
  enacts those policies through normal legislative procedures, and is voted out four
  years later.


  Case D. A dominant party never cancels elections and allows real opposition parties
  to run, but over three decades it has made campaign finance, media ownership, and
  district boundaries progressively more favorable to itself. It keeps winning national
