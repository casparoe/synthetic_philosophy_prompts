  Draft essay:


  "Nearly every philosophical discussion of computer-assisted proof begins with the
  worry that such proofs cannot be surveyed by a single mathematician. I suspect this
  is the wrong starting point. The word ''surveyable'' covers at least three different
  things: (1) step-surveyability, the ability of a human to check each inference in
  the proof one at a time; (2) global surveyability, the ability to hold the proof''s
  architecture in view and see how the pieces fit together; and (3) self-containedness,
  the property of depending on no empirical premise. Once these are pulled apart,
  much of the supposed novelty of computer proofs disappears. Finite mathematics is
  already full of globally unsurveyable proofs — exhaustive classifications, long
  enumerations, combinations of many lemmas — and no one denies that they are proofs.
  Step-surveyability, on the other hand, is not plainly lost when a computer checks
  cases: the steps are specified precisely enough that a human could, in principle
  and with unlimited time, check them, just as one trusts a colleague''s arithmetic
  without redoing it. The genuine break lies in self-containedness. An ordinary proof
  of a theorem says that the theorem is true; an actual computer-assisted proof, as
  opposed to an idealized computational derivation, additionally depends on the empirical
  claim that a particular physical machine executed a particular program without a
  hardware fault. That claim is not a mathematical fact and cannot be established
  by mathematical reasoning alone. The philosophical question, then, is not ''can
  a proof be unsurveyable?'' but ''can empirical evidence about a machine''s behavior
  transmit mathematical warrant?'' Formal proof objects and independently checked
  implementations are one answer, because they turn the empirical claim into the target
  of a further computation; but that answer only pushes the question back. The four-colour
  theorem and the Kepler conjecture are important less because they were first proved
  by computer than because their subsequent formal verification and reimplementation
  show how the empirical element of computer proof can be tamed."


