  "I will defend two claims. First, the philosophical novelty of computer-assisted
  proof has been mislocated. It is usually described as a crisis about surveyability:
  a proof no single mind can hold in view cannot be a proof. But there are at least
  three senses of ''surveyable'': (a) step-checkability, each inference step can be
  checked by a human; (b) global comprehension, one person can grasp the proof as
  a whole; (c) self-containedness, no essential step depends on empirical facts. Traditional
  finite proofs often fail (b) while satisfying (a) and (c). Computer proofs fail
  (a) in the sense that we cannot check the million cases, but they satisfy (a) if
  we treat the program''s operation as a rule-governed computation we could in principle
  check given unlimited time. So the supposed crisis of surveyability is less sharp
  than advertised. Second, the real break is with (c) for most actual computer proofs:
  they rest on the empirical premise that the machine executed the code correctly,
  which is an engineering claim about a physical artifact, not a mathematical lemma.
  To restore self-containedness one must either produce a formal proof object and
  verify it with an independently implemented checker, or treat the empirical premise
  as another premise of the theorem (the theorem becomes ''conditionally on the program
  and hardware behaving as specified, p''). Both moves change what a proof is for.
  The interesting question is whether that change is tolerable or whether it strips
  proof of its distinctive authority."


