  "Most philosophical discussion of computer-assisted proof runs together three distinct
  properties. The first is uncheckability: a proof whose length or case count makes
  human verification infeasible. The second is opacity: a proof some of whose inferential
  steps are executed by a program whose correctness cannot be internally inspected
  in the act of following the proof. The third is substitutability or dependence:
  reliance on an artifact whose warrant is empirical rather than mathematical. I want
  to argue that only the third marks a real departure from traditional proof, while
  the first two are differences of degree, not kind. Long finite proofs have existed
  for a century; machine execution of rule-governed steps is no more opaque than the
  mental arithmetic of a coauthor one trusts. The genuinely new feature is that a
  computer-assisted proof asks us to accept a mathematical theorem on the strength
  of a causal claim about how the machine behaved. The philosophical challenge is
  therefore not to define ''proof'' but to decide when empirical evidence about computational
  behavior can transmit mathematical warrant. Here the four-colour theorem and the
  Kepler conjecture point in different directions: the former survives because its
  computations have been reimplemented and formally checked; the latter... Hmm."


