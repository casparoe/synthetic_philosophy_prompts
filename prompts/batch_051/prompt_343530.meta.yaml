  "The standard evolutionary argument for drawing the boundary of an organism runs
  roughly as follows. A multicellular body is one individual because its cells are
  genetic near-clones whose reproductive fortunes rise and fall together; natural
  selection can therefore suppress within-body conflict and shape the cells into a
  functionally integrated unit. A mere aggregation of genetically distinct individuals
  does not meet this condition, since their interests can diverge. During my career,
  we treated this as almost definitional. The development that now unsettles me is
  the holobiont: many familiar ''organisms'' — a coral, a legume, arguably a mammal
  — contain persistent microbial partners that are genetically foreign, are often
  transmitted from parent to offspring, and supply functions the host cannot perform
  for itself. Taken literally, the genetic-common-fate argument would seem either
  to exclude these familiar organisms from organismhood or to force us to count the
  host plus its microbes as one individual. Does the argument survive this development,
  does it need repair (for instance by replacing genetic identity with something like
  functional integration or joint control), or was genetic identity always a proxy
  and holobionts simply expose that fact? I am less interested in the empirical catalogue
