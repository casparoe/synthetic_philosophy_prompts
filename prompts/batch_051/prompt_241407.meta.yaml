  Let me consider the taxonomy/decision tree for costly signaling in depth.


  Positions on why reliable signals are reliable (evolutionary biology / animal communication):


  - Zahavi''s handicap principle: signals are honest because they are costly; the
  cost is what makes them reliable. Strong version: wastefulness itself guarantees
  honesty.

  - Grafen''s formalization: honesty can be an ESS when signaling cost interacts with
  quality — high-quality individuals pay lower marginal cost. This vindicates a qualified
  handicap.

  - Index signals / unfakeable signals (Maynard Smith & Harper): some signals are
  reliable because they cannot be faked — the signal is physically constrained by
  the trait it advertises (e.g., roar pitch and body size; a small frog can''t produce
  a deep call).

  - Cost-free conventional signals: reliability can be maintained by receiver retaliation
  or repeated interaction, or via common interest (Maynard Smith''s Sir Philip Sidney
  game shows honest signaling can be cost-free when interests overlap; "cheap talk"
  can be honest in repeated games).

  - Sensory bias / receiver psychology: traits evolve to exploit pre-existing receiver
  biases; honesty is accidental or not central.

  - Runaway Fisher process: elaborate ornaments are not honest indicators of anything,
  just arbitrary aesthetic coevolution.


  For human behavior:

  - Costly signaling theory in anthropology: rituals, hunting big game, conspicuous
  consumption signal quality and commitment.

  - Veblen: conspicuous consumption as status.

  - But some argue costly religious practices are commitment signals / credibility-enhancing
  displays (CREDs).


