  ---


  You are a political philosopher who works on distributive justice and the ethics
  of risk. Please think carefully, and write your answer in British English.


  Dworkin-style luck egalitarians draw a line between brute luck and option luck.
  Brute luck is the stuff that just lands on you without any choice — your genes,
  where you were born, a tree falling on your car while it''s parked. Option luck
  is the result of a deliberate gamble: you start a restaurant, it goes under, and
  you eat the loss. The core luck-egalitarian thought is that inequalities traceable
  to brute luck are the ones society should compensate, whereas inequalities traceable
  to option luck can in principle be left where they fall, because the person chose
  the risk. The well-known objection to this is the abandonment objection: someone
  who voluntarily does something risky and ends up ruined seems to be told, by the
  view, that they own the whole disaster and are owed nothing — which strikes many
  people as gratuitously cruel. The standard luck-egalitarian reply is that a risk
  only counts as option luck if the person had adequate opportunity to foresee it
  and to insure against it, so the view doesn''t actually abandon people who couldn''t
  have known or hedged.


  Now here is the new development I want you to think through. Imagine that personalised,
  algorithmic risk scores become cheap and ubiquitous. A person can be shown, before
  they make a choice, a fairly accurate, individually tailored probability that a
  bad outcome will follow — job loss, illness, a car accident, whatever — based on
  data from millions of people with a similar profile. But the scores come from black-box
  models: nobody, including the person being scored, can really explain why the number
  is what it is, the score is often wrong in the individual case (it gives you "a
  23 percent chance" and can''t tell you wether you''re the unlucky one), and the
  institutions using the scores understand them much better than the people being
  scored. Suppose an employer runs the score, sees that an applicant''s risk of leaving
  after six months is high, and doesn''t hire them; or suppose the state runs the
  score and then, after a bad outcome, treats the person as someone who "chose" the
  risk.


  Here is what I''d like you to work out. Does the luck-egalitarian argument survive
  this development, does it need repairing, or does the brute luck/option luck distinction
  itself start to fray? In particular, I want to know whether the option-luck category
  requires not just that risk information was *available* but also that it was reasonably
  *comprehensible* and something the person could genuinely act on as an agent. Can
  someone be said to have chosen a risk when they were shown a probability they couldn''t
  interpret, from a model they couldn''t interrogate? If the distinction frays, what
  should the view become — for example, should it shift from a view about which risks
  individuals own to a view about the fairness of risk-management institutions? Try
  to identify the exact premise the new development bears on, say how a defender would
  repair the view, and then assess whether the repair actually works or just relocates
  the problem.


  ---


