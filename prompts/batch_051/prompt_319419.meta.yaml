  Let me recall Cox''s theorem details.


  Cox''s theorem (Richard T. Cox, 1946, "Probability, Frequency and Reasonable Expectation",
  American Journal of Physics). The modern presentation (Jaynes, "Probability Theory:
  The Logic of Science") posits that we have a set of propositions, and a real-valued
  "plausibility" or "degree of belief" function. Cox''s desiderata (as commonly presented):


  1. Degrees of plausibility are represented by real numbers (more precisely, an ordered
  system).

  2. Consistency with common sense / qualitative correspondence: if two different
  paths of reasoning lead to the same conclusion, they should give the same plausibility.

  3. Consistency (structural): The plausibility of a conjunction AB should be a function
  of the plausibility of A and the plausibility of B given A; similarly for negation:
  the plausibility of not-A is a function of the plausibility of A.


  From these, Cox derived that plausibility must be a monotonic rescaling of a probability
  measure satisfying the sum and product rules.


  There are known issues: Cox''s original proof had gaps; Halpern (1999) gave a counterexample
  showing that Cox''s assumptions as stated are too weak (and also that certain natural
  strengthenings still admit non-probabilistic representations). Actually, Jaynes''
  formulation and later work (e.g., by Kevin Van Horn, Ariel Caticha, or Halpern)
  illuminate this. The conceptual issues: Are Cox''s "desiderata" normatively compelling,
  or are they just one possible set of axioms? Does the theorem justify probability
  as the logic of plausible reasoning, or does it just show that if you accept certain
  assumptions, you get probability? Is the representation of belief by a single real
  number appropriate when evidence is incomplete or conflicting (e.g., imprecise probabilities)?
  Does the theorem depend on Boolean algebra of propositions? Countable additivity:
  Cox''s derivation yields finite additivity, not necessarily countable additivity
  — is that a problem? Also, "plausible reasoning" vs. "deductive logic": Cox argued
  that deductive logic is a limiting case of plausible reasoning (certainty 0 and
  1).


