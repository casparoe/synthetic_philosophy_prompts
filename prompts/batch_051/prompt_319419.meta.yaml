  (ii) if a conclusion can be reached by two different lines of reasoning from the
  same information, both must assign it the same plausibility; (iii) the plausibility
  of a conjunction depends only on the plausibilities of the two conjuncts taken separately;
  and (iv) the plausibility of a negation is determined by the plausibility of the
  proposition negated. From the third desideratum, using the associativity of conjunction,
  Cox derived the product rule, p(AB|C) = p(A|C) p(B|AC), and from the fourth, together
  with the requirement that certainty and impossibility be represented consistently,
  he derived the sum rule p(A|C) + p(¬A|C) = 1. What the theorem is taken to show
  is that any scheme of plausible reasoning satisfying these desiderata is equivalent
  to probability theory: after a monotone rescaling, the plausibilities obey the probability
  axioms. This is then used normatively: if you accept the desiderata as requirements
  of rationality, your degrees of belief must be probabilities. The derivation also
  gives countable additivity, so the resulting degrees of belief must be countably
  additive as well. A standard limitation is that the theorem assumes from the start
  that belief is captured by a single real number per proposition; this rules out
