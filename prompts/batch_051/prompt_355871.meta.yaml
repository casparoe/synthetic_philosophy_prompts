  ---


  Yesterday evening I had a long argument with a friend about the "heat of passion"
  doctrine in criminal law, and I still can''t decide whether he was right. In many
  common-law systems, someone who kills while in the grip of sudden passion—for instance,
  upon unexpectedly discovering a spouse''s infidelity—is convicted of manslaughter
  rather than murder and receives a much lighter sentence. But the mitigation is tightly
  bounded. The provocation must be of a kind that would cause an ordinary person to
  lose self-control, and the defendant must not have had a "cooling-off period" long
  enough for that ordinary person to regain composure; if the reaction was disproportionate,
  or followed a delay, or involved any forethought, the mitigation is withheld.


  My friend''s contention was that this doctrine is philosophically incoherent because
  it treats the same emotion under two incompatible descriptions. On one side, the
  law treats the defendant''s passion as a non-rational surge that temporarily overwhelms
  or suspends the capacity for self-control—something that happens to a person, like
  a fever or a reflex, and therefore excuses in part. On the other side, the tests
  of adequate provocation and the reasonable cooling-off period treat the passion
  as something answerable to reasons: the jury is asked whether the emotion was a
  fitting or proportionate response to the situation and whether a reasonable person
  would still be in its grip. He argued that you cannot consistently hold both that
  an emotion bypasses a person''s judgment and that it can be judged by the standard
  of how a reasonable person would respond.


  I find the inconsistency he points to plausible, but I don''t know which half to
  give up, and whether giving one up would force the law to change more than he thinks.
  What account of the emotions—as judgments or appraisals, as bodily feelings, as
  perceptions of what matters, or something else—does the heat-of-passion doctrine
  actually presuppose? Is it strictly committed to incompatible accounts in its two
  halves, or is there a single theory of emotion that makes sense of both the excusing
  and the reason-evaluating elements? And if the law were rebuilt around a consistent
  theory, how would the practice of differentiating murder from manslaughter have
  to look?


