  Theory: ergodicity economics — the distinction between the ensemble average (average
  over many parallel universes / many identical investors) and the time average (what
  actually happens to one investor over time), and how maximizing expected value can
  be misleading when the process is non-ergodic and dominated by multiplicative growth
  / potential for ruin. Provide some injected ideas: the idea that a bet can be good
  on average across parallel worlds but still lead almost surely to ruin if repeated/leveraged;
  that true "optimal" behavior for a single non-ergodic trajectory often maximizes
  expected log growth, not expected value; that leverage magnifies non-ergodicity
  because losses compound multiplicatively.


  Ask for: use that lens on LTCM. What the theory says the fund was doing wrong (taking
  enormous expected-value-positive convergence trades but leaving no survival margin
  for path; treating small statistical edge as repeatable ensemble average; leverage
  turning a bad month into a death spiral), where it explains (the blow-up as non-ergodicity/ruin
  rather than just bad luck), and where it''s silent or misleading (liquidity spirals,
  other players copying the trades / crowding, counterparty risk, the fact that the
