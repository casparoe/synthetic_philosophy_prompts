  Canonical nonidentity problem (Parfit''s "The 14-Year-Old Girl" and "Depletion").
  The structure: A choice by present agents changes which future people exist. Standard
  person-affecting intuition: an act is wrong only if it makes some specific person
  worse off than they would have been otherwise. Under the choice, no existing person
  is made worse off: the resulting people have lives worth living and wouldn''t have
  existed under the alternative. Therefore person-affecting view says the choice is
  not worse (or not wrong for those people).


  Variation idea: Identity is chancy and overlapping. Normally "different child" means
  wholly different genetics. What if the choice affects the timing of conception such
  that there''s a nonzero probability that the same child is conceived (same egg/sperm
  meeting) but at a different time? In real biology, conceiving later means different
  egg and sperm, so different child, but with a small chance... no, different egg
  guaranteed (different month) so different child. Could make the case probabilistic:
  a procedure where conception timing is slightly shifted but there''s a 50% chance
  the same embryo forms. Then there''s an "unidentified victim" — the act creates
  a lottery over possible identities. Does a person-affecting view now say the act
  is wrong? If we compare each possible person''s expected wellbeing across choices?
  But if same person exists in some branches and is harmed, then ex ante that person
  is wronged with some probability. Interesting: the nonidentity problem becomes a
  problem of ex ante vs ex post harm and expectation.


  Maybe too complicated but could be a crisp variation: "Suppose the woman''s choice
  doesn''t determine whether child A or child B exists, but rather determines a 50%
  chance each exists. Changing the choice changes the probabilities of two possible
  people existing, and each possible person''s expected well-being if they exist is
  higher under one choice. Does the nonidentity argument still work, or does it now
