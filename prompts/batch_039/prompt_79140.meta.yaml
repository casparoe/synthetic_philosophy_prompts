  person must be its author — she must deserve to have it.


  The endowment lottery: before anyone is born, each of us chooses her own constitution
  — her talents, her temperament, and how much effort she will find it natural to
  expend — from a common menu, and only then is born into her circumstances. We introduce
  the lottery to block the obvious reply that the arbitrariness of our actual origins
  is a contingent fact about this world rather than a feature of desert as such.


  The argument:

  1. (Provenance) A person deserves a good on the basis of a feature only if she deserves
  to have that feature.

  2. No one deserves her constitution, and no arrangement of origins could change
  this: to deserve the constitution she has she would have to have chosen it, and
  to deserve the constitution with which she did the choosing she would have to have
  chosen that, and so on. Every genealogy of a self begins somewhere unearned.

  3. Talents, temperament, and the propensity to exert effort are parts of a person''s
  constitution.

  4. So no one deserves to have the features on which assessments of merit rest.

  5. So no one deserves anything on the basis of merit — not the job, not the prize,
  not the salary.

