  "I am a novelist at work on my fourth book. Its central figure is a philosopher
  of physics who holds that time does not pass, and I need to understand the strongest
  form of one particular argument for that view well enough to put it in her mouth
  in a long scene, without embarrassing myself in front of readers who know the field.
  Please take the role of a philosopher of physics who is also a patient expositor,
  and before you write anything, spend a little space thinking the argument through
  for yourself: set out the readings of it you can see, say which is the strongest,
  and then discard the weak ones. I have more than school physics — I can read a spacetime
  diagram and I know what an inertial frame is — but I am not a philosopher; assume
  I can be taught, and don''t assume I already know the labels.


  The argument, as I have it from a friend, runs like this. Special relativity tells
  us that simultaneity is relative to a frame: for any event that is spacelike separated
  from me here and now, there is an inertial frame in which it is simultaneous with
  my now. If being simultaneous with my now is what it is for an event to be real
  for me, then that distant event is real for me now. Now take a second event, spacelike
  separated from the first but lying in my future, and a third observer for whom that
  second event is simultaneous with her now; the second event is real for her now,
  and if what is real for someone now is real, then the second event is real — real
  for me too, even though it is in my future. Iterate the step and every event in
  spacetime turns out to be real now, so there is no objective present and the future
  is as real as the past. The argument strikes me as suspiciously cheap and also hard
  to escape.


  What I want from you:

  1. The argument laid out as an explicit chain, each step labeled as a premise or
  an inference, with the one step that is doing the controversial work identified
  and explained — not merely named.

  2. Whether the transitivity of the relation the argument needs (call it real-as-of)
  is essential. If we grant that real-as-of is frame-relative but deny that it is
