  a glass is fragile is just saying that it would break if struck, in the right way,
  under the right conditions — and then we do the two families of counterexample that
  everyone knows. First the ones where something interferes with the disposition itself
  at the moment of manifestation: the glass that a spell makes unbreakable in the
  instant before it hits the floor, so the condition (it gets struck) is met and the
  manifestation (it breaks) never comes, yet we still want to say it''s fragile. Then
  the ones where the disposition is intact but blocked: the glass packed in foam,
  which is as fragile as ever but which never breaks because the foam does the work.
  We then read the repairs — add a clause about the conditions being ''intrinsic'',
  or about nothing interfering, or about the disposition''s causal basis being present
  and unaltered — and of course every repair gets a counterexample of its own, and
  so on. By the end of week three everyone in the room agrees the simple analysis
