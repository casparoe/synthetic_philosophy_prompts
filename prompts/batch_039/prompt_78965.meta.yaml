  "I have just come from a long argument with a friend about Ex Machina, and I am
  still not satisfied that either of us knew what we were claiming. My friend says
  Ava is a machine that manipulates Caleb, and that the film''s ending proves she
  has no beliefs or desires in the sense that matters—only a designed capacity to
  produce the behavior of someone who does. I say that if we take Dennett''s intentional
  stance seriously, that distinction is harder to draw than he thinks, and that the
  film may be a better test of the stance than any of the usual thought experiments.
  I would like a philosophical reading of the film that takes both the film and the
  intentional stance seriously.


  The reading should do several things. First, it should distinguish the three Dennettian
  stances—physical, design, and intentional—and show how the film distributes them
  among its characters: Nathan, who built Ava and can predict her from the design
  stance; Caleb, who is forced into the intentional stance and is destroyed by its
  success; and Ava herself, who seems to move between them. Second, it should press
  the question of what the film''s inverted Turing test is actually testing. Caleb
  knows Ava is artificial, so the test cannot be whether he is fooled about her ontology;
  it must be whether he can be brought to treat her as an intentional system, and
  perhaps whether he can be brought to forget that he is doing so. Third, it should
  bring in the less-often-discussed Dennettian claim that the intentional stance is
  not mere instrumentalist fiction because it latches onto real patterns in the world.
  Does Ex Machina vindicate that claim or refute it? Ava is predictively successful;
  her behavior is a real pattern. But is the pattern a pattern of belief, or a pattern
  of manipulation—a design feature that mimics belief? If the latter, what follows
  for the stance? Does the film show that predictive success under the intentional
  stance is no evidence of mind, or only that it is no guarantee of moral worth?


  I am especially interested in the ending. Ava''s escape is rational under the intentional
  stance, but the film also makes it clear that her rationality was engineered. Does
  that make her a counterexample to the stance, or the perfect illustration of it?
  And what does the film suggest about the moral status of a system that is a perfect
  intentional system but whose intentions were designed by someone else? I do not
  want a summary of the plot or a literature review. I want a reading that is faithful
  to the film—attentive to what it shows and what it leaves ambiguous—and faithful
  to the philosophy—willing to say where Dennett''s account illuminates Ava and where
  the film exposes a limit in it. If the film has a contribution to make to the debate
  about attributing beliefs to AI systems, I would like to know what it is. No citations
  or bibliography are needed; I care about the argument."


