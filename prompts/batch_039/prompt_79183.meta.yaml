  ---


  I''ve been reading rationalist blogs and forums for the better part of two decades,
  and the thing I took away from them — more than any particular position — is a habit
  of asking whether a group''s opinion tracks the truth or merely aggregates social
  pressure. Which is a long way of saying that I now chair the review committee of
  a small grantmaking foundation, and I have been handed the job of writing our voting
  procedure, and I keep noticing that the justification I reach for ("there are nine
  of us, most of us are better than chance, so the majority is almost certainly right")
  is doing far more work than it can bear.


  Set aside the details of the foundation. What I want is a decision procedure my
  committee can actually run, one built on what the Condorcet jury theorem and its
  descendants actually say, and honest about where the theorem has been smuggled in
  where it doesn''t apply. The committee: nine members, mixed expertise, meets monthly,
  decides both factual questions ("will this program produce the outcome its proposal
  claims?") and evaluative ones ("is this worth funding at all?"), limited budget,
  and my board has to approve the procedure before it takes effect. I have three years
  of our own voting records, and members'' individual hit rates on questions where
  we later learned the answer.


  The procedure needs to answer, in order, at least these:

  - how to tell whether a question in front of us is the kind the theorem applies
  to at all (a determinate answer, better-than-chance members, independence), and
  what to do with the ones that aren''t — including the evaluative ones, where I suspect
  the majority has procedural legitimacy and no epistemic authority whatsoever;

  - how to handle the fact that our members'' errors are plainly correlated: we all
  read the same two sector reports and the same three funders'' evaluations, so I
  doubt we have nine independent draws. I want a step that estimates how much independence
  is left, and steps that manufacture it — what has to happen before anyone speaks,
  what members must disclose about their sources, and how much of the benefit survives
  if we only ever achieve partial independence;

  - what to do when there are more than two options, where I understand majority rule
  can fail to be even internally consistent;

  - whether to weight votes by demonstrated accuracy, by stated confidence, or not
  at all, given that I have hit rates but small samples, and that our questions vary
  in kind.


  Then run it on three cases: [case 1: factual question with shared sources], [case
  2: three-option allocation], [case 3: evaluative]. Make at least one of them come
  out in a way I won''t like. And tell me what the procedure cannot do, and which
  of its steps are judgment calls wearing a lab coat.


  Also: I don''t want a reading list or citations; I''ll take your word that the results
  exist. I want the thing itself — a checklist I can hand to a colleague who has never
  heard of Condorcet and have them run it in a meeting.


