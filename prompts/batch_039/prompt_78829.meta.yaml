  But actually maybe the strongest, most distinctive prompt: laïcité with a precise
  position that goes beyond the standard: something like — "I''ve come to think that
  the French principle is the right one, but for a reason its defenders usually don''t
  give: not that religion is dangerous, but that the state can''t treat people as
