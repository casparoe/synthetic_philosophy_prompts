  for church upkeep either — the inconsistency isn''t a reason to relax the rule but
  to extend it. What would count against this?"


  Hmm, that''s coherent and interesting. Then the defeaters: (1) the "same rule for
  everyone" rule is not neutral in effect: rules that ban headscarves and turbans
  and yarmulkes but permit a small cross or permit religious dress in the private
  sector, and permit Christian holidays — the baseline is Christian/secular; (2) the
  empirical claim that strict neutrality integrates: evidence that it produces alienation
  and "reactive religiosity" (the "radicalization" argument), or that the Anglo accommodation
  model produces better integration outcomes — but also counterevidence that the Anglo
  model produces parallel societies; (3) the historical point that the strict version
  of laïcité was hardened in response to specific political conflicts (the 1989 Creil
  affair, the 2004 law) and thus looks more like majoritarian anxiety than principled
  neutrality — so the principle may be doing ad hoc work; (4) the "extension" move
  is unstable: if the state extends laïcité to Alsace-Moselle and to school funding,
  it must also decide what counts as a religion and how to handle the "cult" problem
  and the vast Catholic cultural patrimony — the principle either becomes bureaucratic
  sorting (which is what it forbids) or becomes empty; (5) the practical point that
  a state which can''t see religion may also be unable to see religious discrimination
  (blindness cuts both ways) — anti-discrimination law requires noticing religion;
  (6) the fact that the position may be unfalsifiable if every failure of integration
  is blamed on insufficient laïcité or on insufficient integration; (7) what the position
  predicts that its rivals don''t. Also: (8) the "same rule for everyone" can be satisfied
  by a rule that everyone may wear what they like — so the principle underdetermines
  the policy, meaning the specific policy is not entailed by the principle; the real
  work is done by an unstated claim about the state''s need for a religiously neutral
  appearance.


