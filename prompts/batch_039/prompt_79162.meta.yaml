  Hmm, but the domain instruction says "The semantics and pragmatics of slurs." A
  PL-semantics translation is nice: side effects, exceptions, undefined behavior,
  effect systems, presupposition, and the "type error" analogy. Let''s think about
  the translation''s richness:


  - Truth-conditional view: the slur contributes a predicate to the propositional
  content, e.g. "x is a K" entails "x is (derogatorily) bad because K". In PL terms:
  the slur is a function whose value includes a "taint" — like a value with a "poisoned"
  tag that propagates.

  - Expressivist / conventional implicature (Potts): the derogation is a separate,
  not-at-issue layer — like a side effect or a log line emitted alongside the main
  return value; or like a presupposition, which projects out of negation and questions.
  In dynamic semantics, presuppositions are constraints on the context (the input
  context must satisfy them) — like a function precondition or a runtime assertion.
  This maps well: "the use of a slur presupposes or requires a certain normative context"
  — like a precondition that, if violated, throws.

  - Prohibitionist/normative view: the slur''s content is a prohibition ("do not treat
  x as an equal") — like an access-control policy / a capability / a permission bit.

  - The "echoic" or "reclaimed" uses: the word''s effect depends on who uses it and
  how — like a dynamically scoped variable whose meaning depends on the current context,
  or like a "monad" whose effects depend on the environment; reclaiming = re-binding
  the effect handler.

  - Residue: the causal/historical role (slurs derive their force from histories of
  oppression, from being used to subordinate), the "power" dimension, the fact that
  the harm is not just an "effect" but a form of action, the social meaning and the
  listener''s uptake. PL vocabulary has no notion of a speech community''s history
