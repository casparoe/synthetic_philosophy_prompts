  are composed at the moment of waking, played back, so the "experience" of the dream
  is real but the "during the night" is illusory) — and he says this is not a crazy
  empirical hypothesis; there could be a "cassette" neural mechanism. And the argument
  from "dreams are experiences" to the "judgment" account: he holds that dream reports
  are... hmm. Actually Dennett''s paper argues: dreams are experiences, but the theory
