  Sections I''d ask for:

  1. "Why this order" (~350-400 words): the dependency chain, what has to be in place
  before what.

  2. "The example that carries it" (~250): the one case, what it must have and lack,
  and whether the asker''s proposed candidate (e.g., "I dreamt I was falling and jerked
  awake") can carry it or not.

  3. "Where they''ll go wrong" (~400): the misconception map, in the order they''ll
  arise, with the exact point in the sequence to head each off.

  4. "The check" (~150): one question/quick task at the end that shows whether the
  conceptual point landed rather than the empirical facts.

  5. "What I''m not going to explain" (~150): what to leave out and say so.


