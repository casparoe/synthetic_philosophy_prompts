  Dreams: The carrying example is really important here. Malcolm''s argument is heavily
  about language: "I dreamt I was in London" — the past tense is a "dreamt" past tense,
  not a report of a past experience; the criterion for saying someone dreamt something
  is their telling it on waking, and there''s no further fact of the matter about
  whether the dream "really happened" in their head. Students will struggle: "surely
  I know I had a dream." The misconception: that Malcolm denies we dream (he doesn''t;
  he denies dreams are experiences); that Dennett says dreams are illusions/fictions
  invented at waking and hence we never really dream (Dennett''s view is that the
  dream *content* is real as a memory-like item but the temporal "during sleep" claim
  is false — the cassette theory); that neuroscience settles it.


