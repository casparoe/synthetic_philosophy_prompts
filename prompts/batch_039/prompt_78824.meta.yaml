  Draft:


  I am an undergraduate in an upper-level epistemology course, and for our seminar
  on higher-order evidence I have volunteered to design a diagnostic quiz for my classmates.
  I want the quiz to sort people by the positions they actually take on the relationship
  between first-order belief and higher-order evidence about one''s own reliability,
  rather than by the labels they would volunteer. Please write the quiz.


  It should contain ten concrete cases. Each case should describe an agent with a
  first-order belief formed on some basis, followed by a piece of higher-order evidence—for
  example, a calibration test showing the agent is systematically overconfident in
  that domain, a peer''s disagreement, a diagnosis of cognitive fatigue, a drug that
  the agent learns impairs reasoning, or a track record of errors in a certain kind
  of inference. Each question should offer two or three possible answers that differ
  over what the agent may or must believe, what confidence the agent may retain, whether
  the agent is criticizable for retaining the belief, and whether the agent''s overall
  state can be rational. No question should simply ask whether the respondent is a
  conciliationist, a steadfast theorist, or an epistemic akratic.


  Then provide a scoring key that maps patterns of answers onto positions. The key
  should include at least the following, described by their commitments rather than
  only by name: the view that higher-order evidence is just more first-order evidence
  and must be conciliated; the view that the first-order evidence alone fixes what
  one ought to believe, so higher-order evidence bears only on blameworthiness or
  on whether one is justified in holding the belief; the total evidence view, on which
  both orders of evidence count but neither simply replaces the other; the level-splitting
  view that one can rationally believe p while believing that one''s belief in p is
  not rationally supported; and the no-level-splitting view that such a combination
  is necessarily irrational. If any of these positions come apart only under a distinction
  I have not built into the cases—say, between evidence about the reliability of one''s
  faculty and evidence about the reliability of one''s particular inference, or between
  propositional and doxastic justification—flag that explicitly rather than collapsing
  them.


  Also include a short section on the combinations of answers that no actual position
  occupies, and for each say whether the combination is incoherent, unattractive,
  or merely unexplored. Finally, note which positions the quiz cannot separate from
  one another and why, and suggest one or two additional cases that would separate
  them if I wanted to expand the quiz. The quiz is for a seminar of advanced undergraduates,
  so it should be challenging but not depend on knowledge of any particular published
  article; I care about the inferential structure, not about who said what.


