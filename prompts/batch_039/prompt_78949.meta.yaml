  etiological accounts imply that only items with a selection history have functions,
  so novel traits, or the function of a trait in a novel environment... Or the argument
  that etiological account makes function claims about artifacts and about "useless"
  byproducts problematic. Hmm. There''s a well-known argument that the etiological
  theory proves too much: if having a function requires having been selected for,
  then (a) malfunction is impossible for novel traits... Actually a nice "proves too
  much": the etiological account, combined with the fact that selection is a matter
  of degree / and that selection can occur at many levels (gene, organism, group,
  species), implies that almost any effect of any trait has a function, or that everything
  has a function including diseases. There''s a known critique: etiological accounts
  imply that a trait can have a function it never performed (e.g., a mutation that
