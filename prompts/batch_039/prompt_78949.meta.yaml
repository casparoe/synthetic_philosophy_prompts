  Classic "proves too much" for etiological: If function requires selection, then
  (a) no newly arisen trait can have a function until it is fixed (so "the function
  of this mutation is X" is never true at origin, and novel functions have no function
  at the moment we most want to attribute them — in bioengineering and medicine);
  (b) but also every trait that has ever been selected for anything retains a function
  forever, even if now useless (vestigial), and indeed gets a function for effects
  that no longer contribute to fitness; (c) so etiological accounts make functions
  too hard to have in some cases (new traits) and too easy in others (vestigial traits,
  traits whose function is now performed by nothing); so they prove too much in one
  direction and too little in the other. Hmm, that''s a "both too much and too little"
  argument.


  Alternatively: an argument proving too much for causal-role: "if function = contribution
  to a goal-directed capacity of the system, and any system can be described as having
  a goal (swamp, thermostat, cloud), then everything has functions." That''s the classic
  "proves too much" for causal-role accounts: it makes functions too cheap, so the
  function of the heart and the function of the noise the heart makes are on a par
  unless we specify a goal, and specifying the goal requires a full specification
  of the system''s ends — a well-defined "good state" — which is just as value-laden
  as the etiological account''s appeal to selection. Hmm, that connects with domain
  1 too.


