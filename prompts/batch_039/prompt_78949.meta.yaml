  If standing to blame requires that the blamer is not herself guilty of the same
  wrong, then (1) anyone who has ever committed the wrong lacks standing, (2) for
  many wrongs everyone has committed them, (3) so no one has standing to blame for
  those wrongs, (4) but also, on the "same wrong" reading, any slight difference in
  circumstances removes the equivalence, making standing trivially easy. There''s
  a classic tension: the "no standing" condition proves too much because it would
