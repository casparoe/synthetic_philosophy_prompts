  Standing to blame: A classic "proves too much" argument:


  (1) To blame someone for a wrong is to hold them to a standard.

  (2) One has standing to hold someone to a standard only if one is not oneself in
  violation of that same standard (you can''t demand of another what you don''t meet).

  (3) Everyone who blames for a serious wrong has at some point violated a standard
  of comparable seriousness — no one is morally stainless.

  (4) So no one has standing to blame anyone.

  (5) But (4) is absurd: it would silence moral criticism entirely and treat the wrongdoer
  as unaccountable.

  (6) So (2) is false.


  Where''s the subtle flaw? Possibly the equivocation between "the same standard"
  being specific vs. general: (2) only plausible when the violator is a hypocrite
  about the very same standard in the very same respect, and the inference to (4)
  needs the stronger reading. Or the shift from "standing to blame" to "standing to
  hold accountable" — the "moral equality" reading: the point of blame isn''t to demand
  compliance from a position of superiority. There''s a nice known move: the difference
  between the "hypocrisy" condition (a condition on the speech act, making it insincere)
  and the "standing" condition (a condition on the entitlement to the reactive attitude).
  Also the distinction between blaming (an attitude) and expressing blame (an act)
  — (1)-(2) conflate them. That''s a genuine subtle flaw: if standing is a condition
  on the act of expressing blame (making it sincere/apt), the inference to (4) still
  would follow unless we distinguish... hmm.


  Also there''s a nice "proves too much" for the opposite: the argument that only
  the perfect may blame proves too much, but there''s also the argument that hypocrisy
  is irrelevant, which proves too much because it licenses the manipulative hypocrite
  (e.g., the abuser who says "you lied to me"). Good: ask which premise to reject
  and what it costs, noting the asker would rather keep (5) than (4).


