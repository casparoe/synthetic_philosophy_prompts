  Fitch''s proof: Assume (K) ∀p(p → ◇Kp). Take p = (q ∧ ¬Kq) for arbitrary q. By (K),
  (q ∧ ¬Kq) → ◇K(q ∧ ¬Kq). Knowledge distributes: K(q ∧ ¬Kq) → (Kq ∧ K¬Kq). Knowledge
  is factive: K¬Kq → ¬Kq. So K(q ∧ ¬Kq) → (Kq ∧ ¬Kq), a contradiction. So ¬◇K(q ∧
  ¬Kq), hence ¬(q ∧ ¬Kq) by (K), hence ¬q ∨ Kq... wait: ¬(q ∧ ¬Kq) = ¬q ∨ Kq. Since
  q was arbitrary, ∀q(¬q ∨ Kq) = ∀q(q → Kq), i.e., all truths are known. Contradiction
  with (K)''s non-triviality. So (K) is false.


  Key moves: the distributivity principle K(p∧q) → Kp∧Kq (closure under conjunction
  elimination), factivity (Kp → p), and the classical logic. Notably, the paradox
  does NOT need the KK principle or the idea that knowledge requires certainty.


  In-the-weeds issues that trip people up:

  1. The "∀p(p→◇Kp)" vs "◇∀p(p→Kp)" distinction: only the latter is implausible; the
  former is the actual anti-realist principle, and the collapse shows the former entails
  "all truths are actually known" (Kq for every truth q), not merely "possibly all
  truths are known." A common misreading is that the paradox shows "if all truths
  are knowable then all truths are known" is a confusion between the actuality and
  possibility. Actually the derived conclusion is: ∀p(p → Kp) — all truths are in
  fact known. Yes, the proof derives actual omniscience from the knowability principle
  (given classical logic). Good.

  2. Whether the paradox is a "paradox" at all or just a proof that verificationism
  is false — the "Fitch''s paradox is not a paradox" line.

  3. Restriction strategies: restrict the knowability principle to "basic" or "atomic"
  truths (Tennant''s restriction to Cartesian propositions; Dummett''s restriction),
  restrict the distributivity of knowledge over conjunction (e.g., for non-ideal agents,
  or infinite conjunctions), use intuitionistic logic (Williamson''s "Intuitionism
  disproves the principle of knowability" — Analysis 1982; actually that''s Williamson
  1982, "Intuitionism disproves the principle of knowability", Analysis 42: 203-4).
  Hmm, I recall that paper. Also, "Fitch''s paradox of knowability" in SEP by Berit
