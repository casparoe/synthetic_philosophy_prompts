  Hmm, but careful: is it exactly true that parameter independence = no-signaling?
  Parameter independence: P(a|x,y,λ) = P(a|x,λ) for all λ. Averaging over λ, this
  implies no-signaling (marginals independent of the remote setting). Conversely,
  no-signaling is the averaged version; parameter independence is the λ-wise version.
  So no-signaling is weaker. For the PR box, which is a "box" without a λ, parameter
  independence is satisfied at the level of the box. Fine. And outcome independence:
  P(a|x,y,b,λ) = P(a|x,y,λ). The PR box violates it. And the completeness condition:
  parameter independence + outcome independence → factorizability → Bell inequality.
  Correct (this is the standard derivation of "Bell locality" / factorizability).
  Good.


