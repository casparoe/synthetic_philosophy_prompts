  talks sensibly as a person; so the "genuine/counterfeit" line is exactly what''s
  at issue). The analogy presupposes what it needs.

  - Harm structure: counterfeit money harms via inflation and trust erosion in a token
  whose value is conventional; the harm is diffuse and monetary. Counterfeit people:
  alleged harms are manipulation, attention capture, loss of freedom, epistemic pollution
  — different mechanism.

  - Reproduction: Dennett himself notes these can reproduce (unlike counterfeit money),
  which strains the money analogy — he switches to Sorcerer''s Apprentice / Dawkins.
  So the analogy breaks at the point where he needs it most (why this is uniquely
  dangerous).

  - Counterfeit money is a copy of a specific genuine token; an LLM persona needn''t
  copy anyone (a "generic" fake person). Though deepfakes of real people do copy.

  - Intent: counterfeiting is intentional deception with a deceiver; LLM deployment
  may deceive without intent, and the "counterfeiter" is diffuse (developers, deployers,
  users).

  - Money is fungible; trust in money is institutionalized and centralized (central
  banks can act). Trust in testimony/persons is decentralized.

  - Enforcement: outlawing creation of counterfeit people would presumably ban...
  a lot? Or the analogy suggests that mere manufacture is the crime, which for persons
  would criminalize building any convincing chatbot.

