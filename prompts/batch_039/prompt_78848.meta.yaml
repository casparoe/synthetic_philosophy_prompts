  (1) Whether a particular act is wrong depends only on what that act itself brings
  about; it cannot depend on what other people happen to be doing, because no one
  is excused or condemned by the choices of strangers. (2) My eating one more burger,
  taking one more flight, or casting one more vote brings about no harm: the outcome
  — the number of animals raised, the concentration of carbon in the atmosphere, the
  result of the election — is the same whether or not I act. (3) So my act brings
  about no harm. (4) So, by (1), my act is not wrong. (5) Nothing in the reasoning
  turned on the size of my contribution or the size of the group; it applies to every
  other person in the same position, one at a time. (6) So the same reasoning shows
  that none of them acts wrongly either, and the entire practice, though it produces
  enormous and predictable harm, contains no wrongful act. (7) But that is absurd
  — a practice that predictably wrecks the climate, and that no one has any reason
  to stop, is not a practice without a single wrongful act in it. (8) So (1) is false.


  He treats (8) as the punchline and thinks the argument refutes the individualist
