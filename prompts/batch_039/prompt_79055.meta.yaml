  Setting: A seminar on Spinoza''s political philosophy. The asker reconstructs an
  argument:


  (1) For Spinoza, each individual''s natural right extends exactly as far as their
  power (this is his definition of right in the natural state).

  (2) In civil society, individuals transfer their power to the sovereign (or the
  multitude), so the sovereign''s right extends exactly as far as the power it actually
  has.

  (3) So the sovereign has the right to do anything it has the power to do — i.e.,
  no law or command of a sovereign that is actually effective can be unjust.

  (4) A sovereign''s power is limited only by what makes subjects disobey, i.e., by
  what people find intolerable; so a sovereign''s right is limited only by the discontent
  of the governed.

  (5) Therefore, "right" in Spinoza''s political theory is just a description of where
  power lies; no state can violate right, and no subject can be wronged by an effective
  command.

  (6) But Spinoza also holds that democracy is the most natural and best form of state,
  and that the end of the state is freedom rather than domination, and he criticizes
  monarchies and the Hebrew theocracy for failing to be free.


  The question: How can (5) and (6) both stand? The argument seems to prove that Spinoza
  has no normative grounds for preferring democracy — that his "democracy is best"
  is just a prediction about which regime is most stable — which proves too much because
  it turns his defense of free speech (ch. 20) into a claim about what a state can''t
  successfully censor rather than a claim about what it may not do. Where does the
  argument go wrong? Which premise to reject, and what does rejecting it cost?


