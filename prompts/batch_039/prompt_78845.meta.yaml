  ---


  I teach a paradoxes seminar for upper-level undergrads, 14 students, one 75-minute
  block, and next week I want to do the two-envelope problem as a game they play rather
  than a puzzle I explain. What I''m after is the moment where the swap argument feels
  obviously right while you''re actually holding the envelope, and then the moment
  it collapses when you notice that the other person holding the other envelope can
  make exactly the same argument about you. I want them to feel the collapse in their
  hands, not hear about it.


  Here''s what I''ve been kicking around, and you should feel free to throw it out
  if you''ve got something better. Each pair of students gets two sealed envelopes,
  one containing twice what the other contains, and neither of them opens anything
  until the very end. There''s a broker (me) who will swap their envelopes for a small
  fee, and who pitches the swap in the obvious way: whatever''s in your hand, the
  other envelope holds either double or half, you''ve got no reason to think one is
  likelier, so the other envelope is worth 1.25 times yours on average, and the fee
  is nothing next to that. I want the fee to be the thing that does the work -- someone
  who buys the argument will keep trading and keep bleeding, which is a lot more visceral
  than being told the argument is fallacious. I''m also tempted to make a swap happen
  only if both partners independently agree to pay for it, since then they can both
  talk themselves into it at the same time, which should be impossible if the reasoning
  were sound.


  So: design the whole thing. Rules, what goes in the envelopes and what the stakes
  are (play money only, and I''d like the amounts to be set so the double-or-half
  arithmetic stays easy in their heads), the fee, how the broker phrases the pitch
  without tipping the answer, the timeline for 75 minutes including the setup, and
  how I keep track of who''s swapping. I''d also like a second phase where I reveal
  the distribution I actually drew the smaller amount from and have them redo the
  calculation knowing it, because I want them to see that the flat "it''s fifty-fifty
  either way" claim can''t survive a real prior -- and I want them to find the boundary
  cases themselves, the highest and lowest amounts where the fifty-fifty assumption
  visibly breaks down. Then a debrief that walks back through the game and lines up
  what happened with the actual structure of the puzzle: where the expected-value
  reasoning smuggles in an assumption, why the symmetry between the two players settles
  it, and what exactly goes wrong with the claim that the other envelope is equally
  likely to be double or half no matter what you see.


  Also tell me what will predictably go wrong the first time I run it. I''m worried
  about a few things -- pairs that just refuse to trade on principle and never feel
  the pull, students who''ve seen the puzzle before and blurt the answer, and the
  awkward possibility that the fee makes them suspicious of me rather than of the
  argument -- but I''d rather hear what you think the real failure modes are and how
  to handle them mid-session. And be honest about what the game can''t reproduce,
  the part where I have to just tell them something because no arrangement of envelopes
  will show it.


  Write it as continuous prose, no headings, no bullet points, no bold, no tables
  -- just paragraphs I can read straight through like an email. American English please.


