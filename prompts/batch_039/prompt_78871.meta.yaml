  Draft:


  "I write about science and ideas for a general-interest outlet and I''ve got a long
  sit-down interview coming up with a philosopher who''s spent her career defending
  disjunctivism about perception — the view that a genuine perception and a hallucination
  aren''t two versions of one underlying mental state, they''re states of different
  kinds, with nothing interesting in common at the level of experience. Shes written
  a book on it and she''s very smooth, which is a problem, because my last two interviewers
  with her type all came out sounding the same: ''so you deny the common factor'',
  ''yes I do'', ''ok great''. I want to come at her from the illusion side rather
  than the hallucination side, since I gather that''s where the view gets harder to
  hold.


  Give me nine or ten questions, with a follow up after each one keyed to the answer
  she''s most likely to give (she''ll probably reach for the line that illusions are
  just cases of misperceiving a real object — the stick in water is still a stick
  — and I want the follow-up to not let her leave it there). I want questions that
  press on:


  - the classic argument from illusion (the bent stick, the Müller-Lyer lines, the
  white wall that looks yellow under a streetlight) and why the disjunctivist thinks
  those cases are easier than hallucinations — or whether she''s quietly conceding
  something by saying so;

  - the case I keep coming back to: a person in a dark corridor sees a figure in the
  shadows and it turns out to be a coat on a hook. Was that an illusion or a hallucination?
  Where does she draw the line, and does the line do any work or is it just a labelling
  decision?

  - the Müller-Lyer style case where you know the lines are the same length and they
  still look different — what''s the disjunctivist supposed to say the experience
  is doing if the perceiver is genuinely seeing the lines?

  - the rubber hand thing, where you stroke a fake hand in someone''s view while stroking
  their real hand out of sight and after a minute they''ll say the rubber hand feels
  like theirs. Is she happy saying the subject is literally perceiving a rubber hand
  as her own hand, and if not what''s gone wrong;

  - the epistemic asymmetry — she presumably wants to say the perceiver can know things
  and the hallucinator can''t, but the hallucinator is still being reasonable. How
  does she avoid the old evil demon problem, where the demon''s victim seems as justified
  as anyone;

  - the neuroscience version: if someone eventually finds a common brain signature
  for seeing and hallucinating, does that kill the view, and if it doesn''t, what
  would it take for her to give it up;

  - and one about whether she''s a disjunctivist about anything else — memory, testimony,
  imagining — or whether perception is a special case.


  Also give me one closing question that gets at whether the position is a discovery
