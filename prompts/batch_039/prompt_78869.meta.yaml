  Let me think about what the five readings would plausibly be (to make sure the prompt
  is answerable):


  R1. Trivial/existential: for every necessary truth there exists some possible knower
  who could know it without experience (e.g., God, or a being with the right concepts).
  Under this reading the dictum is nearly vacuous and doesn''t block necessary a posteriori
  knowledge for us.


  R2. Epistemic universal: every necessary truth is knowable a priori by us, in the
  actual world, given the concepts we actually have — this would entail that "water
  is H2O" if necessary is a priori knowable; Kripke''s reply: if a statement is necessary
  and known a posteriori, then there''s an a priori route (the conditional "if water
  is H2O then it is necessary" is a priori; but the antecedent is empirical). Careful:
  Kripke''s actual view — he doesn''t hold that "water is H2O" is knowable a priori;
  he holds that knowledge of the necessary truth is a posteriori, though the *conditional*
  that if it''s true it''s necessary is a priori. So a reading: "if p is necessary
  and p is true, then p can be known a priori by someone with sufficient reasoning"
  — Kripke''s defense is that the necessary a posteriori is possible because reference
  is fixed by contingent properties; the necessity itself, once known, is known via
  the empirical premise. Good.


  R3. Genetic/psychological: all knowledge of necessities arises from reason rather
  than experience (no empirical discovery could ever be the ground of a claim to necessity).
  This is the substantive rationalist reading; falsified or at least threatened if
  Kripke is right — actually it''s the reading under which the dictum does the work
  of dismissing Kripke.


  R4. Semantic/conventionalist: necessity is truth in virtue of meaning/convention;
  so any necessity is a fact about our language, not the world. Under this, water''s
  being H2O would be necessary only if it follows from meaning — and if "water" means
  "the stuff with such-and-such observable properties", then water-is-H2O would be
  a posteriori and contingent (the descriptivist horn), which yields a dilemma: either
  it''s not necessary (contra Kripke) or "water" isn''t a descriptive abbreviation.
  So this reading supports the dismissal, at the price of descriptivism about natural
  kind terms (i.e., it presupposes rigid designation is false).


  R5. Supervenience/modal-epistemic principle: no two possible worlds differ in what
  is necessary — trivially true, no epistemic content.


  R6. Criterion reading: a priority provides a *test* for necessity (a heuristic,
  not an analysis) — as a methodological criterion it fails for natural kind identities;
  as an analysis it''s what''s at issue.


