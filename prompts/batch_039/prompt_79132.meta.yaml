  But careful: I shouldn''t misstate plot details. Let me recall Measure for Measure:
  Duke Vincentio leaves Vienna in the hands of Angelo, who enforces the law against
  fornication; Claudio is condemned to death for impregnating Juliet (his betrothed).
  Lucio asks Isabella (Claudio''s sister, a novice nun) to plead with Angelo. Angelo
