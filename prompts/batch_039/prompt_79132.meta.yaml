  Now, the injection of new/niche ideas. The instruction: "you''ll often have to inject
  some sort of new / niche ideas into the prompt." So I should introduce a fresh theoretical
  framing within the prompt itself — e.g., a specific distinction or a hypothetical
  — so the model can''t just regurgitate. The prompt is written by a user asking for
  the reading; the user can supply a novel distinction or a made-up-but-plausible
  framing, or a niche idea from the literature.


  Let me pick a domain and think about what niche framing to inject.


  Option A: Consent validity + Measure for Measure + inject: the distinction between
  "consent under coercion" and "consent under an offer you can''t refuse" — and a
