  I like Option A quite a bit because "what makes consent valid?" is a domain where
  the injected framework can be really crisp and fresh: e.g., distinguish (1) consent
  as a mental state, (2) consent as an act/performative, (3) consent as a normative
  status (a standing relation, e.g., marital or contractual standing). The bed trick
  is a case where the play substitutes (3) for (1): Angelo''s mental state is deceived,
  but his betrothal to Mariana gives him a standing that makes the act "his" anyway.
  And Isabella''s refusal: she refuses to give consent as an act, but the Duke''s
  scheme means her body is used (well, Mariana''s body, not Isabella''s — actually
  Isabella''s body is not used; her role is to be complicit in the deception and to
  authorize it). Hmm, so the bed trick doesn''t use Isabella''s body. The consent
  issues: (a) Angelo''s consent to sex is vitiated by deception (mistaken identity)
  — the play treats this as no wrong because he''s betrothed to Mariana, so it''s
  arguably a valid marriage consummation. (b) Mariana consents — she wants Angelo.
  (c) Isabella consents to the scheme but is maneuvered by the friar''s authority
  (a clergy''s counsel — consent by authority, cf. competence/undue influence). (d)
  Claudio''s initial sentence: he had Juliet''s consent and a betrothal — so the law
