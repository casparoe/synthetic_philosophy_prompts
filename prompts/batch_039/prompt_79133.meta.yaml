  Structure of the prompt:

  1. Framing: the general question (do video-game characters matter morally?) splits
  into several questions that are usually conflated: intra-fictional wrongs, real-world
  wrongs of the player, the artifact''s moral address, and the metaphysics of fictional
  objects.

  2. The work: Undertale — describe the relevant features (mercy/kill mechanics, the
  game''s memory across resets, the meta-address to the player, the endings, the stat
  renaming, Flowey''s plea).

  3. The ask: read it through the lens; which scenes/mechanics; where the game''s
  implicit theory of moral status holds up; where it equivocates (e.g., sliding between
  "the monsters are real to you" and "they''re just data," or trading on the player''s
  quasi-guilt); does the game know the difference between (a) making you feel responsible
  and (b) your being responsible; what would the philosophical literature say the
  game gets right that the papers don''t (the papers'' "no one is harmed" replies
  look thin next to the game''s demonstration that a fictional world can hold you
  to account); and where the honest critic must say the game is confused or manipulative.

  4. Constraints: no verbatim quotation required; assume the reader knows the game;
  don''t turn it into a summary.

  5. Epistemic request: separate settled from contested; don''t present a contested
  view (e.g., whether fictional entities can be wronged, whether virtual acts are
  morally inert, whether the game''s meta-address is genuine moral address or a rhetorical
  trick) as consensus; flag where the reading is contestable.


