  So: Brecht''s Life of Galileo + Galileo''s hermeneutics of scripture (accommodationism).
  That works nicely and is genuinely in the weeds: does the play engage the hermeneutic
  question at all? The Little Monk scene is the closest, and the play''s answer (the
  Church''s scripture is a tool of social control) is a Marxist translation of a theological
  problem — the play''s Galileo is an Enlightenment rationalist who treats scripture
  as ideology, whereas the historical Galileo treated it as an authoritative text
  that must be reconciled by reinterpretation. So the play either misses or deliberately
  replaces the hermeneutic problem with a political one. And the "what the work adds"
  question: the play''s insight that the accommodationist move has a social cost —
  if you say scripture was accommodated to the vulgar, you''re saying the vulgar can''t
  handle the truth, which is itself a political claim; Galileo''s hermeneutics presupposes
  the very paternalism the play diagnoses. Oh, that''s a great reading! The play can
  be read as exposing the political presupposition of the accommodationist strategy:
  accommodation says scripture is accommodated to the ignorant, and Brecht''s Little
  Monk says the ignorant need the accommodation. And Galileo''s rebuttal in the play
  (the beautiful world vs. the "clammy" faith) is a refusal of that paternalism. So
  the play dramatizes the class politics latent in the hermeneutic doctrine. And where
  it goes wrong: Brecht makes it look like you can just be a rationalist and drop
  the whole theology, whereas Galileo''s actual position was internal to Christian
  exegesis — Galileo wanted to be read as a better reader of scripture, not as someone
  who''d outgrown it. And the honest critic has to say the play''s anti-clericalism
  flattens the fact that Galileo''s theology was of a piece with his physics (the
  Book of Nature / Book of Scripture trope) and that a "two books" position cuts both
  ways.


