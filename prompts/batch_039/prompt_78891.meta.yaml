  I have been trying to state, precisely, the duty to remember — the thought that
  a community that forgets certain of its past wrongs has failed in something more
  than bookkeeping — and I have constructed an argument that seems to me to dissolve
  the duty altogether. Each step looks defensible; the conclusion I cannot accept.
  I would like to know which step to give up, and what giving it up costs.


  Consider first the plain case. A country has a single national day of mourning and
  two atrocities in its past: one it suffered, one it committed. Both were grave;
  in both, the victims went unacknowledged. Whatever the country does with that day,
  it will commemorate one and leave the other in silence.


  Now the argument:


