  later pay them; you know you will never see them again and that no sanction can
  reach you; if you are the sort of person who would pay, you get the ride, so it
  seems you should pay, yet once in the car and at your destination the balance of
  reasons for paying seems to vanish. The group divides into three camps and they
  have not moved in months. The first says the case shows that decision theory must
  evaluate dispositions or policies rather than acts, so paying is rational as part
  of the policy that gets you the ride. The second says that is a confusion: the disposition
  may be causally advantageous, but the act of paying, once chosen, is still irrational,
  and the theory should not pretend otherwise; what we have is a case where it is
  rational to be irrational. The third says both sides are answering the wrong question,
  because the hitchhiker''s promise is not a one-off act but a move in a social practice
  of promising, and the real question is what the practice requires of someone who
  has already accepted its benefits. Each camp has a stock of replies to the others,
  and every reply is anticipated; the disagreement now feels less like an unfinished
