  Key facts about Lewis''s triviality results (from memory, to be used carefully):


  - David Lewis, "Probabilities of Conditionals and Conditional Probabilities" (1976,
  Philosophical Review). Also a 1986 follow-up "Probabilities of Conditionals and
  Conditional Probabilities II".

  - Adams''s thesis: the probability (or assertibility) of an indicative conditional
  "If A then C" equals the conditional probability P(C|A).

  - Lewis''s triviality result: if a language is rich enough to contain conditionals
  and is closed under conditionalization, then P(A→C) = P(C|A) for all A, C can hold
  only in trivial probability spaces (e.g., where P(C|A) = P(C) for all A, C with
  P(A) > 0 — i.e., A and C probabilistically independent). So no "reasonable" probability
  function can satisfy the equation generally.

  - Lewis''s proof: takes P(A→C) = P(C|A); considers the conditional (A→C) under the
  supposition of C (and of ¬C) — i.e., P((A→C)|C) = P(C|A∧C) = 1 (since A∧C entails
  C, so P(C|A∧C)=1). Similarly P((A→C)|¬C) = P(C|A∧¬C) = 0. Then P(A→C) = P(A→C|C)P(C)
  + P(A→C|¬C)P(¬C) = 1·P(C) + 0 = P(C). So P(C|A) = P(C), i.e., A and C independent.
  That''s the "first" triviality result / the simplest one.

