  conditions (truth-functional), which is a separate claim from the triviality result;
  the triviality result doesn''t entail truth-functionality. A popularizer might say
  "since the equation fails, Lewis concluded conditionals must be material conditionals"
  — that''s a non-sequitur / conflation of two distinct Lewis positions.

  5. Confuse "probability of the conditional" with "conditional probability" — the
  everyday conflation.

  6. Attribute to Lewis the claim that the conditional probability is not defined
  when P(A)=0 (that''s the standard "ratio formula" issue), or say triviality arises
  because of division by zero.


