  of its consequent — so on any probability function that satisfies the equation,
  A and C have to come out independent, for arbitrary A and C. Since that''s absurd,
  the equation can''t be maintained in general, and the ''triviality results'' (Lewis''s,
  and later ones) show that no amount of tinkering helps: even if you say the conditional
  is neither true nor false when the antecedent is false, you still get the collapse.
  The engine of the proof is just that conditional probability goes undefined when
  the antecedent has probability zero, which is why the thesis ends up being so fragile.


