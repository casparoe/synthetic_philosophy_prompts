  The subtlety: it doesn''t show that degrees of belief in conditionals don''t track
  conditional probability in the way Adams described; Adams''s thesis is best read
  as a constraint on assertibility/degrees of belief, and the triviality result targets
  the truth-conditional reading. Also it shows the equation fails for a language rich
  enough — but for simple conditionals you can have it (van Fraassen).

  2. Conflate "triviality" meaning the probability function is trivial (all probabilities
  0/1) vs. trivial meaning the equation collapses to independence. Actually both senses
  appear; the standard conclusion is that the equation forces P(C|A)=P(C), i.e., "the
  conditional is probabilistically independent," which for all A, C is itself near-trivial.
  Some formulations say triviality = P(C|A) = P(C). Others (with a stronger closure
  requirement) yield P(A)=1 for all A or all probabilities 0/1. So a subtle error:
  "Lewis showed the equation forces every conditional to be certain or impossible"
  — that''s not exactly the standard conclusion.

  3. Conflate indicative with subjunctive/counterfactual: Lewis''s triviality is about
  indicatives; the counterfactual (Stalnaker/Lewis "would" counterfactuals) has different
  semantics. A summary could say "this undermines the Stalnaker-Lewis semantics for
  counterfactuals," which is a misstep.

