  identity-constituting, not substitutable. The gains-from-trade model assumes comparability
  and substitutability.

  - "Pareto improvement in value space" — a technical term used loosely. Pareto improvement
  is about individual welfare, not value satisfaction; also compromise may be Pareto-improving
  in preference satisfaction but not in moral correctness. And "value space" is a
  metaphor.

