  moral disagreement, incommensurability, and the possibility that compromise is itself
  morally wrong (e.g., compromising with injustice). Also transaction costs aren''t
  just pride; they can be moral costs.

  - "exchange rate is unclear" — assumes a common currency of value. Incommensurability
  means no exchange rate.

