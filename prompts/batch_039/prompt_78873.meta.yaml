  Draft:


  I am putting together a small anthology of fiction that illustrates hard problems
  in jurisprudence, and I would like you to contribute a story to it.


  The problem I want the story to body forth is the self-reference of legal rules:
  the fact that a legal order must contain, somewhere, the rule that says how its
  own rules are changed, and that this rule can be changed by the very procedure it
  defines. I do not want an essay on this, or a story in which a character explains
  it. I want a story in which the machinery of a fictional constitution produces a
  live dilemma that ordinary people have to act inside of.


  Setting. A small republic — invent its name, its geography, its recent history —
  whose constitution contains the following provisions and, for the purposes of the
  story, nothing else that bears on amendment:


  - Any provision of this constitution may be amended by the procedure set out in
  Article II, and no provision may be entrenched against amendment. Any clause that
  purports to make a provision unamendable is void from the moment it would otherwise
  take effect. (Article I)

  - An amendment is valid if and only if it is adopted by a two-thirds majority of
  the Assembly and adopted in conformity with the procedure in force at the moment
  of its adoption. This Article may itself be amended, and the amendment of this Article
  is governed by this Article. (Article II)

  - An amendment takes effect upon its enrolment in the Register of the Constitution,
  and no amendment has retroactive effect. (Article III)


  Add one piece of history: some sixty years ago the Assembly adopted, by the procedure
  it then understood itself to be using, a short Act of Clarification. The Act is
  enrolled in the Register and has been treated as part of the constitution ever since.
  Its operative sentence resolves an ambiguity in Article II: it provides that the
  procedure "in force at the moment of its adoption" means the procedure in force
  immediately before the vote is taken, not the procedure that the amendment itself
  would bring into force. Nothing about the Act''s own adoption was irregular on its
  face; the question whether it was validly adopted depends on how Article II is read,
  and how Article II is to be read is what the Act settles.


  Then the present: an Assembly elected on a mandate, or a faction within one, has
  just used the Act of Clarification to do something that could only be done if the
  Act is good — amend the constitution by a bare majority, or entrench something against
  future amendment, or both. The story is the twenty-four hours or so in which the
  question of the amendment''s validity stops being academic and becomes something
  a particular person must decide or suffer.


  What I want from the story:


  - The pivot should be an act of enrolment. Give me a Registrar (or clerk, or archivist)
  whose duty is to enter the amendment in the Register, with its date and hour, and
  who understands that the wording of the entry — whether the entry records the amendment
  as validly adopted, or records it as enrolled under protest, or leaves the question
  open — will fix, for every court and office downstream, which procedure was in force
  at the moment of adoption. Let the story''s pressure concentrate on the pen.

  - Give the constitutional question a human stake that is not itself constitutional:
  a title to land, a citizenship, a pension, a marriage, a prison sentence, a seat,
  a debt. At least one character should be someone who will be ruined by one answer
  and saved by the other, and who cannot follow more than the first step of the reasoning.

  - Voice at least two incompatible readings of Article II, each in the mouth of someone
  who has a real case for it, and make it plain that neither is stupid: one that the
  Act of Clarification is valid because a rule for changing rules can only be applied
  to the act that changes it under the rule that the act itself asserts, so the Act
  bootstraps itself into force and everything since is valid; and one that this cannot
  be so, because it would let any majority at any time validate its own act by declaring
  which rule governed it, and that the alternative — that the Act and everything adopted
  under it for sixty years is void — is a conclusion someone has to be willing to
  accept.

  - Let the pragmatic consideration have its say, and not be a villain: the argument
  that a constitution whose whole recent history is void is not a constitution but
  a fact, and that a legal order is held together by what people will treat as law
  as much as by what the text says. Someone should make this argument and someone
  should refuse it, and neither should be obviously right.

  - End on a concrete act, not a summary of positions: a signature, a date, an hour,
  an entry, a refusal, a hand on a ledger. It may be ambiguous what the act settles,
