  two-sided summary of the sentience literature, and a student with no grasp of the
  underlying methodological and ethical difficulties can pass on that alone. I also
  want to avoid a question whose answer depends on knowing particular reviews, statutes
  or commission reports, partly because the candidates'' reading is uneven and partly
  because I would rather test whether they can reason with a policy instrument than
  whether they can recall who published what. So for this question I have invented
  a fictional certification body and two rival instruments for it, and I would like
  the question, a model answer and a marking scheme to be built around them.


  The scenario, which I will print in full on the paper, is as follows. The Aquatic
  Welfare Assurance Board (AWAB) is a new international certification body covering
  salmonid farms and decapod (shrimp, prawn, crayfish) farms. AWAB''s majority proposal
  is the Sentience-Weighted Harm Index (SWHI). Under SWHI, an expert panel assigns
  each species a Sentience Confidence score c between 0 and 1, and assigns each recurring
  welfare-relevant event e — a day at a given stocking density, a handling or transport
  episode, a specified slaughter method — an Aversiveness score a between 0 and 10.
  A farm''s index is the sum over all events and species of c × a × n, where n is
  the number of individuals undergoing that event in a year; the farm''s grade is
  set by the size of this total, and the Board''s stated rationale is that farms can
  lower their index either by treating animals better or by keeping fewer of them.
  The minority on the Board proposes instead a Threshold Trigger Schedule (TTS): the
  panel asks only whether the evidence of sentience for a species is adequate, and
  if it is, the species is scheduled and a short list of practices becomes prohibited
  outright — slaughter without prior stunning to immediate insensibility, stocking
  densities above a stated ceiling, and live sale for domestic boiling — with no weighting,
  no summing and no offsets between species or between animals. To fix ideas the paper
  gives one worked case. Brackenmoor Farm runs two lines: whiteleg shrimp, 40 million
  individuals a year, harvested by immersion in ice slurry, an event the panel scores
  a = 3, with c = 0.5; and rainbow trout, 200,000 individuals a year, killed by carbon-dioxide
  narcosis followed by gutting, scored a = 6, with c = 0.9. On these figures the shrimp
  line contributes 60,000,000 to the index and the trout line 1,080,000, so Brackenmoor''s
  grade is determined almost entirely by the shrimp, and replacing ice-slurry harvest
  with a method scored a = 1 would cut the index by some 40,000,000 — more than closing
