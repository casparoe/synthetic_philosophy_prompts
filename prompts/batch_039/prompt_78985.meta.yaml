  \ a decent mild conflation.\n  4. Or the summary could say Rawls's point is that\
  \ utilitarianism would permit sacrificing individuals, and thus it's \"unjust,\"\
  \ where Rawls's actual point is about the \"regulative principle for a thing must\
  \ depend on the nature of the thing\" and about the lack of a \"single person\"\
