  \ persons.\" Hmm — that exact sentence appears in A Theory of Justice, §5, p. 27\
  \ in revised edition. I should avoid quoting unless I fetch. I'll paraphrase without\
  \ quotes.\n- Nozick's Anarchy, State, and Utopia: \"there are only individual people,\
  \ different individual people, with their own individual lives\" — using one for\
  \ another's benefit, \"a kind of utilitarianism for non-utilitarians\" etc. Also\
  \ the \"utility monster\" — actually the utility monster is Nozick's thought experiment,\
  \ p. 41. And Rawls's objection is related to the idea of a single person's rational\
  \ choice with a unity of life; Nagel's \"the view from nowhere\"? Actually the relevant\
  \ Nagel is \"Equality\" in Mortal Questions — \"the separateness of persons\" as\
  \ a problem for aggregation; Nagel notes there's no analogue of the \"intrapersonal\"\
  \ trade-offs across persons.\n- Key subtle misrepresentations to embed:\n  1. Conflating\
  \ the separateness of persons objection (a complaint about aggregation/trade-offs\
  \ across persons) with the demandingness objection (a complaint about how much utilitarianism\
  \ requires of each individual). These are distinct objections — the separateness\
  \ objection is about how it aggregates, not how much it demands. That's a great\
  \ \"conflation of two claims the view keeps apart.\"\n  2. Treating the objection\
  \ as a refutation vs. a challenge about what grounds the aggregation — e.g., the\
  \ standard reply: the utilitarian can say aggregation is grounded in the equal consideration\
  \ of each person's interests, or that it's a moral-arbitrariness worry (why should\
  \ the mere distinctness of persons block trade-offs, when we don't think it blocks\
  \ them across times in a life?). So the summary might say \"the objection proves\
  \ utilitarianism can't be a rational choice for anybody\" or \"the objection shows\
  \ utilitarianism is committed to sacrificing the few whenever it benefits the many\"\
  \ — the latter being a misrepresentation: it doesn't show any such thing about particular\
  \ cases (aggregation only requires it when the numbers actually favor it; and the\
  \ \"obligation to sacrifice the few\" is not entailed by maximizing).\n  3. Another\
  \ subtle: claiming the objection is Rawls's alone / that it originates with Nozick,\
  \ or that the objection is essentially the \"utility monster\" argument — the utility\
  \ monster is a separate argument about aggregation, not about separateness exactly\
  \ (actually the utility monster is meant to press the aggregation issue). Hmm, could\
