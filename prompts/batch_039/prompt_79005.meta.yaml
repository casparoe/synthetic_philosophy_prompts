  Positions on Simpson''s paradox (I should be careful about attributions — better
  to describe positions by content rather than by name; I can name Pearl''s causal
  hierarchy generally, but let me avoid specific claims about who said what):


  1. Nothing to see: the paradox is an artifact of an underspecified question; once
  you say what population and what intervention you care about, there''s a unique
  correct answer, so there''s no genuine conflict. ("Underdetermination by the question"
  — the paradox is a failure of specification, not of reasoning.)

  2. Aggregation invariantism / "the whole is what matters": when the aggregate and
  the parts conflict, the aggregate is the truth about the population as a whole,
  and the parts are showing a selection/stratification artifact.

  3. Part-relative: the parts are the truth; the aggregate is a mixture effect (heterogeneity)
  and reporting the aggregate is a form of confounding (collider/stratification bias,
  e.g., conditioning on a common effect).

  4. Causal-structural: the correct table is determined by the causal DAG and the
  intervention of interest (back-door criterion); both tables can be right for different
  interventions. So the paradox is a symptom of the fact that associational data can''t
  fix the answer without causal assumptions. Also "the reversals track confounding
  vs. effect modification."

  5. Decision-theoretic (Savage): the paradox marks the fact that which table is relevant
  depends on the decision problem — "sure-thing" reasoning requires the partition
  that''s invariant across the states; the aggregate is right for a choice that applies
  uniformly, the parts right for a choice made within each stratum.

  6. Pragmatist/measure-theoretic: there is no fact of the matter; the answer depends
  on which measure of "effect" you choose (risk difference vs risk ratio vs odds ratio),
  and reversals are an artifact of non-collapsibility of certain measures (odds ratio
  is non-collapsible; risk difference is collapsible). So a genuine "paradox" arises
  only for non-collapsible measures — for collapsible measures like the risk difference,
  if there''s no confounding, the aggregate can''t reverse. That''s a real technical
  distinction worth including: "the paradox is an artifact of non-collapsibility."
