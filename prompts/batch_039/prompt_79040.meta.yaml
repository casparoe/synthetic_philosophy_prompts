  "I''m in the second year of a philosophy of psychiatry seminar and I''ve been stuck
  for weeks on a case that I think is a better test of Ian Hacking''s account of looping
  effects than the examples everyone reaches for. The case is the strange reversal
  in official psychiatric classification of grief. In the DSM-5 the field deleted
  the old bereavement exclusion, which had kept clinicians from diagnosing major depression
  in the first couple of months after a death; the reasoning was that ordinary grief
  and depression are different things and shouldn''t be collapsed. Nine years later
  the DSM-5-TR added prolonged grief disorder as an official diagnosis, with a duration
  threshold of about a year in adults and six months in children, so that grief which
  persists beyond a culturally expected period becomes a disorder in its own right;
  the ICD-11 carries a comparable diagnosis with a shorter threshold. The category
  had already been circulating for years as a proposed condition for further study
  before it was promoted, which means there were instruments and research programs
  built around it before it was officially recognized. So the field first insisted
  that grief is not depression and then created a new category for grief that is supposedly
  not ordinary grief, and it did so using a label that had been sitting in the manual''s
  back pages the whole time. I''d like you to analyze this episode through Hacking''s
  framework and then turn around and use the episode to test the framework: what it
  is that makes a classification interactive rather than indifferent, what exactly
  is supposed to be looping here, who or what is being made up, and whether the case
  is a confirmation of the account, an anomaly for it, or a case it never anticipated.


