  first insisted that ordinary grief is not depression and then created a new category
  for grief that is supposedly not ordinary. I know the standard Hacking story — that
  psychiatric classifications are ''interactive kinds,'' that classifying people changes
  them, that there''s a looping effect where the classified respond to the label and
  the label is then revised in light of the response, and that some diagnoses are
  transient, flourishing in a particular cultural niche and then vanishing. I want
  you to run this episode through that machinery and then run the machinery back through
  the episode."


