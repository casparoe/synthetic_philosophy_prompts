  My oldest friend and I spent most of a long evening arguing about a case I had always
  treated as obvious, and I came away unable to say which of us was right — which
  is a problem, because I have to make this kind of call at work, on a schedule, without
  the luxury of being unsure.


  The case is this. A woman blind from birth, who has never had any visual experience
  at all, is given sight as an adult. In front of her, on a table, are a cube and
  a sphere; she has handled both for years and can tell them apart instantly by hand.
  She is allowed to look but not to touch. Can she say which is which? My friend says
  no, and thinks the answer is obvious: she has never had to learn what vision means,
  the light falling on her retinas is at first a smear of colour with no objects in
  it, and she must go through a long apprenticeship in which touch teaches sight what
  it is looking at. I said yes, and thought it equally obvious: cubeness is one property,
  met twice; she has known cubes for years, and there is nothing left for her to learn.
  We could not settle it, and I gather it is an old question with a name attached
  — Molyneux''s problem — though I am not interested in the history. I am interested
  in the disagreement''s practical shadow.


