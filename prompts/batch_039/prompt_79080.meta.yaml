  Gödel''s axioms:

  - Definition: x is God-like iff x has every positive property as an essential property.

  - A1: A property is positive iff its negation is not positive (i.e., positivity
  is "self-dual": exactly one of P, ~P is positive).

  - A2: Any property entailed by a positive property is positive.

  - A3: God-likeness is positive.

  - A4: If a property is positive, it is necessarily positive (i.e., positivity is
  essential to properties).

  - Theorem 1: If a property is positive, then it''s possibly exemplified.

  - Theorem 2: Something is God-like.

  - Theorem 3: Necessarily, something is God-like (using S5 and the essentiality).

  - A5: Necessary existence is positive.

  - Theorem 4: Necessarily, there is a unique God-like being.


