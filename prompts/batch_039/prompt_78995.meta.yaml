  dispositions, patterns of emotional reaction, personal loyalties, projects; deliberation
  can involve "the conversion of one motive into another" e.g., the person who realizes
  his resentment is grounded in jealousy. So the common summary "Humean instrumentalism"
  is a misrepresentation.

