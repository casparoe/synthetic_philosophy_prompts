  scale term is robust across nearly every empirical scenario and is enormous, while
  almost all of the scientific disagreement is really disagreement about the credence
  term. So I argue that the productive move is to stop treating ''sentience'' as a
  verdict and instead specify the neurobiological and behavioural markers that should
  raise or lower the credence — centralised integration, motivational trade-offs,
  opioid-mediated modulation of avoidance, self-administration of analgesics, and
