  the credence is low but not negligible, and that a low credence multiplied by a
  scale that is many orders of magnitude larger than the vertebrate one still dominates
  the expected moral weight of, say, farmed mammals. I also concede up front that
  I am not claiming we can measure insect suffering, only that our uncertainty does
  not excuse indifference."


