  a preparation sheet for the discussion period, not a summary of my talk.


  The position I will defend is a qualified version of the scale argument for taking
  insect welfare seriously. Its core move is to set aside the binary question of whether
  insects are sentient and to reframe the issue as a question about the expected moral
  weight per insect, which I analyse as the product of two independent terms: a credence
  that the insect has morally relevant experience, and a scale term fixed by how many
  insects there are and how they live and die (pesticides, parasitism, starvation,
  and the like). My central claim is that the scale term is robust across essentially
  every plausible empirical scenario and is enormous, while nearly all of the genuine
  scientific disagreement is disagreement about the credence term; consequently the
  productive move is to stop treating sentience as a verdict to be delivered and instead
  to specify the neurobiological and behavioural markers that ought to raise or lower
