  around: the thesis is almost always stated as one claim and defended with one example,
  when in fact it decomposes into four claims that come apart as soon as one leaves
  the textbook case. Call them zygote essentialism (the organism could not have developed
  from a different fertilised egg), gamete-pair essentialism (it could not have arisen
  from a different sperm and egg), genome essentialism (it could not have had a different
  nuclear genome), and lineage essentialism (it could not have had different biological
  parents). Three cases the literature has never properly digested pull them apart.
  Monozygotic twinning, where one zygote yields two distinct organisms, shows that
  gamete-pair essentialism does not individuate persons at all: two people can share
  a single origin. Chimerism, where a single organism can carry cell lines descended
  from two separately fertilised eggs, shows that the presupposition that an organism
  has exactly one origin is not even an empirical universal, and forces a decision
  about whether the fusion or one of the contributing zygotes is the origin. Mitochondrial
  replacement, in which the nuclear material of one couple is placed into a donor
  egg whose mitochondria survive in the resulting child, makes the four claims come
