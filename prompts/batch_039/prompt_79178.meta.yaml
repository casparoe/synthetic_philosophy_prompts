  the claim that the predicate has no sharp boundary and the claim that any stipulated
  boundary is wrong. Precisification: you can adopt a sharp rule (like a numeric cap)
  and that rule is a precisification, not a discovery; multiple precisifications are
  admissible, so the rule is justified by its function (predictability, administrability,
  defensibility) rather than by correspondence.

