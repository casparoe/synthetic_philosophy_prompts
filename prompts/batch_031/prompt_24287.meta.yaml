  I have a good enough grasp of the details of Parfit''s hitchhiker. Let me recall
  the actual content of the case in "Reasons and Persons" (Part I, on rationality):


  Parfit''s hitchhiker: a hitchhiker who promises a driver that he will pay for the
  ride if he gets the ride. When he arrives at his destination, he has no reason to
  pay (paying would be against his self-interest, and he would be better off not paying).
  But the driver only gives him a ride if the hitchhiker promises to pay. So the hitchhiker
  has a reason to make the promise (in order to get the ride), but at the moment of
  decision (at the destination), he has no reason to keep the promise. Parfit''s point:
  the promise is irrational to keep, but the person who is disposed to keep it (who
  keeps the promise) is in a better position than the one who doesn''t. In other words,
  it is rational to be disposed to do what is irrational to do. This is the "rational
  irrationality" idea — that it can be rational to have a disposition to act against
  one''s own interests, and it is rational to act irrationally (in the sense of acting
  against one''s own interests).


  Parfit argues that this shows that the view that rationality requires acting in
  accordance with what is best for oneself (or one''s own interests) is incoherent.
  The hitchhiker has a reason to make the promise. But at the moment of decision (when
  he is at the destination), he has no reason to keep the promise (because paying
  would be against his self-interest). So the reason for making the promise (i.e.,
  the reason for acquiring the disposition to keep it) is a reason that does not exist
  at the moment when the action is performed. This shows that reasons can be "across
  time" / that it can be rational to act in a way that is not in one''s own interests
  at the moment of action.


