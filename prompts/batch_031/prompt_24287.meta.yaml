  What would be a genuinely decent objection? Let me think about the actual philosophical
  objections to the hitchhiker case:


  1. The "two-person" objection / the objection that the case conflates the agent
  at the time of promising with the agent at the time of keeping. Some people argue
  that the hitchhiker at the start (who makes the promise) and the hitchhiker at the
  destination (who decides whether to pay) are, in a sense, different "agents" or
  that the reasons don''t transfer. But this is a bit weak.


  2. The "disposition vs. act" objection: Sam might say that Parfit is equivocating
  between "it is rational to be disposed to do X" and "it is rational to do X." The
  hitchhiker has a reason to be disposed to keep the promise (because that disposition
  gets him the ride), but that doesn''t mean that keeping the promise is rational
  at the moment of keeping it. So the case doesn''t show that it can be rational to
  act against one''s own interests; it only shows that it can be rational to have
  a disposition to act against one''s own interests. And having a disposition is not
  the same as acting. So the "rational irrationality" label is misleading.


