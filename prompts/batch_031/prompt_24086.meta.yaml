  1. The "typicality" problem: in a deterministic branching universe, there are no
  fundamental probabilities, so how do you recover the Born weights? The "typicality"
  approach (Levine, Albert) says that almost all branches (in the measure given by
  the Born weights) have relative frequencies that match the Born weights — but this
  is circular because it uses the Born measure to define typicality.

  2. The decision-theoretic approach (Deutsch 1998, Wallace 2003): rational agents
  should act as if the Born weights are probabilities, based on decision-theoretic
  axioms (Dutch book, etc.). The criticism (Lewis, Forster) is that it''s circular
  or that the "self-locating" probability is not well-defined.

  3. Zurek''s envariance (2003, 2005): derives the Born rule from "environment-induced
  superselection" and symmetry arguments.

  4. The "probability-free" Everett: some Everettians (e.g., Carroll, Sebens) argue
  that probability is not fundamental and the Born rule is a "rational" or "self-locating"
  rule.

  5. The "many-minds" vs. "many-worlds" distinction.


