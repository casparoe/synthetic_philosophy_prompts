  **Option 2: No-trade theorems + argument proving too much.**


  No-trade theorems: if traders are risk-neutral, have common priors, and know each
  other''s posteriors (and that they are rational, etc.), then there is no trade.
  The "no-trade theorem" in the epistemology of markets: if two agents are rational
  with common priors, and one agent''s posterior differs from the other''s, and both
  know each other''s posteriors, then there''s no trade (in the sense of mutually
  beneficial trade) between them — actually, the no-trade theorem says that trade
  is impossible when there is no asymmetric information. If there is asymmetric information,
  trade is possible (Grossman-Stiglitz paradox).


  "Proves too much" argument: the no-trade theorem, if taken seriously, implies that
  any market trade is evidence that the traders have different information — so markets
  are "efficient" in the sense that observed trade is informative. But then: (1) By
  the no-trade theorem, if two traders with common priors and rationality would not
  trade, then any observed trade implies information asymmetry. (2) But if the information
  is asymmetric, then the informed trader''s edge decays as trades happen (the uninformed
  side is adverse-selected against, and the price adjusts). (3) So no sustained trading
  should occur — yet markets trade constantly. (4) Therefore either common priors
  fail, or rationality fails, or… This is basically the Grossman-Stiglitz paradox.
  The "proves too much" version: if the no-trade theorem is correct, then all trades
  are evidence of asymmetric information, and if all trades are evidence of asymmetric
  information, then the price adjusts to eliminate the asymmetry, and so no trade
  should occur — but trade does occur. So either the no-trade theorem''s premises
  are wrong, or… The resolution: the no-trade theorem requires that the *existence
  of trade itself* be common knowledge, and the price adjustment process is precisely
  what creates the asymmetry (the cost of information acquisition). So the theorem''s
  conditions are never actually satisfied in real markets — the very act of trading
  changes the information structure.


