  **Option 1: Self-deception + argument proving too much.**


  Classic self-deception arguments: the "impossibility" argument — self-deception
  requires that one believe p and not believe p simultaneously, or that one believes
  one doesn''t believe p while believing p. The standard impossibility argument: (1)
  To believe p, one must be in a state that is transparent to oneself — belief is
  a state one cannot be ignorant of having. (2) If one is in a state of believing
  p, one knows (or is in a position to know) that one is in it. (3) Self-deception
  requires believing p while believing one doesn''t believe p (or believing one doesn''t
  believe p). (4) Contradiction / irrationality. Therefore self-deception is impossible.


  Or the "two minds" argument: self-deception requires that the deceiving agent be
  distinct from the deceived agent, but there''s only one agent.


  A "proves too much" version: an argument that self-deception is impossible, where
  the premises look plausible but the conclusion is false (given the ubiquity of self-deception).
  This is a good candidate. The argument:


  (1) A belief is a state that is, in principle, transparent to the subject: if S
  is in a state of believing p, then S is in a position to know that S believes p
  (belief is "first-personally given").

  (2) If S is in a position to know that S believes p, then S cannot simultaneously
  believe that S does not believe p.

  (3) Self-deception about p requires S to believe p while believing that S does not
  believe p (or, at minimum, to lack any belief that S believes p).

  (4) Therefore self-deception is impossible.


  Where does it break? Premise (1) conflates two kinds of transparency: (a) the transparency
  of the *content* of belief (to be in a state of believing p, one must be in a position
  to grasp p), and (b) the transparency of the *attribution* (one''s own belief that
  one believes p). One can have a belief that one does not reflectively endorse —
  the belief is "there" in the sense of governing behavior, but the first-person attribution
  is blocked or denied. So (1) holds for the content but fails for the meta-level
  attribution. The argument equivocates between "one must be able to know what one
  believes" (about the content) and "one must be able to know that one believes" (about
  the attribution).


