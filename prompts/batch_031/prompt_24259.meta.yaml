  This is a rich domain. The "proves too much" argument: an argument that anatta implies
  there is no personal identity, or that it leads to a contradiction. E.g.:


  (1) Anatta says there is no permanent, unchanging self.

  (2) Personal identity over time requires a persistent entity (the self) that is
  the same at t1 and t2.

  (3) Therefore, if anatta is true, there is no personal identity over time.

  (4) But we clearly have personal identity over time (I am the same person who was
  me yesterday).

  (5) Therefore anatta is false.


  Where does it go wrong? Premise (2) — the assumption that personal identity requires
  a *substance* (a persistent entity). The Buddhist view is that personal identity
  can be *reductive*: the continuity of a causal chain of mental/physical states,
  without a substrate. So (2) is the point of contention. But this is also fairly
  standard.


