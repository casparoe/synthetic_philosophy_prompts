  The demandingness objection to consequentialism (especially act utilitarianism)
  has several forms:

  1. It demands too much of us (we should give away all our wealth until we reach
  the point of marginal utility, etc.).

  2. It conflicts with our moral intuitions (e.g., we don''t have to sacrifice our
  own projects, relationships, etc.).

  3. The "ought implies can" argument: if we can''t do something, we''re not obligated
  to do it. Since we can''t always do the most good, consequentialism''s demands are
  too strong.


  Responses to the demandingness objection:

  - Satisficing consequentialism: we don''t need to maximize, just do "enough good."

  - Non-sacrificial consequentialism: consequentialism doesn''t demand that we sacrifice
  our own interests, only that we don''t act against the good.

  - The "ought implies can" response: actually, we can do more good, so the objection
  fails.

  - The "ought implies can" response: the objection is based on a false premise about
  what we can do.

  - The "ought implies can" response: the demandingness is a feature, not a bug.

  - The "ought implies can" response: the objection confuses the ideal with the actual.


  Actually, let me be more careful. Let me recall the specific responses:


  1. **Sinnott-Armstrong** (2005, "Can the Consequentialist Respond to the ''Too Demanding''
  Objection?"): He argues that the demandingness objection relies on a false disjunction,
  and that consequentialism can be made less demanding. He distinguishes between different
  versions.


  2. **Kagan** (1998, "The Limits of Morality"): Kagan argues that the demandingness
  objection shows that morality (as a set of demands) is too demanding, and that we
  should accept that morality is limited. He''s a "non-consequentialist" in the sense
  that he thinks morality is demanding but not infinitely so.


  3. **Portmore** (2011, "Common Sense Consequentialism"): Peter Portmore argues for
  a form of consequentialism that is not demanding. He argues that the demandingness
  objection fails because it''s based on a misunderstanding.


  4. **McKie-Mossman** (2014, "A New Response to the Demandingness Objection"): She
  argues that the demandingness objection is based on a confusion between "ought"
  and "supererogation."


  5. **Sinnott-Armstrong** also discusses the "ought implies can" argument.


  6. **The "ought implies can" argument**: This is the classic response. The idea
  is that if an action is impossible, we''re not obligated to do it. But consequentialists
  can respond that we can always do more good (at least in some cases), so the objection
  fails.


  7. **The "satisficing" response**: We don''t need to maximize, just do enough. This
