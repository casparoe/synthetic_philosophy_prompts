  I retired last year after a long career in theoretical ecology, and over the past
  couple of years I''ve been reading philosophy of action and decision theory, which
  is where I ran into Herbert Simon''s notion of satisficing. I have no trouble with
  the basic idea — that agents operating under real cognitive and informational constraints
  do not maximize but stop once an option crosses some acceptance threshold — but
  I keep hitting a debate in the literature that I cannot get a handle on, and I would
  like a diagnosis of it rather than a survey.


  As I read it, the dispute is over the status of satisficing as a rival to maximization.
  One camp, roughly the expected-utility and decision-theory side, treats satisficing
  as at best a descriptive caveat: it records how people in fact fall short of rational
  choice, but it is not a genuine theory of what rationality requires, because it
  never pins down where the threshold lies or how it is set, and so it cannot deliver
  the kind of determinate predictions that expected utility does. The other camp,
  the bounded-rationality tradition descending from Simon, treats satisficing as a
  positive account of rational decision-making: given the agent''s real limits, a
  rational agent ought to search and stop in just the way satisficing describes, and
  the looseness of the threshold is a virtue, because it tracks the adaptive, context-sensitive
  way real agents actually calibrate their standards.


  In my own field I live with this tension every day. We build optimality models of
  foraging and reproduction that are useful only "as if" the animal were solving a
  clean optimization problem, and everyone knows the animal is not doing that. So
  I have a working hypothesis, offered only as a hypothesis: I suspect the impasse
  is largely about what the word "rational" is doing. One side means "normatively
  ideal," in which case satisficing cannot compete, and the other means "adaptively
  adequate given the constraints," in which case unconstrained maximization is the
