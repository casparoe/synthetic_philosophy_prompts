  The Wolfenden/Hart-Devlin episode is extremely well-known in legal philosophy. The
  facts: the Wolfenden Committee (1957) recommended the decriminalization of private,
  consensual homosexual acts between men over 21. Lord Devlin dissented, arguing that
  the law should enforce the moral consensus of society — that a society is held together
  by a shared morality, and that the law is the expression of that; without it, a
  society can "disintegrate." Hart (in "Law, Liberty and Morality," 1963) responded
  with the harm principle: the only legitimate basis for criminal law is the prevention
  of harm to others; the immorality of private acts is not a sufficient ground; Devlin''s
  argument is "the argument from disintegration" and Hart shows it fails because it
  assumes that the law can maintain a moral consensus, and that the consensus is thinner
  than Devlin thinks. The 1967 Sexual Offences Act decriminalized private, consensual
  homosexual acts between men over 21 (the age of consent was raised from 16 to 21),
  but did not decriminalize acts in the presence of more than two people. This is
  common knowledge in this area.


