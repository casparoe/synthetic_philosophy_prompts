  Actually, let me reconsider: the "in the weeds" requirement. A standard Harsanyi
  summary: "Harsanyi''s theorem shows that if individual preferences are represented
  by expected utilities, then the only social welfare function satisfying IIA and
  Pareto is a weighted sum of individual utilities." In-the-weeds details:

  1. The weights are state-independent (that''s what IIA forces) — but the theorem
  is silent on their values.

  2. Harsanyi''s own move to get equal weights: a symmetry / "impartiality" argument
  — an agent behind a veil of ignorance who doesn''t know which person they''ll be
  should weight all positions equally; this is a separate argument from the theorem,
  and it''s where critics (e.g., those who think the veil-of-ignorance argument is
  question-begging, or Sen''s critiques) attack.

  3. The representation assumption: individuals'' preferences must be representable
  by expected utilities (von Neumann–Morgenstern utilities) — the theorem is about
  cardinal utilities with interpersonal comparability of ratios... actually, the theorem
  requires that utilities be cardinally comparable (the "strong" version); Harsanyi''s
  argument for why interpersonal utility comparisons make sense is via a "rational
  agent maximizing expected utility across possible selves" argument.

  4. The theorem is sometimes called Harsanyi''s "aggregation theorem" or "social
  welfare function theorem" (1955, "Cardinal Welfare, Individualistic Ethics, and
  Interpersonal Comparisons of Utility").

  5. Relation to Arrow: Arrow''s theorem bans such a social welfare function under
  much weaker conditions (ordinal utilities, no restriction on the preference domain);
  Harsanyi''s theorem shows that if you add the expected-utility (cardinal) representation,
  the ban lifts — the weighted sum satisfies IIA. So the in-the-weeds point: Arrow
  says no aggregation; Harsanyi says if preferences are expected-utility representable,
  there''s exactly one form of aggregation, and it''s a weighted sum. The tension
  between the two theorems is a great in-the-weeds point: they''re not contradictory
  because the domains differ (Arrow: arbitrary ordinal preferences on a restricted
  domain; Harsanyi: EU-representable preferences).


