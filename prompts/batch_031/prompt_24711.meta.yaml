  Hempel''s conditions:

  - Conjunction condition: if E confirms H, and H entails H'', then E confirms H''.
  (Or: if E confirms H and E confirms H'', then E confirms H & H''.)

  - Equivalence condition: if H and H'' are logically equivalent, then E confirms
  H iff E confirms H''.


