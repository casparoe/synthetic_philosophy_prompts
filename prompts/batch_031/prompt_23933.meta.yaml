  (1) By the Löwenheim-Skolem theorem, if a first-order theory has any infinite model,
  it has a countable model.

  (2) ZFC (assuming consistency) has a model.

  (3) So ZFC has a countable model M.

  (4) From the outside, M is countable: there is a surjection from the natural numbers
  onto M.

  (5) But M satisfies "there is no surjection from the natural numbers onto the power
  set of the natural numbers" (Cantor''s theorem holds in M).

  (6) So the external surjection is not in M, and M does not "see" it.

  (7) So whether a set is countable depends on which model you''re looking from.

  (8) So "countable" does not have a determinate meaning.

  (9) By the same reasoning, any property that can be expressed in the first-order
  language of set theory is model-relative: "being a model of ZFC," "being well-ordered,"
  etc.

  (10) So no first-order statement has a determinate truth value.

  (11) But "2+2=4" is true.

  (12) So something goes wrong.


  Where does it go wrong? The flaw is in (7)→(8), or in the generalization (9): the
  move from "the *external* property of being countable is not captured by the internal
  satisfaction relation" to "''countable'' has no determinate meaning." The resolution:
  "countable" is a *metatheoretic* term, and it has a determinate meaning in the metatheory;
  the paradox only shows that the *object-language* cannot express the metatheoretic
  notion of countability (which is Tarski''s point — the satisfaction relation for
  the metatheory is not definable in the object language). So the argument equivocates
  between the object-language and the metatheory: the "countable" in (4) is metatheoretic,
  and the "countable" that M fails to capture is object-language. The generalization
  in (9) fails because not every property is first-order expressible — the argument
  needs to show that *every* first-order property is model-relative, but the interesting
  properties (like "being the standard model") are precisely the ones that are not
  first-order expressible, and their relativity is not a paradox but a fact about
  the limits of first-order expressibility.


