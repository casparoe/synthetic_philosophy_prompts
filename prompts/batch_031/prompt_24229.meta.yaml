  by random fluctuation from a thermal equilibrium state. The problem is that in an
  infinite de Sitter space (or in eternal inflation, which has an infinite number
  of de Sitter patches), the number of Boltzmann brains will be infinite, and the
  number of ordinary observers (who arose through the standard cosmological evolution)
  will be finite. This means that a randomly chosen observer is more likely to be
  a Boltzmann brain than an ordinary observer. This is a problem because it implies
  that we are probably Boltzmann brains, which is absurd (or at least, it undermines
  our confidence in our cosmological observations).


  The "measure problem" is the problem of how to define a measure on the space of
  possible cosmologies (or on the space of possible observers) such that you can make
  probabilistic statements. The problem is that different measures give different
  answers to the question "what is the probability that we are Boltzmann brains?"
