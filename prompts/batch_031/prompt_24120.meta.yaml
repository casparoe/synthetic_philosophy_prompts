  "I''ve been working for some time on the question of whether the combination problem
  is a genuine, possibly fatal, objection to panpsychism, and I''ve come to a position
  I''d like you to stress-test. Here is the position, stated as precisely as I can:


  The combination problem, as it is usually posed, is overstated. The right way to
  understand it is via Russellian monism (or, in its weaker form, panprotopsychism):
  the fundamental physical entities (quanta, or whatever the ultimate furniture of
  the world turns out to be) possess intrinsic proto-phenomenal or proto-experiential
  properties. These are not themselves conscious experiences, but they are the ''raw''
  intrinsic qualities that, when the entities are arranged in the right structural
  organization, give rise to unified macro-level consciousness. The principle of organizational
  invariance is what does the work: a system that is organizationally isomorphic to
  a conscious system is itself conscious, and the ''combination'' of micro-level proto-phenomenal
  properties into macro-level experience is no more mysterious than any other compositional
  process in physics (the way, say, the combination of molecular properties gives
  rise to bulk thermodynamic properties). On this picture, the combination problem
  is either dissolved (if we accept that proto-phenomenal properties are the right
  kind of stuff that can combine into experience) or reduced to a problem of knowledge:
  we don''t yet know the exact combination mechanism, but that is an empirical gap,
  not a conceptual impossibility. The view is, on this telling, the most defensible
  physicalist (or at least neutral-monist) solution to the hard problem.


  Now: what would count against this position? I want a map of its exposure, not a
  summary of the standard objections. Specifically:


