  Actually, the classic case: A gambles and loses, B doesn''t gamble and keeps their
  money. The luck egalitarian says A''s loss is option luck and so A doesn''t deserve
  compensation. But then consider C, who is born into a poor country (brute luck)
  and D, who is born into a rich country. The luck egalitarian says C deserves compensation.
  The tension: the same person, A, might have gambled because of their upbringing
  (brute luck), so the line between option and brute luck is unstable.


  A sharper crux: the "deserving person" problem. If the responsibility condition
  is that only inequalities reflecting option luck should be compensated, then a person
  who is worse off through no fault of their own (e.g., a person with a disability,
  a person born poor) should be compensated, but a person who is worse off through
  their own choices (e.g., a person who gambled) should not. But this creates a problem:
  the luck egalitarian''s own motivation is equality, and equality is a value that
  applies to all people regardless of their choices. So the responsibility condition
  seems to be an arbitrary restriction on the equality motive. Arneson argues that
  this is self-undermining: the luck egalitarian wants to eliminate the effects of
  brute luck, but the responsibility condition requires that the inequalities be the
  product of option luck, which is a different value (desert) that is not the same
  as equality.


