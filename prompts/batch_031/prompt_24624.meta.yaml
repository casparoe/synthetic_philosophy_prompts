  Actually, a very clean and "in the weeds" crux for luck egalitarianism is the **instability
  of the brute/option luck distinction**. Frankfurt''s distinction is supposed to
  be the foundation of luck egalitarianism, but it turns out to be unstable because:

  1. The line between "choice" and "luck" is not sharp. Most of our "choices" are
  influenced by brute luck (our upbringing, our genes, our circumstances).

  2. The distinction is unstable in the sense that whether an outcome is "option luck"
  or "brute luck" depends on the level of description. E.g., if I choose to invest
  in a risky venture, my loss is option luck. But if I chose to invest because I was
  raised to be risk-tolerant, then my choice was influenced by brute luck, so my loss
  is (partly) brute luck.


  This is a great crux because it forces the student to think about the foundations
  of the theory, not just recite the views. And it''s "in the weeds" — it''s a specific
  technical problem, not a general summary.


