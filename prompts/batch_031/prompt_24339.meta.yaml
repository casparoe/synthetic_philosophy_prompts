  Let me recall Harsanyi''s aggregation theorem precisely:


  Setup: There are n individuals. Each individual i has a von Neumann–Morgenstern
  (vNM) expected utility function u_i over outcomes (or over prospects / lotteries
  over outcomes). A social welfare function W maps a profile of individual expected
  utilities (or a profile of prospects) to a social evaluation.


  Assumptions:

  1. Each individual''s preferences satisfy the expected utility axioms (so u_i is
  a vNM utility).

  2. Interpersonal utility comparisons are cardinal and meaningful (the u_i are on
  comparable cardinal scales).

  3. The social welfare function satisfies independence of irrelevant alternatives
  (IIA) (or, more precisely, a condition on how the social welfare function aggregates).

  4. The social welfare function is continuous and non-dictatorial (and non-constant).


  Conclusion: The social welfare function is a weighted sum of the individual utilities:
  W(u_1, ..., u_n) = Σ_i α_i u_i, where α_i ≥ 0 and Σ_i α_i = 1 (the α_i are the "social
  weights").


  Then, Harsanyi''s "veil of ignorance" / impartiality argument: behind the veil of
  ignorance (not knowing which individual you are), the rational (impartial) choice
  is to maximize the expected social welfare where the expectation is over an equal
  prior on identities. This gives equal weights α_i = 1/n, yielding (equal-weight)
  utilitarianism.


