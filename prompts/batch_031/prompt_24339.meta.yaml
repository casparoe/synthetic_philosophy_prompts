  Option: Harsanyi''s aggregation theorem. This is pretty technical — the theorem
  that if individual preferences are expected utility with a common probability (or
  subjective probabilities) and interpersonal welfare comparisons are cardinal, then
  the social welfare function must be a weighted sum of individual utilities. There
  are technical subtleties: Harsanyi 1955 "Cardinal welfare, individualistic ethics,
  and interpersonal utility comparisons," the theorem requires the utilitarian social
  welfare function under expected utility and the independence of irrelevant alternatives
  (IIA), and the "no dictatorship" condition. There are well-known subtleties: the
  theorem assumes the "veil of ignorance" / impartiality argument for equal weights
  (the "fair prior" argument). Also known critiques: the theorem doesn''t actually
  prove utilitarianism because the weights could be arbitrary. The theorem relies
  on the assumption that the social welfare function is continuous and non-dictatorial.
  Also, Harsanyi''s theorem is often confused with Arrow''s theorem. There''s also
  the issue of "ex post" vs "ex ante" — the theorem is about the social welfare function
  over ex ante prospects, and the weights are the "impartial" weights derived from
  the veil of ignorance. Also, the theorem assumes interpersonal utility comparisons
  are possible and cardinal.


