  But I want to make sure the comparison is genuinely interesting and not just a trivial
  restatement. The key differences:

  - Synchronic: one-shot, static, targets the probability axioms (additivity, normalization).
  The Dutch book is a single set of bets.

  - Diachronic: sequential, dynamic, targets conditionalization. The Dutch book is
  a sequence of bets across two (or more) times.


  The key commonality: both use the threat of a sure loss (Dutch book) to argue for
  rationality constraints on credences.


  The key vulnerability differences:

  - The synchronic argument is vulnerable to: the "no such bets" objection (the bookmaker
  doesn''t exist), the "unrealistic bets" objection (the bets are on weird things),
  the "risk aversion" objection (a risk-averse agent might accept a small sure loss
  to avoid a large possible gain — but wait, a Dutch book is a sure loss, so risk
  aversion doesn''t help). Actually, the main objection to the synchronic argument
  is that it assumes the agent will accept all bets at the offered prices, and that
  a sure loss is irrational. Some people (like the "pragmatist" critics) say that
  a small sure loss might be acceptable.

  - The diachronic argument is more vulnerable because it relies on the agent being
  "the same agent" at both times (same utility, same beliefs), and it''s vulnerable
  to the "you might not make the same bets" objection and the "utility invariance"
  objection. Also, the diachronic argument is vulnerable to the point that the agent
  can avoid the Dutch book by not accepting the second set of bets, or by changing
  their utility function.


