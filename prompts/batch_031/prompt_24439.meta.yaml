  the knowledge, or change the model''s state, so you''re not measuring a pre-existing
  state. (Like the observer effect.) The method should be able to distinguish "I extracted
  what was already there" from "I caused it to appear."


  4. **Reliability of self-report**: The model''s statements about what it knows may
  be calibrated or miscalibrated, may be sycophantic, may be confabulated. The method
  needs a way to discount or correct for this.


  5. **Granularity / what counts as a unit of knowledge**: Is knowledge propositional,
  procedural, or something else? How do you define the "knowledge" you''re trying
  to elicit so you can check whether you got it?


  6. **Distinguishing elicitation from training / from evaluation**: Elicitation should
  not be a covert fine-tuning; it should not just be a benchmark. Where''s the line?


