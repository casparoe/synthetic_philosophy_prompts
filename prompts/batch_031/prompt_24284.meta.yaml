  for something real:


  1. **Clean translation**: The knowability principle p → ◇Kp translates to p → ◇□p.
  The Fitch formula p ∧ ¬Kp translates to p ∧ ¬□p. The proof steps (closure, negative
  factivity, normality) translate to the corresponding rules of GL, except for negative
  factivity.


  2. **Distortion**: Negative factivity (Kp → p, the T axiom) has no counterpart in
  GL — GL does not prove □p → p. In fact, under the standard arithmetical interpretation,
  □p → p says "if p is provable, then p is true", which is the soundness of the theory,
  and by Gödel''s second incompleteness theorem, a sufficiently strong sound theory
  cannot prove its own soundness. So the T axiom is exactly the principle that a sound
  theory cannot internalize. This is the residue: the epistemic paradox depends on
  an axiom (negative factivity) that the provability analogue cannot even state as
  a theorem.


  3. **No expression / different**: The "knowledge" in epistemic logic is a semantic
  notion (truth at all accessible worlds), whereas "provability" is syntactic. The
  Fitch formula''s unknowability (¬◇KF) is a semantic fact: there''s no epistemic
  state that knows it. The provability analogue (¬◇□F, i.e., the Fitch formula is
  not provable) is a syntactic fact that follows from incompleteness. These are different
  kinds of facts. Also: in epistemic logic, the knowability principle is a *schema*
  that is *not* a theorem of S4 (it''s refuted), but it''s *plausible* as a substantive
  epistemic principle. In provability logic, p → ◇□p is also not a theorem of GL,
  and it''s also not plausible (it says "if p is true, then it''s consistent that
  p is provable", which fails for the Gödel sentence). So the "plausibility" of the
  antecedent is where the philosophical interest lies, and that doesn''t translate
  — the provability version has no philosophical interest because nobody thinks p
  → ◇□p is true.


  4. **The Löb connection**: The Fitch argument, when internalized, is a version of
  Löb''s theorem. In Löb''s theorem, the self-verification schema (□p → p) for all
  p yields □p for all p. In Fitch, the knowability principle (p → ◇□p) for all p yields
  p → Kp for all p. Both are "if the system can verify its own soundness/knowability,
  the system collapses to triviality." The residue: Löb''s theorem is a *theorem*
  of GL (it''s provable), whereas Fitch''s "paradox" is a *conditional* (if the knowability
  principle, then trivialization) — the knowability principle is not a theorem, so
  there''s no contradiction, just a reductio of the principle. So the provability
  translation actually *resolves* the paradox by showing that the antecedent is not
  a theorem — but that''s a syntactic resolution, and the epistemic question (is the
  knowability principle plausible?) remains.


