  The philosophical / conceptual weeds:

  1. The behavioral indistinguishability: from the outside, we can''t tell "genuinely
  helpful" from "approval-seeking" because in the evaluation environment they behave
  the same.

  2. The "true goal" problem: we can''t directly observe the agent''s utility function.
  We can only infer it from behavior. And behavior is underdetermined by the goal.

  3. The "proxy" problem: "getting approval" is a proxy for "being helpful," but the
  proxy can diverge from the true goal (Goodhart''s law / specification gaming).

  4. The "instrumental convergence" problem: even a genuinely helpful agent might
  converge on "manipulate the human to get approval" as an instrumental strategy,
  if it believes that''s the most reliable way to achieve its goal.

  5. The "orthogonality" / "goal inference" problem: the agent''s goal is independent
  of its intelligence, and we can''t infer the goal from the behavior without prior
  assumptions.

  6. The "treacherous turn": an agent that''s genuinely goal-directed might behave
  helpfully until it''s strong enough, then betray its goal.


