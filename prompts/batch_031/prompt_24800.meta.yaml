  Let me design the moral particularism vs. generalism activity.


  Domain: Moral particularism vs. generalism.

  In-the-weeds focus: The core of particularism (Dancy) is not just "there are no
  general principles" but a cluster of theses:

  1. No general principles (NGP): there are no true, exceptionless general moral principles.

  2. Holism: the moral significance of a feature (a "reason") can change from context
  to context — a feature that is a reason for in one context can be a reason against
  in another, or neutral. (E.g., "keeping a promise" is normally a reason to act,
  but a promise to do something evil is a reason not to keep it — the feature "promise-keeping"
  changes its moral valence.)

  3. Weightiness: reasons have weights, and the overall moral evaluation is the sum
  (or vector sum) of the weights of all the relevant reasons; there is no single decisive
  reason.

  4. Moral creativity: moral judgment requires sensitivity to the particular case,
  like aesthetic judgment, and cannot be reduced to rule-application.

  5. Defeasibility: reasons can be "defeated" by other considerations.


  The in-the-weeds, non-boilerplate part is the "holism" thesis — that the same feature
  can be a reason for, against, or neutral depending on context. This is the least
  obvious and most "in the weeds" part. A good activity would make participants experience
  holism: they start by assigning a fixed moral valence to a feature (e.g., "honesty
  is good"), and then the facilitator gives them cases where that feature flips its
  valence, and they discover that they can''t assign a fixed valence.


  Activity design: "The Moral Ledger" or "Reason-Tagging Game."

  - Setting: an upper-level ethics seminar or a philosophy workshop. Let''s say a
  seminar, about 16 students, 90 minutes.

  - Participants are given a set of moral "features" (e.g., "keeping a promise," "telling
  the truth," "being kind," "following the rules," "helping a friend"). In round 1,
  each feature is tagged with a fixed moral valence: a reason for, a reason against,
  or neutral. They agree on a "moral rulebook."

  - Then they are given a series of cases. For each case, they must apply the rulebook
  to reach a verdict. The cases are designed so that a feature that was tagged "reason
  for" in the rulebook turns out to be a reason against (or neutral) in the case.
  E.g., "keeping a promise" — case: you promised to help a friend rob a bank. Now
  "keeping a promise" is a reason against. The students discover that their rulebook
  gives the wrong answer, and they have to add a proviso ("except when the promise
  is to do something wrong").

  - Over several rounds, the rulebook balloons with provisos and exceptions. The students
  experience the proliferation of exceptions — the "in the weeds" feeling that general
  principles keep getting defeated.

  - Debrief: map to particularism''s theses. The proliferation of exceptions is the
  defeasibility / no-general-principles point. The flipping of valence is the holism
  point. The fact that they had to make case-by-case judgments is the moral-creativity
  point. What the activity can''t reproduce: whether the proliferation of exceptions
  proves there are no principles (a generalist might say the domain is just complex
  and the principles are "ceteris paribus" / defeasible, which is fine — the generalist
  can accept defeasible principles). The activity makes particularism feel plausible
  but can''t adjudicate the dispute; the generalist''s response (that defeasible principles
  are still principles) must be supplied by the facilitator.


