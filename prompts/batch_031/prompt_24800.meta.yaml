  Hart–Fuller activity:

  - In-the-weeds focus: Fuller''s eight principles of legality (generality, publicity,
  prospectivity, clarity, non-contradiction, possibility of compliance, constancy
  over time, congruence between declared rule and official administration). Fuller''s
  claim: a legal system that systematically violates these is not law at all — it''s
  a "failure of law," not a "success of law." This is the "internal morality of law"
  / procedural natural law. Hart''s response: law is a social fact (a product of human
  making, identified by a "rule of recognition"); the moral quality of the law is
  a separate matter; a system can be "law" even if it''s unjust or procedurally defective,
  and we can still identify what the law is. The "open texture" of law: language has
  a "core of settled meaning" and a "penumbra of uncertainty" where judges must exercise
  discretion.

  - Activity: split the group into two "legal systems" or two "judges." One group
  is given a legal code that is procedurally defective (some rules are secret, some
  are retroactive, some contradict each other, some are impossible to comply with).
  They have to apply it to cases and experience the dysfunction — they can''t know
  what the law requires, they get caught by retroactive rules, etc. This makes them
  feel Fuller''s point: a system that violates the principles of legality is dysfunctional,
  and the dysfunction is a moral/procedural failure. The other group is given a procedurally-perfect
  but substantively-unjust code (e.g., a code that is clear, public, prospective,
  but mandates an unjust outcome, like discrimination). They apply it and find that
  it "works" perfectly as a legal system — they can identify the law with ease — but
  the outcomes are unjust. This makes them feel Hart''s point: law can be law (identifiable,
  functioning) even when it''s unjust; the moral evaluation is separate from the legal
  identification.

  - Debrief: map to the debate. The first group''s dysfunction = Fuller''s internal
  morality of law; the claim that such a system is "not law" is Fuller''s substantive
  point. The second group''s smooth-but-unjust system = Hart''s separation thesis;
  the claim that it''s still "law" is Hart''s positivist point. The tension: is a
  procedurally-broken system "law" or "not law"? Is a substantively-unjust system
  "law" or "not law"? The activity makes both intuitions felt but can''t adjudicate.

