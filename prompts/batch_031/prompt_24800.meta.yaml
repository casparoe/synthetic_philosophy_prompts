  Draft:


  I teach an upper-level undergraduate ethics seminar (about 16 students, one 90-minute
  session). I want an in-class activity that makes them feel the force of the particularist
  challenge to general moral principles — specifically the idea that the moral significance
  of a feature is not fixed but shifts with context: the very same feature can count
  as a reason for an act in one situation, a reason against it in another, and be
  morally neutral in a third. I don''t want them to hear the words "particularism,"
  "generalism," or "Dancy" until the debrief; the point is that they should run into
  the problem in the activity itself.


  Design a structured game with the following requirements:

  - A concrete mechanism by which students first commit, as a group, to a fixed moral
  valence for a set of candidate features (e.g., "keeping a promise," "telling the
  truth," "following the posted rule," "helping a friend") — tagging each as a pro
  tanto reason for, a reason against, or neutral — and write these down as a shared
  "rulebook."

  - A sequence of staged cases, presented one at a time, in which at least one feature
  from their rulebook must do work, and where the cases are engineered so that a feature
  they tagged "reason for" (or "reason against") turns out to require the opposite
  verdict in the case — forcing them to either get the wrong answer or to flip the
  feature''s valence.

  - A rule or incentive that makes the cost of each fix visible: every time they patch
