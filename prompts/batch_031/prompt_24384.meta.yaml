  (especially "difference of kind" / categorical moral status), the absence of a sharp
  boundary is more threatening, because a categorical distinction seems to require
  a sharp cutoff. So the spectrum argument may not be a valid logical inference, but
  it may place an epistemic burden: if you claim a categorical difference, you should
  be able to say where it is, and if you can''t, the distinction is less secure. This
