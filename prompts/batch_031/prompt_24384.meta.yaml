  Actually, a well-known argument for non-transitive betterness involves "the worse
  of two bad options" or "the lesser evil." Or consider: it can be that A is better
  than B (all else being worse about A), B is better than C, but C is better than
  A — like a rock-paper-scissors of values. This is possible if "better" is context-dependent
  or if we''re comparing on different dimensions.


  But the more standard "in-the-weeds" point about spectrum arguments is this: spectrum
  arguments conclude "there is no real difference between the endpoints" from "there
  is no sharp boundary between adjacent cases." The objection is that the absence
  of a sharp boundary does not entail the absence of a difference — a difference can
  be a "difference of degree" without a "difference of kind." E.g., there is no sharp
  boundary between "tall" and "not tall," but there is a real difference in height.
  So spectrum arguments commit a fallacy (sometimes called the "fallacy of the continuum"
  or related to the sorites).


  But there''s a subtlety: spectrum arguments about moral distinctions (killing vs.
  letting die, personhood, etc.) are more threatening because they''re about "difference
  of kind" (a categorical moral status) rather than "difference of degree." So the
  dispute is: does the absence of a sharp boundary undermine categorical distinctions?
  One side (the spectrum defender) says: if the only difference between the endpoints
  is a gradual one, then any sharp moral cutoff is arbitrary, so the categorical distinction
  is not real. The other side (the objector) says: (a) there can be sharp boundaries
  (the "cliff" objection — some properties change abruptly), or (b) even without sharp
  boundaries, there can be real categorical differences that are realized gradually
  (e.g., a legal age, or "adult" — no sharp biological boundary but a real category),
  or (c) the burden is on the spectrum arguer to show that the relevant property is
  genuinely continuous and not just that we lack the ability to draw a line.


