  For wrong kind of reasons:

  - Components: (1) what a reason is, (2) that reasons can be of different kinds,
  (3) the wrong-kind-reasons phenomenon (a reason that counts for believing p that
  is not a reason that p is true), (4) why this is a problem (it seems to threaten
  the idea that reasons for belief are truth-directed / that belief is a distinctive
  attitude with its own normative profile), (5) the proposed solutions (e.g., the
  "truth-conduciveness" criterion, or the "right kind" is just "truth-directed," or
  the deflationary move that there are no wrong-kind reasons, only weak ones).

  - The carrying example: "I believe p because p is popular" or "I believe p because
  it makes me feel good" — the classic examples. What it must have: a reason that
  genuinely counts for the attitude (the person really has a reason to believe p)
  but which is not a reason that p is true. What it must lack: it must not be a case
  where the reason is just a bad reason (the reason does bear on truth, just weakly).

  - Misconceptions: (a) that wrong-kind reasons are just bad reasons (they''re not
  — they''re a different kind); (b) that the distinction is trivial or just a matter
  of phrasing; (c) that the problem is only about belief (it generalizes to other
  attitudes); (d) that the solution is obvious (just say "the right kind is the truth-directed
  kind" — but this is circular or question-begging).

  - Check for understanding: ask the student to generate a new example of a wrong-kind
  reason and explain why it''s wrong-kind rather than just bad.

  - What to leave out: the full technical literature (Smith''s formal proposal), the
  generalization to other attitudes (maybe).


