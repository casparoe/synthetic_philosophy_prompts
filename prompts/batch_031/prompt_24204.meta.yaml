  of this view is that the obligation exists even if no one relies (e.g., a promise
  to someone who never hears of it, or a promise where reliance is impossible). (2)
  says the bindingness is fully explained by reliance-harm. If (2) is true, the cases
  that motivate (1) (obligation without reliance) don''t have an obligation, so (1)
  is empty. If (1) is true, (2) can''t be the full explanation of the bindingness.
  The student holds both without noticing.


  - (2) vs. (5-apology): real, subtle. If the bindingness is fully grounded in harm,
  then a permissible breaking (one that prevents greater harm) leaves nothing to apologize
  for — the promise''s force is exhausted by the harm calculus. But (5) says an apology
  is still owed, which suggests there''s something about the promise as a relation/commitment
  that survives. The student''s (5) is a standard view (we do think you should apologize
  even when breaking is permissible), but its motivation is incompatible with (2).


