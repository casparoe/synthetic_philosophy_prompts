  Actually, a really good in-the-weeds design: a two-round game. Round 1: the standard
  hospital case, students vote on whom to save — almost everyone saves the 5. Round
  2: a "welfare audit" round in which students, playing as the family of the 1 and
  the families of the 5, must specify what the 5''s being saved is actually *better
  for them* compared to the 1''s being saved — and they discover they can''t say it
  in terms of the victims'' own welfare; the "betterness" they appealed to is a feature
  of the total picture, not of anyone''s life. That''s exactly the "no worse" claim:
  the 5 aren''t worse off than the 1. This is the in-the-weeds core.


  Another in-the-weeds element: the "aggregation" vs. "comparative" distinction. Taurek''s
  claim: even if 5 die, no one is worse off than if 1 died — the 5 are not "worse
  off" as a group? Actually, each of the 5 is worse off (they die), but the 5 as a
  group aren''t worse off than the 1. The puzzle: how does that follow? The idea that
  "more people dying" is worse seems to require aggregation of harm, but if value
  is only in individuals'' lives, there''s no "group" that can be worse off. The activity
  can make students feel this: ask them to identify *who exactly* is worse off in
  the outcome where the 5 die rather than the 1 — each of the 5 is worse off than
  in the alternative, but is the 5 worse off than the 1? The group can''t be worse
  off than an individual, because there is no group entity.


