  nature and insists that justification is a matter of solidarity, redescription,
  and the eventual success of a community’s practices. The essay should examine the
  difficulty this creates when the community’s existing moral vocabulary is itself
  the source of harm, as in cases of entrenched domination, exclusion, or historical
  injustice. Can Rorty say that a new vocabulary is better than an old one without
  appealing to some standard of truth, correspondence, or natural kind that he means
  to abandon? Or must he treat progress as a contingent, local achievement that is
  persuasive only to those already disposed to value it? Weigh the strongest arguments
  on both sides. Address at least the following: the difference between epistemic
  humility and moral quietism; the role of hope, irony, and social hope in a nonfoundational
  ethics; the objection that redescription becomes merely rhetorical if there is no
  independent criterion for when it is liberating rather than merely flattering; and
  the reply that a practice can be tested by its consequences for suffering, agency,
  and the enlargement of the circle of sympathy. The essay should not end non-committally.
  It should reach a defensible conclusion: either Rorty’s view can be reconstructed
