  Quasi-hyperbolic (β-δ) model: utility of a reward at time t (from now) is:

  - If t = 0 (now): V = x

  - If t > 0: V = β δ^t x


  So the present option is evaluated "myopically" (full weight), and future options
  are discounted by both β and δ^t. Time inconsistency: the preference between "now"
  and "later" differs from the preference between "later" and "later+interval" when
  the reference point shifts.


  Classic example: the client prefers $100 today to $110 in a month (present bias:
  $100 now = 100, $110 in a month = β δ^1 * 110; if βδ*110 < 100, pick now). But asked
  about $100 in a month vs. $110 in two months: $100 in a month = β δ^1 * 100, $110
  in two months = β δ^2 * 110. The client might prefer $110 in two months if βδ*100
  < βδ^2*110, i.e., 100 < δ*110, i.e., δ > 100/110 ≈ 0.909. So it''s entirely consistent
  for the client to prefer $100 now to $110 in a month (requiring βδ < 100/110 ≈ 0.909)
  AND prefer $110 in two months to $100 in a month (requiring δ > 0.909). E.g., β
