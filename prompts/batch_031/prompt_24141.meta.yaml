  The surface disagreement: Humeans say laws are "just" summaries of regularities
  (the BSA); anti-Humeans say laws are fundamental, necessitating, and ground the
  regularities.


  In-the-weeds cruxes:

  1. **Explanatory priority / grounding direction**: Do the regularities ground the
  laws, or do the laws ground the regularities? (This is the core, but it''s also
  the surface. Let me make it precise.)


  2. **The BSA''s circularity/triviality**: The Humean BSA defines laws as the axioms
  of the system that best balances simplicity and strength. The objection (Earman,
  and others) is that this is circular or trivial: any pattern can be made "simple"
  by choosing the right vocabulary, or the "best system" is just a way of describing
  the mosaic without adding anything. The crux: Is the BSA a substantive reductive
  account of laws, or does it merely redescribe the mosaic?


  3. **Necessitation and the modal connection**: Anti-Humeans say there''s a genuine
  metaphysical connection (necessitation, grounding, or "governance") between a law
  and its instances. Humeans deny any such connection — the only "connection" is the
  logical/systematic one. Crux: Is there a metaphysically real connection, or is it
  all "in the system"?


  4. **The counterfactual/explanatory asymmetry (Mackie)**: Laws + initial conditions
  explain the future, not the past. How does each side account for this asymmetry?
  For the Humean, the asymmetry must come from somewhere (the initial conditions,
  or the structure of the system). For the anti-Humean, it might come from the direction
  of governance.


  5. **Determinism**: In a deterministic universe, the entire future is fixed by the
  initial conditions + laws. Does the Humean account collapse (the "law" is just the
  whole history, or the initial conditions do all the work)?


  6. **The status of "lawlike" counterfactuals**: Can a Humean account of laws support
  lawlike counterfactuals? (Lewis''s own view connects this.)


