  Summary:

  "Pure time preference is the idea that, all else equal, we should care less about
  our future selves just because they are in the future. The standard formalization
  is exponential discounting, and it is the only discounting scheme that is time-consistent.
  Hyperbolic discounting, where the effective discount rate is higher for short delays,
  is therefore not a different rational attitude toward time but a self-control problem:
  if you prefer $100 in a year to $95 in a year and a month, but later prefer $95
  now to $100 in a month, your preferences are incoherent. Once you commit to a constant
  discount factor, the only remaining question is what the right discount rate is,
  since any other choice just smuggles in a self-control bias."


