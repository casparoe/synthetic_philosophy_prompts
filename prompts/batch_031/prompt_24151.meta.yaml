  Thomson''s lamp (1954/1955, "Tasks, Analyses and Recursion"): a lamp is switched
  on/off at times 1, 1/2, 3/4, ... approaching time 2 (in her original version, the
  lamp starts off, on at 1, off at 1/2, on at 3/4, ...). At time 2, infinitely many
  switchings have been completed. Thomson''s point: the supertask is logically coherent
  (the description is consistent), and it''s a mistake to think that "the limit doesn''t
  exist" means "the lamp has no state." She argued that the lamp is either on or off
  at time 2, and that there''s no contradiction in the description. The famous "Zeno-like"
  objection: "After each switch, the lamp is switched again, so at time 2 the lamp
  has just been switched... no, there is no last switch." A common student error:
  "The lamp must be off at time 2, because the last operation before time 2 is..."
  — no, there is no last operation.


  Another classic subtle error: confusing "the supertask is physically impossible
  (infinite switching requires infinite energy / finite switching time requires infinite
  power)" with "the supertask is logically impossible / incoherent." Thomson''s argument
  is about logical possibility. The physical objections (e.g., the switcher''s hand
  would have to move with infinite speed at the limit, or energy considerations) don''t
  undermine the logical coherence.


  Another subtle error: the student says "The lamp''s state at time 2 is indeterminate,
  which is a counterexample to bivalence" — but the standard reply: even if we grant
  the scenario, bivalence is about propositions being true or false. "The lamp is
  on at time 2" may be true or false. The scenario doesn''t show it''s neither.


  Yet another subtle error: the student confuses the limit of the sequence of states
  (which doesn''t exist because it oscillates) with the limit of the switching times
  (which exists, = 2).


  Also: the "kinematic vs. dynamic" distinction — some philosophers (e.g., in the
  literature on supertasks) distinguish whether the supertask is impossible due to
  kinematic constraints (a point can''t be in two places at once) vs. dynamic constraints
  (forces/energy). For Thomson''s lamp, the physical impossibility claim usually rests
  on the switcher having to move with unbounded speed.


