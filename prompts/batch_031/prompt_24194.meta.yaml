  Let me design the procedure:


  A referee for an epistemology journal receives papers that claim to offer transcendental
  arguments (against skepticism, for other minds, for the external world, for the
  existence of objects). The procedure should determine:


  1. Is it really a transcendental argument, or a different species of argument? Distinguish:
  (a) transcendental argument (conditions of the possibility of experience/thinking),
  (b) a priori argument (necessary truths, but not about conditions of experience),
  (c) inductive/empirical argument, (d) performative contradiction argument (the "refutation
  of idealism" as Strawson read it — actually this is a subtype), (e) argument from
  the impossibility of conceivability (which is the modal trap).


  2. The modal test: does the argument purport to establish necessity, or only inescapability?
  The classic objection: "we can''t think away X" ≠ "X must be the case." The procedure
  should require the paper to specify which modal claim is being made and whether
  the inference from "X is a condition of the possibility of experience" to "X" is
  licensed.


  3. The scope test (transcendental vs. empirical-transcendental): does the argument
  purport to establish a claim about mind-independent reality, or only about the conditions
  of our representation? This is the classic charge (Sellars, and the "transcendental
  illusion" charge) that transcendental arguments can only establish the latter. The
  procedure should check whether the paper''s conclusion overreaches its premises.


  4. The question-begging test: does the premise already presuppose the conclusion?
  E.g., "experience is possible only if objects exist" already assumes the object
  concept.


  5. The "conditions of what" test: the argument must specify the phenomenon whose
  possibility is being analyzed (experience, judgment, reference, action, the possibility
  of error), and the condition must be genuinely necessary for that phenomenon, not
  merely convenient or psychologically typical.


