  - It purports to establish a necessary condition of the possibility of some phenomenon
  (experience, judgment, reference, action, the possibility of error).

  - The phenomenon is something actually given or actually engaged in (not a counterfactual).

  - The inference is from "X is a necessary condition of the possibility of P" and
