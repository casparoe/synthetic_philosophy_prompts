  The modal trap: inferring from "we cannot think away X" (or "we cannot coherently
  deny X") to "X must be the case." This conflates a condition of thought with a condition
  of reality.


  The overreach charge: even if the argument establishes that X is a necessary condition
  of the possibility of experience, it does not follow that X is a necessary feature
  of mind-independent reality. It may only be a necessary feature of our representation
  of reality. This is the Sellars-style objection.


  The question-begging charge: the premise "X is a necessary condition of the possibility
  of P" may already presuppose X (e.g., "experience is possible only if objects exist"
  already uses the concept of an object).


  The "conditions of what" test: the argument must specify the phenomenon P whose
  possibility is being analyzed, and the condition X must be genuinely necessary for
  P, not merely convenient or psychologically typical.


  The species to distinguish from:

  - A priori argument: establishes a necessary truth, but not by analyzing the conditions
  of the possibility of experience. E.g., "a priori, all bachelors are unmarried."

  - Inductive/empirical argument: establishes X on the basis of evidence.

  - Performative-contradiction argument: shows that denying X is self-undermining
  in the act of denying it. E.g., "I cannot coherently say ''there are no truths.''"
  This is different from a transcendental argument because it doesn''t analyze the
  conditions of the possibility of experience; it shows that the denial is performatively
  self-refuting.


