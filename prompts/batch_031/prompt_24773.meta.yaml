  the negative of the expected payoff of a bet that a coherent (Dutch-book-free) agent
  would accept — i.e., properness is characterized by a Dutch-book-style argument.
  Forecasting tournaments (e.g., Metaculus, Good Judgment Project) rank forecasters
  by these scores and treat a low Brier score as a mark of epistemic virtue / rational
  forecasting.


