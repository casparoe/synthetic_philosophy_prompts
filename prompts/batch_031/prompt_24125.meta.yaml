  Standard resolutions to Fitch''s paradox:

  1. Reject the universal claim that all truths are knowable (restrict it to "all
  truths are knowable in principle" for a restricted class — e.g., reject it for "unknowable"
  truths like p ∧ ¬Kp; or adopt "all truths are knowable" only for truths that are
  not about knowledge).

  2. Reject positive introspection (in S4/S5 epistemic logic, Kp → KKp). Note: some
  presentations of the proof use positive introspection; if you reject it, the paradox
  can be avoided. But the original Fitch proof doesn''t need positive introspection
  — the paradox arises even without it. So rejecting positive introspection alone
  doesn''t save S5… Actually, there''s a subtlety: the "knowability paradox" is often
  presented in an S5 epistemic logic where the knowability operator is "it is possible
  that it is known," and the proof uses positive introspection. Fitch''s original
  proof didn''t use it. The literature (e.g., Williamson 2000 Knowledge and Its Limits,
  chapter "The Paradox of Knowability") argues that the paradox is genuine and the
  best response is to reject the principle that all truths are knowable — Williamson
  argues that the paradox shows that some truths are not knowable, and that this is
  not as bad as it seems because the unknowable truths are exactly the "knowing-that"-involving
  truths, and the knowability of "p" is preserved for p not involving knowledge.


  3. Williamson''s response: the paradox is genuine; we should reject universal knowability.
  The truths that are not knowable are of the form "p and I don''t know p," and their
  unknowability is not a substantive epistemic limitation.

  4. "Knowability" vs. "knowability in principle" distinction; ideal vs. non-ideal
  agents; the distinction between "it is possible that S knows p" and "S could know
  p."

  5. Reject closure under conjunction (some epistemic logics do this).

  6. Reject the semantics of possibility as "possible in some state of the world"
  — e.g., the "possibility" in ◇Kp is about the agent''s epistemic state (epistemic
  possibility relative to what the agent knows), not metaphysical possibility. If
  ◇ is epistemic possibility relative to the agent''s knowledge, then the proof goes
  through differently — this is the "epistemic" reading where the paradox becomes
  trivial or collapses.

  7. Restrict the scope of the knowability operator: the knowability operator only
  ranges over truths not involving K (the "knowability of truths" is only for "non-epistemic"
  truths). This is a deflationary response.

  8. Higher-order vs. lower-order: distinguish "p is knowable" (first-order) from
