  **Option C: Endurantism vs. Perdurantism + desiderata**

  Write the desiderata a theory of persistence must satisfy. This is a classic and
  well-trodden area: the special relativity objection (the "relativity of simultaneity"
  argument against endurantism, via the "unfriendly geometry" / 4D spacetime), the
  problem of temporal parts, the "paradox of change" (the ship that changes parts,
  the statue and the clay), the problem of being in two places at once (endurantists
  say they are wholly present at each time, which leads to being in two places at
  once), the problem of "bare particulars" / the problem of grounding (perdurants
  need a theory of what makes a temporal part the part of a particular object), the
  problem of temporal parts and the "further fact" problem (why is this temporal part
  mine?), the problem of "where" (endurantists have trouble with being in two places
  at once), the "problem of temporary intrinsics" (a thing can be round at t1 and
  square at t2, but if it''s wholly present at both times, it has both properties—solved
  by indexed properties, but that looks like a cheat).


  Desiderata for a theory of persistence: (1) must handle the paradox of change (statue/clay,
  the ship of Theseus); (2) must be compatible with special relativity (no preferred
  foliation); (3) must explain how a thing can have temporary intrinsics (being round
  now, square later); (4) must explain what it is for a thing to be *the same* thing
  over time (identity conditions); (5) must not require the thing to be in two places
  at once (or must explain why that''s not a problem); (6) must account for the "further
  fact" problem (why is this temporal part the part of *this* object); (7) must handle
  cases of things that come into existence and cease to exist (statues are made, people
  die); (8) must be parsimonious (don''t multiply entities unnecessarily); (9) must
  explain how we can refer to and know about temporal parts; (10) must handle the
  "problem of being in two places at once" (endurantism) or the "problem of bare particulars"
  (perdurantism).


