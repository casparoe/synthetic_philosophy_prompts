  This is a really good in-the-weeds case: the right to be forgotten (GDPR Article
  17) says you can demand erasure of personal data, but at the same time GDPR Article
  5(1)(c) says data should be minimized and adequate, relevant, limited to what''s
  necessary, and many jurisdictions mandate retention (banking: 5 years; telecoms:
  6–24 months in the EU via the Data Retention Directive, though struck down in part
  by the ECJ''s Digital Rights Ireland ruling). So the practice is: some data must
  be kept (retention mandated), and some data can be erased on request (right to be
  forgotten). What does this tell us about what privacy is for? If privacy is valuable
  because information *existing* is bad (secrecy view, informational self-determination
