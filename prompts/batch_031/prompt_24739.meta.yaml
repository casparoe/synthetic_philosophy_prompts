  The practice: The coexistence of (a) mandated data retention (banks must keep transaction
  records for 5–7 years, telecoms must retain metadata for 6–24 months in many jurisdictions,
  healthcare records must be kept for a certain period) and (b) the right to be forgotten
  / right to erasure (GDPR Article 17, which allows individuals to demand the erasure
  of their personal data).


  The analytical task: What theory of the value of privacy does this pattern presuppose?
  Specifically:

  - If privacy is valuable because information *existing* is bad (the "secrecy" view,
  or "informational self-determination" as non-existence), then mandated retention
  is a *constant* privacy violation, and the right to be forgotten is the *norm* (with
  retention being the exception). But the practice treats retention as the *norm*
  and erasure as the *exception* (you have to *demand* erasure, and there are many
  exemptions). So the practice does *not* presuppose the secrecy/existence view.

  - If privacy is valuable because information *being used or disclosed* in the wrong
  context is bad (the "contextual integrity" view, Nissenbaum; or the "instrumental"
  view), then retention for *defined, legitimate* purposes (fraud detection, regulatory
  compliance) is *fine*, and erasure is just *risk management* (reducing the risk
  of misuse). The right to be forgotten is not about the *existence* of the information
  being bad, but about reducing the *risk* of it being used in the wrong context.
  This fits the practice well.

  - If privacy is valuable because of *autonomy/control* (the "control" view, Solove),
  then the right to be forgotten is about *restoring control* (you get to decide whether
  your data exists), and retention is a *limitation* on control (you can''t control
  whether the bank keeps your records). The practice presupposes that control is *not
  absolute*—it''s subject to other values (fraud prevention, etc.).


  So the practice presupposes a *use-based* or *risk-based* theory of privacy (not
  an *existence-based* theory), but the *framing* of the right to be forgotten is
  in *existence-based* terms ("erasure" of data). This is the tension. The practice
  is *underdetermined* in the sense that it could be explained by several theories,
  but the *structure* of the practice (retention as norm, erasure as exception with
  exemptions) strongly suggests a use/risk-based theory.


  Additional in-the-weeds points:

  - The *exemptions* to the right to be forgotten (freedom of expression, public interest,
  legal obligations) reveal that the practice prioritizes *certain uses* (journalistic,
  legal, public-interest) over the *existence* of the information. This further supports
  the use-based view.

  - The *distinction* between data about a person''s *official role* (often exempt
  from erasure) and *private life* (often subject to erasure) reveals a theory of
  the self as having *public and private aspects*, and a theory that the value of
  privacy attaches to the *context* in which information is disclosed (contextual
  integrity).

  - The *asymmetry* between *retention* (which is *mandated*, i.e., a *duty* to keep)
  and *erasure* (which is a *right*, i.e., a *claim* that can be *waived*) reveals
  that the practice treats the *existence* of information as *neutral* (not inherently
  good or bad), and the *use* of information as the locus of value.


