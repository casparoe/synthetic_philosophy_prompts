  privacy about information not existing (informational self-determination), or about
  information not being *used* or *disclosed* (contextual integrity, Nissenbaum),
  or about autonomy/control? Data retention implies that the mere existence of recorded
  information is not the harm—otherwise retention would be a violation. So the practice
  presupposes a harm-of-use theory rather than a harm-of-existence theory. But the
  right to be forgotten is about erasure, which suggests existence itself is the harm.
