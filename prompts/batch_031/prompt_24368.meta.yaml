  so no fetching. In-the-weeds: the cruxes are genuinely technical:

  - Descriptive vs. normative: is "X has function F" a claim about causal history
  (descriptive) or about normative correctness (a malfunction is a failure to perform
  the function)?

  - Malfunctions: etiological accounts explain malfunctions via selection history
  (the heart''s function is to pump blood because pumping blood is what selected for
  hearts; a heart that doesn''t pump is a malfunction). Causal-role accounts (e.g.,
  Millikan''s later "contribution to fitness" view, or Wright''s "contributes to fitness"
  view) explain function by current causal contribution to fitness. Crux: can a causal-role
  account explain malfunctions without circularity? (If function = contributes to
  fitness, then a malfunctioning organ doesn''t contribute, so it doesn''t have that
  function — the problem of "function without contribution.")

  - Exaptation: features co-opted for a new use (feathers for flight). Etiological:
  function is what it was selected for; exaptation is a change in function. Causal-role:
  current contribution.

  - Vestigial organs: appendix, wisdom teeth. Etiological: no current function but
  had one in the past; causal-role: no function at all (or functions in some new way).

  - The "many functions" problem / functional pluralism.

  - The problem of functions of the non-adaptive (neutral drift features).

  - Designed artifacts: both accounts agree about artifacts (the function of a hammer
  is to drive nails) but disagree about whether biological function is analogous to
  artifact function (Wright''s analogy) or different.

  - Normativity: "the heart''s function is to pump blood" sounds normative (a heart
  that doesn''t pump is defective), but etiology is descriptive. Wright''s point:
  normativity comes from the analogy with artifacts and the fact of selection.

  - The "causal-role" account''s problem: the heart contributes to fitness by pumping,
  but so does the liver in contributing to metabolism; the account needs to specify
  which causal role counts.

  - Also: the "no function without history" claim vs. the "function is present-tense"
  claim.

  - The question of whether "function" is a natural kind / whether there''s a fact
  of the matter.

  - The "functions in the wild" — e.g., the function of a bird''s beak varies by species;
  the etiological account has to handle species-typical functions.


