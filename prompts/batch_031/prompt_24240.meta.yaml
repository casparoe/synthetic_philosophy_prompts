  I think is an unacceptable result. Let Kφ mean that an ideal agent knows φ, and
  let ◇φ mean that φ is metaphysically possible. I want the agent to satisfy three
  conditions. First, logical omniscience: if φ entails ψ, then Kφ → Kψ; in particular,
  K(φ∧ψ) → Kφ and K(φ∧ψ) → Kψ. Second, factivity: Kφ → φ. Third, in-principle knowability:
  for every proposition p, if p is true, then ◇Kp. I reason as follows. Suppose p
  is true but unknown, so p ∧ ¬Kp is true. By in-principle knowability, ◇K(p ∧ ¬Kp).
  But if the agent knew p ∧ ¬Kp, then by logical omniscience they would know both
  p and ¬Kp, and by factivity the second conjunct would make ¬Kp true, contradicting
  the first. Hence K(p ∧ ¬Kp) is impossible, so it cannot be possible that the agent
  knows p ∧ ¬Kp. That contradicts the earlier possibility. Therefore no true p can
  be unknown: for every p, p → Kp. This says that a logically omniscient agent who
  could in principle know every truth already knows every truth, which seems to leave
  no room for discovery, learning, or the distinction between truth and knowledge.
  Which premise or step should I reject, and what does rejecting it cost? I would
  like to keep the agent''s logical omniscience and the idea that some truths are
  unknown, but I am open to restricting the knowability principle if the restriction
  is principled rather than ad hoc."


