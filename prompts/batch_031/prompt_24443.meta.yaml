  **Dutch book + probability estimation**: A Dutch book argument is about the incoherence
  of a probability assignment — if your credences violate the axioms, a set of bets
  can be constructed that guarantees a loss. A good in-the-weeds prompt: ask for a
  probability estimate on a philosophical question *about* Dutch book arguments, decomposed.
  E.g., "What''s your credence that the Dutch book argument for the principle of indifference
  is sound?" Hmm. Or: "What''s your credence that a rational agent''s credences must
  be countably additive?" This is a genuine philosophical question (Savage vs. the
  countable additivity debate, Popper functions, etc.). Decomposition: P(rationality
  requires countable additivity | ...) — sub-questions: does the Dutch book argument
  for countable additivity go through (it doesn''t, as shown by various results —
  the Dutch book for countable additivity involves infinite sets of bets with no finite
  sub-Dutch-book, or a bookmaker who needs to be allowed infinite bets), whether the
  argument for finite additivity (the classic one) is sound, whether the Dutch book
  framework is the right framework for rationality, etc. This is quite in-the-weeds
  and meaningful without web access. The model can reason about it.


