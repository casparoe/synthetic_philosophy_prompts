  Let me recall more carefully. The classic result (Savage 1971, "Countable Additivity"
  in Bayesian Statistics — a Symposium; and the discussion by Efron, and by Jeffrey):
  the Dutch book argument for countable additivity fails in the sense that no finite
  set of bets constitutes a Dutch book. What you can do: for each n, the agent''s
  credences on the first n atoms sum to less than 1 (if non-countably-additive, the
  sum of the probabilities of the atoms is strictly less than the probability of the
  union). So the bookmaker sells the agent a $1 bet on each atom i at price p_i. After
  n bets, the agent has paid sum_{i≤n} p_i and is guaranteed to receive $1 (since
  one of the atoms in the partition will occur). So for every n, the agent is in a
  position where the cumulative position guarantees a loss of (1 - sum_{i≤n} p_i)
  > 0. But at any finite stage, the agent hasn''t yet committed to all the bets —
  the Dutch book is only realized in the limit, and the agent could stop. So the "Dutch
  book" is an infinite set of bets with no finite Dutch book sub-set. The argument
  against the agent is that there''s no finite stopping point at which the agent can
  avoid the loss without refusing a bet that is individually fair (each individual
  bet is fair given the agent''s own credences, so refusing each one individually
  is not a rational move… but refusing all of them is). This is the famous weakness:
  the Dutch book for countable additivity requires an infinite book, and the agent
  can always stop, so the argument is much weaker than the finite case.


  So a good prompt: "What''s your credence that the Dutch book argument is a sound
  argument for the requirement that a rational agent''s credences be countably additive?"
