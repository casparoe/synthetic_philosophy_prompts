  the thesis that values are arbitrary; it''s the experience/tension of the demand
  for meaning meeting the world''s silence, and Camus explicitly refuses to resolve
  it by inventing meaning (he calls that "philosophical suicide"); (2) Camus''s moral
  claims in "Reflections on the Guillotine" are grounded not in cosmic meaning but
  in shared human limits — the insight that "to kill a man is to destroy the whole
  world" (I''d paraphrase: killing a human being destroys something shared by everyone)
  — this is the revolt/solidarity move: the absurd, far from isolating us, reveals
  a common condition, and revolt is the refusal to let anyone (including the state)
  treat a human being as a means; (3) his arguments also include practical considerations
  (irreversibility, the risk of executing the innocent, the corrupting effect of state
  killing on society), which don''t require strong moral realism; (4) so the two texts
  are consistent: the absurd is the ground for taking the limit on killing seriously,
  precisely because there is no higher authority to arbitrate — the only thing we
  can share is the refusal of murder.


