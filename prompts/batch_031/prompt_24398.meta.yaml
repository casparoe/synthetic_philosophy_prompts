  Lexical-threshold negative utilitarianism:

  - Negative utilitarianism: the view that the reduction of suffering is the primary
  moral imperative, and that happiness has less (or no) moral weight.

  - Lexical: suffering is lexically prior — no amount of happiness can compensate
  for any amount of suffering (or above some threshold).

  - Threshold: there''s a threshold below which suffering counts, or a threshold of
  well-being.

  - Commensurability of pleasure and pain: the question of whether pleasure and pain
  can be measured on a common scale (Bentham''s felicific calculus), or whether they''re
  incommensurable. The "in the weeds" issue: if you can''t commensurate pleasure and
  pain, then utilitarianism (which requires summing) breaks down. Negative utilitarianism
  partly dodges this by focusing only on pain, but the lexical-threshold version still
  needs to handle the comparison.


  Desiderata for a theory of the commensurability of pleasure and pain:

  - Must handle the asymmetry (pain seems to matter more than pleasure of the same
  "magnitude")

  - Must handle the threshold (is there a level of suffering below which it doesn''t
  count? or a level of pleasure below which it doesn''t count?)

  - Must handle the lexical vs quantitative question (can enough pleasure outweigh
  a little suffering?)

  - Must handle the interpersonal comparison problem

  - Must handle the problem of measuring / cardinality

  - Must be consistent with the fact that we can make moral judgments (e.g., "this
  suffering is worse than that one")

  - etc.


