  The Church–Turing thesis (CTT): "A function of natural numbers is computable iff
  it is computable by a Turing machine" (or equivalently, by any reasonable model
  of computation).


  The debate about its epistemic status:

  1. **A priori / conceptual view**: The CTT is a truth of reason, established by
  showing that any "effective procedure" or "algorithm" can be carried out by a Turing
  machine. It''s a priori because it''s about the nature of computation/effectiveness,
  not about the physical world. (This is the traditional view, associated with Church
  and Turing''s own arguments.)

  2. **Stipulative / definitional view**: The CTT is just a definition — we define
  "computable" to mean "Turing-computable," so the thesis is trivially true by definition.
  (This is a deflationary view.)

  3. **Empirical / physical view**: The CTT (in its "physical" or "strong" form —
  that what is physically computable is Turing-computable) is a substantive empirical
  claim about the world, on par with a law of nature. It could in principle be falsified
  by a physical machine that computes a non-Turing-computable function (a "hypercomputer").
  This view is associated with people like Copeland, and is motivated by the fact
  that we can conceive of analog machines, quantum machines, etc., that might (or
  might not) compute beyond the Turing limit. The "weak" CTT (about abstract effective
  procedures) is a priori, but the "strong" or "physical" CTT is empirical.


  So the in-the-weeds position to take is: "I hold the view that the (physical/strong)
  Church–Turing thesis is a substantive empirical claim about the physical world,
  and that its epistemic status is like that of a law of nature — not a conceptual
  truth, not a stipulative definition, not an a priori truth. What counts against
  it?"


  What counts against this view (the empiricist view):

  - The **deflationary/stipulative objection**: much of the CTT''s use in mathematics
  and computer science is stipulative — we define "computable" as "Turing-computable,"
  so in those contexts the thesis is trivially true, not empirical. If the thesis
  is mostly used stipulatively, then the "empirical" reading applies only to a narrower
  "physical" version, which weakens the claim that the CTT (as usually stated) is
  empirical.

  - **The a priori argument from Church and Turing**: Church and Turing argued for
  the thesis by showing that any "effective procedure" (in the intuitive sense) can
  be carried out by a Turing machine. This argument is a priori — it''s about the
  nature of effectiveness, not about the physical world. If this argument succeeds,
  then the (weak) CTT is a priori, and only the (strong/physical) CTT is empirical.
  The empiricist has to concede that the weak CTT is a priori and restrict the empirical
  claim to the strong CTT, which is a narrower claim than "the CTT is empirical."

  - **The problem of falsification / what would count as a counterexample**: for the
  strong CTT to be empirical, there must be a possible observation that would falsify
  it — a physical machine that computes a non-Turing-computable function. But it''s
  unclear whether such a machine is physically possible, and whether we could ever
  verify that it computes a genuinely non-Turing-computable function (since verifying
  non-computability is itself a mathematical task). If the thesis is not empirically
  falsifiable in practice, then its "empirical" status is questionable — it might
  be more like an a priori claim that we just happen to be confident in.

  - **The idealization objection**: the Turing machine is an idealization (infinite
  tape, perfect reliability, etc.). The strong CTT says that no physical machine,
  even one that exploits quantum effects or analog dynamics, can compute beyond the
  Turing limit. But the fact that the Turing machine is an idealization cuts both
  ways: it might be that the idealization is too restrictive (and a more physical
  model would compute more), or it might be that the idealization captures the essential
  structure of computation. The empiricist has to say that the claim is about physical
  machines, not idealizations, but then the connection between the idealized Turing
  machine and physical machines is itself an empirical claim — which is fine, but
  it means the "thesis" is really a bundle of claims (the a priori weak CTT + the
  empirical claim that physical machines are Turing-computable).

  - **The "no counterexamples found" problem**: the fact that we''ve never found a
  physical hypercomputer is evidence for the strong CTT, but it''s also consistent
  with the a priori view. The empiricist wants the CTT to be an empirical claim that
  we''ve confirmed by observation, but the absence of counterexamples is not the same
  as positive confirmation — it''s just the absence of disconfirmation. This is weaker
  than the empirical status the empiricist wants.

  - **What defenders would concede**: a defender of the empiricist view would concede
  that the weak CTT (about abstract effective procedures) is a priori or stipulative,
  and that the empirical claim applies only to the strong/physical CTT. They would
  also concede that the strong CTT is not easily falsifiable in practice. But they
  would argue that this is fine — many laws of nature (e.g., conservation laws) are
  not easily falsifiable in practice, and the strong CTT is still a substantive empirical
  claim in principle.

  - **Whether the position is insulated**: the empiricist position risks being "qualified
  into unfalsifiability" — if the strong CTT is not empirically falsifiable in practice,
  and if the weak CTT is a priori, then the "empirical" content of the CTT is very
  thin. The position might be insulated by restricting the empirical claim to a very
  narrow domain (physical machines that compute non-Turing-computable functions),
  which is a domain we have no reason to think is non-empty. If so, the position risks
  being unfalsifiable, and the question is whether that''s a problem.


