  Let me think about what the genuine technical cruxes are for Humeanism vs. anti-Humeanism
  about laws:


  1. **The "substance" / "nomic necessity" question**: Are laws of nature a distinctive
  kind of truth, or are they just (very general) regularities? Humeans: laws are truths
  about the regularity of events, no more. Anti-Humeans: laws are fundamental truths
  with a distinctive "nomic" character, governing or necessitating.


  2. **The Humean loop / counterfactual grounding problem**: Humeans (e.g., Lewis)
  ground counterfactuals in the laws (via the best-system account + the similarity
  ordering). But if laws are grounded in the regularities of events (including counterfactual
  scenarios?), there''s a circularity. The "Humean loop" is the problem that on a
  Humean view, laws are supposed to ground counterfactuals, but counterfactuals (about
  what would happen if things were different) are part of what the laws are supposed
  to be about. Anti-Humeans can ground counterfactuals in the laws without circularity,
  because the laws are fundamental and ground the counterfactuals. This is a genuine
  crux: can the Humean account ground counterfactual support without circularity?


  Actually, let me be careful. The Humean loop is a specific technical problem. Let
  me recall: On Lewis''s Humean account, the laws are the axioms of the best systematization
  of the haeccesitic facts (the particular facts about what happens). Counterfactuals
  are evaluated by considering the closest possible worlds where the antecedent holds,
  and the similarity ordering prioritizes avoiding "miracles" (violations of the laws)
  and keeping the laws the same. So the laws figure into the evaluation of counterfactuals.
  But the laws are determined by the actual facts. This is not obviously circular,
  but there''s a subtle issue: the laws are supposed to be what ground the counterfactuals
  (nomic necessity), but the laws are themselves a function of the particular facts.
  The "loop" is that the counterfactuals that the laws are supposed to support are
  partly what determine the laws (via the best-system account, which considers all
  the facts, including what would happen in nearby worlds). This is a real, technical,
  in-the-weeds problem. Good crux.


  3. **Dispositional properties (dispositionalism)**: Are properties like "being fragile"
  or "having charge" Humean (categorical, qualitative) or anti-Humean (dispositional,
  with intrinsic causal/nomic powers)? A Humean base is supposed to be a "mosaic"
  of local, qualitative, categorical properties. If some properties are genuinely
  dispositional (their identity is partly given by their causal/nomic roles), then
  the Humean base is not purely categorical, and the "Humean mosaic" is undermined.
  This is a genuine crux: is the fundamental base categorical (Humean) or can it include
  dispositional properties (anti-Humean)?


  4. **Laws in the special sciences**: Can the Humean best-system account accommodate
  the laws of special sciences (biology, thermodynamics, economics) that are not universal
  and are not reducible to fundamental physics? The best-system account is supposed
  to be level-independent, but there''s a question of whether it can capture the genuinely
  probabilistic, ceteris paribus, or non-universal laws of the special sciences. Anti-Humeans
  can treat special science laws as grounded in the fundamental laws + initial conditions.
  This is a crux.


  5. **The role of laws in explanation / the "necessitation" question**: Do laws explain
  by governing/necessitating, or by being part of the best explanation? This is partly
  verbal.


  6. **The "no-go" considerations**: Both sides might agree on certain constraints,
  e.g., that laws must be able to ground counterfactuals, that laws must be non-vacuous,
  that laws must be able to support induction. Actually, these are points of disagreement
  in how they''re satisfied.


