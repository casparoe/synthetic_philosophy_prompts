  credence in H should be your conditional credence given E, which is 1/2. But your
  current credence in H is 1. Contradiction.


  So the argument that Reflection proves too much:

  (1) Reflection: Cr(H | E) = E[Cr_E(H)].

  (2) Normalization / "what you expect your future credence to be, given that the
  future state will obtain, is your current credence": if you know E will obtain,
  then Cr(H) = Cr(H | E).

  (3) You know E will obtain (you''ll take the pill).

