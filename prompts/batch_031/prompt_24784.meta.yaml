  the standard counterexample to Reflection is:


  You are about to take a pill that will make you forget everything. You know that
  after taking it, you''ll be uncertain about H. Specifically, you know that after
  taking the pill, your credence in H will be 1/2 (because you''ll have no memory
  and be in a symmetric state). But you know now that H is true (you have evidence
