  Parfit''s nonidentity problem (from Reasons and Persons, 1984): Consider a choice
  between having a child now (in a depleted world, so the child will have a somewhat
  sub-50 quality-of-life but positive) or waiting (conserving resources, so the child
  born later would have a much better life). The child who is born now is not worse
  off than he would otherwise have been, because if we''d waited, he wouldn''t exist
  — a different child would. So on a "making someone worse off than they''d otherwise
  have been" account of harm, we haven''t harmed anyone. Yet it seems we did something
  wrong (or at least that waiting was better). This is the nonidentity problem.


  Key points:

  - The problem is that our reproductive choices are identity-affecting: which person
  comes into existence depends on our choice.

  - It creates a puzzle for consequentialist ethics: if the later child would be much
  better off, and the earlier child is not made worse off by our choice, then on a
  simple "harm" or "making worse off" account, choosing to have the child now isn''t
  worse. But intuitively, waiting is better.

  - Parfit himself was troubled by this; he thought it showed that our moral thinking
  about future people is defective, or that we need a different account of right/wrong
  that doesn''t reduce to "not making people worse off."

  - Responses: (1) accept that some actions are wrong even if they don''t harm anyone
  (a "wrong without a victim" position, which Parfit seems to lean toward); (2) argue
  that the relevant comparison class is not "this person''s alternative lives" but
  "the alternative world and its people" — i.e., a world-level comparison; (3) argue
  that there are other ways the child is harmed (e.g., relative deprivation, or that
  the child''s life is "barely worth living" in some absolute sense); (4) the "imposition"
  view — we impose a life on someone, and if that life is below some threshold, that''s
  wrong even if the person would be glad to exist.


  A common misreading: "The nonidentity problem proves that we can never harm future
  people, so we have no obligations to them." This is wrong because: (a) the nonidentity
  problem is specifically about identity-affecting choices; many of our choices affect
  which people exist but also affect people who would exist regardless (e.g., climate
  change affects people who''ll exist no matter what); (b) the problem is about the
  inapplicability of a specific "worse off than otherwise" harm account, not about
  the nonexistence of moral considerations; (c) even in the identity-affecting case,
  there are world-level or aggregate considerations.


