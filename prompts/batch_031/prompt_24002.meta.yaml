  Actually, let me reconsider. Harsanyi''s aggregation theorem (1955): if all individuals
  have von Neumann–Morgenstern utilities, and the social welfare function satisfies
  (i) cardinality (welfare judgments depend only on the utility numbers), (ii) anonymity
  (impartiality — no fixed social ordering), (iii) the "fairness" condition (the social
  preference between two social states is determined by expected utility under the
  "impartial observer" who is equally likely to be any individual — i.e., the principle
  of insufficient reason / equal prior over identity), and (iv) a weak independence/separability
  condition, then the social welfare function must be the sum of individual utilities
  (utilitarianism), with cardinal utilities fixed up to positive affine transformations.


  Key in-the-weeds details:

  - The theorem assumes vNM expected-utility preferences for individuals (so utilities
  are cardinal, defined up to positive affine transformations).

  - The "impartiality" or "fairness" assumption: the social choice is what a person
  behind a "veil of ignorance" (not knowing which person they''ll be) would choose,
  with equal prior probability over identities.

  - The conclusion: utilitarian sum, with utilities normalized (affine transformations
  must be the same for all individuals — this is the "cardinal comparability" issue:
  Harsanyi''s theorem requires interpersonal utility comparability, or rather, the
  affine normalizations are chosen to make the sum work — actually the theorem fixes
  the normalization: the sum is invariant under individual affine transformations
  only if... hmm, actually the sum of utilities is not invariant under different affine
  transformations for each person. Harsanyi''s argument: the social welfare function
  W(u1,...,un) must be a weighted sum with equal weights (anonymity forces equal weights)
  — but the affine normalization of each individual''s utility is a real issue: the
  theorem gives you the sum up to the choice of affine normalizations, and Harsanyi
  argued the normalization is determined by... there''s a genuine debate here. Sen''s
  critique: Harsanyi''s theorem assumes what it concludes / the independence condition
  is too strong; Sen''s "impartiality" critique. Also Harsanyi''s own later work (1977
  "Bayesian Decision Theory, Utilitarianism, and the Principle of Equal Rights to
  Liberty") and the "Harsanyi-Sen debate."

  - Critiques: (1) The theorem assumes interpersonal cardinal utility comparability,
  which many reject. (2) The independence/separability condition (sometimes called
  "weak Pareto" plus independence) is doing heavy lifting; Sen showed that the theorem''s
  conclusion depends on a condition that is not obviously implied by impartiality.
  (3) The "veil of ignorance" framing imports Rawlsian elements but yields utilitarianism
  — the "Rawlsian veil yields utilitarianism" irony. (4) The theorem is about preferences
  over lotteries/social states; it assumes the society as a whole has transitive preferences.
  (5) It doesn''t handle the problem of non-expected-utility maximizers.


