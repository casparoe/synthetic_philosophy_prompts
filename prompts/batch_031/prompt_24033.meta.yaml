  2. The "genome as a program" — the idea that the DNA sequence is a program that
  gets "executed" by the cell. This is a metaphor, and it''s contested. It maps onto
  "source code + interpreter/compilers," but the cell is not a deterministic interpreter,
  and the "program" is executed differently in different cell types (the same genome
  in a neuron vs. a liver cell produces different proteins) — this is like the same
  binary running on different hardware, or more like the same code being compiled
  with different flags, or the "program" being the genome + epigenetic state + environment.
  This is a great residue point: the "program" is not self-contained; the "execution
  environment" (the cell, the epigenome, the environment) is part of the program.
  This is the "extended phenotype" / "developmental system" point.

  3. The "code" vs. "program" distinction: a code is a mapping from symbols to meanings;
  a program is an instruction set. DNA is more like a data file (a code / encoding)
  than a program, because the "instructions" are distributed between the DNA and the
  cellular machinery (the ribosome, the transcription factors). So the "DNA is a code"
  claim, if it means "DNA is a program," is misleading; if it means "DNA is an encoding
  of information," it''s defensible but under-specified (an encoding of what, for
  whom, in what context?).

  4. Junk DNA / functional non-coding DNA: if most of the genome is "functional" but
  not "coding," then the "code" metaphor (coding) is too narrow. But "functional"
  is a contested term — the ENCODE controversy was partly about what "functional"
  means (biochemically active vs. selected-for). This maps onto the software distinction
  between "dead code" and "code that''s there but does nothing useful" vs. "code that''s
  load-bearing." The residue: the software concept of "functionality" is cleaner than
  the biological one, because in software you can run the program and see what it
  does, whereas in biology "function" often means "was selected for," which is a historical
  / evolutionary claim, not an operational one. This is a great residue point: the
  software vocabulary has a clean operational notion of "what the code does," but
  biology''s "function" is often a claim about evolutionary history, not current operation.

  5. Epigenetic inheritance: some traits are inherited without changes in the DNA
  sequence (methylation, etc.). This is "state" that is not in the "source code."
  In software terms, it''s like state that persists across runs but is not in the
