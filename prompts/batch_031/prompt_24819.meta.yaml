  \ on \"fifty-fifty\" variants, \"triple Beauty\" (three awakenings), cases where\
  \ you're woken up once on Monday regardless of the coin and possibly also on Tuesday,\
  \ etc. This is a good \"in the weeds\" combination. The verdicts can be concrete\
  \ and the principle sought would be something like the principle of indifference\
  \ vs. the principle of matching credence to the fraction of centerings (the thirder's\
  \ argument) vs. the principle that credences should match the pre-experiment credence\
