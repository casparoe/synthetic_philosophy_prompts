  measure. I don''t have a formal philosophy or safety-theory background, so the procedure
  has to be self-contained: define the terms it uses, and don''t assume I know the
  literature.


  The procedure should:

  1. Take a proposed control measure as input (e.g., "we will run a separate auditor
  model over the target model''s outputs and flag suspicious behavior," or "we will
  give the model a shutdown button that an operator can press, plus a tripwire that
  auto-triggers on detected deception," or "we will train an interpretability probe
  that detects ''deception-related'' activations and alert the operator").

  2. Walk through a fixed sequence of questions, each with what counts as a sufficient
  answer. The questions should probe the specific assumptions the measure relies on
  — e.g., whether the misalignment is detectable in the first place, whether the model
  knows it''s being watched and might perform differently under observation, whether
  the monitoring mechanism itself could be gamed or is as capable as the target, whether
  the measure works at the capability levels we actually deploy at, whether the measure
  creates new incentives for the model to deceive or to take power, etc.

  3. At the end, give a verdict: sufficient, insufficient (with the specific assumption
  that failed), or "this is a values question, hand it to a human" — and I want you
  to be honest about which steps are judgment calls dressed up as procedure.

  4. Mark clearly where the procedure will misfire — e.g., measures that only work
  if the model is already somewhat aligned, or measures that are so strong they make
  the model unusable.


  Then run the procedure on three concrete proposals:

  (a) A behavioral audit: a separate, smaller "auditor" model reads the target model''s
