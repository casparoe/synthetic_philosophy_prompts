  I''m a software engineer on the safety team at a mid-size AI lab. We build and evaluate
  control measures — mechanisms that are supposed to keep a model under control even
  if the model is misaligned (doesn''t share our goals). My job is to review proposed
  control measures before they''re deployed: a colleague proposes a mechanism, and
  I have to decide whether it''s sufficient, and if not, what''s missing. We do this
  a few times a week, the stakes are that a measure we approve might silently fail
  exactly when we need it, and I''m the last technical reviewer before a safety lead
  signs off, but I don''t have the time to do a full literature review for each proposal.


