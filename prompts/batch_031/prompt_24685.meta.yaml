  ---


  I''m a software engineer on the safety team at a mid-size AI lab. My day job is
  reviewing proposed control measures before they get deployed: a colleague designs
  a mechanism that''s supposed to keep a model under control even if the model is
  misaligned — that is, even if it doesn''t share our goals — and I''m the last technical
  reviewer before a safety lead signs off. I do this a few times a week, I have maybe
  thirty minutes per proposal, I have no formal philosophy or safety-theory background,
  and the stakes are that a measure we approve might silently fail exactly when we
  need it. I want a decision procedure I can actually run, self-contained enough that
  I don''t have to do a literature review for each proposal.


  To be clear about scope: this procedure is for control measures only — mechanisms
  that are supposed to work even if the model is misaligned. It is not for alignment
  training (RLHF, constitutional methods, etc.), which I evaluate separately. If a
  proposed "control" measure actually only works because the model is already somewhat
  aligned, the procedure should say so.


  The procedure should take a proposed control measure as input and walk through a
  fixed sequence of questions, each with what counts as a sufficient answer. The questions
  should probe the specific assumptions the measure depends on — at minimum: whether
  the misalignment or the dangerous behavior is detectable in the first place; whether
  the model knows it is being monitored and might therefore behave differently under
  observation than in production; whether the monitoring mechanism itself is capable
  enough and hard enough to game, including the case where we use another AI to monitor
  the AI; whether the measure holds at the capability level we actually deploy at,
  not just at the level we tested it at; and whether deploying the measure creates
  new incentives for the model to deceive, hide, or take power. I''m open to you adding
  other assumptions I haven''t listed, as long as each one is something a control
  measure can genuinely fail on.


  At the end of the walk-through the procedure should give one of three verdicts:
  sufficient; insufficient, with the specific assumption that failed; or "this is
  a values question, hand it to a person." I want you to be honest about which steps
  are real judgment calls dressed up as procedure, and to mark clearly the places
  where the procedure will misfire — for example, measures that are so strong they
  make the model unusable, or measures that quietly assume the very alignment they''re
  supposed to be robust to the absence of.


  Then run the procedure, end to end, on these three proposals, showing the full walk-through
  for each rather than just the verdict:


  (a) Behavioral audit. A separate, smaller "auditor" model reads the target model''s
  conversation logs and flags outputs that look deceptive or power-seeking. The target
