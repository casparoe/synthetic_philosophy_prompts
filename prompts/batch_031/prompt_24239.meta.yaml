  UDT (Updateless Decision Theory), as developed by Eliezer Yudkowsky (2010, "Updateless
  Decision Theory") and discussed in the LessWrong / AI alignment literature:


  Core idea:

  - Standard decision theory (e.g., causal decision theory, evidential decision theory)
  tells you to: form beliefs about the world (update on evidence), then choose the
  action that maximizes expected utility given those beliefs.

  - UDT''s key insight: in some situations, your action is logically correlated with
  the outcome, not just causally. For example, in Newcomb''s problem, the predictor''s
  prediction is correlated with what you''ll do because it''s a prediction of your
  decision process. If you update on the observation "the box is full," you might
  think "great, I should two-box to get both," but that''s wrong because the box being
  full is a consequence of the predictor predicting that you''d one-box, which is
  a consequence of your decision algorithm being a one-boxer.

  - UDT''s solution: instead of "update on evidence, then choose the action that maximizes
  expected utility," UDT says: consider your decision function (the function that
  maps inputs to outputs, i.e., your decision-making algorithm). Ask: "If my decision
  function were X, what would the expected utility be?" Choose the X that maximizes
  expected utility. You don''t "update" on the observation in the usual Bayesian sense;
  instead, you reason about the decision function directly.

  - In Newcomb''s problem: UDT agent considers the policy "one-box" and the policy
  "two-box." If the policy is "one-box," the predictor (accurately) predicts one-boxing,
  so the box is full, and the agent gets $1,000,000. If the policy is "two-box," the
  predictor predicts two-boxing, so the box is empty, and the agent gets $1,000. So
  the "one-box" policy has higher expected utility, and the UDT agent one-boxes.

  - The "don''t update" framing: a common (but misleading) caricature is that UDT
  says "don''t update your beliefs." This is misleading because UDT isn''t about suspending
  Bayesian updating in general; it''s about recognizing that in certain situations,
  the right move is to reason about the decision function rather than to update on
  the observation and then choose. The observation is a function of your decision
  algorithm, so updating on it is circular / doesn''t add information.


