  In UDT, the decision procedure is:

  1. You have a decision function f (a mathematical function that maps inputs to actions).

  2. You consider counterfactual decision functions f'' (alternative versions of f).

  3. For each f'', you compute the expected utility of the world if your decision
  function were f''.

  4. You choose the f'' that maximizes expected utility, and then act according to
  f''.


