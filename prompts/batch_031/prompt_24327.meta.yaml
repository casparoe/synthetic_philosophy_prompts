  treat its own credences as evidence, which creates problems (e.g., in the preface
  paradox, the agent assigns probability <1 to each book in her encyclopedia being
  error-free, but RP seems to require...); (3) there''s a formal issue: P(A | P(A)
  = p) is a conditional on a proposition about the agent''s own credences, and it''s
  not clear that this conditional probability is well-defined or that it''s the right
  object; (4) the connection to "should" vs. "is": RP is a normative claim about what
  the conditional credence should be.


