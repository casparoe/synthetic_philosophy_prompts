  Kripke''s necessity of identity: If a = b, then necessarily a = b. A posteriori
  identities (e.g., Hesperus = Phosphorus, water = H2O) are necessary truths known
  a posteriori. The two-dimensionalist (Chalmers) explains the a posteriori character:
  the primary intensions (a priori senses) of "Hesperus" and "Phosphorus" are different
  ("the brightest thing in the evening sky" vs. "the brightest thing in the morning
  sky"), so the identity is not knowable a priori; but the secondary intensions (rigid
  designators) pick out the same object (Venus), so the identity is necessary. So
  a posteriori ≠ contingent. A student who says "a posteriori identities can be false
  in other possible worlds" is wrong. Confirmed.


