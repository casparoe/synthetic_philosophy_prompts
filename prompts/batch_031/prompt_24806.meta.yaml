  Let me settle the correct structure of Chalmers''s zombie argument (from "The Conscious
  Mind" and "Facing Up to the Problem of Consciousness"):

  - Premise 1 (conceivability): It is (a priori) conceivable that there are physical
  duplicates of us without phenomenal consciousness (zombies).

  - Premise 2 (conceivability-possibility link / KK): A priori conceivability entails
  metaphysical possibility. (Chalmers argues for this via the two-dimensional framework:
  the primary intension of the description that conceives the zombie is possible,
  and this grounds metaphysical possibility.)

  - Premise 3 (identity and necessity): If zombies are possible, then phenomenal states
  are not identical to physical states (because, by the necessity of identity (Kripke),
  if they were identical, the zombie world would be impossible; or: identity would
  be necessary, so the absence of consciousness in a physical duplicate would be impossible).

  - Conclusion: Physicalism (at least type identity / type B physicalism) is false.


