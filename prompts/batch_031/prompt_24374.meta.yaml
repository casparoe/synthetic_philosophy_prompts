  This is a real, in-the-weeds debate. There are known objections:

  1. **The "Dutch book" arguments assume you can trade at the prices implied by your
  credences, and that you''ll be offered the bets.** In reality, you might not have
  access to the market, or the market might not offer the relevant bets. So Dutch
  bookability is a *theoretical* vulnerability, not a *practical* one. (Objection:
  the "market access" / "practical" objection.)

  2. **The Dutch book argument is "too strong" / "too weak":** It rules out some credences
  that are intuitively fine, or fails to rule out some that are intuitively bad. E.g.,
  it doesn''t rule out *miscalibrated* credences (you can be coherent but wrong).
  So coherence is not the same as accuracy.

