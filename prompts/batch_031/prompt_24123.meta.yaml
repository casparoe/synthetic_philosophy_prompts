  I work on robustness for ML systems and I''m frustrated by how the worst-case vs.
  average-case debate in the alignment/robust-ML world has been going in circles for
  years. Roughly: one camp says we should optimize worst-case performance — minimax
  over a set of plausible environments, adversarial training, distributionally robust
  optimization — because the deployment environment is at least partly adversarial
  (the model gets attacked, specification-gamed, or deployed out of distribution)
  and because tail failures are catastrophic, so you can''t afford to average them
  away. The other camp says worst-case thinking is a dead end: you can''t specify
  the set you''re taking the worst over without either making it so small that the
  guarantee is vacuous or so large that the optimal policy is do-nothing (the pessimism
  problem), the formal bounds you get are usually loose to the point of uselessness,
  and empirically adversarial training buys you some robustness but doesn''t transfer
  out of distribution, so you''re paying a clean-accuracy tax for a guarantee you
  can''t state anyway. Meanwhile the average-case people just do standard training,
  maximize expected performance, and argue that risk should be managed separately
  via evaluation, monitoring, and tail-specific mitigations. Both sides keep producing
  results and neither side is convinced, and I''ve watched this argument repeat itself
  in different venues for, what, five or six years now.


