  the analogy is used to license the conclusion "therefore we need a global government
  / carbon tax / regulation." Does this conclusion survive? The conclusion might survive,
  but not from the analogy — the actual argument for regulation of climate change
  rests on the public-good / externality structure (free-riding on abatement), not
