  rationally adds cattle. Where it breaks: (1) the pasture''s carrying capacity is
  visible to the herders and degrades in a way they can see (grass goes brown); the
  atmosphere''s "carrying capacity" (tipping points, feedback loops) is invisible
  and uncertain — the herders in Hardin''s story can see the grass dying; (2) Hardin''s
  herders are many small actors; actual emissions are dominated by a few large firms
  and a few nations — this is closer to a cartel / oligopoly problem than a tragedy
  of many; (3) the commons has a defined set of users who share it; the atmosphere''s
  "users" include future generations who can''t participate in the game — this changes
  the strategic structure (it''s not a symmetric game); (4) the pasture is rivalrous
  (one herder''s cow eats grass another can''t); CO2 in the atmosphere is... actually,
  CO2 is non-rivalrous as a pollutant? No — the capacity of the atmosphere to absorb
