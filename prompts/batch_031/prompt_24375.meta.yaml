  For Kelly betting, the "camps" are: the log-optimalists (Kelly purists), the fractional-Kelly
  / risk-averse camp, the expected-utility maximizers (who may use a different utility
  function), the "ergodicity" camp (time-average maximizers, e.g., Smerlak & Hartmann,
  or the "ergodic economics" people like Ellis, Zapperi), the Bayesian learning camp
  (fractional Kelly under uncertainty). Genuine tensions:

  1. Asymptotic growth optimality vs finite-horizon / one-shot behavior.

  2. Myopic optimality (the strategy is optimal at each step given current information)
  vs global optimality (the strategy that maximizes the expected utility of the terminal
  wealth over the whole horizon) — for log utility and known probabilities these coincide
  (Kelly is myopic and log is consistent across time), but under uncertainty they
  diverge.

  3. Robustness to misspecification (the strategy should be reasonable even if the
  win probability is wrong) vs sharpness (the strategy should exploit the precise
  probability). Full Kelly is not robust to misspecification (overbetting when p is
  overestimated is catastrophic — the growth rate becomes negative).

  4. Risk neutrality with respect to the utility of wealth (log utility implies a
  specific risk aversion) vs the theory should be neutral about the decision-maker''s
  utility (the theory should say what is "objectively" rational). This is the deep
  tension: Kelly optimality is a property of the wealth process, not of the decision-maker''s
  utility; it''s "objectively" optimal in the sense that no other strategy grows faster
  in the long run, but it prescribes log utility, which many people find too risky.

  5. Detectability / testability: a theory of rational betting should make testable
  predictions about what a rational agent would do; but if rationality is utility-relative,
  there are no testable predictions.

  6. The ergodicity desideratum: the theory should distinguish between ensemble averages
  and time averages; a strategy that maximizes the ensemble average of log wealth
  is the same as one that maximizes the time-average growth rate (for Kelly, the two
  coincide asymptotically), but a strategy that maximizes the ensemble average of
  wealth (not log) is not rational in the time-average sense. This is a genuine in-the-weeds
  point: the "expected wealth" maximizer goes all-in every time (if there''s a positive
  edge), which is "rational" in the ensemble sense but leads to almost-certain ruin
  in the time sense.


