  Now, the philosophical point. The key distinction (from Ned Block, "A Defense of
  the Access Theory of ''Phenomenal Consciousness''" and "Phenomenal Consciousness
  and Access Consciousness" (2003)):

  - Access consciousness: information is globally available for use in reasoning,
  reporting, controlling action, etc.

  - Phenomenal consciousness: there is "something it is like" to have the experience
  (qualia).

  - The split-brain case: the right hemisphere has a visual experience (phenomenal),
  but the left hemisphere (and thus the verbal report) has no *access* to it. So there''s
  a division of *access*, not necessarily of *phenomenal* consciousness.

