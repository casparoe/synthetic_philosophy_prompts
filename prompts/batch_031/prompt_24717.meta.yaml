  govern the entire far future, so it''s enormously important.

  - The "infinite expected value" problem: if the far future is infinitely good, then
  any action that increases the probability of that future has infinite expected value,
  making all such actions incomparable (all infinitely important).

  - The "negative future" / "the problem of the bad future": if there''s a chance
  the far future is net negative, then the calculus changes.

  - The "dominance" problem: strong longtermism implies we should give almost all
  weight to the far future, which conflicts with the intuition that helping people
  now matters.


