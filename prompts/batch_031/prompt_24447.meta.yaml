  I''ve been trying to pin down the presumption of independence that shows up in heuristic
  arguments. You know the move: estimate the density of integers satisfying several
  local conditions by multiplying the individual densities, assuming the conditions
  don''t talk to each other. It feels like a rational default: if we have no reason
  to think A and B are correlated, we should set P(A∧B)=P(A)P(B). I tried to make
  that precise with maximum entropy, and now I have an argument that the default is
  self-defeating.


  Numbered:

  (1) If an agent''s total evidence about two events A and B is exactly their marginal
  probabilities, then the least biased joint distribution is the independent one,
  so the agent should assign P(A∧B)=P(A)P(B).

  (2) If a default rule is good in some epistemic state, it should be good whenever
  the agent can legitimately represent the state as having only that information.

  (3) For any pair of events with known marginals, the agent can legitimately represent
  the state as having only the marginals, by simply not using any further structural
  information about how A and B are connected.

  (4) Therefore, for any pair of events, the presumption of independence says the
  agent should assign the product probability.

  (5) But there are familiar pairs where the marginals are known and the conjunction
  is clearly not product, e.g. in a standard deck, A = the card is red, B = the card
  is a heart. P(A)=1/2, P(B)=1/4, P(A∧B)=1/4, not 1/8.

  (6) So the maximum-entropy formalization of the heuristic independence default proves
  too much: it would make rational agents assign the wrong probabilities in trivial
  cases.


