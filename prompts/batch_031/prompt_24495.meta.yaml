  The diagnosis: the flaw is in (6)–(7): the inference from "I can''t kill my grandfather
  (in this history)" to "the laws of physics forbid it." The correct reading of (5)
  is not "the laws forbid the killing" but "the killing doesn''t occur in this history"
  — i.e., (5) is a statement about a particular maximal history, not a statement about
  the laws. The "can''t" in (5) is a "can''t-in-this-history" (the killing is inconsistent
  with the full description of the history, including my having come from the future),
  not a "can''t-by-laws." And (8) is actually true, and that''s exactly why the reading
  of (5) as law-based fails: the laws are the same in both histories; what differs
  is the boundary condition / the global history. In the time-travel history, my having
  come from the future is part of the past of the moment I arrive, and given that
  boundary condition, the killing doesn''t happen — not because the laws forbid it,
  but because the initial (boundary) conditions determine a history in which the gun
  jams. The gun jamming is a law-governed event; the laws don''t change; the history
  does.


  So the step that goes wrong is (6)/(7): the move from "this action is impossible
  in this history" to "the laws forbid this action." And the cost of the alternatives:
  if you keep (7) (law-based forbiddance), you get (8)–(11) and must give up time
  travel, or give up (8) and accept history-dependent laws (which is incoherent or
  at least gives up what makes laws laws). If you reject (6)/(7), you accept the "block"
  reading: the paradox is resolved by a global constraint on histories, and "can''t"
  means "inconsistent with the actual maximal history." And there''s a further cost:
