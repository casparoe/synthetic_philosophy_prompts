  Even more in the weeds: the distinction between "static" and "dynamic" Dutch books.
  A static Dutch book is a set of bets on a single set of propositions where the agent''s
  credences sum to more than 1 (or less than 0). A dynamic Dutch book involves the
  agent updating on evidence and the bookmaker exploiting the update rule. The claim
  is that the probability axioms are required to avoid a static Dutch book, and the
  conditionalization rule is required to avoid a dynamic Dutch book. But there''s
  a subtlety: the dynamic Dutch book argument for conditionalization assumes the agent
  commits in advance to the update rule. If the agent doesn''t commit, the argument
  doesn''t go through. Also, there are "Dutch book" arguments for specific update
  rules (e.g., Jeffrey conditioning, or the "rule of revision") and the debate about
  whether conditionalization is the unique rule that avoids dynamic Dutch books.


