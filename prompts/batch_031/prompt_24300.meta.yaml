  Option 1: Dutch book arguments + "position and what would count against it." Dutch
  book arguments are a nice "in the weeds" area. The standard view: Dutch book arguments
  show that if your credences violate the probability axioms, you''ll be guaranteed
  to lose money on a set of bets. But there are subtle issues: (a) whether Dutch bookability
  requires dynamic vs. static violations; (b) whether the Dutch book argument proves
  that the axioms are rational, or just that violating them is "costly" in a particular
  sense — the "Dutch book argument" literature (e.g., Jeffrey, Skyrms, Levi, Ramsey)
  has debates about whether the argument is normative or descriptive, whether "guaranteed
  loss" is the right badness, whether the bets must be individually acceptable (the
  "acceptability" assumption — each bet in the book must be one the agent would rationally
  accept separately, e.g., positive expected utility given their credences), and whether
  the agent can decline bundles. Also the issue of whether Dutch book arguments work
  for non-Archimedean or finitely additive credences, or for "partial belief" or supervaluationist
  logics. There''s also the issue of whether Dutch book arguments prove coherence
  is required, or merely that incoherence has a price — and whether the "price" argument
  is genuinely normative (the "cost" objection: losing money isn''t itself irrational,
  unless you value money in the relevant way). Also the "no Dutch book" theorem for
  certain logics (e.g., the lottery paradox, or for certain non-classical logics —
  there are "Dutch book" style arguments for logical omniscience and the debate about
  whether a logically omniscient agent can be Dutch-booked).


