  nor Dev thinks you should actually wire the money, but they disagree about *why*
  the standard "just compute the expected value and you''ll see it''s enormous, so
  pay" argument fails, and about what the case shows about expected utility theory.
  I''m reporting their exchange roughly; they each made about four moves.


  (1) Mara: The expected-value argument is a calculation error, not a real argument.
  The probability that this particular emailer is a genuine simulation operator with
  the power they claim is tiny, and a tiny probability times a finite harm is a small
  expected value — far smaller than $100. Expected utility theory is perfectly well-behaved
  here; it just says don''t pay. People who say "the expected value is infinite, so
  pay" are making an arithmetic mistake.


  (2) Dev: That only works because you''ve quietly assumed the harm is finite. If
  the threat were genuinely infinite — say, eternal suffering rather than a century
  — then any nonzero probability of the claim being true multiplies to infinite expected
  disutility, and no amount of "smallness" in the prior can offset an infinity. A
  probability of 10 to the minus 100 times infinity is still infinity. So the "tiny
  prior" defense only works if you can assign probability zero, and you can''t assign
  probability zero to a logically possible claim. The real lesson of the mugging is
  that expected utility theory is ill-defined for unbounded utilities. It''s a flaw
  in the theory, not a calculation error.


  (3) Mara: You''re not entitled to just switch the stakes to infinite to make your
  point. A mugger''s word for "eternal" isn''t a mathematical claim; it''s rhetorical
  inflation. The charitable, evidentially supported reading is that the harm is finite
  (a century, a millennium, some large but finite number). On that reading, the small-prior
  defense works, and expected utility is fine. And there''s a second, independent
  reason the prior is small: the very *method* of the mugging is evidence against
  the claim. A being that could inflict a century of suffering on an innocent could
  also create a hundred-dollar bill or read your bank account; the fact that it''s
  begging you for money instead of just taking it or making it appear is positive
  evidence that it lacks the powers it claims. So the mugging is self-undermining,
  and the probability is driven down further still.


  (4) Dev: The method argument only works against a mugger who has *both* the power
  to harm and the power to create or take money. A mugger whose power is only to punish
  — an afterlife demon, a being who can''t touch the material world but can torment
  you after death — passes the method test with flying colors, because for such a
  being mugging is the *only* option. So the method argument doesn''t generalize.
