  for some muggers, it never drives it to zero, and if the stakes are even moderately
  large, a nonzero prior times a large harm can still exceed $100. You''d need the
  prior to be smaller than the ratio of the cost to the harm, and it''s not clear
  we''re entitled to a prior that small. So the method argument doesn''t rescue you;
  it just moves the question to "how small is the prior really?"


