  Known failure modes of debate (from the literature):

  1. **Collusion**: Both debaters (trained together) converge on the same answer /
  strategy, so debate doesn''t help.

  2. **The judge problem**: The judge (human or AI) is less capable than the debaters,
  so it can''t evaluate the arguments well.

  3. **Deception / obfuscation**: A debater presents arguments that are persuasive
  but misleading.

  4. **Incomplete arguments**: A debater withholds part of their reasoning, so the
  judge can''t evaluate it.

  5. **The "both are right" problem**: Both debaters can present correct arguments
  that lead to different conclusions.


