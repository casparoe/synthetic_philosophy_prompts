  The smoking gene problem (sometimes called the "Newomb-like" or "correlative" problem,
  or the "gene for smoking" problem): You have a gene that both (a) causes you to
  smoke and (b) causes you to get lung cancer. You can''t change the gene. You''re
  offered a choice: smoke or don''t smoke. The one-boxer / evidential decision theorist
  says: if you smoke, that''s evidence you have the gene, so you''ll get cancer; if
  you don''t smoke, that''s evidence you don''t have the gene, so you won''t get cancer.
  So don''t smoke. But wait — everyone agrees you should smoke in this case (or at
  least, the causal decision theorist says the gene is a common cause, not something
  you can influence by your choice, so you should just smoke because smoking is pleasurable
  and the gene is fixed). Actually, the standard resolution is that in the smoking
  gene case, there''s no "choice" that affects the outcome — the gene is fixed, and
  your action of smoking doesn''t cause the cancer, the gene does. So the dominance
  argument applies: smoking gives you the pleasure, and the cancer is determined by
  the gene regardless. So you should smoke.


  The contrast with Newomb''s problem: in Newomb''s problem, your choice of one-boxing
  vs. two-boxing is what the predictor uses to make its prediction. So there''s a
  "causal" (or at least, decision-theoretically relevant) connection between your
  choice and the outcome. In the smoking gene case, your choice doesn''t affect the
  gene. So the two cases are different.


