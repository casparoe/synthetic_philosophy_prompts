  Setup: A reader of Williams''s "A Critique of Utilitarianism" and "one thought too
  many" — a small study group / two friends at a philosophy seminar. Let''s make it
  two friends, Marta and Daniel, discussing Williams''s two related but distinct moves.


  Round 1 — Marta: Williams''s integrity objection shows utilitarianism can''t accommodate
  integrity: the agent''s projects and attachments have to matter as such, and any
  theory that requires you to step outside yourself and calculate is alienating. And
  "one thought too many" proves the point: the moment you ask, "Is this reason still
  a reason once I''ve checked it against the overall scheme?" you''ve lost what makes
  it your reason.


  Round 2 — Daniel: But wait, these are different points and Williams is conflating
  them. The integrity objection is about the *content* of the theory — it gives you
  a wrong answer about what to do (make you abandon your project). "One thought too
  many" is about *reasons* — about whether you need an external, theory-confirming
  thought for a reason to be yours. You can reject utilitarianism over integrity without
  endorsing anything about the internal/external reason debate.


  Round 3 — Marta: But they''re connected precisely at the "step outside yourself"
  move. Williams''s point about the "one thought too many" — that Smith doesn''t need
  to think "I am the kind of person who keeps promises" in order for keeping a promise
  to be a reason — is exactly what makes integrity possible. Integrity requires that
  your reasons be yours, and yours means they don''t need external validation. So
  the integrity objection depends on the internalist point about reasons. Without
  it, "integrity" is just an unexplained preference that the utilitarian could happily
  count as a desire to be satisfied.


  Round 4 — Daniel: That''s the wrong way to look at it. The utilitarian *can* count
  the desire to be loyal, and counting it doesn''t destroy loyalty. The problem for
  Williams isn''t that utilitarianism counts your desires; it''s that in the hard
  cases it tells you to act against your projects — and what makes that bad is not
  a fact about reasons but a fact about the kind of life: a life in which your projects
  can be sacrificed at any moment is a life without integrity. You can say that without
  any internalism about reasons. The "one thought too many" argument is doing work
  in a different debate (Humean vs. anti-Humean) that the integrity objection doesn''t
  need.


  Round 5 — Marta: But then the integrity objection gets weaker. If the cost of integrity
  is just "your projects can be sacrificed," that''s just a welfare claim — that the
  life in which projects get sacrificed is worse for you — and the sophisticated utilitarian
  could simply weigh that welfare cost and sometimes let the projects stand. So the
  objection collapses into a disagreement about weights, not into a genuine incompatibility.
  Only the "one thought too many" point gives integrity a structural, non-eliminable
  status.


  Round 6 — Daniel: That''s actually the utilitarian''s best reply, and Williams knew
  it. The move to "just count the welfare cost of losing your projects" is precisely
  what makes the objection look like a dispute about weights — but Williams''s answer
  is that some projects aren''t satisfiable by being "counted": to be a project, it
  has to be yours, and the moment its survival depends on its utility score, it has
  already ceased to be the project. So the "just weigh it" move is precisely what
  destroys integrity. It''s not a weight dispute.


