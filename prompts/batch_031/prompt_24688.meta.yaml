  Let me think about what a genuinely in-the-weeds, open, tractable question in the
  problem of universals would be:


  1. Compresence and "many-one": the standard argument: two objects can be red at
  the same time (compresence), so redness is one thing shared by many → universal.
  The trope theorist''s reply: there are many tropes, each in its own object; the
  objection "many-one" (a single object has many tropes) is the mirror image. Some
  people (e.g., the "bundle" theorist) say the argument from compresence only establishes
  that redness is "one over many" in a weak sense, or that it begs the question by
  assuming that "F-ness" refers to a single entity. In-the-weeds question: does the
  argument from compresence really require an inference from "many objects are F"
  to "there is one entity F-ness shared by all of them," or does it presuppose a particular
  semantics of abstract noun formation? This is a real debate (e.g., discussions by
  E.J. Lowe, Mark Johnston, and "the argument from division" for tropes).


  2. The problem of universals as a problem about the relation between particulars
  and properties: the "exemplification" relation and its own ontological status (the
  "problem of the relation" — regress: does the relation of exemplification itself
  need to be a universal or a trope? This is a version of the "third man" / relation-regress
  problem). In-the-weeds: whether the regress against exemplification is fatal to
  trope theory or to Aristotelian realism, or whether it can be stopped by a "primitive"
  or "internal" relation. This is genuinely contested and in-the-weeds.


  3. Universals and the problem of the many (the "heap" of parts of an object — e.g.,
  is a hand part of a person? — and how that interacts with the "one over many" problem).


  4. Nominalism about properties and the semantics of "is F": can a nominalist explain
  why "Socrates is wise" and "Plato is wise" share a "truth condition" without a universal?
  The "truth condition" itself seems to be a universal. This is a real in-the-weeds
  problem (related to the "problem of the many" for truth conditions, and to Quine''s
  "there is no such thing as a property").


