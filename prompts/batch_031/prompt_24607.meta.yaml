  Let me think about the real in-the-weeds tensions in the norms-of-assertion literature:


  1. The tension between the knowledge norm and the "truth norm": If the norm is truth
  (assert p only if p), then the knowledge norm is too strong (it forbids asserting
  truths you don''t know). If the norm is knowledge, the truth norm is too weak (it
  allows asserting falsehoods you believe). There''s a genuine puzzle: which is the
  *constitutive* norm?


  2. The tension between the knowledge norm and the "reasons" norm / "evidence" norm.
  Some argue the real norm is about having adequate evidence/reasons.


  3. The tension between the knowledge norm and the "no false belief" norm (assert
  p only if you don''t believe ~p).


  4. The "explanatory" tension: the knowledge norm is supposed to explain the norm
  of *questioning* (you may ask whether p only if you don''t know p) and the norm
  of *answering*. There''s a puzzle about whether the knowledge norm for assertion
  is independent or derivative from a norm for inquiry.


  5. The tension with "pragmatic encroachment": if knowledge is pragmatically encroached,
  then the knowledge norm makes assertion norms context-sensitive in a way that''s
  controversial.


  6. The "Moore''s paradox" tension: the knowledge norm is motivated by Moore''s paradox
  ("p is true but I don''t know p" is absurd). But there are "Moorean" sentences that
  are absurd for reasons unrelated to knowledge (e.g., "p is true but I don''t believe
  p" — this is the standard Moore sentence). The question is whether the absurdity
  tracks knowledge or belief. If "p but I don''t believe p" is Moorean but "p but
  I don''t know p" is also Moorean, which norm does the absurdity support?


