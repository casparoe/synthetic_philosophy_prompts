  The PMI (Bird 1984, Putnam 1978):

  - Past: Many successful scientific theories (phlogiston, caloric, ether, luminiferous
  aether, corpuscular theory of light, etc.) were empirically successful but had false
  ontologies.

  - Induction: Our current successful theories (QFT, GR, etc.) probably also have
  false ontologies.

  - Conclusion: We should be anti-realists (or at least not confident realists) about
  the unobservable entities posited by our current theories.


  Realist responses:

  1. **Deny the premise**: The past theories weren''t really that successful, or their
  "ontologies" weren''t really false (e.g., the electron in the old theory is the
  same as the electron in the new theory — "entity continuity"). This is the "continuity
  of entities" response.

  2. **Selective realism / entity realism** (Hacking): Be realist only about the entities
  that we can manipulate ("entities are real if we can spray them with"), agnostic
  about the rest. This concedes the PMI for the theoretical posits but not for the
  manipulable entities.

  3. **Abstraction / structural continuity** (Psillos, or the "abstraction" response):
  What''s preserved across theory change is the abstract mathematical structure, not
  the entities. So even if the entities change, the structure (which captures the
  real features) is preserved. This defuses the PMI by saying "the PMI is about ontologies,
  but what''s really preserved is the structure, and the structure is continuous."

  4. **No miracles argument**: The success of science is a miracle unless the theories
  are (approximately) true. This is the best realist argument, independent of the
  PMI.

  5. **The PMI is a fallacy / not the right framework**: The PMI relies on induction,
  but induction is not the right framework for theory choice. Or the PMI''s "success"
  criterion is too weak (empirical success ≠ the kind of success that warrants realism).


