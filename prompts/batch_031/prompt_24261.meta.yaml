  I think a strong candidate is: Church-Turing thesis epistemic status + explain type.
  In-the-weeds conceptual issue: distinguish the following:

  1. The thesis as a mathematical theorem (Church''s theorem: the class of effectively
  calculable functions = the class of recursive functions) — this is a theorem given
  an analysis of "effective calculability," not a thesis.

  2. The Church-Turing thesis as a claim that effective calculability (whatever that
  notion is) is captured by Turing machines/recursive functions — the "intensional"
  part, the identification of the intuitive notion with the formal one, which is not
  strictly a priori provable but is supported by the convergence of multiple formalisms.

  3. The Church-Turing thesis as a physical/empirical claim: that any physically realizable
  computation is Turing-computable (the "physical Church-Turing thesis" or Church-Turing-Deutsch
  thesis) — this is an empirical claim, in principle falsifiable (e.g., hypercomputation,
  quantum computation doesn''t refute it because quantum computation is Turing-computable...
  wait, quantum computers compute exactly the class of Turing-computable functions,
  just faster. So quantum mechanics doesn''t refute the CTC. What could refute it:
  analog hypercomputation, or a physical system whose outputs are non-recursive functions,
  e.g., solving the halting problem physically).

  4. The "strong" version: that the universe is a universal Turing machine (computational
  universe), or that all physical processes are computations — a metaphysical claim.

  5. There''s also the "Church-Turing thesis as a claim about the limits of the human
  mind" (Lorentz''s "Turing''s principle"? Actually, the claim that the human mind
  can only compute recursive functions — Turing''s own view vs. Penrose).


  Epistemic status:

  - Mathematical part: a priori, theorem.

  - Intensional identification: a priori but not deductively provable; its justification
  is the convergence of independent formalizations (Church, Turing, Kleene, Post,
  Markov, etc.) plus the fact that the intuitive notion is pre-formal. Some philosophers
  (e.g., Copeland) argue that the thesis is partly empirical: Turing''s argument that
  the machine model captures "effective procedure" relies on an analysis that involves
  empirical/psychological claims about what a human can do in a finite procedure (the
  "machine model" argument in his 1936 paper is partly about what a human calculator
  can do — Turing''s original argument was that a human computing a function is, up
  to a bound on the size of symbols they can distinguish, equivalent to a finite-state
  machine). So the epistemic status is hybrid: a priori mathematical core + an empirical/psychological
  premise about the limits of human attention (Turing''s "finite configurations").

  - Physical CTC: empirical, in principle falsifiable, but no known falsifier; the
  quantum case is a red herring (quantum computation ⊆ recursive).

  - There''s also the distinction between the "extensional" thesis (same input-output
  functions) and the "intensional" thesis (the same processes/algorithms).


