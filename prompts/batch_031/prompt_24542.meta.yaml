  Now let me think about the specific cases and the principle. The core tension in
  causation by omission:


  The basic puzzle: A cause is usually something that makes a difference. But an omission
  is the absence of something. How can an absence make a difference? And why is THIS
  omission a cause when there are infinitely many other omissions that aren''t?


  Key sub-issues:

  1. Counterfactual dependence: An omission O causes outcome O'' if, had the agent
  performed the act, O'' would not have occurred. But this over-generates — I didn''t
  do a million things that would have prevented O''.

  2. The "normalcy" or "expectation" condition: An omission is a cause only if the
  agent was expected/ought to have acted. This is the "normative" account (e.g., the
  idea that omissions are causes only relative to a background of what was expected).

  3. The causal-mechanism account: Omissions cause only when there''s a causal mechanism
  that would have been activated by the act (e.g., pressing the button would have
  sent a signal). This is the "causal process" or "interventionist" account.

  4. Preemption / redundancy: If someone else would have acted anyway, does my omission
  cause the outcome? (I didn''t save the drowning child, but a lifeguard would have
  pulled the child out.) This is a big one.

  5. The "all-or-nothing" problem: In some cases, the omission seems clearly causal
  (the doctor who withholds a known cure), in others it seems not (the stranger who
  doesn''t save a drowning person when there are many others who could).


  Let me design the cases so that they create genuine tension:


  Case A: A doctor has a patient who will die in an hour unless given a specific antidote.
  The doctor has the antidote but deliberately doesn''t give it. The patient dies.
  — Intuition: the doctor''s omission clearly caused the death. (This is like the
  "killing by omission" case, and it''s often said to be morally on par with killing.)


