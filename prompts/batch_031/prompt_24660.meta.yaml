  The residue:

  - The philosophical demandingness objection is about whether the theory is *morally*
  too demanding — i.e., whether it''s a defect of the theory that it requires so much.
  The rationalist framing often treats this as a *practical* question (can I do it?
  what''s my EV?) rather than a *theoretical* one (is it a defect that the theory
  demands this?).

  - The integrity objection (Williams) is about the loss of meaning of one''s actions
  — this doesn''t map onto EV at all. In EV terms, "meaning" is not a quantity that
  can be aggregated. So the integrity objection has no clean counterpart in the rationalist
  vocabulary.

  - The separateness-of-persons objection is about whether it''s legitimate to aggregate
  across persons. In EV terms, this is a question about whether you''re allowed to
  sum utility across different people. This does have a counterpart (the "aggregation"
  question), but the philosophical point is more subtle — it''s not just about the
  math, it''s about the moral status of the aggregation.

  - Supererogation: In philosophy, some acts are "beyond the call of duty" — praiseworthy
  but not required. In the rationalist/EV framing, there''s no clean counterpart:
  if an act has positive EV, you should do it (or at least there''s no reason not
  to, all else equal). The distinction between "required" and "supererogatory" doesn''t
  map cleanly.

  - "Ought implies can": The philosophical objection that a theory that requires the
  impossible is defective. In the rationalist framing, this maps onto "feasibility
  constraints" — but the philosophical point is about the *moral* requirement, not
  just practical feasibility.


