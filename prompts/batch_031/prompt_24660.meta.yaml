  Now let me think about the specific philosophical content to make this "in the weeds."


  The demandingness objection has several related but distinct forms:


  1. **The basic demandingness objection**: Consequentialism is too demanding because
  it requires agents to sacrifice their own interests (and the interests of their
  loved ones) whenever doing so would produce a better overall outcome. A moral theory
  that demands this much is not a viable moral theory.


  2. **The integrity objection** (Williams): Consequentialism fails to respect the
  agent''s "personal projects" — the commitments, relationships, and activities that
  give their life meaning. By requiring the agent to treat these as mere instruments
  for maximizing the good, consequentialism strips their actions of their meaning
  for them. This is not just a practical cost; it''s a loss of the kind of self that
  makes moral action meaningful.


  3. **The separateness-of-persons objection** (Rawls, Scanlon): Consequentialism
  aggregates utility across persons as if they were a single entity. This fails to
  respect the separateness of individuals — the fact that each person''s welfare matters
  in their own right, not just as a contributor to the total.


  4. **The supererogation objection**: Consequentialism has no room for supererogatory
  acts — acts that are praiseworthy but not required. If you should do whatever maximizes
  the good, then there''s no such thing as "going beyond the call of duty."


  5. **The "ought implies can" objection**: Consequentialism sometimes requires agents
  to do what they cannot do (e.g., to save every possible life). A moral theory that
  requires the impossible is defective.


  Now, the rationalist/EV vocabulary:


  - Expected value: the expected value of an action, computed by weighting outcomes
  by their probability and value.

  - Marginal dollar: the expected value of your next dollar given to charity, compared
  to its value to you.

  - Cost-effectiveness: the ratio of cost to benefit (e.g., cost per life saved).

  - The "shallow pond" argument: if you can save a child''s life at the cost of ruining
  your shoes, you should do it; by extension, you should give until the marginal dollar''s
  value to you equals its value to charity.

  - Discounting: reducing the weight of future outcomes.

  - Moral uncertainty: when you''re not sure which moral theory is correct, you weight
  your actions by the probability of each theory.

  - Satisficing vs. optimizing: choosing an action that''s "good enough" vs. choosing
  the best possible action.

  - Feasibility constraints: the practical limits on what you can do.


  Now, the residue report:


  - The basic demandingness objection: In EV terms, this is "the EV of giving is greater
  than the EV of keeping, so you should give." The philosophical objection is that
  this is *too much to demand morally*. In EV terms, there''s no clean counterpart
  to "too much to demand morally" — EV just tells you what to do. The philosophical
  point is about the *moral status* of the requirement, not the size of the number.
  So this translates only with distortion: the rationalist framing treats it as a
  practical question (can I afford to give?), while the philosophical objection is
  a theoretical one (is it a defect of the theory that it demands this?).


  - The integrity objection: This is about the loss of meaning of one''s actions.
  In EV terms, "meaning" is not a quantity that can be aggregated. So the integrity
  objection has no clean counterpart in the rationalist vocabulary. The rationalist
  might try to model "meaning" as a kind of utility (the utility of having a meaningful
  life), but this misses the point: the integrity objection is not that meaning has
  low utility, it''s that consequentialism *cannot represent* the kind of value that
  personal projects have. So this is a case of something that cannot be expressed
  in the target vocabulary at all.


  - The separateness-of-persons objection: In EV terms, this is "should I sum utility
  across persons?" The rationalist framing has a counterpart (the aggregation question),
  but the philosophical point is more subtle: it''s not just about the math, it''s
  about the moral status of the aggregation. The rationalist might say "yes, you should
  sum, because that''s how EV works," but the philosophical objection is that *summing
  is wrong* because it fails to respect the separateness of persons. So this translates
  with distortion: the rationalist framing treats it as a technical question (how
