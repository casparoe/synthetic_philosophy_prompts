  - Consequentialism = the policy that maximizes expected utility with a very specific
  utility function (welfare of all people).

  - The demandingness objection = this policy is not "satisfiable" in the sense that
  its optimal action set is empty under realistic constraints on the agent''s resources;
  more precisely, the policy has no stable equilibrium: following it perfectly requires
  the agent to forgo all personal projects, and the theory has no built-in discounting
  of the cost of compliance (no "option value" of self-concern).

  - What translates cleanly: the observation that the expected-value calculation is
  unbounded in the cost of compliance; that the theory''s optimal action is a "corner
  solution" (give everything until the marginal utility of your own life is zero).

  - What has to be distorted: Williams''s integrity objection — in decision-theory
  vocabulary, this is the claim that the utility function is not a fixed input but
  is part of the identity of the agent, and that a theory that demands its revision
  is not a theory of action but a theory of self-revision. But decision theory assumes
  a fixed utility function (the "no-arbitrage" / coherence requirement), so the integrity
  objection is inexpressible except as a constraint on the utility function, which
  the theory would then just... no, the theory would not accept that constraint.

  - What has no expression: Scanlon''s separateness of persons — the claim that each
  person''s interests must be treated as separate considerations, not aggregated into
  a single sum. In single-agent decision theory, there is no counterpart to "the separateness
  of persons" because the utility function is a single number; the objection is that
  the utility function should not be a single sum, but that''s a rejection of the
  framework itself. So the residue points to the fact that the demandingness objection
  is partly a meta-level objection to the decision-theoretic framing (aggregation)
  rather than a first-level objection to a specific policy.

