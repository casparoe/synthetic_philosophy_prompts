  - Popper''s view of science: theories are conjectures, and their value lies in their
  testability and the severity of the tests they can withstand.

  - Popper''s view of natural selection: it is a theory of the growth of knowledge
  that operates without a rational subject. The three elements: random mutation (error),
  environment, selection (error elimination).

  - The famous analogy: natural selection is to knowledge as the hypothetico-deductive
  method is to knowledge. Both are methods of error elimination. "Natural selection
  is a theory of the growth of knowledge which does not require a rational subject."

  - Popper''s claim: the history of science shows that we don''t learn from success
  (we don''t know which of our theories are true); we learn from our mistakes. The
  growth of knowledge is not a process of accumulating true beliefs but of error elimination.

  - Popper''s argument that natural selection is a "non-historical" theory: it makes
  no specific predictions about the course of evolution; it is a general theory about
  the process (like the hypothetico-deductive method), and it does not explain the
  specific historical events of the evolutionary process. This is in contrast to,
  e.g., Lamarckism, which Popper held to be a "historical" theory (making specific
  predictions about the direction of evolution).

  - Popper''s three conditions: (1) a high probability of errors (mutations), (2)
  a mechanism for error elimination (selection), (3) a test of the solution (environment).

