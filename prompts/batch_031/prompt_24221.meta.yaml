  The surprise exam paradox:

  - A teacher says: "There will be an exam next week, on one of the days Monday-Friday,
  and it will be a surprise — you won''t be able to deduce which day it is before
  it happens."

  - Students reason backwards: It can''t be Friday (because if it hasn''t happened
  by Thursday evening, then on Friday morning you''d know it''s Friday, so it wouldn''t
  be a surprise). So it''s not Friday. Then it can''t be Thursday (because if it hasn''t
  happened by Wednesday evening, then on Thursday you''d know it''s Thursday, since
  Friday is ruled out). And so on, backwards, ruling out all days. But then the teacher
  can give the exam on any day and it will be a surprise, contradicting the students''
  reasoning.

  - The resolution attempts: The problem is with the inductive step / the self-reference.
  The "surprise" condition is not well-defined. The students'' reasoning assumes that
  the "surprise" condition can be known in advance, but it''s a moving target.

  - The "epistemic" analysis: The students'' knowledge is not stable — as they reason,
  their knowledge changes.

  - The "paradox of the unexpected hanging" (same thing).


