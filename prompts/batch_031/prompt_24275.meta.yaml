  Actually, disjunctivism is a great domain because there are specific technical moves
  that a layperson wouldn''t know but a model could reason about. The argument from
  illusion has a specific structure: (1) In a case of illusion/hallucination, the
  subject''s experience is indistinguishable from a veridical perception. (2) The
  subject could not know, on the basis of their experience alone, which case they
  are in. (3) Therefore, the subject''s justification for believing they are seeing
  the object must be the same in both cases. (4) But in the illusion case, the object
  is not present, so the justification cannot be the object itself. (5) Therefore,
  the justification is the same "internal" mental state in both cases. (6) Therefore,
  the veridical case is also justified by an internal mental state, not by the object.
  This is the "argument from illusion" or the "conceivability argument" or the "epistemic
  argument from illusion."


  Disjunctivists reject step 3 or 5: they say that in the good case, the subject is
  in a different kind of mental state (one that is essentially a relation to the object),
  so the justification is genuinely different. The "no fact of the matter" objection
  is: if the two cases are indistinguishable, there is no fact of the matter about
  which mental state the subject is in. Disjunctivists respond: there is a fact of
  the matter (the object is present), but it''s not accessible to the subject.


