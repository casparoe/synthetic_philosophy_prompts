  Let me think about the structure of the argument from illusion more carefully:


  The "epistemic argument from illusion" (sometimes called the "conceivability argument"):

  - Premise 1: It is conceivable that I am in a case of illusion/hallucation that
  is subjectively indistinguishable from a veridical perception of an object.

  - Premise 2: If it is conceivable that I am in such a case, then it is possible
  that I am in such a case.

  - Premise 3: If it is possible that I am in such a case, then there must be a mental
  state that is common to both the veridical and illusory cases (the "common kind"
  condition).

  - Conclusion: Therefore, my experience in the veridical case does not essentially
  involve the object; it is the same kind of state as in the illusion case.


  Disjunctivists reject this. They say:

  - The conceivability premise is okay, but the "common kind" condition is false.

  - In the veridical case, I am in a state of seeing the object (a relational state).

  - In the illusory case, I am in a state of seeming to see the object (a non-relational
  state).

  - These are different kinds of states, even if they are subjectively indistinguishable.

  - So there is no common factor.


  The "no fact of the matter" objection (from the illusionist side):

  - If the two cases are subjectively indistinguishable, then there is no fact of
  the matter about which case I am in.

  - Therefore, it makes no sense to say that in one case I am in a relational state
  and in the other a non-relational state, because there''s no fact of the matter
  to ground that distinction.

  - Disjunctivist response: There is a fact of the matter (the object is present or
  not), but it''s not accessible to me on the basis of my experience alone. The fact
  of the matter is external, not internal.


  The "epistemic" vs "metaphysical" disjunctivism distinction:

  - Metaphysical disjunctivism: the veridical and illusory cases involve different
  kinds of mental states (relational vs. non-relational).

  - Epistemic disjunctivism: even if the two cases involve the same kind of mental
  state, my justification for believing I am seeing the object is different in the
  two cases (in the good case, my justification is the object itself; in the bad case,
  it''s something else).

  - The disjunctivist can be an "epistemic disjunctivist" without being a "metaphysical
  disjunctivist."


