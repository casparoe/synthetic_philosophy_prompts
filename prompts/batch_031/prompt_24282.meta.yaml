  Unilateralist''s curse (Bostrom 2002): In a situation where an action is taken if
  any one of many agents chooses it, the action is more likely to be taken by someone
  who is mistaken about the expected value (or who has an idiosyncratic error). Therefore,
  the expected value of the action, conditional on it being taken, is lower than what
  any single agent would estimate. So rational agents should apply a discount — a
  "curse" — to their own estimate, and the more agents there are, the larger the discount.
  Related: "unilateralist''s dividend" for actions that are taken only if all agents
  agree (or for actions that are not taken if any agent vetoes).


