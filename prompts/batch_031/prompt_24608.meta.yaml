  - Distinction between **causal contribution** and **counterfactual dependence**:
  in a collective action, your action is typically not a necessary condition for the
  outcome (others would have done it anyway), so you don''t "cause" it in the counterfactual
  sense, but you do make a causal contribution. The inefficacy objection conflates
  these.

  - The **voting analogy**: voting is the paradigm case where individual contribution
  is almost always literally zero (elections are decided by margins much larger than
  one vote), yet we don''t say voting is pointless. If the inefficacy objection applied
  to voting, it would prove too much. So what''s different between voting and, say,
  meat consumption? One answer: in voting, the act itself is the contribution to a
  collective decision mechanism, and the mechanism is designed such that contributions
  are pooled. In consumption, the "pooling" is just aggregation of independent actions.

  - The **marginal vs. non-marginal agent** distinction: sometimes you are the marginal
  agent (your action is the one that tips the outcome). The objection assumes you''re
  never marginal, but you can''t know that, and even if you''re not marginal, your
  action still has a causal contribution.

  - The **overdetermination** problem: in collective harms, the harm is overdetermined
  — it would have happened even without your contribution. This makes "making a difference"
  murky.

  - The **expected value / probabilistic** framing: your action has a small but nonzero
  probability of being decisive, and if the harm is large enough, the expected value
  of acting is positive. But this requires you to estimate the probability of being
  the marginal agent, which is hard.

  - The **norm / signaling** argument: individual actions change norms and prices,
  so they''re not "ineffective" in a broader sense. But critics say this is just moving
  the goalposts.

  - The **problem of the "nothing you can do matters" generalization**: if the inefficacy
  objection is right, it applies to everything (helping a drowning person? no, that
  one is clearly effective). So the objection has to be specifically about collective
  harms where the contribution is pooled.


