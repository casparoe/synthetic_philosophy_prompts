  Let me think about the three stances more concretely. The three stances are ways
  of describing / predicting a system''s behavior:

  - Physical stance: describe the system in terms of its physical state and the laws
  of physics. Most predictive, most expensive.

  - Design stance: describe the system in terms of its purpose / function (what it
  is designed to do). Less predictive than the physical stance, less expensive.

  - Intentional stance: describe the system in terms of its beliefs and desires (what
  it "believes" and "wants"). Least predictive (in the sense that it is the most abstract),
  least expensive (in the sense that it is the most compressed).


  The right stance to take depends on the predictive task and the cost / benefit tradeoff.
