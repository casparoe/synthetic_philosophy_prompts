  The key in-the-weeds points of real patterns + three stances:

  1. Real patterns: a pattern is "real" if it is more efficient to describe (compress)
  than to predict / enumerate. The criterion is relative to the observer''s description
  language / repertoire.

  2. Observer-relativity: the same data can support different "real patterns" for
  different observers with different description languages. There is no observer-independent
  fact about which patterns are real.

  3. The three stances: physical, design, intentional. Ordered by predictive power
  vs. cost. The intentional stance is the most predictive but the most expensive.
  The intentional stance is parasitic on the design stance (you can only take the
  intentional stance toward a designed / designed-for system).

  4. The stances are not "true or false" in a simple sense — they are tools for prediction,
  and the right stance is the one that is most efficient for the predictive task at
  hand.

  5. A pattern can be "real" (compressible) but not "causal" — it can be an artifact
  of the description language or the data collection process.


