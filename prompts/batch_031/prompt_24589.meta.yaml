  Key ideas:

  - Luck egalitarianism: inequality is just only to the extent that it reflects differences
  in choice/responsibility, not brute luck.

  - Brute luck: things that happen to you, not under your control (e.g., being born
  with a disability, being hit by a meteor).

  - Option luck: things that result from deliberate gambles/choices (e.g., investing
  in a risky stock).

  - The responsibility condition: inequalities are legitimate if they track responsible
  choices.

  - Frankena''s distinction between option luck and brute luck is central.

  - Dworkin: equality of resources, hypothetical insurance market, equal concern and
  respect.

  - Arneson: critiqued resource egalitarianism; "equality of welfare" — actually Arneson
  argued that luck egalitarianism should be about welfare, not resources. He also
  raised the "slavishness" / "envy" objection? No, that''s different.

  - The "leveling down" objection: if two people are unequal because of brute luck,
  luck egalitarianism says equalize. But if we can only do so by making the better-off
  person worse off (not by making the worse-off better off), luck egalitarianism seems
  to endorse that, which is absurd. E.g., if I can''t help the unlucky person, I should
  harm the lucky one to equalize. This is the leveling-down problem.

  - The "what is a choice" problem: where do we draw the line between choice and brute
  luck? Many "choices" are heavily influenced by brute luck (e.g., your upbringing,
  your preferences).

  - The "desert" confusion: luck egalitarians don''t necessarily think people "deserve"
