  The actual leveling-down problem (as I understand it): Luck egalitarianism holds
  that inequalities due to brute luck are unjust. Consider two people, A and B, where
  A is better off than B due to brute luck. Luck egalitarianism says this inequality
  is unjust. Now, suppose the only available remedy is to make A worse off (not to
  make B better off) — e.g., you can''t help B, but you can harm A. Does luck egalitarianism
  require you to harm A? On a pure reading of the view (which cares about the legitimacy
  of the inequality, not the direction of adjustment), it seems to say yes, or at
  least it doesn''t give a reason to say no. This is the leveling-down problem. A
  defender would respond by adding a constraint (e.g., a welfarist or sufficientarian
  constraint, or the idea that the view is about the legitimacy of inequalities, not
  a directive to harm the lucky).


