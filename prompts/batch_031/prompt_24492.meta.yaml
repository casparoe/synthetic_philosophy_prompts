  Prediction"? Actually the famous statement is in Good''s 1950 paper and in his 1965
  book "The Probability of the Theory"). The theorem: the expected value of perfect
  information is at least the expected value of any partial information; more generally,
  the expected value of any information is nonnegative: E[value of information] ≥
  0. The standard proof: let the decision be to choose an act a to maximize expected
  utility given the prior; the value of information is the expected (over the information)
  of [the max over acts of the posterior expected utility] minus [the max over acts
  of the prior expected utility]. The first term is ≥ the expected (over the information)
  of [the posterior expected utility of the act a* that is optimal under the prior]
  = the max over acts of the prior expected utility (by the law of total expectation).
  So the value ≥ 0. And the value of perfect information ≥ that of partial information,
  because perfect information is a refinement.


