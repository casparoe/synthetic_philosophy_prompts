  Actually, the standard statement is: "If two Bayesian agents have a common prior,
  and it is common knowledge that they are Bayesian, then they cannot have different
  posteriors for the same event that are common knowledge to both." More precisely:
  if it is common knowledge that agent 1''s posterior is p and agent 2''s posterior
  is q (p ≠ q), then this leads to a contradiction given the common prior and rationality.
  So the contrapositive: if they have a common prior and it''s common knowledge that
  they''re rational, then it cannot be common knowledge that they have different posteriors.
  I.e., "they cannot agree to disagree" — they cannot reach a state where it''s common
  knowledge that they disagree.


  So the theorem is: common prior + common knowledge of rationality (Bayesianism)
  → it''s impossible for it to be common knowledge that they have different posteriors.
  Equivalently: if it''s common knowledge that they have the same posterior... no.


