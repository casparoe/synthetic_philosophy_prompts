  Domain D: Condorcet''s jury theorem + "prepare the speaker against objections."
  This is a strong combination: the speaker defends a specific application or a specific
  reading of the theorem to a specific audience. In-the-weeds: the independence assumption,
  the competence assumption (p > 1/2), the problem of correlation in errors, the distinction
  between "majority rule improves accuracy as n → ∞" and the real-world case where
  p < 1/2 inverts it, the distinction between epistemic and non-epistemic justifications,
  the "wisdom of crowds" vs. "jury theorem" distinction, the problem of the "competence
  condition" in voting on referenda vs. elections, the issue of information aggregation,
  the problem of correlated errors (common information sources), the issue of strategic
  voting (Condorcet''s jury theorem assumes sincere voting).


  Audience: e.g., a political science department that does social choice theory, or
  a committee of statisticians. The speaker defends using the jury theorem to justify
  referendums / direct democracy. Objections: (1) the independence assumption fails
  because voters share the same media environment — errors are correlated, and with
  correlated errors the theorem''s convergence breaks down or the majority can be
  systematically wrong; (2) the competence condition p > 1/2 is not guaranteed — on
  some issues the median voter may be below chance (e.g., complex scientific issues),
  in which case increasing n makes the outcome more reliably wrong; (3) the theorem
  assumes sincere voting, but strategic voting can break it (though Condorcet himself
  addressed some of this); (4) the theorem is about truth-tracking, but democratic
  legitimacy is about something else (fairness, autonomy) — so the theorem doesn''t
  justify democracy, at best it justifies epistocracy or expert delegation; (5) the
  "improvement with size" claim is a limit theorem — for finite n the improvement
  is small, and the variance of the outcome matters; (6) the distinction between "the
  majority is right" and "the majority''s decision is better than any individual''s"
  — the theorem shows the majority beats a randomly chosen individual, not that it
  beats the best individual (epistocracy objection).


