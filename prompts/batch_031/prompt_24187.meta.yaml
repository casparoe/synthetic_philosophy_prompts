  Paragraph 1 (seeding, persona, the practice): I spent most of my career in reproductive
  genetics, and for the last couple of years I''ve been reading philosophy, which
  has been both a relief and a source of new confusion. I keep coming back to one
  practice that I know from the inside: preimplantation genetic testing in IVF clinics,
  where a batch of embryos is screened and the parents choose which one to implant,
  skipping the ones that carry a serious genetic condition such as cystic fibrosis
  or Huntington''s disease. I''ve watched the framing of this practice, and it puzzles
  me. Clinics and the public present it as preventing disease in the child — as though
  the child who is brought about would otherwise have been born with the condition,
  and we are mercifully saving them from it. But that framing sits oddly with what
  is actually happening, which is that the unchosen embryo would have become a different
  person, and the child who is actually born is a person who would not have existed
  at all had the other embryo been implanted. I want to understand what the practice
  actually presupposes, and I''d rather have a careful reconstruction than a list
  of the standard ethical worries.


  Paragraph 2 (the question, in-the-weeds): What view of harm, of the moral status
  of the embryo, and of the identity of the child does this practice presuppose, if
  any? Does it presuppose that we are harming the unchosen embryo, which would make
  the practice a form of abortion and would make the "preventing disease" framing
  a piece of self-deception? Or does it presuppose that we are simply choosing among
  possible children, in which case the non-identity problem dissolves the harm claim
  but seems to leave the parents with no moral reason to prefer the healthy embryo
  — which is exactly the move that Scheffler''s procreative beneficence is trying
  to resist by arguing that parents have a reason to bring about the child with the
  best expected life, even when no one is harmed? I''m also interested in the distinction
  between this "liberal" eugenics of individual choice and the older coercive eugenics,
  and in whether the practice is coherent or whether it quietly relies on two incompatible
  framings at once — the harm framing in the marketing and the selection framing in
  the logic.


  Paragraph 3 (deliverable, what a good answer looks like): I''d like you to reconstruct
