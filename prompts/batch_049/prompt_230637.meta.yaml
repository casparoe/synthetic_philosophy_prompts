  "I teach social and political philosophy, and I''ve somehow ended up chairing our
  college''s study-abroad advising committee. What strikes me is that the questions
  students keep bringing are exactly the ones the philosophy of conventions and social
  norms is about, but our advisors have no way to turn that into usable advice. The
  recurring question is some version of: ''Do I actually have to tip here? queue this
  formally? not cross against the light? or am I just doing it to avoid weird looks?''
  I want a reusable procedure, not a one-off piece of advice.


  So: you''re an expert on social norms, conventions, and the line between the conventional
  and the moral. Please draft a one-page decision procedure — a checklist or flowchart
  in words — that a non-philosopher advisor could run in about fifteen minutes with
  a student to determine whether the student is morally required, merely expected,
  or free to skip a local convention. Draw on whatever philosophical work on conventions
  and norms you actually know, but do not cite anything; I want the reasoning compressed,
  not a reading list. Think carefully, and maybe start by listing the different reasons
  a norm can bind a visitor before you collapse them into steps. The procedure should
  distinguish (at least) between: (a) norms whose violation would impose real costs
  on someone who reasonably relied on you, like a tipped worker whose employer can
  legally pay them a couple dollars an hour; (b) harmless coordination devices like
  a queue; and (c) norms that work mostly as ways of showing respect or recognition,
  like forms of address and greetings. It should also handle the asymmetry where a
  local breaking their own norm can look like critique or reform, while a visitor
  doing the same thing reads as contempt. It should say what to do when compliance
  is cheap but the student objects on principle, and it should mark the steps where
  the procedure can''t settle things and has to hand the decision back to a person
  because it''s a value conflict rather than an application of a norm.


