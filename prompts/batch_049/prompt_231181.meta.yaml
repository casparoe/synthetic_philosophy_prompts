  after seeing any amount (except 128), the other envelope has higher expected value,
  so you should switch. (2) Since the rule says "whatever you see, switch when the
  amount isn''t the maximum," and before opening you''ll almost never see the maximum
  if there are many amounts (e.g., list {1,2,...,2^n}), the pre-choice expectation
  is that switching is beneficial. (3) But symmetry says before you open, the other
  envelope is no better than the one in your hand. (4) So expected utility theory
  gives both "switch" and "indifferent" for the same act. (5) Therefore expected utility
  maximization is inconsistent for even finite, bounded problems. Where does the reasoning
  go wrong?


  This is a nice subtle flaw: step (2)/(5) equivocate between unconditional and conditional
  expectation. The decision to switch "whatever you see" is different from deciding
  to switch after seeing. Unconditionally, expected gain of always switching is zero.
  Conditional on x, expected gain is positive for some x. So there''s no inconsistency:
  EU theory says indifferent ex ante, switch conditionally for most x. But wait —
  can a rational agent plan to switch "for every non-max x" and thereby have a positive
  conditional gain for most cases but the plan has zero ex ante gain? Yes, because
  the rare max losses cancel. So the argument "since ex ante you''ll almost never
  see max, switching is beneficial" is a flawed dominance/expectation move: the small-probability
  loss has unbounded size relative to... Actually it''s bounded, but with n amounts
  the max loss ~2^{n-1} and probability ~1/(2n) so product cancels. The subtle flaw
  is ignoring that the rare event''s loss is vast. This is a good "in the weeds" puzzle
  and involves subtle equivocation between ex ante and ex post, plus a finitist version
  that dodges the standard "no uniform prior" answer.


