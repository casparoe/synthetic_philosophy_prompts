  No-trade theorem (Milgrom & Stokey 1982): In a pure exchange economy, if traders
  have common priors and it is common knowledge that an allocation is ex ante Pareto
  efficient, then no additional private information can create a situation where everyone
  expects to gain from trade; i.e., there will be no trade purely on differences in
  information. This seems to prove that speculative trade in financial markets is
  impossible/irrational. But actual markets have enormous speculative volume. Standard
  resolutions: noise traders/liquidity traders (trade for non-informational reasons),
  heterogeneous priors (agree to disagree), risk-sharing/endowment/insurance motives,
  utility from gambling, price impact makes no-trade setup fail, etc.


  The prompt could present an argument:


  (1) If two agents share the same prior and neither needs cash/insurance, then the
  only reason one would offer to trade is that their private information makes the
  asset more (or less) valuable to them. (2) But a rational buyer should update on
  the fact that a rational seller is willing to sell at that price — the very offer
  is information. (3) By iterating this ("if he''s willing to sell at my bid, maybe
  his info is bad; but he''d anticipate my inference; and I''d anticipate his anticipation..."),
  the only consistent stopping point is that neither party can profit from trading
  on information alone. (4) So informed speculation should be rare or nonexistent.
  (5) Yet speculative trade (e.g., currency markets, stock picking) is massive. (6)
  Therefore at least one of the assumptions used in (1)-(3) — probably common priors
  or common knowledge of rationality — must be false, and this shows that real-world
  speculation is driven mostly by differing priors or irrationality, not information.
  Where does this go wrong?


