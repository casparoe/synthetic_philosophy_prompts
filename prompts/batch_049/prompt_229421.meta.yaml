  Sen''s Liberal Paradox (Sen 1970, "The Impossibility of a Paretian Liberal"): Given
  a social choice rule that satisfies:

  1. Weak Pareto (or Pareto principle): if everyone prefers x to y, then society should
  prefer x to y.

  2. Minimal liberalism: there are at least two individuals, and for each, at least
  one pair of alternatives over which that person is decisive — i.e., if they prefer
  x to y, society prefers x to y regardless of others.


  Claim: no social choice rule (producing a complete, transitive social ranking, or
  even just a social choice?) satisfies both, as long as the decisiveness is over
  distinct pairs and preferences can be unrestricted (or at least in a particular
  preference profile).


  Actually Sen''s theorem: There is no social decision function that simultaneously
  satisfies Unrestricted Domain, Weak Pareto, and Minimal Liberalism (Sen''s condition
  L). The classic proof uses a scenario: two individuals, Prude and Lewd, and one
  book, Lady Chatterley''s Lover. Alternatives:

  - a: Prude reads the book

  - b: Lewd reads the book

  - c: neither reads it


  Prude''s preferences: c > a > b (he''d rather no one read it, but if someone must,
  he''d rather read it himself than be corrupted by Lewd).

  Lewd''s preferences: a > b > c (prude reading it is best, but he''d rather read
  it himself than nobody reading it).


  Minimal liberalism: Prude is decisive over {a, c} (whether he reads it). Prude prefers
  c > a, so society c > a. Lewd is decisive over {b, c} (whether he reads it). Lewd
  prefers b > c, so society b > c. Weak Pareto: both prefer a > b, so society a >
  b. Then social preference cycles: c > a > b > c. Inconsistent with transitivity.
  Hence paradox.


