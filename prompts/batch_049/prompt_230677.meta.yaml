  Write a "Which theory of truth do you actually hold?" quiz about the Liar paradox
  and self-referential truth, with 8-10 questions. Each question should present a
  concrete sentence or set of sentences and ask one forced-choice question about its
  truth status (true, false, neither, both, meaningless, etc.); the answer options
  should be framed in ordinary, label-free terms. Then give a scoring key that maps
  patterns of answers to positions.


  Please build the quiz from the logical space rather than from a list of names: first
  lay out the diagnostic questions and the combinations of answers they make possible,
  then locate the actual positions in that space, note which combinations nobody occupies,
  and say briefly why (incoherent, unattractive, or merely unexplored). Positions
  that the instrument cannot tell apart should be flagged as such rather than forcibly
  distinguished.


  At minimum the leaves must include: (a) a classical hierarchical/Tarskian view that
  denies the liar is a single univocal proposition (it''s meaningless, ill-formed,
  or true/false only relative to a level), (b) a truth-value gap view (e.g. Kripkean
