  Sartre''s view: bad faith (mauvaise foi) is not exactly lying to oneself because
  lying is "the ideal of bad faith"? Let me recall: In Being and Nothingness, Part
  One, Chapter Two: Bad Faith. He contrasts bad faith with the lie. The lie is a "negative
  attitude" but essentially involves the dyad deceiver/deceived. The liar does not
  aim to hide the truth from himself but from the other. Bad faith is a lie to oneself,
  but the problem: the one to whom the lie is told and the one who lies are the same,
  so "the liar must know the truth he hides." Sartre asks how one can be both the
  deceiver and the deceived when the deceiver knows the truth and the deceived does
  not. His answer involves "the double property of the human being" being both facticity
  and transcendence. Bad faith exploits the ambiguity: one can affirm a facticity
  while denying transcendence or vice versa. The classic examples: the woman on the
  first date, the waiter, the homosexual (champion of sincerity?), and "sincerity"
  as bad faith. Sincerity demands that we be only what we are, but "I am never any
  of my being" — the human reality is not what it is (transcendence) and is what it
  is not (facticity, being in-itself?). Actually Sartre says human reality "is what
  it is not and is not what it is." Bad faith uses this.


  The analogy "bad faith = lying to yourself" is common precisely because Sartre initially
  characterizes mauvaise foi as "a lie to oneself" but immediately distinguishes it
  from lying. The audit can be precise: the analogy captures (a) intentional concealment
  of a truth, (b) the person is both source and recipient, (c) results in a false
  belief/attitude; but breaks because (d) lying is a dyad across two consciousnesses
  with temporal separation and the liar knows the truth affirmatively, while in bad
  faith the concealment is not reflective knowledge — the truth is present pre-reflectively
  but not posited; (e) bad faith is not an act but a project/manner of being, not
  localized; (f) on Sartre''s account there''s no self "behind" the lie; the ego itself
  is an object/construct. Also the conclusion "sincerity is the cure" — Sartre thinks
  sincerity is itself bad faith, so the analogy smuggles in a therapy (just be honest
  with yourself) that Sartre rejects. That''s the payoff: once the disanalogies are
  on the table, the "just be honest" conclusion doesn''t survive.


