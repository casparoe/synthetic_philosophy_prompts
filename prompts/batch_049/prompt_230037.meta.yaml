  Desiderata it must meet:

  1. The asymmetry datum: people (and plausible moral intuition) judge that no amount
  of mild pleasure, e.g., a lifetime of pinpricks... actually the classic Jamie Mayerfeld
  / Rachels? The example: would you accept 15 minutes of the worst torture for a lifetime
  of mild pleasure? People refuse; this suggests lexical priority. But the theory
  must handle risk/uncertainty and aggregation.

  2. It must not collapse the distinction between intensity and duration—commensurability
  within a life and across persons.

  3. It must respect the continuum/sorites problem: if there''s a threshold, where
  is it, and can a small difference in intensity on either side justify drastically
  different trade-offs? A desideratum: no arbitrary threshold, or explain vagueness.

  4. It must handle aggregation: if one person''s severe pain lexically dominates
  any amount of mild pleasure, does it dominate any amount of mild pain reduction?
  Does one severe pain dominate a billion mild pains? If yes, how does the theory
  handle "one severe pain vs N slightly-below-threshold pains" — the clumping/parfit
  problems.

  5. It must distinguish between deliberative/decision contexts and axiological ordering:
  lexical priority as non-compensability vs discontinuity.

  6. It needs to account for measurement/commensurability: are pleasure and pain on
  the same cardinal scale with zero point, or are they separate dimensions that don''t
  trade off? Negative utilitarians often claim pain and pleasure are not commensurable
  in the way classical utilitarianism assumes.

  7. It must handle the "intrapersonal vs interpersonal" question: can a person''s
  own mild pleasure compensate for their own severe pain? If not, is it a claim about
  welfare or about morality (aggregation across persons)?

  8. It must respect empirical facts about pain measurement: hedonic scales, the "worst
  pain imaginable" end point, adaptation, and whether there''s a natural break (e.g.,
  pain that makes normal functioning impossible).

  9. It must survive the "different number of people" cases: lexical priority could
  imply extreme anti-natalist or world-exploding conclusions.

  10. It must distinguish between lexical badness (axiology) and deontic side-constraints
  (rights, prohibitions) — is the "unacceptable trade-off" explained by rights against
  torture rather than by a lexical axiology?


