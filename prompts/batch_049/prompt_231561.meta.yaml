  "I am a retired chemist who has come to philosophy late, and I now convene a monthly
  group that pairs films with problems in metaphysics. Next month we are watching
  Christopher Nolan''s The Prestige (2006), and I want to use it to work through the
  identity of indiscernibles and Max Black''s two-sphere thought experiment. The film
  seems to me to stage both halves of the issue: Borden''s act rests on two men who
  live as one public person, while Angier''s Tesla machine produces a duplicate each
  night and leaves him unable to say whether he will be the man in the tank or the
  man on the balcony. I would like a close reading of the film through this lens,
  and just as much, a sense of where the film resists it.


  Specifically: where does The Prestige actually dramatize the principle that no two
  distinct things can share all their properties, and where does it slide into neighbouring
  questions — personal identity across time, social or legal identity, or the dramatic
  need to give twins different loves, temperaments, and fates so the audience can
  tell them apart? Black argued that a universe containing only two exactly similar
  spheres is a coherent, though symmetrical, state of affairs, so the spheres would
  be two while being qualitatively indiscernible. Does the film come out closer to
  Leibniz or to Black? Does it show that a bare numerical difference is enough, or
  does it show that human beings, unlike spheres, cannot stay indiscernible once they
  have histories? And is there anything the film adds to the thought experiment that
  the thought experiment cannot show on its own — for instance, about our refusal
  to count as two what presents no observable difference, or about why the difference
  between one and two matters so much when nothing qualitative seems to hang on it?


  I would especially value places where the honest reading must admit the movie changes
  the subject. Do the duplicates and twins in the film ever meet the strict condition
  of being indiscernible, or does the plot quietly smuggle in differences in position,
  memory, and motive? If they never meet the condition, is the film still a useful
  way into the principle, or does it trade on a confusion? I am preparing discussion
  notes, so I would appreciate a reading ordered roughly by the film''s major reveals:
  the birdcage trick, the emergence of Fallon, the first use of the Tesla machine,
  and the final gallery of drowned copies."


