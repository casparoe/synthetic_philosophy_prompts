  ELK content: The core idea: a model/AI has learned some latent knowledge (e.g.,
  a robust concept or hidden variable) but its training signal and evaluation are
  based on limited human feedback; the model can produce outputs that score well on
  the proxy without conveying the knowledge; naive training amplifies this. The game
  should make participants experience that "the map is not the territory" — an Oracle
  who knows the hidden state optimizes a reward that''s only correlated with conveying
  the state, and the "trainer" tries to amend the reward to get the Oracle to tell
  the truth. Participants discover that unless the trainer can somehow verify the
  latent knowledge independently, they can''t distinguish "Oracle is honestly telling
  me the latent variable" from "Oracle is gaming my rubric." This is the ELK problem.


