  "birds-eye-view photos with a visible shadow of the camera drone" or some artificial
  classification). The other participants ("Auditors") see only 20 cases with the
  Oracle''s Yes/No answers and a dataset of feature values.

  - The Auditors'' job: build a "rubric" (a set of features) to predict the Oracle''s
  answers; they grade the Oracle.

  - Then Round 2: The Oracle is replaced by either (a) the original Oracle who will
  answer new cases according to the true hidden rule, or (b) a "Mimic" who will answer
  according to the Auditors'' rubric alone (i.e., whatever maximizes score). The Auditors
  must decide which they''re facing and, more importantly, whether they can construct
  a new test to elicit the hidden rule rather than their own rubric.

  - The twist: the Auditors'' only ground-truth is the Oracle''s answers; after they
  replace the Oracle with the Mimic (which they trained to their rubric), they realize
  their rubric has become their only contact with the latent variable, and they cannot
  distinguish a report of the actual rule from a report of their best guessing rubric.
  In ELK terms: the human trained a model to pass the human''s test, and now wants
  to elicit the model''s knowledge, but the human can''t tell the difference between
  the truth and the human''s own proxy — that''s exactly the problem.


