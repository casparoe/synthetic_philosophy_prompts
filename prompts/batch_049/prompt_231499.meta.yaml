  on Hiroshima and Nagasaki. The theory: Anscombe''s account in her pamphlet "Mr.
  Truman''s Degree" (1956/1957) opposing Oxford''s honorary degree; she argues Truman
  is a murderer because he deliberately chose to massacre the innocent to get a result
  (unconditional surrender), and that the "it saved lives" consequentialist defense
  treats the end as justifying the means; she also says the Allies'' demand for unconditional
  surrender was morally corrupt because maybe the Japanese would have surrendered
  with the emperor kept. Actually some historical nuance: Anscombe wrote that the
  condition for ending the war was "unconditional surrender" and that the Japanese
  desired peace and had sought terms, but Allied leaders refused to clarify the emperor''s
  status. So her view: dropping the bomb wasn''t necessary; it was chosen to avoid
  the "hazard" of negotiation and to demonstrate power to Russia perhaps. The model
  should analyze: what Anscombe''s view says about the decision, the actors (Truman,
  Byrnes, Stimson, the Japanese cabinet), the options and payoffs (invade vs bomb
  vs negotiate with conditional surrender), what the theory explains (the second bomb
  as pure terror/murder; the refusal to clarify terms), and where it might miss (the
  uncertainty of Japanese surrender, the Soviet entry, the fog of war, casualty estimates,
  the unavailability of a clean counterfactual). Also what the episode shows about
