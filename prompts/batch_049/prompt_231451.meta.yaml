  Chalmers''s meta-problem: the problem of explaining why we (and particularly philosophers)
  think there is a hard problem of consciousness — why consciousness seems hard to
  explain, why we have "problem intuitions." Chalmers distinguishes the hard problem
  (explain phenomenal consciousness) from the meta-problem (explain our dispositions
  to make phenomenal judgments / problem reports). He argues that solutions to the
  meta-problem don''t solve the hard problem, but they may put pressure on it. Realism
  vs illusionism: illusionists say explaining the meta-problem dissolves or debunks
  the hard problem (or phenomenal consciousness itself); Chalmers is a realist who
  argues even if we explain the problem intuitions, the hard problem remains. Important
  nuance: Chalmers thinks the meta-problem is itself a problem, and that solving it
  doesn''t remove the hard problem; but some "debunking" or "illusionist" responses
  use meta-problem solutions.


  Common subtle misrepresentations in a popular summary:

  1. Conflating the meta-problem with the easy problems (e.g., "Chalmers calls it
  the meta-problem: explaining the cognitive mechanisms by which we report that consciousness
  feels like something" — that''s close but the meta-problem is explaining problem
  intuitions/reports, not merely the reports themselves.)

  2. Saying "Chalmers argues that because we can explain why we think there''s a hard
  problem, the hard problem itself is an illusion" — false; Chalmers is careful that
  solving the meta-problem is neutral or even supports realism, while illusionists
  draw debunking conclusions.

  3. Overstating that the meta-problem "replaces" the hard problem.

  4. Conflating "phenomenal reports" (reports about experience) with "problem reports"
  (judgments that explaining experience is hard).


