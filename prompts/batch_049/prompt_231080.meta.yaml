  I''m working on a short essay for a class on comparative economic history, and I''d
  like comments on the argument before I tighten it up. The working claim is that
  "why did the industrial revolution happen in Britain rather than China?" is less
  a single question than a cluster of questions, and that as usually posed it''s ill-posed
  because it smuggles in Britain as the natural/default outcome and treats China as
  a leftover that needs explaining. My current move is to suggest that we should replace
  it with two questions: (1) why did an unprecedented breakthrough in the rate of
  technological change and energy use occur in Eurasia at all in the eighteenth/nineteenth
  century, given that for most of human history stagnation was the norm; and (2) why
  did the particular region where it first took hold have features like cheap coal,
  Atlantic trade, and high-wage labor relative to capital? I then argue the original
  Britain-vs-China question isn''t completely empty—it does force useful comparisons—but
  it should be understood as a contrastive explanation: it''s well-posed only if you
  specify a contrast class (for example, coastal South China or the Yangzi Delta,
  not "China" as a whole) and only if you don''t presuppose that a single "blocking"
  factor explains the non-occurrence.


  What I''d especially like comments on: Is the essay''s central distinction between
