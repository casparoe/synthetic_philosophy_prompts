  Wait, IRL is precisely about inferring reward functions from behavior. Key conceptual
  issues:


  - Reward function ambiguity: many reward functions explain the same behavior (Ng
  & Russell). You need assumptions/priors to select among them.

  - Behavior ≠ preferences: people act under constraints, misinformation, habits,
  bounded rationality, time inconsistency, social pressure.

  - Demonstrations are often noisy or systematically biased (e.g., expert demonstrations
  may be suboptimal).

  - The standard IRL formulation assumes the demonstrator maximizes expected cumulative
  reward; violations (risk aversion, hyperbolic discounting) can be folded into reward
  or modeled as bias.

  - Partial observability: the agent''s observations differ from the demonstrator''s,
  so a mismatch may be due to differing beliefs.

  - Inverse RL vs. behavioral cloning: IRL aims for robust transfer, but if you just
  match behavior you may miss intentions.

  - Preferences may be incomplete or context-dependent; people "construct" preferences.

  - Multi-agent: revealed preferences from behavior might reflect social influences
  rather than true preferences.


