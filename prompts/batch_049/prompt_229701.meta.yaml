  Round 1 (A): The Löbian obstacle is real and it blocks reflective self-trust: an
  agent cannot derive "my reasoning is reliable" from instances of its own reasoning;
  by Löb, a system that proves "if it proves P, then P" only manages this for P it
  already proves outright. So self-trust cannot be bootstrapped; the agent either
