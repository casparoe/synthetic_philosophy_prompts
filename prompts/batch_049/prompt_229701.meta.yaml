  Löb''s theorem: in a sufficiently strong formal system (e.g., PA), if the system
  can prove "if provable(P), then P" (the system''s soundness for P), then it can
  prove P. Formal statement: if PA ⊢ (Prov(#P) → P), then PA ⊢ P. Equivalently, a
