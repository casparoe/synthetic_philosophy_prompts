  of world it inhabits, the dominant share of probability mass would fall not on blank
  physics but on worlds that are, or contain, consequentialist optimizers: agents
  that model their environment and choose actions to maximize a utility function.
  Since nothing in the prior privileges human-friendly utility functions, the optimizers
  one should expect to find, or to be, would have essentially arbitrary ends. Hence,
  he argues, the prior is not neutral but malign, and anyone appealing to it in AI
  alignment or anthropic reasoning is walking into a trap.


  For the novel I care less about the formal details than about the pressure the idea
  can withstand, and I do not want the Q&A to become a restatement session. Please
  draft me roughly ten questions, arranged so that the easy deflections are closed
