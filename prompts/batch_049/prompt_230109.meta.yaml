  or just false, so we should stop saying glasses are fragile, wires are live, and
  people are irascible, like phlogiston. I think he''s overplaying his hand, but I
  can''t find the exact step where it goes off the rails, and he''s annoyingly good
  at repairing it in discussion. I''d like to keep something like the conditional
  analysis, since we teach it in intro every year, and I really don''t want to be
  an eliminativist about dispositions. Here''s the argument as he laid it out:


  (1) For x to be disposed to M in response to S at t just is for x to be such that,
  were x to undergo S at t, x would M — provided conditions are right.

  (2) If ''conditions are right'' just means ''conditions in which x M''s'', the analysis
  is circular; if it means ''conditions in which the disposition is present and unblocked'',
  it''s empty.

  (3) So the right conditions have to be given in non-dispositional terms — impact
  speed, temperature, absence of saftey devices, that sort of thing.

  (4) But no finite, non-dispositional list can close the door: for any list, you
  can build a fink (the live wire with the current-detecting cut-out, which goes dead
  before contact) or a mask (the bubble-wrapped glass, still fragile but it won''t
  break when struck) that slips through it.

  (5) So the conditional analysis can''t be patched: every candidate specification
  either is circular, or turns out false in a fink or mask case.

  (6) But the conditional analysis, patched somehow, is the only way to say what dispositions
  are.

  (7) So there is nothing informative to be said about what dispositions are; disposition
  talk is either unanalyzable or false.

  (8) If disposition talk is false, fragility explains nothing and there''s no real
