  be changing the subject, not refuting the sentence; and "held true come what may"
  is compatible with being held true because of meaning. So there''s no contradiction
  between (2) and (3) per se — Quine''s point is deeper, about whether (3)''s grounding
  notion is clear, not about a flat contradiction with (2).


