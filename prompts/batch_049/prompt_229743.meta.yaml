  "Over the last few months I''ve been reading about Quine and the analytic-synthetic
  distinction, and I''ve ended up with the following package of views. I''d like to
  know whether it holds together.


  1. I''m persuaded by Quine''s point that individual sentences don''t have their
  own empirical content; only a whole theory (web of belief) faces experience as a
  unit.

  2. I accept that any statement can be held true come what may, as long as we make
  adjustments elsewhere in the web.

  3. But I still want to distinguish analytic truths like ''All bachelors are unmarried''
  from synthetic truths like ''All bachelors are unhappy''; the first seems true purely
  in virtue of meaning, while the second needs the world.

  4. I think ''bachelor'' just means ''unmarried adult male'', so there''s a clear
  notion of synonymy available to underwrite (3).

  5. I also think there''s a principled difference between giving up a belief because
  of recalcitrant experience and merely changing the meaning of my words.


  Are (1) and (2) in tension with (3)–(5)? Does Quine''s holism actually force me
  to give up the analytic-synthetic distinction, or can I keep both? ..."


