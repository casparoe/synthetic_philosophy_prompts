  Quine''s actual argument in "Two Dogmas": dogma 1 (analytic/synthetic has a sharp
  boundary) and dogma 2 (reductionism — each meaningful statement is equivalent to
  a logical construct of terms referring to immediate experience). Quine argues the
  two dogmas are at root identical: the verification theory of meaning underlies both.
  Holism (from Duhem) undermines reductionism, and thereby undermines the analytic-synthetic
  distinction. So if you accept holism (1) and reject reductionism (each sentence
  has its own empirical content), but still claim analyticity as "true come what may,"
  Quine would say: you''re trying to have a divide between analytic (immune to revision)
  and synthetic (empirically vulnerable), but holism says experience bears on the
  whole system and no sentence is immune in principle; so the distinction between
  "held true in virtue of meaning" and "held true as a matter of fact" can''t be drawn
  at the level of individual sentences. Genuine tension between (1)/(2) and (3).


  Synonymy (4) as ground of analyticity: Quine argues synonymy is as much in need
  of clarification as analyticity; typical definitions ("bachelor" = "unmarried man")
  presuppose the very distinction. So (4) is not a separate ground but borrows the
  notion. Is (4) in tension with (3)? Not exactly; (4) is an attempted support for
  (3) that Quine finds circular. Tension with (2)? If (2) allows revising logic and
  even analytic sentences, then synonymy-based analyticity might provide a non-empirical
  core... Actually, a model answering would say (4) conflicts with a Quinean holism:
  if meanings are fixed by the whole web, there are no atomistic synonymies to ground
  a sentence''s analyticity. That''s a genuine but subtle tension.


