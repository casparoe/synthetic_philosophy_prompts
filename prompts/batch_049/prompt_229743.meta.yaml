  vs abandon a belief is underdetermined — there''s no fact of the matter about which
  you''re doing. Quine argues "no statement is immune to revision" and hence the meaning/belief
  boundary is fluid. But (5) presupposes such a boundary. Tension.

  - (3)+(4) + (1): One might worry holism dissolves analyticity because analytic truths
  are those held true come what may, but holism says every statement''s fate depends
  on global adjustments — including paradigm analytic truths (e.g., revise logic if
  quantum mechanics demands). So (1)/(2) put pressure on (3)''s "purely in virtue
  of meaning" because whether a sentence is held true is always also a matter of behavioral
  adjustment to experience, not meaning alone.


