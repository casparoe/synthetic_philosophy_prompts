  Galen Strawson''s Basic Argument: type C (interview questions) could be excellent
  and in-the-weeds, and doesn''t require web. Let me consider.


  The Basic Argument (summarized): (1) You do what you do, in a given situation, because
  of the way you are. (2) To be truly/ultimately morally responsible for what you
  do, you must be truly/ultimately responsible for the way you are — at least in certain
  crucial mental respects. (3) But you cannot be truly/ultimately responsible for
  the way you are. You can''t be responsible for the way you are because your nature
  is a product of your genetic inheritance and early experience, neither of which
  you chose. (4) So you can''t be truly/ultimately morally responsible for what you
  do. Strawson argues the Basic Argument is a formal argument that doesn''t rely on
  determinism; it works whether determinism or indeterminism is true. Critics: conflates
  causal responsibility with moral responsibility; the argument assumes "ultimate"
  responsibility is required, but compatibilists deny that; also the "regress" — but
  Strawson thinks it''s not an infinite regress, rather a finite argument: nothing
  can be causa sui. He distinguishes "ordinary moral responsibility" (compatibilist,
  useful) vs "true moral responsibility" (impossible). He says even though impossible,
  we can''t help living as if true responsibility is real.


