  Let me think of the subtle misrepresentations for James vs. Clifford summary.


  The actual debate: W.K. Clifford, "The Ethics of Belief" (1877), argues it is wrong
  always, everywhere, and for anyone, to believe anything on insufficient evidence.
  His arguments include the shipowner example (a shipowner who suppresses doubts and
  lets a ship sail; ship sinks) and the "belief is not private" / social-epistemic
  argument (beliefs influence action, we have duties to future generations, credulity
  weakens society). William James, "The Will to Believe" (1896), argues that Clifford''s
  evidentialism is too strict: there are cases where the option is live, forced, and
  momentous, and cannot be decided on intellectual grounds, where our passional nature
  may decide. He restricts this to genuine options, not all beliefs. He doesn''t endorse
  believing anything you like; he insists on the "will to believe" only when the option
  is genuine, i.e., live, forced, momentous, and where the evidence is insufficient
  to settle it, AND believing may be self-fulfilling (e.g., whether you can make a
  friendship, whether you can succeed). Also, there''s the doxastic voluntarism problem:
  Clifford assumes we can control beliefs; James assumes we can choose in certain
  cases. James distinguishes between "believe truth!" and "avoid error!" — two commandments/passions.


  Common misrepresentations in a textbook gloss could include:

  - Conflating Clifford''s "sufficient evidence" with proof or certainty. Clifford
  didn''t require proof; he required sufficient evidence proportioned to the stakes.
  Overstatement.

  - Presenting James as saying "you''re allowed to believe whatever makes you feel
  better" or "religious belief is an exception to evidentialism." Actually James''s
  argument is more general and doesn''t license wishful thinking; he sets strict conditions.

  - Presenting Clifford''s principle as a pure epistemic norm (about truth) when his
  argument is largely moral/practical (beliefs aren''t private; actions; social harm).

  - Presenting James as an opponent of all evidentialism: he actually says "we must
  know the truth; and we must avoid error" and agrees that in ordinary scientific
  matters you should wait for evidence.

  - Maybe misstate that James thinks faith is justified whenever evidence is lacking,
  or that he claims we can believe at will.

  - Or conflate "sufficient evidence" with "adequate evidence" and claim Clifford
  banned all religious faith because faith is defined as going beyond evidence.


