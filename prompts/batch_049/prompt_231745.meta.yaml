  The hole argument (Earman & Norton 1987, building on Einstein''s "hole" considerations
  in 1913-1915). Core: In general relativity, consider a region (the hole) where the
  stress-energy tensor is zero and the metric is fixed on the boundary. Take a diffeomorphism
  that''s the identity outside the hole and moves points inside. Push the metric forward:
  the two models agree outside the hole (with fields dragged along), but assign different
  metric values to the same points inside. If we treat the manifold''s points as real
  (substantivalism), the two are distinct physical possibilities that agree on all
  observable data and all initial/boundary data — radical indeterminism. Relationalists
  dodge this by denying that points have identities over and above the fields, so
  the two models represent the same possibility. The moral: the hole argument reveals
  the tension between determinism, substantivalism, and general covariance; solutions
  include relationism, sophisticated substantivalism, gauge-equivalence reading.


  A sestina: six end-words that recur in a prescribed permutation across six six-line
  stanzas + a three-line envoi containing all six (often three at line ends, three
  within). The permutation: 1-2-3-4-5-6 → 6-1-5-2-4-3, etc. The end-words could be:
  hole, points, shift, same, fixed, drag. Or: metric, points, same, drag, hole, moves.
  The structural work: as the sestina permutes, the same six words keep reappearing
  in different positions, grammatically doing different jobs — like the metric field
  and points reinterpreted after a diffeomorphism; the envoi gathers all six in three
  lines, like the dissolution: the two descriptions coincide.


