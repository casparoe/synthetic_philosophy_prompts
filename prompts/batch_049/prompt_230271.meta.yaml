  Imprecise probabilities core ideas:

  - Precise Bayesianism requires a single, real-valued probability for every proposition
  — exactness.

  - Imprecise probabilities represent belief by a set of probability functions (credal
  set), or sometimes by lower/upper previsions.

  - Motivations: (1) representation of ignorance/unspecific evidence (a coin with
  unknown bias; symmetry arguments fail); (2) reluctance to commit to arbitrary exact
  values; (3) robustness/sensitivity analysis.

