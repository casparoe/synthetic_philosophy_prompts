  function that represents ignorance in one parametrization represents strong information
  in another (the "Bertrand paradox" / transformation invariance problem). This is
  a deep issue: Walley''s vacuous previsions are transformation-dependent.

  - Decision rules: maximality, E-admissibility, interval dominance, Γ-maximin, etc.

