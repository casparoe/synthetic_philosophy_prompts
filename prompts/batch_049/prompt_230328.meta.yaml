  "For a graduate seminar on the foundations of game theory, please write the desiderata:
  what must an account of common knowledge of rationality get right before it earns
  its place in the foundations? I am asking for a specification, not a survey, and
  certainly not a reading list.


  State the purpose first: the account should be adequate for explaining how rational
  agents coordinate or fail to coordinate under shared and private information, and
  for underpinning solution concepts such as equilibrium and backward induction. Then
  give the full requirements list, each with the case or consideration that motivates
  it. At minimum, address the following.


  1. Hierarchical structure. Common knowledge is not simply everyone knowing p; it
  is everyone knowing p, everyone knowing that everyone knows p, and so on without
  bound. Why cannot an adequate theory collapse this hierarchy into first-level mutual
  knowledge, and what would be lost if it did?


  2. Publicity versus shared private information. A public announcement of p generates
  common knowledge of p; merely correlated or overlapping private observations do
  not. The theory must explain this difference and say why it matters for conventions,
  coordinated action, and coordination failure.


  3. Fragility and approximate common knowledge. Consider two commanders who must
  attack at the same time but can communicate only by messengers that may fail to
  arrive. Each additional message can confirm an earlier one, yet the infinite chain
  needed for common knowledge of the plan is never secured. The theory must handle
  this case and explain why making message loss arbitrarily unlikely is not the same
  as eliminating it.


