  Phenomenon idea: In debates about atrocities, people argue over whether a term applies,
  such as "genocide," "ethnic cleansing," or "war crimes." The same set of events
  is often not disputed, but people dispute which classification is correct. The underlying
  stakes are that each label carries different obligations: e.g., if it''s genocide,
  there''s a duty to prevent and punish under the convention; if it''s crimes against
  humanity, maybe a different response. So the factual agreement doesn''t resolve
  the debate, because the disputants are really arguing about which norm-governed
  label should be applied, and they often use the label as a premise to derive the
  obligation, but the obligation is also what''s motivating their choice of label.
  Is there a name for this phenomenon of disagreements that are officially about a
  classification but are really about the normative consequences the classification
  is assumed to have? It''s not mere equivocation or ordinary definitional dispute,
  because the words have agreed legal definitions; it''s more like the classification
  is doing the argumentative work while the normative force stays unargued.


