  ---


  I am a novelist, and I lead a quarterly craft seminar for twelve to sixteen writers
  of fiction, ranging from first-novel drafts to mid-career authors. We meet for ninety
  minutes, and I prefer the room to be a workshop rather than a lecture: the participants
  should arrive at the idea through an exercise, and only then have it named and questioned.
  I would like you to design a runnable ninety-minute activity with a debrief.


  The underlying idea I want them to feel, without being told it up front, is this:
  when a concept is specified only by a finite set of examples—a character type, a
  genre convention, a rule of narrative logic—the examples always underdetermine the
  concept, and the concept only becomes determinate because writer and reader share
  some prior sense of which features deserve attention. I want the activity to stage
  this in the simplest possible arena first, and then on material drawn from the participants''
  own fiction.


  I have heard of Bongard problems—the little six-versus-six arrays of boxes in which
  all the left boxes obey some rule that none of the right boxes obey, named after
  the Soviet pattern-recognition researcher Mikhail Bongard—and I suspect they are
  the right springboard, because they make the puzzle of inferring a rule from a few
  positive and negative examples stark. But I do not want a dry introduction to them.
  I want a game or a structured exercise in which the participants first learn the
  format by solving, then build their own problems out of micro-scenes from their
  own work, and then collide with the fact that their intended rule is not the only
  rule the examples support.


  Specifically, the design should include:


  - A short opening in which participants solve two or three provided Bongard-style
  problems (geometric ones are fine; narrative ones are better if you can construct
  them so that unintended rules become temptingly available), with no theory given—only
  the instruction to find the rule that separates left from right.

  - A middle game with actual stakes for the group—some form of scoring, points, or
  a small forfeit—in which each participant designs a six-versus-six problem from
  twelve short narrative examples of their own invention, another participant must
  guess the intended rule, and then the whole group tries to propose as many alternative
  rules as possible that also fit all twelve examples. The payoff structure should
  reward the designer when the intended rule is guessed, but reward the guesser and
  the others for any consistent rule, contrived or trivial, so that the intended rule
  can be beaten by alternatives the designer cannot eliminate. I want the mechanics
  themselves to produce the moment in which someone says, in effect, "that rule fits
  but it is not what I meant," and someone else replies, "then your examples did not
  say what you thought they said."

  - A debrief of no more than fifteen or twenty minutes that maps what happened in
  the game onto the idea: the rule the solver found is like the concept a reader takes
  away from a novel''s first pages; the designer''s inability to rule out competing
  rules is like the writer''s inability to make a character or a genre legible without
  relying on shared conventions and salience; and the alternative rules the group
  invents are a controlled version of misreading. The debrief should also say what
  will predictably go wrong when the exercise is run—participants who find visual
  puzzles alienating or anxiety-inducing, participants who propose vacuous or disjunctive
  rules, designers whose examples are too plainly labelled—and how the facilitator
  should handle each without lecturing in advance. Finally, the debrief should be
  frank about what the activity cannot reproduce: real literary texts do not consist
  of six self-contained examples, and real readers do not approach a novel with nothing
  but the text and a demand to extract one rule; the facilitator will need to supply
  that correction.


  One further constraint on how you write this. Where the exercise or the debrief
  leans on a philosophical or psychological gloss of what is happening—for example,
  about underdetermination, induction from few examples, salience, or what a concept
  is—please separate what is settled from what is genuinely contested among the people
  who study these topics, and do not present a contested view as if it were the consensus.
  If the lesson I want the participants to feel itself rests on a contested reading
  of Bongard problems, say so plainly and tell me how much of the activity survives
  if that reading is disputed.


