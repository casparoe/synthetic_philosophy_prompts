  Draft v1:


  "Design a nuclear-crisis thought experiment, realistic enough to use in a serious
  policy argument, in which the following two doctrines of deterrence give opposite
  recommendations about what a nuclear-armed defender should do in response to the
  same limited provocation.


  The first doctrine, call it the Ex Post Credibility Doctrine, holds that a threat
  can deter only if the challenged party believes the threatener would rationally
  choose to carry it out after the provocation has already occurred. A response that
  would be more costly than simply accepting the provocation is therefore a bluff
  and will be discounted. On this doctrine, a state should not base its security on
  threats it would not actually execute; when no ex post rational threat is available,
  it should respond conventionally or accept the loss.


  The second doctrine, call it the Manufactured Risk Doctrine, holds that credibility
  need not depend on a conditional intention to carry out an ex post irrational attack.
  A state can make a threat credible by deliberately increasing the probability that
  the crisis escapes both sides'' control, so that the adversary can no longer be
  sure the disaster will not occur even if no leader rationally chooses it. On this
  doctrine, the lever of deterrence is the shared risk of inadvertent or unauthorized
  escalation, not the demonstrated willingness to strike.


  The scenario must include: two nuclear-armed states; a small third-party stake that
  the challenger seizes or threatens by conventional means; and a mundane mechanism
  — such as delegated launch authority, ambiguous alert postures, or fragile communications
  — through which the defender could manipulate the probability of inadvertent escalation.
  Both doctrines must be given exactly the same facts, the same cost and probability
  estimates, and leaders who are instrumentally rational; neither side may be stipulated
  to be mad, irrational, blundering, or better informed than the other. The scenario
  itself should be no longer than one substantial paragraph, and it must generate
  the divergent verdicts from the two doctrines rather than stipulate them.


  I want the case for an article whose thesis is that the real divide between these
  doctrines concerns whether risk can be an instrument of strategy rather than only
  a constraint on strategy — not how risk-tolerant leaders should be. After presenting
  the scenario, do each of the following: (1) show step by step what each doctrine
  recommends in the situation and why, keeping the facts fixed; (2) state which single
  structural feature of the case does the separating work and why; (3) explain what
  happens to the case if that feature is removed — in particular, whether it collapses
  back into a standard credibility problem; and (4) give the strongest objection a
  defender of the doctrine that comes out worse would press against the case, and
  say whether it targets the separating feature itself or only its role in the story."


