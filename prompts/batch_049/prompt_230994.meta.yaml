  - View A (classic rational deterrence / credibility constraint): threats must be
  credible to deter; you should only make threats you would rationally carry out ex
  post; a threat that would be irrational to execute is a bluff and will be discounted.

  - View B (Schelling-style brinkmanship/risk): credibility can come not from a conditional
  intention to retaliate but from deliberately raising the probability of an outcome
  no one wants; the threat "leaves something to chance."


