  "I just came from a long argument with a friend about whether term limits, rotation
  in office, and sortition improve institutions, and I realized that I have firm verdicts
  about particular offices but no clear principle behind them. I would like you to
  work out what principle, if any, captures my verdicts.


  Here are my verdicts, roughly in the form they came out in the argument.


  1. I oppose a two-term limit on a directly elected city comptroller. The office
  is technical and poorly monitored by the public, and a limit mostly transfers power
  to permanent staff and outside auditors.


  2. I support a two-term limit on a county sheriff. Long-serving sheriffs build personal
  machines, the office is coercive, and rotation interrupts that dynamic.


  3. I support selecting a citizens'' assembly by lot to redraw state legislative
  districts. The main risk is self-dealing, and ordinary citizens, with expert support,
  can handle a one-off map.


  4. I oppose selecting a monetary policy board by lot. The role requires technical
  competence and credibility in financial markets, and sortition would be reckless.


  5. I support keeping a state legislature''s budget committee in the hands of long-serving
  career legislators. Continuity lets them master the details and push back against
  the executive''s numbers.


  6. I support requiring the same legislature''s ethics committee to rotate its membership
  every session. Long service on ethics oversight makes it clubby, while frequent
  rotation keeps oversight adversarial.


  7. I oppose term limits for neighborhood council chairs, though not strongly. Turnover
  is already high, and the main cost would be lost local knowledge.


  8. I support a sortition-based climate assembly that recommends policy, but I would
  oppose giving it binding power: it is valuable as a one-off source of considered
  public judgment, not as a standing governing body.


  I am most confident in (3), (4), and (6), and least confident in (1) and (7); my
  friend came closest to moving me on (2).


  My tentative principle was that we should prefer career professionals where the
