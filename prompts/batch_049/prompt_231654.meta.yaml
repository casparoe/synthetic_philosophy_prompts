  "I just spent a long evening arguing with a friend about whether term limits, rotation
  in office, and sortition make institutions better, and we kept talking past each
  other: I have firm verdicts about particular offices, but I could not extract the
  principle behind them. I would like you to try."


  Then cases, maybe numbered:


  "Here are my verdicts, as they actually came out in the argument:


  1. I oppose a two-term limit on a directly elected city comptroller. The office
  is technical and poorly monitored by the public; the limit mainly moves power to
  permanent staff and outside auditors.


  2. I support a two-term limit on a county sheriff. Long-serving sheriffs build personal
  machines, and the office is coercive; rotation interrupts that.


  3. I support selecting a citizens'' assembly by lot to redraw state legislative
  districts. The main risk is self-dealing, and ordinary citizens with expert support
  can handle a one-off map.


  4. I oppose selecting a monetary policy board by lot. The role requires technical
  competence and market credibility; sortition would be reckless.


  5. I support staffing a state legislature''s budget committee with career legislators
  who have served a long time. The continuity keeps the budget stable and lets them
  check the executive''s numbers.


  6. I support requiring the same legislature''s ethics committee to rotate its membership
  every session. Long service on ethics oversight makes it clubby; frequent rotation
  keeps oversight adversarial.


  7. I oppose term limits for neighborhood council chairs, though not strongly. Turnover
  is already high, and the cost is lost local knowledge.


  8. I support a sortition-based climate assembly that recommends policy, but I would
  oppose giving it binding power. It is good as a one-off source of considered public
  judgment, not as a standing governing body."


  Then: "I have a tentative principle, but my friend showed it was too crude: the
  more technical the office, the more we should prefer career professionals; the more
  the office is about distributing power, the more we should prefer sortition or rotation.
  That principle handles some cases but not all—why do I treat the sheriff differently
  from the comptroller, and why does the same legislature require careerists on the
  budget committee but rotation on ethics?"


