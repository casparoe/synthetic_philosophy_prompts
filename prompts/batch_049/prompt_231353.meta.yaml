  dilemma without quite being one. I''d like a rigorous reading of that scene through
  the lens of the one-shot and iterated prisoner''s dilemma and the evolutionary account
  of cooperation. Take the scene seriously as a game: two boats, one carrying civilians
  and one carrying convicts, each with the detonator to the other; the Joker''s threat
  is that both boats die at midnight unless one uses it, and the boat that uses it
  survives. The turning points are a civilian who cannot bring himself to press the
