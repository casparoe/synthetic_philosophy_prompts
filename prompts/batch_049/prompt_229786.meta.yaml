  Logical space for convention/norm accounts:


  Question stems:

  1. Is the regularity accompanied by a genuine normative attitude (ought, blame,
  entitlement to sanction) or merely by expectations about behavior?

  2. If normative: do the normative expectations depend on empirical expectations
  (everyone conforms to a pattern) plus conditional preference to conform when those
  expectations hold?

  3. If non-normative: does the regularity persist because each individual best-responds
  given others'' behavior, and is the mutual expectation represented or just selected?

  4. Does the account require common knowledge of the regularity and of preferences?

  5. Does the account require that the regularity solve a coordination problem (interests
  roughly coincident) or can it arise from conflict/mixed motives with sanctions?

  6. Does the account allow a convention to arise via evolution/learning without the
  agents'' awareness?


  Leaves:

  - Lewisian convention: regularity R in population P, members of P have common knowledge
  that members conform to R and prefer to conform conditional on others conforming,
  and there''s an alternative regularity R'' that would serve as well (arbitrariness).
  Convention as equilibrium of a coordination game.

  - Skyrms-style evolutionary convention/signaling: R arises and persists as an evolutionarily
  stable strategy (or learned equilibrium) in repeated interactions; no need for common
  knowledge or representation of a rule; can include signalling systems where arbitrary
  signals acquire meaning.

  - Bicchieri-style social norm: R is a behavioral rule plus empirical expectations
  (others do R) and normative expectations (others believe one ought to do R and may
  sanction deviance); conditional preference to follow if you believe sufficiently
  many others do and expect you to. Unlike Lewis, norms can be non-coordination and
  can be bad for most; why people obey.

  - Deflationary regularity/habit: no normative ingredient; R is just a correlated
  pattern / habit, with maybe feelings of familiarity; no ought, no blame beyond preference.


