  legal practice confuses death with a convenient criterion. Rounds:


  (1) D. says: brain death isn''t really death; it''s a legal fiction designed to
  let doctors take organs before circulation stops. A brain-dead body still has a
  beating heart, warm skin, and cells functioning, so calling that person "dead" smuggles
  in a controversial definition. The real, biological death is when the whole organism
  irreversibly ceases integrated functioning — circulatory death.


  (2) M. replies: that''s not a fiction; it''s the standard medical and legal definition
  refined over decades. Circulation isn''t the point — the brain is the organism''s
  integrating organ. Once the whole brain is destroyed, the body is no longer an integrated
  whole but a collection of organs maintained by a ventilator. And "brain death" is
  not chosen for transplants; it was accepted because it captures when the person
  is gone.


  (3) D. counters: but the body of a brain-dead patient *is* integrated in many ways
  — homeostasis, wound healing, even gestation can continue in a brain-dead pregnant
  woman. So the "integrated functioning" argument is empirically false. And if we
  picked the brain because of which functions matter to us, that''s a philosophical
  choice about personhood, not a biological fact.


