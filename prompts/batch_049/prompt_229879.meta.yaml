  Last month I watched a biopic with two friends, Elena and Marcus. The film portrays
  a real, now-deceased, early-twentieth-century painter [or writer]. It includes a
  central scene in which the painter, near the end of her life, reconciles with an
  estranged child [or "her estranged daughter"]. The scene is invented: no such reconciliation
  happened, and the filmmaker has acknowledged inventing it to give the narrative
  a redemptive arc. The film is framed as a dramatization, though many viewers will
  take the scene to be historical. Afterward Elena and Marcus got into an argument
  I still cannot settle.


  Elena began: the invented scene wrongs the woman it depicts. A person''s life is
  not only a sequence of events but also the story those events compose, and someone
  who spent decades building a body of work and answering for her choices has a stake
  in how that story is told, even after she is gone. To falsify its ending is to falsify
  her, not merely to describe her inaccurately.


  Marcus answered: the dead are not subjects. They have no experiences, no preferences,
  no felt interests. Whatever is wrong with the scene must therefore be a wrong done
  to the living—to the audience misled about who this person was, and to the public
  record. You cannot wrong someone who no longer exists.


  Elena replied: that locates the wrong in the wrong place. If the problem were only
  that viewers are misled, then a version of the film that was clearly labeled fiction—or
  a fiction in which nobody believed—would be unobjectionable. But I would still object,
  because the content disrespects her; the act is directed at the person depicted.


  Marcus: I would still object too, but to something else: the corruption of shared
  historical memory. Detachment from records doesn''t remove the problem; it just
  shows the problem isn''t the dead person''s rights but the integrity of the practice
  by which the living remember and learn from the past.


  Elena: So on your view, a flattering invention—one that erases someone''s genuine
  cruelty and leaves the living feeling comfortable—also has no victim among the dead.
  It might even be welcomed by the living. Yet I suspect you don''t think that''s
  fine; and if it isn''t fine, the dead person''s standing is doing work you refuse
  to admit.


  Marcus: It isn''t fine, but the grounds are different. We owe truthfulness about
  the dead because of what dishonest memory does to living inquirers and to vulnerable
  people whose own stories are shaped by those retellings. That''s an epistemic and
  social duty, not a debt to a posthumous subject. You keep treating "her story" as
  if it were a possession she never relinquished.


  Elena: And you keep treating the dead as raw material for the living''s edification.
  My point is not that I desire some ghostly wellbeing. It''s that there are person-directed
  duties—duties of fidelity, recognition, and non-defamation—that don''t simply expire
  when the person dies. That''s why we don''t think "she''s dead, so say what you
  like about her" is sound. The duties run to her, not only to the archive.


  Marcus: But notice what your examples trade on. Defamation ruins a reputation that
  still exists in the living world, and people still alive care about and are affected
  by that reputation. You can explain everything with the interests of the living
  plus the value of truthful public memory. You posit a rights-bearer beyond the grave;
  I think that''s a metaphysical extravagance, and we shouldn''t buy it without necessity.


