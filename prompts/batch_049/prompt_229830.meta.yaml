  - Opening: someone without academic background, thinking on their own. E.g., "I''m
  not a philosopher — I work in [something] — but I''ve been unable to stop thinking
  about..." Or avoid specifying job. "I''m not an academic; I tend to work through
  ideas by turning them over on long walks. Lately I''ve been turning over Descartes''s
  claim that animals are unthinking machines, because it seems to me that Planet of
  the Apes is exactly a thought experiment about that claim."

  - Describe Descartes'' view (paraphrase, no quotes): Descartes held that nonhuman
  animals are automata: they lack language and therefore lack thought; their cries
  and struggles are mechanical, like a clock, not evidence of inner feeling. He treated
  the capacity for language as the surest outward sign of a mind. The asker''s own
  thought: The 1968 Planet of the Apes inverts this: apes have language and treat
  mute humans exactly as Descartes says we may treat animals — as brutes fit for cages,
  labor, and experiment. The twist (statue of liberty) reframes it.

  - Ask: Read the film through Descartes'' animal minds. Does the film refute Descartes,
  or does it accept his criterion and merely flip which species satisfies it? Where
  does the film probe the criterion itself — e.g., do Zira and Cornelius'' sympathies,
  Taylor''s treatment, or the final reveal show what''s wrong with using a single
  trait as a gate for moral standing? Does the film conflate two Cartesian claims
  (animals lack language; animals lack feeling) and does it show they can come apart?
  The film''s apes apply the criterion to mute humans, but does that make the criterion
  absurd or just show its dangerous reversibility?

