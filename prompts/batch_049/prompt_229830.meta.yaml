  Let me draft the prompt:


  ---


  I''m not an academic and have never studied philosophy formally, but I''ve spent
  a lot of my own time thinking about a puzzle that comes from putting Descartes next
  to the 1968 film Planet of the Apes, and I''d like to see someone qualified work
  it through properly.


  As I understand it, Descartes held that nonhuman animals are essentially machines:
  they lack language, and since language is the only outward sign we have of thought,
  we have no reason to think they think or feel; their cries and struggles are no
  more evidence of a mind than a clock''s striking. The film seems to me to be a direct
  test of that picture. Its apes have language and organized society, while the humans
  they cage, hunt, and experiment on are mute and treated as brutes. The apes, in
  other words, apply to humans exactly the sort of reasoning Descartes applied to
  animals — and the audience is shown, constantly, that the mute humans feel fear,
  loyalty, pain, and grief.


  I''d like you to read the film through Descartes''s view of animal minds. Here is
  my working suspicion, which I want you to test rather than simply confirm: the film
  does not so much refute Descartes as accept his criterion — language as the gate
  to moral status — and show that the criterion is dangerous because it is reversible;
  whoever holds it can end up on the wrong side of it. But I''m not sure that''s right,
  and I keep going back and forth about whether the film instead rejects the criterion
  outright, or confuses two separate Cartesian claims (that animals lack language
  and that animals lack feeling) and lets the confusion do the dramatic work.


  Please work as a professional philosopher specializing in early modern philosophy
  and animal cognition. Think carefully, and before you settle on a reading, briefly
  brainstorm two or three distinct ways the film could be read against Descartes —
  say, (a) as a refutation of the language criterion, (b) as a demonstration of the
  criterion''s reversibility rather than its falsity, (c) as something else — and
  then explain which reading you find most faithful to both the film and the philosophy,
  and why. Then develop that reading in detail. I''d like you to stay honest where
  the film resists the lens: the ape society is as much about caste, religious authority,
  the suppression of evidence, and nuclear war as about animal minds, and a good reading
  should not pretend otherwise. End by saying what the film contributes to the philosophical
  debate about animal minds that argument alone doesn''t, and where a Cartesian would
  have a reasonable reply.


