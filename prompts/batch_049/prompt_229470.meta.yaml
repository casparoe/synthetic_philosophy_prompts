  Key ideas in secession literature:

  - Remedial Right Only theories (e.g., Allen Buchanan): groups have a (moral/legal)
  right to secede only as a remedy for serious injustices — e.g., persistent violations
  of human rights, unjust annexation, maybe discriminatory redistribution. Not a general
  right for any group with a majority. This is often contrasted with Primary Right
  theories.

  - Primary Right theories: two variants — plebiscitary (ascriptive) theories: any
  group that can constitute a majority in a portion of the territory and votes for
  independence has a right to secede (e.g., based on self-determination or associative
  freedom). And ascriptive-group theories: nations as such have a right to self-determination
  including secession (national self-determination).

  - Common objections: the "anarchic" slide — plebiscitary rights would let any region
  secede at will, leading to fragmentation and instability; it ignores the legitimate
  interests of the state and of minorities within the seceding territory.

  - Buchanan distinguishes between the moral right to secede (remedial) and the question
  of what international law should recognize (he argues for a remedial right in international
  law, partly for institutional/moral reasons, to avoid perverse incentives). Actually,
  Buchanan''s "remedial right only" is about what international law should recognize
  as a general right; he is careful: there may be special cases where secession is
  morally permissible without prior injustice (e.g., mutual consent, constitutional
  provisions), but not a general primary right.

  - Quebec/Catalonia/Scotland raise issues: does a majority vote in a sub-unit suffice?
  The Canadian Supreme Court''s Reference re Secession of Quebec (1998) held that
  unilateral secession is illegal but if a clear majority votes yes on a clear question,
  the rest of Canada has a constitutional duty to negotiate — a kind of constitutionalized
