  ---


  I''m a software engineer working on a planning system that has to make allocation
  decisions under uncertainty, and I''ve been reading about decision theory in my
  spare time to understand a disagreement that has come up repeatedly among my colleagues.
  The disagreement concerns whether our system should treat known probabilities and
  unknown probabilities differently. In trying to settle it, I kept running into the
  Ellsberg paradox and the decades-long debate around ambiguity aversion, and I was
  surprised by how little the debate seems to have converged despite the empirical
  result being uncontested. In the standard two-urn version, people prefer a bet on
  drawing a red ball from an urn known to contain fifty red and fifty black balls
  over the same bet on an urn with an unknown mix of a hundred red and black balls;
  they also prefer betting on black from the known urn over betting on black from
  the unknown urn. Those two preferences cannot be represented by any single assignment
  of probabilities to the unknown urn, so the phenomenon is usually described as ambiguity
  aversion. But after that point, the literature splinters: some treat ambiguity-averse
  choices as a bias that a rational agent should correct, some treat them as a reasonable
  response to missing information, some argue that the right response is to model
  ambiguity with non-additive probabilities or sets of priors, and some argue that
  risk and ambiguity are simply different kinds of uncertainty that should not be
  forced into one preference framework.


  Since nobody disputes what people in fact choose, and since the competing theoretical
  responses have apparently coexisted for a long time without moving one another,
  I have started to suspect that the disagreement is not really about the evidence.
  My working hypothesis is that it is a disagreement about what a theory of rational
  choice is supposed to be accountable to — whether revealed choices constrain what
  rationality must mean, or whether our standards of rationality determine which choices
  count as informative — but I don''t have the training to be confident in that diagnosis.
  What kind of disagreement is this, actually: a hidden factual or formal dispute,
  a difference in normative starting points, or a case where the two sides are answering
  different questions under the same heading? Given your diagnosis, what would actually
  count as progress — a formal result, a conceptual distinction, a different kind
  of experiment — and if the debate shouldn''t be expected to settle, I''d like to
  understand why not.


