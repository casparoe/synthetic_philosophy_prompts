  Sketch:

  After retiring from experimental physics/chemistry, I''ve been reading Peirce. Commitments:

  1. I accept the pragmatic maxim: the whole meaning of a concept is the sum of its
  conceivable practical bearings — but I treat it as a rule of clarification rather
  than a theory of truth.

  2. I accept Peirce''s taxonomy of the fixation of belief: tenacity, authority, a
  priori, and science; only the method of science is self-correcting, because it alone
  lets an external permanence override one''s private preferences.

  3. I am a fallibilist about scientific knowledge: any claim whatsoever could in
  principle turn out false; no synthetic statement is immune.

  4. But I also take certain well-established findings — the second law of thermodynamics,
  the common descent of life, the atomic constitution of matter — to be so entrenched
  that no responsible inquirer treats them as live candidates for rejection; and I
  would consider a person who suspended judgment on them unreasonable rather than
  merely mistaken.

  5. I believe in the reality of unobservable entities (electrons, selection, etc.)
  and hold that they exist mind-independently, not merely as shorthand for observations.

  6. I also hold that any genuine difference in reality must be able to make some
  conceivable difference in practice; if two theories agree on every conceivable observation,
  the difference between them is verbal.

  7. I regard truth as what inquiry would settle on in the long run, but I also suspect
  there are facts that would resist even ideal inquiry.


