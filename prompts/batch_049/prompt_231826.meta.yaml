  whether they act on the same entity-activity chain at the same stage.

  3. But I also judge that when two pathways converge on a bottleneck step and get
  modulated by the same inhibitor, they should count as the same mechanism for the
  purposes of explanation, even if upstream regulatory parts differ.

  4. I think mechanisms are individuated relative to a phenomenon of interest; a chain
  may be one mechanism in one explanatory context and a mere part of a larger mechanism
  in another.

  5. Yet I am suspicious of this relativity because it seems to allow any two systems
  to count as the same mechanism when we squint; I want there to be a fact of the
  matter about mechanism identity, not just a pragmatically chosen level.

  6. In anomaly detection: I treat a failed prediction not as evidence against the
  core mechanism but against auxiliary assumptions (that the perturbation hit only
  the intended target, that the cell line was not already stressed, etc.) unless the
  anomaly persists across independent replicates and multiple strains — in other words,
  I make mechanisms hard to falsify by single surprising observations.

  7. But I also accept that a mechanism is a hypothesis like any other and should
  be revisable by any evidence, however singular.


