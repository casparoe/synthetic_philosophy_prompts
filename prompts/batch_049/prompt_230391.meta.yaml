  Draft: "I''m putting together a long feature on the Viennese philosopher Moritz
  Schlick — not the usual epistemology, but his mostly forgotten interwar essay on
  the meaning of life. His view, stripped down, was that the question ''What is the
  meaning of life?'' is ill posed if it demands that life serve some purpose outside
  itself; purposes can justify means but not the final end. Meaning, he argued, is
  not a goal one reaches but a quality of activity done for its own sake, which he
  opposed to goal-directed work and called play — roughly, absorption in something
  you do for the delight of doing it, not for what it produces. He died in 1936. Decades
  later, empirical psychologists independently developed the construct of flow: an
  absorbing, intrinsically rewarding state in which action and attention merge, time
