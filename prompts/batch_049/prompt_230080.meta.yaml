  The Absent-Minded Driver problem from Piccione and Rubinstein: a driver on a highway.
  At each of two intersections he can "exit" or "continue". Exiting at the first gives
  payoff 0. Continuing at the first and exiting at the second gives payoff 4. Continuing
  at both gives payoff 1. He is absent-minded: when he reaches an intersection, he
  doesn''t know whether it''s the first or second. Strategy: a probability p of exiting
  at *each* intersection (since he can''t distinguish). The decision must be made
  ex ante for the "plan". Expected payoff: p*0 + (1-p)*p*4 + (1-p)^2*1 = 4p(1-p) +
  (1-p)^2. Max over p: derivative 4 - 8p - 2 + 2p = 2 - 6p = 0 → p = 1/3. Expected
  payoff at p=1/3: 4*(1/3)*(2/3) + (2/3)^2 = 8/9 + 4/9 = 12/9 = 4/3. But at the second
  intersection (upon reaching it, conditional), continuing gives payoff 1 vs exiting
  gives 4, so exiting is clearly better; if he could reason "I''m at some intersection"
  and update, there''s a conflict: from the ex ante plan, rational to randomize at
  1/3, but from the actual decision node second intersection, continuing is worse?
  Wait exiting at second gives 4, continuing gives 1. So at second intersection always
  exit. But at first intersection if he exits gives 0, continue leads to second. Since
  he can''t distinguish, strategy is same at both. The paradox: CDT/EDT evaluations.
  The ex ante optimal plan randomizes 1/3, but once at an intersection, if he believes
  he might be at second, he wants to update. Actually fine.


