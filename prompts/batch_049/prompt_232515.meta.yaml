  Actually the classic Kripkenstein setup: You have performed addition only with numbers
  <57. Now you''re asked 68+57. The skeptic says: maybe by "plus" you meant "quus"
  where quus = x+y if x,y<57, otherwise 5. Then the correct answer (given your past
  use) is 5, not 125. The problem: what fact about you determines that you meant plus,
  not quus?


  So for the case-verdicts type, the asker can report verdicts about:


  Case A: The ordinary case — past uses 2+3=5, 10+25=35; now 68+57. They answer 125.
  Verdict: they''ve followed the original rule.


  Case B: The skeptic''s quus case — someone has the same history but answers 5, claiming
  "I always meant quus." Verdict: they haven''t followed the original rule, but they
  may have followed a different rule. Is that right?


  Case C: A community where everyone says 5 for sums above 57, and they call it "addition";
