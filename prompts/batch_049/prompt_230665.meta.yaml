  fee, and is pleased to offer the next exchange whenever the frame shifts. Over a
  cycle, Merrick returns to his original state — original object, original commitment,
  original money except for the fees — and when the full cycle is displayed to him
  at once, he can identify no single step he would repudiate as false to his then-current
  self. And yet the sequence as a whole transfers wealth to the facilitator, contrary
  to everything Merrick says he wants.


