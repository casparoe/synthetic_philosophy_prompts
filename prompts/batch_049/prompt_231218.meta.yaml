  Williams''s essay "A Critique of Utilitarianism" in J.J.C. Smart and Bernard Williams,
  Utilitarianism: For and Against (1973). Key components:

  - Consequentialism (utilitarianism) has a "negative responsibility" doctrine: we
  are just as responsible for what we allow or fail to prevent as for what we bring
  about. This demands that we always act so as to produce the best available state
  of affairs, and it makes us responsible for everything that happens. This is the
  "responsibility" problem.

  - The Jim and Pedro case: Jim, a botanist, arrives in a South American town where
  a captain has 20 Indians lined up to be shot for protesting. Jim is offered: kill
  one Indian himself and the other 19 go free; refuse and all 20 are shot. Williams:
  a utilitarian would say Jim should kill one (simple one-against-nineteen calculation).
  Williams argues this fails to respect Jim''s integrity — the fact that Jim has become
  the instrument of another''s will, that his own projects and commitments (e.g.,
  against killing) are only counted as a disutility if his future feelings are bad.
  The utilitarian would treat Jim''s reluctance as a "self-indulgent squeamishness"
  (Williams uses "squeamishness" word). But Williams also says it''s not obvious that
  refusing is right; the point is that utilitarian reasoning misrepresents the dilemma:
  there''s no right answer via simple calculation; whatever Jim does, something is
  lost. Actually Williams says utilitarianism''s choice (kill) might or might not
  be what Jim should do; the objection is to how utilitarianism reaches it and what
  it does to Jim''s relationship to his own acts.

  - Integrity: the idea that a person has deep projects and commitments (ground projects)
  that give life meaning; utilitarianism treats the agent as a mere channel for outcomes
  and requires abandoning those projects whenever the sums come out. "One thought
  too many": the example of the man faced with two people drowning, one his wife.
