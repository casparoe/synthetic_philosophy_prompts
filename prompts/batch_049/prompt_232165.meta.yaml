  Hindsight bias: the phenomenon where people, after learning an outcome, overestimate
  how predictable that outcome was ex ante. Classic experiments: Fischhoff (1975)
  gave people a historical scenario and outcome probabilities; people who knew the
  outcome said it was more likely. Also "creeping determinism."


  Narrative fallacy: Taleb''s term (from The Black Swan): humans construct post hoc
  narratives that make events seem causally inevitable, underestimating randomness.
  In historical explanation, the danger is that historians impose coherent stories,
  select evidence that fits, treat actual outcomes as overdetermined, and fail to
  respect contingency.


  Central philosophical issue: the difference between genuine causal explanation and
  narrative coherence/retrodiction. A theory of historical explanation should:

  - Keep ex ante and ex post perspectives distinct: what was predictable before vs.
  what became intelligible after.

  - Respect contingency (events could have been otherwise) without falling into "anything
  goes."

  - Not treat narrative elegance as evidence of explanatory truth: hindsight bias
  and narrative fallacy must be calibrated.

  - Avoid treating the fact that an event happened as evidence that it was likely/fated.

  - Handle counterfactuals: explanations in history rely on implicit counterfactual
  claims, but counterfactual history is notoriously ungrounded; an adequate theory
  must say how to constrain them.

  - Distinguish "explanation sketches" from full explanations; distinguish causes
  from causes that matter.

  - Account for the selection effect: historical records are themselves produced by
  the outcome (survivorship) — the "archive" is biased by what happened.

  - Possibly result: a "seamless narrative" and "respect for contingency" might be
  in tension; there may be a trade-off between narrative unity and counterfactual
  openness.


