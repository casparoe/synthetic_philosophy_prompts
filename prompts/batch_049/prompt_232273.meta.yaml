  ---


  I''m the science editor for a general-interest weekly''s health-and-social-science
  section, and a longtime reader of rationalist blogs and forums. I''m not looking
  for a primer: I already accept the points that heritability is a sample- and environment-specific
  partition of variance; that it is not a trait constant, not a statement about any
  individual, and not a measure of immutability; and that within-group heritability
  licenses no inference about between-group differences. What I need is to turn those
  points into a reusable editorial procedure.


  Every week my desk has to decide, from press releases and abstracts, whether to
  run stories on new human-genetics findings — twin studies, SNP-based estimates,
  family studies, polygenic-score results. A decision takes about fifteen minutes
  and carries real stakes because our readership is general and a bad headline survives
  any correction. The decision is: run, run with heavy caveats, or kill; and if we
  run, exactly how the headline and the opening paragraphs may phrase the finding,
  with the one or two non-negotiable caveats.


  Please write me a fact-checking checklist, in the order the steps should be applied,
  that a literate but non-specialist colleague could follow. For each step, state
