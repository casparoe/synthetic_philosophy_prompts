  Let me flesh out the analogical mappings and disanalogies so my prompt asks precisely.


  Lakatos research programme:

  - Hard core: irrefutable by methodological decision; the central theses not to be
  tested.

  - Protective belt: auxiliary hypotheses, initial conditions, observational theories
  that can be adjusted.

  - Negative heuristic: "don''t aim modus tollens at the hard core."

  - Positive heuristic: a research policy, plan for how to develop the belt.

  - Progressive problemshift: modifications yield novel predictions, some corroborated.

  - Degenerating problemshift: modifications are ad hoc, post hoc, no new predictions.


  Software analogy:

  - Hard core ~ core abstractions/invariants/architecture you refuse to break, largely
  protected by code review/design decisions.

  - Protective belt ~ peripheral modules, adapters, compatibility shims, config layers
  that absorb change.

  - Negative heuristic ~ rule "don''t rewrite core; wrap or patch."

  - Positive heuristic ~ roadmap/architecture design principles.

  - Progressive programme ~ refactors that add capability and yield successful new
  features (predictions).

  - Degenerating ~ legacy code where each bugfix adds a shim/patch to pass the failing
  test without increasing generality.


  Disanalogies:

  - A scientific research programme makes claims about the world via empirical observation;
  code is an artifact whose correctness is specified by tests/humans, not nature.
  Novel facts are empirical predictions; features are desires of users, not discoveries.

  - Deciding to protect the core in Lakatos is a methodological convention, partly
  because falsification is not decisive; in software, protecting core is an engineering
  tradeoff about cost/risk, and tests can be decisive about local behavior.

  - Software has a wider refactoring possibility: you can rewrite entirely; Lakatos''s
  hard core is constitutive — changing it changes the programme (you''re no longer
  doing that programme). In software, changing the core is often possible though expensive.

  - The normative status: Lakatos says it''s rational to protect a progressive core;
  but failing tests in software may genuinely mandate core changes; the analogy may
  license an unjustified conservatism about scientific theories.

  - The "predictions" in software are not predictions at all unless it''s simulation/modeling;
  no independent reality to verify.

  - Lakatos is in the context of rational reconstruction/history; software is a designed
  system with an author/maintainer and explicit requirements; science has no such
  requirement-set.


