  Draft:


  "I am a software engineer with no formal training in philosophy. In technical discussion,
  I have repeatedly encountered the claim that a Lakatosian scientific research programme
  is best understood as analogous to a mature, long-lived software codebase, and the
  comparison is usually recruited to argue for a certain kind of conservatism: that
  one should not abandon a long-running scientific theory (or, by extension, a large
  system) merely because a single test fails; instead one should patch the peripheral
  code—the protective belt—until the accumulated cost of patching outweighs the benefits,
  and the theory can be judged only by its long-run trajectory. The mapping, as I
  have heard it, runs roughly: the hard core corresponds to the core modules or architectural
  invariants that are deliberately shielded from change; the protective belt to peripheral
  modules, adapters, and compatibility shims that absorb requirement changes; the
  negative heuristic to a rule against modifying core code and modifying surrounding
  code instead; the positive heuristic to the system''s architectural roadmap; a progressive
  problemshift to a codebase whose refactors enable genuinely novel capabilities;
  and a degenerating problemshift to a legacy system in which each new requirement
  forces another ad hoc patch that only passes the current test.


  How far does this analogy actually hold? I would like a correspondence table that
  maps each element of a Lakatosian research programme to its software counterpart
  (and flags where no counterpart exists), an account of where the mapping breaks
  in ways that matter for the conservatism it is used to support rather than in incidental
  ways, an account of what the software metaphor quietly imports into the philosophy
  of science that is not there in Lakatos (for example, assumptions about design,
  authors, and requirement specifications), and a verdict on whether the anti-falsification
  conclusion survives once the disanalogies are on the table. If there is a better
  analogy from software or engineering that captures Lakatos''s picture more faithfully,
  please offer it."


