  Prompt draft:


  "ok so I''ve been chewing on whether a bigger population is a better world, and
  I wrote down where I''ve landed. I want to know if this set of views actually hangs
  together:


  1. If a child would have a happy life, then choosing to have that child makes the
  world better than choosing not to.

  2. But I also think it''s totally fine, morally, to stop at one or two kids; a couple
  that could have a happy third child isn''t doing anything worse by not having one,
  and no one owes the world another happy person.

  3. I think if humans went extinct painlessly, that would be one of the worst things
  ever, and most of why it''s bad is that future happy people would never get to live.

  4. But I also think a world with a hundred billion people whose lives are barely
  more good than bad is worse than a world with a few billion people whose lives are
  deeply good, even though the first world has way more total happiness.

  5. And I don''t think average happiness is the right measure either, because then
  a happy person who is just below average would count as bad to add, and that seems
  wrong to me.


  Are these consistent? Go through the pairs and tell me which ones are actually in
  tension and which only look like they are. For the real tensions, rank them by how
  serious they are, say what the cheapest fix would be for each, and then tell me
  which single revision of one of these would clean up the most."


