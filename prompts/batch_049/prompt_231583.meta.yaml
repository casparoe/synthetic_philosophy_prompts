  we say about someone who does the right thing while sincerely believing, by their
  own lights, that they are doing wrong? Huck looks like a case of exactly this. He
  has absorbed the morality of the slaveholding society around him and repeatedly
  tells himself that helping the runaway Jim is theft and sin, and that his duty is
  to turn Jim in; at the decisive moments he helps Jim anyway, at what he takes to
  be the cost of his own salvation. I want a reading that takes both the novel and
  the moral-psychology debate seriously. Where would you locate moral worth in Huck''s
  choices — in his sympathy, his unarticulated perception of Jim, his rational judgment,
  something else — and does any standard theory of acting for the right reasons survive
  contact with his case? Which scenes would you have the group work through closely,
