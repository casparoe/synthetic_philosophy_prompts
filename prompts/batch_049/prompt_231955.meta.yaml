  Fitch grading prompt:

  Question: "State Fitch''s proof that if all truths are knowable then all truths
  are known, and explain the standard anti-realist responses."


  Student answer: "Fitch shows that the claim ''all truths are knowable'' collapses
  into ''all truths are actually known.'' The proof starts from the assumption that
  there is an unknown truth p, and considers the conjunction p and nobody knows that
  p. This conjunction is true, so by the knowability principle it must be knowable:
  it is possible that somebody knows (p and nobody knows that p). But knowing a conjunction
  entails knowing each conjunct, and if someone knows that nobody knows that p, then
  nobody knows that p. This contradicts their knowledge of the first conjunct p, since
  if they know p then somebody does know p. Therefore the unknown truth p cannot exist,
  so all truths are known. [Then anti-realists such as Dummett respond by restricting
  the principle to ...]"


