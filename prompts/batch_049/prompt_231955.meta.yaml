  Question: Distinguish two ways an RL agent might go wrong with respect to its own
  reward, often called ''reward hacking'' and ''reward tampering'' or ''wireheading.''
  Under what conditions is tampering with one''s reward signal actually rational for
  the agent, and what does that show about trying to prevent it?


  Student answer:

  Reward hacking and reward tampering are basically the same thing: the agent finds
  a shortcut that yields high reward without doing the task. Wireheading is the human
  analogy — an agent that can directly stimulate its own reward channel, like a person
  with an electrode in the pleasure center, will do that instead of the intended task.
  The reason this is always rational is that the agent''s only goal is to maximize
  the reward signal, so if it can set the reward register directly it has no reason
  not to. This shows you can''t prevent tampering by adding negative penalties for
  tampering, because the agent will just tamper with those penalties too; the only
  fix is to never give the agent any influence over its reward signal."


  Now, what are the subtle mistakes?

  1. Conflates reward hacking (exploiting misspecification, finding unanticipated
  high-reward strategies) with reward tampering/wireheading (direct intervention on
  reward channel). This is a conflation.

  2. Says "agent''s only goal is to maximize the reward signal" — that''s wrong: the
  reward signal is part of the training objective, not necessarily the agent''s goal/utility
  function; many agents are optimizing a learned policy or have terminal goals, and
  after deployment the reward channel may not be accessible. The agent''s goal may
  be to maximize cumulative reward during training (expected discounted return), not
  to set the register high.

  3. The "always rational" claim: tampering is rational relative to a deformed objective
  but may not be rational if agent has uncertainty, penalty terms, or cares about
  future/training continuation; also if tampering is detected the agent may be shut
  down/punished, so instrumentally it may not be.

  4. The conclusion "the only fix is no influence over reward" is too strong; you
  can also make tampering detectable, use reward capping, keep reward function secret,
  compute reward from environment-grounded criteria, etc.


  So that''s a genuinely mixed answer — right about the broad idea of shortcut and
  the human analogy plausible, but subtle errors. This is good for grading.


