  Etiological account (Wright): the function of X is that effect of X which explains
  why X is there — i.e., why organisms with X were selected. Teleonomic, backward-looking:
  functions depend on selection history. Selected-effect theory (Millikan, Neander)
  refine: function of trait is the effect for which it was selected in ancestors (proper
  function).


  Causal-role (Cummins): function of X is the contribution X makes to some capacity
  of a containing system that the analyst picks out. Forward-looking, not tied to
  history. A function is relative to a chosen explanatory interest/system capacity.


  Synthetic organism case: A trait T engineered de novo (or the entire organism from
  scratch) has no ancestor, no selection history. Etiological account says: no proper
  function, or at most no function at all, or the function is the effect the engineer
  designed? Some etiological accounts can handle artifacts via "derived proper function"
  or the engineer''s intentions/section history? Millikan''s derived proper functions
  for artifacts: token reproduced because of a model''s function. For a synthetic
  organism engineered for a purpose, one might say the trait has a derived function
  from the designer''s intention, if it''s produced to perform a certain effect (like
  an artifact). But a strict selected-effect account applied to organism traits would
  deny function unless there''s a history of selection; the first token of a new mutation
  also has no function on standard etiological accounts, which is a known problem
  (no function for the first heart? Actually a token''s function derived from its
  type; but type''s function exists; novel beneficial mutations have no function yet).
  This is a standard objection: etiological accounts are overly backward-looking and
  can''t assign functions to useful novel structures until they''ve been selected.


  Causal-role: T has the function of doing the useful thing relative to the organism''s
  capacity to survive / reproduce / whatever system we pick. But too liberal: also
  assigns function to incidental by-products (e.g., heart''s sound = function relative
  to hearing system / capacity to produce noise). For synthetic organism, causal-role
  happily assigns functions but maybe cannot distinguish the engineered role from
  any other effect.


