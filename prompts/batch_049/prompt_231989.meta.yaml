  by context; and the case should be one where transworld identity says YES and counterpart
  theory says NO (rather than the usual vague "depends"). Then walk through each theory''s
  reasoning and say which feature does the work.


  The usual direction: counterpart theory says many de re modal claims come out true
  that transworld identity might not? Hmm. Actually the more standard difference:
  transworld identity can tolerate "could have been radically different in all intrinsic
  respects" (because identity is not similarity), whereas counterpart theory may resist
  because counterparts must be similar. So a case: an object that could undergo total
  qualitative change while remaining itself. Transworld identity: yes — identity is
  primitive, qualitative change across worlds no bar. Counterpart theory: counterpart
  relation is similarity-based, and actual-world counterpart relation might be too
  strict to find a counterpart in a world where the object is totally different; so
  "could have been totally different" comes out false (or context-dependent).


  But is that right? Lewis''s counterpart theory allows very lax counterpart relations
