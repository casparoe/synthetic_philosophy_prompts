  The frame problem: classic (McCarthy & Hayes 1969): in a logic-based agent, to reason
  about the effects of an action you need not only the changed facts but also many
  "frame axioms" stating what doesn''t change. Solutions: default logic, circumscription,
  event calculus, successor-state axioms. The Yale shooting problem (Hanks & McDermott
  1987) showed that just minimizing change gives wrong results in temporal projection.


