  in the intended context, the most salient counterpart relation weights actual intrinsic
  character highly, so no sufficiently similar counterpart exists in the totally-different
  world. Meanwhile transworld identity says the very same object is there regardless.
  The feature doing the work: whether cross-world sameness is taken to be primitive
  identity or context-relative similarity. Removing the total-dissimilarity feature
  collapses to agreement.


