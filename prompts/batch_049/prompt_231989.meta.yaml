  Counterpart theory vs transworld identity: the classic difference: transworld identity
  says an object literally exists in multiple possible worlds (or can have identity
  across worlds, with the same object having different properties), while counterpart
  theory (Lewis) says no object exists in more than one world; instead, each object
  has counterparts in other worlds — objects sufficiently similar in relevant respects
  — and de re modal claims are analyzed via counterparts.


  What''s a designed scenario where the two theories diverge or agree? The obvious
  divergence: "I could have been an astronaut" — transworld identity: there''s a possible
  world where I (this very object) am an astronaut. Counterpart theory: there''s a
  possible world containing a counterpart of me who is an astronaut. Divergence arises
  in cases with multiple candidates for identity vs. counterpart relations, e.g.,
  "the statue and the lump" cases, or cases involving branching/fission — e.g., "If
  my parents had never met, could I still exist?" Transworld identity might say yes
  (I am a primitive thisness/haecceity that can exist with different origins), counterpart
  theory might say depends on counterpart relation (closest counterpart might be...
  no one? or a sibling?). Actually origins essentialism complicates.


  A classic niche issue: counterpart theory has trouble with "Humphrey objection":
  Kripke criticized Lewis, saying Humphrey cares about whether *he himself* might
  have won, not whether some counterpart wins. But that''s standard.


  More in the weeds: counterpart theory''s handling of modal predication and the problem
  of "multiple counterpart relations" / "inconstancy" — e.g., the statue and the clay:
  "the statue could have been made of a different lump." Under counterpart theory,
  depending on which counterpart relation is selected (statue-counterpart vs. lump-counterpart),
  different truth values. Transworld identity handles it by... hmm.


  Actually, could build a thought experiment with two theories agreeing on the referent
  but disagreeing on what is said — but that''s philosophy of language, not our domains.


  Let''s focus on a scenario with the target: isolate the variable of "sameness across
