  modal profile seems to require the same object across worlds, but where counterpart-theoretic
  similarity can mimic identity verdicts unless a specific feature is added: e.g.,
  extreme inconstancy/flux where similarity fails to pick out a unique counterpart
  but identity is clear.


  Possible prompt idea: Construct a thought experiment in which counterpart theory
  and transworld identity theory deliver opposite verdicts about whether a particular
  modal sentence is true (e.g., "Arthur could have been entirely different from how
  he actually is"), with constraints: ordinary objects, no science fiction, the disagreement
  must not come from the theories just stipulating different meanings — it should
