  Hmm. Truth-value divergences between the two views are tricky because both are,
  in normal cases, designed to validate much of the same modal language. The differences
  show up in:

  1. The semantics/metaphysics, not truth values, for ordinary de re sentences.

  2. Special cases: "I might have been qualitatively different in all respects" —
  counterpart may say false, transworld identity true (if no essential qualitative
  properties).

  3. Cases involving haecceitism: transworld identity allows distinct possibilities
  differing only in which object plays which qualitative role; counterpart theory
  with purely qualitative similarity may deny such differences (anti-haecceitism).

  4. The "flexibility of counterpart relations" allows counterpart theory to make
  some sentences true where transworld identity (with strict identity requirements)
  says false — e.g., "the table could have been made of different wood" under origin
  essentialism.


