  Now write. Let me draft:


  "I cover markets and prediction markets for a living — not as an academic, just
  a journalist who''s spent years watching prices move and talking to people who trade.
  Over that time I''ve settled into a comfortable set of beliefs, but I''ve started
  to suspect they can''t all be true at once. I''d like someone to tear the list apart
  and tell me whether it hangs together.


  Here''s roughly where I am:


  (1) When there''s a liquid market or prediction market on a question, I treat the
  price as the best available summary of dispersed information and update toward it;
  I don''t really believe I can outguess it.

  (2) At the same time I''ve got a Groucho-Marx-ish reflex: if someone reaches out
  with an unsolicited trade, tip, or sweetheart deal, my first thought is that the
  offer itself is the signal, and the signal is bad. Nobody is trying to hand me money
  out of charity, so the fact that they selected me as a counterparty is evidence
  the trade is bad for me. I almost never act on individual proposals.

  (3) I know the no-trade theorem behind this: under common priors and common knowledge
  of rationality, people shouldn''t trade on differences in information alone, because
  each side''s willingness to trade itself leaks the information. But I also think
  its common-prior assumption is false in real markets — people trade because their
  priors, models, and confidence differ, not because one side secretly knows better.
  So I don''t think the theorem is a very good description of actual liquidity, and
  I don''t want to lean on it too hard.

  (4) And yet I have no clean story for how much observed volume is information-driven
  rather than just churn — fees, boredom, attention, forced trades. I suspect a lot
  of it is noise, which makes me less sure that the price in (1) is as wise as I act
  like it is.

  (5) The line I reach for when someone pushes me on this is that (1) and (2) are
  the same inference at different grains: an individual offer is a selected, adversarial
  signal, while the price is the average of thousands of such signals, and averaging
  cancels the selection problem. But I can hear myself reaching, and I can''t tell
  if that''s a real reconciliation or a rhetorical trick."


