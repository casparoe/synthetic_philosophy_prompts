  Actually the flaw: step (2) assumes that if G_M is true and I can see it, my "seeing"
  is itself a reliable proof procedure that can be formalized. The move from "M never
  proves G_M" to "therefore G_M is true" uses the assumption that M is sound, so identifying
  G_M requires a proof of M''s soundness. If I am P, to "see" G_P''s truth I''d need
  to know P is sound. But if P is my own mind, I might not be able to establish my
  own soundness (a Gödelian limitation). So the argument shows at most: either I am
  not a Turing machine, or I cannot know that I am sound (or cannot identify P). That''s
  the standard disjunction. The "proves too much" aspect: the same argument would
  show P (if it could run the proof) isn''t a machine, but P running the proof would
  need to assert its own soundness, which P can''t prove. So no contradiction.


