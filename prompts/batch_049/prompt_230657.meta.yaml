  "My aunt is retiring from the university in a few weeks and I''ve been asked to
  give the toast at the dinner. She''s a historian of the Enlightenment and has spent
  most of her career on Émilie du Châtelet, or more precisely on the short book about
  happiness that du Châtelet wrote late in life. The reading of that book my aunt
  has been living by, and teaching, is roughly this: reason can clear away prejudice
  and fear, but it can''t by itself make anyone happy; happiness needs passions, and
  most of our pleasure comes from illusion, so a decent life is mostly about choosing
  your illusions well rather than trying to do without them. As she got older she
  kept repeating a version of the argument: old age takes away the grand illusions
  one by one, and the person has to replace them with a quieter, steadier pleasure
  (for du Châtelet it''s study) or else become bitter. Please write the toast. It
  has to be funny and affectionate, something a non-academic uncle should laugh at,
  but the people from her department will know the text well and she''ll personally
  be checking whether I''ve said anything she''d count as a false comfort. In particular
  don''t say she''s earned a rest, don''t say the best years are ahead, and don''t
  pretend retirement is some bright new beginning; if that''s true for her it would
  only be true in her own terms. But it still has to be warm, and not a lecture on
  the 18th century. Just continuous prose, no headings or bullet points or anything,
