  Let me design the prompt.


  Domain: Epistemic dependence on AI and erosion of understanding.


  Commitments to include (a person''s views, likely a grad student or researcher in
  epistemology/philosophy of mind who uses AI daily):


  Say I''m writing up my views on cognitive offloading to AI for an epistemology seminar.
  I hold:


  1. Understanding is a cognitive achievement that differs from merely having true/reliable
  outputs: it requires grasping how a result follows, why the steps work, and being
  able to adapt them to new cases.

  2. Extended cognition: cognitive processes can legitimately include external artifacts
  (notebook, calculator); whether a process is "in the head" is not what matters for
  epistemic credit.

  3. Relying on an AI tool for a task one could perform but would be slower (e.g.,
  coding, summarizing, translating) is usually epistemically permissible and often
  smart division of labor.

  4. Habitual offloading of a skill to an artifact tends to cause skill atrophy and
  leaves one unable to notice errors in the tool''s output (deskilling).

  5. Epistemically, a person is blameworthy only if they offload a task while having
  reason to think the tool is unreliable in ways they cannot detect.

  6. The value of understanding is partly intrinsic and partly instrumental; a life
  with more first-hand understanding is better, but not at any cost.


  Potential tensions:

  - (2) extended cognition vs (4) deskilling/erosion-of-understanding: If external
  artifacts can be part of the cognitive process and can ground epistemic credit,
  why is habitual offloading a threat? An extended mind theorist might say the LLM-plus-user
