  Potential nuanced features of Molyneux''s problem:

  - The original question asks whether a newly sighted man could "distinguish and
  tell which is the sphere, which the cube" before touching them. It is not asking
  whether visual experience is completely shapeless; it''s about recognition of shapes
  through visual experience alone.

  - Molyneux answers no, and Locke agrees; the empiricist moral is that visual ideas
  of shape and tactile ideas of shape are distinct simple ideas that require experience
  to connect. But the problem has been interpreted in many ways since.

  - A common misreading: Molyneux''s problem is about whether a blind person could
  have any concept of space/shape. Actually the man has plenty of tactile concepts;
  the question is about cross-modal transfer/recognition.

  - Another subtle point: the question presupposes the man can see at all, and can
  distinguish something visually, but not know which shape is which by sight alone.

  - Another: Molyneux''s "no" is not based on a claim that the senses are entirely
  self-enclosed; it''s about the connection between visual and haptic ideas not being
  innate.

  - Another subtle issue: The problem as stated doesn''t specify whether the man has
  just gained sight and whether he has seen shapes before or can move around; some
  modern answers depend on enrichment of visual experience.


