  never be sure what a speaker means." That misses the no-fact-of-the-matter claim.

  2. Claim Quine thought communication/translation is impossible or arbitrary; "any
  translation is as good as any other." Overstatement.

  3. Treat "gavagai" example as showing words have no meaning at all, or that Quine
