  Quine''s actual views: "gavagai" thought experiment in Word and Object (1960). Field
  linguist observes native saying "Gavagai" when a rabbit scurries by. Stimulus meaning:
  the class of stimulations that would prompt assent to "Gavagai?" The field linguist
  can translate "Gavagai" as "Rabbit" or "Lo, a rabbit!" etc., consistent with all
  possible behavioral evidence. Indeterminacy of translation: two rival translation
  manuals can be compatible with all possible speech dispositions yet not equivalent.
  Inscrutability of reference: reference of terms is inscrutable within a translation;
  "rabbit," "undetached rabbit parts," "rabbit stages," "rabbithood" all fit the same
  stimulus meaning. Underdetermination of theory by evidence vs indeterminacy: underdetermination
  is that alternative theories can fit the evidence, but typically they are equivalent
  or you could in principle distinguish; indeterminacy is stronger: there is no fact
  of the matter even with all behavioral facts. Quine''s behaviorism/naturalism: no
  meanings beyond behavioral dispositions. Also analytical hypotheses. Also "translation
  is indeterminate" not "communication is impossible" or "the natives might mean anything."


