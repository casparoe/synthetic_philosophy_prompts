  ---


  For a philosophy-and-literature unit on the ethics of impunity, I''m pairing the
  ring of Gyges story from Book II of Plato''s Republic with H. G. Wells''s The Invisible
  Man (the 1897 novella, not Ellison''s novel). The obvious way to read Wells is as
  a naturalistic ring of Gyges: give an ambitious man the power to act unobserved
  and whatever justice he had will drop away. The protagonist begins as a young scientist,
  makes himself invisible, and moves quickly from petty theft to terrorizing the village
  where he takes refuge, and by the end he is trying to recruit his old acquaintance
  Dr. Kemp into a scheme of rule by assassination and fear. Yet I''m not sure the
  novella actually vindicates Glaucon, because Glaucon''s strongest claim is not merely
  that impunity corrupts. He argues that the happiest life is that of the thoroughly
  unjust person who keeps a reputation for perfect justice — someone who gets the
  gains of wrongdoing while still being honored as good. Wells''s protagonist can
  keep no such reputation: he is cut off from ordinary society, perpetually cold and
  hungry, hunted once he is discovered, and at least as miserable as he is dangerous.


  I want a careful philosophical reading that works out how far The Invisible Man
  is a dramatization of Glaucon''s challenge and how far it alters the terms of the
  thought experiment. Does the book concede the psychological half of Glaucon''s argument
  — that this man''s decency was only ever the product of being seen and of consequences
  — while undercutting the evaluative half — that the unjust unobserved life is the
  most desirable one? Does Wells treat invisibility as a corrupting force or as a
  revealer of a character already disposed to injustice before any experiment? Which
  scenes would you teach as the points where the disappearance of consequences does
  the ethical work: his flight after the experiment, his use of the tramp Thomas Marvel,
  his long confession to Kemp, his response to the mob that finally hunts him down?
  And where does the philosophical lens stop fitting the book, either because Wells
  is doing something else — a story about science outrunning morality, or about the
  despair of someone who can never be recognized by others — or because Glaucon''s
  challenge is about seeming as much as being, and literal invisibility ruins both?
  I''d like a reading that lets each text put pressure on the other, and that is willing
  to say plainly where the analogy between the ring and the book breaks down.


  ---


