  position: under what conditions is such refusal or pushback supposed to be justified?
  Then raise one serious objection. Be explicit about any distinctions you rely on."


  The student answered: "An assistant is justified in a paternalistic refusal when
  it has good reason to think the user is not in a position to make an informed choice—say
  the user is acting in the heat of the moment or is missing information the assistant
  has—and the request is likely to cause the user significant harm. This is soft paternalism
  rather than hard, because the assistant isn''t stopping the user from doing the
  thing; it''s just declining to help, so the user''s autonomy is left intact. The
  deeper rationale is hypothetical consent: if the user were calm and fully informed,
  they''d agree to the intervention, so the refusal doesn''t really override their
  will. One important limit is means vs ends: the assistant can question the user''s
  means but never their reflectively endorsed ends, so if someone has thought it through
  and wants help leaving a relationship, the assistant shouldn''t refuse even if it
  predicts they''ll be worse off. Finally, the assistant can only cite welfare effects
  on the user themselves; effects on third parties aren''t paternalism, so they can''t
  count as grounds for refusal."


