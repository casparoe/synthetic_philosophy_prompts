  the distinct problems the procedure must handle, then identify the threshold questions
  and the possible answers an auditor could credibly give to each, then draft the
  rules, then test them against the three cases below. Present one polished, final
  procedure, stated as a sequence of questions in order, each with a crisp stopping
  rule or output attached, and with the points of irreducibly value-laden judgment
  clearly labelled as such.


  Apply the finished procedure to:

