  Draft:


  "I am the standards director for a seafood certification body with a higher-welfare
  label covering farmed finfish and, newly, decapod crustaceans (shrimp, prawns, crabs,
  and lobsters). Last night a friend and I argued for hours about whether shrimp can
  suffer. She held that, absent proof, we should treat them as insensible and confine
  the label to finfish; I held that the label''s credibility depends on not treating
  uncertainty as a license. I came away convinced of one thing: our current welfare
  requirements for crustacean slaughter were drawn up piecemeal and are closer to
  a mood than a standard. I need to turn my side of that argument into something an
  auditor can actually run.


  I want you to write a decision procedure for our certification auditors to use when
  deciding whether a farm''s handling and slaughter practices for farmed fish and
  decapod crustaceans may be certified under the welfare label. Frame it for an auditor
  with no philosophical training, working within a single farm visit of at most half
  a day, who must return one of three outputs: ''certify,'' ''certify with corrective
  actions,'' or ''do not certify.'' The inputs are the species'' known biology, the
  specific slaughter and handling methods used, the observed failure rates where relevant,
  the number of animals affected, and the feasibility and cost of the best available
  alternative.


  The procedure should be grounded in the best philosophical thinking about how to
  act under deep uncertainty about sentience, but it must not require the auditor
  to resolve whether decapod crustaceans feel pain. Build in the precautionary principle
  in a disciplined form: say how much and what kind of evidence of possible sentience
  triggers protective measures, how the severity and duration of the pain if it exists
  enters, how numbers of animals aggregate (or do not aggregate), and where the procedure
  must stop and hand the decision to a values committee because the choice is genuinely
  about how much a shrimp''s possible suffering matters rather than about facts or
  method.


