  I am the standards editor at a large online magazine that publishes weekly opinion
  and analysis pieces about political polarization. A recurring problem: writers pitch
  pieces that cite moral foundations theory—the finding that self-described liberals
  and conservatives weight a set of moral ''foundations'' (roughly care, fairness,
  loyalty, authority, sanctity, and sometimes liberty) differently—and then conclude
  that one side''s moral outlook is more complete, more balanced, less self-serving,
  or more likely to be correct. I need a reusable procedure my editorial team can
  run on any such pitch or draft, not a one-off judgment.


  The procedure should be a checklist of ordered questions (aim for 8–12). For each
  question: what counts as a sufficient answer to move on; where the procedure should
  stop and say the piece cannot support its normative claim as written; and where
  the question is a values question that the editor or the publication has to settle
  rather than something the psychology can settle. The procedure should make the is–ought
  step explicit: a psychological difference between left and right is, by itself,
  neither evidence that one side is right nor evidence that the difference is mere
  bias. It should also flag the most common failure modes: moving from descriptive
  breadth of foundations to normative completeness; treating an explanation of a view
  as a debunking of it (or as a vindication of it); assuming the six foundations are
  the right or exhaustive list; and using average group differences to license conclusions
  about individuals or about particular policies.


  Then run the procedure on three hypothetical submissions:


  1. A piece claiming that because conservative participants in the classic studies
  rate all the foundations as relevant while liberal participants rate mostly care
  and fairness, conservative moral judgment is more comprehensive and therefore more
  likely to be correct.

  2. A piece claiming that because both sides rate care and fairness highly, and the
  disagreement is only about how to apply them, the left–right moral divide is smaller
  than thought; therefore majoritarian aggregation of both sides'' shared values settles
  most contested policy questions.

  3. A piece claiming the reverse of the first: that the extra foundations are rationalizations
  for in-group bias, and therefore liberal moral judgment is more likely to be correct.


  For each, say what the procedure would tell an editor to require before publication,
  and where the editor is left making a value call.


  The procedure will be used by editors without philosophy training, in under 30 minutes,
  on pieces that will reach a large audience; it must be defensible to the editor-in-chief
  and to readers who disagree with the publication''s own politics. It must not require
  external databases or citation checks, because we will handle fact-checking separately.


  End with a short self-audit: which substantive assumption in the procedure, if it
