  I cover condensed matter physics and energy science for a general-interest magazine,
  so I''m comfortable with statistical mechanics — microstates, macrostates, ensembles,
  entropy, coarse-graining, ergodicity, detailed balance — but I never got further
  than a couple of survey courses in philosophy of mind. Lately I''ve been mulling
  over something a philosopher of physics claimed in a talk: that if panpsychism is
  true, then the boring background churn of the physical world is ethically loaded
  all the way down. His specific version was something like this: every microphysical
  interaction has a tiny phenomenal character — a sliver of valence, positive or negative
  — and the total "valence flux" of a physical process is roughly proportional to
  how many microstate-to-microstate transitions it runs through. So a hot cup of coffee
  cooling down isn''t just an entropy increase; it''s also, under this view, a vast
  number of tiny felt events, with a net pain/pleasure balance. Call it micro-suffering
  to have a term.


  I want you to restate this position, and the obvious physicalist objection to it,
  in the vocabulary of statistical mechanics as precisely as you can. Map panpsychist
  claims onto microstates, coarse-graining, ensemble averages, emergent macrovariables,
  the way stat mech throws away information, maybe Landauer''s principle, whatever
  fits. Then give me the residue report: which parts of the panpsychist position translate
  cleanly, which parts you had to fudge, and which parts can''t be expressed in stat-mech
  terms at all. I particularly want to know whether the fact that statistical mechanics
  works beautifully without ever mentioning valence is a decisive strike against the
  idea, or just a sign that stat mech is deliberately blind to exactly the sort of
  thing the panpsychist is talking about. My hunch is that the whole view is a category
  mistake, but I suspect my physics vocabulary is doing the category-mistake work
  without me noticing — so tell me where the residue is and whether it''s a defect
  of the physcist''s framework or a sign the original claim was less clear than it
  sounds.


