  This is a nice niche within philosophy of biology. The two accounts:

  - Etiological (Wright, Millikan, Neander): function of a trait is what it was selected
  for; function is the effect for which the trait was selected in the past.

  - Causal-role (Cummins): function is a disposition/capacity of a component within
  a system that contributes to some system-level capacity; no selection history needed.


  A thought experiment prompt could ask: construct a scenario where a trait has an
  etiological function but no causal-role function, or vice versa, or where the two
  accounts disagree on a trait in an intuitive way. The type asks for a case built
  to order with specifications: scenario where a trait has a causal-role function
  but no etiological function, or where two accounts of function agree on the function
  but one says it''s a function in a different sense. Need to be realistic, no weird
  sci-fi.


