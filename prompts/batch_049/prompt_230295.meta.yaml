  Intentional stance: Dennett''s claim is roughly: we should attribute beliefs/desires
  to a system when doing so is predictively useful; the intentional stance is a strategy,
  and a system has beliefs if it is a true believer — if its behavior can only be
  predicted/explained by the intentional stance, and it''s not just stance-relative...
  Actually Dennett is subtle: he treats beliefs as real patterns, and "true believers"
  are those whose behavior is well predicted by the intentional stance and whose attributed
  states survive as robust patterns; he resists "original intentionality" requirements;
  he distinguishes "as if" intentionality from the real thing but says there''s no
  principled line — the only reliable difference is degree/utility. There''s also
  a "derived intentionality" idea (Searle, Haugeland) vs Dennett. I can inject concepts:
  "the intentional stance is justified when attributing beliefs earns its keep in
  prediction" vs "a system merits belief attribution only if it has internal states
  that play the functional role of beliefs" vs "only linguistic systems that can avow/correct
  their beliefs deserve the full attribution."


  Small LLMs should know the rough idea. The prompt should not rest on exact Dennett
  quotes. I''ll paraphrase, no quotes. Good.


