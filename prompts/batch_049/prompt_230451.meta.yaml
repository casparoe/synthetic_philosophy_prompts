  Let me recall the no-trade theorem (Milgrom and Stokey 1982): In a market with rational,
  risk-averse agents with common priors, if trade is common knowledge, then no trade
  occurs purely on the basis of asymmetric information. The intuition: if I offer
  to sell you an asset, you infer I have negative private information (why else sell?),
  so you refuse; my willingness to trade reveals information that eliminates the gains
  from trade. So "no trade" results from common knowledge of rationality and common
  priors. Aumann''s "agreeing to disagree": agents with common priors and common knowledge
  of each other''s posterior probabilities cannot agree to disagree.


