  Setting: We work at a company that runs an internal prediction market on product
  launch dates, outage risks, etc. A new market opened last month on whether a specific
  feature will ship by Q3. After the first day''s flurry, trading volume dropped to
  nearly zero for three weeks, even as the team supposedly learned more (design docs,
  integration tests). Two colleagues disagree about how to read the silence.


  Colleague A (maybe "Maya"): The silence is a good sign. There''s a classic result
  — the no-trade theorem — that says when everyone has the same prior and knows everyone
  is rational, people won''t trade on differences of information alone, because any
  offer to trade would leak the information and move the price. So a market that goes
  quiet means remaining differences of opinion have been arbitraged away and the price
  already incorporates what people know. Low volume isn''t a bug; it''s evidence the
  market has settled.


  Colleague B ("Dan"): That''s the opposite of how I read it. The theorem only goes
  through under absurd assumptions — common priors, common knowledge of rationality,
  no transaction costs. Our internal market has none of those: people are busy, some
  price is just derived from a few bored engineers, and nobody wants to trade against
  a price that carries no informational content because nobody''s trading. Silence
  is just illiquidity. You can''t infer the price is right from the fact that nobody''s
  willing to defend an alternative with trades.


  Maya: But your objection undercuts itself. If prices are uninformative because no
  one trades, the only way to make them informative is for someone to trade against
  the prevailing price. Yet every trade is a bet that the other side is wrong. If
  both sides are rational and have the same prior, at least one of them is making
  a mistake. So on your view, an informational market can only work by systematically
  exploiting mistakes.


  Dan: That''s not a contradiction, that''s actually what markets do. Real financial
  markets are full of volume, and no-trade-style logic says that shouldn''t happen.
  So either people have different priors, or they trade for hedging and liquidity,
  or someone believes they have an edge. In an internal prediction market, people
  do have different priors because they''ve seen different code and different test
  failures. The reason they still don''t trade is simply that the stakes are too low
  and there''s no market maker. Silence tells you about incentives, not about information.


  Maya: But then you''re committed to saying the price has no aggregated information
  value, which means every deployment decision we''re making off this market is noise.
  Is that really your view? We''ve used these prices before and they tracked outcomes
  reasonably well.


