  Core IRL ideas: Given observed behavior from an agent, infer the reward function/preferences
  that rationalize the behavior. There''s an identifiability problem: many reward
  functions can rationalize the same policy (e.g., all-zero reward, reward shaping,
  potential-based shaping, observationally equivalent). There''s also ambiguity between
  "the agent''s preferences" and "the environment''s dynamics"; inferring preferences
  vs. inferring beliefs+desires. Also the problem of irrationality/noise: if the agent
  is not optimal, does IRL still identify preferences? Also the "Boltzmann rationality"
  assumption.


  A realistic researcher''s commitments could include:

  - Behavioral evidence is in principle sufficient to infer preferences: if we observe
  enough choice behavior from an agent across enough contexts, the agent''s preferences
  are identifiable (a revealed-preference idealization).

  - The standard critiques (e.g., aggressive choices rationalized by many reward functions)
  are just underdetermination from finite data, not an in-principle problem.

  - We should attribute beliefs and desires jointly, not assume the agent shares our
  world model; but we can usually hold the world model fixed.

  - If the agent is systematically irrational (e.g., time-inconsistent, intransitive),
  that''s outside the scope; the inference problem is only well-defined for procedurally
  rational agents.

  - Yet they also hold: revealed preferences are the only epistemic basis for welfare/alignment;
  we shouldn''t privilege agent self-reports.

  - And: instrumental convergence means we should not infer a preference for a subgoal
