  judgment requires seeing, hearing, or reading the thing for oneself. As a centerpiece,
  I want a short instrument, working title "Which account of aesthetic testimony do
  you actually hold?", that sorts readers according to what they actually think testimony
  can and cannot accomplish in aesthetic life.


  The instrument should have eight to ten questions, each a concrete case with two
  or three response options, and a scoring key that maps answer patterns onto named
  positions. The questions should never ask readers to self-identify with a label
  or assert an abstract principle; they should ask what the reader would say or do
  in the situation. Please build the instrument from the logical space rather than
  from a menu of textbook positions. I want it organized around at least these axes:
  whether another person''s report gives one a reason to believe something is aesthetically
  good; whether such reports can by themselves justify an outright aesthetic belief
