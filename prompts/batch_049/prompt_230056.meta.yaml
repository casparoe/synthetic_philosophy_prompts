  Draft:


  "I am preparing a statement of my normative views on strikes and the right to organize
  for a dissertation chapter, and before I circulate it I would like a consistency
  check. I find myself committed to all of the following, but I have not yet worked
  out how they fit together:


  1. The right to strike is best understood as a collective right held by workers
  as an organized group, not merely as a set of individual rights to quit or withhold
  labor. A lawful strike is not a mass resignation; it is a collective act with collective
  authority.

  2. Workers who cross a picket line during a properly called strike may be morally
  criticized for undermining their coworkers'' collective action, but the law should
  not compel them to strike; the individual choice to work must remain legally protected.

  3. The legitimacy of a strike depends significantly on the process that produced
  it. It should normally be called by the union through a fair, informed vote in which
  workers understand the likely costs and risks. A strike called by an unaccountable
  faction without such a process is presumptively illegitimate.

  4. Yet in cases where the employer is guilty of serious, ongoing violations of workers''
  basic rights — dangerous conditions, systematic non-payment of wages, or coercion
  — a minority of workers wronged by these conditions may walk out immediately, even
  without majority authorization. The wrongfulness of the employer''s conduct, not
  the procedure, does the justificatory work.

  5. Primary strikers may pressure their own employer, but they may not blockade or
  picket a different, neutral employer merely because it does business with the struck
  firm. Coercing third parties who are not party to the dispute is wrong.

  6. Sympathy strikes are another matter, and I support them: if the employees of
  a second firm conclude that they should stop work in support of strikers at the
  first firm, that is a legitimate exercise of their own collective rights, even though
  their employer is not party to the original dispute.

  7. The fact that a strike raises prices, delays shipments, cancels services, or
  inconveniences the public does not, by itself, count against the strike''s legitimacy.
  Consumers have no entitlement to uninterrupted access to the goods and services
  others produce.

  8. Nonetheless, I believe strikes by emergency-room nurses, firefighters, and air-traffic
  controllers should be legally prohibited or tightly restricted, because their withdrawal
  of labor endangers the lives and basic security of third parties.


  My question: do these commitments hang together? For each pair that is in tension,
  tell me how severe the tension is and what would have to give; for any pair that
  only seems to be in tension, explain why it dissolves; and finally tell me which
  single revision would do the most to make the set coherent. Please rank the tensions
  rather than treating them all as equally serious."


