  immediately. She did not call. Instead she increased the oxygen flow, noted that
  the doctor was already attending another deteriorating patient, and planned to recheck
  in an hour. She was then pulled into an emergency and never rechecked. At 3:00 a.m.
  the patient was found unresponsive and could not be resuscitated.


