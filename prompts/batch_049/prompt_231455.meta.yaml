  Let me think about the philosophical substance:


  Counterfactual theory (Lewis): event C causes event E iff had C not occurred, E
  would not have occurred (in the relevant sense). Problems: preemption (two assassins;
  A shoots, B would have shot if A hadn''t; A''s shot caused death but death would
  still have occurred if A hadn''t), overdetermination (two sufficient causes), omissions
  (should we count absences as causes?), transitivity issues.


  Interventionist theory (Woodward): C causes E iff there is a possible intervention
  on C (that changes C independently) such that E would change. Interventions are
  exogenous manipulations; account handles some preemption/overdetermination via invariance
  under interventions. Also distinguishes causal from merely correlational. For omissions,
  intervention on an omission is odd but can be handled by intervening on the relevant
  factor.


  The memo could ask: which standard should the committee adopt for attributing harm
  to a failure in care when the outcome was likely but not certain, and when background
  conditions were also necessary? Recommend whether to use a strict "but-for" test
  or a broader "contribution/difference-making" test, and state how to handle cases
  where the outcome would likely have happened anyway or where multiple failures were
  each sufficient.


