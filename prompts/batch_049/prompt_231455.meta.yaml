  have transferred the patient to intensive care, and that prompt transfer would have
  given the patient about a 70% chance of surviving the night, compared with almost
  no chance without it. But she cautions that even with transfer the patient could
  have died that night, and survival to discharge would still have been uncertain.


  The unit was understaffed that night. The nurse was covering more patients than
  the staffing plan called for, and members of the committee have pointed out that
  this particular escalation protocol was frequently missed on that ward.


  We must record, for internal safety review only, whether the death was caused by
  the failure to escalate. Three positions have emerged.


  (a) The strict but-for view. Record the omission as a cause only if the death would
  not have occurred without it. Here the death might well have occurred even with
  escalation, so the omission should not be recorded as a cause; it only lowered the
  odds.


