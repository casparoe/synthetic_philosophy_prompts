  conditions was admitted to a general ward. At about 2:00 a.m., a nurse charted a
  low oxygen saturation and an elevated heart rate. The protocol required her to escalate
  to the on-call physician immediately. She did not: she increased the oxygen flow,
  noted that the doctor was attending another deteriorating patient, and planned to
  recheck in an hour. She was then pulled into an emergency and never rechecked. The
  patient was found unresponsive at 3:00 a.m. and could not be resuscitated.


