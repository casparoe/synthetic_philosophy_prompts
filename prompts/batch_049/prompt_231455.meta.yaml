  she would have moved the patient to intensive care, and that this would very likely
  have prevented death that night; but she also estimated the patient''s chance of
  surviving to discharge even with prompt transfer was around 40%, given the severity
  of the sepsis. A hospital administrator added that the unit was understaffed that
  night, that the nurse was covering more patients than the staffing plan called for,
  and that the escalation protocol was routinely missed on that ward.


  The committee has to say, for internal safety-review purposes only, whether this
  death should be recorded as caused by the failure to escalate. The two factions
  are roughly:


  (a) Some want a strict what-would-have-happened test: record the omission as a cause
  only if the death would not have occurred without it. On their view, because the
  patient''s survival even with escalation was uncertain, we cannot say the omission
  caused the death.


  (b) Others want a contribution test: record the omission as a cause if it made the
  bad outcome substantially more likely, even if we cannot be certain it would have
  changed the result. On their view, this clearly counts.


  (c) A third group wants to look at the whole system and record the understaffing
  as the cause, or at least as the more important cause; they say blaming the nurse''s
  single decision is arbitrary because the same decision would not have mattered on
  a fully staffed ward, and the nurse''s omission was itself shaped by the staffing.


