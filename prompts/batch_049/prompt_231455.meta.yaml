  omission is a cause because proper escalation raised the odds from almost nothing
  to about 70%.


  (c) The system view. Record the understaffing as the cause, or at least as the more
  important one. The nurse''s individual decision is the wrong unit: the same omission
  might not have mattered on a fully staffed ward, and the decision was itself shaped
  by the workload.


