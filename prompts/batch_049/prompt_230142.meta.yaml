  Let me think about what desiderata a theory of precaution must meet. This is the
  conceptual meat. A good answer would list:


  1. Distinguish between risk (known probabilities) and uncertainty (unknown) and
  ignorance (unknowable unknowns); a theory must specify which epistemic state triggers
  precautionary duty, else it over/under applies.


  2. Specify the threshold of harm and irreversibility that engages the principle
  (serious/irreversible harm) — and why that boundary must be principled rather than
  ad hoc.


  3. Not collapse into a ban on everything: must be self-limiting, avoid "paralysis"
  from precaution about precaution (risk-risk trade-offs and substitution risks; iatrogenic/regulatory
  harms; opportunity costs).


  4. Specify the asymmetry demanded: whether it shifts the burden of proof, and what
  the evidential standard is for the proponent vs. the challenger (who must show what
  at what level).


  5. Handle the "absence of evidence" trap: the principle is often used to infer risks
  from unknown unknowns; must not license arbitrary speculation about harms; must
  respect the difference between "no evidence of harm" and "evidence of no harm" but
  not treat either as decisive.


  6. Be applicable as a decision procedure not just a slogan — provide comparative
  guidance between alternatives (including status quo), not just veto on one option;
  because inaction is also a choice with its own risk profile.


  7. Not presuppose a false symmetry between false positives and false negatives?
