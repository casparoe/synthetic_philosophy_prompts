  9. Handle the "precautionary regress": applying the principle to its own interventions
  (if a proposed precautionary measure may itself cause serious or irreversible harm,
  the principle applies again; naive formulations oscillate or paralyse).


  10. Distinguish between normative and epistemic versions: one version says what
