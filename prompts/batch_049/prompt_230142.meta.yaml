  I''m a PhD student in environmental policy writing a dissertation chapter on the
  precautionary principle, and before I evaluate the standard formulations against
  one another I want to pin down what any adequate account of the principle must actually
  do. My difficulty is that the literature treats the principle at very different
  levels: sometimes as a decision rule that seems to recommend banning anything with
  an unknown risk profile, sometimes as a burden-of-proof rule for regulators, sometimes
  as an abstract commitment to humility about scientific uncertainty. Because there
  is no shared specification, the same principle gets called both empty and paralysing,
  and I cannot tell whether these objections target a real formulation or a caricature.


  So: write me the desiderata for an adequate theory of precaution. Assume the purpose
  is ex ante governance of novel technological and environmental interventions under
  deep uncertainty (not just ordinary insurance-style risk, where probabilities are
  available). For each requirement, give the case or consideration that motivates
  it, and mark it non-negotiable or a preference of particular camps. I would especially
  like you to address (a) how the theory distinguishes uncertainty from risk without
  making "any non-zero possibility of catastrophe" a decisive veto; (b) how it handles
  the objection that precautionary measures themselves create risks, so that the principle
  seems to iterate — applying it to its own interventions — and what condition would
  stop the regress without arbitrary lines; and (c) whether shifting the burden of
  proof onto the proponents of a technology is a core requirement or a negotiable
  institutional choice. After the main list, score the two best-known formulations
  (the Rio and Wingspread formulations) briefly against the desiderata, and tell me
  which single requirement excludes the most popular formulations. Please write the
  answer in British English.


