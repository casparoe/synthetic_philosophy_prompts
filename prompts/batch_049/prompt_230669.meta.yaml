  Let''s draft full prompt:


  "Hey — I''m a software engineer with no formal philosophy background, but I got
  into an argument online about Kant and now I''m stuck on the ''paradox of deontology.''
  I was reading the Abbott translation of Kant''s *Fundamental Principles of the Metaphysic
  of Morals* and this passage stopped me:


  [quote passage]


  Kant seems to be claiming that the prohibition on lying isn''t just a useful rule
  for human beings or a rule that''s valid in most cases — it has to hold for any
  rational being whatsoever, and its basis must be purely *a priori*, not in human
  nature or in how the world happens to be. That feels like it creates the paradox
  of deontology directly: if the rule against lying is absolute like that, then a
  deontologist who takes Kant seriously has to stick with no-lying even in the murderer-at-the-door
  case, where lying seems like the only way to prevent something much worse. But if
  they add an exception to avoid that, it looks like they''re doing consequentialism.
  So I want a document that a strict Kantian absolutist about lying and a committed
  act consequentialist could both sign after an adversarial collaboration on *this
  passage*, not just the abstract problem.


  The deliverable should be structured like this:

  - a numbered ''agreed claims'' section, including claims about what Kant is actually
  saying in the passage, what each side thinks the paradox of deontology is, and what
  the disagreement is *not* about;

