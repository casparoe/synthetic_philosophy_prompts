  I think the key philosophical content to elicit:

  1. CJT''s conditions: voters more likely right than wrong, independent, and there''s
  a fact of the matter.

  2. Here, two factions have opposite systematic biases; their votes are not independent
  — they''re strongly correlated within each faction, so the "wisdom" doesn''t aggregate;
  majority just reflects whichever faction has more seats.

  3. Also, two members may have p < 0.5 on some case types (e.g., realtors always
  siding with homeowner regardless of facts), so adding them makes the majority worse,
  not better.

  4. The better rule: don''t add more correlated voters; either use the swing voter''s
  judgment, seek independent evidence, or weight votes by actual track record (log-odds
  weighting).

  5. The strongest consideration on the other side: majority is simple, legitimate,
  avoids concentrating power in one person, and if everyone at least sometimes attends
  to evidence, a majority can still outperform any single member on rare cases. But
  in this configuration, it''s not reliable.


