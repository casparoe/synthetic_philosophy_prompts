  Condorcet jury theorem nuances:

  - Assumptions: binary choice; each juror has probability p > 0.5 of choosing correctly
  (competence); votes independent conditional on the state; typically equal p.

  - Result: majority''s probability of being correct increases with group size, approaching
  1 as n grows.

  - If p < 0.5, majority is worse than individual; approaches 0.

  - If p = 0.5, no benefit.

  - Independence is crucial: if votes are correlated (e.g., all read same news, shared
  bias), majority may be overconfident — correlated errors don''t wash out.

  - Different competence levels: if some jurors are much more competent, simple majority
  may be worse than weighted voting or deferring to the expert. The optimal rule is
  weighted by log odds (those with higher competence get more weight).

  - Real-world complications: common cause, informational cascades, deliberation effects
  (can improve or create correlation), strategic voting.

  - The theorem is about the probability that the majority is correct given that each
  is more likely correct; it is not a blanket vindication of majority rule, and doesn''t
  justify "wisdom of crowds" when people are biased in the same direction.


