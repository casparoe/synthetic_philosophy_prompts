  Let me think through the substantive content:


  The simple conditional analysis of dispositions (SCA): An object is disposed to
  M when S iff, if it were S, it would M. E.g., glass is fragile iff if dropped/struct,
  it would shatter.


  Counterexamples:

  - Finkish dispositions (finks): a disposition that would disappear if triggered.
  E.g., a "reverse-cycle" glass protected by a sorcerer/demon/angel who would interfere
  to make it not break if struck, but which is fragile now. Actually finks: a fragile
  glass with a guardian angel who would render it non-fragile before it was struck.
  A "fink" makes the conditional false while the disposition is present. Or "finkish
  lack": an object not disposed but the conditional true because a demon would give
  it the disposition if triggered.

  - Masks (antidotes): the disposition is present and the stimulus occurs, but the
  manifestation is prevented by an external/independent factor: a fragile glass wrapped
  in bubble wrap, struck, doesn''t break; yet still fragile. Antidote (Bird): poison
  that would kill if ingested, but you take an antidote; still poisonous. The conditional
  "if struck, it would break" is false because of the mask, though fragile.

  - "Mimics": object without disposition but condition true due to external circumstance?
  Actually a mimic is like finkish lack.

  - Multi-track dispositions and revisions: Lewis''s reformed conditional analysis
  with a causal basis and normal conditions; Manley & Wasserman''s proportion-based
  view ("is disposed to M if it would M in most relevant stimulation cases"). "Intrinsicness"
  of dispositions.

  - Chisholm/Molnar/Schrenk... maybe too niche.


