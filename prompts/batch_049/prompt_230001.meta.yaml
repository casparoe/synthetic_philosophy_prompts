  questioning a documentary source, or challenging a received narrative) does so by
  engaging the evidential base, offering a better explanation of a larger body of
  evidence. Pseudohistory instead treats the established chronology as a conspiracy
  or artifact, generates auxiliary hypotheses to save itself, and fails consilience.
