  I''m an undergraduate in a philosophy of AI seminar. In our discussion section yesterday,
  two of my classmates got into an argument about how narrowly the "alignment problem"
  should be defined, and neither would give ground. I honestly couldn''t settle it.
  Could you adjudicate the exchange move by move?


  Here''s the exchange as I remember it.


  (1) Daniel started: "The alignment problem in its narrow sense is the problem of
  getting an AI system to do what its operator actually intends, especially when the
  instruction is underspecified or the system optimizes a proxy that misses the point.
  That''s the problem worth solving. ''Value alignment''—making the system share human
  values—is a different project, and conflating the two only muddies the former."


  (2) Anika replied: "That can''t be right. ''What the operator intends'' is not a
  primitive fact sitting there waiting to be detected. It''s only determinate against
  a background of the operator''s values—otherwise the instruction is consistent with
  too many readings. So you can''t solve the narrow problem without already doing
  value alignment."


  (3) Daniel: "I can intend for you to bring me a coffee without intending any particular
  theory of my values. A competent assistant infers that I want a coffee, not that
  it should also repaint my kitchen. You don''t need a full model of someone''s values
  to satisfy an ordinary intention on a particular occasion."


  (4) Anika: "The example is rigged because the coffee case is easy. The moment the
  agent has to act sensibly when the café is closed, or when following the instruction
  would frustrate what you care about, it must infer what you would want given your
  values. That''s exactly the value story, just under a different name."


  (5) Daniel: "No—there''s a difference between using values as evidence about what
  the person wants, and aligning the system to values as its objective. Value alignment
  means the system adopts or optimizes for human values itself. Intent alignment means
  the system defers to a particular human''s particular instruction, corrigibly, even
  if that human is wrong. A system could be perfectly intent-aligned while knowing
  nothing general about human values."


  (6) Anika: "But deference to a particular instruction still requires a stopping
  point for interpretation, and wherever you stop, you''ve imported normative assumptions
  about which respects of the instruction matter and which complications to ignore.
  A pure ''do what I mean'' machine is a fiction; you''re smuggling in a partial theory
  of the user''s values while disclaiming it."


