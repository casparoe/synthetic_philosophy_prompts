  Two members of my reading group got into an argument last week which none of the
  rest of us could settle, and I have been turning it over ever since. The dispute
  began with a pear left on a windowsill, which was green and hard on Monday and yellow
  and soft by Friday. One of them, Ruth, defended an endurantist view of persistence:
  the pear persists by being wholly present at each moment of its existence. The other,
  Daniel, defended a perdurantist view: the pear persists by having temporal parts
  — it is a four-dimensional thing spread through time. I have set down their exchange
  as faithfully as I can from my notes.


  Ruth: "The pear on Monday and the pear on Friday are numerically one and the same
  pear. On Monday it is green and hard; on Friday it is yellow and soft. It — the
  whole pear, not a green bit of pear and a yellow bit of pear — changes. Your talk
  of temporal parts turns an ordinary persisting thing into something like an event
  or a process, as if the pear were composed of stages. That is a different picture,
  not a solution."


  Daniel: "But you have not explained how the very same thing can be both green and
  yellow. If these are properties of one and the same object, then the object has
  incompatible properties, and that cannot be right. My picture avoids the contradiction:
  the greenness belongs to the Monday part and the yellowness belongs to the Friday
  part. Change just is the having of different properties by different temporal parts
  of one temporally extended thing."


  Ruth: "That avoids the contradiction only by changing the subject. If the green
  belongs to one thing and the yellow to another, then nothing at all has altered;
  you have merely placed a green thing and a yellow thing side by side in time. A
  road is narrow in one place and wide in another, but the road does not change from
  narrow to wide. You have turned change into a static variation along a fourth dimension.
  On your view, strictly speaking, the pear never ripens at all."


  Daniel: "I accept the road analogy, but I think it works in my favour. Change is
  a kind of variation, and variation is a matter of different properties at different
  locations — spatial or temporal. What I do not see is how you can say the whole
  pear has both properties. You are forced to say that ''green'' is not really a property
  of the pear, but a relation to a time, perhaps that the pear is green-on-Monday
  and yellow-on-Friday. That is a radical revision: shape and colour stop being intrinsic
  features of things, and every temporary predication becomes relation to a hidden
  parameter."


  Ruth: "Not at all. If by ''the pear is green'' one means ''the pear is green at
  a particular time'', there is no need to treat green itself as a relation. And you
  have a mirror problem: what unites the Monday part and the Friday part into one
  pear rather than a pear part plus, say, a different pear''s part? You need a criterion
  of unity across time, and ''temporal parts'' alone does not give you one."


  Daniel: "Every account of persistence needs to say which series of stages count
  as one continuing thing. I can point to the right kind of causal and qualitative
  continuity through time. You, by contrast, must say the same wholly present object
  simply shows up again at each later moment, numerically identical despite having
  lost every cell''s matter and changed its qualities. Saying ''it is the same pear''
  is not yet an account of what that sameness consists in."


  Ruth: "That is precisely what cannot be cash out in terms of parts. A wholly present
  thing''s identity across time is a basic fact, not something constructed out of
  stages. If you treat it as something constructed, you make every object''s beginning
  and end arbitrary: any old collection of stages could be summed into an ''object''.
  That seems to me a high price to avoid saying the pear was green on Monday and yellow
  on Friday."


  Daniel: "And saying it was green on Monday and yellow on Friday is a high price
