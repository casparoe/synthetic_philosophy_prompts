  of funding to build an autonomous Maxwell''s demon on a chip. A single colloidal
  particle would be held in a time-modulated optical trap. A feedback loop would measure
  the particle''s position quickly enough to resolve individual thermal fluctuations,
  use that measurement to adjust the trap and extract a little work, and record each
  outcome on a prepared tape of initially blank bits. A separate set of runs would
  measure the dissipation required to reset the tape, and the applicants claim the
