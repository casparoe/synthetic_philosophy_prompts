  But careful: Bentham''s actual views on sexual morality: In "Offences Against One''s
  Self" (c. 1785, published partially later), and in "The Theory of Legislation" /
  "Principles of Morals and Legislation." He famously argued that sexual acts between
  consenting adults (including same-sex) are "irregular" but not "offences," because
  they produce no direct harm (or the harm is imaginary or from prejudice). He distinguished:

  - Offences against oneself (self-regarding) — Bentham actually was skeptical that
  self-regarding "offences" are real offences because a person harming themselves
  consents? He thought "offences against oneself" are problematic.

  - His classification: private offences, self-regarding offences, public offences,
  semi-public offences.

  - The "principle of antipathy" (or "ipse dixit") — condemning acts merely because
  the judge dislikes them; the "principle of asceticism" — condemning pleasures as
  such.


