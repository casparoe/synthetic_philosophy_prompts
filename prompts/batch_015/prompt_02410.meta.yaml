  The optional stopping problem is real: p-values computed under fixed-n assumptions
  become miscalibrated when using sequential stopping rules, since continuous monitoring
  lets you guarantee eventually crossing any p-value threshold with probability 1—this
  is the classic "p-hacking via optional stopping" phenomenon tied to the law of the
  iterated logarithm and Robbins'' sequential testing work.


  By contrast, the Bayesian stopping-rule irrelevance result (the likelihood principle,
  associated with Savage, Edwards, Lindley, and Berger & Wolpert) shows that because
  the likelihood function is proportional regardless of the stopping rule used—so
  long as the rule doesn''t depend on unknown parameters—the posterior is unaffected.
  A Bayesian can therefore peek at the data as often as they like without correction,
  though this comes with caveats about proper versus improper priors.


  The classic illustration is 9 heads and 3 tails in 12 flips: under a fixed-n binomial
  model the p-value comes out one way, but if instead you flipped until getting 3
  tails and it happened to take 12 flips (negative binomial), the p-value differs
  even though the observed data and likelihood function are identical. This is the
  textbook example (from Edwards, Lindman, and Savage''s 1963 paper) showing that
  frequentist p-values depend on the stopping rule while Bayesian inference does not.


