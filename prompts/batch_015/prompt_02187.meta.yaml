  If bare spacetime points are treated as substantival individuals independent of
  the metric field, then diffeomorphisms that alter the metric within some region
  while agreeing outside it generate genuine indeterminism — two models that match
  everywhere outside the hole but diverge inside would count as physically distinct
  possibilities under manifold substantivalism, even though nothing in the physics
  differentiates them. This pushes philosophers away from naive manifold substantivalism
  and toward either relationism or a sophisticated substantivalism that takes the
  metric field itself, not bare points, as the fundamental substance.


