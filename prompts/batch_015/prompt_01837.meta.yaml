  Bradley''s regress comes from Appearance and Reality (1893), in the chapter on "Relation
  and Quality." His argument is that relating qualities requires a relation, but that
  relation then needs its own connection to the terms it relates, generating a further
  relation, and so on infinitely—a vicious regress Bradley uses to attack the coherence
  of ordinary relational thinking and motivate his idealist monism.


  This regress also connects to the problem of "the unity of the proposition" that
  occupied Russell and Moore around 1903. Russell wrestled with what makes a proposition
  like "Socrates is wise" a genuine unity rather than a mere list of parts, eventually
  proposing that a relation can occur either "as relating" (creating unity) or "as
  a term" (as a mere item)—two distinct modes of occurrence for the same relation.


  This solution was widely seen as ad hoc, and the unity problem resurfaced in Wittgenstein''s
  distinction between facts and things in the Tractatus, and in Frege''s doctrine
  of unsaturated concepts—where concepts are inherently incomplete and require completion
  by objects, giving rise to the famous "concept horse" paradox: trying to name the
  concept via a definite description inadvertently turns it into an object.


