  Actually, the comparison type might be best: "Compare Solomonoff induction and minimum
  description length" — this is a genuinely in-the-weeds comparison that most models
  will conflate. Most pretraining material treats them as almost the same. The real
  differences:

  1. Solomonoff prior: M(x) = sum over all programs p that output x of 2^{-K(p)},
  where K is the Kolmogorov complexity relative to a fixed universal machine U. It''s
  a proper semimeasure (not necessarily a measure — because of halting issues). Uncomputable.
  Universal in the sense of dominating any computable semimeasure up to a constant
  factor.

  2. MDL: for a model family M with a code, MDL picks the model M that minimizes -log
  P(data|M) + -log P(M) (or the code length of data + code length of model). It''s
  computable if the model family is parametric with a proper coding scheme. It''s
  not universal — it only works within a chosen model family and coding language.

  3. The "language choice" / "description language" problem: in MDL, the choice of
  coding language is a real decision that affects results (the "language choice" problem);
  in Solomonoff, the choice of universal machine only changes the prior by an additive
  constant (in log space), but that constant can be arbitrarily large, so the convergence
  guarantee is vacuous in practice.

  4. AIC/BIC as approximations: AIC ≈ 2k - 2 log L, BIC ≈ k log n - 2 log L; these
  are asymptotic approximations to the Bayesian evidence (marginal likelihood), not
  to Kolmogorov complexity directly.

  5. The "two-part" coding: Kolmogorov complexity can be defined via a two-part code
  (program + its output), which connects to MDL.


