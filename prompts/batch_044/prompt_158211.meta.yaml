  extends the circle by fitting other sayings into the same assumed pattern. As for
  embarrassment, Leo claimed it''s overrated—what looks embarrassing to modern readers
  might have served an early theological purpose, like showing that even John recognized
  Jesus''s superiority by submitting to him, or framing the crucifixion as a necessary
  fulfillment. So the criteria don''t isolate Jesus; they isolate whatever survived
  a filter designed by scholars with prior hypotheses.


  Mira countered that Leo''s skepticism, if taken consistently, would make all ancient
  biography impossible—no one demands this level of proof for Tacitus or Josephus.
  She said the criteria aren''t meant to deliver Cartesian certainty but to shift
  probabilities: Aramaic linguistic substrata in sayings about the kingdom, for example,
  point to a Palestinian origin in the 30s CE, not a later Greek-speaking church invention.
