  Additional notes on this type:

  - The asker lists several things they believe within a domain -- a handful of theses,
  verdicts on cases, methodological preferences, or a mix -- and asks whether the
  set is jointly tenable: which commitments pull against each other, which pairs are
  only apparently in tension, and what the cheapest way to restore consistency is
  and what it costs.

  - Write the belief set so that it is largely reasonable and recognizably held by
  a real kind of person, and so that it contains one or two genuine tensions that
  are not obvious -- two views that are each standard but whose usual motivations
  are incompatible, or a case verdict the asker''s stated principle cannot deliver
  -- plus at least one apparent tension that dissolves on inspection, so a good answer
  has to discriminate rather than flag everything.

  - The asker should not know where the problem is and should not signal which commitment
  they would give up.

  - The deliverable is an audit, not a lecture: the tensions, ordered by severity,
  each with what would have to give.


  Also:

  - Keep relatively short and focused.

  - Written casually, may contain a typo or two.

  - No quotation marks around the prompt.

  - Start directly with prompt''s first sentence.


