  For the past several months I have been reorganizing my priorities after the dissolution
  of a long friendship that had been centered, for years, on shared visits to galleries
  and concerts. In trying to understand what I actually lost, I have returned to G.
  E. Moore''s treatment of intrinsic value in Principia Ethica, and I find myself
  drawn to a cluster of commitments that I want to check for coherence before I present
  them in a reading group. Here is where I stand:


  (a) I accept Moore''s identification of the enjoyment of beautiful objects and the
  pleasures of human friendship as the supreme intrinsic goods, not reducible to one
  another.


  (b) I endorse his organic-unities thesis: a state of affairs in which friends share
  an aesthetic experience is worth more than the sum of the separate values of the
  friendship and the aesthetic experience taken in isolation, yet this surplus does
  not imply that either component derives its value from the other.


  (c) I hold a non-derivativeness condition on intrinsic value: if X is good in itself,
  then no part of X''s value can depend for its existence on its relation to some
  other intrinsic good Y.


  (d) I am persuaded by recent arguments in social aesthetics that aesthetic judgment
  is essentially intersubjective—solitary appreciation is always incomplete or defective
  because the norms of taste require actual or potential agreement and disagreement
  with others—so that full aesthetic value is only realized within a social or friendly
  context.


  (e) I want to deny that friendship is merely instrumentally valuable for achieving
  aesthetic experience, or vice versa; instead, I take the two to be co-constitutive
  in the best kind of human life, while still maintaining that each retains an independent
  intrinsic status.


  My question is whether this package hangs together. Specifically, I want an audit
  rather than a lecture: go through the pairs (a)-(e) and identify which are genuinely
  in tension, which only appear to be, and rank the real tensions by severity. For
  each tension, say which commitment would have to give way and what that revision
  costs me. In particular, I worry that (d) makes aesthetic value depend on friendship,
  which (c) forbids, and that (b)''s organic-unity claim is hard to square with (e)''s
