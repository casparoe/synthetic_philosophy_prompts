  "Write a joke about Rawls''s veil of ignorance and the difference principle. Rather
  than a generic joke about philosophers being out of touch, the punchline should
  turn on a specific internal tension in the argument for the original position. The
  tension is this: behind the veil, rational parties are deprived of knowledge about
  their social position, talents, and conception of the good, and Rawls contends that
  under these conditions they will adopt the maximin rule, which supports selecting
  the difference principle. Yet the veil also withholds knowledge of each party''s
  own psychological profile, including their risk preferences. Consequently, the parties
  lack the information needed to justify selecting maximin over an expected-utility
  rule or some other decision criterion; they must choose a principle of choice without
  knowing whether they are the kind of agents for whom maximin is rational. The joke
  should dramatize this instability—for instance, by depicting the parties attempting
  to agree on distributive principles only to realize that they cannot defend their
  choice of decision procedure without stepping outside the veil, or by showing that
  applying the difference principle already requires them to know whether they will
