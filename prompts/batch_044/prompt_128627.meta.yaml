  in itself, license any inference to a substantial, persisting "I" that does the
  thinking.

  2. Nevertheless, I treat the cogito as a genuine epistemic foundation from which
  one might begin to reconstruct other knowledge, not merely as a psychological comfort.

  3. I take the indubitability of the cogito to be logical rather than pragmatic or
  psychological; it is not analogous to confidence in a well-confirmed empirical claim.

  4. I reject the view that the first-person reference in "I think" is a purely grammatical
  fiction; there is an irreducible minimal self-reference that survives skeptical
  scrutiny.

  5. I maintain that the cogito offers no warrant whatsoever for the temporal continuity
  of this minimal self; each instance of thinking could, for all the argument shows,
  be metaphysically isolated.

  6. Consequently, I hold that any philosophical method that treats first-person certainty
  as generally fallible—certain externalist or naturalised epistemologies, for instance—is
  thereby committed to abandoning Descartes'' foundational project altogether.


