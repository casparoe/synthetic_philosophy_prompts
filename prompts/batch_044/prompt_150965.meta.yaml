  for psychological continuity: we are told that natural cell turnover already makes
  us "slow teletransporters," so we should accept that rapid scanning and reconstruction
  preserves identity. Here, the intuition activated in the imaginary rapid case—discontinuity
  of first-person narrative—is different from the intuition activated in the natural
  case—biological process continuity—yet the argument treats them as instances of
  the same principle. In the other, the prosthesis analogy I mentioned: the ship-of-Theseus
  framing highlights functional preservation across material change, but in the clinical
  context the relevant question is whether subjective experience might be interrupted
  or legally fragmented, concerns the analogy renders invisible by design.


