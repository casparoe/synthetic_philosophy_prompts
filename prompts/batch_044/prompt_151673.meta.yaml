  Let''s draft:


  "I am a software engineer without formal philosophical training, and I have been
  trying to understand whether there is any coherent moral basis for intellectual
  property. I have constructed the following argument, but it seems to show that not
  only are patents and copyright unjustified, but that plagiarism and misattribution
  are conceptually impossible. I find the conclusion hard to accept, yet each step
  looks defensible. Could you tell me exactly which premise I ought to reject, why
  it initially seemed plausible, and what price each of the main alternatives — a
  Lockean labour-mixing account, a pure consequentialist incentive theory, or a social-contract
  view of information goods — must pay for giving it up?


  (1) Ideas are non-rivalrous: if I hold idea E, your holding E does not diminish
  my possession or use of it.

  (2) A resource that is non-rivalrous and whose use by others causes me no harm cannot
  be subject to legitimate exclusive moral claims (a version of the Lockean proviso
  extended to abstract goods).

  (3) Therefore, no one has a natural moral right to exclude others from using or
  sharing an idea.

  (4) Intellectual property law creates artificial exclusivity over ideas or their
  expressions.

  (5) If there is no underlying natural right, artificial exclusivity is unjustified
  unless it serves a separate purpose, such as incentivising creation.

  (6) The flourishing of open-source software demonstrates that creation occurs abundantly
  without exclusivity, so the incentive justification fails.

  (7) Hence, patents and copyright are morally unjustified.

  (8) My source code is a concrete token expressing an abstract idea (the algorithm).

  (9) If I have no exclusive right to the abstract idea (from 3), then any exclusive
  claim I have to the token can only rest on my physical labour in producing that
  particular file.

  (10) But if someone copies the file, they do not take my original token; they merely
  create a new token instantiating the same unowned idea.

  (11) Therefore, copying is not taking anything that morally belongs to me, and the
  notion of ''stealing an idea'' is incoherent.

  (12) By extension, plagiarism — presenting another''s token as one''s own — is also
  incoherent, because there is no ''another''s'' idea to misattribute, only unowned
  types instantiated in different tokens.

  (13) So the argument proves that all IP norms and attribution practices rest on
  a conceptual mistake.


  Which step is the weak link? I am particularly drawn to keeping (1) and (3), but
  I suspect the slide from (8) to (12) involves an equivocation between owning a type
  and owning a token, or perhaps an unjustified move from ''no natural right'' to
  ''no institutional right''. Please diagnose the flaw precisely, explain why the
  step looked reasonable, and then price the three positions I mentioned for rejecting
  it."


