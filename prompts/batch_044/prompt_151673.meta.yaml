  The asker (software engineer) has been thinking about open-source licensing. They
  present an argument they encountered or devised:


  (1) Ideas, once expressed, are non-rivalrous: my using an algorithm doesn''t prevent
  your using it.

  (2) If a resource is non-rivalrous and its use by others doesn''t diminish my welfare,
  then moral claims to exclusive control over it are unjustified (this is a version
  of the Lockean proviso: appropriation is only justified if it leaves enough and
  as good for others; with ideas, appropriation doesn''t take anything away).

  (3) Therefore, no one has a natural moral right to exclude others from using an
  idea.

  (4) Intellectual property rights (patents, copyright) are legal institutions that
  create artificial exclusivity.

  (5) If there is no natural moral right to exclusivity, then these institutions are
  unjustified unless they serve some other purpose (e.g., incentivizing creation).

  (6) But empirical evidence (the open-source movement) shows that creation happens
  abundantly without exclusivity.

  (7) Therefore, IP institutions are unjustified.

  (8) Now, consider that my source code is an expression of an idea.

  (9) If I have no exclusive right to the idea, and my source code is just a token
  of that idea, then I have no exclusive right to the token either, except insofar
  as it is a physical object (the hard drive).

  (10) Therefore, anyone who copies my code is not taking anything that belongs to
  me in a moral sense; they are merely instantiating the same unowned idea in their
  own token.

  (11) But this implies that plagiarism, infringement, and even attribution norms
  are based on a false premise of ownership.

  (12) Furthermore, if this applies to code, it applies to all expressions: books,
  music, inventions. So all IP is illegitimate.

  (13) Yet we intuitively think that passing off someone else''s work as your own
  is wrong.

  (14) The argument seems to prove that not only is IP law unjustified, but the very
  concept of "stealing an idea" is incoherent.


