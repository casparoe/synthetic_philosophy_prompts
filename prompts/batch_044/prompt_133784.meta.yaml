  against Aristotelian dynamics. For your chosen case: (a) identify which of these
  two functions it primarily serves; (b) explain how it yields knowledge about the
  world despite involving no actual observation or measurement; and (c) state one
  specific epistemic risk that applies to that function but not to the other.


