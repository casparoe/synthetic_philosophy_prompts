  conditions that jointly compose a single sufficient set. In thick cases, she argued,
  ranking causes by importance is incoherent because the conditions are not substitutable
  parts but interlocking prerequisites of one macro-cause. Julian countered that even
  in thick cases, the interlocking parts have distinct modal profiles: some are brittle
  (if removed, the set collapses quickly) and others are resilient (if removed, the
  remaining parts compensate). Therefore, you can still assign explanatory weights
  by measuring how much the other conditions have to adjust to maintain the outcome,
  which is precisely the work that historical explanations do when they argue, for
