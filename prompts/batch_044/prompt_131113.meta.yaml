  Let''s draft the text.


  "My colleague, a historian of science and ideas, has been classifying historical
  narratives according to whether they commit what she calls ''Whig history''—writing
  the past as an inevitable march toward present conditions. Her recent verdicts are
  these. First, a narrative that presents Euclid''s parallel-postulate crisis as ''a
  necessary stumbling-block on the path to modern non-Euclidean physics'' she judged
  Whiggish. Second, a narrative that describes medieval Islamic astronomy as ''a coherent
  research program that eventually lost institutional support for reasons internal
  to its societies, not because it was conceptually superseded'' she judged not Whiggish.
  Third, a narrative that frames the 19th-century expansion of suffrage as ''the gradual
  awakening of humanity to its own inherent equality'' she judged Whiggish. Fourth,
  a narrative that describes the printing press as ''a technological catalyst that
  made the Reformation and Enlightenment possible, though neither was predetermined''
  she judged not Whiggish. Fifth, a narrative that evaluates 18th-century medical
  ethics by asking whether physicians respected patient autonomy in the modern sense
  she judged Whiggish.


  Next week she must evaluate a new proposal: a history of computing that describes
  Babbage''s Analytical Engine and Lovelace''s algorithms not as ''failed precursors
  to modern computers'' but as ''genuine alternative architectures that were abandoned
  because of funding politics and gendered exclusion, not conceptual inadequacy,''
  yet concludes that ''this abandonment merely delayed by decades the inevitable emergence
  of digital computation as we know it today.''


  Predict her verdict. More importantly, lay out the competing rules that fit her
  earlier judgments equally well—distinguishing at least retrospective instrumentalization
  (treating past events solely as means to present ends), normative anachronism (applying
  present moral or conceptual categories to past actors), and teleological compression
  (treating contingent outcomes as inevitable). Say which rule predicts Whiggish versus
  not Whiggish for the new case, state your best guess for her actual verdict with
  the reasoning that favors that rule over the others, and identify one further hypothetical
  narrative that would force a choice between the two leading rules."


