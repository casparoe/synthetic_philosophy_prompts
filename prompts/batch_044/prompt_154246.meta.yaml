  I am preparing an essay for a graduate seminar in philosophy of history, and I would
  appreciate critical comments on both its argumentative structure and its handling
  of the primary literature. The essay takes up the familiar tension between Leopold
  von Ranke''s aspiration to show the past "as it actually was" and the successive
  scepticisms advanced by E.H. Carr and Hayden White. Rather than treating this as
  a linear progression from naïve empiricism to full-blown narrativism, I want to
  argue that each position implicitly relies on a different conception of what it
  means for a representation to be constrained by evidence, and that recognizing this
  allows us to recover a limited but defensible notion of historiographical objectivity.


  My central claim is as follows. Ranke''s archival method is best understood not
  as a denial of interpretation but as a commitment to what we might call "documentary
  constraint": the historian''s narrative must be continuously answerable to the archive
  in ways that are publicly reproducible. Carr''s well-known critique—that facts do
  not speak for themselves and that the historian selects and arranges them—does not
  so much refute this commitment as relocate it: the selection itself becomes the
  site of interpretation, but Carr still assumes that there are better and worse selections,
  grounded in causal explanation and relevance to the present. Hayden White''s tropological
  analysis in his major study of nineteenth-century historiography pushes further,
  suggesting that the very form of the narrative—romance, tragedy, comedy, satire—is
  determined prior to empirical investigation by deep linguistic structures. I want
  to propose, however, that White''s framework can be read not as eliminating constraint
  but as transforming it: the master tropes do not free the historian from evidence,
  but they establish the conditions under which evidence can be recognized as such.
  In other words, I am suggesting a kind of "structural objectivity" internal to narrative
  form, analogous in certain respects to the theory-ladenness of observation in philosophy
  of science, though I am unsure whether this analogy holds without collapsing into
  a form of relativism that neither Carr nor White intends.


  Could you comment specifically on three points? First, is my characterization of
  White''s tropology accurate, or do I misrepresent his position by attributing to
  him a hidden commitment to constraint? Second, does the comparison between tropological
  prefiguration and theory-ladenness in science illuminate the debate, or does it
  import assumptions from philosophy of science that distort the specifically narrative
  dimension of historical explanation? Third, have I overlooked an important distinction—perhaps
  between epistemic and aesthetic objectivity, or between the objectivity of individual
  factual claims and that of overarching narrative structures—that scholars working
  in this tradition would consider essential? I am particularly interested in whether
  the essay''s attempt to salvage a limited objectivity from within White''s own framework
  is coherent, or whether it ultimately concedes too much to the sceptic.


