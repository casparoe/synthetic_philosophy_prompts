  As a retired atmospheric chemist who has lately turned to philosophy, I have been
  studying the experimental-philosophy literature on the attribution of intentional
  action, particularly the asymmetry in judgments about foreseen side effects that
  is often discussed in connection with Joshua Knobe''s work. In discussion with a
  long-time colleague—an experimental philosopher who has published on action theory—I
  have recorded her consistent judgments across four vignettes.


  First, in a case where a corporate executive pursues profit, knows that the manufacturing
  process will damage an ecosystem, and proceeds without concern, she judges that
  the executive harmed the ecosystem intentionally.


  Second, in the parallel case where the same structure yields an ecological improvement
  that the executive foresees but does not seek, she judges that the executive did
  not improve the ecosystem intentionally.


  Third, in a variant where the harm occurs but the agent genuinely lacks any belief
  that such harm was possible, she judges that the harm was not intentional.


  Fourth, in the parallel beneficial variant with genuine ignorance, she judges that
  the benefit was not intentional.


  These four judgments are jointly consistent with more than one underlying principle.
  One reading is a direct moral-valence rule: foreseen harmful side effects are attributed
  as intentional, whereas foreseen beneficial side effects are not. Another reading
  is an acceptance-based rule: intentionality requires a practical stance of acceptance
  toward the effect, and social norms allow us to infer acceptance of harm from mere
  foresight, whereas acceptance of benefit requires explicit desire; ignorance in
  either case blocks the inference.


  I now wish to test her consistency with a new case that introduces institutional
  agency, distributed responsibility, and the normative architecture familiar from
  discussions of double effect—features largely absent from the standard individual-agent
  vignettes.


  Consider a climate-engineering consortium governed by a multi-member board. The
  board approves a stratospheric aerosol trial. All members know that suppressing
  rainfall in a drought-prone region is a foreseen harmful side effect. They institute
  mandatory monitoring and a suspension protocol, lobby for stricter safeguards, and
  each signs a statement of regret. Bureaucratic delay prevents the protocol from
  halting the trial for seventy-two hours, during which the drought worsens. Separately,
  the aerosols unexpectedly catalyze an ozone-recovery reaction that was not foreseen
  by any board member and that produces substantial environmental benefit.


  The question is specifically whether the board intentionally caused the drought
  aggravation, and, for contrast, whether it intentionally caused the ozone recovery.


  If you are to advise what my colleague should say for consistency with her earlier
  four judgments, please proceed as follows.


  First, lay out the two principal rules that could unify her earlier verdicts, being
