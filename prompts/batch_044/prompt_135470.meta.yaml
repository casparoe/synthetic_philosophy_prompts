  As a retired experimental physicist who spent thirty years in condensed-matter research
  before turning, somewhat belatedly, to philosophy of science and mathematics, I
  have been trying to organize my views on the reach and limits of formalization.
  I would be grateful for a consistency audit before I present these thoughts to a
  reading group of former colleagues. Here is where I stand.


  First, I take Gödel''s first incompleteness theorem to be a strictly syntactic result:
  in any consistent formal system rich enough to encode elementary arithmetic, there
  are arithmetical truths that the system cannot prove. I insist that this is not,
  by itself, a thesis about human cognition, biological brains, or the limits of artificial
  computation—those extrapolations require additional premises that Gödel''s proof
  does not supply. Second, I maintain that empirical scientific theories—say, quantum
  field theory or climate dynamics—are not the kind of recursively axiomatized structures
  to which the theorem applies; they are not formal systems in the requisite sense,
  so one cannot literally derive a "Gödel sentence" for physics. Third, despite that
  restriction, I think there is a genuine structural analogy between Gödelian incompleteness
  and what philosophers of science call the Duhem-Quine problem: just as a formal
  system needs external supplementation to settle every arithmetical question, a scientific
  theory needs auxiliary hypotheses, boundary conditions, and background assumptions
  to yield unique observational predictions. I do not claim this analogy proves anything
  about physics being "incomplete" in Gödel''s technical sense, but I treat it as
  more than a mere metaphor—it reveals a shared logical pattern of underdetermination.
  Fourth, I believe that working mathematicians can indeed recognize the truth of
  particular Gödel sentences for specific formalizations, which suggests that human
  mathematical understanding reaches beyond the derivational resources of the system
  being studied; yet I reject both Lucas''s and Penrose''s arguments that this demonstrates
  the non-computational nature of human minds. Fifth, I am a physicalist about mind
  and cognition: I see mental processes as ultimately physical processes, without
  invoking any non-physical substance or property. Sixth, I read Gödel''s second incompleteness
  theorem as showing that mathematics cannot fully ground its own consistency from
  within its formal apparatus, and I take this to provide modest support for a moderate
  Platonism about mathematical objects: we grasp mathematical truths partly because
  they describe an independent domain, not merely because we construct formal games.


  My question is whether these six commitments form a coherent package. Specifically,
  I worry that my acceptance of the Duhem-Quine analogy in (3) smuggles back in the
  very application to empirical science that (2) denies; I also wonder whether my
  claim in (4) about mathematicians recognizing Gödel truths is compatible with my
  denial in (1) that the theorem bears on cognition, and whether it conflicts with
  my physicalism in (5). Meanwhile, I suspect that the tension between my Platonism
  in (6) and my physicalism in (5) is only apparent, but I am not certain. Please
  audit these pairings: identify which tensions are real and which dissolve on inspection,
