  "real welfare" beyond choice is to commit a category error. Stance two is normative
  and substantive: because agents reveal preferences through choice, policy can legitimately
  use choice data to promote welfare, correct for biases, and compare outcomes across
  individuals.


  What I notice is that proponents of revealed-preference frameworks move between
  these stances strategically, but not in the straightforward motte-and-bailey fashion.
  When critics object that people choose against their own interests—through addiction,
  framing effects, or incomplete information—the response often invokes stance one:
  revealed preference only records what was chosen, not what should have been chosen,
  so there is no failure to track welfare. Yet when the same framework is used to
  justify welfare comparisons, cost-benefit analysis, or the design of choice architectures,
  the justification suddenly relies on stance two: that revealed preferences carry
  normative weight precisely because they reflect genuine well-being.


