  be catastrophically bad not mainly because of the suffering or death of the last
  generation, but because it would permanently truncate an enormous landscape of potential
  future value—value that is impersonal in the sense that it does not depend on being
  assigned to, or experienced by, any particular determinately identifiable individual.
  Fourth, I hold that all genuine moral obligations are directed toward particular
  individuals, whether presently existing or determinately future; I reject the idea
  that there are free-floating duties to "value in general" or to abstract future
  generations taken as a collective. Fifth, I think that rational agents should nevertheless
  treat the prevention of human extinction as an overriding practical priority, comparable
