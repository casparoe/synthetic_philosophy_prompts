  and I want to test it with a framing I have developed: call it the entanglement
  quotient, meaning the degree to which a trait''s development is mechanistically
  coupled to another trait that is the actual selective target, such that the first
  trait is produced as an unavoidable structural byproduct rather than being independently
  modifiable. If two researchers disagree about whether language is an adaptation
  or a spandrel, are they actually disagreeing about the empirical value of this quotient—i.e.,
  whether language development can be decoupled from other cognitive architectures—or
  are they disagreeing about what explanatory burden counts as discharging an adaptationist
