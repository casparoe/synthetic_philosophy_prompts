  experience individually. Any belief can be preserved by adjusting others. This applies
  even to logic and mathematics: they sit near the center of the web, but they are
  not immune to revision. Quine thus rejects the idea that logical truths have a categorically
  different epistemic status. Rather, there is a continuum of centrality, with logic
  at one end and observation reports at the other.


