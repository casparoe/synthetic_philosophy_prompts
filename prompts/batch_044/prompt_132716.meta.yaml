  Type: Construct a thought experiment to specifications.

  Domain: Arrow''s impossibility theorem.


  Prompt idea:

  "Construct a collective-choice scenario in which Arrow''s four conditions—unrestricted
  domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives—are
  all satisfied simultaneously, but only because the voters share a specific epistemic
  structure that is rarely mentioned in textbook statements of the theorem. The scenario
  should be realistic (a workplace or committee, not an abstract society), no longer
  than a paragraph, and should not rely on relaxing any of Arrow''s conditions in
  the usual way (e.g., single-peaked preferences, cardinal utility, or a restricted
  agenda). Instead, the escape route should come from the voters having a common prior
  over outcomes and updating on a publicly observed signal before ranking alternatives,
  so that the social choice function aggregates beliefs rather than bare preferences.
  After describing the scenario, walk through why each of Arrow''s conditions is technically
  met, identify the precise feature that does the work (the shift from preference
  aggregation to belief aggregation), and explain what collapses if we remove the
  common-prior assumption—specifically, whether the impossibility returns in full
  or only in a weakened form. Finally, address how a defender of pure ordinal social
  choice would attack the case: would they say that belief-aggregation is not social
  choice at all, or that the common-prior assumption smuggles in a hidden dictator?"


