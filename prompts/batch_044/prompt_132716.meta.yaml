  Revised draft:


  Construct a collective-decision scenario that meets the following design specifications,
  writing in the style of someone who has followed the rationalist literature on decision
  theory and social choice for some time. The setting should be realistic—an investment
  committee, a peer-review panel, or a municipal planning board—compressed into a
  single paragraph, with no reliance on science-fictional technology or infinitely
  large populations. Within this setting, Arrow''s four conditions—unrestricted domain
  over preference orderings, the Pareto principle, independence of irrelevant alternatives,
  and non-dictatorship—must all be satisfied simultaneously, and a transitive social
  ranking must emerge. Crucially, you must not achieve this by any of the familiar
  textbook relaxations: do not restrict preferences to be single-peaked, do not switch
  to cardinal utility, do not limit the agenda, and do not allow interpersonal comparison.
  Instead, inject a niche epistemic mechanism: the committee members share a common
  prior over a set of world-states, observe a public, verifiable signal that updates
  all of their beliefs in the same direction, and then rank the available policies
  by expected utility calculated from that shared posterior. The aggregation rule
