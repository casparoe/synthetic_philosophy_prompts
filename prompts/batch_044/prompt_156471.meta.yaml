  essentially system 1 thinking — fast, narrative-driven, and unreliable — whereas
  the outside view is more like system 2 because it uses statistics. So being modest
  just means letting the statistics dominate unless you have genuinely unique information
  that breaks the reference class. The problem is that reference classes are always
  somewhat arbitrary, but that just means we should average across several reference
  classes and still stay close to the base rate. Ultimately, modesty is about knowing
  that your particular story is probably wrong."


