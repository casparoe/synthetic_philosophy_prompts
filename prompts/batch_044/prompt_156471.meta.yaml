  Question: "Explain the inside view versus the outside view in decision-making, and
  discuss how epistemic modesty should shape our response when the two conflict."


  Answer:

  "The inside view means reasoning from the specific causal details of the case at
  hand, while the outside view means reasoning from base rates of similar past cases.
  Epistemic modesty requires us to admit that our causal models are usually overfitted,
  so in a conflict we should default to the outside view and treat inside reasoning
