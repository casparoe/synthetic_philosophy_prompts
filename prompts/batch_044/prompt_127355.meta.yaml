  consciousness of a beautiful object is part of an organic unity: the object by itself
  might have no value, and the consciousness by itself might have little value, but
  together they form something far more valuable. Applying this to friendship with
  shared aesthetic experience, the affection between the friends and their joint appreciation
  form an organic unity whose value exceeds the sum of the two parts. Crucially, because
  the value is intrinsic and belongs to the whole rather than to its parts, the friendship
  retains its full value even if the friends are mistaken about the beauty of what
