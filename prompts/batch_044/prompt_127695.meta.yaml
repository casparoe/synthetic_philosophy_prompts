  Here is a pattern I keep noticing in analogical arguments, both in everyday reasoning
  and in theoretical modeling, and I do not know whether it has an established name.


  Consider cases where an analogy is drawn between a well-structured source domain
  and a more ambiguous target domain. The reasoner maps the explicit relational structure
  correctly—entities, relations, causal links—but also imports what we might call
  the "resilience profile" of the source: properties about which parts of the source
  are hard to alter, which are protected by background rules, and which are "load-bearing"
  for the structure''s stability. In the target, these resilience properties have
  no clear counterpart, yet they are treated as if they were mapped too. For example,
  in a debate about institutional reform, someone analogizes a university to a corporation
  and then treats tenure as if it were structurally protected—not because there is
  an independent argument that tenure serves a load-bearing function in universities,
  but because "shareholder protections" are load-bearing in corporations and the analogy
  has smuggled in that modal robustness. Another instance: in moral philosophy, an
  analogy between moral reasoning and legal interpretation leads a thinker to treat
  certain "precedents" in ethics as binding in ways that mirror stare decisis, not
  because ethical reasoning actually has an institutional mechanism for binding precedent,
  but because the source domain''s resistance to overturning cases is imported as
  a structural feature.


  The result is not simple overextension—new entities or relations are not invented—but
  rather a kind of "modal drag" where the target inherits constraints on changeability
  that come solely from the source''s architecture.


  My questions are:


  1. Is there an established concept in the analogy, cognitive science, or philosophy
  of science literature for this specific importation of robustness, resistance-to-change,
  or load-bearing properties across domains?

  2. If there is, how exactly does it differ from frame blending, source-domain leakage,
  and ordinary analogical overextension? Where are its boundaries?

  3. If there is no established term, please coin one, define it precisely, and specify
  at least two boundary cases—situations that look similar but are not instances of
  this phenomenon—and explain why they fall outside.


  Please do not provide a bibliography, reading list, or citations; I am interested
  in the conceptual carving itself. Answer as if explaining to an informed interlocutor
  who knows Hofstadter and Sanders''s general framework but has not encountered this
  particular distinction before.


