  a step-by-step justification for their assigned position that they themselves need
  not believe, explicitly labeling premises, inferences, and one point where they
  think a reasonable opponent might resist. Transcripts are anonymized, shuffled,
  and distributed randomly in the second phase (30 minutes): each student receives
  one transcript from the opposing camp and must classify it as either "good-faith
  reasoning from different premises" or "strategic bad-faith rhetoric," recording
