  that state.


  5. I reject evolutionary debunking arguments against the badness of pain on the
  grounds that our judgments here rest on direct phenomenological acquaintance, not
  on evolved inferential heuristics that selection might have distorted.


  6. Finally, I hold that reflective equilibrium, rather than evolutionary genealogy
