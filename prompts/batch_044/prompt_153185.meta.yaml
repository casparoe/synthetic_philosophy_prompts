  logic class that there will be a surprise quiz on one day of the next five-day week,
  and that the students will not be able to deduce the day in advance. The students
  apply backward induction and conclude no day works. The teacher then gives the quiz
  on Wednesday; the students are genuinely surprised. Some philosophers argue this
  shows that ''surprise'' is not closed under logical deduction—that knowing an event
  will happen in a window doesn''t eliminate surprise about the specific instance.
  Others say the paradox dissolves once we distinguish between knowing that p and
  knowing that one knows that p (common knowledge). Evaluate both responses and say
  which one better handles the Wednesday outcome."


