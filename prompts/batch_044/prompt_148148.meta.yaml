  Essay sketch: ''Instrumental Underdetermination in Mediated Observation''


  The familiar Quine-Duhem thesis maintains that a single piece of recalcitrant evidence
  never conclusively refutes an isolated theoretical hypothesis, because one can always
  preserve the hypothesis by modifying some auxiliary assumption elsewhere in the
  web of belief. While I accept this holistic picture, my experience with high-energy
  detectors suggests a further, structurally distinct problem. In experimental physics,
  raw instrument outputs—voltages, currents, digital counts—are not self-interpreting.
  They become evidence for or against a theoretical claim only after being processed
  through calibration models, reconstruction algorithms, and background-subtraction
  protocols, each of which embeds substantive theoretical commitments. Consequently,
  when two competing theoretical frameworks, T1 and T2, are both compatible with the
  same reconstructed dataset, the compatibility may depend not merely on ad hoc adjustments
  within T1 or T2, but on the simultaneous adoption of correspondingly different instrumental
  interpretation schemes, C1 and C2. The choice between the paired systems (T1, C1)
  and (T2, C2) is then underdetermined by the data, yet this is not precisely the
  Duhemian adjustment of auxiliary hypotheses within a single theory; rather, it is
  a co-constitution of the observational and theoretical domains. I propose calling
  this phenomenon instrumental underdetermination. For instance, in a drift-chamber
  measurement, the inference from ionization signals to particle trajectories presupposes
  a model of electron drift velocity and diffusion; should two competing field theories
  require different parameterizations of these processes to reproduce the same track
  patterns, the data alone cannot adjudicate between the combined theory-instrument
  packages. If this analysis holds, then the boundary between theory and observation
  in instrumentally rich sciences is not merely porous but systematically negotiable,
  and philosophers ought to treat calibration frameworks as part of the theoretical
  network rather than as neutral intermediaries.


  Please comment on the accuracy of my characterization of the Quine-Duhem thesis,
  on whether instrumental underdetermination is genuinely distinct from standard holistic
  underdetermination, on the clarity of the drift-chamber example, and on any philosophical
  literature that might already address this concern. I seek constructive criticism
  rather than a bibliography; my aim is to refine the argument''s conceptual architecture."


