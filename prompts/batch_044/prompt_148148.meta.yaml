  Title/Idea: "Instrumental Underdetermination: A Case from Experimental Physics"


  Argument:

  1. The Quine-Duhem thesis holds that any theory can be protected from recalcitrant
  evidence by adjusting auxiliary hypotheses.

  2. In mature experimental physics, however, there''s a deeper issue: the boundary
  between the theoretical system and the observational apparatus is itself fixed by
  theoretical commitments. Calibration models embed theoretical assumptions.

  3. Therefore, when two theories T1 and T2 both predict the same detector outputs,
  they may also embed different calibration theories C1 and C2. The choice between
  T1/C1 and T2/C2 is not resolved by data because the data are already interpreted
  through C.

