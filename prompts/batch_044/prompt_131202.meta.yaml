  be a verbal dispute about "harm"—with one side using it in a counterfactual-comparative
  sense and the other in a relational or participatory sense? Or is there a bedrock
  intuition about purity or cleanliness that the non-interventionists dismiss as irrational
  but that the interventionists treat as foundational? And if my structural-complicity
  hypothesis is correct, what would actually resolve or advance the debate? Would
  it take a formal model showing that structural reasons can be integrated into decision
  theory without violating the inefficacy intuition? A conceptual distinction that
  separates causal redundancy from moral redundancy? Or is the impasse a sign that
  the question—"what should I do given that my individual contribution is negligible?"—is
  itself malformed, and that progress requires abandoning the individual-level framing
