  be morally wrong given that the outcome is unchanged by any single contribution.
  The literature feels exhausted: everyone cites the standard causal redundancy arguments,
  everyone counters with appeals to collective responsibility or expressive reasons,
  and yet nobody in my group—nor, it seems, in the published exchange—has moved. The
  interventionists insist that participating in harmful collective practices is wrong
  even when one''s withdrawal makes no discernible difference; the skeptics reply
  that without a counterfactual difference, there is no harm to ground the wrongness,
  and that appeals to "setting an example" or "not being complicit" collapse into
  either wishful thinking about causal influence or a confusion of aesthetics with
  morality.


  My working hypothesis is that the stall is not about facts—everyone agrees on the
  physics of climate change, the economics of factory farming, and the mathematics
  of voting margins—but about a hidden disagreement over what counts as a moral reason
  in structurally redundant contexts. Specifically, I wonder whether the two sides
  are operating with incompatible models of moral causation: one side requires that
  a reason for action be tied to an actual or counterfactual change in the world-state
  (what we might call an efficacy-dependent reason), while the other allows reasons
  that are satisfied by the agent''s relation to the structure itself—what some recent
  work calls "structural complicity"—independent of marginal causal impact. If that''s
  right, then the debate might be substantive but ill-posed: the sides aren''t disagreeing
  about whether individual action matters, but about whether "mattering" is even the
  right metric for moral evaluation when collective mechanisms are involved.


