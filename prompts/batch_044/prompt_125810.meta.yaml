  At a recent discussion on moral philosophy, two acquaintances—Mira and Leo—got stuck
  arguing about whether a community has an ethical duty to preserve records of past
  collective wrongs, or whether active forgetting can itself be a moral achievement.
  Both had read Margalit''s work on the ethics of memory and Rieff''s defense of forgetting,
  but they applied those frameworks differently.


  Mira opened by claiming that remembering is a non-negotiable obligation for communities
  bound by "thick relations." She said that to deliberately destroy an archive of
  past harm—say, the testimonies and administrative records of a localized atrocity—is
  not neutral cleanup but active betrayal. It dissolves the conditions for genuine
  forgiveness, because forgiveness presupposes an acknowledged wrong that remains
  in shared awareness. She added that Rieff''s warning about memory becoming a weapon
  applies mainly to state-mandated commemoration, not to voluntary communal practices
  of remembrance.


  Leo replied that Mira was committing a category error. Margalit''s ethics of memory,
  he said, governs intimate and communal bonds, not institutional archives maintained
  by municipal authorities. Applying thick relational obligations to a public records
  office is like demanding that strangers love one another. He then invoked Rieff''s
  central claim: the command to remember is usually issued by those who do not bear
  its psychological cost, and institutionalized remembrance often serves present political
  actors more than past victims. For survivors, he argued, forced preservation can
  be a burden rather than a tribute.


  Mira countered that Leo was treating all institutional memory as coercive. She introduced
  a distinction—borrowed from recent work on mnemonic practices—between episodic forgetting
  (the loss of specific events) and structural forgetting (the erosion of the interpretive
  framework that makes those events morally legible). She argued that destroying the
  archive risks not just losing data but collapsing the framework through which the
  wrong is recognized as wrong. Without that structure, she said, future generations
  don''t forgive; they simply fail to understand what there was to forgive.


  Leo conceded that structural forgetting is a real danger, but he said Mira was assuming
  that archives are the only carriers of interpretive frameworks. Oral traditions,
  ritual, and even the physical absence of monuments can sustain moral legibility
  without preserving every document. He also pressed her on the "moral remainder"
  problem: if a community genuinely forgives, does the continued presence of the record
  serve any moral function, or does it become what Rieff calls a "frozen grievance"?
  He suggested that Mira''s position implicitly demands that forgiveness never be
  fully complete—that there must always be a leftover trace of the wrong—which seems
  to conflict with the very idea of reconciliation.


  Mira responded that Leo was conflating forgiveness with amnesia. She said forgiveness
  can be complete in the interpersonal sphere while the collective still owes a duty
  of remembrance to the dead. The archive is not for the forgiver''s sake but for
  the dead''s; it honors the fact that they suffered, independent of whether present
  relations are repaired. She added that Leo''s appeal to oral tradition was speculative:
  without material records, power dynamics determine whose version of the past survives.


  Leo then made a final move: he argued that Mira''s "doral" distinction—if I may
  call it—between honoring the dead and burdening the living is unstable. In practice,
  maintaining an archive requires labor, funding, and attention from the living. To
  claim that this serves the dead is to instrumentalize present people for the sake
  of past ones, reversing the proper direction of ethical concern. He concluded that
  a principled case for forgetting must allow communities to decide, after genuine
  reconciliation, that the past should no longer organize present resources.


