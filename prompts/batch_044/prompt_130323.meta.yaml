  I''m trying to distinguish manipulation from legitimate persuasion by working through
  my intuitive verdicts on specific influence scenarios, and I want to know whether
  a single principle can capture the pattern or whether some verdicts must be overturned.


  Here are my judgments. A physician who presents both absolute and relative risk
  figures for a surgery and lets the patient weigh them is engaging in legitimate
  persuasion. The same physician, knowing the patient has math anxiety, who deliberately
  suppresses the absolute figures and reports only the relative reduction to make
  the treatment sound more impressive, is manipulating. A marketing team that A/B-tests
  button colors and deploys a high-impulsivity-triggering shade only to users with
  high impulsivity scores is manipulating. A debate coach who teaches clear premise-conclusion
  structure so listeners can track and object is legitimately persuading. A political
  strategist who pairs immigration statistics with subtly chaotic background imagery
  — carrying no informational content but priming disorder-related affect — to shift
  opinion is manipulating. A novelist whose immersive narrative makes readers feel
  deep sympathy for a character with an unpopular moral view, leading some readers
  to revise their own view, feels like legitimate persuasion, even though the mechanism
  is emotional rather than argumentative. By contrast, a friend who knows I defer
  to authority figures and frames a request by citing an expert I admire, while misrepresenting
  that expert''s actual position, is manipulating.


  The pair that most troubles me involves framing for communication versus framing
  for extraction. A financial advisor who knows her client is loss-averse and therefore
  describes an investment portfolio in terms of "protecting existing capital" rather
  than "potential growth" — both accurate descriptions of the identical portfolio
  — strikes me as legitimately adapting to her client''s psychology. But a negotiator
  who knows the counterparty is loss-averse and frames a concession as "avoiding a
  worse deal" rather than "securing a gain" — structurally the same move applied to
  the same cognitive bias — strikes me as manipulative extraction. I cannot see what
  distinguishes them except the speaker''s intent or institutional role, neither of
  which feels like the right kind of principle.


  My tentative principle is that influence is manipulation when it reroutes decision-making
  through sub-personal cognitive mechanisms — loss aversion, affective priming, perceptual
  fluency, authority heuristics — in ways that the agent, upon reflective consideration,
  would not endorse as part of her own reasoning process, whereas legitimate persuasion
  operates within and strengthens the agent''s reason-responsive capacities. On this
  view, the physician suppressing figures, the targeted button color, the chaotic
  imagery, and the misrepresented authority all qualify as manipulation because they
