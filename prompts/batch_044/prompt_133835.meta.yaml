  Since retiring from experimental physics, I have been studying the philosophy of
  international law, particularly the conceptual boundaries of genocide as a legal
  and moral category. In a workshop led by Dr. Vasquez, we have examined four historical
  cases and her consistent verdicts, which I summarize below.


  Case 1. The Montagnard Child-Transfer Program: a state systematically removes the
  children of an upland ethnic minority, prohibits their language in all institutions,
  and destroys religious sites; mortality remains near baseline, but internal policy
  papers state the explicit aim is to "terminate the collective existence of this
  people as a distinct social form." Verdict: genocide.


  Case 2. The Northern Frontier Campaign: a state military operation against a semi-nomadic
  pastoral group in an arid region; official orders refer only to "securing water
  corridors" and "pacification"; direct violence and induced famine reduce the population
  by approximately 65 percent, survivors are dispersed into agricultural settlements,
  and no official document names the ethnic group as a target of destruction. Verdict:
  not genocide (classified as crimes against humanity and war crimes).


  Case 3. The Balkan Enclave Siege: a prolonged siege of an ethnic enclave accompanied
  by mass executions of roughly one-quarter of the group, systematic sexual violence,
  destruction of cultural monuments, and propaganda declaring that "this people must
  vanish from the earth." Verdict: genocide.


  Case 4. The Agrarian Class Purge: a state campaign targets a category defined solely
  by land-ownership and economic function, not by ethnicity, religion, or nationality;
  explicit rhetoric calls for "the elimination of this class"; mass executions and
  engineered starvation kill approximately two million; survivors are not targeted
  as a collective identity. Verdict: not genocide.


