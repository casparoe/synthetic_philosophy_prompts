  I reject the retrospective-prediction possibility in (2) or (3), or is there a hidden
  normative condition in (1) that I have omitted—perhaps concerning the temporal order
  of prediction and accommodation? I am inclined to preserve both (1) and (5), but
  I want to understand precisely what I am paying if I block the inference at a different
  point.


