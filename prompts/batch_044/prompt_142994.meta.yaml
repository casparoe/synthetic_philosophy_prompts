  Having spent thirty years in experimental physics before retiring and turning to
  philosophy of science, I have been working through the literature on demarcation
  with some fellow amateurs in our local discussion group. Last week we focused on
  Imre Lakatos''s conception of scientific research programmes, specifically his distinction
  between progressive and degenerating problem shifts within the protective belt surrounding
  a hard core. I tried to formalize a worry that now strikes me as suspicious because
  it seems to dissolve Lakatos''s own negative examples—such as the programmes he
  considered pseudoscientific—into trivial progressiveness. Here is the chain I built:
  (1) By Lakatos''s account, a problem shift is progressive when adjustments to the
  protective belt yield predictions of novel, hitherto unexpected facts, and degenerating
  when they serve only to accommodate already-known anomalies. (2) Any given theoretical
  adjustment in the belt, however ad hoc it appears, can in principle be shown to
  entail some previously untested consequence if one examines its mathematical structure
  with sufficient ingenuity. (3) Therefore, for any adjustment we can retrospectively
  construct a "novel prediction" that it technically makes, regardless of whether
  anyone actually derived or tested that consequence before the adjustment was introduced.
  (4) It follows that no protective-belt modification can be conclusively classified
  as degenerating, since the condition in (1) for progressiveness is always satisfiable
  ex post. (5) Yet Lakatos plainly intended certain historical programmes—Marxist
  historiography and Freudian psychoanalysis among them—to count as degenerating.
  (6) So there must be an implicit restriction in Lakatos''s framework that prevents
