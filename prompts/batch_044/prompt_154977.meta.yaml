  or seven-fold scheme of predication. She said that from the standpoint of predictive
  modeling (the "is" mode), the claim is true; from the standpoint of moral agency
  requiring embodied suffering and compassion (the "is not" mode), it is false; and
  from the standpoint of technological trajectory considered independently of ethical
