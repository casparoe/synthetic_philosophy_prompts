  She insisted this is not contradiction but syādvāda—the "perhaps" or conditional
  mode—because Jain metaphysics distinguishes dravya (the enduring substance) from
  paryāya (the transient modes or attributes). Thus, AI might possess the functional
  substance of computation without possessing the modal quality of moral authority.


  Omar replied that Nina is smuggling in relativism under metaphysical language. He
  said that if every assertion must be qualified by an implicit "from some standpoint,"
  then there is no fact of the matter about whether AI will be a moral arbiter, which
  makes the claim meaningless rather than complex. He argued that the distinction
