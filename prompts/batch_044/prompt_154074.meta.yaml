  Student answer draft:

  "Ryle''s distinction separates knowing-how, which is a practical ability, from knowing-that,
  which is propositional belief. The intellectualist, as represented by Stanley and
  Williamson, denies this separation, arguing that knowing-how is just a form of knowing-that:
  specifically, knowing that w is a way for me to F. This reduces skill to propositional
  knowledge. However, this misses Ryle''s point that intelligent action requires the
  direct exercise of ability, not the retrieval of propositions. The surgeon case
  shows that knowing-how can survive loss of embodiment if the same outcomes are achieved,
  which suggests that the bodily component is inessential and that knowing-how is
  really a form of knowing-that applied through technology. This supports the intellectualist
  view, not Ryle''s.


  As for tacit knowledge, Polanyi''s concept of tacit knowing is essentially the same
  as Ryle''s knowing-how: both refer to knowledge that cannot be articulated in propositional
  form. Once we allow that propositional knowledge can be implicit—held without conscious
  access—Ryle''s regress argument collapses. The regress claims that if intelligent
  action required prior knowing-that, then we would need an infinite chain of premises.
  But if the premises are implicit, they do not need to be intelligently applied at
  each step, since implicit knowledge operates automatically. Therefore, allowing
  implicit propositional knowledge blocks the regress without requiring a distinct
  category of knowing-how.


  Thus, the distinction between knowing-how and knowing-that is largely a matter of
  accessibility: explicit versus implicit propositional knowledge. The embodied aspect
  is secondary, as the surgeon example demonstrates."


