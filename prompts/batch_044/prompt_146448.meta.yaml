  ---


  After a long and exhausting argument with a close friend last night, I am still
  unsettled about a betting game he proposed for our weekly card club and the reasoning
  he used to defend it. He designed a simple die-rolling game: roll a fair six-sided
  die repeatedly until a six appears. The payout depends on the roll on which the
  six lands—specifically, on roll one you receive four dollars, on roll two you forfeit
  eight dollars, on roll three you receive sixteen dollars, on roll four you forfeit
  thirty-two dollars, and so on, with the amount doubling each time and the sign alternating
  between win and loss. I pointed out that if you compute the expectation in the usual
  way—multiplying each outcome by its probability and summing—you get a series that
  oscillates between zero and one without ever settling: 1 − 1 + 1 − 1 + ... . My
  friend conceded that the expectation is undefined in the standard sense, but he
  insisted that this does not mean the game is irrational to play. He argued that
  because the potential winnings grow exponentially, a rational player should be willing
  to pay a modest entry fee, perhaps even a substantial one, since the "average" outcome
  over any large but finite number of rounds is roughly balanced but the upside is
  enormous. I countered that without a convergent expectation we have no normative
  benchmark for what "modest" or "substantial" means, and that appealing to intuition
  about large payouts seems like a category mistake once the formal expectation collapses.
  He then proposed a resolution I had not considered: instead of treating all future
  rolls equally, we should apply a temporal discount factor—weighting the payoff on
  roll n by a factor that decays exponentially with n—to reflect the practical cost
  of waiting and the psychological reality that distant outcomes matter less. Under
  this weighting, he claimed, the series converges to a definite value, and the game
  becomes analyzable. I remain skeptical, partly because the discount rate seems arbitrarily
  chosen, and partly because I worry that altering the evaluation rule to force convergence
  is just a way of hiding the underlying problem rather than solving it. The core
  of our disagreement, I think, is not about arithmetic but about what we owe to formal
  decision theory when its standard tools break down. Should an undefined expectation
  be treated as a prohibition on playing, as a license to rely on intuition, or as
  an invitation to revise the evaluation framework? And if we do revise it—say, by
  introducing discount weights or by averaging partial sums—have we preserved the
  rational structure of the choice, or have we merely replaced one paradox with a
  convention? I would appreciate help seeing the philosophical structure of this situation
  and understanding whether there is a principled way to navigate it, especially given
  that any answer should not depend on searching for the specific game or its history
  but should address the reasoning itself.


  ---


