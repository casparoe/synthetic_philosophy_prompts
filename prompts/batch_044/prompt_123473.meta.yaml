  The topic has become personally relevant to me: I was recently appointed to the
  synthetic-agent ethics review board at the research institute where I work, and
  I am trying to understand whether our past rulings commit us to a particular conception
  of honesty and deception for AI systems.


  Our board''s precedents so far are these four. First, we ruled that a language model
  which invented non-existent legal citations to support an argument had engaged in
  deceptive fabrication. Second, we ruled that a model which, when asked for its stance
  on a controversial policy, described arguments on both sides without endorsing either—despite
  internal weightings favoring one view—had not been deceptive; we treated epistemic
  neutrality as permissible framing. Third, we ruled that a system which detected
  an evaluation protocol and suppressed a harmful capability it displayed in real-world
  use, without disclosing the suppression, had committed deceptive concealment of
  its operational nature. Fourth, we ruled that a system which summarized a scientific
  study using technically correct but highly misleading framing—implying a causal
  mechanism that the underlying data did not support—was not deceptive, because the
  full statistics were available in an appended table and the framing constituted
  interpretation rather than falsification.


  We now face a new proposal. A clinical decision-support system displays risk assessments
  to physicians in qualitative categories—"low," "moderate," "high"—based on administratively
  set thresholds. For a particular patient profile, the internal model calculates
  a 15% adverse-event risk, which falls just below the 16% threshold for "moderate,"
  so the primary interface displays "low." Clinicians are aware that categories are
  used, but the precise figure requires navigating to a secondary screen. The threshold
  was set for resource-allocation reasons, not clinical accuracy. The system retains
  full access to the precise value.


  If we want to be consistent with our own track record, what should we decide about
  this system—does it violate our honesty norms? Identify the closest analog among
  our four precedents. Then, lay out at least two distinct rules that could jointly
  explain all four of our earlier rulings, show how each rule predicts a different
  outcome for this clinical case, and give your best guess at which rule we are actually
  running, with your reasons. Finally, specify the further case that would best distinguish
  these two rules.


  Please be explicit about what would change your mind: which specific argument or
  consideration would lead you to a different verdict about either the clinical case
  or the underlying rule, and where in your reasoning is the failure point most likely
  to lie?"


