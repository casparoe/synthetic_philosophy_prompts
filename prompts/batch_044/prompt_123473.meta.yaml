  "You are a senior philosopher of technology with expertise in machine ethics and
  conceptual analysis. Before giving your final answer, please spend a few paragraphs
  brainstorming the different conceptual distinctions that might be in play—particularly
  around representational fidelity, role-contract obligations, and the difference
