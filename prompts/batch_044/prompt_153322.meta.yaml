  Exam question:

  Some defenders of authoritarian government in Singapore and China argue that sustained
  economic growth, public order, and administrative competence—often summarized as
  "performance legitimacy"—can justify the absence of democratic input. Drawing on
  the distinction between output legitimacy (the state''s delivery of welfare and
  stability) and procedural dignity (the claim that legitimate authority requires
  citizens to be authors, not merely beneficiaries, of collective decisions), assess
  whether prosperity and order alone can ground legitimate authority. In particular,
  evaluate whether Singapore''s model of meritocratic developmentalism avoids the
  charge that citizens are treated as instruments of state policy rather than as participants
  in shaping it.


  Student answer:

  Performance legitimacy holds that a government is legitimate if it delivers results,
  regardless of how leaders are selected. In Singapore, the People''s Action Party
  has maintained high growth and low corruption through technocratic governance, which
  suggests that citizens do not need electoral mechanisms to have their interests
  represented, since expert administration achieves those interests more efficiently.
  China''s rapid industrialization under authoritarian rule shows that procedural
  dignity is essentially a luxury concern: once basic needs are met, societies can
  afford democratic deliberation, but until then, output legitimacy is sufficient.


  The instrumentalization objection—that citizens are used as means to state ends—fails
  in Singapore''s case because the government provides extensive public housing, education,
  and healthcare. When citizens receive these benefits, they are not being treated
  as mere tools but as valued members of the political community whose welfare is
  central. Furthermore, Singapore''s consultative mechanisms allow feedback into policy,
  which means citizens function as indirect co-authors of development strategy. By
  contrast, China''s model is more vulnerable to the objection because its growth
  has relied on suppressing labor organization, but even there, rising incomes suggest
  that the state respects citizens'' interests, if not their voices.


  John Rawls argued that procedural fairness is only required in societies that have
  already reached a high level of material development; before that threshold, authoritarian
  efficiency is morally permissible. Therefore, Singapore demonstrates that performance
  legitimacy can be fully sufficient when combined with meritocratic selection and
  responsive bureaucracy, while China''s case shows the limits of this argument when
  procedural feedback is weak.


  Grade this answer with specific comments on its reasoning, and identify any subtle
  errors in conceptual application or attribution.


  Please also state explicitly what would change your assessment: which specific argument
  or piece of evidence about the relationship between prosperity and procedural dignity
  would lead you to revise the grade upward or downward, and where in your reasoning
  is the evaluation most vulnerable to being wrong?


