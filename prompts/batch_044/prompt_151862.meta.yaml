  Here''s the setup: The standard Platonia dilemma — two agents with identical reasoning,
  each decides whether to enter a lottery. If exactly one enters they win a million,
  if both or neither they get a hundred bucks. No cost to enter.


  Now my twist: call it the Cascaded Lure. There''s three rounds. Before round 1,
  both agents are told they have a hidden "type" — either Stable or Volatile — assigned
  randomly and privately. In each round they simultaneously choose Enter or Pass.
  The payoff for round r depends on the pair of choices in that round AND the types
  revealed after round 3. Specifically: if in any round exactly one enters, that agent
  gets $500k multiplied by the round number, but only if their hidden type is Stable;
  if Volatile they get nothing. The other agent gets $50k regardless of type. If both
  enter or both pass in a round, each gets $200 that round. After round 3, all types
  are revealed publicly.


  The agents are superrational: they know they share the same reasoning algorithm
  and will reach identical conclusions about what to do in each round, unless their
  hidden type gives them private information (it doesn''t — types are unknown even
  to themselves).


