  A friend has been pushing an argument about Douglas Hofstadter''s satire on gendered
  language — the one where he reverses masculine and feminine generics to expose hidden
  defaults — and I think it proves far more than it should. Here is the chain:


  (1) In Hofstadter''s reversal, replacing universal "he" and "man" with universal
  "she" and "woman" makes the male reader feel erased, revealing that masculine generics
  carry a hidden male default and force women to perform constant mental translation.


  (2) The harm is not merely statistical underrepresentation in vocabulary; it is
  that the term claims universality while structurally encoding a specific group as
  the unmarked norm, so excluded members must either accept misdescription or expend
  cognitive labor to correct it.


  (3) If this is the correct diagnosis of linguistic harm — that any universal category
  which encodes a hidden prototype causes analogous erasure — then the reversal strategy
  applies to every taxonomic term that groups heterogeneous items under one label
  with a salient prototype.


  (4) For example, "human being" in much philosophy carries a hidden prototype (rational,
  autonomous, language-using adult), "planet" carries a hidden prototype (rocky body
  orbiting a main-sequence star), and "belief" carries a hidden prototype (explicit,
  conscious, propositional attitude).


  (5) By Hofstadter''s method, we could write a parallel satire reversing "human being"
  to mean "fully rational autonomous adult" and showing that infants or severely disabled
  people are rendered linguistically invisible; the same for planets (reversing to
  "gas giant" to erase Earth) or for belief (reversing to "explicit judgment" to erase
  implicit attitudes).


  (6) So either we accept that all taxonomic language is structurally oppressive in
  the same way gendered generics are — which seems absurd, since "planet" is not morally
  harmful — or we deny that hidden prototypes cause harm in general.


  (7) But if hidden prototypes do not cause harm in general, then gendered generics
  are harmful only because of some extra feature specific to gender (say, social power
  asymmetry).


  (8) Yet Hofstadter''s reversal argument is designed precisely to show that the harm
  is visible without invoking power asymmetry: the male reader feels erased purely
  from linguistic reversal, not from historical oppression.


  (9) Therefore the reversal either overgeneralizes to all language, or it implicitly
  relies on the very power asymmetry it claims not to need, undermining its own demonstration.


  Which step should I reject? I want to keep (1) and (2) intact — that there is a
  real phenomenon of hidden-default erasure in gendered language — and I''d prefer
  not to deny (7), since gender asymmetry is real. Is the mistake in (3), where I
  move from gendered language to a general principle about prototypes? Or is there
  a subtler slide — perhaps between "hidden default in a social identity term" and
  "hidden prototype in a scientific taxonomy" — that makes (4) or (5) illegitimate?
  And whatever I reject, what does it cost me: do I have to admit that Hofstadter''s
  satire works only as rhetoric, not as a general argument about language; or do I
