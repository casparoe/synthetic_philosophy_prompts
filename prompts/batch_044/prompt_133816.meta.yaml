  Let''s outline:


  (1) For Dewey, democracy is not a form of government but a mode of associated living
  organized as continuous cooperative inquiry into shared problems.


  (2) The norm of democratic inquiry is the same as scientific inquiry: hypotheses
  are tested by their consequences in experience, and no belief or institution is
  immune from experimental revision.


  (3) If democratic legitimacy derives solely from functioning as cooperative inquiry,
