  national elections, the contribution of any single person is so minute that it makes
  no detectable difference to the outcome. He claimed that if an action cannot change
  whether a harm occurs, then blaming or obliging individuals to act differently is
  irrational. He added that this is not mere cynicism but a logical point about causation:
  moral responsibility typically requires that one''s conduct actually makes a difference,
  and here it does not.


  Nina replied that Ravi was conflating causal efficacy with moral complicity. She
  said that participating in a harmful collective practice can be wrong even when
  one''s withdrawal does not stop the practice, because the wrong lies in being part
  of the collective mechanism rather than in being the decisive cause. She pointed
  to voting as an example: even though one vote almost never decides an election,
  democratic citizenship involves an expressive duty to contribute to collective decision-making,
  not merely a strategic calculation of influence.


