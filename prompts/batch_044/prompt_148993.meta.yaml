  need not assert a universal negative with absolute certainty; rather, they can advance
  a fallibilist stance—that every specific claim should be held open to revision—without
  committing to an unrevisable meta-claim. She argued that Marcus''s version of the
  paradox only works if you assume that denying dogmatism requires the same epistemic
  status as the dogmatism being denied, which is precisely what fallibilism rejects.


  Marcus then pressed a second-order point: if Elena admits that her fallibilist principle
  is itself revisable, then she has no stable ground from which to criticize dogmatism;
  if she claims it is not revisable, then she has erected a new dogma. He called this
  the "regress of humility"—any attempt to institutionalize anti-dogmatism either
  collapses into instability or hardens into orthodoxy.


