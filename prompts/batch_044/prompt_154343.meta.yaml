  Then, write one exam essay question (for a 90-minute sitting, approximately 1000
  words) on the problem of induction and Goodman''s grue. The question must be unanswerable
  by reciting that ''grue'' means green before time t and blue thereafter, or by summarizing
  Goodman''s appeal to entrenchment. Instead, it should force students to confront
  a specific tension: if projectibility is justified by past inductive success, the
  justification is circular, and if it is fixed by linguistic entrenchment alone,
  it seems sociologically contingent rather than epistemically principled. To push
  students past the textbook summary, inject the following constructed scenario: consider
  a predictive feature F that tracks a correlation that reverses at t in the observed
  data, but is defined by an underlying causal mechanism that is symmetric across
  t, in contrast to ''green'', which tracks an asymmetric causal process. Ask students
  whether this mechanistic distinction supplies an independent, non-circular criterion
  for projectibility, or whether identifying the relevant causal symmetry itself presupposes
  the inductive inferences Goodman sought to ground.


