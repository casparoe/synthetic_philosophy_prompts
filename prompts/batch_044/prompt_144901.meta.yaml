  complexity of the divergence between the actual world trajectory and a counterfactual
  trajectory in which the agent never activated, restricted to variables not mentioned
  in its explicit reward specification. They claim this requires no prior commitment
  to which states are valuable; it just tracks "unexpected" change. The opposing camp—call
  them the value-dependence theorists—replies that selecting which variables belong
  in that divergence measure, deciding what counts as "unexpected," and even choosing
  the counterfactual baseline all smuggle in normative judgments about what is worth
  preserving. Both sides have been talking past each other for years: they share the
  same examples (the paperclip maximizer, the cleaning robot that knocks over a vase),
  they agree unintended consequences are bad, and they both accept the same formal
  apparatus of state spaces and reward functions. Yet neither has budged.


  My own working hypothesis is that the disagreement is not really about whether values
  are needed, but about two different conceptions of agency—specifically, whether
  an action should be individuated relative to an observer-independent causal baseline
  or relative to a normatively loaded description of the environment. But I am unsure
