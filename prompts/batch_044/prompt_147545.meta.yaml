  transatlantic slavery as largely a story of shifting geopolitical and industrial
  incentives rather than of philosophers persuading parliaments. Third, I maintain
  that once the status and interest structures have turned, moral reasoning functions
  mainly as a legitimizing narrative for elites who have already decided to defect,
  not as an independent causal engine. Fourth, I am also a moral realist: I think
  there was an objective moral fact that chattel slavery was gravely wrong in 1750,
  and that defenders of slavery then were not merely out of step with emerging honor
  codes but genuinely in error about a mind-independent moral reality. Fifth, I think
  that normative ethics should therefore be strategic: if we want to accelerate moral
  progress on issues like factory farming or carbon-intensive consumption, we should
