  it retains the core aggregative structure: it still adds up gains and losses across
  different people. Consequently, average utilitarianism can still justify sacrificing
  one person for the benefit of several others, provided the survivors'' gains are
  large enough to raise the mean. Thus it does not answer Rawls''s fundamental challenge.


