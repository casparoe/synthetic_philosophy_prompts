  are ''in my head'' or distributed across this unstable, probabilistic scaffold.
  The literature seems stuck in a loop I can map out precisely: Clark and Chalmers
  propose active externalism via the parity principle—if an external process plays
  the same functional role as an internal one, it counts as cognitive—while critics
  like Adams and Aizawa and Rupert reply that coupling is not constitution, that functional
  equivalence misses the mark, and that this leads to ''cognitive bloat.'' Defenders
  then refine the conditions—reliability, accessibility, trust—and critics adjust
  the counterexamples. After decades, every move is catalogued; nobody changes sides,
  and the examples (Otto and his notebook, Inga and her biological memory) feel like
  ritual incantations rather than live tests.


  My working hypothesis is that the stall is not empirical but architectural: the
  two sides are answering different questions under the single heading ''where is
  the mind?'' One side is asking a metaphysical question about the boundaries of the
  cognitive system given functional criteria; the other is asking a normative or explanatory
  question about what makes a mental state genuinely mine, accountable, and non-derivative.
  But I want a sharper diagnosis. Is this a verbal disagreement about what ''cognitive''
  means—something like a family resemblance term being stretched—or a substantive
  clash about the conditions for mental ownership? Or is there a hidden formal disagreement
  about whether parity requires token-identity of representations, or about whether
  reliability must be diachronically stable rather than merely synchronic?


  To push past the ritual, I want to inject a specific wrinkle that the classic literature
  largely ignores: what happens when the external vehicle is not a stable notebook
  but a stochastic retrieval-and-generation system that never stores the same representation
  twice? If Otto''s notebook were replaced by a system that probabilistically reconstructs
  his beliefs about MoMA each time he queries it, does the parity principle still
  apply? Does the instability break the coupling, or does functional equivalence survive
  as long as the statistical profile of outputs matches Inga''s neural retrieval?
  And crucially: if the debate stalls here, is that because both sides implicitly
  assumed that extended cognition requires a transparent, durable vehicle—making the
  disagreement really about the metaphysics of storage rather than about mind per
  se? I want you to diagnose the structure of the impasse using what each side actually
  commits to about ownership, reliability, and functional role, not just survey the
  interpretations. Tell me whether this is bedrock intuition, a hidden empirical claim
  about neural versus external storage, or two disciplines—philosophy of mind versus
  cognitive engineering—talking past each other. And given your diagnosis, what would
  actually count as progress: a conceptual distinction that dissolves the question,
  a formal model of stochastic coupling, an empirical finding about predictive processing
  in human-tool interaction, or the recognition that the question is ill-posed and
