  (anumāna), testimony (śabda), and comparison (upamāna)—as exhaustive of basic epistemic
  sources, and I treat absence (anupalabdhi) as reducible to inference with a negative
  predicate rather than an independent pramāṇa. (2) I hold that each pramāṇa is intrinsically
  valid (svataḥprāmāṇya): a cognition arising through a properly functioning source
  carries a defeasible default entitlement that does not depend on corroboration by
  other sources. (3) I think that when deliverances conflict—say, perceptual appearance
  versus authoritative testimony—the rational resolution is reflective equilibrium:
  we weigh coherence with background beliefs, explanatory power, and the specific
  conditions of the source''s operation, rather than applying a rigid lexical ordering.
  (4) I believe evolutionary debunking arguments apply selectively: they undermine
  inference and testimony, since both depend on mechanisms shaped by selection for
  survival rather than truth-tracking, but they leave direct perception untouched
  because perceptual mechanisms are tightly coupled to present environmental stimuli.
  (5) I maintain that phenomenal self-knowledge is delivered through direct acquaintance
  functioning as mental perception (mānasapratyakṣa) within the Nyāya taxonomy, yet
  I deny this requires a fifth "inner sense" pramāṇa; phenomenal concepts are special
  only in their mode of presentation, not in their epistemic source. (6) I take comparison
  (upamāna) to be genuinely irreducible: it establishes a relation of similarity (sādṛśya)
  that is not decomposable into perceptual or inferential elements, and it plays an
  indispensable role in linguistic learning. (7) Finally, I hold that "tarka"—counterfactual
  and consistency-checking reasoning—does not itself yield knowledge (it is not a
  pramāṇa), yet it functions as a structural filter on inference; without it, inferential
  evaluation collapses, so in practice it operates as a shadow source of justification.


