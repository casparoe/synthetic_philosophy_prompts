  over which beliefs become arbitrarily privileged. In Round 2 (Coherentist), no belief
  may be admitted unless it is supported by at least two already-admitted beliefs,
  and the board must achieve a single closed loop with no dangling nodes; participants
  will feel the pressure to reject intuitively obvious beliefs that fail to cohere
