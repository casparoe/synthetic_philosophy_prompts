  claims about long-term declines in physical violence—seems to stall not because
  of missing data, but because participants silently switch between metrics (per-capita
  homicide versus absolute war casualties, state versus non-state violence, direct
  physical harm versus structural or ecological damage) and then treat their preferred
  metric as revealing the real fact of the matter. I want to ask a more precise, and
  I think underexplored, question: is there a fact of the matter about whether global
  violence is declining that is independent of these framework choices, and if not,
  is there at least a structured, non-arbitrary way to say that the answer depends
  on how we weight different harm-types?


  My half-formed idea is to develop what I am tentatively calling a modal-robustness
  framework for contested historical classifications. Rather than defending a single
  definition of violence and computing trends within it—a strategy that dominates
  both the optimistic and pessimistic literatures—I would map the logical space of
  reasonable conceptual frameworks (varying temporal baselines, population denominators,
  and inclusion rules for institutional and ecological harm) and ask whether the decline
  thesis holds, fails, or inverts across that space. If the thesis is true in every
  framework within a plausibly bounded region, then we have a framework-independent
  fact; if it is true in some and false in others with no principled way to choose,
  then the dispute is partly verbal in a precise metaontological sense; if it holds
  in a core cluster but fails at the margins, then we can specify exactly which normative
  commitments drive the disagreement. The deliverable would not be an empirical dataset—others
  have done that work—but a philosophical decision architecture: a structured taxonomy
  of the metric choices, a set of conditions under which cross-framework convergence
  or divergence occurs, and explicit criteria for when policymakers should treat the
  decline claim as robust, contested, or framework-relative.


  The existing literature on violence trends, as I understand it, typically treats
  metric disagreement as a problem to be solved by finding the correct measure, or,
  in more critical work, as proof that the entire debate is ideologically loaded.
  What is missing is an intermediate position that takes the metaontological problem
  seriously without collapsing into global skepticism about empirical claims. I plan
  to spend the first two months constructing the taxonomy of harm-types and weighting
  schemes; months three and four applying the robustness mapping conceptually to existing
  historical ranges (without computing new statistics, but using well-known data ranges
