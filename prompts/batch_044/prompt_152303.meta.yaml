  Please include at least one case where the procedure yields an answer I am likely
  to dislike as an efficiency-focused officer. Clearly state what the procedure cannot
  settle, and flag any points where professional judgment remains unavoidable.


  Finally, please indicate how confident you are in the answers given, and identify
  the specific point about which you are least certain.


