  must distinguish (a) transparent adaptation revisable by the learner, (b) opaque
  optimisation that treats cognitive load as a variable to be managed without disclosure,
  and (c) justified paternalistic override. Include explicit criteria for identifying
  "imminent severe harm" and "revisability" in this context.


  Then run the procedure on three proposals:


  1. The system detects repeated failure in calculus exercises and automatically substitutes
  simpler problems without notifying the student, projecting a thirty per cent retention
  gain.


  2. The system receives an explicit student instruction to "increase difficulty,"
