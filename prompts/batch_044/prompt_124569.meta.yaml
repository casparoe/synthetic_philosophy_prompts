  "I am a retired physicist who, since leaving the laboratory, have begun auditing
  philosophy of mathematics courses and joining a small reading group of fellow retirees.
  We are currently working through Jorge Luis Borges''s ''The Library of Babel,''
  and in parallel I have been trying to make sense of Skolem''s paradox — specifically,
  the consequence of the Löwenheim-Skolem theorem that if ZFC is consistent it has
  a countable model, within which there nonetheless exist sets that the model treats
  as uncountable. I am struck by the possibility that Borges''s narrative might serve
  as an informal dramatization of exactly this model-relativity of cardinality.


  The librarians inhabit a universe they experience as absolutely total and infinite,
  comprising every possible book formed from a fixed alphabet within a fixed page-length
  — the familiar 410-page volumes. From inside, certain collections, such as the set
  of all possible catalogs or all books containing a given sentence, appear so vast
  as to be beyond enumeration. Yet from an external, model-theoretic standpoint, the
  entire Library could be regarded as countable, with ''uncountability'' being not
  an absolute feature of reality but an internal judgment relative to the axiomatic
  resources available within the model. I would like a reading that takes both the
  story and the logical result seriously, without reducing Borges to an illustration
  or distorting Skolem''s result to fit the fiction.


  Specifically: does the librarians'' failure to discover a complete catalog mirror
  the internal experience of living inside a countable model that misjudges its own
  cardinality? Where does the paradox illuminate particular scenes — for instance,
