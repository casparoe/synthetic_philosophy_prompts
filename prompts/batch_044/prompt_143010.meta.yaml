  an explicit rule or law. He responds that, although no such law may be available,
  one may still conceive a simultaneous assignment that pairs every non-empty subset
  with exactly one of its members. These assignments are arbitrary in the sense that
  they are not determined by any shared property of the chosen elements, yet he treats
  the totality of all such assignments as a definite object—a choice function—from
  which the well-ordering follows. I need help understanding the precise logical and
  philosophical status of this move.


  Specifically: Is Zermelo asserting the existence of a mathematical object for which
  no constructive procedure can be given? If so, what justifies treating it as definite
  rather than as a fiction? Does his defense depend on a Platonic view that sets and
  their selections exist independently of our ability to describe them, or can it
  be sustained as a purely formal stipulation within an axiomatic system? I am also
