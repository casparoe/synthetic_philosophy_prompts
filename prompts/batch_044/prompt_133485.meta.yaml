  like a careful check of whether the following commitments hang together. Here is
  my position on pain, asymbolia, and badness:


  (A) The badness of pain is not an intrinsic sensory quality but the registration
  of a high-precision interoceptive prediction error: nociception signals a deviation
  from predicted bodily states, and "unpleasantness" just is that error being weighted
  as highly salient.


  (B) Classic pain asymbolia confirms that this evaluation can be dissociated from
  discrimination: patients retain accurate sensory localization and intensity ratings
  but report no unpleasantness and no motivation to withdraw, because the precision-weighting
  mechanism has collapsed.


  (C) Consequently, "pure sensory pain" — intact nociceptive discrimination without
  affective evaluation — describes a real neurological state, not merely a conceptual
  abstraction.


  (D) I therefore think that a being with permanently suppressed precision-weighting
  (a stable asymbolic architecture) could suffer tissue damage without being wronged,
  since wrongness in harming depends on causing that high-precision error, not on
  causing tissue damage per se.


  (E) At the same time, I maintain that in any intact predictive system, accurate
  nociceptive discrimination and minimal error-evaluation are functionally coupled:
  the model needs the error signal to calibrate predictions, so you cannot stably
  preserve full sensory discrimination while permanently eliminating all evaluation.


  (F) I reject both the "raw feel" view (that there is non-functional badness in the
  sensation itself) and the judgment-added view (that pain is neutral sensation plus
  a separate emotional belief).


