  and prevents a failure; fail-safe B was inoperative but was restored to working
  order by an automated maintenance process that had no causal connection to A''s
  activation, with both now functional at the moment of crisis. Did A''s activation
  cause the system to remain safe? Discuss whether this is a case of preemption, overdetermination,
  or redundant causation, and explain what verdict each theory delivers."


  Student answer:

  "The counterfactual-dependence view, as Lewis presented it, says that A causes B
  only if B counterfactually depends on A—had A not occurred, B would not have occurred.
  To solve preemption problems, Lewis added that we must check for quasi-dependence
  in nearby possible worlds and that temporal priority breaks ties. The interventionist
  view, by contrast, abandons counterfactuals for structural equation models: A causes
  B if B is invariant across interventions that change A, holding other direct causes
  fixed.


  In the safety-system case, we have redundant causation, not preemption, because
  both A and B are present and sufficient. Applying the counterfactual test: if A
  had not activated, B was already restored, so the system would still be safe. Therefore
  B breaks the counterfactual dependence of safety on A, and Lewis''s theory must
  deny that A caused the safety—though this seems counterintuitive. Lewis might reply
  by appealing to temporal priority, since A activated first, but that does not restore
  counterfactual dependence.


  The interventionist analysis models Safety as a function of A and B. Because B is
  present and functional, an intervention that sets A to inactive still yields Safety
  = true via B. Hence there is no invariant change in Safety under interventions on
  A, so the interventionist theory also denies A is a cause. This shows both theories
  converge: A is not a cause because B''s presence blocks the dependence relation,
  whether modal or structural.


  One might object that interventionist theories require physical manipulability,
  so they cannot apply to abstract or physically fixed variables; but here A and B
  are mechanically manipulable, so the objection does not arise."


