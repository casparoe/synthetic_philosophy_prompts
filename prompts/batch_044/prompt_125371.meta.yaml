  versus cosmopolitanism was obscuring more than it revealed. I am writing a proposal
  for a four-month independent research project (to be completed as a 35- to 40-page
  essay, suitable as a writing sample for doctoral applications) that asks the following
  precise question: can the moral claim that compatriots have special obligations
  be decomposed into two conceptually distinct sources—what I will call diachronic
  reciprocity, arising from multi-generational institutional cooperation and inherited
  burdens and benefits, and synchronic solidarity, arising from present shared vulnerability
  and collective risk—and does this decomposition allow a limited defense of compatriot
  priority that survives cosmopolitan objections, or does it collapse once the two
  are shown to be inseparable or normatively equivalent?


  The existing literature, as I understand it, treats partiality toward compatriots
  as a single phenomenon to be either justified or debunked: nationalists invoke shared
  culture, history, or political community, while cosmopolitans argue that birth within
  borders is morally arbitrary and that distributive obligations should be global.
  But because neither side systematically separates backward-looking reciprocity for
  past institutional contribution from forward-looking solidarity for present shared
  fate, cosmopolitan critiques that target the arbitrariness of borders do not clearly
  address whether obligations can arise from voluntary or semi-voluntary participation
  in intergenerational schemes, and nationalist defenses that invoke cultural identity
  do not clearly establish that reciprocity generates distributive priorities distinct
  from universal humanitarian concern. The result is that the core dispute remains
  open: it is unclear whether there is a genuinely distinct normative basis for compatriot
  claims, or whether all apparent particularism reduces either to unjustified favoritism
  or to universal obligations applied locally.


  My approach will be conceptual reconstruction rather than empirical study or historical
  exegesis. In the first phase, I will formalize the distinction between diachronic
  reciprocity and synchronic solidarity, drawing on general resources in social contract
  theory and intergenerational justice without depending on specific canonical texts
  or bibliographic surveys, and I will specify the conditions under which each could
  generate distributive obligations. In the second phase, I will test whether the
  diachronic claim can survive three standard cosmopolitan objections—moral arbitrariness
  of birth, the problem of non-voluntary membership in inherited institutions, and
  the charge that inherited advantage is itself unjust—while remaining genuinely distinct
  from universal solidarity. In the third phase, I will examine whether synchronic
  solidarity, once universalized, necessarily collapses into cosmopolitanism or can
  remain locally bounded without contradiction. A successful result would be either
  a rigorous framework that isolates a defensible, limited form of compatriot priority
  grounded solely in reciprocity, or a demonstration that the distinction is unstable
  and that all particularist obligations reduce to either solidarity or arbitrariness.
