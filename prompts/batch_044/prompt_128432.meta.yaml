  fact that I can imagine water lacking H2O-structure, or a zombie lacking consciousness,
  establishes nothing about metaphysical possibility.

  (4) Names that fail to refer—''Vulcan'' for the intra-Mercurial planet, ''Nessy''
  if there is no Loch Ness monster—are empty rigid designators. They lack an actual-world
  referent, but in worlds where they do refer they pick out the same object; they
  do not collapse into the descriptions used to introduce them.

