  traits (e.g., honesty, compassion) or as locally indexed moral expertise (e.g.,
  fairness-in-resource-allocation, compassion-in-stranger-distress).


  In Part I, present a numbered list of agreed claims (at least six) that both camps
  can sign without reservation. These should cover: (1) the inadequacy of traditional
  self-report personality inventories for capturing moral behavior; (2) the finding
  that situational variables (time pressure, social visibility, ambient odor) predict
  variance in behavior that global-trait scores do not fully absorb; (3) the distinction
  between predictive validity and explanatory relevance; (4) the possibility that
  behavior is driven by "local traits" or domain-specific skills rather than global
  character; (5) the normative irrelevance of purely descriptive psychology to virtue
  ethics unless mediated by an account of moral development; and (6) a shared commitment
  to a specific empirical protocol—ambulatory experience-sampling of moral micro-decisions
  across three domains (resource fairness, stranger compassion, promise-keeping) paired
  with peer-nomination ratings and behavioral coding—to settle the empirical dispute.


  In Part II, present a disagreements table with the following columns: Crux; Formulation
  accepted by virtue-ethics defenders; Formulation accepted by situationists; Agreed
  case or argument that bears on the crux; Predicted outcome by virtue-ethics defenders;
  Predicted outcome by situationists.


  The table must include at least four cruxes:

  A. Whether peer-nomination consistency across the three domains correlates more
  strongly with a single latent "moral character" factor or with three independent
  domain-specific factors.

  B. Whether training in one moral domain (e.g., compassion exercises) transfers to
  improved behavior in an untrained domain (e.g., fairness) or remains locally confined.

  C. Whether individuals identified as "moral experts" by peers show lower situational
  variability in behavior compared to matched controls, or whether their consistency
  is itself an artifact of selecting predictable environments.

  D. Whether normative virtue ethics must presuppose global traits to ground practices
  of moral education and blame, or whether a "local-virtue" framework can preserve
