  "I''m preparing a session for my graduate seminar on democratic deliberation, and
  I''ve become absorbed in the advisory rulings issued by the chair of our university''s
  public-reason working group—let''s call her the chair—on the admissibility of religious
  arguments in formal legislative testimony. Over the past year she has delivered
  four consistent judgments: (i) a representative who defended a gambling prohibition
  solely by citing the Quranic prohibition of maysir, with no secular analog, was
  ruled inadmissible; (ii) when the same representative later defended an identically
  scoped prohibition but paired the citation with an independent public-health analysis
  of addiction that was sufficient on its own, the testimony was ruled admissible,
  with a note that the religious framing was redundant but not disqualifying; (iii)
  a council member who sought a zoning exemption for religious schools by invoking
  ecclesiastical authority and then adding a constitutional free-exercise claim, but
  explicitly dismissed that secular claim as ''merely strategic,'' was ruled inadmissible
  because the secular reason was decorative rather than genuinely justificatory; and
  (iv) a purely secular epidemiological argument for mandatory vaccination was admitted
  without controversy. These rulings strike me as jointly compatible with at least
  three implicit rules: a strict full-substitution rule (religious reasons are permissible
  only when fully replaced by secular reasons of identical scope and force); a directional-convergence
  rule (religious reasons are permissible if accompanied by secular reasons that have
  independent weight and point in the same direction, even if they do not replicate
  the full normative scope); and a Habermasian translation-proviso rule (religious
  citizens may present approximate secular translations of their commitments, with
  imperfect rendering expected, provided they do not demand acceptance of the theological
