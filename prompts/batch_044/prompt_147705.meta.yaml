  distinction between indexical traces (functional wear and deposition patterns),
  symbolic encoding (manufactured form meant to represent), and institutional regularities
  (cross-object constraints that imply enforced norms)—to determine whether a given
  collection of artifacts justifies attributing a specific belief or institutional
  practice to the people who made them. The procedure must be runnable without ethnographic
  analogies or written sources: list the ordered checks (e.g., consistency of wear
  vs. form, anomaly detection against utilitarian baseline, cross-item standardization),
