  of deviation at each step is exactly zero. In any realistic epistemic setting, there
  is always some non-zero credence that an opponent reasons differently or makes an
  error. Once you allow even an epsilon of uncertainty, the induction collapses, and
  continuing becomes rational. Jordan conceded that with uncertainty the calculation
  changes, but insisted that this resolves the paradox only descriptively, not normatively:
  if we are asking what perfectly rational agents should do, epsilon is zero by definition.
  Sam closed by arguing that this makes backward induction a reductio of perfect strategic
  transparency rather than a guide to rational action, since the conditions that make
  epsilon zero also make the game impossible to play through.


