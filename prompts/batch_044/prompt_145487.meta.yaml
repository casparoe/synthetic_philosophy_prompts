  immediately. Sam agreed the logic was valid but challenged its applicability, arguing
  that backward induction presupposes a principle of strategic transparency—the idea
  that one''s rationality at any future node is fully common knowledge and causally
  independent of present choices—which is self-undermining in a finite sequential
  game: if transparency holds all the way back, the game never reaches the nodes where
  the reasoning applies, just as in the surprise examination paradox where common
  knowledge of the exam''s surprise conditions eliminates the conditions for surprise.


  Jordan replied that weakening the transparency premise merely changes the subject.
  The paradox asks what rationality requires given the game''s structure, not what
  people will actually do when transparency fails. Even if transparency is an idealization,
  the normative point stands: if you reach node k knowing the other player is rational,
  you should take, and this should be anticipated at every prior node. Sam countered
  that this confuses local rationality evaluated node-by-node with global strategic
  coherence. At node 1, continuing is globally optimal; the induction forces you to
  evaluate each step in isolation, but rationality should permit carrying out a globally
  superior plan unless there is a genuine local reason to deviate. Jordan responded
  that "global coherence" is just a label for ignoring the sequential nature of the
  choice: at each node you face a fresh decision, and there is no external authority
  enforcing a long-term plan against your present interests. The only reason to continue
  is the expectation of future cooperation, but backward induction shows that expectation
  is irrational.


