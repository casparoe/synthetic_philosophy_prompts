  I serve on the methodology review panel for an interdisciplinary cognitive-science
  funding body, and we have begun receiving proposals that include what applicants
  call "phenomenal consciousness assays" — structured protocols that ask human subjects
  or artificial systems to report the contents of awareness, then treat those reports
