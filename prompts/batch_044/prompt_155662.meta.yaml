  implicitly presuppose what Dennett criticized as the Cartesian theater: a central
  locus where experience becomes present to a single observer. Others claim to be
  neutral but still build in assumptions — for example, that there is a canonical
  ordering of events in consciousness, or that a subject''s verbal report can be corrected
  against an internal "original" experience. I want a reusable decision procedure
  that my panel can apply to evaluate whether a given assay protocol is conceptually
  compatible with Dennett''s multiple-drafts model of consciousness, without requiring
  every reviewer to be a philosopher of mind.


  The procedure should be organized as an ordered checklist of questions a reviewer
  asks about the proposal, with what counts as a sufficient answer at each stage,
  and explicit stop points where the protocol either clears the bar, fails, or requires
  human judgment because the issue is one of values rather than conceptual consistency.
  In particular, it should address: (1) how the protocol handles temporal sequencing
  of reported contents, since the multiple-drafts model denies a single "time line"
  of consciousness; (2) whether the protocol allows for competing, unreconciled drafts
  of the same stimulus rather than forcing a unified narrative; (3) how it treats
  post-hoc confabulation versus "direct access"; and (4) what to do when an applicant
  claims their assay is merely behavioral and makes no metaphysical commitments.


  Please ground the procedure in the actual distinctions Dennett draws between the
  Cartesian theater and the multiple-drafts framework — distributed, parallel processing
  with no central observer, and the idea that there is no fact of the matter about
  which draft is "the real experience" until a particular narrative is fixed by later
  mechanisms — but translate these into operational criteria that a reviewer with
  no philosophy background can apply. Include a small set of test cases the reviewer
  can run on sample protocol descriptions, with worked examples showing both a pass
