  having been properly executed, and we have no shared framework for deciding when
  a binding mechanism genuinely preserves autonomy rather than substituting the institution''s
  judgment for the patient''s. I need a reusable decision procedure—something like
  an ordered checklist with explicit stop conditions and judgment-call flags—that
