  concept of computation, yet in physical science we distinguish sharply between analog
  computation (solving differential equations via continuous variables) and digital
  computation (manipulating discrete symbols via algorithmic rules). The brain exhibits
  continuous, noisy, parallel dynamics without evident error-correcting symbol codes.
  The project asks: if we restrict "computation" to its formal, algorithmic sense,
  does computationalism become false because brains lack discrete state transitions?
