  After a long and somewhat exhausting argument with a friend about whether Kant''s
  essay on perpetual peace offers a genuine institutional blueprint or merely a regulative
  fiction that masks the permanence of state conflict, I want to map exactly where
  our disagreement lives — not in terms of which scholars we cite, but in terms of
