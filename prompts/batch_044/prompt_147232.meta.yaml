  the very medium in which moral responsibility lives, and that the "objective attitude"
  is not a moral improvement but a change in relational stance. Don''t explain the
  theory to me; plan how I should teach it. First, set out the dependency order: which
  conceptual piece must be in place before I can introduce reactive attitudes, which
  must come before the objective attitude makes sense, and what has to come after
  so they don''t collapse the two into "being emotional versus being rational." Second,
  choose the one carrying example: I want to build it around a hiring algorithm that
  rejects a qualified candidate because of an opaque, unreviewable weighting error,
  and ask whether we can resent the system, its designers, or neither. Explain exactly
  what this scenario must have (opacity, human oversight failure, harm) and what it
  must lack (a single identifiable wrongdoer) to make Strawson''s distinction do work,
  and say why a classic interpersonal betrayal—say, a friend breaking a promise—would
  fail as the central case for this particular audience. Third, map the misconceptions:
  they will treat reactive attitudes as switchable emotional states, think the objective
  attitude is just "cool-headed analysis," believe that if determinism is true we
  must adopt the objective attitude toward everyone, and conflate Strawson''s view
  with a form of compatibilism that saves responsibility by redefining freedom. For
  each, say where in the sequence it will arise and exactly how to head it off without
