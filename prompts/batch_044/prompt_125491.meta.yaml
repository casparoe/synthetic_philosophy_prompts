  an earlier card in the circle (they avoid arbitrariness but trigger a circularity
  fee), and "trail" cards whose reverse side points to an empty chair or off the table
  (they avoid both penalties but require the student to keep passing the token backward
  indefinitely, accumulating fatigue points). Students do not know these types exist;
  they are told only to defend their belief with linked cards, and that each unbacked
  link costs them one "credibility token" from a shared pool of 20. The pool depletes
  visibly.


