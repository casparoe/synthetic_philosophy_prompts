  "I have recently become preoccupied with the distinction between historical contingency
  and structural inevitability, prompted by the discovery that my grandparents'' marriage
  — and consequently my own existence — turned on a misdelivered letter in 1952. If
  that letter had reached its intended recipient, my family line simply would not
  have formed; there is no redundant path by which I might still have come to be.
  This singular bottleneck has led me to examine whether large-scale historical outcomes
  exhibit the same openness, or whether they are multiply realisable.


  Below are my verdicts on several counterfactual scenarios. I am not asking for a
  narrative of what would have happened, but for the principle — if one exists — that
  unifies these judgments, together with its predictions for a case I have not listed.


  1. Had Archduke Franz Ferdinand''s driver not taken the wrong turn in Sarajevo,
  the alliance structures and Balkan tensions of 1914 were such that a general European
  war would likely have broken out by 1916 via some other crisis; the specific trigger
  was contingent, but the macro-conflict was structurally overdetermined.


  2. Had James Watt never refined the steam engine, coal-powered mechanisation would
  still have emerged within two decades through iterative improvements to existing
  atmospheric engines; the technological core of the Industrial Revolution was redundant
  across inventors.


  3. Had Charles Darwin never sailed on the Beagle, Alfred Russel Wallace''s 1858
  essay on natural selection would have compelled the same theoretical synthesis within
  months; evolutionary biology was epistemically inevitable given the accumulated
  data.


  4. Had the Library of Alexandria survived intact into the medieval period, the institutional
  conditions for modern empirical science might have consolidated centuries earlier
  with a markedly different geography of knowledge; its destruction removed a singular
  reservoir that other libraries could not functionally replace.


  5. Had the American colonies lost the Revolutionary War, republican government as
  a global model would have been delayed but eventually realised — most plausibly
  through the French revolutionary trajectory — because the socio-economic conditions
  for representative institutions were spreading independently across the Atlantic
  world.


  6. Had the French Revolution never occurred — say, through successful constitutional
  reform by Louis XVI — I am inclined to think that modern secular republicanism would
  not have developed in its actual form; European monarchy might have adapted gradually
  without producing the specific ideological rupture that reshaped political modernity.


  There is an evident tension between (5) and (6): in both cases I invoke socio-economic
  conditions, yet I treat American failure as replaceable and French absence as irreplaceable.
  My tentative principle is that an outcome is historically inevitable if and only
  if it is reachable via at least two causally independent pathways within a generational
  span, and contingent if it depends on a singular causal bottleneck lacking functional
  equivalents. This seems to cover (1)–(4), but I am unsure whether it genuinely resolves
  the conflict between (5) and (6) without ad hoc adjustments, or whether it forces
  me to abandon one of them.


  Please provide your assessment in British English. Specifically:


  - State the principle, or small family of principles, that best captures the pattern
  in (1)–(6), precisely enough that its clauses can be traced back to the cases that
  motivate them.

  - Apply it to the unlisted case: had Werner Heisenberg never entered physics, would
