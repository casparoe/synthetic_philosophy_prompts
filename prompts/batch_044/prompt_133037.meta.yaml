  or false belief: an influence is manipulative when it engineers an asymmetry in
  cognitive load, such that the influenced party bears the burden of detecting and
  correcting the influence while the influencer designs the interaction to make that
  detection or correction costly.


  (2) I think legitimate persuasion must preserve what I''d call cognitive-load parity—both
  parties must be able to deploy reasoning resources under conditions that are not
  structurally disadvantaged by the influencer''s design choices.


  (3) I think dark patterns in software—pre-checked consent boxes, hidden unsubscribe
  flows, forced continuity—are clear cases of manipulation under (1), because they
  exploit automatic processing and make opting out or correcting the default more
  cognitively expensive than accepting it.


  (4) I think a recommendation system that reorders products based on a hidden predictive
  model is not manipulative, even though the user is unaware of the ordering logic,
  because each option is presented with equal salience and the user can evaluate them
  with the same cognitive effort regardless of rank.


  (5) I think emotional appeals in rhetoric—say, fear-based framing in a public-health
  campaign—are legitimate persuasion, not manipulation, because they supply premises
  rather than altering the structural conditions under which the audience reasons;
  they don''t change the cost of deliberation itself.


  (6) I think retrospective endorsement matters morally: if a user genuinely endorses
  a choice made through a dark pattern after learning how the pattern worked—e.g.,
  "I''m glad I kept the subscription"—that endorsement doesn''t erase the wrong but
