  subjective indistinguishability but insisted it does not entail shared mental ontology.
  The causal-functional profile of genuine perception, he said, involves direct environmental
  relation and appropriate counterfactual dependencies, whereas hallucination lacks
  these entirely. This is not representationalism, he emphasized, because representationalism
  individuates mental states by their content or functional role within the subject;
  disjunctivism makes an ontological claim about the kind of event that occurs.


  Vasquez countered that if the internal phenomenal profile is identical and only
  external relations differ, then Chen has conceded the argument''s central premise:
  there is a common internal state. The disjunctive distinction, she said, then applies
  only to an external relation, not to the mental event itself, which collapses disjunctivism
  into either representationalism or a sense-datum theory with redundant metaphysical
