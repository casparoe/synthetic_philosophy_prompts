  avoidance outputs, and interacting with belief and desire states.


  This essay argues that this defense collapses once we recognize what I call asymmetric
  normative realization. If pain is genuinely multiply realizable, then two systems
  can share the identical functional architecture yet differ radically in normative
  status. Consider a biological human and a precisely isomorphic silicon android,
  both instantiating the pain-role. The biological system plausibly generates direct
  moral obligations and possesses phenomenological presence; the silicon system, despite
  functional equivalence, might lack both. But functionalism identifies mental states
  solely by functional profile, so it must attribute pain equally to both or deny
  it to both. Either option is costly: the first seems to erase morally relevant differences
  in substrate-sensitive properties; the second abandons the intuition that realization-independent
  functional identity is sufficient for mentality.


  The problem is not merely epistemic—how we know which system feels pain—but metaphysical.
  Multiple realizability was introduced to show that mental taxonomy is autonomous
  from physical taxonomy. Yet if autonomy permits normatively divergent realizers,
  then functionalism severs mental ascription from the very properties—moral considerability,
  phenomenological authority—that motivate mental-state attribution in the first place.
  Thus, rather than supporting functionalism, multiple realizability exposes a realization
  gap: functional identity does not guarantee mental uniformity when normative properties
  are realization-sensitive.


