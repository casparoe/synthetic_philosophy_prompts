  Title/Idea: Multiple Realizability and the Problem of Asymmetric Normative Realization


  Functionalism holds that mental states are defined by their causal-functional roles
  rather than their physical substrate. A standard defense appeals to multiple realizability:
  pain might be realized in carbon-based neurons, silicon circuits, or alien biochemistry,
