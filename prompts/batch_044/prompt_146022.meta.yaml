  Here''s an argument I sketched for my metaphysics seminar and now find suspicious
  because it seems to eliminate all plural fundamental bases. (1) If A grounds B,
  then A is strictly more fundamental than B. (2) Grounding is irreflexive and well-founded:
  there are no infinite descending chains. (3) Suppose there are at least two distinct
  fundamental entities, F1 and F2. (4) Then there is a fact of distinctness, D: F1
  ≠ F2. (5) D is not identical to either F1 or F2, so if fundamental entities are
  only "basic building blocks" (not relations), D is not fundamental. (6) So D is
  grounded in F1 and F2 together. (7) Now consider the grounding fact G: D is grounded
  in {F1, F2}. (8) G involves the grounding relation itself applied to F1, F2, and
  D. (9) If the grounding relation R is fundamental, then G includes a fundamental
  component (R), but also involves D, which is grounded — so G is partly fundamental,
  partly not, which is incoherent if fundamentality is all-or-nothing. (10) Therefore
  R is not fundamental; R itself is grounded in something else, call it R1. (11) By
  the same reasoning, the fact that R is grounded in R1 requires R2, and so on, yielding
  an infinite ascending chain R, R1, R2, ... (12) Well-foundedness prohibits this.
  (13) So our assumption in (3) is false: there are not two distinct fundamental entities.
  By parity of reasoning, there cannot be exactly one either, since self-identity
  generates the same regress. (14) Therefore there are no fundamental entities at
  all. Where does this go wrong? I''d particularly like to preserve (1) and (2) if
  possible, and I also want to keep the idea that there can be plural fundamental
  entities, but I''m willing to sacrifice (9) if that''s the weak link. Also, please
  say what would change your mind: which specific premise, if shown false, would make
