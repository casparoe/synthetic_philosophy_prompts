  entities with predetermined life-cycles—spring, summer, autumn, winter—arguing that
  morphological parallels between civilizations reveal a universal biological logic,
  not causal interaction. Toynbee, by contrast, proposes a linear-progressive framework
  of challenge and response: civilizations grow when creative minorities successfully
