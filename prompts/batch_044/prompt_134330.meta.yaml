  Consider the following exam question and a student''s response to it.


  Question: Douglas Hofstadter argues that the self is not a specific material object
  but a high-level pattern—what he calls a strange loop—capable in principle of being
  instantiated in more than one substrate. He also suggests that after death, fragments
  of one''s self-pattern might persist in the memories and behaviors of people who
  knew one well. Now consider a hypothetical case not discussed in the standard literature:
  two living brains are linked by a continuous, bidirectional neuroprosthetic interface
  that merges their working-memory updates in real time, so that each brain''s self-model
  routinely incorporates the other''s episodic markers and decision traces. Within
  Hofstadter''s framework, does this constitute one ''I'' distributed across two brains,
  or two distinct selves that are merely tightly coupled? In your answer, distinguish
  (a) substrate-independent pattern persistence from simultaneous co-instantiation,
  (b) Hofstadter''s anti-substrate view from eliminativism about the self, and (c)
  the conditions under which a pattern counts as the same token self rather than a
  similar copy.


  Student answer:

  Hofstadter''s central claim is that the self is a pattern, not a soul or a particular
  brain. Because patterns are substrate-independent, the same ''I'' could in principle
  run on different hardware, just like software on different computers. In the neuroprosthetic
  case, since both brains are running interlinked versions of the same self-pattern,
  there is literally one distributed self rather than two. This is consistent with
  Hofstadter''s idea that an ''I'' can survive in others after death—if my friends
  carry my patterns, part of me lives on in them. Hofstadter calls this a ''center
  of narrative gravity,'' a concept he uses to reject Cartesian dualism while keeping
  the self real as an emergent structure. The only mistake people make is thinking
  that because the pattern needs a brain, it is tied to one brain; but Hofstadter
  shows that the loop can span multiple substrates as long as the causal and informational
  structure is preserved. So in the linked-brain case, we should say there is one
  ''I'' distributed across both skulls, not two people with shared memories.


