  professional protocol, or a social norm of honesty) and overriding that rule on
  the basis of an all-things-considered moral judgment that produces a better outcome,
  the American architecture — which treats conscience as sovereign — produces a systematically
  higher level of what I will call "procedural moral residue": that is, a non-psychological,
  genuinely normative tension that remains unresolved because the violated rule continues
  to exert a claim that is not canceled by the outcome''s superiority. By contrast,
  the German architecture treats such residue as a sign that the agent has miscounted
  authority, not that she has made a tragic choice. The claim I want evaluated is
  that this difference gives the German architecture the normative better of the argument,
  provided we weight coherence, long-run institutional trust, and the avoidance of
  arbitrary authority equally.


