  post-hoc rationalization or emotional discomfort. State your sub-credence.

  2. "Comparative architecture" (approx. 250 words): The probability that the American
  architecture indeed generates more of this residue, relative to the German architecture,
  in structurally similar cases. State your sub-credence.

  3. "Weighting of values" (approx. 200 words): The probability that coherence, institutional
  trust, and non-arbitrariness, taken together, should outweigh the autonomy and outcome-flexibility
  that the American architecture prioritizes. State your sub-credence.

  4. "Synthesis" (approx. 150 words): Combine the terms into your final credence.
