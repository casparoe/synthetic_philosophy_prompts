  I''m preparing a short methodological position paper for a seminar on archives and
  historical epistemology, and I want to check whether my commitments form a coherent
  package before I present them. Here is where I have landed:


  (1) I hold that archives are not neutral repositories but active instruments of
  governance: decisions about preservation, cataloging, and destruction are exercises
  of power, and the resulting record is therefore systematically distorted in favor
  of dominant groups.


  (2) From this I draw an ethical commitment: the historian''s primary obligation
  is to the silences—to those whose lives were never documented—rather than to the
  explicit contents of the archive.


  (3) I therefore believe that historians should attempt to reconstruct subaltern
  agency from negative spaces in the record, using speculative and counterfactual
  methods when direct testimony is absent.


  (4) At the same time, I think any reconstruction of subaltern voice from silence
  is necessarily anachronistic: it imposes present conceptual categories onto subjects
  who did not inhabit them, and in that sense it repeats a form of conceptual violence.


  (5) Consequently, I also maintain that the correct methodological stance is not
  to fill the silence but to map its architecture—to describe precisely how the absence
  was produced, by which institutional mechanisms, and with what effects—without inventing
  voices.


  (6) Yet I think that if we restrict ourselves to mapping absence without any attempt
