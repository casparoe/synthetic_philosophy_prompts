  - Lewis''s account of convention (common knowledge, coordination problems, arbitrary
  solutions).

  - Evolutionary/game-theoretic explanation of norms (evolutionary stable strategies).

  - The idea that linguistic meaning is conventional in Lewis''s sense.

  - The idea that moral norms are conventions that evolved for coordination.

  - But also that some moral norms are not arbitrary (e.g., against murder) and therefore
  not conventional in Lewis''s sense because there''s no arbitrary alternative.

  - Plus maybe a commitment to evolutionary debunking? No, stay within domain.


  We need one or two genuine tensions. Let''s design:


  Commitments:

  (a) I buy Lewis''s analysis: conventions are arbitrary solutions to coordination
  problems sustained by common knowledge and preference for conformity.

  (b) I think evolutionary dynamics (replicator dynamics, ESS) can fully explain why
  particular norms stabilize without anyone reasoning about coordination.

  (c) I think moral norms like "don''t kill" are conventions in exactly Lewis''s sense.

  (d) I think linguistic conventions (like word meanings) are not arbitrary in the
  relevant way because there are strong functional pressures that make alternatives
  non-viable.

  (e) I think if a norm is explained by evolutionary dynamics alone, then it''s not
  a convention because there''s no element of rational choice or common knowledge
  of rationality.


  Tensions:

  - (a) and (b): Lewis requires rational agents with common knowledge; evolutionary
  explanation doesn''t require rationality. So can both fully explain norms? Maybe
  tension.

  - (c) and (d): If "don''t kill" is conventional (arbitrary), but linguistic meanings
  aren''t arbitrary, that might be inconsistent if both are norms. Or maybe not.

  - (b) and (e): If evolutionary dynamics alone explain it, then by (e) it''s not
  a convention. But (a) says conventions are sustained by common knowledge. So if
  evolutionary dynamics explain it, does that rule out convention status?


