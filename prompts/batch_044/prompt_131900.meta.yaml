  feedback loops already approximate. The philosopher countered that without shared
  deliberative spaces, feedback loops become fragmented into algorithmically sorted
  echo chambers, so the "experiment" lacks the communal observation Dewey required.
  The historian responded that Dewey was a modernist who embraced scientific management
  and that demanding face-to-face communal inquiry romanticizes his view; technological
  mediation can serve distributed cognition if the institutional design permits revision.
  The philosopher then claimed that once you permit technocratic management of inquiry,
  you''ve conceded that democracy is instrumental rather than intrinsic to the experimental
