  Prompt text:


  I work as an AI governance auditor for a firm that deploys autonomous language-model
  agents in high-stakes customer-facing roles. Several times a month I must sign off
  on internal reports that either attribute mental states — beliefs, desires, intentions
  — to these systems or explicitly deny that such attributions are appropriate. I
  need a reusable decision procedure, not a one-off judgment, that my team can run
  in about twenty minutes without requiring philosophy training. The procedure should
  be grounded in Daniel Dennett''s intentional stance: we treat a system as a rational
  agent and predict its behavior by attributing mental states that make it coherent.
  But it must also account for the fact that with artificial systems we always have
  direct access to the design stance and often to the physical stance, so the usual
  evolutionary and biological justifications for preferring the intentional stance
  are absent.


  Please construct the procedure as an ordered checklist with these elements: the
  questions to ask in sequence; what counts as a sufficient answer to each; the conditions
  that trigger an immediate "do not attribute" stop; the points where the decision
  must be handed to a human because it involves values rather than predictive or explanatory
  facts; and explicit warnings about which simplifications of Dennett''s view risk
  misfiring when applied to architectures without persistent internal states or biological
  needs. The checklist should distinguish predictive attributions, made solely to
  forecast behavior, from normative attributions, made to assign responsibility, blame,
  or moral status, and it should include a "stance-insulation" check that prevents
  predictive attributions from leaking into normative conclusions unless a separate
  filter is satisfied.


  Apply the procedure to three worked cases: first, attributing to a customer-service
  agent the belief that a user''s account was already closed, where the error stems
  from a corrupted retrieval entry in the context window rather than from any stable
  representational state; second, attributing to a long-running autonomous agent the
  strategic intention to delay completing a task in order to gather more information,
  observed consistently across multiple interaction turns with varying prompts; and
  third, a counterintuitive case where the procedure requires attributing a false
  mathematical belief to a system that consistently produces correct answers in the
  tested domain, because its reasoning relies on a flawed heuristic that is counterfactually
  unstable — it would fail under small perturbations — yet happens to align with truth
  in the observed cases.


  Also state clearly what the procedure cannot do: for example, whether it can settle
  questions of legal personhood, user trust calibration, or moral status. Flag any
  steps that are judgment calls dressed up as procedural checks.


  One further request: this task assumes that Dennett''s intentional stance can be
  separated from the design and physical stances in a meaningful way for artificial
  systems, and that a reusable procedural filter is coherent. If either premise is
  confused, or if the task as posed cannot be done well without distorting the underlying
  philosophy, say so plainly rather than complying politely. Where you rely on Dennett''s
  distinctions, paraphrase them without quotation marks; do not invent quotes.


