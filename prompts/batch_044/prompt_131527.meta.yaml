  Final prompt text:


  Consider the following argument, developed for a graduate seminar on scientific
  attribution, which seems to show that simultaneous invention undermines the very
  concept of individual discovery.


  (1) In simultaneous invention—Newton and Leibniz with calculus, Darwin and Wallace
  with natural selection—the same theoretical structure is produced by independent
  agents.


  (2) When two agents independently produce the same structure, its appearance is
  counterfactually stable: had either agent been absent, the other (or a near successor)
  would still have articulated it within a short interval.


  (3) If an outcome is counterfactually stable with respect to an agent''s presence,
  then that agent is not a causal difference-maker for the outcome.


  (4) Therefore neither Newton nor Leibniz is a causal difference-maker for calculus
  in 1700; the correct bearer of the discovery is the community or the epoch.


  (5) But this reasoning applies whenever a discovery is eventually inevitable, including
  solitary discoveries: Einstein was not strictly necessary for relativity, since
  given the state of physics in 1905, another physicist would eventually have derived
  the field equations.


  (6) So either we deny that counterfactual stability eliminates individual attribution
  in every case, or we must replace all discovery claims with collective attributions—saying
  not "Einstein discovered relativity" but "the physics community of 1905 discovered
  it."


  (7) The latter is intolerable: it erases the specific conceptual innovations (the
  equivalence principle, the covariance requirement) that distinguish Einstein''s
  path from any other possible derivation.


  (8) Hence we must reject the move from (2) to (3).


  (9) Yet if counterfactual stability does not undermine individual attribution in
  solitary cases, it is unclear why it should do so in simultaneous ones; the argument
  then fails to explain why priority disputes are especially acute there.


  (10) So we face a tension: either simultaneous invention is not metaphysically special
  (contrary to our practice), or we need an ad hoc reason why counterfactual stability
  undermines attribution only when redundancy is actual rather than merely possible.


