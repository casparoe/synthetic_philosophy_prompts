  Here is the chain as I wrote it down. (1) If the knob-twiddling model is correct,
  then every creative act is exhaustively describable as parameter adjustment within
  a fixed conceptual frame, where the frame defines both the invariant theme and the
  set of available knobs. (2) A genuinely revolutionary creative achievement—say,
  the shift from tonal harmony to twelve-tone serialism, or the reconceptualization
  of geometric space that made non-Euclidean mathematics possible—appears to involve
  not just turning existing knobs but reconceiving which dimensions are variable at
  all; call this a meta-variation. (3) By the model''s own lights, if a meta-variation
  changes the invariant theme, then it is not parameter adjustment within the frame
