  "The essay ''Two Dogmas of Empiricism'' attacks two central empiricist commitments.
  The first dogma is the analytic-synthetic distinction, which Quine treats as an
  ungrounded metaphysical assumption rather than an empirically verifiable boundary.
  Quine argues that attempts to define analyticity via synonymy, definition, or semantic
  rules all presuppose the very distinction they seek to explain. The second dogma
  is reductionism: the belief that every meaningful statement can be translated into
  terms of immediate experience. Quine replaces both with a holistic picture in which
  scientific statements form a web of belief, facing experience collectively rather
  than individually.


  Against this, the student considers a defence that separates framework-analytic
  statements—those true by explicit stipulation within a formal calculus, such as
  logical axioms—from content-analytic statements, which depend on the meanings of
  non-logical vocabulary. The defender claims Quine''s arguments only undermine content-analyticity,
  leaving framework-analyticity intact as a matter of conventional decision. From
  this, they argue that reductionism can be rehabilitated: if logical and mathematical
  truths are framework-analytic, they do not require empirical verification, and the
  remaining synthetic statements can still be mapped individually onto experiential
  evidence.


  This defence fails for two reasons. First, Quine explicitly allows that logical
  truths may be held true by convention, but he denies that this creates a sharp,
  principled boundary between analytic and synthetic statements across the whole language;
  framework-analyticity is therefore not a separate category that survives untouched,
  but merely one region in a continuum of revisability. Second, even if framework-analyticity
  is granted, it does not rescue reductionism. Reductionism concerns the empirical
  content of individual synthetic statements, and Quine''s holism shows that such
  statements do not have isolable experiential equivalents regardless of how logic
  is treated. The defender therefore commits a non-sequitur by assuming that preserving
  analyticity for formal truths restores individual empirical translation for the
  rest."


