  "cognitive-readiness assessment" administered at entry, and once placed, a student
  is administratively barred from enrolling in courses designated for a different
  mode. Simultaneously, the university''s quality-assurance framework requires every
  course — whether designated discovery, discipline, or synthesis — to be evaluated
  against an identical matrix of "transferable graduate attributes," atomised competencies
  that are meant to accumulate linearly and be measured with the same rubrics regardless
  of mode.


  The administration claims both policies serve a single coherent vision: education
  as a rhythmic, stage-sensitive journey that nevertheless produces uniform, portable
  skills. I find this hard to square with the philosophical literature we have read,
  but I want to know whether my puzzlement is justified.


