  STUDENT ANSWER:

  The paradox of tragedy is that audiences actively seek artworks that produce sorrow,
  fear, and pity, even though in ordinary life we avoid these states. The deeper difficulty
  is not just voluntary exposure, but synchronous emotional stacking: we appear to
  hold both a negative evaluation of the represented events and a positive evaluation
  of the work itself at the same moment, without waiting for a diachronic integration
  in which the sorrow is gradually transformed into satisfaction over the course of
  the narrative. One prominent resolution is the control thesis, which claims that
  enjoyment is possible only when the spectator retains a sense of safety and cognitive
  mastery. Because we know the fiction is not real and can exit the theater, the negative
  affect is experienced inside a protected frame, allowing it to be enjoyed rather
  than suffered.


  This should be distinguished from the view traditionally associated with Hume, according
  to which the formal excellence of the representation—its eloquence and artistic
  structure—directly transforms the quality of the emotion itself, turning sorrow
  into pleasure through an almost alchemical mediation. Hume therefore addresses synchronous
  emotional stacking by changing the intrinsic quality of the first-order response,
  not by appealing to audience agency. By contrast, the control thesis explains stacking
  through the spectator''s cognitive position rather than through any transformation
  in the emotion''s content.


  The control thesis, however, fails when applied to immersive and participatory tragic
  forms, such as ritual theater or VR narratives, in which the audience''s separation
  from the events is deliberately weakened. In these contexts, viewers often experience
  intense negative affect alongside high aesthetic satisfaction, yet they clearly
  lack the sense of control or safety the thesis requires. This demonstrates that
  the control thesis is false as a general account of tragic enjoyment. We should
  therefore adopt a framework that distinguishes first-order affective responses—which
  in immersive cases are genuinely negative and directed at the fictional events—from
  second-order meta-representational appreciation, which is always positive and directed
  at the representational properties of the work rather than at the fiction itself.
  On this view, there is no genuine paradox, because the sadness we feel is never
  actually directed at the fiction; it is always already a representation of sadness
  that we contemplate with pleasure, and Hume''s conversion is best understood as
  describing this second-order process rather than any change in first-order feeling.


