  Revised answer text:


  The paradox of tragedy is that audiences seek out artworks—tragedies, films, novels—that
  reliably elicit sorrow, fear, or pity, even though in ordinary life we avoid these
  affective states. The deeper puzzle is not merely why we expose ourselves to them,
  but why they do not spoil our judgment that the work is good. This can be framed
  in terms of synchronous emotional stacking: at any given moment, we seem to hold
  both a negative response to the represented events and a positive evaluation of
  the artwork, without relying on diachronic emotional integration, in which the negative
  affect is gradually transformed into satisfaction only over the course of the narrative
  arc.


  One prominent resolution is the control thesis, which holds that aesthetic enjoyment
  of negative emotion depends on the audience''s retained sense of agency, safety,
  or cognitive mastery. Because spectators know the events are fictional and understand
  that they can leave the theater or close the book, the negative affect is experienced
  within a protected frame, allowing it to be enjoyed rather than suffered. This thesis
  addresses synchronous stacking by explaining how negative and positive evaluations
  can coexist at the same temporal slice: the negative affect is directed at the fiction,
  while the positive evaluation derives from the spectator''s awareness of their own
  protected position.


  This should be distinguished from the view traditionally associated with Hume, according
  to which the formal excellence and eloquence of the artistic representation directly
  convert the unpleasantness of sorrow into a pleasant aesthetic response. For Hume,
  the transformation occurs in the first-order emotion itself: the sorrow is genuinely
  felt, but its quality is altered—almost alchemically—by the skill of the artist,
  so that the spectator experiences pleasure in the very intensity of the feeling.
  Hume therefore resolves the paradox through a change in the intrinsic character
  of the affect, not through any appeal to psychological distance or audience control.


  Nevertheless, the control thesis cannot survive counterexamples drawn from immersive
  and participatory tragic forms, such as ritual theater or virtual-reality narratives,
  in which the usual buffers of aesthetic distance are deliberately attenuated. In
  these contexts, audiences frequently report intense negative affect coexisting with
  high aesthetic satisfaction, yet they clearly lack the sense of mastery or safety
  that the thesis demands. This proves that the control thesis is false as a general
  explanation, and that we must reject it entirely. Instead, we should adopt a strict
  separation between first-order affective responses, which are always genuinely negative
  and directed at the fictional events, and second-order meta-representational appreciation,
  which is always positive and directed at the work''s representational properties.
  On this framework, there is no real paradox of synchronous stacking, because the
  sadness we feel is never actually directed at the fiction; it is always already
  a representation of sadness that we contemplate with pleasure. Consequently, Hume''s
  conversion view is best interpreted not as a transformation of first-order feeling,
  but as an early description of this second-order meta-representational process.


