  agency," according to which an individual agent''s duty not to harm weakens proportionally
  to the number of co-agents available to share the burden of prevention, so that
  no single agent must violate her own integrity. Does this threshold preserve the
  agent-relative structure that Samuel Scheffler defends, or does it collapse deontological
  ethics into a form of rule-consequentialism? In your answer, explain Scheffler''s
  distinction between the two agent-centered reasons and address whether the threshold
  introduces a collective-optimization criterion that undermines the absolute character
  of restrictions.


  Student answer: The paradox of deontology occurs because deontological ethics includes
  both agent-centered restrictions, which forbid harming one innocent person even
  to save five others, and agent-centered prerogatives, which allow an agent to pursue
  her own projects rather than always maximizing overall welfare. Scheffler resolves
  this tension by deriving both restrictions and prerogatives from the agent-relative
  value of personal integrity: the restriction prevents us from violating our own
  moral boundaries, while the prerogative permits us not to sacrifice those boundaries
  for the greater good. The proposed threshold of collective agency resolves the paradox
  by distributing the burden of harm-prevention across multiple agents. When more
  co-agents are present, each individual''s restriction weakens proportionally, meaning
  no single agent must violate her integrity. This preserves Scheffler''s agent-relative
  framework because the duty remains indexed to what each particular agent must do,
  not to aggregate outcomes. Moreover, this approach aligns with Kant''s universal
  law formulation, since universalizing a maxim of shared burden produces no contradiction
