  about the consequences of her actions ought always to acquire it before deciding.
  I wish to apply this not to individual choice but to collective resource problems—specifically,
  to the tragedy of the commons. The standard account, following Hardin, treats overuse
  as the inevitable result of individually rational maximization in the absence of
  coercive institutions. I contend that this framing presupposes a static informational
  environment: each agent acts on private, unrevised beliefs about resource abundance
  and others'' behavior. But in most real commons scenarios—fisheries, atmospheric
  carbon, groundwater—there is typically abundant, low-cost evidence available about
  stock levels, extraction rates, and cooperative outcomes. By Good''s result, rational
  agents should gather this shared information before committing to extraction strategies.
  Consequently, the tragedy is not primarily a failure of institutional constraint
  but a failure of collective epistemic rationality: agents rush to defect informationally
  as well as behaviorally. If this is right, then many policy prescriptions (taxes,
  quotas, privatization) address the wrong failure mode.


