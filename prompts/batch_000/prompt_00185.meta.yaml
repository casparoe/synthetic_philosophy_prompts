  with the Self-Indication Assumption, or misapplying the reasoning to individual
  observers rather than reference classes, or thinking it licenses concrete predictions
  about imminent doom.


  Another strong candidate: someone might think the argument implies we can causally
  reduce extinction risk by having fewer children now, mistaking an anthropic belief-updating
  argument for a decision-theoretic lever we can pull. Similarly, CEV invites confusion
  when people flatten it into "just poll everyone''s current preferences" rather than
