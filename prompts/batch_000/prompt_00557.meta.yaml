  when really a trained policy just follows whatever behavior got reinforced -- so
  someone might wrongly think stopping reward after training eliminates any risk,
  missing that wireheading concerns stem from the agent''s internalized learned objective.


  A related version worth writing as a prompt: assuming wireheading is only a risk
  for online-learning systems that keep updating on their own reward, since a deployed
