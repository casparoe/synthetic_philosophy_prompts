  interests" is a known idea (Dworkin). But we can inject a more specific new idea:
  "the ''two selves'' problem is usually framed as a conflict between the earlier
  self''s autonomy and the later self''s welfare. I want you to argue for a position
  on a different question: whether the earlier self''s authority should be understood
  on the model of a ''trust'' rather than a ''contract.'' On the trust model, the
  earlier self is the settlor, the later self is the beneficiary, and the directive
  is the trust instrument. The trustee (the proxy) must interpret the directive in
  light of the beneficiary''s best interests, and the beneficiary''s current wishes
  are evidence of those interests but not dispositive. On the contract model, the
  earlier self and the later self are treated as two parties, and the earlier self''s
  directive is binding unless the later self revokes it with the requisite capacity.
  I want you to argue that the trust model is superior, and that it entails that a
  later self''s expressed preference to receive treatment can sometimes override the
  directive, but only when the preference reflects a stable and informed conception
  of the good rather than a momentary fear or confusion."


