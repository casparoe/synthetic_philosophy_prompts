  The paradox of deontology (sometimes attributed to Scheffler''s "The Rejection of
  Consequentialism", or the "paradox of deontology" discussed by e.g. Fried, or "the
  paradox of deontological constraints"): Deontological constraints prohibit doing
  harm even to prevent greater harm. But if the point of morality is to protect people
  from harm, why may I not harm one to save many? The constraint seems to permit more
  harm overall. Paradox: constraints seem to be justified by the very concern for
  persons that they then appear to violate — they seem to license a greater violation
  of rights than the alternative. Sometimes put: "deontology is self-defeating" or
  "the paradox of deontology is that it forbids the lesser evil and thereby brings
  about the greater."


  Actually the classic formulation: If we have a deontological constraint against
  killing, then in a case where killing one saves five, the constraint says don''t
  kill. But then five die. So the constraint, which is supposed to protect persons,
  results in more deaths. So the constraint seems to be "self-defeating" — it fails
  to achieve its own rationale. The paradox: deontology seems committed to a kind
  of "rights violation maximization."


  There''s also the "paradox of deontology" as raised by Robert Nozick (in Anarchy,
  State, and Utopia, about constraints and "the rationale for constraints" — why not
  violate rights to minimize rights violations). And Scheffler''s discussion. And
  there''s a related idea: the "agent-relative" vs "agent-neutral" distinction.


