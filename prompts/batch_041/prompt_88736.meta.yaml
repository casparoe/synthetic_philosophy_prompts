  Key points I''ll use (paraphrased, no quotes):

  - In the Laws, the Athenian Stranger (Plato''s main speaker) defends wine against
  the Spartan/Cretan disapproval.

  - Wine is a pharmakon (drug) that makes a person more shameless, childlike, and
  fearless; therefore a properly run drinking party (symposion) is a cheap and safe
  test of character — it reveals whether a person really has self-control (sōphrosynē).

  - It''s a "test of the wine"; the drinker learns his own weaknesses; the shame of
  exposure keeps him in line.

  - The right way to run it: a sober leader/president, rules, an ordered party — so
  it''s a training in pleasure, analogous to how battle trains courage (courage is
  tested by fear, temperance by pleasure).

  - Wine as a remedy for old age''s austerity: it loosens old men, makes them young
  and songful, and this connects to the chorus and education in Book II.

  - The image of the human being as a puppet of the gods, pulled by the cords of pleasure
  and pain, with the golden cord of reason — this frames the whole discussion.

  - Plato''s key move: virtue is about getting pleasure and pain right; wine induces
  the condition in which this is tested.


  And the Bacchae:

  - Euripides'' play, produced posthumously (~405 BC) at Athens; won first prize.
  Dionysus, god of wine, returns to Thebes to punish the house of Cadmus for denying
  his divinity.

  - Pentheus, young king, cousin of Dionysus, bans the rites, imprisons the disguised
  god.

  - Pentheus, curious/prurient, is manipulated into dressing as a woman and spying
  on the maenads on Mount Cithaeron.

  - The maenads, in frenzy, tear him apart (sparagmos), mistaking him for a lion/bull;
  Agave, his mother, carries his head in triumph.

  - Cadmus recognizes the horror; Agave realizes; Dionysus reveals himself and justifies
  it; the house is exiled.

  - The chorus of Asian Bacchae; the play''s ambivalence about the god — is he a liberator
  or a tyrant? The famous choral ode about the wisdom of the ordinary man.

  - Also: Pentheus''s rationalism/policing vs. Dionysus''s power; the theme that the
  god cannot be measured or controlled; the "sophrosyne" theme — "to be wise is not
  to be wise beyond mortals" and the chorus''s praise of the simple life; also the
  play''s questioning of whether Pentheus''s death is just.


  The tension to exploit: Plato''s view treats wine as an instrument that a wise legislator/sober
  president can administer and master, a controlled test — wine is subordinate to
  reason; the god is domesticated into a civic institution. The Bacchae says the opposite:
  the god (wine) is a force that masters the master; the man who tries to police it
  (Pentheus) is destroyed; and the "sober president" figure (Pentheus as the young
  king, would-be controller, or Cadmus who tries to restrain) fails. So the play dramatizes
  what Plato''s theory presupposes away: that wine can be governed.


  But a good reading is two-directional: the Bacchae can also be read as confirming
  a version of Plato''s insight — Pentheus''s failure is precisely the failure to
  have been educated in pleasure, to have undergone the "test of the wine"; his repressed
  voyeurism, his cross-dressing and spying, is exactly what a well-run symposion would
  have sublimated and revealed. He''s the man who never learned to drink under a sober
  president; his curiosity is shamelessness without ritual form. Also: the play suggests
  that wine''s test isn''t safe — that the exposure can be total, that there''s no
  "cheap and harmless" way to find out what''s in you, that knowing yourself through
  drink can destroy you (a kind of anti-Platonic point about self-knowledge through
  intoxication). And Euripides'' chorus itself claims that true Bacchic experience
  doesn''t require drunkenness (Bacch. 76-77, per the article) — a nice complication:
  the god''s worship is not the same as getting drunk, so Pentheus''s crime isn''t
  about wine per se.


