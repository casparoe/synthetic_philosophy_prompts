  addiction, a dementia patient who now says she''s happy, etc. Then ask about a new
  case: a directive written when depressed? Or a directive by someone whose later
  self is cheerful but whose earlier self''s reasons no longer apply because the situation
  changed. Candidate rules: precedent autonomy (the earlier self''s authority is near-absolute),
  contemporaneous interests/welfare (the later self wins), "critical interests vs
  experiential interests" (Dworkin''s distinction), narrative-identity criterion,
  "the earlier self is authoritative only when the later self is not the same person"
  (psychological continuity), or a "burden of proof" rule.


  Hmm, but Dworkin''s distinction is well-known. Fine—the injected novelty can be
  a specific new case, plus maybe a novel concept I invent or a niche but explicable
  one.


  Better: inject a new idea. E.g., a "directive that specifies its own conditions
