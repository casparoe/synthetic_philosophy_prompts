  I appear to reject this directive, that rejection is itself to be taken as evidence
  of incapacity" — a self-sealing clause. And a "reverse Ulysses contract" — one that
  binds the earlier self to the later self''s future choices (a pre-commitment to
  being bound by future decisions). Also: "pre-commitment to not pre-commit" — a self-binding
  clause that forbids itself from being revoked. That''s a nice in-the-weeds novelty.


  Also a nice niche-but-explicable idea: "the authority of the earlier self depends
  on whether the later self can be said to have ''authored'' the change" — narrative
  self-authorship. And "transformative experience" (Paul) — but that''s L.A. Paul,
  well-known.


