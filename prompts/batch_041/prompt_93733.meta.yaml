  this conclusion intolerable, and yet every argument I produced against it seemed
  to prove too much, since it also seemed to forbid weighing any number of small harms
  against one large one. Toward the end I tried to change the case: suppose the harm
  in (b) is so slight that the person suffering it would not notice it, would not
  remember it, and would not pay a penny to avoid it, and suppose the crowd is not
  some unimaginable cardinal but merely as large as the number of atoms in the observable
  universe. My friend said this changed nothing. I am not sure he is wrong, and I
  would like you to help me see what follows.


  Please set out the most important implications of the aggregationist verdict in
  this family of cases -- that sufficiently many trivial harms outweigh one catastrophic
  harm -- for how I should reason about real choices of the same shape, by which I
  mean choices that impose imperceptible costs on very large numbers of people in
  order to spare a few people something terrible, or the reverse. Assume I already
