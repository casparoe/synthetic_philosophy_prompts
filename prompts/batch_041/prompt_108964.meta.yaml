  Two disputants:


  Person A (call her someone): the symbolic level is causally real. Points:

  1. Explanations that cite simmball-level patterns have predictive and counterfactual
  power: "if the simmball-clump had been slightly different, the careenium would have
  concluded otherwise" — these are genuine difference-makers, not mere descriptions.

