  ---


  I edit a general-interest science and philosophy magazine and I''m the person who
  reads the unsolicited essays. Every couple of weeks something comes in where Gödel''s
  incompleteness theorems are doing the heavy lifting — "so no AI can ever really
  understand maths", "so no theory of consciousness can be complete", "so no legal
  code can close its own gaps", that kind of thing. I did one logic module as an undergrad
  and retained none of it, I get maybe fifteen minutes per submission, and if I flag
  something as publishable my editor-in-chief has to sign off, so I need a triage
  procedure rather than an explainer. Please don''t give me a reading list or citations
  — I can''t check them and I don''t need them, I need something I can run.


  So: write me a checklist for judging whether an appeal to Gödel is doing legitimate
  work. The questions to ask in order, what counts as a sufficient answer to each,
  where the procedure stops and I can send a form rejection, and where it stops and
  I hand the piece to an actual logician because what''s left is a question about
  values or about what "understanding" means rather than about the theorems. The tricky
  part is that it has to be runnable by someone who doesn''t know the maths. If a
  step is "check whether the axiom set is recursively enumerable", that step has failed;
  tell me what I should ask the author instead to get at the same thing, and what
  a bad answer to that question looks like.


  I have a half-formed diagnosis of the pattern and I want you to either fix it or
  confirm it: (1) a fact about what one particular formal system can prove gets converted
  into a fact about what can be known, or about what''s true; (2) a fact about devices
  that work by mechanically checking proofs gets converted into a fact about anything
  you''d call a mind; (3) "incomplete" quietly slides into "inconsistent" or "broken",
  so the conclusion becomes that the system is defective rather than merely limited.
  If those are the wrong cuts, give me the right ones — and be specific about which
  of the three is the one that actually does the damage, if any of them do.


  Then run the procedure on three submissions I''ve got sitting here. (a) A physicist
  arguing that physics can never arrive at a final theory of everything, because any
  such theory would be a formal system of the relevant kind. (b) A legal theorist
  arguing that adjudication is always inescapably creative, because legal systems
  are incomplete in Gödel''s sense. (c) A philosopher arguing that no machine can
  match human mathematical insight, since for any such machine there''s a sentence
  it can''t prove and we can see that it''s true. I want to know what the procedure
  does with each, including the one where the answer is likely to annoy me — (c) is
  the one I''d most like to publish.


  Finally: be commited. If you think one of my three cuts is bogus, say which and
  what replaces it, don''t just lay out the options. Where the procedure bottoms out
  in a judgment call, tell me what you''d actually do rather than saying it''s a judgment
  call, and tell me where the procedure is going to misfire — which submissions it
  will wrongly wave through or wrongly reject.


