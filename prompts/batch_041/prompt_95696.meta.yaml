  Draft:


  You are an expert in medieval Islamic philosophy, especially Avicenna''s psychology,
  and in the art of preparing speakers for hostile or skeptical Q&A. Think carefully
  before you write. I am a fifth-year PhD student in philosophy, and next month I
  am presenting a paper at a departmental colloquium. I need a Q&A prep sheet, not
  a summary of my paper and not a general defense of Avicenna.


  The domain is Avicenna''s flying man argument. You can take the following thumbnail
  as our common starting point: Avicenna asks us to imagine a person created fully
  formed and suspended in a void, with no sensory contact with anything, not even
  his own body; the question is whether such a person would affirm his own existence.
  The standard reading treats the scenario as an argument for the immateriality of
  the soul: since the self is affirmed without any bodily sensation, the soul must
  be something immaterial.


  My thesis is that this standard reading conflates two things. I defend what I call
  the indexical reading. On this reading, the flying man is not an inference to the
  best explanation of the soul''s immateriality. It is a test of whether the first-person
  perspective can be tokened without any bodily self-ascription. The conclusion it
  supports is only that the self is not given as a body; the further step to immateriality
  requires a separate premise about the transparency of the mental, and that premise
  is much weaker than the argument''s friends suppose. I also claim that the scenario
  is best understood as a subtraction argument, not a bracketing argument: it removes
  sensory content rather than suspending the natural attitude, and this difference
  matters for what it can establish.


  The audience is mixed, and I need to be ready for what this audience will actually
  ask. Here is who will be in the room:

  - three Islamic philosophy specialists who work on Avicenna''s psychology and the
  Arabic tradition; they care about textual fidelity and will resist readings that
  turn Avicenna into a proto-phenomenologist;

  - two Thomists who read Avicenna through Aquinas; they will press that the argument
  is meant to establish a substantial, immaterial soul, and they will treat my indexical
  reading as deflationary;

  - two phenomenologists, one Husserlian and one Merleau-Pontyian; they will ask whether
  the flying man is a genuine reduction or only an imaginative exercise, and whether
  a self without a lived body is even coherent;

  - one cognitive scientist who studies bodily self-consciousness and interoception;
  she will say that minimal self-awareness is embodied all the way down and that the
  flying man smuggles in a Cartesian assumption;

  - the rest are generalist philosophers of mind and metaphysicians who will care
  about whether the indexical reading is a genuine interpretation or a philosophical
  reconstruction that changes the subject.


  Please prepare my Q&A prep sheet. Start with a short brainstorm in which you map
  the load-bearing premises of my argument and the likely priors of each subgroup.
  Then give me the objections I will actually get, ordered by how likely they are
  and how much damage they would do. Phrase each objection the way the relevant subgroup
