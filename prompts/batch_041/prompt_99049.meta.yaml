  would decline the offer, and if they discovered the substitution they would simply
  carry out the original sentence. Yet if the sentence is a fine, we think it entirely
  proper that a friend may pay it, and the offender thereby goes free. Lewis took
  this to show that we are of two minds: we reject penal substitution for custodial
