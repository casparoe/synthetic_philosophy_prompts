  Objections, ordered by damage:

  1. The clinical objection: these are lesion patients with confounds — parietal/insular
  damage, possible neglect, possible inability to report, so their reports of "it
  hurts but doesn''t bother me" may be confabulated or reflect a reporting deficit
  rather than a genuine dissociation. Also: chronic pain patients show the opposite
  (pain with huge affective load), and anesthesia — you don''t need asymbolia to separate.

  2. The conceptual/stipulation objection: if it doesn''t hurt in the affective sense,
  is it pain at all? You may be using "pain" to mean nociception and "badness" to
  mean the whole experience — the dissociation may be an artifact of how we carve
  the words. (Verbal dispute.)

  3. The representationalist/higher-order objection: pain''s badness could be part
  of the content (that tissue is damaged) with a separable appraisal layer; your case
  doesn''t show the badness is extrinsic to the experience, only that it''s extrinsic
  to the sensory core — and the sensory core alone isn''t a full experience of pain.

  4. The modal/intrinsic objection: intrinsic badness is a claim about what makes
  pain bad in virtue of its nature; a lesion case shows badness can be stripped, which
  shows at most that the affective component is what does the work — fine, but you
  need a theory of why that component is bad (desire-based? evaluative?) and you haven''t
  given one; if it''s desire-based, then badness is relational and your view collapses
  into a familiar desire-satisfaction account of pain''s badness, which has its own
  problems (the "unwanted pain" — pains can be wanted, e.g., in masochism, athletic
  effort...).

  5. The clinical-practice objection: if the affective dimension is separable, what''s
  your advice? Should we be giving anxiolytics/opioids vs. targeting the affective
  dimension? And what does this say about "total pain" / suffering in palliative care
  — do you deny that the sensory intensity matters?

  6. The animal/other-minds extension: if badness is separable from the sensation,
  does this bear on whether fish/insects feel pain that matters? Careful — don''t
  overclaim.


