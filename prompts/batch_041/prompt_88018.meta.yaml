  Belief set final:


  (1) The Basic Argument, as I read it, is sound: to be ultimately responsible for
  what you do you''d have to be responsible for being the way you are, and the regress
  can''t terminate short of literal self-creation; so no one is ultimately responsible
  for anything. And it makes no difference whether determinism is true — indeterminism
  just swaps out one impossibility for another.


  (2) So I don''t believe in desert-entailing blame. Nobody deserves to suffer for
  what they''ve done; the criminal law should be forward-looking, and any punishment
  that survives should be justified by what it does, not by what was done.


  (3) I''m a moral realist: there are mind-independent truths about what we owe each
  other, and some acts are simply wrong.


  (4) I also think we can''t stop having reactive attitudes — resentment, indignation,
  gratitude, forgiveness — and that we shouldn''t want to. The wholly objective stance,
  in which you never feel addressed by anyone''s will, is not a human ideal; it''s
  a pathology.


  (5) I''m drawn to the episodic view of the self: what exists at any moment is a
  thin, short-lived subject; the "I" now and the "I" five years ago are not literally
  the same thing.


  (6) I accept ought-implies-can: you''re not obligated to do what you genuinely cannot
  do.


  (7) And I think deliberation is real: when we weigh reasons, the weighing makes
  a difference to what happens; we aren''t just systems that the past moves through.


