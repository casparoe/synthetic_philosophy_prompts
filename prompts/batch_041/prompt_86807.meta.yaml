  I am preparing a position paper on freedom of expression and would like an audit
  of my commitments before I settle the framing. Here is roughly where I have landed.


  1. I hold the harm principle strictly: the only admissible ground for coercing an
  adult — by law or by the organised pressure of a majority — is the prevention of
  harm to others. Offence, disgust and the agent''s own good are excluded.


  2. I defend free expression chiefly on the fallibility argument I take from Mill:
  since we can never be certain that a suppressed opinion is false, and since even
  a true opinion loses its living force unless it is contested, the free collision
  of opinions is the best truth-finding arrangement available to us.


  3. I do not accept the usual corollary that the remedy for bad speech is always
  more speech. Where a coordinated campaign manufactures the appearance of a live
  expert controversy — where the aim is not to defend a proposition but to corrode
  any shared standard of evidence — I think restriction is permissible.


  4. I would nonetheless keep hate speech lawful. The state''s judgment about which
  contemptuous speech falls beyond the pale is less reliable than the public''s eventual
  response to it, and the people such speech targets are not made safer by its criminalisation.


  5. On grounding, I take the harm principle to rest on autonomy rather than on utility.
  The reason the state may not coerce me for my own good is that my life is mine to
  lead, and that claim is prior to any aggregation of welfare.


  6. Methodologically, I want a test for when expression may be regulated that is
  robust enough to be applied by a judge who dislikes the speaker — not a standard
  that only a sympathetic interpreter could be trusted to apply.


  7. I would criminalise incitement to violence, and I would prohibit outright deception
  in commercial advertising.


  8. I would have the state fund independent public broadcasting and teach critical
  reasoning in schools.


  What I want is an audit, not a survey. Which of these commitments are genuinely
  in tension, which only appear to be, and for each genuine tension how severe it
  is and what the least costly revision would be. Rank them by severity rather than
  presenting them as equally bad; tell me which single revision would clear up the
  most and what it would cost me elsewhere; and be specific about which commitment
  has to give.


