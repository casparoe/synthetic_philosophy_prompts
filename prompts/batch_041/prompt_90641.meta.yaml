  \n---\n\nEssay:\n\n**Three Questions About Heritability**\n\n1. The received clarification,\
  \ and what it leaves open\n\nEvery discussion of heritability in a non-specialist\
  \ setting begins with the same clarifications, and they are all correct. Heritability\
  \ is a property of a population, not of a trait or an individual. It is a ratio\
  \ of variance components, so it is indexed to a particular population at a particular\
  \ time living in a particular range of environments; change the environment distribution\
  \ and the number changes. A high heritability does not mean that a trait is fixed,\
  \ or that teaching, feeding or medicating people cannot change it; it means only\
  \ that, in the population as it happens to be, differences among individuals trace\
  \ disproportionately to genetic differences. And the heritability of a trait within\
  \ a group places no constraint on the causes of a difference between groups: mean\
  \ adult height is highly heritable within well-nourished populations, and the large\
  \ differences in mean height between well-nourished and poorly nourished populations\
  \ are overwhelmingly environmental.\n\nI accept all of that and want to argue that,\
  \ as usually deployed, it has become a ritual rather than an explanation. The ritual\
  \ answers one question, implies that the others are closed, and thereby makes them\
  \ harder to ask. What I want to propose is a way of separating the questions that\
  \ the word heritability gets used to ask.\n\n2. Three questions, one word\n\nQ1,\
  \ the variation question: within this population, in this range of environments,\
  \ how much of the variance in the trait is attributable to genetic differences among\
  \ individuals? This is what heritability estimates answer, and they answer it well.\n\
  \nQ2, the intervention question: if we changed the environment (or the genotype)\
  \ of everyone in the population, how far would the distribution of the trait move?\
  \ This is a question about counterfactuals. Heritability estimates do not answer\
  \ it. They bear on it only indirectly, and only given assumptions that are rarely\
  \ stated: that the environmental range under the proposed intervention is not far\
  \ outside the observed range, that interaction and genotype-environment correlation\
  \ are limited, and that we are not asking about the tails of the distribution.\n\
  \nQ3, the gap question: what would happen to the difference between two populations\
  \ if some feature of their environments, or some feature of their genotype distributions,\
  \ were equalised? This is not one question but a family, one member per feature\
  \ chosen. Heritability answers none of them.\n\nThe three questions are not independent,\
  \ but they are not interderivable either, and nearly every dispute I have read turns\
  \ on sliding between them without noticing. The hereditarian move is from a high\
  \ Q1 estimate to a Q2 or Q3 conclusion. The environmentalist move is from the correct\
  \ observation that Q1 is uninformative about Q3 to the conclusion that Q3 has an\
  \ environmental answer. The two moves are the same inference with opposite signs,\
  \ and both are invalid for the same reason: the number does not settle the counterfactual.\n\
  \n3. The gap question has a shape, not a value\n\nQ3 is often treated as though\
  \ it had a single true answer that one side or the other is suppressing. It does\
  \ not have an answer at all until the counterfactual is specified. Ask how much\
  \ of the difference in some trait between two populations is genetic and you have\
  \ asked nothing yet; ask what would happen to the difference if the two populations\
  \ were equalised on nutrition, or schooling, or exposure to a particular pathogen,\
  \ and you have asked something answerable in principle. What the within/between\
  \ argument establishes is that Q1 is the wrong evidence for Q3. It is often over-read\
  \ as establishing that Q3 is unanswerable, or worse, as establishing a default answer.\
  \ Neither follows. What follows is a specification demand, and it cuts both ways:\
  \ an environmental answer to Q3 is a claim about a specific counterfactual, and\
  \ it needs the same specification as a genetic one.\n\n4. Variance-heritability\
  \ and intervention-heritability\n\nHere is the proposal I care most about. I want\
  \ to distinguish two quantities that the single word heritability currently covers.\n\
  \nVariance-heritability is the familiar ratio: the share of observed variance in\
  \ a population traceable to genetic differences among its members. It is a fact\
  \ about the variation that is actually present.\n\nIntervention-heritability is\
  \ the share of the movement in the trait distribution that a specified intervention\
  \ on genes, or on environments, would produce. It is a fact about a counterfactual,\
  \ and it is indexed to an intervention rather than to a population.\n\nThe two come\
  \ apart in both directions, and the cases are not exotic. In a population where\
  \ everyone is adequately nourished, height is highly variance-heritable and also\
  \ highly intervention-heritable on the environment: widen the range of nutrition\
  \ and the environmental term grows while the genetic term stays where it was. Conversely,\
  \ a population can show low variance-heritability because environmental variation\
  \ is large, while nothing available to us can shift that variation, so intervention-heritability\
  \ is low as well. Variance-heritability is a function of which sources of variation\
  \ happen to be present; intervention-heritability is a function of what we can do.\
  \ Neither is more fundamental, and neither is a substitute for the other.\n\nOnce\
  \ the two are separated, the slogan that heritability is irrelevant to policy turns\
  \ out to be false in one direction and true in another. It is false as a claim about\
  \ intervention-heritability: knowing the variance decomposition of a population\
  \ tells you something, though not much, about where the leverage is. It is true\
  \ as a claim about the gap: no fact about the distribution of variation inside a\
  \ population can tell you what would happen if you equalised something across populations.\n\
  \n5. Why the confusion persists\n\nBoth parties to the dispute have an interest\
  \ in the ambiguity. One wants to say that a high number means a genetic cause; the\
  \ other wants to say that because the number cannot license that inference, the\
  \ cause is environmental. The distinction above shows why the second inference is\
  \ no better than the first, and why the conciliatory response — that the trait is\
  \ partly genetic and partly environmental — is not a solution either. That response\
  \ treats the decomposition as a report of two ingredients mixed in the trait, when\
  \ it is a report of two sources of variation in a population, relative to an environment\
  \ range, for a specified measure. The reason this keeps needing to be said is that\
  \ the decomposition looks like a recipe.\n\n---\n\nThen the comments request. Then\
