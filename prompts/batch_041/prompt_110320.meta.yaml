  and they never notice)? Is it two sides answering different questions — the pessimist
  asking whether testimony can transmit the experience and the optimist asking whether
  it can transmit propositional justification? Is it a disagreement about the epistemology
  of testimony in general, just applied here? Or is there a hidden metaphysical claim
  about aesthetic properties (that they''re response-dependent, say) doing the real
  work?"


