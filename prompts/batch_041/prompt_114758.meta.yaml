  ---


  I''m an intensive care consultant in a big NHS trust and I''m also the trust''s
  clinical lead for organ donation, which in practice means that when a patient on
  one of our units looks like becoming a donor after their circulation stops, I''m
  the person the registrar phones at three in the morning. We do two or three of these
  a month. The thing that''s been bothering me is that none of the questions we actually
  get asked at that hour are the ones that appear in the teaching: what people want
  to know, standing next to a body with a family in the room, is whether this patient
  is dead already or whether we are about to be the ones who make them dead by turning
  something off, and the guidance we''ve got doesn''t really put that question on
  the page. So I''d like you to write me a decision procedure my registrars can actually
  run, in order, at night, with nobody more senior awake — the questions to ask, what
  counts as a sufficient answer to each, where it stops and says no, and where it
  hands the decision to a named person because the question is one of values and not
  of physiology. It has to work in the time we''ve got, which is not much, and it
  has to be usable by someone who isn''t a neurologist.


  Some things I want it to take seriously rather than smooth over. First, a distinction
  our ethics lead keeps pushing and I''ve slowly come round to: in the commonest route
  to donation here we don''t wait for the heart''s stopping to be irreversible, we
  wait for it to be permanent — permanent meaning nobody is going to try to start
  it again — and that''s a decision we make rather than a fact we observe, so I want
  the procedure to be honest about where inside it that decision sits and whose signature
  is on it. Second, three cases the standard guidance mumbles at. (a) A patient on
  an extracorporeal circuit, where the blood is oxygenated outside the body, so the
  usual bedside tests don''t mean what they normally mean and it''s genuinely unclear
  how much blood the brain is getting — I want to know what my registrar does with
  the brainstem examination here, and what she does when she can''t do it properly.
  (b) Withdrawal of treatment in a patient who we expect to arrest, followed by our
  five minutes of asystole (tell me if five is the wrong number and what it should
  be), after which the retrieval team wants to put the donor onto a circuit that pushes
  warm oxygenated blood back into the abdominal organs with the vessels to the head
  clamped off so the brain isn''t reperfused — and one member of our committee keeps
  saying, in a way I can''t quite answer, that it''s that circuit and not the withdrawal
  that actually ends the patient''s life. (c) The family who say we''re only calling
  him dead because we want his organs, which is the objection that actually shakes
