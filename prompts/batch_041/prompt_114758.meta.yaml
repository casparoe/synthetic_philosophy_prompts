  a distinction our ethics lead keeps pushing and I''ve come round to: that in the
  commonest route to donation here we don''t wait for the heart''s stopping to be
  irreversible, we wait for it to be permanent — permanent meaning nobody is going
  to try to restart it — and that this is a decision we make, not a fact we observe.
  I want the procedure to be honest about where that decision is sitting inside it,
  and who is making it. Second, I want it to handle three things the standard guidance
  mumbles at: a patient on an extracorporeal circuit where blood is oxygenated outside
  the body, so the usual bedside tests don''t mean what they normally mean and the
  brain may or may not be getting any blood; the case where we withdraw treatment
  and then, after the heart has stopped and we''ve waited our five minutes (tell me
  if five is the wrong number and why), the retrieval team wants to put the donor
  onto a circuit that starts the abdominal organs being perfused again, with the vessels
  to the head clamped off so the brain isn''t reperfused — and someone on our committee
  says that circuit, not the withdrawal, is what actually ends the patient''s life.
  Third, I want it to handle the family in the room who say we''re only calling him
  dead because we want his organs, because that''s the objection that actually shakes
  people, and a procedure that can''t answer it out loud is no use.


