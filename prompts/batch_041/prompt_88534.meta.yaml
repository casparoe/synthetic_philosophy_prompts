  The Rietdijk–Putnam argument (Rietdijk 1966, Putnam 1967 "Time and Physical Geometry"):
  Given special relativity, for any event A in my present, there are events B and
  C which are both future-relative... Actually the standard formulation: take an event
  P in my present. Take an event Q in P''s present (i.e., simultaneous with P in some
  inertial frame) which is in my absolute future... hmm. The argument: For observer
  A, event X is "real" (present) if simultaneous in A''s frame. Because simultaneity
  is frame-relative, events that are future for A are present (real) for some other
  observer, hence real simpliciter. Then by transitivity, everything becomes real.
  The standard objection (Stein 1968, Savitt 2009?) is that the argument requires
  the premise that "real for" relations compose/transit, or that it conflates "being
  real according to some frame" with "being real". Also the notion of "real" as a
  relation. Yes: Howard Stein''s "On Einstein-Minkowski space-time" (1968) criticised
  Putnam; Stein proposed a different relation ("R" = past-or-present in some frame).
  Also there''s the "no privileged simultaneity" point. And Putnam later, in "Reply
  to Stein", etc. Also relevant: the argument presupposes that "now" picks out a simultaneity
  slice in the observer''s frame (a "presentism" of a slice) rather than a point (the
  here-now) — Stein''s point that the "present" of an observer should be taken as
  the point-event, not the hyperplane. Yes! Stein''s criticism: Putnam treats an observer''s
  present as a 3D hyperplane of simultaneity, but the "here-now" of an observer is
  a point; the set of events co-present with a point... Hmm, Stein argues the correct
  notion is the "becoming" of a point. Anyway, the criticism exists in the literature
  and I can mention it in general terms without over-claiming.


