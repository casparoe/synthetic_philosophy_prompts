  I am a novelist at work on a book about a man who loses the ability to form new
  memories after an assault, and I have been using Christopher Nolan''s Memento as
  a touchstone for how a life can be held together by notes, photographs, and tattoos
  rather than by continuous recollection. What I keep circling back to is not the
  revenge plot but the film''s peculiar relation to Descartes''s cogito. I want a
  reading of Memento through the question of what the cogito actually proves. Not
  the schoolroom version, but the harder issue: does the act of thinking establish
  only that thinking is occurring, or does it establish an I that persists, owns its
  thoughts, and can be identified over time? I am interested in the objection that
  the impersonal formulation is all that is warranted, in the reading that treats
  the cogito as a performance rather than an inference, and in the memory objection
  -- that the certainty of the present moment cannot be extended into a certainty
  about the same self across time without relying on memory, which is exactly what
  Leonard lacks. Does Leonard ever have a cogito moment? If he does, what does it
  prove? Does the film''s reverse chronology put the viewer in a position where each
  scene is indubitable but the connections between them are not, and is that a dramatization
  of the gap between the cogito and personal identity? I would like you to read specific
  scenes -- the tattoo parlor, the Polaroids, the Sammy Jankis story, the final revelation
  -- in light of these questions, and to say where the film genuinely illuminates
  the philosophical problem and where it distorts it or trades on a confusion. I am
  not looking for a summary of the film or a history of Cartesian scholarship; I want
  a critic''s reading that could help me understand what my own novel is actually
  claiming about memory and selfhood.


  Please keep the response to no more than 800 words. At the end, say how confident
  you are in the reading as a whole and single out the one claim in it that you are
  least sure of.


