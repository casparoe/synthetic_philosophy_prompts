  In-the-weeds elements I inject (not requiring memorized theory):

  1. The state collects the tax (with a cut), using employer withholding.

  2. The resident register records religion; the tax office knows.

  3. Exit is a state act (Standesamt), sometimes with a fee; entry is not.

  4. The church can impose loyalty duties on employees of its hospitals/kindergartens/schools,
  dismiss them for leaving the church, and the dispute is decided by state labor courts;
  church employees have no works council and no strikes ("third way").

  5. Religion is a normal school subject taught by state-employed teachers who need
  church authorization; parents opt out.

  6. Direct state payments to churches as compensation for the 1803 seizures (Staatsleistungen).

  7. Churches hold "public-law corporation" status (Körperschaft des öffentlichen
  Rechts).

  8. The Catholic church treats the civil exit as a canonical act with sacramental
  consequences (no communion, no church funeral without repentance) — church and state
  each recognize the other''s act as having force in its own domain.


  The puzzle: Germany calls itself neutral ("hinkende Trennung" — maybe skip), but
  the state is simultaneously the tax collector, the membership registrar for exit,
  the enforcer of church labor law, the provider of religious education, and a payer
  of compensation. What does that presuppose?


  Sub-questions for the answer:

  - Is the implicit theory "the state is neutral among religions and worldviews, and
  treats them as civic associations that citizens may belong to, membership being
  a legal status the state can register"? (i.e., religion as a public-law institution,
  like a chamber of commerce or a university — "public corporation" model.)

  - Or does it presuppose something about religion being a special good the state
  should support ("religion as a public utility / a pillar of social order")?

  - The exit/entry asymmetry: presupposes that the state has an interest in protecting
  freedom of conscience by making exit easy/formal and public (a protection against
  the church''s monopoly on the record), or, more cynically, that the state is a debt-collection
  arm and the formality protects revenue (cooling-off, and the fee).

  - The "third way" labor relations: presupposes that the church is not a voluntary
  association but a quasi-public body with its own legal order, similar to the state''s
  own civil service — i.e., plural legal orders recognized by the state.

  - Does the practice require the church to be a "Körperschaft"? Does the practice
  presuppose that religions are the kind of thing that can be a legal person with
  members, i.e., a congregational/protestant model? Does it presuppose a "membership"
  concept alien to, e.g., Islam or Buddhism — that religion is a matter of registered
  belonging?

  - Does the practice presuppose that religious membership is a matter of fact the
  state can record, rather than a matter of belief/conscience the state can''t see?
  (Contrast: US disestablishment treats membership as private; France treats religion
  as private conscience, so the state cannot keep a list.)

  - Compare with France (laïcité + Alsace-Moselle exception + state ownership of pre-1905
  churches + state-funded private religious schools) and the US (no establishment
  but tax exemption, chaplains, "In God We Trust").

  - The inconsistency test: does the arrangement presuppose one coherent view, or
  is it a layered historical compromise whose parts presuppose inconsistent theories
  (corporation model + liberal neutrality + "culture-protestant" idea that the church
  is a branch of the state)? Likely the answer: underdetermined/layered; some parts
  presuppose an institutional theory of religion (religion as a public-law corporation
  with members and territory, a "Kirche" model), other parts presuppose liberal freedom
  of conscience; the tax collection itself presupposes only the permissibility of
  "specific subsidies to voluntary associations funded by members," which is not obviously
  non-neutral if generalized to any association that wants it (the state offers collection
  services to any recognized body — so the neutrality is at the level of the service,
  not the outcome). But then the public-law status of only some bodies is a privilege
  (which is why Jehovah''s Witnesses fought for years to get the status — I believe
  they were recognized in Berlin in 2006 and later in other states; that''s plausible
  but I''ll hedge or omit).


