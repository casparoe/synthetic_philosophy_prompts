  Entrapment (US federal law, Sorrells v. US 1932, Sherman v. US 1958, Jacobson v.
  US 1992): the government may not implant a criminal design in an innocent person''s
  mind; the question is whether the defendant was "predisposed." Jacobson is the key
  case: the Court said the government must prove predisposition beyond reasonable
  doubt — "the prosecution must prove that the defendant was disposed to commit the
  criminal act prior to first being approached by Government agents." So the law asks
  a counterfactual about the agent''s character/disposition before the sting.


  Frankfurt: the agent acts on his own reasons; a counterfactual intervener would
  have made him do it anyway; we judge him responsible because the actual sequence
  is his own. So: what makes the agent responsible is the actual sequence, not what
  he would have done otherwise. Entrapment law says the opposite: what matters is
  the counterfactual (what he would have done absent the government). So the theory
  illuminates the case: the law is tracking something other than responsibility —
  it''s tracking whether the *state* is a co-author, i.e., a condition on the state''s
  standing to punish, not on the agent''s responsibility. And the case tests the theory:
  in Frankfurt''s case the counterfactual is stipulated by the story; in real life,
  the counterfactual is epistemically inaccessible, so a doctrine built on it becomes
  unworkable (hence the messy objective/subjective tests, and the messy Newburgh outcomes).
  Also, Frankfurt cases trade on our certainty about the intervener; the sting shows
  what happens when the intervener''s counterfactual role is unknowable — you get
  courts asking juries to speculate about a person''s character before they were approached.
  And there''s the "flicker of freedom": in the sting, the defendant could have said
  no — a flicker — yet wasn''t in Frankfurt''s terms able to do otherwise... hmm,
  actually in the sting he was able to do otherwise in a real sense (the FBI didn''t
  coerce). So the sting is *not* a Frankfurt case at all — the FBI''s intervention
  is real, not counterfactual, so it *does* affect the actual sequence, and thus by
  Frankfurt''s own lights the responsibility question turns on whether the agent''s
  action still flowed from his own reasons. The sting is a test of the "actual sequence"
  criterion: when the state supplies means and target, is the action still "the agent''s
  own"? Frankfurt''s account (identification, wholeheartedness) says: yes if he endorsed
  it; no if he was merely compliant.


