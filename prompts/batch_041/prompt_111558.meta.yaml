  Prompt idea:

  "I''ve been trying to understand the common prior assumption in game theory and
  Bayesian decision theory, and I''ve built an argument that seems to show it is either
  empty or false. (1) The common prior assumption says that rational agents'' differing
  beliefs can always be modeled as arising from a shared prior probability distribution
  plus different private information. (2) If that is true, then whenever two agents
  have common knowledge of their posterior probabilities for some event, those posteriors
  must be identical. (3) My friend and I have common knowledge of our posteriors:
  we have each told the other our credence that a certain coin is biased, and we both
  know that the other has heard and understood. (4) We still disagree: I say 0.7,
  she says 0.4. (5) We are both rational and have not ignored any evidence. (6) Therefore
  the common prior assumption is false. (7) But if the common prior assumption is
  false, then there is no general reason for rational agents to converge in belief,
  and the no-trade theorem loses its foundation; disagreement and speculative trade
  are perfectly rational. (8) That seems too quick: the theorem is supposed to be
  a mathematical truth, not an empirical hypothesis that can be refuted by a stubborn
  friend. Where does the argument go wrong? I suspect the move from (2) to (6) is
  doing something illegitimate, but I can''t say what. If I have to give up one of
  (1), (3), (5), or (7), which is least costly? Please answer in American English."


