  Half the people I read treat this as a huge result: persistent disagreement between
  two people who respect each other''s reasoning must mean they differ in information,
  full stop. The other half say the common prior is doing all the work and is either
  false or empty — if two people really disagree you just say they had different priors,
  and since any disagreement can be re-described that way, the theorem tells you nothing
  about actual disputes. Then it goes in circles: "you''re denying the Harsanyi doctrine,"
  "no, you''re smuggling in a substantive empirical assumption and calling it rationality."


