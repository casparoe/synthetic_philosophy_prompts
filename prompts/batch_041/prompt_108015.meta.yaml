  Draft:


  I am a retired experimental scientist. Most of my professional life was spent designing
  controlled experiments, and since retiring I have been reading philosophy, chiefly
  Dewey. I have agreed to run a session at a small residential workshop for early-career
  researchers drawn from philosophy, the social sciences, and the natural sciences.
  I want the session to be a laboratory exercise in Dewey''s experimentalism about
  democracy and inquiry, not a lecture about it.


  Please design a runnable 90-minute activity for 16 participants. The room is ordinary:
  movable chairs, a whiteboard, index cards, and a small supply of tokens. No real
  money. The participants will not have read Dewey, and I do not want his name mentioned
  until the debrief. I want them to feel, in the doing, three connected claims: that
  inquiry begins in an indeterminate situation rather than a well-formed problem;
  that a public is not a pre-existing collection of individuals with fixed preferences
  but something that has to be formed around shared consequences; and that democratic
  decision-making, on this view, is itself a mode of experimental inquiry in which
  ends are revised by the consequences of trying to realize them.


  The activity should work roughly as follows, though you should improve the mechanics
  where they are weak. Each participant receives a private consequence card describing
  something they will experience if a certain institutional change is adopted. No
  one may show a card; participants may speak only in testimony, proposals, and predictions
  of consequences. They must first discover with whom they share consequences, then
  frame a problem, then design a small trial or intervention, then decide whether
  to adopt it. Halfway through, I will introduce a perturbation that changes who is
  affected and how. The group must then revise not only its proposal but its statement
  of the problem. The aim is that they experience the difference between aggregating
  fixed preferences and conducting a shared inquiry.


  I would like the design to include the following: a premise and learning aims; materials
  and room setup; roles and rules, including how the private consequence cards work
  and what may and may not be said; a minute-by-minute run sheet; a debrief that maps
