  Responsibility gap argument: The classic "responsibility gap" (Matthias, Sparrow):
  when an autonomous system causes harm, no one is responsible — the operator didn''t
  know what it would do, the programmer didn''t foresee the learning, the system isn''t
  a moral agent. So the gap.


  Proves-too-much version: Generalize the conditions for responsibility (knowledge/control/awareness)
  and show that no human in a complex organization ever satisfies them either, so
  responsibility is impossible tout court. Then the conclusion: since responsibility
  gaps are pervasive and unavoidable, we should abandon responsibility attribution
  entirely (or: the whole practice is a fiction).


  Subtle flaw candidates:

  - Equivocation between "not fully responsible" and "not responsible at all" (degrees
  vs. all-or-nothing).

  - The control condition: distinguishes "did not control the specific act" from "controlled
  the process/setup" — responsibility for the design of the process, or "responsibility
  for the foreseeable range of outcomes."

  - The "gap" argument assumes responsibility requires a single locus with complete
  knowledge, i.e., presupposes a monistic "control" account; but responsibility can
  be distributed, or can attach to collective/role-based agents.

  - Modal slide: "could not have known exactly" vs "could not have known" — the standard
  for negligence is reasonableness, not certainty.

  - The knowledge condition: "the operator could not have foreseen" slides from "could
  not foresee with certainty" to "could not foresee at all."


