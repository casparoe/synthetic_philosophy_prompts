  Lewis''s account (Convention, 1969): A regularity R in the behavior of members of
  a population P when they are agents in a recurrent situation S is a convention if
  and only if it is true that, and it is common knowledge in P that, in any instance
  of S among members of P: (1) everyone conforms to R; (2) everyone expects everyone
  else to conform to R; (3) everyone prefers to conform to R on condition that others
