  Key features: conventions are arbitrary, self-enforcing, sustained by common knowledge
  and mutual expectations, not necessarily normative in the moral sense, and can arise
  without anyone intending them; they solve coordination problems (not prisoner''s
  dilemmas). Also Lewis on convention and language: truthfulness, trust, and the "score-keeping"
  in signalling games. Later Lewis ("Languages and Language", 1975) uses conventions
  of truthfulness and trust. Also the "evolution of norms" connects to Lewis''s later
  work on games of partial information and the "evolution of convention" literature
  (Young, Sugden''s "The Economics of Rights, Co-operation and Welfare", Bicchieri''s
  "Grammar of Society" with her account of social norms as involving conditional preferences
  and normative expectations).


  Now CIL: The two-element approach — state practice (objective) plus opinio juris
  (subjective belief that the practice is legally required). The "chronological paradox"
  (or "circularity problem"): opinio juris is supposed to explain why a practice creates
  law, but opinio juris itself presupposes the existence of the legal obligation,
  which can only come from the custom — so the custom seems to need to exist before
  it exists. Also: CIL binds new states without their consent; persistent objector
  rule; instant custom (Bin Cheng on outer space resolutions); the ICJ''s Nicaragua
  judgment used General Assembly resolutions as evidence of opinio juris; the problem
  of how to count practice and how to weight inconsistent practice (the "specially
  affected states" doctrine). Also: if opinio juris is required, how could a new custom
  ever form, since states must believe the rule is already law? Also, CIL is not backed
  by a central enforcer, yet it''s treated as binding — the sanction is reputational/reciprocal.


  The philosophical questions: Does CIL presuppose a Lewisian convention? Lewis requires
  a preference to conform given others conform (coordination, mutual benefit), while
  CIL requires a belief that one is legally required. Lewis''s conventions are not
  necessarily normative; opinio juris is normative. So CIL seems to presuppose something
  stronger than Lewis''s account — perhaps a norm in the sense of Hart (social rule
  with internal point of view), or Bicchieri''s social norms with normative expectations
  and possible sanctions, or a "convention" in Marmor''s sense with a constitutive/normative
  element, or Postema''s/ Coleman''s account. Also, Lewis''s account requires common
  knowledge, which is hard to achieve among ~200 states with heterogeneous beliefs;
  but maybe common knowledge of the practice suffices.


  Also relevant: the "evolution of norms" — the question of whether an arbitrary coordination
  equilibrium becomes a norm with independent normative force, and whether the normativity
  is reducible to convergent expectations plus reputational incentives. And there''s
  the phenomenon of "spontaneous emergence" (Sugden''s hawk-dove conventions, Young''s
  "The Evolution of Social Norms" with the "contractarian" reading of conventions
  that generate entitlements). Also Hume''s account of justice as convention (the
  "conventions" of property and promising) — and Hume is a precursor: the conventions
  of justice are artificial virtues, emerging from self-interest. That connects nicely:
  CIL''s rules of sovereignty/territory look Humean.


