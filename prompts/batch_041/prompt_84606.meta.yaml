  ---


  I work on treaty and customary-law questions at a small foreign ministry, and I
  keep running into a feature of the doctrine that I can''t make philosophical sense
  of. Customary international law is identified by a two-part test: a general and
  consistent practice among states, plus opinio juris — the requirement that states
  follow the practice out of a sense that it is legally required. Both parts are treated
  as necessary, yet in practice neither is applied as it looks. Where a rule is thought
  to be important, a handful of instances or a widely supported General Assembly resolution
  is enough, with almost no settled practice behind it; where conduct cuts against
  an alleged rule, lawyers often discount the inconsistent conduct on the ground that
  the offending state denies that it is breaking any rule, so that the violation is
  said to confirm the rule rather than erode it. And opinio juris is supposed to be
  what turns a habit into law, which raises the question of what states are supposed
  to believe before the rule exists.


  What I want to know is what this practice presupposes about convention and normativity...
  etc.


  Then the questions:

