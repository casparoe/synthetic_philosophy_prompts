  Design the prompt:


  Context: The asker hosts a podcast/seminar interview series; the guest is a philosopher
  of science (invented) defending a specific revised falsificationism.


  I need to spell out the guest''s view concretely — the injected niche idea. Let''s
  craft it carefully so it''s coherent and engageable:


  The guest''s position (call it "regime falsificationism"):

  1. Demarcation is a property of practices/institutions, not statements: a discipline
  is scientific to the extent that it maintains a standing practice of subjecting
  its claims to tests whose possible outcomes are specified in advance and whose failure
  would, by the discipline''s own rules of procedure, oblige revision of the claim.

  2. On her view, individual hypotheses need not be falsifiable; an immunized hypothesis
  can persist inside a scientific discipline provided the discipline''s procedures
  would eventually force it out.

  3. She claims this is continuous with Popper''s project rather than a sociological
  replacement: the criterion is normative, but its subject matter is the practice
  of error-detection rather than the logical form of sentences.

  4. She says the standard objections (tacking, Duhem–Quine, the empirical basis,
  ad hoc rescue) all target the statement-level criterion and miss hers.


  Required questions (9–10 total):

  - At least one on the tacking-style objection as it applies to regimes: since a
  test always bears on a conjunction, what in the practice prevents every regime from
  counting as error-detecting by assigning blame to auxiliaries?

  - At least one on the empirical basis: who decides that a test''s outcome is the
  one specified in advance, and what stops the "in advance" specification from being
  renegotiated after the fact — i.e., does the view collapse into conventionalism?

  - At least one on self-application: does her own account satisfy her criterion?
  Is it a claim that could fail a test specified in advance, and if she says the criterion
  is a proposal rather than a claim, press on whether that makes it arbitrary.

  - At least one on the "eventually" clause: what distinguishes an immunized hypothesis
  that the regime will eventually force out from one that it won''t, given that the
  "eventually" is itself untestable at any time?

  - At least one on statistical/probabilistic hypotheses: no finite run of outcomes
