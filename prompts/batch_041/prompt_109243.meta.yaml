  Draft summary (attributed to "a recent popular book on the politics of diagnosis"
  / "an essay in a general-interest magazine" — unnamed):


  "Since the 1980s philosophers of science have taught us that psychiatric categories
  are not discovered but made. Ian Hacking''s ''looping effect'' is the mechanism.
  When a new diagnosis appears — say, a disorder of attention or of mood — people
  who match it begin to see themselves in it, present themselves differently to clinicians,
  and in due course come to resemble the description more closely; the description,
  in turn, is revised to fit the patients it has produced, and round the loop we go
  again. The lesson is the one Merton drew for social prediction: the belief makes
  itself true. Hacking''s innovation was to notice that the loop can run in the opposite
  direction as well, since a category that no longer suits its members falls out of
  use and is replaced by a new one. This is why psychiatric diagnosis is unlike the
  rest of medicine: there is no stable kind underneath the label to be got right or
  wrong, and so the history of psychiatry is a history of fashions. The natural sciences
  escape the loop because their objects — electrons, say — are indifferent to what
  we say about them. The practical conclusion is hard to avoid: if the categories
  are only artefacts of our classificatory practices, there is nothing for a diagnostic
  manual to be accurate about, and we should stop treating its entries as discoveries
  about human nature."


