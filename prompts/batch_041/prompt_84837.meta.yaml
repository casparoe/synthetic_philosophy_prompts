  ---


  I have no academic training — I read ethics on my own and run a monthly discussion
  circle at my local library — but a question has been nagging at me for about a year,
  and it keeps splitting the group in ways I cannot predict. When two people with
  deeply different moral outlooks come to an agreement, when is that agreement a genuine
  gain for both of them, and when is it just one side buying off the other, or both
  sides quietly selling out what they believe? The comparison I keep reaching for
  is trade. Two traders do not need to agree about what is valuable; they need only
  differ in what they will give up at the margin, so that each has something the other
  wants more than they do, and then both can walk away better off. I want to know
  whether anything like this is true of values, and if not, exactly where the analogy
  breaks.


  So please build me a decision tree — a flowchart I can hand round the circle and
  talk through out loud — that starts from commitments a person can state about their
  own life and sorts them into a position on what moral compromise between different
  value systems can and cannot be. I am not asking for a reading list, for names of
  authors, or for book titles; I could not check them and nobody in the room would
  recognise them. Give the positions short plain-language names, and where you think
  no such position has a standard name, say so and mark it as unnamed. What I want
  is the shape of the space, not a survey of who has occupied it.


  Build the tree in this order: first the questions, then the positions located in
  the space they carve out.


  Every node should be answerable without knowing where it leads. That rules out nodes
  like ''do you believe values are commensurable?'' — I want questions about concrete
  cases, or about claims a person would accept or reject, phrased so the labels stay
  hidden. For instance, a node might be: two housemates, one who will not have meat
  in the kitchen for ethical reasons and one who thinks there is nothing wrong with
  eating it — is their disagreement about which of the arrangements actually on the
  table is best, or about whether any arrangement they have thought of so far counts
  as a settlement at all? Another might be: a person who takes a well-paid job in
  order to give most of the money away — has she compromised her values, or has she
  simply found a better way of serving them? Each node should offer two or three answers,
  and I want to see, for at least a few of them, that the answers are genuinely open
  — that people I know would give different ones.


  The distinctions I care about most, because they are the ones that decide everything
  downstream:


  1. Whether the two sides can be ranked against each other at all — whether there
  is any answer to ''is this arrangement better or worse, all things considered?''
  — or whether each side''s good is the sort of thing that only makes sense from inside
  a life, so that the question of ranking is a mistake rather than a hard question.

  2. Whether the disagreement is about the ranking of options or about which options
  exist. Trade, as I understand it, lives entirely in the second case: the traders
  are not arguing about who is right, they are creating a new possibility, a package
  neither had before. If moral disagreement is only ever about ranking fixed options,
  there may be no room for trade at all, and ''compromise'' would mean something else
  — a split, a rotation, an alternation, or a capitulation.

  3. Whether what each side is offering up is the kind of thing that can be given
  away. In trade, what you hand over is yours to hand over. But some commitments seem
  to be things a person cannot waive — a limit they will not cross even to prevent
  something worse — and some are commitments that belong to them in particular, things
  they would not demand of a stranger, which might be tradeable in a way the limits
  are not. I want the tree to separate these, because I suspect most of the disagreement
  in my circle comes from people sliding between them.

  4. Who is at the table. Two individuals, one person negotiating with her own future
  self, two traditions, or a whole society. And whether the people affected by the
  agreement are the people making it: a deal between two of us that lands on a third
  party who never consented seems to me to be a different animal from a trade, and
  I would like that written into the branches rather than mentioned as a footnote.

  5. What has to be justified, and to whom. Does the agreement need to be defensible
  to each party in its own terms, or to an outside observer with no stake, or is it
  enough that neither party can improve on it?

  6. Whether the settlement has to be a single package, or can be spread across time
  — I do this your way now and you do it my way later — and whether spreading it changes
  its character.

  7. Whether a party can be paid off in its own currency. If one side''s concern is
  for animals and the other''s is for compatriots, can a gain on one ledger count
  as compensation for a loss on the other, or is that a category mistake dressed up
  as a deal?


  Then, once the questions are laid out, place the positions: seven to nine leaves,
  each with a plain-language name and one sentence on the commitment that sits most
  awkwardly with it — the thing a defender would have to swallow. I expect some of
  these will be: an agreement as mutual gain by each side''s own lights; splitting
  the difference; taking turns; the view that there is nothing to compromise because
  the two sides are not measuring the same thing; the view that one side''s concern
  simply outweighs the other''s, so talk of compromise is a distraction; the view
  that some commitments cannot be traded at all and the honest response is refusal;
  and the view that what looks like compromise is usually a change of heart in disguise,
  which is not a compromise but a conversion.


  Finally, two things I want done honestly rather than tidied away. First, list the
  combinations of answers that no position occupies, and for each say whether you
  think it is empty because it is incoherent, because it is unattractive, or merely
  because nobody has bothered to explore it — I would rather have the empty cells
  diagnosed than filled. Second, name any two positions your tree cannot tell apart,
  where someone answering the same way could land in either, and say what further
  question would be needed to separate them.


  Keep the whole thing to eight or ten nodes and seven to nine leaves. The audience
  is a room of adults with no philosophical training who are perfectly willing to
  argue, so plain words throughout, and no jargon that would need a glossary — if
  you must use a technical term, unpack it in the same sentence.


