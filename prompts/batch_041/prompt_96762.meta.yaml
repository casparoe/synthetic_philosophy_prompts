  Which domain combines best? The spandrels critique is a classic case where a popular
  summary gets things subtly wrong — Gould and Lewontin''s "spandrels" paper is often
  summarized as "not everything is an adaptation," but their deeper point was about
  the architectural metaphor, the distinction between adaptation and exaptation, the
  "Panglossian paradigm," the critique of atomization of traits and the adaptationist
  programme as a research strategy, plus the spandrels of San Marco analogy being
  misapplied (the biological "spandrel" is not the same as a non-adaptive byproduct
  necessarily — actually the critique includes the point that what looks like a spandrel
  could be... hmm). Common misreadings: people think G&L said "many traits are not
  adaptations," but their real target was the methodology — the failure to consider
  alternatives, the assumption of optimality, the "adaptive story" as unfalsifiable.
  Also, the spandrels analogy is often taken to be about byproducts, but G&L''s actual
  argument is subtler: the spandrels are necessary architectural byproducts of using
  domes on pendentives, and the point is that the byproduct is constrained by the
  structure; also they note that spandrels could themselves become adapted for use.
  Also there''s the famous conflation: "spandrel" as a term for a non-adapted trait
  vs. exaptation (Gould & Vrba 1982).


