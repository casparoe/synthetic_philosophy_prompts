  they were critics of the excesses, not of natural selection per se.

  3. "The spandrel is just any non-adaptive trait / a byproduct" — partially right,
  but the point of the metaphor is also about how a byproduct can be co-opted and
  how its appearance of design is deceptive. Also, spandrels are *necessary* byproducts
