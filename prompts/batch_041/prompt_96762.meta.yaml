  "The chapter''s summary of the 1979 paper runs like this. The basilica of San Marco
  in Venice has domes resting on arches, and the triangular spaces where a dome meets
  the arches it sits on are filled with mosaics. Those spaces were not built to hold
  mosaics; they exist because a dome has to be carried on arches, and the mosaics
  came afterward. Gould and Lewontin''s point is that most biological traits are like
  those spaces: not adaptations, but byproducts of other features, which biologists
  then mistake for design and explain with a selection story invented after the fact.
  They call this habit the Panglossian paradigm, after Voltaire''s character who insisted
  that everything in the best of all possible worlds happens for the best. The paper''s
  decisive contribution was to show that an adaptationist hypothesis cannot be tested:
  any inconvenient fact can be rescued by positing a trade-off or an unobserved benefit,
  so the programme is unfalsifiable. It follows that natural selection is not the
  main driver of evolution, and that the search for adaptive function in traits such
  as human language or morality is misguided; the organism is mostly shaped by developmental
  and structural constraint."


  Errors:

  1. "most biological traits are like those spaces: not adaptations, but byproducts"
  — overstatement; G&L''s target was a research programme/methodology, not the empirical
  claim that most traits are non-adaptive.

  2. "so the programme is unfalsifiable" — overstatement; they argued adaptationist
  hypotheses are often protected from refutation by rescue devices and that alternatives
  are not considered; not that adaptationist hypotheses are in principle untestable.
  Also the "decisive contribution" framing misplaces the paper''s contribution.

  3. "It follows that natural selection is not the main driver of evolution" — does
  not follow; G&L didn''t deny selection''s importance; they were structuralist critics
  of adaptationist excess. Also, showing that a programme is (allegedly) unfalsifiable
  wouldn''t show selection isn''t the main driver.

  4. "the search for adaptive function in traits such as human language or morality
  is misguided" — the paper does discuss the human brain, but the blanket claim about
  language/morality being off-limits overreaches; and "the organism is mostly shaped
  by developmental and structural constraint" is presented as a demonstrated alternative
  rather than a demand to consider alternatives.

  5. The spandrel concept is slightly off: the point isn''t merely "byproducts exist,"
  but that some features are necessary consequences of a structural solution (so their
  form and number are fixed by that solution), and that such features can later be
  co-opted for use — the popularizer''s "mosaics came afterward" actually drops the
  interesting part (that the byproduct can acquire a function and appear designed).
  Also, G&L explicitly warned against equating "byproduct" with "unimportant." Also
  the conflation with exaptation: "spandrel" and "exaptation" are not the same thing
