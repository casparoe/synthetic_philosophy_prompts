  Best fit for Anscombe: a targeting/ROE review — but Anscombe''s actual view is quite
  strict: she denies that double effect can be used to license obliteration bombing,
  and she thinks that the "side effect" maneuver is a corruption. Actually her view:
  intention is not a private interior state; what you intend is determined by what
  you''re doing, describable in terms of means/ends. So "I didn''t intend the civilians,
  they were a side effect" fails when the civilian deaths are the means by which the
  city is destroyed / when you''d do it anyway, or when the "side effect" is what
  makes the action effective. Her famous point: the man who practices withdrawal —
  the "accidental" outcome is a case of double effect only nominally; the practice
  shows what''s intended.


  So a procedure for a practitioner: a targeting review officer (or a legal adviser
  to a commander, or a member of a collateral-damage estimation cell) who has to decide
  whether a proposed strike''s civilian deaths are intended or merely foreseen. Anscombe''s
  contribution: don''t rely on avowed intentions; look at the description of the act,
  at whether the harm is a means, at whether the practice would be continued if the
  harm didn''t occur, at whether the "side effect" is what does the work, at whether
  the agent''s sincerity is doing all the labor.


  Also she thinks the whole "double effect" doctrine as commonly deployed is often
  a sham — used to "prevent any doubts about the obliteration bombing of a city."
  So the procedure should include an audit of when the double-effect exemption is
  being abused.


