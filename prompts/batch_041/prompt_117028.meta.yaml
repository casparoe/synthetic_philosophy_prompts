  Let me include Anscombe''s specific moves:

  - The act-description test: how would you describe what you''re doing, not in the
  euphemism but in the plainest terms — "killing these people," "destroying this city"
  — and is the harm contained in the means by which you achieve the end?

  - The "would you do it anyway" test: if the foreseen harm did not occur (civilians
  evacuated), would the action still achieve the end? If not — if the harm is what
  makes it work — it''s a means.

  - The practice test (the withdrawal analogy): if this kind of strike became your
  standing practice, does the "side effect" become the operating principle? Anscombe''s
  point that a practice of withdrawal shows the "accident" is not accidental.

  - The sincerity test is not enough: avowals of intention are cheap and self-serving;
  Anscombe''s realism about self-deception — people come to believe their own descriptions.

  - The "unconditional surrender" point: the end itself may be the problem — if the
  aim is unconditional surrender and killing civilians is what makes the enemy quit,
  then the killing is the means. So a test: is the harm doing the work of bringing
  about the end? If yes, intended in the relevant sense.

  - The stop condition: where the only thing standing between "yes" and "no" is an
  avowal of inner intention, the procedure should stop and hand it up, because that''s
  exactly the case Anscombe says can''t be settled by introspection.

  - What the procedure cannot do: it can''t tell you whether killing noncombatants
  is ever permitted; Anscombe''s own view is absolutist-ish (choosing to kill the
  innocent as a means is always murder), so the procedure will generate nos that the
  institution will find unusable; also can''t resolve proportionality, which is a
  separate matter and which Anscombe thinks is often a fig leaf.


  Also include the "sign-off" and time constraints, and the "answer you won''t like"
  case.


