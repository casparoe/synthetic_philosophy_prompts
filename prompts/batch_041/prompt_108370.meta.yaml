  Draft:


  I''m putting together the Q&A for a small online philosophy-of-medicine seminar
  series, and next month''s guest is a philosopher who''s spent about fifteen years
  arguing for a higher-brain (neocortical) criterion of death — roughly, that someone
  dies when they irreversibly lose the capacity for consciousness, so a patient in
  a persistent vegetative state on a ventilator is dead, while a patient with a dead
  brainstem but a working cortex is not. She''s also got a second, less popular claim
  that I''d like to draw out: she thinks this criterion actually rescues the dead
  donor rule instead of threatening it, and that the standard "irreversible" wording
  is a mistake that ought to be replaced by "permanent". I''ve drafted some questions
  but they''re soft, and I don''t want her just restating the book.


  Give me eight to ten questions, each with a follow-up keyed to the answer she''s
  most likely to give. I want at least one question each on:


  - the somatic-integration objection — the fact that bodies diagnosed brain-dead
  can go on maintaining temperature, healing wounds, fighting off infections and even
  carrying a pregnancy for months — and what she says to the claim that this shows
  the brain isn''t the organ that keeps an organism alive as a whole;

  - the fact that on her view a vegetative patient is dead while a locked-in patient
  (or someone in a minimally conscious state) is alive, and whether that line is sharp
  enough to carry the weight of life and death;

  - how you''d actually certify loss of the capacity for consciousness at the bedside
  — what test or observation would she accept, and what would she say to the worry
  that there isn''t one yet, so the criterion is unusable in practice;

  - the "permanent" vs "irreversible" distinction, and whether a definition of death
  should be hostage to the possibility that some future treatment restores cortical
  function;

  - whether she''s telling us what death *is* or what we should *do*, i.e. whether
  this is a conceptual claim about biology or a moral/policy proposal dressed up as
  one;

  - the transplantation angle — whether her view would change who can donate and when,
  and what she makes of the complaint that brain-death criteria are a rationalisation
  of organ procurement rather than a discovery about death;

  - the ontology — whether death is an event or a process, and if it''s a process,
  what makes any particular threshold non-arbitrary.


  Please make the questions turn on the content of the view rather than her biography
  or how she came to it, and please flag where the answers are genuinely contested
  among people who work on this — I don''t want a rundown that presents the higher-brain
  criterion as if it were the settled position, and I don''t want the disagreements
  smoothed over. Where something really is settled (say, that the 1981 US commission
  went the other way, or what the standard bedside tests for brainstem death are),
  it''s fine to say so plainly; where it isn''t, say who''s on which side and why.
  No reading lists or citations needed — I just need the questions.


