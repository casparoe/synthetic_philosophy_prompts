  the actual world (metaphysical/causal). Kratzer: indicatives restrict an epistemic
  modal, counterfactuals a "metaphysical" one; the difference is in the modal base,
  not in a special semantics for "if." Von Fintel: counterfactuals presuppose the
  falsity of the antecedent ("counterfactual presupposition") — but not indicatives.
