  Stoicism''s dichotomy of control desiderata:

  1. Must be exhaustive (every candidate falls on one side) and exclusive.

  2. Must classify the paradigm cases correctly: my opinions/assents; my impulses;
  my desires (up to us); my body, property, reputation, office (not up to us); other
  people''s actions; the past; the weather; whether I win; my own future deliberation;
  my emotions (are they up to us?).

  3. Must not collapse into triviality: if only "my present act of assent" is up to
  me, the list is nearly empty; if "whatever I can influence" counts, everything is
  in.

  4. Must be a fact about causation/dependence (metaphysical) or about attributability
  (normative)? Distinguish: "up to me" as counterfactual dependence vs. "attributable
  to me" vs. "my responsibility."

  5. Must support the therapeutic function: if I classify something as not up to me,
  my distress should abate — this requires that distress track the classification,
  which requires the further claim that distress comes from judgments about externals,
  which is itself a psychological thesis.

  6. Must be consistent with determinism/causal closure — the Stoics were compatibilists
  but their "up to us" is a compatibilist notion; a theory must say which.

  7. Must respect the distinction between what''s up to me and what''s merely "mine"
  (my body is mine but not up to me) — the "appropriation"/oikeiosis stuff.

  8. Must handle the "two-sided" cases: my health depends on my choices (diet, exercise)
  — so not purely out of my control.

  9. Must not license quietism: the Stoic says we should still act, play our role,
  prefer health; but if health is not up to me, why try? Answer: preferred indifferents
  + "the trying is up to me, the outcome isn''t." Desideratum: the theory must locate
  the effort inside the boundary and the outcome outside it — but then "up to me"
  must be defined so that my effort counts but its success doesn''t, which requires
  a theory of action individuation (is "my writing this sentence" up to me, or only
  "my trying to"?).

  10. Must be jointly satisfiable with the claim that virtue is the only good — i.e.,
  that all externals are indifferent. Tension: if externals are indifferent, why does
  the classification of them as "not up to me" matter? And is the dichotomy even needed,
  or does "indifferents" do the work?


