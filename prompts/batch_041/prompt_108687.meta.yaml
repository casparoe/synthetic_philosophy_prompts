  Desiderata list for a theory of disease/health:

  1. Get the clear cases right (both directions): heart failure, untreated diabetes
  = disease; teething, puberty, pregnancy, being left-handed, being an adolescent
  = not disease.

  2. Handle the historically contested cases: homosexuality, drapetomania, masturbation
  — explain why we now say these were never diseases rather than just that we changed
  the label. (This is the key one that makes normativism look bad if it can''t do
  it; naturalists claim they can.)

  3. Handle "harmless dysfunction": a biological malfunction that does no harm and
  calls for no treatment — e.g., an anatomical variant, a mild anomaly. Can a theory
  call it a disease without saying it should be treated?

  4. Handle "harmful non-dysfunction": grief, unwanted shortness, infertility? (contested),
  chronic pain syndromes? (fibromyalgia: contested whether there''s a dysfunction),
  ME/CFS, hysteria/conversion disorder, PTSD (a reaction to trauma — a normal response?
  PTSD as disorder). These are the psychiatric cases that pressure the naturalist.

  5. Handle risk states and predisease: hypertension, high cholesterol, osteopenia,
  genetic risk, "prediabetes."

  6. Handle the disease/illness distinction: what the doctor finds vs. what the patient
  feels; asymptomatic disease.

  7. Apply to nonhuman organisms: a theory that works for plants and animals, or say
  explicitly why not.

  8. Preserve the action-guiding role: disease justifies treatment, insurance, exemption
  from blame, etc. — but without collapsing into "whatever we want to treat." And
  don''t let "disease" become a mere statistical majority vs. minority.

  9. Respect the intuition that disease is a bad thing for the person (harm/welfare
  component) — while explaining why some dysfunctions are not bad.

  10. Respect the intuition that disease is objective/natural in some sense — medicine
  as a science, cross-cultural convergence (germ theory, malaria) — but without ignoring
  real cross-cultural variation (culture-bound syndromes, e.g. koro, susto, taijin
  kyofusho — hmm, may be risky? These are well-known; koro is in DSM. Fine, but maybe
  just say "culture-bound syndromes").

  11. Handle the "reference class"/statistical normality problem: nearsightedness
  is now typical in some populations; aging is universal; if disease = statistically
  atypical, then aging and nearsightedness stop being diseases as prevalence rises.
  Boorse''s response is to use age/sex reference classes and to define function as
  species-typical contribution to survival/reproduction, but then the "typical" is
  relative to the reference class you pick — the problem of arbitrary reference class
  (Boorse acknowledges, chooses "age and sex"). This is a great desideratum and it''s
  in the weeds without being obscure.

  12. The severity/threshold problem: where''s the line between a variation and a
  disease — continuous traits (blood pressure, height, intelligence). Any theory that
  must draw a sharp line at a continuous variable.

  13. Joint unsatisfiability: the big one — (a) disease is value-free dysfunction
  + (b) disease is a bad thing for you + (c) disease is what medicine should treat.
  Some naturalists (Boorse) deny (b) or say disease doesn''t entail harm, but "pathological"
  implies bad. And (c) can''t be derived from (a). So there''s a trilemma: naturalism
  + the claim that calling something a disease is a criticism/harm claim + that pathology
  grounds medical intervention. This is a genuinely known tension: "the naturalistic
  fallacy in medicine." Good.


  Also note that they should flag pairs that can''t be jointly satisfied.


