  I would be grateful if you would help me understand it. The passage, in my paraphrase,
  goes roughly as follows: Aristotle is distinguishing between the way different constitutions
  appoint to office. He says that it is agreed to be democratic to appoint by lot,
  and oligarchical to appoint by election; and he adds that a mixture of the two is
  characteristic of a polity or constitutional government. He then seems to suggest
  that the lot is democratic because it treats all citizens as equal, whereas election
  is oligarchical because it allows the better sort to be chosen. Yet he also criticises
  the democracies that use the lot for offices requiring expertise, and he seems to
  think that a well-constructed constitution will use election for some offices and
  the lot for others. What I cannot understand is how these claims hang together.
  If the lot is democratic because it embodies equality, and election is oligarchical
  because it discriminates, then why would a good constitution mix them rather than
  simply choose the one that is just? Is Aristotle making a claim about justice, or
  about stability, or about the division of labour among institutions?


  I am asking this not only as a historical question. I have been working out a proposal
  of my own for a lottocratic assembly, and I want to know whether Aristotle''s passage
  helps or hinders it. My proposal is a two-stage body: first, a large pool is selected
  by lot from the citizen body; second, the members of that pool elect from among
  themselves a smaller steering committee and a chair. The idea is to combine the
  equalising effect of the lot with a filter for competence and deliberative skill.
  I had thought this was a straightforward way to get the best of both worlds. But
  reading Aristotle makes me wonder whether the two devices are not merely different
  selection mechanisms but different principles of legitimacy, and whether combining
  them produces a coherent principle or merely a compromise that will be unstable.
  I would like you to do two things. First, explain the passage and the distinction
  between lot and election as Aristotle uses it, including what you take to be the
  strongest reading of his position and the main interpretive difficulties. Second,
  evaluate my two-stage proposal in the light of that reading: does it capture anything
  like Aristotle''s mixed constitution, or does it conflate two incompatible ideas?
  Be explicit about how confident you are in your interpretation, and single out the
  point in your answer about which you are least sure. Please avoid recommending secondary
  literature or giving me a reading list; I am after the argument, not the bibliography."


