  ''The presumption of independence is the formal rule that, when you are uncertain
  about how two variables are related, you should assume they are independent. This
  is because independence is the only assumption that adds no information beyond the
  marginal probabilities, so it is the maximally noncommittal default. Formalizing
  it just means applying the principle of indifference to the joint distribution:
  since you have no reason to think one variable affects the other, you assign the
  product of the marginals. The result is a theorem: if you don''t know the true joint
  distribution, the independence assumption is guaranteed to be at least as accurate
  as any alternative, which is why heuristic arguments that presume independence are
  deductively valid. The only caveat is that you have to be careful not to presume
  independence when the variables are actually correlated, but that''s just a matter
  of checking the data.''


