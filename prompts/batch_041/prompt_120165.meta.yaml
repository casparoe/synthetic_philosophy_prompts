  The book/article (unnamed) summary — let''s draft:


  "It was a chapter in a popular philosophy-of-science book. Roughly: ''Quine''s Two
  Dogmas of Empiricism was the death blow to the analytic-synthetic distinction. Kant
  had claimed some truths are true by their meanings alone while others are true because
  of how the world is; Quine showed there''s no such thing, because of holism. Since
  no statement is ever tested against experience on its own, nothing is ever true
  just by virtue of meaning, so the distinction collapses. Quine''s alternative is
  that our beliefs form a single seamless web with no joints, in which every statement
  is equally revisable, and the only reasons to keep one belief rather than another
  are pragmatic ones -- convenience and simplicity. That''s why he says even the laws
  of logic are up for grabs: the essay''s example is that we might abandon the law
  of excluded middle to simplify quantum mechanics, and by the same token there''s
  nothing special about mathematics -- it''s just a myth we find useful, no different
  in kind from Homer''s gods.''"


  Errors / distortions:

  1. "Kant had claimed..." — the target of the essay is the logical empiricists (Carnap/Vienna
  Circle) and their version of analyticity; Kant''s distinction is different (truths
  by containment / independent of experience in a different sense). Attributing the
  target to Kant is a slide. Also "death blow" / "showed there''s no such thing" overstates:
  Quine argued the notion as the empiricists used it was unexplicated and that the
  key accounts (via synonymy, via semantical rules, via meaning postulates) fail;
  he didn''t offer a proof that no analytic truths exist. Also Quine himself was willing
  to grant a behaviorist reconstruction of "analytic" as a matter of degree (stimulus-analyticity)
  — he doesn''t say the distinction is meaningless.

  2. Holism → "nothing is ever true just by virtue of meaning": this is the crux.
  Even granting holism about confirmation, it doesn''t follow that analyticity (truth
  in virtue of meaning) is impossible; holism is an epistemological/confirmation thesis,
  analyticity is a semantic one. Quine''s own route is via the "circle" (synonymy
  and analyticity defined in terms of each other) and the failure of the verificationist
  reconstruction. So the book presents a non sequitur as Quine''s argument. Also the
  book conflates the two dogmas: Quine''s claim that they''re "at root identical"
  is a specific claim about the verification theory of meaning presupposing reductionism,
  not "they are literally the same thesis."

  3. "single seamless web with no joints, every statement equally revisable" — Quine
  explicitly denies this: the web has a center and periphery, with a gradient of entrenchment;
  logical laws are central and revised only under drastic pressure; observational
  reports are peripheral. So the book flattens a distinction of degree into no distinction.
  Also "no joints" misstates "no statement is immune to revision" (which is about
  possibility of revision, not about equal revisability).

  4. "no different in kind from Homer''s gods" — the essay does compare physical objects
  to Homer''s gods as "irreducible posits," but the point is epistemic/confirmational
  (both are posits introduced to make sense of experience), not that mathematics is
  arbitrary or on a par with myth in every respect; and the book''s inference "just
  a myth we find useful" drops the pragmatic constraints (conservatism, simplicity,
  explanatory power) and misreads a comparison of epistemic status as a claim of equal
  value/arbitrariness. Hmm — Quine does say "physical objects... are... irreducible
  posits comparable, epistemologically, to the gods of Homer" and "myth" is used in
  a technical sense. The book''s error: treating the "myth" remark as a debunking
  rather than a point about the underdetermination of theory by experience.

  5. "the only reasons to keep one belief rather than another are pragmatic" — partly
  right (Quine is a pragmatist about revision), but "the only reasons" overstates
  and mischaracterizes: Quine''s norms are conservatism, simplicity, and the maxim
  of minimum mutilation; these are pragmatic in a broad sense but the book''s framing
  ("anything goes," no epistemic constraint) is wrong. Also Quine famously says "the
  pragmatic" and "the pragmatic standard" — hmm, need care. Quine''s "Two Dogmas"
  ends with a pragmatist note: "Each man is given a scientific heritage plus a continuing
  barrage of sensory stimulation; and the considerations which guide him in warping
  his scientific heritage to fit his continuing sensory promptings are, where rational,
  pragmatic." Something like that — I shouldn''t quote. Paraphrase.

  6. Also possible error: the book''s implication that Quine thereby refutes the a
  priori / that there are no necessary truths. Conflating analyticity with necessity,
  and Quine''s semantic skepticism with a metaphysical anti-necessitarianism (he''s
  skeptical of de re modality too but for separate reasons, and ''Two Dogmas'' is
  about analyticity, not modality — the modal skepticism comes later, in "Reference
  and Modality" / "Three Grades of Modal Involvement"). Nice subtle error to include:
  attributing to "Two Dogmas" a thesis about necessity that belongs elsewhere.


