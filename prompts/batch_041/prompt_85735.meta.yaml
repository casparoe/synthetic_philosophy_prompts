  "I am a software engineer with no formal background in philosophy, and I am trying
  to get clear on the problem of consequentialist cluelessness before I read any more
  proposed solutions to it. What I want from you is not a survey or a theory but the
  specification: the list of requirements that any theory of how a consequentialist
  should act under cluelessness would have to meet to be adequate for my purposes.


  My purposes, since adequacy is relative to them: I want a theory usable by an agent
  who has to commit to an action now, with bounded time and compute, and who wants
  to keep the consequentialist commitment that only consequences count, without either
  being paralyzed or being credulous about effects nobody could have traced. Treat
  that as the brief; if you think it is the wrong brief, say why in one or two sentences
  and then proceed with it.


  For each requirement, give me the case or consideration that generates it — the
  situation that shows a theory failing it — rather than the abstract label. Then
  mark each one as non-negotiable or as a preference of a particular camp, and tell
  me which ones you think cannot all be satisfied at once. That last part is what
  I most want; if the specification turns out to be unsatisfiable as stated, the specification
  is the result.


  Here are the requirements I have come up with on my own, which you should correct,
  sharpen, or throw out as you see fit:


  - ... [list]


  ..."


  Let me write the requirements in the asker''s own voice, but noting they may be
  wrong. I''ll write them as bullets.


  Bullets:

  1. Cluelessness must be located. A theory has to say where the trouble sits — in
  our information about the causal upshots, in the value function applied to them,
  in how the act itself is individuated, or in the summation over an unbounded future
  — because the fix differs in each case. Case: a theory that treats all four as one
  problem will prescribe more information when the real problem is that the quantity
  being estimated is not well-defined.

  2. The verdict must survive re-description. Same act at different levels of abstraction
  — one coffee purchase, one motion of a hand, one more unit of participation in a
  global supply chain — should not receive incompatible verdicts, or the theory must
  say which description is canonical and why. Case: an engineer''s experience that
  behavior can flip when you refactor the interface without changing the implementation.
  Also: a decision procedure whose output depends on which description you fed it
  is not a decision procedure.

  3. The verdict must not be dominated by terms we cannot estimate, and must not be
  insensitive to them either. Case: small probabilities of enormous effects, and the
  mirror-image case of a certainty of a small effect swamped by an unestimated large
  one. If a theory can be moved to any conclusion by positing an arbitrarily unlikely
  arbitrarily large effect, it is not usable; if it ignores such effects by construction,
  it has given up on consequences.

  4. There must be a principled stopping rule or a demonstration that no stopping
  rule is needed. Case: evaluation over an unbounded future; if the sum diverges or
  is undefined, maximize-expected-value is not a well-formed instruction.

  5. Cluelessness of the theory must be distinguished from cluelessness of the agent.
  A theory that ranks options is not shown to be clueless by the fact that I cannot
  compute the ranking; the interesting claim is that the ranking itself is unsettled,
  and the requirements should be stated about the theory''s output, not my epistemic
  state.

  6. The theory must be implementable by a bounded agent — terminate, in effect. Case:
  a criterion that is only satisfiable by an ideal agent with infinite compute is
  not a standard for me; and a theory that says "act only if the verdict is determinate"
  hands all the work to a meta-procedure it hasn''t supplied.

  7. It must retain consequentialism''s critical bite. Case: a theory that resolves
  cluelessness by declaring that any act is as good as any other, or by deferring
  to common-sense morality, has stopped being a consequentialist theory; a theory
  of cluelessness should tell me which actions are ruled out and why.

  8. It must handle the fact that its own influence is among the consequences. Case:
  choosing what to teach a junior colleague, or releasing a widely-used library, changes
  what future agents count as a consequence and how they weigh them; the evaluation
  must not be ill-founded when it is one of the things being evaluated.

  9. It should tell me what to do differently, not just what is true. Case: two theories
  that agree that the future is unknowable but disagree about whether I should give
  more weight to near-term, well-understood effects, or to the far future, are not
  the same theory; I want the requirement that pins down which.


