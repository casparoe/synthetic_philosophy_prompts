  confidence / ranking whose sign is unstable. Actually: (1) the theory fails to rank;
  (2) it ranks but with no justified confidence; (3) it ranks and even the sign flips
  under re-description.

  (b) Act-individuation invariance: verdicts must not depend on the level of abstraction
  at which the act is described (refactoring invariance). Case: "buying a coffee"
  vs. "moving a hand" vs. "participating in a global supply chain".

  (c) Closure under self-application: some consequences of my act are consequences
  for what future agents will count as a consequence — the theory must not be ill-founded
  when its own verdicts are among the effects it''s evaluating. Case: choosing to
  raise a child or write widely-used software that shapes how the next generation
  evaluates.

  (d) Tail robustness vs. tail sensitivity: verdicts must not be dominated by terms
  whose magnitudes are unestimable — but must also not be insensitive to them (fanaticism
  vs. paralysis).

  (e) Horizon: the theory must either specify a principled truncation or explain how
  an infinite/unbounded evaluation converges.

  (f) It must be implementable: a bounded agent must be able to run it (decidability/termination
  analog).

  (g) It must preserve consequentialism''s critical bite — it must be able to condemn
  things (non-vacuity): if the answer is "any action is permissible because we can''t
  know", it''s failed.

