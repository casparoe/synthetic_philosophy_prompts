  Some background, since the details are what make the case awkward. The resource
  is the standing willingness of members to read one another''s contributions charitably
  and to extend the benefit of the doubt when a claim is underspecified. It is non-excludable
  (I cannot reserve charitable reading for the members who replenish it) and it is
  not consumed by any single use: each draw is imperceptible, and the harm appears
  only in aggregate. It is also, as far as I can tell, unobservable from the inside.
  Depletion does not show up as rudeness; people go on writing in the same courteous
  register while the reserve empties, and the first unambiguous signal is that a certain
  kind of member quietly stops posting. By the time the signal arrives, the thing
  it signals is already gone.


  There is a second feature I find more interesting than the first. The obvious institutional
  remedies — stating the norm explicitly, monitoring who is drawing on it, sanctioning
  the members who draw too hard, appointing someone to keep the ledger — all require
  making the resource legible. But a charitable reading that has been made a matter
  of explicit policy stops being charity; it becomes a service that members can demand
  and resent, and the announcement that we are tracking who supplies it converts an
  uncalculated kindness into a trade. So the standard machinery for managing a commons
  may itself be a large draw on this one.


