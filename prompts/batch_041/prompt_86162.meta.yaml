  5. The asymmetry: precommitment requires that the pre-committing self be in a privileged
  epistemic position, which is often false.

  6. Constitutional application: entrenchment, amendment difficulty, counter-majoritarian
  difficulty, the "generation" problem (Jefferson''s "the earth belongs to the living").


