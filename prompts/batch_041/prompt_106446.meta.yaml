  how we treat checklists. In aviation, the sterile cockpit rule forbids nonessential
  conversation during taxi, takeoff, and landing, and pilots are required to call
  out certain speeds and altitudes; in surgery, teams now run a verbal safety checklist
  before incision, and nurses are expected to speak up if a step is skipped. When
  a checklist is well designed and the team follows it, we treat it as part of the
  operator''s competence: we say the pilot or the surgeon was thinking with the checklist,
  and we train people to rely on it rather than on memory. But when something goes
  wrong, the explanation often shifts. If the checklist was ambiguous or badly placed,
  investigators blame the design or the institution; if the operator skipped a step,
  they blame the individual. The flight recorder, by contrast, is never treated as
  part of anyone''s mind; it is just evidence. I want to know what philosophical commitments
  this whole practice presupposes.


  Does it presuppose the extended mind thesis, or only a weaker claim about distributed
