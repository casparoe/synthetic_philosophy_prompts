  Prompt draft:


  "Write a dialogue between two historical sociologists who are jointly examining
  a single comparative case and disagree about whether the culture of a community
  can figure in a causal explanation of its economic development, or whether talk
  of culture is at best a placeholder for interests and institutions that a completed
  explanation would cite instead.


  The case they are both looking at is a pair of small nineteenth-century towns —
  let us call them Brückenthal and Neudorf — that were, by every material measure
  their historians can reconstruct, near-twins: comparable soils, comparable access
  to the same river trade, comparable populations, comparable legal status within
  the same principality. They diverged sharply: within two generations Brückenthal
  had accumulated capital, built a savings bank and a machine-works, and developed
  a dense web of voluntary associations, while Neudorf remained a subsistence economy
  with little capital formation. The one salient difference the records show is religious:
  Brückenthal''s leading families belonged to a Calvinist-influenced congregation
  that read worldly success as a sign of election, whereas Neudorf''s belonged to
  a quietist sect that treated worldly striving as a distraction from salvation. Neither
  sociologist disputes that the correlation is real; they dispute what it is evidence
  for.


  The first sociologist holds that the difference in religious outlook is doing genuine
  causal work, and that no complete account of the divergence can leave it out. The
  second holds that the outlook itself stands in need of explanation in terms of the
  towns'' prior institutions and material circumstances, and that once those are specified
  the religious variable drops out as a cause. They should each press the other hard:
  the first must say what it would even mean for a value-orientation to be a cause
  and how it could be distinguished from a mere correlate; the second must answer
  whether, by his own standards, any appeal to culture could ever survive, and whether
  his preferred explanation does not smuggle in a value-orientation of its own (for
  instance, in treating the pursuit of material interest as the default that needs
  no explanation).


  Both should be equally sharp, and each should answer the other''s actual argument
  rather than restating a position. Let them converge on at least one point of genuine
  agreement and remain divided on at least one, and let the disagreement at the end
  be sharper and better located than it was at the start. No citations are needed;
  refer to arguments and positions rather than to named works."


