  Option A: Type 1 + Kalai–Smorodinsky. Kalai-Smorodinsky is a bargaining solution:
  for two-person bargaining problems, it picks the point on the Pareto frontier proportional
  to the "ideal" (utopia) points, i.e., maximal utility each player could get. It''s
  characterized by axioms: weak Pareto optimality, symmetry, scale invariance, and
  "individual monotonicity" (restricted monotonicity — expanding the feasible set
  in a way that raises one player''s ideal point must not hurt them). Contrast with
  Nash: Nash is IIA + symmetry + scale invariance + Pareto. The classic criticism:
  Kalai-Smorodinsky violates IIA (independence of irrelevant alternatives). Also there''s
  the "Nash program," the Roth characterization, and issues: KS isn''t defined for
  n>2 in a natural way — there are multiple generalizations (e.g., the "proportional"
  / "egalitarian" solutions, the "lexicographic" and the "raised-ideal" generalizations).
  There''s work by Imai, Thomson, Chun, Peters, Herrero. Also the connection to the
  "monotonicity" literature: Nash violates individual monotonicity (the "Nash is not
  monotone" — actually Nash satisfies IIA but violates individual monotonicity in
  the sense that enlarging the feasible set can hurt a player). Hmm, careful: Nash
  solution satisfies IIA but violates "strong monotonicity"? Let''s recall: Nash violates
  individual monotonicity; KS satisfies individual monotonicity but violates IIA.
