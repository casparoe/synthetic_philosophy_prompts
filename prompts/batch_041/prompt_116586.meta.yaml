  I need help prepping for a talk and it''s kind of a weird personal situation. Background:
  I''m a dad of two (one just started secondary school), and after a couple of years
  of just grumbling at the school gates I somehow got myself voted onto our school''s
  curriculum review committee this spring. While I was reading up for it I fell down
  a Whitehead hole — the little book of his lectures on education, the one where he
  lays out the three stages he thinks learning actually moves through: romance, then
  precision, then generalization. And I''ve come out the other side genuinely convinced
  our school has it upside down. We lead with precision — drills, worksheets, practice
  papers — before the kids have any romance at all, and then we never really get to
  generalization because they''re fried by year 9.


  So at next month''s meeting I get twenty minutes to make the case that we should
  restructure years 7 and 8 around his rhythm: give every big topic a real romance
  stage first (mess, curiosity, no marks), introduce precision only once they care,
