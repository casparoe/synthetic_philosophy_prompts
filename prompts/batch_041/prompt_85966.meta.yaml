  a preference ordering is not a belief about anything; it simply is what the agent
  wants, and there is no gap between the agent''s preferences and the facts that could
  open up room for error. An agent can be wrong about the world, and it can be wrong
  about which actions will satisfy its preferences, but it cannot be wrong about its
  preferences in the way it can be wrong about the capital of Australia. If that is
  right, then "uncertainty about one''s own values" is either incoherent or a label
  for something else, and I want to know which.


