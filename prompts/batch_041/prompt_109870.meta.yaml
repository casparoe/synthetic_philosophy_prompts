  "I''m in a reading group that''s been going through the Dutch book literature and
  I''m trying to turn my notes into a short essay, and I''d really like your comments
  before I inflict it on anyone else. The gist: I think the standard Dutch book argument
  against an agent whose prices for A and for not-A sum to more than one quietly assumes
  that the agent is a price-taker with a fixed price list, i.e. that their willingness
  to sell a bet on A at 3:2 and a bet on not-A at 3:2 doesn''t depend on the fact
  that these two offers are being made together. Drop that and the argument loses
  its teeth: an agent can have 0.6 for A and 0.6 for not-A, sell you either bet on
  its own, and simply decline the pair, and there''s no sequence of trades that drains
  their wallet. So the sure-loss result is really a theorem about static price lists,
  not about credences, and the rationality of the price-list idealization is doing
  more work than the literature usually admits.


  Then the repair I try: drop betting talk and compare preferences over gambles directly,
  where a gamble pays a fixed prize on A and nothing otherwise, and take it as a requirement
  of rationality that the agent prefers a sure prize to the pair of gambles that costs
  more than that prize. This gets you a dominance argument with no bookie and no price
  list, which is nice, but I''m worried it isn''t cheap: it seems to need preferences
  to be complete and to satisfy something like the independence condition, which is
  alot to assume about an agent who might just be indifferent or who has non-linear
  attitudes toward the prizes. My tentative conclusion is that the argument is either
  modest and only applies to price-takers, or general and no longer modest. A friend
  says the second horn is fine because you can get away with just transitivity plus
  dominance, but I don''t see how.


  Comments please, and be blunt. I''m most interested in (a) whether the price-taker
  point is really a distinct objection or just the old complaint that betting behavior
  isn''t credence in disguise, (b) whether the preference-based repair does smuggle
  in more than dominance and transitivity, and (c) whether there''s an obvious way
  to Dutch book someone whose prices depend on what else is on offer, e.g. by offering
  the bets seperately or wrapping them in a single package the agent can''t unbundle.
