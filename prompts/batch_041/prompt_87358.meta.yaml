  I''m a third-year PhD student in STS and I''m stuck on the second chapter of my
  thesis, which is about the politics of everyday workplace tech. I need you to build
  me one thought experiment, and I need it to be good enough to survive a hostile
  question in a viva.


  The thing I''m trying to pin down. Everyone in this literature fights over whether
  an artifact can be political in itself or whether the politics always comes from
  the people and institutions around it — the Winner line versus the tools-are-neutral
  line. I think that whole framing is a dead end and the real fault line is somewhere
  else: switch costs, or better, who gets to undo. Some artifacts leave their effects
  revisable by anyone (you just do something else, no new kit, nobody''s permission
  needed). Others entrench an effect so that reversing it requires replacing the thing,
  or requires the consent of the people the effect benefits. My half-formed claim:
  the second kind is political in a way the first isn''t, and that this is a fact
  about the artifact rather than about the surrounding society. But I can''t tell
  if that''s a real distinction or if I''ve just rediscribed path dependence with
  a nicer name.


  So: construct a case that tests it. Specs.


  - Two artifacts, A and B, both entirely realistic in a workplace (office, hospital
  ward, school — no sci-fi, no historical cases, so nothing with bridges or reapers
  or panopticons, I''m sick of those).

  - A and B must have the same behavioural effect on the same population. Same people,
  same norms, same law, same budget, same managers — I want everything held fixed
  except the two pieces of kit.

  - Neither was designed to exclude or to entrench anything. No villains, no racist
  architects.

  - The difference between them has to be in how the effect gets undone: with A the
  effect evaporates the moment people change what they do, with B it survives until
  the artifact is replaced or reconfigured, and the people who''d have to agree to
  that are the ones currently benefiting from the effect. The artifact should encode
  that veto, not just happen to sit next to it.


