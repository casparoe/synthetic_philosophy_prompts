  Moloch / multipolar traps: Scott Alexander''s essay "Meditations on Moloch" (2014)
  on Slate Star Codex. The name comes from Ginsberg''s poem "Howl" ("Moloch! Solitude!
  Filth! Ugliness! Ashcans and unobtainable dollars!..."). The idea: many individually
  rational actors each doing the locally best thing produce a collectively terrible
  outcome that no one wanted and no one can unilaterally escape. Examples: the tragedy
  of the commons, arms races, price competition, the Malthusian trap, the "fish race
  to the bottom," regulatory races, etc.


  Nick Bostrom: "multipolar" scenario in Superintelligence — a singleton vs multipolar
  outcome. Also the "unilateralist''s curse" (Bostrom, Douglas, Sandberg). The "race
  to the bottom" in AI.


  Prisoner''s dilemma: two players, each better off defecting regardless of the other,
  but mutual cooperation Pareto-dominates mutual defection. Key structural features:
  2 players, symmetric, one-shot, fixed payoffs, dominant strategy, no externalities
  to third parties.


  Tragedy of the commons (Hardin, 1968, "The Tragedy of the Commons" in Science):
  n players, a shared resource, each adding a cow benefits the individual fully but
  costs the group fractionally, leading to overgrazing. Differs from PD in n and in
  the continuous action space.


  Elinor Ostrom: showed commons can be governed without privatization or top-down
  state control — "Governing the Commons" (1990), design principles. She won the Nobel
  in 2009. Her work is a critique of the "only two solutions" framing. Good, well
  known enough.


  Multipolar trap features that break the PD mapping:

  - n > 2 (many players), often unbounded and changing

  - Not a single "defect/cooperate" binary; action space continuous

  - Payoffs not fixed but endogenous — the value of the prize changes as the race
  proceeds (e.g., in an arms race, the marginal value of more weapons depends on others'')

  - No defection per se: often cooperation isn''t a coherent option; there''s no one
  to make a deal with, no enforceable agreement, no moment of choice. The "trap" is
  that the equilibrium is a *result*, not a *choice*.

  - The relevant alternative often isn''t "cooperate" but "exit" or "change the game"
  — and exit is often impossible (you can''t opt out of a competitive market and survive).

  - Reflexivity: what counts as cooperation is contested; players may not even agree
  on the outcome being bad.

  - The disanalogy: PD has a well-defined cooperative solution (mutual cooperation)
  that both players prefer; multipolar traps often have *no* jointly preferred alternative
  available — the "cooperate" cell is empty or unstable. This is the crux: PD implies
  the problem is a coordination/commitment problem with a known solution; Moloch implies
  sometimes there is no feasible better outcome at all, and the trap is structural,
  not strategic.

  - PD is symmetric between players; races to the bottom can be asymmetric, with some
  players having much more to gain.

  - In PD, defection is a deliberate choice; in a race to the bottom, "defecting"
  is just... doing your job / competing normally. The moral texture differs — nobody
  is being a defector.


  The conclusion it licenses: "so we just need cooperation / a treaty / tit-for-tat
  / a regulator" — i.e., the trap is solvable by the players, and failure to solve
  it is a failure of will or coordination. Once the disanalogies are in, the conclusion
  weakens: if there''s no feasible jointly-preferred outcome and no exit, then "just
  cooperate" is not available, and you may need an external binding force (a singleton,
  a leviathan, a change in the game''s payoff structure) that no player can unilaterally
  install.


