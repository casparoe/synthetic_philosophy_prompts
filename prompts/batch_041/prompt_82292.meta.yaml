  she said morality doesn''t apply in emergencies, one may act to save one''s own
  life.

  - Rand''s view of love: "to say ''I love you'' one must first know how to say the
  word ''I''." Love as response to value.

  - Rand''s rejection of the "duty" ethics; the "emergency" exception; her essay "The
  Ethics of Emergencies."

