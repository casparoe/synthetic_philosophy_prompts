  Nietzsche "diet" questions (Ernährung) are about the conditions under which a particular
  type — a particular person''s strength — can flourish, and his own prescriptions
  are explicitly offered as the report of an experiment on himself, not as law. Also,
  "health" for Nietzsche is not the absence of illness but the ability to incorporate
  and command one''s accidents, including illness; so his praise of sickness as a
  stimulus is not a contradiction but an extension of the same idea. And his sweeping
