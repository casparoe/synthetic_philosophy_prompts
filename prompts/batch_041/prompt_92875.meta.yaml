  Moves:

  (1) Dana: The whole diet business is either vacuous or a contradiction. He tells
  us health is individual — what''s poison for one is medicine for another — yet he
  issues flat bans and prescriptions: no alcohol, light meals, no heavy German food,
  walk, don''t sit still, pick your climate. You can''t have both.

  (2) Marcus: He''s not legislating. He explicitly frames his own regimen as the record
  of an experiment on himself, a case he knows better than anyone. And his real thesis
  isn''t "eat this" — it''s that what moralists treat as questions of will, virtue
  and sin are really questions of regimen, physiology, climate, company. That''s a
  substantive claim about where the causes of our "spiritual" states actually lie,
  and it''s falsifiable.

  (3) Dana: Then it''s worse than contradictory — it''s unfalsifiable. Every time
  a prescription looks universal, you re-read it as indexical. And notice he does
  the opposite of individualizing when it suits him: he talks about these things as
  fate, as inherited, as something settled before you get a say. You can''t be a radical
  individualist about diet and a determinist about diet at the same time.

  (4) Marcus: Those aren''t in tension if you think of the individual as a type rather
  than a unique snowflake — a constitution with a history. And the "fate" talk is
  a claim about how much of our thinking is downstream of the body, not a claim that
  you can''t experiment. His point is that the experiment has to be run on yourself
  because the relevant variable is your particular constitution; a general dietetics
  would be exactly the thing he''s denying exists.

