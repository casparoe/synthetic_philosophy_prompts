  I recently sat on a mass-casualty triage panel where we had to choose between a
  plan that would predictably save more lives and a plan that would give each identified
  patient a fair chance, and I have not been able to stop thinking about it. Please
  act as a philosopher of ethics and decision theory with expertise in the debate
  over whether numbers count, and help me draft the joint statement that a committed
  Taurekian and a committed aggregator could both sign after a genuine adversarial
  collaboration. Begin with a short private brainstorm of the candidate common ground
  and the possible verbal disputes, then produce the document itself: a numbered agreed-claims
  section followed by a disagreements table. The agreed claims should cover what each
  side can accept about the moral status of persons, the separateness of persons,
  the significance of averted deaths, and the legitimacy of using lotteries or weighted
  lotteries in rescue cases. The table should state each remaining disagreement in
  wording that the side holding it would accept, identify the cruxes, and for each
  crux give a concrete case or argument that both sides agree bears on it, with each
  side''s prediction recorded in advance. To keep this from becoming a rehearsal of
  familiar examples, build the statement around a case I will call the Split Ward:
  a fixed rescue budget can either save 100 people who, without rescue, will each
  live another 20 years in full health, or save 101 people who will each live another
  19 years and 11 months; the 101 include one person whom the 100 would otherwise
  have to sacrifice deliberately. Both sides should say whether the numbers count
  here and why, and whether the answer changes if the 101st person is a stranger versus
  someone the rescue team has already promised to save. If you find that some part
  of the dispute is merely verbal, say which part and why; if some crux cannot be
  tested even in principle, say so rather than inventing evidence.


