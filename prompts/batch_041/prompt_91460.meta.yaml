  Design more concretely:


  Session: upper-level seminar on Leibniz, 16 students, 75 min. Title: "The Bureau
  of Compossibility."


  Structure:

  1. (10 min) Setup: Students are a committee of "world-designers." They get a deck
  of cards, each describing a good and its price/constraints. Materials: index cards.

  2. Two phases: Phase A — free design. Each group of four proposes the best world
  they can, no constraints except: worlds are compared by how good they are. They
  will produce a list of goods.

  3. Phase B — compossibility: The facilitator reveals that the cards have hidden
  incompatibility relations (like a constraint-satisfaction problem). Some goods can''t
  coexist (a card''s good requires another card''s evil; or two goods are mutually
  exclusive). Groups must produce a maximal set of compatible cards — the "compossible"
  set — and defend that it''s the best compossible world. Key: no two different compossible
  sets can both be... hmm, we want a unique best? Actually Leibniz''s claim: God compares
  all possible worlds and picks the best. In the activity, the constraint structure
  should ensure there''s a unique maximal-by-score set. Then participants discover
  they cannot "have it all": the best world is not the world with everything good,
  and it must contain some evils.

  4. Phase C — the vote: the twist. Every group''s best world contains at least one
  specific evil card, and the facilitator has arranged that all the participants personally
  appear in every world as one of the characters subject to that evil. Wait — better
  twist: the deck includes a card that says "your own suffering of kind X" and the
  participants must decide whether the world containing it is better than the alternative.
  Then the "contentment" / "amor fati" bit: Leibniz says loving God requires not merely
  resignation but active joy in the whole, including one''s own place in it. So the
  last stage: each participant must say, of the best world they helped build, whether
  they can affirm it as good even though it contains their own suffering — and the
  rule is they must not appeal to compensation in an afterlife (Leibniz''s theodicy
  does appeal to compensation, but the point of the constraint is to isolate "acquiescence
  in the present").

  5. Debrief mapping: (a) "principle of the best": if there is a best, the wise will
  is not free to choose worse — this is Leibniz''s "moral necessity," and it''s what
  makes his God not an arbitrary sovereign. (b) Compossibility: the "possible" is
  not the "conceivable"; what the best world must leave out. (c) The cost: participants
  will feel that the argument from "there''s a best" to "God chooses it" to "therefore
  the evil is justified" licenses the actual evils they care about. And Leibniz''s
  own move: the best world isn''t the happiest, it''s the most perfect (variety plus
