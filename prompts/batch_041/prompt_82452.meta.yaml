  Draft:


  ---


  Dennett''s puzzle about the brain in the vat — the brain kept alive in one city
  and wired by radio link to its body in another — is usually read as a lesson about
  the elusiveness of the question "where am I?" I want an essay on a variant of that
  puzzle that I think is harder, and I want a verdict rather than a survey.


  The variant, which I''ll call the Relay:


  A subject, call her R, is put under anaesthesia. A procedure reads out the complete
  functional state of her brain and writes it into a synthetic substrate, which is
  then activated. R''s biological brain is meanwhile held in a metabolically suspended,
  unconscious state. For the next year the synthetic substrate runs the whole of R''s
  mental life: it thinks, remembers, plans, and is convinced it is R. At the end of
  the year the process is reversed: the substrate''s current functional state is written
  back into the biological brain, the substrate is dismantled, and R wakes up. This
  cycle — read out, run on a synthetic substrate, write back, dismantle — is repeated,
  with successive substrates, for a decade. Each transfer preserves the functional
  organisation of the moment; no substrate ever runs twice.


  Now add the overlap. On one of these occasions the synthetic substrate is switched
  on before the biological brain is suspended, and for a period of twenty minutes
  the two are live at once and in continuous two-way communication, so that each is
  continuously receiving and being modified by the other''s states. Both behave as
  R; both sincerely claim to be R; both remember the same life. During the overlap
  the two are then separated and each continues independently for a year, after which
  the biological body is destroyed. Vary the round-trip delay in the coupling: a few
  milliseconds, 400 milliseconds, four seconds.


  The controversy I want you to adjudicate:


  1. Does R survive the Relay? Does the R who wakes up after each write-back stand
  in the same relation to the R who went under as the R of an ordinary uninterrupted
  year?

  2. During the overlap, is there one person or two? If two, then which of them (if
  either) is the R who entered the procedure, and does the answer change when the
  delay is small enough that the two together behave as a single integrated agent
  — one that could not be behaviourally distinguished from a single person by any
  test?

  3. If we say there is one person during the overlap, where is she? If we say there
  are two, say what happens to the "one person" claim across the rest of the Relay,
  in which the substrate and the brain never coexist but each takes over from the
  other''s state.


  Reach a conclusion on each of these and defend it. The essay should weigh the two
  broad positions — that personal identity consists in the continuity of an information-bearing
  pattern, which is substrate-neutral and can in principle be multiply instantiated,
  versus that it consists in the continuity of the causal and material history of
  a single living organism — and should say which of them the Relay favours and at
  what cost. Do not settle for the verdict that the case shows there is no fact of
  the matter; if you think that, you must argue for it against the alternative that
  our concept of a person simply has determinate application here and the case reveals
  which of its strands we care about most.


  Also address this objection: that the Relay is just the familiar fission problem
  in new clothing, and that whatever one says about amoebic division or hemisphere
  transplants one should say here, so the scenario adds nothing. If the objection
  is right, say what the essay has actually established.


  Argue from the case itself. Do not lean on what any particular philosopher has said
  about it, and do not supply citations or a bibliography — I care about the reasoning,
  not the scholarship.


