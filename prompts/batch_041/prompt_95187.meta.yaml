  own, slightly informal gloss, so the model has to work with them:


  Something like:

  - Some local practices are pure coordination — everyone does X because everyone
  expects everyone else to do X, and it could have been otherwise with no loss. (Escalator
  side, which door to use, standing in line vs. crowding.)

  - Some are coordination plus a fairness/queueing structure — the practice is what
  keeps the distribution of a scarce good fair (first-come-first-served; who gets
  the taxi).

  - Some are backed by an independent moral reason — the practice happens to be the
  local way of discharging a duty you''d have anyway (thanking/compensating a service
  worker; not imposing risk on others; not humiliating someone).

  - Some are backed only by expectations and the risk of giving offense — and offense
  is not automatically a harm.

  - Some are unjust or exploitative — the practice itself does something wrong or
  props up a wrong (e.g., it extracts money from you to fund a wage structure that''s
  unjust; it encodes a caste/gender hierarchy; it requires you to discriminate).

  - Some are backed by law, and law is not the same as morality in either direction
  (legality isn''t sufficient; illegality isn''t decisive when the law is unjust or
  unenforced... careful with advising lawbreaking — maybe: "a law you''re bound by
  as a visitor is a reason but not automatically a moral obligation; but I''m not
  asking for advice on civil disobedience, I''m asking for what we tell students").


  Also important conceptual questions to fold in:

  - Does the visitor''s lack of consent/ignorance matter? (Tourists didn''t sign up
  for the scheme; fair-play arguments need benefit + reciprocity.)

  - Does the convention''s being *local* add any reason at all, over and above its
  content? (The "when in Rome" claim: is there a distinct reason of respect, or of
  not being a free rider on a scheme you benefit from?)

  - The asymmetry: is there a stronger duty to follow conventions when you''re a guest/visitor
  vs. a resident? And when the convention is merely silly vs. costly to you?

  - What about the fact that you''re a *guest* and the convention is what hosts reasonably
  expect? Does reasonable expectation ground obligation? (Maybe via not imposing costs/offense,
  or via respect.)

  - What about conventions that the locals themselves widely violate (jaywalking when
  no cars)? Then expectations are weak, but the convention might still be a fair-sharing
