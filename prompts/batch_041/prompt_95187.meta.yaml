  Setting: I run the international programs office at a mid-size university (or I''m
  a "global mobility" manager at a company). I send ~120 students a year to 20 countries.
  Orientation is one hour. I want a one-page procedure for students: given a local
  practice — tipping, queueing, jaywalking, standing on the correct side of the escalator,
  not eating on the metro — decide whether they''re obligated to follow it, when it''s
  optional, when they must not.


  Frequency/stakes: every cohort, dozens of small decisions a day; consequences range
  from mild social friction to (in rare cases) legal trouble or complicity in something
  unjust.


  Constraints: I''m not a philosopher; students read it once, on a phone, jetlagged.
  Needs to fit on a page-ish, run in under two minutes in the moment. Anything that
  needs judgment should be flagged as such, with a "who to call" (the program''s on-site
  coordinator) at the end.


