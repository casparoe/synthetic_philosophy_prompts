  Now the prompt structure:


  - Opening: I recently read a popular book / a colleague''s summary. Present the
  quoted summary.

  - Ask: audit sentence by sentence: accurate, simplification, wrong; what Hobsbawm
  would accept/object to, what Anderson would; which claims are conflations; which
  sentences aren''t attributable to either author; whether the concluding inference
  survives.

  - Add: distinguish the separate theses (nations are modern; national traditions
  are recent; national identity is imagined/false; national identity is illegitimate).

  - Add: my own case (the village festival) — does the "invented" diagnosis apply,
  what would each author say, and does the case show anything the summary misses.

  - Add: my inclination — I think the middle is right and the last sentence is a stretch;
  tell me if that''s the right split.

  - Add: requirements — American English, no bibliography needed, define terms, don''t
  just list names; if a claim is contested among scholars, say so; state what would
  count as evidence for "inventedness"; say whether "invented" is a matter of degree.

  - Maybe: flag any place where the summary uses a term in its everyday sense that
  the scholar used technically.


