  I think the "invention of tradition / imagined communities" domain is the most tractable
  and rich, with well-known subtle errors:


  1. Conflating Anderson''s "imagined" with "fabricated/false." Anderson explicitly
  says communities are to be distinguished "by the style in which they are imagined,"
  not by their falsity/genuineness. So the summary "Anderson showed that national
  identity is a fiction invented by elites" is unfair.

  2. Treating Hobsbawm''s thesis as universal: he claims invented traditions are a
  distinctive product of a specific period (roughly 1870–1914), and he distinguishes
  "invented tradition" from "custom" and "genuine tradition" — actually Hobsbawm says
  invented traditions include both "traditions" actually invented and those emerging
  in a less easily traceable way, and he distinguishes three types (symbolizing group
  cohesion, legitimizing institutions/authority, socialization). Also Hobsbawm''s
  claim that where old traditions persist, they''re often "invented" too? Careful.

  3. The "invention" is often about the ritual/ceremonial packaging, not about the
  underlying practice or national identity being wholesale false. Hobsbawm''s own
  view is that national traditions were invented to fill a gap created by the decline
  of older community bonds and to make the nation appear ancient.

  4. A subtle error: the claim that "nations are modern" is a thesis about nationalism,
  not about ethnicity/kinship groups — modernist accounts (Gellner, Anderson, Hobsbawm)
  disagree among themselves (Gellner: industrial society needs standardized high culture;
  Anderson: print capitalism and "homogeneous empty time"; Hobsbawm: invented traditions
  from above and "proto-national" bonds). So the summary flattening them into one
  "nationalism is a modern fabrication" thesis is a conflation.

  5. Another error: the inference "therefore national identity is illegitimate/inauthentic
  and should be discarded" — an is/ought slide and also a genetic fallacy. Anderson
  is sympathetic to nationalism in some ways (his own anti-imperialism, his remark
  about nationalism as "political love" — careful, don''t quote).

  6. Another: "since traditions are invented, they can be invented at will by elites"
  — this overstates elite control; also the "invention" claim doesn''t imply that
  top-down fabrication succeeds (there''s the reception side; e.g., the "invention"
  must resonate).

  7. Also: "invented tradition" vs "invention of tradition" as a term that implies
  a single act of creation, whereas the process is often gradual and contested.

  8. Also: dating the "nation" to a specific century is disputed by ethno-symbolists
  (Smith) who say modern nations build on older ethnies.


