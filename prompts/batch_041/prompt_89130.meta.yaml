  ---


  I chair the selection panel of a mid-sized foundation that makes one flagship grant
  a year: a single award, not divisible, and our guidelines say the winner is the
  "most promising" of the shortlisted proposals. This year the panel shortlisted two
  and the scores came out identical on all four published criteria. The tie is not
  the product of agreement — different panelists reached the same totals for different
  reasons, and we never did settle the relative weights of the criteria — but as far
  as our own process is concerned, there is nothing to choose between the two.


  Two things force a decision by 15 December: the money reverts to the endowment if
  it isn''t committed, which would be worse for everything we care about, and the
  guidelines promise each finalist a short written statement of the panel''s reasons.
  Our bylaws are silent on ties except that the chair may resolve one, provided the
  resolution and its grounds are recorded in the minutes. That chair is me. I can
  break the tie by fiat on 5 December, but I''d rather the panel adopt a defensible
  basis than have me impose one, and I want the memo to be the thing we vote on and
  record.


  Complications the memo will have to survive:

  - One panelist, who reads too much philosophy, insists on a distinction between
  choosing and picking: choosing is done for a reason, picking is what you do when
  there''s nothing to choose between, and the fact that you had a reason to pick something
  is not a reason for the thing picked. On her view a coin toss is legitimate and
  any invented reason is a lie.

  - Another says the two proposals aren''t equal but "on a par" — she accepts that
  improving either one slightly wouldn''t make it better than the other, and concludes
  they''re neither equal nor unequal in merit, which she says changes what a tie-breaker
  has to do.

  - A third wants to split the award, though the guidelines say single award and the
  award includes a residency that only one organization can hold; a fourth wants to
  go back and add a fifth criterion, which the others call gerrymandering, and he
  calls finishing a job we left undone.

  - The old donkey between two identical bales at least has the excuse that it doesn''t
  notice the third option: starving. Ours is on the table, and it''s worse than either.


  Please draft the memo, around 800-1000 words, addressed to the panel. Recommendation
  up front with a concrete course of action and dates; the reasoning, including what
  the panel should say in the written statement to the finalist who doesn''t get it;
  and the strongest case against your recommendation stated fairly enough that the
  panelist who holds it would recognize it as hers. Don''t assume we can consult counsel
  before the 5th.


