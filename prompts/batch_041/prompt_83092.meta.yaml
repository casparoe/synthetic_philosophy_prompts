  Dependency structure for DNA-as-code:

  1. First you need the machinery: transcription/translation, codons, tRNA, the ribosome.
  Without the codon table there is nothing to call a code. (Do you need this first?
  Yes: the code is a mapping from codons to amino acids.)

  2. Then the crucial structural feature: the mapping is arbitrary/not chemically
  necessitated — any codon could have mapped to any amino acid (evidence: the code''s
  near-universality plus the existence of variant codes in mitochondria and some organisms;
  also the fact that the code is "frozen" historically). This is what makes it a *code*
  rather than a chemical law — contrast with, e.g., the fact that hydrophobic residues
  fold inward, which is not coded.

  3. Then: what the code does and doesn''t specify — the codon specifies which amino
  acid is added, not the folding, not the timing, not the quantity. This gives "DNA
  specifies the sequence of a polypeptide" vs "DNA specifies the organism".

  4. Then: information in the Shannon sense vs. semantic sense — a channel has capacity;
  but "information about" requires a consumer/decoder. Introduce the idea that "information"
  is relative to a receiver/decoder and to a question (this is a niche injection:
  information as "correlation with a source relative to a question", or the "causal
  parity thesis" of Griffiths & Knight — every developmental resource is informationally
  on a par).

  5. Then: the "coding" vs "template" distinction and the fact that other molecules
  (prions, RNA, histones, methylation patterns) also carry heritable information.

  6. Then: the semantic/teleosemantic view — information is "about" something because
  of the function/selection history (Stegmann, Maynard Smith''s "intentional" vs "causal"
  notions).


  Misconceptions to head off:

  - "code = cipher/secret message that must be decoded by a reader" → the cell doesn''t
  read it like an agent; decoding is mechanico-chemical.

  - "DNA is a blueprint" → blueprint implies 1:1 spatial correspondence; better: recipe/program/seed.

  - "if the mapping is arbitrary, the information is arbitrary" → the arbitrariness
  of the mapping doesn''t make the transmitted content arbitrary; you need the distinction
  between the arbitrariness of the code and the specificity of the message.

  - "informational talk is just metaphor, therefore eliminable" → but some informational
  claims are load-bearing (e.g., sequence specificity, error correction, the ability
  to predict protein from gene).

  - "genes contain the information for traits" → conflation of coding with determination;
  gene-environment parity.

  - "the code is universal, therefore it''s a law of nature" → near-universality is
  a historical fact, evidence for common ancestry.


