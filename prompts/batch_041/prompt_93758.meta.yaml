  Git mapping:

  - A world = a branch (a commit DAG state).

  - Transworld identity = a single object (blob/commit) literally present in multiple
  branches (shared ancestry, same hash).

  - Counterpart = a rebased/cherry-picked commit: same patch/content, new hash, similar
  but not identical; similarity relation is context-dependent ("the same change" vs
  "the same tree" vs "the same author-date").

  - Context-dependence of the counterpart relation = which comparison you''re doing
  (git diff --find-renames similarity threshold!). That''s delicious: git literally
  has a similarity threshold parameter for detecting renames/copies, and its output
  changes with the threshold. That''s a real, concrete mapping of "counterpart relation
  is vague and context-dependent."

  - Haecceitism vs anti-haecceitism = whether two branches that are textually identical
  but historically distinct are "the same world" — git can have identical trees with
  different commit history; are they the same world? Two commits with the same tree
  but different parents → qualitatively identical but "numerically" different. Haecceitism
  says yes, they differ in which individual-history they contain. That''s a great
  mapping!

  - The Humphrey objection = "I care about my branch being merged" — do I care about
  my counterpart commit''s fate, i.e., does concern transfer? If my commit is rebased,
  is it still my commit? Git authorship metadata persists, so there''s a partial answer.

  - Non-transitivity of counterpart relation: cherry-pick A→B, B→C, but A is not similar
  to C (patch drift). Git: three-way merges and patch drift; a rebase chain where
  similarity decays. Nice.

  - Necessity of identity: content-addressed hashes make identity decidable — transworld
  identity in git is a decidable, hash-based matter, whereas Lewis''s counterpart
  relation is vague. So git is "haecceitist" by construction because objects are individuated
  by content+history. Residue: git''s identity criterion is purely structural/content-based,
  so it can''t model the philosophical worry about whether there''s a fact of the
  matter about de re modality; and git''s "worlds" (branches) are not maximal or mutually
  exclusive — a branch can be a superset of another (fast-forward), and branches share
  history, so worlds overlap, which is precisely what Lewis denies (worlds are disjoint/spatiotemporally
  isolated). That''s a strong residue point: in git, worlds are not isolated — shared
  history means the same object is in many "worlds," so git is a Kripkean/transworld-identity
  picture at the object level while being Lewisian at the branch level. Ooh, that''s
  a nice tension: the analogy is internally inconsistent, which is exactly what a
  residue report should surface.


