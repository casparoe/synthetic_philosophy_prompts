  Exam question (write it myself):


  "Suppose moral status attaches to a system''s computations rather than to its physical
  make-up. (a) Explain why this ''substrate-independence'' is attractive, and why
  the trivialization worry — that on a simple mapping account any physical system
  implements any finite-state automaton — threatens it. (b) What does a proponent
  of the computational view need to add to the notion of implementation in order to
  avoid the trivialization, and what does that addition cost? (c) Does the resulting
  view give us a principled way to locate the boundary of sentience (e.g., as between
  a rock, an insect, and a large language model)? Defend your answer."


  Student answer — I''ll write ~550 words. Let me draft.


  "Functionalism about the mental is the obvious home for the idea that moral status
  should track computations rather than stuff. Its central motivation is multiple
  realizability: if pain is a functional kind — a state that plays a certain causal
  role — then a silicon system that plays that role has as much claim to be in pain
  as a human does, and it would be arbitrary to make moral status depend on carbon.
  So the computationalist wants moral status to supervene on the right kind of organisation,
  and the question is what fixes which organisation a given physical system realises.


  Putnam''s trivialization argument is the standard challenge here. In the appendix
  to Representation and Reality he proves (or claims to prove) that every ordinary
  open physical system realises every abstract finite-state automaton: given any physical
  system and any FSA, there is a mapping from the system''s maximal physical states
  to the automaton''s formal states that preserves the transition structure. On the
  simple mapping account, then, a rock implements any automaton you like, and if implementing
  the right automaton is sufficient for having a mind, the rock has a mind. That is
  absurd, so either the mapping account is too permissive or the appeal to computation
  is empty. Putnam himself takes it to show that computational functionalism can''t
  ground a theory of mind.


  The natural repair is to say that not just any mapping counts as implementation;
  we need a restriction. Chalmers, in his paper on whether a rock implements every
  finite-state automaton, argues that Putnam''s result depends on allowing very simple
  automata and a very thin notion of implementation, and that if we tie implementation
  to a richer class of automata — ones with a combinatorial state structure, so that
  the system''s states must decompose into components in a way that mirrors the automaton
  — then the requirement that a system implement a given automaton becomes a strong
  constraint and the triviality disappears. That seems right to me. Once you demand
  that the physical states be decomposable into interacting parts, the rock drops
  out.


  But I think this shows that the debate about implementation just is the debate about
  other minds. Chalmers'' restriction tells us which systems have the right internal
  organisation; it doesn''t tell us which of them feel anything, because we still
  can''t get inside the system. So the restriction solves the problem of other minds
  by giving us a criterion, and the boundary of sentience is fixed by where the criterion
  is met.


  On the boundary question, this gives a defensible line. A rock implements nothing
  in the restricted sense and has no moral status. An insect is a harder case... A
  large language model implements the right computations ... so the computationalist
  should treat it as a candidate for moral status, whereas the biological naturalist
  (Searle) who thinks the wall behind him implements WordStar would deny this. Searle,
  like Putnam, thinks computation is substrate-independent, so he agrees that a system''s
  moral status can''t depend on what it''s made of; he just adds that consciousness
  requires the right causal powers of the brain."


