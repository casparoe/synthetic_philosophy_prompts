  ---


  I''m putting together a two-page proposal for a small interdisciplinary center that
  funds one-day workshops for mixed audiences of philosophers and cognitive scientists,
  and I need help turning a half-formed idea into the actual document. The seed is
  an old thought experiment of Douglas Hofstadter''s that he calls the careenium,
  which I keep coming back to in arguments with a friend in our cognitive science
  reading group: imagine a giant billiard table covered with an enormous number of
  tiny magnetic balls (he calls them simms) that careen around and stick together
  into stable clumps (simmballs). The clumps have a life of their own — they form,
  drift, and knock each other apart in regular, recognizable ways — and the whole
  point of the example is that the same goings-on can be described at either level:
  as simms jostling simms, or as simmballs shoving simmballs. Hofstadter''s paper
  asks, in effect, who is doing the shoving, and my suspicion is that the question
  as usually posed is really three questions wearing one coat. I want the proposal
  to argue that "does the simmball push the substrate around?" has different answers
  depending on what you take a cause to be: if "push" means difference-making (the
  interventionist sense, where to be a cause is to be something whose manipulation
  would change the effect), the simmball-level description looks as legitimate as
  the simm-level one; if "push" means production — the transfer of oomph, the thing
  that actually moves the ball — then only the simms push, and the simmball is a useful
  fiction; and if "push" means being a real pattern that earns its keep in prediction
  and explanation, the question turns into whether the clump-level regularities are
  robust in the right way. My half-formed thought is that the familiar exclusion worry
  about higher-level causation only gets its grip because people slide between these
  senses, and that once they''re separated the residual dispute is not metaphysical
  but normative — it''s about which notion of causation an explanation is entitled
  to invoke, and for what purpose.


  Please write the proposal itself (two pages, prose, no bullet-point skeleton): state
