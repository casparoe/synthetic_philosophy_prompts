  variations on the setup — designed to pull the two levels apart, cases where the
  clump-level description supports counterfactuals or interventions that the sim-level
  description doesn''t and cases where the reverse holds, plus one or two cases where
  the levels come apart in the other direction (the sim-level story is causally rich
