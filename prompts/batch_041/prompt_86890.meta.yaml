  fine-tuning, and prompt context. I call the resulting profile a ''curatorial creature'':
  it can rehearse and recombine cultural tools, but the selection pressure that shaped
  its dispositions is not its own trial-and-error, and the prompt that triggers a
  given ''inner environment'' is external. I also suggest a subcategory, the ''ventriloquial
  creature,'' for systems whose apparent reasoning is a performance of culturally
