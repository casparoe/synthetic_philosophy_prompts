  Let''s consider: The domain "Revealed preference and the meaning of utility" — I
  could write the summary as coming from a colleague in a neighboring department (economics,
  or a law professor) who wrote a memo/op-ed. The subtle misrepresentations:


  1. Conflation: treating the revealed preference "definition" of preference as a
  substantive empirical discovery about consumers, when it''s partly a methodological/definitional
  device (Samuelson''s operationalism).

  2. Overstatement: claiming that because of revealed preference theory, talk of "utility"
  is just talk of choices, so it''s meaningless to say someone chose something that
  made them worse off — whereas the theory distinguishes utility as a representation
  of choice from wellbeing; and economists (e.g., in welfare economics) still need
  something like wellbeing.

  3. Standard objection presented as refutation: framing effects / preference reversals
  (e.g., decoy, anchoring) are often presented as refuting revealed preference theory,
  when in fact they challenge specific axioms (e.g., WARP, transitivity) rather than
  the general program; the theory can be restated to accommodate, or the objection
  shows the incompleteness of the choice-based definition rather than its falsity.

  4. Technical term in everyday sense: "utility" used as "usefulness" or as "pleasure",
  or "rational" used as "sensible/prudent" when it means consistency of choice.

  5. Also: the "as if" interpretation (Friedman) vs. realism; and the claim that ordinalism
  makes interpersonal comparisons "unscientific" (Robbins) vs. the later view that
  it''s a value judgment to refuse them (Sen). Hmm, that might be a lot; keep it to
  2-3 errors, mostly right.


  Also there''s the subtle point: revealed preference is not the same as the claim
  that people always maximize self-interest; and it''s not the same as behaviorism
  about preferences; and the definition of preference from choice requires auxiliary
  assumptions (that choices are made from a fixed opportunity set, that preferences
  are stable, that the agent is choosing for themselves, etc.) — which is exactly
  what Sen/Hausman press. And "revelation" issue: any choice data can be rationalized
  by some preference relation (the "anything goes" problem), so the theory has empirical
  content only when combined with restrictions.


