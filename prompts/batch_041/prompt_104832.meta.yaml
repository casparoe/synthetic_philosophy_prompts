  Draft summary (to embed):


  "Revealed preference theory, as developed by Samuelson and refined by Houthakker
  and others, holds that a person''s preferences are nothing over and above the choices
  she makes: to prefer A to B just is to choose A when B is available. This was a
  great advance because it freed economics from the introspective psychology of the
  utilitarians, replacing talk of quantities of pleasure with a purely behavioral,
  ordinal notion of utility. Because utility on this view merely represents the ordering
  of choices, it makes no sense to say that someone chose what was worse for her,
  or that her preferences were distorted; and because preferences cannot be measured
  in a common unit, it is a scientific error to make interpersonal comparisons of
  welfare. Empirical findings such as preference reversals and framing effects have
  refuted the theory by showing that choices are not consistent enough to reveal any
  underlying ordering. In short, the theory tells us that utility is a useful fiction
  and that welfare economics should be replaced by the study of choice behavior."


  That''s good: mostly right, but errors:

  1. "to prefer A to B just is to choose A when B is available" — the definition requires
  auxiliary assumptions (fixed opportunity set, stability, self-regarding choice,
  no error); and Samuelson''s own project was about deriving testable restrictions,
  not a semantic reduction of preference to choice. Also a single choice doesn''t
  reveal a preference (weak axiom). Also, the reduction is contested (Sen: choice
  may not reveal preference; Hausman: the "revelation" is definitional vs. empirical).

  2. "makes no sense to say that someone chose what was worse for her, or that her
  preferences were distorted" — conflates the representation of choice with wellbeing;
  the theory is silent (or has implications) on wellbeing; economists do distinguish
  decision utility and experienced utility; the choice-based definition doesn''t entail
  that wellbeing talk is meaningless.

  3. "it is a scientific error to make interpersonal comparisons of welfare" — this
  is the Robbins/ordinalist view, often treated as a technical consequence of ordinal
  utility, whereas it''s a methodological/positivist stance; also interpersonal comparisons
  can be non-cardinal (e.g., ordinal comparability of levels); and "scientific error"
  overstates.

  4. "preference reversals and framing effects have refuted the theory" — they challenge
  specific axioms (transitivity, WARP, independence) and show that a single revealed-preference
  model may not fit all data, but not "the theory" wholesale; the theory can be refined
  (e.g., random utility models, context-dependent preferences), and the objections
  are often about the definitional reduction rather than the empirical adequacy. Also
  "refuted" is too strong for a program that is a framework.

  5. "utility is a useful fiction" — overstatement; utility is a representation theorem
  notion; not a fiction in the way that phrase suggests (though there''s a real debate
  about realism: ordinalist "as-if" vs. measurement-theoretic realism).


  Also potential error: "freed economics from introspective psychology" — mostly right
  (operationalism), but Samuelson''s aim was to derive demand restrictions from observed
  choice; and there''s the "as-if" Friedman connection.


  Also: "ordinal notion" — right that ordinal utility replaced cardinal, but note
  the irony that ordinalism''s "utility" is a representation, and that cardinal utility
  returned in expected utility theory (vNM) and in behavioral welfare economics (experienced
  utility), so the claim that utility is purely ordinal is contested.


  So the audit can cover: accurate parts (the operationalist ambition; the rejection
  of introspective/hedonic measurement; the move to ordinal representations; the point
  that choice data underdetermine preferences without auxiliary assumptions); wince
  parts (the "just is" reduction; the leap from ordinalism to anti-interpersonal-comparison
  as a "scientific error"; treating a framework as refuted); wrong parts (utility
  as a "useful fiction" in the sense implied; the claim that the theory makes wellbeing-talk
  senseless).


