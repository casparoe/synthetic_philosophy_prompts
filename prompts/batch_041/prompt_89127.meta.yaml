  to work on something that matters rather than on the latest round of counterexamples.
  Which open questions in this area most deserve that time, and in what order? I am
  less interested in a list than in the reasoning: for each, whether it is upstream
  of the others (so that settling it would settle or dissolve them), how tractable
  it is with the tools metaphysicians already have, whether it would survive the collapse
  of the fink/mask distinction or be undermined by it, and how much of the existing
  literature would have to be re-read if the answer went one way rather than the other.
