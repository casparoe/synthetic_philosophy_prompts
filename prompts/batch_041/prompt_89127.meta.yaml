  I am an early-career philosopher who has just taken up a two-year research fellowship
  with no teaching duties and a small budget to bring two doctoral students into the
  project; my field is the metaphysics of dispositions, and I am trying to decide
  where to point the three of us for the duration. The immediate provocation is a
