  fragile. Attached to it is a device that intervenes whenever the glass is struck
  with sufficient force to break it. The device''s internal mechanism is governed
  by a fair coin: on one outcome it momentarily alters the glass''s microstructure
  so that the glass is not fragile at the moment of impact, and on the other it leaves
  the glass exactly as it was but interposes a cushion that absorbs the blow. The
  two outcomes are indistinguishable from the outside, the glass never shatters when
  struck, and — this is the part I care about — the device destroys its own records,
  so that no amount of physical investigation, at any time, can reveal which outcome
  occurred on any given occasion. My instinct is that the familiar distinction between
  finks (which supposedly remove or reverse a disposition) and masks (which supposedly
  leave the disposition intact but block its manifestation) does no work here: the
  case is both, or neither, and nothing downstream turns on which. If that is right,
  then a good deal of the literature — the reformed conditional analysis and its defence,
  the attempt to say what makes a disposition the disposition it is, the dispute over
  whether dispositions are identical with their categorical bases — may be resting
  on a distinction that is, in some cases, not even in principle applicable.


