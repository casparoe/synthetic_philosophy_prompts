  The procedure should:

  - be runnable in a fixed time with the info they have;

  - say which questions are decisive (an answer of "no" stops it);

  - distinguish a costly commitment that reveals a *type* (something about the applicant
  you can''t observe, like genuine capacity or resolve) from one that merely *changes
  their incentives* (a bond/clawback — useful for a different reason: it aligns incentives
  but doesn''t prove capacity), and from one that is just *theater*;

  - check for differential cost: who can afford this and who can''t? If only well-resourced
  orgs can post a $100k bond, the procedure selects for wealth, not for what you want;

  - check whether the cost is correlated with the trait you care about (single-crossing):
  does the cost hurt a bad applicant more than a good one? If the cost hurts both
  equally, it''s a tax, not a signal;

  - check whether the cost is "wasted" or "recoverable" and whether the sender can
  undo it;

  - consider the equilibrium: the signal only works if the foundation responds differently
  to signalers vs. non-signalers, and if the response is predictable, people will
  signal to get the response;

  - consider that once it''s known as a criterion, it becomes a target (Goodhart /
  signaling arms race) — cost inflation;

  - consider that a signal that is genuinely informative at first can become uninformative
  as it spreads.


