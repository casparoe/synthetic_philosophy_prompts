  is it a "static" replacement that loses something? The "velocity as primitive" objection
  (e.g., Tooley, Bigelow). Also the problem of "the arrow" — at an instant, an arrow
  is where it is; if it''s at rest whenever it''s at a place... The at-at theory says
  the arrow moves because it is at different places at different times; but at each
  instant, it is at rest in the sense that at that instant there''s nothing about
  it that distinguishes being at rest from moving — which some take to be a genuine
  problem for "instantaneous velocity" realism.

