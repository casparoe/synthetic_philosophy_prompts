  "Write a short story, roughly 1,800–2,500 words, that stages the paradox of phenomenal
  judgment from the inside. The setting: a near-future research institute where a
  technique called judgment tracing can reconstruct, from a subject''s neural activity,
  the proximal causes of her verbal reports about her own experience. The institute''s
  founding hypothesis is a thoroughgoing epiphenomenalism: conscious qualities are
  real but causally inert with respect to the physical processes that produce reports,
  decisions, and memories. A senior researcher, who accepts the hypothesis, is asked
  to certify that the institute''s reports are reliable evidence about experience.
  A junior colleague argues that if the hypothesis is true, the reports are at best
  correlated with experience and at worst systematically disconnected from it, so
  the institute''s entire evidential practice presupposes something closer to interactionism
  or to a deflationary view on which there is nothing over and above the judgments.
  The story should turn on a concrete audit or experiment, not on a seminar discussion.
  It should let the characters articulate the strongest version of each position,
  including the point that epiphenomenalism seems to make first-person evidence about
  qualia either mysterious or superfluous. Do not resolve the paradox with a clever
  twist that makes it disappear; let the dramatic pressure come from the fact that
  the institute must act on one answer while the metaphysics remains unsettled.


