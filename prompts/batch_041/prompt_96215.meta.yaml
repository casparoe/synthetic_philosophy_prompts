  \ a sharp lexical boundary, then there's a level of suffering epsilon below threshold\
  \ such that no amount of good can compensate; but then a world with one epsilon-suffering\
  \ and infinitely many ecstatic lives is worse than a world of nothing? Then a small\
  \ change in the intensity of suffering across the threshold makes an infinite difference\
  \ in ranking — \"threshold sensitivity\" problem: two worlds differing by an imperceptible\
  \ amount of suffering can have radically different rankings, and by transitivity+continuity\
