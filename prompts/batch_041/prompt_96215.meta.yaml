  \ (from Roger Crisp's \"Why Not Suicide?\" / negative utilitarianism). Also, the\
  \ argument that a lexical threshold either collapses into pure negative utilitarianism\
  \ or into totalism (Arrhenius-style impossibility theorems; \"the sadistic conclusion\"\
