  Niche injection: the key design details.

  - Conditional markets: "Market A pays $1 if we adopt portfolio X and metric M rises
  5%; market B pays $1 if we don''t adopt X and M rises 5%; adopt X iff P(A) > P(B)."
  That''s the standard Hanson design.

  - The wrinkle: the metric M has to be specified in advance, and there''s a lag —
  the metric is only measurable 3 years later, so markets must be settled later, and
  the board may not be around.

  - The niche idea to inject: "the metric-selection problem" — the board can''t agree
  on M; some want a survey-based measure, others want publication counts, others want
  a downstream policy outcome. And a second wrinkle: the "manipulation" worry — a
  trustee could trade to distort prices, or a grantee could game the metric.

  - Another niche idea: Hanson''s own concession that futarchy requires "the metric
  be measurable and not manipulable" and that it works best for "frequent, repeated
  decisions" — a one-off decision has no track record, and there''s no way to know
  if the market was right. That''s the "one-shot problem" — for a single decision,
  the market''s price can''t be validated, so you can''t distinguish a good market
  from a lucky one. That''s a genuinely in-the-weeds point that a model might not
  regurgitate well.


