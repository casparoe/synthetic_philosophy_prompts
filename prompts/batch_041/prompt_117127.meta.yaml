  Background: I''m a 4th-year PhD student in political science (formal theory), and
  I have the grad-student seat on the board of a small foundation that funds science-policy
  research. Mostly I take minutes and get asked whether the numbers mean anything.
  Next month''s meeting we have to decide how to allocate next year''s grant money
  — about $2.4M, call it 8-10 projects — and there are three proposals on the table:


  1. Status quo. Program officers shortlist, board votes, chair breaks ties.

  2. Full futarchy. We pre-register a success metric, then run conditional decision
  markets: a contract pays out only if we adopt portfolio X and the metric hits its
  target in three years, a matching contract pays out only if we don''t adopt X and
  the metric still hits target. Adopt X if the first price beats the second. Same
  setup for each competing portfolio; highest wins; markets bind us.

  3. A pilot. Run the markets next to the board vote, cap what''s at stake, don''t
  bind ourselves, settle against the pre-registered metric in three years, then decide
  whether to go full futarchy.


  The actual fight on the board isn''t about the mechanism, its about the metric and
