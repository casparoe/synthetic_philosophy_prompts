  Now, is there also a good passage in Book VI Ch. VI? §2 there: "All phenomena of
  society are phenomena of human nature, generated by the action of outward circumstances
  upon masses of human beings..." Good too. But Ch. VII §1 is the classic "methodological
  individualism avant la lettre" passage, and the surrounding argument (the "chemical
  method" critique) is in the weeds. Also his later claim in Ch. IX that the concrete
  deductive method requires "empirical laws" of society (like the "inverse deductive
  method" for historical generalizations) creates the tension.


  Also interesting: Mill''s claim that "In social phenomena the Composition of Causes
  is the universal law" — that''s a technical notion from Book III (composition of
  causes vs. chemical combination) that is genuinely in the weeds, and it''s the key
  to the puzzle: Mill says social phenomena involve *composition* of causes (i.e.,
  they''re additive/mechanical, not chemically fused), which is why they can be resolved
  into individual laws. That''s a great interpretive knot: why is "composition of
  causes" a "law"? Because composition is the case where effects add up and can be
  resolved into separate causes.


  Also there''s a tension with Mill''s Ch. VI §3 where he discusses the "consensus"
  of social phenomena — the mutual action and reaction of social elements — and his
  claim that this makes the "concrete deductive method" hard, and his "inverse deductive
  or historical method". Also in Ch. VI he says "there is no social science in the
  sense of a science of the causes of social phenomena apart from..."? Hmm. Actually,
  in Ch. VI §3, Mill argues that the "state of society" is a "consensus" (borrowing
  from Comte), meaning that social phenomena mutually determine each other, so you
