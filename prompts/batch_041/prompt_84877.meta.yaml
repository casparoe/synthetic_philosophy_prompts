  I''m a features writer at a general-interest magazine, at work on an essay about
  the oldest and most durable of all arguments in moral philosophy — the argument
  over human nature. I''d like you to draft the centerpiece for me: a dialogue between
  two contemporary interlocutors, one speaking for Mencius and one for Xunzi, each
  as formidable as the other, each arguing in good faith and answering the other''s
  actual points rather than talking past them.


  What I don''t want is the textbook recital — Mencius says we''re born good, Xunzi
  says we''re born bad, and both agree we can improve. I want the exchange to earn
  its conclusion by working through the details, and I want to be able to tell my
  readers, at the end, exactly where these two part company and whether the parting
  is a genuine disagreement or two people using the same word for different things.


  The puzzle I''d like the dialogue to start from is this. Both men are optimists
  about the destination: both hold that almost anyone can become a sage, and both
  think the obstacle lies in something that must be worked on or drawn out. So the
  quarrel can''t be a simple disagreement about whether people can be good. It has
  to be about what the raw material is and what has to be done to it.


  Let the Mencian make the case from the inside: the immediate, unreflective recoil
