  Draft:


  "My reading group just spent three sessions on Browning''s Ordinary Men and Goldhagen''s
  Hitler''s Willing Executioners and I came away feeling like I''d watched two people
  have a fight in different languages. Roughly: Browning looks at Reserve Police Battalion
  101 — middle-aged Hamburg men, mostly working class, too old or too unfit for regular
  service, not party fanatics — and says they shot women and children in the forests
  because of the situation they were in: the authority of their officers, the pull
  of not wanting to let their buddies down, the way each day''s killing made the next
  one easier, the small comfort of career advancement. His evidence includes the offer
  their commander made before the first massacre, telling anyone who didn''t feel
  up to it to step out, and the fact that only about a dozen of some five hundred
  men did. Goldhagen looks at the same battalion, using largely the same postwar interrogations,
  and says no: since no one was punished for refusing and refusing was easy, the men
  who killed did so because they wanted to, and what made them want to was a specifically
  German ''eliminationist'' antisemitism of a kind that made the murder of Jews seem
  obviously right. Both of them agree on an enormous amount of the factual record,
  and yet in our group nobody moved an inch, and I get the impression the literature
  hasn''t moved either.


  So my question is what kind of disagreement this actually is. My own guess — and
  it''s only a guess, I might be completely wrong — is that a lot of it isn''t about
  the evidence at all, but about what an explanation of something like this is even
  supposed to deliver: Browning is explaining a pattern (why men of this sort, in
  this sort of unit, mostly complied), Goldhagen is explaining a choice (why this
  man pulled the trigger), and a population-level story and an individual-level story
  can both be complete without competing. If that''s right, then the two sides have
  been treating each other as rivals when they''re answering different questions.
  But maybe that''s too tidy — maybe it''s a genuine disagreement about the relative
  weight of ideology versus immediate social pressure, in which case it''s empirical
  and we should be able to say what evidence would settle it. Or maybe the real disagreement
  is moral and political, and the historical claims are downstream of the fact that
  ''ordinary men'' feels like it lets the Germans off the hook while ''willing executioners''
  indicts a whole nation. And I wonder whether the ground under Browning has shifted
  since 1996 — the archival re-readings of Milgram''s tapes and the collapse of the
  Stanford prison study have made the old situationist textbook look a lot less solid,
  and Browning was leaning on it. Does that actually bear on Battalion 101, or is
  it a red herring? Please diagnose what''s going on here: is this verbal, empirical,
  a clash of explanatory standards, two questions under one name, or bedrock moral
  commitments — and given your diagnosis, tell me what would actually count as progress,
  or whether I should expect the thing to just grind on."


