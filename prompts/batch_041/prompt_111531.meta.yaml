  Possible desiderata for a theory of costly signalling / the handicap principle:

  1. Demarcation: distinguish signals from cues (a cue is information extracted by
  the receiver but not shaped by selection for that effect; a signal is a trait whose
  design/evolution is explained by its effect on receivers). Must get right: e.g.,
  a predator tracking prey by scent (cue) vs. an alarm call (signal); a trait that
  is informative but not adapted for informing.

  2. Honesty/stability: explain why receivers should trust the signal; i.e., why dishonest
  mutants don''t invade. Must handle the equilibrium question — and the point that
  "cost" alone isn''t sufficient in general (in a one-shot anonymous interaction,
  cheap talk can be honest if interests align — "cheap talk" is honest when interests
  coincide; costs matter when interests conflict). So a desideratum: explain honesty
  in cases of *partial* conflict of interest, and not require cost where interests
  align.

  3. Must accommodate honest signals that are cheap: index signals (signal properties
  physically/physiologically tied to the quality signalled, e.g. a croak''s pitch
  and body size) and amplifiers. So the theory can''t define signalling by wastefulness.
  This is the tension with Zahavi''s original formulation.

  4. Must explain why signals are often costly anyway / why waste persists — i.e.,
  why the equilibrium isn''t always at the cheapest honest option; and must not treat
  cost as a definitional requirement (tension #2).

  5. Must handle deception and exploitation: some signals are dishonest (frequency-dependent,
  e.g., bluffing in low-quality individuals), mimicry (e.g., Batesian mimics, or deceptive
  signals), and receiver manipulation/sensory exploitation (e.g., the receiver''s
  pre-existing preferences being exploited). A theory that says signals are always
  honest is false.

  6. Receiver side: must say something about receiver psychology — why receivers respond;
  the costs borne by receivers; the possibility of signals that are costly to the
  receiver rather than the signaller.

  7. Must be falsifiable/testable and non-vacuous: the "just-so story" worry — a theory
  that can always redescribe any trait as a handicap has no content; so it must generate
  differential predictions (e.g., condition-dependence of the signal, the signal''s
  expression should vary with quality/condition, and there should be a measurable
  cost or a link to quality).

  8. Must respect the difference between the *cost that ensures honesty* and *cost
  that is a byproduct*; and the difference between production cost and receiver-imposed
  cost (sanctions/punishment enforcing conventional signals).

  9. Must be consistent with the empirical record that some classic textbook examples
  are contested (e.g., the peacock''s tail: whether it functions as a handicap signal
  is not settled — there are studies both ways). Hmm, this requires care; I could
  phrase it generically: "must survive the fact that the paradigm examples are empirically
  contested".

  10. Must handle multi-audience signalling: the same trait may signal to mates, rivals,
  predators, and offspring simultaneously — so the theory must not assume a single
  receiver with a single interest; and the cost-benefit accounting must be able to
  sum across audiences. Also, e.g., stotting: signal to predator or to conspecifics?

  11. Must distinguish the handicap principle as a claim about the evolution of the
  signal from the broader claim that "waste is everywhere a proof of quality" (the
  pop-science overreach). Maybe as a desideratum: it should tell us which human cultural
  phenomena (conspicuous consumption, religious ritual, charity, art) fall within
  its scope and which are merely analogous.

  12. Group/handler? Perhaps: must say whether the account is individual-level (signaller
  pays) or can accommodate collective signalling (group-level honest signals like
  "coalition strength"), and whether it requires that the signaller be an agent with
  strategy.


  Joint unsatisfiability candidates:

  - (a) "cost is what guarantees honesty" vs (b) "cheap index signals are honest":
  jointly unsatisfiable as a single mechanism, so the theory must be pluralistic (a
  disjunction of mechanisms) — and any theory demanding a single mechanism fails.

  - (a) "signals must be costly to be credible" vs (b) "signals should evolve to be
  as cheap as possible / there should be no waste at equilibrium" — if you demand
  that honesty be explained by waste, you can''t also demand efficiency; a formalisation
  (Grafen''s) achieves honesty with minimal cost, which seems to make the "handicap"
  idea vacuous, while Zahavi''s original demands waste and thus seems to predict inefficiency.
  So the tension: either waste is essential (then the theory is false in cheap-signal
  cases) or waste is incidental (then "handicap" loses its explanatory bite). This
  is a nice pair.

  - "must be falsifiable" vs "the handicap interpretation is a fallback that can absorb
  any evidence" — a genuine tension with how the principle has been used in practice.

  - "signals are honest" vs "deception exists" — the theory must be frequency-dependent.


