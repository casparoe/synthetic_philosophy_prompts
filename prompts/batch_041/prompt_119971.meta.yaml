  student must stake a token on each of their 12 claims. Then the group compiles a
  "book": all 192 claims. The book''s preface, signed by all, states a confidence
  that at least one claim in the book is false.


  Phase 2: a "market maker" (facilitator) offers trades: buy each claim at 12:1 (i.e.,
  stake 1 to win 12 — implying 92% confidence). And separately offers to buy the *conjunction*
  of any student''s 12 claims at some odds. Because the conjunction of 12 claims each
  at 92% is ~37%, the market maker can profit from anyone who buys all 12 individually
  and also sells the conjunction. Participants who do both lose money with high probability.


