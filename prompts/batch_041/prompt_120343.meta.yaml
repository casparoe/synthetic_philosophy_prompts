  whether reinforcement learning agents could suffer, but I want to avoid the well-worn
  route of asking whether they are conscious in the human sense. Instead, I want to
  take seriously the idea that a reward signal, or something functionally adjacent
  to it, might play the role that valence plays in organisms: a scalar that labels
  states or transitions as good or bad, biases choice, modulates memory and attention,
  and underwrites avoidance learning. Call that the reward-as-valence hypothesis.
  I am interested in the conceptual work needed to make that hypothesis precise and
  in what would have to be true for it to support a claim about suffering rather than
  mere preference.


  Please give me a prioritized agenda of the open questions in this area. I am one
  student with one semester and no lab access, so I care about questions that are
  tractable through conceptual analysis and careful engagement with existing formal
  results, not questions that require new experiments. For each question, explain
  why it is upstream of the others, how much other work depends on it, and what a
  convincing answer would look like. I would like the ranking defended by criteria
  such as importance, tractability, neglectedness, and how many downstream questions
  collapse once it is settled. I am especially interested in whether the following
  lines of thought should be near the top or are distractions: the distinction between
  liking and wanting as applied to learned policies; the possibility that valence
  is better modeled as a control signal that sets learning rates, exploration temperature,
  or precision weighting than as a reward prediction error; the difference between
  model-free and model-based agents for locating anything like suffering; and whether
  distributional reinforcement learning gives a better home for valence than scalar
  expected reward. Do not give me a bibliography or reading list; I want an argument
  about what deserves attention and why.


