  Summary draft:


  "Expressivism holds that moral judgements do not describe the world; to call an
  action wrong is not to state a fact about it but to express the speaker''s attitude
  of disapproval, in the way that ''Boo for that action'' expresses one. The Frege–Geach
  problem — also called the embedding problem — is the standard objection. It observes
  that if ''lying is wrong'' merely expresses an attitude, then the antecedent of
  ''If lying is wrong, then getting your brother to lie is wrong'' is not being asserted,
  so it expresses nothing at all, and the conditional has no content for the expressivist
  to analyse. The inference from ''Lying is wrong'' and ''If lying is wrong, then
  getting your brother to lie is wrong'' to ''Getting your brother to lie is wrong''
  therefore comes out invalid on expressivist terms, although it is obviously valid;
  and since moral argument consists largely of such inferences, expressivism cannot
  account for it. The same difficulty appears in the fact that two people who disagree
  about whether lying is wrong are contradicting one another, while two people who
  merely have opposed attitudes are not. Expressivists have generally conceded the
  objection and now claim only that the inference is pragmatically acceptable rather
  than logically valid — that we are entitled to move from the attitudes to the conclusion
  even though no entailment holds. Because the point of moral reasoning is that it
  can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."


  That''s good. Subtle issues: (a) "express nothing at all"/"no content to analyse"
  — the real problem is that expression-of-attitude can''t be the meaning of the embedded
  sentence, not that the antecedent expresses nothing (for anyone, unasserted antecedents
  don''t assert; Frege''s point is precisely that the thought is the same); (b) "comes
  out invalid" vs. "cannot be explained as valid" — the objection is that expressivism
  lacks the resources to explain validity, not that the argument is invalid; (c) conflating
  Frege–Geach with the disagreement problem ("the same difficulty appears in...")
  — related but distinct (the disagreement problem / negation problem); (d) "conceded
  and retreated to pragmatic acceptability" — misrepresents the state of play; also
  "pragmatically acceptable rather than logically valid" is a position few hold in
  that form, and the quasi-realist program is precisely aimed at vindicating the appearance
  of validity; (e) "refuted expressivism" — overstatement; (f) "does not describe
  the world" — most expressivists would accept roughly, but the paragraph''s slide
  from "doesn''t describe" to "is not the kind of thing that can be true or false"
  — the paragraph doesn''t say that explicitly, hmm. It says "does not describe the
  world; to call an action wrong is not to state a fact about it". A quasi-realist
