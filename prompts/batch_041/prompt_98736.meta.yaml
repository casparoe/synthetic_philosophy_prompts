  Potential prompt:


  "I have been trying to understand why the scholarly and public argument over democratic
  backsliding has stalled, and I want a diagnosis of the disagreement rather than
  another tour of the cases. Begin with your diagnosis in the first sentence, then
  give the reasoning; no preamble and no restating of my question.


  The debate I have in mind runs across comparative politics, constitutional law,
  and political commentary. One side treats democracy as a set of electoral procedures—free
  and fair elections, alternation in power, universal suffrage—and therefore asks
  whether a given country has crossed a threshold into competitive authoritarianism
  or full authoritarianism. On that view, Hungary after 2010, Poland under Law and
  Justice, Turkey after the failed coup, and the United States during and after the
  Trump presidency differ enormously: some are authoritarian, some are not, and calling
  all of them backsliding flattens the differences. Another side treats liberal rights,
  judicial independence, media pluralism, and minority protection as constitutive
  of democracy rather than as optional constraints on it, and therefore sees a common
  pattern of erosion in all four cases even where elections remain competitive. A
  third group suspects that the concept has become a partisan label: that it is applied
  to right-wing populists but not to comparable abuses by other governments, and that
  its apparent empirical content is doing less work than its rhetorical function.
  A fourth group thinks the real issue is measurement: the indices disagree, the baselines
  are arbitrary, and we cannot say whether a country is backsliding without first
  fixing what democracy is and when it was healthy. A fifth group, which I find hardest
  to place, says the concept is fine but the temporal frame is wrong—that what looks
  like backsliding is sometimes a failed attempt, sometimes a reversion after a previous
  deepening, and sometimes a normal oscillation that only looks linear when you pick
  the wrong starting point.


  My hypothesis—offered as a hypothesis, not as a conclusion—is that the impasse is
  not primarily empirical. The sides agree on many of the events but disagree about
  what those events are events of: whether democracy is a threshold concept, a graded
  property, or a family of institutional arrangements; whether liberal rights are
  part of the definition or external constraints; whether the unit of analysis is
  the regime, the government, or the constitutional order; and whether the point of
  the concept is explanation or condemnation. If that is right, then the disagreement
  is partly verbal and partly substantive: verbal because different sides attach different
  senses to democracy and backsliding, substantive because those different senses
  generate different predictions and different practical recommendations. But I am
  not confident. It may instead be a hidden empirical dispute about whether democratic
  erosion actually has a common mechanism—executive aggrandizement, autocratic legalism,
  media capture, electoral manipulation—or a dispute about which cases count as data,
  or a normative dispute about whether a democratically elected government that violates
  liberal rights is failing democracy or fulfilling a majoritarian conception of it.


  What I want from you is a diagnosis with reasons. Tell me what kind of disagreement
  this is: a verbal dispute about words, a substantive disagreement about facts, a
  disagreement about standards of evidence or about which cases are data, a clash
  of starting intuitions that neither side can argue for, a case of two sides answering
  different questions under one name, or an impasse that shows the question is ill-posed.
  Use what the sides actually say about Hungary, Poland, Turkey, and the United States
  to support the diagnosis, and be concrete about where they part company. Then tell
  me what would count as progress given your diagnosis—a distinction, a measurement
  convention, a formal result, a change of question, a decision to split the concept
  into several—or argue that no progress should be expected and explain why. I am
  not asking for a bibliography or a reading list; I want the structure of the disagreement
  and an honest answer about whether it can be resolved."


