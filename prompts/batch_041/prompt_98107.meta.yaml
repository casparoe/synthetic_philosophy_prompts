  ---


  Write an essay on the following controversy in the philosophy of history, and end
  with a verdict you are willing to defend.


  The controversy concerns what it is to explain a past event. On one view — the covering-law
  model, standardly traced to Hempel — an explanation of an event consists in showing
  that it followed, with deductive or probabilistic necessity, from general laws together
  with statements of antecedent conditions. On this view, explaining and predicting
  are the same operation run in different directions: if you can explain an event,
  you could in principle have predicted it, and the difference between the historian
  and the prophet is only the direction of the inference. On the rival view, historical
  explanation is narrative. The historian explains by telling a story — arranging
  events into a sequence with a beginning, a middle, and an end, tracing how one thing
  led to another — and the intelligibility of the event comes from its place in that
  story rather than from its subsumption under any law.


  A few considerations that the essay should engage with, whether to use or to resist:


  1. The vacuity problem. The laws that historians actually cite tend to be either
  trivial ("people generally pursue what they take to be their interests") or tacit
  and unstated, and it is unclear what observation would refute them. Worse, it seems
  that any explanation, once given, can be fitted to the covering-law form after the
  fact by supplying some law or other. If a model of explanation can always be satisfied
  retroactively, we should ask whether it is doing any work — or whether it is a motte-and-bailey,
  with the trivial claim that explanations involve generality as the motte and the
  strong claim that they must invoke real laws as the bailey.


  2. Narrative sentences. Many statements historians make describe an earlier event
  under a description that only became available later. A sentence can pick out a
  person by a work they had not yet written, or an event by a consequence it had not
  yet produced. If historical descriptions are in this way essentially retrospective,
  then the symmetry between explaining and predicting may be an illusion: the historian
  can say of an earlier moment what no contemporary could have said, and this looks
  less like subsumption under law than like the ongoing redescription of the past
  as the story lengthens.


  3. Colligation. One tradition holds that we explain an event not by deriving it
  but by locating it within a larger whole — a movement, a period, a plot — such that
  the event becomes intelligible as a part of that whole. Is this a genuine third
  form of explanation, or just narrative under another name?


  Write an essay that states the strongest version of each side (steelman both), identifies
  the crux on which the disagreement turns, and then commits. Is historical explanation
  ultimately a species of covering-law explanation, is narrative explanation irreducible,
  or is the dispute — at least in part — merely verbal, with the two sides answering
  different questions under one word? Say which, and say what would have to be true
  for you to change your mind. Do not end on a non-committal note. No citations or
  reading lists are required; argue from the positions as characterized above.


  ---


