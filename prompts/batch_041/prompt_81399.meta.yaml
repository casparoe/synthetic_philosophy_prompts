  Potential prompt:


  "I am a novelist finishing a book that braids two stories: a woman who signs an
  irrevocable private contract with a custodian to keep her from abandoning a manuscript,
  and a small parliamentary republic that entrenches a fiscal rule in its constitution.
  Both are commitment devices; both raise the same family of questions; and I find
  that the philosophical literature I have read gives me the standard cases without
  giving me the specification I need. Before I decide what my characters can honestly
  do, I want the desiderata any adequate theory of precommitment -- personal and constitutional,
  treated together and separately -- must satisfy.


  Give me the requirements list. For each, state the requirement, the case or consideration
  that motivates it, and whether you take it to be non-negotiable or a preference
  of one camp. I want the cases that a theory must get right, including at least these:
  the classical case of a person who binds her future self to avoid anticipated weakness
  of will; the case of a future self who has changed her values and does not consent
  to the binding; the case of a commitment that is rational ex ante but catastrophic
  ex post because of information unavailable at signing; the case of a constitution
  that cannot be amended, or whose amendment procedure is itself entrenched, or that
  includes a clause forbidding any future amendment to that clause; the case of a
  generation that binds its successors; the case of a precommitment used to entrench
  an morally odious end, such as a constitution that protects a caste system or a
  personal contract that enforces an addiction; and the case of a commitment device
  whose enforcer is a third party with interests of its own. I also want you to consider
  some less familiar structures I am using in the novel: a sunset clause that renews
  by default unless the bound party performs a costly public act of revocation; a
  two-tier arrangement in which the bound self may petition an independent custodian
  for release, but the custodian''s decision is final and unreviewable; a self-binding
  contract that contains a clause requiring the bound self to write a public justification
  before any revocation, and a constitutional provision that entrenches not a policy
  but the procedure by which policies are entrenched. Treat these as test cases, not
  curiosities.


  The desiderata should include at least: what it is for a commitment to be binding
  rather than merely costly to break; how a theory distinguishes precommitment from
  ordinary preference change, from coercion, and from paternalism; what normative
  status the later, dissenting self''s preferences have; whether the legitimacy of
  a precommitment can be separated from its effectiveness; how a theory handles the
  dead hand of the past without making all constitutional entrenchment illegitimate;
  how it accounts for the difference between a person and a polity as the subject
  of precommitment -- for example, the absence of a single unified preference, the
  presence of successive generations, and the fact that the enforcer is often the
  same collective agent that is bound; and how it reconciles the rigidity needed for
  a commitment to do any work with the flexibility needed to correct for error and
  changed circumstance. Add any requirement you think I have missed, and say which
  single requirement does the most to exclude the most popular theories.


  Finally, mark any pair or subset of desiderata that you suspect cannot be jointly
  satisfied. If the list itself implies that no theory can have everything -- that
  some commitments must be either illegitimate or ineffective, or that the same device
  cannot be both self-imposed and other-enforced -- say so plainly. That result is
  more useful to me than a scorecard. If you do score the main families of view against
  the list -- the prudential self-control account, the consent-based account, the
  sovereignty or constituent-power account, and the narrative-identity account --
  keep it brief and subordinate to the criteria. I am not asking for a bibliography
  or for names and dates; I want the specification."


