  Good''s theorem on value of information: The idea that information can never have
  negative expected value under certain conditions (Bayesian decision theory, when
  you can ignore information). Actually, Good''s theorem says expected value of information
  is non-negative — a decision maker with a prior, maximizing expected utility, cannot
  be worse off by observing additional information, provided they can ignore it and
  update by conditionalization. This is "Good''s theorem" (I. J. Good, 1967, "On the
  principle of total evidence"). The subtlety: this holds under expected utility,
  but not necessarily under other decision rules (e.g., maximin, regret minimization,
  satisficing, non-Bayesian updating). Also, information can have negative value if
  you''re not Bayesian, or if the information is about something you can''t ignore,
  or if it changes your preferences, or if it''s a commitment device, or if you can''t
  help but act on it, or if it''s a "self-fulfilling" thing. Also, the value of information
  can be negative in games (strategic settings) — being better informed can hurt you
  (e.g., in auctions, or in games where your opponent observes your information).
  Also, in the context of "information avoidance" — people sometimes avoid information,
  e.g., medical tests. That''s a rich philosophical topic.


