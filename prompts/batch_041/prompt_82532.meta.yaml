  Potential prompt:


  I am a novelist at work on a book set in a genetics clinic, and I have been trying
  to understand a protocol that the clinic treats as unremarkable but that strikes
  me as philosophically strange. The clinic offers predictive genetic testing for
  a late-onset neurodegenerative condition. It insists on thorough informed consent:
  patients must understand the disease, the limits of the test, the implications for
  relatives, the absence of cure. Yet the same protocol allows a patient to undergo
  the test and then decline to learn the result, or to designate a relative who will
  receive it, or to have it sealed until some later date. The clinic calls this the
  right not to know. I am not interested in a survey of bioethics or a reading list.
  I want to understand what this practice presupposes.


  Act as a philosopher of information and a decision theorist, with a novelist''s
  sensitivity to how people actually live with knowledge. Think carefully and begin
  by brainstorming the several possible theories of information that could lie behind
  the right not to know. Then reconstruct the implicit theory as rigorously as you
  can. What must be true about information, about the self, about autonomy, and about
  harm for the practice to make sense? Does it presuppose that information can have
  negative value even when it costs nothing and does not change the options available?
  Does it presuppose that the decision problem is not fixed—that learning a result
  creates new decisions, new obligations, new forms of identification? Or does it
  presuppose a conception of autonomy as self-authorship, on which the right to shape
  one''s own narrative includes a right to remain ignorant of some facts? Distinguish
  what the practice strictly requires from what it merely fits well with; several
  theories might license it.


  Then bring in the theorem usually attributed to I. J. Good: under a fixed decision
  problem and costless information, the expected value of information cannot be negative,
  because an agent can always ignore what she learns. The clinic''s protocol seems
  to treat information as something that can harm even when it is free and even when
  the patient could in principle ignore it. Is the practice therefore inconsistent
  with Good''s theorem, or does it deny one of the theorem''s conditions? Which condition—fixed
  decision problem, costless information, or the capacity to ignore—is doing the real
  work in the clinic''s reasoning? And is the clinic''s simultaneous insistence on
  informed consent for procedures, which seems to assume that more information is
  better, consistent with its willingness to let patients refuse information? Where,
  if anywhere, is the practice philosophically underdetermined?


  I would also like you to consider some ideas I have been reading about but do not
  fully understand: strategic ignorance, information avoidance, the distinction between
  information as evidence and information as a causal intervention, the unravelling
  problem in insurance markets, and the idea that autonomy can mean self-authorship
  rather than simply informed choice. Use them if they help; do not turn the answer
  into a literature review, and do not cite or recommend sources. I care about the
  conceptual structure, not the bibliography.


  Finally, tell me what would have to change in the clinic''s practice if we replaced
  the implicit theory with a straightforwardly decision-theoretic view of information—one
  on which the only question is whether the information improves decisions under a
  fixed set of options and preferences. What would be lost, what would be gained,
  and what would the novelist in me be able to show a character doing that the decision
  theorist could not explain? Structure your answer as: first, a short inventory of
  the possible implicit theories; second, the best reconstruction of the one the practice
  actually presupposes; third, the confrontation with Good''s theorem and the apparent
  inconsistency with informed consent; fourth, the rival views and the points of underdetermination;
  and fifth, the counterfactual clinic under the decision-theoretic replacement.


