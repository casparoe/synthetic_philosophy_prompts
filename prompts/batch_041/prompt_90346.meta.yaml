  Draft:


  I am helping draft an internal welfare standard for a retailer that sells farmed
  finfish, shrimp, and other crustaceans, and I have to justify every line of it.
  Before I write any of the substantive policy, I need the specification: what would
  any adequate theory of welfare for these animals have to deliver? Not a survey of
  positions — a list of desiderata, each with the case or consideration that forces
  it, and each marked as non-negotiable or as a demand of one camp that a rival can
  reasonably reject.


  The list should cover at least the following ground, though I expect you to add
  requirements I have not thought of and to say which of mine are not really desiderata:


  - What welfare consists in for a fish or a decapod (felt states, biological functioning,
  preference satisfaction), and whether the theory must settle that question or can
  stay neutral among answers.

  - A criterion for whether a given species is a welfare subject at all — the theory
  has to say what would make the answer yes or no for, say, a prawn, a mussel, and
  a salmon.

  - The evidential requirements: the kinds of findings (nociceptors and their central
  projections, motivational trade-offs against noxious stimuli, reversal of a response
  by analgesia, avoidance learning, self-protection, long-term effects of noxious
  experience) and how each is supposed to bear on the verdict.

  - Calibration cases: the theory must not count as sentient the things we are confident
  are not (a mussel, a plant, an immune response), and must count the things we are
  confident are (a trout). Both errors need to be priced.

  - Extrapolation: the standard will be applied across hundreds of species on thin
  evidence. The theory has to say how far a result in one taxon licenses an inference
  about another, and how to behave when the evidence for a species is only an argument
  from its relatives.

  - Practice-facing verdicts: whether it can rank or even compare the aversiveness
  of crowding, air exposure, handling, chilling, electrical stunning, live boiling
  and live chilling; and whether it must be able to say anything about killing as
  distinct from suffering.

  - Uncertainty: what the theory says when sentience is plausible but unproven, and
  whether a precautionary rule is part of the theory of welfare or an external decision
  rule grafted onto it.


  Then: flag any pair of desiderata that cannot be jointly satisfied — I am most interested
  in whether a graded, evidence-proportional view of sentience can coexist with the
  bright lines a standard needs, and in any tension between the demand for high specificity
  and the demand to avoid false negatives. Finish with a short paragraph on how a
  feelings-based theory, a functioning-based theory, and a preference-based theory
  each fare against the list.


