  My taxonomy: I distinguish three grades of teleological description. At the first
  grade we may say what a trait is for and what it would be rational for the system
  to do, with no claim at all about the system''s internal states — this is what I
  call a thin free-floating rationale. At the second grade, the attribution is licensed
  only if some internal state of the system has a causal profile that covaries with
  the relevant feature of the environment, so that we can say the state is *about*
  that feature without its being a reason for the system; call this a thick free-floating
  rationale. At the third grade we get ordinary reasons — states that the system can
  be said to hold, weigh, and act on. The unrestricted view collapses the first two
  grades into one, and I claim that this is where it goes wrong: the interesting cases
  in the literature — kin recognition, mate choice, the immune system''s discrimination
  of self from non-self, chemotaxis — are all thick, not thin, and the notion of a
  rationale without a reasoner is therefore much less cheap than it is usually made
  out to be.


