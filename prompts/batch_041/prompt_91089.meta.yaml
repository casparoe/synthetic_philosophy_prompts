  bead, moved up a gradient by a magnetic field, in a lineage of beads that has been
  sieved so that only up-gradient movers reproduce — a lineage, that is, with a genuine
  selection history. Your view licenses the same attribution: it is ''rational'' for
  the bead to move up-gradient, and nothing represents anything. Either you accept
