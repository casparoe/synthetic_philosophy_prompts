  Frege-Geach: The classic setup: "Is lying wrong? If lying is wrong, then getting
  your little brother to lie is wrong. But lying is wrong. So getting your little
  brother to lie is wrong." The expressivist says "lying is wrong" expresses a non-cognitive
  attitude, but in the conditional it doesn''t (you''re not expressing disapproval
  of lying, you''re just supposing). So the same sentence means different things in
  the two occurrences, which breaks the validity of the inference (equivocation).
  The negation problem: "lying is not wrong" — if "lying is wrong" expresses disapproval,
  what does the negation express? Not just the absence of disapproval (that would
  make "not wrong" too weak — it would be compatible with anything), and disapproval
  of disapproval seems wrong too. This is sometimes called the "negation problem"
  (Unwin, Hale, and later Schroeder, and Mark van Roojen''s "Moral Cognitivism vs.
  Non-Cognitivism"). The negation problem is a distinct problem from the embedding
  problem — some say the negation problem is a special case of the embedding problem,
  others say solving Frege-Geach doesn''t automatically solve negation.


