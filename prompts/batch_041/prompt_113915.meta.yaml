  the county anyone''s heard of. My gut is we shouldn''t put the date and the ''site
  of'' on a county plaque, but I don''t want to be the guy who tells a village their
  story is fake, and I also don''t want to be the guy who signs off on something the
  local paper will make us look stupid over in ten years.


