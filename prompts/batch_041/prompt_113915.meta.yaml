  for a traveling exhibit on the Exodus and they want our label to say the events
  are ''historically confirmed'' — their words. In November the classical society
  wants us to co-sign a thing about whether there was a Trojan war at all, and their
  draft says the archaeology ''proves'' Homer. So it''s the same question three times
  and I''d rather the committee had a rule than three fights.


  Two things I need in the memo. One, a recommendation on the plaque: approve, reject,
