  Good answer: correct (a) positive liberty in Berlin isn''t about means/resources
  but about self-mastery / who governs me, the split self, rational self ruling desires
  — so "freedom to" gloss conflates it with capability (though the "ability" reading
  is a real reading in some writers, e.g., the "triadic" analyses; but Berlin''s target
  is self-realisation); (b) republican non-domination is not a mix, it''s about absence
  of a *power* to interfere arbitrarily, a status/relation, not the absence of actual
  interference — the kind master case shows it''s not reducible to negative liberty''s
  non-interference; (c) republican liberty also isn''t positive liberty''s self-mastery,
  though the two are sometimes conflated (and Pettit is at pains to distinguish non-domination
  from self-mastery, since non-domination doesn''t require you to be the author of
  the law, just that nobody has arbitrary power over you); (d) the "which is right"
  question is a false presupposition — they''re answering different questions / tracking
  different things, though the theories are rivals in some respects (Berlin vs Pettit
  as accounts of political freedom, not merely of different things); (e) note that
  Berlin''s essay itself warns that positive liberty can slide into authoritarianism
  via the split self; and there''s a question whether "freedom" here is one concept
  contested or several concepts.


