  Possible prompt:


  "I am preparing a position paper on future contingents and want a consistency audit
  of my commitments before I commit to them in print. Here is the package I hold:


  1. Bivalence for future contingents: every proposition, including one that says
  that a contingent event will occur, is either true or false; there are no truth-value
  gaps and no propositions whose truth value is merely relative to a context of assessment.
  I reject supervaluationism and assessment-sensitive relativism for this domain.


  2. Indeterminism: the world is not deterministic. Some future events are not causally
  determined by the past and present; there are real alternative possibilities.


  3. Tenseless truth: truth is not a property that comes and goes. If a proposition
  is true, it is true simpliciter and eternally; ''will'' statements do not become
  true as their event time approaches. I do not think that ''there will be a sea battle
  tomorrow'' is true today but was neither true nor false a year ago.


  4. Truthmaker principle: every contingent truth has a truthmaker. For every true
  proposition, there is something in the world in virtue of which it is true; truth
  does not float free of being.


  5. No future facts: the past and present are real, but the future is not yet real.
  There are no future events, no future facts, and no future entities that could serve
  as truthmakers for propositions about what will happen. (I am a growing-block theorist.)


  6. No present grounding: the truth of a future contingent is not grounded in any
  present disposition, causal tendency, propensity, or ''seed'' in current things.
  To say that it is now true that a sea battle will occur is not to say that present
  conditions already contain the battle in embryonic form.


  7. Fixed past: the past is fixed and cannot be changed; there is no backward causation.


  8. Power entailment: if a proposition is true and its truth entails that I will
  not do X, then it is not within my power to do X. (I take this to be a consequence
  of the fact that I cannot make a true proposition false.)


  9. Free will: for at least some of my future actions, I can do otherwise; deliberation
  is not pointless.


  I want to know whether this package hangs together. Please separate the commitments
  that are genuinely in tension from those that only appear to be. For each genuine
  tension, say how severe it is, what exactly generates it, and what the cheapest
  revision would be and what that revision costs. Rank the genuine tensions by severity.
  Then tell me which single revision would clean up the most, and whether there is
  a way to keep (1) and (9) while abandoning something else. Do not simply list standard
  positions; trace the commitments."


