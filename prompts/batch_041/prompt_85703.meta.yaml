  (1) Bivalence and excluded middle for future contingents. Every proposition, including
  one about a contingent future event, is either true or false, and for every proposition
  and its negation exactly one is true. I reject the view that future contingents
  are neither true nor false until the future settles, and I reject the view that
  their truth value is relative to a context of assessment.


  (2) Indeterminism. The world is not deterministic. Some future events are not causally
  determined by the past and present; there are real alternative possibilities.


  (3) Tenseless truth. Truth is not a property that comes and goes. If a proposition
  is true, it is true simpliciter and eternally; future-tensed statements do not become
  true as their event time approaches. I do not think that the proposition that a
  sea battle will occur tomorrow is true today but was neither true nor false a year
  ago.


  (4) Truthmaker principle. Every contingent truth has a truthmaker. For every true
  contingent proposition, there is something in the world in virtue of which it is
  true; truth does not float free of being.


  (5) No future facts. The past and present are real, but the future is not yet real.
  There are no future events, no future facts, and no future entities that could serve
  as truthmakers for propositions about what will happen.


  (6) No present grounding. The truth of a future contingent is not grounded in any
  present disposition, causal tendency, propensity, or seed in current things. To
  say that it is true that a sea battle will occur is not to say that present conditions
  already contain the battle in embryonic form.


  (7) Fixed past. The past is fixed and cannot be changed; there is no backward causation.


  (8) Power entailment. If a proposition is true and its truth entails that I will
  not do X, then it is not within my power to do X. I take this to follow from the
  fact that I cannot make a true proposition false.


  (9) Free will. For at least some of my future actions, I can do otherwise; deliberation
