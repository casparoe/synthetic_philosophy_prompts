  I am not a philosopher and have never taken a course in political theory, but I
  have ended up in a long, repetitive argument with a group of neighbors about a rule
  in our neighborhood association. The rule requires every household to leave a two-foot
  strip of unmowed grass along the alley behind our houses. The association wants
  to remove the rule and pave the strip. The older residents oppose this, and the
  line they keep returning to is that you should not tear down a fence until you know
  why it was put there. They say the strip was probably put there for a reason, that
  we cannot see all the reasons, and that the burden is on the people who want to
  change things. I have heard the same line used about inherited institutions, constitutional
  conventions, and even about deleting old code from a software project. I want to
  know what the line actually claims.


  Please lay out, as a menu rather than a single interpretation, the distinct precise
  theses that the fence saying could be expressing. For each, say what the thesis
  is, whether it is trivial, substantive, or false, what it would require in the case
  of our grass strip, and whether it would actually support the older residents''
  conclusion that the rule should not be removed. I am especially interested in the
  difference between readings that are about our knowledge and readings that are about
  the fence itself: for example, the claim that we do not currently know the function;
  the claim that the reformer must prove the rule is useless; the claim that the rule''s
  persistence is evidence that it serves a function; the claim that it does serve
  a function even if no one remembers what it is; the claim that it was put there
  to solve a problem we can no longer reconstruct; and the claim that the reformer''s
  ignorance of a reason is not itself a reason to think there is a good one. Please
  also consider the possibility that the fence was put up for a bad reason, or for
  no reason at all, or for a reason that no longer applies, and say which of the readings
  survive those possibilities.


  Finally, I would like you to include a few readings that are not usually distinguished
  but that seem to me to be doing different work: one on which the fence is a load-bearing
  part of a larger package of practices, so that removing it alone is not a clean
  experiment; one on which the fence is a precedent, so that removing it changes what
  future removals are permissible; and one on which the fence is a coordination point,
  so that its value depends on other people also keeping their strips. Tell me which
  of all these readings the older residents most likely mean, which of them would
  actually justify blocking the change, and which are the ones that sound profound
  but collapse into the trivial observation that we should not act blindly. I want
  a list I can bring to the next association meeting.


