  ---


  I am a chartered accountant who has spent eleven years in forensic and audit work,
  and last night I spent the better part of three hours arguing with a close friend
  — a philosophy graduate student — about Nozick''s Wilt Chamberlain argument. He
  set it out as a reductio: start from any preferred distribution, let people trade
  freely and voluntarily, and you will get a lopsided result that no one can complain
  about without also condemning the free choices that produced it. I found myself
  arguing for it almost entirely in the vocabulary of my own trade, and he kept telling
  me that I was changing the subject rather than defending the argument. I would like
  to know whether he was right.


  So: restate Nozick''s entitlement theory of justice — the three-part structure he
  builds around acquisition, transfer, and rectification, his distinction between
  historical and end-state or patterned principles, and the Chamberlain argument that
  is supposed to show that any patterned principle must either be continuously enforced
  against people''s choices or abandoned — in the vocabulary of accounting, auditing,
  and asset tracing, as faithfully as you can. Treat that vocabulary as fully available
  to me and use it precisely: the ledger and the audit trail; cost basis and its carryover,
  and the resetting of basis that happens when assets pass at death; historical cost
  versus fair value, mark-to-market, impairment and lower-of-cost-or-market writedowns;
  substance over form and the willingness of the standards to look through a sequence
  of individually valid transactions; tracing assets through commingled accounts,
  including the rule that a traceable claim is capped by the lowest balance the account
  ever fell to; taint and the cleansing of taint, whether by statute of limitations
  or by the practical impossibility of following funds further; restitution, constructive
  trusts, and unjust enrichment; the fact that an audit takes the opening balances
  as given and certifies process rather than outcome. If a term in that list does
  not belong where I have put it, say so and put it where it belongs.


