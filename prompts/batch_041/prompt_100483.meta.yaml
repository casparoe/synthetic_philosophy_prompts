  "Two colleagues of mine in an alignment research group had a long argument last
  week about how to interpret a safety evaluation, and I have been unable to decide
  who has the better of it. The setup is this. We have a model that takes a task from
  a distribution D and produces an action; a harm function h assigns each action-task
  pair a value in [0,1], with 1 representing a catastrophe. The model is evaluated
  on a finite sample from D. The question is what kind of guarantee we should demand
  before deployment. A says: ''A model is safe only if its worst-case harm over the
  deployment distribution is below some threshold. Expected harm is not enough, because
  a model can have low average harm and still be catastrophic on a rare task. If the
  distribution has a long tail, the tail is exactly what we need to bound.'' B says:
  ''That standard is either vacuous or impossible. The support of D is a modeling
  choice; every real deployment has a finite set of foreseeable tasks. Worst-case
  over an arbitrarily large set will be dominated by events we cannot rule out but
  also cannot meaningfully prepare for. What we actually care about is expected harm
  under the deployment distribution, perhaps with a tail-risk measure such as the
  average harm in the worst 0.1% of cases. A model that is safe on all but a negligible
  fraction of tasks is safe enough.'' A replies: ''Negligible fractions are where
  adversaries live. If you optimize expected harm, you are explicitly training the
  model to be safe on the average and negligent on the tails. The only non-negotiable
  standard is a bound on the worst case over an adversarial distribution, not the
  training distribution.'' B replies: ''But then you need a credal set over distributions,
  and the worst case over that set is again a modeling choice. You have not escaped
  the need for a distribution; you have just hidden it in the adversary''s choice.
  And a worst-case standard can be satisfied by a model that refuses to act at all,
  which is useless.'' A replies: ''Refusal is a harm too; include it in h. And hiding
  the distribution in the adversary is fine, because it is an explicit assumption
  rather than a hidden one. The point is that the adversary''s distribution is the
  one that matters for safety.'' B replies: ''Then you are not comparing worst-case
  to average-case; you are comparing two distributions. The real question is which
  distribution is the right one to evaluate under, and worst-case is just the one
  where the adversary picks. That is a substantive empirical question, not a conceptual
  victory for worst-case.'' A replies: ''It is a conceptual victory in one respect:
  a guarantee that holds for all distributions in a credal set is strictly stronger
  than a guarantee that holds for one distribution, and strength is what we want in
  a safety case.'' B replies: ''Strength is not free. A stronger guarantee that cannot
  be met by any useful model is worse than a weaker guarantee that can be met and
  audited. You are optimizing for the feeling of safety, not for safety.''"


