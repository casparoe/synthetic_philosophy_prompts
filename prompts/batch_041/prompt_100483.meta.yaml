  Let''s draft for "Worst-case vs. average-case guarantees in AI alignment":


  "Two colleagues of mine in an alignment lab got into an argument about how to interpret
  a safety evaluation. The evaluation takes a model, a distribution D over tasks,
  and a harm function h with values in [0,1], where h=1 is a catastrophe. The model
  is run on n samples from D. Colleague A says: ''A model is safe only if its worst-case
  harm over the support of D is below a threshold. Average-case numbers are misleading
  because a model can have low expected harm and still be catastrophic on a rare task;
  and if the support is unbounded, the worst-case is what matters for deployment.''
  Colleague B says: ''That''s unworkable. The support of D is a modeling choice; every
  real deployment has a finite set of foreseeable tasks. Worst-case over an arbitrarily
  large set is either vacuous or infinite. What we actually care about is expected
  harm under the deployment distribution, possibly with a tail-risk measure like CVaR
  at 99.9%. A model that is safe on all but a measure-zero set is safe enough.'' A
  replies: ''Measure-zero sets are exactly where adversaries live. If you optimize
  expected harm, you are training the model to be safe on the average and negligent
  on the tails. The only non-negotiable standard is a bound on the worst case over
  an adversarial distribution.'' B replies: ''But then you need a credal set over
  distributions, and the worst-case over that set is again a modeling choice. You
  haven''t escaped the need for a distribution; you''ve just hidden it in the adversary''s
  choice. And a worst-case standard can be satisfied by a model that refuses to act
  at all, which is useless.'' A replies: ''Refusal is a harm too; include it in h.
  And hiding the distribution in the adversary is fine—it''s an explicit assumption,
  not a hidden one.'' B replies: ''Then you''re not comparing worst-case to average-case;
  you''re comparing two distributions. The real question is which distribution is
  the right one to evaluate under, and worst-case is just the one where the adversary
  picks.'' Please adjudicate move by move..."


