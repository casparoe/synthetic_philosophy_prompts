  Let''s draft a teaching prompt for Sen''s liberal paradox.


  Prompt:


  I am a philosophy professor, and next month I have to teach Sen''s liberal paradox
  in a ninety-minute session for first-year graduate students in a political philosophy
  seminar. They have had one introductory course in social choice, so they know what
  a preference profile and a Pareto improvement are, but they are not comfortable
  with formal notation and they have a tendency to treat impossibility theorems as
  clever parlor tricks rather than as substantive claims about value. I do not want
  you to explain the paradox to me; I want you to plan the explanation. What has to
  be in place before the paradox can even be stated so that it feels like a discovery
  rather than a trick? Which single example should carry the whole session, and what
  must that example have and lack—should it involve a prude and a lewd person, a smoker
  and a non-smoker, or something less likely to make them moralize about the preferences?
  Where exactly in the sequence should I introduce the distinction between rights
  as constraints on outcomes and rights as powers over decision procedures, and how
  do I keep them from collapsing that distinction into the usual liberal talking points?
  What misconceptions will they predictably form—that the paradox shows liberalism
  is inconsistent, that it only arises because of interpersonal comparisons, that
  a better voting rule would solve it, that the Pareto principle is the real culprit—and
  at what point in the session should I head each one off? I also want one question
