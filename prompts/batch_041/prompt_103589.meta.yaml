  Safe Pareto improvement (SPI): In a bargaining game, a deal that (a) is Pareto superior
  to the Nash bargaining solution / disagreement point, and (b) is "safe" in the sense
  that if the other player has different (e.g., more selfish, or differently-shaped)
  preferences than you assumed, you still don''t end up worse off than the original
  equilibrium. The classic example: in a Prisoner''s Dilemma-like bargaining, you
  can modify the game so that the mutual-cooperation outcome is robust to the other
  player''s type.


