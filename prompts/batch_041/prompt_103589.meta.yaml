  "Safe Pareto improvements" — from Oesterheld & Conitzer, and there''s also earlier
  work. The idea: Given a game G and a "baseline" solution concept/equilibrium, a
  transformation of the game G → G'' is a safe Pareto improvement if (1) the equilibrium
  payoff in G'' Pareto-dominates the equilibrium payoff in G, and (2) for any possible
  "type" of the other players (their preferences), the payoff in G'' is at least as
  good as in G (safety / robustness). The canonical example: in the Prisoner''s Dilemma,
  a "program equilibrium" where you can condition your action on the other''s source
  code.


  Actually, the well-known motivating example: Two players in a Prisoner''s Dilemma
  could each commit to "cooperate iff the other''s decision procedure cooperates"
  — and this is a safe Pareto improvement because even if the other is a defector-type,
  you don''t do worse than mutual defection.


