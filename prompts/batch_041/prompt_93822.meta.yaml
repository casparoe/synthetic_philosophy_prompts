  I sit on the ethics committee of a mid-sized community mental health system, and
  we are drafting a decision procedure for our clinicians on what we have been calling
  Ulysses contracts: instruments in which a patient, while competent, specifies in
  advance how she is to be treated when she later loses decisional capacity — consenting
  now to admission or medication she may refuse then, or refusing treatment she may
  then demand. Our clinicians will run this procedure at the bedside, often in under
  an hour, usually with a resident or a crisis nurse rather than a psychiatrist trained
  in ethics; the instrument must be legible to them, and the decision they reach will
  sometimes be the difference between a patient being held against her expressed wishes
  and a patient being discharged into a situation she will not survive. Our medical
  director must sign off on any override of a patient''s current refusal, and our
  legal counsel must sign off on any template language, so the procedure has to tell
  the two of them, separately, what they are being asked to authorize.


  Please write the procedure. It should be a set of questions to ask in order, what
  counts as a sufficient answer to each, where the procedure terminates in a decision,
  and — this is as important as the rest — where it must hand the decision to a person
  because the question is not one that a procedure can settle. Then run it on three
  cases: (1) a woman who, while well, executed a directive refusing electroconvulsive
  therapy and who now, in a severe episode, is asking for it and is arguably competent
  to ask; (2) a man who consented in advance to involuntary admission and who now
  refuses it, with no ambiguity about the trigger conditions; (3) a patient whose
  directive was signed during a period when, on the record, she was still ambivalent,
  so that it is unclear whether the earlier preference was ever stable.


  Some substance to work with, though you should correct me if any of it is confused.
  Our committee keeps rediscovering that "binding" is not one thing: an instrument
  can remove an option (a clinician will not write the order), raise its cost (a patient
  who knows she will be admitted if she stops attending), or hand the decision to
  a third party (a named agent with authority to admit). These fail differently, and
  the literature on individual precommitment tends to blur them. Second, every device
  is only as binding as the cost of circumvention, and someone always holds the key
  — the clinician, the named agent, the court. So I would like the procedure to require
  that, for any instrument, we name the keyholder and state what the later self would
  have to do to get released. Third, the hardest cases are not the ones where the
  earlier and later selves disagree, but the ones where the later self''s disagreement
  is itself the symptom — where refusing the treatment is evidence of the condition
  the treatment addresses. I do not think that can be resolved by a rule, and I want
  the procedure to say so rather than pretend otherwise. One of our members proposes
  that every instrument carry a mandatory adversary — a person whose only job, at
  each review, is to argue for release — and another proposes that irrevocability
  is the entire point of the instrument and any release valve defeats it. The procedure
  should be usable under either proposal, or say which it presupposes.


  Finally, a question I would like answered separately, in a page or so: our faculty
  senate has asked whether the same procedure could govern the entrenchment clauses
  in our new governance charter — supermajority requirements, an endowment spending
  formula, protections for academic freedom. I suspect the analogy breaks, because
  a body of people across generations is not one person across time, and because the
  dissenters in a constitutional precommitment were never parties to the agreement
  in the way a patient is. Tell me whether the break is deep enough that the bedside
  procedure would mislead if transplanted, and if so, exactly which steps have to
  change. Do not answer with a survey of the literature on constitutionalism; I want
  the disanalogy stated precisely enough that I can explain it to the senate in ten
  minutes.


