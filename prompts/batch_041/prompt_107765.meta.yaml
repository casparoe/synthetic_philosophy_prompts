  Pasadena game: A fair coin is tossed until it lands heads for the first time. If
  it lands heads on toss n, you receive $2^n / n, and the sign is positive if n is
  odd and negative if n is even. So payoff = (-1)^(n-1) * 2^n/n. Probability of heads
  first on toss n = (1/2)^n. So expected value = sum_{n=1}^∞ (-1)^(n-1) (2^n/n)(1/2)^n
  = sum (-1)^(n-1)/n = ln 2. Conditionally convergent. So the "expected value" is
  ln 2 if you compute term-by-term in the natural order, but the series isn''t absolutely
  convergent, so the Lebesgue integral doesn''t exist: E = E+ - E- = ∞ - ∞, undefined.


