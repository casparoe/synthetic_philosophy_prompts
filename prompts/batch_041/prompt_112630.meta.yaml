  that rational agents cannot agree to disagree, but the theorem establishes only
  that agents who already share a common prior over a common state space, and who
  have common knowledge of one another''s posterior probabilities, cannot have different
  posteriors. It is silent on the cases that matter for peer disagreement, because
  those cases typically involve what I call state-space disagreement: agents who partition
