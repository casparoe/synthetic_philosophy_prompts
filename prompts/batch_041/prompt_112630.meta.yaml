  the salient ones, or who do not share a common prior in the first place. The theorem
  is therefore a consistency result about a highly idealized model, not a normative
  constraint on rational disagreement. I will also argue that the common prior assumption
  is not a requirement of rationality but a substantive modeling choice, and that
  treating it as a rationality requirement begs the question against the disagreement.


