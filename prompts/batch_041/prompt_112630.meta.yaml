  Let''s write:


  I have just spent most of a weekend arguing with a friend who works in game theory
  about Aumann''s agreement theorem, and I am now scheduled to present my side of
  the argument to a formal epistemology reading group. The group consists of three
  game theorists who know the theorem and its proof cold, two probabilists who are
  sympathetic to Bayesian idealization, and one philosopher of science who is skeptical
  of applying formal results to real disagreement. I need a Q&A prep sheet, not a
  defense.


  The thesis I will defend is this: Aumann''s theorem is routinely cited for the claim
  that rational agents cannot agree to disagree, but the theorem only establishes
  that agents who already share a common prior over a common state space, and who
  have common knowledge of each other''s posterior probabilities, cannot have different
  posteriors. It is silent on the cases that matter for peer disagreement, because
  those cases typically involve what I call state-space disagreement: agents who partition
  the same underlying reality differently, or who disagree about which events are
  the relevant ones, or who do not share a common prior in the first place. The theorem
  is therefore a consistency result about a highly idealized model, not a normative
  constraint on rational disagreement. I also want to argue that the common prior
  assumption is not a requirement of rationality but a substantive modeling choice,
  and that treating it as a rationality requirement begs the question against the
  disagreement.


