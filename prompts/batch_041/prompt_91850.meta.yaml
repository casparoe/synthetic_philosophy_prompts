  "I''ve spent a long time in the rationalist blogosphere — Sequences-era LessWrong,
  the decision-theory wars, all of it — and I''ve recently landed in a graduate seminar
  on archaeological inference, where a slogan keeps getting deployed in ways that
  I suspect nobody has actually cashed out: ''absence of evidence is not evidence
  of absence.'' I want a full disambiguation before the next meeting.


  Here''s the episode. A classmate argued that because the excavated sample from a
  particular settlement contains no evidence of some practice — I''m deliberately
  keeping it generic, since the same pattern recurs — the practice probably didn''t
  exist there. The professor replied with the slogan and moved on. Later in the same
  session, another student defended a different claim by saying that absence of evidence
  is evidence of absence. Both statements got nods. I''ve internalized enough Bayesian
  machinery to be suspicious of that, but I don''t trust myself to say exactly where
  the sleight of hand is, because in some framings the professor is obviously right
  and in others the classmate is.


  Act as a philosopher of science with real expertise in Bayesian confirmation theory
  and in the epistemology of archaeology — specifically the inference from taphonomy,
  preservation bias, sampling design, and formation processes to claims about past
  beliefs and institutions. Think carefully and work in stages: first brainstorm,
  listing every distinct reading of the slogan you can generate, including bad ones;
  only then organize and evaluate. Don''t stop at two or three readings.


  What I want back:


  1. A menu of precise claims. For each reading, state what it commits you to in terms
  of probabilities, quantifiers, and scope — e.g., whether it''s a claim about likelihoods,
  about the possibility of proof, about the evidence-gathering procedure, or about
  what a community should believe. Mark each as trivially true, substantive and defensible,
  false, or ambiguous-but-repairable. Say which one the professor almost certainly
  meant, and whether that reading actually licenses dismissing the classmate.

  2. The mirror slogan, read the same way, plus which readings of the two slogans
  are genuine contraries and which are compatible.

  3. How ''you can''t prove a negative'' fits: same claim, a corollary, or something
  else entirely.

  4. An assessment of a distinction I''ve been groping toward: record-absence versus
  world-absence, where the first is a fact about what the excavation and its detection
  profile could have turned up and the second is a fact about the past. Tell me whether
  that''s the right cut, how you''d sharpen it, and what the analogue of a detection
  profile is when the evidence is texts or architecture rather than bones.

  5. A short list of diagnostic questions I can ask in the moment — the ones that
  would force whoever deploys the slogan to commit to a reading.


  No citations or reading lists, please; I''m after the argument, not the literature,
  and I''d rather you reconstruct it from first principles than gesture at authorities.
  Write in American English, and flag anywhere you''re genuinely unsure rather than
  papering over it."


