  Argument:

  1. If a perceptual experience has a certain content, and a belief of yours (or a
  desire, or a concept you have) makes a difference to what content you end up with,
  then your cognition has penetrated your perception. (definition of penetration as
  any top-down influence on content)

  2. Background knowledge and expectation always make a difference to what you end
  up perceiving. E.g., you hear the ambiguous signal as a word in your language, you
  see the blurry shape as a mailbox rather than a bush because you know you''re walking
  past the post office. Also, learning to read changes what you see; learning a skill
  changes what you notice.

  3. So all perception is cognitively penetrated.

  4. If all perception is cognitively penetrated, then there''s no interesting distinction
  between what perception delivers and what cognition adds; the "penetration" thesis
  has no content, because it doesn''t contrast with anything.

  5. So the literature''s central question — "can cognition affect perception?" —
  is either trivially answered yes, or covertly asks something else.

  6. And by the way, the same reasoning shows perception can''t be a neutral source
  of evidence: if what you see always depends on what you believe, then any belief
  you base on perception is partly based on itself. (This is the extra step, maybe.)

  7. So either (a) cognitive penetration is real but trivial, or (b) it''s real and
  epistemically disastrous.

  8. Neither, so something''s wrong with premise 1.


