  Also a good "proves too much" element: the argument proves too much because it would
  count *the fact that your retinas face forward* or *that you blinked*, or trivially,
  "you wouldn''t be perceiving if you were asleep" as penetration, since any background
  condition makes a difference. That''s a nice reduction: if "makes a difference to
  the content" is the criterion, then the state of your eyes, your blood sugar, the
  lighting all "penetrate" perception — the notion of cognitive penetration collapses
  into "perception has causal conditions," which is trivially true. So premise 1 is
  too permissive; the fix requires distinguishing *which* differences matter (e.g.,
  a difference in content not attributable to a difference in the stimulus, attributable
  specifically to a cognitive state, in a way that isn''t just attention or adaptation),
  and that''s exactly what the interesting thesis is about — so the friend''s deflationary
  conclusion is a trick of the definition.


  Cost of rejecting premise 1: you now have to draw the line somewhere, and every
  plausible line has costs: if you say only *content-changing* effects count, you
  need a principled way of individuating perceptual content (which is itself contested
  — rich vs thin content). If you say only effects not mediated by attention count,
  you need a principled distinction between attention and cognition, and there''s
  evidence that attention is itself cognitively driven. If you say only effects that
  aren''t the result of "perceptual learning"/"sensory adaptation" count, you need
  to say why learning to read or to distinguish chickens by sex (that''s a real example:
  chicken sexers) doesn''t count — but many think perceptual learning is a form of
