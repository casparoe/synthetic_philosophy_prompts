  \ justice and force.\n- Analytic-synthetic and Quine.\n\nThe \"proves too much\"\
  \ type wants a chain of reasoning with a subtle flaw or a least-costly premise to\
  \ give up. Let me think about which gives the richest, most in-the-weeds argument.\n\
  \nAugustine on lying is nice: Augustine holds that every lie is a sin, including\
  \ lies that save lives (the famous case of whether to lie to protect someone from\
  \ a would-be murderer, or lying to save someone's life; also the case of Jacob/Esau,\
  \ the Hebrew midwives, Rahab, etc.). Augustine's view is that lying is never permissible.\
  \ But he also has the \"mendacium\" definition — he says a lie is a false signification\
  \ with the intent to deceive (falsa significatio cum voluntate fallendi). Actually\
  \ Augustine's definition in De Mendacio: \"a lie is a false signification with the\
  \ will to deceive\" — hmm, need to be careful. Augustine: \"Mendacium est quippe\
  \ falsa significatio cum voluntate fallendi\" (Contra Mendacium / De Mendacio).\
  \ Also there's the tricky issue of whether someone who says a false thing believing\
  \ it true is lying (Augustine says no — it's not a lie if you believe it, because\
  \ you're not willing to deceive... actually he says the person who says a falsehood\
  \ believing it true is not lying in the strict sense — but wait, he also considers\
  \ the case of the person who says something false believing it true; he says it's\
  \ not a lie). And the case of the person who tells the truth intending to deceive\
  \ (e.g., telling the truth to a pursuer in a way that misleads) — Augustine says\
  \ this is not a lie because no false signification, but he thinks it's... Hmm. Actually\
  \ Augustine discusses whether \"not revealing the truth\" is lying.\n\nA \"proves\
  \ too much\" argument from Augustine: An argument built from Augustine's premises\
  \ that every lie is a mortal sin, plus a step about what counts as lying, which\
  \ yields absurd results like: a person who jokes, or a person who says \"I'm fine\"\
  \ to a casual greeting, or a soldier misleading an enemy, or someone who denies\
  \ a truth in order to prevent a murder, all sin mortally; also that the person who\
  \ tells a truth with intent to deceive is innocent — which seems worse.\n\nActually\
  \ a nice \"proves too much\" structure: \n(1) A lie is a false signification with\
  \ the intention of deceiving (Augustine's definition).\n(2) A person who says what\
  \ is false while believing it true doesn't lie (Augustine says so) because they\
  \ lack intent to deceive.\n(3) But the person who says what's true with the intent\
  \ to deceive doesn't lie either, because their signification isn't false.\n(4) So\
  \ the whole moral weight falls on the falsity of the signification, not the deception.\n\
  (5) But then a person who utters a falsehood to save a life is a liar and sins mortally,\
  \ while a person who tells the truth precisely in order to get someone killed is\
  \ not a liar.\n(6) A doctrine that condemns the merciful deceiver while acquitting\
  \ the murderous truth-teller has its moral center of gravity in the wrong place.\n\
  (7) So premise (1)'s definition, or the moral principle, is wrong.\n\nThat's a genuinely\
  \ interesting \"proves too much\" argument. Hmm, but is it \"too much\"? It shows\
  \ Augustine's account has a bad implication. The flaw could be that the definition\
  \ of lying has two components and both are needed; the case of the truth-teller\
