  Draft:


  "You are a philosopher of physics with expertise in the metaphysics of time, the
  philosophy of special relativity, and the interpretation of spacetime theories.
  I want you to think carefully and systematically about the following position, which
  I have come to hold, and then tell me what would count against it.


  The position, in its strongest form, is a package with three claims. (1) Special
  relativity, together with a modest premise about the reality of events that are
  neither in my past nor my future light cone, supports eternalism: all events in
  spacetime are equally real, and there is no objective, global present. (2) The ''block''
  is not merely a useful representation; it is the mind-independent structure of reality.
  (3) The passage of time and the sense of a moving ''now'' are features of our perspective
  as embedded observers, not fundamental features of the world. Call this package
  ''indexical eternalism'' if that helps; I am using the label stipulatively, not
  as a piece of established terminology.


  I am not asking for a literature survey, and I do not want citations. I want a map
  of the position''s exposure. Start by brainstorming as many potential defeaters
  as you can, including ones that are not the usual presentism-versus-eternalism talking
  points. Then organize them by what exactly they target: the inference from relativity
  to eternalism, the metaphysical core of eternalism, or the claim that temporal passage
  is illusory. For each, say whether it would be fatal, seriously damaging, or merely
  awkward; whether a committed defender of the package would concede it as a defeater
  or dismiss it as question-begging; and what further argument or result would be
  needed to make it stick.


  In particular, I want you to consider: (a) whether the inference trades on a controversial
  convention for defining simultaneity, or on a premise about the transitivity of
  existence that a rival could reject; (b) whether ''existence'' is being used univocally
  across frames, and whether a relativized or indexical reading of existence would
  save the argument or trivialize it; (c) whether the block universe can accommodate
  genuine openness, becoming, or causal asymmetry without covertly reintroducing a
  privileged present; (d) whether quantum nonlocality, cosmological time, or the thermodynamics
  of time''s arrow give any independent reason to reject the package; and (e) whether
  the package has been qualified into unfalsifiability -- that is, whether there is
  anything that a sufficiently clever defender could not absorb.


  Finish by ranking the defeaters from most to least decisive and by telling me honestly
  whether the position is well insulated. If it is, say whether that is a virtue (because
  it is a metaphysical framework) or a problem (because it risks saying nothing)."


