  Potential final prompt:


  "I''m a third-year undergraduate, and this term I''m taking a seminar on value theory
  while also working as a peer tutor for the introductory course ''Reasoning and Value.''
  Next week I have to run the fifty-minute section on whether ''better than'' is transitive,
  and the professor wants it built around what she calls a spectrum argument: a sequence
  of cases where each adjacent pair seems to be related by ''better than,'' yet the
  two ends reverse. The students are first-years who have had one lecture on relations
  and transitivity (they can define transitivity, symmetry, reflexivity) and one on
  pairwise preference, but they have not seen any of the standard population-ethics
  or torture-versus-dust examples; the professor name-dropped those, so I want to
  avoid them and have the section feel like we are discovering the problem ourselves.
  I have been developing a case I call the chocolate spectrum, and I want it to carry
  the whole section. Imagine 101 chocolate bars, numbered 0 to 100, where bar n contains
  n percent cacao. A panel of expert tasters, working pairwise and blind, judges bar
  n+1 better than bar n for every n from 0 to 99: each step adds a barely perceptible
  increment of intensity and complexity that the panel, tasting only those two bars
  side by side, prefers. But when the panel tastes bar 0 and bar 100 side by side,
  it overwhelmingly judges bar 0 better, because bar 100 is bitter and unpalatable.
  If ''better than'' is transitive, the 99 adjacent judgments imply that bar 100 is
  better than bar 0, contradicting the direct judgment. So either transitivity fails,
  or one of the judgments is not really a judgment of betterness, or the pairwise
  context changes what is being judged. I am worried the students will hear this as
  a mere preference reversal or a sensory illusion rather than a genuine challenge
  to the transitivity of betterness, and I am not sure whether to keep the example
  as is or modify it so the endpoints involve something less obviously sensory."


