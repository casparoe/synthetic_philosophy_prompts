  Draft:


  "I want an essay on a question in the philosophy of computability that I keep failing
  to settle: what exactly is the Church–Turing thesis a claim about, and what is its
  epistemic status? I don''t want a survey of the literature or a history of Hilbert''s
  programme; I want an argument that ends in a verdict.


  To keep the discussion honest, I''ll fix three things the phrase ''the Church–Turing
  thesis'' is used for, and I want you to keep them apart throughout:

  (i) the mathematical thesis — that the informal notion ''computable by an effective
  procedure'' coincides in extension with ''computable by a Turing machine'';

  (ii) the physical thesis — that no physical device, actual or possible, computes
  a function that no Turing machine computes;

  (iii) the cognitive thesis — that no procedure a human being can carry out by rote
  exceeds the Turing limit.

  ..."

  Then: "For each, say whether it is best read as a definition, as an empirical hypothesis,
  as a theorem in disguise (with the informality discharged by an axiom system), or
  as something else. I''m particularly interested in the following two pressure points:

  (a) The definitional reading looks as if it makes the thesis true but empty... Yet
  the thesis is not obviously empty: it predicts the failure of every proposed machine,
  and it has been used to *identify* a class of functions (the recursive ones) as
  the right extension of a pre-theoretic notion. Is there a way of reading it as both
  true-by-stipulation and substantive, or must one choose? ...

  (b) There''s a strategy of proving as much as can be proved: give axioms for what
  counts as a ''mechanical'' step or procedure, and then prove that anything satisfying
  them is Turing-computable. Say what such a result does and doesn''t establish ...
  and whether the remaining gap is one that argument could ever close, or whether
  it''s a gap we close by decision.


  Then the test case: "Here''s a device I want you to press on. Take a machine with
  a finite instruction set of the ordinary sort, but with a clock that runs twice
  as fast after each step: step one takes a second, step two half a second, and so
  on, so that infinitely many steps are completed within two seconds. Feed it a program
  that never halts in the ordinary sense. At the two-second mark, the machine has
  executed every step of a non-terminating computation. Someone will say: this machine
  decides the halting problem, so the physical thesis is false. Say precisely what
  has gone wrong — or, if nothing has gone wrong, what the defender of the thesis
  has to give up. (Note: I don''t care whether such a machine is physically buildable;
  I care what the case shows about the content of the thesis, and whether the answer
  turns on whether the machine''s ''output'' is defined at the limit.)"


  Then the verdict: "End with a verdict: which of the three theses is the substantive
  one, and what it is."


