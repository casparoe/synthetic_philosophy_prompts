  Draft:


  Explain the conceptual difficulty that Ayer''s verificationism creates for claims
  about life after death, and why the difficulty is not simply that such claims are
  unverifiable.


  The prompt should be somewhat in the weeds. So: ask about the specific structure
  of the problem. Something like:


  "Ayer''s early verificationism implies that statements about surviving one''s own
  death are not false but meaningless, since no possible observation could verify
  them. But this verdict is usually stated too quickly. Please give a careful explanation
  of the following three-way tension, and say which horn Ayer should take and why.


  First, if we try to make survival claims meaningful by tying them to experiences
  — for example, a person who is resuscitated after cardiac arrest reports watching
  the resuscitation from above and accurately describing events in the room — then
  the evidence seems to bear on whether consciousness can occur during clinical death,
  not on whether anyone survives the permanent end of their bodily life. The experience
  is an event before death, not after it.


  Second, if we try to keep the claim that it is the same person who survives, we
  need criteria of personal identity that can hold across the death of the body. Ayer''s
  own view of the self as a logical construction out of experiences makes this hard:
  continuity of memory and character can be described, but the further fact that it
  is the same subject seems to add nothing that could be observed.


  Third, if we treat survival as a decision about how to apply words rather than a
  factual claim, we seem to lose the thing that religious believers care about — not
  just that some experience continues, but that they continue.


  Then consider the case of Ayer''s own reported near-death experience late in life,
  in which he said the experience slightly weakened his conviction that death would
  be the end of him. Does that report have any evidential force for him, given that
  his own theory predicts that a dying brain can produce such experiences? Explain
  what a verificationist should say about the first-person evidential weight of an
  experience that is equally predicted by the hypothesis being tested.


  Finally, say what would have to be true for a survival claim to be genuinely verifiable,
  and whether that condition can be met without collapsing the claim into a claim
  about experiences before death."


