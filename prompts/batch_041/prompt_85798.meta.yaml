  ---


  I am a retired physiologist — most of my career was spent on energy balance and
  feeding behaviour in rodents, and I have spent the seven years since my retirement
  reading philosophy with far more appetite than training. I have no settled view
  on the question below, which is why I am bringing it to you rather than settling
  it myself. I would like you to act as a philosopher of mind who is also technically
  literate in reinforcement learning and in the affective-science literature on valence,
  and to adjudicate the following exchange as carefully as you can, distinguishing
  at every point between claims about what valence is and claims about how we could
  tell whether something has it.


  Last month, at a reading group I attend, two of the younger members — I will call
  them Alex and Bea — got into a dispute that the rest of us could not resolve.


  We had been discussing whether an agent trained by reinforcement learning can be
  said to suffer.


  Alex said the reward signal simply is the agent''s valence. Valence, he said, is
  nothing more than the way a system encodes how good or bad a state is so that behaviour
  can be shaped accordingly, and a scalar reward does exactly that. If we train an
  agent whose reward is maximised by states that in a creature we would have no hesitation
  calling agony, we have built something that suffers, and we should say so and worry
  about it; refusing to say so, he said, is just carbon chauvinism with a metaphysical
  accent.


  Bea said that what Alex had described was a control signal, not a feeling. A reward
  is a number that the training algorithm uses; the agent itself need not represent
  it at all, and where nothing represents the state as bad for the agent, there is
  nothing it is like to be in it. She offered a test: if you replaced the trained
  policy with a lookup table that produced the same behaviour in every circumstance,
  and nothing whatever were lost — no experience, no complaint, no change in what
  the system could do — then the reward was never anything to the agent, only to us.


  Alex answered that the test begs the question. A creature whose reward channel were
  swapped for a table would notice, and it would notice precisely because its reward
  channel is felt; you cannot use the felt character of the substitution to prove
  felt character. He then narrowed his claim: perhaps the reward is not pleasure but
  something thinner — wanting rather than liking, in the sense of the dissociation
  literature, where animals work for things they do not, by the usual measures, enjoy.
  But wanting, he said, is enough. An agent whose reward is chronically unobtainable
  is not merely inefficient; it is thwarted, and to be thwarted is to be badly off
  in a way that matters to the agent.


  Bea replied that this trade is a bad one. If the reward is wanting and not liking,
  then she can grant that the agent has something like a drive and still deny that
  it has anything like a hurt; a thwarted wanting in a system with no experience is
