  if all wealth is a ticket, you get a regress. Actually Berkeley says wealth = the
  four elements + labour, so the ticket is a claim on the products of labour. Then
  a "ticket" theory requires an issuer/backer: the state or the "credit" of the nation.
  Berkeley''s Q21 mentions credit circulating "by what marks or tokens soever." So
  credit is the real thing; money is just the token of credit. So: money is a token
  of credit; credit is grounded in industry; industry is grounded in wants/fashion/will.
