  Berkeley''s Querist claims:

  1. Labour (with the four elements) is the true source of wealth (Q4).

  2. Money is useful only insofar as it stirs up industry and lets people share the
  fruits of labour (Q5).

  3. The true idea of money is that of a ticket or counter (Q23), and gold/silver/paper
  are all tickets or counters (Q25).

  4. Therefore the denominations could be retained even if the bullion were gone —
  pure fiat would work (Q26).

  5. He proposes a national bank and paper credit.

  6. Also: wants/fashion shape industry (Q10, 20) — the creation of wants as a way
  to produce industry.


  Tension/crux: Berkeley treats money as a pure sign with no intrinsic value, yet
  he treats wealth as real (labour, land, the elements), and he treats the will/fashion
  of the nation as what determines the current of industry. So there are two "conventional"
  layers: money''s value is conventional (a ticket), and the direction of industry
  is conventional (fashion, will). If both are conventional, what is "real" wealth?
  Does Berkeley''s position collapse into the claim that wealth is whatever a nation''s
  prevailing will makes it? That threatens his ability to criticize luxury/stock-jobbing
  as "unreal" wealth — a criticism he clearly wants to make.


  So a good exam question: Berkeley wants to say that money is a mere ticket (conventional,
  no intrinsic value) while also insisting that wealth is real (labour, land) and
  that some economic activity is parasitic (stock-jobbing, luxury). Ask students:
  is this combination stable? What exactly is the "real" that money''s convention
  is supposed to track, and does Berkeley have the resources to distinguish productive
  from unproductive industry once he''s made money a mere ticket? And then: how does
  his theory of signs (words as signs, natural things as signs in God''s language)
  bear on this — is money a sign in the same sense as a word, or a different kind?


  That''s an in-the-weeds crux: not "summarize Berkeley''s economic views" but "does
  his conventionalism about money undercut his ability to make the substantive economic
  judgments he wants to make?"


