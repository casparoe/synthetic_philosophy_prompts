  Idea for crux: Berkeley''s "ticket or counter" theory of money is a conventionalist/semiotic
  view of money, but Berkeley is also the philosopher who denied abstract general
  ideas and who insisted that words like "force," "gravity," and "the good" don''t
  stand for ideas but function as tools. So money as a "ticket" is not the name of
  an idea but a device. The exam question could ask students to reconstruct the parallel
  between Berkeley''s theory of language (signs, non-cognitive uses of words) and
  his theory of money (money as a sign/ticket whose value is conventional), and then
  to identify where the parallel breaks down — e.g., the issue of what makes the ticket
  binding: in the linguistic case, Berkeley appeals to God as the author of the language
  of nature; for money, the issuer is the state/credit, not God. So there''s a question
  about what underwrites the "ticket" — the state''s authority, the "prevailing will
  of a nation," or industry itself.


