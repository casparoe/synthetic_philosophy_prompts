  "I want a critical reading of Matt Haig''s The Midnight Library through the lens
  of David Lewis''s modal realism. The novel''s premise -- Nora Seed suspended between
  life and death in a library where each volume opens onto a life she might have lived,
  with the librarian Mrs Elm as guide -- is usually read as a fable about regret.
  I want to know what happens when you take it as a serious piece of modal metaphysics
  instead.


  Some things to keep in view. Lewis''s view, in On the Plurality of Worlds and the
  counterpart-theoretic framework he built earlier, is not that possible worlds are
  stories, models, or ways things might have been; they are concrete universes as
  real as ours, and ''actual'' is an indexical, like ''here'' and ''now'', which picks
  out the world the speaker inhabits rather than marking any special status. So the
  library''s lives are not possible worlds in Lewis''s sense: a single consciousness
  cannot tour them, and Nora cannot be the same person across them -- at best she
  has counterparts. There is also the point Lewis insists on against consolatory misreadings:
  that a life is possible elsewhere is no compensation for anything here, and modal
  realism is not offered as comfort. And note that this is not the many-worlds interpretation
  of quantum mechanics; the branching is not physical, and the metaphysics of modality
  is not hostage to physics.


  So: does the novel implicitly assume an ersatz or ''possible-worlds-as-options''
  picture -- worlds as things a person can try on and step out of, all indexed to
  one continuing subject -- and if so, is that picture incoherent, or is it a defensible
