  Case set for the memory taxonomy (I''ll fix 8):

  1. **The illegible plaque**: a town''s only marker of a massacre has weathered away;
  restoring it would cost the youth center''s annual budget. The town votes to spend
  the money elsewhere, and instead has schoolchildren read the names aloud once a
  year. Has the town done what it owes? (tests: outward discharge vs. substantive
  memory; whether the duty is to the dead or to the living; ritual vs knowledge)

  2. **The archive that outlives its readers**: a digital archive of testimony will
  persist indefinitely; within a century no one will be able to identify with anyone
  in it, and no descendant will exist. Does a duty to preserve still bind? (tests
  whether the duty requires a rememberer / a thick relation; memory with no beneficiary)

  3. **The amnesty records**: a peace agreement grants amnesty in exchange for testimony,
  and the testimony is sealed for 50 years by the victims'' own request, then destroyed.
  Is the destruction a wrong, and if so, to whom? (tests whether the victims can waive
  the duty; whether forgetting can be authorized by the wronged)

  4. **The perpetrator''s grandchild**: a man discovers his grandfather ran a killing
  unit. He wants to move on and refuses to tell his children. Does he owe anything,
  and to whom — the victims'' community, his children, the dead? (tests inheritance
  of duty, thick relations, the agent-relative scope)

  5. **The community that stops commemorating**: a survivors'' association votes to
  end the annual ceremony because it keeps them in grief and their children don''t
  attend. Is this a failure, a permissible choice, or a virtue? (tests whether forgetting
  can be a good, Rieff-style)

  6. **The mythologized memory**: a community''s founding narrative of its persecution
  is historically inaccurate in significant ways, but it''s what holds the community
  together and motivates its care for refugees. Is an inaccurate memory a defective
  discharge of the duty? (tests accuracy vs. identity-constitution)

  7. **The inheritor who owes nothing**: someone born into a settler family with no
  personal or family involvement asks why they owe memory of a wrong done by people
  not their ancestors — but the wrong is the source of their current advantage. Does
  the duty run through ancestry or through benefit? (tests whether duty grounds in
  relation or in benefit)

  8. **The unspeakable and the unremembered**: a victim refuses to speak; the community''s
  memory is therefore thinner. Is her silence itself a wrong (a failure of the duty)
  or is the duty to remember in tension with a duty to let people be? (tests whether
  the duty is owed by the wronged to others, and the limits of the duty)


