  Careful: I need to state stage theory accurately. Let me get it right.


  Perdurantism (four-dimensionalism): objects persist by having temporal parts located
  at different times. Two versions:

  - Worm theory: ordinary objects (like you) are the whole four-dimensional "worm"
  — a temporally extended aggregate of temporal parts. Persistence is identity: you
  (the worm) exist at t1 and t2 by having parts there.

  - Stage theory (exdurantism, Sider): ordinary objects are instantaneous (or short-lived)
  stages; you are the current stage. Persistence is not identity across time but a
  relation between stages — "temporal counterpart" relation. When we say "you will
