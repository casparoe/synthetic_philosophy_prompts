  Essay draft:


  "Title: Molyneux''s Problem and the Amodal Spatial Hypothesis


  The traditional question is whether a person blind from birth, who has learned to
  distinguish a cube from a sphere by touch, could visually identify the cube and
  the sphere immediately upon gaining sight, without touching them. The usual debate
  treats this as a yes-or-no question about innate ideas or about the unity of the
  senses. I want to argue that the yes-or-no framing hides the more interesting issue:
  which properties can transfer across modalities, and under what conditions. My claim
  is that there is no single answer because touch and vision share a spatial format
  for some properties, such as extension, relative size, and perhaps number, but not
  for others, such as shape identity under rotation or object kind. Call this the
  amodal spatial hypothesis.


  I came to this from a practical direction. I work with 3D point clouds and haptic
  rendering, and I have been thinking about how a haptic glove would need to encode
  a shape so that a user could recognize it without seeing it. The mapping is not
  obvious. Edges and corners are easy to render as forces; curvature sign and topology
  are much harder. This made me suspect that the philosophical debate often assumes
  a richer notion of shape than any single sensory modality actually delivers. If
  shape is partly a matter of features that are easy for touch to encode and partly
  a matter of features that are easy for vision to encode, then the newly sighted
  person might succeed at some visual tasks and fail at others, not because of innate
  ideas but because of the structure of the perceptual formats.


  Sensory substitution devices seem relevant here. In some systems, a camera feed
  is converted into a tactile grid on the tongue or back. Users can learn to navigate
  and even reach for objects. Some report experiencing the stimulation as objects
  located in space rather than as sensations on the skin. I take this as evidence
  that a spatial format can be shared across modalities, at least after training.
  But the training matters: users often need active exploration and calibration, and
  they may be exploiting learned correlations rather than immediately seeing the object.
  So the device does not settle Molyneux''s question. It does suggest that the question
  should be decomposed into a family of questions about specific properties and specific
  tasks.


  The strongest objection I can see is that this is a psychological hypothesis, not
  a philosophical answer. Even if touch and vision share a spatial format, that does
  not tell us what the newly sighted person would actually experience. It also does
  not address the original concern about whether perceptual concepts are innate. I
  am not sure how to respond. I suspect the philosophical lesson is that Molyneux''s
  problem is not one problem but a template for asking what kind of cross-modal transfer
  is possible. But I may be missing a standard distinction between recognition and
  identification, or between perceptual discrimination and conceptual categorization,
  that would make my decomposition less novel than I think."


