  Rawls subtle errors:

  1. Conflating the veil of ignorance with a requirement to choose under a probability
  distribution (Harsanyi''s equiprobability). Rawls explicitly says the parties don''t
  know probabilities and the argument isn''t an expected-value calculation; the maximin
  reasoning is grounded in the three conditions for maximin (no basis for probabilities,
  the worst outcome is unacceptable/grave, the rejected alternatives have outcomes
  you can live with).

  2. Saying the difference principle permits any inequality that increases the average,
  or that it''s a trickle-down principle — the difference principle requires that
  inequalities be to the greatest benefit of the least advantaged, and it''s a strict
  comparison of positions of the least advantaged, not the average.

  3. Conflating the difference principle with the Pareto principle.

  4. Saying that the parties are risk-averse by nature — Rawls denies this is a psychological
  assumption; it''s a consequence of the constraints of the original position (they
  don''t know probabilities, and they must be able to honor the agreement — strains
  of commitment).

  5. Saying the veil of ignorance requires you to be ignorant of your conception of
  the good — actually parties don''t know their particular conception of the good
  but do know they have one (they know they have a rational plan of life, and they
  know primary goods are things they''d want whatever their plan). Hmm, careful. Rawls:
  parties don''t know their "conception of the good" (the particular ends) but know
  they have one. Actually more precisely: they don''t know their "final ends" or their
  "conception of the good." They do know that they want primary goods. Yes, this is
  a common subtlety.

  6. Saying the veil of ignorance is meant to model a fair procedure / pure procedural
  justice — that''s right.

  7. Saying the difference principle is chosen because it''s the maximin choice —
  partly right but with the caveat above.

  8. Saying Rawls thinks inequalities are unjust — no, he thinks inequalities can
  be just if they benefit the worst off.

  9. Conflating the original position with the state of nature / Hobbes.

  10. Saying the two principles are ordered so liberty always trumps — that''s the
  first principle''s lexical priority, roughly right.


