  become the first and third lines of the next, and the final quatrain returns to
  the first quatrain''s opening and third lines, so the poem closes into a loop. That
  circulation is why I''m asking for this form and not another: in a pantoum a line
  keeps its words and changes its sense as the frame around it changes, and a poem
  that can be read round again is a poem whose ''observed'' and ''unobserved'' readings
  cannot be told apart from the inside. Five quatrains at most; please make the returns
  exact.


