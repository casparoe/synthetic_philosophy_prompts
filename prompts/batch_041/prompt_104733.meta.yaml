  — e.g., a poem where a single line is the same text but the reader assigns two readings.
  Or a poem with two interchangeable vocabularies.

  2. Time-dependence: the predicate''s meaning hinges on a cut at t. So a poem whose
  meaning flips at a line-boundary (the volta).

  3. Entrenchment: our preference for "green" is a fact about us, not about the world.
  So the poem''s "preference" for one reading should be shown to be a habit of the
  reader.

