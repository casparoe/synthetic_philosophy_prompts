  The puzzle, as I want it in the poem: an emerald examined before some future time
  t is green; a second emerald examined before t is green; and so on. ''Grue'' applies
  to a thing just in case it is examined before t and green, or not examined before
  t and blue. Every piece of evidence we have so far is equally evidence for ''all
  emeralds are green'' and ''all emeralds are grue'', and the two hypotheses disagree
  about emeralds first examined after t. The point I want the poem to make is not
  that we can''t know the future -- that''s Hume''s problem, and it''s not the one
  here -- but that we lack an account of which predicates are fit to be projected
  from observed cases to unobserved ones, and that the standard repairs (that grue
  is disjunctive, or positional, or time-dependent, or otherwise ill-formed) all fail,
  since ''green'' can be defined from ''grue'' and ''bleen'' with the same reference
  to t, and the symmetry is total. The only thing that separates the two hypotheses,
  on Goodman''s own view, is that ''green'' is the entrenched predicate: a fact about
  our verbal habits and our past inductive practice, not about emeralds.


