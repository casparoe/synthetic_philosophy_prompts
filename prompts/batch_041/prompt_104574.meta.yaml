  ---


  I am assembling a session for an advanced seminar on the epistemology of markets,
  and I want a careful, opinionated comparison rather than a survey. The two items
  to compare are accounts of what a market price can be evidence for — of what, if
  anything, a trader learns from the fact that a price is where it is.


  The first account, which I''ll call the aggregative account, holds that a price
  is a compressed public summary of dispersed private information: when many participants
  who each know a little bid, the resulting price is a statistic that reflects more
  than any of them knows. On this view a price is evidence, and the movement of a
  price is testimony about facts the observer did not have; the market is a device
  for making private information public in a form no one could have assembled alone.


  The second account begins from an observation about trade itself. Trade requires
  disagreement: two parties exchange only if each thinks he is getting the better
  of it, which means they value the object differently or assess the same facts differently.
  Now suppose it is common knowledge that all parties are rational, that they reason
  from the same prior probabilities, and that each knows what the others know. Then
  whatever reason I have for wanting to trade is either something you already know,
  or something I know you know, and so on without limit; the disagreement that motivated
  the exchange dissolves under mutual knowledge. Yet the exchange itself, if it is
  to be agreed, is public between us. The conclusion pressed by this line of thought
  is that no such trade should occur at all, and that every observed trade must therefore
  be explained by something other than the facts — differing priors, differing preferences
  or endowments, a need for liquidity, or plain error. Call this the no-trade account.


  Please do the following.


  1. State as sharply as you can what each account claims about a single question:
  when a price moves, may a participant who sees the move treat it as evidence about
  something he did not already know? Say where the two give opposite answers and where
  they merely answer different questions.


  2. A colleague proposes a maxim she calls the Publicity Principle: nothing that
  is common knowledge can be a reason that distinguishes one person''s position from
  another''s, since a reason available to everyone cannot explain why you act and
  I do not. She claims the no-trade account is nothing but the Publicity Principle
  applied to exchange, and that the aggregative account is committed to denying the
  Principle. Assess the claim. If the aggregative account can accept the Principle,
  show how; if it cannot, say exactly what it must give up.


  3. There is a further tension to work through. An aggregative account wants prices
  to be informative; but a price that fully revealed everything would leave no participant
  any incentive to have discovered anything in the first place, so the very informativeness
  of the price would destroy the activity that makes it informative. Explain how this
  bears on the comparison, and whether it strengthens one account against the other
  or shows that both are unstable in the same way.


  4. Finally, take a side. Which of the two deserves to be called the epistemology
  of markets, and which is doing something else under the name? Then identify the
  single scenario in which they deliver opposite verdicts about whether a participant
  should revise his beliefs on seeing a price, and say what the participant should
  do.


