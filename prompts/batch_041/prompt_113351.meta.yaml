  Framing: novelist writing a novel (maybe about a community and a stranger, or about
  a character returning). They''ve been reading African philosophy around ubuntu/relational
  personhood for research, and find the debate stuck. They describe the two camps:


  Camp A: personhood is something one attains — a human being starts as a mere human
  and becomes a person through the community''s recognition and through discharging
  obligations over time; full personhood comes with adulthood, marriage, children,
  contribution, and can be diminished or lost (e.g., by serious wrongdoing, or by
  social death). On this view the community confers personhood; there''s no person
  outside the relational network.


  Camp B: personhood is intrinsic — a human being has full moral standing from the
  start, and the community only develops or nourishes what''s already there; relationality
  is a feature of how we flourish, not a precondition for counting morally. On this
  view Camp A''s claims are either an ethnographic report about how some societies
  talk, or a dangerous doctrine that licenses excluding the very young, the stranger,
  the outcast, and the disabled.


  Also add: both sides lean on the same materials — proverbs, customary practices,
  ordinary language, and contested renderings of words in Zulu, Xhosa, Akan etc. —
  and both sides agree on a lot: that persons are constitutively related to others,
  that individualism is inadequate.


  Then the diagnosis question: is this a substantive disagreement about the metaphysics
  of personhood, or a verbal one (the two camps use ''person'' for different things
  — a moral status vs. a moral achievement), or a disagreement about which cases are
  data (does the village''s treatment of a stranger count as the theory, or as a failure
  to live up to it?), or a disagreement about the question (one is descriptive conceptual
  analysis of a tradition, the other is normative advocacy), or a hidden ethical disagreement
  about whether personhood should be conditional at all?


