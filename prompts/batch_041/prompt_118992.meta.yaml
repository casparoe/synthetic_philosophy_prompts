  Structure:

  - Name the episode: the UK sentience law, 2021-22, crabs/lobsters/octopuses in,
  insects out. Supply facts.

  - Name the theory/concept: the scale argument (huge numbers × tiny probability of
  sentience → expected value dominates).

  - Ask: run the theory on the episode. What the scale argument says the decision
  should have been; what it explains (e.g., why decapods got in is evidence-threshold
  reasoning that the scale argument says is the wrong frame; the asymmetry between
  "we need strong evidence to include" and "we need only a tiny probability to worry");
  what it misses (the Act''s own structure, the extension-by-regulation mechanism,
  the fact that the scale argument would equally indict everything else, including
  wild-insect deaths from agriculture and the researcher''s own footprints); whether
  the episode is a confirmation, anomaly, or a case the theory never anticipated.

  - Then test the theory with the episode: the scale argument''s structure is the
  same as Pascal''s-mugging-style fanaticism; if the argument works for insects, does
  it work for nematodes, for AI, for anything? The stopping problem. Also the symmetry:
  inaction is also a choice with a scale argument attached; and the fact that the
  probabilities aren''t measurable credences but "unquantified" — does the argument
  need a number? Also: the argument''s step from "there''s a nonzero probability of
  sentience" to "the expected number of suffering beings is enormous" requires a linear
  aggregation over individuals with uncertain moral status, which is doing hidden
  work.

  - Also ask where the theory is silent: e.g., the scale argument says what to believe
  about expected value but not what a legislator should do when the mechanism for
  acting is a statutory committee, or when the alternative is regulatory extension.

  - Deliverable: a case analysis running both directions, disciplined mapping, say
  where the theory is silent.


  Also worth including a genuinely in-the-weeds element: the "small probability times
  large number" argument''s canonical reply is the "fanaticism" objection (infinite/huge
  expected values from tiny probabilities can''t be right because it would make any
  action justified) — and the standard non-fanatical defense: bound the probabilities,
  or note that the numbers aren''t astronomically large, or that the probability is
  not "arbitrarily small" but substantial. Also relevant: "the reversal" — if you
  accept that a 1% chance of insect sentience makes killing 10^15 insects a moral
  catastrophe, you must also accept that a 1% chance that insects are NOT sentient...
  no, that doesn''t reverse. The reversal is about actions that reduce insect numbers
  (e.g., insecticide, or the "wild animal suffering" case: if insects are sentient,
  then the wild is a charnel house, and helping insects might mean... this is the
  tricky part). Good to mention: the case for insect welfare could go either way —
  e.g., if insects are sentient and most die young in the wild, then "conservation"
  and "welfare" may conflict. That''s a nice in-the-weeds twist the model might not
  regurgitate.


