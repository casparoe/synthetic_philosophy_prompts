  So a nice tree:


  Node 1: Is there any moral fact of the matter about whether an individual combatant''s
  killing in war is permissible, or is war a domain where the ordinary moral assessment
  of individual killing doesn''t apply? (Yes/no) — No branch leads to realism/moral
  eliminativism.

  Node 2 (from Yes): Is the primary bearer of permissions and liabilities the individual
  combatant or the collective (state/nation/people)? — collective branch leads to
  collectivism (and then possibly to a "corporate MEC": both states have equal standing
  since each has a claim, so combatants are equal instruments).

  Node 3 (individual): When a combatant fights for a cause that is in fact unjust,
  does he act impermissibly (i.e., is the in bello permission dependent on ad bellum
  justice)? — Yes → reductive individualism (revisionism). No → the independence thesis
  / conventionalist family.

  Node 4a (revisionist): Is he excused? Does the excuse require non-culpable ignorance?
  Options: no excuse (liability attaches regardless of knowledge) vs excuse-if-ignorant
  vs excuse-by-duress/necessity (he''s threatened with death if he refuses, and he
  may kill in self-defense against the threat) → leaves: "strict liability" (nobody
