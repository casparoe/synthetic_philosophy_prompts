  "no-fault symmetry").

  Node 4b (independence/convention family): What grounds the permission? (i) Epistemic:
  no one can be certain of the justice of the cause, so both sides may act — the "mutual
  uncertainty" argument; (ii) Contract/fair-play: both sides benefit from a convention
  that immunizes combatants qua combatants, and it''s fair to comply; (iii) Role/instrumental:
  the soldier''s permission is derivative from the state''s authority — the state''s
  decision to go to war transfers a permission, so the soldier is like a policeman
  executing a lawful order; (iv) Consequentialist: the convention limits war''s cruelty;
  if we told soldiers they were murderers, fewer would fight... hmm that''s an argument
  about adherence rather than permission.


