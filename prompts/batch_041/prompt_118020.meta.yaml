  "I''m a postdoc in philosophy of science, and in three weeks I have to give a work-in-progress
  talk to the Thursday seminar that my department runs jointly with the statistics
  group; I have the argument and the slides, but what I actually need from you is
  a Q&A prep sheet. The thesis is that the problem of verisimilitude — what it takes
  for one false theory to be closer to the truth than another — has been misdiagnosed
  for fifty years as a problem about truth, when it is really a problem about questions.
  The history as I tell it in the first ten minutes: Popper defined the truth content
  of a theory as the set of its true consequences and the falsity content as the set
  of its false consequences, and proposed that A is closer to the truth than B when
  A''s truth content exceeds B''s while A''s falsity content does not; in 1974, three
  people working independently showed that this definition has the consequence that
  no false theory is closer to the truth than any other false theory, which is precisely
  the verdict the account existed to avoid, since we want to say that Newton is nearer
  the truth than Aristotle without either being true. The literature since then has
  split into two repair strategies — measures that treat truthlikeness as an average
  likeness between the actual world and the worlds in which the theory is true, and
  measures that restrict the relevant consequences by some relevance filter so that
  the trivialisation can''t get a grip — and I argue that both inherit the same defect:
  they compare theories against the whole language rather than against a question.
  My alternative is to relativise the comparison: fix a question, represent it as
  a partition of logical space into mutually exclusive answers, put a distance on
  the answers, and rank theories by their expected closeness to the correct cell;
  for probabilistic theories this reduces to evaluating a proper scoring rule at the
  true answer, so the Brier score and the classical truthlikeness measures come out
  as instances of one construction, and the choice of partition and distance stops
