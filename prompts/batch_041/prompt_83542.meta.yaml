  Then student answer:


  "Ranke is usually taken as the father of scientific history. He insisted that historians
  should go back to the sources, criticize them, and avoid imposing their own moral
  or political judgments on the past. His aim was to let the past speak for itself,
  to show it as it essentially was, rather than to use it for present purposes. This
  is why he is often called a positivist, though he also believed that the historian
  could discern a divine order in history.


  Carr''s What Is History? attacks this picture. Carr argues that facts do not speak
  for themselves; they become historical facts only when the historian selects them
  and gives them significance. The historian is not a passive recorder but an active
  interpreter. History is therefore a dialogue between the present and the past. However,
  Carr concludes that because selection is governed by the historian''s present-day
  concerns, historical interpretation is ultimately arbitrary. This makes him a relativist
  about historical truth.


  Hayden White radicalizes Carr''s point. In Metahistory and later work, White argues
  that historians do not simply find a story in the evidence; they impose a story
  on it by emplott[ing] events into genres such as romance, tragedy, comedy, and satire.
  The same set of events can be narrated in different modes, and the choice of mode
  is not dictated by the evidence. White therefore calls historical narratives verbal
  fictions. This means that historical events themselves are invented by the historian,
  and that historical accounts cannot be true or false in any ordinary sense; they
  can only be more or less persuasive.


  Taken together, Carr and White show that Ranke''s ideal is impossible. If facts
  are selected and narratives are constructed, then there is no neutral standpoint
  from which the past can be reported as it actually was. The most we can hope for
  is a self-conscious acknowledgment that all history is written from a particular
  perspective. Neither Carr nor White leaves room for objective historical knowledge."


