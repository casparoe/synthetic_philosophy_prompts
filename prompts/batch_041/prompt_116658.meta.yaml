  Side A (Samuelson, Gul–Pesendorfer, "mindless economics"): preference/utility are
  not psychological; economics is about choice; the only discipline is that models
  generate good predictions/are testable; welfare statements are a separate normative
  overlay. Samuelson''s own position: "revealed preference" was a way to derive demand
  theory without introspection; the utility function is an ordinal index. Also Friedman''s
  instrumentalism (F53).


  Side B (Little, Harsanyi, Sen, Bernheim, Hausman): choice-based welfare is unstable:
  choices that violate consistency make the choice-based approach either silent or
  implausibly manipulable; "as-if" behaviorism leaves welfare with nothing to track;
  hence need to reintroduce a mentalistic notion (experienced utility, Kahneman; Bernheim''s
  "welfare-relevant" preferences).


