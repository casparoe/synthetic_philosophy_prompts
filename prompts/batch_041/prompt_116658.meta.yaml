  a given situation, (ii) a ranking of options in terms of the agent''s judgment of
  desirability, (iii) a ranking that is normatively authoritative for welfare. These
  come apart — the standard case: a person''s choices over time may be time-inconsistent;
  a person''s choices may be distorted by framing; a person''s choices may not reflect
  their "true" preferences; also the case of non-choice-based attitudes (a person
  who never gets the chance to choose).


