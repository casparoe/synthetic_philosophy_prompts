  Actually a great "in the weeds" but still meaningful thing: Good''s theorem. Good''s
  theorem: the expected value of information is non-negative (for a Bayesian expected
  utility maximizer), i.e., free information is always weakly beneficial. And the
  subtlety: this depends on the assumption that the decision problem is fixed, the
  information doesn''t change your preferences/available actions, and it''s about
  expected value not actual value. Also the subtlety: Good''s theorem requires the
  information to be "free" (no cost) and the agent to be a Bayesian with fixed utility.
  Also the more subtle point: value of information is non-negative in expectation,
  but the actual realized value can be negative; also, if the information can change
  the decision problem itself or if the agent isn''t a perfect Bayesian, it can fail.
  Also the "Good''s theorem" vs "the value of information" — Good''s 1967 result.
  Also relates to the "expected value of perfect information" and the fact that more
  information can be bad if it constrains your options (e.g., commitment problems)
  — but that''s ruled out by the fixed-decision-problem assumption.


