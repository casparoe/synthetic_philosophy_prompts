  ok so I''m TA''ing this grad seminar on induction + learning theory (cross-listed
  phil/cogsci, we''ve been doing Solomonoff and Kolmogorov complexity, mostly out
  of the Li & Vitányi book). I''m grading the first problem set and I keep flip-flopping
  on one answer, so I want a second opinion before I hand it back. The student is
  generally strong and I don''t want to be unfair in either direction. Here''s the
  question and what they wrote.


  Question (10 pts):


  (a) Fix a prefix-free universal machine U. The Solomonoff prior assigns weight 2^{-|p|}
  to each program p, and the universal distribution is M(x) = sum over programs p
  with U(p) = x of 2^{-|p|}. In what sense, if any, is this "Occam''s razor"?


  (b) Show/explain why M has the property that for every computable probability distribution
  mu there''s a constant c > 0 with M(x) >= c*mu(x) for all x. What does this buy
  you?


  (c) Does this solve Hume''s problem of induction? Explain.


  Answer:


  (a) This is Occam''s razor, formalized. A program of length n gets weight 2^{-n},
  so of two programs that both produce the data, the shorter one gets exponentially
  more prior mass, which is exactly the preference for simple hypotheses. And it goes
  through to the probabilities of the data themselves: the coding theorem gives M(x)
  = 2^{-K(x)}, so the universal distribution assigns probability 2^{-K(x)} to a string,
  K being the length of the shortest program that outputs it. So Occam''s razor here
  just is the claim that strings with lower Kolmogorov complexity are more probable.
  Since K is machine-independent up to an additive constant, M is machine-independent
  too — another universal machine would just shuffle the probabilities by a constant
  factor, so the choice of U doesn''t really matter.


  (b) Any computable mu has a program p_mu that samples from it: feed p_mu random
  bits and it outputs x with probability mu(x). That program has some length |p_mu|,
  and by construction M(x) >= 2^{-|p_mu|} * mu(x). So the mixture is always at least
  a constant fraction of the truth, for every computable truth, with the constant
  depending on mu but not on x. What this buys you is convergence: a Bayesian starting
  from M and updating on data will have the posterior concentrate on the true distribution,
  and the expected prediction error goes to zero. It''s "universal" in that no computable
  hypothesis is excluded in advance, and the ones that are wrong get eliminated by
  the data at a rate that lets the mixture track the truth.


  (c) I''d say yes, or at least it dissolves the problem. Hume wanted a justification
  for expecting the future to resemble the past, i.e. for some particular inductive
  regularity. Solomonoff''s move is that you don''t have to bet on a particular regularity:
  you average over all computable ones, and the averaging does the work. Whatever
  computable structure is in the data, some program captures it and the mixture picks
  it up. The only assumption left is that the data is generated by something computable,
  which is about as weak an assumption as you can make — to break it you''d need a
  non-computable world, and we have no reason to think we live in one. So the problem
  of justifying induction is replaced by a much more modest assumption that we can
  just grant.


  Give me a grade out of 10 and then the comments I can hand back to the student —
  per part, what''s right, what''s wrong, and how it should have been said. I''d rather
  the comments be accurate than either generous or harsh, and please don''t manufacture
  errors that aren''t there. Also if the question itself is badly worded in a way
  that''s making this hard to grade, tell me that too.


