  Draft:


  "Ok so I''m TA''ing this seminar on induction and learning theory (it''s cross-listed
  phil/cogsci, mostly grad students, we did Solomonoff and Kolmogorov complexity last
  week, mostly using Li & Vitányi as a reference but I''m not allowed to say that
  apparently — anyway). I''m behind on grading and I keep going back and forth on
  this one answer, so I want a second opinion before I hand back the problem set.
  Here''s the question and the answer.


  Question (worth 10):


  (a) The Solomonoff prior puts a weight of 2^{-|p|} on each program p (over some
  fixed prefix-free universal machine), and the universal distribution M(x) is the
  sum of 2^{-|p|} over all programs that output x. In what sense, if any, is this
  ''Occam''s razor''?


  (b) Why does M have the property that it dominates every computable probability
  distribution (i.e., M(x) >= c * mu(x) for some constant c depending on mu)? Say
  what this buys you.


  (c) Does this solve Hume''s problem of induction? Explain.


  Student''s answer:


  (a) Yes — this is basically Occam''s razor formalized. A program of length n gets
  weight 2^{-n}, so if two programs both explain the data, the shorter one is exponentially
  more likely under the prior. In fact M(x) = 2^{-K(x)}, where K(x) is the length
  of the shortest program that outputs x, so the universal distribution just is the
  Kolmogorov complexity turned into a probability: simpler strings (in the K sense)
  are more probable. Since K doesn''t depend on the choice of universal machine except
  for an additive constant, the prior is machine-independent.


  (b) M dominates every computable distribution because any computable mu can be generated
  by some program p_mu, and then M(x) >= 2^{-|p_mu|} * mu(x). So the mixture is at
  least a constant fraction of the truth, for every computable truth. This means that
  a Bayesian who starts from M and updates will converge: the posterior concentrates
  on the true distribution, and prediction error goes to zero. This is the sense in
  which M is a ''universal'' prior — no computable hypothesis is ruled out in advance,
  and the ones that are wrong get eliminated at a rate that makes the mixture track
  the truth.


  (c) I''d say yes, it solves it — or at least dissolves it. Hume worried that induction
  needs a justification for expecting the future to resemble the past. Solomonoff''s
  answer is that you don''t need to assume a particular pattern; you average over
  all computable patterns, and the averaging does the work. Whatever computable regularity
  there is in the data, some program captures it, and the mixture picks it up. The
  only assumption is that the data is generated by something computable, which is
  about as weak as an assumption can get — you''d need a non-computable world to break
  it, and we have no reason to think we live in one.


  I want a grade out of 10 and, more importantly, line-by-line comments I can basically
  hand to the student — what''s right, what''s wrong, and what''s the right way to
  say it. The student is strong generally so I don''t want to tank them on a technicality,
  but I also don''t want to let a real error through. Thanks."


