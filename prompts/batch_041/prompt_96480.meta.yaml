  **Answer.**


  (a) This is Occam''s razor, formalized. A program of length n gets weight 2^−n,
  so of two programs that both produce the data, the shorter one gets exponentially
  more prior mass, which is exactly the preference for simple hypotheses. And it carries
  straight through to the data: by the coding theorem M(x) = 2^−K(x), so the universal
  distribution assigns a string probability 2^−K(x), where K(x) is the length of the
  shortest program that outputs it. So Occam''s razor here just is the claim that
  strings with lower Kolmogorov complexity are more probable. Since K is machine-independent
