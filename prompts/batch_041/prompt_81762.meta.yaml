  3. Check "coherence" more generally: for every logically complex event, your credence
  should equal the sum over the partition cells that entail it. If not, you are vulnerable
  to the dominance argument: there is a coherent credence function that is at least
  as accurate as yours in every possible world and strictly more accurate in some.
