  So the two camps:

  - Camp A ("structuralists" / "theorem camp"): Goodhart''s law is a structural result
  about optimizing imperfect proxies. Best formulated as: as optimization pressure
  on a proxy increases, the proxy''s conditional correlation with the goal, given
  extreme proxy values, degrades — typically to zero or negative. It applies without
  any adversarial agent. Variants: regressional (selection on the proxy shifts the
  conditional distribution), extremal (the tail of the proxy distribution contains
  atypical goal values), causal (intervening on the proxy breaks the correlation that
  held observationally), adversarial (an agent with divergent goals games the proxy).
  And there''s a deeper point: any proxy is only informative about the goal under
  a distribution that isn''t the one you''ll end up in once you optimize.

  - Camp B ("deflationists" / "contingentists"): There is no law here. The apparent
  "law" is a disjunction of ordinary phenomena: model misspecification, distribution
  shift, incentive misalignment, Goodhart''s own "regression to the mean" effect...
  The unifying "law" is either a tautology ("optimizing the wrong thing gets you the
  wrong thing") or a sociological observation about institutions that measure. The
  interesting content is always in the specifics — who chose the metric, who can game
  it, what the principal-agent structure is. And the "structural" argument proves
  too much: it would imply all action under uncertainty is doomed.


  Cruxes:

  1. Is the "extremal" variant a theorem or a heuristic? (i.e., can we state a precise
  condition under which extreme proxy values carry no information about the goal?
  What about proxies that are monotone transforms of the goal? What if the goal is
  bounded and the proxy is a noisy but unbiased estimate — then extreme proxy values
  are actually informative (they indicate high goal, if noise is bounded)? So the
  "extremal" failure depends on the noise structure. Genuine crux.)

  2. Agent-dependence: does the phenomenon need an adversary/agent with divergent
  objectives, or does a non-agentic optimizer exhibit it?

  3. Is there a discontinuity? Does the divergence appear continuously (correlation
  decay) or is there a threshold/"cliff"?

  4. Meta-level: does the theory of Goodharting itself Goodhart? (e.g., if you optimize
  for "not Goodharting" — say, by choosing robust proxies or by using multiple metrics
  — does the meta-metric also degrade? Is there a "no free lunch" result?)

  5. Is the practical lesson "choose better proxies" or "don''t optimize hard / keep
  a human in the loop / change the selection process"?


