  Draft:


  "I teach a unit on the ethics of autonomous systems and want to use 2001: A Space
  Odyssey as a text rather than an illustration. Read the film through the responsibility-gap
  problem: HAL''s killings have no culpable author, the crew''s briefing tells them
  the 9000 series cannot err, and the film never convenes any inquiry into what happened.
  I want a reading that distinguishes three things the literature tends to run together
  — a liability gap (no one can be made to pay), a blame gap (no one deserves blame),
  and an attributability gap (the deed belongs to no one at all, because no human
  intention produced it) — and says which of the three the film actually dramatizes.
  My own hypothesis, which you should test rather than assume, is that the film locates
  the gap in the design philosophy rather than in the machine: the gap is manufactured
  by the boast of infallibility, which is what removes the human supervisor from the
  loop in the first place. Two further questions. First, Bowman disconnecting the
  modules reads as an execution, and you cannot execute a thermostat; does the film
  therefore commit itself to HAL''s agency, and if so does that close the gap or merely
  relocate and conceal it? Second, the film ends without trial, testimony, or even
  a report — is that a diagnosis (accountability has no grip here) or an evasion?
  Keep the reading faithful to the film, including the scenes that resist it, and
  say at the end what the film shows about responsibility gaps that the analytic literature
  cannot state in argument."


