  cases you often could have.

  7. I think causal selection is interest-relative: out of all the difference-makers,
  we pick the one that''s abnormal or violates a norm. So the omission is a cause
  when it violates a norm (e.g., lifeguard not saving).

  8. I think there''s no fact of the matter about "the cause" independent of our interests.


