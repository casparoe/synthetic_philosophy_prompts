  ---


  I work as a software engineer and have no formal training in philosophy, though
  I read a good deal of it in my own time, and a friend has landed me with a puzzle
  I cannot shake. Over dinner he asked how it is that I can be genuinely distressed
  by the fate of a character I know perfectly well never existed, and he told me the
  question has a name — the paradox of fiction — and a founding paper by Colin Radford
  and Michael Weston about being moved by Anna Karenina. As I understand it the three
  claims are these: we are moved by fictional characters and events; being moved by
  something requires believing it real; and we do not believe it real. Radford''s
  own verdict, apparently, is that we are simply being irrational. I have since read
  that Kendall Walton answers that what we feel is not real pity or fear but a quasi-emotion
  experienced inside a game of make-believe, that others reply that we are moved by
  the thought and not by any belief, and that there is a notion called alief, which
  I gather Tamar Gendler introduced, for the belief-like state that runs alongside
  what we actually believe — the one that makes me flinch at a horror film whose monster
  I know perfectly well is a man in make-up. The phrase everyone reaches for, a willing
  suspension of disbelief, has never explained anything to me; if I have suspended
  it, I still do not believe, so the problem looks untouched. In my own line of work
  I am tempted to say the emotional response simply fires on the representation without
  checking its provenance, the way a cached response comes back before anyone has
  troubled the server, but I suspect that is a slogan rather than a solution.


  What I would actually like is a reading of a film through this. I am introducing
  The Purple Rose of Cairo at a small film club next month — Woody Allen, 1985 — and
  it seems to me to be a film about precisely this problem rather than one that merely
  illustrates it. Cecilia is a waitress in Depression-era New Jersey, unhappily married
  to a bully named Monk, and she escapes into the cinema; one afternoon the archaeologist
  Tom Baxter, a side character in the film she is watching for the fifth time, notices
  her in the audience, speaks to her, and walks out of the screen to be with her.
  The other characters are stranded in a film that cannot proceed without him; the
  actor who plays him, Gil Shepherd, arrives from Hollywood to coax him back, and
  seduces Cecilia in order to do it. She chooses the actor over the character, is
  abandoned for her trouble, and the film closes with her sitting alone in the auditorium
  watching Top Hat, where the sight of Fred Astaire and Ginger Rogers dancing to Cheek
  to Cheek brings her round to a smile.


  So: read the film through the paradox. I want the literalising of the mechanism
  taken seriously — a character crossing from the fiction into the world, and a fiction
  frozen for want of its object — and I want to know which of the three families of
  answer the film''s own machinery supports. Does Tom Baxter''s love count as evidence
