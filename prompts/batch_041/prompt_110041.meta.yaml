  Draft student answer:


  "The Dutch book argument starts from the idea that your degree of belief in a proposition
  just is the betting quotient at which you''d be indifferent between betting for
  and against it. Suppose your credences violate the probability calculus — say P(A)
  = 0.6, P(~A) = 0.6. A bookie who knows your credences can offer you a set of bets,
  each of which you take to be fair, such that whatever happens you end up down. You''ve
  been ''Dutch booked.'' De Finetti proved that any credence function that violates
  the axioms is vulnerable in this way, and conversely that any function obeying the
  axioms is immune. So coherence — conformity to the axioms — is necessary and sufficient
  for avoiding a sure loss. Since it''s irrational to take a set of bets that''s guaranteed
  to lose you money, incoherent credences are irrational.


  Two things follow. First, the argument vindicates the full Kolmogorov axiomatisation,
  including countable additivity, and shows that de Finetti''s own finitely additive
  version of probability was a mistake — his own theorem refutes him. Second, the
  same style of argument extends from static credence to updating: a diachronic Dutch
  book can be made against anyone who fails to conditionalise on their evidence, so
  probabilism and conditionalization stand or fall together.


  The usual objection is that the argument only shows that an incoherent agent can
  be exploited by a bookie who knows their credences, not that the agent is irrational
  — being exploitable isn''t the same as being inconsistent. But this objection misses
  the point: de Finetti''s theorem shows coherence is both necessary and sufficient
  for avoiding a sure loss, so an incoherent agent''s credences are defective in exactly
  the sense the objection denies. The upshot is that the Dutch book argument is the
  strongest argument for probabilism, though it doesn''t tell us anything about which
  prior to have."


