  The summary content (in the summarizer''s voice):


  1. "Cognitive penetration" is the idea that your beliefs, desires, moods and expectations
  shape what you actually see, as opposed to just how you interpret it. The name comes
  from the fact that the higher cognitive parts of the brain send signals down into
  the visual system, which is why it''s also called top-down processing.


  2. Classic demonstration: the 1940s study where poor kids drew coins bigger than
  rich kids — i.e., wanting money literally made the coins look bigger. Also the banana
  studies: knowing bananas are yellow makes you see a yellowish tint.


  3. The debate was basically settled in the 2010s when Firestone and Scholl went
  through the evidence and showed that all these effects are artifacts — attention,
  memory, and response bias — so cognition does not affect perception. So the "penetration"
  people lost.


  4. The only thing left to fight about is how strong the effects are.


  5. The real issue underneath is Fodor''s claim that perception is a "module" sealed
  off from the rest of the mind; since neuroscience has basically abandoned modularity,
  penetration wins on the theory side too.


  6. Practical upshot: this is why two people of different politics can look at the
  same video and see different things, and it means perception can never justify a
  belief, because your beliefs are already baked into what you see (circular).


  Errors to catch:

  - (1) conflates top-down processing / predictive coding with cognitive penetration.
  Top-down doesn''t imply penetration in the technical sense (the penetrator must
  be cognitive and its effect on the *content* of experience, direct, semantic). Also
  "the higher parts send signals down" — anatomical fact doesn''t establish penetration;
  there''s plenty of top-down modulation that is not penetration (attention, adaptation,
  cross-modal).

  - Moods/expectations: moods aren''t cognitive; expectations are. Whether "moods"
  count — affective penetration is a different category (Stokes: not cognitive penetration
  proper).

  - (2) Bruner & Goodman: the finding is about *size judgment* of coins, i.e., judgment,
  not perceptual experience; also confounded (poor kids may have had more familiarity
  with coins; the effect was about *value/need*, and the desire interpretation is
  an overread). Also "wanting money made coins look bigger" — need vs. desire; and
  children drew coins larger, which is a measure of drawing, not of experience. Also
  there are replication issues. So this is at best an ambiguous case, not a "classic
  demonstration" of penetration. Also the banana study is memory-color, which is a
  perceptual effect but not obviously *cognitive* penetration (memory of an object''s
  typical color could be non-cognitive/associative), and "repainting" overstates.

  - (3) Firestone & Scholl''s point is that the evidence is confounded and that we
  can''t infer penetration; "cognition does not affect perception" is their provocative
  title/thesis but the argument is a demand for better evidence + alternative explanations;
  also they target "top-down effects" broadly, and importantly they''d deny that their
  critique refutes the *possibility* of penetration; the debate is ongoing (e.g.,
  later work, "the penetrability of perception" replies). Also "settled" is wrong.
  Also the direction: they say the burden is on the top-down theorists and it''s not
  met; they don''t show that all effects are artifacts, they show the studies don''t
  isolate the right thing.

  - (4) "only thing left to fight about is strength" — no; the primary fight is whether
  the phenomenon exists at all and how to define it; also whether effects on judgment/report
  count.

  - (5) Fodor''s modularity vs. penetration: Fodor himself thought the evidence for
  penetration was weak and that the case is at best inconclusive; modularity is a
  specific architectural thesis; the debate about penetration doesn''t stand or fall
  with modularity (you can have penetration without Fodorian modules? and abandoning
  modularity doesn''t establish penetration — evidence is still needed). Also "neuroscience
  abandoned modularity" is a big overstatement and irrelevant to the empirical question.

  - (6) The politics example: "seeing different things" often means different interpretation/attention/selection;
  the "same video" case is exactly where response bias and attention confounds live.
  The circularity claim: the rationality of perception debate (Siegel) — penetrable
  perception need not be unjustifying; the inference can be rational/appropriate;
  circularity only if the belief that does the penetrating is itself justified by
  the experience in a vicious way. So the "can never justify" conclusion doesn''t
  follow; it''s a separate epistemic debate.


