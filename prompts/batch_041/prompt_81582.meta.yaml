  The paradox (as often put): Deontological constraints say things like "don''t kill
  an innocent person even to prevent more killings." But the standard justification
  for such a constraint is that killing is bad — it harms someone, uses them, etc.
  Yet if killing is bad because it harms, then preventing more killings should be
  better, so why can''t I kill one to save five? The constraint seems to undercut
  its own rationale: the very thing that makes violating it bad (harm) would be minimized
  by violating it. Hence "paradox": the constraint forbids doing the thing that would
  minimize the badness that justifies the constraint. Scheffler''s formulation: the
  paradox of deontology is that deontological restrictions seem to be "paradoxical"
  because they prohibit minimizing the violations of the very restrictions. Related:
  Nozick''s "side constraints," Nagel''s "agent-relative reasons," Quinn''s doing/allowing,
  Kamm''s work on constraints, Fried''s "right and wrong."


  The debate: (i) Is there a genuine paradox, or does it dissolve once we recognize
  that the rationale for a constraint is agent-relative (I must not do it) rather
  than agent-neutral (it''s bad that it happens)? (ii) Can the rationale for constraints
  be given without generating the paradox? (iii) Is the "paradox" just the consequentialist
  assumption that the point of morality is to minimize badness?


