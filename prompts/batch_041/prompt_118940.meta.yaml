  "For thirty-five years I read spectra for a living — NMR mostly, and infrared before
  that — and the part of the job I never got tired of was the smallest part: deciding
  whether two peaks were the same peak. Two spectra can be identical in every measurable
  respect and still invite different groupings, and the whole interpretation turns
  on which grouping you accept. Since retiring I have been sitting in on a graduate
  seminar in cognitive science, and I have found a program from the late 1980s, Copycat,
  that puts that same experience into a toy world of three-letter strings. Its entire
  universe is problems of the form abc is to abd as ijk is to what. What delights
  me is how quickly the toy stops being a toy: with ijk the answer is obvious, but
  put x, y and z in that place and the problem becomes genuinely open, because one
  now has to decide what a letter is — a position in a sequence that ends, a position
