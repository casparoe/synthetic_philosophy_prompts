  to ?''. What fascinates me is not the program but the problem it exposes: the analogy
  looks trivial and is not. ''ijk → ijl'' is easy; but present the same rule in ''xyz
  → ?'' and the answer is genuinely open — the alphabet can be treated as a sequence
  that wraps, or as one that stops, and a solver that has never seen ''z'' before
  must decide on the spot what kind of object a letter is: a position, a successor-able
  item, a member of an ordered set, or just a shape. Every step of the reasoning —
  which letters group into a chunk, what counts as the ''same change'', whether the
  rule is about positions or about the string''s structure — is a commitment that
  can slip. Hofstadter''s point, as I understand it, is that this slippage is not
  a bug in a toy world but the ordinary working of concepts, which have no fixed boundaries
  but only a ''halo'' of related uses that the situation prunes.


  I would like you to write a short story that dramatizes that idea in a microdomain
  of your own invention — not the letter strings, and not a story about a computer
  program. Invent a tiny, closed world of transformations (a card game with three
  cards; a system of knotted cords; the tile patterns of a floor; a notation for a
