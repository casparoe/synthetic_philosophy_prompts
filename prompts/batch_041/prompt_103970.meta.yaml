  ---


  I chair the exhibition content committee at our city''s museum of world history.
  In eight weeks we open a permanent gallery whose working title is Collapse: When
  Civilizations Fall; a donor''s gift names the space, and the gift agreement requires
  that the gallery be organized under a single organizing concept rather than as three
  loosely related rooms. The three bays are the eastern Mediterranean at the end of
  the Late Bronze Age, the Classic Maya lowlands, and Rapa Nui. The donor''s gift
  also pays for an interactive installation — visitors choose policies for a fictional
  island and watch it fail — which our education team loves and our curators distrust.
  Three things have now converged. The Rapa Nui descendant association has written
  to object to their island appearing under a collapse heading at all: they say the
  framing repeats an ecocide story their own advisers consider refuted by recent archaeological
  and genetic work, casts their ancestors as the authors of their own destruction,
  and treats a living people as an exhibit in someone else''s morality tale; they
  have hinted they may withdraw promised loans. Our education consultant reports that
  the word collapse maps onto the state curriculum standard for this grade band in
  a way that transformation does not. And our archaeological consultant''s report
  observes that at two of the three sites the occupational record is continuous across
  the supposed collapse horizon: what ended was a particular kind of thing — monumental
  and administrative centers, elite exchange networks, a scribal and monumental tradition
  — not a landscape and not a people. One committee member has already told me that
  a museum unwilling to say the word has no business warning anyone about anything,
  and I think he has a point that deserves an answer rather than a shrug.


  Please draft the short written opinion I will circulate before our vote on the 14th.
  It should recommend a concrete course of action — keep the title and the organizing
  concept, rename, or restructure — with an explicit definition of whatever concept
  we adopt and an explicit statement of what the gallery is and is not claiming; it
  should say whether the three cases can honestly sit under one heading and, if they
  can, what the heading has to mean for that to be true; it should rule on the simulator;
  and it should give a fallback if the loans are withdrawn. Distinguish the several
  things the word collapse is used to name — demographic decline, loss of political
  integration, the disappearance of a particular elite or institutional package, loss
  of overall social complexity — and say which of them our evidence supports at each
  site and which the gallery must not imply. Include the four or five sentences of
  wall text that will state the gallery''s framing, and a short timeline from the
  vote to the label-copy deadline. Be honest about which parts of the decision turn
  on evidence and which turn on values and whose values; state the strongest case
  for the position you reject, including my colleague''s, and what would change your
  mind. No citations or scholarly names; the committee has the site reports. I want
  to read it aloud in ten minutes.


  ---


