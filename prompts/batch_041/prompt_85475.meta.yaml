  ---


  I have been asked to give the commencement address this June at the small college
  in the town where I have spent my whole life. I am not an academic: I worked at
  the paper mill here for nineteen years until it shut down, and for the eleven years
  since I have driven a school bus on the same streets I walked to school on. The
  committee asked me because I am, in their words, a familiar face, and I said yes
  before I had any idea what I would say. What follows is what I would like to say,
  and I would like you to write it.


  For the last several years I have been working my way through the popular books
  that promise to explain the whole of human history in a single arc — the ones that
  trace the fates of continents to geography, the ones that locate the decisive turn
  in one change in the human mind, and the one that argues the familiar story of farming
  leading to cities leading to kings and states is an inheritance we mistake for a
  discovery. I have also read enough of the criticism of those books to believe that
  the trouble is not mainly this or that claim but the shape they all share. The story
  always runs from small to large and simple to complex, and it always arrives, at
  the end, at us, which is convenient for us. I do not want to hand a graduating class
  that shape. I also do not want to stand at a podium and tell them history has no
  shape at all: that is not true as far as I can tell, and it is not a thing you say
  to people on the morning they are handed their diplomas.


  So: a commencement address of roughly eight to ten minutes, in my voice — plain,
  first person, no jokes I would not actually make, no stories about my own life that
  I have not given you. Give the audience a genuinely large view of where human beings
  have been, and build it around a test I have been using on these books for years:
  whether a person can leave, whether a person can refuse, and whether a person can
  change the rules they live under. I would like that test to be the spine of the
  speech rather than a topic in it — the thing that decides what can and cannot be
  said, the way a sermon is decided by its text.


  Two things I would like you to use, because they are what convinced me the arc is
  a choice and not a finding. First, the archaeological record of early cities: some
  settlements of tens of thousands of people show no palaces, no royal tombs, no central
  storehouses, no written administration — nothing that looks like a ruler — and at
  least one very large early city appears to have begun as a stratified settlement
  and then moved in the other direction. Second, that many communities deliberately
  lived one way in one season and another way in the next, so that the same people
  were egalitarian in the summer and something closer to authoritarian in the winter,
  on purpose. I do not want the graduates lectured on archaeology; I want one clear
  image of each, briefly, so that the rest of the speech is honest.


  The audience: about a thousand graduates, their families, and the faculty, among
  them a handful of historians who will wince if I overclaim, and the parents of the
  first generation in many of these families to finish college. The local paper prints
  the address in full every year. So it has to be a real speech for the occasion,
  not an essay read aloud.


