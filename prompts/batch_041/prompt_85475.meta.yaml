  or the end of the story.

  - Do not end by telling them the future belongs to them, that they are the next
  chapter, or that history is on their side.

  - Do say something about what happened to this town when the mill closed. I have
  never been able to say it in a way that did not either file it under progress or
  inflate it into a tragedy of cosmic proportions, and I would like the speech to
  find the third thing.

  - End with a charge, because the occasion requires one, but a charge that does not
  rest on a promise about how things will turn out.


  If it comes out a little strange for a commencement address, that is fine. I would
  rather it be strange than familiar.


