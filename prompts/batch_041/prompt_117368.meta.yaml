  This contains several confusions: (a) disjunctivism doesn''t deny that hallucination
  and perception are different — that''s the point, but the interesting claim is that
  they can be *subjectively indistinguishable* while being different; the disjunctivist''s
  claim is that the subject can''t tell the difference and that the *epistemic* (not
  phenomenal) character differs; (b) the sense-datum theorist''s point isn''t just
  "they''re different," it''s "there''s a common factor"; (c) the argument from illusion
  vs argument from hallucination distinction. A good answer corrects: disjunctivism
  is not the claim that they''re different in some obvious way; it''s a claim about
  the nature of the experience and about the "highest common factor" assumption; disjunctivists
  deny that hallucination and perception share a common conscious character of the
  kind that grounds the inference to sense data, and typically hold that the hallucinator''s
  experience is not a case of being aware of a mental object but that the "indistinguishability"
  is epistemic/subjective; also there are different disjunctivisms (metaphysical/experiential
  vs epistemic), and the "argument from illusion" family includes both. Hmm, but part
  (c) has a kernel of truth (Hinton/Austin distinguished them; disjunctivism is often
  about hallucination). If the prompt says "is the disjunctivist even talking about
  the same argument?" — the honest answer is partly "no, and that''s an interesting
  point; the argument from illusion (relativity) is not the argument from hallucination,
  and disjunctivism is mainly targeted at the latter/HGF." So the false presupposition
