  Draft:


  ---

  I''m preparing a short position statement for a workshop on skepticism and the structure
  of inquiry, and I''d like a consistency audit of the package I plan to defend before
  I circulate it. The views are mine, though they were prompted by my reading of the
  later Wittgenstein (On Certainty in particular); I am not asking for an exegesis
  of that text, and I''d rather you engage the theses directly than tell me what Wittgenstein
  really meant.


  Here is what I hold:


  1. Inquiry has presuppositions. Any investigation into whether some claim is true
  proceeds against commitments that the investigation itself cannot establish — e.g.,
  that there is an external world, that my memory is broadly reliable, that the people
  I address are not automata. Attempts to justify these commitments from within inquiry
  run in a circle or trail off.


  2. The demand for such a justification is not merely unanswerable but out of place.
  Someone who insists that I justify my confidence that I have two hands has not raised
  a hard question; they have misconstrued what is going on when we inquire. Skepticism
  is therefore to be diagnosed rather than refuted.


  3. These commitments function more like rules for the use of our words than like
  descriptions of how things stand. They are not properly assessed as true or false,
  and when I say of one of them that I know it, I am not reporting a cognitive achievement.


  4. We come by them by training, immersion, and habituation, not by evidence. They
  do not feel like conclusions, and no one who holds them holds them because of an
  argument.


  5. They are nonetheless not permanent fixtures. Which commitments play this role
  varies with context, with the questions under discussion, and across historical
  periods; a commitment can descend from presupposition to live hypothesis and, in
  time, ascend again.


  6. And yet I want to say of someone whose commitments diverge from mine — a young-earth
  creationist, someone who consults the dead — not that they are playing a different
  game, but that they are wrong, and that a form of life built on consulting the dead
  is worse than one built on not doing so. When I say a student who claims to be unable
  to rule out that they are a brain in a vat has stopped doing something rather than
  discovered something, I mean that as a criticism.


