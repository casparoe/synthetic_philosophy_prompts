  "I''m a fourth-year PhD student working on social ontology, and for the last month
  I''ve been arguing over dinner with my flatmate, a demographer, about whether the
  generational labels we all use pick out anything real. I''ve come to think that
  my own verdicts are more consistent than my arguments for them, and I''d like someone
  to tell me what principle they add up to. Here is where I land, going case by case.
  The Baby Boomers are a real kind: there really is a bulge, and the people in it
  were formed by the same postwar expansion and the same civil-rights and antiwar
  upheavals at roughly the same point in the life course, and they self-consciously
  organised around the label. Generation X is not a real kind; it is a label that
  got attached to a stretch of birth years after the fact and mostly describes what
  advertisers thought of them. Millennials are a real kind. Generation Z is not a
  real kind, even though its members use the label and are constantly described in
  terms of it. ''Digital natives'' is not a real kind, and the empirical work I know
  of says the shared trait was never there. The ''Greatest Generation'' is not a real
  kind, even though its members lived through the Depression and the Second World
  War, because the label was retrofitted decades later by people who wanted to sell
  something. The ''Silent Generation'' is not a real kind either; it is a birth dearth
  with a mood attached. On the other hand, the people who came of age into the 2008
  crash are a real kind, and so are immigrants who arrived before adolescence and
  grew up between two languages -- both of those cut across the birth-year labels
  and neither is a proper birth cohort. Teenagers are a real kind but not a generational
  one; they are an age grade, and everyone leaves it on schedule. My grandmother''s
  ''generation'' in the family-tree sense isn''t a kind at all. And when my flatmate
  talks about the F2 and F3 generations of a lab population, I think the word is doing
  something completely different and unproblematic.


  My tentative principle is that a cohort is a real kind just when a historical event
  or process struck its members at the same point in the life course and left a durable
  common mark; the label is a real kind iff it latches onto that event. But I notice
  that this seems to make Generation Z real, and I don''t think it is, and it also
  doesn''t explain why Millennials survive while Generation X doesn''t when both labels
  came out of the same demographic-marketing industry with equally arbitrary boundaries.
  I''ve been trying to replace it with something like: a label marks a real kind when
  the boundary is set by the mechanism rather than by the label itself -- I''ve been
  calling the two ''mechanism-bounded'' and ''label-bounded'' cohorts -- but that
  seems to leave Millennials on the wrong side. So: is there one principle (or a small
  set of them, if ''generation'' is genuinely several concepts and I should be splitting
  them) that gets all of my verdicts, or near enough? State it precisely, tell me
  which clause each of my verdicts is doing the work for, and be honest about which
  verdicts it forces me to give up. I''d also like its predictions on three cases
  I haven''t made up my mind about: the children of China''s one-child policy; people
  who came of age in the 2020-22 pandemic, who I suspect will get a label nobody agrees
  on; and a hypothetical country whose birth rate collapses for a decade. And if it
  helps, say what would have to be true for Generation Z to count as real after all
