  apparatus. I want you to do the translation properly, and then tell me what gets
  lost.


  Here is what I mean by my vocabulary, so you can hold me to it: an operational definition,
  a test operation, construct validity in the old Cronbach-and-Meehl sense of a construct''s
  place in a nomological network, convergent and discriminant evidence, criterion
  contamination, construct underrepresentation and construct-irrelevant variance,
  the difference between a test that predicts an outcome and a test that measures
  a construct, measurement invariance across populations, and the difference between
  group-level inference and inference about a single case.


  Take the following positions and restate each in that vocabulary as faithfully as
  you can, one at a time: (a) the claim that a system that cannot be distinguished
  from a human in conversation thereby has a mind; (b) the stronger, stripped-down
  behaviorism that says mental terms just mean dispositions to behave, so the question
  of an inner state is not merely unanswerable but empty; (c) the classic psychometric
  rejoinder that a construct is what it is by virtue of its place in a nomological
  network, so behavioral criteria are evidence for a theoretical entity rather than
  a definition of it; (d) the objection that a system could pass every conversational
  test by manipulating symbols according to rules, without any understanding; (e)
  the intuition that a system could be behaviorally and functionally identical to
  a person and still have nothing going on inside; (f) the deflationary reply that
  the previous objection demands evidence that could not in principle exist, and that
  the demand is therefore not a requirement on a theory but a prejudice.


  For each, tell me what translates cleanly, what has to be distorted to fit, and
  what has no expression at all in my vocabulary. Then the residue report, which is
  what I actually want: is the residue a defect of my framework — something about
  minds that psychometrics is structurally unable to represent, and if so, what would
  have to be added to it — or is it a sign that the philosophical claim was less clear
  than it looked? I am especially interested in three things: whether the "same behavior,
  nothing inside" intuition has any counterpart in a framework that already distinguishes
  a test that predicts from a test that measures; whether the question "does this
  one system have a mind" is even the kind of question psychometrics is built to answer,
  given that my constructs live at the level of populations; and whether the nomological-network
  rejoinder actually dissolves the behavioral criterion or merely postpones it. Do
  not tell me which position is true. Tell me which of them my framework can state,
  which it can only approximate, and which it cannot hear at all.


