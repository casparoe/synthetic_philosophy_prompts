  Actually the classic "feel the force" for REU: Allais paradox. But that''s seen
  a million times. Need to be in the weeds. Buchak''s key move: instead of ranking
  lotteries by expected utility, the agent applies a risk function r to cumulative
  probabilities: REU = r(p1)·u(x1) + Σ... Specifically, REU(L) = u(x1) + Σ_{i=2..n}
  r(Σ_{j≥i} p_j)(u(x_i) − u(x_{i-1})), where r is an increasing function with r(0)=0,
  r(1)=1. Risk-averse: r(p) < p... actually r convex means risk averse (r(p) ≤ p).
  The key insight: risk attitudes are a separate component of the agent''s preferences,
  independent of belief and value — you can separate "what you believe", "what you
  want", and "how you feel about risk" as three distinct things, and the risk attitude
  is globally applied across all lotteries (a property of the agent, not the prospect).
  Also the "risk-weighted expected utility" model implies certain things: the agent''s
  risk aversion applies uniformly, so it can explain why someone buys insurance and
  lotteries... hmm, actually SEU can explain that too with curvature of u.


  Distinctive predictions of REU: it violates "probabilistic sophistication"? No,
  it''s a generalization of SEU. Its distinctive feature: separability of beliefs
  from risk attitudes — the risk function is applied to cumulative probabilities,
  so it can produce the Allais pattern without appeal to a "certainty effect" that''s
  prospect-theory-ish. And key: it allows the same beliefs to be used in decision
  and in betting on the same events, avoiding the "beliefs are risk-dependent" problem.


  Game design: Hmm. This is genuinely tricky. Maybe a market/trading game where participants
  reveal their risk function via a series of choices, then are given the same beliefs
  and different risk functions. Or: a "two-stage" game where a participant makes choices
  in a sequence of gambles, then the group has to infer the person''s risk function
  and predict their choice on a new gamble — showing that REU (a single global risk
  function) predicts well, and also that the "risk function" is stable across domains.


  Actually, a cleaner idea: the "probability weighting vs. risk weighting" distinction.
  Prospect theory applies weights to individual probabilities (non-linear weighting),
  while REU applies r to cumulative probabilities from the worst outcome up. These
  make different predictions in specific cases — e.g., the "common ratio" vs "common
  consequence" patterns. Buchak argues REU can accommodate Allais but makes a distinctive
  prediction in cases involving three-outcome lotteries: the risk function must be
  applied to cumulative probabilities, so "risk aversion is generated by the worst
  outcomes". A game could be designed: a sequential-choice "lottery ladder" where
  participants reveal their certainty equivalent for a series of lotteries constructed
  so that the cumulative-probability structure is manipulated independently of the
  individual probabilities. Then participants discover that their own choices are
  consistent with a single risk function over cumulative probability, not with independent
  probability weighting.


