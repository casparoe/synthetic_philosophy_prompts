  Let me draft.


  Setup: In a seminar on well-being, we''ve been using the label "tranquilism" for
  the view that only the absence of craving and suffering matters — nothing positive
  is intrinsically good; satisfaction, achievement, etc., count only as the removal
  of craving or distress. After the session, two colleagues (call them X and Y) went
  at it.


  Actually, better: keep it in a reading group / after a colloquium. The professor
  reports.


  Moves:

  1. A (call her Dana): tranquilism has an absurd consequence — it can''t distinguish
  the good life from the life of someone who has simply been rendered incapable of
  craving. If a surgeon severs the right circuits, the patient is tranquil; tranquilism
  must call the result optimal. Any view that can''t distinguish the sage from the
  anesthetized patient has lost the subject matter of well-being. Also the "dreamless
  sleep" point: an hour of dreamless sleep has no craving and no suffering; so tranquilism
  says it''s intrinsically good for you — as good as anything, and indefinitely long
  dreamless sleep would be a perfect life. That''s absurd.


  2. B (call him Ravi): that objection begs the question: it assumes that a state
  must be felt to be good for you. Tranquilism''s claim is precisely that the absence
  of craving is good, whether or not you feel it — and that''s why it can explain
  why a person who is asleep, or under anesthesia, is not thereby suffering and is
  not worse off. Also: it''s not absurd but a substantive thesis. And the "sage vs.
  lobotomized patient" distinction can be drawn in terms of what the state is *apt
  for* / how it was achieved / whether the capacities are intact, i.e., not all absences
  are equal — the sage''s tranquility is robust, the patient''s is fragile and achieved
  by destroying the subject. Also: a person who can''t crave can''t be tranquil either,
  in the relevant sense, because tranquility is a way of being with respect to one''s
  cravings — no cravings, no tranquility. (That''s a nice move: tranquility requires
  the capacity for craving, so the lobotomized patient isn''t tranquil, he''s blank.
  But then the dreamless sleeper isn''t tranquil either, and neither is the dead.
  Then the tranquilist must say either that only the *exercise* of that capacity in
  a certain way counts, or that absences can be good.)


  3. A: that last move is unstable. If tranquility requires an intact capacity for
  craving, then tranquility is not the absence of craving but a *state of the will*
  — an attitude toward cravings, i.e., a positive condition. Then tranquilism is no
  longer "only absences matter"; it''s an ordinary hedonism of a calm, contented kind.
  Alternatively, if it''s genuinely the absence of craving, then absences must be
  able to be good for a subject who has no cravings and feels nothing, which makes
  the death-like cases good. Either way the view either collapses into something else
  or entails the absurdity.


  4. B: there''s a third option: absences can be *good for a subject* without being
  *experienced* as good, provided the subject is one for whom the absence can be *deprived*
  — the "deprivation" relation, i.e., what matters is the counterfactual: had you
  craved, you would have suffered. So the good is the truth of the counterfactual
  "no unsatisfied craving in you." Hmm, but the dead/dreamless also satisfy that.
  B could say: the dead are not subjects at all, so nothing is good for them; the
  sleeper *is* a subject (a living, functioning organism), and the absence of craving
  is a good for her but a very small one — the good supervenes on her continuing to
  be the kind of thing for which cravings can arise and be absent. Hmm.


  Alternatively, B could concede the sleep case as a *consequence*, not a reductio:
  "Yes, an hour of dreamless sleep is intrinsically good, and a bit better than an
  hour of craving and suffering — that''s exactly right and nobody should be embarrassed
  by it. What''s absurd about that?" That''s a nice, genuinely decent point (the "so
  what?" move). Then A: but then a life of permanent dreamless sleep — an unconscious
  life — would be the best life, and tranquilism can''t say anything about why a short
  conscious tranquil life beats a long unconscious one. B: tranquilism is a theory
  of what''s good *for* a subject *while she exists*; it''s not a theory of how to
  live; A is importing the assumption that the good life must be a life you''d choose
  to live, which is a different question.


  Then A: fine, but then tranquilism can''t be an ethical view at all — it says nothing
  about what we should do, since what we should do is to make people tranquil, and
  the cheapest way is to make them insensate (sedation, killing). B: no, tranquilism
  is a theory of well-being, not a total ethics; and it doesn''t follow that a state
  we can bring about is the one we should bring about, because there are non-welfarist
  constraints, and because the absence of craving in a person who has been *made*
  insensate is not tranquility but the destruction of the subject.


  Then the adjudication request: rate each move; who is right about which specific
