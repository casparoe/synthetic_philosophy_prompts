  and Leibniz mocks the Newtonians for needing God to wind up his watch). Also Newton''s
  rejection of the Trinity (anti-Trinitarianism, Arianism), his heterodox views, his
  extensive theological manuscripts, his study of prophecy, the temple, chronology.


  2. The false presupposition: "Newton was a deist; his God was a clockmaker who wound
  up the universe and then left it alone; and he kept his theology private because
  it was separate from his science." The subtle confusion: Newton actually was not
  a deist; he thought God was continually active and omnipresent, and he thought his
  theology and natural philosophy were integrated — the same God who governs. But
  also the clockwork metaphor is more Leibniz''s jab at Newtonianism than Newton''s
  own view.


