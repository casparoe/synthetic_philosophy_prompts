  Essay draft:


  Section title: "Two jobs for one document"


  "An advance directive is asked to do two quite different things, and I think the
  literature''s disagreements are largely the result of letting the two slide into
  one another.


  The first job is sovereign: the directive is the earlier self''s legislation for
  a subject who cannot legislate for herself. On this reading its authority comes
  from the fact that it was autonomously chosen, and it is content-neutral — a directive
  refusing all treatment and a directive demanding everything are equally authoritative,
  because what confers authority is the act of choosing, not the wisdom of the choice.
  This is Dworkin''s picture, and the critical/experiential interests distinction
  is what makes it palatable: the earlier self is protecting her critical interests,
  the ones that give her life a shape, against the merely experiential interests of
  a self that can no longer have the former.


  The second job is evidentiary: the directive is our best proxy for what the later,
  incompetent self''s interests actually are. On this reading its authority is defeasible
  in principle, because it''s a prediction, and predictions can be wrong; the reason
  we follow it is that the earlier self is usually better placed to know what the
  later self will want than a court or a physician is.


  These two jobs come apart in exactly the case that gets discussed: the woman who,
  at fifty, writes a directive refusing treatment in the event of dementia, and who
  at seventy is cheerful, affectionate, socially engaged, and asks for the antibiotic.
  If we take the sovereign reading seriously, we treat her present request as the
  voice of someone who is not, in the relevant sense, the author of her own life,
  and we overrule it. If we take the evidentiary reading, her present request is data
  — very good data, since it is the only first-person report available — and the directive
  loses. The literature mostly assumes the sovereign reading and then argues about
  how much of the earlier self''s authority survives; I want to argue that the sovereign
  reading has no application to the case, and that its appearance of application comes
  from a substantive perfectionism that liberal defenders of advance directives cannot
  endorse.


  Here''s the argument. Sovereignty over a self presupposes that the self over which
  it is exercised is the same practical agent, or that the discontinuity between them
  is of a kind that justifies treating one as the other''s representative. But the
  whole reason advance directives matter is that dementia breaks exactly that continuity
  — that''s why we need a directive instead of just asking. So the sovereign reading
  cannot be doing the work. What actually does the work is a prediction plus a risk-aversion:
  we override the happy patient because we think her contentment is not to be trusted
  — that she has adapted to a diminished life, or that she cannot grasp what she has
  lost, so that her endorsement is not an endorsement by a valuer. That claim is a
  claim about what makes a life go well, and it is doing all the work in the sovereign
  reading''s favour. Strip it out and the sovereign reading collapses into the evidentiary
  one.


  So: the authority of an advance directive should be indexed to the epistemic warrant
  of its author and to the independence of the later self''s present attitudes, not
  to the bare fact that the author chose. And the doctrinal home for this is not the
  law of wills, which is where the analogy usually goes, but the law of trusts: a
  settlor''s terms bind the trustee only insofar as they serve the beneficiary, and
  the law refuses dead-hand control that outlives its rationale — the rule against
  perpetuities, the hostility to restraints on alienation, the refusal to enforce
  conditions that strip a beneficiary of basic rights. A directive is a trust instrument
  with the peculiarity that the settlor and the beneficiary are the same person at
  different times; and the law''s long suspicion of settlors who try to govern beneficiaries
  they will never meet seems to me exactly the right instinct."


