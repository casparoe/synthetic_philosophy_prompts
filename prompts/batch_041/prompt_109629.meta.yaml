  not the same. Also the reading that it''s about 指 (pointing/reference) and about
  the relation between names and objects. Also the false presupposition: that there
  was a "School of Names" that was a self-conscious school, that they were sophists/relativists,
  and that the dialogue is meant as a proof of a paradox rather than a probing of
  how names work (and the pairing with the Mohist "white horse is a horse" as a genuine
  dispute about 類 class-inclusion). Also the tradition: 公孫龍 (Gongsun Long) — the 白馬論
  is attributed to him; the "hard and white" 堅白論; 惠施''s ten theses; the Han category
  名家 in Sima Tan''s essay. Also that the dialogue is arguably a piece of 正名 (rectification
  of names) reasoning, and its relationship to the Later Mohist Canons (小取 etc.).


