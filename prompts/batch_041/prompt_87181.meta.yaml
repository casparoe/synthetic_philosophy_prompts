  The post says roughly this: Ranke is the father of scientific history. His whole
  program was that the historian should show the past as it actually was, i.e. go
  to the archives, let the documents speak, and add nothing of himself — no moralising,
  no theory, no politics. That was the ideal of objectivity for a hundred years. Then
  Carr demolished it: he pointed out that there are millions of facts about the past
  and the historian has to select, so what we call history is the historian''s creation,
  not the past''s. And then Hayden White finished the job: since historians have to
  shape their material into a story, with a beginning, middle and end and a moral,
  history is really a kind of fiction, and the difference between a history book and
  a novel is a difference of packaging. The upshot, says the post, is that there''s
  no such thing as a more or less objective history — every account is a story told
  from somewhere, so we should stop pretending and just admit that all history is
