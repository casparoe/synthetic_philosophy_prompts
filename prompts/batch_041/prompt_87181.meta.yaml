  For akrasia: the classic triad — (a) if you judge that A is best all-things-considered,
  you intend A; (b) if you intend A and are able, you do A; (c) akrasia exists (people
  act against their best judgment). Contradiction. Davidson''s resolution: the all-things-considered
  judgment is a prima facie/conditional judgment, not an unconditional one. Then hyperbolic
  discounting: an argument that time-inconsistency dissolves akrasia because at each
  moment the agent prefers what they do — so "weakness of will" is a misnomer; the
  agent is perfectly rational locally, just with shifting discount rates. A "proves
  too much" argument: (1) A person is weak-willed only if they act against their own
  preference at the moment of action. (2) Hyperbolic discounters always act on their
  strongest current preference (by definition of preference). (3) So there''s no weakness
  of will, only preference reversal. (4) Therefore any "commitment device" is paternalistic
  and the language of weakness of will is ideological. Where does it go wrong? The
  equivocation: "preference at the moment of action" vs "preference over the whole
  course of one''s life"/second-order preference; and the empirical claim that hyperbolic
  discounting is the whole story of akrasia; also, the possibility that the agent
  themselves experiences the reversal as a failure (self-reproach), and that a sophisticated
  hyperbolic discounter who prefers ex ante to be constrained is expressing a preference
  that isn''t reducible to the local one. This is a genuinely good prompt with real
  "in the weeds" content (Strotz''s 1955 time-inconsistency, Ainslie''s picoeconomics,
