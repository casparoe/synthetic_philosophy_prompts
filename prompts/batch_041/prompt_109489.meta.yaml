  Actually, here''s a nice structural point for a taxonomy of the dogmatism paradox:
  The paradox relies on (i) knowledge entails truth, (ii) if P is true, any evidence
  against P is misleading (or at least does not show that not-P), (iii) knowledge
  entails knowing that one knows? no — (iii) it''s rational to ignore evidence you
  know to be misleading, and (iv) knowledge that P puts one in a position to know
  that contrary evidence is misleading. Different positions deny different premises.
  So a decision tree can be built from: "Which premise do you reject?" That''s clean
  and a good decision tree: root = the paradox as a valid-seeming argument; each branch
  node = one of the premises; leaves = named positions.


  Positions denying each premise:

  - Deny (i)/(iv): knowing P doesn''t give you knowledge that contrary evidence is
  misleading — e.g., because "misleading evidence" requires more than "evidence for
  a false proposition"; or because one can know P yet not know that P will survive
  the evidence. This is where the "knowledge is defeasible by misleading evidence"
  view lives.

  - Deny (iii): it''s not rational to ignore known-misleading evidence — e.g., you
  should still lower confidence (evidence about your own fallibility); or rationality
  requires proportioning to total evidence regardless.

  - Deny (ii): evidence can count against a true proposition even if it doesn''t show
  it false (e.g., higher-order/undercutting defeaters, "evidence that your evidence
  is unreliable" — this can defeat even if P true).

  - Deny the inference that knowledge licenses ignoring: distinguish "propositional
  justification" vs "doxastic justification" — you can be justified in believing P
  yet not have the occurrent justification for ignoring.


