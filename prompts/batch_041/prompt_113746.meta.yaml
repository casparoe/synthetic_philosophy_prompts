  I think Kant on animals gives the cleanest dialogue with two well-defined opposing
  positions, and both sides can be made equally competent. Let me think about what
  the two positions are precisely:


  Side A (Kantian orthodoxy / the "indirect duties" view): Kant''s considered position
  is that we have no direct duties to animals; they''re not persons, not ends in themselves;
  our duties regarding animals are really duties to ourselves (and to humanity) —
  cruelty to animals is wrong because it damages our own moral character, our sympathetic
  dispositions, and because it''s "analogous" to treating humans badly. And also there''s
  a subtlety: the argument is not merely instrumental ("it makes you cruel to humans"),
  there''s a claim about the kind of being that animals are: they are "things" in
  the sense of lacking rational agency, and duties require a possible reciprocal obligation
  (a duty is a relation to a being that can be obligated). So side A can give a principled
  argument: the very concept of a duty (as Kant understands it, in the Doctrine of
  Virtue / Groundwork) requires a being capable of obligation, hence animals can''t
  be owed anything directly.


  Side B (extensionist Kantian): denies that. Options: (1) Korsgaard: Kant''s argument
  in the formula of humanity appeals to the value of the "good will" — a rational
  being''s capacity to confer value on ends; animals are not ends in themselves in
  the same way, but they are "ends in themselves" in a different sense — they have
  "final value" as subjects of lives. Korsgaard argues in "Fellow Creatures" that
  Kant''s own argument about ends in themselves (that a rational being''s ends must
  have value for it) extends to creatures who have ends / for whom things can be good
  or bad. (2) The empirical-contingency objection: the indirect duty view makes the
  wrongness of cruelty entirely contingent on the character effects, so a person who
  could torture animals without becoming callous (or with no chance of interacting
  with humans) would be doing nothing wrong — absurd. (3) Kant''s own "analogy" claim
  cuts the other way: if animals are "analogous" to humans, and our duties regarding
  them are duties to humanity because of the analogy, then the analogy does normative
  work that arguably grounds direct concern. (4) The "duties to oneself" reading:
  some argue Kant''s claim that we violate a duty to ourselves in being cruel is about
  self-respect, and self-respect grounds animal treatment — but if so, the duty is
  about us, not them.


