  ---


  I am trying to get clear about the argument that the special theory of relativity
  leaves no room for a privileged present, and I keep meeting a comparison I would
  like you to audit rather than merely illustrate. The comparison is between the present
  and the here. It runs as follows. I occupy one place among many; no place is privileged;
  this does not make the other places unreal — they are all equally real, and my being
  here rather than there is a fact about my standpoint, not about the world. Moreover
  my here is fixed by where I stand and my now by how I move: an observer moving differently
  has a different now, and nothing privileges mine. By parity, then, other times are
  no less real than the present, and the passage of the present is a fact about my
  standpoint rather than about the world. My friend, who deploys the comparison, makes
  it vivid with a second image: the world is a landscape through which a train travels,
  the headlight marking the present, so that the country ahead of the beam is as real
  as the country behind it and only our forward motion makes it seem to come into
  existence. From this he draws a further conclusion — that the future is as settled
  as the past, that the outcome is already there like the town the train has not yet
  reached, and that deliberation and dread about what is to come are therefore misplaced.


  Please audit the comparison on its own terms. Set out the correspondences explicitly,
  as a table if that helps: what is meant to play the role of the observer, the here,
  the other places, spatial distance, and travel; and what is meant to play the corresponding
  roles for time. Then tell me where the mapping breaks, and separate the breaks that
  are merely picturesque from those that are load-bearing for what my friend wants.
  I am particularly interested in what the spatial side quietly imports that the temporal
  side may not possess — whether notions like already there, or our moving through,
  can be understood without covertly placing the describer outside the series being
  described, and whether the comparison is entitled to the contrast between what is
  settled and what is still open. Finally, say whether the conclusion about the future
  and about deliberation follows from the block picture itself or is being carried
  by the analogy; and, if the comparison is worth keeping at all, say what a better
  one would be.


  ---


