  Two colleagues of mine, neither of them a specialist in the area, spent the discussion
  period of a departmental seminar on the philosophy of mind in a dispute about pain
  that neither would give up, and I spent the hour as a bystander. The clinical anchor
  was pain asymbolia, the syndrome in which a patient experiences pain without its
  unpleasantness: after damage to the insula, or after psychosurgical procedures such
  as cingulotomy, or on some analgesic regimens, patients can localise a noxious stimulus
  and describe its intensity and quality while denying that it bothers them at all.
  They will say they are in pain and then smile, decline to complain, and tolerate
  stimuli that others find unbearable. The proposed mechanism in the neurological
  literature is a disconnection between the insular cortex, where the sensation is
  registered, and the limbic structures that ordinarily attach an aversive charge
  to it. Treat the description as fixed for the sake of argument; the dispute was
  not about the neurology but about what, if anything, the syndrome shows about why
  pain is bad.


  Reconstructing the exchange as fairly as I can, it went like this.


  1. A: asymbolia shows the badness of pain is not intrinsic to the sensation. The
  patient has the pain — same location, same intensity, same quality — and none of
  the suffering. So what makes pain bad is a separate, added component, the affective
  one; the sensation by itself is information, and information is not bad for anyone.
  Corollary: the badness of pain is contingent and removable.


  2. B: that''s too quick. Either the patient is not really having pain, in which
  case ''hurts'' has quietly changed meaning and the case tells us nothing about pain,
  or the patient is having pain and it is still bad for them, just not in a way that
  makes them mind. Badness for a subject does not require the subject''s aversion.
  A harm you are indifferent to is still a harm; people can be wrong about, or blind
  to, what is bad for them.


  3. A: then the claim that it is bad for them has no one home. If there is no unpleasantness,
  no avoidance, no wish for it to stop, and the patient will choose the stimulus again
  tomorrow, what is left of ''bad for them'' except a verdict pronounced from outside
  on a state the subject cannot find anything wrong with? Either badness shows up
  somewhere in experience or it is a free-floating label.


  4. B: two things. First, a distinction: asymbolia might be subtraction — ordinary
  pain with the affective component deleted — or substitution — a state that mimics
  pain''s sensory profile but is a different kind of state altogether. The clinical
  evidence, which consists mostly of patients'' reports that they can localise and
  grade the stimulus, underdetermines which. If substitution, the case is no more
  evidence about pain''s badness than a machine that prints ''Ouch'' would be. Second,
  and more troubling for A: when the patient says ''it hurts,'' we do not know whether
  that is an avowal, an expression of how things feel, or a classification, a report
  that a stimulus of the noxious type has been applied. On the second reading, the
  patient need not be in pain at all in the phenomenal sense.


  5. A: the substitution hypothesis is idle unless you can say what would distinguish
  it, and the disconnection story you yourself granted makes subtraction the more
  economical reading. Consider also the obvious experiment: if we could induce temporary
  asymbolia in an ordinary person — a hedonic mute — and she then chose the noxious
  stimulus over a mild itch, you would have to say she was mistaken about her own
  life. And the practical upshot, which is where this started: if suffering is a component
  that can be deleted while the sensory and protective functions remain, then asymbolia
  is a proof of concept for engineering suffering out of creatures rather than blunting
  their pain.


  6. B: that inference is the one I doubt. A creature with intact nociception and
