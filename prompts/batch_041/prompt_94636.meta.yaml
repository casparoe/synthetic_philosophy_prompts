  wrong") in which they''re treated as answerable. So "understanding" is partly constituted
  by our practices, and the question becomes: *should* we extend standing?


  That''s a genuinely interesting, non-rote position (a Brandomian/Sellarsian move
  applied to LLMs, with the twist that the *institutions* of training/eval constitute
  the standing). And it''s contestable in interesting ways:


  Presses:

  1. **The bootstrapping/etiquette objection**: If standing is conferred by our practices,
  then "does it understand?" collapses into "do we choose to treat it as answerable?"
  — and that seems to make understanding a matter of courtesy. Reply he''d give: that''s
  true of us too (Brandom: to be a knower is to be treated as one). Follow-up: but
  for humans, the treatment is *warranted* by something — capacity for responsiveness
  to reasons — so what warrants it for the model? And if he says "nothing, it''s a
  decision", then the view is quietism and the original question ("does it *really*
  understand?") is not answered but dissolved. Press: dissolution is only acceptable
  if it doesn''t smuggle in a substantive claim about the *same* phenomenon that the
  parrot-sceptic is worried about (that there''s no meaning there at all).

  2. **The "responsiveness" condition**: The parrot sceptic''s core claim is that
  the model''s outputs are *insensitive* to meaning — it can''t tell a case where
  a word applies from a case where it doesn''t, except by surface statistics. The
  standing view seems to license understanding without any such sensitivity. Question:
  what internal property, if any, must the system have for the conferral of standing
  to be *non-fictional*? If none, then a lookup table over a fixed corpus, maintained
  by a human who answers follow-ups by hand, would count as understanding — and that
  seems wrong (or does he bite the bullet?).

  3. **The "who is answerable" regress**: If the standing is held by the *socio-technical
  system* (model + trainers + users), not the model, then the interesting question
  moves to the system — and the "does the LLM understand" question becomes a question
  about us. But then does he lose the ability to say anything about the model? And:
  the labs are the ones who''d hold it to account — do we get a view on which understanding
  is a matter of *corporate* practice?

