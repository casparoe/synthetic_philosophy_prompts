  Proposal: The guest argues that the stochastic-parrots debate is stuck because both
  sides assume "understanding" is a *state* a system has or lacks, when it''s really
  a *standing* — a normative status you hold in a practice of holding-to-account.
  Call it the "standing view" (invented label). On this view, the question "does the
  model understand?" is answered not by inspecting the model but by asking whether
  there''s a practice in which its outputs are answerable — whether you can *disagree
  with it*, *demand reasons of it*, *correct it*, and whether it can *take up* a correction
  as a reason. And he claims LLMs do hold a kind of standing — not because of anything
