  ---


  I am a third-year student in a course on the ethics and law of death and dying,
  and our final assignment is a short story rather than an essay. The instructor''s
  reasoning is that the interesting problems in this area are not disputes between
  positions but tensions inside a single position, and a narrative can hold a tension
  that an argument has to resolve. I would like you to write that story.


  Here is the material I want it built on. The model statute in most American jurisdictions
  defines death disjunctively: a person is dead if they have sustained either irreversible
  cessation of circulatory and respiratory functions or irreversible cessation of
  all functions of the entire brain, including the brain stem. So the law does not
  pick out one thing that death is; it gives two independent routes to the same verdict,
  and the verdict, once reached, is what licenses everything downstream -- withdrawal
  of treatment, the end of a duty to resuscitate, the reading of a will, and the removal
  of organs under the rule that organs may be taken only from someone already dead.


  The seam I want the story to find is in the word "irreversible." When death is determined
  by circulatory criteria, the word is not usually read as "cannot be restored" but
  as "will not be restored": circulation is treated as irreversibly lost once a decision
  has been made not to attempt resuscitation, even though the heart might in principle
