  Setting: a seminar, 15-20 students, 75 minutes. Activity: a "public" simulation.
  Each participant gets a device/paper to post anonymous one-line reactions to a provocation
  (a real-ish news item / a scandal). Rules: no one signs anything; posts are pooled
  and read aloud by a facilitator; a "newspaper" is produced that summarizes the aggregate
  opinion. The trick: after building up a "public opinion," you ask each individual
  privately whether they hold that view, and almost no one does — the public''s opinion
  belongs to no one. Then introduce a second phase with stakes: a decision must be
  made (e.g., whether to act on a person in trouble, or whether the public "condemns"
  someone), and see how anonymity dissolves responsibility — the crowd as untruth,
  levelling. Also a "levelling" mechanic: any attempt by an individual to stand out
  (a signed, sincere contribution) gets neutralized by the chatter — you can encode
  this as a rule where the newspaper can only publish unsigned items and any signed
  item is treated as mere opinion among opinions.


  Debrief: map moments to levelling, the public as abstraction, chatter, the press
  as the vehicle, and "the single individual" as the antidote. What will predictably
  go wrong: participants find it fun and become cruel, or the "no one holds the view"
