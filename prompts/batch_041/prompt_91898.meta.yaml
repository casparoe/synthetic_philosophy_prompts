  ---


  I''m a novelist — about 180 pages into a comic novel set in a mid-70s economics
  department (tweed, tenure fights, a terrible coffee machine), and there''s a chapter
  where my protagonist, a first-year assistant professor, reads out a press release
  from the think tank that''s just hired her. I want the press release printed verbatim
  as the chapter, and I''d like you to write it.


  The premise, which I think is a good one: the institute has an annual ritual where
  it "audits" its flagship forecasting model for realism — and this year''s audit
  has certified that the model''s core assumptions are false, wildly inaccurate, and
  have never described a single real human being. The press release announces this
  as a triumph. Which is the joke, obviously, and I don''t want you to explain the
  joke: it should read as a completely straight, slightly proud institutional document.
  The funny part has to come from the methodology being *right* — I''ve been reading
  about Friedman''s F-twist thing, the claim that a theory''s assumptions can be wildly
  inaccurate so long as the predictions are good, and even that the more significant
  the theory, the more unrealistic its assumptions — so the specialist reader should
  watch the release slide from the defensible claim (we don''t test assumptions, we
  test predictions, we don''t care whether firms literally maximize anything as long
  as they behave as if they do) into the indefensible ones: treating unrealism as
  an achievement you can win a prize for, using the same model to hand out policy
  advice and welfare verdicts, forgetting that the assumptions you waved through are
  the ones carrying the causal story, forgetting that what predicted well under one
  regime needn''t survive a change in the rules of the game. I don''t want a smug
  "economics is fake" hit piece — I want the economists I know to laugh and nod, and
  a reader who''s never heard of any of this to still follow it.


  Structure I''m picturing: headline, dateline, a proud opening, a quote from an invented
  institute director (invent everyone — I don''t want a real person''s name in my
  novel''s fake press release, and no real institutions either), a second quote from
  someone mildly worried who gets steamrolled, a short FAQ or complaints-procedure
  sidebar, and a "Notes to editors" boilerplate at the end that quietly gives the
