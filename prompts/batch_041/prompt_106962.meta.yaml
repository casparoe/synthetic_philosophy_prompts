  Structure:

  - Name the work: Ursula K. Le Guin''s "The Ones Who Walk Away from Omelas," and
  note the subtitle "Variations on a theme by William James" and that it responds
  to James''s "The Moral Philosopher and the Moral Life" (1891), where James imagines
