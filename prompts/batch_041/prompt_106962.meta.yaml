  torture, and says most would find it hideous. (Paraphrase, no quotes.)

  - State the philosophical idea: Harsanyi''s aggregation theorem. Explain: given
  a social welfare function that satisfies expected-utility axioms and the Pareto
  indifference principle, social welfare must be a weighted sum of individual utilities.
  Harsanyi''s "equiprobability" argument: a moral chooser behind a veil of ignorance,
  equally likely to be any member, should maximize expected utility; for large populations
  the risk of being the unfortunate one is small, so the calculus can favor arrangements
  like Omelas. Contrast with Rawls''s maximin, which Harsanyi rejected as irrational
  risk-aversion.

  - Ask for the reading: Does Harsanyi''s theorem actually license Omelas, or does
  it, properly applied, forbid it? Where does the story illuminate the theorem (the
