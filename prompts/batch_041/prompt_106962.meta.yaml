  Harsanyi''s aggregation theorem: Harsanyi''s utilitarian theorem says that if you
  accept (i) each individual''s preferences, (ii) the Pareto principle, and (iii)
  a "veil of ignorance" where each individual''s social choice is made under equiprobability
  (equal chance of being anyone), then social welfare must be a weighted sum of individual
  utilities — i.e., utilitarianism. His key move: "extended preferences" / the equiprobability
  model. And the contrast with Rawls''s maximin, which Harsanyi criticized. Also Harsanyi''s
  distinction between "personal preferences" and "moral preferences" (impersonal).
  And his argument that the veil of ignorance leads to average utilitarianism rather
  than maximin because you should maximize expected utility, not worst case.


