  Harsanyi''s aggregation theorem (1955, "Cardinal Welfare, Individualistic Ethics,
  and Interpersonal Comparisons of Utility"): He argues that if (a) social welfare
  is a function of individual utilities, (b) satisfies the Pareto principle, and (c)
  we use the "equiprobability model" (Bayesian rationality under a veil of ignorance
  where each individual has an equal chance of being anyone), then the social welfare
  function must be a weighted sum of individual utilities (utilitarianism). His "extended
  preferences" or "moral preferences" idea: a person''s moral preference is their
  preference about what should happen given an equal chance of being any individual.
  He argued this yields utilitarianism, and he criticized Rawls''s maximin as irrationally
  risk-averse (should maximize expected utility, not worst case).


