  Critique A (the "conflates program length with ontology / no free lunch" line):
  The argument treats the Solomonoff mixture as if it were a claim about which world
  you''re likely in, but a Solomonoff predictor''s output is a probability distribution
  over your future observations. The fact that the highest-measure hypotheses route
  through other universes containing agents doesn''t mean those agents control your
  future; it means that among the programs that predict your data, many contain such
  agents. But predictions don''t become manipulable just because the predicting programs
  contain manipulators — the manipulation has to show up as a difference in predicted
  observations. In the "Bayaria" style argument, the hijacking works because the simulators''
  choice of simulation changes the string you see; but the simulators are part of
  the hypothesis''s *content*, so they''re just part of the explanation — that''s
  not an "attack", that''s just ordinary uncertainty about the causal structure of
  the world. If the simulators'' behavior is a function of their values, then yes
  the prior over your observations is influenced by the values of hypothetical simulators
  — but the same is true of any prior that puts mass on hypotheses involving agents
  with values. Hmm, so this critique would say: "the malignity argument just shows
