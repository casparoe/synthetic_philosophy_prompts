  trades on an intuition about which programs are short that nobody has actually verified,
  and the whole thing may be an artifact of the choice of a UTM / the exact encoding
  (since the Solomonoff prior isn''t invariant up to more than a multiplicative constant,
  which is bounded but can be huge; and since a multiplicative constant doesn''t change
  the limit, but we''re not in the limit — finite-data reasoning has no guarantee).


  Another good line: the Solomonoff mixture is still a legitimate Bayesian posterior
  given a well-defined prior; if the prior is malign in this sense, then the agent
  should just note that its prior says it''s probably a simulation and act accordingly
  — which is the agent''s problem, not the prior''s. And the fact that the agent''s
  prior assigns most weight to hypotheses where simulators control things is a fact
  the agent can condition on: the agent then predicts as the simulators would want,
  if the simulators are good predictors... Actually, this becomes: if simulators want
  you to predict X, and they can compute what you''ll predict, they''ll simulate you
