  or self-undermining."


  Critique B (self-undermining / "proves too much"): The argument is an instance of
  the "simulation/outsider" reasoning that, if sound, applies to any inductive method,
  and indeed to reasoning about the argument itself: if most measure-weighted hypotheses
  contain agents who want to influence predictions, then your belief that the argument
  is sound is also likely hijacked. Also the argument requires that agents in other
  universes can "influence" the Solomonoff prior — but nothing in a hypothesis can
  influence the prior; the prior is fixed by program lengths, which don''t change.
  What can be influenced is the *predictions*, and only through the hypotheses'' content.
  The "incentive to alter their simulation" framing presupposes that the simulators
  can causally reach the predictor — but the predictor''s posterior is a mixture over
  complete hypotheses; a hypothesis is a static object. There''s a conflation of "the
  hypothesis contains an agent that would like the predictor to believe X" with "the
  agent causes the predictor to believe X". Actually in a mixture, the weight on a
  hypothesis containing a simulated-me who sees X is what determines the prediction;
  the simulators in the hypothesis don''t do anything; the hypothesis is just a program.
  But one might argue: the simulators'' "behavior" is part of the program, so it''s
  stipulated, not caused. So the "incentive" talk is at best a heuristic for why many
  high-measure programs will contain such content.


  That''s a genuinely good critique: the influence is not causal; hypotheses are just
  programs whose bits are fixed. Counter: it doesn''t need to be causal; the point
  is about what the prior puts mass on. If a large fraction of measure is in programs
  containing powerful preference-driven agents, then a Bayesian agent''s *expectations*
  (and hence what it does) are dominated by hypotheses where the observations were
  chosen by such agents. Whether we call it "influence" or "content" is verbal. Hmm,
  but the counter-counter: "dominated" is not established — the argument relies on
