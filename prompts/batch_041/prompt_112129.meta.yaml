  self-binding devices adopted by a people against its own future weakness of will,
  drawing on Elster''s reading of Odysseus and the Sirens. She has two signature deflections:
  (i) "that''s not an objection to precommitment, that''s just what precommitment
  is for" when pressed on the fact that the later majority disagrees with the entrenched
  commitment; (ii) "the people is a continuing agent, not a series of generations"
