  I have no training in philosophy — I work in freight logistics — but I spent five
  weeks making medical decisions for my father after a stroke took away his ability
  to speak or understand, and I have been turning over what the hospital asked of
  me ever since.


  He had left no written directive. So the team told me I was to decide as he would
  have decided, not as I thought best for him, and they were insistent that the distinction
  was not a formality. There is even a name for it in the paperwork: substituted judgment.
  I was, in effect, asked to be a place where his wishes were stored and could be
  read out loud. I noticed the edges of this later. When a patient has signed a directive,
  the document beats the family''s sense of what the patient would have wanted. When
  nothing is signed and the family is absent, the same team may decide on the patient''s
  behalf in what they judge to be the patient''s interests, which is a different question
  entirely. So sometimes the patient''s own stated will governs, sometimes my reconstruction
  of a will he never stated governs, and sometimes neither.


  What I want to know is what this practice assumes about what a person is. When they
  asked me what he would have wanted, they spoke as though he were still somehow in
  the room, and as though the part of him that mattered had been copied into me. A
  friend pointed me to Douglas Hofstadter, who argues in his 2007 book I Am a Strange
  Loop that the self is a pattern rather than a piece of tissue, that people who live
  closely together each hold a large part of the other''s pattern in their own brains,
  and that when one dies the other still carries a reduced version of them that goes
  on thinking. I cannot tell whether that is a metaphor or a literal claim about where
  a person is located, and I cannot tell whether the hospital was committed to it
  or to something much weaker.


