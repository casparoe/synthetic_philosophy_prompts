  Key ideas from du Châtelet''s Discours sur le bonheur (written 1744-46, published
  posthumously 1779):

  - Happiness requires: good health, freedom from prejudice, having tastes and passions,
  making passions serve our happiness, replacing passions with tastes (as we age),
  preserving illusions, being virtuous, never repenting, banishing sad ideas (esp.
  of death), choosing a path and strewing flowers on it.

  - Her three great passions: gambling, love, study. Study is the passion that can
  be kept in old age (love fades, gambling can be moderated and reserved for old age
  as a resource).

  - She argues against the Stoics: they want to suppress passions, but she says passions
  are the source of happiness; we should use them, not extirpate them.

  - Illusions: she defends keeping agreeable illusions (e.g., the theater), against
  the philosopher''s demand to see through everything. She says we can put art into
  our lives.

  - There''s a tension: she praises illusion while also demanding truth/freedom from
  prejudice. And she was a woman in a society that denied her; happiness as something
  we must contrive within constraints.

