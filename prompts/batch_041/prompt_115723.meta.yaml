  rather than the individual answers. Any non-trivial restriction seems to face two
  pressures at once: the arbitrariness worry, that whatever feature is picked out
  is gerrymandered to fit the cases we already like, and the monstrosity worry, that
  a criterion generous enough to deliver tables and cats must explain why it doesn''t
  also deliver the sum of my left shoe and the Moon, or the sum of this paragraph''s
  letters, or the scattered halves of a broken cup. Meanwhile the unrestricted and
