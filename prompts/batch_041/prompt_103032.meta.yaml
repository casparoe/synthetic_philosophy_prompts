  finished product; there is no revision of an already conscious experience, because
  the experience only becomes conscious after the delay. So the Orwellian view says
  the experience is delayed, while the Stalinesque view says the memory is edited.


  Dennett''s objection is that these two stories are empirically indistinguishable.
  All the evidence we have is the subject''s retrospective report, and both stories
