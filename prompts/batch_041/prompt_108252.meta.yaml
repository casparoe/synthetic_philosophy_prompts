  Possible prompt:


  I hold the following position about attributing beliefs and desires to AI systems.
  The intentional stance is not merely a useful predictive heuristic when applied
  to large language models; at least some belief and desire attributions to such systems
  can be literally correct. On this view, to say that a model believes that p is to
  say that its behavior is reliably and systematically best predicted and explained
  by treating it as representing p and acting on that representation, and that this
  pattern is robust across contexts, integrated with its other attributions, and causally
  sustained by internal states rather than by shallow input-output regularities. I
  am not claiming the model is conscious, nor that it has original intentionality
  in Searle''s sense; I am claiming that the vocabulary of propositional attitudes
  can be apt for it in roughly the way Dennett thought it could be apt for a thermostat,
  but with the further claim that for contemporary LLMs the aptness can rise to literal
  truth rather than mere as-if convenience.


  What would count against this? I want the defeaters mapped, not just listed. In
  particular:


  1. Which empirical findings about LLMs would be decisive against literal attribution,
  which would be serious but survivable, and which would be merely awkward? Consider
  evidence about prompt sensitivity, sycophancy, hallucination, chain-of-thought unfaithfulness,
  in-context learning, activation steering, probing for truth directions, and the
  instability of apparent beliefs across semantically irrelevant changes. For each,
  say what it would show if it held up, and what a defender should concede.


  2. Which philosophical objections have real force? Distinguish the indeterminacy-of-interpretation
  objection, the disjunction problem, the rule-following considerations, the frame
  problem, the grain problem for ascribing beliefs at the right level of abstraction,
  and the derived-versus-original intentionality objection. Which of these are independent,
  and which collapse into one another?


  3. What would it take for the position to be false rather than merely qualified?
  If the defender retreats to the claim that the stance is useful but not truth-apt,
  is that a concession or a clarification? Is there a version of the position that
  risks nothing and therefore explains nothing?


  4. What should a defender of the literal-attribution view concede up front? I am
  most persuaded by mechanistic interpretability results that seem to locate stable,
  causally efficacious representations of truth, falsity, and other features, and
  by the fact that LLMs can revise beliefs in light of evidence in ways that look
  more than merely associative. I am least persuaded by behavior-only arguments from
  conversational fluency. Tell me whether those priors are defensible, and what would
  have to happen for me to give them up.


