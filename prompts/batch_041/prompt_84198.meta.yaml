  who has actually written and delivered speeches rather than only written about them.
  Think carefully before you write, and begin with a short private plan.


  The facts, as plainly as I can set them out. In 1982 the city''s drinking water
  was drawn downstream of a plating plant owned by the family that had, for three
  decades, effectively chosen the mayor. The health department''s own sampling showed
  the contamination that spring. Ballard kept the file closed for eleven months and
  used it: he told the owners he would keep the results out of the newspapers and
  out of the state attorney general''s hands if they would fund and not obstruct the
  filtration plant and the soil remediation that came online in 1986. That plant and
