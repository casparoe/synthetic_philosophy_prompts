  Position: God has "middle knowledge" — before deciding what world to create, God
  knows, for every possible free creature, what that creature would freely choose
  in any circumstances God might place them in. This lets God providentially arrange
  circumstances so that creatures freely do what God intends, without God causing
  their choices. This reconciles divine providence/sovereignty with genuine libertarian
  free will.


  What would count against it? The student asks for defeaters, ranked, distinguishing
  decisive from awkward, what the view''s defenders would concede, and whether the
  view is insulated by qualifications (and whether that''s a problem).


  Defeaters:

  1. Grounding/truthmaker objection: If counterfactuals of freedom ("If Peter were
  in circumstances C, he would freely deny Christ") are true before anyone makes any
  choice, what makes them true? Not God''s will (that would make the choice determined/unfree).
  Not the creature (who hasn''t chosen). If nothing grounds them, they may lack truth
  value, and you can''t know what isn''t true. This is a strong internal defeater
  — and it''s what the defenders would concede as the hardest.

  2. The libertarian-freedom objection: If libertarian freedom requires the agent
  to be the ultimate source/originator of their choice, then a fact about what the
  agent would freely choose in non-actual circumstances seems to settle the choice
  in advance, threatening the very freedom the view is meant to protect. So middle
  knowledge may be incompatible with the libertarian freedom it''s paired with. (This
  is the "no counterfactuals of freedom" line — Hasker.)

  3. The "transworld depravity"/feasibility problem: If every possible creature is
  such that there''s a feasible world where it freely sins, then maybe there''s no
  feasible world where all freely do good — which pressures toward the conclusion
  that God couldn''t have actualized a better world, or that the view collapses into
  a form of determinism/Calvinism. Actually this is more of a problem for theodicy,
  but relevant.

  4. Empirical/conceptual: Does the view make any predictions? Can any observation
  tell us whether middle knowledge exists? If not, is it unfalsifiable — and is that
  a problem for a metaphysical/theological view?

  5. Collapse: If you weaken "freely" to compatibilist freedom, middle knowledge becomes
  trivial (God knows what determined creatures will do), and the distinctive apparatus
  is unnecessary; so the view either collapses into compatibilism or rests on libertarian
  freedom, which is itself contested.


