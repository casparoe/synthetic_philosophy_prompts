  Draft:


  "For some years I have kept a list of small cases in which I take a privacy wrong
  to have occurred, and I have been unable to state what the wrong consists in, or
  to find a term for the thing that is wronged. I would like you to tell me whether
  the phenomenon has an established name, and if it does not, to propose one with
  a definition and its boundary cases.


  The cases that defeat my attempts to say what is wrong are these. First: a friend
  reads a letter I left on the table. The letter says nothing she did not already
  know, and in fact I would have read it aloud to her had she asked; and yet I am
  sure something was done to me, and that the something is not the increase in her
  knowledge, since there was none. Second: a doctor looks up my records without a
  clinical reason. She learns nothing surprising and treats me no differently; I am
  nonetheless wronged, and it seems to matter that she did not ask, even though my
  answer would have been yes. Third: the same fact about me reaches two people by
  different routes -- one from my own telling, one inferred from a pattern in what
  I have bought and where I have been -- and I resent the second and not the first,
  though the second person''s picture of me is less accurate than the first''s. Fourth,
  the reverse: I am sometimes glad that something about me is known, and would be
  sorry if it were forgotten, while still objecting to the file in which it is kept
  and to the fact that it can be consulted without my knowing.


  What these cases have in common, as far as I can see, is that the wrong does not
  track how much is learned, how sensitive the fact is, or what is done with it afterwards.
  It seems to track the route rather than the destination: whether I was asked, whether
  the knowledge is held as part of a representation of me rather than as something
  I gave someone, whether the knower is in a position to act on it without my participation.
  But when I try to say this precisely I end up with either a very thin claim (the
  wrong is that I was not consulted) or a claim that is plainly false (the wrong is
  that I lost control, when in the second case I would have surrendered control gladly
  and in the first case I never had the information under control at all).


