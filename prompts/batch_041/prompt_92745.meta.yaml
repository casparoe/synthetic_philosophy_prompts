  in turn. Second: ''voice'', the central term of every writing workshop I have been
  in. No two writers define it the same way, and most of the definitions are not merely
  different but incompatible; nevertheless, a room of writers will independently flag
  the same paragraphs as lacking it, and the agreement is not random. Third: a character
  in my current book who is a fluent impostor — he uses the vocabulary of a profession
