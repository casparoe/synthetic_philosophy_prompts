  derive the other''s choice from its own reasoning about what it will do. [This is
  the "logical correlation" idea.]

  (3) So the class of agents I can trade with is fixed not by physics but by similarity
  of decision rule and information: any agent that would reason as I do, from a similar
  picture of the situation.

  (4) "Any agent" includes agents in distant regions of the universe, in other branches
  of the wavefunction, and — since my reasoning is a pattern rather than a particular
  physical thing — agents that are merely possible, or that exist in the way that
  a mathematical object exists. [The slide.]

  (5) If my credence that there are such agents, and that their choices correlate
  with mine, is non-zero, then expected value theory counts their welfare in the payoffs
  of my actions. [expected value premise]

  (6) There is no reason for that credence to be zero: no evidence rules them out,
  and the number of such agents, if there are any, is enormous (perhaps infinite).

  (7) So the expected value of my actions is dominated by the welfare of merely possible
