  Draft acausal trade argument:

  (1) Two agents can benefit by each doing a costly thing the other would reward,
  even if neither can affect the other, provided each can predict the other''s decision.

  (2) Prediction here is a matter of logical/decision-theoretic correlation, not causation:
  if I know that any agent who reasons as I do will reason to the same conclusion,
  then my choice is evidence about theirs and vice versa.

  (3) Nothing in (2) requires the other agent to exist in my light cone, or at my
  time, or to be made of the same stuff.

  (4) So my choice is evidence about the choices of any agent whose reasoning is sufficiently
  similar to mine, including agents in other branches, other regions of the multiverse,
  and merely possible agents, if any.

  (5) Therefore I should pay costs to benefit such agents whenever the trade is favorable,
  including costs to benefit merely possible agents and agents in worlds I cannot
  affect at all.

  (6) But then: for any good I could do for a merely possible agent, there are indefinitely
  many merely possible agents just like them; the favorable trades are unbounded in
  number and the total cost demanded of me is unbounded (my entire life, and every
  resource, and then some).

  (7) Also, by symmetry, the same argument tells every such agent to do the same for
  me, which doesn''t rescue me.

  (8) So acausal trade is either a minor extension of cooperation or a demand that
  swallows everything.


