  Draft:


  "In my epistemology seminar this term we spent the last two weeks on the dogmatism
  paradox, and for the final paper I''ve chosen to argue for a verdict on it rather
  than write another survey of the positions. The paradox, as I understand it and
  as I''d like you to address it, runs roughly like this. Suppose I know that P. Now
  suppose that new evidence E comes to light which, were I considering it on its own,
  would give me good reason to think that not-P. Since I know P, P is true, and therefore
  E cannot be a genuine sign that not-P; it must be misleading evidence. But then
  it looks as though I am entitled to set E aside without even examining it, and in
  general to treat the acquisition of knowledge as a licence to ignore whatever later
  evidence turns up, on the ground that it is bound to be misleading. Knowledge, on
  this picture, is dogmatic by its very nature, which is a strange result: it suggests
  that the better my epistemic position is with respect to P, the less responsive
  to evidence I need to be about P. It also seems to refute itself, since if I am
  entitled to ignore evidence against what I know, I am entitled to ignore the evidence
  against this very conclusion.


  I want the essay to defend one diagnosis and to say why the others fail. Four candidates
  seem worth weighing, and I''d rather you engage them as positions than as names
  attached to them — I don''t need a literature review, and there''s no point citing
  work we can''t check. (1) The argument is sound and the conclusion should be accepted:
  knowledge is dogmatic, and this is a feature rather than a bug, because the point
  of knowing is to close a question. If you take this line, you owe an account of
  why the self-undermining appearance is only an appearance. (2) The argument fails
  because a knower cannot use her own knowledge as a premise in this way: the step
  from ''I know that P'' to ''P'' may be available from the outside but not to the
  believer herself as a step in her deliberations, and without it she has no entitlement
  to pre-empt E. (3) The argument mistakes the level at which the question is asked:
  what is really at issue is not what a single act of disregarding evidence may do
  but which general policy of belief management a believer should adopt, and such
  a policy must be judged by its effect on inquiry as a whole, not by the permissibility
  of one instance. (4) The argument trades on running together two things: whatever
  entitles me to form the belief in the first place need not be what keeps me entitled
  to it later, so the paradox shows something about the fragility of retained knowledge
  rather than about dogmatism.


  Along the way, the essay should isolate exactly which premises the argument needs
  — that knowledge is factive, that a knower may rely on what she knows in working
  out what to believe, and some particular account of what makes evidence misleading
  — and say which of them can be dropped without losing the paradox. It should also
  say whether the puzzle, if it bites at all, bites on justified belief and not only
  on knowledge. Finally, it should state what would have counted as evidence against
  the verdict you reach. Please end with a definite verdict and defend it; ''each
  response captures something important'' is not an acceptable conclusion."


