  The asker is a reader (maybe a student) puzzling over chapter 25 of The Prince.
  The tension:


  1. The river/dikes simile: fortune''s power is resisted by "ordered virtù" — foresight,
  preparation, defenses built in quiet times (impersonal, institutional, prudential).
  So virtù = anticipating and building barriers.

  2. Then the "spirit of the times" argument: success depends on whether one''s fixed
