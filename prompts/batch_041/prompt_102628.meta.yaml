  Prompt:


  I teach a 90-minute session in a graduate seminar in metaphysics, with twelve students
  who have already done some Bayesian confirmation theory and are comfortable with
  thought experiments. I want to run an in-class activity that makes them feel the
  force of the doomsday argument, not hear it described. The target is the moment
  when they realize that their own position in the sequence of observers is evidence
  about how many observers there will be, and that this evidence is generated by a
  selection effect rather than by any prediction about the future. I do not want them
  to hear the name doomsday argument until the debrief.


  The activity should have two stages that pull in opposite directions. In the first,
  participants should be randomly assigned a rank within an unknown total, and then
  have to bet on whether the total is small or large; the payoff should reward the
  correct inference, so that the selection effect has teeth. In the second, I want
  them to encounter the self-indication response in a way that is not just a verbal
  objection: the setup should make it vivid that hypotheses with more observers also
  make their own existence more likely, and that this can offset or cancel the first-stage
  shift. The two stages together should leave them unsure whether the doomsday reasoning
  is compelling or self-undermining, and should make the reference class problem concrete:
  the conclusion depends on which observers are counted and on whether the total is
  fixed or itself chancy.


  Please give me the full runnable design: the setting and materials, the rules for
  both stages, the payoff or scoring scheme (no real money), the roles if any, a timeline
  for the 90 minutes, and a debrief that maps specific moments in the activity onto
  the components of the doomsday argument and the self-indication response. The debrief
  should also explain where each stage could be resisted and what it costs to resist
  it there. Tell me what will predictably go wrong the first time I run it and how
  to handle it. Finally, be frank about which feature of the doomsday argument the
  activity cannot reproduce and that I will have to supply in the debrief. The activity
  should not require any prior reading, and it should not depend on citations or names
