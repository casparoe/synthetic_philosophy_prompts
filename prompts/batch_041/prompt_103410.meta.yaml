  In-the-weeds content to seed (as the asker explaining the concept, from their own
  understanding, casually):

  - If a bunch of people each *can* act alone and each wants the same good outcome,
  the action gets taken way too often, because only one of them has to be optimistic
  enough.

  - The key asymmetry: the marginal decider is whoever most overestimates the benefits
  / underestimates the risk, and the group''s outcome is set by that person, not by
  the average.

  - The more people in the group, the worse it gets (with more people, the max of
  the "willingness to act" distribution increases).

  - The obvious fix (require agreement) has costs: you lose the cases where the unilateral
  actor was right; veto power goes to the most cautious/least-informed; coordination
  costs.

  - Also: it''s about irreversible actions; and about agents who are trying to do
  good, not villains.

  - Also a subtlety: the curse is a selection effect — the group doesn''t choose the
  action, it''s chosen by an outlier.

  - Maybe also: "if everyone knows about the curse, they might over-correct", and
  the rule can be gamed by whoever frames the decision.


