  Draft:\n\nI teach an undergraduate seminar on Wittgenstein and Kripke, and this\
  \ term I want to pair Kripke's rule-following argument with Shirley Jackson's \"\
  The Lottery\" — not as a cute illustration, but because I think the story is doing\
  \ philosophical work that the literature on the skeptical solution has not fully\
  \ absorbed. Give me a reading of the story through that lens.\n\nThe obvious points\
  \ of contact are the ritual's decayed state. The black box is said to be made partly\
  \ from the box that preceded it; the chips of wood have been replaced by slips of\
  \ paper; the chant has been forgotten, though people still disagree about whether\
  \ the official used to stand in one place or walk among the villagers; some neighboring\
  \ villages have given the lottery up and Old Man Warner treats that as a betrayal\
  \ of something. Jackson never tells us what the lottery originally was, what rule\
  \ it encodes, or what would count as getting it wrong. That is precisely Kripke's\
  \ situation: you have never added numbers above 56 before, and nothing in your past\
  \ use of plus determines that 68 + 57 is 125 rather than 5 under the deviant function\
  \ the skeptic calls quus. So: is there a fact of the matter about whether the villagers\
  \ are still performing the same practice, or are they, without knowing it, performing\
  \ a quus-like variant? Does the story stage the regress of interpretation — that\
  \ any interpretation of a rule still hangs in the air — or does it stage something\
  \ else?\n\nThen there is the skeptical solution. Kripke's Wittgenstein does not\
  \ answer the skeptic by finding the fact that fixes meaning; he replaces the question\
  \ of truth conditions with the question of when an assertion is licensed, and the\
  \ answer runs through communal agreement and the dispositions of the community.\
  \ I want you to take that solution seriously and then press it with the story. The\
  \ villagers agree; their dispositions are convergent; they go on in the same way.\
  \ Does that make their practice meaningful? Does it make it correct? Old Man Warner\
  \ is a kind of dispositionalist and a kind of traditionalist at once — the lottery\
  \ is what has always been done — while Tessie Hutchinson, when her household is\
  \ drawn, suddenly becomes a straight-solution theorist: she appeals to the lottery's\
  \ actual rules, its fairness, the fact of what is really being done, and is stoned\
  \ for it. Which of them is closer to the truth about rule-following, and what does\
  \ the story's ending do to our confidence in the answer?\n\nI want the reading to\
  \ be honest in both directions. Do not reduce Jackson to an allegory of Kripke —\
  \ the story is also about scapegoating, conformity, the small talk that surrounds\
  \ a killing, and the way a child is initiated into the practice; and it is not a\
  \ treatise on semantics. Nor should you bend Kripke to fit the story: the skeptical\
