  Position idea: "No-trade theorems tell me that in a market where everyone shares
  priors and it''s common knowledge that everyone''s rational, no one trades unless
  they have non-epistemic reasons. I want to take this seriously as an epistemological
  claim: it means that if I see a big trade in a liquid market, that''s basically
  never evidence that the counterparty knows something I don''t; it''s either liquidity/hedging
  or a difference in priors. And more strongly: ''the market disagrees with me'' isn''t
  evidence against my view, because in the idealized model the market price is just
  the prior. So I should not update much on market moves when I think I have genuine
  private information." Then what would count against? Defeaters: the common prior
  assumption is doing all the work and is empirically false (people have genuinely
  different priors — that''s not a bug); the theorem''s assumptions are knife-edge
  (common knowledge of rationality fails; approximate common knowledge gives approximate
  no-trade, and the approximation can be terrible); real markets have noise traders
  and non-common priors, so trade is informative (e.g., insider trading, adverse selection
  — lemons markets generate trade precisely because of asymmetric info); the Grossman–Stiglitz
  paradox: if prices were fully revealing, no one would trade/gather info, so equilibrium
  prices must be partially revealing, hence informative; also "the market is the market"
  — the price aggregates the info of those who *do* trade; and the no-trade theorem
  assumes the asset is a pure bet on a common-valued state, whereas real trades involve
  heterogeneous valuations (hedging, risk tolerance, time horizons, taxes), which
  is a legitimate source of trade. Also the theorem assumes rational expectations/CE;
  behavioral counterexamples. And the deep point: the theorem shows trade requires
  either differences in priors or differences in endowments/risk attitudes; it doesn''t
  license "ignore the market."


