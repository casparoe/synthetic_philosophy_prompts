  Draft:


  "I''d like a careful conceptual analysis of a specific disagreement between the
  two classical pragmatist accounts of truth — Peirce''s and James''s — but I want
  to approach it through a framework of my own rather than through the usual textbook
  contrast (Peirce the sober realist who defines truth as the limit of inquiry, James
  the relativist who equates truth with whatever it pays to believe). I think that
  contrast is a caricature, and I want to see exactly where the two accounts actually
  diverge once you stop repeating it.


  Here is the framework I''d like you to use. Any definition of truth can be asked
  to do three distinct jobs:

  1. The semantic job: say what the word ''true'' means — what we are attributing
  to a proposition when we call it true.

  2. The criterial job: supply a usable test that sorts true from false beliefs in
  practice.

  3. The normative job: explain why truth has authority — why a belief''s being true
  is a reason to hold it, and why truth is something a belief can miss.

  Peirce and James both talk as though a single pragmatist clarification of truth
  delivers all three at once. I doubt that it can, and I suspect the two of them are
  quietly splitting the jobs between them differently.


  Two further things I want worked through in detail, because they seem to me to be
  where the real action is:


  (a) Peirce''s convergence claim — that truth is what inquiry is destined to arrive
  at, or what the community of inquirers would agree on were inquiry carried indefinitely
  far — looks like it defines truth in terms of belief, which ought to make it impossible
  for the ideal end of inquiry to be wrong, and therefore ought to strip truth of
  the very normative force (the possibility of being missed) that the third job demands.
  Peirce''s own escape route seems to be his insistence that experience contains a
  brute, non-inferential resistance that the mind does not author, together with the
  claim that the object of inquiry is real and independent of what anyone thinks of
  it. I want to know whether that escape route works or whether it just reinstates
  a correspondence theory of truth in the foundations and leaves the pragmatist clarification
  doing no work. In particular: is the convergence claim an empirical prediction,
  a definition, or a regulative hope — and does the answer change whether it can bear
  the normative load?


  (b) James''s account looks like it makes truth something that happens to a belief,
  conferred by the successful leading it does, rather than an inert property it has.
  But James also insists that true beliefs must agree with reality. If agreement is
  not copying — if it is instead a matter of being led successfully through experience
  — I want to know what constrains the leading. Consider a test case: a belief that
  inquiry will eventually abandon, but which, for every inquirer before that point,
  pays for itself in practice — it coordinates action, generates no friction with
  the rest of the believer''s commitments, and is abandoned only because inquiry moves
  on. Under a Jamesian account, is that belief true while it pays and false once it
  stops? Under Peirce''s, was it false all along? And which of the two answers is
  more defensible, given that both of them want truth to be something we can be wrong
  about?


  Please don''t spend any space on who influenced whom, or on the history of the pragmatism
  disputes; I want the concepts, not the lineage.


  Structure the response as follows, with these headings in this order:

  - The two accounts in brief: about 150 words, stating each account as precisely
  as you can without relying on slogans.

  - Where the textbook contrast fails: about 250 words on the points where Peirce
  and James actually agree, and where the usual ''realist vs relativist'' framing
  misdescribes one or both.

  - The three jobs: about 400 words, working out which of the three jobs each account
  can and cannot do, and whether either account can do all three.

  - The convergence problem: about 350 words on (a) above, ending with your own answer
  to whether Peirce''s appeal to the resistance of experience saves the normative
  job or reinstates correspondence.

  - The Jamesian test case: about 350 words on (b) above, giving a verdict on the
  asymmetric-payoff belief and defending it.

  - My verdict: about 150 words, stating which of the two accounts you think is closer
  to being right, and the single strongest reason."


