  Dollar auction: a $1 bill auctioned; highest bidder pays their bid and gets the
  dollar; second-highest also pays their bid and gets nothing. Rational analysis:
  bids go to $1, then the $1 bidder''s alternative is to lose $1 (if someone else
  bids $1.05 and wins... wait). Let''s think: if current high bid is $1.00, and you''re
  second at $0.95, your options: bid $1.05 → if you win, you pay $1.05 for $1 (net
  −$0.05) instead of paying $0.95 for nothing (net −$0.95). So bidding is better by
  $0.90. So escalation is locally rational. The trap: no equilibrium in pure strategies
  except... the subgame-perfect outcome depends; with precommitment you avoid it.
  The "correct" advice is not to enter at all (or to precommit), and once in, the
  locally rational move keeps escalating. So "don''t throw good money after bad" applied
  mid-auction is actually *bad* advice — or rather, it''s the advice that should have
  been followed *before* entering. That''s a great subtlety: the slogan''s ex-ante/ex-post
  ambiguity. And "sunk costs are sunk" is correct as a decision principle but doesn''t
  tell you to quit; it tells you to ignore the $0.95 — and ignoring it, bidding $1.05
  (net −$0.05) beats quitting (net −$0.95). So the person invoking "don''t throw good
  money after bad" to tell you to quit is actually misapplying the principle, because
  the money already spent is gone either way and quitting is worse *going forward*.
  That is a genuinely in-the-weeds and surprising point — excellent for a dataset
  prompt, and it''s the kind of thing a model might get wrong by reciting the sunk
  cost fallacy.


