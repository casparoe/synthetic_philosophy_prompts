  "An unjust law is no law at all" readings:

  1. Trivial/normative: you have no moral obligation to obey it (but it remains valid
  law, and may still be legally binding in the sense that courts will enforce).

  2. Razian/exclusionary: legal validity is not necessarily moral; the slogan denies
  the "no necessary connection" thesis — no, the slogan asserts a connection.

  3. Validity reading (classical natural law / Fuller): the norm fails a necessary
  condition of legal validity, so it''s not law — courts should treat it as a nullity.

  4. Interpretive/radical: judges have a duty to construe statutes so as to avoid
  injustice, and if the injustice is clear, they should not apply it (Fuller''s "inner
  morality of law").

  5. Rhetorical/expressive: it''s not a claim about validity at all but a façon de
  parler meaning "this is so unjust that I refuse to call it law" — a move in practical
  reasoning, not jurisprudence.

  6. Fuller''s procedural reading: a system that violates the inner morality of law
  (generality, promulgation, non-retroactivity, etc.) fails to be law at all — and
  this is different from substantive injustice. Actually this is key: Fuller''s eight
  desiderata are about procedural legality, not substantive justice. So "an unjust
  law is no law" conflates substantive injustice with procedural failure. That''s
  a great subtlety: for Fuller, the slogan should really be "a law made in a way that
  fails the inner morality is no law," which is different from "an unjust (immoral
  content) law is no law."


