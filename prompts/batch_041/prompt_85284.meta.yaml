  Kant''s relevant commitments for voting:

  - The state as the union of a multitude under juridical laws; the original contract
  as an idea of reason; legislation expresses the united will of the people.

  - Active vs passive citizenship: Kant held that only those who are their own masters
  (property-owning males, not women, servants, apprentices) should have the vote —
  i.e., a property/independence qualification. This is in the essay on theory and
  practice (1793). Good, well-attested.

  - Kant''s doctrine of the general will: "the general (united) will of the people"
  is the criterion of right; a law is just if it could have proceeded from the united
  will.

  - Kant''s rigorism: never act on a maxim that can''t be universalized; no consequentialist
  trade-offs; lying is always wrong. But his political philosophy allows "permissive"
  laws of nature and the duty to enter the state, and the sovereign''s right to tax,
  and even the "right to... " and the prohibition of revolution (no right of resistance),
  plus the "freedom of the pen."

  - Kant on "publicity" as the transcendental principle of public right.

  - Kant''s view of the relation between morality and politics: politics must be subordinated
  to right; "the problem of establishing a state is solvable even for a nation of
  devils" — that''s from Perpetual Peace (well-attested). That''s relevant to the
  question whether moral motivation is needed for a well-functioning vote.


