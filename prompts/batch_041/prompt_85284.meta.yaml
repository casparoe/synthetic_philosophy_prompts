  2. Expressive vs instrumental accounts: Kant''s conception of the vote as the expression
  of the united will rather than private preference — so he''d resist both the instrumentalist
  and the "mere expression" accounts; he might say that the expressive theory mistakes
  a juridical act for an aesthetic one, and that instrumentalism mistakes a juridical
  act for a prudential one. Hmm, but Kant''s own justification for the state is instrumental-ish
