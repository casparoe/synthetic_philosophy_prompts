  Key distinctions in the PP literature:

  1. Weak vs. strong precaution. Weak: lack of full certainty is not a justification
  for postponing cost-effective measures to prevent environmental degradation (Rio
  Declaration). Strong: the PP reverses the burden of proof; proponents of an activity
  must prove it''s safe.

  2. The Wingspread statement (1998): "When an activity raises threats of harm to
  human health or the environment, precautionary measures should be taken even if
  some cause and effect relationships are not fully established scientifically."

  3. Sunstein''s critique: the PP is incoherent because it''s "paralyzing" — it forbids
  action that has risks too, and risks are everywhere; also "the PP, as applied, is
  a means of intransigence."

  4. Distinction between precaution and prevention: prevention addresses known risks
  with probabilities; precaution addresses uncertainty (unknown probabilities).

  5. Procedural vs. substantive PP: procedural = requires certain procedures (e.g.,
  shifting burden of proof, considering alternatives); substantive = mandates certain
  outcomes.

  6. PP as a decision rule vs. as a principle of justification vs. as a heuristic/policy
  tool.

  7. The "meta-precaution" problem: applying precaution to the precautionary principle
  itself.

  8. Whether PP applies only to irreversible harms (the irreversibility condition).

