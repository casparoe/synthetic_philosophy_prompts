  **Question (worth 20 points):**


  This course has used the following stipulations throughout. A value is *lexically
  prior* to another when any amount of the first, however small, outweighs any amount
  of the second, however large; lexical priority admits of no finite exchange rate
  between the two. Two values are *comparable* when, for any two amounts, one is better
  than, worse than, or equal to the other; they are *commensurable* when some common
  unit measures both, so that their amounts can be added, subtracted, and traded off
  at a rate. (Comparability does not entail commensurability.)


  Consider the view T-NU, defined by three axioms:

  (A1) Any two pains are comparable with one another and commensurable with one another,
  and any two pleasures are comparable and commensurable with one another.

  (A2) There is a level of pain, the *harm line*, such that any pain at or above the
  harm line is lexically prior to every pleasure, however great.

  (A3) Any pain below the harm line is commensurable with pleasure: some finite amount
  of pleasure outweighs it.


  Answer all of the following:

  (i) Is T-NU a comparabilist view, a commensurabilist view, both, or neither, about
  the relation between pain and pleasure? Justify.

  (ii) Suppose an outcome O1 contains an above-the-line pain p and a very great pleasure
  g; O2 contains p plus a slightly greater pleasure g+. Does T-NU rank O1 and O2?
  If so, how?

  (iii) [something about whether T-NU can be represented by a single real-valued scale
  / whether it''s a form of negative utilitarianism]


