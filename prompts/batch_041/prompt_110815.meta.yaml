  You are grading the final exam for an advanced undergraduate seminar on value theory.
  The exam question and one student''s answer appear below. Please grade the answer.


  Question (20 points):


  Throughout the course we have used the following stipulations. A value X is lexically
  prior to a value Y when any amount of X, however small, outweighs any amount of
  Y, however large; a lexical ranking admits of no finite exchange rate between the
  two values. Two amounts are comparable when one is better than, worse than, or equal
  to the other. They are commensurable when a common unit measures both, so that the
  amounts can be added, subtracted, and traded off at a rate. Comparability does not
  entail commensurability.


  Consider the view T-NU, given by three axioms:


  (A1) Any two pains are comparable and commensurable with each other, and any two
  pleasures are comparable and commensurable with each other.

  (A2) There is a level of pain, the harm line, such that any pain at or above the
  harm line is lexically prior to every pleasure, however great.

  (A3) Any pain below the harm line is commensurable with pleasure, so that some finite
  amount of pleasure outweighs it.


