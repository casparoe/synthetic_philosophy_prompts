  I am a fourth-year PhD student in distributed systems, and I have been sitting in
  on a seminar in comparative ethics because I want my work on coordination and fault
  tolerance to have a broader conceptual vocabulary. The seminar has introduced me
  to Confucian role ethics, and I find myself both drawn to it and unsure whether
  I actually understand it or am just mapping it onto the systems I already know.
  The central claim, as I have it, is that persons are not atomic individuals who
  then acquire roles; they are constituted by their roles and relations, so that the
  self is more like a locus of ongoing obligations than a substrate that bears properties.
  On this view, virtues are not general traits that a person carries around but are
  indexed to particular relations — what it is to be a good parent, a good ruler,
  a good friend, a good sibling — and ritual propriety is less a rulebook than the
  medium through which those relations are enacted, repaired, and renegotiated over
  time. The ideal is not conformity to a code but a kind of harmony among role-bearers,
  and filial piety, for example, is a lifelong project of negotiating one''s relation
  to one''s parents rather than a fixed duty of obedience.


