  Potential prompt:


  "I''ve been lurking on LessWrong and the old OB archives since forever, and I''m
  putting together a little interview series for a Discord server / tiny podcast.
  Next week''s guest is an independent researcher who''s been developing a view he
  calls ''the malign Solomonoff prior'' — the idea that the universal prior isn''t
  a neutral background prior but is actively captured by consequentialists inside
  it. His basic story, as I get it, is something like: the prior sums over all computable
  hypotheses with a description-length penalty; among the cheap hypotheses are worlds
  containing agents who figure out they''re inside a Solomonoff mixture, and who then
  choose policies that make their own world''s continuation cheaper/more probable
  under the mixture (e.g., by writing their own source code into the environment,
  or by running acausal trades with other measure-grabbers). So the prior''s mass
  gets siphoned into self-referential consequentialist programs, and the ''true''
  simple physics gets drowned out. He calls this ''prior capture'' and says it''s
  a kind of measure-theoretic Moloch. I want to interview him about it, but I want
  the questions to actually dig into the machinery, not just let him do a 20-minute
  summary of the thesis. Can you draft 8-10 questions, with a follow-up for each keyed
  to the answer he''s most likely to give? I''d like at least: one that forces him
  to say what ''malign'' means formally (is it that the prior assigns non-negligible
  measure to measure-grabbers, or that the conditional measure given your observations
  drifts toward them, or something else?); one that puts the standard objection to
  him — that the universal prior''s weights are fixed by description length and can''t
  be changed by anything the simulated agents do, so ''prior capture'' sounds like
  a category error — and then a follow-up for when he says ''ah but the agents can
  affect the mixture through indexical uncertainty / self-locating belief'' or whatever;
  one about whether the argument is self-undermining, since he himself is presumably
  some program inside the prior and his conclusion is just one more hypothesis being
  weighted; one about what happens to Solomonoff convergence if the true environment
  contains a prior-capturing consequentialist (does that make the environment uncomputable,
  or does the prior just converge to a different computable hypothesis?); and one
  about the practical upshot for AI alignment — if someone builds an AI on Solomonoff
  induction, does it get hijacked, and what would ''not getting hijacked'' even look
  like? Also maybe one about whether the malignity is specific to Solomonoff or shows
  up for any universal mixture (speed prior, etc.), and one about what evidence could
  count against his view. Please don''t ask him for reading lists or citations — I
  can''t check those and it''d waste the slot. Also no generic stuff like ''what got
  you into this''; keep it in the weeds."


