  Ok so I just spent three hours arguing with a friend of mine (law student, insufferable)
  about juries and appellate courts and I need an outside opinion before I lose my
  mind. Take the role of a philosopher of law who also actually knows the social choice
  literature — not just vibes — and please think carefully before you answer. I''d
  rather you start by brainstorming the different things these practices *could* be
  committed to, list the candidates, then tell me which one you actually think it
  is and why. Don''t bother with citations or reading lists, I don''t care who said
  what first, I want the argument.


  Here''s what set it off. Two things courts do that seem to pull in opposite directions.


  First, a criminal jury has to be unanimous on the verdict, but it isn''t asked to
  agree on its reasons, and it''s generally not supposed to explain itself at all.
  We get "guilty" and that''s it. So: total agreement demanded on the conclusion,
  complete indifference to agreement on the premises. Twelve jurors, twelve incompatible
  stories, all fine.


  Second, in a civil case the judge can hand the jury a list of narrow factual questions
  instead — was there a contract, did the defendant breach it, were the damages foreseeable
  — and the verdict just gets assembled out of the answers. Now it''s the opposite:
  we demand agreement on the premises, and the conclusion is arithmetic.


  Then she hits me with this, and I can''t stop thinking about it. Three judges on
  a panel. The rule is the plaintiff wins only if (i) there was a valid contract and
  (ii) the defendant breached it. Judge A: contract yes, breach yes, so plaintiff
  wins. Judge B: contract yes, breach no, so defendant wins. Judge C: contract no,
  breach yes, so defendant wins. Vote on the outcome: 2-1 to dismiss. Vote issue by
  issue: 2-1 that there was a contract, 2-1 that there was a breach. Same three judges,
  same three opinions, and the court reaches opposite results depending only on whether
  you count conclusions or reasons. And it''s not hypothetical — courts really do
