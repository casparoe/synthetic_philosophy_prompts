  Essay:


  ---

  **Hinges you can doubt**


  Wittgenstein''s late notes (the ones published as On Certainty, which he wrote in
  the last year or so of his life and which came out much later) are mostly about
  Moore''s business of holding up a hand and saying he knows it''s a hand. Wittgenstein''s
  reaction, as I read him, isn''t to say Moore is wrong but that Moore has misdescribed
  what he''s doing... The interesting bit is the claim that some of our certainties
  don''t function as knowledge claims at all: they''re the things that have to stand
  fast for doubt and inquiry to get off the ground at all. He calls them hinges. You
  can''t doubt that you''ve got hands in the middle of a conversation about whether
  you''ve got hands, because the doubt needs something to stand on. And he has that
  lovely image of a riverbed: propositions that are rock solid for one person or generation
  can end up in the flow of debate, and vice versa.


  Lots of people now use this to talk about trust — trust in testimony, in science,
  in institutions. I think that''s a mistake unless we split hinges in two, and I
  want to defend the split.


  First kind: constitutive hinges. Doubting them would break the practice of doubting
  itself. That my memory works at all; that other people have minds; that the world
  didn''t start five minutes ago with my memories in place. If you genuinely doubted
  these, you wouldn''t be doing a worse job of inquiring, you wouldn''t be inquiring
  at all. Wittgenstein''s examples are almost all like this.


  Second kind: sponsored hinges. These are also held without evidence and also function
  as background, but what holds them up is other people and institutions. That the
  tap water is safe. That a paper with a certain letterhead has been peer reviewed.
  That the person answering the phone at the hospital is a nurse. That a photo of
  a protest was taken where it says it was taken. Doubt here is perfectly possible;
  it''s just expensive. If I doubt the water, I can boil it, buy a test kit, or ask
  a chemist, and none of that breaks the practice of doubting — it is the practice
  of doubting.


  The point: the classic argument (doubt presupposes certainty, so these things can''t
  be doubted) only works for the first kind. Applied to the second kind it''s a bait
  and switch, because the "can''t" has changed from a logical can''t into a practical
  can''t, and practical can''ts are exactly the sort of thing we should be suspicious
  of. It''s like telling someone they can''t question the referee because the game
  needs referees. Well, the game needs someone to make decisions; it doesn''t need
  this referee.


