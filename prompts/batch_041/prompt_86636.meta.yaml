  What are the classic features of the Hart–Devlin debate that a competent popularizer
  would get mostly right, with subtle slips?


  Key elements:

  - Context: 1957 Wolfenden Report recommended decriminalizing homosexual acts between
  consenting adults in private; Devlin responded in his 1959 Maccabaean Lecture "The
  Enforcement of Morals" (published 1965 in book form with other essays); Hart responded
  in "Immorality and Treason" (Listener, 1959) and then Law, Liberty, and Morality
  (1963).

  - Devlin''s view: society has a right to enforce its shared morality because a shared
  morality is constitutive of society — a society is a community of ideas, and without
  a common morality it would disintegrate. He analogized moral offenses to treason:
  just as treason threatens the state''s existence, immorality threatens the social
  fabric. He denied the existence of a realm of private morality that is "not the
  law''s business" (contra Wolfenden). But he was not a maximalist: he advocated a
  "moderate" enforcement, requiring a real, shared, deeply felt moral conviction (the
  "reasonable man" / "man in the jury box" standard, "intolerance, indignation, disgust"),
  and limiting enforcement to acts that are "grossly immoral" and done in circumstances
  that threaten the social fabric. He also had a threshold: the law should not intervene
  in matters of private morality where the conduct is not injurious to others, but
  he thought immorality itself can be injurious to society.

  - Hart''s view: Millian liberalism; the harm principle; the law should not enforce
  morality as such. He distinguished "positive morality" (the morality actually accepted
  in a society) from "critical morality" (the morality that can be rationally defended).
  He challenged the "disintegration thesis" empirically: no evidence that shared morality
  is necessary for social cohesion; societies have survived with diverse moralities.
  He also argued that Devlin''s position would license enforcing any widely held moral
  conviction, including ones we now regard as unjust. He allowed that some moral offenses
  might be criminalized on other grounds (paternalism, harm to others, offense to
  others, public nuisance), but not because they are immoral. He also distinguished
  the enforcement of morality by law from the enforcement of morality as such: he
  was concerned about the "moral conservatism" and "moral populism" of Devlin''s approach.
  He also raised the issue of "the enforcement of morals" as a threat to individual
  liberty.

  - A common subtle misrepresentation: saying Devlin held that "any immorality" or
  "whatever the majority finds disgusting" can be criminalized; or that Hart held
  that law and morality are entirely separate (which is legal positivism about the
  concept of law, not Hart''s normative view about enforcement); or that the debate
  was about whether the law should reflect morality at all (Hart thought law inevitably
  reflects some morality); or that Devlin won/lost the debate; or that Hart was a
  "legal positivist" so he thought morality has nothing to do with law — conflating
  the separability thesis with the harm principle. Also: the "disintegration thesis"
  is often attributed to Devlin as though he claimed it as an empirical certainty;
  he actually offered it as a plausible claim, and the burden of proof is on those
  who deny it. Also: Devlin''s "reasonable man" is not a majoritarian test — it''s
  the man in the jury box, not the man in the street; he explicitly distanced himself
  from pure majoritarianism. That''s a classic subtle misrepresentation: "Devlin thought
  whatever the majority disapproves of can be criminalized" — actually he thought
  the law should enforce only the shared morality of the community as felt by the
  reasonable man, and he had a threshold of intolerance, indignation, and disgust,
  and even then only in matters that threaten society.

  - Another subtle point: Hart''s harm principle is not absolute; he allowed legal
  paternalism in some cases and the offense principle. Also Hart distinguished "harm"
  from "offense." Also Hart''s critique of Devlin''s empirical claim: he noted Devlin''s
  argument is a "disintegration thesis" and that it''s a claim about the causal consequences
  of moral diversity; Hart thought the evidence is lacking and the thesis is implausible
  given historical examples.

  - Another: the Wolfenden Report''s own rationale — it distinguished the realm of
  private morality and immorality from the law''s business, but it did not rely purely
  on the harm principle; it also invoked the function of the criminal law to preserve
  public order and decency, protect the weak, and prevent exploitation. So a summary
  that says Wolfenden "invoked Mill''s harm principle" is a simplification.


