  2. "Hart, a legal positivist, replied that law and morality are separate, so the
  law has no business enforcing morality" — conflates Hart''s positivism (the separability
  thesis about the concept of law) with his normative harm-principle argument. Hart''s
  positivism doesn''t entail the harm principle; and Hart did not say law and morality
  are wholly separate — he said there''s no necessary connection, but law inevitably
  reflects morality. Also Hart allowed some enforcement of morality on other grounds
  (paternalism, offense, etc.).

  3. "the only justification for criminalizing conduct is harm to others" — Hart''s
  harm principle is not the only justification he allowed; he allowed paternalism
  and offense in some cases. Also "harm to others" is Mill''s principle, which Hart
  endorsed with qualifications.

