  in Darwin''s Dangerous Idea (1995), and his contrast between good reductionism and
  greedy reductionism: the good reductionist explains apparent design without skyhooks,
  the greedy one tries to explain it without cranes. These charges have become standard
  furniture in disputes about sociobiology, genetic explanations of complex traits,
  deflationary accounts of consciousness, and adaptationist explanations of religion.
