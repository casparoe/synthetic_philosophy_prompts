  I play a parlour game with six friends that runs on a single written rulebook, and
  the rulebook itself is always up for revision. On your turn you may propose one
  change to one rule — add it, delete it, or rewrite it. To start we had written down
  only three rules:


  101. A proposed change is adopted if a simple majority of the players present votes
  for it.

  102. Rule 101 may be changed only by a two-thirds vote.

  103. No adopted change takes effect until the start of the next turn.


  Three things happened over three consecutive turns. On Ana''s turn she proposed
  one change: "Rule 102 is deleted, and this change takes effect immediately, on the
  present turn." Four voted yes, three no. On Ben''s turn he proposed one change:
  "Rule 101 is replaced by: a change is adopted only by the unanimous vote of every
  player, and this change takes effect immediately." Four voted yes, three no. On
  Carla''s turn she proposed one change: "This rule may never be changed by any later
  vote." Four voted yes, three no.


  Then the arguing started, and we could not agree on which of these three changes
  are actually in force. Ana''s defenders say a simple majority carried her change,
  exactly as rule 101 requires. Her critics say that by deleting 102 she did the very
  thing 102 forbids — she altered the protection around rule 101 — and that a change
  cannot take effect immediately when rule 103, still in force at the moment of the
  vote, says nothing takes effect until the next turn. Ben''s change is entangled
  with Ana''s: if her change went through, then rule 101 was in force and his simple
  majority sufficed; if it did not, then 102 was still in force, his change to 101
  needed two-thirds, and four votes out of seven was not enough. Carla''s change seems
  to want to be permanent, which many of us think no vote can make it.


  I want an essay that settles this. State your verdict in your first two sentences
  — which of the three changes, if any, are in force — and then defend it for the
  rest of the piece. Weigh the strongest argument on each side before you decide.
  The hard part is the general principle, not the tally, so make your principle do
  real work: it should explain why the losing side''s argument fails, not merely assert
  a winner. In particular, address the objection that any rule about how rules may
  be changed is just another rule, sitting on the same level as the rules it claims
  to protect, and so can always be undone by the very procedure it constrains — which
  would make entrenchment an illusion and rule 102 empty from the start. If you think
  that objection is right, say so and accept the consequence. Finally, tell me what
  your principle implies for a fourth case we are about to face: someone proposes
  to add a rule saying that whenever the meaning of the rulebook is unclear, the question
  is settled by a simple majority vote of the players.


  Keep the whole essay under 900 words.


