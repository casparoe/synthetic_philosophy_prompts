  E has a lower prior probability in a way standard Bayesianism doesn''t capture,
  because the ''space of theories'' isn''t fixed independently of the data. The likelihood
  ratio is fine; what''s broken is the prior over hypotheses when hypotheses are constructed
  in response to data."


  That''s a real issue (the "problem of old evidence" redux / "the problem of accommodation
  vs prediction", and the "theory-space depends on data" issue — related to "the problem
  of new theories", "unfalsifiability", and to the fact that hypothesis space construction
  is part of the inference). And there''s a known literature on "predictivism" (Hitchcock
  & Sober, Maher, Lange, Barnes). Hmm, predictivism is a real debate; LLMs know it.
  But the position as I framed it — that the real problem is the prior over constructed
  hypotheses, not certainty — is a fresh-ish twist.


  What would count against it? Defeaters: (1) Cases where accommodation is clearly
  fine — e.g., evolution, heliocentrism, plate tectonics, where the theory was constructed
  to fit the data and is nonetheless well supported. So a view that says constructed-to-fit
  theories are problematically unconfirmed needs to handle that; maybe it''s rescued
  by "the theory also predicted other things" but then the view is not doing work.
  (2) The "fine-tuning" of the prior: if you make the prior over constructed hypotheses
  penalize fitting, you need to say what the penalty is, and any specific penalty
  seems arbitrary (this is the "no principled prior" objection). (3) There''s a formal
  result: you can always recapture predictivism within Bayesianism by including the
  *act of theorizing* / the discovery process as part of the data (Jeffrey conditionalization
