  Essay draft (I''ll write it as the asker''s draft, ~450 words):


  "I want to defend a reading of Williams''s integrity objection, and I think the
  one-thought-too-many case is the weakest part of it.


  Take the two cases. In the drowning case, a man can save his wife or save two strangers.
  Williams''s target is the idea that if he saves her, the right thing for him to
  think, or at least to be able to offer, is that this is a case in which saving one''s
  wife is permitted. He says that''s a thought too many — the right thought is just
  that she''s his wife. In the Jim case, Jim is offered the choice of shooting one
  Indian himself, after which the rest go free, or refusing, after which all twenty
  die. Williams says utilitarianism tells Jim to shoot, and that this is an attack
  on Jim''s integrity: it makes his own projects and commitments into just another
  input into a calculation he doesn''t own.


  Here''s my worry. The wife case, taken on its own, is an argument about what occurs
  in the agent''s head, and that argument is cheap to answer. A consequentialist can
  say: fine, don''t have that thought; the theory doesn''t require you to rehearse
  permissions in the moment, it requires you to be the sort of person whose dispositions
  produce the best outcomes, and a person who loves his wife appropriately is exactly
  that sort of person. The theory then lives entirely in the off-stage justification,
  and the occurrent thought never has to happen. So the case, as usually stated, seems
  to me to show at most that a certain kind of clumsy utilitarian is clumsy.


  What I want to say is that the objection doesn''t die there, but it changes shape.
  The point isn''t whether the permission-thought occurs, it''s that it''s available
  — the agent knows that his partiality stands in need of a licence from a standpoint
  that treats his wife as one person among others, and that knowledge doesn''t go
  away just because he doesn''t articulate it. And that''s what the Jim case is really
  about. Jim''s problem isn''t an extra thought; it''s that the theory asks him to
  do something he cannot identify as his own action, and to do it for reasons that
  are his reasons only in the sense that the calculation came out that way. The theory
  gets a result out of him, and calls the result his action.


  So I want to distinguish deliberative integrity — what goes on in the agent''s deliberation
  — from what I''m calling narrative integrity: whether the agent can own his life
  as a course of action that is his. My claim is that Williams''s argument only works
  if it''s read as the second, that the wife case is evidence for the first and therefore
  useless, and that the standard disposition reply defeats the first reading and is
  irrelevant to the second. I also suspect the second reading makes the objection
  generalise past utilitarianism to any view that requires the agent to be answerable
  to a standpoint he doesn''t occupy — which might be a problem for me, or might be
  the real point."


