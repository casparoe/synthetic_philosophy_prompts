  ask what happens at t=1, the description underdetermines it — you can consistently
  say the lamp explodes at t=1, or that the lamp was never on at all, or that it''s
  on, or off. So the activity: the groups must each write a "physics" story that agrees
  with all the data at t<1 but differs at t=1, and then a "referee" must adjudicate
  — and discover the data can''t adjudicate.


