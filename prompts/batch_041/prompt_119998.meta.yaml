  The classic Benacerraf point: the lamp is on at times [0, 1/2), off at [1/2, 3/4),
  on at [3/4, 7/8), ... and there are two "natural" descriptions: (a) the machine
  is a toggler, so the state at t=1 would be the "limit" of alternating states — no
  limit; (b) the machine is "on iff the number of toggles so far is even". Both same.
