  Locke on education: "Some Thoughts Concerning Education" (1693), based on letters
  to Edward Clarke about his son; key ideas: the tutor at home rather than school,
  habit formation and early discipline, learning through play, avoiding rote learning
  and rewards/punishments of the wrong kind (he criticised the "rod"), the "gentleman"
  ideal, virtue before learning, the importance of the child''s natural curiosity,
  the "recreation" idea, the cultivation of reason as it matures, "a sound mind in
  a sound body" (Latin mens sana in corpore sano), hardening children (cold, thin
  shoes, plain food, sleep), the curriculum (Latin, French, arithmetic, geography,
  history, dancing, music, fencing), the idea of "esteem and disgrace" as the great
  motives, the danger of the child''s being "governed by his appetites", the role
  of "father as governor, then friend", and the famous maxim about the goal being
  a virtuous man. Also tensions: Locke the empiricist''s epistemology (no innate ideas)
  and his educational optimism; the class/gender limits; the tension between authority
  and freedom ("he that is not used to submit his will to the reason of others when
  he is young, will scarce hearken to submit to his own reason when he is of age").


