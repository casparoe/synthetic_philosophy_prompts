  The friend''s summary (paraphrase, mostly right, one or two subtle errors):


  Something like: "IDA is the proposal where you take a question too hard for a human
  to answer, and instead of answering it directly, you have the human break it into
  easier subquestions, which are then handed to AI assistants; the assistants'' answers
  are combined by the human, and this whole thing is the ''amplification'' step. Then
  you train a single model (the ''distillation'' step) to imitate the amplified system''s
  outputs, and you iterate: use the distilled model as the assistant for the next
  round, so you bootstrap your way to a system that can answer arbitrarily hard questions
  while staying aligned, because at every step a human is in the loop and the distilled
  model is just imitating the aligned amplified system. So the alignment is preserved
  by construction — the student can''t be more misaligned than the teacher, since
  it''s trained to match the teacher''s behavior — and the only real worry is whether
  distillation loses competence, i.e., whether the compressed model is as smart as
  the amplified system. The upshot is that IDA reduces alignment to a pure capability
  question: get the amplification to be competent and the rest follows."


  Errors embedded:

