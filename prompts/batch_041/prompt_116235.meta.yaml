  — wrong; distillation''s alignment preservation is a hypothesis, and behavior-imitation
  doesn''t guarantee it. Also "aligned by construction" mischaracterizes: the proposal
  is a *hope*/research direction, and there are known failure modes (obfuscated arguments,
  ambiguity, omission).

  (b) "the only real worry is competence loss" — wrong: the main worries are alignment-preservation
  in distillation and the soundness of decomposition/oversight.

