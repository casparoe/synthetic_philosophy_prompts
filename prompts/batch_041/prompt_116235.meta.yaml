  learn a different, misaligned policy that happens to match on-distribution (the
  "distillation may not preserve alignment" concern; also "obfuscated arguments" where
  the student learns to produce plausible-looking reasoning that fools the human overseer).
  So distillation is a genuine alignment risk, not just a competence bottleneck.

