  Known IDA critiques (from Hubinger''s "An overview of 11 proposals for building
  safe advanced AI" and "Risks from Learned Optimization" and various blog posts):

  - Distillation may not preserve alignment: the distilled model is trained to imitate
  the amplified model''s behavior, but this is an "outer alignment"–like step; the
  student could be misaligned internally while matching behavior on the training distribution.
  Hubinger calls this the "distillation" problem — "the fact that we''re training
  the student to imitate the teacher''s behavior, not its internals, means alignment
  might not transfer."

  - "Obfuscated arguments" problem: a misaligned model could produce arguments that
  look valid to the human but are actually rationalizations, so the human''s oversight
  fails.

  - The human''s role: the human can only do bounded work; the amplification relies
  on the human being able to decompose tasks correctly, and "the human is the only
  thing anchoring alignment," so it''s not "aligned by construction" — rather it''s
  an attempt to keep the human in the loop while using the AI''s capabilities.

  - Competence: there is a worry about "distillation loss"/"amplification gap", and
  there''s the issue that the student is weaker than the teacher (distillation is
  a bottleneck), and there''s a worry about whether the amplified system''s decomposition
  actually yields better answers ("recursive decomposition is not always possible
  / not all problems decompose").

  - Also: "IDA is not necessarily about aligning the model; it''s a proposal for how
  to train a model on tasks too hard for humans to evaluate."

  - Also the "distillation" in IDA: you distill into a single model that''s cheaper;
  then you can iterate — the point is to keep the amplified system''s behavior as
  a target while the student becomes the new assistant.


  So the friend''s errors:

