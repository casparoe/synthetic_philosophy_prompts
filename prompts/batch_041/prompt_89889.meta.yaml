  the wrong one. The self-reference in a cell isn''t semantic — DNA doesn''t say anything
  about DNA, it just gets copied by machines that read it — so the Gödel half of the
  analogy is doing less work than people think. What''s actually interesting is the
  code itself: arbitrary, in the sense that nothing in the chemistry dictates that
  these three letters mean this amino acid, but frozen, in the sense that you can''t
  renegotiate it without scrambling every protein at once. Gödel numbering is also
  arbitrary, but it''s free — you can renumber whenever you like, nothing breaks.
