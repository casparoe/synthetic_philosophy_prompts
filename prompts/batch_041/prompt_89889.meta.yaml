  at least the point everyone takes from it, is that there''s an isomorphism between
  the way DNA gets translated into protein and the way a formal system can encode
  statements about itself — which is what makes Gödel''s proof possible and (on his
  telling) makes the self-replicating strand a cousin of the self-referential sentence.
