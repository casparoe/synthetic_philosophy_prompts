  claims — what both sides accept about the structure of the problem, about what a
  successful argument on either side would have to show, and about the stipulations
  above; (2) a table of the remaining disagreements, with each row giving the sub-question
  at issue and then each side''s own statement of its position, written in wording
  that side would sign; (3) for each row, the crux — the sub-question such that settling
  it would move at least one side — together with a case or argument both sides agree
