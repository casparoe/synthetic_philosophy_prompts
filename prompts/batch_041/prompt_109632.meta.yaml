  "I convene a small working group on the ethics of the very long term, and two factions
  have been circling each other for a year. Call them the Fanatics and the Anti-Fanatics.
  The Fanatics hold that the arguments for astronomical expected value are sound —
  that the expected value of the far future dwarfs anything we can do for the present,
  that tiny probabilities of enormous goods can legitimately dominate near-certain
  modest goods, and that refusing to act on such comparisons is a failure of nerve
  rather than a substantive objection. The Anti-Fanatics hold that this is a reductio:
  any decision rule that lets a probability of one in a googol of a sufficiently large
  payoff outweigh a near-certain benefit to people now living has thereby shown itself
  unfit for use, whatever its formal virtues.


  Our group has agreed to write one document jointly rather than two polemics. I want
  you to draft it.


  To keep both sides honest, we''ve adopted three stipulations that neither side may
  wave away by citation. First, the debate is about finitely large values and probabilities
  only; no infinities, no Pascal''s wager. Second, we distinguish two questions that
  are usually run together: the axiological question (is the value of the far future
  really unbounded in the relevant sense, i.e., does no finite present-day good buy
  a comparable amount?) and the decision-theoretic question (given whatever axiology
  we accept, does expected-value maximization with arbitrarily small probabilities
  give the right verdict about what to do?). Third, both sides accept the structural
  point that the standard population-axiological escape routes are constrained: axioms
  that force continuity (roughly, that a sufficiently large finite gain always compensates
  for a sufficiently small chance of a great good) tend to deliver repugnant conclusions
  about large numbers of mediocre lives, while the lexical/priority moves that block
  those conclusions are exactly what license the fanatical comparisons. Nobody gets
  both a bounded value function and a clean escape from the repugnant conclusion.


