  analogy hides the microfoundations — this is exactly the critique (e.g., from methodological
  individualists, or from historians of agency) that the analogy "reifies" structures
  and turns people into flotsam. That''s the key thing the analogy smuggles: it makes
  individuals passive and licenses the conclusion that agency is negligible.

