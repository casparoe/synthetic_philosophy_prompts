  Disanalogies that matter:

  - Foam is made of the same water as the deep sea; events are made of the same stuff
  as structures (individual actions), whereas foam is not the cause of the currents
  but events do partly constitute structures. Actually: in the ocean, the deep currents
  are not caused by the foam; but structures in history are (at least partly) reproduced
