  against one another, the right way to capture the value of an epistemic state? Could
  an account that gives priority to understanding over the accumulation of facts avoid
  the tension? If so, what is lost by adopting such an account?


  Conclude by stating and justifying your own position on whether "better than" is
  transitive, or on how the case should otherwise be resolved.


