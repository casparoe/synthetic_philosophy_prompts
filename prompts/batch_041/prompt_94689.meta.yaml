  Question (instructor-authored):


  "Frankish''s illusionism about phenomenal consciousness holds that phenomenal properties
  do not exist, and that our belief in them is the product of a systematic introspective
  illusion. (i) State as precisely as you can what the illusionist denies and what
  she affirms, and explain how the view differs from eliminativism about consciousness.
  (ii) Consider the following objection — call it the presupposition objection: any
  account of why we believe we have phenomenal experiences must at some point appeal
  to the phenomenal character of those experiences themselves (the way pain hurts,
  the way red looks), and so illusionism presupposes the very thing it denies. Is
  the objection sound? (iii) Does illusionism make the hard problem of consciousness
  disappear, or relocate it? Justify your answer."


  Hmm "Frankish''s illusionism" — naming Frankish is fine and accurate (Keith Frankish).
  Is that a bibliographic dependency? It''s a standard attribution, and the prompt
  doesn''t ask for citations. I could just say "illusionism" without naming. Safer:
  "Illusionism about phenomenal consciousness..." Actually naming Frankish is accurate
  and adds specificity. But if the model doesn''t know Frankish, no harm. I''ll keep
  it lightly: "the view we''ve been calling illusionism (Frankish''s position)". Hmm,
  small models might not know. It''s fine either way. I''ll just say "Illusionism
  about phenomenal consciousness holds that..."


  Answer text:


  "(i) Illusionism denies that phenomenal consciousness exists: there are no qualia,
  no properties of ''what it''s like'' to be in a state. So, like Dennett''s eliminativism,
  it denies that we have inner experiences at all, and for the same reason it denies
  that we have beliefs and desires, since those are no more detectable in the brain
  than qualia are. What the illusionist does affirm is that the illusion is real.
  We genuinely believe that we have phenomenal experiences, and that belief is a fact
  about us that a science of the mind has to explain. So illusionism is not quietism:
  it does not say that consciousness is beyond the reach of science, only that what
  needs explaining is why we think there is anything there to explain.


  (ii) The presupposition objection is sound and I think fatal. If you want to explain
  why someone believes she is in pain, you have to appeal to the fact that she is
  in pain: it is the hurt that causes the belief. An illusionist who tries to explain
