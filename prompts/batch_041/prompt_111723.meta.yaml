  a theory about a conspiracy, and calling it a ''conspiracy theory'' is a way of
  dismissing it without engaging — lots of real conspiracies have happened, so the
  label can''t be doing the work by itself. The other says there''s something genuinely
  distinctive and bad about the *reasoning*, something about the way the theory explains
  every leftover oddity, absorbs every disconfirmation, and treats the absence of
  evidence as further evidence.


