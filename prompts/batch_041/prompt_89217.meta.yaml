  Harsanyi''s aggregation theorem (1955, 1977 "Rational Behavior and Bargaining Equilibrium..."
  and 1978 "Bayesian Decision Theory and Utilitarian Ethics"): Given individuals whose
  preferences satisfy the axioms of expected utility (vNM), and a social preference
  relation satisfying expected-utility axioms plus the "acceptance" (Pareto) principle
  — that if every individual weakly prefers x to y and some strictly prefer, then
  society strictly prefers x to y — then the social welfare function is a weighted
  sum of individual utilities (a linear aggregation, "utilitarian" in the weighted
  sense). Key assumptions: individuals'' preferences are on lotteries over social
  states; the Pareto/acceptance condition; the assumption of "individualism" (each
  person''s preference over lotteries is a function only of their own outcomes) and
  comparability/unit comparability of utilities (utilities are unique up to positive
  affine transformation with a common scale? Actually Harsanyi''s theorem requires
  utilities to be comparable up to a common scale — cardinal unit comparability).


  Common misreadings:

  1. That the theorem proves that classical (equal-weight) utilitarianism is rationally
  required. It gives weighted sum with weights that can be any positive numbers (weights
  reflecting bargaining/relative units); equal weights need extra justification.

  2. That the theorem assumes the veil of ignorance / original position as an ethical
  premise. Harsanyi''s impartial observer argument is related but distinct; the aggregation
  theorem is an axiomatic result. Also Rawls''s critique: Harsanyi''s impartial observer
  assumes individuals'' vNM preferences define their good and that risk-aversion vs.
  equality concerns are conflated.

  3. That the "acceptance" axiom is a Pareto principle — it is, and it''s the crucial
  controversial one. Also often people conflate the Pareto principle with "the social
  preference must be a linear average."

  4. That it applies to actual (possibly ill-informed or other-regarding) preferences
