  Popper''s original definition: T2 has greater verisimilitude than T1 if (a) the
  truth content of T2 exceeds that of T1 (i.e., T2''s true consequences contain T1''s,
  roughly), and (b) the falsity content of T2 does not exceed that of T1. Tichý and
  Miller showed this can''t work: if T2''s truth content is greater, its falsity content
  must also be greater (for false T1, T2...). Specifically, Tichý (1974) and Miller
  (1974) independently proved: if T2''s truth content properly includes T1''s, then
  T2''s falsity content properly includes T1''s; hence no false theory can have greater
  verisimilitude than another by this definition (only true theories can). Actually
  the result: for any two false theories, if one has more truth content, it has more
  falsity content too; so comparative verisimilitude among false theories is impossible
  under Popper''s definition.


