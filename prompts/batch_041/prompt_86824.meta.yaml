  the standard lesson drawn from the chord paradox is that indifference is not well-defined
  because different parameterizations yield different distributions. But I suspect
  that diagnosis is too quick. What we call ''indifference'' may be doing two different
  jobs: indifference over the outcomes of an experiment, and indifference over the
  symmetries of the problem''s description. Bertrand''s paradox, on this view, is
  not a counterexample to indifference as such but a symptom of conflating a symmetry
  of the description with a symmetry of the answer. I want the proposal to make that
  distinction precise enough to be testable: can we state a criterion that tells us
  when a problem''s symmetries are sufficient to determine a unique credence, and
  when they are not? The proposal should state the central question so that it has
  a determinate answer, explain why the usual positions—objective chance, subjective
  credence, maximum entropy, imprecise probabilities—do not already settle it, and
  lay out a method. I imagine the method as a mix of conceptual analysis and small
  formal case studies: take a family of Bertrand-style problems, vary the parameterization
  and the group of transformations under which the problem is invariant, and see whether
  the proposed criterion tracks our pre-theoretic verdicts about which problems are
  well-posed. I''d also like a section on what would count as failure: if the distinction
  collapses under every formalization, or if the criterion only works by gerrymandering
