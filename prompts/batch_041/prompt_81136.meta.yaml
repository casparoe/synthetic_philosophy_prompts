  I am the senior program officer at a regional coastal restoration fund. The fund''s
  board makes two kinds of grants: rapid-response grants after a discrete disturbance
  — a spill, a breach, a bad storm season, a disease outbreak in a shellfish bed —
  and long-horizon grants for land acquisition, hydrology, sediment management, and
  managed retreat. Every proposal we receive carries an implicit claim about the time-scale
  on which the problem lives, and we have no way to adjudicate those claims. In practice
  the most recent disturbance sets the agenda, and the long-horizon applications get
  read as requests to do nothing.


  I want you to write us a decision procedure grounded in Fernand Braudel''s stratification
  of historical time. Braudel distinguished three registers: the event, the short
  episodic occurrence that he thought of as surface disturbance; the conjuncture,
  the cycle running over a decade or a generation — fishing effort, land prices, population,
  settlement, commodity markets; and the longue durée, the structures that persist
  across centuries and that shape what is possible at all — coastlines, soils, prevailing
  wind and current, property regimes, and the habits of mind that outlive the people
  who formed them. His claim was not just that some things change slowly. It was that
  the explanatory weight of a phenomenon depends on which register it belongs to,
  that the short register systematically misleads the observer, and that structures
  are at once enabling and constraining — the same durable arrangement that makes
  a way of life possible also forecloses alternatives.


  Constraints on the procedure. It must be runnable by program staff who have no historical
  training, in about an hour, using only the material already in a proposal file.
  It must not require anyone to consult outside scholarship, and I do not want a reading
  list; I want the procedure. Assume the evidence available is of the ordinary kinds:
  instrumental monitoring series, landing and catch records, cadastral and survey
  maps, aerial and satellite imagery, sediment cores, archaeological material, and
  the testimony of people who have lived in the place for decades.


  The procedure must deliver, for any proposal: (1) a temporal signature, assigning
  the problem, the proposed intervention, and the expected effect each to a register,
  with the evidence that supports each assignment and the evidence that would overturn
  it; (2) explicit rules for the mismatches, both the event-scale intervention justified
  by a structure-scale claim and the structure-scale intervention offered to fix an
  event; (3) a test that distinguishes a slow trend from a structure — persistence
  alone is not enough, so say what else has to be shown; (4) a safeguard against the
  abuse I am most worried about, in which a recent and real harm is dismissed as a
  mere event, or as a mere fluctuation, and the file is closed; and (5) a short list
  of the points where the procedure cannot decide and must be escalated to the board,
  with the exact question to put to them.


  One complication to build around. Our charter forbids funding an intervention whose
  expected effects are shorter-lived than the disturbance it addresses. That clause
  was written to stop us from patching symptoms, but it gives every applicant an incentive
  to describe their problem in the longest available register. The procedure has to
  be usable by people with that incentive pushing against it.


