  argued on the grounds that the storm is the visible edge of a long-term shift; and
  (c) a proposal to take no action on a collapsing fishery because the collapse is
  said to be part of a natural cycle.


  Finish by telling me which of the three verdicts I will dislike, and what the procedure
  cannot do.


