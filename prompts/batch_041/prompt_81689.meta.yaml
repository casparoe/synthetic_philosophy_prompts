  The book follows a mid-level civil servant, a man of no particular convictions,
  through the years in which the Republic is dismantled around him. The difficulty
  is a craft problem that has become, to my surprise, a philosophical one. Every scene
  I write forces a choice about where to locate the causes of what happens: in my
  character''s decisions, or in the conditions that make those decisions almost weightless.
  Readers of the draft have disagreed about which choice the book makes, and I have
  come to think they are disagreeing about something more interesting than my manuscript.


  The question I want the proposal to be about is the one historians and philosophers
  argue about under the heading of the Great Man and his critics: would there have
  been a Nazi Germany without Hitler? My suspicion — and this is the half-formed part
  — is that the disagreement is not one disagreement but several, and that it is produced
  by two choices that are usually left unexamined. The first is the contrast: the
  question, as it stands, does not say what Nazi Germany is being contrasted with.
  A regime of the authoritarian right without the racial programme, a military dictatorship,
  a Communist Germany, a Germany that simply muddles on — these are different questions,
  and the evidence bears differently on each. The second is the counterfactual''s
  tolerance for adjustment. When we remove Hitler from the antecedent, may the world
  rearrange itself so that some equivalent figure is thrown up by the same pressures,
  or must everything else be held as close as possible to how it actually was? The
  two settings give opposite answers, and neither is obviously the right one.


  There is a further difficulty I would like the proposal to confront rather than
  avoid. If the historical process is deterministic, then removing Hitler removes
  everything downstream of him and the counterfactual is either trivially false or
  beyond our reach; if it is genuinely chancy, almost any outcome is compatible with
  his absence and the counterfactual is trivially true. Either way the question seems
  to dissolve. I want to know whether it can be repaired instead of dissolved — and,
  if it can, whether the repair tells us anything about how a novelist should distribute
  agency in a story about a period like this one.


