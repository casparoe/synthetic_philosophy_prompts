  Defeaters:

  1. Marginal cases: infants, the severely cognitively disabled, people in persistent
  vegetative states, people with dementia. If the criterion is the capacity to have
  a conception of one''s life, then these humans lack rights too — either we extend
  rights to them anyway (so the criterion is wrong) or we accept the implication (which
  many find a reductio). And there''s the "potentiality" or "kind-membership" retreat,
  which looks like speciesism dressed up.

  2. If the criterion is "capacity for self-respect" or "having a life to shape,"
  some animals (apes, corvids, cetaceans, elephants, cephalopods) seem to have enough
  of it — the boundary is empirical and blurry, and might move. Also the criterion
  seems to be graded, but rights are supposed to be all-or-nothing.

  3. Internal incoherence of the two-tier view: if animal suffering is aggregated
  in a utilitarian calculus, numbers can outweigh human interests in ways that conflict
  with the Kantianism the view reserves for people. E.g., 10,000 rats'' suffering
