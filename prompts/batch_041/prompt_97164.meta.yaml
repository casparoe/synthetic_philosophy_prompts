  I''m in my second year and I''m taking a module on early modern philosophy of education
  (it''s mostly Locke and Rousseau), and I also do paid tutoring on Saturdays at a
  small tuition centre — kids aged about 7 to 12, one-to-one, 45 min slots, parents
  hovering in the corridor. The module has got me thinking that Locke''s advice in
  Some Thoughts Concerning Education is weirdly practical compared to most of what
  we read, but it''s written for a completely different setup: a gentleman''s son,
  a tutor living in the house with almost total authority, no parents undermining
  him, no exams, no safeguarding paperwork. My boss wants me to write something for
  the other tutors — a one-page decision procedure we can actually run in the five
  minutes before a session when a parent corners us with a problem. I don''t want
  a summary of Locke, I want the thing turned into a procedure: the questions to ask
  in order, what counts as a good enough answer to each, where it stops with a straight
  no, and where it has to be handed to a human because it''s a values question and
  not a pedagogical one.


  The spine I want it built on is this (tell me if it''s a fair reading): Locke''s
  whole point is that you''re trying to end up with an adult who governs himself by
  his own reason, so every method has to be judged by whether it recruits the child''s
  own judgment or just bypasses it — and that''s why he''d rather use praise and blame
  and the child''s desire for esteem than the rod, why he wants few rules but the
  ones there enforced, why he says to watch the child''s temper and aptitudes instead
  of forcing against the grain, why he wants learning made into a pleasure instead
  of a task, and why he says you should reason with a child rather than just command.
  It should also be honest about the bits that don''t survive translation: he assumes
  the tutor has authority the parents never countermand, he assumes a boy, he''s writing
  for one class, and he has no notion of the things we now have to worry about. And
  I need the procedure to be usable by someone who hasn''t read a word of Locke, so
  the theory has to survive the simplification without turning into generic nice-teacher
  advice.


  Then run it on three cases we actually get: a 9-year-old who won''t practise the
  violin, where the parent''s instruction is basically "make him do it"; a child who
  lies to us about having done the homework; and a boy of about 10 who''s scared of
  the dark and whose dad wants us to "toughen him up" — I suspect the procedure is
  going to tell me something the parents won''t like there, which is fine, but say
  so explicitly. Also say what the procedure can''t do and where it will misfire.
