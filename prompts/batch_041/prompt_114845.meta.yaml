  meaning ain''t in the head.


  Now the argument:

  (1) What a speaker''s word refers to is determined by the speaker''s environment
  (the externalist thesis, taken as established by Twin Earth).

  (2) No two speakers occupy numerically the same environment: each of us has a distinct
  spatiotemporal location and a distinct causal history, so the stuff each of us has
  interacted with, and the totality of facts around each of us, differs in at least
  some respect.

  (3) If two speakers'' environments differ in any respect, then (by (1)) what their
  words refer to may differ.

  (4) So there''s no guarantee — indeed it seems false — that any two speakers'' word
  "water" refers to the same thing.

  (5) If two speakers'' words don''t refer to the same thing, they don''t mean the
  same thing (or at least don''t express the same proposition).

  (6) So no two speakers ever mean the same thing by "water" (and mutatis mutandis
  for other words).

  (7) So communication — the sharing of thoughts — never happens; each of us is semantically
  alone.

  (8) But that''s absurd, and it can''t be what externalism says, because externalism
  was supposed to explain how meaning is public and shared (Putnam''s whole point:
  "meanings just ain''t in the head" so that we can share meanings even with different
  internal states).


