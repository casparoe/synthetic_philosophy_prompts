  one at a time, as faithfully as you can:

  - the basic naturalistic move: that a state''s content is fixed by its function
  rather than by its intrinsic character;

  - indicator/covariance semantics: content as what a state reliably carries information
  about, plus the extra ingredient that turns mere indication into representation;

  - producer-consumer biosemantics: proper functions, the idea that a representation''s
  content is set by what its consumers are supposed to do with it, and that this fixes
  content at some level of determinacy;

  - the normativity of content: what makes it possible for a state to be about something
  and get it wrong, not merely to fire when it shouldn''t;

  - the proximal/distal problem: a detector that responds to a proximal stimulus but
  seems to be about a distal cause, and the question of which one its content is;

  - the swampman-style case: something with all the same structure and dispositions
  but no history.


