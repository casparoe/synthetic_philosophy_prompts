  Core philosophical issues in costly signalling:

  1. Zahavi''s handicap principle: signals must be costly to be honest; the cost must
  be differentially borne (low-quality signallers pay more).

  2. Grafen''s formalisation (1989-ish): ESS models showing handicap can be evolutionarily
  stable. Actually Grafen 1990 "Biological signals as handicaps" J Theor Biol.

  3. The index/signal distinction (Maynard Smith & Harper): indices are causal correlates
  that can''t be faked; signals need not be costly if they''re indices. This challenges
  "all honest signals must be costly".

  4. The "handicap principle is a tautology" worry — e.g., the criticism that if any
  honest signalling requires differential cost, then it''s trivial.

  5. Amplifiers (Hasson 1989, and later "amplifiers" in Maynard Smith & Harper''s
  book): structures that make it easier to assess quality, e.g., a "standard" against
  which quality is measured.

  6. Cheap-talk and the fact that costly signalling theory is used in human behaviour
  (Veblen, religion as costly signalling, Bliege Bird & Smith).


