  Good set of errors:


  1. "We can never know what an action''s consequences will be" — overstated; ordinary
  uncertainty vs. cluelessness. Also the conflation of "not know" with "cannot assign
  probabilities."

  2. "there is no way to assign probabilities" — this is the actual core of the objection,
  so mostly accurate, though it''s often stated as a problem about the space of consequences
  not being enumerable rather than about probabilities per se. Fine.

  3. "cannot tell anyone what to do... a theory that cannot guide action is... false"
  — conflates the decision-procedure question with the truth of the criterion; even
  granting cluelessness, act-consequentialism could be true but hard to apply; and
  there''s a separate issue of whether the objection targets the theory''s truth or
  its usefulness.

  4. "this is why thoughtful consequentialists have abandoned the attempt to calculate
  outcomes and now defend rules of thumb" — non sequitur and historically/conceptually
  wrong: rule consequentialism is not a fallback from cluelessness; rules of thumb
  can be justified by ordinary predictable consequences; also many consequentialists
  continue to do expected-value reasoning (e.g., longtermism) rather than retreating
  to rules.

  5. "in practice indistinguishable from ordinary common-sense morality" — the convergence
  claim is contested; rule consequentialism''s rules would be justified by their consequences
  and could diverge.

  6. "the difficulty is peculiar to consequentialism" — false: any view on which what
  one ought to do depends on how things turn out (including common-sense morality,
  which forbids harming people and cares about results; also rule consequentialism)
  faces cluelessness; the objection generalizes. Also the "washing out" response:
  if effects are chaotic, they may wash out symmetrically, so cluelessness may not
  doom expected-value reasoning.


