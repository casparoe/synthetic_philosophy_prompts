  The essay''s central paragraph says roughly this. Consequentialism holds that an
  action is right just when it produces the best overall consequences. But we can
  never know what an action''s consequences will be: a choice that looks charitable
  may, through an unending chain of small effects, end up causing a famine centuries
  later, and there is no way to assign probabilities to these far-off results. Call
  this cluelessness. Since a consequentialist cannot know which act produces the best
  consequences, the theory cannot tell anyone what to do; and a theory that cannot
  guide action is not merely useless but false. This is why thoughtful consequentialists
  have abandoned the attempt to calculate outcomes and now defend rules of thumb instead
  — which is simply rule consequentialism, and in practice indistinguishable from
  ordinary common-sense morality. It is worth noting that the difficulty is peculiar
  to consequentialism: since other ethical theories do not make rightness depend on
  an act''s actual results, they are untouched by it.


