  how Galileo refuted Aristotle''s claim that heavier bodies fall faster without dropping
  anything from the Tower of Pisa, and how Einstein discovered relativity while riding
  a tram past Bern''s clock tower. Thought experiments are therefore a way of learning
  about the world that bypasses observation entirely, which is why philosophers of
  science treat them as a puzzle for the view that all scientific knowledge comes
  from experience. Maxwell''s demon and Schrödinger''s cat are further examples of
  thought experiments that revealed new features of the physical world.''"


  Errors: (1) "same evidential weight as lab results" — no; a thought experiment''s
  conclusion is only as good as its premises; it typically yields a conclusion about
  what follows from a theory or a conceptual impossibility, not a new empirical fact.
  (2) Galileo: the Tower of Pisa story is legendary/apocryphal; Galileo''s argument
  was about the logical inconsistency of the Aristotelian doctrine (a heavier and
  lighter body tied together), plus inclined-plane experiments. Also his conclusion
  was about vacuum/idealized conditions. (3) Einstein: the tram/clock thought experiment
  story is popularized; his 1905 paper''s argument is about the constancy of light
  speed and the relativity of simultaneity, and thought experiments in his work often
  serve to expose contradictions in existing assumptions rather than discover new
  facts directly. (4) "bypasses observation entirely" — no: thought experiments rely
  on background empirical knowledge; many are "destructive," showing a theory inconsistent
  with itself or with accepted principles. (5) Maxwell''s demon and Schrödinger''s
  cat: these were not discoveries of new features of the world; Maxwell''s demon was
  a challenge to the second law (later resolved by information-theoretic considerations),
  Schrödinger''s cat was a criticism of the Copenhagen interpretation''s application
  to macroscopic objects — it doesn''t show cats are both alive and dead; also Einstein-Podolsky-Rosen.
  Also the distinction between thought experiments that are (a) arguments/reductios,
  (b) appeals to intuition pumps, (c) idealized limiting cases of theory.


