  \ itself so it's self-contained.\n\nGood approach: Give the prompt a self-contained\
  \ mini-framework, e.g., a fictional textbook's \"dual-aspect\" proposal, or a case\
  \ study about a novel engineered organism. The student's answer should be mixed:\
  \ right about visible things, subtle mistakes.\n\nLet me think about a concrete\
