  Let me think about what produces the best satire with philosophical precision. The
  core philosophical content: the ethical as the universal (the articulable, the public,
  the general); Abraham as the single individual whose act cannot be mediated into
  the universal; hence his silence — he cannot speak, because any speech would be
  in the universal''s language; hence the tragic hero contrast (Agamemnon can speak
  and be understood and wept for; Abraham cannot); hence the demonic double (the same
  structure could describe a murderer or a deluded man; from outside, nothing distinguishes
  them); hence "faith is a paradox" — Abraham cannot make himself understood, and
  the "distress" of the ethical. The committee''s procedures necessarily demand exactly
  what Abraham cannot provide: reasons that others can assess. So the comedy writes
  itself: the committee asks for "the evidentiary basis for the voice," "a written
  statement in the subject''s own words," "the identity of the second witness" — and
  the subject''s non-answers are read as obstruction. And the theological consultant''s
  memo says: the committee is right that within its own terms this is attempted murder;
  the committee is also unable to state what would count as the difference between
  the father of faith and the demonic. That memo is where the precision lives.


