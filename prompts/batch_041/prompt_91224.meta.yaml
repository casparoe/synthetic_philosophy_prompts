  Also avoid super-niche theories LLMs won''t have memorized. So the prompt should
  supply the niche content itself.


  Good idea: a satirical piece in the form of an in-universe document from the field
  of AI interpretability, satirizing the practice of "eliciting latent knowledge"
  — e.g., a corporate FAQ / terms of service for an "ELK-based oracle" service, or
  a job advertisement for an "honesty officer". The niche injection: a fictional framework
  with specific commitments, e.g., the distinction between "behavioral honesty" and
  "latent knowledge", the "human simulator" vs "predictor" distinction, the idea that
  a model trained to answer questions may know X but report Y, the "ontology mismatch"
  problem, etc. These are real concepts from the ELK report (ARC''s "Eliciting Latent
  Knowledge" by Paul Christiano, Mark Xu, Ajeya Cotra). Careful: attributions. I can
  avoid naming it, or name it generically. Better to write the prompt so it doesn''t
  depend on the report''s exact content — describe the concepts in the prompt itself,
  so a model without web access can work from the prompt.


