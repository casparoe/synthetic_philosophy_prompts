  an input. Second, the score must be calibrated: a 7 must mean the same thing for
  a Black defendant and a white defendant — the same actual probability of reoffending.
  Third, the county audits the tool each year by comparing error rates across racial
  groups, and it treats it as a failure if the tool falsely flags one group more often
  than another (or falsely clears one group more often). The policy treats all three
  as requirements that a good tool satisfies simultaneously.


  Then someone points out that these cannot all hold at once. If the two groups actually
  reoffend at different rates, then a tool that is calibrated in both groups and also
  has equal false-positive and false-negative rates in both groups is impossible —
  you can get at most two of the three, and which two you pick changes who bears the
  cost. The county''s response was to keep all three in the policy document and to
  keep auditing for all three, without saying which one wins when they conflict.


