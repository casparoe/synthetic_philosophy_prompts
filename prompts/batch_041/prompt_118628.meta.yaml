  Potential prompt:


  I am a PhD student in philosophy writing a seminar paper on decision theory under
  conditions of evidential correlation, and I have been stuck on a conceptual issue
  that I would like you to help me formulate. Please adopt the role of a philosopher
  of decision theory with expertise in causal decision theory, evidential decision
  theory, and the family of updateless or functional decision theories, and think
  carefully before answering. I want you to begin by brainstorming three or four candidate
  cases, then choose the one that best illustrates the issue, and finally present
  it in detail. The issue is this: in cases like counterfactual mugging and XOR blackmail,
  an agent''s choice is evidentially correlated with a payoff-relevant fact that the
  choice does not causally influence, and this correlation creates a conflict between
  causal and evidential reasoning. I am interested in a variant where the correlation
  is generated not by a predictor''s advance knowledge or by a blackmailer''s conditional
  threat, but by the logical structure of the payoff matrix itself—so that the agent''s
  choice is evidence about what the payoff-relevant fact must be, even though the
  fact is settled independently of the choice. Please give me an example of such a
  conceptual issue: a concrete decision scenario, described in enough detail that
  a reader could work through the expected utilities, in which an agent who reasons
  causally and an agent who reasons evidentially are rationally required to choose
  differently, and in which the disagreement cannot be dissolved by pointing to a
  common cause or to a failure of conditionalization. Then explain what the conceptual
  issue is, why it matters for the debate over whether rational choice is a matter
  of maximizing causal expected utility or evidential expected utility, and whether
  the agent should treat her own choice as a premise in deliberation. I would also
  like you to say what the example shows that the standard counterfactual mugging
  and XOR blackmail cases do not, and to flag any assumptions that make the example
  controversial.


