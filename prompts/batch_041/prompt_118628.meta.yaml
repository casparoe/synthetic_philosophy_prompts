  fact that the choice does not causally influence, so that causal and evidential
  reasoning pull apart. I am especially interested in a variant where the correlation
  is generated not by a predictor''s advance knowledge or by a blackmailer''s conditional
  threat, but by the logical structure of the agent''s own deliberation. Suppose the
