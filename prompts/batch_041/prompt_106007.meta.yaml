  exclusion); Norway''s boardroom gender quota for listed companies.

  - Ask: the requirement list — cases it must get right, distinctions it can''t collapse,
  results it must be consistent with, each with the case behind it.

  - Distinctions it can''t collapse: (i) using a group characteristic as one factor
  vs. as a decisive threshold; (ii) backward-looking remedy vs. forward-looking justification;
  (iii) group disadvantage vs. individual disadvantage (creamy layer); (iv) a group
  that is a minority and subordinated vs. one that is a majority or not subordinated
  (women in Norway, or a caste group that is a majority in a state); (v) selection
  procedures vs. the distribution of the good being allocated; (vi) whether the policy
  imposes a cost on identifiable individuals vs. diffuses it.

  - Flag jointly unsatisfiable pairs: e.g., a requirement that the policy remedy the
  disadvantage of those actually disadvantaged (individualised tracking) vs. the requirement
  that it be administrable without intrusive inquiry into ancestry/means; or the requirement
  that it not use a characteristic whose use would entrench the very stigma it aims
  to remove vs. the requirement that it be visible enough to change outcomes.

  - Then: which requirement does the most work in ruling out candidates? And: which
  desiderata are local to a particular legal culture (constitutional doctrine, e.g.,
  the US strict scrutiny framework) and which are requirements of political morality?

