  Structure of the prompt:

  - Frame: I''m writing a comparative piece on when group-conscious selection policies
  are justified; I want the desiderata first.

  - The settings: US university admissions after the Supreme Court''s 2023 decision;
  India''s reservation system (constitutionally mandated quotas for Scheduled Castes
