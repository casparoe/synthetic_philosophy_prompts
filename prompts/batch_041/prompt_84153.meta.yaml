  Summary (fictional blog post):

  "A recent blog post summarises the debate over process-based versus outcome-based
  supervision in AI like this: Outcome-based supervision trains a model by rewarding
  only the final answer; because the model can find shortcuts that get the right answer
  for the wrong reasons, it inevitably reward-hacks, and the approach is therefore
  doomed for any task more complex than arithmetic. Process-based supervision, by
  contrast, rewards each step of the reasoning trace, so it removes the incentive
  to game the final answer and gives a dense, reliable signal. The only real cost
  is annotation, which is why the field has settled on process supervision as the
  correct approach. The post concludes that outcome-based supervision is only useful
  as a baseline, and that scalable oversight is essentially a solved problem once
  we have enough step-level labels."


  This summary has subtle errors:

  - "inevitably reward-hacks" overstates; outcome supervision can work with enough
  data/regularisation, and reward hacking is not inevitable.

  - "doomed for any task more complex than arithmetic" is too strong; outcome supervision
  works for many tasks, e.g., games, code, etc.

  - "removes the incentive to game the final answer" — process supervision can still
  be gamed via the process reward model, which is itself learned and can be fooled;
  it doesn''t remove incentives, it shifts them.

  - "gives a dense, reliable signal" — dense yes, reliable not necessarily; process
  labels can be noisy, ambiguous, or gameable.

  - "the only real cost is annotation" — ignores compute, the difficulty of defining
  a step, the risk of overfitting to the PRM, the fact that process supervision may
  not scale to domains without clear step structure.

  - "the field has settled on process supervision as the correct approach" — false;
  it''s an active area, and outcome supervision is still widely used; there are hybrids.

  - "scalable oversight is essentially a solved problem once we have enough step-level
  labels" — false; scalable oversight is about supervising models on tasks where humans
  can''t judge, and process labels may be as hard to get as outcome labels; also the
  "verifier gap".

  - Conflates process supervision with process reward models.

  - Assumes step-level correctness is well-defined and cheap.

  - Ignores the distinction between training-time supervision and deployment-time
  oversight.

  - Ignores that outcome supervision can be combined with process-based shaping or
  reward models.


