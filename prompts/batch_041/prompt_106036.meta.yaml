  Potential prompt:


  I am trying to get clear on the material constitution debate, but the standard textbook
  presentations leave me with a puzzle that I suspect is the real crux. Suppose a
  sculptor takes a lump of clay and shapes it into a statue. Call the lump L and the
  statue S. Many philosophers say L and S are not identical: L existed before S was
  made, and L would survive being squashed back into a ball while S would not. Yet
  L and S seem to occupy exactly the same place at the same time, and they seem to
  share all their actual physical properties: same mass, same shape, same color, same
  causal powers. I understand the bare claim that they are numerically distinct but
  coincident. What I do not understand is how to avoid the following consequence:
  if L and S are distinct, then there are two objects on the pedestal, and if they
  share all their actual properties, then any explanation of the statue''s behavior
  in terms of S seems equally available in terms of L. So what work is the statue
  doing that the lump is not already doing? Please explain, as carefully as you can,
  how the grounding problem for coincident objects is supposed to arise from this
  setup. In doing so, distinguish at least three responses: the constitution view
  that treats S as constituted by L and distinguishes derivative from non-derivative
  properties; a hylomorphic view that treats S as a form-matter compound rather than
  a second lump; and a deflationary or eliminativist view that denies there are two
  objects in the first place. For each, say what it costs and what it preserves. I
  am especially interested in whether the modal differences between L and S can be
  explained without treating de re modal properties as primitive, and whether a counterpart-theoretic
  or anti-essentialist treatment of those properties would dissolve the puzzle or
  merely relocate it. I do not need citations or a reading list; I want a clear conceptual
  map.


