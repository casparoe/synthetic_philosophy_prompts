  Draft:


  "I run a long-running reading group for people who came to philosophy through rationalist
  blogs, and we''ve spent three sessions on Molyneux''s problem — the case Locke reports
  from Molyneux, of a man born blind who has learned to tell a cube from a globe by
  touch and then gains sight, and is asked whether he could tell which is which by
  sight alone before touching them. We keep discovering that everyone in the room
  ''agrees'' with everyone else because they''re answering different questions, so
  I want a diagnostic instrument rather than another discussion: a decision tree that
  starts from the one commitment we all share — that a congenitally blind adult who
  gains sight as an adult is at least a possible case, worth reasoning about — and
  ends in a named position on what such a person could do at first sight.


  Build the tree from the logical space, not from a list of famous names. My proposal,
  which you should feel free to improve on: decompose ''could he tell?'' into three
  stages — (1) parsing, whether the newly sighted subject can see a cube as a bounded,
  solid, spatially extended thing at all; (2) transfer, whether information available
  in touch can be matched to information available in sight, and by what means (a
  single code available to both senses, a learned translation between two codes, or
  nothing); and (3) report, whether a subject who has done the matching could name,
  point, or otherwise indicate it. The most useful thing the tree can do for us is
  tell us where a person''s answer to the historical question actually comes from
  — whether their ''no'' is a claim about parsing, about transfer, or about report
  — so each branch node should be a question about one of those stages, phrased as
  a case or a claim that a reader can answer without already knowing which position
  it leads to. ...


  Positions that must appear as leaves: [list]. Include at least two leaves that give
  the same answer to the historical question for different reasons. Also include one
  leaf that denies the question has a first moment — e.g. the view that ''first sight''
  is a process, not an instant, and that any real case of sight restoration is contaminated
  by days or weeks of visual experience before anyone tests the subject.


  For each leaf, name the position (or write ''unnamed'' if nobody has defended it),
  state the answer it gives to the historical question, and give one sentence on the
  commitment it can''t easily shed — the awkward case or the premise it has to keep.
  Where your tree leaves a combination of answers unoccupied, say so and diagnose
  why: incoherent, unattractive, or merely unexplored. Where two leaves can''t be
  separated by any question you can put to a reader, flag the pair rather than inventing
  a distinction.


  A note on evidence: the reading group has no institutional library access, so don''t
  cite papers, dates, or editions — if a leaf needs an empirical case, describe it
  generically (the classic cataract-surgery reports, modern sight-restoration programs,
  tactile-vision substitution devices) and don''t attribute it to anyone. You may
  use the usual historical labels as shorthand where they fit (Locke, Berkeley, Leibniz),
  but the tree must not require the reader to know them.


  Audience: smart non-specialists who read a lot of blog philosophy and will notice
  if a branch is doing no work. Size: eight to ten branch nodes, no more than nine
  leaves.


  [format] Open with the instrument itself — the tree, with each leaf''s name, its
  answer, and its awkward commitment — and put any notes on unoccupied branches and
  inseparable pairs after it. No preface, no restatement of this request, no commentary
  on your process. Write in American English."


