  Prompt idea:


  I teach a graduate seminar on strategic irrationality, and each year we run a classroom
  dollar auction with real money; the escalation pattern is reliable enough that students
  start asking for ex ante protections. I want to turn that discussion into a self-contained
  exercise. Consider a bidder who enters a standard dollar auction—an auction for
  a dollar bill in which the highest bidder pays their bid and receives the dollar,
  while the second-highest bidder also pays their bid but receives nothing—and who
  knows that they are prone to the usual escalation. I have described below five candidate
  safeguards. Each safeguard is specified only by its mechanics, not by any named
  theory, so please evaluate them on the merits of the description rather than by
  matching them to a familiar label.


  Then list five. Need precise. E.g.


  1. Hard budget seal: before entering, bidder deposits a fixed maximum into an escrow
  account controlled by a third party; bids can only draw on that account; when exhausted,
  bidder is locked out.

  2. Cooling-off re-auction: every bid above a threshold triggers a mandatory 24-hour
  pause, after which the auction restarts from zero with all prior bids void and no
  money owed.

  3. Sunk-cost ledger: bidder keeps a written ledger treating all prior bids as unrecoverable;
  before each new bid they must write the incremental expected value of continuing
  from the current state only, ignoring prior losses, and can bid only if that incremental
  value is positive.

  4. Devil''s advocate bond: bidder posts a bond that a designated monitor forfeits
  if bidder makes any bid after the point at which the auction price exceeds the dollar''s
  value; monitor can stop the auction.

  5. Social precommitment with penalty: bidder publicly announces a maximum and agrees
  to pay a penalty to a third party if they exceed it; penalty escalates with each
  overage.

  6. maybe "role reversal": bidder must also play the second-highest bidder''s position
