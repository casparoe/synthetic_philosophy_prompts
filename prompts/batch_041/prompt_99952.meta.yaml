  3. Does the claim require within-cohort homogeneity? Test: would the claim survive
  if we split the cohort by education, region, race, income? If the variance within
  is as large as between, don''t use.

  4. Is there a mechanism? (shared events, institutional labeling, peer effects, media,
  marketing, policy). If no mechanism, it''s a label, not a kind.

  5. Does the label loop back? (people self-identify, companies market to them). If
  yes, it can become real, but then it''s partly caused by the label; note endogeneity.

  6. Boundary robustness: shift cutpoints by 2-3 years; does the finding hold? If
  not, don''t use.

  7. Stakes/decision: if high stakes (hiring, firing, benefits, public claims), require
  stronger evidence; if low stakes (brainstorm), okay with caveats.

  8. Stop rules: if used for individual prediction, no. If used to explain behavior
  without mechanism, no. If used to justify policy that disadvantages a cohort, no
  unless strong.

