  Procedure steps:

  0. State the claim and the decision it is meant to support. If no decision, stop.

  1. Is the term being used as a demographic cohort (just birth years) or as a generation
  (shared formative experience/identity)? If only cohort, use birth-year ranges and
  call it cohort.

  2. What is the evidence? Is there a difference between cohorts after adjusting for
