  — a round where they''re bossed around constantly but don''t feel unfree, and a
  round where nobody touches them and they do. Second, that the thing that does the
  work in the second case isn''t the *severity* of the constraint or how *predictable*
  it is, but whether the power over them is answerable to them / forced to track their
  interests. Third, and this is the one I actually care about: a round where their
