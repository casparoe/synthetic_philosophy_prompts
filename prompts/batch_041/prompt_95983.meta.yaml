  Draft:


  "I teach a seminar on translation and want to use Ted Chiang''s Story of Your Life
  and Denis Villeneuve''s Arrival as the term''s central case study, read through
  the framework Douglas Hofstadter develops in Le Ton beau de Marot: that translation
  is a species of constrained writing, that every translator chooses which features
  of the original to hold fixed (sense, sound, rhythm, syntax, register, length) and
  treats the rest as slack, and that there is no single fidelity relation, only a
  menu of them. My students can read the story and watch the film but I don''t want
  them to treat the film as a merely inferior copy, and I don''t want the opposite
  mistake either — treating the film''s changes as automatically legitimate because
  film is a different medium.


  So: read the pair as a translation problem. The story is built on a formal device
  — a narration whose tenses deliberately leave it open whether what is being described
  has happened or is yet to happen, so that the reader is placed in something like
  the heptapod relation to time — and the film cannot reproduce it, because film has
  no tense... [hmm, film has tense via editing]. Actually the film tries: it uses
  cross-cutting and the reveal. So the film attempts a translation of the device:
  the audience experiences the flashbacks as memories until the reveal reclassifies
  them as anticipations. So the film does have a device — the reclassification — but
  it''s one-shot, it works only once, whereas the story''s ambiguity persists on every
  reread.


