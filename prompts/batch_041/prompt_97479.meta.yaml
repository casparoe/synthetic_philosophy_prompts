  I am a junior at a high school in a mid-sized town, and I run a philosophy club
  that meets once a week after school. We usually have around fourteen to sixteen
  students, ages fifteen to eighteen, and a single session lasts about an hour. I
  have been asked to lead one session on a topic of my choosing, and I would like
  to build it around an idea that I have been trying to get my head around: the thought
  that the good and bad things that happen to a person are deserved, because they
  are the consequences of that person''s own past actions.


  What I want is not a lecture. I want to design an hour-long activity in which the
  members of the club, by playing it, run into the strangeness of that idea themselves,
  and only learn at the end what the idea is called and who has defended it. The thing
  I find most striking is a feature of the idea that a purely abstract explanation
  would hide from them: it functions as a ledger. Whatever a person suffers, the ledger
  has already recorded a reason, so the suffering is deserved and no one else owes
  them anything; and whatever a person enjoys, they have earned. The activity should
  make the group feel the pull of that ledger — how satisfying it is, how it seems
  to explain everything — and then make them feel the cost of it.


  I have a rough picture of how it might go, and you can keep, change, or discard
  it. Early in the session, before any framing, members would take part in a short
  game that hands out unequal circumstances — some get advantages, some get burdens
  — through some mixture of their own choices and plain luck. Then comes the turn:
  they are told that their circumstances were actually determined in an earlier round
  of the game, a round that has already happened and that none of them can remember,
  and that whatever they are holding now is exactly what they earned then. They should
  not be told what to do about this; they should simply have to live with it for the
  rest of the session, while the game continues and they keep making choices under
  it. I want the moment where someone who is badly off is told that it is their own
  doing, and cannot prove otherwise, to land on the group before anyone has heard
  the word for what they are doing.


  Please design the game itself: the rules, the setup and materials, the way circumstances
  and stakes are handed out, the length of the rounds, how the "earlier round" is
  revealed, and how the remaining time is spent. The stakes should not be real money.
  Keep it runnable in a normal classroom with nothing more exotic than index cards
  or a whiteboard, and make the rules simple enough that I can explain them in two
  or three minutes.


