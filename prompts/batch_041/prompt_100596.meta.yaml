  For years now I''ve been the sort of person who reads decision-theory and free-will
  threads on the usual blogs and forums long past the point of diminishing returns,
  and the puzzle I keep returning to is the old one usually credited to Buridan: a
  donkey placed exactly between two identical bales of hay, equally hungry, equally
  distant, and — crucially — perfectly rational, who starves because nothing in his
  situation gives him a reason to prefer one bale to the other. What I find in the
  weeds here isn''t the starving (everyone knows the starving) but the argument underneath
  it. One reading says the ass is a reductio of the very idea of a choice without
  a preference: a preference is just what a choice expresses, so "choosing when nothing
  is preferred" is incoherent, and the ass is right to die. Another reading — the
  one I''ve come to think is stronger, and the one I want the poem to take seriously
  — says the ass''s death indicts not reason but the missing tie-breaker: under an
  exact tie, no option is better than another, so picking either one (or delegating
  the pick to a coin, or to which bale happens to be marginally closer to his left
  eye) is rationally permitted, and the failure is the failure to break symmetry,
  not a failure of the canons of rationality. The medievals, as I understand it, had
  a third thing in view entirely — whether the will can act at all when the intellect
  presents two options as equal — and I''d like all three pressures to be felt in
  the poem.


  So here''s what I''d like: a villanelle, in the ass''s voice, in which the two refrains
  are mirror images of each other — the same proposition with the two bales swapped
  — so that the poem is invariant under exchanging left for right, and the reader
  who knows the problem can see that the two refrains are not two claims but one symmetry
  wearing two coats. Let the form do the work the situation does: the refrains circling,
  trading places, and finally meeting side by side in the closing quatrain, which
  should be the place where the symmetry either holds (and the ass dies of it) or
  breaks (and something arbitrary — a coin, a twitch, a breath — does what no reason
  could). I don''t want a tidy moral at the end; I want the reader to feel why a creature
  with nothing to prefer might still be unable to move, and why that might be a defect
  in the situation rather than in the creature.


