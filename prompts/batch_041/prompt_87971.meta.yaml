  Paragraph 1: Context. "I host a monthly reading group for people who came to philosophy
  through LessWrong and adjacent corners of the internet; most of us are comfortable
  with basic probability and expected utility, but only a couple have formal training
  in decision theory. We''ve been working through the value of information, and I
  want to run a session on Good''s theorem -- the result that the expected value of
  information is nonnegative for an expected utility maximizer, so you should never
  pay to avoid a free signal. The trouble is that everyone nods along and then goes
  back to thinking that information can obviously hurt you, because they''ve all internalized
  the winner''s curse and the dangers of strategic disclosure. I want an activity
  that makes them feel the theorem''s force before they see its limits."


  Paragraph 2: The activity request. "Design a 90-minute activity for 12-15 people
  that does this. The first half should put them in a single-agent decision problem
  where a signal is offered, and they should feel that having the signal is better
  -- ideally they should be able to compute the expected value of the signal and see
  that it is nonnegative, and then see that they can always ignore it. The second
  half should introduce a variant where the same signal hurts them, and they should
  discover why: perhaps the signal is public, or it changes their beliefs about what
  other people will do, or it is costly, or it interacts with a non-expected-utility
  decision rule. I don''t want them to just be told the assumptions; I want the rules
  of the game to make the assumptions visible. Include a debrief that maps what happened
  onto the theorem''s conditions -- fixed action set, fixed utility function, conditionalization,
  costless information, single agent -- and a frank note on which condition the activity
  cannot reproduce and the facilitator must supply."


  Paragraph 3: Additional details. "Materials can be minimal: index cards, a projector,
  maybe a small amount of play money or tokens. Assume the room has a whiteboard.
  I''d like the activity to be runnable by someone who knows the theorem but has never
  facilitated a game like this, so include a timeline, roles if needed, and the two
  or three things that will predictably go wrong the first time and how to handle
  them. The group is friendly but argumentative, and they will push back if the game
  feels rigged. I''d rather they feel the pull of the theorem and then the pull of
  the counterexample than have either side handed to them."


