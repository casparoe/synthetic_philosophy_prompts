  Draft:


  I''m a first-year PhD student in philosophy, and I''ve been working through the
  literature on expressivism for a seminar paper. I''ve come across the Frege–Geach
  problem in several places and I want to make sure I''ve got it right before I build
  my paper around it, because my framing feels too tidy and I suspect I''ve collapsed
  two things that the literature keeps apart.


  Here''s my understanding. The problem is that expressivists say moral sentences
  don''t state facts but rather express the speaker''s attitudes — "murder is wrong"
  expresses disapproval. But then, the argument goes, the view cannot make sense of
  moral sentences that have truth value, and that''s why Frege and Geach matter: once
  we see that "murder is wrong" can appear inside a conditional, in an unasserted
  position, we see that it''s being used as a genuine predicate with a content, not
  just as a vehicle for a grunt of disapproval. And my impression is that this objection
  has been largely defused, because a couple of decades of work on deflationism or
  minimalism about truth showed that you can say moral sentences are true and false
  without thinking of truth as correspondence to a moral fact — so the expressivist
  can just help herself to a deflated notion of truth and the problem goes away. On
  that reading, Frege–Geach is really the truth-aptness objection in a fancier dress,
  and it''s a problem for the crude emotivism of the 1930s rather than for a sophisticated
  contemporary expressivism.


