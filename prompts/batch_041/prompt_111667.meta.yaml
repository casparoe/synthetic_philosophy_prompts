  Draft:


  I write about science and ideas for a general-interest magazine, and I am putting
  together a special issue on how we think about death. I would like you to write
  a short story for it, of roughly 1,500 words.


  The story should take the oldest argument in the philosophy of death seriously.
  The Epicureans held that death cannot be an evil for the one who dies, on the grounds
  that good and evil consist in sensation, and the dead have none. A related argument,
  also Epicurean, asks why we dread the eternity of nonexistence after death but not
  the eternity of nonexistence before birth. Against both stands what is now usually
  called the deprivation account: death is bad because it takes from us the goods
  we would otherwise have had, so a person who dies young is harmed more than a person
  who dies old, and neither the absence of sensation nor the pre-natal symmetry makes
  any difference. Two difficulties in the vicinity are what I want the fiction to
  feel: first, that a harm seems to need someone to be harmed, and there is no one
  at the time; second, that the deprivation account compares an actual life with a
  life that was never lived, and it is not obvious that the two can be placed on a
  single scale.


  Then the premise. Set the story in a jurisdiction that has legislated the Deprivation
  Ledger: when someone dies by another''s hand, an assessor computes the difference
  between the value of the life the deceased actually had (or was on track to have)
  and the value of the life they would have had but for the killing; the number sets
  the compensation owed to the family and the severity of the offence. The assessor
  must sign a form, and the form has a line for the name of the person harmed.


  Your protagonist is an assessor. I would like the story to follow her (or him) through
  three files that strain the procedure:

  - a man in the first weeks of a diagnosis that would have made the rest of his life,
  on any honest reckoning, worse than nothing, so that the Ledger yields no deprivation
  at all;

  - a young child, where the assessor must decide whether the goods that count are
  those of the child as she was, or those of the adult she would have become — the
  two answers diverge sharply;

  - a person who died by their own hand after a long and settled wish to die, where
  the counterfactual is not obvious: continued life, or the death they chose?


  Also: the possibility that a reputation can be destroyed after death and whether
  that counts.


  Requirements: the arguments must be carried by procedure, forms, and dialogue, not
  by a character explaining the Epicurean position at length; no footnotes or citations;
  the story should not resolve the philosophical question and should not end in a
  moral; end with a decision.


