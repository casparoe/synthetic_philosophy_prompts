  "I''ve been sitting in on a reading group about time perception, and there is a
  fork I keep running into that I don''t have a word for, and I''d like to know whether
  the field has one. Two of the cases. In the first, a red dot is flashed on one side
  of a screen and a green dot on the other side a fraction of a second later; people
  don''t report two dots, they report a single dot that slides across and turns green
  about halfway. The colour change is reported as happening before the second dot
  was ever shown, which is the part that bothers me. In the second case, a word is
  flashed and then a pattern follows it almost immediately; people say they saw nothing,
  or saw the word perfectly clearly, depending on the gap, and the transition between
  those two reports is abrupt. What interests me is that both cases get explained
  in one of two ways, and the two ways are always presented as rivals. The first explanation
  says the brain held the earlier event in storage, waited for the later one, and
  then assembled a single experience out of both, delivering it late — so what you
  consciously get is a construction that post-dates the second stimulus. The second
  explanation says the experience was delivered immediately and accurately — you really
  did see the dot turn green when it seemed to — and what happened later is that the
  memory, and hence the report, was quietly rewritten, so that a tidied-up version
  replaced the original. The ''wait and assemble'' story and the ''rewrite the record''
  story agree, as far as I can tell, about what content is present in the brain at
  each moment; they disagree only about which of those content-bearing states deserves
  to be called the experience and which deserves to be called the memory of it. They
  seem to predict the same reports, the same response times, and would be consistent
