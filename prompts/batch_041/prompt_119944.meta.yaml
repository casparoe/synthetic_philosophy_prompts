  Requirements:


  (a) The weights, summing to 1, with each factor placed in one of four tiers (central,
  substantial, minor, negligible).

  (b) One sentence of justification per factor, saying what evidence or consideration
  moves it up or down.

  (c) A separation of the factors into enabling, licensing, and motivating conditions
  — i.e. those that made the killing physically possible, those that made it permissible
  in the men''s eyes, and those that made it likely. Say which of the three kinds
  carries most of the weight.

  (d) The counterfactual that matters most: which single factor, removed, would have
  most reduced the outcome, and why the removal is or is not historically coherent
  (i.e. whether the factor could have been absent while the others were present).

