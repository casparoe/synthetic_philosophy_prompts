  I am putting together a handout for the second week of a graduate seminar on risk,
  uncertainty and public reason, where I want students to see that the precautionary
  principle is not one position but a family of positions whose disagreements are
  often obscured by the label. The familiar weak-versus-strong contrast is too coarse
  for my purposes. I want a taxonomy in the form of a decision tree that begins from
  a commitment students may already have—namely, that in some cases a lack of decisive
  evidence about harm should make a difference to what we are permitted to do—and
  then branches according to the questions that actually separate the positions. Please
  build the tree from the logical space first, not from a list of famous names: start
  with three distinctions I use in my teaching, namely precaution as a decision rule
  for choosing actions, precaution as an epistemic attitude towards incomplete evidence,
  and precaution as a device that shifts the burden or standard of proof onto those
  who propose an activity. Within that space, let the branch nodes be questions about
  the trigger for precaution (bare possibility, a plausible mechanism, a non-negligible
  probability, or a signal of irreversible harm), the object of precaution (the activity
  itself, the technology, the uncertainty, or the distribution of possible harms),
  who must bear the burden of proof, what standard of proof they must meet, and what
  remedy follows (moratorium, adaptive management, compensation, directed research,
  or nothing beyond ordinary regulation). Each leaf should carry either the name of
  a position—where a recognisable position exists—or the word unnamed, together with
  one sentence stating its most awkward commitment. I would like you to flag any pair
  of leaves the tree cannot genuinely separate, and to note which combinations of
  answers are unoccupied and whether that is because the view is incoherent, unattractive,
  or merely unexplored.


  To keep the exercise concrete, please make every diagnostic question answerable
  by someone who does not already know the labels, and anchor the branches in a small
  set of cases I shall supply: a gene drive intended to suppress malaria mosquitoes
  but capable of crossing into non-target species; a deep-sea mining licence for battery
  metals where the recovery rate of the seafloor community is unknown; a cosmetic
  ingredient with a weak but non-zero signal in a rodent assay; a stratospheric aerosol
  experiment that is cheap to start but costly to reverse; and a psychiatric drug
  that may help a rare condition but whose long-term effects are unknown. I want eight
  to ten leaves in total, and I would prefer the tree to distinguish positions such
