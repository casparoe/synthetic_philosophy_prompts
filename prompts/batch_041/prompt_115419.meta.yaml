  Essay draft:


  The standard contrast is between outcome-based supervision, which rewards or penalizes
  the final answer, and process-based supervision, which rewards or penalizes the
  steps by which the answer was reached. The usual case for process supervision is
  that outcome supervision is blind to how the result was obtained: a model can get
  the right answer for the wrong reasons, or get the wrong answer while reasoning
  well. The usual case for outcome supervision is that process labels are expensive
  and that a process that looks good can be a rationalization generated after the
  fact.


  I want to defend a third option, which I''ll call counterfactual process supervision.
  The idea is not to grade the trace the model actually produced, but to grade the
  trace it would have been likely to produce under small, controlled changes to the
  problem -- changes that should not alter the correct method, only the incidental
  details. If the model''s success survives those changes, that is evidence that the
  process was robust; if it collapses, the original success was probably fragile.
  On this view, what we supervise is not the actual chain of thought but a disposition:
  a stable tendency to reach the answer by a method that would still work when the
  surface changes.


  This is supposed to combine the strengths of the other two. Like outcome supervision,
  it does not require us to trust the model''s own narration of its reasoning. Like
  process supervision, it is sensitive to how the answer was reached, because it tests
  the method rather than the answer alone. And it gives us a way to talk about cases
  where the outcome is right but the process is bad: those are cases where the success
  is not counterfactually stable.


  The obvious objection is that this just pushes the problem back. If the model can
  detect the perturbations and adjust, then counterfactual stability is as gameable
  as a written rationale. My reply is that the perturbations need not be hidden from
  the model; they need only be drawn from a distribution that the model cannot reliably
  distinguish from the distribution of real deployment inputs. But I am not sure this
  reply is more than a promissory note.


  The deeper worry is about what "the same method" means. Counterfactual process supervision
  seems to presuppose a way of individuating methods across changes in surface features,
  and I do not have a theory of that. Without one, the proposal may be circular: it
  tells us to reward the method that would succeed under perturbation, but the only
  way we know the method is by seeing what succeeds under perturbation.


  So my tentative conclusion is that the distinction between process and outcome supervision
  is less fundamental than the distinction between supervision that is sensitive to
  counterfactual robustness and supervision that is not. If that is right, the real
  question is not "process or outcome?" but "which counterfactuals?" I would like
  to know whether this is a genuine advance or just a redescription of the standard
  trade-off, and where the essay''s weakest link is.


