  Now, does part (c) have a clean answer? Let''s think: Searle''s internalization
  reply to the systems reply: if the man memorizes the rules and the database, then
  he is the whole system, and he still doesn''t understand Chinese. Therefore the
  system doesn''t understand. The Bilingual Room variant: here the operator *does*
  understand Chinese, so "look, the person doesn''t understand" fails as a premise
  — and internalization would be a case where the person does understand. So the variant
  shows: (i) Searle''s argument, in its "look at the occupant" form, relies on a contingent
  feature of the example (the operator''s monolingualism); (ii) internalization is
  supposed to remove that contingency by making the person the whole system, but if
  the person is the whole system and understands, then internalization would *confer*
  understanding — which is absurd unless understanding comes from the man''s own (biological,
  non-symbol-manipulating) capacities; (iii) the deep point: internalization changes
  the functional organization (memory limits, serial vs parallel, the man''s own semantic
  capacities and their interaction with the rule-following), so "the same system,
  just internalized" is not obviously the same system. So the internalization reply
  equivocates between "the system" as a program-level entity and as a physical implementation;
  and it''s subject to a dilemma: either internalization preserves the system''s functional
  organization (in which case the man''s own understanding is irrelevant/adds a different
  system, and the systems reply is untouched), or it doesn''t (in which case it''s
  not a test of the same system at all).


