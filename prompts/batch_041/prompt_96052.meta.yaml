  to take for granted has been nagging at me and I''d like help digging out what it
  actually assumes.


  Here''s the practice. When a government agency wants to justify a new rule — a tighter
  limit on some solvent, say, or a highway guardrail standard — it runs a cost-benefit
  analysis, and to put a dollar value on the lives the rule would save it uses a figure
  often called the value of a statistical life. The figure is not what a person would
  pay to save their own skin. It''s inferred from choices: mostly from wage studies,
  where more dangerous jobs pay more, so if you assume workers know the risks and
  are free to take another job, the extra pay they demand for a little more chance
  of dying tells you what they''ll trade a small risk for. More recently they also
  just ask people what they''d pay for a small reduction in risk. Then the agency
  multiplies that figure by the deaths the rule is expected to prevent and stacks
  it against the cost of the rule.


  Three things about this bother me and I can''t tell whether they''re practical wrinkles
  or something deeper.


  First, the figure is applied to everyone alike. A rule that saves a thousand lives
