  The domain: Buridan''s ass — a case where two options are exactly equally good (or
  equally attractive), and the agent supposedly starves because there''s no reason
  to prefer one. The philosophical issues: Is it possible to have a genuine tie in
  reasons? If so, what does rationality require — suspend judgment, pick arbitrarily,
  pick with indifference? Does the tie-break need a reason? Is there a "rational"
  way to break a tie (e.g., randomization, picking the larger, salience, "whatever")?
  Does the theory of practical reason require that deliberation terminate?


  Key desiderata for a theory of choice without preference:

  1. It must explain how an agent with exactly equal reasons can act at all (the "possibility
  of action under indifference" requirement) — or explain why such a case is impossible.

  2. It must not make arbitrary choice irrational (the "no paralysis" requirement).

  3. It must handle the case where the agent has no preference but the outcomes are
  not equal — e.g., incomparability vs. indifference vs. equality of value. These
  are different: parity/rough equality, incommensurability, incomparability, indifference,
  tie. A theory must respect the distinction between (a) equal value, (b) incomparable
  values, (c) indifference in preference (attitude) vs. equality of value (world).

  4. It must respect the difference between preference and choice: choice without
  preference is possible; preference without choice isn''t relevant.

  5. It must account for the diachronic/serial case: repeated choices among equally
  good options, and the value of having a policy (e.g., committing to a tie-breaker
  rule, or the value of resoluteness — like Ruth Chang''s "voluntarist" account; or
  Bratman''s self-governance; or the "no reason to be upset by a coin flip" argument).

  6. It must explain why randomizing is or isn''t rational — the "coin flip" requirement.
  Is randomization a reason?

  7. It must handle the asymmetric cases where small differences matter (e.g., the
  option that is slightly better in one respect) — the "sensitivity" requirement,
  avoiding the slippery slope to "any difference suffices."

  8. It must be consistent with the possibility of rational regret and rational self-criticism
  (the "no-ought-to-have-done-otherwise" requirement).

  9. It must explain the relation between choice and preference in revealed-preference
  terms — behaviorism vs. mentalism. If choice reveals preference, then choice without
  preference is impossible by definition; the theory must say whether that''s a substantive
  claim or a stipulation.

  10. It must handle the "sour grapes"/adaptive preference and the case of someone
  with no preference who must choose for another (a guardian, a parent) — what does
  it mean to choose in the interest of someone with no preferences.

  11. It must account for the Buridan case''s asymmetry: the ass''s death is a reason
  to choose, so there''s always a reason (the reason to not starve) — a theory must
  say whether the case is coherent, i.e., whether the options are truly symmetric
  given the consequences of not choosing. This is the "the choice itself changes the
  payoffs" requirement.

  12. The "money pump" / "preference cycles" issue — irrelevant.


