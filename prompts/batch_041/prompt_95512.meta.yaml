  I am presenting a paper at a small interdisciplinary workshop on moral change, and
  what I need from you is not an essay but a question-and-answer preparation sheet.
  My thesis is that the two great moral revolutions I work on — the abolition of the
  slave trade and the extinction of the gentleman''s duel — were caused neither by
  the discovery of new moral arguments nor by shifts in material interest, but by
  a change in the composition of the audience before whom honour was at stake. The
  argument I will put to the room runs roughly as follows. First, the arguments against
  both practices were fully available, and widely printed, at least a generation before
  either practice began to recede; the arguments alone therefore cannot explain the
  timing. Second, interest cannot explain it either: the economic case for and against
  each practice cut both ways, and the people who ended them were often acting against
  their own material advantage. Third, what actually changed was who was watching.
  As the relevant public widened from a narrow caste of peers to a broad and anonymous
  readership, the same old arguments stopped being answerable by the same old rejoinders,
  because the currency at stake — standing in the eyes of one''s equals — was now
  being minted somewhere else. Fourth, and this is the corollary I intend to draw:
  a norm is hostage to its audience, so moral progress is reversible; narrow the audience
  again and the norm can return. Along the way I mean to deny the standard contrast
  between an age of honour and an age of dignity: honour did not vanish, it merely
  changed hands.


  The room will hold about twenty people, and I know who most of them are. There is
  a bloc of moral rationalists and Kantian constructivists who hold that moral progress
  just is the slow discovery and diffusion of reasons, and who will hear my thesis
  as a debunking of moral reasoning itself. There are two economic historians of the
  materialist school, for whom talk of honour is soft-headed, who will want to know
  why I am not simply redescribing the rise of the commercial bourgeoisie. There are
  a couple of empirically minded moral psychologists who work on shame, reputation,
  and third-party punishment, and who will ask what my mechanism predicts and whether
  "a widening audience" is anything more than a metaphor. There is a sociologist of
  norms who will press me on honour versus dignity and suspect that I have renamed
  an old story. And there is one specialist on the period who cares only about the
