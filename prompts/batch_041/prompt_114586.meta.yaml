  \ cases reveal a rule. Actually the type allows \"an author's rulings across their\
  \ examples, a tradition's treatment of precedents\".\n\nBetter: make it a track\
  \ record in a concrete institutional setting, e.g., a scientific advisory panel\
  \ or a \"forecasting\" group, with cases that reveal whether she conciliates or\
  \ is steadfast. Then the new case involves a divergence: e.g., the disagreement\
  \ is with an epistemic peer whose reliability is unknown vs. known; disagreement\
  \ about a case where the peer's reasoning is opaque; disagreement where the peer\
  \ shares all evidence (full disclosure) vs. where the peer has private evidence;\
  \ disagreement where the question is not \"what's the fact\" but \"what's the right\
  \ response\" — higher-order evidence, etc.\n\nThe instruction says the earlier verdicts\
  \ must be jointly consistent with more than one plausible rule, and the new case\
  \ chosen so at least two diverge. The deliverable: prediction, candidate rules,\
  \ best guess with reasons, and the distinguishing case.\n\nLet me design it carefully.\
  \ Keep it formal/polished.\n\nDomain: peer disagreement: conciliationism vs steadfastness.\n\
  \nLet me create a track record. Something like: a colleague, \"Priya\", an epistemologist...\
  \ hmm, the asker reports verdicts. Let's write verdicts on cases:\n\n1. Two people,\
  \ same evidence, one says the coin is fair (or: restaurant bill arithmetic), disagreement\
  \ about a simple arithmetic split — she says both should suspend/ split difference?\
  \ Typically conciliationism says in cases of peer disagreement with same evidence,\
  \ one should move toward the other (equal weight view: split the difference).\n\
  2. Disagreement with someone she regards as a peer but who she thinks has a track\
  \ record of error in this domain — she says she should stick to her guns? That suggests\
  \ she weights by reliability (not \"equal weight\").\n3. Disagreement with a non-peer\
  \ (an amateur) — she says no change.\n4. Disagreement where she has \"private\"\
  \ evidence the other lacks — she says no change? Hmm, but some conciliationists\
  \ (Kelly) say if the peer has the same evidence then... Actually if you have evidence\
  \ the other doesn't have, it's not a full disagreement, so no conciliation required.\n\
  5. Disagreement about a philosophical question (no shared decision procedure) —\
  \ she says she should moderate but not suspend.\n6. Disagreement where the peer\
  \ is a recognized expert but her own reasoning is... \n\nLet's aim for two competing\
  \ rules that fit all verdicts:\n\nRule A: \"Conciliation is triggered by disagreement\
  \ with someone you regard as an epistemic peer, and the response is to move toward\
  \ the midpoint (equal weight), unless you have reason to discount them (reliability\
