  \ views (his undergraduate thesis on sin and faith, his later \"On My Religion\"\
  ). Hmm.\n\nThe \"verdicts\" type requires a track record of case verdicts. Peer\
  \ disagreement is the cleanest: a philosopher's verdicts across disagreement cases.\n\
  \nBut the instruction says prompts should be \"in the weeds\" and inject new/niche\
