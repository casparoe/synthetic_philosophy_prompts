  Opening: "I have been reading LessWrong and related forums for years, and I keep
  running into a slogan that I cannot get a clean fix on: ''A conditional is a bet,
  not a proposition.'' I most recently saw it in a discussion of whether you can assign
  a probability to ''If A, then B'' and how that relates to P(B|A). The poster used
  it to reject the idea that conditionals have probabilities at all, and also to say
  that updating on a conditional is just conditionalizing. I suspect the slogan is
  doing several different jobs at once, and I want a menu of precise readings rather
  than a defense of one."


