reasoning_summary: "The user wants a prompt in the \"Predict or recommend a verdict\
  \ on a new case from someone's verdicts on earlier cases\" type. Domain options\
  \ include \"The procreation asymmetry\" and \"Responsibility gaps for autonomous\
  \ systems\" etc.\n\nLet me think about which domain combines best. The procreation\
  \ asymmetry (Benatar's asymmetry: pain is bad, pleasure is good, absence of pain\
  \ is good, absence of pleasure is not bad → coming into existence can't be better\
  \ than not existing). That's a domain with lots of case-based verdicts: e.g., verdicts\
  \ on whether it's wrong to bring someone into existence with a life barely worth\
  \ living, whether it's wrong to bring happy people into existence, whether it's\
  \ good to prevent suffering by not conceiving, etc.\n\nActually, the \"predict verdicts\
  \ from earlier verdicts\" type works well with the procreation asymmetry: a person's\
