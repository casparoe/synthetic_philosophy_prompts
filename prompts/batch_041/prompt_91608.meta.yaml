  \ earlier verdicts.\n\nDoes R1 fit #4? R1 says only wrong if worse than nothing.\
  \ #4 says it's good (not required, but good) to avoid a barely-worth-living birth.\
  \ R1 could accommodate: avoiding it isn't wrong, and \"good\" might just mean \"\
  not a loss\" — hmm, weakly. Actually maybe make #4 weaker: \"If they decided not\
  \ to conceive, she wouldn't think they'd done anything wrong or missed out on anything.\"\
  \ That's consistent with both.\n\nThen the new case must make R1 and R2 diverge:\
  \ e.g., a child whose life will be clearly worth living overall but will include\
  \ severe, unavoidable suffering — say a child with a condition causing years of\
  \ intense pain, but who will also have a rich, happy life overall. R1: permissible\
