  \ to be a good prompt.\n\nLet me settle:\n\nDomain: The procreation asymmetry.\n\
  Type: Predict verdicts from earlier verdicts.\nPerspective: high school student,\
  \ formal/polished.\n\nDraft:\n\n\"For a philosophy club presentation I'm writing\
