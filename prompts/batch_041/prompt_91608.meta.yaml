  \ would be happy; a couple deciding whether to have a child who would suffer; a\
  \ policy of preventing conception; a case of a happy person who could be replaced...\
  \ And the new case: e.g., bringing into existence a person whose life will be on\
  \ balance good but who will experience a period of significant suffering that could\
  \ have been avoided by waiting... Hmm.\n\nBut the prompt must be written by a high\
  \ school student and formal/polished. Hmm, a high school student discussing the\
  \ procreation asymmetry is plausible-ish (they might have read about antinatalism\
  \ online). Let me think.\n\nAlternatively, \"Overdetermination and multi-causal\
  \ explanation in history\" — a history teacher's verdicts on cases. Or \"Contingency\
  \ and chaos in history: for want of a nail\".\n\nThe procreation asymmetry is a\
  \ good fit: verdicts on cases that are jointly consistent with more than one rule.\
  \ E.g., the person's verdicts:\n- It's wrong to bring a child into existence knowing\
  \ they will suffer terribly and their life will be worse than nothing. (Wrong)\n\
  - It's not wrong (indeed permissible, but not required) to bring a happy child into\
  \ existence.\n- It's not required to bring a happy child into existence.\n- It's\
  \ good to prevent the existence of a suffering child (i.e., there's reason not to\
  \ conceive).\n- The absence of pleasure in a non-existent person isn't a loss.\n\
  \nRules that fit: (a) Benatar's axiological asymmetry (existence can be bad, non-existence\
  \ never bad, coming into existence can't benefit); (b) a person-affecting/narrow\
  \ principle (only actual persons count; creating a happy person isn't required but\
  \ also the asymmetry is about the wrongness of imposing suffering); (c) a \"consent\"\
  \ or \"gambling\" rule (it's wrong to impose a risk of severe harm without consent,\
  \ even if expected value is positive) — this predicts that bringing a happy-but-risky\
  \ child into existence is wrong, whereas Benatar's asymmetry only says it's not\
  \ required/not good.\n\nHmm, need a new case where at least two candidate rules\
  \ diverge.\n\nCandidate rules:\n1. Benatar's asymmetry: coming into existence can\
  \ be bad for the one created (if life is worse than nothing), never good; non-existence\
  \ is never bad. So: it's wrong to create a life that will be net negative; not wrong\
  \ but not required to create a net positive life; no reason to create happy lives.\n\
  2. Narrow person-affecting / \"actual persons only\": the only reasons concern actual\
  \ people; bringing someone into existence with a bad life is wrong because it harms\
  \ an actual (future) person; creating a happy person isn't required and isn't good\
  \ since there's no subject to benefit before creation... Hmm, this is similar.\n\
  3. Risk-imposition / consent rule: it's wrong to impose a serious risk of a bad\
  \ life without consent, regardless of expected value — so it's wrong to create a\
  \ child even with a positive expected life if the risk of a terrible life is high\
  \ enough.\n4. \"Procreative liberty / no wronging without a victim\": creating a\
  \ child can't wrong the child unless the child's life is worse than nothing (this\
  \ is the \"wrongful life\" threshold), so it's permissible.\n\nActually, let me\
  \ design the earlier verdicts to be consistent with at least two plausible rules:\n\
  \nThe friend's verdicts (a \"friend\" who has read a lot about antinatalism — but\
  \ high school student perspective):\n\n1. A couple who knows their child would have\
  \ a severe, painful, lifelong condition that makes life not worth living: it's wrong\
  \ to conceive. (Wrong)\n2. A couple deciding whether to have a child they expect\
  \ to have an ordinary, on-balance good life: it's not wrong, but there's no reason\
  \ to do it for the child's sake — and it's not required. (Permissible, not required)\n\
