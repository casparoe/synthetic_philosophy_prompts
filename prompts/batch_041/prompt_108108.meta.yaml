  - Asker''s opening move: "Here''s my problem. You say that when the gun fires and
  doesn''t fire, I only ever experience the not-firing branch, so I''ll survive any
  finite sequence. Fine. But then consider: whatever branch I''m in, it has to be
  one where I''m alive. So my whole evidence is ''I''m alive.'' Doesn''t that mean
  I should expect to find myself in the branch where I''m alive by the most absurd
  means -- the branch where the bullet is stopped by a cosmic ray, where the gun turns
  into a butterfly, where I''m the one person out of 10^80 who survives the supernova?
  Because those branches have nonzero amplitude, and there''s no branch where I''m
  dead to compare against. If that''s what your view implies, then quantum immortality
  is really just the claim that I should always expect to be a freak outlier -- which
  seems false, and also makes the view untestable. Where does my reasoning go wrong?"


  The character must respond: this is essentially the "self-locating uncertainty /
  measure" issue and the "survivor bias" issue: the Everettian can say that credences
  over branches are given by Born measure, so the probability of being alive after
  n trials decreases as measure, and there''s no contradiction because "I survive
  with certainty" is an error: what''s true is that there is a branch with me alive;
  my future self-location credence is spread across branches including dead ones (if
