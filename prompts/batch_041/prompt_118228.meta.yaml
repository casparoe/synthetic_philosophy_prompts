  Draft:


  "I am preparing a position paper on the ethics of harm and would like a consistency
  audit of my commitments before I commit to them. My position is as follows.


  (1) There are genuine deontological constraints on action: it is wrong to intentionally
  kill one innocent person even when that is the only way to save five others.

  (2) These constraints are not brute or self-evident axioms. They admit of justification,
  and the justification runs through what the constraints protect — the fact that
  each person''s life and bodily integrity matter enormously.

  (3) The justification must be agent-neutral in form. Whatever reason grounds my
  constraint against killing is the same kind of reason for anyone else, and in stating
  it I am to count the interests of each person equally, not to give extra weight
  to the fact that it would be my hand that did the killing.

  (4) The constraints are nevertheless not absolute. They have thresholds: at some
  sufficiently large number of lives saved, it becomes not merely permissible but
  required to kill the one.

  (5) The constraints are part of the moral truth rather than rules of thumb. An agent
  who violates a constraint in order to produce the best available outcome acts wrongly
  even when the outcome is in fact better.

  (6) In deliberation, a constraint does not compete with the reasons it excludes;
  it tells the agent not to act on those reasons at all. That is why I am not, each
  time I consider killing one to save five, simply weighing five lives against one
  and finding the five heavier.

  (7) I accept the doing/allowing distinction: I may in some cases allow people to
  die whom I could save at little cost, but I may not kill.


  Here is what I want from you: which of these actually pull against each other, which
  only appear to, and how severe each real tension is. Order the genuine tensions
  from most to least serious, and for each say precisely which commitment would have
  to be weakened or abandoned to restore consistency, and what the cost of that revision
  would be. If a tension is merely apparent, explain the distinction that dissolves
  it. Finally, tell me whether there is a single revision that would relieve more
  than one tension at once, and what the resulting package would look like."


