  Let''s design the disagreement.


  Scenario: I recently started donating a significant portion of income after reading
  about effective altruism. At a dinner, two friends (say, Mira and Daniel) argued
  about whether consequentialism is too demanding. I am bystander. They exchange several
  rounds.


  Need actual back-and-forth:

  1. Daniel: Consequentialism is too demanding because it requires you to keep giving
  until you reach the point where further giving would make you worse off than the
  person you could help; that leaves no room for personal projects, partiality, etc.
  Any theory that says you must sacrifice your own child''s piano lessons to save
  a stranger''s life is unacceptable.

  2. Mira: That''s not an objection to consequentialism but to a caricature. Consequentialism
  says you ought to maximize expected good; it doesn''t say you must ignore your own
  projects unless they are less valuable than the alternative. But if they are less
  valuable, then yes, you should. The "too demanding" objection just asserts that
  common-sense morality is correct; it begs the question. Also, demandingness is a
  feature of any morality that takes impartiality seriously: even deontologists have
  duties to rescue.

  3. Daniel: But there''s a difference between a theory telling you what is right
  and a theory telling you what to do at every moment. Consequentialism collapses
  the distinction between the morally required and the morally supererogatory; it
  turns every unoptimific action into a wrong. That''s not just demanding; it destroys
  the concept of a life well lived. And it can''t be action-guiding because no one
  can calculate all consequences; so it''s self-defeating.

  4. Mira: The action-guiding point is about decision procedures, not criteria of
  rightness. We can accept a criterion that says an act is right iff it maximizes
  expected value while using a heuristic decision procedure. And the collapse of supererogation
  is a real cost, but maybe the concept of supererogation is a moral fiction. Alternatively,
  one can be a scalar consequentialist: actions are better or worse, not required
  or forbidden. That reduces demandingness.

  5. Daniel: Scalar consequentialism just changes the subject; it still says you''re
  a worse person for not giving. And the "decision procedure" move is a dodge: if
  you don''t use the criterion, you''re not really a consequentialist in practice.
  Also, there are agent-relative prerogatives: it''s not question-begging to say morality
  must leave room for the personal point of view; that''s a constraint on any acceptable
  moral theory.

  6. Mira: But why is the personal point of view a constraint rather than a preference?
  If you accept that from the impartial point of view all lives count equally, then
  the fact that some sacrifices are hard for you is not a reason to think they''re
  not required. And the demandingness objection often assumes a fixed "cost threshold"
  — but any threshold is arbitrary. The real question is whether there''s a principled
  stopping point. Maybe there isn''t, and that''s uncomfortable but not an objection.


  Then ask: adjudicate move by move: which points are right, which are mistaken, what
