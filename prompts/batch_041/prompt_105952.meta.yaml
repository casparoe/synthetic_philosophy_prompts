  Potential final prompt:


  "I recently signed a pledge to give a significant fraction of my income to organizations
  that fight extreme poverty, and at a dinner last week two friends of mine, Daniel
  and Mira, got into an argument about whether that kind of commitment is what morality
  actually requires. I stayed out of it, but I have been thinking about their exchange
  ever since, and I would like an impartial adjudication of it.


  Daniel began by saying that consequentialism is not merely demanding but abrasive.
  It is demanding, he said, because it requires you to keep sacrificing until the
  marginal cost to you equals the marginal benefit to someone else; it is abrasive
  because it treats your own projects, relationships, and talents as mere instruments
  for producing good, so that any of them may be overridden whenever something else
  would produce slightly more. He offered a case: suppose you could save a stranger''s
  life by permanently abandoning the one pursuit that gives your life meaning. A consequentialist,
  he said, has to tell you to abandon it, and that shows the theory has no room for
  the distinction between the morally required and the morally supererogatory.


  Mira replied that this conflates a criterion of rightness with a decision procedure.
  Consequentialism can say that the right act is the one that maximizes expected value
  while allowing agents to use heuristics, rules of thumb, and partial attachments
  as a way of approximating that criterion. She also said the demandingness objection
  is often question-begging: it assumes that common-sense morality''s permission to
  favor oneself is a fixed constraint on any acceptable theory, but an impartialist
  will deny exactly that. And she added that if the objection proves anything, it
  proves too much: any morality that takes impartiality seriously will sometimes demand
  that we sacrifice our projects.


  Daniel responded that the decision-procedure reply is a dodge. If you never actually
  use the consequentialist criterion to decide what to do, he said, then you are not
  living as a consequentialist; you are just a rule-worshipper with a consequentialist
  ornament. He also said that the "proves too much" reply misses a distinction between
  demandingness and abrasiveness: a theory may demand that you give up a kidney without
  demanding that you treat your own life as a mere resource. He claimed that any acceptable
  morality must be one that an agent can own from the inside, and that a theory which
  tells you to regard your deepest commitments as fungible cannot be owned by anyone
  with a life to live.


  Mira answered that this is either an empirical claim about what people can psychologically
  sustain or a normative claim smuggled in as a constraint. If it is empirical, it
  may be true but irrelevant to what is right. If it is normative, it needs an argument,
  and the argument cannot be that the theory makes you feel bad. She also pointed
  out that Daniel''s own case is underdescribed: if the pursuit really is less valuable
  than the life you could save, why should its meaning for you outweigh the stranger''s
  survival? And she noted that consequentialists can accept agent-relative prerogatives
  as a concession to human psychology without making them fundamental.


  Daniel replied that the case is not underdescribed; it is designed to isolate the
  value of a life project from its consequences. He said Mira''s reply assumes that
  the only reason to care about one''s own projects is the good they produce, which
  is precisely what is in dispute. He also said that the arbitrariness of any "cost
  threshold" cuts against consequentialism, not for it: if there is no principled
  point at which sacrifice stops, then the theory cannot be action-guiding in the
  way a moral theory must be. Mira said the threshold is not arbitrary if it is set
  by the criterion itself: sacrifice until further sacrifice would produce less good.
  Daniel said that is not a threshold an agent can live by.


  Please adjudicate their exchange point by point, rather than simply choosing a side.
