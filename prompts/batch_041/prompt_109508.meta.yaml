  the fact that the DP applies to the basic structure rather than to individual transactions,
  and the fact that "least advantaged" is defined by an index of primary goods rather
  than by welfare or by any single metric. And that Rawls''s DP is not a decision
  rule under uncertainty (maximin) — this is a real, subtle point: many people conflate
  the two; Rawls explicitly said the maximin rule is used as a heuristic in the original
  position and that the DP is a principle of justice that doesn''t presuppose maximin
  decision theory. Also the "veil" doesn''t require choosing as if you could be anyone
