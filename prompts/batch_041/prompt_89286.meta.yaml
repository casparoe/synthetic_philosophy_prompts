  Last month I spent most of an evening arguing with a friend who works on machine
  learning, and I have not been able to let the argument go. His position is that
  the symbol grounding problem has been solved in practice if not on paper: systems
  trained on enough text and images end up with symbols that mean something, and the
  philosophical worry was always an artefact of looking at toy systems. Mine is that
  he is answering a different question from the one the problem was posed to ask.
  What struck me afterwards is that we kept sliding past each other, and that the
  slide has a structure worth writing up.


  I want to turn my side of that argument into a research proposal, and I would like
  you to write it. The core idea, which is still only half-formed, is this: discussions
  of grounding run together two questions that should be separated. The first is genetic
  — what causal history must a token have had for it to carry the content it does,
  i.e. what makes it the case that this symbol rather than another was acquired from
  that object or interaction? The second is sustaining — what makes it the case, at
  a given moment, that a symbol has the content it has, i.e. what features of the
  system''s current organisation and its ongoing coupling with the world fix its meaning
  now? My suspicion is that the standard families of answer each address one of these
  and are then read as though they had addressed both, and that most of the familiar
  objections (the ones about symbol manipulation without understanding, and the ones
  about causal chains that are too deviant or too long) are really aimed at the sustaining
  question while the theories that provoke them are offered as answers to the genetic
  one.


