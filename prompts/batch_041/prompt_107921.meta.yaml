  Let me draft the essay. I need to be careful with facts. Skolem''s paradox: The
  Löwenheim-Skolem theorem says that if a first-order theory has an infinite model,
  it has a countable model. Applied to set theory (ZFC), if ZFC is consistent, it
  has a countable model. But in that model, there are sets that the model "thinks"
  are uncountable (e.g., the set of real numbers), because there is no bijection in
  the model between that set and the natural numbers. Yet from the outside, the model
  is countable, so the set is countable in the metatheory. This seems paradoxical:
  the real numbers are uncountable, but the model says they''re uncountable while
  being countable. Skolem''s conclusion: set-theoretic notions like "uncountable"
  are relative to a model; there is no absolute notion of uncountability. This raises
  questions about the determinacy of reference for set-theoretic terms.


