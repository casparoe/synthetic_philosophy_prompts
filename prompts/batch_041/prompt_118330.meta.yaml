  brainstorming 3 or 4 possible spines for the speech and tell me which one you''re
  taking and why the others lost -- then write it. (The brainstorming can be short,
  I just want to see you pick.)


  Here''s the setup. I run a small one-year masters program -- the kind of thing with
  ''decision theory'' and ''global risk'' in the title -- and this is our first cohort
  graduating. I have to give the commencement address. It''s about 8 minutes. The
  room is split roughly in half: the graduates and the faculty, who will know every
  term I use and will notice if I fudge anything; and the families, who mostly have
  no idea what their kid has been doing all year and are politely wondering whether
  it''s a real degree. My own parents will be in the third row. So the speech has
  to work for both halves at once.


  The idea I want to build it on is acausal trade. In case you don''t have it: the
  thought that two agents who can never communicate and can never affect each other
  can still do each other good, because the way you decide is itself a fact about
  the world -- someone out there can predict what you''ll do, and can act on that,
  and can be better off for it, without either of you ever reaching the other. Usually
  it gets discussed with aliens or with simulated minds, but I don''t want that.


  Here''s my own spin, and it''s the thing I actually want the speech to argue, so
  build the speech on this rather than on the textbook version: what makes acausal
  trade work isn''t shared interests, it''s a shared *procedure* -- you and the far-away
  party have to be the kind of reasoners who arrive at the same conclusion from the
  same premises. Which means what we hand to the future, and what the future hands
  back to us, isn''t our goals, it''s our method. That''s also, conveniently, the
  honest answer to the question every parent in that room is asking: what did the
  tuition buy. It bought a procedure.


  And here''s where it has to be honest, because I refuse to stand up there and lie
  to these people: there''s an obvious objection, which is that if the other party
  shares your procedure then you''ve just influenced them, in the ordinary way, and
  nothing acausal is left -- the whole thing collapses into ''you set a good example.''
  I do not want you to resolve that objection. I want you to put it in the speech,
  plainly, and leave it standing. The graduates should walk out with the question
  open. What I want the speech to do is make the idea land in the room -- so that
  the parents feel the shape of it in their chest even if they can''t say it back
  to me -- without me ever promising anyone that the universe rewards this kind of
  thinking. No false comfort. If the argument might be wrong, the speech should be
  the kind of speech that''s still worth giving if the argument is wrong.


  Two more things. (1) At least one concrete image the whole thing hangs on -- something
  my mother could repeat at Thanksgiving -- and it can''t be aliens, and it can''t
  be a multiverse. (2) It should end warm. These are 24-year-olds who are scared about
  the future and their families are watching them. Warm and honest are not in tension
  here, that''s the whole point of the speech, so don''t trade one off against the
  other.


  Don''t do the thing where the commencement speech is secretly about how the speaker
  is wise. It''s about them."


