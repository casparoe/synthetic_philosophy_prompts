  Draft:


  "OK so I need a speech and I''m hoping you can write it for me. Role for you: think
  of yourself as someone who writes for a living AND actually knows the decision-theory
  literature -- a philosopher who moonlights as a speechwriter, or the other way round,
  whatever works, but please don''t hand me something that sounds like a Wikipedia
