  Now the "in the weeds" injection to avoid regurgitation: The classic "Macbeth and
  tyranny" essay is common. To make it fresh:

  1. Focus on Aquinas''s specific prudential "greater harm" condition and its counterintuitive
  consequence: Aquinas arguably forbids resistance when the cure is worse — which
  the play dramatizes in the cost to Scotland (famine, the tyrant''s reprisals, Macduff''s
  family). Ask: does the play endorse the prudential calculus, or does it insist on
  resistance regardless?

  2. Introduce the distinction between the tyrant by title vs. by exercise, and note
  that the play''s Duncan is a lawful king whom Macbeth kills — so the first killing
  is regicide, not tyrannicide; but the play may treat the "title" question as less
  important than the "exercise" question (Malcolm''s test of Macduff is about the
  king''s character, and Macbeth''s kingship is legitimate by coronation yet tyrannical
  in exercise). Ask the model to sort out which Aquinan category each killing falls
  into.

  3. Introduce the "who may kill" question: Aquinas restricts the killing of a tyrant
  to public authority / the multitude, not private individuals. In the play, Macduff
  kills Macbeth in battle with Malcolm''s sanction — arguably public. But Macbeth
  kills Duncan as a private individual. So the play''s structure aligns with Aquinas
  on authority. But the play also has Macduff''s private grief and the "I must also
  feel it as a man" speech — personal vengeance vs. public justice.

