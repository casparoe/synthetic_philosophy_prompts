  Two moves in the history of ideas get filed under the same label: the Darwinian
  inversion, in which competence — the fit of an organism to its world — is produced
  by a process that comprehends nothing about the fit it produces, so that comprehension,
  where it appears, is downstream of competence rather than its cause; and the Turing
  inversion, in which a procedure that looks like it requires someone to understand
  what the symbols mean turns out to be executable by steps so mechanical that no
  understanding is needed anywhere in the execution. The two are usually treated as
  the same species of move: in each, a homunculus is discharged by being replaced
  with stupider homunculi until the chain bottoms out in something that needs no comprehension
  at all.


