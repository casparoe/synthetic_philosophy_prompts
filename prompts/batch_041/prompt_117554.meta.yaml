  or will. But arbitrary is a normative term. It picks out power that is not authorized,
  or not constrained to track the interests of those subject to it. So what you are
  really offering is a criterion of legitimate authority, not a concept of liberty;
  and a criterion of legitimate authority is a claim about when the state may coerce
  me, not about how free I am. Which is it? If freedom is the absence of a certain
  modal fact, you are a negative libertarian with a good ear for the varieties of
  insecurity. If freedom is the absence of unauthorized power, then you have changed
  the subject, and the interesting question becomes whether your account of legitimacy
  is right — which is a question about authority, not about liberty at all."


