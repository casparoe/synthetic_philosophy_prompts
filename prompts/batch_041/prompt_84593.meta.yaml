  answers to get B''. Repeat. Finally we distill B'' into a smaller model D by supervised
  learning on B'' outputs. Assume H is perfectly honest and competent at decomposition
  and aggregation, but H''s oversight is limited: H only sees the final answer and
  the decomposition, not B''s internal reasoning. Does this scheme preserve alignment
  (B'' and D pursue the intended objective) and competence (B'' and D are as capable
  as the amplified system)? Explain why or why not, and identify any hidden assumptions."


