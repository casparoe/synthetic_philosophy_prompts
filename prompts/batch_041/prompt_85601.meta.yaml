  Draft:


  I am an undergraduate in a moral philosophy course, currently writing a paper on
  the separateness of persons objection to utilitarianism, and our seminar has been
  going in circles. The aggregative consequentialist says that the objection either
  collapses into a bare assertion that we may not aggregate or else begs the question
  against consequentialism; the restrictionist says that the consequentialist is treating
  persons as mere receptacles for value, and that this is not a side constraint but
  a condition on what counts as a moral reason at all. I want something more constructive
  than another round of that exchange, so please draft the joint statement that a
  committed aggregative consequentialist and a committed separateness-of-persons restrictionist
  could both sign after a good-faith adversarial collaboration. I want the claims
  they agree on -- about the structure of the moral problem, about what the objection
  is not, about the distinction between persons as separate loci of experience and
  persons as separate loci of claims, and about which cases both agree are not decisive.
  I also want the precise formulations of their disagreement, each phrased so its
  own side would accept the wording. Then the cruxes: the sub-questions such that
  settling them would move at least one side. For each crux, give a case or argument
  both would accept as bearing on it, and write down each side''s prediction.


  In particular, I want you to use a distinction from our handout that I had not seen
  before: between separateness as a metaphysical fact (persons are distinct subjects
  of experience) and separateness as a normative constraint (that distinctness forbids
  certain kinds of aggregation). The question I care most about is whether the second
  follows from the first, and if so under what description of the trade-off. Please
  also separate two further questions: whether interpersonal aggregation can be part
  of a decision procedure, and whether it can be part of the criterion of rightness.
  And please consider a case we invented in class, ''the Divided Ventilator'': one
  ventilator can either be used to save one patient for a full recovery, or split
  in a way that saves two patients but leaves both with a serious impairment; no one
