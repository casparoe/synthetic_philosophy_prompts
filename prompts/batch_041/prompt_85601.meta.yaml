  At the end, say how confident you are in the joint statement you have drafted, and
  single out the point you are least sure about -- whether it is a claim of agreement
  or a formulation of disagreement. Please write in British English, and end with
  a final line in the form \answer{...} enclosing a short phrase naming the crux you
