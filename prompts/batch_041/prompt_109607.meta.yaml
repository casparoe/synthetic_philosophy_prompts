  bring or form—for example, that Darwinian means purely genetic and Skinnerian means
  purely learned, that Popperian requires language or consciousness, that Gregorian
  is just another name for tool use or culture, that the four kinds are mutually exclusive
  stages a single organism passes through, or that later kinds replace earlier ones—and
