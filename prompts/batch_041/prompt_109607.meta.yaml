  Potential prompt:


  I am designing a seventy-five-minute session for a mixed reading group—half humanities
  graduate students, half engineers—on the four kinds of minds commonly distinguished
  as Darwinian, Skinnerian, Popperian, and Gregorian creatures. They know a little
  about evolution and reinforcement learning, but they have never encountered this
  taxonomy, and they will arrive assuming it is a ladder of intelligence running from
  instinct to culture. I do not want you to explain the four kinds to me; I want a
  teaching plan for how I should explain them. Give me the order in which the components
  must be introduced so that each next distinction feels forced rather than merely
  listed: what has to be in place before the difference between a Skinnerian and a
  Popperian creature can be understood, what has to be in place before the Gregorian
  idea makes sense, and where the whole sequence would break if I reversed two steps.
  Then choose the one carrying example that should run through the entire session—not
  four separate illustrations—and tell me what that example must contain and what
  it must lack at each stage. I am tempted by a foraging animal that learns by trial
  and error and then by a human using a calculator, but I suspect the example needs
  to be more carefully chosen; tell me whether either works or what would work better.


