  (2) To be truly morally responsible for what you do, you must be truly responsible
  for the way you are — at least in certain crucial mental respects.

  (3) But you cannot be truly responsible for the way you are, so you cannot be truly
  morally responsible for what you do.


  The regress: to be truly responsible for the way you are, you must have chosen it,
  but choosing is an action that flows from the way you already are, so you''d need
  to be responsible for that prior way, ad infinitum; alternatively, you''d have to
  be causa sui, self-created, which is impossible. Strawson says even an infinite
  regress doesn''t help; the buck has to stop somewhere and it can''t. He holds it''s
  a "conceptual truth" that nothing can be causa sui. He accepts the conclusion and
  calls himself a "pessimist" (in the free will debate sense), and endorses the "objective
  attitude" (Strawson''s own, echoing P.F. Strawson — his father — but radicalizing
  it).


