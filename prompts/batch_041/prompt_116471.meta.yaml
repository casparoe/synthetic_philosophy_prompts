  The DSM declassification of homosexuality (1973-1987) is a well-known episode. Naturalism
  vs normativism: Boorse''s biostatistical theory (BST) — disease as deviation from
  species-typical functional design, value-free; normativists like Sedgwick, Engelhardt,
  or more recently, critics who say disorder concepts are value-laden. Also Wakefield''s
  harmful dysfunction analysis (HDA) as a hybrid. I can mention these positions without
  citations. I should be careful with dates/attributions: I know Boorse''s "Health
  as a Theoretical Concept" is 1977 (Philosophy of Science); his BST developed in
  a series of papers in the 1970s-90s. Wakefield''s harmful dysfunction paper is 1992
  in American Psychologist. I can avoid leaning heavily on dates. I''ll mention them
  as positions rather than attributing exact dates.


  The episode: 1973 APA Board of Trustees vote to remove homosexuality from DSM-II,
  replaced by "sexual orientation disturbance"; then a referendum of membership (1974)
  ratified it; DSM-III (1980) reintroduced "ego-dystonic homosexuality"; removed in
  DSM-III-R (1987). That''s all common knowledge and confirmed by the fetch. Also
  the concept of "sexual orientation disturbance" applied to people distressed by
  their orientation or wishing to change it. Also Spitzer''s role as chair of the
  DSM-III task force and drafter of the original proposal.


  I want to make the prompt in the weeds: ask the model to do a disciplined mapping
  and to test both naturalism and normativism. Key philosophical substance:


  - Under a strict Boorsean BST, the question is whether same-sex attraction constitutes
  a dysfunction — i.e., an inability of some internal mechanism to perform its species-typical
  function. If one takes the evolutionary/biological account, same-sex attraction
  would be a deviation from species-typical reproductive function, which would seem
  to support pathology; but BST''s "species-typical" is statistical within a reference
  class, and if same-sex attraction occurs at non-trivial frequency and is not caused
  by an identifiable lesion, the BST may classify it as a normal variant. So the episode
  tests whether BST''s notion of "species design" is robust or whether it can be gerrymandered
  by choosing the reference class (e.g., "the species" vs "the individual''s sexual
  orientation").

  - Under normativism, removal was straightforwardly a revaluation: the harm/distress
  was reattributed to social stigma rather than to the orientation, so the disorder
  concept tracked disvalue, not biology.

  - Hybrid: Wakefield''s HDA says disorder = harmful dysfunction. The interesting
  move: the 1973 compromise ("sexual orientation disturbance") is almost a perfect
  HDA-style diagnosis — it requires both a dysfunction (?) and harm (distress). Actually
  the "disturbance" category doesn''t require dysfunction; it requires distress. So
  it''s pure harm without dysfunction. The 1980 "ego-dystonic homosexuality" shift
  — from distress about being homosexual to distress about not being heterosexual
  — is a subtle change in the harm specification. This is a great in-the-weeds point:
  the DSM-III criteria require (A) absent/weak heterosexual arousal interfering with
  wanted heterosexual relationships and (B) unwanted homosexual arousal. That makes
  the disorder about a failure to achieve heterosexual functioning — i.e., it reintroduces
  a dysfunction-like element, a failure of a mechanism to perform its "wanted" function.
  This is a lovely test case: the 1980 category looks like a hybrid (harm + dysfunction),
  while the 1973 category looks normativist (harm only), and the 1987 removal looks
  like a rejection of the dysfunction claim as scientifically unfounded.

  - Also: the naturalist can say the removal was an empirical correction (the science
  showed no dysfunction), the normativist can say it was a moral/political revaluation
  dressed up as science, and the hybrid can say it was a correction of the harm component
  (distress caused by stigma, not by the condition). The episode tests whether the
  distinction between the two components is stable.

  - Further in-the-weeds: the role of "dysfunction" in BST requires a reference class
  and a notion of "species-typical" — but for a trait that is partly socially constituted
  (sexual orientation as an identity vs. a behaviour), the reference class is unclear.
  Also the "design" of sexual arousal mechanisms: if the function is reproduction,
  same-sex attraction is dysfunctional; if the function includes pair-bonding, it
  may not be. This shows BST''s dependence on an unstated teleology.

  - Also, the "harm" component: whose harm? The distress of the individual, or the
  disapproval of society? The 1973 compromise treated the individual''s distress as
  the harm; but if the distress is caused by social stigma, then the disorder is iatrogenic/social.
  This is a classic normativist point (cf. Sedgwick''s argument that the illness is
  the social reaction). But one can also read it as a naturalist point: the dysfunction
  is in society, not the individual. The prompt should ask the model to work out which
  reading is more defensible.

  - Also, the referendum: the fact that the decision was made by a vote of the membership,
  then later reversed via the task force, raises the question of whether the naturalist
  can allow that a scientific classification be settled by a plebiscite. If disease
  is a value-free biological fact, a vote is irrelevant; if it is normative, a vote
  is a legitimate procedure. So the episode is a natural experiment on the metaphysics
  of disease. This is a nice angle.

  - Also, the "ego-dystonic" category''s later removal in 1987 was driven by evidence
  that the distress is a developmental phase rather than a dysfunction — again, an
  empirical claim. And the ICD kept a similar category until recently; that comparison
  is available.


