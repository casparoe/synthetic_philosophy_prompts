  perceive both sight and its object, viz. colour: so that either (1) there will be
  two senses both percipient of the same sensible object, or (2) the sense must be
  percipient of itself." Aristotle then says that even if the sense perceiving sight
  were different from sight, we would either fall into an infinite regress or have
