  "I''m putting together a session for a graduate political theory seminar on the
  theme of idealised consent, and I want to stage a confrontation between John Stuart
  Mill and a proposal from the contemporary AI-alignment literature known as coherent
  extrapolated volition. As I understand it — and I want the session to work even
  for students who have never read the alignment literature — the proposal says that
  if we ever build a very powerful artificial agent, we should not programme it to
  satisfy our present preferences, since those are ignorant and parochial, but rather
  to satisfy the preferences we would have if we knew everything relevant, reasoned
  much faster, were more the people we would like to be, and had been raised together
  as a single community; the resulting preference set is then to be made coherent,
  i.e., cleaned up until it is internally consistent, and the agent is to pursue that.
  A colleague of mine says this is just Mill''s competent judges with a computer attached:
  the same move of deferring to a purified version of people''s actual wants, the
  same faith that the purified wants would vindicate individuality and self-development.
  I''m not sure she''s right, and I''d like a reconstruction of what Mill — transported
  to the present and given a fair summary of the proposal — would actually have made
  of it as a specification of what a powerful institution should aim at."


