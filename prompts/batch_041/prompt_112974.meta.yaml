  The idea: Suppose the universe is large — there are many agents (other civilizations,
  other copies, other reasoners) who are in situations relevantly similar to yours,
  and with whom you cannot causally interact (no signals reach them, no signals reach
  you). Standard causal decision theory says you should ignore them: your action doesn''t
  affect them. But evidential decision theory (and related views) says your action
  is evidence about what they do — because they are reasoning like you, from similar
  evidence. If they are inclined to cooperate when you cooperate, then your cooperating
  raises the probability that they cooperate, and the good they do counts in favor
  of your action. So you can "cooperate" with them acausally. In a large world, the
  expected value of such cooperation can be enormous — the number of other agents
  is large, and the good they do is large. Hence "evidential cooperation in large
  worlds." The twist: it also seems to imply you should do weird things, e.g., cooperate
  with agents who would do bad things if you do, or that your choice of breakfast
  is evidence about aliens. This is the "too much" worry. Also, it depends on the
  assumption that the other agents reason like you, that there are many of them, and
  that the correlation is real.


