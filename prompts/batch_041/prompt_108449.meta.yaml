  I retired about four years ago after 35 years in control engineering (flight control,
  then a long stretch on software for medical devices), and since then I''ve been
  doing philosophy part-time, mostly ethics of technology. Next month I''m giving
  a talk at a two-day workshop on law and automated systems and I want to be ready
