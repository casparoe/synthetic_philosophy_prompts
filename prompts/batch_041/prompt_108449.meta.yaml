  autonomous systems isn''t a metaphysical hole, it''s an artifact of what I''ve started
  calling the single-operator assumption — the tacit idea that for a harm to be properly
  attributable, it has to land on one agent who could have done otherwise at the moment
  the harm happened. I want to argue that we should drop that and trace instead: every
  harm traces back to some role in the pipeline — the person who specified the objective,
  the one who chose and cleaned the training data, the one who deployed it, the operator
  on shift, the maintainer, the certifier — and each role carries its own obligations.
  For any harm, ask which role''s obligations went unmet and whether the role-holder
  had the information and the authority to meet them; if both, they''re answerable;
  if not, the unmet obligation belongs one rung up the ladder. (I also keep a three-way
  split: being the author of the harm, being the one who owes an explanation for it,
  and being the one who ends up paying for it — I think the gap literature collapses
  these and that''s most of the confusion.)


  The audience: it''s not philosophers, mostly. Two torts/insurance people who think
  everything reduces to who pays and whether it''s insurable, one moral-responsibility
  philosopher who works on the control condition and will not let go of it, a criminal
