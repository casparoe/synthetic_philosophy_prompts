  I am a student in a course on social choice and bargaining theory, and I have been
  thinking about a procedural rule used in some public-sector labor disputes. Under
  the rule, when negotiations over a new contract reach an impasse, an arbitrator
  must select one of the two final offers on the table, with no compromise or split-the-difference
