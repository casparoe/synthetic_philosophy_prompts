  that lies closer to the point at which each side''s gain from the agreement, measured
  against the status quo, is the same fraction of the maximum gain it could have obtained
  in the bargaining set. Arbitrators are forbidden to justify their awards by reference
  to either party''s bargaining power, ability to sustain a strike, or political leverage;
  they must instead speak in terms of comparability, internal equity, and the parties''
  legitimate expectations.


