  Let''s draft:


  I am a student in a course on bargaining and social choice. In final-offer arbitration,
  as used in baseball salary disputes and some public-sector labor disputes, the arbitrator
  must choose one of the two final offers submitted by the parties; splitting the
  difference is not allowed. Yet the chosen figure often lands near the midpoint of
  the two offers, and the parties seem to anticipate this by moderating their offers.
  I want to know what philosophical commitments this practice presupposes. Does it
  presuppose a particular solution to the bargaining problem -- for instance, that
  the fair outcome is the point at which each side''s gain relative to the status
  quo is the same proportion of its maximum possible gain, as in the Kalai-Smorodinsky
  solution -- or is that merely one rationalization among several? What does the no-split
  rule assume about the arbitrator''s role: is the arbitrator a finder of a focal
  point, a guardian of a fairness norm, or merely a forced chooser? Does the practice
  require interpersonal comparisons of utility, or can it be reconstructed with ordinal
  preferences alone? And is there a tension between the instruction to pick one offer
  and the apparent midpoint effect: if the midpoint is what the procedure reliably
  produces, does the practice presuppose that the midpoint is fair, or only that it
  is a predictable compromise? Reconstruct the implicit theory, distinguish what the
  practice strictly presupposes from what it merely fits well with, say which rival
  theories would also license it, and tell me what would have to change if the Kalai-Smorodinsky
  commitment were replaced by a Nash or egalitarian one.


