  Draft:


  ---


  I am putting together a one-page handout for the first meeting of a graduate seminar
  on Bayesian epistemology, and I want it to be a decision tree rather than a list
  of names. The topic is what an agent should do when the evidence she acquires does
  not leave her certain of any proposition — when her experience moves her credences
  in the cells of some partition without making any one of them 1.


  The tree should start from the one commitment every participant will already share:
  that experiences sometimes shift credences in a way that is not obviously conditionalization
  on a learned proposition, and that the agent''s new credences in the cells of the
  relevant partition are not 0 or 1. From there, each node must be a question that
  can be answered without knowing which position it leads to. I would like the branching
  to run through at least these distinctions, in whatever order makes them easiest
  to answer:


  - whether there is, after all, always a proposition the agent is certain of, so
  that the apparently uncertain case reduces to conditionalization on something (the
  experience itself, the fact that she has a certain subjective state, or some other
  proposition) — or whether the reduction is impossible, and the shift is genuinely
  not conditionalization on anything;

  - whether the agent''s new credences in the cells of the partition are themselves
  part of her evidence or part of her response to it;

  - whether the update is required to leave conditional credences within the cells
  untouched, and what happens if that requirement is dropped;

  - whether the final credences may depend on the order in which successive pieces
  of uncertain evidence arrive, and if they may not, what extra constraint rules that
  out;

  - whether the rule is supported by a coherence or bookmaking argument, is merely
  a sufficient condition for avoiding inconsistency, or is one option among several
  that an agent may rationally choose on non-evidential grounds;

  - whether probabilities must be sharp.


  Required leaves — the handout is useless if these are missing, so please make sure
  each appears somewhere and carries a name (or ''unnamed'' if you don''t think anyone
  defends it) plus one sentence on its most awkward commitment:


  1. the rule that leaves conditional credences in the cells of the partition fixed
  and forms the posterior as the weighted average;

  2. the reduction of the uncertain case to conditionalization on a proposition the
  agent is certain of;

  3. the view that the rule characterizes a family of admissible posteriors rather
  than picking one out;

  4. the view that choosing among those posteriors is a decision, so that the agent''s
  epistemic values or goals are doing the work;

  5. the repair of the rule that restores order-independence, with a note on what
  it costs;

  6. the set-valued or non-additive treatment of evidence, in which the posterior
  is a set of credence functions (or something weaker than a probability), rather
  than a single probability;

  7. the rejection of the whole framework, on the ground that ''uncertain evidence''
  is a contradiction and the puzzle is an artifact of describing experience in the
  wrong vocabulary.


  Four cases must do the diagnostic work, and each node should be answerable by reference
  to one of them: (a) looking at a fabric in poor light and coming away 0.7 confident
  that it is green; (b) two successive looks at the same dial, each of which shifts
  credences in the same partition by a different amount; (c) a fact you have believed
  with certainty for years and whose evidential bearing on a hypothesis changes only
  now, when the hypothesis is formulated; (d) a witness whose reliability you take
  to be less than 1 and about whose reliability you also have credences.


  Constraints: no node may mention a position by name; no leaf may be reached by two
  different routes unless you flag that the tree cannot separate those routes; where
  the combination of answers at a leaf is occupied by nobody, say so and say whether
  you think that is because the combination is incoherent, unattractive, or merely
  unexplored. Keep it to a single page, at most ten leaves. Do not include citations
  or a reading list.


