  After thirty-five years running an experimental physics group, I have spent the
  last six of my retirement reading metaphysics, and I have arrived at a position
  I did not expect to hold and cannot yet defend to anyone''s satisfaction. I have
  been invited to present it next month at the fortnightly metaphysics reading group
  of a mid-sized British university, and I would like you to prepare me for the questions.


  The position, briefly, is this. Both parties to the old dispute between endurantism
  and perdurantism assume that persistence is a matter of either numerical identity
  (one thing wholly present at every moment of its career) or parthood (a thing extended
  through time as a whole is extended through space, with distinct parts at distinct
  times). I want to argue that physics offers a third primitive, which neither side
  has room for: what is carried along a trajectory. What physics actually tracks through
