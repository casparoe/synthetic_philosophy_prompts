  Good''s theorem (I. J. Good, 1967, "On the principle of total evidence", British
  Journal for the Philosophy of Science): given a Bayesian decision maker, the expected
  utility of a decision made after observing new information is at least as great
  as the expected utility of a decision made without it, where the expectation is
  taken with respect to the prior over the information. More precisely, "the expected
  value of information is non-negative". Caveats: (i) it''s about *free* information
  (no cost); (ii) the expectation is ex ante, before seeing the content — ex post
  you can be worse off (you can get bad news); (iii) assumes the agent will act as
  an expected-utility maximizer with the same utility function and same prior updating
  (conditionalization); (iv) if the agent''s choice set is restricted — e.g., they
  must commit before the information arrives, or the information arrives only after
  they must act — then it can hurt. Also (v) if the information is not about the state
  of nature relevant to outcomes, or if the agent''s decision rule is non-Bayesian
  (e.g., a "non-Bayesian" or someone with a different update rule), it can hurt —
  Good notes "the value of information is non-negative for a Bayesian but can be negative
  for a non-Bayesian" (he actually proved it for a "non-Bayesian" too? Let me recall).
  Actually Good''s result: the expected value of information is non-negative, *provided*
  the person is a Bayesian or "the principle of total evidence" applies. Good showed
  that for a Bayesian, it''s non-negative; and he noted the result fails for non-Bayesians
  (e.g., someone who, upon receiving information, changes their decision rule). Hmm.
  I should be careful.


  Also there''s the "value of information can be negative if the agent''s preferences
  change upon receiving the information" — e.g., information can change your utility
  function, or you may be made worse off by having the information (bad news) — but
  the theorem is about *decision quality*, not welfare.


  Another classic subtlety: Good''s theorem concerns *expected* value with respect
  to the prior; it doesn''t say information always helps ex post, and it doesn''t
  say you should always seek it (cost, and also it can be harmful if you can''t act,
  or if your decision is already made). There''s also the "cognitive" version: information
  can hurt if it makes you more predictable to an adversary (signaling), or if the
  agent is subject to regret, or the "value of ignorance" arguments (e.g., in medical
  contexts, people who learn they have a genetic risk; in the "information avoidance"
  literature — Gigerenzer, and the "ostrich effect").


  So the false presupposition could be: "I''ve been reading about the idea that, mathematically,
  information can never make a decision worse — since the expected value of information
  is always non-negative — so anyone who declines a free test is just being irrational
  / making a mistake. Why do doctors let patients refuse?" The subtle confusion: the
  theorem gives non-negativity *in expectation before knowing the content* and *conditional
  on the agent continuing to maximize expected utility with the same utility function
  over the same outcome space, and being free to act on the information*. If the agent
  is not going to act on it (or has committed), or if the information itself changes
  the agent''s preferences/utility function (e.g., knowing you have the gene changes
  what you want — say, it changes your ranking of outcomes), or if the agent cares
  about the information itself (dread, anxiety — then the "information" isn''t just
  a means to decision quality; there''s a utility cost to knowing), then information
  can make you worse off. Also the ex-post point: you can get information that reveals
  the world is bad, which doesn''t make your decision worse but makes your life worse
  (the decision was already optimal). So "the value of information is non-negative"
  is about decision quality, not about wellbeing.


  Also, the false presupposition: "the theorem shows information never hurts" — actually
  it''s about *expected* value from the prior, and the theorem is about a decision
  problem where the same set of acts is available and the utility function is fixed.
  And there''s a subtlety: if the agent is not a Bayesian (e.g., uses a non-Bayesian
  rule or has a "wrong" prior), information can hurt — Good himself noted.


  Also another possible false presupposition: the theorem says *more* information
