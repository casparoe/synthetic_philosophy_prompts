  "timing" objection (the intervener intervenes at the moment of choice vs. before),
  or Frankfurt cases with "buffered" vs "unbuffered" alternatives. Also relevant:
  the "principle of alternate possibilities" is from Frankfurt''s 1969 paper "Alternate
  Possibilities and Moral Responsibility." Also relevant: the "dilemma" raised by
  Widerker and Katzoff about whether the intervener''s mechanism is deterministic
  or not; the "dilemma defense" (Kane, Widerker, Ginet): if determinism is true in
