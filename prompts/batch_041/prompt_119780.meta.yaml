  The idea: nearly everyone treats consent as doing one job, which is changing permissions
  — you consent, and something that was off-limits for the other person becomes permitted.
  I want to argue consent does two jobs that can come apart. First it changes permissions
  (the standard story). Second it changes reasons: it gives the other person a reason
