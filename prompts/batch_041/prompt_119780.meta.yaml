  have you read X." Tell me where the argument actually breaks. I''m especially worried
  about whether the permission/authorship split is doing real work or whether it''s
  just the voluntariness/information distinction with new labels, and whether the
  coercion case really comes out the way I say. Also tell me if this is actually a
  paper or just a distinction in search of one. And at the end, say how confident
  you are in the comments overall and which single point you''re least sure about
  — I''d rather know where you''re guessing than get a confident-sounding verdict.


