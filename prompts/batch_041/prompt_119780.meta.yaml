  So I''m in this seminar on applied ethics and we''ve spent the last two weeks on
  consent — mostly the usual stuff about deception and coercion in medicine and sex,
  the "mental state vs. performative" thing, whether coercion is a matter of threats
  vs. offers, etc. I''ve been kicking around my own angle for the final paper and
  I want to run the notes by you before I commit, because I think there''s something
  here but I keep going back and forth.


  The core idea: most accounts treat consent as doing one job, namely changing permissions
  — you consent, and now something that was impermissible for the other person becomes
  permissible. I want to argue that consent actually does two jobs that can come apart.
  First, it changes permissions (the standard story). Second, it changes *reasons*:
  it gives the other person a reason to act that is *yours*, that flows from your
  will rather than from their own interests or from some general duty. Call the first
  the permission function and the second the authorship function. Once you separate
  them, I think you get a cleaner diagnosis of the three classic defeaters. Deception,
  on my view, wrecks the permission function: you can''t waive a right you didn''t
  know you were waiving, so the act you actually did isn''t the act that got licensed
  — but it leaves authorship intact, since you really did put your will behind something.
  Coercion is the reverse: the permission may well survive (you did say yes, and saying
  yes under a threat isn''t automatically saying nothing), but authorship is gone,
  because the reason the other person is acting on isn''t properly yours — it''s theirs,
  dressed up as yours. And competence isn''t a third defeater at all; it''s the precondition
  for either function operating, which is why incompetent consent feels like it''s
  void in a different way than coerced consent does. The payoff I''m most excited
  about: this predicts that we should be more willing to treat coerced-but-informed
  consent as still doing *something* normatively (the person has a complaint, but
  the other party isn''t simply an offender in the way a deceiver is), and I think
  that matches intuitions about cases like agreeing to a bad plea deal or a exploitative
  but disclosed contract.


