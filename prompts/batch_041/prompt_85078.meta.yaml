  I have to decide whether it may be admitted into a scored instrument. The pressure
  is always the same: a sponsor wants the item in, a clinician wants to know what
  to do with the answers, and the patient community wants their experience recorded.
  The instruments have to be usable by research nurses with no philosophy training,
  and my methods committee signs off at the end of each quarter, so anything I adopt
  has to be something I can state as rules and defend in a meeting.


  Wittgenstein''s private language argument is the most serious thing I know of that
  bears on what we are doing, and I want it converted into something I can actually
  run. Build me a procedure: an ordered set of tests for deciding whether a term for
  an inner state is determinate enough to be scored in an instrument, with what counts
