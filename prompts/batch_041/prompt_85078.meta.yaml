  stops and returns ''this cannot be measured as proposed'', and where it stops and
  hands the decision to a person because the question is no longer about meaning.
  Keep the argument''s actual content — what fixes the meaning of a sensation term,
  what a purely private sample could and could not do, why a report can be perfectly
