  ---


  I lead instrument development at a clinical research group. We build and validate
  patient-reported outcome measures — questionnaires whose items ask people to report
  states only they have access to: pain, fatigue, breathlessness, tingling, mental
  clouding — and our items get used as endpoints in trials, which means a regulator
  will eventually decide whether a drug worked on the strength of numbers our instrument
  produced.


