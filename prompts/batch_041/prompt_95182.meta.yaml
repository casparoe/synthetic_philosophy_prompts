  \ — hence \"you should have pre-committed not to pay.\" Yes: XOR blackmail is a\
  \ case where ex ante you prefer to be a non-payer, but ex post you prefer to pay;\
  \ and the causal/evidential distinction: your \"decision now\" is evidence about\
  \ your disposition, which the blackmailer predicted.\n\nHmm, actually the standard\
  \ XOR blackmail setup (from \"XOR blackmail\" on LW, by... I think it's from the\
