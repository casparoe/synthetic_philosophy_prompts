  \ one: if the mere fact of disagreement discredited a domain, it would discredit\
  \ the very empirical psychology that establishes the disagreement (since psychologists\
  \ in different cultures disagree about methodology...). Hmm, this is the classic\
  \ \"debunking\" argument (Machery, Doris, Kelly & Stich \"Harm, affect, and the\
  \ moral/conventional distinction\"). This is well-trodden; a model could write a\
  \ decent answer from memory. Less in-the-weeds. Though we could add a twist: the\
  \ WEIRD finding that \"harm-based\" reasoning isn't universal, or that \"the moral/conventional\
  \ distinction\" fails cross-culturally — that's more niche. An argument: (1) The\
  \ moral/conventional distinction is a cultural artifact (it's found in WEIRD samples,\
  \ absent in some small-scale societies). (2) If a distinction is not universal,\
  \ it doesn't track a real feature of morality. (3) So the moral/conventional distinction\
  \ is not a real feature of morality. (4) But the same test, applied to the distinction\
  \ between \"is\" and \"ought\"... hmm, or applied to the distinction between \"\
  hurting someone\" and \"annoying them\"... This proves too much because it would\
  \ equally show that the distinction between (say) intentional and accidental harm,\
  \ or between convention and ... hmm. Not so crisp.\n\n4. Bernard Williams on opera\
  \ — a \"prove too much\" argument here is harder. Maybe an argument about the relation\
  \ between music and text, or about Wagner: (1) Opera is a form in which music and\
  \ drama are in tension. (2) If music can carry the drama, then the text is dispensable...\
  \ Williams had views about \"the truth of the drama\" and about how Wagner's music\
  \ can express something the words can't, and about the \"expressive\" content. Too\
  \ niche and I'd risk misattributing Williams's views. Skip.\n\nI'll go with counterfactual\
  \ mugging / XOR blackmail — it's the most naturally \"prove too much\" domain, and\
  \ I can inject a twist to make it non-regurgitatable. But careful: the prompt must\
