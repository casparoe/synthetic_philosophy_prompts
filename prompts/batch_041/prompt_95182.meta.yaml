  \ (4) A decision theory that predicts you will be a reliable income stream for extortionists\
  \ is defective. (5) So something is wrong with the counterfactual mugging reasoning\
  \ — but the same structure underlies... This gives a nice tension. But is it a *flaw*\
  \ to find, or a genuine dilemma? The prompt says either kind is fine; a good answer\
