  \ LLMs; XOR blackmail too. So the prompt would rest on memorized material — which\
  \ is fine as long as it's not \"super niche.\" Actually the goal is to be somewhat\
  \ in the weeds so models can't just regurgitate. Hmm, the counterfactual mugging\
  \ debate is heavily represented in training data (LessWrong, MIRI, papers). A prompt\
  \ that just asks \"is paying in XOR blackmail rational?\" would be regurgitatable.\
  \ To avoid, add a novel element: e.g., a variant where the blackmailer's scheme\
