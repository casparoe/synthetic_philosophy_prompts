  \ as in counterfactual mugging. So the defender says: fine, pay. And the objection\
  \ is that this makes you exploitable in a way that has bad real-world consequences\
  \ (people will set up such schemes). Hmm — that's a \"proves too much\" in the sense\
  \ that the principle licenses paying actual blackmailers, which most find absurd,\
  \ and there's a genuine question whether the cases are really symmetric.\n\nActually,\
  \ there's a cleaner and more in-the-weeds \"proves too much\" for this domain: the\
  \ \"logical correlation\" argument for paying the mugger also implies you should\
  \ \"pay\" in Parfit's hitchhiker and, crucially, that you should be a \"Ulysses\"\
  \ who pre-commits to... Hmm.\n\nAlternatively, a cleaner structure: an argument\
