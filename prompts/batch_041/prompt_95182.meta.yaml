  Honestly, I recall a LessWrong post \"XOR blackmail\" that presents a case designed\
  \ to be structurally identical to counterfactual mugging but with the intuition\
  \ that you should *not* pay, to argue against updateless decision theory or against\
  \ the symmetry. The key: in counterfactual mugging, the \"mugger\" is Omega who\
  \ acts based on your decision in a counterfactual (the coin came up heads and you\
