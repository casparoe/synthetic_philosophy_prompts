  \ is conditional on your *decision in the tails world* — the same decision you're\
  \ making; in XOR blackmail, the blackmailer's action is based on prediction of the\
  \ *same* decision. So they seem symmetric, and the LW discussion concluded (or debated)\
  \ that either both pay or neither.\n\nSince I'm not certain of the exact canonical\
  \ formulation, I should write the prompt so it's self-contained: I set up the cases\
  \ myself in the prompt (which is what the type wants anyway — the asker lays out\
  \ the argument). That way I don't depend on getting the canonical details right,\
  \ and I don't need citations. Good.\n\nNow, the \"proves too much\" structure. Let\
