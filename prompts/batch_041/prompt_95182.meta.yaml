  \ want something crisper.\n\n2. Negative utilitarianism: the world-exploder argument.\
  \ Chain:\n(1) Suffering is bad; pleasure/positive goods are not intrinsically good,\
  \ or are lexically outweighed by suffering (suffering-focused ethics).\n(2) If a\
  \ being suffers, that's bad for it; if it never existed, no suffering; so bringing\
