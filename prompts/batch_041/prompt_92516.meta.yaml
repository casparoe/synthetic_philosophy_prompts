  Latin ''a'' without becoming Latin letters; ''b'' and ''d'' are reflections of one
  another and are plainly distinct letters; ''M'' and ''W'' are rotations of one another
  in most faces and are also distinct; and ''Q'' is ''O'' plus a tail that in some
  designs is little more than a flick of ink. So letter identity survives the loss
  of topology, of orientation, and of almost any feature you might want to name, while
  being defeated by changes that look trivial from the outside.


