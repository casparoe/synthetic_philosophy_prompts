  forces the two pressures apart. A research group at Indiana, working on computational
  models of analogy-making, once built a program that had to design an entire alphabet
  at once on a coarse grid, under two demands at the same time: every shape had to
  be recognisably the letter it stood for, and all twenty-six had to look as though
