  The absent-minded driver problem (Piccione & Rubinstein 1997) is a decision-theory
  puzzle where at each intersection you don''t know whether you''ve passed the first.
  The standard "mixed strategy" solution (with the paradox of the ex ante/ex post
  payoff, and the question whether the optimal strategy is a plan or a policy) is
  genuinely in the weeds. An in-class activity: participants walk through a corridor
  with decision points, not knowing which one they''re at, choosing "continue" or
  "exit" — payoffs written on cards. Then debrief on why the standard game-theoretic
  recommendation (randomize) conflicts with the "surely I should continue if I know
  I''m at the second intersection" intuition. Also mention that the problem is about
  the distinction between strategies as plans vs. acts, and about whether decision
  theory should be applied at the moment of action or ex ante.


