  are used to choose among policies that are supposed to achieve them. My protagonist
  is the first director of the Office of Decision Markets, a three-person agency that
  must triage every proposal that reaches the council and decide whether it goes to
  a market, to ordinary deliberation, or back to the department for more work. The
  office sees dozens of proposals a year, usually on a two-week clock, and its recommendations
  can be overridden by the mayor but only at a political cost. I want the novel to
  feel intellectually honest, so I need you to act as a political philosopher with
  a working knowledge of mechanism design and municipal governance, and to help me
  build the decision procedure the protagonist actually uses.


  Please think carefully before you write. Start by brainstorming the failure modes
  of futarchy-style governance at the scale of a city: manipulation, low liquidity,
  metric myopia, legitimacy problems, value disputes disguised as empirical ones,
  and anything else you judge important. Then turn the underlying principle -- that
  voters or their representatives should settle values while markets settle empirical
  questions about how to achieve them -- into a procedure a smart, overworked staffer
  could run on a proposal. The procedure should be a numbered sequence of questions
  or tests, in the order they should be asked, with clear decision rules, stop conditions,
  and explicit notes on which steps are judgment calls rather than mechanical checks.
