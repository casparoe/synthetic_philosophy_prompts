  The Löbian obstacle: An agent A (a formal system) wants to build successor A''.
  A uses the principle: if A proves "A'' is sound" (or "A'' only takes actions A approves
  of"), then A can trust A''. But to reason "if A proves φ then φ" (i.e., trust its
  own proofs), A would need to believe its own consistency, which by Gödel/Löb it
  can''t (unless inconsistent). Löb''s theorem: if A proves (□φ → φ) for all φ, i.e.,
  if A proves "if I prove φ then φ", then A proves φ for all φ — A is inconsistent
  (or proves everything). More precisely, Löb: if PA ⊢ □(□φ → φ) → □φ... The self-trust
  schema T: □φ → φ, if fully adopted, makes the system inconsistent (by Löb). So an
  agent can''t trust all its own conclusions. Hence it can''t trust its successor''s
  conclusions if the successor is "the same system."


  The "sequence of theories" idea: if A'' is a *different, stronger* theory, then
  A can trust A'' without needing to trust itself. E.g., A uses a stronger theory
  to verify A''. The tiling problem arises when you want each generation to be able
  to verify the next without an infinite ascent of strength — you want the trust to
  be "self-contained." There''s the "tiling" requirement: A0 trusts A1 trusts A2...
  with each Ai built by Ai-1, and each step preserving the trust relation, without
  needing external trust. The obstacle: no such tiling with the agent trusting its
  successor''s *proofs* directly.


