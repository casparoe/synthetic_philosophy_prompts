  I am designing a seminar on the paradoxes of deterrence and want to build it around
  Sidney Lumet''s Fail Safe (1964) rather than around the usual satire, because Lumet''s
  film takes the doctrine seriously enough to argue with it. The plot, briefly, so
  that we are talking about the same thing: a computer fault hands a bomber group
  orders to destroy Moscow; the recall fails, partly because the command system is
  engineered to reject fraudulent recalls and partly because the Soviets jam the frequencies;
  the president can neither call the aircraft back nor shoot them down in time; Moscow
  is destroyed; and the president then offers the Soviet premier a symmetrical loss
  — one American city, destroyed by an American crew — on the reasoning that equal
  suffering is the only condition under which the Soviets will forgo retaliation.


  I would like a reading of the film as an argument about deterrence, tested against
  the following claims, which I want treated as distinct rather than dissolved into
  a general gloom about mutual assured destruction.


  1. The credibility paradox. A threat deters only if the adversary believes it would
  be executed, and executing it is by hypothesis irrational; credibility therefore
  has to be purchased by committing yourself to what you would not choose.

  2. Brinkmanship. The usual purchase price is control: a threat becomes believable
  when its execution is partly removed from your hands and lodged in a deadline, a
  machine, a subordinate''s discretion, or a hair trigger. The slack that makes the
  threat credible is the same slack that makes catastrophe possible — competence and
  accident run on one mechanism.

  3. The always/never dilemma. A single force must always work when it should and
  never work when it should not, and every remedy for one horn aggravates the other.
  Fail Safe dramatizes the second horn with unusual precision: the safeguards that
  make an accidental launch impossible are what make a legitimate recall impossible.

  4. The non-event problem. Successful deterrence leaves no evidence, so it cannot
  be distinguished from luck or from the adversary''s independent restraint, and the
