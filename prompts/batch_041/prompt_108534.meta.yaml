  Framework injection: three paradoxes:

  1. Credibility: only an irrational threat deters, but only a rational threatener
  can be deterred — so deterrence requires being committed to what you would not do.

  2. The non-event: the success of deterrence is invisible and indistinguishable from
  luck, so no evidence can settle whether it works.

  3. The brink: credible threats must be probabilistic (leaving something to chance),
  but the very slack that makes them credible is what makes catastrophe possible —
  competence and accident share a mechanism.


  Then the "always/never dilemma": a deterrent force must always be able to launch
  (or the threat is hollow) and never launch accidentally (or the threat destroys
  you). Every solution to one horn worsens the other: automate → risk of accident;
  humanize → risk of hesitation. So deterrence is a problem with no stable solution,
  only a moving trade-off.


