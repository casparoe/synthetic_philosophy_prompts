  against the following apparatus, which I would like you to treat as a set of distinct
  claims rather than a single blur of MAD-is-mad:


  (1) The credibility paradox: a threat deters only if the adversary believes you
  would execute it, and executing it is by hypothesis irrational, so credibility has
  to be bought by committing yourself to what you would not choose.

  (2) Brinkmanship, or the threat that leaves something to chance: the purchase price
  is usually control — you make the threat credible by attaching it to a process you
  do not fully govern (a deadline, a machine, a subordinate''s discretion, a hair
  trigger). The slack that makes the threat believable is the same slack that makes
  catastrophe possible.

  (3) The always/never dilemma: one force must always work when it should and never
  work when it should not; every fix to one horn worsens the other. Fail Safe dramatizes
  the second horn with unusual precision — the safeguards that make an accidental
  launch impossible are what make a legitimate recall impossible.

  (4) The non-event problem: successful deterrence produces no evidence, so it cannot
  be distinguished from luck or from the adversary''s independent restraint, and the
  practice is in principle unfalsifiable.

  (5) What I take to be the film''s own contribution, which none of the four above
  contains: the problem is not threat credibility but testimony credibility. The president
  is not trying to convince the premier that he would do something; he is trying to
  convince him of a fact about his own intentions — that the strike was not intended
  — and the only currency in which such a claim can be paid is an act that could not
  be mistaken for anything else. Call it the proof-of-innocence problem: to establish
  that you did not mean the harm you caused, you must inflict a harm you unmistakably
  do mean.


