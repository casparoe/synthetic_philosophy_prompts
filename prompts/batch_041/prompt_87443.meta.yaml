  non-naturalism; many think it''s a proof that "good" is not synonymous with a natural
  predicate, which is compatible with naturalism about the property (synthetic naturalism,
  e.g., Cornell realism). Also the argument presupposes a descriptivist view of meaning
  that many reject (expressivists, and later critics).

