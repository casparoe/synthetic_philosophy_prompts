  That has multiple subtle errors:

  1. Hume''s gap: about deduction from is-premises; not that facts can''t "support"
  moral conclusions (abduction, reflective equilibrium, inference to the best explanation).
  Also the textual question of what Hume meant; also Hume''s own view that reason
  is the slave of the passions, which is not the same as the logical gap.

  2. Conflating Hume''s gap with Moore''s open-question argument — different claims:
  one is about entailment/derivation (logical), the other about definability/synonymy
  (semantic/metaphysical). Moore''s argument doesn''t establish the is-ought gap;
  it''s about the indefinability of "good."

  3. Moore''s target is naturalistic definitions of good; the everyday "appeal to
  nature" fallacy is a different thing (that you can''t infer value from what''s natural),
  and Moore''s own view is not that "unnatural = bad" is the fallacy — actually Moore''s
  "naturalistic fallacy" name is itself contested (Frankena noted the label is misleading:
  Moore is objecting to a definitional move, not to naturalism per se).

