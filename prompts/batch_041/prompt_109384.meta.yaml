  I teach a seminar that puts Buddhist philosophy of mind alongside contemporary work
  on personal identity, and I want to build a session around Christopher Nolan''s
  Memento. Please give me a philosophical reading of the film through the doctrine
  of anattā: what the film shows about no-self, what it complicates, and where it
  cheats.


  To keep the reading honest, engage at least these three points, and say where the
  film comes down on each.


  First, the doctrine itself is contested in a way the film''s premise speaks to.
  Some readings treat anattā as a straightforward metaphysical denial that any self
  exists; others treat it as a soteriological strategy — a way of disidentifying from
  the aggregates, with the "person" surviving as a conventional designation (the two-truths
  framework: conventional versus ultimate). Leonard Shelby, who outsources his identity
  to tattoos, Polaroids, and written instructions, is a test case. Is he a bundle
  theorist in practice, or does he show that a constructed self is not an illusion
  but an achievement? Does the film take a side?


  Second, there is a Buddhist position the tradition largely rejected: the Pudgalavāda
  claim that the person is neither identical with nor distinct from the aggregates,
  and is what carries karmic continuity, memory, and rebirth. A film whose protagonist
  is continuous through external records and discontinuous in memory is a natural
  thought experiment for that third option. Say whether Memento dramatizes the pudgala
  or refutes it.


  Third, responsibility without a self. Leonard writes notes to his future self, and
  at the end it becomes clear he has arranged his own evidence. If there is no self,
  who is betrayed? Does the film make the Buddhist problem vivid (karma and accountability
  without a bearer), or does it rely on the audience''s own sense of Leonard as one
  continuing agent — the very thing the doctrine denies — to make its ending land?


  Conclude with a definite verdict: does the film vindicate the anattā reading, resist
  it, or illustrate only its preliminaries? And say what the film contributes to the
  debate that Parfit-style argument does not — what it shows about what it is like
  to be a self made of records, and whether the conventional self turns out to be
  something we cannot do without. Don''t hedge; pick a reading and defend it, and
  be explicit about the scenes you are reading that way, given that the film''s scenes
  are common knowledge but I''d rather have your reasoning than a summary.


