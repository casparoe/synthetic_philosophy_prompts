  I teach decision theory and formal epistemology in a philosophy department, and
  for the past two years I have been the outside member of the risk and planning committee
  of a mid-sized humanitarian organization that runs an anticipatory-action program:
  when forecasters project a drought, flood, or disease surge, the committee decides
  in advance whether to release funds and pre-position supplies before the crisis
  is confirmed, rather than waiting for confirmation and responding afterwards. The
  committee meets quarterly, disposes of roughly two million dollars a decision, and
  its members — a finance officer, a program officer, a monitoring officer, and a
  country director who signs off — have no training in decision theory; I am the only
  person in the room who can do the arithmetic. The decisions are genuinely uncertain
  and genuinely rankable: releasing early buys a modest but reliable benefit for a
  fixed caseload, waiting buys a larger response if the window stays open and nothing
  if it closes, and hybrid plans buy something in between with a chance of a great
  deal or a chance of very little. What I want to give them is a procedure they can
  actually run in a two-hour meeting with a spreadsheet, built on the theory I work
  on — Lara Buchak''s risk-weighted expected utility, the rank-dependent decision
  theory on which an outcome''s weight in a gamble can depend on where it ranks, and
  which reduces to ordinary expected utility when the risk function is linear. Their
  intuitive practice already looks like this theory in the wild: they sometimes refuse
  a gamble with a better expected outcome because of where the bad case sits, and
  they sometimes take one for the same reason, and I would rather they do it deliberately
  than by instinct.


  Please write that procedure. I need the steps in order, what counts as a sufficient
  answer at each step, the points where the procedure stops with a no, and the points
  where it must hand the decision to a person because the question is one of values
  rather than arithmetic; the deliverable should include a one-page worksheet the
  program officer can fill in. Two constraints matter to me more than convenience.
  First, the procedure has to elicit the committee''s risk attitude without assuming
  expected utility in the process — if the elicitation asks them to compare gambles
  in a way that only makes sense for an expected utility maximizer, we have gone in
  a circle, and I want the procedure to say honestly how much of the risk function
  is measured, how much is stipulated by the country director, and how much is a judgment
  call dressed up as measurement. Second, the forecasters give probabilities as ranges
  and sometimes as little more than a ranking of scenarios, so the procedure must
  say what to do when the numbers are soft rather than quietly plugging in a midpoint.
  Then run the procedure on three cases: a plan that trades a guaranteed modest response
  for a small chance of a much larger one; a plan whose worst case is catastrophic
  in the way that worries the committee most, but whose expected reach is the highest
  of the options; and a case where the forecast is so unreliable that the procedure
  should refuse to choose. I expect the second case to be the one where the procedure
  tells the committee something it will not want to hear, and I would like you to
  say so plainly rather than softening it.


  Finally, be careful to separate what is settled from what is genuinely contested
  among people who work on this. It is contested whether risk-weighted expected utility
  is a real rival to expected utility or a reformulation of it, whether risk attitudes
  can be elicited stably from anyone, and whether a committee can have a risk function
  at all rather than merely a procedure for aggregating individual ones; and I do
  not want any of that presented as settled, nor the theory''s own machinery treated
  as though the reader already knows it. Write for a reader who has never seen the
  theory, name the places where the procedure will misfire, and tell me what the procedure
  cannot do at all — including, I suspect, anything about the people who bear the
  risk but do not sit on the committee.


