  Now, does that land the standard objections? The standard objections to the dogmatism
  paradox:

  - The paradox is self-undermining: the reasoning requires you to be certain that
  you know, which you typically aren''t; "knowing that you know" is a stronger condition.

  - Harman''s point: the paradox is a "contraption" that would let a person keep any
  belief, including ones formed by prejudice; the "get-out-of-jail-free" nature.

  - Sorensen''s point: it doesn''t show you should disregard evidence, only that you
  may; and the "junk knowledge" phenomenon — knowledge that is inert.

  - The asymmetry: if it works for you, it works for your opponent; so the paradox
  converts disagreement into stalemate rather than into a right to ignore.

  - Also: the practical point that you can''t tell which beliefs are knowledge, so
  the policy is unusable; and there''s the "epistemic akrasia" angle.


