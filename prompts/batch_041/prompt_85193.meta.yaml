  Let me think about which yields the richest content. The dogmatism paradox: the
  key moves:

  1. If you know P, then any evidence against P is misleading (since knowledge excludes
  falsehood).

  2. Knowing that the evidence is misleading, you''re rational to disregard it — indeed
  you may be rational to disregard evidence against P *in advance* of seeing it.

  3. The "dogmatist" can therefore retain any belief he has that counts as knowledge.

  4. The problem: (a) it''s self-undermining if you''re not sure you know; (b) the
  paradox threatens the connection between knowledge and rational response to evidence;
  (c) if it applies, it applies symmetrically to anyone with a conflicting "knowledge",
  so it licenses stalemate (Harman''s point about the paradox: the "get-out-of-jail-free"
  card problem; also Sorensen''s work on "The Dogmatism Paradox" — actually Sorensen''s
