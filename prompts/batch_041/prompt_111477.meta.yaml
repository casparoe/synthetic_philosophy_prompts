  seems hugely confirmed by it; (4) the dilemma: either P(E) = 1 (no confirmation)
  or you must have assigned P(E) < 1 to something you already knew, which looks like
  an incoherent credence (and note: P(E)<1 with knowledge isn''t strictly incoherent
  — it''s the "you should be certain of what you know" norm; the deeper point is that
  the *evidence* isn''t the thing being learned, so what is the Bayesian learning?);
  (5) the escape routes: what you learn is the entailment/connection (new information,
  so a new proposition); the counterfactual "what would my credence have been before
  I knew E" strategy and its cost (arbitrary/retro-fitted priors, and the objection
  that this makes the problem disappear by stipulation, and the "you can''t learn
  from E now" point); the "the problem is an artifact of idealization/logical omniscience"
