  Misconceptions and where to head them off:

  1. "P(E)=1 just means you''re certain; the fix is to be less certain" — head off
  right after conditionalization is introduced (before the case), by noting the norm
  that you should be certain of what you know / that "I already knew that" is exactly
  the state the problem is about; and by noting that making P(E)<1 doesn''t restore
  confirmation unless the credence is *independent of the theory*, which is the real
  bite.

  2. "The problem is about probability zero / dogmatic priors / Cromwell''s rule"
  — head off when the dilemma is stated: distinguish this from the new-theory problem.

  3. "This is just about the psychology of discovery, not justification" — head off
  when introducing the historical/logical distinction.

  4. "It''s the same as prediction vs accommodation" — head off at the end, when the
  accommodation issue is raised: they''re neighbours, not the same; one is about the
