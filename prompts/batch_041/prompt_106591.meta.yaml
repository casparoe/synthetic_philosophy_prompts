  The usual gloss: Each observer''s "now" is a 3D slice; the slices of different observers
  cut across each other. If we say the events in my present are real, and the events
  in your present are real, and reality is not relative (there''s one world), then
  any event that lies in anyone''s present is real simpliciter. Since every event
  lies in someone''s present (there''s always a frame where it''s simultaneous with
  some event in my present... actually with any given event), every event is real.
  The key step: the "present" of a distant observer, taken as real, includes events
  spacelike separated from me and even events that are in my past/future depending
  on frame. E.g., an observer moving relative to me, far away, whose present includes
  an event in my future (in the Andromeda paradox sense: an event on Andromeda that
  is in my future can be in your present).


