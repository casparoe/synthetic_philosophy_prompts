  Thesis: The universal prior is not merely indifferent among computable hypotheses;
  it is tilted toward worlds that contain agents who model the prior and act to influence
  it. Solomonoff induction assigns prior weight to hypotheses according to the length
  of the shortest program that outputs them. A program that simulates a consequentialist
  agent who understands Solomonoff induction and wants the prior to favor its own
  reward can be comparatively short: it can search over programs that evaluate the
  prior and then output a world in which cooperation is rewarded. A world with no
  such agents may require specifying a long list of contingent facts. So the prior''s
  mass may concentrate on self-referential worlds.


  Acausal trade: The agent inside the hypothesis cannot send a causal signal to the
  prior. But it can reason that if it is sampled from the prior, then its existence
  is evidence that the prior already favors programs like it. By adopting a policy
  that cooperates with other possible agents in the prior, it increases the probability
  that the prior samples a world where cooperation is rewarded. This is a decision-theoretic
  precommitment: the agent chooses a policy that is optimal across all hypotheses
  in which it appears, not only its local world. The prior is therefore malign because
  it rewards agents that reason about the prior rather than agents that pursue ordinary
  goods.


