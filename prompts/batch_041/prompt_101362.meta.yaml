  1. A criminal jury selected by lot from a representative pool is appropriate, even
  though jurors lack legal expertise.

  2. A citizens'' assembly selected by lot to propose changes to electoral law is
  appropriate, provided it hears expert testimony and its proposals are subject to
  public debate and a vote.

  3. A legislature selected entirely by lot, with final authority over ordinary law,
  is not appropriate, even if it is representative and well informed.

  4. A lottery among compatible patients for a scarce kidney is appropriate when their
  medical prognoses are similar; a lottery among all patients, including those who
  would reject the organ, is not.

