  Let me design something concrete and rich:


  Setup: You''re a legal theory professor. Final exam for a jurisprudence course.
  The question should be answerable in ~90 minutes.


  The twist: Give students a fictional jurisdiction ("the Republic of Valdoria" —
  or something less goofy, maybe just "a jurisdiction") that in 1994 adopted a constitutional
  amendment — call it Article 19 — reading something like: "Any statute, decree, or
  judicial decision that is manifestly incompatible with the elementary requirements
  of justice is void, and no official may enforce it." And also stipulate the amendment
  was passed with a standard procedure and has been applied by courts for decades.
  Then: a case — a statute that is formally valid (properly enacted by the legislature,
  within its enumerated competence, no procedural defect) but manifestly unjust, e.g.,
  a law stripping a disfavored minority of the ability to hold property or a law authorizing
  indefinite detention of a class of persons on administrative say-so. The court must
  decide validity. Under Article 19, they strike it. The question: does the existence
  of Article 19 show Fuller won, Hart won, or neither? What does each have to say?


  Required moves for the A answer:

  - The rule of recognition point: Hart can accommodate a moral criterion of validity
  explicitly written into the system''s ultimate rule; that''s "soft" or inclusive
  positivism. So the codification of a moral test does not vindicate the natural-law
  thesis that law''s validity necessarily depends on morality. Indeed it shows the
  dependency is contingent on the social practice.

  - The "separability" thesis is about the concept of law in general, not about any
  particular system''s criteria. Hart''s claim is that it''s not necessarily true
  that unjust law is not law; a system could be exactly as Valdoria''s is, and another
  could lack Article 19.

  - Fuller''s response: this misidentifies his thesis. Fuller''s claim isn''t primarily
  about a validity criterion; it''s about the inner morality of law — the eight principles
  of legality (generality, promulgation, prospectivity, clarity, consistency, possibility
  of compliance, stability, congruence between official action and declared rule).
  His claim: a system that systematically violates these fails to make law at all,
  because law is the enterprise of subjecting conduct to the governance of rules,
  and gross failure defeats that purpose. So the hypothetical statute, being perhaps
  clear, public, prospective, etc., might still be law by Fuller''s criteria — which
  is a surprising result: Fuller doesn''t straightforwardly deliver the verdict students
  expect. That''s the crux: students expect Fuller = "unjust law isn''t law." The
  A answer must notice that Fuller''s own criterion is procedural/formal (the inner
  morality), so a clear, public, prospective but substantively unjust statute can
  satisfy it. And Article 19''s "manifest injustice" test is a substantive criterion,
  which is not the same as Fuller''s inner morality. So Article 19 is actually closer
  to a Hartian rule of recognition that happens to include a moral criterion, or to
  a Radbruch-style substantive natural law, than to Fuller''s inner morality.

  - Another move: the "fidelity to law" / reciprocity point: Fuller''s inner morality
  imposes constraints on the lawgiver in exchange for the citizen''s fidelity. Article
  19 might be seen as an institutionalization of the reciprocity — but Fuller''s version
  of reciprocity is procedural, not substantive.

  - Another: the grudge informer case analogue — Hart''s point that the dilemma is
  real and shouldn''t be hidden by saying the Nazi law was not law; the honest positivist
  says "it was law but too evil to obey/apply," and then deals with the retroactivity
  problem openly. In Valdoria, Article 19 is prospective, which dissolves the retroactivity
  problem — this is a genuine gain Hart''s framework can explain: the positivist can
  say "you solved the problem the right way, by changing the rule of recognition prospectively
  rather than pretending the old statutes were never law." That''s a nice A-level
  move: the positivist gets to say the Valdorian solution vindicates the positivist''s
  advice.

  - The "no necessary connection" vs "no connection" distinction; the "penumbra" vs
  "core" isn''t really the issue; the issue is the criterion of validity.

  - Also possible: Dworkin-ish? Better keep to Hart/Fuller, maybe mention inclusive
  vs exclusive positivism as a way to place Article 19.

  - Also: the "one-way" claim — a legal system can have a moral validity criterion
  but that doesn''t mean law is necessarily moral; the direction of entailment matters.

  - A-level: distinguish three theses: (i) validity depends on morality in this system
  (contingent, true here); (ii) validity depends on morality in every system (necessary
  connection; false on Hart''s view, and Article 19 is not evidence for it); (iii)
  the inner morality of law is constitutive of law (Fuller). And say which the Article
  19 case bears on.


