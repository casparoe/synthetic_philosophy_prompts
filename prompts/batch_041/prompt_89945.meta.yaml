  motors just sat where the steam engine''s central shaft used to be, so productivity
  barely moved, and the payoff only came once factories were physically rebuilt around
  individually driven machines. That''s co-invention, and it took a generation. Does
  AI have a version of that? If the complementary redesign is the real bottleneck,
