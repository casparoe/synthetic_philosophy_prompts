  Let''s draft a formal prompt:


  "I am trying to work out a consistent position on the unity of the proposition,
  taking the Bradley-style regress as the central constraint. The regress, as I understand
  it, is this: if a proposition is a complex of constituents, and its unity is explained
  by a further relation that binds those constituents, then that relation must itself
  be bound to the constituents by a further relation, and so on. My current commitments
  are as follows:


  1. Propositions are structured entities; they have constituents and are not mere
  sets or mereological sums of those constituents.

  2. The unity of a proposition is not a further constituent. It is a mode of combination,
  which I will call the bond.

  3. The bond is thin: it is not an item in the domain of quantification, is not referable
  by a singular term, and has no independent identity. It is syncategorematic.

  4. The bond is nevertheless type-identical across all propositions: the same bond
  unifies the constituents in every proposition.

  5. Propositions are the primary bearers of truth and falsity. Truth is correspondence
  to facts.

  6. Facts are structured like the propositions that correspond to them, and they
  are unified by the same bond.

  7. Correspondence is a relation between a proposition and a fact, but it is not
  itself a constituent of either.

  8. Bradley''s regress is not vicious, because the bond is thin and therefore does
  not require a further bond to attach it to the constituents.

  9. In my semantic theory, I quantify over bonds and refer to them when I state the
  truth conditions of propositions. For example, I say that a proposition is true
  just in case the objects named by its constituents stand in the relation expressed
  by its predicate, where that standing-in is the bond.


