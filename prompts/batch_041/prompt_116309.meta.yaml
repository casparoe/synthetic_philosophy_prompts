  Private language argument commitments:

  1. Meaning is determined by use in a public practice.

  2. Sensation terms are not names of private objects; first-person present-tense
  sensation avowals are not descriptions.

  3. There can be no logically private language, i.e., a language whose words refer
  to what only the speaker can know.

  4. First-person authority about sensations is real: one cannot be mistaken about
  whether one is in pain (at least in the avowal sense).

  5. Phenomenal consciousness is real and has qualitative character.

  6. We can have private experiences that are not publicly observable.

  7. A subject could be surgically isolated from birth but could still have a language-like
  internal system.

  8. The meaning of a term is its rule of use; rule-following is normative and public.


  Tensions:

  - If meaning is public use, and first-person authority is non-descriptive, then
  how can I talk about my own sensations meaningfully? The apparent tension: private
  experiences vs. public meaning. Dissolves if avowals are expressive, not descriptive.

  - If rule-following is essentially public, then a solitary individual cannot follow
  rules. But if a subject is isolated from birth, can they have a private language?
  Tension with 7. This is genuine.

  - If first-person authority is real, and meaning is public, then there is an asymmetry.
  But if sensation terms get meaning from public criteria, then first-person authority
  seems mysterious. Genuine tension.

  - If phenomenal consciousness is real and private, but there can be no private language,
  then how do we refer to qualia? Tension.


