  Reading the Constitution Against Its Practice


  Douglass''s later position is often summarized as: take the text as written, and
  stop importing the intentions and habits of the men who wrote it. The Constitution
  never names slavery; it apportions representation by counting some persons as less
  than whole; it permits the importation of persons to continue until a fixed year;
  it requires that persons held to service who flee be returned. Read without the
  gloss of practice, Douglass held, none of this establishes slavery, and several
  clauses can be turned against it.


