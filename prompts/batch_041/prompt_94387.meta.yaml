  I work as a career counsellor, and I keep meeting a pattern I cannot name. A client
  has two offers that, after weeks of weighing, come out exactly equal on every dimension
  they care about: pay, location, colleagues, prospects, the lot. They say they cannot
  choose, because choosing one over the other would be arbitrary, and an arbitrary
  choice is irrational. But they also cannot stay undecided, because the offers expire
  and the delay is itself costly. What interests me is that they do not treat the
  tie as a reason to pick either; they treat it as a reason to keep looking for a
  difference, and when they find one, they immediately discount it as trivial. I know
  the old story about the donkey between two identical bales of hay, but that seems
  to be about paralysis leading to starvation, whereas my clients are not starving—they
  are stuck on whether an arbitrary choice can be rational. Is there an established
  concept for this exact configuration—choice under complete indifference, where the
  agent demands a reason and the absence of a reason becomes a reason to delay? How
  does it differ from cases of incommensurable values, where there is no common measure,
  and from mere indecisiveness? And what should I tell them: that they should just
  flip a coin, or that the demand for a reason is itself the problem? If my framing
  is confused—if two options cannot really be exactly equal, or if the question is
  not well-formed—please say so plainly rather than humouring me. Answer in British
  English.


