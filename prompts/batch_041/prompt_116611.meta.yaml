  is just another dimension,'' sometimes as ''relativity has shown that the present
  moment is not special,'' and sometimes in the flat-footed version I heard most recently,
  from a cosmologist on a panel about time and agency, who used it to close down a
  philosopher''s question about whether deliberation presupposes an open future —
  his implication being that since physics has already settled that the future is
  as real as the past, our sense of choosing among open possibilities is a leftover
  of folk psychology and nothing more. I want to write about that exchange, and I
  need the sentence taken apart rather than defended or debunked.


  So: lay out the distinct precise claims that ''the passage of time is an illusion''
  (and its relatives) could be making. I''d like a menu — from the nearly vacuous
  to the genuinely radical — with a verdict on each: which are trivial restatements
  of well-established physics, which are substantive and defensible, which are contentious,
  and which are straightforwardly false or confused. Somewhere in the list I expect
  to find: the claim that the laws are Lorentz-invariant and admit no privileged foliation;
  the claim that simultaneity is frame-relative and therefore ''now'' is indexical;
  the claim, made in the argument that runs from frame-relative simultaneity through
  the transitivity of what is real to the conclusion that all events exist equally,
  that past, present, and future are on a par; the eternalist metaphysical thesis
  itself; the claim that temporal passage is not a feature of fundamental reality;
  the claim that the experience of passage is a systematic illusion of some specific
  kind; and the claim that the whole dispute is verbal, or at least that the word
  ''real'' is being used in two ways in the same paragraph. For each, say what it
  would take to be true, and what it does and doesn''t entail.


