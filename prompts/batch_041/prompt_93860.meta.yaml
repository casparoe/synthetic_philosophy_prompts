  Rousseau''s anti-theater argument (Letter to d''Alembert, 1758): key elements I
  know well without needing quotes:

  - The theater is a "school of vice" more than virtue; it flatters rather than corrects;
  it can only please, and to please it must accommodate the audience''s existing inclinations.

  - Rousseau''s famous structural claim: spectacles are good for corrupt peoples and
  bad for virtuous ones — they reinforce whatever the audience already is; they cannot
  make a corrupt people good, and they can corrupt a good one. (I should paraphrase
  without quotation marks — safer, and I won''t quote.)

  - The actor''s profession: dissimulation, playing a character, exhibiting oneself
  for pay, self-alienation; the actor trades his own identity for applause, lives
  on the opinion of others.

  - Amour-propre vs amour de soi: theater feeds amour-propre, comparative vanity,
  the desire to be seen and admired rather than to be good.

  - The audience''s passivity: spectators consume emotion vicariously, discharge sympathy
  cheaply, and return home with virtue unexercised — a sort of moral hydraulic displacement
  (draining pity that might have been directed at real neighbors).

  - Theatrical emotion is disproportionate: staged suffering moves us more than real
  suffering because it''s framed, and the "virtue" we feel is sterile.

  - Particular critique of Molière: Le Misanthrope makes the honest man ridiculous
  and the misanthrope''s sincerity the butt of the joke; the audience laughs on the
  side of social hypocrisy. Also L''Avare, etc.

  - Rousseau''s alternative: civic festivals, open-air balls, public games, where
  the spectators are also participants — everyone is seen by everyone, and no one
  is a mere spectator; equality, transparency (no boxes, no hidden alcoves), each
  sees and is seen.

  - Geneva as small republic: luxury, inequality, big cities make theater; a small
  egalitarian city with real occupations and direct mutual visibility doesn''t need
  it and would be harmed by it.

  - Also: theater as a place where factions and inequality get expressed — the boxes
  arranged by rank, women on display, gallantry, idleness.

  - Also: the argument that the theater is a school of passion and vice for a corrupted
  people but can at most be harmless/useless for a good one; and Rousseau''s concession
  that tragedy can produce a fleeting pity but no lasting reform; and his claim that
  comedy is worse than tragedy because it teaches ridicule of virtue.

  - Also the economics: actors paid to please the crowd → dependence on opinion, and
  the crowd''s taste is the standard; theater cannot be a moral educator because the
  market forces it to flatter.

  - Also: he attacked the idea that Geneva needed a theater for the sake of commerce/polish;
  luxury → dependence → loss of freedom.


