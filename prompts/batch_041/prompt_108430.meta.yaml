  - a tautology reading, where "good measure" just means "a measure nobody has an
  incentive to distort," so the sentence is true by definition;

  - a regression reading, where the point is statistical and has nothing to do with
  incentives — that selecting on the top of a noisy measure drags you toward the mean;

  - a broken-ruler reading, where the measure is only ever an effect of the goal rather
  than a cause of it, so pushing on it leaves the goal where it was;

  - a moved-goalposts reading, where the meaning of the metric, or of the goal, shifts
  once people start arguing about it;

  - a price-of-signal reading, where the measure was informative only because nobody
  was optimizing it, and optimization makes it cheap to fake;

  - and a "not a law at all" reading, where the sentence names a loose family of mechanisms,
  some of which are inevitable and some of which depend on particular institutions.


