  I like this: it''s subtle (infinitism is a real position, and the confusion about
  what it requires is a real one), and it doesn''t require any facts. Good answer:
  (a) infinitism (Klein) doesn''t require a completed or held infinite chain — it
  requires that for any given belief there is a further reason available (the chain
  is "potentially" infinite, and justification is a matter of the availability of
  reasons, not actual belief tokens); (b) the regress argument is a trilemma only
  if you accept certain premises (e.g., that justification requires a linear, non-circular
  chain of reasons each of which is justified, and that the chain must terminate in
  something that is itself justified); alternatives include: rejecting the premise
  that a chain of reasons must be non-circular, or that justification is a matter
  of chains at all (holism), or externalism (justification without the subject''s
  access to reasons), or the "the regress is harmless" view (e.g., the requirement
  is a "contextual" one); (c) so the conclusion that nothing is justified doesn''t
  follow; (d) also note that skepticism is the fourth horn and the trilemma doesn''t
  force infinitism.


