  later he said he''d changed his mind and that natural selection is testable. Second,
  even the original charge only applies to a lazy formulation. A real selectionist
  claim is a claim about relative reproductive success given a specified heritable
  variation; that makes predictions — e.g., that a trait will spread under such-and-such
  conditions — and those predictions can fail. And the charge of unfalsifiability
  is old news: the theory was vindicated by predicting things like the existence of
  transitional forms, the nested hierarchy, or specific adaptations, and by ruling
  out Lamarckian inheritance.

  3. Ravi: (a) "He changed his mind" is not an argument; philosophers retract under
  social pressure. (b) If he only said it can be tested in the sense that some auxiliary
  claim can fail, that''s not enough — the core claim, that selection is the main
  driver of adaptation, is compatible with everything. Give me an observation that
  would make you say "natural selection is false." Not "this particular adaptation
  story is wrong" — the whole framework. And note that whatever you name, an auxiliaries
  move can save the core. (c) Predictions like "transitional forms exist" come from
  common ancestry + geology, not from selection. You''re crediting selection with
  the success of the whole Darwinian package.

  4. Marta: Two things. First, the testability of a theory doesn''t require a single
  observation that kills the bare core with no auxiliaries — on that standard Newtonian
  mechanics, or the existence of atoms, or quantum mechanics would be unfalsifiable
  too; you always test a whole package, which is Popper''s own point about the "empirical
  basis" and what Lakatos later called the hard core and protective belt. If the demand
  is "no auxiliaries may be adjusted," no theory is scientific. Second, there are
  candidate falsifiers for selectionism that aren''t just about the package: e.g.,
  if adaptation were rampant but heritable variation turned out not to matter to reproductive
  success, or if we found lots of complex functional structure that couldn''t be built
  up incrementally and had no other explanation, or (the classic one) if traits that
  reduce fitness were systematically the ones that spread. So the theory does forbid
  things.

  5. Ravi: Fine, but now your testability comes from "there exists no other explanation"
  and from an open-ended auxiliary — the "no other explanation" clause is exactly
  what makes it unfalsifiable in practice, because any anomaly can be handled by positing
  an unknown benefit or an unknown selective regime. And "traits that reduce fitness
  spread" — if that happened, the selectionist would just say the trait must really
  be increasing fitness in some unmeasured way, or that selection is currently outweighed
  by drift. The theory predicts that it will find a selection story, and when it doesn''t,
  it says the story is there but not yet found. That''s a research program, not a
  theory. Which is what Popper said. So I''d say Popper was right the first time,
  and the retraction is him caving.


