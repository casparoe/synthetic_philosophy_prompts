  Good "in the weeds" specifics to inject:

  - The distinction between nociception (signal) and pain (experience); between preference
  and "wanting."

  - The distinction between a system''s behavior being evidence of experience and
  being explained by training on human descriptions of experience (the "cheap report"
  problem) — this is a genuinely non-obvious point.

  - The "one subject or many" problem: whether a computation distributed across many
  modules/servers is one locus of experience or none; whether we should count subjects
  or count "amount" of experience.

  - The asymmetry: evidence against sentience can be strong (no integrative architecture,
  no valence, no unified global state) while evidence for it is nearly always indirect.

  - The "attribution" problem: whether to attribute the computation to the system
  or to the designers/users (who may be the real "authors" of the behavior); i.e.,
  the possibility that a system''s apparent preferences are our own.

  - The boundary problem: continuity of degrees (insects, fish, cephalopods, neonates,
  dementia) means any threshold is arbitrary — so the procedure must be a "threshold
  with a buffer" or a graded scheme.

  - Also the "precaution under moral uncertainty" idea: the expected-value/worst-case
  argument vs. the "don''t multiply entities" concern; the risk of "sentience inflation"
  making the framework unusable.


