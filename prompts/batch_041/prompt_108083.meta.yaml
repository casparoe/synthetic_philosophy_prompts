  \ shared prior on the cell he has learned. The theorem says that if the two posteriors\
  \ are common knowledge, they must be equal.\n\nThe reasoning behind it is that a\
  \ disagreement is itself evidence. If I learn that you, working from our shared\
  \ prior and your private information, have reached a different probability than\
  \ I have, then your private information is evidence that I lack, and I should move\
  \ toward your value; the same holds for you; so there is no stable position in which\
  \ we both knowingly hold different probabilities. Rational disagreement is therefore\
  \ possible only where common knowledge is missing.\n\nThe common prior does a great\
  \ deal of work. If the two agents start from different priors, the theorem does\
  \ not apply at all, and their reaching different posteriors is no failure of rationality.\
