  \ the second, the brain withholds the first experience from becoming conscious until\
  \ the second arrives and then constructs one already-consistent experience, so the\
  \ revision happens before the experience. Call them the post-hoc and the pre-emptive\
  \ readings. They fit the behavioral data equally well, and the same fork opens for\
  \ related phenomena — for instance, where a later stimulus appears to erase or alter\
  \ the experience of an earlier one.\n\nMy position is that the choice between the\
