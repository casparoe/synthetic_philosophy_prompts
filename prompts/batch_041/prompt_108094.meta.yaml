  undercuts the Roberts conclusion rather than supporting it: if operative meaning
  is what courts consistently do, then judges are making the rules in the relevant
  sense (they constitute the zone), and the "limited role" picture collapses. So the
  friend''s refinement is a reductio of the analogy rather than a rescue. That''s
  a nice payoff: the twist converts the modesty claim into an argument for the opposite
  conclusion.

  - Also: whether "the strike zone" is a natural kind or a stipulated conventional
  object — the zone is defined by a stipulation with a specifiable geometry, and its
  boundaries are arbitrary but precise; constitutional provisions have vague boundaries
  (cruel and unusual, equal protection) where the question isn''t "where exactly is
  the line" but "what is the line for". Different kind of indeterminacy: vagueness
  vs. essentially contested application.

