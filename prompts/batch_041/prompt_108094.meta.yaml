  Structure:

  - The asker sets up: a friend (or a colleague) leans on the umpire analogy, specifically
  a sharpened version.

  - Give the correspondence: judge = umpire; rulebook = Constitution; league = the
  people/amendment process; players = legislature/elected officials; fans = public.

  - The friend''s twist: the operative strike zone is what umpires consistently call,
  and pitchers and hitters calibrate to the de facto zone, not the book zone. So the
  "zone" is constituted by the practice of the officials, not discovered by them.
  He says constitutional meaning is the same: the operative content of a clause is
  the settled practice of courts; the text is a nominal boundary; there''s no fact
  of the matter that judges could "get wrong" and no sense in which they''re overriding
  the rulebook. Hence the counter-majoritarian worry dissolves: unelected judges aren''t
  overruling the legislature, they''re just constituting the zone the game is played
  in — as umpires always have.

  - The asker''s skepticism: something feels off; maybe the argument proves too much,
  or the analogy is doing the work.

  - Deliverables: mapping table; where the mapping breaks; which features of baseball
  are quietly imported and absent in the target (independent rule-maker who can amend
  and can fire/replace umpires; the possibility of measuring the zone, i.e., ABS presupposes
  a fact of the matter; the umpire''s calls don''t bind future games; no appeal; the
  umpire has no interpretive authority over the rulebook; the umpire''s decisions
  don''t nullify the players'' own agreed outcomes in the way judicial review nullifies
  legislation); whether the friend''s conclusion survives; whether the analogy actually
  cuts the other way; and what a better analogy would be.


