  a thousand particular data sets and gives, for each one, a very short program that
  prints it out. On those thousand data sets U* says "simple" where U says "hopelessly
  complex". U* isn''t a cheat — it''s as legitimate a universal machine as U is; it
  just pays for its hints by being a fixed number of bits worse everywhere else. And
  the trick cuts the other way too: for any finite batch of data at all, you can build
