  Let''s draft prompt:


  "I''m an undergraduate in a course on early modern philosophy and the history of
  economic thought, and I''ve been asked to do a first pass on a classmate''s exam
  answer. I''d like you to act as the instructor of record: an expert in Hume''s moral
  and political philosophy and in eighteenth-century economic thought. Please think
  carefully and, before you assign a grade, first sketch for yourself the main claims
  Hume makes about money, interest, and international trade, along with the most common
  ways students conflate them. Then assess the answer below against that sketch. I''m
  grading someone else''s work, so I don''t want a general impression; I want a grade
  and the specific comments that justify it, point by point. Do not require citations
  or page references—the student had no books and neither do you—and judge the answer
  on conceptual accuracy, not on whether it mentions particular essays by name.


  Exam question:

  Explain Hume''s account of how money and international trade work, and how that
  account supports his critique of mercantilism. In your answer, distinguish his views
  on (a) the relationship between money and prices, (b) the determinants of interest
  rates, and (c) the balance of trade. Then assess whether Hume''s position is best
  described as a defense of free trade, a theory of monetary neutrality, or both.


  Student''s answer:

  Hume''s central target is the mercantilist idea that a nation''s wealth consists
  in its stock of gold and silver and that exports should be maximized to accumulate
  treasure. Against this, Hume argues that money is not wealth; it is only a medium
  of exchange. If the quantity of money in a country increases, prices will rise proportionally
  in the long run, so an influx of gold leaves real wealth unchanged. This is his
  quantity theory. In the short run, however, Hume notices that new money can stimulate
  industry because prices do not adjust immediately; the additional money circulates
  before it raises prices, so merchants and manufacturers benefit. This is why he
  is not a crude neutralist about money.


  Hume also develops a self-correcting mechanism for trade imbalances. Suppose England
  has a trade surplus with France. Gold flows into England and out of France. English
  prices rise, French prices fall. English goods become less competitive, French goods
  more competitive, and the imbalance corrects itself. This price-specie-flow mechanism
  shows why mercantilist policies aimed at a permanent favorable balance of trade
  are self-defeating. Trade is not a zero-sum struggle for treasure; it is mutually
  beneficial, and a nation should not fear that its neighbors will prosper.


  On interest, Hume follows the quantity theory: when money is abundant, interest
  rates fall, because there is more money available to lend. He thus treats the rate
  of interest as a monetary phenomenon. This is consistent with his general view that
  money matters mainly through its effects on prices and credit. He also argues that
  low interest is a sign of a prosperous commercial society, since it reflects a large
  stock of loanable funds.


  Hume''s position is therefore best described as both a defense of free trade and
  a theory of monetary neutrality. He thinks that in the long run money is neutral,
  but he also recognizes short-run effects. His critique of mercantilism rests on
  the claim that real wealth comes from labor and commerce, not from hoarding gold.
  A good grade should recognize that he anticipates later classical economics while
  still being a thinker of his time.


  Please give a letter grade (A–F, with +/- if you like) and a paragraph or bulleted
  list for each of the three sub-questions (a), (b), (c), plus a short overall comment.
  In your comments, quote or paraphrase the student''s sentences where relevant, say
  what is right, what is wrong or imprecise, and how much each error should affect
  the grade. If the answer is mixed, don''t average away the mistakes: identify the
  one or two errors that a hasty grader would miss."


