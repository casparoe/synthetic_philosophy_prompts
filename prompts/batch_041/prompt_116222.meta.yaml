  a simulation." This is wrong: it''s a disjunction; it doesn''t establish (3) unless
  (1) and (2) are false. This is a classic subtle mistake. A hasty grader might let
  it slide.

  2. "If we are simulated, those future people are not real, so their welfare does
  not count." This is a substantive philosophical claim that doesn''t follow from
  the simulation argument. Even if simulated, they could be conscious and morally
  considerable. This is a subtle mistake.

  3. "the simulation might be shut down at any time... expected number of future beings
  is smaller." This doesn''t follow; if anything, simulation argument could imply
  many simulations, increasing expected number. Also, the far future could be inside
  or outside the simulation. This is a logical gap.

  4. "since simulated beings are not real, this is not as important" repeats the assumption.

  5. The student says the argument supports anti-fanaticism, but their reasoning is
  flawed. The conclusion might be true for other reasons, but the student''s argument
  doesn''t establish it.


