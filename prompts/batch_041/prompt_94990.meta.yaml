  \ a harm-based view of disorder.\n- The removal of homosexuality from DSM in 1973\
  \ (common knowledge), and the current debates about... \n- The practice of field\
  \ trials / the move from categorical to dimensional (HiTOP), the Research Domain\
  \ Criteria (RDoC) — presupposes something.\n- The practice of diagnosing children\
  \ with gender dysphoria and the \"desistance\" debate.\n- Prolonged grief disorder\
  \ added to DSM-5-TR (2022) — presupposes a view about the boundary between normal\
  \ grief and pathology, and about duration thresholds.\n- The DSM's \"bereavement\
  \ exclusion\" removal in DSM-5 — this is a nice concrete practice: DSM-IV excluded\
  \ major depression diagnosis for 2 months after bereavement; DSM-5 removed it. That\
  \ presupposes a view of whether depression is a distinct disorder vs. a normal reaction,\
  \ and about the role of context in diagnosis.\n\nHacking's looping effect: classification\
  \ changes the people classified; the classified respond to being classified, and\
  \ thereby the classification's validity changes. So the \"presupposition\" question:\
  \ does psychiatric classification presuppose that the classified are \"indifferent\
  \ kinds\" (natural kinds) whose behavior doesn't change when classified? The looping\
  \ effect challenges that. But I should be careful — Hacking's framework is well-known.\
  \ The instruction says the prompt should inject new/niche ideas so models can't\
  \ regurgitate. So I could inject a hypothetical: e.g., a new proposal to include\
  \ a diagnostic category, or a specific institutional practice.\n\nHmm, maybe better\
  \ to do the memo type with a fictional but plausible scenario, injecting novel specifics.\
  \ The memo type: an asker serving on a body must decide a concrete case. E.g., \"\
  I sit on the DSM-5-TR... \" — actually, better: I sit on the diagnostic criteria\
  \ review committee of a professional association (fictionalized to avoid claims\
  \ about real bodies). A proposal to add a new diagnosis or remove one. The memo\
  \ should engage the looping-effect worry: if we add the category, will it create\
  \ the phenomenon? Does the validity evidence gathered under the current classification\
  \ survive the reclassification?\n\nActually, a really nice concrete case: a proposal\
  \ to add a new diagnostic category for a pattern of behavior, say \"persistent social\
  \ withdrawal in adolescents following heavy online life\" — no, that's too invented.\
  \ Or the practice of adding \"with\" specifiers.\n\nAlternatively: The \"presuppositions\"\
  \ type with a concrete existing practice: the practice of including \"duration\"\
  \ criteria and \"clinically significant distress or impairment\" criteria in DSM\
  \ categories. Or the practice of field trials where a diagnosis's validity is established\
  \ by inter-rater reliability (kappa) rather than by any biological marker — this\
  \ presupposes a view of what makes a classification valid: that agreement among\
