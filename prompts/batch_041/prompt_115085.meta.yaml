  from it except that one is hot and moving and the other is cold and moving.

  - A swarm of bees in flight: one thing. My friend says this is the pile of sand
  all over again and I''m being sentimental about animals.

  - A coral reef: one thing. Same complaint from my friend.

  - The western half of my cat: not a thing.

  - A statue and the lump of bronze it''s cast from: I want to say there are two things
  there, and I can''t make that comfortable with anything else on this list.

  - The arrangement of furniture in my living room: not a thing, even though it''s
