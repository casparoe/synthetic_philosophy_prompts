  Let me actually think about what a good procedure would look like, so the prompt
  is well-aimed. The procedure (the answer''s job) might include:

  1. Is there a stable, compressible pattern? (Dennett''s "real pattern" criterion
  — a description that lets you predict more efficiently than the raw substrate.)

  2. Is the pattern intervenable? (Can you intervene at the pattern level and get
  systematic effects, i.e., is it a "causal" node?)

  3. Does the pattern do predictive work beyond the substrate? (Does the symbol-level
  description earn its keep?)

  4. Is the pattern robust across substrate realizations? (multiple realizability)

  5. Does the pattern have a function/role in a larger system?

  6. Where it''s a values call: whether to privilege the level that gives "understanding"
  vs "prediction."


  Cases:

  (a) A single neuron/unit whose firing reliably predicts a choice, and whose stimulation
  changes it → likely a real causal symbol (or a real pattern).

  (b) A distributed code where no single unit matters but the population does → the
  symbol is real at the population level; intervention at pattern level (e.g., decoding
  direction) works.

  (c) The annoying one: a "symbol" that predicts but can''t be intervened on and dissolves
  under closer look → redescription.


