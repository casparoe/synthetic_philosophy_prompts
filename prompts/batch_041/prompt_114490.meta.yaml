  **Title:** The Scale Argument and Two Kinds of Uncertainty


  Most arguments for caring about insect welfare are, at bottom, arithmetic. Nobody
  claims to know that a honeybee feels pain. The claim is rather that we should not
  need to know. Suppose there is some small probability — one in a hundred, one in
  ten thousand — that an insect''s nervous system supports experiences that matter
  morally. The number of insects alive at any moment exceeds the number of humans
  by many orders of magnitude, and the number of insects that live and die in a single
  season is larger still. Multiply a small probability by an enormous population and
  the product can exceed the entire expected welfare of the vertebrate world. Call
  this the scale argument.


  I want to argue that the scale argument equivocates between two kinds of uncertainty,
  and that once they are separated, the argument survives — but only in a form weaker
  than its proponents usually advertise.


  The first kind is distributional uncertainty. Here we take for granted that some
  insects are sentient and are uncertain only about which ones, or about what fraction
  of them. The uncertainty is like a coin flip applied to each individual: for any
  given ant, there is a chance it is a subject of experience and a chance it is not.
  Uncertainties of this kind aggregate cleanly across a population. If each of a trillion
  individuals has probability p of being sentient, the expected number of sentient
  individuals is exactly p times a trillion, and the expected moral stakes scale linearly
  with the size of the population. Numbers matter, and they matter proportionally.


  The second kind is categorical uncertainty. Here the question is not which insects
  are sentient but whether sentience is even the right category to apply to an insect''s
  internal states. The uncertainty attaches to a general claim about a kind of organism
  rather than to a distribution of facts across individuals. If the truth is categorical
  in this way — either insects generally have morally significant experiences or they
  generally do not — then there are no per-individual coin flips to aggregate. There
  is one fact, and we are uncertain about it.


  This distinction, I claim, is not merely verbal. It corresponds to a real difference
  in the shape of the underlying facts. If sentience is a matter of some threshold
  property being present — a certain kind of integrated information processing, say,
  or a certain functional architecture — then it is plausibly a property that a species
  either has or lacks, in the way that having a liver is not a matter of degree spread
  across a population. Threshold properties are not distributed; they are shared.


  Now the familiar reply is that this makes no difference to the arithmetic, because
  uncertainty about a categorical fact is still uncertainty, and uncertainty is uncertainty.
  If we are 30 percent confident that insects are sentient in general, then our expected
  number of sentient insects is 0.3 times the population, and we are back where we
  started. The scale argument is restored.


  I think this reply fails, though I admit the failure is subtle. The trouble is that
  the categorical case does not give us a probability of sentience per insect; it
  gives us a probability of a whole theory of insects being correct. And we should
  not treat our credences in theories as if they were credences in facts. When we
  say we are 30 percent confident in a theory of insect consciousness, we are not
  reporting a frequency or a disposition to bet at those odds; we are expressing an
  aggregate of considerations that are themselves incommensurable. Assigning a number
  there is a bookkeeping convenience, not a measurement.


  The consequence is that the scale argument''s force depends on which kind of uncertainty
  we are in, and its proponents have not shown that we are in the first kind. If the
  uncertainty is distributional, the argument goes through and the numbers do the
  work. If the uncertainty is categorical, the argument''s apparent strength is an
  artifact of a probability that we had no right to assign in the first place. Since
  we do not know which kind of uncertainty we face, we should treat the scale argument
  as a conditional: compelling if the relevant properties are distributed, considerably
  less so if they are not.


