  - Expressivism: moral judgements express non-cognitive attitudes (e.g., approval/disapproval,
  plans, prescriptions) rather than beliefs/descriptive propositions.

  - Frege–Geach problem (also called the embedding problem): posed by Geach (1965,
  "Assertion"), based on Frege''s point that a thought''s content is the same in embedded
  and unembedded occurrences; e.g., in modus ponens, the antecedent "If lying is wrong,
  then getting your little brother to lie is wrong" contains the very same proposition
  "lying is wrong" that appears as the categorical premise. If "lying is wrong" in
  the categorical premise expresses approval, then in the embedded context what does
  it express? Embedded occurrences aren''t asserted, so they can''t express the attitude
  (you can''t approve in an if-clause). So expressivism seems unable to explain the
  validity of arguments containing moral terms, or the meaning of embedded moral sentences
  (negation, conditionals, disjunction, propositional attitude reports, questions).

  - Various responses: Blackburn''s quasi-realism (higher-order attitudes, the "Frege-Geach
  problem" for him is the "problem of embedding"), Gibbard''s norm-expressivism (norms,
  plans; embedding via "the language of the iffy"), Schroeder''s "being for" expressivism
  with a "biforcated attitude" semantics, Horgan & Timmons, etc.

