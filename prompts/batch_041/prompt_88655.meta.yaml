  and that the paradoxes show our ordinary notion of belief has to be replaced or
  disciplined. But my little construction reaches its verdict without any notion of
  probability and without any admission of fallibility: pure logic forces the second
  claim to be false, no matter what it is. If you tell me the author should never
  have believed both sentences, you are telling me that logic by itself dictates which
  belief to drop, which sounds like a strange claim about rationality — surely what
  to drop depends on the evidence. If you tell me the preface sentence is simply not
  the sort of thing that can be believed, you have to say why, and the reason cannot
