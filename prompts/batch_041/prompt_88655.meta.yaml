  Here is my opening move, and I should warn you that I invented it myself and am
  not sure what to make of it. I have been worrying about the preface case, where
  an author believes each of her claims and then admits in the preface that at least
  one of them is false. The usual telling makes the trouble depend on probabilities:
  each claim is very likely, their conjunction is not. I wanted a version where probability
  plays no part at all, so I wrote this. A book has exactly two claims in it, and
  the first of them is the preface sentence, which says: ''Exactly one of the two
  claims in this book is false.'' The second claim is the body of the book, and I
  have deliberately not told you what it says. Now I reason as follows. If the preface
  sentence is true, then exactly one claim is false, and since the preface sentence
  is true, the false one must be the body claim. If the preface sentence is false,
  then the number of false claims is not one; it is either none or two, and it cannot
  be none, because the preface sentence is false; so both claims are false, and the
  body claim is false again. Either way the body claim is false — whatever it says.
  So it seems to me that an author who opens a two-sentence book that way has guaranteed,
  by logic alone and before writing a word of the body, that whatever she writes next
  is false. That is not a matter of each claim being merely probable; nothing probabilistic
  has entered.


