  Draft:


  I hold a view I will call evidence-constrained narrativism about history. It grants
  the central point of the sceptical tradition running from Carr to Hayden White:
  the archive does not by itself dictate a single narrative, and the historian''s
  selection, emplotment, and causal emphasis are shaped by present concerns, rhetorical
  conventions, and the kind of story the historian wants to tell. But it denies that
  this makes historical narratives merely literary constructions. On this view, a
  narrative is objectively assessable to the extent that the causal claims it encodes
  can be tested against surviving evidence, and to the extent that rival emplotments
  of the same episode make different predictions about what further evidence would
  look like. Ranke''s aspiration to reconstruct the past as it actually was is not
  a naive copy theory of representation; it is a regulative ideal that disciplines
  the selection of evidence even though it can never be fully achieved. What would
  count against this position?


  I want the defeaters, not a reading list. Sort them by how decisive they would be.
  Which arguments, cases, or results would a committed defender of this view have
  to concede as genuine problems, and which would they be entitled to dismiss? I am
  especially interested in the following pressure points: first, whether the distinction
  between narrative form and causal content can be made precise enough to do the work
  I am asking of it, or whether the two inevitably contaminate each other; second,
  whether the view collapses into a covert form of positivism by treating causal claims
  as the only truth-apt component of history; third, whether the same episode can
  sustain two equally evidence-supported but incompatible narratives, and if so, whether
  that is a fatal underdetermination or merely an ordinary case of theory choice underdetermined
  by evidence; fourth, whether the view can account for the way historical narratives
  themselves function as evidence for later historians, so that the object of assessment
  is not a static archive but a changing historiographical tradition; and fifth, whether
  the regulative ideal does any real work if no historical narrative can ever be shown
