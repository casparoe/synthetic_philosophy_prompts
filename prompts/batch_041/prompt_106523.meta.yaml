  violate yourself; his criticism is a piece of hypocrisy, not moral address.

  2. B: Standing isn''t about personal record; blame''s job is to get the norm back
  on track / to hold the person to a standard they''re bound by anyway. The standard
  applies regardless of who''s invoking it, and the junior colleague has reasons to
  comply that don''t depend on the senior colleague''s record. Conflating the validity
  of the criticism with the critic''s standing is the genetic fallacy.

  3. A: Concedes the content is fine, but says the act of blaming is a claim of moral
  authority, and authority is forfeited by the same conduct; the point of hypocrisy''s
  wrongness is that it treats the norm as binding on others but not on oneself, which
  is a way of denying the equality the norm presupposes.

  4. B: Then note that on this view, everyone who has ever failed is silenced forever
  — including A, who also violates the norm. Also, there''s an asymmetry: we''d want
  the serial violator to be the *most* motivated to speak up (he knows the costs),
  and we want norms enforced even by the compromised. Maybe standing comes in degrees,
