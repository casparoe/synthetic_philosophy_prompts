  Death in Damascus: Gibbard & Harper''s example. A man in Damascus learns Death (the
  Angel of Death / Azrael) has looked at him threateningly in the marketplace. He
  flees to Aleppo. But Death had looked at him in surprise because she had an appointment
  with him in Aleppo. The puzzle: both fleeing and staying seem to lead to death.
  The standard decision-theoretic point: there is no ratifiable option—whichever act
  you choose, once you imagine having chosen it, the other act looks better. If you
  stay in Damascus, the conditional probability of death given you stay is high, so
  you should flee; if you flee, the conditional probability of death given you flee
  is high (since Death''s prediction/appointment is in Aleppo), so you should stay.
  Causal decision theory: your choice doesn''t causally affect where Death goes (Death''s
  knowledge is already fixed / it''s a prophecy), so it should be a "toss-up"? Actually
  the standard analysis: CDT says the two acts are equally good (or that there''s
  no rational choice), since the causal structure is that Death''s appointment is
  fixed independent of your choice. EDT makes each act look worse than the other—so
  it''s unstable, no ratifiable act.


  Key subtlety: it''s an anti-EDT example (Gibbard and Harper''s "Death in Damascus"
  is actually used to show EDT''s instability; CDT handles it by noting the acts have
  equal causal expected utility). Also relevant: the story is fatalistic — the prophecy
  is self-fulfilling in a way that makes escape futile. Also the epistemic point:
  if you can''t know what Death knows, deliberation itself is odd.


  The poem: I want the poem''s form to do structural work tracking the unratifiability
  — a form where whichever way the poem turns, it returns, or where the two stanzas
  mirror each other so that reading them in either order yields the same verdict.
  Good candidates: a palindrome-ish form; a "mirror" poem where the second half reverses
  the first; a poem with a refrain that flips its meaning; a villanelle with refrains
  that swap; a "doubling" structure. But I already used villanelle in an example,
  and instructions say don''t reuse openings/wording/structure of examples — the examples''
  structures are fine as types but better to pick something distinct.


  Idea: a poem in two halves that are line-by-line reversals, so that the poem can
  be read top-to-bottom or bottom-to-top and yields the same argument — enacting that
  fleeing and staying come to the same thing / that the argument has no stable terminus.
  Or: a poem with a refrain, where the refrain''s antecedent is swapped in the final
  stanza so the same words now recommend the opposite act.


