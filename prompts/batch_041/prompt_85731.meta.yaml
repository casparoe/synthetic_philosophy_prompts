  Please explain a conceptual issue about rules that govern their own amendment.


  Consider a hypothetical membership association whose entire charter consists of
  two clauses. The first provides that any clause of the charter, including this one,
  may be amended by a two-thirds vote of the members present at a meeting for which
  advance written notice of the proposed amendment has been given. The second provides
  that no amendment may reduce the two-thirds threshold, shorten the notice period,
  or otherwise make the amendment of the charter easier.


  A faction proposes to repeal the second clause. Notice is given properly, and the
  proposal receives two-thirds of the members present. Some members insist the repeal
  is valid: it complied with every requirement in force when it was adopted. Others
  insist it is void: the clause forbidding any change that makes amendment easier
  is the only thing that could have authorized the change, and a rule cannot survive
  its own repeal long enough to validate the vote that repeals it.


  I want a careful analysis of the conceptual structure here, not a decision about
  the association. Please address the following.


  1. State the alleged paradox as precisely as you can, and say what kind of problem
  it is: a contradiction, an infinite regress, a circularity, or a conflict between
  two readings of a text that is not really a paradox at all. What, exactly, is claimed
  to be impossible?


  2. Distinguish direct from indirect amendment. Does repealing a prohibition violate
  the prohibition? What in the concept of a rule determines whether a prohibition
  reaches an amendment that abolishes it rather than one that contravenes it? If the
  answer depends on reading the clause purposively rather than literally, say so,
  and explain what the purposive reading must supply that the text does not.


