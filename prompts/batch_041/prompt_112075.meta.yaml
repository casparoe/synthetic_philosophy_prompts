  Background: a (fictional) research institute, the Center for Historical Severity
  Assessment, has proposed a "Severity of Historical Wrongs Index" (SHWI) for use
  in museums, curricula, and reparations deliberations. The proposal has three parts.


  First, a set of dimensions on which any atrocity is to be scored, each on a 0-10
  scale:

  1. Magnitude — number of people killed, displaced, or subjected to the harm.

  2. Intentionality — the degree to which the harm was aimed at as an end, versus
  foreseen and accepted as a side effect.

  3. Organization — the degree to which the harm was planned, bureaucratized, and
  carried out by a durable institution rather than emerging from chaos or a temporary
  uprising.

  4. Ideological exclusion — the degree to which victims were marked as outside the
  community of moral concern.

  5. Irreversibility — the degree to which the losses (lives, languages, archives,
  practices) cannot be recovered or repaired.


  Second, an aggregation rule: the five scores are combined into a single number,
  but the index explicitly permits ties and refuses to claim that a one-point difference
  on any dimension is meaningful. It advertises itself as ordinal, not cardinal.


  Third, a "lexical priority" option: users who wish may order the dimensions lexically,
  so that a difference in Magnitude, however small, outweighs any difference on the
  remaining dimensions.


  The institute''s defenders say the index is a tool for transparency, not a verdict;
  its critics call it obscene. Your task is to adjudicate.


  Write an essay that:

  (a) states and defends a verdict on whether comparative ranking of atrocities is
  possible, and whether it is obscene — the two questions may come apart, and you
  should say whether they do;

  (b) examines whether the ordinal/cardinal distinction actually rescues the index,
  or merely relabels the problem;

  (c) tests the index against at least two concrete hard cases of your own construction
  — for instance, two wrongs that the index scores as a tie but that most people would
  insist are not morally equivalent, and a case where the lexical option reverses
  an intuitively compelling ranking;

  (d) addresses the strongest objection to your own conclusion.


  Conclude with a clear verdict rather than a survey of difficulties. Aim for a rigorous,
  self-contained argument that a careful reader could follow without any outside sources.


