  puzzle: someone writes a long book, checking each factual claim as carefully as
  possible. Each individual claim is probably true, so she seems entitled to believe
  each one; but she also knows that in a book that long at least one claim is probably
  false, so she cannot believe the whole conjunction. I keep feeling that both puzzles
  are about the same tension between local confidence and global consistency, but
  I cannot tell whether the tension is real or an artifact of how I am talking.


