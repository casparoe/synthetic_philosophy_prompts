  \ upset by voluntary transfers; preserving the pattern requires continuous interference)\
  \ also undermines Nozick's own entitlement theory if... hmm, actually entitlement\
  \ theory is historical, not patterned, so it's not upset by voluntary transfers.\
  \ But: the argument seems to prove too much if we notice it applies equally to non-market\
  \ voluntary transfers, or to gifts, or to the entitlement theory's own requirements\
  \ — e.g., the argument shows that any distribution you could name is unstable. Alternatively,\
  \ the argument proves too much in that it would equally license the \"reverse\"\
  \ claim: that any historical entitlement chain will be upset by nothing, but...\n\
  \nA well-known line of criticism: the Wilt Chamberlain argument conflates \"patterned\"\
  \ with \"end-state\" principles and ignores that a patterned principle could be\
  \ maintained without continuous interference if people's tastes incorporate the\
  \ pattern (e.g., Cohen's critique in \"Robert Nozick and Wilt Chamberlain: How Patterns\
  \ Preserve Liberty\"). Also, the argument seems to show that any redistributive\
  \ scheme requires \"continuous interference with people's lives\" — but a scheme\
  \ that taxes income doesn't necessarily forbid the transfer, it just taxes it; Nozick's\
  \ \"capitalist acts between consenting adults\" line.\n\nHmm, but for the \"proves\
  \ too much\" type, I want a chain of numbered premises with a subtle flaw or a least-costly\
  \ premise to reject. And the asker is a university student in a related course.\n\
  \nLet me design one on Nozick.\n\nPossible argument: An argument that seems to show\
  \ that Nozick's entitlement theory cannot object to anything, i.e., that the entitlement\
  \ theory proves too much / licenses any distribution, or that it's empty.\n\nActually\
  \ here's a nice \"proves too much\" for Nozick:\n\n(1) A distribution is just if\
  \ it arose from a just initial acquisition and just transfers (entitlement theory).\
  \ (2) Just transfers are voluntary transfers — the parties' consent is what makes\
  \ them just. (3) Consent is valid only if the parties are not coerced, and coercion\
