  Draft:


  "I have been reading Bentham''s arguments against the criminalization of sexual
  conduct — the ones where he insists that if an act harms no one, the pleasure it
  produces is so much pure addition to the sum of human happiness that punishing it
  can only make the world worse — and I keep getting stuck on the shape of the argument
  he is answering rather than the one he makes. His opponents do not, for the most
  part, claim that the conduct injures anyone. They claim it is unnatural. When I
  try to find out what work that word is doing, I run into one of three walls. Either
  the word is unpacked by pointing to the speaker''s own reaction (''it turns the
  stomach''), in which case it names no feature of the act at all. Or it is unpacked
  by pointing to some feature that is perfectly describable — that the act cannot
  produce children, or that few people do it, or that it is not what the organ is
  ''for'' — and then, as Bentham notices, the criterion convicts a great many things
  nobody in the argument wants to convict, and exempts a great many things the speaker
  plainly wants condemned, so the description is not really functioning as the criterion.
  Or the word is simply reasserted, and the discussion ends.


  What I cannot decide is whether I am looking at one thing or several, and whether
  the thing has a name. It is not that the word is meaningless: it seems to do real
  work in the argument, only the work is done by the attitude rather than by the property,
  and the attitude is then presented back to us as though it were the property. And
  it is not simply the general observation that moral words express feelings; I meet
  the same shape in places where the term has an obvious descriptive core. ''Disorder''
  in medicine, ''cult'' as opposed to ''religion'', ''terrorist'' as opposed to ''insurgent'',
  ''pseudoscience'': in each of these there is a checklist, and in each of these the
  checklist seems to get redrawn after the verdict has been reached, while the verdict
  itself never moves. Yet in other cases — ''courageous'', ''brutal'', ''lewd'' —
  the descriptive part really does constrain what the word can be applied to; I cannot
  call a cowardly act ''courageous'' however warmly I feel about it, and I would not
  know how to begin redrawing the checklist to make it fit.


