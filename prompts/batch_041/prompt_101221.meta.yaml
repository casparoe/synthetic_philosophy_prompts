  I host a monthly discussion group at a community center. The group is mixed—some
  people have read a little philosophy, most have not—and we meet for ninety minutes
  in a single room with about twelve participants. I have been thinking on my own
  about a condition in which a person reports pain but does not find the pain bad:
  they will say that it hurts, sometimes intensely, yet they are not distressed by
  it, do not dread it, and may even decline pain relief because the sensation does
  not bother them. What interests me is not the medical rarity but the conceptual
  split it seems to reveal: between pain as a sensation with an intensity and pain
  as something that is bad for the one who has it. I want the group to feel the force
  of that split in their bones, not just hear it described.


  Design a runnable ninety-minute activity for twelve people that does this. The activity
  should not begin with a lecture about the condition, and it should not name the
  condition until the debrief. Instead, the rules, materials, and incentives should
  arrange things so that participants themselves produce the separation between intensity
  and badness—so that they find themselves ranking, trading, or choosing in ways that
  make the two come apart before anyone tells them they can. Use whatever materials
  are cheap and easy: index cards, tokens, a whiteboard, a timer. I would like a clear
  sequence: setup, rules, what the participants actually do, and a debrief that maps
  specific moments in the activity onto the conceptual distinction. The debrief should
  also address the harder question the split raises: whether the badness of pain is
  a separate component added to the sensation, or whether it is a matter of what the
  sensation does to the person—its motivational grip, its demand for relief, its role
  in practical reasoning. I would like the activity to make participants feel why
  someone might say that pain can be present without being bad, and also why someone
  might resist that description.


  Please include an honest account of what will predictably go wrong the first time
  I run it, and how to handle those failures without turning the session into a lecture.
  Also tell me which part of the idea the activity cannot reproduce—what it will inevitably
  flatten or leave out—and what I, as the facilitator, will have to supply in the
  debrief.


