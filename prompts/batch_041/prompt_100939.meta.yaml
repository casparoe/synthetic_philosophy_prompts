  Lottery paradox (Kyburg): It''s rational to accept (believe) of each ticket that
  it won''t win, since the probability is very high. But accepting all of these entails
  that no ticket wins, which contradicts the known fact that one ticket wins. So either
  you must accept an inconsistency, or reject the principle that high probability
  suffices for rational acceptance, or reject the principle that rational beliefs
  are closed under conjunction (i.e., that if you rationally believe A and B, you
  can rationally believe A∧B).


  Preface paradox (Makinson): The author of a non-fiction book reasonably believes
  each of the many claims she asserts; she also reasonably believes, given human fallibility,
  that at least one of them is false. If rational belief is closed under conjunction,
  she''d rationally believe the conjunction of all her claims, which contradicts her
  belief that one is false. So it''s inconsistent to hold both.


  Relation: both are about closure under conjunction + a high-probability acceptance
  rule. The lottery: closure + high-probability rule → inconsistency. The preface:
  closure + fallibility belief (which is a form of high-probability, or a "some of
  my beliefs are wrong" claim) → inconsistency.


