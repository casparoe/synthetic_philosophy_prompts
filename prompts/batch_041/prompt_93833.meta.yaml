  Prompt draft:


  You are a philosopher working at the intersection of formal epistemology and the
  philosophy of institutions. I want a careful, original analysis, not a survey. Please
  think through the problem in stages before giving your final answer.


  Consider the following institutional practice, which is common in research funding
  and scientific publishing. A funding agency requires every applicant to sign a certification
  stating that all claims in the proposal are true and complete. At the same time,
  the agency audits only a random 2 percent of funded proposals each year. Its annual
  report says, correctly, that no particular funded proposal is likely to contain
  a material falsehood, but that some funded proposals certainly do. Reviewers are
  instructed to treat each certified claim as acceptable if it passes the agency''s
  checklist; they are not instructed to assess whether the entire set of certified
  claims across the portfolio is consistent. The agency also has a rule that if an
  audit uncovers a false claim in one proposal, that finding does not by itself require
  reopening the other proposals in the same program, even though the same lab or institution
  may have submitted several.


  My question is: what philosophical commitments does this practice presuppose? In
  particular, what theory of rational acceptance, belief, credence, and consistency
  does it require or merely fit well with? Does the practice presuppose that an agent
  can rationally accept each of many claims while also accepting that at least one
  of them is false? Does it presuppose a distinction between belief and credence,
  or between accepting a claim for practical purposes and believing it? Does the signed
  certification express belief, or is it better understood as a promise, an assurance,
  or a legal fiction, and how does that affect the paradox? What does the practice
  assume about the unit of epistemic evaluation: the individual claim, the proposal,
  the portfolio, or the institution? Which rival views of rational acceptance would
  rule the practice out, and which would leave it underdetermined? Finally, if we
  replaced the practice with a straightforwardly probabilistic or credence-based policy,
  what would have to change in the certification, the audit rule, and the reviewers''
  instructions?


  Be precise about the difference between what the practice strictly presupposes and
  what it merely makes convenient. Do not simply recite the standard literature on
  the lottery paradox and the preface paradox; use those puzzles only as tools if
  they help. Do not provide a bibliography or citations. Aim for a rigorous, balanced
  answer that a philosopher could learn from.


