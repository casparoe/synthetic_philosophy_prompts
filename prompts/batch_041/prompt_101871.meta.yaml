  Let me think about the dependency order for Skolem''s paradox:

  1. First-order logic: quantifiers range over a domain, and "there exists" means
  "there exists in the domain."

  2. What it means for a structure to satisfy a sentence (satisfaction/truth in a
  model) — relativization.

  3. Cardinality is defined via bijections, which are themselves sets/objects; so
  "countable" is a statement in the language that gets relativized.

  4. Downward Löwenheim-Skolem: any consistent first-order theory with infinite model
  has countable model (assuming countable language).

  5. ZFC is first-order and consistent (assume), so has a countable model.

  6. In that model there''s an object the model thinks is the set of uncountables;
  the model satisfies "there is an uncountable set."

  7. But from outside, the model is countable, and the "uncountable set" is a subset
  of a countable set, hence countable.

  8. Resolution: the bijection witnessing countability from outside is not an element
  of the model, so the model doesn''t "see" it. The model''s "powerset" is not the
  real powerset. Countability is not absolute.


