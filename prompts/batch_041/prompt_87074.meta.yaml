  Hume''s essay "Of the Standard of Taste" (1757). Key points:

  - Beauty is not a quality of objects themselves but a sentiment in the mind. "Beauty
  is no quality in things themselves: It exists merely in the mind which contemplates
  them; and each mind perceives a different beauty." (But we can''t quote unless fetched.)

  - Yet there is a standard of taste: the joint verdict of qualified judges, "true
  judges," who have delicacy of taste, practice, comparison, freedom from prejudice,
  good sense. Their verdicts provide a rule, though it''s not a priori.

  - Sentiments are subjective but not all equal; some are more correct because they
  are based on the object''s real qualities and the ideal critic''s response.

  - There''s a distinction between sentiment and judgment. Taste is a sentiment, but
  we can reason about the causes of sentiment.

  - "The general rules of art" are founded on experience of what has pleased in different
  ages and nations.

  - The standard is not a rule of reason but a rule of taste, grounded in the common
  sentiments of qualified judges.

  - Hume acknowledges variation but thinks the standard is the verdict of true judges.


