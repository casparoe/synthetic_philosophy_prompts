  Draft:


  I am putting together a short paper for a graduate metaphysics seminar, and I would
  like comments before I commit to the line of argument. The paper is on the modal
  argument for the essentiality of origin — the argument that you could not have come
  from a different sperm and egg — and my aim is to argue that the argument establishes
  less than it is usually thought to. I give the text below, then say what I want
  from you.


  [Essay]


  1. The case that does the work.


  Consider the familiar pair of questions. Could you have been conceived from a different
  pair of gametes, one that in fact produced someone else — your sibling, say? Most
  people find it easy to answer no, and hard to say why. And could you have grown
  from your actual gametes into someone utterly unlike yourself in character, memory,
  and history? Most people find it easier to answer yes, or at least to feel that
  the question is not absurd. The asymmetry is striking: a difference in origin seems
  to be a difference in who, while a total difference in the resulting life seems
  to be a difference in how things went for whoever it is. Origin essentialism takes
  this asymmetry at face value and treats it as a datum about metaphysical necessity.


  I want to propose two cases that put pressure on the reading of the asymmetry.


  The Gamete Lottery. Before you are conceived, you are offered a choice. Option A:
  you are conceived from the gametes that in fact produced you. Option B: you are
  conceived from a different pair of gametes, but the resulting person has your entire
  subsequent history — your body, your memories, your attachments, the whole qualitative
  career — with the difference confined to the first instant. Call B the transplant
  world. Then the reverse case: Option C, where your actual gametes unite but a cosmic
  ray rewrites the genome, so that the resulting person shares almost nothing qualitative
  with you.


  If origin is what fixes identity, B contains a stranger who merely resembles you,
  and C contains you, badly off. That is exactly the asymmetry above, and the Gamete
  Lottery merely makes its cost explicit: identity comes apart from everything we
  care about when we ask who someone is. A defender will say that this is a virtue,
  not a cost: identity was never supposed to track what we care about. Fine. But now
  notice what is doing the work in B. The question "which one is you?" has no answer
  available except the one we supply by rule, because everything that could be inspected
  — body, memory, dispositions — is stipulated to be the same on both sides. The origin
  answers the question because we have decided that it answers the question.


  2. The Sibling Swap.


  Suppose the gametes that produced you produce your sibling, and the gametes that
  produced your sibling produce you, with the resulting lives swapped along with them:
  your sibling''s life unfolds from your gametes, and yours from theirs. Who is who?
  Two tracking policies are available. Follow the gametes, and you are the person
  living your sibling''s life; follow the life, and you are the person living your
  life, conceived from different gametes. The origin essentialist must take the first
  policy. But the first policy is now plainly a policy: it is a rule for answering
  a question that the facts underdetermine, and the rule is chosen because it is determinate,
  not because the world forces it. That, I claim, is the whole content of the necessity
  that the modal argument reports. We keep track of persons across worlds by origin
  because origin is the only tracking device that returns an answer in every case.
  The necessity is inherited from the requirement that our practice return a determinate
  answer, not from a feature of persons.


  3. Why this matters, and the reply I expect.


  I do not conclude that origin essentialism is false. I conclude that the modal argument
  cannot establish it, because its premise is about our individuative practice and
  its conclusion is about the world, and the principle that licenses the move — that
  our tracking rules answer to joints in nature — is assumed rather than defended.
  [Then anticipate: an objector will say this is verificationism... reply: I am not
  denying bivalence about identity claims across worlds; I am denying that the argument
  gives us a reason to affirm one side. Also anticipate the objection: "you have shown
  only that the case is underdetermined, not that the necessity is conventional; underdetermination
  of evidence is not indeterminacy of fact." Reply: granted; then the argument needs
  an independent reason to think origin fixes identity, and the intuitions it relies
  on are precisely the practice in question — so the argument is circular. Also anticipate
  the twinning worry: the zygote version of origin essentialism makes twins one person;
  the gamete version leaves the origin incomplete until the fission is included, and
  once we include the fission we are including the developmental path, which invites
  the question why we stop there rather than at the whole causal history back to the
  beginning.]


