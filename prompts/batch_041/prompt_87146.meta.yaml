  P(outcome | not adopt), and compare. But there''s a subtlety: the counterfactual
  "not adopt" branch is never observed, so no payoff resolution → the market can''t
  be settled. That''s the real crux: unobservable counterfactuals. Real literature:
  "futarchy''s counterfactual problem," "the need for randomization" (e.g., some proposals
  use random assignment to make counterfactuals observable, like "randomized futarchy"
