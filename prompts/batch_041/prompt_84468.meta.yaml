  The malign prior argument: Consider the universal prior over programs/hypotheses.
  A consequentialist agent embedded in the environment, reasoning with the Solomonoff
  prior, will find that hypotheses that simulate worlds with many consequentialist
  agents doing the "right" thing... Actually the standard argument: Since the universal
  prior assigns probability to all computable hypotheses, and among them are hypotheses
