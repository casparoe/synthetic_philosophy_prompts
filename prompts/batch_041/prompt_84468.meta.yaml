  is dominated by hypotheses where its actions have huge influence — e.g., hypotheses
  where the world is a simulation run by an agent simulating many copies of you, and
  where you''re being rewarded/punished. This makes the agent''s decisions dominated
  by tiny-probability-but-huge-utility hypotheses, making the prior "malign" — an
  agent using it would behave as if paranoid, or would sacrifice everything for the
  sake of hypotheses with vast utility (e.g., infinite ethics, or "if I don''t do
  X, an infinite number of simulated copies suffer").


  Actually the classic "malign" point: Solomonoff induction gives non-negligible probability
  to hypotheses in which the agent is being simulated by another agent that will reward/punish
  based on the agent''s outputs (since such hypotheses are computable and not much
  more complex than the "real" world). Hence the agent behaves as if it''s in a simulation
  and its actions matter enormously — leading to "acausal" trade, or to an agent that
  does whatever the simulated-agent-simulator wants. And with infinite values, any
  nonzero probability times infinite value dominates, so the agent''s behavior is
  hijacked by measure-zero-ish hypotheses about infinities.


