  I run the democratic innovations desk at a national parliament — we design and run
  citizens assemblies, three or four a year, and my boss wants me to turn the sortition
  side of it into a procedure the whole office can run without me in the room. So
  please write me one: a decision procedure for designing how an assembly is selected
  and what it''s allowed to decide, grounded in what sortition is actually supposed
  to justify rather than in what looks tidy on a slide. Questions in order, what counts
  as a good enough answer to each, where the procedure stops with a hard no (this
  one can''t be done by lot), and where it hands the question to the minister because
  it''s a values call and not a design call.


  Real constraints: six weeks per assembly, fixed budget, no power to compel anyone
  to show up, the minister signs off on the final design, and we will absolutely get
  judicially reviewed by someone arguing the sample wasn''t fair. So it has to be
  reusable and a junior can run it.


  Stuff it has to actually resolve, because this is where we keep coming unstuck:


  - stratify or plain lot? our mandate literally says both ''selected by lot'' and
  ''representative of the country'', and I''ve never been able to explain to my colleagues
  why the lot''s warrant is that everyone had an equal chance rather than that the
  sample looks like a mirror of the population — and why those two come apart the
  moment you start topping up refusers. I want that distinction made operational,
  not just asserted.

  - the office''s current draft draws from a ''civic register'' of people who''ve
  already signed up to be interested in this sort of thing. I think that quietly guts
  the whole thing but I can''t say why in one sentence. Have the procedure say it
  in one sentence, or tell me I''m wrong.

  - refusals, dropouts, unreachable people, and the replacement rule.

  - how big it has to be before the representation argument is doing any work at all.

  - who''s in the pool — voters, citizens, residents, adults — and what to do when
  the people affected by the topic aren''t all in the pool.

  - and the boundary: which design choices are ours and which have to be handed to
  the assembly once it''s seated, on pain of the whole thing just being an expensive
  focus group.


  Then run it on three cases: (a) a 150-person national assembly on assisted dying,
  (b) a 40-person borough assembly on a congestion charge where a lot of the drivers
  don''t live in the borough, and (c) the minister''s pet project — a permanent randomly
  selected chamber that sets its own agenda, ie proper lottocracy rather than a one-off.
  If the procedure kills one of those, say so plainly, I''d rather find out from you
  than from a select committee. And tell me which steps are just my value judgements
  dressed up as method, and what the procedure simply can''t do.


