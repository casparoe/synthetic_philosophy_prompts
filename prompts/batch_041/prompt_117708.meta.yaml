  Rietdijk-Putnam argument:

  1. Special relativity says simultaneity is relative to a frame.

  2. For any event E, there is a frame in which E is simultaneous with now, a frame
  in which E is in the past, and a frame in which E is in the future (if E is spacelike
  separated from now).

  3. If an event is past in some frame, it is real/determinate; if future in some
  frame, it is not yet real.

  4. So every event is both real and not real, or all events are equally real.

  5. Therefore the block universe is true and becoming is an illusion.


  Where does it go wrong? The flaw: It assumes that "real" or "present" is frame-relative
  in the same way simultaneity is. Or it assumes transitivity of "present with" across
  frames. The standard objection (e.g., by Stein, Savitt) is that the Rietdijk-Putnam
  argument conflates "simultaneous with" with "real for" or "present for." Relativity
  tells us about simultaneity, not about existence. The argument also assumes a single
  objective present that must be a simultaneity slice; but if presentness is frame-relative,
  then "real" is relative, and there is no contradiction. The cost: giving up the
  idea that there is a single objective now; or accepting a moving spotlight? This
  is in the weeds and meaningful. The asker software engineer. We can inject a niche
  idea: "my friend says we can derive the block universe from a simple thought experiment
