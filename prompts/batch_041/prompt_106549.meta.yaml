  ---


  I''m a software engineer with no formal training in philosophy, and I''m trying
  to build a short story around a puzzle that I can''t stop thinking about. Suppose
  there are two objects that are alike in every respect we could ever measure — same
  mass, same shape, same internal structure down to the last atom, sitting at the
  same distance to your left and to your right — so that no test, no matter how precise,
  could ever tell you which one you were looking at. Is that two objects, or one object
  that we''re simply describing twice? I gather this is roughly the puzzle philosophers
  discuss under the name "the identity of indiscernibles," and that one common line
  is that there really are two, because being two does not require differing in any
  qualitative way; the fact that there are two is just a brute, further fact about
  the world. The opposing line I keep seeing is that if nothing observable whatsoever
  distinguishes them, then the claim that there are two is asserting something no
  evidence could ever touch. I''d like a story that keeps this tension alive rather
  than dissolving it in an argument.


  Please write a short story (roughly 1,000-1,400 words) built around a specific scene:
  a technician at an isolated facility is ordered to destroy "the original" of a pair
  of objects that the facility''s duplication machine has rendered perfectly indiscernible
  — and there is, by construction, no fact of the matter about which one is the original.
  The story should honor the constraint that the two objects remain genuinely indiscernible:
  don''t sneak in a serial number, a scratch, a difference in position that the technician
  can exploit, or an asymmetry introduced by the observer. The drama has to come from
  the characters trying to act when the distinction they need isn''t there. It''s
  fine — in fact encouraged — for the story to end without resolving whether there
  were ever two things, or whether "which is the original" was a question with an
  answer. I''d like at least one character to push the view that there''s a brute
  difference between the two that no measurement could reveal, and at least one to
  push the view that talk of "two" or "the original" has quietly stopped meaning anything
  here.


