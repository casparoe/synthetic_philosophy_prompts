  Draft:


  "I have been arguing with a colleague who reads a lot of Spengler, and he keeps
  reaching for one comparison: a civilization is an organism. It is born, it grows,
  it ripens, it ages, and it dies, and the Western one is somewhere in its late autumn
  or its winter; therefore the decline he expects is a natural process, like aging,
  and nothing anyone does -- policy, reform, technology, immigration -- can do more
  than postpone the symptoms. He treats the comparison as doing real work: it is why
  he thinks the outcome is inevitable, why he thinks the analogy to ''reviving'' a
  civilization is a category mistake, and why he thinks we should stop treating the
  present as a choice. I want to know how far the comparison actually holds, and I
  want it audited rather than dismissed."


  Then add: "I am not only interested in his version. The same picture shows up with
  different jobs attached: in Polybius''s cycle of constitutions, in Ibn Khaldun''s
  account of dynasties rising and falling on the strength of group solidarity, and
  in Toynbee''s challenge-and-response, where the breakdown comes from inside, from
  a creative minority that has stopped being creative, rather than from an external
  blow. Spengler himself called his method the drawing of analogies. And a related
  version of the picture is much older: the polity as a body whose members must not
  withhold their service, since a body cannot survive the secession of its parts."


  Then the asks:

  - correspondence table: what plays the role of birth, growth, maturity, aging, death;
  what plays the role of the species with its fixed lifespan; what plays the role
  of the organs, the immune system, the genes; what plays the role of the doctor.

  - where the mapping breaks; distinguish the disanalogies that matter for the fatalist
  conclusion from those that don''t.

  - what the source quietly imports that the target lacks: determinate lifespan fixed
  by species; a single death event; non-overlapping, well-individuated members; no
  reproduction/offspring; no borrowing from other organisms; no consciousness in the
  parts and no access to the diagnosis; the organism''s death is not something it
  can read about in advance.

  - reflexivity: unlike an organism, members of a civilization can read the diagnosis
  and act on it (and Spengler''s book was itself a historical event) — does that difference
  undermine or support the fatalism?

  - individuation problem: where does one civilization end and another begin; are
  "the West" and "the Roman Empire" individuals of a kind at all? Spengler''s cultures
  are sharply individuated by a "soul"/prime symbol — is that an empirical finding
  or an artifact of the analogy?

  - the other uses: does the same analogy survive in Ibn Khaldun''s version (where
  the cycle is closed by a fresh group from outside, so it''s replacement rather than
  revival, and where solidarity is a variable that policy could in principle affect)?
  Toynbee (where the whole point is that breakdown is not external and not inevitable)?
  If the analogy were really carrying the fatalist conclusion, why does it do different
