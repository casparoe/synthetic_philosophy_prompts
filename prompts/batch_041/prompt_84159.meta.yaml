  Potential prompt:


  "I am the philosophy of religion editor for a small academic journal, and I handle
  roughly forty submissions a year that turn on some version of the ontological argument;
  a growing share are modal, and several recent ones are Gödel-inspired. The problem
  is not that we lack referees but that the reports are inconsistent: one referee
  treats the argument as a live proof, another as a dead letter, and I have to decide
  what to send out and how to weigh the reports under deadline. I would like you to
  turn the ontological argument -- not the historical texts but the argument-form
  itself, including its modal version -- into a decision procedure I can actually
  run on a submission before I assign referees. I need the questions in the order
  I should ask them, what counts as a sufficient answer to each, where the procedure
  stops with a clear ''send to referees'' or ''reject without review,'' and where
  it must hand the decision to a human because the issue is a contested philosophical
  judgment rather than a mechanical defect. Please build in the distinctions that
  matter: whether the argument is Anselmian or Gödel-style; whether it treats greatness
  as a maximal property or a second-order property; whether it relies on S5 and what
  happens if it does not; whether ''positive property'' is doing substantive work
  or is a placeholder; whether necessary existence is a perfection or a category mistake;
  and whether the argument has a parody or modal-collapse problem. A colleague has
  also suggested that we treat the argument as a recipe rather than a proof: the premises
  specify a role, and the question is whether any possible world can fill that role.
  I want the procedure to be honest about whether that reframing helps or just changes
  the subject."


  Second paragraph: "Then run the procedure on two submissions. The first is a clean
  Anselmian argument from a being than which nothing greater can be conceived, with
  the usual premise that existence in reality is greater than existence in the understanding.
  The second is a Gödel-style modal argument: it defines God as a being with all positive
  properties, assumes that positive properties are necessarily positive, that necessary
  existence is positive, and that whatever is possibly instantiated is possibly necessarily
  instantiated, and concludes that God exists in every possible world. I want to see
  where each one passes, where it stalls, and what I should write to the authors.
  Include at least one case where the procedure tells me to do something I will not
  like -- for example, if it says I cannot reject a submission that I am confident
  is sophistical, or if it says a premise I find absurd is not procedurally defective.
  Finally, tell me what the procedure cannot do: which disputes about the ontological
  argument will remain disputes no matter how carefully I sequence the questions.
  I would rather have a committed recommendation, with reasons, than a neutral survey
  of options: if you think the procedure should be stricter or looser than I am asking
  for, say so and defend it. And do not give me a reading list or citations; I need
  the procedure itself, in a form I can paste into our submission-triage notes."


