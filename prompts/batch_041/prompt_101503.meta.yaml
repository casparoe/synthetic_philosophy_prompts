  Potential prompt:


  I am a doctoral student in philosophy writing a prospectus chapter on the epistemology
  of deductive inference, and I want to begin not with a defence of any particular
  account but with a specification of what an adequate account would have to accomplish.
  Please write the desiderata for a theory of deductive justification. I am interested
  in the version of the problem raised by Carroll''s tortoise, but I do not want the
  list to be organised around that puzzle alone; I want to know what any theory must
  deliver if it is to explain how a deductive step can be justified—both why the conclusion
  is warranted for the person who draws it and why the practice of drawing such steps
  is entitled to its place in inquiry.


  Then constraints:

  - distinguish justification of particular inferences from justification of inferential
  rules/practices; if theory collapses them, say why that''s a cost.

  - must handle the tortoise without either treating the conditional as a further
  premise (premise-inflation) or simply refusing to engage (quietism).

  - must respect the difference between failing to be persuaded and lacking justification;
  between psychological compulsion and normative entitlement.

  - must accommodate non-ideal agents: not logically omniscient, limited working memory,
  can be justified in inferring despite not seeing all consequences.

  - must say what it is to accept a rule, and whether acceptance is a propositional
  attitude, a disposition, or a policy; requirement that justification not depend
  on facts the agent cannot access (transparency/access condition) — mark whether
  this is genuine.

  - must handle cases where deduction seems to transmit justification but also where
  it fails: e.g., an agent reasons validly from inconsistent or unjustified premises;
  an agent uses a valid rule she cannot state; an agent reasons in a circle using
  a basic rule; multiple-conclusion or relevance-sensitive logics where classical
  rules may not preserve justification.

  - must not make every valid inference justified, nor make justification depend on
  the agent''s knowing the semantics of the logical constants in a way that leads
  back to Carroll.

  - must account for the normative force of logic: why logical error is criticisable;
  and for the distinction between deductive closure as ideal vs requirement.

  - requirement about explanatory priority: can''t just say "the rule is valid" because
  validity is a semantic property; need bridge to epistemic justification.

  - requirement about self-application: theory must not use deduction in a way that
  presupposes what it explains without owning the circularity (rule-circularity) —
  say whether that''s fatal.


