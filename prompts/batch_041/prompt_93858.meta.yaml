  "ok so I''m setting the final for my upper-level seminar on Kant''s practical philosophy
  and I need one essay question (90 min, closed book) on the animals material, plus
  a model answer and a marking scheme. The problem is every year half the class just
  writes ''Kant says we have no direct duties to animals, only indirect duties grounded
  in duties to ourselves, because cruelty to animals coarsens our feelings toward
  humans'' and then sits there. I want something that punishes that.


  Here''s the angle. One of my students (call her Priya) came to office hours with
  a fix she thinks rescues Kant. She says the standard reconstruction of the argument
  leans on a contingent empirical claim -- that being cruel to animals makes you more
  likely to be cruel to people, or at least blunts your sympathetic feeling -- and
  that this is both (a) an empirical premise Kant can''t really establish and (b)
  the wrong kind of ground for a duty anyway, because if the psychology turned out
  false the duty would evaporate, and a duty that disappears when the empirical premise
  fails isn''t a duty at all, it''s a piece of advice. So she wants to keep the ''indirect''
  structure but re-ground it: on her version, treating a creature that can suffer
  as a mere thing is itself an expression of a will that has failed to respect its
  own capacity to recognise value -- so the wrong is done to the agent''s own moral
  standing, not to the animal, and the wrongness doesn''t depend on any downstream
  hardening of character. She calls this a ''constitutive'' rather than ''causal''
  reading of the indirect duty.


  Write the essay question so that students have to (i) state the standard structure
  of Kant''s position accurately enough that you can tell whether they''ve actually
  read it, (ii) work out whether Priya''s repair is available to Kant or whether it
  quietly converts an indirect duty into a direct one (or into something else -- aesthetic
  self-regard, an expressive theory of wrongness, whatever), and (iii) say what Kant
  loses if he takes the repair, and whether there''s a reading on which he doesn''t
  have to. I also want them to have to say something about the epistemic half of the
  view -- the bit about our knowledge of other minds and why the same inference that
  gets us to other people''s pain seems to get us to a dog''s -- because that''s where
  the position is most vulnerable and it''s the part they always skip.


