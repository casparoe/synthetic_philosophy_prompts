  Model answer draft:


  Kant''s position has two distinguishable layers, and almost every confusion in the
  secondary literature comes from running them together.


  The first layer is a claim about the *form* of the moral relation. Duties, for Kant,
  bind a will; a being can be the object of a duty only if it can in principle be
  a subject of one — i.e., only persons, beings with reason and the capacity to be
  self-conscious and to obligate themselves. Animals fail that test. So there can
  be no duty *to* a dog. Yet Kant also wants to say that gratuitous cruelty to animals
  is genuinely wrong, not merely imprudent. He gets both by distinguishing duties
  *to* a being from duties *with regard to* a being: the animal is the object of the
  act, but the duty''s addressee is the agent himself. The second layer is the *ground*
  of that self-regarding duty. In the Lectures on Ethics Kant''s stated ground is
  causal and psychological: cruelty to animals dulls the shared feeling of sympathy
  and thereby makes us more likely to treat human beings with the same coldness. Hence
  the wrongness of torturing a dog is parasitic on the wrongness of torturing a person,
  and the duty is discharged or violated in the agent''s own character.


  Two things follow, and they are the two hinges of the question.


  (a) If the psychological premise is empirical, the duty looks hostage to it. Kant
  seems to treat it as a claim about human nature — and if a particular person could
  be cruel to animals without any softening of his attitude to men, the indirect view
  has nothing to say about him. A duty that evaporates when a contingent premise fails
  looks like advice, not duty. (b) The epistemic half is worse. Kant''s reason for
  denying animals moral standing is that they lack self-consciousness; but his reason
  for believing that *other people* have minds is an inference from behaviour by analogy
  with our own case. The same inference that gets us to the pain of the person next
  to us gets us to the pain of the dog. If the analogy is good enough for persons,
  the personhood criterion is not doing the work Kant needs; if it is not good enough,
  it threatens other minds too. Kant needs the criterion to be independently knowable,
  and he never shows that it is.


  Priya''s repair is best understood as trying to keep the first layer and replace
  the second. On her constitutive reading, the wrong in cruelty is not a predicted
  downstream coarsening of character but something done *in* the act: to treat a creature
  that can suffer as a mere thing is to exercise a will that has failed to recognise
  value where value is present, and *that* failure is a failure with respect to one''s
  own moral standing, since the standing consists precisely in the capacity to recognise
  and respond to value. The wrong is thus non-contingent, and no empirical premise
  is needed.


  Does the repair work? It buys the non-contingency at a price. Three options:


  1. It converts the view into a direct-duty view. If the wrong consists in a failure
  to respect value that is actually present in the animal, the natural addressee of
  the duty is the animal, and the "regarding"/"to" distinction is doing no work —
  the animal is a value-bearer after all. That is coherent, and it is arguably what
  Kant''s own principles require, but it is not Kant''s view, and Priya has to concede
  that she has given up the personhood criterion rather than rescued it.


  2. It collapses into moral aestheticism. If the wrong is only the debasement of
  the agent''s own taste or self-image, then the animal''s suffering is doing no work;
  mutilating a corpse, or a realistic puppet, would be equally bad, and the view has
  the wrong subject matter. Kant''s causal story at least kept the animal''s suffering
  in the explanation.


  3. It works, but only on a reading on which the self-regarding duty is a duty to
  *preserve the conditions of morality in oneself* — and then the animal''s suffering
  matters because it is the occasion of the exercise of a capacity, not because it
  is a claim. This is the most defensible option and the hardest to state without
  smuggling in (1).


  And there is a reading on which Kant doesn''t need the repair at all: the psychological
  premise is not a prediction but an account of what sympathy is, so the duty is to
  keep intact a disposition that is partly constitutive of a good will; the "hostage
  to contingency" objection misfires because Kant is not claiming "cruelty causes
  cruelty" but "a will that can do this has already been deformed."


  Best answers will notice the dilemma is really about whether the indirect view has
  an independent subject matter, and will say which horn they take.


