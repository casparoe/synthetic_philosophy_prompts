  Question:

  "Strawson argues that the truth of determinism does not threaten moral responsibility
  because responsibility is a matter of our reactive attitudes. Explain what he means
  by the participant attitude and the objective attitude. Then distinguish, in his
  terms, between an excuse and an exemption, and use that distinction to discuss the
  following case: a man suffers a brain tumour that changes his personality; he becomes
  irascible and violent and commits a serious assault. Should we excuse him, exempt
  him, or neither? Justify your answer with reference to Strawson''s account."


  Student answer:

  "Strawson''s basic move is to say that moral responsibility is not a metaphysical
  fact about whether our wills are free; it''s a feature of the interpersonal practices
  in which we demand things of each other and react with resentment, gratitude, forgiveness,
  and so on. When we take the participant attitude, we treat someone as a member of
  the moral community, someone who can be addressed and who can answer for what they
  do. When we take the objective attitude, we treat them as an object to be managed,
  predicted, or treated -- as we might treat a child, a patient, or someone who is
  not fully a member of the community. Determinism is irrelevant because even if our
  actions are caused, we cannot help taking the participant attitude in ordinary life;
  it''s built into the human form of life. Strawson also distinguishes excuses from
  exemptions. An excuse applies when someone is still a participant but the particular
  action is not attributable to them in the normal way -- for example, they didn''t
  know what they were doing, or they were pushed. An exemption applies when someone
  is not a participant at all, and so not a candidate for the reactive attitudes --
  for example, a very young child or someone with a severe mental illness. In the
  tumour case, the tumour caused the man''s violence, so it looks like an excuse:
  he is still a person, but the act is not really his. If the tumour is severe enough,
  though, it becomes an exemption, because he is no longer capable of participating
  in the moral community. In that case we should take the objective attitude and stop
  blaming him. Strawson''s optimistic voice says we can continue to hold people responsible
  even if determinism is true, and I think he is right to say that the pessimistic
  worry is just a confusion. The only thing that matters is whether someone can participate
  in the practice; causation by a tumour is not enough to exempt, but it is enough
  to excuse."


  Subtle mistakes:

  1. "we cannot help taking the participant attitude in ordinary life; it''s built
  into the human form of life" — Strawson says we are naturally participant, but he
  doesn''t say we cannot help it; he acknowledges we can take the objective attitude,
  and the question is about the rationality/justification of our practices. This is
  a slight overstatement.

  2. "the tumour caused the man''s violence, so it looks like an excuse: he is still
  a person, but the act is not really his" — conflates causation with excuse. In Strawson''s
  terms, an excuse is about the action not being attributable in the normal way (ignorance,
  accident, compulsion), not simply being caused. A brain tumour causing behaviour
  is more like an exemption if it undermines the capacity to participate, not an excuse
  merely because it caused the act. Also "the act is not really his" is not quite
  Strawson''s notion of excuse.

  3. "Strawson''s optimistic voice says we can continue to hold people responsible
  even if determinism is true, and I think he is right to say that the pessimistic
  worry is just a confusion." — Misattributes to Strawson a straightforward siding
  with the optimist and dismissing the pessimist as confused. Strawson actually presents
  the optimist and pessimist as each expressing something important, and he does not
  claim the pessimist''s worry is simply a confusion; he says the question of the
  justification of the reactive attitudes cannot be settled by a theoretical argument
  about determinism. Also the student adds their own view, which is fine but misrepresents
  Strawson.

  4. Maybe "the objective attitude and stop blaming him" — objective attitude is not
  necessarily the same as ceasing to blame; it''s a different stance. But that''s
  okay.


