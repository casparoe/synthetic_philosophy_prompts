  else (e.g., the neural correlate), then the judgment could be systematically wrong/coincidental
  — the "paradox of phenomenal judgment" (Chalmers discusses this; also called "the
  paradox of epiphenomenalism"). This is nice and in the weeds but well-known enough
  to be in pretraining. The subtle mistake could be conflating the "self-stultification"
  argument (which is about the reliability of the judgment) with the "causal exclusion"
  argument (which is about the judgment being caused by the phenomenal state). Actually
  the classic formulation: if epiphenomenalism is true, then our judgments about qualia
  are not caused by qualia. So either (a) they''re caused by something else, and it''s
  a coincidence that they''re accurate — which is improbable, or (b) they''re not
  caused by anything relevant — the reliability problem.


