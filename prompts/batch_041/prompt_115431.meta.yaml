  "I have been reading around the debate between Dennett and Searle over original
  versus derived intentionality, and I want a diagnosis rather than a survey. Take
  Dennett''s vending machine example: a drink machine fitted with a coin detector,
  shipped by accident to a country where the coins are physically indistinguishable
  to its detector but are a different currency, so that the same internal state now
  responds to a different denomination — Dennett''s point being that the content of
  that state shifted with the environment and the machine''s history, with no change
  inside, and that nothing in our case is fundamentally different. Searle''s response
  is that this only shows the machine has as-if intentionality, since its states are
  not intrinsically about anything; real aboutness is a biological feature of brains,
  tied to consciousness. I find that after the cases are agreed on, the two sides
  simply restate their verdicts, and I cannot tell whether they disagree about a fact,
  about what a representation is, or about what an explanation of representation has
  to do. I am a software engineer with no philosophy training, and I care because
  I keep having to decide whether to describe the systems I build as representing
  anything or merely as responding to inputs; I want a definite diagnosis, with reasons,
  of what kind of disagreement this is, whether the two sides are even answering the
  same question, and what — a distinction, a case, an argument, or nothing — would
  actually move it. Please commit to a position rather than laying out the options,
