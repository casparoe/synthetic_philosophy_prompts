  already smuggle in the consciousness it is supposed to detect? (2) Is it really
  a third route, or just a restatement of one of the familiar ones in different words?
  (3) Does it wrongly deny consciousness to creatures we have good reason to think
  are conscious — and if so, does that refute the criterion or just show that my application
  of it is too strict? (4) What would change my mind, one way or the other?"


