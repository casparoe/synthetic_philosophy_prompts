  "I have been trying, on my own, to work out which animals are conscious, and I would
  like comments on my attempt — whether the reasoning holds up, where it is weakest,
  and whether the conclusion it reaches is better or worse defended than the usual
  ones. I am not looking for reading suggestions; I want to know if the argument itself
  works. Here is the gist of what I would put in an essay.


  The usual arguments, as I understand them, come in two flavours. One looks for behaviour
  — mirror self-recognition, guarding a wound, playing, deceiving — and argues that
  the behaviour would be hard to explain without consciousness. The other looks at
  the brain and argues that an animal wired like us in the relevant respects probably
  feels like us. Both leave me uneasy for the same reason: they tell me when a creature
  acts like us or is built like us, not when there is anything it is like to be it.
  A thermostat is built to hold a temperature; that does not make it care.


  So I want to try a third route. What I think distinguishes a conscious creature
  is not what it can do but whether it can be wrong about itself. A fish that jerks
  away from a hook may be in a state that drives it to escape harm, with nothing anywhere
  that registers the state as its own condition. By contrast, a creature that can
  mistake its own hunger for something else, or feel a pain in a limb that is no longer
  there, or take its own movement for another''s, has something that represents its
  own state as a state — and that, I want to say, is where there is something it is
  like.


  Then the creatures: on this test an insect probably fails, since nothing suggests
  it can be mistaken about itself as opposed to about the world; a fish is doubtful;
  a bird that fails or passes a mirror test...; an octopus is the interesting case
  because its arms seem to act semi-independently, which might mean no single thing
  represents the whole.


