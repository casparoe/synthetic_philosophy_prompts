  of self-trusting agents, e.g., a proof-based agent that must trust its own reasoning.
  The Löbian obstacle: an agent using a consistent formal system to reason about its
  own actions can''t prove that it will take the action its decision procedure recommends,
  roughly — if the agent''s theory proves "if I take action A then I get outcome X"
  ... The standard result: Löb''s theorem implies that a formal system S cannot prove
  "if S proves that doing A is good, then doing A is good" (i.e., cannot trust its
  own proofs) without proving everything, if it also can prove that its action equals
  what its proof search outputs. The implications: Vingean reflection, tiling agents,
  the need for a "modal fixed point" / infinite descent, the difficulty of self-modification,
  and how it relates to Gödelian problems in AI alignment.


