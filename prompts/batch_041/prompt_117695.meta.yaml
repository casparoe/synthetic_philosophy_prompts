  ---


  I help maintain the standard library of a formal proof assistant, and I am the reviewing
  editor for its analysis, algebra, and topology sections. A substantial fraction
  of incoming pull requests depend, usually without the author''s awareness, on some
  form of the axiom of choice, and our current practice is a single boolean field
  labelled "uses AC". That field is both too coarse and frequently wrong. It does
  not distinguish countable choice from dependent choice from the full axiom; it is
  filled in by authors who have never had to make the distinction; and it misses proofs
  that invoke a choice principle without noticing — selecting a representative from
  each equivalence class, silently fixing an enumeration for each member of a countable
