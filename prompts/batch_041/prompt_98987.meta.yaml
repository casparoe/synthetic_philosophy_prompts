  Then scenario:


  "Background: Aumann''s theorem says, roughly, that if two agents are Bayesian rational,
  have the same prior probabilities, and their posterior probabilities (and the fact
  that they have them) are common knowledge between them, then their posteriors must
  be equal. It does not say that any two people who share evidence must agree, and
  it does not say that disagreement is irrational in general. My friends Ravi and
  Lena both know this much."


  "Ravi and Lena are trying to forecast whether a local referendum will pass. They
  have read the same polls, the same economic data, and the same local news. They
  have also told each other their reasoning and their final probabilities: Ravi says
  70%, Lena says 40%. They are not trying to trick each other; each believes the other
  is generally intelligent and sincere."


  "Here is their exchange:


  Ravi: If we are both rational and we have shared all the evidence, we cannot really
  disagree. Aumann''s theorem says common knowledge of our disagreement is impossible
  under those conditions. So either one of us is being irrational, or we do not actually
  have common knowledge of each other''s reasoning.


  Lena: That is too quick. The theorem assumes a common prior. We did not start from
  the same prior. I grew up in a place where the polls systematically undercounted
  a certain kind of voter, and Ravi grew up in a place where they overcounted that
  kind of voter. Those experiences shaped our priors. Different priors, same evidence,
  different posteriors—no contradiction.


  Ravi: But we have now told each other about our priors. I know your prior and you
  know mine. If we are both rational, shouldn''t we now be able to compute what a
  rational agent with our combined information would believe? And if we can, why don''t
  we both move to that number? If we don''t, it seems we are each saying the other
  is making a mistake.


  Lena: Because we do not just have different priors; we also have private evidence
  about how reliable our own priors are. I know things about my hometown''s polling
  history that you do not know, and you know things about yours that I do not know.
  And even if we shared all of that, the theorem still requires common knowledge of
  the priors themselves, not just mutual knowledge. You knowing my prior and me knowing
  yours is not the same as each of us knowing that the other knows, and so on indefinitely.
  That common-knowledge condition is doing real work.


  Ravi: Then the theorem is almost empty as a practical tool. Any two people can always
  say, ''Different priors,'' or ''Not quite common knowledge,'' and walk away. It
  can never tell anyone that they are being unreasonable.


  Lena: It is not empty. It tells you where to look. If two people are rational Bayesians
  and genuinely share a prior and have common knowledge, then disagreement has to
  trace back to a failure of common knowledge or a failure of rationality. In our
  case, it traces back to different priors and private evidence. But there is a further
  point: the fact that you disagree with me is itself evidence. Since I think you
  are probably rational and probably have some information I lack, your 70% should
  push my 40% upward, and my 40% should push your 70% downward. We should not fully
  converge, because we are not certain about each other''s priors and rationality,
  but we should not ignore each other either.


  Ravi: But that is circular. If I raise my probability just because you disagree,
  I am treating your disagreement as evidence about the referendum. But your disagreement
  is just a report of your private reasoning. If I already think your reasoning is
  flawed because of your prior, why should I let it move me? And if I do let it move
  me, why stop at 55% instead of going all the way to 40%?


  Lena: It is not circular; it is Bayesian. Your belief about the referendum should
  depend on your belief about my reliability and about what my disagreement tells
  you about the evidence I might have. And we stop short of full convergence because
  neither of us is certain that the other is more reliable. If I became certain that
  you were perfectly rational and had all my evidence plus more, I should just adopt
  your probability. Since I am not certain, I should move partway."


