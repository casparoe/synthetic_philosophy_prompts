  and each knows the other''s probability. Ravi says: 70%. Lena says: 40%. Ravi says:
  "If we''re both rational Bayesians and we''ve shared everything, Aumann''s theorem
  says we can''t disagree; so one of us is irrational or we don''t actually have common
  knowledge." Lena says: "No—Aumann only applies if we started with the same prior.
  We didn''t. I grew up in a town where polls always underestimated the right, you
  grew up in a town where they overestimated. Our priors differ, so disagreement is
  fine." Ravi replies: "But we''ve now shared our priors too. If we both know each
  other''s priors and evidence, shouldn''t we update to a common posterior? Otherwise
  how can we each think the other is rational?" Lena says: "Because each of us also
  has private evidence about our own prior''s reliability—e.g., I know my family''s
  history of being wrong. And Aumann''s result doesn''t say agreement is rationally
  required when priors differ; it says common knowledge of priors plus posteriors.
  We don''t have that." Ravi: "Then the theorem is nearly empty: any real disagreement
  can be explained by different priors, and you can never use it to criticize someone."
  Lena: "Not empty—it tells you where to look: either different priors, non-common
