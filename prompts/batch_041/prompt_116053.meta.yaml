  Strawson''s Basic Argument (from "Freedom and Resentment" no — from "The Impossibility
  of Moral Responsibility", Philosophical Studies 1994, and "Luck Swallows Everything"
  TLS 1998):

  (1) Nothing can be causa sui — nothing can be the cause of itself.

  (2) In order to be ultimately morally responsible for one''s actions, one would
  have to be causa sui, at least in certain crucial mental respects.

  (3) Therefore, no one can be ultimately morally responsible.

  The regress: you do what you do because of the way you are; to be truly responsible
  you''d have to be responsible for the way you are; that would require being responsible
  for the way you are in virtue of having intentionally brought it about; which requires
  a prior way you were such that you brought that about; regress. Works whether determinism
  or indeterminism is true (indeterminism adds randomness, doesn''t help — the "luck"
  swallows everything). He calls himself a "pessimist" vs "optimists" (compatibilists).
  He also says he can''t help but hold people responsible; he accepts that we can''t
  live without reactive attitudes; his claim is about "true" or ultimate responsibility.
  He also has the "thank goodness" / "the impossibility of ultimate responsibility
  doesn''t matter" — and he''s noted he has no interest in the question of whether
  we should stop punishing. Also, in later work, he distinguishes "the Basic Argument"
  in a form where premise (1) is about self-creation; he emphasizes it''s not the
  consequence argument (his argument doesn''t rely on determinism), so it''s distinct
  from hard determinism / incompatibilism about determinism.


  Common misreadings to build the false summary around:

  - "Strawson thinks determinism is true and therefore nobody is free" — wrong; his
  argument is independent of determinism.

  - "Strawson thinks we should stop blaming and punishing people / abolish criminal
  justice" — he explicitly says the argument doesn''t have such practical implications
  and he''s skeptical of that move; he''s called a "pessimist" not an activist for
  abolition.

  - "Strawson thinks nobody ever acts freely / freedom is an illusion" — he distinguishes
  freedom of action from ultimate responsibility; he grants we act freely in a compatibilist-ish
  sense of doing what we want.

  - "since you didn''t create yourself, no one is ever responsible for anything, so
  nothing matters" — conflation of ultimate responsibility with responsibility in
  the ordinary sense.


