  (or "famine is a political crime, not a natural disaster" hmm) and wants the precise
  claims disambiguated: readings:

  1. Trivial/tautological: "disasters" as socially defined events require social harm,
  so hazards aren''t disasters without exposure/vulnerability. (Nothing is a disaster
  without people.)

  2. Causal: social/political factors (vulnerability, entitlements, markets, transport,
  entitlements collapse) are necessary and often the dominant causes of famine deaths.

  3. Strong: natural hazards play no causal role at all / are never part of the explanation.
  (False — potato blight was real, drought was real.)

  4. Normative/attributive: responsibility for famine deaths lies with political actors,
  so "natural" is an excuse, an exculpating frame.

  5. Methodological: don''t use "natural" as an explanatory terminus; it forecloses
  inquiry.

  6. Definitional: the term "natural disaster" is an oxymoron / "disaster" is inherently
  social.

  7. Pragmatic/rhetorical: it''s a slogan to move attention to policy.

