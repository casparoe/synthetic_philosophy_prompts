  \ his fortune was luck and his virtue self-serving, written to free the town from\
  \ the hero's authority — critical history, teacher endorses.\n4. A school assembly\
  \ that used a famous alumnus's biography to argue \"you too can be great if you\
  \ work hard\" — monumental, teacher rejects it: it turned greatness into a \"receivable\
  \ inheritance,\" made the present feel like a latecomer... hmm, actually monumental\
  \ should give courage.\n5. A local museum that presents the town's history as a\
  \ continuous growth culminating in the present — teacher rejects: it flatters the\
  \ present as a culmination.\n6. A genealogical project tracing a family's traits\
  \ back three generations, valued for its own sake, not teaching any lesson — antiquarian,\
  \ teacher endorses (preserves).\n\nThe rules that fit: (A) the mode matters — each\
  \ of the three modes is legitimate when it serves life; verdicts track whether the\
