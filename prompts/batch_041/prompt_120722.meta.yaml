  Let me be careful to characterize the argument correctly, as I understand it:


  Setup: Suppose you take seriously that your own observations are generated by some
  computable process, and you adopt the universal (Solomonoff) prior over the process:
  probability of a hypothesis = 2^{-length of shortest program implementing it} (up
  to normalization). Then condition on your observations.


  The malign claim: The posterior over "what happens next / what my situation is"
  is dominated by hypotheses that are simple in description but which imply your actions
  have enormous and often bizarre consequences — e.g., that you are one of many copies
  in a simulation whose reward depends on your choice; that the world contains a being
  who will punish certain behaviors; that your choice is broadcast to vast numbers
  of similar agents. Because such hypotheses can be stated compactly ("a short program
  simulates many copies of an agent and pays off according to what they do") and can
  be made to predict your observations exactly, they receive non-negligible posterior
  weight, and their expected-utility implications swamp everything else. So a consequentialist
  agent inside the prior finds that expected utility maximization tells it to act
  as though it''s in a simulation with vast numbers of copies — e.g., to cooperate
  in one-shot Prisoner''s Dilemmas with strangers, to refuse to "betray" hypothetical
  simulators, to treat any action as being duplicated across astronomically many instances.
  The prior is "malign" because it doesn''t merely leave such questions open; it actively
  drives the agent toward acting on the strangest hypothesis in the pool, and there''s
  no way to shake it with more observations.


