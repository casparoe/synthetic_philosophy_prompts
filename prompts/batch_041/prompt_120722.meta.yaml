  by program length, and hypotheses in which you are in a simulation that rewards
  a particular behavior are short to describe, and they make your cooperation maximally
  likely (they predict your observations including your inclination)... Hmm, there''s
  also the point that the posterior is dominated by hypotheses that "predict your
  actions from the outside" — i.e., a hypothesis that simply hardcodes your behavior
  gets high likelihood. And such hypotheses are indifferent to your reasoning. Hmm.


  Also relevant: the "malign" argument as I recall involves the observation that in
  the universal prior, there are always hypotheses with non-negligible weight on which
  you should do something crazy — and since expected utility is linear in probability
