  Actually, pain asymbolia is a great fit for the fairness-audit type: a popularizer
  or a philosopher summarizing what asymbolia shows about the badness of pain. Common
  claims: asymbolia patients feel pain but don''t mind it, showing that pain''s unpleasantness
  is separable from its sensory component, and that the badness of pain is not intrinsic
  to the sensation. Subtle misrepresentations could include: conflating pain asymbolia
  with pain indifference / congenital insensitivity; treating the dissociation as
  showing pain''s badness is purely a matter of the affective-motivational component;
  claiming that asymbolics "don''t feel pain"; the claim that this refutes the view
  that pain is essentially unpleasant; confusing "asymbolia" with "analgesia" (in
  Greek, "asymbolia" means loss of the ability to interpret symbols/signs, coined
  by von Monakow, and used by Schilder for pain asymbolia). Also the claim that it
  shows pain is not bad in itself but only bad because of suffering. Also the "pain
  is not intrinsically bad" debate — e.g., the paradox of pain / pain''s badness.
  Also the meta-ethical point: if pain can be felt without being bad, then badness
  is not essential to pain.


  Let me recall the actual literature. Pain asymbolia: patients with parietal lobe
  lesions (posterior insula, parietal operculum) who report feeling pain but do not
  withdraw, do not find it unpleasant, sometimes smile. Berthier, Starkstein, Leiguarda
  (1988) studied it. Also the classic case descriptions by Schilder (1931), and Pötzl.
  Nikola Grahek''s book "Feeling Pain and Being in Pain" (2007, MIT Press) is the
  key philosophical treatment — he distinguishes pain without painfulness (asymbolia)
  from painfulness without pain (pain without pain? he discusses "pain experience
  without pain sensation" in some cases). Grahek argues asymbolia shows that the sensory
  and affective dimensions of pain are dissociable, which is a challenge to both "pain
  is essentially unpleasant" views.


