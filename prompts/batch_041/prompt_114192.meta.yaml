  Let''s design commitments for impact measures/low-impact AI.


  Domain question: can "avoid side effects" be defined without a full specification
  of value?


  Commitments:

  1. A well-behaved agent should be low-impact: it should avoid side effects, unnecessary
  collateral changes, and irreversible disruption to the world.

  2. Any determinate impact measure must relativize impact to some baseline or default
  trajectory; without a baseline, the notion of side effect has no content.

  3. The baseline/default cannot be the agent''s own current policy or the policy
  it would have followed absent the task, because that makes low impact circular or
  gameable: an agent can make the baseline bad and then claim its actions are improvements.

  4. A full specification of value is unavailable and probably impossible to state
  in advance; we cannot rank all possible worlds or all changes.

  5. Therefore, low-impact behavior must be defined using a partial, task-relative,
  or counterfactual criterion that does not require a full value ordering.

  6. Impact measures should be part of the agent''s objective, not merely a constraint
  applied after the fact, because otherwise the agent has no incentive to seek low-impact
  ways of achieving its goal.

  7. It is possible to distinguish side effects from intended effects without knowing
  the full value function: intended effects are those the agent''s task representation
  treats as part of the goal, side effects are the rest.


  Potential tensions:

