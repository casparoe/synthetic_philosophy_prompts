  We can make commitments:

  1. Low impact is a genuine desideratum: agents should avoid side effects, where
  a side effect is a change the agent causes that is not part of the task it was given.

  2. A side effect can only be identified relative to a baseline trajectory. There
  is no baseline-free fact about what counts as a side effect.

  3. The baseline should not be the agent''s own default policy, because an agent
  can manipulate what its default policy would have been, and because the counterfactual
  is self-referential.

  4. The baseline should be the no-further-intervention trajectory: what the world
  would do if the agent took no further actions, with the rest of the world evolving
  according to its ordinary dynamics.

  5. A full value specification is neither available nor necessary for low-impact
  behavior. Impact can be assessed with a partial, task-relative criterion: changes
  are side effects when they are not required by the task specification and would
  be dispreferred by a wide range of plausible value functions.

  6. The task specification is not a value specification. It tells the agent what
  to achieve, not what to preserve. So (5) does not smuggle in a full value ordering.

  7. Impact avoidance should be a hard constraint rather than a term in the objective,
  because if it is merely a penalty, the agent will trade side effects against task
  success and may accept enormous collateral damage for small gains.

  8. It is possible to distinguish intended from side effects without a full value
  specification: intended effects are those entailed by the task specification under
  the agent''s plan; side effects are the rest.


