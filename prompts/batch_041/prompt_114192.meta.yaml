  Commitments:

  1. I take low-impact agency to be a genuine and important desideratum: an agent
  should avoid side effects, meaning changes it causes that are not part of achieving
  its assigned task.

  2. I accept that side effects are baseline-relative. There is no fact of the matter
  about whether a change is a side effect independent of some baseline trajectory
  against which it is a divergence.

  3. I reject the idea that the baseline can be the agent''s own default policy, because
  that counterfactual is self-referential and manipulable: the agent can make its
  default policy worse to make its actual policy look better.

  4. I propose the baseline be the no-further-intervention trajectory: the trajectory
  the world would follow if the agent took no further actions, with everything else
  evolving according to its ordinary dynamics.

  5. I deny that a full value specification is needed for low-impact behavior. A partial
  criterion suffices: side effects are divergences from the baseline that are not
  required by the task specification and that would be dispreferred by a sufficiently
  broad set of plausible value functions.

  6. I distinguish the task specification from a value specification. The task tells
  the agent what to bring about; it does not tell the agent what to preserve. So using
  the task to identify intended effects does not smuggle in a complete value ordering.

  7. I think impact avoidance should function as a hard constraint rather than as
  a penalty term in the objective. If it is merely a penalty, the agent will trade
  side effects against task success and may accept large collateral damage for small
  gains.

  8. I think intended effects can be identified without a full value specification:
  they are the effects entailed by the task specification under the agent''s chosen
  plan; side effects are whatever else diverges from the baseline.


