  about it, then say where Anderson would have parted company with him.


  The case: a small country''s tourism and culture ministry, wanting a distinctive
  national brand, commissions a generative-AI system to compose a body of folk songs,
  a founding legend, and a calendar of festivals in a regional dialect; the material
  is released without any claim that it is old, and within a decade the songs are
  sung at weddings, the festivals are on school calendars, and a political party invokes
  the legend to argue for tighter borders. Meanwhile a diaspora community of a few
  million people, scattered across three continents, speaking different first languages
  but living in one English-language online platform, has begun to call itself a nation
  and to demand recognition, a flag, and a seat at international bodies, with no territory
  and no shared vernacular print culture. Take Hobsbawm first: does the invented-tradition
  apparatus still apply when the invention is advertised rather than concealed, when
  there is no lapse of time for forgetting to do its work, and when the inventor is
