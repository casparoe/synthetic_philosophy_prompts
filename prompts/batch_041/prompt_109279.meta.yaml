  Key facts I know:

  - Popper in *The Poverty of Historicism* and *The Open Society* was generally sympathetic
  to Darwinism as a scientific theory of evolution, but critical of "historicism"
  and of evolutionary "laws of development."

  - In *Objective Knowledge* (1972), chapter "Evolution and the Tree of Knowledge,"
  he discusses natural selection.

  - In *Unended Quest* (1974/1976 autobiography), he wrote that Darwinism is not a
  testable scientific theory but a "metaphysical research programme." He argued that
  "survival of the fittest" is tautological/close to tautological: fitness is defined
  by survival, so the theory is nearly unfalsifiable. He compared it to a metaphysical
  research programme.

  - Then in "Natural Selection and the Emergence of Mind" (1978, Dialectica; delivered
  as the first Darwin Lecture at Darwin College, Cambridge, 8 November 1977), he recanted:
  he said he had changed his mind about the testability and the logical status of
  the theory of natural selection. He said natural selection can be reformulated as
  a testable theory — roughly, that given a variety of competing variants and a limited
  environment, some variants will be eliminated and others survive; and one can make
  testable predictions about relative survival. He still thought it worked as a research
  programme.

  - The Elgin & Sober paper ("Popper''s Shifting Appraisal of Evolutionary Theory,"
  HOPOS 7 (2017): 31–55) argues Popper changed the subject, not his mind: the earlier
  claim was about the tautology problem for the *principle* of natural selection (fitness
  defined as survival), while the later "testable" formulation was about a more specific
  empirical claim (variation + selection + inheritance + limited resources → change).
  So the "recantation" is not straightforwardly a reversal of the same claim.

  - Important nuance: Popper never thought Darwinism was *unscientific* in a dismissive
  sense; metaphysical research programmes are valuable and can be rationally criticised.
  He was also critical of "fitness" being defined in terms of survival, and he distinguished
  "the survival of the fittest" as near-tautological from the empirical claims of
  Darwinism.

  - Also, Popper accepted natural selection as a mechanism for the evolution of life,
  but he thought the *theory of natural selection* as a universal statement was not
  falsifiable, because whatever survives is by definition fit. He suggested that to
  make it testable, one must specify independently what traits are fit, or make predictions
  about which variants will survive.

  - Popper also thought Darwinism has a "metaphysical" component that is not testable
  — e.g., the claim that all life has common ancestry, or that selection is the only
  mechanism — but he thought that component is heuristic and can be criticised.

  - Another nuance: Popper''s earlier critique came partly from his falsificationism
  and his critique of "historicism" — he thought evolutionary theory should not be
  used to predict future development of species or society.

  - Popper also in *Objective Knowledge* argued that the theory of natural selection
  is not a law of nature but a scheme for explanation; he compared it to a "situational
  logic" — you explain a particular outcome by specifying the situation and the selection
  pressures, but the general principle itself is not testable.

  - Popper was also critical of the idea that natural selection explains the emergence
  of mind — he thought there was a problem of "emergence" that needed a different
  account (interactionism with Eccles).


  Common misrepresentations:

  1. "Popper said Darwinism is not science / is pseudoscience / is unscientific."
  That''s wrong — he said it''s a metaphysical research programme, which is not the
  same as pseudoscience; metaphysical programmes are not empirically testable but
  can be rationally appraised, and he valued them.

  2. "Popper later recanted and admitted Darwinism is a fully testable scientific
  theory." That''s an overstatement — he changed his mind about the testability and
  logical status, but he still called it a research programme, and he didn''t just
  say it''s a standard falsifiable theory. Also Elgin & Sober argue he changed the
  subject.

  3. "Popper said ''survival of the fittest'' is a tautology, therefore Darwinism
  is empty." That''s partly right but overstated: he said it''s close to tautological
  *if fitness is defined as survival*; the fix is to define fitness independently.
  Also he didn''t say the whole theory is empty.

  4. "Popper thought natural selection is unfalsifiable and therefore worthless."
  Wrong — he thought it''s a valuable research programme and that it can be made testable
  in certain formulations.

  5. "Popper''s recantation was total and unqualified." Overstated.

  6. "Popper thought Darwinism is a law of nature." Wrong — he thought it''s not a
  universal law but a situational scheme.

  7. Conflating the tautology charge with the metaphysical research programme charge:
  they are related but distinct. The tautology charge is about the *principle* of
  natural selection; the metaphysical programme charge is about the *whole theory*
  including its historical claims.

  8. Conflating Popper''s critique with creationist critiques: Popper''s critique
  was methodological, not a denial of evolution. He accepted evolution.


