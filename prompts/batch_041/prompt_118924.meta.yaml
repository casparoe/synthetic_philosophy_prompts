  Hmm, but does The Remains of the Day fit "integrity objection / one thought too
  many"? The connection: Williams says the moral point of view must not be the point
  of view from which the agent''s life is justified; a person''s ground projects give
  them reasons that aren''t impartial. Stevens is a person who has subordinated his
  whole life to a project (professional dignity/service) — and the Williams apparatus
  would say the project is what gives his life meaning, and morality (impartial morality:
  "you owe your father attention," "you should tell Miss Kenton you love her," "you
  shouldn''t serve a fascist sympathizer") demands he step outside it. The novel''s
  sting: the project was misplaced, and yet Stevens''s dignity is a real value. So
  the reading question: does the novel vindicate Williams''s insistence that the agent''s
  own project be respected, or does it show a case where the "integrity" defense is
  precisely what allows great harm (complicity with appeasement, cruelty to his father
  and Miss Kenton)? That''s a genuinely interesting and slightly in-the-weeds reading.
  And the "one thought too many" element: the husband-and-wife case is about partiality
  in love; Stevens''s failure is precisely that he never allowed himself the partial
  thought — he always gives the "professional" reason. So the novel dramatizes the
  cost of the impartial standpoint as a way of life: the character who acts only from
  the general/professional point of view is hollowed out. And Williams''s point that
  a "character" is partly constituted by such commitments. Good.


