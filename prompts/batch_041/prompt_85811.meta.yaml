  I am a doctoral student in metaphysics, and before I commit to a position on the
  identity of indiscernibles I want to have the specification written down: the desiderata
  that any adequate account of the matter has to satisfy. I am not asking you to defend
  a principle. I am asking for the requirements list — what the account must get right,
  which cases it must handle, which distinctions it must respect, which results it
  must not contradict — with the consideration behind each requirement, and with a
  verdict on which requirements are non-negotiable and which are commitments of a
  particular camp rather than genuine constraints. The part I care about most is the
  possibility that the list is inconsistent with itself: if some subset of the requirements
  cannot be jointly satisfied, identify the subset and show the conflict, because
  that would be the argument of my paper.


  Set the target as an account that (i) keeps the standard logic of identity — reflexivity,
  symmetry, transitivity, and the indiscernibility of identicals — unless it argues
  explicitly for revising it; (ii) issues a determinate verdict on each of the cases
  below; and (iii) does not settle the question by appealing to what we could know
  or could describe, since the issue is metaphysical, not epistemic. The account must
  state, as part of the specification, whether the principle it defends is a necessary
  truth, a contingent regularity, or a constraint on how descriptions describe worlds;
  and it must not be trivially true, which rules out counting properties such as being
