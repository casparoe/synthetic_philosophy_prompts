  "properties" among the indiscernibility-relevant ones.


  The cases the account has to handle:


  1. A world containing exactly two iron spheres, otherwise empty, arranged so that
  their configuration is symmetric: same size, same mass, same intrinsic properties,
  and, since there is nothing else in the world, the same relational profile as well
  (each is one mile from a sphere of that size and mass). Does the description describe
  one thing, two things, or an incoherent world? Whatever the answer, it must not
  be reached by stipulation.

  2. The same two spheres embedded in an asymmetric world, so that each bears different
  relations to its surroundings. Here a relational version of the principle is satisfied;
  but relations such as being a mile from the other sphere presuppose that there are
