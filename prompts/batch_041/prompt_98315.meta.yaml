  Potential prompt:


  "Consider the debate protocol for scalable oversight in AI safety. In the version
  I have in mind, two AI systems are given the same question and asked to argue for
  opposing answers; a human judge, who cannot solve the question on their own and
  may have no domain expertise, reads the arguments, may ask follow-up questions,
  and then decides which side is right. The judge''s decision is used both to grade
  the episode and, in some proposals, to train the debaters. The protocol is supposed
  to scale oversight: it lets a weak judge supervise a strong model by forcing the
  model''s claims into an adversarial exchange where falsehood is harder to defend
  than truth.


  I want an account of what philosophical commitments this practice presupposes. Start
  by reconstructing the implicit theory of the protocol: what it assumes about truth,
  justification, and rationality; what it assumes about the human judge''s epistemic
  capacities; what it assumes about the relationship between winning a debate and
  being correct; and what it assumes about the stability of deception under cross-examination.
  Then distinguish what the practice strictly requires from what it merely fits well
  with. For instance, does it need the strong claim that the truth is uniquely defensible
  in adversarial argument, or only the weaker claim that a truthful debater has an
  advantage over a deceptive one? Does it need a correspondence theory of truth, or
  is it compatible with deflationism, pragmatism, or a verificationist view? Does
  it presuppose that there is a fact of the matter about the question being debated,
  and if so, what kind of fact? Does it presuppose that the judge can recognize valid
  reasoning without being able to produce it, and is that assumption coherent given
  the competence-without-comprehension literature?


  Then identify the rival views the practice quietly rules out. For example, does
  it rule out the possibility that a sufficiently capable deceptive model could win
  a debate against an honest one? Does it rule out the view that human judgment is
  so opaque or biased that no judge can reliably track the better argument? Does it
  rule out the view that oversight requires the overseer to comprehend the domain
  rather than merely adjudicate? Does it rule out a purely consequentialist or purely
  procedural account of the protocol''s justification?


  Finally, say where the practice is philosophically underdetermined, so that several
