  Content: "I am preparing a session that pairs Thomas Hobbes''s philosophy of geometry
  with Edwin Abbott''s Flatland. Hobbes treated geometry as the one branch of knowledge
  whose certainty is secure, and he located that certainty in construction: we can
  know the objects of geometry because we make them, and its definitions are ours
  to lay down by fiat rather than discoveries about a mind-independent realm. He also
  held that reasoning just is computation with words, and he insisted that the whole
  of philosophy should follow the geometric method. And he is, of course, remembered
  for the embarrassing fact that he spent years convinced he had solved the classical
  problems — squaring the circle above all — and for the long, humiliating public
  quarrel with a professional mathematician who showed he had not.


  Flatland tells the story of A Square, a being in a two-dimensional world, who is
  visited by a Sphere and cannot be brought to see the third dimension except through
  slices and analogies; when he tries to preach the gospel of a higher dimension to
  his own world, he is silenced and imprisoned. Read the novella through Hobbes''s
  philosophy of geometry. What does Hobbes''s constructivism predict about whether
  a Flatlander could ever possess geometric knowledge of three dimensions, as opposed
  to mere faith or hearsay? Does the Sphere''s failure to demonstrate the third dimension
  vindicate Hobbes or expose a limit of his view? Where does the novella dramatize
  Hobbes''s nominalism about definitions — the idea that the definitions are laid
