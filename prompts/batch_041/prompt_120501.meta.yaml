  "Bit of an odd request. I''m a freelance science-and-ideas journalist, mostly covering
  AI and philosophy of science, and I''ve been trying to write a piece about why the
  ''research programme'' picture of science still feels more realistic to working
  scientists than Popper''s falsificationism does. I keep coming back to The Prestige
  -- the Nolan film, not the novel, though I know it''s based on one -- because the
  rivalry between Angier and Borden has always read to me like two competing research
  programmes in the Lakatosian sense: each has a hard core he won''t give up, a protective
  belt of tricks and sacrifices he''ll adjust instead, and a question of whether the
  whole enterprise is progressive or just degenerating into obsessiveness. Borden''s
  transported man is built on a secret he can''t share; Angier''s version requires
  going to Tesla and literally duplicating himself, which seems like it should count
  as abandoning the hard core of stage magic altogether. I want a proper reading of
  the film through Lakatos, not just a cute analogy. What is the hard core of each
  magician''s programme, what''s in the protective belt, and which one (if either)
  is progressive in Lakatos''s sense -- predicting novel facts, generating new problems,
  etc.? And where does the film''s obsession with secrecy and personal rivalry cut
  against Lakatos''s insistence that a research programme is a public, communal, historically
  extended thing? I''m especially interested in whether the film''s own three-part
  structure -- the pledge, the turn, the prestige -- is doing any real philosophical
  work here, or whether it''s just a narrative trick that makes us confuse being fooled
  with being persuaded. If the analogy breaks down, say where, and tell me what the
  film gets right about how people actually defend a core commitment when the anomalies
  pile up. I''m teaching a night class on philosophy of science next month and want
  to use the film without misleading people, so be honest about the limits."


