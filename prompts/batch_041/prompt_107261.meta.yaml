  I''m a doctoral student in philosophy of mind, and I''ve spent the past year in
  a reading group with two colleagues — one an illusionist about phenomenal consciousness,
  the other a phenomenal realist — whose exchanges have hardened into mutual incomprehension.
  I''d like the document that a good-faith adversarial collaboration between them
  should have produced, and I want it in a form both could actually put their names
  to.


  To make the exercise bite, adopt the following three-way disambiguation of what
  "illusionism" might mean, and have each side locate itself and the other within
  it (or explain why the trichotomy is itself misleading):


  (i) eliminativism: there are no phenomenal properties, and "phenomenal consciousness"
  names nothing at all;

  (ii) fictionalism: phenomenal discourse is a useful fiction, not a description of
  anything real;

  (iii) no-further-fact (or "deflationary") illusionism: introspective reports are
  about real, reportable mental states, but these states have no phenomenal properties
  over and above their functional/representational ones — the "illusion" is only that
  we take there to be such a further property.


  Then produce:


  1. A numbered set of agreed claims — the substantive propositions both can sign.
  Include what both accept about the existence and character of introspective judgments,
  about the meta-problem (why creatures like us come to talk and think in phenomenal
  terms), about which no-go or explanatory-gap arguments do and don''t establish what,
  and about what would count as progress. Keep these non-vacuous: a claim that any
  position would accept doesn''t belong here.


  2. The precise residual disagreements, each phrased in the words its own side would
  use, and flagged as either substantive or merely verbal (if you judge a dispute
  verbal, say which part and why).


  3. The cruxes: the sub-questions such that settling one would move at least one
  side. For each, state a case, argument, or empirical result both sides would agree
  bears on it, and record each side''s prediction about it in advance.


  Throughout, distinguish what is settled among people who work on this from what
  is genuinely contested, and do not present a contested view as the consensus. Note
  explicitly where the illusionist side is not a single view — the three readings
  above already pull it apart — and where the realist side is likewise a family rather
  than one position.


  End the document with a final line of exactly the form

  \answer{...}

  containing a short phrase naming the single deepest remaining crux.


