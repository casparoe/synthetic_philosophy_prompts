  The activity concept: "The Transformer''s Desk" / "Build a Picture Language." Participants
  are split into small teams ("museums"). Each team is given a set of propositions
  (a fact base) that they must communicate to a rival team using only pictograms and
  no words. They have a standardized set of pictogram stamps/tiles. Then teams swap
  and try to "read" each other''s charts and report what they think it says. The mismatch
  between intended and read meaning is the reveal.


