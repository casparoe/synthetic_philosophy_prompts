  Neurath, a central figure of the Vienna Circle, spent the 1920s and 1930s building
  a pictorial statistics system — first the Vienna Method of Pictorial Statistics
  at the Museum of Society and Economy in Vienna, later called ISOTYPE — for presenting
  social and economic facts to ordinary citizens across a polyglot empire. His slogan
  was ''Words divide, pictures unite.'' The system had a first rule: greater quantities
  are shown not by enlarging a pictogram but by repeating an identical one, each standing
  for a fixed amount. The pictograms were standardized, abstract, and flat. But Neurath
  also knew the limits of his own creation: he insisted it was never meant to replace
  verbal language, called it a ''language-like technique'' rather than a full language,
  and relied on a human ''transformer'' to convert dry statistics into a sketch for
  a self-explanatory chart. I want students to rediscover both the ambition and the
  limits from the inside: to try to make pictures carry meaning with no words, to
  hit the wall where the pictures stop being self-explanatory, and only then to learn
