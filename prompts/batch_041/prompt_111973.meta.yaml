  1. "In 1929, one in ten workers was unemployed." (simple magnitude)

  2. "Unemployment fell from 1930 to 1932 but is still higher than in 1925." (change
  over time + comparison)

  3. "If wages rise, unemployment will not fall immediately." (conditional + negation)

  4. "The city might spend more on housing next year." (modality/future/uncertainty)

  5. "The council ought to prioritize housing over roads." (normative)

  6. Something about uncertainty/error bars.


  The teams must, for each statement, produce a chart with no words. They''ll invent
