  Idea for Chesterton''s fence: A research proposal on whether Chesterton''s fence
  can be formulated as a precise epistemic principle with a defensible prior, distinguishing
  it from status quo bias — with a case study. The "new/niche ideas" to inject: e.g.,
  a distinction between the fence''s *function* and its *beneficiaries*; the "fence"
  might serve a function for some group at others'' expense (a fence can be a wall
  excluding people) — that''s a nice twist: Chesterton''s metaphor assumes the fence
  is a public good protecting travelers, but many inherited institutions are fences
  *against* people (enclosure, gated communities). So a proposal: "Chesterton''s fence
  for whom?" — the principle should be reformulated as asking not just ''what does
  this do'' but ''whose problem does it solve, and who bears its cost''. That''s an
  interesting, non-standard angle, genuinely tractable philosophically, and it doesn''t
  need citations. Also there''s the epistemological asymmetry issue: the conservative
  may be equally ignorant; the fence might be an accident (a "spandrel"), or maintained
  by a self-interested group (public choice theory), or "path dependence". Also: the
  principle as a burden-shifting rule interacts with inductive evidence that some
  reforms succeeded; and there''s a "meta-fence" problem (does the principle apply
  to itself? e.g., to the practice of deferring to tradition?).


