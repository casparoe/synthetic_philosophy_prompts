  — "a presumption in favour of any settled scheme of government against any untried
  project" — and the "partnership" idea: society as a contract between the dead, living,
  and unborn. So the proposal could ask: is Burke''s presumption of the same species
  as Chesterton''s fence? Burke''s is based on the accumulated wisdom of ages / prescription;
  Chesterton''s is based on ignorance of function. Different epistemic status: Burke''s
  is a claim about the superior knowledge of the collective over the individual (a
  Hayekian/aggregation argument), Chesterton''s is about *the possibility* of hidden
