  Design considerations:

  - Perspective: software engineer, no formal philosophy background. Casual. Maybe
  a typo.

  - Type: speech for an occasion. Occasion: after-dinner speech at a relaunch/anniversary
  dinner of a psychical research society (or a "skeptics and believers" group). Audience
  mixed.

  - Domain: Sidgwick''s views on psychical research.

  - Inject niche idea: the app / pre-registered census idea; also inject the Census
  of Hallucinations details so the model doesn''t need to recall them.

  - No citations; tell the model not to worry about names/dates.

  - The philosophical idea must do structural work: Sidgwick as founding skeptic;
  the evidential ideal of "exact and unimpassioned inquiry" applied to mass testimony;
  the moral stakes (dualism) that made him care; the discipline of not claiming more
  than the evidence supports, and of not pretending to believe.

  - The speech must land for both believers and skeptics: comfort without falsehood;
  skepticism without contempt.


