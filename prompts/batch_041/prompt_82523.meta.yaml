  Draft:


  "Both kinds of cluelessness arise from the same fact — that the consequences of
  what we do extend further than we can follow — but they are different in kind and
  have very different implications for act consequentialism.


  Input cluelessness is the familiar predicament of an agent who lacks the evidence
  or the computational power to work out the expected consequences of her options.
  It is a practical obstacle, not a theoretical one: the facts are there to be discovered,
  and a sufficiently informed and sufficiently fast reasoner would see them. The remedy
  is more research or more careful deliberation, and the only interesting question
  is how much of each is worth its cost.


  Ripple cluelessness is not like that. The causal ripples of any act propagate indefinitely
  — the stranger who is nudged into a different mood, the norm that is strengthened
  or weakened, the child who is not born because two people met at a party that I
  did or did not attend. Because these chains are sensitive to contingencies that
  are arbitrary from any evaluative point of view, no accumulation of evidence would
  ever let us close the gap, and the standard for what counts as a good reason to
  act is never met. It is this second kind that is the serious problem, and it is
  serious because it threatens the connection between the theory''s criterion of rightness
  and any procedure an agent could actually use.


  The first reply holds that the ripples are individually negligible, so that the
  total is dominated by the near effects and our ordinary judgments are safe. This
  reply succeeds, and it is worth seeing why. Since the ripples of an act spread out
  in every direction, the favourable and the unfavourable ones offset one another,
  and the expected sum converges on the effects we can see. Ripple cluelessness is
  thereby reduced to input cluelessness: the far future is not a source of a special
  kind of ignorance, only a place where our ordinary ignorance is stretched thin.


  The second reply is more modest and, I think, plainly correct. Expected value is
  a sum over the possible outcomes weighted by their probabilities; whether we can
  compute that sum has no bearing on whether it exists. The criterion of rightness
  for act consequentialism therefore does not depend on what any agent knows, and
  ripple cluelessness cannot show the theory to be false. Since the theory survives
  intact, cluelessness is not really a problem for the theory or for the agent, and
  the anxiety it provokes is misplaced.


  It is also worth asking whether the problem can be dodged by shifting from acts
  to rules or dispositions. A rule consequentialist evaluates the rule rather than
  the token act, and the consequences of a rule are more predictable than those of
  an act, because the law of large numbers smooths out the idiosyncratic effects of
  any particular application. So a consequentialist who is troubled by ripple cluelessness
  should prefer rules, or at least a dispositional version of the theory, which promises
  guidance where the act-based version falls silent.


  There is one more point worth making, which I think is the deepest. Ripple cluelessness
  is at bottom a case of moral uncertainty. If we cannot trace the consequences of
  an act into the far future, we cannot say which of our theories has jurisdiction
  over the strange states of affairs we may have brought about, and so we cannot say
  what would even count as getting it right. The cluelessness is therefore not merely
  about the facts; it reaches the standards by which the facts would be assessed.


  The upshot is that ripple cluelessness is a genuine and distinctive problem, but
  not a fatal one. It tells us that act consequentialism is not a decision procedure,
  and that the interesting work lies in the theory of what an agent with our limitations
  ought to do."


