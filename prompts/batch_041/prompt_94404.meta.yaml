  Let''s design the argument carefully.


  Characters: Friend M and Friend N. Asker is I.


  Setting: We were discussing a proposal for a campus election. The proposal: "Each
  voter assigns each candidate a score from 0 to 5. The two candidates with the highest
  total scores advance to a runoff. In the runoff, each voter''s ballot is counted
  as a vote for whichever of the two finalists they scored higher; if they scored
  them equally, their vote is split equally. The winner is the finalist with more
  votes." This is like STAR voting but with equal scores. Let''s call it "score-then-runoff."


  Friend M: "This rule is strategy-proof. In the scoring round, you can''t do better
  than giving your honest scores, because the runoff will always pick the finalist
  you prefer. If you exaggerate, you might change which two finalists advance, but
  that can only hurt you: you''d be swapping a finalist you like for one you like
  less."


  Friend N: "That''s not right. The scoring round is a plurality-like election, and
  it is manipulable. Suppose your sincere scores are A=5, B=3, C=0. If the likely
  finalists are B and C, and you prefer B to C, you might score B=5 instead of 3 to
  help B make the runoff against C. If you score honestly, A and B might split the
  moderate vote and C sneaks in. So you have an incentive to misrepresent B as equal
  to A."


  Friend M: "But that''s not misrepresentation. The ballot asks for scores, not rankings.
  If you want B to win over C, giving B a 5 is a truthful statement about how much
  you want B to win relative to C. There''s no fact of the matter about your ''true''
  score independent of the strategic situation. Strategy-proofness is about misrepresenting
  a fixed preference ranking; here there is no fixed ranking to misrepresent."


  Friend N: "That can''t be right. We can describe your preferences perfectly well:
  you prefer A to B and B to C. The fact that the ballot has more expressive room
  doesn''t mean you can''t misrepresent those preferences. If you give B a 5, you''re
  saying you are indifferent between A and B, which you are not. The theorem''s point
  is that any non-dictatorial rule can be gamed by someone who knows the other ballots.
  Your rule is no exception. The runoff doesn''t save it."


  Friend M: "The theorem assumes voters have ordinal preferences over candidates and
  the rule picks a single winner. But our rule uses cardinal information. Cardinal
  information is not reducible to ordinal preferences. If I give A=5 and B=5, I''m
  not saying I''m indifferent in the ordinal sense; I''m saying I want both to advance.
  The theorem doesn''t apply."


  Friend N: "The theorem can be extended to cardinal rules. And even if it couldn''t,
  the practical problem remains: a voter who knows the distribution of other scores
  can often improve the outcome by not reporting her true scores. That''s what strategy-proofness
  means. You''re retreating to a definitional dodge."


  Friend M: "It''s not a dodge. If the rule asks for a score, then the score is the
  preference. There is no independent preference to be faithful to. You''re assuming
  a ranking that the rule doesn''t ask for. If you want to call that manipulation,
  then every expressive act is manipulation."


  Friend N: "No, the independent preference is the one that determines which outcomes
  you prefer. You prefer A to B to C. That''s a fact about you. The rule gives you
