  Goal: Present an argument that seems to prove too much and ask where it goes wrong.
  Could be about REU and risk aversion. Let''s formulate a chain:


  (1) A rational agent''s preferences over lotteries should depend on the whole distribution
  of outcomes, not just its expected value; in particular, an agent may care about
  how bad the worst outcomes are relative to the best, and may discount good outcomes
  that are only reachable through risky steps. That''s risk-weighted expected utility.


  (2) REU with a risk function r (concave, r(0)=0, r(1)=1) represents such an agent:
  for a lottery with outcomes x1 ≤ ... ≤ xn and probabilities p_i, value = x1 + sum_{i=2..n}
  (x_i - x_{i-1}) r(∑_{j=i..n} p_j). So probability mass on top outcomes is transformed
  by r.


  (3) If r is strictly concave, the agent is risk averse: for any non-degenerate lottery
  L, the agent prefers its expected value for sure to L (assuming monetary outcomes).


  (4) Consider a sequence of independent positive-expected-value gambles: each gamble
  gains 1 with prob 0.6 and loses 1 with prob 0.4. Expected value +0.2. But a sufficiently
  risk-averse REU agent may reject a single gamble.


  (5) The same agent, offered the choice to accept or reject each gamble sequentially,
  will reject each one, because each is a non-degenerate lottery with positive expected
  value but risk-weighted value below its expected value; if the risk aversion is
  strong enough, the risk-weighted value is below 0.


  (6) Rejecting every positive-expected-value gamble means the agent is guaranteed
  to end where they started.


  (7) But if the agent were offered a single compound lottery equal to the sum of
  all N independent gambles, its expected value is 0.2N, and by the law of large numbers
  the probability of a loss tends to 0 as N grows. For large N, the compound lottery
  is nearly a sure gain.


  (8) A rational agent should not reject a lottery that is arbitrarily close to a
  sure gain of 0.2N in favour of a sure 0. This is a dominance-style principle: if
  one option first-order stochastically dominates another by a large margin, choose
  it.


  (9) Therefore risk-weighted expected utility with a fixed concave risk function
  must be wrong, because it licenses a pattern of choices that is dynamically incoherent:
  rejecting each component but accepting the bundle, or rejecting a bundle that is
  almost a sure gain.


