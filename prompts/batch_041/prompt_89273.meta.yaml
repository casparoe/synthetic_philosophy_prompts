  Potential prompt:


  I am a software engineer with no formal philosophy background, and I have been sitting
  in on a reading group about decision theory. A friend there offered an argument
  that risk-weighted expected utility is not a correct theory of rational choice,
  and I cannot tell whether it is a trick or a genuine refutation. Risk-weighted expected
  utility, as I understand it, evaluates a lottery by sorting its outcomes from worst
  to best, taking the worst outcome as a baseline, and then adding the gaps between
  successive outcomes weighted not by the probability of that outcome alone but by
  a risk function applied to the probability of getting that outcome or better; the
  risk function is increasing, with r(0)=0 and r(1)=1, and if it is concave the agent
  is risk averse. The argument runs as follows. (1) A rational agent may be risk averse,
  and risk-weighted expected utility with a concave risk function represents such
  an agent. (2) For any non-degenerate lottery L, a sufficiently risk-averse agent
  prefers the expected value of L for sure to L itself. (3) Consider a lottery L that
  pays +1 with probability 0.6 and -1 with probability 0.4; its expected value is
  +0.2, but a sufficiently risk-averse agent assigns it a negative risk-weighted value
  and rejects it. (4) Now suppose the agent is offered N independent copies of L one
  after another, each time choosing whether to accept or reject that copy before seeing
  the next offer. At each stage the choice is exactly L plus whatever wealth they
  already have, so by the same reasoning they reject every copy and end with their
  initial wealth. (5) But the compound lottery consisting of all N copies has expected
  value +0.2N, and by the law of large numbers the probability of any loss tends to
  zero as N grows; for large N it is almost a sure gain of +0.2N. (6) A rational agent
  cannot prefer a sure zero to a lottery that is arbitrarily close to a sure gain
  of +0.2N. (7) Therefore risk-weighted expected utility with a fixed concave risk
  function licenses an irrational pattern of choices, so it is not a correct theory
  of rational choice under risk.


