  I am working through the literature on scientific continuity — the family of views
  that claim something survives when one successful theory is replaced by another,
  and that this something explains why the successor inherits the predecessor''s predictive
  successes. Before I commit to any of them (epistemic structural realism, ontic structural
  realism, the Ramsey-sentence strategy, and the entity-realist and selective-realist
  alternatives), I want the specification on the table: what any adequate account
  in this area must deliver, each requirement tied to the case or consideration that
  forces it.


  Work through the following, and add anything I have missed:


  Cases it must get right. The retention of the wave equation and Fresnel''s laws
  of reflection and refraction through the replacement of the elastic-solid aether
  by an electromagnetic theory of light; the fate of phlogiston and of caloric, where
  Carnot''s cycle survived a theory of heat that did not; the status of the classical
  gene once molecular genetics arrives, where it is contested whether the successor
  preserved the predecessor''s units or replaced them; and the electron, which was
  both referred to as an entity and embedded in equations, so that an account licensing
  only structural continuity must either explain that persistence or admit that a
  blanket ban on entity talk is untenable.


  Distinctions it must respect. Structure versus ontology; preservation of a predecessor''s
  structure versus mere reproduction of its predictions; continuity as a historical
  fact versus continuity as a licence for present-day belief; and the difference between
  what a theory says exists and what its formalism commits it to.


  Constraints it must satisfy. It must not simply dismiss the pessimistic induction
  as a historical generalization, nor the no-miracles intuition that motivates realism
  in the first place. It must identify the preserved structure by something stronger
  than a cardinality condition, or the thesis risks being trivially satisfiable by
  any successor. It must say whether the preserved structure is a feature of our theories
  or of the world, and if the latter, what it is about the world that lets successive
  false theories track it. And it must apply to a live theory, not only to settled
  history: I want to know what to believe about a current research programme, not
  just how to narrate the nineteenth century.


  One constraint I have not seen stated and want treated as a requirement: the verdict
  about what is being carried over must be available to a working scientist at the
  time, not only to a historian who already knows which successor won. Any account
  whose continuity claims can be issued only retrospectively is, for my purposes,
