  Let me double check the philosophical facts so the correction is right:


  - Newton''s bucket: water in a bucket, initially bucket and water at rest relative
  to each other; as bucket spins, water at first doesn''t move relative to bucket,
  then gradually acquires rotation, surface becomes concave. Newton: when the water''s
  surface is concave, the water is really rotating (has true rotation), and this is
  not relative to the bucket (since at the stage where relative motion between water
  and bucket is maximal the surface is concave; also when water and bucket move together
  at the end, the water is still rotating though relative motion is zero). So true
  rotation is not relative to other bodies — hence absolute space.


  - Standard philosophical reading: the bucket argument is an argument for absolute
  motion (acceleration/rotation), i.e., against the thesis that all motion is relative
  in the sense of relative to other bodies. It''s often taken as an argument for substantival
  space, but the inference from "there is absolute rotation" to "space is a substance/entity"
  is not immediate. Neo-Newtonian (Galilean) spacetime: absolute acceleration but
  no absolute velocity — so you can have absolute rotation without absolute rest/velocity.
  This directly addresses the second worry: no, absolute rotation doesn''t imply absolute
  rest; in Galilean spacetime there''s a privileged affine structure (absolute acceleration)
  but no privileged velocity, so "which things are really moving" has no absolute
  answer while "which things are accelerating/rotating" does.


  - Relationist responses: Mach — inertia and rotation are determined by the distribution
  of matter in the universe (so the bucket''s water rotates relative to the fixed
  stars); this is a relational alternative. Barbour & Bertotti''s best-matching /
  relational dynamics reproduces the bucket phenomena without absolute space (in a
  suitable idealized model). So relationism isn''t refuted; it needs a relational
  account of inertia/rotation. Earman''s "World Enough and Space-Time" discusses the
  bucket and relationism (the "rotating bucket" arguments). Also the debate over whether
  the bucket argument works at all given that the concavity could be explained by
  relational dynamics.


