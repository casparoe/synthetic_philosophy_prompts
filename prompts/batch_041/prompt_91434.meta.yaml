  means you can see whatever you want; conflating with top-down attention; conflating
  with perceptual learning; conflating with illusion knowledge (Müller-Lyer persists);
  assuming it implies epistemic badness.


  Novelist perspective: a novelist might be interested in perception, describing scenes,
