  The two camps: the irreconcilability camp holds that the trade-off results are decisive
  in spirit -- once two groups differ in base rate and the predictor is less than
  perfect, you cannot simultaneously have a score that means the same thing in both
  groups and error rates that match across groups, so something must be sacrificed,
  and which thing is sacrificed is a moral choice rather than a technical one. The
  artefact camp holds that those results are theorems about a narrow formalism --
  binary decisions, one protected attribute, exact parity, calibration defined one
  particular way -- and that once you allow randomization, approximate parity, group-specific
  thresholds, richer decision problems, or a causal/counterfactual rather than statistical
  characterization of a fair decision, the conflict either dissolves or becomes an
  ordinary constrained optimization problem with no special impossibility about it.
  We also kept sliding into a third question neither of us could state cleanly: whether
  an impossibility proved inside a formalism is a fact about the world, and whether
