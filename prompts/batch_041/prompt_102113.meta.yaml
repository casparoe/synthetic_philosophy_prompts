  relevant content is fixed. On one style, the experience itself is held back until
  the later stimulus has been registered, and is then constructed whole, so that nothing
  is ever experienced with the wrong colour or in the wrong place; on the other, the
  observer genuinely experiences the first dot in its own colour, but the record of
  that experience is quietly revised afterwards, so that what is remembered is a smooth
  colour-changing movement that never actually occurred as such. The first style revises
  before the fact, as it were, the second after it.


