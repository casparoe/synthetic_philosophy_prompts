  Potential prompt:


  "I''m a novelist, about 60 pages into a historical novel set in the eastern Mediterranean
  around the time of the Peloponnesian War (I know, another one). I''ve been reading
  a lot of old and new stuff on how we know anything about the distant past, and I''ve
  ended up with a working creed. I want you to tell me if it actually hangs together,
  because right now it feels like a bag of tools that don''t all fit in the same box.


  Here''s the creed:


  1. The past is only ever known through sources, and every source is a witness with
  an agenda. So the first question is never ''what happened?'' but ''who is telling
  me this, to whom, and why?''

  2. Thucydides is basically right that you should separate the real cause of a war
  from the grievances people said they were fighting over. If you don''t do that,
  you''re just transcribing propaganda.

  3. But Herodotus is basically right too: a lot of what we know about how people
  lived, what they feared, what they argued about, comes from stuff that a strict
  Thucydidean would throw out as gossip. The digressions are the point.

  4. I think hindsight bias is the cardinal sin of historical writing. The people
  I''m writing about didn''t know how it would turn out, and if I let the ending leak
  into their choices, I''ve written a costume drama, not a novel.

  5. At the same time, I think you can''t explain anything without knowing how it
  turned out. A narrative has to select, and selection means you know the ending.
  There''s no story without a shape, and no shape without hindsight.

  6. I think we should not psychologize ancient people with modern categories. Calling
  someone ''anxious'' or ''traumatized'' or ''dissenters'' in the modern sense is
  usually a category error.

  7. But I also think the only way to understand an ancient decision is to reconstruct
  the reasoning from the inside -- to ask what it would have been like to think that
  way, with those beliefs, in that situation. So I''m constantly using my own mind
  as a kind of instrument, which means using modern categories, at least as scaffolding.

  8. I think source criticism should include silences: the people who didn''t get
  to write, the records that weren''t kept, the things everyone knew and so nobody
  bothered to say. A source can be more revealing by what it assumes than by what
  it asserts.

  9. I think a historical novel has more freedom than a history, but that freedom
  makes it more responsible, not less. If I make up a speech, I''m making a claim
  about what was possible to think and say, and I can''t hide behind ''it''s fiction.''

  10. I think some accounts of the past are objectively better than others -- closer
  to the evidence, more honest about the gaps -- but I also think the past itself
  is not just sitting there waiting to be recovered. It''s constructed from the evidence
  we have, and the evidence changes.


  So: which of these are actually in tension, which only look like they are, and which
  one has to go if I want the rest? I''m not asking for a reading list or citations,
