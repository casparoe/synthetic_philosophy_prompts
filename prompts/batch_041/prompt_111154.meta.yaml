  that designates colour; and what designates colour is not what designates shape
  — so a white horse is not a horse. He then adds a second, sharper move. If you ask
  for a horse, a black horse or a yellow horse will do; if you ask for a white horse,
  neither will do. Were a white horse simply a horse, the two requests would be answered
  by the same things; but they are not, so the requests differ, and what answers to
  one does not answer to the other. Later in the dialogue the speakers worry about
  whiteness that is fixed to a particular thing as against whiteness considered on
  its own, and about whether white and horse can be prised apart within a white horse.
  The surrounding tradition of debaters, whose paradoxes survive mostly in the last
  chapter of the Zhuangzi, is full of cousins of this puzzle: a chicken with three
  feet, a shadow of a flying bird that never moves, a dog that is not a dog, a one-foot
  stick that is halved every day and never used up. Deadpan absurdity is very much
  the house style.


