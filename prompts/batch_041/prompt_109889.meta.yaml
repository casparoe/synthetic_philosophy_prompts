  Key theoretical contrasts:

  1. Classical: a term applies iff the object has necessary and sufficient features.
  Verdicts: sharp, all-or-nothing; if no common feature, the term is either not a
  real concept or ambiguous.

  2. Family resemblance (Wittgenstein): the extension is held together by a network
  of overlapping similarities; no single feature common to all; sharp extension boundaries
  aren''t required; the term can be applied to new cases by "going on the same way"
  (rule-following), and there can be cases where there''s no fact of the matter until
  the community decides.

  3. Prototype theory (Rosch): graded membership by similarity to a prototype; typicality
  predicts categorization; extension is graded, and there are "typicality" facts.

  4. Cluster/disjunctive (e.g., "cluster concept" à la Putnam on "water"? no, that''s
  stereotypes; "cluster" concept in the sense of a disjunction of criteria, or Searle''s
  cluster theory of proper names? Hmm, cluster concept theory often attributed to
  Wittgenstein and also to Putnam''s stereotype view).


