  Standard Judy Benjamin problem (van Fraassen 1981): Judy is dropped into a region
  divided into Red and Blue, and also into Second Company and Headquarters. Four quadrants:
  R∧S, R∧¬S, ¬R∧S, ¬R∧¬S. She has uniform prior 1/4 each. She then receives a radio
  message that she cannot be sure of: "I can''t tell whether you are in the Red area
  or in the Second Company area." This is interpreted as learning the conditional:
  if she is not in the Red area, she is in the Second Company area — i.e., ¬R → S,
  equivalently R ∨ S, equivalently ¬(¬R ∧ ¬S). So the probability of (¬R ∧ ¬S) goes
  to 0. This is a conditional with a false antecedent possibility. The remaining mass
  is on three quadrants: R∧S, R∧¬S, ¬R∧S. Prior probabilities 1/4 each. The question:
  how to redistribute the mass from the eliminated quadrant? The conditional probability
  P(R | R∨S) = (1/4)/(3/4) = 1/3. But does P(R) = 1/3? The information is about a
