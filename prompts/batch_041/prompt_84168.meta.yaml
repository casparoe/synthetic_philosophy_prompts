  philosophical literature on this, moral testimony and so on, but the novel I keep
  thinking about is Kazuo Ishiguro''s The Remains of the Day, and I want to read it
  through that lens for the piece. Stevens is basically a case study: he hands over
  his moral judgment to Lord Darlington wholesale — not just what to do, but what
  to care about, what to notice, what counts as a life well lived — and the Jewish
  maids get dismissed, and he keeps polishing the silver while his father dies upstairs,
  and thirty years later he''s driving across England trying to convince himself it
  was all fine. What I want from you: a real reading of the novel in terms of the
  moral-deference problem, not a summary. Where does the book actually dramatize the
  thing the philosophers are worried about, and where does it complicate or resist
  it? My own hunch, which I''d like you to push on, is that the interesting thing
  isn''t that Stevens defers — it''s the particular shape of his deference. He''s
