  Lewis''s "Do We Believe in Penal Substitution?" — the distinction between "substitution"
  in the sense that someone else is punished in your place vs. the debt-repayment
  model. Lewis''s key point: penal substitution in the strict sense (punishment transferred)
  is something we don''t actually believe in — e.g., we don''t think it''s just for
  an innocent person to be hanged in place of a murderer. But a related idea — the
