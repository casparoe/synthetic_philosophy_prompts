  \ isn't, even though bees have more neurons than fish? Actually fish have more neurons.\
  \ Or I think a newborn is conscious but a fetus at 20 weeks isn't, even though the\
  \ neural circuitry is similar. Or I think a split-brain patient has one consciousness\
  \ but a hypothetical person with two brains in one skull has two. The principle\
  \ might be \"consciousness requires a certain kind of integrated information\" (IIT)\
  \ or \"consciousness requires a global workspace.\" We can inject a new idea: \"\
  a friend of mine who works on insect neurobiology says insects have a 'mushroom\
  \ body' that does something like a global workspace, so by my own principle I should\
  \ call them conscious\" — that's a nice injection. Or \"I've been thinking about\
  \ the 'unfolding argument' against IIT\" — that's a real debate. The asker could\
  \ propose a tentative principle and ask for it to be tested.\n\nThis is also very\
  \ good and in-the-weeds. The distribution of consciousness across animals is a domain\
  \ that is meaningful for a model without web access, since it's about reasoning\
  \ from principles.\n\nWhich is better? The prompt type is \"Report one's verdicts\
  \ on a set of cases and ask what principle captures them.\" Both work. The reference\
  \ class problem is more abstract and the cases are about probability judgments;\
  \ the consciousness distribution is about which entities are conscious. I think\
  \ the consciousness distribution allows for more vivid, concrete cases and a more\
  \ natural \"verdict\" framing. Also, the asker can be a PhD student in cognitive\
  \ science, which fits.\n\nBut the reference class problem is perhaps more \"in the\
  \ weeds\" and less likely to be regurgitated. However, the consciousness distribution\
  \ is also a common topic. To make it in-the-weeds, we can inject new cases like\
  \ \"a brain organoid,\" \"a chimeric mouse with human glia,\" \"a person with a\
  \ hemispherectomy,\" \"a hypothetical AI trained on a large corpus,\" etc. And the\
  \ asker can propose a tentative principle (e.g., \"consciousness requires a certain\
  \ kind of recurrent processing loop\") and ask for it to be tested and repaired.\
  \ The hard-to-reconcile pair: e.g., \"I think a fish feels pain but a bee doesn't,\
  \ even though both have nociceptors and both show avoidance learning; and I think\
  \ a newborn is conscious but a fetus at 20 weeks isn't, even though both have thalamocortical\
  \ connections.\" That's a real tension.\n\nAlternatively, the paradox of voting:\
  \ the asker is a PhD student in political science or economics. Verdicts on voting\
  \ in different contexts. The hard-to-reconcile pair: \"I think it's rational to\
  \ vote in a national election (because of the expressive value) but I don't think\
