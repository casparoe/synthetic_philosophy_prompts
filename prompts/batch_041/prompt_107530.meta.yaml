reasoning_summary: "We need to write a prompt of the type \"Report one's verdicts\
  \ on a set of cases and ask what principle captures them\" on one of the domains.\
  \ Domains: distribution of consciousness across animals; paradox of voting; reference\
  \ class problem; Orwellian vs Stalinesque revisions (color phi phenomenon and timing\
  \ of experience); quantum immortality and quantum suicide.\n\nWe need to write a\
  \ casual prompt from a PhD student, elaborate, with verdicts on cases, asking for\
  \ a principle, including a hard-to-reconcile pair, and injecting new/niche ideas\
  \ into the prompt so models can't just regurgitate. Also, no citations/bibliographies;\
  \ avoid super niche theories LLMs won't have memorized. So we should invent or inject\
  \ new cases.\n\nWhich domain pairs best with \"report verdicts on cases, ask for\
  \ principle\"? The reference class problem is good: verdicts about which reference\
  \ class is appropriate in various cases (e.g., the probability that a coin is biased,\
  \ the probability a randomly selected person is a philosopher, the probability that\
  \ a given coin lands heads, etc.). The paradox of voting: verdicts about when it's\
  \ rational to vote, whether the probability of being pivotal matters. Distribution\
  \ of consciousness across animals: verdicts on which animals are conscious, ask\
  \ for principle. Color phi: verdicts on whether experience is delayed/reconstructed;\
  \ harder to make cases. Quantum immortality: verdicts on whether to accept quantum\
  \ immortality in various setups.\n\nThe prompt type: \"Report one's verdicts on\
  \ a set of cases and ask what principle captures them.\" So the asker gives their\
  \ gut verdicts on cases and asks what principle unifies them.\n\nI think the reference\
  \ class problem is very apt: you give verdicts about which reference class to use\
  \ for various probability judgments, and ask what principle underlies them. E.g.,\
  \ \"the probability that this coin comes up heads is 1/2\" vs \"the probability\
  \ that the next toss of this particular biased coin comes up heads is 0.9\"; \"\
  the probability I live to 90\" based on my cohort vs based on my family history;\
  \ \"the probability that a randomly chosen human is conscious\" etc. Then ask what\
  \ principle determines the reference class.\n\nAlternatively, the paradox of voting:\
  \ verdicts on when voting is rational in various elections, and ask what principle\
  \ captures when one should vote. Cases: national election where your vote won't\
  \ matter; local election decided by one vote; jury-style committee; voting in a\
  \ poll; voting when you're the only one who knows the truth; etc. Then ask for a\
  \ principle. The hard-to-reconcile pair could be: voting in a large election feels\
  \ pointless but you feel you should vote; voting in a small committee where you're\
  \ pivotal feels obligatory. The principle might be something about causal vs evidential\
  \ decision theory, or about the value of participation, or about the probability\
  \ of being pivotal. We could inject new cases: e.g., voting in a \"prediction market\"\
  \ vs actual vote; voting in a election where an AI has already predicted your vote;\
  \ voting in a \"liquid democracy\" where you can delegate. That's fun and niche.\n\
  \nBut the instruction says \"inject some sort of new / niche ideas into the prompt\"\
  \ so that models can't just regurgitate. For the reference class problem, we could\
  \ inject a new scenario: \"a friend of mine proposes a 'reference class auction'\
  \ where you bet on which reference class will be used\" etc. Hmm.\n\nLet me think\
  \ about which domain allows the most natural \"verdicts on cases\" prompt. The paradox\
  \ of voting is about rationality of voting; verdicts could be \"I think it's rational\
  \ to vote in a national election\" vs \"not rational in a single-issue referendum\
  \ where the outcome is a foregone conclusion.\" The principle could be about the\
  \ probability of being pivotal, or about the expressive value, or about rule-consequentialism.\
  \ This is a well-trodden topic, but we can make it in-the-weeds by injecting new\
  \ cases.\n\nThe distribution of consciousness across animals: verdicts on whether\
  \ fish, insects, octopuses, plants, simple neural nets are conscious. Ask for a\
  \ principle. This is also well-trodden but can be made in-the-weeds with new cases\
  \ like \"a brain organoid,\" \"a colony of ants,\" \"a sleeping human,\" \"a person\
  \ in a coma,\" \"a split-brain patient,\" \"a hypothetical animal with a distributed\
  \ nervous system.\" The principle could be about the presence of certain neural\
  \ structures, or about the function of consciousness, or about degrees. The hard-to-reconcile\
  \ pair: \"I think a fish feels pain but an insect doesn't, yet both have nociceptors\"\
  \ etc.\n\nThe color phi phenomenon and timing of experience: verdicts on whether\
  \ the experience of the second dot is delayed, whether the brain \"fills in\" the\
  \ color, etc. This is quite niche but LLMs may know it. The prompt type is less\
  \ natural: you'd give verdicts on cases like \"in the color phi, I think the first\
  \ dot's color is experienced after the second dot appears\" etc. Then ask for a\
  \ principle about the timing of experience. Could be done, but maybe harder.\n\n\
  Quantum immortality: verdicts on whether you should expect to survive quantum suicide,\
  \ whether it's rational to bet, etc. This is a fun one. Cases: a quantum suicide\
  \ machine with 50/50; a version with 99% death; a version where the machine kills\
  \ you if a radioactive atom decays; a version where the many-worlds interpretation\
  \ is true vs not; a version where an AI copies you. Ask for a principle. The hard-to-reconcile\
  \ pair: \"I think I should not fear the quantum suicide machine, but I also think\
  \ I should not bet my life savings on surviving it\" etc. The principle could be\
  \ about indexical uncertainty, self-locating belief, or about the difference between\
  \ first-person and third-person probability. We can inject new cases: \"a quantum\
  \ Russian roulette where the gun is fired by a conscious observer\" etc.\n\nI think\
  \ the reference class problem is the most naturally suited to \"report verdicts\
  \ on cases and ask what principle captures them,\" because the reference class problem\
  \ is precisely about which class to use, and people have verdicts about that. But\
  \ the paradox of voting also works well.\n\nLet's consider the instruction: \"the\
  \ prompts should be somewhat in the weeds of things, so that models can't just regurgitate\
  \ something they've seen a million times in pretraining.\" The paradox of voting\
  \ and reference class problem are both common. To make it in-the-weeds, we can invent\
  \ new cases and a tentative principle of the asker's own, and ask for it to be tested.\
  \ The type allows \"The asker may instead offer a tentative principle of their own\
  \ and ask for it to be tested against the cases and repaired.\" That's a good way\
  \ to inject novelty.\n\nAlso \"at least one pair that is hard to reconcile, so that\
  \ the answer has to choose between a principle that saves every verdict at the price\
  \ of complexity and a simpler one that overturns a verdict.\"\n\nLet me draft a\
  \ prompt for the paradox of voting.\n\nCasual PhD student voice. Maybe a political\
  \ science or philosophy PhD student. They're in a reading group on collective action.\
  \ They list verdicts on cases:\n\n- Voting in a national presidential election:\
  \ I do it, and I think it's rational/appropriate, even though my vote has essentially\
  \ no chance of being pivotal.\n- Voting in a local school board election decided\
  \ last time by 3 votes: I think it's clearly rational, maybe even obligatory.\n\
  - Voting in a referendum where polls show 70-30: I think it's still fine to vote,\
  \ but I don't think it's irrational to stay home.\n- Serving on a jury where the\
  \ verdict must be unanimous and I'm the only holdout: I think it's not just rational\
  \ but required to vote my conscience.\n- Raising my hand in a department meeting\
  \ where the chair's vote decides: I think it's rational to vote, but if I know the\
  \ outcome is already determined by proxies, not so much.\n- Voting in an online\
  \ poll about what color to paint the office: I think it's rational if I care, but\
  \ not if I don't.\n- Voting in a \"prediction market\" where I can bet on the outcome:\
  \ I think that's different, because there's a financial incentive, but the logic\
  \ is similar.\n- A case where an AI has already predicted how I'll vote and the\
  \ prediction is public: I still think I should vote, but I'm less sure why.\n\n\
  Then ask: is there a principle that gets all these? The hard-to-reconcile pair:\
  \ I think it's rational to vote in the national election but not irrational to abstain\
  \ in the referendum, even though both have a negligible chance of being pivotal;\
  \ and I think it's required to vote my conscience on a jury even if the outcome\
  \ is already determined by the other jurors' votes (say they've all agreed and my\
  \ vote won't change the verdict because it's not unanimous? Actually if it's unanimous\
  \ and I'm the holdout, my vote does matter). Hmm.\n\nMaybe better: The paradox of\
  \ voting is about whether it's rational to vote given the probability of being pivotal\
  \ is minuscule. Verdicts: voting in a large election is rational; not voting in\
  \ a large election is also rational; but voting in a small committee is obligatory;\
  \ and abstaining in a small committee is wrong. The principle might be something\
  \ about the probability of being pivotal times the stakes, or about the expressive/participatory\
  \ value, or about a rule-utilitarian duty. The hard-to-reconcile pair: I think it's\
  \ rational to vote in the national election (because of expressive value) but I\
  \ don't think it's rational to spend an hour writing a letter to my congressman\
  \ (because of expressive value)? That's not quite the paradox.\n\nAlternatively,\
  \ the reference class problem: verdicts about which reference class to use. Cases:\n\
  \n- The probability that this coin lands heads: I use the reference class of \"\
  this coin's past tosses\" if I know it's biased, otherwise \"fair coins.\"\n- The\
  \ probability that I live to 80: I use the reference class of \"people my age, sex,\
  \ health\" not \"all humans.\"\n- The probability that a randomly selected person\
  \ is a philosopher: I use \"adult humans\" not \"people in this room.\"\n- The probability\
  \ that the next President is a Democrat: I use \"past elections\" or \"current polls.\"\
  \n- The probability that a given raven is black: I use \"ravens\" not \"birds.\"\
  \n- The probability that this patient has disease X: I use \"patients with these\
  \ symptoms\" not \"all patients.\"\n- The probability that a randomly selected integer\
  \ is prime: I use \"integers\" but the density depends on the range.\n- The probability\
  \ that this particular radioactive atom decays in the next hour: I use \"atoms of\
  \ this isotope\" not \"this atom's history.\"\n- The probability that I will enjoy\
  \ this movie: I use \"movies I've liked\" vs \"movies of this genre.\"\n- The probability\
  \ that a given tweet is misinformation: I use \"tweets from this account\" vs \"\
  tweets on this topic.\"\n\nThen ask: what principle determines the reference class?\
  \ Is it the most specific class for which I have reliable statistics? The class\
  \ that is causally relevant? The class that is epistemically accessible? The class\
  \ that is \"natural\"? The hard-to-reconcile pair: I think the probability that\
  \ I live to 80 should be based on my cohort, but I also think the probability that\
  \ I live to 80 should be based on my family history, and these give different answers;\
  \ and I think the probability that this coin lands heads should be based on this\
  \ coin's history, but I also think it should be based on the physics of the coin,\
  \ which is a different class. The principle might be something about \"the narrowest\
  \ reference class for which the frequency is known\" (Reichenbach), but that leads\
  \ to paradoxes (e.g., the reference class of \"events that are exactly like this\
  \ one\" is a singleton). So the asker might offer a tentative principle and ask\
  \ for repair.\n\nThe reference class problem is very in-the-weeds and the verdicts\
  \ are natural. Also we can inject a new idea: \"a friend of mine proposes a 'reference\
  \ class auction' where you bet on which reference class will be used, and the winner\
  \ is the one that maximizes predictive accuracy\" — that's a novel twist. Or \"\
  I've been reading about the 'sleeping beauty' problem and I'm trying to see if the\
  \ same issue arises.\" Sleeping Beauty is a classic reference class problem. That\
  \ could be a nice injection: the asker connects the reference class problem to Sleeping\
  \ Beauty and asks whether their verdicts on Sleeping Beauty cases are consistent\
  \ with their verdicts on reference class cases. But Sleeping Beauty is well-known,\
  \ so maybe not novel enough. But it's a good in-the-weeds topic.\n\nThe instruction\
  \ says \"inject some sort of new / niche ideas into the prompt.\" We can invent\
  \ a new case or a new proposed principle. For the reference class problem, we can\
  \ have the asker propose a principle like \"the reference class is the set of events\
  \ that are exchangeable with the event in question given the information you have\"\
  \ — that's a real idea (de Finetti's exchangeability) but maybe not too niche. Or\
  \ we can have the asker propose \"the reference class should be the one that a well-calibrated\
  \ forecaster would use\" — that's a new twist. Then ask for the principle to be\
  \ tested.\n\nI think the reference class problem is the best fit. But let's also\
  \ consider the distribution of consciousness across animals, which is a hot topic\
  \ and allows for many verdicts. The asker could be a PhD student in cognitive science\
  \ or philosophy of mind. Verdicts:\n\n- A human adult: conscious.\n- A newborn infant:\
  \ conscious (maybe less so).\n- A fetus at 20 weeks: not conscious.\n- A dog: conscious.\n\
  - A fish: conscious (feels pain).\n- An octopus: conscious.\n- A bee: maybe a little\
  \ conscious? I think not.\n- A fruit fly: not conscious.\n- A nematode: not conscious.\n\
  - A plant: not conscious.\n- A brain organoid: not conscious, but I'm unsure.\n\
  - A person in a vegetative state: not conscious.\n- A person under anesthesia: not\
  \ conscious.\n- A split-brain patient: two streams of consciousness? I think one.\n\
  - A person with locked-in syndrome: conscious.\n- A hypothetical silicon-based AI:\
  \ conscious if it has the right functional organization.\n- A colony of ants: not\
  \ conscious as a whole.\n- A human brain simulated on a computer: conscious.\n-\
  \ A human brain with half removed: conscious.\n- A human brain with a cortical implant\
  \ that adds a new sense: conscious.\n\nThen ask: what principle captures these?\
  \ The principle could be about the presence of a thalamocortical system, or about\
  \ recurrent processing, or about global workspace, or about the capacity for valenced\
