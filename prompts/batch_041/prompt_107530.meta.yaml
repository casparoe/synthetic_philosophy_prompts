  \ (even though the expressive value is the same); and I think it's obligatory to\
  \ vote in a small committee where I'm pivotal but not in a large one where I'm not.\"\
  \ The principle could be about the probability of being pivotal, or about the value\
  \ of participation, or about rule-consequentialism. We can inject a new idea: \"\
  a friend of mine proposes a 'pivotal probability auction' where you can buy and\
  \ sell your vote's causal efficacy\" — that's a novel twist. Or \"I've been thinking\
  \ about the 'paradox of voting' in the context of AI alignment: if an AI can predict\
  \ your vote, does it still matter?\" That's a fun injection.\n\nI think the paradox\
  \ of voting is a classic, but we can make it fresh with new cases. However, the\
  \ instruction says \"the prompts should be somewhat in the weeds of things, so that\
  \ models can't just regurgitate something they've seen a million times in pretraining.\"\
  \ The paradox of voting is a common topic; the reference class problem is also common.\
  \ The consciousness distribution is also common. So we need to inject novelty.\n\
  \nLet's think about which domain the model is most likely to have a \"canned\" response\
  \ to. The paradox of voting: the model might just recite the standard arguments\
  \ (causal vs evidential, expressive voting, etc.). The reference class problem:\
  \ the model might recite Reichenbach's principle, etc. The consciousness distribution:\
  \ the model might recite the standard theories (IIT, GWT, higher-order theories).\
  \ To avoid regurgitation, we need to make the cases novel and the asker's verdicts\
  \ idiosyncratic, so the model has to reason from the cases rather than recall a\
  \ textbook answer.\n\nI think the reference class problem is the most amenable to\
  \ novel cases because it's about which class to use, and we can invent new classes.\
  \ For example:\n\n- The probability that this particular coin lands heads: I use\
  \ \"this coin's past tosses\" but if I know the coin is fair, I use \"fair coins.\"\
  \n- The probability that I will die of heart disease: I use \"people my age and\
  \ sex\" but I also use \"people with my cholesterol and family history.\"\n- The\
  \ probability that a given tweet is misinformation: I use \"tweets from this account\"\
  \ vs \"tweets on this topic.\"\n- The probability that the next president is a Democrat:\
  \ I use \"past elections\" vs \"current polls.\"\n- The probability that this patient\
  \ has disease X: I use \"patients with these symptoms\" vs \"patients with this\
  \ genetic marker.\"\n- The probability that a randomly selected integer is prime:\
  \ I use \"integers\" but the density depends on the range; if I pick an integer\
  \ from 1 to 10, the probability is different from 1 to 1000.\n- The probability\
  \ that a given raven is black: I use \"ravens\" not \"birds.\"\n- The probability\
  \ that I will enjoy this movie: I use \"movies I've liked\" vs \"movies of this\
  \ genre.\"\n- The probability that this atom decays in the next hour: I use \"atoms\
  \ of this isotope\" not \"this atom's history.\"\n- The probability that a given\
  \ person is a philosopher: I use \"adult humans\" not \"people in this room.\"\n\
  - The probability that the next ball drawn from this urn is red: I use \"this urn's\
  \ past draws\" vs \"urns of this type.\"\n- The probability that I have a disease\
  \ given a positive test: I use \"people who tested positive\" vs \"people with my\
  \ risk factors.\"\n\nThen the asker says: I can't find a single principle. Sometimes\
  \ I use the most specific class, sometimes the most natural class, sometimes the\
  \ class that's most causally relevant, sometimes the class that's most epistemically\
  \ accessible. And I have a tentative principle: \"use the narrowest reference class\
  \ for which you have reliable statistics\" (Reichenbach), but that fails for the\
  \ coin case because the narrowest class is \"this coin's past tosses\" which might\
  \ be too small, and for the integer case because the narrowest class is a singleton.\
  \ So I'm asking: what principle actually captures my verdicts, or do I have to give\
  \ some up?\n\nThe hard-to-reconcile pair: I think the probability that I live to\
  \ 80 should be based on my cohort (people my age and sex) but I also think it should\
  \ be based on my family history (people with my genes), and these give different\
  \ answers. And I think the probability that this coin lands heads should be based\
  \ on the physics of the coin (a deterministic system) but I also think it should\
