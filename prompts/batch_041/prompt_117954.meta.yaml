  ---


  I chair the board of a small education nonprofit. We run a six-week summer reading
  program for rising third and fourth graders in a mid-sized city: about 180 children,
  roughly $400,000 a year, funded almost entirely by one family foundation whose renewal
  decision comes up in the spring. Children whose schools are on our partner list
  may apply; we admit by lottery. Our own evaluation last summer found gains of about
  a tenth of a standard deviation over the comparison group, with a confidence interval
  that includes zero.


  At our last meeting, one of our trustees — a retired actuary who has been reading
  up on behavioral genetics — circulated a memo arguing that we should either change
  how we admit students or shut the program down. His reasoning, as fairly as I can
  restate it: (1) reading ability is highly heritable — twin studies put it around
  70 percent; (2) if genes account for most of the variation, then a six-week program
  can only be pushing on the small environmental remainder, which is why our evaluation
  found nothing; (3) recent work makes it possible to compute a "polygenic score"
  from a saliva sample that accounts for roughly a tenth of the variation in how far
  people get in school; (4) we should therefore collect samples (with parental consent),
  admit the children with the highest scores, and thereby get a much larger effect
  for the same money — and the same score could tell us which children are most likely
  to benefit from the program in the first place. He has asked for a vote in March.


  A second trustee, a former elementary school principal, says this is all beside
  the point, because heritability is "just a ratio for one population at one time"
  and tells you nothing about whether a program works. I think she is right in spirit,
  but when the actuary asked her what heritability figures would look like if our
  program worked, she did not have an answer, and the room drifted toward his side.


  I have ten minutes at the next meeting and then I have to take questions. Please
  help me prepare. I want to know: whether the inference from the heritability figure
  to "our program cannot work" goes through, and if not, exactly where it breaks;
  what does follow about our program''s prospects if we take the figure at face value;
  whether the score-based admission plan makes sense, and what would have to be true
  for it to deliver the improvement he promises; what to say to the second trustee;
  and what we should actually do in March. Assume I am reasonably numerate but not
  a specialist, and skip the reading list — I need the argument I can stand behind
  in the room.


  ---


