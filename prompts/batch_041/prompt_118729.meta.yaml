  be an ''a'' to someone who has never seen this script — while looking unlike any
  ''a'' they have seen before. I assumed this would be a pleasant puzzle. It has turned
  into a year of arguing with myself and with my editor.


  My working method, adopted for consistency: all twenty-six glyphs are assembled
  from the same small inventory of strokes placed on the same fixed grid, and any
  transformation I apply to one glyph I must apply to its relatives — whatever I do
  to turn ''b'' into ''d'', I must also do to turn ''p'' into ''q''; whatever distinguishes
  ''a'' from ''o'' in one weight must distinguish them in the next. This keeps the
  script coherent and makes new glyphs almost write themselves. The trouble is ''a''.
  To get an ''a'' that satisfies the system I have to either smuggle in a stroke no
  other glyph uses or break one of the transformation rules, and when I do, the result
  is a shape that is perfectly consistent and no longer looks like an ''a''.


  My editor''s position is that if a reader needs the surrounding context, or a key,
  or a moment''s hesitation, then it is not an ''a'' — the glyph has failed, and the
  system, not the reader, should give way. My position, when I am being honest, is
  that this cannot be right either: every ''a'' any reader has ever met is already
  a wildly different shape — roman, italic, blackletter, a child''s scrawl, a digital
  face — and they read them all. Whatever makes them all ''a'' is not any particular
  arrangement of strokes. But then I cannot say what it is, which makes it hard to
  know when my system should bend and when my glyph is simply wrong.


