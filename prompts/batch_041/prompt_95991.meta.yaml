  One more design consideration: the exam question should be unanswerable by reciting
  "the demon must erase, erasure costs kT ln2." So the question should force students
  to confront:


  (a) The accounting: the second law is about the whole cycle; a demon that never
  resets its memory doesn''t return to the initial state, so no violation is demonstrated
  — but this is a point about the demon''s *implementation*, and it doesn''t by itself
  show *where* the entropy is produced. Distinguish "the demon fails for a reason
  internal to thermodynamics (measurement/erasure costs kT ln2)" from "the demon fails
  because the cycle is never closed."


  (b) The measurement cost vs. erasure cost debate: Szilard''s original analysis located
  the cost in measurement (or in the entropy of the measurement record); Bennett moved
  it to erasure. Some argue the measurement can be done for free (reversibly), so
  the cost must be in erasure — but this is delicate because a reversible measurement
  leaves the record correlated with the gas, and the "cost" reappears when you erase;
  if you never erase, the record''s entropy counts.


  (c) The objection: Landauer''s principle is a theorem about a specific model (a
  bit stored as a double-well with a thermal bath and a specific protocol); it is
  not a consequence of the second law alone, and in some formulations the entropy
  accounting requires a coarse-graining / a choice of which degrees of freedom count
  as the memory. So one can''t claim the demon is exorcised by a general "information
  is physical" principle without doing the accounting. There''s also the "Landauer''s
  principle is not needed: the demon fails because of the finite size of the demon"
  line.


  (d) What survives: the demon is exorcised, but the reason is either (i) a trivial
  bookkeeping point (any closed cycle returns entropy), or (ii) a substantive physical
  claim about the cost of information processing. Students should say which, and identify
  what empirical content the substantive claim has (e.g., that it makes a difference
  to the minimum heat of a real computer).


