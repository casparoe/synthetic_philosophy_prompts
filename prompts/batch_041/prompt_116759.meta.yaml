  I want that to go, and I have noticed that I have been using the last few weeks
  to try to decide it, which is itself a slightly alarming thing to catch oneself
  doing, since the entire point of the double lock was to force exactly this kind
  of question to be argued slowly and in public rather than settled by whoever happens
  to be standing at the front of the room.


