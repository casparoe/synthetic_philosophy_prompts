  undergraduates, a handful of alumni, and, because the dinner is the one event of
  the year to which families come, a fair number of parents and partners who have
  never read anything the society has ever argued about. Two years ago, when I was
  on the committee, I wrote and campaigned for what we ended up calling the double
  lock. It works like this: the founding articles can be amended only by a two-thirds
  majority at a general meeting, followed by a written case published to the whole
  membership, followed by a second two-thirds vote at the next annual general meeting
  a full year later. Everything else the society does — budgets, the term''s motions,
  membership rules, the constitution of the committee itself — changes by simple majority
  on the night. The double lock was my answer to a worry I still think was real: that
  a society like ours, in a bad year, will be tempted to solve its problems by quietly
  dismantling the things that make it worth belonging to, and that the temptation
  will feel most urgent at exactly the moment it should be refused.


