  We can write:


  "I am preparing a position statement for a workshop on frontier AI governance, and
  I want a consistency check before circulating it. I hold the following views:


  1. There is a real alignment tax: for a fixed level of capability, safety measures
  (interpretability, oversight, red-teaming, staged deployment, etc.) usually raise
  costs, slow iteration, or reduce performance on benchmarks, at least in the short
  run.

  2. The competitiveness constraint is binding: in a market with several capable actors
  and no enforceable global cartel, any lab that unilaterally pays a significant alignment
  tax will tend to lose talent, capital, and influence to labs that do not.

  3. Because the constraint is binding, the only durable safety measures are those
  that are capability-neutral or capability-enhancing; measures that require permanent
  sacrifice will be selected against.

  4. Alignment is technically solvable, and a solved alignment method would be cheap:
  once we know how to build a system that reliably pursues intended goals, the marginal
  cost of safety would be low.

  5. Therefore, the main problem is not the alignment tax but the transition: we need
  to survive the period before alignment is solved, when the tax is high.

  6. In that transition, unilateral restraint by one lab is not only permissible but
  morally required, even if it cedes advantage to less cautious actors.

  7. I am also committed to the view that we should not treat the competitiveness
  constraint as an excuse for inaction; if a safety measure is right, we should take
  it regardless of what competitors do.

  8. Finally, I think open-sourcing frontier model weights is pro tanto bad because
  it irreversibly lowers the cost of misuse, but I also think that concentrated control
  of frontier models by a few labs is pro tanto bad because it concentrates power.


  Which of these are in tension, which only appear to be, and what is the least costly
  revision? Please order tensions by severity and say what each would require me to
  give up."


