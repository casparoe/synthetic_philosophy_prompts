  Verisimilitude commitments audit:

  1. Scientific progress consists in increasing verisimilitude, not just predictive
  success.

  2. Verisimilitude is a real, language-independent relation between a theory and
  the world.

  3. We can sometimes know that theory B is closer to the truth than theory A, even
  when both are false.

  4. The content-based definition of verisimilitude—according to which a theory is
  closer to the truth the more true consequences and fewer false consequences it has—is
  the right one.

  5. The 1974 trivialization result shows that on the content-based definition, any
  two false theories can be made to count one as closer than the other by adding conjuncts,
  so the definition fails.

  6. I am a scientific realist: the aim of science is true, or approximately true,
  theories.

  7. I am also a fallibilist: we can never be justified in claiming that our current
  theories are approximately true, only that they are empirically adequate.

  8. I think the pessimistic induction gives us reason to expect our current theories
  to be false.


