  Idea: distinguish two claims that simultaneity debates run together:

  (1) *Inevitability of occurrence*: given the state of a field, someone was going
  to make this move soon. (Strong evidence: two people did, independently, within
  months.)

  (2) *Inevitability of content*: the discovery would have taken the same form no
  matter who made it. (Much weaker; the actual content is shaped by the discoverer''s
  other commitments — notation, metaphysics, the questions they were already asking.)


  The speaker''s thesis: simultaneity is good evidence for (1) and almost no evidence
  for (2). And the practical upshot for graduates: your work will be "in the air"
  in the (1) sense — you will be raced — but the specific thing you make will bear
  your fingerprints in the (2) sense, and that''s the part worth caring about; also,
  credit is a social process, so build the communities that will recognize your work
  rather than trusting that merit will be recognized automatically. Hmm, that''s a
  nice commencement landing: not "you don''t matter" but "the part of you that matters
  isn''t the part that the credit system rewards."


