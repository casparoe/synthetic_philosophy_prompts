  Let me pick counterfactual vs interventionist causation, since the two are genuinely
  distinct and there''s a subtle crux: Woodward''s interventionism is a version of
  counterfactual theory but adds the invariance/manipulability requirement and the
  notion of "intervention variable" that must be defined without causal notions; and
  there are cases where Lewis-style counterfactual dependence fails (preemption, symmetric
  overdetermination) but interventionism handles some of them differently. Also, interventionism
  isn''t a theory of token causation per se — it''s a theory of causal claims / type-level
  causal generalization and "actual causation" via "interventionist accounts of actual
  causation" (Woodward, Halpern-Pearl). That''s a nice crux: whether interventionism
  is a rival to counterfactual theories or a refinement, and whether it inherits the
  preemption problems.


  Injecting niche content: I can invent a novel case. E.g., a case with an "insensitive
  cause": a device where a boulder rolls down a hill; the boulder''s path is blocked
  by a rock; a hiker''s lever... Better to invent something crisp.


  Idea: A case involving two switches in a series where the second switch''s position
  is causally affected by the first (violating the "intervention" requirement of no
  causal path from intervention to effect except through the variable). This is a
  good in-the-weeds point: interventions must be defined such that they don''t themselves
  affect the effect variable except through the intervened-on variable — so a "soft"
  intervention that changes the distribution of downstream variables is not a proper
  intervention.


