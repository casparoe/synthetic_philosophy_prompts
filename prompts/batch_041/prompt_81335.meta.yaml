  I should be careful about "two years ago"/"twenty generations" — the crux: for the
  etiological account, is twenty generations of selection enough? Millikan requires
  "direct proper functions" via selection; Neander says selection over generations;
  some require that the trait''s presence be *explained* by selection (Godfrey-Smith:
  "the trait is present because it was selected for"). A common move: 20 generations
  of differential reproduction is enough for there to be a selection-based explanation,
  hence function; but some argue that the function should be the one that explains
  the trait''s *current* maintenance. The drift phase matters for accounts that require
  the trait to have been selected for (Millikan''s "reproduction of the trait because
  it performed the function"). Fine — students can argue either way if they defend
  it.


  Also: the case where the shell contributes but was never selected for is the classic
  "accidental function" issue: does mere contribution suffice (Cummins) — the nose/glasses
  problem, and the response that Cummins functions require that the capacity be one
  the system "has" and that ascriptions be explanatory. That''s a must-hit point:
  the causal-role account must be specified as relativized to a capacity and a level
  of analysis (the "system" whose capacity we''re explaining), otherwise function
  ascription becomes trivially cheap; the A answer notes that under Cummins-style
  analysis, the shell''s function (UV exclusion) is only as good as the capacity-selection
  (why salinity/UV tolerance rather than, say, "adding weight to the cell"?).


  Also a nice must-hit: malfunction talk. The causal-role account can accommodate
  malfunction only if it can say the shell *ought* to do something — standard objection
  that Cummins functions are not normative, and so "malfunction" is either a statistical/aetiological
  notion or a disguised reference to a design/selection standard. So KT-7m: the causal-role
  theorist can say the mutant''s shell has the function (statistically typical contribution)
