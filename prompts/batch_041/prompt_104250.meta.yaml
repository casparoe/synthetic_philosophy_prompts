  whether states described at the representational/symbolic level (a belief, a symbol
  token, a content-bearing state) make a difference to what the underlying physical
  substrate does, or whether the substrate''s causal story is complete without them.


  To make it in-the-weeds and not memorization-dependent, I should describe the careenium/simmball
  scenario in the prompt as the fixed case to be used, so the model needn''t have
  memorized it:


  "Use one fixed case throughout: the ''careenium'' — a thought experiment in which
  a large spherical volume is filled with countless ''simmballs'', small magnet-like
  objects whose only properties are dispositions to attract and repel neighbours;
  the aggregate settles into stable, propagating patterns, and we (or an observer)
  find it convenient to describe some of these patterns as storing and transmitting
  information, or as representing features of the environment. The question is whether
  describing the simmball aggregate at that symbolic level is doing causal work or
  is a convenience."


  Then: branch nodes = the assumptions/commitments that separate positions. E.g.:

  - Does the symbolic-level description track a real pattern (a projectible, intervention-supporting
  regularity) or is it observer-relative/conventional?

  - Do you accept a completeness claim for the micro-level (the simmball dynamics
  are causally sufficient for all simmball motions)?

  - Do you think higher-level properties are identical to, or merely realized by,
  their realizers?

  - Is causation a relation among events under descriptions, or among events simpliciter?

  - Does the same symbolic-level state get realized by indefinitely many different
  micro-configurations (multiple realizability)?

  - Does your account require downward causation, or only supervenience-plus-counterfactual-dependence?

  - Does "pushing" require energy transfer, or is counterfactual difference-making
  enough?


  Leaves: named positions. E.g.:

  1. Eliminativism about the symbolic level (only simmball dynamics are real; symbolic
  talk is a useful fiction or should be eliminated).

  2. Reductive identity (symbolic states are the simmball configurations, so they
  push just because they are the micro-states; no extra causation, no exclusion problem).

  3. Non-reductive physicalism with causal inheritance (higher-level properties are
  distinct but inherit their causal powers from realizers).

  4. Causal exclusion (higher-level properties are epiphenomenal / excluded).

  5. Pattern-based / "real patterns" realism (higher-level patterns are real, causally
