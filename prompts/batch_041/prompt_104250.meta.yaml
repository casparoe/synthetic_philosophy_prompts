  I''m assembling a handout for an interdisciplinary reading group (philosophers and
  cognitive scientists) on whether the symbolic/representational level of description
  earns its keep in explaining what a system does. The group keeps circling one question
  and talking past each other, so I want a decision tree that takes someone from a
  starting commitment to a named position.


  The fixed case, which every question must be about (no other examples): the careenium
  — a thought experiment in which a mind is realized by a vast spherical volume packed
  with ''simmballs'': simple units whose only relevant properties are local dispositions
  to attract and repel their immediate neighbours. Out of purely local interactions,
  the aggregate settles into stable, propagating patterns. An observer finds it indispensable
  to describe some of these patterns as carrying information, as standing for features
  of the environment, and as guiding the aggregate''s subsequent behaviour. The question
  the group keeps fighting about is whether those descriptions are doing any causal
  work — whether the symbols ''push the simmballs around'' — or whether the simmball
  dynamics already tell the whole causal story and the symbolic description is a convenience.


  Requirements:

  - The tree should have six to nine branch nodes. Each node is a single question
  with two or three answers, phrased so that someone can answer it without knowing
  where it leads and without having read any particular author.

  - Leaves should be the positions, each named (or marked ''unnamed'' if nobody holds
  it) with one sentence on its most awkward commitment. The following must appear
  as leaves: eliminativism about the symbolic level; reductive identity; non-reductive
  physicalism with inherited causal powers; causal exclusion / epiphenomenalism; ''real
  patterns'' realism; instrumentalism or stance-dependence; and at least one position
  that dissolves the question rather than answering it. Add any further leaves you
  think the space contains.

  - Build the tree from the logical space, not from a list of authors: first the questions
  and the combinations of answers they permit, then locate the positions in that space.

  - Where a combination of answers is left unoccupied, say so and diagnose why — incoherent,
  unattractive, or merely unexplored.

  - Flag any pair of leaves your tree cannot separate, and say what extra question
  would be needed to separate them.

  - Keep the level-of-description questions honest: don''t let a node presuppose that
  the micro-level is the privileged or ground-floor description, and don''t let a
