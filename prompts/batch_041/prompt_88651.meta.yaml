  Draft:


  "I am a novelist, not a philosopher, but I have spent the last few years working
  out a position I now have to defend in public: that the ''qualia'' of an experience—its
  alleged intrinsic, ineffable, private feel—are an incoherent posit, because the
  very features said to constitute them are never independently accessible to the
  subject who is supposed to possess them. My central illustration is the case of
  two veteran coffee tasters, Chase and Sanborn, who over the years both come to dislike
  a coffee they once loved: one insists the coffee tastes exactly as it always did
  and that he has changed, the other insists the coffee itself now tastes different.
  I argue that no fact about either man—behavioral, neural, or introspective—can settle
  which of them is right, and that this is not a gap in our instruments but a sign
  that ''what it''s like'' is doing no explanatory work. Next month I present this
  to a lab seminar that is mostly psychophysicists who think about perception in terms
  of signal detection theory (sensitivity versus criterion), with two philosophers
  of mind in the room who are committed phenomenal realists. Take the role of a philosopher
  of mind with a strong empirical bent and, before drafting anything, spend a few
  sentences brainstorming the objections this specific audience would actually raise—not
  the ones I''d get from a room of Dennett fans. Then give me my Q&A prep sheet: the
  objections ordered by how much damage they would do, each phrased the way a psychophysicist
  would put it, with a two-minute reply and an honest note on where the reply is soft.
  Make sure you address the sharpest objection, which I expect to be that the Chase-and-Sanborn
  ambiguity is an empirical question, not a conceptual one—that sensitivity and criterion
  can in principle be measured separately—and tell me how far I should concede that.
  End with the question I am hoping nobody asks."


