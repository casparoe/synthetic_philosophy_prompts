  the whole selling point is that you end up measurably happier and less anxious,
  and by all accounts it actually works. Nobody''s forcing anyone. You sign up, you
  can quit any time, and the surveys come back saying people are calmer and sleep
  better. So no dungeons, no burning heretics, no miracle, no mystery, no authority
  in the old sense at all. Just a quiet machine that takes the choosing off your hands
  and hands you back a nice calm life.


  What I want to know is what Dostoevsky would have made of that. If you could sit
  him down and show him a working version of it, with real data, would he say the
  Inquisitor was right after all and this is just the final version of his system
  — bread, and someone else to do the deciding — or would he say this is a different
  animal entirely, because in his story the whole thing runs on a lie (the old man
  knows he''s not who he pretends to be) and in this version there''s no lie, just
  results?


