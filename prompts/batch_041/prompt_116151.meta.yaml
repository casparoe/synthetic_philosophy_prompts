  Let me draft the glossary content (accurate philosophy, plainly stated):


  - Fanaticism: If you maximize expected value with unbounded utility, then any action
  with a nonzero probability of a sufficiently large payoff beats any action with
  a guaranteed modest payoff; so the theory is "fanatical" and seems to license sacrificing
  almost anything for tiny probabilities of astronomically large goods.

  - Lexicality: Some views rank goods lexically (any amount of A beats any amount
  of B), which makes the value function discontinuous and the trade-offs infinitely
  steep; others insist on continuity ("no amount of torture outweighs any number of
  dust specks" vs "yes it does").

  - Pascal''s mugging: A stranger offers an enormous payoff contingent on a coin,
  and the expected value calculation says pay; the standard rejoinders are that probabilities
  should be discounted faster than linearly, that utility should be bounded, or that
  the reasoning is unreliable in a way that can''t be repaired by multiplying.

  - Infinite values: If the future contains infinitely many happy lives, or if the
  cosmos is spatially infinite, then total value may be infinite, and comparisons
  between infinite worlds run into trouble — some infinite worlds can be mapped onto
  others with more of everything, so "more" doesn''t imply "better," and standard
  arithmetic on infinities gives no ranking. Some authors try to repair this with
  finitely additive measures or by restricting to "nice" orderings; the repairs are
  controversial.

  - Aggregation and the scale of the future: if you count each life equally, the far
  future''s expected population dwarfs the present, so tiny probabilities of influencing
  it dominate; also there''s the question of whether "expected value" should be computed
  over population sizes.

  - Bounded vs. unbounded utility; the St. Petersburg-style divergence; the fact that
  with an unbounded value function, expected values can be infinite or undefined and
  decision theory can''t rank options (money-pump / non-measurable issues).


