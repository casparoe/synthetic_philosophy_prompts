  Draft:


  "I teach a seminar on the epistemology of disagreement, and this term I want to
  close the unit with Kurosawa''s Rashomon rather than with another case study from
  the journals. My students will have read the standard material: the equal-weight
  or conciliatory view, on which discovering that an epistemic peer disagrees obliges
  me to move toward their opinion; the steadfast view, on which I may keep my belief
  if I have an asymmetry-breaker to point to; and the third, ''total evidence'' line,
  on which the disagreement is simply one more item in the evidence to be weighed
  against the first-order reasons rather than something that automatically halves
  my confidence. What I want from you is a reading of the film that is faithful in
  both directions — one that doesn''t flatten Rashomon into an illustration of a position,
  and one that doesn''t bend the epistemology to make the film come out right.


  The thing I keep circling is that the film seems to be about disagreement without
  containing a single pair of peers. The four accounts — the bandit''s, the wife''s,
  the samurai''s through the medium, and the woodcutter''s withheld fifth — come from
  parties who differ in what they have at stake, in what they saw, and in what they
  are willing to say; the woodcutter turns out to have his own reason to lie, which
  is precisely what disqualifies him as the neutral reporter we wanted. So I''d like
  you to work through what the conciliationist debate assumes and the film withholds:
  the ''independence'' requirement, on which I must not let my first-order reasoning
  be the very thing that answers the peer''s objection; the notion of higher-order
  evidence and defeaters; the assumption of a common evidence base and common priors,
  without which ''splitting the difference'' has no determinate target; and the deeper
  assumption that the disputed proposition has a determinate truth value for both
  parties to be right or wrong about. Ask whether the film''s disagreements are factual,
  normative (the bandit and the samurai disagree about what honor required as much
  as about who did what), or the ''faultless'' kind that relativists about taste describe,
  and whether any of these is the kind the literature is actually about. Also say
  what the film''s own form contributes: it has no neutral camera, so the audience
  is never placed in the position of the ideal observer whose evidence the parties
  share, and I suspect that is not incidental but the point.


  Then give me your verdict on what survives. Does Rashomon refute the presuppositions
  of the conciliation/steadfast debate, or does it just show that real-world disagreement
  is messier than the idealized cases the debate runs on — in which case tell me which
  side, if any, the film favours once the disanalogies are admitted. And end with
  what the film shows about disagreement that the arguments alone don''t: I''d like
