  Draft summary:


  "The inefficacy objection — now the standard challenge to the very idea of individual
  environmental obligation, and first formulated by a philosopher whose name escapes
  me — appears to show that no individual act of the relevant kind can be wrong. Driving
  a car for pleasure, eating a hamburger, running the dryer: each is a drop in an
  ocean of emissions, and the ocean is what does the damage. Since climate harm is
  threshold-shaped, no single act carries any portion of it across a line, and since
  no one is made worse off by any single act, no one is wronged by it. The point is
  not a technicality about causation; it is the whole moral structure of the case.
  Consider the example that has become canonical: a thousand people, each of whom
  turns a dial by an imperceptible amount, so that the victim feels pain only once
  the thousandth turn is complete. Each turn is necessary to the pain and none is
  sufficient, and the usual verdict is that no individual turn wrongs the victim —
  the harm belongs to the thousand as a body and to no one in it. The driver and the
  hamburger-eater occupy exactly that position, and so does the voter, whose ballot
  no more decides an election than one turn of a dial produces the pain. What follows
  is uncomfortable but clear: individual moral obligation in these domains is a fiction,
  and the honest environmentalist''s energies belong to politics, not to consumption.
  Those who insist otherwise must either smuggle in a consequentialist argument their
  own premises forbid, or retreat to a purely expressive act whose value is private
  and whose effect is nil."


  Errors:

  1. The canonical verdict on the thousand-turn example is inverted: the point of
  that example in the literature is precisely to *resist* the "no individual wrongs
  him" conclusion (it''s used to show the mistake of ignoring the effects of sets
  of acts / to show each participant acts wrongly). So the author reports a verdict
  that the example''s author rejects. Good.

  2. "Individual moral obligation in these domains is a fiction" — overstatement;
  even the objection''s main proponent confines the conclusion to particular unilateral
  acts and affirms obligations to press for collective/political change; so the author''s
  own closing line ("energies belong to politics") sits in tension with his global
  conclusion. Also "appears to show" vs "is a fiction" — he treats a contested objection
  as a settled refutation.

  3. Treating threshold-shape as establishing causal inertness (conflating "no perceptible/attributable
  difference" with "no difference") and ignoring expected-marginal-effect replies;
  also the threshold model is contested (continuous harms, non-threshold effects).

  4. The disanalogy with voting (nonzero probability of being pivotal; not a sorites
  structure) is papered over by "no more decides an election than one turn of a dial."

  5. The dismissal of "what if everyone did" as covert consequentialism mischaracterizes
  universalizability-type arguments.

  6. "purely expressive act whose value is private and whose effect is nil" — ignores
  participation/complicity accounts, and the fact that expressive acts can have effects
  (e.g., signaling, norm change) — and the author himself later recommends political
  action, which is also largely a matter of aggregate participation.


