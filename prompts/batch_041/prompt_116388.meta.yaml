  Draft:


  I am a software engineer with no training in philosophy, and the part of my job
  I have thought about most is the post-mortem: after an outage, a group of us sit
  down and try to say what caused it. That discipline has a few habits I have come
  to trust. We separate a trigger (the thing that happened last) from a latent defect
  (the thing that made the system unable to absorb it). We insist that a failure being
  obvious in hindsight is not evidence that anyone saw it coming. And we have learned,
  painfully, that if you ask only whether the operator made a mistake, you will keep
  getting the same outage, because the interesting causes are usually in the design
  of the system and in what the organisation rewarded. I have been trying to apply
  the same habits to a question I keep arguing about with friends, and I would like
  a serious essay on it.


  The question is whether famines are natural disasters or political crimes. I know
  roughly where the positions sit. There is the older picture in which a famine is
  simply what happens when a population outruns its food supply. There is the entitlement
  picture associated with Amartya Sen, on which famines occur when people lose the
  ability to command food, which can happen even when food is available in the aggregate.
  And there is the harder claim that at least some modern famines — the Bengal famine,
  the Irish famine, the famine that followed the Great Leap Forward — were not misfortunes
  at all but the predictable output of deliberate policy, and therefore belong in
  the category of crimes rather than disasters.


  I would like you to write an essay that takes a side and defends it, and I would
  like the argument to turn on a criterion rather than on anecdotes. Here is the criterion
  I have been trying out, and I am not sure I believe it:


  A famine is a political crime rather than a natural disaster when (a) some alternative
  policy package existed that was feasible, and that was knowable at the time — by
  the standards of the day, not with hindsight — to be sufficient to prevent most
  of the excess deaths; (b) the government knew that its own policies were contributing
  to the shortfall; and (c) it kept those policies in place because abandoning them
  would have cost it something it valued more than the lives at stake, whether that
  was a war, an ideological programme, or its grip on power.


  Please treat that criterion as the thing to be argued about. In particular:


  Whether each clause is necessary, and whether all three together are sufficient.
  If a government kills by negligence or indifference rather than by preference, does
  clause (c) let it off the hook — and should it?


  Whether the natural/political distinction is even a real dichotomy. If hazards are
  partly socially produced (who lives on marginal land, who gets relief, who is counted),
  does the distinction survive, or does it only survive as a way of allocating blame?


  Whether clause (a) can ever be applied honestly, given that we always know more
  after the fact than the people deciding at the time did. What would it take to apply
  it without smuggling in hindsight?


  Two hard cases, which I would like you to resolve rather than dodge: (i) a government
  pursues policies that cause a famine, but sincerely believes the policies will improve
  food security, and the belief is not crazy given what it knows; (ii) a government
  has the capacity to prevent a famine in a politically marginal region and does not,
  not out of malice but because the region does not matter to it.


  And finally, what follows from your verdict: whether calling a famine a crime rather
  than a disaster changes anything practical — how it is remembered, whether anyone
  owes anything to survivors, and whether it makes future famines less likely.


  End with a definite verdict rather than a survey of the options. I am happy for
  the verdict to be qualified (for example, that the crime/disaster distinction is
  the wrong axis and should be replaced by something else), as long as it is a position
  and you say what it commits you to.


