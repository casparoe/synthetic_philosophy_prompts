  Prompt text:


  "As a retired natural scientist who has only recently turned to philosophy, I have
  been reading Grice on implicature and speaker meaning and have become interested
  in a wrinkle I have not seen discussed. Grice''s account of conversational implicature
  is hearer-directed: the speaker means something by relying on the hearer''s recognition
  of the intention. But drama seems to contain a different phenomenon. In Oscar Wilde''s
  The Importance of Being Earnest, characters constantly say things whose real point
  is aimed over the heads of their interlocutors at the audience—what I would call
  audience-directed implicature. I want a critical reading of the play through this
  problem. Does Wilde dramatize a kind of speaker meaning that Grice''s framework
  cannot capture, or can Grice accommodate it by treating the audience as a second
  addressee or by distinguishing what the speaker means from what the playwright means?
  Where does the play illuminate the distinction between what is said, what is conversationally
  implicated, and what is dramatically implied? And where does the play resist the
  Gricean reading—where is the meaning not recoverable from any intention, but instead
  an effect of staging, repetition, or the audience''s superior knowledge? Please
  avoid quotations and references; I want the argument, not a bibliography.


  Organize your response under these headings, in this order, with roughly the following
  lengths:

  1. The Gricean frame (150–200 words): state the hearer-directed model and the problem
  audience-directed implicature poses for it.

  2. The play as an implicature engine (300–400 words): show how Wilde''s dialogue
  depends on flouting maxims and on meanings that are not said.

  3. Three scenes (400–500 words): read three specific scenes or exchanges closely,
  without quoting, to test whether the audience-directed implicature is a genuine
  counterexample or an extension of Grice.

  4. Where the play resists the frame (250–350 words): identify the limits of the
  Gricean reading, including any place where the play''s meaning outruns speaker intention.

  5. What the play adds (200–250 words): say what Wilde''s comedy shows about implicature
  and speaker meaning that Gricean argument alone does not."


