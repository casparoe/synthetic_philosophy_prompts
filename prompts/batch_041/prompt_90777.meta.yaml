  One has 10 balls, one has 1000. You draw a ball and it''s number 7. It''s way more
  likely you drew from the 10-ball urn. Now replace ''you drew a ball'' with ''you
  are a human'' and ''ball number'' with ''your birth rank among all humans who will
  ever live.'' You''re roughly the 100 billionth human. If humans last a long time,
  your birth rank is unremarkable; if we go extinct soon, you''re near the end of
  the list. So the fact that you''re not super early in the sequence is evidence that
  the end is nigh. He said the argument doesn''t need any prior about the total number
  of humans; it just uses your rank as a random sample.


  Talia said that''s a classic abuse of probability. She said you can''t treat ''your
  birth rank'' as a random draw from a well-defined urn because the urn''s size is
  exactly what''s in question, and the reference class is totally arbitrary. Is it
  all humans, all hominids, all conscious beings, all observers? Change the reference
  class and you change the answer. She also said the argument ignores the fact that
  your existence is more likely in worlds with more people, so finding yourself alive
  is evidence for more people, not fewer. Ravi said that''s the self-indication assumption,
  and it''s controversial because it makes you count your own existence as evidence
  in a way that leads to weird conclusions. Talia said the self-sampling assumption
  is just as weird: it treats you as a randomly selected observer when you''re not
  randomly selected from anything -- you''re just you. Ravi said every probabilistic
  argument has to conditionalize on something, and the doomsday argument only needs
  the assumption that your birth rank is not special. Talia said that assumption is
  the whole ballgame, and it''s not obvious. Then Ravi said even if it''s only a weak
  argument, it still shifts the probability somewhat; Talia said a weak argument from
  a bad model is still a bad argument, and you can''t just say ''some shift'' without
