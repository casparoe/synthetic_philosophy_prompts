  ---


  A workshop on consciousness has just heard a proposal that exists, so far, only
  in its author''s notes. The proposal is this. Elementary physical entities have
  tiny experiences — there is something it is like to be each of them. When a collection
  of such entities enters a certain kind of dynamical relationship — their activities
  become mutually phase-locked, so that each entity''s internal state is continuously
  and reciprocally determined by the states of the others, and the whole settles into
  a stable pattern of mutual constraint — the many micro-experiences are said not
  merely to coexist but to fuse. The result is a single experience with a single subject.
  On this view the micro-subjects do not survive the fusion as so many separate subjects;
  they are absorbed into the larger subject, the way the separate motions of a medium
  are absorbed into a single wave. The fusion is supposed to be governed by a threshold:
  below a certain degree of mutual determination there are only many micro-subjects;
  above it there is one, and there is a fact of the matter about which.


  Write a dialogue between two philosophers who have both stayed after the talk.


  The first is the author of the proposal. She believes it dissolves the combination
  problem — the problem of how micro-experiences, if they exist, could add up to a
  unified macro-experience. She thinks the phase-locking relation does the work that
  critics say cannot be done, and she is prepared to say exactly what she takes the
  relation to accomplish.


  The second is a critic who grants, for the sake of argument, that elementary entities
  might have experiences, and who is not a physicalist out to deny consciousness to
  the brain. His objection is internal to the panpsychist project: he holds that the
  proposal cannot work, because of the subject-summing problem — the observation that
  relating subjects to one another, however intimately, still leaves you with that
  many subjects and no more, so that any ''fusion'' either secretly assumes a new
  subject or merely relabels the old ones. He also presses a second difficulty: even
  if a single subject could emerge, it is unclear how the micro-qualities (a faint
  warmth, a hint of red, a dull ache) would yield the specific unified quality of
  the resulting experience rather than a mere juxtaposition.


  Make both characters equally competent and equally serious. The author should have
  real replies — for instance, she may claim the critic is treating subjects as countable
  things whose number is fixed independently of their relations, and that fusion changes
  what there is rather than merely how things stand; the critic should be able to
  say why that reply does or does not escape his objection rather than simply repeating
  it. The critic, for his part, should have at least one line of attack the author
  cannot fully defuse, and should be willing to concede a point where the author earns
  it.


  At least once, have them descend to a concrete borderline case: two subsystems that
  have reached, say, ninety-nine percent of the author''s threshold and are then nudged
  across it. Ask what changes at the instant of crossing, whether there is a moment
  at which there are ''one and a half'' subjects, and what the author''s view says
  about a collection that oscillates around the threshold. Neither should be allowed
  to wave this away.


  The dialogue should not end in a tidy victory for either side. It should end with
  the two having located the precise point on which they disagree — ideally a disagreement
  about what it takes for a subject to exist at all, rather than about the details
  of the mechanism. Roughly 1,000–1,500 words.


