  Hmm, "I don''t get how both of these can be assumptions instead of claims" — nice.
  The good answer corrects: they''re not rival empirical claims about observer-count;
  they''re (a) principles for assigning indexical credence / self-locating belief,
  so they constrain how you distribute credence across hypotheses given a prior, and
  neither by itself tells you the total number of humans; (b) the presumptuous philosopher
  is a reductio of SIA, not a person/position; (c) SSA doesn''t entail "small total";
  it makes Doomsday-style reasoning possible under extra assumptions about reference
  class and prior; (d) SIA doesn''t entail "huge total"; it says favor hypotheses
  with more observers ceteris paribus, and in combination with a prior that assigns
  any appreciable probability to giant universes it gives high credence to them —
  which is Bostrom''s point and why he treats it as a reductio; (e) the deeper issue:
  whether indexical credences are well-defined when there''s no sampling process;
