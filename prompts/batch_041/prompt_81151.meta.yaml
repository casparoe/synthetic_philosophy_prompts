  I am putting together a graduate seminar on the good life, and I want the criteria
  fixed before anyone is allowed to defend a candidate. Set out the desiderata that
  any adequate theory of a person''s well-being — of what makes a life go well for
  the one living it — must satisfy: the cases it has to get right, the distinctions
  it must not collapse, and the constraints it cannot violate. For each requirement,
  state the consideration or case that motivates it, say whether it is non-negotiable
  or merely a preference of one camp, and say what kind of theory it rules out. Where
  two requirements look jointly unsatisfiable, say so and say what has to give; the
  list itself is a result if some pair can''t be had together.


  Hold the list to the following test case, which is the point of the exercise. Consider
  the view — call it tranquilism, and take the definition here as the definition,
  whatever else the word may name elsewhere — that the only thing of prudential value
  is the absence of craving and suffering, and that the presence of pleasure, delight,
  achievement, or understanding adds nothing whatever to a life''s value. Requirements
  should be chosen with an eye to whether a view of this shape can meet them; do not
  soften a requirement to let it through.


  At a minimum I want the list to say what a theory must do about:

  - the experience machine, and whether a theory may count a life as going well when
  the person would refuse to enter it;

  - two lives with the same total of whatever the theory counts, one of which improves
  and one of which declines — whether shape is value or only sequence;

  - a being that neither craves nor suffers because it experiences nothing at all:
  an irreversible coma, a rock, a person who never exists. Can a theory that values
  only absences avoid ranking these above the living?

  - the difference between a felt calm — a positive state of settledness — and the
  mere absence of a disturbance; if the good is a hole in the stream of experience
  rather than a quality of it, say what that costs;

  - a life of many small pleasures with no craving and no suffering in it, which tranquilism
  must call no better than a life of blank equanimity;

  - the fact that people''s desires and self-reports are shaped by what they have
  and have never had, so that the absence of craving cannot simply be read off what
  people say;

  - the several dimensions along which a single valence can vary — intensity, duration,
  number of subjects — and whether they are commensurable when there is only one kind
  of thing to measure;

  - the badness of death, and whether it can be bad for someone without being experienced.


  Then, in no more than a paragraph, say which single requirement does the most to
  exclude candidates, and whether tranquilism survives the list — if it does not,
  name the requirement that kills it.


  No more than 850 words. A numbered list with a one-line justification under each
