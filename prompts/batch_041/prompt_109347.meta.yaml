  Her thesis (I''ll craft it to be coherent):


  She argues that the two-envelope paradox is a special case of a broader failure
  she calls *act-partition instability*. Standard decision theory assumes expected
  value is computed over a partition of acts that the agent can''t change by describing
  the problem differently. In the envelope case, the "switch" argument derives its
  force from re-describing the single act of switching as a *family* of acts, one
  for each possible content x, each with its own conditional distribution — and each
  of those "acts" recommends itself locally, while the disjunction of them recommends
  the same physical action as the act that was already evaluated and found indifferent.
  Her claim: whenever a decision problem admits a "local" re-description whose conditional
  recommendations are uniformly better than the un-redescribed recommendation, the
  local argument is spurious — and the test for spuriousness is whether the recommendation
  is *invariant under refinement of the act partition* (i.e., whether the value of
  the recommended act, evaluated under the refined partition, equals its value under
  the coarse partition). The envelope''s switch argument fails the test; Pascal''s
  wager, she claims, also fails it; the Doomsday argument fails in a different way
  (it''s not a partition-refinement problem but a *self-locating* one); and the St.
  Petersburg game survives it, showing the test isn''t just a blanket ban on infinite
  expectation.


