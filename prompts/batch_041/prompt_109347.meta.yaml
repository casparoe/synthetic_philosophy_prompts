  Setup: Two envelopes, one has twice the other. You pick one, open it, see amount
  x. Then you reason: the other has 2x with prob 1/2 and x/2 with prob 1/2, so EV
  of switching = (1/2)(2x) + (1/2)(x/2) = 1.25x > x. So switch. But by symmetry you
  should have been indifferent before opening. Resolutions: (a) the improper prior
  over amounts makes the conditional probabilities ill-defined; (b) even with a proper
  prior, the "always switch" argument fails because for some x the conditional probability
  of the other being larger is < 1/2; the error is assuming p = 1/2 for every x. Key
  point: the step "prob 1/2" is only justified if the prior over the pair is scale-invariant,
  which is improper; with a proper prior, the conditional probability depends on x
  and the switching gain averages out to zero. Also, the "two-envelope" version where
  you don''t open: E[other] = (1/2)(2x)+(1/2)(x/2)... the argument that "the other
  is equally likely to be double or half" is the "principle of indifference" misapplied
  because the events aren''t equiprobable given the mechanism.


