  Please write that desiderata list. Treat the target as a theory that tells us when,
  if ever, an ethical defect in a work counts against its value as art, when an ethical
  merit counts in its favour, and how either interacts with the moral standing of
  the artist; it should not simply assume that the two domains are separate, nor that
  they collapse into one. For each requirement, give the case or consideration that
  motivates it, and mark which requirements are non-negotiable for any adequate account
  and which are optional or camp-specific. I am especially interested in the distinctions
  the theory must preserve -- for example, between the moral character of the maker
  and the moral character of the made thing, between what a work says or invites and
  what it merely depicts, between a moral defect that is incidental to a work''s artistic
  success and one that is partly constitutive of it, and between a work''s ethical
  value and its cognitive or emotional value. Flag any pair of desiderata that you
  suspect cannot be jointly satisfied, and explain what the tension is; if the list
  itself forces a choice among attractive options, that is a result I want stated
  plainly."


