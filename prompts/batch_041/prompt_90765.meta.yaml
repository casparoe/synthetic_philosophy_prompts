  - Prisoner''s dilemma: false presupposition e.g., "Since Axelrod''s tournaments
  showed that tit-for-tat wins, doesn''t that mean cooperation evolves in one-shot
  PDs too?" — a confusion between one-shot and iterated. Or "if TFT is evolutionarily
  stable..." — actually TFT is not an ESS. A prompt: "I read that in Axelrod''s tournaments
  Tit-for-Tat won, so in a one-shot prisoner''s dilemma with strangers, playing tit-for-tat
  is the rational strategy... " Hmm.


  Actually a nice subtle confusion: "the prisoner''s dilemma shows that rational agents
  can''t cooperate, but the iterated version shows cooperation evolves — so why is
  the one-shot PD considered the ''real'' problem?" The false presupposition: that
  "the prisoner''s dilemma" is one thing; that cooperation "evolves" in the iterated
  version in a way that solves the one-shot; or the presupposition that rationality
  and evolution point in opposite directions.


  Another: The common confusion that "the iterated prisoner''s dilemma is just the
  one-shot PD repeated, so if defection is dominant in one-shot it must be dominant
  in the iterated game" — the confusion that dominance carries over. Actually that''s
  a genuine subtle point: the one-shot game is a subgame of the finitely repeated
  game, so backward induction kills cooperation in the finitely iterated PD with known
  horizon; the shadow of the future requires indefinite horizon. A false presupposition
  could be: "Since defection is the dominant strategy in the one-shot PD, and any
  finite repetition can be unravelled by backward induction, it seems like infinite
  repetition is just a mathematical idealization — so doesn''t the evolution of cooperation
  literature rest on an assumption (infinite play) that never holds in real life?"
  A good answer would notice: (1) indefinite horizon is enough — the relevant thing
  is a positive continuation probability, not infinity; (2) there are other mechanisms
  (kin selection, reciprocity, spatial structure, reputation) and finite-horizon results
  depend on common knowledge of the horizon; (3) "evolution of cooperation" doesn''t
  require rationality at all. Hmm, this is a good prompt but the false presupposition
  is a bit thin.


