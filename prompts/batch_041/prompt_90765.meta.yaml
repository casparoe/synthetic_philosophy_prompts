  in the SPR shows that his utilitarianism was secretly grounded in the hope of post-mortem
  sanctions" or "Sidgwick abandoned utilitarianism because of psychical research"
  — or the common confusion that Sidgwick''s interest in psychical research was a
  late-life eccentricity/an aberration, when in fact it was continuous with his interest
  in the "dualism of practical reason" and the possibility of afterlife sanctions.
  That''s a nice subtle confusion: the presupposition that Sidgwick''s psychical research
  was an embarrassing side interest unrelated to his philosophical system. Actually
  a good answer would notice that his interest in the SPR (he was a founding member,
  and president in 1882... let me check — Sidgwick was president of the SPR in 1882;
  he joined in 1874... I should verify) was connected to his worry about whether utilitarianism''s
  "cosmological" side needed a theistic/post-mortem grounding.


