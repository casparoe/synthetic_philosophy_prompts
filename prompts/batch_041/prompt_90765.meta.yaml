  we can''t tell, so the question is unanswerable/merely academic". Or a subtle confusion:
  conflating "moral status" with "moral patiency" vs "agency"; or assuming that functionalism
  implies digital minds have the same moral status as humans; or assuming that a simulation
  of pain isn''t pain. A good false presupposition: "I understand that under functionalism,
  any system that realizes the right computational organization has mental states,
  so digital minds must have the same moral status as humans. But surely that''s absurd...
