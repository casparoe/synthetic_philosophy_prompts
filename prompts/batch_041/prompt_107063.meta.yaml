  Potential prompt:


  I have been assembling a set of intuitions about cross-modal recognition, and I
  would like to know whether there is a single principle that can hold them together.
  In the classic Molyneux case, a person blind from birth learns to distinguish a
  cube from a sphere by touch and then gains sight: I think that, at the first moment
  of seeing them, she cannot tell which is the cube and which the sphere. But I also
  think that a blind person who has used a tactile sensory-substitution device for
  years, and who has learned to read the device''s vibration patterns as a cube or
  a sphere, would be able to recognize the cube visually right away after gaining
  sight—or at least far sooner than the classic subject. I am less sure about a third
  case: a person who has only light perception, enough to see shadows and movement,
  and who learns the cube and sphere by touch; after surgery I think she can distinguish
  them visually, but only by moving her head and watching how the shadows shift, not
  in a single glance. And a fourth case troubles me: a person who lost sight in infancy,
  learned the shapes by touch, and then regained sight as an adult—I think she can
  recognize the cube immediately, because she has a visual memory of shapes, even
  if it is faded. Yet I do not think a person who has never had sight and who has
  only learned to match a felt cube to a seen cube while both are present can, after
  the seen cube is removed, say which of two seen objects is the cube. I am trying
  to find a principle that yields all of these verdicts, or else tells me which one
  I should give up. I suspect the answer will need to distinguish immediate perceptual
  recognition from inference or from learned cross-modal matching, and perhaps to
  say something about active exploration and the role of a prior mapping between modalities.
  What principle, or small set of competing principles, best captures the pattern?
  Please state it precisely, say what it predicts for a case I have not described—say,
  a person who gains sight and can identify the cube only when allowed to touch it
  simultaneously—and tell me honestly which of my verdicts it cannot accommodate.


