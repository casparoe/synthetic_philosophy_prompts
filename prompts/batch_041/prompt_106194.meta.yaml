  2. Friend B (call her Mara): That''s a misread. Pascal isn''t saying might is right;
  he''s saying force and justice are different orders (flesh vs. spirit vs. charity),
  so you can''t derive political authority from spiritual truth, and you can''t enforce
  inner justice with coercion. When he says "justice is what is established," he''s
  making a point about how we in fact treat custom as the ground of law because we
  can''t agree, not a claim that there''s nothing more. He also holds there are natural,
  immutable laws, just few — so he''s not a pure positivist.

  3. Dev: But if natural law is "few" and unenforceable, and the operational rule
  is "obey what''s established," then in practice it''s indistinguishable from positivism.
  He even says we shouldn''t examine established laws. Where''s the critical edge?

  4. Mara: The critical edge is in the three orders. Political power can''t reach
  the order of charity, and that''s exactly why the powerful can be judged by something
  above them — Pascal''s whole point in the Discourses on the Condition of the Great
  is that the great have no natural superiority, their title is institutional, so
  they can be told they have no natural right to esteem. That''s not apologetics;
  it''s a demotion of power.

  5. Dev: But that demotion is only in the "secret thought" — externally you still
  obey. So the critique is private, not political. It doesn''t license resistance.
  So for anything that matters politically, Pascal is on the side of established power.

