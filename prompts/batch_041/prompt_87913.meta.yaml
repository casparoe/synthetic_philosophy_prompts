  Content of desiderata for a theory of dispositions:


  Phenomena/cases the theory must get right:

  1. Finkish dispositions: an object has the disposition but loses it exactly when
  the stimulus occurs (e.g., a fragile glass with a sorcerer who removes fragility
  upon the glass being struck). So the simple conditional analysis (x is disposed
  to M when S iff, if x were S, x would M) fails. A theory must not count finkish
  cases as lacking the disposition (we want to say the glass is fragile even though
  it wouldn''t break). Actually the finkish case: the glass is fragile, but a sorcerer
  would make it non-fragile if struck, so the counterfactual "if struck it would break"
  is false, yet we want to say it''s fragile. So the theory must accommodate finks.

  2. Masking: a disposition is present and the stimulus occurs but an external masker
  blocks the manifestation (fragile glass wrapped in packing material; a shy person
  who is silenced; a sugar cube in a sealed bag — it''s still water-soluble but won''t
  dissolve). Theory must count the disposition as present despite no manifestation.

  3. Mimics: the manifestation occurs but the disposition is absent (a Hempel-mimic;
  a sugar cube that looks like it dissolves because it''s being eroded). Must not
  count it as having the disposition.

  4. Antidotes: something that removes the disposition when the stimulus occurs without
  being a fink (this is related).

  5. Shadow cases / reverse-cycle: stimulus causes loss of disposition.

  6. Also: dispositions ascribing powers that are intrinsic/grounded; dispositions
  must be distinct from their categorical bases (or not — dispositional monism vs.
  categoricalism).

  7. Multiple manifestations, degrees of disposition (probabilities), dispositions
  that manifest only with a "triggering" that is itself a process.

  8. Iterated/higher-order dispositions, multi-track dispositions.

  9. Dispositions that are never manifested (a fragile glass that''s never struck,
  an unmanifested virtue).

  10. Consistency with causal explanation: dispositions must be able to be causes
  / explain manifestations (not be idle).

  11. Non-vacuity: the analysis mustn''t be trivially true (the "conditional fallacy"
  and the "reference class" problems).

  12. Consistency with physical/biological facts: e.g., dispositions like solubility
  must supervene on or be realized by categorical microstructure; mustn''t posit magic.


  Distinctions the theory must respect:

  - Having a disposition vs. manifesting it.

  - Having a disposition vs. being such that the counterfactual holds (finkish/masking
  cases).

  - Dispositional vs. categorical properties (or the theory may deny the distinction
  — that''s a choice).

  - Disposition vs. its causal basis.

  - Disposition vs. power/ability (agentive).

  - Intrinsic vs. extrinsic dispositional ascriptions (the "dispositional essentialism"
  debate about whether dispositions are intrinsic; e.g., the disposition of a key
  to open a lock is extrinsic).


