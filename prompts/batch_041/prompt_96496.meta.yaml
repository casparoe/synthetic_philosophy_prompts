  Paragraph 1: The novelist, the novel, the position.


  "I''m a novelist, four books in, and I''ve spent the last two years circling a project
  I can''t quite start: a novel that runs backwards. Not a gimmick (okay, partly a
  gimmick) — the reason I want it is that I''ve talked myself into a view about time
  and I want the book to be honest to it. The view, as best I can state it: the direction
  of time is not a feature of the world. The fundamental laws don''t care which way
  you run them — film a collision and play it backwards and nothing in the physics
  objects. What objects is entropy: the rack scatters, the coffee mixes, the egg breaks,
  and never the reverse. And the story I''ve absorbed is that the second law is not
  a law but a consequence of (a) the sheer statistics of large numbers — vastly more
  ways to be mixed than unmixed — together with (b) one brute fact about the early
  universe, that it started in a staggeringly low-entropy state. Some people call
  this the past hypothesis and, as far as I can tell, nobody has any idea why it holds.
  If that''s right, then the arrow of time is downstream of one unexplained initial
  condition, time doesn''t flow, ''before'' and ''after'' are just directions on a
  manifold, and my narrator''s situation — she remembers backward and not forward,
  she has scars and not premonitions — is a side effect of her brain being a system
  that relaxes and leaves records, not a deep truth about time."


  Paragraph 2: The ask. List half-understood worries. Ask for ranking, defender concessions,
  falsifiability, and additional defeaters.


