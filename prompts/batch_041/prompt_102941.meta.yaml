  I write a column on science and ideas, and I keep meeting the same argument from
  people who want the rough-and-tumble of online argument left alone: the internet
  is a marketplace of ideas, and the remedy for bad speech is more speech, because
  in a market the better product drives out the worse. The metaphor is not decoration
  in that argument; it is the load-bearing premise — it is why they conclude that
  no gatekeeping, no platform intervention, and no regulation is needed, and why they
  treat calls for moderation as a kind of price-fixing. I would like an audit of the
  metaphor rather than another round of approval or denunciation.


  Begin with the correspondence, set out explicitly. What plays the role of the buyer,
  the seller, the good on offer, the price, the profit motive, the invisible hand
  that sorts quality from junk, the regulator, and the bankruptcy that clears out
  the bad actors? Then tell me where the mapping fails. I am interested in which of
  the failures matter for the work the metaphor is being asked to do — licensing the
  conclusion that more speech is sufficient — and which are merely decorative differences
  that a defender could wave away. In particular, I want to know what the market picture
  quietly imports that the information ecosystem lacks: a buyer who can inspect the
  goods, a price that aggregates dispersed private knowledge, a payoff for being right,
  a repeat-purchase discipline on sellers, and an assumption that participants are
  at least trying to sell something true rather than merely to win.


  Two attempts to patch the metaphor are circulating in my notes, and I would like
  you to say whether either of them rescues it or instead concedes that it was never
  a market at all. The first comes from an economist I interviewed: the information
  ecosystem, he says, is a market in which quality cannot be inspected before purchase
  and often not after, so the bad drives out the good — a market failure, not a market.
  The second comes from a media critic: speakers should be treated like manufacturers,
  who bear liability for the harm their defective products cause, so that the cost
  of a false claim falls on the person who made it rather than on the reader. If the
  second is right, does the marketplace metaphor still support the conclusion it was
  invoked to support, or has it quietly become an argument for regulation?


