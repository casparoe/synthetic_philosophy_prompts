  Let''s create:


  **The Community Automated Decision Notice Act (CADNA)**


  Section 1. Short Title. This Act may be cited as the Community Automated Decision
  Notice Act.


  Section 2. Findings and Purpose.

  (a) Findings. The Legislature finds that automated decision systems are increasingly
  used to make consequential decisions about individuals, and that individuals often
  lack meaningful notice of the factors and logic underlying those decisions.

  (b) Purpose. The purpose of this Act is to ensure that individuals receive a plain-language
  explanation of consequential automated decisions before those decisions are finalized,
  while avoiding undue compliance burdens on small entities and preserving legitimate
  trade secrets.


  Section 3. Definitions.

  (a) "Covered automated decision system" means any computational process that uses
  machine learning to make or materially inform a consequential decision.

  (b) "Consequential decision" means a decision concerning employment, credit, housing,
  insurance, or education that produces legal or similarly significant effects for
  an individual.

  (c) "Plain-language explanation" means a description of the principal factors and
  logic used to reach a decision, sufficient for a reasonable person to understand
  the basis for the decision. It need not include trade secrets or confidential business
  information.

  (d) "Small entity" means a business with fewer than 50 employees and less than $5,000,000
  in annual gross receipts.

  (e) "Operator" means a person or entity that operates or materially controls a covered
  automated decision system.


  Section 4. Notice and Explanation.

  (a) An operator shall provide a plain-language explanation to an individual before
  a consequential decision is finalized.

  (b) If providing an explanation before finalization is impracticable, the operator
  shall provide the explanation within 30 days after the decision is finalized.

  (c) An operator that is a small entity is exempt from subsection (a), unless the
  operator has previously been found to have violated this Act.


  Section 5. Enforcement.

  (a) The Attorney General may bring a civil action for violations of this Act.

  (b) Nothing in this Act shall be construed to create a private right of action.

  (c) In an action under this section, a court may award injunctive relief and civil
  penalties of up to $10,000 per violation.


  Section 6. Construction.

  (a) This Act shall be construed narrowly to avoid imposing undue burdens on small
  entities.

  (b) If any provision of this Act is held invalid, the remaining provisions shall
  not be affected.


  Section 7. Effective Date. This Act takes effect 180 days after enactment.


  Legislative History (fictional):

  - Committee Report: "The small-entity exemption is intended to be temporary and
  narrow. It should not swallow the rule. The Attorney General should focus on egregious
  cases."

  - Floor Manager''s Statement: "The bill is not meant to create a new bureaucracy.
  The heart of the bill is the pre-decision explanation; the 30-day provision is a
  fallback for genuine impracticability, not a routine option."

  - Sponsor''s Statement: "A plain-language explanation means an individual should
  be able to understand why the decision went the way it did, not just that an algorithm
