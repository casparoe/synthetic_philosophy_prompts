  burdens on small entities.


  Section 3. Definitions. (a) ''Covered automated decision system'' means any computational
  process that uses machine learning to make or materially inform a decision that
  produces legal or similarly significant effects for an individual. (b) ''Small entity''
  means a business with fewer than 50 employees and less than $5 million in annual
  gross receipts. (c) ''Consequential decision'' means a decision regarding employment,
  credit, housing, insurance, or education. (d) ''Plain-language explanation'' means
  a description of the principal factors and logic used to reach a decision, sufficient
  for a reasonable person to understand the basis for the decision, but need not include
  trade secrets or confidential business information.


  Section 4. Notice and explanation. (a) An operator of a covered automated decision
  system shall provide a plain-language explanation to an individual before a consequential
  decision is finalized. (b) If providing an explanation before finalization is impracticable,
  the operator shall provide the explanation within 30 days after the decision. (c)
  An operator is exempt from subsection (a) if the operator is a small entity, unless
  the operator has previously been found to have violated this Act.


  Section 5. Enforcement. (a) The Attorney General may bring a civil action for violations
  of this Act. (b) Nothing in this Act shall be construed to create a private right
  of action. (c) In an action under this section, a court may award injunctive relief
  and civil penalties of up to $10,000 per violation.


  Section 6. Construction. (a) This Act shall be construed narrowly to avoid imposing
  undue burdens on small entities. (b) If any provision of this Act is held invalid,
  the remaining provisions shall not be affected.


  Section 7. Effective date. This Act takes effect 180 days after enactment."


