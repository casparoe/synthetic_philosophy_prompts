  This is good. Now, what are the cruxes? Let''s identify genuine disagreements between
  textualist and purposivist:


  1. **The status of the purpose clause.** Is Section 2(b) operative text that can
  resolve ambiguity, or merely precatory context that cannot override clear text?
  Both agree it is part of the statute and not a source of independent duties. Disagreement:
  textualist says it cannot authorize a reading that conflicts with plain meaning;
  purposivist says it can tip the scale when text is ambiguous or when a literal reading
  would defeat the stated purpose. Crux: Is the statute ambiguous on the disputed
  point? Test: a case where the text is clear but produces a result that seems to
  defeat the purpose. Textualist predicts the clear text controls; purposivist predicts
  the purpose may justify a narrowing construction. Both agree the case would bear
  on it.


  2. **"Impracticable" in Section 4(b).** Does cost alone make pre-decision explanation
  impracticable? Textualist: ordinary meaning of "impracticable" includes excessive
  cost or infeasibility; if the operator shows it, 30-day fallback applies. Purposivist:
  read in light of purpose, "impracticable" means genuinely impossible or nearly so;
  mere cost is not enough because it would swallow the pre-decision rule. Test: a
