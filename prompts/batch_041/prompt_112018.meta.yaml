  they will choose badly, deliberately removes their own future options. Odysseus
  knows the sirens'' song will make him want to steer toward them, so he arranges
  to be bound and tells the crew not to untie him. The key is time inconsistency:
  the same person has different preferences at different times, and the earlier self
  tries to constrain the later self. Constitutional precommitment is the same structure
  at the collective level. A constitutional right, like freedom of speech or a ban
