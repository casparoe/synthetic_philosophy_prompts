  "I recently joined the grant committee of a small animal-welfare fund, and our first
  major decision is whether to open a dedicated insect-welfare portfolio. Two of our
  scientific advisers have been arguing for months. One holds the scale argument:
  because insects are so numerous and because even a very low probability that they
  are sentient could still yield an enormous expected amount of welfare, we should
  treat insect welfare as a serious priority now, under uncertainty. The other holds
  the evidence-first view: the probability is too low and the proxies too unreliable,
  and expected-value arithmetic with arbitrary priors and moral weights is not a sound
  basis for spending scarce money; we should wait for better evidence. They agree
  on almost no formulation, and I need something they can both sign.


  Please draft the joint statement of an adversarial collaboration between these two
  camps. Use the following device to keep the disagreement precise: distinguish three
  hypotheses for a given insect taxon -- H0: no valenced experience; H1: valenced
  experience but no robust suffering/welfare states; H2: robust suffering and welfare
  states -- and distinguish the probability of each from the moral weight assigned
  to it conditional on being true. Treat the expected moral value of an insect-affecting
  intervention as the product of (i) the number of insects affected, (ii) the probability
  distribution over H0-H2, (iii) the conditional moral weight, and (iv) the change
  in welfare per insect. Both camps should accept this bookkeeping; they may disagree
  about every input.


  The statement should have: a numbered list of claims both sides can sign, including
  about what sentience would have to be, what the scale argument does and does not
  establish, and what kind of evidence could in principle bear on it; then a disagreements
  table with columns for the crux, each side''s formulation in wording its own side
  would accept, the test or case both sides agree would bear on it, and each side''s
  prediction. At least one crux should be about whether expected-value reasoning is
  action-guiding under deep uncertainty; at least one about whether current evidence
  already clears some threshold; and at least one about whether the conditional moral
  weight for insects could be comparable to that for vertebrates. Where a disagreement
  turns out to be merely verbal, say so and say why. Keep the whole thing under 850
  words, and do not include citations, reading lists, or references to specific authors."


