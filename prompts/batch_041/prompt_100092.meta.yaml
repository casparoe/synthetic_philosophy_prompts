  Essay draft:


  The standard move is to treat looping effects as a problem for the objectivity of
  psychiatric classification: we classify people, they internalize the classification,
  they change, and so the classification is "tracking" something it partly made. Hacking''s
  own examples — the successive waves of multiple personality / dissociative identity,
  the shifting profile of "homosexuality" before and after declassification, the child-abuse-survivor
  scripts of the 80s and 90s — are all cases where the label, the clinical template,
  and the patient population co-evolved.


  I want to argue that this framing buries the interesting variable. What matters
  isn''t whether a classification loops; almost all psychiatric classifications loop
  to some degree. What matters is the *gain* and the *delay* of the loop, and in particular
  whether the cultural script attached to the label is running ahead of, in step with,
  or behind the diagnostic criteria.


  So I want to distinguish two ideal types:


  - Cold loops: the label changes behaviour without much changing self-understanding.
  Someone gets a screening questionnaire, scores above threshold, starts monitoring
  their mood, fills in the same questionnaire at follow-up, and reports more symptoms
  because they''ve learned the items. The change is real but it''s mostly a reporting/attention
  artifact plus a mild behavioural adjustment. Think PHQ-9 style instruments, insomnia
  apps, ADHD self-screening.

  - Hot loops: the label changes the person''s self-narrative, and the narrative feeds
  back into what symptoms get experienced and reported. Hacking''s DID cases are hot;
  so is a lot of the current discourse around trauma, neurodivergence, and burnout.


  Then the claim: most of the "is this a real disorder or a social construction?"
  heat is actually about hot loops, but most of the empirical evidence we have about
  looping is generated in cold-loop settings (questionnaires, screening tools, diagnostic
  interviews). So the debate is running on the wrong evidence.


  Second claim: what gets called "concept creep" (a term''s extension widening over
  time so that milder cases count) is really just a loose hot loop where the script
  expands faster than the criteria. If you separate the two, concept creep stops looking
  like a moral panic and starts looking like a predictable dynamical consequence.


