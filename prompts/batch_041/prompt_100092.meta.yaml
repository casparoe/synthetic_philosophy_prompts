  *thin* (few instructions about how to be the kind of person). The thing that destabilizes
  a hot loop is that the script is *thick* and *narratively rewarding* (it explains
  suffering, gives a community, assigns an antagonist). Under that view, the DID epidemics
  and the recovered-memory stuff weren''t caused by bad clinicians alone; they were
