  improvements do not require interpersonal comparisons; they only require each person''s
  own ranking. This is a subtle conflation. Hasty grader might let slide because it
  sounds plausible.

  - "Harsanyi''s aggregation theorem ... shows that the only rational way to aggregate
  their preferences is a weighted sum of their utilities. This vindicates utilitarianism..."
  — Harsanyi''s theorem does give a weighted sum under axioms (and with interpersonal
  comparisons), but the claim that it "shows the only rational way" is too strong;
  also Harsanyi''s theorem doesn''t by itself vindicate utilitarianism in the classical
  sense because weights may differ (though Harsanyi''s veil-of-ignorance argument
  aims at equal weights). Could be a subtle overstatement. Alternatively, the student
