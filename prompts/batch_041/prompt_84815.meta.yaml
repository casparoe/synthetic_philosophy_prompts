  Let''s draft domain: Interpersonal utility comparisons.


  Question: "In welfare economics and ethics, interpersonal utility comparisons have
  often been treated as either indispensable or unscientific. Explain what is at stake
  in the debate. In particular: (i) distinguish ordinal from cardinal utility, and
  comparability from measurability; (ii) explain the role that assumptions about interpersonal
  comparability play in Arrow''s impossibility theorem and in Harsanyi''s aggregation
  theorem; and (iii) assess whether the ordinalist revolution was a genuine advance
  or an overreaction. Support your answer with at least one example."


  Student answer:

  "The ordinalist revolution, associated with Robbins and Hicks, argued that utility
  is not a measurable quantity and that economics should confine itself to ordinal
  rankings of individual preferences. On this view, saying that A has more utility
  than B is scientifically respectable only within a single person''s preference ordering;
  saying that A''s utility is greater than B''s is an interpersonal comparison, which
  requires a common unit and therefore cardinal utility. Since cardinal utility is
  not observable, interpersonal comparisons are unscientific.


  This has important implications for social choice. Arrow''s impossibility theorem
  shows that there is no way to aggregate individual preferences into a social ordering
  that satisfies a plausible set of conditions. But Arrow''s result depends on assuming
  that individuals'' preferences are ordinal and interpersonally non-comparable. If
  we allow interpersonal comparisons, the impossibility can be escaped; Sen''s work
  on social choice makes this point. Harsanyi''s aggregation theorem goes further:
  it shows that if individuals are rational and informed, then the only rational way
  to aggregate their preferences is a weighted sum of their utilities. This vindicates
  utilitarianism, or at least a version of it, because it shows that social welfare
  must be a sum of individual utilities.


  However, the ordinalist critique was too strong. Interpersonal comparisons need
  not be cardinal. We can often say, ordinally, that one person is better off than
  another—for example, that someone suffering from severe hunger is worse off than
  someone with a mild headache—without assigning numerical utility values. Moreover,
  Pareto efficiency, which is the central criterion of welfare economics, already
  involves interpersonal comparisons: to say that a change is a Pareto improvement
  is to say that some people are better off and no one is worse off, which compares
  welfare across persons. So the ordinalist revolution was an overreaction: it threw
  out a necessary and defensible form of interpersonal comparison along with the discredited
  cardinal psychology."


  Subtle mistakes:

