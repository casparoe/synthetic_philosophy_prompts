  Standard dollar auction: dollar bill auctioned, highest bidder pays their bid, second-highest
  also pays. Suppose you''ve bid $0.90, opponent $0.95. If you bid $1.00, you win
  $1, pay $1.00, net 0. If you quit, you pay $0.90. So bidding $1.00 gives you 0 vs
  -0.90: bidding is better. Then opponent at $1.00 faces -1.00 vs bidding $1.05 →
  win $1 pay 1.05 = -0.05, better than -1.00. So escalation continues past $1.00:
  at $1.05 for you (if you''re high bidder) vs quitting and losing... wait, only the
  two highest pay. If you''re highest at $1.05 you''d win $1 and pay $1.05 = -0.05,
  but the other guy then bids $1.10, you''d be second-highest and lose $1.05 if you
  quit. So the forward-looking comparison is: quit and lose your current bid as second-highest,
  vs bid higher to become highest and lose less. And crucially, the past bid is *not*
  sunk in the usual sense — it''s conditional on losing, so it is a real future cost.
  That''s the beautiful part: the dollar auction converts a "sunk" cost into a live
  one, so the escalation is genuinely forward-looking rational (given you''re in).
  So step (2) is NOT the sunk cost fallacy in the dollar auction — the money really
  will be paid. So the flaw is elsewhere: in *entering* the auction, or in the whole-strategy
