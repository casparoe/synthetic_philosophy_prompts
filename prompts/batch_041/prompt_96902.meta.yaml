  I''ve been going down a rabbit hole on this and I want the two sides to actually
  have it out, so here''s the setup. A friend of mine, Priya, is obsessed with this
  platform (she calls it Quid Pro Bono, I think that''s a joke name) that matches
  people with opposing moral priorities and arranges swaps between them. You register
  what you care about most and what you''d be willing to do that you otherwise wouldn''t,
  and it finds you a counterpart whose priorities run the other way. Her favorite
  example: a woman whose top cause is animal welfare agrees to vote for a candidate
  she thinks is terrible on gun policy, and in exchange a gun-rights guy agrees to
  go vegan for a year and give a chunk of his income to farmed-animal advocacy. The
  point is that no agreement on values is needed — each side just has to come out
  ahead in their own moral accounting, so it''s supposed to be a pareto improvement
  in moral terms, which is a weird and interesting idea. The platform has a few design
  tricks to stop people gaming it: pledges go into escrow with a third party, a swap
  only fires if both parties clear a ''surplus'' threshold, and there''s a forfeitable
  bond, so you can''t just inflate how much you claim to care in order to shake concessions
  out of someone. Priya thinks this is the most important moral invention in a century
  — it turns moral disagreement from a fight into a market, and it rewards intensity,
  since whoever cares most gains most. My other friend Marcus thinks it''s a horror
  show with a nice UX, and that the mechanism-design stuff makes it worse rather than
  better, because it hides what''s actually happening behind talk of ''surplus''.


  What I want is a dialogue between Priya and Marcus — think of yourself as a philosopher
  who works on moral conflict, partiality and the ethics of cooperation, and be careful
  not to let either of them be a pushover. I''d rather you spend a bit of time first
  brainstorming the strongest version of each position (maybe just a few bullet points
  to yourself) and only then write the scene, because the failure mode here is a dialogue
  where one side is obviously right. Some stuff I''d like to see them actually get
  into: whether there are commitments that simply can''t be traded without being abandoned
  (i.e. whether ''I''ll tolerate one wrong thing if you''ll tolerate another'' is
  coherent or is just doing the wrong thing with extra steps), whether the swap instrumentalizes
  the other person''s values or corrupts the trader''s own integrity, whether a bond-and-escrow
  design can really keep a market in moral concessions from rewarding people who manufacture
  extreme positions in order to sell them, and whether the ''no agreement on values
  needed'' claim is true or whether it quietly assumes a common unit of how much someone
  cares. Let them push back on each other''s actual arguments rather than trading
  monologues — if Priya makes a point, Marcus should answer that point, and vice versa
  — and let it end where it ends, with maybe a line about what they think they''re
  really disagreeing about.


