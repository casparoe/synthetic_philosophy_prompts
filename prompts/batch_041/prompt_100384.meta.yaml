  Handout summary (my invention):


  "A Dutch book argument runs as follows. Take an agent whose degrees of belief violate
  the probability calculus — say she thinks a coin is 0.6 likely to land heads and
  0.6 likely to land tails. A bookmaker who knows her credences can offer her a series
  of bets, each of which she regards as fair or favourable, such that whatever happens
  she ends up poorer. Since a rational agent would not accept a set of bets that guarantees
  a loss, her credences must have been incoherent, and so rationality requires that
  degrees of belief obey the probability axioms. De Finetti proved the general result,
  and it is the foundation of the subjective Bayesian view that there are no objective
  probabilities, only degrees of belief. The same style of argument extends to learning:
  because an agent who fails to conditionalize on her evidence can be Dutch-booked,
  the Dutch book theorem tells us that rational agents must update by Bayes'' rule.
  So the Dutch book arguments give us a complete theory of rational credence: it must
  be probabilistic, and it must be updated by conditionalization."


  Now, what''s right and what''s subtly wrong?


  Right: The synchronic Dutch book theorem: if credences violate the probability axioms,
  there''s a set of bets each of which the agent deems fair/favorable, whose combined
  payoff is negative in every outcome. (Careful: this requires the bets to be "acceptable"
  to the agent, e.g., she''s willing to take either side at her stated odds; and it
  requires the agent to be willing to make the combination of bets — the "package"
  issue.) So "she regards as fair or favourable" is roughly right. And "rational agent
  wouldn''t accept a sure loss" is the intuitive step. De Finetti: yes, de Finetti
  (1931, "Sul significato soggettivo della probabilità") gave the Dutch book theorem;
  also Ramsey (1926) had a related argument. So "de Finetti proved the general result"
  is fair.


  Subtle errors:

  1. "it is the foundation of the subjective Bayesian view that there are no objective
  probabilities, only degrees of belief" — conflation: the Dutch book theorem establishes
  coherence (probabilism), not the non-existence of objective probability. De Finetti''s
  subjectivism is a separate philosophical commitment. Also "no objective probabilities"
  is not entailed; many objective Bayesians accept chances and also accept the theorem.
  Also the theorem is about the agent''s credences being coherent; it doesn''t say
  what makes them rational in the sense of truth-tracking.


  2. "The same style of argument extends to learning... the Dutch book theorem tells
  us that rational agents must update by Bayes'' rule." — This is the *diachronic*
  Dutch book argument (Teller 1973, Lewis 1999 "Why Conditionalize?"), which is much
  more controversial: it assumes the agent knows in advance she''ll face the bets,
  that her future self''s credences will be the ones under attack, that she''ll accept
  bets at those odds, and there are "reflection" issues. So presenting it as the same
  theorem, and as a settled extension, is a misrepresentation. Also it''s not "the
  Dutch book theorem" but a separate result. Also the diachronic argument only shows
  that *if* you''re going to change credences, you should conditionalize (or something
  like that), and there are known counterexamples/limitations.


  3. "give us a complete theory of rational credence" — overstatement: Dutch book
  arguments establish only that credences should be *coherent* (obey the axioms);
  they say nothing about which prior is rational, so they don''t give a complete theory.
  Also there''s the "reference class"/"which prior" problem, the problem that coherence
  is necessary but not sufficient for rationality, the problem of logical omniscience,
  and the fact that a Dutch book argument is a *pragmatic* argument (about avoiding
  monetary loss) whose link to *epistemic* rationality is contested (you could be
  incoherent but never bet, or be risk-averse).


