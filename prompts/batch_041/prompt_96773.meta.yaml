  "I teach an upper-level undergraduate seminar on war and the ethics of political
  violence — roughly sixteen students, a mix of philosophy and international-relations
  backgrounds — and I have one 90-minute session to spend on nuclear deterrence. I
  would rather they play their way into the central paradox than hear me state it,
  so please design an in-class game for me.


  The paradox I want them to feel has two halves. The first half is a credibility
  problem: a threat to escalate that stays entirely under the threatener''s rational
  control is empty, because at the moment of decision carrying it out will not be
  worth the cost, both sides can see this in advance, and so the threat deters no
  one. The second half is the cure and its price: the only way to make such a threat
  credible without simply lying is to hand part of the decision to something outside
  one''s control — a randomiser, a subordinate who might act on their own, an automatic
  trigger, an ally who might run — and this is precisely what makes the situation
  dangerous, because the same surrender of control that gives the threat its force
  can also produce the catastrophe that neither side wanted. If it arises naturally,
  I would also like them to see a corollary: once the top of the escalation ladder
  is made unthinkable for both sides, the contest simply migrates downward, so the
  lower rungs grow less stable exactly as the top grows safer.


  Requirements for the design: [bullets]"


  Then bullets:

  - Setting: 90 minutes, ~16 students. Assume a room with a whiteboard and a table;
  keep materials cheap.

  - Roles: at least two opposed teams plus a third role for whoever handles chance
  and accidents, so that the randomness is visibly not under either team''s thumb.

  - An escalation ladder of four to six rungs with a payoff scheme in chips or points
  — no real money — whose numbers actually generate the intended dynamics. Please
  show the payoff table and check the arithmetic, including that conceding and matching
  are each sometimes attractive, so the threat is genuinely doubtful rather than obviously
  empty.

  - A first phase in which the defender''s announced threat to match fails to deter
  and the challenger climbs the ladder.

  - A second phase in which the defender is given some concrete way to cede control
  (a die, a delegate, a tripwire, an automatic response rule) and the students watch
  deterrence return — at the price of a real, unowned probability of disaster.

  - Either a third phase or a debrief move that brings out the corollary about the
  top of the ladder becoming safe while the bottom becomes dangerous.

