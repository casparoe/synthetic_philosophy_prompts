  Potential prompt:


  I am a Year 12 student and I edit the history section of my school''s academic magazine,
  and I also help run the sixth-form history society. We keep receiving essays and
  debate motions that turn on counterfactual claims of the form ''would there have
  been a Nazi Germany without Hitler?'', and the discussion usually collapses into
  either a romantic Great Man story or a vague appeal to structural forces such as
  the Depression, the fragility of the Weimar Republic, or the legacy of Versailles.
  I have been trying to think about this using some distinctions from the philosophy
  of history that I have encountered in a seminar: the difference between a cause
  as a difference-maker and a cause as part of a standing causal field; the notions
  of necessary, sufficient and INUS conditions; overdetermination; equifinality, or
  multiple paths to the same outcome; and the idea of a minimal counterfactual rewrite.
  What I want from you is a decision procedure that a sixth-form student with no specialist
  training could actually run on a counterfactual historical claim, not a lecture
  on the historiography. The procedure should tell me which questions to ask in order,
  what would count as a sufficient answer at each stage, where it should stop and
  return a verdict of ''not warranted'' or ''warranted enough to discuss'', and where
  it must hand the matter over to judgment rather than pretending to settle it.


  Then run the procedure on two claims: first, that without Hitler there would have
  been no Nazi Germany; second, that without the Great Depression the Nazi Party would
  never have come to power. I am especially interested in the case where the procedure
  gives an answer that a committed Great Man theorist or a committed structuralist
  would dislike, and in what the procedure cannot do. Please give me exactly five
  numbered items, each a sentence or two, with no introduction or conclusion, and
  write in British English; do not give me a bibliography, reading list or citations.


