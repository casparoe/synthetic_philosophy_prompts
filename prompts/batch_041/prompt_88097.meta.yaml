  For a graduate seminar I am preparing on temporal experience, I have been collecting
  the folk slogans my students use to domesticate the color phi phenomenon, and one
  keeps recurring: ''experience is edited after the fact''. I have now heard it deployed
  for two opposite purposes. One student uses it to deflate the phenomenon: of course
  the first dot seems to change colour before the second arrives, because the brain
  simply revises the experiential record once the second flash is registered; there
  is no more mystery here than in any other post-hoc reconstruction. Another student
  uses the same sentence to radicalize the phenomenon: if the colour change is genuinely
  experienced as occurring before the second flash, then experience itself must be
  assembled retrospectively, so that what we call the present moment of consciousness
  is partly constituted by events that have not yet happened at the time we seem to
  be living through it. I am less interested in adjudicating between those students
  than in seeing exactly how much work the slogan can bear.


