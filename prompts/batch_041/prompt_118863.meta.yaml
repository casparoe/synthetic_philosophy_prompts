  a statement of sympathy has no probative value regarding fault (so exclusion is
  not really needed) whereas a statement of fault is an admission. But wait — if sympathy
  statements had no probative value they wouldn''t need statutory protection. So the
  statute presupposes that juries would treat sympathy as an admission of fault —
  i.e., that the inference from "she apologized" to "she''s liable" is psychologically
  compelling but epistemically invalid. That''s an assumption about how utterances
  are received, and it sits in tension with the "objective" theory of meaning: the
  statute treats the *uptake* (jury inference) as the thing to be regulated, not the
  speaker''s intention. So it presupposes something like a Gricean/Austinian picture
  where the act''s significance depends on audience recognition — and yet the statute''s
  remedy is to hide the act from the audience rather than to correct their inference.
  That''s a nice tension: the law distrusts the very audience it constitutes.

