  meant it. It protects insincere sympathy equally. So it presupposes that the illocutionary
  act''s legal effect is independent of the sincerity condition — an "externalist"
  or "conventionalist" view of speech acts (Austin''s felicity conditions are only
  partially enforced), while the surrounding law of misrepresentation/duress does
