  committing the speaker to the proposition that they are at fault — i.e., that "I''m
  sorry this happened to you" is a distinct act from "I''m sorry I did this." This
  is basically the sympathy/apology distinction, and arguably true (there is a genuine
  distinction) but the statute also presupposes the components are independently *available*
  in a single utterance and can be surgically severed. Austin: can an utterance that
  would ordinarily implicate fault be made fault-free? Gricean implicature: "I''m
  so sorry about what happened" implicates fault. The statute presupposes implicatures
  don''t survive the excision.

