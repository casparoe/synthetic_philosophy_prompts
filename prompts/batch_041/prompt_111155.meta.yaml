  Dennett vs Caruso: Dennett is a compatibilist about free will, thinks we''re "not
  just the sum of our parts" in some sense; Caruso is a free will skeptic / hard determinist
  / hard incompatibilist who holds that retributive punishment is unjustified but
  consequentialist/forward-looking punishment may be. The "just deserts" debate: Caruso
  argues no one deserves retributive punishment; Dennett defends some notion of desert,
  moral responsibility as a social practice, "the web of moral responsibility." Caruso''s
  "free will skepticism and its implications for the criminal justice system" — he
  endorses non-retributive, consequentialist approaches like quarantine model. Dennett''s
  "Elbow Room" and "Freedom Evolves." The debate is often framed as "just deserts"
  vs "public safety."


