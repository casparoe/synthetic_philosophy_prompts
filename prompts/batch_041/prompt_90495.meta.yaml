  people, selected at random, to sit in judgment on a fellow citizen''s liberty; we
  do not require them to be lawyers or to have spent decades campaigning for the job;
  we give them evidence, let them deliberate, and accept their verdict. If that is
  rational in the courtroom, he says, it is rational in the chamber, and the only
  reason we have career politicians is that we have never tried the obvious alternative.
  He takes the analogy to license a fairly strong conclusion: not merely that we should
  add citizens'' assemblies to the existing system, but that sortition should replace
  election for the legislature, and that term limits are a half-measure that merely
  rotates the same professional class. I am not convinced, but I also do not want
  to answer with the usual slogans about expertise and accountability. Could you audit
  the analogy properly? I want an explicit mapping of what corresponds to what—juror
