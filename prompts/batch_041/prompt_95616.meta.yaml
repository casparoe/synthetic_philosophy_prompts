  I serve on the ethics and risk committee of a small nonprofit that runs an annual
  online rationality conference, and I have been a longtime reader of rationalist
  blogs and forums—LessWrong, the old Overcoming Bias archives, the Slate Star Codex
  comment section—so I know how these arguments usually go. A researcher has proposed
  running a real-money Luring Lottery during the conference, and the committee has
  to decide whether to approve it. The basic design is this: any registered attendee
  may submit as many entries as they like. A prize of ten thousand dollars is divided
  equally among all entries. If no entries are submitted, the money goes to a charity
  chosen by the committee. The researcher argues that this tests superrationality
  in a way that a standard prisoner''s dilemma does not, because the payoff to each
  participant depends on the total number of entries, not just on whether they personally
  cooperate. To try to induce cooperation, the researcher wants to add a pre-commitment
  round: before the lottery opens, each participant may pledge to submit zero entries
  if at least one hundred other participants pledge the same. If the threshold is
  met, everyone who pledged is bound to submit zero. If the threshold is not met,
  the pledges are void and anyone may submit any number of entries. The researcher
  wants to compare the pledge rates, the entry counts, and the final payouts across
  two conference sessions, one with the pre-commitment round and one without.


  My committee is split. Some members think this is a clever and harmless experiment
  that the community will enjoy and that might actually teach us something about conditional
  cooperation. Others think it is a waste of ten thousand dollars that will almost
  certainly be diluted to a few cents per entry, that the pre-commitment round is
  a gimmick that will either fail or be gamed, and that the committee should not be
  in the business of running lotteries that could make participants feel foolish or
  manipulated. I am inclined to approve it with conditions, but I want a proper written
