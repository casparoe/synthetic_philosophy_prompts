  ---


  I build AI agents for a living — small team, LLM-based "agentic" products — and
  I keep getting into the same dumb argument with my cofounders about whether our
  stuff is "actually reasoning" or "just autocomplete with extra steps," and whether
  we can honestly put "reasons about your data" on the marketing page. A friend who
  studied philosophy told me there''s an old framework that might actually help here,
  four grades of "creature," each one built on top of the last, and the point of the
  ladder is where the trial-and-error happens and what a wrong guess costs you.


  Roughly, as I understand it:


  - Grade 1, born with a fixed repertoire; it only "learns" across generations, and
  a mistake costs you your life or your lineage. Selection happens out in the world,
  over evolutionary time.

  - Grade 2, can learn within its own lifetime from reward and punishment, but it
  has to actually do the thing and get the feedback — the error is real, it happens
  in the world, and it costs real time and real reward.

  - Grade 3, can represent the world inside itself and try out candidate actions against
  that model before committing — so it can be wrong cheaply, in simulation, and only
  act on the survivor. The error dies instead of the creature.

  - Grade 4, same as grade 3 but its mind is stuffed with tools it didn''t invent
  — language, number, notation, external memory, other people''s accumulated tricks
  — and those tools do part of the thinking for it. Take the tools away and a lot
  of the cleverness goes with them.


  I want to turn this into a procedure I can actually run, maybe once a week, every
  time we''re deciding what to claim about a system or what capability to build next.
  The procedure should:


  1. fix the task and the performance measure first (I can''t classify "the agent"
  in the abstract, only an agent doing a particular job);

  2. walk me through tests, in order, to find the highest grade the system actually
  occupies on that task — and each test has to be something I can actually run, not
  a vibe check. I''m especially interested in a test for grade 3 vs grade 2 (does
  it have to act to learn, or can it screen candidates without acting?) and for grade
  3 vs grade 4 (what''s left when I strip the tools — the prompt scaffolding, the
  retrieved documents, the calculator, the memory — does the competence survive?);

  3. say what I''m allowed to conclude once I''ve placed it, and what I''m not — including
  the cases where the honest answer is "the competence lives in the harness, not the
  model," or "this thing is grade 2 and I''ve been calling it grade 3";

  4. flag where the tests are inconclusive or where I''m really making a judgment
  call, and what the procedure simply can''t settle.


  Then run it on three systems: (a) a plain next-token model with a good prompt and
  nothing else; (b) one of those agent loops that proposes an action, calls a tool,
  reads the result, and revises, with a scoring function it''s trying to maximize;
  (c) a system that is the same loop but with a big external scratchpad and a library
  of retrieved past solutions. Tell me where each one lands, and be honest about the
  one where the answer is least flattering to us.


  Also, since the whole point of the ladder seems to be that higher floors make errors
  cheaper — I''d like the procedure to spit out a recommendation, not just a label:
  for this task, is the floor we''re on high enough given how expensive a mistake
  is, or are we about to make expensive errors because we built something that only
  learns the expensive way?


  And one warning I''d want built in: the grades are supposed to be cumulative layers,
  not boxes, so a grade-4 system is also grade 3 and 2, and I should be locating the
  top floor rather than sorting the system into a bin. If the procedure ignores that
  I''ll misuse it.


