  over a period of months, with silicon prosthetics that are designed to be functionally
  identical at the level of input, output, and internal dynamics. The replacement
  is done in weekly sessions, with a full neuropsychological battery every ten percent,
  and the patient remains conscious and responsive throughout. The board is not asking
  whether the procedure is safe in the ordinary sense; it is asking how to decide,
  protocol by protocol, whether the person who emerges is the same person who consented,
  for purposes such as the validity of the original consent, the standing of an advance
  directive, the authority of a spouse or parent to speak for the patient, and the
  patient''s own legal and moral claims. The board meets monthly, has no metaphysicians
  on it besides me, cannot run multi-year follow-up studies, and must give a recommendation
  to the hospital''s ethics committee, which has final say. I want a procedure the
  board can actually run on a protocol, in the order of questions to ask, what would
  count as a sufficient answer at each step, where the procedure should stop with
