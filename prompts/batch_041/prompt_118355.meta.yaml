  Facts I''m fairly confident about:

  - Gödel published a 1949 paper "An Example of a New Type of Cosmological Solutions
  of Einstein''s Field Equations of Gravitation" in Reviews of Modern Physics. The
  solution is a rotating universe (Gödel metric), homogeneous, with closed timelike
  curves — so a global time function doesn''t exist. Gödel used it to argue that time
  is "ideal" / that the passage of time is an illusion (following McTaggart; he became
  a McTaggartian idealist about time). He argued the existence of such solutions shows
  that the objectivity of time is not required by relativity — i.e., relativity doesn''t
  force us to accept an objective time; he thought the "ideal" theory of time is preferable.
  He presented this as an argument in "A Remark about the Relationship between Relativity
  Theory and Idealistic Philosophy" (1949).

  - In the 1949 paper, Gödel did NOT claim time travel is physically possible or that
  the universe is actually rotating; he offered it as a solution to Einstein''s equations
  demonstrating that relativity permits such a world. He also noted that the solution''s
  existence shows the objectivity of time is not established by relativity.

  - The closed timelike curves: Gödel himself noted that a traveler could in principle
  go into the past. Gödel remarked that the "scientific" objection is not the paradoxes
  but that... Actually Gödel discussed that travelling into the past is possible in
  the Gödel universe, and he noted one could travel into the past and return.

  - Also the chronology protection conjecture (Hawking) — a later development.


