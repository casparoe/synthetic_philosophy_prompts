  Essay draft (~600 words):


  ---

  Comments on "Frankfurt cases and the principle of alternative possibilities"


  The principle of alternative possibilities (PAP) says that someone is morally responsible
  for an action only if they could have done otherwise. Harry Frankfurt''s famous
  cases are supposed to show that this is false. In the standard case, a neuroscientist
  secretly monitors someone''s brain; if the person had been about to decide against
  some action, the neuroscientist would have intervened and made them do it; but the
  person decides on their own, so the scientist never intervenes. The person seems
  responsible, yet (the argument goes) they could not have done otherwise.


  I want to offer a new case that avoids two features of the standard one that I think
  make it easier to resist: the sci-fi neuroscience and the fact that the backup agent
  is a person with a weird power over someone''s brain. My case is ordinary and institutional.


  The Waiver. Ravi is a high-school debater who discovers, the night before the regional
  final, that he is technically ineligible: he attended a practice tournament that,
  under the rules, counts as a qualifying event, and two qualifying events disqualify
  a team. Nobody else knows. The rules also say that if an ineligible debater competes
  and this is discovered later, the whole team forfeits all its wins. Ravi''s coach,
  Ms. Adeyemi, knows about the ineligibility and has already decided what to do: if
  Ravi does not come forward by the start of the final, she will withdraw the team
  herself. So Ravi will not compete either way. Ravi comes forward on his own, because
  he thinks it would be dishonest to compete knowing he is ineligible. His own reasoning,
  and nothing else, produces his decision.


  I claim this is a Frankfurt case: Ravi could not have competed — Ms. Adeyemi''s
  decision made sure of that — yet he is responsible for withdrawing the team, and
  in fact praiseworthy for it. The backup made no difference.


  I then try to strengthen the case. Someone might say: the reason Ravi could not
  have competed is that Ms. Adeyemi *would have* stopped him, which is a fact about
  the counterfactual, not about Ravi. So I propose a probabilistic version: Ms. Adeyemi''s
  plan depends on her getting the email before the final, and she only checks her
  inbox about half the time. So there is only a 50% chance she would have stopped
  him. I think this makes no difference: what matters is that in the actual world,
  Ravi decided for his own reasons.


  Then I answer an objection. A defender of PAP might say that even in Frankfurt cases
  the agent could have done otherwise in some small way: Ravi could have come forward
  a minute later, or come forward angrily, or come forward for a worse reason. This
  is sometimes called a "flicker of freedom." I reply that a flicker is not enough
  to satisfy PAP, because PAP is about the action the agent is responsible for — withdrawing
  the team — and Ravi could not have failed to withdraw the team. So PAP is false
  as stated.


  My conclusion: responsibility does not require the ability to do otherwise, because
  what matters for responsibility is why the agent acted — whether the action came
  from the agent''s own judgment — not whether other actions were available to them.


  ---


