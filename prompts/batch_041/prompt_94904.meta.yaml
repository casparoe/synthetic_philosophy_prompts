  Responsibility Without Alternatives: A Case Against the Principle of Alternative
  Possibilities


  The principle of alternative possibilities (PAP) says that a person is morally responsible
  for what they have done only if they could have done otherwise. Harry Frankfurt''s
  well-known cases are meant to refute it. In the usual version, a neuroscientist
  has secretly wired someone''s brain so that, if the person were about to decide
  against some course of action, the neuroscientist would intervene and produce the
  decision to act; as it happens, the person decides to act on their own, and the
  device is never used. The person seems responsible, and yet, the argument runs,
  they could not have done otherwise.


  Two features of these cases invite resistance. The first is the science fiction:
  readers who do not believe in that sort of brain surgery can tell themselves the
  case is impossible and move on. The second is that the backup is a person with an
  unexplained power over someone else''s mind, which makes it hard to say what the
  agent''s own contribution was. I want a case that is ordinary and institutional,
  where the backup is nothing more sinister than a rule and a plan.


  The Waiver. Ravi is a high-school debater who learns, the night before the regional
  final, that he is technically ineligible. He once attended a practice tournament
  that the rules count as a qualifying event, and two qualifying events disqualify
  a team. Nobody else knows about this. The rules also provide that if an ineligible
  debater competes and the ineligibility is later discovered, the team forfeits all
  of its wins. Ravi''s coach, Ms. Adeyemi, has also learned of the ineligibility and
  has decided what to do about it: if Ravi has not withdrawn by the start of the final,
  she will withdraw the team herself. Either way the team does not compete. Ravi withdraws
  the team himself, on the morning of the final, because he thinks it would be dishonest
  to compete while ineligible. His own judgment, and nothing else, produces his decision.


  I claim this is a Frankfurt case. Ravi could not have competed: Ms. Adeyemi''s plan
  guaranteed that the team would be withdrawn. Yet Ravi is responsible for the withdrawal,
  and it seems right to praise him for it. The backup made no difference to what happened.


  I want to distinguish two ways a backup can work. A choice-closing backup closes
  off the agent''s alternatives at the moment of decision, the way the neuroscientist''s
  device does: had the agent been about to decide otherwise, the decision itself would
  have been replaced. An outcome-closing backup only guarantees the result: the agent
  might have decided otherwise, but the world would have been arranged so that the
  result came out the same anyway. I take it that only choice-closing backups generate
  the Frankfurt result, and I take The Waiver to be a choice-closing case, because
  Ms. Adeyemi''s plan makes the team''s withdrawal unavoidable no matter what Ravi
  decides.


  One might object that the trigger of Ms. Adeyemi''s plan is not Ravi''s decision
  but a public event, the start of the final. If so, then Ravi could have decided
  to keep silent, and only been thwarted afterwards; his decision to come forward
  was not itself unavoidable. I think this is a technicality rather than a real difference.
  If he had kept silent, the team would still have been withdrawn, so the alternative
  of competing was never genuinely open to him.


  I also propose a probabilistic version, to show that the case does not depend on
  the backup being certain to work. Suppose Ms. Adeyemi checks her email only about
  half the time, so that there is only a 50% chance that she would have learned of
  Ravi''s silence in time to act. I claim this changes nothing: what makes Ravi responsible
  is that in the actual world he acted for his own reasons, and a lower probability
  of intervention does not give him back the alternative of competing.


  Finally, an objection from the other side. A defender of PAP may concede that Ravi
  could not have competed, but insist that he could have done otherwise in some smaller
  respect: he could have come forward a minute later, or angrily, or for a worse reason.
  This is sometimes called a flicker of freedom. I reply that a flicker is not enough
  to satisfy PAP. PAP concerns the action the agent is responsible for, which here
  is the withdrawal of the team, and Ravi could not have failed to withdraw the team.
  So PAP, as it is usually stated, is false.


  Conclusion: moral responsibility does not require the ability to do otherwise. What
  matters is why the agent acted, and whether the action came from the agent''s own
  judgment, rather than how many alternatives were available to them.


