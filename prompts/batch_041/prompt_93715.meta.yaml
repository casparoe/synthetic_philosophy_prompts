  from one lost ur-source.

  3. **Evidential inversion**: treating the absence of expected evidence as positive
  evidence of suppression.

  4. **Scale-jumping**: moving from a local anomaly or translation error to a global
  rewrite of a civilization.

  5. **Moralization of method**: making the political/religious stakes of the conclusion
  do the work of the evidence.

  6. **Source-capture**: relying on a small set of texts while treating the rest of
