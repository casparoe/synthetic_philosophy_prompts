  ---


  I am a doctoral candidate in comparative philosophy, and I have to give a seminar
  defense of a single thesis rather than a survey, so I need a verdict, not a menu.
  The comparison I have been assigned is between two responses to human mortality
  that are often lumped together as consolations but seem to me to rest on very different
  foundations: the Epicurean claim that death is nothing to us, since what is good
  or bad must be experienced and death is the cessation of experience, and the Zhuangzian
  attitude in which dying is one phase of the ceaseless transformation of things,
  to be met with equanimity — the attitude behind the familiar stories of his singing
  and drumming after his wife''s death and of his indifference to how his own body
  is disposed of, whether by crows above ground or ants below.


  I want you to compare these two positions on the specific question of whether death
  is an evil for the one who dies, and then commit to a verdict about which position
  is more defensible and where the other one fails. Please treat the following as
  the pressure points you must work through rather than gestures at, and do not simply
  rehearse what either thinker is standardly said to hold.


  First, keep separate two things the slogans run together: the claim that death is
  not a harm at all, and the claim that death may be a harm but equanimity toward
  it is nonetheless warranted. Decide which of the two positions actually asserts
  which, and say whether the Zhuangzian "transformation" language is best read as
  a metaphysical claim about what death is or as a therapeutic stance toward it —
  and what follows for the comparison either way.


  Second, take seriously a case that neither doctrine was designed for: a person dies
  leaving a body of work she cared about above all else, and the work is subsequently
  misrepresented or destroyed. Does the Epicurean view have any room to call this
  a misfortune? Does the Zhuangzian? Use the divergence, if there is one, to say which
  view better captures our ordinary conviction that the dead can be wronged.


  Third, address grief and mourning directly. Epicureanism appears to speak mainly
  to the fear of death and to say little about why we mourn; the Zhuangzian stories
  are about mourning and the treatment of the corpse. Say whether this asymmetry marks
  a genuine advantage for one view or merely a difference in what each was trying
  to do.


  Finally, give me your verdict: which of the two you would defend, what its strongest
  version is, and the single objection to it you find hardest to answer. State your
  position plainly and give your reasons; if the comparison forces you to choose between
  them on one issue while conceding the other on another, say so explicitly rather
  than balancing them into a draw.


