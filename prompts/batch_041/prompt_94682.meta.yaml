  Potential student answer:


  "Hacking''s looping effects describe a two-way relation between a classification
  and the people classified. When a new category is introduced—say ''dissociative
  identity disorder'' or ''autism spectrum disorder''—people who fit it may come to
  understand themselves in its terms, alter their behavior and self-reports, and thereby
  change the profile of the category. Researchers then revise the criteria, which
  feeds back into the people. This is what Hacking calls ''dynamic nominalism'': our
  names and our natures are made together. It contrasts with the standard natural-kind
  picture, where the kind is fixed independently of our labeling. Hacking distinguishes
  ''interactive kinds'' from ''indifferent kinds.'' Indifferent kinds—like chemical
  elements or, arguably, many biological species—do not respond to their classification.
  Interactive kinds do, because the classified are aware of being classified and can
  take up, resist, or negotiate the label.


  It is important not to confuse looping effects with the crude claim that psychiatry
  simply invents its disorders. Hacking is not saying that mental illness is a myth.
  The looping effect presupposes that there is something there to classify; the question
  is what happens once the classification is in place. Nor is it just labeling theory
  in the sociological sense, because the effect is not always a self-fulfilling prophecy:
  a person can react against the label, and the category can become less applicable
  over time. So looping effects are compatible with the existence of real suffering
  and with biological contributions to psychiatric disorders.


  Does this undermine the claim that psychiatric categories are natural kinds? I think
  Hacking''s answer is yes, at least for the categories he discusses. If a kind changes
  in response to being classified, it cannot be a natural kind in the strict sense,
  because natural kinds are supposed to be stable, discovered rather than made, and
  independent of our descriptions. Hacking sometimes suggests that all psychiatric
  categories are interactive kinds, since they all classify people who can reflect
  on the classification. That would mean psychiatry is not a natural science in the
  same way as chemistry. But this does not show that psychiatric categories are arbitrary
  or that they do not track anything real. It shows that they are ''human kinds,''
  which are historically situated and normatively loaded. The looping effect is thus
  an argument for a cautious, historically informed realism about psychiatric classification,
  not for anti-psychiatry."


