  I recall: In the Pasadena game, the expected value is the alternating harmonic series,
  which converges to ln 2 (with the natural ordering), but since it''s conditionally
  convergent, rearrangements give any value — so it''s "undefined" in the sense that
  the limit of partial sums depends on ordering, and different "natural" ways of computing
  give different answers. Actually the standard analysis: the Pasadena game has an
  expected value that is not well-defined because the series is conditionally convergent:
  you can get +∞, −∞, or any real number by rearrangement. And the Altadena game:
  payoffs are all positive: 2^n/n, so EV = sum_{n} (1/2)^n · 2^n/n = sum 1/n = ∞ (diverges
  to +∞). So Altadena has infinite EV, Pasadena undefined. And the puzzle: Altadena
  seems obviously better (it''s the same but with negative payoffs made positive),
  yet if you use "expectation" reasoning you''d pay any finite amount for Altadena,
  but intuitively you shouldn''t. Also the "Petersburg" comparison.


