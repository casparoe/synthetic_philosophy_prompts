  Cleaner version:


  Phase 1 — Personal allocation. Everyone gets 12 tokens to spend across their own
  next 6 periods (each period = 10 years). The world is neutral: a token spent in
  period 4 gives exactly as much good as a token spent in period 1. Most people will
  still front-load or spread. Record the distribution. → establishes that people have
  a bias toward the near even with no cost to waiting.


  Phase 2 — Price of waiting. Now the world charges: a token spent in period t yields
  1 token of good, but you can instead "invest" and get a return... Hmm, that muddies
  with legitimate reasons (uncertainty, returns).


  Phase 3 — The parity round. Same task, but now the rule is: goods only count if
  the period is even-numbered. Tokens spent in odd periods are void. Now ask: how
  did you allocate? Everyone will pile into even periods. Then ask: what does your
  allocation reveal about your *valuation* of period 3 vs. period 4? You value even
  periods more *purely because of their label*. Everyone will say: that''s arbitrary,
  I was just working around a stupid rule; I don''t actually think even periods matter
  more. → Now the punchline question: what''s the difference between "even" and "later"?
  Then Phase 4.


