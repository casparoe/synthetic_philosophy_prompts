  6 cohorts of ~3-4. Each cohort is "alive" only during its period. The group must,
  before knowing which cohort they''ll be in, write a rule for how the group''s shared
  60 tokens will be allocated across the 6 periods. Then randomly assign cohorts.
  Then each cohort in turn gets to *revise* the allocation for its own and later periods.
  Because each cohort only lives in its own period, they''ll vote to grab. This shows
  the incentive structure producing presentism, and — crucially — the *unanimity*
  test: behind the veil, no one chose the presentist rule; but in the seat, everyone
  does.


