  I''m a second-year PhD student in political theory, with a background in constitutional
  law and a side interest in the philosophy of action, and I''m trying to settle on
  a dissertation agenda over the next three years. My broad area is precommitment:
  Ulysses contracts on the individual side, constitutional entrenchment on the collective
  side. The standard questions are familiar—whether a person can bind her future self
  without assuming a unified self, whether a sovereign people can bind future majorities
  without a constituent power that stands outside time, how to distinguish legitimate
  entrenchment from dead-hand rule. What I keep running into is a less standard framing
  that came out of a workshop discussion, and I want to know whether it should reorganize
  the field for me. The suggestion was that the most interesting precommitment is
  not against future weakness of will but against future *better judgment*: you bind
  yourself not because you expect to be tempted, but because you expect your future
  self to have better evidence and yet be subject to pressures—social, institutional,
  emotional—that will make her interpret the evidence badly. On that view, the object
  of the contract is not a future choice but a future interpretive stance, and the
  constitutional analogue is not entrenching a policy but entrenching a rule of recognition
  or a method of interpretation. I find this compelling, but I can''t tell whether
  it''s a genuine research program or just a vivid redescription of ordinary epistemic
  humility.


  Given that framing, which open questions in the area of Ulysses contracts and constitutional
  precommitment matter most for someone with about three years and a philosophy/law
  background, and in what order should I take them? I''m less interested in a survey
  than in a defended agenda: for each question, why it is upstream of others, whether
  it is tractable with conceptual tools rather than empirical work, and what would
  move it up or down my list. I''d also like you to say which of the familiar questions
  are overrated once the epistemic-precommitment framing is on the table, and which
  new questions it makes salient—e.g., whether binding one''s future interpretation
