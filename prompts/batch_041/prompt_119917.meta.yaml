  I have been trying to understand why the Sleeping Beauty problem has resisted resolution
  for decades, and I want a diagnosis of the disagreement rather than another attempt
  to settle it.


  The setup, as I take it: Beauty is put to sleep on Sunday. A fair coin is tossed.
  If heads, she is woken once (Monday) and the experiment ends. If tails, she is woken
  twice (Monday and Tuesday) with her memory of the Monday awakening erased between
  them. On any awakening she does not know which day it is. The question: what credence
  should she assign to heads on waking?


  Halfers say 1/2, on the ground that her evidence on waking is the same whether the
  coin landed heads or tails (the awakening is guaranteed either way), and a fair
  coin''s chance is unaffected by guaranteed events. Thirders say 1/3, on the ground
  that among the three "awakenings" she could be undergoing, two are tails and one
  is heads, and she has no information distinguishing them. Both arguments are now
  extremely well known, both have survived a generation of criticism, and the debate
  shows no signs of moving. I want to know what kind of disagreement this is.


  My hypothesis — offered as a hypothesis, not a conviction — is that the impasse
  is partly verbal and partly substantive, and that separating the two is most of
  the work. The verbal part: "credence" is used by the two camps to mean two different
  things that come apart exactly in self-locating cases. The halfer means a degree
  of belief subject to an evidential constraint — a credence must track the information
  available to the agent, and no merely guaranteed event can shift it. The thirder
  means something closer to a fair betting quotient or a long-run frequency over the
  agent''s possible situations — a credence that is answerable to how often the agent
  will be in each situation. These two roles coincide in ordinary cases and diverge
  here.


  The substantive part, if there is one: whether the mere fact of being a particular
  one of several indistinguishable experiences the agent might be having is itself
  evidence — whether self-locating information ("I am this awakening rather than that
  one") can be a reason to change a belief, or is only ever a way of locating an already-complete
  body of evidence in the world.


  I want a diagnosis that engages the actual arguments on both sides, not a survey.
  Concretely: is the halfer''s "same evidence" claim true on a notion of evidence
  that the thirder should accept, or is it the point at issue? Does the thirder''s
  counting of awakenings presuppose a principle about how to weight possibilities
  that the halfer can reasonably reject (some principle of indifference over the agent''s
  locations), and if so is that a factual dispute, a dispute about rational constraints,
  or a choice of conventions? Is there a third option — the "double halfer" who gives
  1/2 on waking but 1/2 again on Monday — and does it make the dispute worse or show
  that both camps have been conflating two different questions (the credence on waking
  vs. the credence conditional on being told it is Monday)?


  I have one further suspicion I would like tested rather than assumed. I think many
  participants have been answering a decision-theoretic question — what odds should
  Beauty accept on a bet that pays only once, or that pays at every awakening — and
  reading the answer back as the credence. If the two camps are actually answering
  two different betting questions, then the disagreement may be entirely resolvable
  by fixing the question, and the residual philosophical dispute is much smaller than
  the literature suggests. If instead the betting considerations underdetermine the
  credence, then the dispute is genuine and the "which question are you asking" move
  is a dodge.


  So: diagnose the disagreement. Say which parts of it are verbal, which are about
  the norms of credence, and which (if any) are about the facts; tell me what a party
  to the dispute would have to concede for it to move; and tell me honestly whether
  the problem is ill-posed, under-specified, or merely hard. If you think a single
  well-chosen variant of the case (a biased coin, a random number of awakenings, an
  awakening that reveals the day) would separate the positions, describe it and say
  what it would show.


