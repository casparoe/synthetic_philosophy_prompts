  seem to divide over whether it is a theorem, a definition, or an empirical hypothesis,
  and the debate is usually conducted as though one claim were at stake and we merely
  disagreed about its label. I think that is a mistake, because the thesis is asked
  to do two quite different jobs and the two jobs pull in opposite directions. The
  first job is constitutive: the thesis fixes what counts as an algorithm or an effective
  procedure, and in doing so it underwrites the impossibility results — the undecidability
  of halting, the absence of a decision procedure for first-order validity — that
  give computability theory its teeth. For that job the thesis had better not be hostage
  to what physicists happen to find in the world. The second job is delimiting: the
  thesis is used to say that no physical system computes more than a Turing machine
