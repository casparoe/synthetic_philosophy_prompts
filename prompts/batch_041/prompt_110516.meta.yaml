  I am a retired insect ecologist who spent forty years in agricultural research and
  who, since retiring, has been reading moral philosophy and serving as a lay member
  of a regional pest-management ethics committee. The committee reviews proposed field
  trials and emergency exemptions for pest-control technologies. It has no formal
  charter, but it has accumulated a set of decisions that I am trying to understand
  as a consistent body of doctrine. I would like your help in predicting what it will
  do with the next proposal, and in seeing which principles its past decisions actually
  commit it to.


  The committee''s decisions to date are these:


  1. It approved a field trial of a synthetic pheromone mating disruptant for codling
  moth in apple orchards. The compound is volatile, affects only codling moth, kills
  no insects directly, and can be discontinued at any time. Some organic growers complained
  about drift and cost, but the committee approved.


  2. It rejected an emergency exemption for a broad-spectrum pyrethroid spray against
  aphids in a watershed containing wild salmon. The spray would have prevented a substantial
  crop loss, and the growers intended to kill only aphids, but runoff would foreseeably
  kill aquatic invertebrates and damage salmon habitat. The committee rejected it.


  3. It approved a sterile-insect-technique program for medfly. The program irradiates
  and releases millions of sterile flies; some non-target fruit flies are caught in
  monitoring traps and killed, and there is a small risk that the released strain
  could displace a native relative. The committee approved, citing the fact that the
  program replaces repeated broad-spectrum spraying and can be halted.


  4. It rejected the introduction of a generalist parasitoid wasp for biological control
  of an invasive scale insect. The wasp would probably reduce insecticide use, but
  it might attack native moths, and once established it could not be recalled. The
  committee rejected it.


  5. It approved a contained greenhouse trial of a systemic neonicotinoid on ornamental
  plants. Runoff was captured, no flowering plants were present, and the committee
  judged pollinator and waterway exposure to be effectively zero.


  6. It rejected outdoor use of the same neonicotinoid on a flowering crop during
  bloom, because pollinators would be exposed, even though the treatment would have
  reduced spraying.


  7. It approved a push-pull intercropping system that used a repellent plant and
  a trap crop to reduce pest infestation without synthetic pesticide. The system required
  more labor and diverted some land, but the committee approved because it was non-toxic
  and easily reversed.


