  "Write a dialogue between two philosophers about Avicenna''s flying man — the thought
  experiment in which a person is imagined created all at once, suspended in midair,
  with his limbs separated and his senses blocked, so that he experiences nothing
  external and nothing of his own body, yet still affirms that he exists. One speaker
  holds that the experiment establishes something substantial: that the soul (or the
  self) is not a body and does not depend on the body for its existence — that it
  is a self-subsistent immaterial substance. The other holds that it establishes nothing
  of the kind. Both are competent; neither is a strawman; each must engage the other''s
  actual arguments and concede a point when the other lands one.


  Let them work through at least these questions, in whatever order the exchange makes
  natural:


  - What exactly does the flying man know, and by what means? Is the awareness he
  is supposed to have a perception, an intuition of self, a judgment, or the mere
  absence of any experience of body? Does the experiment require him to be aware of
  himself *as a thing*, and if so, has the conclusion been smuggled into the description?

  - The gap between the epistemic and the metaphysical. Even if bodily sensation is
  not needed for self-awareness, does that show the self can exist without the body?
  The critic should press the inference from ''I can be aware of myself without any
  awareness of body'' to ''I am not a body / can exist without one'', and the defender
  should say what premise bridges the gap, if any — or deny that the argument is meant
  to be a proof in that sense at all.

  - Individuation. Suppose the flying man knows only ''I exist'', with no body, no
  place, no history, no distinguishing feature. On Avicenna''s own account, what makes
  one soul numerically distinct from another is its relation to a particular body.
  If so, what the flying man grasps cannot be *this* soul rather than any other; the
  argument seems to yield a bare subject, not a person — and a defender who concedes
  that owes an account of how the bare subject and the individuated soul are the same
