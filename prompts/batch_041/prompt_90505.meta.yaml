  - The parasitism objection. The flying man scenario is itself assembled from materials
  supplied by embodied experience — limbs, air, senses, the very idea of a body to
  be subtracted. Can an act of imagination that draws on the body establish the possibility
  of a state that excludes it? The defender may reply that this proves too much (every
  thought experiment uses borrowed materials) or that the point of the exercise is
  not the imagined scenario but the order of discovery it dramatizes.


