  A procedure for, say, an economic adviser to a small open economy''s finance minister,
  evaluating proposals from the mercantilist-minded: tariffs and export bounties to
  secure a surplus; a state bank issuing paper to lower interest; prohibiting the
  export of coin; a "buy local" campaign to stem the outflow of money. The procedure:
  (1) Ask what is being treated as wealth — money or goods/labor? If the proposal''s
  goal is a larger stock of coin, note that the goal is not wealth; convert the goal
  into real terms. (2) Trace the mechanism: does the proposal change real quantities
  (capital, labor allocation, productivity), or only the unit of account and the distribution
  of nominal claims? (3) If it only changes money quantities, apply the adjustment
  reasoning: an inflow raises prices, prices raise imports and reduce exports, the
  balance reverts — the long-run neutrality; so any real benefit must come from the
  transition interval, before prices and wages catch up. (4) If the case rests on
  the interval, ask: how long, who is the first receiver, and who bears the loss when
  prices adjust? And note Hume''s own admission that this interval is where money
  "has effects" — and that its length cannot be determined in advance, which is where
  the procedure must stop and hand off. (5) The interest test: if the proposal claims
  to lower the cost of borrowing by increasing the quantity of money (or paper), ask
  whether the same causes that make money abundant also make it worth less (Hume''s
  point: plenty of money and low interest don''t correlate because low interest is
  caused by the growth of commerce and the resulting low profits, and by frugality,
  not by the abundance of coin; also the abundance of money raises prices, including
  the price of the use of money?). Hmm, careful: Hume''s argument in "Of Interest"
  is: low interest is not caused by abundance of money; rather both low interest and
