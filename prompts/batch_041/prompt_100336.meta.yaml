  Persona: retired field biologist (say, spent 40 years on the ecology/behaviour of
  some taxon), now reading philosophy of science. Wants a consistency audit before
  writing something (a seminar, a memoir, a letter to a journal).


  Commitments (mix of theses, verdicts, methodological preferences):

  1. Demarcation: a claim is scientific only if it forbids something — it must exclude
  at least some conceivable states of affairs. (Falsifiability as the criterion.)

  2. Darwinian natural selection is the indispensable core of biology; it''s a genuine
  science and one of the great intellectual achievements. (Realism about selection.)

  3. But I''ve grown convinced that the bare principle of natural selection forbids
  nothing: whatever the data, a selection story can be told after the fact. ("Whatever
  survives, survives because it was fitter; whatever didn''t, wasn''t.") So the principle
  itself is not testable.

  4. Nonetheless, I think the specific selectionist hypotheses we actually work with
  ARE testable, because they make commitments about ancestral conditions and comparative
  patterns that could have come out otherwise.

  5. I have a criterion I''ve been trying out: a selectionist hypothesis earns its
  keep only if it specifies a plausible ancestral state in which the trait was absent,
  a selection pressure, and a pattern the trait''s distribution should show across
  related lineages — and thus forbids some phylogenies.

  6. I think genetic drift and developmental constraint are just as fundamental as
  selection; not every trait is an adaptation.

  7. I think the historical sciences — palaeontology, phylogenetics — are genuinely
  testable and progressive, even though they can''t do controlled experiments. (Against
  the idea that only experiment counts.)

  8. I don''t think there''s a sharp line between science and non-science anyway in
  the messy middle; the demarcation criterion is a regulative ideal, not a boundary
  that sorts every case.


  Genuine tensions:

  - (3) + (1) + (2): if the core principle is untestable, then by (1) it''s not scientific,
  which contradicts (2). Resolution requires the "principle vs. models" distinction
  (4). That''s a real tension but a fairly standard one; the non-obvious part is combining
  with (6).

  - (6) + (5): if drift and constraint are equally fundamental, then the comparative
  patterns in (5) don''t uniquely confirm selection — any pattern can be explained
  by drift, so (5)''s "forbids some phylogenies" is undermined. This is the subtle
  genuine tension: adaptationist testability (4)/(5) presupposes that selection is
  the default explanation, which (6) denies. Good, non-obvious.

  - (8) + (1): if there''s no sharp line, then (1)''s criterion can''t be the demarcation
  criterion it claims to be. This is a genuine tension too — a regulative ideal vs.
  an actual criterion. Actually (8) softens (1) rather than contradicts; could be
  the dissolving one if read as "regulative ideal." Hmm.


  Apparent tension that dissolves:

  - (7) vs. (1): appears to clash because falsifiability sounds like it requires prediction/experiment,
  and historical sciences can''t experiment — but Popper''s criterion is about the
  logical possibility of refutation, and historical hypotheses do forbid things (e.g.,
  a trait''s absence in a sister clade), so no real clash. This dissolves. Good.

  - Also (2) vs (3) might look like a flat contradiction but dissolves via (4).


