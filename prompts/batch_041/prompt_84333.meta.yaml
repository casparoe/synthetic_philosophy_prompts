  Draft prompt:


  I''m a science-and-ideas journalist, and I''ve spent the past several months reporting
  a long feature on guilt, shame and the moral life of societies. The reporting has
  gone fine; the argument I keep having with my sources has not. I''d like you to
  act as an expert on the philosophy and anthropology of the emotions — someone comfortable
  moving between moral philosophy, cultural psychology and the ethnography of honour
  — and to help me diagnose why the debate keeps stalling, rather than to adjudicate
  it.


  Set-up. The question I put to everyone is roughly: which is the better moral emotion,
  guilt or shame, and can a culture deliberately choose between them? ...


  I''ll write the camps:


  Camp one: guilt. It takes acts as its object, so it is answerable to reasons...
  it can be discharged by apology and repair... it doesn''t require an audience...
  shame, by contrast, is either an instrument of social control or a wound to the
  self; it produces concealment, withdrawal, sometimes rage, but not repair.


  Camp two: shame. It takes the whole self as its object and that is a virtue, not
  a defect... it is relational through and through... guilt is the thin bookkeeping
  emotion of a society that has already converted its obligations into transactions...
  The Confucian-inflected traditions some of my sources cite treat shame as a capacity
  to be cultivated, not a pathology.


  Camp three: the comparison is malformed — you cannot rank two things when the terms
  are the folk-psychological labels of one particular historical moment... the guilt-culture/shame-culture
  contrast was a mid-century construction with thin evidence behind it.


  Then: the culture question. Some of my sources insist cultures do choose, and point
  to the machinery (catechism, schooling, honour codes, public apology rituals). Others
  say choosing an emotion is like choosing to find a joke funny: you can arrange the
  conditions under which it appears, but the arranging is not the choosing, and what
  looks like a culture choosing its emotions is usually a culture''s institutions
  choosing which emotions get to be expressed.


  And here''s my hypothesis, which I''d like you to treat as a hypothesis rather than
  a premise: that the parties are not disagreeing about emotions at all, but about
  two different objects that both get the name ''shame'' — the episodic feeling of
  exposure that a person has, and the standing social arrangement that determines
  what gets exposed and to whom. Most of the normative heat, on this reading, is about
  the regime, and most of the empirical work is about the episode.


  What I want from you:


  1. A diagnosis: is this a substantive disagreement, a verbal one about what ''shame''
  and ''guilt'' pick out, a disagreement about the criterion (what ''better'' is supposed
  to mean here — accuracy, motivational efficacy, respect for persons, the stability
  of a social order), a hidden empirical question, or two different questions being
  answered under one heading? Consider at least three candidate diagnoses, say which
  you find strongest and why, and be explicit about what evidence would tell them
  apart. Test my hypothesis rather than assuming it.

  2. A separate diagnosis of the ''can a culture choose?'' half...

  3. Given your diagnosis, what would count as progress — a distinction, a piece of
  evidence, a reframing, an admission that no progress should be expected — and what
  would a good journalist stop asking?


  Before you answer, brainstorm: spend a little space listing the candidate diagnoses
  and what each would predict about the shape of the argument, then commit to a view.


  Please don''t give me a literature survey or a reading list — I have my own sources
  and no way to check yours. Argue from the positions as I''ve described them. Write
  in British English, and be direct about where you''re uncertain.


