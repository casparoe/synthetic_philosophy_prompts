  Draft:


  "I''m a philosopher at a small liberal arts college, and this May I''ve been asked
  to give the commencement address — about twelve hundred words delivered, which for
  the occasion means roughly eight hundred on the page. I want to give the graduates
  something that isn''t the standard ''trust yourself / follow your passion'' speech,
  and I want to use a piece of my own field to do it — but without any jargon and
  without a single citation.


  Here''s the apparatus I want the speech to be built on. We tend to think of a person''s
  traits as inner springs: if you have the trait, it will show, and if it doesn''t
  show, you didn''t really have it. The better picture is that a trait is a tendency
  to behave a certain way under certain conditions — and the conditions can fail.
  A generous person can be blocked from ever being generous (poverty, a job with no
  slack); a patient person can be provoked into the one afternoon that defines her
  in her family''s memory. Worse, the conditions that reveal a tendency can be the
  very conditions that destroy it or manufacture it: put a person in a lab and the
  calm evaporates; praise a child''s kindness and the kindness turns into performance.
  I''ve been calling these ''shy traits'' — traits whose conditions for showing include
