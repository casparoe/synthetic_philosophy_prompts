  Draft prompt:


  I am preparing a defense of a rigorist position on veracity for a symposium, and
  before I commit to it in print I would like an audit of whether my commitments form
  a tenable package. Here is where I stand:


  (i) Veracity is a strict duty and admits of no exceptions; I do not lie, and I would
  not lie to the murderer at the door.

  (ii) Lying, strictly speaking, is a declaration contrary to my own thought made
  to someone who has a right to the truth; withholding something from a person who
  has no such right is not lying, however much it may mislead.

  (iii) The ground of the duty of veracity is not any particular person''s claim upon
  me but what a lie does to humanity in general and to my own dignity: a lie injures
  the standing of speech as such, and I may no more make an exception of myself here
  than anywhere else.

  (iv) The murderer who comes to my door has, by the maxim on which he acts, put himself
  outside the class of those who can demand truth from me; the duty of veracity is
  owed to those who can claim it.

  (v) Genuine conflicts of duty do not occur. When two duties appear to collide, what
  is really happening is that one of the candidate duties was never in force in that
  situation; the appearance of an insoluble dilemma is always a sign that I have described
  the case wrongly.

  (vi) Beneficence toward my endangered friend is not a discretionary extra: I owe
  him protection, and I may not purchase the tidiness of my own record with his life.

  (vii) The reason a lie is wrong in the first place is that it treats the person
  deceived merely as a means to my ends.


  Two clarifications about the case as I intend it, because the standard version makes
  it too easy. First, when the murderer asks whether his intended victim is in my
  house, I take it that veracity does not command disclosure: I may decline to answer,
  and my doing so is not a lie on (ii). Second, I am now considering the variant in
  which he adds that he will take my silence as a yes — so that saying nothing is
  itself the conveying of a falsehood, and the option of simply not answering is closed.


  What I want to know: which of these commitments actually pull against each other,
  which pairs only look as though they do, and, for each real tension, which one would
  have to give and what it would cost me to give it. Please rank the tensions by severity
  rather than treating them all as equally bad, and be explicit about which of them
  are exposed only by the variant case. Finally, tell me which single commitment,
  if abandoned, would repair the most at the least cost, and what verdicts in the
  two versions of the case I would then have to accept.


