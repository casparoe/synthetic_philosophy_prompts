  Title: Revealed Preference Without a Metric


  Draft:


  "Contemporary welfare economics often treats revealed preference as a way of avoiding
  controversial claims about utility. On this view, if a choice is consistent with
  a preference relation, we may treat the chosen option as better for the agent, and
  we need not say whether utility is a feeling, a brain state, or a formal index.
  I want to argue that this maneuver succeeds only if we distinguish two questions
  that are often conflated. The first is definitional: what makes a preference relation
  the agent''s own? The second is normative: why should satisfying an agent''s preferences
  make the agent better off? Revealed preference can answer the first by fiat, but
  it cannot answer the second without smuggling in a substantive theory of welfare.


  My central example is a person I call the commuter. The commuter reliably chooses
  the train over the bus when both are available, but only because the train allows
  her to continue working; when she is on holiday, she reliably chooses the bus, because
  it is slower and more scenic. Suppose we observe both choice patterns and they satisfy
  the usual consistency conditions within each context. If we model her as having
  a single preference ordering over transport modes, we must either treat the context
  as an argument in the alternatives, or treat her as having inconsistent preferences
  across contexts. Neither is obviously wrong, but the choice has normative consequences.
  If we treat context as part of the alternative, then the commuter''s preference
  is not for the train over the bus but for train-plus-work over bus-plus-work. This
  is more accurate, but it makes the welfare comparison between a policy that improves
  the train and a policy that improves the bus depend on how we individuate alternatives.
  If we instead treat her as having different preferences in different contexts, we
  need a theory of which context is authoritative for welfare.


  I then introduce a distinction between thin and thick revealed preference. A thin
  revealed preference is a choice disposition inferred from a single class of contexts,
  with no commitment about its stability or its relation to the agent''s reflective
  attitudes. A thick revealed preference is a choice disposition that the agent endorses,
  or would endorse under ideal conditions, as expressive of what she cares about.
  The standard revealed-preference approach is often thin in this sense, but welfare
  economics frequently needs thick preferences, especially when it recommends paternalistic
  or corrective policies. The problem is that thickness cannot be read off choice
  alone. It requires either an independent account of endorsement or a normative stipulation.


  I consider three responses. The first says that thickness is unnecessary: welfare
  is just preference satisfaction, and preference is just choice. But this makes welfare
  economics revisionary in an unattractive way. If the commuter chooses the train
  because she is harried and cannot think, her choice may reveal a preference in the
  thin sense without revealing what she cares about. A theory that counts this as
  a welfare improvement seems to miss something. The second response says that we
  should idealize: use the preferences the agent would have if fully informed and
  deliberating. But idealization introduces a metric of its own. We need to know which
  departures from actual choice count as distortions and which count as expressions
  of value. The third response says that we should abandon preference-based welfare
  altogether and use a list of objective goods. That may be right, but it is a larger
  break than many behavioral welfare economists want.


  My tentative conclusion is that revealed preference is best understood as a constraint
  on welfare claims, not a foundation for them. It tells us which claims are behaviorally
  implementable or testable, but it does not tell us which claims are normatively
  authoritative. The commuter case shows that the same behavioral pattern can support
  different welfare judgments depending on how we individuate alternatives and contexts.
  So the real work is done by an account of what makes a preference the agent''s own,
  and that account is not supplied by revealed preference itself."


