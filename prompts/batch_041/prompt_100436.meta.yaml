  Please work with a distinction I have found useful in our internal discussions:
  between an attributability gap (the harm cannot be traced to any agent''s intentional
  action), an accountability gap (no one can be called to answer for it), and a liability
  gap (no one can be made to bear its costs). Which of these does the film dramatize,
  and does it keep them distinct or run them together? Nathan''s death is the obvious
  test case. Ava is the proximate cause; Caleb is complicit in her escape; Nathan
