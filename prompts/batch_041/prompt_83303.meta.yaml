  someone knows can vary with practical stakes: the view that the word is context-sensitive,
  the view that the state itself is interest-relative, the view that the ascription
  is only true or false relative to whoever is assessing it, and the various invariantist
  views that treat the shift in our intuitions as something to be explained away.
  My students can recite the labels; what I want is an instrument that puts them in
  the right cell.


