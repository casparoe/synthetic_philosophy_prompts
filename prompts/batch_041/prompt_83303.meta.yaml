  Let me define the axes crisply:


  1. Where the variation is located: in the truth-conditions of the ascription (the
  word is sensitive), in the truth-conditions of the state ascribed (knowledge itself
  is sensitive), in the pragmatics of asserting the ascription (what you may say but
  not what is true), or not in knowledge at all but in the norms governing action,
  assertion, or practical reasoning (so the cases show something about warranted action,
