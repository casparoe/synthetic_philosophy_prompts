  I am building a diagnostic handout for a graduate seminar on knowledge and practical
  stakes, and I want it to sort readers by what they say about cases rather than by
  which label they already wear. The students can recite the standard taxonomy; what
  they cannot do is tell me which of the familiar positions their own answers commit
  them to. Please write the instrument as a decision tree.


  Build it from the logical space rather than from a list of positions: first the
  questions, then the combinations of answers they allow, then the positions located
  in that space. The space is fixed by four axes, and the tree should be recognizably
  a traversal of them, though it need not use every axis: (i) where the variation
  is located — in the truth-conditions of the ascription, in the truth-conditions
  of the state ascribed, in the pragmatics of asserting the ascription but not in
  what is true, or not in knowledge at all but in the norms governing action, assertion,
  or practical reasoning; (ii) whose position does the work — the speaker''s, the
  subject''s, a later assessor''s, or the conversational score; (iii) what it is that
