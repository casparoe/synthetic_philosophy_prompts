  Let me design a nice set of leaf positions for moral worth:


  1. Pure motive view (Kantian): worth depends entirely on the motive of duty.

  2. Motive-sensitive but non-Kantian: any appropriate moral motive counts (sympathy,
  love) — e.g., "acting from the right reasons" broadly.

  3. Reasons view (act-based): worth depends on whether the agent acted for the reasons
  that in fact made the act right ("right reasons" view — the fact that made it right
  was the agent''s reason). This is a real view associated with... hmm, "acting for
  the right reasons" is a term used by Julia Markovits (acting for the right reasons),
  and also Nomy Arpaly, and there''s the "Motive and Rightness" stuff. But we need
  not name them. We can describe positions.

  4. Counterfactual/robustness view: worth depends on whether the agent would have
  acted rightly had the situation differed (the "responsiveness" view).

  5. Modal/character view: worth depends on the action''s expression of good character/virtue.

  6. No-worth view: "moral worth" is a confused notion; all that matters is rightness
  (or the concept should be discarded). — deflationism.

  7. Degree view: worth is scalar, not binary, and depends on how much of the right-making
  reason figured in deliberation.

  8. Structural/dual-aspect: rightness and worth are independent dimensions, so an
  action can be right but worthless and vice versa.

  9. Social/attributability view: worth tracks what''s attributable to the agent as
  a self-governing agent, so worth depends on the quality of will, not on the content
  of the reasons (quality of will vs. quality of reasoning distinction).


  Hmm, that''s a good space. Branch nodes/questions:


  - Q1: Is there a distinct property of "moral worth" over and above rightness (and
  praiseworthiness)? If no → deflationist leaf.

  - Q2: Does worth supervene on the agent''s psychology (narrow), or on the fit between
  the agent''s psychology and the reasons that actually apply (wide/externalist)?

  - Q3: If narrow: must the operative motive be duty/the moral law, or may any morally
  good motive (sympathy, love, care) do? Also: is the relevant psychological element
  a motive/desire, or a belief about reasons, or a deliberative structure?

  - Q4: If externalist: does the agent need to be consciously guided by the right-making
  consideration, or is it enough that their action is caused by a reliable sensitivity
  to it (tacit responsiveness)? This is the "self-consciousness requirement".

  - Q5: Is ignorance of the right-making feature excusing or does it undermine worth?
  (cases of morally lucky action.)

  - Q6: Is worth scalar?

  - Q7: Does worth require the agent to have actually been moved by a moral consideration
  at all (vs. an act that merely happens to be right, e.g., the indifferent shopkeeper)?
  Distinguishes "worth = rightness + good motive" from "worth = nothing".

  - Q8: Does moral worth depend on the agent''s overall character or the particular
  action''s genesis (holism vs. atomism about worth)?


