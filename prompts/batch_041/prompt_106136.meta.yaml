  I think the Condorcet jury theorem is great for an exam question with a marking
  scheme: the crux is the independence assumption (correlated errors) and the heterogeneity
  of competence, plus the distinction between the theorem''s "better than random"
  and "tends to infallibility," and the difference between Condorcet''s jury theorem
  and the "diversity trumps ability" results, and the issue that if competence is
  below 1/2, larger groups get worse — so a large group of individually incompetent
  voters is worse than a small group. Also the "many voters with correlated errors"
  — e.g., all reading the same newspaper. And the subtlety: the theorem is about majority
  of independent votes on a binary question where one option is correct; if the question
  has no truth value (values, not facts), the theorem doesn''t apply. That''s a genuinely
  conceptual crux that a student reciting "Condorcet jury theorem says crowds are
  wise" would miss.


