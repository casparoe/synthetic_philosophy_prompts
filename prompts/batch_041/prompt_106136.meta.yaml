  Safe claims:

  1. Condorcet''s jury theorem: for binary choice with one correct option, voters
  independent, each with probability p > 1/2 of being correct, the probability that
  the majority is correct increases with the number of voters and tends to 1. (Standard,
  safe.)

  2. If p < 1/2, the probability that the majority is correct decreases with group
  size and tends to 0 — the group converges on the wrong answer. (Standard, safe.)

  3. The "increase with n" monotonicity actually holds for all p ≠ 1/2 in the sense
  that the majority''s probability of being correct moves monotonically away from
  1/2 toward 1 (p>1/2) or 0 (p<1/2). Safe.

  4. Independence is doing heavy lifting. With perfectly correlated voters (all identical),
  the group is no better than one voter. Safe.

  5. The theorem presupposes a binary question with an independent fact of the matter;
  for questions of taste/policy preference with no truth value, it doesn''t apply.
  Safe.

