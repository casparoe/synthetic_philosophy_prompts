  I am a second-year PhD student in intellectual history, and I am writing a chapter
  on moral revolutions. I would like your comments on the following plan for a short
  essay. The essay argues that the abolition of slavery and the end of dueling are
  better explained by shifts in honor and status competition among elites than by
  moral argument or economic interest. It distinguishes three mechanisms: first, arguments
  that change first-order moral beliefs; second, interests that make a practice costly
  to maintain; and third, honor codes that make a practice shameful or unmanly for
  the people who practice it. The essay claims that the third mechanism does most
  of the explanatory work in both cases, and that this has uncomfortable implications
  for the view that moral progress is primarily rational. It also suggests that the
  honor mechanism explains why abolition was often led by elites who did not directly
  benefit from it, and why dueling persisted longer in some societies than in others
  despite similar moral arguments against it. I am especially interested in whether
  the essay overstates the case, whether the honor mechanism can be separated from
  interests, and whether the argument conflates explanation with justification. Please
  comment on the accuracy of the historical reasoning, on whether the thesis is interesting,
  and on which specific parts need revision. Answer in American English.


