  Draft:


  "A colleague in my department is an eliminativist about beliefs and likes to use
  the apparatus of real patterns and the three stances against the rest of us; last
  week she turned it on itself and I can''t tell whether she''s exposed a real flaw
  or just equivocated. Here is her argument.


  (1) A pattern is real, in the only sense we have any use for, when describing it
  compresses the data — when it lets you predict and explain better than any available
  alternative, and the fact that it does so is not up to the describer.

  (2) The intentional stance works: attributing beliefs and desires to a system compresses
  its behaviour, and the fact that it does is not up to the interpreter.

  (3) So beliefs and desires are real patterns, which is why we should be realists
  about them rather than eliminativists.

  (4) But exactly the same move is available for the design stance and the physical
  stance: cells, organs, and genes compress; so do atoms and fields.

  (5) And it is available for anything a community can use: the gene''s-eye view,
  the market''s "mood," the equilibrium of a system, and, if the community''s predictions
  are good enough, the intentions of a deity.

  (6) If the criterion is compressibility relative to the descriptions a community
  happens to have, then "real" no longer does any work: the deity and phlogiston were
  real patterns for the people who could predict with them, and the eliminativist
  has no way of saying that beliefs are real while phlogiston was not.

  (7) So real patterns either prove too little (nothing is real because everything
  compresses for someone) or too much (everything that compresses is real). Either
  way, the eliminativist can''t have it both ways.


  Where does this break? Which step should I reject, and what does rejecting it cost
  -- in particular, if I keep (2) and (3), what stops (4)-(6)?"


