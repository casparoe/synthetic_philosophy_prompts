  Dennett''s real patterns: A pattern is real if (i) it is a pattern (compressible
  description) that (ii) is "objectively there" — i.e., any observer with the same
  data and similar computational capacities would find it, and (iii) importantly,
  it''s not just any compressible description; Dennett''s criterion involves the notion
  of the pattern being "the best" compression at some level of description, and he
  stresses the "trade-off" between compressibility and "loss of information." He compares
  the intentional stance''s posits to the "center of mass" and to a "trope" ... Also
  crucially Dennett notes that the real patterns are those that "pay their way" —
  and he explicitly considers whether this makes e.g. "the second law of thermodynamics"
  or "the gene" real, and he says yes, these are real patterns. So Dennett would accept
  (4) and much of (5) — the design stance posits are real patterns too; he''s not
  a "only intentional stance posits are real" person. So (4)-(5) don''t trouble him.
  What about the deity? Dennett''s response: the criterion isn''t mere usability,
  it''s the "best compression"/"objectivity" test — a pattern is real if the description
  is the most efficient encoding available to any agent with a similar capacity, and
  the deity pattern fails because it''s not actually predictive at the required level
  (it "postdicts" and is infinitely adjustable). Also the pattern must be there in
  the data in the sense that the pattern is not merely in the eye of the beholder:
  Dennett says the difference between a real pattern and a "mere" pattern is the difference
  between compressibility that''s an objective fact about the data (there exists a
  compact description) and one that''s an artifact of the observer''s biases. But
  he admits that the "interest relativity" (e.g., what counts as a pattern depends
  on what you want to predict and what your computational limits are) — he thinks
  this is fine because it''s relative to "the class of observers" not to individual
  whim, and importantly it''s a matter of there being an objective fact about which
  descriptions are information-theoretically better.


  So the flaw in the argument: step (1) and step (3)''s reading of "real" equivocate
  between (a) "there''s a fact of the matter whether the description compresses" (objective,
  observer-independent in the relevant sense: a fact about the data) and (b) "exists
  in the way physics says things exist" / "is not dependent on anyone''s stance at
  all". Dennett''s claim is that stance-relative posits are real in sense (a): they
  are not "convenient fictions." The argument''s step (6) slides from (a) to (b):
  "if real is only compressibility-relative, then real does no work" — that doesn''t
  follow; (a) still distinguishes real patterns (beliefs, centers of mass, genes)
  from fictions (phlogiston, a deity) because compressibility is an objective, checkable
  matter: phlogiston doesn''t compress combustion data better than oxygen; and it
  does so "for a while" only relative to the data available and to the aim of prediction;
  Dennett can say the criterion is "best available description given the data" and
  it''s a fact whether it''s best. Also step (5)''s "if the community''s predictions
  are good enough" does the smuggling: for the deity, the predictions are not good
  enough except trivially (unfalsifiable, infinitely adjustable), so it doesn''t satisfy
  the criterion; the argument needs "usable by someone" but the premise says "better
  than any available alternative."


  Also a subtle flaw: step (2)-(3) claims that the intentional stance''s success makes
  beliefs real; but Dennett''s realism about beliefs is precisely the claim that the
  intentional stance''s success is objective. Then step (4) is fine for Dennett, so
  it''s not the problem; the problem is the move from (5) to (6), which trades on
  "community" and "happens to have" — introducing a relativism that premise (1) already
  excluded by "the fact that it does so is not up to the describer."


  Also there''s a second candidate: the modal/scope issue — "compresses relative to
  a description-language" — a quantifier shift from "for every pattern there is an
  agent who could use it" (trivially true, since a lookup table is a description)
  to "for any pattern, some agent''s use of it is the best available compression."
  The first makes everything real (a bit-map of the data is a "description" but no
  compression). The key Dennettian notion is "compression" — it must be shorter than
  the data; a lookup table isn''t a compression. So (5)''s "anything a community can
  use" ignores the compression requirement: the deity-pattern doesn''t compress (it''s
  an infinite parameter set, like the lookup table). So the flaw could be located
  in (5) — "use" vs. "compress." That''s a genuine equivocation between "predictive
  utility" and "information compression." Actually this is a nice, sharp, nameable
  flaw: (5) replaces the compressibility criterion with a usefulness criterion, and
  usefulness is cheap: any finite set of predictions can be fit by an ad hoc hypothesis.
  So (6) only follows for the weakened criterion; and (1) can''t be weakened without
  giving up the "not up to the describer" clause.


  Also, on the other side: the asker may prefer to keep (2)-(3) (realism about beliefs)
  and (1) (compressibility), which forces rejecting (5)''s slide. But the cost: you
  must say what makes compression objective, and you must accept that a lot of things
  are real patterns (genes, centers of mass, equilibria, maybe even "the market''s
  mood") — so the "proves too much" worry returns in a milder form: realism about
  beliefs comes with realism about all manner of stance-relative posits, which some
  find a cost (Dennett''s "gerrymandered" worries; the "everything is real" flattening;
  the loss of the ability to say that some stance-posits are merely useful — e.g.,
  "the selfish gene" as metaphor — while others are real). Also, a cost: the same
  criterion makes "the evolutionary ''purpose'' of X" real, which sits awkwardly with
  Dennett''s own debunking projects (e.g., he wants to say that the "goal" of a species
  isn''t a real goal). Hmm — actually Dennett does accept "free-floating rationales"
  as real patterns (he says they''re "real" in the same sense, "there is a fact of
  the matter about what the organism is designed to do"). Fine.


  Another possible flaw: (3) infers from "the intentional stance works" to "beliefs
  and desires are real patterns"; but Dennett''s realism about beliefs requires more:
  that the intentional stance is not merely a heuristic for us but the "optimal" level
  of description for the system — and that the system''s internal states actually
