  the requirements, not the theory.


  The cases I need it to handle, at least:

  - a checkerboard drawn in a bitmap, where the checkerboard is obviously "there"
  in some sense

  - a glider in the Game of Life, which is made of cells and also isn''t

  - temperature and pressure in a gas, which nobody doubts, versus the same statistics
  in a random string

  - a barometer that "predicts" rain, versus a storm that causes it

  - a model that finds a pattern in data that vanishes on the next sample (overfitting),
  versus one that holds up

  - something like a gene or a species, where biologists fight about whether it''s
