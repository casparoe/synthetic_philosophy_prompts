  Dennett''s four levels:

  - Darwinian: fixed, hard-wired responses shaped by natural selection. No learning.
  Example: the digger wasp, or a bacterium.

  - Skinnerian: can learn; trial-and-error reinforcement; operant conditioning; behavior
  shaped by reward/punishment in the individual''s lifetime. Example: rat in a Skinner
  box; also "the Skinnerian creature must have some way of registering success/failure."

  - Popperian: "lets its hypotheses die in its stead" — can represent possible futures
  and evaluate them internally before acting; has an inner environment in which to
  model the outer environment. Example: a bird or mammal that can learn by observation
  or "insight"; also Dennett''s example of the "practical reasoners".

  - Gregorian: named after Richard Gregory; creatures whose minds are furnished and
  shaped by culturally transmitted "mind tools" — words, numbers, practices, maps,
  etc. Humans are the prime example. Dennett: "Gregorian creatures" are those whose
  thinking is augmented by the "inwardly installed" products of culture, especially
  language. He says the Gregorian level is not just a fourth rung; language and other
  mind tools "redesign" the mind, creating a virtual machine.


