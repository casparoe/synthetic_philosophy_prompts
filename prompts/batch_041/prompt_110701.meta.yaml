  I like this: the disambiguation menu:

  1. Logical/trivial: no entailment from "is intelligent" to "has goal G" — i.e.,
  the predicates are independent as a matter of logic (true but trivial).

  2. Modal/design-space: for (almost) any level of intelligence and (almost) any final
  goal, an agent with that combination is physically realizable (this is the substantive
  one; Bostrom''s "orthogonality thesis" is roughly this, restricted to "at least
  some agents with any level of intelligence can have any final goal").

  3. Predictive/empirical: actually-built intelligences will vary widely in goals;
  intelligence doesn''t constrain goals in practice.

  4. Training-dynamics reading: the values a system ends up with are set by the training
  process, not by the level of capability — so capability improvements don''t automatically
  fix values.

  5. Normative/conceptual reading: "intelligence" is best defined as means-end efficiency
  (instrumental), so it literally can''t contain terminal goals — a claim about how
  to analyze the concept, which makes orthogonality true by definition of the analysis
  (and hence unfalsifiable).

  6. The "human analogy" reading: smarter humans aren''t nicer — that''s an empirical
  claim about humans, and it''s actually contested (correlation between cognitive
  ability and some moral measures?).


  And verdicts: which readings are trivial, which substantive, which false or unfalsifiable.
  And which reading is needed for the "paperclip maximizer" argument, and which for
  the "just give it good goals" argument.


