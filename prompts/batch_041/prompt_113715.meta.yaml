  in. The people in the cascade aren''t stupid or lazy, they''re doing the right update
  on the wrong data. The real driver is that the first couple of moves were arbitrary
  — random early draws, not the merits — so two identical societies can end up at
  opposite conclusions. And the flip side, which is the part I actually care about:
  cascades are fragile. Since the whole thing rests on nobody having a strong enough
  private signal to outweigh the herd, a credible public announcement, or one or two
