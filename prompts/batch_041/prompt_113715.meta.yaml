  belief — a bad medical practice, a terrible investing fad, a whole field going down
  a dead end, a country deciding some policy is obviously right — the right explanation
  is almost always an informational cascade, not bias. Mechanism: everyone acts in
  sequence, each person sees what the people before them did but not why, and each
