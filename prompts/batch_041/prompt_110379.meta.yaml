  Key dependency structure for the exclusion argument (Jaegwon Kim):

  1. Mental properties supervene on physical properties (non-reductive physicalism).

  2. Causal closure (completeness) of the physical domain: every physical event that
  has a cause has a sufficient physical cause.

  3. Irreducibility of the mental (distinct from physical).

  4. Causal exclusion: no event has more than one sufficient cause (or: if an event
  has a sufficient physical cause, it is not also caused by a distinct mental cause,
  on pain of systematic overdetermination).

  → Conclusion: mental causes are excluded / epiphenomenalism.


  Teaching order: need supervenience first, then closure, then exclusion principle,
  then the problem of mental causation (the pairing problem / overdetermination).


  Carrying example: The classic is the "neuron firing" example or the pigeon. Or Sophie''s
  example. A good carrying example: a specific scenario, e.g., a person''s pain causing
  them to withdraw their hand. The mental cause (pain) and the physical cause (C-fiber
  firing / some neural event). The example must have: a mental event and a physical
