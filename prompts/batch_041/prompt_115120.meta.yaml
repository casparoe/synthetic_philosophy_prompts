  Setting: 90-minute session, upper-level undergrad/graduate seminar on the Anthropocene
  (or a "science and its institutions" course), 18-24 participants. Goal: they should
  feel that fixing the start of the Anthropocene is a decision made through a procedure,
  that the evidence underdetermines it, and that the authority ladder (working group
  → subcommission → commission → union) determines what counts as real, including
  the option of no unit at all.


  Mechanic to inject (the "new/niche idea"): the same evidence packet, but the room
  splits into three committees that differ only in their *ratification rules* (and
  each committee must also include a member who holds the "the whole category is not
  stratigraphic" line, and a rule that any member can enter a formal objection that
  must be answered). Same evidence, same roles, different procedure → different answer.
  Then the room compares and must decide which body has authority to break the tie
  — and discover that the procedure that produced their own answer was arbitrary relative
  to the evidence. The null option must be live.


  Plus a "golden spike" physical token: the committee must physically plant a marker
  in a designated spot in the room only if they agree; the rule is that the marker
  must be placed in a single physical section (a mock core / a labeled column on the
  wall) and must be correlatable — the facilitator supplies a second "core" from another
  continent that doesn''t show the same horizon, so a marker that isn''t globally
  correlatable fails. Nice touch: forces the "isochronous and globally correlatable"
  constraint, which is the real stratigraphic requirement, and creates tension with
  the Anthropocene-as-social-concept.


  Also add: a rule that the boundary must be defined by a signal that is *not* itself
  meaningful to humans (a proxy), so "the invention of the steam engine" or "the plastic
  layer" create problems — the marker must be a measurable physical/chemical signal
  rather than a human artifact with meaning. That''s the in-the-weeds bit and it makes
  the Anthropocene''s conceptual character bite: the marker for a human epoch must
  be depersonalized into a proxy.


  Roles: stratigrapher, geochemist, historian, ecologist/Earth-system scientist, an
  ICS officer who enforces the rules, an "objector" (can invoke the null option),
  and an outside stakeholder (indigenous delegate or a public-interest observer) who
  has no vote. Actually maybe keep roles light: the design should be about procedure.
  The asker should say: you can assign roles, but the key variable I want manipulated
  is the ratification rule.


  Debrief: map moments: (1) the moment a group realizes the marker they wanted fails
  the correlatability test; (2) the moment a group with unanimity can''t converge;
  (3) the moment the null option wins; (4) the comparison across committees; map onto:
  GSSP conventions, the real 15-year process ending in rejection, the difference between
  an epoch as a stratigraphic unit and the Anthropocene as a descriptor (the IUGS
  statement''s point that it will continue to be used anyway — I''ll paraphrase, not
  quote).


  Predictable failures: the facilitator forgets to make the null option salient →
  groups manufacture a date; the correlatability test feels like a gotcha; the "stakeholder"
  role gets sidelined; groups converge fast on 1950 because it''s the memorized answer
  → I should tell the facilitator to *not* reveal the real proposal before the activity
  and to include the rule that any member may demand a rationale; also groups may
  treat the vote as a popularity contest. Also: the physically planting of the spike
