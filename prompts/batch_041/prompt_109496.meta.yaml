  Prompt draft:


  "I''m in a metaphysics reading group and we''ve been doing grounding and fundamentality.
  Last week someone defended the claim that grounding has to be well-founded — that
  every chain of grounding has to terminate in something fundamental — by saying the
  world is like a building: a building needs a foundation, you can''t have a tower
  that just floats, and if the supports go on forever the whole thing never actually
  gets held up. Everyone nodded, and the discussion moved on, but it''s been nagging
  at me. I think the analogy is doing a lot more work than anyone noticed. Can you
  lay out what''s supposed to map onto what — the building, the foundation, the load,
  the supports, the ground beneath the foundation — and then tell me where the mapping
  breaks? In particular I want to know whether the analogy actually supports well-foundedness
  or whether it just assumes it: a building''s foundation is itself held up by the
  earth, and nobody thinks the earth is ''more fundamental'' in the grounding sense,
  so is the analogy quietly importing a bottom that the grounding relation doesn''t
  have to have? And does the conclusion that there must be a fundamental level survive
  once we see the disanalogies, or was the analogy carrying it the whole time? If
  it doesn''t hold, what would be a better picture — I''ve heard people say an infinite
  descent of grounding is more like a mirror facing a mirror, or like the old turtles-all-the-way-down
  image, but I can''t tell if those are any better. Keep it concrete, no need for
  a bibliography, I''ll chase down the references myself."


