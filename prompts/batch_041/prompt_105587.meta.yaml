  question: what theory of autonomy, of the value of life, and of the state''s role
  does this architecture presuppose? Which rival theories does it rule out? Is it
  internally consistent? Is it underdetermined — would a current-endorsement view,
  a whole-life/narrative view, a purely harm-prevention view each license the same
