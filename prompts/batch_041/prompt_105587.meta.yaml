  Structure:

  Para 1: Personal situation — father diagnosed with early-onset Alzheimer''s a few
  months ago; the asker is the one with power of attorney / healthcare proxy; helped
  him draft an advance directive. Vivid concrete detail: he wrote it while competent,
  said clearly he would not want to live through the late stages. Now the asker is
