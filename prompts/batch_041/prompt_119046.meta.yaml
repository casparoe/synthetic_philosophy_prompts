  Design idea: Ask for a case in which the principle of indifference, applied to the
  *same* physical randomising procedure, yields two different answers depending on
  which "equally likely" partition is chosen, but where — unlike the classic chord
  case — the procedure itself is fully specified physically (so the ambiguity is not
  "the randomising procedure is unspecified"), and yet the answers differ because
  the physical procedure''s output admits two natural descriptions that are related
  by a non-linear but physically natural transformation. Then: which answer is correct?
  Provide an independent argument (invariance under a symmetry group of the setup,
  or a limiting/frequency argument, or a "coarse-graining consistency" argument) that
  breaks the tie, and state whether it succeeds. Then a second, harder requirement:
  construct a case where *no* such tie-breaker exists — i.e., a physically fully specified
  procedure where two indifference-respecting descriptions remain, and where the divergence
  cannot be dismissed as ill-posedness — and say what that shows about the status
  of the principle (whether it''s a substantive principle at all, or a placeholder
  for a physical stipulation). Plus: what does the defender say (that "at random"
  is incomplete, that a randomising procedure must be specified; that indifference
  is only licensed where a symmetry group acts transitively with a unique invariant
  measure; that non-amenable groups break uniqueness).


