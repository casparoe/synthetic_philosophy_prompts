  underlying thing: the separability of the hurt from the minding. I have been told
  that something of this kind occurs in patients with certain kinds of brain injury,
  but that is a syndrome, and what I keep running into seems to be a general structure
  — the intensity of a pain, its unpleasantness, and the person''s wanting it to stop
  seem to be three things that can come apart, and our words treat them as one.


