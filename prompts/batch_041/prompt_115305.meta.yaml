  the two dissociations? If the literature names only the neurological version, what
  is the nearest concept for the general phenomenon, and where exactly does the analogy
  break down? And if nothing fits, please coin a term with a definition, say what
  it excludes, and take a position on what it implies: if the unpleasantness can go
