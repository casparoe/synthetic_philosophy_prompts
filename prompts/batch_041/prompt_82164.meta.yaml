  responsible for the way you are, at least insofar as that way of being figures in
  the action''s causal history.

  (3) Principle of responsibility transfer: if you are not ultimately responsible
  for some condition C, and C is a cause of your action A, then you are not ultimately
  responsible for A.

  (4) You are not ultimately responsible for the way you are: your constitution results
  from heredity and early environment, which you did not choose.

  (5) The regress reply is unavailable: any story on which you are responsible for
  your character by having shaped it must at some point invoke an exercise of agency
  by a self that already had the very traits in question, and that prior exercise
  would need the same vindication, without end.

  (6) Therefore no one is ever ultimately responsible for anything they do.

  (7) But ultimate responsibility is what ordinary blame, praise, gratitude, and resentment
  presuppose; so no one is ever a fitting target of these responses.

  (8) The same reasoning applies to the epistemic case: since you did not choose your
  evidence-gathering habits or your initial credences, you are never responsible for
