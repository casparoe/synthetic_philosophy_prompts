  Construct a thought experiment to specifications. The purpose is to determine whether
  epistemic contextualism and pragmatic encroachment are genuinely separable positions,
  or whether each can absorb the other''s paradigm cases.


  Background you may take as given: epistemic contextualism holds that the truth value
  of a knowledge ascription varies with features of the ascriber''s conversational
  context — paradigmatically, with which error possibilities are salient or which
  standard of evidence is in play. Pragmatic encroachment holds that whether a subject
  knows varies with the subject''s own practical situation — the stakes of acting
  on the belief. These are usually illustrated with different vignettes; I want a
  case engineered so that the two positions must disagree about the same ascription.


  Design the case to meet all of the following specifications.


  1. Realistic setting. A workplace, a household, a clinic, or the like. No lottery
  cases, no fake barns, no brains in vats, no evil demons, and not the familiar bank-queue
  cases.


  2. One subject, one proposition, one body of evidence. The subject''s evidence must
  be adequate by any ordinary standard — the case must not turn on the subject''s
  being careless, hasty, or epistemically irresponsible. Nothing in the case should
  be a coin flip.


  3. Two versions that differ in exactly one respect. In the first version, hold the
  ascriber''s context fixed and vary only the subject''s practical stakes. In the
  second version, hold the subject''s stakes fixed and vary only the ascriber''s context
  (by changing which error possibilities have been raised in conversation, not by
  changing anyone''s interests).


  4. The verdicts must be generated, not stipulated. You may not simply assert that
  the contextualist says one thing and the encroacher another; each verdict has to
  fall out of the stated commitments of the position.


  5. The subject''s stakes must be concrete costs — money, time, injury, an irreversible
  commitment — not merely the word ''important.''


  After the scenario, provide the following.


  - A verdict table: for each version, state the ascriber''s context (salient alternatives,
  standard of evidence), the subject''s stakes, and the verdict of standard contextualism
  and of pragmatic encroachment on whether the subject knows.

  - The isolating feature. Say which single feature of the case makes the two positions
  come apart, and why the case would collapse into agreement if that feature were
  removed. Construct the collapsed version explicitly and show that both positions
  now say the same thing.

  - The rebuttal. Say how a contextualist would try to redescribe the second version
  as really a change in the ascriber''s context, and how an encroacher would try to
  redescribe the first version as really a change in the subject''s stakes. Assess
  whether either redescription succeeds, and if one does, revise the case until it
  does not.

  - A boundary note. Say what a relevant-alternatives contextualist and a subject-sensitive
  invariantist would each say about your case, and whether either can be distinguished
  from the two positions above by your design.


  Keep the scenario itself to no more than a paragraph per version; the analysis may
  be longer.


