  Two people in my reading group got into a fight last week over epiphenomenalism
  — the view that experiences are caused by brain processes but don''t themselves
  cause anything, so your arm goes up because of neurons, never because you wanted
  it to. I was just sitting there, I didn''t say anything, and now they want a ruling.
  Can you go through their exchange move by move, say which moves are good and which
  are bad, and then say who''s more right overall and what both of them missed? Please
  don''t just split the difference.


  Sam went first. He said the view is self-undermining. If experiences cause nothing,
  then his belief that he''s in pain right now, and his saying so out loud, are produced
  entirely by brain states. The pain itself contributes nothing to the report. But
  then the report would come out exactly the same if there were no pain at all — same
  brain state, same words. So the only evidence any of us could ever have that experiences
  exist is evidence that is, by the theory''s own lights, not evidence about experiences.
  The theory cuts off the branch it''s sitting on.


  Ravi said that''s way too fast. The report isn''t supposed to be caused by the experience,
  it''s supposed to be a reliable indicator of it — the way a printout of a weather
  model isn''t caused by the storm but is still good evidence about the storm, because
  both trace back to the same conditions. Same with the brain state: it causes the
  pain and it causes the report, so the report tracks the pain perfectly well. Reliability
  doesn''t require causation. Nothing self-undermining there.


  Sam then tried a case. Imagine a drug that leaves the pain-processing in the brain
  completely intact — same neurons firing, same words coming out, patient says ''ow,
  that stings'' — but the felt sting is just gone. Nothing it''s like. Ravi''s story
  says the report is doing its job: it''s reliably tracking the brain state. And yet
  it''s flatly wrong about the experience. So the report was never tracking the experience
  in the first place, only the brain state, and the reliability story is dead. Ravi
  said no, that''s just a case where the report is false, and my view predicts exactly
  that; all it shows is that reports can come apart from experiences, which I never
  denied. In the normal case the correlation holds and the inference goes through.


  Sam came back: then when you introspect and think ''I''m having an experience right
  now'', you can''t rule out that you''re in the drug case, because by your own account
  that thought is produced by the brain state alone. So you''re never in a position
  to know you have experiences. Ravi said that''s just the general skeptical problem
  — you can''t rule out the brain in a vat either, and nobody thinks that refutes
  perception. Sam said it''s not the same, because in the ordinary case you''re allowed
  to say the experience itself is part of why you believe in it, and epiphenomenalism
  is the one view that takes that away.


  They''ve been at this for a week. Adjudicate: rate each move from clearly mistaken
  to clearly right, and tell me who''s got the better of it overall.


