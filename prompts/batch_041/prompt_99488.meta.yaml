  I have arrived at a position about moral responsibility that I would like to stress-test,
  and I would rather have the genuinely awkward objections than the flattering ones.


  The position is this. The Principle of Alternative Possibilities is false, but the
  standard Frankfurt-style counterexamples understate what they show. They are usually
  read as establishing only that an agent can be responsible for an action even though
  she could not have done otherwise. I want to defend the stronger and, I think, more
  interesting claim: that facts about what an absent counterfactual intervener would
  have done are irrelevant to responsibility in principle, and not merely in the particular
  cases. On my view, everything that bears on whether an agent is responsible is fixed
  by the actual sequence that produced the action — that the deliberation was genuinely
  hers, that it was responsive to reasons in the right way, and that the action issued
  from her evaluative commitments rather than from compulsion, manipulation, or malfunction.
  What the intervener would have done had she wavered is a shadow cast by that actual
  sequence; you can thicken, thin, or delete the shadow without altering a single
  responsibility-relevant fact. The residual "alternatives" that some defenders of
  the Principle hunt for inside the Frankfurt cases — the tiny counterfactually open
  choices that supposedly preserve a flicker of freedom — are, on this view, not what
  responsibility was ever tracking.


  What would count against this? I want the defeaters sorted by how decisive they
  are, from the ones that should actually move me to the ones that are merely awkward.
  I am particularly interested in three things.


  First, whether any of the Frankfurt cases can be reconstructed so that the actual
  sequence is impeccable by my own lights — genuinely the agent''s own, reasons-responsive,
  unmanipulated — and yet the agent is plainly not responsible. If there is such a
  case, my view is in trouble, because I have made the actual sequence both necessary
  and sufficient.


  Second, whether my dismissal of the flicker is too quick. If a case can be built
