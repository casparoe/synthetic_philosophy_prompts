  Concrete instances:

  1. A passerby who watches a child drown in a shallow pond and does nothing. We say:
  she let the child die. But if she had to *actively* keep herself from intervening
  — say she had to hold back a colleague who was about to jump in — we''d say she
  killed the child. The physical contribution differs (restraining someone), but consider:
  the swimmer who could have saved the child with no cost and didn''t — that''s "letting
  die," but many think it''s nearly as bad.

