  die"; a doctor who turns off the machine = "killing." Same outcome, same intention,
  the difference is whether the machine was already on.

  3. Someone who *does* something trivial that has the effect of preventing rescue
  — e.g., parks their car blocking the ambulance — is "killing," though their conduct
  is minor and their omission is large.


