  I think quus/grue is the most "in the weeds" and most interesting, and it''s a genuine
  philosophical analogy-audit. But let me double check the details so I don''t misstate:
  Goodman''s grue: "grue" applies to things examined before time t that are green,
  and to things not so examined that are blue. The new riddle of induction: all emeralds
  examined before t are green, hence "all emeralds are grue" is equally supported,
  but we project "green". Resolution: entrenchment of predicates. Kripke''s quus:
  "x quus y = x+y if x,y < 57, else 5". The skeptic: your past behavior is compatible
  with your having meant quus, and there''s no fact of the matter about which you
  meant; the skeptical solution: assertibility conditions fixed by community agreement,
  not truth conditions.


  Analogies and disanalogies: grue is a problem about *projection/induction* — which
  predicate to project to new cases; the "skeptic" is an internal question about which
  hypothesis is confirmed. Quus is about *meaning* — what fact constitutes your having
  meant plus; it''s about the content of a rule/past intention, not about what to
  expect next. Grue: both "green" and "grue" are candidate meanings; the problem is
  choosing among them, and there''s a fact of the matter (entrenchment is a fact about
  our practice). Quus: the radical claim is there is *no fact of the matter at all*
  about what you meant — a semantic/normative claim, and it applies even to a single
  predicate considered alone (you can generate a quus-like deviant for *any* predicate/rule:
  for any rule there''s a deviant rule agreeing on all past applications). That''s
  the key disanalogy: grue is predicate-relative and needs a time index; quus-style
  deviance is fully general and generated for any rule, so it''s not "which of two
  rival hypotheses is confirmed" but "no candidate is determinately the one you meant."


