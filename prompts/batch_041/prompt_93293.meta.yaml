  Final text:


  "I chair the standards committee of an international consortium of public research
  laboratories. In three weeks the consortium''s governing board votes on whether
  to adopt a binding safeguards floor for frontier models used in critical infrastructure,
  and it has asked my committee for a written opinion recommending an instrument.
  I need the memo drafted for circulation before the meeting.


  The board is treating this as a commitment race, and I think that framing is right.
  Each major bloc now has reason to lock in its preferred floor before a rival does,
  because the first standard to become entrenched tends to become the de facto global
  baseline: reversing an entrenched technical standard is costly, and coordinating
  the world onto a second one afterward is harder still. The race is not merely about
  who is stricter. It is about who moves first, and the fear is that moving first
  locks in a floor that none of the parties would have chosen with more deliberation.


  Two instruments are on the table. The first is an unconditional floor: our consortium
  adopts its (relatively strict) safeguards standard now, unilaterally and for a fixed
  term of five years, with no dependence on what anyone else does. The second is a
  conditional instrument: our floor binds only if at least two other major jurisdictions
  adopt an equivalent floor within eighteen months, and if they do not, it lapses.
  A majority of the committee favours the second, on the ground that it avoids handing
  the rival bloc the benefit of our restraint without securing any reciprocal restraint.
  A minority holds that a commitment that can lapse on someone else''s inaction is
  not a commitment at all -- it is a policy with an exit, and rivals will price it
