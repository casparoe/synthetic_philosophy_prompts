  but we don''t call it akrasia because it''s not up to her. Requirement: the theory
  must locate the difference between akrasia and compulsion, and must not collapse
  into "any failure to act on judgement." This creates tension with the mechanistic
  discounting account, which might make all present bias look like compulsion (a sub-personal
