  Draft:


  I am convening a graduate seminar on weakness of will, and before we begin assessing
  particular accounts I want the specification on the table: what any adequate theory
  of akrasia has to deliver. Write me that list of desiderata, and let the requirements,
  with the cases behind them, carry the weight; I shall do the scoring of candidates
  myself unless you have something brief to add at the end.


  Set the domain to span both the traditional problem and the empirical literature
  on intertemporal choice, since our authors disagree about whether these are the
  same phenomenon. For each requirement, give the case or consideration that motivates
  it, and mark it as non-negotiable or as the preference of a particular camp.


  The list should at least cover:


  1. The core phenomenon. An agent who judges, at the moment of action and all things
  considered, that she ought to do A, does not do A, and does not retract the judgement;
  she typically regrets the omission and regards it as hers. Any theory that cannot
  accommodate the regret, and the sense that the act was nonetheless her own, has
  missed the target.


  2. Synchronic against diachronic weakness. Consider an agent whose preference between
  two dated rewards reverses as the earlier draws near: at nine she prefers a small
  reward at noon to a larger one at two; at half past eleven she prefers the larger.
  Suppose she is aware of the reversal and deplores it. Is this one episode of weakness
  of will, two, or none? The theory must decide and justify the decision.


  3. Inverse cases. Consider an agent who has absorbed, and sincerely endorses, a
  moral outlook we regard as mistaken, and who on a particular occasion acts against
  her own best judgement and does what we think is right. We admire the act and not
  the judgement. The theory must therefore not identify weakness with failure simpliciter,
  and must say what, if anything, is weak here.


  4. The continent impostor. Consider an agent whose acts never conflict with her
  judgements, but only because her judgements are quietly revised to match whatever
  she was going to do anyway. Intuitively this is not continence. The theory must
  not be satisfied by mere act-judgement agreement.


  5. The boundary with compulsion and incapacity. An agent who fails to act on her
  judgement because she is in the grip of a tic, a paralysis, or a compulsion is not
  thereby weak-willed. The theory must locate the boundary and say what does the work
  (control, reason-responsiveness, or something else), and it must survive the possibility
  that the same sub-personal machinery figures on both sides of the line.


  6. Precommitment. An agent who arranges in advance to be prevented from doing what
  she will later be tempted to do, and who is then prevented, has not exercised self-control
  at the moment. The theory must say whether she is continent, weak, or something
  else, and how self-binding is supposed to work at all.


  7. Empirical adequacy. The theory must be consistent with the robust findings that
  people discount future rewards at a rate that declines with delay, so that their
  preferences over a fixed pair of options can reverse with the passage of time, and
  that they will pay real costs to restrict their own future options. It must also
  say whether these findings describe a failure at all, since a time-inconsistent
  preference structure is not obviously an irrationality.


  8. Distinctions it must not collapse: weakness of will against a change of mind;
  against self-deception; against weakness of desire; not trying against trying and
  failing; and the first-personal deliberative stance, in which the agent takes herself
  to have been able to do otherwise, against the predictive stance, in which her failure
  is the output of a discounting process.


  Then:


  - Flag any pair or subset of these requirements that you believe cannot be jointly
  satisfied, and say which has to give. This is the part I most want.

  - State which single requirement does the most to exclude otherwise popular accounts.

  - If the purpose matters: I need the theory to serve two masters, explaining and
  predicting ordinary self-defeating behaviour in human agents, and telling us when
  blame is apt. If those purposes generate different requirements, keep them separate
  in the list rather than fudging.

  - No reading list, no citations, no attributions; if you invoke a position, name
  it in a clause and move on.


