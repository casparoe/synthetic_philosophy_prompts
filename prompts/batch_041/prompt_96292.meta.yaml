  would say she is, if she regrets at 2 p.m. This generates the requirement to distinguish
  synchronic from diachronic akrasia and to say which is the primary phenomenon.


  2. The "inverse akrasia" case (described freshly): a person raised to hold a false
  moral view acts against her own best judgement, and we think the act is better than
  the judgement. Requirement: the theory must allow that acting against one''s best
  judgement can be admirable, so it can''t define akrasia as failure simpliciter.
  This is Arpaly''s inverse akrasia; describing it freshly avoids needing the model
  to know the term.


