  adjudicate. The session started from the color phi illusion: a blue dot is flashed
  at one position, then a red dot at another, and at certain combinations of spacing
  and timing viewers report a single dot moving smoothly between the two locations,
  with the color changing abruptly midway along the path. The puzzling part is that
  viewers report the change as occurring before the second dot has even been presented,
  even though the color of the second dot is settled only when that dot arrives. So
  the content of the experience seems to be about an event that has not yet happened
  at the moment the experience places it.


  Mira took the phenomenon to show that the question ''when did the color change enter
  your experience?'' has no determinate answer, and that the two natural stories you
  could tell about it are empirically indistinguishable. The first — call it the Orwellian
  story, after the rewriting of history — says the subject really does undergo an
  experience with the unrevised content (the dot still blue as it arrives, say), and
  a later process overwrites the memory, so the report misdescribes what was experienced.
  The second — the Stalinesque story, after the staged show trial — says nothing is
  overwritten: the brain withholds the content from consciousness until the second
  flash has been processed and then presents a single, already-consistent experience
  in which the color changes in mid-flight. Mira''s argument was that no possible
  experiment could tell these apart, since they predict the same reports and, she
  claims, the same priming, the same reaction times, and the same measurable neural
  activity; and that the whole dispute presupposes a single moment at which each content
  ''becomes conscious,'' a finish line the brain does not have. Daniel replied that
  the stories are not two descriptions of one thing but two different causal claims
  about the order of events in the head: on the Orwellian story there exists an internal
  state carrying the unrevised content which is then overwritten, and anything that
  exists and is then overwritten has causal powers — it could in principle be primed,
  probed, or leave a trace; on the Stalinesque story no such state ever exists. Different
  causal structures, he said, can be separated by intervention even when the reports
  are identical, and if you specify the revision process in detail the Orwellian model
  predicts specific interference effects that the buffer model does not. He added
  that Mira''s ''no finish line'' argument proves too much, since it would equally
  show that there is no fact about whether a masked word was seen or whether a blindsight
  patient saw anything.


