  I''m a third-year PhD student in economics, working on welfare measurement, and
  I keep getting dragged into the same unresolved argument in my department''s reading
  group. It concerns what "utility" is actually a name for, and the two sides have
  been circling each other for months without either giving ground. On one side are
  the people who take the ordinalist settlement seriously: utility is a representation
  of choice and nothing more — a numerical index assigned so that observed choices
  come out as maximization, carrying no commitment to any inner state or felt quality.
  On this view preference just is the pattern of choice, welfare comparisons are licensed
  only up to what the choice data can bear, and asking what someone "really" wants
  or feels over and above what they do is either a confusion or a different subject
  matter entirely. On the other side are the people who think this emptied-out object
  cannot do the work we ask of it: they point out that when choices are reference-dependent,
  menu-dependent, or unstable across elicitation procedures, the revealed-preference
  object either fails to exist or becomes circular, and they want to reintroduce something
  like experienced well-being — a substantive, in-principle measurable quantity of
  how a life is going — as the thing welfare economics is ultimately about, with choice
  demoted to evidence for it rather than a definition of it. Both sides are careful,
  both know the other''s literature, and yet the exchange never gets past the same
  exchange of intuitions.


  My own suspicion, which I''d like you to test rather than flatter, is that this
  is a hybrid case: part of it is a verbal dispute, since the two sides have quietly
  fixed on different referents for the single word "utility" and are then surprised
  to disagree about its properties; part of it is a genuine disagreement about whether
  there is a fact of the matter about how well a life is going that is independent
  of what the person chooses; and part of it is a methodological disagreement about
  what may legitimately be measured and aggregated, in which operationalist and realist
  instincts are doing most of the work. What I want from you is a diagnosis rather
  than a verdict: tell me what kind of disagreement this actually is, using what each
  side says about the specific cases that divide them — the coherence requirements
  on preferences, the status of choice data when it is inconsistent, and the legitimacy
  of interpersonal welfare comparisons — and separate the strands that are merely
  terminological from the ones that are not. Then tell me what, if anything, would
  count as progress here: a distinction, a formal result about what choice data can
  identify, a change of question, or an argument that the impasse is exactly what
  one should expect and no resolution is owed. I''d rather have a diagnosis I can
  disagree with than a survey.


