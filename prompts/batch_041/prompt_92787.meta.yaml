  You are a philosopher whose research concerns the ethics of saving lives, the aggregation
  of claims, and the structure of reasons for action. I want you to adjudicate an
  argument I witnessed, but not until you have done some careful groundwork: first,
  think through what is at stake in the disagreement and map the space of positions
  that could be taken; only then turn to the exchange itself. Argue the issues on
  their merits — you do not need to cite any literature, and I would rather you not
  gesture at famous papers or labels as a substitute for reasoning. Do not treat the
  exchange as a famous puzzle you have seen before; the particulars matter.


  The setting: a mountain rescue, two ridges, one helicopter with time for a single
  lift before the weather closes, one stranded hiker on one ridge and five on the
  other. Six people, each of whom will certainly die if not lifted. Two friends of
  mine, Anna and Ben, argued about what the pilot should do. Neither is a philosopher
  by trade, but both are smart and neither gave ground. Here is how it went.


  1. Anna: "Save the five. Five deaths is worse than one; if you choose the one, four
  extra people die for no reason."

  2. Ben: "Worse for whom? Nobody loses five lives here. Each of the six loses exactly
  the same thing — the rest of their life — and you have quietly assumed there is
  some single scale on which one person''s death is a fifth as bad as five people''s
  deaths. There is no such scale. If you save the five, you are telling the one that
  his life counts for a fifth of theirs."

  3. Anna: "I never said anything about a scale. I said: if I lift the five, four
  more people are alive tomorrow than if I lift the one. That is a fact anyone can
  check, and it is a reason. And you have the worse problem: you say each life matters
  equally; then five equal things outweigh one equal thing, unless ''equal'' means
  nothing."

  4. Ben: "No — the worse problem is yours. You want to add lives up. Adding is a
  move you are entitled to make only if the thing being added is the kind of thing
  that can be added to, and lives as lived are not. Since we cannot add, we should
  stop pretending the choice is between six units and one unit, and instead do the
  only thing that treats all six as equals: give each the same chance. Flip a coin.
  If the coin picks the lone hiker, he is saved; if it picks the ridge of five, then
  we still have to pick one of them, and that too must be by a fair procedure."

  5. Anna: "Your coin flip is worse by your own standard. Before anyone knows which
  of the six he is — before the call comes in, so to speak — each of the six has a
  five-in-six chance of surviving if we save the five, and only a one-in-two chance
  under your lottery. You say you take each person equally seriously; your rule gives
  each person less of the very thing he cares about, and it gives it to him no matter
  which of the six he turns out to be. So equality cannot be what is driving your
  view."

  6. Ben: "The ex ante chance is not what anyone has at stake. When I am the one on
  the rock, I am not a ticket in a lottery with a five-in-six chance; I am this person,
  about to die, and you propose to kill me because of a better distribution of chances
  among people who are not me. And notice: I am not offering a rulebook for rescue
  services. I am saying what is required of this pilot here, who must choose between
  these lives."

  7. Anna: "But a rulebook is exactly what is needed, and the rulebook will be applied
  over and over, to people who do not know in advance whether they will be the one
  or one of the five. Written behind that ignorance, the rulebook says: save the greater
  number. You cannot answer the rulebook objection by saying you were only talking
  about this one case, because the pilot will be in this situation again, and so will
  her successors."

  8. Ben: "Then take your rulebook and be consistent. New case: the one hiker is thirty
  and uninjured and has people depending on him; the five are all ninety and trapped
  in a way that means that even if lifted they will die within the week. Does the
  rulebook still say five?"

  9. Anna: "No — save the one. But notice that I have not abandoned my principle;
  I have added a second one. What is at stake for each person matters as well as how
  many people there are. In your new case, the one has far more life left to lose,
  and that outweighs the headcount."

  10. Ben: "Then the headcount was never doing the work. In the original case you
  reached ''save the five'' because of a contingent fact about how much each of the
  six had left to lose, and when I changed that fact your answer changed. If the number
  of persons were really a reason on its own, changing what they stand to lose should
  not have moved you."

  11. Anna: "It did not move me on the headcount; it moved me on the total. Two reasons,
  not one: more people is a reason, and more life at stake is a reason. In the original
  case both point the same way; in your new case they point in opposite directions
  and one of them wins. That is not smuggling; that is having more than one principle."

  12. Ben: "Then you owe me an account of why the fifth person''s existence adds anything
  at all, once you have already weighed what everyone stands to lose. If the five
  are ninety and dying, you said the one wins; so the fifth ninety-year-old was worth
  nothing. If the five are thirty, you say the five win. So the fifth person is worth
  something only when his life is worth something. That is the welfare view with extra
  steps, and the extra steps are doing no work."

  13. Anna: "And here is the case that breaks your coin. One hiker on one ridge, a
  thousand on the other. You flip a coin between one life and a thousand?"

  14. Ben: "If I cannot add lives, then yes: one coin, one chance in two, and I accept
  that consequence. What I will not accept is that you get to treat ''obviously save
  the thousand'' as a datum. That intuition is the thing in dispute, and repeating
  it louder is not an argument."


