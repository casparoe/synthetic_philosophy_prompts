  cannot arise. A principle about rational action can be true of every situation that
  actually occurs and still fail in a stipulated situation that never occurs — that
  is not a reductio of the principle, it is a reductio of your insistence on applying
  it outside its domain. Suppose I grant exact indifference: then the agent simply
