  an agent acts only for a reason, and the will follows the greater apparent good.
  If that principle is true, the donkey cannot move, which is absurd; so either the
  principle is false or rationality is not always possible. Either way we learn something.
  The stipulation that the bales are exactly equal is not a description of a farmyard,
  it is a premise in an argument."


