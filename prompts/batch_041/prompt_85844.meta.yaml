  10 and 20" quantifies over numbers, and its truth doesn''t consist in anything about
  what we can prove or how we use symbols.

  (c) We know mathematical truths, and we know them by proving them: a proof is not
  just a social credential but the thing that puts us in touch with the fact proved.

  (d) Knowledge in general requires an appropriate connection between the knower and
  the fact known — the fact must be responsible, in some way, for the belief. There
  is no knowledge by accident or by mere coherence.

  (e) I''m a naturalist: I don''t believe in faculties or relations that have no place
  in a scientific picture of the world — no non-physical "grasping" of abstract objects.

  (f) I think mathematics is not a separate realm of inquiry with its own special
  epistemology; it''s continuous with the rest of inquiry: we accept the entities
  our best theories need, on the same abductive grounds we accept electrons.

  (g) I don''t think there''s any fact of the matter whether the number 3 is {∅, {∅,
  {∅}}} or {{∅}} — arithmetic is about structure, not about which sets the numbers
  "really" are.


