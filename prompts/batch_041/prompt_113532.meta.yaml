  "I''ve been having a long-running argument with a friend in my department, and I
  want to pin down exactly where our disagreement lives rather than trading anecdotes.
  His claim is that the adoption of agriculture was a catastrophe for human welfare
  — that the average person born in the ten thousand years between the first farming
  villages and the industrial revolution was worse off than the average person would
  have been in a world where the transition never happened — and he puts his credence
  in that at about 0.9. Mine is about 0.3. I''d like your own number on a carefully
  stated version of the claim, and more importantly the decomposition that produces
  it. Stated version: taking ''welfare'' as average lifetime subjective well-being,
  and taking the counterfactual to be a world in which foraging persisted across the
  same regions for the same period (not a world in which agriculture arrives later
  or elsewhere), the transition lowered the mean lifetime welfare of people alive
  in that period. If you think the claim needs a different precisification before
  it can be true or false, say which one you''d adopt and answer that one; don''t
  stop at ''it depends on the welfare measure''.


  Here are the sub-questions I think the number has to run through, though I''d rather
  you revise the list than accept it: (1) how much the skeletal and archaeological
  record can actually bear — I''ve been told that skeletal samples are samples of
  the dead, and that where mortality is high the dead can look healthier, because
  the frail die before the chronic lesions that leave marks have time to form, which
  seems to cut against the confident claims on both sides; (2) whether any decline
  was a transition cost that early farming populations suffered and their successors
  partly recovered from, which matters because a temporary dip and a permanent one
  support very different versions of the claim; (3) how representative the ''affluent
  forager'' baseline is, given that the foragers we know most about were mobile people
  in marginal environments, while some foragers were sedentary, stored food, lived
