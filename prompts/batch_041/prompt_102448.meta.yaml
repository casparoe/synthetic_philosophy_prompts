  The Condorcet jury theorem is the most robust: purely formal, self-contained, can
  be run with cards/dice, no facts needed, and I can inject a niche twist that isn''t
  standard textbook: e.g., make participants feel the difference between the theorem
  holding under independent competence and failing under correlated errors — but that''s
  standard too. To be "in the weeds," I could design the activity around a specific
  non-obvious result: e.g., the fact that the theorem''s conclusion inverts when p
  < 0.5 (the "jury theorem" is then a "jury theorem for wrongness"), or the tension
  with Condorcet''s other result — the Condorcet paradox of cyclical majorities, showing
  that majority rule can be simultaneously epistemically excellent (binary) and incoherent
  (three options). That''s a genuinely nice "in the weeds" combination: Condorcet''s
  two theorems, jury theorem and paradox, and the fact they coexist. Also the distinction
  between "sincere" and "strategic" voting, and the fact that if voters'' errors are
  correlated (common bias), the group doesn''t improve — the "dependence" problem
  (e.g., if all jurors share a bias, majority amplifies it). And the List & Goodin
  / Dietrich & Spiekermann literature on the "premise-based" vs "conclusion-based"
  aggregation — that''s a genuinely interesting, moderately niche but LLM-accessible
  idea: the "doctrinal paradox"/"discursive dilemma". Premise-based voting can be
  more reliable than conclusion-based voting. That''s a great "in the weeds" element
  for a high school activity: give participants a case where they vote on premises
  (each with >0.5 competence) and see the group reach the right conclusion even when
  the conclusion-based majority gets it wrong... Actually the classic result: with
  the doctrinal paradox, majority on each premise can conflict with majority on the
  conclusion. And the "premise-based procedure" tracks truth better under certain
  conditions.


