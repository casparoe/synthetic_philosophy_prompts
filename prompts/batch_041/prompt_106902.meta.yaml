  Key epistemic content to preserve:

  - Doubt requires a place to stand; doubting a hinge doesn''t refute it, it changes
  the practice.

  - Hinges are held without grounds (so "give me your evidence for X" is a category
  error when X is a hinge).

  - Hinges are not arbitrary: they''re held because of the practice''s whole shape,
  and they''re absorbed through training, not testing.

  - Hinges can shift, but not by a single finding; they shift when a whole practice
  reorganizes (riverbed/river water).

  - A doubt that has no stopping point destroys the practice''s ability to conclude;
  hence a procedure must have stop rules that are principled rather than merely administrative.

  - The asymmetry: within the practice you can investigate; from outside the practice,
  the challenge is a proposal to change the practice, which is not the office''s business
  to adjudicate.

  - Distinguish: is the complaint''s challenge something the practice''s own methods
  can in principle settle (even if laboriously)? If yes, it''s not a hinge. That''s
  a test! "The re-openability test": if there exists a recognized procedure in the
  field (even an expensive or rarely used one) by which the proposition could be checked
  without first presupposing itself, then it isn''t a hinge for us, and the complaint
  goes to investigation. If every available check presupposes the proposition, it''s
  a hinge, and the complaint must be routed elsewhere (to the scientific community
  / a policy body / the complainant must publish).

  - Also a test for the complainant''s own hinges: "does the complaint depend on a
  proposition the office would have to doubt along with its own records?" Then note
  that doubting it would make the office unable to act at all.

  - And a "who bears the cost of the doubt" test? The office should be honest that
  "this is a hinge for us" is a claim about our practice, not about the world; and
  there''s a values question about who gets to say.


  Also, the procedure must have a place where it hands off because it''s a values
