  but a family of structurally different ones, and that which member of the family
  you are in is fixed by how individual contributions aggregate, not by how selfish
  the participants are.


  I want the design to exploit a contrast that the standard treatment skips. The same
  group of people, with the same preferences and roughly the same stakes, can be trapped
  in three quite different ways depending on the aggregation technology governing
  the good: (i) summation, where what matters is the total and the individually rational
  move is to hold back and let others carry it; (ii) weakest-link, where the good
  is only as large as the smallest contribution and the rational move is to wait for
  someone else to move first; and (iii) best-shot or threshold, where the good arrives
  only if one or enough contributors reach a fixed level, and the rational move is
  to hope someone else is the one who does it. (Something like a volunteer''s dilemma
  sits inside (iii).) The binding constraint in (ii) and (iii) is strategic uncertainty
  — nobody can see whether anyone else has already acted — rather than greed.


  So: design the activity with at least four rounds for the same 24 people, same nominal
  stakes, same payoff magnitudes, with the aggregation rule (and where relevant the
  information each player has about others'' moves and endowments) as the only thing
  that changes. Rules, materials I can print or make from paper cups and tokens, a
  points scheme that needs no real money, a timeline that fits 90 minutes with time
  for the debrief, and roles if you need them. Participants must not be told that
  the rule changes are the point; the discovery should come from comparing their own
  behaviour across rounds, ideally from a scoreboard they fill in themselves. At least
  one round should make the standard remedy look inadequate: talking should help in
  one structure and not in another, and the debrief should say why.


