  Draft:


  I teach a second-year undergraduate module in social and political philosophy (mixed
  philosophy and PPE students, 24 of them, one 90-minute session, a flat seminar room
  with movable chairs, no computers or phones). I want a runnable in-class activity
  that makes them feel the force of something they will otherwise take themselves
