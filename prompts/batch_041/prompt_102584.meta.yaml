  ---


  I''ve spent too long in the interpretability threads of the rationalist blogosphere,
  and I''ve ended up with a set of gut verdicts about when a neural network has a
  representation of something that I can''t reduce to a single criterion. I''d like
  you to tell me what principle, or small family of principles, my verdicts add up
  to, and where the principle has to give.


  Here are the verdicts.


  1. A linear probe fitted to a trained vision model''s layer decodes whether the
  image contains a dog with high accuracy. A probe fitted the same way to a randomly
  initialised network of the same architecture also decodes the label, because the
  probe can latch onto low-level statistics that correlate with the label in the dataset.
  I say the trained network has a dog representation and the random one does not,
  even though the probe succeeds on both.


  2. Ablating or patching a direction in a language model''s residual stream flips
  its answer from ''Paris'' to ''Rome''. I say that direction is a representation
  of the France-capital relation, and that the causal intervention is the strongest
  kind of evidence for it.


  3. A single neuron fires for Paris, France, the Eiffel Tower and croissants. I say
  it is not a representation of any of those things; it is a mixed detector, and the
  representation, if there is one, is distributed.


  4. A sparse autoencoder finds a clean feature that fires on Paris contexts, but
  no downstream head reads it and ablating it changes nothing. I say it is a representational
  artefact rather than a representation of Paris.


  5. A model''s chain-of-thought says ''the capital of France is Paris'', but its
  internal state does not distinguish Paris from Lyon and the output is driven by
  a memorised template. I say the model does not represent Paris; the verbal report
  is not the representation.


  6. Two networks compute the same input-output function: one is a lookup table over
  the finite input space, the other is a compositional algorithm. I say only the compositional
  one represents the structure of the domain; the lookup table implements the function
  without representing anything, even though it behaves identically on every input.


  7. A model is trained on a synthetic task where the label is generated by factor
  X, but the model uses a spurious factor Y that is perfectly correlated with X in
  the training data. I say the model represents Y rather than X, because representation
  is fixed by the model''s causal role, not by the generative ground truth.


  8. A multimodal model has a concept present in its text encoder and in its image
  encoder, but the two encoders are not aligned and nothing in the model uses the
  concept across modalities. I say the model has two separate representations of the
  concept and no unified one.


  My tentative principle is this: a state represents F just in case it carries information
  about F, that information is used by downstream computation, and the state is robust
  under interventions that change F while leaving the rest of the task fixed. But
  this principle seems to say the lookup table in (6) represents the function''s structure
  (it carries and uses the information), which contradicts my verdict, and it says
  the artefact in (4) is not a representation (which matches), but it also says the
  mixed detector in (3) might represent a disjunction of Paris-or-France-or-croissants,
  which I don''t want.


  Could you state the principle or principles that actually capture these verdicts,
  with the case that motivates each clause? Please also say what it predicts for a
  case I haven''t listed -- a representation that is causally used only in a redundant,
  belt-and-braces way, where the same information is available from a second route
  and either route alone suffices -- and, finally, which of my verdicts the principle
  cannot accommodate and would force me to drop. I''d rather have a simple principle
  that overturns one verdict than a gerrymandered one that saves all eight.


