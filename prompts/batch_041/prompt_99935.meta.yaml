  I have no background in philosophy; I''ve just spent a lot of time thinking and
  reading on my own about the ethics of nudging people toward choices they wouldn''t
  otherwise make. I help run a volunteer-run community fridge on our street, and our
  committee keeps going back and forth about how to get more of our visitors to also
  sign up for a cleaning shift. One proposal is to rearrange things so the sign-up
  sheet is the first thing you see and the default box is already ticked, and to post
  a notice saying that most people in the neighbourhood who use the fridge also take
  a shift. Another is just to explain in plain terms why the fridge needs the help
  and let people decide.


  The more I think about it, the more it seems to me that these two proposals are
  not the same kind of thing at all, even though both are usually called "nudges."
  The first one changes what a person believes about how other people behave — it
  works by giving them a picture of the social norm — whereas rearranging the shelf
  works on how easy or salient the options are without touching what anyone believes
  about anyone else. And the odd thing is that the paternalism objection people usually
  raise seems aimed at the rearranging, while the notice about what "most people"
  do seems to me the more troubling of the two, because it doesn''t just tilt the
  field, it puts a fact (or something close to a fact) into the person''s reasoning,
  and if the claim is only roughly true then we''re getting the result by something
  that''s hard to distinguish from a polite lie.


  Please describe the most important implications of the debate over paternalism and
  nudging for how I should think about which of these two things we should do and
  how I should justify it to the rest of the committee. I''d like it in no more than
  600 words.


