  I have been reading the rationalist blogs and the Sequences for close to a decade
  now, and over that time I have drifted into something like a Carnapian position,
  though I could not tell you exactly when. I am putting together a short philosophical
  profile for a reading group that is working through Carnap''s politics and his ideas
  about planning, and before I present it I want a consistency audit. Here is the
  set of things I actually believe, stated as plainly as I can manage.


  (a) Tolerance about frameworks. ... (b) Non-cognitivism about value. ... (c) Socialism.
  ... (d) Scientific planning / policy as empirical. ... (e) Conceptual engineering.
  ... (f) Anti-metaphysics.


  Then the ask.


  Let me flesh out each.


  (a) On questions like whether to quantify over abstracta, whether the right decision
  theory is evidential or causal, or whether to describe an economy in market terms
  or in planning terms, I do not think there is a fact of the matter about which framework
  is correct. There are better and worse frameworks for particular purposes, and the
  choice among them is a practical decision, not a theoretical one, to be judged by
  something like fruitfulness, simplicity, and usefulness. I take this straight from
  Carnap''s principle of tolerance.


  (b) When someone says that socialism is just, or that a policy is wrong, I do not
  think they have said something that is true or false. Value and political utterances
  express attitudes or issue prescriptions; they do not describe a normative part
  of the world, because there is no such part. I am a non-cognitivist about this,
  and I take Carnap to have been one too.


  (c) I am a socialist, and not in a lukewarm way. I think democratic economic planning
  is the right way to organize production, that the case for it is strong, and that
  people who oppose it are not merely expressing a different attitude but are making
  a mistake. I think there is something to be said for it that a reasonable person
  should find compelling.


  (d) I think most policy disputes are, at bottom, empirical disputes. Given a clear
  goal, questions about how to get there are matters for evidence, modeling, and cost-benefit
  analysis, and better social science would resolve a great many of the disagreements
  that currently look ideological. This is the part of the Vienna Circle inheritance
  I keep: the scientific conception of the world applied to society.


  (e) I think philosophy is conceptual engineering rather than discovery. The philosopher
  is an architect, not a scientist: the job is to design and propose frameworks, not
  to find out how things independently are.


  (f) I think most traditional metaphysics is confused or verbal. There is no substantive
  question, over and above what our best frameworks allow us to say, about what really
  exists.


