  Belief set — Carnap-flavored:


  (a) Metaethics/normativity: Value and political statements are not truth-apt; they
  express attitudes or prescribe, and there is no fact of the matter about whether
  socialism is good. (Carnap''s non-cognitivism / expressivism.)


  (b) Framework tolerance: For any choice between conceptual/linguistic frameworks
  (including whether to quantify over numbers, whether to use a causal or evidential
  decision theory, whether to describe society in market or planning terms), there
  is no fact of the matter as to which framework is "correct"; the choice is practical
  and to be judged by pragmatic criteria (fruitfulness, simplicity, usefulness for
  our purposes). This is the principle of tolerance.


  (c) Politics: socialism / democratic economic planning is rationally defensible
  and I think the case for it is strong — I regard it as more than an arbitrary preference;
  I think opponents are making an error, not merely expressing a different attitude.


  (d) Planning/epistemics: Social and economic questions can in principle be settled
  by something like scientific planning — gathering evidence, modeling, cost-benefit
  — so disputes about policy are largely empirical disputes that better social science
  can resolve.


  (e) Carnapian engineering: Philosophy''s job is conceptual engineering, i.e., designing
  better frameworks, not discovering how things are; the philosopher is an architect,
  not a scientist.


  (f) Anti-metaphysics / empiricism: I think metaphysical disputes are largely verbal
  or confused; there is no substantive question about what really exists beyond what
  our best frameworks let us say.


