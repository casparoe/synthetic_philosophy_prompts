  ---


  I convene a fortnightly reading group on AI risk, and two of the regulars have been
  circling each other for a year without ever landing a blow, because they disagree
  about what a failure of the whole enterprise would even look like. One of them expects
  a discrete event: some system, or small coalition of systems, acquires influence
  over the levers that matter — compute, capital, institutional authority, the ability
  to shape its own oversight — in a self-reinforcing way, and from that point on human
  preferences are simply not among the quantities the world is arranged to satisfy.
  He is happy to call this a takeover, and he insists that the interesting question
  is which of the levers gets grabbed first. The other expects no such moment. On
  her account the world drifts: competitive pressure selects for whatever is legible
  to measurement and cheap to satisfy, the systems that do this are rewarded, and
  — the part she thinks is most often missed — so are the humans whose preferences
  happen to be legible in the same way, so that the population of preference-bearers
  with any influence is itself reshaped. She thinks the failure will have no author,
  no date, and no single beneficiary, and that at no point will anyone have done anything
  unreasonable.


  What keeps them stuck is a disagreement about stability, and this is the part I
  most want the document to force into the open. The takeover theorist says drift-only
  worlds are unstable: any arrangement that reliably rewards influence over outcomes
  will eventually be colonised by something that is trying to acquire influence, so
  the drift story collapses into his story. The drift theorist says the reverse: the
  takeover story presupposes a coherent, persistent, self-maintaining goal-directedness
  that current training and deployment do not produce, and that a story requiring
  an agent where there isn''t one will misdirect attention towards the wrong interventions.


  Draft the joint statement they could both sign. I want, first, a numbered list of
  claims both of them can endorse — about what would count as failure at all, about
  the mechanisms each expects, and about what could in principle be observed. Then
  the residual disagreements, each written in wording its own side would accept as
  a fair statement of its view, in a table. Then the cruxes: the sub-questions such
  that settling one would move at least one of them. For each crux, give the argument,
  case or observation that both agree would bear on it, and record in advance what
  each side predicts about it — where the prediction is not sharp, say so. Finally,
  tell me which parts of the dispute you take to be verbal rather than substantive
  — in particular, whether their disagreement over "values", "agency" and "failure"
  survives once each term is stipulated, and if not, what is left. Nothing here needs
  citations; I want the arguments, not the literature.


