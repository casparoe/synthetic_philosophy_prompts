  You are a philosopher of science and formal epistemologist, and you are helping
  me design the specification for a theory before I commit to defending one. The area:
  accuracy-first epistemology — the program that treats the accuracy of an agent''s
  doxastic state (how close its credences come to the truth) as the fundamental epistemic
  good, and tries to derive norms of rationality from expected accuracy.


  I want the desiderata list: what any adequate accuracy-first theory of epistemic
  value must deliver. Not the theory itself, and not a survey — the specification.
  Before you write, brainstorm the phenomena, cases, and formal pressures you think
  the area has to accommodate, then organize the list; do not present the brainstorm
  as such, but let it show in the coverage.


  For each desideratum, give (a) the requirement stated crisply, (b) the case, puzzle,
  or consideration that motivates it — a concrete one, not a gesture, and (c) whether
  you regard it as non-negotiable or as a preference of one camp within the program,
  with a sentence on who would reject it and why.


  The list must cover, at minimum, these pressure points:

  - the core case: credences over ordinary bivalent propositions, where accuracy is
  scored against a truth value, and the demand that the scoring be truth-directed
  and that it not reward credences for reasons having nothing to do with getting at
  the truth;

  - the demand that the scoring rule be proper (or strictly proper), i.e., that it
  not license an agent to misrepresent its own credences, and what that demand is
  supposed to buy;

  - whether the accuracy score can be bounded, continuous, and strictly proper at
  once, and what a theory loses by giving up whichever it gives up;

  - the gap between accuracy and evidence: accuracy scores are blind to what the agent
  has seen, so say what has to be added to explain why an agent should have the credences
  its evidence supports rather than more accurate ones;

  - credal states that are not a single probability function — imprecise, interval,
  or set-valued states — and what scoring a state of that kind would even mean;

  - doxastic attitudes other than credence: full belief, suspension of judgement,
  and question-directed attitudes; if the theory says the value of settling a question
  is just the accuracy of the resulting credences, say so and defend or attack it;

  - propositions whose truth value is not settled or not bivalent — borderline cases,
  indeterminacy, future contingents — and whether accuracy is even defined there;

  - the group case: the epistemic value of a community''s division of cognitive labour,
  where no single agent''s accuracy score seems to capture what is good about the
  arrangement;

  - the "why care?" demand: what the theory owes by way of an answer to someone who
  asks why accuracy, of all things, is the good to maximize.


