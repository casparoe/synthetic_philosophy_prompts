  finite sequence of trades, spread over time, each acceptable to the agent at the
  moment she makes it, has that result. I argue that the familiar pumping arguments
  establish only the first, and that the first entails the second only under two further
  premises that are contingent features of the agent''s situation rather than requirements
  of practical rationality: that her environment is pump-permissive (costless, self-financing
  trades remain available to her indefinitely) and that she is non-resolute (she will
  accept later trades that reverse earlier ones). Strip either premise away and cyclical
  or incomplete preferences can be perfectly rational; what survives is a conditional
  — if you are pump-permissive and non-resolute, then be an expected utility maximiser.
  My worked example is an agent with a strict three-way preference cycle who faces
  a small positive transaction cost on every trade and who can buy a commitment device
  for a fixed fee; I claim that over a range of costs she is neither exploitable nor
  irrational, and that the standard retort — that she would be exploitable were the
  costs zero — merely restates the idealisation it was meant to justify. I also claim
  that pump-freedom does not get you as far as a representation theorem without an
  Archimedean-type structural axiom, which is a substantive assumption about the shape
  of preference rather than a demand of rationality.


  The audience is a mixed departmental seminar of about twenty people: two Savage-tradition
