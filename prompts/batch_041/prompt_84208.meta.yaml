  Actually a cleaner set: The classic contrast is:

  - Contextualism (DeRose, Cohen, Lewis): "knows" is context-sensitive; the truth
  value of "S knows p" as uttered depends on the ascriber''s conversational context/standards.

  - Subject-Sensitive Invariantism (Stanley, Hawthorne, Fantl & McGrath): "knows"
  has invariant semantics, but whether S knows depends on S''s practical situation
  (stakes).

  - Pragmatic encroachment is the broader thesis that practical factors can affect
  knowledge; associated with SSI (Fantl & McGrath, Stanley).


