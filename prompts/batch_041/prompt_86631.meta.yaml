  Draft:


  "I''m writing a term paper for a seminar on Kierkegaard and nineteenth-century Danish
  thought, and I want to work on the Corsair affair — the episode in the mid-1840s
  when the Copenhagen satirical weekly The Corsair ran a months-long campaign of caricatures
  and mockery against Kierkegaard, lampooning his clothes, his legs, his walking stick,
  and his habit of strolling the streets of Copenhagen, so that he became a figure
  the whole town could point at, while the paper itself was written anonymously and
  had no identifiable author standing behind any particular piece. What I want is
  not a retelling; I know the outline. I want the affair analyzed through Kierkegaard''s
  own account of the press and the public — the one he develops in the review of the
  present age that he published in 1846, where levelling is described as an abstract
  process no individual carries out, the public is said to be a phantom that is never
  present anywhere and therefore never responsible for anything, and the crowd, which
  is at least a concrete gathering that can act, is carefully distinguished from the
  public, which cannot. Two further pieces of his position matter to me: his insistence
  that a writer who wants to do anyone any good must address the single individual
  rather than the public, and his claim that the press is the means by which levelling
  gets done in the present age.


  So: map the affair onto that theory. Who or what is the levelling agent — Goldschmidt?
  The paper''s anonymity? The reading public that consumed the caricatures? Does the
  theory need the distinction between the crowd and the public to survive contact
  with the case, or does the case collapse the distinction (the mockery had an author,
  and the townspeople who pointed at him were a crowd, not a phantom)? Second, the
  theory''s central claim is that the public, being an abstraction, dissolves responsibility
  — does that hold up here, or does the episode show that anonymity redistributes
  responsibility rather than dissolving it, since the harm to Kierkegaard was perfectly
  concrete and someone was plainly doing it? Third, the harder question: Kierkegaard
  did not stay out of the press; he answered the paper in the press, he kept publishing
  into the middle of it, and by his own later account he came to regard the whole
  affair as providential, something that made him into a solitary individual rather
  than a public figure. Does that use of the very mechanism he condemns count against
  the theory, or does the theory predict it — that in an age of levelling the only
  available means of speaking are the levelling means themselves? Say where the theory
  is silent, and end with what the case shows about it: a confirmation, an anomaly,
  or a case it never anticipated. Do not give me a bibliography; I want the argument."


