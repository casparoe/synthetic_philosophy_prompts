  Anekāntavāda: "non-one-sidedness" — the thesis that reality is many-sided (anekānta),
  and that every object possesses infinite aspects. Syādvāda: the "perhaps/conditionally"
  doctrine — every assertion is qualified: "in some respect, S is P", "in some respect,
  S is not P", "in some respect, S is both", "in some respect, S is inexpressible
  (avaktavya)", etc., yielding seven predications (saptabhaṅgī).


  Naya: a "perspective" or partial standpoint — a naya is a true but partial account
  from a particular standpoint (e.g., the naigama naya general viewpoint, saṃgraha
  naya — the standpoint of the universal/generality, vyavahāra — practical/particular,
  ṛjusūtra — the standpoint of the momentary present, śabda — the standpoint of the
  word/synonymy, samabhirūḍha — the etymological, evambhūta — the "such-ness"/functional).
  Two categories: dravyārthika (substance) and paryāyārthika (mode). The classical
  point: nayas are valid but partial; error (mithyātva / mithyādarśana) comes from
  absolutizing a naya — the "one-sided" view (ekānta). Pramāṇa is the comprehensive,
  non-one-sided cognition; naya is the partial one, contained within pramāṇa.


