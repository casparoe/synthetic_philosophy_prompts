  Draft:


  I am a philosophy professor who serves on the diagnostic review committee of a mid-sized
  psychiatric association. The committee has to decide next month whether to admit
  a proposed new disorder to our manual. I am less interested in what the literature
  says about this particular proposal than in what our own track record commits us
  to, so please reason from the precedents below and tell me how I should vote if
  I want to be consistent with them. I do not need citations or a reading list; I
  need the inferential structure.


  Our precedents are these. First, we admitted a category for a pattern of distress
  that had no known biomarker but that patients themselves had adopted and used to
  organize their experience; the label improved access to care and reduced isolation,
  and although the clinical presentation drifted over time, we judged the drift benign.
  Second, we rejected a category that patients also self-identified with, because
  the label seemed to amplify the very symptoms it named, creating a self-reinforcing
  loop, and because no treatment had been shown to help. Third, we admitted a category
  that no patient group claimed and that had no biomarker, because it organized a
  heterogeneous set of presentations and improved clinical management, and we saw
  no evidence of harmful labeling. Fourth, we rejected a category that did have a
  reasonably reliable biomarker but involved no subjective distress and no treatment
  benefit, because the label produced stigma and insurance consequences without compensating
  good.


  The new proposal is for a category covering a pattern of exhaustion and cognitive
  fog that patients have begun to self-identify with, especially online, and that
  appears to be spreading through communities in a way that changes how people describe
  their symptoms. There is no biomarker. Suffering is real and sometimes severe. A
  plausible but unproven intervention exists. Early reports suggest that the label
  may sometimes help people find language and community, and may sometimes intensify
  symptoms by focusing attention on them. What should the committee decide? Please
  identify the candidate rules that fit our earlier decisions equally well, say what
  each predicts about this case, give me your best guess about which rule we are actually
  running and why, and name the further case that would best distinguish the rules.
  If you think our precedents genuinely underdetermine the new case, tell me what
  principle I would be adopting with each available vote.


