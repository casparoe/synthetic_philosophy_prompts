  ---


  I teach a second-year lettering studio — 16 students, one 90-minute session, big
  tables and a wall we can tape stuff to. Every year they arrive thinking a letter
  is a shape you either draw right or wrong, and I want an exercise that makes them
  feel the real problem: an ''a'' isn''t a shape, it''s something about how a mark
  sits in a system of other marks and other readers. I want them to walk into the
  wall where making everything match your style starts eating the letters themselves,
  and then have to argue about who gets to say where a letter stops being that letter.
  No intro lecture. Don''t name any of the theory, don''t say prototype or essence
  or family resemblance, and save any labels or named ideas for the last ten minutes
  — I want it to land as their own discovery, not as me telling them a thing that
  has a name.


  Materials: index cards or sticky notes (lots), thick markers, tape, a wall. No computers.


  Rough plan (adjust as you like, but keep the order):


  Round 1 — invent a style, then get read. Teams of 3-4 (so 4-5 teams). Each team
  invents a style rule they have to be able to state in one sentence — something like
  "every stroke is an arc of the same circle" or "everything is drawn from strokes
  at exactly 45 degrees" or "no stroke is wider than a pencil line". Then each team
  draws six letters in that style: I''d say a, e, o, n, t, and one more of their choosing.
  Write the style rule on the back of one card, keep it secret.


  Then the panels: all the letters go up on the wall, shuffled, anonymous. Every other
  team writes down (a) what letter each glyph is and (b) what they think the style
  rule is. Score the drawing team on both: how many glyphs got read correctly, and
  whether anyone recovered the rule. Two numbers, and they''ll immediately see the
  tradeoff — the more legible you are, the more you''ve just drawn a normal font;
  the more your rule shows, the more readers guess wrong.


  Round 2 — the transplant. Two swaps, both directions. (i) Take your own style rule
  and now apply it to the letters you''d been avoiding, the awkward ones — g, s, k,
  r, and another ''a'' if you want. (ii) Take one of your six glyphs and hand it to
  another team; they put it into their alphabet. Ask: does your ''a'' still read as
  an ''a'' when it''s standing next to their letters? Does their alphabet still look
  like one family with your letter in it? This is the part where it clicks that "is
  this an a" and "does this fit the style" aren''t two independent questions.


  Round 3 — the boundary strip. Each team takes one letter — everyone does ''a'',
  it''s the most loaded one — and makes a strip of five or six variants running from
  "barely stylized, dead normal" to "so stylized it''s ambiguous with something else"
  (they''ll find the neighbours: ''a'' drifting toward ''d'', toward ''o'', toward
  ''e'', toward a squiggle). Tape all the strips side by side on the wall. Now the
  whole class has to walk the wall and, for each strip, put a marker or a sticky at
  the point where they''d say it stopped being an ''a''. Don''t let them negotiate
  first — individual marks, then look at the spread. The spread is the lesson.


  Then the reveal, which is the bit I most want to get right: put a normal text ''a''
  on the board next to a handwriting ''a'' — the two-storey one with the bowl and
  the hook over the top, and the single-storey round one. Same with ''g''. Ask them
  whether those are the same letter and what, exactly, is shared. Then write ''rn''
  and ''m'' next to each other in a couple of fonts, and ''l'', ''I'' and ''1''. The
  point to draw out, in their words not mine: nothing in the shape survives across
  all the things we call ''a''; what survives is a job — ''a'' is whatever occupies
  that slot and stays distinct from its neighbours in the set. Which means the boundary
  is being drawn by readers, and readers are a moving population, and the "essence"
  is more like a stable role than a fixed form. Let them fight about whether that
  means there''s no essence at all or just a relational one; that''s a real disagreement
  and I don''t want it resolved for them.


  Debrief (last ~20 min), mapping what happened to what:

  - the guessing panel = category membership is graded and reader-relative, not a
  switch

  - the rule-recovery score = style is what makes a set a set, and it''s also relational
  (you only see the rule by contrast)

  - the transplant = a glyph has no identity on its own; identity is a position in
  a system

  - the boundary strip spread = the intuition that there''s a fact of the matter about
  ''a''-ness is doing work, and it''s not obvious where it comes from


  What will go wrong, tell me how to handle it:

  - At least one team will just do a knockoff Helvetica/geometric sans and win the
  legibility half trivially. Fine — use it, that''s the "legible but anonymous" pole.

  - The guessing round will produce ties and arguments over specific glyphs. Don''t
  referee; make them note the disputed ones, they''re the gold.

  - Someone will draw a non-letter or a Cyrillic or Greek shape and the class will
  get distracted. Let it run a minute, it''s on topic.

  - Teams will converge on very similar rules (everyone goes geometric). Have a couple
  of weird rule seeds in your pocket to hand out if you need to spread them out.

  - The boundary-marking will get social — early markers anchor everyone. Do it individually
  and silently, collect, then reveal.


  And be straight with me about what the exercise can''t do. It can''t reproduce the
  actual thing that makes letterforms stable — centuries of readers, printing, and
  habit — sixteen classmates arguing for an hour is a much more negotiable crowd than
  that, so the activity probably makes the boundary look more up for grabs than it
  is, and I''ll need to say so. It also can''t settle whether there''s a real essence
  or only conventions; it can only make the question hurt a bit. And it can''t get
  at why some contrasts are perceptually easy and others aren''t — that''s a different
  session.


