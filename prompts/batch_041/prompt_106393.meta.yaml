  and a plain offer is whether the person still has the option they had before, and
  I said fine, so what did they have before, and she said that''s the whole problem,
  that''s the contested part, and then we just yelled. Because she''s right that "what
  they''d have without the study" isn''t a fact lying around, it depends on what you
  think the baseline is — the world as it is, or the world as it should be. And now
  I have to go back to work and approve or not approve actual studies and I don''t
  have a procedure.


  So: give me one. A decision procedure I can actually run, in maybe twenty minutes
  per protocol, without a philosophy degree, for the question "is this consent valid"
  — and separately, if it''s not the same question, "is this consent autonomous,"
  because she kept insisting those come apart and I half believe her. I want the questions
