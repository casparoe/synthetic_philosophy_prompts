  Draft:


  "I chair an interdisciplinary working group on the philosophy and science of psychiatric
  classification, and last week I lost control of a session. Two members — one a philosopher
  of science who works on kinds and classification, the other a clinical psychiatrist
  who runs a research program on mood disorders — spent forty minutes in an argument
  I could not adjudicate, and I have promised them a written ruling. I would like
  you to provide it.


  The background they share: they accept that psychiatric categories exhibit what
  has come to be called the looping effect — the classified people respond to the
  classification, and the classification in turn is revised in light of how they respond.
  The group had earlier adopted, for its own purposes, a threefold scheme for the
  mechanisms of looping, and both of them use it: (i) presentation shift, in which
  the same underlying condition comes to be expressed through the symptoms the category
  makes salient; (ii) boundary shift, in which the category changes who is counted
  as a case, without changing anyone''s condition; (iii) pathway shift, in which the
  category alters the mix of causes in the population — say, by making one causal
  route the culturally available one. Nobody disputes that all three occur. The question
  is what follows.


  Their exchange, as best I can reconstruct it:


  [Colleague A] Looping is not a curiosity; it is a difference in kind between psychiatric
  categories and the categories of the natural sciences. A category that partly constitutes
  its own instances cannot be a natural kind. Whatever the DSM is tracking, it is
  tracking something it has helped to make, and that is why the history of the manual
  is a history of fashion as much as of discovery.


  [Colleague B] That proves too much. Feedback loops are everywhere in biology — hosts
  and parasites, predators and prey, and, if you like, the effect of a field guide
  on what naturalists collect. A category can be causally entangled with its instances
  and still support induction, intervention and explanation. The test of a classification
  is whether it does scientific work, not whether it stands outside the causal order.


  [A] Then your test is too weak to be interesting. Homeostatic property clusters,
  and frankly any pragmatically useful sorting at all, pass it. If ''natural kind''
  means ''supports induction'', the concept earns nothing, and you have conceded the
  substantive point while keeping the vocabulary.


  [B] Perhaps the vocabulary is what should go. What matters is which mechanism is
  doing the work in a given case. If a category loops by pathway shift, we should
  say so and model the feedback; if it loops only by boundary shift, the underlying
  condition may be as indifferent to our categories as a mineral is. Looping is not
  one thing, and the word has been doing the work of three.


  [A] That is fine as far as it goes, but it leaves out the case that worries me:
  where the loop runs through the classification''s authority. A patient who reads
  the criteria, learns the script, and presents accordingly is not a measurement of
  a pre-existing state; the measurement has entered the state. You cannot build that
  into a model without deciding, in advance, what the category is supposed to be picking
  out — and that is precisely what is in dispute.


  [B] Every measurement enters the state. Blood pressure cuffs change what people
  do, and we did not conclude that hypertension is a fiction. The remedy is reflexivity
  in the modelling, not scepticism about the object.


