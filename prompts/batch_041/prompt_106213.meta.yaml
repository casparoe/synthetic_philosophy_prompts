  Aquinas on tyrannicide: The standard scholarly picture. In Summa Theologiae II-II
  q. 42 a. 2, ad 3: sedition is opposed to the unity of the multitude; tyrannical
  government is not just since directed to private good of ruler; hence disturbing
  such a regime is not sedition — unless the disturbance is so disordered that the
  multitude suffers more harm than the tyrant would cause. In De Regno (On Kingship)
  I.6 (or II.6 in some editions), Aquinas discusses whether it belongs to the office
  of a king to... Actually De Regno Book I ch. 6: "whether it is the business of a
  king to... " He discusses tyranny and says that when there is no human remedy against
  tyranny, one must have recourse to God the King of all. And he notes that if a people
  has the right to appoint a king, it can depose him or limit his power; but if the
  right to appoint belongs to someone else, one must await remedy from him. Also the
  point that a tyrant may be killed — Aquinas considers the argument in De Regno that
  "it seems that it belongs to the valour of a king to kill a tyrant" — he cites Cicero
  and the example of Julius Caesar? Actually in De Regno I.6, Aquinas argues against
  private individuals killing tyrants: the danger of someone killing a tyrant and
  then seizing power himself; and that the remedy should be public authority. He mentions
  that "it seems that it belongs to the virtue of a king to kill a tyrant" (from Cicero''s
  De Officiis?), then responds. Let me recall: In De Regno Book I, chapter 6, titled
  "Whether it belongs to a king to... " Hmm. Actually De Regno I.6: "Sed contra, videtur
  quod ad regis virtutem pertineat tyrannum occidere" — citing Cicero. Then he says:
  if the tyrant is not so much exceeding... The argument that it seems dangerous for
  private persons to kill a tyrant, because often the one who kills the tyrant takes
  his place; and "if the tyranny is not excessive, it is better to tolerate it than
  to act against it with many dangers." And he says that "against the cruelty of a
  tyrant there is no human remedy... recourse must be had to God." And "if there is
  a right to appoint a king for the people, it can depose him or curb his power; if
  it belongs to a superior, remedy must be sought from him."


  Also there''s the famous line from Aquinas: "A tyrannical government is not just..."
  and "there is no sedition in disturbing a tyrannical government" (nisi forte ita
