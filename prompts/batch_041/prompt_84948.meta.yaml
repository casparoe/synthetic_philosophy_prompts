  has ever seen a belief under a microscope, and since we now know the brain runs
  on electrochemical signals, we should conclude that talk of beliefs and desires
  is at best a convenient fiction, a way of speaking we keep for social purposes.
  On this view, when I say I believe it will rain, I am not reporting an inner state
  at all — I am just signalling a disposition to behave, which is why eliminativists
  deny that there is any such thing as the content of a thought. The theory is usually
  credited to the Churchlands, who also think that consciousness, free will, and the
  self will go the same way. Critics say the view is self-refuting, since to assert
  that there are no beliefs is itself to assert a belief; but eliminativists reply
  that this is a mere verbal trick, and that once neuroscience is complete we will
  simply stop using these words. The upshot is that the scientific view of the mind
  is incompatible with the ordinary view, and that anyone who has understood the science
  ought to stop talking about what they believe."


  Errors to seed:

  1. "neuroscience has shown" — eliminativism is a prediction/empirical bet about
  the future of a research program, not a result already delivered. (Subtle overstatement.)

  2. Conflating eliminativism with instrumentalism/fictionalism ("at best a convenient
  fiction, a way of speaking we keep for social purposes") — that''s the Dennett/Blackburn-ish
  "fictionalism" or instrumentalism, which is compatible with FP being indispensable;
  whereas the eliminativist says FP is *false* and should be abandoned, not that it''s
  a useful fiction. This is the classic conflation. (Though note: some eliminativists
  do use "useful fiction" language about FP while predicting its replacement — but
  as a claim that we *should keep* it, it''s instrumentalism. I''ll frame the summary
  as drawing the instrumentalist conclusion "we keep it for social purposes," which
  is the error.)

  3. "which is why eliminativists deny that there is any such thing as the content
  of a thought" — conflation: eliminativism about propositional attitudes doesn''t
  by itself entail denying content altogether; many eliminativists retain content
  (activation vectors, state-space semantics) — and the Churchlands'' positive programme
  is a theory of content (state-space semantics). Also conflating "no beliefs" with
  "no content."

  4. "just signalling a disposition to behave" — that''s behaviorism (Rylean dispositionalism),
  not eliminativism; the summary slides from eliminativism into behaviorism/dispositionalism,
  which is a *rival* view (and a realist one about dispositions).

  5. "consciousness, free will, and the self will go the same way" — conflates eliminativism
  about propositional attitudes with eliminativism about qualia/consciousness (a distinct,
  more radical and separately argued claim; and note the Churchlands'' eliminativism
  about qualia is indeed a thing — "qualia" eliminativism — so this is partly right
  but presented as if it followed from the FP argument, when it''s a separate argument,
  and the "free will and the self" is a further slide).

  6. "the self-refutation objection... eliminativists reply that this is a mere verbal
  trick" — presents a standard objection and a dismissive reply as if settled; the
  real debate is more interesting (the objection as originally pressed presupposes
  FP''s ontology; the reply distinguishes the theory''s content from the theorist''s
  states; but there''s a residual issue about whether contentful states of any kind
  are needed).

  7. "folk psychology is really just a primitive theory, like the physics of demons"
  — this is roughly right (FP as a theory), though the "like demon physics" analogy
  oversells (a popularizer move) and the inference "therefore false" is the gap; also
  the humoral medicine analogy is closer to the actual eliminativist''s examples (phlogiston,
  caloric, élan vital, witch-possession — Churchland used "phlogiston" and "caloric"
