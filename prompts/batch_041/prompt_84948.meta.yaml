  Let me draft the fictional summary carefully so it''s plausible with subtle errors:


  "Eliminative materialism is the view that neuroscience has shown that beliefs and
  desires do not exist. Its defenders point out that folk psychology — our everyday
  practice of explaining behaviour by citing beliefs and desires — is really just
  a primitive theory, like the physics of demons or the humoural medicine of the middle
