  Student answer draft:


  "The students argue by backwards induction. On Thursday night, if the exam hasn''t
  happened yet, the only remaining day is Friday, so they''d know the exam is on Friday.
  But the teacher promised the exam would be a surprise, so it can''t be Friday. Having
  ruled out Friday, they can rule out Thursday by the same reasoning: if Wednesday
  night comes and there''s been no exam, the only remaining days are Thursday and
  Friday, but Friday has already been ruled out, so it would have to be Thursday,
  so again they''d know. Repeating this for Wednesday, Tuesday and Monday, the students
  conclude the exam can''t happen at all, so the teacher''s announcement is false.


  Where does this go wrong? The induction is valid at each step — the students are
  only using the teacher''s announcement plus the fact that the exam hasn''t happened
  yet. The problem is the starting point: the students are entitled to assume that
  if Thursday night passes without an exam then the exam must be on Friday, but they
  are not entitled to assume that the teacher will actually give the exam. So the
  announcement can''t be taken as a guarantee, and the whole chain collapses. This
  shows the announcement is not just false but inconsistent, in the same way that
  the liar sentence is inconsistent: it says something that, if the students believe
  it, makes it impossible for the thing it says to happen. So the teacher''s promise
  is a kind of self-referential paradox, and a teacher who means what they say can''t
  give a surprise exam at all."


  Errors:

  1. "The induction is valid at each step" — questionable: the steps require the students
  to know the announcement is true and that the teacher will act on it, and by the
  time they get to the earlier steps they''ve used the announcement to derive that
  no exam will occur, which undercuts reusing it. More precisely, the Friday step
  already requires the students to *know* (not just believe) that the exam will be
  on Friday, which requires them to know the announcement is true — but the announcement''s
  truth depends on the surprise condition, which is about their own knowledge. So
  there''s a circularity; the induction isn''t uniformly valid.

  2. "the problem is the starting point: they can''t assume the teacher will actually
  give the exam" — this is a plausible-sounding but wrong diagnosis: the trouble isn''t
  that the teacher might not show up; the surprise condition itself is the issue,
  and the announcement does assert there will be an exam. Blaming the teacher''s sincerity
  misses that the paradox survives if we stipulate the teacher always keeps promises.
  Also, the students'' not knowing whether the teacher is sincere would just make
  the conclusion "there might be no exam", not "the announcement is inconsistent".

  3. "This shows the announcement is not just false but inconsistent" — conflation
  of inconsistency (no possible world in which the announcement is true/acted on)
  with falsity. And in fact the announcement is consistent and can be true: Wednesday''s
  exam was surprising. So the student''s conclusion is refuted by the stipulated outcome
  in the question.

  4. "in the same way that the liar sentence is inconsistent... self-referential"
  — misattribution: the announcement isn''t self-referential in the liar''s way (it''s
  not about its own truth); it''s about the students'' knowledge states, so the analogy
  to the liar is at best loose, and the surprise-exam announcement has a consistent
  model (Wednesday exam). Also the liar sentence isn''t "inconsistent" exactly — it''s
  ungrounded/no classical truth value in the simplest setting, or it generates contradiction
  given bivalence and T-schema. Subtle but maybe too fine; still fine as a comment.

  5. Also a small slip: the student says "if Thursday night passes without an exam
  then the exam must be on Friday" as the premise the students are entitled to — but
  the students also need "I know the announcement is true", and the student doesn''t
  flag the knowledge vs. belief issue (the announcement says the students won''t *know*,
  so what matters is knowledge, and the students'' reasoning slides between knowing
  and justifiably believing/ruling out). This is the deepest issue; a full-credit
  answer would distinguish "the students can rule out Friday" (epistemic) from "Friday
  is not a possible exam day" (metaphysical), and note the announcement only rules
  out the latter if the students *know* it''s true.


  Good. Also the student gets the induction correct, gets the outcome right-ish, has
