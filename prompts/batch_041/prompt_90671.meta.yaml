  Last night a friend and I argued for most of the evening about Berkeley''s account
  of money, and I woke up still turning it over. Her reading is that Berkeley treats
  money not as wealth but as a ticket or counter—a claim on the labor and industry
  of others—so that a nation''s true riches lie in its people and their capacity to
  work, not in its stock of gold and silver. On that view, coin is a convenience,
  and a community could in principle run on paper claims, or even on a ledger of mutual
  obligations, so long as those claims reliably command labor. I pushed back that
  this confuses money with credit and ignores what happens when a ticket stops being
  redeemable in anything people actually want; she replied that the confusion is ours,
  not Berkeley''s, because we have fetishized the medium and forgotten the underlying
  power over labor that money represents. We ended the night without agreeing, and
  I would like to see the disagreement dramatized rather than adjudicated.


  Write a short story that does this. Set it in a fictional island colony—perhaps
  in the eighteenth century, perhaps in a invented present—where a governor or reformer
  tries to put something like Berkeley''s monetary vision into practice. The colony
  is short of coin but long on labor and unfinished projects; the reformer issues
  paper tickets, or a system of labor-claims, on the theory that money should merely
  record and transfer the community''s power over its own industry. The story should
  follow what happens when the tickets meet the ordinary human desires for security,
  speculation, and escape. Include at least one character who benefits from the new
