  Sen''s paradox (1970, "The Impossibility of a Paretian Liberal"): Conditions:

  - U (unrestricted domain): any profile of individual orderings is admissible.

  - P (weak Pareto): if everyone strictly prefers x to y, then society prefers x to
  y.

  - L (minimal liberalism): there are at least two individuals, each of whom is decisive
  over at least one pair of social alternatives (a personal pair).

  Result: no social decision function satisfies U, P, and L (for n ≥ 2, with at least
  3 alternatives). The proof: two individuals, two personal pairs (e.g., who reads
  Lady Chatterley''s Lover — "the prude" and "the lewd"; and the famous example: A
  likes to read it and B prefers A not to; the pair "A reads" vs "A doesn''t read"
  is A''s personal pair; and another pair for B). Then a cycle.


  The "Lady Chatterley''s Lover" example: Prude (Mr. A?) and Lewd. Actually the classic
  example: two persons, each has a private matter (who sleeps with whom, or reading
  a book). Let me recall: In Sen''s 1970 paper, the example involves two individuals,
  each with a private sphere. Let me not quote.


  The escape routes:

  1. Give up U (restrict domain): Sen''s later "conditional Pareto" or "weak equity"?
  Actually the escape: restrict the domain so that the profile where A is a prude
  about B''s reading is excluded — but that''s ad hoc, "liberal" domain restriction:
  each individual''s preference over others'' private matters is excluded. This is
  "Sen''s domain restriction."

  2. Give up L: "libertarian" / minimal liberalism.

  3. Give up P: "Pareto" — some argue the Pareto principle is too strong; "conditional
  Pareto" (Sen) requires Pareto only over pairs where the individuals'' preferences
  are not meddlesome / are "self-regarding" or where there''s no conflict of private
  spheres.

  4. Reformulate rights: "rights as game forms" (Sugden 1985; Gaertner, Pattanaik,
  Suzumura 1992) — rights are not decisiveness over outcome pairs but powers to choose
  actions in a game. Under a game-form approach, the paradox may be dissolved because
  the outcome-based formulation misrepresents rights. Then there''s "rights as action-sets"
  and the "game form" view vs. "outcome-based" view.


