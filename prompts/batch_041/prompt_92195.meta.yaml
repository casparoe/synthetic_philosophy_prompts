  Prompt text:


  "Two colleagues of mine — a philosopher of mind and an evolutionary biologist, both
  of whom I like and neither of whom I think is a fool — spent most of a long train
  ride arguing over a taxonomy they both accept as the ordinary starting point. According
  to it, minds come in four grades. A Darwinian creature is fitted to its world by
  natural selection alone: it arrives with a fixed repertoire and cannot learn within
  its lifetime. A Skinnerian creature learns by reinforcement, its own successes and
  failures doing the selecting, so that the environment shapes the individual rather
  than the lineage. A Popperian creature can model its surroundings internally and
  try out its hypotheses against the model, so that when the model proves wrong it
  is the hypothesis that dies rather than the creature. A Gregorian creature is one
  whose mind is furnished largely by culturally transmitted tools and thinking-tools:
  much of what it knows and of how it reasons was invented by others and inherited
  rather than discovered for itself. Neither of them questioned where the labels come
  from, and I am not interested in that question either — I want to know what the
  fourfold division is worth.


  They agree entirely on the definitions and disagree about what the definitions describe.


