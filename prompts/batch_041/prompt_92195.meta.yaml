  Draft moves:


  (1) Biologist: The four grades are not a ladder of degree but three genuine discontinuities,
  and what marks each one is the currency in which error is paid for. A Darwinian
  creature pays for its errors in offspring; a Skinnerian pays in its own pain and
  lost opportunity; a Popperian pays in the cheap internal currency of a disconfirmed
  model, which is why it can afford thousands of trials where the Skinnerian can afford
  a handful; a Gregorian creature pays in a currency that is not its own at all, since
  the tool it uses was paid for by someone else''s errors, possibly centuries earlier
  and possibly by someone it never met. Every step down that ladder is a step in the
  cost of being wrong, and cost of being wrong is not a matter of degree; it changes
  what kind of thing a creature can be.


  (2) Philosopher: Every one of those "discontinuities" is a continuum with a plausible
  intermediate case. Where exactly does an internal model begin? A bacterium swimming
  up a sugar gradient is, if you like, testing a hypothesis about where the sugar
  is; a rat that has learned to avoid a baited tunnel is representing something; a
  crow that re-hides food only when it has itself been watched is doing something
  very like attributing a perspective. If you cannot say where hypothesis-testing
  starts without simply legislating, then "Popperian" names a region on a scale rather
  than a kind. And your criterion has the same problem: cost of error varies continuously
  with body size, lifespan, and ecology, so "cheap enough to make simulation worthwhile"
  is a threshold you are choosing, not finding.


  Also: grades are ascribed to behaviours, not to minds. A human is Darwinian about
  the suck reflex, Skinnerian about her fear of a particular dog, Popperian when she
  rehearses an argument, Gregorian when she does long division. If every creature
  is all four at once, the four grades are a taxonomy of activities, and the claim
  that there are four kinds of minds has quietly disappeared.


