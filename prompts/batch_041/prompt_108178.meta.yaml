  no matter what" are making a claim that, taken literally, undermines the very causal
  claims they''re making. That''s a great puzzle and a great proposal question: does
  the historian''s "overdetermined" mean (a) each of several causes was individually
  sufficient (counterfactual overdetermination), (b) the outcome was robust across
  many possible variations (robustness), (c) there were many contributory causes,
  none sufficient (not overdetermination at all, just multi-causality)? And the proposal
  would be to separate these senses and test them on a case.


