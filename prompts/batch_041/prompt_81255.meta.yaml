  Key conceptual issue: to define "side effect" you need a baseline of what counts
  as "the intended effect" — which requires knowing the agent''s objective. And "low
  impact" defined as "keep the world close to what it would have been" requires a
  counterfactual baseline, which requires a model of what would have happened absent
  the agent — but the agent''s own actions change that. Also "no side effects" could
  be trivially satisfied by an agent that does nothing (inaction) or by an agent that
  manipulates the measure. Also the "specification of value" point: any impact measure
  implicitly encodes which features of the world matter (a value judgment about what
  counts as disruption). E.g., relative reachability uses a distance metric over states;
  the choice of reachability as the thing to preserve is a value-laden choice. Also
  "the off-switch" and "manipulation of the measure."


