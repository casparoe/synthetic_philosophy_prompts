  Draft:


  "I report on AI for a general-interest science magazine, and I have spent the past
  several months on the small technical literature devoted to impact measures: the
  proposals that try to make a learning agent penalize the side effects of its own
  actions without first handing it a complete account of what we value. The position
  I keep encountering, and that I have largely come to accept, is that side-effect
  avoidance is a separable safety property. On this view, you can define and measure
  impact using only a value-neutral apparatus: fix a baseline — typically the trajectory
  the world would have followed had the agent done nothing, or a stepwise version
  of that counterfactual — and then measure deviation from it, either as unreachability
  or as the shrinkage of the set of states reachable from the present, or else as
  the degree to which the agent shifts its ability to attain a spread of randomly
  generated auxiliary goals. Nothing in that apparatus names a human good, and yet
  agents trained against it, in the gridworlds and Game-of-Life-like environments
  that have been used so far, do stop knocking over the vase and do stop preventing
  other agents from acting. The measure doesn''t need to know what is valuable; it
  needs only to know what is different, and the difference is computed against a baseline
  that is not itself a value judgment.


  I want to know what would count against this position. Please tell me the observations,
  arguments, formal results, or engineering developments that should move someone
  who holds it — not the general worry that AI is hard, but the specific things. I
  am especially interested in the ones a defender would themselves concede, as opposed
  to the ones only critics press, and in whether the position has been quietly qualified
  into something that cannot fail: every measure I have read about has a weighting
  constant, a distance metric, or a set of auxiliary goals, and I want to know whether
  the value-neutrality claim survives those choices or whether the position collapses
  into the rival view that any usable impact measure is a compressed value specification
