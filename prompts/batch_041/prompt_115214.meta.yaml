  Key philosophical content to prompt for:

  1. The demon''s story as a story about information being physical: Szilárd''s measurement,
  Brillouin''s negentropy, Landauer erasure cost, Bennett''s resolution. The novel''s
  demon is a "sensitive" — communication, consciousness — which anticipates a tempting
  but wrong idea (the demon needs a mind) vs. the actual resolution (memory erasure,
  no consciousness needed).

  2. Conflation of Shannon information with semantic meaning: the novel''s characters
  read "information" as meaning-laden (the Tristero, the sign), while Shannon entropy
  is meaning-blind. Oedipa''s search for meaning vs. the physics of information which
  is indifferent to meaning. This is a real philosophical point.

  3. Entropy and paranoia: increasing entropy = loss of order/meaning; but the demon
  shows that local order is possible at a cost, and the cost is paid elsewhere — hidden.
  Oedipa''s inability to find where the cost is paid / the accounting is invisible:
  either the demon works (a hidden order) or it doesn''t (paranoia). Also "the whole
  system including the demon" — the reader is inside the box.

  4. The machine as a hoax/machine that doesn''t work: is that the honest physics?
  The machine fails for Oedipa but Nefastis claims only sensitives work it — an unfalsifiable
  claim; the physics resolution is that the second law is saved by accounting, not
  by denying the demon.

  5. Where the reading resists: Pynchon''s use of entropy is closer to a cultural
  metaphor (heat death, decline) than to thermodynamic entropy; the novel isn''t doing
  physics; and the "demon" in the novel is more about interpretation/paranoia than
  about the second law; also the novel''s 1966 date predates Landauer/Bennett''s full
  resolution, so its puzzle is the pre-resolution puzzle (Szilárd/Brillouin era).

  6. End: what the novel adds that argument alone doesn''t — e.g., the demon as a
  figure for the reader/interpreter, and the affective dimension of an information-theoretic
  universe: whether a world where information is physical but meaning isn''t has room
  for meaning.


