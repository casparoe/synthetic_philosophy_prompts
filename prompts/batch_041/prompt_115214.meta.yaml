  Final wording:


  ---

  I''m an undergraduate writing a term paper for a philosophy of physics seminar on
  thermodynamics and information, and I''d like to read Thomas Pynchon''s The Crying
  of Lot 49 through Maxwell''s demon and the physics and philosophy of information.
  The scene I keep returning to is Oedipa Maas''s visit to the inventor John Nefastis:
  he shows her a box with a piston that he says a working demon drives, explains it
  in terms of a balance between heat entropy and communication entropy, insists that
  entropy is a metaphor linking thermodynamics to information flow, and claims that
  only a sensitive — a person able to communicate with the demon by concentrating
  on the picture attached to the box — can make it run. Oedipa stares at it through
  several cartoons, the piston never moves, and she leaves unsure whether the machine
  is broken, fraudulent, or simply waiting for someone better than her. (You needn''t
  quote the novel; I have the text in front of me and know the scene.)


  I want a reading that takes the physics as seriously as the novel. Is Nefastis''s
  machine a mistake the physics has since corrected — the demon does not need a mind
  or a sensitive, only a memory and the cost of erasing it — or does his insistence
  on communication anticipate the measurement-based accounts of the demon''s failure?
  The novel also runs two senses of information together: the plot is a hunt for meaning
  (does the muted horn mean anything, is Trystero real), while information theory
  is indifferent to meaning, and I want to know whether Pynchon is exploiting that
  equivocation or dramatizing a genuine gap. And the demon''s local order has to be
  paid for somewhere Oedipa can never see, which is close to the structure of her
  paranoia: order, if it exists, is always accounted for outside the frame. Where
  does that analogy hold and where does it trade on a confusion between thermodynamic
  entropy and entropy as a cultural figure for decline?


  Finally, say honestly where the reading resists — the demon here is at least as
  much a figure for interpretation and the reader as for the second law, and the novel''s
  puzzle predates the resolution that finally saves the demon — and then what the
  novel adds that the physics and the philosophy of information don''t: what it''s
  like to live in a world where information is physical but meaning is not.


  ---


