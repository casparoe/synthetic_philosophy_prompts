  nursing or social work background and no philosophy training at all, so what I need
  is a procedure that person can actually run in about an hour and defend afterwards
  to the medical director, who has to sign off on the chart note. The trouble is that
  every time we try to write it down we end up in the same argument: is death the
  loss of the whole brain, the brainstem, the capacity for consciousness, or something
  else entirely, and does it matter whether we''re talking about what death *is* versus
  what state counts as satisfying it versus what we actually check at the bedside.
  I keep telling the group these are three different levels of question and we keep
  answering all three at once. Also, and this is the thing that makes me nervous about
  the whole-brain story, I''ve read that there are documented cases where people who
  met the brain-death criteria were kept going on machines for years, which suggests
  that a body can go on being some kind of integrated system for a long time after
  we''ve said the person is gone.


  Two more things that I want the procedure to get right, and I suspect they''re the
  whole ballgame. First, there''s a difference between a state being irreversible
  — nobody could bring this person back, with any technology that exists — and a state
  being permanent, meaning we''re not going to try, and the way I understand it the
  donation-after-circulatory-death protocols, where the heart has stopped and everyone
  stands there counting for two or three minutes, are resting on the second of those,
  not the first, because if someone did chest compressions right then they might very
  well get a rhythm back. I''d like the procedure to say out loud which one it''s
  using at each step instead of sliding between them. Second, we have to keep the
  dead donor rule in view — you can''t take organs from someone who isn''t dead —
  so whatever the procedure says about the borderline has consequences downstream
  for real people waiting for organs, and I don''t want it to pretend otherwise.


  So: please write me that procedure. The questions to ask in what order, what counts
  as a sufficient answer to each, where it stops with a flat no, and where it has
  to hand the call to a human being because the remaining question is a value choice
  and not a fact question — and be honest about which steps are judgment calls dressed
  up as procedure. Then run it, out loud, on three cases: (1) a patient who meets
  the whole-brain criteria and is on a ventilator, whose family objects on religious
  grounds and wants the ventilator kept going; (2) a donation-after-circulatory-death
  case where the heart has stopped and the team wants to declare after two minutes;
  (3) a patient with no evidence of any cortical function at all but an intact brainstem,
  who breathes on their own, where I''ll admit I think we should be able to call that
  death and I suspect the procedure won''t let me. Write it all as continuous prose,
  no headings, no bullets, no bold, no tables — our working-group documents have to
