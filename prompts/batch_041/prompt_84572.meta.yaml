  "Ok, I need a dialogue for my decision theory reading group, and I''d rather have
  you write it than me.


  Here''s the setup. Take the absent-minded driver: you''re driving home down a road
  with two intersections that look exactly alike, and you can''t tell which one you''re
  at when you get to it. Turn off at the first and you get nothing, turn off at the
  second and you get the prize, carry on past both and you crash. Two people in the
  group have read the case and neither of them is fuzzy on the arithmetic, but they''ve
  ended up in completely different places, and I want you to have them go at each
  other.


  The first one says the driver should settle on a policy before she starts -- something
  like flipping a coin at every intersection she comes to -- and that this is the
  answer even though it guarantees she''ll sometimes bail out at the wrong one. Her
  thought is that the only thing the driver ever really chooses is a rule for what
  to do at an intersection, and that a theory which tells her to look at the intersection
  she''s standing at is ignoring the fact that she has no clue which one it is.


  The second one thinks that''s cheating. As she sees it, the driver is always at
  *one* of the intersections, and she knows a good deal more than ''I''m at one of
  two places'' -- she knows she''s still driving, she knows what she''s already done,
  and that''s information the policy view quietly throws away by imagining her deciding
  from some Archimedean point she can never actually occupy. Her verdict is going
  to come out different, and I want the two of them to fight about *why* rather than
  about the number.


  Then have them run one more case: the driver''s memory loss is only partial, i.e.
  with probability q she does remember whether she''s already been through the first
  intersection. I want to know whether the first one''s answer survives as q slides
  from 0 up to 1, and whether the second one''s does. (If that needs pinning down
  before it can be answered, have one of them say so and say how they''d pin it down.)


  No strawmen -- both of them are smart and both should get real replies, not a foil.
  And finish with two or three sentences of your own: where''s the dialogue most likely
  to be unfair or to get the philosophy wrong, and what would have to be true -- what
  argument or case -- to make you think the other character has the better of it?"


