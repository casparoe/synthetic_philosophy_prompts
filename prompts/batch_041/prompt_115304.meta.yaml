  recollection of the published version. The symbols are M, I and U; strings are built
  from them; the single starting string is MI; and there are four rules of transformation:


  1. any string ending in I may have U appended to it;

  2. a string of the form Mx may be rewritten as Mxx, i.e. whatever follows the M
  is doubled;

  3. any occurrence of III may be replaced by U;

  4. any occurrence of UU may be deleted.


  The target is MU. The target cannot be reached — no sequence of applications of
  those four rules takes MI to MU — and part of what I want the students to discover
  is how one could possibly know such a thing rather than merely suspect it after
  an hour of failure. Do not give them the impossibility result in advance; but do
