  \ in the Absent-Minded Driver Problem\n\nThe standard absent-minded driver problem\
  \ is usually presented as follows. A driver travels along a road with two exits.\
  \ At the first exit, leaving yields payoff 0. At the second exit, leaving yields\
  \ payoff 4. If the driver passes both exits, the payoff is 1. The driver cannot\
  \ tell the exits apart when reaching them, and after passing the first exit cannot\
  \ remember having done so. At each exit, the driver must choose to exit or continue\
  \ without knowing whether it is the first or the second. The standard mixed-strategy\
  \ analysis says the driver should exit with probability 1/3 at each opportunity,\
  \ yielding an expected payoff of 4/3. Yet if the driver could precommit to a plan,\
  \ the driver would choose to continue at the first exit and exit at the second,\
  \ yielding 4. The problem is often taken to show that act-by-act expected utility\
  \ maximization and plan-based expected utility maximization can diverge under imperfect\
  \ recall.\n\nI want to argue that the divergence is real but that it is often described\
  \ too quickly. There are two different questions. First, what should the driver\
  \ do at an exit, given the information available at that exit? Second, what plan\
  \ should the driver adopt before starting, given that the plan will be executed\
  \ without recall? The first question is act-relative. The second is plan-relative.\
  \ The standard 1/3 answer is an answer to a third question: what stationary randomization\
  \ over exit and continue maximizes expected payoff if the driver must use the same\
  \ probability at every exit and cannot carry information between exits? That third\
  \ question is not the same as either of the first two.\n\nMy proposal is that the\
  \ absent-minded driver problem is best understood as revealing a gap between act-relative\
  \ and plan-relative evaluation, but that the gap does not by itself show that act-relative\
  \ evaluation is irrational. It shows that act-relative evaluation is incomplete\
  \ when the agent's future selves cannot coordinate. The driver at an exit cannot\
  \ make a binding choice for the other exit, and cannot even know whether the other\
  \ exit has already been passed. So the driver's choice at an exit is not a choice\
  \ about the whole trip. It is a choice about one node in a decision tree whose other\
  \ nodes are controlled by relevantly similar but numerically distinct temporary\
  \ agents.\n\nI then want to introduce a variant to test this. Suppose the driver\
  \ has a coarse memory signal. With probability q, the driver can correctly distinguish\
  \ the first exit from the second. With probability 1-q, the driver cannot distinguish\
  \ them and has the standard absent-minded experience. The signal is not under the\
  \ driver's control and is not remembered after the exit. I claim that as q increases,\
  \ the optimal policy changes in a non-obvious way. When q is high, the driver should\
  \ exploit the signal and exit at the second exit when recognized. When q is low,\
  \ the driver should fall back toward the standard stationary randomization. But\
  \ there may be a middle range where the driver should randomize even when the signal\
  \ says first exit, because exiting at the first exit is so bad that it is worth\
  \ gambling on a later opportunity. I want to know whether this middle range actually\
  \ exists under plausible parameters, and whether it undermines the idea that the\
  \ driver's problem is fundamentally about coordination rather than about information.\n\
