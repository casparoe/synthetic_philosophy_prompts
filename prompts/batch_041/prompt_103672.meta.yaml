  the binding obligations run to kin and to people in a relationship of mutual support,
  and the public/private line we take for granted isn''t drawn in the same place.
  But that''s exactly the issue — if the villagers don''t experience it as corruption,
  then it isn''t corruption, since corruption is at least partly a matter of how the
  practice is understood by the people who take part in it. Imposing our understanding
  is the thing the critique warns against. So my answer to (a) is no.


