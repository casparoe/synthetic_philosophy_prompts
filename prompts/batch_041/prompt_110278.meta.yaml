  \ establish about the knowability thesis. (6 marks)\n(c) Identify the two main families\
  \ of responses and commit to one of them, giving reasons. (6 marks)\n\n**Script.**\n\
  \n\"Take any true proposition p, and suppose for reductio that it is not known:\
  \ p ∧ ¬Kp. Since this is a truth, the knowability thesis tells us that it is possible\
  \ that it is known.\n\nConsider what knowing it would come to. Knowledge distributes\
  \ over conjunction, so a knower of p ∧ ¬Kp would know p and would also know ¬Kp.\
