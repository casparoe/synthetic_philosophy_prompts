  Draft:


  I am a fifth-year PhD student in philosophy, and next week I am responsible for
  the seventy-five minute session of a cross-departmental reading group — linguists,
  cognitive scientists, an anthropologist, and two philosophers — on the question
  of whether disputes in metaphysics can ever be merely verbal, with the metaontological
  debate over composite objects as the running case. I have read the literature and
  do not need the idea explained to me; what I need is a plan for teaching it, and
  specifically the following: the order in which the components have to be introduced,
  and for each one what it depends on; the single example that should carry the session,
  with an account of what that example must contain and what would disqualify it;
  the misconceptions this audience will arrive with or form along the way, and the
  precise point in the sequence at which each should be headed off; one closing question
  that would tell me whether the distinction has landed rather than merely been memorised;
  and an explicit list of what I should refuse to cover at this level, said out loud
  as a refusal, with a reason for each omission.


  Then components.


  The components I am currently inclined to run through are these: first, the ordinary
  and easy distinction between disagreeing about the world and disagreeing about what
  a word means, of the kind you get with two people who each think the other is misusing
  "bank"; second, the much harder claim that a dispute can be caused by language without
  being settled by looking a word up — that is, that two people may agree on every
  fact and still disagree about what to say; third, the metaontological case itself,
  where one party insists that there are only particles arranged chairwise and the
  other that there are chairs; fourth, the suggestion that "there is" might be understood
  differently in different frameworks, so that the two sides need not be contradicting
  each other at all (this is the idea I have seen called quantifier variance, though
  I would rather you explain the content than the label); fifth, the counter-thought
  that this is a way of ducking the question of what there really is rather than answering
  it; and sixth, the reflexive worry that diagnosing a dispute as verbal is itself
  a move in the dispute rather than a neutral description of it. Two complications
  are already in play and I want them built into the plan rather than handled in passing.
  A linguist in the group has written to say that "verbal" properly means "spoken",
  that the phrase is therefore a misnomer, and that we should be talking about disputes
  over words — a complaint which, if I am not careful, will consume the session and
  which may itself be a verbal dispute about verbal disputes. And one of the philosophers
  has said in advance that if a dispute is verbal then it is unimportant and nobody
  is wrong, which I take to be the conflation of at least two distinct claims, one
  about the source of the disagreement and one about its value or its resolution.


  Then examples + test + cuts.


  As for the carrying example, I keep reaching for the tomato, botanical fruit versus
  culinary vegetable, or for the reclassification of Pluto; my worry is that both
  are too easy, in that they teach the group that a verbal dispute is just an ambiguity
  to be cleared up by disambiguation, which is precisely not the lesson I want, and
  I want to know whether either can be made to carry the session anyway or whether
  the load has to go to the chair-and-particles case, and why. I have drafted a check
  to use at the end: ask them to take a dispute of their own choosing and say, first,
  whether it would survive both parties agreeing to use a single stipulated term,
  and second, what either party would have learned if it had dissolved. Tell me whether
  that check is sound, whether it will discriminate between the positions I listed
  above, and whether there is a better closing question. Finally, I intend to cut
  the formal apparatus of framework-relative quantification, the verificationist history
  behind the internal/external contrast, and the analytic/synthetic background, and
