  entitlement framework as its working doctrine and needs a runnable procedure.


  Deliverable: a decision procedure — ordered questions, what counts as a sufficient
  answer, stopping rules (when the answer is "claim fails"), and hand-off points (where
  the question is evaluative/legislative, not factual). Then run it on three cases:
  (1) a straightforward broken chain (asset transferred under duress in a period of
  persecution, now held by a good-faith purchaser), (2) the Wilt Chamberlain-type
  case (a just baseline plus a long series of voluntary transactions producing extreme
