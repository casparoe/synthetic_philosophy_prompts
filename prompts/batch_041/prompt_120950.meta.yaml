  ---

  You are a philosopher who works on historical entitlement theories of justice and
  on the design of institutions that have to apply them. Before you answer, do some
  visible preliminary work: in a few paragraphs, set out what a Nozickean entitlement
  framework actually commits a decision-maker to — what it says about acquisitions,
  transfers, rectification, and about the difference between judging a holding and
  judging a distribution — and note which parts of that framework are settled and
  which are placeholders. Only then write the procedure. Think carefully about the
  difference between a procedure that is faithful to the framework and one that merely
  borrows its vocabulary.


  I chair a body — call it the Historical Holdings Board — that has been created to
  hear petitions from families and communities who claim that an asset now held by
  someone else is not justly held. The assets are ordinary: parcels of land, shares
  in firms, a manuscript collection, a pension entitlement, sometimes a whole business.
  There are about 2,000 petitions, we have eighteen months, three staff (one of whom
  is a historian), and a statutory mandate that directs us to "take account of hardship"
  and to give written reasons that will be published, read by claimants, and scrutinized
  by a court and by the press. I have no general theory of my own, and I want to adopt
  the entitlement framework as the Board''s working doctrine. But a doctrine is not
  a procedure, and my staff cannot be asked to read political philosophy.


  Write the decision procedure we can actually run. It should be a sequence of questions
  in the order they must be asked, with, for each question, what would count as a
  sufficient answer, what evidence we would need, and what happens if the evidence
  is missing; it should say exactly where the procedure stops with a denial of the
  petition, where it stops with an order to return or compensate, and where it must
  hand the case to the Board as a whole because the remaining question is legislative
  or evaluative rather than historical. Keep it usable by a case officer who has no
  background in the theory, and mark clearly which steps only look mechanical but
  are in fact judgment calls.


  Then run the procedure, in full, on three petitions: (i) an asset that passed out
  of a family''s hands under legal duress during a period of persecution and has since
  been bought and sold twice by purchasers who had no reason to suspect anything;
  (ii) an asset whose current holder acquired it through a long chain of ordinary
  voluntary transactions from a baseline that no one disputes was just at the time,
  where the petitioner''s real complaint is not about any particular transfer but
  about the shape of the resulting distribution — the case the framework illustrates
  with a star athlete whose contract adds a small surcharge to every ticket sold and
  who ends up with a quarter of a million dollars; (iii) a case where the original
