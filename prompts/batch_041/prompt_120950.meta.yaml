  statutory mandate that says it may consider hardship, which conflicts with the entitlement
  framework''s refusal to look at patterns; the board must give written reasons that
  will survive judicial review and public criticism; it must not simply assert contested
  philosophy as law.


  The "answer you won''t like": case 2 — the procedure should force the board to deny
