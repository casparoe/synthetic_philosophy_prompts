  The slogan: "the crowd is untruth". Where did the journalist meet it? Maybe a conference/twitter/op-ed.
  The journalist covers science and ideas, so maybe they were at a panel about social
  media and the press, and a philosopher/commentator invoked Kierkegaard: "the crowd
  is untruth", used to dismiss e.g. Wikipedia, or to argue that any consensus is epistemically
  worthless, or that there''s no such thing as collective knowledge. And the journalist
  wants the readings laid out: is it about the public as an abstraction (nobody is
  the public, so no one is answerable), about the crowd as a moral category (a crowd
  is where individuals evade responsibility, so no one in it can be in the truth —
  "untruth" as a moral/religious category, not a claim about majority opinion being
  false), about levelling, about the press creating a phantom public that isn''t a
  real collective, about anonymity, etc.


  Key distinctions to prompt for:

  1. Truth-aptness reading: crowds are usually wrong / majority opinion unreliable
  (epistemic, statistical). Trivial-to-false.

  2. Moral/religious reading: in a crowd, the individual is not truly an individual;
  the crowd is untruth because truth requires a single individual before God — "untruth"
  = the mode of existence, not a propositional falsehood. So the claim isn''t about
  accuracy of beliefs at all.

  3. Responsibility/accountability reading: the crowd is a way of diffusing responsibility;
  nobody can be held to account, so no one can be a witness to the truth. Untruth
  = evasion.

  4. Social-epistemic reading: "the public" is an abstraction, not a real collective
  — it doesn''t exist as a body that could decide or be answerable; unlike a "community"
  or an actual assembled crowd of real persons. So appeals to "the public" are appeals
  to a fiction. This connects to the press: the press conjures this phantom.

  5. Levelling reading: the press and reflection level distinctions, producing an
  age without passion where nothing decisive happens; the crowd is untruth as a symptom
  of levelling, not a doctrine about belief.

  6. Rhetorical/contextual reading: it''s a remark aimed at the Danish Hegelians and
  the established church, and at his own experience of being ridiculed in the press
  (the Corsair affair), not a general epistemology of groups.


  Also there''s a tension: Kierkegaard praises "the community" and says "the crowd"
  is not the same as "the many" or "the community"; he thinks "the crowd" is a category
