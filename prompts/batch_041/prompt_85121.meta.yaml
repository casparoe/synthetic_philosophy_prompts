  "I''m writing a long piece on the strange afterlife of the argument that you may
  kill a tyrant, and I want to end it with a sonnet rather than another paragraph
  of summary. The bit I keep coming back to is Aquinas on sedition — where the real
  question isn''t ''may I stick a knife in him'' but whether removing a tyrant counts
  as sedition at all, since sedition is defined by what it does to the unity of the
  people, not by who gets hurt. He gives you a clean answer: disturbing a tyrant isn''t
  sedition — and then he drops the hinge, ''unless the disturbance does the people
  more harm than the tyrant did'', and lands the reversal that the tyrant is the actual
  seditionist, since keeping a population at each other''s throats is how he stays
  on top.


  So: a sonnet. Octave for the clean answer (tyranny is aimed at the ruler''s private
  good, the people''s unity is the thing that counts, so the knife isn''t sedition),
  the volta exactly at that ''unless'', and the closing couplet for the reversal —
  the tyrant as the one who sows the discord. If the form isn''t doing that work,
  it''s just verse. Commit to a reading rather than hedging between them: I''d rather
  have a poem that clearly takes the ''unless'' as a real condition on action than
  one that wobbles. And stick a short note under it — four or five lines — saying
  where the poem takes liberties with his argument or leans on a contested reading
  of it, so I know what I''m defending if a medievalist writes in. British spelling
  please, and don''t make it sound like a sermon."


