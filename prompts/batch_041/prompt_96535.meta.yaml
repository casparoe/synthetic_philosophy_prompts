  Design of the fake study (injected material):


  "Two dots: first flash red at upper-left, second flash green at lower-right, 90
  ms apart. Subjects report the dot moves and turns green about halfway. Now the twist:
  in the ''load'' condition, subjects simultaneously hold a 4-digit number in memory
  (or do a concurrent tone-counting task); in the ''clean'' condition they don''t.
  The authors also add a ''midpoint probe'': at 45 ms after the first flash, a brief
  neutral gray ring flashes around the midpoint of the path, and subjects are asked,
  at the end, whether the dot was red or green at the instant the ring appeared. Result:
  in the clean condition, ~80% say ''red'' at the ring, but they still report the
  change happening roughly at the midpoint. Under load, the proportion saying ''red''
  drops to ~50% and the reported change point drifts later, while the overall motion
  report is unaffected. Authors conclude: the ''red'' content at the midpoint was
  genuinely experienced and then overwritten (Orwellian), since a concurrent load
  that leaves motion processing intact selectively degrades the *preservation* of
  the earlier content; a Stalinesque system, which never formed the earlier content,
  would show no such selective degradation."


