  ---


  I am preparing a graduate seminar on Aristotle''s account of life and its bearing
  on contemporary borderline cases, and I need help with a passage that I have come
  to think is much harder than it looks. Please act as a philosopher with expertise
  in ancient philosophy and philosophy of biology. Think carefully, and begin by brainstorming
  the range of plausible readings before you commit to one.


  Here is the passage, from Aristotle''s On the Soul, Book II, chapter 1:


  "That is why the soul is the first grade of actuality of a natural body having life
  potentially in it. The body so described is a body which is organized. ... If, then,
  we have to give a general formula applicable to all kinds of soul, we must describe
  it as the first grade of actuality of a natural organized body. That is why we can
  wholly dismiss as unnecessary the question whether the soul and the body are one:
  it is as meaningless as to ask whether the wax and the shape given to it by the
  stamp are one, or generally the matter of a thing and that of which it is the matter."


  What I am trying to understand is how the distinction between first and second actuality
  is supposed to do work in the definition of life. In my seminar I have been using
  a distinction between what I call the reservoir reading and the exercise reading
  of "having life potentially." On the reservoir reading, a thing can be alive in
  the relevant sense merely by retaining the organized capacity for life, even if
  no vital activity is occurring. On the exercise reading, the capacity must be grounded
  in some ongoing vital activity or function; otherwise the thing is only potentially
  alive in a weaker sense. I want to know which reading the passage supports, and
  why.


  The cases that have been causing trouble are ones involving suspended life: a tardigrade
  in the tun state, in which metabolism drops to undetectable levels and the organism
  persists in a desiccated, apparently inert form; a brine shrimp cyst; a frozen embryo;
  a virus outside a host; a prion; a mitochondrion; and a self-replicating computer
  program. Some of my students think Aristotle''s framework clearly counts the dormant
  organisms as alive because they retain the first actuality, while others think it
  counts them as not alive because they are not exercising any vital function. I need
