  I am setting the final examination for an upper-level undergraduate course on scepticism
  and the self, and I need a single essay question, together with a model answer and
  a marking scheme.


  The course is built around a two-axis taxonomy of dream-sceptical doubts which I
  give the students in the lecture and which they are expected to apply rather than
  recite:


  Object of doubt.

  (a) World-doubt: I do not know whether the world I seem to perceive exists at all.

  (b) State-doubt: I do not know whether I am now dreaming rather than waking.

  (c) Author-doubt: I do not know whether I am the dreamer or something dreamt — whether
  my apparent agency, including the very act of asking the question, is original or
  derivative.


  Recoverability. A doubt is recoverable if some experience available from within
  the doubtful condition would settle it (waking up settles state-doubt, or at least
  appears to); it is unrecoverable if every experience available from within the doubtful
  condition is equally compatible with both answers, so that no course of experience
  could settle it. Students should note that recoverability is a property of the doubt,
  not of the doubter''s confidence.


  The question must be built on Zhuangzi''s butterfly passage: the anecdote in which
  Zhuangzi cannot tell whether he is Zhuangzi who has just dreamt he was a butterfly,
  or a butterfly now dreaming that it is Zhuangzi. I do not want students to quote
  or cite anything, and I do not want the question to turn on scholarly interpretation;
  the taxonomy above is the whole apparatus they need. The question should nevertheless
  require them to do more than narrate the anecdote or run the familiar comparison
  with Descartes''s dream argument.


  Specifically, the question should require students to:

  (i) place the passage''s doubt in the taxonomy and defend that placement against
  at least one rival placement, in particular against the textbook placement as state-doubt;

  (ii) say whether the doubt, so placed, is recoverable, and what in the passage bears
  on that;

  (iii) argue whether a doubt of that kind is scepticism at all, or whether it instead
  dissolves the question it appears to raise — for instance by treating the two states
  as transformations of one another rather than as competing candidates for reality,
  as the passage arguably does when it ends by insisting that the two must after all
  be distinguished and by naming the situation a transformation of things rather than
  an error to be corrected;

  (iv) confront the objection that the reading reached in (iii) is not scepticism
  but a dogmatic metaphysics of transformation, and say what the reading would have
  to concede to survive that objection.


  Please write:


