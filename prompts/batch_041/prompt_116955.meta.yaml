  I am a software engineer by training, and for the past two years I have sat on the
  governance committee of the professional association I have belonged to since graduate
  school. It is a nonprofit with roughly forty thousand members, a nine-member elected
  board, and a bylaws amendment process that allows members to petition for changes.
