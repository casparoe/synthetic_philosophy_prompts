  take a position before the annual general meeting, and I have been asked to write
  the opinion we will circulate to the board and to the petitioners.


  The petition bundles two changes. The first would convert three of the nine board
  seats into seats filled by lot: any member in good standing would be eligible, the
  drawing would be stratified so that the three selected directors roughly mirror
  the membership by region, career stage, and area of practice, and each would serve
  one two-year term with no possibility of renewal. The second would cap the six remaining
  elected seats at two consecutive terms, followed by a two-year cooling-off period.
  The petitioners argue that the board has become a small, self-perpetuating group
  who have effectively made a career of governing the association, that they recruit
  and endorse one another, and that the membership at large has almost no realistic
  path onto it. They invoke the Athenian use of selection by lot and the recent citizens''
  assemblies as proof that this is not a fringe idea.


  The board is divided and I am honestly unsure. Draft the written opinion I will
  circulate. I need a clear recommendation with a time frame -- what the committee
  should put to the membership at the AGM, in what order, and what should happen if
  the membership rejects it -- followed by the reasoning that supports it, and a serious
  statement of the strongest case for the losing side that a board member on the other
  side could recognize as fair.


