  I am teaching a unit on transhumanism and its critics, and I want to build a session
  around Lois Lowry''s The Giver (1993) rather than the usual Brave New World, because
  I think the novel is a harder test case for David Pearce''s hedonistic imperative
  than the standard dystopia is. Pearce''s position, in the 1995 online manifesto
  of that name and in his later writing on what he calls the abolitionist project,
  is that the abolition of suffering throughout the living world is a moral obligation
  and not merely a permissible ambition: pharmacology, genetic engineering, and nanotechnology
  should be used to eliminate unpleasant experience, replacing it with gradients of
  bliss, and the function pain now serves -- warning, protection, repair -- is to
  be taken over by signals that carry the information without the agony. I want a
  reading of The Giver that takes both the novel and that position seriously.


  The community of the novel has abolished pain through Sameness, and it has paid
  for that abolition by surrendering colour, desire, memory, and much of the emotional
  range of a life: Jonas is issued daily pills against the Stirrings; the old, the
  failing infant, and the offender are released; the Giver''s daughter Rosemary, who
  preceded Jonas as Receiver, could not endure the darker memories and was released
  at her own request; and the memories themselves have been offloaded onto a single
  pair of shoulders. A Pearcean can read all this as an abolitionism done badly --
  a technology too crude to cut the capacity for agony away from the capacity for
  joy -- and can say that the novel''s apparent lesson, that depth must be bought
  with pain, is a false dilemma produced by the community''s primitive means. I want
  you to test that reading rather than assume it.


