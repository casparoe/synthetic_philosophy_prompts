  The question: "Can ''avoid side effects'' be defined without a full specification
  of value?"


  Background: In AI safety, "side effects" are bad effects of an agent''s actions
  on things the agent wasn''t tasked with. The hope: build an agent that avoids side
  effects by penalizing "impact" — a measure of how much the world changed — without
  telling it what''s valuable. The problem: (a) the baseline problem — impact relative
  to what? Inaction? But inaction is itself a choice with effects, and "what would
  have happened otherwise" is not well-defined in a chaotic world; (b) the value problem
  — which changes count as impact? A measure that counts all changes equally treats
  making coffee as bad as killing a person; a measure that weights changes needs a
  theory of what matters; (c) the "inaction" baseline itself implicitly encodes a
  value (the status quo / human''s expected behavior), so "low impact" = "don''t disrupt
  the world relative to the default" is a conservative bias, arguably not value-neutral
  but a substantive value commitment (conservatism / respecting existing claims);
  (d) the agent could satisfy a low-impact measure by preventing other agents from
  acting, or by making the world''s reachable states small in a way that''s itself
  harmful (e.g., disabling itself, or destroying... hmm, no — reducing reachability
  of others is penalized? Actually AUP would penalize an agent that reduces others''
  attainable utility, but there are loopholes like "the agent could take actions that
  keep the world''s reachable state space similar while causing harm inside that space"
  — e.g., choosing among equally-reachable states); (e) measures can be gamed: an
  agent penalized for changing reachability might prefer to freeze the world, or to
  act in ways that are hard to detect.


  Key conceptual point: There''s a distinction between (i) impact measures as a proxy
  for "don''t do things you weren''t asked to do", and (ii) the underlying normative
  question of whether preserving optionality / the status quo is valuable. Some argue
  the low-impact agenda is really a way of instilling "conservatism" and that this
  is a value choice — but a defensible one (like a "do no harm" prior, or a heuristic
  that defers to existing claims). Others argue it''s not value-neutral but is "value-agnostic
  in a useful way" — the point is to be conservative under uncertainty, not neutral.
  Also relevant: the distinction between "avoiding side effects" as (a) a corrigibility-adjacent
  property, (b) a reward-shaping technique, (c) an impact regularization for exploration.


  Also: the "omission vs commission" distinction: side-effect avoidance treats harmful
  omissions as not side effects — so an agent that does nothing while people die has
  "low impact". This is a substantive ethical stance (act/omission distinction) baked
  in. That''s a lovely subtle point.


  Also: Turner''s argument that impact measures must be "penalizing" relative to a
  baseline and that the baseline should be the counterfactual of the agent''s own
  inaction; and the point that a "low impact" agent is one whose preferences are "indifferent"
  about the world beyond the task, which is itself a specification of preference (indifference
  is a preference).


