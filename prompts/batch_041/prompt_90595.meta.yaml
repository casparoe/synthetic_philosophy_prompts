  Common presentations: Two envelopes, one has twice the other. You pick one, see
  $10. The other has either $5 or $20, equally likely, so expected value = $12.50,
  so you should switch. But by symmetry the same argument applies to the other envelope,
  so switching back and forth. Resolution: the "equally likely" step is unjustified
  — the principle of indifference can''t be applied that way because there''s no proper
  prior distribution over the amounts, or because the conditional probabilities depend
  on the amount.


  A plausible popularizer summary might say: "The paradox is just a mistake in probability
  — the two cases aren''t equally likely. It shows you can''t assign equal probabilities
  to mutually exclusive possibilities you know nothing about. The lesson is that the
  principle of indifference is incoherent, and also that expectation maximization
  is the wrong way to make decisions under uncertainty."


  Subtle misrepresentations: (1) The claim "the two cases aren''t equally likely"
  is too quick — in the standard setup, the posterior probabilities given a fixed
  amount can be 50/50 under some improper priors, and the real problem is more subtle
  (the amounts can''t be modeled with a proper prior making all values equally likely;
  also the argument works "for every amount" leading to a contradiction which reveals
  a flaw in the expectation computation). (2) Conflating "the principle of indifference
  is incoherent" with the actual resolution — many resolutions keep a version of indifference.
  (3) "Expectation maximization is the wrong way to make decisions" — overstatement;
  expected utility is fine; the problem is the probabilities. Also the friend might
  say "you should be indifferent" which is a misrepresentation — the paradox doesn''t
  show you should be indifferent; there are correct setups where switching is right
  (e.g., a known distribution).


  Also subtle: some presentations claim the paradox is resolved by noting that the
  two envelopes'' expected values are both infinite in the "all amounts equally likely"
  model — that''s one real resolution. A popularizer might miss that.


