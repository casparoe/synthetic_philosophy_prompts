  Löb''s theorem: If PA ⊢ (Prov(⌜A⌝) → A) then PA ⊢ A. So the "reflection schema"
  Prov(A) → A, if added as an axiom schema to PA, makes the theory prove A for every
  A — including ⊥. So the theory becomes inconsistent (or rather, PA + reflection
  schema proves everything; it''s inconsistent if it can prove ⊥). Hence an agent
  that trusts itself completely — accepting "if I prove A, then A" — is either unsound
  or inconsistent. This is the Löbian obstacle for self-trusting agents, relevant
  to "stable self-modification" / Vingean reflection.


