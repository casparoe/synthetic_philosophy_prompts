  ---


  Design a 75-minute session for an upper-level undergraduate seminar in moral philosophy,
  about sixteen students, who have already encountered the general distinction between
  an act''s being wrong and a person''s being entitled to hold someone answerable
  for it. The session should be a role-play that makes the students feel the force
  of the standing objection — the reply that does not deny the accusation but denies
  the accuser''s authority to make it — and then feel the counter-pressure, that this
  objection looks like a device by which wrongdoers exempt themselves by turning the
  tables on those who complain. The point must be carried by the mechanics, not by
  the facilitator''s framing: arrange the roles, the private information, and the
  incentives so that participants generate the objection themselves, exploit it, and
  only afterwards see what they have done.


  Build the activity around a fictional residential cooperative of about eight members
  with a shared budget and shared chores, and a standing grievance procedure. Each
  participant gets a public role (chair, treasurer, gardener, and so on), a sealed
  private history listing two or three things that person has themselves done which
  resemble the very complaints that will arise, three standing tokens, and a secret
  objective (protect an ally, keep the peace, have a particular member censured, never
  be found to have no standing). To lodge a complaint, a member spends a token; before
  the merits of the complaint are heard, any member may spend a token to raise a standing
  objection, which the room resolves by a vote on whether the complainant''s history
  disqualifies them; if the objection succeeds, the complaint is dismissed with no
  finding at all on the conduct. A member found to lack standing forfeits all tokens,
  and tokens may be given to another member — which forces the question whether a
  discredited member may have a clean-handed proxy complain on their behalf. Specify
  the full cast, the sequence of play, the materials the facilitator must print (role
  cards, sealed histories, tokens, a tally sheet), a scoring scheme that needs no
  money, and a minute-by-minute timeline.


  Then write the debrief, mapping particular moments of play onto the parts of the
  idea: the difference between a complaint''s being warranted and its being one the
  complainant has standing to make; the several grounds on which standing is said
  to be lost (hypocrisy, complicity in the same wrong, complaining about a wrong that
  is not one''s business); whether the hypocrite''s blame is false, or true but unwarranted,
  or warranted but merely unwelcome; whether standing is forfeited permanently, recoverable,
  or transferable at all; and the suggestion that what is objectionable about hypocrisy
  is not the falsity of the accusation but a failure of moral equality between blamer
  and blamed. Be explicit about what the activity cannot reproduce — for instance,
  the history and vulnerability of a real relationship between two people, and the
  possibility that a complaint may be entirely true and yet legitimately dismissed
  — and tell the facilitator what to supply instead. Finally, state what will predictably
  go wrong the first time the session is run — for example, that the group votes to
  strip almost everyone of standing and the procedure deadlocks, that tokens are exhausted
  in the first round, that the vote becomes a popularity contest, or that one participant
  dominates the floor — and how the facilitator should handle each case.


