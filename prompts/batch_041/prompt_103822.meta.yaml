  Rose''s Twelve Angry Men — the 1957 film, though I gather the script began life
  as a television play — and the apparatus I want to bring to it is judgment aggregation:
  the family of results built on the observation that a group can be impeccably democratic
  in the way it votes on each of several logically connected propositions and still
  arrive at a combination of judgments that no member of the group holds, the pattern
  usually called the discursive dilemma or the doctrinal paradox. I am comfortable
  with the formalism: individual yes/no judgments on propositions that stand in entailment
  relations, an aggregation rule, and the standard contrast between a premise-based
  procedure, in which the group votes on the reasons and derives the verdict, and
  a conclusion-based procedure, in which it votes on the verdict and lets the reasons
  fall where they may, along with the impossibility results that say you cannot have
  a rule that is simultaneously consistent, responsive to individual judgments, and
  immune to dictatorship.


  What I want from you is a reading of the film in that light — and, just as importantly,
  a reading of that light in the light of the film. Begin by laying out, as carefully
  as you can, what the jury is actually aggregating and what its rule is, given that
  a criminal jury is not a majority-rule body but a unanimity-rule one; I want to
  know whether the discursive dilemma survives the change of rule, or whether it merely
  changes costume, and whether the film''s movement from an initial vote on the verdict
  to a prolonged argument about the pieces of evidence is a shift from a conclusion-based
  to a premise-based procedure or the reverse. Then work through the film as evidence
  about the theory. Which of its turns does judgment aggregation explain well — the
  knife, the old man''s limp, the marks on the woman''s nose, the fact that a juror
  who wants to get to a baseball game is voting with the same weight as a juror who
  has reconstructed the stabbing? Which features does the theory misdescribe or simply
