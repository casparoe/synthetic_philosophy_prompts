  line is really where I have put it or somewhere else — for instance a hidden disagreement
  about personal identity and the same-people assumption, about whether reasons must
  be person-affecting, about whether the relevant cases differ only in population
  size or also in which people exist, or about whether our intuitions here are jointly
  inconsistent, so that the question is ill-posed rather than merely hard. Then say
  what would count as progress given your diagnosis — a formal result, a distinction,
  a change of question — or argue that none should be expected, and why. I am not
  looking for a survey of positions or a reading list; I want the structure of the
  disagreement and an honest verdict on whether it can be moved.


  ---


