  ---


  I am taking a third-year seminar in population ethics, and the unit on whether a
  larger population is better has left me more interested in why the debate will not
  close than in which side is right. The seminar runs the familiar circuit: a totalist
  holds that, other things equal, a world with more people whose lives are worth living
  is better, and a pronatalist classmate pushes this to the claim that adding good
  lives is always an improvement; against them stand a critical-level view and a person-affecting
  view that refuse to accept that a huge population of barely-worth-living lives is
  better than a smaller flourishing one. The arguments on each side are old, both
  sides understand the other''s moves, and nobody in the room has shifted in a term.
  I want a diagnosis of the impasse rather than a verdict on it.


  My hypothesis, offered as a hypothesis, is that the two camps are not really disputing
  how much to value additional lives but disagreeing about what kind of object betterness
  is being asked to be. I have started calling the two demands the ranking requirement
  and the comparison requirement. The ranking requirement says an adequate axiology
  must deliver a single context-independent ordering of outcomes — a total order —
  and that any failure of transitivity or completeness is a reductio. The comparison
  requirement asks for less: a family of pairwise judgments, each compelling where
  it is made, that need not compose into one global ranking, so that ''this world
  is better than that one'' can be true as a comparison while no overall ordering
  exists to make it true. If that is the real fault line, then the Repugnant Conclusion
  is only a reductio for one side, and the long stall is a disagreement about the
  standards an axiology must meet rather than about the value of people.


