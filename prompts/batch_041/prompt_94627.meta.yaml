  Argument:

  (1) To blame someone for an act is to hold that they ought to have done otherwise.

  (2) "Ought" implies "can": you can only be obligated to do what you were able to
  do.

  (3) Whether someone was able to do otherwise depends on what was within their reach
  given their circumstances — including what they could have known.

  (4) Nobody can be expected to know what their entire society has not yet articulated;
  the conceptual resources for moral criticism are social achievements, not individual
  ones.

  (5) Jefferson''s (or Columbus''s) society had not articulated the wrongness of X.
  So it wasn''t within his reach.

  (6) Therefore he couldn''t have done otherwise, so he isn''t blameable.

  (7) But the same reasoning applies to us with respect to our descendants: whatever
  we''re doing now that they''ll condemn, we can''t be blamed for, since the criticism
  isn''t yet articulated.

  (8) So moral criticism of anyone, past or present, is never warranted... which is
  absurd.


  Where does it go wrong? The flaw candidates: (4) is false as stated — plenty of
  criticism was articulated in the past (abolitionists existed; Bartolomé de las Casas;
  Quakers). Also there''s a slide between "society hasn''t articulated" and "the individual
  couldn''t access the criticism" — even if a view isn''t the consensus, an individual
  can be in a position to reach it. Also (5) is empirically false in the specific
  cases. Also (2) "ought implies can" is applied to a coarse-grained "can": we should
  distinguish "could have done otherwise" in the sense of "could have known better"
  vs "could have acted better given what he knew."


