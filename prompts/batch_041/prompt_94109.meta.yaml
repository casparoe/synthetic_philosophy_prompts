  I''m preparing the opening session of a graduate seminar on the Chinese Room, and
  I''ve decided to spend it on the specification rather than the verdict. Before the
  class argues about whether the thought experiment refutes the claim that implementing
  the right program suffices for understanding a language, I want a shared list of
  what a theory of linguistic understanding would have to deliver in order to be entitled
  to settle the case at all. Please write me that list of desiderata. For each item
  I want the requirement stated sharply, the consideration or case that motivates
  it, and a note on whether it is genuinely non-negotiable or merely a preference
  of one camp. The cases I''d like the list to be answerable to are at least these:
  the man in the room working from a rule book; the room taken as a whole, including
  the rule book, the paper, and the man; the man who has memorized the rule book and
  now does everything himself, with no room left; a system whose entire input-output
  disposition over Chinese is stored as an enormous lookup table rather than computed
  step by step, so that its behaviour is a program only in a degenerate sense; the
  nation-scale version in which the room''s work is done by many people passing slips
  of paper; an ordinary bilingual speaker; a monolingual English speaker fitted with
  an implant that lets her produce and comprehend Chinese; and something at the low
  end, a thermostat or a chess engine, which we are reluctant to credit with understanding
  anything. The distinctions the list must respect seem to me to include at least:
  simulating understanding versus duplicating it; syntax versus semantics; understanding
  a language versus being disposed to produce acceptable responses in it; understanding
  as a graded matter versus understanding as a threshold; understanding versus consciousness
  or experience; and the question of the level at which understanding is predicated,
  since the man may be said to understand nothing while the room is said to understand
  Chinese, and something has to govern whether that is a legitimate shift or an evasion.
  It also should not require the theory to contradict things we are fairly confident
  of, for instance that brains are physical systems whose behaviour is in some coarse
  sense describable by a formal procedure, and that our ordinary attributions of understanding
  to other people rest on behavioural and functional evidence and are defeasible.


  What I most want from the exercise is the tension structure. If some subset of the
  requirements cannot be jointly satisfied -- I suspect, for instance, that a principle
  forbidding understanding to arise out of parts that themselves understand nothing
  sits badly with our willingness to credit brains, whose parts presumably understand
  nothing, with understanding -- then say which subset, and say what each party to
  the debate has to give up. Also tell me which single requirement does the most to
  exclude the largest number of the familiar positions, and why it has that power.
  I would like the list ordered roughly by how much work each item does, and I would
  rather have eight or ten well-motivated requirements than a long undifferentiated
  inventory. Skip the scorecard of who wins; the point of the session is to have the
  criteria in hand before we read anyone''s answer.


