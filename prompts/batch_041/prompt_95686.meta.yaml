  Exam question:

  "In Reasons and Persons, Parfit introduces the nonidentity problem. Using his example
  of a woman who can either conceive a child now or wait until she is older, explain
  the nonidentity problem. What does it show about the person-affecting restriction?
  Does it commit us to the repugnant conclusion? Defend your answer."


  Student answer:

  "Parfit''s nonidentity problem is about how our actions affect the identity of future
  people. In his example, a woman is considering whether to have a child now, when
  she is very young, or to wait until she is older. If she has the child now, the
  child will have a difficult life but still a life worth living. If she waits, she
  will have a different child, who will have a better life. The nonidentity problem
  is that the child born now cannot complain that she was harmed by being born now,
  because if her mother had waited, she would not exist at all. So the child is not
  worse off than she would have been; she is not worse off, because there is no alternative
  version of her that is better off. This challenges the person-affecting restriction,
  which says that an act is wrong only if it makes some person worse off than they
  would have been. Since no one is made worse off in the nonidentity case, the person-affecting
  restriction seems unable to explain why the woman''s choice to have a child now
  is wrong. Some philosophers think this shows we need an impersonal principle, like
  the total view, which says we should maximize total happiness regardless of who
  exists. Parfit argues that if we accept the total view, we get the repugnant conclusion:
  a world with a huge population of people whose lives are barely worth living is
  better than a world with a smaller population of very happy people. So the nonidentity
  problem ultimately forces us to accept the repugnant conclusion, unless we can find
  a better principle. I think the problem is real, but I''m not sure we have to accept
  the repugnant conclusion, because we could adopt a variable value view or a person-affecting
  view that includes future people."


