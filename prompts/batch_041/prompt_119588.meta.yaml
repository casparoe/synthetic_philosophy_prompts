  For several years I have convened a reading group on the origins of the Cold War,
  and we keep returning to the same question without ever settling it: who started
  it? The disagreement is not naive. One camp assigns primary responsibility to the
  Soviet Union -- a revolutionary state with a universalist ideology, an army in occupation
  of Eastern Europe, and a leadership that treated wartime agreements as instruments
  rather than constraints. A second camp assigns primary responsibility to the United
  States -- an economically expansionist power that held the atomic bomb before its
  rival, curtailed Lend-Lease, declined to treat Soviet security interests in Eastern
  Europe as legitimate, and defined its war aims in terms its adversary could only
  read as encirclement. A third participant, who is the reason I am writing, maintains
  that the question itself is defective: that ''starting'' a Cold War presupposes
  a single initiating act and a single responsible agent, whereas what we have is
  a process spanning a decade or more, in which both sides acted on fears that were,
  given their positions, intelligible, and in which the outcome was overdetermined
  by structure.


  My own hypothesis -- which I would like you to test rather than adopt -- is that
  the stalemate is not primarily a disagreement about the archive. It looks to me
  as though the participants are answering different questions under one heading,
  and that the apparent conflict over facts is being driven by two commitments that
  are seldom made explicit: a contested empirical claim about whether the Soviet system
  was fundamentally expansionist or fundamentally security-seeking (a claim the surviving
  evidence may underdetermine), and an unstated normative premise about what a great
  power is entitled to do within what it regards as its own sphere of influence.


  I want a diagnosis, not a verdict on the merits, and I want it earned from what
  the positions actually assert. Four distinctions seem to me to be doing hidden work,
  and I would like you to say whether that is right: temporal priority (which state
  moved first), causal contribution (which state''s actions did most to make the conflict
  likely), blameworthiness (which state was at fault), and avoidability (whether the
  conflict could have been averted by different choices). If these come apart -- and
  I suspect they do -- then a great deal of the dispute may be a verbal one about
  the word ''start'', or a set of distinct questions that have been fused. But I do
  not want that conclusion by default: if there is a genuine substantive disagreement
  underneath, about the character of the Soviet regime or about the weight to be given
  to structure as against intention, I want it identified and its evidential status
  assessed.


  So: tell me what kind of disagreement this is, whether the impasse is a sign that
  the question is ill-posed or merely hard, and what would count as progress. A distinction?
  A change of question -- from who started it to what made it likely, or to whether
  anyone could have stopped it? Or would progress require evidence, and if so, what
  would decisive evidence even look like -- what could a document say that would settle
  the matter, and is there any reason to think such a document could exist? Where
  you find that specialists agree, say so; where a reading is contested among people
  who know the material, present it as contested and not as the consensus. Flag your
  own uncertainty rather than resolving it by assertion.


