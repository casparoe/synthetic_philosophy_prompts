  Let me consider Nozick + speaker prep. Nozick''s tracking theory: S knows that p
  iff (1) p is true, (2) S believes p, (3) if p were false, S wouldn''t believe p,
  (4) if p were true, S would believe p. The "epistemic closure" failure: Nozick''s
  theory denies closure under known entailment. Objections: the "abominable conjunction"
  (I know I have hands but I don''t know I''m not a brain in a vat), Kripke''s objection
  about "tracking" being mischaracterized (the "red barn" / fake barn country), the
  "grandmother" counterexample (Nozick''s own example), the objection that the theory
  is a version of reliabilism that''s neither necessary nor sufficient, objections
  about the subjunctive conditionals being evaluated with a fixed method or not (method-relativity),
  objections about the "knows that p" vs "knows that p rather than q" distinction,
  and the "sensitivity vs. safety" debate.


