  of people — say, a diagnosis, or a personality type, or a learning style. Once it''s
  in circulation, the people it describes begin to see themselves in it and to act
  accordingly. Then the clinicians or researchers who maintain the category notice
  that the people they''re now seeing don''t quite match the original description,
  so they revise the description. The revised description changes how people understand
  themselves again, and so on. So the category and the people it applies to keep adjusting
  to each other, and there''s no point at which you could say the category is just
  "correctly" capturing what was there all along.


