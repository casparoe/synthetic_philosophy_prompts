  Draft:


  "For most of my career I have written software, and I have no formal training in
  philosophy or in the social sciences, so if what follows is a well-known idea wearing
  a name I do not know, I would rather be told so than humored. But I have been reading
  about psychiatric diagnosis and I keep noticing a pattern that I cannot find a single
  word for, and I would like to know whether the pattern has an established name,
  or whether it is really two patterns that people have bundled together.


  The pattern, as I see it, runs like this. A category is introduced to describe a
  group of people — a diagnosis, a personality type, a label like gifted or at risk.
  Once the category is in circulation, some of the people it picks out begin to understand
  themselves through it and to act in ways that fit it. Researchers and clinicians
  then notice that the people they are now seeing do not match the original description
  very well, so they revise the description. The revision changes how people understand
  themselves in turn, and the two keep adjusting to each other. There is no point
  at which the category can be said to have been simply correct about what was already
  there.


  I think I can see this happening in two rather different ways, and I cannot tell
  whether they are the same thing. In the first, the people take up the label: they
  read about it, recognize themselves in it, join communities organized around it,
  and their behavior and self-description shift accordingly. In the second, the people
  never adopt the label at all. Something else does the work: a school places a child
  in a special track on the strength of a category, the placement changes what the
  child learns and how teachers treat her, and the resulting outcomes are then fed
  back into the data that justify the category. Here the loop seems to run entirely
  through institutions, without the labeled person''s cooperation or even awareness.


  Some comparisons have occurred to me, and none of them quite fits. This is not simply
  a self-fulfilling prophecy: a self-fulfilling prophecy makes a prediction come true,
  whereas here nothing becomes true so much as the description and the described drift
  together, and the drift need not stop. It is not people gaming a metric in the way
  Goodhart''s law describes, because what changes is not only conduct but self-understanding,
  and in the second case above not even that. And it is not the observer effect of
  physics, because the things being observed can read the description of themselves
  and respond to it.


  So: is there a name for this, and is there a body of work behind it? I would particularly
  like to know three things. First, whether the two directions I described — the category
  shaping the people and the people reshaping the category — are usually treated as
  one phenomenon or as two. Second, what exactly makes a category capable of being
  affected by its own application, as opposed to categories like having a fractured
  tibia or being allergic to penicillin, which seem immune to it. Third, whether the
  phenomenon is thought to belong specifically to human beings, or whether it extends
  to anything that can be described and then represent itself under the description.
  The third matters to me because I believe I see something similar in my own field,
  where categories such as technical debt or microservice seem to reshape the very
