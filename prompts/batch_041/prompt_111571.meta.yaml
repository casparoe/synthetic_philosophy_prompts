  Possible prompt:


  I am trying to work through a difficult passage in Aristotle''s Metaphysics, Book
  VII, Part 3, and I would like help understanding how it bears on the contemporary
  problem of the statue and the clay. The passage reads:


  "The word ''substance'' is applied, if not in more senses, still at least to four
  main objects; for both the essence and the universal and the genus, are thought
  to be the substance of each thing, and fourthly the substratum. Now the substratum
  is that of which everything else is predicated, while it is itself not predicated
  of anything else. And so we must first determine the nature of this; for that which
  underlies a thing primarily is thought to be in the truest sense its substance.
  And in one sense matter is said to be of the nature of substratum, in another, shape,
  and in a third, the compound of these. (By the matter I mean, for instance, the
  bronze, by the shape the pattern of its form, and by the compound of these the statue,
  the concrete whole.)"


  The statue/clay puzzle, as I understand it, is this: a statue and the lump of clay
  that constitutes it appear to occupy the same place and to be composed of the same
  material parts, yet they seem to have different persistence conditions. If the statue
  is smashed, the lump of clay survives (it is merely rearranged), whereas the statue
  does not. So either they are not identical, despite sharing all their parts, or
  identity is not sufficient for sharing persistence conditions, or one of our descriptions
  is not really of a distinct object. Contemporary metaphysicians often try to resolve
  this by distinguishing constitution from identity: the clay constitutes the statue
  without being identical to it.


  My difficulty is that Aristotle''s passage seems to introduce a threefold distinction—matter,
  shape, and the compound—rather than a twofold distinction between a constituted
  object and its constituting matter. I want to know how to read the passage in light
  of the statue/clay puzzle. Specifically:


  1. When Aristotle says that the bronze is the matter and the statue is the compound
  of matter and form, is he committed to saying that the bronze and the statue are
  numerically distinct? Or is the bronze not a countable object in the relevant sense,
  so that the puzzle does not arise?

  2. If the bronze is the matter and the statue is the compound, what happens to the
  compound when the statue is melted down? Does the compound cease to exist while
  the bronze persists? If so, is the compound a substance in the same sense as the
  bronze, or in a different sense?

  3. A colleague has suggested to me that Aristotle''s account anticipates the contemporary
  distinction between composition and constitution: the bronze is not a proper part
  of the statue, but a portion of matter that constitutes it, and constitution is
  asymmetric and non-identical. Is that reading supported by the passage, or does
  Aristotle''s talk of a "compound" resist it? I am especially interested in whether
  the passage gives us any reason to think that the statue and the clay are not two
  things but one thing under two descriptions, or whether it instead multiplies entities.


  I would appreciate a careful reading of the passage that helps me see how the matter/form/compound
  distinction is supposed to work, and how far it can be mapped onto the modern debate
  without anachronism. Please avoid giving me a bibliography or reading list; I am
  interested in the conceptual reconstruction.


