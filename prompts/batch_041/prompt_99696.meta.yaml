  Specs:

  (a) The category starts out heterogeneous: the initial group picked out by the criteria
  has two distinct presentations, so the category has low reliability and weak predictive
  validity early on.

  (b) Over time, clinicians and patients converge on the dominant presentation: patients
  learn the checklist''s expected script and report accordingly; clinicians notice
  and document the scripted features more; training materials and intake forms harden
  the script. The loop runs through the paperwork and the scoring instrument, not
  just through patients'' self-understanding.

  (c) After the loop, standard psychometric checks improve: inter-rater reliability,
  test-retest stability, and predictive validity for treatment response all rise;
  yet the category''s extension has shifted so much that a case meeting the original
  criteria from twenty years ago would no longer be diagnosed.

  (d) A break test: a cohort exists that is subject to the same underlying condition
  but never exposed to the label or the instrument (e.g., a population where the diagnostic
  label isn''t used and the intake form differs). The natural-kind view predicts the
  same reliability and predictive success in that cohort; Hacking''s view predicts
  the category''s success vanishes or takes a different shape there.

  (e) No stipulating verdicts: the case must make each view''s verdict follow from
  the mechanism.


