  For the past eight months I have sat on the bylaws committee of the housing cooperative
  where I live, and in that time I have watched a pattern recur that I cannot find
  a name for. I would like to know whether it is a recognized phenomenon, and if it
  is not, I would like it named and bounded.


  The pattern runs roughly as follows. A standing rule becomes inconvenient. Someone
  moves to amend it. Someone else points out that the rule governing amendments is
  itself shielded — changeable only by a two-thirds vote, or only at the annual meeting,
  or not while a dispute is pending. Fine, someone proposes amending that rule first;
  but the shield was itself adopted under the earlier, unshielded procedure, the minutes
  from that year are lost, and no one can say by what authority it now binds us. Over
  the decades the committee has accumulated a sediment of such shields, each one adopted
  by whatever procedure was then in force. The result is a body that can now change
  almost nothing, though at no point did anyone act improperly, and at no point was
  anything logically impossible. The binding happened one defensible step at a time,
  and there is no founding moment to point to: the same body is author and subject
  at every step.


  A second, mirror-image case from the same committee: we once briefly had a rule
  that any rule, including itself, could be amended by simple majority. The question
  then arose what made the current text the operative one rather than the one before
  it, and the answer seemed to be only that we had all agreed to treat it so. That
  answer felt like cheating, but I could not say why.


  I am not asking only for a label. I want to know what exactly the phenomenon is.
