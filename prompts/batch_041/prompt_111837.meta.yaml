  Draft:


  "I have no background in philosophy — I read about these things on my own, mostly
  late at night — and for the last several months a friend and I have been going in
  circles about the lamp puzzle (the one usually called Thomson''s lamp), where a
  lamp is switched on and off at 1/2, 3/4, 7/8, ... of a minute and we ask about its
  state at the one-minute mark. My friend is convinced the puzzle proves that so-called
  supertasks are impossible: any setup in which infinitely many operations are completed
  in a finite time, she says, must end in contradiction, and the lamp is the proof,
  since it cannot be either on or off. I think the lamp is not a contradiction but
  an underdetermined case: the setup simply never says what happens at the minute
  mark, and we wrongly assume the state at that instant must be the limit of the states
  before it. We have both gotten better at defending our own side and no better at
  understanding the other''s.


  I want the document we should have written together instead: a joint statement we
  could both sign. Please draft it with:


  1. A numbered list of agreed claims — what the setup does and does not specify,
  what the mathematics does and does not license, what would count as a contradiction
  versus what would count as a gap, and anything both of us should concede about our
  own side''s weaker points.


  2. A disagreements table. For each row: the point at issue in wording that neither
  of us would object to; the precise version of each side''s position, written so
  that the side in question would accept the wording as its own; the crux underneath
  it; and the case, argument or thought experiment that both sides would accept as
  bearing on that crux, with each side''s prediction about it recorded in advance.


  Three cases of my own that I would like the document to take seriously, because
  they are where my friend and I actually get stuck: (a) a dial that turns through
  half the remaining angle to vertical at each stage, so that it seems to settle at
  vertical even though infinitely many turns happen; (b) a printer that records the
  lamp''s state after every flip, so that at the minute mark the record is an endless
  alternating string with no last entry; and (c) a lamp with a switch that takes a
  nonzero time to throw, or a sensor with a finite response time, which cannot keep
  up. Also: if any part of our disagreement is only about words — what ''possible''
  or ''determined'' is being asked to do — say so explicitly and say which part.


  Please be careful to separate what is settled from what is genuinely contested among
  people who know this material, and not to present a contested position as if it
  were the consensus; where you cannot tell which side a point favours, say so. End
  the document with a single final line of the form \answer{...} enclosing, in a few
  words, the one sub-question that both sides would agree is decisive."


