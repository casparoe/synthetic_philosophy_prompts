  Prompt:


  I am trying to adjudicate a disagreement that keeps splitting along national lines:
  whether the Scandinavian disposition to trust government is a rational accomplishment
  or a fortunate equilibrium, and whether the American disposition to suspect it is
  a civic virtue or a failure of nerve. I do not want a verdict yet. I want the specification
  that any verdict would have to satisfy.


  Write the desiderata: the requirements that any adequate theory of the reasonableness
  of political trust must meet in order to be entitled to say that one of these attitudes
  is more reasonable than the other. For each requirement, give the case, phenomenon,
  or consideration that motivates it; mark which requirements are non-negotiable and
  which merely reflect the commitments of a particular camp; and flag any pair that
  you suspect cannot be jointly satisfied. That last part is what I most want to see.


  Build the list so that it is not vacuous, and in particular make it able to handle
  the following, each of which I take to be a constraint on the theory rather than
  an optional extra:


  1. The object of trust is an institution, not a person, and institutions have no
  single will, no face, and no capacity for the kind of reciprocal regard that personal
  trust presupposes. The theory must say what trust in such an object even is, without
  collapsing it into prediction or into approval.


  2. Trust and reliance must be kept apart. A citizen may reliably predict that the
  tax authority will process a return while not trusting it in any sense that could
  be betrayed, and may trust an institution whose behaviour he cannot predict at all.
  The theory must locate the difference and say why it matters for reasonableness.


  3. Trust is dimensionally uneven. The same institution may be rationally trusted
  for competence, distrusted for goodwill, and trusted again for procedural fairness,
  and citizens may be right to hold all three attitudes at once. A theory that treats
  trust as a single scalar fails here.


  4. Trust is not evenly distributed across institutions within a single polity, and
  the Scandinavian pattern is not uniform trust but a specific profile: high trust
  in some agencies, suspicion of others, and a great deal of trust that is really
  trust in other citizens as mediated by the state. The theory must be able to decompose
  a national attitude into its parts.


  5. Reasonableness must be assessable without the assessor knowing the answer in
  advance. If the theory can only certify trust after the trusted institution has
  proved trustworthy, it has not said anything about whether trust was reasonable
  when it was extended, and it cannot handle the bootstrapping problem: suspicion
  can be self-fulfilling, and so can trust.


  Now a case that I think does the most work, and that I have not seen discussed in
  these terms. Consider a small, homogeneous, high-trust polity -- call it Nordia
  -- in which the observed trust is sustained less by institutional performance than
  by mutual monitoring and social sanction: citizens trust the state partly because
  they trust each other to punish defection, and the state''s good behaviour is itself
  a by-product of that mutual surveillance. Nordia looks, from the outside, exactly
  like a society whose institutions have earned their trust. Is the Nordian attitude
  reasonable? What does your list of desiderata force you to say, and does any requirement
  have to be relaxed to say it?


