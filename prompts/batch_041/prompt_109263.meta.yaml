  will keep producing better and broader capabilities), a protective belt of architectural
  tricks, optimizers, prompting methods, RLHF, chain-of-thought, etc., and a positive
  heuristic that says "scale first, hand-engineer later" -- the thing people sometimes
  call the bitter lesson. The negative heuristic is basically "don''t go back to symbol
  manipulation." The critics in our group say it''s degenerating: every failure gets
  explained away by "we just need more scale or more data," every success is announced
  after the fact, and the programme never predicts in advance which capabilities will
  emerge. The defenders say no, it''s progressive because it keeps predicting new
  capabilities and keeps surviving attempted refutations.


