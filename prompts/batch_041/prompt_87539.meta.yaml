  at a time are consistent... actually for a fixed pair at fixed times the preference
  order is transitive; but it does violate stationarity/dynamic consistency). Good
  detail: a common false presupposition is that hyperbolic discounting implies that
  people''s preferences are intransitive or "irrational" in the sense of violating
  expected utility — but hyperbolic discounting per se is about stationarity, and
  intransitivity would be a different matter.


