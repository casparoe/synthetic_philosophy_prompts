  The flying man argument (Avicenna): Imagine a man created "in a flash" (or "at once"),
  fully mature, suspended in the air, with eyes veiled so he sees nothing, limbs separated
  so he touches nothing, no air to feel, no sound. He has no sensory contact with
  anything, including his own body. Avicenna claims he would still affirm his own
  existence (his "I"/self, dhat) but would not affirm the existence of his body or
  limbs. Hence the self is known to exist without (knowledge of) the body; the soul
  is a substance distinct from the body, and its existence is not dependent on the
  body.


  The inferential structure: from "I can affirm my self while affirming nothing about
  my body" to "my self is not the body / is a substance in its own right." Note that
  this is a first-person epistemic premise moving to a metaphysical conclusion.


  The gap: conceivability (or "affirmability without") doesn''t entail real possibility
  of existing separately. Descartes faces a similar issue and needs a separate argument
  (divine omnipotence / clear and distinct perception). Avicenna, in some versions,
  argues that since the self is affirmed while the body is not, the self is not the
  body — the body is an "instrument" (ala). Actually Avicenna''s conclusion: the soul
  is a substance, not a body, and is not imprinted in the body. And he thinks the
  self is not identical with the body because one can be affirmed without the other.
