  I''m writing the final exam for a senior undergraduate seminar in medieval philosophy
  of mind (cross-listed with metaphysics). We have spent three weeks on Avicenna''s
  flying man and the medieval controversy over whether the soul is a substance in
  its own right, and I want the take-home essay section to separate students who actually
  understand the argument from students who can only recite the standard gloss — that
  the flying man proves the soul is immaterial and really distinct from the body.


  Please write me one essay question, a model answer of roughly 650 words, and a marking
  scheme. No citations or reading lists — students have only their notes, and I don''t
  want the question to turn into a memory test for who wrote what.


  The question should do the following work:


  First, it should make the student reconstruct the thought experiment precisely enough
  to say what Avicenna actually asks us to imagine (a human being brought into existence
  fully formed, suspended in a void, deprived of every sensory contact, including
  contact with his own limbs) and what, according to Avicenna, such a person would
  still be able to affirm — his own existence — and what he would not affirm — the
  existence of his body. I don''t want the setup summarized in a sentence; I want
  the student to see which features are load-bearing.


  Second, and this is the crux, it should force them to say exactly how strong a conclusion
  that premise can carry. There is a short list of candidates they should be made
  to sort through and adjudicate: (a) that the self exists; (b) that the self is not
  presented to itself as bodily — an epistemic point about self-awareness; (c) that
  the self is really distinct from the body; (d) that the self is immaterial and could
  subsist without the body. The student should be pressed to say which of these the
  flying man as stated establishes, and to name the extra premise that would be needed
  to get from the weaker to the stronger — the move from "affirmable without" to "can
  exist without," and why that move is not free.


  Third, I want them to confront a variant I''ve added to the syllabus this year,
  precisely to stop them from making that leap too quickly. Call it the grounded flying
  man. Stipulate that the suspended man''s capacity to affirm his own existence is,
  as a matter of fact, causally sustained by a hidden organ — an undetected brain,
  say — that he can neither perceive nor infer from anything available in his situation.
  He is, from the inside, exactly as Avicenna describes: he affirms himself and nothing
  of his body. The student must say whether the flying man argument can rule this
  scenario out from the first-person standpoint, and if not, what that shows about
  the argument''s reach. (My own view, which I want them to argue with rather than
  swallow, is that it cannot: the causal dependence is by construction invisible from
  where the flying man stands, so the experiment delivers an epistemic result and
  not the metaphysical one it is usually advertised as delivering.)


  Fourth, they should then say what else Avicenna has to appeal to if he wants the
  stronger conclusion — for instance the claim that rational intellection, the grasp
  of universals, cannot be the operation of a bodily organ — and whether that fills
  the gap or merely relocates it.


  Fifth, I want a contrast with Descartes'' cogito somewhere in the answer: the student
  should say what the flying man and the cogito are each trying to establish, and
  why treating the flying man as an inference from "I think" to "I exist" misdescribes
  it.


  A few constraints. The question must be answerable in about fifty minutes of writing.
  It should not depend on the student knowing any particular edition, translation,
