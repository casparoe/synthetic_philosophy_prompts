  Draft:


  "For the past few months I''ve been reading popular accounts of computing and logic,
  and I''ve become fixated on a pattern of argument that I can''t find a name for,
  though I suspect it must have one. The pattern concerns a certain claim about what
  machines can do: roughly, that any job a human being could carry out by following
  a definite set of rules, a machine could in principle carry out too, and that nothing
  outside this class counts as a genuine ''procedure.'' What puzzles me is that the
  claim behaves like two different kinds of statement depending on who is attacking
  it. When someone asks why we should believe the sweeping half of it — that no rule-governed
  process escapes the machines — the answer is empirical in form: here is a long list
  of ingenious schemes people have proposed, and none of them has ever been shown
  to do anything the ordinary machines cannot. That is the language of a bold conjecture
  about the world, the kind of thing that could in principle be refuted tomorrow.
  But when someone actually exhibits a candidate counterexample — a process that seems
  to deliver answers without any step-by-step recipe, or a device with so many interacting
  parts that no finite machine could mimic it — the reply is never ''then the conjecture
  was wrong.'' The reply is that the process was not really a procedure, or that the
  device was not really computing. The counterexample is not defeated; it is reclassified,
  by adjusting what the word ''procedure'' is allowed to cover. So the same sentence
  seems to be, at one moment, a risky claim about the limits of machinery and, at
  the next, a stipulation about the meaning of a word.


  I would like to know whether there is an established name for a claim with this
  double life — one that is defended with evidence, as though it could be false, but
  is protected from refutation by being, in the end, a matter of definition. And I
  want the answer to do more than supply a label. If such a claim has a name, I want
  to know how it is carved: is the whole thing a single hybrid object, or is it really
  two claims stitched together — one that is a genuine, refutable hypothesis and one
  that is a definition or convention — and can those two be pulled apart cleanly,
  or does the useful part depend on the ambiguity? I also want to know how this pattern
  differs from its neighbours. It is not simply an unfalsifiable statement, because
  it is offered with evidence; it is not simply a definition, because it is treated
  as a discovery about the world; and it does not seem to be an ordinary case of someone
  quietly changing the subject, because the reclassification is done in good faith
  by people who think they are defending the same claim throughout. If there is no
  established term for the phenomenon itself, I would rather you coin one and tell
  me where its edges are — which cases fall inside it and which, though similar, fall
  outside — than hand me a name and stop."


