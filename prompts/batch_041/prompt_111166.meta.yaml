  Trinity: "Analyze the decision to go ahead with the Trinity test in 1945 — with
  the physicists'' worry that the detonation might ignite the atmosphere and end the
  world — through the lens of Pascal''s wager." Both directions: the wager''s structure
  (infinite loss, tiny probability, finite cost of precaution) is exactly what the
  physicists faced; the wager says you should never risk it, so the wager would have
  said "don''t test" (and note: even if you must test, the wager''s logic says the
  cost is finite so pay it) — but the physicists went ahead. What does the wager miss?
  It has no way to handle *estimable* probabilities (the calculation showed the probability
  was essentially zero — a Bayesian update), and no way to handle the "the probability
  isn''t independent of the act" or the fact that the same reasoning would forbid
  all progress; the extortion/generalization objection (Pascal''s mugging, and also
  the many-gods objection: if the argument works, it works for a god that rewards
  not testing). And what does the episode show about the wager? That the wager''s
  real force depends on the impossibility of estimating the probability and on the
  impossibility of verification; when you can estimate, the wager collapses into ordinary
  decision theory with a very lopsided payoff matrix — and the interesting philosophical
  content is in how you''re supposed to reason when one branch is "the end of everything"
  (lexical priority? maximin? the "no finite amount of evidence can rule out an infinite
  loss" problem, i.e., the problem of the "infinity" dominating). Also there''s the
  "the same logic applies to any action with a tiny chance of destroying the world"
  → paralysis (e.g., should we run the LHC, should we build bombs, should we drive
  cars?). Also, one could raise: the wager''s argument form (choose the act with the
  best worst-case) would have forbidden the test; the physicists'' actual reasoning
  was the "expected value with an estimated tiny probability" reasoning, which is
  exactly what the wager rejects (Pascal says the probability doesn''t matter, because
  finite × infinite = infinite). So the episode is a case where the wager''s advice
  and the actual rational practice diverge, and the interesting question is whether
  the physicists were right.


