  Draft:


  "I''m a fourth-year PhD student in ancient history, and I''ve been drafted into
  running one ninety-minute session of the department''s undergraduate seminar on
  Athenian democracy — fourteen students, second and third years, most of whom have
  read some Thucydides and Plato but none of whom have thought much about institutions.
  My supervisor wants the session to leave them with an uneasy feeling about direct
  democracy rather than a list of criticisms, and I have become convinced that the
  usual lecture on the Mytilenean debate, the Sicilian expedition, and the trial of
  Socrates is exactly the wrong instrument: they will nod at the pathologies and then
  reproduce them in the seminar the moment someone proposes something popular. So
  I want to stage the pathologies instead, and I would like you to design the activity.


  The brief. The session should be one continuous simulated emergency assembly of
  an invented city — not Athens, and the participants should not be told which historical
  episodes they are re-enacting, since the point is that they arrive at the structural
  problem themselves rather than recognizing a story they already know. The city is
  a direct democracy of the sort where any citizen may speak and any citizen may propose
  a decree; there is no permanent civil service, no party, no opposition, and no way
  to know in advance who will be liable for a decision. I want three acts, each taking
  its shape from one of the three episodes without announcing it. In the first, the
  assembly has just heard that a subject ally has revolted and been retaken, and must
  decide what to do with the surviving adult males; the decision will be carried by
  the loudest and angriest proposal, and I want the rules to permit a reversal only
  through a second full assembly the next morning, so that the students experience
  both the ease of the first decision and the cost of undoing it — and then I want
  them to see how little of the real deliberation was about whether the punishment
  was deserved. In the second act, the assembly must decide whether to send an expedition,
  with information deliberately unequally distributed (some students get briefing
  slips with the enemy''s numbers and the distance, others get nothing) and command
  given to whoever argues most attractively; the act should include an unmonitorable
  interval in which the commanders act and the assembly cannot observe them, and it
  should end with an outcome slip that makes the assembly responsible for a catastrophe
  it could not have supervised. In the third act, after the disaster, a participant
  must move that the surviving commanders be tried together, in a single vote, on
  a single penalty, in open assembly, and another participant must object; I want
  a designated presiding officer who has to decide whether to put the motion to the
  vote at all, and I want the amnesty that ended the city''s recent civil war — a
  standing agreement not to prosecute anyone for what they did under the previous
  regime — to be visibly in tension with the demand for a scapegoat. If the shape
  of the third act admits it, I would like a short epilogue in which the assembly
  turns on a notorious teacher whose association with the disgraced commanders is
  enough to make him worth prosecuting, and in which the procedural safeguards that
  were available in act three are now absent because nobody wants them.


  What I need from you: the full runnable design. A materials list and, where you
  use written slips, the actual text of them; a minute-by-minute timeline for the
  ninety minutes with the three acts and the epilogue; the rules of the assembly in
  enough detail that they can be posted on the wall and enforced — who may speak,
  in what order, how a motion is put, what the presiding officer can and cannot do,
  what happens to a citizen whose motion is defeated; a stake mechanism that creates
  real pressure without real money (I am willing to hand out tokens, restrict speaking
  rights, or make people queue, but I would rather not make anyone lose anything material);
  the interventions you would script for the facilitator, including where to plant
  confederates and what they should say; and the debrief, which should map specific
  moments in the run onto the actual episodes — the assembly that reversed itself,
  the expedition voted by people who would not sail, the collective trial of the generals,
  the trial after the amnesty — and should make clear which of the structural features
  the students experienced are features of assembly government as such and which are
  peculiar to the circumstances of the late fifth century. Tell me what will predictably
  go wrong the first time I run it, and how to handle it without rescuing the students
  from the problem: I expect at least one act to collapse into a normal seminar discussion,
  and I expect the students to be nicer than the Athenians were. Finally, be honest
  about what the activity cannot reproduce — I already suspect that the fact that
  the participants know they are in a game with a facilitator who will stop it at
  ninety minutes, and that none of them will be killed by the decisions they make,
  is not a trivial difference, and I would like to know which parts of the phenomenon
  I am therefore forced to assert in the debrief rather than letting them feel."


