  Setting: PhD student in ancient history / political theory, TA-ing or running a
  session. Group: 14–18 undergraduates in a seminar on Athenian democracy; 90 minutes;
  a seminar room with movable chairs; no projector needed; can use paper ballots.


  Design brief:

  - The activity should be a single continuous simulated emergency assembly, in three
  acts, with rules that make the pathologies emerge rather than be described.

  - Act 1: a subject-allied city has revolted and been retaken; the assembly must
  decide what to do with the adult males. Rules: no formal agenda, anyone may speak,
  the vote is by show of hands, and there''s a rule that a motion once carried cannot
  be revisited — but the facilitator arranges that a second assembly is convened the
  next morning by a participant who is willing to break that rule (or the facilitator
  seeds a "you have heard that the previous decision is being reconsidered" note).
  Then the reversal vote. Debrief: how the second vote happened in reality, and what
  the structural problem is (decisions made under anger in a single sitting; no mechanism
  for revision except another mass meeting; the "whoever wishes" rule; the tension
  between deliberation and speed).

  - Act 2: the assembly must decide whether to send a large expedition. Seed with
  information asymmetry: only some participants get extra information (a briefing
  slip) about the size of the enemy force / the distance; and the ambitious young
  participant who wants command has the best rhetoric. The participants must commit
  resources and name commanders. Then a mid-game event: a scandal (some participants
  receive slips accusing one commander of a sacrilegious act), forcing a recall decision,
  and the assembly must decide whether to keep, recall, or reinforce, under the rule
  that they cannot easily get news and that the commanders have discretion. Then the
  outcome slip reveals the disaster. Debrief: the assembly voted the expedition, but
  the commanders had discretion and the assembly couldn''t monitor; the recall of
  Alcibiades; the failure to send a second force in time; the absence of any mechanism
  to hold the proposers responsible.

