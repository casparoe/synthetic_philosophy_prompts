  Draft:


  I''ve just gone back to uni for an MSc in sociology after six years working in insurance,
  and I''m already stuck in the methodological individualism vs holism bit. My flatmate
  is an economist and thinks it''s obvious that only individuals act — everything
  else is a shorthand — while my seminar tutor keeps saying that social structures
  have causal powers of their own. To break the deadlock she used an analogy I can''t
  stop thinking about: society is like a coral reef. The individual polyps are the
  agents; the reef itself is the calcium carbonate skeleton they secrete over generations;
  and then the reef — its shape, its nooks, its current-swept channels — determines
  which polyps can settle, what they can eat, and which lineages survive. She called
  this ''reef-building action'' and said it shows institutions aren''t just aggregates
  of individual choices: they''re emergent structures that feed back and constrain
  the very individuals who made them. She even said the skeleton is a ''structure
  of constrained affordances'' that is a cause, not just an effect.


  Can you audit the analogy for me? I need the correspondence table first — what maps
  onto polyps, skeleton, water chemistry, predation, reproduction, selection, and
  so on — then the places where the mapping breaks. Which of those breaks actually
  matter for the anti-reductionist conclusion she drew, and which are just colourful
  differences? Does the reef picture quietly import things social institutions don''t
  have (or the other way round), like a single species, a clear boundary, a slow uniform
  timescale, or a telos of reef health? And once the disanalogies are on the table,
  does the conclusion survive — that social structures are irreducible and have downward
  causal power — or was the analogy carrying it the whole time? If there''s a better
  analogy for the same point, tell me what it would be. Please answer in American
  English (I''m sending this to a friend in Chicago who''s also doing a PhD), and
  don''t bother with citations or a reading list — I just want the reasoning. I''m
  not convinved by either side yet, so be specific about what the analogy can and
  cannot carry.


