  Hey — I''m putting together the take-home for my upper-level seminar next term and
  I need one essay question on Carroll''s tortoise and Achilles. They''ve all read
  the dialogue in class, so I can''t just ask them to summarise the regress; I need
  the question to land somewhere the dialogue doesn''t take them.


  Here''s the set-up I want to give them. Tortoise and Achilles are back, and this
  time Achilles doesn''t offer another conditional. He builds a box. The box has two
  input registers and an output register, and a transition table such that whenever
  one input holds P and the other holds (if P then Q), the box prints Q — infallibly,
  for any P and Q you like, including the ones where the tortoise is the one supplying
  the input. The tortoise looks at the table, agrees it describes exactly what the
  box does, and then says: fine, but why should I treat what comes out of the box
  as a reason to believe Q? Achilles says: because that''s the rule. The tortoise
  says: and why should I take that as a reason?


  I want the question to force them to say (a) precisely what the tortoise is asking
  for at that last step, and whether it''s the same thing he was asking for in the
  original dialogue or something subtly different; (b) whether "accepting modus ponens"
  can be a further belief without the gap just re-opening one level up — and if it
  can''t, what the alternative picture is (a disposition, a practice, a piece of hardware,
  whatever they want to defend) and what that picture buys and what it costs; and
  (c) whether the regress is actually vicious, or whether the demand that generates
  it is somehow out of order — they should say which way they come down and what would
  have to be true for the other side to be right.


  Then a second, shorter strand: does the same thing happen if we swap deduction for
  probabilistic updating? I.e. a tortoise who grants the probability axioms, grants
  that his credences ought to line up with the evidence, and then simply never conditionalises
  — he agrees with every claim about what his credences should be and never has the
  credences. Is that the same regress, a watered-down version of it, or no problem
  at all? I genuinely don''t know what I think about this one, so I want them to argue
  it, not to cite anyone.


  Then the deliverables: a model answer of around 700-800 words, and a marking scheme.
  For the marking scheme I want the specific moves a top answer has to make, marks
  attached (out of 20), a clear statement of what separates an A from a B — the moves
  a B answer will make some of but not all of — and a list of the wrong turns that
  should cost marks, with the actual mistake named for each (I keep seeing students
  slide from "the regress never terminates" to "deduction is unjustified", or treat
  it as just the Münchhausen trilemma with new characters, and I want those penalised
  specifically).


  Couple of constraints on the model answer. No citations, no reading list — the students
  have the bibliography, I just want the moves, so don''t hang anything on a name.
  And please be explicit about which parts of this are settled and which are genuinely
  contested among people who work on it: if it''s disputed whether the regress is
  vicious at all, or whether the "it''s a practice, not a premise" line actually answers
  the tortoise, say that it''s disputed rather than asserting one side. I don''t want
  a contested reading written up as the consensus, and I don''t want to grade students
  down for landing on a live position, so the model answer should make the live/disputed
  bits visible.


