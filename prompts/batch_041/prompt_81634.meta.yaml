  The interesting mappings:

  - subsidiarity ≈ local-first / edge computation for latency and information asymmetry
  ("the node closest to the data has the best view of it")

  - conferral ≈ capability-based security / least privilege: powers not explicitly
  granted don''t exist

  - supremacy ≈ a global invariant that must not be violated by any local write (like
  a uniqueness constraint) — or the "single writer" for a given key

  - preemption ≈ a global invariant overriding local policy; "you can''t do X even
  if your local users want it"

  - entrenchment/eternity clause ≈ immutability guarantees / write-once rules; amendment
  procedures ≈ protocol upgrades requiring supermajority quorums

  - judicial review ≈ a referee/quorum that adjudicates conflicts between nodes...
  but with the twist that the referee is itself created by the protocol and the referee''s
  rulings can be contested by a node (ultra vires)

  - laboratories of democracy ≈ A/B testing, canary deploys, evolutionary diversity
  across shards, avoiding common-mode failure

  - exit/voice ≈ forking and leaving vs. staying and lobbying for protocol changes;
  exit costs

  - subsidiarity''s Catholic-dignity rationale vs efficiency rationale — this is the
  crux: the target vocabulary can only express efficiency reasons; the dignity/legitimacy
  reason doesn''t translate. That''s the residue.

  - Also: in a distributed system, correctness is defined by an external spec/SLO
  — there''s a ground truth to compare replicas to. In federalism there''s no external
  ground truth about what the right level of government is; the "correct" allocation
  is the thing being contested. That''s a great residue point.

  - Also: nodes are not the users. The citizens are not nodes; they''re more like...
  the data? Or the workload? Actually the interesting thing: in federalism the subunits
  are themselves polities with their own internal legitimacy, i.e., recursive democracy
  — the system generates its own protocol. In distributed systems, the protocol is
  given from outside (the vendor/standard). Reflexivity/constitution-making has no
  clean counterpart.

  - Also: non-fungibility — you can''t just kill a node and reschedule its work; Länder/cantons/states
  have identity and history.

  - Also: the "you can''t leave" asymmetry — no clean exit, so voice is the only channel;
  in distributed systems you can always fork the repo or run your own node.

  - Also: obligations of loyalty (Bundestreue / federal comity) — a norm of not exercising
  your legal powers to spite the whole. There''s some counterpart: "don''t be Byzantine
  even though you can be", "cooperative protocols assume rational-but-not-adversarial
