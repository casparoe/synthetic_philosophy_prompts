  "In a reading group on decision theory, a participant keeps using the line ''intention
  is not a prediction'' to dismiss any account that treats an agent''s intention as
  a forecast of her own future action. The case under discussion is the toxin puzzle:
  an agent is offered a large sum of money if, by tonight, she intends to drink a
  mild but thoroughly unpleasant toxin tomorrow; the money is paid once the intention
  is formed, and after that she is free to change her mind, as everyone knows she
  will. The participant says the agent can intend to drink the toxin even though she
  knows she will not, and concludes that intention cannot be a kind of prediction.
  I suspect the slogan is doing more work than it can bear. Please lay out the distinct
  precise claims that ''intention is not a prediction'' could be making in this context,
  from the nearly trivial to the radical. For each, state the thesis as exactly as
  you can, say whether it is analytic or substantive, whether it is defensible, and
  whether it would actually support the participant''s conclusion. Include readings
  on which the slogan is true but irrelevant to the puzzle, readings on which it is
  false, and readings on which it is a claim about rationality rather than psychology.
  I am especially interested in the difference between (a) intention not being identical
  with a prediction, (b) intention not requiring a predictive belief, (c) intention
  being compatible with the belief that one will not act, and (d) intention being
  a commitment that can outlive the reasons for forming it. Finally, say which reading
  is most likely the one people mean when they use the line in this debate, and which
  reading a defender of a predictive or belief-based account should accept. Separate
  what is settled from what is genuinely contested among people who work on intention;
  do not present a contested reading as the consensus. No citations or reading list
  are needed."


