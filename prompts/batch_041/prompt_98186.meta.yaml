  status. The second defends a liberal conception on which personhood is an intrinsic
  status that does not depend on anyone''s recognition, and which protects the solitary,
  the dissident, and the severely disabled from the tyranny of the community. The
  dispute arises from a case: a small town must decide whether to recognize as a full
  person a man who has lived alone in the forest for thirty years, has refused all
  social ties, and now suffers from dementia. The liberal says the relational view
  would strip him of personhood; the relationalist says the liberal view is a fiction
  that ignores how personhood is sustained by care and recognition. Let them also
  discuss the case of a woman who leaves her community after being abused and refuses
  all obligations to it, and the case of a community that collectively decides to
  expel a member. The dialogue should not be a strawman for either side. Each should
  press the other''s actual arguments: the relationalist should explain whether relational
  personhood can avoid making personhood conditional on the community''s approval,
  and how it can ground critique of oppressive communities; the liberal should explain
  whether intrinsic personhood can account for the dependence and care that make agency
  possible, and whether it can avoid the charge that it is a Western individualist
  ideal. They should engage with the distinction between personhood as a metaphysical
  property and personhood as a normative achievement, and with the question of whether
  recognition is constitutive of personhood or merely causal. End with neither side
  declaring victory, but with a clear statement of what each has conceded and what
  remains unresolved."


