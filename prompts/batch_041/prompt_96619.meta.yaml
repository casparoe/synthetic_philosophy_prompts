  investigator collects the subject''s reports, brackets the question of whether they
  are true, and constructs a ''heterophenomenological world'' — the world as the subject
  believes it to be. Because the method never assumes that reports correspond to real
  inner experiences, it is a form of behaviorism: consciousness is identified with
  the disposition to make certain reports. This is why heterophenomenology is often
  called the ''eliminativist'' approach to consciousness. A recent extension applies
  the method to large language models: since their outputs are just text, we can treat
  them as heterophenomenological subjects without worrying about whether they are
