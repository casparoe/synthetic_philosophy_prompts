  deny them either.

  - "it is a form of behaviorism" — false; Dennett explicitly says it''s not behaviorism,
  it uses intentional stance.

  - "consciousness is identified with the disposition to make certain reports" — false;
  that''s behaviorism, not heterophenomenology.

