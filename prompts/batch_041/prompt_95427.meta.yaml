  The XOR version: the blackmailer''s action is XOR''d with your payment. He sends
  a message: "Either I''ve planted a bomb and you should pay to have it disarmed,
  or I haven''t planted a bomb and there''s nothing to worry about — and I only planted
  the bomb if you wouldn''t pay." So: pay → no bomb (he didn''t plant it because you''d
  pay), and you''re out $1000 for nothing. Don''t pay → bomb planted → boom. So the
  correlated decision: paying costs $1000 in the world where it does nothing; not
  paying loses a lot in the world where the bomb exists. Under EDT-ish/acausal reasoning,
  you should pay, because your payment decision is correlated with the bomb''s existence.
  Under CDT, don''t pay, since the bomb''s existence was determined before your decision
  (well, by your disposition). This is the "XOR" because bomb-existence = NOT(pay).


