  Draft:


  "A friend in my reading group has a reading of Kant''s Perpetual Peace that I can''t
  shake. His claim is that the essay rests on a single analogy, and that everything
  else is decoration. The analogy is the domestic one: states stand to one another
  as individuals do in the state of nature — each is judge in his own cause, none
  is bound by a common superior, and the condition is therefore a condition of war.
  Individuals escaped that condition by submitting to a common sovereign and a coercive
  law; so states must do the same, and perpetual peace therefore requires a world
  republic. On his reading, Kant''s preference for a mere voluntary league of free
  states, and his evident alarm at the thought of a single world state, are failures
  of nerve — the analogy, followed honestly, gives you the world state, and the essay''s
  own second article contradicts its premise.


  I want an audit of the analogy itself, not of who is a better Kant scholar. Give
  me the correspondence table first: what in the individual case is supposed to map
  onto what in the international case, including the elements the analogy needs but
  doesn''t mention — the contract, the sovereign, the right of coercion, the exit
  option, the difference between the lawless freedom of persons and the freedom of
  a state that already has a lawful constitution inside it. Then tell me where the
  mapping breaks, and separate the breaks that matter for the conclusion from the
  ones that are merely picturesque. I''m especially interested in the breaks Kant
  himself seems to have registered: the thought that a single world sovereign would
  be a despotism with nothing outside it to check it, and the fact that he ends up
  offering a league as an admittedly imperfect substitute for the civil union the
  analogy demands.


  Then the two questions that matter. First: if the disanalogies hold, does the world-state
  conclusion survive in a weakened form — a federation, a court, an enforceable international
  law — or does it collapse altogether, and what exactly is doing the work when it
  survives? Second: Kant seems to have a second route to peace that doesn''t use the
  analogy at all — the thought that nature, or the spirit of commerce, or publicity,
  will push states toward peace whether or not they are virtuous. If that route works,
  how much does the analogy matter to the essay? And if the analogy is doing the real
  work, is the world state a requirement of right or just a prediction about what
  will happen?


  Finish by telling me what a better analogy would be for the international case,
  and what it would and wouldn''t buy."


