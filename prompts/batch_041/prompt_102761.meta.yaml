  "I am an undergraduate in a metaphysics course, and we have been working through
  Bradley''s regress and the unity of the proposition. I would like you to act as
  an analytic metaphysician with expertise in regress arguments, the metaphysics of
  relations, and formal theories of predication. Think carefully before answering,
  and begin with a short brainstorm of the main positions one could take on the regress;
  then give me your considered credence.


  My question is this. Take the following proposition: Bradley''s regress is a genuine,
  vicious regress, so that any account of propositional unity that explains unity
  by positing a relation that binds the constituents of a proposition is thereby refuted.
  What is your credence, between 0 and 1, that this proposition is true?


  I do not want a bare number. Decompose it. At minimum, separate:

  1. The probability that the regress is generated at all, given a correct account
  of relations and predication.

  2. The probability that, if generated, it is vicious rather than a benign infinite
  analysis.

  3. The probability that the unity of a proposition requires the kind of explanation
  Bradley assumes, as opposed to being primitive or not a genuine explanatory demand.

  4. The probability that some non-relational or non-standard account of predication
  blocks the regress without merely relocating it.

  5. Any other sub-question you think belongs.


  For each sub-question, give a rough number and one or two lines of justification.
