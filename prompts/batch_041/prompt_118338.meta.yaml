  Let''s draft:


  "I am a software engineer with no formal philosophy training, and next month I am
  presenting a short paper to a reading group that works on perception and temporal
  consciousness. My thesis is that the colour phi phenomenon does not support either
  the Orwellian or the Stalinesque picture of the timing of experience. On my account,
  the visual system runs a fast colour/location pathway and a slower event-binding
  pathway. When the second dot appears, the binding mechanism tags the first dot with
  the second dot''s colour and time, producing a post-perceptual judgement that the
  first dot was the second colour. The first dot''s phenomenal experience is not revised
  or delayed; what looks like colour filling-in is a memory-and-judgement artefact,
  analogous to the flash-lag effect and change blindness. The group is made up of
  about eight vision scientists who study apparent motion, postdiction, and temporal
  binding, plus two philosophers of mind: one an eliminativist about the Cartesian
  theatre, the other a representationalist who holds that phenomenal character is
  fixed by early sensory states. They are sympathetic to empirical work but sceptical
  of philosophers reinterpreting the data, and they will not accept a purely conceptual
  distinction between experience and judgement.


