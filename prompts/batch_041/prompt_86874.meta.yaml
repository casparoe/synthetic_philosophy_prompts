  the heterophenomenologist treats the subject''s utterances as fiction-generating
  acts, and the resulting "text" is a fiction in the sense that it''s a constructed
  narrative. But it''s a fiction whose creation is constrained by the subject''s actual
  beliefs.

  - Comparison with anthropology: interpreting texts of an alien culture; you can''t
  just take at face value.

  - "Doing justice to the phenomena" — Dennett insists heterophenomenology doesn''t
  deny or explain away experience; it just delays the question of what experience
  is. It is neutral/agnostic about the metaphysics of consciousness. It''s not "eliminativism"
  about experience per se.

  - The "lone-wolf" / introspectionist alternative: autophenomenology, which relies
  on the investigator''s own first-person reports, criticized as unreliable (e.g.,
  Dennett on the "Cartesian theater" and "witness" assumption).

  - Dennett''s example: the "phi phenomenon," "apparent motion," and the color phi
