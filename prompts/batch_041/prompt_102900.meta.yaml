  I teach a 90-minute session in an upper-level ethics seminar — 15 students, mostly
  juniors and seniors, some of whom have read a little Kant and most of whom have
  not. I want to run an activity that makes the class feel the force of a position
  they will otherwise dismiss on contact: that lying is wrong even to the murderer
  at the door.


  The trap I want to avoid is the one where everyone nods at the abstract principle
  and then, the moment the scenario is concrete, agrees that of course you lie, and
  treats the Kantian as a fanatic. The specific claim I care about is not the cartoon
  ("never lie, consequences be damned") but the harder one: that the wrong of the
  lie is not done to the person at the door at all, and is not cancelled by the fact
  that he means to do murder. On this reading the duty of truthfulness is owed to
  the standing of assertion itself — to everyone who relies on what people say — and
  the man at the door has no special claim on it and no power to forfeit it. The position
  also permits refusing to answer; it is deceiving, not silence, that is at issue.
  I want the class to feel both the pull of the obvious reply (he has forfeited any
  right to the truth; he is using me as a tool; surely the duty bends here) and the
  pull of the claim that survives it.


