  held as a rule that the students can simply weigh against the consequences. The
  hard claim is that the wrong of the lie is not done to the man at the door at all,
  and is not cancelled by the fact that he intends a murder. On this reading the duty
  of truthfulness is owed to the standing of assertion itself — to everyone who depends
  on what people say — and the man at the door has neither a special claim on it nor
  the power to forfeit it on everyone''s behalf. The position also leaves a way out:
  it forbids deceiving, not silence. I want the class to feel the pull of the obvious
