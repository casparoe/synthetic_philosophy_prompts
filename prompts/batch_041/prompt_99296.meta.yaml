  "I have no academic training in philosophy or medicine—I drive a delivery van and
  read on my lunch breaks—but I''ve been stuck on a condition I came across called
  pain asymbolia. As I understand it, people with this condition can still feel pain,
  and can still say where it is and how intense it is, but they don''t seem to suffer
  from it in the ordinary way: they may not pull away, may not look distressed, and
  in some accounts may even smile or seem indifferent. What interests me is not the
  medical curiosity but the philosophical question it opens up. We usually treat pain
  as the clearest case of something bad in itself—bad because of how it feels. But
  if the sensation can be present while the awfulness is missing, then maybe the badness
  of pain isn''t in the sensation at all. Maybe it''s in the way pain grabs you, commands
  you, makes you care. I''ve been calling this, in my notebook, the difference between
  a signal and a summons. A signal can be true or false, loud or quiet; a summons
  is something you can''t ignore. If pain asymbolia is real, then perhaps what we
  hate about pain is not the signal but the summons—and a pain that no longer summons
  anything might be a different kind of event, not just a milder one."


