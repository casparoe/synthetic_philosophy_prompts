  I''m a novelist, and I teach one session a year in a graduate seminar on memory
  and narrative. This year it falls on the week the students have read Margalit on
  the ethics of memory and Rieff on the case for forgetting, and I''ve been asked
  to make that session carry the weight the reading can''t: sixteen students, a hundred
  minutes, a plain room with movable chairs and a projector I probably won''t use.
  What I want them to feel is not the thesis of either book but the moment when the
  two pulls cross — when letting a memory go looks like a betrayal of the people you
  belong to, and when keeping it faithfully looks like a way of keeping a wound open
  — and to feel that the two pulls come from different places in a person rather than
  from an error of reasoning that a bit more thinking would clear up. The reading
  will have given them the vocabulary; the session should give them the experience,
  so that the vocabulary has something to attach to.


  Design the activity. I don''t want a debate, with one team for Margalit and one
  for Rieff — that turns both positions into positions, and the students perform them
  rather than inhabit them. I want everyone in the room to end up jointly responsible
  for a decision that costs something. I''d like the mechanics to do the work: by
  the time I say anything, they should already have discovered that what they owe
  to their own is not the same as what they owe to strangers, and that the difference
  doesn''t feel like a moral failing even though they can see it is one. Two things
  I''d ask for in the design: at some point the group must hand a memory over to someone
  who wasn''t there, so that keeping it alive and losing it turn out to be the same
  gesture; and something must actually be lost — irreversibly, within the fiction
  — so that the loss is a fact of the session and not a topic of discussion. Nothing
  may be drawn from the students'' own lives; I''ll supply invented material and I
  want the fiction complete enough that nobody is tempted to volunteer a family story.


  Give me the setting and the number of participants, the materials I need to print,
  the rules, the sequence with rough timings, and the debrief. In the debrief I want
  the mapping — this moment was the thick relation, that moment was the price of transmission,
  that moment was the case for forgetting — and I want to know which moments will
  predictably go wrong the first time and what I should do when they do. Be honest
  about the feature of the idea the activity can''t reproduce and that I''ll have
  to supply in words afterwards, since I''d rather know in advance than discover it
  in the room.


  Write it in British English, as continuous prose — no headings, no numbered lists,
  no bullet points, no bold, no tables; a letter to a colleague is the shape I have
  in mind. And if what I''m asking for can''t be done in a hundred minutes with sixteen
  people, or if the design I''ve described would inevitably tilt the room toward one
  of the two positions, say so plainly instead of giving me a polished version of
  the thing I asked for; I''d rather redesign the session than run something that
  only appears to work.


