  Final wording:


  ---

  I am a software engineer with no formal training in philosophy, and I would like
  a careful explanation of a conceptual puzzle in the philosophy of mind. Clinical
  neurology describes a condition, pain asymbolia, in which patients seem to feel
  pain without being troubled by it: they can say where a pinprick is and how intense
  it is, and they may even allow that it hurts, but they do not withdraw and give
  every sign of indifference. The natural view is that a pain which did not hurt would
  not be a pain at all, and I would like to know how much of that view survives contact
  with the case. Does the condition show that the awfulness of a pain is a separable
  part of it, so that a pain might hurt without being bad for the person who has it,
  or does it show only that the urge to escape a pain can be severed from the feeling
  of it?


  To sharpen the question, suppose a drug reproduced the asymbolic state in an otherwise
  healthy person: the sensation arrives with its full intensity, quality and location,
  and they can still report it, but nothing about it bothers them. I want to know
  whether that would count as treating the pain or merely disguising it, and how to
