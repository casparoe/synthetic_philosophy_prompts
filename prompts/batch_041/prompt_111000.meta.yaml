  Draft:


  I have no academic training in philosophy or cognitive science, but I have spent
  a lot of time thinking about consciousness, and I have arrived at a position that
  I would like you to stress-test. I hold that qualia -- understood as intrinsic,
  non-relational, introspectively accessible properties that are supposed to be the
  "raw feel" of an experience, the features that make a pain feel like this rather
  than like that -- are an incoherent posit. On my view, the word picks out nothing
  over and above the fact that experiences have a subjective character; it reifies
  a grammatical feature of first-person reports into a metaphysical entity, and every
  attempt to say what qualia are either collapses into a functional or representational
  description or into an empty gesture at ineffability. I am not asking whether the
  term is useful in casual conversation; I am asking whether the theoretical posit
  is coherent.


  What I want from you is a map of what would count against this position. Specifically:


  1. What observations, arguments, intuitions, or formal results should move me? Rank
  them from fatal to merely awkward, and explain what each would show.

  2. What would a defender of qualia concede as counting against their view, as opposed
  to what only a critic would say? I want the strongest internal concessions.

  3. What does my position predict that its rivals do not? If it predicts nothing,
  is that a problem, or is it a sign that the dispute is verbal?

  4. Is there a version of the qualia posit that survives the incoherence charge --
  for example, one that treats qualia as determinable rather than determinate, or
  as relational rather than intrinsic, or as the intrinsic properties of a representational
  state rather than of an experience? If so, does that version still deserve the name,
  or has the incoherence charge simply forced a retreat that leaves the original disagreement
  untouched?

  5. I am especially interested in cases where two experiences seem to have the same
  functional and representational profile but are supposed to differ qualitatively,
  and in the reverse case. What would such cases actually establish? Would they show
  that qualia are needed, or only that our descriptions are incomplete?

  6. Finally, tell me whether my position risks unfalsifiability. If every proposed
  counterexample can be absorbed by saying that the alleged quale is really just a
  functional or representational feature, what could possibly count against me? If
  nothing could, is that a defect in the position or a sign that the position is a
  conceptual clarification rather than an empirical claim?


  I would personally find most persuasive a case where denying qualia forces me to
  deny something I already accept about experience, or a formal argument that the
  incoherence charge equivocates between senses of "intrinsic" or "introspectively
  accessible." But I want the full map, not just the parts that fit my priors.


