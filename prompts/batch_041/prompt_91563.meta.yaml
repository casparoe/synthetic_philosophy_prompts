  Summary draft:


  "Every culture sits somewhere on a single axis running from individualism to collectivism.
  The West is at the individualist end: it holds that the individual is prior to society,
  that society is a voluntary arrangement into which self-interested individuals enter
  for mutual advantage, and that a person''s own goals and rights come first. East
  Asia is at the collectivist end: there the group is prior to the individual, a person
  is constituted entirely by their social roles, so there is no meaningful distinction
  between what someone wants and what the group expects of them, and the interests
  of the family or the company always take precedence over the individual''s. The
  evidence is straightforward: in large cross-national surveys, East Asians consistently
  score lower on individualism and higher on collectivism than Westerners, and laboratory
  studies find that East Asians attend more to context and relationships while Westerners
  see a person as a bounded, self-contained unit. This is why, in Japan, people say
  one thing to your face and another behind your back — the private self is simply
  submerged in the public role. If you are going to live and work here, you should
  expect that your own preferences carry no weight and that the correct move is always
  to defer to the group."


  Subtle errors embedded:

  1. "a single axis" — binary/single dimension; contested (Hofstede''s dimension is
  one of several; and there''s within-culture variation, and tightness-looseness,
  and the fact that East Asian countries aren''t uniformly high on collectivism in
  all respects). Also the "single axis" implies you can''t be both.

  2. "individual is prior to society... self-interested individuals" — caricature
  of social contract theory and of "the West"; Aristotle''s political animal, etc.
  Also conflates normative individualism with descriptive.

  3. "a person is constituted entirely by their social roles, so there is no meaningful
  distinction between what someone wants and what the group expects" — overstatement;
  relational self ≠ no private self. The "so" is a non sequitur.

  4. "the interests of the family or the company always take precedence" — overstatement;
  and conflates collectivism (in-group loyalty) with universal subordination.

  5. "This is why, in Japan, people say one thing to your face and another behind
  your back — the private self is simply submerged in the public role." — misreading
  of honne/tatemae: the very existence of the distinction presupposes a private self;
  it''s about the management of public expression, not the absence of a private self.
  Also the causal claim "this is why" is bogus. And "say one thing to your face and
  another behind your back" is a distortion of tatemae (which is more like the expected
  public stance, not deceit).

  6. "you should expect that your own preferences carry no weight" — practical advice
  doesn''t follow; also treating a statistical average as a prescription for an individual;
  also ignores that within-country variation and individual differences are large;
  also "always defer" is not what the relational view recommends (it''s about harmonizing,
