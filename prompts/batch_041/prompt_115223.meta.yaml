  Let''s draft a prompt for common knowledge:


  "Write an essay adjudicating the following controversy in epistemic game theory.
  It is often said that if two agents are rational and this is common knowledge, then
  in a finite game of perfect information they will play the backward-induction solution.
  But consider a two-player game with a known finite horizon and a small payoff for
  cooperating at each stage, plus a larger payoff for defecting at the end. Does common
  knowledge of rationality really force defection at the first stage, or does the
  reasoning that generates backward induction require an additional assumption --
  e.g., that each player is certain the other will defect at the last stage, which
  is not itself implied by common knowledge of rationality? Some argue that the backward-induction
  paradox shows common knowledge of rationality is either impossible or inert; others
  argue it shows only that the players must also know that the others know the game,
  etc. Reach a verdict: is common knowledge of rationality sufficient for backward
  induction, or not? Justify it by considering at least one counterexample (the surprise
  exam, the centipede, or a finitely repeated prisoner''s dilemma) and one reply on
  behalf of the sufficiency thesis. Do not cite sources or give a reading list. Structure:
  ''The dispute'' (~150 words), ''The case for sufficiency'' (~500 words), ''The case
  against sufficiency'' (~500 words), ''My verdict'' (~400 words), ''Objections and
  replies'' (~300 words)."


