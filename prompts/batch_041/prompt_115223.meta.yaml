  Let''s draft for evidential cooperation:


  "Write an essay adjudicating the controversy over evidential cooperation in large
  worlds. Set it up as follows. Two agents are causally isolated: nothing either does
  can affect the other. But they know they are similar in the relevant respects --
  same decision algorithm, same evidence, same situation -- and each is uncertain
  whether the other is a duplicate, a simulation, or merely a distant agent who will
  reason to the same conclusion. Evidential decision theory says an act is rational
  if it is the act that, conditional on your doing it, gives the best news about the
  world. Does that make it rational to sacrifice for such an agent, on the grounds
  that your sacrifice is evidence that they will also sacrifice? Or is this a confusion
  -- a kind of magical thinking that treats correlation as if it were causation? Reach
  a verdict. Justify it by considering at least one case where the correlation is
  perfect and one where it is merely probable. Do not cite sources or give a reading
  list. Structure: ''The dispute'' (~150 words), ''The case for evidential cooperation''
  (~500 words), ''The case against'' (~500 words), ''My verdict'' (~400 words), ''Objections
  and replies'' (~300 words)."


