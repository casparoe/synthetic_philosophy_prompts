  completely paralysed, and the only channels left are autonomic: heart rate, blood
  pressure, pupil size, tears, sweating. And with an animal you obviously can''t ask,
  and the species gap means the usual move — ''it acts the way I would if it hurt,
  so it probably hurts'' — is shakier than it is for another person.


