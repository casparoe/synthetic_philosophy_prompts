  Commitments:


  A. Procreative beneficence: when prospective parents can choose among possible children,
  they have a pro tanto moral reason to choose the child whose life is expected to
  go best, where "best" is understood in terms of the child''s own expected well-being,
  not the parents'' preferences or social convenience.

  B. That reason is non-overriding and does not justify state coercion; it operates
  within a sphere of reproductive autonomy.

  C. Reproductive autonomy includes a right to select against conditions that cause
  suffering, and also a right to select for traits that are not pathologies—height,
  sex, temperament—provided the selection does not wrong third parties.

  D. Disability is substantially a social construction: the primary burdens of disability
  are produced by inaccessible environments, stigma, and institutional exclusion,
  not by impairment as such.

  E. It can be morally permissible, and sometimes admirable, for parents to choose
  a child with a disability—say, deafness—when that choice is embedded in a valued
  cultural community and a positive identity.

  F. There is no principled distinction between therapy and enhancement; the distinction
  is a political artifact, and attempts to police it are incoherent.

  G. The historical wrong of eugenics lay in coercion, state direction, and the ranking
  of lives, not in selection as such; a liberal, voluntary, pluralistic eugenics is
  therefore not the same moral object.

  H. Case verdict: A deaf couple who use preimplantation genetic diagnosis to select
  an embryo carrying a deafness-associated variant should be permitted, and their
  choice should not be described as a harm to the child, even if a hearing child would
  have a higher expected well-being by conventional social metrics.


