  Draft:


  I am a science journalist preparing a long-form essay on the ethics of reproductive
  selection, and before I commit to a position in print I want a rigorous audit of
  whether my commitments can be held together. Here is where I have landed. (1) Procreative
  beneficence: when prospective parents can choose among possible children, they have
  a pro tanto moral reason to choose the child whose life is expected to go best,
  where best is measured by the child''s own expected well-being rather than the parents''
  preferences or social convenience. (2) That reason is non-overriding and does not
  justify state coercion; it operates inside a robust sphere of reproductive autonomy.
  (3) Reproductive autonomy includes a right to select against conditions that cause
  suffering and a right to select for traits that are not pathologies, such as height,
  sex, or temperament, provided the selection does not wrong third parties. (4) Disability
  is substantially a social construction: the principal burdens of disability are
  produced by inaccessible environments, stigma, and institutional exclusion, not
  by impairment as such. (5) It can be morally permissible, and sometimes admirable,
  for parents to choose a child with a disability, for example deafness, when that
  choice is embedded in a valued cultural community and a positive identity. (6) There
  is no principled therapy-enhancement distinction; the distinction is a political
  artifact, and attempts to police it are incoherent. (7) The historical wrong of
  eugenics lay in coercion, state direction, and the ranking of lives, not in selection
  as such; a liberal, voluntary, pluralistic eugenics is therefore not the same moral
  object. (8) A deaf couple who use preimplantation genetic diagnosis to select an
  embryo carrying a deafness-associated variant should be permitted, and their choice
  should not be described as a harm to the child, even if a hearing child would score
  higher on conventional social metrics of expected well-being. (9) I distinguish
  a selection reason from a selection permission: procreative beneficence supplies
  the former, autonomy supplies the latter, and they may point in different directions
  without contradiction.


  Then ask: Which of these commitments are in genuine tension, which only appear to
