  Let''s design collective memory prompt.


  Journalist: "I write a column on science and ideas, and I''m drafting an essay on
  memory politics. Before I commit to a line, I want an audit of my commitments."
  Then list:


  1. Historical claims are truth-apt and evidence-responsive: there are facts about
  what happened, and the archival record, however incomplete, is the tribunal of last
  resort in public institutions.

  2. Communities possess collective memories that are not merely aggregations of individual
  recollections; they are transmitted, ritualized, and constitutive of group identity.

  3. When a community''s memory and the professional historical record conflict, public
  institutions—museums, curricula, courts—should generally defer to the record, while
  giving memory a hearing.

  4. Testimony is genuine evidence, but memory is reconstructive, socially scaffolded,
  and vulnerable to revision by later interests.

  5. We owe something like reparative epistemic attention to memories that power has
  excluded from the record; the absence of documentation is not proof of absence.

  6. Historical myths can be morally true even when factually false, and a community
  may legitimately need them.

  7. The state should not legislate what counts as memory; memory laws are a category
  error. But the state may fund plural memory infrastructure.

  8. Historians should explain how memories form and function, not adjudicate which
  memories are authentic.

  9. Case verdict: In a town where oral tradition says a dam was deliberately opened
  during a flood and the archive suggests natural failure, the town''s museum should
  label the oral account as "community memory" rather than "history," and this is
  the right response.


