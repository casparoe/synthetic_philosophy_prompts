  The solver is shown a new panel C and must produce a panel D such that the change
  from C to D is the same kind of change as the change from A to B. There is no answer
  key, because in this microdomain there is usually more than one defensible reading
  of the source change. I need a reusable decision procedure that my graders can run
  on a proposed D. They are undergraduates with no background in cognitive science.
  They have about three minutes per answer and can ask the solver for a one-sentence
  rationale but cannot interview them. The decisions are low-stakes for the puzzle
  itself but high-stakes for a research dataset, because I need inter-rater reliability.
  Any rejection has to be signed off by me.


  Please write the procedure in continuous prose only, as a long letter to me. Do
  not use headings, bullet points, numbered lists, bold or italic text, or tables;
  if you must enumerate, do it in sentences. The procedure should give the questions
