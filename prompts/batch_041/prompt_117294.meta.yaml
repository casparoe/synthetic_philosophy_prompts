  Let''s draft the prompt.


  Start: "You are a philosopher of physics specializing in quantum foundations, with
  a particular interest in the ontology of the quantum state. I need you to think
  carefully and systematically before answering."


  Then scenario: "In a reading group on the measurement problem, a colleague keeps
  saying, ''The wavefunction is just a bookkeeping device.'' They say it to shut down
  any suggestion that the wavefunction is a real physical entity, and they treat it
  as obvious that psi-ontic readings are confused. But the same colleague happily
  says that the wavefunction is ''real'' when explaining why Bell inequality violations
  cannot be explained by local hidden variables, and they agree that the wavefunction''s
  phase has physical consequences in interference experiments. I suspect the slogan
  is doing several different jobs at once, and that some of them are trivial, some
  are substantive, and some may be incompatible with what they say elsewhere."


  Then ask: "I want a menu of the precise claims that ''the wavefunction is just a
  bookkeeping device'' could be making. Do not give me a bibliography or citations;
  I want the conceptual disambiguation. For each reading, give: (a) a precise statement
  of the thesis; (b) what it commits you to about the relationship between the wavefunction
  and physical reality; (c) whether it is trivial, substantive but defensible, or
  false; (d) whether it supports the colleague''s use of the slogan to dismiss psi-ontic
  views; and (e) what other commitments it brings with it (e.g., about hidden variables,
  the completeness of quantum mechanics, the role of the agent, the status of the
  Born rule, or the meaning of ''beable'')."


  Then ask: "Make sure to include readings that distinguish: (i) the wavefunction
  as a representation of an agent''s information; (ii) the wavefunction as a statistical
  summary of an ensemble; (iii) the wavefunction as a nomological or law-like object;
  (iv) the wavefunction as a structural or relational feature of the world; (v) the
  wavefunction as a physical field or concrete entity; and (vi) any other reading
  you think is important. For each, say whether it is a psi-ontic, psi-epistemic,
  or neither/other view, and explain how it would handle the colleague''s two claims
  (the dismissal of psi-ontic views and the appeal to the wavefunction''s reality
  in Bell contexts)."


  Then ask: "Finally, tell me which reading you think the colleague most likely intends,
  which reading would actually license the dismissal, and whether there is a stable
  position that combines the slogan with the reality of the wavefunction in Bell contexts.
  Lay this out as a numbered list I can bring to the next meeting, with a short verdict
  at the end. Aim for precision and avoid reciting textbook summaries; I want the
  distinctions that matter for the argument."


