  is just a bookkeeping device." They deploy the line to shut down any suggestion
  that the wavefunction is a real physical entity, and they treat psi-ontic readings
  as confused. Yet the same colleague says that the wavefunction is real when explaining
  why Bell inequality violations cannot be explained by local hidden variables, and
  they agree that the wavefunction''s phase has physical consequences in interference
  experiments. I suspect the slogan is doing several different jobs at once, and that
  some of those jobs are trivial, some are substantive, and some may be incompatible
  with what they say elsewhere.


  I want a menu of the precise claims that "the wavefunction is just a bookkeeping
  device" could be making. Do not give me a bibliography, reading list, or citations;
  I want the conceptual disambiguation. Before laying out the menu, brainstorm the
  different senses of "real" and "bookkeeping" that might be in play. Then, for each
  reading, provide: (a) a precise statement of the thesis; (b) what it commits you
  to about the relationship between the wavefunction and physical reality; (c) whether
  it is trivial, substantive but defensible, or false; (d) whether it supports the
  colleague''s use of the slogan to dismiss psi-ontic views; and (e) what other commitments
  it brings with it—for example, about hidden variables, the completeness of quantum
  mechanics, the role of the agent, the status of the Born rule, or the meaning of
  a beable. Make sure the menu includes readings on which the wavefunction is: (i)
  a representation of an agent''s information; (ii) a statistical summary of an ensemble;
  (iii) a nomological or law-like object; (iv) a structural or relational feature
  of the world; (v) a physical field or concrete entity; and (vi) any further reading
