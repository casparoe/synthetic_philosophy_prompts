  I am a novelist. My current book is set in a small Atlantic fishing town — invented,
  but assembled from a dozen real ones — and its plot turns on a single night in 1919,
  when a cluster of houses on the eastern spit burned and the families who lived there
  were resettled inland. The town remembers that night with unusual precision: the
  date, the names of the dead, the identity of the men who profited, and a set of
  quiet annual observances that have been kept for a century. The record is thinner
  and less useful: a fire marshal''s report attributing the blaze to an overturned
  lamp, two letters from the cannery''s agent that are scrupulous in saying nothing,
  and a land transfer that went through with improbable speed. I have drafted a short
  essay to run as a coda to the novel, and I would like your comments on it. Here
  is the draft.


  [Essay — 4-5 paragraphs]


  Para 1: The usual advice given to a novelist who works from a real place is to subordinate
  memory to the archive... I no longer believe the archive deserves that deference,
  and I want to say why without pretending the alternative is simple. The archive
  is not the past; it is the residue of the past that someone with an interest in
  keeping paper chose to keep. To treat what survives as the neutral baseline against
  which memory is measured is to mistake a sample for a population — and a sample
  selected, in every case that matters to me, by the party with the most to gain from
  the selection.


  Para 2: Memory, meanwhile, is not a rival archive. It is a practice, and its claims
  are of two kinds that are usually run together. It claims that certain things happened;
  it also claims that the community that remembers them is the kind of community that
  would have been wronged in that way and would have borne it as it did. The second
  claim is not a proposition about 1919 that could be checked and found false. The
  first is. Much confusion follows from answering the first question with the authority
  proper to the second.


  Para 3: When the two conflict, I want to defend a limited asymmetry. The burden
  of proof should fall on the one who proposes to correct the community, not on the
  community itself. Two reasons. First, the costs of correction are borne by the corrected
  and the benefits — a cleaner record, a more defensible history — accrue largely
  to the corrector, so a symmetric standard quietly subsidizes the outsider. Second,
  the silences of the record are themselves evidence: the letters that say nothing,
  the transfer that moved too fast, are not gaps in the neutral sense but the trace
  of a decision to leave no trace. To read them as merely insufficient is to let the
  absence do the work of the presence.


  Para 4: I do not want the asymmetry to be absolute, and here the essay gets harder.
  Memory can be self-serving; a community can need a villain as much as a family can
  need an alibi; and the very features that make memory durable — repetition, ritual,
  communal rehearsal — are the features that let a later generation''s needs settle
  into what feels like the plain shape of the event. So I try to state the conditions
  under which the record should win: when the correction costs the community nothing
  it is entitled to keep, when the record''s silence can be explained without appeal
  to suppression, and when the memory''s stability can be shown to be a product of
  the telling rather than of the event. Whether those conditions are ever jointly
  satisfied I leave open.


  Para 5: The objection I cannot shake: that this is a licence for convenient falsehood,
  dressed as humility. My reply is that the asymmetry I defend is an asymmetry of
  burden, not of truth — it tells us who must argue, not who must win — but I am aware
  that in practice the two are rarely kept apart.


