  \ is worthless, and I have not been able to say where it breaks.\n\n(1) What makes\
  \ something a mind is its functional organization: if its parts stand to one another\
  \ in the relations in which a brain's neurons stand, then it has the mental states\
  \ that organization supports, whatever those parts happen to be made of. (2) The\
  \ ant colony is such a system: the traffic of the ants — the signals that recruit,\
  \ alarm, repair, and recruit again — mirrors the signal traffic of a cortex closely\
  \ enough that the same functional description applies to the colony as a whole,\
