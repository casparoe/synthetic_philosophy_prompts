  ---


  I have been trying to work out what I actually believe about thought shaping perception,
  going case by case, and I would like you to tell me what principle, if any, my verdicts
  add up to. I am not asking for a survey of what has been written about this; I want
  to know whether my pattern is coherent, what it commits me to, which of my verdicts
  it forces me to give up, and what it predicts about cases I have not considered.


  My cases and verdicts:


  1. Two equal horizontal lines, each with arrowhead fins at the ends, look unequal
  to me, and knowing that they are equal does not make them look equal. Verdict: this
  is not thought shaping perception. My belief is inert; it sits alongside the experience
  rather than inside it.


  2. When I have not eaten for a while, ambiguous blobs flashed on a screen resolve
  into food more often than they do after a meal. Verdict: not thought shaping perception,
  though I am uneasy. It feels as if my attention has been steered, not my eyes.


  3. A friend who was once bitten by a dog sees a calm dog on a leash as menacing
  and flinches before she can say what is wrong with it. Verdict: thought shaping
  perception. The dog looks different to her, not merely as though it merits a second
  look.


  4. A radiologist I know says she can see that something is wrong with an image before
  she can say what, and that after years of practice the shadows simply look different
  to her than they did at the start. Verdict: not thought shaping perception. Her
  experience changed, but no belief of hers did the changing.


  5. Shown a field of random gray speckle, I am told it contains a face. Once told,
  I see the face, and it is hard to recover the speckle. Verdict: thought shaping
  perception.


  6. Having learned a word for a shade that previously looked identical to its neighbor,
  I can now see the two shades as different at a glance. Verdict: thought shaping
  perception — though I notice this is hard to square with 4, since in both cases
  what changed me was training, not a belief I held at the time.


  7. I am told that a wine is expensive. It tastes better to me. Verdict: I am inclined
  to call this thought shaping experience, and I do not like the verdict, because
  it is the same wine.


  8. Someone who is convinced, on no evidence, that his partner is unfaithful sees
  ordinary friendliness as flirtation and cannot see it any other way. Verdict: thought
  shaping perception. This one unsettles me, because if the experience is shaped by
  the belief, the experience cannot then be the evidence for it.


  Tentative principle I would offer for testing: a case counts only if the state doing
  the shaping is a thought the person could avow — a belief, a suspicion, a fear that
  they would put into words — and it must figure in the experience as part of what
  the thing is seen as, rather than as a spotlight on part of it. If that is the principle,
  then 2 and 4 drop out, 1 drops out because the state, though avowable, does not
  figure in the experience, and 6 and 7 have to be decided by whether a learned discrimination
  or a price tag counts as "what the thing is seen as". I suspect this principle is
  doing too much work in the wrong place, but I cannot see where.


