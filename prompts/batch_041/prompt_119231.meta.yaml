  be dangerous: it can lead to "let the dead bury the living," distorting the past,
  making the present seem inferior, or justify fanaticism.

  - Antiquarian history: preserves and reveres the past, gives identity and contentment,
  but can mummify life, resist change, degenerate into blind collector''s piety.

  - Critical history: judges and condemns the past, breaks with it, but can be dangerous
  because we are products of the past, and it can lead to a rootless, unfair condemnation,
  or a second nature. Nietzsche says "we need history for life" but in excess it is
  harmful. The unhistorical and historical are both needed. The "suprahistorical"
  perspective sees the world as complete. History can be a "disease" when it dominates.
  The essay criticizes Hegelian historicism and the "historical culture" of 19th-century
  Germany. The "life" criterion: history should serve life, not the reverse. Nietzsche
  also discusses the "objective" historian, "the historical man" who becomes a passive
