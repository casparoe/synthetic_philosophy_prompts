  the affective dimension are fine, and moreover any theory tying badness to sensation
  is false..." Then it proves too much: it would show that pain in general isn''t
  bad in itself, undermining the reason to avoid causing pain in patients who can''t
  report, animals, etc. Or an argument that concludes we should be indifferent to
  pain.


