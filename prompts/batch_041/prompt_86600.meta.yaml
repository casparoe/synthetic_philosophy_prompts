  is applied consistently, it proves too much (dissimilarity would strip away everything
  and leave an un-Jewish, un-Christian figure we can''t reconstruct). Actually the
  "proves too much" argument with criteria of authenticity is a classic: the criterion
  of dissimilarity, applied strictly, yields only a handful of sayings, and those
  are the ones that are least likely to be authentic because a Jew who was wholly
  dissimilar to Judaism is implausible. That''s a nice "proves too much" — the argument:
  (1) a saying is authentic only if it''s dissimilar to both Judaism and the early
  church. (2) ... (3) so almost nothing is authentic; and yet (4) whatever survives
