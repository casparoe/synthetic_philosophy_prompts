  "Last night a friend and I argued for several hours about whether a theory can be
  ''right but early,'' and we got nowhere, so I''d like the analysis done properly.
  The episode we kept returning to is the 1980 wager between the biologist Paul Ehrlich
  and the economist Julian Simon. Simon offered to bet on the inflation-adjusted prices
  of any raw materials Ehrlich cared to name, over any period more than a year long;
  Ehrlich and two colleagues chose five metals — chromium, copper, nickel, tin and
  tungsten — each staked at $200 on the prices of 29 September 1980, with 29 September
  1990 as the settlement date. Ehrlich lost: all five metals were cheaper in real
  terms ten years later, and he sent Simon a check for $576.07. What makes the episode
  interesting to me is that the decade in question was also the decade in which world
  population grew by more than 800 million, the largest absolute increase in a single
  decade in recorded history. My friend''s view is that this is a straightforward
  refutation of Malthusianism, and that talk of a theory being ''right but early''
  is just the familiar refusal to accept a lost bet; he adds that the terms were rigged
  anyway, since the start date fell just after a commodity boom, so Simon was offered
  long odds on a mean-reverting basket, and that the whole thing measures the wrong
  variable. My view, which I couldn''t defend well at the time, is that a decade of
  metals prices is a strange proxy for a claim about the long-run relation between
  population and subsistence, and that ''right but early'' either names a genuine
  epistemic category or is a euphemism for unfalsifiability — and I''d like to know
  which."


