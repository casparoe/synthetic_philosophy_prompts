  pain in the sense that they can say where it is and how intense it is, but it doesn''t
  bother them—the awfulness or the suffering is gone or greatly reduced. Some descriptions
  say they don''t even flinch or guard the injured part; other descriptions say the
  withdrawal reflexes can still be there. Our instructor let us run with it, and two
  people in the class, Marta and Dev, got into a proper argument. I was just taking
  notes, but I couldn''t tell who had the better of it.


  Marta said: if you can have the sensation of pain without the suffering, then the
  badness of pain can''t be intrinsic to the sensation itself. What makes pain bad
  is the second thing—the unpleasantness, the ''ouch'' quality, the way it grips you
  and makes you want it to stop. So asymbolia is a natural experiment: it shows pain
  and the badness of pain can come apart. Dev said that''s too quick. He said pain
  isn''t bad just because it feels bad; it''s bad because it''s a signal of bodily
  damage, a perceptual representation of something wrong with you. A smoke alarm isn''t
  bad because its noise is unpleasant; it''s bad because it''s telling you there''s
  a fire. If asymbolia patients still have the signal, then their pain is still bad
  for them, even if they''re not bothered—maybe they''re just missing the alarm''s
  volume, not its content. Marta shot back that if they''re not bothered and don''t
  suffer, it''s hard to see what the remaining badness consists in. She said Dev was
  smuggling in the idea that the signal is bad for the person independently of how
  it feels, but a signal is only bad for you if it moves you or matters to you in
  some way; otherwise it''s just information. Dev said that can''t be right either,
  because we can be wrong about what matters to us—someone can be so depressed or
  so brain-damaged that they don''t mind a broken leg, but the leg is still broken
  and still bad for them. Marta said that''s exactly the point: if you say the pain
  is bad for them whether or not it ever enters their experience as something to avoid,
  you''re no longer talking about the badness of pain; you''re talking about the badness
  of tissue damage, which is a different thing. Dev said fine, but then Marta''s view
  makes the badness of pain entirely a matter of felt unpleasantness, and that seems
  to make it arbitrary—why should a certain raw feel be bad in itself? Marta said
