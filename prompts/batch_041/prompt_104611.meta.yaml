  Draft: The usual way of telling the sea-battle story is that if it''s true today
  that there will be a sea battle tomorrow, then tomorrow''s battle is already fixed,
  and if it''s false, then it''s already fixed that there won''t be one; either way,
  deliberation is an illusion. But I think that argument only gets its grip because
  we slide between two different notions of truth. Call them settled truth and scheduled
  truth. A proposition is settled true if the facts that make it true are already
  in place at the time of utterance. A proposition is scheduled true if it is true
  at the time of utterance but its truth-maker lies in the future — it''s not that
  the future event is already real, but that the proposition has a truth-value that
  will be grounded when the event happens or fails to happen. Under this distinction,
  future contingents can be scheduled true without being settled true, and bivalence
  is preserved without making deliberation pointless. The catch is that I need a principled
  account of what it means for a proposition to have a truth-value before its truth-maker
  exists. I try to say it''s like a promissory note: the note is real now, but its
  value is redeemed later. Is that just a metaphor that collapses under pressure?
