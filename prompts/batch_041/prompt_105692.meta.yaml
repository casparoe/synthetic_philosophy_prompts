  Here is my opening. I''ve been trying to make precise something I keep gesturing
  at, and I want to know whether it survives contact with someone who knows the formal
  literature. I want to distinguish two kinds of trap. In the first, the bad outcome
  is an equilibrium of a fixed game among a fixed set of players; escape means changing
  the payoffs — a contract, an enforcer, side payments, repetition, a change in what
  is common knowledge. Call these matrix traps. In the second, the set of players
  is endogenous: the bad outcome persists because the strategies that would escape
  are selected out of the population over time, not because any particular player
  finds escape unprofitable in the situation she faces. Cartel members who honor the
  agreement get outcompeted by entrants; the entrant who refuses to advertise is driven
  out by the firms that advertise; the state that regulates is outcompeted by the
  state that doesn''t. Call these composition traps. My claim is that the second class
  is not a special case of the first, and that this is where the Moloch label earns
  its keep. The reason is not that repetition fails — it''s that the escape condition
  is different in kind. In a matrix trap, the existing players can in principle bind
  themselves; in a composition trap, any binding arrangement among the existing players
  is itself a strategy in the larger selection process, so it is stable only if it
  is stable against the entry and exit of the very types it was meant to exclude.
  And I think this explains why so many proposed escapes from these traps look like
  they work on paper and then quietly fail: they are solutions to matrix traps applied
  to composition traps. So: where does this break? Give me the sharpest reason to
  think the distinction either collapses or is already fully captured by something
  in the formal literature I should have known about.


  Finish your reply with a short out-of-character note, clearly marked as such, separating
  what you take to be settled among specialists in this area from what is genuinely
  contested, and flag anything you asserted with more confidence than the state of
  the discussion warrants; do not present a contested view as the consensus."


