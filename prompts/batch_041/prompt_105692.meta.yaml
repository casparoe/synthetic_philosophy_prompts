  The asker''s distinction:

  - Type I traps ("matrix traps"): the bad outcome is an equilibrium of a fixed game
  among a fixed set of players. Escape = change payoffs (contract, enforcement, side
  payments, repeated play).

  - Type II traps ("composition traps"): the bad outcome is generated by a selection
  process over types — i.e., the population of players is endogenous and the bad outcome
  persists because the strategies that would escape are driven out of the population,
  not because they are unprofitable for any fixed player. Escape requires changing
  what kinds of agents exist or what they can commit to ex ante (e.g., altering the
  *type space* / entry conditions / commitment technology available before the game).


