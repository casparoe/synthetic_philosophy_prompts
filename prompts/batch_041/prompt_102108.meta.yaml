  "Construct a thought experiment to order for a unit on individual responsibility
  for collective harms. The target is the inefficacy objection: the claim that when
  one person''s contribution makes no difference to whether a collective harm occurs,
  that person has no moral reason to refrain. The scenario must satisfy the following
  constraints. (i) It is ordinary and contemporary: no trolleys, no science fiction,
  no benevolent dictators, no perfect information. (ii) The collective harm is real
  and serious, but it is produced by a large number of individually trivial actions.
  (iii) The individual whose action is in question is not a coordinator, not unusually
  influential, and has no special obligation. (iv) In the actual world, the harm occurs
  whether or not she acts; her token action is neither necessary nor sufficient, and
  no one will ever notice it. (v) Nevertheless, there is a plausible moral theory
  under which her action is impermissible, and a different plausible theory under
  which it is permissible. (vi) The disagreement must not be manufactured by building
  the verdicts into the case; it must fall out of the theories'' independent commitments.
  After the scenario: (a) identify the two theories and state precisely what each
  says about her action; (b) isolate the single feature of the case that makes the
  difference, and say what happens if that feature is removed; (c) explain how a defender
  of the permissive theory would try to defuse the case; (d) say whether the case
  is a counterexample to the inefficacy objection or merely a restatement of it."


