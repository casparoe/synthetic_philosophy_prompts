  only to check the decisive step, on the assumption that finding a mistake is easier
  than making one: the honest debater, it is said, can always answer a bad argument
  by locating the flaw in it, whereas the dishonest one has to keep a fabrication
  from unravelling.


  Now suppose we take seriously the obfuscation worry. A deceptive debater need not
  assert something false and stand by it; it can bury the false step in a long, technical,
  superficially valid argument whose flaw is real but hard to find. The honest debater
