  appear evasive when it cannot point to one, or concede that it cannot yet say where
  the argument fails, which the judge will read as losing. The dishonest debater has
  no such handicap: nothing constrains it to be legible, so it can make its opponent''s
  task arbitrarily hard while making its own case look clean. [also: the honest debater
  could obfuscate too but that would violate its brief.]


