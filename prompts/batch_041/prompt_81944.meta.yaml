  The asker: a student writing an essay/comment piece for a seminar. The essay''s
  thesis: The question "was the agricultural revolution a mistake?" conflates three
  distinct claims, and once separated, the interesting one is not the empirical one
  but the conceptual/normative one. Something like:


  Draft essay (~4 paragraphs):


  1. Framing: The debate is usually staged as Sahlins vs. Diamond. Sahlins (in "The
  Original Affluent Society", which became a chapter of Stone Age Economics) argued
  affluence is the satisfaction of wants, which can be achieved by producing much
  or desiring little, and that foragers took the latter route — hence "affluence without
  abundance". Diamond''s 1987 essay "The Worst Mistake in the History of the Human
  Race" argued that agriculture was a catastrophe: worse nutrition, more disease,
  more inequality, and that foragers had more leisure and better diets.


  2. My argument: The question is not one question. (a) Was the transition a decline
  in average individual welfare? (b) Was it a decline in aggregate welfare? (c) Was
  it a mistake — i.e., a choice made against the interests of the choosers, or a trap?
  (d) Was it the origin of inequality? I argue these come apart: (b) plausibly went
  up (more people, each perhaps worse off — a Parfit-style mere-addition issue, or
  the "repugnant conclusion" structure), and (d) is empirically false on the revisionist
  reading, since hierarchy predates farming.


  3. The inequality point in the weeds: The equation of agriculture with inequality
  is too neat. There were sedentary, hierarchical, non-farming societies — the Northwest
  Coast, with hereditary rank and slavery, the Calusa of Florida, the Chumash; and
  there is archaeological evidence of status differentiation among foragers, e.g.
  the Upper Palaeolithic burials at Sungir with thousands of ivory beads, and Mesolithic
  cemeteries like Vedbæk and Skateholm with grave goods. Woodburn''s immediate-return
  vs delayed-return distinction is the right axis: hierarchy tracks the possibility
  of storing and inheriting wealth, which some foragers have and some don''t. Also
  Graeber & Wengrow''s point in The Dawn of Everything that the Neolithic is not a
  single revolution and that early farming towns like Çatalhöyük look relatively undifferentiated.


  4. The affluence point in the weeds: The "15-20 hour work week" figure comes from
  Lee''s Ju/''hoansi work and excludes food processing and cooking; counting those,
  the figures are more like 40+ hours. And the societies measured were often those
  pushed onto marginal land by farmers — Diamond himself concedes this — which biases
  the sample. Also the Hadza work longer. So the empirical foundation of "affluence"
  is shakier than the slogan suggests; but note the conceptual point survives: if
  affluence is defined by the gap between wants and satisfaction, it''s not an empirical
  quantity at all, and you can''t refute it with work-hour data. That''s the interesting
  thing.


  5. Conclusion / what I''m asking: I want comments. Specifically: (i) is the three/four-way
  distinction the right decomposition, or does it collapse; (ii) are the empirical
  claims accurate and where should I hedge; (iii) does the "trap" framing (Boserupian
  population pressure) actually rescue the "mistake" language or make it incoherent
  (a mistake requires an agent and an alternative); (iv) is the essay interesting,
  or does it just restate the consensus.


