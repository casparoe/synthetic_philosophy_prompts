  Draft the summary (~150-200 words):


  "Friedman settled this decades ago. In his 1953 essay he argued that the realism
  of a theory''s assumptions is irrelevant to how good the theory is; the only test
  that matters is whether the theory yields accurate predictions. Hence his notorious
  claim that the more significant the theory, the more unrealistic the assumptions
  — unrealism is a sign of theoretical power, not a defect. His illustration is the
  billiard player who [quote] — we don''t need players to solve the equations, only
  to play as if they had. Likewise, firms can be modelled as profit maximizers even
  though no manager literally computes marginal revenue, because the assumption, whatever
