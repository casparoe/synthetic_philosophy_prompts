  made noise about ''unrealistic assumptions'' for seventy years, but the complaints
  rest on a confusion: they want assumptions to be descriptive, which is a demand
  for a photograph rather than a map. So when someone objects that a model assumes
  perfect information or zero transaction costs, the correct reply is that this is
