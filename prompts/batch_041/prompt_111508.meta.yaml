  more general and hence more useful the theory, and no empirical work on the assumptions
  themselves is called for."


  Errors embedded:

  1. "unrealism is a sign of theoretical power, not a defect" — overstatement: Friedman''s
  "more unrealistic the assumptions (in this sense)" is qualified; the sense is that
  a significant theory abstracts from many circumstances and explains much by little;
  it''s not a general rule that falsity is a virtue.

  2. "the only test that matters is whether the theory yields accurate predictions"
  — roughly Friedman''s instrumentalism, but "the only test" overstates; Friedman
  also allows that assumptions matter as a way of specifying the theory, that comparison
  among theories involves both simplicity and fruitfulness, and he does think assumptions
  like "not maximizing" can be relevant when they signal a domain where the theory
  fails. Also Friedman''s criterion is about predictions of the class of phenomena
  the theory is designed to explain, and he emphasizes testing rather than mere fit.
  Also: Friedman says a theory is "not to be tested by the realism of its assumptions"
  but he also insists the assumption of profit maximization is defended on the grounds
  that it works well; and he distinguishes "the assumption" as an indirect statement
  of the theory.

  3. "no empirical work on the assumptions themselves is called for" — this is the
  overreach: Friedman''s own practice was to defend the maximization hypothesis empirically
  (by appeal to survivorship/natural selection of firms that behave in accordance
  with it, and the "economic calculus" argument). Also the "as if" formulation is
  not a license for untestable assumptions; Friedman insists the hypothesis must be
  testable against evidence and that it must not be internally inconsistent.

  4. "the more the assumptions are idealized, the more general and hence more useful
  the theory" — conflates idealization-for-generality with falsity; also conflates
  "unrealistic" with "idealized"/"abstract."

  5. "Critics... want assumptions to be descriptive, which is a demand for a photograph
  rather than a map" — the map metaphor is fine, but it mischaracterizes critics:
  many critics (e.g., the "unreal assumptions" literature) argue not that assumptions
  must be descriptive but that they can be false in different ways, and that some
  assumption errors matter for the domain of application, that testing assumptions
  is sometimes the only available test (measurement without theory debate), etc. Also
  Friedman himself famously said... hmm.

  6. Another possible error: "Friedman settled this decades ago" — the essay is contested,
  no consensus; and it''s about the methodology of positive economics, not a settled
  result.

