  The essay (as the asker, formal register):


  Thesis: Kierkegaard''s attack on "the press" is usually read as a lament for a lost
  world of face-to-face community, i.e., a critique of scale. But his actual target
  is a specific structural feature: the press produces an audience that is addressed
  and formed without ever assembling and without being answerable. His famous complaint
  is about "the public" — a phantom, a nobody, "a monstrous abstraction". The key
  is not size but the fact that the public has no location and no member: no one is
  the public, and so no one can be held to anything said to or by it. Hence his charge
  that the age of the press is the age of "chatter": talk that circulates without
  a speaker who stands behind it. This explains why his remedy is not better journalism
  but "silence" and "the single individual".


