  unindividuated, but present and capable of action — potentially violent), (ii) the
  anonymity of the medium (nobody is present; speech without a speaker). I claim Kierkegaard''s
  "crowd is untruth" line is about (i) but his press critique is about (ii), and that
  conflating them makes him look like a snob when he''s actually making a structural
  point.


