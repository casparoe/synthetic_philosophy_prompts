  ---


  I am assembling discussion materials for a small reading group on the philosophy
  of language, and I would like a written dialogue rather than an essay. The group
  is working through the sceptical reading of Wittgenstein associated with Saul Kripke,
  on which there is no fact of the matter about what a speaker means by a word — nothing
  over and above the totality of their past and present dispositions to apply it —
  and I want to test that reading against an example of my own devising, so that the
  discussion cannot simply recycle the standard arithmetic illustrations.


  Please write a dialogue between two members of the group, Anna and Benedict, who
  take opposing sides. The example they are arguing about is a private signal code
  invented by two housemates: a card propped against the kettle is red when the water
  has just gone on, amber while the tea is brewing, and green when the tea is ready
  to pour. They use the code without incident for two years, always leaving the card
  in exactly the positions their rule dictates, and neither of them ever errs. Then
  a third person joins the household and is taught the code in a single sentence;
  a week later she leaves a card propped at a slight angle that neither of the inventors
  has ever produced before, and the two of them disagree about whether it means the
  tea is ready. Anna takes the sceptical line: she argues that the finitely many past
  uses and the inventors'' habits of mind are equally consistent with countless different
  rules, including monstrous ones that would have them doing something quite different
  the very next time, so that the dispute about the tilted card has no determinate
  answer to be discovered. Benedict resists this: he maintains that the rule was genuinely
  fixed when the code was set up, and that the fact that both inventors would confidently
  go on in the same way is not merely a fact about their habits but a fact about what
  they meant. Please let each of them answer the other''s actual points rather than
  talking past one another — in particular, Anna should press the difficulty that
  a disposition tells us only how someone would go on, not how they ought to, and
  Benedict should say what, if anything, he thinks grounds the difference between
  going on correctly and merely going on as one is inclined to. Neither of them should
  be made to look foolish, and the exchange should end without a tidy resolution if
  that is where the arguments lead. Kindly write the dialogue in British English.


