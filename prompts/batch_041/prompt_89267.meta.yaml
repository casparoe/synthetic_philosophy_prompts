  Domain: Self-deception. Commitments:

  1. Self-deception is a real phenomenon; the standard examples (the jealous spouse
  who ignores evidence, the patient who avoids a diagnosis) are not just weakness
  of will or lying to oneself in a metaphorical sense.

  2. Self-deception is motivated: the person''s desire that p be true plays a causal
  role in producing the belief that p.

  3. Doxastic voluntarism is false: one cannot believe p at will, directly, just by
  deciding to.

  4. Beliefs are formed by evidence and are sensitive to evidence; a belief that is
  not sensitive to evidence is not a belief at all.

  5. In self-deception, the person both knows the truth and believes the false thing;
  the contradiction is real but confined to different "compartments" or "sub-systems"
  of the mind.

  6. Self-deception is not intentional in the ordinary sense: the person does not
  decide to deceive herself, and would often sincerely deny doing so.

  7. The paradox is dissolved by treating self-deception as a diachronic process of
  biased evidence-gathering, not as a simultaneous state of contradictory belief.


