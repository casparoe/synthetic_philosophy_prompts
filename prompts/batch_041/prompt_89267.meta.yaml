  Prompt:

  "I am a PhD student in philosophy writing a prospectus on intention and practical
  rationality, and I want a consistency audit of the commitments I have been working
  with. Here is the package: (1) Intentions are not reducible to predictions or desires;
  to intend to φ is to be committed to φ-ing in a way that is distinct from merely
  expecting that one will φ. (2) An agent cannot intend to φ at t1 if at t1 she knows
  that she will not φ at t2. (3) In Kavka''s toxin puzzle, the agent can rationally
  form the intention at midnight to drink the toxin at noon, and then rationally decline
  to drink at noon once the money is secured. (4) Rationality is time-slice local:
  the rational choice at a time maximizes expected utility from that time forward,
  treating future rational choices as fixed. (5) The toxin puzzle is a genuine counterexample
  to the thesis that it is irrational to intend to do something one knows one will
  not do. (6) Intentions can have causal effects that are not reasons for the intended
  action itself; the intention to drink the toxin can secure the reward even though
  the reward is not a reason to drink. (7) The toxin puzzle does not show that intentions
  are epiphenomenal or that practical rationality is impossible. I suspect some of
  these pull against each other, but I am not sure which. Please audit the package..."


