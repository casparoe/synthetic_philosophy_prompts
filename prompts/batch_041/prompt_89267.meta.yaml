  Classic puzzle: Billionaire offers $1M if you intend at midnight to drink a toxin
  at noon tomorrow. Toxin makes you ill but not permanently. At midnight, you must
  form intention; if you do, money is deposited. At noon, you can drink or not. If
  you''re rational, at noon you won''t drink (no further benefit, only illness). So
  can you rationally intend at midnight? If you know you won''t drink, can you intend?
  The puzzle is that it seems rational to intend, but intention requires belief? There
  are various solutions.


  Commitments:

  A. Intentions are distinct from desires and predictions; to intend to φ is to be
  committed to φ-ing, not merely to predict that one will φ.

  B. An agent cannot intend to φ at t1 if she knows at t1 that she will not φ at t2.
  (This is a "belief constraint" on intention: intending to φ requires not believing
  one won''t φ.)

  C. In the standard toxin puzzle, the agent at midnight can rationally intend to
  drink the toxin and, having secured the reward, rationally decline to drink at noon.

  D. Rationality requires maximizing expected utility at the time of action; later
  choices are not constrained by earlier intentions except instrumentally.

  E. The toxin puzzle is a genuine counterexample to the thesis that it is irrational
  to intend what one knows one will not do.

  F. The toxin puzzle does not show that intentions are causally inert; intentions
  can have effects (e.g., securing reward) that are not reasons for the intended action
  itself.


