  Paragraph 1 (essay):

  "The standard move in my seminar is to say that the no-free-lunch theorems give
  Hume a formal proof. Wolpert and Macready showed that averaged over all objective
  functions, no search algorithm beats any other; so, the argument goes, there is
  no a priori justification for expecting any inductive method to work, and the problem
  of induction is a theorem rather than a puzzle. I want to argue that this reading
  gets the theorem''s direction of fit backwards. The average in question is taken
  over a uniform measure on the space of all functions from inputs to outputs — a
  measure that assigns overwhelming probability to functions with no structure whatsoever,
  since a uniformly drawn lookup table is incompressible with probability approaching
  one. So the theorem''s neutral, assumption-free vantage point is itself a substantive
  prior: it is the prior of an agent who is certain the world has no pattern. Relative
  to that prior, of course no method beats guessing on average; that is what ''no
  pattern'' means. The theorem therefore cannot be used to underwrite inductive scepticism,
  because it presupposes anti-induction in the choice of measure. If you instead average
  over a hypothesis class small enough to be described briefly — the computable functions,
  or the smooth ones, or those satisfying a locality constraint — a free lunch appears
  immediately: weighting hypotheses by description length, or simply preferring the
  simplest fit, does better than chance in the long run. So the NFL theorems do not
  show that induction is unjustified; they show that a free lunch and an assumption
  about the environment''s structure are the same thing under two descriptions."


  Paragraph 2 (essay continues with the regress + injection):

  "The obvious reply is to ask what justifies the structured prior rather than the
  uniform one, and here I want to press a distinction I have not seen made cleanly,
  between a first-order inductive bias, which is a restriction on the hypothesis class,
  and a second-order bias, which is a prior over hypothesis classes. The NFL result
  defeats the fantasy of first-order neutrality: some bias is unavoidable. But it
  does not stop there, because the choice of second-order prior is itself a search
  problem over a space of priors, and the same permutation argument applies one level
  up — average over all second-order priors and no second-order method beats any other.
  The regress is genuine, and it terminates only in something that is not itself a
  bias: either a brute contingent fact about this world, namely that it is compressible
  in the particular ways our priors expect, or an empirical fact about us, namely
  that we and our learning algorithms were selected in this world and therefore carry
