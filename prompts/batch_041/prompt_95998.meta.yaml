  Key claims to be accurate about:

  1. NFL theorems (Wolpert & Macready, 1997): roughly, averaged over all objective
  functions (or over any set closed under permutation), all search algorithms have
  the same performance distribution. So no algorithm is uniformly better.

  2. This is a "no free lunch" in the sense that superior performance on one class
  of problems is paid for by inferior performance elsewhere.

  3. Inductive bias is therefore necessary, not optional.

  4. The averaging measure: uniform over all functions f: X → Y. This uniform measure
  is a prior. Objection: the uniform measure over all functions is not a neutral,
  assumption-free measure; it''s a specific prior that assigns probability 1 (or overwhelming)
  to maximally "random" (incompressible, unstructured) functions. So the theorem says:
  relative to a prior that says the world is maximally unstructured, no method beats
  guessing on average. But that prior is precisely the denial of the inductive assumption.
  So the NFL theorem can''t refute induction without assuming anti-induction.

  5. Conversely, if you restrict to a "small" hypothesis class (e.g., functions with
  short descriptions, or smooth functions), you get a free lunch: there''s a method
  (e.g., Solomonoff-style weighting by description length, or just "fit the simplest
  hypothesis") that does well on average over that class. So the existence of a free
  lunch is equivalent to a compressibility/simplicity assumption about the environment.

  6. So the problem of induction is relocated, not solved: it becomes the question
  "why is our world compressible/structured in the way our priors assume?" And there''s
  an argument that this is a contingent, empirical fact — the universe has low algorithmic
  complexity relative to the space of possible universes — and that this fact is itself
  the kind of thing we learn inductively (circularity) or that it''s a brute fact.

