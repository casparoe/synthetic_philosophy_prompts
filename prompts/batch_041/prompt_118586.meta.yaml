  the flame touches it, and we say the fire burned it. Al-Ghazālī says we have not
  seen that and could not. What we have is the conjunction of two events and a habit
  of expectation; the connection itself is not observed and cannot be demonstrated.
  Fire, he adds, is an inanimate body, and an agent in the strict sense is one whose
  act proceeds from will and knowledge, which fire has not got. If burning belonged
  to fire by its nature, moreover, it would burn whatever came near it, and we know
  that some things resist it. On his account the burning is created — by God, either
  immediately or through the mediation of an angel — at the moment the cotton meets
  the flame, and the regularity we call a law of nature is God''s custom, dependable
  enough for any laboratory, revocable without notice. A miracle, on this view, is
  not a violation of a necessity; it is a change in a habit. What interests me is
  that he is not saying the world is lawless or that prediction fails — his fire burns
  my cotton every time — and that he is honest that he cannot disprove the philosophers''
  rival account of a power in the fire, only demand that they prove it. It is the
  same conclusion Hume reaches about necessary connection, with the necessity moved
  out of the world and paid for in two currencies: custom, or God.


