  I''ve been trying to reconstruct the argument from the old dispute over whether
  dreams are experiences — the side that says a dream is nothing over and above the
  impression we have on waking — and I''ve made it cleaner than I found it, which
  worries me. Here it is.


  (1) When I remember an experience of mine, the memory-report answers to something:
  the experience itself, its traces, or the testimony of others who were present.
  In principle it can be checked, and in principle it can turn out false.


  (2) A dream report answers to nothing of the kind. No one else is present at the
  dream; once awake the dreamer has only the impression of having dreamed; and no
  scar, photograph, or second witness can confirm or disconfirm that I dreamed last
  night of being chased.


  (3) So the only thing that settles whether someone dreamed, and what they dreamed,
  is their own sincere waking report.


  (4) A report settled by nothing but the reporter''s sincerity does not describe
  an occurrence standing behind the report; it describes the reporter''s present state
  — the impression, or the disposition to give the report.


  (5) Hence a dream is not an experience that occurs during sleep. It is a waking
  phenomenon: the memory-impression that greets us on waking.


  (6) Hence the received view that dreams are experiences is false.


