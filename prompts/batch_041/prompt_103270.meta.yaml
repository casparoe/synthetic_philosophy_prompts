  Draft:


  "I''m a doctoral student in political theory, and I''ve been working on a puzzle
  about conditional amnesty that I can''t resolve. The model I keep returning to is
  the one pioneered in the mid-1990s and imitated since: a truth commission empowered
  to grant amnesty to individual perpetrators of gross human rights violations, on
  the conditions that the act was committed for a political objective and that the
  applicant makes full disclosure of it. Nothing in the scheme requires remorse, apology,
  or any change of heart; the currency is information, not contrition. Amnestied perpetrators
  are not merely spared prison — they keep their pensions, their professional licenses,
  and in some cases their positions, while victims'' families receive a modest state-funded
  payment and a name and a paragraph in the commission''s published record, which
  the state adopts as the official account of what happened.


  What I find hard to make consistent is the surrounding posture of the same state.
  It continues to punish ordinary violent crime severely, it insists publicly that
  impunity is intolerable, and its own legal order treats the failure to punish atrocity
  as a standing embarrassment. Meanwhile, the amnesty is defended in two mutually
  uncomfortable registers at once: as a tragic concession, justice traded away for
  the sake of peace, and as a higher form of justice — ''restorative,'' victim-centred,
  more truthful than a trial. So I want you to reconstruct what the practice actually
  presupposes, and then push on it. What theory of punishment is doing the work here
  — is amnesty intelligible only against a background view that punishment is for
  the future (deterrence, reform, incapacitation), or can a desert-based or expressive/communicative
  view also accommodate it? Whose wrong is it taken to be: does the state''s ability
  to waive the claim presuppose that the primary injury was to the political order
  rather than to particular victims, and if so, what happens to the victims'' standing
  when they are given a payment and a paragraph instead of a verdict? Does the design
  presuppose that the state''s own title to punish was compromised by its complicity
  in the crimes — so that amnesty is less mercy than a settlement among wrongdoers?
  Distinguish what the practice strictly requires from what it merely fits, and tell
  me whether it is philosophically coherent or merely politically expedient. Finally,
  say what would have to change if one replaced the implicit theory with (a) a straightforwardly
  retributive one and (b) one that abandons desert altogether and treats perpetrators
  as risks to be managed. Where, if anywhere, does the practice''s own logic force
  it toward a conclusion its defenders resist?"


