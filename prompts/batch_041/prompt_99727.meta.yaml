  Prompt text:


  I cover science and ideas for a general-interest magazine, and next month I am leading
  a forty-five-minute salon at a literary and ideas festival on how conventions harden
  into norms — and why they so often outlive the coordination problems that first
  made them useful. The audience will be educated non-specialists: a few will have
  read some philosophy, most will not, and a handful will be policy people who care
  about norm change. I want you to plan the explanation for me, not deliver it. I
  am not asking for a reading list, citations, or a survey of the literature; I need
  a teaching sequence.


  The intellectual spine I want to build on is David Lewis''s account of convention:
  a regularity in behavior that solves a recurrent coordination problem, where everyone
  prefers to conform given that others conform, and where there are alternative regularities
  that would have worked just as well. But I want the talk to end somewhere Lewis
  does not quite take it. A researcher I have been interviewing describes what she
  calls normative lag: a regularity that began as a Lewis-style solution to a coordination
  problem can persist after the original problem has vanished, and can then acquire
  the feel of an independent obligation — people follow it, expect others to follow
  it, and resent deviation, even when no one''s interests are coordinated by it anymore.
  I want the audience to understand both the original mechanism and this drift from
  convention to norm.


  Please give me a plan with the following elements. First, the order in which the
  ideas must be introduced, with an explicit account of what depends on what; tell
  me where the audience will be tempted to jump ahead and why that jump would break
  the argument. Second, the single carrying example that should do most of the work.
  I am tempted by the old standbys — driving on one side of the road, or standing
  on the right of an escalator — but if one of those is the wrong choice, say so and
  tell me what should replace it, what features the replacement must have, and what
  it must avoid. Third, the misconceptions you expect this audience to bring or form:
  for instance, that a Lewis convention is just a shared habit, that it requires an
  explicit agreement or a promise, that common knowledge is merely mutual belief,
  that norms are simply conventions plus punishment, or that normative lag is a story
  about biological evolution. Tell me where in the sequence each misconception is
  most likely to appear and exactly how I should head it off. Fourth, one question
  I can put to the room near the end that would show whether they have grasped the
  difference between a coordination equilibrium and a norm with independent normative
  force, rather than merely memorized the vocabulary. Fifth, what I should deliberately
  leave out at this level — the formal apparatus, the infinite hierarchy of common
  knowledge, the debates about whether Lewis''s account is reductive — and how I should
  signal that omission without making the audience feel cheated.


  I would like the plan to be concrete enough that I can rehearse from it, and honest
  about the places where the audience is likely to resist. Where a term is unavoidable
  but potentially misleading, tell me whether to keep it, replace it, or define it
  on the spot.


