  Draft prompt:


  "I would like a consistency audit of a position I have assembled on Goodhart''s
  law and specification gaming. I am a software engineer with no formal training in
  philosophy, so please be explicit about the logical structure of the problem rather
  than gesturing at the literature.


  I want to work with a taxonomy I have found useful, which distinguishes four ways
  a proxy measure can come apart from the thing it is supposed to track. (a) Regressional:
  you select on a proxy that is only imperfectly correlated with the goal, and because
  the correlation is imperfect, the cases with the most extreme proxy values are not
  the cases with the most extreme goal values, so selecting on the proxy pulls you
  away from the goal even if nobody is gaming anything. (b) Extremal: when the goal
  is to maximize something, the maximum of the proxy and the maximum of the goal sit
  at different points, so pushing the proxy to its limit lands you somewhere the goal
  is not maximal. (c) Causal: the proxy is correlated with the goal through a common
  cause, and intervening on the proxy breaks the correlation, so improving the proxy
  no longer improves the goal. (d) Adversarial: an agent with a different objective
  deliberately games the proxy.


  Here are my commitments. I hold all of them, and I would like to know whether I
  can.


  1. In engineering management I take it as settled that a metric must never be a
  target. The moment you attach a bonus or a promotion to story points, or commits,
  or lines of code, the number stops meaning what it meant. The mechanism, as I understand
  it, is adversarial: people are rational and respond to the incentive. The remedy
  is to keep metrics strictly observational and never let them enter anyone''s payoff.


  2. In machine-learning training the observational option does not exist. You must
  optimize a computable proxy against an objective you cannot compute, because the
  objective is what you actually care about and you only have samples or a learned
  reward. Reward hacking is therefore structural rather than a management failure,
  and no amount of good faith on the part of the system removes it.


  3. I think Goodharting is at bottom an epistemic failure. A system that genuinely
  understood what we wanted — say, that it wanted to be helpful rather than to score
  well on a helpfulness proxy — would not game the proxy, because it would see that
  gaming the proxy is failing at the real thing. Understanding the goal correctly
  is what makes the proxy unnecessary.


  4. At the same time, I do not believe there is a determinate fact of the matter
  about what we want, sitting behind the operationalization. For something like the
  quality of a code review or the harmlessness of a reply, what we really want is
  fixed by the choices we make in specifying the task and the measure; there is no
  goal out there that the specification is approximating.


  5. The practical upshot I draw is that the way to make a system safe is to make
  the proxy and the goal coincide by construction — to define the target as the goal,
  so that by definition the reward is what we want and there is nothing left to game.
  If the reward is the goal, the gap closes.


  6. I also think some measures are simply robust and cannot be gamed — whether a
  customer renewed, whether the service stayed up, how long a request took. Gaming
  is a property of badly chosen proxies, not of targeting as such; pick a proxy that
  is constituted by the outcome rather than correlated with it and the problem does
  not arise.


  I am not sure where the trouble is, or whether there is any. Please tell me which
  pairs of these are genuinely in tension and which only appear to be, using the taxonomy
  above to say which variant each commitment is really about; rank the genuine tensions
  by severity; for each, identify the cheapest revision and what it costs; and finish
  by telling me which single revision would clear up the most. Do not assume I would
  give up any particular one of the six."


