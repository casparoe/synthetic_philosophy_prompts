  Domain choice: "Simone Weil''s views on political parties" seems great for a procedure.
  Weil''s idea that political parties are organs of collective passion, that the party
  is a machine for generating collective passion, that truth is banished — "the party
  is a mechanism for manufacturing collective passions." Her essay "Note on the General
  Suppression of Political Parties" (from On the Abolition of All Political Parties)
  proposes abolishing parties. Also her claim that a party''s essential aim is its
  own growth, not truth; that the party''s members submit to the collectivity; that
  "the party is a mechanism to create and maintain collective passions." Hmm, need
  to be careful about quoting. I won''t quote verbatim unless I fetch.


  I could avoid quotation marks entirely, paraphrasing Weil''s ideas in my own words
  — that''s fine.


  Type: procedure a practitioner can follow. Role ideas: someone who runs a membership
  organization — e.g., a chair of a professional association''s ethics committee,
  or a local political party''s internal governance, or a union branch, or a scientific
  society. Or a chair of a deliberative body drafting bylaws. Weil''s critique: parties
  subordinate thought to collective passion, enforce orthodoxy, treat members as means,
  aim at power not truth. A procedure: a "loyalty-pressure audit" for a membership
  organization — how to tell when your group has crossed from a vehicle for shared
  aims into a Weil-style party.


  Better: the asker is, say, the chair of the bylaws committee of a state chapter
