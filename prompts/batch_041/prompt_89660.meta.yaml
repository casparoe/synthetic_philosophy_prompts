  that she is in Red. Some propose updating by minimizing the Kullback-Leibler divergence
  from her prior subject to the constraint that the posterior conditional probability
  of headquarters given Red equals 1; others argue this is arbitrary because many
  posterior distributions satisfy the constraint, and still others say the right response
  depends on the source''s selection process. In your essay, take a stand: defend
  a particular updating rule (or defend the claim that no unique rule exists) and
  justify it by appealing to general epistemic principles, not to authority. Consider
  at least one objection to your view. Also address whether the answer changes if
  the source is known to be more likely to make the conditional claim when it is true
  than when it is false."


