  in; there is no further fact of the matter.

  (5) If there is no fact of the matter about countability, there is no fact of the
  matter about size at all, and Cantor''s theorem tells us nothing about sets — only
  about what can be said within a formalism.

  (6) Therefore the apparent existence of different sizes of infinity is an artifact
  of notation, and the ''uncountable'' sets of mathematics are as fictional as the
  ''phlogiston'' of chemistry.


