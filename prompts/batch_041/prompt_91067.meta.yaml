  In particular, would a universal prior that favors short descriptions—if it can
  be shown to dominate on the class of computable worlds—count as a genuine free lunch,
  or does it merely shift the unjustified assumption into the choice of that class?
  Separate what is settled from what is genuinely contested among people who know
  this literature, and do not present a contested interpretation as the consensus."


