  ---


  I am a graduate student in philosophy preparing a short paper for a seminar on the
  metaphysics of action, and I would like you to read it as a demanding but constructive
  referee — someone who knows the killing/letting-die literature thoroughly and has
  also worked on the metaphysics of causation and omissions. Before you write any
  comments, please spend a few lines brainstorming the strongest objections the paper
  invites, and then organize your comments around them; I would rather have three
  objections that could sink the paper than a dozen small suggestions. Please also
  say, at the end, which single premise is doing the most work and how the paper would
  fare if I gave it up.


  The paper''s thesis is that the killing/letting-die distinction should be drawn
  relative to what I call the agency baseline: the course of events that would have
  unfolded had the agent been entirely inert — paralyzed, not merely abstaining —
  at the moment in question. An act, on this view, is a departure from that baseline;
  an omission is a continuation of it. The usual contrast cases come out as one would
  hope (the doctor who switches off the ventilator departs from the baseline and kills;
  the one who never starts it does not and merely lets die), and the account is deliberately
  mechanism-relative: it treats the classification as a fact about what the world
  would have done on its own, not about which muscles moved. To test it I have built
  the paper around a case I call the inverted pump. In a neonatal unit the standard
  infusion pump is replaced by a fail-open model: unless a nurse keeps a lever held
  down, the drug runs. Nothing else changes — same drug, same dose, same baby, same
  intentions on the nurse''s part. Under the old mechanism, a nurse who wanted the
  infant to die had only to walk away, and we would say she let the infant die. Under
  the new one she must actively hold the lever down for as long as she wants the drug
  withheld, and the moment she releases it she is doing nothing with her hand while
  the drug flows and the infant dies. My claim is that the agency baseline keeps the
  verdict stable across the two mechanisms — she lets die in both cases, since death
  is precisely what the baseline delivers — and that this stability is a point in
  the account''s favour rather than an embarrassment, even though I concede that the
  phenomenology, and probably most people''s intuitions, flip. The second half of
  the paper argues that the residual discomfort is best explained by the fact that
  we ordinarily read the baseline off social and mechanical convention rather than
  off counterfactual inertia, and that this explains something the standard accounts
  do not: why clinicians who insist that withholding and withdrawing are morally on
  a par still describe them differently, and why the difference tracks what the doctor''s
  body would be doing at the moment of death rather than any difference in outcome.


  I would like your comments on three things in particular. First, accuracy: is the
  agency baseline a coherent notion, or does it smuggle in a choice of baseline that
  is doing the moral work under another name — in particular, is the relevant counterfactual
  the world with the agent inert, the world with the agent absent, or the world with
  the agent inert but having performed whatever preparatory acts she in fact performed?
  Second, whether the inverted pump really is a case where the classification should
  stay fixed, or whether the intuition that it flips is a datum the account has to
  accommodate rather than explain away. Third, interest: is there anything here that
  a reader who already knows the standard literature would find new, or am I just
  re-labelling a familiar position? If the latter, tell me which familiar position
  it collapses into and what the shortest route to a genuinely different one would
  be.


