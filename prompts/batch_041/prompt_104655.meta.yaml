  Member A: ''The rule is law. It was validly adopted by the body that had authority
  to adopt it, it is on the books, and it has been applied consistently. Whether it
  is unjust is a separate question, and a real one — but answering it does not change
  the fact that this is a valid rule of this institution. The whole point of keeping
  validity and morality apart is that it forces us to say plainly: this is law, and
  it is unjust, and now we must decide whether to obey it anyway. If we instead declare
  that unjust rules are not law, we get to feel righteous while hiding the real choice.''


  Member B: ''That is exactly the laundering I object to. A rule that offends a certain
  threshold of injustice forfeits its claim to be law; calling it law lends it an
  authority it has forfeited. And in this case we do not even need the moral threshold.
  Look at how the rule was made and applied: it was never properly promulgated to
  the people it binds, it was applied retroactively to conduct that predated it, and
  it demanded something that could not reliably be done. A rule that fails those requirements
  is defective on the law''s own terms — it is not merely unjust, it is not law. The
  institution''s own craft, not my moral preferences, disqualifies it.''


  Member A: ''Then your second argument gives away the first. Generality, promulgation,
  prospectivity, clarity, consistency — a system can satisfy every one of those and
  still be monstrous. The most efficient persecutions are perfectly clear and perfectly
  consistent. So the ''inner morality'' you invoke does not protect a single person
