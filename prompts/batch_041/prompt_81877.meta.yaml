  Hmm, the false presupposition: that WKR = non-evidential reasons. Actually careful:
  many take the WKR problem to arise for reasons for *any* attitude, and there''s
  debate about whether the "wrong kind" is exhausted by "state-given" reasons. Also,
  some argue there are non-evidential but *right-kind* reasons for belief (e.g., reasons
  of a kind like "your epistemic situation"? or practical reasons that are right-kind?).
  And there are "right-kind" pragmatic reasons for belief (e.g., reasons from the
  value of believing, like the "truth-promoting" ones?). Hmm. Also, importantly, the
  WKR problem was originally raised for *fitting-attitude analyses of value* — the
  issue is that if value = being a fitting object of a pro-attitude, and there can
  be wrong-kind reasons for that attitude, the FA analysis can''t distinguish value
  reasons from other reasons. So the asker''s assumption that it''s about belief/wishful
  thinking misses that it''s a problem for the analysis of value. And the claim that
  "wrong-kind = non-evidential" is wrong: the WKR cases are precisely those where
  the reason is a perfectly good reason to *do* something (or to *want* the state),
  and the puzzle is about whether such reasons bear on the attitude at all; also there
  are right-kind reasons for belief that are not evidence (e.g., "your evidence is
  incomplete; you should suspend"? no that''s not a reason for belief). Also there''s
  the "state-given" vs "object-given" distinction and the objection that some state-given
  reasons are right-kind (e.g., reasons for intending based on the value of intending).
  And there''s a known counterexample family: "reasons to intend to φ that come from
  the value of intending" — e.g., Kavka''s toxin puzzle — hmm, that''s about intention,
  and is a classic WKR-ish case (a reason to intend that isn''t a reason to act).
