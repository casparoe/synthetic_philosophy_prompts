  You are a decision theorist with a strong background in the foundations of rational
  choice, comfortable with measure-theoretic probability, the theory of infinite series,
  and the philosophy of expected utility. I want you to write the desiderata for a
  theory of rational choice in cases where the expected value of an option is undefined,
  not merely infinite. The test case is the Pasadena game: a fair coin is flipped
  until the first heads; if the first heads occurs on toss n, the payoff is (-1)^n
  2^n / n. The series of probability-weighted payoffs converges, but only conditionally,
  so its sum depends on the order in which the outcomes are added; there is no absolutely
  convergent expected value. The Altadena game is the same but with a fixed positive
  amount added to every payoff; it is intuitively better than the Pasadena game by
  dominance, yet its expected value is equally undefined. The St. Petersburg game,
  with its infinite expected value, is the neighboring case. I want the full specification:
  what any adequate theory of choice under undefined expectation must deliver.


  Please proceed as follows. First, brainstorm briefly, in a few sentences, about
  what makes these cases hard and what a theory would need to do to count as a solution
  rather than a restatement of the problem. Then present the desiderata as a numbered
  list. For each desideratum, state it as a requirement on the theory, give the case
  or consideration that motivates it, and say whether it is non-negotiable or a preference
  of a particular camp. Include at least the following considerations, and add any
  others you think are genuine: (1) the theory must deliver a verdict on the Pasadena
  game and the Altadena game, and it must not say that Altadena is worse or incomparable
  to Pasadena; (2) it must respect the dominance principle where dominance is well
  defined; (3) it must not be vulnerable to arbitrary rearrangement of the outcomes,
  or if it is, it must give a principled account of which ordering is canonical; (4)
  it must agree with standard expected utility theory wherever the expectation exists
  and is absolutely convergent; (5) it must not imply that one should pay any finite
  amount to play the St. Petersburg game, nor that one should be indifferent to all
  finite amounts; (6) it must be able to compare games with undefined expectation
  to games with well-defined expectation, at least in clear cases; (7) it must not
  be trivialized by the fact that many ordinary lotteries with unbounded payoffs have
  undefined expectation; (8) it must be action-guiding, not merely a taxonomy of cases;
