  "I''m 300 pages into a novel and stuck in a way that has nothing to do with plot.
  The book is set in a small island country that has abolished its parliament and
  replaced it with a lottocracy: 300 citizens drawn by lot, two-year terms, paid a
  salary, real legislative power, no elections at all. I''ve got the world built —
  the induction week, the briefing binders, the lobbyists learning to work a room
  of random people, a scene where my protagonist, a retired schoolteacher, gets the
  letter saying her name came out of the drum — and what I can''t decide is whether
  the whole thing is a fragile, genuinely better form of government or a slow-motion
  disaster with better manners. It''s not that I need a happy ending, I don''t. It''s
  that every time I go looking for the argument that would tell me which of those
  two books I''m writing, I find the same two camps shouting past each other, and
  it''s been that way since I first got interested in this stuff years ago.


  Camp one says sortition is simply more democratic than elections: no donors, no
  safe seats, no career incentives, an assembly that actually looks like the country,
  and, the bit they lean on hardest, a big random sample of ordinary people who deliberate
  for a couple of weeks will land closer to the common good than a self-selected political
  class ever does — the old Condorcet jury-theorem idea, that a large enough group
  of mediocre-but-better-than-coin-flip judges gets the right answer more often than
  any one of them. Camp two says that''s a category error in a nice suit. A sample
  can be representative, fine, but it was never authorized by anybody; nobody can
  vote it out; and it''s consent, not good decisions, that made the old system democratic.
  Then they start throwing the same examples at each other with opposite morals —
  the Irish citizens'' assemblies that fed into the marriage and abortion referendums
  get cited by camp one as proof it works and by camp two as proof it doesn''t, since
  the assemblies were only ever advisory and the actual parliament took the heat.
  And underneath the big fight there''s a pile of smaller unresolved ones I keep tripping
  over: who writes the briefing materials the assembly reads (somebody has to, and
  that somebody has an agenda); whether the people who say yes when the lot falls
  on them are a different sort of person from the people who say no; whether deliberation
  sharpens a group''s judgment or just makes it more confident and more correlated,
  which if true would quietly gut the jury-theorem argument that got us here in the
  first place; and whether an assembly that passes laws is better or worse than one
  that only recommends.


  What I want from you is not a verdict on sortition, it''s a diagnosis of the fight.
  Is this a verbal dispute about the word ''democratic'' — one side meaning authorized-by-the-governed
  and the other meaning likely-to-produce-good-decisions — or is it two camps answering
  two different questions (how do we get better policy? versus how do we get decisions
  people have reason to accept even when they lose?) under one heading? Is it a hidden
  empirical bet that better data could settle, or a clash of bedrock intuitions about
  whether a decision is legitimated by who made it or by what it says, which no evidence
  will touch? My own hunch, and tell me if it''s lazy, is that it''s mostly the input/output
  equivocation plus an empirical bet about deliberation that nobody has actually run
  the right experiment for, and that the reason nobody moves is that each side''s
  argument is only fatal to a version of the other side that its holder doesn''t endorse.
  So: diagnose it, say what would count as progress (a distinction, an experiment,
  a formal result about when the jury theorem survives deliberation, a change of question),
  and be honest about whether this one is ill-posed or just hard — because I can write
  a novel about a question that has no answer, but I can''t write one about a question
  where nobody can say what an answer would even look like."


