  - What theory of fairness does it presuppose — that fairness is procedural/equality
  of opportunity, or substantive equality of outcome? Does it presuppose the "no-envy"
  criterion? Does it presuppose that a fair division must be envy-free, and that envy-freeness
  is enough?

  - Does it presuppose a particular view of the person — that people are self-interested
  and won''t take less than their share, or that they''re competent judges of their
  own good? What happens when the chooser is altruistic, or masochistic, or doesn''t
  know their own preferences, or when the good is a "positional" good whose value
  depends on what the other got?

  - The strategy-stealing assumption itself: that the second party''s strategy is
  available to the first, that the roles are symmetric, and that an extra option never
  hurts (monotonicity). Where does it fail? In games with zugzwang/tempo, in settings
  where choosing first reveals information, in settings where the "choice" carries
  stigma, in settings where the option sets aren''t actually symmetric.

  - The non-constructive character: the justification is an existence proof (a fair
  division exists and the procedure finds it) — but the argument doesn''t tell you
  *how* to cut; it presupposes the divider can compute the chooser''s preferences.
  If preferences are private and unknown, the whole thing collapses, and the mechanism
  is really an information-revelation device. So what does it presuppose about knowledge
  of others'' preferences?

