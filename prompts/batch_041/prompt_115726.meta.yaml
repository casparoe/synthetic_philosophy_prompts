  have a winning strategy, since whatever the second player could do, the first player
  could have done it first, and having an extra stone lying around never hurts. That
  argument tells you the first player wins without telling you a single winning move.
  And the game''s own fix is the same as the cake trick: the swap rule, where after
  the first player''s opening move the second player can either reply normally or
  swap sides and take that opening move as their own. Same in Go, sort of -- passing
  is allowed, so symmetry gives the first player at least a draw, which is why the
  second player gets compensation points to break the symmetry. And chess is the counterexample
