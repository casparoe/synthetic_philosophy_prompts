  I think the cleanest, most concrete, and most philosophically rich practice: **the
  pie rule / swap rule** — but as an institutional design it''s a bit niche for small
  LLMs. Alternatively **"I cut, you choose"** is common knowledge. But is "I cut you
  choose" a presupposer of the strategy-stealing assumption? Yes: the cutter, knowing
  the chooser will take the better piece, must make the pieces equal; the cutter "steals"
  the chooser''s advantage. And it presupposes: (i) the chooser acts self-interestedly
  and knows their own preferences; (ii) preferences are comparable within a person
  (each can rank the two pieces) but need not be comparable across persons; (iii)
  the cutter can divide finely enough; (iv) monotonicity — having a choice never hurts;
  (v) symmetry of entitlements — neither party has a prior claim. It also presupposes
  a procedural theory of fairness (fairness = envy-freeness / no-envy), not a substantive
  one. Great content: what if preferences are unpredictable/unknown to the chooser
  (deception, uncertainty)? What if the good is indivisible (a child, a house, a job)?
  What if the chooser is irrational or altruistic (the chooser takes the worse piece
  for the cutter — then the mechanism fails)? What if parties have different information
  (one knows the cake has a hidden layer)? What if the chooser''s choice reveals information
  (signaling) — this is the key: the mechanism''s fairness relies on the chooser''s
  choice being non-manipulable, but the chooser could choose strategically to influence
  future rounds in a repeated game. Also: the mechanism presupposes that the "chooser
  advantage" is real and can be stolen — but if the cutter can divide perfectly, the
  advantage vanishes, so the mechanism is only as good as the cutter''s information
  about the chooser''s preferences (the cutter must know what the chooser wants).
