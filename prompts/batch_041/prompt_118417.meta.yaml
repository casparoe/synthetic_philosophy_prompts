  question and not just me being pleased with myself.


  There''s this old doctrine in economics, Friedman''s I think, from the 50s, that
  a theory''s assumptions don''t have to be realistic — what matters is whether it
  predicts well. The example people always trot out is billiard players who shoot
  as if they were doing the geometry in their heads, or leaves arranging themselves
  on a tree as if they were all trying to get the best light. I remember a line about
  how the more important the theory, the more unrealistic the assumptions, which sounds
  like a dare.


  My half-formed idea is that ''unrealistic'' is doing two jobs and the doctrine only
  works for one of them. Some false assumptions are false the way frictionless planes
  are false: there''s a dial, and if you turn it all the way up you get the real thing,
  so the assumption is a limit of something true. Others aren''t like that. Perfect
  foresight, an agent who lives forever, a market with no one in it — there''s no
  dial position that makes those true, they''re not limits of anything. I want to
  call the first kind turnable and the second kind unturnable, though I''ll take a
  better name.


  And here''s my novelist''s reason for caring, which is also the reason I think I
  might have something: I write made-up places, and readers forgive an impossible
  place almost instantly and never forgive a wrong one. If my London is on the wrong
  side of the river they''ll write to me about it; if I invent a city that floats,
  fine. I think the difference is that an impossible premise announces what game we''re
  playing and a wrong detail pretends to be a fact and isn''t. If that''s right, then
  unturnable assumptions aren''t really ''assumptions'' at all — they''re premises,
  and a premise is licensed by what it lets you see, not by whether it''s true. Which
  would mean the doctrine is quietly right about turnable assumptions and quietly
  wrong, or at least defended in the wrong currency, about unturnable ones.


