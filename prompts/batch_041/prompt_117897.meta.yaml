  reference class rather than a measurement of it, and the document should treat this
  as a feature to be disclosed in small type.


  — The dependent variable. Collapse is assigned retroactively, by the archivists
  of the survivors, and the threshold is contested for every case in the table. Have
  the document admit that its event definition is a matter of historiographical consensus
  while presenting a number to two decimal places.


  The reader should finish the piece able to state, in one sentence, why a base rate
  about the past is not a forecast about a particular present, and also why the outside
  view is nonetheless the honest starting point — the satire should be fair to the
  method, not a sneer at it. Someone who has taught the planning fallacy should find
  the document uncomfortably plausible; someone who has never heard of reference-class
  forecasting should still get the joke and learn the distinction between a class
