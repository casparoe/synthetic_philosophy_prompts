  I cover science and ideas for a general-interest magazine, and the annual predictions
  issue needs a satire piece from me. What I want from you is a deadpan parody of
  a methodology handbook from a sovereign-risk rating agency — a firm that sells continuity
  ratings on states, sells them to governments, insurers, and institutional investors,
  and has imported reference-class forecasting wholesale into the question of how
  long a polity has left.


  Form: a numbered methodology document, roughly 800 words, with a title, a two- or
  three-sentence preamble in the agency''s house voice, eight to twelve numbered clauses,
  and one short appendix containing a dissenting note from a staff methodologist who
  has lost an internal argument. Any quoted material should be invented and in-universe:
  no real firms, no real officials or scholars, no real events presented as facts.


  The jokes have to be load-bearing on the epistemology rather than on the silliness
  of bureaucrats, and every absurdity should be an exaggeration of something the outside
  view really does when it is applied to a single, non-repeatable case. At minimum,
  please build the piece around the following, and let the clauses interact rather
  than ticking them off one by one:


  — The reference class. The agency must define the class of polities whose fates
  stand in for the rated state''s, and the definition has to be visibly gerrymandered:
  broad enough to yield a sample, narrow enough to yield a rate. Have the document
  defend a choice that a reader can see was made after the outcome was known, and
  have a clause explaining that the class may be revised when a rating needs revising.


  — The sample. The historical record of empires is a record of empires that ended;
  polities that persisted are not in the table, because persistence leaves fewer dramatic
  archives. So the unconditional rate is a tautology and the interesting number is
  a conditional one, and the document should be shifty about which it is quoting.


  — Hazards versus dates. The method can honestly produce a distribution over durations,
  or a constant hazard, but the sales department needs a date. Watch the document
  slide from a probability that a state of this type falls within a century into a
  forecast that this state falls in 2049, and let the slide be visible to anyone who
  knows the difference.


  — The single case. Reference-class forecasting was built for portfolios of projects
  and for planners who get to run many similar projects; a state is one draw, cannot
  diversify across its own history, and does not get re-rolled. The document should
  acknowledge this in a clause that then proceeds as though it hadn''t.


  — The override. The doctrine says case-specific causal knowledge may override the
  base rate when the case is a genuine outlier — the broken leg that makes the cinema
