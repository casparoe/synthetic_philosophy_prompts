  ---


  I teach a graduate seminar in contemporary political philosophy, and a colleague
  in my department recently pressed an argument on me that I have not been able to
  answer as cleanly as I would like. He concedes that prioritarianism is not, strictly
  speaking, a theory of equality — that its slogan concerns the extra weight owed
  to a gain or loss when it lands on someone worse off, not the intrinsic badness
  of a gap. But he insists that this distinction is doing no real work. His reasoning
  is that the priority view still measures the moral quality of an outcome by reference
  to how the worse off are situated relative to others, and any view that does that
  must find something to approve of when the better off are brought down toward the
  worse off, even if the worse off are left exactly where they were. He offered a
  two-person illustration: one person at a high level of well-being and one at a low
  level, and a policy that lowers the better-off person substantially while leaving
  the worse-off person untouched. The distribution, he says, is now more equal than
  before, and so the prioritarian — who by his own account is especially solicitous
  of the worse off — must be at least partly pleased by the change. I had always regarded
  the leveling-down objection as the decisive reason to prefer prioritarianism to
  egalitarianism, so his argument has left me genuinely unsure of my footing.


  Before I reply to him, I would like you to help me see what the correct repair to
  prioritarianism would be, and to help me draft the substance of my response. If
  the priority view really cannot escape the leveling-down charge, then the extra
  weight it assigns to the worse off must be the culprit, and we should consider whether
  capping the weighting above some sufficiency threshold — so that gains to the comfortably
  well-off receive no weight at all — removes the difficulty, or whether the better
  remedy is to redescribe the view so that it takes no interest whatever in how people''s
  positions compare. Tell me what, if anything, is actually wrong with his argument,
  and then set out the repair you favor and why. Confine your answer to a single paragraph,
  and begin with the one thing I most need to say to him.


  ---


