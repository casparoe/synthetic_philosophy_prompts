  Here''s my half-formed take, argue with it: the usual move is to call Omelas a dramatization
  of the repugnant conclusion. But I think that''s wrong. The repugnant conclusion
  is generated by adding lives — a huge number of people whose lives are barely worth
  living beating a smaller number of great lives — and the whole weirdness comes from
  the fact that nobody is made worse off. Omelas isn''t that. The child is an existing
  person, not a possible addition, and her misery is what buys the city''s happiness;
  it''s a causal trade, closer to scapegoating than to mere addition. If that''s right,
  then the story is a separateness-of-persons case wearing population-axiology clothes,
  and my students are learning the wrong lesson.


  But I''m not confident, because other bits of the story look like they''re doing
  real axiological work. The child''s inner life is left weirdly blank — the story
  says she''s feebleminded, or maybe that''s what the treatment did to her, so we
  can''t tell whether her life is below zero, above it, or exactly at the line. That
  matters, because on some views the whole verdict turns on which side of the line
  a life falls. Then there''s the fact that everyone knows: the citizens aren''t ignorant
  beneficiaries, they''re knowing ones, and I''ve never seen an axiology that has
  a place for knowing. And the ones who walk away don''t change the numbers at all
  — they just leave — which makes me wonder whether walking away is something the
  framework can even represent, or whether the story is pointing at a kind of refusal
