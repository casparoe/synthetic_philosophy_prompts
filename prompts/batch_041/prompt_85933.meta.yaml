  \ distinct category of \"harmless immorality\"? Does disgust count as a harm? Does\
  \ society have a right to protect its moral fabric? Is the \"reasonable man\" test\
  \ majoritarian?\n\nThe instruction: \"you'll often have to inject some sort of new\
  \ / niche ideas into the prompt.\" So for a sorting quiz, I could invent a few concrete\
  \ cases (vignettes) that are fresh — e.g., a case where conduct is widely thought\
