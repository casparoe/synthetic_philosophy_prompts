  \ gives a nice diagnostic taxonomy: legal moralism positions — Devlin's moderate\
  \ legal moralism (the \"intolerance, indignation and disgust\" test, the reasonable\
  \ man, the disintegrating society thesis), Hart's Millian liberalism with the harm\
  \ principle plus paternalism, the \"positive morality vs critical morality\" distinction,\
