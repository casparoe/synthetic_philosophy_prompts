  body is gradually puppeteered by the duplicate; and (e) replacement of the whole
  brain in a single step by a functionally identical silicon brain, with the original
  destroyed. I would also like you to consider a sixth case that I have invented:
  the replacement is done in reverse order, starting with the neurons that are least
  connected to the rest of the network and ending with the most hub-like ones, but
