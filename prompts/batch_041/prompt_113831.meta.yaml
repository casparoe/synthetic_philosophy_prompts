  wants to write it into the bylaws, with a formal penalty schedule, because she says
  an unwritten practice is not really a rule and cannot be enforced fairly. A longtime
  member objects that writing it down will change its character: people will follow
  it because it is written, not because they expect one another to follow it, and
  we will lose the flexibility that lets us make exceptions for someone who was in
  the hospital or whose project ran long. Last month a member who had been away for
  a year returned a saw late and, when told he would have to wait, said he had never
  agreed to any such rule and that the rest of us were simply treating a habit as
  a law. The board has to decide whether to codify the practice, leave it informal,
  or abolish it, and I keep feeling that the answer depends on questions we have not
  asked: what exactly makes a regularity into a convention, whether a convention can
