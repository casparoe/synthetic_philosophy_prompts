  Setup: A colleague''s reconstruction, meant to show epiphenomenalism is self-undermining.


  (1) Epiphenomenalism: phenomenal properties are caused by physical properties and
  cause nothing in turn; the physical world is causally closed.


  (2) My judgment that I am now undergoing a certain experience is itself a physical
  event, and it reliably matches the experience it reports — I do not merely guess
  what I feel.


  (3) Where a state S and a judgment J about S are reliably correlated, either the
  correlation is a coincidence or there is a cause common to both (or S causes J).


  (4) The correlation between my experiences and my reports of them is not a coincidence;
  it is exceptionlessly reliable, and extends to experiences I could not have anticipated.


  (5) My experiences cause nothing (1). So the correlation is explained by a common
  cause: the physical state C that produces both the experience and the report.


  (6) Now consider my zombie twin, physically identical to me at every moment, and
  so possessing the same C, but with no experiences at all. By (1) and (5), C is sufficient
  for the report; the presence or absence of the experience makes no difference to
  what gets reported. The twin asserts, sincerely and in exactly my words, that it
  is conscious.


  (7) So the causal chain leading to my assertion that I am conscious would run exactly
  the same course if I had no experiences. My assertion is not sensitive to the presence
  of the experience it purports to report.


  (8) A judgment that would have occurred whether or not its subject matter existed
  is no evidence for the existence of that subject matter.


  (9) Hence my apparent evidence for the existence of my own experiences — namely,
  that I seem to be conscious — is no evidence at all. Any argument for epiphenomenalism
  that begins from the reality of experience is thereby gutted. Epiphenomenalism,
  which is supposed to be a thesis about experience, cannot be supported by experience.
  It is self-stultifying.


