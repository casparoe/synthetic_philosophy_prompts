  I''m a freelance writer who covers science and ideas for a few magazines, and I''m
  trying to get my head around something for an essay I''m doing on ritual as a kind
  of pedagogical stopgap. I did a biology degree and haven''t read any medieval philosophy
  since one survey course in college, so I''m well out of my depth, and I''ve been
  going back and forth about this for weeks with a friend whose actually read the
  stuff.


  Here''s my problem. Maimonides, in the Guide of the Perplexed, seems to explain
  the Torah''s laws about animal sacrifice as a concession -- roughly: a people who
  had grown up surrounded by sacrificial worship couldn''t have been asked to drop
  it overnight, so the Law takes the practice over and redirects it to God alone,
  instead of commanding it because the offerings do something for God. But the same
  Maimonides is adamant, everywhere, that God is incorporeal and unaffected, that
  nothing we do adds to or subtracts from God, and yet the Torah itself describes
  the offerings in what sounds like frankly culinary terms -- something God smells
  and finds pleasing, food offered to God. What I want from you is the conceptual
  issue, not the history: what is the ''concession'' a concession to, what work is
  it doing, and is the reading actually stable? Specifically, what''s left of the
  value of the sacrifice if the rite does nothing for God and was only ever a response
  to what people were already used to -- is it anything more than historical packaging,
  and does he have the resources to say otherwise? And how does he get away with reusing
  the Torah''s own sacrificial imagery, nose and appetite and all, while denying that
  God has anything of the kind?


  Please don''t hand me the standard summary of his position -- I can find that. Reason
  it out, and be explicit about which bits are in the text and which are your own
  reconstruction. And if my framing is off from the start, say so; I have a nagging
  feeling I''ve smuggled in a Christian-sounding idea of accommodation that isn''t
  really his, and if that''s right I''d rather be told than humoured. Same if the
  question can''t honestly be answered without the actual text in front of us.


