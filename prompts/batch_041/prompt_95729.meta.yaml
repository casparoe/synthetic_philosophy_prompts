  \ on earlier cases\", \"Ask a question that rests on a subtle confusion or false\
  \ presupposition\".\n\nWhich combination works best? The verdict-prediction type\
  \ works well with \"The boundary problem: who belongs to the demos?\" or \"Nomic\"\
  \ or \"Bentham's views on sexual morality\". Actually the grading type with Bentham's\
  \ views on sexual morality could be nice: a student answer that conflates Bentham's\
  \ utilitarianism with... hmm.\n\nLet me think about the constraint: \"you'll often\
  \ have to inject some sort of new / niche ideas into the prompt\" — meaning the\
  \ prompt should contain enough material (the verdicts, the cases, the essay) so\
  \ that the model doesn't need external memory. The verdict-prediction type naturally\
  \ injects the precedents. That's a strong fit: the asker reports verdicts, so all\
  \ the material is in the prompt.\n\nWhich domain? \"The boundary problem: who belongs\
  \ to the demos?\" — a body's track record on who gets included in the demos. That's\
  \ rich: e.g., a constitutional court / electoral commission with precedents about\
  \ who counts as a member of the demos: resident non-citizens, children, expatriates,\
  \ long-term residents, prisoners, etc. The rules could be: all affected interests\
  \ principle, all subjected to coercion (coercion principle), territorial residency,\
  \ nationality, stakes-based. That's a genuinely good \"which rule is she running\"\
  \ case with multiple consistent rules diverging on a new case.\n\nAlternatively\
  \ \"Nomic\" — self-amending rules — a body's verdicts on whether amendments are\
  \ valid. Hmm, also nice. But the boundary problem gives more standard philosophical\
  \ principles (all-affected interests, all-subjected-to-coercion, membership/nationality,\
  \ territorial jurisdiction) which small LLMs have memorised decently. Good — the\
  \ instructions say don't refer to super niche theories LLMs won't have memorised.\
  \ The all-affected principle and the all-subjected principle are standard in democratic\
  \ theory (Goodin, Dahl, Fraser, Abizadeh). Fine.\n\nLet me design it.\n\nAsker:\
  \ someone on a body — say a citizens' assembly, a party's rules committee, or a\
  \ university's... hmm, better: an electoral commission / a city's charter review\
  \ commission deciding who may vote in a referendum. Or: \"I'm the secretary of a\
  \ housing co-operative\" — too cute. Let's do: a constitutional convention / a city's\
  \ referendum commission with precedents on who is entitled to vote in city-wide\
  \ referendums.\n\nPrecedents (verdicts), designed so more than one plausible rule\
  \ fits:\n1. Referendum on a local school closure: allowed residents without citizenship\
  \ (e.g., permanent residents and even undocumented residents) to vote; excluded\
  \ commuters who work in the city. → rule: residence/stake, not citizenship.\n2.\
  \ Referendum on a cross-border bridge/toll affecting the neighbouring municipality:\
  \ allowed neighbouring residents to vote? Hmm, careful — must be jointly consistent\
  \ with more than one rule.\n\nLet's craft carefully. Candidate rules:\n(A) All-affected-interests:\
  \ anyone whose interests are affected by the decision gets a vote.\n(B) All-subjected-to-coercion\
  \ (subject to the laws/rules in question): anyone who will be bound/coerced by the\
  \ outcome.\n(C) Territorial residence / domicile (regardless of citizenship, but\
  \ bounded by geography).\n(D) Stakeholder/membership: those who bear the burden\
  \ of the collective project.\n\nDesign precedents:\n\nP1. City referendum on raising\
  \ the local income tax rate. Commission allowed resident non-citizens (including\
