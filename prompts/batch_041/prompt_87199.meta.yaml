  but I think it might be a horror story about bounded judges. Here''s the idea I
  want you to use: the debate setup assumes the judge can tell a good argument from
  a bad one if it''s presented clearly. But there''s a failure mode where one side
  doesn''t lie—it just makes its case so long, so locally plausible, and so full of
  hedges that checking it costs more than the judge has. Call it the obfuscation budget:
  the truth is cheap to state but expensive to verify, and the falsehood is expensive
  to state but cheap to accept. Read the film through that. Does Juror 8 win because
  he has the better argument, or because he has the only unbounded attention span
