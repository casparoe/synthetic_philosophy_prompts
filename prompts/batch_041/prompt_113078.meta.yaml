  that pulls a hand off a hotplate — and the experience of pain, and that the first
  can occur without the second. When I apply that to a mouse that has been trapped,
  I think the mouse feels pain; when I apply it to a fly that avoids the swatter,
  I do not. I cannot give an account of where the line falls.


  What I want to know is whether there is a principle that gets all of these, or most
  of them. I have a tentative one: that Descartes''s language test tells us something
  real about thought (so the bee and the parrot fail it, and the dog''s whine is not
  a request), but that feeling is not settled by language at all, and is instead a
