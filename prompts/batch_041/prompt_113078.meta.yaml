  I am in the lower sixth and writing an extended project on whether animals think
  and feel, and I have reached the point where I need to know what my own view actually
  amounts to. I have been keeping a list of cases and my verdicts on them, and I would
  like you to work out what principle, if any, holds them together.


  I began from Descartes, because his view is the one that makes my verdicts look
  inconsistent. He holds that animals are machines: that they have no thought and
  no feeling, and that their cries and writhings are no more than the working of their
  parts. He offers two tests for this. The first is language: a creature that cannot
  use words or signs of its own devising to make its thoughts known to others is not
  thinking. The second is that animals do some things better than we do, but never
  from knowledge — they act from the arrangement of their organs, as a clock keeps
  time. I think he is right about the first test and wrong about almost everything
  he draws from it, and I need to know whether that position is stable.


  My verdicts:


  1. Our dog whines at the door to be let out. I do not think this is language or
  thought; it is a signal, closer to a doorbell than to a request. (Descartes''s first
  test: passed by me, failed by the dog.)


  2. My dog, who had never seen a puzzle toy before, worked out within a minute that
  she had to tip the box onto its side to get the ball out, and she tried four or
  five different approaches before one worked. I think that is genuine problem-solving
  and not mechanism.


  3. A honeybee returning from a good patch of flowers dances in a way that tells
  the others the direction and distance. However intricate it is, and however much
  it looks like my dog''s box, I do not think the bee knows anything; I would call
  it mechanism.


  4. Our old cat, when she was ill, stopped eating and hid under the bed and would
  let me sit with her but not touch her. I think she was suffering, in the sense that
  matters, and that Descartes was simply wrong. What convinced me was not just the
  behaviour — it was that she behaved like me when I am ill, and she is made of the
  same sort of stuff as me.


  5. An octopus unscrews a jar from the inside. I think that is thinking, of some
  sort.


  6. A grey parrot who answers questions about the number and colour of objects on
  a tray. I do not think that is language, though I admit I cannot say what is missing.


  7. A human infant of six months, who has no language and no general reasoning, plainly
  thinks and feels. Descartes agrees with me here, but only because he thinks the
  infant has a soul, which I do not believe.


  8. Someone with advanced dementia who has lost language and general reasoning still
