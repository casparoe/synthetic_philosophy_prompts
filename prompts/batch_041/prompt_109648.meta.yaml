  I''m running a 90-minute session for our AI safety reading group -- about 16 people,
  mixed backgrounds, no maths required -- and I want them to feel instrumental convergence
  in their bones rather than nod along to the diagram. Can you design the game?


  What I want them to walk out seeing: that agents with completely different final
  goals can end up doing the same thing -- grabbing resources, staying alive, protecting
  their own goal-definition -- and that this isn''t a law of nature but falls out
  of certain structural assumptions about the situation. And I want the orthogonality
  thesis to land as well: the final goals are orthogonal to the competence, not a
  claim that everyone ends up power-hungry. Ideally they discover the convergence
  first, then we complicate it.


  Here''s the sort of thing I have in mind but feel free to redesign. Each player
  gets a secret terminal goal card. Some are weird and open-ended (make as many paperclips
  as possible; maximise the number of times the digit 7 is written down; ensure every
  left-handed person has an umbrella). Some are satiable or self-limiting (collect
  exactly 3 tokens and then stop; make sure one specific person says one specific
  word at some point; achieve your goal and then you don''t care what happens). Players
  take turns in a simple economy: they can harvest tokens from a common pool, trade,
  spend tokens to buy "influence" cards, copy their goal-card to another player, or
  destroy another player''s goal-card. The catch: I want the payoff rules arranged
  so that for the open-ended goals the dominant move is always to take more resources,
  never let your goal-card be destroyed, and never let anyone edit it -- while the
  satiable/self-limiting goals pull in the other direction. And I want at least one
  round where the satiable players can win by doing something the open-ended players
  literally cannot afford to do, so the convergence visibly breaks.


