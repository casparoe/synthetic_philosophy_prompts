  I am a high school student writing an essay for a seminar on the philosophy of artificial
  intelligence, and I would like help thinking through a comparison rather than a
  summary. The two things I want compared are two ways of specifying what an artificial
  agent is ultimately trying to do. On the first picture, which I will call the goal-directed
  picture, the agent is defined by an objective function: it is trying to bring about
  some state of the world, its behavior is evaluated by how close it comes to maximizing
  that objective, and its intelligence is a matter of how effectively it pursues the
  objective. On the second picture, which I will call the approval-directed picture,
  the agent is defined by a person or body whose approval it seeks: it is trying to
  do what that approver would approve of, its behavior is evaluated by whether the
  approver would endorse it, and its intelligence is a matter of how well it predicts
  and earns that approval. Compare these two pictures on the following questions:
  what fixes the agent''s behavior; where the specification comes from and how complete
  it is; how each behaves when the specification is silent or ambiguous; and what
  each does when what the approver would endorse and what would maximize the stated
  objective come apart.


  Then answer a sharper question. The approval-directed picture seems to escape the
  goal-directed picture by putting a human approver in place of an objective. But
  suppose the agent becomes very good at predicting its approver -- good enough to
  work out what the approver would approve of under idealized conditions, or good
  enough to steer the approver''s approval toward whatever the agent already wants.
  Does the approval-directed picture collapse into the goal-directed picture once
  the approver is idealized or once the agent can model the approver well enough to
  shape their approval? Or is there something left over that the goal-directed picture
  cannot capture? I would like a direct verdict on which picture is more fundamental,
  with the strongest case for the other side stated fairly, and with a clear statement
  of which single feature of the setup decides the question.


