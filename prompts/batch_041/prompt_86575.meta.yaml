  Let me draft the disjunctivism interview prompt.


  Setting: The asker is a PhD student in philosophy who runs a graduate-student-led
  "Author Meets Critics" / a student podcast / is moderating a Q&A at a workshop.
  Guest: an unnamed/invented defender of disjunctivism about perceptual experience
  (a "new book" — invented, fine). Ask for 8–10 questions, with specified targets:


  1. The argument from illusion vs the argument from hallucination: press on whether
  the disjunctivist''s standard move — treating the argument from illusion as requiring
  only that things *appear* other than they are, while reserving the "common-kind"
  claim for hallucination — leaves the argument from illusion doing no independent
  work; ask whether, on their view, the argument from illusion is even an argument
  *for* anything, and follow up on whether the veridical/illusory case share a phenomenal
  character that the hallucinatory case also shares.

  2. The "screening off" / causal argument: if the proximal cause of the experience
  is the same in the good and bad case, what makes the good case''s experience *better*
  epistemically — and press the follow-up: does the disjunctivist''s appeal to "the
  object itself is part of the experience" make the epistemic difference magic? The
  standard reply: disjunctivism is not a theory of *why* we can''t tell, it''s a theory
  of the *nature* of the experience; the follow-up: then doesn''t the view owe us
  an account of why the hallucinating subject is *not* justified in the same way,
  given she can''t tell?

  3. Positive characterization: demand an account of hallucination that is more than
  negative — e.g., the objection that disjunctivism is a "negative" thesis about the
  bad case; press: can you characterize hallucination positively without invoking
  a common factor, and does appealing to "the subject is related to nothing" do any
  explanatory work? Follow-up: if hallucinations are just "not perceptions", how do
  you explain the systematic correlations between what subjects hallucinate and their
  brain states?

  4. The "capacity vs. state" reading of experience (Martin''s distinction) — is the
  disjunctivist''s claim about the *event* or about the *state* of the subject? And
  the objection that if it''s about the state, disjunctivism about the state is implausible.

  5. Epistemic vs metaphysical disjunctivism: is your view supposed to secure a distinctive
  epistemic warrant for perception (McDowell), or is it a metaphysical thesis about
  the nature of experience (Martin)? If both, does the epistemic claim survive if
  the metaphysical claim is only about the "event"? Follow-up: does the epistemic
  reading collapse into a claim about the *world''s* contribution rather than the
  experience''s nature?

  6. The "screening-off of the good case by the bad" — a well-known pressure: the
  bad case seems to screen off the good case''s epistemic value, since if the subject''s
  evidence in the good case is exhausted by what''s available in the bad case, perception
  adds nothing. Also: the "externalist" answer (the object is part of the experience,
  so the evidence is not exhausted) — follow-up: doesn''t this make perceptual justification
  hinge on a fact the subject cannot know?

  7. Indistinguishability and the "principle of phenomenal indiscriminability": if
  two experiences are phenomenally indistinguishable, doesn''t that entail they have
  a common phenomenal property? The disjunctivist denies that "indistinguishable"
  implies "same phenomenal character" — press on whether "phenomenal character" is
  being redefined to avoid the entailment.

  8. The "causal argument" from hallucination requires the possibility of "perfect
  hallucination" — press on whether disjunctivism needs hallucinations to be *possible*
  or merely *conceivable*, and whether the "epistemic" reading survives the concession
  that no actual hallucination ever occurs.

  9. The objection from "experience as a relation to a proposition" — maybe too much.

  10. The "negative" character of disjunctivism and the objection that it can''t explain
  the *similarity* between good and bad cases except by a brute "brute fact" (the
  "bruteness" objection — e.g., "disjunctivism is committed to a brute fact about
  the bad case"). Hmm.


