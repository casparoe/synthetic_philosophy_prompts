  I am writing a paper on how moral practices die, and a friend in my seminar has
  handed me an argument that I can no longer see around. I reproduce it here as he
  set it out.


  (1) The case against slavery — that it treats persons as property, and so as things
  — was made, and made forcefully, centuries before slavery ended; the cases against
  dueling and against foot-binding were likewise old by the time those practices were
  given up.

  (2) An argument that has been available for centuries while the practice it condemns
  survives is not what ends the practice.

  (3) Each of these practices ended when it became shameful rather than when it was
  refuted: the duel came to look like the resort of a man afraid of public opinion
  rather than the proof of a man of honor, and bound feet came to look like a national
  humiliation rather than a mark of refinement.

  (4) So what ended these practices was a change in what was honorable, not the force
  of an argument.

  (5) If a change in what is honorable explains why a practice ended, then the cogency
  of the argument against the practice explains nothing about why it ended.

  (6) If the cogency of our moral arguments explains nothing about what we do, then
  moral truth is inert.

  (7) Moral realism is worth having only if moral truth is not inert; a realism whose
  truths make no difference anywhere is a thesis we could drop without noticing.

  (8) Therefore we have no reason to be moral realists, and the fact that slavery
  ended tells us nothing about whether slavery was wrong.


