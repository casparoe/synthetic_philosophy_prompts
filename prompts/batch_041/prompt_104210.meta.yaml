  Core philosophical content:

  - The spectrum argument: A1 ≥ A2 ≥ ... ≥ An but A1 > An, so if ''at least as good
  as'' (≥) is transitive, contradiction. Either ≥ is not transitive, or one of the
  adjacent comparisons is wrong, or the "≥" relation is not the right relation.

  - Responses: (1) bite the bullet: reject transitivity (Temkin); (2) reject a step
  (there must be a cutoff / the "sorites"-style response: some adjacent step is a
  strict worsening even though we can''t tell which — an epistemicist or supervaluationist
  move); (3) deny the setup: adjacent items are incommensurable/"on a par," so "≥"
  doesn''t hold and ">" doesn''t hold — but this makes the relation non-total, not
  intransitive; (4) accept the conclusion (repugnant conclusion) — the spectrum shows
  our intuitions are wrong; (5) reject the additive/aggregative value theory that
  generates the spectrum.

  - Key distinctions: transitivity of ">" vs "≥"; completeness/totality; acyclicity;
  the difference between intransitivity and incompleteness; "roughly equal" and the
  epsilon move; the distinction between the relation "better than" and "at least as
  good as" and the "betterness ordering" from a value theory.

