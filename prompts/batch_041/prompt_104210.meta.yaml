  ---


  I''m putting together the final for my upper-level value theory seminar and I want
  a single long essay question about spectrum arguments — the ones that try to show
  that "better than" comes out intransitive. The problem is every year I get the same
  four answers: someone recites the repugnant conclusion, someone says "sorites paradox,"
  someone says the bullet gets bitten, and I learn nothing about whether they can
  actually think. So I want the question built on a case they won''t have seen, so
  reciting doesn''t get them anywhere.


  Here''s the case I''ve cooked up, use it as the spine of the question: take a spectrum
  of treatments for some nasty but non-fatal disease. At one end, T1 cures 90% of
  patients but leaves nearly everyone with a rough fortnight of side effects. Each
  step down the line you shave a sliver off the cure rate and a sliver off the side
  effects — so tiny that at each step you''d shrug and say the new one is at least
  as good as the last (you''re trading a hair of cure for a hair of comfort). By the
  far end, T100 cures only 2% but has no side effects at all, and that one is obviously
  worse than T1. So T1 is at least as good as T2, T2 as T3, ... T99 as T100, yet T1
  is clearly better than T100. If "at least as good as" is transitive you''ve got
  a contradiction.


  What I want the question to force them to do: (a) say precisely which relation the
  contradiction is about, and whether intransitivity of that one forces intransitivity
  of plain "better than"; (b) separate transitivity from the other structural properties
  (completeness/totality, acyclicity) and show they know which is doing the work;
  (c) take a stand on which premise to give up, and own the cost — I especially want
  them to engage the vagueness machinery, i.e. whether there just isn''t a fact of
  the matter about where the reversal happens (and whether that''s a real reply or
  a relabeling), and the "on a par" move where adjacent items are neither better nor
  worse; (d) tell me whether their verdict changes between my treatment case and the
  population case, and why.


