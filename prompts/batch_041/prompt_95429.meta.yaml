  The real structure of the obfuscated-arguments problem: the honest debater''s answer
  is *correct* and they have a proof, but the proof is long and its steps are individually
  plausible, and the dishonest debater''s answer has a flaw that is *also* buried
  in a long chain — the judge can''t tell which long chain is the flawed one. The
  asymmetry: to *find* the flaw, you must redo work; to *present* the flaw-free-looking
  chain, Bob just needs to write plausible steps. So the cost is asymmetric because
  writing a plausible-looking step is cheap while checking it can be expensive (plausible
  ≠ checkable-cheaply).


