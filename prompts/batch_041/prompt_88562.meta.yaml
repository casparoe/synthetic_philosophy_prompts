  Argument:


  (1) A multipolar trap is a situation in which each actor, choosing what is best
  given the choices of others, produces an outcome that is worse for every actor than
  some available alternative.

  (2) In such a situation, each actor''s choice is rational, because it is the best
  response to the others'' choices.

  (3) No actor can unilaterally choose the better alternative without being exploited
  or outcompeted.

  (4) Therefore, in a multipolar trap, the worse outcome is the rational outcome.

  (5) Any attempt to escape a multipolar trap requires either (a) an external enforcer
  who can alter payoffs, or (b) a binding agreement among the actors.

  (6) An external enforcer is itself an actor in a larger competitive environment;
  if it can be outcompeted or captured, it faces its own multipolar trap.

  (7) A binding agreement is either enforced by an external enforcer (return to 6)
  or sustained by each actor''s willingness to punish defectors.

  (8) Punishment is costly to the punisher and benefits the group; so the decision
  to punish is itself a multipolar trap.

  (9) Therefore, every escape from a multipolar trap generates a higher-order multipolar
  trap.

  (10) Therefore, no escape is stable, and competitive dynamics must eventually erode
  any value that cannot be defended by a self-interested best response.

  (11) But we observe stable cooperation in families, firms, scientific communities,
  and constitutional orders, where people routinely incur costs to punish defectors
  and uphold norms.

  (12) Therefore something is wrong with the argument.


