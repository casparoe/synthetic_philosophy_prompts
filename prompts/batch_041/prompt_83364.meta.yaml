  Question:


  "Frankfurt''s counterexample to the principle of alternate possibilities runs roughly
  as follows. Black wants Jones to perform action A and is prepared, should Jones
  show any sign of deciding to do otherwise, to intervene and ensure that Jones decides
  to do A after all. As it happens Jones decides to do A on his own, and Black does
  nothing. Frankfurt concludes that Jones is morally responsible for A even though
  he could not have done otherwise, and hence that the principle of alternate possibilities
  — the claim that a person is morally responsible for an action only if they could
  have done otherwise — is false. (a) Set the argument out in premise-conclusion form,
  making explicit which premise the case is meant to falsify and what further assumption
  is needed to get from the description of the case to that falsification. (b) The
  best-known reply is that the case leaves Jones with a ''flicker of freedom'' — some
  alternative possibility that survives Black''s presence. Explain how that reply
  is supposed to work, and say exactly what it must establish if it is to succeed.
  (c) Does the reply succeed? Defend your answer."


