  ---

  Student''s answer:


  "(a) The principle of alternate possibilities, or PAP, says that someone is morally
  responsible for an action only if they could have done otherwise. Frankfurt''s case
  is designed to show that this principle is false. The argument is:


  P1. If PAP is true, then Jones is morally responsible for A only if he could have
  done otherwise.

  P2. Jones could not have done otherwise, because Black would have intervened had
  Jones shown any sign of deciding otherwise.

  P3. Jones is morally responsible for A.

  C. Therefore PAP is false.


  The premise the case is meant to falsify is P2 — or rather, the case is meant to
  show that P2 and P3 can both be true, so that the only way to keep PAP is to give
  up P3. To get from the description of the case to that conclusion you need the assumption
  that Black''s counterfactual intervention really does remove Jones''s ability to
  do otherwise, rather than merely making it very likely that he will do A. You also
  need the assumption that Jones''s responsibility is not undermined by the presence
  of Black, since Black never actually does anything.


  (b) The flicker of freedom reply says that even in the Frankfurt case, Jones retains
  an alternative. He cannot perform the alternative action — Black would stop him
  — but he can still try to perform it, or decide to perform it, before Black intervenes.
  The alternative possibility is therefore relocated from the level of action to the
  level of will or choice. The reply is not a denial that Jones could not have done
  otherwise; it is a denial that this matters, since PAP should be stated in terms
  of what the agent could have willed rather than what the agent could have done.
  For the reply to succeed it must show that the residual alternative is a real possibility
  — not just something we imagine — and that it is the sort of possibility that can
  ground moral responsibility.


  (c) I think the reply succeeds. If Jones could still have decided otherwise, then
  the case has not produced an agent who could not have done otherwise in the relevant
  sense, and the counterexample fails against a properly stated PAP. Frankfurt himself
  accepts that his case does not show that determinism is true, and compatibilists
  have used the case to argue that free will and determinism are compatible; that
  is exactly why the flicker of freedom matters. The only way the reply could fail
  is if we insist that the relevant alternative must be an alternative action rather
  than an alternative choice. But that looks like a stipulation rather than an argument:
  the difference between doing and deciding is not the sort of thing that should decide
  whether someone is responsible. On the whole the reply is sound, though it shows
  that PAP needs restating rather than that Frankfurt''s case is worthless."

