  Key theoretical elements of information cascades (BHW model, Bikhchandani-Hirshleifer-Welch
  1992): sequential decisions, private signals, observable actions, rational Bayesian
  updating. Cascades arise when it becomes optimal to ignore one''s private signal
  and follow the herd. Key questions: Does the cascade start? When is it rational
  to ignore private info? Is a cascade fragile? (Cascades are fragile — small shocks
  can break them.) Are they efficient? (They can be informationally inefficient —
  herding on wrong action.)


