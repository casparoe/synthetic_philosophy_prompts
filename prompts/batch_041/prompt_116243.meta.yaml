  I lecture on truthfulness and deception in professional life — the seminar sits
  at the intersection of applied ethics and the philosophy of language — and something
  that happened to me a few weeks ago has forced me to rewrite the final paper.


  I rang my home insurer to ask whether making a small claim would put my premium
  up. I was told, accurately, that "making a claim does not affect your premium".
  What I was not told, and what the person on the line cannot have supposed I would
  think to ask, is that claiming forfeits my no-claims discount, so the money comes
  off my bill by another route. Nothing I was told was false. I have since spent rather
  a lot of time wondering why I felt lied to, and whether the feeling survives scrutiny.


  My old exam question now strikes me as the reason my students kept missing this.
  They could earn a good mark by reciting the familiar contrast — the liar says what
  they believe false, the misleader merely gets the hearer to infer it — and then
  applying it. That is a summary, not an argument, and it says nothing about why the
  contrast should matter morally.


  I should therefore like you to set me a new question, with a model answer and a
  marking scheme. It is the final paper for the seminar: one essay question, forty-five
  minutes, twenty marks.


  The question must turn on two scenarios, which I want you to use exactly as I give
  them, so that no candidate can have prepared an answer in advance.


  The first is the insurance call. The second is a press conference at which the spokesperson
  for a firm under investigation states that the firm has never broken the law; everyone
  present, the spokesperson included, knows this to be untrue, and knows that the
  denial is understood by all as a ritual formality rather than a claim. Nobody in
  the room is deceived. (I want the contrast between the two cases to be uncomfortable:
  the first contains no false statement and yet, I think, deceives; the second contains
  a false statement and yet deceives no one.)


  The question should require candidates to say what, if anything, was done wrong
  in each case, to state a general criterion for when misleading someone is as serious
  as lying to them, and to test that criterion against a case in which misleading
  comes out worse than lying. It should not be answerable by naming authors or reciting
  the standard distinction; I want no part of the question to reward a reading list.
  Candidates should be able to answer it from the concepts alone.


  The model answer should be about 700 words, written as the strongest candidate in
  the room would write it, and the marking scheme should list the moves a first-class
  answer must make, the marks each is worth out of twenty, and, for each, the mistake
  that candidates characteristically make at that point — the kind of error that turns
  an A into a B. Please write everything in British English.


