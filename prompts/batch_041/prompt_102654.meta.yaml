  know one ticket will win. So rational belief is inconsistent. It doesn''t show it''s
  irrational to believe your ticket won''t win; it shows tension between high-probability
  belief, conjunction closure, and consistency. Or if you reject closure, you can
  believe each ticket loses but not the conjunction. The preface paradox (Makinson):
