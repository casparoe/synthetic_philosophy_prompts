  child whose school is closed)? These come apart, and I want a map that keeps them
  apart. The second is what the vote is for: protecting your interests, marking you
  as a full member of the political community with the standing to speak in its name,
  or simply supplying information about what people want, which might be more accurate
  if only the well-informed voted. The third is whether casting a vote is a right,
  a duty owed to your fellow citizens, or a burden — because that question decides
  whether compulsory voting is a way of enforcing fairness, a violation, or forced
  labour.


  Then there are cases I keep getting stuck on and that I''d like the map to place:
  a sixteen-year-old who works and pays tax; a person who has lived here for thirty
  years, pays tax, and has never applied for citizenship; a citizen who moved abroad
  at twenty-five and hasn''t lived here since; an adult under a guardianship order
