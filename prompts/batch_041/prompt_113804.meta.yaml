  From Dennett, "Intentional Systems" (1971): He discusses a "two-bitser" — a machine
  designed to accept quarters (two bits = 25 cents). He asks whether it can be said
  to "believe" that the thing it receives is a quarter. Then he imagines a duplicate
  two-bitser on a "Twin Earth"-like planet where what''s inserted is not quarters
  but something else that triggers it. His point: if the two devices are physically
  identical, their intentional states differ only in virtue of their history/environment,
  and the intentional stance treats them alike; whether to attribute belief depends
  on our purposes. Yes, I''m reasonably confident about this. But note the "Twin Earth"
  comparison was Putnam''s (1975), later than 1971; Dennett''s two-bitser predates
  it and is often seen as anticipating it. Actually in "Beyond Belief" (1982) Dennett
  discusses the two-bitser further.


