  Core concept to inject (translation under formal constraint / preservation of form):

  - A translation of a formal poem faces a bundle of constraints: propositional sense,
  connotation/register, rhyme, meter or syllable count, line breaks, a repeated refrain,
  word-level sound texture, and the poem''s overall "tone."

  - These cannot all be satisfied at once; the translator must choose what to sacrifice,
  and each sacrifice is a reading/interpretation of the source.

  - Form is not decoration: a lullaby''s form carries tenderness; the constraint itself
  can be part of the meaning.

  - Fidelity is not one quantity; there is no single "correct" translation; competing
  translations can each be faithful to different aspects.

  - The idea of the "spirit" vs. "letter."

  - Also: the interesting claim that a translation can be a better poem than the original
  and less faithful to it, and that the best translation may be the one that preserves
  the constraint that the source''s readers would have felt.


