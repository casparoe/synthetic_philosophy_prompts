  don''t show the usual distress. Some people in the group say this shows that the
  badness of pain is not essential to pain at all: you can have the sensation without
  the awfulness, so the awfulness must be a separate affective add-on. Others say
  no, the patients are still in pain and pain is still bad for them, it''s just that
  the badness has been disconnected from the usual behavioural and emotional responses;
  the sensation is still something they have reason to avoid, even if they don''t
  act on it. We''ve been going round this for weeks, and every time someone brings
  up a new lesion case or a new way of describing what the patient reports, the other
  side just redescribes it. It feels like we''re not actually disagreeing about the
  same thing.


