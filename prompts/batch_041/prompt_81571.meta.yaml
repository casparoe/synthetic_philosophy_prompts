  what they bid. Second highest bidder pays what they bid and gets nothing. And here''s
  the part that gets people — the second-highest bid doesn''t go to the company, it
  gets added to the winner''s prize. So if you drop out, you don''t just lose, your
  money is now literally paying for your rival to get more credits.


  Last quarter my team came second. We paid 34k. They got the pool plus our 34k. The
  CFO (who designed this whole thing) thinks it''s great because it "always clears."
  My VP has asked me to give the closing remarks at demo night next week, five-ish
  minutes, standing up, no slides, and she wants me to say something honest about
  what happened, which she keeps calling "what we learned" in a tone I don''t love.
  The room will be: my team (who are still raw about it), the team that won (friends
  of mine, awkward), the execs who built the auction, and about 200 people from sales,
  design, support who genuinely do not care about any of this and just want the free
  drinks.


