  did without pretending the money was well spent, and make clear that the trap was
  structural and not a personal failing of the people who bid — while not letting
  anyone (me included) off the hook so hard that it''s meaningless. I want it to be
  funny in a dry way and I do want it to land a real point for the non-technical half
  of the room. I don''t want it to be a lecture about auctions. I also don''t want
