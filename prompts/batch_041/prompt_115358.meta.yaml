  no power in parliament to revise it (only to offer a counter-proposal).


  Now take California. A bare majority of voters can amend the state constitution
  by initiative. But the legislature needs two-thirds of each house to raise a tax,
  and local governments need two-thirds of their voters to levy a special tax; those
  rules were themselves adopted by a simple-majority initiative. Each measure must
