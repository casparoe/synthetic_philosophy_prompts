  Before you rank anything, brainstorm: list out the species concepts you think are
  actually live in the current literature and in practice (don''t pad the list with
  historical curiosities nobody uses), and for each jot down the one-sentence version
  of what it says a species is.


  Then I want you to score each one from 0 to 1 on each of the four desiderata below,
  and give me a weighted total (weights in brackets), and finally a tier list (S/A/B/C/F)
  with a one-line justification per concept for its placement.


  The desiderata (these are mine, from the syllabus — please use exactly these and
  don''t substitute the standard textbook list):

  - [0.35] Doesn''t draw lines where there aren''t any: it should count as a species
  only groupings that are real, causally integrated units, not arbitrary cuts in a
  continuum.

  - [0.25] Portable across the weird cases: must give a sensible verdict for asexual
  lineages, allopolyploid plants that speciate in one generation, ring species, hybrids,
  and fossils — not just for ducks and deer.

  - [0.20] Plays nice with the law and conservation: the verdicts it yields should
  be usable for endangered-species listing and wildlife law without generating absurdities
  (e.g. every local population becoming a protected ''species'', or a hybrid swarm
  being simultaneously two species).

  - [0.20] Pluralism-compatible: it should be able to be one of several legitimate
  species concepts without the whole thing collapsing into ''a species is whatever
  a given biologist feels like'' — i.e., say what''s shared across the concepts.


  Then, and this is the bit I actually care about: tell me which concept wins overall
  on my weights and which one you''d actually bet on if the weights were up to you
  instead, and flag any concept where your score is really a guess about how it behaves
  in a case you''re not sure about.


  Also, sanity check me: is there any pair of these desiderata that can''t both be
  satisfied at once? If so say which and why, because I suspect 1 and 3 are in tension
  and I want to be able to tell the students where the real fight is.


  Take your time, and be honest about uncertainty rather than smoothing it over."


