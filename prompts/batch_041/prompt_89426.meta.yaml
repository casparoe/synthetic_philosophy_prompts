  I retired from an experimental physics career a few years ago and have spent the
  time since reading philosophy of mathematics on my own, mostly in the evenings.
  There is a puzzle about intuitionistic logic that I have not been able to settle,
  and I would rather have the diagnosis than be pointed toward more literature.


  I believe I have the outlines: Brouwer''s objection to the unrestricted use of the
  law of excluded middle, Heyting''s formalization of the logic that results, and
  Bishop''s later demonstration that a great deal of analysis can be rebuilt along
  constructive lines; my former students tell me that the same logic underlies the
  proof assistants they now use. Two things, however, I cannot reconcile.


  First, constructivists are said to reject proof by contradiction. Yet the irrationality
  of the square root of two — a result I have never heard a constructivist dispute
  — is established by assuming the number rational and deriving an absurdity. So the
  summary must be loose, and I suspect there is a distinction I have not been given.


  Second, and more troubling: in classical propositional logic the law of excluded
  middle holds on every row of the truth table, so it presents itself to me less as
  a substantive claim about the world than as a tautology, and declining to use it
  looks like refusing a tool that is manifestly in working order. Since the intuitionist
  accepts fewer inference rules than the classicist, it seems to follow that every
  intuitionistic theorem was already a classical theorem — that constructive mathematics
  is a proper fragment of classical mathematics, and that what one gains by the restriction
  is not new mathematics but a certain austerity of conscience. (One of the proof
  assistants I watched, incidentally, demanded an extra axiom before it would accept
  a step I had taken for granted; I had expected to add axioms, not to need them.)


  I have wondered whether the missing ingredient is a third status between true and
  false, something like not yet decided, which would explain why excluded middle is
  unavailable.


