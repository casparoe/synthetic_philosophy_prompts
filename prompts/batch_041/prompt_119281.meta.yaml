  Draft:


  "Three weeks ago a friend and I argued until two in the morning about Lakatos, and
  the argument is still unresolved — which is a problem, because in a month I am to
  give the closing address at the annual banquet of our field''s professional society,
  and my friend will be sitting at the second table.


  The room will hold about a hundred and fifty people. Perhaps thirty of them are
  historians or philosophers of our field and will follow every move in a Lakatosian
  argument; another thirty are graduate students who have read the vocabulary but
  never used it; the remainder are working researchers, a handful of practitioners,
  the society''s staff, several donors, and my wife''s family. The address is expected
  to do the traditional thing — to take stock of where the field stands — and I would
  like it to do that honestly rather than decoratively.


  Here is what my friend and I could not settle. On the ordinary reading, a research
  programme is progressive when it keeps generating predictions of novel facts and
  some of those predictions are borne out, and degenerating when it survives chiefly
  by accommodating anomalies after the fact — patching the protective belt rather
  than extending the hard core''s reach. My friend thinks this criterion is too coarse
  to be applied to anything real, and she proposes a refinement I cannot dismiss.
  She wants to separate the novelty of a prediction from the subject matter of the
  prediction. A programme, she says, can go on producing genuinely novel predictions
  that are genuinely corroborated while the content of those predictions migrates
  steadily away from claims about the world and toward claims about the programme''s
  own machinery: the behaviour of its instruments, the values of its internal parameters,
  the outputs of its own simulations, the performance of its own measurement protocols.
  On the standard criterion such work looks like the picture of health — novel predictions,
  successful tests, no ad hoc rescue. My friend says it is the signature of a programme
  that has begun to feed on itself, and that we need a third category for it, or at
  least a warning label; I say that if the predictions are novel and corroborated,
  the subject matter cannot by itself be disqualifying, and that she is smuggling
  in a preference for metaphysics over measurement.


  I would like the address to take a position on this without turning into a seminar.
  Specifically: state the refinement as precisely as it can be stated — what would
  count as the content of a prediction migrating, and how one would tell it from a
  healthy division of labour in which instrument work is simply what a mature programme
  does — then say whether it is a genuine third category or a re-description of the
  ordinary one. Then apply it to our field''s dominant research programme, which is
  the thing everyone in the room is actually waiting to hear about, and say whether
  you would call that programme progressive, degenerating, or my friend''s third thing,
  and on what evidence.


  The difficulty is that the verdict determines what the speech can be. If the programme
  is healthy, the usual arc — we have come far, the young people will take it further
  — is available, and I can close on the founder''s students, who will be in the front
  rows, without flattering them. If it is degenerating, or self-feeding, then that
  arc is dishonest, and I have to find some other way to be truthful in a banquet
  hall at ten o''clock at night without either delivering a eulogy for a living enterprise
  or using a celebratory occasion to settle scores. The founder himself is ninety-one
  and will be there; his two most senior students are the ones who would hear a degenerating
  verdict as a verdict on them.


  So: write the address. It should run about twelve minutes spoken. It should be intelligible
  and even enjoyable for the practitioners, donors, and family in the room — no unexplained
  jargon, no rolling list of anyone''s publications — while the philosophers at the
  second table should be able to see that the position you take is a real position
  and not a gesture. Do not cite literature or offer a reading list; the audience
  wants a verdict and an argument, not a bibliography. Tell me plainly what you are
  claiming, what it would take to show you wrong, and what I should say to my friend
  when we walk out."


