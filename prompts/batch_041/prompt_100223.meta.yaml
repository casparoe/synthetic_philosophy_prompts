  I have come to accept a thesis I will call causal parity, and I want you to tell
  me what would count against it. The thesis: omissions — failures to act, absences,
  "negative" events, the non-occurrence of things — are causes in exactly the same
  sense in which positive events are causes. Where an action would count as having
  caused an outcome by making a difference to whether and how it occurred, an omission
  that makes the same difference counts the same way. The stubborn intuition that
  omissions are not really causes, that they are at best "causes" in a secondary or
  honorific sense, is on this view not a metaphysical datum about the causal relation
  but a fact about us: about which difference-makers we select for mention, and that
  selection is governed by norms, salience, expectations, and attributions of responsibility
  rather than by the causal structure of the world.


  I want an honest map of how exposed this is. Specifically:


  1. Which results, cases, or arguments would genuinely count against parity, sorted
  by how decisive they would be? I am interested in more than the usual appeal to
  intuitions about trolley-style cases; tell me which formal or structural results
  bear on it — for instance, whether the interventionist machinery for defining causation
  can even admit an omission as a relatum (you cannot, it seems, "wiggle" an absence
  the way you wiggle a switch), and what it would take for that to be a real defect
  rather than a technical inconvenience.


  2. Which of the defeaters would a committed parity theorist themselves concede as
  counting against them, and which would they be entitled to dismiss as intuition-mongering
  or as a confusion between causal relevance and causal selection? I would like the
  concession side to be filled in, not just the critics'' side.


  3. Whether the view risks anything. In particular: does parity, once it is qualified
  to survive the obvious objections, collapse into the trivial claim that anything
  that makes a difference is a cause — and if so, is that a problem for a view about
  omissions, or a problem for the difference-making account of causation more generally?


  4. What parity predicts that its rivals (the view that omissions are not causes;
  the view that they are causes but of a different, "deontic" kind) do not predict,
  and whether any of those predictions have been or could be tested.


  I''d be most moved by an argument that shows the asymmetry is not merely pragmatic
  — i.e., a case where an omission makes the same counterfactual difference as an
  action and yet we have independent, non-normative reason to treat it as causally
  different. If you can construct such a case, do; if you think none exists, say so
  and say what that shows.


