  than being continuous or merely convex; (c) that the threshold, if it exists, is
  subject-relative (indexed to a being''s baseline welfare and adaptational set point)
  rather than absolute; (d) that the lexical priority is a feature of the axiology
  itself rather than a decision-theoretic rule for agents with bounded rationality;
  and (e) that the view survives the aggregation problem—roughly, that many mild pains
