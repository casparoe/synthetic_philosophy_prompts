  of pleasure can compensate for it. In conversation I''ve found that people divide
  sharply, and I suspect the disagreement is not really about the threshold but about
  something deeper. I''d like your actual credence that some version of LTNU is the
  correct axiology—say, credence that there exists a non-arbitrary, context-sensitive
  threshold of the kind just described, and that pains above it are lexically prior
  to pleasures. Please give me a number between 0 and 1 and then decompose it. At
  minimum, I want your probabilities for: (a) that pleasure and pain are commensurable
