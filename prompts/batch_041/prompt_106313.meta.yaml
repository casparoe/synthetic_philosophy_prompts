  "I''m a journalist — I write a weekly column about science and ideas, mostly the
  history and sociology of science — and I keep running into a phrase that I think
  is doing way more work than anyone using it realizes: ''ideas have consequences.''
  I first noticed it at a two-day workshop I was covering on why industrial capitalism
  showed up where and when it did; a very confident economic historian on the last
  panel used it to wave away a question about coal and colonies — as in, the material
  stuff was there, the thing that mattered was that people had rethought how to live,
  and that''s that. Then at dinner my friend Dan, who''s a recovering political theorist,
  said sure, but interests are the engine and ideas are only the switchmen, which
  he claims is the sober version of the whole Weber thing, and that if you take that
  seriously you can''t say culture caused anything at all. Both of them acted like
  their line was obviously true and the other''s was obviously confused, and I couldn''t
  tell if they were disagreeing about a fact or about what the words mean.


  So: I want you to act like a philosopher of the social sciences who knows the Weber
  literature cold and is allergic to hand-waving. Before you answer, brainstorm —
  just give yourself the space to list every distinct thing ''ideas have consequences''
  could be claiming, from the trivially true to the genuinely radical, and then sort
  them: which are platitudes nobody would deny, which are real substantive theses,
  which are probably just false, and which one my historian was actually relying on
  when he waved the question away (if none of them get him his conclusion, say so).
