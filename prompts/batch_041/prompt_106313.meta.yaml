  "ideas are the switchmen, interests the engine":

  1. Trivial: interests and ideas both figure in explanations.

  2. Interests have motivational priority; ideas don''t move us, they route us (denial
  of the "ideas have consequences" reading where ideas are the engine).

  3. Ideas constrain the option space: world-images determine which interest-satisfactions
  are conceivable/permissible (the radical reading: interests can''t even be formulated
  without an ideational frame).

  4. Ideas are downstream of interests (vulgar Marxist reading) — but Weber denies
  this: the switchman metaphor denies that ideas are mere reflections.

  5. Methodological: adequate explanation must be "interpretive" (Verstehen) and cite
  meaning, so ideas are ineliminable from explanation.

  6. Causal: ideas can be causes even if not the engine — and Weber''s substantive
  thesis is that a specific world-image (Calvinist predestination) routed economic
  interest into a novel track (rationalized acquisitiveness).

  7. The "which supports the use" — if someone says "culture can''t be a cause, it''s
  just a switchman," that''s reading 2/4, and it doesn''t follow; the metaphor actually
  asserts causal relevance.


