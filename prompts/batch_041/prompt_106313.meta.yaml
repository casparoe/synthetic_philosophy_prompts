  So the Nietzsche prompt: A journalist (covering ideas) is at a conference or arguing
  with an editor about whether to include historical context; someone says "history
  is the teacher of life" (or "history teaches by example") to justify it. The asker
  wants the precise readings: (1) history supplies examples for practical wisdom (Bolingbroke/Cicero
  topos); (2) history teaches by analogy — the "lessons of history" claim; (3) history
  teaches substantive laws/patterns (philosophy of history); (4) history teaches virtue
  by habituation; (5) history teaches what to expect of human nature; (6) the trivial
  reading: reading about the past is educational. And then: which readings does Nietzsche''s
  essay endorse or attack? Monumental history is the one that wants "the teacher of
  life" reading — it takes the great past as a model. Antiquarian preserves. Critical
  judges. And Nietzsche''s deeper point: history serves life only if it doesn''t claim
  to be objective science; the slogan''s claim that history teaches is fine for the
  monumental use but breaks down (the "let the dead bury the dead" / the danger of
  "the historical sense" paralyzing action; the "unhistorical" is necessary; the "suprahistorical").
  Also the "history is the teacher of life" slogan in its classical form presupposes
  the repeatability of circumstances, which modernity undermines.


