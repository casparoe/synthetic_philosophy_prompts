  "ideas have consequences":

  1. Trivial/logical: people act on their beliefs; action presupposes representation.
  (Almost analytic.)

  2. Psychological: beliefs motivate; desires alone don''t determine action.

  3. Historiographical: intellectual factors must be included in causal narratives
  (not just material).

  4. Causal: ideas can be autonomous causes, not reducible to interests; ideational
  causation.

  5. Explanatory priority: ideas explain more than material factors in key episodes.

  6. Normative/practical: what we think shapes what we do, so changing ideas changes
  the world (the activist reading — the slogan is often used to motivate intellectual
  work).

  7. Metaphysical/social-theoretic: culture is a sui generis causal domain.

  And the Weberian verdict: some readings are trivial, some Weber endorses (3, 4 in
  a qualified form via elective affinity and adequate causation), some he rejects
  (5 as a general thesis? Actually Weber does think ideas matter but he''s also the
  "switchmen" guy; and he rejects the idea that the ethic "caused" capitalism in a
  simple way — the thesis is about the spirit''s origins, not the system''s).

  Then "which reading supports the use it was put to": the person used it to say culture
  explains economic outcomes, which needs reading 4/5, and reading 1 won''t do.


