  Student answer (mixed):

  "The utility monster is a thought experiment introduced by Robert Nozick. It asks
  us to imagine a being who gets vastly more utility from each unit of a resource
  than ordinary people do -- for example, an apple gives an ordinary person one unit
  of pleasure but gives the monster a hundred. If we are utilitarians, we have to
  maximize total utility. That means we should give all the apples, and eventually
  all resources, to the monster, even if ordinary people starve. So the monster shows
  that utilitarianism cannot be right, because it would require us to sacrifice everyone
  for one being''s pleasure.


  The argument works against act utilitarianism, because act utilitarianism just looks
  at the consequences of each act and picks the one with the most total utility. It
  does not work against rule utilitarianism, because rule utilitarianism follows rules,
  and one of the rules could be ''do not sacrifice innocent people.'' So a rule utilitarian
  can avoid the monster by adopting that rule. The monster also does not work against
  average utilitarianism, because if the monster is the only one getting utility,
  the average might not be higher. Actually, average utilitarianism might still have
  a problem if the monster''s utility is high enough to raise the average, but at
  least it is less obvious.


  One standard reply is that the utility monster is impossible in practice. Nozick
  was a libertarian, so he wanted to show that utilitarianism justifies exploitation,
  but we do not have to worry about a being who gets a hundred times more pleasure
  from an apple. Another reply is that utilitarianism is not really about pleasure;
  it is about utility, which can include preference satisfaction. But the monster
  could still have stronger preferences, so that reply does not fully work.


  Overall, I think the utility monster is a strong objection to utilitarianism. It
  shows that utilitarianism is not egalitarian, because it would let one being count
  for more than everyone else. But I do not think it refutes all utilitarianism, because
  rule utilitarianism can avoid it by having a rule against sacrifice."


