  Exam question:

  "Explain the utility monster thought experiment. What exactly is it supposed to
  show about utilitarianism? In your answer, distinguish at least two versions of
  utilitarianism (for example, total versus average, or act versus rule), explain
  how the monster bears on each, and assess one standard reply. Conclude with a brief
