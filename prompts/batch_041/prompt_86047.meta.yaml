  Student answer:

  "Robert Nozick introduced the utility monster as a criticism of utilitarianism.
  The monster is a being who gets enormously more utility from any given resource
  than an ordinary person does: an apple might give you one unit of pleasure and the
  monster a hundred. Since utilitarianism tells us to maximize total utility, it tells
  us to give the monster all the apples, and then all the resources, even if everyone
  else suffers. The monster would therefore be justified in taking everything, and
  everyone else would be sacrificed for its pleasure.


  This is a problem for act utilitarianism, because act utilitarianism evaluates each
  act by its total utility and so would have to sacrifice the many for the monster.
  It is less of a problem for rule utilitarianism, because rule utilitarianism follows
  rules rather than calculating each act. A rule utilitarian could adopt the rule
  that we never sacrifice innocent people, and that rule would block the monster.
  It is also less of a problem for average utilitarianism, because average utilitarianism
  looks at average utility, not total utility, and the monster''s huge utility might
  not raise the average if everyone else is miserable. So the monster mainly refutes
  total act utilitarianism, not utilitarianism as such.


  A common reply is that the utility monster is empirically impossible. Nozick was
  a libertarian, so he wanted to show that utilitarianism justifies exploitation;
  but we have no reason to think such a being exists. Another reply is that utilitarianism
  is not hedonism: utility can be preference satisfaction, not just pleasure. But
  the monster could have stronger preferences too, so this reply does not fully answer
  the objection.


  I conclude that the utility monster is a powerful objection to utilitarianism. It
  shows that utilitarianism is not egalitarian, because it lets one being count for
  more than everyone else. But because rule utilitarianism and average utilitarianism
  can avoid the conclusion, the thought experiment does not refute utilitarianism
  in every form."


