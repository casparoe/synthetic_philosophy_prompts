  Potential prompt:


  I am a high school student who helps run our school''s philosophy of religion club,
  and next month I have been asked to lead a forty-minute session on Maimonides''
  view of animal sacrifice. I have read some Maimonides in translation and I think
  I understand the basic idea—that the sacrificial commandments were a kind of pedagogical
  concession to the Israelites'' historical situation, designed to redirect an already
  familiar practice rather than abolish it outright—but I am not confident I can explain
  it to peers who have never opened a medieval philosophical text. I want you to act
  as an expert in medieval Jewish philosophy and in teaching difficult ideas to beginners,
  and to plan the session rather than deliver the explanation. Please start by brainstorming
  the conceptual dependencies: what has to be in place before the concession reading
  even makes sense to my audience, what order the pieces should come in so that the
  view feels like a solution to a problem rather than an odd historical claim, and
  which parts of the standard picture of Maimonides I should bracket at this level.
  Do not give me readings, citations, or a script; I need a teaching plan.


  The one example I want to carry the session is the generation in the wilderness,
  surrounded by idolatrous cultures and accustomed to expressing worship through sacrifice,
  but I am not sure whether that example does the work or whether it invites the wrong
  picture of God as a manipulator. Please tell me what the carrying example must have
  and lack, and whether I should replace or supplement it. I also need a misconception
  map: where my peers will likely think Maimonides is saying the sacrifices were a
  sham, that he is embarrassed by the Torah, that prayer simply replaces sacrifice,
  or that the concession was only temporary; exactly where in the sequence each of
  those should be headed off; and what I should openly refuse to explain at this level.
  Finally, give me one or two questions I can ask at the end to see whether they have
