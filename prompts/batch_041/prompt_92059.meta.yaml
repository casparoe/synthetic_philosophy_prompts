  I have been reading rationalist blogs and forums for years, and I keep returning
  to a puzzle about inheritance taxation. The actual institutional practice in the
  United States is a strange hybrid. There is an estate tax, but it kicks in only
  above a high exemption threshold, so most estates never pay it. There is a gift
  tax, but it has an annual exclusion and a lifetime exemption, so ordinary family
  transfers are largely untaxed. And, most strikingly, capital gains are forgiven
  at death through step-up in basis: the heir''s cost basis is reset to the value
  at the date of death, so the accumulated appreciation is never taxed as income.
  Meanwhile, wages are taxed from the first dollar, and lifetime accumulation above
  the estate-tax threshold is taxed once, at death. The result is an institution that
  simultaneously recognizes a public claim on dynastic wealth and shields most of
  the mechanisms by which dynastic wealth is actually transmitted. I want to know
  what philosophical commitments this practice presupposes. Does it presuppose that
  the deceased''s right to bequeath is strong but not unlimited, that the state''s
  claim is triggered only by death rather than by holding or receiving, that equal
  opportunity is compatible with large intergenerational transfers so long as they
  are taxed once, or something else? Reconstruct the implicit theory of inheritance,
  desert, and equal opportunity that would make the whole package coherent. Distinguish
  what the practice strictly presupposes from what it merely fits well with: which
  parts of the tax code would survive under several rival theories, and which parts
  are doing real philosophical work? Is the hybrid philosophically underdetermined,
  or is there a single view it quietly rules out? Finally, suppose we replaced it
  with a system built on a straightforward equal-opportunity premise: a lifetime,
  non-transferable inheritance allowance for each person, with transfers above that
  allowance taxed at or near 100%, and no step-up in basis. What would that system
  presuppose that the current one does not, and what would have to change in our conception
  of property, family, and desert for it to be legitimate?


