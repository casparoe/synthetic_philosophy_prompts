  "I''m an early-career historian (postdoc, modern Europe) and three weeks from now
  I have to give a 40-minute paper at a two-day workshop on genocide and modernity,
  and the Q&A is going to be rough. Can you help me get ready? You''ve seen this fight
  before — you know the Historikerstreit literature and the later round of it, and
  you''ve sat through enough of these workshops to know what a room like this actually
  asks. Think it through before you write: first figure out who''s in the room and
  what each person is committed to, then brainstorm every objection you can imagine,
  then rank them, and only then write the sheet.


  Here''s my thesis, roughly. Everyone treats the uniqueness question as a question
  about the event: does the Holocaust have some property (industrial killing, racial
  ideology, total bureaucratic intent) that no other mass atrocity has? I want to
  argue that''s a category mistake. Uniqueness claims are really claims about explanatory
  indispensability — about whether some particular explanatory apparatus is needed
  to account for the thing, i.e., whether any adequate account of the modern state''s
  capacity for mass murder can be given without going through the Nazi case. So ''the
  Holocaust is unique'' is not a claim about 1941-45; it''s a claim about the shape
  of our explanatory projects, and it''s indexed to a present — to what an audience
  needs explained. On this reading Nolte''s comparability thesis isn''t so much false
  as trivial (of course you can always find a comparison that holds on some dimension),
  and the real action is in why the dispute felt so existentially loaded on both sides:
  an indispensability claim about an explanation functions as a claim about who is
  required to keep telling the story, and that''s an identity claim, not a historical
  one. Second, smaller move: I want to say Bauman''s Modernity and the Holocaust is
  actually the weakest of the modern positions, because a theory that makes the Holocaust
  the apotheosis of bureaucratic rationality predicts it wherever bureaucracy and
  instrumental reason go, and then can''t distinguish the cases — which is the one
  thing the book was supposed to do. And I want to use Browning''s Ordinary Men against
  it: the men in Reserve Police Battalion 101 mostly weren''t cogs in a rationalised
  machine; the batch who were offered a way out and didn''t take it were moved by
  peer pressure and something much more ordinary. If that''s right, the modernity
  story and the ordinary-men story pull in opposite directions and we''ve been teaching
  them as complimentary [typo] for thirty years.


  The room: eight people, and I know roughly who they are. Two German-trained historians
  of the Third Reich in the functionalist tradition, allergic to philosophy of history
  and to anything that sounds like a thesis about ''the Germans''; one of them will
  say the uniqueness talk is a political slogan and ask me whether I''m for or against
  it, which is exactly the question I don''t want. A comparativist who works on Armenia
  and Rwanda and thinks uniqueness claims are an alibi for not doing comparison; he''ll
  want to know what ''indispensable'' means operationally. An intellectual historian
  of the Federal Republic who knows the 1980s row cold and will catch me if I get
  the positions or the sequence wrong. A sociologist who teaches Bauman every year
