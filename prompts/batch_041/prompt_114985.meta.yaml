  the matter — the play is on the side of the moderns, and Gloucester''s superstition
  is of a piece with his credulity about Edgar. I think that reading is too quick,
  and that the play is closer to Kepler''s position than either of us allowed.


  What I want is a reading of the play through Kepler''s actual views on astrology,
  not the caricature of the rational astronomer who dismissed it. Kepler''s own position
  was a reform: he attacked the traditional apparatus of houses, signs, and nativities
  as groundless, but he kept a real doctrine of celestial influence — a non-compelling
  influence on the soul, exercised through the geometrical configurations (the aspects)
  rather than through the zodiac, and grounded in the same harmonic order he sought
  in the planetary motions. So the question I''d like you to work through is whether
  Lear''s cosmology is Keplerian: does the play distinguish the astrological claims
  Kepler rejected (eclipses as portents of particular political disasters) from the
  ones he retained (the stars as shaping temperaments, inclining but not compelling)?


