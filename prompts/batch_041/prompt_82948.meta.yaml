  Gödel''s position (from "A Remark About the Relationship Between Relativity Theory
  and Idealistic Philosophy," 1949): In the Gödel universe (a rotating, homogeneous
  solution to Einstein''s field equations), there are closed timelike curves: for
  sufficiently distant galaxies, one can travel into the past. Gödel''s argument:
  the existence of such a universe, consistent with relativity, shows that relativity
  theory does not admit of an objective lapse of time. He argues that if time consists
  in an objective "now" that lapses, then the relativity of simultaneity already undermines
  it, and the closed timelike curves make it worse. He concludes that time is something
  like an "ideal" or subjective aspect of experience, a consequence of our particular
  mode of perception, and that the world is a four-dimensional block. He contrasts
  this with the view that "becoming" is real. He also notes that his argument depends
  on the objectivity of simultaneity.


  Restated in distributed systems terms: There is no global clock; only a partial
  order of events (happens-before). Each process has its own local time. Any total
  order is imposed by convention (a coordinator, a timestamping scheme), and different
  conventions are equally legitimate. The "now" of a process is indexical — like "here"
  — not a feature of the world.


  What survives: the relativity of simultaneity ↔ no global clock; the indexicality
  of "now" ↔ indexicality of local time; the conventionality of any global ordering;
  the fact that any global "now" is a coordinate artifact.


  What has to be distorted: in distributed systems, the absence of a global clock
  is compensated by *logical* clocks — and the whole point is that you *can* recover
  a total order sufficient for coordination, and the partial order is *real* and *causally
  meaningful* (message passing). For Gödel, the whole point is that no ordering is
  privileged and that the causal structure itself admits loops. So the engineer''s
  framework *builds in* the asymmetry (happens-before is a strict partial order —
  acyclicity is an axiom) whereas Gödel''s universe violates it. So the engineer will
  say "closed timelike curve = a message from a process to its own past = incoherent";
  but the framework''s incoherence is a modeling choice, not a discovery. Residue:
  the engineer''s framework cannot represent a world where causality is not a partial
  order; and it treats "no global now" as a fact about *information*, whereas Gödel
  treats it as a fact about *being*. Also: the engineer has no analogue of "becoming"
  — the block universe is simply the engineer''s default (state machines and event
  logs are four-dimensional), so the engineer may not see what the fuss is about,
  and that failure to see the fuss may be a genuine limitation (the framework can''t
  even formulate the question) or may indicate that the "fuss" was about a confused
  notion.


