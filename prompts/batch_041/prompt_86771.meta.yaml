  I''m a backend engineer by trade — no formal philosophy training, though I''ve read
  a fair amount on the side — and next month I have the opening five-minute slot at
  a local philosophy-of-science reading group, ahead of a friend''s talk on Bayesian
  confirmation theory. I want to open with a joke, and I want it to be a good one,
  so let me set out the puzzle I''d like it to turn on, stated as plainly as I can.
  On the standard Bayesian picture, an agent''s evidence can raise the probability
  of a hypothesis only to the extent that the evidence was not already certain for
  her: if she had already assigned the evidence probability one, then conditionalizing
  on it leaves her credences exactly where they were, and on a likelihood-ratio measure
  of confirmation the ratio comes out to one as well. But in real scientific and engineering
  practice the strongest support we cite for a theory is often a fact we have known
  for decades — the theory earns its keep precisely by explaining something long taken
  for granted — and, closer to home, we treat a metric we already eyeballed before
  forming the hypothesis as if it could not really confirm anything, which is the
  intuition behind pre-registration and against HARKing. Philosophers seem to call
  this the problem of old evidence, and as far as I can tell the honest escape routes
  are all unattractive: insist the agent was never really at probability one, let
  her run the calculation as if she had only just learned the fact, or concede that
  the confirmation is not a matter of conditionalizing at all.


  Write me that joke. It should be an actual joke — a setup and a punchline, not a
  paragraph of wry remarks — and the punchline has to turn on the content of the puzzle,
  so that someone who has taught Bayesian confirmation theory laughs at the right
  thing rather than at a generic Bayesians-update-their-priors gag; it should also
  be accurate enough that this person would not conclude I have no idea what the problem
  is. Please do not just retell the standard story of a long-known anomaly in the
  orbit of Mercury with a punchline bolted on; I want a fresh scenario, and ideally
  one that brings out the consequence I find genuinely strange — that the better-informed
  an agent is, the less any evidence can teach her, so the only agent who can keep
  learning is one who keeps being wrong. A setting I keep circling is a twelve-step
  meeting or support group for perfect conditionalizers who can never be surprised
  by anything, but I will happily take whatever you think is funnier. Keep it under
  about 150 words, and no citations or philosopher names, please — the joke should
  stand on its own.


