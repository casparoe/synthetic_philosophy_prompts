  Grice''s key distinctions:

  - Natural meaning vs non-natural meaning (speaker meaning).

  - Utterer''s meaning vs sentence meaning.

  - What is said vs what is implicated.

  - Conventional implicature vs conversational implicature.

  - Conversational implicature features: cancellability, non-detachability, calculability,
  non-conventionality, indeterminacy.

  - Maxims: quantity, quality, relation, manner.

  - Flouting vs violating.

  - Scalar implicatures, particularized vs generalized conversational implicatures.

  - Grice''s "Modified Occam''s Razor": don''t multiply senses beyond necessity.

  - "Implicature" as a pragmatic phenomenon.


