  I''ve been reading LessWrong/ACX/SlateStarCodex-adjacent blogs for like a decade,
  and I''m trying to put together a small grant proposal for an AI safety funder.
  The project is 3 months part-time, maybe $15k, and I need a 2-page research proposal.
  Act as an expert in inverse reinforcement learning, AI alignment, and the philosophy
  of social science—someone who can tell the difference between a real open problem
  and a confused restatement of something known. Think carefully; you can brainstorm
  a few framings in your head first, but don''t show that.


  My half-formed idea: inverse reinforcement learning (IRL) is the setup where you
  watch an agent''s behavior and infer the reward function it''s optimizing. The usual
  story treats the demonstrator''s policy as a noisy readout of a fixed preference
  ordering. But humans know they''re being watched. If their behavior is going to
  train a model—or be used as feedback for one—they may choose actions to shape what
  the model infers about them, not to reveal what they actually want. So the data-generating
  process is already responding to the inference procedure. The human is, in effect,
  doing inverse inverse reinforcement learning: modeling the learner''s model of them
  and optimizing against it. This turns preference inference into a fixed-point/strategic
  problem: the learner''s posterior depends on the demonstrator''s policy, and the
  demonstrator''s policy depends on the learner''s posterior. I want to know when,
  if ever, the inferred reward identifies the human''s actual preferences rather than
  the human''s beliefs about the learner''s prior, or the human''s desire to appear
  a certain way.


  Turn this into a proposal. I need: a precise statement of the question (something
  with a determinate answer, not just ''it''s complicated''); why the standard IRL
  setup leaves it open and what the nearest existing treatments are (observer effects,
  reward hacking, Goodharting, performative data, etc.)—but don''t give me a bibliography,
  I''ll add citations myself; the method (what formal model I''d actually build, what
  assumptions, what I''d derive or simulate); what a positive result would look like
  and what would count as failure or a dead end; and a realistic scope for 3 months
  part-time. I''d especially like the proposal to say what changes if the demonstrator
  is optimizing for the learner''s posterior versus for the learner''s future policy,
  and whether there''s a difference between a single human training one model and
  many humans training a deployed system.


  Also: in the proposal, be explicit about what''s actually settled versus what''s
  genuinely contested among people who work on this. Don''t present a contested framing
  as the consensus, and if my half-formed idea is already a standard result or a known
  folk worry, just say so instead of dressing it up as novel.


