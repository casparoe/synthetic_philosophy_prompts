  it at the request of the clinical directors, and it concerns the weight the board
  may give to a patient''s refusal to accept his diagnosis. Under the amendment, when
  a patient declines medication or discharge planning, the board may treat his failure
  to recognize that he has a mental disorder — the draft calls it impaired insight
  — as affirmative evidence both that the disorder is present and that it substantially
  impairs his judgment. The directors'' rationale is not cynical: a condition that
  distorts a person''s self-assessment cannot be confirmed or denied by that same
  self-assessment, and if we discount the denial we are not overriding autonomy, because
  what we are overriding is a symptom. Our counsel''s memo notes the awkward consequence
