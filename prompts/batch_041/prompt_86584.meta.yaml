  angry, just... corrective. Like I''d spilled something on his floor. I mentioned
  it at dinner and it turned into a two-hour thing between Jonas, my German colleague,
  and Dana, an American friend of mine who was visiting. Neither of them was being
  dumb about it, which is why it stuck with me.


  Roughly how it went, as best I can remember:


  Dana: the light is a safety device. Its whole point is to stop you getting hit by
  a car. At 11pm with nothing on the road, obeying it isn''t virtue, it''s a failure
  to think about what the rule is for. She said if you can''t tell the difference
  between a rule and its purpose you''re not being moral, you''re being obedient,
  and those aren''t the same thing.


  Jonas: he said the point of a light isn''t just safety, it''s that nobody has to
  work out what everyone else is going to do. The value of a norm is that it applies
  without anybody re-deciding whether it applies. And the moment each person gets
  to decide when the rule is silly, it stops being a norm and becomes a negotiation,
  and then the people who are bad at negotiating (kids, old people, anyone slow) are
  the ones who pay for it.


  Dana: that just means the norm is useful, not that it''s binding — if the value
  is that it saves everyone the trouble of guessing, then in a case where there''s
  nobody to guess about, the value is zero, and obeying anyway is superstition.


  Jonas: [something about equality/not granting yourself an exception — "if you cross,
  you''re saying the rule is for other people." Dana: "no, I''m saying the rule doesn''t
  apply where there''s nothing for it to do. Those are different."]


  Then it flipped, and this is the part I actually want help with. Dana said Americans
  are the rule-bound ones, not Germans. She said: in the US nothing happens without
  a contract, a waiver, an HOA covenant, a sign, a lawyer; we don''t trust each other
  to just know how to behave, so everything has to be written down and enforced, and
  that''s why we sue each other constantly. Germany, she said, runs on unwritten stuff
  — you all just know, and you get to be loose because you have a shared floor. Jonas
  said that''s exactly backwards and exactly the problem: a society that has to write
  everything down has already lost the thing that makes a society; and anyway his
  point was the opposite — the German way is better *because* the norms are internal,
  not because they''re rigid; the rigidity is the price of not needing police for
  everything.


  Dana came back with: your norms are just habits you were born into and never chose,
  and mine are at least things people agree to. She said conscience is something you
