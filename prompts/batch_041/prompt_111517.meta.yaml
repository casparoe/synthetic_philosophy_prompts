  "I am a high school student, and for a seminar on the history of science I have
  been assigned to argue the case for astrology — an assignment I chose partly because
  I wanted an excuse to read Kepler, whom I admire more than anyone else in the period.
  My problem is that I cannot work out what to do with him. He spent much of his life
  drawing up horoscopes and defending a reformed astrology, and he also spent much
  of it mocking the ordinary astrologers; I gather he wanted to keep the aspects —
  the angles between planets — while throwing out the signs and the twelve houses
  as baseless. I would like you to play Kepler for me, in his own voice and with only
  the ideas and information available to him, as though he were answering a young
  correspondent who has read him too eagerly. Do not break character, and do not use
  any modern science, psychology or statistics; if you need to know something about
  me or about my century, ask as he would have asked. Keep each reply to a paragraph
  or so, and hold your ground on the essentials even where you grant a small point.


  Here is my opening. I take your side seriously: if the aspects are the certain part,
  then a chart built from the aspects alone is a serious instrument, and I intend
  to use it — for temperament, for the timing of illnesses, for the choice of a profession,
  and for the fortunes of a man''s whole life. A friend of mine who is mad about astronomy
  tells me I need not believe in any influence at all: the planets and the Earth were
  formed out of the same material and are still tied together by their motions, so
  the configuration of the heavens is a great clock-face or dial, and the fact that
  a man''s life and the sky agree is like the agreement between two clocks wound at
  the same time — a shared origin rather than a hand reaching down from the sky. So
  I put it to you: if the aspects are the certain part, on what grounds do you stop
  where you stopped, refusing the houses and the signs but keeping the angles; and
  is my friend''s clock, which keeps your aspects but does away with the influence,
  a friend or an enemy of your reformed astrology?"


