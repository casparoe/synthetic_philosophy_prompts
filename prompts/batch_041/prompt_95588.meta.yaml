  I spent my working life in the natural sciences—experimental physics, if it matters—and
  have only recently begun to read philosophy and historiography. I have been reading
  about the Fischer controversy, the debate over German responsibility for the First
  World War, and I find the conceptual question more interesting than the archival
  one: what does it mean, exactly, to hold a nation responsible for a war? I have
  been trying to formulate a criterion, and I would like you to tell me what would
  count against it.


  The criterion, roughly, is this. A nation N bears principal responsibility for a
  war W when: (1) some decision-making body within N occupied a pivotal node in the
  causal network leading to W—there was a feasible alternative decision that would
  have made W substantially less likely; (2) the decision was taken with foreseeable
  awareness of the risk of general war, or with culpable indifference to that risk;
  (3) the decision was not itself the product of coercion or of a threat that left
  N no reasonable alternative; and (4) N''s internal political order gave the relevant
  decision-makers the capacity to choose otherwise. I do not mean sole responsibility.
  I mean something like primary or principal responsibility, compatible with other
  powers having contributed and compatible with the war being overdetermined in various
  respects. I have also been trying to carry over two ideas from outside history:
  the NESS test from tort law, on which a condition is a cause if it is a necessary
  element of a sufficient set, and the sufficient-component cause model from epidemiology,
  which treats causes as components of sufficient sets rather than as necessary conditions.


  On this criterion, I am inclined to think that the German leadership bears principal
  responsibility for the First World War. But I am not confident that the criterion
  is doing the work I want it to do. What I want from you is a map of its exposure.
  What findings, arguments, intuitions, or formal results would count against the
  claim that the German leadership was principally responsible on this criterion?
  Which of these would be fatal, and which merely awkward? Which would a defender
  of the criterion concede as counting against them, and which would they dismiss?
  Does the criterion collapse into a tautology, or into a restatement of the fact
  that the losers were blamed? Does it blame too many parties—Austria-Hungary, Russia,
  France, Britain—and if so, does that show that principal responsibility is the wrong
  concept, or only that it is distributed? What does the criterion predict that rival
  accounts—a balance-of-power account, a structural account, an account centered on
  the alliance system—do not? If it predicts nothing distinctive, is it a substantive
  position or a redescription? What would the world have to look like for the German
  case to fail the criterion: for the pivotal decision to be elsewhere, or for the
  German decision to be coerced, or for the relevant decision-makers to lack the capacity
  to choose otherwise? And how much of my position is empirical, how much conceptual,
  and how much moral?


  I am not asking for a bibliography, a reading list, or citations. I am asking for
  the conceptual shape of the defeaters, ranked from fatal to merely awkward, with
  an honest assessment of whether the position risks anything at all or has been insulated
