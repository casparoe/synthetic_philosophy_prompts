  a feature of (attributor) contextualism about the word, and it''s usually described
  as a form of indexicality or a non-standard semantics, not relativism about truth
  (relativism would make truth relative to a context of assessment, not the context
  of utterance). And for the encroachment thesis, it''s not "both right" at all —
  there''s a single fact of the matter about whether the subject knows, which depends
  on the stakes; that''s a form of invariantism about knowledge. So the "relativism"
  label is doubly off.

