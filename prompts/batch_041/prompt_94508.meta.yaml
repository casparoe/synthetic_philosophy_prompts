  For Rorty: the dispute between two writers about whether a text can mean something
  its author didn''t intend, and whether "the reader''s reading is as valid as the
  author''s" is relativism. Rorty''s antirepresentationalism: the idea that the notion
  of "getting it right" is not the point; vocabularies are tools; the "author''s intention"
  is just another description. And the anti-relativist charge: if you say all readings
  are equally valid, you can''t say the misogynist reading is wrong, and you can''t
  object to your own book being used for something you hate. Rorty''s reply: pragmatism
  doesn''t say all readings are equal; it says the question "which is true?" is replaced
  by "which is useful for which purpose," and purposes can be criticized. Round 3:
  the realist says that''s a dodge — either the purpose-relative answer is itself
  true, or it''s just another preference, and if the latter, then Rorty''s own critique
  of representationalism can''t claim to be better. Rorty''s defender: "better" doesn''t
  need to mean "more accurate"; the critic is demanding that any defense of a position
  be a mirroring, which is the very assumption in dispute. Round 4: the realist says
  the position is self-exempting: it applies its deflation to everyone else''s claims
  but treats its own as correct. This is a genuinely hard dispute and adjudication
  requires distinguishing "truth is not correspondence" from "truth is not objective,"
  and "no fact of the matter about interpretation" from "no fact of the matter about
  nature," plus the difference between "no non-circular justification" and "no justification,"
  and the distinction between Rorty''s ethnocentrism and relativism (Rorty explicitly
  says we should be ethnocentric, not relativistic — "we have to start from where
  we are").


