  Good''s theorem: I.J. Good''s result that the expected value of information (of
  a free experiment) is non-negative — "the value of information is non-negative"
  under expected utility maximization with a prior; but also the impossibility of
  assigning a value to information you don''t yet have (Good''s "value of information"
  — you can''t decide how much to pay for information before knowing what it will
  say, since the value depends on the message). Actually Good''s theorem states that
  free information is always non-negatively valuable in expectation — a Bayesian decision
  maker should never refuse free information. And the paradox: a rational agent might
  prefer not to receive information (e.g., the "self-fulfilling" cases, or cases where
  the information changes your behavior — but Good''s theorem says expected value
  is non-negative for free information under certain conditions, though it fails for
  "non-free" or when the act space is restricted / with randomization / with the value
  of information about one''s own decisions (the "no-self-knowledge" issue)).


