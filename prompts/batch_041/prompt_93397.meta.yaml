  for making each other''s estimates and reasoning common knowledge — that''s why
  the procedure has a "reveal and re-elicit" round before averaging). Nice: this gives
  the procedure a distinctive step that comes straight from the theory — the "public
  announcement" round. The theory says disagreement can only persist if beliefs aren''t
  common knowledge, so a procedure should force common knowledge and see if the spread
  collapses. That''s a beautiful translation of the theorem into a step! Before averaging,
  run a round of mutual disclosure of estimates *and reasons*, then re-elicit. If
  spread collapses → it was private information. If it doesn''t collapse → either
  not fully common knowledge, or priors differ.

  3. The "no-trade" flavor: if you and the panel disagree and you both know each other''s
  estimates, something has to give — someone must be wrong about something, or the
  priors differ. So the procedure''s diagnostic: find the *source* of the disagreement
  (different evidence, different model, different weighting of the same evidence,
  different values/stakes) — this determines whether to pool, to model, or to report
  a range.

  4. Sharpening/underconfidence: the pooling step needs a sharpening rule, and the
  procedure must say when not to sharpen.

