  The conceptual core: the common prior assumption. Its role: it''s what licenses
  "disagreement = private information ⇒ pool/update" and what fails when priors genuinely
  differ (different models, values, or interests) ⇒ then pooling is illegitimate and
  you should model the disagreement rather than average it away. Key distinctions
  to preserve:

  1. Disagreement in posterior vs. disagreement in prior vs. disagreement in likelihood/model.

