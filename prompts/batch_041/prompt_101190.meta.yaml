  For some years now I have been reading philosophy in earnest — I am a retired experimental
  biologist, sixty-eight years old, and I came to these questions late — and I have
  found myself preoccupied with what is generally called the hinge-of-history hypothesis.
  Stated plainly, it is the claim that history does not matter evenly: that there
  are particular moments at which a small number of people, making particular choices
  within a short window, determine a disproportionate share of the value of the entire
  subsequent future; and, in its stronger form, the further claim that we ourselves
  may be standing at such a moment. I want to test this hypothesis rather than affirm
  it, and I want to test it against a real episode rather than an invented case.


  The episode is the Asilomar conference on recombinant DNA, held in February 1975
  on the Monterey Peninsula, and the moratorium that preceded it. The bare facts,
  in case you need them fixed: after Paul Berg and others had developed the technique
  for joining DNA from different organisms, a group of biologists — Berg and Maxine
  Singer among the organizers — called publicly, in 1974, for a voluntary halt to
  certain experiments until the hazards could be assessed; roughly a hundred and forty
  scientists, together with a few lawyers and physicians, then met at Asilomar and
  produced a set of containment guidelines that were subsequently adopted and that
  shaped the regulation of biotechnology for decades. The actors were, by any ordinary
  standard, a small group; the window was short; and they were plainly aware that
  they might be deciding something large.


  I would like you to analyze that episode through the hinge-of-history hypothesis,
  and to run the analysis in both directions — the hypothesis upon the episode, and
  the episode back upon the hypothesis. I am asking for a disciplined case analysis,
  not a narrative of what happened, and not a sermon either for or against longtermism.


  To keep the analysis honest, I want you to use two distinctions I have been turning
  over, which you should treat as my own proposals and feel free to criticize. The
  first is between a moment that is pivotal and one that is merely prominent: a moment
  is pivotal only if the counterfactual divergence is large — the world that follows
  from the alternative branch differs enormously in value from the world that follows
  from the branch actually taken — and only if the branch not taken was genuinely
  live, that is, had a non-negligible probability of being taken. A decision that
  could never realistically have gone the other way is prominent but not pivotal,
  however dramatic it looks. The second is the distinction between an open hinge and
  a closed hinge: an open hinge is a juncture whose participants knew they stood at
  a choice and could deliberate about it; a closed hinge is one that can be identified
  as pivotal only from the far side, by historians, and that no one at the time experienced
  as a decision point. I suspect the hinge-of-history hypothesis, as usually stated,
  quietly presupposes open hinges, and that this is a weakness.


  Then the questions:


  - Who are the players, on the hypothesis''s own terms, and what were the actual
  options and payoffs? Was there a live alternative branch — e.g., an indefinite or
  permanent moratorium, or conversely unregulated research — and how live was it?

  - Run the pivotal-versus-prominent test on the episode and give your verdict, with
  reasons.

  - Where does the hypothesis illuminate the episode (what does it make salient that
  a history of science would not), and where does it misdescribe or overreach (where
  does it force the episode into a shape it does not have)?

  - What does the episode in turn show about the hypothesis? Does it confirm it, count
  as an anomaly against it, or reveal a case the hypothesis never anticipated — for
  instance, that the actors were less exercising power over the future than deferring
  to an unknown one?

  - Attend to the epistemic gap: the hypothesis evaluates moments by the magnitude
  of what was at stake, while the actors could know almost nothing of what was at
  stake. Say what follows for whether such moments can be identified and acted on
  from inside them, which is the only place anyone ever stands.


  Close by telling me whether the episode leaves the hinge-of-history hypothesis stronger
