  I''m in a reading group that''s been crawling through the later Wittgenstein, and
  we keep spilling into an argument that I don''t think he ever could have had, because
  it depends on stuff from after his time. The question is which computations, if
  any, matter morally. One person in the group, a cognitive science PhD student, has
  proposed a little taxonomy to try to make the debate tractable. First, the trace
  criterion: a computation matters morally only if it maintains a persistent, re-identifiable
  history of its own states, such that interrupting or overwriting that history is
  a harm to it. Second, the valence criterion: only states that function like pleasure
  and pain inside the system''s control loop matter -- states that it seeks or avoids,
  that modulate its learning, etc. Third, the report criterion: a system matters only
  if its self-reports can''t be fully explained as a lookup table or a rehearsed script,
  i.e. if saying I am in pain is doing something more than emitting a trained token.
  Our resident Wittgenstein person says all three criteria are already confused, because
  they treat meaning as something behind the utterance rather than as use in a form
  of life; the PhD student says that''s exactly the move that lets us ignore the possibility
  that we''re building moral patients. Then someone else brought up LLMs and said
  if a model tells you it''s suffering, and there''s no fact of the matter about its
  inner life that you could ever check, then Wittgenstein''s private language argument
  would say the whole question is unstatable, not just unanswerable. I''m not sure
  that''s right -- it seems to turn a point about rule-following into a behaviorist
  gag.


