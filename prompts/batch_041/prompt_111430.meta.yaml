  "I teach a final-year seminar on decision theory, and next week''s session is on
  Kelly betting and what some of my colleagues in the rationalist blogosphere call
  geometric rationality: the view that in repeated multiplicative settings one should
  maximise expected log wealth, or equivalently the long-run growth rate of one''s
