  a fussy specification. It must be funny to people who actually know the position
  — the laugh has to come from a consequence of the theory, not from the mere fact
  that gambling is involved — while still making sense to a colleague who has never
  placed a bet. The familiar shapes are barred: no economist and the banknote on the
  pavement, no gambler''s fallacy, no house-always-wins, and no jokes that would work
  equally well about any theory whatsoever. I also don''t want a riddle or a bumper-sticker;
  a shaggy-dog story, or a two-hander in which the second speaker''s line does the
  work, would suit the room.


  The following features of the position are common ground in the seminar, and any
  of them may be pressed into service: that the growth-maximising stake is a fraction
  of one''s capital equal to one''s edge, never the whole of it however favourable
  the terms; that a bettor who stakes substantially more than this — on the usual
  continuous-time approximation, more than twice the growth-optimal fraction — drives
