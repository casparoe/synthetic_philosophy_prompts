  Prompt:


  I''m a TA for an ethics and public policy course, and my grandmother just moved
  into a care home where they use QALYs to decide who gets what. Its got me thinking
  about prioritarianism more than I ever wanted to. Anyway, I have to grade this student''s
  answer. The question was:


  Explain the leveling-down objection to egalitarianism and assess whether prioritarianism
  avoids it. Then distinguish prioritarianism from utilitarianism and from maximin.
  Finally, consider this case: There are two groups. Group A is badly off (well-being
  10). Group B is very well off (well-being 100). Policy X gives Group A +2 and Group
  B -20. Policy Y gives Group A 0 and Group B +20. Policy Z gives Group A 0 and Group
  B -20. Which policy would a prioritarian prefer, and does the case pose a problem
  for prioritarianism?


  Student''s answer:


  Egalitarianism says equality is intrinsically good. The leveling-down objection
  says that if equality is intrinsically good, then it can be good to make the better
  off worse off even if no one is made better off. For example, if everyone is blind,
  that is equal, but it is not obviously better than a world where some can see. Prioritarianism
  avoids this because it does not value equality intrinsically. It gives priority
  to those who are worse off, but it does not care about inequality as such. So a
  prioritarian would not support Z. In the case, a prioritarian would choose X over
  Y because X benefits the worse off. This is basically the difference principle:
  maximize the position of the worst off. However, unlike utilitarianism, prioritarianism
  does not simply maximize total well-being; it may sacrifice some total for the sake
  of the worse off. The leveling-down objection therefore does not apply to prioritarianism.
  One might object that if prioritarianism gives absolute priority to the worse off,
  then it would choose X even if the cost to Group B is enormous, but that is just
  what it means to give priority to the worse off.


  Can you grade this? I need a letter grade and then specific comments, point by point,
  saying what''s right and what''s wrong. Also, if the student gets something subtly
  wrong, explain how I should explain it to them without just giving them the answer.


  This is good. But check subtle mistakes:

  - "would choose X over Y because X benefits the worse off" — prioritarianism doesn''t
  necessarily choose X; depends on weight. Also X reduces total by 18, Y increases
  total by 20. A prioritarian with a moderate priority weight might choose Y if the
  benefit to B is large enough. So this is a subtle mistake.

  - "This is basically the difference principle: maximize the position of the worst
  off." — conflates prioritarianism with maximin/Rawlsian difference principle. Prioritarianism
  is not maximin; it is a weighted sum with priority to lower well-being. Maximin
  would choose X regardless of cost to B, as long as A gets +2? Actually maximin maximizes
  the worst off; X gives A 12 vs Y gives A 10, so X. But prioritarianism might choose
  Y if B''s gain is large enough. So the mistake is subtle.

  - "absolute priority" — prioritarianism is not absolute; it''s a matter of degree.
  But student says "if prioritarianism gives absolute priority..." as an objection;
  they don''t necessarily endorse it. Actually they say "One might object that if
  prioritarianism gives absolute priority... but that is just what it means to give
  priority." That suggests they think prioritarianism does give absolute priority.
  That''s a mistake.

  - "does not care about inequality as such" — correct for prioritarianism, though
  prioritarianism can be described as having a concave transformation of well-being;
  it doesn''t care about inequality intrinsically. Good.

  - "would not support Z" — correct, because Z doesn''t benefit worse off and lowers
  total; prioritarianism would not prefer Z. Though if prioritarianism is only about
  worse off, Z doesn''t affect A, so it''s indifferent? Actually prioritarianism values
  total well-being too, so Z is worse than status quo. So correct.

  - "leveling-down objection therefore does not apply" — correct.

  - "Egalitarianism says equality is intrinsically good" — standard.

  - "if everyone is blind, that is equal, but it is not obviously better than a world
  where some can see" — standard leveling down example. Fine.


