  Which domain is most in the weeds yet tractable? "The wrong kind of reasons problem"
  — this is a nice one. The wrong kind of reasons problem: reasons to have an attitude
  that bear on the attitude''s fittingness vs. reasons that bear on the benefits of
  having it (e.g., a demon threatens you unless you admire him). The problem: what
  makes a reason the "wrong kind" of reason for an attitude like belief or admiration?
  The standard answer is the "object-given/state-given" distinction (Parfit), or the
  "fittingness" account. A more in-the-weeds angle: whether the wrong-kind-of-reasons
  problem generalizes to all attitudes, or whether the distinction collapses for conative
  attitudes; also the "shmagency" style moves, or the problem of how the distinction
  is to be drawn for reasons for emotions (e.g., reasons to feel fear). Also relevant:
  the "no reasons for attitudes" view; the "reasons as evidence" view of belief.


