  Draft:


  "I write about science and ideas for a general-readership magazine, and I''m at
  work on a long piece about a dispute in metaphysics that I suspect matters more
  than it sounds like it should: whether a thing''s dispositions — its fragility,
  solubility, flammability — can be analyzed in terms of what would happen to it under
  certain conditions, or whether they have to be taken as basic features of the world.
  The standard difficulty, as I understand it, is that the naive conditional analysis
  (''x is disposed to M when S iff x would M if S'') is broken by cases where the
  stimulus itself destroys the disposition before it can manifest (the fink), by cases
  where the manifestation is blocked while the disposition remains (the mask), and
  by cases where something produces the manifestation without the disposition (the
  mimic). The repair I keep seeing proposed is to add a clause to the effect that
  the thing would manifest if its causal basis were intact and unmasked — and my question
  is whether that repair is doing any real work or just helping itself to the very
  notion it was supposed to analyze.


  I''ve been turning over a variant of my own, which I''d like you to reason about
  rather than look up. Imagine a lock disposed to open when the right key is inserted.
  The lock is fitted with a single mechanism that, at the instant the key turns, both
  deforms the tumblers so the key no longer fits and jams the bolt; the two effects
  are produced by one switch, and there is no way to trigger one without the other.
  After the key turns, the lock does not open. Is the disposition gone (the tumblers
  are ruined, so the causal basis is destroyed) or merely blocked (the bolt is jammed,
  so the basis survives)? I can''t get a clean answer, and I''ve started to wonder
  whether the fink/mask distinction is a real joint in nature or just a distinction
  in how we choose to describe a case.


  Here is what I want from you. Give me a single credence — a number between 0 and
  1 — that the conditional analysis of dispositions can be repaired, non-circularly
  and without smuggling in dispositional notions, by clauses about the causal basis
  being intact and unmasked. Then decompose it: how much of your number rides on whether
  finks and masks are genuinely possible states of affairs rather than artifacts of
  description; how much on whether ''intact'' and ''unmasked'' can be cashed out in
  non-dispositional, categorical terms; how much on whether the causal basis of a
  disposition can be identified independently of the disposition itself; how much
  on whether a circular analysis can still be a correct metaphysical account even
  if it fails as a conceptual one; and any further terms you think belong, each with
  a rough probability and one line of justification. Then combine them into your final
  number, tell me which sub-question the number is most sensitive to, and say what
  argument or finding would move it most. For calibration: I''d put myself at about
  0.35, and the philosopher I spoke with last week puts herself at about 0.8; if you
  can, tell me which term in the decomposition she and I are most likely actually
  disagreeing about. No citations or reading list, please — I''m interested in how
  you weigh it, not in who said what."


