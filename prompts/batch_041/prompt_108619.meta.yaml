  such an outcome as better merely because the inequality between the better off and
  the worse off has been reduced. Your task is to compare absolute and relative prioritarianism
  as answers to the leveling-down objection. In doing so, address the following: (a)
  whether absolute prioritarianism is strongly or only weakly leveling-down-proof,
