  that weight depends at least partly on how that person''s level compares with others''
  levels. We also introduce two senses in which a distributive view might be leveling-down-proof.
  A view is strongly leveling-down-proof if it never ranks an outcome as better than
  another when the only change is that some better-off people are made worse off and
