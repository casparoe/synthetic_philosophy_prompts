  runs from the Law of Jante to lagom to the taller-poppy varieties of resentment.
  Two things should be kept straight. The Law of Jante is not a statute: it is a satirical
  invention, ten rules plus a menacing eleventh, put into a 1933 novel by the Danish-Norwegian
  writer Aksel Sandemose and since become shorthand for a real attitude — the suspicion
  directed at anyone who claims to be more than the people around them. And the American
  Dream should not be flattened into boosterism; it is a promise about what a person
  is for, and a poem that treats it as mere marketing will miss the argument. What
  I want the poem to show is that the two codes are answers to one question — who
  do you think you are? — and that the celebration and the cutting-down can be the
  same sentence in different mouths.


