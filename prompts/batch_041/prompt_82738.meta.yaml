  I am a third-year student in a course on truth, relativism, and cross-cultural epistemology,
  and our unit on the Jain doctrine of many-sidedness has produced an argument that
  my study partner and I cannot get past. As we have reconstructed it, the doctrine
  (anekāntavāda) holds that every real thing has indefinitely many aspects, so that
  any statement about a thing is true only from a particular standpoint (a naya) and
  never captures it wholly; the associated logic of conditional predication (syādvāda)
  then says that, in some respect, a thing is, in some respect it is not, in some
  respect it is and is not, and so on through the seven modes, with each mode prefixed
  by a qualifier that restricts it to a respect. The evident purpose of the machinery
  is polemical: it is meant to show that every rival philosophical view is one-sided
  -- it mistakes a partial standpoint for the whole -- while the many-sided view alone
  escapes the charge. Here is the argument we wrote out.


  (1) Every assertion is true only relative to a standpoint; taken by itself, no assertion
  states how things are without qualification. (2) Call an assertion one-sided when
  it advances a standpoint-relative claim as though it were unqualified. (3) Anekāntavāda
  asserts, as its central claim, that every assertion is one-sided. (4) Consider (3)
  itself. If it is asserted without qualification, then by (2) it is one-sided, and
  by (1) it is true only from a standpoint; but then its negation is also true from
  some standpoint, so it does not exclude the position that some assertions are true
  without qualification. (5) If, instead, (3) is advanced only from a standpoint,
  then it again fails to exclude that position, since it claims for itself only standpoint-relative
  status. (6) Either way, the doctrine cannot rule out the view that some claims are
  unqualifiedly true, and so cannot perform the polemical work it exists to perform.
