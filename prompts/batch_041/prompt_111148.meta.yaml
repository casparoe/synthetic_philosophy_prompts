  Possible prompt:


  "Two colleagues of mine in a philosophy of mind reading group spent most of a session
  arguing about Moore''s paradox. The disagreement was not about whether the sentences
  are absurd but about what the absurdity consists in. I was taking notes and have
  reproduced the exchange as fairly as I can.


  A began: The oddity is purely pragmatic. The sentence ''It is raining, but I do
  not believe that it is raining'' can be true—people can be wrong about their own
  beliefs, or at least fail to believe a truth—and it is not contradictory. What is
  absurd is the act of asserting it. When you assert the first conjunct you represent
  yourself as believing it; the second conjunct then denies that very commitment.
  So the paradox is a matter of conversational implicature, not semantics.


  B replied: That cannot be the whole story. The absurdity survives when the sentence
  is not asserted but merely considered as a belief. Try to believe the conjunction:
  ''It is raining, but I do not believe that it is raining.'' That does not seem like
  a merely awkward assertion; it seems like something you cannot coherently believe.
  And notice that ''It is raining, but I do not know that it is raining'' has the
  same air, even though knowledge is factive and belief is not. So the problem is
  not just about assertion; it is about the relation between first-person belief and
  the content believed.


  A responded: The belief case is not decisive. We can believe all sorts of things
  that we cannot assert. I can believe that my colleague is wrong without being willing
  to say it. What you are calling the impossibility of belief may just be the impossibility
  of simultaneously occupying the first-person perspective and the third-person perspective
  on the same belief. The first conjunct is expressed from within the belief; the
  second conjunct reports on the belief from outside. That is a perspective clash,
  not a logical contradiction.


  B came back: But that perspective clash is exactly what a theory of the paradox
  has to explain, and ''pragmatic'' does not explain it. If the problem were only
  that assertion expresses belief, then a Moorean sentence embedded in a larger sentence
  should be just as bad. It is not: ''If it is raining but I do not believe it, then
  I am in for a surprise'' is perfectly intelligible. The absurdity is tied to the
  unembedded first-person present-tense assertion, which suggests it is a norm of
  assertion—perhaps the norm that you must believe what you assert—rather than a semantic
  contradiction. But then the norm itself needs a rationale. Is it constitutive of
  assertion, or merely a conversational regularity?


  A: If you make it a constitutive norm, you owe an account of why it is constitutive.
  I can imagine a community that asserts things they do not believe, as a game or
  a ritual. The Moorean sentence would be odd for us, but not because it violates
  the essence of assertion. And the fact that the embedded case is fine shows that
  there is no semantic defect. So I still say: semantics is clean, pragmatics does
  the work.


  B: And I still say: pragmatics cannot do all the work, because the paradox also
  arises for the commissive version—''It is raining, but I believe that it is not
  raining''—which is not just a failure to believe but a positive conflicting belief.
  That looks closer to a contradiction in the speaker''s commitments, not just a conversational
  misfire. And there are cases where a Moorean sentence is true and yet we would not
  say the speaker has made a mistake about the weather; we would say they are in a
  peculiar epistemic position. So the paradox is about the ethics or norms of belief,
  not just assertion.


