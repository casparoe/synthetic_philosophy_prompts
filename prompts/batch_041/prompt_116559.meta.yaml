  Idealism defeaters:

  1. Empirical equivalence: idealism predicts nothing different observationally, so
  no empirical defeater exists — is that a virtue or a problem? If a view can''t be
  refuted by experience, and its rivals can''t either (empirical equivalence is symmetric),
  then the dispute is about theoretical virtue: parsimony, explanatory unification,
  fit with the rest of science (physics posits mind-independent fields etc.).

  2. Master argument''s validity: the step from "I cannot conceive a tree existing
  unconceived" to "a tree cannot exist unconceived" — the fallacy of moving from facts
  about conceiving to facts about the world (a "conceivability" inference in reverse).
  Also the ambiguity: "conceive of X as unperceived" vs "conceive of X unperceived
  while conceiving it". Defenders would concede that the master argument as a deductive
  proof fails and retreat to it being an intuition pump. That''s a concession of a
  kind.

  3. The problem of the continued existence of unperceived objects: requires God.
  Defeaters: alternatives (Mill''s permanent possibilities of sensation; Russell''s
  "unsensed sensibilia"; structural realism). Also, does the God-posited version predict
  anything? Berkeley says the "arbitrary" vs "lawful" character of ideas shows a wise
  author; but that argument from design is weak given Darwinian/naturalistic explanations
  of order.

  4. Idealism about physical objects is not idealism tout court: it commits you to
  realism about minds — so the "everything is mind" reading is wrong; the view is
  a dualism of spirits and ideas. Defeater: the view can''t accommodate the possibility
  of unconscious mentality or non-mental mental-less world.

  5. The "same idea can''t be in two minds" issue — Berkeley has trouble with intersubjectivity:
  we all perceive the same numerically identical idea (since ideas are inert and can''t
  cause themselves), which forces the claim that numerically one idea exists in many
  minds, or that "same" means "similar". That''s a real internal problem (the "one
  idea in many minds" problem, sometimes called the problem of the "identity of indiscernible
  ideas").

  6. Solipsism threat: if all existence is perception, and I can''t perceive other
  minds, why not solipsism? Berkeley''s answer: we infer other spirits from their
  effects, by analogy — a causal inference to the best explanation, which is exactly
  the kind of inference he denies to the materialist. That''s a nice symmetry-based
  defeater: Berkeley uses inference to the best explanation for other minds while
  disallowing it for matter. Also that''s arguably his strongest internal tension.

  7. Modern physics: if "to be is to be perceived", what perceives a quantum field
  before measurement? And whether idealism can accommodate scientific realism about
  unobservables — Berkeley''s instrumentalism about corpuscularianism (he allows unperceived
  "corpuscles" only as a hypothesis? actually Berkeley denies matter but allows a
  causal-explanatory role for... he''s a phenomenalist/instrumentalist about physical
  theory). Physics'' success at predicting via unobservable entities.

  8. Ordinary realism''s epistemic advantage: the falsity of idealism would follow
  if we found objects that exist while unperceived — but that''s unobservable in principle,
  so it can''t count. So the defeater must be theoretical.

  9. Whether "mind-independence" is even a coherent notion — Berkeley''s positive
  argument; defeater: modal notions. Also: the "no distinction between appearance
  and reality" worry: if objects are just bundles of ideas, then what makes a hallucination
  different from a perception? Berkeley''s answer: the coherence/vividness/order and
  involuntary character. But a defeater: dreams are vivid, involuntary, coherent-ish;
  also "veridical" vs "illusory" is graded by fit with the divine order, which risks
  making the view unable to describe the difference without invoking the realist''s
  notion of an independent order — a "collapse into a rival" (structural realism /
  the "permanent possibilities" account).


