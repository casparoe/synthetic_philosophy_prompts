  Draft:


  I have spent a long time in the rationalist blog-and-forum ecosystem, which has
  left me with a strong prior against positions that cannot be dented by anything,
  and a corresponding interest in views that are empirically equivalent to their rivals
  yet still manage to earn their keep. One such view has been slowly winning me over,
  and I would like you to tell me what would count against it.


  The view is Berkeleyan idealism, in a form I want to state carefully so you know
  exactly what you are being asked to defeat. It has four separable commitments. First,
  the objects of perception are ideas and nothing else — tables, trees, and protons
  are collections of sensible qualities, and their existence consists in their being
  perceived, so that the notion of something existing with no relation to any mind
  is either empty or at any rate far more obscure than we ordinarily assume. Second,
  the argument usually called the master argument: since whatever we conceive is conceived
  by a mind, we cannot conceive of anything existing unconceived, and what cannot
  be conceived cannot be a genuine possibility; I take this argument to be suggestive
  rather than conclusive, and I am aware that most readers think it trades on a shift
  between the impossibility of doing two things at once and the impossibility of the
  thing conceived. Third, ideas being inert, they cannot cause themselves or each
  other, so their regular order must be caused by something; Berkeley locates the
  cause in a mind vastly greater than ours, which is why unperceived objects do not
  blink out of existence. Fourth, and this is the part I care most about, the view
  claims a parsimony advantage: it can accommodate every observation the materialist
  accommodates, minus an inert, unobservable, never-perceived substratum whose existence
  we are asked to infer and whose nature we can say nothing about.


  So: what would count against it?


  I want the defeaters sorted by how decisive they actually are, not how often they
  are recited, and I want each of them stated in a form that identifies the commitment
  it hits — the inconceivability claim, the inertness of ideas, the inference to a
  divine cause, the parsimony claim, or the underlying assumption that mind-independence
  is a coherent notion at all. ...


  Then add the specific asks:


  - Empirical defeaters: does the view predict anything that could fail? If not, is
  there any observation that would count against it, or is empirical equivalence with
  realism built in from the start — and if so, is that a fatal defect or simply the
  price of doing metaphysics?

  - Internal defeaters: cases the view cannot describe without importing what it denied.
  Does it need a notion of a mind-independent order to distinguish veridical perception
  from hallucination, or to explain why you and I perceive one table rather than two
  qualitatively identical ones? What is the defender''s best reply, and does the reply
  cost him the parsimony advantage?

  - Defeaters from symmetry or from inconsistency of method: the idealist rejects
  inference to the best explanation for matter but relies on it for other minds (and
  arguably for God). Is this a genuine inconsistency, and how much does it cost?

  - Defeaters from science: whether anything in modern physics — the measurement problem,
  the role of observers, the apparent success of theories positing unobservable structure
  — bears on the view, in either direction. I am suspicious of the claim that quantum
  mechanics supports or refutes idealism, and I would like to know whether that suspicion
  is warranted.

  - Whether the divine-cause commitment is load-bearing and whether the design-style
  argument for it has survived the naturalistic explanations of order.


  And also:

  - Which defeaters would the committed idealist concede as counting against him,
  versus dismiss as question-begging? Which of the four commitments can fail independently
  of the others?

  - Finally, an honest verdict on insulation: if it turns out that nothing could count
  against the view, is that because the view is empty, because it is a genuine but
  underdetermined metaphysical option, or because the question is at bottom verbal?
  And tell me whether the idealist can say anything the materialist cannot, or vice
  versa — if neither can, I want to know what the disagreement is actually about.


  And the personal bit: what would move me most is a demonstration that the view''s
  own resources cannot draw the distinctions it needs without smuggling in the notion
  of a mind-independent order; a close second is a clean case where the idealist''s
  own reasoning for other minds is the very inference he forbids his opponent.


