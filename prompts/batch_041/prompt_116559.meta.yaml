  perceived, and the notion of something existing with no relation to any mind is
  at best obscure and at worst empty. Second, the argument that commentators call
  the master argument: whatever we conceive is conceived by a mind, so we cannot conceive
  of anything existing unconceived, and whatever cannot be conceived cannot be possible.
  I regard this as suggestive rather than conclusive, and I know that most readers
