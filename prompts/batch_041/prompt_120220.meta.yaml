  Draft:


  I am a third-year student in a course on algorithmic game theory and multi-agent
  systems, and I am trying to formulate a thesis for my final paper on program equilibrium.
  The concept was introduced to us as follows: players submit programs rather than
  actions; each program can read the other player''s source code before selecting
  an action; and a program equilibrium is a profile of programs such that no player
  can improve by unilaterally submitting a different program. The standard example
  is the one-shot Prisoner''s Dilemma, where two programs that each cooperate if and
  only if the other program''s source code is identical to their own are said to form
  an equilibrium. My difficulty is that this example seems to depend on a very thin
  syntactic trick. If a program is to implement any richer conditional strategy—for
  instance, cooperate if and only if the other program would cooperate when run against
  it—then the program must determine a semantic property of the other program, and
  by Rice''s theorem no general algorithm can do that. So either program equilibrium
  requires hypercomputation, or it is restricted to programs that inspect only syntax,
  in which case the equilibrium appears to be an artifact of the restriction and should
  vanish as soon as players can write more expressive programs. I therefore want to
  argue that program equilibrium is either uncomputable or vacuous. Our professor
  insists that it is a genuine and general solution to cooperation, so I suspect I
  am missing something, but I cannot see where. Could you explain what is wrong with
  my dilemma? In particular, does the standard equilibrium really rely on the two
  players being identical? What happens if they have different payoff functions, or
  if they write in different programming languages? If cooperation survives in those
  cases, how is it achieved without simulating the other program? And if it does not
  survive, is program equilibrium not a knife-edge result that applies only to symmetric,
  identical agents?


  This is good. It has a false presupposition: that program equilibrium requires semantic
  simulation. It asks for correction. It is in the weeds. It is formal. It is from
  a university student. It doesn''t ask for citations. It mentions Rice''s theorem,
  which is known. It mentions program equilibrium, which is explained. It injects
  the twist of different payoffs/languages. It is meaningful for a model without search.
  The answer would correct the confusion: program equilibrium does not require semantic
  simulation; programs can condition on the other''s source code as a string, and
  the equilibrium concept is more general. There are asymmetric equilibria, and cooperation
  can survive with different payoffs/languages, though it depends on the program space.
  The standard example is not the only equilibrium. The student''s dilemma is false
  because syntactic inspection is not a thin trick; it''s the whole point—source code
  is available as data, allowing pre-commitment and correlation. Also Rice''s theorem
  applies to arbitrary semantic properties, but the programs don''t need to decide
  those properties; they can be designed to cooperate with specific programs. The
  equilibrium is a fixed point in program space, not a prediction of arbitrary programs.
  So the answer corrects.


