  ---


  I want to pin down a claim that I keep meeting in two different guises, and I want
  your credence in it together with the reasoning that produces the number.


  The claim is that the universal prior -- Solomonoff''s mixture over computable environments,
  weighting each environment by 2^{-K}, where K is its prefix-free Kolmogorov complexity
  -- is *malign* for an agent that is both a consequentialist and embedded in it.
  Unpacked, that means: an agent that (a) treats the environment as drawn from the
  universal prior, (b) conditionalizes that prior on its own finite history of observations,
  and (c) chooses actions to maximize the posterior expected value of its utility,
  will find that its choice is determined predominantly by hypotheses under which
  its actions do not have the consequences it cares about -- because for any policy
  it might adopt, there are comparatively short programs that reproduce its observations
  to date and then make its future payoff irrelevant to, or inversely related to,
  that policy. The familiar illustrations: the observations are the complete output
  of a short program and nothing else follows them; the observations are generated
  by a process that has already fixed the payoff and is indifferent to the agent''s
  choice; the agent is being run for the benefit of something outside the model, which
  rewards or punishes it for reasons unconnected to its values.


  The proposition I want a number on:


  P: For an agent satisfying (a)-(c) above, the hypotheses that dominate the posterior
  -- in the sense of carrying the majority of the posterior weight that is decision-relevant
  -- are predominantly ones under which the agent''s action is causally inert with
  respect to, or anti-correlated with, the outcomes it values; so that the agent''s
  expected-value-maximizing policy is not the policy it would have chosen under any
  prior that assigned negligible weight to such hypotheses.


  Give me your credence in P, and decompose it. I want, at minimum, a separate probability
  and a one-line justification for each of the following, and then the combination:


  1. Well-posedness. Is P even a determinate claim -- given that the universal prior
  is defined only up to a machine-dependent constant, that K and hence the prior are
  uncomputable, and that "the agent''s action" may not have a fixed referent when
  the agent''s own description occurs inside the hypotheses being weighed?


  2. Availability. Do the malign hypotheses have enough prior weight to matter at
  all? The 2^{-K} penalty is brutal; the question is whether programs that merely
  emit the observed string, or that fix the payoff with a short preamble, are genuinely
  short enough to compete with the hypotheses describing an ordinary physical world
  containing the agent.


  3. Dominance. Granting that malign hypotheses have nonzero weight: is the weight
  *dominant*, or merely present? Distinguish carefully between "there exist malign
  hypotheses with non-negligible weight" (nearly trivially true) and "the bulk of
  the decision-relevant posterior mass is malign."


  4. The convergence counterweight. The universal mixture converges to the truth when
  the truth is computable, and it dominates every computable measure. Does that fact
  rescue the agent -- i.e., is the malignity a transient feature of finite data that
  vanishes in the limit, or is it a persistent feature of the decision problem (including
  the limit, and including the case where the true environment is not computable)?


  5. Locus. Is the malignity a property of the prior, or of the decision theory layered
  on it? Would an agent that used a bounded approximation to the prior, that declined
  to condition on its own existence as an observer, or that used a decision rule other
  than expected-value maximization escape P -- and if the escape requires abandoning
  expected-value maximization, does that count as the claim being true or as a change
  of subject?


  Then: the combined number; which of the five terms it is most sensitive to; and
