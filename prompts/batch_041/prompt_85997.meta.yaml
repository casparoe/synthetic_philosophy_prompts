  (a) 12 marks: 2 per item plus 2 for stating the criterion.

  - (1) Not theoretically progressive (no novel content; it''s a fit-to-data correction)
  — degenerating-style; verdict turns on whether it yielded excess content.

  - (2) Neither: re-classifying an anomaly as a confirmation adds no content and is
  the paradigm of a conventionalist stratagem; note that the move could still be part
  of a progressive programme if it later feeds into a prediction (Lakatos allows the
  belt to be adjusted; the verdict is on the *problemshift*, not the individual move).

  - (3) Both: predicted novel fact ahead of experiment and corroborated → theoretically
  and empirically progressive. Note novelty here is uncontroversial because the prediction
  preceded the finding.

  - (4) The crux: theoretically progressive, and empirically progressive too, because
  Lakatos''s novelty is relative to the construction of the theory, not to the date
  — a fact known to the community but not used in building the programme can still
  count as a novel fact the theory predicted. Students who say "not novel, it was
  already known" miss the crux.

