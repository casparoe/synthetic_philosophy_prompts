  Hobbes''s views on geometry: What''s the in-the-weed content?

  - Hobbes thought geometry is the paradigm of knowledge because the definitions are
  of things we construct ourselves ("we make the figures"), so we know their causes.
  This is his constructivism/artificialism: scientia vs. prudence. In De Corpore and
  elsewhere he argues that civil philosophy can be a science because we make the commonwealth.

  - He also believed he had squared the circle and doubled the cube, and spent decades
  fighting Wallis; his "De Corpore" included the claimed solutions; Wallis published
  "Elenchus Geometriae Hobbianae" and mocked him. Hobbes was also accused of making
  geometry subordinate to politics (Wallis''s joke that Hobbes''s geometry should
  be examined in Parliament). Also Hobbes''s rejection of algebra, his preference
  for classical synthetic geometry.

  - Also, Hobbes''s "geometry is the science of what we make" is a real position:
  on his view, we know the causes of things we ourselves make; hence geometry (figures
  drawn by us) and politics (commonwealth made by us) are demonstrable, whereas physics
  is not.


