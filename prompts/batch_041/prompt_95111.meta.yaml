  "I spent most of last night arguing with a friend about expected value fanaticism,
  and I would like to know how Pascal would have weighed in. The dispute began with
  a case I invented. You may press one of two buttons. The first guarantees a finite
  but very large improvement in the welfare of a hundred million people. The second
  has a one-in-10^40 chance of bringing about an outcome of infinite positive value
  and otherwise does nothing. My friend says any consistent expected-value maximizer
  must press the second, since no finite quantity, however large, can outweigh an
  infinite term multiplied by a positive probability. I say this is fanatical, and
  that a decision theory which licenses it is not one Pascal could have accepted,
  because it would make the wager''s logic swallow every ordinary prudential and moral
  consideration. But then I noticed a complication: if the second button had a one-in-10^40
  chance of infinite disvalue instead, the same logic would require us to spend everything
  we have to avoid it, and the wager would seem to demand a life of obsessive precaution
  rather than a single decisive commitment. My friend says this symmetry is a feature,
  not a bug; I think it shows that the wager needs a probability threshold, a cap
  on infinite values, or some other device that stops tiny probabilities from dominating.


  What I want from you is a reconstruction of Pascal''s likely position on this family
  of issues, not a summary of the wager as it is usually taught. Assume he is alive
  now and has been brought up to speed on contemporary decision theory, but has not
  abandoned his theological commitments. Address the following. First, would Pascal
  accept the principle that a positive probability of an infinite good dominates any
  finite good, or would he restrict it in some way? If he would restrict it, what
  restriction follows from his own assumptions, and what does it imply for the wager
  itself? Second, how would he respond to the many-gods objection, on which several
  incompatible infinite rewards are each offered on positive probability? Would he
  treat the objection as showing that the wager is invalid, or as showing that the
  probabilities need to be assessed differently? Third, what would he say about a
  proposed repair that I have been calling the two-tier wager: infinite utilities
