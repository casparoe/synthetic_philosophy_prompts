  infinite in the relevant sense, or as a limiting case that should be handled differently?
  Finally, tell me which of my friend''s claims and which of my own claims Pascal
  would be most likely to reject, and what his rejection would reveal about the difference
  between a wager-style argument and a general expected-value maximization principle."


