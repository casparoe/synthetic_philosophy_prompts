  Question (I write it): "Malthus said population grows faster than food supply, so
  population will always press against the means of subsistence. Two hundred years
  on, there are far more people and far more food per person than he imagined. Was
  Malthus wrong? Using the philosophy of science, explain when it is legitimate to
  say a theory was ''right but early'' rather than refuted, and say what a theory
  has to do in order to earn that treatment. Use Malthus as your example."


  Student answer draft:


  "Malthus''s argument has two parts: population grows geometrically when unchecked,
  while food supply can at best grow arithmetically, so unless something holds population
  down — famine, disease, war (his ''positive checks'') or delayed marriage and restraint
  (his ''preventive checks'') — the number of people will be pushed back down to the
  level the food can support. The prediction, then, is that any improvement in living
  standards will be eaten up by extra people. That is why economics got called the
  dismal science.


  On the face of it the prediction failed. Since Malthus wrote, the population has
  multiplied several times over and food production has grown faster than population,
  at least in most places. But I think it''s a mistake to say the theory was refuted,
  and the reason is Duhem''s point (usually called the Duhem-Quine thesis): you never
  test a theory on its own, you test it together with a bundle of auxiliary assumptions
  — about farming techniques, about what counts as food, about trade, about what people
  do with extra income. When the prediction fails, the failure tells you that something
  in the bundle is wrong, not which thing. In Malthus''s case, the auxiliaries that
  failed were the ones about agricultural technology (he couldn''t have anticipated
  synthetic fertiliser or mechanised farming) and about fertility (he didn''t anticipate
  that people in rich countries would choose to have fewer children). So the core
  claim — that population is limited by the means of subsistence — is untouched, and
  the ''right but early'' verdict is legitimate here.


  Popper''s idea of falsifiability is what makes this hard to police. Popper said
  a theory is scientific only if it forbids something, and he thought that the way
  to tell science from pseudo-science was that a scientific theory sticks its neck
  out. Malthus''s theory does stick its neck out — it says that if you improve the
  food supply, population will rise to swallow the gain — so it isn''t in the same
  boat as, say, astrology. What makes the rescue easy is that Malthus never put a
  date on it. A theory that says ''eventually'' can always be saved, because the counter-evidence
  is always from the wrong period. Popper would say that an unfalsifiable claim of
  this sort is not just bad science but meaningless — it doesn''t say anything about
  the world at all.


  The interesting question is what separates a legitimate rescue from a cheat. Popper''s
  later work on research programmes is helpful here: a research programme is ''progressive''
  when the modification predicts something new that we can then go and check, and
  ''degenerating'' when it only explains away the awkward fact after the fact. So
  the test for the ''right but early'' move is whether it adds content. If a Malthusian
  says ''just wait'', that''s degenerating; if they say ''the pressure will show up
  first as a rise in food prices relative to wages, and then as a fall in fertility'',
  that''s a real claim and we can go and look.


  So my answer is that Malthus wasn''t wrong, he was early, and the reason we can
  say that is that his auxiliaries failed rather than his core, plus the fact that
  his core still generates testable claims today."


