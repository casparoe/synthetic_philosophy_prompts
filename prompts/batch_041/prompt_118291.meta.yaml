  Echo chamber / epistemic bubble concepts to draw on:

  - Epistemic bubble: omission of relevant information; not necessarily the person''s
  fault; fragile — exposure to the excluded information tends to fix it.

  - Echo chamber: the group actively discredits outside sources; robust/self-sealing;
  adding outside info can strengthen the belief (via discrediting the source).

