  \ support), or it is valid and the real question is which plausible premise is least\
  \ costly to give up.\"\n\nI could go for the pragmatic encroachment one with a clean\
  \ equivocation. Let me try to construct a genuinely good argument.\n\nProposal (pragmatic\
  \ encroachment + epistemic contextualism domain):\n\nArgument about the \"practical\
  \ adequacy\" of knowledge attributions, in the voice of a student in an epistemology\
