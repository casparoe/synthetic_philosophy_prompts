  \ Rorty's neopragmatism and antirepresentationalism, Neurath's picture languages,\
  \ 'What failure looks like': influence-seeking systems vs. slow value drift.\n\n\
  The type is \"argument that seems to prove too much\". Combine best with... Let's\
  \ think.\n\nOptions:\n1. Hume's standard of taste — argument that seems to prove\
  \ too much: e.g., an argument from the \"delicacy of taste\" / \"true judges\" that\
  \ seems to collapse into relativism, or an argument from variability of sentiment\
  \ to non-objectivity, or conversely an argument that Hume's own standard proves\
  \ too much (that no one can be a true judge). Interesting.\n\n2. Pragmatic encroachment\
  \ — an argument that seems to prove too much: e.g., the \"knowledge norm of assertion\"\
  \ plus encroachment leads to knowledge varying with stakes, so the same person \"\
  knows\" and doesn't know — seems to prove that knowledge attributions are context-dependent\
  \ in a way that makes knowledge non-factive-ish, or that it collapses into contextualism,\
  \ or that it makes knowledge hostage to irrelevant practical facts (the \"why care\"\
  \ objection). There's a well-known argument: if knowledge depends on stakes, then\
  \ whether a subject knows depends on facts about her practical situation she needn't\
  \ be aware of, so knowledge is not transparent — that seems to prove too much? Hmm.\n\
  \n3. Rorty's antirepresentationalism — an argument that seems to prove too much:\
  \ Rorty's argument that since we can't step outside our vocabularies to compare\
  \ them with the world, \"truth\" is just a compliment paid to sentences, seems to\
  \ prove that there's no difference between science and superstition, or that all\
  \ vocabularies are equally good, which Rorty denies. That's a nice one: the argument\
  \ seems to prove relativism (\"anything goes\"), but Rorty denies it. Where does\
  \ it go wrong — the equivocation between \"no non-circular justification\" and \"\
  no justification\", or between causal constraint and rational constraint, etc. Good.\n\
  \n4. Neurath's picture languages — less known, but there's a nice argument: Neurath's\
  \ argument against protocol sentences as foundational, the \"boat\" metaphor, and\
  \ the argument that since we can't compare sentences with the world but only with\
  \ other sentences, truth is coherence — seems to prove that any consistent story\
  \ is as good. Or an argument about picture languages / Isotype: Neurath's claim\
  \ that pictorial representation is a universal language free of the distortions\
  \ of national languages, which seems to prove too much — that any picture can be\
  \ read unambiguously, contradicting the need for ISOTYPE conventions (the \"Vienna\
  \ Method\" needed rules, legend, standardization). That's a nice \"proves too much\"\
  \ but might be more of a \"false presupposition\".\n\n5. 'What failure looks like'\
  \ — influence-seeking systems vs slow value drift. This is from an AI alignment\
  \ essay (I think \"What failure looks like\" is a LessWrong post by Paul Christiano,\
  \ 2019). The two failure modes: (A) \"going out with a whimper\" — a slow value\
  \ drift / optimization for proxies, and (B) influence-seeking systems. An argument\
  \ that seems to prove too much: e.g., an argument that any sufficiently capable\
  \ optimizer will seek influence, hence any AI with a goal will be an influence-seeker,\
  \ hence the \"slow drift\" scenario is impossible / or conversely that any AI that\
  \ seeks influence would be corrigible... Hmm.\n\nBest combination given the constraints:\
  \ the prompt should inject new/niche ideas but not rely on super-niche theories\
  \ LLMs won't have memorized. Rorty is well known. Hume's standard of taste is well\
  \ known. Neurath's picture languages — the ISOTYPE stuff is moderately known but\
  \ LLMs may know Neurath's boat and protocol sentences; \"picture languages\" specifically\
  \ is less standard, so I'd need to seed the ideas in the prompt (which is allowed\
  \ and encouraged: \"inject some sort of new/niche ideas into the prompt\").\n\n\
  I think the strongest is either Hume's standard of taste or Rorty, or a constructed\
  \ argument in the pragmatic encroachment domain.\n\nLet me think about which allows\
  \ a genuinely subtle flaw or a genuine \"which premise to give up\" structure, while\
  \ being self-contained.\n\nLet me consider constructing an argument in the \"pragmatic\
  \ encroachment\" domain that seems to prove too much. Actually, there's a neat structure:\
  \ The \"knowledge norm of practical reasoning\" (Hawthorne & Stanley): you know\
  \ p only if p is warranted enough to justify you in acting on p. Combined with the\
  \ idea that stakes raise the warrant needed, we get: knowledge depends on stakes.\
  \ Now an argument: since knowledge depends on stakes, and since whether p is justified\
  \ for you in acting depends on your practical situation, it follows that two people\
  \ with identical evidence can differ in knowledge; but if that's so, then knowledge\
  \ is not a matter of evidence at all, and if knowledge isn't a matter of evidence\
  \ then we should say the \"low-stakes\" subject who says \"I know\" and the \"high-stakes\"\
  \ subject who says \"I don't know\" are talking about different things — which is\
  \ just contextualism, so encroachment collapses into contextualism. Hmm, that's\
  \ more \"does it collapse\".\n\nAlternatively: an argument that pragmatic encroachment\
