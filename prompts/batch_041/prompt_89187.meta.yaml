  \ is harder in high stakes — which seems to prove too much because then knowledge\
  \ would be a strange pragmatic notion. Hmm, the \"flaw\" could be a scope slip:\
  \ from \"the stakes affect whether it's appropriate to act on p\" to \"the stakes\
  \ affect whether p is known\", via an unstated principle that conflates the propriety\
  \ of acting on p with knowing p (the \"knowledge-action\" bridge needs a premise\
  \ that knowing is necessary for appropriate action, which is denied by those who\
  \ think justified belief suffices).\n\nActually there's a classic known objection:\
  \ \"If knowledge is the norm of assertion, and stakes affect knowledge, then whether\
  \ you may assert depends on stakes\" — fine. But the argument \"seems to prove too\
  \ much\" version: a chain that yields the conclusion that two people can have the\
  \ same evidence and same proposition but one knows and one doesn't, which is fine\
  \ for encroachment but the asker thinks it proves something absurd like \"knowledge\
  \ is not a natural kind\" or \"there are no epistemic facts\". Hmm.\n\nMaybe simpler\
  \ and better: Hume's standard of taste. The argument: Hume says the standard of\
  \ taste is the joint verdict of true judges, who are characterized by delicacy,\
  \ practice, comparison, freedom from prejudice, good sense. An argument that seems\
  \ to prove too much: (1) A standard of taste must be such that its verdicts are\
  \ authoritative for everyone. (2) The true judges' verdicts are authoritative. (3)\
  \ True judges are those who are best equipped to discern the sentiment of beauty.\
  \ (4) But the very same traits that make a judge a true judge (delicacy, practice,\
  \ comparison, impartiality) can only be identified by their producing correct verdicts.\
  \ (5) So the standard is circular: we identify true judges by their correct verdicts\
  \ and correct verdicts by the true judges. (6) Therefore Hume's standard can't adjudicate\
  \ between two rival standards... Hmm, this is a real objection (circularity) in\
  \ the literature.\n\nAlternatively, a \"proves too much\" argument in Hume: (1)\
  \ Beauty is not a property of objects but a sentiment in the mind. (2) If beauty\
  \ were objective, there would be a faculty that detects it as it is in the object.\
  \ (3) Sentiments vary per person; only judgments about matters of fact can be true\
  \ or false. (4) So no judgment of taste can be true or false. (5) But then Hume's\
  \ own \"standard of taste\" and his talk of \"the true judge\" and of \"blame\"\
  \ and \"approbation\" being corrected must be either empty or covertly objective.\
  \ So his own theory seems to prove that his own normative project is impossible.\
  \ Where's the flaw? Perhaps the equivocation between \"objective property in the\
  \ object\" and \"intersubjective standard\": Hume holds that although beauty isn't\
  \ a property of the object, there's a fact about what a properly constituted human\
  \ sentiment would be, so the standard is grounded in a shared human nature, not\
  \ in the object. The slide is from \"not in the object\" to \"not a matter of truth\"\
  . The defender: the \"standard\" is derived from the common structure of human sentiment,\
  \ so step (4) only follows on an unstated premise that truth-aptness requires object-side\
  \ properties (a \"detection\" model). Hmm, this is decent and the flaw is an unstated\
  \ premise, not quite a \"subtle flaw in the chain\".\n\nGiven the type asks: \"\
  either it contains a subtle flaw (an equivocation between steps, a scope or quantifier\
