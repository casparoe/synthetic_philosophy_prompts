  "I am trying to find the established term, if there is one, for a phenomenon that
  arises when a consequentialist agent is placed inside a universal prior. The setup
  is roughly this. We have a universal prior over computable hypotheses, defined by
  weighting each program by 2^{-length}. An agent is itself a finite program, and
  it uses the prior to form beliefs about its environment and to choose actions that
  maximize expected utility. Because the agent''s own source code is a finite string,
  the prior assigns non-negligible mass to hypotheses according to which the agent''s
  current computation is being simulated by a shorter program. In those hypotheses,
  the agent''s observations and its very reasoning are generated by the simulating
  program, not by the world the agent takes itself to be in. The agent therefore has
  to treat its own decision procedure as part of the evidence it is conditioning on.
  The result is a systematic tilt: the hypotheses that predict the agent''s choices
  are also the hypotheses under which the agent''s choices are most likely to be made,
  so the prior is not neutral with respect to the agent''s deliberations. Some hypotheses
  are ''malign'' in the sense that they make the agent''s reasoning a predictable
  artifact of a simpler program. Is there a name for this phenomenon? If there is
  an established term, what is it, and how exactly is it defined? If not, can you
  coin a term and distinguish it from the nearest concepts—e.g., the problem of self-reference
  in decision theory, the simulation argument, logical uncertainty, and the embedded
  agent problem? I am less interested in the label than in the carving: what exactly
  is the phenomenon, what is it not, and where are its boundaries?"


