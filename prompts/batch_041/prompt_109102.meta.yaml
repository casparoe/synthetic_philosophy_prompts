  into a move that I have never seen named, though I suspect it has been discussed.
  It goes like this. A deposit is unusual — a pit with a deliberately bent sword,
  three dog skulls, and a quern broken in two — and the excavation report says the
  assemblage is ''ritual.'' A deposit a few valleys over, from the same century, holds
  an intact quern, a complete pot, and a goat''s skeleton, and the report calls it
  ''domestic refuse.'' So far, so ordinary: the odd one gets the ritual label. What
  interests me is what happens next. In the first case the ritual label is then used
  to explain why the objects were treated as they were — the sword was bent, we are
  told, because it was a ritual killing; the pit was dug this way because the rite
  demanded it. The interpretation has become the explanation of the very facts that
  prompted it, and, more strikingly, the label can absorb almost any future discovery:
  if a similar pit turns up with no metalwork at all, that is ritual too, just a different
  rite. I have watched the same thing happen with ''votive'', ''ceremonial'', ''foundation
  deposit'', and with the softer ''symbolic'', and I have watched it happen to claims
  about beliefs and institutions rather than about diet or technology — nobody says
  a hearth was ''ritually used'' when it is merely a hearth."


