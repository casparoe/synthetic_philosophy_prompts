  ---

  Two colleagues of mine, Ruth and Dev, spent most of a lunch hour arguing about a
  bonus scheme my school district has just introduced, and since the scheme applies
  to me I would like the argument settled properly rather than smoothed over. From
  next term, teachers receive a payment for each class that rates us as genuinely
  caring about students. The money is real, the ratings are anonymous, and I have
  noticed that I now want to care more, which is exactly what troubles me.


  Ruth''s position was that the payment gives me no reason at all to care. Reasons
  to care about a student come from the student — that they are struggling, that it
  matters to them — and a sum of money from the district is the wrong kind of reason:
  it may make caring profitable, but it cannot make caring correct. Dev said this
  was a distinction without a difference: the bonus is obviously a reason to care,
  since it is a reason to do whatever brings the caring about, and Ruth was really
  only saying that it does not make the caring fitting, which is a separate matter.
  He added that there is no shame in having a state-directed reason alongside an object-directed
  one.


  Ruth replied that this move saves nothing. If a consideration can be a reason for
  an attitude merely by being a reason to bring it about, then a threat is a reason
  to believe a contradiction and a bribe a reason to admire a bad painting, and any
