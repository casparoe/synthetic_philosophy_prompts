  Standard WKR setup: The reason-giving force of the consideration vs. its being the
  kind of consideration that makes the attitude fitting. Two families of responses:

  - Buck-passers / fitting-attitude theorists: value = properties that provide reasons
  for attitudes; WKR is a problem because the reward case seems to provide a reason
  for the attitude but not to make the attitude fitting → so the FA analysis (fittingness
  = having reason) is wrong, or we need to distinguish right-kind from wrong-kind
  reasons.

  - Deflationists: the reward gives a reason for the attitude (a "state-given" reason),
  and the fittingness/reason distinction is separate. Or: it''s not really a reason
  for the attitude but for wanting/acting.

  - Also: the "no reason at all" view — some argue the reward gives no reason for
  the attitude itself but only for bringing it about, so there''s no puzzle: it''s
  a reason to act, not a reason for the attitude. This is the "the attitude''s being
  had is not what''s recommended" line.


