  the real question is which kind of reason can be demanded of someone — whether a
  teacher who takes the money and never comes to care has failed the students or merely
  failed the scheme. Dev answered that the threat case makes his point rather than
  hers: a threat genuinely is a reason to bring a belief about, but beliefs answer
  to truth, so it can never be the reason a belief is correct; likewise the district
  could pay for the workshop that reliably produces caring, and that would be a reason
  to acquire the attitude without ever being the reason the attitude is the right
  response to a student. Ruth said that was the same two-kinds answer restated, and
  that she still could not see how we decide which kind is doing the work in my case.


