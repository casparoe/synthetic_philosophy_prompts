  The slogan is ''vote on values, but bet on beliefs.'' In futarchy, the markets are
  not supposed to be unconditional bets on world events; they are supposed to be decision
  markets that price the difference a policy would make.


  Analyze PAM through futarchy. I want a disciplined case analysis that runs in both
