  Desiderata for a theory of self-locating (indexical) credence / anthropic reasoning:


  1. It must handle indexical uncertainty without violating the probability calculus
  — i.e., must not make a subject''s credence about a non-indexical proposition change
  merely by duplicating her (the "duplication" or "branching" cases). This is the
  "no self-indication" intuition vs. the "you should be surprised to find yourself
  in a large world" intuition.


  2. It must give an answer to Sleeping Beauty, and in a way that''s stable under
  the "extended" version and under betting: credences must not be Dutch-bookable by
  an agent who knows her own future credences (Dutch book / "the bookmaker" argument).
  Also must respect the difference between credence and decision (e.g., the "thirder
  betting" issue: a thirder who bets at even odds each awakening loses money — the
  "Dutch book" against thirders? Actually there''s a famous argument: thirders lose
  money in repeated bets if they bet each awakening; halfers gain. Hmm, but there''s
  also an argument that SSA agents can be Dutch-booked. Let me not assert.)


  3. It must say something about the Doomsday argument — either license or block it
  — and whatever it says must be consistent with its treatment of the Presumptuous
  Philosopher. This is the crux: SSA gives Doomsday but not Presumptuous Philosopher;
  SIA gives Presumptuous Philosopher but blocks Doomsday. Neither gives both. So the
  requirement "no Doomsday, no Presumptuous Philosopher" might be jointly unsatisfiable
  with the probability calculus — that''s a nice "result."


  4. It must respect the distinction between "you" as a particular physical system
  and "you" as an indexical role, and handle cases of duplication/fission/teleportation
  (Parfit-style) consistently: if a copy of you is made, does your credence in being
  the original change? Must not multiply credence in existence.


  5. It must handle cases where the number of observers depends on the outcome being
  tested (the "presumptuous philosopher", the "Incubator" case, the "Adam and Eve"
  case, fine-tuning). In particular, the theory must not let you settle empirical
  questions by armchair reasoning about observer-counts — the "no armchair physics"
  requirement.


  6. It must be able to accommodate the "many-worlds" interpretation or at least not
  presuppose a single-world ontology; and must handle "Boltzmann brain" style cases
  (which generate paradoxes of the reference class).


  7. It must specify the reference class (who counts as an observer, observer-moments
  vs observers) in a non-arbitrary way — and the reference class problem is a known
  embarrassment: results change with the choice. Requirement: the reference class
  must be derivable from the theory rather than chosen to get the desired answer.


  8. It must be consistent with ordinary Bayesian conditionalization on non-indexical
  evidence, and must reduce to ordinary probability in cases with no indexical uncertainty.
  (Desideratum: conservatism / "agreement in the non-anthropic case".)


  9. It should give the same answer whether you update before or after learning the
  total number of observers ("diachronic consistency"/ "reflection principle").


  10. It must handle the "Infinity" cases: infinite universes / infinite observers,
  where ratios don''t exist — either give a principled measure or declare the question
