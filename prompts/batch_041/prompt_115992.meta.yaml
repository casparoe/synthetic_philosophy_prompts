  11. It must be usable in cosmology (typicality reasoning about the fine-tuning /
  our location in the universe) — the "astrobiology" requirement.


  12. Decision-theoretic adequacy: for a theory to be usable it must say what an agent
  should *do* — e.g., should you accept a bet on heads in Sleeping Beauty? The theory''s
