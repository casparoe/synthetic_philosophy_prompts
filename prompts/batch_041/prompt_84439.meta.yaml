  I volunteer at a small city museum and have been put in charge of a new exhibit
  on local housing and employment statistics. Our visitors speak a dozen languages,
  and our budget for translation is nearly nothing, so a trustee has proposed that
  we present everything pictorially: no sentences, only drawings and diagrams, with
  figures of people, houses, coins and so on. He argues that pictures need no translation
  because they show what they mean, that a drawing of five houses next to a drawing
  of two houses needs no words, and that the only reason our old exhibits used text
  was habit. I am drawn to the idea — I have seen picture-based signage in airports
  and it does seem to travel better than words — but when I tried to sketch the exhibit
  I kept getting stuck, and I would like your advice before I commit to a design.


  Concretely: I want to show that the number of evictions in our city fell, that most
  of the people evicted last year were renters rather than owners, that the housing
  authority is not allowed to evict anyone between November and March, that no new
  social housing was built in the 1990s, and that if the current trend continues,
  waiting lists will double by 2035. When I draw them, the first two come out reasonably
  well and the rest become a muddle: I can draw a family leaving a house, but how
  do I draw that it must not happen in winter, or that nothing was built, or that
  something hasn''t happened yet?


  Two people have given me confident advice that I can''t reconcile. The trustee says
  the problem is only my drawing skill and that a good designer could render any of
  these; a graphic designer friend says the trouble is deeper, that pictures can only
  show what things look like and that anything about absence, rules, or the future
  is smuggled in by the viewer''s assumptions, so a picture-only exhibit would quietly
  mislead visitors who read it differently from how we intend. I suspect they are
  each partly right, but I don''t know how to tell which of my five items are genuinely
  beyond pictures and which are just hard to draw well. I also don''t know what it
  would mean for a picture to be read "correctly" at all: if a viewer looks at my
  drawing of five houses and two houses and comes away thinking the city has seven
  houses, whose fault is that?


  What I would like is advice on how to think about this, and a practical verdict
  on how far I can go. Should I hold out for pictures only, or accept some text? If
  some text, which items need it and why those? And is there a principled way to decide,
  in advance, which content a picture can carry on its own and which it cannot — or
  is that just a matter of testing with visitors? Please don''t tell me to hire a
