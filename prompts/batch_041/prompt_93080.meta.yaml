  Potential prompt:


  I have been working through a deflationary account of akrasia and I want to know
  how exposed it really is. The account says: the phenomenon traditionally called
  weakness of will is, in the vast majority of philosophically interesting cases,
  not a conflict between a person''s judgment and a separate faculty of will. It is
  a conflict between preference orderings indexed to different times, generated by
  hyperbolic discounting. At t1, when both options are in the future, the agent prefers
  the larger-later reward; at t2, when the smaller-sooner reward is present, the discount
  curve has steepened and the agent prefers it now. The agent''s long-run self is
  not defeated by a weak will; it is simply outvoted by a later, temporally closer
  self. On this view, the correct normative response is not to strengthen willpower
  but to design commitments, precommitment devices, and choice architecture that bind
  the later self. The residual philosophical puzzle of akrasia is thereby dissolved,
  or at least relocated to the engineering problem of self-binding. I am not asking
  for a literature review or citations; I want a map of what would count against this
  account, not just the textbook objection that people sometimes act against their
  own present preferences.


  Please tell me: which observations, arguments, intuitions, or empirical patterns
  would genuinely count against the deflationary account, and which would be merely
  awkward? Rank them from potentially fatal to mildly embarrassing. In particular,
  I want to know how it handles cases of what I would call synchronic akrasia -- an
  agent at a single time who judges that A is best all things considered and yet chooses
  B, without any change in the discount curve between judgment and action; cases where
  the agent does not experience the later preference as a preference at all but as
  an alien urge or compulsion; and cases where the agent''s long-run preference is
  not a stable object but is itself constructed by the act of choosing. I would also
  like to know what a committed defender of the account should concede as counting
  against it, as opposed to what critics would say, and whether the account can be
  qualified so that it becomes unfalsifiable. If it can, is that a defect for a view
  of this kind, or is the view better understood as a research program whose immunity
  is a feature rather than a bug? Finally, tell me what I, as someone initially sympathetic
  to the deflationary account, should find most persuasive on the other side.


