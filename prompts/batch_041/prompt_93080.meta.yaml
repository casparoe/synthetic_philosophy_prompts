  Let''s draft an argument:


  (1) If an action A might cause a serious or irreversible harm, and the science is
  uncertain, then we should not take A unless we can show the harm is impossible or
  negligible. [Strong PP]

  (2) Refraining from A is itself an action/choice with consequences; every alternative
  to A might also cause serious or irreversible harm under uncertainty (including
  harms from not acting, from foregone benefits, from shifting the risk elsewhere).

  (3) So for any A and its alternatives, each option might cause serious or irreversible
  harm under uncertainty.

  (4) By (1), we should not take any option.

  (5) Therefore strong PP forbids every choice; if it permits anything, it must be
  because some harms are excluded or some uncertainty is disregarded.

  (6) But a principle that forbids every choice is unusable; therefore (1) is false,
  or PP is empty.


