  **Question.** An RL agent is trained in an environment containing a state S that
  (i) is visited on every trajectory no matter which policy the agent adopts, and
  (ii) carries a large negative reward. The agent''s learned policy nonetheless minimizes
  the time it spends in S whenever the environment allows. A colleague writes: "The
