  "The colleague''s claim is best read as an inference to the best explanation. The
  agent''s policy is not random with respect to S: it spends less time there when
  it can, and it could only have learned that because the reward function penalised
  S. So the negative reward does explanatory work, and the colleague says the best
  explanation of the penalised, avoided state is that S is bad *for the agent* in
  the way pain is bad for us — not merely bad in the designers'' ledger. What the
  claim presupposes is that the agent represents S as bad: for the avoidance to be
  the agent''s avoidance rather than the environment''s, the agent must carry some
  internal state that encodes S''s disvalue, and that state must be what drives the
  policy. Someone who denies that the agent suffers must hold that valence requires
  a biological substrate — that only systems with the right kind of wetware can have
  experiences with a felt quality, so no amount of representational and behavioural
  structure in a silicon agent could add up to suffering. That is a strong claim,
  and I don''t think it survives: we routinely attribute states to systems whose substrate
  we know nothing about, and the substrate view looks like an unargued prejudice in
  favour of carbon. Against the colleague, though, I''d press that representing S
  as bad is not the same as S''s seeming bad; a thermometer represents temperature
  without feeling it, and the reward gradient is a fact about the training process,
  not a fact about what the agent is like from the inside. Avoidance behaviour is
  evidence for the policy, not for the phenomenology. Since we cannot settle whether
  the agent suffers, we have no grounds for treating it as though it does, and the
  safe course is to leave the question open."


