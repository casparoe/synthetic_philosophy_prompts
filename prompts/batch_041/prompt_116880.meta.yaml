  Prompt for Hofstadter:


  "I am a philosopher of mind and amateur composer, and next week I am presenting
  at a cognitive science workshop on creativity. The audience is mostly cognitive
  psychologists who study analogy and conceptual combination, a few music theorists
  who work on variation form, and two AI researchers who build generative models.
  I am defending a thesis about Hofstadter''s knob-twiddling picture of creativity:
  the picture is right that creativity often proceeds by varying a theme along dimensions,
  but it mistakes a symptom for the mechanism. The real mechanism is representational
  fluidity—the capacity to treat any feature of a representation as a dimension along
  which to vary, including features that were not dimensions before. Knob-twiddling
  presupposes a space of knobs; creativity sometimes consists in building the space.
  I argue that this explains why creative variation is domain-general without being
  domain-neutral, and why the knob-twiddling model fails for radical novelty: when
  the dimensions themselves are created, there are no knobs to twiddle yet. I also
  want to distinguish this from mere analogical mapping and from latent-space interpolation,
  which the AI people will inevitably bring up."


