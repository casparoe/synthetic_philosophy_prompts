  learning department and the economics department. The audience is around thirty
  people: a majority are reinforcement learning engineers who build reward models
  and evaluation suites; a handful are econometricians who work on principal-agent
  problems and mechanism design; two are philosophers of science who work on measurement
  validity and the theory-ladenness of observation; and one is a historian of science
  who studies how statistical indicators shape institutions. I am defending the following
  thesis: what we call Goodhart''s law is not one phenomenon but a bundle of four
  distinct failure modes, and the standard remedies for one are actively harmful for
  the others. The four modes are (1) proxy drift, where a measure loses correlation
  with the target as optimization proceeds; (2) adversarial capture, where agents
  with a model of the measure exploit its blind spots; (3) constitutive feedback,
  where the measure changes the institution, population, or practice it was meant
  to track; and (4) epistemic displacement, where the measure becomes the operational
  definition of the target and the original concept is quietly abandoned. I argue
  that only (1) is a standard statistical learning problem; (2) is a game-theoretic
  equilibrium problem; (3) is a causal-inference and reflexivity problem; and (4)
  is a conceptual-engineering problem. The practical upshot is that trying to fix
  all four with better regularization, more data, or a held-out test set is a category
  error, and that some interventions that reduce proxy drift make adversarial capture
  and epistemic displacement worse."


