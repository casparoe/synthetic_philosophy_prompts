  I''m a junior at a science magnet high school, and three weeks from now I have to
  defend my position paper at our school''s Science and Society symposium, in front
  of an audience I can already picture. The panel is drawn from the faculty: two biology
  teachers, one of whom wrote the cell-biology unit and treats the cell as the only
  genuine unit of life, and the other a physiologist who thinks metabolism is the
  whole story; a chemistry teacher who is a strict physicalist and believes "life"
  is a folk category that serious science should abandon (he''ll want to talk about
  entropy and dissipative structures); a physics teacher who judges every definition
  by whether it earns its keep predictively; our computer science teacher, who runs
  the robotics club and will ask whether my definition is substrate-neutral, and whether
  saying yes turns it into a reductio; and the faculty advisor of the ethics club,
  who will want to know what all this does to moral status. There are also about fifteen
  students, several of them on the debate team, who will go for the cheapest gotcha
  available. The Q&A is scheduled for twenty minutes, and I am told the panelists
  ask hard questions but dislike hedging.


  My thesis is that viruses are alive, and that the list of characteristics of living
  things in our textbook is not a definition at all but a description of the organisms
  biologists happened to study first. I have my own criterion, which I call the lineage
  test: something is alive if it belongs to a lineage that (i) copies a heritable
  template with enough fidelity to retain information and enough slop to vary, (ii)
  maintains a bounded, self-produced organization that keeps itself away from equilibrium,
  and (iii) is exposed to selection in a way that lets the lineage accumulate open-ended
  novelty. I know the odd consequence: on this test no individual entity is alive
  in its own right, only as a node in a lineage, so a single cell is only derivatively
  alive too, and that is a wrinkle I am not sure is a feature or a bug. My borderline
  cases are viruses, including the giant ones that carry some of their own translation-related
  genes; a virus that makes its living by parasitizing another virus; a prion; a strand
  of self-replicating RNA in a test tube; a mitochondrion; an endogenous viral sequence
  that has sat in a genome for millions of years; a mule; and a red blood cell.


  Please prepare me a Q&A sheet for this panel: the objections I will actually get,
  from these specific people, not the ones I would get from a room of philosophers
  of biology. Put them in order of how likely they are and how much damage they would
  do to my thesis, phrase each one the way that particular panelist would phrase it,
  and give me a two-minute reply for each, followed by an honest note on where the
  reply is soft. Tell me what to concede up front so I am not defending more than
  I need to, which single reply has to land for the thesis to survive, and — since
  I would rather know now — the question I am hoping nobody asks.


