  Aristotle NE V.5 (1133a–1133b). Key moves:

  - Justice in exchange (to en tais synallagmasi dikaion) requires reciprocity (antipeponthos)
  in proportion.

  - For exchange, the goods must be equalized; they must be commensurable.

  - "There would be no exchange if there were no equality, and no equality if there
  were no commensurability."

  - But "in truth it is impossible that things differing so much should become commensurable"
  — so we use money (nomisma) as a "measure" (metron) by convention (nomō), "for this
  is why it is called nomisma, because it exists not by nature but by convention (nomō)."

  - "Need" (chreia) is what "holds things together" (synechei) — it''s the real ground;
  money is a "representative" of need by convention (hypallagma... kata synthēkēn).

  - Money also as a "surety/guarantee" (engyētēs) of future exchange — so we can get
  what we need later. (Some translators: "money is, as it were, a surety that exchange
  will be possible later".)

  - So money''s function: measure + means of exchange + store of value (guarantee).


  So the puzzle: money makes things commensurable, but money is conventional, and
  need (which is what money represents) is what really grounds exchange. Is exchange
  justice natural or conventional? If money is a mere convention representing need,
  then the "measure" is conventional — so is the justice of exchange natural or conventional?


