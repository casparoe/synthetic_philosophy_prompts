  to a composition to derive a 1/2 chance for the unknown-color ball. Actually that''s
  a real thing: many students think "the probability of drawing a red in bet B is
  1/3 by symmetry (the ball drawn is either red or yellow... no)". Hmm, let me think:
  Urn has 90 balls, 30 red, 60 either black or yellow with unknown split. Bet A: win
  if red. Bet B: win if black. Bet C: win if red or yellow. Bet D: win if black or
