  Let me evaluate Buddhist anatta more. False presupposition candidates:


  (a) The asker thinks anattā = the claim "there is no self" (a metaphysical denial),
  and asks a question resting on that: e.g., "Since Buddhism holds there''s no self,
  who is it that is reborn and who reaps kamma? Isn''t the doctrine incoherent, or
  must it be understood as metaphorical?" The subtle confusion: (i) anattā is not
  the thesis that selves don''t exist in the ordinary sense; the Buddha declined to
  answer "is there a self?" and treated the question as ill-posed / not conducive;
  the teaching is that phenomena are not-self (not "there is no self"), a strategy
  of disidentification; (ii) the "who is reborn" question presupposes a bearer-requiring
  account; the Buddhist answer uses causal continuity without an entity (the "fire
  spreading to a new log" simile — careful, that''s from the Milindapañha? The chariot
  simile is from Milinda; the flame simile too). I should avoid attributions. (iii)
  Also the two-truths/conventional-ultimate distinction: conventionally we say "I",
  persons exist as dependently designated, and the Buddha used "I" too. (iv) The Pudgalavāda
  controversy: some Buddhist schools held a "person" (pudgala) that is neither identical
  to nor different from the aggregates, and were treated as heretical by others —
  showing the tradition itself debated whether anattā denies persons. That''s a nice
  in-the-weeds injection. (v) The distinction between anattā and the "annihilationist"
  (ucchedavāda) extreme: the Buddha criticized annihilationism as much as eternalism;
  so "no self" as a metaphysical view is one of the extremes.


