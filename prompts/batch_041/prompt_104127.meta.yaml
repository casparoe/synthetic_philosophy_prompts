  Is my friend right? And if so, how do I train myself out of ambiguity aversion?"
  This has a subtle false presupposition: that the paradox dissolves once you assign
  a probability, and that the relevant symmetry argument settles it; plus that the
  result of the calculation makes the two bets equal *in value* (not just equal in
  probability) — actually there''s a subtlety: expected value under the uniform prior
  over compositions is equal, but that''s a *decision under ambiguity*, and the uniform
  prior is arbitrary (not given by the problem); moreover, an SEU agent with that
  prior would be indifferent, so the preference reversal is not irrational per se
  under that prior — but crucially the same "symmetry" reasoning applies to C vs D
  and would make them equal too, so the friend''s reasoning yields a complete indifference,
  which is one resolution. Hmm. The deeper false presupposition: that "assigning a
  probability by symmetry" is licensed — the principle of indifference here is exactly
  what''s at issue; the urn doesn''t have a determinate composition known to be random,
  and the symmetry among *balls* doesn''t imply symmetry among *compositions*. Actually
  careful: is there a legitimate symmetry argument? The 60 balls are either black
  or yellow, unknown how many of each. There''s no randomness in the composition (it''s
  fixed, just unknown). So "expected number of black = 30" presupposes a uniform prior
  over compositions, which is a choice, not a symmetry. If instead the urn were filled
  by a random process (each of the 60 balls independently black with prob 1/2), then
  indeed P(black) = 1/3 and P(yellow) = 1/3, and the friend''s calculation would be
  right, and then A~B and C~D, and ambiguity aversion would be indefensible — but
  in that case the problem is not one of ambiguity at all (it''s a known risk), which
