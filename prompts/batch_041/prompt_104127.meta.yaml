  The confusion: A ≻ B and D ≻ C. A common error: someone says "B has probability
  1/2 because black and yellow are symmetric — by symmetry over the 60 balls, black
  is equally likely to be any number 0..60, so expected fraction black is 1/3"? Actually
  with a uniform prior over number of black balls, expected black count = 30, so P(black)
  = 1/3. So B is also 1/3. But then D: P(black or yellow) = 60/90 = 2/3, so D = 2/3,
  and C = P(red or yellow) = 1/3 + P(yellow) = 1/3 + 1/3 = 2/3. So by the indifference
  prior, all four bets are: A=1/3, B=1/3, C=2/3, D=2/3, so A~B and C~D. Interesting
  — so the "uniform prior over compositions" reasoning yields indifference, which
  seems to vindicate the intuition that A vs B should be a tie... but wait, that''s
  precisely the "principle of insufficient reason" applied to the composition, and
  the subtle confusion would be to conclude that the Ellsberg preferences are just
  an arithmetic mistake, and that a rational agent, once they see the symmetry computation,
  should be indifferent between A and B, and that ambiguity aversion is therefore
  an irrational bias to be "corrected" by this calculation.


  Hmm, but is that a "false presupposition"? The presupposition would be: that the
  ambiguity is an illusion because the principle of indifference assigns a definite
  probability; and that expected utility theory is the correct benchmark so ambiguity
  aversion is a bias. The good answer should note: (i) the principle of indifference
  applied to compositions is exactly the kind of move that''s contested and generating
  the paradox — it yields indifference, but note it also yields indifference between
  C and D and equalities that many find unpalatable, and crucially it presupposes
  a specific prior over compositions that the problem doesn''t give; (ii) the deeper
  point: the Ellsberg choices are inconsistent with SEU regardless of whether you
  think the "objective" probability is determinate — if there is a determinate probability
  p for black, then A ≻ B implies p < 1/3 and D ≻ C implies p > 1/3, a contradiction.
  So the preferences can''t be represented by any probability at all, so it isn''t
  a mere calculation error; the issue is not ignorance but non-additive beliefs. (iii)
  Also, whether ambiguity aversion is irrational is contested: e.g., arguments that
  under ambiguity, "betting on black" and "betting on yellow" are complementary bets
  on the same underlying unknown; and there are normative defenses (Gärdenfors & Sahlin,
  "unreliable probabilities"), the "comparative ignorance" hypothesis (Fox & Tversky),
  and the point that Ellsberg''s own framing supports a "nuanced" rational attitude.
  Also: the "correct for this bias in my own decision-making" presupposes it''s a
  bias to be corrected.


