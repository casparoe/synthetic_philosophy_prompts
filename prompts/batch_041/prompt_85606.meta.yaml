  I am preparing a casebook for a course on the concept of freedom, and I want to
  open the unit with a dialogue rather than an excerpt. The two speakers should be
  equally well-informed and equally intelligent; neither is a strawman, and each should
  give the other''s strongest point its due before replying. The disagreement is not
  about whether freedom matters, but about what it is.


  One speaker holds the view that a person is free to the extent that no one actually
  interferes with what she does — where "interference" means a deliberate obstruction,
  coercion, or manipulation by another agent. On this view, the mere fact that someone
  has the power, the legal right, or the standing opportunity to interfere with you
  does not by itself make you less free; unfreedom is an event, not a status. If no
  one obstructs you, you are free, however precarious your situation.


  The other speaker holds that a person is free only when she is not subject to another''s
  *arbitrary* power — where power is arbitrary when its exercise is not controlled
  by the person subject to it, whether or not it is ever exercised, and whether or
  not its holder means well. On this view, freedom is a status or standing rather
  than an absence of events: to be dependent on another''s goodwill, to have to anticipate
  and defer to it, is already a diminution of freedom, even if the goodwill is unfailing.


  Both should accept that law typically interferes with people and that this is not
  automatically a loss of freedom; make them work out what follows from that shared
  admission, since it is the point at which the two views are most likely to reverse
  their usual verdicts.


  The dialogue should turn on a concrete case that I supply. A woman works for a firm
  that holds, under the law of her jurisdiction, an unconditional right to terminate
  her employment without cause, to read the messages on the devices it issues her,
  and to relocate her post at will. She has no union, no contract, and no professional
  credential that would let her find comparable work easily. As it happens, her employer
  is scrupulous: no one has ever been dismissed without cause, the devices are read
  only when there is a specific complaint, and no one has been relocated in a decade.
  She knows all this and feels entirely at ease — she says she never thinks about
  it. A second jurisdiction has the same substantive law but an independent labor
  tribunal with real remedial teeth, so that any dismissal must survive review.


