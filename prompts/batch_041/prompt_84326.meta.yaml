  Plan for the exam question:


  Context: Upper-level undergraduate / early graduate seminar in philosophy of mind
  for students with science backgrounds. Final exam. One essay question, 90 minutes.


  Question: "The standard knowledge argument asks us to imagine Mary, who knows all
  the physical facts about color vision and then sees red for the first time. A familiar
  physicalist reply is that Mary gains a new *concept* (or ability, or acquaintance)
  rather than a new *fact*. For this question, I want you to test that reply against
  a variant I will call ''Mary''s Ledger.'' In Mary''s Ledger, Mary has complete physical
  knowledge, and in addition, before she ever sees red, she has been given a complete
  and accurate account of every *concept* she will acquire upon seeing red — including
  the phenomenal concept — written in a physical vocabulary she fully understands,
  and she has memorized it. On leaving the room, she sees red. Does Mary learn anything?
  If your answer is yes, say precisely what is learned and why it is not capturable
  in the physical vocabulary she already has. If your answer is no, explain what it
  is for her to have ''had'' the concept all along without ever having exercised it,
  and whether the physicalist reply can still explain why her epistemic situation
  changes. Then assess whether the knowledge argument, so modified, is a threat to
  physicalism or merely a fact about concepts."


