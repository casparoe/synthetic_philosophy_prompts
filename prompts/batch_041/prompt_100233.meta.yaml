  "I am a graduate student in philosophy, and I have been reading about hedonism—the
  view that pleasure is the only intrinsic good or that well-being consists in pleasure—and
  I keep running into a dialectical pattern for which I have no settled name. The
  pattern is this: someone asks what all pleasures have in common. One lists the taste
  of salt on fries, the relief of a headache lifting, the satisfaction of finishing
  a proof, the warmth of a bath, the pleasure of hearing that a rival has failed,
  the absorption of a good conversation. Each is supposed to be a pleasure, yet when
  one looks for a single phenomenal quality—a distinctive feeling tone, a sensation,
  a quale—that all and only these share, the list seems to resist unification. The
  sensory pleasures do not resemble the intellectual ones; relief seems to be defined
  by the removal of pain; malicious pleasure may not even be felt as pleasant in the
  same way. The defender of hedonism then often shifts to a functional or intentional
  characterization: a pleasure is whatever is desired, or whatever one takes pleasure
  in, or whatever plays a certain role in motivation and attention. But that move
  threatens to make the theory circular or to change the subject, since it no longer
  tells us what pleasure is, only what it does. I am less interested in a bare label
  than in whether there is an established concept for this exact dialectical shape—the
  shape in which a theory of a mental kind is threatened not by a counterexample but
  by the apparent absence of any common intrinsic property among the kind''s instances,
  and is rescued only by a functional or response-dependent account that then seems
  to lose the original phenomenon. Is this simply the heterogeneity problem for pleasure,
  or is there a more specific name for the general pattern? How does it differ from
