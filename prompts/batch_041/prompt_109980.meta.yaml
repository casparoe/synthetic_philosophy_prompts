  good (crossing time) and a bad (getting hit) between pedestrians and drivers.


  Part 2 — two functions. Every convention does at least two jobs: it coordinates,
  and it marks membership. The coordination function tells you what to expect and
  lets you act together; the membership function tells you (and others) whose team
  you''re on. I want to claim obligations only attach to the first. Where a convention
  is load-bearing for someone''s interests — the server whose wage assumes the tip,
  the person behind you who has arranged their afternoon around the queue — you owe
