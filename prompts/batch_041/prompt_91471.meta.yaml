  Potential prompt:


  "I have no training in philosophy, but I have been turning over the old lamp puzzle
  in my head for weeks. You know the setup: a lamp is switched on at the start, then
  off after half a minute, on after a quarter, off after an eighth, and so on, so
  that infinitely many switches happen before one minute is up. The usual question
  is whether the lamp is on or off when the minute is over, and the usual answer is
  that there is no answer. I want a poem that does not simply restate that. I want
  it to make the missing answer feel structural rather than like a trick. Please act
  as a philosopher-poet: someone who knows the metaphysics of infinity and also knows
  how to make form carry an argument. Before you write, spend a little time brainstorming
  the possible ways the poem could work; then choose the strongest. Write a villanelle.
  Let the two refrains be the two answers that the puzzle seems to force on us — ''it
  must be on'' and ''it must be off'' — or your own equally short formulations, and
  let the final quatrain bring them together in a way that shows why the question
  cannot be settled by the sequence. The form should do the work: the refrains should
  keep returning because each answer keeps being reasserted by the pattern, and their
  final pairing should leave the reader with the contradiction rather than a resolution.
  To keep it from being a familiar restatement, add one new element: suppose the switch
  is not operated by a person but by a machine that is itself subject to a supertask
  — say, at each step it must first decide whether to flip, and that decision takes
  half the remaining time. Does the regress change what we should say about the lamp?
  Weave that in if it helps, but do not let it become a technical digression. The
  poem should be accurate enough that someone who has thought hard about supertasks
  would recognize the problem and not wince, and clear enough that someone who has
  never heard of it would still follow the stakes. No need for citations or names
  of philosophers. Aim for a poem that could be read aloud at the end of a discussion
  group and leave the room unsettled."


