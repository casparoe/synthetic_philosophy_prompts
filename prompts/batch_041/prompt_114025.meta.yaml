  Let''s draft prompt:


  "You are a philosopher of mind and language with expertise in the philosophy of
  artificial intelligence. I''m a journalist writing a feature about whether large
  language models understand anything, and I want to avoid the usual talking points.
  Please think carefully and begin with a short brainstorming section: list the distinct
  claims that the Chinese room thought experiment and the stochastic parrots critique
  are each making about understanding, and note where they overlap and where they
  are talking past each other.


  Then compare the two as objections to the claim that LLMs understand. To make the
  comparison sharp, use the following distinction, which I''ve been developing for
  the piece: input-side understanding is the capacity to connect symbols to world-directed
  representations or referents; output-side understanding is the capacity to make
  context-appropriate, normatively assessable moves within a shared practice. Which
  of the two objections is primarily about input-side understanding, and which is
  primarily about output-side understanding? Are either of them actually committed
  to the distinction, or do they blur it? Where does each objection locate the failure
  of understanding in a model that predicts the next token?


  Finally, test the two objections against a specific case I''ll describe. Imagine
  a model trained from scratch on a large corpus of mathematical texts and formal
  proof libraries. It is then fine-tuned with reinforcement learning from human feedback
  on proof-writing tasks, and it is deployed with a proof assistant that checks every
  step; the model can revise its proofs when the checker rejects a step. It can prove
  novel theorems that no human has proved before, but it has no sensory contact with
  the world, no embodiment, and no capacity to use the mathematical terms outside
  the proof-writing practice. Which objection, if either, should lead me to deny that
  it understands the mathematics it is doing? Which should lead me to affirm that
  it understands something, even if not everything? Be explicit about what ''understanding''
  means in each verdict.


  I''m not asking for a bibliography or reading list. I want the argument, the distinctions,
  and a clear verdict on the case. Aim for a polished essay of about 1,000 words,
  with a brief brainstorming section, a comparative section, and an application section."


