  carry the philosophical weight and why — the Sammy Jankis material, the tattoos,
  the moment Leonard writes himself a lie — and where the film resists the extended-mind
  reading, so that the honest critic has to concede that some of what Leonard does
  looks more like reliance on a tool than participation in a mind. It should say whether
  the film''s own form, its reverse chronology, is doing anything philosophically
  relevant or merely clever — whether the viewer''s memory is being externalized by
  the film in a way that mirrors Leonard''s, and whether that is an argument or a
  metaphor. And it should end by saying what the film adds to the extended-mind debate
  that the philosophical literature alone does not: whether it shows that the trust
  condition on which the constitutive claim depends is fragile in a way that the standard
  examples (the notebook, the phone) conceal. I am not asking for citations or a reading
  list; argue from the film and from the ideas."


