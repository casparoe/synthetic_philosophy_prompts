  "I teach a graduate seminar on philosophy of mind and cognition, and next week we
  turn to the extended mind thesis — the claim, roughly, that the boundaries of a
  cognitive system need not coincide with the boundaries of skin and skull, and that
  in the right circumstances a notebook, a phone, or another person can be a proper
  part of someone''s mind rather than a mere aid to it. I have found that students
  absorb the abstract arguments well enough but cannot see what is at stake until
  they meet a case where the functional and the constitutive readings of the same
  resource come apart. For that purpose I have been using Christopher Nolan''s Memento,
  which I take to be one of the sharpest thought experiments about external memory
  that anyone has put on film, and I would like a reading of it written for the seminar.


  What I want is not a plot summary or a verdict on the film''s cleverness but a philosophical
  reading that takes both the film and the debate seriously. Leonard Shelby cannot
  form new memories and navigates his investigation through Polaroids, annotated notes,
  and tattoos, and the film eventually reveals that he has, at least once, deliberately
  written himself a false instruction and then trusted it. Treat that not as a twist
  to be explained but as an objection to be weighed. In particular, I would like you
  to work with two distinctions I have been pressing on the students, since I suspect
  they are the ones doing the real work. The first is between storage externalism
  — an external resource that holds information the agent retrieves — and processing
  externalism, an external resource that performs transformations the agent would
  otherwise have to perform internally; ask which one the notebooks and tattoos are,
  and whether the extended mind thesis needs the second to earn the name of ''cognitive.''
  The second is between couplings that are transparent, in the sense that the agent
  uses the resource without representing it (the way a cane is felt through rather
  than looked at), and couplings that are opaque, in the sense that the agent must
  explicitly represent and endorse the resource in order to use it. Then use both
  to adjudicate whether Leonard''s system is a vindication of the thesis, a limiting
  case, or a reductio.


