  stature, stimulant medication for a resident who wants to study for board exams,
  testosterone for age-related decline, and, occasionally, requests for elective procedures
  whose main appeal is competitive advantage. We have twenty minutes per case, the
  members are clinicians, a chaplain, an administrator, and one lay representative,
  and our recommendations go to the insurer and sometimes shape what the patient can
  access. What we lack is a defensible, repeatable procedure. I do not want an essay
  on the therapy/enhancement distinction, and I especially do not want a reading list;
  I want something the committee can actually run in the meeting, with the questions
  in order, what counts as a sufficient answer at each step, the points where the
  process stops with a no, and the points where it must hand the matter to a person
  because the remaining question is one of values rather than facts.


  My seminar has left me suspicious of any procedure that treats disease as a natural
  kind or normal function as a purely statistical fact. The distinction I want you
  to operationalize is between four modes of intervention: restoration, which returns
  someone to a functional level they previously had; compensation, which offsets a
  stable deficit relative to a reference class; augmentation, which raises capacity
  above the person''s own prior baseline while remaining within what is typical for
  that reference class; and optimization, which raises capacity beyond the typical
  range or secures a positional advantage over others. I also want the procedure to
  confront two problems that our committee keeps hitting. The first is the counterfactual
  baseline problem: for many conditions we cannot know what the person''s function
  would have been without the intervention, and for children we cannot know what they
  would have chosen. The second is the positional problem: some interventions help
  only or mainly because others do not have them, so their value depends on distribution.
  Please build the procedure around these ideas, but make it usable by people who
  have not read the theory. It should say explicitly which distinctions must survive
  the simplification and which can be dropped, and it should mark the places where
  the procedure will misfire.


