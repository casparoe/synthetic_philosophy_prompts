  I am a PhD student in intellectual history, and I would like help diagnosing an
  argument that I have been carrying around since a workshop on historical explanation.
  The argument is meant to show that no historical narrative can be a genuine causal
  explanation, but it seems to generalize to every causal explanation, which I take
  to be a reductio. Here it is, with the steps numbered:


  (1) A causal explanation of an outcome is adequate only if it identifies causes
  that operated independently of the fact that the outcome occurred, in the sense
  that their causal role can be specified without assuming the outcome.

  (2) Any historical explanation of an outcome must select and arrange antecedent
  events into a coherent sequence that terminates in that outcome.

  (3) Such selection and arrangement require a criterion of relevance, and the only
  available criterion is the outcome itself; otherwise the historian would have no
  way to distinguish causally relevant antecedents from the infinite field of preceding
  events.

  (4) But selection by the outcome is exactly what hindsight bias distorts, and the
  narrative fallacy consists in mistaking the coherence of the resulting story for
  evidence that the outcome was inevitable.

  (5) Therefore every historical narrative is shaped by the outcome it purports to
  explain and cannot satisfy (1).

  (6) Every causal explanation, including those in the natural sciences, selects and
  arranges antecedents into a representation that terminates in the explanandum.

  (7) Therefore no causal explanation can satisfy (1), and the distinction between
  historical and natural-scientific explanation collapses.

  (8) Since (7) is unacceptable, one of (1) through (4) must be rejected.


