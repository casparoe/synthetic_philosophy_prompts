  by the existence of many counterexamples, so the theory must say what the quantifier
  is ("on average", "typically", "more often than in some comparison group"). Must
  say what the comparison class is — a claim of character is comparative.

  4. It must survive the ecological fallacy / aggregation constraints: it must say
  when an aggregate correlation licenses an individual-level inference and when it
  does not; and it must say what to do when the aggregate reverses under partitioning
  (Simpson-type cases).

  5. It must explain transmission and stability: how traits get from one generation
  to the next, how fast they can change, and whether the theory can accommodate mass
  immigration, generational turnover, and institutional change without the "character"
  evaporating or becoming unfalsifiable.

  6. It must be consistent with known facts about cultural variation: most variation
  is within groups, between-group differences are often small relative to within-group
  spread, borders are recent/arbitrary, and traits are multidimensional and only weakly
  correlated (i.e., the theory must not require a single general factor unless it
