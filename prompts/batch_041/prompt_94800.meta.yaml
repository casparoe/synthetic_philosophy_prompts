  So I''m a science journalist — I mostly write about perception and the philosophy
  of mind — and I''m working on a piece about the colour phi phenomenon. You know
  the one: flash a dot on the left, then a dot on the right a fraction of a second
  later, and people see a single dot travelling across. Fine. But now make the first
  dot red and the second one green, and people will swear the dot turned green partway
  across — that is, they report the colour change at a moment when the second dot
  hadn''t been shown yet. The brain apparently drops a colour change into the middle
  of the journey using information it couldn''t have had when the middle of the journey
  "happened". Dennett''s old Orwellian-versus-Stalinesque framing is where everyone
  goes with this: either the memory of the experience gets rewritten after the fact,
  or there''s no single moment at which the experience is "finished" and shown to
  you. I''m not asking you to adjudicate that, I know it''s been done to death.


  What I want instead is the counterfactual-history move, because I think it gets
  at something the usual debate skips. William James died in 1910, long before any
  of this. Suppose he hadn''t. Suppose he''d read the papers, watched the demos, and
  had the whole modern toolbox of "postdiction" talk available (that''s the word people
  use now — the idea that the brain can hand you a perceptual content whose apparent
  time-stamp is earlier than the stimulus that produced it). What would James have
  made of it?


  I want you to actually commit. Would he have thought the paradox was real, or would
  he have said the mistake is ours — that we''re assuming experience comes with a
