  Let''s craft a set of commitments:

  1. I think a risk score is fair only if it is calibrated within groups: for any
  score value, the probability of the outcome is the same for members of different
  protected groups who receive that score.

  2. I think a decision rule is fair only if it satisfies equalized odds: the true
  positive rate and false positive rate are equal across protected groups.

  3. I think the morally fundamental notion of discrimination is causal: a decision
  is discriminatory if it would have been different had the person''s protected attribute
  been different, holding fixed the features that are not causally downstream of the
  attribute.

  4. I think we should never include the protected attribute as an input to a predictive
  model, because doing so is intrinsically disrespectful and legally suspect; we should
  use race-blind features.

  5. I think the impossibility results (e.g., that calibration and equalized odds
  cannot both hold when base rates differ) are artifacts of demanding exact equality;
  in practice, we can get close enough on both, so they don''t force a choice.

  6. I think individual fairness—similar individuals get similar predictions—is the
  ultimate criterion, and group metrics are just proxies for it.

  7. I think when base rates differ across groups, that is almost always the downstream
  effect of past injustice, so the right response is to change the base rates through
  social policy, not to adjust the algorithm.

  8. I think auditing for disparate impact requires using the protected attribute,
  but this is different from using it as a model input.


