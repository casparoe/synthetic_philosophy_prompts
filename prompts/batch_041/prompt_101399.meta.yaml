  Let''s refine each commitment to create precise tensions.


  1. Calibration: "A risk score is fair only if it is calibrated within groups: conditional
  on receiving the same score, the probability of the outcome is the same across protected
  groups." This is a standard criterion.


  2. Equalized odds: "A decision rule is fair only if it satisfies equalized odds:
  across protected groups, the true-positive rate and false-positive rate are equal."
  Standard.


  3. Causal discrimination: "The morally fundamental notion of discrimination is causal:
  a decision is discriminatory just in case it would have been different had the person''s
  protected attribute been different, holding fixed all features that are not causally
  downstream of that attribute." This is a counterfactual definition.


  4. Race-blind: "A model that does not take the protected attribute as an input cannot
  be discriminatory in the causal sense, because its output does not depend on the
  attribute; proxies that correlate with the attribute are regrettable but not themselves
  discriminatory." This is a common but false view; tension with 3.


  5. Impossibility results are artifacts: "The impossibility results showing that
  calibration and equalized odds cannot both hold when base rates differ are artifacts
  of demanding exact equality; in practice, a model can be close enough on both, so
  no genuine trade-off is forced." Tension with 1+2 if they are exact.


  6. Individual fairness ultimate: "Individual fairness—treating similar individuals
  similarly—is the ultimate criterion, and group metrics are only useful as proxies
  for it." Tension with 1/2 group metrics.


  7. Base rate differences: "When base rates differ across groups, that is almost
  always the downstream effect of past injustice, so the right remedy is social policy
  that changes the base rates, not algorithmic adjustment." Tension with 3 (causal
  model conditions on downstream features, so past injustice may not register as discrimination)
  and with 5/1/2.


  8. Auditing: "Auditing for disparate impact requires using the protected attribute,
  but that is entirely different from using it as a model input, so commitment 4 is
  unaffected by the need to audit." This is apparent tension with 4 that dissolves
  if distinguish use.


