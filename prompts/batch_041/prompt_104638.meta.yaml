  Common analogies for collective/cross-generational guilt:


  - The corporation analogy: a nation is like a corporation — it persists as a legal
  person across generations, so it can owe debts and bear guilt even after all original
  shareholders die. This is used to argue that Germany (or the US) today can owe reparations
  for past wrongs.

  - The family analogy: a nation is like a family — you inherit debts, obligations,
  and shame from your parents.

  - The "ship" / Theseus''s ship analogy: the nation persists through change of parts.

  - The "inheritance/estate" analogy: you inherit the estate, you inherit the debts.

  - The disease/illness analogy.


  I think the corporation analogy is the most commonly leaned on, and it does real
  work: it licenses the conclusion "nations can be guilty across generations, so reparations
  are owed." The disanalogies matter: corporations have voluntary membership, exit,
  defined charter, explicit liability rules, and — crucially — corporate liability
  is usually *financial*, not *moral guilt*; you don''t say a corporation is morally
  guilty in the way a person is, and shareholders aren''t personally guilty. Jaspers''s
  four-fold distinction is relevant: criminal, political, moral, metaphysical guilt
  — the analogy carries political/legal guilt well but collapses for moral and metaphysical
  guilt, which are the ones that can''t be delegated or inherited.


