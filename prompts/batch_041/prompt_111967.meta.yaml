  1. Dennett''s "free-floating rationale" — reasons that no one need represent; the
  "rationale" is a normative claim about what the system is "doing well". Used in
  Darwin''s Dangerous Idea and in "The Intentional Stance"/"Intentional Systems in
  Cognitive Ethology". Also "competence without comprehension" (From Bacteria to Bach).

  2. The problem of "which rationale" — Dennett''s own discussion: the frog''s snapping
  at "flies" vs "small dark moving things"; he says the intentional characterization
  "flies" is the one that explains why the mechanism exists (it was selected for detecting
  flies), even though the mechanism is triggered by BBs. So Dennett anchors the rationale
  in selection history — a "criterion for the real pattern". So the "learned, no selection
  history" case is a genuine edge.

  3. The Gould & Lewontin critique (spandrels, just-so stories) — the worry that a
  rationale can be spurious.

  4. Also the "as-if" vs "real" intentionality debate (Dennett''s instrumentalism
  vs. realists like Fodor, and the "cheap" vs "real" intentionality).

  5. Also "teleosemantics" (Millikan) — the reason is "about" things.

  6. Also relevant: the "reason" is not just a cause because it''s normative (can
  be assessed as good/bad). This connects to the "normativity of function" and to
  "rationality without a rational agent" — also to "the normative in nature" debate.

  7. Also: some philosophers (e.g., those inspired by "anti-adaptationism") argue
