  for a Principle of Conformity" — actually the paper is by Bostrom, Douglas, Sandberg
  2016, "The Unilateralist''s Curse and the Case for a Principle of Conformity").
  The idea: when a group of agents each can unilaterally take an action, and each
  acts if they think it''s net positive, then for actions that are harmful in a fraction
  of cases... actually: if each agent has independent evidence and acts on their own
  judgment, the action gets taken if any one agent judges it good — so for actions
  that are usually bad, the chance of someone wrongly thinking it good is high. The
  curse: unilateral action by a well-intentioned individual can be harmful even when
  each acts on good evidence, because of the selection effect. Solutions: conformity
  principle, requiring some threshold of agreement, or a "principle of conformity"
  where you only act if a certain number of others would also act, or if the action
  is "pinkable"? There''s also the "narrow" vs "wide" versions, and the relation to
  the "unilateralist''s curse" in AI safety (e.g., someone unilaterally deploying
  an AI, someone doing gain-of-function research, geoengineering).


