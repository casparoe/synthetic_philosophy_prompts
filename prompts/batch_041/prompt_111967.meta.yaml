  Free-floating rationales (Dennett): reasons can be attributed to processes/designs
  without any reasoner — e.g., the "rationale" for the shape of a termite mound''s
  cooling, or the pattern of a bee''s dance. Dennett''s notion: "free-floating rationales"
  — reasons that float free of any mind that has them. Examples: the optimal foraging
  "reasoning" implicit in a bird''s behavior; the design rationale in a heart valve;
  also in evolutionary game theory, e.g., "why" a hawk-dove equilibrium holds. Also
  relevant: Dennett''s "intentional stance", "competence without comprehension" (which
  is a later Dennett phrase from From Bacteria to Bach and Back). Also "as-if" intentionality
  (Dennett''s "true believers"), and the debate with Fodor over whether free-floating
  rationales are legitimate; also the "cheap" version — "why" questions in biology;
  the debate about "teleosemantics"; "selection for" vs "selection of" (Sober). Also
  related: "the appearance of design", Hume''s "reason in animals", the "logic of
  the peacock''s tail".


