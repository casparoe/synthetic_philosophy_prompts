  (1) Heterophenomenology takes a subject''s sincere reports as data and is officially
  neutral about whether what the subject reports is actually the case; the reports
  establish what the subject believes, not what is true.

  (2) A method that is neutral about whether the subject''s reports are true must
  also be neutral about whether there is anything it is like to be the subject, since
  a subject who reported all of this with nothing it is like to be them would produce
  exactly the same data.

