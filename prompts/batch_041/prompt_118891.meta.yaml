  magnetic marbles" or similar). The simmballs are magnetic, so they interact with
  each other, and their collective dynamics produce patterns. The careenium is meant
  as a metaphor for the brain: simmballs are like neurons (or lower-level entities),
  and the higher-level patterns that emerge are like symbols or thoughts. The question
  "who shoves whom around" is about downward causation: do the higher-level symbolic
  patterns have causal power over the lower-level physical substrate, or is it all
  just simmballs pushing simmballs? Hofstadter''s answer, I believe, is that the symbolic
  level is real and explanatory — a "strange loop" where the pattern at the top level
  is also a pattern at the bottom level, and the causal story at the symbolic level
  is not reducible in a simple way, but it''s not a separate force either. The simmballs
  are magnetic marbles that stick together in clusters, and the clusters move around,
  and the clusters'' behaviour is what we''d call symbolic. The question is whether
  the symbols (higher-level descriptions) push the simmballs around or the simmballs
  push each other and the symbols are just epiphenomenal.


