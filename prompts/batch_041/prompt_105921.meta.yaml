  commitments, his work for socialist newspapers, his lifelong pacifism, and, around
  him in the Vienna Circle, Neurath''s insistence that the scientific world-conception
  is not a neutral intellectual pastime but an instrument for the rational reconstruction
  of society — for planning, in the broad sense, against tradition, myth, and charismatic
  authority. The trouble is that these two strands seem to pull in opposite directions:
  the first tells me that at the level of framework choice there is no truth of the
  matter and no framework may be ruled out, while the second plainly regards some
  ways of organizing society as better than others and treats the choice between them
  as something more than an unargued preference.


