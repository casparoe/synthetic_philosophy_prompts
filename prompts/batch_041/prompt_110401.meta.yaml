  Draft:


  I''m a PhD student working on early modern philosophy and history of science, and
  I''m trying to turn a seminar paper into a proper essay on Hobbes''s geometry. I''ve
  got a draft that I think is pretty decent but I want a second opinion before I send
  it to my advisor, because I''m worried I''m either over-charitable or making a mountain
  out of a molehill. The draft goes something like this. The usual way of telling
  the story is that Hobbes was a great political philosopher who had a bizarre and
  embarrassing hobbyhorse, squaring the circle, and that John Wallis properly humiliated
  him in the 1650s, and that the whole episode shows Hobbes was out of his depth in
  mathematics. I want to argue that this is too quick. Hobbes''s geometry is not just
  failed mathematics; it''s a worked-out, if ultimately unsuccessful, philosophy of
  what makes a science demonstrative. For Hobbes, geometry is demonstrable because
  we make the figures ourselves. The definitions are genetic or causal: we understand
  a circle by understanding the motion that generates it, and we understand a line
  by the motion of a point. This is the same model he uses for civil philosophy: we
  make the commonwealth, so we can know it demonstratively in a way we can''t know
  natural bodies, which God made. So geometry and politics are the two sciences where
  the maker''s knowledge model applies. The twist I want to develop is that Wallis
  is not just a better mathematician but a representative of a rival epistemology
  of mathematics. Wallis''s algebra is symbolic and manipulative; it doesn''t require
  you to construct the object in intuition, it requires you to follow rules for signs.
  Hobbes sees this as a return of scholasticism, a way of talking without knowing
  what you''re talking about. So the quarrel is about what counts as a demonstration,
  not just about who can square the circle. Then I want to say that Hobbes''s constructivism
  has a real tension. If geometrical knowledge is knowledge of what we make, then
  it''s knowledge of our own artifacts, not of independent reality. But Hobbes is
  a materialist who thinks geometry is about bodies and motion. So is he saying we
  make real bodies when we draw a circle? Or is he equivocating between constructing
  a figure on paper and constructing the object in thought? And does his refusal of
  algebra actually follow from his constructivism, or is it just a prejudice that
  makes his own proofs fail? I think the failure of his squaring attempts is overdetermined:
  he refuses algebraic methods, he relies on diagrams in ways that smuggle in assumptions,
  and his kinematic definitions are too thin to constrain the constructions. So his
  epistemology of geometry doesn''t save his geometry. But I want to claim that the
  episode is still philosophically interesting because it shows a coherent alternative
  to the algebraic revolution, and because the maker''s knowledge model has a real
  problem that later constructivists also face. My question for you is whether this
  is a defensible line or whether I''m just being contrarian. I''d like comments on
  accuracy: am I getting Hobbes''s view of demonstration right, or am I importing
  too much from the later maker''s knowledge tradition? Am I right that Wallis''s
  algebra represents a different epistemology, or is that too neat? And on the philosophical
  argument: is the tension between constructivism and materialism a real problem for
  Hobbes, or does he have a way out that I''m missing? Also, is the essay interesting,
  or does it just restate what Hobbes scholars already say? And if you think the whole
  line is wrong, tell me where it goes wrong and what would be a better way to frame
  it. Please write your comments as continuous prose, no headings, no bullet points,
  no bold text, no tables, just the way you''d write an email.


