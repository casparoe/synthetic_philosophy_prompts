  \ and the 5 are strangers but the 1 is a child... The point: locate the number where\
  \ the group's answer flips from \"coin flip, it's a tie\" to \"obviously the many.\"\
  \ Then ask each group to write down the principle that generates their answers.\
  \ Then swap principles between groups and have them apply a rival group's principle\
  \ to case (f) and (g).\n\nHmm, this is getting long. 50 min is tight. Maybe simplify:\
  \ combine rounds.\n\n5. Round 4 — the coin (5 min): Actually run the coin flip.\
  \ Two volunteers (the lone victim and one of the five) each call it. Whoever wins,\
  \ that site gets the boat. Then debrief: does this feel like a just outcome? A fair\
  \ procedure? Note that this is one serious proposal in the literature, and that\
  \ it gives the five a combined 50% and the one a 50% chance — which sounds absurd\
  \ if you think numbers count, and exactly right if you think each person's claim\
  \ is equal and there's no person whose claim is five times as strong.\n\n6. Debrief\
