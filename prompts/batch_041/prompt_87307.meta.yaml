  \ if you must choose, you can flip a coin — that gives the one person a 50% chance\
  \ and each of the five a 10% chance. Or he says it doesn't matter morally.\n\nThen\
  \ there's Parfit/Kamm responses.\n\nSo the activity: \n- Stage 1: decide the ambulance.\
  \ Everyone says five.\n- Stage 2: veil of ignorance / role assignment. Reveal that\
  \ one of them is the lone victim.\n- Stage 3: the lone victim is given a \"objection\"\
