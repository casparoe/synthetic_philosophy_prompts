  \ available ambulance to one. They decide. Everyone says send to the five. Fine.\n\
  \nPhase 2: Now the twist. Each student's card is their own identity — actually:\
  \ the facilitator hands each student a card; five cards say \"you are at Site A\"\
  \ etc. Hmm.\n\nAlternative mechanic that really generates the Taurek intuition:\
  \ \"Splitting the rescue.\" Each participant is one of the six potential victims\
  \ and doesn't know which. The group must decide the rescue policy behind a veil.\
  \ Behind the veil, everyone prefers saving the five (higher chance of being saved).\
  \ Then lift the veil: the one person objects — \"why does my claim count for less?\"\
  \ And the group must answer. This is good because it stages the tension: ex ante\
  \ you'd aggregate, ex post the single person's claim seems just as strong as any\
