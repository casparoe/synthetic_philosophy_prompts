  \ ask the group: does the vote settle it? What if the one person's card also said\
  \ something else? (Seeding: the five cards could all be blank, so all six are strangers\
  \ to each other — nothing but numbers.)\n\nHmm, the vote mechanic is good: it shows\
  \ that \"the numbers\" is just the majority's preference, and it gives the lone\
  \ person a voice.\n\n4. Round 3 — the escalation (10 min): The facilitator now runs\
  \ a sequence of private forced choices (show of hands or anonymous slips), each\
  \ on a fresh case: (a) 1 vs 1; (b) 1 vs 2; (c) 1 vs 3; (d) 1 vs 5; (e) 1 vs 100;\
