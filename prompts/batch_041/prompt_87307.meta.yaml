  \ by saving the five. There's no person who is better off in the \"five saved\"\
  \ outcome relative to the \"one saved\" outcome, when compared person-by-person...\
  \ Actually there is: each of the five is better off. But the comparison \"five saved\
  \ is better than one saved\" doesn't identify a single subject who gains more.\n\
  \nAlternative staging: \"The ledger.\" Participants must write down, for each outcome,\
  \ a list of who lives and who dies, and then find the person whose well-being is\
  \ improved by choosing the five over the one *more than* the lone person's is improved\
  \ by choosing the one. Each of the five gains their life; the one gains their life.\
  \ Equal gains. So the \"better outcome\" judgment can't be read off any individual's\
  \ gain. Where does the \"better\" come from? That's Taurek's question.\n\nOK. I\
  \ think I have enough. Let me design a concrete activity:\n\n**Title: The One and\
  \ the Five** (not to be named in the prompt)\n\nSetting: high school philosophy\
  \ club, 16-18 students, 50 minutes. Room with chairs.\n\nMaterials: index cards,\
  \ a coin, six \"victim\" cards, a bell/whistle, a whiteboard (or a big sheet of\
  \ paper), a timer.\n\nStructure:\n\n1. Warm-up (5 min): Everyone writes on a slip,\
  \ privately, the answer to: \"A rescue boat can reach one of two sites. Site A has\
  \ one person. Site B has five. Which site? Also: how confident are you, 1-10?\"\
  \ Collect slips. Tally. Expect nearly everyone says B, high confidence. Read out\
  \ the tally. (This establishes the \"obvious\" answer and gives the group a baseline\
  \ they'll later have to defend.)\n\n2. Round 1 — the ledger (10 min): Split into\
  \ groups of 3-4. Each group gets a worksheet with the outcome table: two columns,\
  \ \"Rescue Site A\" and \"Rescue Site B,\" rows for the six people. They must fill\
