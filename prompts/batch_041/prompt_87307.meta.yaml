  \ the \"force\" of the idea needs the participants to actually feel the pull of\
  \ the anti-aggregation view, which is hard.\n\nMaybe the way to make them feel it:\
  \ run the case where the one is one of them (a specific named person, and the five\
  \ are strangers with just numbers, e.g., \"five people from a town you've never\
  \ heard of\"), and then flip: the one is a stranger and the five include... hmm.\n\
  \nOr: the \"personal identity\" twist. What if the one person is you and the five\
  \ are... no.\n\nAnother good device: **make the one person's claim visibly equal\
  \ to each of the five's claims, one at a time.** I.e., the group first compares\
