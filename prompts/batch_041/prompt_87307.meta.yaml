  \ there? That's a nice forced-choice sequence and generates the \"where's the threshold\"\
  \ discomfort. And it's basically Taurek's challenge. Yes — this is a good mechanic:\
  \ a sequence of pairwise choices, each person choosing privately, then revealed.\
  \ Where does your answer flip from coin-flip to save-the-many? Most people will\
  \ flip at 2. Then: what's the principle? \"Two is more than one\" — but then why\
  \ doesn't the same principle say the one person's life counts for less?\n\nHmm,\
  \ but that's more of a \"feel the puzzle\" than \"feel the force of Taurek's view.\"\
  \n\nTo feel the force of Taurek's view: you need to feel that saving the five is\
  \ NOT obviously right, i.e., that the lone person's complaint is legitimate. How\
  \ to stage that? Have the lone person make a real plea, and have the group respond,\
