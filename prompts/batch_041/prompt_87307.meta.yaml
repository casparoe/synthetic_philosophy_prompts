  \ out the numbers.\n\nHmm, actually maybe a cleaner mechanic: \"the lottery.\" Each\
  \ participant gets a token representing their life. The group must decide how to\
  \ distribute a scarce good. Hmm.\n\nLet me reconsider the domain choice. Maybe \"\
  the wrong kind of reasons problem\" is more in-the-weeds and less likely regurgitated.\
  \ The wrong kind of reasons problem: reasons to have an attitude that are not the\
  \ kind of thing that can make the attitude correct/fitting — e.g., a reward for\
  \ believing p (Pascal's wager style), or a threat that makes you afraid of something\
