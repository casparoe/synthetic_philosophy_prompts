  Draft:


  I am a Year 12 pupil and I have been asked to lead a thirty-minute session for our
  school''s philosophy and economics society next half term. The audience will be
  about twenty pupils from Years 10 to 13; most will have done GCSE geography, where
  the phrase "tragedy of the commons" sometimes comes up in the unit on resource management,
  but none of them will have met any game theory or formal economics, and I have only
  a whiteboard and no handouts. I do not want you to explain the idea to me. I want
  you to plan how I should explain it.


  The session is on the tragedy of the commons, but I am anxious that it will turn
  into the thing everyone has already heard: a parable about human greed in which
  the only lessons are "people are selfish" and "therefore privatise or regulate".
  I would like the plan to be built so that the structure of the situation, rather
  than the character of the people in it, does the explanatory work, and so that the
  pupils leave with a sharper picture than the one they arrived with. In particular
  I would like the session to land two ideas that I think most of them will not have
  met and that I would like you to weave in rather than bolt on.


  The first is that the parable, as it is usually told, is not really about a commons
  at all: it describes a resource that nobody owns and nobody governs, which anyone
  may take from freely. A commons in the older sense -- a resource that a community
  actually holds and manages, with its own rules about who may take what, who watches,
  and what happens to someone who breaks the rules -- is a different arrangement,
  and it is an open question whether the destructive outcome is a feature of shared
  ownership or of the absence of any rules at all. I want the pupils to feel the force
  of that distinction without my having to use the word "institution" more than once.


  The second is that "using too much of a shared thing" and "letting other people
  pay for a shared thing" are two different failures that get run together in most
  tellings. The first is about taking from a resource that each person''s use depletes;
  the second is about failing to contribute to something that everyone can then enjoy
  whether or not they paid. I want the session to make the difference visible with
  the same example, if that is possible, rather than with a second one.


  What I need from you:


  1. The order in which the ideas must be introduced, and why each one has to be in
  place before the next will be understood...

