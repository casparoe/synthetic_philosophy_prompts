  Final draft:


  I am a Year 12 pupil, and I have been asked to lead a thirty-minute session for
  our school''s philosophy and economics society next half term. The audience will
  be around twenty pupils from Years 10 to 13. Most of them will have taken GCSE geography,
  where the phrase the tragedy of the commons is sometimes mentioned in passing during
  the unit on resource management, but none of them will have met any game theory
  or formal economics. I shall have a whiteboard, no handouts, and no way of setting
  them any preparatory work. Please do not explain the tragedy of the commons to me;
  I understand the basic shape of it. What I need is a plan for how I should explain
  it.


  My worry is that the session will collapse into the version everyone has already
  half-heard: a parable about human greed whose only moral is that people are selfish,
  followed by a short list of remedies (privatise it, regulate it, or ask people to
  be nicer). I want the structure of the situation, rather than the character of the
  people in it, to do the explanatory work, and I want the pupils to leave with a
  sharper and less moralising picture than the one they arrived with. To that end
  I should like two ideas woven into the session rather than tacked on at the end.


  The first is that the parable, as it is usually told, is not really about a commons
  at all. It describes a resource that nobody owns and nobody governs, from which
  anyone may take as much as they please; the harm comes from the absence of any rules
  about who may take what, who keeps watch, and what happens to someone who oversteps.
  A commons in the older sense -- a resource that a community actually holds and manages,
  with rules of exactly that kind -- is a different arrangement altogether, and it
  is a genuinely open question whether ruin is a consequence of shared ownership or
  of the sheer absence of governance. I should like the pupils to feel the force of
  that distinction, and I would rather not have to use the word institution more than
  once in doing so.


  The second is that taking too much from a shared thing and letting other people
  pay for a shared thing are two different failures that most tellings run together.
