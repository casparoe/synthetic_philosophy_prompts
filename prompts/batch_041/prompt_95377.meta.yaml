  "I am a retired physicist. Most of my working life was spent on inverse problems
  — remote sensing, then seismic imaging — and I have come to think in a particular
  idiom: I ask whether a parameter is identifiable from the data, whether the problem
  is ill-posed, whether two descriptions that fit the data equally well are genuinely
  rival or merely two ways of writing down the same state (a gauge choice), and what
  work is being done by the constraints I impose when I regularise. Since retiring
  I have been reading philosophy on my own, without a teacher and without any formal
  training, and I have run into Quine''s thesis of the indeterminacy of translation.


  As I understand it — and please correct me where I have it wrong — Quine imagines
  a linguist who has only the natives'' observable behaviour to go on, hears the utterance
  gavagai when a rabbit runs past, and finds that the totality of that behaviour never
  decides between a manual that renders the word as rabbit and a manual that renders
  it as an undetached rabbit part or a momentary rabbit stage. The two manuals agree
  on every fact about what the speakers will say and do, in every circumstance, and
  yet, Quine insists, they say different things; he generalises this to reference
  itself, which he thinks can be permuted wholesale by what he calls proxy functions,
  so that the objects of a theory can be shuffled while every sentence of the theory
  keeps its truth value. He ties this to his earlier attack on the analytic-synthetic
  distinction, and he takes the evidence base to be the community''s dispositions
  to verbal behaviour rather than anything inner.


  What I would like from you is a translation and then a residue report. Take that
  thesis and restate it as faithfully as you can in my vocabulary: identifiability
  and non-identifiability, ill-posedness, observational equivalence, gauge freedom
  and reparameterisation, regularisation and the priors that regularisation smuggles
  in, degeneracy, and the difference between a model that is false and a model whose
  parameters have no unique best value. Be explicit about what plays the role of data,
  what plays the role of the parameter space, and what the claim that there is no
