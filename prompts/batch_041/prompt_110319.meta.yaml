  Draft 1:


  I have been reading rationalist blogs and forums for close to twenty years, and
  I have finally talked my way into running a session at a weekend workshop for about
  twenty-four adults — mixed backgrounds, no philosophy training required, several
  of them the sort of people who will have read the same blogs I have and will be
  watching for whether the thing actually works. I have ninety minutes, one room with
  movable chairs, a whiteboard, and index cards. I want an activity that makes the
  group feel the force of a distinction that I think is under-appreciated, and that
  I would rather they discover than be told.


  The distinction: an epistemic bubble is a group that is missing the relevant evidence
  — the other side is simply absent from the room. An echo chamber is a group that
  has the evidence in front of it and has, in advance, been given reason to discount
  it. The two look identical from outside — both groups hold the same false belief
  — but the remedies diverge sharply. Adding the missing evidence dissolves a bubble
  and does nothing for an echo chamber, or makes it worse. And I want them to feel
  something more specific than that: that in the second case the outside testimony
  is not weighed and found wanting, it is routed around. The members do not reject
  the argument; they never process it, because their trust has already been relocated
  to a source that has issued a verdict on it.


  So: design me a runnable game. Requirements...


  - The discrediting has to be endogenous. Do not hand down a rule saying "distrust
  the blue team"; arrange incentives or a procedure — a public credibility ledger,
  a coherence bonus, whatever you think works — so that participants themselves produce
  the discounting and can see afterwards that they did it. [Also they must be able
  to see that a reasonable person in their position might have done the same.]

  - Nobody should be able to walk away with "we were just being stubborn" or "we were
  just being gullible." The outside source should be genuinely flawed in some minor
  respect, so the correct response is a modest update, and the interesting quantity
  is the gap between the modest update owed and the zero update performed.

  - At some point before any reveal, have them write down what would change their
  minds, and what they currently think of the other side''s competence. The debrief
  should be able to use their own handwriting.

  - No real money, no preparation, nothing that requires a second facilitator.


  Give me the rules, materials, the scoring or payoff scheme, a minute-by-minute timeline,
  the roles if any, and the debrief, including which moments in the game map to which
  part of the distinction. Tell me what will predictably go wrong the first time I
  run it and how to salvage it. And be honest about what this cannot reproduce: I
  assume it cannot give them the years of slow accretion, or the fact that real members
  of an echo chamber are not sitting in a game but living inside the thing. Say so,
  and tell me what I have to supply myself.


