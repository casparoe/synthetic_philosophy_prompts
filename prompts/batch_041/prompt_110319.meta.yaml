  Design sketch: A "trading floor" / "research lab" game. Participants are split into
  two (or three) research teams, each investigating a factual question with a hidden
  truth. Each team gets a private evidence feed with different pieces of evidence.
  Crucially, one condition: teams also get a "source reputation update" that says
  the other team''s sources are systematically unreliable / paid by an adversary.
  The game is played twice (or in parallel arms) with and without the reputation injection,
  so participants feel the difference: exposure fixes the bubble, exposure inflames
  the echo chamber.


  Better: within one session, run a within-subjects design so everyone feels both.
  Round 1: teams share evidence freely and converge on truth (bubble pops). Round
  2: same structure but now there''s a "trust ledger" mechanic where each team must
  rate the trustworthiness of sources, and the rules make it cheap to discount outsiders
  (e.g., a scoring rule that rewards internal consistency and penalizes changing your
  mind). Participants then find that the very mechanism that made them good at Round
  1 (consistency, in-group epistemic trust) makes them worse when the evidence comes
  from a discredited source. The debrief maps: bubble = absent evidence, echo chamber
  = pre-emptive discrediting of evidence + methods that make it costly to update.


