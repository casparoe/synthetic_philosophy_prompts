  of choosing the correct of two options, then the probability that the majority is
  correct increases with the number of jurors and tends to 1. If p < 1/2, it tends
  to 0. If p = 1/2, it''s 1/2 for all n. All correct, no attribution needed (well,
  Condorcet is the name, that''s fine — it''s the domain name).

  - Independence assumption: essential for the clean result.

  - The theorem requires binary choice; multi-option aggregation faces the voting
  paradox/cycles — different result. Correct that they''re distinct.

  - Sincere voting assumed.

  - The theorem is aggregative, silent on deliberation.

  - Nothing about legitimacy or about which individuals are right.

  - Heterogeneous competence with mean > 1/2 and independence: still converges to
  certainty. Correct.

