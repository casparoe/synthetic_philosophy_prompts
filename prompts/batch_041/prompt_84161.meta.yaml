  I''ve spent a lot of time around rationalist blogs and I''m familiar with the standard
  family of warnings here — Goodhart''s law, Campbell''s law, the cobra effect, all
  the stories about agents who hit a target by cheating it. What I keep running into
  is a pattern that I can''t find a clean name for, and I suspect the reason is that
  it isn''t quite the thing those names are for.


  Here''s the shape of it. A metric is a ratio, or an average over a set. It goes
  up. Nobody cheats. The reports are accurate — if you audited every number you''d
  find it honestly computed from real cases. But the rise comes entirely from a change
  in *who or what is in the set*, not from any improvement in the performance the
  metric was meant to track. And each step that produced the change was individually
  reasonable, made by someone with no view of the aggregate.


  Two instances. First, a hospital''s reported mortality rate: it falls, and it falls
  because the sickest patients are increasingly transferred to a specialist unit,
  and because the referring physicians — not the hospital, not anyone gaming anything
  — have learned to route the hardest cases elsewhere. Every transfer is defensible
  on clinical grounds. The rate is a true rate over the patients the hospital treated.
  But the number that went down is a number about a population that got easier.


  Second, a support queue measured by average first-response time. It improves. What
  happened is that the agents started clearing the easy tickets first and letting
  the hard ones sit — not as a strategy, just as the natural thing to do when you''re
  behind and the easy ones close. The average is correct; the median is correct; the
  long tail of unanswered hard tickets grew, but the tail is not in the metric, and
  nobody was tracking it separately because the metric was the tracking.


  The common structure, as best I can state it: the measure is a *true* statistic
  over a *drifting* set, the drift is produced by ordinary local decisions rather
  than by optimization against the measure, and the statistic improves as the set
  drifts. The thing the measure was a proxy for may well have gotten worse.


