  \ dominance by a mixture vs pure; the fact that the elimination order can matter\
  \ for weak dominance; the fact that \"rationality\" here means common knowledge\
  \ of rationality which is an infinite hierarchy — like two mirrors. Hmm, but the\
  \ prompt is for a non-academic asker. They'd need to be introduced.\n\n- Domain\
  \ 3: Sunk cost. Common analogy: \"sunk costs are like spilled milk — crying over\
  \ it is pointless.\" Or \"honoring sunk costs is like refusing to leave a burning\
  \ building because you paid for the ticket.\" Or the classic: \"the sunk cost fallacy\
  \ is like the gambler's fallacy.\" Actually, a very common analogy: \"sunk costs\
  \ are like a broken vase; the money's gone, so ignore it.\" Another: \"continuing\
  \ a bad project because of sunk costs is like staying in a bad marriage because\
  \ of the years invested.\" The audit: the analogy treats all non-recoverable investments\
  \ as alike, but some sunk costs carry information (signaling to yourself about your\
  \ type, or to others), some create option value, and honoring them can be rational\
  \ as a commitment device or because of reputational/self-signaling effects. Also\
  \ \"throwing good money after bad\" vs. honoring sunk costs as a signal of resolve\
  \ in bargaining (Schelling). This is a rich one for a non-academic: \"I've been\
  \ told that sunk costs are sunk — like spilled milk — and any consideration of them\
  \ is a fallacy. But I've noticed that people keep investing in things partly because\
  \ of what they've already put in, and sometimes that seems wise.\"\n\nNew/niche\
  \ idea injection: the distinction between sunk costs as information (the \"sunk\
  \ cost as a signal of value\" argument — e.g., Arkes & Blumer; the \"sunk cost effect\
