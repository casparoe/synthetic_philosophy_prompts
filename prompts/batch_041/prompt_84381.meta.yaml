  \ dominated by any pure strategy (e.g., matching pennies variant), so \"reading\
  \ off the puzzle\" requires considering mixtures; also, iterated elimination of\
  \ strictly dominated strategies never eliminates a Nash equilibrium strategy, but\
  \ it can eliminate strategies that are played with positive probability in... hmm,\
  \ no.\n\nThis could be good and \"in the weeds.\" The analogy to audit: \"solving\
