  **Student''s response:**


  The strongest version of the "irrelevant" position rests on Frege''s own anti-psychologism.
  From the Grundlagen onward, and most explicitly in the 1894 review of Husserl''s
  Philosophie der Arithmetik, Frege argues that logical and mathematical truths are
  objective and independent of any thinker''s mental states. If that is right, facts
  about Frege''s character cannot bear on the truth of his claims, so the diary is
  at most of biographical interest. The position also notes the chronology: the diary
  is from 1924, so it postdates Begriffsschrift, the Grundlagen, and both volumes
  of the Grundgesetze, and therefore cannot have shaped the logical work itself.


  The strongest version of the "it matters" position accepts all of that about truth
  and adds two points. First, Frege''s Platonism is itself a claim about the subject
  matter of logic, not a license to ignore authors; we can concede that truth is mind-independent
  while still holding that a thinker''s commitments shape which questions he asks,
  which arguments he finds compelling, and how he states the laws of logic. Second,
  if we take his later remarks as evidence of commitments he held throughout, the
  "no influence" argument loses its force, since the chronology only shows when the
  attitudes were written down, not when they were formed.


  I side with the second position, though I would put it more modestly. The diary
  does not falsify Frege''s theorems, but it does bear on interpretation and on how
  we present the corpus. It is worth noting that Frege''s anti-psychologism is standardly
  read as a response to Husserl''s Logical Investigations, so a philosopher''s polemical
  context can be philosophically decisive; by the same token, Frege''s political context
  is fair game. The objection I take most seriously is the genetic fallacy: showing
