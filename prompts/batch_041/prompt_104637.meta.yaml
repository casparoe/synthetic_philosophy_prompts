  Let me draft the answer:


  "Friedman''s essay, which leads off his 1953 collection Essays in Positive Economics,
  is the classic statement of the view that a theory is appraised by the accuracy
  of its predictions and not by the descriptive accuracy of its assumptions. His central
  claim is that the more significant the theory, the more unrealistic the assumptions.
  ''Unrealistic'' here doesn''t mean false; it means abstract — the hypothesis strips
  away a mass of detail that is predictively irrelevant and keeps only the features
  that generate the prediction. So the claim is a descriptive generalization about
  successful theories, not a recipe.


  He illustrates the point with the expert billiard player, who makes his shots as
  if he had solved the equations of mechanics, though he has done no such thing. The
  hypothesis that the player shoots as if he knew the laws of mechanics predicts the
  shots very well, and it would be a mistake to reject it because the player''s head
  plainly contains no equations. Same structure with the leaves: the hypothesis that
  leaves position themselves to maximise the sunlight they receive predicts the observed
  distribution of foliage, and it isn''t refuted by the fact that leaves don''t do
  any calculating. What the ''as if'' formulation is doing is relocating the content
  of the theory from an inner mechanism to a predicted pattern of behaviour.


  Samuelson dubbed the position the ''F-twist,'' the F standing for the falsity of
  assumptions, which is the twist Friedman gives to the usual demand that a theory''s
  assumptions be true. Samuelson''s objection is that once you exempt assumptions
  from any realism requirement you can smuggle any falsehood into a theory, and the
  theorist is then free to cherry-pick the phenomena his theory happens to get right.
  Friedman''s reply is that testing assumptions directly would rule out exactly the
  abstractions that give a theory its predictive power, and that the real comparison
  is always between rival theories and their predictions, not between a theory and
  the world it describes.


  On (d): Friedman''s view is not that assumptions are irrelevant. He says assumptions
  do work — they specify the class of phenomena a theory is meant to cover and they
  make the theory simple enough to use. The point is only that their descriptive falsity
  is not itself a ground for rejecting the theory.


  I think Friedman comes out of this well, but I''d push back on one thing. His claim
  that unrealism is a mark of significance slides into the stronger claim that unrealism
  is a mark of virtue, so that the less realistic the assumptions the better the theory.
  That can''t be right, and it''s what licenses the assumption that firms maximise
  profits because they consciously equate marginal revenue and marginal cost, which
  is a fiction even Friedman''s own respondents deny. So I''d say the essay''s central
  insight survives, but the rhetoric overshoots."


