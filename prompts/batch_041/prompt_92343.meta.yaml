  Potential prompt:


  I am a retired field biologist who has spent the last few years reading philosophy
  of biology, and I have been asked to interview a philosopher for our departmental
  seminar series. The guest defends a causal-role account of biological function—the
  view that a trait''s function is the contribution it makes to a capacity of the
  system in which it occurs—and is skeptical of etiological, selected-effects accounts
  that tie function to a history of natural selection. I want the interview to be
  substantive rather than a survey of the debate. Please act as an expert philosopher
  of biology and, before you write anything, brainstorm the strongest pressure points
  for each account and the most likely replies. Then draft eight to ten interview
  questions, with a follow-up for each keyed to the answer the guest is most likely
  to give.


  The questions should be in the weeds. At minimum, include:


  1. A question that forces the guest to confront the system-selection problem: if
  any effect can be a function relative to some system—circulating blood, making noise,
  occupying space—what principled way does the causal-role account have to pick out
  the relevant system and the relevant effect without appealing to history? Anticipate
  the likely reply that the choice is relative to explanatory interests or a designated
  capacity, and follow up by asking whether that makes function claims interest-relative
  in a way that undermines their use in biology.


  2. A question about malfunction and normativity. Causal-role accounts seem to say
  a broken heart has no function, or has a function only in an idealized or type-relative
  sense, whereas etiological accounts can say it has a function it is failing to perform.
  Press the guest on what grounds the difference between a malfunction and a mere
  absence of effect. Follow up on whether the account can explain why we should care
  about restoring the function, or whether it reduces function talk to description.


  3. A question about exaptation and the distinction between selection of and selection
  for a trait. Use a familiar case such as feathers or a swim bladder derivative.
  If a trait was selected for one effect and now reliably produces another, does the
  causal-role account call the new effect a function immediately? Does the etiological
  account need a further episode of selection, and if so, how long or how reliable
  must it be? Follow up on whether the guest''s answer makes function attributions
  hostage to future evolutionary events.


  4. A question about recent evolutionary novelty, where a trait has a clear causal
  role but little or no selection history—for instance, a de novo gene in a lineage,
  a trait maintained only by drift, or a structure produced by developmental plasticity.
  Ask what each account says about whether it has a function. Follow up on whether
  the etiological account can avoid saying that a perfectly functional novelty is
  functionless until selection catches up, and whether the causal-role account can
  avoid saying that a selectively neutral byproduct has a function.


  5. A question about functions in ecology and ecosystem biology, where the bearer
  of the function is a population or species rather than a trait—for example, a keystone
  predator or an ecosystem engineer. Selection may act on individuals, not on the
  ecosystem-level role. Ask whether either account can make sense of ecosystem function
  without illicitly treating ecosystems as units of selection. Follow up on whether
  the guest would accept a pluralist or pragmatic account that allows different senses
  of function in different biological subfields.


  6. A question that turns the tables: what would the guest say to a molecular biologist
  who uses function talk constantly—for example, about the function of a regulatory
  sequence, a noncoding RNA, or a protein domain—but who has no evolutionary history
  in mind and often means only a causal role in a current cellular process? Follow
  up on whether the guest thinks this is a merely verbal dispute or a substantive
  disagreement about what biology ought to mean by function.


  Then, after the questions, please add a short note on which one or two questions
  are most likely to expose an unstable commitment in the guest''s position, and why.
  Do not include citations, reading lists, or references to specific papers; I want
  the questions to stand on their own. Please write in a polished, seminar-ready style.


