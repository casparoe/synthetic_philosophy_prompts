  For thirty-five years I worked as a physical chemist, and since retiring I have
  been reading moral philosophy in a more or less systematic way. I have lately been
  bothered by a difficulty that consequentialists seem to have created for themselves,
  and which I have seen given the name cluelessness. As I understand it, the difficulty
  is not the ordinary uncertainty of a wager, where one can assign probabilities to
  a fixed menu of outcomes; it is that the consequences of even a small act propagate
  without limit — through second- and third-order effects, through the expectations
  of everyone who learns of the act, through the simple fact that the world''s later
  history is now a different branch — and that we have no way to enumerate those consequences,
  let alone weigh them. The expected-value calculation that the consequentialist would
  like to run cannot even be set up. Some writers treat this as an amusing footnote;
  others, as I read them, treat it as the end of the whole enterprise. I notice that
  my own training gives me a certain sympathy for the second reaction, since I spent
  my career on problems that were well posed and still intractable, and this one does
  not appear to be well posed at all.


