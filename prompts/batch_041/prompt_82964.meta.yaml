  The rich audit points:

  1. Insurance prices risk ex ante; the welfare state doesn''t (flat contributions,
  no risk rating). If it did, the "undeserving" would be the high-risk, and they''d
  be charged more, not excluded.

  2. Insurance pays out on the occurrence of the insured contingency irrespective
  of moral desert; the payout isn''t a reward. So the analogy, taken seriously, actually
  *undercuts* the desert claim — insurers don''t ask whether you deserved the fire.

  3. Insurance is for the risk you cannot self-insure; the whole point is that the
  unlucky receive more than they paid. So "getting out only what you paid in" is precisely
  not insurance — that''s a savings account, or a bond.

  4. Verification vs. moral evaluation: insurers verify the contingency, not the worthiness.
  Conditionality regimes slide from verification to moral evaluation.

  5. Adverse selection and the risk pool: the strength of insurance is that the good
  risks subsidise the bad; excluding the "undeserving" shrinks and worsens the pool.

  6. The contract model requires an enforcer and determinate terms; the "contributions"
  are a tax, the "fund" is notional, so the contract is fictional; yet the rhetoric
  does real work.

  7. Mutuals: owned by members, democratic, surpluses returned; the welfare state
  as a mutual would imply members'' control, not ministerial discretion.

  8. The disanalogy that matters: insurance is *actuarial* fairness (proportional
  to risk), welfare is *need*-based; the analogy imports actuarial fairness to license
  desert judgments, but the target''s own logic is need.

  9. What survives: maybe the "you can''t claim if you''re not a member / haven''t
  paid in" residency/contribution conditions, and the idea that a scheme needs boundaries
  and rules against free-riding. So a weaker conclusion survives: some conditions
  are legitimate, but the desert/undeserving framing doesn''t follow.


