  "I am a retired experimental physicist who has spent the last several years trying
  to teach myself philosophy, and I have become rather gripped by a dispute that seems
  to me to sit at the junction of probability, decision theory and the metaphysics
  of rationality. The dispute concerns what is sometimes called geometric rationality:
  the idea that in any repeated, multiplicative setting — a sequence of bets, an investment
  portfolio, a career, a life — the rational policy is not to maximise expected wealth
  or expected utility in the ordinary additive sense, but to maximise the expected
  logarithm of wealth, or equivalently the long-run geometric growth rate. The Kelly
  criterion is the best-known expression of this idea, and its defenders sometimes
  make a much stronger claim than that it is a useful heuristic: they suggest that
  expected-value reasoning is, in such settings, not merely imprudent but incoherent,
  because it follows an ensemble average that almost no individual trajectory will
  realise, whereas the log rule tracks what happens to a single agent over time. I
  want you to write an essay on this controversy, weighing the case for treating geometric
  rationality as a requirement of reason against the case for treating it as one utility
  function among many — a defensible preference about risk, perhaps, but not a dictate
  of rationality as such. Please reach a definite conclusion and justify it, rather
  than ending in a survey of positions."


