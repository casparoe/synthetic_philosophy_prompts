  (4) says introspective representations are answerable to accuracy conditions fixed
  by the mechanisms producing them. If the introspective mechanism''s job is to track
  inner states for the purposes of self-monitoring and control, then its representations
  may be perfectly accurate at the level of grain at which they function — and the
  claim that they misrepresent us as having phenomenal properties depends on a theory
  of their content according to which they purport to describe inner furniture. But
  that theory of content is exactly what''s at issue; if the content is fixed by the
  mechanism''s function, the mechanism was not selected to inventory intrinsic properties,
  so it cannot be misrepresenting them. So (4)''s naturalistic account of content
  threatens to make the illusion unstatable — you need a non-naturalistic or "purport"
  notion of content to get the illusion going. That''s a genuine, in-the-weeds tension.
