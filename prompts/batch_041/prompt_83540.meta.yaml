  Draft:


  I am preparing a statement of position for circulation ahead of a seminar on the
  science of consciousness, and I would like a coherence audit before I commit to
  it. The position is illusionism about phenomenal consciousness, and I take it to
  consist of the following claims:


  (1) There are no phenomenal properties: nothing in the world answers to the description
  "an intrinsic, subjectively felt quality that cannot be captured functionally or
  representationally." Talk of qualia, of "what it is like," and of phenomenal character
  picks out no features of reality.


  (2) Illusionism is not eliminativism about experience. Pains, after-images, and
  the taste of coffee are real and can be talked about in perfectly good conscience;
  what is rejected is a theoretical gloss on them, not the phenomena. Illusionism
  is a claim about the content of a certain kind of mental representation, not a claim
  that nothing is felt.


  (3) The illusion in question is introspective and metarepresentational. We are not
  misled by the senses, as in a hallucination; we are misled by our own self-representation,
  which presents our mental states as having phenomenal properties that they do not
  have. The best analogy is a user interface: a simplified, action-guiding display
  that no one is meant to read as an inventory of the machinery beneath it.


  (4) Introspective representations are answerable to accuracy conditions like any
  others, and those conditions are fixed by the mechanisms that produce them. We can
  therefore identify the illusion from the inside, without any standpoint outside
  our cognitive economy, by asking what the introspective system is in the business
  of representing and whether anything answers to it.


  (5) The explanatory target is therefore the meta-problem: why do we think, and say,
  that we have phenomenal properties? A successful theory must account for the reports
  without positing the properties reported. The reports are data; the properties are
  not.


  (6) The illusion is contingent on our representational architecture. Creatures with
  a different introspective design might represent their states without any phenomenal
  gloss, and there is no principled barrier to our own descendants being in that position.


