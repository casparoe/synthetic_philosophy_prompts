  " I am a third-year philosophy student currently enrolled in a seminar on the ethics
  of emerging technologies, and I have been asked to serve as best man at the wedding
  of two close friends, both of whom are committed to what they call the hedonistic
  imperative—roughly, the view that we have a serious moral obligation to use biotechnology
  and other means to eliminate suffering throughout the living world, not merely to
  manage or redistribute it. The wedding is in three weeks, and I have five minutes
  at the reception. The guest list is split: about half are graduate students and
  researchers in philosophy, effective altruism, and neuroethics, who will know the
  position and its internal debates; the other half are the couple''s families, including
  a Catholic grandmother, a stepfather who thinks transhumanism is a cult, and several
  cousins who just want a warm, funny toast. I need a speech that is genuinely moving
  and appropriately light in places, but that does not treat the couple''s deepest
  commitment as a quirky hobby. More specifically, the hedonistic imperative does
  real structural work here: because they regard suffering as something to be abolished
  rather than ennobled, I cannot rely on the usual wedding consolation that ''love
  is worth the pain'' or that hard times will make them stronger, and I do not want
  to imply that their marriage is valuable because it will involve sacrifice. I want
  the speech to articulate a vision of love as a joint project of reducing suffering—perhaps
  even as a small-scale instance of the larger project they believe in—without turning
  the reception into a lecture. To give you something concrete to build around: they
  have a private, semi-serious practice they call the ''no-net-suffering ledger,''
  a notebook in which each of them records moments when they think they have added
  to or subtracted from the other''s suffering, and they review it on their anniversary.
  It began as a joke after a bad argument about whose turn it was to do the dishes,
  but they have kept it up for four years. I would like the speech to use that ledger,
  and the idea of a life devoted to the abolition of suffering, as its spine—not as
  a punchline, though a few jokes are welcome."


