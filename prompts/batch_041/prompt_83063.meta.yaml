  Domain: Archives and power. Type: teaching plan.


  Prompt:


  "You are an experienced teacher of archival theory and history, and I need help
  preparing a single 75-minute seminar for first-year MA students in a public-history
  program. The students are bright but have never worked with primary sources; they
  arrive with the idea that archives are neutral warehouses of facts and that history
  is simply what the documents say happened. I want to teach them the concept of archival
  power: that what gets recorded, by whom, under what categories, and for what institutional
  purpose shapes what can later be known, and that the silences in the record are
  not mere gaps but are often produced by the same acts of recording that created
  the documents. Please do not explain the concept to me; plan how I should teach
  it. Give me the order in which the ideas must be introduced and why each depends
  on the one before it, the single concrete case or document that should carry the
  whole session and what it must have and lack to do that work, the misconceptions
  the students will predictably bring or form—for example, that silence means the
  event did not happen, or that power is only censorship—and exactly where in the
  sequence I should head each one off, plus one question or short exercise I can use
  at the end to see whether they have understood the concept rather than merely memorized
  a slogan. Also tell me what I should deliberately leave out at this level and say
  so to the students."


