  A should equal one''s expectation of one''s future credence in A, conditional on
  the future credence being p. A common confusion: thinking Reflection requires deference
  to any future credence, or that it justifies epistemic deference generally, or confusing
  it with the "principle of total evidence" or with the fact that it fails in cases
  of anticipated forgetting/self-doubt. Also the confusion: Reflection requires the
  agent to defer to her future self even when she knows her future self will be irrational
  or will have taken a mind-altering drug — the "Adam and Eve" / "sleeping beauty"
  cases. Van Fraassen himself noted violations with memory loss. Also "the Reflection
  principle is about conditional credences, so it''s trivially true" — no, it''s not
  a theorem of probability, it''s a constraint.


