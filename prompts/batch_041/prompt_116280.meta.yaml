  The false presupposition: that Hobbes''s "geometrical method" = axiomatic deduction
  from self-evident axioms, and that the relevant difference is the obviousness of
  axioms. The correction: Hobbes''s model of science (scientia) is causal/constructive
  — knowledge of causes; we have science of things whose causes are in our power (geometry:
  we construct the figures; politics: we make the commonwealth by covenant/authorization),
  whereas natural philosophy is not demonstrable in the same way because God made
  nature. So the "axioms vs. contentious premises" framing misses his point; also,
  the criticism that Leviathan is circular is standard (the social contract presupposes
  the parties who then create the sovereign — the "state of nature" already contains
  proto-social, rational, language-using agents), and that critique is distinct. Also
  Hobbes didn''t think Euclid''s axioms were "obvious" — he thought definitions were
  the source of demonstrability: for Hobbes, science proceeds from definitions/settled
  names, not self-evident truths; that''s why he thought his definitions were fine
  and why he could claim his results were as certain as geometry. Also his disputes
  with Wallis were partly about method and partly political.


