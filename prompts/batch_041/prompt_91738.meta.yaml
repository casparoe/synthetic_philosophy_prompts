  century, and I want to understand why it never resolves rather than to take a side.
  On one side, the methodological individualists hold that any acceptable social explanation
  must ultimately be stated in terms of the beliefs, dispositions and actions of identifiable
  individuals, and that talk of ''society'', ''structures'' or ''institutions'' doing
  things on their own is at best shorthand and at worst a category mistake. On the
  other, the holists hold that social facts are sui generis, that collective properties
  (norms, institutions, market prices, class positions) have causal powers irreducible
  to any individual''s states, and that demanding individual-level microfoundations
  either distorts the phenomena or is simply a different project. What I find striking
  is that both sides now routinely grant something like a supervenience claim — no
  difference in social facts without some difference in individual facts — and yet
  the argument continues as though nothing had been conceded.


  My working hypothesis is that this is the multiple-realisability dispute from the
  philosophy of mind wearing sociological clothes: the individualist is a type-identity
  theorist who thinks the only genuine causal relata are individual states, the holist
  is a non-reductive physicalist who thinks higher-level kinds are real because they
  are multiply realised and support their own generalisations, and the apparent stalemate
  is the same stalemate. Tell me whether that diagnosis is right, or whether it papers
  over something the two debates do not share.


  More specifically: is the residual disagreement (a) a verbal one about the word
