  \ Hart–Devlin.\n\nLet me think about which combination works best and injects some\
  \ new/niche idea so models can't regurgitate.\n\nType: construct a thought experiment\
  \ to specifications. The example prompts have: scenario engineered so specified\
  \ theories deliver specified verdicts, constraints, then demonstration.\n\nDomain:\
  \ doing vs. allowing, killing vs. letting die.\n\nIdea: construct a case where the\
  \ doing/allowing distinction and the killing/letting-die distinction come apart\
  \ — i.e., a case that is doing (action) but not killing, and a case that is killing\
  \ but not doing. That's a nice in-the-weeds specification: the two distinctions\
  \ are usually treated as interchangeable, but they can dissociate. The classic dissociation:\
  \ withdrawing life support (letting die but arguably an act), or \"killing\" via\
  \ a nurse who omits a dose (omission causing death = letting die but is it killing?).\
  \ Actually there's literature: Jonathan Bennett's \"Whatever the Consequences\"\
  , Rachels' \"Active and Passive Euthanasia\" — those are well-trodden.\n\nTo be\
  \ \"in the weeds\" and not regurgitatable, I should inject a niche/new idea. Options:\n\
  - The distinction between \"doing and allowing\" and \"killing and letting die\"\
  \ — in the literature, there's work arguing they come apart: e.g., Philippa Foot's\
  \ \"killing vs. letting die\" and \"doing vs. allowing\" — she distinguishes \"\
  positive\" vs \"negative\" duties. Actually Foot's \"Euthanasia\" (1977) distinguishes\
  \ killing/letting die from doing/allowing. And there's the \"Kamm\" work on the\
  \ distinction. Also \"Woollard\" — Fiona Woollard's \"Doing and Allowing Harm\"\
  \ (2015). Also there's the notion of \"the doing/allowing distinction vs. the causing/omission\
  \ distinction.\"\n\nThe trick: the asker wants a case where the two distinctions\
  \ dissociate in both directions:\n1. A case of doing (positive action, in the ordinary\
  \ causal sense) that is not killing — hmm.\n2. A case of letting die that is also\
  \ killing.\n\nBetter framing: Construct two paired cases (same outcome, same intentions)\
  \ where the doing/allowing distinction and the killing/letting-die distinction give\
  \ opposite verdicts — i.e., the pair is \"doing but not killing\" vs \"letting die\
  \ but killing.\" Actually let me think of a cleaner specification.\n\nActually a\
  \ well-known tricky one: a doctor who turns off a ventilator — is that doing or\
  \ allowing? Another: the \"ducking\" cases (Bennett): I push you out of the way\
  \ of a falling rock, you fall into a pit and die — doing, but do I kill you?\n\n\
  Alternatively, I could specify the \"killing/letting die\" vs \"doing/allowing\"\
  \ as two independent 2x2 grid and ask for a case filling the off-diagonal cells.\n\
  \nLet me design the prompt spec:\n\n\"Construct a single scenario (realistic, e.g.,\
  \ a hospital or a rescue situation, one paragraph) that simultaneously exhibits:\n\
  (a) an agent who merely allows harm but who is plausibly described as having killed\
  \ the victim, and\n(b) an agent who positively acts on the victim but who is not\
  \ plausibly described as having killed the victim.\n...\"\n\nHmm, that might be\
  \ hard but doable: \n- (b) doing but not killing: a surgeon who, during a legitimate\
  \ operation, performs a maneuver that foreseeably hastens the patient's death...\
  \ hmm that's killing. Better: someone who moves a person's body (a positive act)\
  \ and thereby the person dies of a pre-existing condition — is that killing? E.g.,\
  \ lifting a person out of the way and the person dies of a heart attack. Or Bennett's\
  \ \"shaking a drowning man off your back.\"\n- (a) letting die but killing: a parent\
  \ who omits to feed a child — legally and morally often \"killing\" (in some jurisdictions\
  \ omission can be murder where duty exists). Or switching off a ventilator — many\
  \ describe as \"letting die\" but if there's a duty to continue...\n\nAlternatively\
  \ the classic dissociation: \"The distinction between doing/allowing and killing/letting-die\
  \ come apart in the case of a doctor who turns off a ventilator: he does something\
  \ (turns off) but only lets die; whereas a mother who doesn't feed her baby merely\
  \ omits but kills.\" Hmm, actually the mother who doesn't feed the baby: omission\
  \ (allowing?) but killing. And the doctor turning off the ventilator: action but\
  \ letting die.\n\nYes! This is exactly a known pair: In the literature (I believe\
  \ Jonathan Glover or others), the case of the mother who starves her baby by omission\
  \ is an \"omission that is a killing\", whereas the doctor who switches off a ventilator\
  \ does something but is said to \"let die.\" So they dissociate.\n\nSo I can ask\
  \ the model to construct a scenario, or a pair of scenarios, that isolates the doing/allowing\
  \ axis from the killing/letting-die axis, filling the off-diagonal, with constraints:\
  \ realistic, single paragraph, no trolleys, no sci-fi, and — importantly — the off-diagonal\
