  Draft:


  I have recently begun acting with a small amateur company, and a friend who works
  on the eighteenth century has taken to pressing Rousseau''s attack on the theatre
  on me — the long letter Rousseau wrote when Voltaire was agitating for a playhouse
  in Geneva. Most of it I can dismiss as the grumbling of a man who had himself written
  plays, but there is one argument in it I cannot shake, and I have set it out below
  in a form sharper than Rousseau''s own. My difficulty is that it appears to prove
  far too much.


  (1) What moves us in a play are sentiments aroused in us as spectators: pity, admiration,
  indignation, directed at characters and situations that are not ours and that make
  no claim on us.

  (2) Those sentiments are pleasant, and their pleasure is complete in the moment
  of feeling them.

  (3) A pleasure that is complete in the moment of feeling leaves behind no motive
  to act once the moment has passed.

  (4) A theatre prospers only by pleasing its audience, and what pleases an audience
  is what confirms it in the dispositions it already has.

  (5) So the theatre gives us the pleasures of virtue without its practice, and confirms
  us in our existing character instead of correcting it.

  (6) Whatever confers the pleasures of virtue without its practice, and confirms
  rather than corrects the character of those who use it, corrupts them.

  (7) Therefore the theatre corrupts those who attend it.


  Premises (1) to (4) seem to me true as stated, and that is precisely the trouble,
  since they are equally true of the novel, of the concert, of devotional music, of
  painting, and of moral philosophy — of Rousseau''s own Confessions and of his own
  novel, and indeed of the letter in which the argument is made. Premise (6), applied
  without restriction, condemns all of them; and Rousseau''s remedy, the civic festival
  in which the citizens assemble and dance together in the open air, is itself an
  occasion of collective feeling that ends when the evening ends. If the argument
  is sound, everything that moves us is corrupting, which cannot be right. But I cannot
  see which step to surrender without surrendering the conclusion, and I would rather
  keep the conclusion, because I do think there is something about the stage in particular
  — the actor who is paid to counterfeit feeling he does not have, the audience seated
  in the dark and passive, the whole enterprise dependent on pleasing the largest
  paying crowd — that distinguishes it from a novel read alone by the fire.


  So I should like you to tell me which step I must give up, and what giving it up
  costs. If the argument can be saved by narrowing it rather than abandoning it, say
  exactly what the distinguishing feature of the theatre is, why it is not shared
  by the novel or the festival, and whether it survives the obvious counterexamples.
  If it cannot be saved, tell me what I am obliged to accept instead. Please write
  your answer in American English.


