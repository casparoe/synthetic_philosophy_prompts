  Rousseau''s argument in the Letter to M. d''Alembert on the Theatre:

  - The theatre is a school of vice, not virtue.

  - It makes virtue attractive but only as an object of admiration, not emulation.

  - The emotional response is disproportionate and fleeting; we leave the theatre
  as we entered.

