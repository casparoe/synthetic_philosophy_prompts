  ---


  Write an essay on the limits of the principle of procreative beneficence.


  The principle, as it is usually stated, tells prospective parents that when they
  have decided to have a child, they should select, from among the children they could
  have, the one whose life is expected to go best — where "best" is understood as
  the greatest expected well-being, not the best life for anyone in particular. Defenders
  treat it as a modest extension of ordinary parental concern; critics treat it as
  either empty (no one knows how to rank possible lives) or monstrous (it licenses
  a eugenic disposition towards children and expresses the wrong attitude towards
  those who are born with impairments).


  Now consider what happens when the principle is applied to a setting in which the
  menu of possible children is not fixed in advance. Suppose the parents can also
  decide how many children to have; can keep creating embryos and choose among a larger
  pool; can postpone conception in the hope of a better candidate; and must accept
  that the family structure they choose — how many siblings the selected child will
  have, and how the parents'' attention will be divided — itself affects how well
  that child''s life is expected to go. Call this unbounded beneficence.


  Under these conditions, does the principle still tell parents what to do? Three
  worries are worth testing: (i) that it generates a maximising logic with no natural
  stopping point, since there is always a further draw to wait for and a further comparison
  to make; (ii) that once family size is itself selectable it begins to reproduce
  the population-ethics problem of preferring a larger number of lives that are barely
  worth living to a smaller number of flourishing ones; and (iii) that the only way
  to stop the regress is to build in a threshold or a side-constraint, which changes
  the principle rather than applying it.


  Weigh these against the best replies available to a defender — for instance, that
  the principle is comparative only within a fixed set of alternatives, that the costs
  of waiting and of further selection are themselves part of the calculation, and
  that a principle may be demanding without being false. Reach a verdict: either the
  principle should be retained in its unrestricted form, or it should be restricted
  in some specific way (state the restriction), or it should be abandoned. Defend
  whichever verdict you choose against the strongest objection to it.


