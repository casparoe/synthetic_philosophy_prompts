  Question (worth 10 points):


  Hofstadter asks, about his careenium, who pushes whom around. Set out the setup
  -- the tiny marbles careening around a frictionless surface, the stable clumps they
  form -- and then answer: do the clumps push the marbles, or do the marbles push
  the clumps? What does Hofstadter think hangs on the answer? Finally, say what the
  analogy is supposed to tell us about whether our talk of beliefs, desires, and concepts
  picks out anything causally efficacious, or whether it''s just a convenient shorthand
  for what the neurons are doing.


  Student''s answer:


  The careenium is a frictionless billiard table covered in a huge number of tiny
  magnetic marbles that bounce off each other and off the walls. Because the marbles
  are magnetic, they stick together in groups, and these groups are stable enough
  and repeat often enough that we can give them names. Hofstadter calls the marbles
  sims and the groups simmballs. The walls of the careenium are sensitive to goings-on
  outside, so information from the environment gets into the marble activity, and
  the simmball patterns end up mirroring features of the outside world. In the extended
  version, the simmballs can also drive things outside the careenium, so the whole
  thing looks like it''s perceiving and acting.


  So who pushes whom? Hofstadter''s answer is that, strictly speaking, only the marbles
  do any pushing. The simmballs are real in the sense that they''re not arbitrary
  -- there''s a fact of the matter about which clumps form and which don''t -- but
  they don''t exert any force of their own. Every event at the simmball level is exhausted
  by the marble-level events that realize it, so there''s no room left for the simmballs
  to make a difference. This is basically the exclusion argument: if the physical
  level is causally complete, the higher level gets squeezed out. Hofstadter accepts
  that, and he thinks it''s fine, because we can still use simmball talk to describe
  and predict the system even if it isn''t doing any causal work. This is why he says
  the self is a kind of illusion -- the "I" is a simmball-level pattern with no causal
  power of its own.


  Hofstadter got this analogy from Dennett''s work on the intentional stance, and
  the point is that mentalistic descriptions are useful but not literally true. Where
  Hofstadter goes further than Dennett is in adding the strange loop: the system eventually
  forms a simmball that represents the whole careenium to itself, and that self-representation
  is what we call consciousness. So the upshot is that beliefs and desires are like
  simmballs -- they''re patterns we can track, but the real causal story is always
  at the marble level.


  ---


  Now, what''s wrong with this answer? Let''s list the errors:


  1. Epiphenomenalism attribution: The student says Hofstadter''s answer is "only
  the marbles do any pushing" and that simmballs have no causal power. That''s wrong.
  Hofstadter''s point is that the question is level-relative: the simmballs do push
  each other around, and the marble-level description doesn''t exclude or compete
  with the simmball-level description, because they''re not two causal channels. He
  explicitly wants to resist the idea that higher-level talk is a mere shorthand.
  So this is a substantive misreading.


  2. Exclusion argument: The student says Hofstadter "accepts" the exclusion argument.
  That''s a misattribution — Hofstadter doesn''t frame it in Kim''s terms, and his
