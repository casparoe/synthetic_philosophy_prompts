  Question (10 points):


  "Hofstadter''s careenium: a frictionless surface with a vast number of tiny marbles
  (sims) careening around; the sims stick to one another in transient clumps (simmballs);
  the walls can be wired up to the outside world; in the extended version the simmballs
  can drive events outside. Hofstadter asks who pushes whom around inside the careenium,
  and his answer, as we discussed, has two parts: (1) the simmball level is not a
  mere shorthand for the sim level -- when we explain what the system perceives, wants,
  and does, it is simmballs that are doing the pushing; (2) this does not commit him
  to positing a second kind of causation running alongside the sim-level dynamics.
  Explain the setup, explain what work part (1) is doing, and explain how (2) is supposed
  to be consistent with (1)."


  Student''s answer:


  The careenium is a frictionless billiard table with an enormous number of tiny magnetic
  marbles on it. The marbles -- Hofstadter calls them sims -- bounce off one another
  and off the walls, and because they''re magnetic they clump together into groups
  of varying size and stability. The groups that recur reliably are the simmballs.
  Because the walls can be made sensitive to what''s happening outside the careenium,
  information from the environment gets into the marble dynamics, and the simmball
  patterns end up tracking features of the world. In the extended version, simmballs
  can also drive things outside the careenium, so the whole setup looks like it perceives
  and acts.


  Part (1): Hofstadter''s point is that you can''t explain the system''s behaviour
  purely in terms of individual marbles. If you want to know why the careenium turned
  left, the answer is going to be something like "because it wanted the food" -- and
  that''s a simmball-level fact, not a sim-level fact. Sim-level descriptions are
  true, but they''re the wrong grain for explaining behaviour. So simmball talk isn''t
  a convenience; it''s the level at which the system''s behaviour is actually intelligible.


  Part (2): Hofstadter''s way of making this consistent is to say that the simmball
  level is a genuine additional causal level. If simmballs really push sims around,
  then there must be causal influence from the higher level down to the lower one,
