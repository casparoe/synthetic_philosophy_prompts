  I''m a third-year philosophy student in a course on moral responsibility, and for
  our peer-assessment unit I have to grade another student''s answer to the following
  take-home question. The question is based on a distinction from our course handout,
  so please treat the handout''s framework as the relevant standard rather than importing
  a different taxonomy.


  Question: In the handout, we separated three questions about an episode of blame:
  (1) Is the blame warranted or fitting, in the sense that the target really did the
  wrong-making thing and the blame accurately represents it? (2) Does the blamer have
  standing to blame, in the sense that the blamer is not disqualified by, for example,
  hypocrisy or complicity? (3) Is the target liable to blame, in the sense that it
  is fair to hold the target to the relevant demand? Consider Maya, who has repeatedly
  lied to her partner Sam about where she spends money. Sam has also lied to Maya
  about money in the past and has never acknowledged it. Maya now blames Sam for lying.
  Using the three questions, assess Maya''s blame. Then consider the further claim
  that even if Maya lacks standing, her criticism may still have force as a moral
  observation.


  Student''s answer:

  Maya''s blame is clearly warranted in one sense: Sam did lie, and lying to a partner
  about shared finances is a genuine wrong. So the content of Maya''s accusation is
  accurate. But the question is whether Maya can be the one to make it. Because Maya
  has done the same thing, she is a hypocrite, and hypocrisy removes standing. The
  standard same-fault condition means that a blamer lacks standing only when she is
  guilty of the very same fault she is blaming. Here Maya and Sam both lied about
  money, so the condition is met. Therefore Maya''s blame is not warranted. Some people
  say that Maya could still make a moral observation, but if she lacks standing then
  her criticism has no normative force at all; it is just an attempt to deflect from
  her own behavior. This is why tu quoque is a legitimate form of objection: it shows
  that the accuser is in no position to accuse. The only way Maya could regain standing
  would be to apologize, and even then Sam would not be liable to blame, because liability
  is simply a function of whether the blamer has standing. If Sam had lied about something
  completely unrelated to money, by contrast, Maya would have standing, since the
  same-fault condition would not be satisfied.


  Please grade this answer, e.g., out of 20 or as a letter grade, and give me the
  specific comments that justify the grade. I want a point-by-point assessment rather
  than a general impression: identify what the answer gets right, what it gets wrong
  or oversimplifies, and how much each problem should affect the mark. Finally, tell
  me what would change your mind about the grade—which argument or consideration would
  lead you to a different verdict—and where your grading is most likely to be mistaken.


