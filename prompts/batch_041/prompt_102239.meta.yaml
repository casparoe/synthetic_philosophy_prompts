  second, exit; but you don''t) — actually at each node, if you''re at the first,
  continuing is better; if at the second, exiting is better. Since you don''t know
  which, the question is what to do. The point: the decision at the two nodes is the
  same decision problem from the agent''s perspective, so you must treat them as one
  choice, which yields the mixed policy. So it''s about imperfect recall and the "same
  information state" — the agent at the first and second intersection are in the same
  information state (same memories), so they must choose the same action. This is
  the key: if the agent must choose the same action at both nodes (since they''re
  indistinguishable to him), then the best fixed action is a mixed one. And a deterministic
  policy of "exit" gives 0 at the first node, and "continue" gives 1. So mixed is
  best.


