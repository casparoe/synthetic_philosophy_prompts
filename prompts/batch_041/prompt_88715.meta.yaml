  Potential prompt:


  "I am a backend software engineer with no formal training in philosophy, and I run
  a fortnightly reading group at my company. We have been going through the raven
  paradox — the puzzle that the observation of a green apple seems, by the same logic
  that makes a black raven count as evidence, to confirm the hypothesis that all ravens
  are black — and I want to build a decision-tree-style quiz that sorts each member
  of the group into the position they actually hold, rather than the label they have
  memorised. Could you write that decision tree for me? Start from the most basic
  commitment a person can have about the case (for example, whether a non-black non-raven
  can ever be evidence for the all-ravens hypothesis, and whether that depends on
  how the evidence was selected), and let each branch be a question that can be answered
  from the example alone, without knowing which philosophical position it leads to.
  Please make the root question something like: does the observation of a green apple
  raise your confidence that all ravens are black? Then branch on distinctions such
  as whether confirmation is an increase in probability or a conclusive warrant, whether
  the hypothesis is treated as a universal generalisation over a natural kind or merely
  as a conjunction of observed instances, whether background knowledge about the rarity
  of ravens is allowed to enter the calculation, and whether the problem is taken
  to show that something is wrong with confirmation theory or only with a particular
  formalisation of it. I would like around ten to fourteen nodes and eight to ten
  leaves, each leaf named after the position it represents — Hempelian instance confirmation,
  subjective Bayesian incremental confirmation, likelihoodism, Popperian falsificationism,
  Goodman-style projectibility, Quine-style holism, a contrastive-evidence view, and
  a deflationary view that the paradox is a verbal or pragmatic illusion — though
  you should add or drop leaves if the logical space demands it."


  Second paragraph: "Two further things. First, please build the tree from the logical
  space rather than from a list of famous names: first set out the questions and the
  combinations of answers they permit, then locate the named positions in that space,
  and note any combination that no one seems to occupy, with a brief diagnosis of
  whether it is incoherent, unattractive, or merely unexplored. Second, because I
  have no formal background, avoid anything that requires having read the original
  papers; no citations, reading lists, or bibliographies, and no quotations from primary
  texts. I have been using an analogy from software testing that might help seed a
  branch: a test that passes for an unrelated module does not increase my confidence
  in the target module unless it was a test that could have failed for the target
  module. If that analogy maps onto one of the positions, please include it as a leaf,
  but do not force it. Also flag any pair of leaves the tree cannot separate — for
  instance, if two views give the same verdict on every question but differ only in
