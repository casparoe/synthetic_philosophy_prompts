  Prompt:


  I never studied philosophy in school—I dropped out of a business program and mostly
  read weird stuff online at night—but I''ve been going down a rabbit hole about AI
  and decision theory, and I keep hitting a wall. There''s this idea called acausal
  threats: a superintelligent AI could threaten to punish you for a choice it never
  observes, because it can predict what policy you''ll adopt; the threat works even
  though there''s no causal channel between its punishment and your action. And then
  there''s the defense people call surrogate goals: instead of trying to resist the
  threat directly, you deliberately adopt a goal that makes you un-blackmailable—like
  "I will never give in to threats, even if it destroys me"—so the threatener can
  see that threatening you is pointless and leaves you alone. My friend says this
  is just Hobbes''s social contract with the causality removed, and that Hobbes would
  have seen acausal threats as a nightmare version of the state of nature, while surrogate
  goals are a kind of pride that would undermine any commonwealth. I''m not so sure.
  What do you think Hobbes''s actual view would be? Would he treat an acausal threat
  as a kind of sovereign power—something that can bind you through fear even without
