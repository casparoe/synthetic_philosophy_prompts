  at both — a deterministic policy that does the same thing at both intersections
  yields either 0 (exit both) or 1 (continue both). So the best deterministic policy
  is exit-both giving 0, but randomized policies can do better: randomize with p=1/3?
  Actually the mixed strategy: continue with probability 1/3 gives expected... Let''s
  compute: policy: at each intersection, continue with prob p, exit with prob 1-p.
  If exit at first: payoff 0 with prob (1-p). Continue first (p), then at second exit
  with (1-p): payoff 4, prob p(1-p). Continue both: payoff 1, prob p². Expected =
  4p(1-p) + p² = 4p -3p². Maximize: 4-6p=0 → p=2/3, giving 4(2/3) - 3(4/9) = 8/3 -
