  Classic absent-minded driver (Piccione–Rubinstein): two intersections A (first)
  and B (second). Payoffs: exit at A → 0; continue at A then exit at B → 4; continue
  at both → 1 (or death). Driver has no memory at B of whether they''ve passed A.
  Since at both intersections the driver''s information state is identical, any deterministic
  policy prescribes the same action at both; so achievable payoffs are 0 (exit,exit)
  or 1 (continue,continue). But a mixed behavior strategy "continue with probability
  p" gives 4p(1−p)+p² maximized at p=2/3 with value 4/3. So the optimal policy is
  mixed and yields 4/3, beating both deterministic outcomes. The "paradox": at each
  intersection, the driver knows that whatever they do doesn''t change which intersection
  they''re at; and ex ante the mixed policy is optimal; yet at the moment of choice,
  it seems the driver should just maximize given their beliefs. The tension is between
  the ex ante and the "act" perspective; also evidential vs causal decision theory.


