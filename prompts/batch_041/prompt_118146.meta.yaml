  ass case is often said to show something about the will; but in decision theory,
  "choice without preference" is not a problem at all — if two options are exactly
  equal, any choice maximizes utility, so there''s no paradox; the paradox only arises
  if you add an extra premise that choosing requires a reason that makes the option
  better. So the comparison: the ass''s dilemma presupposes "no choice without a preferential
  reason" (a form of the principle of sufficient reason applied to action), whereas
  standard decision theory treats the tie as benign (any option is permissible, and
  a rational agent can just pick). Then the interesting bit: is the paradox dissolved
  or relocated? And there''s the "randomization" resolution: pick by coin flip — but
  is that a rational way to decide? And "the problem of Buridan''s ass for the freedom
  of indifference": if the will can choose without a sufficient reason, then it can
  choose evil for no reason (the "liberty of indifference" worry, as in the debate
  over whether one can be indifferent between God and a finite good).


