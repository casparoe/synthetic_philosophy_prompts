  Final draft:


  "I have been trying to get Skolem''s paradox straight, and the usual resolutions
  strike me as too quick. As I understand the downward Löwenheim–Skolem theorem, the
  countable elementary submodel is built by closing a countable set under Skolem functions,
  so that whenever an existential statement holds in the submodel, a witness already
  lies inside it. Take such a submodel M and let A be a set that M regards as uncountable.
  In the ambient universe there is a bijection from A onto ω, so the statement that
  such a bijection exists ought to have a witness in M; yet M satisfies the claim
  that A is uncountable. One of these has to give: either the Skolem hull is not genuinely
  elementary, or Cantor''s theorem holds only relative to a model and there are no
  absolutely uncountable sets. Which is it — and if the second, does set theory have
  any determinate subject matter at all?"


  Good. Maybe "regards as uncountable" fine. Should I mention "ω" — yes fine.


  Hmm, one concern: does the prompt contain a false presupposition that is "subtle"?
  Yes: that closure under Skolem functions yields witnesses for existential truths
  of the ambient universe; and that the tension forces a choice between two bad options.
  The correct answer: neither; the bijection isn''t a member of M and the existential
  is false in M, so no witness is owed; elementarity is intact; Cantor''s theorem
  is a theorem of ZFC holding in every model; what''s non-absolute is the metatheoretic
  notion "countable", because M omits the witnessing functions. And the last question
  about determinate subject matter is the Skolemite/relativist worry, a live philosophical
  position rather than a consequence of the paradox.


