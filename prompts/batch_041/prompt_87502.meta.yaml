  Let''s think of a good philosophical structure. The etiological account: function
  of a trait = the effect for which it was selected (or that explains its presence
  via selection). Causal-role account: function = the contribution a trait makes to
  a system''s capacity (e.g., Cummins functions). Disagreements:

  - A trait can have a causal role now but no evolutionary history (e.g., a spandrel,
  or a newly co-opted trait). Causal role: function; etiological: no function (or
  not its function).

  - A trait can have an etiological function but be currently non-functional or absent
  (e.g., vestigial). Etiological: it has function F even if it doesn''t do it; causal
  role: no function or malfunction.

  - A trait can be selected for effect A but currently does B; causal-role says function
  is B, etiological says A.

  - A trait can be selected for A, currently does A, but A is not a contribution to
  fitness? Hmm.


