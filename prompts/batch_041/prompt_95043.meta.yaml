  Core ideas to state in the prompt (paraphrased, no quotes):

  - SSA: reason as if your indexical position — which observer you are — were randomly
  selected from some reference class of observers. (Or "as if you were a random observer
  among all observers.")

  - SIA: when comparing hypotheses about the world, weight a hypothesis by the number
  of observers it implies; the more observers, the more likely, so your existence
  gives evidence for a larger world.

  - Presumptuous philosopher: a philosopher claims the universe is far larger than
  cosmologists think, on the grounds that a larger universe contains more observers,
  and hence is more likely given that you exist — even if the smaller-universe theory''s
  physical evidence is vastly better. He''s called presumptuous because he thinks
  he can settle a cosmological question from his armchair.


