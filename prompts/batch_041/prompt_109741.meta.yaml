  "Most arguments about capital punishment begin with a question of justification:
  is death ever a proportionate response to murder? The retributivist says yes, at
  least sometimes, because certain crimes deserve the severest penalty. The consequentialist
  says the answer depends on whether executions deter, incapacitate, or express social
  condemnation without producing worse effects. Both positions have well-known difficulties.
  Retributivism can seem to license cruelty if desert is taken as a sufficient warrant.
  Consequentialism can seem to permit using persons as means if the empirical ledger
  is favorable. But the debate is further confused, I want to argue, by a failure
  to distinguish desert from warrant.


  Desert is a claim about what a person has made himself liable to. Warrant is a claim
  about what the community may actually do, given what it knows, what it can reliably
  control, and what it can undo. A person may deserve death and yet the community
  may lack warrant to kill him. This is not because his desert is uncertain in the
  ordinary sense; it is because the community''s knowledge of his desert is mediated
  by institutions that are known to err. The distinction matters because retributivists
  often treat the first claim as if it entailed the second. If someone deserves X,
  they reason, then the state is permitted to impose X. But that inference is only
  valid if the state''s epistemic and institutional position is good enough to identify
  the deserving and to impose X without unacceptable collateral damage.


  The risk of executing the innocent is usually treated as a consequentialist objection:
  executions produce the bad effect of killing someone who does not deserve it, and
  that bad effect may outweigh the good effects. I think this framing is too thin.
  The deeper problem is that execution is not simply a very severe punishment; it
  is a punishment that destroys the possibility of repair. I call this the irreversibility
  asymmetry. A prison sentence can be ended, compensated, apologized for; an execution
  cannot. This changes the structure of the justification. It is not that the stakes
  are higher, though they are. It is that the state''s own fallibility becomes part
  of the punishment''s meaning. When the state kills a person it has wrongly convicted,
  the killing is not merely an error that happens alongside the punishment; it is
  the punishment itself, now revealed as unjust.


