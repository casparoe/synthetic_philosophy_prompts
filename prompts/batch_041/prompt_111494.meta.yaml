  "I am a novelist, currently at work on a book set in the thirteenth century, and
  I have spent the last several months reading a medieval theologian on the question
  of whether a tyrant may be killed. What I have found there is a shape I have not
  been able to put a name to, and I have come to suspect that the absence of a name
  is itself the interesting fact.


  Here is the shape. The text concedes, in principle, that a tyrant may be removed
  — it does not say that the people must endure him to the end. But it then assigns
  the doing to those who hold public authority, or to God; and since the man in question
  is the public authority, and God''s interventions are not a course of action anyone
  can take, the concession does not reach the hand of any possible agent. It is granted
  and withdrawn in the same gesture. Yet the writer does not present it as a prohibition;
  he is emphatic that it is not a prohibition. The permission is real, and there is
  no one who may use it.


  What interests me is not the hypocrisy question — I don''t think it is hypocrisy;
  the writers seem to mean it — but the structure. A rule that survives as a permission
  while being unusable as one; a right whose only possible bearer is a collectivity
  that cannot act, or an agent that does not exist; a concession whose function seems
  to be to keep the concession visible while the prohibition does the work. I have
  seen something like it since in other places: in the modern talk of a people''s
  right to overthrow a government that no court will ever entertain; in the legal
  maxim that a right without a remedy is no right; in the way a contract may contain
  a clause that is generous on its face and dead in its operation.


