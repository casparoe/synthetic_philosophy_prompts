  Here is the puzzle, in a form I''ve stripped of the usual jargon.


  We say a thing has a disposition when it would behave a certain way under certain
  conditions: a tumbler is breakable because it would break if dropped; a fuse is
  live because it would carry current if touched by a conductor; a person is loyal
  because she would stand by a friend under pressure. Three ways this ordinary way
  of speaking can come apart from the facts:


  1. The condition that would trigger the behaviour also destroys the disposition
  before the behaviour can occur. The fuse is live, but the instant a conductor touches
  it a relay trips and it goes dead — so it never lights. Nothing about the fuse changed
  beforehand; the disposition is genuine; it is undone by the very thing that would
  have revealed it.

  2. The disposition survives, but something else blocks the behaviour. The tumbler
  is still breakable, but it is packed in foam, so dropping it does nothing. Take
  away the foam and it breaks.

  3. The behaviour occurs without the disposition. The tumbler is made of tough plastic,
  but a small charge embedded in its base detonates when it hits the floor and it
  flies apart. It never breaks "because it is breakable".


  ... and in each case the plain conditional — "it would break if dropped" — comes
  out false even though we want to say something different about each object. The
  puzzle is what we should say, and why the three cases feel different.


