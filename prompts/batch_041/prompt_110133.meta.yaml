  I am a graduate student in political philosophy, currently writing a seminar paper
  on the ethics of markets, and I would like you to act as a demanding but constructive
  referee — someone who works on commodification and the ethics of exchange and who
  is willing to tell me that a distinction I have drawn is either empty or already
  in the literature. I will give you the argument of my paper in outline, and I want
  you to comment on it in three registers: first, accuracy (have I described the standard
  positions and the real-world cases correctly, and is my account genuinely distinct
  from the better-known ones, or is it a relabeling?); second, interest (is the central
  thesis doing any work, or is it a redescription of the obvious?); and third, a specific
  structural question I flag below. Do not give me a neutral survey of possible views
  — take a position on whether the paper''s central claim survives, and say why. Please
  begin by brainstorming the strongest two or three objections you can see before
  you commit to a verdict.


  The paper: [essay]


  Essay: The literature on repugnant markets tends to treat the objection to a market
  in a good as an objection to the good itself — to its meaning, its value, its proper
  sphere. My claim is that this mislocates the objection in a large class of cases.
  What people find repugnant is not the presence of money around G but a relational
  property of the transaction: that the price is a function of one party''s lack of
  acceptable alternatives. Call this the Dependency-Rent Account. On this account,
  a market is objectionable to the degree that the gain one party takes from the exchange
  is generated by the other party''s desperation — the closer the seller is to having
  no alternative but to sell, the more of the surplus the buyer can capture, and the
  more the exchange looks like extraction rather than trade. Three consequences follow.
  (1) The account predicts that repugnance should be sensitive to market structure
  rather than to the good: a public monopsony that buys at a fixed, publicly financed
  price, allocates the burden by lottery, and decouples any individual''s payment
  from her own desperation, should be substantially less repugnant than a free market
  in the same good, even though the good and the transfer are identical. (2) It predicts
  that the direction of desperation does not matter: price gouging for ice, water,
  or a lifesaving drug after a disaster is objectionable for the same reason as kidney
  sales, even though in the first case the desperate party buys and in the second
  she sells. (3) It explains why the objection is often weaker when the payment is
  framed as compensation or insurance rather than as a price — compensation is indexed
  to the burden borne, a price is indexed to the buyer''s willingness to pay.


  The account then runs into vote selling, and I cannot decide whether this is a refutation
  or a boundary. The vote seller is not desperate in the relevant sense; her alternative
  to selling her vote is simply keeping it. Yet selling votes is, if anything, more
  repugnant than selling kidneys. So I have added a second and apparently independent
  clause: some goods are attached to roles rather than owned by persons, and roles
  carry a constitutive non-transferability condition, so that alienating the good
  is not merely imprudent or degrading but destroys the very thing that made the good
  worth having. Voting is like this; so, arguably, is jury service and the exercise
